# =============================================================================
# Jewelry Store & Custom/Repair — PRD Benchmark Seed Tables (SCAFFOLD.yaml)
# Difficulty tier: EXPERT (§0.4)
#
# Topology note: flat top-level collections linked by foreign keys. api_prefix is
# intentionally the empty root "" so every collection (/customers, /inventory-items,
# /custom-orders, /repair-tickets, /layaway-plans, /trade-ins, /special-orders,
# /payments, /appraisals, /warranty-claims, /credit-ledger) sits directly under root.
# =============================================================================

scenario: |
  Jewelry Store & Custom/Repair: inventory & appraisal, custom-design order & deposit,
  repair ticket & turnaround, layaway/financing, trade-in/buyback, warranty & resizing,
  insurance-appraisal document, special order

domain_name: jewelry-store-custom-repair
api_prefix: ""

# =============================================================================
# Complexity Profile (§0.1–§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  state_machine_shape: cyclic            # CustomDesignOrder revision loop; RepairTicket fork-join
  relationship_patterns:
    - one_to_many                        # Customer -> orders/tickets/plans/trade-ins
    - cross_aggregate                    # Payment references multiple parent aggregates by typed FK; CreditLedgerEntry references Customer
    - polymorphic                        # Payment.target_type discriminates which FK is populated
  role_model: peer_roles                 # SalesAssociate / Goldsmith / StoreManager + Customer
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: full_name, type: string, source: input, description: "Customer legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across Customers" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: store_credit_balance_cents, type: integer, source: computed, description: "Derived ledger balance = sum(CreditLedgerEntry CREDIT) - sum(CreditLedgerEntry DEBIT) for this customer; starts 0; recomputed on every ledger write. See calc store_credit_balance" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED. Starts ACTIVE.", constraints: "ACTIVE,SUSPENDED" }

  - name: InventoryItem
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: sku, type: string, source: input, description: "Stock keeping unit; unique across InventoryItems" }
      - { name: title, type: string, source: input, description: "Display name (e.g., 'Solitaire Ring 1ct')" }
      - { name: metal_karat, type: enum, source: input, description: "Metal purity for valuation", constraints: "K14,K18,K24" }
      - { name: list_price_cents, type: integer, source: input, description: "Retail price in cents; must be > 0" }
      - { name: latest_appraised_value_cents, type: integer, source: computed, description: "Replacement value from the most recent FINALIZED Appraisal on this item (created_at DESC, first); null until an appraisal is finalized. See calc insurance_replacement_value" }
      - { name: status, type: enum, source: system, description: "Availability lifecycle. Starts IN_STOCK.", constraints: "IN_STOCK,RESERVED,SOLD,IN_REPAIR" }

  - name: Workbench
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: label, type: string, source: input, description: "Bench label (e.g., 'Bench 1'); unique across Workbenches" }
      - { name: status, type: enum, source: system, description: "Workbench availability; always ACTIVE on creation (no retire flow in this version).", constraints: "ACTIVE" }

  - name: Appraisal
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: inventory_item_id, type: string, source: input, description: "FK -> InventoryItem.id; the appraised piece" }
      - { name: appraiser_name, type: string, source: input, description: "Name of certifying appraiser; also the resource key for appointment-slot overlap detection" }
      - { name: appointment_start, type: datetime, source: input, description: "Appraisal appointment start (ISO 8601 UTC)" }
      - { name: appointment_end, type: datetime, source: input, description: "Appraisal appointment end (ISO 8601 UTC); must be > appointment_start" }
      - { name: market_value_cents, type: integer, source: input, description: "Assessed fair-market value in cents; must be > 0" }
      - { name: replacement_factor, type: number, source: input, description: "Multiplier applied to market value to derive insurance replacement value; range 1.00..2.00", default: 1.30 }
      - { name: replacement_value_cents, type: integer, source: computed, description: "round_half_up(market_value_cents * replacement_factor). See calc insurance_replacement_value" }
      - { name: document_number, type: string, source: computed, description: "Insurance-appraisal document identifier, assigned only on FINALIZE; format 'APR-' + zero-padded sequential per store; null while DRAFT" }
      - { name: status, type: enum, source: system, description: "Appraisal document lifecycle. Starts DRAFT.", constraints: "DRAFT,FINALIZED,VOID" }

  - name: CustomDesignOrder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the ordering customer" }
      - { name: description, type: string, source: input, description: "Free-text design brief" }
      - { name: estimated_materials_cents, type: integer, source: input, description: "Estimated materials cost used for the provisional quote; must be > 0" }
      - { name: design_fee_cents, type: integer, source: input, description: "Flat non-refundable design fee in cents; must be >= 0" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Provisional quote = round_half_up(estimated_materials_cents * (1+PROVISIONAL_MARKUP)) + design_fee_cents. See calc custom_order_totals" }
      - { name: deposit_required_cents, type: integer, source: computed, description: "round_half_up(DEPOSIT_PCT * provisional_total_cents); set at QUOTED" }
      - { name: deposit_paid_cents, type: integer, source: computed, description: "Sum of SUCCEEDED Payments with target_type=CUSTOM_ORDER for this order; starts 0" }
      - { name: final_total_cents, type: integer, source: computed, description: "Final actual total = sum over line_items of round_half_up(qty*unit_price_cents*(1+markup_pct)) THEN + design_fee_cents; set at PRODUCTION completion. See calc custom_order_totals" }
      - { name: balance_due_cents, type: integer, source: computed, description: "While pre-production: provisional_total_cents - deposit_paid_cents. After PRODUCTION done: final_total_cents - deposit_paid_cents. See calc custom_order_totals" }
      - { name: line_items, type: array, source: input, description: "Array of {qty:int, unit_price_cents:int, markup_pct:number}; supplied at APPROVE_DESIGN; drives final_total_cents" }
      - { name: revision_count, type: integer, source: computed, description: "Number of times the order has looped DESIGN_REVIEW -> IN_DESIGN; starts 0" }
      - { name: status, type: enum, source: system, description: "Custom-design lifecycle (cyclic). Starts DRAFT.", constraints: "DRAFT,QUOTED,DEPOSIT_PAID,IN_DESIGN,DESIGN_REVIEW,APPROVED,IN_PRODUCTION,READY,COMPLETED,CANCELLED" }

  - name: RepairTicket
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the customer dropping off the piece" }
      - { name: inventory_item_id, type: string, source: input, description: "FK -> InventoryItem.id; the store-owned piece under repair (resizing/warranty work); null for customer-owned pieces" }
      - { name: repair_kind, type: enum, source: input, description: "Category of work", constraints: "RESIZE,STONE_RESET,POLISH,CLASP_REPAIR,WARRANTY" }
      - { name: parts_cents, type: integer, source: computed, description: "Parts cost assessed at ASSESSED; 0 for WARRANTY tickets; must be >= 0" }
      - { name: labor_cents, type: integer, source: computed, description: "Labor cost assessed at ASSESSED; 0 for WARRANTY tickets; must be >= 0" }
      - { name: rush, type: boolean, source: input, description: "Whether rush turnaround was requested", default: false }
      - { name: rush_surcharge_cents, type: integer, source: computed, description: "Surcharge from rush tier of (parts+labor); 0 when rush=false or WARRANTY. See calc repair_total" }
      - { name: total_cents, type: integer, source: computed, description: "parts_cents + labor_cents + rush_surcharge_cents; 0 for WARRANTY. See calc repair_total" }
      - { name: promised_at, type: datetime, source: input, description: "Promised turnaround completion timestamp (ISO 8601 UTC)" }
      - { name: bench_id, type: string, source: input, description: "FK -> Workbench.id; the bench this ticket is scheduled on; null until scheduled" }
      - { name: scheduled_start, type: datetime, source: input, description: "Bench reservation start (ISO 8601 UTC); set on schedule; null until scheduled" }
      - { name: scheduled_end, type: datetime, source: input, description: "Bench reservation end (ISO 8601 UTC), exclusive; must be > scheduled_start; null until scheduled" }
      - { name: warranty_claim_id, type: string, source: computed, description: "FK -> WarrantyClaim.id; set when this WARRANTY ticket was spawned from an approved claim; null otherwise" }
      - { name: status, type: enum, source: system, description: "Repair lifecycle (fork-join). Starts INTAKE.", constraints: "INTAKE,ASSESSED,AWAITING_PARTS,IN_REPAIR,QC,READY,PICKED_UP,CANCELLED" }

  - name: LayawayPlan
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the layaway holder" }
      - { name: inventory_item_id, type: string, source: input, description: "FK -> InventoryItem.id; the reserved piece" }
      - { name: item_price_cents, type: integer, source: computed, description: "Snapshot of InventoryItem.list_price_cents at plan creation; must be > 0" }
      - { name: down_payment_cents, type: integer, source: computed, description: "round_half_up(DOWN_PAYMENT_PCT * item_price_cents); collected at ACTIVATE" }
      - { name: installment_count, type: integer, source: input, description: "Number of installments after down payment; integer 2..24" }
      - { name: installment_amount_cents, type: integer, source: computed, description: "floor((item_price_cents - down_payment_cents)/installment_count); final installment absorbs remainder. See calc layaway_schedule" }
      - { name: paid_to_date_cents, type: integer, source: computed, description: "down_payment + sum of SUCCEEDED Payments target_type=LAYAWAY for this plan; starts 0" }
      - { name: projected_payoff_cents, type: integer, source: computed, description: "Provisional: item_price_cents assuming all installments paid on schedule (no fees). See calc layaway_schedule" }
      - { name: settlement_refund_cents, type: integer, source: computed, description: "Final at cancellation: max(0, paid_to_date_cents - restocking_fee_cents). See calc layaway_schedule" }
      - { name: restocking_fee_cents, type: integer, source: computed, description: "min(MAX_RESTOCK_CENTS, round_half_up(RESTOCK_PCT * item_price_cents)); applied only on CANCEL" }
      - { name: status, type: enum, source: system, description: "Layaway lifecycle. Starts PENDING.", constraints: "PENDING,ACTIVE,PAID_IN_FULL,FULFILLED,CANCELLED" }

  - name: TradeInOffer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the seller" }
      - { name: metal_karat, type: enum, source: input, description: "Karat of the metal being traded in", constraints: "K14,K18,K24" }
      - { name: metal_weight_grams, type: number, source: input, description: "Metal weight in grams; must be > 0" }
      - { name: metal_spot_price_cents_per_gram, type: integer, source: input, description: "Spot price snapshot in cents per gram at offer creation; must be > 0" }
      - { name: gemstone_value_cents, type: integer, source: input, description: "Independently assessed gemstone value in cents; must be >= 0", default: 0 }
      - { name: condition, type: enum, source: input, description: "Physical condition grade", constraints: "EXCELLENT,GOOD,FAIR" }
      - { name: metal_value_cents, type: integer, source: computed, description: "round_half_up(metal_weight_grams * metal_spot_price_cents_per_gram * PURITY_FACTOR[metal_karat]). See calc trade_in_credit" }
      - { name: buyback_credit_cents, type: integer, source: computed, description: "min(MAX_BUYBACK_CENTS, max(MIN_BUYBACK_CENTS, round_half_up((metal_value_cents + gemstone_value_cents) * CONDITION_FACTOR[condition]))). See calc trade_in_credit" }
      - { name: credit_ledger_entry_id, type: string, source: computed, description: "FK -> CreditLedgerEntry.id; set when offer ACCEPTED and credit posted; null otherwise" }
      - { name: status, type: enum, source: system, description: "Trade-in lifecycle. Starts OFFERED.", constraints: "OFFERED,ACCEPTED,DECLINED" }

  - name: SpecialOrder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the requesting customer" }
      - { name: vendor_name, type: string, source: input, description: "Supplier the piece is special-ordered from" }
      - { name: catalog_ref, type: string, source: input, description: "Vendor catalog reference" }
      - { name: quoted_price_cents, type: integer, source: input, description: "Vendor quoted price in cents; must be > 0" }
      - { name: deposit_required_cents, type: integer, source: computed, description: "round_half_up(SPECIAL_ORDER_DEPOSIT_PCT * quoted_price_cents); set at PLACED" }
      - { name: deposit_paid_cents, type: integer, source: computed, description: "Sum of SUCCEEDED Payments target_type=SPECIAL_ORDER for this order; starts 0" }
      - { name: received_inventory_item_id, type: string, source: computed, description: "FK -> InventoryItem.id; the InventoryItem created when the piece arrives; null until ARRIVED" }
      - { name: status, type: enum, source: system, description: "Special-order lifecycle. Starts REQUESTED.", constraints: "REQUESTED,PLACED,ARRIVED,DELIVERED,CANCELLED" }

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: target_type, type: enum, source: input, description: "Which aggregate this payment applies to (polymorphic discriminator)", constraints: "CUSTOM_ORDER,LAYAWAY,SPECIAL_ORDER" }
      - { name: custom_order_id, type: string, source: input, description: "FK -> CustomDesignOrder.id; required when target_type=CUSTOM_ORDER, else null" }
      - { name: layaway_plan_id, type: string, source: input, description: "FK -> LayawayPlan.id; required when target_type=LAYAWAY, else null" }
      - { name: special_order_id, type: string, source: input, description: "FK -> SpecialOrder.id; required when target_type=SPECIAL_ORDER, else null" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents; must be > 0" }
      - { name: outcome, type: enum, source: system, description: "Payment outcome; set SUCCEEDED on accept. Append-only (no version).", constraints: "SUCCEEDED" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: inventory_item_id, type: string, source: input, description: "FK -> InventoryItem.id; the covered piece" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the claimant" }
      - { name: defect_description, type: string, source: input, description: "Reported defect" }
      - { name: spawned_repair_ticket_id, type: string, source: computed, description: "FK -> RepairTicket.id; the WARRANTY RepairTicket created on APPROVE; null otherwise" }
      - { name: status, type: enum, source: system, description: "Warranty claim lifecycle (branching). Starts SUBMITTED.", constraints: "SUBMITTED,APPROVED,REJECTED,RESOLVED" }

  - name: CreditLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; whose balance this entry moves" }
      - { name: direction, type: enum, source: input, description: "CREDIT increases store credit; DEBIT decreases it", constraints: "CREDIT,DEBIT" }
      - { name: amount_cents, type: integer, source: input, description: "Absolute movement in cents; must be > 0" }
      - { name: reason, type: enum, source: input, description: "Source of the movement", constraints: "TRADE_IN,LAYAWAY_REFUND,PURCHASE,MANUAL_ADJUSTMENT" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------- Appraisal
  - entity: Appraisal
    field: status
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /appraisals/{id}/finalize"
        actor: StoreManager
        preconditions:
          - "Appraisal.status == DRAFT (else ERR_INVALID_STATE)"
          - "Referenced InventoryItem.status != SOLD (else ERR_ITEM_SOLD)"
        side_effects:
          - "Assign document_number = 'APR-' + next zero-padded store sequence"
          - "Recompute InventoryItem.latest_appraised_value_cents from most recent FINALIZED appraisal (this one) [calc insurance_replacement_value]"
          - "increments Appraisal.version by 1"
      - from: [DRAFT, FINALIZED]
        to: VOID
        trigger: "POST /appraisals/{id}/void"
        actor: StoreManager
        preconditions:
          - "Appraisal.status in {DRAFT, FINALIZED} (else ERR_INVALID_STATE)"
        side_effects:
          - "If this was the InventoryItem's latest FINALIZED appraisal, recompute InventoryItem.latest_appraised_value_cents from the next most recent FINALIZED appraisal, else null [calc insurance_replacement_value]"
          - "increments Appraisal.version by 1"

  # --------------------------------------------------- CustomDesignOrder (cyclic)
  - entity: CustomDesignOrder
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /custom-orders/{id}/quote"
        actor: SalesAssociate
        preconditions:
          - "CustomDesignOrder.status == DRAFT (else ERR_INVALID_STATE)"
        side_effects:
          - "Compute provisional_total_cents and deposit_required_cents [calc custom_order_totals]"
          - "Set balance_due_cents = provisional_total_cents - deposit_paid_cents"
          - "increments CustomDesignOrder.version by 1"
      - from: QUOTED
        to: DEPOSIT_PAID
        trigger: "system (a SUCCEEDED Payment target_type=CUSTOM_ORDER brings deposit_paid_cents >= deposit_required_cents)"
        actor: system
        preconditions:
          - "deposit_paid_cents >= deposit_required_cents"
        side_effects:
          - "Recompute deposit_paid_cents and balance_due_cents [calc custom_order_totals]"
      - from: DEPOSIT_PAID
        to: IN_DESIGN
        trigger: "POST /custom-orders/{id}/start-design"
        actor: Goldsmith
        preconditions:
          - "CustomDesignOrder.status == DEPOSIT_PAID (else ERR_INVALID_STATE)"
        side_effects:
          - "increments CustomDesignOrder.version by 1"
      - from: IN_DESIGN
        to: DESIGN_REVIEW
        trigger: "POST /custom-orders/{id}/submit-review"
        actor: Goldsmith
        preconditions:
          - "CustomDesignOrder.status == IN_DESIGN (else ERR_INVALID_STATE)"
        side_effects:
          - "increments CustomDesignOrder.version by 1"
      - from: DESIGN_REVIEW
        to: IN_DESIGN
        trigger: "POST /custom-orders/{id}/request-revision"
        actor: SalesAssociate
        preconditions:
          - "CustomDesignOrder.status == DESIGN_REVIEW (else ERR_INVALID_STATE)"
          - "revision_count < MAX_REVISIONS where MAX_REVISIONS = 3 (else ERR_MAX_REVISIONS_REACHED)"
        side_effects:
          - "revision_count += 1 (cyclic revision loop)"
          - "increments CustomDesignOrder.version by 1"
        note: "Cycle: DESIGN_REVIEW -> IN_DESIGN -> DESIGN_REVIEW. revision_count bounds the loop. MAX_REVISIONS = 3 (the 4th request-revision, when revision_count == 3, is rejected)."
      - from: DESIGN_REVIEW
        to: APPROVED
        trigger: "POST /custom-orders/{id}/approve-design"
        actor: SalesAssociate
        preconditions:
          - "CustomDesignOrder.status == DESIGN_REVIEW (else ERR_INVALID_STATE)"
          - "line_items non-empty in request (else ERR_LINE_ITEMS_REQUIRED)"
        side_effects:
          - "Persist line_items"
          - "increments CustomDesignOrder.version by 1"
      - from: APPROVED
        to: IN_PRODUCTION
        trigger: "POST /custom-orders/{id}/start-production"
        actor: Goldsmith
        preconditions:
          - "CustomDesignOrder.status == APPROVED (else ERR_INVALID_STATE)"
        side_effects:
          - "increments CustomDesignOrder.version by 1"
      - from: IN_PRODUCTION
        to: READY
        trigger: "POST /custom-orders/{id}/complete-production"
        actor: Goldsmith
        preconditions:
          - "CustomDesignOrder.status == IN_PRODUCTION (else ERR_INVALID_STATE)"
        side_effects:
          - "Compute final_total_cents from line_items (round per line then sum) + design_fee_cents [calc custom_order_totals]"
          - "Recompute balance_due_cents = final_total_cents - deposit_paid_cents [calc custom_order_totals]"
          - "increments CustomDesignOrder.version by 1"
      - from: READY
        to: COMPLETED
        trigger: "POST /custom-orders/{id}/complete"
        actor: SalesAssociate
        preconditions:
          - "CustomDesignOrder.status == READY (else ERR_INVALID_STATE)"
          - "balance_due_cents <= 0 (else ERR_BALANCE_OUTSTANDING)"
        side_effects:
          - "increments CustomDesignOrder.version by 1"
      - from: [DRAFT, QUOTED, DEPOSIT_PAID, IN_DESIGN, DESIGN_REVIEW, APPROVED]
        to: CANCELLED
        trigger: "POST /custom-orders/{id}/cancel"
        actor: StoreManager
        preconditions:
          - "CustomDesignOrder.status not in {IN_PRODUCTION, READY, COMPLETED, CANCELLED} (else ERR_INVALID_STATE)"
        side_effects:
          - "If deposit_paid_cents > 0: post CreditLedgerEntry CREDIT amount=deposit_paid_cents reason=LAYAWAY_REFUND for customer (deposit refunded to store credit); recompute Customer.store_credit_balance_cents [cascade -> calc store_credit_balance]"
          - "increments CustomDesignOrder.version by 1"
        note: "Design fee is non-refundable conceptually but deposit_paid (which may include it) is refunded to store credit per product policy."

  # ----------------------------------------------------- RepairTicket (fork-join)
  - entity: RepairTicket
    field: status
    initial_state: INTAKE
    terminal_states: [PICKED_UP, CANCELLED]
    transitions:
      - from: INTAKE
        to: ASSESSED
        trigger: "POST /repair-tickets/{id}/assess"
        actor: Goldsmith
        preconditions:
          - "RepairTicket.status == INTAKE (else ERR_INVALID_STATE)"
        side_effects:
          - "Set parts_cents, labor_cents from request (0/0 forced for WARRANTY)"
          - "Compute rush_surcharge_cents and total_cents [calc repair_total]"
          - "If inventory_item_id set: InventoryItem.status -> IN_REPAIR (cross-entity)"
          - "increments RepairTicket.version by 1"
      - from: ASSESSED
        to: AWAITING_PARTS
        trigger: "POST /repair-tickets/{id}/order-parts"
        actor: Goldsmith
        preconditions:
          - "RepairTicket.status == ASSESSED (else ERR_INVALID_STATE)"
          - "parts_cents > 0 (else ERR_NO_PARTS_NEEDED)"
        side_effects:
          - "increments RepairTicket.version by 1"
        note: "Fork branch A: tickets needing parts route through AWAITING_PARTS."
      - from: AWAITING_PARTS
        to: IN_REPAIR
        trigger: "POST /repair-tickets/{id}/parts-received"
        actor: Goldsmith
        preconditions:
          - "RepairTicket.status == AWAITING_PARTS (else ERR_INVALID_STATE)"
        side_effects:
          - "increments RepairTicket.version by 1"
      - from: ASSESSED
        to: IN_REPAIR
        trigger: "POST /repair-tickets/{id}/start-repair"
        actor: Goldsmith
        preconditions:
          - "RepairTicket.status == ASSESSED (else ERR_INVALID_STATE)"
        side_effects:
          - "increments RepairTicket.version by 1"
        note: "Fork branch B: tickets needing no parts skip AWAITING_PARTS. Both branches join at IN_REPAIR -> QC."
      - from: IN_REPAIR
        to: QC
        trigger: "POST /repair-tickets/{id}/submit-qc"
        actor: Goldsmith
        preconditions:
          - "RepairTicket.status == IN_REPAIR (else ERR_INVALID_STATE)"
        side_effects:
          - "increments RepairTicket.version by 1"
      - from: QC
        to: READY
        trigger: "POST /repair-tickets/{id}/pass-qc"
        actor: StoreManager
        preconditions:
          - "RepairTicket.status == QC (else ERR_INVALID_STATE)"
        side_effects:
          - "increments RepairTicket.version by 1"
      - from: QC
        to: IN_REPAIR
        trigger: "POST /repair-tickets/{id}/fail-qc"
        actor: StoreManager
        preconditions:
          - "RepairTicket.status == QC (else ERR_INVALID_STATE)"
        side_effects:
          - "increments RepairTicket.version by 1"
        note: "QC failure loops back into IN_REPAIR (rework)."
      - from: READY
        to: PICKED_UP
        trigger: "POST /repair-tickets/{id}/pickup"
        actor: SalesAssociate
        preconditions:
          - "RepairTicket.status == READY (else ERR_INVALID_STATE)"
        side_effects:
          - "If inventory_item_id set: InventoryItem.status -> IN_STOCK (cross-entity restore)"
          - "If warranty_claim_id set: WarrantyClaim.status -> RESOLVED (bubble-up cascade)"
          - "increments RepairTicket.version by 1"
      - from: [INTAKE, ASSESSED, AWAITING_PARTS, IN_REPAIR, QC]
        to: CANCELLED
        trigger: "POST /repair-tickets/{id}/cancel"
        actor: StoreManager
        preconditions:
          - "RepairTicket.status not in {READY, PICKED_UP, CANCELLED} (else ERR_INVALID_STATE)"
        side_effects:
          - "If inventory_item_id set: InventoryItem.status -> IN_STOCK (cross-entity restore)"
          - "If warranty_claim_id set: WarrantyClaim.status -> REJECTED (bubble-up cascade)"
          - "increments RepairTicket.version by 1"

  # ------------------------------------------------------------- LayawayPlan
  - entity: LayawayPlan
    field: status
    initial_state: PENDING
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /layaway-plans/{id}/activate"
        actor: SalesAssociate
        preconditions:
          - "LayawayPlan.status == PENDING (else ERR_INVALID_STATE)"
          - "InventoryItem.status == IN_STOCK (else ERR_ITEM_NOT_AVAILABLE)"
        side_effects:
          - "Snapshot item_price_cents from InventoryItem.list_price_cents"
          - "Compute down_payment_cents, installment_amount_cents, projected_payoff_cents [calc layaway_schedule]"
          - "Set paid_to_date_cents = down_payment_cents"
          - "InventoryItem.status -> RESERVED (cross-entity)"
          - "increments LayawayPlan.version by 1"
      - from: ACTIVE
        to: PAID_IN_FULL
        trigger: "system (a SUCCEEDED Payment target_type=LAYAWAY brings paid_to_date_cents >= item_price_cents)"
        actor: system
        preconditions:
          - "paid_to_date_cents >= item_price_cents"
        side_effects:
          - "Recompute paid_to_date_cents [calc layaway_schedule]"
      - from: PAID_IN_FULL
        to: FULFILLED
        trigger: "POST /layaway-plans/{id}/fulfill"
        actor: SalesAssociate
        preconditions:
          - "LayawayPlan.status == PAID_IN_FULL (else ERR_INVALID_STATE)"
        side_effects:
          - "InventoryItem.status -> SOLD (cross-entity)"
          - "increments LayawayPlan.version by 1"
      - from: [PENDING, ACTIVE]
        to: CANCELLED
        trigger: "POST /layaway-plans/{id}/cancel"
        actor: StoreManager
        preconditions:
          - "LayawayPlan.status in {PENDING, ACTIVE} (else ERR_INVALID_STATE)"
        side_effects:
          - "Compute restocking_fee_cents and settlement_refund_cents [calc layaway_schedule]"
          - "If status was ACTIVE: InventoryItem.status -> IN_STOCK (cross-entity restore)"
          - "If settlement_refund_cents > 0: post CreditLedgerEntry CREDIT amount=settlement_refund_cents reason=LAYAWAY_REFUND for customer; recompute Customer.store_credit_balance_cents [cascade -> calc store_credit_balance]"
          - "increments LayawayPlan.version by 1"

  # ------------------------------------------------------------- TradeInOffer
  - entity: TradeInOffer
    field: status
    initial_state: OFFERED
    terminal_states: [ACCEPTED, DECLINED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /trade-ins/{id}/accept"
        actor: StoreManager
        preconditions:
          - "TradeInOffer.status == OFFERED (else ERR_INVALID_STATE)"
          - "Customer.status == ACTIVE (else ERR_CUSTOMER_SUSPENDED)"
        side_effects:
          - "Post CreditLedgerEntry CREDIT amount=buyback_credit_cents reason=TRADE_IN for customer; set credit_ledger_entry_id"
          - "Recompute Customer.store_credit_balance_cents [cascade -> calc store_credit_balance]"
          - "increments TradeInOffer.version by 1"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /trade-ins/{id}/decline"
        actor: StoreManager
        preconditions:
          - "TradeInOffer.status == OFFERED (else ERR_INVALID_STATE)"
        side_effects:
          - "increments TradeInOffer.version by 1"

  # ------------------------------------------------------------- SpecialOrder
  - entity: SpecialOrder
    field: status
    initial_state: REQUESTED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: PLACED
        trigger: "POST /special-orders/{id}/place"
        actor: SalesAssociate
        preconditions:
          - "SpecialOrder.status == REQUESTED (else ERR_INVALID_STATE)"
          - "deposit_paid_cents >= deposit_required_cents (else ERR_DEPOSIT_REQUIRED)"
        side_effects:
          - "increments SpecialOrder.version by 1"
      - from: PLACED
        to: ARRIVED
        trigger: "POST /special-orders/{id}/receive"
        actor: SalesAssociate
        preconditions:
          - "SpecialOrder.status == PLACED (else ERR_INVALID_STATE)"
        side_effects:
          - "Create InventoryItem (status=RESERVED, list_price_cents=quoted_price_cents, sku from request, title from catalog_ref, metal_karat from request); set received_inventory_item_id"
          - "increments SpecialOrder.version by 1"
      - from: ARRIVED
        to: DELIVERED
        trigger: "POST /special-orders/{id}/deliver"
        actor: SalesAssociate
        preconditions:
          - "SpecialOrder.status == ARRIVED (else ERR_INVALID_STATE)"
        side_effects:
          - "received InventoryItem.status -> SOLD (cross-entity)"
          - "increments SpecialOrder.version by 1"
      - from: [REQUESTED, PLACED]
        to: CANCELLED
        trigger: "POST /special-orders/{id}/cancel"
        actor: StoreManager
        preconditions:
          - "SpecialOrder.status in {REQUESTED, PLACED} (else ERR_INVALID_STATE)"
        side_effects:
          - "If deposit_paid_cents > 0: post CreditLedgerEntry CREDIT amount=deposit_paid_cents reason=LAYAWAY_REFUND for customer; recompute Customer.store_credit_balance_cents [cascade -> calc store_credit_balance]"
          - "increments SpecialOrder.version by 1"

  # ------------------------------------------------------- WarrantyClaim (branching)
  - entity: WarrantyClaim
    field: status
    initial_state: SUBMITTED
    terminal_states: [REJECTED, RESOLVED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /warranty-claims/{id}/approve"
        actor: StoreManager
        preconditions:
          - "WarrantyClaim.status == SUBMITTED (else ERR_INVALID_STATE)"
          - "InventoryItem has a FINALIZED Appraisal (warranty coverage proof) (else ERR_NO_COVERAGE)"
        side_effects:
          - "Create RepairTicket (repair_kind=WARRANTY, customer_id, inventory_item_id, parts_cents=0, labor_cents=0, rush=false, warranty_claim_id=this claim, status=INTAKE); set spawned_repair_ticket_id (cross-entity cascade)"
          - "increments WarrantyClaim.version by 1"
        note: "Branch fork: SUBMITTED -> {APPROVED spawning a repair, REJECTED} with divergent side-effect sets."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /warranty-claims/{id}/reject"
        actor: StoreManager
        preconditions:
          - "WarrantyClaim.status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects:
          - "increments WarrantyClaim.version by 1"
      - from: APPROVED
        to: RESOLVED
        trigger: "system (spawned RepairTicket reaches PICKED_UP)"
        actor: system
        preconditions:
          - "spawned RepairTicket.status == PICKED_UP"
        side_effects: []
        note: "Bubble-up from RepairTicket pickup."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: appraisal-finalize-stale-item
    parent_entity: InventoryItem
    write_endpoint: "POST /appraisals/{id}/finalize"
    occ_field: "expected_inventory_item_version"
    description: |
      Finalizing an Appraisal against an InventoryItem whose version has advanced
      since the client last observed it is rejected. A second writer may have just
      finalized a competing appraisal (which legitimately becomes the item's latest
      replacement value and bumps the item's version), so this writer's view of the
      item is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: layaway-activate-stale-item
    parent_entity: InventoryItem
    write_endpoint: "POST /layaway-plans/{id}/activate"
    occ_field: "expected_inventory_item_version"
    description: |
      Activating a LayawayPlan against an InventoryItem whose version has advanced
      since the client last observed it is rejected. Another writer may have just
      reserved or sold the same item (bumping its version) and this writer's reserve
      attempt is therefore based on a stale view of the item.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- Rule 1 A (dual-variant on CustomDesignOrder) + Rule 2 mode (b) ----
  - name: custom_order_totals
    trigger: "POST /custom-orders/{id}/quote (provisional); POST /custom-orders/{id}/complete-production (final)"
    algorithm: dual_variant
    formula: |
      # Provisional (computed at QUOTED):
      provisional_total_cents = round_half_up(estimated_materials_cents * (1 + PROVISIONAL_MARKUP)) + design_fee_cents
      deposit_required_cents  = round_half_up(DEPOSIT_PCT * provisional_total_cents)

      # Final (computed at complete-production) — ROUND PER LINE THEN SUM (pinned order):
      # for each line in line_items:
      #   line_total = round_half_up(line.qty * line.unit_price_cents * (1 + line.markup_pct))
      components_subtotal_cents = sum(line_total for each line)        # each line already rounded
      final_total_cents = components_subtotal_cents + design_fee_cents

      # Balance:
      #   pre-production status: balance_due_cents = provisional_total_cents - deposit_paid_cents
      #   post complete-production: balance_due_cents = final_total_cents - deposit_paid_cents
    input_set: "line_items array supplied at approve-design; deposit_paid_cents = sum of SUCCEEDED Payments target_type=CUSTOM_ORDER for this order"
    constants:
      PROVISIONAL_MARKUP: 0.20
      DEPOSIT_PCT: 0.30
    precision: "integer cents, round_half_up; rounding applied PER LINE before summation (NOT sum-then-round)"
    variants:
      - name: provisional
        when: "at QUOTED, before line_items exist"
        difference: "Single estimated-materials figure times PROVISIONAL_MARKUP plus design fee; coarse estimate"
      - name: final
        when: "at complete-production, line_items known"
        difference: "Per-line rounded actuals summed; can differ from provisional by hundreds of dollars and from a sum-then-round computation by 1 cent"

  # ---- Rule 1 B (dual-variant on LayawayPlan) ----
  - name: layaway_schedule
    trigger: "POST /layaway-plans/{id}/activate (schedule + projected_payoff); POST /layaway-plans/{id}/cancel (settlement_refund)"
    algorithm: dual_variant
    formula: |
      down_payment_cents       = round_half_up(DOWN_PAYMENT_PCT * item_price_cents)
      remaining_cents          = item_price_cents - down_payment_cents
      installment_amount_cents = floor(remaining_cents / installment_count)   # final installment absorbs remainder

      # Provisional (projected payoff, assumes full on-schedule completion, no fees):
      projected_payoff_cents   = item_price_cents

      # Final (settlement on cancel):
      restocking_fee_cents     = min(MAX_RESTOCK_CENTS, round_half_up(RESTOCK_PCT * item_price_cents))
      settlement_refund_cents  = max(0, paid_to_date_cents - restocking_fee_cents)
    input_set: "paid_to_date_cents = down_payment_cents + sum of SUCCEEDED Payments target_type=LAYAWAY for this plan"
    constants:
      DOWN_PAYMENT_PCT: 0.20
      RESTOCK_PCT: 0.15
      MAX_RESTOCK_CENTS: 50000
    precision: "integer cents; down_payment & restocking round_half_up; installment uses floor with remainder on final installment"
    variants:
      - name: projected_payoff
        when: "at ACTIVATE — what the customer will pay if they complete the plan"
        difference: "Equals item_price_cents (no fees)"
      - name: settlement_refund
        when: "at CANCEL — what the customer gets back"
        difference: "paid_to_date minus a capped restocking fee; never the same number as projected_payoff"

  # ---- Rule 2 mode (a): tiered/nested-min-max valuation on TradeInOffer ----
  - name: trade_in_credit
    trigger: "POST /trade-ins (on create); recomputed never (snapshot inputs)"
    algorithm: tiered_pricing
    formula: |
      metal_value_cents = round_half_up(metal_weight_grams * metal_spot_price_cents_per_gram * PURITY_FACTOR[metal_karat])
      raw_credit_cents  = round_half_up((metal_value_cents + gemstone_value_cents) * CONDITION_FACTOR[condition])
      buyback_credit_cents = min(MAX_BUYBACK_CENTS, max(MIN_BUYBACK_CENTS, raw_credit_cents))
    input_set: "all inputs are request-supplied snapshots at offer creation; no cross-entity inclusion set"
    constants:
      PURITY_FACTOR: { K14: 0.585, K18: 0.750, K24: 1.000 }
      CONDITION_FACTOR: { EXCELLENT: 0.90, GOOD: 0.75, FAIR: 0.55 }
      MIN_BUYBACK_CENTS: 2500
      MAX_BUYBACK_CENTS: 5000000
    precision: "integer cents, round_half_up at each named step; clamp applied last"

  # ---- Rule 2 mode (c): rush surcharge keyed on subtotal tier (pinned eval order) ----
  - name: repair_total
    trigger: "POST /repair-tickets/{id}/assess"
    algorithm: threshold
    formula: |
      # Evaluation order is pinned: subtotal first, then tier selection, then surcharge, then total.
      subtotal_cents = parts_cents + labor_cents
      if WARRANTY ticket: rush_surcharge_cents = 0; total_cents = 0; STOP
      if not rush: rush_surcharge_cents = 0
      else:
        if subtotal_cents <  RUSH_TIER1_MAX:       rush_pct = RUSH_PCT_LOW
        elif subtotal_cents <= RUSH_TIER2_MAX:     rush_pct = RUSH_PCT_MID    # inclusive upper bound
        else:                                      rush_pct = RUSH_PCT_HIGH
        rush_surcharge_cents = round_half_up(subtotal_cents * rush_pct)
      total_cents = subtotal_cents + rush_surcharge_cents
    input_set: "parts_cents, labor_cents from the assess request; rush from ticket"
    constants:
      RUSH_TIER1_MAX: 10000
      RUSH_TIER2_MAX: 50000
      RUSH_PCT_LOW: 0.10
      RUSH_PCT_MID: 0.20
      RUSH_PCT_HIGH: 0.30
    precision: "integer cents, round_half_up; tier boundary at 50000 is INCLUSIVE of MID (subtotal 50000 -> MID 0.20; 50001 -> HIGH 0.30)"

  # ---- Rule 8 instance A: bench window overlap (half-open, no buffer) ----
  - name: bench_window_overlap
    trigger: "POST /repair-tickets/{id}/schedule"
    algorithm: interval_merge
    formula: |
      # Resource = Workbench (bench_id). Interval semantics: HALF-OPEN [scheduled_start, scheduled_end).
      # Adjacency is allowed: an interval ending exactly when another begins does NOT conflict.
      # For each other RepairTicket T2 on the SAME bench_id with non-null scheduled_start/end
      #   and status not in {PICKED_UP, CANCELLED}:
      #   conflict iff (new.scheduled_start < T2.scheduled_end) AND (T2.scheduled_start < new.scheduled_end)
      # If any conflict -> reject ERR_BENCH_CONFLICT.
    input_set: "RepairTickets with same bench_id and status not in {PICKED_UP, CANCELLED}"
    constants: {}
    precision: "timestamps compared as ISO 8601 UTC; half-open interval, adjacency (end==start) does not collide"

  # ---- Rule 8 instance B: appraiser appointment overlap (closed + buffer) ----
  - name: appraisal_slot_overlap
    trigger: "POST /appraisals"
    algorithm: interval_merge
    formula: |
      # Resource = appraiser_name. Interval semantics: CLOSED [appointment_start, appointment_end]
      # PLUS an APPRAISAL_BUFFER_MINUTES gap required between consecutive appointments.
      # Effective occupied window for an existing appraisal is
      #   [appointment_start - BUFFER, appointment_end + BUFFER].
      # For each existing Appraisal A2 with the SAME appraiser_name and status in {DRAFT, FINALIZED}:
      #   conflict iff (new.appointment_start <= A2.appointment_end + BUFFER)
      #            AND (A2.appointment_start - BUFFER <= new.appointment_end)
      # (closed comparison: touching endpoints DO collide; plus the buffer must be clear.)
      # If any conflict -> reject ERR_APPRAISAL_SLOT_CONFLICT.
    input_set: "Appraisals with same appraiser_name and status in {DRAFT, FINALIZED} (VOID excluded)"
    constants:
      APPRAISAL_BUFFER_MINUTES: 30
    precision: "timestamps compared as ISO 8601 UTC; closed interval with 30-minute buffer; touching endpoints collide"

  # ---- aggregation ledger on Customer ----
  - name: store_credit_balance
    trigger: "every CreditLedgerEntry write; read on Customer"
    algorithm: aggregation
    formula: |
      store_credit_balance_cents =
          sum(amount_cents for CreditLedgerEntry where customer_id == C and direction == CREDIT)
        - sum(amount_cents for CreditLedgerEntry where customer_id == C and direction == DEBIT)
    input_set: "ALL CreditLedgerEntry rows for the customer (append-only; no status filter)"
    constants: {}
    precision: "integer cents; exact (no rounding)"

  # ---- insurance-appraisal replacement value (cross-entity computed) ----
  - name: insurance_replacement_value
    trigger: "POST /appraisals/{id}/finalize; POST /appraisals/{id}/void"
    algorithm: aggregation
    formula: |
      replacement_value_cents = round_half_up(market_value_cents * replacement_factor)   # per appraisal
      # InventoryItem.latest_appraised_value_cents = replacement_value_cents of the InventoryItem's
      #   most recent FINALIZED Appraisal, selected by created_at DESC then (tie) created_at is unique
      #   per row; if none FINALIZED -> null.
    input_set: "FINALIZED Appraisals for the InventoryItem; selection ordered by created_at DESC"
    constants: {}
    precision: "integer cents, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path resource ids exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all endpoints with path ids
  - priority: 4
    category: business_referential
    check: "Body FKs reference existing resources (customer_id, inventory_item_id, custom_order_id, layaway_plan_id, special_order_id)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "POST /custom-orders, POST /repair-tickets, POST /layaway-plans, POST /trade-ins, POST /special-orders, POST /appraisals, POST /warranty-claims, POST /payments, POST /credit-ledger"
  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, integers in range (list_price_cents>0, amount_cents>0, installment_count in 2..24, replacement_factor in 1.00..2.00)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all POST/PATCH endpoints
  - priority: 6
    category: business_constraint
    check: "Uniqueness: Customer.email unique; InventoryItem.sku unique"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /customers, POST /inventory-items"
  - priority: 7
    category: business_referential
    check: "Payment polymorphic FK consistency: exactly the FK matching target_type is present and references an existing parent; the other two are absent"
    error_id: ERR_PAYMENT_TARGET_MISMATCH
    http_status: 422
    applies_to: "POST /payments"
  - priority: 8
    category: state
    check: "Target resource is in a state from which the requested transition is legal"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints
  - priority: 9
    category: state
    check: "Cross-entity state guard: layaway activate requires InventoryItem IN_STOCK; appraisal finalize requires InventoryItem != SOLD; trade-in accept requires Customer ACTIVE; warranty approve requires a FINALIZED Appraisal on the item"
    error_id: "ERR_ITEM_NOT_AVAILABLE / ERR_ITEM_SOLD / ERR_CUSTOMER_SUSPENDED / ERR_NO_COVERAGE"
    http_status: 409
    applies_to: "POST /layaway-plans/{id}/activate, POST /appraisals/{id}/finalize, POST /trade-ins/{id}/accept, POST /warranty-claims/{id}/approve"
  - priority: 10
    category: business_constraint
    check: "Custom-order revision loop cap: request-revision rejected when revision_count >= MAX_REVISIONS (MAX_REVISIONS = 3)"
    error_id: ERR_MAX_REVISIONS_REACHED
    http_status: 409
    applies_to: "POST /custom-orders/{id}/request-revision"
  - priority: 11
    category: business_constraint
    check: "approve-design requires non-empty line_items"
    error_id: ERR_LINE_ITEMS_REQUIRED
    http_status: 422
    applies_to: "POST /custom-orders/{id}/approve-design"
  - priority: 12
    category: business_constraint
    check: "order-parts requires parts_cents > 0"
    error_id: ERR_NO_PARTS_NEEDED
    http_status: 409
    applies_to: "POST /repair-tickets/{id}/order-parts"
  - priority: 12.1
    category: business_temporal
    check: "Bench reservation must not overlap another active ticket's window on the same bench (half-open [start,end); adjacency allowed)"
    error_id: ERR_BENCH_CONFLICT
    http_status: 409
    applies_to: "POST /repair-tickets/{id}/schedule"
  - priority: 12.2
    category: business_temporal
    check: "Appraisal appointment must not overlap (closed interval + 30-min buffer) another DRAFT/FINALIZED appointment for the same appraiser"
    error_id: ERR_APPRAISAL_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /appraisals"
  - priority: 13
    category: business_fiscal
    check: "special-order place requires deposit_paid_cents >= deposit_required_cents"
    error_id: ERR_DEPOSIT_REQUIRED
    http_status: 402
    applies_to: "POST /special-orders/{id}/place"
  - priority: 14
    category: business_fiscal
    check: "custom-order complete requires balance_due_cents <= 0"
    error_id: ERR_BALANCE_OUTSTANDING
    http_status: 402
    applies_to: "POST /custom-orders/{id}/complete"
  - priority: 15
    category: business_constraint
    check: "Mutations that take an OCC version field require it present: expected_version on version-guarded transitions, expected_inventory_item_version on OCC-guarded writes"
    error_id: ERR_VERSION_REQUIRED
    http_status: 422
    applies_to: "all mutating transition endpoints that declare expected_version or expected_inventory_item_version in input"
  - priority: 16
    category: business_fiscal
    check: "OCC: expected_inventory_item_version must equal the InventoryItem's current version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /appraisals/{id}/finalize, POST /layaway-plans/{id}/activate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------------------------------------------------------------- Customer
  - { method: POST, path: "/customers", description: "Create a customer", roles: [SalesAssociate, StoreManager], code: 201, input: [full_name, email, phone], output: Customer, side_effects: ["status=ACTIVE, store_credit_balance_cents=0"] }
  - { method: GET, path: "/customers", description: "List customers (paginated; filter by email)", roles: [SalesAssociate, StoreManager, Goldsmith], code: 200, input: ["email?", "limit?", "offset?"], output: "Customer[]", side_effects: [] }
  - { method: GET, path: "/customers/{id}", description: "Get a customer (with computed store credit balance)", roles: [SalesAssociate, StoreManager, Goldsmith, Customer], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: POST, path: "/customers/{id}/suspend", description: "Suspend a customer", roles: [StoreManager], code: 200, input: ["expected_version"], output: Customer, side_effects: ["status -> SUSPENDED", "increments Customer.version by 1"] }

  # ------------------------------------------------------------ InventoryItem
  - { method: POST, path: "/inventory-items", description: "Create an inventory item", roles: [StoreManager], code: 201, input: [sku, title, metal_karat, list_price_cents], output: InventoryItem, side_effects: ["status=IN_STOCK"] }
  - { method: GET, path: "/inventory-items", description: "List inventory items (filter by sku, status)", roles: [SalesAssociate, StoreManager, Goldsmith, Customer], code: 200, input: ["sku?", "status?", "limit?", "offset?"], output: "InventoryItem[]", side_effects: [] }
  - { method: GET, path: "/inventory-items/{id}", description: "Get an inventory item", roles: [SalesAssociate, StoreManager, Goldsmith, Customer], code: 200, input: [], output: InventoryItem, side_effects: [] }

  # ---------------------------------------------------------------- Workbench
  - { method: POST, path: "/workbenches", description: "Create a workbench", roles: [StoreManager], code: 201, input: [label], output: Workbench, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/workbenches", description: "List workbenches", roles: [SalesAssociate, StoreManager, Goldsmith], code: 200, input: ["limit?", "offset?"], output: "Workbench[]", side_effects: [] }
  - { method: GET, path: "/workbenches/{id}", description: "Get a workbench", roles: [SalesAssociate, StoreManager, Goldsmith], code: 200, input: [], output: Workbench, side_effects: [] }

  # ---------------------------------------------------------------- Appraisal
  - { method: POST, path: "/appraisals", description: "Create a DRAFT appraisal for an item (books an appraiser appointment slot)", roles: [StoreManager], code: 201, input: [inventory_item_id, appraiser_name, appointment_start, appointment_end, market_value_cents, "replacement_factor?"], output: Appraisal, side_effects: ["status=DRAFT, replacement_value_cents computed [calc insurance_replacement_value]", "appraiser appointment-slot overlap check [calc appraisal_slot_overlap]"] }
  - { method: GET, path: "/appraisals", description: "List appraisals (filter by inventory_item_id)", roles: [SalesAssociate, StoreManager, Customer], code: 200, input: ["inventory_item_id?", "limit?", "offset?"], output: "Appraisal[]", side_effects: [] }
  - { method: GET, path: "/appraisals/{id}", description: "Get an appraisal (insurance-appraisal document)", roles: [SalesAssociate, StoreManager, Customer], code: 200, input: [], output: Appraisal, side_effects: [] }
  - { method: POST, path: "/appraisals/{id}/finalize", description: "Finalize appraisal -> assigns document_number; OCC-guarded on the item", roles: [StoreManager], code: 200, input: [expected_inventory_item_version], output: Appraisal, side_effects: ["status -> FINALIZED", "assign document_number", "recompute InventoryItem.latest_appraised_value_cents", "increments InventoryItem.version by 1", "increments Appraisal.version by 1"] }
  - { method: POST, path: "/appraisals/{id}/void", description: "Void an appraisal", roles: [StoreManager], code: 200, input: ["expected_version"], output: Appraisal, side_effects: ["status -> VOID", "recompute InventoryItem.latest_appraised_value_cents", "increments Appraisal.version by 1"] }

  # ----------------------------------------------------------- CustomDesignOrder
  - { method: POST, path: "/custom-orders", description: "Create a DRAFT custom-design order", roles: [SalesAssociate, StoreManager], code: 201, input: [customer_id, description, estimated_materials_cents, design_fee_cents], output: CustomDesignOrder, side_effects: ["status=DRAFT, deposit_paid_cents=0, revision_count=0"] }
  - { method: GET, path: "/custom-orders", description: "List custom orders (filter by customer_id)", roles: [SalesAssociate, StoreManager, Goldsmith, Customer], code: 200, input: ["customer_id?", "limit?", "offset?"], output: "CustomDesignOrder[]", side_effects: [] }
  - { method: GET, path: "/custom-orders/{id}", description: "Get a custom order", roles: [SalesAssociate, StoreManager, Goldsmith, Customer], code: 200, input: [], output: CustomDesignOrder, side_effects: [] }
  - { method: POST, path: "/custom-orders/{id}/quote", description: "Quote the order (provisional totals + deposit)", roles: [SalesAssociate], code: 200, input: ["expected_version"], output: CustomDesignOrder, side_effects: ["status -> QUOTED", "compute provisional_total_cents, deposit_required_cents, balance_due_cents [calc custom_order_totals]", "increments CustomDesignOrder.version by 1"] }
  - { method: POST, path: "/custom-orders/{id}/start-design", description: "Begin design (after deposit paid)", roles: [Goldsmith], code: 200, input: ["expected_version"], output: CustomDesignOrder, side_effects: ["status -> IN_DESIGN", "increments CustomDesignOrder.version by 1"] }
  - { method: POST, path: "/custom-orders/{id}/submit-review", description: "Submit design for review", roles: [Goldsmith], code: 200, input: ["expected_version"], output: CustomDesignOrder, side_effects: ["status -> DESIGN_REVIEW", "increments CustomDesignOrder.version by 1"] }
  - { method: POST, path: "/custom-orders/{id}/request-revision", description: "Request a design revision (cyclic loop)", roles: [SalesAssociate], code: 200, input: ["expected_version"], output: CustomDesignOrder, side_effects: ["status -> IN_DESIGN", "revision_count += 1", "increments CustomDesignOrder.version by 1"] }
  - { method: POST, path: "/custom-orders/{id}/approve-design", description: "Approve design and lock line_items", roles: [SalesAssociate], code: 200, input: [line_items, "expected_version"], output: CustomDesignOrder, side_effects: ["status -> APPROVED", "persist line_items", "increments CustomDesignOrder.version by 1"] }
  - { method: POST, path: "/custom-orders/{id}/start-production", description: "Start production", roles: [Goldsmith], code: 200, input: ["expected_version"], output: CustomDesignOrder, side_effects: ["status -> IN_PRODUCTION", "increments CustomDesignOrder.version by 1"] }
  - { method: POST, path: "/custom-orders/{id}/complete-production", description: "Complete production -> compute final totals", roles: [Goldsmith], code: 200, input: ["expected_version"], output: CustomDesignOrder, side_effects: ["status -> READY", "compute final_total_cents (round per line then sum) + design_fee_cents [calc custom_order_totals]", "recompute balance_due_cents", "increments CustomDesignOrder.version by 1"] }
  - { method: POST, path: "/custom-orders/{id}/complete", description: "Complete the order (requires balance cleared)", roles: [SalesAssociate], code: 200, input: ["expected_version"], output: CustomDesignOrder, side_effects: ["status -> COMPLETED", "increments CustomDesignOrder.version by 1"] }
  - { method: POST, path: "/custom-orders/{id}/cancel", description: "Cancel the order (refunds deposit to store credit)", roles: [StoreManager], code: 200, input: ["expected_version"], output: CustomDesignOrder, side_effects: ["status -> CANCELLED", "if deposit_paid_cents>0 post CreditLedgerEntry CREDIT and recompute Customer.store_credit_balance_cents [cascade]", "increments CustomDesignOrder.version by 1"] }

  # ------------------------------------------------------------- RepairTicket
  - { method: POST, path: "/repair-tickets", description: "Create a repair ticket (INTAKE)", roles: [SalesAssociate, StoreManager], code: 201, input: [customer_id, "inventory_item_id?", repair_kind, "rush?", promised_at], output: RepairTicket, side_effects: ["status=INTAKE, parts_cents=0, labor_cents=0"] }
  - { method: GET, path: "/repair-tickets", description: "List repair tickets (filter by customer_id, inventory_item_id, warranty_claim_id, bench_id)", roles: [SalesAssociate, StoreManager, Goldsmith, Customer], code: 200, input: ["customer_id?", "inventory_item_id?", "warranty_claim_id?", "bench_id?", "limit?", "offset?"], output: "RepairTicket[]", side_effects: [] }
  - { method: GET, path: "/repair-tickets/{id}", description: "Get a repair ticket", roles: [SalesAssociate, StoreManager, Goldsmith, Customer], code: 200, input: [], output: RepairTicket, side_effects: [] }
  - { method: POST, path: "/repair-tickets/{id}/schedule", description: "Reserve a bench time window for the ticket (overlap-checked, half-open interval)", roles: [Goldsmith, StoreManager], code: 200, input: [bench_id, scheduled_start, scheduled_end, "expected_version"], output: RepairTicket, side_effects: ["set bench_id, scheduled_start, scheduled_end", "bench overlap check [calc bench_window_overlap]", "increments RepairTicket.version by 1"] }
  - { method: POST, path: "/repair-tickets/{id}/assess", description: "Assess parts/labor and compute totals", roles: [Goldsmith], code: 200, input: [parts_cents, labor_cents, "expected_version"], output: RepairTicket, side_effects: ["status -> ASSESSED", "compute rush_surcharge_cents, total_cents [calc repair_total]", "if inventory_item_id set: InventoryItem.status -> IN_REPAIR", "increments RepairTicket.version by 1"] }
  - { method: POST, path: "/repair-tickets/{id}/order-parts", description: "Route to AWAITING_PARTS (parts branch)", roles: [Goldsmith], code: 200, input: ["expected_version"], output: RepairTicket, side_effects: ["status -> AWAITING_PARTS", "increments RepairTicket.version by 1"] }
  - { method: POST, path: "/repair-tickets/{id}/parts-received", description: "Parts received -> IN_REPAIR", roles: [Goldsmith], code: 200, input: ["expected_version"], output: RepairTicket, side_effects: ["status -> IN_REPAIR", "increments RepairTicket.version by 1"] }
  - { method: POST, path: "/repair-tickets/{id}/start-repair", description: "Start repair directly (no-parts branch)", roles: [Goldsmith], code: 200, input: ["expected_version"], output: RepairTicket, side_effects: ["status -> IN_REPAIR", "increments RepairTicket.version by 1"] }
  - { method: POST, path: "/repair-tickets/{id}/submit-qc", description: "Submit for QC", roles: [Goldsmith], code: 200, input: ["expected_version"], output: RepairTicket, side_effects: ["status -> QC", "increments RepairTicket.version by 1"] }
  - { method: POST, path: "/repair-tickets/{id}/pass-qc", description: "Pass QC -> READY", roles: [StoreManager], code: 200, input: ["expected_version"], output: RepairTicket, side_effects: ["status -> READY", "increments RepairTicket.version by 1"] }
  - { method: POST, path: "/repair-tickets/{id}/fail-qc", description: "Fail QC -> back to IN_REPAIR", roles: [StoreManager], code: 200, input: ["expected_version"], output: RepairTicket, side_effects: ["status -> IN_REPAIR", "increments RepairTicket.version by 1"] }
  - { method: POST, path: "/repair-tickets/{id}/pickup", description: "Customer pickup -> PICKED_UP", roles: [SalesAssociate], code: 200, input: ["expected_version"], output: RepairTicket, side_effects: ["status -> PICKED_UP", "if inventory_item_id set: InventoryItem.status -> IN_STOCK", "if warranty_claim_id set: WarrantyClaim.status -> RESOLVED [cascade]", "increments RepairTicket.version by 1"] }
  - { method: POST, path: "/repair-tickets/{id}/cancel", description: "Cancel a repair ticket", roles: [StoreManager], code: 200, input: ["expected_version"], output: RepairTicket, side_effects: ["status -> CANCELLED", "if inventory_item_id set: InventoryItem.status -> IN_STOCK", "if warranty_claim_id set: WarrantyClaim.status -> REJECTED [cascade]", "increments RepairTicket.version by 1"] }

  # -------------------------------------------------------------- LayawayPlan
  - { method: POST, path: "/layaway-plans", description: "Create a PENDING layaway plan", roles: [SalesAssociate, StoreManager], code: 201, input: [customer_id, inventory_item_id, installment_count], output: LayawayPlan, side_effects: ["status=PENDING, paid_to_date_cents=0"] }
  - { method: GET, path: "/layaway-plans", description: "List layaway plans (filter by customer_id, inventory_item_id)", roles: [SalesAssociate, StoreManager, Customer], code: 200, input: ["customer_id?", "inventory_item_id?", "limit?", "offset?"], output: "LayawayPlan[]", side_effects: [] }
  - { method: GET, path: "/layaway-plans/{id}", description: "Get a layaway plan", roles: [SalesAssociate, StoreManager, Customer], code: 200, input: [], output: LayawayPlan, side_effects: [] }
  - { method: POST, path: "/layaway-plans/{id}/activate", description: "Activate plan (collect down payment, reserve item); OCC-guarded on item", roles: [SalesAssociate], code: 200, input: [expected_inventory_item_version], output: LayawayPlan, side_effects: ["status -> ACTIVE", "snapshot item_price_cents", "compute schedule [calc layaway_schedule]", "InventoryItem.status -> RESERVED", "increments InventoryItem.version by 1", "increments LayawayPlan.version by 1"] }
  - { method: POST, path: "/layaway-plans/{id}/fulfill", description: "Fulfill paid-in-full plan (deliver item)", roles: [SalesAssociate], code: 200, input: ["expected_version"], output: LayawayPlan, side_effects: ["status -> FULFILLED", "InventoryItem.status -> SOLD", "increments LayawayPlan.version by 1"] }
  - { method: POST, path: "/layaway-plans/{id}/cancel", description: "Cancel plan (settlement refund to store credit)", roles: [StoreManager], code: 200, input: ["expected_version"], output: LayawayPlan, side_effects: ["status -> CANCELLED", "compute restocking_fee_cents, settlement_refund_cents [calc layaway_schedule]", "if was ACTIVE InventoryItem.status -> IN_STOCK", "if refund>0 post CreditLedgerEntry CREDIT and recompute Customer.store_credit_balance_cents [cascade]", "increments LayawayPlan.version by 1"] }

  # -------------------------------------------------------------- TradeInOffer
  - { method: POST, path: "/trade-ins", description: "Create a buyback/trade-in offer (computes credit)", roles: [SalesAssociate, StoreManager], code: 201, input: [customer_id, metal_karat, metal_weight_grams, metal_spot_price_cents_per_gram, "gemstone_value_cents?", condition], output: TradeInOffer, side_effects: ["status=OFFERED, compute metal_value_cents, buyback_credit_cents [calc trade_in_credit]"] }
  - { method: GET, path: "/trade-ins", description: "List trade-in offers (filter by customer_id, credit_ledger_entry_id)", roles: [SalesAssociate, StoreManager, Customer], code: 200, input: ["customer_id?", "credit_ledger_entry_id?", "limit?", "offset?"], output: "TradeInOffer[]", side_effects: [] }
  - { method: GET, path: "/trade-ins/{id}", description: "Get a trade-in offer", roles: [SalesAssociate, StoreManager, Customer], code: 200, input: [], output: TradeInOffer, side_effects: [] }
  - { method: POST, path: "/trade-ins/{id}/accept", description: "Accept offer -> post store credit", roles: [StoreManager], code: 200, input: ["expected_version"], output: TradeInOffer, side_effects: ["status -> ACCEPTED", "post CreditLedgerEntry CREDIT reason=TRADE_IN, set credit_ledger_entry_id, recompute Customer.store_credit_balance_cents [cascade]", "increments TradeInOffer.version by 1"] }
  - { method: POST, path: "/trade-ins/{id}/decline", description: "Decline offer", roles: [StoreManager], code: 200, input: ["expected_version"], output: TradeInOffer, side_effects: ["status -> DECLINED", "increments TradeInOffer.version by 1"] }

  # -------------------------------------------------------------- SpecialOrder
  - { method: POST, path: "/special-orders", description: "Create a special order (REQUESTED)", roles: [SalesAssociate, StoreManager], code: 201, input: [customer_id, vendor_name, catalog_ref, quoted_price_cents], output: SpecialOrder, side_effects: ["status=REQUESTED, compute deposit_required_cents, deposit_paid_cents=0"] }
  - { method: GET, path: "/special-orders", description: "List special orders (filter by customer_id, received_inventory_item_id)", roles: [SalesAssociate, StoreManager, Customer], code: 200, input: ["customer_id?", "received_inventory_item_id?", "limit?", "offset?"], output: "SpecialOrder[]", side_effects: [] }
  - { method: GET, path: "/special-orders/{id}", description: "Get a special order", roles: [SalesAssociate, StoreManager, Customer], code: 200, input: [], output: SpecialOrder, side_effects: [] }
  - { method: POST, path: "/special-orders/{id}/place", description: "Place order with vendor (requires deposit)", roles: [SalesAssociate], code: 200, input: ["expected_version"], output: SpecialOrder, side_effects: ["status -> PLACED", "increments SpecialOrder.version by 1"] }
  - { method: POST, path: "/special-orders/{id}/receive", description: "Receive item -> creates InventoryItem", roles: [SalesAssociate], code: 200, input: [sku, metal_karat, "expected_version"], output: SpecialOrder, side_effects: ["status -> ARRIVED", "create InventoryItem (RESERVED), set received_inventory_item_id", "increments SpecialOrder.version by 1"] }
  - { method: POST, path: "/special-orders/{id}/deliver", description: "Deliver to customer", roles: [SalesAssociate], code: 200, input: ["expected_version"], output: SpecialOrder, side_effects: ["status -> DELIVERED", "received InventoryItem.status -> SOLD", "increments SpecialOrder.version by 1"] }
  - { method: POST, path: "/special-orders/{id}/cancel", description: "Cancel special order (refund deposit)", roles: [StoreManager], code: 200, input: ["expected_version"], output: SpecialOrder, side_effects: ["status -> CANCELLED", "if deposit_paid>0 post CreditLedgerEntry CREDIT [cascade]", "increments SpecialOrder.version by 1"] }

  # ------------------------------------------------------------------ Payment
  - { method: POST, path: "/payments", description: "Record a SUCCEEDED payment against an order/plan (drives deposit/installment auto-transitions)", roles: [SalesAssociate, StoreManager], code: 201, input: [target_type, "custom_order_id?", "layaway_plan_id?", "special_order_id?", amount_cents], output: Payment, side_effects: ["outcome=SUCCEEDED", "recompute parent deposit_paid_cents / paid_to_date_cents", "auto-transition QUOTED->DEPOSIT_PAID or ACTIVE->PAID_IN_FULL when threshold met [calc custom_order_totals / layaway_schedule]"] }
  - { method: GET, path: "/payments", description: "List payments (filter by custom_order_id, layaway_plan_id, special_order_id)", roles: [SalesAssociate, StoreManager, Customer], code: 200, input: ["custom_order_id?", "layaway_plan_id?", "special_order_id?", "limit?", "offset?"], output: "Payment[]", side_effects: [] }
  - { method: GET, path: "/payments/{id}", description: "Get a payment", roles: [SalesAssociate, StoreManager, Customer], code: 200, input: [], output: Payment, side_effects: [] }

  # ------------------------------------------------------------- WarrantyClaim
  - { method: POST, path: "/warranty-claims", description: "Submit a warranty claim", roles: [SalesAssociate, StoreManager, Customer], code: 201, input: [inventory_item_id, customer_id, defect_description], output: WarrantyClaim, side_effects: ["status=SUBMITTED"] }
  - { method: GET, path: "/warranty-claims", description: "List warranty claims (filter by inventory_item_id, customer_id, spawned_repair_ticket_id)", roles: [SalesAssociate, StoreManager, Customer], code: 200, input: ["inventory_item_id?", "customer_id?", "spawned_repair_ticket_id?", "limit?", "offset?"], output: "WarrantyClaim[]", side_effects: [] }
  - { method: GET, path: "/warranty-claims/{id}", description: "Get a warranty claim", roles: [SalesAssociate, StoreManager, Customer], code: 200, input: [], output: WarrantyClaim, side_effects: [] }
  - { method: POST, path: "/warranty-claims/{id}/approve", description: "Approve claim -> spawn WARRANTY repair ticket", roles: [StoreManager], code: 200, input: ["expected_version"], output: WarrantyClaim, side_effects: ["status -> APPROVED", "create RepairTicket (WARRANTY) set spawned_repair_ticket_id [cascade]", "increments WarrantyClaim.version by 1"] }
  - { method: POST, path: "/warranty-claims/{id}/reject", description: "Reject claim", roles: [StoreManager], code: 200, input: ["expected_version"], output: WarrantyClaim, side_effects: ["status -> REJECTED", "increments WarrantyClaim.version by 1"] }

  # --------------------------------------------------------- CreditLedgerEntry
  - { method: POST, path: "/credit-ledger", description: "Post a manual store-credit ledger entry", roles: [StoreManager], code: 201, input: [customer_id, direction, amount_cents, reason], output: CreditLedgerEntry, side_effects: ["recompute Customer.store_credit_balance_cents [calc store_credit_balance]"] }
  - { method: GET, path: "/credit-ledger", description: "List ledger entries (filter by customer_id)", roles: [SalesAssociate, StoreManager, Customer], code: 200, input: ["customer_id?", "limit?", "offset?"], output: "CreditLedgerEntry[]", side_effects: [] }
  - { method: GET, path: "/credit-ledger/{id}", description: "Get a ledger entry", roles: [SalesAssociate, StoreManager, Customer], code: 200, input: [], output: CreditLedgerEntry, side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_FK_NOT_FOUND, http: 404, condition: "A body foreign key references a non-existent resource" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, out-of-range integer" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Unique constraint violated (Customer.email or InventoryItem.sku)" }
  - { id: ERR_PAYMENT_TARGET_MISMATCH, http: 422, condition: "Payment target_type does not match exactly one populated FK, or that FK's parent is missing" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition illegal from the resource's current state" }
  - { id: ERR_ITEM_NOT_AVAILABLE, http: 409, condition: "Layaway activate requires InventoryItem IN_STOCK" }
  - { id: ERR_ITEM_SOLD, http: 409, condition: "Appraisal finalize requires InventoryItem not SOLD" }
  - { id: ERR_CUSTOMER_SUSPENDED, http: 409, condition: "Trade-in accept requires Customer ACTIVE" }
  - { id: ERR_NO_COVERAGE, http: 409, condition: "Warranty approve requires a FINALIZED Appraisal on the item" }
  - { id: ERR_MAX_REVISIONS_REACHED, http: 409, condition: "request-revision when revision_count >= MAX_REVISIONS" }
  - { id: ERR_LINE_ITEMS_REQUIRED, http: 422, condition: "approve-design with empty line_items" }
  - { id: ERR_NO_PARTS_NEEDED, http: 409, condition: "order-parts when parts_cents == 0" }
  - { id: ERR_BENCH_CONFLICT, http: 409, condition: "Bench reservation window overlaps another active ticket on the same bench" }
  - { id: ERR_APPRAISAL_SLOT_CONFLICT, http: 409, condition: "Appraiser appointment window (with buffer) overlaps another DRAFT/FINALIZED appointment" }
  - { id: ERR_DEPOSIT_REQUIRED, http: 402, condition: "special-order place when deposit_paid_cents < deposit_required_cents" }
  - { id: ERR_BALANCE_OUTSTANDING, http: 402, condition: "custom-order complete when balance_due_cents > 0" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent's current version" }
  - { id: ERR_VERSION_REQUIRED, http: 422, condition: "expected_version / expected_inventory_item_version missing on a mutation that requires it" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SalesAssociate
    description: "Front-of-house staff; intake, quoting, customer/payment handling, pickups, deliveries"
    identity: opaque
    exclusive_operations:
      - "POST /custom-orders/{id}/quote, /request-revision, /approve-design, /complete"
      - "POST /layaway-plans/{id}/activate, /fulfill"
      - "POST /special-orders/{id}/place, /receive, /deliver"
      - "POST /repair-tickets/{id}/pickup"
    shared_operations:
      - "POST /customers, /custom-orders, /repair-tickets, /layaway-plans, /trade-ins, /special-orders, /payments, /warranty-claims"
      - "All GET endpoints"

  - name: Goldsmith
    description: "Bench jeweler; performs design, production, and repair bench work"
    identity: opaque
    exclusive_operations:
      - "POST /custom-orders/{id}/start-design, /submit-review, /start-production, /complete-production"
      - "POST /repair-tickets/{id}/assess, /order-parts, /parts-received, /start-repair, /submit-qc"
    shared_operations:
      - "POST /repair-tickets/{id}/schedule (shared with StoreManager)"
      - "All GET endpoints"

  - name: StoreManager
    description: "Manager; owns inventory, appraisals, QC sign-off, cancellations, refunds, trade-in approvals, ledger"
    identity: opaque
    exclusive_operations:
      - "POST /inventory-items"
      - "POST /workbenches"
      - "POST /appraisals, /appraisals/{id}/finalize, /void"
      - "POST /customers/{id}/suspend"
      - "POST /custom-orders/{id}/cancel"
      - "POST /repair-tickets/{id}/pass-qc, /fail-qc, /cancel"
      - "POST /layaway-plans/{id}/cancel"
      - "POST /trade-ins/{id}/accept, /decline"
      - "POST /special-orders/{id}/cancel"
      - "POST /warranty-claims/{id}/approve, /reject"
      - "POST /credit-ledger"
    shared_operations:
      - "POST /customers, /custom-orders, /repair-tickets, /layaway-plans, /trade-ins, /special-orders, /payments, /appraisals input, /warranty-claims"
      - "All GET endpoints"

  - name: Customer
    description: "End customer; read-only self-service plus warranty claim submission"
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /warranty-claims"
      - "GET /customers/{id}, /custom-orders, /repair-tickets, /layaway-plans, /trade-ins, /special-orders, /payments, /appraisals, /warranty-claims, /credit-ledger, /inventory-items"
