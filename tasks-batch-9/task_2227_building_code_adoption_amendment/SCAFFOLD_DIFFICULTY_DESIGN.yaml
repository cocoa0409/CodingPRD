      - name: reopen_approved_proposal_cascade_depth_six_reschedules_draft_rule
        grounds:
          - state_machines.AmendmentProposal.APPROVED_to_RETURNED_FOR_REVISION
          - state_machines.ImpactAnalysis.ACCEPTED_to_SUPERSEDED
          - state_machines.CodeCycle.RULEMAKING_to_DELIBERATION
          - calculations.cycle_cost_ledger
