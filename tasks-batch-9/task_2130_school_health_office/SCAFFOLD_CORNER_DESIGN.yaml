              captures: { epoch: $.data.epoch, recomputed: $.data.recomputed_school_ids }
          assert:
            - "HTTP status == 200"
            - "data.epoch is an integer"
            - "data.expired_action_plan_ids == []"
            - "data.expired_authorization_ids == []"
            - "data.expired_lot_ids == []"
            - "data.expired_disclosure_ids == []"
            - "data.promoted_screening_ids == []"
            - "data.voided_administration_ids == []"
            - "data.recomputed_school_ids contains ${sch_id}"
            - "MedicationStockLot.${lot_id}.status == AVAILABLE"
            - "School.${sch_id}.epinephrine_days_of_supply == 33.33 and albuterol_days_of_supply == 0.0"
            - "School.${sch_id}.stock_protocol_status == DEPLETED and coverage_posture == LIMITED"

      - name: stock_emergency_conditional_on_medication_family
        claim_type: conditional_action
        grounds:
          - validations[priority=30]
          - errors[ERR_STOCK_PROTOCOL_DISABLED]
          - state_machines.AdministrationRecord.null_to_PREPARED
        distinguishing_aspect: "The stock-emergency endpoint is conditional on the medication family: an INSULIN request is refused with 409 ERR_STOCK_PROTOCOL_DISABLED before the lot selector runs, even though the building holds an AVAILABLE stock-protocol INSULIN lot."
        test_recipe:
          setup:
            - "School ELMS59 with emergency_protocol_enabled true, an RN on an ACTIVE Monday block, one ENROLLED student and one AVAILABLE stock-protocol INSULIN lot of 10 units."
            - "Clock at 2026-08-03T09:00:00Z; the encounter is IN_ASSESSMENT."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Elmswood Elementary", building_code: "ELM59", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Rita Nolan", credential: "RN", weekly_contracted_minutes: 2400, delegation_authorized: false }
              as: DistrictHealthAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /health-office/coverage-assignments"
              payload: { nurse_id: "${rn_id}", school_id: "${sch_id}", weekday: "MON", start_minute: 480, end_minute: 960, effective_from: "2026-07-01T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { cov_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Ena Wolfe", grade_level: 7, date_of_birth: "2013-03-03T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: ["T1DM"], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /health-office/medication-stock-lots"
              payload: { school_id: "${sch_id}", medication_code: "INSULIN", lot_number: "INS-ELM-1", is_stock_protocol: true, initial_quantity: 10, expiration_date: "2027-06-30T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { ins_lot_id: $.data.id }
            - call: "POST /health-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: DistrictHealthAdmin
            - call: "POST /health-office/health-visits"
              payload: { student_id: "${stu_id}", school_id: "${sch_id}", nurse_id: "${rn_id}", complaint_code: "CHRONIC_CARE", acuity: "ROUTINE" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /health-office/health-visits/${visit_id}/assess"
              payload: { assessment_note: "Glucose check before lunch" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
          trigger:
            - call: "POST /health-office/administration-records/stock-emergency"
              payload: { visit_id: "${visit_id}", medication_code: "INSULIN", units: 1 }
