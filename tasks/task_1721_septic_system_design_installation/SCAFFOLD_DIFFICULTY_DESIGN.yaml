  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: design_reject_revise_resubmit_cycle
        grounds:
          - state_machines.SystemDesign.SUBMITTED_to_REJECTED
          - state_machines.SystemDesign.REJECTED_to_DRAFT
          - state_machines.SystemDesign.DRAFT_to_SUBMITTED
          - concurrency_rules[design-revise-stale-version]
        distinguishing_aspect: |
          Entity = SystemDesign; shape = cyclic rework loop
          DRAFT -> SUBMITTED -> REJECTED -> DRAFT -> SUBMITTED -> APPROVED.
          The cycle back-edge is OCC-guarded (expected_design_version), so each
          pass through the loop is observable via design.version increments.
        test_recipe:
          setup:
            - "Company/county WH; designer D1, officer H1, manager M1, scientist SS1"
            - "Site S with fresh LOAM evaluation E1 and perc PT1 (period 0)"
            - "Design D created (3-bed GRAVITY), submitted, then REJECTED by H1"
          setup_api_calls:
            - call: "POST /septic-ops/installer-companies"
              payload: { legal_name: "Clearwater Onsite LLC", license_number: "CW-100", county_codes: ["WH"] }
              as: PlatformAdmin
              captures: { cid: $.data.id }
