              as: CommandCenterAdmin
              as_user_id: "cc-1"
            - call: "POST /atfm/tmis/${r2}/cancel"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
          trigger:
            - call: "POST /atfm/tmis/${r2}/reroute-assignments"
              payload: { flight_id: "${x3}", via_sector_id: "${zdc}", assigned_route: "J64" }
              as: FlowManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_TMI_TERMINAL (state, priority 5) — NOT ERR_SECTOR_CAPACITY_EXCEEDED (business_safety, priority 7), even though the ZDC42 13:00h bucket is full (2 == base_acceptance_rate)"
            - "No RerouteAssignment is created for ${x3}"

      - name: revision_temporal_beats_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=20]
          - errors[ERR_INVALID_WINDOW]
          - errors[ERR_RATE_EXCEEDS_CAPACITY]
        distinguishing_aspect: |
          Category pair (business_temporal, business_fiscal): one revision request
          violates both — new_program_end equals program_start (invalid window) and
          new_controlled_rate 60 exceeds max_feasible 30 — and ERR_INVALID_WINDOW
          (priority 8) MUST win over ERR_RATE_EXCEEDS_CAPACITY (priority 20).
          Distinct pair from reroute_state_beats_sector_safety.
        test_recipe:
          setup:
            - "ACTIVE GDP rate 6, window 13:00-15:00Z, facility base 30, published forecast (max_feasible == 30)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/facilities/${fac}/capacity-forecasts"
              payload: { variant: "PLANNING", window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T15:00:00Z" }
              as: FlowManager
              captures: { fc: $.data.id }
            - call: "POST /atfm/capacity-forecasts/${fc}/publish"
              as: FlowManager
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "GROUND_DELAY_PROGRAM", program_start: "2026-09-15T13:00:00Z", program_end: "2026-09-15T15:00:00Z", controlled_rate: 6 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { tmi: $.data.id }
            - call: "POST /atfm/tmis/${tmi}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
            - call: "POST /atfm/tmis/${tmi}/activate"
              as: FlowManager
            - call: "GET /atfm/tmis/${tmi}"
              as: FlowManager
              captures: { tmi_v: $.data.version }
          trigger:
            - call: "POST /atfm/tmis/${tmi}/revisions"
              payload: { new_controlled_rate: 60, new_program_end: "2026-09-15T13:00:00Z", reason: "dual violation", expected_tmi_version: "${tmi_v}" }
              as: FlowManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_WINDOW (business_temporal, priority 8: new_program_end 13:00 is not > program_start 13:00) — NOT ERR_RATE_EXCEEDS_CAPACITY (business_fiscal, priority 20: 60 > 30)"
            - "TMI remains ACTIVE with revision_count == 0"

  - rule_id: boundary_precision_check
    instances:
      - name: constraint_event_extension_boundary
        grounds:
          - validations[priority=19]
          - entities.ConstraintEvent.fields.extension_count
        distinguishing_aspect: |
          Numeric counter boundary: extension_count < 2 admits the extension at
          count == 1 and rejects at count == 2 — exact integer-cap precision on the
          extend endpoint. Distinct metric (extension counter) and endpoint from
          ga_reserved_pool_boundary (quota pool on adjudicate).
        test_recipe:
          setup:
            - "Facility KEWR; one REPORTED WEATHER event 13:00-15:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/facilities/${fac}/constraint-events"
              payload: { event_type: "WEATHER", severity: 2, window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T15:00:00Z" }
              as: FlowManager
              captures: { ev: $.data.id }
          trigger:
            - call: "POST /atfm/constraint-events/${ev}/extend"
              payload: { window_end: "2026-09-15T15:30:00Z" }
              as: FlowManager
              captures: { ext1: $.data.extension_count }
            - call: "POST /atfm/constraint-events/${ev}/extend"
              payload: { window_end: "2026-09-15T16:00:00Z" }
              as: FlowManager
              captures: { ext2: $.data.extension_count }
            - call: "POST /atfm/constraint-events/${ev}/extend"
              payload: { window_end: "2026-09-15T16:30:00Z" }
              as: FlowManager
              captures: { err: $.data.error_id }
          assert:
            - "ext1 == 1 and ext2 == 2 (count 0 and 1 pass the < 2 rule)"
            - "err == ERR_EXTENSION_LIMIT_EXCEEDED at extension_count == 2 (boundary: == cap rejects, not cap+1)"
            - "event remains CONFIRMED-able: status still REPORTED after the rejected third extension"

      - name: ga_reserved_pool_boundary
        grounds:
          - calculations.rbs_slot_allocation
          - state_machines.GAAccommodationRequest.REQUESTED_to_WAITLISTED
        distinguishing_aspect: |
          Count boundary on a fixed pool: reserved_slots = max(1, floor(12 * 10%)) == 1,
          so the FIRST GA request accommodates (0 < 1) and the SECOND waitlists
          (1 < 1 false) — exact pool-size precision. Distinct metric (quota count) and
          endpoint (adjudicate) from constraint_event_extension_boundary.
        test_recipe:
          setup:
            - "ACTIVE GDP rate 6, window 13:00-15:00Z (12 slots; slot 14:50 is the single GA-reserved slot); one carrier flight F1(13:05) slotted at 13:00"
            - "GA operator Golf Aviation (GENERAL_AVIATION)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/operators"
              payload: { name: "Alpha Air", operator_type: "SCHEDULED_CARRIER" }
              as: SystemAdministrator
              captures: { op_a: $.data.id }
            - call: "POST /atfm/operators"
              payload: { name: "Golf Aviation", operator_type: "GENERAL_AVIATION", cdm_member: false }
              as: SystemAdministrator
              captures: { op_ga: $.data.id }
            - call: "POST /atfm/facilities/${fac}/capacity-forecasts"
              payload: { variant: "PLANNING", window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T15:00:00Z" }
              as: FlowManager
              captures: { fc: $.data.id }
            - call: "POST /atfm/capacity-forecasts/${fc}/publish"
              as: FlowManager
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "GROUND_DELAY_PROGRAM", program_start: "2026-09-15T13:00:00Z", program_end: "2026-09-15T15:00:00Z", controlled_rate: 6 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { tmi: $.data.id }
            - call: "POST /atfm/tmis/${tmi}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL1", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:05:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { f1: $.data.id }
            - call: "POST /atfm/tmis/${tmi}/activate"
              as: FlowManager
            - call: "POST /atfm/operators/${op_ga}/ga-requests"
              payload: { tmi_id: "${tmi}", requested_window_start: "2026-09-15T14:30:00Z", requested_window_end: "2026-09-15T15:00:00Z", priority_class: "STANDARD" }
              as: Operator
              as_user_id: "${op_ga}"
              captures: { gq1: $.data.id }
            - call: "POST /atfm/operators/${op_ga}/ga-requests"
              payload: { tmi_id: "${tmi}", requested_window_start: "2026-09-15T14:30:00Z", requested_window_end: "2026-09-15T15:00:00Z", priority_class: "HIGH_PRIORITY" }
              as: Operator
              as_user_id: "${op_ga}"
              captures: { gq2: $.data.id }
          trigger:
            - call: "POST /atfm/ga-requests/${gq1}/adjudicate"
              payload: { decision: "ACCOMMODATE" }
              as: FlowManager
              captures: { gq1_status: $.data.status, gq1_slot: $.data.accommodated_slot_time }
            - call: "POST /atfm/ga-requests/${gq2}/adjudicate"
              payload: { decision: "ACCOMMODATE" }
              as: FlowManager
              captures: { gq2_status: $.data.status }
          assert:
            - "gq1_status == ACCOMMODATED and gq1_slot == 2026-09-15T14:50:00Z (the single reserved slot; count 0 < 1 admitted)"
            - "gq2_status == WAITLISTED (accommodated_count 1 == reserved_slots 1: headroom predicate 1 < 1 is false)"
            - "A Flight was created for gq1 with designator 'GA-' + gq1.id[:8], scheduled_arrival == 2026-09-15T14:30:00Z, control_status == SLOTTED"
            - "Boundary is exact: reserved_slots == 1 admits exactly one accommodation before waitlisting"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: activation_requires_published_forecast
        grounds:
          - state_machines.TrafficManagementInitiative.PUBLISHED_to_ACTIVE
          - state_machines.CapacityForecast
        distinguishing_aspect: |
          Entity pair TMI x CapacityForecast: publish and activate of a GDP are gated on
          the EXISTENCE of a PUBLISHED non-STALE PLANNING forecast covering the window —
          missing forecast blocks publish; a forecast turned STALE by a later confirmed
          event blocks activate. Distinct pair from reroute_blocked_by_sector_outage
          (RerouteAssignment x Facility).
        test_recipe:
          setup:
            - "Facility base 30; GDP rate 6 PROPOSED over 13:00-15:00Z; no forecast exists yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "GROUND_DELAY_PROGRAM", program_start: "2026-09-15T13:00:00Z", program_end: "2026-09-15T15:00:00Z", controlled_rate: 6 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { tmi: $.data.id }
          trigger:
            - call: "POST /atfm/tmis/${tmi}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
              captures: { err_no_fc: $.data.error_id }
            - call: "POST /atfm/facilities/${fac}/capacity-forecasts"
              payload: { variant: "PLANNING", window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T15:00:00Z" }
              as: FlowManager
              captures: { fc: $.data.id }
            - call: "POST /atfm/capacity-forecasts/${fc}/publish"
              as: FlowManager
            - call: "POST /atfm/tmis/${tmi}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
              captures: { tmi_status: $.data.status }
            - call: "POST /atfm/facilities/${fac}/constraint-events"
              payload: { event_type: "WEATHER", severity: 1, window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T15:00:00Z" }
              as: FlowManager
              captures: { ev: $.data.id }
            - call: "POST /atfm/constraint-events/${ev}/confirm"
              as: FlowManager
            - call: "POST /atfm/tmis/${tmi}/activate"
              as: FlowManager
              captures: { err_stale: $.data.error_id }
          assert:
            - "err_no_fc == ERR_NO_CURRENT_FORECAST (publish blocked: no covering PLANNING forecast exists)"
            - "tmi_status == PUBLISHED after the forecast is published (gate satisfied)"
            - "the confirm cascades the forecast to STALE (TMI only PUBLISHED, not ACTIVE -> no downgrade)"
            - "err_stale == ERR_NO_CURRENT_FORECAST (activate blocked: the only forecast is now STALE)"
            - "TMI remains PUBLISHED after the failed activate"

      - name: reroute_blocked_by_sector_outage
        grounds:
          - state_machines.Facility
          - entities.RerouteAssignment.fields.via_sector_id
          - errors[ERR_FACILITY_NOT_OPERATIONAL]
        distinguishing_aspect: |
          Entity pair RerouteAssignment x Facility: assignment is gated on the SECTOR's
          status — OUTAGE rejects with ERR_FACILITY_NOT_OPERATIONAL while DEGRADED admits.
          Distinct pair from activation_requires_published_forecast
          (TMI x CapacityForecast).
        test_recipe:
          setup:
            - "Facility KEWR (AIRPORT) and sector ZDC42 (EN_ROUTE_SECTOR, rate 2); REROUTE TMI ACTIVE 13:00-15:00Z; flight X1 (op_a) UNCONTROLLED, ETA 13:30"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/facilities"
              payload: { ident: "ZDC42", facility_type: "EN_ROUTE_SECTOR", base_acceptance_rate: 2 }
              as: SystemAdministrator
              captures: { zdc: $.data.id }
            - call: "POST /atfm/operators"
              payload: { name: "Alpha Air", operator_type: "SCHEDULED_CARRIER" }
              as: SystemAdministrator
              captures: { op_a: $.data.id }
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AALX1", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:30:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { x1: $.data.id }
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "REROUTE", program_start: "2026-09-15T13:00:00Z", program_end: "2026-09-15T15:00:00Z" }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { r1: $.data.id }
            - call: "POST /atfm/tmis/${r1}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
            - call: "POST /atfm/tmis/${r1}/activate"
              as: FlowManager
            - call: "PATCH /atfm/facilities/${zdc}"
              payload: { status: "OUTAGE" }
              as: SystemAdministrator
          trigger:
            - call: "POST /atfm/tmis/${r1}/reroute-assignments"
              payload: { flight_id: "${x1}", via_sector_id: "${zdc}", assigned_route: "J60" }
              as: FlowManager
              captures: { err: $.data.error_id }
            - call: "PATCH /atfm/facilities/${zdc}"
              payload: { status: "DEGRADED" }
              as: SystemAdministrator
            - call: "POST /atfm/tmis/${r1}/reroute-assignments"
              payload: { flight_id: "${x1}", via_sector_id: "${zdc}", assigned_route: "J60" }
              as: FlowManager
              captures: { ra_bucket: $.data.hourly_bucket }
          assert:
            - "err == ERR_FACILITY_NOT_OPERATIONAL while ZDC42 is OUTAGE"
            - "DEGRADED admits the same assignment (only OUTAGE blocks): 201 with ra_bucket == 2026-09-15T13:00:00Z"

  - rule_id: resource_temporal_overlap
    instances:
      - name: constraint_event_half_open_adjacency
        grounds:
          - validations[priority=13]
          - errors[ERR_CONSTRAINT_EVENT_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open [start, end) point-overlap on ConstraintEvents of
          the SAME event_type — adjacency (new.start == existing.end) is ACCEPTED while a
          one-minute earlier start is rejected; a different event_type over the same
          window is accepted. Distinct semantics and resource from
          tmi_aggregate_capacity_coexistence (aggregate capacity on TMIs).
        test_recipe:
          setup:
            - "Facility KEWR; REPORTED WEATHER event E1 covering [13:00, 15:00)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/facilities/${fac}/constraint-events"
              payload: { event_type: "WEATHER", severity: 2, window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T15:00:00Z" }
              as: FlowManager
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /atfm/facilities/${fac}/constraint-events"
              payload: { event_type: "WEATHER", severity: 3, window_start: "2026-09-15T15:00:00Z", window_end: "2026-09-15T17:00:00Z" }
              as: FlowManager
              captures: { e2: $.data.id }
            - call: "POST /atfm/facilities/${fac}/constraint-events"
              payload: { event_type: "WEATHER", severity: 1, window_start: "2026-09-15T14:59:00Z", window_end: "2026-09-15T17:00:00Z" }
              as: FlowManager
              captures: { err: $.data.error_id }
            - call: "POST /atfm/facilities/${fac}/constraint-events"
              payload: { event_type: "STAFFING", severity: 2, window_start: "2026-09-15T14:00:00Z", window_end: "2026-09-15T16:00:00Z" }
              as: FlowManager
              captures: { e4: $.data.id }
          assert:
            - "E2 (start == E1.end exactly) is created (201) — adjacency is not overlap under half-open semantics"
            - "err == ERR_CONSTRAINT_EVENT_OVERLAP for E3 (one minute earlier, [14:59,15:00) intersects E1)"
            - "E4 (STAFFING over a fully overlapping window) is created (201) — the rule is scoped to same event_type only"

      - name: tmi_aggregate_capacity_coexistence
        grounds:
          - validations[priority=14]
          - calculations.max_feasible_rate
          - errors[ERR_TMI_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: aggregate-capacity coexistence on TMIs — an AFP and a GDP
          may overlap the same facility window while their combined rates fit under
          capacity, but a second GDP overlapping the first is hard-rejected regardless of
          headroom. Distinct semantics (capacity-weighted intersection vs half-open point
          overlap) and resource (TMI vs ConstraintEvent) from
          constraint_event_half_open_adjacency.
        test_recipe:
          setup:
            - "Facility base 30; PLANNING forecast 13:00-16:00Z predicted 30 PUBLISHED"
            - "AFP rate 4 ACTIVE over 13:00-16:00Z; GDP-1 rate 6 ACTIVE over 13:00-15:00Z (coexistence already proven)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/facilities/${fac}/capacity-forecasts"
              payload: { variant: "PLANNING", window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T16:00:00Z" }
              as: FlowManager
              captures: { fc: $.data.id }
            - call: "POST /atfm/capacity-forecasts/${fc}/publish"
              as: FlowManager
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "AIRSPACE_FLOW_PROGRAM", program_start: "2026-09-15T13:00:00Z", program_end: "2026-09-15T16:00:00Z", controlled_rate: 4 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { afp1: $.data.id }
            - call: "POST /atfm/tmis/${afp1}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
            - call: "POST /atfm/tmis/${afp1}/activate"
              as: FlowManager
              captures: { afp1_status: $.data.status }
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "GROUND_DELAY_PROGRAM", program_start: "2026-09-15T13:00:00Z", program_end: "2026-09-15T15:00:00Z", controlled_rate: 6 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { gdp1: $.data.id }
            - call: "POST /atfm/tmis/${gdp1}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
            - call: "POST /atfm/tmis/${gdp1}/activate"
              as: FlowManager
              captures: { gdp1_status: $.data.status }
          trigger:
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "GROUND_DELAY_PROGRAM", program_start: "2026-09-15T14:00:00Z", program_end: "2026-09-15T16:00:00Z", controlled_rate: 6 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "AIRSPACE_FLOW_PROGRAM", program_start: "2026-09-15T14:00:00Z", program_end: "2026-09-15T15:00:00Z", controlled_rate: 60 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { afp2: $.data.id }
            - call: "POST /atfm/tmis/${afp2}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
              captures: { err_cap: $.data.error_id }
          assert:
            - "afp1_status == ACTIVE and gdp1_status == ACTIVE (AFP 4 + GDP 6 coexist: 6 <= max(0, min(30,30) - 4) = 26)"
            - "err_overlap == ERR_TMI_OVERLAP (second GDP over [14:00,16:00) intersects GDP-1's [13:00,15:00) — hard reject regardless of rate headroom)"
            - "err_cap == ERR_RATE_EXCEEDS_CAPACITY (AFPs skip the exclusivity rule but not the aggregate gate: 60 > 26)"

  - rule_id: compensating_invariant
    instances:
      - name: substitution_conserves_slot_inventory
        grounds:
          - state_machines.ArrivalSlot
          - entities.SlotTransaction.fields.transaction_type
        distinguishing_aspect: |
          Conserved quantity: the assigned-slot inventory. A substitution swaps two CTAs
          but MUST leave the multiset of ASSIGNED slot_times and the count of ASSIGNED
          slots bit-identical — even though attributed delay moves (10 -> 25 for the
          operator). Distinct conserved quantity (slot multiset) from
          cancel_restores_delay_ledgers (global delay-delta sum).
        test_recipe:
          setup:
            - "ACTIVE GDP rate 6, window 13:00-15:00Z; F1(13:05),F2(13:10),F3(13:20) op_a slotted at 13:00/13:10/13:30; F4(13:15),F5(13:26) op_b at 13:20/13:40"
            - "Both substitution flights have fresh data (last_eta_reported_at == clock 12:00)"
          setup_api_calls:
