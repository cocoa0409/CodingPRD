  - section: validations
    instances:
      - name: same_player_on_a_second_team_of_one_league_returns_409_duplicate_roster_spot
        claim_type: Violation → Error
        grounds:
          - validations.priority_44_ERR_DUPLICATE_ROSTER_SPOT
          - complexity_profile.entity_topology.graph
        distinguishing_aspect: "RosterSpot is the Team-to-Player junction and its uniqueness scope is the LEAGUE, not the team: the second team of the same district league may not sign a player who already holds a PENDING, ACTIVE or INELIGIBLE spot anywhere in that league. An implementation that enforces uniqueness per (team_id, player_id) accepts this request, which is exactly the roster-raiding hole the rule closes."
        test_recipe:
          setup:
            - "One district league with two DRAFT teams. Player pa1 already holds an ACTIVE spot on team A. Team B has just been created by its own captain and holds no spots, so its version is still 1."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_fac
            - *a_lgp
            - *a_lgp_open
            - *a_lg
            - *a_lg_open
            - *a_pa1
            - *a_ra1
            - *a_tma
            - *a_xa1
            - *a_ya1
            - *a_pb1
            - *a_rb1
            - *a_tmb
          trigger:
            - call: "POST /tennis/roster-spots"
              payload: {team_id: "${tmb_id}", player_id: "${pa1_id}", expected_team_version: "${tmb_v0}"}
              as: Captain
              as_user_id: "${pb1_id}"
          assert:
            - "HTTP 409"
            - "$.data.error_id == 'ERR_DUPLICATE_ROSTER_SPOT'"
            - "a follow-up GET /tennis/roster-spots with team_id=${tmb_id} returns $.data.total_count == 0"
            - "a follow-up GET /tennis/teams/${tmb_id} returns $.data.version == 1 and $.data.active_roster_size == 0"
            - "a follow-up GET /tennis/roster-spots with player_id=${pa1_id} returns $.data.total_count == 1"

      - name: unresolvable_player_fk_beats_a_stale_team_version_and_returns_404_reference_not_found
        claim_type: Priority Ordering
        grounds:
          - validations.priority_11_ERR_REFERENCE_NOT_FOUND
          - validations.priority_18_ERR_STALE_TEAM_VERSION
        distinguishing_aspect: "Two rules are violated by one request: the payload names a player id that does not exist (priority 11) and carries the team version from before the first roster add, which is now two writes stale (priority 18). The lower priority number must win, so the answer is 404 ERR_REFERENCE_NOT_FOUND and never 412 ERR_STALE_TEAM_VERSION — an implementation that checks the optimistic-concurrency guard before resolving foreign keys returns the wrong code and the wrong status class."
        test_recipe:
          setup:
            - "Team A was created at version 1, then one roster spot was added and activated, so Team.version is now 3 while the captured tma_v0 still holds 1."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_fac
            - *a_lgp
            - *a_lgp_open
            - *a_lg
            - *a_lg_open
            - *a_pa1
            - *a_ra1
            - *a_tma
            - *a_xa1
            - *a_ya1
          trigger:
            - call: "POST /tennis/roster-spots"
              payload: {team_id: "${tma_id}", player_id: "9f0d1c2b-0000-4000-8000-00000000dead", expected_team_version: "${tma_v0}"}
              as: Captain
              as_user_id: "${pa1_id}"
          assert:
            - "HTTP 404"
            - "$.data.error_id == 'ERR_REFERENCE_NOT_FOUND'"
            - "$.data.error_id != 'ERR_STALE_TEAM_VERSION'"
            - "$.data.error_id != 'ERR_NOT_FOUND'"
            - "a follow-up GET /tennis/teams/${tma_id} returns $.data.version == 3 and $.data.active_roster_size == 1"

      - name: roster_spot_naming_a_player_of_another_section_returns_404_section_scope_mismatch
        claim_type: Cross-entity validation
        grounds:
          - validations.priority_12_ERR_SECTION_SCOPE_MISMATCH
          - validations.priority_11_ERR_REFERENCE_NOT_FOUND
        distinguishing_aspect: "The referenced player row exists and the version is current, so the only defect is that the player belongs to a different Section than the team's league. That is a scope leak, answered 404 ERR_SECTION_SCOPE_MISMATCH — deliberately indistinguishable in status from a missing row so cross-section existence cannot be probed — and it must NOT be reported as ERR_REFERENCE_NOT_FOUND (priority 11 resolves the row successfully) nor as a 422."
        test_recipe:
          setup:
            - "Two sections exist. Team A lives in the SOCAL district league; player px1 is registered in NORCAL. Team A's current version is read immediately before the trigger."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_fac
            - *a_lgp
            - *a_lgp_open
            - *a_lg
            - *a_lg_open
            - *a_pa1
            - *a_ra1
            - *a_tma
            - *a_xa1
            - *a_ya1
            - *a_gta2
            - *a_sec2
            - &a_px1
              call: "POST /tennis/players"
              payload: {section_id: "${sec2_id}", full_name: "Rex Ringer", birth_year: 1990, gender: "M"}
              as: SectionAdmin
              captures: {px1_id: "$.data.id"}
          trigger:
            - call: "POST /tennis/roster-spots"
              payload: {team_id: "${tma_id}", player_id: "${px1_id}", expected_team_version: "${tma_v2}"}
              as: Captain
              as_user_id: "${pa1_id}"
          assert:
            - "HTTP 404"
            - "$.data.error_id == 'ERR_SECTION_SCOPE_MISMATCH'"
            - "$.data.error_id != 'ERR_REFERENCE_NOT_FOUND'"
            - "a follow-up GET /tennis/players/${px1_id} returns HTTP 200 — the row exists, it is only out of scope"
            - "a follow-up GET /tennis/roster-spots with team_id=${tma_id} returns $.data.total_count == 1"
            - "a follow-up GET /tennis/teams/${tma_id} returns $.data.version == 3"

