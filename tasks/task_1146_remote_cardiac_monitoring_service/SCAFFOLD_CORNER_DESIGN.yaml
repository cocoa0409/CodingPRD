      - name: gateway_cannot_read_business_resources_forbidden
        claim_type: rbac_denial
        grounds: ["roles[DeviceGateway]"]
        distinguishing_aspect: "DeviceGateway is restricted to its data-plane surface: GET /v1/alerts yields 403 ERR_FORBIDDEN_ROLE."
