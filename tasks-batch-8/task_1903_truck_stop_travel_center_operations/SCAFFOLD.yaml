# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: FuelPrice
    field: status
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system cascade from POST /sites/{id}/fuel-prices (new overlapping same-fuel price whose effective_from <= existing.effective_from window coverage)"
        actor: system
        preconditions:
          - "New FuelPrice window [new.effective_from, new.effective_to) fully covers the existing window start (existing.effective_from >= new.effective_from)"
        side_effects:
          - "Existing price status -> SUPERSEDED"
          - "Site retail mirror fields recomputed (derived field reconciliation)"
        note: "An overlapping older price with effective_from < new.effective_from is truncated instead: its effective_to is set to new.effective_from and it stays ACTIVE. A new price whose effective_from exactly equals an existing ACTIVE same-fuel price's effective_from is rejected with ERR_OVERLAPPING_PRICE_WINDOW (duplicate start)."

  - entity: Pump
    field: status
    initial_state: IDLE
    terminal_states: []
    transitions:
      - from: IDLE
        to: IN_USE
        trigger: "system cascade from POST /sites/{id}/fuel-sales (authorize)"
        actor: system
        preconditions: []
        side_effects:
          - "Pump reserved for the new FuelSale"
      - from: IN_USE
        to: IDLE
        trigger: "system cascade from POST /fuel-sales/{id}/dispensing-complete or POST /fuel-sales/{id}/void"
        actor: system
        preconditions: []
        side_effects:
          - "Pump freed; available for the next authorization"
      - from: IDLE
        to: OUT_OF_SERVICE
        trigger: "POST /pumps/{id}/out-of-service"
        actor: FuelDeskLead
        preconditions:
          - "Pump has no non-voided FuelSale in AUTHORIZED/FUELING/PENDING_FINALIZE"
        side_effects: []
      - from: OUT_OF_SERVICE
        to: IDLE
        trigger: "POST /pumps/{id}/return-to-service"
        actor: FuelDeskLead
        preconditions: []
        side_effects: []

  - entity: FuelSale
    field: status
    initial_state: AUTHORIZED
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: AUTHORIZED
        to: FUELING
        trigger: "POST /fuel-sales/{id}/dispensing-start"
        actor: Cashier
        preconditions:
          - "FuelSale.status == AUTHORIZED"
        side_effects: []
      - from: FUELING
        to: PENDING_FINALIZE
        trigger: "POST /fuel-sales/{id}/dispensing-complete"
        actor: Cashier
        preconditions:
          - "dispensed_gallons > 0 and <= FuelSale.max_gallons"
        side_effects:
          - "FuelSale.dispensed_gallons set"
          - "Pump (FuelSale.pump_id) IN_USE -> IDLE"
      - from: PENDING_FINALIZE
        to: COMPLETED
        trigger: "POST /fuel-sales/{id}/finalize"
        actor: Cashier
        preconditions:
          - "If loyalty_member_id set and requested_redeem_points > 0: member status ACTIVE and redeemable balance >= requested_redeem_points (re-checked; expiry may have drained it)"
        side_effects:
          - "final_unit_price_cents recomputed from pinned snapshots (calc fuel_sale_finalization)"
          - "fuel_amount_cents, total_cents computed; finalized_at stamped"
          - "Loyalty debit: points_redeemed burned FEFO from member lots (calc loyalty_points_accrual)"
          - "Loyalty credit: points_earned granted as new lot expiring now + 360 days; member.points_balance recomputed"
          - "CONTRACT: FleetContract.volume_delivered_gallons += dispensed_gallons"
          - "CONTRACT cascade hop 2: FleetAccount.rolling_30d_gallons recomputed"
          - "CONTRACT cascade hop 3: fleet_tier_recompute may flip FleetAccount.pricing_tier when a 5000/20000 gal breakpoint is crossed"
      - from: [AUTHORIZED, FUELING, PENDING_FINALIZE]
        to: VOIDED
        trigger: "POST /fuel-sales/{id}/void"
        actor: ShiftManager
        preconditions:
          - "FuelSale.payment_status == UNPAID"
        side_effects:
          - "Pump freed if still IN_USE for this sale"
          - "No money or points move (nothing was charged or accrued)"
      - from: COMPLETED
        to: VOIDED
        trigger: "POST /fuel-sales/{id}/void (refund-void)"
        actor: ShiftManager
        preconditions:
          - "FuelSale.payment_status in {PAID, BILLED, UNPAID}"
        side_effects:
          - "payment_status -> REFUNDED when it was PAID or BILLED; stays UNPAID when UNPAID"
          - "CASH refund: Shift.expected_cash_cents -= total_cents; Register.posture recomputed"
          - "BILLED refund: FleetAccount.current_balance_cents -= total_cents"
          - "Loyalty reversal: new ADJUSTMENT lot of +points_redeemed (expires now + 360d) and negative lot of -points_earned applied newest-first"
          - "CONTRACT: FleetContract.volume_delivered_gallons -= dispensed_gallons; FleetAccount.rolling_30d_gallons recomputed; fleet_tier_recompute re-evaluated"

  - entity: FuelSale
    field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /fuel-sales/{id}/pay with tender CASH or CARD"
        actor: Cashier
        preconditions:
          - "FuelSale.status == COMPLETED"
          - "tender_type in {CASH, CARD}"
          - "CASH: FuelSale.shift_id shift is OPEN"
        side_effects:
          - "CASH: Shift.expected_cash_cents += total_cents"
          - "CASH: Register.posture recomputed (may cross NEEDS_DROP trigger at 5x float)"
      - from: UNPAID
        to: BILLED
        trigger: "POST /fuel-sales/{id}/pay with tender FLEET_BILLING"
        actor: Cashier
        preconditions:
          - "FuelSale.status == COMPLETED"
          - "pricing_mode == CONTRACT"
        side_effects:
          - "FleetAccount.current_balance_cents += total_cents"
      - from: [PAID, BILLED]
        to: REFUNDED
        trigger: "POST /fuel-sales/{id}/void (refund-void cascade)"
        actor: ShiftManager
        preconditions: []
        side_effects:
          - "See FuelSale status machine COMPLETED -> VOIDED for the reversal cascade"

  - entity: FleetAccount
    field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CREDIT_HOLD
        trigger: "POST /fleet-accounts/{id}/credit-hold"
        actor: GeneralManager
        preconditions: []
        side_effects:
          - "Blocks new CONTRACT fuel sale authorizations and fleet work-order estimate approvals"
      - from: CREDIT_HOLD
        to: ACTIVE
        trigger: "POST /fleet-accounts/{id}/credit-reinstate"
        actor: GeneralManager
        preconditions: []
        side_effects: []
      - from: [ACTIVE, CREDIT_HOLD]
        to: CLOSED
        trigger: "POST /fleet-accounts/{id}/close"
        actor: GeneralManager
        preconditions:
          - "current_balance_cents == 0"
        side_effects:
          - "Non-terminal FleetContracts of this fleet (PENDING, ACTIVE, SUSPENDED) -> TERMINATED"

  - entity: FleetContract
    field: status
    initial_state: PENDING
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /contracts/{id}/activate"
        actor: GeneralManager
        preconditions:
          - "effective_from <= current clock < effective_to"
          - "FleetAccount.status == ACTIVE"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /contracts/{id}/suspend"
        actor: GeneralManager
        preconditions: []
        side_effects:
          - "Blocks new authorizations quoting this contract"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /contracts/{id}/resume"
        actor: GeneralManager
        preconditions:
          - "effective_from <= current clock < effective_to"
          - "FleetAccount.status == ACTIVE"
        side_effects: []
      - from: [ACTIVE, SUSPENDED]
        to: EXPIRED
        trigger: "POST /contracts/{id}/expire"
        actor: GeneralManager
        preconditions: []
        side_effects: []
      - from: [PENDING, ACTIVE, SUSPENDED]
        to: TERMINATED
        trigger: "POST /contracts/{id}/terminate or system cascade (fleet closed)"
        actor: "GeneralManager or system"
        preconditions: []
        side_effects: []

  - entity: DiscountNetworkProgram
    field: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /discount-networks/{id}/activate"
        actor: GeneralManager
        preconditions: []
        side_effects:
          - "Enrollments may now activate against this network"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /discount-networks/{id}/retire"
        actor: GeneralManager
        preconditions: []
        side_effects:
          - "Cascade: all enrollments of this network in PENDING/ACTIVE/SUSPENDED -> RETIRED"
          - "Retired network no longer contributes discounts to retail quotes"

  - entity: DiscountNetworkEnrollment
    field: status
    initial_state: PENDING
    terminal_states: [RETIRED, CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /discount-enrollments/{id}/activate"
        actor: Cashier
        preconditions:
          - "DiscountNetworkProgram.status == ACTIVE"
          - "LoyaltyMember.status == ACTIVE"
          - "No other enrollment of the same member in the same network in {PENDING, ACTIVE, SUSPENDED}"
          - "Count of ACTIVE enrollments in the network < program_cap"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /discount-enrollments/{id}/suspend"
        actor: GeneralManager
        preconditions: []
        side_effects:
          - "Suspended enrollment does not contribute discount and does not count toward program_cap"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /discount-enrollments/{id}/resume"
        actor: GeneralManager
        preconditions:
          - "DiscountNetworkProgram.status == ACTIVE"
          - "Count of ACTIVE enrollments in the network < program_cap"
        side_effects: []
      - from: [PENDING, ACTIVE, SUSPENDED]
        to: CANCELLED
        trigger: "POST /discount-enrollments/{id}/cancel"
        actor: "LoyaltyMember (self) or GeneralManager"
        preconditions: []
        side_effects: []
      - from: [PENDING, ACTIVE, SUSPENDED]
        to: RETIRED
        trigger: "system cascade (network retired)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LoyaltyMember
    field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /loyalty-members/{id}/suspend"
        actor: GeneralManager
        preconditions: []
        side_effects:
          - "Suspended members cannot redeem points or earn; enrollments keep their own status"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /loyalty-members/{id}/reactivate"
        actor: GeneralManager
        preconditions: []
        side_effects: []
      - from: [ACTIVE, SUSPENDED]
        to: CLOSED
        trigger: "POST /loyalty-members/{id}/close"
        actor: GeneralManager
        preconditions: []
        side_effects:
          - "All enrollments in PENDING/ACTIVE/SUSPENDED -> CANCELLED"
          - "Remaining points lots are forfeited (points_balance recomputed to 0)"

  - entity: ParkingReservation
    field: status
    initial_state: CONFIRMED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: CONFIRMED
        to: ACTIVE
        trigger: "POST /parking-reservations/{id}/check-in"
        actor: Cashier
        preconditions:
          - "reserved_from <= current clock <= reserved_from + 2 hours"
          - "payment_status == UNPAID"
        side_effects:
          - "Space assignment selector: eligible = ParkingSpace of site with space_type == reservation.space_type AND status == ACTIVE AND is_reservable == true AND no other reservation in {ACTIVE} assigned to it; ranked by space_number ASC; empty pool -> ERR_PARKING_CAPACITY_FULL"
          - "assigned_space_id set; checked_in_at stamped"
          - "Charge amount_cents: tender CASH -> Shift(shift_id).expected_cash_cents += amount_cents and Register.posture recomputed; tender CARD -> no cash effect"
          - "payment_status -> PAID"
          - "Loyalty earn: lot of round_half_up(amount_cents/100 x 1.0) points (source PARKING) when loyalty member present"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /parking-reservations/{id}/check-out"
        actor: Cashier
        preconditions: []
        side_effects:
          - "checked_out_at stamped; assigned space freed"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /parking-reservations/{id}/cancel"
        actor: "Cashier or LoyaltyMember (self)"
        preconditions:
          - "payment_status == UNPAID"
        side_effects:
          - "Capacity released (reservation stops counting toward parking_paid_capacity overlap counts)"
          - "If points were burned at creation: re-credit as new ADJUSTMENT lot of +redeemed points (expires now + 360d)"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /parking-reservations/{id}/cancel (early departure)"
        actor: Cashier
        preconditions:
          - "payment_status == PAID"
        side_effects:
          - "payment_status -> REFUNDED; full amount refunded"
          - "CASH refund: Shift.expected_cash_cents -= amount_cents; Register.posture recomputed"
          - "Loyalty reversal: negative lot of -earned points (newest-first)"
          - "assigned space freed"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /parking-reservations/{id}/no-show (requires current clock > reserved_from + 2 hours)"
        actor: "Cashier or ShiftManager"
        preconditions:
          - "current clock > reserved_from + 2 hours"
        side_effects:
          - "Capacity released"

  - entity: ServiceQueueTicket
    field: status
    initial_state: QUEUED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: QUEUED
        to: CALLED
        trigger: "POST /sites/{id}/service-queue/call"
        actor: Cashier
        preconditions:
          - "Selector: eligible = tickets with status QUEUED, same site, same service_type; rank queue_position ASC; empty pool -> ERR_QUEUE_EMPTY"
        side_effects:
          - "called_at stamped"
      - from: CALLED
        to: ACTIVE
        trigger: "POST /service-tickets/{id}/start"
        actor: Cashier
        preconditions:
          - "Active-capacity check: count of ACTIVE tickets of same service_type at site < site capacity (shower_units_count or laundry_machines_count); when at capacity, preemption is attempted (below); when no ticket is preemptable -> ERR_QUEUE_CAPACITY"
        side_effects:
          - "started_at stamped"
          - "Preemption when at capacity: candidate = ACTIVE ticket of same service_type with the longest elapsed (now - started_at); tie broken by earliest created_at; preemptable only when its elapsed >= 15 minutes; preempted ticket ACTIVE -> NO_SHOW"
      - from: CALLED
        to: NO_SHOW
        trigger: "POST /service-tickets/{id}/no-show"
        actor: Cashier
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: NO_SHOW
        trigger: "system cascade (preemption by a new start when at capacity)"
        actor: system
        preconditions: []
        side_effects:
          - "Preempted ticket forfeits its place; may only requeue from NO_SHOW"
      - from: NO_SHOW
        to: QUEUED
        trigger: "POST /service-tickets/{id}/requeue"
        actor: Cashier
        preconditions: []
        side_effects:
          - "queue_position reassigned to 1 + current max queue_position for the site+service_type (goes to the back)"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /service-tickets/{id}/complete"
        actor: Cashier
        preconditions:
          - "SHOWER requires shower_minutes input > 0; LAUNDRY requires laundry_lbs > 0"
        side_effects:
          - "completed_at stamped; water_gallons computed (calc water_usage); TravelCenterSite.water_usage_gallons += water_gallons"
          - "Loyalty earn when member present: lot of round_half_up(total_price_cents/100 x 1.0) points (source SERVICE)"
      - from: [QUEUED, CALLED]
        to: CANCELLED
        trigger: "POST /service-tickets/{id}/cancel"
        actor: "Cashier or LoyaltyMember (self)"
        preconditions: []
        side_effects:
          - "If points were burned at creation: re-credit as new ADJUSTMENT lot of +redeemed points (expires now + 360d)"
          - "If payment_status == PAID: payment_status -> REFUNDED; CASH refund decrements Shift.expected_cash_cents"

  - entity: ServiceQueueTicket
    field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /service-tickets/{id}/pay"
        actor: Cashier
        preconditions:
          - "status in {CALLED, ACTIVE, COMPLETED}"
          - "CASH tender: ticket shift is OPEN"
        side_effects:
          - "CASH: Shift.expected_cash_cents += total_price_cents; Register.posture recomputed"
      - from: PAID
        to: REFUNDED
        trigger: "system cascade from POST /service-tickets/{id}/cancel"
        actor: system
        preconditions: []
        side_effects:
          - "Cash refund applied against the ticket's shift"

  - entity: ScaleTicket
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED, REFUNDED]
    transitions:
      - from: OPEN
        to: PAID
        trigger: "POST /scale-tickets/{id}/settle"
        actor: Cashier
        preconditions:
          - "At least 1 GROSS and at least 1 TARE weigh event recorded (else ERR_SCALE_NOT_CERTIFIABLE)"
          - "CASH tender: ticket shift is OPEN"
        side_effects:
          - "Charge 1250 cents first-weigh fee + 400 cents certified fee iff certified == true (REWEIGH events are always free)"
          - "total_paid_cents set; CASH: Shift.expected_cash_cents += total_paid_cents; Register.posture recomputed"
      - from: PAID
        to: CLOSED
        trigger: "POST /scale-tickets/{id}/close"
        actor: Cashier
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "POST /scale-tickets/{id}/cancel"
        actor: "Cashier or ShiftManager"
        preconditions:
          - "total_paid_cents == 0"
        side_effects: []
      - from: PAID
        to: REFUNDED
        trigger: "POST /scale-tickets/{id}/cancel (paid cancel)"
        actor: ShiftManager
        preconditions: []
        side_effects:
          - "refund_total_cents += total_paid_cents"
          - "CASH refund: Shift.expected_cash_cents -= refund amount; Register.posture recomputed"

  - entity: WorkOrder
    field: status
    initial_state: CREATED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: CREATED
        to: ESTIMATED
        trigger: "POST /work-orders/{id}/estimate"
        actor: MaintenanceTech
        preconditions: []
        side_effects:
          - "labor_hours_est recorded"
      - from: ESTIMATED
        to: APPROVED
        trigger: "POST /work-orders/{id}/approve-estimate"
        actor: "GeneralManager (retail) or FleetManager (fleet-billed, own fleet only)"
        preconditions:
          - "Fleet-billed: FleetAccount.status == ACTIVE"
        side_effects: []
      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /work-orders/{id}/schedule"
        actor: "GeneralManager or MaintenanceTech"
        preconditions:
          - "Bay exists at site; Technician exists at site and status AVAILABLE"
          - "Half-open interval [scheduled_from, scheduled_to) does not overlap any non-terminal SCHEDULED/IN_SHOP/IN_PROGRESS WorkOrder of the same bay (ERR_BAY_DOUBLE_BOOKED)"
          - "Window does not touch any closed maintenance block of the bay: overlap iff scheduled_from <= block.blocked_to AND block.blocked_from <= scheduled_to (ERR_BAY_MAINTENANCE_CONFLICT)"
        side_effects:
          - "bay_id, technician_id, scheduled_from/to recorded"
      - from: SCHEDULED
        to: IN_SHOP
        trigger: "POST /work-orders/{id}/check-in"
        actor: MaintenanceTech
        preconditions:
          - "ShopBay.status == IDLE (ERR_BAY_OCCUPIED)"
        side_effects:
          - "ShopBay IDLE -> OCCUPIED"
      - from: IN_SHOP
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/start-work"
        actor: MaintenanceTech
        preconditions:
          - "Acting MaintenanceTech id == WorkOrder.technician_id"
        side_effects: []
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/dispatch-road"
        actor: "GeneralManager or MaintenanceTech"
        preconditions:
          - "Technician (payload) exists at site and status AVAILABLE"
        side_effects:
          - "is_road_service = true; road_location_text set; technician_id assigned; no bay consumed"
      - from: IN_PROGRESS
        to: WAITING_VENDOR
        trigger: "POST /work-orders/{id}/send-to-vendor"
        actor: MaintenanceTech
        preconditions:
          - "is_road_service == false (bay work only)"
        side_effects:
          - "vendor_out_reason recorded"
      - from: WAITING_VENDOR
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/return-from-vendor"
        actor: MaintenanceTech
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: READY_FOR_PICKUP
        trigger: "POST /work-orders/{id}/complete-work or POST /work-orders/{id}/road-complete (road only)"
        actor: MaintenanceTech
        preconditions:
          - "complete-work requires is_road_service == false and labor_hours_actual input > 0"
          - "road-complete requires is_road_service == true and labor_hours_actual input > 0"
        side_effects:
          - "Invoice computed (calc shop_invoice_total): parts_total, labor_total, environmental_fee, shop_supplies, invoice_total"
          - "Bay work: ShopBay OCCUPIED -> IDLE"
      - from: READY_FOR_PICKUP
        to: CLOSED
        trigger: "POST /work-orders/{id}/close"
        actor: "Cashier or GeneralManager"
        preconditions:
          - "payment_status == UNPAID"
          - "CASH tender: payload shift is OPEN"
          - "FLEET_BILLING tender: WorkOrder.fleet_account_id set and FleetAccount.status == ACTIVE and projected balance <= credit limit"
        side_effects:
          - "payment_status -> PAID (CASH/CARD) or BILLED (FLEET_BILLING)"
          - "CASH: Shift.expected_cash_cents += invoice_total_cents; Register.posture recomputed"
          - "FLEET_BILLING: FleetAccount.current_balance_cents += invoice_total_cents"
      - from: [CREATED, ESTIMATED, APPROVED, SCHEDULED, IN_SHOP, IN_PROGRESS, WAITING_VENDOR, READY_FOR_PICKUP]
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: "GeneralManager or MaintenanceTech"
        preconditions:
          - "payment_status == UNPAID"
        side_effects:
          - "All ISSUED parts fully returned to stock (StockItem.on_hand_quantity += quantity - returned_quantity; is_low_stock recomputed)"
          - "If bay occupied by this WO: ShopBay OCCUPIED -> IDLE"

  - entity: ShopBay
    field: status
    initial_state: IDLE
    terminal_states: []
    transitions:
      - from: IDLE
        to: OCCUPIED
        trigger: "system cascade from WorkOrder check-in"
        actor: system
        preconditions: []
        side_effects: []
      - from: OCCUPIED
        to: IDLE
        trigger: "system cascade from WorkOrder complete-work or cancel"
        actor: system
        preconditions: []
        side_effects: []
      - from: IDLE
        to: MAINTENANCE
        trigger: "POST /bays/{id}/maintenance-block"
        actor: "GeneralManager or MaintenanceTech"
        preconditions: []
        side_effects:
          - "Appends {blocked_from, blocked_to, reason} to maintenance_blocks (closed interval)"
      - from: MAINTENANCE
        to: IDLE
        trigger: "POST /bays/{id}/maintenance-clear"
        actor: "GeneralManager or MaintenanceTech"
        preconditions: []
        side_effects: []

  - entity: PurchaseOrder
    field: status
    initial_state: DRAFT
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /purchase-orders/{id}/approve"
        actor: GeneralManager
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: PARTIALLY_RECEIVED
        trigger: "POST /purchase-orders/{id}/receive with at least one line received and at least one line still open"
        actor: "GeneralManager or MaintenanceTech"
        preconditions:
          - "Received quantities per sku <= ordered quantity - already received"
        side_effects:
          - "StockItem (matched by site + sku) on_hand_quantity += received qty; is_low_stock recomputed"
          - "received_lines accumulated"
      - from: PARTIALLY_RECEIVED
        to: PARTIALLY_RECEIVED
        trigger: "POST /purchase-orders/{id}/receive with remaining lines still open (repeat partial receipt)"
        actor: "GeneralManager or MaintenanceTech"
        preconditions:
          - "Received quantities per sku <= ordered quantity - already received"
        side_effects:
          - "StockItem on_hand_quantity += received qty; is_low_stock recomputed"
      - from: [APPROVED, PARTIALLY_RECEIVED]
        to: RECEIVED
        trigger: "POST /purchase-orders/{id}/receive completing every line"
        actor: "GeneralManager or MaintenanceTech"
        preconditions:
          - "After this receipt every line is fully received"
        side_effects:
          - "StockItem on_hand_quantity += received qty; is_low_stock recomputed"
      - from: [DRAFT, APPROVED]
        to: CANCELLED
        trigger: "POST /purchase-orders/{id}/cancel"
        actor: GeneralManager
        preconditions: []
        side_effects: []

  - entity: Shift
    field: status
    initial_state: OPEN
    terminal_states: [LOCKED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /shifts/{id}/close"
        actor: ShiftManager
        preconditions:
          - "Acting ShiftManager X-User-ID != Shift.opened_by_manager_id (segregation of duties)"
          - "expected_cash_cents >= opening_float_cents (ERR_REMAINING_BELOW_FLOAT)"
          - "|counted - expected| > 500 requires approve_variance: true (ERR_COUNT_SHORTAGE_UNAPPROVED)"
        side_effects:
          - "ShiftReconciliation created (expected, counted, variance, resolution, deposit_total)"
          - "resolution = BALANCED when variance == 0; OVERAGE when > 0; SHORTAGE when < 0"
          - "SafeDeposit created when deposit_total_cents > 0"
          - "Register.posture recomputed (no OPEN shift -> OK)"
      - from: CLOSED
        to: RECONCILED
        trigger: "POST /shifts/{id}/reconcile"
        actor: ShiftManager
        preconditions:
          - "Acting ShiftManager X-User-ID != Shift.closed_by_manager_id (segregation of duties)"
        side_effects: []
      - from: RECONCILED
        to: LOCKED
        trigger: "POST /shifts/{id}/lock"
        actor: GeneralManager
        preconditions: []
        side_effects: []

  - entity: StoreSale
    field: status
    initial_state: COMPLETED
    terminal_states: [REFUNDED]
    transitions:
      - from: COMPLETED
        to: REFUNDED
        trigger: "POST /store-sales/{id}/refund"
        actor: ShiftManager
        preconditions: []
        side_effects:
          - "payment_status -> REFUNDED"
          - "Each line's StockItem.on_hand_quantity += line quantity; is_low_stock recomputed"
          - "Loyalty reversal: negative lot of -points_earned (newest-first)"
          - "CASH: Shift.expected_cash_cents -= total_cents; Register.posture recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: fuel-price-supersede-stale-site
    parent_entity: TravelCenterSite
    write_endpoint: "POST /sites/{id}/fuel-prices"
    occ_field: "expected_site_version"
    description: |
      Creating a FuelPrice against a TravelCenterSite whose version has advanced
      since the client last observed it is rejected. Creating a price legitimately
      supersedes or truncates existing ACTIVE prices of the same fuel type, so a
      writer working from a stale site read would silently double-supersede; the
      stale expected_site_version is refused instead.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: contract-amend-stale-version
    parent_entity: FleetContract
    write_endpoint: "PATCH /contracts/{id}"
    occ_field: "expected_contract_version"
    description: |
      Amending a FleetContract whose version has advanced since the client last
      observed it is rejected. An amendment changes discount_per_gallon_off or the
      effective window for future authorizations; a writer working from a stale
      contract read would silently overwrite the intervening amendment, so the
      stale expected_contract_version is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: retail_quote_cents_per_gallon
    trigger: "POST /sites/{id}/fuel-sales with pricing_mode RETAIL (at authorize; snapshots pinned; finalize re-evaluates from snapshots)"
    algorithm: threshold
    formula: |
      R = FuelPrice.retail_cents_per_gallon selected by: site_id match, fuel_type match,
          status == ACTIVE, effective_from <= now, (effective_to IS NULL OR now < effective_to).
          Exactly one row may match (creation overlap rules guarantee it); none -> ERR_NO_ACTIVE_PRICE.
      N = max over the member's enrollments with status ACTIVE whose network.status == ACTIVE
          and fuel_type in network.applicable_fuel_types of network.discount_per_gallon; 0 when none.
      P = min(requested_redeem_points, member.stack_cap_points)   # stack cap
      D = round_half_up(P x 0.005 x 100)                          # points discount in cents (0.5 cent per point)
      unit = max(0, round_half_up(R - N x 100) - D)               # floor at zero
    input_set: "Selected FuelPrice; member's ACTIVE enrollments of ACTIVE networks; member.stack_cap_points"
    constants:
      POINT_VALUE_CENTS: 0.5
      DEFAULT_STACK_CAP_POINTS: 500
    precision: "integer cents; round_half_up at each rounding step"
    variants:
      - name: provisional_at_authorize
        when: "sale created"
        difference: "Computes unit from live site/network/member state and pins snapshots; provisional_fuel_total_cents = unit x max_gallons"
      - name: final_at_finalize
        when: "POST /fuel-sales/{id}/finalize"
        difference: "Recomputes unit ONLY from the pinned snapshots (same arithmetic, frozen inputs); fuel_amount_cents = round_half_up(unit x dispensed_gallons) - identical unit, different totals because dispensed_gallons != max_gallons"

  - name: contract_quote_cents_per_gallon
    trigger: "POST /sites/{id}/fuel-sales with pricing_mode CONTRACT (at authorize; snapshots pinned on the sale)"
    algorithm: tiered_pricing
    formula: |
      rack = BulkTank (site's DIESEL tank) .rack_price_cents_per_gallon_4dp     # 4-decimal $/gal
      freight = site constant FREIGHT 0.1500 $/gal
      tier_off = TIER_DISCOUNT[contract.pricing_tier]                           # $/gal off
      rate_4dp = round_half_up_4dp(rack + freight - tier_off)
      base_cents = round_half_up(rate_4dp x 100)
      if contract.discount_per_gallon_off > tier_off -> ERR_CONTRACT_DISCOUNT_SHORTFALL
          # the contract's extra discount may not exceed the tier margin already baked into the rate
      discounted_cents = base_cents - round_half_up(contract.discount_per_gallon_off x 100)
      P = min(requested_redeem_points, member.stack_cap_points) when loyalty_member_id set, else 0
      D = round_half_up(P x 0.005 x 100)
      unit = max(0, discounted_cents - D)
    input_set: "Site DIESEL BulkTank rack price; contract tier + discount; member stack cap when member present"
    constants:
      FREIGHT_PER_GALLON: 0.1500
      TIER_T1_OFF: 0.02
      TIER_T2_OFF: 0.05
      TIER_T3_OFF: 0.09
      POINT_VALUE_CENTS: 0.5
    precision: "4 decimal places for rack arithmetic (round_half_up), integer cents after x100 (round_half_up)"
    variants:
      - name: provisional_tier
        when: "contract.pricing_tier as recorded on the contract at authorize time"
        difference: "Uses the contract's own tier regardless of the fleet's current rolling tier"
      - name: confirmed_fleet_tier
        when: "fleet-level quote preview via tier-recompute"
        difference: "Same rack/freight inputs priced at FleetAccount.pricing_tier produce a different cents-per-gallon when the fleet's rolling volume has crossed a tier breakpoint but the contract still carries its original tier"

  - name: fuel_sale_finalization
    trigger: "POST /fuel-sales/{id}/finalize"
    algorithm: aggregation
    formula: |
      unit = authorized_quote_cents_per_gallon recomputed from snapshots (frozen arithmetic)
      fuel_amount_cents = round_half_up(unit x dispensed_gallons)     # dispensed has 3 decimals
      tax_cents = 0
      total_cents = fuel_amount_cents
      points_earned = round_half_up(total_cents / 100 x 0.5)          # 0.5 pt per $ on fuel, computed AFTER redemption discount
    input_set: "The single FuelSale being finalized"
    constants:
      POINTS_PER_DOLLAR_FUEL: 0.5
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "authorize"
        difference: "provisional_fuel_total_cents = unit x max_gallons (authorized volume)"
      - name: final
        when: "finalize"
        difference: "total_cents = unit x dispensed_gallons (actual volume); the two differ whenever dispensed != max"

  - name: loyalty_points_accrual
    trigger: "FuelSale finalize; StoreSale create; ServiceQueueTicket complete; ParkingReservation check-in; adjustments; voids/refunds (negative lots)"
    algorithm: aggregation
    formula: |
      EARN: per-source rounding (pinned order: round each source separately, never sum-then-round):
        fuel   -> round_half_up(FuelSale.total_cents / 100 x 0.5)
        store  -> round_half_up(StoreSale.total_cents / 100 x 1.0)
        service-> round_half_up(ServiceQueueTicket.total_price_cents / 100 x 1.0)
        parking-> round_half_up(ParkingReservation.amount_cents / 100 x 1.0)
      Each earn creates a LoyaltyPointsLot{points, remaining_points: points, earned_at: now, expires_at: now + 360 days}.
      REDEEM (burn): redeemable_balance = sum(remaining_points over lots with expires_at > now).
        Burn FEFO: lots ordered by earned_at ASC, tie -> created_at ASC; skip expired lots; decrement remaining_points.
      NEGATIVE ADJUSTMENT / clawback: decrement remaining_points from lots ordered earned_at DESC (newest first);
        never drive a lot below 0; record the negative lot itself with remaining_points 0.
      balance = sum(remaining_points over non-expired lots) - recomputed after every grant/burn/clawback.
    input_set: "All LoyaltyPointsLot rows of the member"
    constants:
      POINTS_PER_DOLLAR_FUEL: 0.5
      POINTS_PER_DOLLAR_STORE: 1.0
      POINTS_PER_DOLLAR_SERVICE: 1.0
      POINTS_PER_DOLLAR_PARKING: 1.0
      POINTS_EXPIRY_DAYS: 360
    precision: "integer points, round_half_up per source line"
    variants:
      - name: per_line_rounding
        when: "always (pinned)"
        difference: "Each source rounds independently; summing unrounded dollar values and rounding once is forbidden (different results, e.g. $142.50 fuel + $11.49 store -> 71+11=82, not round(76.995)=77... pinned order is per-line)"

  - name: parking_paid_amount
    trigger: "POST /sites/{id}/parking-reservations (creation)"
    algorithm: tiered_pricing
    formula: |
      total_minutes = (reserved_to - reserved_from) in whole minutes
      paid_minutes = max(0, total_minutes - GRACE_MINUTES)
      billed_hours = ceil(paid_minutes / 60)
      base = billed_hours x PARKING_RATE_PER_HOUR_CENTS
      oversize = OVERSIZE_FEE_CENTS when space_type == OVERSIZED else 0
      P = min(requested_redeem_points, member.stack_cap_points)
      D = round_half_up(P x 0.005 x 100)
      amount_cents = max(0, base + oversize - D)
    input_set: "The reservation window and the member's stack cap"
    constants:
      PARKING_RATE_PER_HOUR_CENTS: 300
      OVERSIZE_FEE_CENTS: 800
      GRACE_MINUTES: 15
      MAX_WINDOW_HOURS: 336
      NO_SHOW_GRACE_HOURS: 2
    precision: "integer cents; ceil for hours"

  - name: service_queue_price
    trigger: "POST /sites/{id}/service-tickets (creation)"
    algorithm: tiered_pricing
    formula: |
      base = 1500 when SHOWER else 400 (LAUNDRY)
      weekend = 300 when created_at falls on Saturday/Sunday (UTC) else 0
      peak = 150 when created_at time-of-day in [17:00, 22:00) UTC else 0
      P = min(requested_redeem_points, member.stack_cap_points) when member present else 0
      D = round_half_up(P x 0.005 x 100)
      total_price_cents = max(0, base + weekend + peak - D)
    input_set: "service_type, logical clock, member stack cap"
    constants:
      SHOWER_BASE_CENTS: 1500
      LAUNDRY_BASE_CENTS: 400
      WEEKEND_SURCHARGE_CENTS: 300
      PEAK_SURCHARGE_CENTS: 150
      PEAK_WINDOW_UTC: "17:00-22:00"
    precision: "integer cents"

  - name: scale_ticket_total
    trigger: "POST /scale-tickets/{id}/settle and /cancel"
    algorithm: aggregation
    formula: |
      charge = FIRST_WEIGH_FEE_CENTS + (CERTIFIED_FEE_CENTS when certified else 0)
      REWEIGH events are free (no toll).
      total_paid_cents = charge at settle.
      Refund on paid cancel: refund_total_cents += total_paid_cents.
      Lifetime conservation: sum of tolls + sum of refunds(as negative) == net revenue of the ticket.
    input_set: "The single ScaleTicket"
    constants:
      FIRST_WEIGH_FEE_CENTS: 1250
      CERTIFIED_FEE_CENTS: 400
      REWEIGH_FEE_CENTS: 0
    precision: "integer cents"

  - name: shift_expected_cash
    trigger: "Every cash-affecting event on the shift (cash fuel pay, cash store sale, cash parking check-in, cash service pay, cash scale settle, cash work-order close, payout, drop, refund); read at close"
    algorithm: chronological
    formula: |
      PINNED EVALUATION ORDER (removes the circular reading between expected and deposit):
        1. expected_cash_cents = opening_float_cents
             + sum(cash receipts attributed to the shift)      # fuel/store/parking/service/scale/shop CASH payments
             - sum(approved payout amount_cents)
             - sum(POSTED cash drop amount_cents)
             - sum(cash refunds attributed to the shift)
        2. deposit_total_cents (at close only) = max(0, expected_cash_cents - opening_float_cents)
        3. variance_cents = counted_cash_cents - expected_cash_cents
      Register.posture (derived from the OPEN shift): NEEDS_DROP when expected > 5 x register.float_cents;
        LOW_FLOAT when expected < 1 x register.float_cents (drawer below its float); otherwise OK.
    input_set: "All money events whose shift_id == this shift, in created_at order (order affects nothing numerically; attribution only)"
    constants:
      DROP_TRIGGER_FLOAT_MULTIPLE: 5
      LOW_FLOAT_MULTIPLE: 1
      VARIANCE_TOLERANCE_CENTS: 500
    precision: "integer cents"
    variants:
      - name: book_view
        when: "during the shift and at close (pinned)"
        difference: "Expected is computed from attributed events; a physical counted estimate view is NOT a system function - only the close endpoint accepts counted_cash_cents"

  - name: cash_drop_target
    trigger: "POST /shifts/{id}/drops (validation and recording)"
    algorithm: waterfall_allocation
    formula: |
      target = expected_cash_cents - opening_float_cents          # amount above float
      Rule: amount_cents <= expected_cash_cents - opening_float_cents (ERR_DROP_EXCEEDS_EXPECTED)
      Denominations map must satisfy: sum(denomination_cents x count) == amount_cents (ERR_DROP_MISMATCH)
      Canonical denominations (cents): [10000, 5000, 2000, 1000, 500, 100, 25, 10, 5, 1]
      Greedy canonical form (for guidance/tests): take floor(remaining / denom) descending; remainder must reach 0.
    input_set: "The shift and the drop payload"
    constants:
      DENOMINATIONS_CENTS: [10000, 5000, 2000, 1000, 500, 100, 25, 10, 5, 1]
    precision: "integer cents"

  - name: shop_invoice_total
    trigger: "POST /work-orders/{id}/complete-work or /road-complete"
    algorithm: aggregation
    formula: |
      parts_total_cents = sum over WorkOrderPart of (quantity - returned_quantity) x unit_price_cents
      labor_total_cents = round_half_up(labor_hours_actual x Technician.hourly_rate_cents)
      environmental_fee_cents = 150 x sum of (quantity - returned_quantity) over parts whose StockItem.sku contains "TIRE"
      shop_supplies_cents = round_half_up(parts_total_cents x 0.03)
      invoice_total_cents = parts_total + labor_total + environmental_fee + shop_supplies
    input_set: "The WorkOrder, its parts, its technician"
    constants:
      ENV_FEE_PER_TIRE_CENTS: 150
      SHOP_SUPPLIES_PCT: 0.03
    precision: "integer cents; labor and supplies each round_half_up before summing (pinned order: parts exact, then labor, then env, then supplies, then sum)"

  - name: bulk_reorder_suggestion
    trigger: "GET /sites/{id}/reorder-suggestions (computed on read); conceptually re-evaluated after every delivery or stick reading"
    algorithm: forward_looking
    formula: |
      For each BulkTank of the site:
        projected = current_gallons - daily_usage_gallons x lead_time_days
        target = 0.90 x capacity_gallons
        suggested_gallons = max(0, target - projected + safety_stock_gallons)
        emitted only when current_gallons <= reorder_threshold_gallons
      PACKAGED variant (OIL): suggested rounded UP to whole case packs of StockItem.case_pack_gallons
        when a matching PACKAGED_OIL stock item exists: cases = ceil(suggested / case_pack); suggested = cases x case_pack
    input_set: "All BulkTanks of the site"
    constants:
      TARGET_FILL_PCT: 0.90
    precision: "gallons to 2 decimals; ceil to case pack for packaged oil"
    variants:
      - name: bulk_liquid
        when: "DIESEL / DEF tanks"
        difference: "Raw gallon suggestion, no pack rounding"
      - name: packaged_goods
        when: "OIL with a PACKAGED_OIL stock item carrying case_pack_gallons"
        difference: "Suggestion rounded UP to whole cases (ceil), so packaged suggestion >= raw suggestion"

  - name: water_usage
    trigger: "POST /service-tickets/{id}/complete"
    algorithm: aggregation
    formula: |
      SHOWER: water_gallons = min(shower_minutes, SHOWER_CAP_MINUTES) x 2.5
      LAUNDRY: water_gallons = laundry_lbs x 2.0
      TravelCenterSite.water_usage_gallons += water_gallons (2 decimal places)
    input_set: "The completing ticket"
    constants:
      SHOWER_CAP_MINUTES: 45
      SHOWER_GPM: 2.5
      LAUNDRY_GAL_PER_LB: 2.0
    precision: "2 decimal places, round_half_up"

  - name: fleet_tier_recompute
    trigger: "FuelSale finalize (CONTRACT) and refund-void; POST /fleet-accounts/{id}/tier-recompute"
    algorithm: threshold
    formula: |
      rolling_30d_gallons = sum of dispensed_gallons over this fleet's FuelSales with
        pricing_mode CONTRACT, status COMPLETED, finalized_at in [now - 30 days, now]   # inclusive both ends
      pricing_tier = T3 when rolling >= 20000; T2 when rolling >= 5000; else T1        # >= is inclusive at the breakpoint
    input_set: "COMPLETED contract FuelSales of the fleet in the trailing 30-day inclusive window"
    constants:
      TIER_T2_THRESHOLD_GAL: 5000
      TIER_T3_THRESHOLD_GAL: 20000
    precision: "gallons 3 decimals; breakpoint comparison inclusive"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Entity-backed identity scoping: LoyaltyMember actor may only touch resources whose loyalty_member_id equals X-User-ID; FleetManager only its own FleetAccount subtree; Cashier drop only on a shift whose cashier_user_id equals X-User-ID; MaintenanceTech start-work/parts only on WorkOrders assigned to X-User-ID"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "identity-scoped endpoints"
  - priority: 4
    category: auth
    check: "Segregation of duties: shift close actor != shift opener; shift reconcile actor != shift closer; payout approver (acting ShiftManager) id != shift.cashier_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /shifts/{id}/close, POST /shifts/{id}/reconcile, POST /shifts/{id}/payouts"
  - priority: 5
    category: existence
    check: "Path identifiers exist, validated left to right; child must belong to the site/parent scope named in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 6
    category: existence
    check: "Body foreign keys exist (pump_id, shift_id, loyalty_member_id, fleet_account_id, contract_id, stock_item_id, bay_id, technician_id, vendor_id, network_program_id, register_id, bulk_tank_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with body references"
  - priority: 7
    category: state
    check: "Target entity is in a state from which the requested transition exists (generic invalid transition)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 8
    category: state
    check: "Pump is IDLE and serves the requested fuel_type at fuel-sale authorize"
    error_id: ERR_PUMP_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /sites/{id}/fuel-sales"
  - priority: 9
    category: state
    check: "Shift is OPEN for money-affecting operations (drops, payouts, cash payments, close)"
    error_id: ERR_SHIFT_NOT_OPEN
    http_status: 409
    applies_to: "shift money endpoints"
  - priority: 10
    category: state
    check: "Register has no other OPEN shift when opening a shift"
    error_id: ERR_REGISTER_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /sites/{id}/shifts"
  - priority: 11
    category: state
    check: "FleetAccount.status == ACTIVE for contract sale authorize and fleet WO estimate approval"
    error_id: ERR_FLEET_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /sites/{id}/fuel-sales (CONTRACT), POST /work-orders/{id}/approve-estimate"
  - priority: 12
    category: state
    check: "FleetContract.status == ACTIVE and window contains now for contract sale authorize"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /sites/{id}/fuel-sales (CONTRACT)"
  - priority: 13
    category: state
    check: "ShopBay.status == IDLE at work-order check-in"
    error_id: ERR_BAY_OCCUPIED
    http_status: 409
    applies_to: "POST /work-orders/{id}/check-in"
  - priority: 14
    category: state
    check: "LoyaltyMember.status == ACTIVE for point redemption, accrual, enrollment activation, reservation/ticket creation"
    error_id: ERR_MEMBER_NOT_ACTIVE
    http_status: 409
    applies_to: "member-dependent endpoints"
  - priority: 15
    category: business_safety
    check: "Bulk delivery water bottom <= 1.0 inches (fuel quality)"
    error_id: ERR_WATER_BOTTOM_EXCEEDED
    http_status: 422
    applies_to: "POST /bulk-tanks/{id}/deliveries, POST /bulk-tanks/{id}/stick-reading"
  - priority: 16
    category: business_referential
    check: "pricing_mode CONTRACT requires fleet_account_id and contract_id; RETAIL forbids them; tender FLEET_BILLING requires pricing_mode CONTRACT"
    error_id: ERR_INVALID_PRICING_MODE
    http_status: 422
    applies_to: "POST /sites/{id}/fuel-sales"
  - priority: 17
    category: business_referential
    check: "Parking reservation vehicle_plate is a RegisteredVehicle plate owned by the same loyalty_member_id"
    error_id: ERR_PLATE_NOT_REGISTERED
    http_status: 422
    applies_to: "POST /sites/{id}/parking-reservations"
  - priority: 18
    category: business_referential
    check: "Contract sale fuel_type is in contract.applicable_fuel_types; network discount applies only when fuel_type in network.applicable_fuel_types"
    error_id: ERR_CONTRACT_FUEL_TYPE
    http_status: 422
    applies_to: "POST /sites/{id}/fuel-sales (CONTRACT)"
  - priority: 19
    category: business_temporal
    check: "Parking window shape: reserved_from >= now, reserved_to > reserved_from, (reserved_to - reserved_from) <= 336 hours"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /sites/{id}/parking-reservations"
  - priority: 20
    category: business_temporal
    check: "New FuelPrice window shape: effective_from < effective_to when effective_to given, effective_from >= now; overlap with existing ACTIVE same-fuel prices resolves as: existing.effective_from < new.effective_from -> truncate (existing.effective_to := new.effective_from, stays ACTIVE); existing.effective_from > new.effective_from and new window covers existing start -> SUPERSEDED; existing.effective_from == new.effective_from (duplicate start) -> rejected"
    error_id: ERR_OVERLAPPING_PRICE_WINDOW
    http_status: 422
    applies_to: "POST /sites/{id}/fuel-prices"
  - priority: 21
    category: business_temporal
    check: "Work-order bay schedule [scheduled_from, scheduled_to) does not overlap any non-terminal scheduled window on the same bay (half-open)"
    error_id: ERR_BAY_DOUBLE_BOOKED
    http_status: 422
    applies_to: "POST /work-orders/{id}/schedule"
  - priority: 22
    category: business_temporal
    check: "Work-order schedule window must not touch a closed maintenance block: conflict iff scheduled_from <= blocked_to AND blocked_from <= scheduled_to"
    error_id: ERR_BAY_MAINTENANCE_CONFLICT
    http_status: 422
    applies_to: "POST /work-orders/{id}/schedule"
  - priority: 23
    category: business_constraint
    check: "An ACTIVE effective-now FuelPrice exists for the requested fuel_type at the site"
    error_id: ERR_NO_ACTIVE_PRICE
    http_status: 422
    applies_to: "POST /sites/{id}/fuel-sales (RETAIL)"
  - priority: 24
    category: business_constraint
    check: "DiscountNetworkProgram.status == ACTIVE when activating/resuming an enrollment"
    error_id: ERR_NETWORK_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /discount-enrollments/{id}/activate, POST /discount-enrollments/{id}/resume"
  - priority: 25
    category: business_constraint
    check: "No duplicate enrollment: same member + same network with status in {PENDING, ACTIVE, SUSPENDED}"
    error_id: ERR_DUPLICATE_NETWORK_ENROLLMENT
    http_status: 422
    applies_to: "POST /loyalty-members/{id}/discount-enrollments, POST /discount-enrollments/{id}/activate"
  - priority: 26
    category: business_constraint
    check: "Count of ACTIVE enrollments in network < program_cap when activating/resuming"
    error_id: ERR_NETWORK_CAP_REACHED
    http_status: 422
    applies_to: "POST /discount-enrollments/{id}/activate, POST /discount-enrollments/{id}/resume"
  - priority: 27
    category: business_constraint
    check: "Parking aggregate capacity: at every instant of the requested window, count of overlapping reservations with status in {CONFIRMED, ACTIVE} < parking_paid_capacity (half-open windows); also check-in space assignment pool non-empty"
    error_id: ERR_PARKING_CAPACITY_FULL
    http_status: 422
    applies_to: "POST /sites/{id}/parking-reservations, POST /parking-reservations/{id}/check-in"
  - priority: 28
    category: business_constraint
    check: "Service start capacity: ACTIVE count of same service_type < site capacity, unless a preemptable ACTIVE ticket exists (elapsed >= 15 min)"
    error_id: ERR_QUEUE_CAPACITY
    http_status: 422
    applies_to: "POST /service-tickets/{id}/start"
  - priority: 29
    category: business_constraint
    check: "Service queue call pool non-empty (QUEUED tickets of that service_type at that site)"
    error_id: ERR_QUEUE_EMPTY
    http_status: 422
    applies_to: "POST /sites/{id}/service-queue/call"
  - priority: 30
    category: business_constraint
    check: "Scale settle requires at least one GROSS and one TARE event"
    error_id: ERR_SCALE_NOT_CERTIFIABLE
    http_status: 422
    applies_to: "POST /scale-tickets/{id}/settle"
  - priority: 31
    category: business_constraint
    check: "Shop part issue blocked while StockItem.is_low_stock is true (replenish first)"
    error_id: ERR_LOW_STOCK_APPROVAL_REQUIRED
    http_status: 422
    applies_to: "POST /work-orders/{id}/parts"
  - priority: 32
    category: business_constraint
    check: "Stock sufficiency: issue/return/store-sale quantities never drive StockItem.on_hand_quantity negative; store-sale quantity <= on_hand"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 422
    applies_to: "POST /work-orders/{id}/parts, POST /sites/{id}/store-sales"
  - priority: 33
    category: business_fiscal
    check: "Redeemable points balance (non-expired lots) >= requested_redeem_points at authorize/creation and re-checked at finalize"
    error_id: ERR_NO_POINTS
    http_status: 422
    applies_to: "fuel-sale authorize/finalize, parking reservation create, service ticket create"
  - priority: 34
    category: business_fiscal
    check: "Contract discount_per_gallon_off <= tier margin for the contract's tier"
    error_id: ERR_CONTRACT_DISCOUNT_SHORTFALL
    http_status: 422
    applies_to: "POST /sites/{id}/fuel-sales (CONTRACT), PATCH /contracts/{id}"
  - priority: 35
    category: business_fiscal
    check: "Fleet projected balance (current_balance_cents + provisional_fuel_total_cents) <= credit_limit_cents at contract authorize; same check at fleet-billed WO close"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /sites/{id}/fuel-sales (CONTRACT), POST /work-orders/{id}/close"
  - priority: 36
    category: business_fiscal
    check: "Drop denominations map sums exactly to amount_cents"
    error_id: ERR_DROP_MISMATCH
    http_status: 422
    applies_to: "POST /shifts/{id}/drops"
  - priority: 37
    category: business_fiscal
    check: "Drop amount_cents <= expected_cash_cents - opening_float_cents (drawer keeps at least the float)"
    error_id: ERR_DROP_EXCEEDS_EXPECTED
    http_status: 422
    applies_to: "POST /shifts/{id}/drops"
  - priority: 38
    category: business_fiscal
    check: "Payout amount_cents <= expected_cash_cents"
    error_id: ERR_PAYOUT_EXCEEDS_EXPECTED
    http_status: 422
    applies_to: "POST /shifts/{id}/payouts"
  - priority: 39
    category: business_fiscal
    check: "At shift close: expected_cash_cents >= opening_float_cents"
    error_id: ERR_REMAINING_BELOW_FLOAT
    http_status: 422
    applies_to: "POST /shifts/{id}/close"
  - priority: 40
    category: business_fiscal
    check: "At shift close: |counted - expected| > 500 requires approve_variance: true"
    error_id: ERR_COUNT_SHORTAGE_UNAPPROVED
    http_status: 422
    applies_to: "POST /shifts/{id}/close"
  - priority: 41
    category: business_constraint
    check: "Malformed request body, missing required field, invalid enum value, non-positive quantities"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Sites & config ---
  - { method: POST, path: "/sites", description: "Create a travel center site", roles: [GeneralManager], code: 201, input: [name, parking_total_spaces, parking_paid_capacity, shower_units_count, laundry_machines_count], output: TravelCenterSite, side_effects: ["water_usage_gallons = 0, retail mirrors null"] }
  - { method: GET, path: "/sites/{id}", description: "Get site detail", roles: [GeneralManager, ShiftManager, FuelDeskLead, Cashier, MaintenanceTech, FleetManager, LoyaltyMember], code: 200, input: [], output: TravelCenterSite, side_effects: [] }
  - { method: GET, path: "/sites", description: "List sites", roles: [GeneralManager, ShiftManager, FuelDeskLead, Cashier, MaintenanceTech, FleetManager, LoyaltyMember], code: 200, input: ["limit?", "offset?"], output: "TravelCenterSite[]", side_effects: [] }
  - { method: GET, path: "/sites/{id}/dashboard", description: "Computed operations snapshot", roles: [GeneralManager, ShiftManager, FuelDeskLead], code: 200, input: [], output: { pumps_total: integer, pumps_in_use: integer, parking_active_count: integer, shower_queue_depth: integer, laundry_queue_depth: integer, low_stock_count: integer }, side_effects: [] }

  # --- Fuel prices (OCC-guarded create-with-supersede) ---
  - { method: POST, path: "/sites/{id}/fuel-prices", description: "Post a new retail fuel price; supersedes/truncates overlapping ACTIVE same-fuel prices; OCC on site version", roles: [FuelDeskLead], code: 201, input: [fuel_type, retail_cents_per_gallon, effective_from, "effective_to?", expected_site_version], output: FuelPrice, side_effects: ["overlapping ACTIVE same-fuel prices truncated or SUPERSEDED per FuelPrice machine", "site retail mirror fields recomputed", "increments TravelCenterSite.version by 1"] }
  - { method: GET, path: "/sites/{id}/fuel-prices", description: "List fuel prices of a site", roles: [GeneralManager, FuelDeskLead, ShiftManager], code: 200, input: ["fuel_type?", "status?", "limit?", "offset?"], output: "FuelPrice[]", side_effects: [] }
  - { method: GET, path: "/fuel-prices/{id}", description: "Get a fuel price", roles: [GeneralManager, FuelDeskLead], code: 200, input: [], output: FuelPrice, side_effects: [] }

  # --- Pumps ---
  - { method: POST, path: "/sites/{id}/pumps", description: "Create a pump", roles: [GeneralManager, FuelDeskLead], code: 201, input: [pump_number, fuel_types], output: Pump, side_effects: ["status=IDLE"] }
  - { method: GET, path: "/sites/{id}/pumps", description: "List pumps", roles: [GeneralManager, FuelDeskLead, Cashier, ShiftManager], code: 200, input: ["status?", "limit?", "offset?"], output: "Pump[]", side_effects: [] }
  - { method: GET, path: "/pumps/{id}", description: "Get pump", roles: [GeneralManager, FuelDeskLead, Cashier, ShiftManager], code: 200, input: [], output: Pump, side_effects: [] }
  - { method: POST, path: "/pumps/{id}/out-of-service", description: "Take pump out of service (IDLE only)", roles: [FuelDeskLead], code: 200, input: [], output: Pump, side_effects: ["status -> OUT_OF_SERVICE"] }
  - { method: POST, path: "/pumps/{id}/return-to-service", description: "Return pump to service", roles: [FuelDeskLead], code: 200, input: [], output: Pump, side_effects: ["status -> IDLE"] }
  - { method: GET, path: "/pumps/{id}/fuel-sales", description: "Fuel sales authorized on this pump", roles: [GeneralManager, FuelDeskLead, ShiftManager], code: 200, input: ["limit?", "offset?"], output: "FuelSale[]", side_effects: [] }

  # --- Fuel sales ---
  - { method: POST, path: "/sites/{id}/fuel-sales", description: "Authorize a fuel sale (RETAIL or CONTRACT); pins price snapshots; pump IDLE -> IN_USE", roles: [Cashier, FuelDeskLead], code: 201, input: [pump_id, shift_id, pricing_mode, fuel_type, tender_type, "loyalty_member_id?", "fleet_account_id?", "contract_id?", "requested_redeem_points?", "max_gallons?"], output: FuelSale, side_effects: ["status=AUTHORIZED, payment_status=UNPAID", "provisional quote computed (calc retail_quote/contract_quote)", "pump -> IN_USE"] }
  - { method: GET, path: "/sites/{id}/fuel-sales", description: "List fuel sales of a site", roles: [GeneralManager, FuelDeskLead, ShiftManager, Cashier], code: 200, input: ["status?", "pricing_mode?", "limit?", "offset?"], output: "FuelSale[]", side_effects: [] }
  - { method: GET, path: "/fuel-sales/{id}", description: "Get fuel sale", roles: [GeneralManager, FuelDeskLead, ShiftManager, Cashier, LoyaltyMember, FleetManager], code: 200, input: [], output: FuelSale, side_effects: [] }
  - { method: POST, path: "/fuel-sales/{id}/dispensing-start", description: "Begin fueling", roles: [Cashier, FuelDeskLead], code: 200, input: [], output: FuelSale, side_effects: ["status -> FUELING"] }
  - { method: POST, path: "/fuel-sales/{id}/dispensing-complete", description: "End fueling; records dispensed gallons; frees pump", roles: [Cashier, FuelDeskLead], code: 200, input: [dispensed_gallons], output: FuelSale, side_effects: ["status -> PENDING_FINALIZE", "pump IN_USE -> IDLE"] }
  - { method: POST, path: "/fuel-sales/{id}/finalize", description: "Finalize amounts from snapshots; burns/rewards loyalty points; contract volume cascade", roles: [Cashier, FuelDeskLead], code: 200, input: [], output: FuelSale, side_effects: ["status -> COMPLETED", "calc fuel_sale_finalization", "loyalty debit+credit lots", "contract volume + fleet rolling + tier recompute (CONTRACT)"] }
  - { method: POST, path: "/fuel-sales/{id}/pay", description: "Collect payment", roles: [Cashier], code: 200, input: [tender_type], output: FuelSale, side_effects: ["payment_status -> PAID|BILLED", "CASH: shift expected += total; register posture recomputed", "FLEET_BILLING: fleet balance += total"] }
  - { method: POST, path: "/fuel-sales/{id}/void", description: "Void a sale; refund-void when COMPLETED", roles: [ShiftManager], code: 200, input: [reason], output: FuelSale, side_effects: ["status -> VOIDED", "payment -> REFUNDED when paid/billed", "cash/billing/points/contract-volume reversals"] }

  # --- Parking spaces ---
  - { method: POST, path: "/sites/{id}/parking-spaces", description: "Create a parking space", roles: [GeneralManager], code: 201, input: [space_number, space_type, is_reservable], output: ParkingSpace, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/sites/{id}/parking-spaces", description: "List parking spaces", roles: [GeneralManager, ShiftManager, Cashier], code: 200, input: ["space_type?", "status?", "limit?", "offset?"], output: "ParkingSpace[]", side_effects: [] }
  - { method: GET, path: "/parking-spaces/{id}", description: "Get parking space", roles: [GeneralManager, ShiftManager, Cashier], code: 200, input: [], output: ParkingSpace, side_effects: [] }
  - { method: GET, path: "/parking-spaces/{id}/reservations", description: "Reservations assigned to this space", roles: [GeneralManager, ShiftManager, Cashier], code: 200, input: ["limit?", "offset?"], output: "ParkingReservation[]", side_effects: [] }

  # --- Parking reservations ---
  - { method: POST, path: "/sites/{id}/parking-reservations", description: "Reserve paid parking; computes amount; validates plate ownership, window, aggregate capacity", roles: [Cashier, LoyaltyMember], code: 201, input: [loyalty_member_id, vehicle_plate, space_type, reserved_from, reserved_to, "requested_redeem_points?"], output: ParkingReservation, side_effects: ["status=CONFIRMED, payment_status=UNPAID", "calc parking_paid_amount", "points burned at creation when requested_redeem_points > 0"] }
  - { method: GET, path: "/sites/{id}/parking-reservations", description: "List parking reservations", roles: [GeneralManager, ShiftManager, Cashier], code: 200, input: ["status?", "loyalty_member_id?", "limit?", "offset?"], output: "ParkingReservation[]", side_effects: [] }
  - { method: GET, path: "/parking-reservations/{id}", description: "Get parking reservation", roles: [GeneralManager, ShiftManager, Cashier, LoyaltyMember], code: 200, input: [], output: ParkingReservation, side_effects: [] }
  - { method: POST, path: "/parking-reservations/{id}/check-in", description: "Check in: assigns space, charges amount, earns points", roles: [Cashier], code: 200, input: [tender_type, shift_id], output: ParkingReservation, side_effects: ["status -> ACTIVE", "space assigned by selector", "CASH: shift expected += amount; register posture recomputed", "loyalty PARKING earn lot"] }
  - { method: POST, path: "/parking-reservations/{id}/check-out", description: "Check out; frees space", roles: [Cashier], code: 200, input: [], output: ParkingReservation, side_effects: ["status -> COMPLETED"] }
  - { method: POST, path: "/parking-reservations/{id}/cancel", description: "Cancel reservation; paid cancel refunds in full", roles: [Cashier, LoyaltyMember], code: 200, input: [], output: ParkingReservation, side_effects: ["status -> CANCELLED", "paid: payment -> REFUNDED + cash reversal + points clawback"] }
  - { method: POST, path: "/parking-reservations/{id}/no-show", description: "Mark no-show after reserved_from + 2h grace", roles: [Cashier, ShiftManager], code: 200, input: [], output: ParkingReservation, side_effects: ["status -> NO_SHOW"] }

  # --- Service queue (shower/laundry) ---
  - { method: POST, path: "/sites/{id}/service-tickets", description: "Create a shower/laundry queue ticket; price computed with surcharges and points", roles: [Cashier, LoyaltyMember], code: 201, input: [service_type, "shift_id?", "loyalty_member_id?", "requested_redeem_points?"], output: ServiceQueueTicket, side_effects: ["status=QUEUED, queue_position assigned", "calc service_queue_price", "points burned at creation when requested"] }
  - { method: GET, path: "/sites/{id}/service-tickets", description: "List service tickets", roles: [GeneralManager, ShiftManager, Cashier], code: 200, input: ["service_type?", "status?", "limit?", "offset?"], output: "ServiceQueueTicket[]", side_effects: [] }
  - { method: GET, path: "/service-tickets/{id}", description: "Get service ticket", roles: [GeneralManager, ShiftManager, Cashier, LoyaltyMember], code: 200, input: [], output: ServiceQueueTicket, side_effects: [] }
  - { method: POST, path: "/sites/{id}/service-queue/call", description: "Call the next queued ticket (lowest queue_position) for a service type", roles: [Cashier], code: 200, input: [service_type], output: ServiceQueueTicket, side_effects: ["selected ticket QUEUED -> CALLED"] }
  - { method: POST, path: "/service-tickets/{id}/start", description: "Start service; capacity check with overstay preemption", roles: [Cashier], code: 200, input: [], output: ServiceQueueTicket, side_effects: ["status -> ACTIVE, started_at stamped", "possible preemption of longest-elapsed ACTIVE ticket"] }
  - { method: POST, path: "/service-tickets/{id}/complete", description: "Complete service; computes water usage", roles: [Cashier], code: 200, input: ["shower_minutes?", "laundry_lbs?"], output: ServiceQueueTicket, side_effects: ["status -> COMPLETED", "calc water_usage; site water_usage_gallons += water_gallons", "loyalty SERVICE earn lot when member present"] }
  - { method: POST, path: "/service-tickets/{id}/pay", description: "Pay for service (CALLED/ACTIVE/COMPLETED)", roles: [Cashier], code: 200, input: [tender_type, "shift_id?"], output: ServiceQueueTicket, side_effects: ["payment_status -> PAID", "CASH: effective shift expected += total_price; register posture recomputed"] }
  - { method: POST, path: "/service-tickets/{id}/cancel", description: "Cancel while QUEUED/CALLED; refunds when paid", roles: [Cashier, LoyaltyMember], code: 200, input: [], output: ServiceQueueTicket, side_effects: ["status -> CANCELLED", "points re-credited", "paid: payment -> REFUNDED + cash reversal"] }
  - { method: POST, path: "/service-tickets/{id}/no-show", description: "Mark called ticket no-show", roles: [Cashier], code: 200, input: [], output: ServiceQueueTicket, side_effects: ["status -> NO_SHOW"] }
  - { method: POST, path: "/service-tickets/{id}/requeue", description: "Requeue a NO_SHOW ticket to the back of the queue", roles: [Cashier], code: 200, input: [], output: ServiceQueueTicket, side_effects: ["status -> QUEUED", "queue_position = max + 1"] }

  # --- Scale ---
  - { method: POST, path: "/sites/{id}/scale-tickets", description: "Open a scale ticket", roles: [Cashier], code: 201, input: [shift_id, vehicle_plate, carrier_name, certified], output: ScaleTicket, side_effects: ["status=OPEN, reweigh_count=0, total_paid_cents=0"] }
  - { method: GET, path: "/sites/{id}/scale-tickets", description: "List scale tickets", roles: [GeneralManager, ShiftManager, Cashier], code: 200, input: ["status?", "limit?", "offset?"], output: "ScaleTicket[]", side_effects: [] }
  - { method: GET, path: "/scale-tickets/{id}", description: "Get scale ticket", roles: [GeneralManager, ShiftManager, Cashier], code: 200, input: [], output: ScaleTicket, side_effects: [] }
  - { method: POST, path: "/scale-tickets/{id}/weigh", description: "Append a weigh event (GROSS/TARE/REWEIGH)", roles: [Cashier], code: 201, input: [weigh_kind, weight_lbs], output: ScaleWeighEvent, side_effects: ["event appended", "GROSS or REWEIGH set ticket.gross_lbs; TARE sets ticket.tare_lbs; net_lbs = gross_lbs - tare_lbs once both set", "reweigh_count incremented on REWEIGH"] }
  - { method: GET, path: "/scale-tickets/{id}/weigh-events", description: "List weigh events of a ticket", roles: [GeneralManager, ShiftManager, Cashier], code: 200, input: ["limit?", "offset?"], output: "ScaleWeighEvent[]", side_effects: [] }
  - { method: POST, path: "/scale-tickets/{id}/settle", description: "Settle scale fees (first weigh + certified fee)", roles: [Cashier], code: 200, input: [tender_type], output: ScaleTicket, side_effects: ["status -> PAID", "calc scale_ticket_total", "CASH: shift expected += total_paid; register posture recomputed"] }
  - { method: POST, path: "/scale-tickets/{id}/close", description: "Close a paid ticket (driver departure)", roles: [Cashier], code: 200, input: [], output: ScaleTicket, side_effects: ["status -> CLOSED"] }
  - { method: POST, path: "/scale-tickets/{id}/cancel", description: "Cancel: unpaid -> CANCELLED; paid -> REFUNDED with full refund", roles: [Cashier, ShiftManager], code: 200, input: [], output: ScaleTicket, side_effects: ["OPEN -> CANCELLED; PAID -> REFUNDED with refund_total_cents += total_paid and cash reversal"] }

  # --- Stock & vendors ---
  - { method: POST, path: "/sites/{id}/stock-items", description: "Create a stock item", roles: [GeneralManager], code: 201, input: [sku, name, category, unit, unit_price_cents, reorder_point, "initial_on_hand_quantity?", "vendor_id?", "case_pack_gallons?"], output: StockItem, side_effects: ["on_hand_quantity = initial_on_hand_quantity (default 0); is_low_stock computed"] }
  - { method: GET, path: "/sites/{id}/stock-items", description: "List stock items", roles: [GeneralManager, ShiftManager, Cashier, MaintenanceTech], code: 200, input: ["category?", "low_stock?", "limit?", "offset?"], output: "StockItem[]", side_effects: [] }
  - { method: GET, path: "/stock-items/{id}", description: "Get stock item", roles: [GeneralManager, ShiftManager, Cashier, MaintenanceTech], code: 200, input: [], output: StockItem, side_effects: [] }
  - { method: GET, path: "/stock-items/{id}/work-order-parts", description: "Shop part issues referencing this item", roles: [GeneralManager, MaintenanceTech], code: 200, input: ["limit?", "offset?"], output: "WorkOrderPart[]", side_effects: [] }
  - { method: POST, path: "/sites/{id}/vendors", description: "Create a vendor", roles: [GeneralManager], code: 201, input: [name, category], output: Vendor, side_effects: [] }
  - { method: GET, path: "/sites/{id}/vendors", description: "List vendors", roles: [GeneralManager, ShiftManager, MaintenanceTech], code: 200, input: ["limit?", "offset?"], output: "Vendor[]", side_effects: [] }
  - { method: GET, path: "/vendors/{id}", description: "Get vendor", roles: [GeneralManager, ShiftManager, MaintenanceTech], code: 200, input: [], output: Vendor, side_effects: [] }
  - { method: POST, path: "/vendors/{id}/price-list", description: "Add a vendor price entry", roles: [GeneralManager], code: 201, input: [item_sku, unit, unit_price_cents, "pack_size?"], output: VendorPrice, side_effects: [] }
  - { method: GET, path: "/vendors/{id}/price-list", description: "List vendor price entries", roles: [GeneralManager, MaintenanceTech], code: 200, input: ["limit?", "offset?"], output: "VendorPrice[]", side_effects: [] }
  - { method: GET, path: "/vendors/{id}/stock-items", description: "Stock items preferring this vendor", roles: [GeneralManager, MaintenanceTech], code: 200, input: ["limit?", "offset?"], output: "StockItem[]", side_effects: [] }
  - { method: GET, path: "/vendors/{id}/purchase-orders", description: "POs placed with this vendor", roles: [GeneralManager, MaintenanceTech], code: 200, input: ["limit?", "offset?"], output: "PurchaseOrder[]", side_effects: [] }
  - { method: GET, path: "/vendors/{id}/deliveries", description: "Bulk deliveries attributed to this vendor", roles: [GeneralManager, FuelDeskLead], code: 200, input: ["limit?", "offset?"], output: "BulkDelivery[]", side_effects: [] }

  # --- Purchase orders ---
  - { method: POST, path: "/sites/{id}/purchase-orders", description: "Create a purchase order (DRAFT)", roles: [GeneralManager], code: 201, input: [vendor_id, lines], output: PurchaseOrder, side_effects: ["status=DRAFT; total_cents computed; unit prices default from VendorPrice"] }
  - { method: GET, path: "/sites/{id}/purchase-orders", description: "List purchase orders", roles: [GeneralManager, MaintenanceTech], code: 200, input: ["status?", "vendor_id?", "limit?", "offset?"], output: "PurchaseOrder[]", side_effects: [] }
  - { method: GET, path: "/purchase-orders/{id}", description: "Get purchase order", roles: [GeneralManager, MaintenanceTech], code: 200, input: [], output: PurchaseOrder, side_effects: [] }
  - { method: POST, path: "/purchase-orders/{id}/approve", description: "Approve PO", roles: [GeneralManager], code: 200, input: [], output: PurchaseOrder, side_effects: ["status -> APPROVED"] }
  - { method: POST, path: "/purchase-orders/{id}/receive", description: "Receive (fully or partially) against a PO; replenishes stock", roles: [GeneralManager, MaintenanceTech], code: 200, input: [received_lines], output: PurchaseOrder, side_effects: ["status -> PARTIALLY_RECEIVED or RECEIVED", "StockItem.on_hand_quantity += received; is_low_stock recomputed"] }
  - { method: POST, path: "/purchase-orders/{id}/cancel", description: "Cancel PO (DRAFT/APPROVED only)", roles: [GeneralManager], code: 200, input: [], output: PurchaseOrder, side_effects: ["status -> CANCELLED"] }

  # --- Shop bays & technicians ---
  - { method: POST, path: "/sites/{id}/bays", description: "Create a shop bay", roles: [GeneralManager], code: 201, input: [bay_number], output: ShopBay, side_effects: ["status=IDLE"] }
  - { method: GET, path: "/sites/{id}/bays", description: "List bays", roles: [GeneralManager, MaintenanceTech, ShiftManager], code: 200, input: ["status?", "limit?", "offset?"], output: "ShopBay[]", side_effects: [] }
  - { method: GET, path: "/bays/{id}", description: "Get bay", roles: [GeneralManager, MaintenanceTech, ShiftManager], code: 200, input: [], output: ShopBay, side_effects: [] }
  - { method: GET, path: "/bays/{id}/work-orders", description: "Work orders scheduled in this bay", roles: [GeneralManager, MaintenanceTech], code: 200, input: ["limit?", "offset?"], output: "WorkOrder[]", side_effects: [] }
  - { method: POST, path: "/bays/{id}/maintenance-block", description: "Block a bay for maintenance (closed interval); bay -> MAINTENANCE", roles: [GeneralManager, MaintenanceTech], code: 200, input: [blocked_from, blocked_to, reason], output: ShopBay, side_effects: ["block appended", "status -> MAINTENANCE"] }
  - { method: POST, path: "/bays/{id}/maintenance-clear", description: "Return bay to service", roles: [GeneralManager, MaintenanceTech], code: 200, input: [], output: ShopBay, side_effects: ["status -> IDLE"] }
  - { method: POST, path: "/sites/{id}/technicians", description: "Create a technician", roles: [GeneralManager], code: 201, input: [name, hourly_rate_cents, "certifications?"], output: Technician, side_effects: ["status=AVAILABLE"] }
  - { method: GET, path: "/sites/{id}/technicians", description: "List technicians", roles: [GeneralManager, MaintenanceTech, ShiftManager], code: 200, input: ["limit?", "offset?"], output: "Technician[]", side_effects: [] }
  - { method: GET, path: "/technicians/{id}", description: "Get technician", roles: [GeneralManager, MaintenanceTech, ShiftManager], code: 200, input: [], output: Technician, side_effects: [] }
  - { method: GET, path: "/technicians/{id}/work-orders", description: "Work orders assigned to this technician", roles: [GeneralManager, MaintenanceTech], code: 200, input: ["limit?", "offset?"], output: "WorkOrder[]", side_effects: [] }

  # --- Work orders ---
  - { method: POST, path: "/sites/{id}/work-orders", description: "Create a work order", roles: [Cashier, MaintenanceTech, GeneralManager], code: 201, input: [vehicle_plate, complaint, "fleet_account_id?"], output: WorkOrder, side_effects: ["status=CREATED, payment_status=UNPAID"] }
  - { method: GET, path: "/sites/{id}/work-orders", description: "List work orders", roles: [GeneralManager, MaintenanceTech, ShiftManager, Cashier], code: 200, input: ["status?", "fleet_account_id?", "limit?", "offset?"], output: "WorkOrder[]", side_effects: [] }
  - { method: GET, path: "/work-orders/{id}", description: "Get work order", roles: [GeneralManager, MaintenanceTech, ShiftManager, Cashier, FleetManager], code: 200, input: [], output: WorkOrder, side_effects: [] }
  - { method: POST, path: "/work-orders/{id}/estimate", description: "Record labor estimate", roles: [MaintenanceTech], code: 200, input: [labor_hours_est], output: WorkOrder, side_effects: ["status -> ESTIMATED"] }
  - { method: POST, path: "/work-orders/{id}/approve-estimate", description: "Approve estimate (GM for retail; FleetManager for own fleet)", roles: [GeneralManager, FleetManager], code: 200, input: [], output: WorkOrder, side_effects: ["status -> APPROVED"] }
  - { method: POST, path: "/work-orders/{id}/schedule", description: "Schedule bay + technician + window; overlap checks", roles: [GeneralManager, MaintenanceTech], code: 200, input: [bay_id, technician_id, scheduled_from, scheduled_to], output: WorkOrder, side_effects: ["status -> SCHEDULED"] }
  - { method: POST, path: "/work-orders/{id}/check-in", description: "Check in to bay (bay must be IDLE)", roles: [MaintenanceTech], code: 200, input: [], output: WorkOrder, side_effects: ["status -> IN_SHOP", "bay IDLE -> OCCUPIED"] }
  - { method: POST, path: "/work-orders/{id}/start-work", description: "Start work (assigned technician only)", roles: [MaintenanceTech], code: 200, input: [], output: WorkOrder, side_effects: ["status -> IN_PROGRESS"] }
  - { method: POST, path: "/work-orders/{id}/parts", description: "Issue a part from stock to the work order", roles: [MaintenanceTech], code: 201, input: [stock_item_id, quantity], output: WorkOrderPart, side_effects: ["StockItem.on_hand_quantity -= quantity; is_low_stock recomputed", "WorkOrderPart ISSUED with price snapshot"] }
  - { method: GET, path: "/work-orders/{id}/parts", description: "List parts issued to a work order", roles: [GeneralManager, MaintenanceTech, Cashier], code: 200, input: ["limit?", "offset?"], output: "WorkOrderPart[]", side_effects: [] }
  - { method: POST, path: "/work-order-parts/{id}/return", description: "Return issued quantity to stock", roles: [MaintenanceTech], code: 200, input: [quantity], output: WorkOrderPart, side_effects: ["returned_quantity += quantity", "StockItem.on_hand_quantity += quantity; is_low_stock recomputed", "status -> RETURNED when fully returned"] }
  - { method: POST, path: "/work-orders/{id}/dispatch-road", description: "Dispatch as road service (no bay)", roles: [GeneralManager, MaintenanceTech], code: 200, input: [technician_id, location_text], output: WorkOrder, side_effects: ["status -> IN_PROGRESS, is_road_service=true"] }
  - { method: POST, path: "/work-orders/{id}/road-complete", description: "Complete a road-service call", roles: [MaintenanceTech], code: 200, input: [labor_hours_actual], output: WorkOrder, side_effects: ["status -> READY_FOR_PICKUP", "invoice computed"] }
  - { method: POST, path: "/work-orders/{id}/send-to-vendor", description: "Send bay work to an outside vendor", roles: [MaintenanceTech], code: 200, input: [vendor_name, reason], output: WorkOrder, side_effects: ["status -> WAITING_VENDOR"] }
  - { method: POST, path: "/work-orders/{id}/return-from-vendor", description: "Receive work back from outside vendor", roles: [MaintenanceTech], code: 200, input: [], output: WorkOrder, side_effects: ["status -> IN_PROGRESS"] }
  - { method: POST, path: "/work-orders/{id}/complete-work", description: "Complete bay work; computes invoice; frees bay", roles: [MaintenanceTech], code: 200, input: [labor_hours_actual], output: WorkOrder, side_effects: ["status -> READY_FOR_PICKUP", "calc shop_invoice_total", "bay OCCUPIED -> IDLE"] }
  - { method: POST, path: "/work-orders/{id}/close", description: "Collect payment and close", roles: [Cashier, GeneralManager], code: 200, input: [tender_type, "shift_id?"], output: WorkOrder, side_effects: ["status -> CLOSED", "payment -> PAID|BILLED", "CASH: shift expected += invoice_total; register posture recomputed", "FLEET_BILLING: fleet balance += invoice_total"] }
  - { method: POST, path: "/work-orders/{id}/cancel", description: "Cancel work order; returns issued parts; frees bay", roles: [GeneralManager, MaintenanceTech], code: 200, input: [], output: WorkOrder, side_effects: ["status -> CANCELLED", "parts returned to stock", "bay freed if occupied"] }

  # --- Registers & shifts ---
  - { method: POST, path: "/sites/{id}/registers", description: "Create a register", roles: [GeneralManager], code: 201, input: [register_code, float_cents], output: Register, side_effects: ["posture=OK"] }
  - { method: GET, path: "/sites/{id}/registers", description: "List registers", roles: [GeneralManager, ShiftManager], code: 200, input: ["limit?", "offset?"], output: "Register[]", side_effects: [] }
  - { method: GET, path: "/registers/{id}", description: "Get register (posture reflects its OPEN shift)", roles: [GeneralManager, ShiftManager], code: 200, input: [], output: Register, side_effects: [] }
  - { method: GET, path: "/registers/{id}/shifts", description: "Shifts on this register", roles: [GeneralManager, ShiftManager], code: 200, input: ["limit?", "offset?"], output: "Shift[]", side_effects: [] }
  - { method: GET, path: "/registers/{id}/cash-drops", description: "Cash drops from this register", roles: [GeneralManager, ShiftManager], code: 200, input: ["limit?", "offset?"], output: "CashDrop[]", side_effects: [] }
  - { method: GET, path: "/registers/{id}/safe-deposits", description: "Safe deposits from this register", roles: [GeneralManager, ShiftManager], code: 200, input: ["limit?", "offset?"], output: "SafeDeposit[]", side_effects: [] }
  - { method: POST, path: "/sites/{id}/shifts", description: "Open a shift on a register", roles: [ShiftManager], code: 201, input: [register_id, cashier_user_id, shift_label], output: Shift, side_effects: ["status=OPEN; opening_float_cents = register.float_cents; expected_cash_cents = opening_float_cents"] }
  - { method: GET, path: "/sites/{id}/shifts", description: "List shifts", roles: [GeneralManager, ShiftManager], code: 200, input: ["status?", "register_id?", "limit?", "offset?"], output: "Shift[]", side_effects: [] }
  - { method: GET, path: "/shifts/{id}", description: "Get shift", roles: [GeneralManager, ShiftManager, Cashier], code: 200, input: [], output: Shift, side_effects: [] }
  - { method: POST, path: "/shifts/{id}/drops", description: "Record a cash drop to the safe (owning cashier only)", roles: [Cashier], code: 201, input: [amount_cents, denominations], output: CashDrop, side_effects: ["shift expected -= amount; register posture recomputed"] }
  - { method: POST, path: "/shifts/{id}/payouts", description: "Approve a cash payout from the drawer (manager != cashier)", roles: [ShiftManager], code: 201, input: [amount_cents, reason], output: { payout_id: string, amount_cents: integer, expected_cash_cents: integer }, side_effects: ["shift expected -= amount; register posture recomputed (may flip LOW_FLOAT)"] }
  - { method: POST, path: "/shifts/{id}/close", description: "Close shift: counted cash, variance, reconciliation, safe deposit", roles: [ShiftManager], code: 200, input: [counted_cash_cents, "approve_variance?"], output: Shift, side_effects: ["status -> CLOSED", "ShiftReconciliation created", "SafeDeposit created when deposit_total > 0"] }
  - { method: POST, path: "/shifts/{id}/reconcile", description: "Review-acknowledge a closed shift (different manager than closer)", roles: [ShiftManager], code: 200, input: [], output: Shift, side_effects: ["status -> RECONCILED"] }
  - { method: POST, path: "/shifts/{id}/lock", description: "Lock a reconciled shift (audit final)", roles: [GeneralManager], code: 200, input: [], output: Shift, side_effects: ["status -> LOCKED"] }
  - { method: GET, path: "/shifts/{id}/reconciliations", description: "Reconciliation records of a shift", roles: [GeneralManager, ShiftManager], code: 200, input: ["limit?", "offset?"], output: "ShiftReconciliation[]", side_effects: [] }
  - { method: GET, path: "/shifts/{id}/cash-drops", description: "Cash drops of a shift", roles: [GeneralManager, ShiftManager, Cashier], code: 200, input: ["limit?", "offset?"], output: "CashDrop[]", side_effects: [] }
  - { method: GET, path: "/shifts/{id}/safe-deposits", description: "Safe deposits of a shift", roles: [GeneralManager, ShiftManager], code: 200, input: ["limit?", "offset?"], output: "SafeDeposit[]", side_effects: [] }
  - { method: GET, path: "/shifts/{id}/fuel-sales", description: "Fuel sales attributed to a shift", roles: [GeneralManager, ShiftManager, Cashier], code: 200, input: ["limit?", "offset?"], output: "FuelSale[]", side_effects: [] }
  - { method: GET, path: "/shifts/{id}/parking-reservations", description: "Paid parking reservations attributed to a shift", roles: [GeneralManager, ShiftManager, Cashier], code: 200, input: ["limit?", "offset?"], output: "ParkingReservation[]", side_effects: [] }
  - { method: GET, path: "/shifts/{id}/service-tickets", description: "Service tickets attributed to a shift", roles: [GeneralManager, ShiftManager, Cashier], code: 200, input: ["limit?", "offset?"], output: "ServiceQueueTicket[]", side_effects: [] }
  - { method: GET, path: "/shifts/{id}/scale-tickets", description: "Scale tickets attributed to a shift", roles: [GeneralManager, ShiftManager, Cashier], code: 200, input: ["limit?", "offset?"], output: "ScaleTicket[]", side_effects: [] }
  - { method: GET, path: "/shifts/{id}/store-sales", description: "Store sales attributed to a shift", roles: [GeneralManager, ShiftManager, Cashier], code: 200, input: ["limit?", "offset?"], output: "StoreSale[]", side_effects: [] }

  # --- Fleet accounts ---
  - { method: POST, path: "/fleet-accounts", description: "Create a fleet account", roles: [GeneralManager], code: 201, input: [name, credit_limit_cents, pricing_tier], output: FleetAccount, side_effects: ["status=ACTIVE, current_balance_cents=0, rolling_30d_gallons=0"] }
  - { method: GET, path: "/fleet-accounts/{id}", description: "Get fleet account", roles: [GeneralManager, FleetManager], code: 200, input: [], output: FleetAccount, side_effects: [] }
  - { method: PATCH, path: "/fleet-accounts/{id}", description: "Update credit limit", roles: [GeneralManager], code: 200, input: ["credit_limit_cents?"], output: FleetAccount, side_effects: [] }
  - { method: POST, path: "/fleet-accounts/{id}/credit-hold", description: "Place fleet on credit hold", roles: [GeneralManager], code: 200, input: [], output: FleetAccount, side_effects: ["status -> CREDIT_HOLD"] }
  - { method: POST, path: "/fleet-accounts/{id}/credit-reinstate", description: "Reinstate fleet credit", roles: [GeneralManager], code: 200, input: [], output: FleetAccount, side_effects: ["status -> ACTIVE"] }
  - { method: POST, path: "/fleet-accounts/{id}/close", description: "Close fleet (zero balance required); terminates non-terminal contracts", roles: [GeneralManager], code: 200, input: [], output: FleetAccount, side_effects: ["status -> CLOSED", "contracts PENDING/ACTIVE/SUSPENDED -> TERMINATED"] }
  - { method: POST, path: "/fleet-accounts/{id}/tier-recompute", description: "Recompute rolling volume and pricing tier", roles: [GeneralManager], code: 200, input: [], output: FleetAccount, side_effects: ["calc fleet_tier_recompute"] }
  - { method: GET, path: "/fleet-accounts/{id}/contracts", description: "Contracts of a fleet", roles: [GeneralManager, FleetManager], code: 200, input: ["status?", "limit?", "offset?"], output: "FleetContract[]", side_effects: [] }
  - { method: GET, path: "/fleet-accounts/{id}/loyalty-members", description: "Loyalty members linked to a fleet", roles: [GeneralManager, FleetManager], code: 200, input: ["limit?", "offset?"], output: "LoyaltyMember[]", side_effects: [] }
  - { method: GET, path: "/fleet-accounts/{id}/fuel-sales", description: "Fuel sales billed to a fleet", roles: [GeneralManager, FleetManager], code: 200, input: ["limit?", "offset?"], output: "FuelSale[]", side_effects: [] }
  - { method: GET, path: "/fleet-accounts/{id}/work-orders", description: "Work orders billed to a fleet", roles: [GeneralManager, FleetManager, MaintenanceTech], code: 200, input: ["limit?", "offset?"], output: "WorkOrder[]", side_effects: [] }

  # --- Contracts ---
  - { method: POST, path: "/fleet-accounts/{id}/contracts", description: "Create a fuel contract (PENDING)", roles: [GeneralManager], code: 201, input: [contract_code, pricing_tier, discount_per_gallon_off, applicable_fuel_types, effective_from, effective_to], output: FleetContract, side_effects: ["status=PENDING, volume_delivered_gallons=0"] }
  - { method: GET, path: "/contracts/{id}", description: "Get contract", roles: [GeneralManager, FleetManager], code: 200, input: [], output: FleetContract, side_effects: [] }
  - { method: PATCH, path: "/contracts/{id}", description: "Amend contract discount/window; OCC on contract version; discount shortfall re-checked", roles: [GeneralManager], code: 200, input: ["discount_per_gallon_off?", "effective_to?", expected_contract_version], output: FleetContract, side_effects: ["increments FleetContract.version by 1"] }
  - { method: POST, path: "/contracts/{id}/activate", description: "Activate contract (window + fleet must permit)", roles: [GeneralManager], code: 200, input: [], output: FleetContract, side_effects: ["status -> ACTIVE"] }
  - { method: POST, path: "/contracts/{id}/suspend", description: "Suspend contract", roles: [GeneralManager], code: 200, input: [], output: FleetContract, side_effects: ["status -> SUSPENDED"] }
  - { method: POST, path: "/contracts/{id}/resume", description: "Resume contract", roles: [GeneralManager], code: 200, input: [], output: FleetContract, side_effects: ["status -> ACTIVE"] }
  - { method: POST, path: "/contracts/{id}/expire", description: "Expire contract", roles: [GeneralManager], code: 200, input: [], output: FleetContract, side_effects: ["status -> EXPIRED"] }
  - { method: POST, path: "/contracts/{id}/terminate", description: "Terminate contract", roles: [GeneralManager], code: 200, input: [], output: FleetContract, side_effects: ["status -> TERMINATED"] }
  - { method: GET, path: "/contracts/{id}/fuel-sales", description: "Fuel sales quoting this contract", roles: [GeneralManager, FleetManager], code: 200, input: ["limit?", "offset?"], output: "FuelSale[]", side_effects: [] }

  # --- Loyalty members & networks ---
  - { method: POST, path: "/loyalty-members", description: "Register a loyalty member", roles: [Cashier, GeneralManager], code: 201, input: [full_name, email, "fleet_account_id?", "stack_cap_points?"], output: LoyaltyMember, side_effects: ["status=ACTIVE, points_balance=0"] }
  - { method: GET, path: "/loyalty-members/{id}", description: "Get loyalty member", roles: [GeneralManager, Cashier, ShiftManager, FuelDeskLead, LoyaltyMember], code: 200, input: [], output: LoyaltyMember, side_effects: [] }
  - { method: POST, path: "/loyalty-members/{id}/suspend", description: "Suspend member", roles: [GeneralManager], code: 200, input: [], output: LoyaltyMember, side_effects: ["status -> SUSPENDED"] }
  - { method: POST, path: "/loyalty-members/{id}/reactivate", description: "Reactivate member", roles: [GeneralManager], code: 200, input: [], output: LoyaltyMember, side_effects: ["status -> ACTIVE"] }
  - { method: POST, path: "/loyalty-members/{id}/close", description: "Close member; cancels enrollments; forfeits points", roles: [GeneralManager], code: 200, input: [], output: LoyaltyMember, side_effects: ["status -> CLOSED", "enrollments -> CANCELLED", "points_balance -> 0"] }
  - { method: POST, path: "/loyalty-members/{id}/adjustments", description: "Manual points adjustment (positive or negative)", roles: [GeneralManager], code: 201, input: [points_delta, reason], output: LoyaltyPointsLot, side_effects: ["lot created; negative deltas decrement newest-first; balance recomputed"] }
  - { method: GET, path: "/loyalty-members/{id}/points-ledger", description: "Points lots ledger", roles: [GeneralManager, Cashier, LoyaltyMember], code: 200, input: ["limit?", "offset?"], output: "LoyaltyPointsLot[]", side_effects: [] }
  - { method: POST, path: "/loyalty-members/{id}/vehicles", description: "Register a vehicle plate", roles: [LoyaltyMember, Cashier, GeneralManager], code: 201, input: [plate, vehicle_type], output: RegisteredVehicle, side_effects: [] }
  - { method: GET, path: "/loyalty-members/{id}/vehicles", description: "List member vehicles", roles: [GeneralManager, Cashier, LoyaltyMember], code: 200, input: ["limit?", "offset?"], output: "RegisteredVehicle[]", side_effects: [] }
  - { method: POST, path: "/loyalty-members/{id}/discount-enrollments", description: "Enroll member in a discount network (PENDING)", roles: [LoyaltyMember, Cashier, GeneralManager], code: 201, input: [network_program_id], output: DiscountNetworkEnrollment, side_effects: ["status=PENDING"] }
  - { method: GET, path: "/loyalty-members/{id}/discount-enrollments", description: "List member enrollments", roles: [GeneralManager, Cashier, LoyaltyMember], code: 200, input: ["limit?", "offset?"], output: "DiscountNetworkEnrollment[]", side_effects: [] }
  - { method: GET, path: "/loyalty-members/{id}/fuel-sales", description: "Member fuel sales", roles: [GeneralManager, Cashier, LoyaltyMember], code: 200, input: ["limit?", "offset?"], output: "FuelSale[]", side_effects: [] }
  - { method: GET, path: "/loyalty-members/{id}/parking-reservations", description: "Member parking reservations", roles: [GeneralManager, Cashier, LoyaltyMember], code: 200, input: ["limit?", "offset?"], output: "ParkingReservation[]", side_effects: [] }
  - { method: GET, path: "/loyalty-members/{id}/service-tickets", description: "Member service tickets", roles: [GeneralManager, Cashier, LoyaltyMember], code: 200, input: ["limit?", "offset?"], output: "ServiceQueueTicket[]", side_effects: [] }
  - { method: GET, path: "/loyalty-members/{id}/store-sales", description: "Member store sales", roles: [GeneralManager, Cashier, LoyaltyMember], code: 200, input: ["limit?", "offset?"], output: "StoreSale[]", side_effects: [] }
  - { method: POST, path: "/discount-networks", description: "Create a discount network program (DRAFT)", roles: [GeneralManager], code: 201, input: [name, discount_per_gallon, applicable_fuel_types, program_cap], output: DiscountNetworkProgram, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/discount-networks/{id}", description: "Get network program", roles: [GeneralManager, Cashier, FuelDeskLead], code: 200, input: [], output: DiscountNetworkProgram, side_effects: [] }
  - { method: GET, path: "/discount-networks/{id}/enrollments", description: "List enrollments of a network", roles: [GeneralManager, Cashier], code: 200, input: ["status?", "limit?", "offset?"], output: "DiscountNetworkEnrollment[]", side_effects: [] }
  - { method: POST, path: "/discount-networks/{id}/activate", description: "Activate network", roles: [GeneralManager], code: 200, input: [], output: DiscountNetworkProgram, side_effects: ["status -> ACTIVE"] }
  - { method: POST, path: "/discount-networks/{id}/retire", description: "Retire network; cascades enrollments to RETIRED", roles: [GeneralManager], code: 200, input: [], output: DiscountNetworkProgram, side_effects: ["status -> RETIRED", "enrollments PENDING/ACTIVE/SUSPENDED -> RETIRED"] }
  - { method: POST, path: "/discount-enrollments/{id}/activate", description: "Activate enrollment (network ACTIVE, no duplicate, cap room)", roles: [Cashier, GeneralManager], code: 200, input: [], output: DiscountNetworkEnrollment, side_effects: ["status -> ACTIVE"] }
  - { method: POST, path: "/discount-enrollments/{id}/suspend", description: "Suspend enrollment", roles: [GeneralManager], code: 200, input: [], output: DiscountNetworkEnrollment, side_effects: ["status -> SUSPENDED"] }
  - { method: POST, path: "/discount-enrollments/{id}/resume", description: "Resume enrollment (re-checks cap)", roles: [GeneralManager], code: 200, input: [], output: DiscountNetworkEnrollment, side_effects: ["status -> ACTIVE"] }
  - { method: POST, path: "/discount-enrollments/{id}/cancel", description: "Cancel enrollment (self or GM)", roles: [LoyaltyMember, GeneralManager], code: 200, input: [], output: DiscountNetworkEnrollment, side_effects: ["status -> CANCELLED"] }

  # --- Store sales ---
  - { method: POST, path: "/sites/{id}/store-sales", description: "Ring up a restaurant/retail sale; decrements stock; earns points", roles: [Cashier], code: 201, input: [shift_id, tender_type, lines, "loyalty_member_id?"], output: StoreSale, side_effects: ["status=COMPLETED, payment_status=PAID", "stock decremented; is_low_stock recomputed", "loyalty STORE earn lot when member present", "CASH: shift expected += total; register posture recomputed"] }
  - { method: GET, path: "/sites/{id}/store-sales", description: "List store sales", roles: [GeneralManager, ShiftManager, Cashier], code: 200, input: ["status?", "limit?", "offset?"], output: "StoreSale[]", side_effects: [] }
  - { method: GET, path: "/store-sales/{id}", description: "Get store sale", roles: [GeneralManager, ShiftManager, Cashier, LoyaltyMember], code: 200, input: [], output: StoreSale, side_effects: [] }
  - { method: POST, path: "/store-sales/{id}/refund", description: "Refund a store sale; restores stock; claws back points", roles: [ShiftManager], code: 200, input: ["reason?"], output: StoreSale, side_effects: ["status -> REFUNDED, payment -> REFUNDED", "stock restored", "points clawback", "CASH: shift expected -= total; register posture recomputed"] }

  # --- Bulk fuel / DEF / oil supply ---
  - { method: POST, path: "/sites/{id}/bulk-tanks", description: "Create a bulk tank or tote (DIESEL/DEF/OIL)", roles: [GeneralManager], code: 201, input: [product_type, capacity_gallons, reorder_threshold_gallons, safety_stock_gallons, daily_usage_gallons, lead_time_days, "initial_gallons?", "rack_price_cents_per_gallon_4dp?"], output: BulkTank, side_effects: ["current_gallons = initial_gallons (default 0); is_low_stock computed"] }
  - { method: GET, path: "/sites/{id}/bulk-tanks", description: "List bulk tanks", roles: [GeneralManager, FuelDeskLead, ShiftManager], code: 200, input: ["product_type?", "limit?", "offset?"], output: "BulkTank[]", side_effects: [] }
  - { method: GET, path: "/bulk-tanks/{id}", description: "Get bulk tank", roles: [GeneralManager, FuelDeskLead, ShiftManager], code: 200, input: [], output: BulkTank, side_effects: [] }
  - { method: POST, path: "/bulk-tanks/{id}/stick-reading", description: "Record a physical stick reading; replaces book inventory", roles: [FuelDeskLead, GeneralManager], code: 200, input: [reading_gallons, "water_bottom_inches?"], output: BulkTank, side_effects: ["current_gallons := reading_gallons; is_low_stock recomputed"] }
  - { method: POST, path: "/bulk-tanks/{id}/deliveries", description: "Record a bulk delivery; updates inventory and (DIESEL) rack price", roles: [FuelDeskLead, GeneralManager], code: 201, input: [gallons_delivered, "water_bottom_inches?", "rack_price_cents_per_gallon_4dp?", "vendor_id?"], output: BulkDelivery, side_effects: ["tank.current_gallons += gallons_delivered", "tank.is_low_stock recomputed", "DIESEL: tank.rack_price updated when payload carries it (feeds contract_quote)", "reorder suggestions recompute"] }
  - { method: GET, path: "/bulk-tanks/{id}/deliveries", description: "List deliveries of a tank", roles: [GeneralManager, FuelDeskLead], code: 200, input: ["limit?", "offset?"], output: "BulkDelivery[]", side_effects: [] }
  - { method: GET, path: "/sites/{id}/reorder-suggestions", description: "Computed DEF/oil/diesel reorder suggestions", roles: [GeneralManager, FuelDeskLead], code: 200, input: [], output: { suggestions: array }, side_effects: [] }

  # --- Test-driving logical clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (ISO 8601 UTC). Server default before any set call is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time.", roles: [GeneralManager], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock advanced; lazy expiries (points lots, price windows, no-show grace) are evaluated against this clock on next read/write"] }
  - { method: GET, path: "/_clock", description: "Read the logical clock", roles: [GeneralManager, ShiftManager, FuelDeskLead, Cashier, MaintenanceTech, FleetManager, LoyaltyMember], code: 200, input: [], output: { current_utc: string }, side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request body, missing required field, invalid enum value, non-positive quantity, or invalid timestamp" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint, or entity-backed identity scope violated (member/fleet/cashier/technician acting outside own scope)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same user attempts two duties that must be segregated (open/close or close/reconcile a shift; cashier approving own payout)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist or is outside the path's site/parent scope" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity not in a state from which the requested transition exists (generic invalid transition)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_PUMP_NOT_AVAILABLE, http: 409, condition: "Pump not IDLE or does not serve the requested fuel type at fuel-sale authorize" }
  - { id: ERR_SHIFT_NOT_OPEN, http: 409, condition: "Money-affecting operation requires an OPEN shift" }
  - { id: ERR_REGISTER_NOT_AVAILABLE, http: 409, condition: "Register already has an OPEN shift when opening a new one" }
  - { id: ERR_FLEET_NOT_ACTIVE, http: 409, condition: "FleetAccount not ACTIVE (CREDIT_HOLD or CLOSED) for contract sale or fleet WO estimate approval" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "FleetContract not ACTIVE or current clock outside [effective_from, effective_to)" }
  - { id: ERR_BAY_OCCUPIED, http: 409, condition: "ShopBay not IDLE at work-order check-in" }
  - { id: ERR_MEMBER_NOT_ACTIVE, http: 409, condition: "LoyaltyMember not ACTIVE for redemption, accrual, enrollment activation, reservation or ticket creation" }
  - { id: ERR_WATER_BOTTOM_EXCEEDED, http: 422, condition: "Bulk delivery/stick reading reports water bottom above 1.0 inches" }
  - { id: ERR_INVALID_PRICING_MODE, http: 422, condition: "pricing_mode CONTRACT without fleet_account_id+contract_id, RETAIL with contract fields, or FLEET_BILLING tender on a RETAIL sale" }
  - { id: ERR_PLATE_NOT_REGISTERED, http: 422, condition: "Parking reservation plate is not a RegisteredVehicle owned by the same member" }
  - { id: ERR_CONTRACT_FUEL_TYPE, http: 422, condition: "Requested fuel_type not in contract.applicable_fuel_types" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "Parking window invalid: reserved_from in the past, reserved_to <= reserved_from, or window longer than 336 hours" }
  - { id: ERR_OVERLAPPING_PRICE_WINDOW, http: 422, condition: "New fuel price window is fully contained inside an existing ACTIVE same-fuel window (or effective_from >= effective_to)" }
  - { id: ERR_BAY_DOUBLE_BOOKED, http: 422, condition: "Requested schedule window (half-open) overlaps another non-terminal work order on the same bay" }
  - { id: ERR_BAY_MAINTENANCE_CONFLICT, http: 422, condition: "Requested schedule window touches a closed maintenance block on the bay (strict overlap: scheduled_from <= blocked_to AND blocked_from <= scheduled_to)" }
  - { id: ERR_NO_ACTIVE_PRICE, http: 422, condition: "No ACTIVE effective-now FuelPrice for the requested fuel type at the site" }
  - { id: ERR_NETWORK_NOT_ACTIVE, http: 422, condition: "Discount network not ACTIVE when activating/resuming an enrollment" }
  - { id: ERR_DUPLICATE_NETWORK_ENROLLMENT, http: 422, condition: "Member already has a PENDING/ACTIVE/SUSPENDED enrollment in the same network" }
  - { id: ERR_NETWORK_CAP_REACHED, http: 422, condition: "Network already has program_cap ACTIVE enrollments" }
  - { id: ERR_PARKING_CAPACITY_FULL, http: 422, condition: "Reservation would push the overlapping CONFIRMED/ACTIVE count above parking_paid_capacity at some instant, or no assignable space at check-in" }
  - { id: ERR_QUEUE_CAPACITY, http: 422, condition: "Service start while at capacity and no ACTIVE ticket is preemptable (elapsed < 15 minutes)" }
  - { id: ERR_QUEUE_EMPTY, http: 422, condition: "Service queue call with no QUEUED ticket of that service type at the site" }
  - { id: ERR_SCALE_NOT_CERTIFIABLE, http: 422, condition: "Scale settle requested without at least one GROSS and one TARE weigh event" }
  - { id: ERR_LOW_STOCK_APPROVAL_REQUIRED, http: 422, condition: "Shop part issue blocked while the StockItem is low (on_hand <= reorder_point); replenish first" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 422, condition: "Issue/store-sale quantity exceeds StockItem.on_hand_quantity" }
  - { id: ERR_NO_POINTS, http: 422, condition: "requested_redeem_points exceeds the member's redeemable (non-expired) points balance" }
  - { id: ERR_CONTRACT_DISCOUNT_SHORTFALL, http: 422, condition: "Contract discount_per_gallon_off exceeds the tier margin for the contract's pricing_tier" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "Fleet projected balance would exceed credit_limit_cents" }
  - { id: ERR_DROP_MISMATCH, http: 422, condition: "Cash drop denominations do not sum to amount_cents" }
  - { id: ERR_DROP_EXCEEDS_EXPECTED, http: 422, condition: "Cash drop would leave the drawer below its opening float" }
  - { id: ERR_PAYOUT_EXCEEDS_EXPECTED, http: 422, condition: "Payout exceeds the shift's expected cash" }
  - { id: ERR_REMAINING_BELOW_FLOAT, http: 422, condition: "Shift close blocked: expected cash below opening float" }
  - { id: ERR_COUNT_SHORTAGE_UNAPPROVED, http: 422, condition: "Shift close with |variance| > 500 cents without approve_variance: true" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: GeneralManager
    description: "Site general manager; superset role for configuration, fleet/contract administration, points adjustments, shift lock"
    identity: opaque
    exclusive_operations:
      - "POST /sites, POST /sites/{id}/parking-spaces, POST /sites/{id}/registers, POST /sites/{id}/stock-items, POST /sites/{id}/vendors, POST /sites/{id}/bays, POST /sites/{id}/technicians, POST /sites/{id}/bulk-tanks, POST /sites/{id}/purchase-orders"
      - "POST /fleet-accounts and fleet status actions (credit-hold/credit-reinstate/close/tier-recompute); POST/PATCH contracts and all contract lifecycle actions"
      - "POST /loyalty-members/{id}/adjustments, suspend/reactivate/close; POST /discount-networks and network activate/retire; enrollment suspend/resume"
      - "POST /purchase-orders/{id}/approve|cancel; POST /shifts/{id}/lock; POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints; work-order create/approve/schedule/cancel/close; store-sale list/get; enrollment activate/cancel"

  - name: ShiftManager
    description: "Shift supervisor; owns shift lifecycle, payouts, voids and refunds"
    identity: opaque
    exclusive_operations:
      - "POST /sites/{id}/shifts (open), POST /shifts/{id}/close, /reconcile, /payouts"
      - "POST /fuel-sales/{id}/void, POST /store-sales/{id}/refund"
    shared_operations:
      - "GET reads across the site; POST /parking-reservations/{id}/no-show; POST /scale-tickets/{id}/cancel"

  - name: FuelDeskLead
    description: "Fuel desk lead; owns price posting, pump status, bulk tank readings and deliveries"
    identity: opaque
    exclusive_operations:
      - "POST /sites/{id}/fuel-prices"
      - "POST /pumps/{id}/out-of-service, /return-to-service"
      - "POST /bulk-tanks/{id}/stick-reading, /deliveries"
    shared_operations:
      - "POST /sites/{id}/fuel-sales and dispensing/finalize actions; GET reads for site/fuel/bulk data"

  - name: Cashier
    description: "Front-counter cashier on a shift; rings up fuel/store/parking/service/scale sales and records own-shift drops"
    identity: opaque
    exclusive_operations:
      - "POST /fuel-sales/{id}/pay, POST /parking-reservations/{id}/check-in|check-out, POST /service-tickets/{id}/pay|start|complete|no-show|requeue, POST /sites/{id}/service-queue/call, POST /scale-tickets/{id}/weigh|settle|close, POST /sites/{id}/store-sales, POST /shifts/{id}/drops (own shift)"
    shared_operations:
      - "POST /sites/{id}/fuel-sales and dispensing/finalize; POST /loyalty-members and member vehicles/enrollments; POST /sites/{id}/parking-reservations and cancels; POST /sites/{id}/work-orders; GET reads"

  - name: MaintenanceTech
    description: "Shop technician; operates assigned work orders and parts; identity equals a Technician entity id"
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /work-orders/{id}/estimate, /start-work, /parts, /send-to-vendor, /return-from-vendor, /complete-work, /road-complete, POST /work-order-parts/{id}/return"
    shared_operations:
      - "POST /sites/{id}/work-orders, /check-in, /schedule, /dispatch-road, /cancel; POST /purchase-orders/{id}/receive; POST /bays/{id}/maintenance-block|maintenance-clear; GET reads for shop/stock/vendors"

  - name: FleetManager
    description: "Fleet company operator; identity equals a FleetAccount entity id; reads own fleet subtree and approves own fleet work-order estimates"
    identity: "entity_backed:FleetAccount"
    exclusive_operations:
      - "POST /work-orders/{id}/approve-estimate for work orders whose fleet_account_id equals the actor id"
    shared_operations:
      - "GET /fleet-accounts/{own}, own contracts/fuel-sales/work-orders/loyalty-members; GET /sites, GET /sites/{id}, GET /work-orders/{id} (own fleet)"

  - name: LoyaltyMember
    description: "Driver loyalty member; identity equals a LoyaltyMember entity id; self-service reservations, tickets, vehicles, enrollments"
    identity: "entity_backed:LoyaltyMember"
    exclusive_operations:
      - "POST /loyalty-members/{own}/vehicles (self), POST /loyalty-members/{own}/discount-enrollments (self)"
    shared_operations:
      - "POST /sites/{id}/parking-reservations and /service-tickets for self; POST /parking-reservations/{id}/cancel and /service-tickets/{id}/cancel for own records; GET own member record, ledger, vehicles, enrollments, sales; GET /sites, GET /sites/{id}, GET /_clock"
