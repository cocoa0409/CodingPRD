  # =========================================================================
  # Rule 6 - boundary precision on different metrics, different endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: exclusivity_window_end_instant_is_exclusive_on_submit
        grounds:
          - calculations.exclusivity_window
          - state_machines.DealRegistration.APPROVED_to_EXPIRED
          - state_machines.Account.CHANNEL_PROTECTED_to_OPEN_CHANNEL
          - validations[priority=30]
          - entities.DealRegistration.fields.exclusivity_end_at
        distinguishing_aspect: |
          Metric: a datetime threshold with half-open semantics, probed through
          POST /deal-registrations/{id}/submit. A rival submit at exclusivity_end_at - 1ms
          (2026-04-30T23:59:59.999Z) is refused with ERR_EXCLUSIVITY_CONFLICT, while the very
          next millisecond, exactly exclusivity_end_at (2026-05-01T00:00:00.000Z), succeeds
          because the expiry sweep flips the incumbent to EXPIRED - so the boundary is `<` on
          the end instant, not `<=`.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00.000Z."
            - "Two RESELLER partners each holding one TECH_ASSOCIATE certification (2 credits) and marketing_commitment_cents = 0."
            - "The incumbent partner's ANALYTICS_ADDON registration on the account is APPROVED at 2026-04-01, giving a REGISTERED-tier 30-day half-open window [2026-04-01T00:00:00.000Z, 2026-05-01T00:00:00.000Z) and leaving the account CHANNEL_PROTECTED."
            - "The challenger partner holds a DRAFT registration on the same account and product line, never submitted."
