          setup:
            - "Clock at 2026-08-01T00:00:00Z; Facility F"
            - "Six ACCEPTED transfer requests (TR1..TR6) each holding one of six AVAILABLE beds h1..h6 (6 ACTIVE holds = quota full)"
            - "TR7 ACCEPTED with isolation_need AIRBORNE; target bed b7 CARDIAC/CRITICAL/isolation NONE AVAILABLE (isolation-incompatible, and placing it would be the 7th hold)"
            - "Physician Dr ON_CALL credentialed CARDIAC"
          setup_api_calls:
