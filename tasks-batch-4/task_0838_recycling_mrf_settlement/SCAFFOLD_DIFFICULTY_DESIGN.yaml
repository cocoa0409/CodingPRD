        test_recipe:
          setup:
            - "Full OCC flow settled once: municipality share 0.60, single bale net10 moisture5 grade A, index 8000 covering clock, freight 5000 -> settled bale final_value 71000, revenue share 42600 posted (balance 42600)."
          setup_api_calls:
