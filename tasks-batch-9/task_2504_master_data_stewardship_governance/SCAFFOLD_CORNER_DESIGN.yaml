              as: GovernanceAdmin
              captures: { dom_v2: $.data.version }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${std_id}", steward_role: "DATA_STEWARD", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v2}" }
              as: GovernanceAdmin
            - call: "POST /mdm/source-systems"
              payload: { code: "ERP", name: "ERP Core", trust_tier: 4 }
              as: GovernanceAdmin
              captures: { erp_id: $.data.id }
            - call: "POST /mdm/source-systems/${erp_id}/certify"
              payload: {}
              as: GovernanceAdmin
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_v3: $.data.version }
            - call: "POST /mdm/source-registrations"
              payload: { domain_id: "${dom_id}", source_system_id: "${erp_id}", role: "AUTHORITATIVE", trust_rank: 1, effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v3}" }
              as: GovernanceAdmin
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { posture_seeded: $.data.governance_posture }
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${own_id}", rule_code: "QR1", dimension: "CONSISTENCY", weight_points: 40, threshold_pct: 90.00, severity: "CRITICAL" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { qr1_id: $.data.id }
          trigger:
            - call: "POST /mdm/domains/${dom_id}/scorecard-runs"
              payload: { basis: "CERTIFIED", measurements: [{ rule_code: "QR1", measured_pct: 50.00 }] }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { run_id: $.data.id, run_score: $.data.weighted_score, run_before: $.data.posture_before, run_after: $.data.posture_after, run_mult: $.data.posture_multiplier_applied, run_failed: $.data.rules_failed_count }
            - call: "GET /mdm/domains/${dom_id}"
              as: Auditor
              captures: { dom_posture: $.data.governance_posture, dom_weight: $.data.open_finding_weight, dom_cert: $.data.quality_score_certified, dom_prov: $.data.quality_score_provisional }
            - call: "GET /mdm/quality-findings?scorecard_run_id=${run_id}&quality_rule_id=${qr1_id}"
              as: Auditor
              captures: { f_weight: "$.data[0].severity_weight", f_gap: "$.data[0].gap_pct", f_status: "$.data[0].status" }
            - call: "GET /mdm/scorecard-runs?domain_id=${dom_id}&basis=CERTIFIED"
              as: Auditor
              captures: { list_score: "$.data[0].weighted_score", list_after: "$.data[0].posture_after" }
          assert:
            - "setup: ${posture_seeded} == OPEN - the registration recompute found an authoritative source and no findings"
            - "${run_score} == 55.55 (round(40 x 50.00 / 90.00, 2) == 22.22 earned of 40, then round(100 x 22.22 / 40, 2)) and ${run_failed} == 1"
            - "${run_before} == OPEN and ${run_mult} == 1.00 - the multiplier is pinned from the posture at request start"
            - "${run_after} == RESTRICTED - reported by the mutating response itself, not only by a later read"
            - "${f_weight} == 20.00 (CRITICAL base 20 x 1.00), ${f_gap} == 40.00, ${f_status} == OPEN"
            - "${dom_posture} == ${run_after} and ${dom_weight} == 20.00 - the immediately following read agrees with the response body"
            - "${dom_cert} == 55.55 while ${dom_prov} == null - only the run's own basis ledger field moved"
            - "the run list returns total_count == 1 with ${list_score} == 55.55 and ${list_after} == RESTRICTED - the immutable run row stores what its own response reported"
