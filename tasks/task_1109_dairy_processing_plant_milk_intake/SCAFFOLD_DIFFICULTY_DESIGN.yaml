  # -------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # -------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: receipt_release_gated_on_permit
        grounds:
          - state_machines.TankerReceipt.QUARANTINE_to_RELEASED_FOR_PROCESSING
          - entities.GradeAPermit.fields.status
        distinguishing_aspect: |
          TankerReceipt.release precondition depends on GradeAPermit.status ==
          ACTIVE (pair: TankerReceipt × GradeAPermit). When permit moves to
          UNDER_REVIEW, release is blocked even though the receipt's own lab
          results are clean.
        test_recipe:
          setup:
            - "Receipt with passing lab results, producer ACTIVE, hauler licensed"
            - "Permit moved to UNDER_REVIEW via record-inspection (score 75, 3 violations)"
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "P700", farm_name: "F7", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
              captures: { prod_id: $.data.id }
            - call: "POST /dairy/haulers"
              payload: { hauler_code: "H700", company_name: "Haul", license_expires_at: "2027-01-01T00:00:00Z" }
              as: PlantController
              captures: { hauler_id: $.data.id }
            - call: "POST /dairy/grade-a-permits"
              payload: { permit_number: "GA-700", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StateInspector
              captures: { permit_id: $.data.id }
            - call: "POST /dairy/tanker-receipts"
              payload: { producer_id: "${prod_id}", hauler_id: "${hauler_id}", arrived_at: "2026-05-05T08:00:00Z", gross_weight_lbs: 50000, tare_weight_lbs: 30000, temperature_f: 40 }
              as: QualityAssuranceManager
              captures: { rcpt: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt}/lab-tests"
              payload: { test_type: "ANTIBIOTIC", result_value: 0, lab_technician_id: "lt1" }
              as: LabTechnician
              captures: { lt_ab: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt}/lab-tests"
              payload: { test_type: "SCC", result_value: 300000, lab_technician_id: "lt1" }
              as: LabTechnician
              captures: { lt_scc: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt}/lab-tests/${lt_ab}/complete"
              payload: {}
              as: LabTechnician
            - call: "POST /dairy/tanker-receipts/${rcpt}/lab-tests/${lt_scc}/complete"
              payload: {}
              as: LabTechnician
            - call: "POST /dairy/grade-a-permits/${permit_id}/record-inspection"
              payload: { inspection_score: 75, violations_found: 3 }
              as: StateInspector
          trigger:
            - call: "GET /dairy/producers/${prod_id}"
              as: PlantController
              captures: { prod_v_10: "$.data.version" }
            - call: "POST /dairy/tanker-receipts/${rcpt}/release"
              payload: { expected_producer_version: "${prod_v_10}" }
              as: QualityAssuranceManager
          assert:
            - "HTTP 422 ERR_PERMIT_NOT_ACTIVE — GradeAPermit.status == UNDER_REVIEW blocks TankerReceipt release"

      - name: run_start_gated_on_cip_validation
        grounds:
          - state_machines.PasteurizerRun.SCHEDULED_to_RUNNING
          - entities.CipCycle.fields.validation_outcome
        distinguishing_aspect: |
          PasteurizerRun.start precondition depends on the most recent CipCycle's
          validation_outcome == PASS for the same pasteurizer_id within trailing
          24 hours (pair: PasteurizerRun × CipCycle — distinct from instance 1's
          TankerReceipt × GradeAPermit). A missing/FAILED CIP blocks the run
          even if the run itself is well-formed.
        test_recipe:
          setup:
            - "PasteurizerRun scheduled; most recent CipCycle for the pasteurizer is FAILED"
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlantController
            - call: "POST /dairy/grade-a-permits"
              payload: { permit_number: "GA-701", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StateInspector
            - call: "POST /dairy/pasteurizer-runs"
              payload: { pasteurizer_id: "HTST-1", scheduled_start_at: "2026-05-10T08:00:00Z", scheduled_end_at: "2026-05-10T12:00:00Z", flow_rate_gph: 5000, min_hold_temp_f: 161 }
              as: PasteurizerOperator
              captures: { run_id: $.data.id }
            - call: "POST /dairy/pasteurizer-runs/${run_id}/cip-cycles"
              payload: { started_at: "2026-05-09T08:00:00Z", caustic_conductivity_ms: 70.0, rinse_ph: 9.5 }
              as: PasteurizerOperator
              captures: { cip_id: $.data.id }
            - call: "POST /dairy/pasteurizer-runs/${run_id}/cip-cycles/${cip_id}/fail"
              payload: {}
              as: QualityAssuranceManager
          trigger:
            - call: "POST /dairy/pasteurizer-runs/${run_id}/start"
              payload: {}
              as: PasteurizerOperator
          assert:
            - "HTTP 422 ERR_CIP_STALE — most recent CipCycle is FAILED, blocks PasteurizerRun.start"

  # -------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # -------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: pasteurizer_run_overlap_half_open
        grounds:
          - state_machines.PasteurizerRun.SCHEDULED_to_RUNNING
          - errors[ERR_PASTEURIZER_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open [scheduled_start_at, scheduled_end_at)
          on the pasteurizer_id resource. Two runs whose intervals abut (end of
          one == start of the other) do NOT conflict; runs that share any
          interior point DO. Resource entity: PasteurizerRun.
        test_recipe:
          setup:
            - "Run A on HTST-1 [08:00, 12:00) currently RUNNING"
            - "Run B on HTST-1 [12:00, 16:00) — adjacent, half-open semantics means no overlap"
            - "Run C on HTST-1 [11:00, 13:00) — overlaps interior"
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T07:00:00Z" }
              as: PlantController
            - call: "POST /dairy/grade-a-permits"
              payload: { permit_number: "GA-800", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StateInspector
            - call: "POST /dairy/pasteurizer-runs"
              payload: { pasteurizer_id: "HTST-1", scheduled_start_at: "2026-05-10T08:00:00Z", scheduled_end_at: "2026-05-10T12:00:00Z", flow_rate_gph: 5000, min_hold_temp_f: 161 }
              as: PasteurizerOperator
              captures: { run_a: $.data.id }
            - call: "POST /dairy/pasteurizer-runs/${run_a}/cip-cycles"
              payload: { started_at: "2026-05-10T06:00:00Z", caustic_conductivity_ms: 90.0, rinse_ph: 7.0 }
              as: PasteurizerOperator
              captures: { cip_a: $.data.id }
            - call: "POST /dairy/pasteurizer-runs/${run_a}/cip-cycles/${cip_a}/validate"
              payload: {}
              as: QualityAssuranceManager
            - call: "POST /dairy/pasteurizer-runs/${run_a}/start"
              payload: {}
              as: PasteurizerOperator
            - call: "POST /dairy/pasteurizer-runs"
              payload: { pasteurizer_id: "HTST-1", scheduled_start_at: "2026-05-10T12:00:00Z", scheduled_end_at: "2026-05-10T16:00:00Z", flow_rate_gph: 5000, min_hold_temp_f: 161 }
              as: PasteurizerOperator
              captures: { run_b: $.data.id }
            - call: "POST /dairy/pasteurizer-runs"
              payload: { pasteurizer_id: "HTST-1", scheduled_start_at: "2026-05-10T11:00:00Z", scheduled_end_at: "2026-05-10T13:00:00Z", flow_rate_gph: 5000, min_hold_temp_f: 161 }
              as: PasteurizerOperator
              captures: { run_c: $.data.id }
          trigger:
            - call: "POST /dairy/pasteurizer-runs/${run_c}/start"
              payload: {}
              as: PasteurizerOperator
              captures: { err: $.data.error_id }
          assert:
            - "Run C start → HTTP 409 ERR_PASTEURIZER_OVERLAP (interior overlap with RUNNING run A)"
            - "Run B's half-open start at 12:00 does NOT overlap A's [08:00, 12:00); Run B would succeed once it has its own VALIDATED CIP"

      - name: cip_24hour_stale_window
        grounds:
          - state_machines.PasteurizerRun.SCHEDULED_to_RUNNING
          - errors[ERR_CIP_STALE]
        distinguishing_aspect: |
          Interval semantics: trailing 24-hour sliding window ending at current
          logical clock, distinct from half-open static intervals in instance 1.
          A CipCycle completed 23h59m ago is fresh; one completed 24h01m ago is
          stale. Resource entity: CipCycle × logical clock — different entity
          and different interval semantics (sliding vs half-open).
        test_recipe:
          setup:
            - "VALIDATED CipCycle completed at 2026-05-09T08:00:00Z"
            - "Logical clock advanced to 2026-05-10T08:01:00Z (25h01m later — stale)"
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-09T08:00:00Z" }
              as: PlantController
            - call: "POST /dairy/grade-a-permits"
              payload: { permit_number: "GA-801", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StateInspector
            - call: "POST /dairy/pasteurizer-runs"
              payload: { pasteurizer_id: "HTST-1", scheduled_start_at: "2026-05-10T09:00:00Z", scheduled_end_at: "2026-05-10T12:00:00Z", flow_rate_gph: 5000, min_hold_temp_f: 161 }
              as: PasteurizerOperator
              captures: { run_id: $.data.id }
            - call: "POST /dairy/pasteurizer-runs/${run_id}/cip-cycles"
              payload: { started_at: "2026-05-09T07:00:00Z", caustic_conductivity_ms: 90.0, rinse_ph: 7.0 }
              as: PasteurizerOperator
              captures: { cip_id: $.data.id }
            - call: "POST /dairy/pasteurizer-runs/${run_id}/cip-cycles/${cip_id}/validate"
              payload: {}
              as: QualityAssuranceManager
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T08:01:00Z" }
              as: PlantController
          trigger:
            - call: "POST /dairy/pasteurizer-runs/${run_id}/start"
              payload: {}
              as: PasteurizerOperator
          assert:
            - "HTTP 422 ERR_CIP_STALE — VALIDATED CIP is now 25h01m old, outside the trailing 24-hour window"

  # -------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # -------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: release_then_divert_conserves_pool_total
        grounds:
          - state_machines.TankerReceipt.QUARANTINE_to_RELEASED_FOR_PROCESSING
          - state_machines.TankerReceipt.RELEASED_FOR_PROCESSING_to_DIVERTED
          - entities.MarketingOrderPool.fields.total_pooled_lbs
        distinguishing_aspect: |
          Conserved quantity: MarketingOrderPool.total_pooled_lbs. Forward action
          release adds net_weight_lbs; compensating action divert subtracts the
          same amount. After release+divert pair, pool total MUST equal its
          pre-release value exactly. Formula: total_pooled_lbs_initial ==
          total_pooled_lbs_after_release_then_divert.
        test_recipe:
          setup:
            - "Empty pool for May; total_pooled_lbs == 0"
            - "One receipt of net_weight_lbs == 70000"
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "P900", farm_name: "F9", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
              captures: { prod_id: $.data.id }
            - call: "POST /dairy/haulers"
              payload: { hauler_code: "H900", company_name: "Haul", license_expires_at: "2027-01-01T00:00:00Z" }
              as: PlantController
              captures: { hauler_id: $.data.id }
            - call: "POST /dairy/grade-a-permits"
              payload: { permit_number: "GA-900", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StateInspector
            - call: "POST /dairy/marketing-order-pools"
              payload: { pool_month: "2026-05", announced_class_i_price_cents: 2200, butterfat_price_cents_per_lb: 300, protein_price_cents_per_lb: 250, other_solids_price_cents_per_lb: 40 }
              as: PlantController
              captures: { pool_id: $.data.id }
            - call: "POST /dairy/tanker-receipts"
              payload: { producer_id: "${prod_id}", hauler_id: "${hauler_id}", arrived_at: "2026-05-05T08:00:00Z", gross_weight_lbs: 100000, tare_weight_lbs: 30000, temperature_f: 40 }
              as: QualityAssuranceManager
              captures: { rcpt: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt}/lab-tests"
              payload: { test_type: "ANTIBIOTIC", result_value: 0, lab_technician_id: "lt1" }
              as: LabTechnician
              captures: { lt_ab: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt}/lab-tests"
              payload: { test_type: "SCC", result_value: 300000, lab_technician_id: "lt1" }
              as: LabTechnician
              captures: { lt_scc: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt}/lab-tests/${lt_ab}/complete"
              payload: {}
              as: LabTechnician
            - call: "POST /dairy/tanker-receipts/${rcpt}/lab-tests/${lt_scc}/complete"
              payload: {}
              as: LabTechnician
            - call: "GET /dairy/marketing-order-pools/${pool_id}"
              as: PlantController
              captures: { initial_total: $.data.total_pooled_lbs }
          trigger:
            - call: "GET /dairy/producers/${prod_id}"
              as: PlantController
              captures: { prod_v_11: "$.data.version" }
            - call: "POST /dairy/tanker-receipts/${rcpt}/release"
              payload: { expected_producer_version: "${prod_v_11}" }
              as: QualityAssuranceManager
            - call: "POST /dairy/tanker-receipts/${rcpt}/divert"
              payload: {}
              as: QualityAssuranceManager
            - call: "GET /dairy/marketing-order-pools/${pool_id}"
              as: PlantController
              captures: { final_total: $.data.total_pooled_lbs }
          assert:
            - "initial_total == 0"
            - "final_total == 0 (release+divert pair conserved total_pooled_lbs)"
            - "TankerReceipt.${rcpt}.disposition == DIVERTED"

      - name: reject_then_settlement_conserves_rolling_count
        grounds:
          - state_machines.TankerReceipt.QUARANTINE_to_REJECTED
          - entities.Producer.fields.rolling_rejection_count_30d
          - calculations.producer_quality_flag_calc
        distinguishing_aspect: |
          Conserved quantity: Producer.rolling_rejection_count_30d. Forward
          action reject increments by 1; compensating action (rejection aging
          out of the trailing 30-day window after clock advance) decrements by 1.
          Distinct conserved quantity from instance 1 (pool lbs vs producer
          rejection counter).
        test_recipe:
          setup:
            - "Producer with one rejection on 2026-05-01, count == 1"
            - "Logical clock advanced to 2026-06-01 (rejection falls out of trailing 30-day window)"
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "P901", farm_name: "F9b", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
              captures: { prod_id: $.data.id }
            - call: "POST /dairy/haulers"
              payload: { hauler_code: "H901", company_name: "Haul", license_expires_at: "2027-01-01T00:00:00Z" }
              as: PlantController
              captures: { hauler_id: $.data.id }
            - call: "POST /dairy/grade-a-permits"
              payload: { permit_number: "GA-901", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StateInspector
            - call: "POST /dairy/tanker-receipts"
              payload: { producer_id: "${prod_id}", hauler_id: "${hauler_id}", arrived_at: "2026-05-01T08:00:00Z", gross_weight_lbs: 50000, tare_weight_lbs: 30000, temperature_f: 40 }
              as: QualityAssuranceManager
              captures: { rcpt: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt}/lab-tests"
              payload: { test_type: "ANTIBIOTIC", result_value: 5, lab_technician_id: "lt1" }
              as: LabTechnician
              captures: { lt1: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt}/lab-tests/${lt1}/complete"
              payload: {}
              as: LabTechnician
            - call: "POST /dairy/tanker-receipts/${rcpt}/reject"
              payload: {}
              as: QualityAssuranceManager
            - call: "GET /dairy/producers/${prod_id}"
              as: PlantController
              captures: { count_after_reject: $.data.rolling_rejection_count_30d }
          trigger:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlantController
            # Force recomputation by attempting another reject on a fresh receipt that doesn't trigger it
            # (or rely on read-time recomputation)
            - call: "GET /dairy/producers/${prod_id}"
              as: PlantController
              captures: { count_after_window: $.data.rolling_rejection_count_30d }
          assert:
            - "count_after_reject == 1"
            - "count_after_window == 0 (rejection aged out of trailing 30-day window; counter conserved)"
