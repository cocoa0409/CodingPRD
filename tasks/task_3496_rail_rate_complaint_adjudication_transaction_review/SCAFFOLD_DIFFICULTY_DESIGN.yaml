            - "after the finding lands: Carrier.${c_oktx}.revenue_adequacy_status == INADEQUATE (single-year 1000 < 1140)"
            - "second decide succeeds: RateComplaint.${rc1}.status == DECIDED, prescribed_rate_cents_per_ton == 11550 (INADEQUATE floor binds over reference 11200)"
            - "RateComplaint.${rc1}.relief_granted_cents == 7950000 and award_granted_cents == 79500"
      - name: petition_grant_gated_on_escalated_evidence
