  # ============================================================
  # Section: cross_cutting_complexity_layers
  # ============================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_correct_version_succeeds_and_increments
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[registered-agent-create-stale-business-entity]
        distinguishing_aspect: "POST /business-entities/{id}/registered-agents with expected_business_entity_version equal to current succeeds, the new RegisteredAgent is created, and BusinessEntity.version increments by 1."
        excluded_because:
          difficulty_instance: compensating_invariant / ci_registered_agent_supersede_preserves_active_count
          rationale: "OCC correct-version success path is the precondition of the §1.8 invariant instance."

      - name: cascading_side_effects_three_hop_excluded
        claim_type: cascading_side_effects
        grounds:
          - state_machines.AnnualReport.DRAFT_to_DELINQUENT
        excluded_because:
          difficulty_instance: transitive_cascade / tc_clock_advance_drives_three_hop_chain
          rationale: "Three-hop cascade is the §1.8 transitive_cascade instance."

