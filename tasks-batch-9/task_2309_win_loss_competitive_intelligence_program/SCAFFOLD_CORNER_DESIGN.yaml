      - name: analyst_lookup_with_unused_uuid_not_found
        claim_type: triggerability
        grounds:
          - errors.ERR_ANALYST_NOT_FOUND
          - validations.priority_5
          - endpoints.GET /analysts/{analyst_id}
        distinguishing_aspect: "A syntactically well-formed uuid that was never issued must resolve to 404 ERR_ANALYST_NOT_FOUND on the by-id read. This pins the code as reachable and forbids the two plausible wrong answers: 200 with a null payload, and 400 ERR_INVALID_REQUEST (the uuid is well-formed, so it is an existence failure, not a shape failure)."
        test_recipe:
          setup: ["Set the clock only. No analyst row is created in this test, so the probe uuid cannot collide with a real id."]
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramAdmin
              as_user_id: admin-1
          trigger:
            - call: GET /analysts/00000000-0000-4000-8000-0000000000dd
              payload: {}
              as: ProgramAdmin
              as_user_id: admin-1
          assert:
            - "HTTP 404"
            - "data.error_id == \"ERR_ANALYST_NOT_FOUND\""
            - "response_type == \"error\""

