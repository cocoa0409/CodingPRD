# =============================================================================
# Task 0970: Aging-in-Place Sensor & Remote Monitoring — Seed Tables
# =============================================================================

scenario: |
  970. Aging-in-Place Sensor & Remote Monitoring: sensor/wearable kit & install,
  activity & fall detection, alert & escalation contact-tree, caregiver
  dashboard & check-in, medication reminder & adherence, subscription tier,
  battery/health, wellness report

domain_name: aging-in-place-monitoring
api_prefix: /v1

complexity_profile:
  primary_archetype: workflow_orchestration   # alert escalation contact-tree pipeline with timeouts
  secondary_archetype: temporal_windowing     # install windows, dose windows, check-in intervals
  complexity_layers:
    - cascading_side_effects                  # dose-miss -> streak -> alert -> notification chains
    - rate_threshold_triggers                 # battery / inactivity / missed-streak / check-in thresholds
    - dual_variant_calculation                # billing proration + wellness index
    - optimistic_concurrency                  # OCC on Senior.version and WellnessReport.version
  entity_topology: flat                       # peer collections under /v1, FK references in bodies
  state_machine_shape: parallel               # Subscription: service_status x billing_status; Alert is cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles                      # Caregiver / Installer / Senior / MonitoringAgent / DeviceHub own distinct surfaces
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Senior
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Senior's legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: address, type: string, source: input, description: "Street address where the kit is installed" }
      - { name: monitoring_posture, type: enum, source: computed, description: "INACTIVE | ACTIVE | DEGRADED — derived from the senior's Subscription.service_status (ACTIVE->ACTIVE, SUSPENDED->DEGRADED, otherwise INACTIVE); gates all non-CRITICAL alert creation/notification" }
      - { name: open_alert_count, type: integer, source: computed, default: 0, description: "Count of this senior's Alerts with status IN {RAISED, NOTIFYING, ESCALATED, ACKNOWLEDGED}" }
      - { name: risk_tier, type: enum, source: computed, default: STANDARD, description: "ELEVATED if any open CRITICAL alert exists OR any ACTIVE CRITICAL MedicationSchedule has missed_streak >= 3; else STANDARD" }

  - name: SubscriptionPlan
    parent: null
    common_fields: true
    fields:
      - { name: tier, type: enum, source: input, description: "ESSENTIAL | PLUS | PREMIUM" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Recurring fee per 30-day cycle, in cents" }
      - { name: included_motion_sensors, type: integer, source: input, description: "Motion sensors bundled in the kit at no extra charge" }
      - { name: extra_sensor_fee_cents, type: integer, source: input, description: "Per-extra-motion-sensor fee per 30-day cycle, in cents" }
      - { name: max_contacts, type: integer, source: input, description: "Maximum ACTIVE ContactTreeEntry rows per senior on this plan" }
      - { name: checkin_interval_hours, type: integer, source: input, description: "Maximum allowed gap between caregiver/senior check-ins before a MISSED_CHECKIN alert fires" }
      - { name: medication_reminders_enabled, type: boolean, source: input, description: "Whether MedicationSchedule creation is allowed on this plan" }
      - { name: wellness_report_enabled, type: boolean, source: input, description: "Whether WellnessReport generation is allowed on this plan" }
      - { name: wellness_report_cadence, type: enum, source: input, description: "NONE | MONTHLY | WEEKLY — informational cadence for report periods" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: senior_id, type: string, source: input, description: "FK -> Senior.id; the subscribed senior" }
      - { name: plan_id, type: string, source: input, description: "FK -> SubscriptionPlan.id; current plan" }
      - { name: service_status, type: enum, source: system, description: "PROVISIONING | ACTIVE | SUSPENDED | CANCELLED — parallel dimension 1" }
      - { name: billing_status, type: enum, source: system, description: "CURRENT | PAST_DUE | DELINQUENT — parallel dimension 2, evolves independently of service_status" }
      - { name: current_period_end, type: datetime, source: system, description: "End of the current 30-day billing cycle; set at activation to activated_at + 30 days" }
      - { name: billing_credit_cents, type: integer, source: computed, default: 0, description: "Customer credit balance from negative plan-change net amounts" }
      - { name: lifetime_charged_cents, type: integer, source: computed, default: 0, description: "Cumulative positive net plan-change charges" }
      - { name: lifetime_credited_cents, type: integer, source: computed, default: 0, description: "Cumulative negative net plan-change credits (absolute value)" }
      - { name: consecutive_failed_payments, type: integer, source: computed, default: 0, description: "Reset to 0 on SUCCEEDED payment; incremented on FAILED" }
      - { name: last_change_plan_credit_cents, type: integer, source: computed, description: "Plan-fee credit line of the most recent change-plan (null before first)" }
      - { name: last_change_sensor_credit_cents, type: integer, source: computed, description: "Extra-sensor credit line of the most recent change-plan" }
      - { name: last_change_total_credit_cents, type: integer, source: computed, description: "Sum of per-line-rounded credits of the most recent change-plan" }
      - { name: last_change_total_charge_cents, type: integer, source: computed, description: "Sum of per-line-rounded charges of the most recent change-plan" }
      - { name: last_change_net_cents, type: integer, source: computed, description: "total_charge - total_credit of the most recent change-plan" }

  - name: SensorKit
    parent: null
    common_fields: true
    fields:
      - { name: senior_id, type: string, source: input, description: "FK -> Senior.id; kit owner" }
      - { name: motion_sensor_count, type: integer, source: input, description: "Requested motion sensors; defaults to the plan's included_motion_sensors" }
      - { name: status, type: enum, source: system, description: "ORDERED | SHIPPED | DELIVERED | INSTALLED | ACTIVE" }

  - name: Device
    parent: null
    common_fields: true
    fields:
      - { name: kit_id, type: string, source: input, description: "FK -> SensorKit.id; containing kit" }
      - { name: senior_id, type: string, source: input, description: "FK -> Senior.id; denormalized owner for filtered queries" }
      - { name: device_type, type: enum, source: system, description: "GATEWAY | WEARABLE | MOTION" }
      - { name: serial, type: string, source: system, description: "System-minted serial '<KITSEQ>-<TYPE>-<IDX>'; unique" }
      - { name: status, type: enum, source: system, description: "PROVISIONED | INSTALLED | ONLINE | OFFLINE | DECOMMISSIONED" }
      - { name: battery_percent, type: integer, source: computed, default: 100, description: "Latest battery reading from telemetry (0..100)" }
      - { name: last_seen_at, type: datetime, source: system, description: "observed_at of the most recent telemetry event; null until first event" }

  - name: SensorEvent
    parent: null
    common_fields: false
    fields:
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; emitting device" }
      - { name: senior_id, type: string, source: system, description: "FK -> Senior.id; denormalized from the device at ingest" }
      - { name: event_type, type: enum, source: input, description: "HEARTBEAT | MOTION | DOOR_OPEN | DOOR_CLOSE | FALL_DETECTED | PILL_DISPENSED" }
      - { name: observed_at, type: datetime, source: input, description: "When the event physically occurred (must be <= current clock)" }
      - { name: battery_percent, type: integer, source: input, description: "Optional battery reading carried by the event (0..100)" }
      - { name: note, type: string, source: input, description: "Optional free-text payload note" }

  - name: Installer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Installer name" }
      - { name: region, type: string, source: input, description: "Service region code" }

  - name: InstallAppointment
    parent: null
    common_fields: true
    fields:
      - { name: senior_id, type: string, source: input, description: "FK -> Senior.id; install site owner" }
      - { name: kit_id, type: string, source: input, description: "FK -> SensorKit.id; kit to install (must belong to senior_id)" }
      - { name: installer_id, type: string, source: input, description: "FK -> Installer.id; assigned installer" }
      - { name: window_start, type: datetime, source: input, description: "Start of the install window (must be after current clock)" }
      - { name: window_end, type: datetime, source: input, description: "End of the install window; duration must be 60..240 minutes" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CONFIRMED | COMPLETED | CANCELLED | NO_SHOW" }

  - name: Caregiver
    parent: null
    common_fields: true
    fields:
      - { name: senior_id, type: string, source: input, description: "FK -> Senior.id; the senior this caregiver serves (ownership anchor)" }
      - { name: full_name, type: string, source: input, description: "Caregiver name" }
      - { name: phone, type: string, source: input, description: "Contact phone number" }

  - name: ContactTreeEntry
    parent: null
    common_fields: true
    fields:
      - { name: senior_id, type: string, source: input, description: "FK -> Senior.id; tree owner" }
      - { name: caregiver_id, type: string, source: input, description: "FK -> Caregiver.id; notified caregiver (must serve the same senior)" }
      - { name: priority_rank, type: integer, source: input, description: "Escalation order within the senior's tree; 1 = first notified; unique among ACTIVE entries of the senior" }
      - { name: min_severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL — entry is eligible only for alerts with severity >= this" }
      - { name: response_timeout_seconds, type: integer, source: input, description: "How long the system waits for this contact's acknowledgement before escalating" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REMOVED" }

  - name: Alert
    parent: null
    common_fields: true
    fields:
      - { name: senior_id, type: string, source: input, description: "FK -> Senior.id; alert subject" }
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; nullable — set for LOW_BATTERY / DEVICE_OFFLINE / FALL / PILL events" }
      - { name: alert_type, type: enum, source: input, description: "FALL | INACTIVITY | MISSED_MEDICATION | MISSED_CHECKIN | DEVICE_OFFLINE | LOW_BATTERY | MANUAL" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL" }
      - { name: status, type: enum, source: system, description: "RAISED | NOTIFYING | ESCALATED | ACKNOWLEDGED | RESOLVED | FALSE_ALARM" }
      - { name: escalation_level, type: integer, source: system, default: 0, description: "0 while no notification sent; N while the Nth notified contact is pending" }
      - { name: escalation_exhausted, type: boolean, source: system, default: false, description: "True when the last eligible contact timed out with no further contact" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Number of times this alert was reopened from RESOLVED/FALSE_ALARM" }
      - { name: acknowledged_by_caregiver_id, type: string, source: system, description: "Caregiver who acknowledged; null for agent acknowledgement" }
      - { name: resolution_note, type: string, source: system, description: "Set on resolve/false-alarm; AUTO_RESOLVED_POSTURE_DEGRADED for cascade auto-resolution" }

  - name: AlertNotification
    parent: null
    common_fields: false
    fields:
      - { name: alert_id, type: string, source: system, description: "FK -> Alert.id; parent alert" }
      - { name: contact_entry_id, type: string, source: system, description: "FK -> ContactTreeEntry.id; entry used for this attempt" }
      - { name: caregiver_id, type: string, source: system, description: "FK -> Caregiver.id; denormalized notified caregiver" }
      - { name: level, type: integer, source: system, description: "Escalation level of this attempt (1-based)" }
      - { name: status, type: enum, source: system, description: "SENT | ACKED | TIMED_OUT | SUPERSEDED" }
      - { name: sent_at, type: datetime, source: system, description: "Logical-clock time the notification was sent" }

  - name: MedicationSchedule
    parent: null
    common_fields: true
    fields:
      - { name: senior_id, type: string, source: input, description: "FK -> Senior.id; patient" }
      - { name: medication_name, type: string, source: input, description: "Medication label; creating a new ACTIVE schedule with an existing (senior, medication_name) supersedes the old one" }
      - { name: times_of_day, type: array, source: input, description: "Array of 'HH:MM' UTC dose times, 1..4 entries, ascending" }
      - { name: window_minutes, type: integer, source: input, description: "Minutes after each scheduled time during which the dose can still be confirmed (15..240)" }
      - { name: criticality, type: enum, source: input, description: "ROUTINE | CRITICAL" }
      - { name: start_date, type: string, source: input, description: "ISO date; first day doses are generated" }
      - { name: missed_streak, type: integer, source: computed, default: 0, description: "Consecutive MISSED DoseEvents for this schedule; reset to 0 on any TAKEN confirmation" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ENDED" }

  - name: DoseEvent
    parent: null
    common_fields: false
    fields:
      - { name: schedule_id, type: string, source: system, description: "FK -> MedicationSchedule.id; generating schedule" }
      - { name: senior_id, type: string, source: system, description: "FK -> Senior.id; denormalized patient" }
      - { name: scheduled_at, type: datetime, source: system, description: "Scheduled dose instant (start_date + times_of_day entry)" }
      - { name: status, type: enum, source: system, description: "PENDING | TAKEN | MISSED | SKIPPED" }
      - { name: confirmed_at, type: datetime, source: system, description: "When the dose was confirmed TAKEN; null otherwise" }
      - { name: punctual, type: boolean, source: system, description: "True if confirmed_at <= scheduled_at + 15 minutes; false if later but within window; null unless TAKEN" }

  - name: CheckIn
    parent: null
    common_fields: false
    fields:
      - { name: senior_id, type: string, source: input, description: "FK -> Senior.id; check-in subject" }
      - { name: caregiver_id, type: string, source: system, description: "FK -> Caregiver.id; null when the senior self-checks-in" }
      - { name: kind, type: enum, source: input, description: "SELF_CONFIRM | APP_CONFIRM | CALL | VISIT" }
      - { name: note, type: string, source: input, description: "Optional note" }
      - { name: occurred_at, type: datetime, source: system, description: "Logical-clock time of the check-in" }

  - name: WellnessReport
    parent: null
    common_fields: true
    fields:
      - { name: senior_id, type: string, source: input, description: "FK -> Senior.id; report subject" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive period start (00:00:00Z of a day)" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive period end; period must span 1..31 days" }
      - { name: mode, type: enum, source: input, description: "PROVISIONAL (mid-period preview; clock must be inside the period) | FINAL (requires clock > period_end)" }
      - { name: status, type: enum, source: system, description: "READY | DELIVERED" }
      - { name: activity_score, type: number, source: computed, description: "0..100, one decimal — see calculations.activity_score" }
      - { name: adherence_pct, type: number, source: computed, description: "0..100, one decimal — see calculations.adherence_pct" }
      - { name: device_health_pct, type: number, source: computed, description: "0..100, one decimal — see calculations.device_health_pct" }
      - { name: wellness_index, type: number, source: computed, description: "0..100, one decimal — see calculations.wellness_index" }
      - { name: fall_cap_applied, type: boolean, source: computed, description: "True when a non-false-alarm FALL alert in the period capped the index at 59" }
      - { name: alert_count, type: integer, source: computed, description: "Alerts opened during the period (any type)" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SensorKit
    initial_state: ORDERED
    terminal_states: []
    transitions:
      - from: ORDERED
        to: SHIPPED
        trigger: "POST /v1/sensor-kits/{kit_id}/ship"
        actor: PlatformAdmin
        preconditions: ["kit.status == ORDERED (else ERR_INVALID_STATE)"]
        side_effects: ["kit.updated_at refreshed; kit.version += 1"]
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /v1/sensor-kits/{kit_id}/mark-delivered"
        actor: PlatformAdmin
        preconditions: ["kit.status == SHIPPED (else ERR_INVALID_STATE)"]
        side_effects: ["kit.updated_at refreshed; kit.version += 1"]
      - from: DELIVERED
        to: INSTALLED
        trigger: "system (when an InstallAppointment for this kit transitions to COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "every Device of the kit with status PROVISIONED -> INSTALLED (each device.version += 1)"
      - from: INSTALLED
        to: ACTIVE
        trigger: "system (when the senior's Subscription transitions PROVISIONING -> ACTIVE)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Device
    initial_state: PROVISIONED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: PROVISIONED
        to: INSTALLED
        trigger: "system (kit install completion)"
        actor: system
        preconditions: []
        side_effects: []
      - from: INSTALLED
        to: ONLINE
        trigger: "system (first SensorEvent ingested for this device via POST /v1/telemetry)"
        actor: system
        preconditions: []
        side_effects: ["device.last_seen_at = event.observed_at; battery_percent updated if carried"]
      - from: ONLINE
        to: OFFLINE
        trigger: "system (clock sweep: now - last_seen_at > 90 minutes)"
        actor: system
        preconditions: []
        side_effects:
          - "create Alert DEVICE_OFFLINE severity MEDIUM unless an open DEVICE_OFFLINE alert already exists for this device"
      - from: OFFLINE
        to: ONLINE
        trigger: "system (any SensorEvent ingested for this device)"
        actor: system
        preconditions: []
        side_effects: ["device.last_seen_at = event.observed_at"]
      - from: INSTALLED
        to: DECOMMISSIONED
        trigger: "POST /v1/devices/{device_id}/decommission"
        actor: PlatformAdmin
        preconditions:
          - "if device_type == GATEWAY and the senior's monitoring_posture == ACTIVE and no other GATEWAY of the senior is ONLINE or INSTALLED -> ERR_DEVICE_SAFETY_REQUIRED"
        side_effects: ["open LOW_BATTERY / DEVICE_OFFLINE alerts for this device are auto-RESOLVED with note AUTO_RESOLVED_POSTURE_DEGRADED"]
      - from: ONLINE
        to: DECOMMISSIONED
        trigger: "POST /v1/devices/{device_id}/decommission"
        actor: PlatformAdmin
        preconditions: ["same gateway safety guard"]
        side_effects: ["same alert auto-resolution"]
      - from: OFFLINE
        to: DECOMMISSIONED
        trigger: "POST /v1/devices/{device_id}/decommission"
        actor: PlatformAdmin
        preconditions: ["same gateway safety guard"]
        side_effects: ["same alert auto-resolution"]

  - entity: InstallAppointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /v1/install-appointments/{appointment_id}/confirm"
        actor: Installer
        preconditions:
          - "appointment.status == SCHEDULED (terminal -> ERR_APPOINTMENT_TERMINAL, otherwise ERR_INVALID_STATE)"
          - "X-User-ID == appointment.installer_id (else ERR_OWNERSHIP_MISMATCH)"
        side_effects: []
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /v1/install-appointments/{appointment_id}/complete"
        actor: Installer
        preconditions:
          - "appointment.status == CONFIRMED (terminal -> ERR_APPOINTMENT_TERMINAL, SCHEDULED -> ERR_INVALID_STATE)"
          - "X-User-ID == appointment.installer_id (else ERR_OWNERSHIP_MISMATCH)"
          - "kit.status == DELIVERED (else ERR_KIT_NOT_DELIVERED)"
          - "current clock within [window_start, window_end] (else ERR_OUTSIDE_APPOINTMENT_WINDOW)"
        side_effects:
          - "kit.status -> INSTALLED (link 1)"
          - "each PROVISIONED device of the kit -> INSTALLED (link 2)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /v1/install-appointments/{appointment_id}/cancel"
        actor: PlatformAdmin
        preconditions: ["status IN {SCHEDULED, CONFIRMED} (terminal -> ERR_APPOINTMENT_TERMINAL)"]
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /v1/install-appointments/{appointment_id}/cancel"
        actor: PlatformAdmin
        preconditions: ["status IN {SCHEDULED, CONFIRMED}"]
        side_effects: []
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /v1/install-appointments/{appointment_id}/reschedule (updates window_start/window_end)"
        actor: PlatformAdmin
        preconditions:
          - "status IN {SCHEDULED, CONFIRMED} (terminal -> ERR_APPOINTMENT_TERMINAL)"
          - "new window passes duration, past-window, and both overlap rules"
        side_effects: ["status forced back to SCHEDULED (confirmation is discarded)"]
      - from: CONFIRMED
        to: SCHEDULED
        trigger: "POST /v1/install-appointments/{appointment_id}/reschedule"
        actor: PlatformAdmin
        preconditions: ["same as SCHEDULED -> SCHEDULED"]
        side_effects: ["status forced back to SCHEDULED"]
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system (clock sweep: now > window_end while still SCHEDULED or CONFIRMED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Subscription
    initial_state: "service_status=PROVISIONING, billing_status=CURRENT (parallel dimensions)"
    terminal_states: ["service_status=CANCELLED"]
    transitions:
      - from: "service PROVISIONING"
        to: "service ACTIVE"
        trigger: "POST /v1/subscriptions/{subscription_id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "service_status == PROVISIONING (else ERR_INVALID_STATE)"
          - "billing_status == CURRENT (else ERR_BILLING_NOT_CURRENT)"
          - "at least one SensorKit of the senior has status IN {INSTALLED, ACTIVE} (else ERR_KIT_NOT_DELIVERED)"
        side_effects:
          - "current_period_end = now + 30 days"
          - "senior.monitoring_posture -> ACTIVE (link 1)"
          - "senior's INSTALLED kits -> ACTIVE (link 2)"
      - from: "billing CURRENT"
        to: "billing PAST_DUE"
        trigger: "POST /v1/subscriptions/{subscription_id}/record-payment with outcome=FAILED"
        actor: PlatformAdmin
        preconditions: ["service_status != CANCELLED (else ERR_INVALID_STATE)"]
        side_effects: ["consecutive_failed_payments += 1"]
      - from: "billing PAST_DUE"
        to: "billing DELINQUENT"
        trigger: "POST /v1/subscriptions/{subscription_id}/record-payment with outcome=FAILED"
        actor: PlatformAdmin
        preconditions: ["billing_status == PAST_DUE and consecutive_failed_payments >= 1"]
        side_effects:
          - "service_status ACTIVE -> SUSPENDED (link 1, same mutation)"
          - "senior.monitoring_posture ACTIVE -> DEGRADED (link 2)"
          - "every open Alert of the senior with severity IN {LOW, MEDIUM, HIGH} -> RESOLVED with resolution_note AUTO_RESOLVED_POSTURE_DEGRADED and senior.open_alert_count decremented per alert (link 3)"
      - from: "billing *"
        to: "billing CURRENT"
        trigger: "POST /v1/subscriptions/{subscription_id}/record-payment with outcome=SUCCEEDED"
        actor: PlatformAdmin
        preconditions: ["service_status != CANCELLED"]
        side_effects: ["consecutive_failed_payments = 0; service_status unchanged (a SUSPENDED service stays SUSPENDED until resume)"]
      - from: "service SUSPENDED"
        to: "service ACTIVE"
        trigger: "POST /v1/subscriptions/{subscription_id}/resume"
        actor: PlatformAdmin
        preconditions:
          - "service_status == SUSPENDED (else ERR_INVALID_STATE)"
          - "billing_status == CURRENT (else ERR_BILLING_NOT_CURRENT)"
        side_effects: ["senior.monitoring_posture -> ACTIVE"]
      - from: "service PROVISIONING|ACTIVE|SUSPENDED"
        to: "service CANCELLED"
        trigger: "POST /v1/subscriptions/{subscription_id}/cancel"
        actor: PlatformAdmin
        preconditions: ["service_status != CANCELLED (else ERR_INVALID_STATE)"]
        side_effects:
          - "senior.monitoring_posture -> INACTIVE"
          - "every ACTIVE MedicationSchedule of the senior -> ENDED; their PENDING DoseEvents -> SKIPPED"

  - entity: Alert
    initial_state: RAISED
    terminal_states: []
    transitions:
      - from: RAISED
        to: NOTIFYING
        trigger: "system (immediately after creation when at least one eligible contact exists; also re-entered by reopen)"
        actor: system
        preconditions:
          - "eligible contact = ACTIVE ContactTreeEntry of the senior with min_severity <= alert.severity (ordered priority_rank ASC, tie created_at ASC)"
        side_effects:
          - "create AlertNotification level=1 status=SENT for the first eligible contact; escalation_level = 1"
          - "note: if no eligible contact exists, the alert stays RAISED (monitoring-center queue)"
      - from: NOTIFYING
        to: ESCALATED
        trigger: "system (clock sweep: latest SENT notification older than its contact's response_timeout_seconds and a further eligible contact exists)"
        actor: system
        preconditions: []
        side_effects:
          - "current notification -> TIMED_OUT"
          - "create AlertNotification level=escalation_level+1 status=SENT for the next eligible contact; escalation_level += 1"
      - from: ESCALATED
        to: ESCALATED
        trigger: "system (clock sweep: same timeout rule while further eligible contacts exist)"
        actor: system
        preconditions: []
        side_effects: ["same TIMED_OUT + next SENT side effects"]
      - from: NOTIFYING
        to: NOTIFYING
        trigger: "system (clock sweep: timeout elapsed and NO further eligible contact exists)"
        actor: system
        preconditions: []
        side_effects: ["current notification -> TIMED_OUT; escalation_exhausted = true"]
      - from: ESCALATED
        to: ESCALATED
        trigger: "system (clock sweep: timeout elapsed and no further contact)"
        actor: system
        preconditions: []
        side_effects: ["current notification -> TIMED_OUT; escalation_exhausted = true"]
      - from: RAISED
        to: ACKNOWLEDGED
        trigger: "POST /v1/alerts/{alert_id}/acknowledge"
        actor: MonitoringAgent
        preconditions: ["status IN {RAISED, NOTIFYING, ESCALATED} (else ERR_ALERT_NOT_ACTIONABLE)"]
        side_effects: ["any SENT notifications -> SUPERSEDED"]
      - from: NOTIFYING
        to: ACKNOWLEDGED
        trigger: "POST /v1/alerts/{alert_id}/acknowledge"
        actor: "Caregiver | MonitoringAgent"
        preconditions:
          - "status IN {RAISED, NOTIFYING, ESCALATED} (else ERR_ALERT_NOT_ACTIONABLE)"
          - "Caregiver caller: caregiver.senior_id == alert.senior_id (else ERR_OWNERSHIP_MISMATCH) AND an AlertNotification for this alert with caregiver_id == X-User-ID and status == SENT exists (else ERR_NOT_NOTIFIED_CONTACT)"
        side_effects:
          - "acknowledging caregiver's SENT notification -> ACKED; other SENT notifications -> SUPERSEDED"
          - "acknowledged_by_caregiver_id set (null for MonitoringAgent)"
      - from: ESCALATED
        to: ACKNOWLEDGED
        trigger: "POST /v1/alerts/{alert_id}/acknowledge"
        actor: "Caregiver | MonitoringAgent"
        preconditions: ["same as NOTIFYING -> ACKNOWLEDGED"]
        side_effects: ["same as NOTIFYING -> ACKNOWLEDGED"]
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /v1/alerts/{alert_id}/resolve"
        actor: "Caregiver | MonitoringAgent"
        preconditions:
          - "status == ACKNOWLEDGED (else ERR_ALERT_NOT_ACTIONABLE)"
          - "Caregiver caller: caregiver.senior_id == alert.senior_id (else ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["senior.open_alert_count -= 1; resolution_note set from input note"]
      - from: ACKNOWLEDGED
        to: FALSE_ALARM
        trigger: "POST /v1/alerts/{alert_id}/mark-false-alarm"
        actor: "Caregiver | MonitoringAgent"
        preconditions:
          - "status == ACKNOWLEDGED (else ERR_ALERT_NOT_ACTIONABLE)"
          - "Caregiver caller: caregiver.senior_id == alert.senior_id (else ERR_OWNERSHIP_MISMATCH)"
          - "if severity == CRITICAL, caller must be MonitoringAgent (else ERR_SAFETY_AGENT_REQUIRED)"
        side_effects: ["senior.open_alert_count -= 1; resolution_note set"]
      - from: RESOLVED
        to: NOTIFYING
        trigger: "POST /v1/alerts/{alert_id}/reopen"
        actor: MonitoringAgent
        preconditions: ["status IN {RESOLVED, FALSE_ALARM} (else ERR_ALERT_NOT_ACTIONABLE)"]
        side_effects:
          - "reopen_count += 1; senior.open_alert_count += 1"
          - "if an eligible contact exists: create AlertNotification level=1 SENT, escalation_level = 1; else status stays RAISED"
      - from: FALSE_ALARM
        to: NOTIFYING
        trigger: "POST /v1/alerts/{alert_id}/reopen"
        actor: MonitoringAgent
        preconditions: ["same as RESOLVED -> NOTIFYING"]
        side_effects: ["same as RESOLVED -> NOTIFYING"]
      - from: RAISED
        to: RESOLVED
        trigger: "system (posture cascade: senior.monitoring_posture -> DEGRADED and severity IN {LOW, MEDIUM, HIGH})"
        actor: system
        preconditions: []
        side_effects: ["resolution_note = AUTO_RESOLVED_POSTURE_DEGRADED; senior.open_alert_count -= 1; SENT notifications -> SUPERSEDED"]
      - from: NOTIFYING
        to: RESOLVED
        trigger: "system (posture cascade, non-CRITICAL severities)"
        actor: system
        preconditions: []
        side_effects: ["same as RAISED -> RESOLVED cascade"]
      - from: ESCALATED
        to: RESOLVED
        trigger: "system (posture cascade, non-CRITICAL severities)"
        actor: system
        preconditions: []
        side_effects: ["same as RAISED -> RESOLVED cascade"]

  - entity: AlertNotification
    initial_state: SENT
    terminal_states: [ACKED, TIMED_OUT, SUPERSEDED]
    transitions:
      - from: SENT
        to: ACKED
        trigger: "system (alert acknowledged by this notification's caregiver)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SENT
        to: TIMED_OUT
        trigger: "system (clock sweep: now >= sent_at + contact.response_timeout_seconds)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SENT
        to: SUPERSEDED
        trigger: "system (alert acknowledged by another party, alert reopened, or alert auto-resolved)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MedicationSchedule
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: ENDED
        trigger: "POST /v1/medication-schedules/{schedule_id}/end"
        actor: "Caregiver | PlatformAdmin"
        preconditions:
          - "status == ACTIVE (else ERR_INVALID_STATE)"
          - "Caregiver caller: caregiver.senior_id == schedule.senior_id (else ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["PENDING DoseEvents of this schedule -> SKIPPED"]
      - from: ACTIVE
        to: ENDED
        trigger: "system (superseded by a new ACTIVE MedicationSchedule with the same (senior_id, medication_name), or subscription cancelled)"
        actor: system
        preconditions: []
        side_effects: ["PENDING DoseEvents -> SKIPPED"]

  - entity: DoseEvent
    initial_state: PENDING
    terminal_states: [TAKEN, MISSED, SKIPPED]
    transitions:
      - from: PENDING
        to: TAKEN
        trigger: "POST /v1/dose-events/{dose_id}/confirm OR system (PILL_DISPENSED telemetry matched per calculations.dose_confirmation_matching)"
        actor: "Senior | Caregiver | system"
        preconditions:
          - "status == PENDING (else ERR_DOSE_NOT_PENDING)"
          - "current clock (or event observed_at) <= scheduled_at + window_minutes (else the dose is MISSED by sweep first)"
          - "Senior caller: X-User-ID == dose.senior_id; Caregiver caller: caregiver.senior_id == dose.senior_id (else ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "confirmed_at set; punctual = (confirmed_at <= scheduled_at + 15 minutes)"
          - "schedule.missed_streak = 0"
      - from: PENDING
        to: MISSED
        trigger: "system (clock sweep: now > scheduled_at + window_minutes)"
        actor: system
        preconditions: []
        side_effects:
          - "schedule.missed_streak += 1 (link 1)"
          - "if missed_streak >= 2 for CRITICAL schedule, or >= 3 for ROUTINE schedule, and no open MISSED_MEDICATION alert exists for this schedule's senior: create Alert MISSED_MEDICATION (severity HIGH for CRITICAL, MEDIUM for ROUTINE) (link 2)"
          - "alert creation immediately runs the RAISED -> NOTIFYING notification step (link 3) and senior.open_alert_count += 1"
      - from: PENDING
        to: SKIPPED
        trigger: "system (schedule ENDED by end action, supersede, or subscription cancel)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WellnessReport
    initial_state: READY
    terminal_states: [DELIVERED]
    transitions:
      - from: READY
        to: DELIVERED
        trigger: "POST /v1/wellness-reports/{report_id}/deliver"
        actor: "PlatformAdmin | MonitoringAgent"
        preconditions: ["status == READY (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: READY
        to: READY
        trigger: "POST /v1/wellness-reports/{report_id}/regenerate (recompute in place)"
        actor: PlatformAdmin
        preconditions:
          - "status == READY (else ERR_INVALID_STATE)"
          - "expected_report_version == current version (else ERR_STALE_VERSION)"
        side_effects: ["metrics recomputed at current clock with same mode; version += 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (true races only; OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: med-schedule-create-stale-senior
    parent_entity: Senior
    write_endpoint: "POST /v1/medication-schedules"
    occ_field: expected_senior_version
    description: |
      Creating a MedicationSchedule against a Senior whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just created a schedule for the same medication (which
      legitimately supersedes the prior ACTIVE schedule under the supersede rule)
      and the current writer's view of the senior is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: report-regenerate-stale-report
    parent_entity: WellnessReport
    write_endpoint: "POST /v1/wellness-reports/{report_id}/regenerate"
    occ_field: expected_report_version
    description: |
      Regenerating a WellnessReport whose version has advanced since the client
      last observed it is rejected; the client's recompute would silently discard
      the other writer's regeneration.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: billing_proration
    trigger: "POST /v1/subscriptions/{id}/change-plan"
    algorithm: tiered_pricing
    formula: |
      days_in_cycle = 30 (fixed)
      days_remaining = floor((current_period_end - now) / 86400); clamp to [0, 30]
      extra_sensors = max(0, kit_motion_sensor_count - old_plan.included_motion_sensors)
        where kit_motion_sensor_count is the motion_sensor_count of the senior's
        latest-created non-RETURNED kit (the kit whose install activated the
        subscription); ties impossible (one kit per activation).
      -- CREDIT LINES (per-line rounding, then sum — this order is PINNED):
      plan_credit   = round_half_up(old_plan.monthly_fee_cents * days_remaining / 30)
      sensor_credit = round_half_up(old_plan.extra_sensor_fee_cents * extra_sensors * days_remaining / 30)
      total_credit  = plan_credit + sensor_credit
      -- CHARGE LINES (per-line rounding, then sum):
      new_extra_sensors = max(0, kit_motion_sensor_count - new_plan.included_motion_sensors)
      plan_charge   = round_half_up(new_plan.monthly_fee_cents * days_remaining / 30)
      sensor_charge = round_half_up(new_plan.extra_sensor_fee_cents * new_extra_sensors * days_remaining / 30)
      total_charge  = plan_charge + sensor_charge
      net = total_charge - total_credit
      if net >= 0: lifetime_charged_cents += net
      else:        lifetime_credited_cents += -net; billing_credit_cents += -net
      -- NOTE: rounding each line THEN summing is pinned; summing unrounded lines
      -- and rounding once can differ by 1 cent (e.g. fee 5999, sensor fee 199,
      -- days_remaining 14: per-line 2800 + 93 = 2893 vs sum-then-round 2892).
    input_set: "the subscription, its old and new plans, and the activating kit's motion_sensor_count"
    constants:
      DAYS_IN_CYCLE: 30
    precision: "integer cents, round_half_up per line, then sum"
    variants:
      - name: daily_prorate
        when: "request proration_mode == DAILY_PRORATE (the default)"
        difference: "credit/charge lines prorated by days_remaining/30 as above; current_period_end unchanged"
      - name: full_cycle_swap
        when: "request proration_mode == FULL_CYCLE_SWAP"
        difference: "credit = full old monthly_fee + full old extra-sensor fees; charge = full new monthly_fee + full new extra-sensor fees (no proration); current_period_end reset to now + 30 days"

  - name: wellness_index
    trigger: "POST /v1/wellness-reports (and regenerate)"
    algorithm: weighted_scoring
    formula: |
      A = activity_score (see activity_score), D = adherence_pct (see adherence_pct),
      H = device_health_pct (see device_health_pct)
      raw = 0.40*A + 0.35*D + 0.25*H
      -- evaluation order PINNED: multiplier first, cap second, round last
      if D < 60: raw = raw * 0.8
      if any FALL alert of the senior with opened/created time inside the period
         and status != FALSE_ALARM exists: raw = min(raw, 59); fall_cap_applied = true
      wellness_index = round_half_up(raw, 1 decimal)
    input_set: "SensorEvents, DoseEvents, Devices, and Alerts of the senior overlapping [period_start, period_end)"
    constants:
      W_ACTIVITY: 0.40
      W_ADHERENCE: 0.35
      W_DEVICE: 0.25
      ADHERENCE_PENALTY_THRESHOLD: 60
      ADHERENCE_PENALTY_FACTOR: 0.8
      FALL_CAP: 59
    precision: "1 decimal place, round_half_up, single rounding at the end"
    variants:
      - name: provisional
        when: "mode == PROVISIONAL (clock inside the period)"
        difference: "elapsed_days = floor((now - period_start)/86400); activity_score divides by elapsed_days; adherence_pct counts PENDING doses due-or-scheduled in the elapsed window as on-time TAKEN (weight 1.0); device_health_pct uses current device state"
      - name: final
        when: "mode == FINAL (clock > period_end)"
        difference: "chronological replay over the closed period: activity_score divides by full period_days; adherence_pct counts only terminal doses (TAKEN/MISSED); PENDING doses may not exist because the sweep has run"

  - name: adherence_pct
    trigger: "wellness_index computation and GET /v1/seniors/{id}/dashboard (today scope)"
    algorithm: aggregation
    formula: |
      weights: TAKEN with punctual=true -> 1.0; TAKEN with punctual=false -> 0.5; MISSED -> 0.0
      due set (FINAL/report): DoseEvents of the senior with scheduled_at inside the window
        and status IN {TAKEN, MISSED} (SKIPPED excluded)
      due set (PROVISIONAL): as FINAL, PLUS PENDING doses with scheduled_at <= now,
        each counted with weight 1.0
      due set (dashboard 'today'): DoseEvents with scheduled_at in [today 00:00Z, now], terminal only
      if |due set| == 0: adherence_pct = 100.0   -- vacuous adherence, PINNED
      else: adherence_pct = round_half_up(100 * sum(weights) / |due set|, 1 decimal)
    input_set: "DoseEvents of the senior in the window, filtered by status as above"
    constants:
      PUNCTUAL_GRACE_MINUTES: 15
    precision: "1 decimal place, round_half_up"

  - name: activity_score
    trigger: "wellness_index computation"
    algorithm: chronological
    formula: |
      An 'active day' is a UTC calendar day inside [period_start, period_end) with
      >= ACTIVE_DAY_MOTION_THRESHOLD MOTION SensorEvents of the senior (by observed_at).
      FINAL:  score = 100 * active_days / period_days, period_days = (period_end - period_start)/86400
      PROVISIONAL: score = 100 * active_days / elapsed_days, elapsed_days = floor((now - period_start)/86400),
        elapsed_days clamped to >= 1
      score = round_half_up(min(100, score), 1 decimal)
      Zero MOTION events -> active_days = 0 -> score 0.0.
    input_set: "SensorEvents of the senior with event_type == MOTION and observed_at inside the (elapsed) period"
    constants:
      ACTIVE_DAY_MOTION_THRESHOLD: 3
    precision: "1 decimal place, round_half_up"

  - name: device_health_pct
    trigger: "wellness_index computation and dashboard"
    algorithm: threshold
    formula: |
      Start at 100. For each non-DECOMMISSIONED Device of the senior:
        -10 if device.status == OFFLINE at evaluation time
        -5  if device.battery_percent <= 20 at evaluation time
      device_health_pct = max(0, result), 1 decimal (always integral in practice)
      Devices INSTALLED-but-never-ONLINE count 0 deduction.
    input_set: "Devices of the senior with status != DECOMMISSIONED"
    constants:
      OFFLINE_DEDUCTION: 10
      LOW_BATTERY_DEDUCTION: 5
      LOW_BATTERY_THRESHOLD: 20
    precision: "1 decimal place"

  - name: escalation_target_selection
    trigger: "alert creation (RAISED -> NOTIFYING), escalation sweep, reopen"
    algorithm: constraint_propagation
    formula: |
      eligible = ContactTreeEntry where senior_id == alert.senior_id
                 AND status == ACTIVE AND min_severity <= alert.severity
                 (severity order LOW < MEDIUM < HIGH < CRITICAL)
      ranking: priority_rank ASC; tie-break created_at ASC (never id)
      next target = the (escalation_level+1)-th entry in the ranking
      empty eligible set at creation -> alert stays RAISED, no notification
      exhausted (timeout on last ranked entry) -> escalation_exhausted = true
    input_set: "ACTIVE ContactTreeEntry rows of the senior filtered by severity"
    constants: {}
    precision: "n/a"

  - name: dose_confirmation_matching
    trigger: "PILL_DISPENSED SensorEvent ingestion"
    algorithm: constraint_propagation
    formula: |
      candidate doses = PENDING DoseEvents of the dispensing device's senior whose
        window [scheduled_at, scheduled_at + window_minutes] contains observed_at
      ranking: scheduled_at ASC; tie-break created_at ASC (never id)
      the first candidate -> TAKEN (confirmed_at = observed_at)
      no candidate -> event is still logged, no dose changes
    input_set: "PENDING DoseEvents of the senior whose window contains the event"
    constants: {}
    precision: "n/a"

  - name: clock_sweep_order
    trigger: "POST /v1/_clock/set_current_utc"
    algorithm: chronological
    formula: |
      On every clock advance the server runs these sweeps IN THIS PINNED ORDER:
        1. Device offline detection (ONLINE and now - last_seen_at > 90 min -> OFFLINE + DEVICE_OFFLINE alert)
        2. Dose horizon extension (ACTIVE schedules: materialize DoseEvents for [now, now+48h) not yet materialized)
        3. Dose window misses (PENDING and now > scheduled_at + window_minutes -> MISSED, streak, alert chain)
        4. Alert notification timeouts / escalation / exhaustion
        5. Inactivity detection (posture ACTIVE, >=1 ONLINE MOTION device, no MOTION event with
           observed_at in trailing 12h, no open INACTIVITY alert -> Alert INACTIVITY severity HIGH)
        6. Check-in compliance (subscription ACTIVE, now - max(last check-in occurred_at, subscription
           activated_at) > plan.checkin_interval_hours, no open MISSED_CHECKIN alert -> Alert MISSED_CHECKIN severity LOW)
        7. Appointment no-show (SCHEDULED/CONFIRMED with now > window_end -> NO_SHOW)
      Battery threshold checks run at telemetry ingest (not in the sweep).
    input_set: "all entities of all seniors"
    constants:
      OFFLINE_MINUTES: 90
      DOSE_HORIZON_HOURS: 48
      INACTIVITY_HOURS: 12
      MISSED_STREAK_CRITICAL: 2
      MISSED_STREAK_ROUTINE: 3
    precision: "n/a"

  - name: battery_alert_thresholds
    trigger: "any SensorEvent carrying battery_percent (POST /v1/telemetry)"
    algorithm: threshold
    formula: |
      On ingest, device.battery_percent = reading.
      if battery_percent <= 20 and no open LOW_BATTERY alert exists for the device:
        create Alert LOW_BATTERY, severity = HIGH if battery_percent <= 10 else MEDIUM
      if battery_percent <= 10 and an open LOW_BATTERY alert with severity MEDIUM exists:
        upgrade that alert's severity to HIGH (alert.version += 1)
      Boundary is INCLUSIVE: 20 triggers, 21 does not; 10 is HIGH, 11 is MEDIUM.
      Alerts are created only if posture permits (CRITICAL bypass; non-CRITICAL alerts
      are NOT created while posture == DEGRADED or INACTIVE — the event is still logged).
    input_set: "the device and its open LOW_BATTERY alerts"
    constants:
      LOW_BATTERY_THRESHOLD: 20
      CRITICAL_BATTERY_THRESHOLD: 10
    precision: "integer percent, <= inclusive"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority — lower number wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is one of the declared roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role is in the endpoint's roles list", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Request body is well-formed: every required input field present, types match, enum values valid", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all", description: "Invalid enum member specifically returns ERR_INVALID_ENUM (same priority)" }
  - { priority: 3.5, category: auth, check: "Enum fields contain only declared members", error_id: ERR_INVALID_ENUM, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path-template ids resolve, validated left-to-right; then body FK ids resolve", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: auth, check: "Entity-backed ownership: Caregiver acts only on resources of caregiver.senior_id; Installer acts only on own appointments; Senior acts only on own resources", error_id: ERR_OWNERSHIP_MISMATCH, http_status: 403, applies_to: "endpoints with entity-backed roles acting on owned resources" }
  - { priority: 6, category: state, check: "Generic transition precondition: entity is in a `from` state of the requested transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: state, check: "InstallAppointment in terminal state {COMPLETED, CANCELLED, NO_SHOW} rejects confirm/complete/cancel/reschedule", error_id: ERR_APPOINTMENT_TERMINAL, http_status: 409, applies_to: ["POST /v1/install-appointments/{id}/confirm", "POST /v1/install-appointments/{id}/complete", "POST /v1/install-appointments/{id}/cancel", "POST /v1/install-appointments/{id}/reschedule"] }
  - { priority: 8, category: state, check: "Alert is in an actionable state for the requested action (ack: RAISED/NOTIFYING/ESCALATED; resolve/false-alarm: ACKNOWLEDGED; reopen: RESOLVED/FALSE_ALARM)", error_id: ERR_ALERT_NOT_ACTIONABLE, http_status: 409, applies_to: ["POST /v1/alerts/{id}/acknowledge", "POST /v1/alerts/{id}/resolve", "POST /v1/alerts/{id}/mark-false-alarm", "POST /v1/alerts/{id}/reopen"] }
  - { priority: 9, category: state, check: "Subscription service_status == ACTIVE for gated operations (check-in create, med-schedule create, wellness-report create)", error_id: ERR_SUBSCRIPTION_NOT_ACTIVE, http_status: 409, applies_to: ["POST /v1/check-ins", "POST /v1/medication-schedules", "POST /v1/wellness-reports"] }
  - { priority: 10, category: state, check: "DoseEvent status == PENDING for confirm", error_id: ERR_DOSE_NOT_PENDING, http_status: 409, applies_to: ["POST /v1/dose-events/{id}/confirm"] }
  - { priority: 11, category: state, check: "Kit state gate: appointment complete requires kit DELIVERED; subscription activate requires some kit INSTALLED/ACTIVE", error_id: ERR_KIT_NOT_DELIVERED, http_status: 409, applies_to: ["POST /v1/install-appointments/{id}/complete", "POST /v1/subscriptions/{id}/activate"] }
  - { priority: 12, category: state, check: "OCC: expected_<parent>_version equals the parent entity's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /v1/medication-schedules", "POST /v1/wellness-reports/{id}/regenerate"] }
  - { priority: 13, category: business_safety, check: "mark-false-alarm on a CRITICAL alert requires MonitoringAgent", error_id: ERR_SAFETY_AGENT_REQUIRED, http_status: 403, applies_to: ["POST /v1/alerts/{id}/mark-false-alarm"] }
  - { priority: 14, category: business_safety, check: "Caregiver acknowledge requires an AlertNotification for this alert addressed to that caregiver with status SENT", error_id: ERR_NOT_NOTIFIED_CONTACT, http_status: 403, applies_to: ["POST /v1/alerts/{id}/acknowledge"] }
  - { priority: 15, category: business_safety, check: "Cannot decommission the last functional GATEWAY (ONLINE/INSTALLED) of a senior whose monitoring_posture == ACTIVE", error_id: ERR_DEVICE_SAFETY_REQUIRED, http_status: 422, applies_to: ["POST /v1/devices/{id}/decommission"] }
  - { priority: 16, category: business_constraint, check: "Install window duration within [60, 240] minutes", error_id: ERR_WINDOW_TOO_SHORT, http_status: 422, applies_to: ["POST /v1/install-appointments", "POST /v1/install-appointments/{id}/reschedule"] }
  - { priority: 17, category: business_constraint, check: "priority_rank unique among ACTIVE ContactTreeEntry rows of the senior", error_id: ERR_RANK_CONFLICT, http_status: 409, applies_to: ["POST /v1/contact-tree-entries", "PATCH /v1/contact-tree-entries/{id}"] }
  - { priority: 18, category: business_constraint, check: "Installer overlap: new window [s,e) must not intersect any of the installer's non-terminal appointments expanded by 30-min travel buffer [ws-30m, we+30m); adjacency at exactly 30 minutes is allowed", error_id: ERR_INSTALLER_WINDOW_CONFLICT, http_status: 409, applies_to: ["POST /v1/install-appointments", "POST /v1/install-appointments/{id}/reschedule"] }
  - { priority: 19, category: business_constraint, check: "Senior overlap: closed-interval semantics — new window conflicts with any non-terminal appointment of the same senior when s <= existing.window_end AND existing.window_start <= e (touching endpoints DO conflict)", error_id: ERR_SENIOR_WINDOW_CONFLICT, http_status: 409, applies_to: ["POST /v1/install-appointments", "POST /v1/install-appointments/{id}/reschedule"] }
  - { priority: 20, category: business_constraint, check: "A FINAL WellnessReport already exists for the same senior and overlapping period", error_id: ERR_DUPLICATE_REPORT, http_status: 409, applies_to: ["POST /v1/wellness-reports"] }
  - { priority: 21, category: business_temporal, check: "window_start must be strictly after the current clock", error_id: ERR_WINDOW_IN_PAST, http_status: 422, applies_to: ["POST /v1/install-appointments", "POST /v1/install-appointments/{id}/reschedule"] }
  - { priority: 22, category: business_temporal, check: "Appointment complete requires current clock within [window_start, window_end]", error_id: ERR_OUTSIDE_APPOINTMENT_WINDOW, http_status: 409, applies_to: ["POST /v1/install-appointments/{id}/complete"] }
  - { priority: 23, category: business_temporal, check: "FINAL report requires clock > period_end; PROVISIONAL requires period_start <= clock <= period_end", error_id: ERR_PERIOD_NOT_CLOSED, http_status: 422, applies_to: ["POST /v1/wellness-reports"] }
  - { priority: 24, category: business_referential, check: "ContactTreeEntry.caregiver_id must reference a Caregiver whose senior_id == entry.senior_id", error_id: ERR_CAREGIVER_SENIOR_MISMATCH, http_status: 422, applies_to: ["POST /v1/contact-tree-entries"] }
  - { priority: 25, category: business_referential, check: "InstallAppointment.kit_id must reference a SensorKit whose senior_id == appointment.senior_id", error_id: ERR_KIT_SENIOR_MISMATCH, http_status: 422, applies_to: ["POST /v1/install-appointments"] }
  - { priority: 26, category: business_fiscal, check: "Plan feature gate: medication_reminders_enabled for med schedules; wellness_report_enabled for reports", error_id: ERR_FEATURE_GATED, http_status: 422, applies_to: ["POST /v1/medication-schedules", "POST /v1/wellness-reports"] }
  - { priority: 27, category: business_fiscal, check: "ACTIVE ContactTreeEntry count for the senior < plan.max_contacts", error_id: ERR_CONTACT_LIMIT_EXCEEDED, http_status: 422, applies_to: ["POST /v1/contact-tree-entries"] }
  - { priority: 28, category: business_fiscal, check: "Subscription billing_status == CURRENT for activate/resume", error_id: ERR_BILLING_NOT_CURRENT, http_status: 409, applies_to: ["POST /v1/subscriptions/{id}/activate", "POST /v1/subscriptions/{id}/resume"] }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Seniors ---
  - { method: POST, path: "/v1/seniors", description: "Register a senior", roles: [PlatformAdmin], code: 201, input: [full_name, date_of_birth, address], output: Senior, side_effects: ["monitoring_posture=INACTIVE, open_alert_count=0, risk_tier=STANDARD"] }
  - { method: GET, path: "/v1/seniors/{senior_id}", description: "Get a senior", roles: [PlatformAdmin, MonitoringAgent, Caregiver, Senior], code: 200, input: [], output: Senior, side_effects: [] }
  - { method: GET, path: "/v1/seniors", description: "List seniors", roles: [PlatformAdmin, MonitoringAgent], code: 200, input: ["limit?", "offset?"], output: "Senior[]", side_effects: [] }
  - { method: GET, path: "/v1/seniors/{senior_id}/dashboard", description: "Caregiver dashboard: posture, open alerts, today's adherence, device summary, last check-in, next dose", roles: [PlatformAdmin, MonitoringAgent, Caregiver, Senior], code: 200, input: [], output: "{ monitoring_posture: string, open_alert_count: integer, risk_tier: string, adherence_today_pct: number, devices_online: integer, devices_total: integer, last_checkin_at: datetime, next_dose_scheduled_at: datetime }", side_effects: [] }

  # --- Subscription plans ---
  - { method: POST, path: "/v1/subscription-plans", description: "Create a subscription plan", roles: [PlatformAdmin], code: 201, input: [tier, monthly_fee_cents, included_motion_sensors, extra_sensor_fee_cents, max_contacts, checkin_interval_hours, medication_reminders_enabled, wellness_report_enabled, wellness_report_cadence], output: SubscriptionPlan, side_effects: [] }
  - { method: GET, path: "/v1/subscription-plans/{plan_id}", description: "Get a plan", roles: [PlatformAdmin, MonitoringAgent], code: 200, input: [], output: SubscriptionPlan, side_effects: [] }
  - { method: GET, path: "/v1/subscription-plans", description: "List plans", roles: [PlatformAdmin, MonitoringAgent], code: 200, input: ["limit?", "offset?"], output: "SubscriptionPlan[]", side_effects: [] }

  # --- Subscriptions ---
  - { method: POST, path: "/v1/subscriptions", description: "Create a subscription for a senior", roles: [PlatformAdmin], code: 201, input: [senior_id, plan_id], output: Subscription, side_effects: ["service_status=PROVISIONING, billing_status=CURRENT, counters zeroed"] }
  - { method: GET, path: "/v1/subscriptions/{subscription_id}", description: "Get a subscription", roles: [PlatformAdmin, MonitoringAgent], code: 200, input: [], output: Subscription, side_effects: [] }
  - { method: GET, path: "/v1/subscriptions", description: "List subscriptions, filterable by senior_id / plan_id", roles: [PlatformAdmin, MonitoringAgent], code: 200, input: ["limit?", "offset?", "senior_id?", "plan_id?"], output: "Subscription[]", side_effects: [] }
  - { method: POST, path: "/v1/subscriptions/{subscription_id}/activate", description: "Activate service (requires billing CURRENT and an INSTALLED kit)", roles: [PlatformAdmin], code: 200, input: [], output: Subscription, side_effects: ["service PROVISIONING->ACTIVE; current_period_end=now+30d; posture ACTIVE; kits INSTALLED->ACTIVE"] }
  - { method: POST, path: "/v1/subscriptions/{subscription_id}/record-payment", description: "Record a billing payment outcome", roles: [PlatformAdmin], code: 200, input: [outcome], output: Subscription, side_effects: ["FAILED: CURRENT->PAST_DUE, or PAST_DUE->DELINQUENT + service->SUSPENDED + posture->DEGRADED + non-CRITICAL open alerts auto-RESOLVED; SUCCEEDED: billing->CURRENT, failed counter reset"] }
  - { method: POST, path: "/v1/subscriptions/{subscription_id}/change-plan", description: "Change plan with proration", roles: [PlatformAdmin], code: 200, input: [plan_id, "proration_mode?"], output: Subscription, side_effects: ["runs calculations.billing_proration; updates last_change_* fields, lifetime_* counters, billing_credit_cents; plan_id updated"] }
  - { method: POST, path: "/v1/subscriptions/{subscription_id}/resume", description: "Resume a SUSPENDED subscription (billing must be CURRENT)", roles: [PlatformAdmin], code: 200, input: [], output: Subscription, side_effects: ["service SUSPENDED->ACTIVE; posture ACTIVE"] }
  - { method: POST, path: "/v1/subscriptions/{subscription_id}/cancel", description: "Cancel a subscription", roles: [PlatformAdmin], code: 200, input: [], output: Subscription, side_effects: ["service->CANCELLED; posture INACTIVE; med schedules ENDED; pending doses SKIPPED"] }

  # --- Sensor kits & devices ---
  - { method: POST, path: "/v1/sensor-kits", description: "Order a sensor kit for a senior; auto-provisions 1 GATEWAY + 1 WEARABLE + motion_sensor_count MOTION devices", roles: [PlatformAdmin], code: 201, input: [senior_id, "motion_sensor_count?"], output: SensorKit, side_effects: ["status=ORDERED; motion_sensor_count defaults to plan.included_motion_sensors; Devices created PROVISIONED"] }
  - { method: GET, path: "/v1/sensor-kits/{kit_id}", description: "Get a kit", roles: [PlatformAdmin, MonitoringAgent, Installer], code: 200, input: [], output: SensorKit, side_effects: [] }
  - { method: GET, path: "/v1/sensor-kits", description: "List kits, filterable by senior_id", roles: [PlatformAdmin, MonitoringAgent], code: 200, input: ["limit?", "offset?", "senior_id?"], output: "SensorKit[]", side_effects: [] }
  - { method: POST, path: "/v1/sensor-kits/{kit_id}/ship", description: "Mark kit shipped", roles: [PlatformAdmin], code: 200, input: [], output: SensorKit, side_effects: ["ORDERED->SHIPPED"] }
  - { method: POST, path: "/v1/sensor-kits/{kit_id}/mark-delivered", description: "Mark kit delivered", roles: [PlatformAdmin], code: 200, input: [], output: SensorKit, side_effects: ["SHIPPED->DELIVERED"] }
  - { method: GET, path: "/v1/devices/{device_id}", description: "Get a device", roles: [PlatformAdmin, MonitoringAgent, Caregiver], code: 200, input: [], output: Device, side_effects: [] }
  - { method: GET, path: "/v1/devices", description: "List devices, filterable by kit_id / senior_id / status", roles: [PlatformAdmin, MonitoringAgent, Caregiver], code: 200, input: ["limit?", "offset?", "kit_id?", "senior_id?", "status?"], output: "Device[]", side_effects: [] }
  - { method: POST, path: "/v1/devices/{device_id}/decommission", description: "Decommission a device (gateway safety guard)", roles: [PlatformAdmin], code: 200, input: [], output: Device, side_effects: ["->DECOMMISSIONED; open device alerts auto-RESOLVED"] }
  - { method: POST, path: "/v1/telemetry", description: "Ingest one device SensorEvent (device hub push)", roles: [DeviceHub], code: 201, input: [device_id, event_type, observed_at, "battery_percent?", "note?"], output: SensorEvent, side_effects: ["device INSTALLED/OFFLINE->ONLINE, last_seen_at and battery updated; battery thresholds (alert create/upgrade); FALL_DETECTED -> CRITICAL FALL alert; PILL_DISPENSED -> dose confirmation matching; observed_at must be <= current clock (else ERR_INVALID_REQUEST)"] }
  - { method: GET, path: "/v1/sensor-events/{event_id}", description: "Get a sensor event", roles: [PlatformAdmin, MonitoringAgent], code: 200, input: [], output: SensorEvent, side_effects: [] }
  - { method: GET, path: "/v1/sensor-events", description: "List sensor events, filterable by device_id / senior_id / event_type", roles: [PlatformAdmin, MonitoringAgent], code: 200, input: ["limit?", "offset?", "device_id?", "senior_id?", "event_type?"], output: "SensorEvent[]", side_effects: [] }

  # --- Installers & appointments ---
  - { method: POST, path: "/v1/installers", description: "Register an installer", roles: [PlatformAdmin], code: 201, input: [full_name, region], output: Installer, side_effects: [] }
  - { method: GET, path: "/v1/installers/{installer_id}", description: "Get an installer", roles: [PlatformAdmin, Installer], code: 200, input: [], output: Installer, side_effects: [] }
  - { method: GET, path: "/v1/installers", description: "List installers", roles: [PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "Installer[]", side_effects: [] }
  - { method: POST, path: "/v1/install-appointments", description: "Schedule an install appointment (overlap rules per validations 18/19)", roles: [PlatformAdmin], code: 201, input: [senior_id, kit_id, installer_id, window_start, window_end], output: InstallAppointment, side_effects: ["status=SCHEDULED"] }
  - { method: GET, path: "/v1/install-appointments/{appointment_id}", description: "Get an appointment", roles: [PlatformAdmin, Installer], code: 200, input: [], output: InstallAppointment, side_effects: [] }
  - { method: GET, path: "/v1/install-appointments", description: "List appointments, filterable by senior_id / kit_id / installer_id / status", roles: [PlatformAdmin, Installer], code: 200, input: ["limit?", "offset?", "senior_id?", "kit_id?", "installer_id?", "status?"], output: "InstallAppointment[]", side_effects: [] }
  - { method: POST, path: "/v1/install-appointments/{appointment_id}/confirm", description: "Installer confirms the appointment", roles: [Installer], code: 200, input: [], output: InstallAppointment, side_effects: ["SCHEDULED->CONFIRMED"] }
  - { method: POST, path: "/v1/install-appointments/{appointment_id}/complete", description: "Installer completes the install (kit DELIVERED, clock within window)", roles: [Installer], code: 200, input: [], output: InstallAppointment, side_effects: ["CONFIRMED->COMPLETED; kit->INSTALLED; devices PROVISIONED->INSTALLED"] }
  - { method: POST, path: "/v1/install-appointments/{appointment_id}/cancel", description: "Cancel an appointment", roles: [PlatformAdmin], code: 200, input: [], output: InstallAppointment, side_effects: ["->CANCELLED"] }
  - { method: POST, path: "/v1/install-appointments/{appointment_id}/reschedule", description: "Move the window (returns appointment to SCHEDULED)", roles: [PlatformAdmin], code: 200, input: [window_start, window_end], output: InstallAppointment, side_effects: ["status forced to SCHEDULED"] }

  # --- Caregivers & contact tree ---
  - { method: POST, path: "/v1/caregivers", description: "Register a caregiver for a senior", roles: [PlatformAdmin], code: 201, input: [senior_id, full_name, phone], output: Caregiver, side_effects: [] }
  - { method: GET, path: "/v1/caregivers/{caregiver_id}", description: "Get a caregiver", roles: [PlatformAdmin, MonitoringAgent, Caregiver], code: 200, input: [], output: Caregiver, side_effects: [] }
  - { method: GET, path: "/v1/caregivers", description: "List caregivers, filterable by senior_id", roles: [PlatformAdmin, MonitoringAgent], code: 200, input: ["limit?", "offset?", "senior_id?"], output: "Caregiver[]", side_effects: [] }
  - { method: POST, path: "/v1/contact-tree-entries", description: "Add an escalation contact to a senior's tree", roles: [PlatformAdmin], code: 201, input: [senior_id, caregiver_id, priority_rank, min_severity, response_timeout_seconds], output: ContactTreeEntry, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/v1/contact-tree-entries/{entry_id}", description: "Get a contact-tree entry", roles: [PlatformAdmin, MonitoringAgent], code: 200, input: [], output: ContactTreeEntry, side_effects: [] }
  - { method: GET, path: "/v1/contact-tree-entries", description: "List contact-tree entries, filterable by senior_id / caregiver_id", roles: [PlatformAdmin, MonitoringAgent], code: 200, input: ["limit?", "offset?", "senior_id?", "caregiver_id?"], output: "ContactTreeEntry[]", side_effects: [] }
  - { method: PATCH, path: "/v1/contact-tree-entries/{entry_id}", description: "Update rank/timeout/min_severity", roles: [PlatformAdmin], code: 200, input: ["priority_rank?", "min_severity?", "response_timeout_seconds?"], output: ContactTreeEntry, side_effects: ["rank uniqueness enforced"] }
  - { method: DELETE, path: "/v1/contact-tree-entries/{entry_id}", description: "Remove an entry; remaining ACTIVE entries keep their ranks (no renumbering)", roles: [PlatformAdmin], code: 200, input: [], output: ContactTreeEntry, side_effects: ["status->REMOVED"] }

  # --- Alerts & notifications ---
  - { method: POST, path: "/v1/alerts", description: "Monitoring agent manually raises a MANUAL alert", roles: [MonitoringAgent], code: 201, input: [senior_id, severity, "note?"], output: Alert, side_effects: ["alert_type=MANUAL; RAISED then NOTIFYING if eligible contact; open_alert_count += 1"] }
  - { method: GET, path: "/v1/alerts/{alert_id}", description: "Get an alert", roles: [PlatformAdmin, MonitoringAgent, Caregiver], code: 200, input: [], output: Alert, side_effects: [] }
  - { method: GET, path: "/v1/alerts", description: "List alerts, filterable by senior_id / status / alert_type / device_id", roles: [PlatformAdmin, MonitoringAgent, Caregiver], code: 200, input: ["limit?", "offset?", "senior_id?", "status?", "alert_type?", "device_id?"], output: "Alert[]", side_effects: [] }
  - { method: POST, path: "/v1/alerts/{alert_id}/acknowledge", description: "Acknowledge an alert (notified caregiver or agent)", roles: [Caregiver, MonitoringAgent], code: 200, input: [], output: Alert, side_effects: ["->ACKNOWLEDGED; notifications ACKED/SUPERSEDED"] }
  - { method: POST, path: "/v1/alerts/{alert_id}/resolve", description: "Resolve an acknowledged alert", roles: [Caregiver, MonitoringAgent], code: 200, input: ["note?"], output: Alert, side_effects: ["->RESOLVED; open_alert_count -= 1"] }
  - { method: POST, path: "/v1/alerts/{alert_id}/mark-false-alarm", description: "Mark acknowledged alert as false alarm (CRITICAL requires agent)", roles: [Caregiver, MonitoringAgent], code: 200, input: ["note?"], output: Alert, side_effects: ["->FALSE_ALARM; open_alert_count -= 1"] }
  - { method: POST, path: "/v1/alerts/{alert_id}/reopen", description: "Reopen a resolved/false-alarm alert (new notification round)", roles: [MonitoringAgent], code: 200, input: [], output: Alert, side_effects: ["->NOTIFYING (or RAISED if no eligible contact); reopen_count += 1; open_alert_count += 1"] }
  - { method: GET, path: "/v1/alert-notifications/{notification_id}", description: "Get a notification", roles: [PlatformAdmin, MonitoringAgent], code: 200, input: [], output: AlertNotification, side_effects: [] }
  - { method: GET, path: "/v1/alert-notifications", description: "List notifications, filterable by alert_id / caregiver_id / contact_entry_id / status", roles: [PlatformAdmin, MonitoringAgent, Caregiver], code: 200, input: ["limit?", "offset?", "alert_id?", "caregiver_id?", "contact_entry_id?", "status?"], output: "AlertNotification[]", side_effects: [] }

  # --- Medication ---
  - { method: POST, path: "/v1/medication-schedules", description: "Create a medication schedule (OCC on Senior.version; supersedes same-name ACTIVE schedule)", roles: [PlatformAdmin, Caregiver], code: 201, input: [senior_id, medication_name, times_of_day, window_minutes, criticality, start_date, expected_senior_version], output: MedicationSchedule, side_effects: ["increments Senior.version by 1; superseded schedule ENDED with PENDING doses SKIPPED; DoseEvents materialized for [now, now+48h)"] }
  - { method: GET, path: "/v1/medication-schedules/{schedule_id}", description: "Get a schedule", roles: [PlatformAdmin, MonitoringAgent, Caregiver], code: 200, input: [], output: MedicationSchedule, side_effects: [] }
  - { method: GET, path: "/v1/medication-schedules", description: "List schedules, filterable by senior_id / status", roles: [PlatformAdmin, MonitoringAgent, Caregiver], code: 200, input: ["limit?", "offset?", "senior_id?", "status?"], output: "MedicationSchedule[]", side_effects: [] }
  - { method: POST, path: "/v1/medication-schedules/{schedule_id}/end", description: "End a schedule", roles: [PlatformAdmin, Caregiver], code: 200, input: [], output: MedicationSchedule, side_effects: ["->ENDED; PENDING doses SKIPPED"] }
  - { method: GET, path: "/v1/dose-events/{dose_id}", description: "Get a dose event", roles: [PlatformAdmin, MonitoringAgent, Caregiver, Senior], code: 200, input: [], output: DoseEvent, side_effects: [] }
  - { method: GET, path: "/v1/dose-events", description: "List dose events, filterable by schedule_id / senior_id / status", roles: [PlatformAdmin, MonitoringAgent, Caregiver, Senior], code: 200, input: ["limit?", "offset?", "schedule_id?", "senior_id?", "status?"], output: "DoseEvent[]", side_effects: [] }
  - { method: POST, path: "/v1/dose-events/{dose_id}/confirm", description: "Confirm a dose taken (senior app tap or caregiver)", roles: [Senior, Caregiver], code: 200, input: [], output: DoseEvent, side_effects: ["PENDING->TAKEN; punctual computed; missed_streak reset"] }

  # --- Check-ins ---
  - { method: POST, path: "/v1/check-ins", description: "Record a check-in (caregiver or senior self)", roles: [Caregiver, Senior], code: 201, input: [senior_id, kind, "note?"], output: CheckIn, side_effects: ["occurred_at = current clock; requires subscription ACTIVE"] }
  - { method: GET, path: "/v1/check-ins/{checkin_id}", description: "Get a check-in", roles: [PlatformAdmin, MonitoringAgent, Caregiver, Senior], code: 200, input: [], output: CheckIn, side_effects: [] }
  - { method: GET, path: "/v1/check-ins", description: "List check-ins, filterable by senior_id / caregiver_id", roles: [PlatformAdmin, MonitoringAgent, Caregiver, Senior], code: 200, input: ["limit?", "offset?", "senior_id?", "caregiver_id?"], output: "CheckIn[]", side_effects: [] }

  # --- Wellness reports ---
  - { method: POST, path: "/v1/wellness-reports", description: "Generate a wellness report (PROVISIONAL mid-period or FINAL after close)", roles: [PlatformAdmin, MonitoringAgent], code: 201, input: [senior_id, period_start, period_end, mode], output: WellnessReport, side_effects: ["runs calculations.wellness_index (+activity/adherence/device_health); status=READY"] }
  - { method: GET, path: "/v1/wellness-reports/{report_id}", description: "Get a report", roles: [PlatformAdmin, MonitoringAgent, Caregiver], code: 200, input: [], output: WellnessReport, side_effects: [] }
  - { method: GET, path: "/v1/wellness-reports", description: "List reports, filterable by senior_id / mode", roles: [PlatformAdmin, MonitoringAgent, Caregiver], code: 200, input: ["limit?", "offset?", "senior_id?", "mode?"], output: "WellnessReport[]", side_effects: [] }
  - { method: POST, path: "/v1/wellness-reports/{report_id}/regenerate", description: "Recompute a READY report in place (OCC on report version)", roles: [PlatformAdmin], code: 200, input: [expected_report_version], output: WellnessReport, side_effects: ["increments WellnessReport.version by 1; metrics recomputed at current clock with same mode"] }
  - { method: POST, path: "/v1/wellness-reports/{report_id}/deliver", description: "Mark report delivered to caregivers", roles: [PlatformAdmin, MonitoringAgent], code: 200, input: [], output: WellnessReport, side_effects: ["READY->DELIVERED"] }

  # --- Test-driving clock ---
  - { method: POST, path: "/v1/_clock/set_current_utc", description: "Advance the logical clock. Startup default is exactly 2026-05-01T00:00:00Z (the server NEVER falls back to wall-clock time). Each call runs the pinned sweep order of calculations.clock_sweep_order.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: datetime }", side_effects: ["runs clock_sweep_order steps 1-7"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unrecognized X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role is not in the endpoint's roles list" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed type, or observed_at after current clock" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field carries an undeclared member" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id (left-to-right) or body FK id does not resolve" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Entity-backed caller does not own the target resource (caregiver/senior/installer mismatch)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state that allows the requested transition" }
  - { id: ERR_APPOINTMENT_TERMINAL, http: 409, condition: "InstallAppointment is COMPLETED/CANCELLED/NO_SHOW and rejects confirm/complete/cancel/reschedule" }
  - { id: ERR_ALERT_NOT_ACTIONABLE, http: 409, condition: "Alert is not in an actionable state for the requested alert action" }
  - { id: ERR_SUBSCRIPTION_NOT_ACTIVE, http: 409, condition: "Operation requires subscription service_status == ACTIVE" }
  - { id: ERR_DOSE_NOT_PENDING, http: 409, condition: "DoseEvent is not PENDING (already TAKEN/MISSED/SKIPPED)" }
  - { id: ERR_KIT_NOT_DELIVERED, http: 409, condition: "Complete requires kit DELIVERED; activate requires an INSTALLED/ACTIVE kit" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the parent entity's current version (OCC)" }
  - { id: ERR_SAFETY_AGENT_REQUIRED, http: 403, condition: "FALSE_ALARM on a CRITICAL alert requires MonitoringAgent" }
  - { id: ERR_NOT_NOTIFIED_CONTACT, http: 403, condition: "Acknowledging caregiver has no SENT notification for this alert" }
  - { id: ERR_DEVICE_SAFETY_REQUIRED, http: 422, condition: "Decommissioning the last functional GATEWAY of an ACTIVE-posture senior is forbidden" }
  - { id: ERR_WINDOW_TOO_SHORT, http: 422, condition: "Install window duration outside [60, 240] minutes" }
  - { id: ERR_RANK_CONFLICT, http: 409, condition: "priority_rank already used by an ACTIVE contact-tree entry of the senior" }
  - { id: ERR_INSTALLER_WINDOW_CONFLICT, http: 409, condition: "New window intersects installer's non-terminal appointment expanded by the 30-minute travel buffer (half-open + buffer semantics)" }
  - { id: ERR_SENIOR_WINDOW_CONFLICT, http: 409, condition: "New window overlaps a non-terminal appointment of the same senior under closed-interval semantics (touching endpoints conflict)" }
  - { id: ERR_DUPLICATE_REPORT, http: 409, condition: "A FINAL wellness report already exists for the senior and an overlapping period" }
  - { id: ERR_WINDOW_IN_PAST, http: 422, condition: "window_start is not strictly after the current clock" }
  - { id: ERR_OUTSIDE_APPOINTMENT_WINDOW, http: 409, condition: "Complete attempted while current clock is outside [window_start, window_end]" }
  - { id: ERR_PERIOD_NOT_CLOSED, http: 422, condition: "FINAL report before period_end, or PROVISIONAL report outside its period" }
  - { id: ERR_CAREGIVER_SENIOR_MISMATCH, http: 422, condition: "Contact-tree entry references a caregiver serving a different senior" }
  - { id: ERR_KIT_SENIOR_MISMATCH, http: 422, condition: "Appointment references a kit belonging to a different senior" }
  - { id: ERR_FEATURE_GATED, http: 422, condition: "Subscription plan does not include the feature (medication reminders / wellness reports)" }
  - { id: ERR_CONTACT_LIMIT_EXCEEDED, http: 422, condition: "Senior's ACTIVE contact-tree entries already equal plan.max_contacts" }
  - { id: ERR_BILLING_NOT_CURRENT, http: 409, condition: "Activate/resume requires billing_status == CURRENT" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator of the monitoring platform; manages plans, seniors, kits, installers, subscriptions, contact trees; drives the test clock"
    identity: opaque
    exclusive_operations: ["subscription-plan create", "senior create", "subscription create/activate/record-payment/change-plan/resume/cancel", "kit order/ship/deliver", "device decommission", "installer register", "appointment schedule/cancel/reschedule", "caregiver register", "contact-tree create/update/delete", "medication-schedule create/end", "wellness-report regenerate", "clock advance"]
    shared_operations: ["read any resource", "wellness-report create/deliver", "medication-schedule create/end (with caregiver)"]
  - name: MonitoringAgent
    description: "24/7 monitoring-center operator; triages alerts"
    identity: opaque
    exclusive_operations: ["manual alert raise", "alert reopen"]
    shared_operations: ["alert acknowledge/resolve/mark-false-alarm (any senior)", "read alerts/notifications/dashboards", "wellness-report create/deliver"]
  - name: Caregiver
    description: "Family/professional caregiver serving exactly one senior"
    identity: "entity_backed:Caregiver"
    exclusive_operations: []
    shared_operations: ["acknowledge/resolve/mark-false-alarm alerts of own senior (only when notified)", "check-in for own senior", "confirm doses of own senior", "medication-schedule create/end for own senior", "read own senior's dashboard/alerts/devices/reports"]
  - name: Senior
    description: "The monitored person using the companion app"
    identity: "entity_backed:Senior"
    exclusive_operations: []
    shared_operations: ["self check-in (SELF_CONFIRM)", "confirm own doses", "read own dashboard"]
  - name: Installer
    description: "Field technician performing kit installs"
    identity: "entity_backed:Installer"
    exclusive_operations: ["confirm/complete own appointments"]
    shared_operations: ["read own appointments and kits"]
  - name: DeviceHub
    description: "Device gateway service pushing telemetry"
    identity: opaque
    exclusive_operations: ["POST /v1/telemetry"]
    shared_operations: []
