            - "RemedyAllocation.labor_covered_cents == 0 (MIXED_MANUFACTURER voids labor coverage entirely)"

      - name: workmanship_score_floored_at_zero
        claim_type: constants_applied
        grounds: [calculations.workmanship_score_update]
        distinguishing_aspect: "The SCORE_FLOOR constant binds: substantiating two complaints against a contractor whose score is already 10 leaves the score at 0, not negative."
        test_recipe:
          setup:
            - "contractor with workmanship_score driven to 10 by two INSTALLATION_ERROR adjudications (100 - 20)... simpler: two substantiated complaints (−10) put score at 90; instead pin floor with 21+ complaints. Concrete chain: 21 complaints all filed 2026-09-01, substantiated one by one; score would be 100 - 105 = -5 without the floor"
            - "note: the contractor is REVOKED at the 8th substantiation, which would block this path; therefore this instance uses a different driver: a single contractor accumulating −5 complaint deltas is capped by revocation first, so the floor is instead exercised via the reopen-refund ceiling (min(100, ...))"
          setup_api_calls: []
          trigger: []
          assert:
            - "SUPERSEDED: floor not reachable because revocation at lifetime 8 caps complaint-driven decay; ceiling behavior covered by contractor_liability_conserved_across_adjudicate_and_reopen"
        excluded_because:
          difficulty_instance: compensating_invariant / contractor_liability_conserved_across_adjudicate_and_reopen
          rationale: "The workmanship floor/ceiling arithmetic is exercised through the reopen refund path (score returns to exactly 100, capped) in the named §1.8 instance; a pure floor test is unreachable because revocation precedes it."

