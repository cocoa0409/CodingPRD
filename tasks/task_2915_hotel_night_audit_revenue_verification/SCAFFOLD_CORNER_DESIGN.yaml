              captures: { doc_id: "$.data.id" }
            - call: "POST /night-audit/journal-postings"
              payload: { business_date_id: "${bd1_id}", folio_id: "${folio_id}", charge_type: "MISC_CHARGE", amount: 40.00, memo: "Minibar" }
              as: Controller
              as_user_id: "u_ctl_1"
              captures: { posting_id: "$.data.id" }
            - call: "POST /night-audit/settlement-batches"
              payload: { business_date_id: "${bd1_id}", outlet_id: "${lounge_id}", tender_type: "CASH", shift_start_at: "2026-08-01T14:00:00.000Z", shift_end_at: "2026-08-01T22:00:00.000Z", declared_amount: 100.00 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { batch_id: "$.data.id" }
            - call: "POST /night-audit/business-dates/${bd1_id}/post-room-and-tax"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/seal-charges"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/verify-settlements"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
          trigger: "POST /night-audit/authorization-documents/${doc_id}/review with decision APPROVE as Controller (X-User-ID u_ctl_1) - the very identity recorded in filed_by_user_id."
          assert:
            - "HTTP 403 with data.error_id == \"ERR_SELF_APPROVAL_FORBIDDEN\"; the document still reads status == \"PENDING\", reviewed_by_user_id == null and version == 1."
            - "The same review as RevenueManager (X-User-ID u_rm_1) returns 200 with status == \"ACTIVE\" and reviewed_by_user_id == \"u_rm_1\", so the block was about the identity and not about the role - Controller is a legitimate reviewer for documents it did not file."
            - "POST /night-audit/journal-postings/${posting_id}/reverse as Controller (X-User-ID u_ctl_1) fails 403 ERR_SELF_REVERSAL_FORBIDDEN - the same conflict on a different entity earns its own code - while the identical call as NightAuditor (X-User-ID u_na_1) returns 201 with a reversing line."
            - "POST /night-audit/settlement-batches/${batch_id}/accept-variance as NightAuditor is refused 403 ERR_UNAUTHORIZED because the endpoint lists only RevenueManager and Controller, so on this site the identity clash is not even reachable for the declarer u_na_1."
            - "A second CASH batch on a different shift window declared by RevenueManager (X-User-ID u_rm_1) and then flagged cannot be accepted by u_rm_1: accept-variance returns 403 ERR_SELF_APPROVAL_FORBIDDEN, while u_ctl_1 accepts it with 200 and accepted_by_user_id == \"u_ctl_1\"."
            - "GET /night-audit/journal-postings?reverses_posting_id=${posting_id} returns exactly 1 row after the successful reversal, proving the refused attempt wrote nothing."

      - name: rbac_approval_ladder_tier_gate
        claim_type: unauthorized_denial
        excluded_because:
          difficulty_instance: segregation_of_duties_outranks_approved_amount_ceiling_on_allowance_approve
          rationale: "The ladder claim - a role below Allowance.required_approval_role is refused with ERR_APPROVAL_TIER_INSUFFICIENT - is tested there against a competing money violation, which pins both the code and its precedence; a plain breadth repeat would assert strictly less."

  - section: cross-cutting complexity layers
    instances:

      - name: layer_optimistic_concurrency_stale_business_date_version_writes_nothing
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[revenue-report-create-stale-business-date]", "errors[ERR_STALE_BUSINESS_DATE_VERSION]", "validations[priority=85]", "endpoints[POST /night-audit/revenue-reports]"]
        distinguishing_aspect: "The scaffold declares exactly one OCC-guarded write, so this probe pins all three of its halves: the stale value is refused with 412 and nothing at all is written, the previous report keeps its DISTRIBUTED status, and the BusinessDate.version the caller was fighting over is itself untouched by the refusal."
        test_recipe:
          setup: ["Standard property; business date 2026-08-01 with one IN_HOUSE rack-rate folio, walked to SETTLEMENT_REVIEW (version 4) and carrying a DISTRIBUTED report generated at that version; then re-verified once so the date's version has moved on to 5 behind the caller's back."]
          setup_api_calls:
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4, benchmark_calendar_room_revenue_amount: 400.00 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id" }
            - call: "POST /night-audit/folios"
              payload: { property_id: "${prop_id}", arrival_business_date_id: "${bd1_id}", confirmation_code: "CF-OCC", guest_name: "Marit Oyelowo", room_number: "2501", nights_count: 1, contracted_rate_amount: 200.00, rate_plan_code: "BAR", market_segment: "TRANSIENT", settlement_method: "CASH", scheduled_checkout_at: "2026-08-02T11:00:00.000Z", credit_limit_amount: 5000.00 }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { folio_id: "$.data.id" }
            - call: "POST /night-audit/folios/${folio_id}/check-in"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/post-room-and-tax"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/seal-charges"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/verify-settlements"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { stale_v: "$.data.version" }
            - call: "POST /night-audit/revenue-reports"
              payload: { business_date_id: "${bd1_id}", recipient_role_list: ["Controller"], expected_business_date_version: "${stale_v}", pace_basis: "CALENDAR_ALIGNED" }
              as: RevenueManager
              as_user_id: "u_rm_1"
              captures: { first_report: "$.data.id" }
            - call: "POST /night-audit/revenue-reports/${first_report}/distribute"
              payload: {}
              as: RevenueManager
              as_user_id: "u_rm_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/verify-settlements"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { fresh_v: "$.data.version" }
          trigger: "POST /night-audit/revenue-reports with business_date_id ${bd1_id}, recipient_role_list [\"Controller\", \"RevenueManager\"] and expected_business_date_version ${stale_v} as RevenueManager (X-User-ID u_rm_1) - the version that was current before the re-verify."
          assert:
            - "HTTP 412 with data.error_id == \"ERR_STALE_BUSINESS_DATE_VERSION\": ${stale_v} is 4 and the date now holds ${fresh_v} == 5."
            - "Nothing was written: GET /night-audit/revenue-reports?business_date_id=${bd1_id} still returns total_count == 1, and that single row is ${first_report} with status still \"DISTRIBUTED\" - a refused snapshot does not supersede its predecessor."
            - "GET /night-audit/business-dates/${bd1_id} still reads version == 5, so the failed OCC write did not itself consume a version."
            - "Resubmitting the identical body with expected_business_date_version ${fresh_v} returns 201, and only then does ${first_report} read status == \"SUPERSEDED\"."
            - "expected_business_date_version 0 and 99 both fail 412 with the same code - the check is equality, not an ordering test - while omitting the field entirely fails 400 ERR_INVALID_REQUEST because it is a required input."
            - "Across the whole walk the date's version rose by exactly one per accepted write: 1 at creation, 2 after post-room-and-tax, 3 after seal-charges, 4 after the first verify-settlements and 5 after the re-verify."

      - name: layer_cascading_side_effects_chain
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: allowance_approval_cascades_four_hops_to_supersede_distributed_report
          rationale: "That instance verifies a four-hop chain end to end - allowance to folio to business date to distributed report - and its sibling walks a three-hop card-decline chain, which together exceed anything a breadth probe of this layer would add."

      - name: layer_dual_variant_calculation_both_variants
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: occupancy_tax_provisional_vs_final_true_up_on_seal
          rationale: "Both declared dual-variant calculations are already probed in depth - the occupancy-tax provisional-versus-final delta there and the two pace benchmarks in pace_index_calendar_aligned_vs_weekday_aligned_benchmark - including the reconciliation posting on the variant switch."

      - name: layer_rate_threshold_triggers_boundaries
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: allowance_manager_threshold_inclusive_at_two_fifty
          rationale: "The cumulative and instantaneous threshold boundaries of this layer are covered by that instance at 249.99/250.00/250.01 and by settlement_variance_tolerance_inclusive_at_five_dollars and late_checkout_grace_window_exclusive_at_thirty_minutes for the other two triggers."

  - section: consistency model
    instances:

      - name: consistency_immediate_every_derived_field_is_current_in_the_same_response
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "endpoints[POST /night-audit/allowances/{id}/approve]", "calculations.folio_balance", "calculations.occupancy_statistics"]
        distinguishing_aspect: "The declared model is immediate, so a single approval must land every one of its derived consequences before the response is serialised - the posting exists, the folio and the date are re-derived, and the distributed report is already SUPERSEDED with no second call and no re-read needed."
        test_recipe:
          setup: ["Standard property; business date 2026-08-01 walked to SETTLEMENT_REVIEW with one IN_HOUSE folio carrying ROOM 200.00 and OCCUPANCY_TAX 17.75; a DISTRIBUTED revenue report for that date; a SUBMITTED allowance of 200.00 requested by u_fd_1."]
          setup_api_calls:
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
