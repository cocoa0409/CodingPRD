            - "Registration.${reg_l}: measured_head == 40000, threshold_head == 35000, determination_outcome == MANDATORY"
            - "Registration.${reg_l} activates to ACTIVE with registration_number == 'MPR-2026-0001' (sequence is program-wide, and the EXEMPT swine registration never consumed a number)"

      - name: closed_plants_excluded_and_pooled_average_floored
        claim_type: precision
        grounds:
          - calculations.reporter_threshold_determination.eligible_plants
          - calculations.reporter_threshold_determination.FIVE_YEAR_AVERAGE
          - state_machines.Registration.UNDER_APPEAL_to_DETERMINED
        distinguishing_aspect: |
          Two facts in one measurement: only ACTIVE and IDLE plants are pooled
          (the CLOSED plant's 1000000 head are ignored), and the pooled five-year
          total is floored rather than rounded — 400001 / 5 = 80000.2 becomes
          80000, not 80000.2 and not 80001. Reopening the CLOSED plant and
          redetermining after an appeal flips the same firm from EXEMPT (80000) to
          MANDATORY (280000), proving the eligibility filter is re-evaluated at
          redetermination time.
        test_recipe:
          setup:
            - "Delta Beef with three CATTLE plants: P1 ACTIVE 60000/60000/60000/60000/60001, P2 IDLE 20000 each year, P3 CLOSED 200000 each year."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Delta Beef", entity_type: "PACKER_PROCESSOR", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_d: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_d}", plant_code: "EST-701", species: "CATTLE", annual_head_history: { "2021": 60000, "2022": 60000, "2023": 60000, "2024": 60000, "2025": 60001 }, boxed_beef_volume_lbs_prior_year: 0, forward_commitment_cap_head: 500, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { p1: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_d}", plant_code: "EST-702", species: "CATTLE", annual_head_history: { "2021": 20000, "2022": 20000, "2023": 20000, "2024": 20000, "2025": 20000 }, boxed_beef_volume_lbs_prior_year: 0, forward_commitment_cap_head: 500, status: "IDLE" }
              as: ProgramAdmin
              captures: { p2: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_d}", plant_code: "EST-703", species: "CATTLE", annual_head_history: { "2021": 200000, "2022": 200000, "2023": 200000, "2024": 200000, "2025": 200000 }, boxed_beef_volume_lbs_prior_year: 0, forward_commitment_cap_head: 500, status: "CLOSED" }
              as: ProgramAdmin
              captures: { p3: $.data.id }
            - call: "POST /registrations"
              payload: { reporting_entity_id: "${ent_d}", determination_year: 2026, basis_variant: "FIVE_YEAR_AVERAGE" }
              as: ProgramAdmin
              captures: { reg_d: $.data.id }
          trigger:
            - call: "POST /registrations/${reg_d}/determine"
              payload: {}
              as: ProgramAdmin
            - call: "POST /registrations/${reg_d}/appeal"
              payload: { appeal_reason: "idle and reopened plants must be counted" }
              as: ReporterAgent
              as_user_id: "${ent_d}"
            - call: "PATCH /plants/${p3}"
              payload: { status: "ACTIVE" }
              as: ProgramAdmin
            - call: "POST /registrations/${reg_d}/redetermine"
              payload: { basis_variant: "FIVE_YEAR_AVERAGE" }
