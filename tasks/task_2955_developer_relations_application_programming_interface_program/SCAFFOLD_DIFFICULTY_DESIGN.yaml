  - rule_id: resource_temporal_overlap
    instances:
      - name: sandbox_lease_adjacent_start_allowed_overlap_rejected
        grounds:
          - validations.priority_36_sandbox_interval_overlap
          - entities.SandboxLease.fields.expires_at
          - endpoints.POST /sandbox-leases
          - errors.ERR_SANDBOX_INTERVAL_OVERLAP
        distinguishing_aspect: |
          The occupancy interval is half-open [starts_at, expires_at), so the boundary decides the
          verdict: a second lease starting one day BEFORE the incumbent expires is refused, while one
          starting exactly AT expires_at is accepted. The exclusion is also scoped to the
          (developer, product) pair, so the same overlapping interval on a different product is
          accepted — three calls that differ only in one dimension each.
        test_recipe:
          setup:
            - "Developer D1 has acknowledged docs 2 / terms 1 and holds one ACTIVE sandbox lease on ApiProduct P1 from 2026-08-01 for 14 days, so it occupies [2026-08-01T00:00:00Z, 2026-08-15T00:00:00Z)"
            - "ApiProduct P6 exists as a second product with its own sample application slug"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /api-products"
              payload: { name: "Catalog API", data_sensitivity: "PUBLIC", scope_catalog: [{ scope: "catalog.read", sensitivity: "PUBLIC" }], sample_app_slugs: ["quickstart-node"], sustained_rpm_pool: 20000, monthly_call_pool: 50000000, required_tos_version: 1 }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { p1_id: $.data.id }
            - call: "POST /api-products"
              payload: { name: "Profile API", data_sensitivity: "PERSONAL", scope_catalog: [{ scope: "profile.read", sensitivity: "PERSONAL" }], sample_app_slugs: ["profile-quickstart"], sustained_rpm_pool: 6000, monthly_call_pool: 2000000, required_tos_version: 1 }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { p6_id: $.data.id }
            - call: "POST /developers"
              payload: { org_name: "Northwind Labs", contact_email: "dev1@northwind.example", region_code: "EU" }
              as: DevRelManager
              as_user_id: "drm-1"
              captures: { d1_id: $.data.id }
            - call: "POST /developers/${d1_id}/onboarding-acknowledgement"
              payload: { docs_version: 2, tos_version: 1 }
              as: Developer
              as_user_id: "${d1_id}"
            - call: "POST /sandbox-leases"
              payload: { developer_id: "${d1_id}", api_product_id: "${p1_id}", starts_at: "2026-08-01T00:00:00Z", lease_days: 14, sample_app_slug: "quickstart-node" }
              as: Developer
              as_user_id: "${d1_id}"
              captures: { sl1_id: $.data.id, sl1_expires: $.data.expires_at }
          trigger:
            - call: "POST /sandbox-leases"
              payload: { developer_id: "${d1_id}", api_product_id: "${p1_id}", starts_at: "2026-08-14T00:00:00Z", lease_days: 7, sample_app_slug: "quickstart-node" }
              as: Developer
              as_user_id: "${d1_id}"
            - call: "POST /sandbox-leases"
              payload: { developer_id: "${d1_id}", api_product_id: "${p1_id}", starts_at: "2026-08-15T00:00:00Z", lease_days: 7, sample_app_slug: "quickstart-node" }
              as: Developer
              as_user_id: "${d1_id}"
              captures: { sl2_id: $.data.id }
            - call: "POST /sandbox-leases"
              payload: { developer_id: "${d1_id}", api_product_id: "${p6_id}", starts_at: "2026-08-14T00:00:00Z", lease_days: 7, sample_app_slug: "profile-quickstart" }
              as: Developer
              as_user_id: "${d1_id}"
              captures: { sl3_id: $.data.id }
          assert:
            - "SandboxLease.${sl1_id}.expires_at == 2026-08-15T00:00:00Z and state == ACTIVE"
            - "the 2026-08-14 lease on the same product -> 409 ERR_SANDBOX_INTERVAL_OVERLAP"
            - "the 2026-08-15 lease on the same product -> 201 with expires_at == 2026-08-22T00:00:00Z (adjacency is not overlap)"
            - "the 2026-08-14 lease on the OTHER product -> 201 with expires_at == 2026-08-21T00:00:00Z"
            - "GET /sandbox-leases?developer_id=${d1_id}&state=ACTIVE returns exactly three leases, total_count == 3"
            - "after releasing the incumbent, a lease starting 2026-08-14 on P1 is accepted (only ACTIVE leases occupy the interval)"

      - name: deprecation_window_aggregate_capacity_two_per_product
        grounds:
          - validations.priority_35_deprecation_window_full
          - calculations.deprecation_notice_requirement
          - state_machines.ApiVersion.GENERAL_AVAILABILITY_to_DEPRECATION_ANNOUNCED
          - errors.ERR_DEPRECATION_WINDOW_FULL
        distinguishing_aspect: |
          Aggregate temporal capacity rather than a pairwise clash: each announcement is individually
          valid — same product, same 60-day notice, all three versions GENERAL_AVAILABILITY — but at
          most MAX_CONCURRENT_DEPRECATIONS (2) sunset windows may be open on one product at a time,
          so the third is refused on the collective count. The refusal is NOT the notice-length rule,
          which the request satisfies exactly, and capacity is released only when a window closes.
