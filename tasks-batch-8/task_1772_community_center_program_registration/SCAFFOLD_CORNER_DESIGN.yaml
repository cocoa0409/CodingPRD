# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Community Center Program Registration & Operations
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: season_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Season.fields.family_discount_threshold, entities.Season.fields.family_discount_pct, entities.Season.fields.scholarship_budget_cents, entities.Season.fields.status]
        distinguishing_aspect: "A season created without the optional fields gets family_discount_threshold 3, family_discount_pct 10, scholarship_budget_cents 0, scholarship_committed_cents 0, status DRAFT, version 1."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /seasons", payload: { name: "Winter 2027", start_date: "2027-01-05T00:00:00Z", end_date: "2027-03-30T00:00:00Z", resident_opens_at: "2026-12-01T00:00:00Z", general_opens_at: "2026-12-08T00:00:00Z", registration_closes_at: "2027-01-02T00:00:00Z" }, as: ProgramCoordinator, captures: { sn: $.data.id, sn_th: $.data.family_discount_threshold, sn_pct: $.data.family_discount_pct, sn_bud: $.data.scholarship_budget_cents, sn_st: $.data.status, sn_v: $.data.version } }
          assert:
            - "Season.${sn}.family_discount_threshold == 3"
            - "Season.${sn}.family_discount_pct == 10"
            - "Season.${sn}.scholarship_budget_cents == 0 and scholarship_committed_cents == 0"
            - "Season.${sn}.status == DRAFT and version == 1"
            - "Season.${sn}.id is a server-minted UUID; created_at/updated_at stamped"

      - name: household_created_with_zero_credit_pending_residency
        claim_type: defaults
        grounds: [entities.Household.fields.account_credit_cents, entities.Household.fields.residency_status]
        distinguishing_aspect: "A new household starts with residency_status PENDING and account_credit_cents 0; PENDING counts as nonresident for fee basis until verified."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /households", payload: { account_name: "New Fam" }, as: HouseholdManager, captures: { hh: $.data.id, hh_res: $.data.residency_status, hh_cr: $.data.account_credit_cents } }
          assert:
            - "Household.${hh}.residency_status == PENDING"
            - "Household.${hh}.account_credit_cents == 0"

      - name: participant_missing_required_birth_date
        claim_type: required_fields
        grounds: [entities.Participant.fields.birth_date, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /participants without birth_date is rejected ERR_INVALID_REQUEST 400 (required input field missing)."
        test_recipe:
          setup: ["Household HX exists"]
          setup_api_calls:
            - { call: "POST /households", payload: { account_name: "HX" }, as: HouseholdManager, captures: { hx: $.data.id } }
          trigger:
            - { call: "POST /participants", payload: { household_id: "${hx}", full_name: "No Dob" }, as: HouseholdManager, as_user_id: "${hx}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"

      - name: registration_create_rejects_computed_field_input
        claim_type: computed_fields
        grounds: [entities.Registration.fields.fee_charged_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Client-supplied computed field fee_charged_cents in POST /registrations is rejected ERR_INVALID_REQUEST 400 (unknown payload key); the server alone computes it."
        test_recipe:
          setup: ["Season PUBLISHED; session SP PUBLISHED, clock 2026-08-17; household HH with participant PP; session version captured"]
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "Fall 2026", start_date: "2026-09-01T00:00:00Z", end_date: "2026-12-15T00:00:00Z", resident_opens_at: "2026-08-10T00:00:00Z", general_opens_at: "2026-08-17T00:00:00Z", registration_closes_at: "2026-09-15T00:00:00Z" }, as: ProgramCoordinator, captures: { sn: $.data.id } }
            - { call: "POST /seasons/${sn}/publish", payload: {}, as: ProgramCoordinator }
            - { call: "POST /programs", payload: { season_id: "${sn}", name: "Gym", category: "Sports", min_age: 0, max_age: 120 }, as: ProgramCoordinator, captures: { pg: $.data.id } }
            - { call: "POST /rooms", payload: { name: "Hall", capacity: 50 }, as: ProgramCoordinator, captures: { rm: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Gym G", email: "gg@x.com" }, as: ProgramCoordinator, captures: { ins: $.data.id } }
            - { call: "POST /class-sessions", payload: { program_id: "${pg}", instructor_id: "${ins}", title: "SP", capacity: 5, min_enrollment: 1, fee_resident_cents: 5000, fee_nonresident_cents: 5000, enrollment_check_at: "2026-09-08T00:00:00Z" }, as: ProgramCoordinator, captures: { sp: $.data.id } }
            - { call: "POST /instructor-contracts", payload: { session_id: "${sp}", instructor_id: "${ins}", revenue_share_bp: 5000, guarantee_min_cents: 0, cancellation_guarantee_cents: 0, settlement_basis: ENROLLMENT_BASIS }, as: ProgramCoordinator, captures: { ct: $.data.id } }
            - { call: "POST /class-meetings", payload: { session_id: "${sp}", room_id: "${rm}", starts_at: "2026-09-20T18:00:00Z", ends_at: "2026-09-20T19:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /instructor-contracts/${ct}/accept", payload: {}, as: Instructor, as_user_id: "${ins}" }
            - { call: "POST /class-sessions/${sp}/publish", payload: {}, as: ProgramCoordinator, captures: { sp_v: $.data.version } }
            - { call: "POST /households", payload: { account_name: "HH" }, as: HouseholdManager, captures: { hh: $.data.id } }
            - { call: "POST /participants", payload: { household_id: "${hh}", full_name: "Pp P", birth_date: "1990-01-01T00:00:00Z" }, as: HouseholdManager, as_user_id: "${hh}", captures: { pp: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T00:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /registrations", payload: { session_id: "${sp}", participant_id: "${pp}", expected_class_session_version: "${sp_v}", fee_charged_cents: 1 }, as: HouseholdManager, as_user_id: "${hh}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400 (computed field not accepted as input)"

      - name: class_session_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a random UUID session id returns the 404 envelope with ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /class-sessions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: ProgramCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, HTTP 404"

  - section: state_machines
    instances:
      - name: cancel_cancelled_session_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ClassSession, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel on an already-CANCELLED session returns ERR_INVALID_STATE 409 and fires no side effects."
        test_recipe:
          setup: ["Season PUBLISHED; session SC PUBLISHED (fees 5000/5000, capacity 5, min_enrollment 1, one meeting, ACCEPTED contract)"]
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "Fall 2026", start_date: "2026-09-01T00:00:00Z", end_date: "2026-12-15T00:00:00Z", resident_opens_at: "2026-08-10T00:00:00Z", general_opens_at: "2026-08-17T00:00:00Z", registration_closes_at: "2026-09-15T00:00:00Z" }, as: ProgramCoordinator, captures: { sn: $.data.id } }
            - { call: "POST /seasons/${sn}/publish", payload: {}, as: ProgramCoordinator }
            - { call: "POST /programs", payload: { season_id: "${sn}", name: "Robotics", category: "Education", min_age: 0, max_age: 120 }, as: ProgramCoordinator, captures: { pg: $.data.id } }
            - { call: "POST /rooms", payload: { name: "Lab", capacity: 50 }, as: ProgramCoordinator, captures: { rm: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Rob O", email: "ro@x.com" }, as: ProgramCoordinator, captures: { ins: $.data.id } }
            - { call: "POST /class-sessions", payload: { program_id: "${pg}", instructor_id: "${ins}", title: "SC", capacity: 5, min_enrollment: 1, fee_resident_cents: 5000, fee_nonresident_cents: 5000, enrollment_check_at: "2026-09-08T00:00:00Z" }, as: ProgramCoordinator, captures: { sc: $.data.id } }
            - { call: "POST /instructor-contracts", payload: { session_id: "${sc}", instructor_id: "${ins}", revenue_share_bp: 5000, guarantee_min_cents: 0, cancellation_guarantee_cents: 0, settlement_basis: ENROLLMENT_BASIS }, as: ProgramCoordinator, captures: { ct: $.data.id } }
            - { call: "POST /class-meetings", payload: { session_id: "${sc}", room_id: "${rm}", starts_at: "2026-09-20T18:00:00Z", ends_at: "2026-09-20T19:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /instructor-contracts/${ct}/accept", payload: {}, as: Instructor, as_user_id: "${ins}" }
            - { call: "POST /class-sessions/${sc}/publish", payload: {}, as: ProgramCoordinator }
            - { call: "POST /class-sessions/${sc}/cancel", payload: {}, as: ProgramCoordinator, captures: { sc_st: $.data.status } }
          trigger:
            - { call: "POST /class-sessions/${sc}/cancel", payload: {}, as: ProgramCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "First cancel succeeded: status == CANCELLED"
            - "Second cancel: error_id == ERR_INVALID_STATE, HTTP 409; no further cascade"

      - name: waitlisted_registration_cannot_pay
        claim_type: precondition_enforcement
        grounds: ["validations[priority=11]", "errors[ERR_PAYMENT_NOT_ALLOWED]", state_machines.RegistrationPaymentAxis]
        distinguishing_aspect: "A WAITLISTED registration (payment PENDING, no due date) cannot pay: POST /payment returns ERR_PAYMENT_NOT_ALLOWED 409."
        test_recipe:
          setup: ["Season PUBLISHED, clock 2026-08-17; session capacity 1 fees 5000/5000 PUBLISHED; RA (HA) ENROLLED; RB (HB) WAITLISTED"]
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "Fall 2026", start_date: "2026-09-01T00:00:00Z", end_date: "2026-12-15T00:00:00Z", resident_opens_at: "2026-08-10T00:00:00Z", general_opens_at: "2026-08-17T00:00:00Z", registration_closes_at: "2026-09-15T00:00:00Z" }, as: ProgramCoordinator, captures: { sn: $.data.id } }
            - { call: "POST /seasons/${sn}/publish", payload: {}, as: ProgramCoordinator }
            - { call: "POST /programs", payload: { season_id: "${sn}", name: "Boxing", category: "Sports", min_age: 0, max_age: 120 }, as: ProgramCoordinator, captures: { pg: $.data.id } }
            - { call: "POST /rooms", payload: { name: "Ring", capacity: 50 }, as: ProgramCoordinator, captures: { rm: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Box B", email: "bb@x.com" }, as: ProgramCoordinator, captures: { ins: $.data.id } }
            - { call: "POST /class-sessions", payload: { program_id: "${pg}", instructor_id: "${ins}", title: "Boxing", capacity: 1, min_enrollment: 1, fee_resident_cents: 5000, fee_nonresident_cents: 5000, enrollment_check_at: "2026-09-08T00:00:00Z" }, as: ProgramCoordinator, captures: { ss: $.data.id } }
            - { call: "POST /instructor-contracts", payload: { session_id: "${ss}", instructor_id: "${ins}", revenue_share_bp: 5000, guarantee_min_cents: 0, cancellation_guarantee_cents: 0, settlement_basis: ENROLLMENT_BASIS }, as: ProgramCoordinator, captures: { ct: $.data.id } }
            - { call: "POST /class-meetings", payload: { session_id: "${ss}", room_id: "${rm}", starts_at: "2026-09-20T18:00:00Z", ends_at: "2026-09-20T19:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /instructor-contracts/${ct}/accept", payload: {}, as: Instructor, as_user_id: "${ins}" }
            - { call: "POST /class-sessions/${ss}/publish", payload: {}, as: ProgramCoordinator, captures: { ss_v: $.data.version } }
            - { call: "POST /households", payload: { account_name: "HA" }, as: HouseholdManager, captures: { ha: $.data.id } }
            - { call: "POST /households", payload: { account_name: "HB" }, as: HouseholdManager, captures: { hb: $.data.id } }
            - { call: "POST /participants", payload: { household_id: "${ha}", full_name: "Jab A", birth_date: "1990-01-01T00:00:00Z" }, as: HouseholdManager, as_user_id: "${ha}", captures: { pa: $.data.id } }
            - { call: "POST /participants", payload: { household_id: "${hb}", full_name: "Jab B", birth_date: "1991-01-01T00:00:00Z" }, as: HouseholdManager, as_user_id: "${hb}", captures: { pb: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /registrations", payload: { session_id: "${ss}", participant_id: "${pa}", expected_class_session_version: "${ss_v}" }, as: HouseholdManager, as_user_id: "${ha}", captures: { ra: $.data.id } }
            - { call: "GET /class-sessions/${ss}", as: ProgramCoordinator, captures: { ss_v2: $.data.version } }
            - { call: "POST /registrations", payload: { session_id: "${ss}", participant_id: "${pb}", expected_class_session_version: "${ss_v2}" }, as: HouseholdManager, as_user_id: "${hb}", captures: { rb: $.data.id, rb_st: $.data.enrollment_status } }
          trigger:
            - { call: "POST /registrations/${rb}/payment", payload: { amount_cents: 5000, method: EXTERNAL }, as: HouseholdManager, as_user_id: "${hb}", captures: { err: $.data.error_id } }
          assert:
            - "Registration.${rb}.enrollment_status == WAITLISTED before the attempt"
            - "error_id == ERR_PAYMENT_NOT_ALLOWED, HTTP 409 (WAITLISTED cannot pay)"

      - name: verify_rejected_form_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.SafetyForm, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REJECTED is terminal: verifying a rejected form returns ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["Season exists; household HF with adult participant PF; form SUBMITTED then REJECTED"]
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "Fall 2026", start_date: "2026-09-01T00:00:00Z", end_date: "2026-12-15T00:00:00Z", resident_opens_at: "2026-08-10T00:00:00Z", general_opens_at: "2026-08-17T00:00:00Z", registration_closes_at: "2026-09-15T00:00:00Z" }, as: ProgramCoordinator, captures: { sn: $.data.id } }
            - { call: "POST /households", payload: { account_name: "HF" }, as: HouseholdManager, captures: { hf: $.data.id } }
            - { call: "POST /participants", payload: { household_id: "${hf}", full_name: "Adult F", birth_date: "1990-01-01T00:00:00Z" }, as: HouseholdManager, as_user_id: "${hf}", captures: { pf: $.data.id } }
            - { call: "POST /safety-forms", payload: { participant_id: "${pf}", season_id: "${sn}", emergency_contact_name: "Adult F", emergency_contact_phone: "555-9", signer_name: "Adult F" }, as: HouseholdManager, as_user_id: "${hf}", captures: { fm: $.data.id } }
            - { call: "POST /safety-forms/${fm}/reject", payload: {}, as: FrontDeskStaff }
          trigger:
            - { call: "POST /safety-forms/${fm}/verify", payload: {}, as: FrontDeskStaff, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409 (REJECTED is terminal)"

      - name: withdraw_approved_application_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ScholarshipApplication, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "APPROVED has no outgoing withdraw transition: withdraw on APPROVED returns ERR_INVALID_STATE 409 (only revoke by FinanceOfficer applies)."
        test_recipe:
          setup: ["Season PUBLISHED (budget 100000); household HX; application APPROVED at 25% (commitment 5000)"]
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "Fall 2026", start_date: "2026-09-01T00:00:00Z", end_date: "2026-12-15T00:00:00Z", resident_opens_at: "2026-08-10T00:00:00Z", general_opens_at: "2026-08-17T00:00:00Z", registration_closes_at: "2026-09-15T00:00:00Z", scholarship_budget_cents: 100000 }, as: ProgramCoordinator, captures: { sn: $.data.id } }
            - { call: "POST /seasons/${sn}/publish", payload: {}, as: ProgramCoordinator }
            - { call: "POST /households", payload: { account_name: "HX" }, as: HouseholdManager, captures: { hx: $.data.id } }
            - { call: "POST /scholarship-applications", payload: { household_id: "${hx}", season_id: "${sn}", household_size: 4, annual_income_cents: 2500000 }, as: HouseholdManager, as_user_id: "${hx}", captures: { ap: $.data.id } }
            - { call: "POST /scholarship-applications/${ap}/start-review", payload: {}, as: ScholarshipReviewer, as_user_id: "rev-1" }
            - { call: "POST /scholarship-applications/${ap}/approve", payload: { approved_pct: 25, estimated_commitment_cents: 5000 }, as: ScholarshipReviewer, as_user_id: "rev-2" }
          trigger:
            - { call: "POST /scholarship-applications/${ap}/withdraw", payload: {}, as: HouseholdManager, as_user_id: "${hx}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409"

      - name: season_close_before_deadline_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Season.PUBLISHED_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Closing a PUBLISHED season before registration_closes_at returns ERR_INVALID_STATE 409; at/after closes_at it succeeds."
        test_recipe:
          setup: ["Season PUBLISHED with registration_closes_at 2026-09-15T00:00:00Z; clock 2026-09-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "Fall 2026", start_date: "2026-09-01T00:00:00Z", end_date: "2026-12-15T00:00:00Z", resident_opens_at: "2026-08-10T00:00:00Z", general_opens_at: "2026-08-17T00:00:00Z", registration_closes_at: "2026-09-15T00:00:00Z" }, as: ProgramCoordinator, captures: { sn: $.data.id } }
            - { call: "POST /seasons/${sn}/publish", payload: {}, as: ProgramCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /seasons/${sn}/close", payload: {}, as: ProgramCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /seasons/${sn}/close", payload: {}, as: ProgramCoordinator, captures: { sn_st: $.data.status } }
          assert:
            - "Early close: error_id == ERR_INVALID_STATE, HTTP 409"
            - "Close at closes_at exactly: succeeds, status == CLOSED (now >= registration_closes_at)"

  - section: calculations
    instances:
      - name: waitlist_ordering_fairness
        claim_type: correct_result
        grounds: [calculations.waitlist_promotion_selector]
        distinguishing_aspect: "Chronological fairness: with two WAITLISTED registrations, the freed seat goes to the one with the earlier waitlisted_at (B, created before C); C stays WAITLISTED."
        test_recipe:
          setup: ["Season PUBLISHED, clock 2026-08-17; session capacity 1, fees 2000/2000, PUBLISHED; RA (HA) ENROLLED (unpaid PENDING); RB (HB) then RC (HC) WAITLISTED in that order"]
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "Fall 2026", start_date: "2026-09-01T00:00:00Z", end_date: "2026-12-15T00:00:00Z", resident_opens_at: "2026-08-10T00:00:00Z", general_opens_at: "2026-08-17T00:00:00Z", registration_closes_at: "2026-09-15T00:00:00Z" }, as: ProgramCoordinator, captures: { sn: $.data.id } }
            - { call: "POST /seasons/${sn}/publish", payload: {}, as: ProgramCoordinator }
            - { call: "POST /programs", payload: { season_id: "${sn}", name: "Ballet", category: "Arts", min_age: 0, max_age: 120 }, as: ProgramCoordinator, captures: { pg: $.data.id } }
            - { call: "POST /rooms", payload: { name: "Studio", capacity: 50 }, as: ProgramCoordinator, captures: { rm: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Bal B", email: "bb@x.com" }, as: ProgramCoordinator, captures: { ins: $.data.id } }
            - { call: "POST /class-sessions", payload: { program_id: "${pg}", instructor_id: "${ins}", title: "Ballet", capacity: 1, min_enrollment: 1, fee_resident_cents: 2000, fee_nonresident_cents: 2000, enrollment_check_at: "2026-09-08T00:00:00Z" }, as: ProgramCoordinator, captures: { ss: $.data.id } }
            - { call: "POST /instructor-contracts", payload: { session_id: "${ss}", instructor_id: "${ins}", revenue_share_bp: 5000, guarantee_min_cents: 0, cancellation_guarantee_cents: 0, settlement_basis: ENROLLMENT_BASIS }, as: ProgramCoordinator, captures: { ct: $.data.id } }
            - { call: "POST /class-meetings", payload: { session_id: "${ss}", room_id: "${rm}", starts_at: "2026-09-20T18:00:00Z", ends_at: "2026-09-20T19:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /instructor-contracts/${ct}/accept", payload: {}, as: Instructor, as_user_id: "${ins}" }
            - { call: "POST /class-sessions/${ss}/publish", payload: {}, as: ProgramCoordinator, captures: { ss_v: $.data.version } }
            - { call: "POST /households", payload: { account_name: "HA" }, as: HouseholdManager, captures: { ha: $.data.id } }
            - { call: "POST /households", payload: { account_name: "HB" }, as: HouseholdManager, captures: { hb: $.data.id } }
            - { call: "POST /households", payload: { account_name: "HC" }, as: HouseholdManager, captures: { hc: $.data.id } }
            - { call: "POST /participants", payload: { household_id: "${ha}", full_name: "Dan A", birth_date: "2012-01-01T00:00:00Z" }, as: HouseholdManager, as_user_id: "${ha}", captures: { pa: $.data.id } }
            - { call: "POST /participants", payload: { household_id: "${hb}", full_name: "Dan B", birth_date: "2013-01-01T00:00:00Z" }, as: HouseholdManager, as_user_id: "${hb}", captures: { pb: $.data.id } }
            - { call: "POST /participants", payload: { household_id: "${hc}", full_name: "Dan C", birth_date: "2014-01-01T00:00:00Z" }, as: HouseholdManager, as_user_id: "${hc}", captures: { pc: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /registrations", payload: { session_id: "${ss}", participant_id: "${pa}", expected_class_session_version: "${ss_v}" }, as: HouseholdManager, as_user_id: "${ha}", captures: { ra: $.data.id } }
            - { call: "GET /class-sessions/${ss}", as: ProgramCoordinator, captures: { ss_v2: $.data.version } }
            - { call: "POST /registrations", payload: { session_id: "${ss}", participant_id: "${pb}", expected_class_session_version: "${ss_v2}" }, as: HouseholdManager, as_user_id: "${hb}", captures: { rb: $.data.id } }
            - { call: "GET /class-sessions/${ss}", as: ProgramCoordinator, captures: { ss_v3: $.data.version } }
            - { call: "POST /registrations", payload: { session_id: "${ss}", participant_id: "${pc}", expected_class_session_version: "${ss_v3}" }, as: HouseholdManager, as_user_id: "${hc}", captures: { rc: $.data.id } }
          trigger:
