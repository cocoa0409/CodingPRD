  - rule_id: transitive_cascade
    instances:
      - name: effectiveness_pass_closes_finding_then_ledger_then_decision_then_risk
        depth: 4
        grounds:
          - state_machines.Nonconformity.RESPONSE_ACCEPTED_to_CLOSED
          - state_machines.AccreditationApplication.NC_OPEN_to_DECISION_PENDING
          - entities.DecisionRecord
          - calculations.organization_risk_score
        distinguishing_aspect: |
          Four strictly sequential hops, each one caused by the hop before it and none of them a
          fan-out of the trigger: (1) the finding moves RESPONSE_ACCEPTED -> CLOSED; (2) because it
          closed, the application's blocking ledger moves nc_blocking_open_count 1 -> 0 and
          nc_closed_count 0 -> 1; (3) because the blocking count reached zero, the application moves
          NC_OPEN -> DECISION_PENDING and a DecisionRecord is created for the current round;
          (4) because that DecisionRecord was created, the organization's risk_score is recomputed
          under the AT_DECISION variant. Removing hop 2 removes hops 3 and 4.
