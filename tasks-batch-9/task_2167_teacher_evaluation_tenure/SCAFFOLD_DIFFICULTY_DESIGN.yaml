          The Observation machine contains a genuine cycle: SCORED -> SUBMITTED -> RETURNED ->
          SCORED. The same row re-enters SCORED with return_count 1 and a recomputed
          weighted_score of 3.55, proving the loop is traversable rather than a forward-only
          pipeline.
