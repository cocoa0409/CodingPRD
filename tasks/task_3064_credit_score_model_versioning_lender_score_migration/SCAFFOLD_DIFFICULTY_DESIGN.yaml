          assert:
            - "data.wc2 == 699.91 — 294.00 + 231.66 + 174.25, each product rounded to 2 decimals before summing"
            - "data.uc2 == 699.66 — the mean 699.666666... truncated toward zero to 699.66 and then rounded"
            - "data.wc2 != data.uc2, so the two rounding orders are observably different"
            - "sum(0.42, 0.33, 0.25) == 1.00 only after rounding each weight product, which is why the unweighted variant is retained as the reconciliation baseline"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (>= 2, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: non_linear_state_machine_version_deprecation_revision_loop
        grounds:
          - state_machines.ScoreModel.DEPRECATED_to_RELEASED
          - state_machines.ScoreModel.RELEASED_to_DEPRECATED
          - state_machines.ScoreModel.DEVELOPMENT_to_RELEASED
          - state_machines.ValidationStudy.BLOCKED_to_SCHEDULED
        distinguishing_aspect: |
          The ScoreModel machine is cyclic: a version that is already DEPRECATED
          returns to RELEASED through POST /score-models/{modelId}/reopen, and the
          same reopening call returns every BLOCKED study on that model to
          SCHEDULED. The cycle is not decorative — the deprecated version's
          released_at is refreshed and its licenses are still suspended, so the
          closed loop is observably unlike a linear pipeline.
        test_recipe:
          setup:
            - "Release M1 (CREDIT-DUAL-V1) with one released AUTO variant (weight 0.42, ref_score 700, base_odds 18.0, double_odds_points 35, segment_width 60, segment_offsets [0, 10, -6], rounding_penalty_pct 0.02, cutoff_baseline 700, elongation_points 700) and a FILED MODEL_RISK_REPORT."
            - "One VALIDATION-kind archive sample for M1 with record_count 5000."
            - "One CROSS_BUREAU study on M1 in status SCHEDULED."
            - "No ACTIVE license on M1's variants, so the deprecation gate passes."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1_auto: $.data.id}}
            - {call: "POST /score-variants/${v1_auto}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m1}", doc_type: "MODEL_RISK_REPORT", required_version_label: "CREDIT-DUAL-V1"}, as: ComplianceOfficer, captures: {md1: $.data.id, md1_v: $.data.version}}
            - {call: "POST /model-documentation/${md1}/file", payload: {expected_documentation_version: "${md1_v}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1_v: $.data.version}}
            - {call: "POST /score-models/${m1}/release", payload: {expected_model_version: "${m1_v}"}, as: ModelDeveloper}
            - {call: "POST /archive-samples", payload: {score_model_id: "${m1}", sample_ref: "DEV-01", record_count: 5000, segment_name: "PRIME", sample_kind: "VALIDATION", observation_window_months: 24, window_start_month: "2024-01", window_end_month: "2026-01"}, as: ValidationAnalyst, captures: {s1: $.data.id}}
            - {call: "POST /validation-studies", payload: {score_model_id: "${m1}", sample_id: "${s1}", study_path: "CROSS_BUREAU", performed_by: "va-001"}, as: ValidationAnalyst, captures: {study: $.data.id}}
            - {call: "GET /score-models/${m1}", payload: {}, as: ComplianceOfficer, captures: {m1_v2: $.data.version}}
            - {call: "POST /score-models/${m1}/deprecate", payload: {expected_model_version: "${m1_v2}"}, as: ComplianceOfficer, captures: {dep: $.data.status, dep_released_at: $.data.released_at}}
            - {call: "POST /score-variants/${v1_auto}/recall", payload: {}, as: ModelDeveloper}
          trigger:
            - {call: "GET /score-models/${m1}", payload: {}, as: ComplianceOfficer, captures: {m1_v3: $.data.version}}
            - {call: "POST /score-models/${m1}/reopen", payload: {expected_model_version: "${m1_v3}"}, as: ComplianceOfficer, captures: {reopened_status: $.data.status, reopened_released_at: $.data.released_at}}
            - {call: "GET /validation-studies/${study}", payload: {}, as: ValidationAnalyst, captures: {study_status: $.data.status}}
          assert:
            - "data.dep == \"DEPRECATED\""
            - "data.reopened_status == \"RELEASED\" — the DEPRECATED → RELEASED cycle edge fired"
            - "data.reopened_released_at != data.dep_released_at — the reopening is a fresh release event"
            - "data.study_status == \"SCHEDULED\" — the recall of the last active variant had moved it to BLOCKED, and the reopen returned it"

      - name: non_linear_state_machine_reason_code_archive_cycle
        grounds:
          - state_machines.ReasonCode.ACTIVE_to_ARCHIVED
          - state_machines.ReasonCode.ARCHIVED_to_ACTIVE
          - state_machines.ReferenceSet.BOUND_to_RECONCILED
          - state_machines.ReferenceSet.COMPILED_to_BOUND
        distinguishing_aspect: |
          The ReasonCode machine is cyclic — ACTIVE → ARCHIVED → ACTIVE through
          restore — and the reverse edge is guarded by a state-dependent
          precondition the forward edge needs on its own reversal (the archived
          node's composite_code must be free again, and an archived parent blocks
          the restore), so the cycle's re-entry is conditional rather than a
          symmetric undo.
        test_recipe:
          setup:
            - "Release M1 with a released AUTO variant (weight 0.42, curve ref_score 700 / base_odds 18.0 / double_odds_points 35, cutoff_baseline 700) and a FILED MODEL_RISK_REPORT."
            - "Two reason codes on that variant: root 'DUAL-DECISION' SECONDARY with parent null, and child 'UNDECIDED-ESCALATED' TERTIARY with parent the root; the child's own composite_code is '<version_label>-<industry>-UNDECIDED-ESCALATED-TERTIARY'."
            - "The child is ACTIVE, so the root cannot yet be archived."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1_auto: $.data.id}}
            - {call: "POST /score-variants/${v1_auto}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /reason-codes", payload: {score_variant_id: "${v1_auto}", depth_tier: "SECONDARY", trigger_feature_code: "DUAL-DECISION", code_label: "root-dual-decision", weight_pct: 0.20}, as: ReasonCodeAdministrator, captures: {rc_root: $.data.id, rc_root_composite: $.data.composite_code}}
            - {call: "POST /reason-codes", payload: {score_variant_id: "${v1_auto}", depth_tier: "TERTIARY", trigger_feature_code: "UNDECIDED-ESCALATED", code_label: "child-undecided", weight_pct: 0.03, parent_reason_code_id: "${rc_root}"}, as: ReasonCodeAdministrator, captures: {rc_child: $.data.id, rc_child_composite: $.data.composite_code}}
          trigger:
            - {call: "POST /reason-codes/${rc_child}/archive", payload: {}, as: ReasonCodeAdministrator, captures: {child_status: $.data.status, child_received: $.data.weight_received_pct}}
            - {call: "POST /reason-codes/${rc_root}/archive", payload: {}, as: ReasonCodeAdministrator, captures: {root_status: $.data.status}}
            - {call: "POST /reason-codes/${rc_child}/restore", payload: {}, as: ReasonCodeAdministrator, captures: {child_restored: $.data.status}}
          assert:
            - "the first trigger returns 200 with data.child_status == \"ARCHIVED\""
            - "data.root_status == \"ARCHIVED\" — the parent archived only after its last ACTIVE child had cycled out"
            - "data.child_restored == \"ACTIVE\" — the ARCHIVED → ACTIVE cycle edge fired"
            - "the root's weight_received_pct == 0.03 after the child's archive — the child's 0.03 routes up because it sits below the 0.05 floor — and it is still 0.03 after the child's restore, since restore re-derives only the restored node's own received share"
            - "archiving the root before archiving the child would have returned 409 ERR_REASON_CODE_ARCHIVED, so the cycle direction is enforced"

# ===========================================================================
  # Rule 4 — transitive_cascade (>= 2, different triggers; one >= 3, one >= 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: transitive_cascade_release_supersedes_licenses_and_drains_reference_sets
        grounds:
          - state_machines.ScoreModel.DEVELOPMENT_to_RELEASED
          - state_machines.ScoreModel.RELEASED_to_SUPERSEDED
          - state_machines.License.ACTIVE_to_SUSPENDED
          - state_machines.ReferenceSet.COMPILED_to_BOUND
        distinguishing_aspect: |
          Depth 3 from one release: releasing M2 mutates M1 (hop 1, M1 →
          SUPERSEDED); that mutation on M1 is what suspends M1's ACTIVE license
          (hop 2); and that suspension is what reconciles the bound reference set
          (hop 3). The third hop is caused by the second — nothing in the release
          payload names a reference set.
        test_recipe:
          setup:
            - "Release M1 (CREDIT-DUAL-V1) with a released AUTO variant (weight 0.42, curve ref_score 700 / base_odds 18.0 / double_odds_points 35, segment_width 60, segment_offsets [0, 10, -6], rounding_penalty_pct 0.02, cutoff_baseline 700) and a FILED MODEL_RISK_REPORT."
            - "Lender LEND-NORTH holds one ACTIVE license on that variant; consumer 'cons-401' has a BOUND reference set on M1 carrying one settled posting."
            - "M2 (PRIME-SHIFT-V2) sits in DEVELOPMENT with a released AUTO variant, a FILED MODEL_RISK_REPORT, and predecessor_model_id pointing at M1."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1_auto: $.data.id}}
            - {call: "POST /score-variants/${v1_auto}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m1}", doc_type: "MODEL_RISK_REPORT", required_version_label: "CREDIT-DUAL-V1"}, as: ComplianceOfficer, captures: {md1: $.data.id, md1_v: $.data.version}}
            - {call: "POST /model-documentation/${md1}/file", payload: {expected_documentation_version: "${md1_v}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1_v: $.data.version}}
            - {call: "POST /score-models/${m1}/release", payload: {expected_model_version: "${m1_v}"}, as: ModelDeveloper}
            - {call: "POST /consumers", payload: {consumer_ref: "cons-401", age_years: 47, is_protected_class: false}, as: FairLendingOfficer, captures: {c401: $.data.id}}
            - {call: "POST /reference-sets", payload: {consumer_id: "${c401}", score_model_id: "${m1}"}, as: FairLendingOfficer, captures: {rs1: $.data.id}}
            - {call: "POST /reason-codes", payload: {score_variant_id: "${v1_auto}", depth_tier: "PRIMARY", trigger_feature_code: "SEGMENT_ZERO", code_label: "rc-seg-zero", weight_pct: 0.30}, as: ReasonCodeAdministrator, captures: {rc1: $.data.id}}
            - {call: "POST /licenses", payload: {lender_name: "North Bank", lender_code: "LEND-NORTH", score_variant_id: "${v1_auto}", volume_tier: "VOLUME_TIER_1", entitled_count: 500, window_start_month: "2026-01", window_end_month: "2027-01"}, as: ComplianceOfficer, captures: {lic: $.data.id}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ComplianceOfficer, captures: {lic_v: $.data.version}}
            - {call: "POST /licenses/${lic}/activate", payload: {expected_license_version: "${lic_v}"}, as: ComplianceOfficer}
            - {call: "GET /licenses/${lic}", payload: {}, as: ScoreConsumer, as_user_id: "${lic}", captures: {lic_v2: $.data.version}}
            - {call: "POST /score-results", payload: {consumer_id: "${c401}", score_variant_id: "${v1_auto}", bureau_id: "${b_tuc}", license_id: "${lic}", raw_posted_score: 715, expected_license_version: "${lic_v2}"}, as: ScoreConsumer, as_user_id: "${lic}"}
            - {call: "GET /reference-sets/${rs1}", payload: {}, as: FairLendingOfficer, captures: {rs1_v: $.data.version}}
            - {call: "POST /reference-sets/${rs1}/attach-reason-code", payload: {reason_code_id: "${rc1}", expected_reference_set_version: "${rs1_v}"}, as: FairLendingOfficer}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "PRIME-SHIFT-V2", predecessor_model_id: "${m1}", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m2: $.data.id}}
            - {call: "POST /score-models/${m2}/variants", payload: {industry: "AUTO", ref_score: 680, base_odds: 20.0, double_odds_points: 40, segment_width: 60, segment_offsets: [0, 6, -4], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 680, cutoff_baseline: 660}, as: ModelDeveloper, captures: {v2_auto: $.data.id}}
            - {call: "POST /score-variants/${v2_auto}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m2}", doc_type: "MODEL_RISK_REPORT", required_version_label: "PRIME-SHIFT-V2"}, as: ComplianceOfficer, captures: {md2: $.data.id, md2_v: $.data.version}}
            - {call: "POST /model-documentation/${md2}/file", payload: {expected_documentation_version: "${md2_v}"}, as: ComplianceOfficer}
          trigger:
            - {call: "GET /score-models/${m2}", payload: {}, as: ModelDeveloper, captures: {m2_v: $.data.version}}
            - {call: "POST /score-models/${m2}/release", payload: {expected_model_version: "${m2_v}"}, as: ModelDeveloper}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1_status: $.data.status}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ComplianceOfficer, captures: {lic_status: $.data.status}}
            - {call: "GET /reference-sets/${rs1}", payload: {}, as: FairLendingOfficer, captures: {rs_status: $.data.status, rs_rc: $.data.reason_code_id}}
          assert:
            - "ScoreModel.${m1}.status == \"SUPERSEDED\" with a non-null retired_at — hop 1, caused by the release of M2"
            - "License.${lic}.status == \"SUSPENDED\" — hop 2, caused by hop 1's mutation of M1 rather than by the release call"
            - "ReferenceSet.${rs1}.status == \"RECONCILED\" and reason_code_id is null — hop 3, caused by hop 2's suspension of the only license that had settled the set's postings"
            - "ScoreModel.${m2}.status == \"RELEASED\" and ScoreModel.${m2}.cascade_depth == 1"

      - name: cascade_c10_archive_reconciles_sets_and_resets_decisions
        grounds:
          - state_machines.ReasonCode.ACTIVE_to_ARCHIVED
          - validations[priority=18]
          - entities.Consumer.fields.model_undecided_count
          - entities.ScoreResult.fields.decision
        distinguishing_aspect: |
          Depth 2 with a threshold gate that only fires on a second trigger: the
          archive of the toggle node reconciles the transaction capture (hop 1),
          which is what returns both still-UNDECIDED postings on that set to
          decision-recomputable state (hop 2). Only after the second archive does the
          consumer reach 3 undecided postings, so the escalation to DECLINE with a
          bound reason code is a consequence of hop 2 plus a prior archive, not of
          either archive alone.
        test_recipe:
          setup:
            - "Release M1 with a released AUTO variant (weight 0.42, curve ref_score 700 / base_odds 18.0 / double_odds_points 35, segment_width 60, segment_offsets [0, 10, -6], rounding_penalty_pct 0.02, cutoff_baseline 700) and a FILED MODEL_RISK_REPORT."
            - "Three ACTIVE reason codes on that variant: PRIMARY 'SEGMENT_ZERO' weight 0.30; PRIMARY 'CUTOFF_EDGE' weight 0.20; SECONDARY 'TOGGLE_A' weight 0.03."
            - "An ACTIVE license LEND-NORTH on the variant; four transactions settled on it."
            - "Two reference sets covering the undecided postings, both BOUND to TOGGLE_A through two attaches."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1_auto: $.data.id}}
            - {call: "POST /score-variants/${v1_auto}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m1}", doc_type: "MODEL_RISK_REPORT", required_version_label: "CREDIT-DUAL-V1"}, as: ComplianceOfficer, captures: {md1: $.data.id, md1_v: $.data.version}}
            - {call: "POST /model-documentation/${md1}/file", payload: {expected_documentation_version: "${md1_v}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1_v: $.data.version}}
            - {call: "POST /score-models/${m1}/release", payload: {expected_model_version: "${m1_v}"}, as: ModelDeveloper}
            - {call: "POST /reason-codes", payload: {score_variant_id: "${v1_auto}", depth_tier: "PRIMARY", trigger_feature_code: "SEGMENT_ZERO", code_label: "rc-seg-zero", weight_pct: 0.30}, as: ReasonCodeAdministrator, captures: {rc_seg: $.data.id}}
            - {call: "POST /reason-codes", payload: {score_variant_id: "${v1_auto}", depth_tier: "PRIMARY", trigger_feature_code: "CUTOFF_EDGE", code_label: "rc-cutoff-edge", weight_pct: 0.20}, as: ReasonCodeAdministrator, captures: {rc_edge: $.data.id}}
            - {call: "POST /reason-codes", payload: {score_variant_id: "${v1_auto}", depth_tier: "SECONDARY", trigger_feature_code: "TOGGLE_A", code_label: "rc-toggle-a", weight_pct: 0.03}, as: ReasonCodeAdministrator, captures: {rc_tog: $.data.id}}
            - {call: "POST /consumers", payload: {consumer_ref: "cons-502", age_years: 36, is_protected_class: true}, as: FairLendingOfficer, captures: {c502: $.data.id}}
            - {call: "POST /licenses", payload: {lender_name: "North Bank", lender_code: "LEND-NORTH", score_variant_id: "${v1_auto}", volume_tier: "VOLUME_TIER_1", entitled_count: 500, window_start_month: "2026-01", window_end_month: "2027-01"}, as: ComplianceOfficer, captures: {lic: $.data.id}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ComplianceOfficer, captures: {lic_v: $.data.version}}
            - {call: "POST /licenses/${lic}/activate", payload: {expected_license_version: "${lic_v}"}, as: ComplianceOfficer}
            - {call: "POST /reference-sets", payload: {consumer_id: "${c502}", score_model_id: "${m1}"}, as: FairLendingOfficer, captures: {rs_a: $.data.id}}
            - {call: "POST /reference-sets", payload: {consumer_id: "${c502}", score_model_id: "${m1}"}, as: FairLendingOfficer, captures: {rs_b: $.data.id}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ScoreConsumer, as_user_id: "${lic}", captures: {lic_v2: $.data.version}}
            - {call: "POST /score-results", payload: {consumer_id: "${c502}", score_variant_id: "${v1_auto}", bureau_id: "${b_tuc}", license_id: "${lic}", raw_posted_score: 700, expected_license_version: "${lic_v2}"}, as: ScoreConsumer, as_user_id: "${lic}", captures: {sr1: $.data.id}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ScoreConsumer, as_user_id: "${lic}", captures: {lic_v3: $.data.version}}
            - {call: "POST /score-results", payload: {consumer_id: "${c502}", score_variant_id: "${v1_auto}", bureau_id: "${b_tuc}", license_id: "${lic}", raw_posted_score: 700, expected_license_version: "${lic_v3}"}, as: ScoreConsumer, as_user_id: "${lic}", captures: {sr2: $.data.id}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ScoreConsumer, as_user_id: "${lic}", captures: {lic_v4: $.data.version}}
            - {call: "POST /score-results", payload: {consumer_id: "${c502}", score_variant_id: "${v1_auto}", bureau_id: "${b_tuc}", license_id: "${lic}", raw_posted_score: 700, expected_license_version: "${lic_v4}"}, as: ScoreConsumer, as_user_id: "${lic}", captures: {sr3: $.data.id}}
            - {call: "POST /reference-sets/${rs_a}/attach-reason-code", payload: {reason_code_id: "${rc_tog}", expected_reference_set_version: "${rs_a_v}"}, as: FairLendingOfficer}
          trigger:
            - {call: "POST /reason-codes/${rc_tog}/archive", payload: {}, as: ReasonCodeAdministrator}
            - {call: "GET /consumers/${c502}", payload: {}, as: FairLendingOfficer, captures: {und_after_one: $.data.model_undecided_count}}
            - {call: "POST /reason-codes/${rc_tog}/restore", payload: {}, as: ReasonCodeAdministrator}
          assert:
            - "the archive returns 200 and pushes Consumer.${c502}.model_undecided_count to 3 — the reconciliation at hop 1 reset three postings to UNDECIDED and hop 2 recomputed the counter"
            - "those three postings moved to DECLINE with decision_reason_code_id bound to the lowest-composite-code ACTIVE PRIMARY code on the variant, which is '${m1_label}-AUTO-CUTOFF_EDGE-PRIMARY'"
            - "ScoreResult.${sr1}.decision == \"DECLINE\" && ScoreResult.${sr2}.decision == \"DECLINE\" && ScoreResult.${sr3}.decision == \"DECLINE\""
            - "the restore returns 200 and does not return any posting to UNDECIDED, because restore only reactivates the catalogue node and re-consumes the invariant-B snapshot"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (>= 2, different category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: priority_pair_reason_code_existence_beats_state_edge
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors.ERR_REASON_CODE_NOT_FOUND
          - errors.ERR_INVALID_STATE_MACHINE_EDGE
        distinguishing_aspect: |
          Category pair existence (priority 5) versus state (priority 6): an
          attach against a RECONCILED reference set that also names an unknown
          reason code returns 404 ERR_REASON_CODE_NOT_FOUND, not 409
          ERR_INVALID_STATE_MACHINE_EDGE. The second call keeps the same stale state
          but supplies a resolvable code, and only then does the state check win.
        test_recipe:
          setup:
            - "Release M1 with a released AUTO variant (weight 0.42, curve ref_score 700 / base_odds 18.0 / double_odds_points 35, cutoff_baseline 700) and a FILED MODEL_RISK_REPORT."
            - "One ACTIVE PRIMARY reason code; consumer 'cons-601' with a reference set on M1 that has been attached and then reconciled."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1_auto: $.data.id}}
            - {call: "POST /score-variants/${v1_auto}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m1}", doc_type: "MODEL_RISK_REPORT", required_version_label: "CREDIT-DUAL-V1"}, as: ComplianceOfficer, captures: {md1: $.data.id, md1_v: $.data.version}}
            - {call: "POST /model-documentation/${md1}/file", payload: {expected_documentation_version: "${md1_v}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1_v: $.data.version}}
            - {call: "POST /score-models/${m1}/release", payload: {expected_model_version: "${m1_v}"}, as: ModelDeveloper}
            - {call: "POST /reason-codes", payload: {score_variant_id: "${v1_auto}", depth_tier: "PRIMARY", trigger_feature_code: "SEGMENT_ZERO", code_label: "rc-seg", weight_pct: 0.30}, as: ReasonCodeAdministrator, captures: {rc_seg: $.data.id}}
            - {call: "POST /reason-codes", payload: {score_variant_id: "${v1_auto}", depth_tier: "SECONDARY", trigger_feature_code: "TOGGLE", code_label: "rc-toggle", weight_pct: 0.03}, as: ReasonCodeAdministrator, captures: {rc_tog: $.data.id}}
            - {call: "POST /consumers", payload: {consumer_ref: "cons-601", age_years: 41, is_protected_class: false}, as: FairLendingOfficer, captures: {c601: $.data.id}}
            - {call: "POST /reference-sets", payload: {consumer_id: "${c601}", score_model_id: "${m1}"}, as: FairLendingOfficer, captures: {rs1: $.data.id}}
            - {call: "GET /reference-sets/${rs1}", payload: {}, as: FairLendingOfficer, captures: {rs1_v: $.data.version}}
            - {call: "POST /reference-sets/${rs1}/attach-reason-code", payload: {reason_code_id: "${rc_tog}", expected_reference_set_version: "${rs1_v}"}, as: FairLendingOfficer}
            - {call: "POST /reason-codes/${rc_tog}/archive", payload: {}, as: ReasonCodeAdministrator}
            - {call: "GET /reference-sets/${rs1}", payload: {}, as: FairLendingOfficer, captures: {rs1_v2: $.data.version}}
            - {call: "POST /reference-sets/${rs1}/reconcile", payload: {expected_reference_set_version: "${rs1_v2}"}, as: FairLendingOfficer}
          trigger:
            - {call: "POST /reference-sets/${rs1}/attach-reason-code", payload: {reason_code_id: "0dc0ffee-1111-4222-8333-444455556666", expected_reference_set_version: "${rs1_v2}"}, as: FairLendingOfficer, captures: {err_first: $.data.error_id}}
            - {call: "POST /reference-sets/${rs1}/attach-reason-code", payload: {reason_code_id: "${rc_seg}", expected_reference_set_version: "${rs1_v2}"}, as: FairLendingOfficer, captures: {err_second: $.data.error_id}}
          assert:
            - "the first trigger returns 404 with data.err_first == \"ERR_REASON_CODE_NOT_FOUND\" — the existence check outranks the state check"
            - "the second trigger returns 409 with data.err_second == \"ERR_INVALID_STATE_MACHINE_EDGE\" — with a resolvable body the state check produces the error"
            - "ReferenceSet.${rs1}.status is still RECONCILED after both rejections and reason_code_id is still null"

      - name: priority_pair_model_superseded_beats_license_ownership
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - validations[priority=10]
          - errors.ERR_MODEL_SUPERSEDED
        distinguishing_aspect: |
          Category pair business_safety (priority 7) versus business_referential
          (priority 9): a posting that names a superseded variant AND a license held
          by another caller returns 409 ERR_MODEL_SUPERSEDED; the same posting
          against a live variant returns 403 ERR_LICENSE_NOT_OWNED. Contract-priced
          business_fiscal checks never run, because they are ordered last.
        test_recipe:
          setup:
            - "Release M1 (CREDIT-DUAL-V1) with a released AUTO variant (weight 0.42, curve ref_score 700 / base_odds 18.0 / double_odds_points 35, cutoff_baseline 700) and a FILED MODEL_RISK_REPORT; release M2 (PRIME-SHIFT-V2) naming M1 as predecessor so M1 becomes SUPERSEDED."
            - "Two ACTIVE licenses on the M2 AUTO variant: one held by LEND-NORTH with entitled_count 1, one held by LEND-SOUTH with entitled_count 500."
            - "Consumer 'cons-602' with no postings."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1_auto: $.data.id}}
            - {call: "POST /score-variants/${v1_auto}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m1}", doc_type: "MODEL_RISK_REPORT", required_version_label: "CREDIT-DUAL-V1"}, as: ComplianceOfficer, captures: {md1: $.data.id, md1_v: $.data.version}}
            - {call: "POST /model-documentation/${md1}/file", payload: {expected_documentation_version: "${md1_v}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1_v: $.data.version}}
            - {call: "POST /score-models/${m1}/release", payload: {expected_model_version: "${m1_v}"}, as: ModelDeveloper}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "PRIME-SHIFT-V2", predecessor_model_id: "${m1}", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m2: $.data.id}}
            - {call: "POST /score-models/${m2}/variants", payload: {industry: "AUTO", ref_score: 680, base_odds: 20.0, double_odds_points: 40, segment_width: 60, segment_offsets: [0, 6, -4], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 680, cutoff_baseline: 660}, as: ModelDeveloper, captures: {v2_auto: $.data.id}}
            - {call: "POST /score-variants/${v2_auto}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m2}", doc_type: "MODEL_RISK_REPORT", required_version_label: "PRIME-SHIFT-V2"}, as: ComplianceOfficer, captures: {md2: $.data.id, md2_v: $.data.version}}
            - {call: "POST /model-documentation/${md2}/file", payload: {expected_documentation_version: "${md2_v}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m2}", payload: {}, as: ModelDeveloper, captures: {m2_v: $.data.version}}
            - {call: "POST /score-models/${m2}/release", payload: {expected_model_version: "${m2_v}"}, as: ModelDeveloper}
            - {call: "POST /consumers", payload: {consumer_ref: "cons-602", age_years: 29, is_protected_class: false}, as: ModelDeveloper, captures: {c602: $.data.id}}
            - {call: "POST /licenses", payload: {lender_name: "North Bank", lender_code: "LEND-NORTH", score_variant_id: "${v2_auto}", volume_tier: "VOLUME_TIER_1", entitled_count: 1, window_start_month: "2026-01", window_end_month: "2027-01"}, as: ComplianceOfficer, captures: {lic_n: $.data.id}}
            - {call: "POST /licenses", payload: {lender_name: "South Bank", lender_code: "LEND-SOUTH", score_variant_id: "${v2_auto}", volume_tier: "VOLUME_TIER_1", entitled_count: 500, window_start_month: "2026-01", window_end_month: "2027-01"}, as: ComplianceOfficer, captures: {lic_s: $.data.id}}
            - {call: "GET /licenses/${lic_n}", payload: {}, as: ComplianceOfficer, captures: {lic_n_v: $.data.version}}
            - {call: "POST /licenses/${lic_n}/activate", payload: {expected_license_version: "${lic_n_v}"}, as: ComplianceOfficer}
            - {call: "GET /licenses/${lic_s}", payload: {}, as: ComplianceOfficer, captures: {lic_s_v: $.data.version}}
            - {call: "POST /licenses/${lic_s}/activate", payload: {expected_license_version: "${lic_s_v}"}, as: ComplianceOfficer}
            - {call: "GET /licenses/${lic_s}", payload: {}, as: ScoreConsumer, as_user_id: "${lic_n}", captures: {lic_s_v2: $.data.version}}
          trigger:
            - {call: "POST /score-results", payload: {consumer_id: "${c602}", score_variant_id: "${v1_auto}", bureau_id: "${b_tuc}", license_id: "${lic_s}", raw_posted_score: 700, expected_license_version: "${lic_s_v2}"}, as: ScoreConsumer, as_user_id: "${lic_n}", captures: {err_safety: $.data.error_id}}
            - {call: "POST /score-results", payload: {consumer_id: "${c602}", score_variant_id: "${v2_auto}", bureau_id: "${b_tuc}", license_id: "${lic_s}", raw_posted_score: 700, expected_license_version: "${lic_s_v2}"}, as: ScoreConsumer, as_user_id: "${lic_n}", captures: {err_referential: $.data.error_id}}
          assert:
            - "the first trigger returns 409 with data.err_safety == \"ERR_MODEL_SUPERSEDED\" — the safety check outranks both the ownership and the fiscal checks"
            - "the second trigger returns 403 with data.err_referential == \"ERR_LICENSE_NOT_OWNED\" — against a live version the ownership check produces the error"
            - "License.${lic_s}.cumulative_score_count == 0 after both rejections, so neither call settled a fee"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (>= 2, different metrics, distinct endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: boundary_cutoff_comparison_on_posted_score
        grounds:
          - entities.ScoreResult.fields.decision
          - entities.ScoreVariant.fields.cutoff_baseline
          - endpoints.POST_/score-results
        distinguishing_aspect: |
          A numeric threshold crossing on a single integer: 700 maps to exactly the
          AUTO cutoff_baseline, so the strict comparison `effective_score >
          cutoff_score` yields UNDECIDED rather than APPROVE, while 701 yields
          APPROVE and 699 yields DECLINE. The boundary is reached through
          POST /score-results and is the only place decision is written.
        test_recipe:
          setup:
            - "Release M1 with a released AUTO variant (weight 0.42, ref_score 700, base_odds 18.0, double_odds_points 35, segment_width 60, segment_offsets [0, 10, -6], rounding_penalty_pct 0.02, cutoff_baseline 700, elongation_points 700) and a FILED MODEL_RISK_REPORT."
            - "An ACTIVE license LEND-NORTH on that variant; consumer 'cons-701' with no postings."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1_auto: $.data.id}}
            - {call: "POST /score-variants/${v1_auto}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m1}", doc_type: "MODEL_RISK_REPORT", required_version_label: "CREDIT-DUAL-V1"}, as: ComplianceOfficer, captures: {md1: $.data.id, md1_v: $.data.version}}
            - {call: "POST /model-documentation/${md1}/file", payload: {expected_documentation_version: "${md1_v}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1_v: $.data.version}}
            - {call: "POST /score-models/${m1}/release", payload: {expected_model_version: "${m1_v}"}, as: ModelDeveloper}
            - {call: "POST /consumers", payload: {consumer_ref: "cons-701", age_years: 52, is_protected_class: false}, as: ModelDeveloper, captures: {c701: $.data.id}}
            - {call: "POST /licenses", payload: {lender_name: "North Bank", lender_code: "LEND-NORTH", score_variant_id: "${v1_auto}", volume_tier: "VOLUME_TIER_1", entitled_count: 500, window_start_month: "2026-01", window_end_month: "2027-01"}, as: ComplianceOfficer, captures: {lic: $.data.id}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ComplianceOfficer, captures: {lic_v: $.data.version}}
            - {call: "POST /licenses/${lic}/activate", payload: {expected_license_version: "${lic_v}"}, as: ComplianceOfficer}
          trigger:
            - {call: "GET /licenses/${lic}", payload: {}, as: ScoreConsumer, as_user_id: "${lic}", captures: {lic_v1: $.data.version}}
            - {call: "POST /score-results", payload: {consumer_id: "${c701}", score_variant_id: "${v1_auto}", bureau_id: "${b_tuc}", license_id: "${lic}", raw_posted_score: 715, expected_license_version: "${lic_v1}"}, as: ScoreConsumer, as_user_id: "${lic}", captures: {eff_equal: $.data.effective_score, dec_equal: $.data.decision}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ScoreConsumer, as_user_id: "${lic}", captures: {lic_v2: $.data.version}}
            - {call: "POST /score-results", payload: {consumer_id: "${c701}", score_variant_id: "${v1_auto}", bureau_id: "${b_tuc}", license_id: "${lic}", raw_posted_score: 716, expected_license_version: "${lic_v2}"}, as: ScoreConsumer, as_user_id: "${lic}", captures: {eff_above: $.data.effective_score, dec_above: $.data.decision}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ScoreConsumer, as_user_id: "${lic}", captures: {lic_v3: $.data.version}}
            - {call: "POST /score-results", payload: {consumer_id: "${c701}", score_variant_id: "${v1_auto}", bureau_id: "${b_tuc}", license_id: "${lic}", raw_posted_score: 714, expected_license_version: "${lic_v3}"}, as: ScoreConsumer, as_user_id: "${lic}", captures: {eff_below: $.data.effective_score, dec_below: $.data.decision}}
          assert:
            - "data.eff_equal == 700 and data.dec_equal == \"UNDECIDED\" — the score exactly on the cutoff is neither approved nor declined"
            - "data.eff_above == 701 and data.dec_above == \"APPROVE\""
            - "data.eff_below == 699 — raw 714 loses the same 15-point rounding penalty, so 699 is the highest score strictly below the cutoff"
            - "data.dec_below == \"DECLINE\" and the posting carries a bound decision_reason_code_id"

      - name: boundary_tier_crossing_at_exactly_ten_thousand
        grounds:
          - calculations.license_marginal_fee
          - endpoints.POST_/licenses/{licenseId}/fee-quotes
          - entities.License.fields.cumulative_score_count
        distinguishing_aspect: |
          An empty-band boundary rather than a value-boundary: units 0-9999 are
          charged at 18 cents and the very next unit at 14, so the quote at exactly
          10000 is 180000 while the quote at 10001 is 180014 — a 14-cent step over a
          one-unit change. The metric is a cumulative count reached through the
          fee-quote endpoint, not a score threshold.
        test_recipe:
          setup:
            - "One bureau TUC; release M1 with a released AUTO variant (weight 0.42, ref_score 700, base_odds 18.0, double_odds_points 35, segment_width 60, segment_offsets [0, 10, -6], rounding_penalty_pct 0.02, cutoff_baseline 700, elongation_points 700) and a FILED MODEL_RISK_REPORT."
            - "An ACTIVE license LEND-NORTH on that variant with entitled_count 20000 so the overage surcharge is out of the picture."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1_auto: $.data.id}}
            - {call: "POST /score-variants/${v1_auto}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m1}", doc_type: "MODEL_RISK_REPORT", required_version_label: "CREDIT-DUAL-V1"}, as: ComplianceOfficer, captures: {md1: $.data.id, md1_v: $.data.version}}
            - {call: "POST /model-documentation/${md1}/file", payload: {expected_documentation_version: "${md1_v}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1_v: $.data.version}}
            - {call: "POST /score-models/${m1}/release", payload: {expected_model_version: "${m1_v}"}, as: ModelDeveloper}
            - {call: "POST /licenses", payload: {lender_name: "North Bank", lender_code: "LEND-NORTH", score_variant_id: "${v1_auto}", volume_tier: "VOLUME_TIER_2", entitled_count: 20000, window_start_month: "2026-01", window_end_month: "2027-01"}, as: ComplianceOfficer, captures: {lic: $.data.id}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ComplianceOfficer, captures: {lic_v: $.data.version}}
            - {call: "POST /licenses/${lic}/activate", payload: {expected_license_version: "${lic_v}"}, as: ComplianceOfficer}
          trigger:
            - {call: "POST /licenses/${lic}/fee-quotes", payload: {prospective_count: 10000}, as: ComplianceOfficer, captures: {m10k: $.data.marginal_fee_cents, b10k: $.data.blended_fee_cents, t10k: $.data.tier_index}}
            - {call: "POST /licenses/${lic}/fee-quotes", payload: {prospective_count: 10001}, as: ComplianceOfficer, captures: {m10001: $.data.marginal_fee_cents, t10001: $.data.tier_index}}
            - {call: "POST /licenses/${lic}/fee-quotes", payload: {prospective_count: 9999}, as: ComplianceOfficer, captures: {m9999: $.data.marginal_fee_cents}}
          assert:
            - "data.m10k == 180000 and data.t10k == 0 — 10000 units sit wholly inside the first band"
            - "data.m10001 == 180014 — the single extra unit is charged at the second band's 14 cents, not 18"
            - "data.m9999 == 179982"
            - "License.${lic}.cumulative_score_count == 0, because the fee-quote endpoint is a read-only what-if that mutates nothing"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (>= 2, different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: cross_entity_license_activation_depends_on_model_state
        grounds:
          - state_machines.License.PENDING_to_ACTIVE
          - state_machines.ScoreModel.RELEASED_to_SUPERSEDED
          - state_machines.ScoreModel.DEPRECATED_to_RETIRED
          - errors.ERR_MODEL_RETIRED
        distinguishing_aspect: |
          The License → ScoreModel pair: a license activation is legal while the
          licensed model version is RELEASED or DEPRECATED but refused with
          ERR_MODEL_SUPERSEDED once the version has been superseded and with
          ERR_MODEL_RETIRED once it has retired. The dependency crosses a contract
          aggregate to a model-lifecycle aggregate, and no other rule in the
          scaffold crosses that pair.
        test_recipe:
          setup:
            - "Release M1 (CREDIT-DUAL-V1) with a released AUTO variant and a FILED MODEL_RISK_REPORT; release M2 (PRIME-SHIFT-V2) naming M1 as predecessor."
            - "Two PENDING licenses on the M1 AUTO variant, one named LEND-WEST and one named LEND-EAST, neither activated."
            - "M1 is SUPERSEDED after the M2 release, and a reference set on M1 is created so the retirement gate has work to do."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1_auto: $.data.id}}
            - {call: "POST /score-variants/${v1_auto}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m1}", doc_type: "MODEL_RISK_REPORT", required_version_label: "CREDIT-DUAL-V1"}, as: ComplianceOfficer, captures: {md1: $.data.id, md1_v: $.data.version}}
            - {call: "POST /model-documentation/${md1}/file", payload: {expected_documentation_version: "${md1_v}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1_v: $.data.version}}
            - {call: "POST /score-models/${m1}/release", payload: {expected_model_version: "${m1_v}"}, as: ModelDeveloper}
            - {call: "POST /licenses", payload: {lender_name: "West Bank", lender_code: "LEND-WEST", score_variant_id: "${v1_auto}", volume_tier: "VOLUME_TIER_1", entitled_count: 500, window_start_month: "2026-01", window_end_month: "2027-01"}, as: ComplianceOfficer, captures: {lic_w: $.data.id, lic_w_v: $.data.version}}
            - {call: "POST /licenses", payload: {lender_name: "East Bank", lender_code: "LEND-EAST", score_variant_id: "${v1_auto}", volume_tier: "VOLUME_TIER_1", entitled_count: 500, window_start_month: "2026-01", window_end_month: "2027-01"}, as: ComplianceOfficer, captures: {lic_e: $.data.id, lic_e_v: $.data.version}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "PRIME-SHIFT-V2", predecessor_model_id: "${m1}", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m2: $.data.id}}
            - {call: "POST /score-models/${m2}/variants", payload: {industry: "AUTO", ref_score: 680, base_odds: 20.0, double_odds_points: 40, segment_width: 60, segment_offsets: [0, 6, -4], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 680, cutoff_baseline: 660}, as: ModelDeveloper, captures: {v2_auto: $.data.id}}
            - {call: "POST /score-variants/${v2_auto}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m2}", doc_type: "MODEL_RISK_REPORT", required_version_label: "PRIME-SHIFT-V2"}, as: ComplianceOfficer, captures: {md2: $.data.id, md2_v: $.data.version}}
            - {call: "POST /model-documentation/${md2}/file", payload: {expected_documentation_version: "${md2_v}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m2}", payload: {}, as: ModelDeveloper, captures: {m2_v: $.data.version}}
            - {call: "POST /score-models/${m2}/release", payload: {expected_model_version: "${m2_v}"}, as: ModelDeveloper}
          trigger:
            - {call: "GET /licenses/${lic_w}", payload: {}, as: ComplianceOfficer, captures: {lic_w_v2: $.data.version}}
            - {call: "POST /licenses/${lic_w}/activate", payload: {expected_license_version: "${lic_w_v2}"}, as: ComplianceOfficer, captures: {err_superseded: $.data.error_id}}
            - {call: "GET /score-models/${m1}", payload: {}, as: ComplianceOfficer, captures: {m1_v2: $.data.version}}
            - {call: "POST /score-models/${m1}/retire", payload: {expected_model_version: "${m1_v2}"}, as: ComplianceOfficer, captures: {err_retire: $.data.error_id}}
          assert:
            - "the activate trigger returns 409 with data.err_superseded == \"ERR_MODEL_SUPERSEDED\" — the licence cannot enter ACTIVE against a superseded version"
            - "License.${lic_w}.status is still PENDING and License.${lic_e}.status is still PENDING"
            - "the retire trigger is refused because a reference set on M1 sits outside RECONCILED, so data.err_retire == \"ERR_RETIREMENT_BLOCKED\" and ScoreModel.${m1}.status is still SUPERSEDED"
            - "the same M1 activation gate refuses LEND-EAST identically, so License.${lic_e}.status is still PENDING and no license on a superseded version can reach ACTIVE"

      - name: cross_entity_reference_set_attach_depends_on_variant_and_code_state
        grounds:
          - state_machines.ReferenceSet.COMPILED_to_BOUND
          - state_machines.ReasonCode.ACTIVE_to_ARCHIVED
          - entities.ReasonCode.fields.status
          - errors.ERR_REASON_CODE_VARIANT_MISMATCH
        distinguishing_aspect: |
          The ReferenceSet → (ScoreModel, ReasonCode) pair: a COMPILED set may only
          bind a code that is ACTIVE and that belongs to a variant of the set's own
          model, so the legal transition depends on the state of two distinct
          entities at once. Archiving the code drives a bound set to RECONCILED, and
          the archived code then becomes unusable both for re-binding and for a fresh
          attach.
        test_recipe:
          setup:
            - "Release M1 (CREDIT-DUAL-V1) with a released AUTO variant and a released BANKCARD variant, plus a FILED MODEL_RISK_REPORT; release M9 (VANTAGE-STYLE-V1) in family VANTAGE_STYLE with a released AUTO variant and a FILED MODEL_RISK_REPORT."
            - "One ACTIVE PRIMARY reason code on the M1 AUTO variant and one ACTIVE PRIMARY reason code on the M9 AUTO variant."
            - "Consumer 'cons-801' with a COMPILED reference set on M1 and a COMPILED reference set on M9."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1_auto: $.data.id}}
            - {call: "POST /score-variants/${v1_auto}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m1}", doc_type: "MODEL_RISK_REPORT", required_version_label: "CREDIT-DUAL-V1"}, as: ComplianceOfficer, captures: {md1: $.data.id, md1_v: $.data.version}}
            - {call: "POST /model-documentation/${md1}/file", payload: {expected_documentation_version: "${md1_v}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1_v: $.data.version}}
            - {call: "POST /score-models/${m1}/release", payload: {expected_model_version: "${m1_v}"}, as: ModelDeveloper}
            - {call: "POST /score-models", payload: {family_code: "VANTAGE_STYLE", version_label: "VANTAGE-STYLE-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m9: $.data.id}}
            - {call: "POST /score-models/${m9}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v9_auto: $.data.id}}
            - {call: "POST /score-variants/${v9_auto}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m9}", doc_type: "MODEL_RISK_REPORT", required_version_label: "VANTAGE-STYLE-V1"}, as: ComplianceOfficer, captures: {md9: $.data.id, md9_v: $.data.version}}
            - {call: "POST /model-documentation/${md9}/file", payload: {expected_documentation_version: "${md9_v}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m9}", payload: {}, as: ModelDeveloper, captures: {m9_v: $.data.version}}
            - {call: "POST /score-models/${m9}/release", payload: {expected_model_version: "${m9_v}"}, as: ModelDeveloper}
            - {call: "POST /reason-codes", payload: {score_variant_id: "${v1_auto}", depth_tier: "PRIMARY", trigger_feature_code: "SEGMENT_ZERO", code_label: "rc-m1-auto", weight_pct: 0.30}, as: ReasonCodeAdministrator, captures: {rc_m1: $.data.id}}
            - {call: "POST /reason-codes", payload: {score_variant_id: "${v9_auto}", depth_tier: "PRIMARY", trigger_feature_code: "SEGMENT_ZERO", code_label: "rc-m9-auto", weight_pct: 0.30}, as: ReasonCodeAdministrator, captures: {rc_m9: $.data.id}}
            - {call: "POST /consumers", payload: {consumer_ref: "cons-801", age_years: 44, is_protected_class: false}, as: FairLendingOfficer, captures: {c801: $.data.id}}
            - {call: "POST /reference-sets", payload: {consumer_id: "${c801}", score_model_id: "${m1}"}, as: FairLendingOfficer, captures: {rs1: $.data.id}}
            - {call: "POST /reference-sets", payload: {consumer_id: "${c801}", score_model_id: "${m9}"}, as: FairLendingOfficer, captures: {rs9: $.data.id}}
          trigger:
            - {call: "POST /reference-sets/${rs1}/attach-reason-code", payload: {reason_code_id: "${rc_m9}", expected_reference_set_version: "${rs1_v}"}, as: FairLendingOfficer, captures: {err_mismatch: $.data.error_id}}
            - {call: "POST /reference-sets/${rs1}/attach-reason-code", payload: {reason_code_id: "${rc_m1}", expected_reference_set_version: "${rs1_v}"}, as: FairLendingOfficer, captures: {ok_status: $.data.status}}
            - {call: "POST /reason-codes/${rc_m1}/archive", payload: {}, as: ReasonCodeAdministrator}
          assert:
            - "the first trigger returns 409 with data.err_mismatch == \"ERR_REASON_CODE_VARIANT_MISMATCH\" — the code belongs to M9's auto variant, not to the set's M1 model"
            - "the second trigger returns 200 with data.ok_status == \"BOUND\""
            - "archiving the bound code drives ReferenceSet.${rs1}.status to \"RECONCILED\" (the ReasonCode → ReferenceSet dependency) while ReferenceSet.${rs9}.status stays \"COMPILED\""
            - "GET /reference-sets?reason_code_id=${rc_m1} returns an empty array after the archive, because the set's reason_code_id is cleared on reconcile"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (>= 2, different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: overlap_archive_sample_containment_tolerant_windows
        grounds:
          - validations[priority=13]
          - entities.ArchiveSample.fields.window_start_month
          - entities.ArchiveSample.fields.window_end_month
          - errors.ERR_SAMPLE_WINDOW_OVERLAP
        distinguishing_aspect: |
          Containment-tolerant semantics: a window wholly containable in an existing
          draw is rejected as overlap, so a nested draw is illegal; but an identical
          sample_ref with an identical window is accepted as an idempotent undo of
          the duplicate, and a window that merely shares an endpoint month is
          measured on exclusive ends. Contrast with the half-open licence rule, which
          permits touching terms.
        test_recipe:
          setup:
            - "Release M1 with a released AUTO variant and a FILED MODEL_RISK_REPORT so samples may be drawn."
            - "One existing DEVELOPMENT sample 'DEV-A' on M1 covering [2024-01, 2026-01)."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1_auto: $.data.id}}
            - {call: "POST /score-variants/${v1_auto}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /archive-samples", payload: {score_model_id: "${m1}", sample_ref: "DEV-A", record_count: 8000, segment_name: "PRIME", sample_kind: "DEVELOPMENT", observation_window_months: 24, window_start_month: "2024-01", window_end_month: "2026-01"}, as: ModelDeveloper, captures: {s_a: $.data.id}}
          trigger:
            - {call: "POST /archive-samples", payload: {score_model_id: "${m1}", sample_ref: "DEV-B", record_count: 4000, segment_name: "NEAR_PRIME", sample_kind: "DEVELOPMENT", observation_window_months: 12, window_start_month: "2024-06", window_end_month: "2025-06"}, as: ModelDeveloper, captures: {err_nested: $.data.error_id}}
            - {call: "POST /archive-samples", payload: {score_model_id: "${m1}", sample_ref: "DEV-A", record_count: 8000, segment_name: "PRIME", sample_kind: "DEVELOPMENT", observation_window_months: 24, window_start_month: "2024-01", window_end_month: "2026-01"}, as: ModelDeveloper, captures: {undo_id: $.data.id}}
            - {call: "POST /archive-samples", payload: {score_model_id: "${m1}", sample_ref: "DEV-C", record_count: 6000, segment_name: "SUBPRIME", sample_kind: "DEVELOPMENT", observation_window_months: 24, window_start_month: "2026-01", window_end_month: "2028-01"}, as: ModelDeveloper, captures: {ok_c: $.data.id}}
          assert:
            - "the nested draw returns 409 with data.err_nested == \"ERR_SAMPLE_WINDOW_OVERLAP\" — a window wholly inside DEV-A is refused"
            - "the re-asserted draw returns 201 with data.undo_id == the id of the existing DEV-A sample, giving containment-tolerant semantics an explicit idempotent escape"
            - "touching at 2026-01 is accepted with a non-null id, because an exclusive end month means [2024-01, 2026-01) and [2026-01, 2028-01) share no month"
            - "GET /archive-samples?score_model_id=${m1} returns exactly two samples"

      - name: overlap_license_half_open_terms_on_one_variant
        grounds:
          - validations[priority=13]
          - entities.License.fields.window_start_month
          - entities.License.fields.window_end_month
          - errors.ERR_LICENSE_WINDOW_CONFLICT
        distinguishing_aspect: |
          Half-open semantics for licence terms: an intervening month is always
          illegal and two terms that touch at one boundary are legal, so the
          geometric treatment is the opposite failure boundary from the
          containment-tolerant sample rule. The resource is the License on a single
          variant, and the distinctness test is a one-month intervention at
          [2026-02, 2026-03), which the sample rule would have tolerated.
        test_recipe:
          setup:
            - "Release M1 with a released AUTO variant and a FILED MODEL_RISK_REPORT; one ACTIVE license LEND-NORTH on that variant covering [2026-01, 2027-01), and one PENDING license LEND-SOUTH on the same variant covering [2026-01, 2027-01)."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1_auto: $.data.id}}
            - {call: "POST /score-variants/${v1_auto}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m1}", doc_type: "MODEL_RISK_REPORT", required_version_label: "CREDIT-DUAL-V1"}, as: ComplianceOfficer, captures: {md1: $.data.id, md1_v: $.data.version}}
            - {call: "POST /model-documentation/${md1}/file", payload: {expected_documentation_version: "${md1_v}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1_v: $.data.version}}
            - {call: "POST /score-models/${m1}/release", payload: {expected_model_version: "${m1_v}"}, as: ModelDeveloper}
            - {call: "POST /licenses", payload: {lender_name: "North Bank", lender_code: "LEND-NORTH", score_variant_id: "${v1_auto}", volume_tier: "VOLUME_TIER_1", entitled_count: 500, window_start_month: "2026-01", window_end_month: "2027-01"}, as: ComplianceOfficer, captures: {lic_n: $.data.id}}
            - {call: "POST /licenses", payload: {lender_name: "South Bank", lender_code: "LEND-SOUTH", score_variant_id: "${v1_auto}", volume_tier: "VOLUME_TIER_1", entitled_count: 500, window_start_month: "2026-01", window_end_month: "2027-01"}, as: ComplianceOfficer, captures: {lic_s: $.data.id}}
            - {call: "GET /licenses/${lic_n}", payload: {}, as: ComplianceOfficer, captures: {lic_n_v: $.data.version}}
            - {call: "POST /licenses/${lic_n}/activate", payload: {expected_license_version: "${lic_n_v}"}, as: ComplianceOfficer}
          trigger:
            - {call: "POST /licenses", payload: {lender_name: "North Bank", lender_code: "LEND-NORTH", score_variant_id: "${v1_auto}", volume_tier: "VOLUME_TIER_1", entitled_count: 500, window_start_month: "2026-06", window_end_month: "2026-07"}, as: ComplianceOfficer, captures: {err_overlap: $.data.error_id}}
            - {call: "POST /licenses", payload: {lender_name: "North Bank", lender_code: "LEND-NORTH", score_variant_id: "${v1_auto}", volume_tier: "VOLUME_TIER_1", entitled_count: 500, window_start_month: "2027-01", window_end_month: "2028-01"}, as: ComplianceOfficer, captures: {ok_touch: $.data.id, ok_touch_st: $.data.status}}
            - {call: "POST /licenses", payload: {lender_name: "South Bank", lender_code: "LEND-SOUTH", score_variant_id: "${v1_auto}", volume_tier: "VOLUME_TIER_2", entitled_count: 500, window_start_month: "2026-02", window_end_month: "2026-03"}, as: ComplianceOfficer, captures: {ok_other_party: $.data.id}}
          assert:
            - "the one-month intervention returns 409 with data.err_overlap == \"ERR_LICENSE_WINDOW_CONFLICT\" — a term inside an active term is refused"
            - "touching at 2027-01 returns 201 with non-null data.ok_touch and data.ok_touch_st == \"PENDING\", because exclusive ends mean the two terms share no month"
            - "a distinct lender_code may open a term inside the first lender's window, so data.ok_other_party is non-null — the conflict is keyed on the lender and variant, not on the variant alone"
            - "GET /licenses?score_variant_id=${v1_auto} returns four rows"

  # ===========================================================================
  # Rule 9 — compensating_invariant (>= 2, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: invariant_fee_ledger_conserved_across_void
        grounds:
          - calculations.invariant_bookkeeping
          - calculations.license_marginal_fee
          - endpoints.POST_/score-results/{scoreResultId}/void
          - entities.License.fields.cumulative_fee_cents
        distinguishing_aspect: |
          Conserved quantity: a per-license fee balance in cents. For every license
          reached by the void, the product lambda * (P - B) is exactly 0, where B and
          P bracket the original settlement and lambda is read after the reversal —
          the reversal cancels the settled marginal charge to the cent regardless of
          which pricing band the posting landed in.
        test_recipe:
          setup:
            - "Release M1 with a released AUTO variant (weight 0.42, ref_score 700, base_odds 18.0, double_odds_points 35, segment_width 60, segment_offsets [0, 10, -6], rounding_penalty_pct 0.02, cutoff_baseline 700, elongation_points 700) and a FILED MODEL_RISK_REPORT."
            - "An ACTIVE license LEND-NORTH with entitled_count 500; consumer 'cons-901'."
            - "Two settled postings on that license: the first at cumulative_score_count 0 -> B equals cumulative_fee_cents before it settled, P equals the value after it settled."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1_auto: $.data.id}}
            - {call: "POST /score-variants/${v1_auto}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m1}", doc_type: "MODEL_RISK_REPORT", required_version_label: "CREDIT-DUAL-V1"}, as: ComplianceOfficer, captures: {md1: $.data.id, md1_v: $.data.version}}
            - {call: "POST /model-documentation/${md1}/file", payload: {expected_documentation_version: "${md1_v}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1_v: $.data.version}}
            - {call: "POST /score-models/${m1}/release", payload: {expected_model_version: "${m1_v}"}, as: ModelDeveloper}
            - {call: "POST /consumers", payload: {consumer_ref: "cons-901", age_years: 44, is_protected_class: false}, as: ModelDeveloper, captures: {c901: $.data.id}}
            - {call: "POST /licenses", payload: {lender_name: "North Bank", lender_code: "LEND-NORTH", score_variant_id: "${v1_auto}", volume_tier: "VOLUME_TIER_1", entitled_count: 500, window_start_month: "2026-01", window_end_month: "2027-01"}, as: ComplianceOfficer, captures: {lic: $.data.id}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ComplianceOfficer, captures: {lic_v: $.data.version}}
            - {call: "POST /licenses/${lic}/activate", payload: {expected_license_version: "${lic_v}"}, as: ComplianceOfficer}
          trigger:
            - {call: "GET /licenses/${lic}", payload: {}, as: ScoreConsumer, as_user_id: "${lic}", captures: {lic_b: $.data.version, fee_b: $.data.cumulative_fee_cents}}
            - {call: "POST /score-results", payload: {consumer_id: "${c901}", score_variant_id: "${v1_auto}", bureau_id: "${b_tuc}", license_id: "${lic}", raw_posted_score: 715, expected_license_version: "${lic_b}"}, as: ScoreConsumer, as_user_id: "${lic}", captures: {sr1: $.data.id}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ComplianceOfficer, captures: {lic_p: $.data.version, fee_p: $.data.cumulative_fee_cents}}
            - {call: "POST /score-results/${sr1}/void", payload: {expected_license_version: "${lic_p}"}, as: ComplianceOfficer, captures: {lic_l: $.data.license_id}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ComplianceOfficer, captures: {fee_lambda: $.data.cumulative_fee_cents, cnt_lambda: $.data.cumulative_score_count}}
            - {call: "GET /fee-ledger-entries?license_id=${lic}", payload: {}, as: ComplianceOfficer}
          assert:
            - "License.${lic}.cumulative_fee_cents B before the posting == 0 and P after it == 18"
            - "License.${lic}.cumulative_fee_cents lambda after the void == 0, so lambda * (P - B) == 0 exactly for this license"
            - "License.${lic}.cumulative_score_count == 0 and the licence still holds its original cumulative_score_count of 0, matching the frozen B"
            - "GET /fee-ledger-entries?license_id=${lic} returns exactly two rows — one MARGINAL_PRICING at 18 cents and one VOID_REVERSAL at -18 cents"
            - "POST /score-results/{id}/void on an already-voided posting returns 409 ERR_INVALID_STATE_MACHINE_EDGE and leaves lambda * (P - B) == 0"

      - name: invariant_migration_credit_conserved_across_void
        grounds:
          - calculations.migration_window_ratio
          - calculations.invariant_bookkeeping
          - endpoints.POST_/migration-events/{migrationEventId}/void
          - entities.License.fields.window_credited_delta_bps
        distinguishing_aspect: |
          Conserved quantity: a licence's migration-anchor credit, a different kind
          of conserved quantity from the fee balance. The invariant is stated as a
          product-with-xor, xor(ratio_before_anchor - ratio_after_void, 0), which is
          0 only when the void restores the pre-anchor window ratio exactly; a
          partially re-consumed credit leaves the product non-zero.
        test_recipe:
          setup:
            - "Release M1 (CREDIT-DUAL-V1) with a released AUTO variant (weight 0.42, ref_score 700, base_odds 18.0, double_odds_points 35, segment_width 60, segment_offsets [0, 10, -6], rounding_penalty_pct 0.02, cutoff_baseline 700, elongation_points 700) and a FILED MODEL_RISK_REPORT."
            - "M2 (PRIME-SHIFT-V2) in DEVELOPMENT with a released AUTO variant whose ref_score is 680, so the credited delta is -20 basis points on the RECALIBRATED path."
            - "An ACTIVE license LEND-NORTH on the M1 variant with entitled_count 500; consumer 'cons-902'."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1_auto: $.data.id}}
            - {call: "POST /score-variants/${v1_auto}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m1}", doc_type: "MODEL_RISK_REPORT", required_version_label: "CREDIT-DUAL-V1"}, as: ComplianceOfficer, captures: {md1: $.data.id, md1_v: $.data.version}}
            - {call: "POST /model-documentation/${md1}/file", payload: {expected_documentation_version: "${md1_v}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1_v: $.data.version}}
            - {call: "POST /score-models/${m1}/release", payload: {expected_model_version: "${m1_v}"}, as: ModelDeveloper}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "PRIME-SHIFT-V2", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m2: $.data.id}}
            - {call: "POST /score-models/${m2}/variants", payload: {industry: "AUTO", ref_score: 680, base_odds: 20.0, double_odds_points: 40, segment_width: 60, segment_offsets: [0, 6, -4], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 680, cutoff_baseline: 660}, as: ModelDeveloper, captures: {v2_auto: $.data.id}}
            - {call: "POST /score-variants/${v2_auto}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /consumers", payload: {consumer_ref: "cons-902", age_years: 38, is_protected_class: false}, as: ModelDeveloper, captures: {c902: $.data.id}}
            - {call: "POST /licenses", payload: {lender_name: "North Bank", lender_code: "LEND-NORTH", score_variant_id: "${v1_auto}", volume_tier: "VOLUME_TIER_1", entitled_count: 500, window_start_month: "2026-01", window_end_month: "2027-01"}, as: ComplianceOfficer, captures: {lic: $.data.id}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ComplianceOfficer, captures: {lic_v: $.data.version}}
            - {call: "POST /licenses/${lic}/activate", payload: {expected_license_version: "${lic_v}"}, as: ComplianceOfficer}
            - {call: "POST /migration-events", payload: {lender_code: "LEND-NORTH", from_score_variant_id: "${v1_auto}", to_score_variant_id: "${v2_auto}", event_type: "RECALIBRATED", evidence_ref: "WS-2026-201", old_cutoff_score: 640}, as: ComplianceOfficer, captures: {me1: $.data.migration_event_id, me_delta: $.data.credited_delta_bps}}
          trigger:
            - {call: "GET /licenses/${lic}", payload: {}, as: ScoreConsumer, as_user_id: "${lic}", captures: {lic_v2: $.data.version, ratio_before: $.data.window_outcome_mixture_ratio_ppm, credit_before: $.data.window_credited_delta_bps}}
            - {call: "POST /score-results", payload: {consumer_id: "${c902}", score_variant_id: "${v1_auto}", bureau_id: "${b_tuc}", license_id: "${lic}", raw_posted_score: 715, expected_license_version: "${lic_v2}", migration_event_id: "${me1}"}, as: ScoreConsumer, as_user_id: "${lic}", captures: {sr: $.data.id}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ComplianceOfficer, captures: {ratio_after: $.data.window_outcome_mixture_ratio_ppm, credit_after: $.data.window_credited_delta_bps}}
            - {call: "POST /migration-events/${me1}/void", payload: {}, as: ComplianceOfficer}
            - {call: "GET /licenses/${lic}", payload: {}, as: ComplianceOfficer, captures: {ratio_restored: $.data.window_outcome_mixture_ratio_ppm, credit_restored: $.data.window_credited_delta_bps}}
          assert:
            - "data.me_delta == -20 — the credited basis points are the target ref_score 680 minus the source ref_score 700"
            - "License.${lic}.window_credited_delta_bps is 0 before the anchored posting, -20 after it and 0 again after the void"
            - "xor(abs(ratio_before - ratio_restored), 0) == 0, so the compensating action restored the pre-anchor ratio exactly"
            - "xor(abs(ratio_after - ratio_restored), 0) != 0, because the anchored posting is still on the licence and the pre-anchor ratio is genuinely different"
            - "License.${lic}.cumulative_score_count is still 1 after the void, since voiding a migration event does not void the posting it priced"
