          assert:
            - "INSURER source confirm -> HTTP 403 ERR_NOT_RECORD_SOURCE (cross-entity gate on record.source_id)"
            - "MVA source confirm -> fin == 'VERIFIED'"

      - name: claim_filing_gated_by_listing_guarantee_state
        grounds:
          - state_machines.GuaranteeClaim.OPEN_to_APPROVED
          - entities.InventoryListing.fields.guarantee_status
          - errors[ERR_GUARANTEE_NOT_ENROLLED]
        distinguishing_aspect: |
          Entity pair GuaranteeClaim -> InventoryListing: filing and approval
          are permitted only while the LISTING's guarantee_status is ENROLLED;
          after an approval voids the guarantee, a subsequent filing on the
          same listing is rejected with ERR_GUARANTEE_NOT_ENROLLED even though
          the vehicle escalation still exists.
        test_recipe:
          setup:
            - "Network; vehicle escalated to SALVAGE; dealer listing enrolled at CLEAN; claim C1 approved (voids the guarantee)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
