# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth coverage of SCAFFOLD.yaml §1.1–§1.7 claims not already covered by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Clock endpoint is POST /_clock/set_current_utc
# (outside /ebt; server default 2026-09-01T00:00:00Z).
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: case_identifier_format_violation_rejected
        claim_type: type_constraint
        grounds: ["entities.CaseAccount.fields.case_identifier", "errors[ERR_CASE_IDENTIFIER_INVALID]"]
        distinguishing_aspect: "case_identifier must match ^[0-9]{10}$; a 6-character alphanumeric value is rejected before any state check."
        test_recipe:
          setup: ["Contract TX exists and is ACTIVE with one FOOD program"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
          trigger:
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "ABC123", head_of_household_name: "H X" }, as: StateAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_CASE_IDENTIFIER_INVALID' (HTTP 400)"

      - name: case_identifier_duplicate_rejected
        claim_type: type_constraint
        grounds: ["validations[priority=20]", "errors[ERR_CASE_IDENTIFIER_DUPLICATE]"]
        distinguishing_aspect: "case_identifier is unique per contract; the second case with the same 10 digits in the same contract is rejected."
        test_recipe:
          setup: ["Contract TX ACTIVE with FOOD program; case 0000000007 already created"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000007", head_of_household_name: "H Y1" }, as: StateAdmin }
          trigger:
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000007", head_of_household_name: "H Y2" }, as: StateAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_CASE_IDENTIFIER_DUPLICATE' (HTTP 409)"

      - name: program_config_defaults_inherited_from_contract
        claim_type: defaults
        grounds: ["entities.BenefitProgram.fields.posting_modulus", "calculations.posting_bucket_schedule"]
        distinguishing_aspect: "A program created without overrides carries null override fields, and the contract defaults (modulus 10, hour 6) drive the schedule: case bucket 3 lands on 2026-09-04T06:00:00Z."
        test_recipe:
          setup: ["Contract TX ACTIVE (all defaults); FOOD program without overrides; case 0000000003 (bucket 3); September run 30000"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000003", head_of_household_name: "H Z" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "GET /ebt/purses", payload: { case_account_id: "${case_id}", program_id: "${p_food}" }, as: StateAdmin, captures: { pu_food: "$.data[0].id" } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
          trigger:
            - { call: "GET /ebt/contracts/${c_id}/programs", payload: {}, as: StateAdmin, captures: { mod: "$.data[0].posting_modulus", hr: "$.data[0].availability_hour_utc" } }
            - { call: "GET /ebt/purses/${pu_food}/postings", payload: {}, as: StateAdmin, captures: { sd: "$.data[0].scheduled_date", aa: "$.data[0].available_at" } }
          assert:
            - "program override fields are null (mod captured null, hr captured null) — inheritance, not copying"
            - "posting scheduled_date == '2026-09-04' (month-01 + 3 bucket days under default modulus 10)"
            - "posting available_at == '2026-09-04T06:00:00Z' (default availability hour 6)"

      - name: ledger_entries_are_append_only_without_version
        claim_type: immutability
        grounds: ["entities.LedgerEntry.fields.entry_type"]
        distinguishing_aspect: "LedgerEntry declares common_fields: false — entries carry id and created_at but no version and no updated_at, and no update/delete endpoint exists for them."
        test_recipe:
          setup: ["Contract TX ACTIVE with FOOD program; case 0000000000; September run 30000"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H W" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "GET /ebt/purses", payload: { case_account_id: "${case_id}", program_id: "${p_food}" }, as: StateAdmin, captures: { pu_food: "$.data[0].id" } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
          trigger:
            - { call: "GET /ebt/purses/${pu_food}/ledger", payload: {}, as: StateAdmin, captures: { et: "$.data[0].entry_type", amt: "$.data[0].amount_cents" } }
          assert:
            - "first entry is POST_CREDIT of 30000 (et == 'POST_CREDIT', amt == 30000)"
            - "entry object has an 'id' and a 'created_at' key"
            - "entry object has NO 'version' key and NO 'updated_at' key (append-only, common_fields: false)"

      - name: get_nonexistent_purse_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A well-formed UUID that does not exist yields ERR_NOT_FOUND (404) on a single-resource read."
        test_recipe:
          setup: ["Contract TX exists (any state)"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin }
          trigger:
            - { call: "GET /ebt/purses/11111111-1111-1111-1111-111111111111", payload: {}, as: StateAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_NOT_FOUND' (HTTP 404)"

      - name: missing_case_identifier_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.CaseAccount.fields.case_identifier", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required input case_identifier fails shape validation with ERR_INVALID_REQUEST (400) before any business rule runs."
        test_recipe:
          setup: ["Contract TX ACTIVE with FOOD program"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
          trigger:
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", head_of_household_name: "H V" }, as: StateAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_INVALID_REQUEST' (HTTP 400)"

      - name: program_type_enum_violation_rejected
        claim_type: type_constraint
        grounds: ["entities.BenefitProgram.fields.program_type", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "program_type outside {FOOD, CASH, DISASTER} is a 400 enum violation, not a business error."
        test_recipe:
          setup: ["Contract TX exists in CONFIGURING"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "MEDICAL" }, as: StateAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_INVALID_REQUEST' (HTTP 400)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: activate_card_before_mailing_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Card.ISSUED_to_MAILED", "errors[ERR_CARD_NOT_MAILED]"]
        distinguishing_aspect: "Activation requires MAILED; at the default clock the card is still ISSUED (mail delay 24h not elapsed), so activation fails with ERR_CARD_NOT_MAILED."
        test_recipe:
          setup: ["Contract TX ACTIVE with FOOD program; case 0000000000; card created at 2026-09-01T00:00:00Z and clock not advanced"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H U" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_id}" }, as: CardholderServices, captures: { card_id: $.data.id } }
          trigger:
            - { call: "POST /ebt/cards/${card_id}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_CARD_NOT_MAILED' and the card remains ISSUED"

      - name: replace_already_replaced_card_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Card.ACTIVE_to_REPLACED", "errors[ERR_REPLACEMENT_NOT_ALLOWED]"]
        distinguishing_aspect: "Replacement requires ACTIVE or PIN_LOCKED; a card already in REPLACED (a terminal state for spending) rejects a second replacement with ERR_REPLACEMENT_NOT_ALLOWED."
        test_recipe:
          setup: ["Contract TX ACTIVE with FOOD; case 0000000000 with 30000 food; card1 activated; card1 replaced once (successor card2 created)"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H T" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_id}" }, as: CardholderServices, captures: { card1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card1}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}" }
            - { call: "POST /ebt/cards/${card1}/replace", payload: {}, as: Cardholder, as_user_id: "${case_id}", captures: { card2: $.data.id } }
          trigger:
            - { call: "POST /ebt/cards/${card1}/replace", payload: {}, as: Cardholder, as_user_id: "${case_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_REPLACEMENT_NOT_ALLOWED' (card1 is terminal REPLACED)"

      - name: void_already_voided_transaction_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.PurchaseTransaction.AUTHORIZED_to_VOIDED", "errors[ERR_TXN_NOT_VOIDABLE]"]
        distinguishing_aspect: "Void requires AUTHORIZED; the second void of the same transaction hits the terminal VOIDED state and fails ERR_TXN_NOT_VOIDABLE."
        test_recipe:
          setup: ["Contract TX ACTIVE with FOOD; retailer R1; case 0000000000 with active card; one 800-cent purchase voided once"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "111111111111", food_eligible: true, effective_from: "2026-08-01", effective_to: null } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H S" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_id}" }, as: CardholderServices, captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card_id}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}" }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 800 } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { txn: $.data.id } }
            - { call: "POST /ebt/authorizations/${txn}/void", payload: {}, as: RetailerSystem, as_user_id: "${r_id}" }
          trigger:
            - { call: "POST /ebt/authorizations/${txn}/void", payload: {}, as: RetailerSystem, as_user_id: "${r_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_TXN_NOT_VOIDABLE'"

      - name: closed_case_is_terminal_for_status_changes
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.CaseAccount.OPEN_to_CLOSED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CLOSED is terminal: a case closed with zero balances rejects every further status transition with ERR_INVALID_STATE even when the OCC version is current."
        test_recipe:
          setup: ["Contract TX ACTIVE with FOOD; case 0000000000 with NO allotment (all purse balances 0, no claims); case closed successfully"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H R" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "GET /ebt/case-accounts/${case_id}", payload: {}, as: StateAdmin, captures: { v1: $.data.version } }
            - { call: "POST /ebt/case-accounts/${case_id}/status", payload: { to: "CLOSED", expected_case_account_version: "${v1}" }, as: StateAdmin, captures: { st: $.data.account_status } }
            - { call: "GET /ebt/case-accounts/${case_id}", payload: {}, as: StateAdmin, captures: { v2: $.data.version } }
          trigger:
            - { call: "POST /ebt/case-accounts/${case_id}/status", payload: { to: "SUSPENDED", expected_case_account_version: "${v2}" }, as: StateAdmin, captures: { err: $.data.error_id } }
          assert:
            - "close succeeded with current version (st == 'CLOSED')"
            - "further transition rejected: err == 'ERR_INVALID_STATE' (terminal lockdown beats a valid OCC version)"

      - name: adjudicate_decided_dispute_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.SettlementDispute.OPEN_to_OVERTURNED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "An OVERTURNED dispute is terminal; a later UPHELD attempt is rejected ERR_INVALID_STATE and the batch totals never move."
        test_recipe:
          setup: ["Contract TX ACTIVE with FOOD; retailer R1; case 0000000000 active card; one 1000-cent purchase on 2026-09-02 settled into a batch at the 2026-09-03T00:00:00Z cutoff; retailer dispute filed then OVERTURNED"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "111111111111", food_eligible: true, effective_from: "2026-08-01", effective_to: null } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H Q2" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_id}" }, as: CardholderServices, captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card_id}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}" }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 1000 } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T00:00:00Z" }, as: StateAdmin }
            - { call: "GET /ebt/settlement-batches", payload: { contract_id: "${c_id}" }, as: StateAdmin, captures: { b_id: "$.data[0].id" } }
            - { call: "POST /ebt/disputes", payload: { settlement_batch_id: "${b_id}", disputed_amount_cents: 992, reason: "review" }, as: RetailerSystem, as_user_id: "${r_id}", captures: { d_id: $.data.id } }
            - { call: "POST /ebt/disputes/${d_id}/status", payload: { to: "OVERTURNED" }, as: StateAdmin }
          trigger:
            - { call: "POST /ebt/disputes/${d_id}/status", payload: { to: "UPHELD", adjustment_cents: 50 }, as: StateAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /ebt/settlement-batches/${b_id}", payload: {}, as: StateAdmin, captures: { adj: $.data.adjustment_total_cents } }
          assert:
            - "err == 'ERR_INVALID_STATE'"
            - "batch adjustment_total_cents == 0 (the rejected decision applied nothing)"

      - name: adjudicate_claim_before_investigation_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.SkimmingClaim.FILED_to_UNDER_INVESTIGATION", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Adjudication is only legal from UNDER_INVESTIGATION; a StateAdmin attempt directly from FILED fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["Contract TX ACTIVE with FOOD; retailer R1; case 0000000000 active card; 500-cent purchase; claim filed (freeze_purse false), still FILED"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "111111111111", food_eligible: true, effective_from: "2026-08-01", effective_to: null } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H P2" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_id}" }, as: CardholderServices, captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card_id}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}" }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 500 } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { txn: $.data.id } }
            - { call: "POST /ebt/claims", payload: { case_account_id: "${case_id}", card_id: "${card_id}", authorization_ids: [ "${txn}" ], claimed_amount_cents: 500, incident_description: "early adjudication", freeze_purse: false }, as: Cardholder, as_user_id: "${case_id}", captures: { cl: $.data.id } }
          trigger:
            - { call: "POST /ebt/claims/${cl}/status", payload: { to: "SUBSTANTIATED", substantiated_amount_cents: 500 }, as: StateAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_INVALID_STATE' (FILED -> SUBSTANTIATED skips UNDER_INVESTIGATION)"

      - name: suspended_case_blocks_purchase
        claim_type: precondition_enforcement
        grounds: ["validations[priority=9]", "errors[ERR_CASE_NOT_OPEN]"]
        distinguishing_aspect: "A manual OPEN -> SUSPENDED (with current OCC version) blocks the case's otherwise-valid purchase with ERR_CASE_NOT_OPEN; reinstatement restores it."
        test_recipe:
          setup: ["Contract TX ACTIVE with FOOD; retailer R1; case 0000000000 with 30000 food and active card"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "111111111111", food_eligible: true, effective_from: "2026-08-01", effective_to: null } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H O2" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_id}" }, as: CardholderServices, captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card_id}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}" }
            - { call: "GET /ebt/case-accounts/${case_id}", payload: {}, as: StateAdmin, captures: { cv: $.data.version } }
            - { call: "POST /ebt/case-accounts/${case_id}/status", payload: { to: "SUSPENDED", expected_case_account_version: "${cv}" }, as: StateAdmin }
          trigger:
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 100 } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { err: $.data.error_id } }
            - { call: "GET /ebt/case-accounts/${case_id}", payload: {}, as: StateAdmin, captures: { cv2: $.data.version } }
            - { call: "POST /ebt/case-accounts/${case_id}/status", payload: { to: "OPEN", expected_case_account_version: "${cv2}" }, as: StateAdmin }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 100 } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { ok: $.data.total_cents } }
          assert:
            - "while SUSPENDED: err == 'ERR_CASE_NOT_OPEN'"
            - "after SUSPENDED -> OPEN: purchase succeeds (ok == 100)"

      - name: reactivated_dormant_case_cards_stay_deactivated
        claim_type: side_effect_execution
        grounds: ["state_machines.CaseAccount.DORMANT_to_OPEN", "state_machines.Card.ACTIVE_to_DEACTIVATED", "errors[ERR_CARD_NOT_ACTIVE]"]
        distinguishing_aspect: "The DORMANT -> OPEN bubble-up (triggered by a new posting becoming AVAILABLE) reopens the case but deliberately does NOT resurrect cards: the deactivated card fails new purchases with ERR_CARD_NOT_ACTIVE, forcing a fee-bearing replacement."
        test_recipe:
          setup: ["Contract TX ACTIVE with FOOD (defaults); case 0000000000 with a 30000 September posting; 100-cent purchase at 2026-09-02T12:00:00Z; clock jumps to 2026-12-01T12:00:00Z which expunges everything (case DORMANT, card DEACTIVATED); December allotment run executed at 2026-12-01T12:00:00Z (current month, DORMANT cases are eligible) creates a posting whose available_at 2026-12-01T06:00:00Z is already past; the next clock nudge makes it AVAILABLE and bubbles the case back to OPEN"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "111111111111", food_eligible: true, effective_from: "2026-08-01", effective_to: null } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H N2" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "GET /ebt/purses", payload: { case_account_id: "${case_id}", program_id: "${p_food}" }, as: StateAdmin, captures: { pu_food: "$.data[0].id" } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_id}" }, as: CardholderServices, captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card_id}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}" }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 100 } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T12:00:00Z" }, as: StateAdmin }
            - { call: "GET /ebt/case-accounts/${case_id}", payload: {}, as: StateAdmin, captures: { st_dormant: $.data.account_status } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-12", amount_cents: 30000 }, as: StateAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T12:00:01Z" }, as: StateAdmin }
            - { call: "GET /ebt/case-accounts/${case_id}", payload: {}, as: StateAdmin, captures: { st_open: $.data.account_status } }
          trigger:
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 100 } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { err: $.data.error_id } }
            - { call: "GET /ebt/purses/${pu_food}", payload: {}, as: StateAdmin, captures: { spd: $.data.spendable_balance_cents } }
          assert:
            - "after expungement: account_status == 'DORMANT' (st_dormant)"
            - "December run executed at 2026-12-01T12:00:00Z (current month, DORMANT cases eligible); the posting's available_at 2026-12-01T06:00:00Z is already past, so the next sweep at 12:00:01 flips it AVAILABLE and the case DORMANT -> OPEN (st_open == 'OPEN')"
            - "spendable_balance_cents == 30000 (new benefit is live)"
            - "purchase with the old card still fails: err == 'ERR_CARD_NOT_ACTIVE' (reactivation never resurrects DEACTIVATED cards)"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: first_month_proration_literal
        claim_type: correct_result
        grounds: ["calculations.first_month_proration", "calculations.posting_bucket_schedule"]
        distinguishing_aspect: "A case created on 2026-09-05 joining the September run gets round_half_up(30000 * 26 / 30) = 26000 exactly, prorated == true, and available_at clamped to its creation date at 06:00Z."
        test_recipe:
          setup: ["Contract TX ACTIVE with FOOD program; clock advanced to 2026-09-05T00:00:00Z before case creation; case 0000000000 (bucket 0)"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T00:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H M2" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "GET /ebt/purses", payload: { case_account_id: "${case_id}", program_id: "${p_food}" }, as: StateAdmin, captures: { pu_food: "$.data[0].id" } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
          trigger:
            - { call: "GET /ebt/purses/${pu_food}/postings", payload: {}, as: StateAdmin, captures: { amt: "$.data[0].amount_cents", pro: "$.data[0].prorated", aa: "$.data[0].available_at" } }
          assert:
            - "amount_cents == 26000 (round_half_up(30000 * 26/30); 26 days from 09-05 through 09-30 inclusive)"
            - "prorated == true"
            - "available_at == '2026-09-05T06:00:00Z' (bucket day 2026-09-01 clamped up to the creation date)"

      - name: disaster_expiry_fifo_unspent_portion
        claim_type: correct_result
        grounds: ["calculations.fifo_benefit_consumption", "state_machines.BenefitPosting.AVAILABLE_to_EXPIRED", "entities.LedgerEntry.fields.entry_type"]
        distinguishing_aspect: "Disaster posting A (26000, available 2026-09-05T06:00Z) is consumed FIFO before posting B (4000, available 2026-10-01T06:00Z); a 1500 debit leaves A with 24500 unspent, so at A's expiry (2026-10-05T06:00Z, 30 days) the EXPIRY_DEBIT is exactly 24500 and the purse keeps precisely B's 4000."
        test_recipe:
          setup:
            - "Contract TX ACTIVE with FOOD and DISASTER (window [2026-09-01, 2026-10-31]) programs; case 0000000000 created at 2026-09-05T00:00:00Z (food purse + disaster purse)"
            - "DISASTER September run 30000 (posting A prorated to 26000, available 2026-09-05T06:00Z); DISASTER October run 4000 (posting B, available 2026-10-01T06:00Z)"
            - "Card active; one 1500-cent food-eligible purchase on 2026-09-10T12:00:00Z charges the disaster purse first"
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "DISASTER", disaster_window_start: "2026-09-01", disaster_window_end: "2026-10-31" }, as: StateAdmin, captures: { p_dis: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "111111111111", food_eligible: true, effective_from: "2026-08-01", effective_to: null } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T00:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H L2" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "GET /ebt/purses", payload: { case_account_id: "${case_id}", program_id: "${p_dis}" }, as: StateAdmin, captures: { pu_dis: "$.data[0].id" } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_dis}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_dis}", benefit_month: "2026-10", amount_cents: 4000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_id}" }, as: CardholderServices, captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-06T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card_id}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 1500 } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { dch: $.data.disaster_charge_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-05T06:00:00Z" }, as: StateAdmin }
          trigger:
            - { call: "GET /ebt/purses/${pu_dis}", payload: {}, as: StateAdmin, captures: { bal: $.data.ledger_balance_cents, spd: $.data.spendable_balance_cents } }
            - { call: "GET /ebt/purses/${pu_dis}/postings", payload: {}, as: StateAdmin, captures: { a_stat: "$.data[0].posting_status", b_stat: "$.data[1].posting_status" } }
            - { call: "GET /ebt/purses/${pu_dis}/ledger", payload: { entry_type: "EXPIRY_DEBIT" }, as: StateAdmin, captures: { exp_amt: "$.data[0].amount_cents" } }
          assert:
            - "purchase charged the disaster purse first: dch == 1500"
            - "EXPIRY_DEBIT amount == 24500 (A unspent = 26000 - 1500, FIFO oldest-first)"
            - "posting A (earlier available_at) EXPIRED; posting B still AVAILABLE (a_stat == 'EXPIRED', b_stat == 'AVAILABLE')"
            - "purse ledger_balance_cents == 4000 and spendable_balance_cents == 4000 (exactly B remains)"

      - name: settlement_day_boundary_half_open_assignment
        claim_type: boundary
        grounds: ["entities.SettlementBatch.fields.settlement_date", "state_machines.PurchaseTransaction.AUTHORIZED_to_SETTLED"]
        distinguishing_aspect: "Settlement days are half-open: a purchase created at exactly 2026-09-03T00:00:00Z belongs to the 2026-09-03 day, not 2026-09-02; no batch exists for 2026-09-02 at all."
        test_recipe:
          setup: ["Contract TX ACTIVE with FOOD; retailer R1; case 0000000000 active card and 30000 food; clock advanced to exactly 2026-09-03T00:00:00Z (empty sweep) BEFORE the purchase"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "111111111111", food_eligible: true, effective_from: "2026-08-01", effective_to: null } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H K3" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_id}" }, as: CardholderServices, captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card_id}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T00:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 700 } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-04T00:00:00Z" }, as: StateAdmin }
          trigger:
            - { call: "GET /ebt/settlement-batches", payload: { contract_id: "${c_id}" }, as: StateAdmin, captures: { sd: "$.data[0].settlement_date", n: "$.data[0].txn_count", g: "$.data[0].gross_settled_cents" } }
          assert:
            - "exactly one batch exists and its settlement_date == '2026-09-03' (the 00:00:00 purchase opens the new day)"
            - "batch txn_count == 1 and gross_settled_cents == 700"

      - name: expungement_notice_and_sweep_timing
        claim_type: correct_result
        grounds: ["calculations.expungement_sweep"]
        excluded_because:
          difficulty_instance: expungement_dormancy_card_deactivation_chain
          rationale: "Notice timestamp (2026-11-01T12:00:00Z), the 1-second-before boundary, and the inclusive eligibility sweep are all asserted in the named §1.8 instance."

      - name: provisional_credit_cap_and_target_purse
        claim_type: correct_result
        grounds: ["calculations.claim_credit_resolution"]
        excluded_because:
          difficulty_instance: claim_parallel_investigation_and_credit_dimensions
          rationale: "The 50000 cap, the CASH-purse target tie-break, and the FINAL delta (-5000) are asserted in the named §1.8 instance."

      - name: purse_spendable_excludes_scheduled_credit
        claim_type: computed_fields
        grounds: ["entities.Purse.fields.spendable_balance_cents"]
        excluded_because:
          difficulty_instance: purse_spendable_vs_ledger_with_scheduled_posting
          rationale: "The SCHEDULED-posting exclusion (30000 ledger vs 0 spendable) is the assertion core of the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: upc_format_violation_rejects_whole_file
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_UPC_INVALID]"]
        distinguishing_aspect: "Item-file upload is atomic: a single malformed UPC ('123' fails ^[0-9]{12}$) rejects the entire file and no RetailerItem rows are created."
        test_recipe:
          setup: ["Contract TX ACTIVE with FOOD program; retailer R1 APPROVED"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
          trigger:
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "123", food_eligible: true, effective_from: "2026-09-01", effective_to: null } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { err: $.data.error_id } }
            - { call: "GET /ebt/retailers/${r_id}/items", payload: {}, as: StateAdmin }
          assert:
            - "err == 'ERR_UPC_INVALID' (HTTP 400)"
            - "GET items returns total_count == 0 (whole file rejected atomically)"

      - name: void_on_next_calendar_day_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=21]", "errors[ERR_VOID_WINDOW_EXPIRED]"]
        distinguishing_aspect: "With settlement_cutoff_hour_utc overridden to 6, a purchase made on 2026-09-02 is still AUTHORIZED at 2026-09-03T02:00:00Z (cutoff not reached), but the void is on a different UTC calendar day and fails ERR_VOID_WINDOW_EXPIRED — the temporal check, not the state check."
        test_recipe:
          setup: ["Contract TX (settlement_cutoff_hour_utc 6) ACTIVE with FOOD; retailer R1; case 0000000000 active card 30000 food; 800-cent purchase at 2026-09-02T12:00:00Z"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX", settlement_cutoff_hour_utc: 6 }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "111111111111", food_eligible: true, effective_from: "2026-08-01", effective_to: null } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
