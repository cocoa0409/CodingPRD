scenario: |
  Generate task harder than expert level!

  2722. Charity Golf Outing Operations (golf tournament event organizer): tournament format selection with scramble, best ball or stroke play rules and handicap application, registration with team, individual and sponsor package tiers and pricing, sponsorship inventory across hole signs, contests, carts and beverage stations with fulfillment obligations, course contracting with rate, food and beverage minimums and rain date terms, contest administration including hole-in-one prize insurance and skill contests, auction, raffle and donation processing with charitable receipt requirements, pairing sheets, cart assignments and simultaneous-start logistics, scoring, tiebreakers and prize distribution with amateur status considerations, net proceeds reporting to the beneficiary

domain_name: charity-golf-outing-operations
api_prefix: /outing-ops

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity owns a top-level collection under /outing-ops; parents are referenced by
  # FK fields in request bodies, never by nested URL segments. No entity is addressed
  # through another entity's path.

  state_machine_shape: parallel
  # Outing carries two independent dimensions (play_status x finance_status) that advance
  # on separate endpoints; Contest carries (status x insurance_status). Registration adds a
  # CONFIRMED -> AMENDED -> CONFIRMED cycle, CourseContract a SIGNED -> AMENDED -> SIGNED
  # cycle, and SponsorAllocation a fork-join branch (fulfilment path vs waiver path).

  relationship_patterns:
    - one_to_many          # Outing -> PackageTier / Registration / SponsorshipAsset / Contest / FundraisingItem
    - many_to_many         # SponsorAllocation is the junction of Registration x SponsorshipAsset
    - polymorphic          # CharitableReceipt.subject is either a Registration or a FundraisingItem
    - self_referential     # CharitableReceipt.reverses_receipt_id points at another CharitableReceipt
    - cross_aggregate      # Team scoring reads Player rows that hang off Registration, not off Team

  role_model: segregation_of_duties
  # The staff user who approves sponsor artwork may not be the staff user who verifies its
  # installation; the staff user who records a fundraising sale may not be the staff user who
  # issues its charitable receipt. Enforced on X-User-ID equality.

  consistency_model: immediate

difficulty_level: expert_plus
# 11 entities / 54 endpoints / 61 error codes / 40 validation rules / 10 calculations
# (4 with divergent variants) / 9 state-machine blocks covering 7 entities, of which
# Outing and Contest each split into two parallel dimensions, Registration and
# CourseContract are cyclic and SponsorAllocation is a fork-join.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Outing
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Public name of the charity outing" }
      - { name: beneficiary_name, type: string, source: input, description: "Charity that receives the net proceeds" }
      - { name: format, type: enum, source: input, description: "Tournament format that selects the handicap allowance formula", constraints: "one of SCRAMBLE, BEST_BALL, STROKE_PLAY" }
      - { name: start_format, type: enum, source: input, description: "Starting logistics; SHOTGUN and WAVE_SPLIT put every group out on its own hole at the wave start time, TEE_TIME issues sequential slots off one hole", constraints: "one of SHOTGUN, WAVE_SPLIT, TEE_TIME" }
      - { name: scheduled_date, type: datetime, source: input, description: "ISO 8601 UTC date/time of play" }
      - { name: rain_date, type: datetime, source: input, description: "Contracted alternate date; required before a POSTPONE with rain-date terms can be invoked", default: null }
      - { name: wave_a_start, type: datetime, source: input, description: "Wave A first-swing time; also the mandatory tee_time for every wave-A group when start_format is SHOTGUN or WAVE_SPLIT" }
      - { name: wave_a_end, type: datetime, source: input, description: "Wave A projected finish time; feeds the cart turnaround window" }
      - { name: wave_b_start, type: datetime, source: input, description: "Wave B first-swing time; required when start_format is WAVE_SPLIT", default: null }
      - { name: wave_b_end, type: datetime, source: input, description: "Wave B projected finish time", default: null }
      - { name: field_capacity_teams, type: integer, source: input, description: "Maximum number of groups the course sold; capacity in player slots is field_capacity_teams * 4", constraints: ">= 1" }
      - { name: prize_pool_cents, type: integer, source: input, description: "Cash prize pool budgeted for team placement prizes", constraints: ">= 0" }
      - { name: play_status, type: enum, source: system, description: "Play dimension of the parallel state machine", default: DRAFT, constraints: "one of DRAFT, OPEN, FIELD_LOCKED, IN_PLAY, SCORED, POSTPONED, CANCELLED" }
      - { name: finance_status, type: enum, source: system, description: "Finance dimension of the parallel state machine; advances independently of play_status", default: COLLECTING, constraints: "one of COLLECTING, RECONCILED, DISBURSED" }
      - { name: reopen_count, type: integer, source: system, description: "Number of times the field was reopened from FIELD_LOCKED back to OPEN", default: 0 }
      - { name: postponed_from_date, type: datetime, source: system, description: "scheduled_date value captured at the moment of the POSTPONE transition", default: null }
      - { name: confirmed_player_slots, type: integer, source: computed, description: "Sum of Registration.player_count over registrations whose status is in {CONFIRMED, AMENDED, CHECKED_IN}", default: 0 }
      - { name: checked_in_player_count, type: integer, source: computed, description: "Count of Player rows whose checked_in is true", default: 0 }
      - { name: waitlisted_registration_count, type: integer, source: computed, description: "Count of Registration rows whose status is WAITLISTED", default: 0 }
      - { name: reserved_asset_slot_count, type: integer, source: computed, description: "Sum over this outing's SponsorshipAsset rows of (reserved_count + committed_count + fulfilled_count); the conserved inventory quantity", default: 0 }
      - { name: gross_revenue_cents, type: integer, source: computed, description: "Output of calculation net_proceeds_rollup step 1", default: 0 }
      - { name: refunded_cents, type: integer, source: computed, description: "Sum of Registration.amount_refunded_cents over every registration of this outing", default: 0 }
      - { name: course_charge_cents, type: integer, source: computed, description: "Output of calculation net_proceeds_rollup step 3", default: 0 }
      - { name: fnb_shortfall_cents, type: integer, source: computed, description: "Output of calculation net_proceeds_rollup step 4", default: 0 }
      - { name: insurance_cost_cents, type: integer, source: computed, description: "Sum of Contest.insurance_premium_cents over contests whose insurance_status is in {BOUND, CLAIM_PAID, CLAIM_DENIED, EXPIRED}", default: 0 }
      - { name: prize_cost_cents, type: integer, source: computed, description: "Output of calculation net_proceeds_rollup step 5; variant-dependent", default: 0 }
      - { name: fulfillment_credit_cents, type: integer, source: computed, description: "Sum of SponsorAllocation.fulfillment_credit_cents over allocations whose status is WAIVED; counted as a direct cost only in the FINAL variant", default: 0 }
      - { name: direct_costs_cents, type: integer, source: computed, description: "Output of calculation net_proceeds_rollup step 6", default: 0 }
      - { name: net_proceeds_before_fee_cents, type: integer, source: computed, description: "gross_revenue_cents - refunded_cents - direct_costs_cents", default: 0 }
      - { name: admin_fee_pct, type: number, source: computed, description: "Administrative fee rate selected from ADMIN_FEE_TIERS by net_proceeds_before_fee_cents", default: 0 }
      - { name: admin_fee_cents, type: integer, source: computed, description: "round_half_up(admin_fee_pct * gross_revenue_cents)", default: 0 }
      - { name: net_proceeds_cents, type: integer, source: computed, description: "net_proceeds_before_fee_cents - admin_fee_cents", default: 0 }
      - { name: unclaimed_prize_cents, type: integer, source: computed, description: "prize_pool_cents minus the sum of Team.prize_award_cents after FINALIZE_SCORING", default: 0 }
      - { name: receipted_deductible_total_cents, type: integer, source: computed, description: "Signed sum of CharitableReceipt.deductible_amount_cents over every receipt of this outing, reversals included", default: 0 }
      - { name: proceeds_variant, type: enum, source: system, description: "Which variant last wrote the finance fields", default: PROVISIONAL, constraints: "one of PROVISIONAL, FINAL" }
      - { name: beneficiary_remittance_cents, type: integer, source: system, description: "net_proceeds_cents frozen at the REMIT transition", default: 0 }
      - { name: remittance_reference, type: string, source: system, description: "Payment reference recorded at the REMIT transition", default: null }

  - name: CourseContract
    parent: null
    common_fields: true
    fields:
      - { name: outing_id, type: string, source: input, description: "FK -> Outing.id; at most one contract per outing" }
      - { name: course_name, type: string, source: input, description: "Host course" }
      - { name: rate_per_player_cents, type: integer, source: input, description: "Contracted green fee + cart rate charged per billable player", constraints: ">= 0" }
      - { name: guaranteed_player_count, type: integer, source: input, description: "Minimum player count the organizer guaranteed to pay for regardless of turnout", default: 72, constraints: ">= 0" }
      - { name: fnb_minimum_cents, type: integer, source: input, description: "Food and beverage minimum spend the organizer owes the course", default: 0, constraints: ">= 0" }
      - { name: fnb_per_player_cents, type: integer, source: input, description: "Food and beverage spend credited per billable player", default: 4500, constraints: ">= 0" }
      - { name: course_rating, type: number, source: input, description: "USGA course rating used by course-handicap conversion", default: 71.4 }
      - { name: slope_rating, type: integer, source: input, description: "USGA slope rating used by course-handicap conversion", default: 128 }
      - { name: par, type: integer, source: input, description: "Course par used by course-handicap conversion", default: 72 }
      - { name: tee_interval_minutes, type: integer, source: input, description: "Length of one tee-sheet slot; the half-open occupancy window of a TEE_TIME group is [tee_time, tee_time + tee_interval_minutes)", default: 10, constraints: ">= 1" }
      - { name: cart_allowance_count, type: integer, source: input, description: "Number of distinct cart numbers the course supplies; cart_number on a tee assignment must be <= this value", default: 40, constraints: ">= 1" }
      - { name: rain_date_terms, type: enum, source: input, description: "What the course credits when the outing is postponed to the rain date", default: NONE, constraints: "one of FULL_CREDIT, PARTIAL_CREDIT, NONE" }
      - { name: rain_date_credit_pct, type: number, source: input, description: "Fraction of course_charge_cents credited back under PARTIAL_CREDIT terms", default: 0.5, constraints: "0 <= value <= 1" }
      - { name: cancellation_notice_days, type: integer, source: input, description: "Whole days before scheduled_date inside which a void or a registration cancellation is treated as late", default: 30, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "Contract lifecycle state", default: DRAFT, constraints: "one of DRAFT, SIGNED, AMENDED, SETTLED, VOIDED" }
      - { name: signed_at, type: datetime, source: system, description: "Logical-clock timestamp of the first SIGN action", default: null }
      - { name: amendment_count, type: integer, source: system, description: "Number of AMEND actions applied", default: 0 }
      - { name: rain_credit_cents, type: integer, source: system, description: "Course credit granted by the POSTPONE cascade under rain_date_terms", default: 0 }
      - { name: settled_charge_cents, type: integer, source: system, description: "course_charge_cents + fnb_shortfall_cents - rain_credit_cents frozen at SETTLE", default: 0 }

  - name: PackageTier
    parent: null
    common_fields: true
    fields:
      - { name: outing_id, type: string, source: input, description: "FK -> Outing.id" }
      - { name: code, type: string, source: input, description: "Short tier code, unique among the tiers of one outing" }
      - { name: kind, type: enum, source: input, description: "Which registration shape this tier sells", constraints: "one of TEAM, INDIVIDUAL, SPONSOR" }
      - { name: price_cents, type: integer, source: input, description: "List price of the package", constraints: ">= 0" }
      - { name: player_slots, type: integer, source: input, description: "Player slots included in the package", constraints: "0 <= value <= 4" }
      - { name: gsv_cents, type: integer, source: input, description: "Goods-and-services value of the whole package (rounds, meals, gifts) used by the charitable-deduction calculation", default: 0, constraints: ">= 0" }
      - { name: inventory_cap, type: integer, source: input, description: "Maximum number of registrations that may reach a revenue-recognized status at this tier", default: 999, constraints: ">= 1" }
      - { name: entitled_asset_type, type: enum, source: input, description: "Sponsorship asset type this tier entitles the buyer to at no extra charge", default: NONE, constraints: "one of HOLE_SIGN, CONTEST, CART, BEVERAGE_STATION, NONE" }
      - { name: entitled_asset_count, type: integer, source: input, description: "How many entitled assets of entitled_asset_type the package includes", default: 0, constraints: ">= 0" }
      - { name: sold_count, type: integer, source: computed, description: "Count of Registration rows at this tier whose status is in {CONFIRMED, AMENDED, CHECKED_IN}", default: 0 }

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - { name: outing_id, type: string, source: input, description: "FK -> Outing.id" }
      - { name: package_tier_id, type: string, source: input, description: "FK -> PackageTier.id; the tier currently held after any amendment" }
      - { name: buyer_name, type: string, source: input, description: "Company or person paying for the package" }
      - { name: buyer_email, type: string, source: input, description: "Contact address the charitable receipt is addressed to", default: null }
      - { name: player_count, type: integer, source: input, description: "Player slots taken; must be <= PackageTier.player_slots of the held tier", constraints: "0 <= value <= 4" }
      - { name: status, type: enum, source: system, description: "Registration lifecycle state", default: PENDING_PAYMENT, constraints: "one of PENDING_PAYMENT, CONFIRMED, AMENDED, WAITLISTED, CHECKED_IN, CANCELLED, REFUNDED" }
      - { name: amount_paid_cents, type: integer, source: computed, description: "Cumulative cash received on this registration, including amendment deltas", default: 0 }
      - { name: amount_refunded_cents, type: integer, source: computed, description: "Cumulative cash returned on this registration, including negative amendment deltas and cancellation refunds", default: 0 }
      - { name: late_cancel_fee_cents, type: integer, source: computed, description: "Retained portion of amount_paid_cents when the cancellation lands inside the contract notice window", default: 0 }
      - { name: fulfillment_credit_cents, type: integer, source: computed, description: "Sum of SponsorAllocation.fulfillment_credit_cents over this registration's WAIVED allocations", default: 0 }
      - { name: entitled_asset_balance, type: integer, source: computed, description: "PackageTier.entitled_asset_count of the held tier minus the count of this registration's allocations with source PACKAGE_ENTITLEMENT whose status is not RELEASED", default: 0 }
      - { name: confirmed_at, type: datetime, source: system, description: "Logical-clock timestamp when the registration first reached CONFIRMED; the handicap snapshot instant", default: null }
      - { name: amendment_count, type: integer, source: system, description: "Number of AMEND_TIER actions applied", default: 0 }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the staff user who created the registration", default: null }
      - { name: receipt_issued, type: boolean, source: computed, description: "True when a CharitableReceipt with receipt_kind REGISTRATION and no live reversal exists for this registration", default: false }

  - name: Player
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id; the package that bought this player's slot" }
      - { name: team_id, type: string, source: input, description: "FK -> Team.id; null until the player is grouped into a foursome", default: null }
      - { name: full_name, type: string, source: input, description: "Golfer name printed on the pairing sheet" }
      - { name: handicap_index, type: number, source: input, description: "Current USGA handicap index on file", constraints: "0 <= value <= 54.0" }
      - { name: amateur_status, type: enum, source: input, description: "Amateur status governing what prize form the player may accept", default: AMATEUR, constraints: "one of AMATEUR, PROFESSIONAL" }
      - { name: handicap_index_at_confirm, type: number, source: system, description: "handicap_index snapshot taken when the owning registration reached CONFIRMED; null while the registration is PENDING_PAYMENT or WAITLISTED", default: null }
      - { name: effective_handicap_index, type: number, source: computed, description: "Sandbagging-capped index used by the LOCKED handicap variant", default: null }
      - { name: course_handicap, type: integer, source: computed, description: "Output of calculation course_handicap_conversion for this player", default: null }
      - { name: checked_in, type: boolean, source: system, description: "Set true by the registration CHECK_IN action", default: false }

  - name: Team
    parent: null
    common_fields: true
    fields:
      - { name: outing_id, type: string, source: input, description: "FK -> Outing.id" }
      - { name: team_name, type: string, source: input, description: "Group name on the pairing sheet" }
      - { name: player_count, type: integer, source: computed, description: "Count of Player rows whose team_id is this team", default: 0 }
      - { name: team_playing_handicap, type: number, source: computed, description: "Output of calculation team_playing_handicap, one decimal", default: null }
      - { name: handicap_variant, type: enum, source: system, description: "Which handicap variant last wrote team_playing_handicap", default: PROVISIONAL, constraints: "one of PROVISIONAL, LOCKED" }
      - { name: gross_score, type: integer, source: system, description: "18-hole gross team score posted by the scoring action", default: null }
      - { name: gross_back_9, type: integer, source: system, description: "Gross strokes on holes 10-18", default: null }
      - { name: gross_back_6, type: integer, source: system, description: "Gross strokes on holes 13-18", default: null }
      - { name: gross_back_3, type: integer, source: system, description: "Gross strokes on holes 16-18", default: null }
      - { name: gross_hole_18, type: integer, source: system, description: "Gross strokes on hole 18", default: null }
      - { name: net_score, type: number, source: computed, description: "gross_score - team_playing_handicap, one decimal", default: null }
      - { name: net_back_9, type: number, source: computed, description: "round_half_up(gross_back_9 - team_playing_handicap / 2, 2)", default: null }
      - { name: net_back_6, type: number, source: computed, description: "round_half_up(gross_back_6 - team_playing_handicap / 3, 2)", default: null }
      - { name: net_back_3, type: number, source: computed, description: "round_half_up(gross_back_3 - team_playing_handicap / 6, 2)", default: null }
      - { name: net_hole_18, type: number, source: computed, description: "round_half_up(gross_hole_18 - team_playing_handicap / 18, 2)", default: null }
      - { name: rank_position, type: integer, source: computed, description: "1-based finishing position after FINALIZE_SCORING, ties fully broken by calculation team_ranking_tiebreak", default: null }
      - { name: prize_eligible, type: boolean, source: computed, description: "False when any Player on the team has amateur_status PROFESSIONAL and the outing's prize pool pays cash", default: true }
      - { name: prize_award_cents, type: integer, source: computed, description: "Cash prize allocated by calculation prize_distribution", default: 0 }
      - { name: score_posted_at, type: datetime, source: system, description: "Logical-clock timestamp of the score posting", default: null }
      - { name: wave, type: enum, source: system, description: "Wave the group starts in; written by the tee-assignment action", default: null, constraints: "one of A, B" }
      - { name: starting_hole, type: integer, source: system, description: "Hole the group starts on; written by the tee-assignment action", default: null, constraints: "1 <= value <= 18" }
      - { name: tee_time, type: datetime, source: system, description: "First-swing time of the group; written by the tee-assignment action", default: null }
      - { name: cart_number, type: integer, source: system, description: "Cart assigned to the group; written by the tee-assignment action", default: null }
      - { name: slot_occupancy_start, type: datetime, source: computed, description: "Equal to tee_time; start of the half-open tee-sheet occupancy window", default: null }
      - { name: slot_occupancy_end, type: datetime, source: computed, description: "tee_time + CourseContract.tee_interval_minutes; exclusive end of the tee-sheet occupancy window", default: null }
      - { name: tee_assignment_count, type: integer, source: system, description: "Number of times a tee assignment has been written for this team; later writes supersede earlier ones", default: 0 }

  - name: SponsorshipAsset
    parent: null
    common_fields: true
    fields:
      - { name: outing_id, type: string, source: input, description: "FK -> Outing.id" }
      - { name: asset_type, type: enum, source: input, description: "Inventory family this unit belongs to", constraints: "one of HOLE_SIGN, CONTEST, CART, BEVERAGE_STATION" }
      - { name: label, type: string, source: input, description: "Inventory label, e.g. 'Hole 7 tee sign'" }
      - { name: hole_number, type: integer, source: input, description: "Hole the unit sits on; required for HOLE_SIGN and CONTEST, null for CART and BEVERAGE_STATION", default: null, constraints: "1 <= value <= 18" }
      - { name: capacity, type: integer, source: input, description: "How many sponsors may occupy this unit at once", default: 1, constraints: ">= 1" }
      - { name: exclusive, type: boolean, source: input, description: "When true no other exclusive asset of the same asset_type may occupy the same hole_number in this outing", default: true }
      - { name: list_price_cents, type: integer, source: input, description: "A-la-carte price when the unit is bought outside a package entitlement", constraints: ">= 0" }
      - { name: fulfillment_due_at, type: datetime, source: input, description: "Deadline by which an occupying allocation must reach VERIFIED", default: null }
      - { name: reserved_count, type: integer, source: computed, description: "Count of occupying allocations whose status is RESERVED", default: 0 }
      - { name: committed_count, type: integer, source: computed, description: "Count of occupying allocations whose status is in {COMMITTED, ARTWORK_APPROVED, INSTALLED}", default: 0 }
      - { name: fulfilled_count, type: integer, source: computed, description: "Count of occupying allocations whose status is in {VERIFIED, WAIVED}", default: 0 }
      - { name: remaining_capacity, type: integer, source: computed, description: "capacity - (reserved_count + committed_count + fulfilled_count)" }
      - { name: status, type: enum, source: system, description: "Inventory posture derived from the occupancy counters, except WITHDRAWN which is set manually", default: AVAILABLE, constraints: "one of AVAILABLE, RESERVED, COMMITTED, FULFILLED, WITHDRAWN" }

  - name: SponsorAllocation
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id; the sponsor package that occupies the unit" }
      - { name: sponsorship_asset_id, type: string, source: input, description: "FK -> SponsorshipAsset.id; the occupied inventory unit" }
      - { name: source, type: enum, source: input, description: "Whether the unit is drawn from the package entitlement or bought as an upsell", constraints: "one of PACKAGE_ENTITLEMENT, UPSELL" }
      - { name: service_window_start, type: datetime, source: input, description: "Start of the sponsor's service window; required when the asset_type is CART or BEVERAGE_STATION", default: null }
      - { name: service_window_end, type: datetime, source: input, description: "End of the sponsor's service window; required when the asset_type is CART or BEVERAGE_STATION", default: null }
      - { name: status, type: enum, source: system, description: "Fulfillment obligation state; the fork at COMMITTED leads either down the artwork path or to WAIVED", default: RESERVED, constraints: "one of RESERVED, COMMITTED, ARTWORK_APPROVED, INSTALLED, VERIFIED, WAIVED, RELEASED" }
      - { name: upsell_price_cents, type: integer, source: computed, description: "0 when source is PACKAGE_ENTITLEMENT, SponsorshipAsset.list_price_cents when source is UPSELL; recognized as revenue from COMMITTED onward", default: 0 }
      - { name: fulfillment_credit_cents, type: integer, source: computed, description: "round_half_up(WAIVER_CREDIT_PCT * SponsorshipAsset.list_price_cents) written by the WAIVE branch, otherwise 0", default: 0 }
      - { name: waived_reason, type: string, source: input, description: "Why the obligation could not be fulfilled; required by the WAIVE action", default: null }
      - { name: artwork_approved_by_user_id, type: string, source: system, description: "X-User-ID of the staff user who ran APPROVE_ARTWORK", default: null }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the staff user who ran VERIFY; must differ from artwork_approved_by_user_id", default: null }
      - { name: committed_at, type: datetime, source: system, description: "Logical-clock timestamp of the COMMIT action", default: null }

  - name: Contest
    parent: null
    common_fields: true
    fields:
      - { name: outing_id, type: string, source: input, description: "FK -> Outing.id" }
      - { name: contest_type, type: enum, source: input, description: "Skill contest family", constraints: "one of HOLE_IN_ONE, LONGEST_DRIVE, CLOSEST_TO_PIN, PUTTING" }
      - { name: hole_number, type: integer, source: input, description: "Hole the contest is staged on", constraints: "1 <= value <= 18" }
      - { name: yardage, type: integer, source: input, description: "Measured yardage of the contest hole; compared against the bound policy minimum on a hole-in-one claim", default: null, constraints: ">= 0" }
      - { name: prize_value_cents, type: integer, source: input, description: "Advertised prize value", constraints: ">= 0" }
      - { name: prize_form, type: enum, source: input, description: "Form the advertised prize is paid in", default: MERCHANDISE_CREDIT, constraints: "one of CASH, MERCHANDISE_CREDIT" }
      - { name: requires_insurance, type: boolean, source: computed, description: "True exactly when contest_type is HOLE_IN_ONE and prize_value_cents >= INSURANCE_REQUIRED_THRESHOLD_CENTS", default: false }
      - { name: status, type: enum, source: system, description: "Contest lifecycle dimension", default: PLANNED, constraints: "one of PLANNED, OPEN, CLOSED, AWARDED, VOID" }
      - { name: insurance_status, type: enum, source: system, description: "Insurance dimension, advancing independently of status", default: NONE, constraints: "one of NONE, BOUND, CLAIM_PAID, CLAIM_DENIED, EXPIRED" }
      - { name: insurance_carrier, type: string, source: input, description: "Carrier that bound the hole-in-one policy", default: null }
      - { name: insurance_premium_cents, type: integer, source: input, description: "Premium paid to bind the policy; a direct cost of the outing", default: 0, constraints: ">= 0" }
      - { name: insurance_coverage_cap_cents, type: integer, source: input, description: "Maximum the carrier will reimburse on a paid claim", default: 0, constraints: ">= 0" }
      - { name: insurance_min_yardage, type: integer, source: input, description: "Minimum hole yardage the policy requires for a covered ace", default: 165, constraints: ">= 0" }
      - { name: insurance_required_witness_count, type: integer, source: input, description: "Number of witnesses the policy requires on the claim form", default: 2, constraints: ">= 0" }
      - { name: insurance_bound_at, type: datetime, source: system, description: "Logical-clock timestamp of the bind action", default: null }
      - { name: winner_player_id, type: string, source: input, description: "FK -> Player.id; recorded by the award action", default: null }
      - { name: witness_count, type: integer, source: input, description: "Witnesses attesting the winning shot; recorded by the award action", default: 0, constraints: ">= 0" }
      - { name: award_form, type: enum, source: computed, description: "Form actually awarded after the amateur-status rule is applied", default: null, constraints: "one of CASH, MERCHANDISE_CREDIT" }
      - { name: awarded_value_cents, type: integer, source: computed, description: "Value actually awarded to the winner", default: 0 }
      - { name: insurance_recovery_cents, type: integer, source: computed, description: "min(awarded_value_cents, insurance_coverage_cap_cents) when the claim is paid, otherwise 0", default: 0 }
      - { name: contest_payout_cents, type: integer, source: computed, description: "awarded_value_cents - insurance_recovery_cents; the uninsured share the outing absorbs", default: 0 }
      - { name: claim_denial_reason, type: enum, source: computed, description: "Why the carrier declined", default: NONE, constraints: "one of NONE, YARDAGE_BELOW_MINIMUM, INSUFFICIENT_WITNESSES, COVERAGE_CAP_EXCEEDED, NO_POLICY" }

  - name: FundraisingItem
    parent: null
    common_fields: true
    fields:
      - { name: outing_id, type: string, source: input, description: "FK -> Outing.id" }
      - { name: item_type, type: enum, source: input, description: "Fundraising channel", constraints: "one of AUCTION, RAFFLE, DONATION" }
      - { name: description, type: string, source: input, description: "Lot or appeal description" }
      - { name: fmv_cents, type: integer, source: input, description: "Fair market value of what the buyer receives; the quid-pro-quo benefit on an auction lot", default: 0, constraints: ">= 0" }
      - { name: ask_cents, type: integer, source: input, description: "Reserve price an auction bid must reach", default: 0, constraints: ">= 0" }
      - { name: buyer_registration_id, type: string, source: input, description: "FK -> Registration.id; buyer or donor, recorded by the sale action", default: null }
      - { name: bid_cents, type: integer, source: input, description: "Winning bid or pledged amount recorded by the sale action", default: 0, constraints: ">= 0" }
      - { name: collected_cents, type: integer, source: computed, description: "Cash actually collected against the sale", default: 0 }
      - { name: status, type: enum, source: system, description: "Item lifecycle; VOID returns the lot to LISTED", default: LISTED, constraints: "one of LISTED, SOLD, PAID, RECEIPTED, VOID" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the staff user who recorded the sale; barred from issuing this item's receipt", default: null }
      - { name: sold_at, type: datetime, source: system, description: "Logical-clock timestamp of the sale action", default: null }
      - { name: void_count, type: integer, source: system, description: "Number of times the lot has been voided and relisted", default: 0 }

  - name: CharitableReceipt
    parent: null
    common_fields: false
    fields:
      - { name: outing_id, type: string, source: input, description: "FK -> Outing.id" }
      - { name: receipt_kind, type: enum, source: input, description: "Which subject the receipt documents; REVERSAL rows carry negated amounts", constraints: "one of REGISTRATION, FUNDRAISING_ITEM, REVERSAL" }
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id; set exactly when receipt_kind is REGISTRATION", default: null }
      - { name: fundraising_item_id, type: string, source: input, description: "FK -> FundraisingItem.id; set exactly when receipt_kind is FUNDRAISING_ITEM", default: null }
      - { name: reverses_receipt_id, type: string, source: input, description: "FK -> CharitableReceipt.id; set exactly when receipt_kind is REVERSAL", default: null }
      - { name: payment_cents, type: integer, source: computed, description: "Cash the subject contributed, negated on a REVERSAL row", default: 0 }
      - { name: gsv_cents, type: integer, source: computed, description: "Goods-and-services value applied after the token-benefit rule, negated on a REVERSAL row", default: 0 }
      - { name: deductible_amount_cents, type: integer, source: computed, description: "Output of calculation charitable_deductible; negative on a REVERSAL row", default: 0 }
      - { name: receipt_number, type: string, source: system, description: "Per-outing sequential number in the form 'GR-0001', assigned in created_at ascending order" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of the treasurer who issued the receipt" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp at issuance" }

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  # Outing carries two independent dimensions. play_status is driven by
  # POST /outings/{id}/play-transition, finance_status by
  # POST /outings/{id}/finance-transition. Neither dimension reads the other's
  # trigger, but RECONCILE guards on play_status == SCORED.
  - entity: Outing
    dimension: play_status
    initial_state: DRAFT
    terminal_states: [SCORED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /outing-ops/outings/{id}/play-transition action=OPEN_REGISTRATION"
        actor: TournamentDirector
        preconditions:
          - "a CourseContract with outing_id == this outing exists and its status is in {SIGNED, AMENDED}, else ERR_CONTRACT_NOT_SIGNED"
          - "at least one PackageTier with outing_id == this outing exists, else ERR_NO_PACKAGE_TIER"
        side_effects:
          - "increments Outing.version by 1"
      - from: FIELD_LOCKED
        to: OPEN
        trigger: "POST /outing-ops/outings/{id}/play-transition action=OPEN_REGISTRATION"
        actor: TournamentDirector
        preconditions:
          - "Outing.reopen_count < MAX_FIELD_REOPENS (2), else ERR_MAX_REOPENS_EXCEEDED"
        side_effects:
          - "sets Outing.reopen_count = reopen_count + 1"
          - "for every Team of this outing: recomputes team_playing_handicap under calculation team_playing_handicap variant PROVISIONAL and sets handicap_variant = PROVISIONAL"
          - "for every Team of this outing whose gross_score is not null: recomputes net_score, net_back_9, net_back_6, net_back_3, net_hole_18 from the new team_playing_handicap"
          - "increments Outing.version by 1"
        note: "The reopen edge makes the play dimension cyclic: OPEN -> FIELD_LOCKED -> OPEN."
      - from: OPEN
        to: FIELD_LOCKED
        trigger: "POST /outing-ops/outings/{id}/play-transition action=LOCK_FIELD"
        actor: TournamentDirector
        preconditions:
          - "at least one Team with outing_id == this outing exists, else ERR_TEAM_INCOMPLETE"
          - "every Team of this outing has player_count == 4, else ERR_TEAM_INCOMPLETE"
        side_effects:
          - "for every Player whose registration_id belongs to a Registration of this outing with status in {CONFIRMED, AMENDED, CHECKED_IN}: sets effective_handicap_index = max(handicap_index, handicap_index_at_confirm - MAX_INDEX_IMPROVEMENT) and recomputes course_handicap from it via calculation course_handicap_conversion"
          - "for every Team of this outing: recomputes team_playing_handicap under calculation team_playing_handicap variant LOCKED from the freshly written Player.course_handicap values and sets handicap_variant = LOCKED"
          - "increments Outing.version by 1"
        note: "Three-hop cascade: outing lock -> Player.effective_handicap_index/course_handicap -> Team.team_playing_handicap."
      - from: FIELD_LOCKED
        to: IN_PLAY
        trigger: "POST /outing-ops/outings/{id}/play-transition action=START_PLAY"
        actor: TournamentDirector
        preconditions:
          - "every Team of this outing has tee_assignment_count >= 1 and starting_hole not null, else ERR_MISSING_TEE_ASSIGNMENT"
        side_effects:
          - "increments Outing.version by 1"
      - from: IN_PLAY
        to: SCORED
        trigger: "POST /outing-ops/outings/{id}/play-transition action=FINALIZE_SCORING"
        actor: TournamentDirector
        preconditions:
          - "every Team of this outing has gross_score not null, else ERR_MISSING_SCORES"
        side_effects:
          - "for every Team: recomputes net_score and the four net tiebreak fields, then writes rank_position via calculation team_ranking_tiebreak"
          - "writes Team.prize_eligible and Team.prize_award_cents via calculation prize_distribution"
          - "sets Outing.unclaimed_prize_cents = prize_pool_cents - sum(Team.prize_award_cents)"
          - "recomputes every Outing finance field via calculation net_proceeds_rollup under the current proceeds_variant"
          - "increments Outing.version by 1"
      - from: OPEN
        to: POSTPONED
        trigger: "POST /outing-ops/outings/{id}/play-transition action=POSTPONE"
        actor: TournamentDirector
        preconditions:
          - "Outing.rain_date is not null and the outing's CourseContract.rain_date_terms is in {FULL_CREDIT, PARTIAL_CREDIT}, else ERR_NO_RAIN_DATE_TERMS"
        side_effects:
          - "sets Outing.postponed_from_date = scheduled_date, then scheduled_date = rain_date, then rain_date = null"
          - "sets CourseContract.rain_credit_cents per calculation rain_date_credit and increments CourseContract.amendment_count by 1 and sets CourseContract.status = AMENDED"
          - "the new CourseContract.rain_credit_cents feeds calculation net_proceeds_rollup, so every Outing finance field is recomputed under the current proceeds_variant"
          - "for every Team of this outing: clears wave, starting_hole, tee_time, cart_number, slot_occupancy_start, slot_occupancy_end to null (tee_assignment_count is preserved)"
          - "increments Outing.version by 1"
        note: "Three-hop cascade with a different origin than the registration cancel chain: postpone -> CourseContract.rain_credit_cents/status -> Outing.direct_costs_cents -> Outing.net_proceeds_cents."
      - from: FIELD_LOCKED
        to: POSTPONED
        trigger: "POST /outing-ops/outings/{id}/play-transition action=POSTPONE"
        actor: TournamentDirector
        preconditions:
          - "Outing.rain_date is not null and the outing's CourseContract.rain_date_terms is in {FULL_CREDIT, PARTIAL_CREDIT}, else ERR_NO_RAIN_DATE_TERMS"
        side_effects:
          - "identical to the OPEN -> POSTPONED side effects"
          - "increments Outing.version by 1"
      - from: POSTPONED
        to: OPEN
        trigger: "POST /outing-ops/outings/{id}/play-transition action=RESUME"
        actor: TournamentDirector
        preconditions: ["Outing.play_status == POSTPONED"]
        side_effects:
          - "increments Outing.version by 1"
        note: "Closes the second cycle on the play dimension: OPEN -> POSTPONED -> OPEN."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /outing-ops/outings/{id}/play-transition action=CANCEL_OUTING"
        actor: TournamentDirector
        preconditions: ["Outing.finance_status == COLLECTING"]
        side_effects: ["increments Outing.version by 1"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /outing-ops/outings/{id}/play-transition action=CANCEL_OUTING"
        actor: TournamentDirector
        preconditions: ["Outing.finance_status == COLLECTING"]
        side_effects:
          - "every Registration of this outing whose status is in {PENDING_PAYMENT, WAITLISTED} moves to CANCELLED"
          - "increments Outing.version by 1"
      - from: POSTPONED
        to: CANCELLED
        trigger: "POST /outing-ops/outings/{id}/play-transition action=CANCEL_OUTING"
        actor: TournamentDirector
        preconditions: ["Outing.finance_status == COLLECTING"]
        side_effects: ["increments Outing.version by 1"]

  - entity: Outing
    dimension: finance_status
    initial_state: COLLECTING
    terminal_states: [DISBURSED]
    transitions:
      - from: COLLECTING
        to: RECONCILED
        trigger: "POST /outing-ops/outings/{id}/finance-transition action=RECONCILE"
        actor: CharityTreasurer
        preconditions:
          - "Outing.play_status == SCORED, else ERR_INVALID_STATE_TRANSITION"
          - "expected_outing_version equals Outing.version, else ERR_STALE_OUTING_VERSION"
        side_effects:
          - "sets Outing.proceeds_variant = FINAL"
          - "recomputes every Outing finance field via calculation net_proceeds_rollup under variant FINAL"
          - "increments Outing.version by 1"
      - from: RECONCILED
        to: COLLECTING
        trigger: "POST /outing-ops/outings/{id}/finance-transition action=REOPEN"
        actor: CharityTreasurer
        preconditions:
          - "Outing.finance_status == RECONCILED"
          - "expected_outing_version equals Outing.version, else ERR_STALE_OUTING_VERSION"
        side_effects:
          - "sets Outing.proceeds_variant = PROVISIONAL"
          - "recomputes every Outing finance field via calculation net_proceeds_rollup under variant PROVISIONAL"
          - "increments Outing.version by 1"
        note: "Makes the finance dimension cyclic so a late receipt reversal can be absorbed."
      - from: RECONCILED
        to: DISBURSED
        trigger: "POST /outing-ops/outings/{id}/finance-transition action=REMIT"
        actor: CharityTreasurer
        preconditions:
          - "every Registration of this outing whose status is in {CONFIRMED, AMENDED, CHECKED_IN} has receipt_issued == true and every FundraisingItem of this outing whose status is PAID has been receipted, else ERR_UNRECEIPTED_ITEMS_REMAIN"
          - "expected_outing_version equals Outing.version, else ERR_STALE_OUTING_VERSION"
        side_effects:
          - "sets Outing.beneficiary_remittance_cents = Outing.net_proceeds_cents and Outing.remittance_reference = the request's remittance_reference"
          - "sets the outing's CourseContract.settled_charge_cents = course_charge_cents + fnb_shortfall_cents - CourseContract.rain_credit_cents and CourseContract.status = SETTLED"
          - "increments Outing.version by 1"

  - entity: CourseContract
    initial_state: DRAFT
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /outing-ops/contracts/{id}/lifecycle action=SIGN"
        actor: CourseOperations
        preconditions: ["CourseContract.status == DRAFT"]
        side_effects:
          - "sets signed_at to the logical clock"
          - "increments CourseContract.version by 1"
      - from: SIGNED
        to: AMENDED
        trigger: "POST /outing-ops/contracts/{id}/lifecycle action=AMEND"
        actor: CourseOperations
        preconditions:
          - "the outing's play_status is not in {SCORED, CANCELLED}, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "overwrites each supplied amendment field (rate_per_player_cents, fnb_minimum_cents, fnb_per_player_cents, guaranteed_player_count, slope_rating, course_rating, par, tee_interval_minutes, cart_allowance_count, rain_date_terms, rain_date_credit_pct, cancellation_notice_days) and increments amendment_count by 1"
          - "if slope_rating, course_rating or par changed: for every Player of this outing recomputes course_handicap via calculation course_handicap_conversion"
          - "the freshly written Player.course_handicap values force a recompute of team_playing_handicap on every Team of this outing under the team's current handicap_variant"
          - "the freshly written Team.team_playing_handicap forces a recompute of net_score and the four net tiebreak fields on every Team whose gross_score is not null"
          - "recomputes every Outing finance field via calculation net_proceeds_rollup under the current proceeds_variant"
          - "increments CourseContract.version by 1"
        note: "Four-hop cascade from a contract amendment: contract -> Player.course_handicap -> Team.team_playing_handicap -> Team.net_score."
      - from: AMENDED
        to: SIGNED
        trigger: "POST /outing-ops/contracts/{id}/lifecycle action=SIGN"
        actor: CourseOperations
        preconditions: ["CourseContract.status == AMENDED"]
        side_effects:
          - "increments CourseContract.version by 1"
        note: "Countersigning an amendment closes the SIGNED -> AMENDED -> SIGNED cycle."
      - from: SIGNED
        to: SETTLED
        trigger: "system, cascaded from the Outing finance REMIT transition"
        actor: system
        preconditions: ["CourseContract.status is in {SIGNED, AMENDED}"]
        side_effects:
          - "sets settled_charge_cents = Outing.course_charge_cents + Outing.fnb_shortfall_cents - rain_credit_cents"
          - "increments CourseContract.version by 1"
      - from: AMENDED
        to: SETTLED
        trigger: "system, cascaded from the Outing finance REMIT transition"
        actor: system
        preconditions: ["CourseContract.status is in {SIGNED, AMENDED}"]
        side_effects:
          - "sets settled_charge_cents = Outing.course_charge_cents + Outing.fnb_shortfall_cents - rain_credit_cents"
          - "increments CourseContract.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /outing-ops/contracts/{id}/lifecycle action=VOID"
        actor: CourseOperations
        preconditions: ["no Registration of this outing has status in {CONFIRMED, AMENDED, CHECKED_IN}, else ERR_INVALID_STATE_TRANSITION"]
        side_effects: ["increments CourseContract.version by 1"]
      - from: SIGNED
        to: VOIDED
        trigger: "POST /outing-ops/contracts/{id}/lifecycle action=VOID"
        actor: CourseOperations
        preconditions:
          - "no Registration of this outing has status in {CONFIRMED, AMENDED, CHECKED_IN}, else ERR_INVALID_STATE_TRANSITION"
          - "current_utc < Outing.scheduled_date - cancellation_notice_days days, else ERR_CANCELLATION_NOTICE_VIOLATION"
        side_effects:
          - "sets the Outing.play_status to CANCELLED when it is DRAFT or OPEN"
          - "increments CourseContract.version by 1"

  - entity: Registration
    initial_state: PENDING_PAYMENT
    terminal_states: [CANCELLED, REFUNDED]
    transitions:
      - from: PENDING_PAYMENT
        to: CONFIRMED
        trigger: "POST /outing-ops/registrations/{id}/payment"
        actor: CharityTreasurer
        preconditions:
          - "Outing.play_status == OPEN, else ERR_REGISTRATION_CLOSED"
          - "held PackageTier.sold_count < PackageTier.inventory_cap, else ERR_TIER_INVENTORY_EXHAUSTED"
          - "amount_cents == held PackageTier.price_cents, else ERR_PAYMENT_AMOUNT_MISMATCH"
          - "Outing.confirmed_player_slots + Registration.player_count <= Outing.field_capacity_teams * 4"
        side_effects:
          - "sets amount_paid_cents = amount_paid_cents + amount_cents and confirmed_at to the logical clock"
          - "for every Player of this registration: sets handicap_index_at_confirm = handicap_index, then recomputes course_handicap via calculation course_handicap_conversion"
          - "re-derives PackageTier.sold_count and Outing.confirmed_player_slots"
          - "increments Registration.version by 1"
      - from: PENDING_PAYMENT
        to: WAITLISTED
        trigger: "POST /outing-ops/registrations/{id}/payment"
        actor: CharityTreasurer
        preconditions:
          - "Outing.play_status == OPEN, else ERR_REGISTRATION_CLOSED"
          - "held PackageTier.sold_count < PackageTier.inventory_cap, else ERR_TIER_INVENTORY_EXHAUSTED"
          - "amount_cents == held PackageTier.price_cents, else ERR_PAYMENT_AMOUNT_MISMATCH"
          - "Outing.confirmed_player_slots + Registration.player_count > Outing.field_capacity_teams * 4"
        side_effects:
          - "sets amount_paid_cents = amount_paid_cents + amount_cents; confirmed_at stays null and no handicap snapshot is taken"
          - "re-derives Outing.waitlisted_registration_count"
          - "increments Registration.version by 1"
        note: "Boundary: the field is full only when the sum strictly exceeds capacity, so a payment that lands exactly on field_capacity_teams * 4 confirms."
      - from: WAITLISTED
        to: CONFIRMED
        trigger: "system, cascaded from a registration CANCEL that frees player slots"
        actor: system
        preconditions:
          - "this registration is the winner of calculation waitlist_promotion for the freed slot count"
          - "Outing.play_status == OPEN"
        side_effects:
          - "sets confirmed_at to the logical clock and snapshots handicap_index_at_confirm on every Player of this registration, then recomputes their course_handicap"
          - "re-derives PackageTier.sold_count, Outing.confirmed_player_slots and Outing.waitlisted_registration_count"
          - "increments Registration.version by 1"
      - from: CONFIRMED
        to: AMENDED
        trigger: "POST /outing-ops/registrations/{id}/amend-tier"
        actor: TournamentDirector
        preconditions:
          - "Outing.play_status is in {OPEN, FIELD_LOCKED}, else ERR_REGISTRATION_CLOSED"
          - "the request's package_tier_id (the NEW tier) belongs to the same outing, else ERR_TIER_NOT_FOUND"
          - "Registration.player_count <= new PackageTier.player_slots, else ERR_INVALID_REQUEST"
          - "the request's amount_cents equals new PackageTier.price_cents - held PackageTier.price_cents (the signed delta; omitted amount_cents is read as 0), else ERR_PAYMENT_AMOUNT_MISMATCH"
          - "expected_registration_version equals Registration.version, else ERR_STALE_REGISTRATION_VERSION"
        side_effects:
          - "sets Registration.package_tier_id to the requested package_tier_id and increments amendment_count by 1"
          - "when the signed amount_cents delta is > 0 adds it to amount_paid_cents; when negative adds its absolute value to amount_refunded_cents"
          - "re-derives sold_count on both the old and the new PackageTier and entitled_asset_balance on this registration"
          - "recomputes every Outing finance field via calculation net_proceeds_rollup under the current proceeds_variant"
          - "increments Registration.version by 1"
      - from: AMENDED
        to: AMENDED
        trigger: "POST /outing-ops/registrations/{id}/amend-tier"
        actor: TournamentDirector
        preconditions:
          - "identical to the CONFIRMED -> AMENDED preconditions"
          - "expected_registration_version equals Registration.version, else ERR_STALE_REGISTRATION_VERSION"
        side_effects:
          - "identical to the CONFIRMED -> AMENDED side effects"
          - "increments Registration.version by 1"
        note: "Self-loop: a package can be re-amended any number of times while the field is open."
      - from: AMENDED
        to: CONFIRMED
        trigger: "POST /outing-ops/registrations/{id}/lifecycle action=RECONFIRM"
        actor: TournamentDirector
        preconditions:
          - "amount_paid_cents - amount_refunded_cents == held PackageTier.price_cents, else ERR_PAYMENT_AMOUNT_MISMATCH"
        side_effects:
          - "increments Registration.version by 1"
        note: "Closes the CONFIRMED -> AMENDED -> CONFIRMED cycle."
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /outing-ops/registrations/{id}/lifecycle action=CHECK_IN"
        actor: CourseOperations
        preconditions:
          - "Outing.play_status is in {FIELD_LOCKED, IN_PLAY}, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "sets checked_in = true on every Player of this registration"
          - "re-derives Outing.checked_in_player_count"
          - "increments Registration.version by 1"
      - from: AMENDED
        to: CHECKED_IN
        trigger: "POST /outing-ops/registrations/{id}/lifecycle action=CHECK_IN"
        actor: CourseOperations
        preconditions:
          - "Outing.play_status is in {FIELD_LOCKED, IN_PLAY}, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "identical to the CONFIRMED -> CHECKED_IN side effects"
          - "increments Registration.version by 1"
      - from: PENDING_PAYMENT
        to: CANCELLED
        trigger: "POST /outing-ops/registrations/{id}/lifecycle action=CANCEL"
        actor: TournamentDirector
        preconditions: ["Registration.amount_paid_cents == 0"]
        side_effects:
          - "increments Registration.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /outing-ops/registrations/{id}/lifecycle action=CANCEL"
        actor: TournamentDirector
        preconditions:
          - "Outing.finance_status == COLLECTING, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "step 1: when current_utc >= Outing.scheduled_date - CourseContract.cancellation_notice_days days, sets late_cancel_fee_cents = round_half_up(LATE_CANCEL_FEE_PCT (0.25) * amount_paid_cents) and refund = amount_paid_cents - late_cancel_fee_cents; otherwise late_cancel_fee_cents = 0 and refund = amount_paid_cents"
          - "step 2: adds refund to amount_refunded_cents; when refund > 0 the row auto-advances to REFUNDED"
          - "step 3: every SponsorAllocation whose registration_id is this registration and whose status is not RELEASED moves to RELEASED"
          - "step 4: each release in step 3 decrements the occupancy counter of its SponsorshipAsset and re-derives that asset's remaining_capacity and status"
          - "step 5: the asset counters written in step 4 re-derive Outing.reserved_asset_slot_count"
          - "step 6: every Player of this registration has team_id set to null and checked_in set to false; every Team that lost a player re-derives player_count and recomputes team_playing_handicap under its current handicap_variant"
          - "step 7: when Outing.play_status == OPEN, the winner of calculation waitlist_promotion for the freed slots advances WAITLISTED -> CONFIRMED"
          - "step 8: when a CharitableReceipt with receipt_kind REGISTRATION and no live reversal exists for this registration, a REVERSAL receipt row is appended with negated amounts and Outing.receipted_deductible_total_cents is re-derived"
          - "step 9: recomputes every Outing finance field via calculation net_proceeds_rollup under the current proceeds_variant"
          - "increments Registration.version by 1"
        note: "Deepest cascade in the scaffold: registration -> allocations -> assets -> outing inventory counter, plus the waitlist and receipt legs."
      - from: AMENDED
        to: CANCELLED
        trigger: "POST /outing-ops/registrations/{id}/lifecycle action=CANCEL"
        actor: TournamentDirector
        preconditions: ["Outing.finance_status == COLLECTING, else ERR_INVALID_STATE_TRANSITION"]
        side_effects: ["identical to the CONFIRMED -> CANCELLED cascade", "increments Registration.version by 1"]
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /outing-ops/registrations/{id}/lifecycle action=CANCEL"
        actor: TournamentDirector
        preconditions: ["Outing.finance_status == COLLECTING, else ERR_INVALID_STATE_TRANSITION"]
        side_effects: ["identical to the CONFIRMED -> CANCELLED cascade", "increments Registration.version by 1"]
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /outing-ops/registrations/{id}/lifecycle action=CANCEL"
        actor: TournamentDirector
        preconditions: ["Outing.finance_status == COLLECTING"]
        side_effects:
          - "refunds amount_paid_cents in full with no late fee (a waitlisted package never consumed a slot); when refund > 0 the row auto-advances to REFUNDED"
          - "re-derives Outing.waitlisted_registration_count"
          - "increments Registration.version by 1"
      - from: CANCELLED
        to: REFUNDED
        trigger: "system, same request as the CANCEL action when the computed refund is greater than zero"
        actor: system
        preconditions: ["amount_refunded_cents > 0"]
        side_effects: ["increments Registration.version by 1"]

  - entity: SponsorshipAsset
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "system, cascaded from POST /outing-ops/sponsor-allocations"
        actor: system
        preconditions:
          - "remaining_capacity >= 1, else ERR_ASSET_CAPACITY_EXCEEDED"
          - "status != WITHDRAWN, else ERR_ASSET_WITHDRAWN"
        side_effects:
          - "increments reserved_count by 1 and re-derives remaining_capacity"
          - "re-derives Outing.reserved_asset_slot_count"
          - "increments SponsorshipAsset.version by 1"
      - from: RESERVED
        to: COMMITTED
        trigger: "system, cascaded from POST /outing-ops/sponsor-allocations/{id}/fulfillment action=COMMIT"
        actor: system
        preconditions: ["at least one occupying allocation reached COMMITTED"]
        side_effects:
          - "decrements reserved_count by 1, increments committed_count by 1"
          - "increments SponsorshipAsset.version by 1"
      - from: COMMITTED
        to: FULFILLED
        trigger: "system, cascaded when every occupying allocation of the asset has status in {VERIFIED, WAIVED}"
        actor: system
        preconditions: ["reserved_count == 0 and committed_count == 0 and fulfilled_count >= 1"]
        side_effects:
          - "increments SponsorshipAsset.version by 1"
      - from: RESERVED
        to: AVAILABLE
        trigger: "system, cascaded from a SponsorAllocation RELEASED transition that leaves no occupying allocation"
        actor: system
        preconditions: ["reserved_count == 0 and committed_count == 0 and fulfilled_count == 0"]
        side_effects:
          - "re-derives remaining_capacity back to capacity and re-derives Outing.reserved_asset_slot_count"
          - "increments SponsorshipAsset.version by 1"
        note: "Closes the inventory cycle AVAILABLE -> RESERVED -> AVAILABLE that the conservation invariant is stated over."
      - from: COMMITTED
        to: RESERVED
        trigger: "system, cascaded from a SponsorAllocation RELEASED transition that removes the last committed allocation while a reserved one remains"
        actor: system
        preconditions: ["committed_count == 0 and reserved_count >= 1"]
        side_effects: ["increments SponsorshipAsset.version by 1"]
      - from: AVAILABLE
        to: WITHDRAWN
        trigger: "POST /outing-ops/sponsorship-assets/{id}/inventory action=WITHDRAW"
        actor: SponsorshipManager
        preconditions:
          - "reserved_count + committed_count + fulfilled_count == 0, else ERR_ASSET_OCCUPIED"
        side_effects:
          - "sets remaining_capacity to 0 so the unit leaves the sellable pool"
          - "increments SponsorshipAsset.version by 1"
      - from: WITHDRAWN
        to: AVAILABLE
        trigger: "POST /outing-ops/sponsorship-assets/{id}/inventory action=RESTORE"
        actor: SponsorshipManager
        preconditions: ["status == WITHDRAWN"]
        side_effects:
          - "re-derives remaining_capacity back to capacity"
          - "increments SponsorshipAsset.version by 1"

  - entity: SponsorAllocation
    initial_state: RESERVED
    terminal_states: [VERIFIED, WAIVED, RELEASED]
    transitions:
      - from: RESERVED
        to: COMMITTED
        trigger: "POST /outing-ops/sponsor-allocations/{id}/fulfillment action=COMMIT"
        actor: SponsorshipManager
        preconditions:
          - "the linked Registration.status is in {CONFIRMED, AMENDED, CHECKED_IN}, else ERR_REGISTRATION_NOT_REVENUE_RECOGNIZED"
          - "the linked SponsorshipAsset.status is RESERVED or COMMITTED - WITHDRAW requires zero occupancy, so an occupied asset can never be WITHDRAWN and this holds by construction"
        side_effects:
          - "sets committed_at to the logical clock"
          - "when source == UPSELL the upsell_price_cents becomes recognized revenue, so Outing.gross_revenue_cents and every downstream finance field are recomputed via calculation net_proceeds_rollup"
          - "cascades the SponsorshipAsset RESERVED -> COMMITTED transition"
          - "increments SponsorAllocation.version by 1"
      - from: COMMITTED
        to: ARTWORK_APPROVED
        trigger: "POST /outing-ops/sponsor-allocations/{id}/fulfillment action=APPROVE_ARTWORK"
        actor: SponsorshipManager
        preconditions: ["SponsorAllocation.status == COMMITTED"]
        side_effects:
          - "records artwork_approved_by_user_id from the X-User-ID header"
          - "increments SponsorAllocation.version by 1"
        note: "Fork point: the artwork path leads to VERIFIED, the waiver path to WAIVED, and the two branches write disjoint side-effect sets."
      - from: ARTWORK_APPROVED
        to: INSTALLED
        trigger: "POST /outing-ops/sponsor-allocations/{id}/fulfillment action=INSTALL"
        actor: SponsorshipManager
        preconditions: ["SponsorAllocation.status == ARTWORK_APPROVED"]
        side_effects: ["increments SponsorAllocation.version by 1"]
      - from: INSTALLED
        to: VERIFIED
        trigger: "POST /outing-ops/sponsor-allocations/{id}/fulfillment action=VERIFY"
        actor: SponsorshipManager
        preconditions:
          - "the X-User-ID differs from artwork_approved_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "records verified_by_user_id from the X-User-ID header"
          - "moves the asset counters from committed_count to fulfilled_count and re-derives SponsorshipAsset.status"
          - "increments SponsorAllocation.version by 1"
      - from: COMMITTED
        to: WAIVED
        trigger: "POST /outing-ops/sponsor-allocations/{id}/fulfillment action=WAIVE"
        actor: SponsorshipManager
        preconditions:
          - "waived_reason is a non-empty string, else ERR_INVALID_REQUEST"
        side_effects:
          - "sets fulfillment_credit_cents = round_half_up(WAIVER_CREDIT_PCT * SponsorshipAsset.list_price_cents)"
          - "the credit re-derives Registration.fulfillment_credit_cents on the linked registration"
          - "the registration credit re-derives Outing.fulfillment_credit_cents, which enters direct_costs_cents only under the FINAL variant, and every downstream finance field is recomputed"
          - "moves the asset counters from committed_count to fulfilled_count and re-derives SponsorshipAsset.status"
          - "increments SponsorAllocation.version by 1"
        note: "Three-hop cascade with an origin distinct from the registration cancel chain: allocation -> Registration.fulfillment_credit_cents -> Outing.fulfillment_credit_cents -> Outing.net_proceeds_cents."
      - from: ARTWORK_APPROVED
        to: WAIVED
        trigger: "POST /outing-ops/sponsor-allocations/{id}/fulfillment action=WAIVE"
        actor: SponsorshipManager
        preconditions: ["waived_reason is a non-empty string, else ERR_INVALID_REQUEST"]
        side_effects: ["identical to the COMMITTED -> WAIVED side effects", "increments SponsorAllocation.version by 1"]
      - from: INSTALLED
        to: WAIVED
        trigger: "POST /outing-ops/sponsor-allocations/{id}/fulfillment action=WAIVE"
        actor: SponsorshipManager
        preconditions: ["waived_reason is a non-empty string, else ERR_INVALID_REQUEST"]
        side_effects: ["identical to the COMMITTED -> WAIVED side effects", "increments SponsorAllocation.version by 1"]
      - from: RESERVED
        to: RELEASED
        trigger: "system, cascaded from a Registration CANCEL; or POST /outing-ops/sponsor-allocations/{id}/fulfillment action=RELEASE"
        actor: SponsorshipManager | system
        preconditions: ["SponsorAllocation.status is in {RESERVED, COMMITTED, ARTWORK_APPROVED, INSTALLED}"]
        side_effects:
          - "decrements the occupancy counter of the linked SponsorshipAsset and re-derives its remaining_capacity and status"
          - "re-derives Outing.reserved_asset_slot_count"
          - "when source == UPSELL and the allocation had reached COMMITTED, removes upsell_price_cents from Outing.gross_revenue_cents and recomputes the finance fields"
          - "increments SponsorAllocation.version by 1"
      - from: COMMITTED
        to: RELEASED
        trigger: "system, cascaded from a Registration CANCEL; or POST /outing-ops/sponsor-allocations/{id}/fulfillment action=RELEASE"
        actor: SponsorshipManager | system
        preconditions: ["SponsorAllocation.status is in {RESERVED, COMMITTED, ARTWORK_APPROVED, INSTALLED}"]
        side_effects: ["identical to the RESERVED -> RELEASED side effects", "increments SponsorAllocation.version by 1"]
      - from: ARTWORK_APPROVED
        to: RELEASED
        trigger: "system, cascaded from a Registration CANCEL; or POST /outing-ops/sponsor-allocations/{id}/fulfillment action=RELEASE"
        actor: SponsorshipManager | system
        preconditions: ["SponsorAllocation.status is in {RESERVED, COMMITTED, ARTWORK_APPROVED, INSTALLED}"]
        side_effects: ["identical to the RESERVED -> RELEASED side effects", "increments SponsorAllocation.version by 1"]
      - from: INSTALLED
        to: RELEASED
        trigger: "system, cascaded from a Registration CANCEL; or POST /outing-ops/sponsor-allocations/{id}/fulfillment action=RELEASE"
        actor: SponsorshipManager | system
        preconditions: ["SponsorAllocation.status is in {RESERVED, COMMITTED, ARTWORK_APPROVED, INSTALLED}"]
        side_effects: ["identical to the RESERVED -> RELEASED side effects", "increments SponsorAllocation.version by 1"]
        note: "The compensating action is available from every non-terminal fulfillment state, so the capacity conservation identity can be exercised after a three-step forward walk."

  - entity: Contest
    dimension: status
    initial_state: PLANNED
    terminal_states: [AWARDED, VOID]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /outing-ops/contests/{id}/status action=OPEN"
        actor: TournamentDirector
        preconditions:
          - "Outing.play_status is in {OPEN, FIELD_LOCKED}, else ERR_INVALID_STATE_TRANSITION"
          - "requires_insurance == false or insurance_status == BOUND, else ERR_INSURANCE_NOT_BOUND"
        side_effects: ["increments Contest.version by 1"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /outing-ops/contests/{id}/status action=CLOSE"
        actor: TournamentDirector
        preconditions: ["Outing.play_status is in {IN_PLAY, SCORED}, else ERR_INVALID_STATE_TRANSITION"]
        side_effects: ["increments Contest.version by 1"]
      - from: CLOSED
        to: AWARDED
        trigger: "POST /outing-ops/contests/{id}/award"
        actor: TournamentDirector
        preconditions:
          - "winner_player_id resolves to a Player whose registration belongs to this outing, else ERR_CROSS_OUTING_REFERENCE"
          - "when the winner has amateur_status AMATEUR and award_form resolves to CASH, awarded_value_cents <= AMATEUR_CASH_CAP_CENTS, else ERR_AMATEUR_CASH_CAP_EXCEEDED"
        side_effects:
          - "writes award_form, awarded_value_cents and witness_count per calculation contest_award_settlement"
          - "for a HOLE_IN_ONE contest with insurance_status == BOUND, adjudicates the claim: insurance_status becomes CLAIM_PAID or CLAIM_DENIED and claim_denial_reason is written"
          - "the adjudication result writes insurance_recovery_cents and contest_payout_cents"
          - "the freshly written contest_payout_cents recomputes Outing.prize_cost_cents and every downstream finance field via calculation net_proceeds_rollup"
          - "increments Contest.version by 1"
      - from: PLANNED
        to: VOID
        trigger: "POST /outing-ops/contests/{id}/status action=VOID"
        actor: TournamentDirector
        preconditions: ["Contest.status is in {PLANNED, OPEN, CLOSED}"]
        side_effects:
          - "when insurance_status == BOUND it becomes EXPIRED; the premium stays a direct cost"
          - "increments Contest.version by 1"
      - from: OPEN
        to: VOID
        trigger: "POST /outing-ops/contests/{id}/status action=VOID"
        actor: TournamentDirector
        preconditions: ["Contest.status is in {PLANNED, OPEN, CLOSED}"]
        side_effects: ["identical to the PLANNED -> VOID side effects", "increments Contest.version by 1"]
      - from: CLOSED
        to: VOID
        trigger: "POST /outing-ops/contests/{id}/status action=VOID"
        actor: TournamentDirector
        preconditions: ["Contest.status is in {PLANNED, OPEN, CLOSED}"]
        side_effects: ["identical to the PLANNED -> VOID side effects", "increments Contest.version by 1"]

  - entity: Contest
    dimension: insurance_status
    initial_state: NONE
    terminal_states: [CLAIM_PAID, CLAIM_DENIED, EXPIRED]
    transitions:
      - from: NONE
        to: BOUND
        trigger: "POST /outing-ops/contests/{id}/insurance"
        actor: SponsorshipManager
        preconditions:
          - "Contest.status is in {PLANNED, OPEN}, else ERR_INVALID_STATE_TRANSITION"
          - "insurance_coverage_cap_cents >= 1, else ERR_INVALID_REQUEST"
        side_effects:
          - "stores the carrier terms, sets insurance_bound_at to the logical clock"
          - "adds insurance_premium_cents to Outing.insurance_cost_cents and recomputes the finance fields"
          - "increments Contest.version by 1"
      - from: BOUND
        to: CLAIM_PAID
        trigger: "system, cascaded from the Contest CLOSED -> AWARDED transition"
        actor: system
        preconditions:
          - "contest_type == HOLE_IN_ONE and yardage >= insurance_min_yardage and witness_count >= insurance_required_witness_count and awarded_value_cents <= insurance_coverage_cap_cents"
        side_effects:
          - "sets insurance_recovery_cents = min(awarded_value_cents, insurance_coverage_cap_cents) and claim_denial_reason = NONE"
          - "increments Contest.version by 1"
      - from: BOUND
        to: CLAIM_DENIED
        trigger: "system, cascaded from the Contest CLOSED -> AWARDED transition"
        actor: system
        preconditions:
          - "contest_type == HOLE_IN_ONE and at least one of: yardage < insurance_min_yardage, witness_count < insurance_required_witness_count, awarded_value_cents > insurance_coverage_cap_cents"
        side_effects:
          - "sets insurance_recovery_cents = 0 and claim_denial_reason to the first failing check in the order YARDAGE_BELOW_MINIMUM, INSUFFICIENT_WITNESSES, COVERAGE_CAP_EXCEEDED"
          - "increments Contest.version by 1"
      - from: BOUND
        to: EXPIRED
        trigger: "system, cascaded from any Contest transition into VOID"
        actor: system
        preconditions: ["Contest.status becomes VOID"]
        side_effects: ["increments Contest.version by 1"]

  - entity: FundraisingItem
    initial_state: LISTED
    terminal_states: [RECEIPTED]
    transitions:
      - from: LISTED
        to: SOLD
        trigger: "POST /outing-ops/fundraising-items/{id}/sale"
        actor: CharityTreasurer
        preconditions:
          - "buyer_registration_id resolves to a Registration of this outing, else ERR_REGISTRATION_NOT_FOUND"
          - "bid_cents >= ask_cents, else ERR_INSUFFICIENT_BID"
        side_effects:
          - "stores bid_cents, buyer_registration_id, recorded_by_user_id from X-User-ID and sold_at from the logical clock"
          - "increments FundraisingItem.version by 1"
      - from: SOLD
        to: PAID
        trigger: "POST /outing-ops/fundraising-items/{id}/payment"
        actor: CharityTreasurer
        preconditions:
          - "amount_cents == bid_cents, else ERR_PAYMENT_AMOUNT_MISMATCH"
        side_effects:
          - "sets collected_cents = amount_cents"
          - "adds collected_cents to Outing.gross_revenue_cents and recomputes the finance fields"
          - "increments FundraisingItem.version by 1"
      - from: PAID
        to: RECEIPTED
        trigger: "system, cascaded from POST /outing-ops/receipts with receipt_kind FUNDRAISING_ITEM"
        actor: system
        preconditions: ["a CharitableReceipt row for this item exists"]
        side_effects: ["increments FundraisingItem.version by 1"]
      - from: SOLD
        to: VOID
        trigger: "POST /outing-ops/fundraising-items/{id}/lifecycle action=VOID"
        actor: CharityTreasurer
        preconditions: ["FundraisingItem.status == SOLD"]
        side_effects:
          - "clears buyer_registration_id, bid_cents and recorded_by_user_id and increments void_count by 1"
          - "increments FundraisingItem.version by 1"
      - from: VOID
        to: LISTED
        trigger: "POST /outing-ops/fundraising-items/{id}/lifecycle action=RELIST"
        actor: CharityTreasurer
        preconditions: ["FundraisingItem.status == VOID"]
        side_effects: ["increments FundraisingItem.version by 1"]
        note: "Closes the SOLD -> VOID -> LISTED cycle for a retracted bid."

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules  (OCC on the parent's version, no other mechanism)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: tee-assignment-supersede-stale-team
    parent_entity: Team
    write_endpoint: "POST /outing-ops/teams/{id}/tee-assignment"
    occ_field: "expected_team_version"
    description: |
      Writing a tee assignment for a Team whose version has advanced since the
      client last read it is rejected. A second assignment is a legitimate
      product operation - it supersedes the earlier pairing, which is why the
      write cannot be resolved by a state precondition - so the client must
      prove it saw the pairing it intends to replace.
    error_id: ERR_STALE_TEAM_VERSION
    http_status: 412
  - rule_id: amend-tier-supersede-stale-registration
    parent_entity: Registration
    write_endpoint: "POST /outing-ops/registrations/{id}/amend-tier"
    occ_field: "expected_registration_version"
    description: |
      Amending the package tier of a Registration whose version has advanced
      since the client last read it is rejected. Re-amending is legitimate and
      repeatable (AMENDED -> AMENDED), so no state precondition can catch a
      client working from a superseded tier and price delta.
    error_id: ERR_STALE_REGISTRATION_VERSION
    http_status: 412
  - rule_id: finance-transition-stale-outing
    parent_entity: Outing
    write_endpoint: "POST /outing-ops/outings/{id}/finance-transition"
    occ_field: "expected_outing_version"
    description: |
      A finance transition on an Outing whose version has advanced since the
      client last read it is rejected. RECONCILE and REOPEN legitimately
      supersede the previously published figures, so the treasurer must prove
      the reconciliation was computed from the version now on file.
    error_id: ERR_STALE_OUTING_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: course_handicap_conversion
    trigger: "on Registration PENDING_PAYMENT -> CONFIRMED, on the WAITLISTED -> CONFIRMED promotion, on Outing OPEN -> FIELD_LOCKED, on CourseContract SIGNED -> AMENDED when a rating field changes, and on POST /outing-ops/players/{id}/handicap-index"
    algorithm: threshold
    formula: |
      raw = index_in_use * (contract.slope_rating / 113) + (contract.course_rating - contract.par)
      course_handicap = min(MAX_COURSE_HANDICAP, max(0, round_half_up(raw, 0)))
      # index_in_use is chosen by the caller:
      #   PROVISIONAL variant -> player.handicap_index_at_confirm
      #   LOCKED     variant -> player.effective_handicap_index
    input_set: "Player rows whose registration_id points at a Registration with status in {CONFIRMED, AMENDED, CHECKED_IN}; players on PENDING_PAYMENT, WAITLISTED, CANCELLED or REFUNDED registrations keep course_handicap null"
    constants:
      MAX_COURSE_HANDICAP: 36
      MAX_INDEX_IMPROVEMENT: 3.0
    precision: "integer, round_half_up on the .5 boundary, clamped into [0, 36]"
    variants:
      - name: at_confirm_index
        when: "Registration reaches CONFIRMED, or the outing is still OPEN"
        difference: "index_in_use = handicap_index_at_confirm; effective_handicap_index stays null"
      - name: sandbag_capped_index
        when: "Outing OPEN -> FIELD_LOCKED"
        difference: "effective_handicap_index = max(handicap_index, handicap_index_at_confirm - MAX_INDEX_IMPROVEMENT) is written first and then used as index_in_use, so an index that dropped more than 3.0 strokes since confirmation is only credited with a 3.0 stroke improvement"

  - name: team_playing_handicap
    trigger: "on Outing OPEN -> FIELD_LOCKED (variant LOCKED), on Outing FIELD_LOCKED -> OPEN (variant PROVISIONAL), on POST /outing-ops/teams (variant PROVISIONAL), on any cascade that re-derives Team.player_count, and on the CourseContract SIGNED -> AMENDED rating cascade"
    algorithm: weighted_scoring
    formula: |
      # Step 1 - per player, ALWAYS round the allowance to a whole stroke FIRST.
      #          The scaffold pins per-player rounding before aggregation; the
      #          alternative order (aggregate the raw products, round once at the
      #          end) is explicitly NOT the contract.
      ch[] = the course_handicap of each Player whose team_id == team.id,
             sorted ASCENDING; ties in value keep created_at ASC order
      if outing.format == SCRAMBLE:
          # four weights against the sorted list, low handicap first
          w = [0.20, 0.15, 0.10, 0.05]
          parts[i] = w[i] * ch[i]                      # not rounded per part
          team_playing_handicap = round_half_up(sum(parts), 1)
      if outing.format == BEST_BALL:
          allow[i] = round_half_up(BEST_BALL_ALLOWANCE_PCT * ch[i], 0)   # per-player rounding
          team_playing_handicap = round_half_up(0.25 * sum(allow), 1)
      if outing.format == STROKE_PLAY:
          allow[i] = round_half_up(STROKE_PLAY_ALLOWANCE_PCT * ch[i], 0)
          team_playing_handicap = round_half_up(0.25 * sum(allow), 1)
      # A team with fewer than 4 players uses only the players present; the
      # SCRAMBLE weight vector is applied from index 0 upward and the missing
      # weights are dropped (never redistributed).
    input_set: "Player rows with team_id == team.id whose owning Registration status is in {CONFIRMED, AMENDED, CHECKED_IN}; players whose registration was cancelled have already been unlinked by the cancel cascade"
    constants:
      SCRAMBLE_WEIGHTS: [0.20, 0.15, 0.10, 0.05]
      BEST_BALL_ALLOWANCE_PCT: 0.90
      STROKE_PLAY_ALLOWANCE_PCT: 1.00
    precision: "one decimal place, round_half_up; per-player allowances are whole strokes rounded half_up BEFORE the 0.25 aggregation"
    variants:
      - name: PROVISIONAL
        when: "the outing has not yet been locked, or has been reopened from FIELD_LOCKED"
        difference: "each ch[i] comes from course_handicap computed with variant at_confirm_index, i.e. the index snapshotted when the package was confirmed"
      - name: LOCKED
        when: "Outing OPEN -> FIELD_LOCKED"
        difference: "each ch[i] comes from course_handicap computed with variant sandbag_capped_index, so a player who reported a much lower index after confirmation shifts the team handicap by a different, capped amount"

  - name: team_ranking_tiebreak
    trigger: "on Outing IN_PLAY -> SCORED"
    algorithm: chronological
    formula: |
      net_score      = round_half_up(gross_score - team_playing_handicap, 1)
      net_back_9     = round_half_up(gross_back_9 - team_playing_handicap / 2, 2)
      net_back_6     = round_half_up(gross_back_6 - team_playing_handicap / 3, 2)
      net_back_3     = round_half_up(gross_back_3 - team_playing_handicap / 6, 2)
      net_hole_18    = round_half_up(gross_hole_18 - team_playing_handicap / 18, 2)
      # Ordering key, applied strictly in this sequence:
      #   1. net_score ASC
      #   2. net_back_9 ASC        (USGA matching cards)
      #   3. net_back_6 ASC
      #   4. net_back_3 ASC
      #   5. net_hole_18 ASC
      #   6. team_playing_handicap ASC   (the lower-handicap team wins a dead heat)
      #   7. Team.created_at ASC         (final deterministic fallback; Team.id is never consulted)
      rank_position = 1-based index in that ordering; every team receives a
      distinct rank_position because key 7 is total.
    input_set: "every Team with outing_id == outing.id; a team whose gross_score is null blocks the transition, so the ranked set is always the full field"
    constants: {}
    precision: "net_score to 1 decimal, the four tiebreak metrics to 2 decimals, all round_half_up"

  - name: prize_distribution
    trigger: "on Outing IN_PLAY -> SCORED, immediately after team_ranking_tiebreak has written every rank_position"
    algorithm: waterfall_allocation
    formula: |
      # Eligibility filter (cash prizes only reach amateur-only groups):
      prize_eligible(team) = no Player with team_id == team.id has
                             amateur_status == PROFESSIONAL
      eligible[] = teams with prize_eligible == true, ordered by rank_position ASC
      # Waterfall over an ordered share vector. The k-th eligible team takes the
      # k-th share, so an ineligible team does not consume a share.
      shares = [0.50, 0.30, 0.20]
      for k in 0..2:
          if k < len(eligible):
              if k < 2:
                  award = round_half_up(shares[k] * outing.prize_pool_cents, 0)
              else:
                  award = outing.prize_pool_cents - (already awarded amount)
                  # the LAST funded share absorbs the rounding remainder
              eligible[k].prize_award_cents = award
      every other team keeps prize_award_cents = 0
      outing.unclaimed_prize_cents = outing.prize_pool_cents - sum(prize_award_cents)
      # Empty-pool fallback: when eligible[] is empty no award is written, and
      # the whole prize_pool_cents lands in unclaimed_prize_cents.
    input_set: "Team rows of the outing with rank_position not null; PROFESSIONAL detection reads Player rows currently linked to the team"
    constants:
      PRIZE_SHARES: [0.50, 0.30, 0.20]
    precision: "whole cents; shares 1 and 2 round_half_up, the last funded share is the residual so the awarded total never drifts from prize_pool_cents unless fewer than three teams are eligible"

  - name: net_proceeds_rollup
    trigger: "on Outing IN_PLAY -> SCORED, on every finance transition, on registration payment / amend-tier / cancel, on allocation COMMIT / WAIVE / RELEASE, on fundraising payment, on contest insurance binding and award, and on the POSTPONE rain-credit cascade"
    algorithm: waterfall_allocation
    formula: |
      # --- step 1: gross revenue -------------------------------------------
      gross_revenue_cents =
            sum(Registration.amount_paid_cents  where status in {CONFIRMED, AMENDED, CHECKED_IN})
          + sum(SponsorAllocation.upsell_price_cents where allocation.status in
                {COMMITTED, ARTWORK_APPROVED, INSTALLED, VERIFIED, WAIVED})
          + sum(FundraisingItem.collected_cents where status in {PAID, RECEIPTED})
      # --- step 2: refunds --------------------------------------------------
      refunded_cents = sum(Registration.amount_refunded_cents over ALL registrations
                           of the outing, whatever their status)
      # --- step 3: course charge (billable_players is variant-dependent) ----
      course_charge_cents = max(billable_players, contract.guaranteed_player_count)
                            * contract.rate_per_player_cents
      # --- step 4: food and beverage minimum -------------------------------
      fnb_actual_cents    = billable_players * contract.fnb_per_player_cents
      fnb_shortfall_cents = max(0, contract.fnb_minimum_cents - fnb_actual_cents)
      # --- step 5: prize and insurance costs -------------------------------
      insurance_cost_cents = sum(Contest.insurance_premium_cents where
                                 insurance_status in {BOUND, CLAIM_PAID, CLAIM_DENIED, EXPIRED})
      prize_cost_cents     = variant-dependent (see variants)
      # --- step 6: direct costs --------------------------------------------
      direct_costs_cents = course_charge_cents + fnb_shortfall_cents
                         + insurance_cost_cents + prize_cost_cents
                         - contract.rain_credit_cents
                         + (FINAL variant only: fulfillment_credit_cents)
      # --- step 7: pinned evaluation order for the administrative fee ------
      # The fee RATE is keyed off the before-fee net, while the fee BASE is
      # gross revenue. The order below is the contract; evaluating the tier
      # against the after-fee net would be circular and is forbidden.
      net_proceeds_before_fee_cents = gross_revenue_cents - refunded_cents - direct_costs_cents
      admin_fee_pct = 0 if net_proceeds_before_fee_cents <= 0
                      else 0.05  if net_proceeds_before_fee_cents <  2000000
                      else 0.035 if net_proceeds_before_fee_cents <  5000000
                      else 0.02
      admin_fee_cents   = round_half_up(admin_fee_pct * gross_revenue_cents, 0)
      net_proceeds_cents = net_proceeds_before_fee_cents - admin_fee_cents
    input_set: "every Registration, SponsorAllocation, FundraisingItem and Contest of the outing, filtered by the status sets named in each step; the outing's single CourseContract supplies the rate, minimum and rain credit"
    constants:
      ADMIN_FEE_TIER_1_LIMIT_CENTS: 2000000
      ADMIN_FEE_TIER_2_LIMIT_CENTS: 5000000
      ADMIN_FEE_PCT_TIER_1: 0.05
      ADMIN_FEE_PCT_TIER_2: 0.035
      ADMIN_FEE_PCT_TIER_3: 0.02
    precision: "whole cents; admin_fee_cents is the only rounded quantity and is rounded once, half_up, after the tier has been selected"
    variants:
      - name: PROVISIONAL
        when: "Outing.proceeds_variant == PROVISIONAL, i.e. before RECONCILE or after REOPEN"
        difference: "billable_players = Outing.confirmed_player_slots (sold slots); prize_cost_cents = Outing.prize_pool_cents in full plus sum(Contest.contest_payout_cents); Outing.fulfillment_credit_cents is EXCLUDED from direct costs"
      - name: FINAL
        when: "Outing.proceeds_variant == FINAL, written by the RECONCILE transition"
        difference: "billable_players = Outing.checked_in_player_count (turnout, still floored by guaranteed_player_count in step 3 but NOT floored in the step-4 food and beverage credit); prize_cost_cents = sum(Team.prize_award_cents) + sum(Contest.contest_payout_cents), so an unclaimed placement prize is not a cost; Outing.fulfillment_credit_cents IS added to direct costs"

  - name: charitable_deductible
    trigger: "on POST /outing-ops/receipts and on POST /outing-ops/receipts/{id}/reversal"
    algorithm: threshold
    formula: |
      if receipt_kind == REGISTRATION:
          payment_cents = registration.amount_paid_cents - registration.amount_refunded_cents
          declared_gsv  = held PackageTier.gsv_cents
          # token-benefit rule: an insubstantial benefit is disregarded entirely
          token_ceiling = min(TOKEN_GSV_CAP_CENTS,
                              round_half_up(TOKEN_GSV_PCT * payment_cents, 0))
          gsv_cents = 0 if declared_gsv <= token_ceiling else declared_gsv
          deductible_amount_cents = max(0, payment_cents - gsv_cents)
      if receipt_kind == FUNDRAISING_ITEM:
          payment_cents = item.collected_cents
          if item.item_type == RAFFLE: rejected with ERR_RAFFLE_NOT_DEDUCTIBLE
          if item.item_type == AUCTION:
              gsv_cents = item.fmv_cents            # token rule does NOT apply to auction lots
              deductible_amount_cents = max(0, payment_cents - gsv_cents)
          if item.item_type == DONATION:
              gsv_cents = 0
              deductible_amount_cents = payment_cents
      if receipt_kind == REVERSAL:
          payment_cents           = -original.payment_cents
          gsv_cents               = -original.gsv_cents
          deductible_amount_cents = -original.deductible_amount_cents
      outing.receipted_deductible_total_cents = signed sum of deductible_amount_cents
                                                over every receipt of the outing
    input_set: "exactly one subject row - the Registration, the FundraisingItem, or the reversed CharitableReceipt named by the request; a receipt may never reference two subjects"
    constants:
      TOKEN_GSV_CAP_CENTS: 1300
      TOKEN_GSV_PCT: 0.02
    precision: "whole cents; the token ceiling is rounded half_up before the comparison, and the comparison is <= so a benefit sitting exactly on the ceiling is disregarded"

  - name: waitlist_promotion
    trigger: "as step 7 of the Registration CANCEL cascade, when Outing.play_status == OPEN"
    algorithm: aggregation
    formula: |
      freed_slots = the cancelled registration's player_count
      # (a) eligibility filter
      candidates = Registration rows where outing_id == outing.id
                   AND status == WAITLISTED
                   AND player_count <= freed_slots
      # (b) ranking expression
      order candidates by held PackageTier.price_cents DESC
      # (c) tie-break
      then by Registration.created_at ASC        # Registration.id is never consulted
      # (d) empty-set fallback
      if candidates is empty: no promotion happens, the freed slots simply
      return to Outing.confirmed_player_slots headroom and
      Outing.waitlisted_registration_count is unchanged
      winner = first candidate; exactly ONE registration is promoted per cancel
    input_set: "Registration rows of the same outing with status == WAITLISTED at the instant step 6 of the cancel cascade completes"
    constants: {}
    precision: "n/a - selection, not arithmetic"

  - name: asset_occupancy_availability
    trigger: "on POST /outing-ops/sponsor-allocations, on every SponsorAllocation status change, and on the sponsorship-asset inventory actions"
    algorithm: aggregation
    formula: |
      reserved_count   = count(occupying allocations with status == RESERVED)
      committed_count  = count(occupying allocations with status in
                               {COMMITTED, ARTWORK_APPROVED, INSTALLED})
      fulfilled_count  = count(occupying allocations with status in {VERIFIED, WAIVED})
      occupied         = reserved_count + committed_count + fulfilled_count
      remaining_capacity = 0 if status == WITHDRAWN else capacity - occupied
      # conservation invariant, checked before and after any forward action and
      # its compensating action:
      #   capacity == remaining_capacity + reserved_count + committed_count + fulfilled_count
      #   outing.reserved_asset_slot_count == sum over the outing's assets of occupied
      status = WITHDRAWN                       if withdrawn manually
             = AVAILABLE                       if occupied == 0
             = RESERVED                        if reserved_count > 0 and committed_count == 0 and fulfilled_count == 0
             = COMMITTED                       if committed_count > 0
             = FULFILLED                       if committed_count == 0 and reserved_count == 0 and fulfilled_count > 0
    input_set: "SponsorAllocation rows whose sponsorship_asset_id == asset.id and whose status is not RELEASED; RELEASED allocations never occupy capacity"
    constants:
      WAIVER_CREDIT_PCT: 0.60
    precision: "integer counters; a reservation is admitted only while remaining_capacity >= 1, so the boundary case remaining_capacity == 0 always fails"

  - name: contest_award_settlement
    trigger: "on Contest CLOSED -> AWARDED"
    algorithm: threshold
    formula: |
      winner = Player named by winner_player_id
      # amateur status governs the FORM of the award
      if winner.amateur_status == AMATEUR and contest.prize_form == CASH:
          if contest.prize_value_cents > AMATEUR_CASH_CAP_CENTS:
              reject with ERR_AMATEUR_CASH_CAP_EXCEEDED
          award_form = CASH
      elif winner.amateur_status == AMATEUR:
          award_form = MERCHANDISE_CREDIT
      else:
          award_form = contest.prize_form          # a professional may take cash
      awarded_value_cents = contest.prize_value_cents
      # insurance adjudication, hole-in-one only
      if contest_type == HOLE_IN_ONE and insurance_status == BOUND:
          if yardage < insurance_min_yardage:                 deny YARDAGE_BELOW_MINIMUM
          elif witness_count < insurance_required_witness_count: deny INSUFFICIENT_WITNESSES
          elif awarded_value_cents > insurance_coverage_cap_cents: deny COVERAGE_CAP_EXCEEDED
          else: insurance_status = CLAIM_PAID
                insurance_recovery_cents = min(awarded_value_cents, insurance_coverage_cap_cents)
      elif contest_type == HOLE_IN_ONE:
          claim_denial_reason = NO_POLICY
      contest_payout_cents = awarded_value_cents - insurance_recovery_cents
    input_set: "the single Contest row plus the Player named by winner_player_id; the checks run in the listed order so the FIRST failing condition names claim_denial_reason"
    constants:
      AMATEUR_CASH_CAP_CENTS: 75000
      INSURANCE_REQUIRED_THRESHOLD_CENTS: 500000
    precision: "whole cents; the yardage comparison is >= so a hole measured exactly at insurance_min_yardage is covered"

  - name: rain_date_credit
    trigger: "on Outing OPEN -> POSTPONED and FIELD_LOCKED -> POSTPONED"
    algorithm: threshold
    formula: |
      base = outing.course_charge_cents as it stands before the postponement
      rain_credit_cents = base                                        if rain_date_terms == FULL_CREDIT
                        = round_half_up(rain_date_credit_pct * base, 0) if rain_date_terms == PARTIAL_CREDIT
                        = 0                                           if rain_date_terms == NONE
      # NONE also blocks the transition, so 0 is only ever written by a
      # contract amendment that removes the terms after a postponement.
    input_set: "the outing's single CourseContract and the outing's current course_charge_cents"
    constants: {}
    precision: "whole cents, round_half_up"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority; lower number wins)
# ---------------------------------------------------------------------------
# The ladder is fixed for every endpoint: authentication, authorization,
# request schema, path existence, body-reference existence, ownership,
# state preconditions, optimistic concurrency, then the business tiers in the
# order safety -> referential -> temporal -> constraint -> fiscal. When a single
# request violates two rules the SMALLER priority number is the response.
validations:
  - priority: 1
    category: auth
    check: "X-User-Id and X-User-Role headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the caller's role appears in the endpoint's roles list; for role Participant the acting user must additionally be the Player row addressed by the request"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "request body and query schema - every required input present, enums within their declared value set, integers non-negative where the field is a _cents or _count field, timestamps ISO-8601 UTC with a trailing Z, arrays non-empty where required, and no unknown mutation of a computed or system field"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 4
    category: existence
    check: "every id embedded in the path resolves to a live row, resolved left to right so the outer segment is reported first"
    error_id: ERR_OUTING_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_TIER_NOT_FOUND | ERR_REGISTRATION_NOT_FOUND | ERR_PLAYER_NOT_FOUND | ERR_TEAM_NOT_FOUND | ERR_ASSET_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_CONTEST_NOT_FOUND | ERR_ITEM_NOT_FOUND | ERR_RECEIPT_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying a path parameter"

  - priority: 5
    category: existence
    check: "every foreign key supplied in the request body resolves to a live row, checked in the field order declared by the endpoint's input list"
    error_id: ERR_OUTING_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_TIER_NOT_FOUND | ERR_REGISTRATION_NOT_FOUND | ERR_PLAYER_NOT_FOUND | ERR_TEAM_NOT_FOUND | ERR_ASSET_NOT_FOUND | ERR_CONTEST_NOT_FOUND | ERR_ITEM_NOT_FOUND | ERR_RECEIPT_NOT_FOUND
    http_status: 404
    applies_to: "POST /outing-ops/registrations, POST /outing-ops/players, POST /outing-ops/teams, POST /outing-ops/sponsor-allocations, POST /outing-ops/receipts, POST /outing-ops/contests/{id}/award, POST /outing-ops/fundraising-items/{id}/sale, POST /outing-ops/registrations/{id}/amend-tier"
  - priority: 6
    category: business_referential
    check: "all rows named by one request belong to the same Outing - a registration's tier, a team's players, an allocation's registration and asset, a contest winner's team, a receipt's registration or item"
    error_id: ERR_CROSS_OUTING_REFERENCE
    http_status: 409
    applies_to: "POST /outing-ops/registrations, POST /outing-ops/teams, POST /outing-ops/sponsor-allocations, POST /outing-ops/receipts, POST /outing-ops/contests/{id}/award, POST /outing-ops/registrations/{id}/amend-tier"

  - priority: 7
    category: business_referential
    check: "a receipt names exactly one subject - registration_id XOR fundraising_item_id for a forward receipt, reverses_receipt_id alone for a REVERSAL"
    error_id: ERR_RECEIPT_SUBJECT_AMBIGUOUS
    http_status: 422
    applies_to: "POST /outing-ops/receipts, POST /outing-ops/receipts/{id}/reversal"

  - priority: 8
    category: state
    check: "the requested action is an edge declared out of the target row's current state in its §1.2 state machine, including the parallel-dimension machines on Outing and Contest"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 9
    category: state
    check: "the owning Outing.play_status is OPEN when the request sells, amends or adds field capacity - registrations, payments, tier amendments, team creation, sponsor allocations and fundraising sales all require an open outing"
    error_id: ERR_REGISTRATION_CLOSED
    http_status: 409
    applies_to: "POST /outing-ops/registrations, POST /outing-ops/registrations/{id}/payment, POST /outing-ops/registrations/{id}/amend-tier, POST /outing-ops/teams, POST /outing-ops/sponsor-allocations, POST /outing-ops/fundraising-items/{id}/sale"

  - priority: 10
    category: state
    check: "CharitableReceipt is append-only - it exposes no update or delete endpoint and a REVERSAL may not itself be reversed, nor may a receipt be reversed twice"
    error_id: ERR_RECEIPT_IMMUTABLE
    http_status: 409
    applies_to: "POST /outing-ops/receipts/{id}/reversal"

  - priority: 11
    category: state
    check: "the supplied expected_<parent>_version equals the row's current version; evaluated only after the state precondition above has passed, so a request that is both wrongly-sequenced and stale reports the state error"
    error_id: ERR_STALE_TEAM_VERSION | ERR_STALE_REGISTRATION_VERSION | ERR_STALE_OUTING_VERSION
    http_status: 412
    applies_to: "POST /outing-ops/teams/{id}/tee-assignment, POST /outing-ops/registrations/{id}/amend-tier, POST /outing-ops/outings/{id}/finance-transition"

  - priority: 12
    category: business_safety
    check: "the outing's CourseContract is in status SIGNED or AMENDED before the outing may leave DRAFT for OPEN; an outing with no contract at all fails the same check"
    error_id: ERR_CONTRACT_NOT_SIGNED
    http_status: 409
    applies_to: "POST /outing-ops/outings/{id}/play-transition"

  - priority: 13
    category: business_safety
    check: "a Contest whose prize_value_cents is at or above INSURANCE_REQUIRED_THRESHOLD_CENTS (500000) carries requires_insurance true and may only reach OPEN while insurance_status == BOUND"
    error_id: ERR_INSURANCE_NOT_BOUND
    http_status: 409
    applies_to: "POST /outing-ops/contests/{id}/status"

  - priority: 14
    category: business_safety
    check: "every Team of the outing has a non-null gross_score, gross_back_9, gross_back_6, gross_back_3 and gross_hole_18 before IN_PLAY -> SCORED, and every non-VOID Contest has left OPEN"
    error_id: ERR_MISSING_SCORES
    http_status: 409
    applies_to: "POST /outing-ops/outings/{id}/play-transition"

  - priority: 15
    category: business_safety
    check: "segregation of duties on X-User-Id - the user who approved an allocation's artwork may not verify its installation, and the user who recorded a fundraising sale may not issue that item's charitable receipt"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /outing-ops/sponsor-allocations/{id}/fulfillment, POST /outing-ops/receipts"

  - priority: 16
    category: business_safety
    check: "a CASH contest prize awarded to an AMATEUR winner may not exceed AMATEUR_CASH_CAP_CENTS (75000); a non-cash prize form is converted to MERCHANDISE_CREDIT instead of rejected"
    error_id: ERR_AMATEUR_CASH_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /outing-ops/contests/{id}/award"

  - priority: 17
    category: business_safety
    check: "no charitable receipt may be issued for a RAFFLE item, whatever the amount collected"
    error_id: ERR_RAFFLE_NOT_DEDUCTIBLE
    http_status: 422
    applies_to: "POST /outing-ops/receipts"

  - priority: 18
    category: business_referential
    check: "a Player may belong to at most one Team, and a Team may only accept players whose owning Registration is CONFIRMED, AMENDED or CHECKED_IN"
    error_id: ERR_PLAYER_ALREADY_ASSIGNED
    http_status: 409
    applies_to: "POST /outing-ops/teams"

  - priority: 19
    category: business_referential
    check: "an allocation created with source PACKAGE_ENTITLEMENT targets an asset whose asset_type equals the held PackageTier.entitled_asset_type"
    error_id: ERR_ASSET_TYPE_MISMATCH
    http_status: 409
    applies_to: "POST /outing-ops/sponsor-allocations"

  - priority: 20
    category: business_referential
    check: "an allocation with source PACKAGE_ENTITLEMENT requires Registration.entitled_asset_balance >= 1; an allocation with source UPSELL requires a positive upsell_price_cents and consumes no balance"
    error_id: ERR_ALLOCATION_NOT_ENTITLED
    http_status: 409
    applies_to: "POST /outing-ops/sponsor-allocations"

  - priority: 21
    category: business_temporal
    check: "tee-sheet occupancy - for a given Outing and starting_hole the interval [tee_time, tee_time + contract.tee_interval_minutes) may hold only one Team; the interval is HALF-OPEN so a team teeing off exactly when the previous group's interval ends is accepted"
    error_id: ERR_TEE_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /outing-ops/teams/{id}/tee-assignment"

  - priority: 22
    category: business_temporal
    check: "sponsorship service windows - for a given SponsorshipAsset two allocations conflict when [start - CHANGEOVER_BUFFER_MINUTES, end + CHANGEOVER_BUFFER_MINUTES] intervals intersect; the interval is CLOSED and padded 30 minutes on BOTH sides, so windows that merely touch DO conflict"
    error_id: ERR_SERVICE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /outing-ops/sponsor-allocations"

  - priority: 23
    category: business_temporal
    check: "a cart_number reused across waves needs CART_TREAD time - the previous holder's wave must end at least CART_TURNAROUND_MINUTES (30) before the new holder's wave starts, and a cart may never be issued less than CART_PREP_MINUTES (15) before its own wave start"
    error_id: ERR_CART_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /outing-ops/teams/{id}/tee-assignment"

  - priority: 24
    category: business_temporal
    check: "a team's tee_time falls inside the window of the wave it was assigned to - [wave_a_start, wave_a_end] for wave A and [wave_b_start, wave_b_end] for wave B - and when start_format is SHOTGUN every team of a wave shares that wave's start instant"
    error_id: ERR_WAVE_WINDOW_VIOLATION
    http_status: 409
    applies_to: "POST /outing-ops/teams/{id}/tee-assignment"

  - priority: 25
    category: business_temporal
    check: "artwork approval and installation verification happen at or before SponsorshipAsset.fulfillment_due_at as read from the logical clock"
    error_id: ERR_FULFILLMENT_WINDOW_ELAPSED
    http_status: 409
    applies_to: "POST /outing-ops/sponsor-allocations/{id}/fulfillment"

  - priority: 26
    category: business_temporal
    check: "a contract may only be VOIDED while the logical clock is at least cancellation_notice_days before Outing.scheduled_date"
    error_id: ERR_CANCELLATION_NOTICE_VIOLATION
    http_status: 409
    applies_to: "POST /outing-ops/contracts/{id}/lifecycle"

  - priority: 27
    category: business_constraint
    check: "cart_number may not exceed CourseContract.cart_allowance_count, and the count of distinct cart_number values assigned within one wave may not exceed it either"
    error_id: ERR_CART_ALLOWANCE_EXCEEDED
    http_status: 409
    applies_to: "POST /outing-ops/teams/{id}/tee-assignment"

  - priority: 28
    category: business_constraint
    check: "a SponsorshipAsset admits a new allocation only while status != WITHDRAWN AND remaining_capacity >= 1, evaluated in that order: a WITHDRAWN asset reports ERR_ASSET_WITHDRAWN even though its remaining_capacity also reads 0, while a live asset sitting exactly on the boundary value 0 reports ERR_ASSET_CAPACITY_EXCEEDED"
    error_id: ERR_ASSET_WITHDRAWN | ERR_ASSET_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /outing-ops/sponsor-allocations"

  - priority: 29
    category: business_constraint
    check: "an asset flagged exclusive true accepts at most one non-RELEASED allocation regardless of its declared capacity"
    error_id: ERR_EXCLUSIVE_ASSET_CONFLICT
    http_status: 409
    applies_to: "POST /outing-ops/sponsor-allocations"

  - priority: 30
    category: business_constraint
    check: "PackageTier.sold_count may not exceed PackageTier.inventory_cap; the cap counts registrations in CONFIRMED, AMENDED and CHECKED_IN and is released by cancellation"
    error_id: ERR_TIER_INVENTORY_EXHAUSTED
    http_status: 409
    applies_to: "POST /outing-ops/registrations/{id}/payment, POST /outing-ops/registrations/{id}/amend-tier"

  - priority: 31
    category: business_constraint
    check: "a Team holds between 1 and 4 players and no more than the player_slots of the registration that funded it"
    error_id: ERR_TEAM_SIZE_INVALID
    http_status: 409
    applies_to: "POST /outing-ops/teams"

  - priority: 32
    category: business_constraint
    check: "the field may be reopened at most MAX_FIELD_REOPENS (2) times - Outing.reopen_count counts accepted FIELD_LOCKED -> OPEN transitions and a third one is refused"
    error_id: ERR_MAX_REOPENS_EXCEEDED
    http_status: 409
    applies_to: "POST /outing-ops/outings/{id}/play-transition"

  - priority: 33
    category: business_constraint
    check: "at most one un-reversed forward receipt exists per subject - per Registration and per FundraisingItem"
    error_id: ERR_DUPLICATE_RECEIPT
    http_status: 409
    applies_to: "POST /outing-ops/receipts"

  - priority: 34
    category: business_constraint
    check: "at most one non-VOID Contest occupies a given hole_number within an Outing"
    error_id: ERR_CONTEST_HOLE_CONFLICT
    http_status: 409
    applies_to: "POST /outing-ops/contests"

  - priority: 35
    category: business_fiscal
    check: "a registration payment equals the held PackageTier.price_cents to the cent; an amendment charges or refunds only the signed difference between the two tiers"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 402
    applies_to: "POST /outing-ops/registrations/{id}/payment, POST /outing-ops/registrations/{id}/amend-tier"

  - priority: 36
    category: business_fiscal
    check: "a refund may not push Registration.amount_refunded_cents above amount_paid_cents minus the late cancellation fee already retained"
    error_id: ERR_REFUND_EXCEEDS_PAYMENT
    http_status: 409
    applies_to: "POST /outing-ops/registrations/{id}/lifecycle"

  - priority: 37
    category: business_fiscal
    check: "every fundraising sale needs bid_cents >= ask_cents - an AUCTION bid below the ask is refused, and a RAFFLE or DONATION recorded below its ask_cents is refused on the same rule"
    error_id: ERR_INSUFFICIENT_BID
    http_status: 402
    applies_to: "POST /outing-ops/fundraising-items/{id}/sale"

  - priority: 38
    category: business_fiscal
    check: "aggregate funding check - at IN_PLAY -> SCORED the prize pool plus the settled contest payouts may not exceed gross_revenue_cents minus refunded_cents, even though each individual prize was within its own limit"
    error_id: ERR_PRIZE_POOL_UNFUNDED
    http_status: 409
    applies_to: "POST /outing-ops/outings/{id}/play-transition"

  - priority: 39
    category: business_fiscal
    check: "the REMIT transition (RECONCILED -> DISBURSED) requires net_proceeds_cents > 0"
    error_id: ERR_NEGATIVE_NET_PROCEEDS
    http_status: 409
    applies_to: "POST /outing-ops/outings/{id}/finance-transition"

  - priority: 40
    category: business_fiscal
    check: "the remittance_cents supplied on REMIT equals the FINAL-variant net_proceeds_cents to the cent"
    error_id: ERR_REMITTANCE_AMOUNT_MISMATCH
    http_status: 402
    applies_to: "POST /outing-ops/outings/{id}/finance-transition"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
# Every request carries X-User-Id and X-User-Role headers; headers are never
# listed in `input:`. All list endpoints accept limit and offset alongside the
# filters shown.
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the server's logical UTC clock. The server starts at the fixed default 2026-08-01T00:00:00Z and never falls back to wall-clock time, so every deadline, notice-window and fulfillment-due comparison is deterministic."
    roles: [TournamentDirector, SponsorshipManager, CharityTreasurer, CourseOperations]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["moves the logical clock that stamps confirmed_at, signed_at, committed_at, sold_at, issued_at and score_posted_at, and that all temporal validations read"]

  - method: POST
    path: "/outing-ops/outings"
    description: "Create a charity outing in play_status DRAFT and finance_status COLLECTING."
    roles: [TournamentDirector]
    code: 201
    input: [name, beneficiary_name, format, start_format, scheduled_date, wave_a_start, wave_a_end, field_capacity_teams, prize_pool_cents, "rain_date?", "wave_b_start?", "wave_b_end?"]
    output: Outing
    side_effects: ["initialises every finance rollup field to 0 and proceeds_variant to PROVISIONAL"]

  - method: GET
    path: "/outing-ops/outings/{id}"
    description: "Read one outing including both state dimensions and the whole finance rollup."
    roles: [TournamentDirector, SponsorshipManager, CharityTreasurer, CourseOperations, Beneficiary]
    code: 200
    input: []
    output: Outing
    side_effects: []

  - method: GET
    path: "/outing-ops/outings"
    description: "List outings, filterable by either state dimension."
    roles: [TournamentDirector, SponsorshipManager, CharityTreasurer, CourseOperations, Beneficiary]
    code: 200
    input: ["play_status?", "finance_status?", "limit?", "offset?"]
    output: Outing[]
    side_effects: []

  - method: POST
    path: "/outing-ops/outings/{id}/play-transition"
    description: "Drive the play dimension: OPEN_REGISTRATION, LOCK_FIELD, START_PLAY, FINALIZE_SCORING, POSTPONE, RESUME, CANCEL_OUTING."
    roles: [TournamentDirector]
    code: 200
    input: [action, "rain_date?"]
    output: Outing
    side_effects:
      - "OPEN_REGISTRATION requires a SIGNED or AMENDED CourseContract (ERR_CONTRACT_NOT_SIGNED)"
      - "LOCK_FIELD writes Player.effective_handicap_index and course_handicap, then rewrites every Team.team_playing_handicap with the LOCKED variant"
      - "FIELD_LOCKED -> OPEN rewrites every Team.team_playing_handicap with the PROVISIONAL variant and increments reopen_count (capped by MAX_FIELD_REOPENS)"
      - "FINALIZE_SCORING runs team_ranking_tiebreak, then prize_distribution, then net_proceeds_rollup"
      - "POSTPONE runs rain_date_credit and writes CourseContract.rain_credit_cents"
      - "CANCEL_OUTING releases every non-terminal allocation and refunds every confirmed registration"

  - method: POST
    path: "/outing-ops/outings/{id}/finance-transition"
    description: "Drive the finance dimension: RECONCILE, REOPEN, REMIT. Guarded by expected_outing_version."
    roles: [CharityTreasurer]
    code: 200
    input: [action, expected_outing_version, "remittance_cents?", "remittance_reference?"]
    output: Outing
    side_effects:
      - "RECONCILE switches proceeds_variant to FINAL and rewrites the whole rollup with the FINAL variant"
      - "REOPEN switches proceeds_variant back to PROVISIONAL and rewrites the rollup; the finance dimension carries no reopen cap"
      - "REMIT freezes beneficiary_remittance_cents and remittance_reference and cascades the outing's CourseContract to SETTLED"
      - "every accepted action increments Outing.version by 1"

  - method: GET
    path: "/outing-ops/outings/{id}/proceeds-report"
    description: "Computed read of the beneficiary net-proceeds report: the whole rollup chain from gross revenue through the administrative fee to net proceeds, with the variant that produced it."
    roles: [CharityTreasurer, TournamentDirector, Beneficiary]
    code: 200
    input: []
    output: Outing
    side_effects: []

  - method: GET
    path: "/outing-ops/outings/{id}/pairing-sheet"
    description: "Computed read of the pairing sheet: every Team of the outing ordered by wave, then starting_hole, then tee_time, then created_at, carrying its cart number and playing handicap."
    roles: [TournamentDirector, CourseOperations, Participant]
    code: 200
    input: ["wave?", "limit?", "offset?"]
    output: Team[]
    side_effects: []

  - method: POST
    path: "/outing-ops/contracts"
    description: "Create the course contract for an outing in status DRAFT."
    roles: [CourseOperations]
    code: 201
    input: [outing_id, course_name, rate_per_player_cents, "guaranteed_player_count?", "fnb_minimum_cents?", "fnb_per_player_cents?", "course_rating?", "slope_rating?", "par?", "tee_interval_minutes?", "cart_allowance_count?", "rain_date_terms?", "rain_date_credit_pct?", "cancellation_notice_days?"]
    output: CourseContract
    side_effects: ["rejects a second contract for the same outing with ERR_CONTRACT_ALREADY_EXISTS"]

  - method: GET
    path: "/outing-ops/contracts/{id}"
    description: "Read one course contract."
    roles: [CourseOperations, TournamentDirector, CharityTreasurer]
    code: 200
    input: []
    output: CourseContract
    side_effects: []

  - method: GET
    path: "/outing-ops/contracts"
    description: "List course contracts, filterable by outing."
    roles: [CourseOperations, TournamentDirector, CharityTreasurer]
    code: 200
    input: ["outing_id?", "status?", "limit?", "offset?"]
    output: CourseContract[]
    side_effects: []

  - method: POST
    path: "/outing-ops/contracts/{id}/lifecycle"
    description: "Drive the contract lifecycle: SIGN, AMEND, VOID."
    roles: [CourseOperations]
    code: 200
    input: [action, "rate_per_player_cents?", "guaranteed_player_count?", "fnb_minimum_cents?", "fnb_per_player_cents?", "course_rating?", "slope_rating?", "par?", "tee_interval_minutes?", "cart_allowance_count?", "rain_date_terms?", "rain_date_credit_pct?", "cancellation_notice_days?", "void_reason?"]
    output: CourseContract
    side_effects:
      - "AMEND of course_rating, slope_rating, par or tee_interval_minutes cascades Player.course_handicap -> Team.team_playing_handicap -> Team.net_score and the four net tiebreak metrics"
      - "AMEND of rate_per_player_cents, fnb_minimum_cents or fnb_per_player_cents cascades the outing finance rollup"
      - "VOID enforces the cancellation notice window against the logical clock"

  - method: POST
    path: "/outing-ops/package-tiers"
    description: "Create a registration or sponsorship package tier."
    roles: [TournamentDirector]
    code: 201
    input: [outing_id, code, kind, price_cents, player_slots, "gsv_cents?", "inventory_cap?", "entitled_asset_type?", "entitled_asset_count?"]
    output: PackageTier
    side_effects: ["rejects a duplicate code within the outing with ERR_TIER_CODE_DUPLICATE"]

  - method: GET
    path: "/outing-ops/package-tiers/{id}"
    description: "Read one package tier including its live sold_count."
    roles: [TournamentDirector, SponsorshipManager, CharityTreasurer, Participant]
    code: 200
    input: []
    output: PackageTier
    side_effects: []

  - method: GET
    path: "/outing-ops/package-tiers"
    description: "List package tiers, filterable by outing and kind."
    roles: [TournamentDirector, SponsorshipManager, CharityTreasurer, Participant]
    code: 200
    input: ["outing_id?", "kind?", "limit?", "offset?"]
    output: PackageTier[]
    side_effects: []

  - method: POST
    path: "/outing-ops/registrations"
    description: "Create a registration in PENDING_PAYMENT against a package tier."
    roles: [TournamentDirector, SponsorshipManager, Participant]
    code: 201
    input: [outing_id, package_tier_id, buyer_name, player_count, "buyer_email?"]
    output: Registration
    side_effects: ["records recorded_by_user_id from X-User-Id", "recomputes Outing.waitlisted_registration_count is NOT triggered - a fresh registration is PENDING_PAYMENT, not WAITLISTED"]

  - method: GET
    path: "/outing-ops/registrations/{id}"
    description: "Read one registration including its money fields and entitled_asset_balance."
    roles: [TournamentDirector, SponsorshipManager, CharityTreasurer, Participant]
    code: 200
    input: []
    output: Registration
    side_effects: []

  - method: GET
    path: "/outing-ops/registrations"
    description: "List registrations, filterable by outing, tier and status."
    roles: [TournamentDirector, SponsorshipManager, CharityTreasurer]
    code: 200
    input: ["outing_id?", "package_tier_id?", "status?", "limit?", "offset?"]
    output: Registration[]
    side_effects: []

  - method: POST
    path: "/outing-ops/registrations/{id}/payment"
    description: "Record payment for a PENDING_PAYMENT registration. Confirms it when the field still has room, otherwise waitlists it."
    roles: [TournamentDirector, SponsorshipManager, CharityTreasurer]
    code: 200
    input: [amount_cents]
    output: Registration
    side_effects:
      - "amount_cents must equal the held tier price to the cent (ERR_PAYMENT_AMOUNT_MISMATCH)"
      - "CONFIRMED when confirmed_player_slots + player_count <= field_capacity_teams * 4, WAITLISTED at the boundary+1"
      - "on CONFIRMED: snapshots Player.handicap_index_at_confirm, sets confirmed_at, seeds entitled_asset_balance, increments PackageTier.sold_count and recomputes Outing.confirmed_player_slots and the finance rollup"

  - method: POST
    path: "/outing-ops/registrations/{id}/amend-tier"
    description: "Move a CONFIRMED, AMENDED or CHECKED_IN registration to a different package tier. Guarded by expected_registration_version."
    roles: [SponsorshipManager, TournamentDirector]
    code: 200
    input: [package_tier_id, expected_registration_version, "amount_cents?", "player_count?"]
    output: Registration
    side_effects:
      - "charges or refunds the signed price difference between the two tiers and increments amendment_count"
      - "re-seeds entitled_asset_balance from the new tier and releases entitlement allocations that the new tier no longer covers"
      - "recomputes sold_count on both tiers, Outing.confirmed_player_slots and the finance rollup"
      - "increments Registration.version by 1"

  - method: POST
    path: "/outing-ops/registrations/{id}/lifecycle"
    description: "Drive the registration lifecycle: CHECK_IN, RECONFIRM, CANCEL. CHECK_IN is the course's operation, RECONFIRM and CANCEL the organizer's."
    roles: [TournamentDirector, SponsorshipManager, CourseOperations]
    code: 200
    input: [action, "refund_cents?"]
    output: Registration
    side_effects:
      - "CHECK_IN sets Player.checked_in for every player of the registration and recomputes Outing.checked_in_player_count"
      - "CANCEL runs the nine-step cascade: registration -> allocations RELEASED -> asset counters and status -> Outing.reserved_asset_slot_count -> tier sold_count -> Outing.confirmed_player_slots -> waitlist_promotion -> automatic REVERSAL receipt -> finance rollup"
      - "CANCEL inside the contract notice window retains late_cancel_fee_cents = round_half_up(LATE_CANCEL_FEE_PCT (0.25) * amount_paid_cents)"
      - "RECONFIRM returns an AMENDED registration to CONFIRMED"

  - method: POST
    path: "/outing-ops/players"
    description: "Add a golfer to a registration's slot."
    roles: [TournamentDirector, SponsorshipManager, Participant]
    code: 201
    input: [registration_id, full_name, handicap_index, "amateur_status?"]
    output: Player
    side_effects:
      - "rejects a player beyond the registration's player_count with ERR_PLAYER_SLOTS_EXCEEDED"
      - "snapshots handicap_index_at_confirm immediately when the owning registration is already CONFIRMED, AMENDED or CHECKED_IN"

  - method: GET
    path: "/outing-ops/players/{id}"
    description: "Read one player including both handicap snapshots and the derived course handicap."
    roles: [TournamentDirector, CourseOperations, SponsorshipManager, Participant]
    code: 200
    input: []
    output: Player
    side_effects: []

  - method: GET
    path: "/outing-ops/players"
    description: "List players, filterable by registration and team."
    roles: [TournamentDirector, CourseOperations, SponsorshipManager, Participant]
    code: 200
    input: ["registration_id?", "team_id?", "amateur_status?", "checked_in?", "limit?", "offset?"]
    output: Player[]
    side_effects: []

  - method: POST
    path: "/outing-ops/players/{id}/handicap-index"
    description: "Update a golfer's current handicap index on file. Role Participant may only update their own row."
    roles: [TournamentDirector, Participant]
    code: 200
    input: [handicap_index]
    output: Player
    side_effects:
      - "while the outing is OPEN this re-derives course_handicap from the at_confirm snapshot and rewrites the team's PROVISIONAL playing handicap"
      - "once the field is FIELD_LOCKED the update is rejected with ERR_INVALID_STATE_TRANSITION, so the sandbagging cap cannot be dodged after lock"

  - method: POST
    path: "/outing-ops/teams"
    description: "Group up to four players funded by one registration into a foursome and compute its PROVISIONAL playing handicap."
    roles: [TournamentDirector]
    code: 201
    input: [outing_id, team_name, player_ids]
    output: Team
    side_effects:
      - "sets Player.team_id on every listed player and computes player_count"
      - "runs team_playing_handicap with the PROVISIONAL variant and writes handicap_variant = PROVISIONAL"

  - method: GET
    path: "/outing-ops/teams/{id}"
    description: "Read one team including its playing handicap, net metrics, rank, prize award and tee assignment."
    roles: [TournamentDirector, CourseOperations, CharityTreasurer, Participant]
    code: 200
    input: []
    output: Team
    side_effects: []

  - method: GET
    path: "/outing-ops/teams"
    description: "List teams, filterable by outing and wave."
    roles: [TournamentDirector, CourseOperations, CharityTreasurer, Participant]
    code: 200
    input: ["outing_id?", "wave?", "starting_hole?", "limit?", "offset?"]
    output: Team[]
    side_effects: []

  - method: POST
    path: "/outing-ops/teams/{id}/tee-assignment"
    description: "Write or supersede a team's wave, starting hole, tee time and cart. Guarded by expected_team_version."
    roles: [TournamentDirector, CourseOperations]
    code: 200
    input: [expected_team_version, wave, starting_hole, tee_time, cart_number]
    output: Team
    side_effects:
      - "checks the half-open tee-sheet slot per starting_hole, the wave window, the cart turnaround and the cart allowance in that order"
      - "writes slot_occupancy_start and slot_occupancy_end and increments tee_assignment_count"
      - "increments Team.version by 1, so a client holding the pre-write version is superseded"

  - method: POST
    path: "/outing-ops/teams/{id}/score"
    description: "Post a team's gross 18-hole score and the three matching-card segments plus hole 18."
    roles: [TournamentDirector, CourseOperations]
    code: 200
    input: [gross_score, gross_back_9, gross_back_6, gross_back_3, gross_hole_18]
    output: Team
    side_effects:
      - "requires Outing.play_status == IN_PLAY"
      - "derives net_score and the four net tiebreak metrics from the current team_playing_handicap and stamps score_posted_at"

  - method: POST
    path: "/outing-ops/sponsorship-assets"
    description: "Create a sellable sponsorship inventory unit - a hole sign, a contest, a cart or a beverage station."
    roles: [SponsorshipManager]
    code: 201
    input: [outing_id, asset_type, label, list_price_cents, "hole_number?", "capacity?", "exclusive?", "fulfillment_due_at?"]
    output: SponsorshipAsset
    side_effects: ["initialises remaining_capacity to capacity and status to AVAILABLE"]

  - method: GET
    path: "/outing-ops/sponsorship-assets/{id}"
    description: "Read one inventory unit including all three occupancy counters and remaining_capacity."
    roles: [SponsorshipManager, TournamentDirector, CharityTreasurer]
    code: 200
    input: []
    output: SponsorshipAsset
    side_effects: []

  - method: GET
    path: "/outing-ops/sponsorship-assets"
    description: "List inventory units, filterable by outing, type and posture."
    roles: [SponsorshipManager, TournamentDirector, CharityTreasurer]
    code: 200
    input: ["outing_id?", "asset_type?", "status?", "limit?", "offset?"]
    output: SponsorshipAsset[]
    side_effects: []

  - method: POST
    path: "/outing-ops/sponsorship-assets/{id}/inventory"
    description: "Take a unit off the market or return it: WITHDRAW, RESTORE."
    roles: [SponsorshipManager]
    code: 200
    input: [action]
    output: SponsorshipAsset
    side_effects:
      - "WITHDRAW requires zero occupancy and forces remaining_capacity to 0"
      - "RESTORE recomputes remaining_capacity from capacity and the counters"

  - method: POST
    path: "/outing-ops/sponsor-allocations"
    description: "Reserve one unit of sponsorship inventory for a sponsor registration, from the package entitlement or as an upsell."
    roles: [SponsorshipManager]
    code: 201
    input: [registration_id, sponsorship_asset_id, source, "service_window_start?", "service_window_end?"]
    output: SponsorAllocation
    side_effects:
      - "checks the padded closed service window, then capacity, then exclusivity in priority order"
      - "consumes one unit of Registration.entitled_asset_balance when source is PACKAGE_ENTITLEMENT"
      - "increments SponsorshipAsset.reserved_count, decrements remaining_capacity, moves the asset to RESERVED and increments Outing.reserved_asset_slot_count"

  - method: GET
    path: "/outing-ops/sponsor-allocations/{id}"
    description: "Read one allocation including its fulfillment state and the two segregation-of-duties user stamps."
    roles: [SponsorshipManager, TournamentDirector, CharityTreasurer]
    code: 200
    input: []
    output: SponsorAllocation
    side_effects: []

  - method: GET
    path: "/outing-ops/sponsor-allocations"
    description: "List allocations, filterable by registration and by asset."
    roles: [SponsorshipManager, TournamentDirector, CharityTreasurer]
    code: 200
    input: ["registration_id?", "sponsorship_asset_id?", "status?", "source?", "limit?", "offset?"]
    output: SponsorAllocation[]
    side_effects: []

  - method: POST
    path: "/outing-ops/sponsor-allocations/{id}/fulfillment"
    description: "Drive the fulfillment obligation: COMMIT, APPROVE_ARTWORK, INSTALL, VERIFY, WAIVE, RELEASE."
    roles: [SponsorshipManager]
    code: 200
    input: [action, "waived_reason?"]
    output: SponsorAllocation
    side_effects:
      - "COMMIT recognizes upsell_price_cents as revenue, stamps committed_at, moves the counter from reserved to committed and recomputes the finance rollup"
      - "APPROVE_ARTWORK stamps artwork_approved_by_user_id; VERIFY stamps verified_by_user_id and must be a different user (ERR_SEGREGATION_OF_DUTIES)"
      - "WAIVE writes fulfillment_credit_cents = round_half_up(WAIVER_CREDIT_PCT * asset.list_price_cents) and cascades it to Registration.fulfillment_credit_cents and Outing.fulfillment_credit_cents"
      - "RELEASE restores the asset counters and remaining_capacity and decrements Outing.reserved_asset_slot_count, restoring the inventory conservation identity"

  - method: POST
    path: "/outing-ops/contests"
    description: "Stage a skill contest on a hole. Sets requires_insurance from the prize value."
    roles: [TournamentDirector]
    code: 201
    input: [outing_id, contest_type, hole_number, prize_value_cents, "yardage?", "prize_form?"]
    output: Contest
    side_effects: ["derives requires_insurance = (contest_type == HOLE_IN_ONE and prize_value_cents >= 500000)"]

  - method: GET
    path: "/outing-ops/contests/{id}"
    description: "Read one contest including both state dimensions, the award settlement and any claim denial reason."
    roles: [TournamentDirector, SponsorshipManager, CharityTreasurer, Participant]
    code: 200
    input: []
    output: Contest
    side_effects: []

  - method: GET
    path: "/outing-ops/contests"
    description: "List contests, filterable by outing, winner and either state dimension."
    roles: [TournamentDirector, SponsorshipManager, CharityTreasurer, Participant]
    code: 200
    input: ["outing_id?", "winner_player_id?", "status?", "insurance_status?", "contest_type?", "limit?", "offset?"]
    output: Contest[]
    side_effects: []

  - method: POST
    path: "/outing-ops/contests/{id}/insurance"
    description: "Bind a hole-in-one prize insurance policy on a contest, moving the insurance dimension from NONE to BOUND."
    roles: [SponsorshipManager]
    code: 200
    input: [insurance_carrier, insurance_premium_cents, insurance_coverage_cap_cents, "insurance_min_yardage?", "insurance_required_witness_count?"]
    output: Contest
    side_effects:
      - "stamps insurance_bound_at and adds the premium to Outing.insurance_cost_cents"
      - "increments Contest.version by 1 without touching the status dimension"

  - method: POST
    path: "/outing-ops/contests/{id}/status"
    description: "Drive the contest lifecycle dimension: OPEN, CLOSE, VOID."
    roles: [TournamentDirector]
    code: 200
    input: [action]
    output: Contest
    side_effects:
      - "OPEN of a requires_insurance contest demands insurance_status == BOUND (ERR_INSURANCE_NOT_BOUND)"
      - "VOID cascades a BOUND policy to EXPIRED and zeroes the contest payout"

  - method: POST
    path: "/outing-ops/contests/{id}/award"
    description: "Award a CLOSED contest to a player, applying the amateur-status rule and adjudicating the insurance claim."
    roles: [TournamentDirector]
    code: 200
    input: [winner_player_id, "witness_count?"]
    output: Contest
    side_effects:
      - "runs contest_award_settlement: award_form, awarded_value_cents, insurance_recovery_cents, contest_payout_cents, claim_denial_reason"
      - "moves insurance_status BOUND -> CLAIM_PAID or CLAIM_DENIED in the same request"
      - "recomputes the outing finance rollup through prize_cost_cents"

  - method: POST
    path: "/outing-ops/fundraising-items"
    description: "List an auction lot, a raffle or a donation appeal."
    roles: [CharityTreasurer]
    code: 201
    input: [outing_id, item_type, description, "fmv_cents?", "ask_cents?"]
    output: FundraisingItem
    side_effects: []

  - method: GET
    path: "/outing-ops/fundraising-items/{id}"
    description: "Read one fundraising item including the buyer and the amount collected."
    roles: [CharityTreasurer, TournamentDirector]
    code: 200
    input: []
    output: FundraisingItem
    side_effects: []

  - method: GET
    path: "/outing-ops/fundraising-items"
    description: "List fundraising items, filterable by outing, buyer, channel and status."
    roles: [CharityTreasurer, TournamentDirector]
    code: 200
    input: ["outing_id?", "buyer_registration_id?", "item_type?", "status?", "limit?", "offset?"]
    output: FundraisingItem[]
    side_effects: []

  - method: POST
    path: "/outing-ops/fundraising-items/{id}/sale"
    description: "Record the winning bid, raffle purchase or pledge and the buyer."
    roles: [CharityTreasurer, SponsorshipManager]
    code: 200
    input: [buyer_registration_id, bid_cents]
    output: FundraisingItem
    side_effects: ["stamps sold_at and recorded_by_user_id, which bars that user from issuing this item's receipt"]

  - method: POST
    path: "/outing-ops/fundraising-items/{id}/payment"
    description: "Record cash collected against a SOLD item."
    roles: [CharityTreasurer]
    code: 200
    input: [amount_cents]
    output: FundraisingItem
    side_effects: ["moves the item to PAID and recomputes Outing.gross_revenue_cents and the rest of the rollup"]

  - method: POST
    path: "/outing-ops/fundraising-items/{id}/lifecycle"
    description: "Void a sale or relist a voided lot: VOID, RELIST."
    roles: [CharityTreasurer]
    code: 200
    input: [action, "void_reason?"]
    output: FundraisingItem
    side_effects: ["VOID reverses the collected revenue and increments void_count; RELIST clears the buyer and returns the lot to LISTED"]

  - method: POST
    path: "/outing-ops/receipts"
    description: "Issue an append-only charitable receipt for a registration or a fundraising item, applying the token-benefit rule."
    roles: [CharityTreasurer]
    code: 201
    input: [outing_id, receipt_kind, "registration_id?", "fundraising_item_id?"]
    output: CharitableReceipt
    side_effects:
      - "runs charitable_deductible and writes payment_cents, gsv_cents and deductible_amount_cents"
      - "assigns the per-outing sequential receipt_number, stamps issued_by_user_id and issued_at"
      - "moves a PAID FundraisingItem to RECEIPTED and sets Registration.receipt_issued"
      - "adds deductible_amount_cents to Outing.receipted_deductible_total_cents"

  - method: GET
    path: "/outing-ops/receipts/{id}"
    description: "Read one charitable receipt."
    roles: [CharityTreasurer, TournamentDirector, Participant]
    code: 200
    input: []
    output: CharitableReceipt
    side_effects: []

  - method: GET
    path: "/outing-ops/receipts"
    description: "List charitable receipts, filterable by outing, subject and reversal target."
    roles: [CharityTreasurer, TournamentDirector, Participant]
    code: 200
    input: ["outing_id?", "registration_id?", "fundraising_item_id?", "reverses_receipt_id?", "receipt_kind?", "limit?", "offset?"]
    output: CharitableReceipt[]
    side_effects: []

  - method: POST
    path: "/outing-ops/receipts/{id}/reversal"
    description: "Append a REVERSAL receipt that negates an earlier receipt; the original row is never mutated."
    roles: [CharityTreasurer]
    code: 201
    input: ["reversal_reason?"]
    output: CharitableReceipt
    side_effects:
      - "writes negated payment_cents, gsv_cents and deductible_amount_cents and links reverses_receipt_id"
      - "clears Registration.receipt_issued and returns a RECEIPTED FundraisingItem to PAID"
      - "brings Outing.receipted_deductible_total_cents back to its pre-receipt value"

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- authentication and authorization ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Id or X-User-Role header missing, or X-User-Role is not one of the six declared roles" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "the caller's role is not listed on the endpoint, or a Participant addresses a Player row that is not their own" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "the artwork approver tries to verify the same allocation, or the user who recorded a fundraising sale tries to issue that item's receipt" }

  # --- request schema ---
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "missing required input, unknown enum value, wrong type, negative money or count, non-UTC timestamp, empty player_ids array, or an attempt to write a computed or system field" }
  - { id: ERR_RECEIPT_SUBJECT_AMBIGUOUS, http: 422, condition: "a receipt names zero or more than one subject, or the named subject does not match receipt_kind" }
  - { id: ERR_RAFFLE_NOT_DEDUCTIBLE, http: 422, condition: "a charitable receipt is requested for a RAFFLE fundraising item" }

  # --- existence ---
  - { id: ERR_OUTING_NOT_FOUND, http: 404, condition: "outing id in the path or body does not resolve" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "course contract id does not resolve" }
  - { id: ERR_TIER_NOT_FOUND, http: 404, condition: "package tier id does not resolve" }
  - { id: ERR_REGISTRATION_NOT_FOUND, http: 404, condition: "registration id does not resolve" }
  - { id: ERR_PLAYER_NOT_FOUND, http: 404, condition: "player id does not resolve, including a winner_player_id on an award" }
  - { id: ERR_TEAM_NOT_FOUND, http: 404, condition: "team id does not resolve" }
  - { id: ERR_ASSET_NOT_FOUND, http: 404, condition: "sponsorship asset id does not resolve" }
  - { id: ERR_ALLOCATION_NOT_FOUND, http: 404, condition: "sponsor allocation id does not resolve" }
  - { id: ERR_CONTEST_NOT_FOUND, http: 404, condition: "contest id does not resolve" }
  - { id: ERR_ITEM_NOT_FOUND, http: 404, condition: "fundraising item id does not resolve" }
  - { id: ERR_RECEIPT_NOT_FOUND, http: 404, condition: "charitable receipt id does not resolve" }

  # --- referential integrity ---
  - { id: ERR_CROSS_OUTING_REFERENCE, http: 409, condition: "rows named by one request belong to different outings - tier vs registration, player vs team, allocation registration vs asset, receipt subject vs outing, contest winner vs contest" }
  - { id: ERR_CONTRACT_ALREADY_EXISTS, http: 409, condition: "a second CourseContract is created for an outing that already has one" }
  - { id: ERR_TIER_CODE_DUPLICATE, http: 409, condition: "a PackageTier code repeats within one outing" }
  - { id: ERR_PLAYER_ALREADY_ASSIGNED, http: 409, condition: "a player already carries a team_id, or their registration is not revenue-recognized" }
  - { id: ERR_PLAYER_SLOTS_EXCEEDED, http: 409, condition: "a player is added beyond the owning registration's player_count" }
  - { id: ERR_ASSET_TYPE_MISMATCH, http: 409, condition: "a PACKAGE_ENTITLEMENT allocation targets an asset whose asset_type differs from the tier's entitled_asset_type" }
  - { id: ERR_ALLOCATION_NOT_ENTITLED, http: 409, condition: "a PACKAGE_ENTITLEMENT allocation is requested with entitled_asset_balance == 0, or an UPSELL allocation is requested against an asset with list_price_cents 0" }
  - { id: ERR_REGISTRATION_NOT_REVENUE_RECOGNIZED, http: 409, condition: "an allocation is committed while its registration is not in CONFIRMED, AMENDED or CHECKED_IN" }
  - { id: ERR_NO_PACKAGE_TIER, http: 409, condition: "OPEN_REGISTRATION is attempted on an outing with no PackageTier rows" }

  # --- state ---
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "the requested action is not an edge out of the row's current state in the relevant §1.2 machine, including both Outing dimensions, both Contest dimensions, and the terminal states DISBURSED, SCORED, CANCELLED, SETTLED, VOIDED, REFUNDED, RECEIPTED, VERIFIED, WAIVED, RELEASED, CLAIM_PAID, CLAIM_DENIED and EXPIRED" }
  - { id: ERR_REGISTRATION_CLOSED, http: 409, condition: "a sale, payment, amendment, team creation, allocation or fundraising sale is attempted while Outing.play_status is not OPEN" }
  - { id: ERR_RECEIPT_IMMUTABLE, http: 409, condition: "a REVERSAL receipt is reversed, or a receipt that already carries a live reversal is reversed again" }
  - { id: ERR_CONTRACT_NOT_SIGNED, http: 409, condition: "OPEN_REGISTRATION is attempted while the outing has no contract or its contract is not SIGNED or AMENDED" }
  - { id: ERR_INSURANCE_NOT_BOUND, http: 409, condition: "a contest whose requires_insurance is true is opened while insurance_status is not BOUND" }
  - { id: ERR_TEAM_INCOMPLETE, http: 409, condition: "LOCK_FIELD is attempted with no teams, or with a team holding fewer than four players" }
  - { id: ERR_MISSING_TEE_ASSIGNMENT, http: 409, condition: "START_PLAY is attempted while some team has no tee assignment" }
  - { id: ERR_MISSING_SCORES, http: 409, condition: "FINALIZE_SCORING is attempted while some team lacks a gross score component, or a non-VOID contest is still OPEN" }
  - { id: ERR_NO_RAIN_DATE_TERMS, http: 409, condition: "POSTPONE is attempted with no rain_date on the outing or rain_date_terms NONE on the contract" }
  - { id: ERR_AMATEUR_CASH_CAP_EXCEEDED, http: 409, condition: "a CASH contest prize above AMATEUR_CASH_CAP_CENTS (75000) is awarded to a winner whose amateur_status is AMATEUR" }
  - { id: ERR_UNRECEIPTED_ITEMS_REMAIN, http: 409, condition: "REMIT is attempted while a revenue-recognized registration or a PAID fundraising item has no receipt" }
  - { id: ERR_ASSET_WITHDRAWN, http: 409, condition: "an allocation is requested against a WITHDRAWN sponsorship asset; this check precedes the remaining_capacity comparison, which a withdrawn asset would also fail" }
  - { id: ERR_ASSET_OCCUPIED, http: 409, condition: "WITHDRAW is attempted on an asset whose occupancy counters are not all zero" }

  # --- optimistic concurrency ---
  - { id: ERR_STALE_TEAM_VERSION, http: 412, condition: "expected_team_version does not equal Team.version on a tee assignment" }
  - { id: ERR_STALE_REGISTRATION_VERSION, http: 412, condition: "expected_registration_version does not equal Registration.version on a tier amendment" }
  - { id: ERR_STALE_OUTING_VERSION, http: 412, condition: "expected_outing_version does not equal Outing.version on a finance transition" }

  # --- temporal ---
  - { id: ERR_TEE_SLOT_CONFLICT, http: 409, condition: "the requested half-open [tee_time, tee_time + tee_interval_minutes) window overlaps another team's window on the same starting_hole of the same outing; exactly touching windows are accepted" }
  - { id: ERR_WAVE_WINDOW_VIOLATION, http: 409, condition: "tee_time falls outside the assigned wave's [start, end] window, or a SHOTGUN group is given a tee_time other than its wave start" }
  - { id: ERR_CART_DOUBLE_BOOKED, http: 409, condition: "a cart_number is reissued with less than CART_TURNAROUND_MINUTES between the previous holder's wave end and the new holder's wave start, or issued less than CART_PREP_MINUTES before its own wave start" }
  - { id: ERR_SERVICE_WINDOW_CONFLICT, http: 409, condition: "the requested service window, padded by CHANGEOVER_BUFFER_MINUTES on both sides and treated as closed, intersects another allocation's padded window on the same asset; touching windows DO conflict" }
  - { id: ERR_FULFILLMENT_WINDOW_ELAPSED, http: 409, condition: "APPROVE_ARTWORK or VERIFY runs after the asset's fulfillment_due_at on the logical clock" }
  - { id: ERR_CANCELLATION_NOTICE_VIOLATION, http: 409, condition: "VOID is attempted inside cancellation_notice_days of Outing.scheduled_date" }

  # --- capacity and constraint ---
  - { id: ERR_ASSET_CAPACITY_EXCEEDED, http: 409, condition: "an allocation is requested while SponsorshipAsset.remaining_capacity is 0" }
  - { id: ERR_EXCLUSIVE_ASSET_CONFLICT, http: 409, condition: "a second non-RELEASED allocation is requested against an asset flagged exclusive" }
  - { id: ERR_CART_ALLOWANCE_EXCEEDED, http: 409, condition: "cart_number exceeds cart_allowance_count, or the wave's distinct cart count would exceed the allowance" }
  - { id: ERR_TIER_INVENTORY_EXHAUSTED, http: 409, condition: "a payment or amendment would push PackageTier.sold_count past inventory_cap" }
  - { id: ERR_TEAM_SIZE_INVALID, http: 409, condition: "player_ids is empty, longer than four, or longer than the funding registration's player_count" }
  - { id: ERR_CONTEST_HOLE_CONFLICT, http: 409, condition: "a second non-VOID contest is staged on a hole_number already used in the outing" }
  - { id: ERR_DUPLICATE_RECEIPT, http: 409, condition: "a second un-reversed forward receipt is requested for the same registration or fundraising item" }
  - { id: ERR_MAX_REOPENS_EXCEEDED, http: 409, condition: "a third FIELD_LOCKED -> OPEN reopen is attempted, i.e. Outing.reopen_count already equals MAX_FIELD_REOPENS (2)" }

  # --- fiscal ---
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 402, condition: "amount_cents differs from the held tier price, or an amendment amount differs from the signed tier delta" }
  - { id: ERR_INSUFFICIENT_BID, http: 402, condition: "bid_cents on a fundraising sale is below the item's ask_cents, for AUCTION, RAFFLE and DONATION alike" }
  - { id: ERR_REFUND_EXCEEDS_PAYMENT, http: 409, condition: "a refund would push amount_refunded_cents above amount_paid_cents minus the retained late cancellation fee" }
  - { id: ERR_PRIZE_POOL_UNFUNDED, http: 409, condition: "at FINALIZE_SCORING the prize pool plus settled contest payouts exceed gross_revenue_cents minus refunded_cents" }
  - { id: ERR_NEGATIVE_NET_PROCEEDS, http: 409, condition: "REMIT is attempted while net_proceeds_cents is 0 or negative" }
  - { id: ERR_REMITTANCE_AMOUNT_MISMATCH, http: 402, condition: "remittance_cents on REMIT differs from the FINAL-variant net_proceeds_cents" }

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
# Role model: segregation of duties. Selling, fulfilling and receipting are held
# by three different roles, and two operations additionally compare X-User-Id
# across requests: artwork approval versus installation verification, and
# fundraising sale recording versus receipt issuance.
roles:
  - name: TournamentDirector
    description: "Runs the tournament: outings, package tiers, the play dimension, pairings, tee sheet, scoring and contest administration."
    identity: opaque
    exclusive_operations:
      - "POST /outing-ops/outings"
      - "POST /outing-ops/outings/{id}/play-transition"
      - "POST /outing-ops/package-tiers"
      - "POST /outing-ops/teams"
      - "POST /outing-ops/teams/{id}/score"
      - "POST /outing-ops/contests"
      - "POST /outing-ops/contests/{id}/status"
      - "POST /outing-ops/contests/{id}/award"
    shared_operations:
      - "POST /outing-ops/registrations"
      - "POST /outing-ops/registrations/{id}/payment"
      - "POST /outing-ops/registrations/{id}/amend-tier"
      - "POST /outing-ops/registrations/{id}/lifecycle"
      - "POST /outing-ops/players"
      - "POST /outing-ops/players/{id}/handicap-index"
      - "POST /outing-ops/teams/{id}/tee-assignment"
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"

  - name: SponsorshipManager
    description: "Sells and fulfills sponsorship inventory, amends sponsor packages and binds prize insurance."
    identity: opaque
    exclusive_operations:
      - "POST /outing-ops/sponsorship-assets"
      - "POST /outing-ops/sponsorship-assets/{id}/inventory"
      - "POST /outing-ops/sponsor-allocations"
      - "POST /outing-ops/sponsor-allocations/{id}/fulfillment"
      - "POST /outing-ops/contests/{id}/insurance"
    shared_operations:
      - "POST /outing-ops/registrations"
      - "POST /outing-ops/registrations/{id}/payment"
      - "POST /outing-ops/registrations/{id}/amend-tier"
      - "POST /outing-ops/registrations/{id}/lifecycle"
      - "POST /outing-ops/players"
      - "POST /outing-ops/fundraising-items/{id}/sale"
      - "POST /_clock/set_current_utc"
      - "GET endpoints for outings, tiers, registrations, players, teams, assets, allocations and contests"

  - name: CharityTreasurer
    description: "Owns the money: the finance dimension, fundraising channels, charitable receipts and the beneficiary remittance."
    identity: opaque
    exclusive_operations:
      - "POST /outing-ops/outings/{id}/finance-transition"
      - "POST /outing-ops/fundraising-items"
      - "POST /outing-ops/fundraising-items/{id}/payment"
      - "POST /outing-ops/fundraising-items/{id}/lifecycle"
      - "POST /outing-ops/receipts"
      - "POST /outing-ops/receipts/{id}/reversal"
    shared_operations:
      - "POST /outing-ops/registrations/{id}/payment"
      - "POST /outing-ops/fundraising-items/{id}/sale"
      - "POST /_clock/set_current_utc"
      - "GET endpoints for outings, contracts, tiers, registrations, teams, assets, allocations, contests, fundraising items and receipts"

  - name: CourseOperations
    description: "The host course's operator: the contract, ratings, tee sheet, carts and score posting."
    identity: opaque
    exclusive_operations:
      - "POST /outing-ops/contracts"
      - "POST /outing-ops/contracts/{id}/lifecycle"
    shared_operations:
      - "POST /outing-ops/teams/{id}/tee-assignment"
      - "POST /outing-ops/teams/{id}/score"
      - "POST /outing-ops/registrations/{id}/lifecycle (action CHECK_IN)"
      - "POST /_clock/set_current_utc"
      - "GET endpoints for outings, contracts, players, teams and the pairing sheet"

  - name: Participant
    description: "A golfer acting for themselves: buys a package, adds their own player row, updates their own handicap index and reads their own pairing and receipt."
    identity: "entity_backed:Player"
    exclusive_operations: []
    shared_operations:
      - "POST /outing-ops/registrations"
      - "POST /outing-ops/players"
      - "POST /outing-ops/players/{id}/handicap-index (own row only, else ERR_UNAUTHORIZED)"
      - "GET endpoints for outings, tiers, own registration, own player row, teams, the pairing sheet, contests and receipts"

  - name: Beneficiary
    description: "The charity that receives the net proceeds; read-only access to the outing and its proceeds report."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /outing-ops/outings"
      - "GET /outing-ops/outings/{id}"
      - "GET /outing-ops/outings/{id}/proceeds-report"
