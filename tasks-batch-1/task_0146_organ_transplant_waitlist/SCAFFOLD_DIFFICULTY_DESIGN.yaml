# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Organ Transplant Waitlist — task_0146
# Grounds resolve into SCAFFOLD.yaml §1.1–§1.7. 9 rules x >=2 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dvc_meld_vs_peld_clinical_scoring
        grounds:
          - calculations.meld_na_score
          - calculations.peld_score
          - entities.ClinicalScore.fields.allocation_score
          - entities.Candidate.fields.is_pediatric
        distinguishing_aspect: |
          Two algorithms on the Candidate clinical-scoring domain: MELD-Na (adult,
          uses creatinine+sodium) vs PELD (pediatric, uses albumin+growth_failure);
          identical bilirubin/inr yield different allocation_score because the
          chosen algorithm differs by is_pediatric.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z."
            - "Center C and an adult candidate ADULT (DOB 1980) and a pediatric candidate PED (DOB 2020), both LIVER."
            - "Each has one DRAFT ClinicalScore with bilirubin=4.0, inr=2.0; adult adds creatinine=2.0,sodium=130; ped adds albumin=2.5,growth_failure=true."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: UNOSAdmin
            - call: "POST /transplant-centers"
              payload: { name: "C", unos_center_code: "C001", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /candidates"
              payload: { center_id: "${c_id}", mrn: "A1", organ_type: "LIVER", blood_type: "O", date_of_birth: "1980-01-01T00:00:00Z", height_cm: 175, weight_kg: 75, hla_a: ["A1","A2"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR2"] }
              as: TransplantCenter
              as_user_id: "${c_id}"
              captures: { adult_id: "$.data.id" }
            - call: "POST /candidates"
              payload: { center_id: "${c_id}", mrn: "P1", organ_type: "LIVER", blood_type: "O", date_of_birth: "2020-01-01T00:00:00Z", height_cm: 90, weight_kg: 14, hla_a: ["A1","A2"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR2"] }
              as: TransplantCenter
              as_user_id: "${c_id}"
              captures: { ped_id: "$.data.id" }
            - call: "POST /candidates/${adult_id}/clinical-scores"
              payload: { bilirubin_mg_dl: 4.0, inr: 2.0, creatinine_mg_dl: 2.0, sodium_mmol_l: 130, albumin_g_dl: 3.0, effective_at: "2026-06-01T00:00:00Z" }
              as: TransplantCenter
              as_user_id: "${c_id}"
              captures: { adult_score_id: "$.data.id" }
            - call: "POST /candidates/${ped_id}/clinical-scores"
              payload: { bilirubin_mg_dl: 4.0, inr: 2.0, creatinine_mg_dl: 1.0, sodium_mmol_l: 140, albumin_g_dl: 2.5, growth_failure: true, effective_at: "2026-06-01T00:00:00Z" }
              as: TransplantCenter
              as_user_id: "${c_id}"
              captures: { ped_score_id: "$.data.id" }
          trigger:
            - call: "POST /clinical-scores/${adult_score_id}/finalize"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c_id}"
              captures: { adult_kind: "$.data.score_kind", adult_alloc: "$.data.allocation_score" }
            - call: "POST /clinical-scores/${ped_score_id}/finalize"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c_id}"
              captures: { ped_kind: "$.data.score_kind", ped_alloc: "$.data.allocation_score" }
          assert:
            - "ClinicalScore.${adult_score_id}.score_kind == MELD_NA"
            - "ClinicalScore.${adult_score_id}.allocation_score == 29"
            - "ClinicalScore.${ped_score_id}.score_kind == PELD"
            - "ClinicalScore.${ped_score_id}.allocation_score == 24"

      - name: dvc_allocation_priority_standard_vs_broader
        grounds:
          - calculations.allocation_priority_points
          - entities.MatchRun.fields.policy_code
          - entities.MatchListEntry.fields.priority_points
        distinguishing_aspect: |
          On the Offer/Match domain (distinct from clinical scoring): the SAME
          out-of-region candidate's priority_points differ between STANDARD policy
          (excluded entirely, not ranked) and BROADER_SHARING (ranked but points
          x0.9 then re-rounded), so the two policy variants diverge on the same data.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z."
            - "OPO in region 5; an out-of-region (region 9) center with a LISTED, ACTIVE LIVER candidate OOR with current_meld_peld=29 (MELD-Na 29) and waiting_time_days=200."
            - "A region-5 donor LIVER organ AVAILABLE, blood O, size-compatible with OOR, HLA giving mismatch_count 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-11-13T00:00:00Z" }
              as: UNOSAdmin
            - call: "POST /transplant-centers"
              payload: { name: "OOR", unos_center_code: "C009", region_code: 9, latitude: 34.0, longitude: -118.2 }
              as: UNOSAdmin
              captures: { oor_center_id: "$.data.id" }
            - call: "POST /organ-procurement-orgs"
              payload: { name: "OPO5", opo_code: "OPO5", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { opo_id: "$.data.id" }
            - call: "POST /candidates"
              payload: { center_id: "${oor_center_id}", mrn: "O1", organ_type: "LIVER", blood_type: "A", date_of_birth: "1975-01-01T00:00:00Z", height_cm: 178, weight_kg: 80, hla_a: ["A1","A2"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR9"] }
              as: TransplantCenter
              as_user_id: "${oor_center_id}"
              captures: { oor_id: "$.data.id" }
            - call: "POST /candidates/${oor_id}/clinical-scores"
              payload: { bilirubin_mg_dl: 4.0, inr: 2.0, creatinine_mg_dl: 2.0, sodium_mmol_l: 130, albumin_g_dl: 3.0, effective_at: "2025-11-13T00:00:00Z" }
              as: TransplantCenter
              as_user_id: "${oor_center_id}"
              captures: { oor_score_id: "$.data.id" }
            - call: "POST /clinical-scores/${oor_score_id}/finalize"
              payload: {}
              as: TransplantCenter
              as_user_id: "${oor_center_id}"
            - call: "POST /candidates/${oor_id}/list"
              payload: {}
              as: TransplantCenter
              as_user_id: "${oor_center_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: UNOSAdmin
            - call: "POST /donor-organs"
              payload: { opo_id: "${opo_id}", organ_type: "LIVER", blood_type: "O", donor_height_cm: 180, donor_weight_kg: 85, hla_a: ["A1","A3"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR2"], recovered_at: "2026-06-01T00:00:00Z", max_cold_ischemia_hours: 10 }
              as: OrganProcurementOrg
              as_user_id: "${opo_id}"
              captures: { organ_id: "$.data.id", organ_v0: "$.data.version" }
          trigger:
            - call: "POST /match-runs"
              payload: { donor_organ_id: "${organ_id}", expected_donor_organ_version: "${organ_v0}", policy_code: "BROADER_SHARING" }
              as: OrganProcurementOrg
              as_user_id: "${opo_id}"
              captures: { run_b_id: "$.data.id", ranked_b: "$.data.ranked_count" }
            - call: "GET /match-list-entries?candidate_id=${oor_id}&match_run_id=${run_b_id}"
              payload: {}
              as: OrganProcurementOrg
              as_user_id: "${opo_id}"
              captures: { oor_pts_b: "$.data[0].priority_points" }
          assert:
            - "MatchRun.${run_b_id}.ranked_count == 1"
            - "MatchListEntry for (${run_b_id}, ${oor_id}).priority_points == 76"
            - "Under a STANDARD-policy run on the same organ the out-of-region OOR is not ranked (ranked_count would be 0)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cf_meld_na_nonlinear_sodium_branch
        grounds:
          - calculations.meld_na_score
          - entities.ClinicalScore.fields.raw_score
          - entities.ClinicalScore.fields.allocation_score
        distinguishing_aspect: |
          Mode (a): MELD-Na is a >=3-input formula with a conditional branch — the
          sodium adjustment term applies only when meld_i > 11, and creatinine is
          clamped into [1.0,4.0] (nested min/max), so the result is non-linear in
          its inputs.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; center C; adult LIVER candidate."
            - "DRAFT score bilirubin=3.0, inr=1.8, creatinine=2.0, sodium=130 (meld_i=24 > 11 so Na term applies)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: UNOSAdmin
            - call: "POST /transplant-centers"
              payload: { name: "C", unos_center_code: "C001", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /candidates"
              payload: { center_id: "${c_id}", mrn: "A2", organ_type: "LIVER", blood_type: "O", date_of_birth: "1980-01-01T00:00:00Z", height_cm: 175, weight_kg: 75, hla_a: ["A1","A2"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR2"] }
              as: TransplantCenter
              as_user_id: "${c_id}"
              captures: { cand_id: "$.data.id" }
            - call: "POST /candidates/${cand_id}/clinical-scores"
              payload: { bilirubin_mg_dl: 3.0, inr: 1.8, creatinine_mg_dl: 2.0, sodium_mmol_l: 130, albumin_g_dl: 3.0, effective_at: "2026-06-01T00:00:00Z" }
              as: TransplantCenter
              as_user_id: "${c_id}"
              captures: { score_id: "$.data.id" }
          trigger:
            - call: "POST /clinical-scores/${score_id}/finalize"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c_id}"
              captures: { kind: "$.data.score_kind", alloc: "$.data.allocation_score" }
          assert:
            - "ClinicalScore.${score_id}.score_kind == MELD_NA"
            - "ClinicalScore.${score_id}.allocation_score == 28"

      - name: cf_priority_points_per_component_round_then_sum
        grounds:
          - calculations.allocation_priority_points
          - entities.MatchListEntry.fields.priority_points
        distinguishing_aspect: |
          Mode (b): priority_points pins nested-rounding ORDER — each component
          (med_pts, wait_pts, hla_pts) is round_half_up to an integer BEFORE the
          sum, so 'round each then add' differs from 'add then round'; the pinned
          order yields 84 for s=29,w=200,m=2.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; region-5 OPO + region-5 center."
            - "LISTED ACTIVE LIVER candidate with current_meld_peld=29 and waiting_time_days=200; region-5 donor organ, mismatch_count 2, size/ABO compatible."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-11-13T00:00:00Z" }
              as: UNOSAdmin
            - call: "POST /transplant-centers"
              payload: { name: "C5", unos_center_code: "C005", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { c5_id: "$.data.id" }
            - call: "POST /organ-procurement-orgs"
              payload: { name: "OPO5", opo_code: "OPO5", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { opo_id: "$.data.id" }
            - call: "POST /candidates"
              payload: { center_id: "${c5_id}", mrn: "R1", organ_type: "LIVER", blood_type: "A", date_of_birth: "1975-01-01T00:00:00Z", height_cm: 178, weight_kg: 80, hla_a: ["A1","A2"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR9"] }
              as: TransplantCenter
              as_user_id: "${c5_id}"
              captures: { cand_id: "$.data.id" }
            - call: "POST /candidates/${cand_id}/clinical-scores"
              payload: { bilirubin_mg_dl: 4.0, inr: 2.0, creatinine_mg_dl: 2.0, sodium_mmol_l: 130, albumin_g_dl: 3.0, effective_at: "2025-11-13T00:00:00Z" }
              as: TransplantCenter
              as_user_id: "${c5_id}"
              captures: { score_id: "$.data.id" }
            - call: "POST /clinical-scores/${score_id}/finalize"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c5_id}"
            - call: "POST /candidates/${cand_id}/list"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c5_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: UNOSAdmin
            - call: "POST /donor-organs"
              payload: { opo_id: "${opo_id}", organ_type: "LIVER", blood_type: "O", donor_height_cm: 180, donor_weight_kg: 85, hla_a: ["A1","A3"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR2"], recovered_at: "2026-06-01T00:00:00Z", max_cold_ischemia_hours: 10 }
              as: OrganProcurementOrg
              as_user_id: "${opo_id}"
              captures: { organ_id: "$.data.id", organ_v0: "$.data.version" }
          trigger:
            - call: "POST /match-runs"
              payload: { donor_organ_id: "${organ_id}", expected_donor_organ_version: "${organ_v0}", policy_code: "STANDARD" }
              as: OrganProcurementOrg
              as_user_id: "${opo_id}"
              captures: { run_id: "$.data.id" }
            - call: "GET /match-list-entries?candidate_id=${cand_id}&match_run_id=${run_id}"
              payload: {}
              as: OrganProcurementOrg
              as_user_id: "${opo_id}"
              captures: { pts: "$.data[0].priority_points", hla: "$.data[0].hla_mismatch_count" }
          assert:
            - "MatchListEntry for (${run_id}, ${cand_id}).hla_mismatch_count == 2"
            - "MatchListEntry for (${run_id}, ${cand_id}).priority_points == 84"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_candidate_parallel_medical_listing_dimensions
        grounds:
          - state_machines.Candidate.ACTIVE_to_INACTIVE
          - state_machines.Candidate.INACTIVE_to_ACTIVE
          - entities.Candidate.fields.medical_status
          - entities.Candidate.fields.listing_status
        distinguishing_aspect: |
          Candidate carries two INDEPENDENT state dimensions: deactivate flips
          medical_status ACTIVE->INACTIVE while listing_status stays LISTED, and
          reactivate flips it back — a cyclic dimension orthogonal to the listing
          lifecycle on the same row.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; center C; a LISTED, ACTIVE LIVER candidate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: UNOSAdmin
            - call: "POST /transplant-centers"
              payload: { name: "C", unos_center_code: "C001", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /candidates"
              payload: { center_id: "${c_id}", mrn: "A3", organ_type: "LIVER", blood_type: "O", date_of_birth: "1980-01-01T00:00:00Z", height_cm: 175, weight_kg: 75, hla_a: ["A1","A2"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR2"] }
              as: TransplantCenter
              as_user_id: "${c_id}"
              captures: { cand_id: "$.data.id" }
            - call: "POST /candidates/${cand_id}/clinical-scores"
              payload: { bilirubin_mg_dl: 4.0, inr: 2.0, creatinine_mg_dl: 2.0, sodium_mmol_l: 130, albumin_g_dl: 3.0, effective_at: "2026-06-01T00:00:00Z" }
              as: TransplantCenter
              as_user_id: "${c_id}"
              captures: { score_id: "$.data.id" }
            - call: "POST /clinical-scores/${score_id}/finalize"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c_id}"
            - call: "POST /candidates/${cand_id}/list"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /candidates/${cand_id}/deactivate"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c_id}"
              captures: { med1: "$.data.medical_status", list1: "$.data.listing_status" }
            - call: "POST /candidates/${cand_id}/reactivate"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c_id}"
              captures: { med2: "$.data.medical_status", list2: "$.data.listing_status" }
          assert:
            - "After deactivate: Candidate.${cand_id}.medical_status == INACTIVE AND listing_status == LISTED"
            - "After reactivate: Candidate.${cand_id}.medical_status == ACTIVE AND listing_status == LISTED"

      - name: nlsm_transplant_graft_cyclic_functioning_atrisk
        grounds:
          - state_machines.Transplant.FUNCTIONING_to_AT_RISK
          - state_machines.Transplant.AT_RISK_to_FUNCTIONING
          - entities.Transplant.fields.graft_status
        distinguishing_aspect: |
          A different entity (Transplant) has a CYCLE: a COMPLETED FollowUp with
          graft_functioning=false drives FUNCTIONING->AT_RISK, and a later
          COMPLETED FollowUp with graft_functioning=true drives AT_RISK->FUNCTIONING.
        test_recipe:
          setup:
            - "A FUNCTIONING Transplant T fulfilled from an accepted offer (full allocation chain)."
            - "Two SCHEDULED follow-ups: F1 graft_functioning=false, F2 graft_functioning=true, F2 scheduled later."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: UNOSAdmin
            - call: "POST /transplant-centers"
              payload: { name: "C5", unos_center_code: "C005", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { c5_id: "$.data.id" }
            - call: "POST /organ-procurement-orgs"
              payload: { name: "OPO5", opo_code: "OPO5", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { opo_id: "$.data.id" }
            - call: "POST /candidates"
              payload: { center_id: "${c5_id}", mrn: "T1", organ_type: "LIVER", blood_type: "A", date_of_birth: "1975-01-01T00:00:00Z", height_cm: 178, weight_kg: 80, hla_a: ["A1","A2"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR2"] }
              as: TransplantCenter
              as_user_id: "${c5_id}"
              captures: { cand_id: "$.data.id" }
            - call: "POST /candidates/${cand_id}/clinical-scores"
              payload: { bilirubin_mg_dl: 4.0, inr: 2.0, creatinine_mg_dl: 2.0, sodium_mmol_l: 130, albumin_g_dl: 3.0, effective_at: "2026-06-01T00:00:00Z" }
              as: TransplantCenter
              as_user_id: "${c5_id}"
              captures: { score_id: "$.data.id" }
            - call: "POST /clinical-scores/${score_id}/finalize"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c5_id}"
            - call: "POST /candidates/${cand_id}/list"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c5_id}"
            - call: "POST /donor-organs"
              payload: { opo_id: "${opo_id}", organ_type: "LIVER", blood_type: "O", donor_height_cm: 180, donor_weight_kg: 85, hla_a: ["A1","A2"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR2"], recovered_at: "2026-06-01T00:00:00Z", max_cold_ischemia_hours: 10 }
              as: OrganProcurementOrg
              as_user_id: "${opo_id}"
              captures: { organ_id: "$.data.id", organ_v0: "$.data.version" }
            - call: "POST /match-runs"
              payload: { donor_organ_id: "${organ_id}", expected_donor_organ_version: "${organ_v0}", policy_code: "STANDARD" }
              as: OrganProcurementOrg
              as_user_id: "${opo_id}"
              captures: { run_id: "$.data.id", organ_v1: "$.data.version" }
            - call: "POST /offers"
              payload: { donor_organ_id: "${organ_id}", candidate_id: "${cand_id}", match_run_id: "${run_id}", expected_donor_organ_version: "${organ_v1}" }
              as: OrganProcurementOrg
              as_user_id: "${opo_id}"
              captures: { offer_id: "$.data.id", organ_v2: "$.data.version" }
            - call: "POST /offers/${offer_id}/accept"
              payload: { expected_donor_organ_version: "${organ_v2}" }
              as: TransplantCenter
              as_user_id: "${c5_id}"
            - call: "POST /transplants"
              payload: { offer_id: "${offer_id}", transplanted_at: "2026-06-01T06:00:00Z" }
              as: TransplantCenter
              as_user_id: "${c5_id}"
              captures: { tx_id: "$.data.id" }
            - call: "POST /transplants/${tx_id}/follow-ups"
              payload: { interval_label: "M1", scheduled_for: "2026-07-01T00:00:00Z", graft_functioning: false }
              as: TransplantCenter
              as_user_id: "${c5_id}"
              captures: { f1_id: "$.data.id" }
            - call: "POST /transplants/${tx_id}/follow-ups"
              payload: { interval_label: "M6", scheduled_for: "2026-12-01T00:00:00Z", graft_functioning: true }
              as: TransplantCenter
              as_user_id: "${c5_id}"
              captures: { f2_id: "$.data.id" }
          trigger:
            - call: "POST /follow-ups/${f1_id}/complete"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c5_id}"
            - call: "GET /transplants/${tx_id}"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c5_id}"
              captures: { graft_after_f1: "$.data.graft_status" }
            - call: "POST /follow-ups/${f2_id}/complete"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c5_id}"
            - call: "GET /transplants/${tx_id}"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c5_id}"
              captures: { graft_after_f2: "$.data.graft_status" }
          assert:
            - "After F1 complete: Transplant.${tx_id}.graft_status == AT_RISK"
            - "After F2 complete: Transplant.${tx_id}.graft_status == FUNCTIONING"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: tc_offer_accept_depth4_chain
        grounds:
          - state_machines.Offer.OFFERED_to_ACCEPTED
          - state_machines.DonorOrgan.MATCHING_to_ALLOCATED
          - state_machines.Candidate.LISTED_to_TRANSPLANTED
          - state_machines.WaitlistRegistration.candidate_id
