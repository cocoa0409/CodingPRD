scenario: "Precast Concrete Plant (Tindall style precaster): mix design & strength class, bed/form scheduling & casting cycle, rebar/strand tensioning & release strength, cylinder break testing & release hold, curing cycle & steam energy, yard inventory & piece-mark by erection sequence, oversize haul permit linkage, patch/repair disposition"
domain_name: precast-concrete-plant
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: graph
  # Peer collections at the URL root joined by explicit FKs; YardPlacement and
  # ShipmentLine are junction entities; Piece.replaces_piece_id is a self edge.

  state_machine_shape: parallel
  # Piece carries two independent dimensions (production_status x qc_status) that
  # advance on unrelated triggers; BedRun, MixDesign, CylinderSet and
  # RepairDisposition each add a revert/loop edge on top.

  relationship_patterns:
    - one_to_many        # Project -> Piece, BedRun -> CylinderSet, CylinderSet -> CylinderBreak
    - many_to_many       # Piece <-> Shipment via ShipmentLine, Piece <-> YardSlot via YardPlacement
    - self_referential   # Piece.replaces_piece_id -> Piece.id (recast replacement chain)
    - cross_aggregate    # CuringCycle spans BedRun and SteamZone; Shipment spans Project and HaulPermit

  role_model: segregation_of_duties
  # The operator who records a cylinder break may not sign the release for the
  # same set; the operator who dispositions an NCR may not perform its repair.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Jobsite/contract name for the erection package."
      - name: jobsite_city
        type: string
        source: input
        description: "Delivery city; used only for reporting."
      - name: erection_start_date
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD) the erector expects to start setting pieces."
      - name: total_piece_count
        type: integer
        source: computed
        description: "Count of Piece rows with project_id == this Project.id (all statuses)."
        default: 0
      - name: held_piece_count
        type: integer
        source: computed
        description: "Count of Piece rows with project_id == this Project.id AND qc_status == HOLD."
        default: 0
      - name: cleared_piece_count
        type: integer
        source: computed
        description: "Count of Piece rows with project_id == this Project.id AND qc_status IN {CLEARED, REPAIRED}."
        default: 0
      - name: scrapped_piece_count
        type: integer
        source: computed
        description: "Count of Piece rows with project_id == this Project.id AND production_status == SCRAPPED."
        default: 0
      - name: erected_piece_count
        type: integer
        source: computed
        description: "Count of Piece rows with project_id == this Project.id AND production_status == ERECTED."
        default: 0
      - name: committed_cost_cents
        type: integer
        source: computed
        description: "Sum of Piece.allocated_cost_cents over Piece rows with project_id == this Project.id AND allocated_cost_cents IS NOT NULL."
        default: 0

  - name: MixDesign
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Plant mix code; unique across all MixDesign rows."
        constraints: "unique; 1..32 chars"
      - name: strength_class
        type: enum
        source: input
        description: "Design strength class; drives the tension temperature adjustment in strand_jacking_force."
        constraints: "C40 | C50 | C60 | C70"
      - name: design_28day_psi
        type: integer
        source: input
        description: "Specified 28-day compressive strength."
        constraints: "> 0"
      - name: required_release_psi
        type: integer
        source: input
        description: "Minimum qualified cylinder strength required before detensioning a BedRun that uses this mix."
        constraints: "> 0 and < design_28day_psi"
      - name: w_c_ratio
        type: number
        source: input
        description: "Water/cement ratio."
        constraints: "> 0 and <= 1"
      - name: cement_lb_per_cy
        type: integer
        source: input
        description: "Cement content per cubic yard."
        constraints: "> 0"
      - name: unit_cost_cents_per_cy
        type: integer
        source: input
        description: "Material cost of one cubic yard of this mix, in cents; feeds bed_run_cost_allocation."
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state; only QUALIFIED mixes may be cast."
        default: DRAFT
        constraints: "DRAFT | QUALIFIED | SUSPENDED | RETIRED"
      - name: suspension_reason
        type: string
        source: system
        description: "Free text captured on suspend; reset to null on reinstate."
        default: null
      - name: qualified_at
        type: datetime
        source: system
        description: "Logical-clock instant of the first DRAFT -> QUALIFIED transition; never overwritten by reinstate."
        default: null

  - name: SteamZone
    parent: null
    common_fields: true
    fields:
      - name: zone_code
        type: string
        source: input
        description: "Boiler zone identifier; unique across all SteamZone rows."
        constraints: "unique"
      - name: boiler_capacity_bhp
        type: number
        source: input
        description: "Maximum aggregate boiler horsepower this zone can serve at any single instant."
        constraints: "> 0"
      - name: therm_rate_cents_per_therm
        type: integer
        source: input
        description: "Steam cost in cents per therm; feeds curing_energy_accounting."
        constraints: "> 0"

  - name: CastingBed
    parent: null
    common_fields: true
    fields:
      - name: bed_code
        type: string
        source: input
        description: "Bed identifier; unique across all CastingBed rows."
        constraints: "unique"
      - name: steam_zone_id
        type: string
        source: input
        description: "FK -> SteamZone.id; the boiler zone that serves this bed."
      - name: bed_type
        type: enum
        source: input
        description: "Form family; selects the seating-loss percentage and the form setup cost."
        constraints: "LONG_LINE_PRESTRESS | SELF_STRESSING_FORM | FLAT_BED_RC"
      - name: length_ft
        type: number
        source: input
        description: "Casting length between abutments, in feet; feeds theoretical elongation."
        constraints: "> 0"
      - name: max_strand_force_kips
        type: number
        source: input
        description: "Abutment capacity in kips; a run whose computed_jacking_force_kips exceeds it cannot tension."
        constraints: "> 0"
      - name: turnaround_buffer_hours
        type: integer
        source: input
        description: "Stripping/clean-up hours appended to every run's scheduled_end when testing bed occupancy overlap."
        constraints: ">= 0"
      - name: status
        type: enum
        source: input
        description: "AVAILABLE at creation unless the operator seeds DOWN; flips to OCCUPIED while a run is tensioned."
        default: AVAILABLE
        constraints: "AVAILABLE | OCCUPIED | DOWN"
      - name: committed_strand_force_kips
        type: number
        source: computed
        description: "Sum of BedRun.computed_jacking_force_kips over BedRun rows with bed_id == this CastingBed.id AND status IN {TENSIONED, CURING, RELEASE_READY, RELEASED}. Two decimals."
        default: 0.00
      - name: cumulative_cycle_count
        type: integer
        source: computed
        description: "Number of BedRun rows on this bed that have reached status STRIPPED."
        default: 0

  - name: BedRun
    parent: null
    common_fields: true
    fields:
      - name: bed_id
        type: string
        source: input
        description: "FK -> CastingBed.id; the bed this run occupies."
      - name: mix_design_id
        type: string
        source: input
        description: "FK -> MixDesign.id; the mix poured on this run."
      - name: scheduled_start
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the bed occupancy window (inclusive)."
      - name: scheduled_end
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the pour window (exclusive, before the turnaround buffer is appended)."
        constraints: "> scheduled_start"
      - name: status
        type: enum
        source: system
        description: "Casting-cycle state."
        default: SCHEDULED
        constraints: "SCHEDULED | BLOCKED | TENSIONED | CURING | RELEASE_READY | RELEASED | STRIPPED"
      - name: blocked_reason
        type: string
        source: system
        description: "Set to MIX_SUSPENDED when the run is auto-blocked; cleared on reinstate."
        default: null
      - name: strand_count
        type: integer
        source: system
        description: "Strands pulled on this run; supplied at tensioning."
        default: null
      - name: strand_diameter_in
        type: number
        source: system
        description: "Strand diameter supplied at tensioning."
        default: null
        constraints: "0.500 | 0.600"
      - name: measured_elongation_in
        type: number
        source: system
        description: "Field-measured elongation supplied at tensioning."
        default: null
      - name: theoretical_elongation_in
        type: number
        source: computed
        description: "Output of strand_jacking_force; three decimals."
        default: null
      - name: elongation_deviation_pct
        type: number
        source: computed
        description: "Output of strand_jacking_force; two decimals, signed."
        default: null
      - name: computed_jacking_force_kips
        type: number
        source: computed
        description: "Output of strand_jacking_force; two decimals. Reset to null by abort-tensioning."
        default: null
      - name: piece_count
        type: integer
        source: computed
        description: "Count of Piece rows with bed_run_id == this BedRun.id AND production_status != SCRAPPED."
        default: 0
      - name: cast_at
        type: datetime
        source: system
        description: "Logical-clock instant of the TENSIONED -> CURING transition."
        default: null
      - name: released_at
        type: datetime
        source: system
        description: "Logical-clock instant of the RELEASE_READY -> RELEASED transition."
        default: null
      - name: concrete_cost_cents
        type: integer
        source: computed
        description: "Output of bed_run_cost_allocation; null until the run is STRIPPED."
        default: null
      - name: strand_cost_cents
        type: integer
        source: computed
        description: "Output of bed_run_cost_allocation; null until the run is STRIPPED."
        default: null
      - name: energy_cost_cents
        type: integer
        source: computed
        description: "Output of bed_run_cost_allocation; sum over COMPLETED CuringCycle rows of this run."
        default: null
      - name: form_setup_cents
        type: integer
        source: computed
        description: "Output of bed_run_cost_allocation; keyed on CastingBed.bed_type."
        default: null
      - name: direct_subtotal_cents
        type: integer
        source: computed
        description: "Output of bed_run_cost_allocation; the value the overhead tier is keyed on."
        default: null
      - name: overhead_rate_pct
        type: number
        source: computed
        description: "Output of bed_run_cost_allocation; 22.0, 18.0 or 14.0."
        default: null
      - name: overhead_cents
        type: integer
        source: computed
        description: "Output of bed_run_cost_allocation."
        default: null
      - name: total_cost_cents
        type: integer
        source: computed
        description: "Output of bed_run_cost_allocation; direct_subtotal_cents + overhead_cents."
        default: null

  - name: CuringCycle
    parent: null
    common_fields: true
    fields:
      - name: bed_run_id
        type: string
        source: system
        description: "FK -> BedRun.id; taken from the path of the creating call."
      - name: steam_zone_id
        type: string
        source: input
        description: "FK -> SteamZone.id; the boiler zone that supplies this cycle."
      - name: planned_start
        type: datetime
        source: input
        description: "ISO 8601 UTC start of steam demand (inclusive)."
      - name: planned_end
        type: datetime
        source: input
        description: "ISO 8601 UTC end of steam demand (exclusive)."
        constraints: "> planned_start"
      - name: ramp_rate_f_per_hr
        type: number
        source: input
        description: "Temperature rise rate in degrees F per hour."
        constraints: "> 0"
      - name: soak_temp_f
        type: number
        source: input
        description: "Peak soak temperature in degrees F."
        constraints: "> 60"
      - name: soak_hours
        type: number
        source: input
        description: "Hours held at soak_temp_f."
        constraints: "> 0"
      - name: steam_demand_bhp
        type: number
        source: input
        description: "Boiler horsepower this cycle draws for the whole [planned_start, planned_end) window."
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "SCHEDULED at creation; RUNNING once the run is cast; COMPLETED on the complete call."
        default: SCHEDULED
        constraints: "SCHEDULED | RUNNING | COMPLETED"
      - name: metered_therms
        type: number
        source: system
        description: "Meter reading supplied on the complete call; null when the operator does not supply one."
        default: null
      - name: modeled_therms
        type: number
        source: computed
        description: "Output of curing_energy_accounting; two decimals; computed at creation from the profile inputs."
        default: null
      - name: energy_therms
        type: number
        source: computed
        description: "Output of curing_energy_accounting; the therms actually charged; null until COMPLETED."
        default: null
      - name: energy_source
        type: enum
        source: computed
        description: "Which variant of curing_energy_accounting produced energy_therms."
        default: null
        constraints: "MODELED | METERED"
      - name: energy_variance_pct
        type: number
        source: computed
        description: "Output of curing_energy_accounting; null when metered_therms is null."
        default: null
      - name: variance_flagged
        type: boolean
        source: computed
        description: "True when abs(energy_variance_pct) > ENERGY_VARIANCE_TOLERANCE_PCT."
        default: false
      - name: energy_cost_cents
        type: integer
        source: computed
        description: "Output of curing_energy_accounting; null until COMPLETED."
        default: null

  - name: CylinderSet
    parent: null
    common_fields: true
    fields:
      - name: bed_run_id
        type: string
        source: system
        description: "FK -> BedRun.id; taken from the path of the creating call."
      - name: purpose
        type: enum
        source: input
        description: "RELEASE sets gate detensioning; the other two are informational only."
        constraints: "RELEASE | ACCEPTANCE_28DAY | INFORMATION"
      - name: specimen_count
        type: integer
        source: input
        description: "Number of cylinders cast into this set; caps the number of CylinderBreak rows and selects the strength variant."
        constraints: ">= 2 and <= 6"
      - name: cured_with_member
        type: boolean
        source: input
        description: "True when the cylinders cured under the same tarp/steam as the members."
      - name: cast_at
        type: datetime
        source: system
        description: "Logical-clock instant at creation; the zero point for CylinderBreak.age_hours."
      - name: status
        type: enum
        source: system
        description: "Testing state of the set."
        default: CAST
        constraints: "CAST | TESTING | RELEASE_MET | RELEASE_NOT_MET"
      - name: recorded_break_count
        type: integer
        source: computed
        description: "Count of CylinderBreak rows with cylinder_set_id == this CylinderSet.id (all inclusion_status values)."
        default: 0
      - name: valid_break_count
        type: integer
        source: computed
        description: "Count of CylinderBreak rows with cylinder_set_id == this CylinderSet.id AND inclusion_status == VALID."
        default: 0
      - name: raw_mean_psi
        type: number
        source: computed
        description: "Output of cylinder_set_qualified_strength; the untrimmed mean over all recorded breaks; two decimals."
        default: null
      - name: qualified_strength_psi
        type: integer
        source: computed
        description: "Output of cylinder_set_qualified_strength; null when fewer than 2 breaks survive the trim."
        default: null
      - name: strength_variant
        type: enum
        source: computed
        description: "Which variant of cylinder_set_qualified_strength produced qualified_strength_psi."
        default: null
        constraints: "SET_AVERAGE | TRIMMED_AVERAGE"
      - name: recorded_by_user_ids
        type: array
        source: system
        description: "Append-only list of the distinct X-User-ID values that recorded a break on this set, in first-record order; read by the segregation-of-duties check on request-release."
        default: []

  - name: CylinderBreak
    parent: null
    common_fields: true
    fields:
      - name: cylinder_set_id
        type: string
        source: system
        description: "FK -> CylinderSet.id; taken from the path of the creating call."
      - name: break_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the break was recorded."
      - name: age_hours
        type: number
        source: computed
        description: "(break_at - CylinderSet.cast_at) expressed in hours, two decimals."
      - name: load_lbf
        type: number
        source: input
        description: "Machine failure load in pounds-force."
        constraints: "> 0"
      - name: diameter_in
        type: number
        source: input
        description: "Cylinder diameter in inches."
        constraints: "4.00 | 6.00"
      - name: computed_psi
        type: integer
        source: computed
        description: "Output of cylinder_break_strength_psi."
      - name: inclusion_status
        type: enum
        source: computed
        description: "Recomputed for every break of the set on each new break under the TRIMMED_AVERAGE variant."
        default: VALID
        constraints: "VALID | DISCARDED_OUTLIER"
      - name: recorded_by_user_id
        type: string
        source: system
        description: "The X-User-ID header of the QCTechnician who recorded this break."

  - name: Piece
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the erection package this piece belongs to."
      - name: mix_design_id
        type: string
        source: input
        description: "FK -> MixDesign.id; must equal the mix of the run this piece is assigned to."
      - name: bed_run_id
        type: string
        source: system
        description: "FK -> BedRun.id; null until assign-run; nullable."
        default: null
      - name: replaces_piece_id
        type: string
        source: input
        description: "FK -> Piece.id; set when this piece is the recast replacement of a scrapped piece; nullable."
        default: null
      - name: piece_mark
        type: string
        source: input
        description: "Erection mark stencilled on the piece; unique within a project_id."
        constraints: "unique per project_id"
      - name: erection_sequence_no
        type: integer
        source: input
        description: "Set order at the jobsite; lower numbers are erected first. Drives load ordering and the erection predecessor gate."
        constraints: "> 0"
      - name: length_ft
        type: number
        source: input
        description: "Overall length in feet."
        constraints: "> 0"
      - name: width_ft
        type: number
        source: input
        description: "Overall width in feet."
        constraints: "> 0"
      - name: height_ft
        type: number
        source: input
        description: "Overall height in feet."
        constraints: "> 0"
      - name: weight_lb
        type: number
        source: input
        description: "Shipping weight in pounds."
        constraints: "> 0"
      - name: concrete_volume_cy
        type: number
        source: input
        description: "Placed concrete volume in cubic yards; feeds bed_run_cost_allocation."
        constraints: "> 0"
      - name: production_status
        type: enum
        source: system
        description: "First of the two independent Piece dimensions; physical whereabouts of the piece."
        default: PLANNED
        constraints: "PLANNED | SCHEDULED | CAST | STRIPPED | YARDED | LOADED | SHIPPED | ERECTED | SCRAPPED"
      - name: qc_status
        type: enum
        source: system
        description: "Second of the two independent Piece dimensions; quality standing of the piece."
        default: PENDING
        constraints: "PENDING | HOLD | CLEARED | NONCONFORMING | REPAIRED | REJECTED"
      - name: qc_hold_reason
        type: enum
        source: system
        description: "Why the piece is on QC hold; null whenever qc_status is not HOLD or NONCONFORMING."
        default: null
        constraints: "AWAITING_RELEASE_STRENGTH | MIX_SUSPENDED | OPEN_NCR"
      - name: requires_haul_permit
        type: boolean
        source: computed
        description: "True when width_ft > 8.50 OR height_ft > 13.50 OR length_ft > 53.00."
        default: false
      - name: allocated_cost_cents
        type: integer
        source: computed
        description: "This piece's share of BedRun.total_cost_cents, written when its run reaches STRIPPED; null before that."
        default: null
      - name: repair_count
        type: integer
        source: computed
        description: "Count of RepairDisposition rows with piece_id == this Piece.id AND status IN {CLOSED_ACCEPTED, REJECTED_RECAST}."
        default: 0

  - name: YardSlot
    parent: null
    common_fields: true
    fields:
      - name: slot_code
        type: string
        source: input
        description: "Storage slot identifier; unique across all YardSlot rows."
        constraints: "unique"
      - name: bay_code
        type: string
        source: input
        description: "Yard bay grouping."
      - name: capacity_weight_lb
        type: number
        source: input
        description: "Maximum total stored weight the slot can carry."
        constraints: "> 0"
      - name: max_stack_count
        type: integer
        source: input
        description: "Maximum number of ACTIVE placements the slot can hold."
        constraints: ">= 1"
      - name: status
        type: enum
        source: input
        description: "BLOCKED may be seeded at creation and never changes; otherwise recomputed from occupancy on every placement/pull."
        default: EMPTY
        constraints: "EMPTY | PARTIAL | FULL | BLOCKED"
      - name: occupied_weight_lb
        type: number
        source: computed
        description: "Sum of Piece.weight_lb over YardPlacement rows with yard_slot_id == this YardSlot.id AND status == ACTIVE."
        default: 0
      - name: stacked_count
        type: integer
        source: computed
        description: "Count of YardPlacement rows with yard_slot_id == this YardSlot.id AND status == ACTIVE."
        default: 0

  - name: YardPlacement
    parent: null
    common_fields: true
    fields:
      - name: piece_id
        type: string
        source: input
        description: "FK -> Piece.id; the stored piece."
      - name: yard_slot_id
        type: string
        source: input
        description: "FK -> YardSlot.id; the slot the piece occupies."
      - name: stack_level
        type: integer
        source: input
        description: "1-based level within the stack."
        constraints: ">= 1"
      - name: placed_at
        type: datetime
        source: system
        description: "Logical-clock instant of placement."
      - name: released_at
        type: datetime
        source: system
        description: "Logical-clock instant the placement stopped being ACTIVE; null while ACTIVE."
        default: null
      - name: release_reason
        type: enum
        source: system
        description: "Why the placement ended; null while ACTIVE."
        default: null
        constraints: "LOAD | SCRAP | RESTACK"
      - name: status
        type: enum
        source: system
        description: "ACTIVE while the piece physically occupies the slot."
        default: ACTIVE
        constraints: "ACTIVE | RELEASED"

  - name: HaulPermit
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the package this permit was pulled for."
      - name: permit_number
        type: string
        source: input
        description: "State permit number; unique across all HaulPermit rows."
        constraints: "unique"
      - name: issuing_state
        type: string
        source: input
        description: "Two-letter state code."
      - name: max_width_ft
        type: number
        source: input
        description: "Widest load the permit authorises."
        constraints: "> 0"
      - name: max_height_ft
        type: number
        source: input
        description: "Tallest load the permit authorises."
        constraints: "> 0"
      - name: max_length_ft
        type: number
        source: input
        description: "Longest load the permit authorises."
        constraints: "> 0"
      - name: max_gross_weight_lb
        type: number
        source: input
        description: "Heaviest gross combination weight the permit authorises."
        constraints: "> 0"
      - name: valid_from
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the permit window (inclusive)."
      - name: valid_to
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the permit window (inclusive)."
        constraints: "> valid_from"
      - name: escort_count
        type: integer
        source: input
        description: "Number of pilot-car escorts the permit mandates; feeds shipment_permit_fee."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Permit lifecycle."
        default: APPLIED
        constraints: "APPLIED | ISSUED | ACTIVE | CONSUMED | EXPIRED"

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; every loaded piece must belong to this project."
      - name: haul_permit_id
        type: string
        source: input
        description: "FK -> HaulPermit.id; nullable — legal loads travel without a permit."
        default: null
      - name: scheduled_departure
        type: datetime
        source: input
        description: "ISO 8601 UTC planned departure."
      - name: status
        type: enum
        source: system
        description: "Load lifecycle."
        default: BUILDING
        constraints: "BUILDING | DISPATCHED | DELIVERED"
      - name: line_count
        type: integer
        source: computed
        description: "Count of ShipmentLine rows with shipment_id == this Shipment.id."
        default: 0
      - name: gross_weight_lb
        type: number
        source: computed
        description: "Output of shipment_load_metrics."
        default: 32000
      - name: max_width_ft
        type: number
        source: computed
        description: "Output of shipment_load_metrics; 0 when line_count == 0."
        default: 0
      - name: max_height_ft
        type: number
        source: computed
        description: "Output of shipment_load_metrics; 0 when line_count == 0."
        default: 0
      - name: max_length_ft
        type: number
        source: computed
        description: "Output of shipment_load_metrics; 0 when line_count == 0."
        default: 0
      - name: is_oversize
        type: boolean
        source: computed
        description: "Output of shipment_load_metrics."
        default: false
      - name: permit_fee_cents
        type: integer
        source: computed
        description: "Output of shipment_permit_fee; 0 while is_oversize is false."
        default: 0
      - name: dispatched_at
        type: datetime
        source: system
        description: "Logical-clock instant of the BUILDING -> DISPATCHED transition."
        default: null

  - name: ShipmentLine
    parent: null
    common_fields: false
    fields:
      - name: shipment_id
        type: string
        source: system
        description: "FK -> Shipment.id; taken from the path of the creating call."
      - name: piece_id
        type: string
        source: input
        description: "FK -> Piece.id; the loaded piece."
      - name: load_position
        type: integer
        source: input
        description: "1-based position on the trailer; 1 is loaded first and therefore erected last. Unique within a shipment."
        constraints: ">= 1; unique per shipment_id"
      - name: line_surcharge_cents
        type: integer
        source: computed
        description: "Output of shipment_permit_fee; this line's rounded oversize surcharge."
      - name: loaded_at
        type: datetime
        source: system
        description: "Logical-clock instant the line was added."

  - name: RepairDisposition
    parent: null
    common_fields: true
    fields:
      - name: piece_id
        type: string
        source: input
        description: "FK -> Piece.id; the nonconforming piece."
      - name: defect_type
        type: enum
        source: input
        description: "Observed defect family."
        constraints: "SPALL | HONEYCOMB | CRACK | DIMENSIONAL | FINISH"
      - name: severity
        type: enum
        source: input
        description: "Severity as judged by the technician who opened the NCR."
        constraints: "MINOR | MAJOR | STRUCTURAL"
      - name: description
        type: string
        source: input
        description: "Free-text defect narrative."
      - name: disposition
        type: enum
        source: system
        description: "Engineer's decision; null while status is OPEN or SUPERSEDED."
        default: null
        constraints: "PATCH_MINOR | STRUCTURAL_REPAIR | USE_AS_IS | REJECT_RECAST"
      - name: status
        type: enum
        source: system
        description: "Disposition lifecycle; REINSPECTION can loop back to REPAIR_IN_PROGRESS."
        default: OPEN
        constraints: "OPEN | DISPOSITIONED | REPAIR_IN_PROGRESS | REINSPECTION | CLOSED_ACCEPTED | REJECTED_RECAST | SUPERSEDED"
      - name: reinspection_fail_count
        type: integer
        source: computed
        description: "Number of reinspect calls on this row that returned FAIL."
        default: 0
      - name: opened_by_user_id
        type: string
        source: system
        description: "X-User-ID of the QCTechnician who opened the NCR."
      - name: dispositioned_by_user_id
        type: string
        source: system
        description: "X-User-ID of the QualityEngineer who decided the disposition; null while OPEN."
        default: null
      - name: repaired_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ProductionSupervisor who started the repair; null until start-repair."
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: MixDesign
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: QUALIFIED
        trigger: "POST /mix-designs/{id}/qualify"
        actor: QualityEngineer
        preconditions:
          - "mix_design.status == DRAFT"
        side_effects:
          - "sets mix_design.qualified_at to the current logical clock instant"
          - "increments MixDesign.version by 1"
      - from: QUALIFIED
        to: SUSPENDED
        trigger: "POST /mix-designs/{id}/suspend"
        actor: QualityEngineer
        preconditions:
          - "mix_design.status == QUALIFIED"
        side_effects:
          - "sets mix_design.suspension_reason to the request reason"
          - "CASCADE HOP 1: every BedRun with mix_design_id == this mix AND status == SCHEDULED moves SCHEDULED -> BLOCKED and gets blocked_reason = MIX_SUSPENDED"
          - "CASCADE HOP 2 (caused by hop 1, not by the suspend call): for every run that just became BLOCKED, every Piece with bed_run_id == that run AND qc_status == PENDING moves qc_status PENDING -> HOLD and gets qc_hold_reason = MIX_SUSPENDED"
          - "CASCADE HOP 3 (caused by hop 2): every Project owning a piece that just moved to HOLD recomputes held_piece_count and cleared_piece_count"
      - from: SUSPENDED
        to: QUALIFIED
        trigger: "POST /mix-designs/{id}/reinstate"
        actor: QualityEngineer
        preconditions:
          - "mix_design.status == SUSPENDED"
        side_effects:
          - "clears mix_design.suspension_reason to null; qualified_at is NOT overwritten"
          - "COMPENSATION HOP 1: every BedRun with mix_design_id == this mix AND status == BLOCKED moves BLOCKED -> SCHEDULED and blocked_reason is cleared to null"
          - "COMPENSATION HOP 2 (caused by hop 1): for every run that just became SCHEDULED, every Piece with bed_run_id == that run AND qc_status == HOLD AND qc_hold_reason == MIX_SUSPENDED moves qc_status HOLD -> PENDING and qc_hold_reason is cleared to null"
          - "COMPENSATION HOP 3 (caused by hop 2): every affected Project recomputes held_piece_count"
        note: "QUALIFIED -> SUSPENDED -> QUALIFIED is the revision loop that makes this machine cyclic."
      - from: SUSPENDED
        to: RETIRED
        trigger: "POST /mix-designs/{id}/retire"
        actor: QualityEngineer
        preconditions:
          - "mix_design.status == SUSPENDED"
          - "no BedRun with mix_design_id == this mix has status IN {SCHEDULED, BLOCKED, TENSIONED, CURING, RELEASE_READY, RELEASED}"
        side_effects:
          - "increments MixDesign.version by 1"
        note: "Terminal. RETIRED is reachable only from SUSPENDED, so retiring a live mix always costs a suspend first."

  - entity: CastingBed
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: OCCUPIED
        trigger: "POST /bed-runs/{id}/tension"
        actor: ProductionSupervisor
        preconditions:
          - "casting_bed.status == AVAILABLE"
        side_effects:
          - "adds the run's computed_jacking_force_kips to casting_bed.committed_strand_force_kips"
      - from: OCCUPIED
        to: AVAILABLE
        trigger: "POST /bed-runs/{id}/abort-tensioning"
        actor: ProductionSupervisor
        preconditions:
          - "casting_bed.status == OCCUPIED"
        side_effects:
          - "subtracts the run's computed_jacking_force_kips from casting_bed.committed_strand_force_kips, restoring the pre-tension value exactly"
      - from: OCCUPIED
        to: AVAILABLE
        trigger: "POST /bed-runs/{id}/strip"
        actor: ProductionSupervisor
        preconditions:
          - "casting_bed.status == OCCUPIED"
        side_effects:
          - "subtracts the run's computed_jacking_force_kips from casting_bed.committed_strand_force_kips"
          - "increments casting_bed.cumulative_cycle_count by 1"
      - from: DOWN
        to: DOWN
        trigger: "any call that would tension a run on this bed"
        actor: ProductionSupervisor
        preconditions:
          - "casting_bed.status == DOWN"
        side_effects: []
        note: "DOWN is seeded at creation and is absorbing: no transition leaves it. Tensioning is rejected with ERR_PLANT_RESOURCE_UNAVAILABLE."

  - entity: BedRun
    initial_state: SCHEDULED
    terminal_states: [STRIPPED]
    transitions:
      - from: SCHEDULED
        to: BLOCKED
        trigger: "system: MixDesign QUALIFIED -> SUSPENDED cascade"
        actor: system
        preconditions:
          - "bed_run.status == SCHEDULED"
          - "bed_run.mix_design_id == the suspended MixDesign.id"
        side_effects:
          - "sets blocked_reason = MIX_SUSPENDED"
          - "propagates a QC hold onto every Piece with bed_run_id == this run AND qc_status == PENDING"
      - from: BLOCKED
        to: SCHEDULED
        trigger: "system: MixDesign SUSPENDED -> QUALIFIED cascade"
        actor: system
        preconditions:
          - "bed_run.status == BLOCKED"
        side_effects:
          - "clears blocked_reason to null"
          - "lifts the MIX_SUSPENDED QC hold from every Piece with bed_run_id == this run"
      - from: SCHEDULED
        to: TENSIONED
        trigger: "POST /bed-runs/{id}/tension"
        actor: ProductionSupervisor
        preconditions:
          - "bed_run.status == SCHEDULED"
          - "casting_bed.status == AVAILABLE"
          - "mix_design.status == QUALIFIED"
          - "computed_jacking_force_kips <= casting_bed.max_strand_force_kips"
          - "abs(elongation_deviation_pct) <= ELONGATION_TOLERANCE_PCT"
        side_effects:
          - "runs strand_jacking_force and writes computed_jacking_force_kips, theoretical_elongation_in and elongation_deviation_pct"
          - "casting_bed.status AVAILABLE -> OCCUPIED"
          - "casting_bed.committed_strand_force_kips += computed_jacking_force_kips"
      - from: TENSIONED
        to: SCHEDULED
        trigger: "POST /bed-runs/{id}/abort-tensioning"
        actor: ProductionSupervisor
        preconditions:
          - "bed_run.status == TENSIONED"
        side_effects:
          - "casting_bed.committed_strand_force_kips -= computed_jacking_force_kips"
          - "casting_bed.status OCCUPIED -> AVAILABLE"
          - "resets computed_jacking_force_kips, theoretical_elongation_in, elongation_deviation_pct, strand_count, strand_diameter_in and measured_elongation_in to null"
        note: "TENSIONED -> SCHEDULED is the revert edge; the bed may be re-tensioned afterwards."
      - from: TENSIONED
        to: CURING
        trigger: "POST /bed-runs/{id}/cast"
        actor: ProductionSupervisor
        preconditions:
          - "bed_run.status == TENSIONED"
          - "piece_count >= 1"
          - "mix_design.status == QUALIFIED"
        side_effects:
          - "sets cast_at to the current logical clock instant"
          - "every Piece with bed_run_id == this run AND production_status == SCHEDULED moves production_status SCHEDULED -> CAST"
          - "the same pieces move qc_status PENDING -> HOLD with qc_hold_reason = AWAITING_RELEASE_STRENGTH"
          - "every CuringCycle with bed_run_id == this run AND status == SCHEDULED moves SCHEDULED -> RUNNING"
          - "every Project owning an affected piece recomputes held_piece_count"
      - from: CURING
        to: RELEASE_READY
        trigger: "system: evaluated after every POST /cylinder-sets/{id}/breaks and every POST /curing-cycles/{id}/complete"
        actor: system
        preconditions:
          - "bed_run.status == CURING"
          - "at least one CylinderSet with bed_run_id == this run AND purpose == RELEASE AND status == RELEASE_MET exists"
          - "the run has at least one CuringCycle and every CuringCycle with bed_run_id == this run has status == COMPLETED"
        side_effects:
          - "CASCADE HOP 3: every Piece with bed_run_id == this run AND qc_status == HOLD AND qc_hold_reason == AWAITING_RELEASE_STRENGTH moves qc_status HOLD -> CLEARED and qc_hold_reason is cleared to null"
          - "CASCADE HOP 4 (caused by hop 3): every Project owning such a piece recomputes held_piece_count and cleared_piece_count"
      - from: RELEASE_READY
        to: RELEASED
        trigger: "POST /bed-runs/{id}/request-release"
        actor: QualityEngineer
        preconditions:
          - "bed_run.status IN {CURING, RELEASE_READY} - the priority-8 state gate deliberately admits CURING so that a premature release attempt is rejected by the priority-10 QC gate (ERR_NO_VALID_SPECIMENS / ERR_RELEASE_STRENGTH_NOT_MET / ERR_CURING_NOT_COMPLETE) rather than by a generic state error; only a run that is already RELEASE_READY can pass all of the gates below and actually transition"
          - "a CylinderSet with purpose == RELEASE exists on this run"
          - "that set's qualified_strength_psi IS NOT NULL"
          - "that set's qualified_strength_psi >= mix_design.required_release_psi"
          - "every CuringCycle on this run has status == COMPLETED"
          - "the acting X-User-ID is not present in that set's recorded_by_user_ids"
        side_effects:
          - "sets released_at to the current logical clock instant"
      - from: RELEASED
        to: STRIPPED
        trigger: "POST /bed-runs/{id}/strip"
        actor: ProductionSupervisor
        preconditions:
          - "bed_run.status == RELEASED"
        side_effects:
          - "runs bed_run_cost_allocation and writes concrete_cost_cents, strand_cost_cents, energy_cost_cents, form_setup_cents, direct_subtotal_cents, overhead_rate_pct, overhead_cents and total_cost_cents"
          - "writes Piece.allocated_cost_cents on every Piece with bed_run_id == this run AND production_status == CAST"
          - "those pieces move production_status CAST -> STRIPPED"
          - "every Project owning such a piece recomputes committed_cost_cents"
          - "casting_bed.committed_strand_force_kips -= computed_jacking_force_kips"
          - "casting_bed.status OCCUPIED -> AVAILABLE and casting_bed.cumulative_cycle_count += 1"

  - entity: CuringCycle
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "system: POST /bed-runs/{id}/cast cascade"
        actor: system
        preconditions:
          - "curing_cycle.status == SCHEDULED"
          - "the owning BedRun moved TENSIONED -> CURING in this request"
        side_effects: []
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /curing-cycles/{id}/complete"
        actor: ProductionSupervisor
        preconditions:
          - "curing_cycle.status == RUNNING"
        side_effects:
          - "runs curing_energy_accounting and writes metered_therms, energy_therms, energy_source, energy_variance_pct, variance_flagged and energy_cost_cents"
          - "re-evaluates the owning BedRun's CURING -> RELEASE_READY auto-transition"

  - entity: CylinderSet
    initial_state: CAST
    terminal_states: []
    transitions:
      - from: CAST
        to: TESTING
        trigger: "POST /cylinder-sets/{id}/breaks"
        actor: QCTechnician
        preconditions:
          - "cylinder_set.status == CAST"
          - "recorded_break_count < specimen_count"
          - "the owning BedRun.status != STRIPPED"
        side_effects:
          - "appends the acting X-User-ID to recorded_by_user_ids when not already present"
          - "re-runs cylinder_set_qualified_strength over EVERY break of the set, rewriting inclusion_status on breaks recorded earlier"
        note: "After every break the set's status is recomputed by one rule: TESTING when valid_break_count < 2, RELEASE_MET when qualified_strength_psi >= mix_design.required_release_psi, RELEASE_NOT_MET otherwise. The five rows below enumerate the reachable edges of that rule."
      - from: TESTING
        to: RELEASE_MET
        trigger: "POST /cylinder-sets/{id}/breaks"
        actor: QCTechnician
        preconditions:
          - "cylinder_set.status == TESTING"
          - "after recomputation valid_break_count >= 2 AND qualified_strength_psi >= mix_design.required_release_psi"
        side_effects:
          - "CASCADE HOP 1: qualified_strength_psi and strength_variant are written on the set"
          - "CASCADE HOP 2 (caused by hop 1): when purpose == RELEASE, the owning BedRun.status == CURING and every CuringCycle of the run is COMPLETED, the run moves CURING -> RELEASE_READY"
      - from: TESTING
        to: RELEASE_NOT_MET
        trigger: "POST /cylinder-sets/{id}/breaks"
        actor: QCTechnician
        preconditions:
          - "cylinder_set.status == TESTING"
          - "after recomputation valid_break_count >= 2 AND qualified_strength_psi < mix_design.required_release_psi"
        side_effects:
          - "no cascade fires; the owning BedRun stays in CURING"
      - from: RELEASE_NOT_MET
        to: RELEASE_MET
        trigger: "POST /cylinder-sets/{id}/breaks"
        actor: QCTechnician
        preconditions:
          - "cylinder_set.status == RELEASE_NOT_MET"
          - "recorded_break_count < specimen_count"
          - "after recomputation valid_break_count >= 2 AND qualified_strength_psi >= mix_design.required_release_psi"
        side_effects:
          - "the same two-hop cascade as the TESTING -> RELEASE_MET row"
        note: "A later, stronger cylinder can lift a set back out of RELEASE_NOT_MET."
      - from: RELEASE_MET
        to: RELEASE_NOT_MET
        trigger: "POST /cylinder-sets/{id}/breaks"
        actor: QCTechnician
        preconditions:
          - "cylinder_set.status == RELEASE_MET"
          - "recorded_break_count < specimen_count"
          - "after recomputation valid_break_count >= 2 AND qualified_strength_psi < mix_design.required_release_psi"
        side_effects:
          - "the set falls back, but a BedRun that already reached RELEASE_READY or RELEASED does NOT revert"
        note: "RELEASE_MET -> RELEASE_NOT_MET -> RELEASE_MET is the retest loop that makes this machine cyclic."
      - from: RELEASE_MET
        to: TESTING
        trigger: "POST /cylinder-sets/{id}/breaks"
        actor: QCTechnician
        preconditions:
          - "cylinder_set.status IN {RELEASE_MET, RELEASE_NOT_MET}"
          - "recorded_break_count < specimen_count"
          - "after recomputation valid_break_count < 2 because the new break widened the outlier band enough to discard previously valid specimens"
        side_effects:
          - "qualified_strength_psi is reset to null"

  - entity: Piece
    dimension: production_status
    initial_state: PLANNED
    terminal_states: [ERECTED, SCRAPPED]
    transitions:
      - from: PLANNED
        to: SCHEDULED
        trigger: "POST /pieces/{id}/assign-run"
        actor: ProductionSupervisor
        preconditions:
          - "piece.production_status == PLANNED"
          - "bed_run.status IN {SCHEDULED, TENSIONED}"
          - "piece.mix_design_id == bed_run.mix_design_id"
        side_effects:
          - "sets piece.bed_run_id"
          - "bed_run.piece_count is recomputed"
      - from: SCHEDULED
        to: CAST
        trigger: "system: POST /bed-runs/{id}/cast cascade"
        actor: system
        preconditions:
          - "piece.production_status == SCHEDULED"
        side_effects:
          - "qc_status PENDING -> HOLD with qc_hold_reason = AWAITING_RELEASE_STRENGTH"
      - from: CAST
        to: STRIPPED
        trigger: "system: POST /bed-runs/{id}/strip cascade"
        actor: system
        preconditions:
          - "piece.production_status == CAST"
        side_effects:
          - "writes piece.allocated_cost_cents from bed_run_cost_allocation"
      - from: STRIPPED
        to: YARDED
        trigger: "POST /yard-placements"
        actor: YardForeman
        preconditions:
          - "piece.production_status == STRIPPED"
          - "yard_slot.status IN {EMPTY, PARTIAL}"
        side_effects:
          - "yard_slot.occupied_weight_lb += piece.weight_lb; yard_slot.stacked_count += 1; yard_slot.status recomputed"
      - from: YARDED
        to: STRIPPED
        trigger: "POST /yard-placements/{id}/pull with release_reason RESTACK"
        actor: YardForeman
        preconditions:
          - "piece.production_status == YARDED"
          - "yard_placement.status == ACTIVE"
        side_effects:
          - "yard_slot.occupied_weight_lb -= piece.weight_lb; yard_slot.stacked_count -= 1; yard_slot.status recomputed, restoring the pre-placement values exactly"
        note: "YARDED -> STRIPPED -> YARDED is the restack loop."
      - from: YARDED
        to: LOADED
        trigger: "POST /shipments/{id}/lines"
        actor: YardForeman
        preconditions:
          - "piece.production_status == YARDED"
          - "piece.qc_status IN {CLEARED, REPAIRED}"
          - "shipment.status == BUILDING"
          - "piece.project_id == shipment.project_id"
        side_effects:
          - "CASCADE HOP 1: the piece's ACTIVE YardPlacement moves ACTIVE -> RELEASED with release_reason = LOAD"
          - "CASCADE HOP 2 (caused by hop 1): its YardSlot decrements occupied_weight_lb and stacked_count and recomputes status"
          - "shipment_load_metrics and shipment_permit_fee are recomputed on the Shipment"
      - from: LOADED
        to: SHIPPED
        trigger: "system: POST /shipments/{id}/deliver cascade"
        actor: system
        preconditions:
          - "piece.production_status == LOADED"
        side_effects: []
      - from: SHIPPED
        to: ERECTED
        trigger: "POST /pieces/{id}/confirm-erected"
        actor: ProjectOwner
        preconditions:
          - "piece.production_status == SHIPPED"
          - "the acting X-User-ID == piece.project_id"
          - "every Piece of the same project with erection_sequence_no < this piece's has production_status IN {ERECTED, SCRAPPED}"
        side_effects:
          - "Project.erected_piece_count is recomputed"
      - from: STRIPPED
        to: SCRAPPED
        trigger: "system: RepairDisposition -> REJECTED_RECAST cascade"
        actor: system
        preconditions:
          - "piece.production_status IN {PLANNED, SCHEDULED, CAST, STRIPPED, YARDED}"
        side_effects:
          - "qc_status -> REJECTED"
          - "any ACTIVE YardPlacement of the piece moves ACTIVE -> RELEASED with release_reason = SCRAP and its YardSlot is decremented"
          - "Project.scrapped_piece_count is recomputed"
      - from: YARDED
        to: SCRAPPED
        trigger: "system: RepairDisposition -> REJECTED_RECAST cascade"
        actor: system
        preconditions:
          - "piece.production_status == YARDED"
        side_effects:
          - "CASCADE HOP 2: qc_status -> REJECTED"
          - "CASCADE HOP 3 (caused by hop 2): the piece's ACTIVE YardPlacement moves ACTIVE -> RELEASED with release_reason = SCRAP, and its YardSlot decrements occupied_weight_lb by piece.weight_lb, decrements stacked_count by 1 and recomputes status"
          - "CASCADE HOP 4 (caused by hop 3): the owning Project recomputes scrapped_piece_count and cleared_piece_count"

  - entity: Piece
    dimension: qc_status
    initial_state: PENDING
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING
        to: HOLD
        trigger: "system: POST /bed-runs/{id}/cast cascade, or MixDesign suspend cascade"
        actor: system
        preconditions:
          - "piece.qc_status == PENDING"
        side_effects:
          - "sets qc_hold_reason to AWAITING_RELEASE_STRENGTH (cast) or MIX_SUSPENDED (mix suspension)"
      - from: HOLD
        to: PENDING
        trigger: "system: MixDesign SUSPENDED -> QUALIFIED cascade"
        actor: system
        preconditions:
          - "piece.qc_status == HOLD"
          - "piece.qc_hold_reason == MIX_SUSPENDED"
        side_effects:
          - "clears qc_hold_reason to null"
      - from: HOLD
        to: CLEARED
        trigger: "system: BedRun CURING -> RELEASE_READY cascade"
        actor: system
        preconditions:
          - "piece.qc_status == HOLD"
          - "piece.qc_hold_reason == AWAITING_RELEASE_STRENGTH"
        side_effects:
          - "clears qc_hold_reason to null"
          - "owning Project recomputes held_piece_count and cleared_piece_count"
      - from: CLEARED
        to: NONCONFORMING
        trigger: "POST /repair-dispositions"
        actor: QCTechnician
        preconditions:
          - "piece.qc_status IN {PENDING, HOLD, CLEARED, NONCONFORMING, REPAIRED} - every value except REJECTED, which is terminal. Opening a report on an already NONCONFORMING piece is a self-loop that leaves qc_status at NONCONFORMING and supersedes the earlier report; it is exactly the operation the OCC rule on Piece.version guards."
        side_effects:
          - "sets qc_hold_reason = OPEN_NCR"
          - "every RepairDisposition of this piece with status IN {OPEN, DISPOSITIONED, REPAIR_IN_PROGRESS, REINSPECTION} moves to SUPERSEDED"
          - "increments Piece.version by 1"
      - from: NONCONFORMING
        to: REPAIRED
        trigger: "system: RepairDisposition -> CLOSED_ACCEPTED cascade"
        actor: system
        preconditions:
          - "piece.qc_status == NONCONFORMING"
        side_effects:
          - "clears qc_hold_reason to null"
          - "piece.repair_count is recomputed"
          - "owning Project recomputes cleared_piece_count"
      - from: REPAIRED
        to: NONCONFORMING
        trigger: "POST /repair-dispositions (a second NCR on the same piece)"
        actor: QCTechnician
        preconditions:
          - "piece.qc_status == REPAIRED"
        side_effects:
          - "sets qc_hold_reason = OPEN_NCR"
        note: "NONCONFORMING -> REPAIRED -> NONCONFORMING is the rework loop on the QC dimension; it is independent of the production dimension, which keeps advancing meanwhile."
      - from: NONCONFORMING
        to: REJECTED
        trigger: "system: RepairDisposition -> REJECTED_RECAST cascade"
        actor: system
        preconditions:
          - "piece.qc_status == NONCONFORMING"
        side_effects:
          - "production_status -> SCRAPPED and the yard cascade fires"

  - entity: YardPlacement
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /yard-placements/{id}/pull, or the LOAD/SCRAP cascades"
        actor: YardForeman
        preconditions:
          - "yard_placement.status == ACTIVE"
        side_effects:
          - "sets released_at and release_reason"
          - "yard_slot.occupied_weight_lb -= piece.weight_lb; yard_slot.stacked_count -= 1; yard_slot.status recomputed"
          - "when release_reason == RESTACK the piece moves YARDED -> STRIPPED; when LOAD it moves YARDED -> LOADED; when SCRAP it moves to SCRAPPED"

  - entity: HaulPermit
    initial_state: APPLIED
    terminal_states: [CONSUMED, EXPIRED]
    transitions:
      - from: APPLIED
        to: ISSUED
        trigger: "POST /haul-permits/{id}/issue"
        actor: PermitCoordinator
        preconditions:
          - "haul_permit.status == APPLIED"
        side_effects: []
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /shipments/{id}/dispatch"
        actor: YardForeman
        preconditions:
          - "haul_permit.status == ISSUED"
          - "valid_from <= current logical clock instant <= valid_to"
        side_effects: []
      - from: ISSUED
        to: EXPIRED
        trigger: "system: POST /shipments/{id}/dispatch attempted after valid_to"
        actor: system
        preconditions:
          - "haul_permit.status == ISSUED"
          - "current logical clock instant > valid_to"
        side_effects:
          - "the dispatch call is rejected with ERR_PERMIT_EXPIRED; the permit is left in EXPIRED"
      - from: ACTIVE
        to: CONSUMED
        trigger: "POST /shipments/{id}/deliver"
        actor: YardForeman
        preconditions:
          - "haul_permit.status == ACTIVE"
        side_effects: []

  - entity: Shipment
    initial_state: BUILDING
    terminal_states: [DELIVERED]
    transitions:
      - from: BUILDING
        to: DISPATCHED
        trigger: "POST /shipments/{id}/dispatch"
        actor: YardForeman
        preconditions:
          - "shipment.status == BUILDING"
          - "line_count >= 1"
          - "the lines ordered by load_position ASC have strictly descending piece.erection_sequence_no"
          - "when is_oversize is true: haul_permit_id IS NOT NULL, that permit's status == ISSUED, the clock is inside its window, and the load fits its envelope and gross weight"
        side_effects:
          - "sets dispatched_at"
          - "the linked HaulPermit moves ISSUED -> ACTIVE"
      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /shipments/{id}/deliver"
        actor: YardForeman
        preconditions:
          - "shipment.status == DISPATCHED"
        side_effects:
          - "every Piece on a line of this shipment moves production_status LOADED -> SHIPPED"
          - "the linked HaulPermit moves ACTIVE -> CONSUMED"

  - entity: RepairDisposition
    initial_state: OPEN
    terminal_states: [CLOSED_ACCEPTED, REJECTED_RECAST, SUPERSEDED]
    transitions:
      - from: OPEN
        to: DISPOSITIONED
        trigger: "POST /repair-dispositions/{id}/disposition with disposition IN {PATCH_MINOR, STRUCTURAL_REPAIR}"
        actor: QualityEngineer
        preconditions:
          - "repair_disposition.status == OPEN"
        side_effects:
          - "writes disposition and dispositioned_by_user_id"
      - from: OPEN
        to: CLOSED_ACCEPTED
        trigger: "POST /repair-dispositions/{id}/disposition with disposition == USE_AS_IS"
        actor: QualityEngineer
        preconditions:
          - "repair_disposition.status == OPEN"
        side_effects:
          - "the Piece moves qc_status NONCONFORMING -> REPAIRED and qc_hold_reason is cleared"
          - "Piece.repair_count and Project.cleared_piece_count are recomputed"
      - from: OPEN
        to: REJECTED_RECAST
        trigger: "POST /repair-dispositions/{id}/disposition with disposition == REJECT_RECAST"
        actor: QualityEngineer
        preconditions:
          - "repair_disposition.status == OPEN"
        side_effects:
          - "CASCADE HOP 1: writes disposition = REJECT_RECAST and dispositioned_by_user_id"
          - "CASCADE HOP 2 (caused by hop 1): the Piece moves qc_status NONCONFORMING -> REJECTED and production_status -> SCRAPPED"
          - "CASCADE HOP 3 (caused by hop 2): the piece's ACTIVE YardPlacement moves ACTIVE -> RELEASED with release_reason = SCRAP and its YardSlot decrements occupied_weight_lb and stacked_count and recomputes status"
          - "CASCADE HOP 4 (caused by hop 3): the owning Project recomputes scrapped_piece_count and cleared_piece_count"
        note: "This is the branch point: the same endpoint reaches three different states with three different side-effect sets depending on the disposition value."
      - from: DISPOSITIONED
        to: REPAIR_IN_PROGRESS
        trigger: "POST /repair-dispositions/{id}/start-repair"
        actor: ProductionSupervisor
        preconditions:
          - "repair_disposition.status == DISPOSITIONED"
          - "the acting X-User-ID != repair_disposition.dispositioned_by_user_id"
        side_effects:
          - "writes repaired_by_user_id"
      - from: REPAIR_IN_PROGRESS
        to: REINSPECTION
        trigger: "POST /repair-dispositions/{id}/submit-reinspection"
        actor: ProductionSupervisor
        preconditions:
          - "repair_disposition.status == REPAIR_IN_PROGRESS"
        side_effects: []
      - from: REINSPECTION
        to: REPAIR_IN_PROGRESS
        trigger: "POST /repair-dispositions/{id}/reinspect with result == FAIL and reinspection_fail_count < MAX_REINSPECTION_FAILS"
        actor: QualityEngineer
        preconditions:
          - "repair_disposition.status == REINSPECTION"
          - "reinspection_fail_count < MAX_REINSPECTION_FAILS after the increment"
        side_effects:
          - "increments reinspection_fail_count by 1"
        note: "REPAIR_IN_PROGRESS -> REINSPECTION -> REPAIR_IN_PROGRESS is the rework loop that makes this machine cyclic."
      - from: REINSPECTION
        to: CLOSED_ACCEPTED
        trigger: "POST /repair-dispositions/{id}/reinspect with result == PASS"
        actor: QualityEngineer
        preconditions:
          - "repair_disposition.status == REINSPECTION"
        side_effects:
          - "the Piece moves qc_status NONCONFORMING -> REPAIRED and qc_hold_reason is cleared to null"
          - "Piece.repair_count and Project.cleared_piece_count are recomputed"
      - from: REINSPECTION
        to: REJECTED_RECAST
        trigger: "POST /repair-dispositions/{id}/reinspect with result == FAIL when reinspection_fail_count would reach MAX_REINSPECTION_FAILS"
        actor: QualityEngineer
        preconditions:
          - "repair_disposition.status == REINSPECTION"
          - "reinspection_fail_count + 1 == MAX_REINSPECTION_FAILS"
        side_effects:
          - "increments reinspection_fail_count to MAX_REINSPECTION_FAILS"
          - "the same four-hop scrap cascade as the OPEN -> REJECTED_RECAST row fires"
      - from: OPEN
        to: SUPERSEDED
        trigger: "system: POST /repair-dispositions creating a newer NCR on the same piece"
        actor: system
        preconditions:
          - "repair_disposition.status IN {OPEN, DISPOSITIONED, REPAIR_IN_PROGRESS, REINSPECTION}"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: ncr-create-stale-piece
    parent_entity: Piece
    write_endpoint: "POST /repair-dispositions"
    occ_field: "expected_piece_version"
    description: |
      Opening a nonconformance report against a Piece whose version has advanced
      since the client last read it is rejected. A second NCR on the same piece
      is a legitimate product operation - it supersedes the earlier open report -
      so nothing in the state machine stops it; the only defence against a writer
      acting on a stale view of the piece's QC standing is the version check.
    error_id: ERR_STALE_PIECE_VERSION
    http_status: 412

  - rule_id: placement-create-stale-slot
    parent_entity: YardSlot
    write_endpoint: "POST /yard-placements"
    occ_field: "expected_yard_slot_version"
    description: |
      Placing a piece into a YardSlot whose version has advanced since the client
      last read it is rejected. Slots legitimately accept several stacked pieces,
      so a later placement into the same slot is not blocked by any state
      precondition; the version check is what stops a writer from committing a
      placement computed against an out-of-date occupied_weight_lb.
    error_id: ERR_STALE_YARD_SLOT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: cylinder_break_strength_psi
    trigger: "POST /cylinder-sets/{id}/breaks - once per newly recorded CylinderBreak"
    algorithm: aggregation
    formula: |
      area_in2    = PI * (diameter_in / 2) ** 2          # PI = 3.14159265358979
      computed_psi = round_half_up(load_lbf / area_in2, 0)   # integer psi
      age_hours    = round_half_up((break_at - cylinder_set.cast_at) / 3600 seconds, 2)
    input_set: "The single CylinderBreak row being created. break_at is the logical clock instant at the moment of the call."
    constants:
      PI: 3.14159265358979
      AREA_4IN: 12.566370614359172
      AREA_6IN: 28.274333882308138
    precision: "computed_psi: 0 decimal places, round_half_up. age_hours: 2 decimal places, round_half_up."
    variants: []

  - name: cylinder_set_qualified_strength
    trigger: "POST /cylinder-sets/{id}/breaks - the whole set is recomputed from scratch after every new break, including inclusion_status on breaks recorded earlier"
    algorithm: threshold
    formula: |
      breaks = all CylinderBreak rows with cylinder_set_id == set.id,
               ordered by break_at ASC, then created_at ASC
      raw_mean_psi = round_half_up(mean(b.computed_psi for b in breaks), 2)

      if set.specimen_count == 2:
          # ---- variant SET_AVERAGE ----
          strength_variant = SET_AVERAGE
          every b in breaks keeps inclusion_status = VALID   # no trimming at all
          included = breaks
      else:                                   # set.specimen_count >= 3
          # ---- variant TRIMMED_AVERAGE ----
          strength_variant = TRIMMED_AVERAGE
          lo = raw_mean_psi * (1 - OUTLIER_TOLERANCE_PCT / 100)
          hi = raw_mean_psi * (1 + OUTLIER_TOLERANCE_PCT / 100)
          for b in breaks:
              b.inclusion_status = VALID if (lo <= b.computed_psi <= hi) else DISCARDED_OUTLIER
          included = [b for b in breaks if b.inclusion_status == VALID]
          # SINGLE PASS ONLY: the band is computed once from raw_mean_psi over ALL
          # breaks and is NOT recomputed from the surviving subset.

      valid_break_count = len(included)
      if valid_break_count < 2:
          qualified_strength_psi = null          # empty / too-thin evidence set
      else:
          qualified_strength_psi = round_half_up(mean(b.computed_psi for b in included), 0)
    input_set: "Every CylinderBreak row of the set regardless of inclusion_status; inclusion_status is an output of this rule, never an input to it."
    constants:
      OUTLIER_TOLERANCE_PCT: 10.0
    precision: "raw_mean_psi: 2 decimal places, round_half_up. qualified_strength_psi: 0 decimal places, round_half_up."
    variants:
      - name: SET_AVERAGE
        when: "cylinder_set.specimen_count == 2"
        difference: "No outlier trim runs at all; the plain mean of both breaks is the qualified strength, so a single weak cylinder drags the set below the release threshold."
      - name: TRIMMED_AVERAGE
        when: "cylinder_set.specimen_count >= 3"
        difference: "Breaks more than OUTLIER_TOLERANCE_PCT away from the untrimmed mean are marked DISCARDED_OUTLIER first, and the qualified strength is the mean of the survivors. For breaks {3600, 3550, 2900} psi this yields 3575 while SET_AVERAGE would yield 3350 - the same three cylinders either clear or fail a 3500 psi release threshold depending on which variant is applied."

  - name: curing_energy_accounting
    trigger: "modeled_therms is written on POST /bed-runs/{id}/curing-cycles; the remaining outputs are written on POST /curing-cycles/{id}/complete"
    algorithm: dual_variant_metering
    formula: |
      # ---- always computed, at creation ----
      ramp_hours     = (soak_temp_f - AMBIENT_F) / ramp_rate_f_per_hr
      cooldown_hours = (soak_temp_f - AMBIENT_F) / COOLDOWN_RATE_F_PER_HR
      weighted_hours = 0.5 * ramp_hours + soak_hours + 0.25 * cooldown_hours
      modeled_therms = round_half_up(steam_demand_bhp * THERM_PER_BHP_HOUR * weighted_hours, 2)

      # ---- on completion ----
      if metered_therms is null:
          energy_source       = MODELED
          energy_therms       = modeled_therms
          energy_variance_pct = null
      else:
          energy_source       = METERED
          energy_therms       = metered_therms
          # the variance is taken against the ROUNDED modeled_therms, not against
          # the unrounded product - rounding happens before the comparison
          energy_variance_pct = round_half_up((metered_therms - modeled_therms) / modeled_therms * 100, 2)

      variance_flagged  = (energy_variance_pct is not null
                           AND abs(energy_variance_pct) > ENERGY_VARIANCE_TOLERANCE_PCT)
      energy_cost_cents = round_half_up(energy_therms * steam_zone.therm_rate_cents_per_therm, 0)
    input_set: "One CuringCycle row plus the SteamZone row named by its steam_zone_id. No other cycle contributes."
    constants:
      AMBIENT_F: 60.0
      COOLDOWN_RATE_F_PER_HR: 20.0
      THERM_PER_BHP_HOUR: 0.335
      ENERGY_VARIANCE_TOLERANCE_PCT: 15.0
    precision: "modeled_therms and energy_therms: 2 decimal places, round_half_up. energy_variance_pct: 2 decimal places, round_half_up. energy_cost_cents: 0 decimal places, round_half_up."
    variants:
      - name: MODELED
        when: "the complete call omits metered_therms"
        difference: "The plant is billed the profile-derived therms; energy_variance_pct stays null and variance_flagged stays false no matter how far the real boiler drifted."
      - name: METERED
        when: "the complete call supplies metered_therms"
        difference: "The plant is billed the meter reading instead. For a 40 bhp / 150 F / 30 F-per-hr / 8 h soak cycle the modeled figure is 142.38 therms (13526 cents at 95 cents/therm) while a 170.00 therm meter reading bills 16150 cents and flags a 19.40 percent variance - identical curing inputs, two different charges."

  - name: strand_jacking_force
    trigger: "POST /bed-runs/{id}/tension"
    algorithm: threshold
    formula: |
      per_strand_base = STRAND_AREA_IN2[strand_diameter_in] * F_PU_KSI * JACK_FRACTION
      adjustment_pct  = SEATING_LOSS_PCT[casting_bed.bed_type]
                      + STRENGTH_CLASS_TEMP_ADJ_PCT[mix_design.strength_class]
      required_per_strand = max(per_strand_base * (1 + adjustment_pct / 100),
                                MIN_JACK_KIPS_PER_STRAND)
      computed_jacking_force_kips = round_half_up(required_per_strand * strand_count, 2)

      theoretical_elongation_in = round_half_up(
          (computed_jacking_force_kips / strand_count) * casting_bed.length_ft * 12
          / (STRAND_AREA_IN2[strand_diameter_in] * STRAND_MODULUS_KSI), 3)
      elongation_deviation_pct = round_half_up(
          (measured_elongation_in - theoretical_elongation_in)
          / theoretical_elongation_in * 100, 2)
    input_set: "The BedRun being tensioned, the CastingBed named by bed_id and the MixDesign named by mix_design_id. Four inputs interact non-linearly: strand_count scales the result, strand_diameter_in selects the area, bed_type and strength_class add into one adjustment percentage, and the outer max() can make the strength_class term vanish entirely."
    constants:
      STRAND_AREA_IN2: { 0.500: 0.153, 0.600: 0.217 }
      F_PU_KSI: 270.0
      JACK_FRACTION: 0.75
      SEATING_LOSS_PCT: { LONG_LINE_PRESTRESS: 2.5, SELF_STRESSING_FORM: 4.5, FLAT_BED_RC: 0.0 }
      STRENGTH_CLASS_TEMP_ADJ_PCT: { C40: 0.0, C50: 0.0, C60: 1.5, C70: 1.5 }
      MIN_JACK_KIPS_PER_STRAND: 32.0
      STRAND_MODULUS_KSI: 28500.0
      ELONGATION_TOLERANCE_PCT: 5.0
    precision: "computed_jacking_force_kips: 2 decimal places, round_half_up. theoretical_elongation_in: 3 decimal places, round_half_up. elongation_deviation_pct: 2 decimal places, round_half_up."
    variants: []

  - name: bed_run_cost_allocation
    trigger: "POST /bed-runs/{id}/strip"
    algorithm: waterfall_allocation
    formula: |
      run_volume_cy = round_half_up(
          sum(p.concrete_volume_cy for p in Piece
              where p.bed_run_id == run.id and p.production_status == CAST), 2)
      concrete_cost_cents = round_half_up(mix_design.unit_cost_cents_per_cy * run_volume_cy, 0)
      strand_cost_cents   = round_half_up(run.computed_jacking_force_kips * STRAND_COST_CENTS_PER_KIP, 0)
      energy_cost_cents   = sum(c.energy_cost_cents for c in CuringCycle
                                where c.bed_run_id == run.id and c.status == COMPLETED)
      form_setup_cents    = BED_TYPE_SETUP_CENTS[casting_bed.bed_type]

      direct_subtotal_cents = concrete_cost_cents + strand_cost_cents
                            + energy_cost_cents + form_setup_cents

      # EVALUATION ORDER IS PINNED HERE. The overhead tier is keyed on
      # direct_subtotal_cents - the PRE-overhead figure. It is NOT keyed on
      # total_cost_cents, which would be circular because total_cost_cents is
      # itself a function of the tier.
      overhead_rate_pct = 22.0 if direct_subtotal_cents < OVERHEAD_TIER_1_CENTS
                     else 18.0 if direct_subtotal_cents < OVERHEAD_TIER_2_CENTS
                     else 14.0
      overhead_cents   = round_half_up(direct_subtotal_cents * overhead_rate_pct / 100, 0)
      total_cost_cents = direct_subtotal_cents + overhead_cents

      # per-piece allocation, exact to the cent
      pieces = Piece rows with bed_run_id == run.id and production_status == CAST,
               ordered by erection_sequence_no ASC, then created_at ASC
      base_share = floor(total_cost_cents / len(pieces))
      remainder  = total_cost_cents - base_share * len(pieces)
      pieces[0].allocated_cost_cents = base_share + remainder    # whole remainder to the first piece in that order
      pieces[i].allocated_cost_cents = base_share for i >= 1
    input_set: "Pieces on the run whose production_status is CAST at the moment of the strip call (SCRAPPED pieces are excluded and pay nothing), COMPLETED curing cycles of the run only, the run's own tensioning result, and the bed's form family."
    constants:
      STRAND_COST_CENTS_PER_KIP: 145
      BED_TYPE_SETUP_CENTS: { LONG_LINE_PRESTRESS: 180000, SELF_STRESSING_FORM: 240000, FLAT_BED_RC: 90000 }
      OVERHEAD_TIER_1_CENTS: 500000
      OVERHEAD_TIER_2_CENTS: 1000000
    precision: "All *_cents values are integers, round_half_up at each named rounding step. base_share uses floor, never round."
    variants: []

  - name: shipment_load_metrics
    trigger: "POST /shipments/{id}/lines and re-evaluated at POST /shipments/{id}/dispatch"
    algorithm: aggregation
    formula: |
      lines = ShipmentLine rows with shipment_id == shipment.id, ordered by load_position ASC
      gross_weight_lb = TRACTOR_TARE_LB + sum(line.piece.weight_lb for line in lines)
      max_width_ft    = max(line.piece.width_ft  for line in lines)  or 0 when lines is empty
      max_height_ft   = max(line.piece.height_ft for line in lines)  or 0 when lines is empty
      max_length_ft   = max(line.piece.length_ft for line in lines)  or 0 when lines is empty
      is_oversize = (max_width_ft  > LEGAL_WIDTH_FT)
                 or (max_height_ft > LEGAL_HEIGHT_FT)
                 or (max_length_ft > LEGAL_LENGTH_FT)
                 or (gross_weight_lb > LEGAL_GROSS_WEIGHT_LB)
      # every comparison is STRICTLY greater: a piece measuring exactly 8.50 ft
      # wide is legal and needs no permit; 8.51 ft does.
    input_set: "Every ShipmentLine of the shipment and the Piece each line points at. Lines are never removed, so the metrics are monotonic in line_count."
    constants:
      TRACTOR_TARE_LB: 32000
      LEGAL_WIDTH_FT: 8.50
      LEGAL_HEIGHT_FT: 13.50
      LEGAL_LENGTH_FT: 53.00
      LEGAL_GROSS_WEIGHT_LB: 80000
    precision: "Dimensions carry 2 decimal places as supplied; gross_weight_lb is an exact sum with no rounding."
    variants: []

  - name: shipment_permit_fee
    trigger: "POST /shipments/{id}/lines and re-evaluated at POST /shipments/{id}/dispatch"
    algorithm: tiered_pricing
    formula: |
      if shipment.is_oversize is false:
          permit_fee_cents = 0
          every line.line_surcharge_cents = 0
      else:
          for line in ShipmentLine rows of the shipment ordered by load_position ASC:
              w_over = max(0, line.piece.width_ft  - LEGAL_WIDTH_FT)
              h_over = max(0, line.piece.height_ft - LEGAL_HEIGHT_FT)
              l_over = max(0, line.piece.length_ft - LEGAL_LENGTH_FT)
              raw_cents = (w_over * WIDTH_RATE_DOLLARS_PER_FT
                         + h_over * HEIGHT_RATE_DOLLARS_PER_FT
                         + l_over * LENGTH_RATE_DOLLARS_PER_FT) * 100
              # ROUNDING ORDER IS PINNED: round EACH line to whole cents FIRST,
              # then sum the rounded lines. Summing the raw dollar amounts and
              # rounding once at the end is the wrong reading and differs by
              # whole cents on real loads.
              line.line_surcharge_cents = round_half_up(raw_cents, 0)
          escorts = shipment.haul_permit.escort_count when haul_permit_id is not null else 0
          permit_fee_cents = PERMIT_BASE_CENTS
                           + sum(line.line_surcharge_cents for line in lines)
                           + escorts * ESCORT_CENTS_EACH
    input_set: "Every ShipmentLine of the shipment plus the escort_count of the linked HaulPermit. Legal (non-oversize) loads never accrue a fee even when a permit is linked."
    constants:
      LEGAL_WIDTH_FT: 8.50
      LEGAL_HEIGHT_FT: 13.50
      LEGAL_LENGTH_FT: 53.00
      WIDTH_RATE_DOLLARS_PER_FT: 12.75
      HEIGHT_RATE_DOLLARS_PER_FT: 21.40
      LENGTH_RATE_DOLLARS_PER_FT: 3.66
      PERMIT_BASE_CENTS: 8500
      ESCORT_CENTS_EACH: 27500
    precision: "line_surcharge_cents: 0 decimal places, round_half_up, applied per line before summation. permit_fee_cents is then an exact integer sum."
    variants: []

  - name: yard_slot_occupancy
    trigger: "POST /yard-placements, POST /yard-placements/{id}/pull, and the LOAD and SCRAP placement-release cascades"
    algorithm: aggregation
    formula: |
      active = YardPlacement rows with yard_slot_id == slot.id and status == ACTIVE
      occupied_weight_lb = sum(p.piece.weight_lb for p in active)     # exact, no rounding
      stacked_count      = count(active)
      status = BLOCKED if slot was seeded BLOCKED at creation           # absorbing
          else EMPTY   if stacked_count == 0
          else FULL    if stacked_count == slot.max_stack_count
                          or occupied_weight_lb == slot.capacity_weight_lb
          else PARTIAL
      # admission test applied BEFORE inserting a new placement:
      #   reject when occupied_weight_lb + piece.weight_lb > slot.capacity_weight_lb
      #   reject when stacked_count + 1 > slot.max_stack_count
      # both comparisons are STRICTLY greater, so a placement that exactly fills
      # the slot is admitted and leaves the slot FULL.
    input_set: "ACTIVE placements of one slot only. RELEASED placements never contribute, which is what makes the placement/pull pair conserve the plant-wide stored weight."
    constants: {}
    precision: "occupied_weight_lb carries the exact decimal sum of the contributing Piece.weight_lb values; no rounding is applied."
    variants: []

  - name: steam_zone_peak_concurrent_demand
    trigger: "POST /bed-runs/{id}/curing-cycles - admission test before the new cycle is persisted"
    algorithm: interval_merge
    formula: |
      candidates = CuringCycle rows with steam_zone_id == zone.id
                   and status IN {SCHEDULED, RUNNING}
                   plus the cycle being created
      # every cycle occupies the HALF-OPEN interval [planned_start, planned_end):
      # a cycle that ends at T and one that starts at T never overlap.
      instants = sorted set of c.planned_start for c in candidates
      for t in instants:
          demand(t) = sum(c.steam_demand_bhp for c in candidates
                          where c.planned_start <= t < c.planned_end)
      peak_demand_bhp = max(demand(t) for t in instants)
      # reject when peak_demand_bhp > zone.boiler_capacity_bhp - STRICTLY greater,
      # so a schedule that exactly saturates the boiler is admitted.
    input_set: "SCHEDULED and RUNNING cycles of the target zone only; COMPLETED cycles have released their boiler load and are excluded."
    constants: {}
    precision: "Boiler horsepower is compared exactly as supplied; no rounding."
    variants: []

  - name: erection_load_order
    trigger: "POST /shipments/{id}/dispatch and POST /pieces/{id}/confirm-erected"
    algorithm: topological
    formula: |
      # dispatch gate - last on, first off
      lines = ShipmentLine rows of the shipment ordered by load_position ASC
      for i in 1 .. len(lines) - 1:
          require lines[i].piece.erection_sequence_no < lines[i-1].piece.erection_sequence_no
      # i.e. the piece at load_position 1 (loaded first, buried deepest) must have
      # the HIGHEST erection_sequence_no of the load, because it comes off last.

      # erection gate
      predecessors = Piece rows with project_id == piece.project_id
                     and erection_sequence_no < piece.erection_sequence_no
      require every p in predecessors has production_status IN {ERECTED, SCRAPPED}
    input_set: "All lines of one shipment for the dispatch gate; all pieces of one project regardless of shipment for the erection gate."
    constants: {}
    precision: "Integer comparison only."
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the first failing rule decides the response and no later rule runs)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the roles listed on the endpoint in 1.5."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every id in the request path resolves to a stored row, validated left to right."
    error_id: ERR_PROJECT_NOT_FOUND | ERR_MIX_DESIGN_NOT_FOUND | ERR_PLANT_RESOURCE_NOT_FOUND | ERR_BED_RUN_NOT_FOUND | ERR_CYLINDER_SET_NOT_FOUND | ERR_PIECE_NOT_FOUND | ERR_HAUL_PERMIT_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_REPAIR_DISPOSITION_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 4
    category: auth
    check: "When X-User-Role is ProjectOwner, X-User-ID equals the project_id of the targeted Piece."
    error_id: ERR_PROJECT_SCOPE_FORBIDDEN
    http_status: 403
    applies_to: "POST /pieces/{id}/confirm-erected"

  - priority: 5
    category: business_constraint
    check: "Request body schema: every required field present, types match, enum values are members of the declared set, numeric fields satisfy their declared range, ISO 8601 datetimes parse, and interval fields satisfy scheduled_end > scheduled_start / planned_end > planned_start / valid_to > valid_from."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "every endpoint with a request body"

  - priority: 6
    category: existence
    check: "Every foreign key supplied in the request body resolves to a stored row."
    error_id: ERR_PROJECT_NOT_FOUND | ERR_MIX_DESIGN_NOT_FOUND | ERR_PLANT_RESOURCE_NOT_FOUND | ERR_BED_RUN_NOT_FOUND | ERR_PIECE_NOT_FOUND | ERR_HAUL_PERMIT_NOT_FOUND
    http_status: 404
    applies_to: "POST /casting-beds, POST /bed-runs, POST /bed-runs/{id}/curing-cycles, POST /pieces, POST /pieces/{id}/assign-run, POST /yard-placements, POST /haul-permits, POST /shipments, POST /shipments/{id}/lines, POST /repair-dispositions"

  - priority: 7
    category: state
    check: "The expected_<parent>_version supplied in the body equals the parent row's current version."
    error_id: ERR_STALE_PIECE_VERSION | ERR_STALE_YARD_SLOT_VERSION
    http_status: 412
    applies_to: "POST /repair-dispositions, POST /yard-placements"

  - priority: 8
    category: state
    check: "The primary target row is in a from-state the requested transition accepts."
    error_id: ERR_MIX_DESIGN_INVALID_STATE | ERR_BED_RUN_INVALID_STATE | ERR_CURING_CYCLE_INVALID_STATE | ERR_PIECE_INVALID_STATE | ERR_SHIPMENT_INVALID_STATE | ERR_HAUL_PERMIT_INVALID_STATE | ERR_DISPOSITION_INVALID_STATE | ERR_YARD_PLACEMENT_INVALID_STATE
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 9
    category: state
    check: "Gating states on entities OTHER than the primary target: the MixDesign of a run being scheduled, tensioned or cast is QUALIFIED; the CastingBed being tensioned is AVAILABLE and the YardSlot being placed into is not BLOCKED; the HaulPermit linked to an oversize shipment being dispatched is ISSUED."
    error_id: ERR_MIX_DESIGN_NOT_QUALIFIED | ERR_PLANT_RESOURCE_UNAVAILABLE | ERR_PERMIT_NOT_ISSUED
    http_status: 409
    applies_to: "POST /bed-runs, POST /bed-runs/{id}/tension, POST /bed-runs/{id}/cast, POST /yard-placements, POST /shipments/{id}/dispatch"

  - priority: 10
    category: business_safety
    check: "Quality and safety gates: a run being cast has at least one assigned piece; measured elongation is within tolerance; a run being released has a RELEASE cylinder set, all of its curing cycles COMPLETED, a non-null qualified_strength_psi and a qualified_strength_psi at or above the mix's required_release_psi; a piece being loaded has qc_status IN {CLEARED, REPAIRED}. Within this priority the order is fixed: ERR_NO_PIECES_ASSIGNED, then ERR_ELONGATION_OUT_OF_TOLERANCE, then ERR_RELEASE_SET_MISSING, then ERR_CURING_NOT_COMPLETE, then ERR_NO_VALID_SPECIMENS, then ERR_RELEASE_STRENGTH_NOT_MET, then ERR_PIECE_QC_HOLD."
    error_id: ERR_NO_PIECES_ASSIGNED | ERR_ELONGATION_OUT_OF_TOLERANCE | ERR_RELEASE_SET_MISSING | ERR_CURING_NOT_COMPLETE | ERR_NO_VALID_SPECIMENS | ERR_RELEASE_STRENGTH_NOT_MET | ERR_PIECE_QC_HOLD
    http_status: 422
    applies_to: "POST /bed-runs/{id}/cast, POST /bed-runs/{id}/tension, POST /bed-runs/{id}/request-release, POST /shipments/{id}/lines"

  - priority: 11
    category: auth
    check: "Segregation of duties. The X-User-ID signing a release must not appear in the release CylinderSet's recorded_by_user_ids, and the X-User-ID starting a repair must differ from the RepairDisposition's dispositioned_by_user_id. Deliberately evaluated AFTER the state and safety gates, so a duty conflict on a request that is also in the wrong state returns the state error, not this one."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /bed-runs/{id}/request-release, POST /repair-dispositions/{id}/start-repair"

  - priority: 12
    category: business_temporal
    check: "The logical clock is inside the linked HaulPermit's [valid_from, valid_to] window when dispatching an oversize shipment; a permit whose valid_to has passed is moved to EXPIRED and the dispatch is rejected."
    error_id: ERR_PERMIT_EXPIRED
    http_status: 422
    applies_to: "POST /shipments/{id}/dispatch"

  - priority: 13
    category: business_constraint
    check: "Resource occupancy and capacity: the bed's occupancy windows do not overlap once the turnaround buffer is appended; the steam zone's peak concurrent demand does not exceed its boiler capacity; the run's jacking force does not exceed the bed's abutment capacity; the yard slot has room by weight and by stack count; the cylinder set has an unbroken specimen left. Within this priority the order is fixed: ERR_BED_OCCUPIED, then ERR_STEAM_CAPACITY_EXCEEDED, then ERR_BED_STRAND_CAPACITY_EXCEEDED, then ERR_YARD_SLOT_CAPACITY_EXCEEDED, then ERR_YARD_STACK_LIMIT_EXCEEDED, then ERR_SPECIMEN_LIMIT_REACHED."
    error_id: ERR_BED_OCCUPIED | ERR_STEAM_CAPACITY_EXCEEDED | ERR_BED_STRAND_CAPACITY_EXCEEDED | ERR_YARD_SLOT_CAPACITY_EXCEEDED | ERR_YARD_STACK_LIMIT_EXCEEDED | ERR_SPECIMEN_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /bed-runs, POST /bed-runs/{id}/curing-cycles, POST /bed-runs/{id}/tension, POST /yard-placements, POST /cylinder-sets/{id}/breaks"

  - priority: 14
    category: business_referential
    check: "Uniqueness and linkage: MixDesign.code, SteamZone.zone_code, CastingBed.bed_code, YardSlot.slot_code and HaulPermit.permit_number are globally unique; Piece.piece_mark is unique within its project; ShipmentLine.load_position is unique within its shipment; a piece's mix_design_id equals the mix of the run it is assigned to; a piece's project_id equals the shipment's project_id. Within this priority the order is fixed: ERR_DUPLICATE_MIX_CODE, then ERR_DUPLICATE_RESOURCE_CODE, then ERR_DUPLICATE_PIECE_MARK, then ERR_DUPLICATE_LOAD_POSITION, then ERR_MIX_CLASS_MISMATCH, then ERR_PIECE_PROJECT_MISMATCH."
    error_id: ERR_DUPLICATE_MIX_CODE | ERR_DUPLICATE_RESOURCE_CODE | ERR_DUPLICATE_PIECE_MARK | ERR_DUPLICATE_LOAD_POSITION | ERR_MIX_CLASS_MISMATCH | ERR_PIECE_PROJECT_MISMATCH
    http_status: 409
    applies_to: "POST /mix-designs, POST /steam-zones, POST /casting-beds, POST /yard-slots, POST /haul-permits, POST /pieces, POST /pieces/{id}/assign-run, POST /shipments/{id}/lines"

  - priority: 15
    category: business_constraint
    check: "Load composition: a shipment being dispatched carries at least one line; the lines ordered by load_position ASC have strictly descending erection_sequence_no; a piece being confirmed erected has no project sibling with a lower erection_sequence_no still outside {ERECTED, SCRAPPED}. Within this priority the order is fixed: ERR_EMPTY_LOAD, then ERR_ERECTION_SEQUENCE_VIOLATION, then ERR_ERECTION_PREDECESSOR_PENDING."
    error_id: ERR_EMPTY_LOAD | ERR_ERECTION_SEQUENCE_VIOLATION | ERR_ERECTION_PREDECESSOR_PENDING
    http_status: 422
    applies_to: "POST /shipments/{id}/dispatch, POST /pieces/{id}/confirm-erected"

  - priority: 16
    category: business_fiscal
    check: "Permit envelope: an oversize shipment has a linked permit at all; the load's max_width_ft, max_height_ft and max_length_ft each fit inside the permit's declared maxima; the gross combination weight does not exceed the permit's max_gross_weight_lb. Within this priority the order is fixed: ERR_PERMIT_REQUIRED, then ERR_PERMIT_ENVELOPE_EXCEEDED, then ERR_PERMIT_WEIGHT_EXCEEDED."
    error_id: ERR_PERMIT_REQUIRED | ERR_PERMIT_ENVELOPE_EXCEEDED | ERR_PERMIT_WEIGHT_EXCEEDED
    http_status: 422
    applies_to: "POST /shipments/{id}/dispatch"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- test-driving clock -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Every timestamp the server stamps (cast_at, break_at, placed_at, released_at, loaded_at, dispatched_at, qualified_at) and every window comparison (permit validity) reads this clock and never the host wall clock. Before the first call the clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real time."
    roles: [PlantAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["advances or rewinds the logical clock; no entity is mutated"]

  # ---- Project ------------------------------------------------------------
  - method: POST
    path: "/projects"
    description: "Registers an erection package."
    roles: [PlantAdmin]
    code: 201
    input: [name, jobsite_city, erection_start_date]
    output: Project
    side_effects: ["all six counters initialise to 0"]

  - method: GET
    path: "/projects/{id}"
    description: "Reads one project including its six live counters."
    roles: [PlantAdmin, ProductionSupervisor, QCTechnician, QualityEngineer, YardForeman, PermitCoordinator, ProjectOwner]
    code: 200
    input: []
    output: Project
    side_effects: []

  # ---- MixDesign ----------------------------------------------------------
  - method: POST
    path: "/mix-designs"
    description: "Creates a mix design in DRAFT."
    roles: [QualityEngineer]
    code: 201
    input: [code, strength_class, design_28day_psi, required_release_psi, w_c_ratio, cement_lb_per_cy, unit_cost_cents_per_cy]
    output: MixDesign
    side_effects: ["status is forced to DRAFT regardless of any supplied value"]

  - method: GET
    path: "/mix-designs/{id}"
    description: "Reads one mix design."
    roles: [PlantAdmin, ProductionSupervisor, QCTechnician, QualityEngineer, YardForeman, PermitCoordinator, ProjectOwner]
    code: 200
    input: []
    output: MixDesign
    side_effects: []

  - method: POST
    path: "/mix-designs/{id}/qualify"
    description: "DRAFT -> QUALIFIED. Only QUALIFIED mixes may be scheduled, tensioned or cast."
    roles: [QualityEngineer]
    code: 200
    input: []
    output: MixDesign
    side_effects: ["stamps qualified_at from the logical clock"]

  - method: POST
    path: "/mix-designs/{id}/suspend"
    description: "QUALIFIED -> SUSPENDED and fires the three-hop block cascade onto SCHEDULED runs, their pieces and those pieces' projects."
    roles: [QualityEngineer]
    code: 200
    input: [reason]
    output: MixDesign
    side_effects:
      - "every SCHEDULED BedRun on this mix moves to BLOCKED with blocked_reason MIX_SUSPENDED"
      - "every PENDING piece on those runs moves qc_status to HOLD with qc_hold_reason MIX_SUSPENDED"
      - "every affected Project recomputes held_piece_count"

  - method: POST
    path: "/mix-designs/{id}/reinstate"
    description: "SUSPENDED -> QUALIFIED and reverses the block cascade hop for hop."
    roles: [QualityEngineer]
    code: 200
    input: []
    output: MixDesign
    side_effects:
      - "every BLOCKED BedRun on this mix returns to SCHEDULED and blocked_reason is cleared"
      - "every piece held for MIX_SUSPENDED returns to qc_status PENDING with qc_hold_reason cleared"
      - "every affected Project recomputes held_piece_count back to its pre-suspension value"

  - method: POST
    path: "/mix-designs/{id}/retire"
    description: "SUSPENDED -> RETIRED. Terminal; rejected while any non-STRIPPED run still references the mix."
    roles: [QualityEngineer]
    code: 200
    input: []
    output: MixDesign
    side_effects: []

  # ---- SteamZone ----------------------------------------------------------
  - method: POST
    path: "/steam-zones"
    description: "Registers a boiler zone."
    roles: [PlantAdmin]
    code: 201
    input: [zone_code, boiler_capacity_bhp, therm_rate_cents_per_therm]
    output: SteamZone
    side_effects: []

  - method: GET
    path: "/steam-zones/{id}"
    description: "Reads one boiler zone."
    roles: [PlantAdmin, ProductionSupervisor, QCTechnician, QualityEngineer, YardForeman, PermitCoordinator, ProjectOwner]
    code: 200
    input: []
    output: SteamZone
    side_effects: []

  - method: GET
    path: "/steam-zones/{id}/casting-beds"
    description: "Every casting bed served by this boiler zone."
    roles: [PlantAdmin, ProductionSupervisor, QCTechnician, QualityEngineer, YardForeman, PermitCoordinator, ProjectOwner]
    code: 200
    input: ["limit?", "offset?"]
    output: CastingBed[]
    side_effects: []

  - method: GET
    path: "/steam-zones/{id}/curing-cycles"
    description: "Every curing cycle drawing steam from this zone; the reverse view the boiler capacity admission test is computed over."
    roles: [PlantAdmin, ProductionSupervisor, QCTechnician, QualityEngineer, YardForeman, PermitCoordinator, ProjectOwner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CuringCycle[]
    side_effects: []

  # ---- CastingBed ---------------------------------------------------------
  - method: POST
    path: "/casting-beds"
    description: "Registers a casting bed. Seeding status DOWN is the only way a bed is ever unavailable; DOWN is absorbing."
    roles: [PlantAdmin]
    code: 201
    input: ["bed_code", "steam_zone_id", "bed_type", "length_ft", "max_strand_force_kips", "turnaround_buffer_hours", "status?"]
    output: CastingBed
    side_effects: ["committed_strand_force_kips initialises to 0.00 and cumulative_cycle_count to 0"]

  - method: GET
    path: "/casting-beds/{id}"
    description: "Reads one bed including its live committed strand force."
    roles: [PlantAdmin, ProductionSupervisor, QCTechnician, QualityEngineer, YardForeman, PermitCoordinator, ProjectOwner]
    code: 200
    input: []
    output: CastingBed
    side_effects: []

  # ---- BedRun -------------------------------------------------------------
  - method: POST
    path: "/bed-runs"
    description: "Schedules a bed occupancy window. Rejected when the window collides with another non-STRIPPED run on the same bed once that run's turnaround buffer is appended."
    roles: [ProductionSupervisor]
    code: 201
    input: [bed_id, mix_design_id, scheduled_start, scheduled_end]
    output: BedRun
    side_effects: ["status initialises to SCHEDULED; piece_count to 0"]

  - method: GET
    path: "/bed-runs/{id}"
    description: "Reads one run including its tensioning and cost fields."
    roles: [PlantAdmin, ProductionSupervisor, QCTechnician, QualityEngineer, YardForeman, PermitCoordinator, ProjectOwner]
    code: 200
    input: []
    output: BedRun
    side_effects: []

  - method: GET
    path: "/bed-runs"
    description: "Lists runs, filterable by bed, by mix design and by status."
    roles: [PlantAdmin, ProductionSupervisor, QCTechnician, QualityEngineer, YardForeman, PermitCoordinator, ProjectOwner]
    code: 200
    input: ["bed_id?", "mix_design_id?", "status?", "limit?", "offset?"]
    output: BedRun[]
    side_effects: []

  - method: POST
    path: "/bed-runs/{id}/tension"
    description: "SCHEDULED -> TENSIONED. Runs strand_jacking_force, commits the force onto the bed and occupies it."
    roles: [ProductionSupervisor]
    code: 200
    input: [strand_count, strand_diameter_in, measured_elongation_in]
    output: BedRun
    side_effects:
      - "writes computed_jacking_force_kips, theoretical_elongation_in and elongation_deviation_pct"
      - "CastingBed.committed_strand_force_kips increases by computed_jacking_force_kips and the bed moves AVAILABLE -> OCCUPIED"

  - method: POST
    path: "/bed-runs/{id}/abort-tensioning"
    description: "TENSIONED -> SCHEDULED. The compensating action for tension: it must leave CastingBed.committed_strand_force_kips exactly where it stood before the tension call."
    roles: [ProductionSupervisor]
    code: 200
    input: [reason]
    output: BedRun
    side_effects:
      - "CastingBed.committed_strand_force_kips decreases by computed_jacking_force_kips and the bed moves OCCUPIED -> AVAILABLE"
      - "strand_count, strand_diameter_in, measured_elongation_in, computed_jacking_force_kips, theoretical_elongation_in and elongation_deviation_pct are all reset to null"

  - method: POST
    path: "/bed-runs/{id}/cast"
    description: "TENSIONED -> CURING. Places the concrete: pieces go CAST and onto QC hold, and every SCHEDULED curing cycle of the run starts."
    roles: [ProductionSupervisor]
    code: 200
    input: []
    output: BedRun
    side_effects:
      - "stamps cast_at from the logical clock"
      - "assigned pieces move production_status SCHEDULED -> CAST and qc_status PENDING -> HOLD with reason AWAITING_RELEASE_STRENGTH"
      - "SCHEDULED curing cycles of the run move to RUNNING"
      - "affected Projects recompute held_piece_count"

  - method: POST
    path: "/bed-runs/{id}/request-release"
    description: "RELEASE_READY -> RELEASED. The engineer's detensioning signature; refused when the signer also recorded a break on the release set."
    roles: [QualityEngineer]
    code: 200
    input: []
    output: BedRun
    side_effects: ["stamps released_at from the logical clock"]

  - method: POST
    path: "/bed-runs/{id}/strip"
    description: "RELEASED -> STRIPPED. Runs bed_run_cost_allocation, pushes each piece's share onto Piece.allocated_cost_cents, frees the bed and increments its cycle count."
    roles: [ProductionSupervisor]
    code: 200
    input: []
    output: BedRun
    side_effects:
      - "writes the eight cost fields on the run"
      - "CAST pieces move to STRIPPED and receive allocated_cost_cents"
      - "owning Projects recompute committed_cost_cents"
      - "the bed releases its committed strand force, returns to AVAILABLE and increments cumulative_cycle_count"

  - method: POST
    path: "/bed-runs/{id}/cylinder-sets"
    description: "Casts a set of test cylinders alongside the run."
    roles: [QCTechnician]
    code: 201
    input: [purpose, specimen_count, cured_with_member]
    output: CylinderSet
    side_effects: ["stamps cast_at from the logical clock; status initialises to CAST"]

  - method: GET
    path: "/bed-runs/{id}/cylinder-sets"
    description: "Every cylinder set cast with this run."
    roles: [PlantAdmin, ProductionSupervisor, QCTechnician, QualityEngineer, YardForeman, PermitCoordinator, ProjectOwner]
    code: 200
    input: ["purpose?", "limit?", "offset?"]
    output: CylinderSet[]
    side_effects: []

  - method: POST
    path: "/bed-runs/{id}/curing-cycles"
    description: "Schedules a steam curing cycle for the run against a boiler zone. Rejected when the zone's peak concurrent demand would exceed its boiler capacity."
    roles: [ProductionSupervisor]
    code: 201
    input: [steam_zone_id, planned_start, planned_end, ramp_rate_f_per_hr, soak_temp_f, soak_hours, steam_demand_bhp]
    output: CuringCycle
    side_effects: ["computes and stores modeled_therms immediately; status initialises to SCHEDULED"]

  - method: GET
    path: "/bed-runs/{id}/curing-cycles"
    description: "Every curing cycle of this run."
    roles: [PlantAdmin, ProductionSupervisor, QCTechnician, QualityEngineer, YardForeman, PermitCoordinator, ProjectOwner]
    code: 200
    input: ["limit?", "offset?"]
    output: CuringCycle[]
    side_effects: []

  # ---- CuringCycle --------------------------------------------------------
  - method: POST
    path: "/curing-cycles/{id}/complete"
    description: "RUNNING -> COMPLETED. Supplying metered_therms selects the METERED variant of curing_energy_accounting; omitting it selects MODELED."
    roles: [ProductionSupervisor]
    code: 200
    input: ["metered_therms?"]
    output: CuringCycle
    side_effects:
      - "writes energy_therms, energy_source, energy_variance_pct, variance_flagged and energy_cost_cents"
      - "re-evaluates the owning run's CURING -> RELEASE_READY auto-transition"

  # ---- CylinderSet / CylinderBreak ---------------------------------------
  - method: GET
    path: "/cylinder-sets/{id}"
    description: "Reads one cylinder set including qualified_strength_psi, strength_variant and recorded_by_user_ids."
    roles: [PlantAdmin, ProductionSupervisor, QCTechnician, QualityEngineer, YardForeman, PermitCoordinator, ProjectOwner]
    code: 200
    input: []
    output: CylinderSet
    side_effects: []

  - method: POST
    path: "/cylinder-sets/{id}/breaks"
    description: "Records one cylinder break, recomputes the whole set (including the inclusion_status of earlier breaks) and may cascade the owning run from CURING to RELEASE_READY."
    roles: [QCTechnician]
    code: 201
    input: [load_lbf, diameter_in]
    output: CylinderBreak
    side_effects:
      - "stamps break_at from the logical clock and computes age_hours and computed_psi"
      - "appends the acting X-User-ID to CylinderSet.recorded_by_user_ids when not already present"
      - "re-runs cylinder_set_qualified_strength over every break of the set"
      - "may move the set to RELEASE_MET or RELEASE_NOT_MET and, through it, the run to RELEASE_READY and its pieces off QC hold"

  - method: GET
    path: "/cylinder-sets/{id}/breaks"
    description: "Every break of the set with its current inclusion_status."
    roles: [PlantAdmin, ProductionSupervisor, QCTechnician, QualityEngineer, YardForeman, PermitCoordinator, ProjectOwner]
    code: 200
    input: ["limit?", "offset?"]
    output: CylinderBreak[]
    side_effects: []

  # ---- Piece --------------------------------------------------------------
  - method: POST
    path: "/pieces"
    description: "Creates a piece in PLANNED/PENDING. requires_haul_permit is derived from the dimensions at creation."
    roles: [ProductionSupervisor]
    code: 201
    input: ["project_id", "mix_design_id", "piece_mark", "erection_sequence_no", "length_ft", "width_ft", "height_ft", "weight_lb", "concrete_volume_cy", "replaces_piece_id?"]
    output: Piece
    side_effects: ["owning Project recomputes total_piece_count"]

  - method: GET
    path: "/pieces/{id}"
    description: "Reads one piece including both status dimensions."
    roles: [PlantAdmin, ProductionSupervisor, QCTechnician, QualityEngineer, YardForeman, PermitCoordinator, ProjectOwner]
    code: 200
    input: []
    output: Piece
    side_effects: []

  - method: GET
    path: "/pieces"
    description: "Lists pieces, filterable by project, run, mix, replacement target and either status dimension."
    roles: [PlantAdmin, ProductionSupervisor, QCTechnician, QualityEngineer, YardForeman, PermitCoordinator, ProjectOwner]
    code: 200
    input: ["project_id?", "bed_run_id?", "mix_design_id?", "replaces_piece_id?", "production_status?", "qc_status?", "limit?", "offset?"]
    output: Piece[]
    side_effects: []

  - method: POST
    path: "/pieces/{id}/assign-run"
    description: "PLANNED -> SCHEDULED. Binds the piece to a bed run whose mix must match the piece's own."
    roles: [ProductionSupervisor]
    code: 200
    input: [bed_run_id]
    output: Piece
    side_effects: ["sets bed_run_id and recomputes BedRun.piece_count"]

  - method: POST
    path: "/pieces/{id}/confirm-erected"
    description: "SHIPPED -> ERECTED, signed by the project owner. Rejected while any lower-sequence sibling of the same project is still neither ERECTED nor SCRAPPED."
    roles: [ProjectOwner]
    code: 200
    input: []
    output: Piece
    side_effects: ["owning Project recomputes erected_piece_count"]

  - method: GET
    path: "/pieces/{id}/yard-placements"
    description: "Placement history of one piece, ACTIVE and RELEASED alike."
    roles: [PlantAdmin, ProductionSupervisor, QCTechnician, QualityEngineer, YardForeman, PermitCoordinator, ProjectOwner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: YardPlacement[]
    side_effects: []

  - method: GET
    path: "/pieces/{id}/shipment-lines"
    description: "Every shipment line that has ever carried this piece; the reverse view the already-loaded check reads."
    roles: [PlantAdmin, ProductionSupervisor, QCTechnician, QualityEngineer, YardForeman, PermitCoordinator, ProjectOwner]
    code: 200
    input: ["limit?", "offset?"]
    output: ShipmentLine[]
    side_effects: []

  - method: GET
    path: "/pieces/{id}/repair-dispositions"
    description: "Every nonconformance report raised against this piece, newest last."
    roles: [PlantAdmin, ProductionSupervisor, QCTechnician, QualityEngineer, YardForeman, PermitCoordinator, ProjectOwner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RepairDisposition[]
    side_effects: []

  # ---- Yard ---------------------------------------------------------------
  - method: POST
    path: "/yard-slots"
    description: "Registers a storage slot. Seeding status BLOCKED is the only way a slot is ever closed; BLOCKED is absorbing."
    roles: [PlantAdmin]
    code: 201
    input: ["slot_code", "bay_code", "capacity_weight_lb", "max_stack_count", "status?"]
    output: YardSlot
    side_effects: ["occupied_weight_lb initialises to 0 and stacked_count to 0"]

  - method: GET
    path: "/yard-slots/{id}"
    description: "Reads one slot including its live occupancy."
    roles: [PlantAdmin, ProductionSupervisor, QCTechnician, QualityEngineer, YardForeman, PermitCoordinator, ProjectOwner]
    code: 200
    input: []
    output: YardSlot
    side_effects: []

  - method: GET
    path: "/yard-slots/{id}/yard-placements"
    description: "Placements at one slot, filterable by status."
    roles: [PlantAdmin, ProductionSupervisor, QCTechnician, QualityEngineer, YardForeman, PermitCoordinator, ProjectOwner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: YardPlacement[]
    side_effects: []

  - method: POST
    path: "/yard-placements"
    description: "Stores a stripped piece in a slot. expected_yard_slot_version must equal the slot's current version, because slots legitimately accept several stacked pieces and nothing else would reject a placement computed against a stale occupancy."
    roles: [YardForeman]
    code: 201
    input: [piece_id, yard_slot_id, stack_level, expected_yard_slot_version]
    output: YardPlacement
    side_effects:
      - "piece moves production_status STRIPPED -> YARDED"
      - "slot occupied_weight_lb increases by the piece's weight, stacked_count increases by 1 and status is recomputed"
      - "increments YardSlot.version by 1"

  - method: POST
    path: "/yard-placements/{id}/pull"
    description: "ACTIVE -> RELEASED. The compensating action for a placement; with release_reason RESTACK it must return the slot's occupancy to exactly its pre-placement value."
    roles: [YardForeman]
    code: 200
    input: [release_reason]
    output: YardPlacement
    side_effects:
      - "slot occupied_weight_lb decreases by the piece's weight, stacked_count decreases by 1 and status is recomputed"
      - "with release_reason RESTACK the piece moves YARDED -> STRIPPED"

  # ---- HaulPermit ---------------------------------------------------------
  - method: POST
    path: "/haul-permits"
    description: "Applies for an oversize haul permit."
    roles: [PermitCoordinator]
    code: 201
    input: [project_id, permit_number, issuing_state, max_width_ft, max_height_ft, max_length_ft, max_gross_weight_lb, valid_from, valid_to, escort_count]
    output: HaulPermit
    side_effects: ["status initialises to APPLIED"]

  - method: GET
    path: "/haul-permits/{id}"
    description: "Reads one permit."
    roles: [PlantAdmin, ProductionSupervisor, QCTechnician, QualityEngineer, YardForeman, PermitCoordinator, ProjectOwner]
    code: 200
    input: []
    output: HaulPermit
    side_effects: []

  - method: GET
    path: "/haul-permits"
    description: "Lists permits, filterable by project and status."
    roles: [PlantAdmin, ProductionSupervisor, QCTechnician, QualityEngineer, YardForeman, PermitCoordinator, ProjectOwner]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: HaulPermit[]
    side_effects: []

  - method: POST
    path: "/haul-permits/{id}/issue"
    description: "APPLIED -> ISSUED."
    roles: [PermitCoordinator]
    code: 200
    input: []
    output: HaulPermit
    side_effects: []

  # ---- Shipment -----------------------------------------------------------
  - method: POST
    path: "/shipments"
    description: "Opens a load in BUILDING. A permit may be linked now or the load may be legal and never need one."
    roles: [YardForeman]
    code: 201
    input: ["project_id", "scheduled_departure", "haul_permit_id?"]
    output: Shipment
    side_effects: ["gross_weight_lb initialises to the tractor tare of 32000 and is_oversize to false"]

  - method: GET
    path: "/shipments/{id}"
    description: "Reads one load including its derived metrics and permit fee."
    roles: [PlantAdmin, ProductionSupervisor, QCTechnician, QualityEngineer, YardForeman, PermitCoordinator, ProjectOwner]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: GET
    path: "/shipments"
    description: "Lists loads, filterable by project, permit and status."
    roles: [PlantAdmin, ProductionSupervisor, QCTechnician, QualityEngineer, YardForeman, PermitCoordinator, ProjectOwner]
    code: 200
    input: ["project_id?", "haul_permit_id?", "status?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []

  - method: POST
    path: "/shipments/{id}/lines"
    description: "Loads one yarded piece onto the trailer at a given position, pulling it out of the yard on the way."
    roles: [YardForeman]
    code: 201
    input: [piece_id, load_position]
    output: ShipmentLine
    side_effects:
      - "piece moves production_status YARDED -> LOADED"
      - "its ACTIVE yard placement moves to RELEASED with release_reason LOAD and the slot occupancy is decremented"
      - "shipment_load_metrics and shipment_permit_fee are recomputed on the shipment and on this line"

  - method: GET
    path: "/shipments/{id}/lines"
    description: "Every line of one load with its rounded oversize surcharge."
    roles: [PlantAdmin, ProductionSupervisor, QCTechnician, QualityEngineer, YardForeman, PermitCoordinator, ProjectOwner]
    code: 200
    input: ["limit?", "offset?"]
    output: ShipmentLine[]
    side_effects: []

  - method: POST
    path: "/shipments/{id}/dispatch"
    description: "BUILDING -> DISPATCHED. Runs the temporal permit gate, then the load-composition gates, then the permit envelope gates, in that order."
    roles: [YardForeman]
    code: 200
    input: []
    output: Shipment
    side_effects: ["stamps dispatched_at; a linked permit moves ISSUED -> ACTIVE"]

  - method: POST
    path: "/shipments/{id}/deliver"
    description: "DISPATCHED -> DELIVERED."
    roles: [YardForeman]
    code: 200
    input: []
    output: Shipment
    side_effects: ["every loaded piece moves LOADED -> SHIPPED; a linked permit moves ACTIVE -> CONSUMED"]

  # ---- RepairDisposition --------------------------------------------------
  - method: POST
    path: "/repair-dispositions"
    description: "Opens a nonconformance report against a piece. expected_piece_version must equal the piece's current version, because a newer NCR legitimately supersedes any earlier open one and no state precondition would otherwise reject it."
    roles: [QCTechnician]
    code: 201
    input: [piece_id, defect_type, severity, description, expected_piece_version]
    output: RepairDisposition
    side_effects:
      - "piece moves qc_status to NONCONFORMING with qc_hold_reason OPEN_NCR"
      - "every earlier RepairDisposition of the piece in {OPEN, DISPOSITIONED, REPAIR_IN_PROGRESS, REINSPECTION} moves to SUPERSEDED"
      - "increments Piece.version by 1"
      - "owning Project recomputes cleared_piece_count"

  - method: POST
    path: "/repair-dispositions/{id}/disposition"
    description: "The engineer's branch point: PATCH_MINOR and STRUCTURAL_REPAIR go to DISPOSITIONED, USE_AS_IS closes the report immediately, REJECT_RECAST scraps the piece through a four-hop cascade."
    roles: [QualityEngineer]
    code: 200
    input: [disposition]
    output: RepairDisposition
    side_effects:
      - "writes dispositioned_by_user_id from the acting X-User-ID"
      - "USE_AS_IS: piece qc_status NONCONFORMING -> REPAIRED"
      - "REJECT_RECAST: piece qc_status -> REJECTED and production_status -> SCRAPPED, its ACTIVE placement is released with reason SCRAP, its slot is decremented and its project recomputes scrapped_piece_count and cleared_piece_count"

  - method: POST
    path: "/repair-dispositions/{id}/start-repair"
    description: "DISPOSITIONED -> REPAIR_IN_PROGRESS. Refused when the repairer is the same user who signed the disposition."
    roles: [ProductionSupervisor]
    code: 200
    input: []
    output: RepairDisposition
    side_effects: ["writes repaired_by_user_id from the acting X-User-ID"]

  - method: POST
    path: "/repair-dispositions/{id}/submit-reinspection"
    description: "REPAIR_IN_PROGRESS -> REINSPECTION."
    roles: [ProductionSupervisor]
    code: 200
    input: []
    output: RepairDisposition
    side_effects: []

  - method: POST
    path: "/repair-dispositions/{id}/reinspect"
    description: "PASS closes the report and repairs the piece; FAIL loops back to REPAIR_IN_PROGRESS until reinspection_fail_count reaches MAX_REINSPECTION_FAILS = 2, at which point the same four-hop scrap cascade fires."
    roles: [QualityEngineer]
    code: 200
    input: [result]
    output: RepairDisposition
    side_effects:
      - "PASS: piece qc_status NONCONFORMING -> REPAIRED, qc_hold_reason cleared, project recomputes cleared_piece_count"
      - "FAIL below the limit: reinspection_fail_count += 1 and status returns to REPAIR_IN_PROGRESS"
      - "FAIL at the limit: status -> REJECTED_RECAST and the piece/placement/slot/project scrap cascade fires"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:

  # ---- authentication / authorisation ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed on the endpoint in 1.5."
  - id: ERR_PROJECT_SCOPE_FORBIDDEN
    http: 403
    condition: "A ProjectOwner whose X-User-ID is not the piece's project_id tries to confirm that piece erected."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The release signer already recorded a break on the release cylinder set, or the repairer is the same user who signed the disposition."

  # ---- request schema ----
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing required body field, wrong type, enum value outside the declared set, numeric outside its declared range, unparseable ISO 8601 datetime, or an interval whose end is not after its start."

  # ---- existence ----
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "A Project id in the path or body does not resolve."
  - id: ERR_MIX_DESIGN_NOT_FOUND
    http: 404
    condition: "A MixDesign id in the path or body does not resolve."
  - id: ERR_PLANT_RESOURCE_NOT_FOUND
    http: 404
    condition: "A SteamZone, CastingBed or YardSlot id in the path or body does not resolve."
  - id: ERR_BED_RUN_NOT_FOUND
    http: 404
    condition: "A BedRun or CuringCycle id in the path or body does not resolve."
  - id: ERR_CYLINDER_SET_NOT_FOUND
    http: 404
    condition: "A CylinderSet id in the path does not resolve."
  - id: ERR_PIECE_NOT_FOUND
    http: 404
    condition: "A Piece or YardPlacement id in the path or body does not resolve."
  - id: ERR_HAUL_PERMIT_NOT_FOUND
    http: 404
    condition: "A HaulPermit id in the path or body does not resolve."
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "A Shipment id in the path does not resolve."
  - id: ERR_REPAIR_DISPOSITION_NOT_FOUND
    http: 404
    condition: "A RepairDisposition id in the path does not resolve."

  # ---- optimistic concurrency ----
  - id: ERR_STALE_PIECE_VERSION
    http: 412
    condition: "expected_piece_version on POST /repair-dispositions does not equal the piece's current version."
  - id: ERR_STALE_YARD_SLOT_VERSION
    http: 412
    condition: "expected_yard_slot_version on POST /yard-placements does not equal the slot's current version."

  # ---- state ----
  - id: ERR_MIX_DESIGN_INVALID_STATE
    http: 409
    condition: "qualify on a non-DRAFT mix, suspend on a non-QUALIFIED mix, or reinstate/retire on a non-SUSPENDED mix."
  - id: ERR_MIX_DESIGN_NOT_QUALIFIED
    http: 409
    condition: "A run is scheduled, tensioned or cast while its MixDesign.status is not QUALIFIED."
  - id: ERR_BED_RUN_INVALID_STATE
    http: 409
    condition: "A bed-run action is issued from a status the transition does not accept, including any action on a STRIPPED run and any break recorded against a set whose run is STRIPPED."
  - id: ERR_CURING_CYCLE_INVALID_STATE
    http: 409
    condition: "complete is issued on a curing cycle whose status is not RUNNING."
  - id: ERR_PIECE_INVALID_STATE
    http: 409
    condition: "A piece action is issued from a production_status the transition does not accept - assign-run on a non-PLANNED piece, placement of a non-STRIPPED piece, loading of a non-YARDED piece, or confirm-erected on a non-SHIPPED piece."
  - id: ERR_SHIPMENT_INVALID_STATE
    http: 409
    condition: "Lines are added to a non-BUILDING shipment, dispatch is issued on a non-BUILDING shipment, or deliver is issued on a non-DISPATCHED shipment."
  - id: ERR_HAUL_PERMIT_INVALID_STATE
    http: 409
    condition: "issue is called on a permit whose status is not APPLIED."
  - id: ERR_DISPOSITION_INVALID_STATE
    http: 409
    condition: "A repair-disposition action is issued from a status the transition does not accept, including any action on a SUPERSEDED, CLOSED_ACCEPTED or REJECTED_RECAST report."
  - id: ERR_YARD_PLACEMENT_INVALID_STATE
    http: 409
    condition: "pull is called on a placement whose status is already RELEASED."
  - id: ERR_PLANT_RESOURCE_UNAVAILABLE
    http: 409
    condition: "Tensioning targets a CastingBed whose status is DOWN or OCCUPIED, or a placement targets a YardSlot whose status is BLOCKED."
  - id: ERR_PERMIT_NOT_ISSUED
    http: 409
    condition: "An oversize shipment is dispatched while its linked permit's status is not ISSUED."

  # ---- quality and safety gates ----
  - id: ERR_NO_PIECES_ASSIGNED
    http: 422
    condition: "cast is issued on a run whose piece_count is 0."
  - id: ERR_ELONGATION_OUT_OF_TOLERANCE
    http: 422
    condition: "abs(elongation_deviation_pct) exceeds ELONGATION_TOLERANCE_PCT of 5.0 at tensioning."
  - id: ERR_RELEASE_SET_MISSING
    http: 422
    condition: "request-release is issued on a run that has no CylinderSet with purpose RELEASE."
  - id: ERR_CURING_NOT_COMPLETE
    http: 422
    condition: "request-release is issued while the run has no curing cycle at all, or while any of its curing cycles is still SCHEDULED or RUNNING."
  - id: ERR_NO_VALID_SPECIMENS
    http: 422
    condition: "request-release is issued while the release set's qualified_strength_psi is null because fewer than two breaks survived the outlier trim."
  - id: ERR_RELEASE_STRENGTH_NOT_MET
    http: 422
    condition: "request-release is issued while the release set's qualified_strength_psi is below the mix's required_release_psi."
  - id: ERR_PIECE_QC_HOLD
    http: 409
    condition: "A piece whose qc_status is not CLEARED or REPAIRED is loaded onto a shipment."

  # ---- temporal ----
  - id: ERR_PERMIT_EXPIRED
    http: 422
    condition: "An oversize shipment is dispatched when the logical clock is outside the linked permit's [valid_from, valid_to] window."

  # ---- occupancy and capacity ----
  - id: ERR_BED_OCCUPIED
    http: 409
    condition: "A new run's [scheduled_start, scheduled_end + turnaround_buffer_hours) window intersects that of another run on the same bed whose status is not STRIPPED."
  - id: ERR_STEAM_CAPACITY_EXCEEDED
    http: 409
    condition: "Adding the cycle would push the zone's peak concurrent demand above boiler_capacity_bhp at some instant."
  - id: ERR_BED_STRAND_CAPACITY_EXCEEDED
    http: 422
    condition: "computed_jacking_force_kips exceeds the bed's max_strand_force_kips."
  - id: ERR_YARD_SLOT_CAPACITY_EXCEEDED
    http: 422
    condition: "occupied_weight_lb + piece.weight_lb would exceed the slot's capacity_weight_lb."
  - id: ERR_YARD_STACK_LIMIT_EXCEEDED
    http: 422
    condition: "stacked_count + 1 would exceed the slot's max_stack_count."
  - id: ERR_SPECIMEN_LIMIT_REACHED
    http: 422
    condition: "A break is recorded on a set whose recorded_break_count already equals specimen_count."

  # ---- referential and uniqueness ----
  - id: ERR_DUPLICATE_MIX_CODE
    http: 409
    condition: "A MixDesign is created with a code another mix already uses."
  - id: ERR_DUPLICATE_RESOURCE_CODE
    http: 409
    condition: "A SteamZone.zone_code, CastingBed.bed_code, YardSlot.slot_code or HaulPermit.permit_number collides with an existing row."
  - id: ERR_DUPLICATE_PIECE_MARK
    http: 409
    condition: "A Piece is created with a piece_mark another piece of the same project already uses."
  - id: ERR_DUPLICATE_LOAD_POSITION
    http: 409
    condition: "A shipment line is added at a load_position the shipment already uses."
  - id: ERR_MIX_CLASS_MISMATCH
    http: 409
    condition: "A piece is assigned to a run whose mix_design_id differs from the piece's own."
  - id: ERR_PIECE_PROJECT_MISMATCH
    http: 409
    condition: "A piece whose project_id differs from the shipment's project_id is loaded onto that shipment."

  # ---- load composition ----
  - id: ERR_EMPTY_LOAD
    http: 422
    condition: "dispatch is issued on a shipment whose line_count is 0."
  - id: ERR_ERECTION_SEQUENCE_VIOLATION
    http: 422
    condition: "The lines ordered by load_position ASC do not have strictly descending erection_sequence_no."
  - id: ERR_ERECTION_PREDECESSOR_PENDING
    http: 422
    condition: "confirm-erected is issued while a project sibling with a lower erection_sequence_no is neither ERECTED nor SCRAPPED."

  # ---- permit envelope ----
  - id: ERR_PERMIT_REQUIRED
    http: 422
    condition: "An oversize shipment is dispatched with haul_permit_id null."
  - id: ERR_PERMIT_ENVELOPE_EXCEEDED
    http: 422
    condition: "The load's max_width_ft, max_height_ft or max_length_ft exceeds the corresponding permit maximum."
  - id: ERR_PERMIT_WEIGHT_EXCEEDED
    http: 422
    condition: "gross_weight_lb exceeds the permit's max_gross_weight_lb."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:

  - name: PlantAdmin
    description: "Plant IT/operations administrator. Owns the static plant topology - projects, boiler zones, casting beds, yard slots - and the logical clock. Holds no production, QC or shipping authority whatsoever."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /projects"
      - "POST /steam-zones"
      - "POST /casting-beds"
      - "POST /yard-slots"
    shared_operations:
      - "every GET endpoint"

  - name: ProductionSupervisor
    description: "Runs the casting cycle: schedules bed occupancy, tensions and aborts strand, casts, schedules and completes curing, strips beds, creates and assigns pieces, and performs repairs."
    identity: opaque
    exclusive_operations:
      - "POST /bed-runs"
      - "POST /bed-runs/{id}/tension"
      - "POST /bed-runs/{id}/abort-tensioning"
      - "POST /bed-runs/{id}/cast"
      - "POST /bed-runs/{id}/strip"
      - "POST /bed-runs/{id}/curing-cycles"
      - "POST /curing-cycles/{id}/complete"
      - "POST /pieces"
      - "POST /pieces/{id}/assign-run"
      - "POST /repair-dispositions/{id}/start-repair"
      - "POST /repair-dispositions/{id}/submit-reinspection"
    shared_operations:
      - "every GET endpoint"

  - name: QCTechnician
    description: "Casts and breaks test cylinders and opens nonconformance reports. May never sign a release for a set whose breaks bear the same X-User-ID."
    identity: opaque
    exclusive_operations:
      - "POST /bed-runs/{id}/cylinder-sets"
      - "POST /cylinder-sets/{id}/breaks"
      - "POST /repair-dispositions"
    shared_operations:
      - "every GET endpoint"

  - name: QualityEngineer
    description: "Owns the mix book and every quality decision: qualifies, suspends, reinstates and retires mixes, signs detensioning releases, dispositions nonconformances and reinspects repairs."
    identity: opaque
    exclusive_operations:
      - "POST /mix-designs"
      - "POST /mix-designs/{id}/qualify"
      - "POST /mix-designs/{id}/suspend"
      - "POST /mix-designs/{id}/reinstate"
      - "POST /mix-designs/{id}/retire"
      - "POST /bed-runs/{id}/request-release"
      - "POST /repair-dispositions/{id}/disposition"
      - "POST /repair-dispositions/{id}/reinspect"
    shared_operations:
      - "every GET endpoint"

  - name: YardForeman
    description: "Owns everything downstream of stripping: yard placement and pulls, load building, dispatch and delivery."
    identity: opaque
    exclusive_operations:
      - "POST /yard-placements"
      - "POST /yard-placements/{id}/pull"
      - "POST /shipments"
      - "POST /shipments/{id}/lines"
      - "POST /shipments/{id}/dispatch"
      - "POST /shipments/{id}/deliver"
    shared_operations:
      - "every GET endpoint"

  - name: PermitCoordinator
    description: "Applies for and issues oversize haul permits. Cannot build or dispatch a load."
    identity: opaque
    exclusive_operations:
      - "POST /haul-permits"
      - "POST /haul-permits/{id}/issue"
    shared_operations:
      - "every GET endpoint"

  - name: ProjectOwner
    description: "The general contractor for one erection package. X-User-ID is the Project.id it acts for; it can confirm erection of that project's pieces and nothing else."
    identity: "entity_backed:Project"
    exclusive_operations:
      - "POST /pieces/{id}/confirm-erected"
    shared_operations:
      - "every GET endpoint"
