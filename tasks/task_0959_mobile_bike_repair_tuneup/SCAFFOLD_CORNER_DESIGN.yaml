      - name: cancel_quoted_is_free_no_invoice
        claim_type: side_effect_execution
        grounds: [state_machines.ServiceRequest.QUOTED_to_CANCELLED]
        distinguishing_aspect: "CANCEL from QUOTED creates NO invoice (free cancel) — contrast with the DISPATCHED cancel fee."
