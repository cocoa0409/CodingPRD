              as_user_id: "${c2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "setup capture plan2_status == APPROVED and plan1_status == RETIRED (supersede cascade)"
            - "trigger capture err == ERR_PLAN_NOT_APPROVED_FOR_EXERCISE — completion re-reads the referenced plan's live state"
            - "GET /resilience/exercises/${ex_id} still shows status == IN_PROGRESS (no partial completion side effects)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: site_reservation_half_open_adjacency_and_capacity
        grounds:
          - validations[priority=21]
          - validations[priority=22]
          - errors[ERR_SITE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Half-open [starts_at, ends_at) semantics on the AlternateSite seat
          resource: a same-process reservation starting exactly at the
          previous one's ends_at does NOT overlap (adjacency allowed), while
          one minute earlier does — and capacity is judged as an aggregate
          over the overlapping set, not per-reservation.
        test_recipe:
          setup:
            - "Clock 2026-06-01; contact C1; site S (capacity 10); processes P1, P2 ACTIVE"
            - "R1: P1 on S, 6 seats, 2026-07-10T09:00Z..12:00Z CONFIRMED"
          setup_api_calls:
            - call: "POST /resilience/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ResilienceAdmin
            - call: "POST /resilience/contacts"
              payload: { full_name: "Sam Site", email: "sam@x.com", role_title: "Site Coordinator" }
              as: ResilienceAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /resilience/processes"
              payload: { name: "P1", business_unit: "BU", owner_contact_id: "${c1_id}", criticality_tier: "TIER_2" }
              as: ResilienceAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /resilience/processes"
              payload: { name: "P2", business_unit: "BU", owner_contact_id: "${c1_id}", criticality_tier: "TIER_2" }
              as: ResilienceAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /resilience/alternate-sites"
              payload: { name: "SiteGamma", site_type: "WARM", region: "eu-west", capacity_seats: 10, contracted_through: "2027-01-01T00:00:00Z", monthly_cost: 5000 }
              as: SiteCoordinator
              as_user_id: "${c1_id}"
              captures: { s_id: $.data.id }
            - call: "POST /resilience/site-reservations"
              payload: { site_id: "${s_id}", process_id: "${p1_id}", purpose: "EXERCISE", seats_reserved: 6, starts_at: "2026-07-10T09:00:00Z", ends_at: "2026-07-10T12:00:00Z", created_by_contact_id: "${c1_id}" }
              as: SiteCoordinator
              as_user_id: "${c1_id}"
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /resilience/site-reservations"
              payload: { site_id: "${s_id}", process_id: "${p1_id}", purpose: "EXERCISE", seats_reserved: 2, starts_at: "2026-07-10T12:00:00Z", ends_at: "2026-07-10T15:00:00Z", created_by_contact_id: "${c1_id}" }
              as: SiteCoordinator
              as_user_id: "${c1_id}"
              captures: { r2_id: $.data.id }
            - call: "POST /resilience/site-reservations"
              payload: { site_id: "${s_id}", process_id: "${p1_id}", purpose: "EXERCISE", seats_reserved: 1, starts_at: "2026-07-10T11:59:00Z", ends_at: "2026-07-10T13:00:00Z", created_by_contact_id: "${c1_id}" }
              as: SiteCoordinator
              as_user_id: "${c1_id}"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /resilience/site-reservations"
              payload: { site_id: "${s_id}", process_id: "${p2_id}", purpose: "INCIDENT", seats_reserved: 5, starts_at: "2026-07-10T10:00:00Z", ends_at: "2026-07-10T11:00:00Z", created_by_contact_id: "${c1_id}" }
              as: SiteCoordinator
              as_user_id: "${c1_id}"
              captures: { err_cap: $.data.error_id }
          assert:
            - "first trigger succeeds (r2_id present): [12:00,15:00) does not overlap [09:00,12:00) under half-open semantics"
            - "second trigger capture err_overlap == ERR_SITE_WINDOW_OVERLAP (11:59 < 12:00 collides for the same process)"
            - "third trigger capture err_cap == ERR_SITE_CAPACITY_EXCEEDED (aggregate 6 + 5 = 11 > 10 seats for the 10:00-11:00 window, different process so no same-process rule fires)"

      - name: failover_exercise_closed_interval_touching_ends
        grounds:
          - validations[priority=23]
          - errors[ERR_EXERCISE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Closed-interval semantics on the process FAILOVER calendar —
          different interval geometry from the half-open site reservations:
          a FAILOVER whose start EQUALS the previous FAILOVER's end counts as
          overlap, and TABLETOP windows are exempt from the rule entirely.
        test_recipe:
          setup:
            - "Contacts C1, C2; Process P ACTIVE; BIA APPROVED rto 8 / rpo 2; Plan PL APPROVED"
            - "FAILOVER exercise EX1 SCHEDULED 2026-09-01T09:00Z..2026-09-01T17:00Z"
