# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Sections per claim-extraction-guide. Canonical program payload as in §1.8.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: c_program_creation_computed_defaults
        claim_type: creation
        grounds: [entities.Program.fields.status, entities.Program.fields.ops_run_index, entities.Program.fields.double_up_remaining_cents]
        distinguishing_aspect: "POST /programs returns 201 with computed/system fields initialized: status DRAFT, version 1, ops_run_index 0, double_up_matched_cents 0, double_up_remaining_cents == double_up_pool_cents."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /programs", payload: { name: "P", start_date: "2026-05-01", end_date: "2026-10-31", base_monthly_benefit_cents: 10000, household_increment_cents: 2500, max_household_size: 6, double_up_multiplier: 1.0, double_up_daily_cap_cents: 100000, double_up_pool_cents: 200000, tier2_completions: 3, tier3_completions: 6, renewal_window_days: 30, outcome_improvement_threshold: 0.5 }, as: ProgramAdmin, captures: { pg: $.data.id, st: $.data.status, v: $.data.version, ops: $.data.ops_run_index, dur: $.data.double_up_remaining_cents } }
          assert:
            - "Program.${pg}.status == DRAFT"
            - "Program.${pg}.version == 1"
            - "Program.${pg}.ops_run_index == 0"
            - "Program.${pg}.double_up_remaining_cents == 200000"

      - name: c_get_missing_program_returns_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "validations[priority=3]"
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /programs/00000000-0000-0000-0000-000000000000", payload: {}, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 404 and error_id == ERR_NOT_FOUND"

      - name: c_create_program_missing_required_name
        claim_type: required_fields
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Omitting required input field `name` yields 400 ERR_VALIDATION."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /programs", payload: { start_date: "2026-05-01", end_date: "2026-10-31", base_monthly_benefit_cents: 10000, household_increment_cents: 2500, max_household_size: 6, double_up_multiplier: 1.0, double_up_daily_cap_cents: 100000, double_up_pool_cents: 200000, tier2_completions: 3, tier3_completions: 6, renewal_window_days: 30, outcome_improvement_threshold: 0.5 }, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 400 and error_id == ERR_VALIDATION"

      - name: c_create_retailer_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Retailer.fields.kind"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "kind 'BAKERY' is outside {GROCERY, FARMERS_MARKET, MOBILE_MARKET} and is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /retailers", payload: { name: "R1", kind: "BAKERY", double_up_eligible: true }, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 400 and error_id == ERR_VALIDATION"

      - name: c_pool_computed_fields_input_ignored
        claim_type: computed_fields
        grounds: [entities.FundingPool.fields.disbursed_cents, entities.FundingPool.fields.reserved_cents]
        distinguishing_aspect: "Client-supplied computed fields (disbursed_cents: 999) are ignored; the created pool reports disbursed_cents == 0 and available_cents == committed_cents."
        test_recipe:
          setup: ["Program exists (DRAFT) and funder exists"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", contact_email: "f1@x.org", total_commitment_cents: 1000000 }, as: ProgramAdmin, captures: { fu: $.data.id } }
            - { call: "POST /programs", payload: { name: "P", start_date: "2026-05-01", end_date: "2026-10-31", base_monthly_benefit_cents: 10000, household_increment_cents: 2500, max_household_size: 6, double_up_multiplier: 1.0, double_up_daily_cap_cents: 100000, double_up_pool_cents: 200000, tier2_completions: 3, tier3_completions: 6, renewal_window_days: 30, outcome_improvement_threshold: 0.5 }, as: ProgramAdmin, captures: { pg: $.data.id } }
          trigger:
            - { call: "POST /funding-pools", payload: { program_id: "${pg}", funder_id: "${fu}", committed_cents: 500000, disbursed_cents: 999 }, as: ProgramAdmin, captures: { pl: $.data.id, dis: $.data.disbursed_cents, avl: $.data.available_cents } }
          assert:
            - "FundingPool.${pl}.disbursed_cents == 0 (input 999 ignored)"
            - "FundingPool.${pl}.available_cents == 500000"

      - name: c_biometric_reading_immutability
        claim_type: immutability
        grounds: [entities.BiometricReading]
        distinguishing_aspect: "BiometricReading has common_fields false: its GET response carries id and created_at but no version field, and no update endpoint exists."
        test_recipe:
          setup: ["ACTIVE program, ACTIVE enrollment (standard referral chain)"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", contact_email: "f1@x.org", total_commitment_cents: 1000000 }, as: ProgramAdmin, captures: { fu: $.data.id } }
            - { call: "POST /programs", payload: { name: "P", start_date: "2026-05-01", end_date: "2026-10-31", base_monthly_benefit_cents: 10000, household_increment_cents: 2500, max_household_size: 6, double_up_multiplier: 1.0, double_up_daily_cap_cents: 100000, double_up_pool_cents: 200000, tier2_completions: 3, tier3_completions: 6, renewal_window_days: 30, outcome_improvement_threshold: 0.5 }, as: ProgramAdmin, captures: { pg: $.data.id } }
            - { call: "POST /funding-pools", payload: { program_id: "${pg}", funder_id: "${fu}", committed_cents: 500000 }, as: ProgramAdmin, captures: { pl: $.data.id } }
            - { call: "POST /funding-pools/${pl}/fund", payload: {}, as: FunderAnalyst, as_user_id: "${fu}" }
            - { call: "POST /programs/${pg}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /clinics", payload: { name: "C1", npi_number: "1111111111", max_active_referrals: 50 }, as: ProgramAdmin, captures: { cl: $.data.id } }
            - { call: "POST /patients", payload: { clinic_id: "${cl}", full_name: "Pat One", date_of_birth: "1980-01-15", household_size: 2 }, as: ClinicStaff, as_user_id: "${cl}", captures: { pt: $.data.id } }
            - { call: "POST /patients/${pt}/grant-consent", payload: {}, as: ClinicStaff, as_user_id: "${cl}" }
            - { call: "POST /referrals", payload: { clinic_id: "${cl}", patient_id: "${pt}", program_id: "${pg}", diagnosis_code: "E11.9", priority: "STANDARD" }, as: ClinicStaff, as_user_id: "${cl}", captures: { rf: $.data.id } }
            - { call: "POST /referrals/${rf}/start-review", payload: {}, as: ProgramAdmin }
            - { call: "POST /referrals/${rf}/approve", payload: {}, as: ProgramAdmin, captures: { en: $.data.enrollment_id } }
          trigger:
            - { call: "POST /enrollments/${en}/biometric-readings", payload: { kind: "A1C", value: 8.0, measured_at: "2026-05-10T00:00:00Z", source: "LAB_VERIFIED" }, as: ClinicStaff, as_user_id: "${cl}", captures: { br: $.data.id } }
            - { call: "GET /biometric-readings/${br}", payload: {}, as: ClinicStaff, as_user_id: "${cl}", captures: { val: $.data.value } }
          assert:
            - "BiometricReading.${br}.value == 8.0"
            - "Response has no `version` field (common_fields: false)"
            - "Response has no `updated_at` field"
  - section: state_machines
    instances:
      - name: c_referral_initial_state_submitted
        claim_type: initial_state
        grounds: [state_machines.Referral, entities.Referral.fields.status]
        distinguishing_aspect: "A newly created referral starts in SUBMITTED with appeal_count 0 and enrollment_id null."
        test_recipe:
          setup: ["ACTIVE program; clinic; patient with GRANTED consent"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", contact_email: "f1@x.org", total_commitment_cents: 1000000 }, as: ProgramAdmin, captures: { fu: $.data.id } }
            - { call: "POST /programs", payload: { name: "P", start_date: "2026-05-01", end_date: "2026-10-31", base_monthly_benefit_cents: 10000, household_increment_cents: 2500, max_household_size: 6, double_up_multiplier: 1.0, double_up_daily_cap_cents: 100000, double_up_pool_cents: 200000, tier2_completions: 3, tier3_completions: 6, renewal_window_days: 30, outcome_improvement_threshold: 0.5 }, as: ProgramAdmin, captures: { pg: $.data.id } }
            - { call: "POST /funding-pools", payload: { program_id: "${pg}", funder_id: "${fu}", committed_cents: 500000 }, as: ProgramAdmin, captures: { pl: $.data.id } }
            - { call: "POST /funding-pools/${pl}/fund", payload: {}, as: FunderAnalyst, as_user_id: "${fu}" }
            - { call: "POST /programs/${pg}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /clinics", payload: { name: "C1", npi_number: "1111111111", max_active_referrals: 50 }, as: ProgramAdmin, captures: { cl: $.data.id } }
            - { call: "POST /patients", payload: { clinic_id: "${cl}", full_name: "Pat One", date_of_birth: "1980-01-15", household_size: 2 }, as: ClinicStaff, as_user_id: "${cl}", captures: { pt: $.data.id } }
            - { call: "POST /patients/${pt}/grant-consent", payload: {}, as: ClinicStaff, as_user_id: "${cl}" }
          trigger:
            - { call: "POST /referrals", payload: { clinic_id: "${cl}", patient_id: "${pt}", program_id: "${pg}", diagnosis_code: "E11.9", priority: "STANDARD" }, as: ClinicStaff, as_user_id: "${cl}", captures: { rf: $.data.id, st: $.data.status, ac: $.data.appeal_count } }
          assert:
            - "Referral.${rf}.status == SUBMITTED"
            - "Referral.${rf}.appeal_count == 0"
            - "Referral.${rf}.enrollment_id is null"

      - name: c_approve_from_submitted_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Referral.UNDER_REVIEW_to_APPROVED"
          - "errors[ERR_REFERRAL_NOT_REVIEWABLE]"
        distinguishing_aspect: "approve from SUBMITTED (skipping start-review) is rejected with ERR_REFERRAL_NOT_REVIEWABLE; the referral stays SUBMITTED."
        test_recipe:
          setup: ["ACTIVE program; referral SUBMITTED"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", contact_email: "f1@x.org", total_commitment_cents: 1000000 }, as: ProgramAdmin, captures: { fu: $.data.id } }
            - { call: "POST /programs", payload: { name: "P", start_date: "2026-05-01", end_date: "2026-10-31", base_monthly_benefit_cents: 10000, household_increment_cents: 2500, max_household_size: 6, double_up_multiplier: 1.0, double_up_daily_cap_cents: 100000, double_up_pool_cents: 200000, tier2_completions: 3, tier3_completions: 6, renewal_window_days: 30, outcome_improvement_threshold: 0.5 }, as: ProgramAdmin, captures: { pg: $.data.id } }
            - { call: "POST /funding-pools", payload: { program_id: "${pg}", funder_id: "${fu}", committed_cents: 500000 }, as: ProgramAdmin, captures: { pl: $.data.id } }
            - { call: "POST /funding-pools/${pl}/fund", payload: {}, as: FunderAnalyst, as_user_id: "${fu}" }
            - { call: "POST /programs/${pg}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /clinics", payload: { name: "C1", npi_number: "1111111111", max_active_referrals: 50 }, as: ProgramAdmin, captures: { cl: $.data.id } }
            - { call: "POST /patients", payload: { clinic_id: "${cl}", full_name: "Pat One", date_of_birth: "1980-01-15", household_size: 2 }, as: ClinicStaff, as_user_id: "${cl}", captures: { pt: $.data.id } }
            - { call: "POST /patients/${pt}/grant-consent", payload: {}, as: ClinicStaff, as_user_id: "${cl}" }
            - { call: "POST /referrals", payload: { clinic_id: "${cl}", patient_id: "${pt}", program_id: "${pg}", diagnosis_code: "E11.9", priority: "STANDARD" }, as: ClinicStaff, as_user_id: "${cl}", captures: { rf: $.data.id } }
          trigger:
            - { call: "POST /referrals/${rf}/approve", payload: {}, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REFERRAL_NOT_REVIEWABLE"
            - "Referral.${rf}.status still SUBMITTED; no enrollment created"

      - name: c_referral_approve_creates_enrollment
        claim_type: side_effect_execution
        grounds: [state_machines.Referral.UNDER_REVIEW_to_APPROVED, entities.Enrollment.fields.household_size]
        distinguishing_aspect: "Approve side effects: an Enrollment is created ACTIVE with household_size snapshotted from the patient (2) and engagement_tier T1; referral.enrollment_id points to it."
        test_recipe:
          setup: ["ACTIVE program; referral UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", contact_email: "f1@x.org", total_commitment_cents: 1000000 }, as: ProgramAdmin, captures: { fu: $.data.id } }
            - { call: "POST /programs", payload: { name: "P", start_date: "2026-05-01", end_date: "2026-10-31", base_monthly_benefit_cents: 10000, household_increment_cents: 2500, max_household_size: 6, double_up_multiplier: 1.0, double_up_daily_cap_cents: 100000, double_up_pool_cents: 200000, tier2_completions: 3, tier3_completions: 6, renewal_window_days: 30, outcome_improvement_threshold: 0.5 }, as: ProgramAdmin, captures: { pg: $.data.id } }
            - { call: "POST /funding-pools", payload: { program_id: "${pg}", funder_id: "${fu}", committed_cents: 500000 }, as: ProgramAdmin, captures: { pl: $.data.id } }
            - { call: "POST /funding-pools/${pl}/fund", payload: {}, as: FunderAnalyst, as_user_id: "${fu}" }
            - { call: "POST /programs/${pg}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /clinics", payload: { name: "C1", npi_number: "1111111111", max_active_referrals: 50 }, as: ProgramAdmin, captures: { cl: $.data.id } }
            - { call: "POST /patients", payload: { clinic_id: "${cl}", full_name: "Pat One", date_of_birth: "1980-01-15", household_size: 2 }, as: ClinicStaff, as_user_id: "${cl}", captures: { pt: $.data.id } }
            - { call: "POST /patients/${pt}/grant-consent", payload: {}, as: ClinicStaff, as_user_id: "${cl}" }
            - { call: "POST /referrals", payload: { clinic_id: "${cl}", patient_id: "${pt}", program_id: "${pg}", diagnosis_code: "E11.9", priority: "STANDARD" }, as: ClinicStaff, as_user_id: "${cl}", captures: { rf: $.data.id } }
            - { call: "POST /referrals/${rf}/start-review", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /referrals/${rf}/approve", payload: {}, as: ProgramAdmin, captures: { en: $.data.enrollment_id } }
            - { call: "GET /enrollments/${en}", payload: {}, as: ProgramAdmin, captures: { st: $.data.status, hh: $.data.household_size, tier: $.data.engagement_tier } }
          assert:
            - "Enrollment.${en}.status == ACTIVE"
            - "Enrollment.${en}.household_size == 2 (snapshot)"
            - "Enrollment.${en}.engagement_tier == T1"
            - "Enrollment.${en}.referral_id == ${rf}"

      - name: c_void_voided_voucher_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Voucher"
          - "errors[ERR_ALREADY_TERMINAL]"
        distinguishing_aspect: "VOIDED is terminal: a second void on the same voucher is rejected with ERR_ALREADY_TERMINAL and releases nothing twice."
        test_recipe:
          setup: ["Standard ACTIVE program; enrollment with ISSUED voucher face 12500; voucher voided once (pool reserve released)"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", contact_email: "f1@x.org", total_commitment_cents: 1000000 }, as: ProgramAdmin, captures: { fu: $.data.id } }
            - { call: "POST /programs", payload: { name: "P", start_date: "2026-05-01", end_date: "2026-10-31", base_monthly_benefit_cents: 10000, household_increment_cents: 2500, max_household_size: 6, double_up_multiplier: 1.0, double_up_daily_cap_cents: 100000, double_up_pool_cents: 200000, tier2_completions: 3, tier3_completions: 6, renewal_window_days: 30, outcome_improvement_threshold: 0.5 }, as: ProgramAdmin, captures: { pg: $.data.id } }
            - { call: "POST /funding-pools", payload: { program_id: "${pg}", funder_id: "${fu}", committed_cents: 500000 }, as: ProgramAdmin, captures: { pl: $.data.id } }
            - { call: "POST /funding-pools/${pl}/fund", payload: {}, as: FunderAnalyst, as_user_id: "${fu}" }
            - { call: "POST /programs/${pg}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /clinics", payload: { name: "C1", npi_number: "1111111111", max_active_referrals: 50 }, as: ProgramAdmin, captures: { cl: $.data.id } }
            - { call: "POST /patients", payload: { clinic_id: "${cl}", full_name: "Pat One", date_of_birth: "1980-01-15", household_size: 2 }, as: ClinicStaff, as_user_id: "${cl}", captures: { pt: $.data.id } }
            - { call: "POST /patients/${pt}/grant-consent", payload: {}, as: ClinicStaff, as_user_id: "${cl}" }
            - { call: "POST /referrals", payload: { clinic_id: "${cl}", patient_id: "${pt}", program_id: "${pg}", diagnosis_code: "E11.9", priority: "STANDARD" }, as: ClinicStaff, as_user_id: "${cl}", captures: { rf: $.data.id } }
            - { call: "POST /referrals/${rf}/start-review", payload: {}, as: ProgramAdmin }
            - { call: "POST /referrals/${rf}/approve", payload: {}, as: ProgramAdmin, captures: { en: $.data.enrollment_id } }
            - { call: "POST /programs/${pg}/cycles", payload: { period_index: 1, start_date: "2026-05-01", end_date: "2026-06-01" }, as: ProgramAdmin, captures: { cy: $.data.id } }
            - { call: "POST /cycles/${cy}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /cycles/${cy}/issue", payload: {}, as: ProgramAdmin }
            - { call: "GET /vouchers", payload: {}, as: ProgramAdmin, captures: { vc: "$.data[0].id" } }
            - { call: "POST /vouchers/${vc}/void", payload: { reason: "issued in error" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /vouchers/${vc}/void", payload: { reason: "again" }, as: ProgramAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /funding-pools/${pl}", payload: {}, as: ProgramAdmin, captures: { av: $.data.available_cents, rs: $.data.reserved_cents } }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL"
            - "FundingPool.${pl}.available_cents == 500000 and reserved_cents == 0 (single release only)"

      - name: c_enrollment_suspend_reinstate_round_trip
        claim_type: valid_transition
        grounds: [state_machines.Enrollment.ACTIVE_to_SUSPENDED, state_machines.Enrollment.SUSPENDED_to_ACTIVE]
        distinguishing_aspect: "Manual suspend then reinstate returns the enrollment to ACTIVE while the program is ACTIVE (version increments on each mutation)."
        test_recipe:
          setup: ["Standard ACTIVE program with one ACTIVE enrollment"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", contact_email: "f1@x.org", total_commitment_cents: 1000000 }, as: ProgramAdmin, captures: { fu: $.data.id } }
            - { call: "POST /programs", payload: { name: "P", start_date: "2026-05-01", end_date: "2026-10-31", base_monthly_benefit_cents: 10000, household_increment_cents: 2500, max_household_size: 6, double_up_multiplier: 1.0, double_up_daily_cap_cents: 100000, double_up_pool_cents: 200000, tier2_completions: 3, tier3_completions: 6, renewal_window_days: 30, outcome_improvement_threshold: 0.5 }, as: ProgramAdmin, captures: { pg: $.data.id } }
            - { call: "POST /funding-pools", payload: { program_id: "${pg}", funder_id: "${fu}", committed_cents: 500000 }, as: ProgramAdmin, captures: { pl: $.data.id } }
            - { call: "POST /funding-pools/${pl}/fund", payload: {}, as: FunderAnalyst, as_user_id: "${fu}" }
            - { call: "POST /programs/${pg}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /clinics", payload: { name: "C1", npi_number: "1111111111", max_active_referrals: 50 }, as: ProgramAdmin, captures: { cl: $.data.id } }
            - { call: "POST /patients", payload: { clinic_id: "${cl}", full_name: "Pat One", date_of_birth: "1980-01-15", household_size: 2 }, as: ClinicStaff, as_user_id: "${cl}", captures: { pt: $.data.id } }
            - { call: "POST /patients/${pt}/grant-consent", payload: {}, as: ClinicStaff, as_user_id: "${cl}" }
            - { call: "POST /referrals", payload: { clinic_id: "${cl}", patient_id: "${pt}", program_id: "${pg}", diagnosis_code: "E11.9", priority: "STANDARD" }, as: ClinicStaff, as_user_id: "${cl}", captures: { rf: $.data.id } }
            - { call: "POST /referrals/${rf}/start-review", payload: {}, as: ProgramAdmin }
            - { call: "POST /referrals/${rf}/approve", payload: {}, as: ProgramAdmin, captures: { en: $.data.enrollment_id } }
          trigger:
            - { call: "POST /enrollments/${en}/suspend", payload: {}, as: ProgramAdmin, captures: { s1: $.data.status } }
            - { call: "POST /enrollments/${en}/reinstate", payload: {}, as: ProgramAdmin, captures: { s2: $.data.status } }
          assert:
            - "status after suspend == SUSPENDED"
            - "status after reinstate == ACTIVE"

      - name: c_cancel_completed_session_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.EducationSession"
          - "errors[ERR_SESSION_NOT_SCHEDULED]"
        distinguishing_aspect: "cancel from COMPLETED (a terminal state for scheduling purposes) is rejected with ERR_SESSION_NOT_SCHEDULED."
        test_recipe:
          setup: ["ACTIVE program; session created and completed"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", contact_email: "f1@x.org", total_commitment_cents: 1000000 }, as: ProgramAdmin, captures: { fu: $.data.id } }
            - { call: "POST /programs", payload: { name: "P", start_date: "2026-05-01", end_date: "2026-10-31", base_monthly_benefit_cents: 10000, household_increment_cents: 2500, max_household_size: 6, double_up_multiplier: 1.0, double_up_daily_cap_cents: 100000, double_up_pool_cents: 200000, tier2_completions: 3, tier3_completions: 6, renewal_window_days: 30, outcome_improvement_threshold: 0.5 }, as: ProgramAdmin, captures: { pg: $.data.id } }
            - { call: "POST /funding-pools", payload: { program_id: "${pg}", funder_id: "${fu}", committed_cents: 500000 }, as: ProgramAdmin, captures: { pl: $.data.id } }
            - { call: "POST /funding-pools/${pl}/fund", payload: {}, as: FunderAnalyst, as_user_id: "${fu}" }
            - { call: "POST /programs/${pg}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /programs/${pg}/education-sessions", payload: { topic: "T", venue: "RM-1", starts_at: "2026-05-10T10:00:00Z", ends_at: "2026-05-10T11:00:00Z", capacity: 10, educator_ref: "ed-1" }, as: Educator, captures: { s: $.data.id } }
            - { call: "POST /education-sessions/${s}/complete", payload: {}, as: Educator }
          trigger:
            - { call: "POST /education-sessions/${s}/cancel", payload: {}, as: Educator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SESSION_NOT_SCHEDULED"
            - "EducationSession.${s}.status remains COMPLETED"

      - name: c_consent_revoke_regrant_cycle
        claim_type: valid_transition
        grounds: [state_machines.Patient.GRANTED_to_REVOKED, state_machines.Patient.REVOKED_to_GRANTED]
        distinguishing_aspect: "Consent machine is cyclic: PENDING -> GRANTED -> REVOKED -> GRANTED all succeed in sequence."
        test_recipe:
          setup: ["Clinic ACTIVE; patient registered (consent PENDING)"]
          setup_api_calls:
            - { call: "POST /clinics", payload: { name: "C1", npi_number: "1111111111", max_active_referrals: 50 }, as: ProgramAdmin, captures: { cl: $.data.id } }
