              as: FundTaxAdmin
              captures: { ty: "$.data.id" }
            - call: "POST /funds/transfers"
              payload: { fund_id: "${f}", transferor_partner_id: "${t1}", transferee_partner_id: "${t2}", pct_bps: 2000, effective_date: "2025-07-02", settlement_date: "2025-07-02" }
              as: FundTaxAdmin
              captures: { tr: "$.data.id" }
            - call: "POST /funds/transfers/${tr}/confirm"
              payload: {}
              as: FundTaxAdmin
            - call: "POST /funds/transfers/${tr}/settle"
              payload: {}
              as: FundTaxAdmin
            - call: "POST /funds/tax-years/${ty}/close-books"
              payload: {}
              as: FundTaxAdmin
              captures: { ty_v: "$.data.version" }
          trigger:
            - call: "POST /funds/allocation-runs"
              payload: { tax_year_id: "${ty}", run_kind: FINAL, expected_tax_year_version: "${ty_v}" }
              as: TaxPreparer
              captures: { run: "$.data.id" }
            - call: "GET /funds/allocation-runs/${run}/lines"
              payload: {}
