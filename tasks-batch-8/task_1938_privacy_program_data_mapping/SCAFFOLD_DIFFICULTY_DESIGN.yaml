  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_sod_on_approve
        grounds:
          - validations[priority=5]
          - validations[priority=7]
        distinguishing_aspect: |
          Category pair state vs business_safety: approving a CHANGES_REQUESTED
          assessment AS the original submitter violates both ERR_INVALID_STATE_TRANSITION
          (p5) and ERR_SEGREGATION_OF_DUTIES (p7); the p5 state error must win.
        test_recipe:
          setup:
            - "Activity (email element, risk 50) with manual PIA; submitted by bo-1; changes requested by lc-1 -> CHANGES_REQUESTED with submitted_by_user_id == bo-1"
          setup_api_calls:
