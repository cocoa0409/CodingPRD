              as_user_id: "${con_id}"
              captures: { pq_id: $.data.id }
          trigger:
            - call: "POST /prequalifications/${pq_id}/safety-statistics"
              payload: { reporting_year: 2025, hours_worked: 400000, recordable_incidents: 4, dart_cases: 2, fatalities: 0, emr: 0.95, citation_count_willful: 1, citation_count_serious: 2, citation_count_other: 3, source_document_ref: "OSHA300A-2025" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { stat_id: $.data.id }
          assert:
            - "HTTP 201 with data.verification_status == PENDING and verified_at null"
            - "data.citation_points == 12 (5*1 + 2*2 + 1*3)"
            - "data.trir == 2.0000 (4 * 200000 / 400000, four decimals)"
            - "data.dart_rate == 1.0000 (2 * 200000 / 400000)"
            - "Prequalification.${pq_id}.statistics_verification_status == PENDING while status stays DRAFT"
            - "Prequalification.${pq_id}.provisional_composite_score is still null - normalization of the metrics into a score happens on submit, not on statistic creation"

