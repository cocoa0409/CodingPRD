  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # --- Instance 1: Zone aggregate-capacity overlap -----------------------
      - name: zone_aggregate_footprint_overlap_rejects_overfill
        grounds:
          - calculations.zone_occupancy
          - state_machines.PropagationBatch.PLANNED_to_GROWING
          - entities.Zone.fields.free_units
        distinguishing_aspect: |
          Interval semantics = AGGREGATE CAPACITY on a Zone: a new placement's
          footprint must fit in the residual capacity left by all other batches'
          occupied+reserved footprints (overlap = aggregate sum exceeds capacity).
          capacity=100, batch1 occupies 80 (free 20); a new PLANNED batch needing
          footprint 30 > free 20 is rejected with ERR_ZONE_CAPACITY_EXCEEDED. This
          is footprint-vs-capacity geometry, not a time window.
        test_recipe:
          setup:
            - "Zone capacity=100, footprint=1. Batch1 transplanted started=80 (occupied 80, free 20)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: GrowerManager
            - call: "POST /nursery/varieties"
              payload: { common_name: "Sedum Q", cultivar_code: "SEDQ1", propagation_form: "PLUG", grow_cycle_days: 5, container_footprint_units: 1, ship_ready_grade_min_height_cm: 8, ship_ready_min_live_pct: 0.50, requires_phyto: false }
              as: GrowerManager
              captures: { var_id: $.data.id }
            - call: "POST /nursery/varieties/${var_id}/activate"
              payload: {}
              as: GrowerManager
            - call: "POST /nursery/zones"
              payload: { name: "GH8 A", climate_class: "MIXED", capacity_units: 100 }
              as: GrowerManager
              captures: { zone_id: $.data.id }
            - call: "POST /nursery/batches"
              payload: { variety_id: "${var_id}", zone_id: "${zone_id}", source_supplier: "S", sourced_count: 80 }
              as: ProductionTech
              captures: { b1: $.data.id }
            - call: "GET /nursery/zones/${zone_id}"
              payload: {}
              as: ProductionTech
              captures: { zv1: $.data.version }
            - call: "POST /nursery/batches/${b1}/transplant"
              payload: { started_count: 80, expected_zone_version: "${zv1}" }
              as: ProductionTech
            - call: "GET /nursery/zones/${zone_id}"
              payload: {}
              as: ProductionTech
              captures: { fu: $.data.free_units }
          trigger:
            - call: "POST /nursery/batches"
              payload: { variety_id: "${var_id}", zone_id: "${zone_id}", source_supplier: "S", sourced_count: 30 }
              as: ProductionTech
              captures: { err: $.data.error_id }
          assert:
            - "After batch1 transplant: Zone.${zone_id}.occupied_units == 80, reserved_units == 0, free_units == 20"
            - "Creating a new PLANNED batch needing footprint 30 (sourced 30 * footprint 1) exceeds free 20 and returns 409 ERR_ZONE_CAPACITY_EXCEEDED"

      # --- Instance 2: PhytoCertificate temporal validity-window overlap -----
      - name: phyto_validity_window_expired_at_dispatch_instant
