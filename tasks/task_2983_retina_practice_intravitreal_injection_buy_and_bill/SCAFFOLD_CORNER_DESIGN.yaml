              payload: { patient_id: "${k_pt_comm_id}", eye: "OD", study_datetime: "2026-08-29T08:00:00Z", central_subfield_thickness_um: 415, intraretinal_fluid: true, subretinal_fluid: false, new_hemorrhage: false, va_letter_score: 58 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_img_comm2_id: $.data.id }
            - call: "GET /treatment-plans/${k_plan_comm_id}"
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_plan_comm_v3: $.data.version }
            - call: "POST /injection-encounters"
              payload: { treatment_plan_id: "${k_plan_comm_id}", imaging_study_id: "${k_img_comm2_id}", encounter_datetime: "2026-08-29T09:00:00Z", expected_treatment_plan_version: "${k_plan_comm_v3}" }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
