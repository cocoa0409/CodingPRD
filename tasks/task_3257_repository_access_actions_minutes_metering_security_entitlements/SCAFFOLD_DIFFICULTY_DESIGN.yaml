          assert:
            - "c1_status == ACCEPTED   # one second before deadline: strict < holds"
            - "err == ERR_INVITE_EXPIRED   # at exactly invite_expires_at: rejected"
            - "OutsideCollaborator.${collab2_id}.status == EXPIRED   # lazy sweep flipped it"

  - rule_id: compensating_invariant
    instances:
      - name: seat_consume_reclaim_invariant
        grounds:
          - calculations.active_committer_seat_count
          - entities.Enterprise.fields.used_seats
          - entities.Enterprise.fields.available_seats
          - state_machines.UserAccount.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Conserved quantity: seats. The invariant used_seats + available_seats
          == purchased_seats holds across the forward action (CommitEvent
          consumes a seat) and its compensating action (user suspension reclaims
          it) — the pair leaves the enterprise seat ledger unchanged.
        test_recipe:
          setup:
            - "Enterprise with purchased_seats=3 + Organization; clock at default"
          setup_api_calls:
            - call: "POST /enterprises"
              payload: { name: "E1", purchased_seats: 3 }
