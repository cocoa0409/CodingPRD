          - state_machines.SalesGallery
        distinguishing_aspect: "The gallery posture is re-read on each booking-touching call rather than frozen at booking creation: a booking created while OPEN cannot be checked in once the gallery is CLOSED, RESTRICTED refuses the same call, and returning the gallery to OPEN lets the untouched booking check in normally."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z, advanced to 2026-08-14T07:00:00Z."
            - "One OPEN gallery with one ACTIVE representative and one SCHEDULED booking at 2026-08-14T07:00:00Z."
