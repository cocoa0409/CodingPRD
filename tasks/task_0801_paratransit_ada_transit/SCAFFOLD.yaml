scenario: "801. Paratransit / ADA Complementary Transit (Access-A-Ride style): eligibility certification & functional assessment, trip reservation & subscription (standing) trips, ¾-mile service-area & zone check, pickup-window & on-time performance, no-show/late-cancel penalty tiers, negotiated pickup & shared-ride routing, mobility-device & PCA accommodation, fare & recertification"
domain_name: paratransit-ada-transit
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance/audit
  complexity_layers:
    - rate_threshold_triggers
    - scheduled_actions
    - cascading_side_effects
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================
entities:
  - name: Rider
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Rider legal name" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: home_lat, type: number, source: input, description: "Home latitude (decimal degrees)" }
      - { name: home_lng, type: number, source: input, description: "Home longitude (decimal degrees)" }
      - { name: mobility_device, type: enum, source: input, default: NONE, description: "Rider's mobility device", constraints: "one of NONE, CANE, WALKER, MANUAL_WHEELCHAIR, POWER_WHEELCHAIR, SCOOTER" }
      - { name: requires_pca, type: boolean, source: input, default: false, description: "Rider travels with a Personal Care Attendant" }
      - { name: eligibility_status, type: enum, source: system, default: UNCERTIFIED, description: "Derived from the rider's certification lifecycle and suspension state", constraints: "one of UNCERTIFIED, CONDITIONAL, FULL, EXPIRED, SUSPENDED" }
      - { name: certification_expires_at, type: datetime, source: system, description: "When current certification lapses; null until first CERTIFIED application" }
      - { name: account_status, type: enum, source: system, default: ACTIVE, description: "Independent account dimension gating bookings", constraints: "one of ACTIVE, SUSPENDED" }
      - { name: suspension_until, type: datetime, source: system, description: "End of active no-show suspension; null when not suspended" }
      - { name: prior_suspension_count, type: integer, source: system, default: 0, description: "Number of no-show suspensions previously served; drives tiered suspension length" }
      - { name: no_show_points_rolling, type: integer, source: computed, default: 0, description: "Sum of ACTIVE PenaltyEvent.points whose occurred_at falls within the trailing ROLLING_WINDOW_DAYS of the logical clock" }
      - { name: no_show_points_lifetime, type: integer, source: computed, default: 0, description: "Sum of ACTIVE PenaltyEvent.points over all time, regardless of window" }
      - { name: penalty_tier, type: enum, source: computed, default: NONE, description: "Tier derived from no_show_points_rolling vs thresholds", constraints: "one of NONE, WARNING, SUSPENDED" }

  - name: ServiceZone
    parent: null
    common_fields: false
    fields:
      - { name: zone_code, type: string, source: input, description: "Short zone identifier", constraints: "unique across ServiceZone" }
      - { name: name, type: string, source: input, description: "Human-readable zone name" }
      - { name: center_lat, type: number, source: input, description: "Zone service-area center latitude" }
      - { name: center_lng, type: number, source: input, description: "Zone service-area center longitude" }
      - { name: service_radius_miles, type: number, source: input, default: 0.75, description: "¾-mile ADA service-area radius around the zone center; a location is in-service iff haversine distance <= this value" }
      - { name: base_fare_cents, type: integer, source: input, description: "Base one-way paratransit fare for a trip within this zone" }
      - { name: fixed_route_fare_cents, type: integer, source: input, description: "Comparable fixed-route fare; the ADA cap is FARE_CAP_MULTIPLIER x this value" }

  - name: EligibilityApplication
    parent: null
    common_fields: true
    fields:
      - { name: rider_id, type: string, source: input, description: "FK -> Rider.id" }
      - { name: application_type, type: enum, source: input, default: NEW, description: "Whether this is an initial certification or a recertification", constraints: "one of NEW, RECERT" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "Certification workflow state", constraints: "one of SUBMITTED, ASSESSMENT_SCHEDULED, ASSESSED, CERTIFIED, DENIED, APPEALED" }
      - { name: assessment_outcome, type: enum, source: system, description: "Copied from the completed FunctionalAssessment; null until assessed", constraints: "one of PENDING, PASS_UNCONDITIONAL, PASS_CONDITIONAL, FAIL" }
      - { name: certified_category, type: enum, source: system, description: "Category granted on CERTIFIED; null otherwise", constraints: "one of UNCONDITIONAL, CONDITIONAL" }
      - { name: certification_valid_until, type: datetime, source: system, description: "clock + CERT_VALIDITY_DAYS at certification; null until CERTIFIED" }
      - { name: appeal_count, type: integer, source: system, default: 0, description: "Number of times a DENIED decision has been appealed" }

  - name: FunctionalAssessment
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> EligibilityApplication.id" }
      - { name: scheduled_at, type: datetime, source: input, description: "In-person functional assessment appointment time (UTC)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Assessment appointment state", constraints: "one of SCHEDULED, COMPLETED" }
      - { name: outcome, type: enum, source: system, default: PENDING, description: "Result recorded at completion", constraints: "one of PENDING, PASS_UNCONDITIONAL, PASS_CONDITIONAL, FAIL" }
      - { name: assessed_mobility_device, type: enum, source: system, description: "Mobility device confirmed at assessment; null until completed" }

  - name: TripReservation
    parent: null
    common_fields: true
    fields:
      - { name: rider_id, type: string, source: input, description: "FK -> Rider.id" }
      - { name: subscription_trip_id, type: string, source: input, description: "FK -> SubscriptionTrip.id; null for ad-hoc trips, set when materialized from a standing trip" }
      - { name: pickup_zone_id, type: string, source: input, description: "FK -> ServiceZone.id" }
      - { name: dropoff_zone_id, type: string, source: input, description: "FK -> ServiceZone.id" }
      - { name: pickup_lat, type: number, source: input, description: "Requested pickup latitude" }
      - { name: pickup_lng, type: number, source: input, description: "Requested pickup longitude" }
      - { name: dropoff_lat, type: number, source: input, description: "Requested dropoff latitude" }
      - { name: dropoff_lng, type: number, source: input, description: "Requested dropoff longitude" }
      - { name: requested_pickup_at, type: datetime, source: input, description: "Rider's requested pickup time (UTC)" }
      - { name: needs_wheelchair, type: boolean, source: input, default: false, description: "Trip requires a securement (wheelchair) position on the vehicle" }
      - { name: num_companions, type: integer, source: input, default: 0, description: "Fare-paying companions riding along (each consumes an ambulatory seat)" }
      - { name: has_pca, type: boolean, source: input, default: false, description: "A PCA rides along (consumes an ambulatory seat but rides free)" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "Trip lifecycle state", constraints: "one of REQUESTED, OFFERED, COUNTERED, SCHEDULED, EN_ROUTE, PICKED_UP, COMPLETED, CANCELLED, LATE_CANCELLED, NO_SHOW, CANCELLED_BY_SYSTEM" }
      - { name: current_offer_pickup_at, type: datetime, source: system, description: "Latest negotiated pickup time on the table; null until first offer" }
      - { name: offer_round, type: integer, source: system, default: 0, description: "Count of offer/counter exchanges" }
      - { name: assigned_run_id, type: string, source: system, description: "FK -> VehicleRun.id; set on accept, cleared on capacity release" }
      - { name: scheduled_pickup_at, type: datetime, source: system, description: "Accepted pickup time (== current_offer_pickup_at at accept)" }
      - { name: scheduled_dropoff_at, type: datetime, source: system, description: "scheduled_pickup_at + TRIP_DURATION_MINUTES" }
      - { name: estimated_fare_cents, type: integer, source: computed, description: "Provisional fare computed at accept from requested zones" }
      - { name: final_fare_cents, type: integer, source: computed, description: "Final fare computed at dropoff from actual zones" }
      - { name: on_time, type: boolean, source: computed, description: "Whether actual pickup fell inside the pickup window; null until picked up" }
      - { name: late_cancel, type: boolean, source: system, default: false, description: "Whether the cancellation fell inside the late-cancel lead window" }

  - name: NegotiationOffer
    parent: null
    common_fields: false
    fields:
      - { name: trip_id, type: string, source: input, description: "FK -> TripReservation.id" }
      - { name: offered_by, type: enum, source: system, description: "Which party proposed this pickup time", constraints: "one of DISPATCHER, RIDER" }
      - { name: proposed_pickup_at, type: datetime, source: input, description: "Proposed pickup time in this negotiation round" }
      - { name: round_number, type: integer, source: system, description: "1-based negotiation round index" }

  - name: SubscriptionTrip
    parent: null
    common_fields: true
    fields:
      - { name: rider_id, type: string, source: input, description: "FK -> Rider.id" }
      - { name: pickup_zone_id, type: string, source: input, description: "FK -> ServiceZone.id" }
      - { name: dropoff_zone_id, type: string, source: input, description: "FK -> ServiceZone.id" }
      - { name: pickup_lat, type: number, source: input, description: "Standing pickup latitude" }
      - { name: pickup_lng, type: number, source: input, description: "Standing pickup longitude" }
      - { name: dropoff_lat, type: number, source: input, description: "Standing dropoff latitude" }
      - { name: dropoff_lng, type: number, source: input, description: "Standing dropoff longitude" }
      - { name: day_of_week, type: enum, source: input, description: "Recurring weekday", constraints: "one of MON, TUE, WED, THU, FRI, SAT, SUN" }
      - { name: pickup_time_utc, type: string, source: input, description: "Recurring pickup time-of-day as HH:MM (UTC)" }
      - { name: needs_wheelchair, type: boolean, source: input, default: false, description: "Standing trip requires a wheelchair position" }
      - { name: num_companions, type: integer, source: input, default: 0, description: "Companions on each instance" }
      - { name: has_pca, type: boolean, source: input, default: false, description: "PCA rides along on each instance" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Standing-trip lifecycle", constraints: "one of ACTIVE, CANCELLED" }

  - name: VehicleRun
    parent: null
    common_fields: true
    fields:
      - { name: service_zone_id, type: string, source: input, description: "FK -> ServiceZone.id" }
      - { name: service_date, type: string, source: input, description: "Service date as YYYY-MM-DD" }
      - { name: total_ambulatory_seats, type: integer, source: input, description: "Total ambulatory seats on the vehicle" }
      - { name: total_wheelchair_positions, type: integer, source: input, description: "Total securement (wheelchair) positions on the vehicle" }
      - { name: available_ambulatory_seats, type: integer, source: system, description: "total_ambulatory_seats minus peak concurrent ambulatory occupancy across assigned non-terminal trips" }
      - { name: available_wheelchair_positions, type: integer, source: system, description: "total_wheelchair_positions minus peak concurrent wheelchair occupancy across assigned non-terminal trips" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "Run lifecycle state", constraints: "one of PLANNED, OPEN, DISPATCHED, CLOSED, CANCELLED" }

  - name: PenaltyEvent
    parent: null
    common_fields: true
    fields:
      - { name: rider_id, type: string, source: input, description: "FK -> Rider.id" }
      - { name: trip_id, type: string, source: input, description: "FK -> TripReservation.id" }
      - { name: event_type, type: enum, source: system, description: "Cause of the penalty", constraints: "one of NO_SHOW, LATE_CANCEL" }
      - { name: points, type: integer, source: system, description: "Points assessed: NO_SHOW_POINTS for NO_SHOW, LATE_CANCEL_POINTS for LATE_CANCEL" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Whether the penalty currently counts toward the rider's points", constraints: "one of ACTIVE, VOIDED" }
      - { name: occurred_at, type: datetime, source: system, description: "Logical-clock time the penalty was recorded" }

# ============================================================================
# §1.2 State Machine Table
# ============================================================================
state_machines:
  - entity: EligibilityApplication
    initial_state: SUBMITTED
    terminal_states: [CERTIFIED]
    transitions:
      - from: SUBMITTED
        to: ASSESSMENT_SCHEDULED
        trigger: "POST /functional-assessments"
        actor: EligibilitySpecialist
        preconditions: ["application.status == SUBMITTED"]
        side_effects: ["creates a FunctionalAssessment in SCHEDULED"]
      - from: APPEALED
        to: ASSESSMENT_SCHEDULED
        trigger: "POST /functional-assessments"
        actor: EligibilitySpecialist
        preconditions: ["application.status == APPEALED"]
        side_effects: ["creates a new FunctionalAssessment in SCHEDULED"]
        note: "Re-entry after an appeal closes the DENIED -> APPEALED -> ASSESSMENT_SCHEDULED -> ASSESSED -> DENIED cycle."
      - from: ASSESSMENT_SCHEDULED
        to: ASSESSED
        trigger: "POST /functional-assessments/{id}/complete"
        actor: EligibilitySpecialist
        preconditions: ["the assessment being completed belongs to this application", "assessment.status == SCHEDULED"]
        side_effects: ["copies assessment.outcome into application.assessment_outcome"]
      - from: ASSESSED
        to: CERTIFIED
        trigger: "POST /eligibility-applications/{id}/certify"
        actor: EligibilitySpecialist
        preconditions: ["application.status == ASSESSED", "application.assessment_outcome IN {PASS_UNCONDITIONAL, PASS_CONDITIONAL}"]
        side_effects:
          - "sets certified_category (UNCONDITIONAL if outcome PASS_UNCONDITIONAL else CONDITIONAL)"
          - "sets certification_valid_until = clock + CERT_VALIDITY_DAYS"
          - "cascade: Rider.eligibility_status := FULL if UNCONDITIONAL else CONDITIONAL"
          - "cascade: Rider.certification_expires_at := certification_valid_until"
      - from: ASSESSED
        to: DENIED
        trigger: "POST /eligibility-applications/{id}/deny"
        actor: EligibilitySpecialist
        preconditions: ["application.status == ASSESSED", "application.assessment_outcome == FAIL"]
        side_effects: ["Rider.eligibility_status unchanged (remains UNCERTIFIED/EXPIRED)"]
      - from: DENIED
        to: APPEALED
        trigger: "POST /eligibility-applications/{id}/appeal"
        actor: EligibilitySpecialist | Rider
        preconditions: ["application.status == DENIED"]
        side_effects: ["increments appeal_count by 1"]

  - entity: FunctionalAssessment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /functional-assessments/{id}/complete"
        actor: EligibilitySpecialist
        preconditions: ["assessment.status == SCHEDULED", "parent application.status == ASSESSMENT_SCHEDULED"]
        side_effects: ["sets outcome and assessed_mobility_device", "cross-entity: parent EligibilityApplication ASSESSMENT_SCHEDULED -> ASSESSED with assessment_outcome copied"]

  - entity: TripReservation
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, LATE_CANCELLED, NO_SHOW, CANCELLED_BY_SYSTEM]
    transitions:
      - from: REQUESTED
        to: OFFERED
        trigger: "POST /trip-reservations/{id}/offer"
        actor: Dispatcher
        preconditions: ["trip.status == REQUESTED"]
        side_effects: ["creates NegotiationOffer(offered_by=DISPATCHER)", "sets current_offer_pickup_at", "increments offer_round"]
      - from: COUNTERED
        to: OFFERED
        trigger: "POST /trip-reservations/{id}/offer"
        actor: Dispatcher
        preconditions: ["trip.status == COUNTERED"]
        side_effects: ["creates NegotiationOffer(offered_by=DISPATCHER)", "sets current_offer_pickup_at", "increments offer_round"]
        note: "OFFERED <-> COUNTERED forms the negotiated-pickup cycle."
      - from: OFFERED
        to: COUNTERED
        trigger: "POST /trip-reservations/{id}/counter"
        actor: Rider
        preconditions: ["trip.status == OFFERED", "acting Rider owns the trip"]
        side_effects: ["creates NegotiationOffer(offered_by=RIDER)", "sets current_offer_pickup_at", "increments offer_round"]
      - from: OFFERED
        to: SCHEDULED
        trigger: "POST /trip-reservations/{id}/accept"
        actor: Rider
        preconditions:
          - "trip.status == OFFERED"
          - "acting Rider owns the trip"
          - "Rider.account_status == ACTIVE (not suspended)"
          - "target VehicleRun.status IN {PLANNED, OPEN}"
          - "expected_run_version matches VehicleRun.version (OCC)"
          - "wheelchair positions available for the trip's interval (safety)"
          - "ambulatory seats available for the trip's interval (constraint)"
          - "no overlapping non-terminal trip for the same Rider incl. buffer (temporal)"
        side_effects:
          - "sets scheduled_pickup_at = current_offer_pickup_at, scheduled_dropoff_at = scheduled_pickup_at + TRIP_DURATION_MINUTES"
          - "sets assigned_run_id"
          - "computes estimated_fare_cents (provisional variant, requested zones)"
          - "decrements VehicleRun.available_wheelchair_positions / available_ambulatory_seats by the trip's needs"
          - "increments VehicleRun.version by 1"
      - from: SCHEDULED
        to: EN_ROUTE
        trigger: "POST /vehicle-runs/{id}/dispatch (cascade)"
        actor: system
        preconditions: ["parent VehicleRun transitions OPEN -> DISPATCHED"]
        side_effects: ["each SCHEDULED trip assigned to the run moves to EN_ROUTE"]
      - from: SCHEDULED
        to: PICKED_UP
        trigger: "POST /trip-reservations/{id}/pickup"
        actor: Driver
        preconditions: ["trip.status IN {SCHEDULED, EN_ROUTE}"]
        side_effects: ["sets actual pickup; computes on_time (pickup-window boundary)"]
      - from: EN_ROUTE
        to: PICKED_UP
        trigger: "POST /trip-reservations/{id}/pickup"
        actor: Driver
        preconditions: ["trip.status IN {SCHEDULED, EN_ROUTE}"]
        side_effects: ["sets actual pickup; computes on_time"]
      - from: PICKED_UP
        to: COMPLETED
        trigger: "POST /trip-reservations/{id}/dropoff"
        actor: Driver
        preconditions: ["trip.status == PICKED_UP"]
        side_effects: ["computes final_fare_cents (final variant, actual zones)", "releases the trip's positions/seats back to VehicleRun; increments VehicleRun.version by 1"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /trip-reservations/{id}/cancel"
        actor: Rider
        preconditions: ["trip.status IN {REQUESTED, OFFERED, COUNTERED, SCHEDULED}", "acting Rider owns the trip"]
        side_effects: ["no penalty (not yet scheduled)"]
      - from: OFFERED
        to: CANCELLED
        trigger: "POST /trip-reservations/{id}/cancel"
        actor: Rider
        preconditions: ["trip.status IN {REQUESTED, OFFERED, COUNTERED, SCHEDULED}", "acting Rider owns the trip"]
        side_effects: ["no penalty"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /trip-reservations/{id}/cancel"
        actor: Rider
        preconditions: ["trip.status == SCHEDULED", "acting Rider owns the trip", "(scheduled_pickup_at - clock) >= LATE_CANCEL_LEAD_HOURS"]
        side_effects: ["releases positions/seats back to VehicleRun; increments VehicleRun.version by 1"]
      - from: SCHEDULED
        to: LATE_CANCELLED
        trigger: "POST /trip-reservations/{id}/cancel"
        actor: Rider
        preconditions: ["trip.status == SCHEDULED", "acting Rider owns the trip", "(scheduled_pickup_at - clock) < LATE_CANCEL_LEAD_HOURS"]
        side_effects:
          - "sets late_cancel = true"
          - "creates PenaltyEvent(event_type=LATE_CANCEL, points=LATE_CANCEL_POINTS, occurred_at=clock)"
          - "recomputes Rider.no_show_points_rolling / lifetime / penalty_tier"
          - "releases positions/seats back to VehicleRun; increments VehicleRun.version by 1"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /trip-reservations/{id}/no-show"
        actor: Driver | Dispatcher
        preconditions: ["trip.status IN {SCHEDULED, EN_ROUTE}"]
        side_effects:
          - "creates PenaltyEvent(event_type=NO_SHOW, points=NO_SHOW_POINTS, occurred_at=clock)  [cascade hop 1]"
          - "recomputes Rider.no_show_points_rolling; if >= SUSPENSION_THRESHOLD_POINTS then Rider.account_status:=SUSPENDED, eligibility_status:=SUSPENDED, suspension_until = clock + tiered days, prior_suspension_count += 1  [cascade hop 2]"
          - "if suspended: every other non-terminal TripReservation of the Rider transitions to CANCELLED_BY_SYSTEM  [cascade hop 3]"
          - "each system-cancelled trip that held run capacity releases it back to its VehicleRun and increments that VehicleRun.version by 1  [cascade hop 4]"
          - "releases this trip's own positions/seats back to VehicleRun; increments VehicleRun.version by 1"
      - from: EN_ROUTE
        to: NO_SHOW
        trigger: "POST /trip-reservations/{id}/no-show"
        actor: Driver | Dispatcher
        preconditions: ["trip.status IN {SCHEDULED, EN_ROUTE}"]
        side_effects: ["same as SCHEDULED -> NO_SHOW"]

  - entity: VehicleRun
    initial_state: PLANNED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /vehicle-runs/{id}/open"
        actor: Dispatcher
        preconditions: ["run.status == PLANNED"]
        side_effects: []
      - from: OPEN
        to: DISPATCHED
        trigger: "POST /vehicle-runs/{id}/dispatch"
        actor: Dispatcher
        preconditions: ["run.status == OPEN"]
        side_effects: ["cascade: every SCHEDULED trip assigned to the run moves to EN_ROUTE", "increments run.version by 1"]

# ----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: accept-onto-stale-run
    parent_entity: VehicleRun
    write_endpoint: "POST /trip-reservations/{id}/accept"
    occ_field: "expected_run_version"
    description: |
      Accepting an offered trip onto a VehicleRun whose version has advanced
      since the client last observed it is rejected. This is a create-with-
      supersede booking: a run with spare capacity can legitimately accept two
      different trips, so a stale-version accept is NOT reducible to a capacity
      or state precondition (the same accept would succeed with a fresh
      version). The stale-version check catches the case where another accept
      has already booked against the run and advanced its version.
    error_id: ERR_STALE_RUN_VERSION
    http_status: 412

# ============================================================================
# §1.3 Calculation Rules Table
# ============================================================================
calculations:
  - name: trip_fare
    trigger: "estimated_fare_cents at POST /trip-reservations/{id}/accept; final_fare_cents at POST /trip-reservations/{id}/dropoff"
    algorithm: tiered_pricing
    formula: |
      # zones: p = pickup zone, d = dropoff zone for the variant in question
      if p.id == d.id:
          base = p.base_fare_cents
      else:
          base = max(p.base_fare_cents, d.base_fare_cents) + CROSS_ZONE_SURCHARGE_CENTS
      capped = min(base, FARE_CAP_MULTIPLIER * p.fixed_route_fare_cents)   # ADA 2x fixed-route cap
      companion_charge = COMPANION_FARE_CENTS * num_companions             # PCA rides free; not counted
      fare = capped + companion_charge
    input_set: "The single trip being priced. Provisional uses the requested pickup_zone_id/dropoff_zone_id; final uses the actual zones supplied to the dropoff call."
    constants:
      CROSS_ZONE_SURCHARGE_CENTS: 150
      FARE_CAP_MULTIPLIER: 2
      COMPANION_FARE_CENTS: 275
    precision: "integer cents, no rounding (all inputs are integer cents)"
    variants:
      - name: provisional
        when: "at accept, before the ride is taken"
        difference: "uses the requested pickup_zone_id and dropoff_zone_id; stored in estimated_fare_cents"
      - name: final
        when: "at dropoff, after the actual zones are known"
        difference: "uses actual_pickup_zone_id and actual_dropoff_zone_id from the dropoff call; stored in final_fare_cents; may differ from provisional when the actual dropoff zone differs from the requested one"

  - name: no_show_scoring
    trigger: "recomputed on any PenaltyEvent create (NO_SHOW / LATE_CANCEL) and on POST /penalty-events/{id}/waive"
    algorithm: aggregation
    formula: |
      window_start = clock - ROLLING_WINDOW_DAYS days
      rolling  = sum(pe.points for pe in PenaltyEvent
                     where pe.rider_id == rider.id
                       and pe.status == ACTIVE
                       and pe.occurred_at >= window_start)   # half-open lower bound: >= window_start
      lifetime = sum(pe.points for pe in PenaltyEvent
                     where pe.rider_id == rider.id and pe.status == ACTIVE)
    input_set: "ACTIVE PenaltyEvents for the rider; rolling filters to occurred_at within the trailing ROLLING_WINDOW_DAYS."
    constants:
      ROLLING_WINDOW_DAYS: 30
    precision: "integer points"
    variants:
      - name: rolling_window
        when: "gating penalty_tier and suspension decisions"
        difference: "only counts PenaltyEvents whose occurred_at >= clock - ROLLING_WINDOW_DAYS; drives penalty_tier"
      - name: lifetime
        when: "reporting and recertification review"
        difference: "counts all ACTIVE PenaltyEvents regardless of age; produces a larger number than rolling_window once events age out of the window"

  - name: penalty_tier
    trigger: "recomputed whenever no_show_scoring runs"
    algorithm: threshold
    formula: |
      if rolling >= SUSPENSION_THRESHOLD_POINTS:  tier = SUSPENDED
      elif rolling >= WARNING_THRESHOLD_POINTS:   tier = WARNING
      else:                                       tier = NONE
      # suspension length when crossing into SUSPENDED, by prior_suspension_count BEFORE increment:
      if prior_suspension_count == 0: days = 7
      elif prior_suspension_count == 1: days = 15
      else: days = 30
    input_set: "rider.no_show_points_rolling (from no_show_scoring.rolling_window) and rider.prior_suspension_count"
    constants:
      WARNING_THRESHOLD_POINTS: 3
      SUSPENSION_THRESHOLD_POINTS: 6
      TIER1_SUSPENSION_DAYS: 7
      TIER2_SUSPENSION_DAYS: 15
      TIER3_SUSPENSION_DAYS: 30
    precision: "whole days; boundary is inclusive >= at both thresholds"

  - name: service_area_check
    trigger: "POST /trip-reservations (pickup and dropoff), POST /subscription-trips, POST /subscription-trips/{id}/instantiate"
    algorithm: threshold
    formula: |
      # Haversine great-circle distance in miles
      R = R_MILES
      dphi    = radians(lat2 - lat1)
      dlambda = radians(lng2 - lng1)
      a = sin(dphi/2)^2 + cos(radians(lat1))*cos(radians(lat2))*sin(dlambda/2)^2
      dist = 2 * R * asin(sqrt(a))
      in_service = dist <= zone.service_radius_miles   # inclusive: exactly on the ¾-mile boundary is in-service
    input_set: "The trip's pickup coordinates vs pickup_zone center, and dropoff coordinates vs dropoff_zone center."
    constants:
      R_MILES: 3958.7613
    precision: "distance to full float precision; comparison is dist <= service_radius_miles (boundary inclusive)"

  - name: pickup_on_time
    trigger: "POST /trip-reservations/{id}/pickup"
    algorithm: interval_merge
    formula: |
      window_start = scheduled_pickup_at
      window_end   = scheduled_pickup_at + PICKUP_WINDOW_MINUTES minutes
      on_time = (actual_pickup_at >= window_start) and (actual_pickup_at <= window_end)  # closed window; == window_end is on-time
    input_set: "actual_pickup_at supplied at pickup vs the trip's scheduled pickup window."
    constants:
      PICKUP_WINDOW_MINUTES: 30
    precision: "second precision; boundary inclusive at both ends (<= window_end)"

  - name: fleet_on_time_performance
    trigger: "GET /reports/on-time-performance"
    algorithm: aggregation
    formula: |
      # Over all trips in the (optional) service_zone / date filter that reached PICKED_UP or COMPLETED:
      total_pickups   = count(trips with on_time != null)
      on_time_pickups = count(trips with on_time == true)
      # PINNED ORDER: sum across all runs first, THEN divide, THEN round once.
      otp_pct = round( on_time_pickups / total_pickups * 100, 2 )   # round_half_up, 2 decimals
      # (Rounding each run's percentage first and then averaging is explicitly NOT used.)
    input_set: "All picked-up/completed trips matching the report filter; on_time computed per trip by pickup_on_time."
    constants: {}
    precision: "2 decimal places, round_half_up; sum-then-divide-then-round order is pinned"

# ============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# ============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: all }
  - { priority: 2, category: auth, check: "Role permitted for this operation per §1.7", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: all }
  - { priority: 3, category: existence, check: "Every path/body-referenced resource exists, validated left-to-right", error_id: "ERR_*_NOT_FOUND", http_status: 404, applies_to: all }
  - { priority: 4, category: existence, check: "Rider acting via entity_backed identity owns the target resource (X-User-ID == resource.rider_id)", error_id: ERR_FORBIDDEN_NOT_OWNER, http_status: 403, applies_to: "trip counter/accept/cancel, subscription create/cancel, application appeal by Rider" }
  - { priority: 5, category: business_constraint, check: "Rider must not already have a non-terminal EligibilityApplication when submitting a new one", error_id: ERR_DUPLICATE_ACTIVE_APPLICATION, http_status: 409, applies_to: "POST /eligibility-applications" }
  - { priority: 6, category: state, check: "Target resource is in a state that permits the requested transition (generic)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state-changing endpoints" }
  - { priority: 7, category: state, check: "Booking rider's eligibility_status IN {FULL, CONDITIONAL} at trip request", error_id: ERR_RIDER_NOT_ELIGIBLE, http_status: 409, applies_to: "POST /trip-reservations, POST /subscription-trips, POST /subscription-trips/{id}/instantiate" }
  - { priority: 8, category: state, check: "Rider.account_status == ACTIVE (not under no-show suspension) at trip request and at accept", error_id: ERR_RIDER_SUSPENDED, http_status: 409, applies_to: "POST /trip-reservations, POST /trip-reservations/{id}/accept, POST /subscription-trips/{id}/instantiate" }
  - { priority: 9, category: state, check: "Rider.certification_expires_at > clock at trip request (certification not lapsed)", error_id: ERR_ELIGIBILITY_EXPIRED, http_status: 409, applies_to: "POST /trip-reservations, POST /subscription-trips/{id}/instantiate" }
  - { priority: 10, category: state, check: "Target VehicleRun.status IN {PLANNED, OPEN} when accepting a trip onto it", error_id: ERR_RUN_NOT_OPEN, http_status: 409, applies_to: "POST /trip-reservations/{id}/accept" }
  - { priority: 11, category: state, check: "expected_run_version matches VehicleRun.version (OCC)", error_id: ERR_STALE_RUN_VERSION, http_status: 412, applies_to: "POST /trip-reservations/{id}/accept" }
  - { priority: 12, category: business_referential, check: "Pickup and dropoff coordinates are within their zone's ¾-mile service radius (service_area_check)", error_id: ERR_OUTSIDE_SERVICE_AREA, http_status: 422, applies_to: "POST /trip-reservations, POST /subscription-trips, POST /subscription-trips/{id}/instantiate" }
  - { priority: 13, category: business_safety, check: "VehicleRun has a free wheelchair position for the trip's interval (peak concurrent occupancy < total_wheelchair_positions), when needs_wheelchair", error_id: ERR_NO_WHEELCHAIR_CAPACITY, http_status: 409, applies_to: "POST /trip-reservations/{id}/accept" }
  - { priority: 14, category: business_constraint, check: "VehicleRun has free ambulatory seats for the trip's interval (rider-if-ambulatory + companions + pca) against total_ambulatory_seats", error_id: ERR_NO_SEAT_CAPACITY, http_status: 409, applies_to: "POST /trip-reservations/{id}/accept" }
  - { priority: 15, category: business_temporal, check: "Rider has no other non-terminal trip whose buffered interval [pickup-15m, dropoff+15m] overlaps this trip's buffered interval (closed intervals + TURNAROUND_BUFFER_MINUTES)", error_id: ERR_RIDER_TRIP_OVERLAP, http_status: 409, applies_to: "POST /trip-reservations/{id}/accept" }
  - { priority: 16, category: existence, check: "Body/query field types and required fields valid; enum members recognized", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: all }
  - { priority: 17, category: business_constraint, check: "Numeric inputs within range (non-negative seats/positions/companions; valid coordinates)", error_id: ERR_OUT_OF_RANGE, http_status: 422, applies_to: "POST /vehicle-runs, POST /trip-reservations, POST /subscription-trips" }

# ============================================================================
# §1.5 API Endpoint Table
# ============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Admin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["advances/sets the logical clock used by all time-gated rules"]

  - method: POST
    path: "/service-zones"
    description: "Create a service zone (config)."
    roles: [Admin]
    code: 201
    input: [zone_code, name, center_lat, center_lng, "service_radius_miles?", base_fare_cents, fixed_route_fare_cents]
    output: ServiceZone
    side_effects: []

  - method: POST
    path: "/riders"
    description: "Register a rider (uncertified until an application is CERTIFIED)."
    roles: [EligibilitySpecialist, Admin]
    code: 201
    input: [full_name, phone, email, home_lat, home_lng, "mobility_device?", "requires_pca?"]
    output: Rider
    side_effects: ["Rider created with eligibility_status=UNCERTIFIED, account_status=ACTIVE"]

  - method: GET
    path: "/riders/{id}"
    description: "Read a rider incl. computed eligibility_status, no_show_points_rolling/lifetime, penalty_tier."
    roles: [Admin, Dispatcher, Driver, EligibilitySpecialist, Rider]
    code: 200
    input: []
    output: Rider
    side_effects: []

  - method: POST
    path: "/eligibility-applications"
    description: "Submit a new or recertification eligibility application for a rider."
    roles: [EligibilitySpecialist]
    code: 201
    input: [rider_id, "application_type?"]
    output: EligibilityApplication
    side_effects: ["EligibilityApplication created in SUBMITTED"]

  - method: GET
    path: "/eligibility-applications/{id}"
    description: "Read an eligibility application."
    roles: [Admin, EligibilitySpecialist, Rider]
    code: 200
    input: []
    output: EligibilityApplication
    side_effects: []

  - method: GET
    path: "/eligibility-applications"
    description: "List eligibility applications; filter by rider_id and/or status. Reverse-reachability for EligibilityApplication.rider_id."
    roles: [Admin, EligibilitySpecialist, Rider]
    code: 200
    input: ["rider_id?", "status?", "limit?", "offset?"]
    output: EligibilityApplication[]
    side_effects: []

  - method: POST
    path: "/eligibility-applications/{id}/certify"
    description: "Certify an assessed, passing application; cascades certification onto the Rider."
    roles: [EligibilitySpecialist]
    code: 200
    input: []
    output: EligibilityApplication
    side_effects: ["ASSESSED -> CERTIFIED", "sets certified_category, certification_valid_until", "cascade: Rider.eligibility_status + certification_expires_at"]

  - method: POST
    path: "/eligibility-applications/{id}/deny"
    description: "Deny an assessed, failing application."
    roles: [EligibilitySpecialist]
    code: 200
    input: []
    output: EligibilityApplication
    side_effects: ["ASSESSED -> DENIED"]

  - method: POST
    path: "/eligibility-applications/{id}/appeal"
    description: "Appeal a denied application, reopening it for reassessment."
    roles: [EligibilitySpecialist, Rider]
    code: 200
    input: []
    output: EligibilityApplication
    side_effects: ["DENIED -> APPEALED", "increments appeal_count"]

  - method: POST
    path: "/functional-assessments"
    description: "Schedule an in-person functional assessment for a SUBMITTED or APPEALED application; advances the application to ASSESSMENT_SCHEDULED."
    roles: [EligibilitySpecialist]
    code: 201
    input: [application_id, scheduled_at]
    output: FunctionalAssessment
    side_effects: ["FunctionalAssessment created SCHEDULED", "application SUBMITTED|APPEALED -> ASSESSMENT_SCHEDULED"]

  - method: GET
    path: "/functional-assessments/{id}"
    description: "Read a functional assessment."
    roles: [Admin, EligibilitySpecialist, Rider]
    code: 200
    input: []
    output: FunctionalAssessment
    side_effects: []

  - method: GET
    path: "/functional-assessments"
    description: "List functional assessments; filter by application_id. Reverse-reachability for FunctionalAssessment.application_id."
    roles: [Admin, EligibilitySpecialist, Rider]
    code: 200
    input: ["application_id?", "limit?", "offset?"]
    output: FunctionalAssessment[]
    side_effects: []

  - method: POST
    path: "/functional-assessments/{id}/complete"
    description: "Record the assessment outcome; advances the parent application to ASSESSED."
    roles: [EligibilitySpecialist]
    code: 200
    input: [outcome, assessed_mobility_device]
    output: FunctionalAssessment
    side_effects: ["SCHEDULED -> COMPLETED", "cross-entity: application ASSESSMENT_SCHEDULED -> ASSESSED with assessment_outcome copied"]

  - method: POST
    path: "/trip-reservations"
    description: "Request an ad-hoc trip. Validates rider eligibility/suspension/expiry and ¾-mile service area for pickup and dropoff."
    roles: [Rider]
    code: 201
    input: [rider_id, pickup_zone_id, dropoff_zone_id, pickup_lat, pickup_lng, dropoff_lat, dropoff_lng, requested_pickup_at, "needs_wheelchair?", "num_companions?", "has_pca?"]
    output: TripReservation
    side_effects: ["TripReservation created REQUESTED"]

  - method: GET
    path: "/trip-reservations/{id}"
    description: "Read a trip reservation incl. fares, on_time, scheduled window."
    roles: [Admin, Dispatcher, Driver, EligibilitySpecialist, Rider]
    code: 200
    input: []
    output: TripReservation
    side_effects: []

  - method: GET
    path: "/trip-reservations"
    description: "List trips; filter by rider_id, pickup_zone_id, dropoff_zone_id, subscription_trip_id, status. Reverse-reachability for TripReservation.rider_id, pickup_zone_id, dropoff_zone_id, subscription_trip_id."
    roles: [Admin, Dispatcher, Driver, EligibilitySpecialist, Rider]
    code: 200
    input: ["rider_id?", "pickup_zone_id?", "dropoff_zone_id?", "subscription_trip_id?", "status?", "limit?", "offset?"]
    output: TripReservation[]
    side_effects: []

  - method: POST
    path: "/trip-reservations/{id}/offer"
    description: "Dispatcher proposes a pickup time (REQUESTED|COUNTERED -> OFFERED)."
    roles: [Dispatcher]
    code: 200
    input: [proposed_pickup_at]
    output: TripReservation
    side_effects: ["creates NegotiationOffer(DISPATCHER)", "sets current_offer_pickup_at", "increments offer_round"]

  - method: POST
    path: "/trip-reservations/{id}/counter"
    description: "Rider counters the offered pickup time (OFFERED -> COUNTERED)."
    roles: [Rider]
    code: 200
    input: [proposed_pickup_at]
    output: TripReservation
    side_effects: ["creates NegotiationOffer(RIDER)", "sets current_offer_pickup_at", "increments offer_round"]

  - method: POST
    path: "/trip-reservations/{id}/accept"
    description: "Rider accepts the current offer and books onto a VehicleRun (OCC on run version). Runs capacity, overlap, suspension checks."
    roles: [Rider]
    code: 200
    input: [run_id, expected_run_version]
    output: TripReservation
    side_effects: ["OFFERED -> SCHEDULED", "sets scheduled window, assigned_run_id, estimated_fare_cents", "decrements run capacity", "increments VehicleRun.version by 1"]

  - method: POST
    path: "/trip-reservations/{id}/cancel"
    description: "Rider cancels a trip. Within LATE_CANCEL_LEAD_HOURS of a SCHEDULED pickup -> LATE_CANCELLED + penalty; otherwise CANCELLED. Releases run capacity."
    roles: [Rider]
    code: 200
    input: []
    output: TripReservation
    side_effects: ["-> CANCELLED or LATE_CANCELLED", "may create PenaltyEvent(LATE_CANCEL)", "releases run capacity; increments VehicleRun.version by 1 when assigned"]

  - method: POST
    path: "/trip-reservations/{id}/pickup"
    description: "Driver records actual pickup; computes on_time against the pickup window."
    roles: [Driver]
    code: 200
    input: [actual_pickup_at, actual_pickup_zone_id]
    output: TripReservation
    side_effects: ["SCHEDULED|EN_ROUTE -> PICKED_UP", "computes on_time"]

  - method: POST
    path: "/trip-reservations/{id}/dropoff"
    description: "Driver records actual dropoff; computes final_fare_cents from actual zones and releases capacity."
    roles: [Driver]
    code: 200
    input: [actual_dropoff_at, actual_dropoff_zone_id]
    output: TripReservation
    side_effects: ["PICKED_UP -> COMPLETED", "computes final_fare_cents", "releases run capacity; increments VehicleRun.version by 1"]

  - method: POST
    path: "/trip-reservations/{id}/no-show"
    description: "Mark a scheduled/en-route trip a no-show; assesses points and may trigger the suspension cascade."
    roles: [Driver, Dispatcher]
    code: 200
    input: []
    output: TripReservation
    side_effects: ["-> NO_SHOW", "creates PenaltyEvent(NO_SHOW)", "recomputes rider points; may suspend and system-cancel other trips releasing their run capacity"]

  - method: GET
    path: "/trip-reservations/{id}/offers"
    description: "List the negotiation offers for a trip. Reverse-reachability for NegotiationOffer.trip_id."
    roles: [Admin, Dispatcher, Driver, EligibilitySpecialist, Rider]
    code: 200
    input: ["limit?", "offset?"]
    output: NegotiationOffer[]
    side_effects: []

  - method: POST
    path: "/subscription-trips"
    description: "Create a standing (subscription) trip template for a rider; validates eligibility and ¾-mile service area."
    roles: [Rider]
    code: 201
    input: [rider_id, pickup_zone_id, dropoff_zone_id, pickup_lat, pickup_lng, dropoff_lat, dropoff_lng, day_of_week, pickup_time_utc, "needs_wheelchair?", "num_companions?", "has_pca?"]
    output: SubscriptionTrip
    side_effects: ["SubscriptionTrip created ACTIVE"]

  - method: GET
    path: "/subscription-trips/{id}"
    description: "Read a subscription trip."
    roles: [Admin, Dispatcher, EligibilitySpecialist, Rider]
    code: 200
    input: []
    output: SubscriptionTrip
    side_effects: []

  - method: GET
    path: "/subscription-trips"
    description: "List subscription trips; filter by rider_id. Reverse-reachability for SubscriptionTrip.rider_id, pickup_zone_id, dropoff_zone_id."
    roles: [Admin, Dispatcher, EligibilitySpecialist, Rider]
    code: 200
    input: ["rider_id?", "pickup_zone_id?", "dropoff_zone_id?", "limit?", "offset?"]
    output: SubscriptionTrip[]
    side_effects: []

  - method: POST
    path: "/subscription-trips/{id}/instantiate"
    description: "Materialize a dated TripReservation from an ACTIVE standing trip; re-checks eligibility, suspension, expiry and service area at materialization time."
    roles: [Dispatcher]
    code: 201
    input: [service_date, requested_pickup_at]
    output: TripReservation
    side_effects: ["creates a TripReservation REQUESTED with subscription_trip_id set"]

  - method: POST
    path: "/vehicle-runs"
    description: "Create a vehicle run (a dated route with seat/position capacity)."
    roles: [Dispatcher]
    code: 201
    input: [service_zone_id, service_date, total_ambulatory_seats, total_wheelchair_positions]
    output: VehicleRun
    side_effects: ["VehicleRun created PLANNED with available_* = total_*"]

  - method: GET
    path: "/vehicle-runs/{id}"
    description: "Read a vehicle run incl. available seats/positions and version."
    roles: [Admin, Dispatcher, Driver]
    code: 200
    input: []
    output: VehicleRun
    side_effects: []

  - method: GET
    path: "/vehicle-runs"
    description: "List vehicle runs; filter by service_zone_id. Reverse-reachability for VehicleRun.service_zone_id."
    roles: [Admin, Dispatcher, Driver]
    code: 200
    input: ["service_zone_id?", "service_date?", "limit?", "offset?"]
    output: VehicleRun[]
    side_effects: []

  - method: GET
    path: "/vehicle-runs/{id}/manifest"
    description: "List the trips assigned to a run. Reverse-reachability for TripReservation.assigned_run_id."
    roles: [Admin, Dispatcher, Driver]
    code: 200
    input: ["limit?", "offset?"]
    output: TripReservation[]
    side_effects: []

  - method: POST
    path: "/vehicle-runs/{id}/open"
    description: "Open a planned run for booking (PLANNED -> OPEN)."
    roles: [Dispatcher]
    code: 200
    input: []
    output: VehicleRun
    side_effects: []

  - method: POST
    path: "/vehicle-runs/{id}/dispatch"
    description: "Dispatch an open run; cascades all SCHEDULED trips to EN_ROUTE (OPEN -> DISPATCHED)."
    roles: [Dispatcher]
    code: 200
    input: []
    output: VehicleRun
    side_effects: ["cascade: SCHEDULED trips -> EN_ROUTE", "increments run.version by 1"]

  - method: GET
    path: "/penalty-events/{id}"
    description: "Read a penalty event."
    roles: [Admin, EligibilitySpecialist, Rider]
    code: 200
    input: []
    output: PenaltyEvent
    side_effects: []

  - method: GET
    path: "/penalty-events"
    description: "List penalty events; filter by rider_id and/or trip_id. Reverse-reachability for PenaltyEvent.rider_id and PenaltyEvent.trip_id."
    roles: [Admin, EligibilitySpecialist, Rider]
    code: 200
    input: ["rider_id?", "trip_id?", "limit?", "offset?"]
    output: PenaltyEvent[]
    side_effects: []

  - method: POST
    path: "/penalty-events/{id}/waive"
    description: "Waive (void) a penalty event; recomputes the rider's rolling/lifetime points and tier."
    roles: [EligibilitySpecialist]
    code: 200
    input: []
    output: PenaltyEvent
    side_effects: ["ACTIVE -> VOIDED", "recomputes Rider.no_show_points_rolling/lifetime/penalty_tier"]

  - method: GET
    path: "/reports/on-time-performance"
    description: "Fleet on-time performance report over picked-up/completed trips (optionally filtered by zone/date)."
    roles: [Admin, Dispatcher]
    code: 200
    input: ["service_zone_id?", "service_date?"]
    output: "{ total_pickups: integer, on_time_pickups: integer, otp_pct: number }"
    side_effects: []

# ============================================================================
# §1.6 Error Code Catalog
# ============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unrecognized" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_FORBIDDEN_NOT_OWNER, http: 403, condition: "Rider acting on a resource they do not own (X-User-ID != resource.rider_id)" }
  - { id: ERR_RIDER_NOT_FOUND, http: 404, condition: "Referenced rider does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "Referenced eligibility application does not exist" }
  - { id: ERR_ASSESSMENT_NOT_FOUND, http: 404, condition: "Referenced functional assessment does not exist" }
  - { id: ERR_ZONE_NOT_FOUND, http: 404, condition: "Referenced service zone does not exist" }
  - { id: ERR_TRIP_NOT_FOUND, http: 404, condition: "Referenced trip reservation does not exist" }
  - { id: ERR_SUBSCRIPTION_NOT_FOUND, http: 404, condition: "Referenced subscription trip does not exist" }
  - { id: ERR_RUN_NOT_FOUND, http: 404, condition: "Referenced vehicle run does not exist" }
  - { id: ERR_PENALTY_NOT_FOUND, http: 404, condition: "Referenced penalty event does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, or unrecognized enum value" }
  - { id: ERR_OUT_OF_RANGE, http: 422, condition: "Numeric input out of allowed range (negative capacity/companions, invalid coordinates)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state that permits the requested transition" }
  - { id: ERR_DUPLICATE_ACTIVE_APPLICATION, http: 409, condition: "Rider already has a non-terminal eligibility application" }
  - { id: ERR_RIDER_NOT_ELIGIBLE, http: 409, condition: "Rider eligibility_status is not FULL or CONDITIONAL when booking" }
  - { id: ERR_RIDER_SUSPENDED, http: 409, condition: "Rider account_status is SUSPENDED (active no-show suspension)" }
  - { id: ERR_ELIGIBILITY_EXPIRED, http: 409, condition: "Rider certification_expires_at is at or before the logical clock" }
  - { id: ERR_RUN_NOT_OPEN, http: 409, condition: "Target vehicle run is not in PLANNED or OPEN when accepting a trip" }
  - { id: ERR_STALE_RUN_VERSION, http: 412, condition: "expected_run_version does not match the run's current version (OCC)" }
  - { id: ERR_OUTSIDE_SERVICE_AREA, http: 422, condition: "Pickup or dropoff coordinates lie beyond the zone's ¾-mile service radius" }
  - { id: ERR_NO_WHEELCHAIR_CAPACITY, http: 409, condition: "No wheelchair position free for the trip's interval on the run" }
  - { id: ERR_NO_SEAT_CAPACITY, http: 409, condition: "No ambulatory seats free for the trip's interval on the run" }
  - { id: ERR_RIDER_TRIP_OVERLAP, http: 409, condition: "Rider already has a non-terminal trip whose buffered interval overlaps this one" }

# ============================================================================
# §1.7 RBAC Matrix
# ============================================================================
roles:
  - name: Rider
    description: "The paratransit customer; acts on their own trips, subscriptions, and appeals."
    identity: "entity_backed:Rider"
    exclusive_operations:
      - "POST /trip-reservations"
      - "POST /trip-reservations/{id}/counter"
      - "POST /trip-reservations/{id}/accept"
      - "POST /trip-reservations/{id}/cancel"
      - "POST /subscription-trips"
    shared_operations:
      - "POST /eligibility-applications/{id}/appeal (with EligibilitySpecialist)"
      - "GET reads on own rider/applications/assessments/trips/subscriptions/penalties"

  - name: Dispatcher
    description: "Schedules service: offers pickup windows, manages vehicle runs, instantiates standing trips, records no-shows."
    identity: opaque
    exclusive_operations:
      - "POST /trip-reservations/{id}/offer"
      - "POST /subscription-trips/{id}/instantiate"
      - "POST /vehicle-runs"
      - "POST /vehicle-runs/{id}/open"
      - "POST /vehicle-runs/{id}/dispatch"
    shared_operations:
      - "POST /trip-reservations/{id}/no-show (with Driver)"
      - "GET /reports/on-time-performance (with Admin)"

  - name: Driver
    description: "Executes trips: records pickups, dropoffs, and no-shows."
    identity: opaque
    exclusive_operations:
      - "POST /trip-reservations/{id}/pickup"
      - "POST /trip-reservations/{id}/dropoff"
    shared_operations:
      - "POST /trip-reservations/{id}/no-show (with Dispatcher)"

  - name: EligibilitySpecialist
    description: "Owns the certification lifecycle: riders, applications, assessments, certify/deny, penalty waivers."
    identity: opaque
    exclusive_operations:
      - "POST /eligibility-applications"
      - "POST /eligibility-applications/{id}/certify"
      - "POST /eligibility-applications/{id}/deny"
      - "POST /functional-assessments"
      - "POST /functional-assessments/{id}/complete"
      - "POST /penalty-events/{id}/waive"
    shared_operations:
      - "POST /riders (with Admin)"
      - "POST /eligibility-applications/{id}/appeal (with Rider)"

  - name: Admin
    description: "System operator: configuration (zones), logical clock, reporting."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /service-zones"
    shared_operations:
      - "POST /riders (with EligibilitySpecialist)"
      - "GET /reports/on-time-performance (with Dispatcher)"
