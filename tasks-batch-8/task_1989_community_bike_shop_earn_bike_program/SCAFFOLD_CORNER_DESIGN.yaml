            - { call: "POST /training-sessions/${s2}/enroll", payload: { volunteer_id: "${v}" }, as: ShopCoordinator, captures: { a2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: ShopCoordinator }
            - { call: "POST /training-sessions/${s1}/complete", payload: { marks: [ { attendance_id: "${a1}", outcome: "ATTENDED" } ] }, as: ShopCoordinator }
            - { call: "POST /training-sessions/${s2}/complete", payload: { marks: [ { attendance_id: "${a2}", outcome: "ATTENDED" } ] }, as: ShopCoordinator }
            - { call: "POST /volunteers/${v}/promote", as: ProgramDirector }
            - { call: "POST /bikes", payload: { donor_id: "${d_id}", serial_number: "SN-ST", bike_type: "ROAD", wheel_size_inches: 27 }, as: ShopCoordinator, captures: { bk: $.data.id } }
            - { call: "POST /bikes/${bk}/triage", payload: { condition_grade: "B", frame_damage: false }, as: ShopCoordinator }
            - { call: "POST /bikes/${bk}/route", payload: { destination: "REFURBISH", refurb_lead_volunteer_id: "${v}" }, as: ShopCoordinator }
            - { call: "POST /parts", payload: { name: "Cable", category: "BRAKES", unit_cost_cents: 100 }, as: ShopCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /parts/${pt}/restock", payload: { quantity: 2 }, as: ShopCoordinator, captures: { pt_v: $.data.version } }
          trigger:
            - { call: "POST /bikes/${bk}/usage-logs", payload: { part_id: "${pt}", quantity: 5, expected_part_version: "${pt_v}" }, as: Volunteer, as_user_id: "${v}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_STOCK"
            - "Part.${pt}.quantity_on_hand == 2 (unchanged; verify via GET)"

      - name: daily_hours_cap_aggregate_boundary
        claim_type: aggregate_validation
        grounds: ["validations[priority=9]", calculations.hours_accrual, "errors[ERR_DAILY_HOURS_EXCEEDED]"]
        distinguishing_aspect: "The daily cap is aggregate and inclusive at 6: 4h then 2h on the same work_date succeed (total exactly 6), but 4h then 3h is rejected (7 > 6) — individually valid logs fail collectively."
        test_recipe:
          setup: ["ADULT participant; clock 2026-08-07"]
          setup_api_calls:
            - { call: "POST /participants", payload: { full_name: "P DC", contact_email: "pdc@x.org", age_group: "ADULT" }, as: ShopCoordinator, captures: { pa: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: ShopCoordinator }
            - { call: "POST /participants/${pa}/hour-logs", payload: { work_date: "2026-08-02", hours: 4, activity_type: "SHOP_HELP" }, as: Participant, as_user_id: "${pa}", captures: { h1: $.data.id } }
          trigger:
            - { call: "POST /participants/${pa}/hour-logs", payload: { work_date: "2026-08-02", hours: 3, activity_type: "SHOP_HELP" }, as: Participant, as_user_id: "${pa}", captures: { err7: $.data.error_id } }
            - { call: "POST /participants/${pa}/hour-logs", payload: { work_date: "2026-08-02", hours: 2, activity_type: "OUTREACH" }, as: Participant, as_user_id: "${pa}", captures: { h2: $.data.id } }
            - { call: "POST /participants/${pa}/hour-logs", payload: { work_date: "2026-08-02", hours: 1, activity_type: "OUTREACH" }, as: Participant, as_user_id: "${pa}", captures: { err1: $.data.error_id } }
          assert:
            - "4h + 3h same day -> error_id ERR_DAILY_HOURS_EXCEEDED (would total 7)"
            - "4h + 2h succeeds (total exactly 6: cap is inclusive)"
            - "subsequent 1h -> error_id ERR_DAILY_HOURS_EXCEEDED (would total 7)"
            - "GET /hour-logs?participant_id shows exactly 2 rows (rejected logs never persist)"

      - name: work_date_window_enforced
        claim_type: temporal_validation
        grounds: ["validations[priority=9]", "errors[ERR_WORK_DATE_OUT_OF_WINDOW]", entities.HourLog.fields.work_date]
        distinguishing_aspect: "work_date before the enrollment date (2026-07-31 < 2026-08-01) and after the current clock date (2026-08-09 > 2026-08-07) are both rejected; a date inside the window succeeds."
        test_recipe:
          setup: ["participant enrolled at default clock 2026-08-01; clock advanced to 2026-08-07"]
          setup_api_calls:
            - { call: "POST /participants", payload: { full_name: "P WD", contact_email: "pwd@x.org", age_group: "ADULT" }, as: ShopCoordinator, captures: { pa: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: ShopCoordinator }
          trigger:
            - { call: "POST /participants/${pa}/hour-logs", payload: { work_date: "2026-07-31", hours: 2, activity_type: "SHOP_HELP" }, as: Participant, as_user_id: "${pa}", captures: { e_past: $.data.error_id } }
            - { call: "POST /participants/${pa}/hour-logs", payload: { work_date: "2026-08-09", hours: 2, activity_type: "SHOP_HELP" }, as: Participant, as_user_id: "${pa}", captures: { e_future: $.data.error_id } }
            - { call: "POST /participants/${pa}/hour-logs", payload: { work_date: "2026-08-06", hours: 2, activity_type: "SHOP_HELP" }, as: Participant, as_user_id: "${pa}", captures: { ok: $.data.id } }
          assert:
            - "work_date 2026-07-31 (before enrollment) -> ERR_WORK_DATE_OUT_OF_WINDOW"
            - "work_date 2026-08-09 (after clock 2026-08-07) -> ERR_WORK_DATE_OUT_OF_WINDOW"
            - "work_date 2026-08-06 succeeds (PENDING)"

      - name: reviewer_is_logger_segregation
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_REVIEWER_IS_LOGGER]"]
        distinguishing_aspect: "Segregation of duties on the hours ledger: the coordinator who logged hours on a participant's behalf cannot approve them (ERR_REVIEWER_IS_LOGGER), while a different coordinator user approves successfully."
        test_recipe:
          setup: ["ADULT participant; one PENDING 2h log created by ShopCoordinator user sc-1; clock 2026-08-07"]
          setup_api_calls:
            - { call: "POST /participants", payload: { full_name: "P SD", contact_email: "psd@x.org", age_group: "ADULT" }, as: ShopCoordinator, captures: { pa: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: ShopCoordinator }
            - { call: "POST /participants/${pa}/hour-logs", payload: { work_date: "2026-08-02", hours: 2, activity_type: "SHOP_HELP" }, as: ShopCoordinator, as_user_id: "sc-1", captures: { h1: $.data.id } }
            - { call: "GET /participants/${pa}", as: ShopCoordinator, captures: { v1: $.data.version } }
          trigger:
