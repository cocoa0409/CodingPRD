      - name: corrective_action_plan_with_the_pre_rejection_version_is_rejected_as_stale
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.ca-plan-submit-stale-nonconformance
          - validations.priority_7
          - errors.ERR_STALE_NONCONFORMANCE_VERSION
          - endpoints."POST /gfco/nonconformances/{nonconformanceId}/corrective-action-plan"
        distinguishing_aspect: |
          The applicant's resubmission answers the record as it stood at its FIRST submission,
          before the reviewer's rejection bumped the version and the revision counter. The
          record is in CA_REJECTED, which is a perfectly legal state for a plan, and the
          overdue window is wide open, so 412 is reachable only because of the version - and
          the successful first submission proves the same field with the then-current value
          worked, so the guard is per-version and not a blanket refusal.
        test_recipe:
          setup:
            - "One applicant and one MAJOR SANITATION nonconformance raised by rev-1 with source_type SURVEILLANCE_RUN; its ca_due_on is 2026-08-31 and its version at creation is captured."
            - "The applicant contact submits a plan with that version, which succeeds and returns a new version."
            - "Reviewer rev-2 rejects the plan, moving the record to CA_REJECTED with ca_revision_count 1 and a third version."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_id: $.data.id }
            - call: "POST /gfco/nonconformances"
              payload: { applicant_id: "${app_id}", source_type: "SURVEILLANCE_RUN", category: "SANITATION", severity: "MAJOR", description: "Swab log gap for the 2026-07 sanitation cycle" }
              as: CertificationReviewer
              as_user_id: "rev-1"
              captures: { nc_id: $.data.id, nc_v1: $.data.version }
            - call: "POST /gfco/nonconformances/${nc_id}/corrective-action-plan"
              payload: { expected_nonconformance_version: "${nc_v1}", ca_plan_text: "Reinstate the daily swab log" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { nc_v2: $.data.version, nc_status_2: $.data.status }
            - call: "POST /gfco/nonconformances/${nc_id}/corrective-action-decision"
              payload: { decision: "REJECT", ca_rejection_reason: "INSUFFICIENT_ROOT_CAUSE" }
              as: CertificationReviewer
              as_user_id: "rev-2"
              captures: { nc_v3: $.data.version, nc_status_3: $.data.status, nc_rev: $.data.ca_revision_count }
          trigger:
            - call: "POST /gfco/nonconformances/${nc_id}/corrective-action-plan"
              payload: { expected_nonconformance_version: "${nc_v2}", ca_plan_text: "Reinstate the daily swab log with a second-signature check" }
              as: ApplicantContact
              as_user_id: "${app_id}"
          assert:
            - "response.status == 412"
            - "response.error.code == \"ERR_STALE_NONCONFORMANCE_VERSION\""
            - "${nc_status_2} == \"CA_SUBMITTED\""
            - "${nc_status_3} == \"CA_REJECTED\""
            - "${nc_rev} == 1"
            - "${nc_v3} != ${nc_v2}"
            - "Nonconformance.${nc_id}.status == \"CA_REJECTED\""
            - "Nonconformance.${nc_id}.ca_revision_count == 1"
            - "Nonconformance.${nc_id}.ca_plan_text == \"Reinstate the daily swab log\""
            - "Nonconformance.${nc_id}.version == ${nc_v3}"
            - "Applicant.${app_id}.open_nc_penalty_points == 8"

