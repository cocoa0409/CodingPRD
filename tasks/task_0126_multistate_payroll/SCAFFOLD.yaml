# =============================================================================
# Multi-State Payroll & Tax Withholding — Scaffold v1
# Scenario: W-4 pre-fill, federal/state/local income tax, FICA/Medicare additional
# tax, overtime/double/retro pay tax forms, Garnishment orders, monthly employer
# remittance.
# =============================================================================

scenario: |
  Multi-State Payroll & Tax Withholding: W-4 pre-fill, federal/state/local
  income tax, FICA/Medicare additional tax, overtime/double/retro pay tax
  forms, Garnishment orders, monthly employer remittance.

domain_name: multistate-payroll
api_prefix: /payroll

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Pricing engine
  complexity_layers:
    - Dual-variant calculation
    - Rate / threshold triggers
    - Cascading side effects
    - Derived field reconciliation
    - Waterfall allocation
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Employee full name" }
      - { name: hire_date, type: string, source: input, description: "ISO date YYYY-MM-DD; defines first eligible pay period" }
      - { name: work_state, type: enum, source: input, constraints: "CA | NY | TX | IL | PA", description: "Primary work state controlling state income tax rules" }
      - { name: work_locality, type: enum, source: input, default: "NONE", constraints: "NYC | PHL | NONE", description: "City-level local tax jurisdiction; NONE = no local tax" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Base hourly rate in cents (non-negative integer)" }
      - { name: ytd_gross_wages_cents, type: integer, source: computed, default: 0, description: "Year-to-date gross wages in cents; advances only on Paycheck APPROVED" }
      - { name: ytd_social_security_wages_cents, type: integer, source: computed, default: 0, description: "Year-to-date wages subject to Social Security (capped at SS wage base); advances on APPROVED" }
      - { name: ytd_medicare_wages_cents, type: integer, source: computed, default: 0, description: "Year-to-date Medicare-taxable wages (uncapped); advances on APPROVED" }
      - { name: status, type: enum, source: system, default: "ACTIVE", constraints: "ACTIVE | TERMINATED", description: "ACTIVE → TERMINATED via POST .../terminate" }

  - name: W4Profile
    parent: Employee
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: system, description: "Owning employee id" }
      - { name: filing_status, type: enum, source: input, constraints: "SINGLE | MARRIED_JOINT | HEAD_OF_HOUSEHOLD", description: "W-4 federal filing status" }
      - { name: dependents_amount_cents, type: integer, source: input, default: 0, description: "Annual dependent credit from W-4 Step 3, in cents" }
      - { name: other_income_cents, type: integer, source: input, default: 0, description: "Annual other-income add-on from W-4 Step 4(a)" }
      - { name: additional_withholding_cents, type: integer, source: input, default: 0, description: "Per-paycheck extra federal withholding from W-4 Step 4(c)" }
      - { name: state_allowances, type: integer, source: input, default: 0, description: "State-level allowances (state W-4 equivalent)" }
      - { name: prefilled_from_prior_year, type: boolean, source: computed, default: false, description: "True iff the profile was created via W-4 pre-fill endpoint, copying prior-year filing_status + state_allowances" }
      - { name: effective_pay_period_id, type: string, source: system, description: "PayPeriod id at which this profile becomes the active W-4 for the employee; immutable after creation" }
    note: "Append-mostly history; the active W-4 for an employee at any pay period is the profile with the greatest effective_pay_period_id ordered by pay_date ascending whose pay_date <= the target period's pay_date; ties broken by W4Profile.created_at ascending."

  - name: PayPeriod
    parent: null
    common_fields: true
    fields:
      - { name: period_start, type: string, source: input, description: "ISO date; inclusive" }
      - { name: period_end, type: string, source: input, description: "ISO date; inclusive; must be >= period_start" }
      - { name: pay_date, type: string, source: input, description: "ISO date; YTD attribution year is derived from pay_date.year (not period_end)" }
      - { name: status, type: enum, source: system, default: "OPEN", constraints: "OPEN | LOCKED | CLOSED", description: "OPEN→LOCKED (no new items)→CLOSED (all paychecks PAID); cannot reopen" }
      - { name: paycheck_count, type: integer, source: computed, default: 0, description: "Count of Paychecks attached to this period, in any state" }

  - name: PayrollItem
    parent: PayPeriod
    common_fields: true
    fields:
      - { name: pay_period_id, type: string, source: system, description: "Owning pay period" }
      - { name: employee_id, type: string, source: input, description: "Subject employee" }
      - { name: regular_hours, type: number, source: input, default: 0, description: "Decimal hours; non-negative" }
      - { name: overtime_hours, type: number, source: input, default: 0, description: "Hours billed at 1.5x; non-negative" }
      - { name: double_hours, type: number, source: input, default: 0, description: "Hours billed at 2x; non-negative" }
      - { name: retro_adjustment_cents, type: integer, source: input, default: 0, description: "Lump-sum retro pay (positive) or clawback (negative) in cents; flagged for supplemental withholding" }
      - { name: locked, type: boolean, source: computed, default: false, description: "Becomes true once the Paycheck for this item reaches CALCULATED; further edits forbidden" }

  - name: Paycheck
    parent: PayPeriod
    common_fields: true
    fields:
      - { name: pay_period_id, type: string, source: system, description: "Owning pay period" }
      - { name: payroll_item_id, type: string, source: system, description: "Source item; one Paycheck per PayrollItem" }
      - { name: employee_id, type: string, source: system, description: "Snapshot of payroll item's employee_id" }
      - { name: w4_profile_id, type: string, source: system, description: "Snapshot of active W-4 profile id at calculate time" }
      - { name: gross_wages_cents, type: integer, source: computed, description: "Regular + OT + double + retro, in cents" }
      - { name: federal_withholding_cents, type: integer, source: computed, description: "Federal income tax withheld this paycheck (provisional algorithm at CALCULATED, may differ from finalized at APPROVED — see §1.3)" }
      - { name: state_withholding_cents, type: integer, source: computed, description: "State income tax withheld" }
      - { name: local_withholding_cents, type: integer, source: computed, description: "Local income tax withheld (0 when work_locality == NONE)" }
      - { name: social_security_cents, type: integer, source: computed, description: "Employee-side SS tax (6.2%) capped at SS_WAGE_BASE per year" }
      - { name: medicare_base_cents, type: integer, source: computed, description: "Employee-side Medicare 1.45%, uncapped" }
      - { name: medicare_additional_cents, type: integer, source: computed, description: "Additional 0.9% on YTD Medicare wages above $200,000 single-threshold per paycheck (employer must withhold regardless of filing status)" }
      - { name: garnishment_total_cents, type: integer, source: computed, default: 0, description: "Sum of allocations from this paycheck to active GarnishmentOrder rows; produced by waterfall allocator" }
      - { name: net_pay_cents, type: integer, source: computed, description: "gross_wages_cents - all withholdings - garnishment_total_cents" }
      - { name: is_retro_correction, type: boolean, source: computed, default: false, description: "True iff this paycheck was created via /paychecks/{id}/issue-correction (cycle re-entry)" }
      - { name: correction_of_paycheck_id, type: string, source: system, description: "When is_retro_correction is true, points to the corrected paycheck; else null" }
      - { name: status, type: enum, source: system, default: "DRAFT", constraints: "DRAFT | CALCULATED | APPROVED | PAID | VOIDED", description: "Lifecycle; see §1.2" }

  - name: GarnishmentOrder
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "Subject employee" }
      - { name: order_type, type: enum, source: input, constraints: "CHILD_SUPPORT | FEDERAL_TAX_LEVY | CREDITOR | STUDENT_LOAN", description: "Determines priority tier (see Garnishment Priority constants in §1.3)" }
      - { name: priority_rank, type: integer, source: computed, description: "Derived from order_type; lower wins. CHILD_SUPPORT=1, FEDERAL_TAX_LEVY=2, STUDENT_LOAN=3, CREDITOR=4" }
      - { name: total_owed_cents, type: integer, source: input, description: "Total balance to satisfy (immutable after creation)" }
      - { name: amount_collected_cents, type: integer, source: computed, default: 0, description: "Sum of allocations applied via APPROVED paychecks" }
      - { name: cap_pct_of_disposable, type: integer, source: input, description: "Per-pay-period cap as integer percent of disposable income; 1..100" }
      - { name: effective_pay_date, type: string, source: input, description: "ISO date; order applies to Paychecks whose PayPeriod.pay_date >= this date" }
      - { name: status, type: enum, source: system, default: "ACTIVE", constraints: "ACTIVE | SATISFIED | RELEASED", description: "ACTIVE → SATISFIED (when amount_collected_cents >= total_owed_cents) or RELEASED (manual release)" }

  - name: YTDLedgerEntry
    parent: Employee
    common_fields: false  # append-only
    fields:
      - { name: employee_id, type: string, source: system, description: "Subject employee" }
      - { name: paycheck_id, type: string, source: system, description: "Source paycheck (must be APPROVED at write time)" }
      - { name: tax_year, type: integer, source: system, description: "Year of source paycheck's PayPeriod.pay_date" }
      - { name: gross_wages_delta_cents, type: integer, source: system, description: "Signed delta added to Employee.ytd_gross_wages_cents (negative for VOIDED corrections)" }
      - { name: social_security_wages_delta_cents, type: integer, source: system, description: "Signed delta to ytd_social_security_wages_cents" }
      - { name: medicare_wages_delta_cents, type: integer, source: system, description: "Signed delta to ytd_medicare_wages_cents" }
      - { name: entry_kind, type: enum, source: system, constraints: "ACCRUAL | REVERSAL", description: "ACCRUAL = APPROVED paycheck; REVERSAL = paycheck VOIDED via correction" }
    note: "Append-only audit log. Tests rely on summing entries per (employee_id, tax_year) to verify Employee.ytd_* fields."

  - name: RemittancePeriod
    parent: null
    common_fields: true
    fields:
      - { name: tax_year, type: integer, source: input, description: "Tax year, e.g. 2024" }
      - { name: tax_month, type: integer, source: input, description: "1..12; remittance covers Paychecks with PayPeriod.pay_date in this calendar month" }
      - { name: total_federal_withholding_cents, type: integer, source: computed, default: 0, description: "Sum across included Paychecks at FINALIZE time" }
      - { name: total_state_withholding_cents, type: integer, source: computed, default: 0, description: "Per-state sum stored in state_breakdown; this field is the grand total" }
      - { name: total_local_withholding_cents, type: integer, source: computed, default: 0, description: "Grand total" }
      - { name: total_social_security_cents, type: integer, source: computed, default: 0, description: "Employer + employee SS to remit (employee portion only is stored; employer match is computed by formula §1.3)" }
      - { name: total_medicare_cents, type: integer, source: computed, default: 0, description: "Employer + employee Medicare base portion" }
      - { name: total_medicare_additional_cents, type: integer, source: computed, default: 0, description: "Additional Medicare withheld (employee-only; employer does NOT match)" }
      - { name: state_breakdown, type: array, source: computed, description: "Array of { state, amount_cents } summing to total_state_withholding_cents" }
      - { name: status, type: enum, source: system, default: "DRAFT", constraints: "DRAFT | FINALIZED | REMITTED | AMENDED", description: "Lifecycle; AMENDED reachable from REMITTED only via correction loop" }

  - name: TaxBracketTable
    parent: null
    common_fields: false  # immutable configuration
    fields:
      - { name: jurisdiction, type: enum, source: input, constraints: "FEDERAL | CA | NY | TX | IL | PA | NYC | PHL", description: "Bracket scope" }
      - { name: filing_status, type: enum, source: input, constraints: "SINGLE | MARRIED_JOINT | HEAD_OF_HOUSEHOLD | ANY", description: "ANY = bracket applies regardless of filing status (used by flat-rate locals and TX)" }
      - { name: tax_year, type: integer, source: input, description: "Year these brackets apply to" }
      - { name: brackets, type: array, source: input, description: "Ordered array of { lower_cents, upper_cents_or_null, rate_bps } where rate_bps is basis points; upper_cents_or_null=null = unbounded top bracket" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PayPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: POST /pay-periods/{periodId}/lock
        actor: PayrollSpecialist
        preconditions:
          - "At least one PayrollItem exists in the period (ERR_NO_PAYROLL_ITEMS)"
          - "All PayrollItems in the period have a corresponding Paycheck in CALCULATED or later (ERR_UNCALCULATED_ITEMS)"
        side_effects:
          - "No further PayrollItem creation; PayrollItem.locked=true was already set on calculate"

      - from: LOCKED
        to: CLOSED
        trigger: "system (automatic when every Paycheck in this period is in PAID or VOIDED)"
        actor: system
        preconditions:
          - "All paychecks in PAID or VOIDED"
        side_effects: []

  - entity: Paycheck
    initial_state: DRAFT
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: DRAFT
        to: CALCULATED
        trigger: POST /paychecks/{paycheckId}/calculate
        actor: PayrollSpecialist
        preconditions:
          - "Employee.status == ACTIVE OR Paycheck is for the employee's final settlement (period_end <= termination_date + 7 days) (ERR_TERMINATED_EMPLOYEE)"
          - "Active W4Profile exists for the employee at this PayPeriod (ERR_NO_W4)"
          - "Owning PayPeriod.status == OPEN"
        side_effects:
          - "Compute gross_wages_cents from PayrollItem hours and Employee.hourly_rate_cents"
          - "Snapshot w4_profile_id"
          - "Compute provisional federal/state/local withholdings via per-paycheck annualization (see §1.3 paycheck_withholding)"
          - "Compute social_security_cents, medicare_base_cents, medicare_additional_cents using YTD wages BEFORE this paycheck"
          - "Compute garnishment_total_cents via waterfall over ACTIVE GarnishmentOrders effective at PayPeriod.pay_date"
          - "Set net_pay_cents"
          - "PayrollItem.locked = true"

      - from: CALCULATED
        to: DRAFT
        trigger: POST /paychecks/{paycheckId}/recalculate
        actor: PayrollSpecialist
        preconditions:
          - "PayPeriod.status == OPEN"
        side_effects:
          - "PayrollItem.locked = false (allowing edits to hours/retro)"
          - "All computed fields cleared to null"

      - from: CALCULATED
        to: APPROVED
        trigger: POST /paychecks/{paycheckId}/approve
        actor: PayrollManager
        preconditions:
          - "Approver MUST NOT be the same X-User-ID that performed the most recent calculate (segregation of duties — ERR_SEGREGATION_OF_DUTIES)"
          - "PayPeriod.status == OPEN"
        side_effects:
          - "Append YTDLedgerEntry (entry_kind=ACCRUAL) with deltas equal to this paycheck's wage components"
          - "Recompute Employee.ytd_gross_wages_cents, ytd_social_security_wages_cents, ytd_medicare_wages_cents by summing ledger entries for (employee_id, tax_year)"
          - "Refresh active GarnishmentOrder.amount_collected_cents by adding this paycheck's per-order allocations; if any reaches total_owed_cents, transition that order to SATISFIED"

      - from: APPROVED
        to: PAID
        trigger: POST /paychecks/{paycheckId}/mark-paid
        actor: Treasurer
        preconditions:
          - "Treasurer X-User-ID MUST differ from the approver and the calculator (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "If every Paycheck in the PayPeriod is now PAID or VOIDED and PayPeriod.status == LOCKED, transition PayPeriod to CLOSED"

      - from: APPROVED
        to: VOIDED
        trigger: POST /paychecks/{paycheckId}/issue-correction
        actor: PayrollSpecialist
        preconditions:
          - "Source paycheck status == APPROVED (PAID may also issue corrections — see next transition)"
          - "No RemittancePeriod covering this paycheck has status REMITTED (REMITTED triggers AMENDED path instead — different transition, same trigger)"
        side_effects:
          - "Append YTDLedgerEntry (entry_kind=REVERSAL) with negated deltas of the source paycheck"
          - "Recompute Employee.ytd_* fields from ledger"
          - "Subtract source paycheck's per-order garnishment allocations from each GarnishmentOrder.amount_collected_cents; if any was SATISFIED and now collected < owed, transition back to ACTIVE"
          - "Create a NEW Paycheck (status=DRAFT, is_retro_correction=true, correction_of_paycheck_id=source.id) cloned from the source's payroll_item_id"

      - from: PAID
        to: VOIDED
        trigger: POST /paychecks/{paycheckId}/issue-correction
        actor: PayrollSpecialist
        preconditions:
          - "Owning RemittancePeriod status is DRAFT or FINALIZED (NOT REMITTED — see Remittance correction loop)"
        side_effects:
          - "Same as APPROVED→VOIDED (ledger reversal, garnishment refund, new DRAFT correction paycheck created)"
          - "PayPeriod re-evaluates: if it was CLOSED it remains CLOSED (paychecks already counted); the new correction paycheck attaches to a NEW PayPeriod selected at creation"

  - entity: RemittancePeriod
    initial_state: DRAFT
    terminal_states: []   # AMENDED can re-enter DRAFT via cycle; REMITTED is not terminal
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: POST /remittance-periods/{remitId}/finalize
        actor: PayrollManager
        preconditions:
          - "Every PayPeriod with pay_date in (tax_year, tax_month) has status CLOSED (ERR_OPEN_PAY_PERIODS_IN_MONTH)"
          - "No Paycheck in (tax_year, tax_month) is in DRAFT or CALCULATED (ERR_UNAPPROVED_PAYCHECKS_IN_MONTH)"
        side_effects:
          - "Aggregate withholdings from every APPROVED-or-PAID Paycheck with pay_date in (tax_year, tax_month); VOIDED paychecks contribute 0"
          - "Populate total_*_cents and state_breakdown"

      - from: FINALIZED
        to: DRAFT
        trigger: POST /remittance-periods/{remitId}/reopen
        actor: PayrollManager
        preconditions:
          - "No correction has been remitted (status was never REMITTED)"
        side_effects:
          - "Clear all total_* fields and state_breakdown"

      - from: FINALIZED
        to: REMITTED
        trigger: POST /remittance-periods/{remitId}/remit
        actor: Treasurer
        preconditions:
          - "Treasurer X-User-ID MUST differ from the finalizer (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []

      - from: REMITTED
        to: AMENDED
        trigger: POST /remittance-periods/{remitId}/amend
        actor: PayrollManager
        preconditions:
          - "At least one Paycheck in (tax_year, tax_month) is now VOIDED with a corresponding correction Paycheck APPROVED (ERR_NO_AMENDMENT_BASIS)"
        side_effects:
          - "Recompute total_*_cents and state_breakdown including correction paychecks; store new totals (no reversal entries)"

      - from: AMENDED
        to: REMITTED
        trigger: POST /remittance-periods/{remitId}/remit
        actor: Treasurer
        preconditions:
          - "Treasurer X-User-ID MUST differ from the original finalizer and the amender (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
        note: "AMENDED↔REMITTED is the cycle that lets a remittance be corrected multiple times after the books were closed."

  - entity: GarnishmentOrder
    initial_state: ACTIVE
    terminal_states: [SATISFIED, RELEASED]
    transitions:
      - from: ACTIVE
        to: SATISFIED
        trigger: "system (automatic during Paycheck APPROVE side effects)"
        actor: system
        preconditions:
          - "amount_collected_cents >= total_owed_cents after applying this paycheck's allocation"
        side_effects: []

      - from: SATISFIED
        to: ACTIVE
        trigger: "system (automatic during Paycheck issue-correction side effects)"
        actor: system
        preconditions:
          - "Reversal causes amount_collected_cents to drop below total_owed_cents"
        side_effects: []

      - from: ACTIVE
        to: RELEASED
        trigger: POST /garnishment-orders/{orderId}/release
        actor: PayrollManager
        preconditions:
          - "Order status == ACTIVE"
        side_effects: []

  - entity: Employee
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: POST /employees/{employeeId}/terminate
        actor: PayrollManager
        preconditions:
          - "No Paycheck in DRAFT or CALCULATED state for this employee (must be approved or void before termination) (ERR_PENDING_PAYCHECKS)"
        side_effects:
          - "Employee.status = TERMINATED"
          - "termination_date = today (server clock)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two payroll specialists concurrently call /calculate on the same Paycheck"
    guarantee: "At most one calculate succeeds; the second observes the resulting CALCULATED state and is rejected"
    error_id: ERR_PAYCHECK_NOT_DRAFT
    http_status: 409
    serialization: "First-writer-wins on Paycheck.status transition DRAFT→CALCULATED"

  - scenario: "Approve and recalculate fire simultaneously on the same CALCULATED Paycheck"
    guarantee: "Exactly one succeeds; loser sees the post-transition state and is rejected"
    error_id: ERR_PAYCHECK_NOT_CALCULATED
    http_status: 409
    serialization: "First-writer-wins on Paycheck.status"

  - scenario: "Two managers concurrently call /finalize on the same RemittancePeriod"
    guarantee: "Only one transitions DRAFT→FINALIZED; the other is rejected"
    error_id: ERR_REMITTANCE_NOT_DRAFT
    http_status: 409
    serialization: "First-writer-wins on RemittancePeriod.status"

  - scenario: "Two paychecks for the same employee in the same pay period created concurrently"
    guarantee: "At most one Paycheck exists per (pay_period_id, employee_id); second rejected"
    error_id: ERR_DUPLICATE_PAYCHECK_FOR_EMPLOYEE
    http_status: 409
    serialization: "Unique constraint on (pay_period_id, employee_id) for non-correction paychecks"

  - scenario: "Two RemittancePeriods created concurrently for the same (tax_year, tax_month)"
    guarantee: "At most one RemittancePeriod exists per (tax_year, tax_month); second rejected"
    error_id: ERR_DUPLICATE_REMITTANCE
    http_status: 409
    serialization: "Unique constraint on (tax_year, tax_month)"

  - scenario: "Two W-4 pre-fill calls for the same employee fire concurrently"
    guarantee: "At most one prefilled profile is created per employee+tax_year; second rejected"
    error_id: ERR_W4_PREFILL_ALREADY_DONE
    http_status: 409
    serialization: "Unique constraint on (employee_id, prefilled_from_prior_year=true, tax_year_of_effective_pay_period)"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: paycheck_withholding
    trigger: "Paycheck DRAFT→CALCULATED (POST /paychecks/{id}/calculate)"
    algorithm: forward_looking
    formula: |
      # Per-paycheck PROVISIONAL withholding using annualization (IRS Publication 15-T method).
      # Inputs: this paycheck's gross + active W-4 + YTD wages BEFORE this paycheck.
      gross = regular_hours*hourly_rate + 1.5*overtime_hours*hourly_rate
            + 2.0*double_hours*hourly_rate + retro_adjustment

      # Federal income tax:
      annualized = gross * PAY_PERIODS_PER_YEAR        # for biweekly = 26
      annualized += w4.other_income_cents              # Step 4(a)
      taxable_annual = max(0, annualized - STANDARD_DEDUCTION[w4.filing_status])
      annual_tax = piecewise_tier_apply(taxable_annual, FED_BRACKETS[w4.filing_status])
      annual_tax = max(0, annual_tax - w4.dependents_amount_cents)
      provisional_fed_wh = annual_tax / PAY_PERIODS_PER_YEAR + w4.additional_withholding_cents

      # State income tax — analogous, using STATE_BRACKETS[work_state][filing_status],
      # STATE_STANDARD_DEDUCTION, state_allowances (each allowance subtracts $4000 annualized).
      # work_state == TX produces 0.

      # Local — flat rate from TAX_BRACKETS[work_locality] applied to gross
      # (no annualization).
      local_wh = gross * LOCAL_FLAT_RATE_BPS[work_locality] / 10000  if work_locality != NONE else 0

      # Rounding: each of fed/state/local rounds_half_up to whole cents
      # AFTER all arithmetic but BEFORE summing into withholdings.
    input_set: "active W4Profile at PayPeriod.pay_date; current PayPeriod's PayrollItem; Employee.work_state and work_locality; current YTD wages BEFORE this paycheck"
    constants:
      PAY_PERIODS_PER_YEAR: 26
      STANDARD_DEDUCTION:
        SINGLE: 1390000          # $13,900 in cents (illustrative)
        MARRIED_JOINT: 2780000
        HEAD_OF_HOUSEHOLD: 2090000
      STATE_ALLOWANCE_VALUE_CENTS: 400000  # $4000 per allowance, annualized
      FED_BRACKETS:
        SINGLE: "[{lo:0, hi:1100000, rate_bps:1000}, {lo:1100000, hi:4475000, rate_bps:1200}, {lo:4475000, hi:9525000, rate_bps:2200}, {lo:9525000, hi:null, rate_bps:2400}]"
        MARRIED_JOINT: "[{lo:0, hi:2200000, rate_bps:1000}, {lo:2200000, hi:8950000, rate_bps:1200}, {lo:8950000, hi:19050000, rate_bps:2200}, {lo:19050000, hi:null, rate_bps:2400}]"
        HEAD_OF_HOUSEHOLD: "[{lo:0, hi:1575000, rate_bps:1000}, {lo:1575000, hi:6005000, rate_bps:1200}, {lo:6005000, hi:9525000, rate_bps:2200}, {lo:9525000, hi:null, rate_bps:2400}]"
      STATE_BRACKETS:
        CA_SINGLE: "[{lo:0, hi:1000000, rate_bps:200}, {lo:1000000, hi:5000000, rate_bps:400}, {lo:5000000, hi:null, rate_bps:600}]"
        NY_SINGLE: "[{lo:0, hi:1200000, rate_bps:400}, {lo:1200000, hi:8000000, rate_bps:600}, {lo:8000000, hi:null, rate_bps:700}]"
        IL_ANY: "[{lo:0, hi:null, rate_bps:495}]"
        PA_ANY: "[{lo:0, hi:null, rate_bps:307}]"
        TX_ANY: "[{lo:0, hi:null, rate_bps:0}]"
      LOCAL_FLAT_RATE_BPS:
        NYC: 380     # 3.80%
        PHL: 350     # 3.50%
        NONE: 0
    precision: "round_half_up to whole cents per tax type BEFORE summing"
    variants:
      - name: standard_aggregate_method
        when: "retro_adjustment == 0"
        difference: "retro pay rolled into gross and annualized along with the rest"
      - name: supplemental_flat_rate_for_retro
        when: "retro_adjustment != 0"
        difference: |
          Federal withholding on retro_adjustment uses SUPPLEMENTAL_FLAT_RATE
          (22%, IRS supplemental wage rate) applied directly to retro_adjustment
          (no annualization), then added to the standard withholding on the
          non-retro portion. State retro follows STATE_SUPPLEMENTAL_RATE table.
          This is the dual-variant trigger: same (hours, retro) inputs yield
          different fed withholding depending on whether retro_adjustment is zero.
    note: "PROVISIONAL because YTD reconciliation may correct cumulative under/over-withholding at next pay period."

  - name: ytd_reconciliation_withholding
    trigger: "Paycheck DRAFT→CALCULATED when Employee.ytd_gross_wages_cents > 0 AND the prior paycheck for this employee was VOIDED for the same tax_year"
    algorithm: chronological
    formula: |
      # YTD true-up: instead of annualizing this paycheck independently, compute
      # the cumulative tax expected on YTD-so-far including this paycheck, then
      # subtract the tax ALREADY withheld YTD (from ledger).
      cumulative_taxable = (Employee.ytd_gross_wages_cents + this_gross)
                          - (PRORATED_STANDARD_DEDUCTION_THROUGH_THIS_PERIOD[w4.filing_status])
      cumulative_expected_fed = piecewise_tier_apply(cumulative_taxable, FED_BRACKETS[fs])
      ytd_fed_withheld_already = sum(YTDLedgerEntry.gross_wages_delta-driven fed_wh for prior approvals)
      reconciled_fed_wh = cumulative_expected_fed - ytd_fed_withheld_already
      reconciled_fed_wh = max(0, reconciled_fed_wh)   # never refund via withholding
    input_set: "YTD ledger entries for this employee in this tax_year; current paycheck gross"
    constants:
      PRORATED_STANDARD_DEDUCTION_FACTOR: "(periods_elapsed + 1) / PAY_PERIODS_PER_YEAR"
    precision: "round_half_up to whole cents"
    note: |
      Dual-variant: paycheck_withholding (annualize each paycheck independently) and
      ytd_reconciliation_withholding (cumulative true-up) produce DIFFERENT federal
      withholding for identical hours when YTD history contains a voided paycheck.
      Per PRD policy: the system uses paycheck_withholding by default; switches to
      ytd_reconciliation_withholding for the FIRST CALCULATED paycheck after a
      retro correction VOIDED a prior paycheck in the same tax_year.

  - name: fica_social_security
    trigger: "Paycheck DRAFT→CALCULATED"
    algorithm: threshold
    formula: |
      # Social Security capped annually at SS_WAGE_BASE.
      ytd_ss_before = Employee.ytd_social_security_wages_cents  # YTD BEFORE this paycheck
      remaining_room = max(0, SS_WAGE_BASE - ytd_ss_before)
      taxable_ss = min(gross, remaining_room)
      social_security_cents = round_half_up(taxable_ss * SS_RATE_BPS / 10000)
      # Boundary: if ytd_ss_before == SS_WAGE_BASE exactly → taxable_ss = 0 → social_security_cents = 0.
      # If ytd_ss_before == SS_WAGE_BASE - 1 cent → taxable_ss = min(gross, 1) → still subject.
    constants:
      SS_WAGE_BASE: 16830000   # $168,300 in cents (illustrative)
      SS_RATE_BPS: 620         # 6.2%
    precision: "round_half_up to whole cents"

  - name: medicare_additional_threshold
    trigger: "Paycheck DRAFT→CALCULATED"
    algorithm: threshold
    formula: |
      # Standard Medicare:
      medicare_base_cents = round_half_up(gross * MEDICARE_BASE_RATE_BPS / 10000)

      # Additional Medicare (employer-side withholding rule):
      # The employer must withhold an additional 0.9% on the PORTION of
      # YTD Medicare wages that exceeds ADDITIONAL_THRESHOLD, regardless of filing status.
      ytd_med_before = Employee.ytd_medicare_wages_cents
      ytd_med_after = ytd_med_before + gross
      if ytd_med_after <= ADDITIONAL_THRESHOLD:
        medicare_additional_cents = 0
      elif ytd_med_before >= ADDITIONAL_THRESHOLD:
        excess = gross
        medicare_additional_cents = round_half_up(excess * ADDITIONAL_RATE_BPS / 10000)
      else:
        # crossing the threshold within this paycheck
        excess = ytd_med_after - ADDITIONAL_THRESHOLD
        medicare_additional_cents = round_half_up(excess * ADDITIONAL_RATE_BPS / 10000)
    constants:
      MEDICARE_BASE_RATE_BPS: 145    # 1.45%
      ADDITIONAL_THRESHOLD: 20000000 # $200,000 cents
      ADDITIONAL_RATE_BPS: 90        # 0.9%
    precision: "round_half_up to whole cents, applied to (excess, gross, or 0) BEFORE summing into total withholding"
    note: |
      Boundary on >= vs >: ytd_med_before >= ADDITIONAL_THRESHOLD means crossing has
      already happened — full gross is subject. ytd_med_after <= ADDITIONAL_THRESHOLD
      means we have NOT YET crossed — zero. The mid-case computes the post-threshold
      portion only.

  - name: garnishment_waterfall_allocation
    trigger: "Paycheck DRAFT→CALCULATED (after withholdings computed)"
    algorithm: waterfall_allocation
    formula: |
      # 1. Compute disposable income:
      disposable = gross - federal_withholding_cents - state_withholding_cents
                       - local_withholding_cents - social_security_cents
                       - medicare_base_cents - medicare_additional_cents

      # 2. Enumerate ACTIVE GarnishmentOrders for this employee whose effective_pay_date
      #    <= PayPeriod.pay_date.
      # 3. Sort by priority_rank ascending; tie-break by order.created_at ascending,
      #    then by order.id ascending (stable across re-runs).
      # 4. Compute global cap (CCPA):
      ccpa_cap = disposable * CCPA_BASE_PCT / 100   # 25%
      if any active CHILD_SUPPORT order exists:
        ccpa_cap = disposable * CCPA_CHILD_SUPPORT_PCT / 100   # 50%
      # round_half_up to whole cents AFTER the multiplication, BEFORE waterfall.

      remaining_pool = ccpa_cap
      for order in sorted_orders:
        per_order_cap = round_half_up(disposable * order.cap_pct_of_disposable / 100)
        remaining_owed = order.total_owed_cents - order.amount_collected_cents
        allocation = min(per_order_cap, remaining_owed, remaining_pool)
        record allocation against order
        remaining_pool -= allocation
        if remaining_pool == 0: break

      garnishment_total_cents = sum(allocations)
    input_set: "GarnishmentOrders with status=ACTIVE and effective_pay_date <= PayPeriod.pay_date; sorted ascending by priority_rank, created_at, id"
    constants:
      CCPA_BASE_PCT: 25
      CCPA_CHILD_SUPPORT_PCT: 50
    precision: "round_half_up at every multiplication; allocations are whole cents"
    note: |
      Order of operations is pinned: (a) per-order cap rounded first, (b) waterfall
      sums whole-cent allocations, (c) no re-distribution if a later order would have
      fit because an earlier order was capped. Tie-break is stable.

  - name: remittance_aggregation
    trigger: "RemittancePeriod DRAFT→FINALIZED (POST /remittance-periods/{id}/finalize)"
    algorithm: aggregation
    formula: |
      # Source: every Paycheck p such that
      #   p.status IN {APPROVED, PAID}
      #   AND p.pay_period.pay_date.year == remit.tax_year
      #   AND p.pay_period.pay_date.month == remit.tax_month
      #   AND (p is not VOIDED)
      # Output: per-field SUM of round-already-applied per-paycheck values.

      total_federal_withholding_cents = sum(p.federal_withholding_cents)
      total_state_withholding_cents = sum(p.state_withholding_cents)
      total_local_withholding_cents = sum(p.local_withholding_cents)
      total_social_security_cents = sum(p.social_security_cents) * 2   # employer matches
      total_medicare_cents = sum(p.medicare_base_cents) * 2             # employer matches BASE only
      total_medicare_additional_cents = sum(p.medicare_additional_cents) # employer does NOT match

      state_breakdown = group_by(employee.work_state) sum(p.state_withholding_cents)
    input_set: "All non-VOIDED Paychecks in the calendar month, grouped by employee.work_state for state breakdown"
    precision: "Inputs already rounded; outputs are pure integer sums"
    note: |
      Employer match rule is a frequent source of bugs: SS matches 1:1, Medicare BASE
      matches 1:1, but Additional Medicare 0.9% has NO employer match. The formula
      pins this so test cases on remittance totals can distinguish correct from naive
      implementations.

  - name: garnishment_amount_collected_recompute
    trigger: "Paycheck APPROVED transition; Paycheck VOIDED transition (issue-correction)"
    algorithm: aggregation
    formula: |
      For each ACTIVE-or-SATISFIED GarnishmentOrder o:
        o.amount_collected_cents = sum over APPROVED-or-PAID Paychecks p of:
          p.allocations[o.id]
        - sum over VOIDED Paychecks p_void of:
          p_void.allocations[o.id]
      # After recompute, if o.amount_collected_cents >= o.total_owed_cents AND status==ACTIVE → SATISFIED
      # If o.amount_collected_cents < o.total_owed_cents AND status==SATISFIED → ACTIVE
    input_set: "All Paychecks for this employee in APPROVED, PAID, or VOIDED state"
    precision: "Integer arithmetic only"

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resources exist, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all nested

  - priority: 4
    category: state
    check: "Owning PayPeriod must be OPEN for /payroll-items and /paychecks/calculate"
    error_id: ERR_PAY_PERIOD_NOT_OPEN
    http_status: 409
    applies_to: "POST /pay-periods/{id}/payroll-items, POST /paychecks/{id}/calculate, POST /paychecks/{id}/recalculate"

  - priority: 5
    category: state
    check: "Paycheck must be in the expected pre-state for the requested transition"
    error_id: "ERR_PAYCHECK_NOT_{STATE} (e.g., ERR_PAYCHECK_NOT_DRAFT, ERR_PAYCHECK_NOT_CALCULATED, ERR_PAYCHECK_NOT_APPROVED)"
    http_status: 409
    applies_to: "all paycheck transition endpoints"

  - priority: 6
    category: state
    check: "RemittancePeriod must be in the expected pre-state (DRAFT for finalize, FINALIZED for remit, REMITTED for amend)"
    error_id: "ERR_REMITTANCE_NOT_{STATE}"
    http_status: 409
    applies_to: "all remittance transition endpoints"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: actor on /approve must differ from actor on most-recent /calculate of the same Paycheck"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /paychecks/{id}/approve, POST /paychecks/{id}/mark-paid, POST /remittance-periods/{id}/remit"
    note: "Highest-priority compliance check; runs BEFORE business_referential because an SOD violation cannot be cured by data fixes."

  - priority: 8
    category: business_referential
    check: "Paycheck must have an active W4Profile resolvable for its PayPeriod (no profile with effective_pay_period.pay_date <= target.pay_date)"
    error_id: ERR_NO_W4
    http_status: 409
    applies_to: "POST /paychecks/{id}/calculate"

  - priority: 9
    category: business_referential
    check: "Garnishment cap_pct_of_disposable must be 1..100 inclusive"
    error_id: ERR_INVALID_GARNISHMENT_CAP
    http_status: 400
    applies_to: "POST /garnishment-orders"

  - priority: 10
    category: business_temporal
    check: "PayPeriod.period_end >= period_start; pay_date >= period_end"
    error_id: ERR_INVALID_PAY_PERIOD_DATES
    http_status: 400
    applies_to: "POST /pay-periods"

  - priority: 11
    category: business_temporal
    check: "RemittancePeriod (tax_year, tax_month) must not overlap with another RemittancePeriod"
    error_id: ERR_DUPLICATE_REMITTANCE
    http_status: 409
    applies_to: "POST /remittance-periods"

  - priority: 12
    category: business_constraint
    check: "PayrollItem hours non-negative; (regular_hours + overtime_hours + double_hours) <= MAX_HOURS_PER_PERIOD (default 240)"
    error_id: ERR_INVALID_HOURS
    http_status: 400
    applies_to: "POST /pay-periods/{id}/payroll-items, PUT /payroll-items/{id}"
    note: "ERR_INVALID_HOURS is checked BEFORE the no-overlap rule below because malformed hours short-circuit recomputation."

  - priority: 13
    category: business_constraint
    check: "At most one non-correction Paycheck per (pay_period_id, employee_id)"
    error_id: ERR_DUPLICATE_PAYCHECK_FOR_EMPLOYEE
    http_status: 409
    applies_to: "POST /pay-periods/{id}/payroll-items (which creates the implicit Paycheck)"

  - priority: 14
    category: business_fiscal
    check: "RemittancePeriod /finalize requires every Paycheck in (year, month) to be APPROVED, PAID, or VOIDED"
    error_id: ERR_UNAPPROVED_PAYCHECKS_IN_MONTH
    http_status: 409
    applies_to: "POST /remittance-periods/{id}/finalize"

  - priority: 15
    category: business_fiscal
    check: "Paycheck approve requires net_pay_cents >= 0 (gross net of all withholdings + garnishments must not be negative)"
    error_id: ERR_NEGATIVE_NET_PAY
    http_status: 402
    applies_to: "POST /paychecks/{id}/approve"

  - priority: 16
    category: business_fiscal
    check: "PayPeriod /lock requires at least one PayrollItem and all items have Paychecks in CALCULATED or later"
    error_id: ERR_UNCALCULATED_ITEMS
    http_status: 409
    applies_to: "POST /pay-periods/{id}/lock"

  - priority: 17
    category: business_constraint
    check: "OCC version match if version supplied"
    error_id: ERR_STALE_DATA
    http_status: 409
    applies_to: "all mutation endpoints with version? in body"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Employee ---
  - { method: POST, path: "/employees", description: "Create employee", roles: [PayrollSpecialist, PayrollManager], code: 201, input: [full_name, hire_date, work_state, "work_locality?", hourly_rate_cents], output: Employee, side_effects: ["YTD counters initialized to 0; status=ACTIVE"] }
  - { method: GET, path: "/employees", description: "List employees with optional filter", roles: [Any], code: 200, input: ["limit?, offset?, status?"], output: "Employee[]", side_effects: [] }
  - { method: GET, path: "/employees/{employeeId}", description: "Get employee", roles: [Any], code: 200, input: [], output: Employee, side_effects: [] }
  - { method: POST, path: "/employees/{employeeId}/terminate", description: "Terminate employee", roles: [PayrollManager], code: 200, input: ["version?"], output: Employee, side_effects: ["status → TERMINATED; termination_date set"] }

  # --- W-4 Profile (with pre-fill) ---
  - { method: POST, path: "/employees/{employeeId}/w4-profiles", description: "Create a new W-4 profile effective at given pay period", roles: [PayrollSpecialist], code: 201, input: [filing_status, "dependents_amount_cents?", "other_income_cents?", "additional_withholding_cents?", "state_allowances?", effective_pay_period_id], output: W4Profile, side_effects: ["W4Profile.prefilled_from_prior_year=false"] }
  - { method: POST, path: "/employees/{employeeId}/w4-profiles/prefill", description: "Pre-fill a new W-4 profile by copying filing_status and state_allowances from this employee's most recent prior-year W4Profile; client supplies only effective_pay_period_id", roles: [PayrollSpecialist], code: 201, input: [effective_pay_period_id], output: W4Profile, side_effects: ["Copies filing_status, state_allowances, dependents_amount_cents, other_income_cents from the W4Profile whose effective_pay_period.pay_date is the latest in the prior tax_year (ERR_NO_PRIOR_YEAR_W4 if none); additional_withholding_cents=0; prefilled_from_prior_year=true"] }
  - { method: GET, path: "/employees/{employeeId}/w4-profiles", description: "List employee's W-4 profiles", roles: [Any], code: 200, input: ["limit?, offset?"], output: "W4Profile[]", side_effects: [] }

  # --- Garnishment Orders ---
  - { method: POST, path: "/garnishment-orders", description: "Create court-ordered garnishment", roles: [PayrollManager], code: 201, input: [employee_id, order_type, total_owed_cents, cap_pct_of_disposable, effective_pay_date], output: GarnishmentOrder, side_effects: ["priority_rank derived from order_type"] }
  - { method: GET, path: "/garnishment-orders", description: "List garnishment orders, filterable by employee_id and status", roles: [Any], code: 200, input: ["limit?, offset?, employee_id?, status?"], output: "GarnishmentOrder[]", side_effects: [] }
  - { method: GET, path: "/garnishment-orders/{orderId}", description: "Get garnishment order", roles: [Any], code: 200, input: [], output: GarnishmentOrder, side_effects: [] }
  - { method: POST, path: "/garnishment-orders/{orderId}/release", description: "Release garnishment order (status → RELEASED)", roles: [PayrollManager], code: 200, input: ["version?"], output: GarnishmentOrder, side_effects: ["status → RELEASED"] }

  # --- Pay Period ---
  - { method: POST, path: "/pay-periods", description: "Create pay period", roles: [PayrollSpecialist], code: 201, input: [period_start, period_end, pay_date], output: PayPeriod, side_effects: [] }
  - { method: GET, path: "/pay-periods", description: "List pay periods", roles: [Any], code: 200, input: ["limit?, offset?, status?"], output: "PayPeriod[]", side_effects: [] }
  - { method: GET, path: "/pay-periods/{periodId}", description: "Get pay period", roles: [Any], code: 200, input: [], output: PayPeriod, side_effects: [] }
  - { method: POST, path: "/pay-periods/{periodId}/lock", description: "Lock period (no further items)", roles: [PayrollSpecialist], code: 200, input: ["version?"], output: PayPeriod, side_effects: ["status → LOCKED"] }

  # --- Payroll Item (creates implicit Paycheck) ---
  - { method: POST, path: "/pay-periods/{periodId}/payroll-items", description: "Create payroll item; also creates the linked DRAFT Paycheck", roles: [PayrollSpecialist], code: 201, input: [employee_id, "regular_hours?", "overtime_hours?", "double_hours?", "retro_adjustment_cents?"], output: PayrollItem, side_effects: ["Implicit Paycheck created in DRAFT state; paycheck_count++"] }
  - { method: PUT, path: "/payroll-items/{itemId}", description: "Update payroll item hours/retro (only while linked Paycheck is DRAFT)", roles: [PayrollSpecialist], code: 200, input: ["regular_hours?", "overtime_hours?", "double_hours?", "retro_adjustment_cents?", "version?"], output: PayrollItem, side_effects: [] }

  # --- Paycheck ---
  - { method: GET, path: "/paychecks", description: "List paychecks; filter by pay_period_id, employee_id, status", roles: [Any], code: 200, input: ["limit?, offset?, pay_period_id?, employee_id?, status?"], output: "Paycheck[]", side_effects: [] }
  - { method: GET, path: "/paychecks/{paycheckId}", description: "Get paycheck", roles: [Any], code: 200, input: [], output: Paycheck, side_effects: [] }
  - { method: POST, path: "/paychecks/{paycheckId}/calculate", description: "Compute all withholdings and garnishments", roles: [PayrollSpecialist], code: 200, input: ["version?"], output: Paycheck, side_effects: ["DRAFT → CALCULATED; runs paycheck_withholding (or ytd_reconciliation_withholding when applicable), fica_social_security, medicare_additional_threshold, garnishment_waterfall_allocation"] }
  - { method: POST, path: "/paychecks/{paycheckId}/recalculate", description: "Revert to DRAFT to allow edits", roles: [PayrollSpecialist], code: 200, input: ["version?"], output: Paycheck, side_effects: ["CALCULATED → DRAFT; clears computed fields"] }
  - { method: POST, path: "/paychecks/{paycheckId}/approve", description: "Approve paycheck", roles: [PayrollManager], code: 200, input: ["version?"], output: Paycheck, side_effects: ["CALCULATED → APPROVED; appends YTDLedgerEntry; refreshes Employee.ytd_*; refreshes GarnishmentOrder.amount_collected_cents; SOD check vs calculator"] }
  - { method: POST, path: "/paychecks/{paycheckId}/mark-paid", description: "Mark paycheck PAID after disbursement", roles: [Treasurer], code: 200, input: ["version?"], output: Paycheck, side_effects: ["APPROVED → PAID; auto-CLOSE owning PayPeriod if all paychecks terminal and period was LOCKED; SOD vs approver"] }
  - { method: POST, path: "/paychecks/{paycheckId}/issue-correction", description: "Void this paycheck and create a new DRAFT correction paycheck", roles: [PayrollSpecialist], code: 200, input: [target_pay_period_id, "version?"], output: Paycheck, side_effects: ["Source: APPROVED|PAID → VOIDED; appends YTDLedgerEntry(REVERSAL); subtracts garnishment allocations; new DRAFT Paycheck (is_retro_correction=true, correction_of_paycheck_id=source.id) attached to target_pay_period_id"] }

  # --- Remittance ---
  - { method: POST, path: "/remittance-periods", description: "Create remittance for (tax_year, tax_month)", roles: [PayrollSpecialist, PayrollManager], code: 201, input: [tax_year, tax_month], output: RemittancePeriod, side_effects: ["status=DRAFT; totals=0"] }
  - { method: GET, path: "/remittance-periods", description: "List remittance periods", roles: [Any], code: 200, input: ["limit?, offset?, tax_year?, status?"], output: "RemittancePeriod[]", side_effects: [] }
  - { method: GET, path: "/remittance-periods/{remitId}", description: "Get remittance period", roles: [Any], code: 200, input: [], output: RemittancePeriod, side_effects: [] }
  - { method: POST, path: "/remittance-periods/{remitId}/finalize", description: "Compute all totals and lock", roles: [PayrollManager], code: 200, input: ["version?"], output: RemittancePeriod, side_effects: ["DRAFT → FINALIZED; runs remittance_aggregation"] }
  - { method: POST, path: "/remittance-periods/{remitId}/reopen", description: "Reopen finalized remittance back to DRAFT", roles: [PayrollManager], code: 200, input: ["version?"], output: RemittancePeriod, side_effects: ["FINALIZED → DRAFT; clears totals"] }
  - { method: POST, path: "/remittance-periods/{remitId}/remit", description: "Transmit remittance to tax authorities", roles: [Treasurer], code: 200, input: ["version?"], output: RemittancePeriod, side_effects: ["FINALIZED or AMENDED → REMITTED; SOD vs finalizer/amender"] }
  - { method: POST, path: "/remittance-periods/{remitId}/amend", description: "Amend REMITTED remittance after a paycheck correction landed in the same month", roles: [PayrollManager], code: 200, input: ["version?"], output: RemittancePeriod, side_effects: ["REMITTED → AMENDED; re-runs remittance_aggregation"] }

  # --- Tax bracket configuration (read-only after seed) ---
  - { method: POST, path: "/tax-bracket-tables", description: "Seed a bracket table (admin bootstrap)", roles: [PayrollManager], code: 201, input: [jurisdiction, filing_status, tax_year, brackets], output: TaxBracketTable, side_effects: [] }
  - { method: GET, path: "/tax-bracket-tables", description: "List bracket tables", roles: [Any], code: 200, input: ["limit?, offset?, jurisdiction?, tax_year?"], output: "TaxBracketTable[]", side_effects: [] }

  # --- Test-driving endpoints ---
  - { method: POST, path: "/_clock/advance", description: "Test-only: advance server clock to ISO datetime", roles: [PayrollManager], code: 200, input: [to_iso], output: null, side_effects: ["Server clock advanced; used for termination_date and any 'today' resolution"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing/unrecognized" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for endpoint" }

  # --- existence ---
  - { id: ERR_EMPLOYEE_NOT_FOUND, http: 404, condition: "employeeId does not exist" }
  - { id: ERR_W4_PROFILE_NOT_FOUND, http: 404, condition: "W4Profile id missing" }
  - { id: ERR_PAY_PERIOD_NOT_FOUND, http: 404, condition: "PayPeriod id missing" }
  - { id: ERR_PAYROLL_ITEM_NOT_FOUND, http: 404, condition: "PayrollItem id missing" }
  - { id: ERR_PAYCHECK_NOT_FOUND, http: 404, condition: "Paycheck id missing" }
  - { id: ERR_GARNISHMENT_ORDER_NOT_FOUND, http: 404, condition: "GarnishmentOrder id missing" }
  - { id: ERR_REMITTANCE_NOT_FOUND, http: 404, condition: "RemittancePeriod id missing" }
  - { id: ERR_TAX_BRACKET_NOT_FOUND, http: 404, condition: "No TaxBracketTable for (jurisdiction, filing_status, tax_year) lookup" }

  # --- state ---
  - { id: ERR_PAY_PERIOD_NOT_OPEN, http: 409, condition: "Operation requires PayPeriod.status==OPEN" }
  - { id: ERR_PAY_PERIOD_NOT_LOCKABLE, http: 409, condition: "Lock requested but already LOCKED/CLOSED" }
  - { id: ERR_PAYCHECK_NOT_DRAFT, http: 409, condition: "Operation requires Paycheck.status==DRAFT" }
  - { id: ERR_PAYCHECK_NOT_CALCULATED, http: 409, condition: "Operation requires Paycheck.status==CALCULATED" }
  - { id: ERR_PAYCHECK_NOT_APPROVED, http: 409, condition: "mark-paid requires Paycheck.status==APPROVED" }
  - { id: ERR_PAYCHECK_NOT_CORRECTABLE, http: 409, condition: "issue-correction requires Paycheck.status in {APPROVED, PAID}" }
  - { id: ERR_REMITTANCE_NOT_DRAFT, http: 409, condition: "finalize requires RemittancePeriod.status==DRAFT" }
  - { id: ERR_REMITTANCE_NOT_FINALIZED, http: 409, condition: "remit/reopen requires RemittancePeriod.status==FINALIZED" }
  - { id: ERR_REMITTANCE_NOT_REMITTED, http: 409, condition: "amend requires RemittancePeriod.status==REMITTED" }
  - { id: ERR_GARNISHMENT_NOT_ACTIVE, http: 409, condition: "Release requires GarnishmentOrder.status==ACTIVE" }

  # --- business_safety ---
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Actor is the same X-User-ID that performed the immediately preceding step requiring SOD separation" }

  # --- business_referential ---
  - { id: ERR_NO_W4, http: 409, condition: "No active W4Profile for the employee at the target PayPeriod's pay_date" }
  - { id: ERR_NO_PRIOR_YEAR_W4, http: 409, condition: "Pre-fill requested but no prior-year W4Profile exists for this employee" }
  - { id: ERR_TERMINATED_EMPLOYEE, http: 409, condition: "Cannot create or calculate a Paycheck for a TERMINATED employee outside final-settlement window" }
  - { id: ERR_PENDING_PAYCHECKS, http: 409, condition: "Cannot terminate employee with DRAFT or CALCULATED paychecks" }

  # --- business_temporal ---
  - { id: ERR_INVALID_PAY_PERIOD_DATES, http: 400, condition: "period_end < period_start, or pay_date < period_end" }

  # --- business_constraint ---
  - { id: ERR_INVALID_HOURS, http: 400, condition: "Negative hours or sum > MAX_HOURS_PER_PERIOD" }
  - { id: ERR_INVALID_GARNISHMENT_CAP, http: 400, condition: "cap_pct_of_disposable not in [1, 100]" }
  - { id: ERR_DUPLICATE_PAYCHECK_FOR_EMPLOYEE, http: 409, condition: "(pay_period_id, employee_id) already has a non-correction Paycheck" }
  - { id: ERR_DUPLICATE_REMITTANCE, http: 409, condition: "(tax_year, tax_month) already has a RemittancePeriod" }
  - { id: ERR_W4_PREFILL_ALREADY_DONE, http: 409, condition: "An (employee_id, prefilled_from_prior_year=true) profile already exists targeting the same tax_year" }
  - { id: ERR_NO_PAYROLL_ITEMS, http: 409, condition: "Lock requested but no items in period" }
  - { id: ERR_UNCALCULATED_ITEMS, http: 409, condition: "Lock requested but at least one paycheck is in DRAFT" }
  - { id: ERR_OPEN_PAY_PERIODS_IN_MONTH, http: 409, condition: "Remittance finalize requires all monthly PayPeriods in CLOSED status" }
  - { id: ERR_UNAPPROVED_PAYCHECKS_IN_MONTH, http: 409, condition: "Remittance finalize requires all monthly paychecks in APPROVED, PAID, or VOIDED status" }
  - { id: ERR_NO_AMENDMENT_BASIS, http: 409, condition: "Amend invoked but no correction paychecks landed in this remittance month since REMITTED" }

  # --- business_fiscal ---
  - { id: ERR_NEGATIVE_NET_PAY, http: 402, condition: "Paycheck approve would result in net_pay_cents < 0" }

  # --- concurrency ---
  - { id: ERR_STALE_DATA, http: 409, condition: "OCC: version mismatch" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, wrong type" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PayrollSpecialist
    description: "Day-to-day data entry: employees, W-4 profiles, pay periods, payroll items, paycheck calculation, retro corrections"
    identity: "opaque"
    exclusive_operations:
      - "POST /employees — Create employee (shared with PayrollManager)"
      - "POST /employees/{id}/w4-profiles — Create W-4"
      - "POST /employees/{id}/w4-profiles/prefill — Pre-fill W-4"
      - "POST /pay-periods — Create pay period"
      - "POST /pay-periods/{id}/lock — Lock pay period"
      - "POST /pay-periods/{id}/payroll-items — Add payroll item (implicit Paycheck)"
      - "PUT /payroll-items/{id} — Edit hours/retro"
      - "POST /paychecks/{id}/calculate — Compute withholdings"
      - "POST /paychecks/{id}/recalculate — Revert to DRAFT"
      - "POST /paychecks/{id}/issue-correction — Void + new draft"
      - "POST /remittance-periods — Create remittance (shared with PayrollManager)"

  - name: PayrollManager
    description: "Approvals, terminations, garnishment management, remittance finalize/amend; cannot approve own calculate"
    identity: "opaque"
    exclusive_operations:
      - "POST /employees/{id}/terminate — Terminate employee"
      - "POST /garnishment-orders — Create garnishment"
      - "POST /garnishment-orders/{id}/release — Release garnishment"
      - "POST /paychecks/{id}/approve — Approve paycheck (SOD: must NOT equal calculator's X-User-ID)"
      - "POST /remittance-periods/{id}/finalize — Finalize remittance"
      - "POST /remittance-periods/{id}/reopen — Reopen finalized remittance"
      - "POST /remittance-periods/{id}/amend — Amend remitted remittance (SOD: must NOT equal the user who last finalized this remittance)"
      - "POST /tax-bracket-tables — Seed bracket configuration"
      - "POST /_clock/advance — Advance test clock"

  - name: Treasurer
    description: "Disbursement only; cannot approve or amend"
    identity: "opaque"
    exclusive_operations:
      - "POST /paychecks/{id}/mark-paid — Disburse (SOD: must NOT equal calculator or approver of the same paycheck)"
      - "POST /remittance-periods/{id}/remit — Remit to authority (SOD: must NOT equal finalizer or amender)"

  - name: Any
    description: "Read-only operations available to any authenticated user with one of the above three roles"
    identity: "opaque"
    shared_operations:
      - "GET /employees"
      - "GET /employees/{id}"
      - "GET /employees/{id}/w4-profiles"
      - "GET /pay-periods"
      - "GET /pay-periods/{id}"
      - "GET /paychecks"
      - "GET /paychecks/{id}"
      - "GET /garnishment-orders"
      - "GET /garnishment-orders/{id}"
      - "GET /remittance-periods"
      - "GET /remittance-periods/{id}"
      - "GET /tax-bracket-tables"
