            - { call: "GET /api/players/${pq}", as: FederationAdmin, captures: { q_rating: $.data.rating, q_games: $.data.rated_games_played } }
          assert:
            - "Player.${pp}.rating == 1000 exactly (pre-confirm value restored by replay; DOUBLE_FORFEIT creates no new events) — got ${p_rating}"
            - "Player.${pq}.rating == 800 exactly — got ${q_rating}"
            - "rated_games_played back to 25 and 30 (${p_games}, ${q_games})"
            - "Player.${pp}.performance_points == 0 and both players' forfeit_losses incremented by 1 (DOUBLE_FORFEIT) — got ${p_pts}"
            - "Both original RatingEvents for ${pair_id} are VOIDED; zero EFFECTIVE events remain for the pairing"

      - name: meet_game_points_conservation
        grounds:
          - calculations.team_standings
        distinguishing_aspect: |
          Conserved quantity = game points awarded per meet: total points ==
          rounds_count x boards_count minus 1 per DOUBLE_FORFEIT game; a 2-board meet
          with one WHITE_WIN and one DOUBLE_FORFEIT awards exactly 1 point total, not 2.
        test_recipe:
          setup:
            - "Season ACTIVE; clubs A,B with two players each, memberships waived; meet 1 round x 2 boards IN_PROGRESS"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S1", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, provisional_game_threshold: 4, base_rating: 800, state_bid_slots_per_region: 2, travel_base_cents: 1500 }, as: FederationAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Alpha", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Beta", school_name: "B HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_b: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_a}", full_name: "Coach A", email: "ca@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_a: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_b}", full_name: "Coach B", email: "cb@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_b: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "W1", grade_level: 9 }, as: FederationAdmin, captures: { w1: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "W2", grade_level: 9 }, as: FederationAdmin, captures: { w2: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_b}", full_name: "B1", grade_level: 9 }, as: FederationAdmin, captures: { b1: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_b}", full_name: "B2", grade_level: 9 }, as: FederationAdmin, captures: { b2: $.data.id } }
            - { call: "POST /api/memberships", payload: { player_id: "${w1}", season_id: "${season_id}" }, as: FederationAdmin, captures: { m1: $.data.id } }
            - { call: "POST /api/memberships/${m1}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/memberships", payload: { player_id: "${w2}", season_id: "${season_id}" }, as: FederationAdmin, captures: { m2: $.data.id } }
            - { call: "POST /api/memberships/${m2}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/memberships", payload: { player_id: "${b1}", season_id: "${season_id}" }, as: FederationAdmin, captures: { m3: $.data.id } }
            - { call: "POST /api/memberships/${m3}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/memberships", payload: { player_id: "${b2}", season_id: "${season_id}" }, as: FederationAdmin, captures: { m4: $.data.id } }
            - { call: "POST /api/memberships/${m4}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/meets", payload: { season_id: "${season_id}", host_club_id: "${club_a}", away_club_id: "${club_b}", scheduled_date: "2026-09-05", rounds_count: 1, boards_count: 2 }, as: FederationAdmin, captures: { meet_id: $.data.id } }
            - { call: "POST /api/meets/${meet_id}/schedule", payload: {}, as: FederationAdmin }
            - { call: "GET /api/meets/${meet_id}", as: FederationAdmin, captures: { mv1: $.data.version } }
            - { call: "POST /api/meets/${meet_id}/pairings", payload: { round_number: 1, board_number: 1, white_player_id: "${w1}", black_player_id: "${b1}", expected_meet_version: "${mv1}" }, as: FederationAdmin, captures: { g1: $.data.id } }
            - { call: "GET /api/meets/${meet_id}", as: FederationAdmin, captures: { mv2: $.data.version } }
            - { call: "POST /api/meets/${meet_id}/pairings", payload: { round_number: 1, board_number: 2, white_player_id: "${w2}", black_player_id: "${b2}", expected_meet_version: "${mv2}" }, as: FederationAdmin, captures: { g2: $.data.id } }
            - { call: "POST /api/meets/${meet_id}/publish-pairings", payload: {}, as: FederationAdmin }
            - { call: "POST /api/proctor-assignments", payload: { coach_id: "${coach_a}", event_type: "MEET", meet_id: "${meet_id}" }, as: FederationAdmin, captures: { asg: $.data.id } }
            - { call: "POST /api/proctor-assignments/${asg}/confirm", payload: {}, as: Proctor, as_user_id: "${coach_a}" }
            - { call: "POST /api/meets/${meet_id}/start", payload: {}, as: FederationAdmin }
          trigger:
            - { call: "POST /api/pairings/${g1}/report-result", payload: { result: "WHITE_WIN" }, as: ClubCoach, as_user_id: "${coach_a}" }
            - { call: "POST /api/pairings/${g1}/confirm", payload: {}, as: ClubCoach, as_user_id: "${coach_b}" }
            - { call: "POST /api/pairings/${g2}/report-result", payload: { result: "DOUBLE_FORFEIT" }, as: ClubCoach, as_user_id: "${coach_a}" }
            - { call: "POST /api/pairings/${g2}/confirm", payload: {}, as: ClubCoach, as_user_id: "${coach_b}" }
            - { call: "POST /api/meets/${meet_id}/complete", payload: {}, as: FederationAdmin }
            - { call: "GET /api/seasons/${season_id}/standings", as: FederationAdmin, captures: { table: $.data.standings } }
          assert:
            - "Host club game_points == 1 and away club game_points == 0 (WHITE_WIN 1+0, DOUBLE_FORFEIT 0+0)"
            - "Conservation: total awarded == rounds*boards - double_forfeits == 1*2 - 1 == 1"
            - "Host club match_points == 2, away == 0; forfeit_losses: host 1, away 1"
            - "No RatingEvents exist for pairing ${g2} (DOUBLE_FORFEIT is unrated)"
