scenario: "Estate Planning & Trust Administration: asset inventory, beneficiary designation, Executor/Trustee, guardianship, HIPAA authorization, Power of Attorney (POA), end-of-life directives, Probate supervision."
domain_name: "estate-planning-trust"
api_prefix: ""

complexity_profile:
  primary_archetype: "multi_party_negotiation"
  secondary_archetype: "compliance_audit"
  complexity_layers:
    - "cascading_side_effects"
    - "dual_variant_calculation"
    - "version_pinning_on_approval"
    - "derived_field_reconciliation"
    - "optimistic_concurrency"
  entity_topology: "hybrid"
  state_machine_shape: "branching"
  relationship_patterns:
    - "one_to_many"
    - "cross_aggregate"
    - "polymorphic"
  role_model: "segregation_of_duties"
  consistency_model: "immediate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entities
# =============================================================================
entities:
  - name: Decedent
    parent: null
    common_fields: true
    fields:
      - name: full_legal_name
        type: string
        source: input
        description: "Decedent's full legal name; required for probate filings."
      - name: date_of_birth
        type: datetime
        source: input
        description: "ISO 8601 UTC midnight (date-only semantics); used for guardianship age checks."
      - name: date_of_death
        type: datetime
        source: input
        description: "ISO 8601 UTC; nullable until death is registered; once set transitions Estate ALIVE->DECEASED."
        default: null
      - name: domicile_state_code
        type: string
        source: input
        description: "Two-letter US state code; determines probate court jurisdiction and intestacy rules."
        constraints: "ENUM IN {CA, NY, TX, FL, IL}; uppercase"
      - name: ssn_last4
        type: string
        source: input
        description: "Last 4 of SSN; used for asset matching."
        constraints: "exactly 4 digits"

  - name: Estate
    parent: null
    common_fields: true
    fields:
      - name: decedent_id
        type: string
        source: input
        description: "FK -> Decedent.id; the Estate represents this decedent's affairs."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle posture; advances through DRAFT, ALIVE, DECEASED, PROBATE_PENDING, PROBATE_OPEN, ADMINISTRATION, CLOSED, CONTESTED."
        constraints: "ENUM IN {DRAFT, ALIVE, DECEASED, PROBATE_PENDING, PROBATE_OPEN, ADMINISTRATION, CLOSED, CONTESTED}"
        default: "DRAFT"
      - name: gross_estate_value_cents
        type: integer
        source: computed
        description: "Sum of Asset.appraised_value_cents over all assets in INCLUDED status; recomputed on Asset create/update/exclude."
        default: 0
      - name: net_taxable_estate_cents
        type: integer
        source: computed
        description: "Gross estate minus exempt categories and minus settled creditor claims; see calc net_taxable_estate."
        default: 0
      - name: inventory_snapshot_gross_cents
        type: integer
        source: system
        description: "Frozen gross value of all INCLUDED Assets at the moment the APPROVE_INVENTORY ProbateOrder transitions to ENTERED. Used by net_taxable_estate.final variant; null while Estate.status NOT IN {ADMINISTRATION, CLOSED}. Once set, never recomputed even if Assets are re-appraised."
        default: null
      - name: executor_user_id
        type: string
        source: input
        description: "FK -> Executor.id; opaque pointer set on EXECUTOR_DESIGNATION transition; immutable once court-confirmed."
        default: null
      - name: probate_filed_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; stamped when Estate enters PROBATE_PENDING."
        default: null
      - name: probate_opened_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; stamped when court grants Letters Testamentary (PROBATE_OPEN)."
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; stamped on transition into CLOSED."
        default: null

  - name: Asset
    parent: null
    common_fields: true
    fields:
      - name: estate_id
        type: string
        source: input
        description: "FK -> Estate.id; the estate this asset belongs to."
      - name: category
        type: enum
        source: input
        description: "Asset category determines whether it bypasses probate and whether it is exempt for tax."
        constraints: "ENUM IN {REAL_ESTATE, BROKERAGE, BANK_ACCOUNT, RETIREMENT_IRA, LIFE_INSURANCE, PERSONAL_PROPERTY, BUSINESS_INTEREST}"
      - name: description
        type: string
        source: input
        description: "Free-text description (e.g., '123 Main St', 'Fidelity IRA #1234')."
      - name: appraised_value_cents
        type: integer
        source: input
        description: "Appraised value in cents; non-negative integer."
        constraints: "value >= 0"
      - name: status
        type: enum
        source: computed
        description: "Inclusion posture; INCLUDED contributes to gross, EXCLUDED (non-probate transfer) does not, LIQUIDATED removed after sale."
        constraints: "ENUM IN {DRAFT, INCLUDED, EXCLUDED, LIQUIDATED}"
        default: "DRAFT"
      - name: beneficiary_designation_id
        type: string
        source: input
        description: "FK -> BeneficiaryDesignation.id; nullable. When set on a non-probate-eligible category (RETIREMENT_IRA, LIFE_INSURANCE), asset auto-EXCLUDES on Estate.status=DECEASED."
        default: null

  - name: BeneficiaryDesignation
    parent: null
    common_fields: true
    fields:
      - name: estate_id
        type: string
        source: input
        description: "FK -> Estate.id; the estate this designation belongs to."
      - name: beneficiary_full_name
        type: string
        source: input
        description: "Beneficiary's full legal name."
      - name: relationship
        type: enum
        source: input
        description: "Relationship to decedent; determines intestacy fallback ranking."
        constraints: "ENUM IN {SPOUSE, CHILD, GRANDCHILD, PARENT, SIBLING, CHARITY, OTHER}"
      - name: share_basis_points
        type: integer
        source: input
        description: "Share of residuary estate in basis points (1bp = 0.01%); sum across all ACTIVE designations on the same estate must equal 10000."
        constraints: "0 < share_basis_points <= 10000"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle: DRAFT (unconfirmed), ACTIVE (counted), REVOKED (excluded but retained for audit)."
        constraints: "ENUM IN {DRAFT, ACTIVE, REVOKED}"
        default: "DRAFT"
      - name: contingent_of_designation_id
        type: string
        source: input
        description: "FK -> BeneficiaryDesignation.id; self-referential. Non-null marks this as contingent (only takes effect if primary REVOKED)."
        default: null

  - name: Executor
    parent: null
    common_fields: true
    fields:
      - name: estate_id
        type: string
        source: input
        description: "FK -> Estate.id; one CONFIRMED executor per estate (uniqueness enforced)."
      - name: full_legal_name
        type: string
        source: input
        description: "Executor's full legal name."
      - name: role_type
        type: enum
        source: input
        description: "EXECUTOR for probate-driven estates, TRUSTEE for revocable-trust pour-over flows."
        constraints: "ENUM IN {EXECUTOR, TRUSTEE}"
      - name: status
        type: enum
        source: computed
        description: "Nomination lifecycle: NOMINATED -> ACCEPTED -> COURT_CONFIRMED -> DISCHARGED (or DECLINED/REMOVED)."
        constraints: "ENUM IN {NOMINATED, ACCEPTED, DECLINED, COURT_CONFIRMED, DISCHARGED, REMOVED}"
        default: "NOMINATED"
      - name: is_also_beneficiary
        type: boolean
        source: input
        description: "Whether this executor is also named in a BeneficiaryDesignation on the same estate. Triggers segregation-of-duties check on court confirmation."
        default: false

  - name: PowerOfAttorney
    parent: null
    common_fields: true
    fields:
      - name: decedent_id
        type: string
        source: input
        description: "FK -> Decedent.id; POA grantor (must still be ALIVE on activation)."
      - name: agent_full_name
        type: string
        source: input
        description: "Agent (attorney-in-fact) full legal name."
      - name: scope
        type: enum
        source: input
        description: "FINANCIAL covers asset management; HEALTHCARE covers medical decisions; DURABLE survives incapacity."
        constraints: "ENUM IN {FINANCIAL, HEALTHCARE, DURABLE_FINANCIAL, DURABLE_HEALTHCARE}"
      - name: status
        type: enum
        source: computed
        description: "DRAFT -> ACTIVE -> REVOKED (by grantor) or TERMINATED (auto on Decedent death for non-DURABLE)."
        constraints: "ENUM IN {DRAFT, ACTIVE, REVOKED, TERMINATED}"
        default: "DRAFT"
      - name: effective_at
        type: datetime
        source: input
        description: "ISO 8601 UTC; lower bound of POA effective interval [effective_at, effective_until)."
        default: null
      - name: effective_until
        type: datetime
        source: input
        description: "ISO 8601 UTC; upper bound (exclusive) of POA effective interval [effective_at, effective_until). Null means open-ended. Half-open interval semantics: an interval ending at T does NOT collide with another interval starting at T."
        default: null

  - name: EndOfLifeDirective
    parent: null
    common_fields: true
    fields:
      - name: decedent_id
        type: string
        source: input
        description: "FK -> Decedent.id; the principal whose end-of-life wishes are recorded."
      - name: directive_type
        type: enum
        source: input
        description: "LIVING_WILL (treatment preferences), DNR (do-not-resuscitate), HEALTHCARE_POA (proxy), HIPAA_AUTHORIZATION (PHI release)."
        constraints: "ENUM IN {LIVING_WILL, DNR, HEALTHCARE_POA, HIPAA_AUTHORIZATION}"
      - name: status
        type: enum
        source: computed
        description: "DRAFT -> WITNESSED -> NOTARIZED -> ACTIVE -> REVOKED. ACTIVE requires WITNESSED + (NOTARIZED if directive_type IN {DNR, LIVING_WILL})."
        constraints: "ENUM IN {DRAFT, WITNESSED, NOTARIZED, ACTIVE, REVOKED}"
        default: "DRAFT"
      - name: physician_attester_user_id
        type: string
        source: input
        description: "Opaque physician user id; required for DNR. Must differ from any Executor.id on the same estate (segregation of duties)."
        default: null
      - name: hipaa_authorized_recipients
        type: array
        source: input
        description: "List of recipient identifiers cleared to receive PHI; only meaningful when directive_type=HIPAA_AUTHORIZATION."
        default: []

  - name: Guardianship
    parent: null
    common_fields: true
    fields:
      - name: estate_id
        type: string
        source: input
        description: "FK -> Estate.id; guardianship is over a minor dependent named in the estate plan."
      - name: ward_full_name
        type: string
        source: input
        description: "Ward (dependent) full legal name."
      - name: ward_date_of_birth
        type: datetime
        source: input
        description: "ISO 8601 UTC midnight; ward must be < 18 years old as of Estate.status entering DECEASED for guardianship to ACTIVATE."
      - name: guardian_full_name
        type: string
        source: input
        description: "Proposed guardian full legal name."
      - name: status
        type: enum
        source: computed
        description: "PROPOSED -> COURT_REVIEW -> COURT_CONFIRMED or COURT_DENIED. Auto -> DISSOLVED when ward turns 18."
        constraints: "ENUM IN {PROPOSED, COURT_REVIEW, COURT_CONFIRMED, COURT_DENIED, DISSOLVED}"
        default: "PROPOSED"

  - name: CreditorClaim
    parent: null
    common_fields: true
    fields:
      - name: estate_id
        type: string
        source: input
        description: "FK -> Estate.id; debts the estate must reckon with during probate."
      - name: creditor_name
        type: string
        source: input
        description: "Creditor display name."
      - name: amount_cents
        type: integer
        source: input
        description: "Claim amount in cents."
        constraints: "amount_cents > 0"
      - name: claim_class
        type: enum
        source: input
        description: "Statutory class determining payment priority (SECURED > ADMIN > FUNERAL > TAX > UNSECURED)."
        constraints: "ENUM IN {SECURED, ADMIN, FUNERAL, TAX, UNSECURED}"
      - name: filed_at
        type: datetime
        source: input
        description: "ISO 8601 UTC; claim must be filed within 120 days of Estate.probate_opened_at (creditor window) else REJECTED."
      - name: paid_amount_cents
        type: integer
        source: computed
        description: "Cents paid against this claim by the waterfall when POST /creditor-claims/{id}/pay was invoked. Always 0 while status IN {FILED, ALLOWED, DISALLOWED}; set by creditor_payment_waterfall calc; equals amount_cents when the claim was fully paid, less than amount_cents on the marginal claim, and 0 for claims that hit ERR_INSUFFICIENT_ESTATE_FUNDS."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "FILED -> ALLOWED or DISALLOWED; PAID terminal."
        constraints: "ENUM IN {FILED, ALLOWED, DISALLOWED, PAID}"
        default: "FILED"

  - name: ProbateOrder
    parent: null
    common_fields: true
    fields:
      - name: estate_id
        type: string
        source: input
        description: "FK -> Estate.id; the estate this court order governs."
      - name: order_type
        type: enum
        source: input
        description: "Court order types punctuating probate."
        constraints: "ENUM IN {OPEN_PROBATE, CONFIRM_EXECUTOR, APPROVE_INVENTORY, SETTLE_CREDITORS, FINAL_DISTRIBUTION, CLOSE_ESTATE}"
      - name: judge_user_id
        type: string
        source: input
        description: "Opaque judge identifier (court actor)."
      - name: status
        type: enum
        source: computed
        description: "DRAFT (clerk prepared) -> ENTERED (judge signed) -> SUPERSEDED (replaced by later order on appeal)."
        constraints: "ENUM IN {DRAFT, ENTERED, SUPERSEDED}"
        default: "DRAFT"
      - name: entered_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; stamped on transition to ENTERED."
        default: null

# =============================================================================
# §1.2 State Machines
# =============================================================================
state_machines:
  - entity: Estate
    initial_state: "DRAFT"
    terminal_states: ["CLOSED"]
    transitions:
      - from: "DRAFT"
        to: "ALIVE"
        trigger: "POST /estates/{id}/finalize-plan"
        actor: "EstatePlanner"
        preconditions:
          - "Estate has >= 1 Asset with status IN {DRAFT, INCLUDED}"
          - "Sum of ACTIVE BeneficiaryDesignation.share_basis_points == 10000"
          - "Decedent.date_of_death IS NULL"
        side_effects:
          - "All Asset rows on this estate with status=DRAFT transition to INCLUDED"
          - "All BeneficiaryDesignation rows on this estate with status=DRAFT transition to ACTIVE"
          - "Estate.gross_estate_value_cents recomputed (calc gross_estate_value)"
          - "Estate.updated_at refreshed"
          - "Estate.version increments by 1"
      - from: "ALIVE"
        to: "DECEASED"
        trigger: "POST /decedents/{id}/register-death"
        actor: "Registrar"
        preconditions:
          - "Decedent.date_of_death IS NOT NULL"
          - "Estate.status == ALIVE"
        side_effects:
          - "Estate.status -> DECEASED"
          - "All PowerOfAttorney rows on this Decedent with scope IN {FINANCIAL, HEALTHCARE} (non-DURABLE) auto-transition ACTIVE -> TERMINATED (cascade depth 2)"
          - "All Asset rows with non-null beneficiary_designation_id AND category IN {RETIREMENT_IRA, LIFE_INSURANCE} auto-transition INCLUDED -> EXCLUDED (cascade depth 2)"
          - "All Guardianship rows where ward_date_of_birth implies ward_age < 18 transition PROPOSED -> COURT_REVIEW (cascade depth 2)"
          - "Estate.gross_estate_value_cents recomputed after EXCLUDE cascade"
          - "Estate.updated_at refreshed; Estate.version increments by 1"
      - from: "DECEASED"
        to: "PROBATE_PENDING"
        trigger: "POST /estates/{id}/file-for-probate"
        actor: "Executor"
        preconditions:
          - "Executor with role_type=EXECUTOR on this estate has status=ACCEPTED"
          - "Estate.executor_user_id IS NOT NULL"
        side_effects:
          - "Estate.probate_filed_at = now()"
          - "Estate.version increments by 1"
      - from: "PROBATE_PENDING"
        to: "PROBATE_OPEN"
        trigger: "ProbateOrder of order_type=OPEN_PROBATE transitions to ENTERED"
        actor: "system"
        preconditions:
          - "ProbateOrder.order_type=OPEN_PROBATE exists with status=ENTERED"
          - "Executor.is_also_beneficiary=false OR a CONFIRM_EXECUTOR ProbateOrder is ENTERED noting court waiver"
        side_effects:
          - "Estate.probate_opened_at = ProbateOrder.entered_at"
          - "Estate.status -> PROBATE_OPEN"
          - "All Executor rows with role_type=EXECUTOR, status=ACCEPTED transition to COURT_CONFIRMED (one only)"
          - "Estate.version increments by 1"
      - from: "PROBATE_OPEN"
        to: "ADMINISTRATION"
        trigger: "ProbateOrder of order_type=APPROVE_INVENTORY transitions to ENTERED"
        actor: "system"
        preconditions:
          - "Every Asset on this estate has status IN {INCLUDED, EXCLUDED, LIQUIDATED} (no DRAFT)"
          - "Estate.gross_estate_value_cents > 0"
        side_effects:
          - "Estate.status -> ADMINISTRATION"
          - "Estate.inventory_snapshot_gross_cents = current Estate.gross_estate_value_cents (frozen forever for final-variant net calc)"
          - "Creditor 120-day window now ticks against probate_opened_at"
          - "Estate.version increments by 1"
      - from: "ADMINISTRATION"
        to: "CLOSED"
        trigger: "ProbateOrder of order_type=CLOSE_ESTATE transitions to ENTERED"
        actor: "system"
        preconditions:
          - "All CreditorClaim rows with status=ALLOWED also have status=PAID"
          - "A FINAL_DISTRIBUTION ProbateOrder exists with status=ENTERED preceding this CLOSE_ESTATE"
          - "Estate.net_taxable_estate_cents has been computed (calc net_taxable_estate must have run)"
        side_effects:
          - "Estate.closed_at = now()"
          - "Estate.status -> CLOSED"
          - "Executor row with status=COURT_CONFIRMED transitions to DISCHARGED (cascade depth 2)"
          - "Estate.version increments by 1"
      - from: "PROBATE_OPEN"
        to: "CONTESTED"
        trigger: "POST /estates/{id}/contest"
        actor: "Beneficiary"
        preconditions:
          - "Estate.status == PROBATE_OPEN"
          - "expected_estate_version matches Estate.version"
        side_effects:
          - "Estate.status -> CONTESTED"
          - "All ProbateOrder rows with status=ENTERED and entered_at > now()-72h transition to SUPERSEDED"
          - "Estate.version increments by 1"
      - from: "CONTESTED"
        to: "PROBATE_OPEN"
        trigger: "POST /estates/{id}/resolve-contest"
        actor: "Judge"
        preconditions:
          - "Estate.status == CONTESTED"
        side_effects:
          - "Estate.status -> PROBATE_OPEN"
          - "Estate.version increments by 1"

  - entity: Executor
    initial_state: "NOMINATED"
    terminal_states: ["DECLINED", "DISCHARGED", "REMOVED"]
    transitions:
      - from: "NOMINATED"
        to: "ACCEPTED"
        trigger: "POST /executors/{id}/accept"
        actor: "Executor"
        preconditions:
          - "Estate.status IN {DRAFT, ALIVE, DECEASED}"
        side_effects:
          - "Estate.executor_user_id = this Executor.id"
          - "Estate.version increments by 1"
      - from: "NOMINATED"
        to: "DECLINED"
        trigger: "POST /executors/{id}/decline"
        actor: "Executor"
        preconditions: ["Estate.status != CLOSED"]
        side_effects:
          - "Estate.executor_user_id cleared if it equaled this Executor.id"
      - from: "ACCEPTED"
        to: "COURT_CONFIRMED"
        trigger: "Estate transitions PROBATE_PENDING -> PROBATE_OPEN (cascade)"
        actor: "system"
        preconditions:
          - "Estate.status -> PROBATE_OPEN"
          - "Either Executor.is_also_beneficiary=false, OR ProbateOrder.order_type=CONFIRM_EXECUTOR is ENTERED"
        side_effects: []
      - from: "COURT_CONFIRMED"
        to: "REMOVED"
        trigger: "ProbateOrder of order_type=CONFIRM_EXECUTOR with status=SUPERSEDED"
        actor: "system"
        preconditions: []
        side_effects:
          - "Estate.executor_user_id cleared"
      - from: "COURT_CONFIRMED"
        to: "DISCHARGED"
        trigger: "Estate transitions ADMINISTRATION -> CLOSED (cascade)"
        actor: "system"
        preconditions: []
        side_effects: []

  - entity: BeneficiaryDesignation
    initial_state: "DRAFT"
    terminal_states: ["REVOKED"]
    transitions:
      - from: "DRAFT"
        to: "ACTIVE"
        trigger: "Estate transitions DRAFT -> ALIVE (cascade) OR POST /beneficiary-designations/{id}/activate"
        actor: "system or EstatePlanner"
        preconditions:
          - "Estate.status != CLOSED"
          - "Sum of share_basis_points across ACTIVE designations on the same estate (this one included) <= 10000"
        side_effects: []
      - from: "ACTIVE"
        to: "REVOKED"
        trigger: "POST /beneficiary-designations/{id}/revoke"
        actor: "EstatePlanner"
        preconditions:
          - "Estate.status IN {ALIVE, DECEASED}"
          - "expected_estate_version matches Estate.version"
        side_effects:
          - "If this designation has contingent children (BeneficiaryDesignation.contingent_of_designation_id == this.id), each such contingent child auto-transitions DRAFT -> ACTIVE (cascade depth 2)"
          - "Estate.version increments by 1"

  - entity: ProbateOrder
    initial_state: "DRAFT"
    terminal_states: ["SUPERSEDED"]
    transitions:
      - from: "DRAFT"
        to: "ENTERED"
        trigger: "POST /probate-orders/{id}/enter"
        actor: "Judge"
        preconditions:
          - "Estate.status IN {PROBATE_PENDING, PROBATE_OPEN, ADMINISTRATION}"
          - "For order_type=APPROVE_INVENTORY: every Asset on this estate has status != DRAFT"
          - "For order_type=FINAL_DISTRIBUTION: every CreditorClaim with status=ALLOWED also has status=PAID"
          - "For order_type=CLOSE_ESTATE: a FINAL_DISTRIBUTION ProbateOrder with status=ENTERED exists for this estate"
        side_effects:
          - "ProbateOrder.entered_at = now()"
          - "Triggers Estate cascade per order_type (OPEN_PROBATE -> PROBATE_OPEN; APPROVE_INVENTORY -> ADMINISTRATION; CLOSE_ESTATE -> CLOSED) (cascade depth 3 from clerk -> order -> estate -> executor)"
          - "Estate.version increments by 1"
      - from: "ENTERED"
        to: "SUPERSEDED"
        trigger: "Estate transitions PROBATE_OPEN -> CONTESTED (cascade) OR POST /probate-orders/{id}/supersede"
        actor: "system or Judge"
        preconditions: []
        side_effects: []

  - entity: CreditorClaim
    initial_state: "FILED"
    terminal_states: ["PAID", "DISALLOWED"]
    transitions:
      - from: "FILED"
        to: "ALLOWED"
        trigger: "POST /creditor-claims/{id}/allow"
        actor: "Executor"
        preconditions:
          - "Estate.status == ADMINISTRATION"
          - "(CreditorClaim.filed_at - Estate.probate_opened_at) <= 120 days"
        side_effects:
          - "Estate.net_taxable_estate_cents recomputed (calc net_taxable_estate)"
      - from: "FILED"
        to: "DISALLOWED"
        trigger: "POST /creditor-claims/{id}/disallow"
        actor: "Executor"
        preconditions:
          - "Estate.status == ADMINISTRATION"
        side_effects: []
      - from: "ALLOWED"
        to: "PAID"
        trigger: "POST /creditor-claims/{id}/pay"
        actor: "Executor"
        preconditions:
          - "Estate.status == ADMINISTRATION"
          - "There exists sufficient gross_estate_value_cents >= sum of ALLOWED claims via waterfall priority"
        side_effects:
          - "Estate.gross_estate_value_cents unchanged by payment itself (calculated against assets)"
          - "Estate.net_taxable_estate_cents recomputed"

  - entity: EndOfLifeDirective
    initial_state: "DRAFT"
    terminal_states: ["REVOKED"]
    transitions:
      - from: "DRAFT"
        to: "WITNESSED"
        trigger: "POST /directives/{id}/witness"
        actor: "EstatePlanner"
        preconditions: ["Decedent.date_of_death IS NULL"]
        side_effects: []
      - from: "WITNESSED"
        to: "NOTARIZED"
        trigger: "POST /directives/{id}/notarize"
        actor: "EstatePlanner"
        preconditions: ["directive_type IN {DNR, LIVING_WILL, HEALTHCARE_POA}"]
        side_effects: []
      - from: "WITNESSED"
        to: "ACTIVE"
        trigger: "POST /directives/{id}/activate"
        actor: "EstatePlanner"
        preconditions:
          - "If directive_type=DNR: status must be NOTARIZED (not WITNESSED only) AND physician_attester_user_id IS NOT NULL"
          - "If directive_type=LIVING_WILL: status must be NOTARIZED"
          - "physician_attester_user_id (when set) MUST NOT equal Estate.executor_user_id (segregation of duties)"
        side_effects: []
      - from: "NOTARIZED"
        to: "ACTIVE"
        trigger: "POST /directives/{id}/activate"
        actor: "EstatePlanner"
        preconditions:
          - "If directive_type=DNR: physician_attester_user_id IS NOT NULL"
          - "physician_attester_user_id (when set) MUST NOT equal Estate.executor_user_id"
        side_effects: []
      - from: "ACTIVE"
        to: "REVOKED"
        trigger: "POST /directives/{id}/revoke"
        actor: "EstatePlanner"
        preconditions: ["Decedent.date_of_death IS NULL"]
        side_effects: []

# §1.2.1 Concurrency Rules
concurrency_rules:
  - rule_id: revoke-designation-stale-estate
    parent_entity: Estate
    write_endpoint: "POST /beneficiary-designations/{id}/revoke"
    occ_field: "expected_estate_version"
    description: |
      Revoking a BeneficiaryDesignation against an Estate whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just activated, revoked, or contested
      a designation on the same estate (each of which legitimately re-shapes
      the residuary share map under §1.2) and the current writer's view of
      the estate is therefore stale.
    error_id: ERR_STALE_ESTATE_VERSION
    http_status: 412

  - rule_id: contest-estate-stale-version
    parent_entity: Estate
    write_endpoint: "POST /estates/{id}/contest"
    occ_field: "expected_estate_version"
    description: |
      Contesting an Estate whose version has advanced since the client last
      observed it is rejected. Two prospective contestants could each
      legitimately initiate a contest from PROBATE_OPEN; OCC ensures only
      the writer who has observed the most recent state proceeds, so the
      72-hour ProbateOrder-supersede cascade does not double-fire.
    error_id: ERR_STALE_ESTATE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculations
# =============================================================================
calculations:
  - name: gross_estate_value
    trigger: "Asset.status transitions involving INCLUDED (DRAFT->INCLUDED, INCLUDED->EXCLUDED, INCLUDED->LIQUIDATED); Estate.status transitions DRAFT->ALIVE and ALIVE->DECEASED; Asset create/update on appraised_value_cents"
    algorithm: "aggregation"
    formula: |
      gross = sum(asset.appraised_value_cents
                  for asset in Asset
                  where asset.estate_id == this.estate_id
                  and asset.status == 'INCLUDED')
      // Iteration order: Asset.created_at ASC, stable
    input_set: "Assets in INCLUDED status only. DRAFT, EXCLUDED, LIQUIDATED rows are skipped."
    constants: {}
    precision: "integer cents; no rounding (all inputs already cents)"

  - name: net_taxable_estate
    trigger: "CreditorClaim transitions FILED->ALLOWED and ALLOWED->PAID; Estate transitions DECEASED->PROBATE_PENDING and ADMINISTRATION->CLOSED; GET /estates/{id}/net-taxable-summary"
    algorithm: "forward_looking"
    formula: |
      // Variant selection: if Estate.status IN {ADMINISTRATION, CLOSED} and inventory_snapshot_gross_cents IS NOT NULL → variant='final';
      // else → variant='provisional'.
      if variant == 'provisional':
        gross_used = Estate.gross_estate_value_cents   // LIVE
      else:  # final
        gross_used = Estate.inventory_snapshot_gross_cents  // FROZEN at APPROVE_INVENTORY
      exempt = sum(asset.appraised_value_cents
                   for asset in Asset
                   where asset.estate_id == this.id
                   and asset.status == 'INCLUDED'
                   and asset.category == 'RETIREMENT_IRA')
      // Note: only RETIREMENT_IRA without beneficiary_designation_id remains INCLUDED;
      // those with designation are EXCLUDED before this calc, by §1.2 cascade.
      allowed_claims_total = sum(c.amount_cents
                                 for c in CreditorClaim
                                 where c.estate_id == this.id
                                 and c.status == 'ALLOWED')
      net = max(0, gross_used - exempt - allowed_claims_total)
    input_set: "Assets in INCLUDED status; CreditorClaim rows in ALLOWED status only (PAID claims still count — they were ALLOWED first; DISALLOWED claims excluded)."
    constants: {}
    precision: "integer cents; max(0, ...) floor prevents negative estates"
    variants:
      - name: provisional
        when: "Estate.status IN {DECEASED, PROBATE_PENDING, PROBATE_OPEN} — before APPROVE_INVENTORY"
        difference: "Uses LIVE Asset.appraised_value_cents at read time. Each subsequent PATCH /assets/{id} that changes appraised_value_cents IS reflected in the provisional net_taxable_estate."
      - name: final
        when: "Estate.status IN {ADMINISTRATION, CLOSED} (i.e., after APPROVE_INVENTORY ProbateOrder transitioned to ENTERED)"
        difference: "Values FREEZE at the snapshot taken when the APPROVE_INVENTORY ProbateOrder enters. Any PATCH /assets/{id} after that point does NOT re-enter the final net_taxable_estate calculation. Same Asset, same CreditorClaim set, two strictly different net_taxable_estate_cents values for the same Estate depending solely on Estate.status (PROBATE_OPEN vs ADMINISTRATION)."

  - name: creditor_payment_waterfall
    trigger: "POST /creditor-claims/{id}/pay (the target claim transitions ALLOWED -> PAID with paid_amount_cents set by this calc)"
    algorithm: "waterfall_allocation"
    formula: |
      // Distribute Estate.gross_estate_value_cents minus already-paid claims, across ALLOWED claims by priority.
      // Priority order: SECURED (1), ADMIN (2), FUNERAL (3), TAX (4), UNSECURED (5).
      // Within the same class, iterate by CreditorClaim.created_at ASC, then by amount_cents ASC.
      // On invocation, ONLY the target claim (the one named in the /pay URL) actually receives its paid_amount_cents
      // and transitions to PAID. The walk is to determine THE TARGET'S payable amount given the current state of
      // already-PAID claims; any other ALLOWED claim earlier in the waterfall that hasn't been paid yet is treated
      // as still consuming its full amount_cents from remaining.
      already_paid_total = sum(c.paid_amount_cents for c in CreditorClaim
                               where c.estate_id == this.estate_id and c.status == 'PAID')
      // Walk the waterfall to find what the target claim is entitled to.
      remaining = Estate.gross_estate_value_cents - already_paid_total
      for class in [SECURED, ADMIN, FUNERAL, TAX, UNSECURED]:
        claims_in_class = sorted([c for c in CreditorClaim
                                  where c.estate_id == this.estate_id
                                  and c.status == 'ALLOWED'
                                  and c.claim_class == class],
                                 key=(created_at ASC, amount_cents ASC))
        for c in claims_in_class:
          if c.id != target_claim.id:
            // simulate consumption only — earlier ALLOWED claims notionally consume their amount
            consumption = min(remaining, c.amount_cents)
            remaining -= consumption
            continue
          // this is the target — settle here
          if remaining <= 0:
            // out of funds — pay endpoint MUST raise ERR_INSUFFICIENT_ESTATE_FUNDS;
            target_claim.paid_amount_cents stays 0; target_claim.status stays ALLOWED.
            raise ERR_INSUFFICIENT_ESTATE_FUNDS
          target_claim.paid_amount_cents = min(c.amount_cents, remaining)
          target_claim.status = 'PAID'
          return
    input_set: "CreditorClaim rows with status=ALLOWED, scoped to this Estate."
    constants:
      CLASS_PRIORITY:
        SECURED: 1
        ADMIN: 2
        FUNERAL: 3
        TAX: 4
        UNSECURED: 5
    precision: "integer cents; the remainder rule pays the marginal claim partially, never splits across multiple within same class"
    variants:
      - name: pro_rata_within_class
        when: "Estate.status == ADMINISTRATION and at least one CLOSE_ESTATE ProbateOrder is in DRAFT (i.e., final distribution being prepared)"
        difference: "When `remaining` is insufficient for ALL claims in the current class, instead of paying earliest-created in full and zeroing the rest, distribute `remaining` PRO-RATA across the entire class: c.payable = floor(c.amount_cents * remaining / sum(class.amount_cents)); residual cents allocated by created_at ASC."
      - name: priority_full_pay
        when: "Estate.status == ADMINISTRATION and no CLOSE_ESTATE ProbateOrder exists (interim creditor payouts)"
        difference: "Default behavior in the formula above: pay each claim in (created_at ASC, amount_cents ASC) order until `remaining` is exhausted; marginal claim gets the residual; later claims get zero. This produces a strictly different per-claim payable map than pro_rata_within_class on the same inputs whenever a class is short-funded."

  - name: intestacy_share_allocation
    trigger: "POST /estates/{id}/compute-intestacy-shares (when no ACTIVE BeneficiaryDesignation reaches 10000 bp); also part of FINAL_DISTRIBUTION precondition check"
    algorithm: "tiered_pricing"
    formula: |
      // Per-state intestacy fallback. State.code -> {spouse_first_bp, child_pool_bp, remainder_rank}.
      // For each surviving relationship class in priority order:
      //   1. SPOUSE: receives spouse_first_bp (state-specific)
      //   2. CHILD pool: receives child_pool_bp, split equally among CHILD designations (or by per stirpes if any are deceased — out of scope)
      //   3. PARENT, then SIBLING, then CHARITY (only if no kin); each pool capped by remainder
      // Tie-break on share rounding: largest remainder goes to BeneficiaryDesignation.created_at ASC
      // Constants by state_code:
      shares_by_state = {
        'CA': { spouse_first_bp: 5000, child_pool_bp: 5000 },  // community property + children
        'NY': { spouse_first_bp: 5000, child_pool_bp: 5000 },
        'TX': { spouse_first_bp: 3333, child_pool_bp: 6667 },  // separate-property children-favored
        'FL': { spouse_first_bp: 5000, child_pool_bp: 5000 },
        'IL': { spouse_first_bp: 5000, child_pool_bp: 5000 },
      }
      total_bp = 10000
      assigned = {}
      for rel in [SPOUSE, CHILD, PARENT, SIBLING, CHARITY]:
        beneficiaries = [b for b in BeneficiaryDesignation
                         where b.estate_id == this.id
                         and b.status IN {DRAFT, ACTIVE}
                         and b.relationship == rel]
        if not beneficiaries: continue
        if rel == SPOUSE: pool = shares_by_state[Decedent.domicile_state_code]['spouse_first_bp']
        elif rel == CHILD: pool = shares_by_state[Decedent.domicile_state_code]['child_pool_bp']
        else: pool = total_bp - sum(assigned.values())
        // Equal split within class; remainder allocated by created_at ASC
        base = pool // len(beneficiaries)
        rem = pool - base * len(beneficiaries)
        for i, b in enumerate(sorted(beneficiaries, key=created_at_asc)):
          assigned[b.id] = base + (1 if i < rem else 0)
        total_bp -= pool
    input_set: "BeneficiaryDesignation rows in DRAFT or ACTIVE status, grouped by relationship; Decedent.domicile_state_code chooses the state table."
    constants:
      STATE_SHARES:
        CA: { spouse_first_bp: 5000, child_pool_bp: 5000 }
        NY: { spouse_first_bp: 5000, child_pool_bp: 5000 }
        TX: { spouse_first_bp: 3333, child_pool_bp: 6667 }
        FL: { spouse_first_bp: 5000, child_pool_bp: 5000 }
        IL: { spouse_first_bp: 5000, child_pool_bp: 5000 }
    precision: "integer basis points (1bp = 0.01%); remainder of pool % count distributed in created_at ASC order so totals always equal 10000 bp"

  - name: guardian_age_eligibility
    trigger: "POST /guardianships/{id}/review (computed on demand and on every Estate.status change while ward unconfirmed)"
    algorithm: "threshold"
    formula: |
      // Ward must be strictly under 18 AS OF Estate.status transition to DECEASED.
      // Boundary: ward_date_of_birth + 18 years > Decedent.date_of_death  → eligible
      //           ward_date_of_birth + 18 years <= Decedent.date_of_death → ERR_WARD_OVER_AGE
      reference_date = Decedent.date_of_death (UTC date)
      ward_18th_birthday = ward_date_of_birth + 18 years (UTC date)
      eligible = (ward_18th_birthday > reference_date)
    input_set: "Guardianship + Decedent for the same estate."
    constants:
      ADULT_AGE_YEARS: 18
    precision: "Date boundary: > (strict) means a ward whose 18th birthday equals decedent's date_of_death is INELIGIBLE"

# =============================================================================
# §1.4 Validations
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role from §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except: POST /estates (create), POST /decedents (create) which allow X-User-Role=EstatePlanner anonymous-create"

  - priority: 2
    category: existence
    check: "Referenced resources in URL path exist (estate_id, asset_id, designation_id, etc.). Validated left-to-right."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target resource's current status permits the requested transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_safety
    check: "On Directive activation: physician_attester_user_id (when set) MUST NOT equal Estate.executor_user_id (segregation of duties between health-care attester and estate executor)"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATED
    http_status: 422
    applies_to: "POST /directives/{id}/activate"

  - priority: 6
    category: business_safety
    check: "On Estate transition PROBATE_PENDING -> PROBATE_OPEN: if Executor.is_also_beneficiary == true, the ENTERED ProbateOrder of order_type=OPEN_PROBATE must be accompanied by an ENTERED ProbateOrder of order_type=CONFIRM_EXECUTOR (court waiver). Absence -> reject the OPEN_PROBATE entry."
    error_id: ERR_EXECUTOR_BENEFICIARY_CONFLICT
    http_status: 422
    applies_to: "POST /probate-orders/{id}/enter"

  - priority: 7
    category: business_referential
    check: "On BeneficiaryDesignation create/activate: a contingent_of_designation_id (if set) must reference a designation on the SAME estate_id and the parent must currently be in ACTIVE status."
    error_id: ERR_CONTINGENT_PARENT_INVALID
    http_status: 422
    applies_to: "POST /beneficiary-designations, POST /beneficiary-designations/{id}/activate"

  - priority: 8
    category: business_temporal
    check: "On CreditorClaim create: if Estate.probate_opened_at IS NOT NULL, then (claim.filed_at - Estate.probate_opened_at) must be <= 120 days, OR claim is auto-rejected (DISALLOWED) at create. Strict comparison: at 120-days-exactly the claim is still ACCEPTED; at 120-days-and-1-second it is REJECTED."
    error_id: ERR_CREDITOR_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /creditor-claims"

  - priority: 9
    category: business_constraint
    check: "On BeneficiaryDesignation activate (manual or cascade): the new sum of share_basis_points across ACTIVE designations on the same estate must be <= 10000."
    error_id: ERR_SHARE_OVERALLOCATION
    http_status: 422
    applies_to: "POST /beneficiary-designations/{id}/activate, cascade from POST /estates/{id}/finalize-plan"

  - priority: 10
    category: business_constraint
    check: "On Estate finalize-plan: sum of share_basis_points across designations transitioning to ACTIVE (including DRAFT ones being promoted) must EXACTLY equal 10000 (not <= 10000)."
    error_id: ERR_SHARE_NOT_FULLY_ALLOCATED
    http_status: 422
    applies_to: "POST /estates/{id}/finalize-plan"

  - priority: 11
    category: business_safety
    check: "On Guardianship activation (via Estate DECEASED cascade): ward_date_of_birth + 18 years must be > Decedent.date_of_death (strict inequality)."
    error_id: ERR_WARD_OVER_AGE
    http_status: 422
    applies_to: "POST /estates/{id}/register-death (cascade), POST /guardianships/{id}/review"

  - priority: 12
    category: business_fiscal
    check: "On CreditorClaim transition to PAID: cumulative paid amount under waterfall priority must not exceed Estate.gross_estate_value_cents."
    error_id: ERR_INSUFFICIENT_ESTATE_FUNDS
    http_status: 422
    applies_to: "POST /creditor-claims/{id}/pay"

  - priority: 13
    category: business_referential
    check: "On Executor accept/decline: an Executor in NOMINATED status cannot accept if another Executor with role_type=EXECUTOR on the same estate is already in ACCEPTED or COURT_CONFIRMED status."
    error_id: ERR_DUPLICATE_EXECUTOR_ACTIVE
    http_status: 422
    applies_to: "POST /executors/{id}/accept"

  - priority: 14
    category: business_constraint
    check: "OCC version match: when an endpoint takes expected_estate_version (or similar), it must equal the parent's current version."
    error_id: ERR_STALE_ESTATE_VERSION
    http_status: 412
    applies_to: "POST /beneficiary-designations/{id}/revoke, POST /estates/{id}/contest"

  - priority: 15
    category: business_referential
    check: "On HIPAA directive activation: hipaa_authorized_recipients must be a non-empty array when directive_type=HIPAA_AUTHORIZATION."
    error_id: ERR_HIPAA_RECIPIENTS_REQUIRED
    http_status: 422
    applies_to: "POST /directives/{id}/activate"

  - priority: 16
    category: business_temporal
    check: "On POA activate: the half-open interval [effective_at, effective_until) (effective_until=null treated as +inf) MUST NOT overlap any existing ACTIVE PowerOfAttorney with the same decedent_id and same scope. Half-open semantics: an interval ending at T is allowed to abut another starting at T (no overlap)."
    error_id: ERR_POA_INTERVAL_OVERLAP
    http_status: 422
    applies_to: "POST /powers-of-attorney/{id}/activate"

  - priority: 17
    category: business_constraint
    check: "On Guardianship create: no other Guardianship row on the same estate_id may share the same ward_full_name regardless of status (point-uniqueness, not interval — adjacency irrelevant). DISSOLVED rows still count toward uniqueness as an audit-trail block."
    error_id: ERR_DUPLICATE_WARD
    http_status: 422
    applies_to: "POST /guardianships"

# =============================================================================
# §1.5 API Endpoints
# =============================================================================
endpoints:
  # ----- Decedent -----
  - method: POST
    path: "/decedents"
    description: "Register a decedent profile (alive at creation)."
    roles: [EstatePlanner]
    code: 201
    input: [full_legal_name, date_of_birth, domicile_state_code, ssn_last4]
    output: Decedent
    side_effects: []

  - method: GET
    path: "/decedents/{id}"
    description: "Fetch a decedent."
    roles: [EstatePlanner, Executor, Judge, Beneficiary, Registrar]
    code: 200
    input: []
    output: Decedent
    side_effects: []

  - method: POST
    path: "/decedents/{id}/register-death"
    description: "Record date_of_death; triggers Estate ALIVE->DECEASED cascade and non-DURABLE POA termination."
    roles: [Registrar]
    code: 200
    input: [date_of_death]
    output: Decedent
    side_effects:
      - "Decedent.date_of_death set"
      - "Triggers Estate ALIVE->DECEASED for any Estate whose decedent_id == this id (cascade depth 2)"
      - "Triggers PowerOfAttorney ACTIVE->TERMINATED for non-DURABLE scopes (cascade depth 3 via Estate)"
      - "Triggers Asset INCLUDED->EXCLUDED for non-probate categories with beneficiary_designation_id set (cascade depth 3)"
      - "Triggers Guardianship PROPOSED->COURT_REVIEW for minors (cascade depth 3)"

  # ----- Estate -----
  - method: POST
    path: "/estates"
    description: "Create an estate for a decedent (starts in DRAFT)."
    roles: [EstatePlanner]
    code: 201
    input: [decedent_id]
    output: Estate
    side_effects:
      - "Estate created in DRAFT with gross_estate_value_cents=0"

  - method: GET
    path: "/estates/{id}"
    description: "Fetch an estate."
    roles: [EstatePlanner, Executor, Judge, Beneficiary]
    code: 200
    input: []
    output: Estate
    side_effects: []

  - method: GET
    path: "/estates"
    description: "List estates with optional filter."
    roles: [EstatePlanner, Judge]
    code: 200
    input: ["decedent_id?", "status?", "executor_user_id?", "limit?", "offset?"]
    output: Estate[]
    side_effects: []

  - method: POST
    path: "/estates/{id}/finalize-plan"
    description: "Promote DRAFT estate to ALIVE; cascades DRAFT assets to INCLUDED and DRAFT designations to ACTIVE; recomputes gross_estate_value."
    roles: [EstatePlanner]
    code: 200
    input: []
    output: Estate
    side_effects:
      - "Estate.status DRAFT -> ALIVE"
      - "All Asset rows DRAFT -> INCLUDED (cascade depth 2)"
      - "All BeneficiaryDesignation rows DRAFT -> ACTIVE (cascade depth 2)"
      - "Calc gross_estate_value runs"
      - "Estate.version increments by 1"

  - method: POST
    path: "/estates/{id}/file-for-probate"
    description: "Transition DECEASED -> PROBATE_PENDING."
    roles: [Executor]
    code: 200
    input: []
    output: Estate
    side_effects:
      - "Estate.probate_filed_at = now()"
      - "Estate.version increments by 1"

  - method: POST
    path: "/estates/{id}/contest"
    description: "Transition PROBATE_OPEN -> CONTESTED; supersedes recent (<72h) ProbateOrders."
    roles: [Beneficiary]
    code: 200
    input: [expected_estate_version, reason]
    output: Estate
    side_effects:
      - "Estate.status -> CONTESTED"
      - "Recent (<72h) ENTERED ProbateOrders auto-transition to SUPERSEDED (cascade depth 2)"
      - "Estate.version increments by 1"

  - method: POST
    path: "/estates/{id}/resolve-contest"
    description: "Transition CONTESTED -> PROBATE_OPEN after judge resolution."
    roles: [Judge]
    code: 200
    input: [resolution_note]
    output: Estate
    side_effects:
      - "Estate.version increments by 1"

  - method: POST
    path: "/estates/{id}/compute-intestacy-shares"
    description: "Run the intestacy_share_allocation calc; returns assigned basis-point map."
    roles: [Judge, EstatePlanner]
    code: 200
    input: []
    output: "{ shares: object, total_bp_assigned: integer }"
    side_effects:
      - "Read-only; computes and returns intestacy_share_allocation"

  - method: GET
    path: "/estates/{id}/net-taxable-summary"
    description: "Returns Estate's net_taxable_estate_cents using the current variant (provisional vs final) per Estate.status."
    roles: [EstatePlanner, Executor, Judge]
    code: 200
    input: []
    output: "{ gross_estate_value_cents: integer, exempt_cents: integer, allowed_claims_total_cents: integer, net_taxable_estate_cents: integer, variant: string }"
    side_effects:
      - "Calc net_taxable_estate runs in the variant matching Estate.status"

  # ----- Asset -----
  - method: POST
    path: "/assets"
    description: "Add an asset to an estate (starts DRAFT)."
    roles: [EstatePlanner]
    code: 201
    input: [estate_id, category, description, appraised_value_cents, "beneficiary_designation_id?"]
    output: Asset
    side_effects: []

  - method: PATCH
    path: "/assets/{id}"
    description: "Update an asset's appraised_value_cents (re-runs gross_estate_value if INCLUDED)."
    roles: [EstatePlanner, Executor]
    code: 200
    input: [appraised_value_cents]
    output: Asset
    side_effects:
      - "If Asset.status == INCLUDED, recompute Estate.gross_estate_value_cents"
      - "Estate.version increments by 1 on the parent estate"

  - method: GET
    path: "/assets/{id}"
    description: "Fetch an asset."
    roles: [EstatePlanner, Executor, Judge]
    code: 200
    input: []
    output: Asset
    side_effects: []

  - method: GET
    path: "/assets"
    description: "List assets; filter by estate_id or by beneficiary_designation_id."
    roles: [EstatePlanner, Executor, Judge]
    code: 200
    input: ["estate_id?", "status?", "beneficiary_designation_id?", "limit?", "offset?"]
    output: Asset[]
    side_effects: []

  - method: POST
    path: "/assets/{id}/liquidate"
    description: "Sell an asset (INCLUDED -> LIQUIDATED); recomputes gross."
    roles: [Executor]
    code: 200
    input: []
    output: Asset
    side_effects:
      - "Asset.status INCLUDED -> LIQUIDATED"
      - "Estate.gross_estate_value_cents recomputed"
      - "Estate.version increments by 1"

  # ----- BeneficiaryDesignation -----
  - method: POST
    path: "/beneficiary-designations"
    description: "Create a beneficiary designation (starts DRAFT)."
    roles: [EstatePlanner]
    code: 201
    input: [estate_id, beneficiary_full_name, relationship, share_basis_points, "contingent_of_designation_id?"]
    output: BeneficiaryDesignation
    side_effects: []

  - method: GET
    path: "/beneficiary-designations/{id}"
    description: "Fetch a designation."
    roles: [EstatePlanner, Executor, Judge, Beneficiary]
    code: 200
    input: []
    output: BeneficiaryDesignation
    side_effects: []

  - method: GET
    path: "/beneficiary-designations"
    description: "List designations; filter by estate_id."
    roles: [EstatePlanner, Executor, Judge]
    code: 200
    input: ["estate_id?", "status?", "contingent_of_designation_id?", "limit?", "offset?"]
    output: BeneficiaryDesignation[]
    side_effects: []

  - method: POST
    path: "/beneficiary-designations/{id}/activate"
    description: "DRAFT -> ACTIVE (subject to share-sum constraints)."
    roles: [EstatePlanner]
    code: 200
    input: []
    output: BeneficiaryDesignation
    side_effects: []

  - method: POST
    path: "/beneficiary-designations/{id}/revoke"
    description: "ACTIVE -> REVOKED; cascades contingent children DRAFT -> ACTIVE. OCC-guarded."
    roles: [EstatePlanner]
    code: 200
    input: [expected_estate_version]
    output: BeneficiaryDesignation
    side_effects:
      - "If contingent children exist (contingent_of_designation_id == this.id), each DRAFT child -> ACTIVE (cascade depth 2)"
      - "Estate.version increments by 1"

  # ----- Executor -----
  - method: POST
    path: "/executors"
    description: "Nominate an executor or trustee."
    roles: [EstatePlanner]
    code: 201
    input: [estate_id, full_legal_name, role_type, "is_also_beneficiary?"]
    output: Executor
    side_effects: []

  - method: GET
    path: "/executors/{id}"
    description: "Fetch an executor."
    roles: [EstatePlanner, Executor, Judge]
    code: 200
    input: []
    output: Executor
    side_effects: []

  - method: GET
    path: "/executors"
    description: "List executors; filter by estate_id."
    roles: [EstatePlanner, Executor, Judge]
    code: 200
    input: ["estate_id?", "status?", "limit?", "offset?"]
    output: Executor[]
    side_effects: []

  - method: POST
    path: "/executors/{id}/accept"
    description: "NOMINATED -> ACCEPTED."
    roles: [Executor]
    code: 200
    input: []
    output: Executor
    side_effects:
      - "Estate.executor_user_id set to this Executor.id"
      - "Estate.version increments by 1"

  - method: POST
    path: "/executors/{id}/decline"
    description: "NOMINATED -> DECLINED."
    roles: [Executor]
    code: 200
    input: []
    output: Executor
    side_effects:
      - "If Estate.executor_user_id == this Executor.id, cleared to null"

  # ----- PowerOfAttorney -----
  - method: POST
    path: "/powers-of-attorney"
    description: "Create a POA in DRAFT."
    roles: [EstatePlanner]
    code: 201
    input: [decedent_id, agent_full_name, scope]
    output: PowerOfAttorney
    side_effects: []

  - method: GET
    path: "/powers-of-attorney/{id}"
    description: "Fetch a POA."
    roles: [EstatePlanner, Executor]
    code: 200
    input: []
    output: PowerOfAttorney
    side_effects: []

  - method: GET
    path: "/powers-of-attorney"
    description: "List POAs; filter by decedent_id."
    roles: [EstatePlanner, Executor]
    code: 200
    input: ["decedent_id?", "status?", "limit?", "offset?"]
    output: PowerOfAttorney[]
    side_effects: []

  - method: POST
    path: "/powers-of-attorney/{id}/activate"
    description: "DRAFT -> ACTIVE; sets effective_at and (optionally) effective_until; enforces half-open interval non-overlap with other ACTIVE POAs of the same scope on the same Decedent."
    roles: [EstatePlanner]
    code: 200
    input: [effective_at, "effective_until?"]
    output: PowerOfAttorney
    side_effects: []

  - method: POST
    path: "/powers-of-attorney/{id}/revoke"
    description: "ACTIVE -> REVOKED (grantor explicit revocation)."
    roles: [EstatePlanner]
    code: 200
    input: []
    output: PowerOfAttorney
    side_effects: []

  # ----- EndOfLifeDirective -----
  - method: POST
    path: "/directives"
    description: "Create a directive in DRAFT."
    roles: [EstatePlanner]
    code: 201
    input: [decedent_id, directive_type, "physician_attester_user_id?", "hipaa_authorized_recipients?"]
    output: EndOfLifeDirective
    side_effects: []

  - method: GET
    path: "/directives/{id}"
    description: "Fetch a directive."
    roles: [EstatePlanner, Executor]
    code: 200
    input: []
    output: EndOfLifeDirective
    side_effects: []

  - method: GET
    path: "/directives"
    description: "List directives; filter by decedent_id."
    roles: [EstatePlanner, Executor]
    code: 200
    input: ["decedent_id?", "directive_type?", "status?", "limit?", "offset?"]
    output: EndOfLifeDirective[]
    side_effects: []

  - method: POST
    path: "/directives/{id}/witness"
    description: "DRAFT -> WITNESSED."
    roles: [EstatePlanner]
    code: 200
    input: []
    output: EndOfLifeDirective
    side_effects: []

  - method: POST
    path: "/directives/{id}/notarize"
    description: "WITNESSED -> NOTARIZED."
    roles: [EstatePlanner]
    code: 200
    input: []
    output: EndOfLifeDirective
    side_effects: []

  - method: POST
    path: "/directives/{id}/activate"
    description: "WITNESSED or NOTARIZED -> ACTIVE."
    roles: [EstatePlanner]
    code: 200
    input: []
    output: EndOfLifeDirective
    side_effects: []

  - method: POST
    path: "/directives/{id}/revoke"
    description: "ACTIVE -> REVOKED."
    roles: [EstatePlanner]
    code: 200
    input: []
    output: EndOfLifeDirective
    side_effects: []

  # ----- Guardianship -----
  - method: POST
    path: "/guardianships"
    description: "Propose a guardian for a minor named in the plan."
    roles: [EstatePlanner]
    code: 201
    input: [estate_id, ward_full_name, ward_date_of_birth, guardian_full_name]
    output: Guardianship
    side_effects: []

  - method: GET
    path: "/guardianships/{id}"
    description: "Fetch a guardianship."
    roles: [EstatePlanner, Executor, Judge]
    code: 200
    input: []
    output: Guardianship
    side_effects: []

  - method: GET
    path: "/guardianships"
    description: "List guardianships; filter by estate_id."
    roles: [EstatePlanner, Executor, Judge]
    code: 200
    input: ["estate_id?", "status?", "limit?", "offset?"]
    output: Guardianship[]
    side_effects: []

  - method: POST
    path: "/guardianships/{id}/review"
    description: "Judge advances COURT_REVIEW -> COURT_CONFIRMED or COURT_DENIED; runs guardian_age_eligibility calc."
    roles: [Judge]
    code: 200
    input: [decision]
    output: Guardianship
    side_effects:
      - "Guardianship.status -> COURT_CONFIRMED if decision=CONFIRM and ward eligible; else COURT_DENIED"

  # ----- CreditorClaim -----
  - method: POST
    path: "/creditor-claims"
    description: "File a creditor claim."
    roles: [Creditor, Executor]
    code: 201
    input: [estate_id, creditor_name, amount_cents, claim_class, filed_at]
    output: CreditorClaim
    side_effects: []

  - method: GET
    path: "/creditor-claims/{id}"
    description: "Fetch a creditor claim."
    roles: [EstatePlanner, Executor, Judge, Creditor]
    code: 200
    input: []
    output: CreditorClaim
    side_effects: []

  - method: GET
    path: "/creditor-claims"
    description: "List creditor claims; filter by estate_id."
    roles: [EstatePlanner, Executor, Judge]
    code: 200
    input: ["estate_id?", "status?", "claim_class?", "limit?", "offset?"]
    output: CreditorClaim[]
    side_effects: []

  - method: POST
    path: "/creditor-claims/{id}/allow"
    description: "FILED -> ALLOWED."
    roles: [Executor]
    code: 200
    input: []
    output: CreditorClaim
    side_effects:
      - "Calc net_taxable_estate runs"

  - method: POST
    path: "/creditor-claims/{id}/disallow"
    description: "FILED -> DISALLOWED."
    roles: [Executor]
    code: 200
    input: []
    output: CreditorClaim
    side_effects: []

  - method: POST
    path: "/creditor-claims/{id}/pay"
    description: "ALLOWED -> PAID; runs creditor_payment_waterfall to confirm coverage."
    roles: [Executor]
    code: 200
    input: []
    output: CreditorClaim
    side_effects:
      - "Calc creditor_payment_waterfall runs to ensure cumulative coverage"
      - "Calc net_taxable_estate recomputed"

  # ----- ProbateOrder -----
  - method: POST
    path: "/probate-orders"
    description: "Clerk drafts a probate order."
    roles: [Judge]
    code: 201
    input: [estate_id, order_type, judge_user_id]
    output: ProbateOrder
    side_effects: []

  - method: GET
    path: "/probate-orders/{id}"
    description: "Fetch a probate order."
    roles: [EstatePlanner, Executor, Judge, Beneficiary]
    code: 200
    input: []
    output: ProbateOrder
    side_effects: []

  - method: GET
    path: "/probate-orders"
    description: "List probate orders; filter by estate_id."
    roles: [EstatePlanner, Executor, Judge, Beneficiary]
    code: 200
    input: ["estate_id?", "order_type?", "status?", "limit?", "offset?"]
    output: ProbateOrder[]
    side_effects: []

  - method: POST
    path: "/probate-orders/{id}/enter"
    description: "Judge signs order: DRAFT -> ENTERED; triggers Estate cascade per order_type."
    roles: [Judge]
    code: 200
    input: []
    output: ProbateOrder
    side_effects:
      - "ProbateOrder.entered_at = now()"
      - "If order_type=OPEN_PROBATE: Estate PROBATE_PENDING -> PROBATE_OPEN; Executor ACCEPTED -> COURT_CONFIRMED (cascade depth 3)"
      - "If order_type=APPROVE_INVENTORY: Estate PROBATE_OPEN -> ADMINISTRATION (cascade depth 2)"
      - "If order_type=CLOSE_ESTATE: Estate ADMINISTRATION -> CLOSED; Executor COURT_CONFIRMED -> DISCHARGED (cascade depth 3)"
      - "Estate.version increments by 1"

  - method: POST
    path: "/probate-orders/{id}/supersede"
    description: "Manually supersede an ENTERED order (judge ruling on appeal)."
    roles: [Judge]
    code: 200
    input: [reason]
    output: ProbateOrder
    side_effects:
      - "ProbateOrder.status -> SUPERSEDED"
      - "If order_type=CONFIRM_EXECUTOR: Executor COURT_CONFIRMED -> REMOVED; Estate.executor_user_id cleared (cascade depth 3)"

  # ----- Test-driving (system clock) -----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: pin the system clock so creditor-window and 72h-supersede windows are deterministic. Available only in benchmark mode."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now: string }"
    side_effects:
      - "Subsequent now() reads return the pinned timestamp"

# =============================================================================
# §1.6 Errors
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing X-User-ID or X-User-Role header, or unknown X-User-Role value."

  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role authenticated but not permitted for this endpoint per §1.7."

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource (estate, asset, designation, executor, decedent, directive, guardianship, claim, order) not found."

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource's current status does not permit the requested transition per §1.2."

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, type mismatch, enum value invalid, or constraint (e.g., share_basis_points <= 0) violated at the syntactic layer."

  - id: ERR_SEGREGATION_OF_DUTIES_VIOLATED
    http: 422
    condition: "Directive activation: physician_attester_user_id equals Estate.executor_user_id (executor cannot also attest a DNR/Living-Will for the same estate)."

  - id: ERR_EXECUTOR_BENEFICIARY_CONFLICT
    http: 422
    condition: "On OPEN_PROBATE order entry: Executor.is_also_beneficiary=true but no ENTERED CONFIRM_EXECUTOR order exists."

  - id: ERR_CONTINGENT_PARENT_INVALID
    http: 422
    condition: "Contingent designation references a parent designation that is on a different estate or is not currently ACTIVE."

  - id: ERR_CREDITOR_WINDOW_CLOSED
    http: 422
    condition: "Creditor claim filed_at exceeds probate_opened_at + 120 days (strict >)."

  - id: ERR_SHARE_OVERALLOCATION
    http: 422
    condition: "Activating a designation would push sum of ACTIVE share_basis_points above 10000."

  - id: ERR_SHARE_NOT_FULLY_ALLOCATED
    http: 422
    condition: "Estate finalize-plan: sum of share_basis_points across designations being promoted to ACTIVE does not equal 10000."

  - id: ERR_WARD_OVER_AGE
    http: 422
    condition: "Guardianship review: ward_date_of_birth + 18 years <= Decedent.date_of_death (ward already 18 on date of death)."

  - id: ERR_INSUFFICIENT_ESTATE_FUNDS
    http: 422
    condition: "Creditor payment would exhaust Estate.gross_estate_value_cents under the waterfall."

  - id: ERR_DUPLICATE_EXECUTOR_ACTIVE
    http: 422
    condition: "Attempt to accept an Executor while another with role_type=EXECUTOR is already ACCEPTED or COURT_CONFIRMED on the same estate."

  - id: ERR_STALE_ESTATE_VERSION
    http: 412
    condition: "expected_estate_version on the request does not match Estate.version (OCC mismatch on a true write-write race)."

  - id: ERR_HIPAA_RECIPIENTS_REQUIRED
    http: 422
    condition: "HIPAA_AUTHORIZATION directive activation with empty hipaa_authorized_recipients."

  - id: ERR_POA_INTERVAL_OVERLAP
    http: 422
    condition: "POA activate: half-open [effective_at, effective_until) interval collides with an existing ACTIVE POA of the same scope on the same decedent."

  - id: ERR_DUPLICATE_WARD
    http: 422
    condition: "Guardianship create: another Guardianship row on the same estate_id already exists with the same ward_full_name (point-uniqueness)."

# =============================================================================
# §1.7 Roles (RBAC)
# =============================================================================
roles:
  - name: EstatePlanner
    description: "Drafts the estate plan: creates decedent, estate, assets, designations, executors, POAs, directives, guardianships."
    identity: "opaque"
    exclusive_operations:
      - "POST /estates"
      - "POST /estates/{id}/finalize-plan"
      - "POST /assets"
      - "POST /beneficiary-designations"
      - "POST /beneficiary-designations/{id}/activate"
      - "POST /beneficiary-designations/{id}/revoke"
      - "POST /executors"
      - "POST /powers-of-attorney"
      - "POST /powers-of-attorney/{id}/activate"
      - "POST /powers-of-attorney/{id}/revoke"
      - "POST /directives"
      - "POST /directives/{id}/witness"
      - "POST /directives/{id}/notarize"
      - "POST /directives/{id}/activate"
      - "POST /directives/{id}/revoke"
      - "POST /guardianships"
      - "POST /decedents"
    shared_operations:
      - "GET on most resources"
      - "PATCH /assets/{id} (shared with Executor)"
      - "POST /estates/{id}/compute-intestacy-shares (shared with Judge)"

  - name: Executor
    description: "Court-confirmed estate executor / trustee; runs probate administration."
    identity: "entity_backed:Executor"
    exclusive_operations:
      - "POST /executors/{id}/accept"
      - "POST /executors/{id}/decline"
      - "POST /estates/{id}/file-for-probate"
      - "POST /assets/{id}/liquidate"
      - "POST /creditor-claims/{id}/allow"
      - "POST /creditor-claims/{id}/disallow"
      - "POST /creditor-claims/{id}/pay"
    shared_operations:
      - "POST /creditor-claims (file on behalf of decedent estate)"
      - "PATCH /assets/{id} (shared with EstatePlanner)"
      - "GET reads on Estate/Asset/Executor/Directive/POA/Claim/Guardianship/ProbateOrder"

  - name: Judge
    description: "Court officer; enters and supersedes probate orders, reviews guardianship."
    identity: "opaque"
    exclusive_operations:
      - "POST /probate-orders"
      - "POST /probate-orders/{id}/enter"
      - "POST /probate-orders/{id}/supersede"
      - "POST /estates/{id}/resolve-contest"
      - "POST /guardianships/{id}/review"
    shared_operations:
      - "POST /estates/{id}/compute-intestacy-shares (shared with EstatePlanner)"
      - "GET reads"

  - name: Beneficiary
    description: "Named beneficiary; can read and contest probate."
    identity: "entity_backed:BeneficiaryDesignation"
    exclusive_operations:
      - "POST /estates/{id}/contest"
    shared_operations:
      - "GET reads on Estate, BeneficiaryDesignation, ProbateOrder, Decedent"

  - name: Registrar
    description: "Vital-records registrar; the only role that may register a death."
    identity: "opaque"
    exclusive_operations:
      - "POST /decedents/{id}/register-death"
    shared_operations:
      - "GET /decedents/{id}"

  - name: Creditor
    description: "External claimant filing against the estate."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /creditor-claims (file, shared with Executor)"
      - "GET /creditor-claims/{id}"

  - name: PlatformAdmin
    description: "Operates test-driving and platform-level endpoints (e.g., system clock)."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: []
