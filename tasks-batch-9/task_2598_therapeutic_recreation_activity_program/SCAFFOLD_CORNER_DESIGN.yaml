            - "the response status is 200"
            - "OutingConsent.${cn_id}.status == DENIED and effective == false"
            - "OutingConsent.${cy_id}.status == GRANTED and effective == true, untouched"
            - "Outing.${outing_id}.consent_status == CONSENT_BLOCKED"
            - "Outing.${outing_id}.logistics_status == PLANNING, because the consent dimension never drives logistics out of PLANNING"
            - "Outing.${outing_id}.manifest_count == 1, the denied resident having left the manifest"
