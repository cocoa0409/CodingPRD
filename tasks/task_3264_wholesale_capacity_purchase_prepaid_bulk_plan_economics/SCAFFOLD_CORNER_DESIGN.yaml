            - "SimInventory.${inv_four_id}.inventory_status == RESERVED_PREPAID"
            - "SimInventory.${inv_four_id}.shipment_channel == RETAIL_PARTNER_STOCK and shipment_sla_days == 3"
            - "Activation.${act_retail_id}.provisioned_msisdn == 13055550081 and accepted_msisdn is null"
            - "the DIGITAL activation on the same block also reserves exactly one unit, so the two reservations coexist"

      - name: activation_submit_port_holds_capacity_once
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/carriers/activations/{id}/submit-port
          - entities.Activation.fields.held_data_mb
        distinguishing_aspect: "Submitting a port sets held_data_mb to the plan's allotment while the agreement's allocated_data_mb is unchanged, because the term already counts the same megabytes."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Active agreement with offered H3, a CA eSIM block, and one CA subscriber whose activation is provisioned."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - *c_plan
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
            - *c_inv
            - *c_sub
            - *c_term
            - call: "POST /carriers/prepaid-terms/${term_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - *c_act
            - call: "POST /carriers/activations/${act_id}/provision"
              payload: {}
              as: CapacityPlanner
          trigger:
            - call: "POST /carriers/activations/${act_id}/submit-port"
              payload: { porting_msisdn: "13055550001", losing_carrier: "Cascade Wireless", account_number_last4: "4471" }
              as: Subscriber
              as_user_id: "${sub_id}"
          assert:
            - "the response status is 200 and Activation.${act_id}.port_status == SUBMITTED"
            - "Activation.${act_id}.held_data_mb == 3000"
            - "GET /carriers/capacity-agreements/${ag_id}/usage-summary still reports allocated_data_mb == 3000, not 6000"
            - "GET /carriers/subscribers/${sub_id} reports allocation_status == HELD"
            - "cancelling the port returns held_data_mb to 0 and leaves allocated_data_mb at 3000"

      - name: retail_partner_suspend_and_reinstate_is_a_business_admin_surface
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/carriers/retail-partners/{id}/suspend
          - endpoints.POST_/carriers/retail-partners/{id}/reinstate
          - state_machines.RetailPartner.DEFLECTED_to_ACTIVE
        distinguishing_aspect: "The partner admin actions are reachable in both directions: suspend moves an ACTIVE partner to SUSPENDED and reinstate returns a DEFLECTED one to ACTIVE."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. One CA-authorized partner on file."
          setup_api_calls:
            - *c_clock
            - *c_partner_ca2
          trigger:
            - call: "POST /carriers/retail-partners/${partner_id}/suspend"
              payload: {}
              as: CapacityPlanner
          assert:
            - "the response status is 200 and RetailPartner.${partner_id}.partner_status == SUSPENDED"
            - "the partner's version advanced by exactly 1"
            - "GET /carriers/retail-partners/${partner_id} reports the same status"
            - "POST /carriers/retail-partners/${partner_id}/reinstate is refused with ERR_INVALID_STATE because reinstate is only reachable from DEFLECTED"
            - "a partner that has genuinely deflected can be reinstated to ACTIVE"

      - name: capacity_agreement_resolve_purchase_reports_the_marginal_tier_rate
        claim_type: Computed read
        grounds:
          - endpoints.POST_/carriers/capacity-agreements/{id}/resolve-purchase
          - calculations.wholesale_volume_tier_cost
        distinguishing_aspect: "The resolve-purchase response exposes the ceilinged tier rate and the data-only volume cost separately from the monthly committed block, so each leg of the composite is readable."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. One agreement at 320000 megabytes from the standard rate card."
          setup_api_calls:
            - *c_clock
            - &c_ag_over
              call: "POST /carriers/capacity-agreements"
              payload: { host_network_name: "Over Breakpoint Host", state_code: "CA", data_rate_microcents_per_mb: 1237, voice_rate_microcents_per_min: 60, sms_rate_microcents_per_msg: 3, committed_data_mb: 320000, committed_voice_minutes: 200000, committed_sms_messages: 400000 }
              as: CapacityPlanner
              captures: { ag_over_id: $.data.id }
          trigger:
            - call: "POST /carriers/capacity-agreements/${ag_over_id}/resolve-purchase"
              payload: {}
              as: CapacityPlanner
          assert:
            - "the response status is 200"
            - "data_volume_cost_microcents == 388980000 and marginal_tier_rate_microcents == 1139"
            - "monthly_committed_cost_microcents == 402180000, which is the data leg plus voice 12000000 plus SMS 1200000"
            - "committed_volume_cost_microcents == monthly_committed_cost_microcents"
            - "projected_overage_data_mb == 0 and projected_overage_cost_microcents == 0 when no subscriber holds a plan"
            - "resolved_purchase_cost_microcents == committed_volume_cost_microcents when the projected overage is zero"

      - name: undefined_and_missing_payload_fields_are_rejected
        claim_type: Standard CRUD
        grounds:
          - endpoints.POST_/carriers/add-ons
          - errors.ERR_INVALID_REQUEST
          - entities.AddOn.fields.addon_days
        distinguishing_aspect: "A create with an unknown extra field and a create missing a required field both produce 400 ERR_INVALID_REQUEST, so the body shape is enforced in both directions."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. One activated CA subscriber on H3."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - *c_plan
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
            - *c_inv
            - *c_sub
            - *c_term
            - call: "POST /carriers/prepaid-terms/${term_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - *c_act
            - call: "POST /carriers/activations/${act_id}/provision"
              payload: {}
              as: CapacityPlanner
            - call: "POST /carriers/activations/${act_id}/complete"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
          trigger:
            - call: "POST /carriers/add-ons"
              payload: { subscriber_id: "${sub_id}", addon_type: "ROAMING", per_day_allotment_mb: 500 }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST because addon_days is required"
            - "an extra unknown field on an otherwise valid create also produces ERR_INVALID_REQUEST"
            - "err != ERR_INVALID_ADDON_WINDOW, because an absent field is a body-shape fault rather than a domain-constraint fault"
            - "a complete valid body creates the add-on with addon_status == REQUESTED"
            - "the rejected call created no add-on row"

      - name: clock_default_is_2026_09_01_and_is_never_wall_clock
        claim_type: Standard CRUD
        grounds:
          - endpoints.POST_/carriers/_clock/set_current_utc
          - validations[priority=21]
        distinguishing_aspect: "Before any clock call the logical clock reads exactly 2026-09-01T00:00:00Z, so a support case created then has an SLA deadline computed from that default rather than from the current wall clock."
        test_recipe:
          setup:
            - "No clock call is made, so the server's default logical clock of 2026-09-01T00:00:00Z applies, at or before every default fixture date."
          setup_api_calls:
            - call: "POST /carriers/capacity-agreements"
              payload: { host_network_name: "Default Clock Host", state_code: "CA", data_rate_microcents_per_mb: 1237, voice_rate_microcents_per_min: 60, sms_rate_microcents_per_msg: 3, committed_data_mb: 16000, committed_voice_minutes: 200000, committed_sms_messages: 400000 }
              as: CapacityPlanner
              captures: { ag_default_id: $.data.id, ag_default_v0: $.data.version }
            - call: "POST /carriers/capacity-agreements/${ag_default_id}/activate"
              payload: { expected_CapacityAgreement_version: "${ag_default_v0}" }
              as: CapacityPlanner
            - &c_plan_default
              call: "POST /carriers/plans"
              payload: { agreement_id: "${ag_default_id}", plan_code: "H3", term_months: 3, intro_price_cents: 1999, renewal_price_cents: 3042, data_allotment_mb: 3000, voice_allotment_min: 500, sms_allotment_msg: 1000 }
              as: CapacityPlanner
              captures: { plan_default_id: $.data.id }
            - call: "POST /carriers/plans/${plan_default_id}/offer"
              payload: {}
              as: CapacityPlanner
            - &c_sub_default
              call: "POST /carriers/subscribers"
              payload: { msisdn: "13055550091", full_name: "Default Clock Rider", state_code: "CA" }
              as: CapacityPlanner
              captures: { sub_default_id: $.data.id }
          trigger:
            - call: "POST /carriers/support-cases"
              payload: { subscriber_id: "${sub_default_id}", topic_code: "PORT_STATUS" }
              as: SupportAgent
              captures: { case_default_id: $.data.id }
          assert:
            - "SupportCase.${case_default_id}.sla_due_at == 2026-09-01T04:00:00Z, computed from the default clock rather than the real date"
            - "SupportCase.${case_default_id}.created_at starts with 2026-09-01T00:00:00"
            - "POST /carriers/_clock/set_current_utc with 2026-10-01T00:00:00Z then makes a second case's sla_due_at == 2026-10-01T04:00:00Z"
            - "the clock call is not subject to the support rules and requires no subscriber context"
            - "a PlatformAdmin call returns the applied instant in current_utc"

  # ===========================================================================
  - section: errors
    instances:

      - name: error_subscriber_not_active_on_consume_data
        claim_type: Violation → Error
        grounds:
          - errors.ERR_SUBSCRIBER_NOT_ACTIVE
          - validations[priority=15]
          - endpoints.POST_/carriers/subscribers/{id}/consume_data
        distinguishing_aspect: "A suspended subscriber's consume_data call is refused with ERR_SUBSCRIBER_NOT_ACTIVE and the usage counter does not move."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Activated CA subscriber who is then suspended."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - *c_plan
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
            - *c_inv
            - *c_sub
            - *c_term
            - call: "POST /carriers/prepaid-terms/${term_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - *c_act
            - call: "POST /carriers/activations/${act_id}/provision"
              payload: {}
              as: CapacityPlanner
            - call: "POST /carriers/activations/${act_id}/complete"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - &c_suspend
              call: "POST /carriers/subscribers/${sub_id}/suspend"
              payload: {}
              as: SupportAgent
          trigger:
            - call: "POST /carriers/subscribers/${sub_id}/consume_data"
              payload: { data_mb: 100 }
              as: CapacityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "Subscriber.${sub_id}.subscriber_status == SUSPENDED"
            - "the response status is 409 and err == ERR_SUBSCRIBER_NOT_ACTIVE"
            - "Subscriber.${sub_id}.data_used_mb_cycle is still 0 after the refusal"
            - "the agreement's allocated_data_mb is still 3000 because suspension does not release prepaid capacity"
            - "resuming the subscriber makes the identical consume_data call succeed and move data_used_mb_cycle to 100"

      - name: error_term_not_active_on_addon_activation_for_a_grace_term
        claim_type: Violation → Error
        grounds:
          - errors.ERR_TERM_NOT_ACTIVE
          - state_machines.PrepaidTerm.AWAITING_ACTIVATION_to_PURCHASED
          - endpoints.POST_/carriers/add-ons/{id}/activate
        distinguishing_aspect: "A term knocked back to PURCHASED by a failed activation blocks add-on activation with ERR_TERM_NOT_ACTIVE even when the subscriber row has moved on."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. CA subscriber whose activation was provisioned then failed, plus a requested roaming add-on."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - *c_plan
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
            - *c_inv
            - *c_sub
            - *c_term
            - call: "POST /carriers/prepaid-terms/${term_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - *c_act
            - call: "POST /carriers/activations/${act_id}/provision"
              payload: {}
              as: CapacityPlanner
            - &c_addon_req
              call: "POST /carriers/add-ons"
              payload: { subscriber_id: "${sub_id}", addon_type: "ROAMING", addon_days: 7, per_day_allotment_mb: 500 }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { addon_req_id: $.data.id }
            - *c_fail_act
          trigger:
            - call: "POST /carriers/add-ons/${addon_req_id}/activate"
              payload: {}
              as: CapacityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "PrepaidTerm.${term_id}.term_status == PURCHASED after the failed activation"
            - "the response status is 409 and err == ERR_TERM_NOT_ACTIVE"
            - "AddOn.${addon_req_id}.addon_status is still REQUESTED with addon_price_cents 0"
            - "GET /carriers/subscribers/${sub_id} reports allocation_status == NONE after the failure"
            - "the agreement's allocated_data_mb is 0 because a PURCHASED term commits nothing"

      - name: error_agreement_closed_blocks_plan_offer
        claim_type: Violation → Error
        grounds:
          - errors.ERR_AGREEMENT_CLOSED
          - validations[priority=9]
          - endpoints.POST_/carriers/plans/{id}/offer
        distinguishing_aspect: "Offering a draft plan on a CLOSED agreement is refused with ERR_AGREEMENT_CLOSED, while on a SUSPENDED agreement the same offer is allowed because suspension only blocks allocation."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. One agreement activated then closed, with a draft plan left on it."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - &c_plan_draft
              call: "POST /carriers/plans"
              payload: { agreement_id: "${ag_id}", plan_code: "D3", term_months: 3, intro_price_cents: 1999, renewal_price_cents: 3042, data_allotment_mb: 3000, voice_allotment_min: 500, sms_allotment_msg: 1000 }
              as: CapacityPlanner
              captures: { plan_draft3_id: $.data.id }
            - &c_close_ag
              call: "POST /carriers/capacity-agreements/${ag_id}/close"
              payload: {}
              as: CapacityPlanner
          trigger:
            - call: "POST /carriers/plans/${plan_draft3_id}/offer"
              payload: {}
              as: CapacityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "CapacityAgreement.${ag_id}.agreement_status == CLOSED and Plan.${plan_draft3_id}.plan_status is not DRAFT after the close"
            - "the response status is 409"
            - "err is ERR_INVALID_STATE or ERR_AGREEMENT_CLOSED, never a 400"
            - "on a merely SUSPENDED agreement the same offer succeeds because suspension blocks allocation and not the catalogue"
            - "the agreement's allocated_data_mb is 0 throughout"

      - name: not_found_codes_are_entity_specific
        claim_type: Violation → Error
        grounds:
          - errors.ERR_PLAN_NOT_FOUND
          - errors.ERR_SUBSCRIBER_NOT_FOUND
          - errors.ERR_TERM_NOT_FOUND
          - errors.ERR_ACTIVATION_NOT_FOUND
          - errors.ERR_PARTNER_NOT_FOUND
        distinguishing_aspect: "Each resource path resolves to its own not-found code, so the five codes are distinguishable on the same fabricated id."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /carriers/plans/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CapacityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and err == ERR_PLAN_NOT_FOUND"
            - "GET /carriers/subscribers/00000000-0000-4000-8000-000000000000 returns ERR_SUBSCRIBER_NOT_FOUND"
            - "GET /carriers/prepaid-terms/00000000-0000-4000-8000-000000000000 returns ERR_TERM_NOT_FOUND"
            - "GET /carriers/activations/00000000-0000-4000-8000-000000000000 returns ERR_ACTIVATION_NOT_FOUND"
            - "GET /carriers/retail-partners/00000000-0000-4000-8000-000000000000 returns ERR_PARTNER_NOT_FOUND"
            - "no two of the five codes are equal"

      - name: stale_version_code_is_412_not_409
        claim_type: Violation → Error
        grounds:
          - errors.ERR_STALE_VERSION
          - concurrency_rules[term-purchase-stale-agreement]
        distinguishing_aspect: "The OCC failure uses HTTP 412 while every state and terminal failure uses 409, so a caller can distinguish a stale read from an illegal action purely by status."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Active agreement with offered H3 and two CA subscribers."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
              captures: { ag_v: $.data.version }
            - *c_plan
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
            - *c_sub
            - *c_term_advance
            - &c_sub_stale_c
              call: "POST /carriers/subscribers"
              payload: { msisdn: "13055550101", full_name: "Stale Second", state_code: "CA" }
              as: CapacityPlanner
              captures: { sub_stale2_id: $.data.id }
          trigger:
            - call: "POST /carriers/prepaid-terms"
              payload: { subscriber_id: "${sub_stale2_id}", plan_id: "${plan_id}", expected_CapacityAgreement_version: "${ag_v}" }
              as: Subscriber
              as_user_id: "${sub_stale2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 412 and err == ERR_STALE_VERSION"
            - "the status is not 409 and not 400"
            - "the unrelated state failure for the same endpoint with a valid version returns 409 rather than 412"
            - "response_type is error and data carries both error_id and message"
            - "the rejected call left the agreement's version unchanged"

  # ===========================================================================
  - section: rbac
    instances:

      - name: subscriber_cannot_reach_planner_only_endpoints
        claim_type: Cross-role denial
        grounds:
          - roles.Subscriber.exclusive_operations
          - roles.CapacityPlanner.exclusive_operations
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "A Subscriber cannot create agreements, plans or retail partners, and every such attempt returns 403 ERR_FORBIDDEN_ROLE rather than falling through to a state error."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. One CA subscriber on file."
          setup_api_calls:
            - *c_clock
            - *c_sub
          trigger:
            - call: "POST /carriers/capacity-agreements"
              payload: { host_network_name: "Intruder Host", state_code: "CA", data_rate_microcents_per_mb: 1237, voice_rate_microcents_per_min: 60, sms_rate_microcents_per_msg: 3, committed_data_mb: 16000, committed_voice_minutes: 200000, committed_sms_messages: 400000 }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and err == ERR_FORBIDDEN_ROLE"
            - "err != ERR_UNAUTHENTICATED, because the role and id were both valid"
            - "the Subscriber's own cancel on its own row is not refused at the role layer"
            - "POST /carriers/plans and POST /carriers/retail-partners are refused the same way"
            - "no agreement row was created by the refused call"

      - name: support_agent_cannot_activate_addons_or_provision
        claim_type: Cross-role denial
        grounds:
          - roles.SupportAgent.exclusive_operations
          - roles.CapacityPlanner.exclusive_operations
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "A SupportAgent can fail an activation, resolve agent cases and top up budgets, but cannot provision an activation or activate an add-on."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Active agreement with offered H3, a CA eSIM block, and one CA subscriber with a purchased term and requested activation."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - *c_plan
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
            - *c_inv
            - *c_sub
            - *c_term
            - call: "POST /carriers/prepaid-terms/${term_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - *c_act
          trigger:
            - call: "POST /carriers/activations/${act_id}/provision"
              payload: {}
              as: SupportAgent
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and err == ERR_FORBIDDEN_ROLE"
            - "the same provision call as CapacityPlanner succeeds"
            - "the SupportAgent can still call POST /carriers/activations/${act_id}/fail on the same row"
            - "the SupportAgent's shared get access on the activation is not restricted"
            - "POST /carriers/add-ons/{id}/activate is refused for the SupportAgent with the same code"

      - name: fulfillment_operator_cannot_manage_the_catalogue
        claim_type: Cross-role denial
        grounds:
          - roles.FulfillmentOperator.exclusive_operations
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "A FulfillmentOperator owns media returns and nothing else, so catalogue and subscriber mutations are refused while its reads and the media return succeed."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. One CA eSIM block on file."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - *c_inv
          trigger:
            - call: "POST /carriers/subscribers"
              payload: { msisdn: "13055550111", full_name: "Unwanted Rider", state_code: "CA" }
              as: FulfillmentOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and err == ERR_FORBIDDEN_ROLE"
            - "GET /carriers/sim-inventories/${inv_id} as the same role succeeds"
            - "POST /carriers/sim-inventories/${inv_id}/return is allowed for this role and not for SupportAgent"
            - "POST /carriers/capacity-agreements is refused for this role"
            - "no subscriber row was created by the refused call"

      - name: retail_partner_is_scoped_to_its_own_inventory
        claim_type: Delegated scope
        grounds:
          - roles.RetailPartner.identity
          - validations[priority=3]
          - errors.ERR_NOT_RESOURCE_OWNER
        distinguishing_aspect: "A RetailPartner can register inventory for itself but is refused when the block names a different partner, so the ownership check applies to the body foreign key as well as the path."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Two CA partners on file."
          setup_api_calls:
            - *c_clock
            - *c_partner_ca2
            - &c_partner_other
              call: "POST /carriers/retail-partners"
              payload: { partner_name: "Sierra Retail Group", partner_state_codes: ["NV"] }
              as: CapacityPlanner
              captures: { partner_other_id: $.data.id }
          trigger:
            - call: "POST /carriers/sim-inventories"
              payload: { state_code: "CA", sim_media_type: "ESIM_PROFILE", unit_count: 5, retail_partner_id: "${partner_other_id}" }
              as: RetailPartner
              as_user_id: "${partner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and err == ERR_NOT_RESOURCE_OWNER"
            - "the partner's X-User-ID ${partner_id} does not equal the body retail_partner_id ${partner_other_id}"
            - "the same create naming its own id succeeds and returns inventory_status AVAILABLE"
            - "direct-to-subscriber inventory with no retail_partner_id is allowed for the partner role"
            - "a CapacityPlanner is not subject to the ownership check on the same body"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: optimistic_concurrency_version_increments_on_every_write
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers
          - entities.CapacityAgreement
          - concurrency_rules[term-purchase-stale-agreement]
        distinguishing_aspect: "Every mutation of an agreement advances its version by exactly one, including cascaded recomputes, so successive reads show a strictly increasing integer rather than a frozen or skipped value."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. One CA subscriber and one draft plan on the agreement about to be created."
          setup_api_calls:
            - *c_clock
            - *c_sub
          trigger:
            - call: "POST /carriers/capacity-agreements"
              payload: { host_network_name: "Version Host", state_code: "CA", data_rate_microcents_per_mb: 1237, voice_rate_microcents_per_min: 60, sms_rate_microcents_per_msg: 3, committed_data_mb: 16000, committed_voice_minutes: 200000, committed_sms_messages: 400000 }
              as: CapacityPlanner
              captures: { ag_v_id: $.data.id, ag_v_start: $.data.version }
          assert:
            - "ag_v_start == 1"
            - "POST /carriers/capacity-agreements/${ag_v_id}/activate returns version 2"
            - "offering a plan on the agreement returns it at version 3"
            - "a purchase against the agreement returns it at version 4"
            - "the version never decreases and never skips a value"
            - "GET /carriers/capacity-agreements/${ag_v_id} does not advance the version"

      - name: derived_field_reconciliation_after_source_change
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.wholesale_allocated_data_mb
          - entities.CapacityAgreement.fields.remaining_data_mb
        distinguishing_aspect: "remaining_data_mb is recomputed rather than cached, so it reflects every allocation and release on the next read without any explicit refresh call."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Active agreement with offered H3 and two CA subscribers."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - *c_plan
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
            - *c_sub
            - &c_sub_second_recon
              call: "POST /carriers/subscribers"
              payload: { msisdn: "13055550121", full_name: "Second Recon", state_code: "CA" }
              as: CapacityPlanner
              captures: { sub_recon_id: $.data.id }
          trigger:
            - call: "GET /carriers/capacity-agreements/${ag_id}/usage-summary"
              payload: {}
              as: CapacityPlanner
          assert:
            - "with no subscriber the summary reports allocated_data_mb 0 and remaining_data_mb 16000"
            - "after one purchase the summary reports 3000 and 13000 with no refresh call in between"
            - "after a second purchase the summary reports 6000 and 10000"
            - "the identity allocated_data_mb + remaining_data_mb == committed_data_mb holds on every read"
            - "retiring the plan while both terms are live is refused, so a plan status change cannot silently drop the derived value"

      - name: rate_threshold_trigger_on_data_allotment
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.deprioritization_check
          - calculations.overage_threshold_split
          - entities.Subscriber.fields.deprioritized_this_cycle
        distinguishing_aspect: "The allotment is a cumulative per-cycle threshold, so the subscriber crosses it once and stays deprioritized for the rest of the cycle while overage keeps accumulating megabyte by megabyte."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Activated CA subscriber on H3 with a 3000-megabyte allotment."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - *c_plan
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
            - *c_inv
            - *c_sub
            - *c_term
            - call: "POST /carriers/prepaid-terms/${term_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - *c_act
            - call: "POST /carriers/activations/${act_id}/provision"
              payload: {}
              as: CapacityPlanner
            - call: "POST /carriers/activations/${act_id}/complete"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - &c_bulk_consume
              call: "POST /carriers/subscribers/${sub_id}/consume_data"
              payload: { data_mb: 5000 }
              as: CapacityPlanner
          trigger:
            - call: "POST /carriers/subscribers/${sub_id}/run_cycle"
              payload: {}
              as: CapacityPlanner
          assert:
            - "after 5000 megabytes the subscriber is deprioritized and overage is 2000 megabytes"
            - "the frozen cycle row reports cycle_data_used_mb == 5000"
            - "the next cycle resets data_used_mb_cycle to 0 and deprioritized_this_cycle to false"
            - "the reset does not erase the closed cycle's frozen values"
            - "a second bulk consume after the roll arms deprioritization again from the fresh baseline"

      - name: cascading_side_effects_ordering_across_three_entities
        claim_type: cascading_side_effects
        grounds:
          - state_machines.PrepaidTerm.AWAITING_ACTIVATION_to_ACTIVE
          - calculations.wholesale_allocated_data_mb
          - state_machines.Plan.OFFERED_to_ACTIVE
        distinguishing_aspect: "Activation completion mutates the activation, the term, the subscriber, the plan and the agreement in one request, and the derived agreement numbers only settle correctly if the plan promotion is applied before the allocation recompute."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Active agreement with one offered H3 plan and one CA subscriber whose activation is provisioned."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - *c_plan
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
            - *c_inv
            - *c_sub
            - *c_term
            - call: "POST /carriers/prepaid-terms/${term_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - *c_act
            - call: "POST /carriers/activations/${act_id}/provision"
              payload: {}
              as: CapacityPlanner
          trigger:
            - call: "POST /carriers/activations/${act_id}/complete"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
          assert:
            - "Activation.${act_id} reports activation_status == COMPLETED with accepted_msisdn == provisioned_msisdn"
            - "PrepaidTerm.${term_id} reports term_status == ACTIVE with starts_at set and expires_at exactly 3 months later"
            - "Subscriber.${sub_id} reports subscriber_status == ACTIVE and allocation_status == ALLOCATED"
            - "Plan.${plan_id} reports plan_status == ACTIVE"
            - "GET /carriers/capacity-agreements/${ag_id}/usage-summary reports allocated_data_mb == 3000 and remaining_data_mb == 13000"
            - "exactly one CycleRecord exists for the term, at cycle_index 1 with cycle_status OPEN"

      - name: idempotency_of_repeated_reads_and_the_clock_endpoint
        claim_type: idempotency
        grounds:
          - endpoints.GET_/carriers/capacity-agreements/{id}/usage-summary
          - endpoints.POST_/carriers/_clock/set_current_utc
        distinguishing_aspect: "Repeating a read never changes state and re-setting the clock to the same instant is a no-op, so a fixture can safely re-issue either."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. One active agreement with one sold term."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - *c_plan
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
            - *c_inv
            - *c_sub
            - *c_term
            - call: "POST /carriers/prepaid-terms/${term_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
          trigger:
            - call: "GET /carriers/capacity-agreements/${ag_id}/usage-summary"
              payload: {}
              as: CapacityPlanner
          assert:
            - "two consecutive reads of the same summary return byte-identical data"
            - "the agreement's version is the same before and after both reads"
            - "re-setting the clock to 2026-10-01T00:00:00Z returns the same instant and changes no business quantity"
            - "the term's deferred_revenue_cents is unchanged across the repeated reads"
            - "a read of a subscriber who has no cycle yet returns zeros rather than an error"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_visibility_of_allocation_after_purchase
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.wholesale_allocated_data_mb
          - endpoints.POST_/carriers/prepaid-terms/{id}/purchase
        distinguishing_aspect: "Every recomputed field is visible in the same response or on the very next read, so no reconciliation delay separates a purchase from its effect on the agreement."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Active agreement with offered H3 and one CA subscriber holding a quoted term."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - *c_plan
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
            - *c_sub
            - *c_term
          trigger:
            - call: "POST /carriers/prepaid-terms/${term_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
          assert:
            - "the purchase response already carries term_status PURCHASED with term_price_cents 1999"
            - "the very next read of the agreement reports allocated_data_mb 3000 with no delay or refresh"
            - "Plan.${plan_id} already reports plan_status ACTIVE on the next read"
            - "the subscriber's allocation_status is already HELD on the next read"
            - "no endpoint exposes a pending or stale flag for any of these fields"
