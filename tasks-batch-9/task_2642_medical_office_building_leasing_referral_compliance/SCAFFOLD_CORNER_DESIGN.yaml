              payload: { legal_name: "Lakeside Oncology Partners LLP", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "ONCOLOGY", is_physician_owned: true, npi: "1234568491" }
              as: PortfolioAdmin
              captures: { e1_t_id: $.data.id }
            - call: "POST /leases"
              payload: { building_id: "${e1_b_id}", suite_id: "${e1_s_id}", tenant_id: "${e1_t_id}", lease_type: "DIRECT", term_start: "2026-09-01", term_end: "2029-08-31", base_rent_psf_annual: 30.00 }
              as: LeasingAgent
              captures: { e1_l_id: $.data.id, e1_l_v: $.data.version }
            - call: "POST /leases/${e1_l_id}/appraisals"
              payload: { expected_lease_version: "${e1_l_v}", appraiser_firm: "Harbor Valuation LLC", appraisal_date: "2026-07-15", opinion_low_psf: 29.00, opinion_high_psf: 33.00, independence_attested: true }
              as: ComplianceOfficer
