# =============================================================================
# Task 1880 — Fixed Asset & Depreciation Management (scaffold seed tables)
# =============================================================================

scenario: |
  1880. Fixed Asset & Depreciation Management (corporate fixed asset accounting):
  capitalization policy & project cost accumulation (CIP), in-service date &
  useful life assignment, depreciation method by book vs tax & bonus depreciation,
  transfer/disposal & gain-loss calculation, physical inventory & tagging
  reconciliation, impairment indicator review, component accounting & major
  repair classification, property tax & insurance schedule feed

domain_name: fixed-asset-depreciation
api_prefix: /

complexity_profile:
  primary_archetype: ledger_reconciliation      # book ledger vs tax ledger over identical asset data
  secondary_archetype: compliance_audit         # SoD approvals, inventory attestation, impairment review
  complexity_layers:
    - dual_variant_calculation                  # BOOK vs TAX depreciation; BOOK vs TAX gain/loss
    - cascading_side_effects                    # run post -> entries -> accumulated -> auto FULLY_DEPRECIATED; disposal -> component cascade
    - ops_run_checkpoint                        # monthly DepreciationRun advances the posting epoch
    - optimistic_concurrency                    # OCC on FixedAsset.version for PATCH and impairment confirm
  entity_topology: flat                         # peer collections joined by FK references; no nested creation URLs
  state_machine_shape: branching                # Disposal (fork + revision loop), InventoryRun (recount cycle), others guarded/linear
  relationship_patterns:
    - one_to_many                               # CapitalProject -> CIPCostLine, InventoryRun -> InventoryCountLine, FixedAsset -> DepreciationEntry
    - self_referential                          # FixedAsset.parent_asset_id (component accounting / major repairs)
    - cross_aggregate                           # Disposal/ImpairmentReview/ExternalSchedule reference FixedAsset across aggregates
  role_model: segregation_of_duties             # preparer != approver on capitalize / disposal approve / impairment confirm
  consistency_model: immediate                  # every mutation + cascade is atomic in the request

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: AssetClass
    parent: null
    common_fields: true
    fields:
      - { name: class_code, type: string, source: input, description: "Unique class code, e.g. 'MACHINERY'" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: capitalization_threshold_cents, type: integer, source: input, description: "Minimum cost to capitalize; below this a project/component cannot be capitalized" }
      - { name: default_useful_life_months, type: integer, source: input, description: "Default book useful life in months (> 0)" }
      - { name: book_method, type: enum, source: input, description: "STRAIGHT_LINE | DOUBLE_DECLINING — default book method for assets in this class" }
      - { name: tax_method, type: enum, source: input, description: "MACRS_5YR | MACRS_7YR | TAX_STRAIGHT_LINE — default tax method" }
      - { name: bonus_depreciation_allowed, type: boolean, source: input, description: "Whether assets in this class may elect bonus depreciation" }

  - name: CapitalProject
    parent: null
    common_fields: true
    fields:
      - { name: project_code, type: string, source: input, description: "Unique project code" }
      - { name: name, type: string, source: input, description: "Project name" }
      - { name: asset_class_id, type: string, source: input, description: "FK -> AssetClass.id; target class for the capitalized asset" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator (SoD: cannot capitalize own project)" }
      - { name: total_accumulated_cents, type: integer, source: computed, default: 0, description: "= sum of amount_cents over CIPCostLine with status POSTED for this project" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> CAPITALIZED | CANCELLED" }
      - { name: capitalized_asset_id, type: string, source: system, description: "FK -> FixedAsset.id; set by capitalize; null until CAPITALIZED" }

  - name: CIPCostLine
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CapitalProject.id" }
      - { name: amount_cents, type: integer, source: input, description: "Cost amount; must be > 0" }
      - { name: cost_type, type: enum, source: input, description: "MATERIAL | LABOR | VENDOR_INVOICE | OTHER" }
      - { name: incurred_date, type: string, source: input, description: "ISO date the cost was incurred" }
      - { name: status, type: enum, source: system, default: POSTED, description: "POSTED -> REVERSED (terminal)" }

  - name: FixedAsset
    parent: null
    common_fields: true
    fields:
      - { name: asset_tag, type: string, source: input, description: "Unique physical tag" }
      - { name: description, type: string, source: input, description: "Asset description" }
      - { name: asset_class_id, type: string, source: input, description: "FK -> AssetClass.id" }
      - { name: parent_asset_id, type: string, source: input, description: "FK -> FixedAsset.id; null for primary assets; set for component (major-repair) assets" }
      - { name: source, type: enum, source: system, description: "PURCHASE | CIP_CAPITALIZATION | COMPONENT_ADDITION" }
      - { name: acquisition_cost_cents, type: integer, source: input, description: "Capitalized cost (> 0). Input on direct/component create; system-set from project total on capitalize" }
      - { name: salvage_value_cents, type: integer, source: input, default: 0, description: "Book salvage value; >= 0 and < acquisition_cost_cents" }
      - { name: useful_life_months, type: integer, source: input, description: "Book life; defaults from AssetClass.default_useful_life_months" }
      - { name: book_method, type: enum, source: input, description: "STRAIGHT_LINE | DOUBLE_DECLINING; defaults from class" }
      - { name: tax_method, type: enum, source: input, description: "MACRS_5YR | MACRS_7YR | TAX_STRAIGHT_LINE; defaults from class" }
      - { name: bonus_elected, type: boolean, source: input, default: false, description: "Elect 60% bonus depreciation in tax year 1; class must allow it" }
      - { name: cost_center, type: string, source: input, description: "Owning cost center" }
      - { name: location, type: string, source: input, description: "Physical location code" }
      - { name: in_service_date, type: string, source: system, description: "ISO date set by place-in-service; null while DRAFT" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> IN_SERVICE -> FULLY_DEPRECIATED -> DISPOSED; IN_SERVICE -> DISPOSED also allowed" }
      - { name: accumulated_book_cents, type: integer, source: computed, default: 0, description: "= sum of amount_cents over DepreciationEntry(asset, ledger=BOOK)" }
      - { name: accumulated_tax_cents, type: integer, source: computed, default: 0, description: "= sum of amount_cents over DepreciationEntry(asset, ledger=TAX)" }
      - { name: impairment_total_cents, type: integer, source: computed, default: 0, description: "= sum of write_down_cents over WRITTEN_DOWN ImpairmentReview for this asset" }
      - { name: net_book_value_cents, type: integer, source: computed, description: "= acquisition_cost_cents - accumulated_book_cents - impairment_total_cents" }
      - { name: open_inventory_exception, type: boolean, source: computed, default: false, description: "true iff an InventoryCountLine for this asset has reconciliation_status in {MISSING, LOCATION_MISMATCH} in an InventoryRun whose status != CLOSED" }

  - name: DepreciationRun
    parent: null
    common_fields: true
    fields:
      - { name: period, type: string, source: input, description: "Posting period 'YYYY-MM'; exactly one run (OPEN or POSTED) per period" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> POSTED (terminal)" }
      - { name: entries_created_count, type: integer, source: computed, default: 0, description: "Entries created by the post" }
      - { name: total_book_amount_cents, type: integer, source: computed, default: 0, description: "Sum of BOOK entry amounts in this run" }
      - { name: total_tax_amount_cents, type: integer, source: computed, default: 0, description: "Sum of TAX entry amounts in this run" }

  - name: DepreciationEntry
    parent: null
    common_fields: false   # immutable ledger lines: id + created_at only; no update endpoint
    fields:
      - { name: run_id, type: string, source: system, description: "FK -> DepreciationRun.id; null when source = DISPOSAL_FINAL" }
      - { name: disposal_id, type: string, source: system, description: "FK -> Disposal.id; null when source = RUN" }
      - { name: asset_id, type: string, source: system, description: "FK -> FixedAsset.id" }
      - { name: ledger, type: enum, source: system, description: "BOOK | TAX" }
      - { name: period, type: string, source: system, description: "YYYY-MM the entry depreciates" }
      - { name: amount_cents, type: integer, source: system, description: "Depreciation amount (>= 0)" }
      - { name: source, type: enum, source: system, description: "RUN | DISPOSAL_FINAL" }

  - name: Disposal
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> FixedAsset.id" }
      - { name: disposal_type, type: enum, source: input, description: "SALE | SCRAP | TRANSFER (TRANSFER = inter-cost-center move; asset is NOT derecognized)" }
      - { name: proceeds_cents, type: integer, source: input, default: 0, description: "Required (>= 0) for SALE; optional for SCRAP; must be 0 for TRANSFER" }
      - { name: transfer_to_cost_center, type: string, source: input, description: "Required for TRANSFER; forbidden otherwise" }
      - { name: effective_date, type: string, source: input, description: "ISO date of disposal; period = its YYYY-MM" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of creator (SoD vs approver)" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approver; null until APPROVED" }
      - { name: book_gain_loss_cents, type: integer, source: computed, description: "Set at post: proceeds_cents - (acquisition_cost_cents - accumulated_book_cents - impairment_total_cents); 0 for TRANSFER" }
      - { name: tax_gain_loss_cents, type: integer, source: computed, description: "Set at post: proceeds_cents - (acquisition_cost_cents - accumulated_tax_cents); 0 for TRANSFER" }
      - { name: auto_created, type: boolean, source: system, default: false, description: "true for companion SCRAP disposals spawned by a parent-asset disposal cascade" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED -> APPROVED -> POSTED; REQUESTED -> REJECTED -> REQUESTED (resubmit)" }

  - name: InventoryRun
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Run label" }
      - { name: scope_type, type: enum, source: input, description: "ALL | LOCATION | COST_CENTER" }
      - { name: scope_value, type: string, source: input, description: "Required when scope_type is LOCATION or COST_CENTER; matched against FixedAsset.location / .cost_center" }
      - { name: status, type: enum, source: system, default: COUNTING, description: "COUNTING -> RECONCILING -> CLOSED; RECONCILING -> COUNTING (recount cycle)" }
      - { name: expected_count, type: integer, source: computed, description: "Seeded line count (assets in scope at creation)" }
      - { name: matched_count, type: integer, source: computed, default: 0, description: "Lines with reconciliation_status = MATCHED" }
      - { name: missing_count, type: integer, source: computed, default: 0, description: "Lines with reconciliation_status = MISSING whose asset is not DISPOSED" }
      - { name: mismatch_count, type: integer, source: computed, default: 0, description: "Lines with reconciliation_status = LOCATION_MISMATCH" }

  - name: InventoryCountLine
    parent: null
    common_fields: true
    fields:
      - { name: run_id, type: string, source: system, description: "FK -> InventoryRun.id" }
      - { name: asset_id, type: string, source: system, description: "FK -> FixedAsset.id" }
      - { name: found, type: boolean, source: input, description: "null until counted; true = physically found" }
      - { name: counted_location, type: string, source: input, description: "Required when found = true" }
      - { name: condition, type: enum, source: input, default: GOOD, description: "GOOD | DAMAGED; DAMAGED auto-opens an ImpairmentReview" }
      - { name: reconciliation_status, type: enum, source: computed, default: PENDING, description: "PENDING | MATCHED (found && location matches) | LOCATION_MISMATCH (found && location differs) | MISSING (not found)" }

  - name: ImpairmentReview
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> FixedAsset.id" }
      - { name: indicator, type: enum, source: input, description: "DAMAGE | OBSOLESCENCE | MARKET_DECLINE (auto-created inventory reviews always use DAMAGE)" }
      - { name: source, type: enum, source: system, default: MANUAL, description: "MANUAL | INVENTORY (auto-created by a DAMAGED count)" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; 'system' when source = INVENTORY (SoD check skipped for system-created reviews)" }
      - { name: recoverable_value_cents, type: integer, source: input, description: "Set at confirm; recoverable amount (>= 0)" }
      - { name: write_down_cents, type: integer, source: computed, description: "Set at confirm = max(0, net_book_value_cents - recoverable_value_cents)" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> WRITTEN_DOWN | DISMISSED (both terminal)" }

  - name: ExternalSchedule
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> FixedAsset.id" }
      - { name: schedule_type, type: enum, source: input, description: "PROPERTY_TAX | INSURANCE" }
      - { name: schedule_year, type: integer, source: input, description: "Tax/policy year; unique per (asset_id, schedule_type, schedule_year)" }
      - { name: assessed_value_cents, type: integer, source: input, description: "Required for PROPERTY_TAX; null otherwise" }
      - { name: annual_premium_cents, type: integer, source: input, description: "Required for INSURANCE; null otherwise" }
      - { name: property_tax_amount_cents, type: integer, source: computed, description: "PROPERTY_TAX only = round_half_up(assessed_value_cents * 0.0125, 0); null for INSURANCE" }
      - { name: status, type: enum, source: system, default: IMPORTED, description: "IMPORTED -> APPLIED (terminal)" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CapitalProject
    initial_state: OPEN
    terminal_states: [CAPITALIZED, CANCELLED]
    transitions:
      - from: OPEN
        to: CAPITALIZED
        trigger: "POST /capital-projects/{id}/capitalize"
        actor: Controller
        preconditions:
          - "project.status == OPEN (else ERR_PROJECT_NOT_OPEN)"
          - "SoD: X-User-ID != project.created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "total_accumulated_cents >= AssetClass.capitalization_threshold_cents of project.asset_class_id (else ERR_BELOW_CAPITALIZATION_THRESHOLD)"
        side_effects:
          - "create FixedAsset: source=CIP_CAPITALIZATION, asset_class_id=project.asset_class_id, acquisition_cost_cents=total_accumulated_cents, status=DRAFT, asset_tag/description from payload"
          - "project.capitalized_asset_id := new asset id"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /capital-projects/{id}/cancel"
        actor: Controller
        preconditions:
          - "project.status == OPEN (else ERR_PROJECT_NOT_OPEN)"
        side_effects:
          - "posted CIP cost lines remain POSTED (audit trail); project is written off, no asset created"

  - entity: CIPCostLine
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /cip-cost-lines/{id}/reverse"
        actor: AssetAccountant
        preconditions:
          - "line.status == POSTED (else ERR_INVALID_STATE)"
          - "parent project.status == OPEN (else ERR_PROJECT_NOT_OPEN)"
        side_effects:
          - "project.total_accumulated_cents recomputed (decreases by line.amount_cents); project.version += 1; project.updated_at refreshed"

  - entity: FixedAsset
    initial_state: DRAFT
    terminal_states: [DISPOSED]
    transitions:
      - from: DRAFT
        to: IN_SERVICE
        trigger: "POST /fixed-assets/{id}/place-in-service"
        actor: AssetAccountant
        preconditions:
          - "asset.status == DRAFT (else ERR_INVALID_STATE)"
        side_effects:
          - "asset.in_service_date := payload.in_service_date"
      - from: IN_SERVICE
        to: FULLY_DEPRECIATED
        trigger: "system (automatic during DepreciationRun post when accumulated_book_cents reaches acquisition_cost_cents - salvage_value_cents - impairment_total_cents)"
        actor: system
        preconditions:
          - "accumulated_book_cents >= acquisition_cost_cents - salvage_value_cents - impairment_total_cents after the run's entries are applied"
        side_effects: []
        note: "book ledger drives the lifecycle; tax ledger never triggers this transition"
      - from: IN_SERVICE
        to: FULLY_DEPRECIATED
        trigger: "system (automatic on ImpairmentReview confirm when remaining depreciable basis <= 0)"
        actor: system
        preconditions:
          - "acquisition_cost_cents - salvage_value_cents - accumulated_book_cents - impairment_total_cents <= 0 after the write-down is applied"
        side_effects: []
      - from: IN_SERVICE
        to: DISPOSED
        trigger: "POST /disposals/{id}/post with disposal_type SALE or SCRAP on this asset"
        actor: AssetAccountant
        preconditions:
          - "disposal.status == APPROVED"
        side_effects:
          - "cascade: every child FixedAsset with parent_asset_id == this asset and status IN {IN_SERVICE, FULLY_DEPRECIATED} is itself disposed via an auto-created companion POSTED SCRAP Disposal (proceeds 0, auto_created=true), each computing its own final entries and gain/loss"
      - from: FULLY_DEPRECIATED
        to: DISPOSED
        trigger: "POST /disposals/{id}/post with disposal_type SALE or SCRAP on this asset"
        actor: AssetAccountant
        preconditions:
          - "disposal.status == APPROVED"
        side_effects:
          - "same component cascade as IN_SERVICE -> DISPOSED"
      - from: IN_SERVICE
        to: IN_SERVICE
        trigger: "POST /disposals/{id}/post with disposal_type TRANSFER"
        actor: AssetAccountant
        preconditions:
          - "disposal.status == APPROVED"
        side_effects:
          - "asset.cost_center := disposal.transfer_to_cost_center; no derecognition, no gain/loss, no final entries; components NOT cascaded"
        note: "self-transition records the transfer; status remains IN_SERVICE"

  - entity: DepreciationRun
    initial_state: OPEN
    terminal_states: [POSTED]
    transitions:
      - from: OPEN
        to: POSTED
        trigger: "POST /depreciation-runs/{id}/post"
        actor: AssetAccountant
        preconditions:
          - "run.status == OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "for each FixedAsset with status IN_SERVICE, in_service period <= run.period, and remaining book or tax eligibility: create DepreciationEntry rows (source=RUN) per book_period_depreciation and tax_period_depreciation"
          - "each created entry increments its asset's accumulated_book_cents / accumulated_tax_cents by amount_cents and bumps asset.version"
          - "any asset whose accumulated_book_cents reaches its depreciable basis auto-transitions IN_SERVICE -> FULLY_DEPRECIATED"
          - "run.entries_created_count / total_book_amount_cents / total_tax_amount_cents set"

  - entity: Disposal
    initial_state: REQUESTED
    terminal_states: [POSTED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /disposals/{id}/approve"
        actor: Controller
        preconditions:
          - "disposal.status == REQUESTED (else ERR_INVALID_STATE)"
          - "SoD: X-User-ID != disposal.requested_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "disposal.approved_by_user_id := X-User-ID"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /disposals/{id}/reject"
        actor: Controller
        preconditions:
          - "disposal.status == REQUESTED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: REJECTED
        to: REQUESTED
        trigger: "POST /disposals/{id}/resubmit"
        actor: AssetAccountant
        preconditions:
          - "disposal.status == REJECTED (else ERR_INVALID_STATE)"
          - "asset.status still IN_SERVICE or FULLY_DEPRECIATED (else ERR_ALREADY_DISPOSED)"
        side_effects:
          - "proceeds_cents / effective_date / transfer_to_cost_center replaced by payload values and re-validated"
        note: "revision loop: REJECTED requests can be corrected and resubmitted"
      - from: APPROVED
        to: POSTED
        trigger: "POST /disposals/{id}/post"
        actor: AssetAccountant
        preconditions:
          - "disposal.status == APPROVED (else ERR_INVALID_STATE)"
          - "effective_date's period must be later than the latest POSTED DepreciationRun period (re-validated at post; else ERR_PERIOD_CLOSED)"
          - "compliance gate: for SALE and TRANSFER, asset.open_inventory_exception must be false (else ERR_ASSET_UNDER_INVENTORY_REVIEW); SCRAP is exempt (it is the resolution path for missing assets)"
        side_effects:
          - "SALE/SCRAP: if asset.status == IN_SERVICE and effective_date's day >= 15, create final DepreciationEntry rows (source=DISPOSAL_FINAL, disposal_id=this) for the effective period on BOOK and TAX ledgers and apply them to accumulated_*_cents"
          - "SALE/SCRAP: compute book_gain_loss_cents and tax_gain_loss_cents (evaluation order pinned in disposal_gain_loss calculation)"
          - "SALE/SCRAP: asset -> DISPOSED; then component cascade per FixedAsset state machine"
          - "TRANSFER: asset.cost_center := transfer_to_cost_center; gain/loss fields := 0; asset stays IN_SERVICE"

  - entity: InventoryRun
    initial_state: COUNTING
    terminal_states: [CLOSED]
    transitions:
      - from: COUNTING
        to: RECONCILING
        trigger: "POST /inventory-runs/{id}/begin-reconciliation"
        actor: InventoryClerk
        preconditions:
          - "run.status == COUNTING (else ERR_INVALID_STATE)"
          - "every seeded InventoryCountLine has found != null (else ERR_UNCOUNTED_LINES)"
        side_effects: []
      - from: RECONCILING
        to: COUNTING
        trigger: "POST /inventory-runs/{id}/recount"
        actor: InventoryClerk
        preconditions:
          - "run.status == RECONCILING (else ERR_INVALID_STATE)"
        side_effects: []
        note: "recount cycle: lines can be re-counted (upserted) after returning to COUNTING"
      - from: RECONCILING
        to: CLOSED
        trigger: "POST /inventory-runs/{id}/close"
        actor: Controller
        preconditions:
          - "run.status == RECONCILING (else ERR_INVALID_STATE)"
          - "every seeded line has reconciliation_status == MATCHED, OR its asset is DISPOSED (else ERR_UNRESOLVED_INVENTORY_ITEMS)"
        side_effects:
          - "closing clears open_inventory_exception on all counted assets (recomputed from non-CLOSED runs)"

  - entity: ImpairmentReview
    initial_state: OPEN
    terminal_states: [WRITTEN_DOWN, DISMISSED]
    transitions:
      - from: OPEN
        to: WRITTEN_DOWN
        trigger: "POST /impairment-reviews/{id}/confirm"
        actor: Controller
        preconditions:
          - "review.status == OPEN (else ERR_INVALID_STATE)"
          - "OCC: expected_asset_version == asset.version (else ERR_STALE_VERSION)"
          - "SoD: for source == MANUAL reviews, X-User-ID != review.created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "write_down_cents = net_book_value_cents - recoverable_value_cents must be > 0 (else ERR_NO_IMPAIRMENT_INDICATED — dismiss instead)"
        side_effects:
          - "asset.impairment_total_cents += write_down_cents; asset.version += 1 (link 1: review -> asset field)"
          - "asset.net_book_value_cents recomputed; remaining depreciable basis recomputed (link 2: derived fields)"
          - "if remaining depreciable basis <= 0: asset auto-transitions IN_SERVICE -> FULLY_DEPRECIATED (link 3: state auto-transition)"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /impairment-reviews/{id}/dismiss"
        actor: Controller
        preconditions:
          - "review.status == OPEN (else ERR_INVALID_STATE)"
        side_effects: []

  - entity: ExternalSchedule
    initial_state: IMPORTED
    terminal_states: [APPLIED]
    transitions:
      - from: IMPORTED
        to: APPLIED
        trigger: "POST /external-schedules/{id}/apply"
        actor: Controller
        preconditions:
          - "schedule.status == IMPORTED (else ERR_INVALID_STATE)"
          - "asset.status != DISPOSED (else ERR_ALREADY_DISPOSED)"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: asset-update-stale-version
    parent_entity: FixedAsset
    write_endpoint: "PATCH /fixed-assets/{id}"
    occ_field: expected_asset_version
    description: |
      Updating a FixedAsset whose version has advanced since the client last
      observed it is rejected. Every mutation of the asset (including cascaded
      ones such as depreciation postings or impairment write-downs) increments
      FixedAsset.version, so a client holding an older version is writing
      against a stale basis.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: impairment-confirm-stale-asset
    parent_entity: FixedAsset
    write_endpoint: "POST /impairment-reviews/{id}/confirm"
    occ_field: expected_asset_version
    description: |
      Confirming an impairment review pins the FixedAsset version the
      recoverable-value estimate was computed against. If the asset's version
      has advanced since that observation (for example a depreciation run has
      posted further accumulated depreciation, changing net book value), the
      confirm is rejected as based on a stale carrying amount.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: cip_accumulated_total
    trigger: "CIPCostLine created (status POSTED) or reversed (POSTED -> REVERSED)"
    algorithm: aggregation
    formula: |
      CapitalProject.total_accumulated_cents =
        sum(amount_cents for CIPCostLine where project_id == project.id and status == POSTED)
      REVERSED lines are excluded; invariant: total always equals the POSTED-only sum.
    input_set: "all CIPCostLine rows of the project; status filter: POSTED only"
    precision: "integer cents, exact"

  - name: book_period_depreciation
    trigger: "DepreciationRun post (per eligible asset) and disposal post (final entry)"
    algorithm: chronological
    formula: |
      depreciable_basis = acquisition_cost_cents - salvage_value_cents - impairment_total_cents
      months_posted = count of BOOK DepreciationEntry rows for the asset
      Eligibility: asset.status == IN_SERVICE, in_service period (YYYY-MM) <= run period,
                   months_posted < useful_life_months, and accumulated_book_cents < depreciable_basis.
      STRAIGHT_LINE:
        remaining_basis   = depreciable_basis - accumulated_book_cents
        remaining_months  = useful_life_months - months_posted
        amount = round_half_up(remaining_basis / remaining_months, 0)
      DOUBLE_DECLINING:
        amount = round_half_up(net_book_value_cents * 2 / useful_life_months, 0)
        if accumulated_book_cents + amount > depreciable_basis:
          amount = depreciable_basis - accumulated_book_cents      # cap, never over-depreciate
      FINAL MONTH (either method): when months_posted == useful_life_months - 1,
        amount = depreciable_basis - accumulated_book_cents         # remainder plug
    input_set: "FixedAsset rows with status == IN_SERVICE and in_service period <= run period; FULLY_DEPRECIATED/DRAFT/DISPOSED excluded"
    precision: "integer cents, round_half_up; per-month rounding pinned — round each month independently, final month takes the remainder plug (sum-then-round is NOT used)"
    variants:
      - name: straight_line
        when: "asset.book_method == STRAIGHT_LINE"
        difference: "level charge over remaining months over remaining (impairment-adjusted) basis"
      - name: double_declining
        when: "asset.book_method == DOUBLE_DECLINING"
        difference: "NBV-declining charge capped at depreciable basis; produces a different amount for identical cost/life inputs"

  - name: tax_period_depreciation
    trigger: "DepreciationRun post (per eligible asset) and disposal post (final entry)"
    algorithm: tiered_pricing
    formula: |
      tax_year_index = (run period year) - (in_service year) + 1
      MACRS_5YR: rates = MACRS_5_RATES; MACRS_7YR: rates = MACRS_7_RATES
      if tax_method == TAX_STRAIGHT_LINE:
        annual = round_half_up(acquisition_cost_cents / (useful_life_months / 12), 0) prorated monthly:
        amount = round_half_up(acquisition_cost_cents / useful_life_months, 0);
        final tax month plug = acquisition_cost_cents - accumulated_tax_cents
      else:
        if tax_year_index > len(rates): no entry (tax basis exhausted)
        if bonus_elected and tax_year_index == 1:
          annual = acquisition_cost_cents * BONUS_RATE_PCT
                 + (acquisition_cost_cents * (1 - BONUS_RATE_PCT)) * rates[1]
        else:
          base = bonus_elected ? acquisition_cost_cents * (1 - BONUS_RATE_PCT)
                               : acquisition_cost_cents
          annual = base * rates[tax_year_index]
        amount = round_half_up(annual / 12, 0) for each period within the tax year;
        December of each calendar year takes the plug: annual - sum(prior 11 monthly amounts).
        Tax years are calendar years; year 1 begins at the in-service year and all 12
        monthly entries of year 1 are posted regardless of the in-service month
        (the half-year convention is already baked into rates[1]).
      Cap: accumulated_tax_cents never exceeds acquisition_cost_cents; the entry that would
      cross the cap is reduced to acquisition_cost_cents - accumulated_tax_cents.
    input_set: "same eligible set as book_period_depreciation; an asset may be book-exhausted but still receive TAX entries and vice versa"
    constants:
      BONUS_RATE_PCT: 0.60
      MACRS_5_RATES: [0.2000, 0.3200, 0.1920, 0.1152, 0.1152, 0.0576]
      MACRS_7_RATES: [0.1429, 0.2449, 0.1749, 0.1249, 0.0893, 0.0892, 0.0893, 0.0446]
    precision: "integer cents, round_half_up; annual amount rounded to cents first, monthly = round_half_up(annual/12, 0), December = annual minus prior 11 months"
    variants:
      - name: bonus_elected_year1
        when: "asset.bonus_elected == true and tax_year_index == 1"
        difference: "60% immediate expensing plus MACRS rate[1] on the remaining 40% — materially larger year-1 deduction"
      - name: standard_macrs
        when: "bonus not elected (or class disallows bonus)"
        difference: "pure rate-table deduction; identical inputs produce a different (smaller year-1) amount"

  - name: disposal_gain_loss
    trigger: "Disposal post (SALE / SCRAP)"
    algorithm: chronological
    formula: |
      EVALUATION ORDER (pinned — each step feeds the next):
      1. Final-period depreciation: if asset.status == IN_SERVICE and
         day_of_month(disposal.effective_date) >= MID_MONTH_CUTOFF_DAY, create the
         effective period's BOOK and TAX entries (source = DISPOSAL_FINAL) per
         book_period_depreciation / tax_period_depreciation and apply them to
         accumulated_book_cents / accumulated_tax_cents. Day < 15: no final entries.
      2. book_gain_loss_cents = proceeds_cents
         - (acquisition_cost_cents - accumulated_book_cents - impairment_total_cents)
      3. tax_gain_loss_cents  = proceeds_cents
         - (acquisition_cost_cents - accumulated_tax_cents)
      TRANSFER postings skip steps 1-3 entirely: both gain/loss fields are 0.
    input_set: "the disposed asset; companion component disposals recompute per component asset"
    constants:
      MID_MONTH_CUTOFF_DAY: 15
    precision: "integer cents, exact"
    variants:
      - name: book_basis
        when: "book_gain_loss_cents"
        difference: "net of accumulated BOOK depreciation AND impairment write-downs"
      - name: tax_basis
        when: "tax_gain_loss_cents"
        difference: "net of accumulated TAX depreciation only; impairment ignored — same disposal, different gain/loss figure"

  - name: impairment_write_down
    trigger: "ImpairmentReview confirm"
    algorithm: threshold
    formula: |
      write_down_cents = max(0, net_book_value_cents - recoverable_value_cents)
      if write_down_cents == 0: reject confirm with ERR_NO_IMPAIRMENT_INDICATED
      On success: impairment_total_cents += write_down_cents;
      remaining depreciable basis = acquisition_cost_cents - salvage_value_cents
        - accumulated_book_cents - impairment_total_cents;
      if remaining basis <= 0: asset auto-transitions IN_SERVICE -> FULLY_DEPRECIATED.
      Future book_period_depreciation uses the reduced basis over remaining months
      (useful_life_months - months_posted).
    input_set: "the reviewed asset (must be IN_SERVICE)"
    precision: "integer cents, exact"

  - name: inventory_line_reconciliation
    trigger: "InventoryCountLine upsert; also re-evaluated at run close and when FixedAsset.location is patched"
    algorithm: constraint_propagation
    formula: |
      if found == null: reconciliation_status = PENDING
      elif found == false: reconciliation_status = MISSING
      elif counted_location == asset.location: reconciliation_status = MATCHED
      else: reconciliation_status = LOCATION_MISMATCH
      Run counters: matched_count / missing_count / mismatch_count recount lines by
      reconciliation_status (missing_count excludes lines whose asset is DISPOSED).
      FixedAsset.open_inventory_exception = exists a line for the asset with
      reconciliation_status in {MISSING, LOCATION_MISMATCH} in a run with status != CLOSED.
    input_set: "InventoryCountLine rows of the run; asset lookup by asset_id"
    precision: "n/a (derivation)"

  - name: property_tax_amount
    trigger: "ExternalSchedule creation (schedule_type == PROPERTY_TAX)"
    algorithm: threshold
    formula: |
      property_tax_amount_cents = round_half_up(assessed_value_cents * MILL_RATE, 0)
      INSURANCE schedules: property_tax_amount_cents = null.
    input_set: "the ExternalSchedule row being created"
    constants:
      MILL_RATE: 0.0125
    precision: "integer cents, round_half_up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role must be one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role is permitted for the endpoint per §1.5 roles; segregation of duties: X-User-ID must differ from the recorded preparer on capitalize (vs created_by_user_id), disposal approve (vs requested_by_user_id), and impairment confirm of MANUAL reviews (vs created_by_user_id)"
    error_id: "ERR_FORBIDDEN / ERR_SEGREGATION_OF_DUTIES"
    http_status: 403
    applies_to: "all endpoints; SoD on POST /capital-projects/{id}/capitalize, POST /disposals/{id}/approve, POST /impairment-reviews/{id}/confirm"

  - priority: 3
    category: existence
    check: "Path ids and body FK references (asset_class_id, project_id, asset_id, parent_asset_id, run/asset on count-line upsert) must exist; count-line upsert also requires the (run, asset) line to have been seeded at run creation"
    error_id: "ERR_NOT_FOUND / ERR_ASSET_NOT_IN_SCOPE"
    http_status: 404
    applies_to: "all endpoints with ids"

  - priority: 4
    category: state
    check: "Entity must be in the required state: project OPEN for cost-line create/reverse and capitalize; asset DRAFT for place-in-service; asset IN_SERVICE/FULLY_DEPRECIATED for disposal create; component parent asset IN_SERVICE at component creation; run OPEN for post; inventory run COUNTING for count upsert, RECONCILING for recount/close; disposal in the from-state of each transition; review OPEN; schedule IMPORTED"
    error_id: "ERR_INVALID_STATE / ERR_PROJECT_NOT_OPEN / ERR_ASSET_NOT_IN_SERVICE / ERR_ALREADY_DISPOSED / ERR_RUN_NOT_COUNTING"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_safety
    check: "Compliance gate: disposal post with disposal_type SALE or TRANSFER requires asset.open_inventory_exception == false; SCRAP is exempt (resolution path for missing assets)"
    error_id: ERR_ASSET_UNDER_INVENTORY_REVIEW
    http_status: 409
    applies_to: "POST /disposals/{id}/post"

  - priority: 6
    category: business_constraint
    check: "Uniqueness and structural rules: asset_tag unique; project_code and class_code unique; one run (OPEN or POSTED) per period; one POSTED run per period; one OPEN ImpairmentReview per asset; one ExternalSchedule per (asset_id, schedule_type, schedule_year); PATCH on IN_SERVICE asset may touch only {useful_life_months, salvage_value_cents, location, cost_center}"
    error_id: "ERR_DUPLICATE_TAG / ERR_DUPLICATE_RUN_PERIOD / ERR_PERIOD_ALREADY_POSTED / ERR_IMPAIRMENT_REVIEW_OPEN / ERR_DUPLICATE_SCHEDULE / ERR_FIELD_IMMUTABLE"
    http_status: 409
    applies_to: "create endpoints, PATCH /fixed-assets/{id}"

  - priority: 7
    category: business_temporal
    check: "Period rules: a new run period must be exactly latest POSTED period + 1 month (any period allowed when no POSTED run exists); disposal effective period must be later than the latest POSTED run period at creation and re-validated at post"
    error_id: "ERR_PERIOD_GAP / ERR_PERIOD_CLOSED"
    http_status: 409
    applies_to: "POST /depreciation-runs, POST /disposals, POST /disposals/{id}/post"

  - priority: 8
    category: business_fiscal
    check: "Amount rules: capitalize requires total_accumulated_cents >= class threshold; component (major-repair) creation requires acquisition_cost_cents >= class threshold (below-threshold repairs are expensed, not recorded); amount_cents > 0 on cost lines; acquisition_cost_cents > 0; salvage >= 0 and < cost; proceeds >= 0; TRANSFER requires transfer_to_cost_center and proceeds == 0, SALE requires explicit proceeds_cents, SCRAP proceeds optional; disposal effective_date >= in_service_date; bonus_elected requires class.bonus_depreciation_allowed; impairment confirm requires write_down > 0; PROPERTY_TAX requires assessed_value_cents, INSURANCE requires annual_premium_cents"
    error_id: "ERR_BELOW_CAPITALIZATION_THRESHOLD / ERR_INVALID_AMOUNT / ERR_INVALID_SALVAGE_VALUE / ERR_INVALID_DISPOSAL_FIELDS / ERR_BONUS_NOT_ALLOWED / ERR_NO_IMPAIRMENT_INDICATED / ERR_INVALID_SCHEDULE_FIELDS"
    http_status: 422
    applies_to: "create/action endpoints with monetary fields"

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- AssetClass ---
  - method: POST
    path: "/asset-classes"
    description: "Create an asset class (capitalization policy)"
    roles: [Controller]
    code: 201
    input: [class_code, name, capitalization_threshold_cents, default_useful_life_months, book_method, tax_method, bonus_depreciation_allowed]
    output: AssetClass
    side_effects: []

  - method: GET
    path: "/asset-classes/{id}"
    description: "Get an asset class"
    roles: [AssetAccountant, Controller, InventoryClerk, TaxAnalyst]
    code: 200
    input: []
    output: AssetClass
    side_effects: []

  # --- CapitalProject / CIP ---
  - method: POST
    path: "/capital-projects"
    description: "Create a CIP project"
    roles: [AssetAccountant]
    code: 201
    input: [project_code, name, asset_class_id]
    output: CapitalProject
    side_effects: ["status=OPEN, total_accumulated_cents=0, created_by_user_id := X-User-ID"]

  - method: GET
    path: "/capital-projects"
    description: "List projects with filters"
    roles: [AssetAccountant, Controller, InventoryClerk, TaxAnalyst]
    code: 200
    input: ["asset_class_id?", "capitalized_asset_id?", "status?"]
    output: CapitalProject[]
    side_effects: []

  - method: GET
    path: "/capital-projects/{id}"
    description: "Get a project"
    roles: [AssetAccountant, Controller, InventoryClerk, TaxAnalyst]
    code: 200
    input: []
    output: CapitalProject
    side_effects: []

  - method: POST
    path: "/capital-projects/{id}/capitalize"
    description: "Capitalize an OPEN project into a new DRAFT FixedAsset (SoD: creator cannot capitalize)"
    roles: [Controller]
    code: 200
    input: [asset_tag, description]
    output: CapitalProject
    side_effects:
      - "project -> CAPITALIZED; capitalized_asset_id set"
      - "create FixedAsset (source=CIP_CAPITALIZATION, acquisition_cost_cents=total_accumulated_cents, status=DRAFT)"

  - method: POST
    path: "/capital-projects/{id}/cancel"
    description: "Cancel (write off) an OPEN project"
    roles: [Controller]
    code: 200
    input: []
    output: CapitalProject
    side_effects: ["project -> CANCELLED"]

  - method: POST
    path: "/cip-cost-lines"
    description: "Post a cost line to an OPEN project"
    roles: [AssetAccountant]
    code: 201
    input: [project_id, amount_cents, cost_type, incurred_date]
    output: CIPCostLine
    side_effects: ["line POSTED; project.total_accumulated_cents recomputed; project.version += 1"]

  - method: GET
    path: "/capital-projects/{id}/cost-lines"
    description: "List cost lines of a project"
    roles: [AssetAccountant, Controller, InventoryClerk, TaxAnalyst]
    code: 200
    input: []
    output: CIPCostLine[]
    side_effects: []

  - method: POST
    path: "/cip-cost-lines/{id}/reverse"
    description: "Reverse a POSTED cost line"
    roles: [AssetAccountant]
    code: 200
    input: []
    output: CIPCostLine
    side_effects: ["line -> REVERSED; project.total_accumulated_cents recomputed; project.version += 1"]

  # --- FixedAsset ---
  - method: POST
    path: "/fixed-assets"
    description: "Create a purchased asset, or a component (major repair) when parent_asset_id is given"
    roles: [AssetAccountant]
    code: 201
    input: [asset_tag, description, asset_class_id, acquisition_cost_cents, cost_center, location, "salvage_value_cents?", "useful_life_months?", "book_method?", "tax_method?", "bonus_elected?", "parent_asset_id?"]
    output: FixedAsset
    side_effects: ["status=DRAFT; defaults pulled from AssetClass; source=PURCHASE or COMPONENT_ADDITION"]

  - method: GET
    path: "/fixed-assets"
    description: "List assets with filters"
    roles: [AssetAccountant, Controller, InventoryClerk, TaxAnalyst]
    code: 200
    input: ["asset_class_id?", "parent_asset_id?", "status?", "location?", "cost_center?"]
    output: FixedAsset[]
    side_effects: []

  - method: GET
    path: "/fixed-assets/{id}"
    description: "Get an asset"
    roles: [AssetAccountant, Controller, InventoryClerk, TaxAnalyst]
    code: 200
    input: []
    output: FixedAsset
    side_effects: []

  - method: PATCH
    path: "/fixed-assets/{id}"
    description: "Edit asset attributes (OCC-guarded; DRAFT fully editable, IN_SERVICE only prospective fields)"
    roles: [AssetAccountant]
    code: 200
    input: [expected_asset_version, "description?", "acquisition_cost_cents?", "salvage_value_cents?", "useful_life_months?", "book_method?", "tax_method?", "bonus_elected?", "location?", "cost_center?"]
    output: FixedAsset
    side_effects: ["increments FixedAsset.version by 1"]

  - method: POST
    path: "/fixed-assets/{id}/place-in-service"
    description: "Place a DRAFT asset in service"
    roles: [AssetAccountant]
    code: 200
    input: [in_service_date]
    output: FixedAsset
    side_effects: ["status -> IN_SERVICE; in_service_date set"]

  # --- DepreciationRun / Entry ---
  - method: POST
    path: "/depreciation-runs"
    description: "Create a run for period (must be latest POSTED period + 1 month; any period if none posted)"
    roles: [AssetAccountant]
    code: 201
    input: [period]
    output: DepreciationRun
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/depreciation-runs/{id}"
    description: "Get a run"
    roles: [AssetAccountant, Controller, InventoryClerk, TaxAnalyst]
    code: 200
    input: []
    output: DepreciationRun
    side_effects: []

  - method: POST
    path: "/depreciation-runs/{id}/post"
    description: "Post the run: create entries for all eligible assets and advance the epoch"
    roles: [AssetAccountant]
    code: 200
    input: []
    output: DepreciationRun
    side_effects:
      - "creates DepreciationEntry rows (source=RUN); updates asset accumulated_* and version; auto FULLY_DEPRECIATED transitions; run totals set"

  - method: GET
    path: "/depreciation-entries"
    description: "List depreciation entries with filters"
    roles: [AssetAccountant, Controller, InventoryClerk, TaxAnalyst]
    code: 200
    input: ["run_id?", "asset_id?", "disposal_id?", "ledger?", "period?"]
    output: DepreciationEntry[]
    side_effects: []

  - method: GET
    path: "/depreciation-entries/{id}"
    description: "Get a depreciation entry"
    roles: [AssetAccountant, Controller, InventoryClerk, TaxAnalyst]
    code: 200
    input: []
    output: DepreciationEntry
    side_effects: []

  # --- Disposal ---
  - method: POST
    path: "/disposals"
    description: "Request a disposal (SALE/SCRAP derecognize; TRANSFER moves cost center)"
    roles: [AssetAccountant]
    code: 201
    input: [asset_id, disposal_type, effective_date, "proceeds_cents?", "transfer_to_cost_center?"]
    output: Disposal
    side_effects: ["status=REQUESTED; requested_by_user_id := X-User-ID"]

  - method: GET
    path: "/disposals"
    description: "List disposals with filters"
    roles: [AssetAccountant, Controller, InventoryClerk, TaxAnalyst]
    code: 200
    input: ["asset_id?", "status?"]
    output: Disposal[]
    side_effects: []

  - method: GET
    path: "/disposals/{id}"
    description: "Get a disposal"
    roles: [AssetAccountant, Controller, InventoryClerk, TaxAnalyst]
    code: 200
    input: []
    output: Disposal
    side_effects: []

  - method: POST
    path: "/disposals/{id}/approve"
    description: "Approve a REQUESTED disposal (SoD: approver != requester)"
    roles: [Controller]
    code: 200
    input: []
    output: Disposal
    side_effects: ["status -> APPROVED; approved_by_user_id set"]

  - method: POST
    path: "/disposals/{id}/reject"
    description: "Reject a REQUESTED disposal"
    roles: [Controller]
    code: 200
    input: ["reason?"]
    output: Disposal
    side_effects: ["status -> REJECTED"]

  - method: POST
    path: "/disposals/{id}/resubmit"
    description: "Resubmit a REJECTED disposal with corrected fields"
    roles: [AssetAccountant]
    code: 200
    input: ["proceeds_cents?", "effective_date?", "transfer_to_cost_center?"]
    output: Disposal
    side_effects: ["status -> REQUESTED; fields re-validated"]

  - method: POST
    path: "/disposals/{id}/post"
    description: "Post an APPROVED disposal: final entries, gain/loss, derecognition or transfer"
    roles: [AssetAccountant]
    code: 200
    input: []
    output: Disposal
    side_effects:
      - "SALE/SCRAP: mid-month final entries (source=DISPOSAL_FINAL); book/tax gain-loss computed; asset -> DISPOSED; component cascade"
      - "TRANSFER: asset.cost_center updated; gain/loss = 0"

  # --- InventoryRun / CountLine ---
  - method: POST
    path: "/inventory-runs"
    description: "Create an inventory run (starts in COUNTING; seeds one PENDING line per in-scope asset with status IN {IN_SERVICE, FULLY_DEPRECIATED})"
    roles: [InventoryClerk]
    code: 201
    input: [name, scope_type, "scope_value?"]
    output: InventoryRun
    side_effects: ["seeds InventoryCountLine rows; expected_count set"]

  - method: GET
    path: "/inventory-runs/{id}"
    description: "Get an inventory run"
    roles: [AssetAccountant, Controller, InventoryClerk, TaxAnalyst]
    code: 200
    input: []
    output: InventoryRun
    side_effects: []

  - method: POST
    path: "/inventory-runs/{id}/count-lines"
    description: "Record (upsert) a physical count for an asset in the run"
    roles: [InventoryClerk]
    code: 200
    input: [asset_id, found, "counted_location?", "condition?"]
    output: InventoryCountLine
    side_effects:
      - "reconciliation_status recomputed (MATCHED / LOCATION_MISMATCH / MISSING)"
      - "condition == DAMAGED && found: auto-create OPEN ImpairmentReview (indicator=DAMAGE, source=INVENTORY) unless one is already OPEN for the asset"
      - "run counters recomputed"

  - method: GET
    path: "/inventory-runs/{id}/count-lines"
    description: "List count lines of a run"
    roles: [AssetAccountant, Controller, InventoryClerk, TaxAnalyst]
    code: 200
    input: []
    output: InventoryCountLine[]
    side_effects: []

  - method: GET
    path: "/fixed-assets/{id}/count-lines"
    description: "Count history of an asset across runs"
    roles: [AssetAccountant, Controller, InventoryClerk, TaxAnalyst]
    code: 200
    input: []
    output: InventoryCountLine[]
    side_effects: []

  - method: POST
    path: "/inventory-runs/{id}/begin-reconciliation"
    description: "COUNTING -> RECONCILING (all seeded lines must be counted)"
    roles: [InventoryClerk]
    code: 200
    input: []
    output: InventoryRun
    side_effects: []

  - method: POST
    path: "/inventory-runs/{id}/recount"
    description: "RECONCILING -> COUNTING (recount cycle)"
    roles: [InventoryClerk]
    code: 200
    input: []
    output: InventoryRun
    side_effects: []

  - method: POST
    path: "/inventory-runs/{id}/close"
    description: "RECONCILING -> CLOSED (every line MATCHED or its asset DISPOSED)"
    roles: [Controller]
    code: 200
    input: []
    output: InventoryRun
    side_effects: ["open_inventory_exception cleared on counted assets"]

  # --- ImpairmentReview ---
  - method: POST
    path: "/impairment-reviews"
    description: "Open an impairment review on an IN_SERVICE asset (one OPEN per asset)"
    roles: [AssetAccountant]
    code: 201
    input: [asset_id, indicator]
    output: ImpairmentReview
    side_effects: ["status=OPEN; created_by_user_id := X-User-ID"]

  - method: GET
    path: "/impairment-reviews"
    description: "List impairment reviews with filters"
    roles: [AssetAccountant, Controller, InventoryClerk, TaxAnalyst]
    code: 200
    input: ["asset_id?", "status?"]
    output: ImpairmentReview[]
    side_effects: []

  - method: GET
    path: "/impairment-reviews/{id}"
    description: "Get an impairment review"
    roles: [AssetAccountant, Controller, InventoryClerk, TaxAnalyst]
    code: 200
    input: []
    output: ImpairmentReview
    side_effects: []

  - method: POST
    path: "/impairment-reviews/{id}/confirm"
    description: "Confirm write-down at a recoverable value (OCC pins asset version; SoD vs creator)"
    roles: [Controller]
    code: 200
    input: [recoverable_value_cents, expected_asset_version]
    output: ImpairmentReview
    side_effects:
      - "write_down_cents computed; asset.impairment_total_cents += write_down; increments FixedAsset.version by 1"
      - "basis recompute; auto FULLY_DEPRECIATED when remaining basis <= 0"

  - method: POST
    path: "/impairment-reviews/{id}/dismiss"
    description: "Dismiss an OPEN review without write-down"
    roles: [Controller]
    code: 200
    input: []
    output: ImpairmentReview
    side_effects: ["status -> DISMISSED"]

  # --- ExternalSchedule ---
  - method: POST
    path: "/external-schedules"
    description: "Import a property-tax or insurance schedule row for an asset"
    roles: [TaxAnalyst]
    code: 201
    input: [asset_id, schedule_type, schedule_year, "assessed_value_cents?", "annual_premium_cents?"]
    output: ExternalSchedule
    side_effects: ["status=IMPORTED; property_tax_amount_cents computed for PROPERTY_TAX"]

  - method: GET
    path: "/fixed-assets/{id}/external-schedules"
    description: "List external schedules of an asset"
    roles: [AssetAccountant, Controller, InventoryClerk, TaxAnalyst]
    code: 200
    input: []
    output: ExternalSchedule[]
    side_effects: []

  - method: POST
    path: "/external-schedules/{id}/apply"
    description: "Apply an IMPORTED schedule"
    roles: [Controller]
    code: 200
    input: []
    output: ExternalSchedule
    side_effects: ["status -> APPLIED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Approver/confirmer X-User-ID equals the preparer's recorded user id (capitalize / disposal approve / impairment confirm)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad enum value, or malformed payload" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic transition violation: entity not in a valid from-state (e.g. place-in-service on IN_SERVICE asset, post an already-POSTED run, close a COUNTING run, confirm a terminal review)" }
  - { id: ERR_PROJECT_NOT_OPEN, http: 409, condition: "CapitalProject not OPEN for cost-line create/reverse or capitalize" }
  - { id: ERR_ASSET_NOT_IN_SERVICE, http: 409, condition: "Asset is DRAFT where IN_SERVICE/FULLY_DEPRECIATED is required (disposal create, impairment create)" }
  - { id: ERR_ALREADY_DISPOSED, http: 409, condition: "Asset is DISPOSED (disposal create/resubmit, schedule apply)" }
  - { id: ERR_RUN_NOT_COUNTING, http: 409, condition: "Count-line upsert on an InventoryRun not in COUNTING" }
  - { id: ERR_ASSET_NOT_IN_SCOPE, http: 409, condition: "Count-line upsert for an asset not seeded into the run's scope" }
  - { id: ERR_ASSET_UNDER_INVENTORY_REVIEW, http: 409, condition: "SALE/TRANSFER disposal post while asset.open_inventory_exception is true" }
  - { id: ERR_UNRESOLVED_INVENTORY_ITEMS, http: 409, condition: "Run close with lines still MISSING/LOCATION_MISMATCH and asset not DISPOSED" }
  - { id: ERR_UNCOUNTED_LINES, http: 409, condition: "begin-reconciliation with any seeded line still found == null" }
  - { id: ERR_DUPLICATE_TAG, http: 409, condition: "asset_tag / project_code / class_code already exists" }
  - { id: ERR_DUPLICATE_RUN_PERIOD, http: 409, condition: "An OPEN DepreciationRun already exists for the requested period" }
  - { id: ERR_PERIOD_ALREADY_POSTED, http: 409, condition: "A POSTED DepreciationRun already exists for the requested period" }
  - { id: ERR_PERIOD_GAP, http: 409, condition: "New run period is not exactly latest POSTED period + 1 month" }
  - { id: ERR_PERIOD_CLOSED, http: 409, condition: "Disposal effective period is <= latest POSTED run period (at create or re-validated at post)" }
  - { id: ERR_IMPAIRMENT_REVIEW_OPEN, http: 409, condition: "Another OPEN ImpairmentReview already exists for the asset" }
  - { id: ERR_DUPLICATE_SCHEDULE, http: 409, condition: "ExternalSchedule already exists for (asset_id, schedule_type, schedule_year)" }
  - { id: ERR_BELOW_CAPITALIZATION_THRESHOLD, http: 422, condition: "Project total or component cost below the class capitalization_threshold_cents" }
  - { id: ERR_INVALID_AMOUNT, http: 422, condition: "amount_cents <= 0, acquisition_cost_cents <= 0, or proceeds_cents < 0" }
  - { id: ERR_INVALID_SALVAGE_VALUE, http: 422, condition: "salvage_value_cents < 0 or >= acquisition_cost_cents" }
  - { id: ERR_INVALID_DISPOSAL_FIELDS, http: 422, condition: "SALE without proceeds_cents; TRANSFER without transfer_to_cost_center or with proceeds != 0; effective_date before in_service_date" }
  - { id: ERR_BONUS_NOT_ALLOWED, http: 422, condition: "bonus_elected=true on a class whose bonus_depreciation_allowed is false" }
  - { id: ERR_NO_IMPAIRMENT_INDICATED, http: 422, condition: "Confirm computes write_down_cents == 0 (recoverable >= net book value); dismiss instead" }
  - { id: ERR_INVALID_SCHEDULE_FIELDS, http: 422, condition: "PROPERTY_TAX without assessed_value_cents or INSURANCE without annual_premium_cents" }
  - { id: ERR_FIELD_IMMUTABLE, http: 422, condition: "PATCH on IN_SERVICE asset touching fields outside {useful_life_months, salvage_value_cents, location, cost_center, description}" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_asset_version does not match the asset's current version (OCC)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AssetAccountant
    description: "Fixed-asset preparer: builds CIP projects, registers assets/components, places assets in service, runs depreciation, requests and posts disposals, opens impairment reviews"
    identity: opaque
    exclusive_operations:
      - "POST /capital-projects, POST /cip-cost-lines, POST /cip-cost-lines/{id}/reverse"
      - "POST /fixed-assets, PATCH /fixed-assets/{id}, POST /fixed-assets/{id}/place-in-service"
      - "POST /depreciation-runs, POST /depreciation-runs/{id}/post"
      - "POST /disposals, POST /disposals/{id}/resubmit, POST /disposals/{id}/post"
      - "POST /impairment-reviews"
    shared_operations:
      - "All GET endpoints"

  - name: Controller
    description: "Accounting approver: owns asset-class policy, capitalizes/cancels projects, approves/rejects disposals, confirms/dismisses impairment, closes inventory runs, applies external schedules"
    identity: opaque
    exclusive_operations:
      - "POST /asset-classes"
      - "POST /capital-projects/{id}/capitalize, POST /capital-projects/{id}/cancel"
      - "POST /disposals/{id}/approve, POST /disposals/{id}/reject"
      - "POST /impairment-reviews/{id}/confirm, POST /impairment-reviews/{id}/dismiss"
      - "POST /inventory-runs/{id}/close"
      - "POST /external-schedules/{id}/apply"
    shared_operations:
      - "All GET endpoints"

  - name: InventoryClerk
    description: "Performs physical inventory: creates runs, records count lines, drives recount cycles"
    identity: opaque
    exclusive_operations:
      - "POST /inventory-runs"
      - "POST /inventory-runs/{id}/count-lines"
      - "POST /inventory-runs/{id}/begin-reconciliation, POST /inventory-runs/{id}/recount"
    shared_operations:
      - "All GET endpoints"

  - name: TaxAnalyst
    description: "Imports property-tax and insurance schedule feeds"
    identity: opaque
    exclusive_operations:
      - "POST /external-schedules"
    shared_operations:
      - "All GET endpoints"
