              as: Support
          trigger:
            - call: "POST /streaming/subscriber-accounts/${sa_id}/reactivate"
              as: Support
            - call: "POST /streaming/plans"
              payload: { plan_code: "X2", plan_kind: "STANDALONE", service_scope: ["DPLUS"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 799, allow_app_store_billing: true, allow_distributor_billing: true }
