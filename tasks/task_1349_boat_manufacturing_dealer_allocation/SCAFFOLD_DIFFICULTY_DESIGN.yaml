# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Boat Manufacturing & Dealer Allocation
# All fixture arithmetic pre-computed from §1.3 formulas with pinned constants.
# Difficulty target: HARDER THAN EXPERT — multi-step chains, race-condition OCC,
# compensating conservation, cutoff boundaries, formula edge cases.
# =============================================================================

scaffold_difficulty_design:

  # ========================================================================= rule 1
  # dual_variant_calc: two calculations with two valid approaches producing
  # different results on DIFFERENT entity domains.
  - rule_id: dual_variant_calc
    instances:
      - name: carrying_cost_actual_vs_season_weighted
        grounds:
          - calculations.carrying_cost_accrual
          - state_machines.ProductionRun.OPEN_to_CLOSED
          - entities.Hull.fields.carrying_cost_cents
          - entities.ProductionRun.fields.total_carrying_actual_cents
          - entities.ProductionRun.fields.total_carrying_seasonal_cents
        distinguishing_aspect: |
          Same Hull-domain inputs (one AT_PLANT hull completed 2026-08-01T00:00:00Z, run
          closed at clock 2026-08-11T00:00:00Z = exactly 10 whole days): ACTUAL_DAYS
          yields 7500 cents (10 x 750) while SEASON_WEIGHTED yields 9375 cents
          (7500 x 1.25 PEAK) — same entity domain, two valid variants, different
          persisted results on two different ProductionRun fields.
        test_recipe:
          setup:
            - "SP190 model (base 2500000, 40h); dealer D1 STANDARD quota 5"
            - "PEAK run L1 [2026-08-03,2026-08-10) cutoff 2026-08-05T12:00:00Z; slot S1 cap 200"
            - "Order O1 RETAIL with WAKE-TOWER+BALLAST -> invoice 3093605, deposit req 309361, confirmed"
            - "Hull H1 created at default clock 2026-08-01T00:00:00Z, left UNCERTIFIED/AT_PLANT"
            - "Clock advanced to 2026-08-11T00:00:00Z (exactly 10 whole days after completed_at)"
          setup_api_calls:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, base_price_cents: 2500000, length_feet: 19.5, production_hours: 40 }
              as: SystemAdmin
              captures: { m_sp: $.data.id }
            - call: "POST /option-packages"
              payload: { model_id: "${m_sp}", option_code: "WAKE-TOWER", name: "Wake Tower", price_cents: 350000, production_hours: 6 }
              as: SystemAdmin
              captures: { opt_tower: $.data.id }
            - call: "POST /option-packages"
              payload: { model_id: "${m_sp}", option_code: "BALLAST", name: "Ballast System", price_cents: 180000, production_hours: 4 }
              as: SystemAdmin
              captures: { opt_ballast: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-100", name: "Coastal Marine", region: "SE", annual_allocation_quota: 5, floor_plan_limit_cents: 100000000, standing: "STANDARD" }
              as: AllocationManager
              captures: { dlr1: $.data.id }
            - call: "POST /production-runs"
              payload: { plant_line_code: "L1", season: "PEAK", build_week_start: "2026-08-03", build_week_end: "2026-08-10", option_change_cutoff_at: "2026-08-05T12:00:00Z" }
              as: ProductionPlanner
              captures: { run1: $.data.id }
            - call: "POST /build-slots"
              payload: { run_id: "${run1}", slot_code: "S1", capacity_hours: 200 }
              as: ProductionPlanner
              captures: { slot1: $.data.id }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr1}", model_id: "${m_sp}", source: "RETAIL", deposit_paid_cents: 309361, option_package_ids: ["${opt_tower}", "${opt_ballast}"], slot_id: "${slot1}" }
              as: DealerPrincipal
              as_user_id: "${dlr1}"
              captures: { ord1: $.data.id }
            - call: "POST /dealer-orders/${ord1}/confirm"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr1}"
            - call: "POST /hulls"
              payload: { order_id: "${ord1}" }
              as: ProductionPlanner
              as_user_id: "planner-1"
              captures: { hull1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /production-runs/${run1}/close"
              payload: {}
              as: ProductionPlanner
              captures: { run_actual: $.data.total_carrying_actual_cents, run_seasonal: $.data.total_carrying_seasonal_cents }
          assert:
            - "ProductionRun.${run1}.total_carrying_actual_cents == 7500 (10 days x 750, ACTUAL_DAYS variant)"
            - "ProductionRun.${run1}.total_carrying_seasonal_cents == 9375 (7500 x 1.25 PEAK, SEASON_WEIGHTED variant)"
            - "Hull.${hull1}.carrying_cost_cents == 9375 (SEASON_WEIGHTED is the persisted variant)"
            - "7500 != 9375: identical inputs, variant-selected outputs diverge"
            - "ProductionRun.${run1}.status == CLOSED"

      - name: claim_reimbursement_standard_vs_recall_goodwill
        grounds:
          - calculations.claim_reimbursement
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
          - entities.WarrantyClaim.fields.variant_applied
          - entities.WarrantyClaim.fields.reimbursement_cents
        distinguishing_aspect: |
          Two claims with identical labor_hours (4.0) and parts_cents (100000) on the
          WarrantyClaim domain: STANDARD reimburses 118300 cents while RECALL_GOODWILL
          reimburses 136000 cents — a WarrantyClaim-domain dual variant, entity domain
          disjoint from the Hull carrying-cost instance.
        test_recipe:
          setup:
            - "SP190 model 2027; dealer D1 STANDARD with floor_plan_limit 100000000; run/slot booked; order O1 confirmed; hull H1 created and certified by a different compliance officer; hull delivered at clock 2026-08-02; warranty registration R1 for sale date 2026-08-02"
            - "Recall campaign RC-1 on SP190/2027 serials 1..5 issued -> hull RECALL_HOLD, one notice N1 NOTIFIED"
            - "Claim C1 has no recall_notice_id; claim C2 linked to N1; both labor_hours=4.0, parts_cents=100000"
          setup_api_calls:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, base_price_cents: 2500000, length_feet: 19.5, production_hours: 40 }
              as: SystemAdmin
              captures: { m_sp: $.data.id }
            - call: "POST /option-packages"
              payload: { model_id: "${m_sp}", option_code: "WAKE-TOWER", name: "Wake Tower", price_cents: 350000, production_hours: 6 }
              as: SystemAdmin
              captures: { opt_tower: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-100", name: "Coastal Marine", region: "SE", annual_allocation_quota: 5, floor_plan_limit_cents: 100000000, standing: "STANDARD" }
              as: AllocationManager
              captures: { dlr1: $.data.id }
            - call: "POST /production-runs"
              payload: { plant_line_code: "L1", season: "PEAK", build_week_start: "2026-08-03", build_week_end: "2026-08-10", option_change_cutoff_at: "2026-08-05T12:00:00Z" }
              as: ProductionPlanner
              captures: { run1: $.data.id }
            - call: "POST /build-slots"
              payload: { run_id: "${run1}", slot_code: "S1", capacity_hours: 200 }
              as: ProductionPlanner
              captures: { slot1: $.data.id }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr1}", model_id: "${m_sp}", source: "RETAIL", deposit_paid_cents: 291748, option_package_ids: ["${opt_tower}"], slot_id: "${slot1}" }
              as: DealerPrincipal
              as_user_id: "${dlr1}"
              captures: { ord1: $.data.id }
            - call: "POST /dealer-orders/${ord1}/confirm"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr1}"
            - call: "POST /hulls"
              payload: { order_id: "${ord1}" }
              as: ProductionPlanner
              as_user_id: "planner-1"
              captures: { hull1: $.data.id }
            - call: "POST /hulls/${hull1}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-9"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /hulls/${hull1}/deliver"
              payload: {}
              as: ProductionPlanner
              as_user_id: "planner-1"
            - call: "POST /warranty-registrations"
              payload: { hull_id: "${hull1}", dealer_id: "${dlr1}", retail_sale_date: "2026-08-02" }
              as: DealerPrincipal
              as_user_id: "${dlr1}"
              captures: { reg1: $.data.id }
            - call: "POST /recall-campaigns"
              payload: { campaign_code: "RC-2026-014", severity: "SAFETY_STANDARD", model_code: "SP190", model_year: 2027, hin_serial_start: 1, hin_serial_end: 5 }
              as: ComplianceOfficer
              captures: { camp1: $.data.id }
            - call: "POST /recall-campaigns/${camp1}/issue"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /recall-notices"
              payload: {}
              as: Any
              captures: { notice1: "$.data[0].id" }
            - call: "POST /warranty-claims"
              payload: { registration_id: "${reg1}", defect_description: "gel coat crazing", labor_hours: 4.0, parts_cents: 100000 }
              as: DealerPrincipal
              as_user_id: "${dlr1}"
              captures: { claim_std: $.data.id }
            - call: "POST /warranty-claims"
              payload: { registration_id: "${reg1}", defect_description: "recall remedy labor", labor_hours: 4.0, parts_cents: 100000, recall_notice_id: "${notice1}" }
              as: DealerPrincipal
              as_user_id: "${dlr1}"
              captures: { claim_rg: $.data.id }
          trigger:
            - call: "POST /warranty-claims/${claim_std}/approve"
              payload: {}
              as: WarrantyAdministrator
              captures: { std_reimb: $.data.reimbursement_cents }
            - call: "POST /warranty-claims/${claim_rg}/approve"
              payload: {}
              as: WarrantyAdministrator
              captures: { rg_reimb: $.data.reimbursement_cents }
          assert:
            - "WarrantyClaim.${claim_std}.reimbursement_cents == 118300 (STANDARD: rhu(2*9000)+rhu(2*9000*0.85) labor + rhu(100000*0.85) parts)"
            - "WarrantyClaim.${claim_rg}.reimbursement_cents == 136000 (RECALL_GOODWILL: rhu(4*9000) labor + 100000 parts at 100%)"
            - "WarrantyClaim.${claim_std}.variant_applied == STANDARD"
            - "WarrantyClaim.${claim_rg}.variant_applied == RECALL_GOODWILL"
            - "118300 != 136000: identical labor_hours and parts_cents produce variant-dependent totals"

  # ========================================================================= rule 2
  # combinatorial_formula: two calculations in DIFFERENT modes from {(a) multi-input
  # non-linear, (b) nested rounding order, (c) circular dependency}.
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_total_per_line_rounding_order_pinned
        grounds:
          - calculations.order_invoice_total
          - entities.OrderOptionLine.fields.line_total_cents
          - entities.DealerOrder.fields.options_total_cents
        distinguishing_aspect: |
          Mode (b) nested-rounding: line totals are rounded PER LINE then summed
          (pinned); summing then rounding would give a different cents value. Setup
          picks option prices where per-line-then-sum and sum-then-round diverge:
          two options at 33333 cents each, STANDARD discount 0.05 — per-line
          rhu(33333*0.95)=31666 twice summing to 63332 vs sum-then-round
          rhu(66666*0.95)=63333.
        test_recipe:
          setup:
            - "SP190 model 2027 base 2500000; dealer D1 STANDARD; two options OPA and OPB each priced 33333 cents with 0 production_hours"
            - "Slot cap 200 on PEAK run"
            - "Order placed with both options; production_hours stays 40"
          setup_api_calls:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, base_price_cents: 2500000, length_feet: 19.5, production_hours: 40 }
              as: SystemAdmin
              captures: { m_sp: $.data.id }
            - call: "POST /option-packages"
              payload: { model_id: "${m_sp}", option_code: "OPA", name: "Option A", price_cents: 33333, production_hours: 0 }
              as: SystemAdmin
              captures: { opt_a: $.data.id }
            - call: "POST /option-packages"
              payload: { model_id: "${m_sp}", option_code: "OPB", name: "Option B", price_cents: 33333, production_hours: 0 }
              as: SystemAdmin
              captures: { opt_b: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-100", name: "Coastal Marine", region: "SE", annual_allocation_quota: 5, floor_plan_limit_cents: 100000000, standing: "STANDARD" }
              as: AllocationManager
              captures: { dlr1: $.data.id }
            - call: "POST /production-runs"
              payload: { plant_line_code: "L1", season: "PEAK", build_week_start: "2026-08-03", build_week_end: "2026-08-10", option_change_cutoff_at: "2026-08-05T12:00:00Z" }
              as: ProductionPlanner
              captures: { run1: $.data.id }
            - call: "POST /build-slots"
              payload: { run_id: "${run1}", slot_code: "S1", capacity_hours: 200 }
              as: ProductionPlanner
              captures: { slot1: $.data.id }
          trigger:
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr1}", model_id: "${m_sp}", source: "RETAIL", deposit_paid_cents: 256333, option_package_ids: ["${opt_a}", "${opt_b}"], slot_id: "${slot1}" }
              as: DealerPrincipal
              as_user_id: "${dlr1}"
              captures: { ord1: $.data.id, ord_options_total: $.data.options_total_cents, ord_surcharge: $.data.surcharge_cents, ord_invoice: $.data.invoice_total_cents }
          assert:
            - "DealerOrder.${ord1}.options_total_cents == 63332 (rhu(33333*0.95)=31666 per line, 2 lines -> 31666+31666; sum-then-round would give 63333 — pinned order is per-line-first)"
            - "DealerOrder.${ord1}.surcharge_cents == 76900 (rhu((2500000+63332)*0.03))"
            - "DealerOrder.${ord1}.invoice_total_cents == 2640232"
            - "Per-line-then-sum 63332 differs from sum-then-round 63333: the pinned order is observable at the cents level"

      - name: floor_plan_tier_circular_dependency_evaluation_order
        grounds:
          - calculations.floor_plan_interest_accrual
          - entities.FloorPlanAdvance.fields.rate_tier
          - entities.FloorPlanAdvance.fields.annual_rate
          - state_machines.Hull_delivery.AT_PLANT_to_DELIVERED
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: rate_tier depends on utilization which
          INCLUDES the new advance, but the new advance's rate depends on its tier.
          Scaffold pins evaluation order: (1) compute utilization INCLUDING this
          advance, (2) pick tier from thresholds (boundary: exactly 0.50 -> TIER_ELEVATED,
          exactly 0.80 -> TIER_HIGH), (3) lock rate on the advance. Two dealers with
          identical invoice 3093605 but different limits land in different tiers
          (10,000,000 -> 0.309 TIER_STANDARD 0.06; 6,000,000 -> 0.516 TIER_ELEVATED 0.075),
          proving tier is computed from the post-inclusion utilization, not pre-delivery.
        test_recipe:
          setup:
            - "SP190 model 2027; option WAKE-TOWER+BALLAST; two dealers DA (floor_plan_limit 100000000) and DB (floor_plan_limit 6000000), both STANDARD"
            - "Each dealer has booked+confirmed+hull created+certified; both hulls AT_PLANT"
            - "Both dealers deliver at clock 2026-08-02 producing principal 3093605 each"
          setup_api_calls:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, base_price_cents: 2500000, length_feet: 19.5, production_hours: 40 }
              as: SystemAdmin
              captures: { m_sp: $.data.id }
            - call: "POST /option-packages"
              payload: { model_id: "${m_sp}", option_code: "WAKE-TOWER", name: "Wake Tower", price_cents: 350000, production_hours: 6 }
              as: SystemAdmin
              captures: { opt_tower: $.data.id }
            - call: "POST /option-packages"
              payload: { model_id: "${m_sp}", option_code: "BALLAST", name: "Ballast System", price_cents: 180000, production_hours: 4 }
              as: SystemAdmin
              captures: { opt_ballast: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-A", name: "Dealer A", region: "SE", annual_allocation_quota: 5, floor_plan_limit_cents: 100000000, standing: "STANDARD" }
              as: AllocationManager
              captures: { dlra: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-B", name: "Dealer B", region: "SE", annual_allocation_quota: 5, floor_plan_limit_cents: 6000000, standing: "STANDARD" }
              as: AllocationManager
              captures: { dlrb: $.data.id }
            - call: "POST /production-runs"
              payload: { plant_line_code: "L1", season: "PEAK", build_week_start: "2026-08-03", build_week_end: "2026-08-10", option_change_cutoff_at: "2026-08-05T12:00:00Z" }
              as: ProductionPlanner
              captures: { run1: $.data.id }
            - call: "POST /build-slots"
              payload: { run_id: "${run1}", slot_code: "S1", capacity_hours: 200 }
              as: ProductionPlanner
              captures: { slot1: $.data.id }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlra}", model_id: "${m_sp}", source: "RETAIL", deposit_paid_cents: 309361, option_package_ids: ["${opt_tower}", "${opt_ballast}"], slot_id: "${slot1}" }
              as: DealerPrincipal
              as_user_id: "${dlra}"
              captures: { orda: $.data.id }
            - call: "POST /dealer-orders/${orda}/confirm"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlra}"
            - call: "POST /hulls"
              payload: { order_id: "${orda}" }
              as: ProductionPlanner
              as_user_id: "planner-1"
              captures: { hulla: $.data.id }
            - call: "POST /hulls/${hulla}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-9"
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlrb}", model_id: "${m_sp}", source: "RETAIL", deposit_paid_cents: 309361, option_package_ids: ["${opt_tower}", "${opt_ballast}"], slot_id: "${slot1}" }
              as: DealerPrincipal
              as_user_id: "${dlrb}"
              captures: { ordb: $.data.id }
            - call: "POST /dealer-orders/${ordb}/confirm"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlrb}"
            - call: "POST /hulls"
              payload: { order_id: "${ordb}" }
              as: ProductionPlanner
              as_user_id: "planner-1"
              captures: { hullb: $.data.id }
            - call: "POST /hulls/${hullb}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-9"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /hulls/${hulla}/deliver"
              payload: {}
              as: ProductionPlanner
              as_user_id: "planner-1"
            - call: "POST /hulls/${hullb}/deliver"
              payload: {}
              as: ProductionPlanner
              as_user_id: "planner-1"
          trigger:
            - call: "GET /floor-plan-advances"
              payload: {}
              as: Any
              captures: { adv_a_tier: "$.data[0].rate_tier", adv_a_rate: "$.data[0].annual_rate", adv_b_tier: "$.data[1].rate_tier", adv_b_rate: "$.data[1].annual_rate" }
          assert:
            - "FloorPlanAdvance for dealer A (limit 100000000) has rate_tier == TIER_STANDARD and annual_rate == 0.06 (utilization 3093605/100000000 = 0.031)"
            - "FloorPlanAdvance for dealer B (limit 6000000) has rate_tier == TIER_ELEVATED and annual_rate == 0.075 (utilization 3093605/6000000 = 0.516 >= 0.50 boundary)"
            - "Identical principal and standing produce different rate_tier — the lock-in evaluation order (utilization INCLUDING this advance) is observable"

  # ========================================================================= rule 3
  # non_linear_state_machine: two non-linear shapes on DIFFERENT entities.
  - rule_id: non_linear_state_machine
    instances:
      - name: hull_certification_recall_hold_cycle
        grounds:
          - state_machines.Hull_certification
          - entities.Hull.fields.certification_status
        distinguishing_aspect: |
          Hull certification dimension is CYCLIC (UNCERTIFIED -> CERTIFIED -> RECALL_HOLD
          -> CERTIFIED): a hull certified then recalled flips to RECALL_HOLD; remedying
          its last NOTIFIED notice flips it back to CERTIFIED — the cycle closes. The
          companion DealerOrder machine on a different entity is NOT a cycle, so this
          instance relies on the Hull-certification cycle alone.
        test_recipe:
          setup:
            - "SP190 model 2027; dealer D1; run+slot; order confirmed; hull H1 created (UNCERTIFIED) and certified (CERTIFIED)"
            - "Recall campaign RC-1 covers SP190/2027 serial 1; issue flips hull to RECALL_HOLD and creates notice N1"
            - "Plant remedy on N1 flips notice to REMEDIED and lifts hull back to CERTIFIED (cycle completes)"
          setup_api_calls:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, base_price_cents: 2500000, length_feet: 19.5, production_hours: 40 }
              as: SystemAdmin
              captures: { m_sp: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-100", name: "Coastal Marine", region: "SE", annual_allocation_quota: 5, floor_plan_limit_cents: 100000000, standing: "STANDARD" }
              as: AllocationManager
              captures: { dlr1: $.data.id }
            - call: "POST /production-runs"
              payload: { plant_line_code: "L1", season: "PEAK", build_week_start: "2026-08-03", build_week_end: "2026-08-10", option_change_cutoff_at: "2026-08-05T12:00:00Z" }
              as: ProductionPlanner
              captures: { run1: $.data.id }
            - call: "POST /build-slots"
              payload: { run_id: "${run1}", slot_code: "S1", capacity_hours: 200 }
              as: ProductionPlanner
              captures: { slot1: $.data.id }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr1}", model_id: "${m_sp}", source: "RETAIL", deposit_paid_cents: 257500, option_package_ids: [], slot_id: "${slot1}" }
              as: DealerPrincipal
              as_user_id: "${dlr1}"
              captures: { ord1: $.data.id }
            - call: "POST /dealer-orders/${ord1}/confirm"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr1}"
            - call: "POST /hulls"
              payload: { order_id: "${ord1}" }
              as: ProductionPlanner
              as_user_id: "planner-1"
              captures: { hull1: $.data.id }
            - call: "POST /hulls/${hull1}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-9"
            - call: "POST /recall-campaigns"
              payload: { campaign_code: "RC-2026-014", severity: "SAFETY_STOP", model_code: "SP190", model_year: 2027, hin_serial_start: 1, hin_serial_end: 1 }
              as: ComplianceOfficer
              captures: { camp1: $.data.id }
            - call: "POST /recall-campaigns/${camp1}/issue"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /hulls/${hull1}"
              payload: {}
              as: Any
              captures: { hull_hold: $.data.certification_status }
            - call: "GET /recall-notices"
              payload: {}
              as: Any
              captures: { notice1: "$.data[0].id" }
          trigger:
            - call: "POST /recall-notices/${notice1}/remedy"
              payload: {}
              as: ComplianceOfficer
              captures: { remedied_status: $.data.status }
          assert:
            - "Hull.${hull1}.certification_status transitions UNCERTIFIED -> CERTIFIED -> RECALL_HOLD -> CERTIFIED (cycle closed)"
            - "After issue: certification_status == RECALL_HOLD"
            - "After remedy: certification_status == CERTIFIED"
            - "RecallNotice.${notice1}.status == REMEDIED and remedy_path == PLANT_REMEDY"

      - name: dealer_order_self_loop_amend_with_state_preservation
        grounds:
          - state_machines.DealerOrder.ALLOCATED_to_ALLOCATED
          - state_machines.DealerOrder.WAITLISTED_to_WAITLISTED
          - entities.DealerOrder.fields.status
        distinguishing_aspect: |
          DealerOrder has SELF-LOOP amendments (ALLOCATED -> ALLOCATED and WAITLISTED ->
          WAITLISTED via PATCH): state stays but version increments, options replaced,
          invoice recomputed, slot.reserved_hours adjusted by the delta. On a different
          entity than Hull, so this satisfies the differentiation clause. The self-loop
          is non-linear because the machine revisits the same state with side effects.
        test_recipe:
          setup:
            - "SP190 model 2027 production_hours=40; dealer D1 STANDARD; options TOWER 350000/6h and BALLAST 180000/4h"
            - "Run with slot cap 50; order O1 RETAIL with [TOWER] only -> production_hours 46, invoice computed"
            - "Amendment swaps to [TOWER, BALLAST] -> production_hours 50, reserved_hours grows by 4"
          setup_api_calls:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, base_price_cents: 2500000, length_feet: 19.5, production_hours: 40 }
