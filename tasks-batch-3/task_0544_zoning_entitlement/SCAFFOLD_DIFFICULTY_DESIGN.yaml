# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index) — task_0544
# 9 Difficulty Rules x >= 2 instances = 18 instances.
# Every grounds ref resolves into SCAFFOLD.yaml (SS1.1-1.7). All fee/date
# literals were computed against the pinned formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: impact_fee_provisional_vs_final_diverge
        grounds:
          - calculations.impact_fee_provisional_vs_final
          - entities.ImpactFeeAssessment.fields.provisional_fee_cents
          - entities.ImpactFeeAssessment.fields.final_fee_cents
          - state_machines.Plat.PENDING_to_RECORDED
        distinguishing_aspect: "On the ImpactFeeAssessment fee-accounting domain, provisional (declared 4 lots) yields 2152500 cents while final (recorded 6 lots) yields 2677500 cents for the same plat."
        test_recipe:
          setup:
            - "A recorded-ready SUBDIVISION application in EFFECTIVE state, plat submitted with declared 4 lots / 10 acres (provisional 2152500), about to be recorded with 6 lots / 10 acres."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /parcels"
              payload: { apn: "APN-1", zoning_district: "RES", area_acres: 10, neighbor_parcel_count: 12, expanded_neighbor_count: 20, sensitive_area: false }
              as: Admin
              captures: { parcel_id: $.data.id }
            - call: "POST /fee-schedules"
              payload: { name: "FY26", park_fee_per_lot_cents: 250000, road_fee_tier1_per_acre_cents: 120000, road_fee_tier2_per_acre_cents: 90000, road_fee_tier3_per_acre_cents: 60000, admin_pct: 0.05, affordable_discount_pct: 0.20, credit_pct: 0.10, fee_cap_cents: 10000000 }
              as: Admin
              captures: { fs_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Ann Dev", email: "ann@x.com" }
              as: Admin
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { application_type: "SUBDIVISION", parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", requested_use: "subdivide into lots" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/completeness"
              payload: { determination: "COMPLETE" }
              as: Planner
              as_user_id: "planner-1"
            - call: "POST /applications/${app_id}/notices"
              payload: { notice_kind: "MAILED" }
              as: Clerk
            - call: "POST /hearings"
              payload: { body: "PLANNING_COMMISSION", scheduled_date: "2026-06-11T00:00:00Z", agenda_capacity: 5 }
              as: Clerk
              captures: { hearing_id: $.data.id, h_v: $.data.version }
            - call: "POST /hearings/${hearing_id}/agenda-items"
              payload: { application_id: "${app_id}", expected_hearing_version: "${h_v}" }
              as: Clerk
              captures: { item_id: $.data.id }
            - call: "POST /agenda-items/${item_id}/decide"
              payload: { decision: "APPROVE", findings: [{ finding_code: "F-A", finding_text: "meets code", supports_approval: true }] }
              as: Commissioner
              as_user_id: "commish-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-17T00:00:00Z" }
              as: Admin
            - call: "POST /applications/${app_id}/effectuate"
              payload: {}
              as: Clerk
            - call: "POST /plats"
              payload: { application_id: "${app_id}", fee_schedule_id: "${fs_id}", declared_lot_count: 4, declared_gross_acres: 10 }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { plat_id: $.data.id }
            - call: "GET /plats/${plat_id}/impact-fee"
              as: Clerk
              captures: { fee_id: "$.data[0].id", prov: "$.data[0].provisional_fee_cents" }
          trigger:
            - call: "POST /plats/${plat_id}/record"
              payload: { recorded_lot_count: 6, recorded_gross_acres: 10 }
              as: Clerk
          assert:
            - "ImpactFeeAssessment.${fee_id}.provisional_fee_cents == 2152500"
            - "ImpactFeeAssessment.${fee_id}.final_fee_cents == 2677500"
            - "ImpactFeeAssessment.${fee_id}.total_fee_cents == 2677500"
            - "ImpactFeeAssessment.${fee_id}.provisional_fee_cents != ImpactFeeAssessment.${fee_id}.final_fee_cents"

      - name: application_expiration_provisional_vs_final
        grounds:
          - calculations.application_expiration
          - entities.EntitlementApplication.fields.provisional_expiration_date
          - entities.EntitlementApplication.fields.final_expiration_date
          - state_machines.EntitlementApplication.DECIDED_APPROVED_to_EFFECTIVE
        distinguishing_aspect: "On the EntitlementApplication domain (distinct from ImpactFee), provisional_expiration_date = decision_at+730d = 2028-05-31 while final_expiration_date = effective_date+730d = 2028-06-15 for the same CUP."
        test_recipe:
          setup:
            - "A CUP application in DECIDED_APPROVED with decision_at 2026-06-01, appeal_deadline 2026-06-16; clock advanced past the appeal window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /parcels"
              payload: { apn: "APN-2", zoning_district: "COMM", area_acres: 3, neighbor_parcel_count: 8, expanded_neighbor_count: 15, sensitive_area: false }
              as: Admin
              captures: { parcel_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Ben Op", email: "ben@x.com" }
              as: Admin
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { application_type: "CUP", parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", requested_use: "drive-through" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/completeness"
              payload: { determination: "COMPLETE" }
              as: Planner
              as_user_id: "planner-1"
            - call: "POST /applications/${app_id}/notices"
              payload: { notice_kind: "MAILED" }
              as: Clerk
            - call: "POST /hearings"
              payload: { body: "PLANNING_COMMISSION", scheduled_date: "2026-06-11T00:00:00Z", agenda_capacity: 5 }
              as: Clerk
              captures: { hearing_id: $.data.id, h_v: $.data.version }
            - call: "POST /hearings/${hearing_id}/agenda-items"
              payload: { application_id: "${app_id}", expected_hearing_version: "${h_v}" }
              as: Clerk
              captures: { item_id: $.data.id }
            - call: "POST /agenda-items/${item_id}/decide"
              payload: { decision: "APPROVE", findings: [{ finding_code: "F-A", finding_text: "compatible use", supports_approval: true }] }
              as: Commissioner
              as_user_id: "commish-1"
            - call: "GET /applications/${app_id}"
              as: Clerk
              captures: { prov_exp: $.data.provisional_expiration_date }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-17T00:00:00Z" }
              as: Admin
          trigger:
            - call: "POST /applications/${app_id}/effectuate"
              payload: {}
              as: Clerk
              captures: { final_exp: $.data.final_expiration_date }
          assert:
            - "EntitlementApplication.${app_id}.provisional_expiration_date == 2028-05-31T00:00:00Z"
            - "EntitlementApplication.${app_id}.effective_date == 2026-06-16T00:00:00Z"
            - "EntitlementApplication.${app_id}.final_expiration_date == 2028-06-15T00:00:00Z"
            - "EntitlementApplication.${app_id}.final_expiration_date != EntitlementApplication.${app_id}.provisional_expiration_date"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: impact_fee_gross_three_tiers_mode_a
