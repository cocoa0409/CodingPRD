            - { call: "POST /curb/schedule-windows", payload: { permit_id: "${permit_id}", zone_id: "${z1}", day_of_week: 0, start_minute: 540, end_minute: 600, exclusive: true }, as: Permittee, as_user_id: "${pm_id}", captures: { win_a: $.data.id } }
            - { call: "POST /curb/schedule-windows", payload: { permit_id: "${permit_id}", zone_id: "${z1}", day_of_week: 0, start_minute: 615, end_minute: 675, exclusive: true }, as: Permittee, as_user_id: "${pm_id}", captures: { win_b: $.data.id } }
          trigger:
