  # ===========================================================================
  # RULE 8 - Resource/temporal overlap under three different interval
  #          semantics on three different resource entities
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: stage_buffered_minute_overlap_gap_exactly_at_buffer
        grounds:
          - validations.priority_39
          - entities.Stage.fields.changeover_buffer_minutes
          - entities.Offer.fields.load_in_start_utc
          - entities.Offer.fields.load_out_end_utc
          - errors.ERR_STAGE_SLOT_CONFLICT
        distinguishing_aspect: |
          RESOURCE: Stage. SEMANTICS: minute-granular, half-open on each side, and inflated
          by changeover_buffer_minutes on both comparisons - so the forbidden zone is the
          occupation window grown by 120 minutes, and a gap of exactly the buffer is legal.
          A 90-minute gap (candidate load-in 2026-08-23T00:30) is refused while a
          120-minute gap (candidate load-in 2026-08-23T01:00) is admitted, which is a
          strict-versus-non-strict comparison on minutes. Neither of the other two instances
          reasons about clock time at all.
        test_recipe:
          setup:
            - "One stage with changeover_buffer_minutes 120 and slot_soft_cap 4."
            - "An existing SENT hold for a COUNTRY act occupying 2026-08-22T14:00 -> 2026-08-22T23:00, so the buffered forbidden zone ends at 2026-08-23T01:00."
            - "Candidate B for a ROCK act: 2026-08-23, load_in 00:30, load_out 05:00 - a 90-minute gap, inside the buffer."
            - "Candidate A for the same ROCK act: 2026-08-23, load_in 01:00, load_out 06:00 - a gap of exactly 120 minutes."
            - "Candidate B is sent first so its refusal cannot be blamed on candidate A's own hold; both candidates are curfew-legal against the 23:30 gate and clear of genre adjacency because the incumbent is COUNTRY."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: FairOperationsDirector
            - call: "POST /grandstand/fair-editions"
              payload: { year: 2026, name: "Buffer Boundary Fair", run_start_date: "2026-08-20", run_end_date: "2026-08-30", gate_admission_price_cents: 1500, talent_budget_cap_cents: 40000000, refund_reserve_cents: 15000000, max_shows_per_day: 2, curfew_utc_time: "23:30", strategy_basis: "ATTENDANCE_WEIGHTED" }
              as: FairOperationsDirector
              captures: { ed: "$.data.id" }
            - call: "POST /grandstand/stages"
              payload: { fair_edition_id: "${ed}", name: "Grandstand", reserved_seat_capacity: 4000, ga_capacity: 6000, changeover_buffer_minutes: 120, slot_soft_cap: 4 }
              as: FairOperationsDirector
              captures: { st: "$.data.id" }
            - call: "POST /grandstand/talent-agents"
              payload: { user_id: "agent-hollis", agency_name: "Hollis Talent", contact_email: "book@hollis.example" }
              as: TalentBuyer
              captures: { ag: "$.data.id" }
            - call: "POST /grandstand/artists"
              payload: { agent_id: "${ag}", name: "Dust Road Revival", genre: "COUNTRY", audience_segment: "FAMILY", base_draw_score: 62.50 }
              as: TalentBuyer
              captures: { ar1: "$.data.id" }
            - call: "POST /grandstand/artists"
              payload: { agent_id: "${ag}", name: "Nine Volt Sermon", genre: "ROCK", audience_segment: "YOUNG_ADULT", base_draw_score: 55.00 }
              as: TalentBuyer
              captures: { ar2: "$.data.id" }
            - call: "POST /grandstand/offers"
              payload: { fair_edition_id: "${ed}", artist_id: "${ar1}", target_stage_id: "${st}", deal_type: "VERSUS", offered_guarantee_cents: 9000000, backend_split_pct: 0.8500, backend_breakeven_cents: 6000000, radius_miles: 150, radius_days_before: 30, radius_days_after: 30, target_show_date: "2026-08-22", load_in_start_utc: "2026-08-22T14:00:00.000Z", load_out_end_utc: "2026-08-22T23:00:00.000Z", response_window_hours: 48 }
              as: TalentBuyer
              captures: { of_hold: "$.data.id" }
            - call: "POST /grandstand/offers/${of_hold}/send"
              payload: {}
              as: TalentBuyer
            - call: "POST /grandstand/offers"
              payload: { fair_edition_id: "${ed}", artist_id: "${ar2}", target_stage_id: "${st}", deal_type: "VERSUS", offered_guarantee_cents: 4000000, backend_split_pct: 0.8000, backend_breakeven_cents: 3000000, radius_miles: 150, radius_days_before: 30, radius_days_after: 30, target_show_date: "2026-08-23", load_in_start_utc: "2026-08-23T00:30:00.000Z", load_out_end_utc: "2026-08-23T05:00:00.000Z", response_window_hours: 48 }
              as: TalentBuyer
              captures: { of_b: "$.data.id" }
            - call: "POST /grandstand/offers"
              payload: { fair_edition_id: "${ed}", artist_id: "${ar2}", target_stage_id: "${st}", deal_type: "VERSUS", offered_guarantee_cents: 4000000, backend_split_pct: 0.8000, backend_breakeven_cents: 3000000, radius_miles: 150, radius_days_before: 30, radius_days_after: 30, target_show_date: "2026-08-23", load_in_start_utc: "2026-08-23T01:00:00.000Z", load_out_end_utc: "2026-08-23T06:00:00.000Z", response_window_hours: 48 }
              as: TalentBuyer
              captures: { of_a: "$.data.id" }
          trigger:
            - call: "POST /grandstand/offers/${of_b}/send"
              payload: {}
              as: TalentBuyer
              captures: { err_gap_90: "$.data.error_id" }
            - call: "POST /grandstand/offers/${of_a}/send"
              payload: {}
              as: TalentBuyer
          assert:
            - "the 90-minute-gap send returns HTTP 409 with ${err_gap_90} == ERR_STAGE_SLOT_CONFLICT"
            - "Offer.${of_b}.status is still DRAFT and Stage.${st}.held_show_count == 1 at that point"
            - "the 120-minute-gap send returns HTTP 200 and Offer.${of_a}.status == SENT"
            - "Stage.${st}.held_show_count == 2 after the admitted send"
            - "FairEdition.${ed}.committed_guarantee_total_cents == 13000000"

      - name: artist_radius_closed_asymmetric_day_window
        grounds:
          - validations.priority_40
          - entities.Offer.fields.radius_days_before
          - entities.Offer.fields.radius_days_after
          - entities.Offer.fields.radius_waiver_granted
          - errors.ERR_RADIUS_CLAUSE_CONFLICT
        distinguishing_aspect: |
          RESOURCE: Artist. SEMANTICS: day-granular, closed on both endpoints and
          deliberately asymmetric about the incumbent date - the window is
          [date - radius_days_before, date + radius_days_after] with 3 days before and only
          1 day after. A candidate on 2026-08-19, exactly the lower endpoint, is refused;
          a candidate on 2026-08-25, three days after (and so outside the one-day upper
          half-width), is admitted. The asymmetry means an implementation using a single
          symmetric radius passes one probe and fails the other, and no clock time is
          consulted at any point.
