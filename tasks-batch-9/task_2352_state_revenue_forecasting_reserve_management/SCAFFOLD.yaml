  # --------------------------------------------------------------- writes ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to wall-clock time. Every deadline, cooling-off window and vote-closing check in this domain reads the logical clock."
    roles: [ForecastDirector, ReserveTreasurer]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string, lapsed_request_count: integer }"
    side_effects:
      - "every WithdrawalRequest with status == APPROVED whose deadline_date < date(current_utc) transitions APPROVED -> LAPSED (ordered by WithdrawalRequest.created_at ASC) and increments its version by 1"
      - "lapsed_request_count reports how many requests lapsed on this call"
  - method: POST
    path: "/forecast-cycles"
    description: "Open a forecast cycle in DRAFT. A REVISION cycle must name the CERTIFIED cycle of the same fiscal year that it will supersede."
    roles: [ForecastDirector]
    code: 201
    input: [fiscal_year, cycle_type, reconciliation_policy, enacted_appropriation_cents, prior_recurring_baseline_cents, "supersedes_cycle_id?"]
    output: ForecastCycle
    side_effects:
      - "status = DRAFT; scenario_weight_total_bps = 0; reopen_count = 0; all certified_* fields null"
  - method: PATCH
    path: "/forecast-cycles/{id}"
    description: "Amend a DRAFT cycle's enacted appropriation, prior recurring baseline or reconciliation policy."
    roles: [ForecastDirector]
    code: 200
    input: ["enacted_appropriation_cents?", "prior_recurring_baseline_cents?", "reconciliation_policy?"]
    output: ForecastCycle
    side_effects:
      - "increments ForecastCycle.version by 1"
  - method: POST
    path: "/forecast-cycles/{id}/scenarios"
    description: "Add an economic scenario to a DRAFT cycle. cycle_id is taken from the path."
    roles: [ForecastDirector, ExecutiveEconomist]
    code: 201
    input: [label, weight_bps, employment_growth_bps, wage_income_bps, retail_sales_bps, asset_market_return_bps]
    output: EconomicScenario
    side_effects:
      - "ForecastCycle.scenario_weight_total_bps = sum of the cycle's scenario weight_bps"
      - "increments ForecastCycle.version by 1"
  - method: PATCH
    path: "/economic-scenarios/{id}"
    description: "Re-weight or re-specify a scenario while its cycle is still DRAFT."
    roles: [ForecastDirector, ExecutiveEconomist]
    code: 200
    input: ["label?", "weight_bps?", "employment_growth_bps?", "wage_income_bps?", "retail_sales_bps?", "asset_market_return_bps?"]
    output: EconomicScenario
    side_effects:
      - "ForecastCycle.scenario_weight_total_bps recomputed"
      - "increments EconomicScenario.version and ForecastCycle.version by 1"
  - method: DELETE
    path: "/economic-scenarios/{id}"
    description: "Drop a scenario from a DRAFT cycle."
    roles: [ForecastDirector]
    code: 204
    input: []
    output: null
    side_effects:
      - "ForecastCycle.scenario_weight_total_bps recomputed"
      - "increments ForecastCycle.version by 1"
  - method: POST
    path: "/forecast-cycles/{id}/lock-inputs"
    description: "Freeze the cycle's economic inputs: DRAFT -> INPUTS_LOCKED. Requires the scenario weights to total exactly 10000 bps."
    roles: [ForecastDirector]
    code: 200
    input: []
    output: ForecastCycle
    side_effects:
      - "status = INPUTS_LOCKED; the cycle's EconomicScenario rows become immutable"
      - "increments ForecastCycle.version by 1"
  - method: POST
    path: "/forecast-cycles/{id}/reopen"
    description: "Send a cycle back to DRAFT for re-weighting: IN_CONSENSUS -> DRAFT. Only legal while no round has been ratified."
    roles: [ForecastDirector]
    code: 200
    input: []
    output: ForecastCycle
    side_effects:
      - "every non-terminal ConsensusRound of the cycle -> SUPERSEDED and their OPEN DisagreementRecord rows -> VOIDED"
      - "reopen_count += 1; ratified_round_id = null"
      - "increments ForecastCycle.version by 1"
  - method: POST
    path: "/forecast-cycles/{id}/certify"
    description: "Certify the ratified forecast: CONSENSUS_REACHED -> CERTIFIED. Drives the four-link deposit cascade and, for a REVISION cycle, supersedes its predecessor."
    roles: [ForecastDirector]
    code: 200
    input: []
    output: ForecastCycle
    side_effects:
      - "certified_total_cents / certified_one_time_cents / certified_recurring_total_cents / certified_at written"
      - "shortfall_gap_cents and shortfall_pct_bps written by `shortfall_trigger`"
      - "for every ReserveFund in created_at order: `reserve_deposit_amount` evaluated; a CERTIFICATION_DEPOSIT ReserveTransaction minted when the post-cap deposit is > 0; balance_cents and last_transaction_at updated"
      - "on the FIRST certification of a given fiscal_year: after the deposit is applied, fy_opening_balance_cents = balance_cents and fy_withdrawn_cents = 0 on every ReserveFund — this is the base the fiscal-year withdrawal cap is measured against"
      - "`reserve_adequacy` re-run on every ReserveFund; deposit_posture may flip ACCEPTING -> AT_CAP; ReserveFund.version increments"
      - "every PUBLISHED RatingAgencyBriefing of an affected fund -> STALE (RESERVE_BALANCE_CHANGED)"
      - "when cycle_type == REVISION: the superseded cycle -> SUPERSEDED and its PUBLISHED briefings -> STALE (CYCLE_SUPERSEDED)"
      - "increments ForecastCycle.version by 1"
  - method: POST
    path: "/revenue-sources"
    description: "Register a revenue source with its elasticities against the four macro drivers."
    roles: [ForecastDirector]
    code: 201
    input: [name, tax_type, base_year_receipts_cents, elasticity_employment_bps, elasticity_wage_income_bps, elasticity_retail_bps, elasticity_asset_bps, volatility_class]
    output: RevenueSource
    side_effects:
      - "status = ACTIVE; mape_bps = 0; methodology_flag = false; posted_actual_count = 0"
  - method: PATCH
    path: "/revenue-sources/{id}"
    description: "Retire a source or restate its base-year receipts / volatility class."
    roles: [ForecastDirector]
    code: 200
    input: ["status?", "volatility_class?", "base_year_receipts_cents?"]
    output: RevenueSource
    side_effects:
      - "increments RevenueSource.version by 1"
  - method: POST
    path: "/revenue-sources/{id}/policy-adjustments"
    description: "Attach a statutory policy change to a source. source_id is taken from the path. effective_end_date is EXCLUSIVE, so an adjustment ending on the day the next one starts does not overlap."
    roles: [ForecastDirector, ExecutiveEconomist]
    code: 201
    input: [statute_code, policy_category, adjustment_kind, annualized_amount_cents, effective_start_date, "effective_end_date?", phase_in_type, first_effective_fiscal_year, "cap_amount_cents?"]
    output: PolicyChangeAdjustment
    side_effects:
      - "cap_amount_cents defaults to 0 (uncapped)"
  - method: PATCH
    path: "/policy-adjustments/{id}"
    description: "Restate a policy adjustment's amount, window, phase-in shape or cap."
    roles: [ForecastDirector, ExecutiveEconomist]
    code: 200
    input: ["annualized_amount_cents?", "effective_start_date?", "effective_end_date?", "phase_in_type?", "cap_amount_cents?"]
    output: PolicyChangeAdjustment
    side_effects:
      - "increments PolicyChangeAdjustment.version by 1"
  - method: DELETE
    path: "/policy-adjustments/{id}"
    description: "Remove a policy adjustment."
    roles: [ForecastDirector]
    code: 204
    input: []
    output: null
    side_effects: []
  - method: POST
    path: "/one-time-items"
    description: "Record a non-recurring amount inside a cycle's forecast for one source."
    roles: [ForecastDirector, ExecutiveEconomist, LegislativeEconomist]
    code: 201
    input: [cycle_id, source_id, item_type, amount_cents, description]
    output: OneTimeItem
    side_effects:
      - "status = ACTIVE"
      - "every unlocked SourceEstimate for that (cycle, source) recomputes one_time_cents and estimate_amount_cents; the round's variance and reconciled_total_cents are recomputed"
  - method: POST
    path: "/one-time-items/{id}/void"
    description: "Void a non-recurring amount. Recomputing the affected estimates can push a COMPARED round back to DISPUTED."
    roles: [ForecastDirector, ExecutiveEconomist, LegislativeEconomist]
    code: 200
    input: []
    output: OneTimeItem
    side_effects:
      - "status = VOIDED; voided_at = clock"
      - "every unlocked SourceEstimate for that (cycle, source) recomputes one_time_cents and estimate_amount_cents"
      - "the owning ConsensusRound recomputes `consensus_variance` and `consensus_reconciled_total`; COMPARED -> DISPUTED when a per-source variance now breaches per_source_tolerance_bps"
      - "increments OneTimeItem.version by 1"
  - method: POST
    path: "/consensus-rounds"
    description: "Open a negotiation round on a locked cycle. A second round legitimately supersedes the cycle's prior non-terminal round, so the caller must pin the cycle version it observed (§1.2.1 round-open-stale-cycle)."
    roles: [ForecastDirector]
    code: 201
    input: [cycle_id, variance_tolerance_bps, per_source_tolerance_bps, expected_cycle_version]
    output: ConsensusRound
    side_effects:
      - "round_number = (max round_number on the cycle) + 1, starting at 1"
      - "status = OPEN; exec_submission_status = leg_submission_status = PENDING; open_disagreement_count = 0"
      - "every prior non-terminal ConsensusRound of the cycle -> SUPERSEDED and its OPEN DisagreementRecord rows -> VOIDED"
      - "ForecastCycle INPUTS_LOCKED -> IN_CONSENSUS (or the IN_CONSENSUS self-loop)"
      - "increments ForecastCycle.version by 1"
  - method: POST
    path: "/source-estimates"
    description: "File one body's estimate for one source in an open round. `body` is derived from the caller's role (ExecutiveEconomist -> EXECUTIVE, LegislativeEconomist -> LEGISLATIVE); submitted_by_user_id is the X-User-ID header. The three computed components come from `weighted_scenario_source_estimate`, `policy_change_phase_in_amount` and the cycle's ACTIVE one-time items."
    roles: [ExecutiveEconomist, LegislativeEconomist]
    code: 201
    input: [round_id, source_id, "judgmental_adjustment_cents?"]
    output: SourceEstimate
    side_effects:
      - "weighted_scenario_cents, policy_adjustment_cents, one_time_cents, recurring_component_cents and estimate_amount_cents computed; locked = false"
      - "judgmental_adjustment_cents defaults to 0"
  - method: PATCH
    path: "/source-estimates/{id}"
    description: "Revise the judgmental component of an unlocked estimate."
    roles: [ExecutiveEconomist, LegislativeEconomist]
    code: 200
    input: [judgmental_adjustment_cents]
    output: SourceEstimate
    side_effects:
      - "recurring_component_cents and estimate_amount_cents recomputed"
      - "when the round is already COMPARED or DISPUTED, `consensus_variance` and `consensus_reconciled_total` are recomputed"
      - "increments SourceEstimate.version by 1"
  - method: POST
    path: "/consensus-rounds/{id}/submit"
    description: "Mark the acting body's submission dimension SUBMITTED. The two dimensions are independent and may be submitted in either order; the second one drives the round to COMPARED or DISPUTED."
    roles: [ExecutiveEconomist, LegislativeEconomist]
    code: 200
    input: []
    output: ConsensusRound
    side_effects:
      - "exec_submission_status or leg_submission_status = SUBMITTED; the matching total is computed"
      - "when both dimensions are SUBMITTED: `consensus_variance` then `consensus_reconciled_total` run; status -> COMPARED, or -> DISPUTED with one DisagreementRecord per breaching source and open_disagreement_count set"
      - "increments ConsensusRound.version by 1"
  - method: POST
    path: "/disagreement-records/{id}/resolve"
    description: "Document the resolution of a per-source disagreement. EXEC_VALUE / LEG_VALUE / MIDPOINT derive the amount; DIRECTOR_OVERRIDE requires an explicit amount inside the two submissions' band. The resolver may not be either estimate's author."
    roles: [ForecastDirector]
    code: 200
    input: [resolution_method, rationale, "resolved_amount_cents?"]
    output: DisagreementRecord
    side_effects:
      - "status = RESOLVED; resolved_amount_cents, resolved_by_user_id, resolved_at written"
      - "ConsensusRound.open_disagreement_count -= 1 and `consensus_reconciled_total` recomputed with this source's resolved value substituted"
      - "when open_disagreement_count reaches 0: ConsensusRound DISPUTED -> COMPARED"
      - "increments DisagreementRecord.version and ConsensusRound.version by 1"
  - method: POST
    path: "/consensus-rounds/{id}/ratify"
    description: "Ratify a compared round with no open disagreements: COMPARED -> RATIFIED, bubbling the cycle to CONSENSUS_REACHED."
    roles: [ForecastDirector]
    code: 200
    input: []
    output: ConsensusRound
    side_effects:
      - "status = RATIFIED; ratified_at = clock; every SourceEstimate of the round sets locked = true"
      - "ForecastCycle IN_CONSENSUS -> CONSENSUS_REACHED with ratified_round_id set"
      - "increments ConsensusRound.version and ForecastCycle.version by 1"
  - method: POST
    path: "/reserve-funds"
    description: "Create a reserve fund with its deposit rule, cap, seat count and withdrawal limits."
    roles: [ForecastDirector]
    code: 201
    input: [name, cap_pct_bps, trend_growth_rate_bps, capture_rate_bps, deposit_rule_variant, eligible_seats, annual_withdrawal_cap_pct_bps, cooling_off_days, opening_balance_cents]
    output: ReserveFund
    side_effects:
      - "balance_cents = fy_opening_balance_cents = opening_balance_cents; fy_withdrawn_cents = 0; deposit_posture = ACCEPTING"
      - "cap_cents, volatility_index_bps, target_pct_bps, required_reserve_cents, coverage_ratio_bps, adequacy_band, cushion_credit_bps and disclosed_target_pct_bps stay null/0 until a cycle is certified or adequacy is recomputed"
  - method: POST
    path: "/reserve-funds/{id}/deposits"
    description: "Post a manual deposit into the fund. Unlike a certification deposit, a manual deposit that exceeds the fund's headroom is rejected outright rather than trimmed with an overflow return."
    roles: [ReserveTreasurer]
    code: 201
    input: [amount_cents, memo]
    output: ReserveTransaction
    side_effects:
      - "a ReserveTransaction with origin MANUAL_DEPOSIT, signed_amount_cents = +amount_cents, gross_computed_cents = amount_cents, overflow_returned_cents = 0"
      - "ReserveFund.balance_cents += amount_cents; last_transaction_at = the transaction's created_at; `reserve_adequacy` re-run; deposit_posture may flip ACCEPTING -> AT_CAP"
      - "every PUBLISHED RatingAgencyBriefing of the fund -> STALE (RESERVE_BALANCE_CHANGED)"
      - "increments ReserveFund.version by 1"
  - method: POST
    path: "/reserve-transactions/{id}/reverse"
    description: "Compensate a ledger row with an equal and opposite REVERSAL row. Reversing a deposit lowers the balance; reversing a withdrawal restores it and releases the fiscal-year drawn total."
    roles: [ReserveTreasurer]
    code: 201
    input: [rationale]
    output: ReserveTransaction
    side_effects:
      - "a ReserveTransaction with origin REVERSAL, signed_amount_cents = -(original signed_amount_cents), reverses_transaction_id = the original row"
      - "ReserveFund.balance_cents adjusted by the reversal amount; when the original origin was WITHDRAWAL, fy_withdrawn_cents is reduced by the original amount"
      - "`reserve_adequacy` re-run; deposit_posture may flip in either direction; last_transaction_at = the reversal's created_at"
      - "every PUBLISHED RatingAgencyBriefing of the fund -> STALE (RESERVE_BALANCE_CHANGED)"
      - "increments ReserveFund.version by 1"
  - method: POST
    path: "/reserve-funds/{id}/recompute-adequacy"
    description: "Re-derive the fund's adequacy disclosure against the current reference cycle and the sources' current measured errors. This is the operator action that propagates a methodology finding (a source's mape_bps) into the fund's statutory target band."
    roles: [ForecastDirector, ReserveTreasurer]
    code: 200
    input: []
    output: ReserveFund
    side_effects:
      - "volatility_index_bps, target_pct_bps, required_reserve_cents, coverage_ratio_bps, adequacy_band, cushion_credit_bps, disclosed_target_pct_bps and cap_cents rewritten by `reserve_adequacy`"
      - "deposit_posture re-evaluated against the recomputed cap_cents"
      - "increments ReserveFund.version by 1"
  - method: POST
    path: "/withdrawal-requests"
    description: "Draft a withdrawal against a fund, justified by a certified cycle. A new draft legitimately supersedes any prior DRAFT request on the same fund, so the caller must pin the fund version it observed (§1.2.1 withdrawal-create-stale-fund)."
    roles: [ReserveTreasurer, ForecastDirector]
    code: 201
    input: [fund_id, cycle_id, requested_amount_cents, justification_type, deadline_date, expected_fund_version]
    output: WithdrawalRequest
    side_effects:
      - "status = DRAFT; requested_by_user_id = X-User-ID; votes_required = quorum_required = 0; yes/no/abstain = 0; authorized_amount_cents = 0"
      - "every other WithdrawalRequest on the same fund with status == DRAFT -> REJECTED with authorized_amount_cents 0"
      - "increments ReserveFund.version by 1"
  - method: POST
    path: "/withdrawal-requests/{id}/verify-shortfall"
    description: "Shortfall branch: approve a draw without a vote when the certified cycle's shortfall reaches 150 bps of the enacted appropriation. Authorises at most the certified shortfall gap."
    roles: [ReserveTreasurer]
    code: 200
    input: []
    output: WithdrawalRequest
    side_effects:
      - "status = APPROVED; approval_basis = SHORTFALL_TRIGGER; authorized_amount_cents = min(requested_amount_cents, cycle.shortfall_gap_cents)"
      - "no ballot field is ever populated on this branch"
      - "increments WithdrawalRequest.version by 1"
  - method: POST
    path: "/withdrawal-requests/{id}/open-vote"
    description: "Supermajority branch: open a seven-day ballot and freeze the two-thirds / one-half seat requirements."
    roles: [ForecastDirector]
    code: 200
    input: []
    output: WithdrawalRequest
    side_effects:
      - "status = VOTE_OPEN; votes_required = ceil(eligible_seats * 2 / 3); quorum_required = ceil(eligible_seats / 2); vote_closes_at = clock + 7 days"
      - "increments WithdrawalRequest.version by 1"
  - method: POST
    path: "/withdrawal-requests/{id}/votes"
    description: "Cast one ballot. request_id comes from the path and voter_user_id from X-User-ID; one ballot per voter per request."
    roles: [LegislativeVoter]
    code: 201
    input: [vote]
    output: WithdrawalVote
    side_effects:
      - "cast_at = clock; the request's yes_votes / no_votes / abstain_votes tally increments"
      - "increments WithdrawalRequest.version by 1"
  - method: POST
    path: "/withdrawal-requests/{id}/close-vote"
    description: "Close the ballot once it has run its seven days or every seat has voted, then apply quorum and supermajority: VOTE_OPEN -> APPROVED or REJECTED. An approval authorises at most the fiscal-year cap headroom."
    roles: [ForecastDirector]
    code: 200
    input: []
    output: WithdrawalRequest
    side_effects:
      - "on approval: status = APPROVED; approval_basis = SUPERMAJORITY_VOTE; authorized_amount_cents = min(requested_amount_cents, cap_headroom_cents)"
      - "on rejection: status = REJECTED; authorized_amount_cents = 0; approval_basis stays null"
      - "increments WithdrawalRequest.version by 1"
  - method: POST
    path: "/withdrawal-requests/{id}/execute"
    description: "Execute an approved draw: mints the WITHDRAWAL ledger row, moves the balance, opens the cooling-off window, re-derives adequacy and stales the fund's published briefings. The executor may not be the requester."
    roles: [ReserveTreasurer]
    code: 200
    input: []
    output: WithdrawalRequest
    side_effects:
      - "status = EXECUTED; executed_at = clock; a WITHDRAWAL ReserveTransaction is minted and executed_transaction_id points at it"
      - "ReserveFund.balance_cents -= authorized_amount_cents; fy_withdrawn_cents += authorized_amount_cents; cooling_off_until = transaction.created_at + cooling_off_days; last_transaction_at = transaction.created_at"
      - "`reserve_adequacy` re-run; deposit_posture may flip AT_CAP -> ACCEPTING"
      - "every PUBLISHED RatingAgencyBriefing of the fund -> STALE (RESERVE_BALANCE_CHANGED)"
      - "increments WithdrawalRequest.version and ReserveFund.version by 1"
  - method: POST
    path: "/actual-collections"
    description: "Post a closed fiscal year's actual receipts for one source, scoring them against the forecast certified for that year and rolling the source's three-year error window."
    roles: [ForecastDirector, ExecutiveEconomist]
    code: 201
    input: [source_id, fiscal_year, actual_amount_cents]
    output: ActualCollection
    side_effects:
      - "matched_cycle_id, matched_forecast_cents, abs_pct_error_bps and error_direction written by `forecast_error_metrics`"
      - "RevenueSource.posted_actual_count += 1; mape_bps recomputed over the three-year window; methodology_flag = mape_bps >= 500"
      - "increments RevenueSource.version by 1"
  - method: POST
    path: "/rating-briefings"
    description: "Draft a rating-agency briefing, snapshotting the fund's current version and adequacy disclosure."
    roles: [ForecastDirector, RatingAnalyst]
    code: 201
    input: [fund_id, cycle_id, narrative]
    output: RatingAgencyBriefing
    side_effects:
      - "status = DRAFT; snapshot_fund_version, snapshot_adequacy_band and snapshot_coverage_ratio_bps copied from the fund at creation time"
  - method: PATCH
    path: "/rating-briefings/{id}"
    description: "Edit a DRAFT briefing's narrative."
    roles: [ForecastDirector, RatingAnalyst]
    code: 200
    input: [narrative]
    output: RatingAgencyBriefing
    side_effects:
      - "increments RatingAgencyBriefing.version by 1"
  - method: POST
    path: "/rating-briefings/{id}/publish"
    description: "Publish a briefing. Publication is refused while the snapshot is behind the fund's current version unless refresh_snapshot is true, and refused for 48 hours after the fund's last ledger movement."
    roles: [ForecastDirector]
    code: 200
    input: ["refresh_snapshot?"]
    output: RatingAgencyBriefing
    side_effects:
      - "when refresh_snapshot is true the three snapshot_* fields are re-read from the live fund before publication"
      - "status = PUBLISHED; published_at = clock; stale_reason = null"
      - "increments RatingAgencyBriefing.version by 1"
  - method: POST
    path: "/rating-briefings/{id}/retract"
    description: "Withdraw a briefing from circulation. Terminal."
    roles: [ForecastDirector]
    code: 200
    input: []
    output: RatingAgencyBriefing
    side_effects:
      - "status = RETRACTED; retracted_at = clock"
      - "increments RatingAgencyBriefing.version by 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- auth ----
  - id: ERR_MISSING_ROLE_HEADER
    http: 401
    condition: "X-User-Role absent, empty, or naming a role not declared in §1.7"
  - id: ERR_MISSING_USER_HEADER
    http: 401
    condition: "X-User-ID absent or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the ForecastDirector resolving a disagreement authored either body's estimate for the disputed source"
  - id: ERR_EXECUTOR_IS_REQUESTER
    http: 403
    condition: "the treasurer executing a withdrawal is the request's requested_by_user_id"
  # ---- existence ----
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "no ForecastCycle with the given id (path or body)"
  - id: ERR_SCENARIO_NOT_FOUND
    http: 404
    condition: "no EconomicScenario with the given id"
  - id: ERR_SOURCE_NOT_FOUND
    http: 404
    condition: "no RevenueSource with the given id (path or body)"
  - id: ERR_ADJUSTMENT_NOT_FOUND
    http: 404
    condition: "no PolicyChangeAdjustment with the given id"
  - id: ERR_ONE_TIME_ITEM_NOT_FOUND
    http: 404
    condition: "no OneTimeItem with the given id"
  - id: ERR_ROUND_NOT_FOUND
    http: 404
    condition: "no ConsensusRound with the given id (path or body)"
  - id: ERR_ESTIMATE_NOT_FOUND
    http: 404
    condition: "no SourceEstimate with the given id"
  - id: ERR_DISAGREEMENT_NOT_FOUND
    http: 404
    condition: "no DisagreementRecord with the given id"
  - id: ERR_FUND_NOT_FOUND
    http: 404
    condition: "no ReserveFund with the given id (path or body)"
  - id: ERR_TRANSACTION_NOT_FOUND
    http: 404
    condition: "no ReserveTransaction with the given id"
  - id: ERR_REQUEST_NOT_FOUND
    http: 404
    condition: "no WithdrawalRequest with the given id"
  - id: ERR_VOTE_NOT_FOUND
    http: 404
    condition: "no WithdrawalVote with the given id"
  - id: ERR_ACTUAL_NOT_FOUND
    http: 404
    condition: "no ActualCollection with the given id"
  - id: ERR_BRIEFING_NOT_FOUND
    http: 404
    condition: "no RatingAgencyBriefing with the given id"
  # ---- request shape ----
  - id: ERR_VALIDATION
    http: 422
    condition: "missing required field, unknown enum value, non-integer or negative money/bps value, malformed date, or narrative/memo outside its length bounds"
  # ---- OCC ----
  - id: ERR_STALE_CYCLE_VERSION
    http: 412
    condition: "expected_cycle_version does not equal the ForecastCycle's current version on POST /consensus-rounds"
  - id: ERR_STALE_FUND_VERSION
    http: 412
    condition: "expected_fund_version does not equal the ReserveFund's current version on POST /withdrawal-requests"
  # ---- state ----
  - id: ERR_CYCLE_NOT_IN_DRAFT
    http: 409
    condition: "an economic input is created, patched, deleted or locked while its cycle is not DRAFT"
  - id: ERR_CYCLE_NOT_LOCKED
    http: 409
    condition: "a ConsensusRound is opened on a cycle that is neither INPUTS_LOCKED nor IN_CONSENSUS"
  - id: ERR_CYCLE_ALREADY_RATIFIED
    http: 409
    condition: "reopen attempted on a cycle that is not IN_CONSENSUS, or that already has a RATIFIED round"
  - id: ERR_CYCLE_NOT_CONSENSUS_REACHED
    http: 409
    condition: "certification attempted on a cycle that is not CONSENSUS_REACHED"
  - id: ERR_ROUND_NOT_OPEN
    http: 409
    condition: "a body submits, or an estimate is created or patched, on a round that is not OPEN (estimates additionally allow COMPARED)"
  - id: ERR_BODY_ALREADY_SUBMITTED
    http: 409
    condition: "the acting body's submission dimension is already SUBMITTED"
  - id: ERR_ROUND_NOT_COMPARED
    http: 409
    condition: "ratification attempted on a round that is not COMPARED with zero open disagreements"
  - id: ERR_DISAGREEMENT_NOT_OPEN
    http: 409
    condition: "resolution attempted on a DisagreementRecord that is RESOLVED or VOIDED"
  - id: ERR_ESTIMATE_LOCKED
    http: 409
    condition: "a SourceEstimate is patched after its round was ratified (locked == true)"
  - id: ERR_ONE_TIME_ITEM_NOT_ACTIVE
    http: 409
    condition: "void attempted on a OneTimeItem that is already VOIDED"
  - id: ERR_REQUEST_NOT_DRAFT
    http: 409
    condition: "an approval branch is entered on a WithdrawalRequest that is not DRAFT"
  - id: ERR_VOTE_NOT_OPEN
    http: 409
    condition: "a ballot is cast, or the vote closed, on a WithdrawalRequest that is not VOTE_OPEN"
  - id: ERR_REQUEST_NOT_APPROVED
    http: 409
    condition: "execution attempted on a WithdrawalRequest that is not APPROVED"
  - id: ERR_AUTHORIZATION_LAPSED
    http: 409
    condition: "execution attempted on a WithdrawalRequest the clock drove to LAPSED past its deadline_date"
  - id: ERR_BRIEFING_NOT_PUBLISHABLE
    http: 409
    condition: "publication attempted on a briefing that is neither DRAFT nor STALE"
  - id: ERR_BRIEFING_TERMINAL
    http: 409
    condition: "any transition attempted on a RETRACTED briefing"
  - id: ERR_FUND_AT_CAP
    http: 409
    condition: "a manual deposit is posted while the fund's deposit_posture is AT_CAP"
  - id: ERR_TRANSACTION_ALREADY_REVERSED
    http: 409
    condition: "reversal attempted on a REVERSAL row, or on a row that already has a reversal pointing at it"
  # ---- temporal ----
  - id: ERR_VOTE_STILL_OPEN
    http: 409
    condition: "close-vote before clock reaches vote_closes_at while at least one eligible seat has not voted"
  - id: ERR_COOLING_OFF_ACTIVE
    http: 409
    condition: "execution attempted while clock <= fund.cooling_off_until"
  - id: ERR_BRIEFING_COOLING_PERIOD
    http: 409
    condition: "publication attempted within 48 hours of the fund's last_transaction_at"
  - id: ERR_INVALID_EFFECTIVE_WINDOW
    http: 422
    condition: "a policy adjustment's effective_end_date is not strictly after its effective_start_date"
  - id: ERR_POLICY_WINDOW_OVERLAP
    http: 409
    condition: "two ACTIVE policy adjustments of the same source and policy_category have overlapping half-open windows (sharing only the boundary date is legal)"
  - id: ERR_FISCAL_YEAR_NOT_CLOSED
    http: 409
    condition: "an actual collection is posted on or before (fiscal_year)-06-30 by the logical clock"
  # ---- statutory safety ----
  - id: ERR_JUSTIFICATION_MISMATCH
    http: 422
    condition: "the approval branch does not match the request's justification_type"
  - id: ERR_SHORTFALL_NOT_TRIGGERED
    http: 422
    condition: "the certified cycle's shortfall_pct_bps is below 150"
  - id: ERR_QUORUM_NOT_MET
    http: 422
    condition: "ballots cast are fewer than quorum_required at close-vote"
  - id: ERR_SUPERMAJORITY_NOT_MET
    http: 422
    condition: "quorum was met but yes_votes are fewer than votes_required — evaluated only after ERR_QUORUM_NOT_MET passes"
  - id: ERR_DUPLICATE_VOTE
    http: 409
    condition: "the acting voter already cast a ballot on this request"
  - id: ERR_ADEQUACY_STALE
    http: 409
    condition: "publication attempted while snapshot_fund_version is behind the fund's version and refresh_snapshot was not set"
  # ---- referential ----
  - id: ERR_SOURCE_RETIRED
    http: 422
    condition: "a policy adjustment, one-time item, estimate or actual collection references a RETIRED RevenueSource"
  - id: ERR_CYCLE_NOT_CERTIFIED
    http: 409
    condition: "a withdrawal request references a ForecastCycle whose status is not CERTIFIED"
  - id: ERR_CYCLE_ALREADY_CERTIFIED
    http: 409
    condition: "a one-time item is created in, or voided on, a cycle that is already CERTIFIED or SUPERSEDED"
  - id: ERR_NO_CERTIFIED_FORECAST
    http: 422
    condition: "no CERTIFIED or SUPERSEDED cycle exists for the actual collection's fiscal_year"
  - id: ERR_INVALID_SUPERSEDE_TARGET
    http: 422
    condition: "a REVISION cycle names no supersedes_cycle_id, names one that is not CERTIFIED, or names one with a different fiscal_year; or a BASELINE cycle names one at all"
  # ---- constraint ----
  - id: ERR_SCENARIO_WEIGHTS_INVALID
    http: 422
    condition: "the cycle's scenario weight_bps do not total exactly 10000 at lock-inputs, or the cycle has no scenarios"
  - id: ERR_DUPLICATE_SCENARIO_LABEL
    http: 409
    condition: "a second scenario with the same label is added to a cycle"
  - id: ERR_DUPLICATE_ESTIMATE
    http: 409
    condition: "a second estimate for the same (round_id, source_id, body) is filed"
  - id: ERR_INCOMPLETE_SUBMISSION
    http: 422
    condition: "the submitting body has no estimate for at least one ACTIVE RevenueSource"
  - id: ERR_DUPLICATE_ACTUAL
    http: 409
    condition: "a second actual collection for the same (source_id, fiscal_year) is posted"
  - id: ERR_OVERRIDE_OUT_OF_RANGE
    http: 422
    condition: "a DIRECTOR_OVERRIDE resolution amount falls outside the inclusive band bounded by the two submissions"
  - id: ERR_RESOLUTION_AMOUNT_NOT_ALLOWED
    http: 422
    condition: "resolved_amount_cents supplied with resolution_method EXEC_VALUE, LEG_VALUE or MIDPOINT"
  - id: ERR_RATIONALE_TOO_SHORT
    http: 422
    condition: "rationale is shorter than 20 characters"
  # ---- fiscal ----
  - id: ERR_JUDGMENTAL_ADJUSTMENT_CAP
    http: 422
    condition: "abs(judgmental_adjustment_cents) exceeds 1000 bps of the estimate's pre-judgmental recurring amount"
  - id: ERR_DEPOSIT_EXCEEDS_CAP
    http: 422
    condition: "a manual deposit exceeds the fund's remaining headroom max(0, cap_cents - balance_cents)"
  - id: ERR_ANNUAL_CAP_EXCEEDED
    http: 422
    condition: "fy_withdrawn_cents + authorized_amount_cents would exceed the fiscal-year withdrawal cap"
  - id: ERR_INSUFFICIENT_RESERVE_BALANCE
    http: 422
    condition: "authorized_amount_cents exceeds the fund's current balance_cents at execution"
  - id: ERR_REVERSAL_WOULD_OVERDRAW
    http: 422
    condition: "reversing a deposit would drive balance_cents below zero"

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties
#
# Every role is `opaque`: the state's revenue estimating body has no persisted
# person entity, and X-User-ID is an operator identifier. The scaffold stores
# opaque ids on SourceEstimate.submitted_by_user_id,
# DisagreementRecord.resolved_by_user_id, WithdrawalRequest.requested_by_user_id
# and WithdrawalVote.voter_user_id, and compares them to X-User-ID for the two
# segregation-of-duties rules (§1.4 priorities 37 and 38) — never to any
# entity's id.
# =============================================================================
roles:
  - name: ForecastDirector
    description: "Chair of the consensus process. Owns cycle lifecycle, round lifecycle, disagreement resolution, certification and rating-agency publication. Cannot file an estimate or cast a ballot."
    identity: opaque
    exclusive_operations:
      - "POST /forecast-cycles"
      - "PATCH /forecast-cycles/{id}"
      - "POST /forecast-cycles/{id}/lock-inputs"
      - "POST /forecast-cycles/{id}/reopen"
      - "POST /forecast-cycles/{id}/certify"
      - "POST /revenue-sources"
      - "PATCH /revenue-sources/{id}"
      - "DELETE /economic-scenarios/{id}"
      - "DELETE /policy-adjustments/{id}"
      - "POST /consensus-rounds"
      - "POST /consensus-rounds/{id}/ratify"
      - "POST /disagreement-records/{id}/resolve"
      - "POST /reserve-funds"
      - "POST /withdrawal-requests/{id}/open-vote"
      - "POST /withdrawal-requests/{id}/close-vote"
      - "POST /rating-briefings/{id}/publish"
      - "POST /rating-briefings/{id}/retract"
    shared_operations:
      - "POST /forecast-cycles/{id}/scenarios (with ExecutiveEconomist)"
      - "POST /revenue-sources/{id}/policy-adjustments and PATCH /policy-adjustments/{id} (with ExecutiveEconomist)"
      - "PATCH /economic-scenarios/{id} (with ExecutiveEconomist)"
      - "POST /one-time-items and POST /one-time-items/{id}/void (with both economists)"
      - "POST /actual-collections (with ExecutiveEconomist)"
      - "POST /withdrawal-requests (with ReserveTreasurer)"
      - "POST /reserve-funds/{id}/recompute-adequacy (with ReserveTreasurer)"
      - "POST /rating-briefings and PATCH /rating-briefings/{id} (with RatingAnalyst)"
      - "POST /_clock/set_current_utc (with ReserveTreasurer)"
      - "all GET endpoints"
  - name: ExecutiveEconomist
    description: "The executive branch's estimating staff. Files the EXECUTIVE side of every round and maintains the economic inputs. Cannot ratify, certify, or resolve a disagreement."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /source-estimates and PATCH /source-estimates/{id} (with LegislativeEconomist; body is derived as EXECUTIVE)"
      - "POST /consensus-rounds/{id}/submit (with LegislativeEconomist; drives exec_submission_status)"
      - "POST /forecast-cycles/{id}/scenarios, PATCH /economic-scenarios/{id} (with ForecastDirector)"
      - "POST /revenue-sources/{id}/policy-adjustments, PATCH /policy-adjustments/{id} (with ForecastDirector)"
      - "POST /one-time-items, POST /one-time-items/{id}/void (with ForecastDirector and LegislativeEconomist)"
      - "POST /actual-collections (with ForecastDirector)"
      - "forecasting GET endpoints"
  - name: LegislativeEconomist
    description: "The legislature's estimating staff. Files the LEGISLATIVE side of every round. A peer of ExecutiveEconomist with no authority over economic inputs or policy adjustments."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /source-estimates and PATCH /source-estimates/{id} (with ExecutiveEconomist; body is derived as LEGISLATIVE)"
      - "POST /consensus-rounds/{id}/submit (with ExecutiveEconomist; drives leg_submission_status)"
      - "POST /one-time-items, POST /one-time-items/{id}/void (with ForecastDirector and ExecutiveEconomist)"
      - "forecasting GET endpoints"
  - name: ReserveTreasurer
    description: "Custodian of the reserve funds. Moves money and verifies shortfall triggers, but may neither open nor close a ballot, and may not execute a withdrawal it requested."
    identity: opaque
    exclusive_operations:
      - "POST /reserve-funds/{id}/deposits"
      - "POST /reserve-transactions/{id}/reverse"
      - "POST /withdrawal-requests/{id}/verify-shortfall"
      - "POST /withdrawal-requests/{id}/execute"
    shared_operations:
      - "POST /withdrawal-requests (with ForecastDirector)"
      - "POST /reserve-funds/{id}/recompute-adequacy (with ForecastDirector)"
      - "POST /_clock/set_current_utc (with ForecastDirector)"
      - "reserve GET endpoints"
  - name: LegislativeVoter
    description: "A seat holder on the body that must supermajority-approve a reserve withdrawal. Casts exactly one ballot per request and can read reserve state; can do nothing else."
    identity: opaque
    exclusive_operations:
      - "POST /withdrawal-requests/{id}/votes"
    shared_operations:
      - "reserve GET endpoints"
  - name: RatingAnalyst
    description: "The rating-agency-facing analyst. Drafts and edits briefings and reads everything, but publication and retraction are the ForecastDirector's alone."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /rating-briefings and PATCH /rating-briefings/{id} (with ForecastDirector)"
      - "all GET endpoints"

