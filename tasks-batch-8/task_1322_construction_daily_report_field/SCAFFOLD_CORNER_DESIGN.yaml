# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
scaffold_corner_design:
  # ==================================================================
  - section: entities
    instances:
      - name: weather_observation_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.WeatherObservation]
        distinguishing_aspect: "WeatherObservation has common_fields: false — response exposes id and created_at but NO version/updated_at; append-only (no update/void endpoint exists)."
        test_recipe:
          setup: ["Report DRAFT"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P", contract_number: "C-EN1" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, captures: { rep: $.data.id } }
          trigger:
            - { call: "POST /weather-observations", payload: { report_id: "${rep}", observed_at: "2026-08-05T08:00:00Z", condition: "RAIN", work_impact: "PARTIAL", temperature_f: 45.5 }, as: Superintendent, captures: { wo: $.data.id, ts: $.data.created_at } }
            - { call: "GET /weather-observations/${wo}", payload: {}, as: SystemAdmin }
          assert:
            - "response contains id and created_at; no version key; no updated_at key"
            - "GET returns the stored condition RAIN, temperature_f 45.5, work_impact PARTIAL"

      - name: crew_entry_required_field_missing_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.CrewEntry, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "worker_count is a required input; omitting it fails request-shape validation."
        test_recipe:
          setup: ["Report DRAFT + area"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P", contract_number: "C-EN2" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, captures: { rep: $.data.id } }
          trigger:
            - { call: "POST /crew-entries", payload: { report_id: "${rep}", work_area_id: "${area}", subcontractor: "SubCo", trade: "Labor", hours_per_worker: 8, work_performed: "x" }, as: Superintendent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400); no entry created"

      - name: delivery_pending_recount_defaults_to_delivered_qty
        claim_type: computed_defaults
        grounds: [entities.MaterialDelivery.fields.pending_recount_qty]
        distinguishing_aspect: "At creation accepted_qty == 0, rejected_qty == 0, pending_recount_qty == delivered_qty (system-initialized partition)."
        test_recipe:
          setup: ["Report DRAFT + zone"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P", contract_number: "C-EN3" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /delivery-zones", payload: { project_id: "${proj}", zone_code: "Z1" }, as: SystemAdmin, captures: { zone: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, captures: { rep: $.data.id } }
          trigger:
            - { call: "POST /deliveries", payload: { report_id: "${rep}", delivery_zone_id: "${zone}", po_number: "PO-9", material_description: "Pipe", delivered_qty: 40, unit: "LF", scheduled_window_start: "2026-08-05T09:00:00Z", scheduled_window_end: "2026-08-05T10:00:00Z" }, as: Superintendent, captures: { acc: $.data.accepted_qty, rej: $.data.rejected_qty, pend: $.data.pending_recount_qty, st: $.data.status } }
          assert:
            - "accepted_qty == 0, rejected_qty == 0, pending_recount_qty == 40, status == DELIVERED"
            - "buffer_minutes defaulted to 30 on the zone (default applied)"

      - name: get_nonexistent_report_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_REPORT_NOT_FOUND]"]
        distinguishing_aspect: "GET with a random UUID yields ERR_REPORT_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /daily-reports/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Superintendent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REPORT_NOT_FOUND, http 404"

      - name: daily_report_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count/has_more per the fixed envelope; default limit is 10."
        test_recipe:
          setup: ["One project with 3 reports"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P", contract_number: "C-EN5" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-03" }, as: Superintendent }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-04" }, as: Superintendent }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent }
          trigger:
            - { call: "GET /daily-reports?project_id=${proj}&limit=2&offset=0", payload: {}, as: ProjectManager, captures: { n: $.data } }
          assert:
            - "response_type == array; page 1 has 2 items; meta/pagination expose total_count == 3 and has_more == true"
            - "GET /daily-reports?project_id&limit=2&offset=2 returns 1 item and has_more == false"

      - name: daily_report_create_computed_input_ignored
        claim_type: computed_fields
        grounds: [entities.DailyReport.fields.total_workers]
        distinguishing_aspect: "Client-supplied values for computed fields (total_workers, weather_lost_hours) are ignored at create; server computes them."
        test_recipe:
          setup: ["project ACTIVE"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P", contract_number: "C-EN6" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
          trigger:
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05", total_workers: 999, weather_lost_hours: 55, status: "APPROVED" }, as: Superintendent, captures: { tw: $.data.total_workers, st: $.data.status } }
          assert:
            - "total_workers == 0 (input ignored), weather_lost_hours == 0.0, status == DRAFT (system-owned)"

  # ==================================================================
  - section: state_machines
    instances:
      - name: report_initial_state_is_draft
        claim_type: initial_state
        grounds: [state_machines.DailyReport]
        distinguishing_aspect: "A freshly created report is DRAFT with content_posture EDITABLE, revision_count 0, retention_class STANDARD."
        test_recipe:
          setup: ["project ACTIVE"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P", contract_number: "C-SM1" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
          trigger:
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, captures: { st: $.data.status, posture: $.data.content_posture, rc: $.data.revision_count, ret: $.data.retention_class } }
          assert:
            - "status == DRAFT, content_posture == EDITABLE, revision_count == 0, retention_class == STANDARD, distribution_hold == false"

      - name: report_terminal_lockdown_rejects_all_transitions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.DailyReport, "errors[ERR_REPORT_INVALID_TRANSITION]"]
        distinguishing_aspect: "From LOCKED every transition verb (submit/start-review/approve/request-revision/return-to-draft/recall/reopen/lock) returns ERR_REPORT_INVALID_TRANSITION."
        test_recipe:
          setup: ["Report driven DRAFT -> SUBMITTED -> UNDER_REVIEW -> APPROVED -> LOCKED"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P", contract_number: "C-SM2" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, as_user_id: "supt-1", captures: { rep: $.data.id } }
            - { call: "POST /weather-observations", payload: { report_id: "${rep}", observed_at: "2026-08-05T08:00:00Z", condition: "CLEAR", work_impact: "NONE" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /crew-entries", payload: { report_id: "${rep}", work_area_id: "${area}", subcontractor: "S", trade: "T", worker_count: 1, hours_per_worker: 8, work_performed: "w" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T17:00:00Z" }, as: SystemAdmin }
            - { call: "POST /daily-reports/${rep}/submit", payload: {}, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /daily-reports/${rep}/start-review", payload: {}, as: ProjectManager, as_user_id: "pm-1" }
            - { call: "POST /daily-reports/${rep}/approve", payload: {}, as: ProjectManager, as_user_id: "pm-1" }
            - { call: "POST /daily-reports/${rep}/lock", payload: {}, as: SystemAdmin }
          trigger:
            - { call: "POST /daily-reports/${rep}/reopen", payload: { reason: "try" }, as: ProjectManager, as_user_id: "pm-1", captures: { err: $.data.error_id } }
            - { call: "POST /daily-reports/${rep}/lock", payload: {}, as: SystemAdmin, captures: { err2: $.data.error_id } }
          assert:
            - "reopen from LOCKED -> ERR_REPORT_INVALID_TRANSITION (409)"
            - "double lock -> ERR_REPORT_INVALID_TRANSITION (409); report remains LOCKED"

      - name: child_create_on_sealed_report_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=6.1]", "errors[ERR_REPORT_NOT_EDITABLE]"]
        distinguishing_aspect: "Once SUBMITTED (content_posture SEALED), POST /crew-entries fails with ERR_REPORT_NOT_EDITABLE — posture gates every child write."
        test_recipe:
          setup: ["Report SUBMITTED"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P", contract_number: "C-SM3" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, as_user_id: "supt-1", captures: { rep: $.data.id } }
            - { call: "POST /weather-observations", payload: { report_id: "${rep}", observed_at: "2026-08-05T08:00:00Z", condition: "CLEAR", work_impact: "NONE" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /crew-entries", payload: { report_id: "${rep}", work_area_id: "${area}", subcontractor: "S", trade: "T", worker_count: 1, hours_per_worker: 8, work_performed: "w" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T17:00:00Z" }, as: SystemAdmin }
            - { call: "POST /daily-reports/${rep}/submit", payload: {}, as: Superintendent, as_user_id: "supt-1" }
          trigger:
            - { call: "POST /crew-entries", payload: { report_id: "${rep}", work_area_id: "${area}", subcontractor: "S", trade: "T", worker_count: 1, hours_per_worker: 8, work_performed: "late" }, as: Superintendent, as_user_id: "supt-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REPORT_NOT_EDITABLE (409); no entry created; total_workers stays 1"

      - name: incident_create_on_locked_report_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=6.2]", "errors[ERR_INCIDENT_ON_LOCKED_REPORT]"]
        distinguishing_aspect: "The incident carve-out stops at LOCKED: incident creation on a LOCKED report fails with ERR_INCIDENT_ON_LOCKED_REPORT even though it was allowed while APPROVED."
        test_recipe:
          setup: ["Report LOCKED (chain: submit -> start-review -> approve -> lock)"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P", contract_number: "C-SM4" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, as_user_id: "supt-1", captures: { rep: $.data.id } }
            - { call: "POST /weather-observations", payload: { report_id: "${rep}", observed_at: "2026-08-05T08:00:00Z", condition: "CLEAR", work_impact: "NONE" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /crew-entries", payload: { report_id: "${rep}", work_area_id: "${area}", subcontractor: "S", trade: "T", worker_count: 1, hours_per_worker: 8, work_performed: "w" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T17:00:00Z" }, as: SystemAdmin }
            - { call: "POST /daily-reports/${rep}/submit", payload: {}, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /daily-reports/${rep}/start-review", payload: {}, as: ProjectManager, as_user_id: "pm-1" }
            - { call: "POST /daily-reports/${rep}/approve", payload: {}, as: ProjectManager, as_user_id: "pm-1" }
            - { call: "POST /daily-reports/${rep}/lock", payload: {}, as: SystemAdmin }
          trigger:
            - { call: "POST /incidents", payload: { report_id: "${rep}", work_area_id: "${area}", occurred_at: "2026-08-05T10:00:00Z", severity: "FIRST_AID", narrative: "Late discovery" }, as: SafetyOfficer, as_user_id: "so-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INCIDENT_ON_LOCKED_REPORT (409)"

      - name: safety_observation_reopen_cycle
        claim_type: valid_transition
        grounds: [state_machines.SafetyObservation.MITIGATED_to_OPEN]
        distinguishing_aspect: "MITIGATED -> OPEN reopen loop works and verify-close from OPEN (not MITIGATED) is rejected with ERR_OBSERVATION_INVALID_TRANSITION."
        test_recipe:
          setup: ["Report DRAFT; observation OPEN -> MITIGATED"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P", contract_number: "C-SM5" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, captures: { rep: $.data.id } }
            - { call: "POST /safety-observations", payload: { report_id: "${rep}", work_area_id: "${area}", description: "Unguarded edge", risk_level: "LOW" }, as: SafetyOfficer, as_user_id: "so-1", captures: { ob: $.data.id } }
            - { call: "POST /safety-observations/${ob}/mitigate", payload: {}, as: SafetyOfficer, as_user_id: "so-1" }
          trigger:
            - { call: "POST /safety-observations/${ob}/reopen", payload: {}, as: SafetyOfficer, as_user_id: "so-1", captures: { st1: $.data.status } }
            - { call: "POST /safety-observations/${ob}/verify-close", payload: {}, as: SafetyOfficer, as_user_id: "so-2", captures: { err: $.data.error_id } }
          assert:
            - "after reopen: status == OPEN (cycle)"
            - "verify-close from OPEN -> ERR_OBSERVATION_INVALID_TRANSITION (409)"

      - name: escalate_creates_linked_incident_and_blocks_distribution
        claim_type: side_effect_execution
        grounds: [state_machines.SafetyObservation.OPEN_to_ESCALATED]
        distinguishing_aspect: "Escalate sets observation ESCALATED + incident_id, creates Incident REPORTED with safety_observation_id back-reference, and flips distribution_hold on."
        test_recipe:
          setup: ["Report DRAFT with LOW observation; clock set"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P", contract_number: "C-SM6" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, captures: { rep: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T17:00:00Z" }, as: SystemAdmin }
            - { call: "POST /safety-observations", payload: { report_id: "${rep}", work_area_id: "${area}", description: "Repeat ladder violation observed at stairwell 3 east during the morning safety walk", risk_level: "LOW" }, as: SafetyOfficer, as_user_id: "so-1", captures: { ob: $.data.id } }
          trigger:
            - { call: "POST /safety-observations/${ob}/escalate", payload: {}, as: SafetyOfficer, as_user_id: "so-1", captures: { st: $.data.status, inc_id: $.data.incident_id } }
            - { call: "GET /incidents/${inc_id}", payload: {}, as: SafetyOfficer, captures: { inc_st: $.data.status, inc_obs: $.data.safety_observation_id, inc_rec: $.data.recordable } }
            - { call: "GET /daily-reports/${rep}", payload: {}, as: SafetyOfficer, captures: { hold: $.data.distribution_hold, open_inc: $.data.has_open_incident } }
          assert:
            - "observation status == ESCALATED; incident_id non-null"
            - "Incident.status == REPORTED and safety_observation_id == ${ob}; recordable == true (escalated severity MEDICAL_TREATMENT)"
            - "report has_open_incident == true and distribution_hold == true"

      - name: ticket_void_from_terminal_approved_rejected
        claim_type: invalid_transition
        grounds: [state_machines.TmTicket, "errors[ERR_TICKET_INVALID_TRANSITION]"]
        distinguishing_aspect: "APPROVED is terminal for TmTicket: void from APPROVED -> ERR_TICKET_INVALID_TRANSITION; sign from APPROVED -> same."
        test_recipe:
          setup: ["FULLY_SIGNED ticket APPROVED on a SUBMITTED report (see ceiling chain)"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P", contract_number: "C-SM7" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /work-items", payload: { project_id: "${proj}", cost_code: "09-1", description: "Extra", budgeted_quantity: 500, unit: "EA", unit_cost_cents: 100 }, as: SystemAdmin, captures: { wi: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, as_user_id: "supt-1", captures: { rep: $.data.id } }
            - { call: "POST /weather-observations", payload: { report_id: "${rep}", observed_at: "2026-08-05T08:00:00Z", condition: "CLEAR", work_impact: "NONE" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /crew-entries", payload: { report_id: "${rep}", work_area_id: "${area}", subcontractor: "S", trade: "T", worker_count: 1, hours_per_worker: 8, work_performed: "w" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /tm-tickets", payload: { report_id: "${rep}", work_item_id: "${wi}", description: "d", labor_lines: [ { trade: "Labor", worker_count: 1, regular_hours: 1, ot_hours: 0, dt_hours: 0, rate_cents: 100 } ] }, as: Superintendent, as_user_id: "supt-1", captures: { tk: $.data.id } }
            - { call: "POST /tm-tickets/${tk}/submit-for-signature", payload: {}, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /tm-tickets/${tk}/sign", payload: { signer_role: "CONTRACTOR" }, as: ContractorRep, as_user_id: "ctr-1" }
            - { call: "POST /tm-tickets/${tk}/sign", payload: { signer_role: "OWNER" }, as: OwnerRep, as_user_id: "owner-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T17:00:00Z" }, as: SystemAdmin }
            - { call: "POST /daily-reports/${rep}/submit", payload: {}, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /tm-tickets/${tk}/approve", payload: {}, as: ProjectManager, as_user_id: "pm-1" }
          trigger:
            - { call: "POST /tm-tickets/${tk}/void", payload: {}, as: Superintendent, as_user_id: "supt-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TICKET_INVALID_TRANSITION (409); ticket remains APPROVED"

  # ==================================================================
  - section: calculations
    instances:
      - name: lost_hours_clipped_to_shift_window
        claim_type: correct_result
        grounds: [calculations.calc_lost_hours]
        distinguishing_aspect: "A delay 13:00-18:00 against an 07:00-15:00 shift yields lost_hours 2.00 (intersection only), and a delay fully outside the shift (18:00-19:00) yields 0.00."
        test_recipe:
          setup: ["Report DRAFT, shift 8h from 07:00; two delay events classified"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P", contract_number: "C-CL1", scheduled_shift_hours: 8 }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, captures: { rep: $.data.id } }
            - { call: "POST /delay-events", payload: { report_id: "${rep}", work_area_id: "${area}", start_at: "2026-08-05T13:00:00Z", end_at: "2026-08-05T18:00:00Z", cause: "MATERIAL" }, as: Superintendent, captures: { d1: $.data.id } }
            - { call: "POST /delay-events", payload: { report_id: "${rep}", work_area_id: "${area}", start_at: "2026-08-05T18:00:00Z", end_at: "2026-08-05T19:00:00Z", cause: "MATERIAL" }, as: Superintendent, captures: { d2: $.data.id } }
          trigger:
            - { call: "POST /delay-events/${d1}/classify", payload: { classification: "NON_EXCUSABLE" }, as: ProjectManager, captures: { l1: $.data.lost_hours } }
            - { call: "POST /delay-events/${d2}/classify", payload: { classification: "NON_EXCUSABLE" }, as: ProjectManager, captures: { l2: $.data.lost_hours } }
          assert:
            - "D1.lost_hours == 2.00 (clipped at 15:00 shift end)"
            - "D2.lost_hours == 0.00 (fully outside shift window)"

      - name: weather_totals_exclude_disputed_events
        claim_type: input_set_filtering
        grounds: [calculations.calc_lost_day_classification]
        distinguishing_aspect: "A DISPUTED weather delay drops out of weather_lost_hours (input-set filter): classify 3h -> totals 3.00; dispute -> totals 0.00; re-classify -> 3.00 restored."
        test_recipe:
          setup: ["Report DRAFT; WEATHER delay 07:30-10:30 classified EXCUSABLE_NON_COMPENSABLE"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P", contract_number: "C-CL2", scheduled_shift_hours: 8 }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, captures: { rep: $.data.id } }
            - { call: "POST /delay-events", payload: { report_id: "${rep}", work_area_id: "${area}", start_at: "2026-08-05T07:30:00Z", end_at: "2026-08-05T10:30:00Z", cause: "WEATHER" }, as: Superintendent, captures: { dev: $.data.id } }
            - { call: "POST /delay-events/${dev}/classify", payload: { classification: "EXCUSABLE_NON_COMPENSABLE" }, as: ProjectManager }
          trigger:
            - { call: "GET /daily-reports/${rep}", payload: {}, as: ProjectManager, captures: { h1: $.data.weather_lost_hours } }
            - { call: "POST /delay-events/${dev}/dispute", payload: { reason: "Owner contests" }, as: OwnerRep, as_user_id: "owner-1" }
            - { call: "GET /daily-reports/${rep}", payload: {}, as: ProjectManager, captures: { h2: $.data.weather_lost_hours } }
            - { call: "POST /delay-events/${dev}/classify", payload: { classification: "EXCUSABLE_NON_COMPENSABLE" }, as: ProjectManager }
            - { call: "GET /daily-reports/${rep}", payload: {}, as: ProjectManager, captures: { h3: $.data.weather_lost_hours } }
          assert:
            - "after classify: weather_lost_hours == 3.00"
            - "after dispute: weather_lost_hours == 0.00 (DISPUTED excluded from input set)"
            - "after re-classify (cycle): weather_lost_hours == 3.00"

      - name: osha_deadline_overdue_strictly_greater
        claim_type: boundary
        grounds: [calculations.calc_osha_deadline]
        distinguishing_aspect: "notification_overdue uses strict >: at exactly occurred_at+8h a FATALITY incident is NOT overdue; one second later it is."
        test_recipe:
          setup: ["Report DRAFT; FATALITY incident occurred 2026-08-05T06:00:00Z (deadline 14:00:00Z), not notified"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P", contract_number: "C-CL3" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, captures: { rep: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T14:00:00Z" }, as: SystemAdmin }
            - { call: "POST /incidents", payload: { report_id: "${rep}", work_area_id: "${area}", occurred_at: "2026-08-05T06:00:00Z", severity: "FATALITY", narrative: "Worker struck by reversing haul truck at the north gate area." }, as: SafetyOfficer, as_user_id: "so-1", captures: { inc: $.data.id, dl: $.data.osha_notification_deadline } }
          trigger:
            - { call: "GET /incidents/${inc}", payload: {}, as: SafetyOfficer, captures: { od1: $.data.notification_overdue } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T14:00:01Z" }, as: SystemAdmin }
            - { call: "GET /incidents/${inc}", payload: {}, as: SafetyOfficer, captures: { od2: $.data.notification_overdue } }
          assert:
            - "deadline == 2026-08-05T14:00:00Z (8h)"
            - "at exactly the deadline: notification_overdue == false"
            - "one second past: notification_overdue == true"

      - name: lost_day_threshold_exactly_half_shift
        claim_type: boundary
        grounds: [calculations.calc_lost_day_classification]
        distinguishing_aspect: "weather_lost_day_calendar boundary is >= : exactly 4.00 lost hours of an 8h shift makes the day lost (true), 3.99 does not."
        test_recipe:
          setup: ["Report DRAFT; weather delay 07:00-11:00 (4.00h) classified EXCUSABLE_COMPENSABLE"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P", contract_number: "C-CL4", scheduled_shift_hours: 8 }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, captures: { rep: $.data.id } }
            - { call: "POST /delay-events", payload: { report_id: "${rep}", work_area_id: "${area}", start_at: "2026-08-05T07:00:00Z", end_at: "2026-08-05T11:00:00Z", cause: "WEATHER" }, as: Superintendent, captures: { dev: $.data.id } }
          trigger:
            - { call: "POST /delay-events/${dev}/classify", payload: { classification: "EXCUSABLE_COMPENSABLE" }, as: ProjectManager }
            - { call: "GET /daily-reports/${rep}", payload: {}, as: ProjectManager, captures: { cal: $.data.weather_lost_day_calendar, frac: $.data.weather_lost_day_fraction } }
          assert:
            - "weather_lost_hours == 4.00; weather_lost_day_calendar == true (4.00 >= 0.5*8 boundary counts)"
            - "weather_lost_day_fraction == 0.50"

      - name: equipment_standby_requires_stoppage_observation
        claim_type: constants_applied
        grounds: [calculations.calc_tm_ticket_total]
        distinguishing_aspect: "Without any STOPPAGE WeatherObservation on the parent report, the standby equipment line bills at FULL rate (32000) — the 0.5 multiplier is conditional on cross-entity state."
        test_recipe:
          setup: ["Report DRAFT with a PARTIAL-impact observation only (no STOPPAGE)"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P", contract_number: "C-CL5" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-items", payload: { project_id: "${proj}", cost_code: "09-1", description: "Extra", budgeted_quantity: 500, unit: "EA", unit_cost_cents: 100 }, as: SystemAdmin, captures: { wi: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, captures: { rep: $.data.id } }
            - { call: "POST /weather-observations", payload: { report_id: "${rep}", observed_at: "2026-08-05T09:00:00Z", condition: "WIND", work_impact: "PARTIAL", wind_mph: 30 }, as: Superintendent }
          trigger:
            - { call: "POST /tm-tickets", payload: { report_id: "${rep}", work_item_id: "${wi}", description: "Crane standby", labor_lines: [], equipment_lines: [ { equipment_type: "Crane", hours: 4, rate_cents: 8000, standby: true } ] }, as: Superintendent, captures: { eq: $.data.equipment_cost_cents, tot: $.data.total_cents } }
          assert:
            - "equipment_cost_cents == 32000 (4*8000*1 — no STOPPAGE on report, standby multiplier denied)"
            - "total_cents == 32000"

      - name: retention_release_date_standard_vs_claims_hold
        claim_type: correct_result
        grounds: [calculations.calc_retention_release]
        distinguishing_aspect: "STANDARD report: retention_release_date == sent_at + retention_days (2026-08-05T17:00:00Z + 30d = 2026-09-04T17:00:00Z); a CLAIMS_HOLD report (recordable incident) keeps null even after distribution."
        test_recipe:
          setup: ["Project retention_days 30; report APPROVED; distribution SENT at 2026-08-05T17:00:00Z"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P", contract_number: "C-CL6", retention_days: 30 }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, as_user_id: "supt-1", captures: { rep: $.data.id } }
            - { call: "POST /weather-observations", payload: { report_id: "${rep}", observed_at: "2026-08-05T08:00:00Z", condition: "CLEAR", work_impact: "NONE" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /crew-entries", payload: { report_id: "${rep}", work_area_id: "${area}", subcontractor: "S", trade: "T", worker_count: 1, hours_per_worker: 8, work_performed: "w" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T17:00:00Z" }, as: SystemAdmin }
            - { call: "POST /daily-reports/${rep}/submit", payload: {}, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /daily-reports/${rep}/start-review", payload: {}, as: ProjectManager, as_user_id: "pm-1" }
            - { call: "POST /daily-reports/${rep}/approve", payload: {}, as: ProjectManager, as_user_id: "pm-1" }
            - { call: "POST /distribution-records", payload: { report_id: "${rep}", recipient_email: "owner@x.com", recipient_role: "OWNER" }, as: ProjectManager, as_user_id: "pm-1", captures: { drec: $.data.id } }
          trigger:
            - { call: "POST /distribution-records/${drec}/send", payload: {}, as: SystemAdmin, captures: { sent: $.data.sent_at } }
            - { call: "GET /daily-reports/${rep}", payload: {}, as: ProjectManager, captures: { rel: $.data.retention_release_date, ret: $.data.retention_class } }
          assert:
            - "sent_at == 2026-08-05T17:00:00Z (logical clock)"
            - "retention_class == STANDARD; retention_release_date == 2026-09-04T17:00:00Z (+30 days)"

  # ==================================================================
  - section: validations
    instances:
      - name: high_risk_observation_requires_media
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_HIGH_RISK_OBSERVATION_REQUIRES_MEDIA]"]
        distinguishing_aspect: "Conditional validation: risk_level HIGH without media_attachment_id -> 422; MEDIUM without media passes."
        test_recipe:
          setup: ["Report DRAFT + area"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P", contract_number: "C-VA1" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, captures: { rep: $.data.id } }
          trigger:
            - { call: "POST /safety-observations", payload: { report_id: "${rep}", work_area_id: "${area}", description: "Live exposed conductor", risk_level: "HIGH" }, as: SafetyOfficer, as_user_id: "so-1", captures: { err: $.data.error_id } }
            - { call: "POST /safety-observations", payload: { report_id: "${rep}", work_area_id: "${area}", description: "Housekeeping debris", risk_level: "MEDIUM" }, as: SafetyOfficer, as_user_id: "so-1", captures: { ok: $.data.id } }
          assert:
            - "HIGH without media -> ERR_HIGH_RISK_OBSERVATION_REQUIRES_MEDIA (422)"
            - "MEDIUM without media -> 201 created"

      - name: duplicate_report_date_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8.2]", "errors[ERR_DUPLICATE_REPORT_DATE]"]
        distinguishing_aspect: "(project_id, report_date) uniqueness: second report for same date -> 409; same date on a DIFFERENT project passes."
        test_recipe:
          setup: ["Two ACTIVE projects; report 2026-08-05 on P1"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P1", contract_number: "C-VA2A" }, as: SystemAdmin, captures: { p1: $.data.id } }
            - { call: "POST /projects", payload: { name: "P2", contract_number: "C-VA2B" }, as: SystemAdmin, captures: { p2: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${p1}", report_date: "2026-08-05" }, as: Superintendent }
          trigger:
            - { call: "POST /daily-reports", payload: { project_id: "${p1}", report_date: "2026-08-05" }, as: Superintendent, captures: { err: $.data.error_id } }
            - { call: "POST /daily-reports", payload: { project_id: "${p2}", report_date: "2026-08-05" }, as: Superintendent, captures: { ok: $.data.id } }
          assert:
            - "duplicate on same project -> ERR_DUPLICATE_REPORT_DATE (409)"
            - "same date on other project -> 201"

      - name: segregation_approve_by_submitter_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "The PM user id equal to submitted_by_user_id cannot approve (403); a different PM id approves."
        test_recipe:
          setup: ["Report UNDER_REVIEW submitted by supt-1 (submit records submitter; here supt-1 acts again via PM role header)"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P", contract_number: "C-VA3" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, as_user_id: "supt-1", captures: { rep: $.data.id } }
            - { call: "POST /weather-observations", payload: { report_id: "${rep}", observed_at: "2026-08-05T08:00:00Z", condition: "CLEAR", work_impact: "NONE" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /crew-entries", payload: { report_id: "${rep}", work_area_id: "${area}", subcontractor: "S", trade: "T", worker_count: 1, hours_per_worker: 8, work_performed: "w" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T17:00:00Z" }, as: SystemAdmin }
            - { call: "POST /daily-reports/${rep}/submit", payload: {}, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /daily-reports/${rep}/start-review", payload: {}, as: ProjectManager, as_user_id: "pm-1" }
          trigger:
            - { call: "POST /daily-reports/${rep}/approve", payload: {}, as: ProjectManager, as_user_id: "supt-1", captures: { err: $.data.error_id } }
            - { call: "POST /daily-reports/${rep}/approve", payload: {}, as: ProjectManager, as_user_id: "pm-2", captures: { st: $.data.status } }
          assert:
            - "approve by submitter's user id -> ERR_SEGREGATION_OF_DUTIES (403)"
            - "approve by different PM user id -> APPROVED"

      - name: equipment_capacity_boundary_exact
        claim_type: boundary
        grounds: ["validations[priority=8.3]", "errors[ERR_EQUIPMENT_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "hours_used + hours_idle == 24 * unit_count passes (equality allowed); 0.01 over fails with 422."
        test_recipe:
          setup: ["Report DRAFT + area"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P", contract_number: "C-VA4" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, captures: { rep: $.data.id } }
          trigger:
            - { call: "POST /equipment-entries", payload: { report_id: "${rep}", work_area_id: "${area}", equipment_type: "Crane", unit_count: 2, hours_used: 24, hours_idle: 24 }, as: Superintendent, captures: { ok: $.data.id } }
            - { call: "POST /equipment-entries", payload: { report_id: "${rep}", work_area_id: "${area}", equipment_type: "Crane", unit_count: 2, hours_used: 24, hours_idle: 24.01 }, as: Superintendent, captures: { err: $.data.error_id } }
          assert:
            - "48.00 hours on 2 units (cap 48) -> 201"
            - "48.01 hours -> ERR_EQUIPMENT_CAPACITY_EXCEEDED (422)"

      - name: media_link_constraint_and_gps_pair
        claim_type: violation_to_error
        grounds: ["validations[priority=8.4]", "errors[ERR_MEDIA_LINK_CONSTRAINT]", "errors[ERR_GPS_INCOMPLETE_PAIR]"]
        distinguishing_aspect: "Two independent constraint errors on the same endpoint: both links set -> ERR_MEDIA_LINK_CONSTRAINT; only gps_lat -> ERR_GPS_INCOMPLETE_PAIR."
        test_recipe:
          setup: ["Report DRAFT + area + delivery + incident context for links"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P", contract_number: "C-VA5" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /delivery-zones", payload: { project_id: "${proj}", zone_code: "Z1" }, as: SystemAdmin, captures: { zone: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, captures: { rep: $.data.id } }
            - { call: "POST /deliveries", payload: { report_id: "${rep}", delivery_zone_id: "${zone}", po_number: "PO-1", material_description: "Pipe", delivered_qty: 10, unit: "LF", scheduled_window_start: "2026-08-05T09:00:00Z", scheduled_window_end: "2026-08-05T10:00:00Z" }, as: Superintendent, captures: { del: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T17:00:00Z" }, as: SystemAdmin }
            - { call: "POST /incidents", payload: { report_id: "${rep}", work_area_id: "${area}", occurred_at: "2026-08-05T10:00:00Z", severity: "FIRST_AID", narrative: "Minor" }, as: SafetyOfficer, as_user_id: "so-1", captures: { inc: $.data.id } }
          trigger:
            - { call: "POST /media-attachments", payload: { report_id: "${rep}", work_area_id: "${area}", media_type: "PHOTO", file_url: "s3://x/1.jpg", captured_at: "2026-08-05T11:00:00Z", linked_incident_id: "${inc}", linked_delivery_id: "${del}" }, as: Superintendent, captures: { err1: $.data.error_id } }
            - { call: "POST /media-attachments", payload: { report_id: "${rep}", work_area_id: "${area}", media_type: "PHOTO", file_url: "s3://x/2.jpg", captured_at: "2026-08-05T11:00:00Z", gps_lat: 37.77 }, as: Superintendent, captures: { err2: $.data.error_id } }
          assert:
            - "both links set -> ERR_MEDIA_LINK_CONSTRAINT (422)"
            - "gps_lat without gps_lng -> ERR_GPS_INCOMPLETE_PAIR (422)"

      - name: media_captured_at_day_boundary
        claim_type: temporal_validation
        grounds: ["validations[priority=9.2]", "errors[ERR_MEDIA_CAPTURED_OUTSIDE_REPORT_DATE]"]
        distinguishing_aspect: "Half-open calendar day: captured_at 2026-08-05T00:00:00Z is inside report_date 2026-08-05; 2026-08-06T00:00:00Z is outside (next day start excluded)."
        test_recipe:
          setup: ["Report 2026-08-05 DRAFT + area"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P", contract_number: "C-VA6" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, captures: { rep: $.data.id } }
          trigger:
            - { call: "POST /media-attachments", payload: { report_id: "${rep}", work_area_id: "${area}", media_type: "PHOTO", file_url: "s3://x/a.jpg", captured_at: "2026-08-05T00:00:00Z" }, as: Superintendent, captures: { ok: $.data.id } }
            - { call: "POST /media-attachments", payload: { report_id: "${rep}", work_area_id: "${area}", media_type: "PHOTO", file_url: "s3://x/b.jpg", captured_at: "2026-08-06T00:00:00Z" }, as: Superintendent, captures: { err: $.data.error_id } }
          assert:
            - "00:00:00 of the report date -> 201 (inclusive lower bound)"
            - "00:00:00 of the next day -> ERR_MEDIA_CAPTURED_OUTSIDE_REPORT_DATE (422, exclusive upper bound)"

      - name: no_work_recorded_xor_flag
        claim_type: aggregate_validation
        grounds: ["validations[priority=10.3]", "errors[ERR_NO_WORK_RECORDED]", "errors[ERR_WORK_ENTRIES_CONFLICT]"]
        distinguishing_aspect: "Exactly-one gate at submit: zero crew entries with flag false -> ERR_NO_WORK_RECORDED; entries present with flag true -> ERR_WORK_ENTRIES_CONFLICT."
        test_recipe:
          setup: ["Two DRAFT reports with weather only; R2 has no_work_performed=true plus a crew entry"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P", contract_number: "C-VA7" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, captures: { r1: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-06", no_work_performed: true }, as: Superintendent, captures: { r2: $.data.id } }
            - { call: "POST /weather-observations", payload: { report_id: "${r1}", observed_at: "2026-08-05T08:00:00Z", condition: "CLEAR", work_impact: "NONE" }, as: Superintendent }
            - { call: "POST /weather-observations", payload: { report_id: "${r2}", observed_at: "2026-08-06T08:00:00Z", condition: "RAIN", work_impact: "STOPPAGE" }, as: Superintendent }
            - { call: "POST /crew-entries", payload: { report_id: "${r2}", work_area_id: "${area}", subcontractor: "S", trade: "T", worker_count: 1, hours_per_worker: 8, work_performed: "w" }, as: Superintendent }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T17:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /daily-reports/${r1}/submit", payload: {}, as: Superintendent, captures: { err1: $.data.error_id } }
            - { call: "POST /daily-reports/${r2}/submit", payload: {}, as: Superintendent, captures: { err2: $.data.error_id } }
          assert:
            - "R1 (no entries, flag false) -> ERR_NO_WORK_RECORDED (409)"
