scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: loan_payoff_actual_vs_scheduled
        grounds:
          - calculations.compute_payoff
          - entities.PayoffQuote.fields.payoff_amount_cents
          - entities.PayoffQuote.fields.scheduled_remaining_cents
          - entities.PayoffQuote.fields.interest_savings_cents
        distinguishing_aspect: |
          On the LOAN domain, the actual_payoff variant (outstanding principal + per-diem accrued
          interest + fees) yields a strictly smaller number than the scheduled_remaining variant
          (sum of all unpaid full installments incl. future interest) for the same loan state.
        test_recipe:
          setup:
            - "CA account, posture ELIGIBLE, LOAN disclosure apr 15.99% acknowledged."
            - "Loan P=120000, term 12, funded -> ACTIVE; monthly_payment_cents=10887; schedule built."
            - "One manual on-time payment of 10887 posts against period 1 (interest 1599, principal 9288); outstanding_principal_cents=110712."
            - "Clock left at funded_at (per-diem since last due = 0 days) when the quote is taken."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "a1@x.com", full_name: "A One", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 1599, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { disc: $.data.id }
            - call: "POST /disclosures/${disc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${disc}", principal_cents: 120000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan: $.data.id }
            - call: "POST /loans/${loan}/fund"
              payload: {}
              as: LoanServicer
              captures: { loan_v1: $.data.version }
            - call: "POST /payments"
              payload: { loan_id: "${loan}", amount_cents: 10887, source: "MANUAL", expected_loan_version: "${loan_v1}" }
              as: Borrower
              as_user_id: "${acct}"
          trigger:
            - call: "POST /loans/${loan}/payoff-quote"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
              captures: { quote: $.data.id }
          assert:
            - "PayoffQuote.${quote}.payoff_amount_cents == 110712"
            - "PayoffQuote.${quote}.scheduled_remaining_cents == 119757"
            - "PayoffQuote.${quote}.interest_savings_cents == 9045"

      - name: score_optimistic_vs_realized
        grounds:
          - calculations.compute_score_delta
          - entities.ScoreSnapshot.fields.simulated_score
          - entities.ScoreSnapshot.fields.score_delta
        distinguishing_aspect: |
          On the ACCOUNT/score domain, the optimistic_projection variant assumes the in-flight cycle
          reports ON_TIME (one extra on-time mark) and returns a strictly higher simulated_score than
          the realized variant for the same reported history — a different entity domain than Rule 1's
          loan payoff variants.
        test_recipe:
          setup:
            - "CA account ELIGIBLE; SECURED_CARD disclosure acknowledged; card FUNDED+ACTIVE with deposit 50000, balance 0."
            - "Loan P=60000 term 12 0%-APR-equivalent... (use apr 0 via NY? no) — use CA apr 0 disclosure for LOAN."
            - "Three monthly bureau sweeps reported the loan ON_TIME (3 on-time marks, 0 late); 3 months since funding."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "a2@x.com", full_name: "A Two", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { ldisc: $.data.id }
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "SECURED_CARD", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { cdisc: $.data.id }
            - call: "POST /disclosures/${ldisc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /disclosures/${cdisc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${ldisc}", principal_cents: 60000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan: $.data.id }
            - call: "POST /loans/${loan}/fund"
              payload: {}
              as: LoanServicer
            - call: "POST /secured-cards"
              payload: { account_id: "${acct}", disclosure_id: "${cdisc}" }
              as: Borrower
              as_user_id: "${acct}"
              captures: { card: $.data.id, card_v1: $.data.version }
            - call: "POST /secured-cards/${card}/deposits"
              payload: { amount_cents: 50000, expected_card_version: "${card_v1}" }
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /secured-cards/${card}/activate"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "GET /loans/${loan}"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan_vA: $.data.version }
            - call: "POST /payments"
              payload: { loan_id: "${loan}", amount_cents: 5000, source: "MANUAL", expected_loan_version: "${loan_vA}" }
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /_clock/run-bureau-sweep"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /loans/${loan}"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan_vB: $.data.version }
            - call: "POST /payments"
              payload: { loan_id: "${loan}", amount_cents: 5000, source: "MANUAL", expected_loan_version: "${loan_vB}" }
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /_clock/run-bureau-sweep"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /loans/${loan}"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan_vC: $.data.version }
            - call: "POST /payments"
              payload: { loan_id: "${loan}", amount_cents: 5000, source: "MANUAL", expected_loan_version: "${loan_vC}" }
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /_clock/run-bureau-sweep"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "GET /accounts/${acct}/score?projection=optimistic"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
              captures: { opt_score: $.data.simulated_score }
            - call: "GET /accounts/${acct}/score"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
              captures: { real_score: $.data.simulated_score }
          assert:
            - "GET .../score (realized).simulated_score == 722  (base 580 + payment_history 18 + util_pts 120 + age_pts 4)"
            - "GET .../score?projection=optimistic.simulated_score == 728  (one extra on-time mark: payment_history 24)"
            - "optimistic - realized == 6 (the variant divergence, robust to age)"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes (a, b)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: amortized_payment_nonlinear_mode_a
        grounds:
          - calculations.compute_amortized_payment
          - entities.CreditBuilderLoan.fields.monthly_payment_cents
        distinguishing_aspect: |
          Mode (a): the level-payment formula combines >=3 inputs (principal, apr-derived monthly rate,
          term) in a non-linear (1+r)^n interaction with a single final round_half_up; verified by the
          exact integer 10887 for P=120000, apr 1599 bps, n=12.
        test_recipe:
          setup:
            - "CA account ELIGIBLE; LOAN disclosure apr 15.99% acknowledged; loan P=120000 term 12 created PENDING."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "a3@x.com", full_name: "A Three", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 1599, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { disc: $.data.id }
            - call: "POST /disclosures/${disc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${disc}", principal_cents: 120000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan: $.data.id }
          trigger:
            - call: "POST /loans/${loan}/fund"
              payload: {}
              as: LoanServicer
          assert:
            - "CreditBuilderLoan.${loan}.monthly_payment_cents == 10887"
            - "CreditBuilderLoan.${loan}.apr_bps == 1599"

      - name: amortization_split_rounding_order_mode_b
        grounds:
          - calculations.build_amortization_split
          - entities.InstallmentSchedule.fields.interest_component_cents
          - entities.InstallmentSchedule.fields.principal_component_cents
          - entities.InstallmentSchedule.fields.amount_due_cents
        distinguishing_aspect: |
          Mode (b): pinned per-line rounding — interest is round_half_up per period on the running
          balance (period 1 first), not summed-then-rounded. Period 1 interest=1599 / principal=9288,
          period 2 interest=1475 / principal=9412, and the LAST period absorbs the remainder
          (amount_due 10887, principal 10744, interest 143) so sum(principal)=120000 exactly.
        test_recipe:
          setup:
            - "Same funded P=120000 apr 1599 n=12 loan as mode_a; schedule of 12 rows generated."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "a4@x.com", full_name: "A Four", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 1599, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { disc: $.data.id }
            - call: "POST /disclosures/${disc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${disc}", principal_cents: 120000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan: $.data.id }
            - call: "POST /loans/${loan}/fund"
              payload: {}
              as: LoanServicer
          trigger:
            - call: "GET /loans/${loan}/schedule"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
          assert:
            - "schedule[period_index=1].interest_component_cents == 1599 and principal_component_cents == 9288"
            - "schedule[period_index=2].interest_component_cents == 1475 and principal_component_cents == 9412"
            - "schedule[period_index=12].amount_due_cents == 10887 and principal_component_cents == 10744 and interest_component_cents == 143"
            - "sum over schedule of principal_component_cents == 120000"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shapes on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: loan_parallel_axes_independent
        grounds:
          - state_machines.CreditBuilderLoan.CURRENT_to_DPD_30
          - state_machines.CreditBuilderLoan.DPD_30_to_CURRENT
          - entities.CreditBuilderLoan.fields.lifecycle_status
          - entities.CreditBuilderLoan.fields.delinquency_status
        distinguishing_aspect: |
          CreditBuilderLoan carries two independent axes: lifecycle_status stays ACTIVE while
          delinquency_status advances CURRENT->DPD_30 on a delinquency sweep and then recovers
          DPD_30->CURRENT after a curing payment — a parallel-dimension machine, not a linear pipeline.
        test_recipe:
          setup:
            - "CA loan P=120000 term12 apr1599 funded 2026-02-01 -> ACTIVE; no payments."
            - "Clock advanced to 2026-03-10 so period-1 (due 2026-03-01) is 9 days past due (> GRACE 5)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "a5@x.com", full_name: "A Five", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 1599, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { disc: $.data.id }
            - call: "POST /disclosures/${disc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${disc}", principal_cents: 120000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan: $.data.id, loan_v1: $.data.version }
            - call: "POST /loans/${loan}/fund"
              payload: {}
              as: LoanServicer
              captures: { loan_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/run-delinquency-sweep"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /payments"
              payload: { loan_id: "${loan}", amount_cents: 12387, source: "MANUAL", expected_loan_version: "${loan_v2}" }
              as: Borrower
              as_user_id: "${acct}"
            - call: "GET /loans/${loan}"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
              captures: { life: $.data.lifecycle_status, delq: $.data.delinquency_status }
          assert:
            - "After the sweep, CreditBuilderLoan.${loan}.lifecycle_status == ACTIVE and delinquency_status == DPD_30"
            - "After the curing payment, CreditBuilderLoan.${loan}.lifecycle_status == ACTIVE and delinquency_status == CURRENT"

      - name: card_suspend_resume_revert_cycle
        grounds:
          - state_machines.SecuredCard.ACTIVE_to_SUSPENDED
          - state_machines.SecuredCard.SUSPENDED_to_ACTIVE
          - entities.SecuredCard.fields.status
        distinguishing_aspect: |
          SecuredCard has a branching-with-revert machine on a different entity: ACTIVE->SUSPENDED
          (suspend) then SUSPENDED->ACTIVE (resume) returns the card to the same ACTIVE state, a
          revert loop the loan's lifecycle axis does not have.
        test_recipe:
          setup:
            - "CA account ELIGIBLE; SECURED_CARD disclosure acknowledged; card with deposit 50000 ACTIVE."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "a6@x.com", full_name: "A Six", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "SECURED_CARD", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { cdisc: $.data.id }
            - call: "POST /disclosures/${cdisc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /secured-cards"
              payload: { account_id: "${acct}", disclosure_id: "${cdisc}" }
              as: Borrower
              as_user_id: "${acct}"
              captures: { card: $.data.id, card_v1: $.data.version }
            - call: "POST /secured-cards/${card}/deposits"
              payload: { amount_cents: 50000, expected_card_version: "${card_v1}" }
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /secured-cards/${card}/activate"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
          trigger:
            - call: "POST /secured-cards/${card}/suspend"
              payload: { reason: "review" }
              as: LoanServicer
              captures: { st1: $.data.status }
            - call: "POST /secured-cards/${card}/resume"
              payload: {}
              as: LoanServicer
              captures: { st2: $.data.status }
          assert:
            - "After suspend, SecuredCard.${card}.status == SUSPENDED"
            - "After resume, SecuredCard.${card}.status == ACTIVE (reverts to the same state)"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: early_payoff_release_cascade_depth3
        grounds:
          - state_machines.PayoffQuote.ACTIVE_to_CONSUMED
          - state_machines.CreditBuilderLoan.ACTIVE_to_PAID_OFF
          - entities.Account.fields.wallet_cents
          - calculations.allocate_payment
        distinguishing_aspect: |
          Trigger = POST /loans/{id}/early-payoff. Depth>=3: consuming the quote (hop1) creates a
          synthetic Payment that allocate_payment posts (hop2), which drives the loan ACTIVE->PAID_OFF
          (hop3), whose side-effect releases locked savings = principal_paid_cents (60000) into
          Account.wallet_cents (hop4). Each hop is caused by the prior hop, not by the original call.
        test_recipe:
          setup:
            - "CA account ELIGIBLE; LOAN apr-0 disclosure acknowledged; loan P=60000 term12 funded ACTIVE; no payments yet; outstanding 60000."
            - "An ACTIVE PayoffQuote taken at funded_at (per-diem 0) -> payoff_amount_cents=60000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "a7@x.com", full_name: "A Seven", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { disc: $.data.id }
            - call: "POST /disclosures/${disc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${disc}", principal_cents: 60000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan: $.data.id }
            - call: "POST /loans/${loan}/fund"
              payload: {}
              as: LoanServicer
            - call: "POST /loans/${loan}/payoff-quote"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
              captures: { quote: $.data.id, payoff_amt: $.data.payoff_amount_cents }
          trigger:
            - call: "POST /loans/${loan}/early-payoff"
              payload: { quote_id: "${quote}" }
              as: Borrower
              as_user_id: "${acct}"
          assert:
            - "PayoffQuote.${quote}.status == CONSUMED"
            - "CreditBuilderLoan.${loan}.lifecycle_status == PAID_OFF"
            - "CreditBuilderLoan.${loan}.outstanding_principal_cents == 0"
            - "Account.${acct}.wallet_cents == 60000"

      - name: release_deposit_wallet_cascade_depth3
        grounds:
          - state_machines.SecuredCard.ACTIVE_to_CLOSED
          - entities.CardDeposit.fields.status
          - entities.SecuredCard.fields.credit_limit_cents
          - entities.Account.fields.wallet_cents
        distinguishing_aspect: |
          Trigger = POST /secured-cards/{id}/release-deposit (different origin than early-payoff).
          Depth>=3: release (hop1) flips every POSTED CardDeposit -> RELEASED (hop2), which credits
          deposit_cents into Account.wallet_cents and zeroes credit_limit_cents (hop3), and closes
          the card (hop4). Conserved: wallet gain equals the released deposit total.
        test_recipe:
          setup:
            - "CA account ELIGIBLE; LOAN apr-0 disclosure acknowledged; loan P=60000 term12 funded ACTIVE."
            - "A single lump payment of 60000 posted before all due dates -> loan PAID_OFF, savings 60000 -> wallet, on_time_streak=12."
            - "Loan graduated by a LoanServicer (servicer-user S1) -> linked card graduation_eligible=true."
            - "SECURED_CARD disclosure acknowledged; card deposit 50000, ACTIVE, balance 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "a8@x.com", full_name: "A Eight", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { ldisc: $.data.id }
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "SECURED_CARD", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { cdisc: $.data.id }
            - call: "POST /disclosures/${ldisc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /disclosures/${cdisc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${ldisc}", principal_cents: 60000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan: $.data.id }
            - call: "POST /loans/${loan}/fund"
              payload: {}
              as: LoanServicer
              as_user_id: "servicer-S1"
              captures: { loan_v2: $.data.version }
            - call: "POST /payments"
              payload: { loan_id: "${loan}", amount_cents: 60000, source: "MANUAL", expected_loan_version: "${loan_v2}" }
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /secured-cards"
              payload: { account_id: "${acct}", disclosure_id: "${cdisc}" }
              as: Borrower
              as_user_id: "${acct}"
              captures: { card: $.data.id, card_v1: $.data.version }
            - call: "POST /secured-cards/${card}/deposits"
              payload: { amount_cents: 50000, expected_card_version: "${card_v1}" }
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /secured-cards/${card}/activate"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /loans/${loan}/graduate"
              payload: {}
              as: LoanServicer
              as_user_id: "servicer-S1"
          trigger:
            - call: "POST /secured-cards/${card}/release-deposit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-C1"
          assert:
            - "SecuredCard.${card}.status == CLOSED"
            - "SecuredCard.${card}.credit_limit_cents == 0 and deposit_cents == 0"
            - "every CardDeposit of ${card} has status == RELEASED"
            - "Account.${acct}.wallet_cents == 110000 (60000 savings + 50000 released deposit)"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: not_found_beats_account_not_eligible
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_ACCOUNT_NOT_ELIGIBLE]
        distinguishing_aspect: |
          existence (ERR_NOT_FOUND, priority 4) vs state (ERR_ACCOUNT_NOT_ELIGIBLE, priority 5):
          creating a loan that BOTH references a non-existent disclosure AND targets a BLOCKED account
          returns ERR_NOT_FOUND (404), because existence is checked before the eligibility gate.
        test_recipe:
          setup:
            - "CA account created but NOT verified and NO disclosure acknowledged -> posture BLOCKED."
            - "The loan create cites a disclosure_id that does not exist."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "a9@x.com", full_name: "A Nine", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "00000000-0000-4000-8000-000000000000", principal_cents: 60000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "data.error_id == ERR_NOT_FOUND (not ERR_ACCOUNT_NOT_ELIGIBLE)"

      - name: sod_conflict_beats_deposit_not_releasable
        grounds:
          - validations[priority=10]
          - validations[priority=12]
          - errors[ERR_SOD_CONFLICT]
          - errors[ERR_DEPOSIT_NOT_RELEASABLE]
        distinguishing_aspect: |
          business_safety (ERR_SOD_CONFLICT, priority 10) vs business_constraint
          (ERR_DEPOSIT_NOT_RELEASABLE, priority 12): a release attempt where the ComplianceOfficer
          X-User-ID equals the loan's funding servicer AND the card is not graduation_eligible returns
          ERR_SOD_CONFLICT, because the SoD safety check precedes the releasability constraint.
        test_recipe:
          setup:
            - "CA account ELIGIBLE; loan P=60000 funded by servicer-user 'dual-1' (ACTIVE, NOT paid off / NOT graduated)."
            - "SECURED_CARD disclosure acknowledged; card deposit 50000 ACTIVE, graduation_eligible=false (loan not graduated)."
            - "Release attempted by a ComplianceOfficer whose X-User-ID == 'dual-1' (same person who funded)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "a10@x.com", full_name: "A Ten", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { ldisc: $.data.id }
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "SECURED_CARD", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { cdisc: $.data.id }
            - call: "POST /disclosures/${ldisc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /disclosures/${cdisc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${ldisc}", principal_cents: 60000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan: $.data.id }
            - call: "POST /loans/${loan}/fund"
              payload: {}
              as: LoanServicer
              as_user_id: "dual-1"
            - call: "POST /secured-cards"
              payload: { account_id: "${acct}", disclosure_id: "${cdisc}" }
              as: Borrower
              as_user_id: "${acct}"
              captures: { card: $.data.id, card_v1: $.data.version }
            - call: "POST /secured-cards/${card}/deposits"
              payload: { amount_cents: 50000, expected_card_version: "${card_v1}" }
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /secured-cards/${card}/activate"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
          trigger:
            - call: "POST /secured-cards/${card}/release-deposit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "dual-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_SOD_CONFLICT (not ERR_DEPOSIT_NOT_RELEASABLE)"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: deposit_cap_exact_vs_over
        grounds:
          - validations[priority=14]
          - errors[ERR_DEPOSIT_CAP_EXCEEDED]
          - entities.CardDeposit.fields.amount_cents
        distinguishing_aspect: |
          Numeric threshold on POST /secured-cards/{id}/deposits: total POSTED deposits == 250000 is
          accepted (boundary inclusive), while a deposit pushing the total to 250001 is rejected with
          ERR_DEPOSIT_CAP_EXCEEDED — the <= vs > edge on MAX_CARD_DEPOSIT_CENTS.
        test_recipe:
          setup:
            - "CA account ELIGIBLE; SECURED_CARD disclosure acknowledged; card with one POSTED deposit of 200000 (FUNDED)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "a11@x.com", full_name: "A Eleven", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "SECURED_CARD", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { cdisc: $.data.id }
            - call: "POST /disclosures/${cdisc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /secured-cards"
              payload: { account_id: "${acct}", disclosure_id: "${cdisc}" }
              as: Borrower
              as_user_id: "${acct}"
              captures: { card: $.data.id, card_v1: $.data.version }
            - call: "POST /secured-cards/${card}/deposits"
              payload: { amount_cents: 200000, expected_card_version: "${card_v1}" }
              as: Borrower
              as_user_id: "${acct}"
              captures: { card_v2: $.data.version }
          trigger:
            - call: "POST /secured-cards/${card}/deposits"
              payload: { amount_cents: 50000, expected_card_version: "${card_v2}" }
              as: Borrower
              as_user_id: "${acct}"
              captures: { ok_dep: $.data.id }
            - call: "POST /secured-cards/${card}/deposits"
              payload: { amount_cents: 1, expected_card_version: "${card_v2}" }
              as: Borrower
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "First trigger (total -> 250000) returns 201; SecuredCard.${card}.deposit_cents == 250000"
            - "Second trigger (total would -> 250001) returns 422 with data.error_id == ERR_DEPOSIT_CAP_EXCEEDED"

      - name: empty_schedule_on_pending_loan
        grounds:
          - entities.InstallmentSchedule.fields.period_index
          - entities.CreditBuilderLoan.fields.lifecycle_status
          - state_machines.CreditBuilderLoan.PENDING_to_ACTIVE
        distinguishing_aspect: |
          Empty-collection edge on a different endpoint (GET /loans/{id}/schedule): a loan still in
          PENDING (never funded) has zero InstallmentSchedule rows, so the list returns total_count==0
          and has_more==false — distinct from the numeric deposit-cap boundary above.
        test_recipe:
          setup:
            - "CA account ELIGIBLE; loan P=60000 term12 created PENDING and NOT funded."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "a12@x.com", full_name: "A Twelve", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { disc: $.data.id }
            - call: "POST /disclosures/${disc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${disc}", principal_cents: 60000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan: $.data.id }
          trigger:
            - call: "GET /loans/${loan}/schedule"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
          assert:
            - "response_type == array; meta.total_count == 0; data == []; has_more == false"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: loan_fund_requires_account_eligible
        grounds:
          - state_machines.CreditBuilderLoan.PENDING_to_ACTIVE
          - entities.Account.fields.posture
          - validations[priority=5]
          - errors[ERR_ACCOUNT_NOT_ELIGIBLE]
        distinguishing_aspect: |
          Pair Loan->Account: a PENDING loan cannot be funded while its Account.posture != ELIGIBLE.
          Creating a loan against a VERIFIED-but-disclosure-UNACKNOWLEDGED account (posture BLOCKED)
          is rejected with ERR_ACCOUNT_NOT_ELIGIBLE at create time.
        test_recipe:
          setup:
            - "CA account VERIFIED but disclosure NOT acknowledged -> posture BLOCKED."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "a13@x.com", full_name: "A Thirteen", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { disc: $.data.id }
          trigger:
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${disc}", principal_cents: 60000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_ACCOUNT_NOT_ELIGIBLE"
            - "Account.${acct}.posture == BLOCKED"

      - name: deposit_release_requires_loan_graduated
        grounds:
          - state_machines.SecuredCard.ACTIVE_to_CLOSED
          - entities.SecuredCard.fields.graduation_eligible
          - validations[priority=12]
          - errors[ERR_DEPOSIT_NOT_RELEASABLE]
        distinguishing_aspect: |
          Pair SecuredCard->CreditBuilderLoan: releasing a card deposit requires the linked loan to be
          GRADUATED (graduation_eligible==true). With an ACTIVE non-graduated loan the card's
          graduation_eligible is false, so release by a DIFFERENT compliance user (SoD satisfied) is
          rejected with ERR_DEPOSIT_NOT_RELEASABLE — a different entity pair than Loan->Account.
        test_recipe:
          setup:
            - "CA account ELIGIBLE; loan P=60000 funded ACTIVE (not graduated) by servicer 'srv-A'."
            - "SECURED_CARD disclosure acknowledged; card deposit 50000 ACTIVE, graduation_eligible=false."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "a14@x.com", full_name: "A Fourteen", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { ldisc: $.data.id }
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "SECURED_CARD", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { cdisc: $.data.id }
            - call: "POST /disclosures/${ldisc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /disclosures/${cdisc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${ldisc}", principal_cents: 60000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan: $.data.id }
            - call: "POST /loans/${loan}/fund"
              payload: {}
              as: LoanServicer
              as_user_id: "srv-A"
            - call: "POST /secured-cards"
              payload: { account_id: "${acct}", disclosure_id: "${cdisc}" }
              as: Borrower
              as_user_id: "${acct}"
              captures: { card: $.data.id, card_v1: $.data.version }
            - call: "POST /secured-cards/${card}/deposits"
              payload: { amount_cents: 50000, expected_card_version: "${card_v1}" }
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /secured-cards/${card}/activate"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
          trigger:
            - call: "POST /secured-cards/${card}/release-deposit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "cmp-Z"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_DEPOSIT_NOT_RELEASABLE"
            - "SecuredCard.${card}.graduation_eligible == false"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: autopay_half_open_monthly_window_no_double_draft
        grounds:
          - entities.AutopayEnrollment.fields.day_of_month
          - entities.Payment.fields.posted_at
          - entities.Payment.fields.source
        distinguishing_aspect: |
          Interval semantics = half-open monthly draft window [cycle_start, cycle_start+1month): two
          run-autopay calls landing in the SAME window for the same installment draft only once — the
          second run finds the installment already occupied by an AUTOPAY Payment in that window and
          skips it, so exactly one AUTOPAY Payment exists. (Different resource & geometry than the
          inclusive calendar bucket below.)
        test_recipe:
          setup:
            - "CA loan P=60000 term12 apr0 funded 2026-02-01 ACTIVE; autopay ACTIVE day_of_month=5."
            - "Clock set to 2026-03-05 (the autopay draft date for period 1 due 2026-03-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "a15@x.com", full_name: "A Fifteen", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { disc: $.data.id }
            - call: "POST /disclosures/${disc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${disc}", principal_cents: 60000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan: $.data.id }
            - call: "POST /loans/${loan}/fund"
              payload: {}
              as: LoanServicer
            - call: "POST /autopay-enrollments"
              payload: { loan_id: "${loan}", day_of_month: 5, funding_wallet: false }
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_clock/run-autopay"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/run-autopay"
              payload: {}
              as: PlatformAdmin
            - call: "GET /loans/${loan}/payments?source=AUTOPAY"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
          assert:
            - "GET /loans/${loan}/payments?source=AUTOPAY meta.total_count == 1 (second run drafted nothing in the same window)"
            - "CreditBuilderLoan.${loan}.principal_paid_cents == 5000"

      - name: bureau_inclusive_calendar_bucket_one_report
        grounds:
          - entities.BureauReport.fields.cycle_label
          - entities.BureauReport.fields.tradeline_kind
          - calculations.compute_score_delta
        distinguishing_aspect: |
          Interval semantics = inclusive whole-month calendar bucket (YYYY-MM): two run-bureau-sweep
          calls within the SAME 2026-03 bucket emit exactly one LOAN BureauReport for the loan — the
          second sweep finds the (loan, LOAN, '2026-03') bucket already occupied and skips it. Distinct
          geometry from the half-open autopay window.
        test_recipe:
          setup:
            - "CA loan P=60000 term12 apr0 funded 2026-02-01 ACTIVE; clock set to 2026-03-20."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "a16@x.com", full_name: "A Sixteen", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { disc: $.data.id }
            - call: "POST /disclosures/${disc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${disc}", principal_cents: 60000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan: $.data.id }
            - call: "POST /loans/${loan}/fund"
              payload: {}
              as: LoanServicer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_clock/run-bureau-sweep"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/run-bureau-sweep"
              payload: {}
              as: PlatformAdmin
            - call: "GET /loans/${loan}/bureau-reports?cycle_label=2026-03"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
          assert:
            - "GET /loans/${loan}/bureau-reports?cycle_label=2026-03 meta.total_count == 1 (LOAN tradeline; second sweep no-op for this bucket)"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: locked_savings_conserved_on_payoff
        grounds:
          - state_machines.CreditBuilderLoan.ACTIVE_to_PAID_OFF
          - entities.CreditBuilderLoan.fields.principal_paid_cents
          - entities.Account.fields.wallet_cents
        distinguishing_aspect: |
          Conserved quantity = locked-savings principal. Invariant pinned as a formula:
          Account.wallet_cents increase on PAID_OFF == CreditBuilderLoan.principal_paid_cents at the
          moment of payoff (60000 in for 60000 principal paid) — no cents created or lost.
        test_recipe:
          setup:
            - "CA loan P=60000 term12 apr0 funded ACTIVE; account wallet starts at 0; one lump payment of 60000 -> PAID_OFF."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "a17@x.com", full_name: "A Seventeen", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { disc: $.data.id }
            - call: "POST /disclosures/${disc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${disc}", principal_cents: 60000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan: $.data.id }
            - call: "POST /loans/${loan}/fund"
              payload: {}
              as: LoanServicer
              captures: { loan_v2: $.data.version }
          trigger:
            - call: "POST /payments"
              payload: { loan_id: "${loan}", amount_cents: 60000, source: "MANUAL", expected_loan_version: "${loan_v2}" }
              as: Borrower
              as_user_id: "${acct}"
          assert:
            - "CreditBuilderLoan.${loan}.principal_paid_cents == 60000"
            - "Account.${acct}.wallet_cents == 60000 (exactly equal to principal_paid_cents)"
            - "CreditBuilderLoan.${loan}.lifecycle_status == PAID_OFF"

      - name: card_deposit_conserved_on_release
        grounds:
          - state_machines.SecuredCard.ACTIVE_to_CLOSED
          - entities.CardDeposit.fields.amount_cents
          - entities.SecuredCard.fields.deposit_cents
          - entities.Account.fields.wallet_cents
        distinguishing_aspect: |
          Conserved quantity = card security deposit (a DIFFERENT conserved quantity than loan
          principal). Invariant: on release, Account.wallet_cents gains exactly the released deposit
          total (sum of POSTED CardDeposit.amount_cents == prior SecuredCard.deposit_cents = 70000),
          and credit_limit_cents drops to 0 — total cents conserved across the transfer.
        test_recipe:
          setup:
            - "CA account; loan P=60000 funded by 'srv-Q', paid off via lump 60000 (wallet +60000), graduated -> card eligible."
            - "SECURED_CARD disclosure acknowledged; card with two POSTED deposits totaling 70000 (40000 + 30000), ACTIVE, balance 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "a18@x.com", full_name: "A Eighteen", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { ldisc: $.data.id }
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "SECURED_CARD", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { cdisc: $.data.id }
            - call: "POST /disclosures/${ldisc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /disclosures/${cdisc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${ldisc}", principal_cents: 60000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan: $.data.id }
            - call: "POST /loans/${loan}/fund"
              payload: {}
              as: LoanServicer
              as_user_id: "srv-Q"
              captures: { loan_v2: $.data.version }
            - call: "POST /payments"
              payload: { loan_id: "${loan}", amount_cents: 60000, source: "MANUAL", expected_loan_version: "${loan_v2}" }
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /secured-cards"
              payload: { account_id: "${acct}", disclosure_id: "${cdisc}" }
              as: Borrower
              as_user_id: "${acct}"
              captures: { card: $.data.id, card_v1: $.data.version }
            - call: "POST /secured-cards/${card}/deposits"
              payload: { amount_cents: 40000, expected_card_version: "${card_v1}" }
              as: Borrower
              as_user_id: "${acct}"
              captures: { card_v2: $.data.version }
            - call: "POST /secured-cards/${card}/deposits"
              payload: { amount_cents: 30000, expected_card_version: "${card_v2}" }
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /secured-cards/${card}/activate"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /loans/${loan}/graduate"
              payload: {}
              as: LoanServicer
              as_user_id: "srv-Q"
          trigger:
            - call: "POST /secured-cards/${card}/release-deposit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "cmp-R"
          assert:
            - "SecuredCard.${card}.deposit_cents == 0 and credit_limit_cents == 0"
            - "every CardDeposit of ${card} has status == RELEASED"
            - "Account.${acct}.wallet_cents == 130000 (60000 savings + 70000 released deposit)"
