  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: shielding_safety_outranks_exclusive_use_referential_at_commence
        grounds:
          - validations[19]
          - validations[23]
          - errors.ERR_SHIELDING_CERTIFICATION_MISSING
          - errors.ERR_EXCLUSIVE_USE_CONFLICT
          - endpoints[POST /leases/{id}/commence]
        distinguishing_aspect: |
          Pair (business_safety @19, business_referential @23) — an unshielded
          IMAGING commencement by a radiology tenant violates BOTH rules at once,
          and the 422 radiation-safety error must win over the 409 exclusive-use
          error. The control case isolates the loser: a radiology tenant
          commencing into an ordinary exam suite violates only rule 23 and does
          return 409, proving rule 23 was live and was genuinely outranked.
        test_recipe:
          setup:
            - "One 100000 sf Building at 30.00 psf market with an 8000 sf IMAGING suite left shielding_certified false, plus a 3000 sf and a 5000 sf STANDARD_EXAM suite."
            - "Three non-physician-owned INDEPENDENT_PRACTICE tenants: two RADIOLOGY practices and one ORTHOPEDICS practice."
            - "Three EXECUTED leases, all with radius_restriction_miles null, executed in this order so the one-directional exclusive-use check does not fire at execution: the imaging lease at 36.50 psf, the 3000 sf radiology lease at 30.00 psf, then the 5000 sf orthopedics lease at 30.00 psf carrying exclusive_use_specialty RADIOLOGY."
            - "The clock advanced to 2026-09-01T00:00:00Z so priority 33 is satisfied for both commencements."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { b10_id: $.data.id }
            - call: "POST /buildings/${b10_id}/suites"
              payload: { suite_number: "150", floor: 1, rentable_sf: 8000, suite_class: "IMAGING", power_amps_available: 600, medical_gas_available: false, shielding_certified: false }
              as: PortfolioAdmin
              captures: { s10y_id: $.data.id }
            - call: "POST /buildings/${b10_id}/suites"
              payload: { suite_number: "220", floor: 2, rentable_sf: 3000, suite_class: "STANDARD_EXAM", power_amps_available: 150 }
              as: PortfolioAdmin
              captures: { s10w_id: $.data.id }
            - call: "POST /buildings/${b10_id}/suites"
              payload: { suite_number: "230", floor: 2, rentable_sf: 5000, suite_class: "STANDARD_EXAM", power_amps_available: 200 }
              as: PortfolioAdmin
              captures: { s10z_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Clearview Imaging LLC", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "RADIOLOGY", is_physician_owned: false, npi: "1234567941" }
              as: PortfolioAdmin
