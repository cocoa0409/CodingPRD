            - call: "POST /correspondent/commitments"
              payload: { seller_id: "${s1}", product_id: "${p_jumbo}", commitment_type: "MANDATORY", notional_amount_cents: 100000000, delivery_window_start: "2026-08-01", delivery_expiry_date: "2026-08-31", reference_fico: 760, reference_ltv_pct: 78.0 }
