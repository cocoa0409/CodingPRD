              as: FacilitiesEngineer
            - call: "GET /suites/${m14_s_id}"
              payload: {}
              as: FacilitiesEngineer
          assert:
            - "The project was created and submitted successfully: no capacity check applies at DESIGN"
            - "The UTILITY approval returns 422 with data.error_id == 'ERR_INSUFFICIENT_UTILITY_CAPACITY'"
            - "TenantImprovementProject.${m14_tp_id}.utility_review_status is still PENDING and power_amps_drawn == 0"
            - "The SHIELDING approval still succeeds and leaves the project IN_REVIEW — the join does not fire with one dimension outstanding"
            - "Suite.${m14_s_id}.power_amps_available == 200, untouched by the refused review"

