            - "One DRAFT RETAIL_DISPLAY pack keyed on the first BRANDED SKU, which is already a member."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { br1: $.data.id }
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "SO-20-BR", tool_family: "SOCKET", channel: "BRANDED", nominal_size_mm: 20, alloy_grade: "CR_V", list_price_cents: 1500, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { br2: $.data.id }
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-PR", tool_family: "WRENCH", channel: "PROFESSIONAL", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 4200, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { pr1: $.data.id }
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "PL-10-PL", tool_family: "PLIER", channel: "PRIVATE_LABEL", nominal_size_mm: 10, alloy_grade: "S2", list_price_cents: 900, warranty_tier: "LIMITED_5Y" }
              as: ChannelManager
              captures: { pl1: $.data.id }
            - call: "POST /toolworks/pack-configurations"
              payload: { pack_code: "PK-RD-1", pack_type: "RETAIL_DISPLAY", primary_sku_id: "${br1}" }
              as: ChannelManager
              captures: { pack_id: $.data.id }
            - call: "POST /toolworks/pack-configurations/${pack_id}/members"
              payload: { sku_id: "${br1}", quantity: 2 }
