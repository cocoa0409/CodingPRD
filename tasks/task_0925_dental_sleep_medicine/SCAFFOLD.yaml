# =============================================================================
# PRD Benchmark Seed Tables — Dental Sleep Medicine (oral appliance therapy)
# §1.0 – §1.7.  §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
#               §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  925. Dental Sleep Medicine (oral appliance): physician referral & diagnosis (HSAT/PSG),
  oral-appliance impression & fabrication, titration & efficacy re-test, medical (not dental)
  billing & DME, adherence & follow-up, warranty/repair, cross-provider coordination, recall

domain_name: dental-sleep-medicine

# Flat topology: every business entity is a top-level collection joined by foreign keys,
# so the API root itself is the prefix. No resource is nested inside another in the URL.
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  state_machine_shape: parallel
  # Appliance carries three independent state axes (lifecycle_status x device_hold_status x
  # recall_status); TitrationVisit, PriorAuth, Claim, EfficacyReport, SleepStudy and LabOrder
  # are cyclic; Referral, RepairOrder and ApplianceLot are branching.

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential   # Appliance.replaces_appliance_id -> Appliance.id (replacement chain)

  role_model: segregation_of_duties
  # The physician who diagnoses and signs the efficacy report may never be the dentist who
  # treats and titrates; the treating dentist may never sign off on his own efficacy report.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table  (16 entities, flat topology)
# =============================================================================
entities:

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - name: npi
        type: string
        source: input
        description: "National Provider Identifier; unique across all Providers"
        constraints: "exactly 10 digits; uniqueness violation routes to ERR_DUPLICATE_IDENTIFIER"
      - name: full_name
        type: string
        source: input
        description: "Provider display name"
      - name: provider_type
        type: enum
        source: input
        description: "What this provider is licensed to do"
        constraints: "one of SLEEP_PHYSICIAN, DENTIST, DENTAL_LAB"
      - name: state_license
        type: string
        source: input
        description: "State licence identifier"
        default: "UNVERIFIED"
      - name: dme_supplier_number
        type: string
        source: input
        description: "Medicare DMEPOS supplier number; only DENTIST providers may hold one"
        default: null
      - name: status
        type: enum
        source: input
        description: "Provider participation status, settable at creation. A SUSPENDED Provider may not be named as referring_physician_id, treating_dentist_id, lab_provider_id or performed_by_dentist_id on any new row."
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED"
      - name: open_efficacy_loop_count
        type: integer
        source: computed
        description: "Count of EfficacyReport rows whose referring_physician is this Provider and whose status is in {SUBMITTED, DISPUTED}. Recomputed on every EfficacyReport transition."
        default: 0

  - name: Payer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Payer display name"
      - name: payer_kind
        type: enum
        source: input
        description: "Which benefit this payer adjudicates. Oral appliance therapy is a MEDICAL benefit; a DENTAL payer may never be the payer_id of a Claim."
        constraints: "one of MEDICAL, DENTAL"
      - name: prior_auth_required
        type: boolean
        source: input
        description: "Whether an APPROVED PriorAuth is required before a device Claim may be submitted"
        default: true
      - name: useful_lifetime_months
        type: integer
        source: input
        description: "Reasonable useful lifetime of a covered oral appliance, in whole months, counted from Appliance.delivered_on"
        default: 60
      - name: coinsurance_pct
        type: number
        source: input
        description: "Member coinsurance applied after the deductible, as a fraction of the allowed amount"
        default: 0.20
        constraints: "0.00 <= coinsurance_pct <= 1.00"
      - name: appeal_limit
        type: integer
        source: input
        description: "Maximum number of appeal attempts permitted on a PriorAuth and, separately, on a Claim"
        default: 2
      - name: residual_ahi_target
        type: number
        source: input
        description: "Absolute residual-AHI success target used by the efficacy dual-criterion"
        default: 5.0
      - name: pct_reduction_target
        type: number
        source: input
        description: "Percent-reduction-from-baseline success target used by the efficacy dual-criterion, as a fraction"
        default: 0.50

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: mrn
        type: string
        source: input
        description: "Medical record number; unique across Patients"
        constraints: "uniqueness violation routes to ERR_DUPLICATE_IDENTIFIER"
      - name: full_name
        type: string
        source: input
        description: "Patient display name"
      - name: date_of_birth
        type: string
        source: input
        description: "ISO 8601 calendar date, YYYY-MM-DD"
      - name: medical_payer_id
        type: string
        source: input
        description: "FK -> Payer.id; the medical benefit that adjudicates oral appliance claims. MUST reference a Payer whose payer_kind is MEDICAL."
      - name: dental_payer_id
        type: string
        source: input
        description: "FK -> Payer.id; the dental benefit, recorded for completeness. A Claim naming this payer is rejected."
        default: null
      - name: deductible_remaining_cents
        type: integer
        source: input
        description: "Unmet medical deductible at the moment of adjudication, in cents. Decremented by the deductible leg of every PAID Claim."
        default: 0
        constraints: "deductible_remaining_cents >= 0"
      - name: epworth_score
        type: integer
        source: input
        description: "Epworth Sleepiness Scale score captured at intake; drives the mild/moderate first-line eligibility branch"
        default: 0
        constraints: "0 <= epworth_score <= 24"
      - name: records_frozen
        type: boolean
        source: computed
        description: "True when at least one AuditHold with status OPEN references this Patient. Recomputed on AuditHold create and close."
        default: false

  - name: SleepStudy
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the subject of the study"
      - name: ordering_physician_id
        type: string
        source: input
        description: "FK -> Provider.id; MUST be a Provider whose provider_type is SLEEP_PHYSICIAN"
      - name: appliance_id
        type: string
        source: input
        description: "FK -> Appliance.id; the appliance worn in situ during an efficacy re-test. Required when study_purpose is EFFICACY, forbidden when DIAGNOSTIC."
        default: null
      - name: modality
        type: enum
        source: input
        description: "Recording modality"
        constraints: "one of HSAT, PSG"
      - name: study_purpose
        type: enum
        source: input
        description: "Why the study was run"
        constraints: "one of DIAGNOSTIC, EFFICACY"
      - name: performed_on
        type: string
        source: input
        description: "ISO 8601 calendar date the recording was made, YYYY-MM-DD"
        default: null
      - name: respiratory_events
        type: integer
        source: input
        description: "Count of scored apneas plus hypopneas over the whole recording"
        default: null
        constraints: "respiratory_events >= 0"
      - name: recording_minutes
        type: integer
        source: input
        description: "Total monitored minutes (HSAT denominator)"
        default: null
        constraints: "recording_minutes >= 0"
      - name: sleep_minutes
        type: integer
        source: input
        description: "Scored total sleep time in minutes (PSG denominator); ignored for HSAT"
        default: null
        constraints: "sleep_minutes >= 0 and sleep_minutes <= recording_minutes"
      - name: artifact_pct
        type: number
        source: input
        description: "Percent of the recording rejected as artifact"
        default: 0
        constraints: "0 <= artifact_pct <= 100"
      - name: attended
        type: boolean
        source: input
        description: "Whether a technologist attended the recording; a PSG must be attended to be diagnostic"
        default: false
      - name: severity_index
        type: number
        source: computed
        description: "Events per hour. Dual-variant: HSAT divides by recording hours, PSG divides by scored sleep hours. Rounded to 1 decimal, round_half_up."
        default: null
      - name: severity_band
        type: enum
        source: computed
        description: "OSA severity derived from severity_index"
        default: null
        constraints: "one of NONE, MILD, MODERATE, SEVERE"
      - name: repeat_count
        type: integer
        source: computed
        description: "How many times this study row has been re-ordered after a non-diagnostic recording"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Study lifecycle state"
        default: ORDERED
        constraints: "one of ORDERED, DIAGNOSTIC_VALID, NON_DIAGNOSTIC"

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id"
      - name: referring_physician_id
        type: string
        source: input
        description: "FK -> Provider.id; MUST be provider_type SLEEP_PHYSICIAN"
      - name: treating_dentist_id
        type: string
        source: input
        description: "FK -> Provider.id; MUST be provider_type DENTIST and MUST NOT equal referring_physician_id"
      - name: diagnostic_study_id
        type: string
        source: input
        description: "FK -> SleepStudy.id; the DIAGNOSTIC study carrying the physician's OSA diagnosis"
      - name: cpap_history
        type: enum
        source: input
        description: "Documented positive-airway-pressure history for this patient"
        default: NONE
        constraints: "one of NONE, FAILURE, INTOLERANCE, REFUSAL"
      - name: cpap_nights_used
        type: integer
        source: input
        description: "Nights of documented CPAP use during the trial; only meaningful when cpap_history is FAILURE or INTOLERANCE"
        default: 0
        constraints: "cpap_nights_used >= 0"
      - name: cpap_documented_on
        type: string
        source: input
        description: "ISO 8601 calendar date the CPAP failure/intolerance/refusal was documented, YYYY-MM-DD"
        default: null
      - name: severity_band_at_referral
        type: enum
        source: computed
        description: "Snapshot of SleepStudy.severity_band taken when the Referral is created"
        default: null
        constraints: "one of MILD, MODERATE, SEVERE"
      - name: eligibility_basis
        type: enum
        source: computed
        description: "Which arm of the medical-necessity fork admitted this referral"
        default: null
        constraints: "one of FIRST_LINE_MILD_MODERATE, CPAP_INTOLERANT_SEVERE"
      - name: diagnosis_valid_until
        type: string
        source: computed
        description: "SleepStudy.performed_on plus the modality validity window; after this date the referral is no longer usable"
        default: null
      - name: loop_status
        type: enum
        source: computed
        description: "Cross-provider loop-closure posture, derived from the newest EfficacyReport on this referral"
        default: OPEN
        constraints: "one of OPEN, CLOSED"
      - name: status
        type: enum
        source: system
        description: "Referral lifecycle state"
        default: ISSUED
        constraints: "one of ISSUED, ACCEPTED, DECLINED, EXPIRED, CLOSED"

  - name: WrittenOrder
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id"
      - name: ordering_physician_id
        type: string
        source: input
        description: "FK -> Provider.id; MUST be provider_type SLEEP_PHYSICIAN"
      - name: item_hcpcs
        type: enum
        source: input
        description: "HCPCS item the standard written order covers"
        constraints: "one of E0486, A9270, K0739"
      - name: order_date
        type: string
        source: input
        description: "ISO 8601 calendar date the order was written, YYYY-MM-DD"
      - name: f2f_encounter_date
        type: string
        source: input
        description: "ISO 8601 calendar date of the face-to-face encounter supporting the order, YYYY-MM-DD"
      - name: signed_on
        type: string
        source: input
        description: "ISO 8601 calendar date the physician signed the order, YYYY-MM-DD"
        default: null
      - name: f2f_age_days
        type: integer
        source: computed
        description: "order_date minus f2f_encounter_date, in whole days"
        default: null
      - name: status
        type: enum
        source: system
        description: "Standard-written-order lifecycle state"
        default: DRAFT
        constraints: "one of DRAFT, SIGNED, SUPERSEDED"

  - name: PriorAuth
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id"
      - name: payer_id
        type: string
        source: input
        description: "FK -> Payer.id; MUST be the Patient's medical_payer_id"
      - name: referral_id
        type: string
        source: input
        description: "FK -> Referral.id; the referral whose therapy this authorisation covers"
      - name: requested_hcpcs
        type: enum
        source: input
        description: "HCPCS code being authorised"
        constraints: "one of E0486, A9270, K0739"
      - name: submitted_on
        type: string
        source: system
        description: "ISO 8601 calendar date the authorisation request was filed (logical clock date at creation)"
      - name: decided_on
        type: string
        source: input
        description: "ISO 8601 calendar date the payer rendered its decision, YYYY-MM-DD"
        default: null
      - name: approval_valid_until
        type: string
        source: computed
        description: "decided_on plus PA_VALIDITY_DAYS; only set when status becomes APPROVED"
        default: null
      - name: denial_reason
        type: enum
        source: input
        description: "Payer's stated denial reason"
        default: null
        constraints: "one of NOT_MEDICALLY_NECESSARY, MISSING_DOCUMENTATION, NON_COVERED_ITEM"
      - name: appeal_attempts
        type: integer
        source: computed
        description: "Number of appeals filed against this authorisation"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Authorisation lifecycle state"
        default: SUBMITTED
        constraints: "one of SUBMITTED, APPROVED, DENIED, APPEALED, DENIED_FINAL, EXPIRED"

  - name: LabOrder
    parent: null
    common_fields: true
    fields:
      - name: referral_id
        type: string
        source: input
        description: "FK -> Referral.id; the referral this appliance is being made under"
      - name: lab_provider_id
        type: string
        source: input
        description: "FK -> Provider.id; MUST be provider_type DENTAL_LAB"
      - name: appliance_kind
        type: enum
        source: input
        description: "Fabrication class, which fixes the HCPCS code, the price and the warranty"
        constraints: "one of CUSTOM_FABRICATED, PREFABRICATED"
      - name: capture_method
        type: enum
        source: input
        description: "How the records were taken"
        constraints: "one of PVS_IMPRESSION, DIGITAL_SCAN"
      - name: max_protrusive_mm
        type: number
        source: input
        description: "Maximum protrusive range measured at records, in millimetres. Hard physical ceiling for all titration."
        constraints: "4.00 <= max_protrusive_mm <= 12.00, multiple of 0.25"
      - name: retruded_position_mm
        type: number
        source: input
        description: "Retruded contact position reference, in millimetres"
        default: 0.00
      - name: promised_turnaround_days
        type: integer
        source: input
        description: "Turnaround days the lab commits to at submission"
        default: 14
        constraints: "1 <= promised_turnaround_days <= 60"
      - name: submitted_on
        type: string
        source: computed
        description: "Logical clock date at the most recent submit, YYYY-MM-DD"
        default: null
      - name: promised_ship_date
        type: string
        source: computed
        description: "submitted_on plus promised_turnaround_days"
        default: null
      - name: shipped_on
        type: string
        source: input
        description: "ISO 8601 calendar date the lab shipped the case, YYYY-MM-DD"
        default: null
      - name: turnaround_on_time
        type: boolean
        source: computed
        description: "True when shipped_on <= promised_ship_date"
        default: null
      - name: remake_count
        type: integer
        source: computed
        description: "How many times the case was returned to the lab for a remake"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Lab work-order lifecycle state"
        default: RECORDS_CAPTURED
        constraints: "one of RECORDS_CAPTURED, IN_FABRICATION, SHIPPED, RECEIVED_ACCEPTED, REMAKE_REQUIRED, CANCELLED"

  - name: ApplianceLot
    parent: null
    common_fields: true
    fields:
      - name: manufacturer
        type: string
        source: input
        description: "Device manufacturer name"
      - name: lot_code
        type: string
        source: input
        description: "Manufacturing lot code; unique across ApplianceLots"
        constraints: "uniqueness violation routes to ERR_DUPLICATE_IDENTIFIER"
      - name: material
        type: string
        source: input
        description: "Base material of the devices in this lot"
        default: "NYLON_COPOLYMER"
      - name: notice_reference
        type: string
        source: input
        description: "Manufacturer or regulator recall notice reference"
        default: null
      - name: recall_severity
        type: enum
        source: input
        description: "Severity of the safety notice"
        default: null
        constraints: "one of CLASS_I, CLASS_II, CLASS_III"
      - name: recall_issued_on
        type: string
        source: computed
        description: "Logical clock date at which the recall was issued, YYYY-MM-DD"
        default: null
      - name: affected_device_count
        type: integer
        source: computed
        description: "Number of Appliance rows carrying this lot_id at the instant the recall was issued"
        default: 0
      - name: remediated_count
        type: integer
        source: computed
        description: "Number of affected Appliance rows whose device_hold_status has returned to NONE via remediation"
        default: 0
      - name: pending_remediation_count
        type: integer
        source: computed
        description: "Number of affected Appliance rows still in device_hold_status RECALL_HOLD"
        default: 0
      - name: retired_count
        type: integer
        source: computed
        description: "Number of affected Appliance rows whose lifecycle_status is RETIRED or REPLACED at remediation time"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Lot recall posture"
        default: ACTIVE
        constraints: "one of ACTIVE, RECALL_ISSUED, REMEDIATION_COMPLETE"

  - name: Appliance
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: computed
        description: "FK -> Patient.id; copied from the LabOrder's Referral at fabrication"
      - name: lab_order_id
        type: string
        source: input
        description: "FK -> LabOrder.id; MUST be in status RECEIVED_ACCEPTED"
      - name: lot_id
        type: string
        source: input
        description: "FK -> ApplianceLot.id; the manufacturing lot this device came from"
      - name: replaces_appliance_id
        type: string
        source: input
        description: "FK -> Appliance.id; the predecessor device this one replaces, forming the replacement chain"
        default: null
      - name: serial_number
        type: string
        source: input
        description: "Device serial number; unique across Appliances"
        constraints: "uniqueness violation routes to ERR_DUPLICATE_IDENTIFIER"
      - name: has_microrecorder
        type: boolean
        source: input
        description: "Whether the device carries an embedded objective-adherence microrecorder"
        default: true
      - name: appliance_kind
        type: enum
        source: computed
        description: "Copied from LabOrder.appliance_kind"
        constraints: "one of CUSTOM_FABRICATED, PREFABRICATED"
      - name: hcpcs_code
        type: enum
        source: computed
        description: "E0486 for CUSTOM_FABRICATED, A9270 for PREFABRICATED"
        constraints: "one of E0486, A9270"
      - name: max_protrusive_mm
        type: number
        source: computed
        description: "Copied from LabOrder.max_protrusive_mm at fabrication; the hard titration ceiling"
      - name: delivered_on
        type: string
        source: input
        description: "ISO 8601 calendar date the device was delivered to the patient, YYYY-MM-DD"
        default: null
      - name: written_order_id
        type: string
        source: input
        description: "FK -> WrittenOrder.id; the SIGNED standard written order presented at delivery"
        default: null
      - name: pod_signed_on
        type: string
        source: input
        description: "ISO 8601 calendar date proof of delivery was signed, YYYY-MM-DD"
        default: null
      - name: pod_method
        type: enum
        source: input
        description: "How proof of delivery was obtained"
        default: null
        constraints: "one of IN_PERSON, SHIPPED"
      - name: warranty_end_date
        type: string
        source: computed
        description: "delivered_on plus WARRANTY_MONTHS"
        default: null
      - name: useful_lifetime_end_date
        type: string
        source: computed
        description: "delivered_on plus the Patient's medical Payer.useful_lifetime_months"
        default: null
      - name: starting_advancement_mm
        type: number
        source: computed
        description: "Advancement set at delivery; dual-variant by appliance_kind"
        default: null
      - name: current_advancement_mm
        type: number
        source: computed
        description: "starting_advancement_mm plus the sum of every TitrationVisit.applied_increment_mm on this appliance"
        default: null
      - name: applied_visit_count
        type: integer
        source: computed
        description: "Count of TitrationVisit rows on this appliance whose status is APPLIED or REDUCED"
        default: 0
      - name: plateau_declared_on
        type: string
        source: computed
        description: "Logical clock date the dentist declared titration plateau, YYYY-MM-DD"
        default: null
      - name: next_recall_due_on
        type: string
        source: computed
        description: "Calendar date the next patient recall check is due"
        default: null
      - name: recall_cycle_index
        type: integer
        source: computed
        description: "How many patient recall checks have been completed on this device"
        default: 0
      - name: lifecycle_status
        type: enum
        source: system
        description: "Therapy lifecycle axis"
        default: FABRICATED
        constraints: "one of FABRICATED, DELIVERED, IN_TITRATION, TITRATION_SUSPENDED, TITRATION_PLATEAU, EFFICACY_PENDING, ACTIVE_THERAPY, RETIRED, REPLACED"
      - name: device_hold_status
        type: enum
        source: system
        description: "Safety-hold axis, driven by the device lot recall"
        default: NONE
        constraints: "one of NONE, RECALL_HOLD"
      - name: recall_status
        type: enum
        source: system
        description: "Patient-recall cadence axis"
        default: NOT_SCHEDULED
        constraints: "one of NOT_SCHEDULED, NOT_DUE, DUE, LAPSED"

  - name: TitrationVisit
    parent: null
    common_fields: true
    fields:
      - name: appliance_id
        type: string
        source: input
        description: "FK -> Appliance.id; the device being advanced"
      - name: performed_by_dentist_id
        type: string
        source: input
        description: "FK -> Provider.id; MUST be provider_type DENTIST"
      - name: visit_seq
        type: integer
        source: computed
        description: "1-based ordinal of this visit among all TitrationVisit rows on the appliance, assigned at creation by created_at ASC"
      - name: scheduled_for
        type: string
        source: input
        description: "ISO 8601 calendar date the visit is scheduled for, YYYY-MM-DD"
      - name: requested_increment_mm
        type: number
        source: input
        description: "Advancement the dentist asks for at this visit, in millimetres"
        constraints: "0.25 <= requested_increment_mm <= 2.00, multiple of 0.25"
      - name: side_effect_severity
        type: enum
        source: input
        description: "Joint/tooth/bite side effects reported by the patient at the chair, supplied when the visit is applied"
        default: null
        constraints: "one of NONE, MILD, MODERATE, SEVERE"
      - name: applied_increment_mm
        type: number
        source: computed
        description: "Advancement actually applied, after the per-visit cap, the remaining-range cap and the side-effect branch. Negative when the visit reduces advancement."
        default: null
      - name: applied_on
        type: string
        source: computed
        description: "Logical clock date the increment was applied, YYYY-MM-DD"
        default: null
      - name: days_since_prior_applied
        type: integer
        source: computed
        description: "Whole days between the prior APPLIED/REDUCED visit's applied_on on the same appliance and this visit's applied_on; null for the first"
        default: null
      - name: status
        type: enum
        source: system
        description: "Visit lifecycle state"
        default: SCHEDULED
        constraints: "one of SCHEDULED, APPLIED, REDUCED, HELD, SUPERSEDED, VOIDED_BY_HOLD"

  - name: AdherenceDownload
    parent: null
    common_fields: false
    fields:
      - name: appliance_id
        type: string
        source: input
        description: "FK -> Appliance.id; the device the adherence figures belong to"
      - name: source
        type: enum
        source: input
        description: "Where the figures came from. Only OBJECTIVE_MICRORECORDER satisfies the payer."
        constraints: "one of OBJECTIVE_MICRORECORDER, PATIENT_ATTESTED"
      - name: window_start
        type: string
        source: input
        description: "ISO 8601 calendar date of the first night in the rolling window, YYYY-MM-DD"
      - name: window_end
        type: string
        source: input
        description: "ISO 8601 calendar date of the last night in the rolling window, YYYY-MM-DD; the window is inclusive of both ends and MUST span exactly ADHERENCE_WINDOW_DAYS nights"
      - name: nights_recorded
        type: integer
        source: input
        description: "Nights on which the device reported any wear at all"
        constraints: "0 <= nights_recorded <= ADHERENCE_WINDOW_DAYS"
      - name: nights_at_or_above_min_hours
        type: integer
        source: input
        description: "Nights whose wear duration reached ADHERENCE_MIN_HOURS"
        constraints: "0 <= nights_at_or_above_min_hours <= nights_recorded"
      - name: mean_hours_per_worn_night
        type: number
        source: input
        description: "Mean wear hours across the nights_recorded nights"
        constraints: "0 <= mean_hours_per_worn_night <= 24"
      - name: rate_of_window
        type: number
        source: computed
        description: "nights_at_or_above_min_hours divided by ADHERENCE_WINDOW_DAYS, rounded to 4 decimals. The payer variant."
      - name: rate_of_recorded
        type: number
        source: computed
        description: "nights_at_or_above_min_hours divided by nights_recorded, rounded to 4 decimals. The clinic variant; diverges whenever nights_recorded < ADHERENCE_WINDOW_DAYS."
      - name: compliant
        type: boolean
        source: computed
        description: "True when rate_of_window >= ADHERENCE_MIN_NIGHTS_PCT. Always evaluated on rate_of_window, never on rate_of_recorded."

  - name: EfficacyReport
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: computed
        description: "FK -> Patient.id; copied from the referral"
      - name: referral_id
        type: string
        source: input
        description: "FK -> Referral.id; the loop this report closes"
      - name: appliance_id
        type: string
        source: input
        description: "FK -> Appliance.id; the device under test"
      - name: efficacy_study_id
        type: string
        source: input
        description: "FK -> SleepStudy.id; MUST be study_purpose EFFICACY, status DIAGNOSTIC_VALID, and its appliance_id MUST equal this report's appliance_id"
      - name: baseline_index
        type: number
        source: computed
        description: "severity_index of the Referral's diagnostic study"
      - name: residual_index
        type: number
        source: computed
        description: "severity_index of the efficacy study"
      - name: pct_reduction
        type: number
        source: computed
        description: "(baseline_index - residual_index) / baseline_index, rounded to 4 decimals"
      - name: meets_absolute_target
        type: boolean
        source: computed
        description: "residual_index <= Payer.residual_ahi_target"
      - name: meets_relative_target
        type: boolean
        source: computed
        description: "pct_reduction >= Payer.pct_reduction_target AND residual_index < PARTIAL_AHI_CEILING"
      - name: outcome
        type: enum
        source: computed
        description: "COMPLETE when both criteria hold, PARTIAL when exactly one holds, FAILED when neither holds"
        constraints: "one of COMPLETE, PARTIAL, FAILED"
      - name: due_by
        type: string
        source: computed
        description: "Appliance.plateau_declared_on plus EFFICACY_REPORT_DUE_DAYS; the deadline the dentist owes the referring physician"
      - name: submitted_on
        type: string
        source: computed
        description: "Logical clock date the dentist submitted the report to the physician, YYYY-MM-DD"
        default: null
      - name: physician_decision_on
        type: string
        source: computed
        description: "Logical clock date the physician signed or disputed, YYYY-MM-DD"
        default: null
      - name: dispute_reason
        type: string
        source: input
        description: "Free text the physician supplies when disputing"
        default: null
      - name: revision_count
        type: integer
        source: computed
        description: "How many times this report has cycled DISPUTED -> DRAFT"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Report lifecycle state"
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, SIGNED, DISPUTED, WITHDRAWN, SUPERSEDED"

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id"
      - name: payer_id
        type: string
        source: input
        description: "FK -> Payer.id; MUST equal the Patient's medical_payer_id"
      - name: appliance_id
        type: string
        source: input
        description: "FK -> Appliance.id; the device being billed"
      - name: prior_auth_id
        type: string
        source: input
        description: "FK -> PriorAuth.id; the authorisation supporting this claim"
        default: null
      - name: written_order_id
        type: string
        source: input
        description: "FK -> WrittenOrder.id; the standard written order supporting this claim"
        default: null
      - name: repair_order_id
        type: string
        source: input
        description: "FK -> RepairOrder.id; set only on claim_type REPAIR"
        default: null
      - name: claim_type
        type: enum
        source: input
        description: "What is being billed"
        constraints: "one of INITIAL_DEVICE, REPAIR, REPLACEMENT, CONTINUED_USE"
      - name: hcpcs_code
        type: enum
        source: input
        description: "HCPCS billed"
        constraints: "one of E0486, A9270, K0739"
      - name: date_of_service
        type: string
        source: input
        description: "ISO 8601 calendar date of service, YYYY-MM-DD. For INITIAL_DEVICE and REPLACEMENT this MUST equal Appliance.delivered_on."
      - name: billed_cents
        type: integer
        source: input
        description: "Amount billed, in cents"
        constraints: "billed_cents >= 0"
      - name: allowed_cents
        type: integer
        source: computed
        description: "min(billed_cents, fee schedule for hcpcs_code); 0 for non-covered items"
        default: null
      - name: deductible_applied_cents
        type: integer
        source: computed
        description: "min(allowed_cents, Patient.deductible_remaining_cents) at adjudication"
        default: null
      - name: coinsurance_cents
        type: integer
        source: computed
        description: "round_half_up(Payer.coinsurance_pct * (allowed_cents - deductible_applied_cents))"
        default: null
      - name: patient_responsibility_cents
        type: integer
        source: computed
        description: "deductible_applied_cents plus coinsurance_cents"
        default: null
      - name: payer_paid_cents
        type: integer
        source: computed
        description: "allowed_cents minus patient_responsibility_cents"
        default: null
      - name: adjustment_cents
        type: integer
        source: computed
        description: "billed_cents minus allowed_cents (contractual write-off)"
        default: null
      - name: denial_error_id
        type: string
        source: computed
        description: "The error id the submission would have raised, recorded when a claim is denied at adjudication"
        default: null
      - name: appeal_attempts
        type: integer
        source: computed
        description: "Number of appeals filed against this claim"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle state"
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, PAID, DENIED, APPEALED, DENIED_FINAL, VOIDED"

  - name: RepairOrder
    parent: null
    common_fields: true
    fields:
      - name: appliance_id
        type: string
        source: input
        description: "FK -> Appliance.id; the device under repair"
      - name: loaner_appliance_id
        type: string
        source: input
        description: "FK -> Appliance.id; a loaner device issued to the patient while the case is at the lab"
        default: null
      - name: reason
        type: enum
        source: input
        description: "Why the device is being serviced"
        constraints: "one of DEFECT, WEAR, ABUSE, LOSS"
      - name: reported_on
        type: string
        source: input
        description: "ISO 8601 calendar date the problem was reported, YYYY-MM-DD"
      - name: labor_minutes
        type: integer
        source: input
        description: "Bench labour minutes spent on the repair"
        default: 0
        constraints: "labor_minutes >= 0"
      - name: returned_on
        type: string
        source: computed
        description: "Logical clock date the repair closed and any loaner was returned, YYYY-MM-DD"
        default: null
      - name: in_warranty
        type: boolean
        source: computed
        description: "True when reported_on <= Appliance.warranty_end_date AND reason is DEFECT"
      - name: billable
        type: boolean
        source: computed
        description: "Logical negation of in_warranty for reasons DEFECT and WEAR; ABUSE and LOSS are always billable"
      - name: labor_units
        type: integer
        source: computed
        description: "ceil(labor_minutes / 15) when billable, else 0"
        default: 0
      - name: repair_charge_cents
        type: integer
        source: computed
        description: "min(labor_units * LABOR_RATE_CENTS_PER_15MIN, round_half_up(REPAIR_CAP_PCT * device allowed amount)) when billable, else 0"
        default: 0
      - name: resets_useful_lifetime
        type: boolean
        source: computed
        description: "Always false for a repair; only a payer-funded REPLACEMENT restarts the useful-lifetime clock"
        default: false
      - name: status
        type: enum
        source: system
        description: "Repair lifecycle state"
        default: OPEN
        constraints: "one of OPEN, IN_LAB, CLOSED_REPAIRED, CLOSED_NOT_COVERED"

  - name: AuditHold
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient whose records the payer has frozen"
      - name: payer_id
        type: string
        source: input
        description: "FK -> Payer.id; the payer conducting the audit"
      - name: opened_on
        type: string
        source: system
        description: "Logical clock date the hold was opened, YYYY-MM-DD"
      - name: closed_on
        type: string
        source: computed
        description: "Logical clock date the hold was closed, YYYY-MM-DD"
        default: null
      - name: scope_note
        type: string
        source: input
        description: "What the payer is auditing"
        default: null
      - name: status
        type: enum
        source: system
        description: "Audit hold state"
        default: OPEN
        constraints: "one of OPEN, CLOSED"

# =============================================================================
# §1.2 State Machine Table  (13 machines; 12 non-linear)
# =============================================================================
state_machines:

  # --- 1. Referral: branching (accept / decline) plus a mutate-then-reject expiry ---
  - entity: Referral
    initial_state: ISSUED
    terminal_states: [DECLINED, EXPIRED, CLOSED]
    transitions:
      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /referrals/{referral_id}/respond with decision=ACCEPTED"
        actor: Dentist
        preconditions:
          - "acting X-User-ID equals Referral.treating_dentist_id"
          - "Patient.records_frozen is false"
          - "clock date <= Referral.diagnosis_valid_until"
        side_effects:
          - "Referral.version increments by 1"
      - from: ISSUED
        to: DECLINED
        trigger: "POST /referrals/{referral_id}/respond with decision=DECLINED"
        actor: Dentist
        preconditions:
          - "acting X-User-ID equals Referral.treating_dentist_id"
          - "Patient.records_frozen is false"
        side_effects:
          - "no LabOrder can exist yet on an ISSUED referral (creation requires ACCEPTED), so nothing cascades from a decline"
      - from: ISSUED
        to: EXPIRED
        trigger: "system, evaluated inside POST /referrals/{referral_id}/respond (mutate-then-reject rung, priority 18)"
        actor: system
        preconditions:
          - "clock date > Referral.diagnosis_valid_until"
        side_effects:
          - "Referral.status is persisted as EXPIRED and Referral.version increments by 1, then the request is rejected with ERR_DIAGNOSIS_EXPIRED (422)"
        note: "When Referral.status is ALREADY EXPIRED, the state-precondition rung (priority 12) fires first and returns ERR_INVALID_STATE (409); this expiry rung is never re-entered and no second version bump occurs."
      - from: ACCEPTED
        to: EXPIRED
        trigger: "system, evaluated inside POST /lab-orders and POST /prior-auths (mutate-then-reject rung, priority 18)"
        actor: system
        preconditions:
          - "clock date > Referral.diagnosis_valid_until"
        side_effects:
          - "Referral.status is persisted as EXPIRED and Referral.version increments by 1, then the request is rejected with ERR_DIAGNOSIS_EXPIRED (422)"
          - "every LabOrder with referral_id == this referral and status == RECORDS_CAPTURED transitions to CANCELLED"
        note: "Same pre-emption rule as above: an already-EXPIRED referral fails the priority-12 state gate with ERR_INVALID_STATE before this rung is reached."
      - from: ACCEPTED
        to: CLOSED
        trigger: "system, cascade level 1 of POST /efficacy-reports/{report_id}/physician-response with decision=SIGNED"
        actor: system
        preconditions:
          - "the signed EfficacyReport.referral_id == this referral"
        side_effects:
          - "Referral.loop_status becomes CLOSED"
          - "CASCADE L2: the EfficacyReport's Appliance transitions lifecycle_status EFFICACY_PENDING -> ACTIVE_THERAPY"
          - "Provider.open_efficacy_loop_count is recomputed for Referral.referring_physician_id"

  # --- 2. SleepStudy: branching quality gate plus a repeat cycle ---
  - entity: SleepStudy
    initial_state: ORDERED
    terminal_states: [DIAGNOSTIC_VALID]
    transitions:
      - from: ORDERED
        to: DIAGNOSTIC_VALID
        trigger: "POST /sleep-studies/{study_id}/results"
        actor: SleepPhysician
        preconditions:
          - "acting X-User-ID equals SleepStudy.ordering_physician_id"
          - "calculation study_diagnostic_validity returns true for the posted recording"
        side_effects:
          - "severity_index and severity_band are computed by calculation severity_index / severity_band"
      - from: ORDERED
        to: NON_DIAGNOSTIC
        trigger: "POST /sleep-studies/{study_id}/results"
        actor: SleepPhysician
        preconditions:
          - "acting X-User-ID equals SleepStudy.ordering_physician_id"
          - "calculation study_diagnostic_validity returns false for the posted recording"
        side_effects:
          - "severity_index is still computed and stored, but severity_band is set to null and the study may not ground a Referral"
      - from: NON_DIAGNOSTIC
        to: ORDERED
        trigger: "POST /sleep-studies/{study_id}/reorder"
        actor: SleepPhysician
        preconditions:
          - "SleepStudy.status == NON_DIAGNOSTIC"
        side_effects:
          - "repeat_count increments by 1"
          - "performed_on, respiratory_events, recording_minutes, sleep_minutes, artifact_pct, attended, severity_index and severity_band are cleared to null"
          - "modality may be switched from HSAT to PSG on the same row"
        note: "The A->B->A loop that makes this machine cyclic: a non-diagnostic HSAT can be re-recorded, or escalated to an attended PSG, without a new study row."

  # --- 3. WrittenOrder: linear with a supersede edge ---
  - entity: WrittenOrder
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /written-orders/{written_order_id}/sign"
        actor: SleepPhysician
        preconditions:
          - "acting X-User-ID equals WrittenOrder.ordering_physician_id"
          - "signed_on >= WrittenOrder.order_date"
          - "Patient.records_frozen is false"
        side_effects:
          - "signed_on is persisted"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system, on POST /written-orders creating a newer order for the same patient_id and item_hcpcs"
        actor: system
        preconditions:
          - "an older WrittenOrder exists for the same patient_id and item_hcpcs in status DRAFT"
        side_effects:
          - "Patient.version increments by 1 (the OCC parent of written-order creation)"
      - from: SIGNED
        to: SUPERSEDED
        trigger: "system, on POST /written-orders creating a newer order for the same patient_id and item_hcpcs"
        actor: system
        preconditions:
          - "an older WrittenOrder exists for the same patient_id and item_hcpcs in status SIGNED"
          - "no Appliance references the older order as written_order_id"
        side_effects:
          - "Patient.version increments by 1"

  # --- 4. PriorAuth: cyclic denial/appeal rounds with a capped attempt count ---
  - entity: PriorAuth
    initial_state: SUBMITTED
    terminal_states: [DENIED_FINAL, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /prior-auths/{prior_auth_id}/decision with decision=APPROVED"
        actor: PlatformAdmin
        preconditions:
          - "PriorAuth.status == SUBMITTED"
        side_effects:
          - "decided_on is set to the supplied date or to the clock date"
          - "approval_valid_until is set to decided_on plus PA_VALIDITY_DAYS"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /prior-auths/{prior_auth_id}/decision with decision=DENIED"
        actor: PlatformAdmin
        preconditions:
          - "PriorAuth.status == SUBMITTED"
          - "denial_reason is supplied"
        side_effects:
          - "decided_on is set"
      - from: DENIED
        to: APPEALED
        trigger: "POST /prior-auths/{prior_auth_id}/appeal"
        actor: BillingSpecialist
        preconditions:
          - "PriorAuth.appeal_attempts < Payer.appeal_limit of the PriorAuth's payer"
          - "Patient.records_frozen is false"
        side_effects:
          - "appeal_attempts increments by 1"
      - from: APPEALED
        to: APPROVED
        trigger: "POST /prior-auths/{prior_auth_id}/decision with decision=APPROVED"
        actor: PlatformAdmin
        preconditions:
          - "PriorAuth.status == APPEALED"
        side_effects:
          - "decided_on is refreshed; approval_valid_until is recomputed from the new decided_on"
      - from: APPEALED
        to: DENIED
        trigger: "POST /prior-auths/{prior_auth_id}/decision with decision=DENIED"
        actor: PlatformAdmin
        preconditions:
          - "PriorAuth.status == APPEALED"
          - "PriorAuth.appeal_attempts < Payer.appeal_limit"
        side_effects:
          - "decided_on is refreshed"
        note: "The DENIED -> APPEALED -> DENIED loop is the cycle; it can run until appeal_attempts reaches Payer.appeal_limit."
      - from: APPEALED
        to: DENIED_FINAL
        trigger: "POST /prior-auths/{prior_auth_id}/decision with decision=DENIED"
        actor: PlatformAdmin
        preconditions:
          - "PriorAuth.appeal_attempts == Payer.appeal_limit"
        side_effects:
          - "no further appeal is accepted; a later POST /prior-auths/{id}/appeal returns ERR_APPEAL_LIMIT_REACHED (409)"
      - from: APPROVED
        to: EXPIRED
        trigger: "system, evaluated inside POST /claims/{claim_id}/submit (mutate-then-reject rung, priority 29)"
        actor: system
        preconditions:
          - "clock date > PriorAuth.approval_valid_until"
        side_effects:
          - "PriorAuth.status is persisted as EXPIRED and PriorAuth.version increments by 1, then the claim submission is rejected with ERR_PRIOR_AUTH_REQUIRED (422)"
        note: "When the PriorAuth is ALREADY EXPIRED at submission time, rung 29 raises the same ERR_PRIOR_AUTH_REQUIRED but performs no write and does not bump PriorAuth.version — the PriorAuth is not the path resource, so no earlier state gate pre-empts this rung."

  # --- 5. LabOrder: fabrication pipeline with a remake cycle ---
  - entity: LabOrder
    initial_state: RECORDS_CAPTURED
    terminal_states: [RECEIVED_ACCEPTED, CANCELLED]
    transitions:
      - from: RECORDS_CAPTURED
        to: IN_FABRICATION
        trigger: "POST /lab-orders/{lab_order_id}/submit"
        actor: Dentist
        preconditions:
          - "Referral.status == ACCEPTED"
          - "Patient.records_frozen is false"
        side_effects:
          - "submitted_on is set to the clock date; promised_ship_date is set to submitted_on plus promised_turnaround_days"
      - from: IN_FABRICATION
        to: SHIPPED
        trigger: "POST /lab-orders/{lab_order_id}/ship"
        actor: LabTechnician
        preconditions:
          - "acting X-User-ID equals LabOrder.lab_provider_id"
        side_effects:
          - "shipped_on is persisted; turnaround_on_time is set to (shipped_on <= promised_ship_date)"
      - from: SHIPPED
        to: RECEIVED_ACCEPTED
        trigger: "POST /lab-orders/{lab_order_id}/receive with fit_outcome=ACCEPTED"
        actor: Dentist
        preconditions:
          - "acting X-User-ID equals the Referral's treating_dentist_id"
        side_effects:
          - "the lab order becomes eligible to found an Appliance via POST /appliances"
      - from: SHIPPED
        to: REMAKE_REQUIRED
        trigger: "POST /lab-orders/{lab_order_id}/receive with fit_outcome=REMAKE_REQUIRED"
        actor: Dentist
        preconditions:
          - "acting X-User-ID equals the Referral's treating_dentist_id"
        side_effects:
          - "shipped_on and turnaround_on_time are cleared to null"
      - from: REMAKE_REQUIRED
        to: IN_FABRICATION
        trigger: "POST /lab-orders/{lab_order_id}/submit"
        actor: Dentist
        preconditions:
          - "Referral.status == ACCEPTED"
        side_effects:
          - "remake_count increments by 1"
          - "submitted_on is reset to the clock date; promised_ship_date is recomputed"
        note: "SHIPPED -> REMAKE_REQUIRED -> IN_FABRICATION -> SHIPPED is the cycle."
      - from: RECORDS_CAPTURED
        to: CANCELLED
        trigger: "system, cascade from Referral entering EXPIRED at ladder rung 18"
        actor: system
        preconditions:
          - "LabOrder.status == RECORDS_CAPTURED"
        side_effects:
          - "no appliance may be founded on a CANCELLED lab order"

  # --- 6. Appliance, axis A of three: therapy lifecycle (branching + revert) ---
  - entity: Appliance
    state_field: lifecycle_status
    initial_state: FABRICATED
    terminal_states: [RETIRED, REPLACED]
    transitions:
      - from: FABRICATED
        to: DELIVERED
        trigger: "POST /appliances/{appliance_id}/deliver"
        actor: Dentist
        preconditions:
          - "a WrittenOrder in status SIGNED exists for this patient with item_hcpcs == Appliance.hcpcs_code"
          - "WrittenOrder.order_date <= delivered_on"
          - "WrittenOrder.f2f_age_days <= F2F_LOOKBACK_DAYS"
          - "Appliance.device_hold_status == NONE"
        side_effects:
          - "starting_advancement_mm and current_advancement_mm are computed by calculation starting_advancement_mm"
          - "warranty_end_date is set to delivered_on plus WARRANTY_MONTHS"
          - "useful_lifetime_end_date is set to delivered_on plus the medical Payer.useful_lifetime_months"
          - "written_order_id is persisted on the appliance"
      - from: DELIVERED
        to: IN_TITRATION
        trigger: "system, on the first POST /titration-visits/{visit_id}/apply that resolves to APPLIED or REDUCED"
        actor: system
        preconditions:
          - "Appliance.applied_visit_count transitions from 0 to 1"
        side_effects:
          - "current_advancement_mm is updated by calculation cumulative_advancement"
      - from: IN_TITRATION
        to: TITRATION_SUSPENDED
        trigger: "system, cascade level 3 of POST /appliance-lots/{lot_id}/recall"
        actor: system
        preconditions:
          - "the appliance has no remaining TitrationVisit in status SCHEDULED or HELD after the level-2 void"
        side_effects:
          - "CASCADE L4: every EfficacyReport with appliance_id == this appliance and status in {DRAFT, SUBMITTED, DISPUTED} transitions to WITHDRAWN"
      - from: TITRATION_SUSPENDED
        to: IN_TITRATION
        trigger: "POST /appliances/{appliance_id}/recall-remediate"
        actor: Dentist
        preconditions:
          - "Appliance.device_hold_status == RECALL_HOLD"
        side_effects:
          - "device_hold_status returns to NONE on the same call (see axis B)"
        note: "IN_TITRATION -> TITRATION_SUSPENDED -> IN_TITRATION is a revert loop on the lifecycle axis."
      - from: IN_TITRATION
        to: TITRATION_PLATEAU
        trigger: "POST /appliances/{appliance_id}/plateau"
        actor: Dentist
        preconditions:
          - "Appliance.applied_visit_count >= PLATEAU_MIN_VISITS"
          - "Appliance.device_hold_status == NONE"
        side_effects:
          - "plateau_declared_on is set to the clock date"
          - "every TitrationVisit on this appliance still in SCHEDULED or HELD transitions to SUPERSEDED"
      - from: TITRATION_PLATEAU
        to: EFFICACY_PENDING
        trigger: "POST /efficacy-reports/{report_id}/submit"
        actor: Dentist
        preconditions:
          - "the report's appliance_id == this appliance"
        side_effects:
          - "Provider.open_efficacy_loop_count is recomputed for the referring physician"
      - from: EFFICACY_PENDING
        to: ACTIVE_THERAPY
        trigger: "system, cascade level 2 of POST /efficacy-reports/{report_id}/physician-response with decision=SIGNED"
        actor: system
        preconditions:
          - "the Referral has just entered CLOSED"
        side_effects:
          - "CASCADE L3: recall_status moves NOT_SCHEDULED -> NOT_DUE and next_recall_due_on is set to the clock date plus FIRST_RECALL_DAYS (see axis C)"
      - from: EFFICACY_PENDING
        to: IN_TITRATION
        trigger: "system, on POST /efficacy-reports/{report_id}/physician-response with decision=DISPUTED"
        actor: system
        preconditions:
          - "the disputed EfficacyReport.outcome == PARTIAL"
        side_effects:
          - "plateau_declared_on is cleared to null so the dentist must re-declare plateau after further titration"
        note: "A DISPUTED report whose outcome is COMPLETE or FAILED leaves the appliance in EFFICACY_PENDING."
      - from: ACTIVE_THERAPY
        to: REPLACED
        trigger: "system, on POST /appliances that supplies replaces_appliance_id == this appliance"
        actor: system
        preconditions:
          - "the successor appliance row has been created"
        side_effects:
          - "recall_status is reset to NOT_SCHEDULED and next_recall_due_on is cleared"
      - from: ACTIVE_THERAPY
        to: RETIRED
        trigger: "system, cascade level 1 of POST /repair-orders with reason=LOSS"
        actor: system
        preconditions:
          - "the RepairOrder has been auto-closed as CLOSED_NOT_COVERED"
        side_effects:
          - "recall_status is reset to NOT_SCHEDULED and next_recall_due_on is cleared"
          - "CASCADE L3: every Claim with appliance_id == this appliance, claim_type == CONTINUED_USE and status == DRAFT transitions to VOIDED"
      - from: IN_TITRATION
        to: RETIRED
        trigger: "system, cascade level 1 of POST /repair-orders with reason=LOSS"
        actor: system
        preconditions:
          - "the RepairOrder has been auto-closed as CLOSED_NOT_COVERED"
        side_effects:
          - "identical to the ACTIVE_THERAPY edge; a device lost mid-titration is retired just the same, and any SCHEDULED or HELD TitrationVisit on it transitions to SUPERSEDED"
        note: "Declared so that RETIRED — and therefore the replacement path guarded by rung 20 — is reachable without first driving the whole efficacy loop to ACTIVE_THERAPY."

  # --- 7. Appliance, axis B of three: device safety hold (cyclic) ---
  - entity: Appliance
    state_field: device_hold_status
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: RECALL_HOLD
        trigger: "system, cascade level 1 of POST /appliance-lots/{lot_id}/recall"
        actor: system
        preconditions:
          - "Appliance.lot_id == the recalled lot"
          - "Appliance.lifecycle_status is not RETIRED and not REPLACED"
        side_effects:
          - "CASCADE L2: every TitrationVisit with appliance_id == this appliance and status in {SCHEDULED, HELD} transitions to VOIDED_BY_HOLD"
      - from: RECALL_HOLD
        to: NONE
        trigger: "POST /appliances/{appliance_id}/recall-remediate"
        actor: Dentist
        preconditions:
          - "the appliance's ApplianceLot.status == RECALL_ISSUED"
        side_effects:
          - "ApplianceLot.remediated_count increments by 1 and pending_remediation_count decrements by 1"
          - "when pending_remediation_count reaches 0 the lot transitions RECALL_ISSUED -> REMEDIATION_COMPLETE"
        note: "NONE -> RECALL_HOLD -> NONE is the cycle; a second lot recall can drive the same device around it again."

  # --- 8. Appliance, axis C of three: patient recall cadence (cyclic) ---
  - entity: Appliance
    state_field: recall_status
    initial_state: NOT_SCHEDULED
    terminal_states: []
    transitions:
      - from: NOT_SCHEDULED
        to: NOT_DUE
        trigger: "system, cascade level 3 of POST /efficacy-reports/{report_id}/physician-response with decision=SIGNED"
        actor: system
        preconditions:
          - "lifecycle_status has just become ACTIVE_THERAPY"
        side_effects:
          - "next_recall_due_on is set to the clock date plus FIRST_RECALL_DAYS; recall_cycle_index stays 0"
      - from: NOT_DUE
        to: DUE
        trigger: "system, re-evaluated on every POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "clock date >= next_recall_due_on"
          - "clock date < next_recall_due_on plus RECALL_GRACE_DAYS"
        side_effects: []
      - from: DUE
        to: LAPSED
        trigger: "system, re-evaluated on every POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "clock date >= next_recall_due_on plus RECALL_GRACE_DAYS"
        side_effects:
          - "a Claim of claim_type CONTINUED_USE on this appliance can no longer be submitted; rung 33 rejects it"
      - from: NOT_DUE
        to: LAPSED
        trigger: "system, re-evaluated on every POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "clock date >= next_recall_due_on plus RECALL_GRACE_DAYS"
        side_effects: []
        note: "A single clock jump past the grace boundary skips DUE entirely; both edges are evaluated in the same sweep and the LAPSED edge wins."
      - from: DUE
        to: NOT_DUE
        trigger: "POST /appliances/{appliance_id}/recall-check"
        actor: Dentist
        preconditions:
          - "Appliance.lifecycle_status == ACTIVE_THERAPY"
        side_effects:
          - "recall_cycle_index increments by 1; next_recall_due_on advances by SUBSEQUENT_RECALL_DAYS from the completed due date per calculation recall_schedule"
      - from: LAPSED
        to: NOT_DUE
        trigger: "POST /appliances/{appliance_id}/recall-check"
        actor: Dentist
        preconditions:
          - "Appliance.lifecycle_status == ACTIVE_THERAPY"
        side_effects:
          - "recall_cycle_index increments by 1; next_recall_due_on is recomputed from the check date, not from the missed due date"
        note: "NOT_DUE -> DUE -> NOT_DUE and NOT_DUE -> DUE -> LAPSED -> NOT_DUE are the two cycles on this axis."

  # --- 9. TitrationVisit: branching outcome with a HELD self-loop ---
  - entity: TitrationVisit
    initial_state: SCHEDULED
    terminal_states: [APPLIED, REDUCED, SUPERSEDED, VOIDED_BY_HOLD]
    transitions:
      - from: SCHEDULED
        to: APPLIED
        trigger: "POST /titration-visits/{visit_id}/apply with side_effect_severity in {NONE, MILD}"
        actor: Dentist
        preconditions:
          - "Appliance.device_hold_status == NONE"
          - "Appliance.lifecycle_status in {DELIVERED, IN_TITRATION}"
          - "days since the appliance's most recent APPLIED or REDUCED visit >= MIN_TITRATION_INTERVAL_DAYS, or this is the first such visit"
          - "current_advancement_mm plus the bounded increment <= Appliance.max_protrusive_mm"
        side_effects:
          - "applied_increment_mm is set by calculation titration_applied_increment; applied_on is set to the clock date"
          - "Appliance.current_advancement_mm and applied_visit_count are recomputed"
          - "the appliance transitions DELIVERED -> IN_TITRATION on the first applied visit"
      - from: SCHEDULED
        to: REDUCED
        trigger: "POST /titration-visits/{visit_id}/apply with side_effect_severity=SEVERE"
        actor: Dentist
        preconditions:
          - "Appliance.device_hold_status == NONE"
          - "Appliance.lifecycle_status in {DELIVERED, IN_TITRATION}"
          - "days since the appliance's most recent APPLIED or REDUCED visit >= MIN_TITRATION_INTERVAL_DAYS, or this is the first such visit"
        side_effects:
          - "applied_increment_mm is set to minus SEVERE_SIDE_EFFECT_REDUCTION_MM, floored so current_advancement_mm never drops below 0"
          - "Appliance.current_advancement_mm and applied_visit_count are recomputed"
        note: "The protrusion-ceiling precondition is not evaluated on this edge; a reduction can never breach the ceiling."
      - from: SCHEDULED
        to: HELD
        trigger: "POST /titration-visits/{visit_id}/apply with side_effect_severity=MODERATE"
        actor: Dentist
        preconditions:
          - "Appliance.device_hold_status == NONE"
          - "Appliance.lifecycle_status in {DELIVERED, IN_TITRATION}"
        side_effects:
          - "applied_increment_mm is set to 0.00 and applied_on stays null, so the visit does not consume the titration interval"
          - "scheduled_for is pushed forward by MIN_TITRATION_INTERVAL_DAYS"
          - "applied_visit_count is NOT incremented"
      - from: HELD
        to: APPLIED
        trigger: "POST /titration-visits/{visit_id}/apply with side_effect_severity in {NONE, MILD}"
        actor: Dentist
        preconditions:
          - "Appliance.device_hold_status == NONE"
          - "days since the appliance's most recent APPLIED or REDUCED visit >= MIN_TITRATION_INTERVAL_DAYS, or there is no such visit"
          - "current_advancement_mm plus the bounded increment <= Appliance.max_protrusive_mm"
        side_effects:
          - "same as SCHEDULED -> APPLIED"
      - from: HELD
        to: REDUCED
        trigger: "POST /titration-visits/{visit_id}/apply with side_effect_severity=SEVERE"
        actor: Dentist
        preconditions:
          - "Appliance.device_hold_status == NONE"
        side_effects:
          - "same as SCHEDULED -> REDUCED"
      - from: HELD
        to: HELD
        trigger: "POST /titration-visits/{visit_id}/apply with side_effect_severity=MODERATE"
        actor: Dentist
        preconditions:
          - "Appliance.device_hold_status == NONE"
        side_effects:
          - "scheduled_for is pushed forward by a further MIN_TITRATION_INTERVAL_DAYS"
        note: "HELD -> HELD is the cycle: joint symptoms can defer the same visit indefinitely without ever consuming range."
      - from: SCHEDULED
        to: SUPERSEDED
        trigger: "system, on POST /titration-visits creating a newer visit on the same appliance, and on POST /appliances/{appliance_id}/plateau"
        actor: system
        preconditions:
          - "another TitrationVisit on the same appliance is in status SCHEDULED or HELD"
        side_effects:
          - "Appliance.version increments by 1 (the OCC parent of visit creation)"
      - from: HELD
        to: SUPERSEDED
        trigger: "system, on POST /titration-visits creating a newer visit on the same appliance, and on POST /appliances/{appliance_id}/plateau"
        actor: system
        preconditions:
          - "another TitrationVisit on the same appliance is in status SCHEDULED or HELD"
        side_effects:
          - "Appliance.version increments by 1"
      - from: SCHEDULED
        to: VOIDED_BY_HOLD
        trigger: "system, cascade level 2 of POST /appliance-lots/{lot_id}/recall"
        actor: system
        preconditions:
          - "the appliance has just entered device_hold_status RECALL_HOLD"
        side_effects:
          - "CASCADE L3: when no SCHEDULED or HELD visit remains and the appliance is IN_TITRATION, it transitions to TITRATION_SUSPENDED"
      - from: HELD
        to: VOIDED_BY_HOLD
        trigger: "system, cascade level 2 of POST /appliance-lots/{lot_id}/recall"
        actor: system
        preconditions:
          - "the appliance has just entered device_hold_status RECALL_HOLD"
        side_effects:
          - "CASCADE L3: when no SCHEDULED or HELD visit remains and the appliance is IN_TITRATION, it transitions to TITRATION_SUSPENDED"

  # --- 10. EfficacyReport: submit / sign / dispute with a revision cycle ---
  - entity: EfficacyReport
    initial_state: DRAFT
    terminal_states: [SIGNED, WITHDRAWN, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /efficacy-reports/{report_id}/submit"
        actor: Dentist
        preconditions:
          - "acting X-User-ID equals the Referral's treating_dentist_id"
          - "Appliance.lifecycle_status == TITRATION_PLATEAU"
          - "the efficacy SleepStudy is DIAGNOSTIC_VALID"
          - "Patient.records_frozen is false"
        side_effects:
          - "submitted_on is set to the clock date"
          - "the appliance transitions TITRATION_PLATEAU -> EFFICACY_PENDING"
          - "Provider.open_efficacy_loop_count is recomputed for the referring physician"
      - from: SUBMITTED
        to: SIGNED
        trigger: "POST /efficacy-reports/{report_id}/physician-response with decision=SIGNED"
        actor: SleepPhysician
        preconditions:
          - "acting X-User-ID equals the Referral's referring_physician_id"
          - "acting X-User-ID does not equal the Referral's treating_dentist_id"
        side_effects:
          - "physician_decision_on is set to the clock date"
          - "CASCADE L1: the Referral transitions ACCEPTED -> CLOSED and loop_status becomes CLOSED"
          - "Provider.open_efficacy_loop_count is recomputed"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /efficacy-reports/{report_id}/physician-response with decision=DISPUTED"
        actor: SleepPhysician
        preconditions:
          - "acting X-User-ID equals the Referral's referring_physician_id"
          - "dispute_reason is supplied"
        side_effects:
          - "physician_decision_on is set; the Referral's loop_status stays OPEN"
          - "when outcome == PARTIAL the appliance transitions EFFICACY_PENDING -> IN_TITRATION and plateau_declared_on is cleared"
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /efficacy-reports/{report_id}/submit"
        actor: Dentist
        preconditions:
          - "acting X-User-ID equals the Referral's treating_dentist_id"
        side_effects:
          - "revision_count increments by 1; submitted_on is refreshed to the clock date"
        note: "SUBMITTED -> DISPUTED -> SUBMITTED is the revision cycle."
      - from: DISPUTED
        to: SUPERSEDED
        trigger: "system, on POST /efficacy-reports creating a newer report for the same referral"
        actor: system
        preconditions:
          - "an older EfficacyReport on the same referral is in status DISPUTED"
        side_effects:
          - "Referral.version increments by 1 (the OCC parent of report creation)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system, cascade level 4 of POST /appliance-lots/{lot_id}/recall"
        actor: system
        preconditions:
          - "the report's appliance has just entered lifecycle_status TITRATION_SUSPENDED"
        side_effects:
          - "the Referral's loop_status returns to OPEN"
          - "CASCADE L5: every Claim on that appliance with claim_type CONTINUED_USE and status DRAFT transitions to VOIDED"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "system, cascade level 4 of POST /appliance-lots/{lot_id}/recall"
        actor: system
        preconditions:
          - "the report's appliance has just entered lifecycle_status TITRATION_SUSPENDED"
        side_effects:
          - "the Referral's loop_status returns to OPEN; Provider.open_efficacy_loop_count is recomputed"
          - "CASCADE L5: every Claim on that appliance with claim_type CONTINUED_USE and status DRAFT transitions to VOIDED"
      - from: DISPUTED
        to: WITHDRAWN
        trigger: "system, cascade level 4 of POST /appliance-lots/{lot_id}/recall"
        actor: system
        preconditions:
          - "the report's appliance has just entered lifecycle_status TITRATION_SUSPENDED"
        side_effects:
          - "the Referral's loop_status returns to OPEN; Provider.open_efficacy_loop_count is recomputed"
          - "CASCADE L5: every Claim on that appliance with claim_type CONTINUED_USE and status DRAFT transitions to VOIDED"

  # --- 11. Claim: adjudication with a capped denial/appeal cycle ---
  - entity: Claim
    initial_state: DRAFT
    terminal_states: [PAID, DENIED_FINAL, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /claims/{claim_id}/submit"
        actor: BillingSpecialist
        preconditions:
          - "the whole DME documentation ladder (rungs 25 through 33) passes"
          - "Patient.records_frozen is false"
          - "Appliance.device_hold_status == NONE"
        side_effects:
          - "allowed_cents and adjustment_cents are computed by calculation claim_allowed_amount"
      - from: SUBMITTED
        to: PAID
        trigger: "POST /claims/{claim_id}/adjudicate with outcome=PAID"
        actor: PlatformAdmin
        preconditions:
          - "Claim.status == SUBMITTED"
        side_effects:
          - "deductible_applied_cents, coinsurance_cents, patient_responsibility_cents and payer_paid_cents are computed by calculation claim_patient_responsibility"
          - "Patient.deductible_remaining_cents decreases by deductible_applied_cents"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /claims/{claim_id}/adjudicate with outcome=DENIED"
        actor: PlatformAdmin
        preconditions:
          - "Claim.status == SUBMITTED"
        side_effects:
          - "denial_error_id is persisted; no money fields are written"
      - from: DENIED
        to: APPEALED
        trigger: "POST /claims/{claim_id}/appeal"
        actor: BillingSpecialist
        preconditions:
          - "Claim.appeal_attempts < Payer.appeal_limit"
          - "Patient.records_frozen is false"
        side_effects:
          - "appeal_attempts increments by 1"
      - from: APPEALED
        to: PAID
        trigger: "POST /claims/{claim_id}/adjudicate with outcome=PAID"
        actor: PlatformAdmin
        preconditions:
          - "Claim.status == APPEALED"
        side_effects:
          - "the money legs are computed exactly as on the SUBMITTED -> PAID edge, from the Patient's deductible balance at this instant"
      - from: APPEALED
        to: DENIED
        trigger: "POST /claims/{claim_id}/adjudicate with outcome=DENIED"
        actor: PlatformAdmin
        preconditions:
          - "Claim.status == APPEALED"
          - "Claim.appeal_attempts < Payer.appeal_limit"
        side_effects:
          - "denial_error_id is refreshed"
        note: "DENIED -> APPEALED -> DENIED is the cycle."
      - from: APPEALED
        to: DENIED_FINAL
        trigger: "POST /claims/{claim_id}/adjudicate with outcome=DENIED"
        actor: PlatformAdmin
        preconditions:
          - "Claim.appeal_attempts == Payer.appeal_limit"
        side_effects:
          - "a later POST /claims/{claim_id}/appeal returns ERR_APPEAL_LIMIT_REACHED (409)"
      - from: DRAFT
        to: VOIDED
        trigger: "system, cascade level 5 of POST /appliance-lots/{lot_id}/recall, and cascade level 3 of POST /repair-orders with reason=LOSS"
        actor: system
        preconditions:
          - "Claim.claim_type == CONTINUED_USE"
          - "Claim.status == DRAFT"
        side_effects:
          - "a VOIDED claim can never be submitted; a fresh claim row must be created"

  # --- 12. RepairOrder: branching at creation on the reason code ---
  - entity: RepairOrder
    initial_state: OPEN
    terminal_states: [CLOSED_REPAIRED, CLOSED_NOT_COVERED]
    transitions:
      - from: OPEN
        to: IN_LAB
        trigger: "system, immediately inside POST /repair-orders when reason is DEFECT, WEAR or ABUSE"
        actor: system
        preconditions:
          - "Appliance.lifecycle_status in {ACTIVE_THERAPY, IN_TITRATION, TITRATION_PLATEAU, EFFICACY_PENDING}"
        side_effects:
          - "in_warranty, billable, labor_units and repair_charge_cents are computed by calculation repair_billability"
          - "when loaner_appliance_id is supplied the loaner interval [reported_on, returned_on) is opened on that device"
      - from: OPEN
        to: CLOSED_NOT_COVERED
        trigger: "system, immediately inside POST /repair-orders when reason is LOSS"
        actor: system
        preconditions:
          - "Appliance.lifecycle_status in {ACTIVE_THERAPY, IN_TITRATION, TITRATION_PLATEAU, EFFICACY_PENDING}"
        side_effects:
          - "billable is set to true and repair_charge_cents to 0 — a lost device is replaced, not repaired"
          - "CASCADE L2: the Appliance transitions ACTIVE_THERAPY -> RETIRED"
      - from: IN_LAB
        to: CLOSED_REPAIRED
        trigger: "POST /repair-orders/{repair_order_id}/complete with outcome=REPAIRED"
        actor: Dentist
        preconditions:
          - "RepairOrder.status == IN_LAB"
        side_effects:
          - "returned_on is set to the clock date, which closes the loaner interval on loaner_appliance_id"
          - "resets_useful_lifetime stays false — Appliance.useful_lifetime_end_date is NOT moved by any repair"
      - from: IN_LAB
        to: CLOSED_NOT_COVERED
        trigger: "POST /repair-orders/{repair_order_id}/complete with outcome=NOT_COVERED"
        actor: Dentist
        preconditions:
          - "RepairOrder.status == IN_LAB"
        side_effects:
          - "returned_on is set; repair_charge_cents is set to 0 and no REPAIR claim may be created against this repair order"

  # --- 13. ApplianceLot: compound recall closure driven by its devices ---
  - entity: ApplianceLot
    initial_state: ACTIVE
    terminal_states: [REMEDIATION_COMPLETE]
    transitions:
      - from: ACTIVE
        to: RECALL_ISSUED
        trigger: "POST /appliance-lots/{lot_id}/recall"
        actor: PlatformAdmin
        preconditions:
          - "ApplianceLot.status == ACTIVE"
          - "notice_reference and recall_severity are supplied"
        side_effects:
          - "recall_issued_on is set to the clock date"
          - "affected_device_count, pending_remediation_count and retired_count are computed by calculation lot_remediation_progress"
          - "CASCADE L1: every Appliance with lot_id == this lot and lifecycle_status not in {RETIRED, REPLACED} moves device_hold_status NONE -> RECALL_HOLD"
      - from: RECALL_ISSUED
        to: REMEDIATION_COMPLETE
        trigger: "system, bubble-up on the POST /appliances/{appliance_id}/recall-remediate that clears the last hold"
        actor: system
        preconditions:
          - "pending_remediation_count has reached 0"
        side_effects:
          - "the lot no longer blocks fabrication of new appliances from it"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's version, three true races
# =============================================================================
concurrency_rules:
  - rule_id: titration-visit-create-stale-appliance
    parent_entity: Appliance
    write_endpoint: "POST /titration-visits"
    occ_field: "expected_appliance_version"
    description: |
      Creating a TitrationVisit against an Appliance whose version has advanced since the
      client last observed it is rejected. Visit creation legitimately supersedes any visit
      still SCHEDULED or HELD on that appliance, so a writer holding a stale view of the
      appliance would silently discard a colleague's open visit.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: written-order-create-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /written-orders"
    occ_field: "expected_patient_version"
    description: |
      Creating a WrittenOrder against a Patient whose version has advanced since the client
      last observed it is rejected. A new standard written order for the same item_hcpcs
      legitimately supersedes the prior DRAFT or SIGNED order, so a stale writer would
      invalidate an order that was just issued from a newer clinical picture.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: efficacy-report-create-stale-referral
    parent_entity: Referral
    write_endpoint: "POST /efficacy-reports"
    occ_field: "expected_referral_version"
    description: |
      Creating an EfficacyReport against a Referral whose version has advanced since the
      client last observed it is rejected. A new report legitimately supersedes a DISPUTED
      report on the same referral, so a stale writer would replace a revision the physician
      has already acted on.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table  (18 calculations; 9 carry variants)
# Every ALL_CAPS identifier below is declared with an explicit value in the
# constants: block of the calculation that owns it.
# =============================================================================
calculations:

  - name: severity_index
    trigger: "POST /sleep-studies/{study_id}/results"
    algorithm: dual_variant_ratio
    formula: |
      # The denominator is the whole difference between the two modalities.
      if modality == "HSAT":
          denominator_hours = recording_minutes / 60.0
      else:  # modality == "PSG"
          denominator_hours = sleep_minutes / 60.0
      if denominator_hours <= 0:
          reject with ERR_VALIDATION (400)
      severity_index = round_half_up(respiratory_events / denominator_hours, 1)
    input_set: "The single SleepStudy row being resulted. No other study contributes."
    constants: {}
    precision: "1 decimal place, round_half_up"
    variants:
      - name: hsat_recording_time_denominator
        when: "modality == HSAT — a home test cannot score sleep, so every monitored minute counts"
        difference: "divides respiratory_events by recording_minutes/60; sleep_minutes is ignored even when supplied"
      - name: psg_sleep_time_denominator
        when: "modality == PSG — an attended study scores true sleep time"
        difference: "divides respiratory_events by sleep_minutes/60, always a smaller denominator, so the same event count yields a HIGHER index and can land in a stricter severity band"

  - name: study_diagnostic_validity
    trigger: "POST /sleep-studies/{study_id}/results, before the status branch"
    algorithm: threshold
    formula: |
      if modality == "HSAT":
          valid = (recording_minutes >= MIN_HSAT_RECORDING_MINUTES)
                  and (artifact_pct <= MAX_HSAT_ARTIFACT_PCT)
      else:  # PSG
          valid = (sleep_minutes >= MIN_PSG_TST_MINUTES) and (attended == true)
      status = "DIAGNOSTIC_VALID" if valid else "NON_DIAGNOSTIC"
    input_set: "The single SleepStudy row being resulted."
    constants:
      MIN_HSAT_RECORDING_MINUTES: 240
      MAX_HSAT_ARTIFACT_PCT: 20
      MIN_PSG_TST_MINUTES: 180
    precision: "integer minute comparisons; artifact_pct compared at 1 decimal"
    variants:
      - name: hsat_quality_gate
        when: "modality == HSAT"
        difference: "gates on monitored duration and artifact fraction; attendance is irrelevant"
      - name: psg_quality_gate
        when: "modality == PSG"
        difference: "gates on scored sleep time and on attendance; artifact_pct is irrelevant, so a PSG with artifact_pct 90 can still be diagnostic"

  - name: severity_band
    trigger: "POST /sleep-studies/{study_id}/results, only when study_diagnostic_validity returned true"
    algorithm: threshold
    formula: |
      if   severity_index >= AHI_SEVERE_MIN:   band = "SEVERE"
      elif severity_index >= AHI_MODERATE_MIN: band = "MODERATE"
      elif severity_index >= AHI_MILD_MIN:     band = "MILD"
      else:                                    band = "NONE"
      # A NON_DIAGNOSTIC study stores severity_index but leaves severity_band null.
    input_set: "The severity_index just computed on this study row."
    constants:
      AHI_MILD_MIN: 5.0
      AHI_MODERATE_MIN: 15.0
      AHI_SEVERE_MIN: 30.0
    precision: "comparisons at 1 decimal; the boundary is inclusive on the lower edge (>= )"

  - name: diagnosis_currency
    trigger: "POST /referrals (sets diagnosis_valid_until) and re-evaluated at ladder rung 18 on every write that consumes a Referral"
    algorithm: threshold
    formula: |
      window_days = HSAT_VALIDITY_DAYS if study.modality == "HSAT" else PSG_VALIDITY_DAYS
      diagnosis_valid_until = study.performed_on + window_days days
      current = (clock_date <= diagnosis_valid_until)
    input_set: "The Referral's diagnostic SleepStudy row."
    constants:
      HSAT_VALIDITY_DAYS: 365
      PSG_VALIDITY_DAYS: 1095
    precision: "whole calendar days; the boundary date itself is still valid"
    variants:
      - name: hsat_one_year
        when: "the grounding study is an HSAT"
        difference: "expires 365 days after performed_on"
      - name: psg_three_year
        when: "the grounding study is an attended PSG"
        difference: "expires 1095 days after performed_on, so the identical referral date is current under PSG and expired under HSAT"

  - name: oat_medical_necessity_basis
    trigger: "POST /referrals"
    algorithm: dual_variant_eligibility
    formula: |
      band = diagnostic_study.severity_band
      if band == "NONE" or band is null:
          reject with ERR_DIAGNOSIS_REQUIRED (422)      # nothing to treat
      if band == "SEVERE":
          documented = cpap_history in {"FAILURE", "INTOLERANCE", "REFUSAL"}
          trial_ok   = (cpap_history == "REFUSAL")
                       or (cpap_nights_used >= MIN_CPAP_TRIAL_NIGHTS)
          fresh      = (cpap_documented_on is not null)
                       and (clock_date - cpap_documented_on <= CPAP_LOOKBACK_DAYS)
          if not (documented and trial_ok and fresh):
              reject with ERR_CPAP_TRIAL_REQUIRED (422)
          eligibility_basis = "CPAP_INTOLERANT_SEVERE"
      elif band == "MODERATE":
          eligibility_basis = "FIRST_LINE_MILD_MODERATE"   # no extra documentation
      else:  # band == "MILD"
          if not (patient.epworth_score >= MIN_SYMPTOM_SCORE or cpap_history != "NONE"):
              reject with ERR_CPAP_TRIAL_REQUIRED (422)
          eligibility_basis = "FIRST_LINE_MILD_MODERATE"
    input_set: "The diagnostic SleepStudy's severity_band, the Referral's CPAP fields and the Patient's epworth_score."
    constants:
      MIN_CPAP_TRIAL_NIGHTS: 30
      CPAP_LOOKBACK_DAYS: 730
      MIN_SYMPTOM_SCORE: 10
    precision: "integer night counts and whole calendar days"
    variants:
      - name: severe_requires_pap_failure
        when: "severity_band == SEVERE"
        difference: "oral appliance therapy is second-line: a documented FAILURE/INTOLERANCE with at least MIN_CPAP_TRIAL_NIGHTS nights, or an outright REFUSAL, dated within CPAP_LOOKBACK_DAYS, is mandatory"
      - name: mild_moderate_first_line
        when: "severity_band in {MILD, MODERATE}"
        difference: "no CPAP history is required at all for MODERATE; MILD needs either epworth_score >= MIN_SYMPTOM_SCORE or any non-NONE cpap_history. The identical referral payload is admissible under MODERATE and rejected under SEVERE."

  - name: starting_advancement_mm
    trigger: "POST /appliances/{appliance_id}/deliver"
    algorithm: dual_variant_ratio
    formula: |
      if appliance_kind == "CUSTOM_FABRICATED":
          raw = START_ADVANCEMENT_PCT * max_protrusive_mm
      else:  # PREFABRICATED
          raw = min(PREFAB_START_MM, PREFAB_START_PCT * max_protrusive_mm)
      # Rounding order is pinned: scale to the mechanical grain FIRST, then round once.
      starting_advancement_mm = round_half_up(raw / MM_INCREMENT) * MM_INCREMENT
      current_advancement_mm  = starting_advancement_mm
    input_set: "The Appliance's own appliance_kind and max_protrusive_mm, both copied from its LabOrder."
    constants:
      START_ADVANCEMENT_PCT: 0.60
      PREFAB_START_MM: 4.00
      PREFAB_START_PCT: 0.50
      MM_INCREMENT: 0.25
    precision: "2 decimal places; every stored advancement is an exact multiple of MM_INCREMENT"
    variants:
      - name: custom_percent_of_range
        when: "appliance_kind == CUSTOM_FABRICATED"
        difference: "60% of the measured protrusive range, snapped to the 0.25 mm grain — max_protrusive_mm 8.00 yields 4.75 (4.80 / 0.25 = 19.2 -> 19)"
      - name: prefab_capped_start
        when: "appliance_kind == PREFABRICATED"
        difference: "the smaller of a fixed 4.00 mm and half the range — max_protrusive_mm 8.00 yields 4.00, a different starting point from the custom arm on identical records"

  - name: titration_applied_increment
    trigger: "POST /titration-visits/{visit_id}/apply"
    algorithm: constraint_propagation
    formula: |
      # Step 1 — cap the request at the per-visit ceiling (2 inputs).
      bounded = min(requested_increment_mm, MAX_INCREMENT_PER_VISIT_MM)
      # Step 2 — branch on the chairside side-effect report (3rd input, entity state).
      if side_effect_severity in {"NONE", "MILD"}:
          if appliance.current_advancement_mm + bounded > appliance.max_protrusive_mm:
              reject with ERR_PROTRUSION_LIMIT_EXCEEDED (422)   # hard ceiling, never a silent clamp
          applied_increment_mm = bounded
          resulting_status = "APPLIED"
      elif side_effect_severity == "MODERATE":
          applied_increment_mm = 0.00
          resulting_status = "HELD"
      else:  # "SEVERE"
          applied_increment_mm = -1 * min(SEVERE_SIDE_EFFECT_REDUCTION_MM,
                                          appliance.current_advancement_mm)
          resulting_status = "REDUCED"
    input_set: "The visit's requested_increment_mm and side_effect_severity, plus the Appliance's current_advancement_mm and max_protrusive_mm."
    constants:
      MAX_INCREMENT_PER_VISIT_MM: 1.00
      SEVERE_SIDE_EFFECT_REDUCTION_MM: 0.50
      MIN_TITRATION_INTERVAL_DAYS: 14
    precision: "2 decimal places; results are exact multiples of 0.25 mm"

  - name: cumulative_advancement
    trigger: "Recomputed on every TitrationVisit transition to APPLIED or REDUCED"
    algorithm: aggregation
    formula: |
      current_advancement_mm = appliance.starting_advancement_mm
                             + sum(v.applied_increment_mm
                                   for v in TitrationVisit
                                   where v.appliance_id == appliance.id
                                     and v.status in {"APPLIED", "REDUCED"})
      # visits ordered by created_at ASC; HELD, SCHEDULED, SUPERSEDED and
      # VOIDED_BY_HOLD rows contribute exactly 0.00
      applied_visit_count = count of the same filtered set
    input_set: "All TitrationVisit rows on the appliance whose status is APPLIED or REDUCED, ordered by created_at ASC."
    constants: {}
    precision: "2 decimal places"
    invariant: |
      CONSERVATION 1 (protrusive range): at every observable instant,
        appliance.current_advancement_mm
          == appliance.starting_advancement_mm
             + SUM(TitrationVisit.applied_increment_mm WHERE status IN {APPLIED, REDUCED})
      and 0.00 <= appliance.current_advancement_mm <= appliance.max_protrusive_mm.
      A HELD visit followed by its later APPLIED resolution must leave the sum unchanged
      by the HELD leg alone.

  - name: plateau_eligibility
    trigger: "POST /appliances/{appliance_id}/plateau"
    algorithm: threshold
    formula: |
      eligible = (appliance.applied_visit_count >= PLATEAU_MIN_VISITS)
      if not eligible:
          reject with ERR_PLATEAU_REQUIRED (422)
    input_set: "Appliance.applied_visit_count, i.e. TitrationVisit rows in APPLIED or REDUCED."
    constants:
      PLATEAU_MIN_VISITS: 3
    precision: "integer count; the boundary is inclusive (3 applied visits is enough, 2 is not)"

  - name: efficacy_outcome
    trigger: "POST /efficacy-reports"
    algorithm: dual_variant_threshold
    formula: |
      baseline_index = referral.diagnostic_study.severity_index
      residual_index = efficacy_study.severity_index
      pct_reduction  = round_half_up((baseline_index - residual_index) / baseline_index, 4)
      meets_absolute_target = (residual_index <= payer.residual_ahi_target)
      meets_relative_target = (pct_reduction >= payer.pct_reduction_target)
                              and (residual_index < PARTIAL_AHI_CEILING)
      if   meets_absolute_target and meets_relative_target: outcome = "COMPLETE"
      elif meets_absolute_target or  meets_relative_target: outcome = "PARTIAL"
      else:                                                 outcome = "FAILED"
    input_set: "The Referral's diagnostic study and the report's efficacy study; the payer is the Patient's medical payer."
    constants:
      PARTIAL_AHI_CEILING: 10.0
    precision: "pct_reduction to 4 decimals, round_half_up; index comparisons at 1 decimal"
    variants:
      - name: absolute_residual_criterion
        when: "judged on residual_index alone"
        difference: "succeeds only when residual_index <= Payer.residual_ahi_target (5.0 by default), regardless of how far the patient came"
      - name: relative_reduction_criterion
        when: "judged on the drop from baseline"
        difference: "succeeds when pct_reduction >= Payer.pct_reduction_target AND residual_index < PARTIAL_AHI_CEILING; baseline 40.0 with residual 8.0 passes this and fails the absolute one, so the same re-test yields PARTIAL rather than COMPLETE or FAILED"

  - name: adherence_rate
    trigger: "POST /adherence-downloads, and read back through GET /appliances/{appliance_id}/adherence-summary"
    algorithm: dual_variant_ratio
    formula: |
      # nights_at_or_above_min_hours counts nights whose wear reached ADHERENCE_MIN_HOURS.
      rate_of_window   = round_half_up(nights_at_or_above_min_hours / ADHERENCE_WINDOW_DAYS, 4)
      rate_of_recorded = null if nights_recorded == 0
                         else round_half_up(nights_at_or_above_min_hours / nights_recorded, 4)
      compliant = (rate_of_window >= ADHERENCE_MIN_NIGHTS_PCT)
      # compliant is ALWAYS evaluated on rate_of_window. rate_of_recorded is reported
      # for the clinic and never decides coverage.
    input_set: "The single AdherenceDownload row. The window must span exactly ADHERENCE_WINDOW_DAYS inclusive nights or the request is rejected with ERR_VALIDATION."
    constants:
      ADHERENCE_WINDOW_DAYS: 30
      ADHERENCE_MIN_HOURS: 4.0
      ADHERENCE_MIN_NIGHTS_PCT: 0.70
    precision: "rates to 4 decimals, round_half_up"
    variants:
      - name: payer_window_denominator
        when: "the payer decides continued coverage"
        difference: "divides by the full ADHERENCE_WINDOW_DAYS, so nights the device was never worn count against the patient — 20 qualifying nights out of 24 recorded gives 0.6667 and fails"
      - name: clinic_recorded_denominator
        when: "the clinic reports wear quality to the patient"
        difference: "divides by nights_recorded only — the same 20 of 24 gives 0.8333 and looks compliant. The two figures agree only when nights_recorded == ADHERENCE_WINDOW_DAYS."
    note: |
      Source divergence is a second, independent axis: a PATIENT_ATTESTED row and an
      OBJECTIVE_MICRORECORDER row may cover the same window with different figures.
      Ladder rung 33 reads ONLY the newest OBJECTIVE_MICRORECORDER row by created_at DESC;
      an attested row can never satisfy it, and an appliance with has_microrecorder == false
      can never produce one.

  - name: claim_allowed_amount
    trigger: "POST /claims/{claim_id}/submit"
    algorithm: waterfall_allocation
    formula: |
      # Pinned evaluation order — the fee basis must be resolved before any money field.
      # Step 1: fee basis by HCPCS code.
      if   hcpcs_code == "E0486": fee_basis = FEE_SCHEDULE_E0486_CENTS
      elif hcpcs_code == "A9270": fee_basis = FEE_SCHEDULE_A9270_CENTS   # statutorily non-covered
      else:  # "K0739", repair labour
             fee_basis = repair_order.repair_charge_cents
      # Step 2: allowed.
      allowed_cents = min(billed_cents, fee_basis)
      # Step 3: contractual write-off.
      adjustment_cents = billed_cents - allowed_cents
      # Steps 4-6 run later, at adjudication — see claim_patient_responsibility.
    input_set: "The Claim's own hcpcs_code and billed_cents, plus the linked RepairOrder for K0739."
    constants:
      FEE_SCHEDULE_E0486_CENTS: 185000
      FEE_SCHEDULE_A9270_CENTS: 0
    precision: "whole cents"
    note: "A PREFABRICATED device bills A9270, whose fee basis is 0, so allowed_cents is 0 and the entire billed amount lands in adjustment_cents. The claim is still submittable and adjudicable — coverage differs from the custom arm, it is not an error."

  - name: claim_patient_responsibility
    trigger: "POST /claims/{claim_id}/adjudicate with outcome=PAID"
    algorithm: waterfall_allocation
    formula: |
      # Pinned order: deductible first, coinsurance on the REMAINDER, rounded exactly once.
      # Step 4:
      deductible_applied_cents = min(allowed_cents, patient.deductible_remaining_cents)
      # Step 5:
      coinsurance_base = allowed_cents - deductible_applied_cents
      coinsurance_cents = round_half_up(payer.coinsurance_pct * coinsurance_base)
      # Step 6:
      patient_responsibility_cents = deductible_applied_cents + coinsurance_cents
      payer_paid_cents = allowed_cents - patient_responsibility_cents
      # Step 7 — ledger sync:
      patient.deductible_remaining_cents -= deductible_applied_cents
      #
      # REJECTED ALTERNATIVE (do not implement): rounding coinsurance on allowed_cents and
      # then subtracting the deductible. allowed 185000 with 50000 of deductible left gives
      # 77000 under the pinned order and 87000 under the rejected one.
    input_set: "The Claim's allowed_cents, the Patient's deductible_remaining_cents at this instant, and the Payer's coinsurance_pct."
    constants: {}
    precision: "whole cents, round_half_up on the single coinsurance multiplication"
    invariant: |
      CONSERVATION 2 (money): for every Claim in status PAID,
        allowed_cents == payer_paid_cents + patient_responsibility_cents
      and
        billed_cents  == allowed_cents + adjustment_cents.
      A DENIED or DENIED_FINAL claim leaves all four money fields null and moves no
      deductible; an appeal that is later PAID applies the deductible exactly once,
      against the balance observed at the paying adjudication.

  - name: repair_billability
    trigger: "POST /repair-orders"
    algorithm: dual_variant_threshold
    formula: |
      in_warranty = (reason == "DEFECT")
                    and (reported_on <= appliance.warranty_end_date)
      billable    = not in_warranty
      if billable:
          labor_units = ceil(labor_minutes / 15)
          uncapped    = labor_units * LABOR_RATE_CENTS_PER_15MIN
          cap         = round_half_up(REPAIR_CAP_PCT * FEE_SCHEDULE_E0486_CENTS)
          repair_charge_cents = min(uncapped, cap)
      else:
          labor_units = 0
          repair_charge_cents = 0
      resets_useful_lifetime = false      # never, for any repair, in or out of warranty
    input_set: "The RepairOrder's own reason, reported_on and labor_minutes, plus the Appliance's warranty_end_date."
    constants:
      LABOR_RATE_CENTS_PER_15MIN: 2500
      REPAIR_CAP_PCT: 0.50
      WARRANTY_MONTHS: 36
    precision: "whole cents; labour rounded UP to the next whole 15-minute unit"
    variants:
      - name: in_warranty_defect
        when: "reason == DEFECT and reported_on <= warranty_end_date"
        difference: "not billable at all: labor_units 0, repair_charge_cents 0, and a REPAIR claim against it is rejected with ERR_REPAIR_NOT_BILLABLE"
      - name: out_of_warranty_or_non_defect
        when: "reason is WEAR or ABUSE, or reported_on > warranty_end_date"
        difference: "billable in 15-minute units at LABOR_RATE_CENTS_PER_15MIN, capped at half the E0486 fee schedule (92500 cents); 555 labour minutes bills 92500 and 556 minutes bills the same 92500 because the cap binds"

  - name: useful_lifetime_window
    trigger: "POST /appliances/{appliance_id}/deliver sets it; ladder rung 31 reads it on POST /claims/{claim_id}/submit"
    algorithm: threshold
    formula: |
      useful_lifetime_end_date = add_months(delivered_on, payer.useful_lifetime_months)
      warranty_end_date        = add_months(delivered_on, WARRANTY_MONTHS)
      # add_months keeps the day-of-month, clamping to the last day of a shorter month.
      #
      # A payer-funded REPLACEMENT claim is admissible only when
      #     claim.date_of_service > predecessor.useful_lifetime_end_date
      # Strictly after: the end date itself is still inside the lifetime.
      # No repair, in or out of warranty, ever moves either date.
    input_set: "The predecessor Appliance named by the successor's replaces_appliance_id, and the Patient's medical Payer."
    constants:
      WARRANTY_MONTHS: 36
    precision: "whole calendar months and days"

  - name: recall_schedule
    trigger: "Set when the appliance enters ACTIVE_THERAPY; advanced by POST /appliances/{appliance_id}/recall-check; re-evaluated on POST /_clock/set_current_utc"
    algorithm: decay_function
    formula: |
      if recall_cycle_index == 0:
          next_recall_due_on = activation_date + FIRST_RECALL_DAYS
      else:
          next_recall_due_on = completed_check_date + SUBSEQUENT_RECALL_DAYS
      # Posture sweep, evaluated on every clock set, LAPSED edge first:
      if clock_date >= next_recall_due_on + RECALL_GRACE_DAYS: recall_status = "LAPSED"
      elif clock_date >= next_recall_due_on:                   recall_status = "DUE"
    input_set: "The single Appliance row; activation_date is the clock date at which lifecycle_status became ACTIVE_THERAPY."
    constants:
      FIRST_RECALL_DAYS: 90
      SUBSEQUENT_RECALL_DAYS: 365
      RECALL_GRACE_DAYS: 30
    precision: "whole calendar days; both posture boundaries are inclusive (>= )"
    variants:
      - name: first_cycle_ninety_days
        when: "recall_cycle_index == 0"
        difference: "the first appliance check falls 90 days after therapy activation, measured from activation, not from delivery"
      - name: subsequent_cycle_annual
        when: "recall_cycle_index >= 1"
        difference: "every later check is 365 days after the date the previous check was actually performed, so a late check pushes the whole cadence out rather than compressing it"

  - name: lot_remediation_progress
    trigger: "POST /appliance-lots/{lot_id}/recall computes the opening counts; POST /appliances/{appliance_id}/recall-remediate advances them"
    algorithm: aggregation
    formula: |
      # At recall issuance, over Appliance rows with lot_id == lot.id:
      affected_device_count     = count(lifecycle_status not in {"RETIRED", "REPLACED"})
      retired_count             = count(lifecycle_status in {"RETIRED", "REPLACED"})
      remediated_count          = 0
      pending_remediation_count = affected_device_count
      # On each remediation:
      remediated_count          += 1
      pending_remediation_count -= 1
      if pending_remediation_count == 0:
          lot.status = "REMEDIATION_COMPLETE"
    input_set: "All Appliance rows carrying this lot_id, partitioned by lifecycle_status at the instant of issuance."
    constants: {}
    precision: "integer counts"
    invariant: |
      CONSERVATION 3 (device population): from the instant a recall is issued and forever after,
        lot.affected_device_count == lot.remediated_count + lot.pending_remediation_count
      and the retired_count bucket is disjoint from all three. Retiring a device AFTER the
      recall was issued does not move it out of pending_remediation_count — the recalled
      population is frozen at issuance, so remediation of a retired device is still required
      to close the lot.

  - name: efficacy_report_due_date
    trigger: "POST /efficacy-reports"
    algorithm: threshold
    formula: |
      due_by = appliance.plateau_declared_on + EFFICACY_REPORT_DUE_DAYS days
      # Purely informational at creation. Loop closure, not timeliness, is what rung 24
      # enforces: a CONTINUED_USE claim requires Referral.loop_status == CLOSED.
    input_set: "The Appliance's plateau_declared_on."
    constants:
      EFFICACY_REPORT_DUE_DAYS: 30
    precision: "whole calendar days"

  - name: swo_face_to_face_currency
    trigger: "POST /written-orders computes f2f_age_days; ladder rungs 26-28 read it on POST /appliances/{appliance_id}/deliver and POST /claims/{claim_id}/submit"
    algorithm: threshold
    formula: |
      f2f_age_days = order_date - f2f_encounter_date        # whole days, may not be negative
      if f2f_age_days < 0:
          reject with ERR_VALIDATION (400)
      # At delivery and at claim submission:
      #   rung 26 — a SIGNED WrittenOrder for this patient and item_hcpcs must exist
      #   rung 27 — that order's order_date must be <= appliance.delivered_on
      #   rung 28 — f2f_age_days must be <= F2F_LOOKBACK_DAYS
      # The three rungs fire in that order and never collapse into one another.
    input_set: "The WrittenOrder rows for the claim's patient whose item_hcpcs equals the Appliance's hcpcs_code, newest SIGNED row by signed_on DESC then created_at DESC."
    constants:
      F2F_LOOKBACK_DAYS: 180
    precision: "whole calendar days; the boundary is inclusive (exactly 180 days old still qualifies)"

  - name: prior_auth_currency
    trigger: "Ladder rung 29 on POST /claims/{claim_id}/submit"
    algorithm: threshold
    formula: |
      approval_valid_until = decided_on + PA_VALIDITY_DAYS days
      if payer.prior_auth_required:
          pa = the Claim's prior_auth_id row
          if pa is null or pa.status != "APPROVED":
              reject with ERR_PRIOR_AUTH_REQUIRED (422)      # no write
          if clock_date > pa.approval_valid_until:
              pa.status = "EXPIRED"; persist; pa.version += 1
              reject with ERR_PRIOR_AUTH_REQUIRED (422)      # mutate-then-reject
    input_set: "The Claim's linked PriorAuth row and the Payer's prior_auth_required flag."
    constants:
      PA_VALIDITY_DAYS: 90
    precision: "whole calendar days; the boundary date itself is still valid"

# =============================================================================
# §1.4 Validation Rules Table — 35 rungs, strict priority order.
# Rung 5 is a GLOBAL WRITE GATE: it pre-empts rungs 6 through 35 on every
# patient-scoped mutation. Rung 13 is a second, narrower gate over the
# device-facing block (rungs 14-35).
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every id in the URL path resolves, validated left to right"
    error_id: "ERR_PATIENT_NOT_FOUND | ERR_PROVIDER_NOT_FOUND | ERR_REFERRAL_NOT_FOUND | ERR_APPLIANCE_NOT_FOUND | ERR_RECORD_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint carrying a path id"

  - priority: 4
    category: existence
    check: "every foreign key supplied in the request body resolves, validated in the field order declared by the endpoint's input list"
    error_id: "ERR_PATIENT_NOT_FOUND | ERR_PROVIDER_NOT_FOUND | ERR_REFERRAL_NOT_FOUND | ERR_APPLIANCE_NOT_FOUND | ERR_RECORD_NOT_FOUND"
    http_status: 404
    applies_to: "every POST that accepts a foreign key"

  - priority: 5
    category: business_safety
    check: >-
      GLOBAL WRITE GATE. When the patient in scope has records_frozen == true (at least one
      AuditHold in status OPEN), every mutating endpoint whose subject resolves to that
      patient is refused before any other business rule is evaluated. The patient in scope is
      resolved through the row being written: Patient, Referral, SleepStudy, WrittenOrder,
      PriorAuth, LabOrder (via its Referral), Appliance, TitrationVisit (via its Appliance),
      AdherenceDownload (via its Appliance), EfficacyReport, Claim and RepairOrder (via its
      Appliance). The only mutations exempt are POST /audit-holds/{audit_hold_id}/close,
      POST /audit-holds, POST /appliance-lots, POST /appliance-lots/{lot_id}/recall,
      POST /providers, POST /payers and POST /_clock/set_current_utc. All GET endpoints are exempt.
    error_id: ERR_RECORDS_FROZEN
    http_status: 409
    applies_to: "all mutating endpoints except the seven named exemptions"

  - priority: 6
    category: auth
    check: >-
      Care-team scope. A Dentist may only act on, or read, rows belonging to a patient for whom
      some Referral names him as treating_dentist_id in ANY status, ISSUED included — otherwise
      he could never respond to the very referral that admits him to the care team. A
      SleepPhysician may only act on rows for a patient he has either ordered a SleepStudy for
      or referred. A LabTechnician may only act on LabOrder rows naming him as lab_provider_id.
      A Patient may only act on rows resolving to his own patient_id. ClinicCoordinator,
      BillingSpecialist and PlatformAdmin are unscoped. Scope bootstrapping: on POST
      /sleep-studies and POST /referrals the acting SleepPhysician establishes his own scope by
      naming himself in ordering_physician_id / referring_physician_id — without this clause the
      first contact with a new patient would be impossible. A physician naming a DIFFERENT
      provider in that slot is refused here.
    error_id: ERR_NOT_CARE_TEAM
    http_status: 403
    applies_to: "all patient-scoped endpoints, reads included"

  - priority: 7
    category: business_constraint
    check: "every field marked required in the endpoint's input list is present and of the declared JSON type"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

  - priority: 8
    category: business_constraint
    check: >-
      Enum membership. EXACTLY these fields route a bad member to ERR_INVALID_ENUM and no other
      field does: Provider.provider_type, Provider.status, Payer.payer_kind, SleepStudy.modality,
      SleepStudy.study_purpose, Referral.cpap_history, WrittenOrder.item_hcpcs,
      PriorAuth.requested_hcpcs, PriorAuth.denial_reason, LabOrder.appliance_kind,
      LabOrder.capture_method, ApplianceLot.recall_severity, Appliance.pod_method,
      TitrationVisit.side_effect_severity, AdherenceDownload.source, Claim.claim_type,
      Claim.hcpcs_code, RepairOrder.reason, and these six action-verb body enums —
      POST /referrals/{referral_id}/respond decision in {ACCEPTED, DECLINED};
      POST /lab-orders/{lab_order_id}/receive fit_outcome in {ACCEPTED, REMAKE_REQUIRED};
      POST /prior-auths/{prior_auth_id}/decision decision in {APPROVED, DENIED};
      POST /claims/{claim_id}/adjudicate outcome in {PAID, DENIED};
      POST /efficacy-reports/{report_id}/physician-response decision in {SIGNED, DISPUTED};
      POST /repair-orders/{repair_order_id}/complete outcome in {REPAIRED, NOT_COVERED}.
      Any OTHER malformed value — wrong JSON type, out-of-range number, malformed date,
      unknown field, or a free-text field such as remediation_action, narrative,
      dispute_reason, scope_note, material or remediation notes — is ERR_VALIDATION at
      rung 7 or rung 9, never ERR_INVALID_ENUM.
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "every endpoint accepting one of the listed enum fields"

  - priority: 9
    category: business_constraint
    check: >-
      Numeric and calendar domains: max_protrusive_mm in [4.00, 12.00] and a multiple of 0.25;
      requested_increment_mm in [0.25, 2.00] and a multiple of 0.25; epworth_score in [0, 24];
      artifact_pct in [0, 100]; sleep_minutes <= recording_minutes; billed_cents >= 0;
      labor_minutes >= 0; coinsurance_pct in [0.00, 1.00]; nights_at_or_above_min_hours <=
      nights_recorded <= ADHERENCE_WINDOW_DAYS; the adherence window spans exactly
      ADHERENCE_WINDOW_DAYS inclusive nights; WrittenOrder.f2f_encounter_date <= order_date;
      every date field parses as YYYY-MM-DD.
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "the endpoints accepting each named field"

  - priority: 10
    category: business_constraint
    check: >-
      Uniqueness. EXACTLY these three identifiers route a collision to ERR_DUPLICATE_IDENTIFIER
      and no other field does: Provider.npi, Patient.mrn, ApplianceLot.lot_code and
      Appliance.serial_number. (Four fields across four entities; comparison is exact string
      equality, case-sensitive.)
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /providers, POST /patients, POST /appliance-lots, POST /appliances"

  - priority: 11
    category: state
    check: "the expected_<parent>_version supplied matches the current version of the OCC parent named in §1.2.1"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /titration-visits, POST /written-orders, POST /efficacy-reports"

  - priority: 12
    category: state
    check: >-
      State preconditions. First the path resource's own status must admit the transition
      (§1.2); then the governing parent's status must admit it: a TitrationVisit apply requires
      Appliance.lifecycle_status in {DELIVERED, IN_TITRATION}; a plateau requires IN_TITRATION;
      an efficacy-report submit requires TITRATION_PLATEAU; a physician-response requires
      report status SUBMITTED; a lab-order create, a lab-order submit and a prior-auth create
      each require Referral.status == ACCEPTED; an
      appliance create requires LabOrder.status == RECEIVED_ACCEPTED; a proof-of-delivery
      requires Appliance.lifecycle_status == DELIVERED; a recall-check requires ACTIVE_THERAPY;
      a repair-order create requires the Appliance to be past DELIVERED and not RETIRED or
      REPLACED; a claim submit requires Claim.status == DRAFT.
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 13
    category: business_safety
    check: >-
      DEVICE GATE. When the Appliance in scope has device_hold_status == RECALL_HOLD, every
      titration, plateau, delivery, proof-of-delivery, efficacy-report, repair-order, recall-check
      and claim write touching it is refused. The only writes that remain open on a held device
      are POST /appliances/{appliance_id}/recall-remediate and the read endpoints.
      Designed pre-emption: on POST /titration-visits/{visit_id}/apply this rung is unreachable,
      because the recall cascade has already moved every SCHEDULED or HELD visit to
      VOIDED_BY_HOLD and rung 12 rejects first with ERR_INVALID_STATE. The rung is reached
      instead through POST /titration-visits, POST /appliances/{appliance_id}/deliver,
      POST /repair-orders and POST /claims/{claim_id}/submit, whose subjects are not voided by
      the cascade.
    error_id: ERR_DEVICE_RECALL_HOLD
    http_status: 409
    applies_to: "every appliance-scoped mutation except recall-remediate"

  - priority: 14
    category: business_safety
    check: >-
      Segregation of duties. On POST /referrals, treating_dentist_id must not equal
      referring_physician_id. On POST /efficacy-reports/{report_id}/physician-response the acting
      X-User-ID must equal the Referral's referring_physician_id; when the acting X-User-ID is
      instead the Referral's treating_dentist_id — which is exactly what happens if the treating
      dentist presents the SleepPhysician role header to sign off his own titration — the answer
      is ERR_SELF_REFERRAL, not ERR_NOT_CARE_TEAM, because the treating dentist does pass the
      rung-6 care-team test. Any OTHER provider id lands on rung 6 first with ERR_NOT_CARE_TEAM.
      This rung sits ABOVE the provider-suitability rung deliberately: no single Provider can be
      both a SLEEP_PHYSICIAN and a DENTIST, so if suitability ran first, the same-provider
      referral would always answer ERR_PROVIDER_TYPE_MISMATCH and ERR_SELF_REFERRAL would be
      unreachable on POST /referrals.
    error_id: ERR_SELF_REFERRAL
    http_status: 422
    applies_to: "POST /referrals, POST /efficacy-reports/{report_id}/physician-response"

  - priority: 15
    category: business_referential
    check: >-
      Provider slot suitability. referring_physician_id and ordering_physician_id must be
      provider_type SLEEP_PHYSICIAN; treating_dentist_id and performed_by_dentist_id must be
      DENTIST; lab_provider_id must be DENTAL_LAB. In every one of those five slots the Provider
      must also be status ACTIVE — a SUSPENDED provider is rejected with this same error id.
      Reached on POST /referrals only when the two provider slots hold DIFFERENT rows, since the
      identical-row case is taken by rung 14.
    error_id: ERR_PROVIDER_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /referrals, POST /sleep-studies, POST /written-orders, POST /lab-orders, POST /titration-visits"

  - priority: 16
    category: business_safety
    check: >-
      The referenced SleepStudy must be in status DIAGNOSTIC_VALID. An ORDERED study (never
      resulted) or a NON_DIAGNOSTIC one (failed its modality quality gate) may never ground a
      Referral, and a NON_DIAGNOSTIC efficacy study may never ground an EfficacyReport.
      This rung sits ABOVE rung 17 deliberately: a NON_DIAGNOSTIC study also has a null
      severity_band, so if the band check ran first this error id would be unreachable.
    error_id: ERR_STUDY_NON_DIAGNOSTIC
    http_status: 422
    applies_to: "POST /referrals, POST /efficacy-reports"

  - priority: 17
    category: business_safety
    check: >-
      The referenced study must carry an actual OSA diagnosis: study_purpose == DIAGNOSTIC and
      severity_band in {MILD, MODERATE, SEVERE}. A DIAGNOSTIC_VALID study whose severity_index
      fell below AHI_MILD_MIN has severity_band NONE — there is no disease to treat and the
      request lands here, not on rung 19. Naming an EFFICACY study as diagnostic_study_id also
      lands here.
    error_id: ERR_DIAGNOSIS_REQUIRED
    http_status: 422
    applies_to: "POST /referrals"

  - priority: 18
    category: business_temporal
    check: >-
      MUTATE-THEN-REJECT. When clock_date > Referral.diagnosis_valid_until and the Referral is in
      status ISSUED or ACCEPTED, the Referral is first persisted as EXPIRED (version += 1, and any
      RECORDS_CAPTURED LabOrder on it is CANCELLED) and the request is then rejected. When the
      Referral is ALREADY EXPIRED the priority-12 state gate has already rejected the request with
      ERR_INVALID_STATE, so this rung never fires twice and never bumps the version twice.
    error_id: ERR_DIAGNOSIS_EXPIRED
    http_status: 422
    applies_to: "POST /referrals/{referral_id}/respond, POST /lab-orders, POST /prior-auths"

  - priority: 19
    category: business_safety
    check: "calculation oat_medical_necessity_basis admits the severity x CPAP-history fork: SEVERE needs documented, fresh, long-enough CPAP failure/intolerance or an outright refusal; MILD needs epworth_score >= MIN_SYMPTOM_SCORE or any non-NONE cpap_history; MODERATE needs nothing"
    error_id: ERR_CPAP_TRIAL_REQUIRED
    http_status: 422
    applies_to: "POST /referrals"

  - priority: 20
    category: business_constraint
    check: >-
      One live device per patient. POST /appliances AND POST /appliances/{appliance_id}/deliver
      are each refused when the patient already has a DIFFERENT Appliance whose lifecycle_status
      is in {DELIVERED, IN_TITRATION, TITRATION_SUSPENDED, TITRATION_PLATEAU, EFFICACY_PENDING,
      ACTIVE_THERAPY}, unless the request supplies (create) or the row already carries (deliver)
      replaces_appliance_id naming that very device, and that device is in ACTIVE_THERAPY or
      RETIRED.
      Both endpoints are covered so that a spare device may legitimately be fabricated and held
      in FABRICATED state as a clinic loaner, while only one device is ever in the patient's
      mouth.
    error_id: ERR_ACTIVE_APPLIANCE_EXISTS
    http_status: 409
    applies_to: "POST /appliances, POST /appliances/{appliance_id}/deliver"

  - priority: 21
    category: business_temporal
    check: >-
      At least MIN_TITRATION_INTERVAL_DAYS whole days separate this apply from the appliance's
      most recent APPLIED or REDUCED visit, measured applied_on to clock date, inclusive
      boundary: exactly 14 days passes, 13 does not. A HELD visit never starts the clock because
      it never sets applied_on. This rung is evaluated ONLY when the request would resolve to
      APPLIED, i.e. side_effect_severity in {NONE, MILD}; a MODERATE hold and a SEVERE reduction
      are never gated by the interval, because backing a patient off a painful advancement must
      never have to wait.
    error_id: ERR_TITRATION_INTERVAL
    http_status: 422
    applies_to: "POST /titration-visits/{visit_id}/apply with side_effect_severity in {NONE, MILD}"

  - priority: 22
    category: business_constraint
    check: "current_advancement_mm + min(requested_increment_mm, MAX_INCREMENT_PER_VISIT_MM) must not exceed Appliance.max_protrusive_mm; equality is permitted, one grain over is refused"
    error_id: ERR_PROTRUSION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /titration-visits/{visit_id}/apply with side_effect_severity in {NONE, MILD}"

  - priority: 23
    category: business_constraint
    check: "plateau prerequisites: POST /appliances/{appliance_id}/plateau requires applied_visit_count >= PLATEAU_MIN_VISITS, and POST /efficacy-reports requires the Appliance to be in lifecycle_status TITRATION_PLATEAU or EFFICACY_PENDING"
    error_id: ERR_PLATEAU_REQUIRED
    http_status: 422
    applies_to: "POST /appliances/{appliance_id}/plateau, POST /efficacy-reports"

  - priority: 24
    category: business_referential
    check: >-
      Cross-provider loop closure: a Claim of claim_type CONTINUED_USE may only be submitted
      when the Appliance's Referral has loop_status == CLOSED, i.e. the referring physician has
      signed the efficacy report. (This rung is deliberately NOT applied to
      POST /appliances/{appliance_id}/recall-check: that endpoint's rung-12 precondition already
      requires lifecycle_status ACTIVE_THERAPY, which is only reachable through loop closure, so
      a loop-open clause there would be permanently masked and untestable.)
    error_id: ERR_EFFICACY_LOOP_OPEN
    http_status: 409
    applies_to: "POST /claims/{claim_id}/submit for claim_type == CONTINUED_USE"

  - priority: 25
    category: business_referential
    check: "medical-benefit routing: Claim.payer_id must equal the Patient's medical_payer_id and that payer's payer_kind must be MEDICAL; naming the Patient's dental_payer_id, or any payer whose payer_kind is DENTAL, is refused"
    error_id: ERR_DENTAL_PAYER_ROUTING
    http_status: 422
    applies_to: "POST /claims, POST /claims/{claim_id}/submit, POST /prior-auths"

  - priority: 26
    category: business_referential
    check: "a WrittenOrder in status SIGNED exists for this patient with item_hcpcs equal to the Appliance's hcpcs_code (delivery), or equal to the Claim's hcpcs_code (claim submission)"
    error_id: ERR_SWO_MISSING
    http_status: 422
    applies_to: "POST /appliances/{appliance_id}/deliver, POST /claims/{claim_id}/submit for claim_type in {INITIAL_DEVICE, REPLACEMENT}"

  - priority: 27
    category: business_temporal
    check: "the standard written order must predate delivery: WrittenOrder.order_date <= Appliance.delivered_on. A claim whose device was delivered before its order was written is refused here, not at rung 26."
    error_id: ERR_SWO_AFTER_DELIVERY
    http_status: 422
    applies_to: "POST /appliances/{appliance_id}/deliver, POST /claims/{claim_id}/submit for claim_type in {INITIAL_DEVICE, REPLACEMENT}"

  - priority: 28
    category: business_temporal
    check: "the supporting face-to-face encounter must be recent: WrittenOrder.f2f_age_days <= F2F_LOOKBACK_DAYS, inclusive"
    error_id: ERR_F2F_ENCOUNTER_STALE
    http_status: 422
    applies_to: "POST /appliances/{appliance_id}/deliver, POST /claims/{claim_id}/submit for claim_type in {INITIAL_DEVICE, REPLACEMENT}"

  - priority: 29
    category: business_referential
    check: >-
      MUTATE-THEN-REJECT. When the payer requires it, an APPROVED and unexpired PriorAuth must
      back the claim. A missing or non-APPROVED authorisation is refused with no write. An
      APPROVED authorisation whose approval_valid_until has passed is first persisted as EXPIRED
      (version += 1) and then refused. An already-EXPIRED authorisation is refused with the same
      error id and NO write — nothing pre-empts this rung because the PriorAuth is not the path
      resource.
    error_id: ERR_PRIOR_AUTH_REQUIRED
    http_status: 422
    applies_to: "POST /claims/{claim_id}/submit"

  - priority: 30
    category: business_referential
    check: "proof of delivery must be on file: Appliance.pod_signed_on is not null and Appliance.pod_method is set"
    error_id: ERR_POD_MISSING
    http_status: 422
    applies_to: "POST /claims/{claim_id}/submit for claim_type in {INITIAL_DEVICE, REPLACEMENT, CONTINUED_USE}"

  - priority: 31
    category: business_fiscal
    check: "a payer-funded REPLACEMENT is admissible only when date_of_service is strictly after the predecessor Appliance's useful_lifetime_end_date; the end date itself is still inside the lifetime"
    error_id: ERR_USEFUL_LIFETIME_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /claims/{claim_id}/submit for claim_type == REPLACEMENT"

  - priority: 32
    category: business_fiscal
    check: "a REPAIR claim requires RepairOrder.billable == true; an in-warranty defect repair is not billable and its claim is refused"
    error_id: ERR_REPAIR_NOT_BILLABLE
    http_status: 422
    applies_to: "POST /claims/{claim_id}/submit for claim_type == REPAIR"

  - priority: 33
    category: business_fiscal
    check: >-
      Objective adherence. A CONTINUED_USE claim requires the newest AdherenceDownload on the
      appliance with source == OBJECTIVE_MICRORECORDER (by created_at DESC) to have compliant ==
      true, and requires Appliance.recall_status not to be LAPSED. A PATIENT_ATTESTED row, however
      favourable, never satisfies this rung.
    error_id: ERR_ADHERENCE_NOT_MET
    http_status: 422
    applies_to: "POST /claims/{claim_id}/submit for claim_type == CONTINUED_USE"

  - priority: 34
    category: business_temporal
    check: >-
      Loaner availability. A loaner_appliance_id may not be occupied by another RepairOrder whose
      loaner interval overlaps. Intervals are half-open [reported_on, returned_on): an open repair
      (returned_on null) occupies [reported_on, infinity); a closed one frees the device on its
      returned_on date, so a new repair reported exactly on that date is accepted.
    error_id: ERR_LOANER_UNAVAILABLE
    http_status: 409
    applies_to: "POST /repair-orders"

  - priority: 35
    category: business_constraint
    check: "appeal attempts are capped: PriorAuth.appeal_attempts and Claim.appeal_attempts must each be strictly less than the Payer's appeal_limit before a new appeal is accepted"
    error_id: ERR_APPEAL_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /prior-auths/{prior_auth_id}/appeal, POST /claims/{claim_id}/appeal"

# =============================================================================
# §1.5 API Endpoint Table — 70 endpoints, flat topology.
# =============================================================================
endpoints:

  # --- logical clock (test-driving, /_ namespace) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before the first call the clock reads exactly 2026-05-01T00:00:00Z and never falls back to wall-clock time. Every deadline, validity window and recall posture in this API is evaluated against this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "re-evaluates Appliance.recall_status on every appliance in lifecycle_status ACTIVE_THERAPY per calculation recall_schedule (NOT_DUE -> DUE -> LAPSED)"

  # --- Providers ---
  - method: POST
    path: "/providers"
    description: "Register a sleep physician, a dentist or a dental lab"
    roles: [PlatformAdmin]
    code: 201
    input: [npi, full_name, provider_type, "state_license?", "dme_supplier_number?", "status?"]
    output: Provider
    side_effects:
      - "open_efficacy_loop_count initialised to 0"

  - method: GET
    path: "/providers/{provider_id}"
    description: "Read one provider"
    roles: [PlatformAdmin, SleepPhysician, Dentist, LabTechnician, ClinicCoordinator, BillingSpecialist]
    code: 200
    input: []
    output: Provider
    side_effects: []

  # --- Payers ---
  - method: POST
    path: "/payers"
    description: "Register a medical or dental payer with its coverage policy"
    roles: [PlatformAdmin]
    code: 201
    input: [name, payer_kind, "prior_auth_required?", "useful_lifetime_months?", "coinsurance_pct?", "appeal_limit?", "residual_ahi_target?", "pct_reduction_target?"]
    output: Payer
    side_effects: []

  - method: GET
    path: "/payers/{payer_id}"
    description: "Read one payer and its policy constants"
    roles: [PlatformAdmin, BillingSpecialist, ClinicCoordinator, Dentist]
    code: 200
    input: []
    output: Payer
    side_effects: []

  # --- Patients ---
  - method: POST
    path: "/patients"
    description: "Register a patient and bind the medical and dental benefits"
    roles: [ClinicCoordinator, PlatformAdmin]
    code: 201
    input: [mrn, full_name, date_of_birth, medical_payer_id, "dental_payer_id?", "deductible_remaining_cents?", "epworth_score?"]
    output: Patient
    side_effects:
      - "records_frozen initialised to false"

  - method: GET
    path: "/patients/{patient_id}"
    description: "Read one patient"
    roles: [ClinicCoordinator, PlatformAdmin, SleepPhysician, Dentist, BillingSpecialist, Patient]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: GET
    path: "/patients"
    description: "List patients, filterable by either benefit"
    roles: [ClinicCoordinator, PlatformAdmin, BillingSpecialist]
    code: 200
    input: ["medical_payer_id?", "dental_payer_id?", "limit?", "offset?"]
    output: "Patient[]"
    side_effects: []

  # --- Sleep studies ---
  - method: POST
    path: "/sleep-studies"
    description: "Order a diagnostic or efficacy sleep study"
    roles: [SleepPhysician]
    code: 201
    input: [patient_id, ordering_physician_id, modality, study_purpose, "appliance_id?"]
    output: SleepStudy
    side_effects:
      - "status initialised to ORDERED; appliance_id is required when study_purpose is EFFICACY and rejected when DIAGNOSTIC"

  - method: GET
    path: "/sleep-studies/{study_id}"
    description: "Read one sleep study"
    roles: [SleepPhysician, Dentist, ClinicCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: SleepStudy
    side_effects: []

  - method: GET
    path: "/sleep-studies"
    description: "List sleep studies by patient, ordering physician, appliance or purpose"
    roles: [SleepPhysician, Dentist, ClinicCoordinator, PlatformAdmin]
    code: 200
    input: ["patient_id?", "ordering_physician_id?", "appliance_id?", "study_purpose?", "status?", "limit?", "offset?"]
    output: "SleepStudy[]"
    side_effects: []

  - method: POST
    path: "/sleep-studies/{study_id}/results"
    description: "Post the recording and let the quality gate decide whether it is diagnostic"
    roles: [SleepPhysician]
    code: 200
    input: [performed_on, respiratory_events, recording_minutes, "sleep_minutes?", "artifact_pct?", "attended?"]
    output: SleepStudy
    side_effects:
      - "computes severity_index per calculation severity_index"
      - "computes status via calculation study_diagnostic_validity (ORDERED -> DIAGNOSTIC_VALID or ORDERED -> NON_DIAGNOSTIC)"
      - "computes severity_band per calculation severity_band, only on the DIAGNOSTIC_VALID branch"

  - method: POST
    path: "/sleep-studies/{study_id}/reorder"
    description: "Re-order a non-diagnostic study on the same row, optionally escalating HSAT to PSG"
    roles: [SleepPhysician]
    code: 200
    input: ["modality?"]
    output: SleepStudy
    side_effects:
      - "NON_DIAGNOSTIC -> ORDERED; repeat_count += 1; all recording and severity fields cleared to null"

  # --- Referrals ---
  - method: POST
    path: "/referrals"
    description: "A sleep physician refers a diagnosed patient to a dentist for oral appliance therapy"
    roles: [SleepPhysician]
    code: 201
    input: [patient_id, referring_physician_id, treating_dentist_id, diagnostic_study_id, "cpap_history?", "cpap_nights_used?", "cpap_documented_on?"]
    output: Referral
    side_effects:
      - "snapshots severity_band_at_referral from the diagnostic study"
      - "computes eligibility_basis per calculation oat_medical_necessity_basis"
      - "computes diagnosis_valid_until per calculation diagnosis_currency"
      - "loop_status initialised to OPEN"

  - method: GET
    path: "/referrals/{referral_id}"
    description: "Read one referral"
    roles: [SleepPhysician, Dentist, ClinicCoordinator, BillingSpecialist, PlatformAdmin]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: GET
    path: "/referrals"
    description: "List referrals by patient, physician, dentist, grounding study or status"
    roles: [SleepPhysician, Dentist, ClinicCoordinator, BillingSpecialist, PlatformAdmin]
    code: 200
    input: ["patient_id?", "referring_physician_id?", "treating_dentist_id?", "diagnostic_study_id?", "status?", "limit?", "offset?"]
    output: "Referral[]"
    side_effects: []

  - method: POST
    path: "/referrals/{referral_id}/respond"
    description: "The treating dentist accepts or declines the referral"
    roles: [Dentist]
    code: 200
    input: [decision, "reason?"]
    output: Referral
    side_effects:
      - "ISSUED -> ACCEPTED or ISSUED -> DECLINED"
      - "evaluates ladder rung 18, which may persist EXPIRED and then reject"

  # --- Written orders (DME standard written order) ---
  - method: POST
    path: "/written-orders"
    description: "Issue a standard written order. OCC parent is the Patient: a newer order supersedes the prior order for the same item_hcpcs."
    roles: [SleepPhysician]
    code: 201
    input: [patient_id, ordering_physician_id, item_hcpcs, order_date, f2f_encounter_date, expected_patient_version]
    output: WrittenOrder
    side_effects:
      - "computes f2f_age_days per calculation swo_face_to_face_currency"
      - "any prior DRAFT or SIGNED WrittenOrder for the same patient_id and item_hcpcs transitions to SUPERSEDED"
      - "increments Patient.version by 1"

  - method: GET
    path: "/written-orders/{written_order_id}"
    description: "Read one standard written order"
    roles: [SleepPhysician, Dentist, BillingSpecialist, PlatformAdmin]
    code: 200
    input: []
    output: WrittenOrder
    side_effects: []

  - method: GET
    path: "/written-orders"
    description: "List standard written orders by patient, ordering physician or status"
    roles: [SleepPhysician, Dentist, BillingSpecialist, PlatformAdmin]
    code: 200
    input: ["patient_id?", "ordering_physician_id?", "status?", "limit?", "offset?"]
    output: "WrittenOrder[]"
    side_effects: []

  - method: POST
    path: "/written-orders/{written_order_id}/sign"
    description: "The ordering physician signs the order, making it usable at delivery"
    roles: [SleepPhysician]
    code: 200
    input: [signed_on]
    output: WrittenOrder
    side_effects:
      - "DRAFT -> SIGNED"

  # --- Prior authorisations ---
  - method: POST
    path: "/prior-auths"
    description: "File a prior authorisation request with the medical payer; the row is created already SUBMITTED"
    roles: [BillingSpecialist]
    code: 201
    input: [patient_id, payer_id, referral_id, requested_hcpcs]
    output: PriorAuth
    side_effects:
      - "submitted_on set to the clock date; status initialised to SUBMITTED; appeal_attempts 0"
      - "evaluates ladder rung 18 against the referral, which may persist EXPIRED and then reject"

  - method: GET
    path: "/prior-auths/{prior_auth_id}"
    description: "Read one prior authorisation"
    roles: [BillingSpecialist, PlatformAdmin, Dentist]
    code: 200
    input: []
    output: PriorAuth
    side_effects: []

  - method: GET
    path: "/prior-auths"
    description: "List prior authorisations by patient, payer, referral or status"
    roles: [BillingSpecialist, PlatformAdmin, Dentist]
    code: 200
    input: ["patient_id?", "payer_id?", "referral_id?", "status?", "limit?", "offset?"]
    output: "PriorAuth[]"
    side_effects: []

  - method: POST
    path: "/prior-auths/{prior_auth_id}/decision"
    description: "Record the payer's decision on a submitted or appealed authorisation"
    roles: [PlatformAdmin]
    code: 200
    input: [decision, "denial_reason?", "decided_on?"]
    output: PriorAuth
    side_effects:
      - "on APPROVED sets decided_on and approval_valid_until per calculation prior_auth_currency"
      - "on DENIED with appeal_attempts already equal to Payer.appeal_limit the row lands in DENIED_FINAL instead of DENIED"

  - method: POST
    path: "/prior-auths/{prior_auth_id}/appeal"
    description: "Appeal a denied authorisation"
    roles: [BillingSpecialist]
    code: 200
    input: [narrative]
    output: PriorAuth
    side_effects:
      - "DENIED -> APPEALED; appeal_attempts += 1"

  # --- Lab orders (records + fabrication) ---
  - method: POST
    path: "/lab-orders"
    description: "Capture records (impression or scan, protrusive range) and open a lab work order"
    roles: [Dentist]
    code: 201
    input: [referral_id, lab_provider_id, appliance_kind, capture_method, max_protrusive_mm, "retruded_position_mm?", "promised_turnaround_days?"]
    output: LabOrder
    side_effects:
      - "status initialised to RECORDS_CAPTURED"
      - "evaluates ladder rung 18 against the referral, which may persist EXPIRED and then reject"

  - method: GET
    path: "/lab-orders/{lab_order_id}"
    description: "Read one lab work order"
    roles: [Dentist, LabTechnician, ClinicCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: LabOrder
    side_effects: []

  - method: GET
    path: "/lab-orders"
    description: "List lab work orders by referral, lab or status"
    roles: [Dentist, LabTechnician, ClinicCoordinator, PlatformAdmin]
    code: 200
    input: ["referral_id?", "lab_provider_id?", "status?", "limit?", "offset?"]
    output: "LabOrder[]"
    side_effects: []

  - method: POST
    path: "/lab-orders/{lab_order_id}/submit"
    description: "Send the case to the lab. The same call re-submits a remake."
    roles: [Dentist]
    code: 200
    input: ["promised_turnaround_days?"]
    output: LabOrder
    side_effects:
      - "RECORDS_CAPTURED -> IN_FABRICATION, or REMAKE_REQUIRED -> IN_FABRICATION with remake_count += 1"
      - "submitted_on set to the clock date; promised_ship_date set to submitted_on + promised_turnaround_days"

  - method: POST
    path: "/lab-orders/{lab_order_id}/ship"
    description: "The lab ships the finished case"
    roles: [LabTechnician]
    code: 200
    input: [shipped_on]
    output: LabOrder
    side_effects:
      - "IN_FABRICATION -> SHIPPED; turnaround_on_time set to (shipped_on <= promised_ship_date)"

  - method: POST
    path: "/lab-orders/{lab_order_id}/receive"
    description: "The dentist tries the case in and either accepts it or returns it for a remake"
    roles: [Dentist]
    code: 200
    input: [fit_outcome]
    output: LabOrder
    side_effects:
      - "SHIPPED -> RECEIVED_ACCEPTED, or SHIPPED -> REMAKE_REQUIRED with shipped_on and turnaround_on_time cleared"

  # --- Appliance lots and the device recall ---
  - method: POST
    path: "/appliance-lots"
    description: "Register a manufacturing lot"
    roles: [PlatformAdmin]
    code: 201
    input: [manufacturer, lot_code, "material?"]
    output: ApplianceLot
    side_effects:
      - "status initialised to ACTIVE; all four counters initialised to 0"

  - method: GET
    path: "/appliance-lots/{lot_id}"
    description: "Read one lot and its remediation counters"
    roles: [PlatformAdmin, Dentist, LabTechnician]
    code: 200
    input: []
    output: ApplianceLot
    side_effects: []

  - method: POST
    path: "/appliance-lots/{lot_id}/recall"
    description: "Issue a safety recall against a lot. Origin of the deepest cascade in this API."
    roles: [PlatformAdmin]
    code: 200
    input: [notice_reference, recall_severity]
    output: ApplianceLot
    side_effects:
      - "ACTIVE -> RECALL_ISSUED; recall_issued_on set to the clock date"
      - "counters computed per calculation lot_remediation_progress"
      - "CASCADE L1: every non-retired Appliance in the lot moves device_hold_status NONE -> RECALL_HOLD"
      - "CASCADE L2: every SCHEDULED or HELD TitrationVisit on those appliances -> VOIDED_BY_HOLD"
      - "CASCADE L3: an appliance left with no open visit while IN_TITRATION -> TITRATION_SUSPENDED"
      - "CASCADE L4: every DRAFT/SUBMITTED/DISPUTED EfficacyReport on those appliances -> WITHDRAWN and its Referral.loop_status returns to OPEN"
      - "CASCADE L5: every DRAFT CONTINUED_USE Claim on those appliances -> VOIDED"

  # --- Appliances ---
  - method: POST
    path: "/appliances"
    description: "Fabricate the device from an accepted lab order and a manufacturing lot"
    roles: [Dentist]
    code: 201
    input: [lab_order_id, lot_id, serial_number, "has_microrecorder?", "replaces_appliance_id?"]
    output: Appliance
    side_effects:
      - "patient_id, appliance_kind and max_protrusive_mm copied from the lab order and its referral; hcpcs_code derived (E0486 custom, A9270 prefabricated)"
      - "lifecycle_status FABRICATED, device_hold_status NONE, recall_status NOT_SCHEDULED"
      - "when replaces_appliance_id is supplied the predecessor transitions ACTIVE_THERAPY -> REPLACED"

  - method: GET
    path: "/appliances/{appliance_id}"
    description: "Read one appliance and all three of its state axes"
    roles: [Dentist, SleepPhysician, ClinicCoordinator, BillingSpecialist, PlatformAdmin, Patient]
    code: 200
    input: []
    output: Appliance
    side_effects: []

  - method: GET
    path: "/appliances"
    description: "List appliances by patient, lab order, lot, predecessor, written order or lifecycle"
    roles: [Dentist, SleepPhysician, ClinicCoordinator, BillingSpecialist, PlatformAdmin]
    code: 200
    input: ["patient_id?", "lab_order_id?", "lot_id?", "replaces_appliance_id?", "written_order_id?", "lifecycle_status?", "limit?", "offset?"]
    output: "Appliance[]"
    side_effects: []

  - method: POST
    path: "/appliances/{appliance_id}/deliver"
    description: "Deliver and fit the device against a signed standard written order"
    roles: [Dentist]
    code: 200
    input: [delivered_on, written_order_id]
    output: Appliance
    side_effects:
      - "FABRICATED -> DELIVERED"
      - "computes starting_advancement_mm and current_advancement_mm per calculation starting_advancement_mm"
      - "computes warranty_end_date and useful_lifetime_end_date per calculation useful_lifetime_window"
      - "evaluates ladder rungs 26, 27 and 28 against the written order"

  - method: POST
    path: "/appliances/{appliance_id}/proof-of-delivery"
    description: "Capture proof of delivery, without which no device claim may be submitted"
    roles: [Dentist, ClinicCoordinator]
    code: 200
    input: [pod_signed_on, pod_method]
    output: Appliance
    side_effects:
      - "pod_signed_on and pod_method persisted; no lifecycle transition"

  - method: POST
    path: "/appliances/{appliance_id}/plateau"
    description: "Declare the titration plateau, freezing advancement and opening the efficacy re-test"
    roles: [Dentist]
    code: 200
    input: []
    output: Appliance
    side_effects:
      - "IN_TITRATION -> TITRATION_PLATEAU; plateau_declared_on set to the clock date"
      - "every SCHEDULED or HELD TitrationVisit on the appliance -> SUPERSEDED"
      - "gated by calculation plateau_eligibility (ladder rung 23)"

  - method: POST
    path: "/appliances/{appliance_id}/recall-remediate"
    description: "Record the remediation that clears a device recall hold"
    roles: [Dentist]
    code: 200
    input: [remediation_action]
    output: Appliance
    side_effects:
      - "device_hold_status RECALL_HOLD -> NONE; TITRATION_SUSPENDED -> IN_TITRATION when the lifecycle axis was suspended"
      - "ApplianceLot.remediated_count += 1, pending_remediation_count -= 1, and the lot closes as REMEDIATION_COMPLETE when pending reaches 0"

  - method: POST
    path: "/appliances/{appliance_id}/recall-check"
    description: "Perform the periodic patient recall appliance check"
    roles: [Dentist]
    code: 200
    input: ["notes?"]
    output: Appliance
    side_effects:
      - "recall_status DUE -> NOT_DUE or LAPSED -> NOT_DUE; recall_cycle_index += 1"
      - "next_recall_due_on advanced per calculation recall_schedule"

  - method: GET
    path: "/appliances/{appliance_id}/adherence-summary"
    description: "Both adherence readings side by side: the payer's window-denominator figure and the clinic's recorded-denominator figure, from the newest download of each source"
    roles: [Dentist, SleepPhysician, BillingSpecialist, PlatformAdmin]
    code: 200
    input: []
    output: { appliance_id: string, objective_rate_of_window: number, objective_rate_of_recorded: number, objective_compliant: boolean, attested_rate_of_window: number, attested_compliant: boolean, window_start: string, window_end: string }
    side_effects: []

  # --- Titration ---
  - method: POST
    path: "/titration-visits"
    description: "Schedule the next advancement visit. OCC parent is the Appliance: creating a visit supersedes any visit still SCHEDULED or HELD."
    roles: [Dentist]
    code: 201
    input: [appliance_id, performed_by_dentist_id, scheduled_for, requested_increment_mm, expected_appliance_version]
    output: TitrationVisit
    side_effects:
      - "visit_seq assigned as the count of prior visits on the appliance plus one, ordered by created_at ASC"
      - "any TitrationVisit on the same appliance in SCHEDULED or HELD transitions to SUPERSEDED"
      - "increments Appliance.version by 1"

  - method: GET
    path: "/titration-visits/{visit_id}"
    description: "Read one titration visit"
    roles: [Dentist, ClinicCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: TitrationVisit
    side_effects: []

  - method: GET
    path: "/titration-visits"
    description: "List titration visits by appliance, performing dentist or status"
    roles: [Dentist, ClinicCoordinator, PlatformAdmin]
    code: 200
    input: ["appliance_id?", "performed_by_dentist_id?", "status?", "limit?", "offset?"]
    output: "TitrationVisit[]"
    side_effects: []

  - method: POST
    path: "/titration-visits/{visit_id}/apply"
    description: "Advance the appliance at the chair. The side-effect report decides which of three outcomes the visit takes."
    roles: [Dentist]
    code: 200
    input: [side_effect_severity]
    output: TitrationVisit
    side_effects:
      - "applied_increment_mm and the resulting status computed per calculation titration_applied_increment"
      - "Appliance.current_advancement_mm and applied_visit_count recomputed per calculation cumulative_advancement"
      - "first applied visit moves the appliance DELIVERED -> IN_TITRATION"
      - "evaluates ladder rungs 21 and 22"

  # --- Adherence ---
  - method: POST
    path: "/adherence-downloads"
    description: "Record a rolling-window adherence figure, either downloaded from the microrecorder or attested by the patient"
    roles: [Dentist, ClinicCoordinator, Patient]
    code: 201
    input: [appliance_id, source, window_start, window_end, nights_recorded, nights_at_or_above_min_hours, mean_hours_per_worn_night]
    output: AdherenceDownload
    side_effects:
      - "computes rate_of_window, rate_of_recorded and compliant per calculation adherence_rate"
      - "a source of OBJECTIVE_MICRORECORDER is rejected with ERR_VALIDATION when the appliance has has_microrecorder == false"

  - method: GET
    path: "/adherence-downloads/{adherence_download_id}"
    description: "Read one adherence record"
    roles: [Dentist, BillingSpecialist, PlatformAdmin, Patient]
    code: 200
    input: []
    output: AdherenceDownload
    side_effects: []

  - method: GET
    path: "/adherence-downloads"
    description: "List adherence records by appliance or source"
    roles: [Dentist, BillingSpecialist, PlatformAdmin, Patient]
    code: 200
    input: ["appliance_id?", "source?", "limit?", "offset?"]
    output: "AdherenceDownload[]"
    side_effects: []

  # --- Efficacy reports (cross-provider loop) ---
  - method: POST
    path: "/efficacy-reports"
    description: "Draft the efficacy report the dentist owes the referring physician. OCC parent is the Referral: a new report supersedes a DISPUTED one."
    roles: [Dentist]
    code: 201
    input: [referral_id, appliance_id, efficacy_study_id, expected_referral_version]
    output: EfficacyReport
    side_effects:
      - "computes baseline_index, residual_index, pct_reduction, both criterion flags and outcome per calculation efficacy_outcome"
      - "computes due_by per calculation efficacy_report_due_date"
      - "any EfficacyReport on the same referral in status DISPUTED transitions to SUPERSEDED"
      - "increments Referral.version by 1"

  - method: GET
    path: "/efficacy-reports/{report_id}"
    description: "Read one efficacy report"
    roles: [Dentist, SleepPhysician, ClinicCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: EfficacyReport
    side_effects: []

  - method: GET
    path: "/efficacy-reports"
    description: "List efficacy reports by patient, referral, appliance, study or status"
    roles: [Dentist, SleepPhysician, ClinicCoordinator, PlatformAdmin]
    code: 200
    input: ["patient_id?", "referral_id?", "appliance_id?", "efficacy_study_id?", "status?", "limit?", "offset?"]
    output: "EfficacyReport[]"
    side_effects: []

  - method: POST
    path: "/efficacy-reports/{report_id}/submit"
    description: "Send the report to the referring physician. The same call re-submits a disputed report."
    roles: [Dentist]
    code: 200
    input: []
    output: EfficacyReport
    side_effects:
      - "DRAFT -> SUBMITTED, or DISPUTED -> SUBMITTED with revision_count += 1"
      - "the appliance transitions TITRATION_PLATEAU -> EFFICACY_PENDING on the first submission"
      - "Provider.open_efficacy_loop_count recomputed for the referring physician"

  - method: POST
    path: "/efficacy-reports/{report_id}/physician-response"
    description: "The referring physician signs off or disputes. Signing closes the cross-provider loop."
    roles: [SleepPhysician]
    code: 200
    input: [decision, "dispute_reason?"]
    output: EfficacyReport
    side_effects:
      - "SUBMITTED -> SIGNED or SUBMITTED -> DISPUTED"
      - "CASCADE L1 on SIGNED: Referral ACCEPTED -> CLOSED and loop_status -> CLOSED"
      - "CASCADE L2: Appliance EFFICACY_PENDING -> ACTIVE_THERAPY"
      - "CASCADE L3: Appliance.recall_status NOT_SCHEDULED -> NOT_DUE with next_recall_due_on = clock date + FIRST_RECALL_DAYS"
      - "on DISPUTED with outcome PARTIAL: Appliance EFFICACY_PENDING -> IN_TITRATION and plateau_declared_on cleared"

  # --- Claims (medical benefit) ---
  - method: POST
    path: "/claims"
    description: "Draft a medical claim against the patient's medical payer"
    roles: [BillingSpecialist]
    code: 201
    input: [patient_id, payer_id, appliance_id, claim_type, hcpcs_code, date_of_service, billed_cents, "prior_auth_id?", "written_order_id?", "repair_order_id?"]
    output: Claim
    side_effects:
      - "status initialised to DRAFT; ladder rung 25 already rejects a dental payer at draft time"

  - method: GET
    path: "/claims/{claim_id}"
    description: "Read one claim and its money legs"
    roles: [BillingSpecialist, PlatformAdmin, Dentist]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/claims"
    description: "List claims by patient, payer, appliance, authorisation, written order, repair order or status"
    roles: [BillingSpecialist, PlatformAdmin, Dentist]
    code: 200
    input: ["patient_id?", "payer_id?", "appliance_id?", "prior_auth_id?", "written_order_id?", "repair_order_id?", "status?", "limit?", "offset?"]
    output: "Claim[]"
    side_effects: []

  - method: POST
    path: "/claims/{claim_id}/submit"
    description: "Submit the claim. This is where the whole DME documentation ladder runs, rungs 25 through 33, in strict order."
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "DRAFT -> SUBMITTED"
      - "computes allowed_cents and adjustment_cents per calculation claim_allowed_amount"
      - "rung 29 may persist the linked PriorAuth as EXPIRED and then reject"

  - method: POST
    path: "/claims/{claim_id}/adjudicate"
    description: "Record the payer's adjudication"
    roles: [PlatformAdmin]
    code: 200
    input: [outcome, "denial_error_id?"]
    output: Claim
    side_effects:
      - "on PAID computes the money legs per calculation claim_patient_responsibility and decrements Patient.deductible_remaining_cents"
      - "on DENIED persists denial_error_id and writes no money fields; lands in DENIED_FINAL instead when appeal_attempts already equals Payer.appeal_limit"

  - method: POST
    path: "/claims/{claim_id}/appeal"
    description: "Appeal a denied claim"
    roles: [BillingSpecialist]
    code: 200
    input: [narrative]
    output: Claim
    side_effects:
      - "DENIED -> APPEALED; appeal_attempts += 1"

  # --- Repairs, warranty and loaners ---
  - method: POST
    path: "/repair-orders"
    description: "Open a repair. The reason code decides at once whether the case goes to the lab or the device is written off."
    roles: [Dentist]
    code: 201
    input: [appliance_id, reason, reported_on, "labor_minutes?", "loaner_appliance_id?"]
    output: RepairOrder
    side_effects:
      - "computes in_warranty, billable, labor_units and repair_charge_cents per calculation repair_billability"
      - "OPEN -> IN_LAB for DEFECT, WEAR and ABUSE; OPEN -> CLOSED_NOT_COVERED for LOSS"
      - "on LOSS: CASCADE L2 the Appliance ACTIVE_THERAPY -> RETIRED, CASCADE L3 every DRAFT CONTINUED_USE Claim on it -> VOIDED"
      - "evaluates ladder rung 34 on the loaner interval"

  - method: GET
    path: "/repair-orders/{repair_order_id}"
    description: "Read one repair order"
    roles: [Dentist, BillingSpecialist, PlatformAdmin]
    code: 200
    input: []
    output: RepairOrder
    side_effects: []

  - method: GET
    path: "/repair-orders"
    description: "List repair orders by device under repair, loaner device or status"
    roles: [Dentist, BillingSpecialist, PlatformAdmin]
    code: 200
    input: ["appliance_id?", "loaner_appliance_id?", "status?", "limit?", "offset?"]
    output: "RepairOrder[]"
    side_effects: []

  - method: POST
    path: "/repair-orders/{repair_order_id}/complete"
    description: "Close the repair and return any loaner"
    roles: [Dentist]
    code: 200
    input: [outcome]
    output: RepairOrder
    side_effects:
      - "IN_LAB -> CLOSED_REPAIRED or IN_LAB -> CLOSED_NOT_COVERED; returned_on set to the clock date, freeing the loaner interval"
      - "useful_lifetime_end_date on the appliance is explicitly NOT moved"

  # --- Payer audit holds (the global write gate) ---
  - method: POST
    path: "/audit-holds"
    description: "A payer opens a records audit on a patient, freezing every clinical and billing write for that patient"
    roles: [PlatformAdmin]
    code: 201
    input: [patient_id, payer_id, "scope_note?"]
    output: AuditHold
    side_effects:
      - "opened_on set to the clock date; Patient.records_frozen recomputed to true"

  - method: GET
    path: "/audit-holds/{audit_hold_id}"
    description: "Read one audit hold"
    roles: [PlatformAdmin, BillingSpecialist]
    code: 200
    input: []
    output: AuditHold
    side_effects: []

  - method: GET
    path: "/audit-holds"
    description: "List audit holds by patient, payer or status"
    roles: [PlatformAdmin, BillingSpecialist]
    code: 200
    input: ["patient_id?", "payer_id?", "status?", "limit?", "offset?"]
    output: "AuditHold[]"
    side_effects: []

  - method: POST
    path: "/audit-holds/{audit_hold_id}/close"
    description: "Close the audit, thawing the patient's records"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: AuditHold
    side_effects:
      - "OPEN -> CLOSED; closed_on set to the clock date; Patient.records_frozen recomputed to false when no other OPEN hold remains"

# =============================================================================
# §1.6 Error Code Catalog — 37 codes
# =============================================================================
errors:

  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the seven declared roles"

  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"

  - id: ERR_NOT_CARE_TEAM
    http: 403
    condition: "the acting Dentist, SleepPhysician, LabTechnician or Patient is outside the care-team scope of the row (rung 6)"

  - id: ERR_PATIENT_NOT_FOUND
    http: 404
    condition: "a patient_id in the path or body does not resolve"

  - id: ERR_PROVIDER_NOT_FOUND
    http: 404
    condition: "a provider_id, referring_physician_id, treating_dentist_id, ordering_physician_id, lab_provider_id or performed_by_dentist_id does not resolve"

  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "a referral_id in the path or body does not resolve"

  - id: ERR_APPLIANCE_NOT_FOUND
    http: 404
    condition: "an appliance_id, replaces_appliance_id or loaner_appliance_id does not resolve"

  - id: ERR_RECORD_NOT_FOUND
    http: 404
    condition: "any OTHER resource id fails to resolve. Exhaustively: payer_id, study_id / diagnostic_study_id / efficacy_study_id, written_order_id, prior_auth_id, lab_order_id, lot_id, visit_id, adherence_download_id, report_id, claim_id, repair_order_id and audit_hold_id. No other id routes here."

  - id: ERR_VALIDATION
    http: 400
    condition: "a required field is missing, has the wrong JSON type, or falls outside the numeric or calendar domains of rung 9"

  - id: ERR_INVALID_ENUM
    http: 422
    condition: "one of the enum fields exhaustively listed at rung 8 carries a value outside its declared member set"

  - id: ERR_DUPLICATE_IDENTIFIER
    http: 409
    condition: "a Provider.npi, Patient.mrn, ApplianceLot.lot_code or Appliance.serial_number collides with an existing row"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_appliance_version, expected_patient_version or expected_referral_version does not match the OCC parent's current version"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "the path resource, or the parent that governs it, is not in a status that admits this transition"

  - id: ERR_RECORDS_FROZEN
    http: 409
    condition: "the patient in scope has an OPEN AuditHold and the request is a mutation (rung 5, the global write gate)"

  - id: ERR_DEVICE_RECALL_HOLD
    http: 409
    condition: "the appliance in scope is in device_hold_status RECALL_HOLD and the request is anything other than recall-remediate (rung 13)"

  - id: ERR_PROVIDER_TYPE_MISMATCH
    http: 422
    condition: "a provider slot is filled by the wrong provider_type, or by a Provider whose status is SUSPENDED"

  - id: ERR_SELF_REFERRAL
    http: 422
    condition: "the referring physician and treating dentist are the same Provider, or the acting physician signing an efficacy report is the referral's treating dentist"

  - id: ERR_DIAGNOSIS_REQUIRED
    http: 422
    condition: "the grounding study is not a DIAGNOSTIC study, or its severity_band is NONE, so there is no physician OSA diagnosis to treat"

  - id: ERR_STUDY_NON_DIAGNOSTIC
    http: 422
    condition: "the grounding study is in status ORDERED or NON_DIAGNOSTIC — the recording failed its modality quality gate"

  - id: ERR_DIAGNOSIS_EXPIRED
    http: 422
    condition: "the clock has passed Referral.diagnosis_valid_until; the referral is persisted as EXPIRED and then the request is rejected (rung 18)"

  - id: ERR_CPAP_TRIAL_REQUIRED
    http: 422
    condition: "the severity x CPAP-history fork admits no eligibility basis: SEVERE without documented, fresh, long-enough PAP failure/intolerance/refusal, or MILD without symptoms and without any PAP history"

  - id: ERR_ACTIVE_APPLIANCE_EXISTS
    http: 409
    condition: "the patient already holds a live appliance and the request does not name it as replaces_appliance_id"

  - id: ERR_TITRATION_INTERVAL
    http: 422
    condition: "fewer than MIN_TITRATION_INTERVAL_DAYS days have passed since the appliance's last APPLIED or REDUCED visit"

  - id: ERR_PROTRUSION_LIMIT_EXCEEDED
    http: 422
    condition: "the bounded increment would push current_advancement_mm past the appliance's max_protrusive_mm"

  - id: ERR_PLATEAU_REQUIRED
    http: 422
    condition: "fewer than PLATEAU_MIN_VISITS applied visits when declaring plateau, or an efficacy report drafted on an appliance not at TITRATION_PLATEAU or EFFICACY_PENDING"

  - id: ERR_EFFICACY_LOOP_OPEN
    http: 409
    condition: "the referring physician has not signed the efficacy report, so Referral.loop_status is still OPEN"

  - id: ERR_DENTAL_PAYER_ROUTING
    http: 422
    condition: "a claim or authorisation names a payer whose payer_kind is DENTAL, or a medical payer that is not the patient's medical_payer_id — oral appliance therapy is a medical benefit"

  - id: ERR_SWO_MISSING
    http: 422
    condition: "no SIGNED WrittenOrder exists for this patient and item"

  - id: ERR_SWO_AFTER_DELIVERY
    http: 422
    condition: "the standard written order was written after the device was delivered"

  - id: ERR_F2F_ENCOUNTER_STALE
    http: 422
    condition: "the face-to-face encounter supporting the written order is more than F2F_LOOKBACK_DAYS older than the order date"

  - id: ERR_PRIOR_AUTH_REQUIRED
    http: 422
    condition: "the payer requires prior authorisation and none is APPROVED, or the approval has passed approval_valid_until (which is persisted as EXPIRED first)"

  - id: ERR_POD_MISSING
    http: 422
    condition: "no proof of delivery is on file for the appliance"

  - id: ERR_USEFUL_LIFETIME_NOT_ELAPSED
    http: 422
    condition: "a payer-funded replacement is claimed on or before the predecessor's useful_lifetime_end_date"

  - id: ERR_REPAIR_NOT_BILLABLE
    http: 422
    condition: "a REPAIR claim is submitted against an in-warranty defect repair, which the manufacturer covers"

  - id: ERR_ADHERENCE_NOT_MET
    http: 422
    condition: "continued coverage is claimed without a compliant objective adherence download, or with the appliance's patient recall LAPSED"

  - id: ERR_LOANER_UNAVAILABLE
    http: 409
    condition: "the requested loaner appliance is already occupied by an overlapping repair order interval"

  - id: ERR_APPEAL_LIMIT_REACHED
    http: 409
    condition: "an appeal is filed after appeal_attempts has reached the payer's appeal_limit"

# =============================================================================
# §1.7 RBAC Matrix — 7 roles, segregation of duties
# =============================================================================
roles:

  - name: PlatformAdmin
    description: "Operator of the platform; also stands in for the payer's adjudication desk and the manufacturer's safety office"
    identity: opaque
    exclusive_operations:
      - "POST /providers"
      - "POST /payers"
      - "POST /appliance-lots"
      - "POST /appliance-lots/{lot_id}/recall"
      - "POST /prior-auths/{prior_auth_id}/decision"
      - "POST /claims/{claim_id}/adjudicate"
      - "POST /audit-holds"
      - "POST /audit-holds/{audit_hold_id}/close"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /patients"
      - "every GET endpoint"

  - name: SleepPhysician
    description: "The only role permitted to diagnose OSA, to refer, to write DME orders and to sign off an efficacy report"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /sleep-studies"
      - "POST /sleep-studies/{study_id}/results"
      - "POST /sleep-studies/{study_id}/reorder"
      - "POST /referrals"
      - "POST /written-orders"
      - "POST /written-orders/{written_order_id}/sign"
      - "POST /efficacy-reports/{report_id}/physician-response"
    shared_operations:
      - "GET on patients, providers, sleep studies, referrals, written orders, appliances and efficacy reports within care-team scope"

  - name: Dentist
    description: "The treating dental sleep provider; takes records, fabricates, delivers, titrates and reports — and may never diagnose or sign off his own work"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /referrals/{referral_id}/respond"
      - "POST /lab-orders"
      - "POST /lab-orders/{lab_order_id}/submit"
      - "POST /lab-orders/{lab_order_id}/receive"
      - "POST /appliances"
      - "POST /appliances/{appliance_id}/deliver"
      - "POST /appliances/{appliance_id}/plateau"
      - "POST /appliances/{appliance_id}/recall-remediate"
      - "POST /appliances/{appliance_id}/recall-check"
      - "POST /titration-visits"
      - "POST /titration-visits/{visit_id}/apply"
      - "POST /efficacy-reports"
      - "POST /efficacy-reports/{report_id}/submit"
      - "POST /repair-orders"
      - "POST /repair-orders/{repair_order_id}/complete"
    shared_operations:
      - "POST /appliances/{appliance_id}/proof-of-delivery"
      - "POST /adherence-downloads"
      - "GET on the clinical and billing surface within care-team scope"

  - name: LabTechnician
    description: "The dental laboratory that fabricates and ships the appliance"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /lab-orders/{lab_order_id}/ship"
    shared_operations:
      - "GET /lab-orders, GET /lab-orders/{lab_order_id}, GET /providers/{provider_id}, GET /appliance-lots/{lot_id}"

  - name: BillingSpecialist
    description: "Files authorisations and medical claims; never touches clinical state"
    identity: opaque
    exclusive_operations:
      - "POST /prior-auths"
      - "POST /prior-auths/{prior_auth_id}/appeal"
      - "POST /claims"
      - "POST /claims/{claim_id}/submit"
      - "POST /claims/{claim_id}/appeal"
    shared_operations:
      - "GET on patients, payers, referrals, written orders, prior auths, appliances, adherence, claims, repair orders and audit holds"

  - name: ClinicCoordinator
    description: "Front-desk staff: registers patients, captures proof of delivery, enters adherence paperwork"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /patients"
      - "POST /appliances/{appliance_id}/proof-of-delivery"
      - "POST /adherence-downloads"
      - "GET on patients, payers, sleep studies, referrals, lab orders, appliances, titration visits and efficacy reports"

  - name: Patient
    description: "The patient, who may attest to his own wear time and read his own records"
    identity: "entity_backed:Patient"
    exclusive_operations: []
    shared_operations:
      - "POST /adherence-downloads with source PATIENT_ATTESTED"
      - "GET /patients/{patient_id}, GET /appliances/{appliance_id}, GET /adherence-downloads and GET /adherence-downloads/{adherence_download_id}, all restricted to his own rows"

