  # ===========================================================================
  - section: calculations
    instances:
      - name: envelope_class_threshold_triplet_at_the_standard_width_ceiling
        claim_type: Correct Result
        grounds:
          - calculations.module_envelope_class
          - endpoints[POST /modular/modules]
        distinguishing_aspect: |
          The width ceiling is compared with a strict >, so 192 in is the last STANDARD width and
          193 in is the first OVERWIDTH one. Three modules created one inch apart pin the
          threshold-1 / threshold / threshold+1 triple, and length_in never participates.
        test_recipe:
          setup: ["clock at 2026-09-01T08:00:00Z; Project with a DRAFT design package"]
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000 }
              as: ProgramAdmin
              captures: { fac: "$.data.id" }
            - call: "POST /modular/projects"
              payload: { name: "Rainier Flats", factory_id: "${fac}", state_code: "WA", ahj_code: "SEA", planned_module_count: 4, contract_price_cents: 3200000000, forecast_wind_gust_mph: 0, crane_capacity_chart: [{ radius_ft: 90, capacity_lb: 96000 }] }
              as: ProgramAdmin
              captures: { proj: "$.data.id", projv: "$.data.version" }
            - call: "POST /modular/design-packages"
              payload: { project_id: "${proj}", revision_index: 1, module_split_count: 4, expected_project_version: "${projv}", connection_detail_state: "COMPLETE" }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { pkg: "$.data.id" }
          trigger:
            - call: "POST /modular/modules"
              payload: { project_id: "${proj}", design_package_id: "${pkg}", module_code: "W-191", set_sequence_index: 1, width_in: 191, length_in: 720, height_in: 156, gross_weight_lb: 76600 }
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { c1: "$.data.envelope_class" }
            - call: "POST /modular/modules"
              payload: { project_id: "${proj}", design_package_id: "${pkg}", module_code: "W-192", set_sequence_index: 2, width_in: 192, length_in: 900, height_in: 156, gross_weight_lb: 76600 }
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { c2: "$.data.envelope_class" }
            - call: "POST /modular/modules"
              payload: { project_id: "${proj}", design_package_id: "${pkg}", module_code: "W-193", set_sequence_index: 3, width_in: 193, length_in: 600, height_in: 156, gross_weight_lb: 76600 }
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { c3: "$.data.envelope_class" }
          assert:
            - "${c1} == 'STANDARD' (threshold - 1) and ${c2} == 'STANDARD' (exactly at the 192 in ceiling)"
            - "${c3} == 'OVERWIDTH' (threshold + 1) — one inch flips the class"
            - "the 900 in length of W-192 does not raise its class: length_in is excluded from the tier test"

