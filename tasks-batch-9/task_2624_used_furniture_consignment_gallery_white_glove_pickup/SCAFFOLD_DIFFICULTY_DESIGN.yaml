  - rule_id: non_linear_state_machine
    instances:
      - name: item_lifecycle_and_inventory_dimensions_advance_independently
        grounds:
          - state_machines.ConsignmentItem.lifecycle_state
          - state_machines.ConsignmentItem.inventory_state
          - endpoints[POST /consignment-items/{id}/inventory-flag]
          - endpoints[POST /_ops/markdown-run]
          - calculations.floor_zone_utilization
        distinguishing_aspect: |
          The non-linearity is two parallel dimensions on one row plus a return edge:
          inventory_state leaves IN_CUSTODY for SHRINKAGE_MISSING and comes back, while
          lifecycle_state independently steps ON_FLOOR -> MARKED_DOWN under the markdown
          epoch. Neither dimension gates the other, the RECOVERED edge out of
          SHRINKAGE_MISSING mints no ledger entry at all (unlike the edge out of
          WRITTEN_OFF_INV), and the zone's occupied_sqft never moves because a missing
          piece is still nominally placed.
        test_recipe:
          setup:
            - "one consignor at floor 1 with no elevator on an ACTIVE STD-2026 agreement"
            - "item M1: SOFA, declared 189950, volume 55 cuft, footprint 24 sqft, screened and received at 7.0 / 6.5 / 6.0 -> 6.60 -> grade B -> list_price_cents 126317"
