        distinguishing_aspect: |
          Half-open interval semantics on PayoutCycle. Cycle A [2026-04-01, 2026-05-01) already
          DRAFT. Cycle B [2026-04-15, 2026-05-15) is submitted on the same Creator: the intersection
          [2026-04-15, 2026-05-01) is non-empty -> reject with ERR_PAYOUT_WINDOW_OVERLAP.
        test_recipe:
          setup:
