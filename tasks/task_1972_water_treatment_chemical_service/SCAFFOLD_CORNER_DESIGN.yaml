# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# task_1972_water_treatment_chemical_service
# Enumerative breadth coverage of every testable claim in §1.1–§1.7 not already
# covered by §1.8. Claim types per references/claim-extraction-guide.md.
# Standard setup shorthand "CORE" used in setup prose means: clock pinned at
# 2026-08-01T00:00:00Z, one account, one asset (recirc 300, vol 6000,
# MILD_STEEL), one product (active 10, container 55, unit 100, contract 90),
# one ONLINE feed station, one ACCEPTED design (coc 3.0, inhibitor 4,
# ph 7.0-9.5, cond 3000, fee 0), asset commissioned — the full chain is spelled
# out in setup_api_calls for each instance regardless.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: account_create_applies_defaults
        claim_type: creation_defaults
        grounds: [entities.CustomerAccount.fields.credit_hold, entities.CustomerAccount.fields.billing_model, entities.CustomerAccount.fields.status]
        distinguishing_aspect: "Omitting optional fields applies credit_hold=false, billing_model=PRODUCT, status=ACTIVE, open_balance_cents=0, version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /wt/accounts"
              payload: { account_name: "Defaults Co" }
              as: AccountManager
              captures: { e1_acct: $.data.id }
          trigger:
            - call: "GET /wt/accounts/${e1_acct}"
              payload: {}
              as: AccountManager
          assert:
            - "CustomerAccount.${e1_acct}.credit_hold == false"
            - "CustomerAccount.${e1_acct}.billing_model == PRODUCT"
            - "CustomerAccount.${e1_acct}.status == ACTIVE"
            - "CustomerAccount.${e1_acct}.open_balance_cents == 0"
            - "CustomerAccount.${e1_acct}.version == 1"

      - name: account_create_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.CustomerAccount.fields.account_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /wt/accounts without account_name is rejected ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /wt/accounts"
              payload: {}
              as: AccountManager
              captures: { e2_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "http status == 400"

      - name: asset_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET with a random UUID that exists in no table returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /wt/assets/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: WaterChemist
              captures: { e3_err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: asset_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.SystemAsset.fields.asset_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "asset_type=GEYSER is not in the enum set -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["account exists"]
          setup_api_calls:
            - call: "POST /wt/accounts"
              payload: { account_name: "Enum Co" }
              as: AccountManager
              captures: { e4_acct: $.data.id }
          trigger:
            - call: "POST /wt/assets"
              payload: { account_id: "${e4_acct}", asset_tag: "X", asset_type: "GEYSER", recirculation_rate_gpm: 100, system_volume_gal: 500, metallurgy: "MILD_STEEL" }
              as: WaterChemist
              captures: { e4_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: asset_tag_unique_per_account
        claim_type: type_constraints
        grounds: [entities.SystemAsset.fields.asset_tag, "errors[ERR_FIELD_CONSTRAINT]"]
        distinguishing_aspect: "Second asset with the same asset_tag on the same account -> ERR_FIELD_CONSTRAINT (422); same tag on a DIFFERENT account is allowed."
        test_recipe:
          setup: ["two accounts A,B; A has asset tagged CT-1"]
          setup_api_calls:
            - call: "POST /wt/accounts"
              payload: { account_name: "U1" }
              as: AccountManager
              captures: { e5_a: $.data.id }
            - call: "POST /wt/accounts"
              payload: { account_name: "U2" }
              as: AccountManager
              captures: { e5_b: $.data.id }
            - call: "POST /wt/assets"
              payload: { account_id: "${e5_a}", asset_tag: "CT-1", asset_type: "BOILER", recirculation_rate_gpm: 100, system_volume_gal: 500, metallurgy: "MILD_STEEL" }
              as: WaterChemist
          trigger:
            - call: "POST /wt/assets"
              payload: { account_id: "${e5_a}", asset_tag: "CT-1", asset_type: "BOILER", recirculation_rate_gpm: 100, system_volume_gal: 500, metallurgy: "MILD_STEEL" }
              as: WaterChemist
              captures: { e5_err: $.data.error_id }
            - call: "POST /wt/assets"
              payload: { account_id: "${e5_b}", asset_tag: "CT-1", asset_type: "BOILER", recirculation_rate_gpm: 100, system_volume_gal: 500, metallurgy: "MILD_STEEL" }
              as: WaterChemist
              captures: { e5_ok: $.data.id }
          assert:
            - "duplicate-tag error_id == ERR_FIELD_CONSTRAINT (422)"
            - "cross-account same tag succeeds: SystemAsset.${e5_ok}.asset_tag == CT-1"

      - name: telemetry_reading_immutable_no_update_endpoint
        claim_type: immutability
        grounds: [entities.TelemetryReading]
        distinguishing_aspect: "TelemetryReading has common_fields=false: no PUT/PATCH/DELETE endpoint exists; entity carries id+created_at only, no version."
        test_recipe:
          setup: ["station ONLINE with one reading posted"]
          setup_api_calls:
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /wt/accounts"
              payload: { account_name: "Imm Co" }
              as: AccountManager
              captures: { e6_acct: $.data.id }
            - call: "POST /wt/assets"
              payload: { account_id: "${e6_acct}", asset_tag: "CT-I", asset_type: "BOILER", recirculation_rate_gpm: 100, system_volume_gal: 500, metallurgy: "MILD_STEEL" }
              as: WaterChemist
              captures: { e6_asset: $.data.id }
            - call: "POST /wt/products"
              payload: { product_code: "I-1", active_pct: 10, container_size_gal: 55, unit_price_cents_per_gal: 100, contract_price_cents_per_gal: 90 }
              as: PlatformAdmin
              captures: { e6_prod: $.data.id }
            - call: "POST /wt/feed-stations"
              payload: { asset_id: "${e6_asset}", product_id: "${e6_prod}", capacity_cap_ml_per_min: 50 }
              as: WaterChemist
              captures: { e6_fs: $.data.id }
            - { call: "POST /wt/feed-stations/${e6_fs}/bring-online", payload: {}, as: WaterChemist }
            - call: "POST /wt/feed-stations/${e6_fs}/telemetry"
              payload: { recorded_at: "2026-08-01T01:00:00Z", feed_pulses: 10, ml_per_pulse: 1.0, level_gal: 50 }
              as: WaterChemist
              captures: { e6_reading: $.data.id }
          trigger:
            - call: "GET /wt/feed-stations/${e6_fs}/telemetry"
              payload: {}
              as: WaterChemist
          assert:
            - "GET telemetry list contains exactly 1 reading with id == ${e6_reading}"
            - "response item has no 'version' key and no 'updated_at' key (common_fields=false)"
            - "no PUT/PATCH/DELETE route exists for /wt/feed-stations/{id}/telemetry/{readingId} (structural claim)"

      - name: system_fields_server_stamped_input_ignored
        claim_type: system_fields
        grounds: [entities.CustomerAccount]
        distinguishing_aspect: "Client-supplied id/created_at/version in a create payload are ignored; server mints UUID id, created_at == logical clock, version == 1."
        test_recipe:
          setup: ["clock at 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /wt/accounts"
              payload: { account_name: "Stamp Co" }
              as: AccountManager
              captures: { e7_acct: $.data.id }
          assert:
            - "CustomerAccount.${e7_acct}.id != any client-supplied value; created_at == 2026-08-01T00:00:00Z (logical clock); version == 1"

      - name: pagination_defaults_and_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "GET list without params returns meta.api_request_id, response_type=array, and pagination fields with default limit=10, offset=0; has_more false when total <= 10."
        test_recipe:
          setup: ["one account exists"]
          setup_api_calls:
            - call: "POST /wt/accounts"
              payload: { account_name: "Page Co" }
              as: AccountManager
          trigger:
            - call: "GET /wt/accounts"
              payload: {}
              as: AccountManager
          assert:
            - "envelope contains meta.api_request_id and meta.api_request_timestamp"
            - "response_type == array; data is a list of length 1"
            - "limit == 10, offset == 0, total_count == 1, has_more == false"

      - name: list_filter_by_status
        claim_type: listing
        grounds: ["endpoints.GET /wt/delivery-orders"]
        distinguishing_aspect: "Filtered list returns only matching rows: status=CANCELLED filter excludes SCHEDULED orders."
        test_recipe:
          setup: ["account with asset+product+station ONLINE+design ACCEPTED; order O1 cancelled from DRAFT; order O2 submitted+scheduled"]
          setup_api_calls:
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /wt/accounts"
              payload: { account_name: "Filter Co" }
              as: AccountManager
              captures: { e9_acct: $.data.id }
            - call: "POST /wt/assets"
              payload: { account_id: "${e9_acct}", asset_tag: "CT-F", asset_type: "BOILER", recirculation_rate_gpm: 100, system_volume_gal: 500, metallurgy: "MILD_STEEL" }
              as: WaterChemist
              captures: { e9_asset: $.data.id }
            - call: "POST /wt/products"
              payload: { product_code: "F-1", active_pct: 10, container_size_gal: 55, unit_price_cents_per_gal: 100, contract_price_cents_per_gal: 90 }
              as: PlatformAdmin
              captures: { e9_prod: $.data.id }
            - call: "POST /wt/feed-stations"
              payload: { asset_id: "${e9_asset}", product_id: "${e9_prod}", capacity_cap_ml_per_min: 50 }
              as: WaterChemist
              captures: { e9_fs: $.data.id }
            - { call: "POST /wt/feed-stations/${e9_fs}/bring-online", payload: {}, as: WaterChemist }
            - call: "POST /wt/program-designs"
              payload: { asset_id: "${e9_asset}" }
              as: WaterChemist
              captures: { e9_pd: $.data.id }
            - { call: "POST /wt/program-designs/${e9_pd}/record-survey", payload: { survey_notes: "s" }, as: WaterChemist }
            - { call: "POST /wt/program-designs/${e9_pd}/draft", payload: { proposed_coc: 3.0, inhibitor_target_ppm: 4, ph_min: 7.0, ph_max: 9.5, conductivity_max_umhos: 3000, service_rate_cents_per_month: 0 }, as: WaterChemist }
            - call: "POST /wt/program-designs/${e9_pd}/propose"
              payload: {}
              as: WaterChemist
              captures: { e9_pd_v: $.data.version }
            - call: "POST /wt/program-designs/${e9_pd}/accept"
              payload: { expected_program_design_version: "${e9_pd_v}" }
              as: CustomerContact
              as_user_id: "${e9_acct}"
            - call: "POST /wt/delivery-orders"
              payload: { account_id: "${e9_acct}", station_id: "${e9_fs}", quantity_gal: 55 }
              as: AccountManager
              captures: { e9_o1: $.data.id }
            - { call: "POST /wt/delivery-orders/${e9_o1}/cancel", payload: {}, as: AccountManager }
            - call: "POST /wt/delivery-orders"
              payload: { account_id: "${e9_acct}", station_id: "${e9_fs}", quantity_gal: 110 }
              as: AccountManager
              captures: { e9_o2: $.data.id, e9_o2_v: $.data.version }
            - { call: "POST /wt/delivery-orders/${e9_o2}/submit", payload: {}, as: AccountManager }
            - { call: "POST /wt/delivery-orders/${e9_o2}/schedule", payload: { scheduled_for: "2026-08-10T00:00:00Z", expected_delivery_order_version: "${e9_o2_v}" }, as: AccountManager }
          trigger:
            - call: "GET /wt/delivery-orders"
              payload: { account_id: "${e9_acct}", status: "CANCELLED" }
              as: AccountManager
          assert:
            - "list contains exactly ${e9_o1}"
            - "list does not contain ${e9_o2}"

      - name: child_creation_with_bogus_parent_fk_returns_404
        claim_type: parent_relationships
        grounds: [entities.SystemAsset.fields.account_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /wt/assets with a non-existent account_id FK -> ERR_NOT_FOUND (404), body-FK existence validated after path ids."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /wt/assets"
              payload: { account_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", asset_tag: "X", asset_type: "BOILER", recirculation_rate_gpm: 100, system_volume_gal: 500, metallurgy: "MILD_STEEL" }
              as: WaterChemist
              captures: { e10_err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "http status == 404"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: terminal_state_lockdown_cancelled_delivery_rejects_all_actions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.DeliveryOrder, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From CANCELLED, submit/schedule/dispatch/cancel all reject with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["order O in CANCELLED (cancelled from DRAFT)"]
          setup_api_calls:
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /wt/accounts"
              payload: { account_name: "Term Co" }
              as: AccountManager
              captures: { s1_acct: $.data.id }
            - call: "POST /wt/assets"
              payload: { account_id: "${s1_acct}", asset_tag: "CT-T", asset_type: "BOILER", recirculation_rate_gpm: 100, system_volume_gal: 500, metallurgy: "MILD_STEEL" }
              as: WaterChemist
              captures: { s1_asset: $.data.id }
            - call: "POST /wt/products"
              payload: { product_code: "T-1", active_pct: 10, container_size_gal: 55, unit_price_cents_per_gal: 100, contract_price_cents_per_gal: 90 }
              as: PlatformAdmin
              captures: { s1_prod: $.data.id }
            - call: "POST /wt/feed-stations"
              payload: { asset_id: "${s1_asset}", product_id: "${s1_prod}", capacity_cap_ml_per_min: 50 }
              as: WaterChemist
              captures: { s1_fs: $.data.id }
            - call: "POST /wt/delivery-orders"
              payload: { account_id: "${s1_acct}", station_id: "${s1_fs}", quantity_gal: 55 }
              as: AccountManager
              captures: { s1_o: $.data.id }
            - { call: "POST /wt/delivery-orders/${s1_o}/cancel", payload: {}, as: AccountManager }
          trigger:
            - call: "POST /wt/delivery-orders/${s1_o}/submit"
              payload: {}
              as: AccountManager
              captures: { s1_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "DeliveryOrder.${s1_o}.status == CANCELLED"

      - name: invalid_transition_skip_arrive_to_sampled_impossible
        claim_type: invalid_transition
        grounds: [state_machines.RouteStop]
        distinguishing_aspect: "Recording a result on a SCHEDULED (never ARRIVED) stop is rejected ERR_INVALID_STATE — no direct SCHEDULED->SAMPLED path exists."
        test_recipe:
          setup: ["commissioned asset, PUBLISHED route, stop SCHEDULED with window containing current clock"]
          setup_api_calls:
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /wt/accounts"
              payload: { account_name: "Skip Co" }
              as: AccountManager
              captures: { s2_acct: $.data.id }
            - call: "POST /wt/assets"
              payload: { account_id: "${s2_acct}", asset_tag: "CT-S2", asset_type: "COOLING_TOWER", recirculation_rate_gpm: 300, system_volume_gal: 6000, metallurgy: "MILD_STEEL" }
              as: WaterChemist
              captures: { s2_asset: $.data.id }
            - call: "POST /wt/products"
              payload: { product_code: "S2-1", active_pct: 10, container_size_gal: 55, unit_price_cents_per_gal: 100, contract_price_cents_per_gal: 90 }
              as: PlatformAdmin
              captures: { s2_prod: $.data.id }
            - call: "POST /wt/feed-stations"
              payload: { asset_id: "${s2_asset}", product_id: "${s2_prod}", capacity_cap_ml_per_min: 50 }
              as: WaterChemist
              captures: { s2_fs: $.data.id }
            - call: "POST /wt/program-designs"
              payload: { asset_id: "${s2_asset}" }
              as: WaterChemist
              captures: { s2_pd: $.data.id }
            - { call: "POST /wt/program-designs/${s2_pd}/record-survey", payload: { survey_notes: "s" }, as: WaterChemist }
            - { call: "POST /wt/program-designs/${s2_pd}/draft", payload: { proposed_coc: 3.0, inhibitor_target_ppm: 4, ph_min: 7.0, ph_max: 9.5, conductivity_max_umhos: 3000, service_rate_cents_per_month: 0 }, as: WaterChemist }
            - call: "POST /wt/program-designs/${s2_pd}/propose"
              payload: {}
              as: WaterChemist
              captures: { s2_pd_v: $.data.version }
            - call: "POST /wt/program-designs/${s2_pd}/accept"
              payload: { expected_program_design_version: "${s2_pd_v}" }
              as: CustomerContact
              as_user_id: "${s2_acct}"
            - { call: "POST /wt/feed-stations/${s2_fs}/bring-online", payload: {}, as: WaterChemist }
            - { call: "POST /wt/assets/${s2_asset}/commission", payload: {}, as: WaterChemist }
            - call: "POST /wt/test-routes"
              payload: { account_id: "${s2_acct}", route_name: "S2-R" }
              as: WaterChemist
              captures: { s2_rt: $.data.id }
            - call: "POST /wt/test-routes/${s2_rt}/stops"
              payload: { asset_id: "${s2_asset}", window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-02T06:00:00Z", sequence_index: 1 }
              as: WaterChemist
              captures: { s2_st: $.data.id }
            - { call: "POST /wt/test-routes/${s2_rt}/publish", payload: {}, as: WaterChemist }
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T01:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /wt/route-stops/${s2_st}/water-test-results"
              payload: { asset_id: "${s2_asset}", ph: 8.0, conductivity_umhos: 2000, calcium_ppm: 300, alkalinity_ppm: 150, temperature_f: 90, inhibitor_residual_ppm: 4 }
              as: WaterChemist
              captures: { s2_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "RouteStop.${s2_st}.status == SCHEDULED"

      - name: initial_state_new_entities
        claim_type: initial_state
        grounds: [state_machines.ProgramDesign, state_machines.FeedStation, state_machines.Invoice, state_machines.LegionellaRiskPlan]
        distinguishing_aspect: "Freshly created entities start in their declared initial states: ProgramDesign SURVEY_SCHEDULED, FeedStation OFFLINE, Invoice DRAFT, LegionellaRiskPlan DRAFT."
        test_recipe:
          setup: ["account + asset exist"]
          setup_api_calls:
            - call: "POST /wt/accounts"
              payload: { account_name: "Init Co" }
              as: AccountManager
              captures: { s3_acct: $.data.id }
            - call: "POST /wt/assets"
              payload: { account_id: "${s3_acct}", asset_tag: "CT-I3", asset_type: "BOILER", recirculation_rate_gpm: 100, system_volume_gal: 500, metallurgy: "MILD_STEEL" }
              as: WaterChemist
              captures: { s3_asset: $.data.id }
          trigger:
            - call: "POST /wt/program-designs"
              payload: { asset_id: "${s3_asset}" }
              as: WaterChemist
              captures: { s3_pd: $.data.id }
            - call: "POST /wt/legionella-plans"
              payload: { asset_id: "${s3_asset}", plan_text: "p", validation_interval_days: 30 }
              as: WaterChemist
              captures: { s3_plan: $.data.id }
            - call: "POST /wt/invoices"
              payload: { account_id: "${s3_acct}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: AccountManager
              captures: { s3_inv: $.data.id }
          assert:
            - "ProgramDesign.${s3_pd}.status == SURVEY_SCHEDULED"
            - "LegionellaRiskPlan.${s3_plan}.status == DRAFT"
            - "Invoice.${s3_inv}.status == DRAFT"

      - name: idempotent_second_transition_rejected
        claim_type: idempotency
        grounds: [state_machines.FeedStation]
        distinguishing_aspect: "Calling bring-online twice: second call rejected ERR_INVALID_STATE because station is already ONLINE."
        test_recipe:
          setup: ["station ONLINE"]
          setup_api_calls:
            - call: "POST /wt/accounts"
              payload: { account_name: "Idem Co" }
              as: AccountManager
              captures: { s4_acct: $.data.id }
            - call: "POST /wt/assets"
              payload: { account_id: "${s4_acct}", asset_tag: "CT-I4", asset_type: "BOILER", recirculation_rate_gpm: 100, system_volume_gal: 500, metallurgy: "MILD_STEEL" }
              as: WaterChemist
              captures: { s4_asset: $.data.id }
            - call: "POST /wt/products"
              payload: { product_code: "I4-1", active_pct: 10, container_size_gal: 55, unit_price_cents_per_gal: 100, contract_price_cents_per_gal: 90 }
              as: PlatformAdmin
              captures: { s4_prod: $.data.id }
            - call: "POST /wt/feed-stations"
              payload: { asset_id: "${s4_asset}", product_id: "${s4_prod}", capacity_cap_ml_per_min: 50 }
              as: WaterChemist
              captures: { s4_fs: $.data.id }
            - { call: "POST /wt/feed-stations/${s4_fs}/bring-online", payload: {}, as: WaterChemist }
          trigger:
            - call: "POST /wt/feed-stations/${s4_fs}/bring-online"
              payload: {}
              as: WaterChemist
              captures: { s4_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "FeedStation.${s4_fs}.status == ONLINE"

      - name: route_completed_auto_when_all_stops_terminal
        claim_type: valid_transition_side_effects
        grounds: [state_machines.TestRoute, state_machines.RouteStop]
