            - call: "POST /correspondent-banking/respondents/${r_id}/monitoring-profiles"
              payload: { effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z", expected_corridors: [{ jurisdiction_code: "DE", expected_monthly_usd: 300000000.00, expected_monthly_count: 80000 }], expected_respondent_version: "${ver_b}" }
              as: ComplianceAnalyst
