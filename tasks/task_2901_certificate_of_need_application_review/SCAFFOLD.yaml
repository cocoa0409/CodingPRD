roles:

  - name: Applicant
    description: "Health care provider organization that files letters of intent, applications, cure responses, interventions, progress reports and appeals for itself"
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /letters-of-intent"
      - "POST /letters-of-intent/{id}/withdraw"
      - "POST /applications"
      - "POST /applications/{id}/submit"
      - "POST /applications/{id}/withdraw"
      - "POST /completeness-reviews/{id}/cure"
      - "POST /interventions"
      - "POST /progress-reports"
      - "POST /appeals"
    shared_operations:
      - "GET /applicants/{id}"
      - "GET /health-service-areas/{id}"
      - "GET /batching-cycles/{id}"
      - "GET /batching-cycles"
      - "GET /batching-cycles/{id}/need-analysis"
      - "GET /letters-of-intent/{id}"
      - "GET /letters-of-intent"
      - "GET /applications/{id}"
      - "GET /applications"
      - "GET /applications/{id}/completeness-reviews"
      - "GET /applications/{id}/public-comments"
      - "GET /interventions/{id}"
      - "GET /interventions"
      - "GET /public-hearings/{id}"
      - "GET /public-hearings"
      - "GET /certificates/{id}"
      - "GET /certificates"
      - "GET /certificates/{id}/progress-reports"
      - "GET /appeals/{id}"
      - "GET /appeals"

  - name: PublicParticipant
    description: "Member of the public who may only enter comments into the record during the comment period and read the public file"
    identity: "opaque"
    exclusive_operations:
      - "POST /applications/{id}/public-comments"
    shared_operations:
      - "GET /health-service-areas/{id}"
      - "GET /batching-cycles/{id}"
      - "GET /batching-cycles"
      - "GET /letters-of-intent"
      - "GET /applications/{id}"
      - "GET /applications"
      - "GET /applications/{id}/public-comments"
      - "GET /interventions/{id}"
      - "GET /interventions"
      - "GET /public-hearings/{id}"
      - "GET /public-hearings"
      - "GET /certificates/{id}"
      - "GET /certificates"
      - "GET /appeals/{id}"
      - "GET /appeals"

  - name: IntakeAnalyst
    description: "Program staffer who runs the batching cycle stages, completeness review, intervention rulings and hearing logistics; never scores and never decides"
    identity: "opaque"
    exclusive_operations:
      - "POST /batching-cycles/{id}/advance"
      - "POST /applications/{id}/completeness-reviews"
      - "POST /applications/{id}/deem-complete"
      - "POST /interventions/{id}/decide"
      - "POST /public-hearings"
      - "POST /public-hearings/{id}/cancel"
      - "POST /public-hearings/{id}/reschedule"
      - "POST /public-hearings/{id}/conclude"
    shared_operations:
      - "GET /health-service-areas/{id}"
      - "GET /applicants/{id}"
      - "GET /batching-cycles/{id}"
      - "GET /batching-cycles"
      - "GET /batching-cycles/{id}/need-analysis"
      - "GET /letters-of-intent/{id}"
      - "GET /letters-of-intent"
      - "GET /applications/{id}"
      - "GET /applications"
      - "GET /applications/{id}/completeness-reviews"
      - "GET /applications/{id}/public-comments"
      - "GET /applications/{id}/score-sheets"
      - "GET /interventions/{id}"
      - "GET /interventions"
      - "GET /public-hearings/{id}"
      - "GET /public-hearings"
      - "GET /certificates/{id}"
      - "GET /certificates"
      - "GET /certificates/{id}/progress-reports"
      - "GET /appeals/{id}"
