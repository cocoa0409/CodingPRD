# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Task: retail_pharmacy_immunization_scheduling_standing_orders_registry
# Cross-references §1.1–§1.7 of the sibling SCAFFOLD.yaml against the nine
# Difficulty Rules of §0.5. Two instances per rule (18 total).
# Difficulty instruction: "Generate task much harder than expert level!" —
# instances pick the deepest reachable preconditions and longest setup chains
# the scaffold's §1.5 surface supports.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (≥2 instances, DIFFERENT entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: adjudicated_charge_provisional_quote_vs_administered_divergence
        grounds:
          - calculations.adjudicated_charge
          - calculations.adjudicated_charge.variants.provisional_quote
          - entities.ImmunizationRecord.fields.charge_cents
          - entities.InsurancePlan.fields.deductible_remaining_cents
        distinguishing_aspect: |
          Dual-variant on the ImmunizationRecord/InsurancePlan (fiscal) domain:
          the provisional_quote variant treats deductible_remaining_cents as
          read-only, while the administered variant re-reads the plan row at
          administration time — a deductible that changes between quote and
          administration produces quoted_charge_cents 3600 but charge_cents 2400
          for identical product and patient.
        test_recipe:
          setup:
            - "Store S in CA (ACTIVE), product FLU (cvx 141, cash_price_cents 10000, min age 0, doses_per_series 1, fridge 2.0–8.0C, observation 15min)"
            - "Protocol CA+FLU ACTIVE, authority STANDING_ORDER, min_patient_age_years 0, registry HL7_VXU, deadline 24h"
            - "Plan MEDP: benefit_type MEDICAL, copay 0, coinsurance_pct 20, deductible_remaining_cents 2000, covered cvx [141]"
            - "Patient P1 DOB 1980-01-01 with insurance_plan_id = MEDP; appointment 2026-09-01T10:00 walk-in"
            - "Lot L1 of FLU at S, RELEASED, expires 2027-01-01, doses_received 10"
            - "Logical clock 2026-09-01T09:55:00Z; quote taken; plan deductible then changed to 500 before administration"
          setup_api_calls:
            - call: "POST /immunization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:55:00Z" }
              as: StoreManager
            - call: "POST /immunization/stores"
              payload: { store_number: "S-100", state_code: "CA", address_line: "1 Main St" }
              as: StoreManager
              captures: { store_s: $.data.id }
            - call: "POST /immunization/vaccine-products"
              payload: { cvx_code: "141", name: "Influenza Quadrivalent", min_patient_age_years: 0, doses_per_series: 1, cash_price_cents: 10000, fridge_temp_min_c: 2.0, fridge_temp_max_c: 8.0, observation_minutes: 15 }
              as: ComplianceOfficer
              captures: { prod_flu: $.data.id }
            - call: "POST /immunization/state-protocols"
              payload: { state_code: "CA", vaccine_product_id: "${prod_flu}", authority_type: "STANDING_ORDER", min_patient_age_years: 0, registry_format: "HL7_VXU", registry_deadline_hours: 24, max_doses_per_patient_per_day: 2 }
              as: ComplianceOfficer
            - call: "POST /immunization/insurance-plans"
              payload: { plan_name: "MEDP", benefit_type: "MEDICAL", copay_cents: 0, coinsurance_pct: 20, deductible_remaining_cents: 2000, covered_cvx_codes: ["141"] }
              as: ComplianceOfficer
              captures: { plan_p: $.data.id }
            - call: "POST /immunization/patients"
              payload: { full_name: "Pat One", date_of_birth: "1980-01-01", state_code: "CA", insurance_plan_id: "${plan_p}" }
              as: PharmacyTechnician
              captures: { pat_p1: $.data.id }
            - call: "POST /immunization/stores/${store_s}/lots"
              payload: { vaccine_product_id: "${prod_flu}", lot_number: "L1", expiration_date: "2027-01-01", doses_received: 10 }
              as: StoreManager
            - call: "POST /immunization/appointments"
              payload: { store_id: "${store_s}", patient_id: "${pat_p1}", vaccine_product_id: "${prod_flu}", slot_start: "2026-09-01T10:00:00Z", is_walk_in: true }
              as: PharmacyTechnician
              captures: { appt_a: $.data.id, appt_a_v: $.data.version }
            - call: "GET /immunization/appointments/${appt_a}/price-quote"
              as: PharmacyTechnician
              captures: { quote_cents: $.data.quoted_charge_cents }
            - call: "PUT /immunization/insurance-plans/${plan_p}"
              payload: { deductible_remaining_cents: 500 }
              as: ComplianceOfficer
            - call: "POST /immunization/appointments/${appt_a}/check-in"
              as: PharmacyTechnician
              as_user_id: "user-tech-1"
            - call: "POST /immunization/appointments/${appt_a}/questionnaire"
              payload: { answers: { FEVER_TODAY: false, PREGNANT: false, IMMUNOCOMPROMISED: false, PRIOR_ANAPHYLAXIS: false } }
              as: PharmacyTechnician
            - call: "POST /immunization/appointments/${appt_a}/review-consent"
              payload: { expected_appointment_version: "${appt_a_v + 2}", outcome: "CLEAR" }
              as: Pharmacist
              as_user_id: "user-pharm-1"
          trigger:
            - call: "GET /immunization/lots"
              payload: {}
              as: Immunizer
              captures: { lot_v_now: "$.data[0].version", lot_id_now: "$.data[0].id" }
            - call: "POST /immunization/appointments/${appt_a}/administer"
              payload: { lot_id: "${lot_id_now}", expected_lot_version: "${lot_v_now}" }
              as: Immunizer
              as_user_id: "user-imm-1"
              captures: { rec_id: $.data.id, rec_charge: $.data.charge_cents, rec_channel: $.data.billing_channel }
          assert:
            - "captured quote_cents == 3600 (quote: deductible_applied = min(2000, 10000) = 2000; remainder 8000; coinsurance floor(8000 * 20 / 100) = 1600; 2000 + 1600 = 3600)"
            - "captured rec_charge == 2400 (administered: deductible re-read as 500; remainder 9500; coinsurance floor(9500 * 20 / 100) = 1900; 500 + 1900 = 2400)"
            - "captured rec_channel == MEDICAL_BENEFIT"
            - "quote_cents != rec_charge — the two variants diverge on identical product and patient"

      - name: excursion_severity_peak_delta_vs_cumulative_minutes_divergence
        grounds:
          - calculations.excursion_severity_charge
          - calculations.excursion_severity_charge.variants.cumulative_excursion_minutes
          - entities.VaccineLot.fields.last_excursion_severity_tier
          - entities.TemperatureReading.fields.excursion_severity_tier
        distinguishing_aspect: |
          Dual-variant on the VaccineLot/TemperatureReading (safety) domain — a
          different entity domain from the fiscal adjudication instance: a
          shallow-but-long excursion (75 minutes 1.0C above the max) tiers MINOR
          under the peak-delta base variant but MODERATE under the
          cumulative_excursion_minutes variant selected by
          excursion_disposition = RELEASE_OK_CUMULATIVE at release time.
        test_recipe:
          setup:
            - "Store S (CA, ACTIVE); product FLU with fridge band 2.0–8.0C"
            - "Lot L1 of FLU at S, RELEASED, 10 doses, expires 2027-01-01"
            - "Three readings posted: 10:00 at 9.0C, 10:45 at 9.0C, 11:15 at 7.0C — out-of-band run spans 75 minutes; peak delta is 1.0C"
            - "Lot is QUARANTINED (auto, reason EXCURSION) after the first excursion reading"
          setup_api_calls:
            - call: "POST /immunization/stores"
              payload: { store_number: "S-200", state_code: "CA", address_line: "2 Main St" }
              as: StoreManager
              captures: { store_s: $.data.id }
            - call: "POST /immunization/vaccine-products"
              payload: { cvx_code: "141", name: "Influenza Quadrivalent", min_patient_age_years: 0, doses_per_series: 1, cash_price_cents: 5000, fridge_temp_min_c: 2.0, fridge_temp_max_c: 8.0, observation_minutes: 15 }
              as: ComplianceOfficer
              captures: { prod_flu: $.data.id }
            - call: "POST /immunization/stores/${store_s}/lots"
              payload: { vaccine_product_id: "${prod_flu}", lot_number: "L1", expiration_date: "2027-01-01", doses_received: 10 }
              as: StoreManager
              captures: { lot_l1: $.data.id }
            - call: "POST /immunization/lots/${lot_l1}/temperature-readings"
              payload: { recorded_at: "2026-09-01T10:00:00Z", temperature_c: 9.0 }
              as: StoreManager
            - call: "POST /immunization/lots/${lot_l1}/temperature-readings"
              payload: { recorded_at: "2026-09-01T10:45:00Z", temperature_c: 9.0 }
              as: StoreManager
            - call: "POST /immunization/lots/${lot_l1}/temperature-readings"
              payload: { recorded_at: "2026-09-01T11:15:00Z", temperature_c: 7.0 }
              as: StoreManager
          trigger:
            - call: "POST /immunization/lots/${lot_l1}/release"
              payload: { excursion_disposition: "RELEASE_OK_CUMULATIVE" }
              as: StoreManager
              captures: { lot_status: $.data.status, lot_tier: $.data.last_excursion_severity_tier }
          assert:
            - "captured lot_status == RELEASED"
            - "captured lot_tier == MODERATE (cumulative variant: 45min + 30min = 75 out-of-band minutes; 30 < 75 <= 120)"
            - "peak-delta base variant on identical data tiers MINOR (max delta 9.0 - 8.0 = 1.0 <= 2.0) — the two variants diverge on the same reading set"
            - "TemperatureReading[0].excursion_severity_tier == MINOR (the reading's own peak-delta tier is unchanged by the release disposition)"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (≥2 instances, DIFFERENT modes a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: adjudicated_charge_waterfall_pinned_channel_order_both_plan
        grounds:
          - calculations.adjudicated_charge
          - entities.InsurancePlan.fields.benefit_type
          - entities.ImmunizationRecord.fields.billing_channel
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs and non-linear interaction
          (waterfall channel selection + nested min + conditional deductible
          branch): a benefit_type BOTH plan ALWAYS resolves to PHARMACY_BENEFIT
          (charge = min(copay, price) = 1800) even though the medical channel
          on the same inputs would charge 4000 — the pinned evaluation order,
          not cost-minimization, decides.
        test_recipe:
          setup:
            - "Store S (CA); product SHINGLES-like P1: cvx 999, cash_price_cents 4000, min age 50, doses_per_series 1, fridge 2.0–8.0C"
            - "Protocol CA+P1 ACTIVE, STANDING_ORDER, min age 50, deadline 24h"
            - "Plan BOTHP: benefit_type BOTH, copay_cents 1800, coinsurance_pct 10, deductible_remaining_cents 5000, covered cvx [999]"
            - "Patient DOB 1970-01-01 (age 56) on plan BOTHP; walk-in appointment at 10:00; lot L1 RELEASED with 5 doses"
            - "Clock at 2026-09-01T09:55:00Z; appointment checked in by user-tech-1, screened, reviewed by user-pharm-1"
          setup_api_calls:
            - call: "POST /immunization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:55:00Z" }
              as: StoreManager
            - call: "POST /immunization/stores"
              payload: { store_number: "S-300", state_code: "CA", address_line: "3 Main St" }
              as: StoreManager
              captures: { store_s: $.data.id }
            - call: "POST /immunization/vaccine-products"
              payload: { cvx_code: "999", name: "Product P1", min_patient_age_years: 50, doses_per_series: 1, cash_price_cents: 4000, fridge_temp_min_c: 2.0, fridge_temp_max_c: 8.0, observation_minutes: 15 }
              as: ComplianceOfficer
              captures: { prod_p1: $.data.id }
            - call: "POST /immunization/state-protocols"
              payload: { state_code: "CA", vaccine_product_id: "${prod_p1}", authority_type: "STANDING_ORDER", min_patient_age_years: 50, registry_format: "STATE_API_JSON", registry_deadline_hours: 24, max_doses_per_patient_per_day: 2 }
              as: ComplianceOfficer
            - call: "POST /immunization/insurance-plans"
              payload: { plan_name: "BOTHP", benefit_type: "BOTH", copay_cents: 1800, coinsurance_pct: 10, deductible_remaining_cents: 5000, covered_cvx_codes: ["999"] }
              as: ComplianceOfficer
              captures: { plan_b: $.data.id }
            - call: "POST /immunization/patients"
              payload: { full_name: "Pat Two", date_of_birth: "1970-01-01", state_code: "CA", insurance_plan_id: "${plan_b}" }
              as: PharmacyTechnician
              captures: { pat_p2: $.data.id }
            - call: "POST /immunization/stores/${store_s}/lots"
              payload: { vaccine_product_id: "${prod_p1}", lot_number: "L1", expiration_date: "2027-01-01", doses_received: 5 }
              as: StoreManager
            - call: "POST /immunization/appointments"
              payload: { store_id: "${store_s}", patient_id: "${pat_p2}", vaccine_product_id: "${prod_p1}", slot_start: "2026-09-01T10:00:00Z", is_walk_in: true }
              as: PharmacyTechnician
              captures: { appt_a: $.data.id, appt_a_v: $.data.version }
            - call: "POST /immunization/appointments/${appt_a}/check-in"
              as: PharmacyTechnician
              as_user_id: "user-tech-1"
            - call: "POST /immunization/appointments/${appt_a}/questionnaire"
              payload: { answers: { FEVER_TODAY: false, PREGNANT: false, IMMUNOCOMPROMISED: false, PRIOR_ANAPHYLAXIS: false } }
              as: PharmacyTechnician
            - call: "POST /immunization/appointments/${appt_a}/review-consent"
              payload: { expected_appointment_version: "${appt_a_v + 2}", outcome: "CLEAR" }
              as: Pharmacist
              as_user_id: "user-pharm-1"
          trigger:
            - call: "GET /immunization/lots"
              payload: {}
              as: Immunizer
              captures: { lot_v_now: "$.data[0].version", lot_id_now: "$.data[0].id" }
            - call: "POST /immunization/appointments/${appt_a}/administer"
              payload: { lot_id: "${lot_id_now}", expected_lot_version: "${lot_v_now}" }
              as: Immunizer
              as_user_id: "user-imm-1"
              captures: { rec_charge: $.data.charge_cents, rec_channel: $.data.billing_channel }
          assert:
            - "captured rec_channel == PHARMACY_BENEFIT"
            - "captured rec_charge == 1800 (min(copay 1800, price 4000); medical channel would have been min(5000,4000) + floor(0 * 10/100) = 4000 — the pinned order, not the cheaper channel, wins)"

      - name: excursion_severity_nested_rounding_order_matters
        grounds:
          - calculations.excursion_severity_charge
          - entities.TemperatureReading.fields.excursion_severity_tier
          - entities.VaccineLot.fields.status
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: the scaffold pins
          round_half_up(delta_raw, 2) BEFORE tier comparison, so a reading
          10.004C against a max of 8.0C has delta_raw 2.004 which rounds to
          2.00 and tiers MINOR; tiering the raw value would produce MODERATE.
          The two orders genuinely diverge and the pinned order is observable
          through the reading's excursion_severity_tier.
        test_recipe:
          setup:
            - "Store S (CA); product FLU fridge band 2.0–8.0C; lot L1 RELEASED with 10 doses"
            - "A single temperature reading of 10.004C is posted (delta_raw = 10.004 − 8.0 = 2.004)"
          setup_api_calls:
            - call: "POST /immunization/stores"
              payload: { store_number: "S-400", state_code: "CA", address_line: "4 Main St" }
              as: StoreManager
              captures: { store_s: $.data.id }
            - call: "POST /immunization/vaccine-products"
              payload: { cvx_code: "141", name: "Influenza Quadrivalent", min_patient_age_years: 0, doses_per_series: 1, cash_price_cents: 5000, fridge_temp_min_c: 2.0, fridge_temp_max_c: 8.0, observation_minutes: 15 }
              as: ComplianceOfficer
              captures: { prod_flu: $.data.id }
            - call: "POST /immunization/stores/${store_s}/lots"
              payload: { vaccine_product_id: "${prod_flu}", lot_number: "L1", expiration_date: "2027-01-01", doses_received: 10 }
              as: StoreManager
              captures: { lot_l1: $.data.id }
          trigger:
            - call: "POST /immunization/lots/${lot_l1}/temperature-readings"
              payload: { recorded_at: "2026-09-01T10:00:00Z", temperature_c: 10.004 }
              as: StoreManager
              captures: { reading_tier: $.data.excursion_severity_tier, reading_exc: $.data.is_excursion }
          assert:
            - "captured reading_exc == true"
            - "captured reading_tier == MINOR (round_half_up(2.004, 2) = 2.00; 0 < 2.00 <= 2.0 → MINOR; comparing the raw 2.004 > 2.0 would give MODERATE)"
            - "VaccineLot.${lot_l1}.status == QUARANTINED (any excursion with delta_c > 0 auto-quarantines regardless of tier)"
            - "VaccineLot.${lot_l1}.last_excursion_severity_tier == MINOR"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (≥2 instances, DIFFERENT entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: registry_submission_reject_resubmit_cycle_late_stickiness
        grounds:
          - state_machines.RegistrySubmission.SUBMITTED_to_REJECTED
          - state_machines.RegistrySubmission.REJECTED_to_SUBMITTED
          - state_machines.RegistrySubmission.PENDING_to_LATE_UNRESOLVED
          - state_machines.RegistrySubmission.LATE_UNRESOLVED_to_SUBMITTED
          - calculations.registry_lateness
        distinguishing_aspect: |
          Cycle on RegistrySubmission (SUBMITTED → REJECTED → SUBMITTED →
          ACKNOWLEDGED) compounded with the lateness sweep (PENDING →
          LATE_UNRESOLVED → SUBMITTED): once the due_at passes, is_late
          sticks permanently — resubmitting after a rejection past the
          deadline still acknowledges with is_late == true, proving the
          cycle does not reset the lateness bit.
        test_recipe:
          setup:
            - "Full administration completed: store S (CA), product FLU (cvx 141), protocol deadline 4h, patient (no insurance → CASH 5000), lot L1, appointment administered at 2026-09-01T10:00:00Z"
            - "RegistrySubmission R created PENDING with due_at = 2026-09-01T14:00:00Z"
            - "R submitted at 10:30, rejected at 10:45 (SUBMITTED → REJECTED cycle)"
            - "Clock advanced past due_at to 15:00 — REJECTED submission sweeps to LATE_UNRESOLVED"
          setup_api_calls:
            - call: "POST /immunization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:55:00Z" }
              as: StoreManager
            - call: "POST /immunization/stores"
              payload: { store_number: "S-500", state_code: "CA", address_line: "5 Main St" }
              as: StoreManager
              captures: { store_s: $.data.id }
            - call: "POST /immunization/vaccine-products"
              payload: { cvx_code: "141", name: "Influenza Quadrivalent", min_patient_age_years: 0, doses_per_series: 1, cash_price_cents: 5000, fridge_temp_min_c: 2.0, fridge_temp_max_c: 8.0, observation_minutes: 15 }
              as: ComplianceOfficer
              captures: { prod_flu: $.data.id }
            - call: "POST /immunization/state-protocols"
              payload: { state_code: "CA", vaccine_product_id: "${prod_flu}", authority_type: "STANDING_ORDER", min_patient_age_years: 0, registry_format: "HL7_VXU", registry_deadline_hours: 4, max_doses_per_patient_per_day: 2 }
              as: ComplianceOfficer
            - call: "POST /immunization/patients"
              payload: { full_name: "Pat Three", date_of_birth: "1980-01-01", state_code: "CA" }
              as: PharmacyTechnician
              captures: { pat_p3: $.data.id }
            - call: "POST /immunization/stores/${store_s}/lots"
              payload: { vaccine_product_id: "${prod_flu}", lot_number: "L1", expiration_date: "2027-01-01", doses_received: 5 }
              as: StoreManager
              captures: { lot_l1: $.data.id }
            - call: "POST /immunization/appointments"
              payload: { store_id: "${store_s}", patient_id: "${pat_p3}", vaccine_product_id: "${prod_flu}", slot_start: "2026-09-01T10:00:00Z", is_walk_in: true }
              as: PharmacyTechnician
              captures: { appt_a: $.data.id, appt_a_v: $.data.version }
            - call: "POST /immunization/appointments/${appt_a}/check-in"
              as: PharmacyTechnician
              as_user_id: "user-tech-1"
            - call: "POST /immunization/appointments/${appt_a}/questionnaire"
              payload: { answers: { FEVER_TODAY: false, PREGNANT: false, IMMUNOCOMPROMISED: false, PRIOR_ANAPHYLAXIS: false } }
              as: PharmacyTechnician
            - call: "POST /immunization/appointments/${appt_a}/review-consent"
              payload: { expected_appointment_version: "${appt_a_v + 2}", outcome: "CLEAR" }
              as: Pharmacist
              as_user_id: "user-pharm-1"
            - call: "POST /immunization/appointments/${appt_a}/administer"
              payload: { lot_id: "${lot_l1}", expected_lot_version: 1 }
              as: Immunizer
              as_user_id: "user-imm-1"
              captures: { rec_id: $.data.id }
            - call: "POST /immunization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:30:00Z" }
              as: ComplianceOfficer
            - call: "GET /immunization/immunization-records/${rec_id}/registry-submissions"
              as: ComplianceOfficer
              captures: { sub_id: "$.data[0].id" }
            - call: "POST /immunization/registry-submissions/${sub_id}/submit"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /immunization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:45:00Z" }
              as: ComplianceOfficer
            - call: "POST /immunization/registry-submissions/${sub_id}/reject"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /immunization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T15:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /immunization/registry-submissions/${sub_id}"
              as: ComplianceOfficer
              captures: { sub_status_mid: $.data.status }
            - call: "POST /immunization/registry-submissions/${sub_id}/submit"
              payload: { corrected_payload: "MSH|^~\\&|CORRECTED" }
              as: ComplianceOfficer
            - call: "POST /immunization/registry-submissions/${sub_id}/acknowledge"
              payload: {}
              as: ComplianceOfficer
              captures: { sub_final_status: $.data.status, sub_late: $.data.is_late }
          assert:
            - "captured sub_status_mid == LATE_UNRESOLVED (due_at 14:00 < now 15:00 while REJECTED)"
            - "captured sub_final_status == ACKNOWLEDGED"
            - "captured sub_late == true — resubmission through the REJECTED → LATE_UNRESOLVED → SUBMITTED cycle never clears the lateness bit"
            - "RegistrySubmission.${sub_id}.due_at == 2026-09-01T14:00:00Z (administered 10:00 + 4h deadline)"

      - name: vaccine_lot_quarantine_release_retire_cycle_and_terminal_lock
        grounds:
          - state_machines.VaccineLot.RELEASED_to_QUARANTINED
          - state_machines.VaccineLot.QUARANTINED_to_RELEASED
          - state_machines.VaccineLot.QUARANTINED_to_RETIRED
          - state_machines.VaccineLot.RELEASED_to_RETIRED
        distinguishing_aspect: |
          Cycle on VaccineLot (RELEASED → QUARANTINED → RELEASED, repeatable,
          distinct entity from RegistrySubmission): a lot survives a manual
          quarantine + release round-trip with its doses_available intact, can
          be quarantined a second time by an excursion reading, and once
          RETIRED from QUARANTINED every further transition — including a
          repeat retire — is rejected with ERR_LOT_NOT_RETIRABLE.
        test_recipe:
          setup:
            - "Store S (CA); product FLU fridge band 2.0–8.0C"
            - "Lot L1 of FLU at S, RELEASED, doses_received 8, expires 2027-01-01"
          setup_api_calls:
            - call: "POST /immunization/stores"
              payload: { store_number: "S-600", state_code: "CA", address_line: "6 Main St" }
              as: StoreManager
              captures: { store_s: $.data.id }
