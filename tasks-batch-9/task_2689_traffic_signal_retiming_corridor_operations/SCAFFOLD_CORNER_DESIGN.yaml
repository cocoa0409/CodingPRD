      - name: segregation_of_duties_blocks_the_author_on_certify_waive_and_approve
        claim_type: segregation_of_duties
        grounds:
          - validations[priority 15 ERR_SEGREGATION_OF_DUTIES]
          - complexity_profile.role_model
          - entities.TimingPlan.fields.authored_by_user_id
          - entities.PriorityConfig.fields.proposed_by_user_id
        distinguishing_aspect: "The gate compares X-User-ID, not X-User-Role, so the SAME human wearing the CertifyingEngineer role is refused on the plan they authored while a DIFFERENT user id wearing that identical role succeeds on the very next call. It sits at priority 15, above every state gate, so an author attempting to certify a plan that is not even SUBMITTED yet is told ERR_SEGREGATION_OF_DUTIES and never ERR_PLAN_NOT_SUBMITTED. Its applies_to list is exactly three endpoints — certify, waive and approve — each keyed to a different authoring field (TimingPlan.authored_by_user_id for the first two, PriorityConfig.proposed_by_user_id for the third)."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "One SELECTED corridor with a single intersection; project p1 opened and advanced by eng-1; plan tp1 authored by eng-1 with splits 21/30/22/22 (coordinated cycle 105, effective 23/34/24/24)."
            - "Phase 2 is the pedestrian phase with crosswalk_length_ft 62 and provided ped_clear_sec 10.0, so its check FAILS: walking_speed_fps 3.5 gives required_ped_clear_sec ceil_tenth(62 / 3.5) == 17.8."
