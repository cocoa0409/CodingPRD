  - rule_id: compensating_invariant
    instances:
      - name: lane_volume_conservation_across_allocation_approve_and_reject
        conserved_quantity: "Lane.annual_volume_loads = Lane.unallocated_volume_loads + sum of allocated_volume_loads over the lane's allocations in {APPROVED, EXECUTED, ACTIVE, SUSPENDED_ROUTING}"
        grounds:
          - calculations.award_allocation_waterfall
          - state_machines.AwardAllocation.PROPOSED_to_APPROVED
          - state_machines.AwardAllocation.APPROVED_to_REJECTED
          - entities.Lane.fields.unallocated_volume_loads
          - entities.Lane.fields.awarded_coverage_pct
        distinguishing_aspect: |
          The conserved quantity is physical capacity — whole loads on a lane. Approval debits
          the lane and rejection credits exactly the same number back, so the invariant must
          hold before, between and after the pair with no drift of even one load. Nothing
          about money is involved, which is what separates this from the contract-value
          instance.
        test_recipe:
          setup:
            - "Single-lane awarded-pending event for ALFL: lane annual_volume_loads 550, one bid at 2.1152 committing 600 loads, max_award_share_pct 100.00, max_carriers_per_lane 1."
            - "Round closed, optimization run published as the routing guide, so exactly one PROPOSED PRIMARY allocation of 550 loads exists and the event is AWARDING."
