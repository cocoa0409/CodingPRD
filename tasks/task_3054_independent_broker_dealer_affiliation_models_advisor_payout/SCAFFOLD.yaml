    roles: [PlatformAdmin, AdvisorOps]
    code: 200
    input: [advisors]
    output:
      created_count: integer
      skipped_count: integer
      created_advisor_codes: string[]
      skipped_advisor_codes: string[]
    side_effects: ["each successfully parsed advisor is created in PROSPECT; a row whose branch or advisor code is invalid is skipped without rolling back the accepted rows"]

  - method: POST
    path: "/accounts"
