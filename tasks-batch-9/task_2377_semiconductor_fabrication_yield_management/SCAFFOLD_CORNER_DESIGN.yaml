scaffold_corner_design:

  # =====================================================================
  # Table 1 — Entities
  # =====================================================================
  - section: entities
    instances:
      - name: create_recipe_returns_201_with_all_declared_fields
        claim_type: creation
        grounds:
          - entities.Recipe
          - endpoints[POST /fab/recipes]
          - response_envelope.success
        distinguishing_aspect: "POST /fab/recipes with every input field supplied returns 201 and echoes recipe_code, tool_type, target_value and qual_expiry_days alongside the computed revision 1, status QUALIFIED, restricted_reason NONE and version 1."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
          trigger:
            - call: "POST /fab/recipes"
              payload: { recipe_code: "LITHO-200", tool_type: "LITHO", target_value: 50.00, qual_expiry_days: 120 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r_new: $.data.id }
          assert:
            - "HTTP status == 201"
            - "response_type == \"object\""
            - "Recipe.${r_new}.recipe_code == \"LITHO-200\""
            - "Recipe.${r_new}.tool_type == LITHO"
            - "Recipe.${r_new}.target_value == 50.00"
            - "Recipe.${r_new}.qual_expiry_days == 120"
            - "Recipe.${r_new}.revision == 1"
            - "Recipe.${r_new}.status == QUALIFIED"
            - "Recipe.${r_new}.restricted_reason == NONE"
            - "Recipe.${r_new}.version == 1"
            - "Recipe.${r_new}.created_at == \"2026-08-01T00:00:00Z\""

      - name: get_recipe_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.Recipe
          - endpoints[GET /fab/recipes/{id}]
        distinguishing_aspect: "GET /fab/recipes/{id} returns the same id and target_value 50.00 that POST /fab/recipes stored, readable by a role that did not author it (YieldEngineer)."
        test_recipe:
          setup:
            - "One recipe LITHO-200 (LITHO, target 50.00, qual_expiry_days 120) exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/recipes"
              payload: { recipe_code: "LITHO-200", tool_type: "LITHO", target_value: 50.00, qual_expiry_days: 120 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r1: $.data.id }
          trigger:
            - call: "GET /fab/recipes/${r1}"
              payload: {}
              as: YieldEngineer
              as_user_id: "u_ye_1"
          assert:
            - "HTTP status == 200"
            - "Recipe.${r1}.id == \"${r1}\""
            - "Recipe.${r1}.recipe_code == \"LITHO-200\""
            - "Recipe.${r1}.target_value == 50.00"
            - "Recipe.${r1}.status == QUALIFIED"

      - name: list_recipes_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /fab/recipes]
          - response_envelope.list_success
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three recipes stored and limit 2 / offset 0, the list returns exactly 2 elements ordered created_at ASC (LITHO-200 then ETCH-200) with meta.total_count 3 and meta.has_more true."
        test_recipe:
          setup:
            - "Three recipes created in order: LITHO-200 (LITHO), ETCH-200 (ETCH), CMP-200 (CMP)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/recipes"
              payload: { recipe_code: "LITHO-200", tool_type: "LITHO", target_value: 50.00 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r1: $.data.id }
            - call: "POST /fab/recipes"
              payload: { recipe_code: "ETCH-200", tool_type: "ETCH", target_value: 100.00 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r2: $.data.id }
            - call: "POST /fab/recipes"
              payload: { recipe_code: "CMP-200", tool_type: "CMP", target_value: 30.00 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r3: $.data.id }
          trigger:
            - call: "GET /fab/recipes"
              payload: { limit: 2, offset: 0 }
              as: FabPlanner
              as_user_id: "u_fp_1"
          assert:
            - "HTTP status == 200"
            - "response_type == \"array\""
            - "meta.total_count == 3"
            - "meta.has_more == true"
            - "meta.limit == 2 and meta.offset == 0"
            - "data has exactly 2 elements: data[0].id == \"${r1}\" and data[1].id == \"${r2}\""

      - name: get_recipe_with_unknown_id_returns_recipe_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_RECIPE_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid UUID that names no Recipe row returns ERR_RECIPE_NOT_FOUND with HTTP 404, not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database apart from the clock pin."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
          trigger:
            - call: "GET /fab/recipes/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_RECIPE_NOT_FOUND"

      - name: create_recipe_without_tool_type_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_VALIDATION]
          - endpoints[POST /fab/recipes]
        distinguishing_aspect: "tool_type is a required input with no default, so omitting it returns ERR_VALIDATION 400 and no Recipe row is created."
        test_recipe:
          setup:
            - "Empty database apart from the clock pin."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
          trigger:
            - call: "POST /fab/recipes"
              payload: { recipe_code: "LITHO-200", target_value: 50.00 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err} == ERR_VALIDATION"
            - "GET /fab/recipes returns meta.total_count == 0"

      - name: omitting_qual_expiry_days_applies_the_ninety_day_default
        claim_type: defaults
        grounds:
          - entities.Recipe.fields.qual_expiry_days
          - endpoints[POST /fab/recipes]
          - endpoints[POST /fab/chambers/{id}/qualification-runs]
        distinguishing_aspect: "qual_expiry_days is omitted, so the stored value is the declared default 90 and a chamber qualified on that recipe at 2026-08-01T00:00:00Z expires at 2026-10-30T00:00:00Z (90 days later), not 100 or 120 days later."
        test_recipe:
          setup:
            - "Recipe LITHO-200 created without qual_expiry_days; one LITHO tool with chamber CH_L1 set up against it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/recipes"
              payload: { recipe_code: "LITHO-200", tool_type: "LITHO", target_value: 50.00 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r1: $.data.id, qed: $.data.qual_expiry_days }
            - call: "POST /fab/equipment"
              payload: { equipment_code: "LITHO-1", tool_type: "LITHO" }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { eq1: $.data.id }
            - call: "POST /fab/chambers"
              payload: { equipment_id: "${eq1}", chamber_code: "CH_L1", qualified_recipe_id: "${r1}" }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { ch1: $.data.id }
          trigger:
            - call: "POST /fab/chambers/${ch1}/qualification-runs"
              payload: { qual_result: "PASS" }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { exp: $.data.qual_expires_at }
          assert:
            - "${qed} == 90"
            - "${exp} == \"2026-10-30T00:00:00Z\""
            - "Chamber.${ch1}.qual_state == QUALIFIED"
            - "Chamber.${ch1}.qualified_at == \"2026-08-01T00:00:00Z\""

      - name: flow_step_count_and_total_standard_hours_are_recomputed_per_step
        claim_type: computed_fields
        grounds:
          - entities.ProcessFlow.fields.step_count
          - entities.ProcessFlow.fields.total_standard_hours
          - endpoints[POST /fab/process-flows/{id}/steps]
        distinguishing_aspect: "step_count and total_standard_hours are computed from the ProcessStep rows — after appending a 2.0h step and a 3.0h step they read 2 and 5.0, and the flow's OCC version has been bumped twice to 3."
        test_recipe:
          setup:
            - "Flow FLOW-C (LOGIC_N7) in DRAFT with two steps appended: seq 10 LITHO 2.0h and seq 20 ETCH 3.0h."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/recipes"
              payload: { recipe_code: "LITHO-200", tool_type: "LITHO", target_value: 50.00 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r_litho: $.data.id }
            - call: "POST /fab/recipes"
              payload: { recipe_code: "ETCH-200", tool_type: "ETCH", target_value: 100.00 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r_etch: $.data.id }
            - call: "POST /fab/process-flows"
              payload: { flow_code: "FLOW-C", product_family: "LOGIC_N7" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { flow_c: $.data.id, sc0: $.data.step_count, tsh0: $.data.total_standard_hours }
            - call: "POST /fab/process-flows/${flow_c}/steps"
              payload: { recipe_id: "${r_litho}", step_seq: 10, step_name: "LITHO-1", standard_hours: 2.0 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
          trigger:
            - call: "POST /fab/process-flows/${flow_c}/steps"
              payload: { recipe_id: "${r_etch}", step_seq: 20, step_name: "ETCH-1", standard_hours: 3.0, metrology_required: true }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { s20: $.data.id, mr: $.data.metrology_required }
          assert:
            - "${sc0} == 0 and ${tsh0} == 0.0"
            - "${mr} == true"
            - "ProcessFlow.${flow_c}.step_count == 2"
            - "ProcessFlow.${flow_c}.total_standard_hours == 5.0"
            - "ProcessFlow.${flow_c}.status == DRAFT"
            - "ProcessFlow.${flow_c}.revision == 1"
            - "ProcessFlow.${flow_c}.version == 3"

      - name: lot_system_fields_are_server_minted_and_client_supplied_ones_are_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Lot
          - endpoints[POST /fab/lots]
          - response_envelope.success
        distinguishing_aspect: "id, created_at and version are system fields: a client-supplied id/created_at/version in the POST /fab/lots body is ignored, the returned id differs from the submitted one, created_at is the clock value 2026-08-01T00:00:00Z and version is 1."
        test_recipe:
          setup:
            - "Flow FLOW-A (LOGIC_N5) RELEASED with one 2.0h LITHO step; DRAFT plan PLAN-A for 10 wafer starts."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/recipes"
              payload: { recipe_code: "LITHO-200", tool_type: "LITHO", target_value: 50.00 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r_litho: $.data.id }
            - call: "POST /fab/process-flows"
              payload: { flow_code: "FLOW-A", product_family: "LOGIC_N5" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { flow_a: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/steps"
              payload: { recipe_id: "${r_litho}", step_seq: 10, step_name: "LITHO-1", standard_hours: 2.0 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { s10: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/wafer-start-plans"
              payload: { flow_id: "${flow_a}", product_family: "LOGIC_N5", week_start_date: "2026-08-03T00:00:00Z", planned_wafer_starts: 10, capacity_budget_hours: 100.0, cycle_time_target_days: 30.0 }
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { plan_a: $.data.id }
          trigger:
            - call: "POST /fab/lots"
              payload: { plan_id: "${plan_a}", flow_id: "${flow_a}", lot_number: "LOT-777", wafer_count: 5, id: "11111111-1111-1111-1111-111111111111", created_at: "2000-01-01T00:00:00Z", version: 99 }
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { lot_new: $.data.id }
          assert:
            - "HTTP status == 201"
            - "${lot_new} != \"11111111-1111-1111-1111-111111111111\""
            - "Lot.${lot_new}.created_at == \"2026-08-01T00:00:00Z\""
            - "Lot.${lot_new}.version == 1"
            - "Lot.${lot_new}.flow_state == PLANNED"
            - "Lot.${lot_new}.hold_state == NONE"
            - "Lot.${lot_new}.current_step_seq == 0"
            - "Lot.${lot_new}.lot_type == PRODUCTION"
            - "Lot.${lot_new}.priority_class == STANDARD"

      - name: create_lot_with_priority_class_outside_the_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Lot.fields.priority_class
          - validations[priority=3]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "priority_class URGENT is outside {STANDARD, HOT, SUPER_HOT}, so the create returns ERR_VALIDATION 400 and the plan's Lot list stays empty."
        test_recipe:
          setup:
            - "Flow FLOW-A (LOGIC_N5) RELEASED with one 2.0h LITHO step; DRAFT plan PLAN-A for 10 wafer starts."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/recipes"
              payload: { recipe_code: "LITHO-200", tool_type: "LITHO", target_value: 50.00 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r_litho: $.data.id }
            - call: "POST /fab/process-flows"
              payload: { flow_code: "FLOW-A", product_family: "LOGIC_N5" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { flow_a: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/steps"
              payload: { recipe_id: "${r_litho}", step_seq: 10, step_name: "LITHO-1", standard_hours: 2.0 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/process-flows/${flow_a}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/wafer-start-plans"
              payload: { flow_id: "${flow_a}", product_family: "LOGIC_N5", week_start_date: "2026-08-03T00:00:00Z", planned_wafer_starts: 10, capacity_budget_hours: 100.0, cycle_time_target_days: 30.0 }
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { plan_a: $.data.id }
          trigger:
            - call: "POST /fab/lots"
              payload: { plan_id: "${plan_a}", flow_id: "${flow_a}", lot_number: "LOT-778", wafer_count: 5, priority_class: "URGENT" }
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err} == ERR_VALIDATION"
            - "GET /fab/lots with plan_id == \"${plan_a}\" returns meta.total_count == 0"

      - name: metrology_measurement_row_is_immutable_with_no_version_or_updated_at
        claim_type: immutability
        grounds:
          - entities.MetrologyMeasurement
          - endpoints[GET /fab/measurements/{id}]
          - endpoints[POST /fab/measurements]
        distinguishing_aspect: "MetrologyMeasurement declares common_fields false, so the GET body exposes id and created_at but no version and no updated_at, and §1.5 offers no PATCH route for it — the SPC record cannot be edited after the fact."
        test_recipe:
          setup:
            - "Flow FLOW-A (LOGIC_N5) RELEASED with metrology-required LITHO step seq 10 (2.0h); SpcChart on that step (target 100.00, sigma 2.00, usl 110.00, lsl 90.00, ucl 106.00, lcl 94.00)."
            - "LITHO tool with QUALIFIED chamber CH_L1; operator OP-001 GOWNED and LITHO-certified."
            - "PLAN-A COMMITTED (10 starts, 100.0 budget hours); LOT-001 RELEASED with an OPEN run on step seq 10."
            - "One measurement of 100.00 recorded on that run."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/recipes"
              payload: { recipe_code: "LITHO-200", tool_type: "LITHO", target_value: 50.00, qual_expiry_days: 100 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r_litho: $.data.id }
            - call: "POST /fab/process-flows"
              payload: { flow_code: "FLOW-A", product_family: "LOGIC_N5" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { flow_a: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/steps"
              payload: { recipe_id: "${r_litho}", step_seq: 10, step_name: "LITHO-1", standard_hours: 2.0, metrology_required: true }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { s10: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/spc-charts"
              payload: { step_id: "${s10}", param_name: "CD", target: 100.00, sigma: 2.00, usl: 110.00, lsl: 90.00, ucl: 106.00, lcl: 94.00 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { chart_l: $.data.id }
            - call: "POST /fab/equipment"
              payload: { equipment_code: "LITHO-1", tool_type: "LITHO", pm_interval_hours: 168.0, purge_buffer_hours: 24.0, hours_since_pm: 0.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { eq_litho: $.data.id }
            - call: "POST /fab/chambers"
              payload: { equipment_id: "${eq_litho}", chamber_code: "CH_L1", qualified_recipe_id: "${r_litho}", particle_limit: 50.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { ch_l1: $.data.id }
            - call: "POST /fab/chambers/${ch_l1}/qualification-runs"
              payload: { qual_result: "PASS" }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
            - call: "POST /fab/operators"
              payload: { badge_id: "OP-001", full_name: "Op One", certified_tool_types: ["LITHO", "ETCH", "CMP"] }
              as: QualityManager
              as_user_id: "u_qm_1"
              captures: { op1: $.data.id }
            - call: "PATCH /fab/operators/${op1}"
              payload: { gown_state: "GOWNED" }
              as: Operator
              as_user_id: "${op1}"
            - call: "POST /fab/wafer-start-plans"
              payload: { flow_id: "${flow_a}", product_family: "LOGIC_N5", week_start_date: "2026-08-03T00:00:00Z", planned_wafer_starts: 10, capacity_budget_hours: 100.0, cycle_time_target_days: 30.0 }
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { plan_a: $.data.id }
            - call: "POST /fab/wafer-start-plans/${plan_a}/commit"
              payload: {}
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { plan_v1: $.data.version }
            - call: "POST /fab/lots"
              payload: { plan_id: "${plan_a}", flow_id: "${flow_a}", lot_number: "LOT-001", wafer_count: 3 }
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { lot1: $.data.id }
            - call: "POST /fab/lots/${lot1}/release"
              payload: { expected_plan_version: "${plan_v1}" }
              as: FabPlanner
              as_user_id: "u_fp_1"
            - call: "POST /fab/step-runs"
              payload: { lot_id: "${lot1}", step_id: "${s10}", operator_id: "${op1}" }
              as: Operator
              as_user_id: "${op1}"
              captures: { run1: $.data.id }
            - call: "POST /fab/measurements"
              payload: { step_run_id: "${run1}", spc_chart_id: "${chart_l}", measured_value: 100.00 }
              as: Operator
              as_user_id: "${op1}"
              captures: { m1: $.data.id }
          trigger:
            - call: "GET /fab/measurements/${m1}"
              payload: {}
              as: QualityManager
              as_user_id: "u_qm_1"
          assert:
            - "HTTP status == 200"
            - "MetrologyMeasurement.${m1}.id == \"${m1}\" and MetrologyMeasurement.${m1}.created_at == \"2026-08-01T00:00:00Z\""
            - "the response body for MetrologyMeasurement.${m1} carries no version field and no updated_at field"
            - "MetrologyMeasurement.${m1}.classification == IN_CONTROL and MetrologyMeasurement.${m1}.deviation_sigma == 0.0000"
            - "§1.5 declares no PATCH, PUT or DELETE route whose path is /fab/measurements/{id}"

      - name: append_step_under_unknown_flow_returns_process_flow_not_found
        claim_type: parent_relationships
        grounds:
          - entities.ProcessStep.fields.flow_id
          - validations[priority=4]
          - errors[ERR_PROCESS_FLOW_NOT_FOUND]
        distinguishing_aspect: "ProcessStep is a child of ProcessFlow: appending a step under a UUID that names no flow returns ERR_PROCESS_FLOW_NOT_FOUND 404 even though the recipe_id in the body is valid."
        test_recipe:
          setup:
            - "One recipe LITHO-200 exists; no ProcessFlow rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/recipes"
              payload: { recipe_code: "LITHO-200", tool_type: "LITHO", target_value: 50.00 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r_litho: $.data.id }
          trigger:
            - call: "POST /fab/process-flows/00000000-0000-0000-0000-0000000000aa/steps"
              payload: { recipe_id: "${r_litho}", step_seq: 10, step_name: "LITHO-1", standard_hours: 2.0 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_PROCESS_FLOW_NOT_FOUND"

      - name: create_chamber_with_unknown_equipment_id_returns_equipment_not_found
        claim_type: foreign_key_references_validated
        grounds:
          - entities.Chamber.fields.equipment_id
          - validations[priority=5]
          - errors[ERR_EQUIPMENT_NOT_FOUND]
          - complexity_profile.entity_topology
        distinguishing_aspect: "Body-carried foreign keys are validated on a flat topology: equipment_id naming no Equipment row returns ERR_EQUIPMENT_NOT_FOUND 404 even though qualified_recipe_id resolves."
        test_recipe:
          setup:
            - "One recipe LITHO-200 exists; no Equipment rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/recipes"
              payload: { recipe_code: "LITHO-200", tool_type: "LITHO", target_value: 50.00 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r_litho: $.data.id }
          trigger:
            - call: "POST /fab/chambers"
              payload: { equipment_id: "00000000-0000-0000-0000-0000000000bb", chamber_code: "CH_X1", qualified_recipe_id: "${r_litho}", particle_limit: 50.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_EQUIPMENT_NOT_FOUND"

  # =====================================================================
  # Table 2 — State Machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: new_process_flow_starts_in_draft_with_zero_steps
        claim_type: initial_state
        grounds:
          - state_machines.ProcessFlow.initial_state
          - endpoints[POST /fab/process-flows]
        distinguishing_aspect: "A freshly created ProcessFlow is in the declared initial_state DRAFT with revision 1, step_count 0, total_standard_hours 0.0, released_at null and superseded_by_flow_id null."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
          trigger:
            - call: "POST /fab/process-flows"
              payload: { flow_code: "FLOW-A", product_family: "LOGIC_N5" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { flow_a: $.data.id }
          assert:
            - "HTTP status == 201"
            - "ProcessFlow.${flow_a}.status == DRAFT"
            - "ProcessFlow.${flow_a}.revision == 1"
            - "ProcessFlow.${flow_a}.step_count == 0"
            - "ProcessFlow.${flow_a}.total_standard_hours == 0.0"
            - "ProcessFlow.${flow_a}.released_at == null"
            - "ProcessFlow.${flow_a}.superseded_by_flow_id == null"

      - name: release_flow_moves_draft_to_released_and_stamps_released_at
        claim_type: valid_transition
        grounds:
          - state_machines.ProcessFlow.DRAFT_to_RELEASED
          - endpoints[POST /fab/process-flows/{id}/release]
        distinguishing_aspect: "Releasing a DRAFT flow that has one step returns status RELEASED with released_at equal to the clock value 2026-08-01T00:00:00Z and no supersession recorded."
        test_recipe:
          setup:
            - "Flow FLOW-A (LOGIC_N5) in DRAFT with one step seq 10 LITHO 2.0h."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/recipes"
              payload: { recipe_code: "LITHO-200", tool_type: "LITHO", target_value: 50.00 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r_litho: $.data.id }
            - call: "POST /fab/process-flows"
              payload: { flow_code: "FLOW-A", product_family: "LOGIC_N5" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { flow_a: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/steps"
              payload: { recipe_id: "${r_litho}", step_seq: 10, step_name: "LITHO-1", standard_hours: 2.0 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
          trigger:
            - call: "POST /fab/process-flows/${flow_a}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "u_pe_1"
          assert:
            - "HTTP status == 200"
            - "ProcessFlow.${flow_a}.status == RELEASED"
            - "ProcessFlow.${flow_a}.released_at == \"2026-08-01T00:00:00Z\""
            - "ProcessFlow.${flow_a}.step_count == 1"
            - "ProcessFlow.${flow_a}.superseded_by_flow_id == null"

      - name: releasing_an_already_released_flow_returns_flow_not_draft
        claim_type: idempotency
        grounds:
          - validations[priority=12]
          - errors[ERR_FLOW_NOT_DRAFT]
          - state_machines.ProcessFlow.DRAFT_to_RELEASED
        distinguishing_aspect: "The second release of the same flow returns ERR_FLOW_NOT_DRAFT 409 and released_at keeps the first release's value 2026-08-01T00:00:00Z even though the clock has advanced to 2026-08-05T00:00:00Z."
        test_recipe:
          setup:
            - "Flow FLOW-A (LOGIC_N5) RELEASED at 2026-08-01T00:00:00Z with one step; clock then advanced to 2026-08-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/recipes"
              payload: { recipe_code: "LITHO-200", tool_type: "LITHO", target_value: 50.00 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r_litho: $.data.id }
            - call: "POST /fab/process-flows"
              payload: { flow_code: "FLOW-A", product_family: "LOGIC_N5" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { flow_a: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/steps"
              payload: { recipe_id: "${r_litho}", step_seq: 10, step_name: "LITHO-1", standard_hours: 2.0 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/process-flows/${flow_a}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
          trigger:
            - call: "POST /fab/process-flows/${flow_a}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_FLOW_NOT_DRAFT"
            - "ProcessFlow.${flow_a}.released_at == \"2026-08-01T00:00:00Z\""
            - "ProcessFlow.${flow_a}.status == RELEASED"

      - name: releasing_a_flow_with_no_steps_returns_flow_has_no_steps
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=45]
          - errors[ERR_FLOW_HAS_NO_STEPS]
          - state_machines.ProcessFlow.DRAFT_to_RELEASED
        distinguishing_aspect: "A DRAFT flow with step_count 0 fails release with ERR_FLOW_HAS_NO_STEPS 422 and stays DRAFT with released_at null — the step-count precondition is enforced separately from the DRAFT status precondition."
        test_recipe:
          setup:
            - "Flow FLOW-EMPTY (MEMORY_D1) in DRAFT with no steps."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/process-flows"
              payload: { flow_code: "FLOW-EMPTY", product_family: "MEMORY_D1" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { flow_e: $.data.id }
          trigger:
            - call: "POST /fab/process-flows/${flow_e}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err} == ERR_FLOW_HAS_NO_STEPS"
            - "ProcessFlow.${flow_e}.status == DRAFT"
            - "ProcessFlow.${flow_e}.released_at == null"

      - name: plan_creation_against_a_superseded_flow_returns_flow_not_released
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ProcessFlow.RELEASED_to_OBSOLETE
          - state_machines.ProcessFlow.terminal_states
          - validations[priority=13]
          - errors[ERR_FLOW_NOT_RELEASED]
        distinguishing_aspect: "Releasing FLOW-A2 with supersedes_flow_id FLOW-A drives FLOW-A to the terminal state OBSOLETE and stamps superseded_by_flow_id; a wafer-start plan against the OBSOLETE flow is then refused with ERR_FLOW_NOT_RELEASED 409."
        test_recipe:
          setup:
            - "Flow FLOW-A (LOGIC_N5) RELEASED with one step; flow FLOW-A2 (LOGIC_N5) RELEASED naming FLOW-A in supersedes_flow_id, so FLOW-A is OBSOLETE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/recipes"
              payload: { recipe_code: "LITHO-200", tool_type: "LITHO", target_value: 50.00 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r_litho: $.data.id }
            - call: "POST /fab/process-flows"
              payload: { flow_code: "FLOW-A", product_family: "LOGIC_N5" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { flow_a: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/steps"
              payload: { recipe_id: "${r_litho}", step_seq: 10, step_name: "LITHO-1", standard_hours: 2.0 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/process-flows/${flow_a}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/process-flows"
              payload: { flow_code: "FLOW-A2", product_family: "LOGIC_N5" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { flow_a2: $.data.id }
            - call: "POST /fab/process-flows/${flow_a2}/steps"
              payload: { recipe_id: "${r_litho}", step_seq: 10, step_name: "LITHO-1", standard_hours: 2.0 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/process-flows/${flow_a2}/release"
              payload: { supersedes_flow_id: "${flow_a}" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "GET /fab/process-flows/${flow_a}"
              payload: {}
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { a_status: $.data.status, a_sup: $.data.superseded_by_flow_id }
          trigger:
            - call: "POST /fab/wafer-start-plans"
              payload: { flow_id: "${flow_a}", product_family: "LOGIC_N5", week_start_date: "2026-08-03T00:00:00Z", planned_wafer_starts: 10, capacity_budget_hours: 100.0, cycle_time_target_days: 30.0 }
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { err: $.data.error_id }
          assert:
            - "${a_status} == OBSOLETE"
            - "${a_sup} == \"${flow_a2}\""
            - "HTTP status == 409"
            - "${err} == ERR_FLOW_NOT_RELEASED"

      - name: pm_complete_on_an_idle_tool_returns_equipment_not_in_pm
        claim_type: invalid_transitions
        grounds:
          - validations[priority=22]
          - errors[ERR_EQUIPMENT_NOT_IN_PM]
          - state_machines.Equipment.PM_to_IDLE
        distinguishing_aspect: "pm-complete is not a transition out of IDLE, so an IDLE tool returns ERR_EQUIPMENT_NOT_IN_PM 409 and its available_capacity_hours stays 720.0 rather than being reset."
        test_recipe:
          setup:
            - "One LITHO tool LITHO-1 in the initial state IDLE with hours_since_pm 40.0 and available_capacity_hours 720.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
            - call: "POST /fab/equipment"
              payload: { equipment_code: "LITHO-1", tool_type: "LITHO", pm_interval_hours: 168.0, purge_buffer_hours: 24.0, hours_since_pm: 40.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { eq1: $.data.id, st0: $.data.state }
          trigger:
            - call: "POST /fab/equipment/${eq1}/pm-complete"
              payload: {}
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { err: $.data.error_id }
          assert:
            - "${st0} == IDLE"
            - "HTTP status == 409"
            - "${err} == ERR_EQUIPMENT_NOT_IN_PM"
            - "Equipment.${eq1}.hours_since_pm == 40.0"
            - "Equipment.${eq1}.available_capacity_hours == 720.0"
            - "Equipment.${eq1}.purge_until == null"

      - name: qualification_run_on_an_already_qualified_chamber_returns_chamber_invalid_qual_state
        claim_type: invalid_transitions
        grounds:
          - validations[priority=49]
          - errors[ERR_CHAMBER_INVALID_QUAL_STATE]
          - state_machines.Chamber.UNQUALIFIED_to_QUALIFIED
        distinguishing_aspect: "No QUALIFIED -> QUALIFIED transition exists, so a second PASS run returns ERR_CHAMBER_INVALID_QUAL_STATE 409 and qual_expires_at keeps the first run's value 2026-11-09T00:00:00Z instead of sliding to 2026-11-13T00:00:00Z."
        test_recipe:
          setup:
            - "Recipe ETCH-200 (qual_expiry_days 100); ETCH tool with chamber CH_E1 QUALIFIED at 2026-08-01T00:00:00Z, so qual_expires_at is 2026-11-09T00:00:00Z."
            - "Clock then advanced to 2026-08-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
            - call: "POST /fab/recipes"
              payload: { recipe_code: "ETCH-200", tool_type: "ETCH", target_value: 100.00, qual_expiry_days: 100 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r_etch: $.data.id }
            - call: "POST /fab/equipment"
              payload: { equipment_code: "ETCH-1", tool_type: "ETCH", pm_interval_hours: 168.0, purge_buffer_hours: 24.0, hours_since_pm: 0.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { eq_etch: $.data.id }
            - call: "POST /fab/chambers"
              payload: { equipment_id: "${eq_etch}", chamber_code: "CH_E1", qualified_recipe_id: "${r_etch}", particle_limit: 50.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { ch_e1: $.data.id }
            - call: "POST /fab/chambers/${ch_e1}/qualification-runs"
              payload: { qual_result: "PASS" }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { exp1: $.data.qual_expires_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
          trigger:
            - call: "POST /fab/chambers/${ch_e1}/qualification-runs"
              payload: { qual_result: "PASS" }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { err: $.data.error_id }
          assert:
            - "${exp1} == \"2026-11-09T00:00:00Z\""
            - "HTTP status == 409"
            - "${err} == ERR_CHAMBER_INVALID_QUAL_STATE"
            - "Chamber.${ch_e1}.qual_state == QUALIFIED"
            - "Chamber.${ch_e1}.qual_expires_at == \"2026-11-09T00:00:00Z\""
            - "Chamber.${ch_e1}.qualified_at == \"2026-08-01T00:00:00Z\""

      - name: failed_qualification_run_records_the_attempt_without_qualifying_the_chamber
        claim_type: side_effect_execution
        grounds:
          - endpoints[POST /fab/chambers/{id}/qualification-runs]
          - state_machines.Chamber.UNQUALIFIED_to_QUALIFIED
          - entities.Chamber.fields.qual_state
        distinguishing_aspect: "With qual_result FAIL the transition precondition qual_result == PASS is unmet: qual_state stays UNQUALIFIED with qualified_at and qual_expires_at null, while version still increments to 2 because the run was recorded."
        test_recipe:
          setup:
            - "Recipe ETCH-200 (qual_expiry_days 100); ETCH tool with chamber CH_E1 freshly created, so qual_state is UNQUALIFIED and version is 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
            - call: "POST /fab/recipes"
              payload: { recipe_code: "ETCH-200", tool_type: "ETCH", target_value: 100.00, qual_expiry_days: 100 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r_etch: $.data.id }
            - call: "POST /fab/equipment"
              payload: { equipment_code: "ETCH-1", tool_type: "ETCH", pm_interval_hours: 168.0, purge_buffer_hours: 24.0, hours_since_pm: 0.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { eq_etch: $.data.id }
            - call: "POST /fab/chambers"
              payload: { equipment_id: "${eq_etch}", chamber_code: "CH_E1", qualified_recipe_id: "${r_etch}", particle_limit: 50.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { ch_e1: $.data.id, qs0: $.data.qual_state, v0: $.data.version }
          trigger:
            - call: "POST /fab/chambers/${ch_e1}/qualification-runs"
              payload: { qual_result: "FAIL" }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { qs1: $.data.qual_state, v1: $.data.version }
          assert:
            - "${qs0} == UNQUALIFIED and ${v0} == 1"
            - "HTTP status == 200"
            - "${qs1} == UNQUALIFIED"
            - "${v1} == 2"
            - "Chamber.${ch_e1}.qualified_at == null"
            - "Chamber.${ch_e1}.qual_expires_at == null"
            - "Chamber.${ch_e1}.occupancy_state == FREE"

      - name: committing_an_already_committed_plan_returns_plan_already_committed
        claim_type: idempotency
        grounds:
          - validations[priority=14]
