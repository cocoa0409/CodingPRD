    input: []
    output: LockoutContract
    side_effects: ["Room.status->OPEN", "cancel future occurrence Bookings (cascade releases their children)", "increments LockoutContract.version by 1"]
  # ---- Session delivery (Booking sub-resource, 1:1) ----
  - method: POST
    path: "/studio/bookings/{id}/delivery/deliver"
    description: "engineer delivers/redelivers a session package (DRAFT/REVISION_REQUESTED -> DELIVERED)"
    roles: [Engineer]
    code: 200
    input: [file_manifest]
    output: SessionDelivery
    side_effects: ["create SessionDelivery on first deliver", "DRAFT->DELIVERED or REVISION_REQUESTED->DELIVERED (increment revision_round)", "increments SessionDelivery.version by 1"]
  - method: POST
    path: "/studio/bookings/{id}/delivery/request-revision"
    description: "client requests a revision (DELIVERED -> REVISION_REQUESTED)"
    roles: [Client]
    code: 200
    input: []
    output: SessionDelivery
    side_effects: ["status DELIVERED->REVISION_REQUESTED", "increments SessionDelivery.version by 1"]
  - method: POST
    path: "/studio/bookings/{id}/delivery/accept"
    description: "client accepts the delivery (DELIVERED -> ACCEPTED)"
    roles: [Client]
    code: 200
    input: []
    output: SessionDelivery
    side_effects: ["status DELIVERED->ACCEPTED", "increments SessionDelivery.version by 1"]
  - method: GET
    path: "/studio/bookings/{id}/delivery"
    description: "list the session delivery(ies) for a booking (0 or 1)"
    roles: [StudioManager, Client, Engineer]
    code: 200
    input: []
    output: SessionDelivery[]
    side_effects: []
  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server wall clock (test-driving)"
    roles: [StudioManager]
    code: 200
    input: [to_iso8601]
    output: Clock
    side_effects: ["sets Clock.current_utc; subsequent time-relative computations read this value"]
  - method: POST
    path: "/_sweep/release_expired_holds"
    description: "advance the system: auto-release HELD bookings whose hold_expires_at < Clock.current_utc (test-driving sweep)"
    roles: [StudioManager]
    code: 200
    input: []
    output: "{ released_count: integer, released_booking_ids: string[] }"
    side_effects: ["each expired HELD booking -> schedule_status CANCELLED; releases its children; settlement REFUNDING->REFUNDED if a deposit was paid"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or malformed X-User-Role / X-User-ID on a protected endpoint"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "role not permitted for the operation, or actor is not the owning Client/Engineer of the resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a referenced studio/room/engineer/gear/client/booking/contract/rental/assignment id does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "transition not defined from the resource's current schedule_status / settlement_status / contract status / delivery status"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the live parent version (OCC)"
  - id: ERR_INVALID_TIME_RANGE
    http: 422
    condition: "end_at not strictly after start_at, or daily_end_local not after daily_start_local"
  - id: ERR_ENGINEER_REQUIRED
    http: 422
    condition: "check-in attempted while a requires_engineer gear rental has no engineer assignment"
  - id: ERR_ROOM_UNAVAILABLE
    http: 409
    condition: "confirm collides with an existing CONFIRMED/IN_SESSION booking window (incl. turnaround) on the same room"
  - id: ERR_LOCKOUT_CONFLICT
    http: 409
    condition: "lockout activation occurrence window collides with an existing CONFIRMED/IN_SESSION booking on the room"
  - id: ERR_GEAR_UNAVAILABLE
    http: 409
    condition: "gear rental would exceed GearItem.total_units across overlapping reserved windows"
  - id: ERR_ENGINEER_UNAVAILABLE
    http: 409
    condition: "engineer already ASSIGNED on an overlapping booking, or engineer.active == false"
  - id: ERR_DEPOSIT_MISMATCH
    http: 422
    condition: "DEPOSIT payment amount_cents != Booking.deposit_due_cents"
  - id: ERR_BALANCE_MISMATCH
    http: 422
    condition: "BALANCE payment amount_cents != external_required from the waterfall (incl. the wallet-fully-covers case where external_required==0)"
  - id: ERR_DUPLICATE_EMAIL
    http: 409
    condition: "client email already registered within the studio"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required body field, wrong type, invalid enum, or negative amount"
  - id: ERR_VALIDATION
    http: 422
    condition: "semantically invalid value that passed type checks (e.g., deposit_pct out of (0,1], empty weekday_mask, units < 1)"
  - id: ERR_SESSION_NOT_DELIVERABLE
    http: 409
    condition: "deliver attempted while the booking is not COMPLETED+SETTLED, or delivery already ACCEPTED"
  - id: ERR_CANCEL_TOO_LATE
    http: 409
    condition: "cancel attempted on a CONFIRMED booking after the session start (Clock.current_utc >= start_at)"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: StudioManager
    description: "operates the studio: inventory CRUD, confirm/check-in/check-out, cancel, lockout contracts, gear/engineer assignment management"
    identity: "opaque"
    exclusive_operations:
      - "POST /studio (bootstrap)"
      - "POST /studio/rooms, POST /studio/engineers, POST /studio/gear-items"
      - "POST /studio/bookings/{id}/confirm"
      - "POST /studio/bookings/{id}/check-in"
      - "POST /studio/bookings/{id}/check-out"
      - "POST /studio/bookings/{id}/engineer-assignments"
      - "DELETE /studio/bookings/{id}/engineer-assignments/{assignId}"
      - "DELETE /studio/bookings/{id}/gear-rentals/{rentalId}"
      - "POST /studio/lockout-contracts and activate/terminate"
      - "POST /_clock/set_current_utc"
      - "POST /_sweep/release_expired_holds"
      - "GET /studio/clients"
    shared_operations:
      - "POST /studio/bookings (create)"
      - "POST /studio/bookings/{id}/cancel"
      - "POST /studio/bookings/{id}/gear-rentals"
      - "POST /studio/bookings/{id}/payments"
      - "GET reads on rooms/engineers/gear/bookings/payments/contracts"
  - name: Client
    description: "books rooms, pays deposit/balance, adds gear, requests revisions, accepts deliveries; acts only on own bookings"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /studio/bookings/{id}/payments (as the owning client)"
      - "POST /studio/bookings/{id}/delivery/request-revision"
      - "POST /studio/bookings/{id}/delivery/accept"
    shared_operations:
      - "POST /studio/bookings (create, own client_id)"
      - "POST /studio/bookings/{id}/cancel (own booking)"
      - "POST /studio/bookings/{id}/gear-rentals (own booking)"
      - "GET reads on own bookings, own client, payments, deliveries, inventory"
  - name: Engineer
    description: "delivers/redelivers session files on bookings they are assigned to"
    identity: "entity_backed:Engineer"
    exclusive_operations:
      - "POST /studio/bookings/{id}/delivery/deliver"
    shared_operations:
      - "GET reads on bookings/assignments/deliveries/inventory the engineer is associated with"
  - name: Anonymous
    description: "unauthenticated caller; may only self-register as a client"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /studio/clients/register"
