  - rule_id: compensating_invariant
    instances:
      - name: lot_recall_restores_supplier_released_mass_ledger
        grounds:
          - calculations.lot_mass_invariant
          - state_machines.IngredientLot.RELEASED_to_RECALLED
          - entities.Supplier.fields.total_released_kg
          - entities.IngredientLot.fields.released_quantity_kg
        distinguishing_aspect: |
          Conserved quantity: MASS on the supplier's released-kilogram ledger. A recall must
          decrement Supplier.total_released_kg by exactly the released mass, restoring the
          value the ledger held before that lot was released, while the lot keeps its own
          released_quantity_kg so the per-lot identity
          quantity_kg == quarantined + released + rejected still holds. A second, untouched
          released lot proves the compensation is scoped to the recalled lot and does not
          zero the whole ledger.
        test_recipe:
          setup:
            - "One QUALIFIED supplier (audit_score 90) and one GRANDFATHERED botanical ingredient."
            - "Two QUARANTINED lots on that supplier: L1 of 37.25 kg and L2 of 12.50 kg, each with an ACCEPTED certificate of analysis so both are identity_verified."
            - "Supplier.total_released_kg starts at 0.00."
          setup_api_calls:
            - call: "POST /supplement-compliance/suppliers"
              payload: { supplier_name: "Kerala Herb Works", country_code: "IN", audit_score: 90 }
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
              captures: { sup_id: $.data.id }
            - call: "POST /supplement-compliance/suppliers/${sup_id}/qualification-decision"
              payload: { decision: "QUALIFY" }
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
            - call: "POST /supplement-compliance/ingredients"
              payload: { ingredient_name: "Turmeric Rhizome Extract", ingredient_class: "BOTANICAL", pre_dshea_marketed: true, chemical_alteration: false, daily_intake_mg: 1000 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { ing_id: $.data.id }
            - call: "POST /supplement-compliance/ingredients/${ing_id}/eligibility-determination"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "POST /supplement-compliance/ingredient-lots"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_id}", lot_code: "KHW-2026-0011", quantity_kg: 37.25 }
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
              captures: { l1_id: $.data.id }
            - call: "POST /supplement-compliance/coas"
              payload: { lot_id: "${l1_id}", lab_name: "Cascade Analytical", identity_test_method: "HPTLC", identity_match: true, assay_percent_of_label: 99.1, heavy_metals_pass: true, microbial_pass: true }
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
              captures: { coa1_id: $.data.id }
            - call: "POST /supplement-compliance/coas/${coa1_id}/review"
              payload: { decision: "ACCEPT" }
              as: QualityAssuranceManager
              as_user_id: "u_qam_02"
            - call: "POST /supplement-compliance/ingredient-lots"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_id}", lot_code: "KHW-2026-0012", quantity_kg: 12.50 }
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
              captures: { l2_id: $.data.id }
            - call: "POST /supplement-compliance/coas"
              payload: { lot_id: "${l2_id}", lab_name: "Cascade Analytical", identity_test_method: "HPTLC", identity_match: true, assay_percent_of_label: 101.7, heavy_metals_pass: true, microbial_pass: true }
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
              captures: { coa2_id: $.data.id }
            - call: "POST /supplement-compliance/coas/${coa2_id}/review"
              payload: { decision: "ACCEPT" }
              as: QualityAssuranceManager
              as_user_id: "u_qam_02"
          trigger:
            - call: "POST /supplement-compliance/ingredient-lots/${l1_id}/release"
              payload: {}
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
            - call: "POST /supplement-compliance/ingredient-lots/${l2_id}/release"
              payload: {}
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
            - call: "POST /supplement-compliance/ingredient-lots/${l1_id}/recall"
              payload: { recall_reason: "Retained sample failed a post-release solvent residue retest." }
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
            - call: "GET /supplement-compliance/suppliers/${sup_id}"
              payload: {}
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
              captures: { total_after: $.data.total_released_kg }
          assert:
            - "after releasing L1 then L2, Supplier.${sup_id}.total_released_kg == 49.75"
            - "after recalling L1, Supplier.${sup_id}.total_released_kg == 12.50 — exactly the value the ledger held before L1 was released, not 0.00 and not 37.25"
            - "IngredientLot.${l1_id}.lot_status == RECALLED with released_quantity_kg still 37.25, quarantined_quantity_kg 0.00, rejected_quantity_kg 0.00, so quantity_kg == quarantined + released + rejected == 37.25"
            - "IngredientLot.${l2_id}.lot_status is still RELEASED with released_quantity_kg == 12.50 (the compensation touched only the recalled lot)"
            - "Supplier.${sup_id}.coa_rejection_count == 0 and qualification_status == QUALIFIED throughout"
      - name: claim_withdrawal_restores_product_active_claim_ledger
        grounds:
          - calculations.claim_ledger_invariant
          - state_machines.StructureFunctionClaim.APPROVED_to_WITHDRAWN
          - calculations.product_compliance_risk_index
          - calculations.substantiation_strength_score
        distinguishing_aspect: |
          A different conserved quantity: the COUNT ledger Product.active_claim_count (plus its
          withdrawn_claim_count counterpart), not a mass total. Withdrawal must undo the
          increment applied at approval and move the claim into the withdrawn tally so
          active + withdrawn accounts for every non-DRAFT claim, and the risk index must fall
          back to the base floor rather than retaining an approval-era value.
        test_recipe:
          setup:
            - "One GRANDFATHERED VITAMIN ingredient on a DRAFT product; the product stays DRAFT so the notification dimension remains NOT_DUE."
            - "One claim authored by u_ras_01 with a dossier holding three peer-reviewed studies: RCT_HUMAN n=200 dose_match, OBSERVATIONAL_HUMAN n=150 dose_match, RCT_HUMAN n=60 dose_match."
            - "The claim is submitted for review (freezing final_score at 66.00), the dossier is ACCEPTED by u_sr_01, and the claim is APPROVED by u_cao_01 so no segregation-of-duties rule fires."
          setup_api_calls:
            - call: "POST /supplement-compliance/ingredients"
              payload: { ingredient_name: "Cholecalciferol", ingredient_class: "VITAMIN", pre_dshea_marketed: true, chemical_alteration: false, daily_intake_mg: 1, rdi_mg: 2 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { ing_id: $.data.id }
            - call: "POST /supplement-compliance/ingredients/${ing_id}/eligibility-determination"
              payload: {}
              as: RegulatoryAffairsSpecialist
