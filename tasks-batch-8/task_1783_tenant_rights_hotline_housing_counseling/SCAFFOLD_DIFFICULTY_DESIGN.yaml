# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Tenant Rights Hotline & Housing Counseling
# 9 rules x >=2 instances (combinatorial_formula carries 3, one per mode) = 19
# Logical clock default: 2026-08-01T00:00:00Z (a Saturday; ISO week W1 =
# Mon 2026-07-27T00:00:00Z .. Mon 2026-08-03T00:00:00Z).
# =============================================================================

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: case_score_provisional_vs_verified
        grounds:
          - calculations.case_priority_score
          - calculations.urgency_tier_from_score
          - entities.Case.fields.score_variant
          - entities.Case.fields.priority_score
        distinguishing_aspect: |
          Same stored case facts, two formula variants on the Case entity domain:
          PROVISIONAL ignores notice_served_at and escalation history (75 ->
          CRITICAL); VERIFIED halves the eviction component because the served
          notice period (2 days) is below the jurisdiction's 3-day statutory
          minimum (50 -> ELEVATED). Distinct from the analytics variant pair,
          which lives in the CallSession/Case aggregate domain.
        test_recipe:
          setup:
            - "Clock at default 2026-08-01T00:00:00Z; jurisdiction CA: eviction_notice_days=3, habitability_repair_days=14, deposit_cap_months=1.0, deposit_interest_required=false, rate 0.0"
            - "EVICTION script v1 PUBLISHED effective 2026-08-01T00:00:00Z; worker counselor certified for CA/EVICTION, trained on the script, speaks en"
            - "Caller (en, non-anonymous); session ACTIVE; case facts: eviction_notice_date=2026-08-05 (d=4), notice_served_at=2026-08-03T00:00:00Z (2 days < 3 statutory -> defective), habitability_reported_at=2026-07-15T00:00:00Z (h=17 > 14, <= 28), deposit 200000 vs cap 150000"
          setup_api_calls:
            - { call: "POST /hotline/jurisdictions", payload: { code: "CA", name: "California", level: "STATE", eviction_notice_days: 3, habitability_repair_days: 14, deposit_cap_months: 1.0, deposit_interest_required: false, deposit_interest_rate_pct: 0.0 }, as: AgencyAdmin, captures: { jur: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Author A", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: false }, as: AgencyAdmin, captures: { auth: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Reviewer R", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: true }, as: AgencyAdmin, captures: { rev: $.data.id } }
            - { call: "POST /hotline/scripts", payload: { jurisdiction_id: "${jur}", issue_category: "EVICTION", version_no: 1, body: "script v1" }, as: Counselor, as_user_id: "${auth}", captures: { scr1: $.data.id } }
            - { call: "POST /hotline/scripts/${scr1}/state", payload: { to_status: "IN_REVIEW" }, as: Counselor, as_user_id: "${auth}" }
            - { call: "POST /hotline/scripts/${scr1}/state", payload: { to_status: "PUBLISHED", effective_from: "2026-08-01T00:00:00Z" }, as: Counselor, as_user_id: "${rev}" }
            - { call: "POST /hotline/counselors", payload: { display_name: "Worker W", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: false }, as: AgencyAdmin, captures: { wk: $.data.id } }
            - { call: "POST /hotline/counselors/${wk}/training-certifications", payload: { script_id: "${scr1}", score: 90 }, as: HotlineSupervisor }
            - { call: "POST /hotline/callers", payload: { alias: "caller-1", phone: "+15550001", preferred_language: "en", channel: "PHONE", is_anonymous: false }, as: Anonymous, captures: { cal: $.data.id } }
            - { call: "POST /hotline/sessions", payload: { caller_id: "${cal}", jurisdiction_id: "${jur}", issue_category: "EVICTION" }, as: Anonymous, captures: { sess: $.data.id } }
            - { call: "POST /hotline/sessions/${sess}/state", payload: { to_status: "ASSIGNED", counselor_id: "${wk}" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/sessions/${sess}/state", payload: { to_status: "ACTIVE" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/cases", payload: { caller_id: "${cal}", opened_from_session_id: "${sess}", jurisdiction_id: "${jur}", issue_category: "EVICTION", eviction_notice_date: "2026-08-05", notice_served_at: "2026-08-03T00:00:00Z", habitability_reported_at: "2026-07-15T00:00:00Z", deposit_amount_cents: 200000, monthly_rent_cents: 150000 }, as: Counselor, as_user_id: "${wk}", captures: { case: $.data.id } }
          trigger:
            - { call: "POST /hotline/cases/${case}/verify", payload: {}, as: Counselor, as_user_id: "${rev}" }
          assert:
            - "Case creation response: priority_score == 75 (50 eviction d=4 <= 5, +15 habitability h=17 in (14,28], +10 deposit over cap), urgency_tier == CRITICAL, score_variant == PROVISIONAL"
            - "Verify response: priority_score == 50 (eviction halved 50 -> 25 because served 2 days < 3 statutory; +15 +10; escalation term 0), urgency_tier == ELEVATED, score_variant == VERIFIED"
            - "Case.${case}.verified_by_counselor_id == ${rev} (segregation of duties: verifier != opener ${wk})"

      - name: call_volume_raw_vs_deduplicated
        grounds:
          - calculations.call_volume_metrics
          - entities.CallSession.fields.session_status
          - entities.Case.fields.last_escalated_at
        distinguishing_aspect: |
          Same window, same five sessions and one escalation; two variants in the
          analytics domain (not the Case scoring domain): RAW counts sessions
          (5, rate 0.2) while DEDUPLICATED counts distinct identified callers
          plus one per anonymous session (4, rate 0.25) — different denominators
          yield different escalation rates for identical underlying data.
        test_recipe:
          setup:
            - "Clock at default 2026-08-01T00:00:00Z; jurisdiction CA; EVICTION script v1 PUBLISHED; worker counselor certified+trained, speaks en"
            - "Callers A (en, identified), B (en, identified), C (anonymous), D (anonymous)"
            - "Five sessions all reaching ACTIVE then WRAPPED_UP: two for A, one for B, one for C, one for D; all actual_start_at == 2026-08-01T00:00:00Z"
            - "One case from A's first session: provisional 75 CRITICAL; IN_PROGRESS; verified (still 75, no notice_served_at); ESCALATED at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /hotline/jurisdictions", payload: { code: "CA", name: "California", level: "STATE", eviction_notice_days: 3, habitability_repair_days: 14, deposit_cap_months: 1.0, deposit_interest_required: false, deposit_interest_rate_pct: 0.0 }, as: AgencyAdmin, captures: { jur: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Author A", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: false }, as: AgencyAdmin, captures: { auth: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Reviewer R", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: true }, as: AgencyAdmin, captures: { rev: $.data.id } }
            - { call: "POST /hotline/scripts", payload: { jurisdiction_id: "${jur}", issue_category: "EVICTION", version_no: 1, body: "script v1" }, as: Counselor, as_user_id: "${auth}", captures: { scr1: $.data.id } }
            - { call: "POST /hotline/scripts/${scr1}/state", payload: { to_status: "IN_REVIEW" }, as: Counselor, as_user_id: "${auth}" }
            - { call: "POST /hotline/scripts/${scr1}/state", payload: { to_status: "PUBLISHED", effective_from: "2026-08-01T00:00:00Z" }, as: Counselor, as_user_id: "${rev}" }
            - { call: "POST /hotline/counselors", payload: { display_name: "Worker W", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: false }, as: AgencyAdmin, captures: { wk: $.data.id } }
            - { call: "POST /hotline/counselors/${wk}/training-certifications", payload: { script_id: "${scr1}", score: 90 }, as: HotlineSupervisor }
            - { call: "POST /hotline/callers", payload: { alias: "caller-a", phone: "+15550010", preferred_language: "en", channel: "PHONE", is_anonymous: false }, as: Anonymous, captures: { calA: $.data.id } }
            - { call: "POST /hotline/callers", payload: { alias: "caller-b", phone: "+15550011", preferred_language: "en", channel: "PHONE", is_anonymous: false }, as: Anonymous, captures: { calB: $.data.id } }
            - { call: "POST /hotline/callers", payload: { alias: "caller-c", preferred_language: "en", channel: "PHONE", is_anonymous: true }, as: Anonymous, captures: { calC: $.data.id } }
            - { call: "POST /hotline/callers", payload: { alias: "caller-d", preferred_language: "en", channel: "CHAT", is_anonymous: true }, as: Anonymous, captures: { calD: $.data.id } }
            - { call: "POST /hotline/sessions", payload: { caller_id: "${calA}", jurisdiction_id: "${jur}", issue_category: "EVICTION" }, as: Anonymous, captures: { sA1: $.data.id } }
            - { call: "POST /hotline/sessions/${sA1}/state", payload: { to_status: "ASSIGNED", counselor_id: "${wk}" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/sessions/${sA1}/state", payload: { to_status: "ACTIVE" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/cases", payload: { caller_id: "${calA}", opened_from_session_id: "${sA1}", jurisdiction_id: "${jur}", issue_category: "EVICTION", eviction_notice_date: "2026-08-05", habitability_reported_at: "2026-07-15T00:00:00Z", deposit_amount_cents: 200000, monthly_rent_cents: 150000 }, as: Counselor, as_user_id: "${wk}", captures: { caseA: $.data.id } }
            - { call: "POST /hotline/cases/${caseA}/state", payload: { to_status: "IN_PROGRESS" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/cases/${caseA}/verify", payload: {}, as: Counselor, as_user_id: "${rev}" }
            - { call: "POST /hotline/cases/${caseA}/state", payload: { to_status: "ESCALATED" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/sessions/${sA1}/state", payload: { to_status: "WRAPPED_UP" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/sessions", payload: { caller_id: "${calA}", jurisdiction_id: "${jur}", issue_category: "EVICTION" }, as: Anonymous, captures: { sA2: $.data.id } }
            - { call: "POST /hotline/sessions/${sA2}/state", payload: { to_status: "ASSIGNED", counselor_id: "${wk}" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/sessions/${sA2}/state", payload: { to_status: "ACTIVE" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/sessions/${sA2}/state", payload: { to_status: "WRAPPED_UP" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/sessions", payload: { caller_id: "${calB}", jurisdiction_id: "${jur}", issue_category: "EVICTION" }, as: Anonymous, captures: { sB: $.data.id } }
            - { call: "POST /hotline/sessions/${sB}/state", payload: { to_status: "ASSIGNED", counselor_id: "${wk}" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/sessions/${sB}/state", payload: { to_status: "ACTIVE" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/sessions/${sB}/state", payload: { to_status: "WRAPPED_UP" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/sessions", payload: { caller_id: "${calC}", jurisdiction_id: "${jur}", issue_category: "EVICTION" }, as: Anonymous, captures: { sC: $.data.id } }
            - { call: "POST /hotline/sessions/${sC}/state", payload: { to_status: "ASSIGNED", counselor_id: "${wk}" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/sessions/${sC}/state", payload: { to_status: "ACTIVE" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/sessions/${sC}/state", payload: { to_status: "WRAPPED_UP" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/sessions", payload: { caller_id: "${calD}", jurisdiction_id: "${jur}", issue_category: "EVICTION" }, as: Anonymous, captures: { sD: $.data.id } }
            - { call: "POST /hotline/sessions/${sD}/state", payload: { to_status: "ASSIGNED", counselor_id: "${wk}" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/sessions/${sD}/state", payload: { to_status: "ACTIVE" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/sessions/${sD}/state", payload: { to_status: "WRAPPED_UP" }, as: Counselor, as_user_id: "${wk}" }
          trigger:
            - { call: "GET /hotline/analytics/call-volume?from_iso8601=2026-08-01T00:00:00Z&to_iso8601=2026-08-02T00:00:00Z&view=RAW", as: Analyst, captures: { raw_count: $.data.call_count, raw_rate: $.data.escalation_rate } }
            - { call: "GET /hotline/analytics/call-volume?from_iso8601=2026-08-01T00:00:00Z&to_iso8601=2026-08-02T00:00:00Z&view=DEDUPLICATED", as: Analyst, captures: { dedup_count: $.data.call_count, dedup_rate: $.data.escalation_rate } }
          assert:
            - "RAW view: call_count == 5, escalated_case_count == 1, escalation_rate == 0.2 (1/5, 4dp round_half_up)"
            - "DEDUPLICATED view: call_count == 4 (distinct identified callers {A,B} = 2 + one per anonymous session = 2), escalated_case_count == 1, escalation_rate == 0.25 (1/4)"
            - "Both variants observe the same window and filters; only the denominator rule differs"

  - rule_id: combinatorial_formula
    instances:
      - name: priority_score_tiered_branching
        grounds:
          - calculations.case_priority_score
          - calculations.urgency_tier_from_score
        distinguishing_aspect: |
          Mode (a): a >= 3-input formula with non-linear interaction — tiered
          eviction mapping, strict-> habitability branches keyed on the
          jurisdiction's repair period, a deposit-over-cap flag, and a 0..100
          clamp. Case A (h=29 > 2x14) scores 25; Case B (h=28, exactly 2x
          repair_days, strict > fails) scores 15; Case C assembles three
          components (25 habitability + 10 deposit + 15 eviction d=20) to 50
          ELEVATED. Different mode from the rounding-order and circular-break
          instances.
        test_recipe:
          setup:
            - "Clock default 2026-08-01T00:00:00Z; jurisdiction CA habitability_repair_days=14; EVICTION script published; trained en counselor"
            - "Caller; three ACTIVE sessions for the same caller; three cases"
          setup_api_calls:
            - { call: "POST /hotline/jurisdictions", payload: { code: "CA", name: "California", level: "STATE", eviction_notice_days: 3, habitability_repair_days: 14, deposit_cap_months: 1.0, deposit_interest_required: false, deposit_interest_rate_pct: 0.0 }, as: AgencyAdmin, captures: { jur: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Author A", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: false }, as: AgencyAdmin, captures: { auth: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Reviewer R", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: true }, as: AgencyAdmin, captures: { rev: $.data.id } }
            - { call: "POST /hotline/scripts", payload: { jurisdiction_id: "${jur}", issue_category: "EVICTION", version_no: 1, body: "script v1" }, as: Counselor, as_user_id: "${auth}", captures: { scr1: $.data.id } }
            - { call: "POST /hotline/scripts/${scr1}/state", payload: { to_status: "IN_REVIEW" }, as: Counselor, as_user_id: "${auth}" }
            - { call: "POST /hotline/scripts/${scr1}/state", payload: { to_status: "PUBLISHED", effective_from: "2026-08-01T00:00:00Z" }, as: Counselor, as_user_id: "${rev}" }
            - { call: "POST /hotline/counselors", payload: { display_name: "Worker W", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: false }, as: AgencyAdmin, captures: { wk: $.data.id } }
            - { call: "POST /hotline/counselors/${wk}/training-certifications", payload: { script_id: "${scr1}", score: 90 }, as: HotlineSupervisor }
            - { call: "POST /hotline/callers", payload: { alias: "caller-1", phone: "+15550001", preferred_language: "en", channel: "PHONE", is_anonymous: false }, as: Anonymous, captures: { cal: $.data.id } }
            - { call: "POST /hotline/sessions", payload: { caller_id: "${cal}", jurisdiction_id: "${jur}", issue_category: "EVICTION" }, as: Anonymous, captures: { sessA: $.data.id } }
            - { call: "POST /hotline/sessions/${sessA}/state", payload: { to_status: "ASSIGNED", counselor_id: "${wk}" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/sessions/${sessA}/state", payload: { to_status: "ACTIVE" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/cases", payload: { caller_id: "${cal}", opened_from_session_id: "${sessA}", jurisdiction_id: "${jur}", issue_category: "EVICTION", habitability_reported_at: "2026-07-03T00:00:00Z" }, as: Counselor, as_user_id: "${wk}", captures: { caseA: $.data.id, scoreA: $.data.priority_score, tierA: $.data.urgency_tier } }
            - { call: "POST /hotline/sessions", payload: { caller_id: "${cal}", jurisdiction_id: "${jur}", issue_category: "EVICTION" }, as: Anonymous, captures: { sessB: $.data.id } }
            - { call: "POST /hotline/sessions/${sessB}/state", payload: { to_status: "ASSIGNED", counselor_id: "${wk}" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/sessions/${sessB}/state", payload: { to_status: "ACTIVE" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/cases", payload: { caller_id: "${cal}", opened_from_session_id: "${sessB}", jurisdiction_id: "${jur}", issue_category: "EVICTION", habitability_reported_at: "2026-07-04T00:00:00Z" }, as: Counselor, as_user_id: "${wk}", captures: { caseB: $.data.id, scoreB: $.data.priority_score, tierB: $.data.urgency_tier } }
            - { call: "POST /hotline/sessions", payload: { caller_id: "${cal}", jurisdiction_id: "${jur}", issue_category: "EVICTION" }, as: Anonymous, captures: { sessC: $.data.id } }
            - { call: "POST /hotline/sessions/${sessC}/state", payload: { to_status: "ASSIGNED", counselor_id: "${wk}" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/sessions/${sessC}/state", payload: { to_status: "ACTIVE" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/cases", payload: { caller_id: "${cal}", opened_from_session_id: "${sessC}", jurisdiction_id: "${jur}", issue_category: "EVICTION", habitability_reported_at: "2026-07-03T00:00:00Z", deposit_amount_cents: 200000, monthly_rent_cents: 150000, eviction_notice_date: "2026-08-21" }, as: Counselor, as_user_id: "${wk}", captures: { caseC: $.data.id, scoreC: $.data.priority_score, tierC: $.data.urgency_tier } }
          trigger:
            - { call: "GET /hotline/cases/${caseA}", as: Counselor, as_user_id: "${wk}" }
            - { call: "GET /hotline/cases/${caseB}", as: Counselor, as_user_id: "${wk}" }
            - { call: "GET /hotline/cases/${caseC}", as: Counselor, as_user_id: "${wk}" }
          assert:
            - "Case A: h = 29 days > 2*14 -> +25; priority_score == 25, urgency_tier == STANDARD"
            - "Case B: h = 28 days, strict > 2*14 fails and > 14 holds -> +15; priority_score == 15, urgency_tier == STANDARD"
            - "Case C: 25 (habitability) + 10 (deposit 200000 > cap 150000) + 15 (eviction d=20 in (14,30]) == 50, urgency_tier == ELEVATED"

      - name: deposit_exposure_rounding_order
        grounds:
          - calculations.deposit_exposure_estimate
          - entities.Case.fields.deposit_exposure_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The scaffold pins
          per-component round_half_up to integer cents BEFORE summation:
          interest round(225111*5*100/36500 = 3083.7123...) = 3084 and penalty
          round(75111*1.5 = 112666.5) = 112667 yield 190862; the non-conformant
          sum-then-round order yields 190861. Different mode from the tiered-
          branching and circular-break instances.
        test_recipe:
          setup:
            - "Clock default; jurisdiction CA: deposit_cap_months=1.5, deposit_interest_required=true, deposit_interest_rate_pct=5.0, eviction_notice_days=3, habitability_repair_days=14"
            - "DEPOSIT script published; trained en counselor; caller; ACTIVE session"
          setup_api_calls:
            - { call: "POST /hotline/jurisdictions", payload: { code: "CA", name: "California", level: "STATE", eviction_notice_days: 3, habitability_repair_days: 14, deposit_cap_months: 1.5, deposit_interest_required: true, deposit_interest_rate_pct: 5.0 }, as: AgencyAdmin, captures: { jur: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Author A", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["DEPOSIT"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: false }, as: AgencyAdmin, captures: { auth: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Reviewer R", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["DEPOSIT"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: true }, as: AgencyAdmin, captures: { rev: $.data.id } }
            - { call: "POST /hotline/scripts", payload: { jurisdiction_id: "${jur}", issue_category: "DEPOSIT", version_no: 1, body: "deposit script v1" }, as: Counselor, as_user_id: "${auth}", captures: { scr1: $.data.id } }
            - { call: "POST /hotline/scripts/${scr1}/state", payload: { to_status: "IN_REVIEW" }, as: Counselor, as_user_id: "${auth}" }
            - { call: "POST /hotline/scripts/${scr1}/state", payload: { to_status: "PUBLISHED", effective_from: "2026-08-01T00:00:00Z" }, as: Counselor, as_user_id: "${rev}" }
            - { call: "POST /hotline/counselors", payload: { display_name: "Worker W", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["DEPOSIT"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: false }, as: AgencyAdmin, captures: { wk: $.data.id } }
            - { call: "POST /hotline/counselors/${wk}/training-certifications", payload: { script_id: "${scr1}", score: 90 }, as: HotlineSupervisor }
            - { call: "POST /hotline/callers", payload: { alias: "caller-1", phone: "+15550001", preferred_language: "en", channel: "PHONE", is_anonymous: false }, as: Anonymous, captures: { cal: $.data.id } }
            - { call: "POST /hotline/sessions", payload: { caller_id: "${cal}", jurisdiction_id: "${jur}", issue_category: "DEPOSIT" }, as: Anonymous, captures: { sess: $.data.id } }
            - { call: "POST /hotline/sessions/${sess}/state", payload: { to_status: "ASSIGNED", counselor_id: "${wk}" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/sessions/${sess}/state", payload: { to_status: "ACTIVE" }, as: Counselor, as_user_id: "${wk}" }
          trigger:
            - { call: "POST /hotline/cases", payload: { caller_id: "${cal}", opened_from_session_id: "${sess}", jurisdiction_id: "${jur}", issue_category: "DEPOSIT", deposit_amount_cents: 225111, monthly_rent_cents: 100000, deposit_days_held: 100 }, as: Counselor, as_user_id: "${wk}", captures: { case: $.data.id, exposure: $.data.deposit_exposure_cents } }
          assert:
            - "cap = round_half_up(100000 * 1.5) = 150000; over_cap = 225111 - 150000 = 75111"
            - "interest = round_half_up(225111 * 5.0 * 100 / 36500) = round_half_up(3083.7123...) = 3084"
            - "penalty = round_half_up(75111 * 1.5) = round_half_up(112666.5) = 112667"
            - "Case.${case}.deposit_exposure_cents == 190862 (75111 + 3084 + 112667); sum-then-round would give 190861 and is non-conformant"
            - "priority_score == 10 (deposit over cap only) and urgency_tier == STANDARD"

      - name: follow_up_cadence_circular_break
        grounds:
          - calculations.follow_up_cadence
          - calculations.case_priority_score
          - calculations.follow_up_timing
