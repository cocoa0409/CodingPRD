          - roles.LicensureAnalyst.shared_operations
          - roles.Investigator.shared_operations
          - roles.MonitoringCoordinator.shared_operations
          - roles.Applicant.shared_operations
        distinguishing_aspect: "GET /nurses/{id} is the one read declared for all six roles, and the Applicant reaches it only through the ownership rule: with X-User-ID equal to the nurse's own id the read succeeds identically to the staff reads, so the shared grant is real rather than nominal."
