            - call: "POST /funds/${fund9_id}/subscriptions"
              payload: { investor_id: "${inv_north_id}", committed_cents: 424999999, payin_schedule: [{ milestone: "CONSTRUCTION_START", share_pct: 0.5 }, { milestone: "PLACED_IN_SERVICE", share_pct: 0.5 }], expected_fund_version: "${fund9_version}" }
              as: Investor
              as_user_id: "${inv_north_id}"
              captures: { sub_under_id: $.data.id }
          assert:
            - "SyndicationFund.${fund_id}.subscribed_equity_cents == 425000000"
            - "SyndicationFund.${fund_id}.status == CLOSING"
            - "SyndicationFund.${fund9_id}.subscribed_equity_cents == 424999999"
            - "SyndicationFund.${fund9_id}.status == FORMING"

  - rule_id: cross_entity_state_dependency
    instances:

