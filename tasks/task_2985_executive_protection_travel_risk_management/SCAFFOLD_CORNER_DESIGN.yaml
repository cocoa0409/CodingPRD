            - call: "POST /exec-protection/insurance-policies"
              payload: { executive_id: "${exec_id}", policy_type: "MEDICAL_EVAC", coverage_cents: 50000000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { pol_id: $.data.id }
            - call: "POST /exec-protection/insurance-policies/${pol_id}/verify"
              payload: { outcome: "VERIFY", verification_note: "bound" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /exec-protection/risk-assessments"
              payload: { executive_id: "${exec_id}", authored_by_staff_id: "${analyst_id}", threat_monitoring_score: 20.00 }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /exec-protection/risk-assessments/${ra_id}/submit"
              payload: {}
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /exec-protection/risk-assessments/${ra_id}/review"
              payload: { outcome: "APPROVE", review_notes: "cleared" }
              as: SecurityDirector
              as_user_id: "${dir_id}"
            - call: "POST /exec-protection/trips"
              payload: { executive_id: "${exec_id}", created_by_staff_id: "${mgr_id}", risk_assessment_id: "${ra_id}", insurance_policy_id: "${pol_id}", trip_purpose: "BUSINESS_TRAVEL", primary_destination_country_code: "PT", depart_at: "2026-09-10T00:00:00Z", return_at: "2026-09-12T00:00:00Z", cost_allocation_method: "PRORATA" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /exec-protection/trips/${trip_id}/legs"
              payload: { sequence_no: 1, destination_country_code: "PT", arrive_at: "2026-09-10T00:00:00Z", depart_at: "2026-09-12T00:00:00Z" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { leg_id: $.data.id, leg_v0: $.data.version }
            - call: "POST /exec-protection/detail-assignments"
              payload: { trip_leg_id: "${leg_id}", staff_id: "${lead_id}", role_on_detail: "LEAD_AGENT", starts_at: "2026-09-10T08:00:00Z", ends_at: "2026-09-10T18:00:00Z", expected_trip_leg_version: "${leg_v0}" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
            - call: "POST /exec-protection/trip-legs/${leg_id}/advance-progress"
              payload: { item_type: "ROUTE_SURVEY", outcome: "COMPLETE", note: "route walked" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
            - call: "POST /exec-protection/trips/${trip_id}/submit-for-approval"
              payload: {}
              as: ProtectionManager
              as_user_id: "${mgr_id}"
            - call: "POST /exec-protection/trips/${trip_id}/briefing-ack"
              payload: {}
              as: Executive
              as_user_id: "${exec_id}"
            - call: "POST /exec-protection/trips/${trip_id}/decision"
              payload: { decision: "APPROVE" }
              as: SecurityDirector
              as_user_id: "${dir_id}"
              captures: { due0: $.data.next_check_in_due_at }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T00:00:00Z" }
              as: SystemOperator
              as_user_id: "ops-1"
          trigger:
            - call: "POST /exec-protection/trips/${trip_id}/check-ins"
              payload: { kind: "SCHEDULED", location_country_code: "PT", note: "at the hotel" }
              as: Executive
              as_user_id: "${exec_id}"
              captures: { ci1: $.data.id, late1: $.data.late }
            - call: "POST /exec-protection/trips/${trip_id}/check-ins"
              payload: { kind: "AD_HOC", note: "moving to the venue" }
              as: Executive
              as_user_id: "${exec_id}"
              captures: { ci2: $.data.id, late2: $.data.late }
          assert:
            - "${due0} == '2026-09-11T00:00:00.000Z' == max(depart_at 2026-09-10T00:00:00Z, approval clock 2026-08-01T00:00:00Z) + 24h"
            - "the SCHEDULED row reports reported_at == '2026-09-11T00:00:00.000Z' and ${late1} == false: the comparison is strict (>), so arriving exactly at the due instant is on time"
            - "after the SCHEDULED row Trip.next_check_in_due_at == '2026-09-12T00:00:00.000Z' == reported_at + 24h"
            - "the AD_HOC row reports ${late2} == false and leaves Trip.next_check_in_due_at at '2026-09-12T00:00:00.000Z' — an ad-hoc contact does not re-anchor the cadence"
            - "Trip.missed_check_in_count == 0, readiness_state is still READY and check_in_interval_hours is still 24"
            - "consent boundary honoured the other way: consent_scope is TRIP_ONLY and consent_expires_at is null, so the SCHEDULED row has consent_scope_snapshot == TRIP_ONLY, recorded_location_country_code == 'PT' and location_withheld == false"

      - name: constants_from_the_risk_calculation_are_applied_as_declared
        claim_type: constants_applied
        grounds:
          - calculations.composite_risk_score.constants
        excluded_because:
          difficulty_instance: combinatorial_formula / composite_risk_protest_floor_overrides_three_input_weighting
          rationale: "That instance pins TIER_UPLIFT and PROTEST_FLOOR by computing the same inputs with and without a severity-4 protest signal."

      - name: only_states_named_by_the_input_set_enter_the_trip_cost
        claim_type: input_set_filtering
        grounds:
          - calculations.trip_security_cost.input_set
        excluded_because:
          difficulty_instance: dual_variant_calc / trip_cost_provisional_vs_final_diverge_through_min_billable_floor
          rationale: "That instance includes CONFIRMED rows in the PROVISIONAL variant and RELEASED rows in the FINAL variant and asserts that CANCELLED rows enter neither."

      - name: exposure_decay_halves_each_half_life
        claim_type: decay_function
        grounds:
          - calculations.public_exposure_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / exposure_decay_weighted_vs_rolling_window_diverge_on_one_signal_set
          rationale: "That instance asserts the 30-day and 60-day decay weights against the unweighted rolling-window figure over one shared signal set."

      - name: risk_weights_sum_without_rounding_drift
        claim_type: weighted_scoring
        grounds:
          - calculations.composite_risk_score
        excluded_because:
          difficulty_instance: combinatorial_formula / composite_risk_protest_floor_overrides_three_input_weighting
          rationale: "That instance asserts the three-input weighted sum and its pinned evaluation order to the cent-equivalent hundredth."

      - name: perquisite_tier_edges_select_the_declared_rate
        claim_type: tiered_pricing
        grounds:
          - calculations.perquisite_allocation
        excluded_because:
          difficulty_instance: boundary_precision_check / perquisite_tier_boundary_inclusive_at_exactly_five_million_prior
          rationale: "That instance lands the prior-disclosure ledger on exactly 5000000 and asserts the 0.25 tier is selected rather than 0.10."

      - name: running_hour_totals_stay_correct_after_reversal
        claim_type: aggregation
        grounds:
          - calculations.commitment_ledgers
        excluded_because:
          difficulty_instance: compensating_invariant / vendor_suspension_restores_the_hours_ledger_without_touching_completed_rows
          rationale: "That instance asserts the Q_VENDOR_HOURS running total after each add and after the cancellation reversal."

      - name: perquisite_waterfall_reads_before_it_rolls_up
        claim_type: waterfall_allocation
        grounds:
          - calculations.perquisite_allocation
        excluded_because:
          difficulty_instance: combinatorial_formula / perquisite_tier_read_before_rollup_across_two_closes
          rationale: "That instance closes two trips in sequence and asserts the second close reads the ledger value the first close wrote, not a mid-step value."

      - name: band_changes_propagate_until_the_derived_set_is_stable
        claim_type: constraint_propagation
        grounds:
          - calculations.advance_requirement_set
        excluded_because:
          difficulty_instance: transitive_cascade / destination_rating_revision_cascades_four_hops_and_reopens_approval
          rationale: "That instance propagates one rating edit through leg bands, required advance sets and the trip's approval level to a fixed point."

      - name: both_cost_variants_differ_on_the_same_assignment_rows
        claim_type: variant_divergence
        grounds:
          - calculations.trip_security_cost.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / trip_cost_provisional_vs_final_diverge_through_min_billable_floor
          rationale: "That instance asserts both variant values over one unchanged set of assignments and the exact delta between them."

      - name: the_provisional_variant_applies_at_submit_and_the_final_one_at_close
        claim_type: variant_selection
        grounds:
          - calculations.trip_security_cost.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / trip_cost_provisional_vs_final_diverge_through_min_billable_floor
          rationale: "That instance asserts which variant each endpoint selects by reading provisional_security_cost_cents at submit and total_security_cost_cents at close."

      - name: the_variant_switch_reconciles_the_budget_ledger
        claim_type: reconciliation
        grounds:
          - state_machines.Trip.readiness_state.READY_to_CLOSED.side_effects
        excluded_because:
          difficulty_instance: dual_variant_calc / trip_cost_provisional_vs_final_diverge_through_min_billable_floor
          rationale: "That instance asserts committed_budget_cents falling by the provisional figure while spent_budget_cents rises by the final one at the same close."

  - section: validations
    instances:

      - name: business_only_allocation_is_permitted_only_for_business_travel
        claim_type: conditional_validation
        grounds:
          - validations[priority=45]
          - errors.ERR_ALLOCATION_METHOD_NOT_PERMITTED
          - entities.Trip.cost_allocation_method
        distinguishing_aspect: |
          The rule is conditional on a sibling input in the SAME request rather than on any
          stored state: BUSINESS_ONLY (which zeroes the taxable perquisite) is legal only when
          trip_purpose is BUSINESS_TRAVEL. The same purpose with PRORATA must be accepted, and
          the same allocation method with BUSINESS_TRAVEL must be accepted, so neither field is
          rejected on its own — only the combination is.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; one executive with a DRAFT assessment; PT rated"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "ops-1"
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Ana Analyst", staff_role: "ANALYST", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 9000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { analyst_id: $.data.id }
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Mia Manager", staff_role: "MANAGER", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 11000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { mgr_id: $.data.id }
            - call: "POST /exec-protection/executives"
              payload: { full_name: "Eve Exec", tier: "TIER_3", role_title: "CEO", base_country_code: "US", annual_security_budget_cents: 100000000 }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { exec_id: $.data.id }
            - call: "POST /exec-protection/destination-ratings"
              payload: { country_code: "PT", crime_index: 10.00, political_instability_index: 8.00, medical_infrastructure_index: 90.00, natural_hazard_index: 12.00, advisory_effective_at: "2026-07-01T00:00:00Z" }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /exec-protection/risk-assessments"
              payload: { executive_id: "${exec_id}", authored_by_staff_id: "${analyst_id}", threat_monitoring_score: 20.00 }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
              captures: { ra_id: $.data.id }
          trigger:
            - call: "POST /exec-protection/trips"
              payload: { executive_id: "${exec_id}", created_by_staff_id: "${mgr_id}", risk_assessment_id: "${ra_id}", trip_purpose: "BOARD_EVENT", primary_destination_country_code: "PT", depart_at: "2026-09-10T00:00:00Z", return_at: "2026-09-12T00:00:00Z", cost_allocation_method: "BUSINESS_ONLY" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { err: $.data.error_id }
            - call: "POST /exec-protection/trips"
              payload: { executive_id: "${exec_id}", created_by_staff_id: "${mgr_id}", risk_assessment_id: "${ra_id}", trip_purpose: "BOARD_EVENT", primary_destination_country_code: "PT", depart_at: "2026-09-10T00:00:00Z", return_at: "2026-09-12T00:00:00Z", cost_allocation_method: "PRORATA" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { ok1: $.data.id }
            - call: "POST /exec-protection/trips"
              payload: { executive_id: "${exec_id}", created_by_staff_id: "${mgr_id}", risk_assessment_id: "${ra_id}", trip_purpose: "BUSINESS_TRAVEL", primary_destination_country_code: "PT", depart_at: "2026-09-20T00:00:00Z", return_at: "2026-09-22T00:00:00Z", cost_allocation_method: "BUSINESS_ONLY" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { ok2: $.data.id }
          assert:
            - "the first create returns HTTP 422 with error_id == ERR_ALLOCATION_METHOD_NOT_PERMITTED"
            - "no row was written by the rejected call: GET /exec-protection/trips?executive_id=${exec_id} returns total_count == 2 after all three calls"
            - "the second create returns HTTP 201 with trip_purpose == BOARD_EVENT and cost_allocation_method == PRORATA — the purpose alone is not the problem"
            - "the third create returns HTTP 201 with trip_purpose == BUSINESS_TRAVEL and cost_allocation_method == BUSINESS_ONLY — the method alone is not the problem either"

      - name: leg_outside_the_trip_window_is_rejected_while_the_boundary_leg_is_accepted
        claim_type: temporal_validation
        grounds:
          - validations[priority=34]
          - errors.ERR_LEG_OUTSIDE_TRIP_WINDOW
        distinguishing_aspect: |
          Containment is checked on both ends with NON-strict comparisons, so the failing cases
          must miss by a whole day on either side while a leg whose arrive_at equals the trip's
          depart_at and whose depart_at equals the trip's return_at is accepted. This is distinct
          from ERR_INTERVAL_INVALID: each rejected leg is internally well ordered, it simply sits
          outside its parent's window.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; one DRAFT trip over 2026-09-10T00:00:00Z..2026-09-12T00:00:00Z; PT rated"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "ops-1"
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Ana Analyst", staff_role: "ANALYST", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 9000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { analyst_id: $.data.id }
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Mia Manager", staff_role: "MANAGER", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 11000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { mgr_id: $.data.id }
            - call: "POST /exec-protection/executives"
              payload: { full_name: "Eve Exec", tier: "TIER_3", role_title: "CEO", base_country_code: "US", annual_security_budget_cents: 100000000 }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { exec_id: $.data.id }
            - call: "POST /exec-protection/destination-ratings"
              payload: { country_code: "PT", crime_index: 10.00, political_instability_index: 8.00, medical_infrastructure_index: 90.00, natural_hazard_index: 12.00, advisory_effective_at: "2026-07-01T00:00:00Z" }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /exec-protection/risk-assessments"
              payload: { executive_id: "${exec_id}", authored_by_staff_id: "${analyst_id}", threat_monitoring_score: 20.00 }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /exec-protection/trips"
              payload: { executive_id: "${exec_id}", created_by_staff_id: "${mgr_id}", risk_assessment_id: "${ra_id}", trip_purpose: "BUSINESS_TRAVEL", primary_destination_country_code: "PT", depart_at: "2026-09-10T00:00:00Z", return_at: "2026-09-12T00:00:00Z" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { trip_id: $.data.id }
          trigger:
            - call: "POST /exec-protection/trips/${trip_id}/legs"
              payload: { sequence_no: 1, destination_country_code: "PT", arrive_at: "2026-09-09T00:00:00Z", depart_at: "2026-09-11T00:00:00Z" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { err_early: $.data.error_id }
            - call: "POST /exec-protection/trips/${trip_id}/legs"
              payload: { sequence_no: 2, destination_country_code: "PT", arrive_at: "2026-09-11T00:00:00Z", depart_at: "2026-09-13T00:00:00Z" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { err_late: $.data.error_id }
            - call: "POST /exec-protection/trips/${trip_id}/legs"
              payload: { sequence_no: 3, destination_country_code: "PT", arrive_at: "2026-09-10T00:00:00Z", depart_at: "2026-09-12T00:00:00Z" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { leg_id: $.data.id }
          assert:
            - "the leg arriving a day early returns HTTP 422 with error_id == ERR_LEG_OUTSIDE_TRIP_WINDOW (arrive_at < trip.depart_at)"
            - "the leg departing a day late returns HTTP 422 with error_id == ERR_LEG_OUTSIDE_TRIP_WINDOW (depart_at > trip.return_at)"
            - "the leg sitting exactly on both boundaries returns HTTP 201: the comparisons are >= and <=, so equality is inside the window"
            - "GET /exec-protection/trips/${trip_id}/legs returns total_count == 1 with sequence_no == 3 — the two rejected calls wrote nothing, and sequence_no 1 and 2 remain free"

      - name: route_survey_is_never_waivable_and_only_a_director_may_waive_anything
        claim_type: violation_to_error
        grounds:
          - validations[priority=30]
          - errors.ERR_WAIVER_NOT_PERMITTED
          - endpoints.POST_/exec-protection/trip-legs/{id}/advance-progress
        distinguishing_aspect: |
          The rule has two independent halves and this exercises both against the same leg: a
          SecurityDirector — the only role that may ever waive — is still refused on ROUTE_SURVEY,
          and a ProtectionManager is refused on HOTEL_SURVEY which the director may waive. The
          error is 403 rather than 409 because it is an authority limit, not a state gate, and
          the refused calls must leave both advance arrays untouched.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; one DRAFT trip with one PT leg (band LOW, required_advance_items ['ROUTE_SURVEY'])"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "ops-1"
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Ana Analyst", staff_role: "ANALYST", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 9000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { analyst_id: $.data.id }
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Mia Manager", staff_role: "MANAGER", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 11000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { mgr_id: $.data.id }
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Dan Director", staff_role: "DIRECTOR", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 15000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { dir_id: $.data.id }
            - call: "POST /exec-protection/executives"
              payload: { full_name: "Eve Exec", tier: "TIER_3", role_title: "CEO", base_country_code: "US", annual_security_budget_cents: 100000000 }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { exec_id: $.data.id }
            - call: "POST /exec-protection/destination-ratings"
              payload: { country_code: "PT", crime_index: 10.00, political_instability_index: 8.00, medical_infrastructure_index: 90.00, natural_hazard_index: 12.00, advisory_effective_at: "2026-07-01T00:00:00Z" }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /exec-protection/risk-assessments"
              payload: { executive_id: "${exec_id}", authored_by_staff_id: "${analyst_id}", threat_monitoring_score: 20.00 }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /exec-protection/trips"
              payload: { executive_id: "${exec_id}", created_by_staff_id: "${mgr_id}", risk_assessment_id: "${ra_id}", trip_purpose: "BUSINESS_TRAVEL", primary_destination_country_code: "PT", depart_at: "2026-09-10T00:00:00Z", return_at: "2026-09-12T00:00:00Z" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /exec-protection/trips/${trip_id}/legs"
              payload: { sequence_no: 1, destination_country_code: "PT", arrive_at: "2026-09-10T00:00:00Z", depart_at: "2026-09-12T00:00:00Z" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { leg_id: $.data.id }
          trigger:
            - call: "POST /exec-protection/trip-legs/${leg_id}/advance-progress"
              payload: { item_type: "ROUTE_SURVEY", outcome: "WAIVED", note: "no time to walk it" }
              as: SecurityDirector
              as_user_id: "${dir_id}"
              captures: { err_route: $.data.error_id }
            - call: "POST /exec-protection/trip-legs/${leg_id}/advance-progress"
              payload: { item_type: "HOTEL_SURVEY", outcome: "WAIVED", note: "known property" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { err_role: $.data.error_id }
            - call: "POST /exec-protection/trip-legs/${leg_id}/advance-progress"
              payload: { item_type: "HOTEL_SURVEY", outcome: "WAIVED", note: "known property" }
              as: SecurityDirector
              as_user_id: "${dir_id}"
              captures: { waived: $.data.waived_advance_items }
          assert:
            - "the director's ROUTE_SURVEY waiver returns HTTP 403 with error_id == ERR_WAIVER_NOT_PERMITTED — the item is never waivable by any role"
            - "the manager's HOTEL_SURVEY waiver returns HTTP 403 with error_id == ERR_WAIVER_NOT_PERMITTED — the role, not the item, is the problem here"
            - "after the two refusals the leg still has completed_advance_items == [] and waived_advance_items == [], advance_complete == false, and Trip.readiness_state == NOT_READY (no first item was ever recorded)"
            - "the director's HOTEL_SURVEY waiver returns HTTP 200 with ${waived} == ['HOTEL_SURVEY'] and completed_advance_items == []"
