  # ===========================================================================
  - section: calculations
    instances:
      - name: late_fee_boundary_29_vs_30_days
        claim_type: correct_result
        grounds: [calculations.late_fee_accrual]
        distinguishing_aspect: "Threshold precision: at exactly 30 days past due one 1.5% period applies (15000 on subtotal 1000000); at 29 days the fee is exactly 0."
        test_recipe:
          setup: ["Account ACTIVE; manual invoice subtotal 1000000, due_on 2026-08-20T00:00Z, ISSUED 2026-08-01"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Corp", account_type: CORPORATE, tax_id: "T-100", billing_email: "ap@acme.example" }, as: PremiumSalesRep, captures: { ac: $.data.id } }
            - { call: "POST /api/accounts/${ac}/set_status", payload: { target_status: "ACTIVE" }, as: FinanceController }
            - { call: "POST /api/invoices", payload: { account_id: "${ac}", lines: [ { description: "Club deposit", quantity: 1, unit_price_cents: 1000000 } ], due_on: "2026-08-20T00:00:00Z" }, as: FinanceController, captures: { inv: $.data.id } }
            - { call: "POST /api/invoices/${inv}/issue", payload: {}, as: FinanceController }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-18T00:00:00Z" }, as: StadiumAdmin }
          trigger:
            - { call: "GET /api/invoices/${inv}", payload: {}, as: FinanceController, captures: { fee29: $.data.late_fee_cents, due29: $.data.amount_due_cents } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-19T00:00:00Z" }, as: StadiumAdmin }
            - { call: "GET /api/invoices/${inv}", payload: {}, as: FinanceController, captures: { fee30: $.data.late_fee_cents, due30: $.data.amount_due_cents } }
          assert:
            - "At 29 days past due: late_fee_cents == 0 and amount_due_cents == 1000000"
            - "At exactly 30 days past due: late_fee_cents == 15000 and amount_due_cents == 1015000 (boundary uses >=)"

      - name: late_fee_floor_and_cap
        claim_type: constants_applied
        grounds: [calculations.late_fee_accrual]
        distinguishing_aspect: "MIN_FEE_CENTS 2500 floors a tiny first-period fee (raw 1500 on subtotal 100000 -> 2500); CAP_RATE 15% caps a long-overdue fee (subtotal 1000000 at 300 days -> 150000, not 150000+ growth)."
        test_recipe:
          setup: ["Account ACTIVE; invoice A subtotal 100000 due 2026-08-20 ISSUED; invoice B subtotal 1000000 due 2026-08-20 ISSUED"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Corp", account_type: CORPORATE, tax_id: "T-100", billing_email: "ap@acme.example" }, as: PremiumSalesRep, captures: { ac: $.data.id } }
            - { call: "POST /api/accounts/${ac}/set_status", payload: { target_status: "ACTIVE" }, as: FinanceController }
            - { call: "POST /api/invoices", payload: { account_id: "${ac}", lines: [ { description: "Small", quantity: 1, unit_price_cents: 100000 } ], due_on: "2026-08-20T00:00:00Z" }, as: FinanceController, captures: { inva: $.data.id } }
            - { call: "POST /api/invoices/${inva}/issue", payload: {}, as: FinanceController }
            - { call: "POST /api/invoices", payload: { account_id: "${ac}", lines: [ { description: "Big", quantity: 1, unit_price_cents: 1000000 } ], due_on: "2026-08-20T00:00:00Z" }, as: FinanceController, captures: { invb: $.data.id } }
            - { call: "POST /api/invoices/${invb}/issue", payload: {}, as: FinanceController }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-19T00:00:00Z" }, as: StadiumAdmin }
            - { call: "GET /api/invoices/${inva}", payload: {}, as: FinanceController, captures: { feea: $.data.late_fee_cents } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-06-16T00:00:00Z" }, as: StadiumAdmin }
            - { call: "GET /api/invoices/${invb}", payload: {}, as: FinanceController, captures: { feeb: $.data.late_fee_cents } }
          assert:
            - "feea == 2500 (floor: raw 1500 < MIN_FEE_CENTS 2500 at 1 period)"
            - "feeb == 150000 (cap: min(raw 150000 at 10 periods, cap 150000); 11+ periods would still be 150000)"

      - name: late_fee_not_charged_on_draft
        claim_type: input_set_filtering
        grounds: [calculations.late_fee_accrual]
        distinguishing_aspect: "DRAFT invoices are excluded from the late-fee input set: far past due_on, a DRAFT still reads late_fee_cents == 0 and amount_due == subtotal."
        test_recipe:
          setup: ["Account exists; manual invoice DRAFT (never issued) with due_on 2026-08-20; clock 2026-12-01"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Corp", account_type: CORPORATE, tax_id: "T-100", billing_email: "ap@acme.example" }, as: PremiumSalesRep, captures: { ac: $.data.id } }
