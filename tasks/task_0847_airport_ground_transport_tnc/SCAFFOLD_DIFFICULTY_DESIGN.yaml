  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: curb_half_open_interval_overlap_conflict
        grounds:
          - validations[priority=16]
          - entities.CurbAssignment.fields.start_ts
          - entities.CurbAssignment.fields.end_ts
          - entities.CurbZone.fields.capacity
        distinguishing_aspect: |
          Half-open [start,end) capacity-aggregate overlap on CurbZone: with capacity 1, a
          second window [10:15,10:45) overlapping an ACTIVE [10:00,10:30) is rejected
          (a<d and c<b). Adjacency (end==start) would be allowed; this test uses genuine overlap.
        test_recipe:
          setup:
            - "Operator ACTIVE; two dispatched trips (two vehicles); a capacity-1 curb zone with an ACTIVE [10:00,10:30) assignment on trip1; clock 2026-04-25T09:00:00Z."
