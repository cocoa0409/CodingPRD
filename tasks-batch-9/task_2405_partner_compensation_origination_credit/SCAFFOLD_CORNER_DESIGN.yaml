# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Scaffold Corner Design
#
# Domain: partner-compensation-origination-credit (api_prefix /comp)
#
# Breadth probe. The nine `section:` values below are exactly the nine sections of
# references/claim-extraction-guide.md, walked row by row against this scaffold's
# §1.1–§1.7 surface. `claim_type:` values are taken verbatim from that guide's
# per-section tables; no category is invented.
#
# Corners already asserted by a §1.8 instance are emitted as `excluded_because:`
# stubs naming that instance and carry no `test_recipe:`. Every remaining instance
# carries an executable empty-DB chain.
#
# Logical clock default for every instance: 2026-08-01T00:00:00Z.

scaffold_corner_design:

  # =====================================================================
  - section: entities
    instances:

      - name: create_cycle_returns_declared_fields_and_pool_defaults
        claim_type: Creation
        grounds:
          - endpoints[POST /comp/cycles]
          - entities.CompensationCycle.fields.discretionary_pool_pct
          - entities.CompensationCycle.fields.draw_pct
          - entities.CompensationCycle.fields.state
          - response_envelope.success
        distinguishing_aspect: |
          POST /comp/cycles with only the five required inputs returns 201 with
          discretionary_pool_pct 0.2000, draw_pct 0.8000, state OPEN_INTAKE, every computed
          counter at its declared zero and version 1 - the two optional pool fractions are
          defaulted, not left null.
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
            - "No CompensationCycle exists, so fiscal_year 2026 is free."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
          trigger:
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 5000000, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id", cyv: "$.data.version" }
          assert:
            - "HTTP 201"
            - "CompensationCycle.${cy}.discretionary_pool_pct == 0.2000"
            - "CompensationCycle.${cy}.draw_pct == 0.8000"
            - "CompensationCycle.${cy}.state == OPEN_INTAKE"
            - "CompensationCycle.${cy}.lockstep_reserved_cents == 0 and discretionary_pool_cents == 0 and formula_pool_cents == 0"
            - "CompensationCycle.${cy}.haircut_applied_pct == 0.0000 and total_formula_score == 0.0000 and total_committee_points == 0.0000"
            - "CompensationCycle.${cy}.undistributed_cash_cents == 0 and unsettled_award_count == 0 and reopen_count == 0"
            - "CompensationCycle.${cy}.confidentiality_locked == false"
            - "${cyv} == 1"
            - "the response body carries meta.api_request_id, meta.api_request_timestamp, response_type object and data"

      - name: partner_boolean_and_capital_defaults_applied_when_omitted
        claim_type: Defaults
        grounds:
          - endpoints[POST /comp/partners]
          - entities.Partner.fields.evaluation_required
          - entities.Partner.fields.is_committee_member
          - entities.Partner.fields.is_credit_arbiter
          - entities.Partner.fields.lockstep_step
          - entities.Partner.fields.capital_account_balance_cents
        distinguishing_aspect: |
          Omitting every optional Partner input yields evaluation_required true (not false),
          is_committee_member false, is_credit_arbiter false, lockstep_step 0,
          opening_capital_cents 0 and target_capital_cents 0 - and
          capital_account_balance_cents is seeded from opening_capital_cents rather than
          left null.
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
          trigger:
            - call: "POST /comp/partners"
              payload: { full_name: "Dee Fault", practice_group: "TAX", compensation_model: "FORMULA", admission_year: 2016 }
              as: CycleAdmin
              captures: { p: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Cap Seeded", practice_group: "TAX", compensation_model: "FORMULA", admission_year: 2016, opening_capital_cents: 4500000, target_capital_cents: 9000000 }
              as: CycleAdmin
              captures: { p2: "$.data.id" }
          assert:
            - "Partner.${p}.evaluation_required == true"
            - "Partner.${p}.is_committee_member == false and Partner.${p}.is_credit_arbiter == false"
            - "Partner.${p}.lockstep_step == 0"
            - "Partner.${p}.opening_capital_cents == 0 and Partner.${p}.target_capital_cents == 0"
            - "Partner.${p}.capital_account_balance_cents == 0"
            - "Partner.${p}.status == ACTIVE"
            - "Partner.${p2}.capital_account_balance_cents == 4500000, seeded from opening_capital_cents"
            - "Partner.${p2}.target_capital_cents == 9000000"

      - name: create_matter_missing_responsible_attorney_is_rejected
        claim_type: Required Fields
        grounds:
          - endpoints[POST /comp/matters]
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=40]
        distinguishing_aspect: |
          Every non-optional field of POST /comp/matters is required at priority 40: omitting
          responsible_attorney_id returns ERR_INVALID_REQUEST 422 and creates no Matter and
          no seeded CreditAllocation, even though billing_attorney_id alone would be enough
          to identify an owner.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one ACTIVE Partner exists to serve as billing attorney."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/partners"
              payload: { full_name: "Ada Origin", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2010 }
              as: CycleAdmin
              captures: { pa: "$.data.id" }
          trigger:
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-M1", client_display_name: "Missing Fields Inc", matter_type: "EXISTING", practice_group: "CORPORATE", opened_on: "2026-01-10", billing_attorney_id: "${pa}" }
              as: CycleAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 422"
            - "GET /comp/matters with client_key CLI-M1 returns an empty list"
            - "GET /comp/partners/${pa} shows responsible_matter_count == 0"
            - "no CreditAllocation exists for ${pa}"

      - name: contribution_record_standard_value_is_computed_not_input
        claim_type: Computed Fields
        grounds:
          - endpoints[POST /comp/contribution-records]
          - entities.ContributionRecord.fields.standard_value_cents
          - entities.ContributionRecord.fields.verified
          - entities.ContributionRecord.fields.kind
        distinguishing_aspect: |
          standard_value_cents is computed as hours * standard_rate_cents for BILLABLE rows
          and forced to 0 for NON_BILLABLE rows regardless of any standard_rate_cents
          supplied - 12.50 hours at 48000 cents yields exactly 600000, and the same rate on
          a NON_BILLABLE row yields 0.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 in OPEN_INTAKE; Partner P is the billing and responsible attorney of OPEN Matter M."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Cal Compute", practice_group: "IP", compensation_model: "FORMULA", admission_year: 2016 }
              as: CycleAdmin
              captures: { pp: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-CV", client_display_name: "Computed Value Ltd", matter_type: "EXISTING", practice_group: "IP", opened_on: "2026-01-10", billing_attorney_id: "${pp}", responsible_attorney_id: "${pp}" }
              as: CycleAdmin
              captures: { m: "$.data.id" }
          trigger:
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${pp}", cycle_id: "${cy}", matter_id: "${m}", kind: "BILLABLE", category: "CLIENT_WORK", hours: 12.50, standard_rate_cents: 48000, service_period_start: "2026-02-01", service_period_end: "2026-02-28" }
              as: CycleAdmin
              captures: { b: "$.data.id", bval: "$.data.standard_value_cents", bver: "$.data.verified" }
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${pp}", cycle_id: "${cy}", kind: "NON_BILLABLE", category: "RECRUITING", hours: 12.50, standard_rate_cents: 48000, service_period_start: "2026-03-01", service_period_end: "2026-03-31" }
              as: CycleAdmin
              captures: { n: "$.data.id", nval: "$.data.standard_value_cents" }
          assert:
            - "${bval} == 600000"
            - "${nval} == 0, even though standard_rate_cents 48000 was supplied"
            - "${bver} == false and ContributionRecord.${b}.verified_at is null"
            - "Partner.${pp}.verified_billable_hours == 0.00 and Partner.${pp}.non_billable_points == 0.00"
            - "Matter.${m}.verified_billable_hours == 0.00"
            - "ContributionRecord.${n}.matter_id is null"

      - name: partner_system_fields_generated_and_version_starts_at_one
        claim_type: System Fields
        grounds:
          - entities.Partner.fields.status
          - endpoints[POST /comp/partners]
          - response_envelope.success
        distinguishing_aspect: |
          id, created_at, updated_at and version are minted by the server on POST
          /comp/partners: version is exactly 1, status is ACTIVE (a system field that no
          input can set) and departure_effective_on is null until notice-of-departure.
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
          trigger:
            - call: "POST /comp/partners"
              payload: { full_name: "Sys Field", practice_group: "LITIGATION", compensation_model: "DISCRETIONARY", admission_year: 2017 }
              as: CycleAdmin
              captures: { p: "$.data.id", v: "$.data.version", ca: "$.data.created_at", ua: "$.data.updated_at" }
          assert:
            - "${v} == 1"
            - "${p} is a server-minted UUID that was not present in the request body"
            - "${ca} == 2026-08-01T00:00:00Z and ${ua} == 2026-08-01T00:00:00Z, both read from the logical clock"
            - "Partner.${p}.status == ACTIVE"
            - "Partner.${p}.departure_effective_on is null"
            - "GET /comp/partners/${p} returns the identical row"

      - name: invalid_enum_and_out_of_range_values_are_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Partner.fields.practice_group
          - entities.Partner.fields.lockstep_step
          - entities.CompensationCycle.fields.discretionary_pool_pct
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=40]
        distinguishing_aspect: |
          Priority-40 schema validation rejects an unknown practice_group enum member, a
          discretionary_pool_pct above 1.0000, and the cross-field constraint that
          lockstep_step MUST be >= 1 for a LOCKSTEP partner and MUST be 0 for any other
          model - all three with ERR_INVALID_REQUEST 422 and no row written.
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
          trigger:
            - call: "POST /comp/partners"
              payload: { full_name: "Bad Group", practice_group: "MARITIME", compensation_model: "FORMULA", admission_year: 2016 }
              as: CycleAdmin
              captures: { err_enum: "$.data.error_id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Bad Step", practice_group: "TAX", compensation_model: "LOCKSTEP", admission_year: 2016, lockstep_step: 0 }
              as: CycleAdmin
              captures: { err_step_zero: "$.data.error_id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Bad Step Two", practice_group: "TAX", compensation_model: "FORMULA", admission_year: 2016, lockstep_step: 4 }
              as: CycleAdmin
              captures: { err_step_set: "$.data.error_id" }
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, discretionary_pool_pct: 1.5000, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { err_pct: "$.data.error_id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Good Step", practice_group: "TAX", compensation_model: "LOCKSTEP", admission_year: 2016, lockstep_step: 4 }
              as: CycleAdmin
              captures: { ok: "$.data.id" }
          assert:
            - "${err_enum} == ERR_INVALID_REQUEST with HTTP 422"
            - "${err_step_zero} == ERR_INVALID_REQUEST with HTTP 422"
            - "${err_step_set} == ERR_INVALID_REQUEST with HTTP 422"
            - "${err_pct} == ERR_INVALID_REQUEST with HTTP 422"
            - "GET /comp/partners returns exactly 1 row after all four rejections plus the accepted call"
            - "Partner.${ok}.lockstep_step == 4 and Partner.${ok}.compensation_model == LOCKSTEP"
            - "GET /comp/cycles returns an empty list"

      - name: draw_payment_is_immutable_and_carries_no_version_field
        claim_type: Immutability
        grounds:
          - entities.DrawPayment
          - endpoints[GET /comp/draw-payments/{id}]
          - endpoints[GET /comp/awards/{id}/draw-payments]
          - entities.DrawPayment.fields.reversed
        distinguishing_aspect: |
          DrawPayment declares common_fields false: its read responses expose no version
          field, §1.5 declares no POST, PATCH or DELETE for it, and the only way its
          reversed flag changes is the cycle reopen cascade - so the ledger is append-only
          and every correction is a new signed row.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A DISCRETIONARY partner's award has been published in cycle fiscal_year 2026 and its 2026-01 draw of 1333333 has been paid, producing exactly one DrawPayment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, discretionary_pool_pct: 0.2000, draw_pct: 0.8000, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Dana Subject", practice_group: "CORPORATE", compensation_model: "DISCRETIONARY", admission_year: 2012 }
              as: CycleAdmin
              captures: { subj: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Cora Chair", practice_group: "TAX", compensation_model: "FORMULA", admission_year: 2005, is_committee_member: true, evaluation_required: false }
              as: CycleAdmin
              captures: { cm1: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Milo Member", practice_group: "IP", compensation_model: "FORMULA", admission_year: 2007, is_committee_member: true, evaluation_required: false }
              as: CycleAdmin
              captures: { cm2: "$.data.id" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "SELF_ASSESSMENT" }
              as: CycleAdmin
            - call: "POST /comp/self-assessments"
              payload: { cycle_id: "${cy}", narrative: "Client development and firm service summary.", claimed_origination_pct_total: 0.00, claimed_non_billable_hours: 0.00 }
              as: Partner
              as_user_id: "${subj}"
              captures: { sa: "$.data.id" }
            - call: "POST /comp/self-assessments/${sa}/submit"
              payload: {}
              as: Partner
              as_user_id: "${subj}"
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "${sa}", reviewer_partner_id: "${cm1}" }
              as: CycleAdmin
              captures: { pr1: "$.data.id" }
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "${sa}", reviewer_partner_id: "${cm2}" }
              as: CycleAdmin
              captures: { pr2: "$.data.id" }
            - call: "POST /comp/peer-reviews/${pr1}/decide"
              payload: { outcome: "SCORE", technical_score: 4, collaboration_score: 4, client_service_score: 4, comment: "Consistently strong." }
              as: Partner
              as_user_id: "${cm1}"
            - call: "POST /comp/peer-reviews/${pr2}/decide"
              payload: { outcome: "SCORE", technical_score: 4, collaboration_score: 4, client_service_score: 4, comment: "No concerns." }
              as: Partner
              as_user_id: "${cm2}"
            - call: "POST /comp/self-assessments/${sa}/review-decision"
              payload: { decision: "ACCEPT" }
              as: CommitteeMember
              as_user_id: "${cm1}"
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "PEER_REVIEW" }
              as: CycleAdmin
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "DELIBERATION" }
              as: CycleAdmin
            - call: "GET /comp/ballots"
              payload: { subject_partner_id: "${subj}", committee_member_id: "${cm1}" }
              as: CycleAdmin
              captures: { b1: "$.data[0].id" }
            - call: "GET /comp/ballots"
              payload: { subject_partner_id: "${subj}", committee_member_id: "${cm2}" }
              as: CycleAdmin
              captures: { b2: "$.data[0].id" }
            - call: "GET /comp/cycles/${cy}"
              payload: {}
              as: CycleAdmin
              captures: { cyv1: "$.data.version" }
            - call: "POST /comp/ballots/${b1}/cast"
              payload: { action: "CAST", points_proposed: 800.00, rationale: "Outstanding year.", expected_cycle_version: "${cyv1}" }
              as: CommitteeMember
              as_user_id: "${cm1}"
            - call: "GET /comp/cycles/${cy}"
              payload: {}
              as: CycleAdmin
              captures: { cyv2: "$.data.version" }
            - call: "POST /comp/ballots/${b2}/cast"
              payload: { action: "CAST", points_proposed: 600.00, rationale: "Solid year.", expected_cycle_version: "${cyv2}" }
              as: CommitteeMember
              as_user_id: "${cm2}"
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "AWARDS_PUBLISHED" }
              as: CycleAdmin
            - call: "GET /comp/awards"
              payload: { cycle_id: "${cy}", partner_id: "${subj}" }
              as: CycleAdmin
              captures: { aw: "$.data[0].id" }
            - call: "POST /comp/awards/${aw}/draw-run"
              payload: { period_year: 2026, period_month: 1 }
              as: CycleAdmin
          trigger:
            - call: "GET /comp/awards/${aw}/draw-payments"
              payload: { kind: "SCHEDULED_DRAW" }
              as: CycleAdmin
              captures: { dp: "$.data[0].id", dpamt: "$.data[0].amount_cents", dprev: "$.data[0].reversed" }
            - call: "GET /comp/draw-payments/${dp}"
              payload: {}
              as: CycleAdmin
              captures: { dp_kind: "$.data.kind", dp_year: "$.data.period_year", dp_month: "$.data.period_month" }
          assert:
            - "${dpamt} == 1333333 and ${dprev} == false"
            - "${dp_kind} == SCHEDULED_DRAW, ${dp_year} == 2026 and ${dp_month} == 1"
            - "the GET /comp/draw-payments/${dp} response body contains no version field"
            - "§1.5 declares no POST, PATCH or DELETE endpoint whose path resolves to /comp/draw-payments/${dp}"
            - "GET /comp/awards/${aw}/draw-payments returns exactly 1 row"

      - name: peer_review_requires_an_existing_self_assessment_parent
        claim_type: Parent Relationships
        grounds:
          - endpoints[POST /comp/peer-reviews]
          - errors[ERR_ASSESSMENT_NOT_FOUND]
          - validations[priority=55]
        distinguishing_aspect: |
          POST /comp/peer-reviews resolves its self_assessment_id parent at priority 55
          before any state or duplicate check: an unknown assessment id returns
          ERR_ASSESSMENT_NOT_FOUND 404, not ERR_INVALID_REQUEST and not
          ERR_ASSESSMENT_NOT_REVIEWABLE.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 in SELF_ASSESSMENT."
            - "Partner R exists as a candidate reviewer; no SelfAssessment carries the id used in the trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Rita Reviewer", practice_group: "TAX", compensation_model: "FORMULA", admission_year: 2009, evaluation_required: false }
              as: CycleAdmin
              captures: { rev: "$.data.id" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "SELF_ASSESSMENT" }
              as: CycleAdmin
          trigger:
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "11111111-1111-4111-8111-111111111111", reviewer_partner_id: "${rev}" }
              as: CycleAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_ASSESSMENT_NOT_FOUND with HTTP 404"
            - "GET /comp/peer-reviews returns an empty list"
            - "the response is not ERR_INVALID_REQUEST and not ERR_ASSESSMENT_NOT_REVIEWABLE"

      - name: list_partners_pagination_filtering_and_ordering
        claim_type: Listing
        grounds:
          - endpoints[GET /comp/partners]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          GET /comp/partners orders by created_at ASC and pages independently of filtering:
          with four partners created in a known order, limit 2 offset 1 returns the second
          and third with total_count 4 and has_more true, while
          compensation_model=DISCRETIONARY narrows total_count to 1 and sets has_more false.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Four partners are created in this order: P1 LITIGATION FORMULA, P2 CORPORATE DISCRETIONARY, P3 TAX LOCKSTEP step 3, P4 IP FORMULA."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/partners"
              payload: { full_name: "P One", practice_group: "LITIGATION", compensation_model: "FORMULA", admission_year: 2010 }
              as: CycleAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "P Two", practice_group: "CORPORATE", compensation_model: "DISCRETIONARY", admission_year: 2011 }
              as: CycleAdmin
              captures: { p2: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "P Three", practice_group: "TAX", compensation_model: "LOCKSTEP", admission_year: 2012, lockstep_step: 3 }
              as: CycleAdmin
              captures: { p3: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "P Four", practice_group: "IP", compensation_model: "FORMULA", admission_year: 2013 }
              as: CycleAdmin
              captures: { p4: "$.data.id" }
          trigger:
            - call: "GET /comp/partners"
              payload: { limit: 2, offset: 1 }
              as: CycleAdmin
              captures: { first: "$.data[0].id", second: "$.data[1].id" }
            - call: "GET /comp/partners"
              payload: { compensation_model: "DISCRETIONARY" }
              as: CycleAdmin
              captures: { only: "$.data[0].id" }
          assert:
            - "${first} == ${p2} and ${second} == ${p3}, i.e. created_at ASC order with offset 1"
            - "the paged response reports total_count 4 and has_more true"
            - "the filtered response returns exactly one row with ${only} == ${p2}, total_count 1 and has_more false"
            - "response_type is array in both responses"
            - "omitting limit and offset returns all 4 rows, since the default limit is 10"

      - name: get_partner_returns_the_stored_row_unchanged
        claim_type: Retrieval
        grounds:
          - endpoints[GET /comp/partners/{id}]
          - endpoints[POST /comp/partners]
        distinguishing_aspect: |
          GET /comp/partners/{id} returns exactly the row POST created - same id, same
          version 1, same full_name, practice_group, compensation_model and admission_year -
          with no field silently normalised or dropped.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one partner has been created with every optional field supplied explicitly."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/partners"
              payload: { full_name: "Ren Read", practice_group: "REGULATORY", compensation_model: "LOCKSTEP", admission_year: 2003, lockstep_step: 7, is_committee_member: true, is_credit_arbiter: true, evaluation_required: true, opening_capital_cents: 1000000, target_capital_cents: 5000000 }
              as: CycleAdmin
              captures: { p: "$.data.id", v: "$.data.version" }
          trigger:
            - call: "GET /comp/partners/${p}"
              payload: {}
              as: CycleAdmin
              captures: { rv: "$.data.version", rid: "$.data.id" }
          assert:
            - "${rid} == ${p} and ${rv} == ${v}"
            - "Partner.${p}.lockstep_step == 7, is_committee_member == true, is_credit_arbiter == true"
            - "Partner.${p}.opening_capital_cents == 1000000 and capital_account_balance_cents == 1000000"
            - "Partner.${p}.target_capital_cents == 5000000 and admission_year == 2003"
            - "Partner.${p}.practice_group == REGULATORY and compensation_model == LOCKSTEP"

      - name: credit_allocation_junction_carries_role_and_interval_per_partner_matter_pair
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.CreditAllocation.fields.credit_role
          - endpoints[GET /comp/matters/{id}/credit-allocations]
          - endpoints[GET /comp/partners/{id}/credit-allocations]
        distinguishing_aspect: |
          CreditAllocation is a role-qualified Partner x Matter junction, not a child of
          either: the same (partner, matter) pair legitimately carries two distinct rows
          (BILLING and RESPONSIBLE) and the same row is reachable from both traversal
          directions - GET /comp/matters/{id}/credit-allocations and
          GET /comp/partners/{id}/credit-allocations - with identical ids.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Partner P is both billing and responsible attorney of OPEN Matter M, so matter creation seeded two allocations for the same pair."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/partners"
              payload: { full_name: "Jun Junction", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2016 }
              as: CycleAdmin
              captures: { pp: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-JN", client_display_name: "Junction Joint Ltd", matter_type: "EXISTING", practice_group: "CORPORATE", opened_on: "2026-01-20", billing_attorney_id: "${pp}", responsible_attorney_id: "${pp}" }
              as: CycleAdmin
              captures: { m: "$.data.id" }
          trigger:
            - call: "GET /comp/matters/${m}/credit-allocations"
              payload: { credit_role: "BILLING" }
              as: CycleAdmin
              captures: { bill: "$.data[0].id", bill_pct: "$.data[0].credit_pct", bill_from: "$.data[0].credit_from" }
            - call: "GET /comp/partners/${pp}/credit-allocations"
              payload: { credit_role: "BILLING" }
              as: CycleAdmin
              captures: { bill_rev: "$.data[0].id" }
            - call: "GET /comp/credit-allocations/${bill}"
              payload: {}
              as: CycleAdmin
              captures: { bill_role: "$.data.credit_role", bill_through: "$.data.credit_through", bill_src: "$.data.source" }
          assert:
            - "${bill_rev} == ${bill}, so the same junction row is reachable from both the Matter side and the Partner side"
            - "${bill_role} == BILLING, ${bill_pct} == 100.00, ${bill_from} == 2026-01-20 and ${bill_through} is null"
            - "${bill_src} == DEFAULT_BILLING"
            - "GET /comp/matters/${m}/credit-allocations without a credit_role filter returns exactly 2 rows, one BILLING and one RESPONSIBLE, both for ${pp}"
            - "GET /comp/matters/${m}/credit-allocations with credit_role ORIGINATING returns an empty list"
            - "Partner.${pp}.responsible_matter_count == 1"

  # =====================================================================
  - section: state_machines
    instances:

      - name: new_rows_start_in_their_declared_initial_states
        claim_type: Initial State
        grounds:
          - state_machines[CompensationCycle].initial_state
          - state_machines[Matter].initial_state
          - state_machines[CreditAllocation].initial_state
          - state_machines[CreditClaim].initial_state
          - state_machines[SelfAssessment].initial_state
          - state_machines[Partner].initial_state
        distinguishing_aspect: |
          Six machines are seeded on create, and each starts where §1.2 says: cycle
          OPEN_INTAKE, matter OPEN, the two auto-seeded allocations ACTIVE, claim DRAFT,
          assessment DRAFT and partner ACTIVE - no entity is born mid-lifecycle.
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
          trigger:
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id", cy_state: "$.data.state" }
            - call: "POST /comp/partners"
              payload: { full_name: "Ini Tial", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2014 }
              as: CycleAdmin
              captures: { pp: "$.data.id", p_state: "$.data.status" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-IN", client_display_name: "Initial State Co", matter_type: "NEW", practice_group: "CORPORATE", opened_on: "2026-02-01", billing_attorney_id: "${pp}", responsible_attorney_id: "${pp}" }
              as: CycleAdmin
              captures: { m: "$.data.id", m_state: "$.data.state" }
            - call: "GET /comp/matters/${m}/credit-allocations"
              payload: {}
              as: CycleAdmin
              captures: { a1_state: "$.data[0].state", a2_state: "$.data[1].state" }
            - call: "POST /comp/credit-claims"
              payload: { cycle_id: "${cy}", matter_id: "${m}", claim_basis: "NEW_CLIENT", requested_pct: 100.00, narrative: "I originated this client." }
              as: Partner
              as_user_id: "${pp}"
              captures: { cl: "$.data.id", cl_state: "$.data.state" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "SELF_ASSESSMENT" }
              as: CycleAdmin
            - call: "POST /comp/self-assessments"
              payload: { cycle_id: "${cy}", narrative: "My year in review.", claimed_origination_pct_total: 100.00, claimed_non_billable_hours: 0.00 }
              as: Partner
              as_user_id: "${pp}"
              captures: { sa: "$.data.id", sa_state: "$.data.state" }
          assert:
            - "${cy_state} == OPEN_INTAKE"
            - "${p_state} == ACTIVE"
            - "${m_state} == OPEN"
            - "${a1_state} == ACTIVE and ${a2_state} == ACTIVE"
            - "${cl_state} == DRAFT with CreditClaim.${cl}.remand_count == 0 and revision_count == 0"
            - "${sa_state} == DRAFT with SelfAssessment.${sa}.scored_review_count == 0 and revision_count == 0"
            - "the DRAFT claim did not block OPEN_INTAKE -> SELF_ASSESSMENT, since only SUBMITTED and DISPUTED claims are in-flight"

      - name: claim_allocate_moves_draft_to_allocated_and_writes_the_allocation
        claim_type: Valid Transition
        grounds:
          - state_machines[CreditClaim].transitions[DRAFT->SUBMITTED]
          - state_machines[CreditClaim].transitions[SUBMITTED->ALLOCATED]
          - calculations.origination_sharing_convention
          - entities.Matter.fields.origination_pct_assigned
        distinguishing_aspect: |
          The happy path DRAFT -> SUBMITTED -> ALLOCATED on a genuinely new client applies
          SHARE_NEW_CLIENT_PCT 100.00: the claimant keeps the whole approved 80.00,
          counterparty_pct is 0.00, resolved_prior_originator_id stays null and
          Matter.origination_pct_assigned becomes exactly 80.00.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 in OPEN_INTAKE with claim_deadline_on 2026-09-30."
            - "Partner P is billing and responsible attorney of OPEN Matter M for the previously unseen client CLI-NW; ARB is the credit arbiter."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Pat Path", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2014 }
              as: CycleAdmin
              captures: { pp: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Abe Arbiter", practice_group: "REGULATORY", compensation_model: "FORMULA", admission_year: 2004, is_credit_arbiter: true, evaluation_required: false }
              as: CycleAdmin
              captures: { arb: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-NW", client_display_name: "Brand New Client LLC", matter_type: "NEW", practice_group: "CORPORATE", opened_on: "2026-02-01", billing_attorney_id: "${pp}", responsible_attorney_id: "${pp}" }
              as: CycleAdmin
              captures: { m: "$.data.id", mv: "$.data.version" }
            - call: "POST /comp/credit-claims"
              payload: { cycle_id: "${cy}", matter_id: "${m}", claim_basis: "NEW_CLIENT", requested_pct: 80.00, narrative: "First engagement with this client, sourced by me." }
              as: Partner
              as_user_id: "${pp}"
              captures: { cl: "$.data.id" }
          trigger:
            - call: "POST /comp/credit-claims/${cl}/submit"
              payload: {}
              as: Partner
              as_user_id: "${pp}"
              captures: { st: "$.data.state" }
            - call: "POST /comp/credit-claims/${cl}/adjudicate"
              payload: { decision: "ALLOCATE", approved_pct: 80.00, expected_matter_version: "${mv}" }
              as: CreditArbiter
              as_user_id: "${arb}"
              captures: { st2: "$.data.state", app: "$.data.approved_pct", cp: "$.data.counterparty_pct" }
          assert:
            - "${st} == SUBMITTED with HTTP 200"
            - "${st2} == ALLOCATED with HTTP 200"
            - "${app} == 80.00 and ${cp} == 0.00"
            - "CreditClaim.${cl}.resolved_prior_originator_id is null, because CLI-NW has no sibling matter"
            - "GET /comp/matters/${m}/credit-allocations with credit_role ORIGINATING returns exactly 1 ACTIVE row for ${pp} at credit_pct 80.00 with source CLAIM_ALLOCATED"
            - "Matter.${m}.origination_pct_assigned == 80.00 and Matter.${m}.version > ${mv}"

      - name: matter_creation_seeds_the_billing_and_responsible_allocations
        claim_type: Side Effect Execution
        grounds:
          - endpoints[POST /comp/matters]
          - entities.CreditAllocation.fields.source
          - entities.Partner.fields.responsible_matter_count
        distinguishing_aspect: |
          One POST /comp/matters produces three writes, not one: a BILLING allocation at
          100.00 with source DEFAULT_BILLING, a RESPONSIBLE allocation at 100.00 with
          source DEFAULT_RESPONSIBLE, and an increment of the responsible attorney's
          responsible_matter_count - while the billing attorney's count is untouched when
          the two attorneys differ.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; partners B (billing) and R (responsible) exist and are distinct."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/partners"
              payload: { full_name: "Bill Ing", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2013 }
              as: CycleAdmin
              captures: { pb: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Resp Onsible", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2015 }
              as: CycleAdmin
              captures: { pr: "$.data.id" }
          trigger:
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-SE", client_display_name: "Side Effect Holdings", matter_type: "EXISTING", practice_group: "CORPORATE", opened_on: "2026-03-01", billing_attorney_id: "${pb}", responsible_attorney_id: "${pr}" }
              as: CycleAdmin
              captures: { m: "$.data.id" }
            - call: "GET /comp/matters/${m}/credit-allocations"
              payload: { credit_role: "BILLING" }
              as: CycleAdmin
              captures: { ab: "$.data[0].partner_id", ab_pct: "$.data[0].credit_pct", ab_src: "$.data[0].source" }
            - call: "GET /comp/matters/${m}/credit-allocations"
              payload: { credit_role: "RESPONSIBLE" }
              as: CycleAdmin
              captures: { ar: "$.data[0].partner_id", ar_pct: "$.data[0].credit_pct", ar_src: "$.data[0].source" }
          assert:
            - "${ab} == ${pb}, ${ab_pct} == 100.00 and ${ab_src} == DEFAULT_BILLING"
            - "${ar} == ${pr}, ${ar_pct} == 100.00 and ${ar_src} == DEFAULT_RESPONSIBLE"
            - "Partner.${pr}.responsible_matter_count == 1"
            - "Partner.${pb}.responsible_matter_count == 0"
            - "GET /comp/matters/${m}/credit-allocations with credit_role ORIGINATING returns an empty list, so origination is claimed, never seeded"
            - "Matter.${m}.origination_pct_assigned == 0.00"

      - name: deliberation_entry_fans_out_ballots_and_awards_by_partner_config
        claim_type: Side Effect Execution
        grounds:
          - state_machines[CompensationCycle].transitions[PEER_REVIEW->DELIBERATION]
          - entities.CommitteeBallot.fields.state
          - entities.CompensationAward.fields.award_state
          - entities.CompensationAward.fields.basis_model
        distinguishing_aspect: |
          The PEER_REVIEW -> DELIBERATION cascade fans out along two different predicates at
          once: ballots are created only for DISCRETIONARY evaluation-required subjects
          crossed with ACTIVE committee members (the self pair included), while awards are
          created for every evaluation-required partner regardless of model - so the
          FORMULA partner gets an award and no ballot, and the committee members get
          neither.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026."
            - "Four partners: S DISCRETIONARY evaluation_required, F FORMULA evaluation_required, and committee members C1 and C2 with evaluation_required false."
            - "S and F have each submitted an assessment carrying two SCORED peer reviews from C1 and C2, and the cycle has been advanced to PEER_REVIEW."
