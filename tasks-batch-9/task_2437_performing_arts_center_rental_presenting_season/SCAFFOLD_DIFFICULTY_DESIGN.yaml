scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    rule_name: "Dual-variant calculation — the same named calculation yields different results depending on which variant the caller is in"
    instances:

      - name: labor_call_estimate_vs_actual_meal_penalty_divergence
        differentiation: |
          Divergence inside a SINGLE entity for IDENTICAL hour input: the call is scheduled for
          exactly 10.5 hours and worked for exactly 10.5 hours, so every tiering term is equal and
          the only surviving difference is the ACTUAL-only meal penalty term. The delta is therefore
          exactly meal_penalty_cents * crew_size and nothing else. The sibling instance below
          diverges for the opposite reason (identical formula, different input SET).
        mechanism: "calculations.labor_cost variants ESTIMATE (scheduled_hours, penalty suppressed) vs ACTUAL (actual_hours, penalty active)"
        entities_involved: [UnionDepartment, LaborCall, Engagement]
        test_recipe:
          setup: |
            One hall, one credit-A rental client with no arrears, and one RENTAL engagement driven to
            CONFIRMED (hours may only be reported on a CONFIRMED or PERFORMED engagement). The
            STAGEHANDS rate card is 5000 cents/hour straight time with the default 1.5/2.0
            multipliers, a 4-hour call minimum and a 3500-cent meal penalty. One labor call is
            created for a 10-hour window (08:00Z to 18:00Z on the load-in day) with a crew of 6.
            ESTIMATE math: billable 10h -> straight 8h, overtime 2h, doubletime 0h.
            per crew = round(8*5000)=40000 + round(2*5000*1.5)=15000 = 55000; no penalty on ESTIMATE.
            estimated_cost_cents = 55000 * 6 = 330000.
            Supporting arithmetic to reach CONFIRMED: facility fee 500000*1 + 200000*1 = 700000 with
            no discount and no capacity surcharge (1200 seats); deposit at creation
            max(50000, ceil100(round(0.25*700000))) = 175000, recomputed to
            ceil100(round(0.25*(700000+330000))) = 257500 once the call exists, and paid in full.
            Risk (RENTAL variant): credit A -> 0, arrears 0/257500 = 0, lead 62 days ->
            100*(0.20*(1-62/120)) = 9.67 -> 10 -> LOW -> CLEARED.
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload:
                name: "Grand Hall"
                seat_capacity: 1200
                base_facility_fee_cents: 500000
                load_in_day_fee_cents: 200000
                changeover_buffer_minutes: 120
                rigging_capacity_kg: 5000
                house_power_amps: 400
                dmx_universes: 4
                status: "ACTIVE"
              captures: { space_id: "$.data.id" }
            - call: "POST /rental-clients"
              as: RentalManager
              payload:
                org_name: "Meridian Dance Company"
                contact_email: "tour@meridiandance.example"
                credit_rating: "A"
                is_nonprofit: false
                outstanding_balance_cents: 0
              captures: { client_id: "$.data.id" }
            - call: "POST /union-departments"
              as: CenterAdmin
              payload:
                department: "STAGEHANDS"
                roster_size: 20
                straight_hourly_rate_cents: 5000
                overtime_multiplier: 1.5
                doubletime_multiplier: 2.0
                call_minimum_hours: 4
                meal_penalty_cents: 3500
              captures: { dept_id: "$.data.id" }
            - call: "POST /engagements"
              as: RentalManager
              payload:
                engagement_type: "RENTAL"
                space_id: "${space_id}"
                rental_client_id: "${client_id}"
                title: "Meridian Dance: Northbound"
                load_in_start_utc: "2026-10-01T08:00:00Z"
                performance_start_utc: "2026-10-02T19:00:00Z"
                performance_end_utc: "2026-10-02T22:00:00Z"
                load_out_end_utc: "2026-10-03T02:00:00Z"
                performance_day_count: 1
                load_in_day_count: 1
              captures: { engagement_id: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/labor-calls"
              as: TechnicalDirector
              payload:
                union_department_id: "${dept_id}"
                crew_size: 6
                call_start_utc: "2026-10-01T08:00:00Z"
                call_end_utc: "2026-10-01T18:00:00Z"
              captures: { call_id: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/tech-riders"
              as: RentalClientContact
              as_user_id: "${client_id}"
              payload:
                submitted_rigging_kg: 3000
                requested_power_amps: 300
                requested_dmx_universes: 2
                requires_orchestra_pit: false
              captures: { rider_id: "$.data.id" }
            - call: "POST /tech-riders/${rider_id}/review"
              as: TechnicalDirector
              payload: {}
            - call: "POST /tech-riders/${rider_id}/clear"
              as: TechnicalDirector
              payload: {}
            - call: "POST /engagements/${engagement_id}/record-deposit"
              as: RentalManager
              payload:
                amount_cents: 257500
            - call: "GET /engagements/${engagement_id}"
              as: FinanceController
              payload: {}
              captures: { eng_v_pre_risk: "$.data.version" }
            - call: "POST /engagements/${engagement_id}/assess-risk"
              as: FinanceController
              payload:
                expected_engagement_version: "${eng_v_pre_risk}"
            - call: "POST /engagements/${engagement_id}/confirm"
              as: RentalManager
              payload: {}
          trigger:
            - call: "POST /labor-calls/${call_id}/report-hours"
              as: TechnicalDirector
              payload:
                actual_hours: 10
                meal_break_taken: false
          assert:
            - "200; the labor call status is WORKED."
            - "actual_cost_cents == 351000 — per crew 55000 + 3500 meal penalty = 58500, times crew_size 6."
            - "estimated_cost_cents is still exactly 330000: reporting hours never rewrites the ESTIMATE variant's output."
            - "The ACTUAL-minus-ESTIMATE delta is exactly 21000 == 3500 * 6, proving the penalty is charged per crew member and is suppressed on the ESTIMATE variant even though scheduled_hours (10) also exceeds MEAL_BREAK_LIMIT_HOURS (5)."
            - "GET /engagements/${engagement_id} shows labor_estimate_total_cents == 330000 (the aggregate tracks the ESTIMATE variant, not the ACTUAL one) — the ACTUAL figure never enters the estimate aggregate."
            - "GET /engagements/${engagement_id} shows deposit_required_cents == 257500 and deposit_paid_cents == 257500: the deposit tracks the ESTIMATE variant only, so a 351000-cent actual cost does not disturb it."
            - "GET /union-departments/${dept_id}/labor-calls returns total_count == 1."
            - "Reporting hours a second time returns 409 ERR_LABOR_CALL_INVALID_STATE, so the ACTUAL variant is written exactly once."

      - name: engagement_margin_projected_vs_realized_input_set_divergence
        differentiation: |
          Divergence driven by INPUT SET and cost basis rather than by a penalty term: PROJECTED
          reads only ACTIVE PriceTier allocations multiplied by the artist's historical sell-through
          and charges a flat marketing allowance, while REALIZED reads only SOLD TicketSale rows in
          created_at order and charges reconciled actual expenses. The two are computed at different
          points of the same engagement's life and both survive on the row afterwards, so the delta
          is observable simultaneously. The sibling instance above holds the input set constant.
        mechanism: "calculations.engagement_margin variants PROJECTED (on-sale) vs REALIZED (settlement finalize)"
        entities_involved: [Engagement, Artist, PriceTier, TicketSale, LaborCall, Settlement, ReserveLedgerEntry]
        test_recipe:
          setup: |
            Full presented-engagement life: hall (1200 seats), artist with historical_sell_through_pct
            0.80, PRESENTED engagement, a CAPABLE tech rider cleared, one ORCH tier of 500 seats at
            8000 cents with dynamic pricing disabled and a 12000-cent ceiling, an accepted fee
            negotiation at 1500000 with a 0.10 artist share, a risk assessment that lands LOW/CLEARED,
            confirmation, on-sale, a 300-seat single-ticket sale, one 6-hour crew-of-4 call worked
            with a meal break, the clock advanced past curtain-down, a settlement drafted and
            reconciled at 180000 cents of marketing.
            PROJECTED at on-sale: gross = round(8000 * 500 * 0.80) = 3200000;
            costs = 1500000 guarantee + 0 labor estimate + 0 equipment + 250000 flat marketing;
            margin = 3200000 - 1750000 = 1450000.
            REALIZED at finalize: gross = 300 * 8000 = 2400000 (plus 0 subscription revenue);
            costs = 1500000 guarantee + 66000 artist share + 120000 actual labor + 0 equipment
            + 180000 actual marketing = 1866000; margin = 534000.
            Risk score check: fee_exposure 1500000/3200000 = 0.46875, routing slack 31d (>= 14 target
            so the term is 0), lead 62d, sell-through term 0.20 ->
            100*(0.45*0.46875 + 0 + 0.20*(1-62/120) + 0.10*0.20) = 32.76 -> 33 -> LOW -> CLEARED.
            Settlement math: box office 2400000, restoration fees 200*300 = 60000, adjusted gross
            2340000 -> band 2 cap 600000; eligible expenses 180000 -> reimbursable 180000;
            overage = 2340000 - 1500000 - 180000 = 660000 -> artist share round(0.10*660000) = 66000;
            net to center = 2340000 - 1500000 - 180000 - 66000 - 120000 = 474000;
            reserve = round(0.05*474000) + 60000 = 83700; payable to artist = 1566000.
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload:
                name: "Grand Hall"
                seat_capacity: 1200
                base_facility_fee_cents: 500000
                load_in_day_fee_cents: 200000
                changeover_buffer_minutes: 120
                rigging_capacity_kg: 5000
                house_power_amps: 400
                dmx_universes: 4
                status: "ACTIVE"
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload:
                legal_name: "Aurora Chamber Players"
                agency_name: "Northline Artists"
                guarantee_floor_cents: 1000000
                historical_sell_through_pct: 0.80
                routing_window_start_utc: "2026-09-01T00:00:00Z"
                routing_window_end_utc: "2026-12-31T00:00:00Z"
                min_days_between_engagements: 2
              captures: { artist_id: "$.data.id" }
            - call: "POST /union-departments"
              as: CenterAdmin
              payload:
                department: "STAGEHANDS"
                roster_size: 20
                straight_hourly_rate_cents: 5000
              captures: { dept_id: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload:
                engagement_type: "PRESENTED"
                space_id: "${space_id}"
                artist_id: "${artist_id}"
                title: "Aurora Chamber Players in Recital"
                load_in_start_utc: "2026-10-01T08:00:00Z"
                performance_start_utc: "2026-10-02T19:00:00Z"
                performance_end_utc: "2026-10-02T22:00:00Z"
                load_out_end_utc: "2026-10-03T02:00:00Z"
                performance_day_count: 1
                load_in_day_count: 1
              captures: { engagement_id: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/tech-riders"
              as: ArtistRepresentative
              as_user_id: "${artist_id}"
              payload:
                submitted_rigging_kg: 3000
                requested_power_amps: 300
                requested_dmx_universes: 2
                requires_orchestra_pit: false
              captures: { rider_id: "$.data.id" }
            - call: "POST /tech-riders/${rider_id}/review"
              as: TechnicalDirector
              payload: {}
            - call: "POST /tech-riders/${rider_id}/clear"
              as: TechnicalDirector
              payload: {}
            - call: "POST /engagements/${engagement_id}/price-tiers"
              as: BoxOfficeManager
              payload:
                tier_name: "ORCH"
                seats_allocated: 500
                base_price_cents: 8000
                price_ceiling_cents: 12000
                dynamic_pricing_enabled: false
                subscription_eligible: true
              captures: { tier_id: "$.data.id" }
            - call: "GET /engagements/${engagement_id}"
              as: FinanceController
              payload: {}
              captures: { eng_v_pre_neg: "$.data.version" }
            - call: "POST /engagements/${engagement_id}/fee-negotiations"
              as: ProgrammingDirector
              payload:
                offered_fee_cents: 1500000
                offered_artist_share_pct: 0.10
                expected_engagement_version: "${eng_v_pre_neg}"
              captures: { neg_id: "$.data.id" }
            - call: "POST /fee-negotiations/${neg_id}/accept"
              as: ArtistRepresentative
              as_user_id: "${artist_id}"
              payload: {}
            - call: "GET /engagements/${engagement_id}"
              as: FinanceController
              payload: {}
              captures: { eng_v_pre_risk: "$.data.version" }
            - call: "POST /engagements/${engagement_id}/assess-risk"
              as: FinanceController
              payload:
                expected_engagement_version: "${eng_v_pre_risk}"
            - call: "POST /engagements/${engagement_id}/confirm"
              as: ProgrammingDirector
              payload: {}
            - call: "POST /engagements/${engagement_id}/on-sale"
              as: BoxOfficeManager
              payload: {}
            - call: "POST /price-tiers/${tier_id}/ticket-sales"
              as: BoxOfficeManager
              payload:
                qty: 300
                channel: "WEB"
              captures: { sale_id: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/labor-calls"
              as: TechnicalDirector
              payload:
                union_department_id: "${dept_id}"
                crew_size: 4
                call_start_utc: "2026-10-01T08:00:00Z"
                call_end_utc: "2026-10-01T14:00:00Z"
              captures: { call_id: "$.data.id" }
            - call: "POST /labor-calls/${call_id}/report-hours"
              as: TechnicalDirector
              payload:
                actual_hours: 6
                meal_break_taken: true
            - call: "POST /_clock/set_current_utc"
              as: CenterAdmin
              payload:
                to_iso8601: "2026-10-03T00:00:00Z"
            - call: "POST /engagements/${engagement_id}/settlements"
              as: FinanceController
              payload: {}
              captures: { settlement_id: "$.data.id" }
            - call: "POST /settlements/${settlement_id}/reconcile-expenses"
              as: FinanceController
              payload:
                actual_marketing_cents: 180000
          trigger:
            - call: "POST /settlements/${settlement_id}/finalize"
              as: FinanceController
              as_user_id: "user-finance-1"
              payload: {}
          assert:
            - "200; settlement status FINALIZED and finalized_by_user_id == \"user-finance-1\"."
            - "GET /engagements/${engagement_id}: projected_gross_cents == 3200000 and projected_margin_cents == 1450000 — the PROJECTED variant computed at on-sale is preserved verbatim and is NOT overwritten by the realized figures."
            - "GET /engagements/${engagement_id}: realized_gross_cents == 2400000 and realized_margin_cents == 534000."
            - "The variant delta is exactly 1450000 - 534000 == 916000, attributable to (a) 0.80 historical sell-through on 500 seats (3200000) versus 300 seats actually sold (2400000), (b) the 66000 artist overage share that only the REALIZED basis carries, (c) 120000 actual labor that PROJECTED never saw because the call was created after on-sale, and (d) 250000 flat marketing versus 180000 reconciled marketing."
            - "GET /engagements/${engagement_id}: lifecycle_status SETTLED, ticketing_status CLOSED."
            - "GET /price-tiers/${tier_id}: status CLOSED, sold_qty 300, gross_cents 2400000."
            - "GET /engagements/${engagement_id}/labor-calls: the single call is RECONCILED."
            - "GET /artists/${artist_id}: lifetime_guarantee_paid_cents == 1566000 (guarantee 1500000 + share 66000)."
            - "GET /engagements/${engagement_id}/reserve-ledger-entries: exactly one SETTLEMENT_CONTRIBUTION entry with amount_cents == 83700 and balance_after_cents == 83700."

  # ===========================================================================
  - rule_id: combinatorial_formula
    rule_name: "Combinatorial formula — the answer depends on the ORDER in which rounding, aggregation and capping steps are combined"
    instances:

      - name: labor_cost_round_per_component_then_multiply_by_crew
        differentiation: |
          Order sensitivity in the MULTIPLICATIVE dimension: rounding is pinned per rate component
          per crew member and only afterwards multiplied by crew_size, so a rate that produces a
          half-cent overtime component drifts by exactly 1 cent per crew member against the naive
          "aggregate everything, round once" order. The sibling instance below is order sensitivity
          in the SEQUENTIAL dimension (each step consumes the previous step's capped output).
        mechanism: "calculations.labor_cost pinned precision clause: round_half_up per rate component per crew member, THEN multiply by crew_size; the meal penalty is likewise per crew member"
        entities_involved: [PerformanceSpace, RentalClient, UnionDepartment, Engagement, TechRider, LaborCall]
        test_recipe:
          setup: |
            An ELECTRICS rate card at the deliberately odd rate of 4445 cents/hour with the default
            1.5 overtime multiplier, and one labor call of exactly 10.5 hours (08:00Z to 18:30Z) with
            a crew of 3. The engagement is RENTAL and is driven all the way to CONFIRMED before the
            call is created, so the follow-up ACTUAL assertion below is legal (hours may only be
            reported on a CONFIRMED or PERFORMED engagement) while the labor call itself is still
            created fresh by the trigger.
            Pinned order: straight 8h -> round(8*4445) = 35560; overtime 2.5h ->
            round(2.5*4445*1.5) = round(16668.75) = 16669; per crew = 52229;
            estimated_cost_cents = 52229 * 3 = 156687.
            Forbidden order (sum unrounded, multiply, round once):
            (35560 + 16668.75) * 3 = 156686.25 -> 156686. The two orders differ by exactly 1 cent,
            so 156686 is a wrong-order signature.
            ACTUAL variant with no meal break at 10.5 hours: per crew = 52229 + 3500 = 55729,
            times 3 = 167187. Forbidden order (penalty added once, not per crew member) would give
            156687 + 3500 = 160187.
            Supporting arithmetic: facility fee 500000 + 200000 = 700000, deposit at creation
            max(50000, ceil100(round(0.25*700000))) = 175000 (credit A, no arrears), paid in full;
            risk 100*(0.20*(1-62/120)) = 9.67 -> 10 -> LOW -> CLEARED; rider is CAPABLE so no
            equipment cost enters the deposit.
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload:
                name: "Grand Hall"
                seat_capacity: 1200
                base_facility_fee_cents: 500000
                load_in_day_fee_cents: 200000
                changeover_buffer_minutes: 120
                rigging_capacity_kg: 5000
                house_power_amps: 400
                dmx_universes: 4
              captures: { space_id: "$.data.id" }
            - call: "POST /rental-clients"
              as: RentalManager
              payload:
                org_name: "Copper Street Brass"
                contact_email: "ops@copperstreet.example"
                credit_rating: "A"
                is_nonprofit: false
                outstanding_balance_cents: 0
              captures: { client_id: "$.data.id" }
            - call: "POST /union-departments"
              as: CenterAdmin
              payload:
                department: "ELECTRICS"
                roster_size: 12
                straight_hourly_rate_cents: 4445
                overtime_multiplier: 1.5
                doubletime_multiplier: 2.0
                call_minimum_hours: 4
                meal_penalty_cents: 3500
              captures: { dept_id: "$.data.id" }
            - call: "POST /engagements"
              as: RentalManager
              payload:
                engagement_type: "RENTAL"
                space_id: "${space_id}"
                rental_client_id: "${client_id}"
                title: "Copper Street Brass"
                load_in_start_utc: "2026-10-01T08:00:00Z"
                performance_start_utc: "2026-10-02T19:00:00Z"
                performance_end_utc: "2026-10-02T22:00:00Z"
                load_out_end_utc: "2026-10-03T02:00:00Z"
                performance_day_count: 1
                load_in_day_count: 1
              captures: { engagement_id: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/tech-riders"
              as: RentalClientContact
              as_user_id: "${client_id}"
              payload:
                submitted_rigging_kg: 2000
                requested_power_amps: 200
                requested_dmx_universes: 2
                requires_orchestra_pit: false
              captures: { rider_id: "$.data.id" }
            - call: "POST /tech-riders/${rider_id}/review"
              as: TechnicalDirector
              payload: {}
            - call: "POST /tech-riders/${rider_id}/clear"
              as: TechnicalDirector
              payload: {}
            - call: "POST /engagements/${engagement_id}/record-deposit"
              as: RentalManager
              payload:
                amount_cents: 175000
            - call: "GET /engagements/${engagement_id}"
              as: FinanceController
              payload: {}
              captures: { eng_v_pre_risk: "$.data.version" }
            - call: "POST /engagements/${engagement_id}/assess-risk"
              as: FinanceController
              payload:
                expected_engagement_version: "${eng_v_pre_risk}"
            - call: "POST /engagements/${engagement_id}/confirm"
              as: RentalManager
              payload: {}
          trigger:
            - call: "POST /engagements/${engagement_id}/labor-calls"
              as: TechnicalDirector
              payload:
                union_department_id: "${dept_id}"
                crew_size: 3
                call_start_utc: "2026-10-01T08:00:00Z"
                call_end_utc: "2026-10-01T18:30:00Z"
              captures: { call_id: "$.data.id" }
          assert:
            - "201; scheduled_hours == 10.5 and status ESTIMATED."
            - "estimated_cost_cents == 156687 exactly. 156686 means the implementation summed the unrounded components (or multiplied before rounding); 156690 or 156684 means it rounded the hour tiers instead of the cent amounts."
            - "GET /engagements/${engagement_id}: labor_estimate_total_cents == 156687, i.e. the aggregate is a sum of already-rounded per-call integers and introduces no second rounding step."
            - "GET /engagements/${engagement_id}: deposit_required_cents == 214200 — the recompute reruns the whole deposit formula on the new core 700000 + 156687 = 856687, giving round(0.25*856687) = 214172 then ceil to 214200; deposit_paid_cents remains 175000 because the shortfall check only guards confirmation, which already happened."
            - "Reporting 10.5 actual hours with meal_break_taken false on this call afterwards yields actual_cost_cents == 167187 == (52229 + 3500) * 3, confirming the penalty is inside the per-crew-member parenthesis; 160187 would prove it was added once after the crew multiplication."

      - name: settlement_presented_split_pinned_evaluation_order
        differentiation: |
          Order sensitivity in the SEQUENTIAL dimension: five dependent steps where each consumes the
          previous step's output (adjusted gross selects the expense-cap band, the cap truncates the
          reimbursable amount, the truncated amount reduces the overage that drives the artist share,
          the share reduces the centre's net, and the net selects the reserve percentage) plus one
          explicitly forbidden back-edge (the reserve contribution must never be re-subtracted from
          net_to_center). The sibling instance above has no dependency chain at all — it is a single
          expression whose bracketing matters.
        mechanism: "calculations.settlement_financials PRESENTED_SPLIT numbered evaluation order plus the non-circularity clause on reserve_contribution_cents"
        entities_involved: [Engagement, Artist, PriceTier, TicketSale, TechRider, EquipmentItem, EquipmentRentalLine, LaborCall, Settlement]
        test_recipe:
          setup: |
            A presented engagement whose eligible expenses (900000 marketing + 100000 equipment =
            1000000) deliberately EXCEED the band-2 cap of 600000, so a wrong order that computes the
            overage from uncapped expenses is visibly different.
            Box office: 400 tickets at 10000 cents on a dynamic-disabled tier -> gross 4000000,
            restoration fees 200*400 = 80000, adjusted gross 3920000.
            Step 2: 3920000 is >= 2000000 and < 5000000 -> cap = 600000.
            Step 3: eligible 900000 + 100000 = 1000000 -> reimbursable = min(1000000, 600000) = 600000.
            Step 4: overage = max(0, 3920000 - 2000000 - 600000) = 1320000 ->
                    artist share = round(0.15 * 1320000) = 198000.
                    Wrong order (uncapped expenses): overage 920000 -> share 138000.
            Step 5: net to centre = 3920000 - 2000000 - 600000 - 198000 - 500000 = 622000.
                    Labor is a centre cost and is NOT reimbursable.
            Step 6: 622000 < 1000000 -> 0.05 -> reserve = round(0.05*622000) + 80000 = 111100.
                    The reserve contribution is NOT subtracted back out of net_to_center.
            Step 7: payable to artist = 2000000 + 198000 = 2198000, balance due from client = 0.
            Labor: crew of 20 for 5 hours at 5000 cents/hour with a meal break -> per crew 25000,
            actual 500000 (and estimate 500000).
            Equipment: the rider is GAP_IDENTIFIED for POWER_SHORTFALL (500 amps requested against a
            400-amp house), covered by 2 power-distro units for 2 days at 25000/day = 100000.
            Risk: fee exposure 2000000/round(10000*500*0.80)=2000000/4000000=0.5, routing slack 31d,
            lead 62d, sell-through 0.80 -> score 34 -> LOW -> CLEARED.
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload:
                name: "Grand Hall"
                seat_capacity: 1200
                base_facility_fee_cents: 500000
                load_in_day_fee_cents: 200000
                changeover_buffer_minutes: 120
                rigging_capacity_kg: 5000
                house_power_amps: 400
                dmx_universes: 4
