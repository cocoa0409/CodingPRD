    path: "/bottler/national-customer-agreements/{id}/publish"
    description: "Publish a DRAFT or SUSPENDED NCA; checks window overlap (price cascade fires at enroll-nca, not here)"
    roles: [BrandOwnerAdmin]
    code: 200
    input: []
    output: NationalCustomerAgreement
    side_effects: []
  - method: POST
    path: "/bottler/national-customer-agreements/{id}/suspend"
    description: "Suspend a PUBLISHED NCA (cycle: publish -> suspend -> publish)"
    roles: [BrandOwnerAdmin]
    code: 200
    input: []
    output: NationalCustomerAgreement
    side_effects: ["bound customers keep last bound_price_cents (no recompute)"]
  - method: POST
    path: "/bottler/national-customer-agreements/{id}/expire"
    description: "Expire an NCA once the logical clock is past effective_end"
    roles: [BrandOwnerAdmin]
    code: 200
    input: []
    output: NationalCustomerAgreement
    side_effects: ["bound customers revert bound_price_cents to local_price_cents"]

  # --- Customer ---
  - method: POST
    path: "/bottler/customers"
    description: "Register a customer under an agreement"
    roles: [BottlerOps]
    code: 201
    input: [agreement_id, name, channel, local_price_cents]
    output: Customer
    side_effects: ["bound_price_cents initialized to local_price_cents"]
  - method: GET
    path: "/bottler/customers/{id}"
    description: "Fetch one customer"
    roles: [PlatformAdmin, BrandOwnerAdmin, BottlerOps, CustomerManager]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: GET
    path: "/bottler/customers"
    description: "List customers, optionally by agreement, NCA, or status"
    roles: [PlatformAdmin, BrandOwnerAdmin, BottlerOps]
    code: 200
    input: ["agreement_id?", "nca_id?", "status?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []
  - method: POST
    path: "/bottler/customers/{id}/enroll-nca"
    description: "Bind a customer to a PUBLISHED NCA after the +/-5% price band check"
    roles: [BrandOwnerAdmin]
    code: 200
    input: [nca_id]
    output: Customer
    side_effects:
      - "sets nca_id; bound_price_cents := nca.national_price_cents (mutation 1)"
      - "that mutation triggers recompute of invoice_total_cents on every DsdOrder of this customer with fulfillment_status == BOOKED (mutation 2)"
      - "each such recompute triggers BottlerAgreement.margin_ledger_cents += (new invoice_total_cents - old invoice_total_cents) on the customer's agreement (mutation 3)"
  - method: POST
    path: "/bottler/customers/{id}/dispute"
    description: "Mark a customer DISPUTED"
    roles: [CustomerManager]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: POST
    path: "/bottler/customers/{id}/resolve-dispute"
    description: "Resolve a DISPUTED customer back to ACTIVE"
    roles: [CustomerManager]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- DsdOrder ---
  - method: POST
    path: "/bottler/dsd-orders"
    description: "Book a direct-store-delivery order; invoice computed with per-line rounding"
    roles: [CustomerManager, BottlerOps]
    code: 201
    input: [customer_id, lines]
    output: DsdOrder
    side_effects: ["computes invoice_total_cents per dsd_invoice_total"]
  - method: GET
    path: "/bottler/dsd-orders/{id}"
    description: "Fetch one DSD order"
    roles: [PlatformAdmin, BrandOwnerAdmin, BottlerOps, CustomerManager]
    code: 200
    input: []
    output: DsdOrder
    side_effects: []
  - method: GET
    path: "/bottler/dsd-orders"
    description: "List DSD orders, optionally by customer"
    roles: [PlatformAdmin, BrandOwnerAdmin, BottlerOps, CustomerManager]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: DsdOrder[]
    side_effects: []
  - method: POST
    path: "/bottler/dsd-orders/{id}/deliver"
    description: "Deliver a BOOKED order (customer must be ACTIVE)"
    roles: [BottlerOps]
    code: 200
    input: []
    output: DsdOrder
    side_effects: []
  - method: POST
    path: "/bottler/dsd-orders/{id}/pay"
    description: "Pay a DELIVERED order"
    roles: [CustomerManager]
    code: 200
    input: []
    output: DsdOrder
    side_effects: []
  - method: POST
    path: "/bottler/dsd-orders/{id}/void"
    description: "Void a BOOKED order"
    roles: [BottlerOps]
    code: 200
    input: []
    output: DsdOrder
    side_effects: []

  # --- ColdDrinkEquipment + ServiceWindow ---
  - method: POST
    path: "/bottler/cold-drink-equipment"
    description: "Register equipment in a bottler's pool"
    roles: [BottlerOps]
    code: 201
    input: [agreement_id, asset_tag]
    output: ColdDrinkEquipment
    side_effects: []
  - method: GET
    path: "/bottler/cold-drink-equipment/{id}"
    description: "Fetch one equipment unit"
    roles: [PlatformAdmin, BrandOwnerAdmin, BottlerOps, FieldTechnician]
    code: 200
    input: []
    output: ColdDrinkEquipment
    side_effects: []
  - method: GET
    path: "/bottler/cold-drink-equipment"
    description: "List equipment, optionally by agreement or current customer"
    roles: [PlatformAdmin, BrandOwnerAdmin, BottlerOps, FieldTechnician]
    code: 200
    input: ["agreement_id?", "customer_id?", "limit?", "offset?"]
    output: ColdDrinkEquipment[]
    side_effects: []
  - method: POST
    path: "/bottler/cold-drink-equipment/{id}/place"
    description: "Place equipment at a customer over a closed date interval"
    roles: [BottlerOps]
    code: 200
    input: [customer_id, placed_from, placed_until]
    output: ColdDrinkEquipment
    side_effects: []
  - method: POST
    path: "/bottler/cold-drink-equipment/{id}/uninstall"
    description: "Return PLACED equipment to the warehouse"
    roles: [BottlerOps]
    code: 200
    input: []
    output: ColdDrinkEquipment
    side_effects: ["clears placement fields"]
  - method: POST
    path: "/bottler/cold-drink-equipment/{id}/service-windows"
    description: "Book a half-open technician service window against the agreement's service budget"
    roles: [FieldTechnician]
    code: 201
    input: [technician_label, window_start, window_end, cost_cents]
    output: ServiceWindow
    side_effects: ["agreement.service_spent_cents += cost_cents", "equipment status PLACED -> UNDER_SERVICE"]
  - method: GET
    path: "/bottler/cold-drink-equipment/{id}/service-windows"
    description: "List service windows of an equipment unit (reverse-reachability)"
    roles: [PlatformAdmin, BrandOwnerAdmin, BottlerOps, FieldTechnician]
    code: 200
    input: ["limit?", "offset?"]
    output: ServiceWindow[]
    side_effects: []

  # --- FountainAccount + SyrupDelivery ---
  - method: POST
    path: "/bottler/fountain-accounts"
    description: "Open a fountain supply account for a FOUNTAIN-channel customer"
    roles: [BottlerOps]
    code: 201
    input: [customer_id]
    output: FountainAccount
    side_effects: []
  - method: GET
    path: "/bottler/fountain-accounts/{id}"
    description: "Fetch one fountain account"
    roles: [PlatformAdmin, BrandOwnerAdmin, BottlerOps]
    code: 200
    input: []
    output: FountainAccount
    side_effects: []
  - method: GET
    path: "/bottler/fountain-accounts"
    description: "List fountain accounts, optionally by customer"
    roles: [PlatformAdmin, BrandOwnerAdmin, BottlerOps]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: FountainAccount[]
    side_effects: []
  - method: POST
    path: "/bottler/fountain-accounts/{id}/syrup-deliveries"
    description: "Record a syrup delivery (gallons > 0); rejected when maintenance is overdue"
    roles: [BottlerOps]
    code: 201
    input: [gallons]
    output: SyrupDelivery
    side_effects: ["fountain_account.syrup_on_hand_gallons += gallons"]
  - method: GET
    path: "/bottler/fountain-accounts/{id}/syrup-deliveries"
    description: "List syrup deliveries of an account (reverse-reachability)"
    roles: [PlatformAdmin, BrandOwnerAdmin, BottlerOps]
    code: 200
    input: ["limit?", "offset?"]
    output: SyrupDelivery[]
    side_effects: []
  - method: POST
    path: "/bottler/fountain-accounts/{id}/maintenance"
    description: "Record fountain equipment maintenance; clears maintenance_overdue"
    roles: [FieldTechnician]
    code: 200
    input: []
    output: FountainAccount
    side_effects: ["maintenance_overdue := false"]

  # --- TerritoryTransfer ---
  - method: POST
    path: "/bottler/territory-transfers"
    description: "Propose a territory transfer / refranchising"
    roles: [PlatformAdmin]
    code: 201
    input: [territory_id, buyer_name, reported_ebitda_cents]
    output: TerritoryTransfer
    side_effects: []
  - method: GET
    path: "/bottler/territory-transfers/{id}"
    description: "Fetch one transfer"
    roles: [PlatformAdmin, BrandOwnerAdmin]
    code: 200
    input: []
    output: TerritoryTransfer
    side_effects: []
  - method: GET
    path: "/bottler/territory-transfers"
    description: "List transfers, optionally by territory"
    roles: [PlatformAdmin, BrandOwnerAdmin]
    code: 200
    input: ["territory_id?", "limit?", "offset?"]
    output: TerritoryTransfer[]
    side_effects: []
  - method: POST
    path: "/bottler/territory-transfers/{id}/valuate"
    description: "Value distribution rights (OCC on transfer version); also re-valuation after counter"
    roles: [BrandOwnerAdmin]
    code: 200
    input: [expected_transfer_version]
    output: TerritoryTransfer
    side_effects: ["computes valuation_cents per territory_transfer_valuation", "valuation_round += 1", "increments TerritoryTransfer.version by 1"]
  - method: POST
    path: "/bottler/territory-transfers/{id}/counter"
    description: "Counter a VALUED transfer (enters NEGOTIATING)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: TerritoryTransfer
    side_effects: []
  - method: POST
    path: "/bottler/territory-transfers/{id}/approve"
    description: "Approve a VALUED transfer; blocked while any customer is DISPUTED"
    roles: [BrandOwnerAdmin]
    code: 200
    input: []
    output: TerritoryTransfer
    side_effects: []
  - method: POST
    path: "/bottler/territory-transfers/{id}/execute"
    description: "Execute an APPROVED transfer; creates successor agreement and fires the refranchise cascade"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: TerritoryTransfer
    side_effects: ["creates successor BottlerAgreement (status ACTIVE)", "prior agreement -> REFRANCHISED", "customers and equipment reassigned to successor agreement"]
  - method: POST
    path: "/bottler/territory-transfers/{id}/reject"
    description: "Reject a non-terminal transfer"
    roles: [BrandOwnerAdmin]
    code: 200
    input: []
    output: TerritoryTransfer
    side_effects: []

  # --- InnovationLaunch ---
  - method: POST
    path: "/bottler/innovation-launches"
    description: "Plan a package/flavor innovation launch with a minimum volume commitment"
    roles: [BrandOwnerAdmin]
    code: 201
    input: [agreement_id, product_line_id, committed_cases, launch_start, launch_end]
    output: InnovationLaunch
    side_effects: []
  - method: GET
    path: "/bottler/innovation-launches/{id}"
    description: "Fetch one launch"
    roles: [PlatformAdmin, BrandOwnerAdmin, BottlerOps]
    code: 200
    input: []
    output: InnovationLaunch
    side_effects: []
  - method: GET
    path: "/bottler/innovation-launches"
    description: "List launches, optionally by agreement or product line"
    roles: [PlatformAdmin, BrandOwnerAdmin, BottlerOps]
    code: 200
    input: ["agreement_id?", "product_line_id?", "limit?", "offset?"]
    output: InnovationLaunch[]
    side_effects: []
  - method: POST
    path: "/bottler/innovation-launches/{id}/schedule-changeover"
    description: "Schedule the production line changeover"
    roles: [BottlerOps]
    code: 200
    input: []
    output: InnovationLaunch
    side_effects: []
  - method: POST
    path: "/bottler/innovation-launches/{id}/complete-changeover"
    description: "Complete the changeover; launch enters IN_PRODUCTION"
    roles: [BottlerOps]
    code: 200
    input: []
    output: InnovationLaunch
    side_effects: ["changeover_completed := true"]
  - method: POST
    path: "/bottler/innovation-launches/{id}/record-sales"
    description: "Accumulate sold cases against the commitment"
    roles: [BottlerOps]
    code: 200
    input: [cases]
    output: InnovationLaunch
    side_effects: ["cases_sold += cases"]
  - method: POST
    path: "/bottler/innovation-launches/{id}/review-commitment"
    description: "Review commitment after launch_end; forks to MET or PENALIZED"
    roles: [BrandOwnerAdmin]
    code: 200
    input: []
    output: InnovationLaunch
    side_effects: ["penalty_cents per innovation_min_volume_penalty on shortfall", "PENALIZED branch debits agreement.margin_ledger_cents by penalty_cents"]

  # --- MarketingFundEntry ---
  - method: POST
    path: "/bottler/marketing-fund-ledger"
    description: "Post an ACCRUAL / DISBURSEMENT / CLAWBACK entry to an agreement's marketing fund"
    roles: [BottlerOps, BrandOwnerAdmin]
    code: 201
    input: [agreement_id, entry_type, period, "cases_sold?", "net_revenue_cents?", "requested_amount_cents?", "reference_entry_id?"]
    output: MarketingFundEntry
    side_effects: ["agreement.marketing_fund_balance_cents updated per entry_type sign (+accrual, -disbursement, -clawback)"]
  - method: GET
    path: "/bottler/marketing-fund-ledger/{id}"
    description: "Fetch one fund entry"
    roles: [PlatformAdmin, BrandOwnerAdmin, BottlerOps]
    code: 200
    input: []
    output: MarketingFundEntry
    side_effects: []
  - method: GET
    path: "/bottler/marketing-fund-ledger"
    description: "List fund entries, optionally by agreement or by referenced accrual entry"
    roles: [PlatformAdmin, BrandOwnerAdmin, BottlerOps]
    code: 200
    input: ["agreement_id?", "reference_entry_id?", "limit?", "offset?"]
    output: MarketingFundEntry[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in endpoint's roles list" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "Path id or body FK id does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, bad enum, or constraint violation (priority 7)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined from the entity's current state" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Action attempted on an entity in a terminal state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Operation requires BottlerAgreement.status == ACTIVE" }
  - { id: ERR_AGREEMENT_ALREADY_ACTIVE, http: 409, condition: "activate on an agreement not in DRAFT" }
  - { id: ERR_TERRITORY_HAS_ACTIVE_AGREEMENT, http: 409, condition: "activate would create a second ACTIVE agreement in the same territory" }
  - { id: ERR_LINE_OBLIGATION_UNMET, http: 422, condition: "Mandatory product line obligations cannot be satisfied at activation (no price index for the brand)" }
  - { id: ERR_MIN_ORDER_QUANTITY, http: 422, condition: "quantity_gallons < 1000 on CPO creation" }
  - { id: ERR_ZERO_QUANTITY, http: 400, condition: "gallons <= 0 on syrup delivery, or cases <= 0 on record-sales" }
  - { id: ERR_INDEX_QUARTER_DUPLICATE, http: 409, condition: "Second ConcentratePriceIndex for the same (brand_owner_id, quarter)" }
  - { id: ERR_CPO_ALREADY_FINALIZED, http: 409, condition: "finalize/cancel attempted when pricing_status == FINALIZED" }
  - { id: ERR_PRICE_DEVIATION_EXCEEDS_BAND, http: 422, condition: "Local price deviates from NCA national price by strictly more than 5%" }
  - { id: ERR_NCA_NOT_PUBLISHED, http: 409, condition: "enroll-nca against an NCA not in PUBLISHED" }
  - { id: ERR_NCA_WINDOW_OVERLAP, http: 409, condition: "Publishing would create overlapping PUBLISHED NCA windows for one brand (closed intervals)" }
  - { id: ERR_SERVICE_WINDOW_OVERLAP, http: 409, condition: "Half-open service window overlaps another window with the same technician_label (adjacency allowed)" }
  - { id: ERR_EQUIPMENT_PLACEMENT_OVERLAP, http: 409, condition: "Closed placement interval overlaps (including touching dates) another placement of the same equipment" }
  - { id: ERR_EQUIPMENT_NOT_IN_WAREHOUSE, http: 409, condition: "place attempted on equipment not IN_WAREHOUSE" }
  - { id: ERR_SERVICE_BUDGET_EXCEEDED, http: 422, condition: "service_spent_cents + cost_cents would exceed agreement service_budget_cents" }
  - { id: ERR_CUSTOMER_DISPUTED, http: 409, condition: "Delivery attempted for a DISPUTED customer" }
  - { id: ERR_DSD_ORDER_NOT_DELIVERED, http: 409, condition: "pay attempted before fulfillment_status == DELIVERED" }
  - { id: ERR_TRANSFER_CUSTOMERS_DISPUTED, http: 409, condition: "approve attempted while any customer of the territory's agreement is DISPUTED" }
  - { id: ERR_COMMITMENT_WINDOW_OPEN, http: 409, condition: "review-commitment before the logical clock passes launch_end" }
  - { id: ERR_LAUNCH_PRODUCT_INACTIVE, http: 409, condition: "schedule-changeover against a RETIRED product line" }
  - { id: ERR_FUND_INSUFFICIENT_BALANCE, http: 422, condition: "DISBURSEMENT exceeds marketing_fund_balance_cents" }
  - { id: ERR_CLAWBACK_EXCEEDS_ACCRUAL, http: 422, condition: "CLAWBACK requested_amount_cents exceeds the referenced ACCRUAL amount" }
  - { id: ERR_FOUNTAIN_MAINTENANCE_OVERDUE, http: 409, condition: "Syrup delivery attempted while maintenance_overdue is true" }
  - { id: ERR_REFERENTIAL_INTEGRITY, http: 422, condition: "Cross-reference rule broken (channel mismatch, wrong-agreement reference, wrong-brand line)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Franchise system operator; owns territories, agreements, transfers lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /bottler/brand-owners"
      - "POST /bottler/territories"
      - "POST /bottler/territories/{id}/agreements"
      - "POST /bottler/bottler-agreements/{id}/activate"
      - "POST /bottler/territory-transfers"
      - "POST /bottler/territory-transfers/{id}/counter"
      - "POST /bottler/territory-transfers/{id}/execute"
      - "POST /bottler/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints across all resources"
  - name: BrandOwnerAdmin
    description: "Brand owner staff; owns product lines, price indices, NCAs, launches, fund oversight"
    identity: opaque
    exclusive_operations:
      - "POST /bottler/product-lines"
      - "POST /bottler/product-lines/{id}/retire"
      - "POST /bottler/concentrate-price-indices"
      - "POST /bottler/national-customer-agreements"
      - "POST /bottler/national-customer-agreements/{id}/publish"
      - "POST /bottler/national-customer-agreements/{id}/suspend"
      - "POST /bottler/national-customer-agreements/{id}/expire"
      - "POST /bottler/customers/{id}/enroll-nca"
      - "POST /bottler/bottler-agreements/{id}/suspend"
      - "POST /bottler/bottler-agreements/{id}/reinstate"
      - "POST /bottler/bottler-agreements/{id}/terminate"
      - "POST /bottler/territory-transfers/{id}/valuate"
      - "POST /bottler/territory-transfers/{id}/approve"
      - "POST /bottler/territory-transfers/{id}/reject"
      - "POST /bottler/innovation-launches"
      - "POST /bottler/innovation-launches/{id}/review-commitment"
    shared_operations:
      - "GET endpoints across all resources"
      - "POST /bottler/marketing-fund-ledger"
  - name: BottlerOps
    description: "Bottler operations user acting as a specific BottlerAgreement"
    identity: "entity_backed:BottlerAgreement"
    exclusive_operations:
      - "POST /bottler/concentrate-purchase-orders"
      - "POST /bottler/concentrate-purchase-orders/{id}/receive"
      - "POST /bottler/concentrate-purchase-orders/{id}/finalize"
      - "POST /bottler/concentrate-purchase-orders/{id}/cancel"
      - "POST /bottler/customers"
      - "POST /bottler/dsd-orders/{id}/deliver"
      - "POST /bottler/dsd-orders/{id}/void"
      - "POST /bottler/cold-drink-equipment"
      - "POST /bottler/cold-drink-equipment/{id}/place"
      - "POST /bottler/cold-drink-equipment/{id}/uninstall"
      - "POST /bottler/fountain-accounts"
      - "POST /bottler/fountain-accounts/{id}/syrup-deliveries"
      - "POST /bottler/innovation-launches/{id}/schedule-changeover"
      - "POST /bottler/innovation-launches/{id}/complete-changeover"
      - "POST /bottler/innovation-launches/{id}/record-sales"
    shared_operations:
      - "GET endpoints across all resources"
      - "POST /bottler/dsd-orders"
      - "POST /bottler/marketing-fund-ledger"
  - name: CustomerManager
    description: "Customer-side manager acting as a specific Customer"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /bottler/customers/{id}/dispute"
      - "POST /bottler/customers/{id}/resolve-dispute"
      - "POST /bottler/dsd-orders/{id}/pay"
    shared_operations:
      - "GET /bottler/customers/{id}"
      - "GET /bottler/dsd-orders and GET /bottler/dsd-orders/{id}"
      - "POST /bottler/dsd-orders"
  - name: FieldTechnician
    description: "Field service technician; books service windows and fountain maintenance"
    identity: opaque
    exclusive_operations:
      - "POST /bottler/cold-drink-equipment/{id}/service-windows"
      - "POST /bottler/fountain-accounts/{id}/maintenance"
    shared_operations:
      - "GET /bottler/cold-drink-equipment endpoints"
