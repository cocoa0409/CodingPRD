      - name: create_license_registration_with_unknown_originator_id_rejected
        claim_type: foreign_key_integrity
        grounds:
          - complexity_profile.entity_topology
          - errors[ERR_REFERENCED_RESOURCE_NOT_FOUND]
          - validations[priority=6]
        distinguishing_aspect: |
          Flat topology: LicenseRegistration.originator_id is a body foreign key, so an id that
          resolves to no Originator returns 404 ERR_REFERENCED_RESOURCE_NOT_FOUND (priority 6),
          distinct from the path-id 404 of priority 5.
        test_recipe:
