        grounds:
          - state_machines.ProgressDraw.PENDING_to_PAID
          - state_machines.ProgressDraw.PAID_to_REFUNDED
          - entities.Project.fields.amount_paid_cents
        distinguishing_aspect: |
          Conserved quantity = money: Project.amount_paid_cents == SUM(amount_cents WHERE status==PAID).
          Paying a 20000 PROGRESS draw then refunding it leaves amount_paid_cents at the pre-draw 15000
          (deposit only) and balance_due_cents at 155279 — zero drift.
        test_recipe:
          setup:
            - "Fresh DB. CONTRACTED CA project (contract 170279) with a PAID 15000 deposit"
            - "(amount_paid_cents == 15000)."
