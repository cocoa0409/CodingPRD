            - call: "POST /work-orders/${wo_id}/verify-closure"
              payload: { verification_result: "FAILED", verified_at: "2026-08-05T11:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { completed_at: "2026-08-06T12:00:00.000Z", resolution_note: "Sash re-shimmed and balance replaced" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
          trigger:
            - call: "POST /work-orders/${wo_id}/verify-closure"
              payload: { verification_result: "PASSED", verified_at: "2026-08-07T13:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
          assert:
            - "WorkOrder.${wo_id}.repair_status == REPAIRED"
            - "WorkOrder.${wo_id}.verification_status == VERIFIED"
            - "WorkOrder.${wo_id}.rejection_count == 1"
            - "WorkOrder.${wo_id}.completed_at == 2026-08-06T12:00:00.000Z"
            - "WorkOrder.${wo_id}.completed_by_user_id == tech-1"
            - "WorkOrder.${wo_id}.verified_at == 2026-08-07T13:00:00.000Z"
            - "WorkOrder.${wo_id}.verified_by_user_id == ${prop_id}"
            - "Deficiency.${def_id}.status == VERIFIED"
            - "Deficiency.${def_id}.corrected_at == 2026-08-06T12:00:00.000Z"
            - "Deficiency.${def_id}.verified_at == 2026-08-07T13:00:00.000Z"
            - "SelfAssessmentSweep.${sw_id}.verified_work_order_count == 1"
            - "SelfAssessmentSweep.${sw_id}.open_work_order_count == 0"
            - "SelfAssessmentSweep.${sw_id}.closure_verified_rate == 100.00"

      - name: appeal_returned_for_info_cycle_third_resubmit_rejected
        grounds:
          - state_machines.Appeal.RETURNED_FOR_INFO_to_SUBMITTED
          - state_machines.Appeal.SUBMITTED_to_RETURNED_FOR_INFO
          - entities.Appeal.fields.resubmission_count
          - validations[priority=67]
          - errors[ERR_APPEAL_RESUBMIT_LIMIT]
        distinguishing_aspect: |
          SUBMITTED -> RETURNED_FOR_INFO -> SUBMITTED is a bounded cycle, not a line: the appeal
          legitimately revisits SUBMITTED twice, resubmission_count climbs 0 -> 1 -> 2, and the
          THIRD resubmit is rejected with ERR_APPEAL_RESUBMIT_LIMIT (409) even though the appeal
          is sitting in exactly the same RETURNED_FOR_INFO state that admitted the first two.
          The inspection stays parked in APPEALED throughout because a non-terminal appeal exists.
        test_recipe:
          setup:
            - "ADOPTED NSPIRE-2026 standard; Property Cedar Walk with total_unit_count 1 and unit 101, so sample_size is 1."
            - "One SEV_WINDOW deficiency recorded and the inspection scored at 2026-09-11T09:00:00.000Z, freezing appeal_deadline_at at 2026-09-26T09:00:00.000Z."
            - "A TECHNICAL_ERROR appeal filed inside the window is RETURNED_FOR_INFO, resubmitted, RETURNED_FOR_INFO again, resubmitted again (resubmission_count 2) and RETURNED_FOR_INFO a third time."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "LT_GAS", name: "Gas leak at range connection", inspectable_area: "UNIT", severity: "LIFE_THREATENING", base_point_value: 10.00, correction_deadline_hours: 24 }
