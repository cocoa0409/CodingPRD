          assert:
            - "422 with error_id ERR_CLEARANCE_BLOCKED."
            - "GET /engagements/${engagement_id}: risk_score == 88, risk_tier PROHIBITIVE, financial_clearance BLOCKED — and lifecycle_status is still the perfectly ordinary DRAFT, demonstrating that the blocking dimension is independent of the lifecycle dimension."
            - "GET /engagements/${engagement_id}/fee-negotiations: the round is still OFFERED with accepted_fee_cents null, accepted_share_pct null and accepted_by_user_id null."
            - "GET /engagements/${engagement_id}: negotiated_fee_cents == 0, artist_share_pct == 0, fee_accepted_by_user_id is null — none of the accept side effects leaked through."
            - "The risk assessment used fee_basis 500000 taken from the highest-round OFFERED negotiation (there is no ACCEPTED one), so the parent's blocking state was itself derived from the child that the block now protects."
            - "A re-assessment cannot rescue this engagement: with the same inputs the score is still 88, so BLOCKED -> CLEARED is unreachable and this negotiation can never be accepted while the terms stand."

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    rule_name: "Resource-temporal overlap — a scarce resource may not be double-committed across overlapping time intervals"
    instances:

      - name: performance_space_occupancy_with_changeover_buffer_and_touching_boundary
        differentiation: |
          An EXCLUSIVE resource of capacity one, where the protected interval is EXTENDED by the
          hall's changeover buffer and the comparison is half-open, so an engagement that starts at
          the exact instant the buffer expires is legal while one starting a minute earlier is not.
          The sibling instance below is an AGGREGATE resource of capacity ten where overlap is summed
          rather than forbidden, and where the resource is pooled across different engagements.
        mechanism: "validations priority 60 ERR_SPACE_OCCUPANCY_CONFLICT over [load_in_start_utc, load_out_end_utc + changeover_buffer_minutes)"
        entities_involved: [PerformanceSpace, Engagement, RentalClient]
        test_recipe:
          setup: |
            One hall with changeover_buffer_minutes 120 and one rental client (RENTAL engagements are
            used so that no artist routing rule can be confused with the occupancy rule).
            Engagement E0 occupies 2026-09-28T08:00Z to 2026-09-30T02:00Z, so its protected interval
            runs to 2026-09-30T04:00Z.
            Engagement E1 starts load-in at exactly 2026-09-30T04:00Z — the first instant outside E0's
            buffer — and must be accepted, proving the interval is half-open. E1 runs to
            2026-10-03T02:00Z, protecting the hall to 2026-10-03T04:00Z.
            The trigger books load-in at 2026-10-03T03:00Z, one hour inside E1's changeover buffer.
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload:
                name: "Grand Hall"
                seat_capacity: 1200
                base_facility_fee_cents: 500000
                load_in_day_fee_cents: 200000
                changeover_buffer_minutes: 120
                rigging_capacity_kg: 5000
                house_power_amps: 400
                dmx_universes: 4
              captures: { space_id: "$.data.id" }
            - call: "POST /rental-clients"
              as: RentalManager
              payload:
                org_name: "Civic Opera Workshop"
                contact_email: "stage@civicopera.example"
                credit_rating: "A"
                is_nonprofit: true
                outstanding_balance_cents: 0
              captures: { client_id: "$.data.id" }
            - call: "POST /engagements"
              as: RentalManager
              payload:
                engagement_type: "RENTAL"
                space_id: "${space_id}"
                rental_client_id: "${client_id}"
                title: "Civic Opera Workshop: Recital Week"
                load_in_start_utc: "2026-09-28T08:00:00Z"
                performance_start_utc: "2026-09-29T19:00:00Z"
                performance_end_utc: "2026-09-30T00:00:00Z"
                load_out_end_utc: "2026-09-30T02:00:00Z"
                performance_day_count: 2
                load_in_day_count: 1
              captures: { eng_0: "$.data.id" }
            - call: "POST /engagements"
              as: RentalManager
              payload:
                engagement_type: "RENTAL"
                space_id: "${space_id}"
                rental_client_id: "${client_id}"
                title: "Civic Opera Workshop: Mainstage"
                load_in_start_utc: "2026-09-30T04:00:00Z"
                performance_start_utc: "2026-10-01T19:00:00Z"
                performance_end_utc: "2026-10-02T22:00:00Z"
                load_out_end_utc: "2026-10-03T02:00:00Z"
                performance_day_count: 2
                load_in_day_count: 1
              captures: { eng_1: "$.data.id" }
          trigger:
            - call: "POST /engagements"
              as: RentalManager
              payload:
                engagement_type: "RENTAL"
                space_id: "${space_id}"
                rental_client_id: "${client_id}"
                title: "Civic Opera Workshop: Late Add"
                load_in_start_utc: "2026-10-03T03:00:00Z"
                performance_start_utc: "2026-10-03T19:00:00Z"
                performance_end_utc: "2026-10-03T22:00:00Z"
                load_out_end_utc: "2026-10-04T02:00:00Z"
                performance_day_count: 1
                load_in_day_count: 1
              captures: { err: "$.data.error_id" }
          assert:
            - "409 with error_id ERR_SPACE_OCCUPANCY_CONFLICT. The requested load-in (2026-10-03T03:00:00Z) is after E1's load_out_end_utc (02:00Z) but inside its 120-minute changeover buffer, so the conflict is caused by the buffer alone."
            - "GET /engagements?space_id=${space_id} returns total_count == 2: the rejected engagement was not persisted."
            - "BOUNDARY (already exercised in setup): E1 was accepted with load_in_start_utc at exactly 2026-09-30T04:00:00Z == E0's load_out_end_utc plus 120 minutes. Touching endpoints do not overlap, so the buffer is inclusive of its start and exclusive of its end."
            - "A retry of the same trigger payload with load_in_start_utc moved to 2026-10-03T04:00:00Z succeeds with 201, which localises the failure to the buffer window and nothing else."
            - "The rejected attempt did not disturb the incumbents: GET /engagements/${eng_1} still shows lifecycle_status DRAFT with facility_fee_cents 1200000 and deposit_required_cents unchanged."
            - "Occupancy is enforced against DRAFT engagements too: E1 was never confirmed, yet it still blocks the hall."

      - name: union_crew_aggregate_capacity_across_overlapping_calls_on_two_engagements
        differentiation: |
          An AGGREGATE pooled resource: overlap is permitted until the SUM of crew_size across every
          overlapping ESTIMATED/WORKED call exceeds roster_size, the pool spans two different
          engagements in two different halls (so the constraint is not an engagement-local one), and
          the intervals are half-open so a call that starts exactly when another ends contributes
          nothing. The sibling instance above is a capacity-one exclusion with a buffer, where any
          overlap at all is fatal.
        mechanism: "validations priority 70 ERR_CREW_CAPACITY_EXCEEDED summing crew_size over overlapping [call_start_utc, call_end_utc) intervals of the same UnionDepartment"
        entities_involved: [UnionDepartment, LaborCall, Engagement, PerformanceSpace]
        test_recipe:
          setup: |
            One STAGEHANDS local with roster_size 10, two halls, and two RENTAL engagements running on
            the same dates in different halls so that the department pool is genuinely shared.
            Call A on engagement 1: crew 6, 2026-10-01T08:00Z to 12:00Z.
            Call B on engagement 2: crew 4, 2026-10-01T12:00Z to 16:00Z — it TOUCHES A but does not
            overlap it, so its own overlap sum is 4 and it is accepted even though 6 + 4 would
            saturate the roster.
            Call D on engagement 2: crew 4, 2026-10-01T11:00Z to 11:30Z — overlaps A only, so the sum
            is exactly 6 + 4 == 10 == roster_size and it is accepted at the inclusive boundary.
            The trigger asks for crew 5 on engagement 1 from 11:00Z to 13:00Z, which overlaps A, B and
            D at once for an aggregate of 6 + 4 + 4 + 5 = 19.
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload:
                name: "Grand Hall"
                seat_capacity: 1200
                base_facility_fee_cents: 500000
                load_in_day_fee_cents: 200000
                changeover_buffer_minutes: 120
                rigging_capacity_kg: 5000
                house_power_amps: 400
                dmx_universes: 4
              captures: { space_1: "$.data.id" }
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload:
                name: "Studio Theatre"
                seat_capacity: 400
                base_facility_fee_cents: 300000
                load_in_day_fee_cents: 120000
                changeover_buffer_minutes: 60
                rigging_capacity_kg: 2000
                house_power_amps: 200
                dmx_universes: 2
              captures: { space_2: "$.data.id" }
            - call: "POST /rental-clients"
              as: RentalManager
              payload:
                org_name: "Rivertown Arts Festival"
                contact_email: "prod@rivertown.example"
                credit_rating: "A"
                is_nonprofit: true
                outstanding_balance_cents: 0
              captures: { client_id: "$.data.id" }
            - call: "POST /union-departments"
              as: CenterAdmin
              payload:
                department: "STAGEHANDS"
                roster_size: 10
                straight_hourly_rate_cents: 5000
              captures: { dept_id: "$.data.id" }
            - call: "POST /engagements"
              as: RentalManager
              payload:
                engagement_type: "RENTAL"
                space_id: "${space_1}"
                rental_client_id: "${client_id}"
                title: "Rivertown Festival: Main Stage"
                load_in_start_utc: "2026-10-01T08:00:00Z"
                performance_start_utc: "2026-10-02T19:00:00Z"
                performance_end_utc: "2026-10-02T22:00:00Z"
                load_out_end_utc: "2026-10-03T02:00:00Z"
                performance_day_count: 1
                load_in_day_count: 1
              captures: { eng_1: "$.data.id" }
            - call: "POST /engagements"
              as: RentalManager
              payload:
                engagement_type: "RENTAL"
                space_id: "${space_2}"
                rental_client_id: "${client_id}"
                title: "Rivertown Festival: Studio Stage"
                load_in_start_utc: "2026-10-01T08:00:00Z"
                performance_start_utc: "2026-10-02T19:00:00Z"
                performance_end_utc: "2026-10-02T22:00:00Z"
                load_out_end_utc: "2026-10-03T02:00:00Z"
                performance_day_count: 1
                load_in_day_count: 1
              captures: { eng_2: "$.data.id" }
            - call: "POST /engagements/${eng_1}/labor-calls"
              as: TechnicalDirector
              payload:
                union_department_id: "${dept_id}"
                crew_size: 6
                call_start_utc: "2026-10-01T08:00:00Z"
                call_end_utc: "2026-10-01T12:00:00Z"
              captures: { call_a: "$.data.id" }
            - call: "POST /engagements/${eng_2}/labor-calls"
              as: TechnicalDirector
              payload:
                union_department_id: "${dept_id}"
                crew_size: 4
                call_start_utc: "2026-10-01T12:00:00Z"
                call_end_utc: "2026-10-01T16:00:00Z"
              captures: { call_b: "$.data.id" }
            - call: "POST /engagements/${eng_2}/labor-calls"
              as: TechnicalDirector
              payload:
                union_department_id: "${dept_id}"
                crew_size: 4
                call_start_utc: "2026-10-01T11:00:00Z"
                call_end_utc: "2026-10-01T11:30:00Z"
              captures: { call_d: "$.data.id" }
          trigger:
            - call: "POST /engagements/${eng_1}/labor-calls"
              as: TechnicalDirector
              payload:
                union_department_id: "${dept_id}"
                crew_size: 5
                call_start_utc: "2026-10-01T11:00:00Z"
                call_end_utc: "2026-10-01T13:00:00Z"
              captures: { err: "$.data.error_id" }
          assert:
            - "409 with error_id ERR_CREW_CAPACITY_EXCEEDED: the overlapping demand is 6 (call A on engagement 1) + 4 (call B on engagement 2) + 4 (call D on engagement 2) + 5 requested = 19 against roster_size 10."
            - "GET /union-departments/${dept_id}/labor-calls returns total_count == 3, and GET /engagements/${eng_1}/labor-calls returns total_count == 1 — the rejected call was not persisted on either side."
            - "HALF-OPEN EVIDENCE: call B was accepted at 12:00Z, the exact instant call A ends. Had touching intervals been treated as overlapping, 6 + 4 == 10 would still have passed, but the subsequent acceptance of call D (which overlaps A but not B) shows the sum for D's window was 6, not 10."
            - "INCLUSIVE-BOUNDARY EVIDENCE: call D was accepted with an overlapping total of exactly 6 + 4 == 10 == roster_size, so the rule rejects only strict exceedance."
            - "CROSS-ENGAGEMENT EVIDENCE: the trigger call belongs to engagement 1 while two of the three blocking calls belong to engagement 2, so the roster pool is department-scoped, not engagement-scoped."
            - "GET /engagements/${eng_1}: labor_estimate_total_cents reflects only call A (crew 6, 4 billable hours at the 4-hour call minimum -> per crew round(4*5000) = 20000 -> 120000)."
            - "GET /engagements/${eng_2}: labor_estimate_total_cents reflects calls B and D. Call D is scheduled for 0.5 hours but bills the 4-hour call minimum, so it costs the same 4-hour amount as call B: per crew 20000, crew 4 -> 80000 each, total 160000."

  # ===========================================================================
  - rule_id: compensating_invariant
    rule_name: "Compensating invariant — a quantity must be exactly conserved across a forward operation and its compensation"
    instances:

      - name: reserve_balance_conserved_across_subsidy_draws_and_cancellation_refunds
        differentiation: |
          Conservation of MONEY in an append-only ledger: two subsidy draws are compensated by two
          refunds and the running balance must return to the opening figure to the cent, with the
          refunds appended (never mutated in place) in a pinned order and with every intermediate
          balance_after_cents reproducible. The sibling instance below conserves a COUNT of physical
          seats and does so only partially by design — one component of the sum is deliberately NOT
          reversed, which the invariant must still absorb.
        mechanism: "calculations.education_subsidy_allowance draws plus CANCEL CASCADE STEPS 7-8 refunds; ReserveLedgerEntry.balance_after_cents accumulated over created_at ASC"
        entities_involved: [ReserveLedgerEntry, EducationProgram, Engagement, Artist]
        test_recipe:
          setup: |
            An opening reserve of 10000000 cents, and one PRESENTED engagement in DRAFT carrying two
            education programs.
            P1 STUDENT_MATINEE, capacity 200, requesting 1000000: allowance
            400000 + 1500*200 = 700000, so approved 700000 (request-capped by the allowance).
            Guard: 10000000 - 700000 = 9300000 >= the 5000000 floor. Balance after: 9300000.
            P2 MASTERCLASS, capacity 100, requesting 250000: allowance 150000 + 1500*100 = 300000, so
            approved 250000 (allowance-capped by the request, the other direction of the min).
            Guard: 9300000 - 250000 = 9050000 >= 5000000. Balance after: 9050000.
            Cancelling the engagement from DRAFT must refund both, in program created_at ASC order.
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload:
                name: "Grand Hall"
                seat_capacity: 1200
                base_facility_fee_cents: 500000
                load_in_day_fee_cents: 200000
                changeover_buffer_minutes: 120
                rigging_capacity_kg: 5000
                house_power_amps: 400
                dmx_universes: 4
              captures: { space_id: "$.data.id" }
            - call: "POST /reserve-ledger-entries"
              as: CenterAdmin
              payload:
                entry_type: "OPENING_BALANCE"
                amount_cents: 10000000
                memo: "FY27 capital and equipment reserve opening balance"
            - call: "POST /artists"
              as: ProgrammingDirector
              payload:
                legal_name: "Marrow & Vine Theatre"
                agency_name: "Southgate Booking"
                guarantee_floor_cents: 100000
                historical_sell_through_pct: 0.60
                routing_window_start_utc: "2026-09-01T00:00:00Z"
                routing_window_end_utc: "2026-12-31T00:00:00Z"
                min_days_between_engagements: 0
              captures: { artist_id: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload:
                engagement_type: "PRESENTED"
                space_id: "${space_id}"
                artist_id: "${artist_id}"
                title: "Marrow & Vine: Field Notes"
                load_in_start_utc: "2026-10-01T08:00:00Z"
                performance_start_utc: "2026-10-02T19:00:00Z"
                performance_end_utc: "2026-10-02T22:00:00Z"
                load_out_end_utc: "2026-10-03T02:00:00Z"
                performance_day_count: 1
                load_in_day_count: 1
              captures: { engagement_id: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/education-programs"
              as: ProgrammingDirector
              payload:
                program_type: "STUDENT_MATINEE"
                participant_capacity: 200
                subsidy_requested_cents: 1000000
              captures: { program_1: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/education-programs"
              as: ProgrammingDirector
              payload:
                program_type: "MASTERCLASS"
                participant_capacity: 100
                subsidy_requested_cents: 250000
              captures: { program_2: "$.data.id" }
          trigger:
            - call: "POST /engagements/${engagement_id}/cancel"
              as: ProgrammingDirector
              payload:
                reason: "Company visa denied"
          assert:
            - "200; lifecycle_status CANCELLED and cancellation_fee_cents == 0 (a DRAFT cancellation retains nothing, so no money leaks out of the conservation test)."
            - "GET /engagements/${engagement_id}/education-programs: both programs are CANCELLED_WITH_ENGAGEMENT, with subsidy_approved_cents 700000 and 250000 respectively — the approved amounts are preserved so the refunds are auditable."
            - "GET /engagements/${engagement_id}/reserve-ledger-entries returns exactly 4 rows in created_at ASC order: EDUCATION_SUBSIDY_DRAW -700000 (balance_after_cents 9300000), EDUCATION_SUBSIDY_DRAW -250000 (9050000), EDUCATION_SUBSIDY_REFUND +700000 (9750000), EDUCATION_SUBSIDY_REFUND +250000 (10000000)."
            - "INVARIANT: the final balance_after_cents is exactly 10000000, identical to the opening balance. Any other figure means a refund was dropped, doubled, or computed from subsidy_requested_cents (1000000 + 250000) instead of subsidy_approved_cents."
            - "REFUND ORDER: the +700000 refund precedes the +250000 refund because P1 was created first; ordering by any other key (including id) would produce balances of 9300000 and 10000000 in a different sequence and is therefore detectable."
            - "APPEND-ONLY: the two original draw rows are byte-identical to before the cancellation (same amount_cents, same balance_after_cents). ReserveLedgerEntry has no version field and is never updated in place — compensation happens by appending an equal and opposite row."
            - "The subsidy for P2 was the request (250000), not the allowance (300000), while P1's was the allowance (700000), not the request (1000000): both directions of the min() are exercised inside the same conservation cycle."

      - name: price_tier_seat_conservation_across_sales_subscription_holds_and_refunds
        differentiation: |
          Conservation of a COUNT of physical seats across three competing claim types
          (single sales, subscription holds, availability), where the compensation is deliberately
          PARTIAL: cancelling refunds single sales but never releases subscription holds, so the
          identity seats_allocated == available_qty + sold_qty + subscription_held_qty must still
          balance while its individual terms move by different amounts. It also carries a second
          conservation law in the same trigger — the subscription waterfall's remainder cent. The
          sibling instance above conserves money and returns exactly to its starting point.
        mechanism: "PriceTier.available_qty definition, subscription_price_allocation waterfall with floor plus single-remainder assignment, and CANCEL CASCADE STEP 7 refunds with the explicit no-reversal clause on subscription holds"
        entities_involved: [PriceTier, TicketSale, SubscriptionPackage, Engagement, Artist]
        test_recipe:
          setup: |
            Two PRESENTED engagements taken ON_SALE in the same hall on non-overlapping dates, each
            with a subscription-eligible ORCH tier: E1 has 100 seats at 7000 cents and E2 has 200
            seats at 12000 cents, both with dynamic pricing disabled.
            E1 risk: projected gross round(7000*100*0.75) = 525000, guarantee 300000 -> fee exposure
            0.571429, routing slack 31 days, lead 62 days, sell-through term 0.25 -> score 38 ->
            MODERATE -> CLEARED. E2 risk: projected gross round(12000*200*0.70) = 1680000, guarantee
            400000 -> fee exposure 0.238095, routing slack 35 days, lead 66 days, sell-through term
            0.30 -> score 23 -> LOW -> CLEARED.
            A single sale of 30 seats on E1's tier at 7000 (dynamic disabled) grosses 210000.
            A "Season Choose-2" package at 100000 cents covers both engagements with 2 seats per
            order on tier name ORCH. Per-order allocation: face 7000*2 = 14000 and 12000*2 = 24000,
            total 38000; floor(100000*14000/38000) = 36842 and floor(100000*24000/38000) = 63157,
            leaving a remainder of 1 cent that goes to the FIRST tier in engagement created_at order
            (E1) -> 36843 and 63157.
            Three orders are sold: E1 holds 6 seats and books 110529; E2 holds 6 seats and books
            189471; 110529 + 189471 == 300000 == 3 * 100000.
            Seat state before the trigger: E1 100 == 64 + 30 + 6; E2 200 == 194 + 0 + 6.
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload:
                name: "Grand Hall"
                seat_capacity: 1200
                base_facility_fee_cents: 500000
                load_in_day_fee_cents: 200000
                changeover_buffer_minutes: 120
                rigging_capacity_kg: 5000
                house_power_amps: 400
                dmx_universes: 4
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload:
                legal_name: "Kestrel String Trio"
                agency_name: "Northline Artists"
                guarantee_floor_cents: 100000
                historical_sell_through_pct: 0.75
                routing_window_start_utc: "2026-09-01T00:00:00Z"
                routing_window_end_utc: "2026-12-31T00:00:00Z"
                min_days_between_engagements: 2
              captures: { artist_1: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload:
