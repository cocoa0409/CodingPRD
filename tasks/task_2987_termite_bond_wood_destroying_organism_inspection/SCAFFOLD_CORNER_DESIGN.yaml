          - state_machines.TreatmentPlan
        distinguishing_aspect: >-
          A FUMIGATION plan carries two independent instants: fumigation_start_at gates the pesticide
          application with its own 422, and fumigation_reentry_at gates COMPLETION with the plan-state
          409. One second before the permit opens is refused; exactly at the permit instant is
          accepted, so the bound is inclusive.
