          - entities.ClassroomAudit.fields.materials_pass
        distinguishing_aspect: "Mode (b) nested rounding order: groups [8/9, 8/9, 8/9, 1/1] scored per-group-rounded-then-averaged give 0.9175 >= 0.90 (pass), while the forbidden sum-then-round order gives 25/28 = 0.8929 < 0.90 (fail) — the pinned order flips the verdict to COMPLIANT."
        test_recipe:
          setup:
