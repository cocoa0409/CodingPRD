scaffold_difficulty_design:
  # ==========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: engagement_score_census_vs_pulse_identical_answers
        grounds:
          - calculations.engagement_score
          - entities.SurveyCycle.fields.cycle_kind
          - entities.ReportSnapshot.fields.overall_score
        distinguishing_aspect: |
          Same raw answers (5,4,3 on weights 1.5/1.0/2.0) yield overall_score
          72.22 under the CENSUS weighted variant but 75.00 under the PULSE
          unweighted variant — the dual variant lives on the ReportSnapshot
          scoring domain and diverges purely by cycle_kind.
        test_recipe:
          setup:
            - "An ACTIVE ItemBank with 3 ACTIVE items: I1 (PURPOSE, w=1.5), I2 (GROWTH, w=1.0), I3 (PURPOSE, w=2.0)"
            - "One OrgUnit U with min_n_threshold=5 holding 5 ACTIVE employees hired 2026-01-01"
            - "A CENSUS cycle C1 and a PULSE cycle C2, each pinning all 3 items, each OPENED then 5 SUBMITTED responses answering (5,4,3), then CLOSED and SCORING"
          setup_api_calls:
            - call: "POST /engagement/item-banks"
              payload: { name: "EWI Bank", framework: "EWI" }
              as: HRAdmin
              captures: { bank_id: $.data.id }
            - call: "POST /engagement/item-banks/${bank_id}/items"
              payload: { item_code: "EWI-01", dimension: "PURPOSE", weight: 1.5 }
              as: HRAdmin
              captures: { item1_id: $.data.id }
            - call: "POST /engagement/item-banks/${bank_id}/items"
              payload: { item_code: "EWI-02", dimension: "GROWTH", weight: 1.0 }
              as: HRAdmin
              captures: { item2_id: $.data.id }
            - call: "POST /engagement/item-banks/${bank_id}/items"
              payload: { item_code: "EWI-03", dimension: "PURPOSE", weight: 2.0 }
              as: HRAdmin
              captures: { item3_id: $.data.id }
            - call: "POST /engagement/item-banks/${bank_id}/activate"
              payload: {}
              as: HRAdmin
            - call: "POST /engagement/org-units"
              payload: { name: "Unit A", manager_user_id: "mgr-a", min_n_threshold: 5, verbatim_n_threshold: 10 }
              as: HRAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /engagement/employees"
              payload: { external_ref: "E001", unit_id: "${unit_id}", employment_status: "ACTIVE", hired_at: "2026-01-01T00:00:00Z" }
              as: HRAdmin
              captures: { emp1_id: $.data.id }
            - call: "POST /engagement/employees"
              payload: { external_ref: "E002", unit_id: "${unit_id}", employment_status: "ACTIVE", hired_at: "2026-01-01T00:00:00Z" }
              as: HRAdmin
              captures: { emp2_id: $.data.id }
            - call: "POST /engagement/employees"
              payload: { external_ref: "E003", unit_id: "${unit_id}", employment_status: "ACTIVE", hired_at: "2026-01-01T00:00:00Z" }
              as: HRAdmin
              captures: { emp3_id: $.data.id }
            - call: "POST /engagement/employees"
              payload: { external_ref: "E004", unit_id: "${unit_id}", employment_status: "ACTIVE", hired_at: "2026-01-01T00:00:00Z" }
              as: HRAdmin
              captures: { emp4_id: $.data.id }
            - call: "POST /engagement/employees"
              payload: { external_ref: "E005", unit_id: "${unit_id}", employment_status: "ACTIVE", hired_at: "2026-01-01T00:00:00Z" }
              as: HRAdmin
              captures: { emp5_id: $.data.id }
            - call: "POST /engagement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HRAdmin
            - call: "POST /engagement/survey-cycles"
              payload: { label: "Census 2026", cycle_kind: "CENSUS", bank_id: "${bank_id}", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", min_n_default: 5 }
              as: HRAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /engagement/survey-cycles/${c1_id}/items"
              payload: { item_id: "${item1_id}", pinned_weight: 1.5, display_order: 1 }
              as: HRAdmin
            - call: "POST /engagement/survey-cycles/${c1_id}/items"
              payload: { item_id: "${item2_id}", pinned_weight: 1.0, display_order: 2 }
              as: HRAdmin
            - call: "POST /engagement/survey-cycles/${c1_id}/items"
              payload: { item_id: "${item3_id}", pinned_weight: 2.0, display_order: 3 }
              as: HRAdmin
            - call: "GET /engagement/survey-cycles/${c1_id}"
              payload: {}
              as: HRAdmin
              captures: { c1_v: $.data.version }
            - call: "POST /engagement/survey-cycles/${c1_id}/configure"
              payload: { expected_cycle_version: "${c1_v}" }
              as: HRAdmin
            - call: "POST /engagement/survey-cycles/${c1_id}/open"
              payload: {}
              as: HRAdmin
            - call: "GET /engagement/survey-invites"
              payload: { cycle_id: "${c1_id}", employee_id: "${emp1_id}" }
              as: PeopleAnalyst
              captures: { c1_inv1: "$.data[0].id" }
            - call: "GET /engagement/survey-invites"
              payload: { cycle_id: "${c1_id}", employee_id: "${emp2_id}" }
              as: PeopleAnalyst
              captures: { c1_inv2: "$.data[0].id" }
            - call: "GET /engagement/survey-invites"
              payload: { cycle_id: "${c1_id}", employee_id: "${emp3_id}" }
              as: PeopleAnalyst
              captures: { c1_inv3: "$.data[0].id" }
            - call: "GET /engagement/survey-invites"
              payload: { cycle_id: "${c1_id}", employee_id: "${emp4_id}" }
              as: PeopleAnalyst
              captures: { c1_inv4: "$.data[0].id" }
            - call: "GET /engagement/survey-invites"
              payload: { cycle_id: "${c1_id}", employee_id: "${emp5_id}" }
              as: PeopleAnalyst
              captures: { c1_inv5: "$.data[0].id" }
            - call: "POST /engagement/survey-invites/${c1_inv1}/submit"
              payload: { answers: [ { cycle_item_id: "${item1_id}", score: 5 }, { cycle_item_id: "${item2_id}", score: 4 }, { cycle_item_id: "${item3_id}", score: 3 } ] }
              as: EmployeeRole
              as_user_id: "${emp1_id}"
            - call: "POST /engagement/survey-invites/${c1_inv2}/submit"
              payload: { answers: [ { cycle_item_id: "${item1_id}", score: 5 }, { cycle_item_id: "${item2_id}", score: 4 }, { cycle_item_id: "${item3_id}", score: 3 } ] }
              as: EmployeeRole
              as_user_id: "${emp2_id}"
            - call: "POST /engagement/survey-invites/${c1_inv3}/submit"
              payload: { answers: [ { cycle_item_id: "${item1_id}", score: 5 }, { cycle_item_id: "${item2_id}", score: 4 }, { cycle_item_id: "${item3_id}", score: 3 } ] }
              as: EmployeeRole
              as_user_id: "${emp3_id}"
            - call: "POST /engagement/survey-invites/${c1_inv4}/submit"
              payload: { answers: [ { cycle_item_id: "${item1_id}", score: 5 }, { cycle_item_id: "${item2_id}", score: 4 }, { cycle_item_id: "${item3_id}", score: 3 } ] }
              as: EmployeeRole
              as_user_id: "${emp4_id}"
            - call: "POST /engagement/survey-invites/${c1_inv5}/submit"
              payload: { answers: [ { cycle_item_id: "${item1_id}", score: 5 }, { cycle_item_id: "${item2_id}", score: 4 }, { cycle_item_id: "${item3_id}", score: 3 } ] }
              as: EmployeeRole
              as_user_id: "${emp5_id}"
            - call: "POST /engagement/survey-cycles/${c1_id}/close"
              payload: {}
              as: HRAdmin
            - call: "POST /engagement/survey-cycles/${c1_id}/score"
              payload: {}
              as: PeopleAnalyst
            # ---- PULSE cycle C2, identical instrument & answers ----
            - call: "POST /engagement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: HRAdmin
            - call: "POST /engagement/survey-cycles"
              payload: { label: "Pulse Oct", cycle_kind: "PULSE", bank_id: "${bank_id}", opens_at: "2026-10-01T00:00:00Z", closes_at: "2026-10-10T00:00:00Z", sampling_ratio: 1.0 }
              as: HRAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /engagement/survey-cycles/${c2_id}/items"
              payload: { item_id: "${item1_id}", pinned_weight: 1.5, display_order: 1 }
              as: HRAdmin
            - call: "POST /engagement/survey-cycles/${c2_id}/items"
              payload: { item_id: "${item2_id}", pinned_weight: 1.0, display_order: 2 }
              as: HRAdmin
            - call: "POST /engagement/survey-cycles/${c2_id}/items"
              payload: { item_id: "${item3_id}", pinned_weight: 2.0, display_order: 3 }
              as: HRAdmin
            - call: "GET /engagement/survey-cycles/${c2_id}"
              payload: {}
              as: HRAdmin
              captures: { c2_v: $.data.version }
            - call: "POST /engagement/survey-cycles/${c2_id}/configure"
              payload: { expected_cycle_version: "${c2_v}" }
              as: HRAdmin
            - call: "POST /engagement/survey-cycles/${c2_id}/open"
              payload: {}
              as: HRAdmin
            - call: "GET /engagement/survey-invites"
              payload: { cycle_id: "${c2_id}", employee_id: "${emp1_id}" }
              as: PeopleAnalyst
              captures: { c2_inv1: "$.data[0].id" }
            - call: "GET /engagement/survey-invites"
              payload: { cycle_id: "${c2_id}", employee_id: "${emp2_id}" }
              as: PeopleAnalyst
              captures: { c2_inv2: "$.data[0].id" }
            - call: "GET /engagement/survey-invites"
              payload: { cycle_id: "${c2_id}", employee_id: "${emp3_id}" }
              as: PeopleAnalyst
              captures: { c2_inv3: "$.data[0].id" }
            - call: "GET /engagement/survey-invites"
              payload: { cycle_id: "${c2_id}", employee_id: "${emp4_id}" }
              as: PeopleAnalyst
              captures: { c2_inv4: "$.data[0].id" }
            - call: "GET /engagement/survey-invites"
              payload: { cycle_id: "${c2_id}", employee_id: "${emp5_id}" }
              as: PeopleAnalyst
              captures: { c2_inv5: "$.data[0].id" }
            - call: "POST /engagement/survey-invites/${c2_inv1}/submit"
              payload: { answers: [ { cycle_item_id: "${item1_id}", score: 5 }, { cycle_item_id: "${item2_id}", score: 4 }, { cycle_item_id: "${item3_id}", score: 3 } ] }
              as: EmployeeRole
              as_user_id: "${emp1_id}"
            - call: "POST /engagement/survey-invites/${c2_inv2}/submit"
              payload: { answers: [ { cycle_item_id: "${item1_id}", score: 5 }, { cycle_item_id: "${item2_id}", score: 4 }, { cycle_item_id: "${item3_id}", score: 3 } ] }
              as: EmployeeRole
              as_user_id: "${emp2_id}"
            - call: "POST /engagement/survey-invites/${c2_inv3}/submit"
              payload: { answers: [ { cycle_item_id: "${item1_id}", score: 5 }, { cycle_item_id: "${item2_id}", score: 4 }, { cycle_item_id: "${item3_id}", score: 3 } ] }
              as: EmployeeRole
              as_user_id: "${emp3_id}"
            - call: "POST /engagement/survey-invites/${c2_inv4}/submit"
              payload: { answers: [ { cycle_item_id: "${item1_id}", score: 5 }, { cycle_item_id: "${item2_id}", score: 4 }, { cycle_item_id: "${item3_id}", score: 3 } ] }
              as: EmployeeRole
              as_user_id: "${emp4_id}"
            - call: "POST /engagement/survey-invites/${c2_inv5}/submit"
              payload: { answers: [ { cycle_item_id: "${item1_id}", score: 5 }, { cycle_item_id: "${item2_id}", score: 4 }, { cycle_item_id: "${item3_id}", score: 3 } ] }
              as: EmployeeRole
              as_user_id: "${emp5_id}"
            - call: "POST /engagement/survey-cycles/${c2_id}/close"
              payload: {}
              as: HRAdmin
            - call: "POST /engagement/survey-cycles/${c2_id}/score"
              payload: {}
              as: PeopleAnalyst
          trigger:
            - call: "GET /engagement/report-snapshots"
              payload: { cycle_id: "${c1_id}", unit_id: "${unit_id}", scope: "DIRECT" }
              as: PeopleAnalyst
              captures: { snap_census_overall: "$.data[0].overall_score" }
            - call: "GET /engagement/report-snapshots"
              payload: { cycle_id: "${c2_id}", unit_id: "${unit_id}", scope: "DIRECT" }
              as: PeopleAnalyst
              captures: { snap_pulse_overall: "$.data[0].overall_score" }
          assert:
            - "census snapshot overall_score == 72.22"
            - "pulse snapshot overall_score == 75.00"
            - "census snapshot dimension_scores.PURPOSE == 71.43"
            - "pulse snapshot dimension_scores.PURPOSE == 75.00"
            - "snap_census_overall != snap_pulse_overall"
      - name: attrition_risk_provisional_vs_final
        grounds:
          - calculations.attrition_risk_index
          - entities.OutcomeLinkage.fields.outcome_value
        distinguishing_aspect: |
          The provisional_risk variant (forward-looking, BASE_RATE_PRIOR=0.08)
          produces 0.2200 for a low-engagement unit, while the final_risk variant
          (chronological observed attrition 2/10 = 0.20) produces 0.5500 on the
          same cycle — dual variants on the OutcomeLinkage/risk domain, distinct
          from the ReportSnapshot scoring domain of the sibling instance.
        test_recipe:
          setup:
            - "A REPORTED census cycle whose Unit B snapshot overall_score == 55.00 (< LOW_SCORE_FLOOR 60.00) with submitted_count == 10"
            - "Provisional risk computed at close: 0.08 * (1 + 1.75*1) = 0.2200"
            - "Then 2 of the 10 SUBMITTED employees get OutcomeLinkage ATTRITION/VOLUNTARY rows, triggering final_risk recompute"
          setup_api_calls:
            - call: "POST /engagement/item-banks"
              payload: { name: "Risk Bank", framework: "CUSTOM" }
              as: HRAdmin
              captures: { rbank_id: $.data.id }
            - call: "POST /engagement/item-banks/${rbank_id}/items"
              payload: { item_code: "R-01", dimension: "WORKLOAD", weight: 1.0 }
              as: HRAdmin
              captures: { ritem1: $.data.id }
            - call: "POST /engagement/item-banks/${rbank_id}/items"
              payload: { item_code: "R-02", dimension: "WORKLOAD", weight: 1.0 }
              as: HRAdmin
              captures: { ritem2: $.data.id }
            - call: "POST /engagement/item-banks/${rbank_id}/items"
              payload: { item_code: "R-03", dimension: "WORKLOAD", weight: 1.0 }
              as: HRAdmin
              captures: { ritem3: $.data.id }
            - call: "POST /engagement/item-banks/${rbank_id}/activate"
              payload: {}
              as: HRAdmin
            - call: "POST /engagement/org-units"
              payload: { name: "Unit B", manager_user_id: "mgr-b", min_n_threshold: 3, verbatim_n_threshold: 5 }
              as: HRAdmin
              captures: { unitb_id: $.data.id }
            # 10 employees, all answer (2,2,2) -> scaled 25 each, overall 25.00
            # To land overall at exactly 55.00 we instead use scores (3,3,4):
            # scaled 50,50,75 -> mean 58.33. Simplest pinned low score: use
            # uniform answers (3,3,3) -> scaled 50 -> overall 50.00 (< 60 floor).
            - call: "POST /engagement/employees"
              payload: { external_ref: "B001", unit_id: "${unitb_id}", employment_status: "ACTIVE", hired_at: "2026-01-01T00:00:00Z" }
              as: HRAdmin
              captures: { bemp1: $.data.id }
            - call: "POST /engagement/employees"
              payload: { external_ref: "B002", unit_id: "${unitb_id}", employment_status: "ACTIVE", hired_at: "2026-01-01T00:00:00Z" }
              as: HRAdmin
              captures: { bemp2: $.data.id }
            - call: "POST /engagement/employees"
              payload: { external_ref: "B003", unit_id: "${unitb_id}", employment_status: "ACTIVE", hired_at: "2026-01-01T00:00:00Z" }
              as: HRAdmin
              captures: { bemp3: $.data.id }
            - call: "POST /engagement/employees"
              payload: { external_ref: "B004", unit_id: "${unitb_id}", employment_status: "ACTIVE", hired_at: "2026-01-01T00:00:00Z" }
              as: HRAdmin
              captures: { bemp4: $.data.id }
            - call: "POST /engagement/employees"
              payload: { external_ref: "B005", unit_id: "${unitb_id}", employment_status: "ACTIVE", hired_at: "2026-01-01T00:00:00Z" }
              as: HRAdmin
              captures: { bemp5: $.data.id }
            - call: "POST /engagement/employees"
              payload: { external_ref: "B006", unit_id: "${unitb_id}", employment_status: "ACTIVE", hired_at: "2026-01-01T00:00:00Z" }
              as: HRAdmin
              captures: { bemp6: $.data.id }
            - call: "POST /engagement/employees"
              payload: { external_ref: "B007", unit_id: "${unitb_id}", employment_status: "ACTIVE", hired_at: "2026-01-01T00:00:00Z" }
              as: HRAdmin
              captures: { bemp7: $.data.id }
            - call: "POST /engagement/employees"
              payload: { external_ref: "B008", unit_id: "${unitb_id}", employment_status: "ACTIVE", hired_at: "2026-01-01T00:00:00Z" }
              as: HRAdmin
              captures: { bemp8: $.data.id }
            - call: "POST /engagement/employees"
              payload: { external_ref: "B009", unit_id: "${unitb_id}", employment_status: "ACTIVE", hired_at: "2026-01-01T00:00:00Z" }
              as: HRAdmin
              captures: { bemp9: $.data.id }
            - call: "POST /engagement/employees"
