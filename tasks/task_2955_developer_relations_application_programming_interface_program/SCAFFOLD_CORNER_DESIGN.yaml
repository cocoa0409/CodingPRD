            - call: "POST /api-products/${p1_id}/versions"
              payload: { semver: "1.0.0", breaking_change: false }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /api-versions/${v1_id}/promote"
              payload: {}
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /developers"
              payload: { org_name: "Northwind Labs", contact_email: "dev1@northwind.example", region_code: "EU" }
              as: Anonymous
              as_user_id: "anon-1"
              captures: { d1_id: $.data.id }
            - call: "POST /developers"
              payload: { org_name: "Southgate Data", contact_email: "dev2@southgate.example", region_code: "US" }
              as: DevRelManager
              as_user_id: "drm-1"
              captures: { d2_id: $.data.id }
