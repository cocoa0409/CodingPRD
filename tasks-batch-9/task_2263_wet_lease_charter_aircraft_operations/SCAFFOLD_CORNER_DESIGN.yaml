          - state_machines.Lessee[SUSPENDED -> ACTIVE]
          - endpoints[POST /wetlease/lessees/{lesseeId}/suspend]
          - endpoints[POST /wetlease/lessees/{lesseeId}/reinstate]
        distinguishing_aspect: |
          The credit-control cycle is observable on the Lessee alone: suspend flips status and
          bumps version, reinstate flips it back and bumps again, and NEITHER leg touches
          outstanding_balance_usd_cents or credit_limit_usd_cents. Reinstating a lessee that is
          already ACTIVE is 409 ERR_LESSEE_INVALID_STATE, which proves the guard rather than a
          silent no-op.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one ACTIVE Lessee with credit limit 500000000 and balance 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /wetlease/lessees"
              payload: { name: "Meridian Charter Group", icao_code: "MCG", home_base_icao: "EGSS", credit_limit_usd_cents: 500000000 }
              as: BillingAdmin
              captures: { lessee_id: $.data.id }
          trigger:
            - call: "POST /wetlease/lessees/${lessee_id}/reinstate"
              payload: {}
              as: BillingAdmin
              captures: { err: $.data.error_id }
            - call: "POST /wetlease/lessees/${lessee_id}/suspend"
              payload: {}
              as: BillingAdmin
            - call: "POST /wetlease/lessees/${lessee_id}/reinstate"
              payload: {}
              as: BillingAdmin
          assert:
            - "trigger[0].status == 409"
            - "trigger[0].data.error_id == ERR_LESSEE_INVALID_STATE"
            - "trigger[1].status == 200"
            - "trigger[1].data.status == SUSPENDED"
            - "trigger[1].data.version == 2"
            - "trigger[1].data.outstanding_balance_usd_cents == 0"
            - "trigger[1].data.credit_limit_usd_cents == 500000000"
            - "trigger[2].status == 200"
            - "trigger[2].data.status == ACTIVE"
            - "trigger[2].data.version == 3"
            - "trigger[2].data.outstanding_balance_usd_cents == 0"

