# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or malformed"
  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Role lacks permission for the endpoint OR write-down cancel attempted by non-requester OR amendment decision exceeds role authority"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource id does not exist within the firm scope"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, non-positive amounts, zero/negative hours, or invalid enum value"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "Generic state precondition failure (e.g., transition not in state machine)"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC mismatch on expected_matter_version"
  - id: ERR_MATTER_NOT_OPEN
    http: 409
    condition: "Matter not in OPEN/ACTIVE/REOPENED for the requested action"
  - id: ERR_CLIENT_NOT_ACTIVE
    http: 409
    condition: "Client SUSPENDED or CLOSED; blocks new time entries"
  - id: ERR_PERIOD_CLOSED
    http: 409
    condition: "Action would affect a period ≤ closed_through_period_index"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "Same user cannot request and decide"
  - id: ERR_ARRANGEMENT_FIELDS_INCOMPLETE
    http: 422
    condition: "Arrangement-type-specific required field missing"
  - id: ERR_ARRANGEMENT_ALREADY_ACTIVE
    http: 409
    condition: "Matter already has ACTIVE or PENDING_APPROVAL arrangement"
  - id: ERR_TASK_CODE_NOT_BUDGETED
    http: 409
    condition: "Time entry task_code does not match any ACTIVE PhaseBudget"
  - id: ERR_WRITE_DOWN_ENTRIES_INVALID
    http: 422
    condition: "time_entry_ids missing, do not belong to matter, or not in APPROVED/BILLED"
  - id: ERR_WRITE_DOWN_ENTRY_STATE
    http: 422
    condition: "One or more entries not in APPROVED/BILLED state"
  - id: ERR_WRITE_DOWN_AMOUNT_INVALID
    http: 422
    condition: "Requested write-down amount ≤ 0 or > sum of entry amounts"
  - id: ERR_AMENDMENT_NEGATIVE_BUDGET
    http: 422
    condition: "Amendment would drive current_budget_cents negative"
  - id: ERR_AMENDMENT_AUTHORITY_EXCEEDED
    http: 403
    condition: "Amendment magnitude exceeds BillingPartner authority; requires ManagingPartner"
  - id: ERR_AMENDMENT_SUPERSEDE_INVALID
    http: 409
    condition: "supersedes_amendment_id references amendment not in REJECTED/SUPERSEDED"
  - id: ERR_MATTER_HAS_OPEN_WIP
    http: 409
    condition: "Cannot close matter with DRAFT/SUBMITTED/APPROVED time entries"
  - id: ERR_MATTER_HAS_PENDING_WRITE_DOWNS
    http: 409
    condition: "Cannot close matter with non-terminal WriteDownRequest"
  - id: ERR_MATTER_HAS_PENDING_AMENDMENTS
    http: 409
    condition: "Cannot close matter with DRAFT/PENDING_REVIEW BudgetAmendment"
  - id: ERR_MATTER_COLLAR_UNSETTLED
    http: 409
    condition: "Cannot close COLLAR matter with unsettled year-end true-up"
  - id: ERR_MATTER_ACCRUAL_OUTSTANDING
    http: 409
    condition: "Cannot close matter when client requires accrual reporting and latest report not submitted/acknowledged"
  - id: ERR_CLIENT_HAS_OPEN_MATTERS
    http: 409
    condition: "Cannot close client with non-CLOSED matters"
  - id: ERR_REOPEN_WINDOW_CLOSED
    http: 409
    condition: "Reopen attempted outside allowed window"
  - id: ERR_PHASE_HAS_ACTUALS
    http: 409
    condition: "Cannot void PhaseBudget with actual_to_date_cents > 0"
  - id: ERR_PHASE_HAS_PENDING_AMENDMENT
    http: 409
    condition: "Cannot void PhaseBudget with DRAFT/PENDING_REVIEW amendment"
  - id: ERR_PHASE_NOT_AMENDABLE
    http: 409
    condition: "Amendment target PhaseBudget not in ACTIVE/AMENDED"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FirmAdmin
    description: "Firm administrator: manages firm, clients, timekeepers, period close"
    identity: opaque
    exclusive_operations:
      - "POST /firms"
      - "POST /firms/{id}/advance_period"
      - "POST /firms/{id}/close_books"
      - "POST /firms/{id}/timekeepers"
      - "POST /firms/{id}/clients/{id}/suspend"
      - "POST /firms/{id}/clients/{id}/activate"
      - "POST /firms/{id}/clients/{id}/close"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints (broad read)"
      - "POST /firms/{id}/clients (with BillingPartner)"

  - name: PricingAnalyst
    description: "Pricing office analyst: drafts fee arrangements, phase budgets, budget amendments"
    identity: opaque
    exclusive_operations:
      - "POST /firms/{id}/matters/{id}/fee_arrangements"
      - "POST /firms/{id}/fee_arrangements/{id}/submit"
      - "POST /firms/{id}/matters/{id}/budget_amendments"
      - "POST /firms/{id}/budget_amendments/{id}/submit"
    shared_operations:
      - "POST /firms/{id}/matters/{id}/phase_budgets (with BillingPartner)"
      - "POST /firms/{id}/phase_budgets/{id}/activate (with BillingPartner)"
      - "PATCH /firms/{id}/phase_budgets/{id} (with BillingPartner)"
      - "GET endpoints"

  - name: BillingPartner
    description: "Partner with billing responsibility: approves time entries, activates arrangements, decides write-downs within authority"
    identity: "entity_backed:Timekeeper"
    exclusive_operations:
      - "POST /firms/{id}/matters/{id}/suspend"
      - "POST /firms/{id}/matters/{id}/resume"
      - "POST /firms/{id}/time_entries/{id}/approve"
      - "POST /firms/{id}/time_entries/{id}/mark_billed"
      - "POST /firms/{id}/time_entries/{id}/reject"
      - "POST /firms/{id}/matters/{id}/write_down_requests"
      - "POST /firms/{id}/write_down_requests/{id}/submit"
      - "POST /firms/{id}/write_down_requests/{id}/cancel"
      - "POST /firms/{id}/phase_budgets/{id}/void"
      - "POST /firms/{id}/accrual_reports/{id}/submit"
      - "POST /firms/{id}/accrual_reports/{id}/resubmit"
    shared_operations:
      - "POST /firms/{id}/matters/{id}/close (with ManagingPartner)"
      - "POST /firms/{id}/matters/{id}/time_entries (with Timekeeper)"
      - "POST /firms/{id}/fee_arrangements/{id}/activate (with ManagingPartner)"
      - "POST /firms/{id}/fee_arrangements/{id}/reject (with ManagingPartner)"
      - "POST /firms/{id}/write_down_requests/{id}/decide (with ManagingPartner)"
      - "POST /firms/{id}/write_down_requests/{id}/apply (with ManagingPartner)"
      - "POST /firms/{id}/budget_amendments/{id}/decide (with ManagingPartner, subject to authority)"
      - "POST /firms/{id}/matters/{id}/run_year_end_collar_true_up (with ManagingPartner)"
      - "POST /firms/{id}/collar_true_ups/{id}/settle (with ManagingPartner)"
      - "GET endpoints"

  - name: ManagingPartner
    description: "Senior partner with elevated authority: approves large write-downs and amendments, waives true-ups, reopens matters"
    identity: "entity_backed:Timekeeper"
    exclusive_operations:
      - "POST /firms/{id}/matters/{id}/reopen"
      - "POST /firms/{id}/collar_true_ups/{id}/waive"
    shared_operations:
      - "All BillingPartner shared operations"
      - "POST /firms/{id}/close_books (with FirmAdmin)"

  - name: Timekeeper
    description: "Attorney/paralegal recording time"
    identity: "entity_backed:Timekeeper"
    exclusive_operations: []
    shared_operations:
      - "POST /firms/{id}/matters/{id}/time_entries (with BillingPartner)"
      - "POST /firms/{id}/time_entries/{id}/submit (with BillingPartner)"
      - "GET endpoints"

  - name: ClientContact
    description: "External client contact: acknowledges or disputes accrual reports"
    identity: opaque
    exclusive_operations:
      - "POST /firms/{id}/accrual_reports/{id}/acknowledge"
      - "POST /firms/{id}/accrual_reports/{id}/dispute"
    shared_operations:
      - "GET endpoints (scoped to matters for their client)"
