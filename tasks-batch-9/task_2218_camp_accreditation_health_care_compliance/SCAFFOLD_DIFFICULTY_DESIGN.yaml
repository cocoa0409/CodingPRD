          setup:
            - "Standards edition ACA-2026-C is PUBLISHED with three universal mandatory scoring_weight 1 standards: HW.7 HEALTH_WELLNESS with written_plan_type_required HEALTH_CARE, ER.4 EMERGENCY_RESPONSE, and SU.1 SUPERVISION."
