        distinguishing_aspect: "The settlement branch of the bond-draw endpoint is conditional on reconciliation_id being set AND draw_amount_cents equalling that row's additional_fee_due_cents. Drawing 1,300,001 against a 1,300,000 balance is a perfectly legal draw — the bond debits and lands PARTIALLY_DRAWN — but the reconciliation must stay PENDING_PAYMENT and the lease balance must stay 1,300,000. An implementation that settles whenever the draw covers the balance wrongly zeroes the ledger and loses the extra cent."
