              as: ProgramAdmin
              as_user_id: "adm-1"
            - call: "POST /srts/infrastructure-projects/${p1_id}/fund"
              payload: { expected_grant_program_version: "${grant_v}", award_note: "Awarding against the current balance." }
              as: ProgramAdmin
              as_user_id: "adm-1"
          assert:
            - "trigger call 1 returns ERR_STALE_GRANT_PROGRAM_VERSION with HTTP 412"
            - "after trigger call 1: GrantProgram.${grant_id}.committed_cents == 0, remaining_cents == 12000000, funded_project_count == 0, version == ${grant_v}"
            - "after trigger call 1: InfrastructureProject.${p1_id}.status == SCORED with awarded_cents == 0 and funded_at == null"
            - "trigger call 2 returns HTTP 200 with data.status == FUNDED, data.awarded_cents == 3000000 and data.funded_at == 2026-08-01T00:00:00Z"
            - "after trigger call 2: GrantProgram.${grant_id}.committed_cents == 3000000, remaining_cents == 9000000, funded_project_count == 1, deferred_project_count == 0, version == ${grant_v} + 1"
            - "InfrastructureProject.${p2_id}.status == SCORED — remaining_cents never reached 0, so cascade link 2 did not fire"

      - name: corner_third_unexcused_absence_crosses_the_reliability_floor
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.guard_reliability_score
          - state_machines.Guard.certification.CERTIFIED_to_SUSPENDED
          - entities.Guard.reliability_score_rolling_90d
        distinguishing_aspect: |
          The suspension threshold is a strict cumulative boundary on the ROLLING_90D
          variant, and the boundary is crossed by exactly one absence. With 12 training
          hours (training_bonus 3.00), each UNEXCUSED absence costs 10.0 rolling points
          (4.0 absence + 6.0 unexcused): after two the guard sits at 83.00 and stays
          CERTIFIED, after the third at 73.00 — strictly below 75.00 — so certification
          flips to SUSPENDED with suspension_reason RELIABILITY_BREACH and the assignment
          is vacated with vacated_reason GUARD_SUSPENDED. The SEASON_TO_DATE variant charges
          2.5 + 7.5 = 10.0 for the same rows, so both variants read 73.00 here and only the
          rolling one gates the state machine.
        test_recipe:
          setup:
            - "WARRANTED intersection with one ACTIVE AM post; Rita (12 training hours) certified and assigned 2026-09-08 -> 2026-09-18; two UNEXCUSED absences already filed for 2026-09-14 and 2026-09-15."
          setup_api_calls:
            - call: "POST /srts/schools"
              payload: { name: "Maple Grove Elementary", district_code: "D-07", enrollment_count: 640, session_start_date: "2026-08-24", session_end_date: "2027-06-11", am_window_start_utc: "07:15", am_window_end_utc: "08:15", pm_window_start_utc: "14:45", pm_window_end_utc: "15:45", baseline_walk_bike_mode_share_pct: 18.50 }
              as: ProgramAdmin
              as_user_id: "adm-1"
              captures: { school_id: $.data.id }
