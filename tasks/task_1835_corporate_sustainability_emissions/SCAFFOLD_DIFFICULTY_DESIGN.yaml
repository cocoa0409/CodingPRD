scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc: two dual-variant calculations on DIFFERENT
  # entity domains (ActivityRecord/Instrument->Inventory vs SupplierEngagement)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: scope2_location_vs_market_divergence
        grounds:
          - calculations.market_based_scope2
          - calculations.inventory_aggregation
          - entities.InventoryResult.fields.scope2_market_tco2e
          - entities.InventoryResult.fields.scope2_location_tco2e
        distinguishing_aspect: |
          Same APPROVED electricity set priced two ways on the ActivityRecord/
          RenewableInstrument domain: location ignores RETIRED instruments
          (100 MWh x 0.4 = 40.00) while market allocates 30 retired MWh at
          zero and prices only the 70 MWh residual at 0.5 (= 35.00); the two
          variants yield different totals for identical input data.
        test_recipe:
          setup:
            - "Site Alpha in grid region CA; PUBLISHED SCOPE2_GRID factor CA = 0.4 tCO2e/MWh and PUBLISHED SCOPE2_RESIDUAL_MIX factor CA = 0.5, both valid [2026-01-01, 2026-12-31]"
            - "Cycle FY2026 (reporting_year 2026) in DATA_COLLECTION"
            - "One APPROVED ELECTRICITY record: 100 MWh, period [2026-01-01, 2026-02-01)"
            - "One PROCURED SOLAR instrument of 30 MWh, vintage 2026, retired against (Alpha, FY2026)"
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Alpha", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site_a: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE2_GRID", region_code: "CA", unit: "MWh", value_tco2e_per_unit: 0.4, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f_grid: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f_grid}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE2_RESIDUAL_MIX", region_code: "CA", unit: "MWh", value_tco2e_per_unit: 0.5, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f_res: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f_res}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site_a}", factor_id: "${f_grid}", activity_type: "ELECTRICITY", quantity: 100, unit: "MWh", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { rec: $.data.id } }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /sustainability/instruments", payload: { registry: "M-RETS", serial_number: "S-100", technology: "SOLAR", vintage_year: 2026, quantity_mwh: 30 }, as: SustainabilityManager, captures: { inst: $.data.id } }
            - { call: "POST /sustainability/instruments/${inst}/retire", payload: { cycle_id: "${cyc}", site_id: "${site_a}" }, as: SustainabilityManager }
          trigger:
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { cyc_v: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${cyc_v}" }, as: SustainabilityManager, captures: { loc: $.data.scope2_location_tco2e, mkt: $.data.scope2_market_tco2e } }
          assert:
            - "recalculate response scope2_location_tco2e == 40.0 (100 MWh x grid 0.4, instruments ignored)"
            - "recalculate response scope2_market_tco2e == 35.0 (covered 30 MWh x 0 + residual 70 MWh x 0.5)"
            - "scope2_location_tco2e != scope2_market_tco2e for identical APPROVED input data"

      - name: scope3_supplier_specific_vs_spend_based
        grounds:
          - calculations.inventory_aggregation
          - entities.InventoryResult.fields.scope3_tco2e
          - entities.InventoryResult.fields.scope3_provisional_tco2e
          - state_machines.SupplierEngagement.RESPONDED_to_ACCEPTED
        distinguishing_aspect: |
          Same engagement set priced two ways on the SupplierEngagement domain:
          the final column uses the ACCEPTED supplier figure (7.50) while the
          provisional column prices the same engagement spend-based
          (10000 USD x 0.0005 = 5.00); different entity domain from the
          scope-2 instance and different numbers for identical data.
        test_recipe:
          setup:
            - "PUBLISHED SCOPE3_EEIO_SPEND factor GLOBAL = 0.0005 tCO2e/USD covering the 2026 midpoint"
            - "Cycle FY2026 in DATA_COLLECTION"
            - "One engagement: spend_usd 10000, contact supplier-1, responded with supplier_tco2e 7.50 and ACCEPTED"
          setup_api_calls:
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE3_EEIO_SPEND", region_code: "GLOBAL", unit: "USD", value_tco2e_per_unit: 0.0005, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f_eeio: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f_eeio}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/supplier-engagements", payload: { cycle_id: "${cyc}", supplier_name: "Acme Steel", category: "PURCHASED_GOODS", spend_usd: 10000, contact_user_id: "supplier-1", due_date: "2026-12-31T00:00:00Z" }, as: SustainabilityAnalyst, as_user_id: "analyst-1", captures: { eng: $.data.id } }
            - { call: "POST /sustainability/supplier-engagements/${eng}/respond", payload: { supplier_tco2e: 7.5 }, as: SupplierContact, as_user_id: "supplier-1" }
            - { call: "POST /sustainability/supplier-engagements/${eng}/decision", payload: { decision: "ACCEPT" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
          trigger:
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { cyc_v: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${cyc_v}" }, as: SustainabilityManager, captures: { s3: $.data.scope3_tco2e, s3p: $.data.scope3_provisional_tco2e } }
          assert:
            - "recalculate response scope3_tco2e == 7.5 (ACCEPTED engagement at supplier_tco2e)"
            - "recalculate response scope3_provisional_tco2e == 5.0 (same engagement spend-based: round_half_up(10000 x 0.0005, 2))"
            - "scope3_tco2e != scope3_provisional_tco2e for identical engagement data"

  # ===========================================================================
  # Rule 2 — combinatorial_formula: mode (a) multi-input non-linear waterfall
  # vs mode (b) pinned nested rounding order — DIFFERENT modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: market_scope2_waterfall_cap_and_fallback
        grounds:
          - calculations.market_based_scope2
          - entities.RenewableInstrument.fields.retired_for_site_id
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — nested
          min(site_mwh, retired) caps site B's 80 MWh instrument at its 50 MWh
          consumption, a conditional branch sends factor-less region CB to the
          grid fallback (0.9), and region CA uses the residual mix (0.5):
          market = round2(35.0000 + 0.0000 + 9.0000) = 44.00.
        test_recipe:
          setup:
            - "Sites A and B in region CA (grid 0.4, residual 0.5 PUBLISHED); site C in region CB (grid 0.9 PUBLISHED, NO residual-mix factor)"
            - "Cycle FY2026 in DATA_COLLECTION; APPROVED electricity: A=100 MWh, B=50 MWh, C=10 MWh"
            - "Instruments retired: 30 MWh -> (A, cycle); 80 MWh -> (B, cycle); none for C"
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "A", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site_a: $.data.id } }
            - { call: "POST /sustainability/sites", payload: { name: "B", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site_b: $.data.id } }
            - { call: "POST /sustainability/sites", payload: { name: "C", country_code: "US", grid_region_code: "CB" }, as: SustainabilityManager, captures: { site_c: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE2_GRID", region_code: "CA", unit: "MWh", value_tco2e_per_unit: 0.4, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f_gca: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f_gca}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE2_RESIDUAL_MIX", region_code: "CA", unit: "MWh", value_tco2e_per_unit: 0.5, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f_rca: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f_rca}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE2_GRID", region_code: "CB", unit: "MWh", value_tco2e_per_unit: 0.9, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f_gcb: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f_gcb}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site_a}", factor_id: "${f_gca}", activity_type: "ELECTRICITY", quantity: 100, unit: "MWh", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { rec_a: $.data.id } }
            - { call: "POST /sustainability/activity-records/${rec_a}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${rec_a}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site_b}", factor_id: "${f_gca}", activity_type: "ELECTRICITY", quantity: 50, unit: "MWh", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { rec_b: $.data.id } }
            - { call: "POST /sustainability/activity-records/${rec_b}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${rec_b}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site_c}", factor_id: "${f_gcb}", activity_type: "ELECTRICITY", quantity: 10, unit: "MWh", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { rec_c: $.data.id } }
            - { call: "POST /sustainability/activity-records/${rec_c}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${rec_c}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /sustainability/instruments", payload: { registry: "M-RETS", serial_number: "S-A30", technology: "SOLAR", vintage_year: 2026, quantity_mwh: 30 }, as: SustainabilityManager, captures: { inst_a: $.data.id } }
            - { call: "POST /sustainability/instruments/${inst_a}/retire", payload: { cycle_id: "${cyc}", site_id: "${site_a}" }, as: SustainabilityManager }
            - { call: "POST /sustainability/instruments", payload: { registry: "M-RETS", serial_number: "S-B80", technology: "WIND", vintage_year: 2026, quantity_mwh: 80 }, as: SustainabilityManager, captures: { inst_b: $.data.id } }
            - { call: "POST /sustainability/instruments/${inst_b}/retire", payload: { cycle_id: "${cyc}", site_id: "${site_b}" }, as: SustainabilityManager }
          trigger:
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { cyc_v: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${cyc_v}" }, as: SustainabilityManager, captures: { mkt: $.data.scope2_market_tco2e, loc: $.data.scope2_location_tco2e } }
          assert:
            - "recalculate response scope2_market_tco2e == 44.0 (A: (100-30) x 0.5 = 35.0000; B: covered min(50,80)=50 so residual 0; C: 10 x grid fallback 0.9 = 9.0000)"
            - "recalculate response scope2_location_tco2e == 69.0 (40.0000 + 20.0000 + 9.0000)"

      - name: inventory_nested_rounding_order
        grounds:
          - calculations.inventory_aggregation
          - calculations.record_tco2e
          - entities.ActivityRecord.fields.tco2e
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-record-to-4dp
          THEN sum THEN round-to-2dp. Five records of 1 therm x 0.00099 give
          per-record 0.0010, sum 0.0050, scope1 0.01 — while the forbidden
          sum-then-round order would give round2(0.00495) = 0.00. Different
          mode from the waterfall instance.
        test_recipe:
          setup:
            - "PUBLISHED SCOPE1_STATIONARY factor GLOBAL = 0.00099 tCO2e/therm covering 2026"
            - "Cycle FY2026 in DATA_COLLECTION; five APPROVED STATIONARY_FUEL records of 1 therm each with adjacent (non-overlapping) monthly periods"
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "BoilerHouse", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE1_STATIONARY", region_code: "GLOBAL", unit: "therm", value_tco2e_per_unit: 0.00099, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f_fuel: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f_fuel}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f_fuel}", activity_type: "STATIONARY_FUEL", quantity: 1, unit: "therm", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { r1: $.data.id } }
            - { call: "POST /sustainability/activity-records/${r1}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${r1}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f_fuel}", activity_type: "STATIONARY_FUEL", quantity: 1, unit: "therm", period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { r2: $.data.id } }
            - { call: "POST /sustainability/activity-records/${r2}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${r2}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f_fuel}", activity_type: "STATIONARY_FUEL", quantity: 1, unit: "therm", period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { r3: $.data.id } }
            - { call: "POST /sustainability/activity-records/${r3}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${r3}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f_fuel}", activity_type: "STATIONARY_FUEL", quantity: 1, unit: "therm", period_start: "2026-04-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { r4: $.data.id } }
            - { call: "POST /sustainability/activity-records/${r4}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${r4}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f_fuel}", activity_type: "STATIONARY_FUEL", quantity: 1, unit: "therm", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { r5: $.data.id } }
            - { call: "POST /sustainability/activity-records/${r5}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${r5}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1", captures: { r5_tco2e: $.data.tco2e } }
          trigger:
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { cyc_v: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${cyc_v}" }, as: SustainabilityManager, captures: { s1: $.data.scope1_tco2e } }
          assert:
            - "approve response for r5 has tco2e == 0.001 (round_half_up(1 x 0.00099, 4) = 0.0010)"
            - "recalculate response scope1_tco2e == 0.01 (sum of rounded lines 0.0050 -> round_half_up 2dp = 0.01; forbidden sum-then-round would give 0.00)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine: cyclic ReportingCycle vs cyclic
  # SupplierEngagement — DIFFERENT entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: cycle_lock_reopen_lock_loop
        grounds:
          - state_machines.ReportingCycle.LOCKED_to_UNDER_REVIEW
          - state_machines.ReportingCycle.UNDER_REVIEW_to_LOCKED
          - state_machines.InventoryResult.FROZEN_to_STALE
        distinguishing_aspect: |
          ReportingCycle is cyclic: UNDER_REVIEW -> LOCKED -> (reopen)
          UNDER_REVIEW -> LOCKED again is legal, and each hop drives the
          InventoryResult dimension FROZEN -> STALE -> CURRENT -> FROZEN.
        test_recipe:
          setup:
            - "Cycle FY2026 with zero records and zero engagements; inventory recalculated to CURRENT"
          setup_api_calls:
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { cyc_v1: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${cyc_v1}" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "LOCKED" }, as: SustainabilityManager }
          trigger:
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SustainabilityManager, captures: { st: $.data.status } }
            - { call: "GET /sustainability/inventory-results", payload: { cycle_id: "${cyc}" }, as: SustainabilityManager, captures: { inv_status: "$.data[0].status" } }
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { cyc_v2: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${cyc_v2}" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "LOCKED" }, as: SustainabilityManager, captures: { st2: $.data.status } }
          assert:
            - "reopen response status == UNDER_REVIEW (LOCKED -> UNDER_REVIEW cyclic edge)"
            - "after reopen, InventoryResult.status == STALE (FROZEN -> STALE on reopen)"
            - "second LOCKED transition succeeds: final status == LOCKED (full loop)"

      - name: engagement_revision_negotiation_loop
        grounds:
          - state_machines.SupplierEngagement.RESPONDED_to_NEEDS_REVISION
          - state_machines.SupplierEngagement.NEEDS_REVISION_to_INVITED
          - entities.SupplierEngagement.fields.round
        distinguishing_aspect: |
          SupplierEngagement is cyclic: INVITED -> RESPONDED ->
          NEEDS_REVISION -> INVITED -> RESPONDED -> ACCEPTED with round
          incrementing only on the REINVITE edge (ends at round 2). Different
          entity from the ReportingCycle loop.
        test_recipe:
          setup:
            - "Cycle FY2026 in DATA_COLLECTION; one engagement INVITED (round 1, contact supplier-1)"
          setup_api_calls:
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/supplier-engagements", payload: { cycle_id: "${cyc}", supplier_name: "Acme Steel", category: "PURCHASED_GOODS", spend_usd: 10000, contact_user_id: "supplier-1", due_date: "2026-12-31T00:00:00Z" }, as: SustainabilityAnalyst, as_user_id: "analyst-1", captures: { eng: $.data.id } }
            - { call: "POST /sustainability/supplier-engagements/${eng}/respond", payload: { supplier_tco2e: 7.5 }, as: SupplierContact, as_user_id: "supplier-1" }
            - { call: "POST /sustainability/supplier-engagements/${eng}/decision", payload: { decision: "REQUEST_REVISION" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
          trigger:
            - { call: "POST /sustainability/supplier-engagements/${eng}/decision", payload: { decision: "REINVITE" }, as: SustainabilityAnalyst, as_user_id: "analyst-1", captures: { st: $.data.status, rd: $.data.round } }
            - { call: "POST /sustainability/supplier-engagements/${eng}/respond", payload: { supplier_tco2e: 6.5 }, as: SupplierContact, as_user_id: "supplier-1" }
            - { call: "POST /sustainability/supplier-engagements/${eng}/decision", payload: { decision: "ACCEPT" }, as: SustainabilityAnalyst, as_user_id: "analyst-1", captures: { st2: $.data.status, tco: $.data.supplier_tco2e } }
          assert:
            - "REINVITE response status == INVITED and round == 2 (NEEDS_REVISION -> INVITED cyclic edge increments round)"
            - "second respond overwrites supplier_tco2e to 6.5"
            - "final decision response status == ACCEPTED"

  # ===========================================================================
  # Rule 4 — transitive_cascade: approval-triggered depth-3 chain vs
  # retirement-triggered depth-3 chain — DIFFERENT triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: approval_cascade_inventory_target_questionnaire
        grounds:
          - state_machines.ActivityRecord.UNDER_REVIEW_to_APPROVED
          - state_machines.InventoryResult.CURRENT_to_STALE
          - entities.EmissionTarget.fields.trajectory_status
          - entities.QuestionnaireResponse.fields.emissions_section_stale
        distinguishing_aspect: |
          Depth-3 chain from the APPROVE trigger: record approval mutates
          InventoryResult (-> STALE); that mutation flips the watching
          EmissionTarget (-> NOT_EVALUATED, was ON_TRACK); that in turn flags
          the QuestionnaireResponse (emissions_section_stale false -> true).
        test_recipe:
          setup:
            - "PUBLISHED SCOPE1_STATIONARY factor GLOBAL = 0.5 tCO2e/therm; site active; cycle FY2026 in DATA_COLLECTION"
            - "CDP questionnaire for the cycle with all 4 required sections answered (emissions_section_stale == false)"
            - "ACTIVE target: base_year 2025, target_year 2030, reduction 50%, coverage SCOPE1_2_3, base total 1000 (activation legal: no locked 2025 cycle exists)"
            - "Inventory recalculated to CURRENT; trajectory_status == ON_TRACK (actual reduction 100.0% >= required 10.0% - 2.0)"
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Plant", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE1_STATIONARY", region_code: "GLOBAL", unit: "therm", value_tco2e_per_unit: 0.5, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f_fuel: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f_fuel}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/questionnaire-responses", payload: { cycle_id: "${cyc}", framework: "CDP" }, as: DisclosureLead, as_user_id: "lead-1", captures: { qr: $.data.id } }
            - { call: "POST /sustainability/questionnaire-responses/${qr}/answers", payload: { section_key: "GOVERNANCE", answer_text: "Board oversight" }, as: DisclosureLead, as_user_id: "lead-1" }
            - { call: "POST /sustainability/questionnaire-responses/${qr}/answers", payload: { section_key: "RISKS", answer_text: "Transition risk register" }, as: DisclosureLead, as_user_id: "lead-1" }
            - { call: "POST /sustainability/questionnaire-responses/${qr}/answers", payload: { section_key: "EMISSIONS", answer_text: "Inventory summary" }, as: DisclosureLead, as_user_id: "lead-1" }
            - { call: "POST /sustainability/questionnaire-responses/${qr}/answers", payload: { section_key: "TARGETS", answer_text: "50 by 2030" }, as: DisclosureLead, as_user_id: "lead-1" }
            - { call: "POST /sustainability/targets", payload: { name: "50-by-2030", base_year: 2025, target_year: 2030, reduction_pct: 50, scope_coverage: "SCOPE1_2_3", base_year_total_tco2e: 1000 }, as: SustainabilityManager, captures: { tgt: $.data.id } }
            - { call: "POST /sustainability/targets/${tgt}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/targets/${tgt}/transition", payload: { to_state: "ACTIVE" }, as: SustainabilityManager }
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { cyc_v: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${cyc_v}" }, as: SustainabilityManager }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f_fuel}", activity_type: "STATIONARY_FUEL", quantity: 100, unit: "therm", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { rec: $.data.id } }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
          trigger:
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /sustainability/inventory-results", payload: { cycle_id: "${cyc}" }, as: SustainabilityManager, captures: { inv_status: "$.data[0].status" } }
            - { call: "GET /sustainability/targets/${tgt}", as: SustainabilityManager, captures: { traj: $.data.trajectory_status } }
            - { call: "GET /sustainability/questionnaire-responses/${qr}", as: SustainabilityManager, captures: { stale: $.data.emissions_section_stale } }
          assert:
            - "hop 1: InventoryResult.status == STALE after the approval"
            - "hop 2: EmissionTarget.trajectory_status == NOT_EVALUATED (was ON_TRACK before the approval)"
            - "hop 3: QuestionnaireResponse.emissions_section_stale == true (was false before the approval)"

      - name: retirement_cascade_inventory_target_questionnaire
        grounds:
          - state_machines.RenewableInstrument.PROCURED_to_RETIRED
          - state_machines.InventoryResult.CURRENT_to_STALE
          - entities.EmissionTarget.fields.trajectory_status
          - entities.QuestionnaireResponse.fields.emissions_section_stale
        distinguishing_aspect: |
          Same depth-3 downstream shape but a DIFFERENT originating trigger:
          instrument RETIRE -> InventoryResult STALE -> target NOT_EVALUATED
          -> questionnaire stale, proving the cascade is triggered by more
          than one transition.
        test_recipe:
          setup:
            - "Site Alpha CA; PUBLISHED SCOPE2_GRID CA = 0.4 and SCOPE2_RESIDUAL_MIX CA = 0.5; cycle FY2026 in DATA_COLLECTION"
            - "One APPROVED ELECTRICITY record 100 MWh; inventory recalculated CURRENT (market 50.00, scope1+market = 50.0)"
            - "ACTIVE target coverage SCOPE1_2 base 1000 -> ON_TRACK (actual 95.0% >= 8.0%)"
            - "CDP questionnaire fully answered, emissions_section_stale == false"
            - "One PROCURED instrument 30 MWh vintage 2026"
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Alpha", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE2_GRID", region_code: "CA", unit: "MWh", value_tco2e_per_unit: 0.4, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f_grid: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f_grid}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE2_RESIDUAL_MIX", region_code: "CA", unit: "MWh", value_tco2e_per_unit: 0.5, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f_res: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f_res}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/questionnaire-responses", payload: { cycle_id: "${cyc}", framework: "CDP" }, as: DisclosureLead, as_user_id: "lead-1", captures: { qr: $.data.id } }
            - { call: "POST /sustainability/questionnaire-responses/${qr}/answers", payload: { section_key: "GOVERNANCE", answer_text: "Board oversight" }, as: DisclosureLead, as_user_id: "lead-1" }
            - { call: "POST /sustainability/questionnaire-responses/${qr}/answers", payload: { section_key: "RISKS", answer_text: "Risk register" }, as: DisclosureLead, as_user_id: "lead-1" }
            - { call: "POST /sustainability/questionnaire-responses/${qr}/answers", payload: { section_key: "EMISSIONS", answer_text: "Inventory summary" }, as: DisclosureLead, as_user_id: "lead-1" }
            - { call: "POST /sustainability/questionnaire-responses/${qr}/answers", payload: { section_key: "TARGETS", answer_text: "50 by 2030" }, as: DisclosureLead, as_user_id: "lead-1" }
            - { call: "POST /sustainability/targets", payload: { name: "50-by-2030", base_year: 2025, target_year: 2030, reduction_pct: 50, scope_coverage: "SCOPE1_2", base_year_total_tco2e: 1000 }, as: SustainabilityManager, captures: { tgt: $.data.id } }
            - { call: "POST /sustainability/targets/${tgt}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/targets/${tgt}/transition", payload: { to_state: "ACTIVE" }, as: SustainabilityManager }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f_grid}", activity_type: "ELECTRICITY", quantity: 100, unit: "MWh", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { rec: $.data.id } }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { cyc_v: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${cyc_v}" }, as: SustainabilityManager }
            - { call: "POST /sustainability/instruments", payload: { registry: "M-RETS", serial_number: "S-200", technology: "WIND", vintage_year: 2026, quantity_mwh: 30 }, as: SustainabilityManager, captures: { inst: $.data.id } }
          trigger:
            - { call: "POST /sustainability/instruments/${inst}/retire", payload: { cycle_id: "${cyc}", site_id: "${site}" }, as: SustainabilityManager }
            - { call: "GET /sustainability/inventory-results", payload: { cycle_id: "${cyc}" }, as: SustainabilityManager, captures: { inv_status: "$.data[0].status" } }
            - { call: "GET /sustainability/targets/${tgt}", as: SustainabilityManager, captures: { traj: $.data.trajectory_status } }
            - { call: "GET /sustainability/questionnaire-responses/${qr}", as: SustainabilityManager, captures: { stale: $.data.emissions_section_stale } }
          assert:
            - "hop 1: InventoryResult.status == STALE after the retirement"
            - "hop 2: EmissionTarget.trajectory_status == NOT_EVALUATED (was ON_TRACK after the pre-retirement recalc)"
            - "hop 3: QuestionnaireResponse.emissions_section_stale == true (was false)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict: (state vs business_temporal)
  # vs (business_safety vs business_referential) — DIFFERENT category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: create_record_state_beats_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_CYCLE_NOT_COLLECTING]
          - errors[ERR_PERIOD_OUTSIDE_CYCLE_YEAR]
        distinguishing_aspect: |
          state (priority 6) vs business_temporal (priority 9): one request
          violates both (cycle still DRAFT AND period in 2025 outside cycle
          year 2026) and the state error ERR_CYCLE_NOT_COLLECTING must win.
        test_recipe:
          setup:
            - "PUBLISHED SCOPE1_STATIONARY factor GLOBAL = 0.5 with a window covering mid-2025; active site; cycle FY2026 left in DRAFT (never opened)"
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Plant", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE1_STATIONARY", region_code: "GLOBAL", unit: "therm", value_tco2e_per_unit: 0.5, library_version: 1, valid_from: "2025-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f_fuel: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f_fuel}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
          trigger:
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f_fuel}", activity_type: "STATIONARY_FUEL", quantity: 10, unit: "therm", period_start: "2025-06-01T00:00:00Z", period_end: "2025-07-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CYCLE_NOT_COLLECTING (state priority 6 beats business_temporal priority 9, although the 2025 period is also outside cycle year 2026)"

      - name: approve_record_safety_beats_referential
        grounds:
          - validations[priority=7]
          - validations[priority=16]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_FACTOR_NOT_PUBLISHED]
        distinguishing_aspect: |
          business_safety (priority 7) vs business_referential (priority 16):
          the approval violates both (approver is the same person as the
          submitter AND the factor was RETIRED after submission) and
          ERR_SEGREGATION_OF_DUTIES must win; a different approver then
          surfaces ERR_FACTOR_NOT_PUBLISHED. Different category pair from the
          state-vs-temporal instance.
        test_recipe:
          setup:
            - "Cycle FY2026 in DATA_COLLECTION; record qty 10 (< 1000, so no evidence gate) created and submit-reviewed by steward-1; the record's factor is RETIRED afterwards"
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Plant", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE1_STATIONARY", region_code: "GLOBAL", unit: "therm", value_tco2e_per_unit: 0.5, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f_fuel: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f_fuel}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f_fuel}", activity_type: "STATIONARY_FUEL", quantity: 10, unit: "therm", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { rec: $.data.id } }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/emission-factors/${f_fuel}/transition", payload: { to_state: "RETIRED" }, as: SustainabilityManager }
          trigger:
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "steward-1", captures: { err1: $.data.error_id } }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1", captures: { err2: $.data.error_id } }
          assert:
            - "first attempt (approver user == submitted_by user steward-1): error_id == ERR_SEGREGATION_OF_DUTIES (priority 7 beats priority 16)"
            - "second attempt (different approver analyst-1): error_id == ERR_FACTOR_NOT_PUBLISHED (referential leg now fires unopposed)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check: readiness 80.0 (>=) vs baseline shift
  # 5.0 (>=) — DIFFERENT metrics, DIFFERENT endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: readiness_threshold_exactly_80_passes
        grounds:
          - calculations.assurance_readiness_pct
          - validations[priority=15]
          - errors[ERR_READINESS_BELOW_THRESHOLD]
        distinguishing_aspect: |
          Boundary metric readiness_pct on the cycle-transition endpoint:
          300/500 = 60.0 fails begin-assurance; adding one more verified
          evidence makes 400/500 = 80.0 exactly, which PASSES (>= semantics).
        test_recipe:
          setup:
            - "Cycle FY2026; five APPROVED STATIONARY_FUEL records of 100 therm each (total 500; each qty < 1000 so no evidence gate on approval)"
            - "VERIFIED evidence on records 1-3 (covered 300 -> readiness 60.0); inventory CURRENT; cycle LOCKED"
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Plant", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
