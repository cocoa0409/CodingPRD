            - call: "POST /licenses/${lic_id}/negotiation-rounds"
              payload: { party: "LICENSOR", proposed_fee_cents: 430000, expected_license_version: "${v7}" }
              as: RightsHolderRep
              as_user_id: "${arch_id}"
          assert:
            - "the first six trigger calls each return 201; the seventh returns 409 with error_id ERR_NEGOTIATION_ROUND_LIMIT"
            - "License.${lic_id}.round_count == 6 (unchanged by the rejected seventh attempt)"
            - "License.${lic_id}.status == COUNTERED and License.${lic_id}.current_proposed_fee_cents == 420000"
            - "GET /licenses/${lic_id}/negotiation-rounds returns exactly 6 rows with round_number 1,2,3,4,5,6 in that order"
            - "license_status_after over those six rows reads QUOTED, COUNTERED, QUOTED, COUNTERED, QUOTED, COUNTERED — QUOTED is entered three separate times"
            - "License.${lic_id}.version == 7 and License.${lic_id}.executed_fee_cents is null"

      - name: asset_parallel_dimensions_advance_independently
        grounds:
          - state_machines.Asset.PENDING_to_BLOCKED
          - state_machines.Asset.IN_NEGOTIATION_to_CLEARED
          - entities.Asset.fields.licensing_status
          - entities.Asset.fields.depiction_status
          - calculations.production_clearance_posture
          - state_machines.SubjectRelease.SIGNED_to_APPROVAL_WITHHELD
        distinguishing_aspect: |
          Not a cycle but PARALLEL DIMENSIONS on one entity: dimension A (licensing_status) and
          dimension B (depiction_status) advance on disjoint triggers and disjoint state names, so
          the asset ends in the combined state (CLEARED, BLOCKED) — licensing complete yet the
          production's posture forced to BLOCKED by dimension B alone, with the asset counters
          untouched.
        test_recipe:
          setup:
            - "A production in status CLEARANCE with one 45-second ARCHIVAL_FOOTAGE asset created WITH depiction_subject_key, so dimension B starts at PENDING while dimension A starts at UNCLEARED."
            - "That asset has a SELECTED AVAILABLE candidate and one EXECUTED FOOTAGE licence, so dimension A has already reached CLEARED (rights_basis LICENSED) while dimension B is still PENDING and the posture is RESTRICTED."
            - "One DEPICTION_AGREEMENT SubjectRelease for that asset with approval_rights FINAL_APPROVAL, already SENT and SIGNED."
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Two Dimensions", delivery_deadline_date: "2027-10-31" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "POST /archives"
              payload: { name: "Pathe Vault", holder_type: "FILM_ARCHIVE" }
              as: ArchiveResearcher
              captures: { arch_id: $.data.id }
            - call: "POST /archives/${arch_id}/rate-cards"
              payload: { base_rate_per_30s_cents: 60000, minimum_fee_cents: 150000, festival_minimum_fee_cents: 40000, effective_from_date: "2026-01-01" }
              as: ArchiveResearcher
              captures: { rc_id: $.data.id }
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Interview outtake", timecode_in_seconds: 0, timecode_out_seconds: 45, usage_purpose: "CRITICAL_COMMENTARY", depiction_subject_key: "subject-halloran" }
              as: ArchiveResearcher
              captures: { asset_id: $.data.id }
            - call: "POST /assets/${asset_id}/source-candidates"
              payload: { archive_id: "${arch_id}", availability_status: "AVAILABLE" }
              as: ArchiveResearcher
              captures: { cand_id: $.data.id }
            - call: "POST /assets/${asset_id}/select-source"
              payload: { source_candidate_id: "${cand_id}" }
              as: ArchiveResearcher
            - call: "POST /licenses"
              payload: { production_id: "${prod_id}", asset_id: "${asset_id}", archive_id: "${arch_id}", rights_leg: "FOOTAGE", media: "BROADCAST", territory: "WORLD", window_class: "ALL_MEDIA_WINDOW", term_months: 36, term_start_date: "2026-08-15", term_end_date: "2029-08-15" }
              as: ClearanceSupervisor
              captures: { lic_id: $.data.id, lic_v: $.data.version }
            - call: "POST /licenses/${lic_id}/negotiation-rounds"
              payload: { party: "LICENSOR", proposed_fee_cents: 362250, expected_license_version: "${lic_v}" }
              as: RightsHolderRep
              as_user_id: "${arch_id}"
            - call: "POST /licenses/${lic_id}/state"
              payload: { to_status: "EXECUTED" }
              as: ClearanceSupervisor
            - call: "POST /productions/${prod_id}/subject-releases"
              payload: { subject_person_key: "subject-halloran", release_type: "DEPICTION_AGREEMENT", depiction_from_date: "1964-03-01", depiction_to_date: "1964-09-30", asset_id: "${asset_id}", approval_rights: "FINAL_APPROVAL" }
              as: ProductionAdmin
              captures: { rel_id: $.data.id }
            - call: "POST /subject-releases/${rel_id}/state"
              payload: { to_status: "SENT" }
              as: ProductionAdmin
            - call: "POST /subject-releases/${rel_id}/state"
              payload: { to_status: "SIGNED" }
              as: ProductionAdmin
          trigger:
            - call: "POST /subject-releases/${rel_id}/state"
              payload: { to_status: "APPROVAL_WITHHELD", cut_reference: "rough-cut-4", reason: "Subject objects to sequence" }
              as: ProductionAdmin
          assert:
            - "Asset.${asset_id}.licensing_status == CLEARED — dimension A is not disturbed by the dimension-B transition"
            - "Asset.${asset_id}.depiction_status == BLOCKED (was PENDING; SIGNED alone did NOT set OBTAINED because approval_rights != NONE)"
            - "Asset.${asset_id}.rights_basis == LICENSED and Asset.${asset_id}.lapse_count == 0"
            - "Production.${prod_id}.cleared_asset_count == 1 and Production.${prod_id}.open_asset_count == 0 and Production.${prod_id}.asset_count == 1"
            - "Production.${prod_id}.posture == BLOCKED — forced by dimension B alone even though every licensing counter says the film is fully cleared"
            - "SubjectRelease.${rel_id}.status == APPROVAL_WITHHELD (a terminal state) and cut_reference == rough-cut-4"

  - rule_id: transitive_cascade
    instances:

      - name: rights_sweep_expiry_cascades_five_hops_to_eo_remediation
        grounds:
          - calculations.rights_sweep_epoch
          - state_machines.License.ACTIVE_to_EXPIRED
          - state_machines.Asset.CLEARED_to_LAPSED
          - state_machines.DeliveryPackage.DELIVERED_to_SUSPENDED
          - state_machines.EOApplication.BOUND_to_REMEDIATION_REQUIRED
          - state_machines.Production.LOCKED_to_CLEARANCE
          - state_machines.ClearanceChart.PINNED_to_STALE
          - calculations.production_clearance_posture
          - calculations.production_committed_fee_ledger
        distinguishing_aspect: |
          A CLOCK-driven cascade of five causally-chained hops in one request, each hop's input
          being the previous hop's output: License EXPIRED -> Asset LAPSED -> Production posture
          BLOCKED -> DeliveryPackage SUSPENDED -> EOApplication REMEDIATION_REQUIRED (plus the
          LOCKED -> CLEARANCE revert and the chart flipping STALE). Skipping any hop leaves an
          observably different final state, and the licence transits EXECUTED -> ACTIVE -> EXPIRED
          inside the SAME sweep, so hop order is itself under test.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-20T00:00:00Z."
            - "A production with one 45-second ARCHIVAL_FOOTAGE asset, CLEARED by one EXECUTED 12-month FOOTAGE licence (term 2026-08-15 to 2027-08-15, executed_fee_cents 258750); posture OPEN and committed_fee_cents 258750."
            - "A PINNED ClearanceChart with that one row, a BOUND EOApplication against it, a DELIVERED DeliveryPackage against it, and the production in status LOCKED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ClearanceSupervisor
            - call: "POST /productions"
              payload: { title: "Lapse Chain", delivery_deadline_date: "2027-05-31" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "POST /archives"
              payload: { name: "Pathe Vault", holder_type: "FILM_ARCHIVE" }
              as: ArchiveResearcher
              captures: { arch_id: $.data.id }
            - call: "POST /archives/${arch_id}/rate-cards"
              payload: { base_rate_per_30s_cents: 60000, minimum_fee_cents: 150000, festival_minimum_fee_cents: 40000, effective_from_date: "2026-01-01" }
              as: ArchiveResearcher
              captures: { rc_id: $.data.id }
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Harbour aerials", timecode_in_seconds: 0, timecode_out_seconds: 45, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
              captures: { asset_id: $.data.id }
            - call: "POST /assets/${asset_id}/source-candidates"
