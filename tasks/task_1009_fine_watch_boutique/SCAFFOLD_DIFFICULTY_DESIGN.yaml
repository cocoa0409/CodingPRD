          - entities.ServiceTicket.fields.appt_start
          - errors[ERR_WATCHMAKER_UNAVAILABLE]
        distinguishing_aspect: |
          Watchmaker bench uses half-open intervals plus a 30-minute buffer: a ticket starting 15 min
          after an existing ticket's end (12:15 after 12:00) is rejected ERR_WATCHMAKER_UNAVAILABLE,
          while a start exactly 30 min after (12:30) is allowed. Resource = Watchmaker.
