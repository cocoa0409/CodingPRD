      - name: corner_val_mapping_rejection_demands_a_reason_of_at_least_ten_characters
        claim_type: Violation -> Error
        grounds:
          - validations[priority=31]
          - errors[ERR_REJECTION_REASON_REQUIRED]
          - state_machines.DataElementMapping.PROPOSED_to_REJECTED
        distinguishing_aspect: |
          Only the negative decision carries the burden: REJECT with the reason omitted and REJECT
          with a 9-character reason both fail, while APPROVE needs no reason at all — so the
          requirement is decision-conditional, not a plain required-field check on the endpoint.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 exists with FederalDefinition EF_ATTENDANCE_STATUS (value_domain [FULL_TIME, PART_TIME], not required) and a PROPOSED SIS mapping onto it."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id }
            - call: "POST /ir/federal-definitions"
              payload: { definition_code: "EF_ATTENDANCE_STATUS", survey_component: "ENROLLMENT", value_domain: ["FULL_TIME", "PART_TIME"], required: false, unit_of_measure: "CODE", effective_cycle_code: "IPEDS-2027" }
              as: DataSteward
              captures: { fd: $.data.id }
            - call: "POST /ir/element-mappings"
              payload: { cycle_id: "${cyc}", definition_id: "${fd}", local_system_code: "SIS", local_field_path: "SIS.ENROLL.LOAD_CODE", transform_expression: "CASE WHEN x >= 12 THEN 'FT' ELSE 'PT' END", value_map: { FT: "FULL_TIME", PT: "PART_TIME" } }
              as: IRAnalyst
              captures: { map1: $.data.id }
          trigger:
            - call: "POST /ir/element-mappings/${map1}/validate"
              payload: { decision: "REJECT" }
              as: DataSteward
              as_user_id: "steward-1"
              captures: { err1: $.data.error_id }
            - call: "POST /ir/element-mappings/${map1}/validate"
              payload: { decision: "REJECT", rejection_reason: "too short" }
              as: DataSteward
              as_user_id: "steward-1"
              captures: { err2: $.data.error_id }
            - call: "POST /ir/element-mappings/${map1}/validate"
              payload: { decision: "APPROVE" }
              as: DataSteward
              as_user_id: "steward-1"
          assert:
            - "First call: HTTP status == 422 and response.error_id == \"ERR_REJECTION_REASON_REQUIRED\""
            - "Second call: HTTP status == 422 and response.error_id == \"ERR_REJECTION_REASON_REQUIRED\" (9 characters is below the 10-character floor)"
            - "DataElementMapping.${map1}.status == PROPOSED, rejection_reason is null, validated_by_user_id is null, version == 1"
            - "Third call: HTTP status == 200, status == VALIDATED, version == 2 (APPROVE carries no reason requirement)"

      - name: corner_val_material_restatement_needs_a_public_notice_and_a_rejection_needs_a_reason
        claim_type: Violation -> Error
        grounds:
          - validations[priority=28]
          - validations[priority=31]
          - calculations.restatement_materiality
