            - "Link 1 - after 0101 reaches CLOSED, StorePosition.${p1_id}.assortment_status == EXITED (stock_status stays STOCKOUT; the dimensions are independent)"
            - "Link 2 - Item.${item_id}.broken_store_count == 0 (the EXITED position no longer counts) and size_out_store_count == 0"
            - "Link 3 - Item.${item_id}.lifecycle_state == ACTIVE, back from BROKEN, with no stock movement anywhere"
            - "AssortmentAction.${a1_id}.status is still PENDING - only a position returning to COMPLETE supersedes an action, and EXITED is not COMPLETE"
            - "Store.${s1_id}.status == CLOSED and StorePosition.${p2_id} is untouched (COMPLETE, IN_STOCK)"
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: program_locked_state_beats_benefit_ratio_fiscal_gate
        grounds:
          - validations[priority:9]
          - validations[priority:34]
          - calculations.transfer_benefit_ratio_bp
          - errors.ERR_PROGRAM_LOCKED
          - errors.ERR_BENEFIT_RATIO_BELOW_THRESHOLD
        distinguishing_aspect: |
          The same approve request violates a state rule at priority 9 and a fiscal rule at priority 34
          at the same time: the program is LOCKED and the recommendation's benefit_ratio_bp of 15536 is
          below the program's 20000 threshold. Priority ordering is falsifiable here because unlocking
          changes the answer from ERR_PROGRAM_LOCKED to ERR_BENEFIT_RATIO_BELOW_THRESHOLD without
          touching the transfer at all.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE with stores 0101(A,URBAN,freight 41.00,sell-through 6500), 0102(B,URBAN,freight 38.00,5800), 0103(C,SUBURBAN,freight 42.00,4200)"
            - "Shelf plans effective 2026-07-01 open-ended: 0101 capacity 48 / pmin 12, 0102 capacity 24 / pmin 8, 0103 capacity 15 / pmin 8"
            - "SizeProfile TOP-4SZ = S 2000 / M 3500 / L 3000 / XL 1500 with core_size_min_share_bp 1500, so all four sizes are CORE; SKU-1001 retail 36.50"
            - "Positions: 0101 holds 4 units (S 0, M 3, L 1, XL 0) with min 12 / max 48 -> LOW + BROKEN; 0102 holds 30 units (S 8, M 10, L 8, XL 4) with min 8 / max 24 -> OVERSTOCK + COMPLETE; 0103 holds 5 units (S 1, M 2, L 1, XL 1) with min 4 / max 20 -> IN_STOCK + COMPLETE"
            - "The program was created with transfer_min_ratio_bp = 20000, above the 15536bp this transfer achieves"
            - "A 6-unit rebalance 0102 -> 0101 is PROPOSED (benefit 78.30, landed 50.40, ratio 15536)"
