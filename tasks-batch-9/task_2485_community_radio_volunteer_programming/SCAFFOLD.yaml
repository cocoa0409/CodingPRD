    path: "/compliance-incidents/{incidentId}/adjudicate"
    entity: ComplianceIncident
    purpose: "Substantiate or dismiss the complaint. Substantiation charges the penalty points to the show, may tip its standing to WATCH or RESTRICTED, suspends the spot at issue and applies the volunteer sanction. The officer who cleared the spot's copy may not adjudicate it."
    roles: [ComplianceOfficer]
    input: [finding]
    output: ComplianceIncident
    status: 200
    errors: [ERR_VALIDATION, ERR_SEGREGATION_OF_DUTIES, ERR_INVALID_STATE, ERR_INCIDENT_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: POST
    path: "/compliance-incidents/{incidentId}/remediate"
    entity: ComplianceIncident
    purpose: "Close out a substantiated incident: refund exactly the charged penalty points, walk the show's standing back down and reinstate a suspended volunteer to PROBATION. Preempted occupations are not restored automatically."
