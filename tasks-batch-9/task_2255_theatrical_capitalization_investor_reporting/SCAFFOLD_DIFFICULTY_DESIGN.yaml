# Difficulty design notes
# Difficulty instances for the theatrical capitalization / investor reporting domain.
# Every instance below starts from an empty database and includes the full structured
# setup_api_calls chain needed to reach its trigger state. The default logical clock is
# 2026-08-01T00:00:00Z; any instance that depends on "now" moves it explicitly with
# POST /_clock/set_current_utc.
# 
# Shared numeric fixture ("BASE") reused by most instances:
#   Theatre           seat_count 1200, top_ticket_price_cents 19900, changeover_buffer_days 3
#                     -> capacity_gross_cents = 1200 * 19900 * 8 = 191,040,000
#   OperatingBudget   weekly_fixed_running_cost_cents 32,000,000, variable_cost_pct 0.0500,
#                     performances_per_week 8
#   RoyaltyParticipants  RP1 0.0400 / 4 pts / min 400,000
#                        RP2 0.0200 / 3 pts / min 250,000
#                        RP3 0.0150 / 2 pts / min 150,000
#                     -> fixed_gross_pct total 0.0750, pool_points total 9,
#                        aggregate pool floor 800,000
#   WeeklyWrap W1     week_ending 2026-09-06, performances 8, gross 65,000,000,
#                     paid_attendance 8,200, running_expenses 33,500,000
#                     -> variable_cost 3,250,000; adjusted_gross 61,750,000;
#                        royalty_base 61,750,000 - 33,500,000 = 28,250,000;
#                        POOL pool = round(28,250,000 * 0.3500) = 9,887,500;
#                        weekly_operating_profit = 18,362,500;
#                        paid_capacity_pct = round(8200 / 9600, 4) = 0.8542
#   Role users        u-gm-1, u-gm-2 (GeneralManager); u-ct-1, u-ct-2 (Comptroller);
#                     u-sc-1 (SyndicationCounsel); u-lp-1 (LeadProducer);
#                     u-shared-1 (a user holding both GeneralManager and Comptroller)
scaffold_difficulty_design:
- rule_id: dual_variant_calc
  applies: true
  rationale: |
    Two independent dual-variant axes exist in §1.3. (a) wrap_settlement has variants
    FIXED_GROSS_BASIS and POOL_BASIS selected by Production.royalty_basis, so the same
    wrap numbers yield two different royalty charges and two different weekly operating
    profits. (b) recoupment_progress has variants CASH_BASIS and ACCRUAL_BASIS, which
    differ by deferred royalty owed and by subsidiary-rights receivable not yet
    allocated. Both axes are exercised with the same underlying figures so the delta is
    the only thing under test.
  instances:
  - name: wrap_settlement_fixed_gross_vs_pool_basis_delta
    grounds:
    - §1.1 Production.royalty_basis enum {FIXED_GROSS, POOL} default FIXED_GROSS
    - §1.1 RoyaltyParticipant.fixed_gross_pct and .pool_points
    - §1.3 wrap_settlement variants FIXED_GROSS_BASIS / POOL_BASIS
    - §1.5 POST /productions/{id}/convert-royalties-to-pool
    - §1.5 POST /weekly-wraps/{id}/certify
    distinguishing_aspect: |
      An implementation that hardcodes a single royalty formula cannot produce both
      4,631,250 (fixed gross: 65,000,000 * 0.0750) and 9,887,500 (pool: 35% of the
      28,250,000 royalty base) for wraps carrying identical grosses and expenses. The
      two weekly_operating_profit_cents values differ by exactly 5,256,250, and
      royalty_basis_applied must be frozen per wrap at certification so converting the
      production afterwards does not retroactively rewrite W1.
    test_recipe:
      setup:
      - |-
        One production still on FIXED_GROSS basis certifies W1 (week ending
        2026-09-06). The production is then converted to POOL basis and certifies W2
        (week ending 2026-09-13) with byte-identical gross, attendance and running
        expenses. Both wraps are read back and compared.
      setup_api_calls:
      - call: POST /theatres
        payload:
          name: Belasco House
          seat_count: 1200
          top_ticket_price_cents: 19900
          changeover_buffer_days: 3
        as: GeneralManager
        captures:
          th: $.data.id
      - call: POST /productions
        payload:
          title: The Ledger
          offering_entity_type: LP
          capitalization_target_cents: 120000000
          reserve_target_cents: 2000000
          theatre_id: ${th}
          pre_recoupment_pool_pct: 0.35
          post_recoupment_pool_pct: 0.4
          subsidiary_rights_investor_share_pct: 0.4
          closing_notice_min_days: 14
        as: GeneralManager
        captures:
          pr: $.data.id
      - call: POST /operating-budgets
        payload:
          production_id: ${pr}
          weekly_fixed_running_cost_cents: 32000000
          variable_cost_pct: 0.05
          performances_per_week: 8
        as: GeneralManager
        captures:
          ob: $.data.id
      - call: POST /operating-budgets/${ob}/activate
        payload: {}
        as: Comptroller
      - call: POST /royalty-participants
        payload:
          production_id: ${pr}
          participant_name: A. Author
          role: AUTHOR
          fixed_gross_pct: 0.04
          pool_points: 4
          min_guarantee_cents: 400000
        as: GeneralManager
        captures:
          rp1: $.data.id
      - call: POST /royalty-participants
        payload:
          production_id: ${pr}
          participant_name: C. Composer
          role: COMPOSER
          fixed_gross_pct: 0.02
          pool_points: 3
          min_guarantee_cents: 250000
        as: GeneralManager
        captures:
          rp2: $.data.id
      - call: POST /royalty-participants
        payload:
          production_id: ${pr}
          participant_name: D. Director
          role: DIRECTOR
          fixed_gross_pct: 0.015
          pool_points: 2
          min_guarantee_cents: 150000
        as: GeneralManager
        captures:
          rp3: $.data.id
      - call: POST /productions/${pr}/open-offering
        payload: {}
        as: SyndicationCounsel
      - call: POST /offering-documents
        payload:
          production_id: ${pr}
          doc_type: LP_AGREEMENT
          offering_amount_cents: 120000000
          unit_price_cents: 120000000
          max_investors: 5
          effective_date: '2026-08-01'
          expiration_date: '2026-12-31'
        as: SyndicationCounsel
        captures:
          od: $.data.id
      - call: POST /offering-documents/${od}/make-effective
        payload: {}
        as: SyndicationCounsel
      - call: POST /investors
        payload:
          legal_name: Iris Ivanov
          jurisdiction: NY
          contact_email: iris@example.com
        as: SyndicationCounsel
        captures:
          iv1: $.data.id
      - call: POST /investors/${iv1}/accredit
        payload:
          accreditation_status: ACCREDITED
        as: SyndicationCounsel
      - call: POST /subscriptions
        payload:
          offering_document_id: ${od}
          investor_id: ${iv1}
          units: 1
        as: Investor
        as_user_id: ${iv1}
        captures:
          sb1: $.data.id
      - call: POST /subscriptions/${sb1}/accept
        payload: {}
        as: SyndicationCounsel
      - call: POST /productions/${pr}/capitalize
        payload: {}
        as: Comptroller
      - call: POST /productions/${pr}/operating-status
        payload:
          to_status: REHEARSAL
        as: LeadProducer
      - call: POST /productions/${pr}/operating-status
        payload:
          to_status: PREVIEWS
        as: LeadProducer
      - call: POST /productions/${pr}/operating-status
        payload:
          to_status: RUNNING
        as: LeadProducer
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-07T00:00:00Z'
        as: GeneralManager
      - call: POST /weekly-wraps
        payload:
          production_id: ${pr}
          week_ending_date: '2026-09-06'
          performances: 8
          gross_receipts_cents: 65000000
          paid_attendance: 8200
          running_expenses_cents: 33500000
        as: GeneralManager
        captures:
          wr1: $.data.id
      - call: POST /weekly-wraps/${wr1}/submit
        payload: {}
        as: GeneralManager
        as_user_id: u-gm-1
      - call: POST /weekly-wraps/${wr1}/certify
        payload: {}
        as: Comptroller
        as_user_id: u-ct-1
      - call: POST /productions/${pr}/convert-royalties-to-pool
        payload: {}
        as: LeadProducer
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-14T00:00:00Z'
        as: GeneralManager
      - call: POST /weekly-wraps
        payload:
          production_id: ${pr}
          week_ending_date: '2026-09-13'
          performances: 8
          gross_receipts_cents: 65000000
          paid_attendance: 8200
          running_expenses_cents: 33500000
        as: GeneralManager
        captures:
          wr2: $.data.id
      - call: POST /weekly-wraps/${wr2}/submit
        payload: {}
        as: GeneralManager
        as_user_id: u-gm-1
      trigger:
      - call: POST /weekly-wraps/${wr2}/certify
        payload: {}
        as: Comptroller
        as_user_id: u-ct-1
      - call: GET /weekly-wraps/${wr1}
        as: GeneralManager
      - call: GET /weekly-wraps/${wr2}
        as: GeneralManager
      - call: GET /productions/${pr}
        as: GeneralManager
      assert:
      - 'GET /weekly-wraps/${wr1}: royalty_basis_applied == "FIXED_GROSS", royalty_pool_cents == 4631250, weekly_operating_profit_cents == 23618750'
      - 'GET /weekly-wraps/${wr2}: royalty_basis_applied == "POOL", royalty_pool_cents == 9887500, weekly_operating_profit_cents == 18362500'
      - 'Both wraps: variable_cost_cents == 3250000, adjusted_gross_cents == 61750000, royalty_base_cents == 28250000, capacity_gross_cents == 191040000, paid_capacity_pct == 0.8542'
      - wr1.weekly_operating_profit_cents - wr2.weekly_operating_profit_cents == 5256250
      - wr1.royalty_basis_applied is still "FIXED_GROSS" after the conversion (no retroactive rewrite)
      - 'GET /productions/${pr}: royalty_basis == "POOL", recouped_amount_cents == 41981250 (18362500 + 23618750), deferred_royalty_cents == 0'
  - name: recoupment_progress_cash_vs_accrual_basis_divergence
    grounds:
    - §1.3 recoupment_progress variants CASH_BASIS / ACCRUAL_BASIS
    - §1.1 Production.deferred_royalty_cents, .recouped_amount_cents, .recoupment_pct
    - §1.1 SubsidiaryRightsIncome.status {RECORDED, ALLOCATED}
    - §1.5 GET /productions/{id}/recoupment-report
    distinguishing_aspect: |
      The two variants disagree only when there is (a) deferred royalty accrued from a
      losing week and (b) subsidiary-rights income recorded but not yet allocated. With
      one profitable wrap (18,362,500), one losing wrap that defers the 800,000 pool
      floor, and a 5,000,000 RECORDED subsidiary-rights receipt whose investor share is
      40% (2,000,000), CASH_BASIS reports 18,362,500 / 0.1530 while ACCRUAL_BASIS
      reports 19,562,500 / 0.1630. An implementation that computes only one basis, or
      that adds the full 5,000,000 instead of the 40% investor share, or that adds
      rather than subtracts the deferred royalty, produces a different pair.
    test_recipe:
      setup:
      - |-
        BASE chain through certified POOL-basis W1 (profit 18,362,500). Clock advances
        to 2026-09-14; a losing W2 (week ending 2026-09-13, gross 30,000,000, paid
        attendance 4,000, running expenses 33,500,000) is certified, which accrues the
        800,000 aggregate pool floor as deferred royalty and contributes 0 profit.
        A 5,000,000 subsidiary-rights receipt is recorded and left in RECORDED.
