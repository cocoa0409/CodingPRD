  # =========================================================================
  # WRITES - firm, people, engagement performance and SQM risk assessment
  # =========================================================================
  - method: POST
    path: "/firms"
    description: "Register a public accounting firm. risk_posture starts STABLE, all counters 0, last_peer_review_rating NONE, prior_reviewer_ids empty, unassigned_review_flag false."
    roles: [SystemAdmin]
    code: 201
    input: [legal_name, state_code, aa_hours_last_year, "enrolled_program?", peer_review_year_end]
    output: Firm
    side_effects: ["creates Firm with version 1", "rejects a duplicate legal_name with ERR_VALIDATION_FAILED"]
  - method: PATCH
    path: "/firms/{firm_id}"
    description: "Committee maintenance of the firm's program record: annual A&A hours, program enrolment, peer review year-end, and the rotation history the committee carries forward from reviews performed outside this system."
    roles: [SystemAdmin, PeerReviewCommittee]
    code: 200
    input: ["aa_hours_last_year?", "enrolled_program?", "peer_review_year_end?", "prior_reviewer_ids?"]
    output: Firm
    side_effects: ["increments Firm.version by 1", "changes to aa_hours_last_year alter the peer_review_hours_scope base tier of any review whose scope is set afterwards", "prior_reviewer_ids feeds the rotation-exclusion clause of calculations.peer_reviewer_selection"]
  - method: POST
    path: "/firms/{firm_id}/partners"
    description: "Add a partner to the firm. eqr_eligible is computed from status, cpe_hours_last_3y and designations at every write."
    roles: [SystemAdmin, FirmManagingPartner]
    code: 201
    input: [full_name, cpa_license_state, "designations?", "industry_specializations?", "cpe_hours_last_3y?", "prior_engagement_team_clients?", "independence_conflict_client_names?", "status?"]
    output: Partner
    side_effects: ["creates Partner with firm_id from the path", "computes Partner.eqr_eligible"]
  - method: PATCH
    path: "/partners/{partner_id}"
    description: "Maintain a partner's designations, CPE record, cooling-off history, declared independence conflicts and employment status."
    roles: [SystemAdmin, FirmManagingPartner]
    code: 200
    input: ["designations?", "industry_specializations?", "cpe_hours_last_3y?", "prior_engagement_team_clients?", "independence_conflict_client_names?", "status?"]
    output: Partner
    side_effects: ["recomputes Partner.eqr_eligible", "increments Partner.version by 1", "never retroactively invalidates an existing EngagementQualityReview"]
  - method: POST
    path: "/engagements"
    description: "Accept a client engagement. Acceptance is refused outright while the firm's risk_posture is CRITICAL and the engagement_type is a must-select type."
    roles: [SystemAdmin, FirmManagingPartner, EngagementPartner]
    code: 201
    input: [firm_id, client_name, engagement_type, period_end, engagement_partner_id, "is_public_interest?", "is_first_year_client?", "prior_finding_count_3y?"]
    output: Engagement
    side_effects: ["runs calculations.engagement_risk_score then calculations.eqr_required_determination, writing Engagement.risk_score and eqr_required", "workflow_state PLANNING, file_state OPEN", "increments Partner.open_engagement_count", "rejects with ERR_ACCEPTANCE_FROZEN when firm.risk_posture == CRITICAL and engagement_type IN {ERISA_AUDIT, SINGLE_AUDIT, BROKER_DEALER}"]
  - method: POST
    path: "/engagements/{engagement_id}/workflow-transitions"
    description: "Advance the engagement-performance dimension (PLANNING -> FIELDWORK -> EQR_PENDING -> EQR_CLEARED -> REPORT_RELEASED, plus the EQR_PENDING revert cycle). Independent of file-transitions."
    roles: [SystemAdmin, EngagementPartner, FirmManagingPartner]
    code: 200
    input: [to_state]
    output: Engagement
    side_effects: ["writes Engagement.workflow_state", "sets report_release_date from the logical clock on REPORT_RELEASED", "requires a CONCURRED EngagementQualityReview before EQR_PENDING -> EQR_CLEARED when eqr_required is true (ERR_EQR_NOT_CONCURRED)", "decrements Partner.open_engagement_count on REPORT_RELEASED", "increments Engagement.version by 1"]
  - method: POST
    path: "/engagements/{engagement_id}/file-transitions"
    description: "Advance the documentation-assembly dimension (OPEN -> ASSEMBLED -> LOCKED). LOCKED is reachable only within 60 days of report_release_date."
    roles: [SystemAdmin, EngagementPartner, QualityControlDirector]
    code: 200
    input: [to_state]
    output: Engagement
    side_effects: ["writes Engagement.file_state", "rejects LOCKED beyond the 60-day assembly window with ERR_DOCUMENTATION_WINDOW_CLOSED", "increments Engagement.version by 1"]
  - method: POST
    path: "/engagements/{engagement_id}/quality-reviews"
    description: "Assign an engagement quality reviewer. Optimistic concurrency: expected_engagement_version must equal the engagement's current version, otherwise ERR_STALE_VERSION (412). The engagement must be in the EQR window (workflow_state IN {FIELDWORK, EQR_PENDING})."
    roles: [SystemAdmin, FirmManagingPartner, QualityControlDirector]
    code: 201
    input: [reviewer_partner_id, objectivity_attested, expected_engagement_version]
    output: EngagementQualityReview
    side_effects: ["runs calculations.eqr_reviewer_eligibility (ordered clauses; first failure decides the error) then calculations.eqr_reviewer_concurrency_window", "writes EngagementQualityReview.cooling_off_days_at_assignment and assigned_at from the logical clock", "state ASSIGNED", "increments Partner.open_eqr_count", "increments Engagement.version by 1"]
  - method: POST
    path: "/quality-reviews/{eqr_id}/transitions"
    description: "Drive the engagement quality review lifecycle: ASSIGNED -> IN_PROGRESS, IN_PROGRESS <-> CONCERNS_RAISED (non-linear revert cycle), IN_PROGRESS -> CONCURRED, and WITHDRAWN from either open state."
    roles: [SystemAdmin, EngagementQualityReviewer, FirmManagingPartner]
    code: 200
    input: [to_state, "concern_summary?"]
    output: EngagementQualityReview
    side_effects: ["writes state; increments concern_round_count and last_concern_summary on CONCERNS_RAISED", "cascades Engagement.workflow_state EQR_CLEARED -> EQR_PENDING on CONCERNS_RAISED", "sets concluded_at and Engagement.eqr_concurred_at on CONCURRED", "decrements Partner.open_eqr_count on CONCURRED and WITHDRAWN", "rejects CONCURRED while concerns are open with ERR_UNRESOLVED_CONCERNS", "increments EngagementQualityReview.version by 1"]
  - method: POST
    path: "/firms/{firm_id}/quality-risks"
    description: "Record a quality risk against an SQM component's quality objective. The risk is created in DRAFT and auto-advances to ASSESSED inside the same request once inherent_risk_score is computed."
    roles: [SystemAdmin, FirmManagingPartner, QualityControlDirector]
    code: 201
    input: [component, quality_objective_code, risk_statement, likelihood, impact]
    output: QualityRisk
    side_effects: ["computes inherent_risk_score = likelihood * impact", "state DRAFT -> ASSESSED within the create request", "rejects a duplicate (firm_id, component, quality_objective_code) with ERR_DUPLICATE_QUALITY_OBJECTIVE"]
  - method: POST
    path: "/quality-risks/{risk_id}/responses"
    description: "Design a response to the quality risk. The first response drives the risk ASSESSED -> RESPONDED."
    roles: [SystemAdmin, QualityControlDirector]
    code: 201
    input: [response_type, description]
    output: RiskResponse
    side_effects: ["status DESIGNED", "increments QualityRisk.response_count", "advances QualityRisk ASSESSED -> RESPONDED on the first response"]
  - method: POST
    path: "/risk-responses/{response_id}/effectiveness-tests"
    description: "Record the design and operating conclusions of an effectiveness test on a designed response, stamping tested_on from the logical clock. tested_on is the ascending sort key of the OPERATING_BASIS chronological fold."
    roles: [SystemAdmin, QualityControlDirector]
    code: 200
    input: [design_effectiveness, operating_effectiveness]
    output: RiskResponse
    side_effects: ["writes design_effectiveness, operating_effectiveness and tested_on", "status DESIGNED -> TESTED", "increments RiskResponse.version by 1"]
  - method: POST
    path: "/quality-risks/{risk_id}/evaluations"
    description: "Evaluate residual risk under the requested basis. DESIGN_BASIS folds design conclusions additively with a cap; OPERATING_BASIS folds tested conclusions multiplicatively in tested_on order and requires at least one TESTED response."
    roles: [SystemAdmin, QualityControlDirector, FirmManagingPartner]
    code: 200
    input: [basis]
    output: QualityRisk
    side_effects: ["runs calculations.residual_risk_score; writes residual_risk_score, severity_band and evaluation_basis", "state RESPONDED -> EVALUATED", "recomputes Firm.critical_risk_count and runs calculations.firm_risk_posture", "rejects OPERATING_BASIS with no TESTED response via ERR_NO_TESTED_RESPONSE", "increments QualityRisk.version by 1"]
  # =========================================================================
  # WRITES - internal inspection programme, findings, RCA and remediation
  # =========================================================================
  - method: POST
    path: "/firms/{firm_id}/internal-inspections"
    description: "Open an internal inspection cycle for a calendar year."
    roles: [SystemAdmin, QualityControlDirector, FirmManagingPartner]
    code: 201
    input: [inspection_year, target_engagement_count]
    output: InternalInspection
    side_effects: ["creates InternalInspection in PLANNING", "rejects a duplicate (firm_id, inspection_year) with ERR_DUPLICATE_INSPECTION_YEAR"]
  - method: POST
    path: "/internal-inspections/{inspection_id}/selections"
    description: "Run the deterministic engagement selector for the cycle. The server - not the caller - picks the engagements: must-select by type, then partner coverage, then risk-based fill up to target_engagement_count."
    roles: [SystemAdmin, QualityControlDirector]
    code: 201
    input: []
    output: InternalInspection
    side_effects: ["runs calculations.inspection_engagement_selection, creating InspectionSelection rows with selection_reason, is_must_select and selected_rank", "runs calculations.must_select_coverage_pct writing must_select_eligible_count, must_select_selected_count and must_select_coverage_pct", "sets Partner.last_inspected_year for every selected engagement's partner", "state PLANNING -> SELECTION_COMPLETE", "an empty eligible pool creates no rows, leaves engagements_selected_count 0 and coverage 100.00", "increments InternalInspection.version by 1"]
  - method: POST
    path: "/internal-inspections/{inspection_id}/transitions"
    description: "Advance the inspection cycle: SELECTION_COMPLETE -> IN_PROGRESS, IN_PROGRESS -> FINDINGS_CLASSIFIED (which requires severity_index_basis and computes the severity index), FINDINGS_CLASSIFIED -> CONCLUDED."
    roles: [SystemAdmin, QualityControlDirector, FirmManagingPartner]
    code: 200
    input: [to_state, "severity_index_basis?"]
    output: InternalInspection
    side_effects: ["on FINDINGS_CLASSIFIED runs calculations.deficiency_severity_index under the requested basis, writing InspectionSelection.weighted_points and InternalInspection.deficiency_severity_index", "rejects FINDINGS_CLASSIFIED while any finding is UNCLASSIFIED with ERR_UNCLASSIFIED_FINDINGS_PRESENT", "rejects CONCLUDED unless must_select_coverage_pct == 100.00 and no SIGNIFICANT_DEFICIENCY or MATERIAL_FAILURE finding is left unremediated", "sets concluded_at from the logical clock on CONCLUDED", "increments InternalInspection.version by 1"]
  - method: POST
    path: "/inspection-selections/{selection_id}/findings"
    description: "Raise a finding on an inspected engagement. Segregation of duties: the acting quality control director may not raise a finding on an engagement they personally led."
    roles: [SystemAdmin, QualityControlDirector]
    code: 201
    input: [title, sqm_component, "prior_cycle_recurrence?"]
    output: InspectionFinding
    side_effects: ["creates InspectionFinding in IDENTIFIED with classification UNCLASSIFIED", "increments InspectionSelection.finding_count", "requires the inspection to be IN_PROGRESS (ERR_INSPECTION_NOT_IN_PROGRESS) and the engagement to be REPORT_RELEASED (ERR_ENGAGEMENT_NOT_RELEASED)", "rejects a self-inspection with ERR_SEGREGATION_OF_DUTIES"]
  - method: POST
    path: "/inspection-findings/{finding_id}/classification"
    description: "Classify a finding. OBSERVATION withdraws it; DEFICIENCY and above advance it to RCA_PENDING. MATERIAL_FAILURE fires the five-link firm-wide cascade."
    roles: [SystemAdmin, QualityControlDirector, FirmManagingPartner]
    code: 200
    input: [classification, pervasiveness, affects_report_conclusion]
    output: InspectionFinding
    side_effects: ["writes classification, pervasiveness, affects_report_conclusion and class_points", "IDENTIFIED -> RCA_PENDING, or IDENTIFIED -> WITHDRAWN for OBSERVATION", "recomputes Firm.open_deficiency_count and open_material_failure_count", "MATERIAL_FAILURE cascade: link 2 drives the engagement's file_state LOCKED -> OPEN and increments reopened_count; link 3 drives the matching QualityRisk EVALUATED -> RESPONDED and increments its reopen_count; link 4 recomputes Firm.critical_risk_count and risk_posture; link 5 re-runs calculations.eqr_required_determination for the firm's open engagements", "rejects MATERIAL_FAILURE without affects_report_conclusion via ERR_MATERIAL_FAILURE_REQUIRES_REPORT_IMPACT", "increments InspectionFinding.version by 1"]
  - method: POST
    path: "/inspection-findings/{finding_id}/transitions"
    description: "Verify a remediated finding or reopen a verified one (VERIFIED <-> REOPENED cycle). Verification restores the firm's conserved open_deficiency_count; reopening consumes it again."
    roles: [SystemAdmin, QualityControlDirector, FirmManagingPartner]
    code: 200
    input: [to_state]
    output: InspectionFinding
    side_effects: ["REMEDIATED -> VERIFIED sets verified_at and decrements Firm.open_deficiency_count (and open_material_failure_count for a MATERIAL_FAILURE)", "VERIFIED -> REOPENED clears verified_at, increments reopen_count and restores both firm counters to their pre-verification values", "REOPENED -> REMEDIATION_ASSIGNED is driven by creating a superseding remediation plan, not by this endpoint", "recomputes calculations.firm_risk_posture", "rejects verification while the plan is incomplete with ERR_REMEDIATION_ACTIONS_INCOMPLETE, a repeat verification with ERR_FINDING_ALREADY_VERIFIED, and the plan owner acting as verifier with ERR_SEGREGATION_OF_DUTIES", "increments InspectionFinding.version by 1"]
  - method: POST
    path: "/inspection-findings/{finding_id}/root-cause-analyses"
    description: "Document a root cause analysis for a finding in RCA_PENDING."
    roles: [SystemAdmin, QualityControlDirector, EngagementPartner]
    code: 201
    input: [method, root_cause_category, contributing_factor_count, narrative]
    output: RootCauseAnalysis
    side_effects: ["creates RootCauseAnalysis in DRAFTED with depth_score 0.00", "the finding stays in RCA_PENDING until the analysis is validated"]
  - method: POST
    path: "/root-cause-analyses/{rca_id}/validation"
    description: "Validate or reject a drafted root cause analysis. Validation computes recurrence_flag and depth_score and advances the finding to RCA_COMPLETE."
    roles: [SystemAdmin, QualityControlDirector, FirmManagingPartner]
    code: 200
    input: [outcome]
    output: RootCauseAnalysis
    side_effects: ["runs calculations.root_cause_depth_score writing recurrence_flag and depth_score", "state DRAFTED -> VALIDATED (sets validated_at) or DRAFTED -> REJECTED", "on VALIDATED drives InspectionFinding RCA_PENDING -> RCA_COMPLETE", "rejects an rca whose finding_id differs from the finding it would advance with ERR_RCA_FINDING_MISMATCH", "increments RootCauseAnalysis.version by 1"]
  - method: POST
    path: "/inspection-findings/{finding_id}/remediation-plans"
    description: "Create a remediation plan against a VALIDATED root cause analysis. Optimistic concurrency: expected_finding_version must equal the finding's current version, otherwise ERR_STALE_VERSION (412). Creating a plan on a REOPENED finding supersedes the prior plan."
    roles: [SystemAdmin, QualityControlDirector, FirmManagingPartner]
    code: 201
    input: [root_cause_analysis_id, owner_partner_id, target_completion_date, action_count, action_specificity_score, expected_finding_version]
    output: RemediationPlan
    side_effects: ["creates RemediationPlan in DRAFTED with completed_action_count 0", "drives InspectionFinding RCA_COMPLETE -> REMEDIATION_ASSIGNED, or REOPENED -> REMEDIATION_ASSIGNED while driving the prior plan COMPLETED -> CLOSED", "rejects an unvalidated analysis with ERR_RCA_NOT_VALIDATED and an owner from another firm with ERR_PARTNER_FIRM_MISMATCH", "increments InspectionFinding.version by 1"]
  - method: POST
    path: "/remediation-plans/{plan_id}/transitions"
    description: "Drive the remediation plan lifecycle: DRAFTED -> SUBMITTED, SUBMITTED <-> RETURNED (rework cycle), SUBMITTED -> ACCEPTED, ACCEPTED -> COMPLETED. Submission scores the plan; acceptance is gated on that score."
    roles: [SystemAdmin, QualityControlDirector, FirmManagingPartner, EngagementPartner]
    code: 200
    input: [to_state, "completed_action_count?"]
    output: RemediationPlan
    side_effects: ["on SUBMITTED runs calculations.remediation_acceptance_score writing raw_completeness, completeness_tier and acceptance_score", "on RETURNED increments return_count", "on ACCEPTED sets accepted_at and drives InspectionFinding REMEDIATION_ASSIGNED -> REMEDIATED", "on COMPLETED requires completed_action_count == action_count", "rejects acceptance below 7.00 with ERR_ACCEPTANCE_SCORE_BELOW_THRESHOLD and the plan owner acting as acceptor with ERR_SEGREGATION_OF_DUTIES", "increments RemediationPlan.version by 1"]
  # =========================================================================
  # WRITES - peer review roster, scheduling, scope, fieldwork and remediation
  # =========================================================================
  - method: POST
    path: "/peer-reviewers"
    description: "Add a reviewer to the committee's roster."
    roles: [SystemAdmin, PeerReviewCommittee]
    code: 201
    input: [reviewer_firm_name, license_state, "accepts_out_of_state?", "qualified_categories?", "independence_conflict_firm_names?", "max_concurrent_reviews?", "experience_hours?", "status?"]
    output: PeerReviewer
    side_effects: ["creates PeerReviewer with active_review_count 0 and committed_hours_balance 0"]
  - method: PATCH
    path: "/peer-reviewers/{reviewer_id}"
    description: "Maintain a reviewer's qualifications, licensing reach, declared firm conflicts, concurrent-review cap and roster status."
    roles: [SystemAdmin, PeerReviewCommittee]
    code: 200
    input: ["accepts_out_of_state?", "qualified_categories?", "independence_conflict_firm_names?", "max_concurrent_reviews?", "experience_hours?", "status?"]
    output: PeerReviewer
    side_effects: ["increments PeerReviewer.version by 1", "never retroactively unassigns an existing PeerReview"]
  - method: POST
    path: "/firms/{firm_id}/peer-reviews"
    description: "Schedule a peer review cycle for the firm. Created in SCHEDULED with no reviewer, rating NONE and is_follow_up false; follow-up reviews are never created here - the corrective-action rejection cascade synthesizes them with prior_peer_review_id set."
    roles: [SystemAdmin, PeerReviewCommittee]
    code: 201
    input: [review_type, year_end, scheduled_window_start, scheduled_window_end]
    output: PeerReview
    side_effects: ["creates PeerReview in SCHEDULED with total_scope_hours and unallocated_hours null", "rejects scheduled_window_end <= scheduled_window_start with ERR_VALIDATION_FAILED"]
  - method: POST
    path: "/peer-reviews/{peer_review_id}/reviewer-assignment"
    description: "Assign the reviewer. With reviewer_id omitted the server runs the deterministic selector over the whole roster and a candidate that fails any eligibility clause is silently filtered out. With reviewer_id supplied the named candidate is validated clause by clause - independence (36), rotation (39), window conflict (43), roster status (49), licensing reach (50), capacity (51), must-select qualification (57) - in ascending §1.4 priority order, so each rejection surfaces its own error instead of collapsing into an empty pool."
    roles: [SystemAdmin, PeerReviewCommittee]
    code: 200
    input: ["reviewer_id?"]
    output: PeerReview
    side_effects: ["runs calculations.peer_reviewer_selection when reviewer_id is omitted", "writes PeerReview.assigned_reviewer_id, state SCHEDULED -> PLANNING, increments PeerReviewer.active_review_count and clears Firm.unassigned_review_flag", "an empty eligible pool leaves the review in SCHEDULED, sets Firm.unassigned_review_flag true and returns ERR_NO_ELIGIBLE_REVIEWER", "increments PeerReview.version by 1"]
  - method: POST
    path: "/peer-reviews/{peer_review_id}/scope"
    description: "Determine review scope. Computes the firm's must-select categories from its released engagements, then the tiered scope hours with the posture uplift."
    roles: [SystemAdmin, PeerReviewer, PeerReviewCommittee]
    code: 200
    input: []
    output: PeerReview
    side_effects: ["runs calculations.peer_review_hours_scope writing must_select_categories, total_scope_hours and unallocated_hours (equal at this point)", "state PLANNING -> SCOPE_SET", "re-checks the assigned reviewer's qualification for every must-select category (ERR_MUST_SELECT_CATEGORY_NOT_QUALIFIED)", "increments PeerReview.version by 1"]
  - method: POST
    path: "/peer-reviews/{peer_review_id}/selections"
    description: "Select an engagement into the review's scope and commit hours to it. Optimistic concurrency: expected_peer_review_version must equal the review's current version, otherwise ERR_STALE_VERSION (412)."
    roles: [SystemAdmin, PeerReviewer]
    code: 201
    input: [engagement_id, hours_committed, "is_scope_limitation?", expected_peer_review_version]
    output: PeerReviewSelection
    side_effects: ["creates PeerReviewSelection in COMMITTED, deriving must_select_category from the engagement", "debits PeerReview.unallocated_hours by hours_committed and credits PeerReviewer.committed_hours_balance by the same amount (conserved hours invariant: total_scope_hours == unallocated_hours + sum of COMMITTED hours_committed)", "increments PeerReview.scope_limitation_count when is_scope_limitation is true", "rejects an over-commitment with ERR_SCOPE_HOURS_EXCEEDED, a foreign engagement with ERR_ENGAGEMENT_FIRM_MISMATCH, a period_end after year_end with ERR_ENGAGEMENT_OUTSIDE_REVIEW_SCOPE and a repeat COMMITTED selection with ERR_DUPLICATE_SELECTION", "increments PeerReview.version by 1"]
  - method: DELETE
    path: "/peer-reviews/{peer_review_id}/selections/{selection_id}"
    description: "Withdraw a committed selection, releasing its hours back to the review. The conserved hours invariant must read identically before the selection was created and after it is withdrawn."
    roles: [SystemAdmin, PeerReviewer]
    code: 204
    input: []
    output: null
    side_effects: ["status COMMITTED -> WITHDRAWN (the row is retained, never deleted)", "credits PeerReview.unallocated_hours by hours_committed and debits PeerReviewer.committed_hours_balance by the same amount", "decrements PeerReview.scope_limitation_count when the selection was a scope limitation", "increments PeerReview.version by 1"]
  - method: POST
    path: "/peer-review-selections/{selection_id}/disposition"
    description: "Record the reviewer's conclusion on a selected engagement; the review's rating is derived from these dispositions."
    roles: [SystemAdmin, PeerReviewer]
    code: 200
    input: [disposition, non_conforming]
    output: PeerReviewSelection
    side_effects: ["writes disposition and non_conforming on a COMMITTED selection", "requires the review to be in FIELDWORK (ERR_INVALID_TRANSITION)", "increments PeerReviewSelection.version by 1"]
  - method: POST
    path: "/peer-reviews/{peer_review_id}/transitions"
    description: "Drive the peer review lifecycle: SCOPE_SET -> FIELDWORK, FIELDWORK -> RATING_DRAFTED (computes the rating), RATING_DRAFTED -> REPORT_ISSUED (forks on rating), REPORT_ISSUED -> ACCEPTED for a clean pass, and REMEDIATION_SUBMITTED -> ACCEPTED once every corrective action is accepted."
    roles: [SystemAdmin, PeerReviewCommittee, PeerReviewer]
    code: 200
    input: [to_state]
    output: PeerReview
    side_effects: ["FIELDWORK requires the firm's latest inspection to be CONCLUDED (ERR_INSPECTION_NOT_CONCLUDED) and every must-select category covered (ERR_MUST_SELECT_CATEGORY_NOT_COVERED)", "RATING_DRAFTED runs calculations.peer_review_rating writing rating and scope_limitation_count, and requires every COMMITTED selection to carry a disposition (ERR_SELECTION_DISPOSITION_MISSING)", "REPORT_ISSUED sets report_issued_at and, when rating != PASS, synthesizes CorrectiveActionPlan rows with action_code and due_date and forks to CORRECTIVE_ACTION_REQUIRED instead of staying open for direct acceptance", "ACCEPTED writes Firm.last_peer_review_rating, prepends the reviewer to Firm.prior_reviewer_ids, decrements PeerReviewer.active_review_count and recomputes calculations.firm_risk_posture", "rejects direct acceptance of a non-PASS report with ERR_CORRECTIVE_ACTION_OUTSTANDING and a second rating pass with ERR_PEER_REVIEW_ALREADY_RATED", "increments PeerReview.version by 1"]
  - method: POST
    path: "/corrective-action-plans/{cap_id}/evidence"
    description: "Firm submits remediation evidence for a required corrective action; must land on or before the due date."
    roles: [SystemAdmin, FirmManagingPartner, QualityControlDirector]
    code: 200
    input: [evidence_summary]
    output: CorrectiveActionPlan
    side_effects: ["writes evidence_summary and evidence_submitted_at from the logical clock, status REQUIRED -> EVIDENCE_SUBMITTED (also REJECTED -> EVIDENCE_SUBMITTED on resubmission)", "drives PeerReview CORRECTIVE_ACTION_REQUIRED -> REMEDIATION_SUBMITTED once every plan of the review has evidence", "rejects a late submission with ERR_CORRECTIVE_ACTION_PAST_DUE", "increments CorrectiveActionPlan.version by 1"]
  - method: POST
    path: "/corrective-action-plans/{cap_id}/disposition"
    description: "Committee accepts or rejects submitted evidence. A rejection fires the five-link follow-up cascade."
    roles: [SystemAdmin, PeerReviewCommittee]
    code: 200
    input: [outcome]
    output: CorrectiveActionPlan
    side_effects: ["ACCEPTED leaves the review in REMEDIATION_SUBMITTED until every plan is accepted, then the committee may transition it to ACCEPTED", "REJECTED increments rejection_count and fires the cascade: link 2 drives PeerReview REMEDIATION_SUBMITTED -> FOLLOW_UP_REQUIRED; link 3 creates a follow-up PeerReview in SCHEDULED with prior_peer_review_id set and is_follow_up true; link 4 writes Firm.last_peer_review_rating and re-runs calculations.firm_risk_posture; link 5 freezes must-select client acceptance at the firm (ERR_ACCEPTANCE_FROZEN)", "increments CorrectiveActionPlan.version by 1"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock, which every date and datetime rule in this scaffold reads instead of wall-clock time. Before any call the logical clock reads exactly the startup default 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [SystemAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["sets the logical clock consulted by the 60-day documentation window, the 730-day cooling-off gate, the lateness penalty of calculations.remediation_acceptance_score, the corrective-action due-date check and every *_at stamp", "no entity is mutated and no version is incremented"]

errors:
  # ---- authentication and authorisation ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header is missing or empty on any endpoint other than POST /firms."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The X-User-Role value is not listed in the target endpoint's roles."
  - id: ERR_ROLE_IDENTITY_UNKNOWN
    http: 403
    condition: "The role is entity_backed but X-User-ID does not resolve to a row of that role's backing entity."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity_backed actor operates on a resource it does not own - e.g. a PeerReviewer acting on a review whose assigned_reviewer_id is another reviewer, an EngagementQualityReviewer transitioning a review assigned to another partner, or a partner submitting a remediation plan they do not own."
  - id: ERR_CROSS_FIRM_ACCESS_DENIED
    http: 403
    condition: "A firm-scoped actor (FirmManagingPartner, QualityControlDirector, EngagementPartner, EngagementQualityReviewer) reads or writes a resource belonging to a different firm."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting partner would perform two duties compliance keeps apart: raising a finding on an engagement they led, or returning/accepting/verifying a remediation plan they own."
  - id: ERR_EQR_SELF_REVIEW
    http: 403
    condition: "The candidate engagement quality reviewer is the engagement partner of the engagement under review."
  # ---- not found ----
  - id: ERR_FIRM_NOT_FOUND
    http: 404
    condition: "No Firm exists with the given firm_id, whether in the path or in a request body."
  - id: ERR_PARTNER_NOT_FOUND
    http: 404
    condition: "No Partner exists with the given partner_id, engagement_partner_id, reviewer_partner_id or owner_partner_id."
  - id: ERR_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "No Engagement exists with the given engagement_id, whether in the path or in a selection body."
  - id: ERR_QUALITY_RISK_NOT_FOUND
    http: 404
    condition: "No QualityRisk exists with the given risk_id."
  - id: ERR_RISK_RESPONSE_NOT_FOUND
    http: 404
    condition: "No RiskResponse exists with the given response_id."
  - id: ERR_QUALITY_REVIEW_NOT_FOUND
    http: 404
    condition: "No EngagementQualityReview exists with the given eqr_id."
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "No InternalInspection exists with the given inspection_id."
  - id: ERR_INSPECTION_SELECTION_NOT_FOUND
    http: 404
    condition: "No InspectionSelection exists with the given selection_id."
  - id: ERR_FINDING_NOT_FOUND
    http: 404
    condition: "No InspectionFinding exists with the given finding_id."
  - id: ERR_RCA_NOT_FOUND
    http: 404
    condition: "No RootCauseAnalysis exists with the given rca_id or root_cause_analysis_id."
  - id: ERR_REMEDIATION_PLAN_NOT_FOUND
    http: 404
    condition: "No RemediationPlan exists with the given plan_id."
  - id: ERR_PEER_REVIEWER_NOT_FOUND
    http: 404
    condition: "No PeerReviewer exists with the given reviewer_id."
  - id: ERR_PEER_REVIEW_NOT_FOUND
    http: 404
    condition: "No PeerReview exists with the given peer_review_id or prior_peer_review_id."
  - id: ERR_PEER_REVIEW_SELECTION_NOT_FOUND
    http: 404
    condition: "No PeerReviewSelection exists with the given selection_id, or the selection is not attached to the peer_review_id in the path."
  - id: ERR_CORRECTIVE_ACTION_PLAN_NOT_FOUND
    http: 404
    condition: "No CorrectiveActionPlan exists with the given cap_id."
  # ---- payload shape ----
  - id: ERR_VALIDATION_FAILED
    http: 422
    condition: "A required field is missing, has the wrong type, or violates a declared field constraint (length, numeric range, date format, uniqueness of Firm.legal_name, or scheduled_window_end <= scheduled_window_start)."
  - id: ERR_INVALID_ENUM_VALUE
    http: 422
    condition: "An enum-typed field or filter carries a value outside its declared constraint set - including a to_state that is not a state of the target machine."
  - id: ERR_PAGINATION_OUT_OF_RANGE
    http: 422
    condition: "limit < 1, limit > 200 or offset < 0 on any list endpoint."
  - id: ERR_OBJECTIVITY_NOT_ATTESTED
    http: 422
    condition: "objectivity_attested is absent or false when assigning an engagement quality reviewer."
  - id: ERR_MATERIAL_FAILURE_REQUIRES_REPORT_IMPACT
    http: 422
    condition: "classification MATERIAL_FAILURE is submitted with affects_report_conclusion false."
  # ---- concurrency ----
  - id: ERR_STALE_VERSION
    http: 412
    condition: "An expected_<parent>_version input does not equal the parent row's current version: expected_engagement_version on quality-review creation, expected_finding_version on remediation-plan creation, expected_peer_review_version on peer-review-selection creation."
  # ---- state and lifecycle conflicts ----
  - id: ERR_INVALID_TRANSITION
    http: 409
    condition: "The requested to_state is not reachable from the row's current state in the relevant §1.2 machine, or a disposition is recorded while the peer review is not in FIELDWORK."
  - id: ERR_ENGAGEMENT_FILE_LOCKED
    http: 409
    condition: "A workflow-transition or file-transition is attempted on an engagement whose file_state is LOCKED."
  - id: ERR_ENGAGEMENT_NOT_IN_EQR_WINDOW
    http: 409
    condition: "An engagement quality reviewer is assigned while the engagement's workflow_state is not in {FIELDWORK, EQR_PENDING}."
  - id: ERR_UNRESOLVED_CONCERNS
    http: 409
    condition: "CONCURRED is requested on an engagement quality review that is still in CONCERNS_RAISED."
  - id: ERR_EQR_NOT_CONCURRED
    http: 409
    condition: "EQR_PENDING -> EQR_CLEARED is requested on an engagement with eqr_required true and no CONCURRED EngagementQualityReview."
  - id: ERR_INSPECTION_NOT_IN_PROGRESS
    http: 409
    condition: "A finding is raised on a cycle whose state is not IN_PROGRESS."
  - id: ERR_ENGAGEMENT_NOT_RELEASED
    http: 409
    condition: "A finding is raised on a selection whose engagement has not reached workflow_state REPORT_RELEASED."
  - id: ERR_UNCLASSIFIED_FINDINGS_PRESENT
    http: 409
    condition: "IN_PROGRESS -> FINDINGS_CLASSIFIED is requested while at least one finding of the cycle is still UNCLASSIFIED."
  - id: ERR_OPEN_SIGNIFICANT_FINDINGS
    http: 409
    condition: "FINDINGS_CLASSIFIED -> CONCLUDED is requested while a SIGNIFICANT_DEFICIENCY or MATERIAL_FAILURE finding is outside {REMEDIATION_ASSIGNED, REMEDIATED, VERIFIED}."
  - id: ERR_FINDING_ALREADY_VERIFIED
    http: 409
    condition: "VERIFIED is requested on a finding already in VERIFIED."
  - id: ERR_RCA_NOT_VALIDATED
    http: 409
    condition: "A remediation plan cites a RootCauseAnalysis whose state is not VALIDATED."
  - id: ERR_REMEDIATION_ACTIONS_INCOMPLETE
    http: 409
    condition: "ACCEPTED -> COMPLETED is requested with completed_action_count < action_count, or a finding is verified while its plan has not reached COMPLETED."
  - id: ERR_INSPECTION_NOT_CONCLUDED
    http: 409
    condition: "SCOPE_SET -> FIELDWORK is requested on a peer review while the firm's latest InternalInspection is not CONCLUDED (or the firm has none)."
  - id: ERR_SELECTION_DISPOSITION_MISSING
    http: 409
    condition: "FIELDWORK -> RATING_DRAFTED is requested while a COMMITTED selection still has disposition NONE."
  - id: ERR_PEER_REVIEW_ALREADY_RATED
    http: 409
    condition: "RATING_DRAFTED is requested on a peer review whose rating is already set."
  - id: ERR_CORRECTIVE_ACTION_OUTSTANDING
    http: 409
    condition: "REPORT_ISSUED -> ACCEPTED is requested on a review whose rating is not PASS, so corrective action is still outstanding."
  # ---- referential consistency across aggregates ----
  - id: ERR_PARTNER_FIRM_MISMATCH
    http: 409
    condition: "A named partner belongs to a different firm than the engagement, inspection or plan they are being attached to."
  - id: ERR_ENGAGEMENT_FIRM_MISMATCH
    http: 409
    condition: "An engagement selected into a peer review belongs to a different firm than the review."
  - id: ERR_RCA_FINDING_MISMATCH
    http: 409
    condition: "The cited RootCauseAnalysis.finding_id differs from the finding it is being applied to."
  # ---- independence, objectivity and eligibility ----
  - id: ERR_PARTNER_INACTIVE
    http: 409
    condition: "The candidate engagement quality reviewer has status INACTIVE."
  - id: ERR_CPE_REQUIREMENT_NOT_MET
    http: 409
    condition: "The candidate engagement quality reviewer lacks the EQ_REVIEWER designation or has cpe_hours_last_3y < 120."
  - id: ERR_COOLING_OFF_NOT_MET
    http: 409
    condition: "The candidate reviewer served on the client's engagement team fewer than 730 days before the engagement's period_end (exactly 730 passes)."
  - id: ERR_REVIEWER_INDEPENDENCE_CONFLICT
    http: 409
    condition: "The engagement's client_name is on the candidate partner's independence_conflict_client_names, or the firm's legal_name is on the named peer reviewer's independence_conflict_firm_names."
  - id: ERR_REVIEWER_ROTATION_REQUIRED
    http: 409
    condition: "The named peer reviewer is one of the firm's prior_reviewer_ids and must rotate off."
  - id: ERR_REVIEWER_SUSPENDED
    http: 409
    condition: "The named peer reviewer's roster status is not ACTIVE."
  - id: ERR_REVIEWER_STATE_NOT_LICENSED
    http: 409
    condition: "The named peer reviewer is licensed in another state and does not accept out-of-state work."
  - id: ERR_MUST_SELECT_CATEGORY_NOT_QUALIFIED
    http: 409
    condition: "The named or assigned peer reviewer's qualified_categories do not cover every must-select category the firm attracts."
  # ---- capacity, windows and uniqueness ----
  - id: ERR_EQR_CAPACITY_EXCEEDED
    http: 409
    condition: "The candidate reviewer already has 3 or more overlapping open engagement quality reviews (half-open intervals, zero buffer, adjacency permitted)."
  - id: ERR_EQR_ALREADY_ASSIGNED
    http: 409
    condition: "The engagement already has an EngagementQualityReview in {ASSIGNED, IN_PROGRESS, CONCERNS_RAISED}."
  - id: ERR_REVIEWER_AT_CAPACITY
    http: 409
    condition: "The named peer reviewer's active_review_count has reached max_concurrent_reviews."
  - id: ERR_REVIEWER_WINDOW_CONFLICT
    http: 409
    condition: "The named peer reviewer holds a pre-report review whose window, extended by the 5-day travel buffer at its end, overlaps this review's half-open window."
  - id: ERR_NO_ELIGIBLE_REVIEWER
    http: 409
    condition: "Auto-assignment found no PeerReviewer satisfying every eligibility clause; the review stays SCHEDULED and Firm.unassigned_review_flag becomes true."
  - id: ERR_NO_ELIGIBLE_ENGAGEMENTS
    http: 409
    condition: "SELECTION_COMPLETE -> IN_PROGRESS is requested on a cycle whose selector produced zero InspectionSelection rows."
  - id: ERR_DUPLICATE_SELECTION
    http: 409
    condition: "The engagement is already COMMITTED to this peer review."
  - id: ERR_DUPLICATE_INSPECTION_YEAR
    http: 409
    condition: "The firm already has an InternalInspection for that inspection_year."
  - id: ERR_DUPLICATE_QUALITY_OBJECTIVE
    http: 409
    condition: "The firm already has a QualityRisk with the same (component, quality_objective_code)."
  - id: ERR_DUPLICATE_ENGAGEMENT
    http: 409
    condition: "The firm already has an Engagement with the same (client_name, period_end)."
  - id: ERR_MUST_SELECT_CATEGORY_NOT_COVERED
    http: 409
    condition: "SCOPE_SET -> FIELDWORK is requested while a category in must_select_categories has no COMMITTED selection."
  - id: ERR_MUST_SELECT_COVERAGE_INCOMPLETE
    http: 409
    condition: "FINDINGS_CLASSIFIED -> CONCLUDED is requested while must_select_coverage_pct < 100.00 (a cycle with zero must-select-eligible engagements reads exactly 100.00 and passes)."
  - id: ERR_NO_TESTED_RESPONSE
    http: 409
    condition: "OPERATING_BASIS evaluation is requested on a risk with no RiskResponse in status TESTED."
  # ---- temporal windows ----
  - id: ERR_DOCUMENTATION_WINDOW_CLOSED
    http: 409
    condition: "LOCKED is requested more than 60 days after the engagement's report_release_date, measured on the logical clock."
  - id: ERR_CORRECTIVE_ACTION_PAST_DUE
    http: 409
    condition: "Corrective-action evidence is submitted after the plan's due_date, measured on the logical clock."
  - id: ERR_ENGAGEMENT_OUTSIDE_REVIEW_SCOPE
    http: 409
    condition: "The selected engagement's period_end falls after the peer review's year_end."
  # ---- fiscal and acceptance gates ----
  - id: ERR_SCOPE_HOURS_EXCEEDED
    http: 409
    condition: "hours_committed exceeds the peer review's unallocated_hours."
  - id: ERR_ACCEPTANCE_SCORE_BELOW_THRESHOLD
    http: 409
    condition: "SUBMITTED -> ACCEPTED is requested on a remediation plan whose acceptance_score is below 7.00 (exactly 7.00 is accepted)."
  - id: ERR_ACCEPTANCE_FROZEN
    http: 409
    condition: "A must-select engagement type (ERISA_AUDIT, SINGLE_AUDIT, BROKER_DEALER) is accepted while the firm's risk_posture is CRITICAL."

# §1.7 - segregation-of-duties role model. The firm-side roles are all backed by
# Partner rows, so "the same person may not do step A and step B" is decided by
# comparing X-User-ID against the resource's partner foreign keys; the two
# programme-side roles are opaque operators.
roles:
  - name: SystemAdmin
    description: "Platform operator. Registers firms, drives the logical clock and may exercise every business endpoint for setup and recovery purposes."
    identity: "opaque"
    exclusive_operations:
      - "POST /firms"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every other endpoint in §1.5, subject to the same §1.4 business rules as the role that normally performs it"
  - name: FirmManagingPartner
    description: "Partner charged with ultimate responsibility for the firm's system of quality management. Manages the partner roster, accepts clients, and answers to the peer review committee."
    identity: "entity_backed:Partner"
    exclusive_operations:
      - "POST /firms/{firm_id}/partners"
      - "PATCH /partners/{partner_id}"
    shared_operations:
      - "POST /engagements (with EngagementPartner)"
      - "POST /engagements/{engagement_id}/workflow-transitions (with EngagementPartner)"
      - "POST /engagements/{engagement_id}/quality-reviews (with QualityControlDirector)"
      - "POST /quality-reviews/{eqr_id}/transitions (with EngagementQualityReviewer)"
      - "POST /firms/{firm_id}/quality-risks, POST /quality-risks/{risk_id}/evaluations (with QualityControlDirector)"
      - "POST /firms/{firm_id}/internal-inspections, POST /internal-inspections/{inspection_id}/transitions (with QualityControlDirector)"
      - "POST /inspection-findings/{finding_id}/classification, POST /inspection-findings/{finding_id}/transitions, POST /inspection-findings/{finding_id}/remediation-plans, POST /root-cause-analyses/{rca_id}/validation, POST /remediation-plans/{plan_id}/transitions (with QualityControlDirector)"
      - "POST /corrective-action-plans/{cap_id}/evidence (with QualityControlDirector)"
      - "all firm-scoped reads, restricted to their own firm (ERR_CROSS_FIRM_ACCESS_DENIED otherwise)"
  - name: EngagementPartner
    description: "Partner with final responsibility for an individual engagement. Runs the engagement's performance and documentation lifecycle and owns remediation of findings raised against it - but may never review or inspect their own work."
    identity: "entity_backed:Partner"
    exclusive_operations: []
    shared_operations:
      - "POST /engagements (with FirmManagingPartner)"
      - "POST /engagements/{engagement_id}/workflow-transitions (with FirmManagingPartner)"
      - "POST /engagements/{engagement_id}/file-transitions (with QualityControlDirector)"
      - "POST /inspection-findings/{finding_id}/root-cause-analyses (with QualityControlDirector)"
      - "POST /remediation-plans/{plan_id}/transitions, limited to DRAFTED -> SUBMITTED and RETURNED -> SUBMITTED on a plan whose owner_partner_id is their own id (ERR_NOT_RESOURCE_OWNER otherwise); the acceptance and verification legs are barred by ERR_SEGREGATION_OF_DUTIES"
      - "reads of their own engagements, findings, analyses and plans"
  - name: QualityControlDirector
    description: "Partner who designs and monitors the system of quality management: quality risks and responses, the internal inspection programme, finding classification and remediation oversight. Cannot inspect an engagement they personally led."
    identity: "entity_backed:Partner"
    exclusive_operations:
      - "POST /quality-risks/{risk_id}/responses"
      - "POST /risk-responses/{response_id}/effectiveness-tests"
      - "POST /internal-inspections/{inspection_id}/selections"
      - "POST /inspection-selections/{selection_id}/findings"
    shared_operations:
      - "POST /engagements/{engagement_id}/quality-reviews (with FirmManagingPartner)"
      - "POST /engagements/{engagement_id}/file-transitions (with EngagementPartner)"
      - "POST /firms/{firm_id}/quality-risks, POST /quality-risks/{risk_id}/evaluations (with FirmManagingPartner)"
      - "POST /firms/{firm_id}/internal-inspections, POST /internal-inspections/{inspection_id}/transitions (with FirmManagingPartner)"
      - "POST /inspection-findings/{finding_id}/classification, POST /inspection-findings/{finding_id}/transitions, POST /inspection-findings/{finding_id}/root-cause-analyses, POST /root-cause-analyses/{rca_id}/validation, POST /inspection-findings/{finding_id}/remediation-plans, POST /remediation-plans/{plan_id}/transitions"
      - "POST /corrective-action-plans/{cap_id}/evidence (with FirmManagingPartner)"
  - name: EngagementQualityReviewer
    description: "Partner assigned to perform an engagement quality review. Acts only on the reviews assigned to them and only through the review's own lifecycle endpoint."
    identity: "entity_backed:Partner"
    exclusive_operations: []
    shared_operations:
      - "POST /quality-reviews/{eqr_id}/transitions on a review whose reviewer_partner_id is their own id (ERR_NOT_RESOURCE_OWNER otherwise), shared with FirmManagingPartner"
      - "reads of the engagement, partner and quality-review rows in scope of their assignment"
  - name: PeerReviewer
    description: "External reviewer from the committee's roster who performs the firm's peer review: scope determination, engagement selection, dispositions and the rating draft."
    identity: "entity_backed:PeerReviewer"
    exclusive_operations:
      - "POST /peer-reviews/{peer_review_id}/selections"
      - "DELETE /peer-reviews/{peer_review_id}/selections/{selection_id}"
      - "POST /peer-review-selections/{selection_id}/disposition"
    shared_operations:
      - "POST /peer-reviews/{peer_review_id}/scope (with PeerReviewCommittee)"
      - "POST /peer-reviews/{peer_review_id}/transitions, limited to the SCOPE_SET -> FIELDWORK and FIELDWORK -> RATING_DRAFTED legs on a review whose assigned_reviewer_id is their own id (ERR_NOT_RESOURCE_OWNER otherwise)"
      - "reads of the firm, its partners, engagements, quality risks and inspection history within the scope of their assigned review"
  - name: PeerReviewCommittee
    description: "Programme administrator of the peer review body. Maintains the reviewer roster, schedules reviews, assigns reviewers, issues reports and adjudicates corrective-action evidence. Never performs the fieldwork it adjudicates."
    identity: "opaque"
    exclusive_operations:
      - "POST /peer-reviewers"
      - "PATCH /peer-reviewers/{reviewer_id}"
      - "PATCH /firms/{firm_id}"
