              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { c_id: "$.data.id" }
            - call: "POST /disclosures"
              payload: { company_id: "${co_id}", disclosure_type: "GUIDANCE_UPDATE", fact_key: "FY2026-EPS-GUIDANCE", metric: "EPS", period_label: "FY2026", guidance_low: 2.00, guidance_high: 2.20, is_guidance: true }
              as: DisclosureOfficer
              as_user_id: "u_do_1"
              captures: { dis_id: "$.data.id" }
            - call: "POST /disclosures/${dis_id}/publish"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "u_do_1"
            - call: "POST /inquiries"
              payload: { company_id: "${co_id}", contact_id: "${c_id}", topic_category: "GUIDANCE", subject: "Does the FY2026 EPS range still hold?" }
              as: IRAnalyst
