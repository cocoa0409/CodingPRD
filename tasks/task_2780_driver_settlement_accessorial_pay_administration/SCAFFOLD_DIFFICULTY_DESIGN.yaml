            - "exactly 2 AccessorialClaim rows exist with driver_id == ${drv_r}"

  - rule_id: compensating_invariant
    instances:
      - name: escrow_principal_ledger_invariant_after_reversal
        grounds:
          - entities.EscrowTransaction.fields.amount_cents
          - entities.EscrowTransaction.fields.reverses_transaction_id
          - entities.Driver.fields.escrow_balance_cents
          - state_machines.Driver.FUNDED_to_COLLECTING
          - state_machines.Driver.COLLECTING_to_FUNDED
          - concurrency_rules[driver-escrow-deduction-stale]
          - validations[priority=31]
        distinguishing_aspect: |
          The invariant is the ESCROW PRINCIPAL LEDGER: Driver.escrow_balance_cents must always equal
          the signed sum of that driver EscrowTransaction rows. A permissible deduction of 1200 and
          its reversal are two APPEND-ONLY rows - the deduction row is never mutated or deleted - so
          the balance walks 3500 -> 2300 -> 3500 while the row count grows 1 -> 2 -> 3 and the sum
          returns to 3500 exactly.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "package PKG_S: LEASED_OPERATOR, PRACTICAL, per_diem_method NONE, escrow_required true, escrow_target_cents 3500, escrow_monthly_deduction_cents 40000, PER_MILE 58 and REVENUE_PERCENT 2500 bps"
            - "driver DRV_S assigned to PKG_S -> escrow COLLECTING at 0"
            - "load LOAD_S delivered 2026-08-04T18:00Z -> linehaul 46080"
            - "settlement STL_S over [2026-08-03T00:00:00Z, 2026-08-10T00:00:00Z) prepared by clerk-01 and approved by approver-01 at 2026-08-10T09:00Z, which deposits the capped 3500 and moves escrow_status to FUNDED"
            - "the current Driver.version is read right before each escrow write"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "Leased Escrow Ledger", driver_type: "LEASED_OPERATOR", mileage_guide: "PRACTICAL", per_diem_method: "NONE", escrow_required: true, escrow_target_cents: 3500, escrow_monthly_deduction_cents: 40000 }
              as: PayrollAdmin
              captures: { pkg_s: $.data.id }
            - call: "POST /driver-pay/pay-packages/${pkg_s}/components"
              payload: { component_type: "PER_MILE", unit: "MILE", rate_value: 58, sequence: 1 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_s}/components"
              payload: { component_type: "REVENUE_PERCENT", unit: "PERCENT_BPS", rate_value: 2500, sequence: 2 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_s}/activate"
              payload: {}
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers"
              payload: { legal_name: "Sam Sureties", driver_type: "LEASED_OPERATOR", home_state: "TX", per_diem_elected: false }
              as: PayrollAdmin
              captures: { drv_s: $.data.id }
            - call: "POST /driver-pay/drivers/${drv_s}/assign-pay-package"
              payload: { pay_package_id: "${pkg_s}" }
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers/${drv_s}/status"
              payload: { new_status: "ACTIVE" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads"
              payload: { driver_id: "${drv_s}", linehaul_revenue_cents: 180000, practical_miles: 780, hhg_miles: 742, stop_count: 1 }
              as: SettlementClerk
              captures: { load_s: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads/${load_s}/dispatch"
              payload: {}
              as: SettlementClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T18:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads/${load_s}/deliver"
              payload: {}
              as: SettlementClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/settlements"
              payload: { driver_id: "${drv_s}", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-10T00:00:00Z" }
              as: SettlementClerk
              captures: { stl_s: $.data.id }
            - call: "POST /driver-pay/settlements/${stl_s}/prepare"
              payload: {}
              as: SettlementClerk
              as_user_id: "clerk-01"
            - call: "POST /driver-pay/settlements/${stl_s}/approve"
              payload: {}
              as: SettlementApprover
              as_user_id: "approver-01"
            - call: "GET /driver-pay/drivers/${drv_s}"
              payload: {}
              as: PayrollAdmin
              captures: { drv_s_v1: $.data.version }
          trigger:
            - call: "POST /driver-pay/drivers/${drv_s}/escrow/deductions"
              payload: { amount_cents: 1200, reason_code: "TRACTOR_LEASE", document_ref: "doc://lease-inv-1200", expected_driver_version: "${drv_s_v1}" }
              as: PayrollAdmin
              as_user_id: "admin-01"
              captures: { txn_ded: $.data.id, bal_after_ded: $.data.balance_after_cents }
            - call: "POST /driver-pay/escrow-transactions/${txn_ded}/reverse"
              payload: { reason_code: "DEDUCTION_DISPUTED" }
              as: PayrollAdmin
              as_user_id: "admin-01"
              captures: { txn_rev: $.data.id, bal_after_rev: $.data.balance_after_cents }
          assert:
            - "EscrowTransaction.${txn_ded}.amount_cents == -1200 and EscrowTransaction.${txn_ded}.txn_type == PERMISSIBLE_DEDUCTION and EscrowTransaction.${txn_ded}.balance_after_cents == 2300"
            - "immediately after the deduction Driver.${drv_s}.escrow_balance_cents == 2300 and Driver.${drv_s}.escrow_status == COLLECTING"
            - "EscrowTransaction.${txn_rev}.amount_cents == 1200 and EscrowTransaction.${txn_rev}.txn_type == REVERSAL and EscrowTransaction.${txn_rev}.reverses_transaction_id == ${txn_ded}"
            - "EscrowTransaction.${txn_ded}.amount_cents is still -1200 after the reversal (append-only ledger, no mutation)"
            - "exactly 3 EscrowTransaction rows exist for driver_id == ${drv_s} with txn_types DEPOSIT, PERMISSIBLE_DEDUCTION and REVERSAL"
            - "the signed sum of amount_cents over those 3 rows == 3500 == Driver.${drv_s}.escrow_balance_cents"
            - "Driver.${drv_s}.escrow_status == FUNDED after the reversal"

      - name: wage_classification_identity_restored_on_void
        grounds:
          - calculations.per_diem_allocation
          - state_machines.Settlement.APPROVED_to_VOIDED
          - state_machines.Load.SETTLED_to_ACCRUED
          - entities.Driver.fields.ytd_gross_pay_cents
          - entities.Driver.fields.ytd_taxable_wages_cents
          - entities.Driver.fields.ytd_per_diem_non_taxable_cents
        distinguishing_aspect: |
          A different invariant over a different aggregate than the escrow ledger: the wage
          CLASSIFICATION identity ytd_gross_pay_cents == ytd_taxable_wages_cents +
          ytd_per_diem_non_taxable_cents must hold before, during and after a compensating void.
          Approval makes it 46080 == 32280 + 13800; voiding must decrement all three accumulators to
          zero and release the load rather than leaving the reclassified 13800 stranded.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "package PKG_T: LEASED_OPERATOR, PRACTICAL, per_diem_method DAY_BASED, escrow_required false, PER_MILE 58 and REVENUE_PERCENT 2500 bps"
            - "driver DRV_T assigned to PKG_T with per_diem_elected true"
            - "load LOAD_T dispatched 2026-08-03T08:00Z and delivered 2026-08-04T18:00Z (two calendar days out) -> linehaul 46080"
            - "settlement STL_T over [2026-08-03T00:00:00Z, 2026-08-10T00:00:00Z) prepared by clerk-01 and approved by approver-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "Leased Wage Identity", driver_type: "LEASED_OPERATOR", mileage_guide: "PRACTICAL", per_diem_method: "DAY_BASED", escrow_required: false }
              as: PayrollAdmin
              captures: { pkg_t: $.data.id }
            - call: "POST /driver-pay/pay-packages/${pkg_t}/components"
              payload: { component_type: "PER_MILE", unit: "MILE", rate_value: 58, sequence: 1 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_t}/components"
              payload: { component_type: "REVENUE_PERCENT", unit: "PERCENT_BPS", rate_value: 2500, sequence: 2 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_t}/activate"
              payload: {}
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers"
              payload: { legal_name: "Tess Taxable", driver_type: "LEASED_OPERATOR", home_state: "TX", per_diem_elected: true }
              as: PayrollAdmin
              captures: { drv_t: $.data.id }
            - call: "POST /driver-pay/drivers/${drv_t}/assign-pay-package"
              payload: { pay_package_id: "${pkg_t}" }
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers/${drv_t}/status"
              payload: { new_status: "ACTIVE" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads"
              payload: { driver_id: "${drv_t}", linehaul_revenue_cents: 180000, practical_miles: 780, hhg_miles: 742, stop_count: 1 }
              as: SettlementClerk
              captures: { load_t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads/${load_t}/dispatch"
              payload: {}
              as: SettlementClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T18:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads/${load_t}/deliver"
              payload: {}
              as: SettlementClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/settlements"
              payload: { driver_id: "${drv_t}", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-10T00:00:00Z" }
              as: SettlementClerk
              captures: { stl_t: $.data.id }
            - call: "POST /driver-pay/settlements/${stl_t}/prepare"
              payload: {}
              as: SettlementClerk
              as_user_id: "clerk-01"
            - call: "POST /driver-pay/settlements/${stl_t}/approve"
              payload: {}
              as: SettlementApprover
              as_user_id: "approver-01"
          trigger:
            - call: "POST /driver-pay/settlements/${stl_t}/void"
              payload: { void_reason_code: "CLERICAL_ERROR" }
              as: PayrollAdmin
              as_user_id: "admin-01"
          assert:
            - "before the void Settlement.${stl_t}.gross_pay_cents == 46080, per_diem_non_taxable_cents == 13800 and taxable_wages_cents == 32280"
            - "before the void Driver.${drv_t}.ytd_gross_pay_cents == 46080 == Driver.${drv_t}.ytd_taxable_wages_cents + Driver.${drv_t}.ytd_per_diem_non_taxable_cents (32280 + 13800)"
            - "after the void Settlement.${stl_t}.status == VOIDED and Settlement.${stl_t}.void_reason_code == CLERICAL_ERROR"
            - "after the void Driver.${drv_t}.ytd_gross_pay_cents == 0 and Driver.${drv_t}.ytd_taxable_wages_cents == 0 and Driver.${drv_t}.ytd_per_diem_non_taxable_cents == 0"
            - "the identity ytd_gross_pay_cents == ytd_taxable_wages_cents + ytd_per_diem_non_taxable_cents holds after the void"
            - "Load.${load_t}.pay_status == ACCRUED and Load.${load_t}.settlement_id == null"
            - "no EscrowTransaction row exists for driver_id == ${drv_t} because the package required no escrow"
