          - endpoints.POST_/credits/{id}/amendments
          - endpoints.POST_/amendments/{id}/issue
        distinguishing_aspect: |
          A1's change_set carries two keys but only one bites: amount_cents rises
          from 10000000 to 12000000 (an improvement, so no consent) while
          tolerance_pct is restated as its existing value 0 and must be ignored
          entirely rather than treated as a reduction. The recharge then prices
          only the 2000000 delta - 7500 flat plus 4000 for two remaining quarters
          at 10 bps - and commission_bps_applied stays at the 10 chosen at
          issuance rather than being re-selected. A2 reduces
          presentation_period_days from 21 to 15, which DOES require consent, so
          the credit parks in AMENDMENT_PENDING with presentation_period_days
          still 21 and its fee is the flat 7500 with no recharge because
          exposure_delta_cents is 0. An implementation that treats a no-op key as
          a change makes A1 consent-bearing; one that recharges on the whole new
          exposure prices A1's fee at 31500.
