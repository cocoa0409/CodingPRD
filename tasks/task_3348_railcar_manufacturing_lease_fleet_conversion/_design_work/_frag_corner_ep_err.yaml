              payload: { model_code: "CT-I", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 25, line_count_family: "LINE-I" }
              as: ProductionPlanner
              captures: { ct_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-I", component_class: "WHEELSET", unit_cost_cents: 1000, lead_time_days: 5 }
              as: SupplyChainCoordinator
              captures: { ws_id: $.data.id }
            - call: "POST /api/v1/components"
