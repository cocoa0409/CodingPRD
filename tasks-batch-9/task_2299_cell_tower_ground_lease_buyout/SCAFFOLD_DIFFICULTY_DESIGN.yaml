  - rule_id: non_linear_state_machine
    instances:
      - name: offer_counter_revise_cycle_bounded_by_negotiation_round_cap
        grounds:
          - state_machines.Offer.SENT_to_COUNTERED
          - state_machines.Offer.COUNTERED_to_SENT
          - entities.Deal.fields.negotiation_rounds
          - validations[priority=34]
        distinguishing_aspect: |
          The non-linearity here is a true cycle inside one entity's status field: Offer oscillates
          SENT -> COUNTERED -> SENT through COUNTER/REVISE, and the loop is terminated not by a state but
          by the Deal.negotiation_rounds counter reaching 3, so the fourth REVISE from COUNTERED is
          rejected while the offer remains in COUNTERED rather than moving to a terminal state.
        test_recipe:
          setup:
            - "A deal in NEGOTIATION with an offer already SENT once (Deal.negotiation_rounds is 1) and countered by the landowner, so the offer is COUNTERED."
            - "The pinned valuation's max_bid_cents is 46858362, so every revision below that clears the guardrail."
          setup_api_calls:
            - { call: "POST /lease-buyouts/portfolios", payload: { name: "Northeast Tower Aggregation", program_code: "NE-AGG-01", total_capital_cents: 50000000 }, as: PlatformAdmin, captures: { pf_id: $.data.id } }
