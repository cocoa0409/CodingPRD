# =============================================================================
# §1.9 Scaffold Corner Design — Community Choir & Ensemble Management
# Breadth coverage of testable claims §1.8 does not already cover.
# Logical clock default: 2026-08-01T00:00:00Z.
# Standard season payload literals: base 20000, early_bird 0.10 / cutoff
# 2026-08-15, dues_due 2026-09-01, late fee 500/wk cap 2000, pool 50000.
# Standard enroll chain: audition 8/7/9 -> composite 7.9; invoice provisional
# 18000 (issued 2026-08-01 <= cutoff); payment 18000 -> PAID -> member ACTIVE.
# =============================================================================
scaffold_corner_design:
  # ============================================================ entities
  - section: entities
    instances:
      - name: season_creation_applies_system_defaults
        claim_type: creation_and_defaults
        grounds: [entities.Season]
        distinguishing_aspect: "New season starts posture=DRAFT, ops_week_index=0, pool_available=50000, treasury=0, version=1, defaults for audition_slot_minutes and attendance_threshold applied."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
          trigger:
            - { call: "GET /v1/seasons/${s_id}", payload: {}, as: President }
          assert:
            - "Season.${s_id}.posture == DRAFT"
            - "Season.${s_id}.ops_week_index == 0"
            - "Season.${s_id}.pool_available_cents == 50000"
            - "Season.${s_id}.treasury_balance_cents == 0"
            - "Season.${s_id}.version == 1"
            - "Season.${s_id}.audition_slot_minutes == 30"
            - "Season.${s_id}.attendance_threshold == 0.75"

      - name: member_create_initial_state_and_computed_defaults
        claim_type: creation_and_defaults
        grounds: [entities.Member, state_machines.Member]
        distinguishing_aspect: "New member is APPLICANT with attendance_rate 1.0, performance_eligible false, dues_balance 0, ledger 0, section_id null."
        test_recipe:
          setup: ["season in OPEN posture"]
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President }
          trigger:
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "Ada", email: "ada@x.org" }, as: ChoirDirector, captures: { m_id: $.data.id } }
          assert:
            - "Member.${m_id}.status == APPLICANT"
            - "Member.${m_id}.attendance_rate == 1.0"
            - "Member.${m_id}.performance_eligible == false"
            - "Member.${m_id}.dues_balance_cents == 0 and ledger_balance_cents == 0"

      - name: member_create_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.Member.fields.attendance_rate, "validations[priority=5]"]
        distinguishing_aspect: "Sending the computed field attendance_rate in the create payload is rejected as an unknown field per ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["season OPEN"]
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President }
          trigger:
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "Ada", email: "ada@x.org", attendance_rate: 0.1 }, as: ChoirDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (computed/unknown input field rejected)"

      - name: member_get_nonexistent_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/members/11111111-1111-1111-1111-111111111111", payload: {}, as: President, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: section_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Section, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required target_max returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["season DRAFT"]
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
          trigger:
            - { call: "POST /v1/sections", payload: { season_id: "${s_id}", voice_part: "ALTO", target_min: 1 }, as: ChoirDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: section_create_invalid_enum_returns_invalid_enum
        claim_type: type_constraints
        grounds: [entities.Section.fields.voice_part, "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "voice_part 'SOPRANINO' is not a declared enum member -> ERR_INVALID_ENUM 400."
        test_recipe:
          setup: ["season DRAFT"]
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
          trigger:
            - { call: "POST /v1/sections", payload: { season_id: "${s_id}", voice_part: "SOPRANINO", target_min: 1, target_max: 2 }, as: ChoirDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_ENUM"

      - name: duplicate_email_returns_duplicate_membership
        claim_type: uniqueness_constraint
        grounds: ["validations[priority=11]", "errors[ERR_DUPLICATE_MEMBERSHIP]"]
        distinguishing_aspect: "Second member with the same email in the same season -> ERR_DUPLICATE_MEMBERSHIP 409."
        test_recipe:
          setup: ["season OPEN; member ada@x.org exists"]
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "Ada", email: "ada@x.org" }, as: ChoirDirector }
          trigger:
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "Ada Clone", email: "ada@x.org" }, as: ChoirDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_MEMBERSHIP"

      - name: duplicate_voice_part_returns_duplicate_section
        claim_type: uniqueness_constraint
        grounds: ["validations[priority=11]", "errors[ERR_DUPLICATE_SECTION]"]
        distinguishing_aspect: "Second SOPRANO section in the same season -> ERR_DUPLICATE_SECTION 409."
        test_recipe:
          setup: ["season DRAFT with one SOPRANO section"]
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/sections", payload: { season_id: "${s_id}", voice_part: "SOPRANO", target_min: 1, target_max: 2 }, as: ChoirDirector }
          trigger:
            - { call: "POST /v1/sections", payload: { season_id: "${s_id}", voice_part: "SOPRANO", target_min: 1, target_max: 3 }, as: ChoirDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_SECTION"

      - name: members_list_pagination_envelope
        claim_type: listing_pagination
        grounds: [response_envelope, endpoints.GET_/v1/members]
        distinguishing_aspect: "limit=2 over 3 members yields total_count 3 and has_more true; offset=2 yields exactly 1 item and has_more false."
        test_recipe:
          setup: ["season OPEN with 3 APPLICANT members"]
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "A", email: "a@x.org" }, as: ChoirDirector }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "B", email: "b@x.org" }, as: ChoirDirector }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "C", email: "c@x.org" }, as: ChoirDirector }
          trigger:
            - { call: "GET /v1/members?season_id=${s_id}&limit=2", payload: { season_id: "${s_id}", limit: 2 }, as: President }
            - { call: "GET /v1/members?season_id=${s_id}&limit=2&offset=2", payload: { season_id: "${s_id}", limit: 2, offset: 2 }, as: President }
          assert:
            - "First page: total_count == 3, has_more == true, 2 items"
            - "Second page: total_count == 3, has_more == false, 1 item"

  # ============================================================ state machines
  - section: state_machines
    instances:
      - name: decision_on_unscored_audition_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Audition, "errors[ERR_AUDITION_NOT_SCORED]"]
        distinguishing_aspect: "Decision on a SCHEDULED (unscored) audition fails with ERR_AUDITION_NOT_SCORED; member stays AUDITION_SCHEDULED."
        test_recipe:
          setup: ["season OPEN; member AUDITION_SCHEDULED"]
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/sections", payload: { season_id: "${s_id}", voice_part: "SOPRANO", target_min: 1, target_max: 2 }, as: ChoirDirector, captures: { sec_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "Ada", email: "ada@x.org" }, as: ChoirDirector, captures: { m_id: $.data.id } }
            - { call: "POST /v1/auditions", payload: { member_id: "${m_id}", scheduled_at: "2026-08-02T10:00:00Z" }, as: ChoirDirector, captures: { a_id: $.data.id } }
          trigger:
            - { call: "POST /v1/auditions/${a_id}/decision", payload: { decision: "ACCEPT", section_id: "${sec_id}" }, as: ChoirDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_AUDITION_NOT_SCORED"
            - "Member.${m_id}.status == AUDITION_SCHEDULED"

      - name: second_decision_on_decided_audition_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Member.AUDITIONED_to_REJECTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Audition already decided REJECTED; a second decision call fails with ERR_INVALID_STATE (terminal member lockdown)."
        test_recipe:
          setup: ["season OPEN; member REJECTED via scored audition + REJECT decision"]
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "Ada", email: "ada@x.org" }, as: ChoirDirector, captures: { m_id: $.data.id } }
            - { call: "POST /v1/auditions", payload: { member_id: "${m_id}", scheduled_at: "2026-08-02T10:00:00Z" }, as: ChoirDirector, captures: { a_id: $.data.id } }
            - { call: "POST /v1/auditions/${a_id}/score", payload: { tone_score: 8, pitch_score: 7, sight_score: 9 }, as: ChoirDirector }
            - { call: "POST /v1/auditions/${a_id}/decision", payload: { decision: "REJECT" }, as: ChoirDirector }
          trigger:
            - { call: "POST /v1/auditions/${a_id}/decision", payload: { decision: "REJECT" }, as: ChoirDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Member.${m_id}.status == REJECTED (unchanged)"

      - name: audition_cancel_returns_member_to_applicant
        claim_type: side_effect_execution
        grounds: [state_machines.Audition.SCHEDULED_to_CANCELLED, state_machines.Member.AUDITION_SCHEDULED_to_APPLICANT]
        distinguishing_aspect: "Cancel reverses the booking: audition CANCELLED, member back to APPLICANT; member can then re-book (APPLICANT loop)."
        test_recipe:
          setup: ["season OPEN; member AUDITION_SCHEDULED at 10:00"]
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "Ada", email: "ada@x.org" }, as: ChoirDirector, captures: { m_id: $.data.id } }
            - { call: "POST /v1/auditions", payload: { member_id: "${m_id}", scheduled_at: "2026-08-02T10:00:00Z" }, as: ChoirDirector, captures: { a_id: $.data.id } }
          trigger:
            - { call: "POST /v1/auditions/${a_id}/cancel", payload: {}, as: ChoirDirector }
            - { call: "POST /v1/auditions", payload: { member_id: "${m_id}", scheduled_at: "2026-08-02T10:00:00Z" }, as: ChoirDirector, captures: { a2: $.data.id } }
          assert:
            - "Audition.${a_id}.status == CANCELLED"
            - "Member reverted to APPLICANT before re-book"
            - "Re-book at the same slot succeeds: Audition.${a2}.status == SCHEDULED (cancelled slots free the buffer)"

      - name: audition_no_show_at_checkpoint
        claim_type: side_effect_execution
        grounds: [state_machines.Audition.SCHEDULED_to_NO_SHOW, "endpoints.POST_/v1/seasons/{id}/checkpoint"]
        distinguishing_aspect: "Checkpoint with clock past scheduled_at flips SCHEDULED audition to NO_SHOW and member back to APPLICANT."
        test_recipe:
          setup: ["season OPEN; member AUDITION_SCHEDULED at 2026-08-02; clock advanced to 2026-08-05"]
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President, captures: { sv: $.data.version } }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "Ada", email: "ada@x.org" }, as: ChoirDirector, captures: { m_id: $.data.id } }
            - { call: "POST /v1/auditions", payload: { member_id: "${m_id}", scheduled_at: "2026-08-02T10:00:00Z" }, as: ChoirDirector, captures: { a_id: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: President }
          trigger:
            - { call: "POST /v1/seasons/${s_id}/checkpoint", payload: { expected_season_version: "${sv}" }, as: President }
          assert:
            - "Audition.${a_id}.status == NO_SHOW"
            - "Member.${m_id}.status == APPLICANT"

      - name: rehearsal_attendance_before_held_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=12]", "errors[ERR_REHEARSAL_NOT_HELD]"]
        distinguishing_aspect: "Recording attendance while clock < scheduled_at fails with ERR_REHEARSAL_NOT_HELD."
        test_recipe:
          setup: ["season REHEARSING; one ACTIVE member; rehearsal scheduled 2026-08-26; clock still 2026-08-01"]
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/sections", payload: { season_id: "${s_id}", voice_part: "SOPRANO", target_min: 1, target_max: 2 }, as: ChoirDirector, captures: { sec_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "Ada", email: "ada@x.org" }, as: ChoirDirector, captures: { m_id: $.data.id } }
            - { call: "POST /v1/auditions", payload: { member_id: "${m_id}", scheduled_at: "2026-08-02T10:00:00Z" }, as: ChoirDirector, captures: { a_id: $.data.id } }
            - { call: "POST /v1/auditions/${a_id}/score", payload: { tone_score: 8, pitch_score: 7, sight_score: 9 }, as: ChoirDirector }
            - { call: "POST /v1/auditions/${a_id}/decision", payload: { decision: "ACCEPT", section_id: "${sec_id}" }, as: ChoirDirector }
            - { call: "POST /v1/dues-invoices", payload: { member_id: "${m_id}" }, as: Treasurer }
            - { call: "POST /v1/dues-payments", payload: { member_id: "${m_id}", amount_cents: 18000, method: "CARD" }, as: Treasurer }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "REHEARSING" }, as: President }
            - { call: "POST /v1/rehearsals", payload: { season_id: "${s_id}", scheduled_at: "2026-08-26T19:00:00Z" }, as: ChoirDirector, captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /v1/rehearsals/${r1}/attendance", payload: { records: [ { member_id: "${m_id}", status: "PRESENT" } ] }, as: ChoirDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REHEARSAL_NOT_HELD"
            - "Rehearsal.${r1}.status == SCHEDULED (unchanged)"

      - name: excuse_converts_unexcused_and_recomputes_rate
        claim_type: side_effect_execution
        grounds: [state_machines.AttendanceRecord.ABSENT_UNEXCUSED_to_ABSENT_EXCUSED, calculations.attendance_rate]
        distinguishing_aspect: "Excusal converts U to X and rate moves from 0.75 (3/4) to 0.9375 ((3+0.75)/4)."
        test_recipe:
          setup: ["season REHEARSING; ACTIVE member; 4 held rehearsals recorded P,P,P,U; clock 2026-08-27"]
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/sections", payload: { season_id: "${s_id}", voice_part: "SOPRANO", target_min: 1, target_max: 2 }, as: ChoirDirector, captures: { sec_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "Ada", email: "ada@x.org" }, as: ChoirDirector, captures: { m_id: $.data.id } }
            - { call: "POST /v1/auditions", payload: { member_id: "${m_id}", scheduled_at: "2026-08-02T10:00:00Z" }, as: ChoirDirector, captures: { a_id: $.data.id } }
            - { call: "POST /v1/auditions/${a_id}/score", payload: { tone_score: 8, pitch_score: 7, sight_score: 9 }, as: ChoirDirector }
            - { call: "POST /v1/auditions/${a_id}/decision", payload: { decision: "ACCEPT", section_id: "${sec_id}" }, as: ChoirDirector }
            - { call: "POST /v1/dues-invoices", payload: { member_id: "${m_id}" }, as: Treasurer }
            - { call: "POST /v1/dues-payments", payload: { member_id: "${m_id}", amount_cents: 18000, method: "CARD" }, as: Treasurer }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "REHEARSING" }, as: President }
            - { call: "POST /v1/rehearsals", payload: { season_id: "${s_id}", scheduled_at: "2026-08-05T19:00:00Z" }, as: ChoirDirector, captures: { r1: $.data.id } }
