          assert:
            - "DietaryNote.${note_id}.prep_minutes == 15 and Reservation.${res_id}.prep_minutes_total == 39"
            - "the first assign-table returns 422 with ${err_pending} == ERR_DIETARY_ACK_REQUIRED and leaves Reservation.${res_id}.assigned_table_id null"
            - "after the REJECT, DietaryNote.${note_id}.ack_status == PREP_REJECTED with reject_reason_code == CROSS_CONTAMINATION_RISK, amend_count == 0 and acked_by_user_id == ${r_id}"
            - "the second assign-table returns 422 with ${err_rejected} == ERR_DIETARY_NOTE_PREP_REJECTED, a different error from the first refusal of the identical request"
            - "after the amend, DietaryNote.${note_id}.ack_status == PENDING with amend_count == 1 and reject_reason_code null"
            - "after the ACCEPT, DietaryNote.${note_id}.ack_status == ACKED and it is a terminal state"
            - "the third assign-table succeeds: Reservation.${res_id}.assigned_table_id == ${tbl_id}, seat_from_utc == 2026-09-12T22:00:00Z, seat_to_utc == 2026-09-13T00:45:00Z"
            - "Reservation.${res_id}.prep_minutes_total is still 39 after the loop, since prep minutes ignore ack_status"

      - name: refund_exception_fork_with_disjoint_arms
        grounds:
          - state_machines.RefundException.status
          - endpoints.POST_/refund-exceptions/{id}/decide.side_effects
          - validations.priority_25_ERR_REFUND_EXCEPTION_ALREADY_DECIDED
          - validations.priority_26_ERR_REFUND_EXCEPTION_NOT_APPROVED
        distinguishing_aspect: |
          REQUESTED forks to two terminal states whose side-effect sets are
          disjoint rather than merely different: the APPROVED arm writes two
          ledger rows and re-derives the reservation's payment_status, while the
          DENIED arm writes nothing beyond the exception row, so every money
          field on the reservation is byte-identical before and after. Both
          arms then refuse a second decision, and the DENIED arm additionally
          blocks the downstream credit issuance. This is the disjoint-fork
          shape, not a cycle or a parallel dimension.
