        claim_type: error_triggerable
        grounds:
          - errors[ERR_ATTENDEE_HOUSING_RISK_HOLD]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / housing_risk_hold_beats_sub_block_eligibility_mismatch
          rationale: "The named §1.8 instance triggers ERR_ATTENDEE_HOUSING_RISK_HOLD as the winning rung of the conflicting pair."

  # ===================================================================================
  # SECTION 7 — RBAC
  # ===================================================================================
  - section: rbac
    instances:
      - name: bureau_controller_cannot_carve_sub_blocks
        claim_type: role_denied_exclusive_operation
        grounds:
          - rbac.BureauCoordinator.shared_operations
          - errors[ERR_UNAUTHORIZED]
          - validations[priority=20]
        distinguishing_aspect: "Carving is shared by BureauCoordinator and EventOrganizer only: the approving BureauController is refused with 403 ERR_UNAUTHORIZED even with a perfectly valid carve payload and a fresh block version."
        test_recipe:
          setup: ["CONTRACTED block of 10 rooms with no carves."]
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /housing/hotels"
              payload: { name: "Grand Plaza", distance_to_venue_miles: 0.3, room_tax_pct: 0.1475, total_rooms: 400 }
              as: BureauCoordinator
              captures: { hotel_id: $.data.id }
            - call: "POST /housing/hotel-blocks"
              payload: { event_id: "${event_id}", hotel_id: "${hotel_id}", contracted_rooms_per_night: 10, negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20 }
              as: BureauCoordinator
              captures: { block_id: $.data.id, block_v1: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/terms"
              payload: { negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20, expected_hotel_block_version: "${block_v1}" }
              as: BureauCoordinator
              captures: { block_v2: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/contract"
              payload: { confirmation_number: "CN-SUM26-040" }
              as: HotelManager
              as_user_id: "${hotel_id}"
              captures: { block_v3: $.data.version }
          trigger:
            - call: "POST /housing/hotel-blocks/${block_id}/sub-blocks"
              payload: { segment: "GENERAL", allotted_rooms: 3, expected_hotel_block_version: "${block_v3}" }
              as: BureauController
              as_user_id: "ctrl-1"
          assert:
            - "response HTTP status == 403"
            - "response.data.error_id == ERR_UNAUTHORIZED"
            - "HotelBlock.${block_id}.unassigned_rooms_per_night == 0"
            - "HotelBlock.${block_id}.version == ${block_v3}"
            - "GET /housing/sub-blocks filtered on hotel_block_id=${block_id} returns total_count == 0"

