              as: PlatformAdmin
              captures: { am_id: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
              payload: { full_name: "LC Sixteen", email: "lc16@x.com", contact_kind: "LANDLORD_COUNSEL" }
              as: PlatformAdmin
              captures: { lc_id: $.data.id }
            - call: "POST /portfolios/${pid}/leases"
              payload: { premises_label: "OF-16", rentable_square_feet: 5000, base_rent_cents_per_rsf_year: 4000, commencement_date: "2026-01-01T00:00:00Z", expiration_date: "2027-12-31T00:00:00Z", holdover_tier1_pct: 150, holdover_tier2_pct: 200 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { lid: $.data.id }
            - call: "POST /portfolios/${pid}/leases/${lid}/activate"
              payload: {}
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { l_ver2: $.data.version }
            - call: "POST /portfolios/${pid}/leases/${lid}/amendments"
              payload: { kind: "RENEWAL_TERM", new_expiration_date: "2032-12-31T00:00:00Z", new_base_rent_cents_per_rsf_year: 5500 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { aid1: $.data.id }
            - call: "POST /portfolios/${pid}/leases/${lid}/amendments/${aid1}/propose"
              payload: { expected_lease_version: "${l_ver2}" }
              as: AssetManager
              as_user_id: "${am_id}"
            - call: "GET /portfolios/${pid}/leases/${lid}"
              payload: {}
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { l_ver3: $.data.version }
            - call: "POST /portfolios/${pid}/leases/${lid}/amendments"
              payload: { kind: "EXPANSION_TERM", new_expiration_date: "2033-12-31T00:00:00Z", new_base_rent_cents_per_rsf_year: 5800 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { aid2: $.data.id }
          trigger:
            - call: "POST /portfolios/${pid}/leases/${lid}/amendments/${aid2}/propose"
              payload: { expected_lease_version: "${l_ver3}" }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NEGOTIATION_ALREADY_OPEN"
            - "Amendment.${aid2}.status remains DRAFT; Amendment.${aid1}.status remains PROPOSED"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: withdraw_restores_lease_version_delta_symmetric
        grounds:
          - state_machines.Option.AVAILABLE_to_WITHDRAWN
          - concurrency_rules[exercise-notice-stale-lease]
        distinguishing_aspect: |
          Conserved quantity: monetary ledger balance. Exercising then settling a
          FIXED option with exercise_fee_cents=0 posts no monetary entries, and
          withdrawing an unexercised option likewise posts no entries — the lease
          ledger balance is invariant (sum(amount_cents) == 0) across the
          create-then-withdraw action pair on the option lifecycle.
        test_recipe:
          setup:
            - "Portfolio P, AM contact; lease L ACTIVE; option O ROFR window [2026-08-01, 2026-12-31], exercise_fee_cents=0, missed_option_penalty_cents=0"
            - "Clock 2026-09-01; option withdrawn"
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "P17", region: "WEST", laddering_max_pct_per_year: 40 }
              as: PlatformAdmin
              captures: { pid: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
              payload: { full_name: "AM Seventeen", email: "am17@x.com", contact_kind: "ASSET_MANAGER" }
              as: PlatformAdmin
              captures: { am_id: $.data.id }
            - call: "POST /portfolios/${pid}/leases"
              payload: { premises_label: "OF-17", rentable_square_feet: 5000, base_rent_cents_per_rsf_year: 4000, commencement_date: "2026-01-01T00:00:00Z", expiration_date: "2027-12-31T00:00:00Z", holdover_tier1_pct: 150, holdover_tier2_pct: 200 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { lid: $.data.id }
            - call: "POST /portfolios/${pid}/leases/${lid}/activate"
              payload: {}
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { l_ver2: $.data.version }
            - call: "POST /portfolios/${pid}/leases/${lid}/options"
              payload: { option_type: "ROFR", notice_window_open_date: "2026-08-01T00:00:00Z", notice_window_close_date: "2026-12-31T00:00:00Z", target_commencement_date: "2027-06-01T00:00:00Z", rate_determination: "FIXED", fixed_rent_cents_per_rsf_year: 4000, exercise_fee_cents: 0, missed_option_penalty_cents: 0 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { oid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /portfolios/${pid}/leases/${lid}/options/${oid}/withdraw"
              payload: { expected_lease_version: "${l_ver2}" }
              as: AssetManager
              as_user_id: "${am_id}"
            - call: "GET /portfolios/${pid}/leases/${lid}/ledger"
              payload: {}
              as: AssetManager
              as_user_id: "${am_id}"
          assert:
            - "Option.${oid}.status == WITHDRAWN"
            - "Ledger total_count == 0 (create+withdraw pair conserves the zero monetary balance)"
            - "All reminders of option ${oid} are CANCELED or were never created outside window-open — PENDING count == 0"

      - name: holdover_enter_and_settle_conserves_accrual_identity
        grounds:
          - calculations.holdover_rent_accrual
          - state_machines.Lease.HOLDOVER_to_ACTIVE
        distinguishing_aspect: |
          Conserved quantity: holdover accrual identity. A lease entering HOLDOVER
          and later settling via a HOLDOVER_SETTLEMENT amendment must post a single
          AMENDMENT_SETTLEMENT entry equal to the accrued balance at settlement and
          reset accrued_holdover_rent_cents to 0 — the pair (accrue N days, settle)
          conserves sum(ledger) == final accrual with zero drift; the accrual
          counter resets exactly.
        test_recipe:
          setup:
            - "Portfolio P with AM, LC; lease L ACTIVE: RSF 10000, base 5000, tier1 150%, tier2 200%, tier1_days 90; expires 2026-12-31"
            - "Clock advanced to 2027-01-31 → lease entered HOLDOVER at 2027-01-01 and has accrued 30 days (30 * tier1_daily 205479 = 6164370)"
            - "HOLDOVER_SETTLEMENT amendment created, proposed, agreed — all AFTER the last clock advance so no accrual recompute bumps Lease.version between version capture and execute"
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "P18", region: "EAST", laddering_max_pct_per_year: 40 }
              as: PlatformAdmin
              captures: { pid: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
              payload: { full_name: "AM Eighteen", email: "am18@x.com", contact_kind: "ASSET_MANAGER" }
              as: PlatformAdmin
              captures: { am_id: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
