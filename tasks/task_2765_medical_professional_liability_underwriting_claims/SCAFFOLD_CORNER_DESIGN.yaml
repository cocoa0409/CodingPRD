            - "term create as ActuarialAnalyst response.status == 403 and error_id == ERR_UNAUTHORIZED"
            - "term create as UnderwritingOfficer response.status == 201"
            - "issuance as ComplianceOfficer response.status == 403 and error_id == ERR_UNAUTHORIZED"
            - "issuance as UnderwritingOfficer response.status == 200"
            - "Insured rows count == 1, the refused create left nothing behind"
            - "PolicyTerm rows for policy ${pol_a} count == 1"
            - "PolicyTerm.${term_a1}.status == IN_FORCE"
            - "Policy.${pol_a}.version == ${pol_a_v0} + 1, bumped once by the accepted term only"

