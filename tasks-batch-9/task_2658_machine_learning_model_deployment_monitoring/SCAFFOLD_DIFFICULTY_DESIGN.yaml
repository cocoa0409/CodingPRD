          trigger:
            - call: "POST /training-datasets/${ds_id}/revoke"
              payload: { revocation_reason: "upstream PII incident in the July snapshot" }
              as: DataSteward
              as_user_id: "u_stew_1"
              captures: { ds_state: $.data.approval_state, dep_after: $.data.dependent_version_count }
          assert:
            - "before the revoke: TrainingDataset.${ds_id}.approval_state == 'APPROVED' with dependent_version_count 2; both versions APPROVED; d1 LIVE at 100.00; d2 RAMPING at 10.00; evaluation COLLECTING; ModelVersion.${v2_id}.evaluation_sample_budget == 2000"
            - "HOP 1: TrainingDataset.${ds_id}.approval_state == 'REVOKED' with revocation_reason 'upstream PII incident in the July snapshot'"
            - "HOP 2 (caused by hop 1): ModelVersion.${v1_id}.approval_state == 'BLOCKED' and ModelVersion.${v2_id}.approval_state == 'BLOCKED', both with blocked_reason 'TRAINING_DATA_REVOKED'"
            - "HOP 3 (caused by hop 2): Deployment.${d1_id}.rollout_state == 'DRAINING' with traffic_pct 0.00, and Deployment.${d2_id}.rollout_state == 'DRAINING' with traffic_pct 0.00"
            - "HOP 3 ledgers: ServingEndpoint.${se1_id}.allocated_traffic_pct == 0.00 and ServingEndpoint.${se2_id}.allocated_traffic_pct == 0.00"
            - "HOP 3 audit trail: GET /traffic-ramp-steps?deployment_id=${d1_id} returns 7 rows — six RAMP_STEP rows summing to +100.00 plus one DRAIN_RELEASE row with delta_pct -100.00 — and Deployment.${d1_id}.cumulative_ramp_delta_pct == 0.00"
            - "HOP 3 audit trail: GET /traffic-ramp-steps?deployment_id=${d2_id} returns 2 rows (+10.00 RAMP_STEP, -10.00 DRAIN_RELEASE) and Deployment.${d2_id}.cumulative_ramp_delta_pct == 0.00"
            - "HOP 4 (caused by hop 3): ChallengerEvaluation.${ev_id}.status == 'INCONCLUSIVE' with criteria_failures ['DEPLOYMENT_DRAINED'], and ModelVersion.${v2_id}.evaluation_sample_budget == 5000 (the 3000 reservation released)"
            - "TrainingDataset.${ds_id}.dependent_version_count is STILL 2 after the cascade — BLOCKED versions remain dependencies, only REJECTED ones stop counting"
            - "cascade depth is exactly 4 and each hop is caused by the previous one: removing hop 2 (e.g. if the versions had been DEPRECATED before the revoke) would leave hops 3 and 4 unfired"
            - "no promotion happened: Model.${m_id}.champion_version_id is still null"

      - name: drift_report_critical_cascade_depth_five
        grounds:
