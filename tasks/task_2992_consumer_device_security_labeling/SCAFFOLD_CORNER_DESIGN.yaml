      - name: idempotency_second_notice_on_the_same_case_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.EnforcementCase.case_status.OPENED_to_NOTICE_ISSUED
          - validations[priority=43]
          - errors[ERR_INVALID_CASE_STATE]
        distinguishing_aspect: "The second POST /notice on a case already in NOTICE_ISSUED returns ERR_INVALID_CASE_STATE and leaves notice_issued_by_user_id at the first issuer, so the notice step is not re-stampable by a later administrator."
        test_recipe:
          setup:
            - "An UNAUTHORIZED_DISPLAY case is open against a SMALL manufacturer for an unregistered code, and admin-1 has issued the statutory notice."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /labeling/manufacturers"
              payload: { legal_name: "Acme Devices", contact_email: "ops@acme.example", enterprise_class: "SMALL", annual_us_revenue_cents: 900000000 }
              as: ProgramAdministrator
              captures: { mfr_id: "$.data.id" }
            - call: "POST /labeling/enforcement-cases"
              payload: { subject_manufacturer_id: "${mfr_id}", reported_scannable_code: "ZZ-NO-SUCH-CD01", violation_type: "UNAUTHORIZED_DISPLAY", violation_line_items: [ { retail_listing_ref: "LST-1", channel: "ONLINE", unit_count: 10 } ], reporter_note: "Label artwork observed on an unlisted marketplace page" }
              as: ProgramAdministrator
              captures: { case_id: "$.data.id" }
            - call: "POST /labeling/enforcement-cases/${case_id}/notice"
              payload: { notice_reference: "NOT-2026-0001" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /labeling/enforcement-cases/${case_id}/notice"
              payload: { notice_reference: "NOT-2026-0002" }
              as: ProgramAdministrator
              as_user_id: "admin-2"
          assert:
            - "HTTP status is 409"
            - "data.error_id == ERR_INVALID_CASE_STATE"
            - "EnforcementCase.${case_id}.case_status == NOTICE_ISSUED"
            - "EnforcementCase.${case_id}.notice_reference == NOT-2026-0001"
            - "EnforcementCase.${case_id}.notice_issued_by_user_id == admin-1"
            - "EnforcementCase.${case_id}.code_matches_registry == false and violation_unit_count == 10"

