        distinguishing_aspect: "SupplierRep is the only entity_backed role: its X-User-ID is a Foundry id, so reading a lot belonging to foundry FDY-C19A while identified as FDY-C19B yields ERR_FOUNDRY_SCOPE_VIOLATION (403), not ERR_ROLE_NOT_PERMITTED."
        test_recipe:
          setup:
            - "Two foundries; one heat lot received against the first foundry."
          setup_api_calls:
            - call: "POST /valve-mfg/foundries"
              payload: { foundry_code: "FDY-C19A", name: "Corner Tenant A", country_code: "IN" }
              as: ProcurementSpecialist
              captures: { f_a: $.data.id }
            - call: "POST /valve-mfg/foundries"
              payload: { foundry_code: "FDY-C19B", name: "Corner Tenant B", country_code: "IT" }
              as: ProcurementSpecialist
              captures: { f_b: $.data.id }
            - call: "POST /valve-mfg/heat-lots"
              payload: { foundry_id: "${f_a}", heat_number: "H-C1901", material_grade: "CF8M", process: "CASTING", qty_received_kg: 400.000, mtr_document_ref: "MTR-C1901", carbon_equivalent_pct: 0.35, impact_energy_j: 40 }
              as: ProcurementSpecialist
              captures: { l_id: $.data.id }
          trigger:
            - call: "GET /valve-mfg/heat-lots/${l_id}"
              payload: {}
              as: SupplierRep
              as_user_id: "${f_b}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FOUNDRY_SCOPE_VIOLATION"
            - "HTTP status == 403"
            - "HeatLot.${l_id}.foundry_id == ${f_a}"

  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_actuator_create_with_stale_unit_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[actuator-package-create-stale-unit]
          - validations[priority=34]
          - errors[ERR_STALE_VALVE_UNIT_VERSION]
        distinguishing_aspect: "The actuator-package write carries expected_valve_unit_version; a value one behind the unit's current version is refused with ERR_STALE_VALVE_UNIT_VERSION (412) and no ActuatorPackage row is stored, while the same call with the current version succeeds and bumps the unit version."
        test_recipe:
          setup:
            - "A unit advanced to ASSEMBLED; its version is captured from the last build-action response."
          setup_api_calls:
            - call: "POST /valve-mfg/foundries"
              payload: { foundry_code: "FDY-C20", name: "Corner OCC Castings", country_code: "IN" }
              as: ProcurementSpecialist
              captures: { f_id: $.data.id }
            - call: "POST /valve-mfg/foundry-qualifications"
              payload: { foundry_id: "${f_id}", process: "CASTING", material_grade: "CF8M", max_pressure_class: 600, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: ProcurementSpecialist
              captures: { q_id: $.data.id }
            - call: "POST /valve-mfg/foundry-qualifications/${q_id}/actions"
              payload: { action: "QUALIFY" }
              as: QualityManager
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "BV-300-OCC", valve_type: "BALL", pressure_class: 300, body_material_grade: "CF8M", bore_size_mm: 100, seat_type: "METAL", base_break_torque_nm: 420.0 }
              as: ProductEngineer
              captures: { m_id: $.data.id }
            - call: "POST /valve-mfg/valve-models/${m_id}/actions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ProductEngineer
            - call: "POST /valve-mfg/valve-models/${m_id}/actions"
