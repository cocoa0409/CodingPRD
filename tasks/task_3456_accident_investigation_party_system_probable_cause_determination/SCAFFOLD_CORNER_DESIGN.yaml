            - *c_org
            - *c_designation
            - *c_seat
            - *c_adv_factual
            - *c_report
          trigger:
            - call: "POST /groups/${grp_id}/complete"
              payload: {}
              as: GroupChairman
              as_user_id: "gc-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_GROUP_NOT_COMPLETABLE"
            - "GET /groups/${grp_id} shows status == ACTIVE and GET /investigations/${inv_id} shows docket_completeness_pct == 0"

      - name: session_window_in_past_returns_window_error
        claim_type: Triggerable
        grounds:
          - errors.ERR_WINDOW_IN_PAST
          - validations[priority=8]
        distinguishing_aspect: "A readout session whose window_start_utc is not strictly after the logical clock is rejected with 422 ERR_WINDOW_IN_PAST — scheduling is forward-only."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; launched investigation with one recorder."
          setup_api_calls:
            - *c_clock
