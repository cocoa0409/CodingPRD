          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Committing with an expected_hub_version observed before another commit advanced Hub.version yields ERR_STALE_VERSION (412); two strictly sequential commits, the second carrying the pre-first-commit version."
        test_recipe:
          setup: ["Network NOC, hub HOC (cap 500), line LOC; batches BOC1, BOC2 SCHEDULED (planned 50 each); client observed hub version v0 at hub GET"]
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "NOC", display_name: "Net OC" }
              as: NetworkAdmin
              captures: { noc: $.data.id }
            - call: "POST /networks/${noc}/hubs"
              payload: { hub_code: "HOC", daily_capacity_dozens: 500, territory_region: "ROC" }
              as: NetworkAdmin
              captures: { hoc: $.data.id }
            - call: "POST /networks/${noc}/hubs/${hoc}/lines"
              payload: { line_kind: "CONTINUOUS_FRYER", rated_dozens_per_hour: 100, service_interval_hours: 100 }
              as: HubManager
              captures: { loc: $.data.id }
            - call: "POST /networks/${noc}/hubs/${hoc}/batches"
              payload: { equipment_line_id: "${loc}", production_date: "2026-09-01", planned_dozens: 50 }
              as: HubManager
              captures: { boc1: $.data.id }
            - call: "POST /networks/${noc}/hubs/${hoc}/batches"
              payload: { equipment_line_id: "${loc}", production_date: "2026-09-01", planned_dozens: 50 }
              as: HubManager
              captures: { boc2: $.data.id }
            - call: "GET /networks/${noc}/hubs/${hoc}"
              payload: {}
              as: NetworkAdmin
              captures: { hoc_v0: $.data.version }
            - call: "POST /networks/${noc}/hubs/${hoc}/batches/${boc1}/commit"
              payload: { expected_hub_version: "${hoc_v0}" }
              as: HubManager
          trigger:
            - call: "POST /networks/${noc}/hubs/${hoc}/batches/${boc2}/commit"
              payload: { expected_hub_version: "${hoc_v0}" }
              as: HubManager
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION and http 412 (hub version advanced by first commit)"
            - "ProductionBatch.${boc2}.batch_status remains SCHEDULED"
            - "Hub.${hoc}.committed_dozens_today == 50 (only first commit applied)"

