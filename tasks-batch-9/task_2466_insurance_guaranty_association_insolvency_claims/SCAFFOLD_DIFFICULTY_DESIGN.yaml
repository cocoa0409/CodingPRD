            - "${short} == 950000"
            - "Assessment.${asmt_id}.status == CERTIFIED"
            - "Assessment.${asmt_id}.member_count == 3"
            - "Assessment.${asmt_id}.certified_at_utc == 2026-08-01T00:00:00Z"
            - "MemberAssessment where member_insurer_id == ${m1_id} has levied_amount_cents == 200000 and capped == true and billing_status == INVOICED"
            - "MemberAssessment where member_insurer_id == ${m2_id} has levied_amount_cents == 150000 and capped == true"
            - "MemberAssessment where member_insurer_id == ${m3_id} has levied_amount_cents == 1200000 and capped == true"
            - "Insolvency.${ins_id}.assessment_shortfall_cents == 950000"

