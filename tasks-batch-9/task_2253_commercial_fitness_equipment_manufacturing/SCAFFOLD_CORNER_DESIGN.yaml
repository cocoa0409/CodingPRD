  - name: facility_manager_is_scoped_to_its_own_facility
    claim_type: cross_entity_validation
    grounds:
    - validations[priority=4]
    - errors[ERR_FACILITY_SCOPE_VIOLATION]
    - rbac[FacilityManager].identity
    distinguishing_aspect: A FacilityManager whose X-User-ID is facility f2 cannot create an order for f1 nor read f1's order — both return 403 ERR_FACILITY_SCOPE_VIOLATION — while the identical create
      for its OWN facility returns 201, proving the check compares X-User-ID against the facility in scope rather than rejecting the role outright.
