              as: AgencyOperations
              captures: { acct: "$.data.id" }
            - call: "POST /toll/accounts/${acct}/transponders"
              payload: { tag_number: "TAG-S", vehicle_class: "CLASS_2", plate_number: "SUS100", plate_state: "NY" }
              as: AgencyOperations
            - call: "GET /toll/accounts/${acct}"
              payload: {}
              as: AgencyOperations
              captures: { va: "$.data.version" }
            - call: "POST /toll/accounts/${acct}/replenishments"
              payload: { amount_cents: 2500, outcome: "FAILED", expected_account_version: "${va}" }
              as: AgencyOperations
            - call: "GET /toll/accounts/${acct}"
              payload: {}
              as: AgencyOperations
              captures: { vb: "$.data.version" }
            - call: "POST /toll/accounts/${acct}/replenishments"
              payload: { amount_cents: 2500, outcome: "FAILED", expected_account_version: "${vb}" }
              as: AgencyOperations
            - call: "GET /toll/accounts/${acct}"
              payload: {}
              as: AgencyOperations
              captures: { vc: "$.data.version" }
            - call: "POST /toll/accounts/${acct}/replenishments"
              payload: { amount_cents: 2500, outcome: "FAILED", expected_account_version: "${vc}" }
              as: AgencyOperations
          trigger:
            - call: "POST /toll/toll-transactions"
              payload: { tag_number: "TAG-S", away_agency_id: "${away_id}", plaza_code: "PX", trip_timestamp: "2026-09-08T09:00:00Z", is_peak: false, idempotency_key: "sx1" }
              as: AgencyOperations
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 409"
            - "error_id == ERR_ACCOUNT_SUSPENDED (priority 5 beats priority 6's ERR_RATE_NOT_FOUND even though plaza PX has no schedule)"

      - name: temporal_vs_constraint_on_notice_issue
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors.ERR_NOTICE_TOO_SOON
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: |
          Category pair business_temporal vs business_constraint ordering
          inside the violation flow: issuing notice 2 only 10 days after
          notice 1 on a violation whose notice_count is already at the limit
          is impossible to construct, so this instance instead pits temporal
          (priority 8) against state (priority 4): notice 2 issued at day 10
          on a NOTICED violation fails ERR_NOTICE_TOO_SOON — and on a PAID
          violation at day 40 the same call fails ERR_INVALID_STATE_TRANSITION
          (state priority 4 beats temporal priority 8).
        test_recipe:
          setup:
            - "Two violations on unregistered plates: V-temp (NOTICED, notice 1 at day 0) and V-state (NOTICED then PAID at day 5)."
            - "Logical clock advanced 10 days for V-temp's check; V-state paid early."
