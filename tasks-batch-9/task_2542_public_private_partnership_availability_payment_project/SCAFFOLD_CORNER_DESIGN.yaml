      - name: concession_creation_with_an_unknown_concessionaire_id_is_referenced_entity_not_found
        claim_type: parent_relationships
        grounds:
          - endpoints[POST /ppp/concessions]
          - validations[priority=25]
          - errors[ERR_REFERENCED_ENTITY_NOT_FOUND]
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          entity_topology is `flat`: every entity declares `parent: null`, so the owning
          relationship is a body-supplied foreign key rather than a path segment. An
          unknown concessionaire_id must therefore surface as the BODY-FK error
          ERR_REFERENCED_ENTITY_NOT_FOUND (priority 25), not as the path error
          ERR_CONCESSIONAIRE_NOT_FOUND (priority 20) and not as ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Empty database — no Concessionaire row exists at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /ppp/concessions"
              payload: { concessionaire_id: "cnr-does-not-exist", project_name: "A47 Availability Scheme", masp_cents: 100000000, indexation_pct: 0.0325, deduction_cap_pct: 0.20, total_project_cost_cents: 400000000, senior_debt_committed_cents: 300000000, equity_committed_cents: 100000000, base_case_equity_irr_bps: 1200, scheduled_service_commencement: "2027-01-01", ld_daily_rate_cents: 250000, ld_cap_cents: 5000000, lifecycle_reserve_target_cents: 20000000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
