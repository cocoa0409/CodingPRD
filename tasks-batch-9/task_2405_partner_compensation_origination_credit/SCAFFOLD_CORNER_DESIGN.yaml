      - name: composite_score_weighting_and_four_decimal_precision
        claim_type: Precision
        grounds:
          - entities.PeerReview.fields.composite_score
          - entities.SelfAssessment.fields.mean_peer_score
          - endpoints[POST /comp/peer-reviews/{id}/decide]
        distinguishing_aspect: |
          composite_score weights technical at 0.50 and the other two at 0.25 each and is
          stored to 4 decimals: 5/4/3 gives exactly 4.2500 while the unweighted average of
          the same three scores would be 4.0000, and mean_peer_score over 4.2500 and
          3.2500 is 3.7500 rather than a re-average of the raw sub-scores.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 in SELF_ASSESSMENT."
            - "Partner P has a SUBMITTED assessment with two ASSIGNED reviews, from C1 and C2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Prec Ision", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2014 }
              as: CycleAdmin
              captures: { pp: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Ess One", practice_group: "TAX", compensation_model: "FORMULA", admission_year: 2004, is_committee_member: true, evaluation_required: false }
              as: CycleAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Ess Two", practice_group: "IP", compensation_model: "FORMULA", admission_year: 2005, is_committee_member: true, evaluation_required: false }
              as: CycleAdmin
              captures: { c2: "$.data.id" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "SELF_ASSESSMENT" }
              as: CycleAdmin
            - call: "POST /comp/self-assessments"
              payload: { cycle_id: "${cy}", narrative: "Scores should be weighted, not averaged.", claimed_origination_pct_total: 0.00, claimed_non_billable_hours: 0.00 }
              as: Partner
              as_user_id: "${pp}"
              captures: { sa: "$.data.id" }
            - call: "POST /comp/self-assessments/${sa}/submit"
              payload: {}
              as: Partner
              as_user_id: "${pp}"
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "${sa}", reviewer_partner_id: "${c1}" }
              as: CycleAdmin
              captures: { r1: "$.data.id" }
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "${sa}", reviewer_partner_id: "${c2}" }
              as: CycleAdmin
              captures: { r2: "$.data.id" }
          trigger:
            - call: "POST /comp/peer-reviews/${r1}/decide"
              payload: { outcome: "SCORE", technical_score: 5, collaboration_score: 4, client_service_score: 3, comment: "Technically superb, service uneven." }
              as: Partner
              as_user_id: "${c1}"
              captures: { cs1: "$.data.composite_score" }
            - call: "GET /comp/self-assessments/${sa}"
              payload: {}
              as: CycleAdmin
              captures: { mean1: "$.data.mean_peer_score", cnt1: "$.data.scored_review_count" }
            - call: "POST /comp/peer-reviews/${r2}/decide"
              payload: { outcome: "SCORE", technical_score: 3, collaboration_score: 4, client_service_score: 3, comment: "Steady across the board." }
              as: Partner
              as_user_id: "${c2}"
              captures: { cs2: "$.data.composite_score" }
            - call: "GET /comp/self-assessments/${sa}"
              payload: {}
              as: CycleAdmin
              captures: { mean2: "$.data.mean_peer_score", cnt2: "$.data.scored_review_count" }
          assert:
            - "${cs1} == 4.2500 (5 * 0.50 + 4 * 0.25 + 3 * 0.25), not the unweighted 4.0000"
            - "${cs2} == 3.2500 (3 * 0.50 + 4 * 0.25 + 3 * 0.25)"
            - "${cnt1} == 1 and ${mean1} == 4.2500"
            - "${cnt2} == 2 and ${mean2} == 3.7500, the mean of the two composites"
            - "both composite values carry exactly 4 decimal places"
            - "PeerReview.${r1}.state == SCORED and PeerReview.${r2}.state == SCORED"

      - name: anchor_cycle_rebases_partner_computed_fields_when_a_later_year_opens
        claim_type: projection
        grounds:
          - calculations.anchor_cycle_selection
          - entities.Partner.fields.verified_billable_hours
          - endpoints[POST /comp/contribution-records/{id}/verify]
          - endpoints[POST /comp/cycles]
        distinguishing_aspect: |
          Partner computed fields are projections against exactly one anchor cycle, and the
          anchor is the greatest non-CLOSED fiscal_year: verified hours booked to fiscal
          2026 disappear from Partner.verified_billable_hours the moment a fiscal 2027 cycle
          is created, without any ContributionRecord being touched, and Matter-level hours -
          which are not cycle-scoped - stay put.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 is the only cycle and is in OPEN_INTAKE."
            - "Partner P has one verified BILLABLE ContributionRecord of 100.00 hours against fiscal 2026 on OPEN Matter M."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy26: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Anna Anchor", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2014 }
              as: CycleAdmin
              captures: { pp: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-AN", client_display_name: "Anchor Analytics", matter_type: "EXISTING", practice_group: "CORPORATE", opened_on: "2026-01-05", billing_attorney_id: "${pp}", responsible_attorney_id: "${pp}" }
              as: CycleAdmin
              captures: { m: "$.data.id" }
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${pp}", cycle_id: "${cy26}", matter_id: "${m}", kind: "BILLABLE", category: "CLIENT_WORK", hours: 100.00, standard_rate_cents: 50000, service_period_start: "2026-02-01", service_period_end: "2026-02-28" }
              as: CycleAdmin
              captures: { cr: "$.data.id" }
            - call: "POST /comp/contribution-records/${cr}/verify"
              payload: {}
              as: CycleAdmin
          trigger:
            - call: "GET /comp/partners/${pp}"
              payload: {}
              as: CycleAdmin
              captures: { h26: "$.data.verified_billable_hours" }
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2027, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2027-09-30", assessment_deadline_on: "2027-10-31" }
              as: CycleAdmin
              captures: { cy27: "$.data.id" }
            - call: "GET /comp/partners/${pp}"
              payload: {}
              as: CycleAdmin
              captures: { h27: "$.data.verified_billable_hours", idx27: "$.data.normalized_credit_index_provisional", fs27: "$.data.formula_score_provisional" }
            - call: "GET /comp/matters/${m}"
              payload: {}
              as: CycleAdmin
              captures: { mh: "$.data.verified_billable_hours" }
            - call: "GET /comp/contribution-records/${cr}"
              payload: {}
              as: CycleAdmin
              captures: { crcy: "$.data.cycle_id", crver: "$.data.verified" }
          assert:
            - "${h26} == 100.00 while fiscal 2026 is the anchor"
            - "${h27} == 0.00 once fiscal 2027 exists, because the anchor moved to the greater non-CLOSED fiscal_year"
            - "${idx27} == 0.0000 and ${fs27} == 0.0000 under the new anchor"
            - "${mh} == 100.00 - Matter.verified_billable_hours is not cycle-scoped and is unaffected"
            - "${crcy} == ${cy26} and ${crver} == true - the record itself was never rewritten"
            - "CompensationCycle.${cy27}.total_formula_score == 0.0000"

      - name: matter_ledger_running_totals_survive_a_negative_delta
        claim_type: aggregation
        grounds:
          - calculations.matter_realization_and_profitability
          - endpoints[POST /comp/matters/{id}/financials]
          - entities.Matter.fields.realization_pct
          - entities.Matter.fields.profitability_index_contribution
        distinguishing_aspect: |
          The financials endpoint is additive, so a later negative collected delta is a
          reversal rather than a rewrite: collections walk 4000000 -> 3000000 and the
          derived ratios are recomputed from the running totals, giving realization
          0.8000 -> 0.6000 and contribution margin 0.7500 -> 0.6667 with the 4-decimal
          round_half_up applied once at the end.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; OPEN Matter M with a zeroed ledger and no verified hours."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/partners"
              payload: { full_name: "Agg Regate", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2014 }
              as: CycleAdmin
              captures: { pp: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-AG", client_display_name: "Aggregate Advisors", matter_type: "EXISTING", practice_group: "CORPORATE", opened_on: "2026-01-15", billing_attorney_id: "${pp}", responsible_attorney_id: "${pp}" }
              as: CycleAdmin
              captures: { m: "$.data.id", v1: "$.data.version" }
          trigger:
            - call: "POST /comp/matters/${m}/financials"
              payload: { billed_delta_cents: 5000000, collected_delta_cents: 4000000, direct_cost_delta_cents: 1000000, expected_matter_version: "${v1}" }
              as: CycleAdmin
              captures: { r1: "$.data.realization_pct", pc1: "$.data.profitability_index_contribution", pf1: "$.data.profitability_index_fully_loaded", v2: "$.data.version" }
            - call: "POST /comp/matters/${m}/financials"
              payload: { billed_delta_cents: 0, collected_delta_cents: -1000000, direct_cost_delta_cents: 0, expected_matter_version: "${v2}" }
              as: CycleAdmin
              captures: { r2: "$.data.realization_pct", pc2: "$.data.profitability_index_contribution", coll2: "$.data.collected_cents", bill2: "$.data.billed_cents", v3: "$.data.version" }
          assert:
            - "${r1} == 0.8000 and ${pc1} == 0.7500"
            - "${pf1} == 0.7500 as well, because verified_billable_hours is 0.00 and the two variants coincide"
            - "${coll2} == 3000000 and ${bill2} == 5000000 - the second call added a signed delta rather than replacing the totals"
            - "${r2} == 0.6000"
            - "${pc2} == 0.6667, i.e. 2000000/3000000 rounded half up at the fourth decimal"
            - "${v3} > ${v2} > ${v1}, one increment per additive write"

      - name: pool_waterfall_cuts_lockstep_to_its_floor_then_trims_discretionary
        claim_type: waterfall_allocation
        grounds:
          - calculations.cycle_pool_waterfall
          - entities.CompensationCycle.fields.lockstep_reserved_cents
          - entities.CompensationCycle.fields.discretionary_pool_cents
          - entities.CompensationCycle.fields.formula_pool_cents
          - entities.CompensationCycle.fields.haircut_applied_pct
        distinguishing_aspect: |
          An overcommitted pool is cut in a pinned order with a per-bucket floor: gross
          demands of 80000000 lockstep plus 50000000 discretionary against 100000000
          distributable leave a 30000000 deficit, lockstep absorbs its full 24000000
          ceiling (haircut_applied_pct exactly 0.3000, reserve 56000000), discretionary
          absorbs only the remaining 6000000 (44000000, well inside its own 15000000
          ceiling) and formula is left with 0 rather than a negative pool.
