            - call: "POST /habitat-builds/${hb2}/start"
              payload: {}
              as: SalesAssociate
          trigger:
            - call: "POST /habitat-builds/${hb2}/schedule-install"
              payload: { installer_id: "INST-X", install_start_at: "2026-07-10T11:30:00Z", install_end_at: "2026-07-10T13:00:00Z" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INSTALL_BUFFER_CONFLICT"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: feeder_unit_conservation_ship_then_reverse
        grounds:
          - state_machines.Shipment.SHIPPED_to_REVERSED
          - entities.FeederBatch.fields.quantity_on_hand
          - calculations.shipment_cost
        distinguishing_aspect: "Conserved quantity = physical feeder units sum(FeederBatch.quantity_on_hand): a shipment decrements the batch by 10 (30->20) and a MANUAL reverse restores exactly 10 (20->30), so the total is unchanged."
        test_recipe:
          setup:
            - "One CRICKET/MEDIUM batch qty 30 unit_price 50; ACTIVE subscription qty 10 with one SHIPPED shipment (batch now 20)."
          setup_api_calls:
