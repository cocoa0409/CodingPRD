      - name: removal_execute_depth3_cascade
        grounds:
          - state_machines.Term.ACTIVE_to_VACATED
          - state_machines.RemovalAction.INITIATED_to_EXECUTED
          - entities.Seat.fields.occupancy_status
          - entities.Vacancy.fields.reason
        distinguishing_aspect: "Depth-3 chain from removal execution: RemovalAction.EXECUTED -> Term.VACATED (link1) -> Seat.VACANT (link2) -> a new Vacancy(reason=REMOVAL, OPEN) (link3); each hop caused by the prior."
        test_recipe:
          setup:
            - "A seated ACTIVE member (seat FILLED, 2 PENDING disclosures) with an INITIATED removal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: BoardClerk
            - call: "POST /civic/boards"
              payload: { name: "Zoning Board", jurisdiction: "Springfield", board_type: "COMMISSION", authorized_seat_count: 5, quorum_count: 3, term_length_months: 48, max_consecutive_terms: 2, max_cumulative_years: 12, attendance_threshold_pct: 75.0, sunshine_notice_days: 7 }
