  - rule_id: resource_temporal_overlap
    instances:
      - name: exclusivity_half_open_overlap
        grounds:
          - validations[priority=12]
          - state_machines.Deal.PENDING_BRAND_to_ACTIVE
          - entities.Deal.fields.exclusive_window_end
        distinguishing_aspect: |
          Interval semantics: half-open [start, end) overlap on the Creator resource —
          deal A activated 2026-08-05 with 30 exclusivity days occupies
          [2026-08-05, 2026-09-04), so deal B (same creator, same FINTECH category)
          activating at 2026-09-01 conflicts, while activation at exactly 2026-09-04
          (adjacent, end == start) is allowed.
        test_recipe:
          setup:
            - "one ACTIVE creator; two brands each with an OPEN brief (FINTECH, exclusivity_days 30); both deals negotiated to PENDING_BRAND before any activation"
          setup_api_calls:
            - { call: "POST /creators", payload: { handle: "cro1", email: "cro1@x.com", niche: "FINANCE", primary_platform: "YOUTUBE", followers: 50000, avg_views_30d: 40000, engagement_rate_bps: 250 }, as: TalentManager, captures: { c_id: $.data.id } }
