  # ===========================================================================
  # Cross-cutting complexity layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_kit_creation
        claim_type: optimistic_concurrency
        grounds:
          - "\"concurrency_rules[kit-create-stale-order\"]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Two sequential kit-creation attempts with the same observed version: the first succeeds (version advances), the second carrying the now-stale expected_order_version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["order confirmed ELIGIBLE; client observed version v after confirm"]
          setup_api_calls:
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/patients"
              payload: { external_ref: "p-occ", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /screening/providers"
              payload: { npi: "1234567832", display_name: "Dr AL", channel: "ORDERING" }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /screening/orders"
              payload: { patient_id: "${p_id}", provider_id: "${v_id}" }
              as: Provider
              as_user_id: "${v_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /screening/orders/${o_id}/eligibility/confirm"
              payload: {}
              as: ProgramAdmin
            - call: "POST /screening/orders/${o_id}/kit"
              payload: { expected_order_version: "${o_v} + 1" }
              as: FulfillmentAgent
              captures: { k_id: $.data.id }
          trigger:
            - call: "POST /screening/orders/${o_id}/kit"
              payload: { expected_order_version: "${o_v} + 1" }
              as: FulfillmentAgent
              captures: { err: $.data.error_id }
          assert:
            - "second kit creation error_id == ERR_STALE_VERSION"
            - "http status == 412"
            - "exactly one kit exists for the order"

      - name: version_increments_on_every_mutation
        claim_type: derived_field_reconciliation
        grounds:
          - "entities.ScreeningOrder.fields.version"
        distinguishing_aspect: "Order version starts at 1 and increments by exactly 1 per mutation: confirm -> 2, kit -> 3, ship -> 4, return -> 5."
        test_recipe:
          setup: ["order driven through confirm, kit, ship, return"]
          setup_api_calls:
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/patients"
              payload: { external_ref: "p-ver", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /screening/providers"
              payload: { npi: "1234567833", display_name: "Dr AM", channel: "ORDERING" }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /screening/orders"
              payload: { patient_id: "${p_id}", provider_id: "${v_id}" }
              as: Provider
              as_user_id: "${v_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /screening/orders/${o_id}/eligibility/confirm"
              payload: {}
              as: ProgramAdmin
            - call: "POST /screening/orders/${o_id}/kit"
              payload: { expected_order_version: "${o_v} + 1" }
              as: FulfillmentAgent
              captures: { k_id: $.data.id }
            - call: "POST /screening/kits/${k_id}/ship"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/kits/${k_id}/return"
              payload: {}
              as: FulfillmentAgent
          trigger:
            - call: "GET /screening/orders/${o_id}"
              as: ProgramAdmin
          assert:
            - "ScreeningOrder.${o_id}.version == 5 (1 create + 4 mutations)"

      - name: opt_out_cascades_cohort_exclusion
        claim_type: cascading_side_effects
        grounds:
          - "entities.Patient.fields.status"
          - "state_machines.MemberCohort.ELIGIBLE_to_EXCLUDED"
        distinguishing_aspect: "Patient opt-out cascades to every ELIGIBLE/OUTREACH_SENT cohort row of that patient across programs: each flips to EXCLUDED and its program's attributed_count decrements."
        test_recipe:
          setup: ["patient enrolled in two programs' cohorts (one ELIGIBLE, one OUTREACH_SENT)"]
          setup_api_calls:
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/programs"
              payload: { program_code: "G-OO1", program_name: "OO1", outreach_mode: "PUSH", measure_year: 2026 }
              as: ProgramAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /screening/programs"
              payload: { program_code: "G-OO2", program_name: "OO2", outreach_mode: "PUSH", measure_year: 2026 }
              as: ProgramAdmin
              captures: { g2_id: $.data.id }
            - call: "POST /screening/patients"
              payload: { external_ref: "p-oo", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /screening/programs/${g1_id}/cohorts"
              payload: { patient_id: "${p_id}" }
              as: ProgramAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /screening/programs/${g2_id}/cohorts"
              payload: { patient_id: "${p_id}" }
              as: ProgramAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /screening/programs/${g2_id}/cohorts/${c2_id}/outreach"
              payload: { channel: "PHONE", template_code: "T4" }
              as: ProgramAdmin
          trigger:
            - call: "POST /screening/patients/${p_id}/opt-out"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Patient.${p_id}.status == OPTED_OUT"
            - "MemberCohort.${c1_id}.status == EXCLUDED and attributed == false"
            - "MemberCohort.${c2_id}.status == EXCLUDED and attributed == false"
            - "HealthPlanProgram.${g1_id}.attributed_count == 0"
            - "HealthPlanProgram.${g2_id}.attributed_count == 0"

