  - section: validations
    instances:
      - name: existence_beats_state_on_batch_add
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=8]"]
        distinguishing_aspect: "Adding an item to a non-existent batch id returns ERR_BATCH_NOT_FOUND (existence, priority 3) even though the item would also fail later gates."
        test_recipe:
          setup: ["account; clock 2026-05-01; manifest RECEIVED; one data-bearing item triaged RECYCLE (would fail the data gate if the batch existed)"]
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Ex Co", contact_email: "ex@x.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
            - { call: "POST /itad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", declared_item_count: 1 }, as: AccountManager, as_user_id: "${acct}", captures: { m: $.data.id } }
            - { call: "POST /itad/manifests/${m}/schedule", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /itad/manifests/${m}/receive", payload: {}, as: IntakeOperator }
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-EX1", category: "LAPTOP", weight_kg: 2.0, data_bearing: true, hazmat_flag: false, declared_grade: "B" }, as: IntakeOperator, captures: { i1: $.data.id } }
            - { call: "POST /itad/items/${i1}/triage", payload: { disposition: "RECYCLE" }, as: IntakeOperator }
          trigger:
            - { call: "POST /itad/recycle-batches/00000000-0000-0000-0000-000000000000/items", payload: { item_id: "${i1}" }, as: LogisticsCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_BATCH_NOT_FOUND (existence checked before any state or safety rule)"

      - name: sell_at_exact_floor_allowed_below_rejected
        claim_type: satisfaction_and_violation
        grounds: ["validations[priority=31]", "errors[ERR_FLOOR_PRICE_VIOLATION]"]
        distinguishing_aspect: "The floor check is >= : sale at exactly floor_price_cents succeeds; one cent below fails with ERR_FLOOR_PRICE_VIOLATION."
