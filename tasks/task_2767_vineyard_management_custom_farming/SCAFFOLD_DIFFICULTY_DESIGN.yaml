  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_schedule_travel_buffer_differs_by_block
        grounds:
          - calculations.crew_schedule_conflict_detection
          - validations[priority=90]
          - errors[ERR_CREW_SCHEDULE_CONFLICT]
          - entities.LaborCrew.fields.scheduled_work_order_count
        distinguishing_aspect: |
          One crew, two blocks, four bookings distinguish the half-open interval from the travel
          buffer: an order starting exactly when the previous one ends is accepted when both are on
          the SAME block (gap 0), while the byte-identical adjacency across DIFFERENT blocks is
          refused with ERR_CREW_SCHEDULE_CONFLICT until TRAVEL_BUFFER_MINUTES 60 separate them —
          the crew-resource geometry, distinct from the delivery-window aggregate geometry in this
          rule's other instance.
        test_recipe:
          setup:
            - "Vineyard Ridgecrest Ranch with block B-12 (5.0 x 8.0 ft on 12.5 acres) and block B-14 (6.0 x 10.0 ft on 4.0 acres, planted 2020)."
            - "FarmingPlan P1 for B-12 APPROVED (total_budget 14687.50) and FarmingPlan P2 for B-14 APPROVED (total_budget 1028.00)."
            - "HOURLY crew CR5 (crew_size 1, base_hourly_rate 20.00, piece_rate_per_vine 0, all four capabilities, ACTIVE) so every 8-hour order costs exactly 205.60."
