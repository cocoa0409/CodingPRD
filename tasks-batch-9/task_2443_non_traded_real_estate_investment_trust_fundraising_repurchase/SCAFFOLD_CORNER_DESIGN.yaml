  # ===========================================================================
  - section: errors
    instances:
      - name: four_uniqueness_scopes_each_reject_their_own_duplicate_key
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUPLICATE_INVESTOR_EMAIL]
          - errors[ERR_DUPLICATE_CRD_NUMBER]
          - errors[ERR_DUPLICATE_SHARE_CLASS_CODE]
          - errors[ERR_DUPLICATE_REPURCHASE_PERIOD]
        distinguishing_aspect: |
          Investor email and broker-dealer CRD are globally unique while class_code
          and period_month are unique only within one offering, so the same class_code
          must be accepted in a sibling offering while the duplicate month is refused
          even when its window is legally spaced.
        test_recipe:
          setup:
            - "Offering A 'Ironvale Income REIT' is EFFECTIVE with one class I; offering B 'Ironvale Growth REIT' stays DRAFT with no classes."
            - "One broker-dealer holds CRD-340001 and one investor holds ida.brekke@example.com."
            - "Offering A already has an August period from 2026-08-01T00:00:00Z to 2026-08-10T00:00:00Z settling 2026-08-12."
            - "The clock stays at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Ironvale Income REIT", minimum_offering_amount_cents: 30000000, maximum_offering_amount_cents: 50000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000 }
