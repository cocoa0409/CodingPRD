      - name: serialized_unit_build_requires_released_revision
        grounds:
          - state_machines.SerializedUnit.PLANNED_to_BUILT
          - entities.PartRevision.fields.lifecycle_state
          - validations[priority=4]
        distinguishing_aspect: |
          A SerializedUnit can only build PLANNED->BUILT when its pinned PartRevision is
          RELEASED; a unit pinned to a WORKING revision is rejected with
          ERR_REVISION_NOT_RELEASED — entity pair SerializedUnit -> PartRevision (different
          from PartRevision -> ECO).
