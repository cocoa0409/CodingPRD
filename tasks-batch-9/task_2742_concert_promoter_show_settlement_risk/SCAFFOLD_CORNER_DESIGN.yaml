          - "calculations.artist_settlement_earnings.formula"
        excluded_because:
          difficulty_instance: artist_coop_cap_is_keyed_on_the_base_it_just_produced
          rationale: "This row's claims — the change propagates through the chain, the chain terminates, and no step is evaluated against a stale input — are the entire subject of the §1.8 instance, which walks allowed_expense -> breakeven -> base -> coop cap -> earnings and shows the cap reading the base produced one step earlier rather than the final earnings figure. The instance additionally pins the single-pass ordering (the coop deduction must NOT feed back into the base), which is the 'no infinite loop / fixed point' half of the row."

