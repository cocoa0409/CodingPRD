            - "trigger 12 returns HTTP 422 with data.error_id == ERR_AGGREGATE_LIMIT_EXCEEDED for the one-cent overshoot (400000 + 100001 = 500001)"
            - "trigger 13 returns HTTP 201 with data.status == ISSUED: 400000 + 100000 = 500000 lands exactly on the aggregate limit and is not above it"
            - "after trigger 13 the policy reads paid_loss_cents 500000, claim B is still APPROVED (100000 < 400000) so reserve_cents is 50000, incurred_loss_cents is 550000 and coverage_posture is FROZEN because incurred loss has passed the aggregate limit"
            - "GET /benefit-payments?claim_id=${claim_b_id} returns meta.total_count == 1: the two refusals wrote nothing"

