  - method: GET
    path: "/recipe-distributions/{distributionId}"
    description: "Get a recipe distribution"
    roles: [PlatformAdmin, RegionalManager, StandOperator, ShiftLead, CrewMember]
    code: 200
    input: []
    output: RecipeDistribution
    side_effects: []

  - method: GET
    path: "/recipe-distributions"
    description: "List distributions, filterable by recipe or stand"
    roles: [PlatformAdmin, RegionalManager, StandOperator, ShiftLead, CrewMember]
    code: 200
    input: ["recipe_id?", "stand_id?", "status?", "limit?", "offset?"]
    output: "RecipeDistribution[]"
    side_effects: []

  - method: POST
    path: "/recipe-distributions/{distributionId}/activate"
    description: "Activate a STAGED or SUSPENDED distribution at the stand"
    roles: [StandOperator]
    code: 200
    input: []
    output: RecipeDistribution
    side_effects: ["status -> ACTIVATED"]

  - method: POST
    path: "/recipe-distributions/{distributionId}/suspend"
    description: "Suspend an ACTIVATED distribution (orders with the recipe rejected while suspended)"
    roles: [StandOperator]
    code: 200
    input: []
