            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Stmt", total_commitment_cents: 5000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_360", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/financial_statements", payload: { facility_id: "${f_id}", statement_type: "QUARTERLY", period_end_date: "2026-06-30", document_ref: "s3://docs/q2.pdf" }, as: Borrower, as_user_id: "${b_id}", captures: { st: $.data.id, st_due: $.data.due_date } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: AgentBank }
          trigger:
            - { call: "POST /api/financial_statements/${st}/receive", payload: {}, as: AgentBank }
          assert:
            - "FinancialStatement.${st}.due_date == 2026-08-14 (period_end + 45 days)"
            - "FinancialStatement.${st}.status == LATE_RECEIVED (received 2026-08-20 > due 2026-08-14)"

      - name: facility_terminate_withdraws_participants_and_locks
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Facility.COMMITTED_to_TERMINATED, state_machines.Participant.COMMITTED_to_WITHDRAWN]
        distinguishing_aspect: "Terminate cascades participants to WITHDRAWN and the facility then rejects all further transitions (terminal)."
        test_recipe:
          setup: ["facility COMMITTED with two participants; no draws"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Ter B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Ter", total_commitment_cents: 5000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_360", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "A", commitment_cents: 3000000 }, as: AgentBank, captures: { pa: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "B", commitment_cents: 2000000 }, as: AgentBank, captures: { pb: $.data.id } }
            - { call: "POST /api/participants/${pa}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${pb}/commit", payload: {}, as: AgentBank }
          trigger:
            - { call: "POST /api/facilities/${f_id}/terminate", payload: {}, as: AgentBank }
            - { call: "POST /api/facilities/${f_id}/terminate", payload: {}, as: AgentBank, captures: { err: $.data.error_id } }
          assert:
            - "Facility.${f_id}.status == TERMINATED; both participants WITHDRAWN"
            - "second terminate: error_id == ERR_INVALID_STATE_TRANSITION, HTTP 409 (terminal lockdown)"

      - name: remit_cascade_side_effects
        claim_type: side_effect_execution
        grounds: [state_machines.DistributionRun.COMPUTED_to_REMITTED]
        excluded_because:
          difficulty_instance: remit_cascade_closes_facility
          rationale: "Remit side effects (lines, participant ledgers, facility aggregates, closure bubble) are asserted end-to-end by the named §1.8 instance."

      - name: default_declare_cascade_side_effects
        claim_type: side_effect_execution
        grounds: [state_machines.Facility.ACTIVE_to_IN_DEFAULT]
        excluded_because:
          difficulty_instance: default_declaration_cascade_reprices_accrual
          rationale: "Solicitation withdrawal, vote voiding, and accrual re-rating are asserted by the named §1.8 instance."

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: interest_accrual_day_count_variants
        claim_type: variant_divergence
        grounds: [calculations.interest_accrual]
        excluded_because:
          difficulty_instance: interest_day_count_basis_variants_diverge
          rationale: "All three day-count variants asserted with literal values in the named §1.8 instance."

      - name: waterfall_distribution_correct_result
        claim_type: correct_result
        grounds: [calculations.waterfall_distribution]
        excluded_because:
          difficulty_instance: waterfall_tiered_allocation_exact_split
          rationale: "Waterfall pools and per-participant splits asserted with literals in the named §1.8 instance."

      - name: share_bps_rounding_allocation
        claim_type: precision
        grounds: [calculations.participant_share_bps]
        excluded_because:
          difficulty_instance: share_bps_floor_then_remainder_rounding
          rationale: "Floor + remainder allocation asserted with literals in the named §1.8 instance."

      - name: buyback_price_variants
        claim_type: variant_divergence
        grounds: [calculations.buyback_price]
        excluded_because:
          difficulty_instance: buyback_price_standard_vs_penalty_variants
          rationale: "STANDARD vs PENALTY buyback prices asserted with literals in the named §1.8 instance."

      - name: late_funding_penalty_exact_amount
        claim_type: correct_result
        grounds: [calculations.late_funding_penalty, state_machines.FundingSettlement.WIRED_to_LATE_CONFIRMED]
        distinguishing_aspect: "Late wire by 2 days on a 400,000 due yields penalty floor(400000*15*2/10000) == 1200; confirm with 1199 fails with ERR_PENALTY_AMOUNT_MISMATCH, with 1200 succeeds to LATE_CONFIRMED."
        test_recipe:
          setup:
            - "Facility 2,000,000 with Q 1,200,000 / R 800,000 committed; draw 1,000,000 created at clock 2026-08-01 (due 2026-08-06)"
            - "Q wired+confirmed 600,000 on time; R defaulted on 2026-08-07, then wires 400,000 at clock 2026-08-08"
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Late Fund B", sector: "OTHER", risk_rating: "SPECULATIVE" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac LF", total_commitment_cents: 2000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "Q", commitment_cents: 1200000 }, as: AgentBank, captures: { q_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "R", commitment_cents: 800000 }, as: AgentBank, captures: { r_id: $.data.id } }
            - { call: "POST /api/participants/${q_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${r_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 1000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f_v}" }, as: AgentBank, captures: { d_id: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${q_id}", as: AgentBank, captures: { sq: '$.data[0].id' } }
            - { call: "GET /api/funding_settlements?participant_id=${r_id}", as: AgentBank, captures: { sr: '$.data[0].id' } }
            - { call: "POST /api/funding_settlements/${sq}/report_wire", payload: { amount_cents: 600000 }, as: ParticipantLender, as_user_id: "${q_id}" }
            - { call: "POST /api/funding_settlements/${sq}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: AgentBank }
            - { call: "POST /api/funding_settlements/${sr}/mark_defaulted", payload: {}, as: AgentBank }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: AgentBank }
            - { call: "POST /api/funding_settlements/${sr}/report_wire", payload: { amount_cents: 400000 }, as: ParticipantLender, as_user_id: "${r_id}" }
          trigger:
            - { call: "POST /api/funding_settlements/${sr}/confirm", payload: { penalty_received_cents: 1199 }, as: AgentBank, captures: { err: $.data.error_id } }
            - { call: "POST /api/funding_settlements/${sr}/confirm", payload: { penalty_received_cents: 1200 }, as: AgentBank, captures: { st: $.data.status } }
          assert:
            - "first confirm: error_id == ERR_PENALTY_AMOUNT_MISMATCH, HTTP 409 (penalty must equal computed 1200 exactly)"
            - "second confirm: settlement status == LATE_CONFIRMED and penalty_interest_cents == 1200 (2 days * 15 bps on 400,000)"
            - "Draw.${d_id}.status == SETTLED and Facility.${f_id}.status == ACTIVE; Participant.${r_id}.status == FUNDED"

      - name: waterfall_agent_retains_pools_without_funded_participants
        claim_type: boundary_edge
        grounds: [calculations.waterfall_distribution, entities.DistributionRun.fields.agent_retained_cents]
        distinguishing_aspect: "Empty recipient set: after the sole participant exits via buyback, a distribution run creates ZERO lines and the agent retains the full interest+principal pools (49,792 of a 50,000 payment after the 208 fee)."
        test_recipe:
          setup:
            - "Facility 1,000,000 with single participant fully funded on a 1,000,000 draw (settled 2026-08-01)"
            - "Participant bought back at clock 2026-08-31 (EXITED; committed 0); borrower pays 50,000 value 2026-08-31"
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Solo B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Solo", total_commitment_cents: 1000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "SoloP", commitment_cents: 1000000 }, as: AgentBank, captures: { p_id: $.data.id } }
            - { call: "POST /api/participants/${p_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 1000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f_v}" }, as: AgentBank, captures: { d_id: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${p_id}", as: AgentBank, captures: { s1: '$.data[0].id' } }
            - { call: "POST /api/funding_settlements/${s1}/report_wire", payload: { amount_cents: 1000000 }, as: ParticipantLender, as_user_id: "${p_id}" }
            - { call: "POST /api/funding_settlements/${s1}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: AgentBank }
            - { call: "POST /api/buyback_demands", payload: { facility_id: "${f_id}", breach_type: "MISREPRESENTATION" }, as: ParticipantLender, as_user_id: "${p_id}", captures: { bd: $.data.id } }
            - { call: "POST /api/buyback_demands/${bd}/acknowledge", payload: {}, as: AgentBank }
            - { call: "POST /api/buyback_demands/${bd}/settle", payload: {}, as: AgentBank }
            - { call: "POST /api/payments", payload: { facility_id: "${f_id}", payment_type: "REGULAR", amount_cents: 50000, value_date: "2026-08-31" }, as: Borrower, as_user_id: "${b_id}", captures: { pay_id: $.data.id, pay_v: $.data.version } }
          trigger:
            - { call: "POST /api/payments/${pay_id}/distribution_runs", payload: { expected_payment_version: "${pay_v}" }, as: AgentBank, captures: { run_id: $.data.id, ret: $.data.agent_retained_cents } }
          assert:
            - "DistributionRun.${run_id}.servicing_fee_cents == 208 (1,000,000 * 25bps * 30d / 360)"
            - "DistributionRun.${run_id}.interest_pool_cents == 10000 and principal_pool_cents == 39792"
            - "DistributionRun.${run_id}.agent_retained_cents == 49792 (no FUNDED participant: entire pools retained)"
            - "GET /api/distribution_lines?run_id=${run_id} returns an empty array"

      - name: principal_allocation_oldest_draw_first
        claim_type: correct_result
        grounds: [calculations.principal_reduction_allocation]
        distinguishing_aspect: "Chronological allocation: a 500,000 principal pool retires the oldest draw (by accrual_start_date) before touching the newer one — draw1 drops to 1,500,000 while draw2 stays 1,000,000."
        test_recipe:
          setup:
            - "Facility 10,000,000 single participant; draw1 2,000,000 [2026-08-01, 2026-09-01) SETTLED; draw2 1,000,000 [2026-09-01, 2026-10-01) SETTLED"
            - "Payment 520,625 REGULAR value 2026-08-31: fee 625 + interest 20,000 + principal 500,000"
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Ord B", sector: "ENERGY", risk_rating: "INVESTMENT_GRADE" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Ord", total_commitment_cents: 10000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "OP", commitment_cents: 10000000 }, as: AgentBank, captures: { p_id: $.data.id } }
            - { call: "POST /api/participants/${p_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v1: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 2000000, accrual_start_date: "2026-08-01", accrual_end_date: "2026-09-01", expected_facility_version: "${f_v1}" }, as: AgentBank, captures: { d1: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${p_id}&draw_id=${d1}", as: AgentBank, captures: { sd1: '$.data[0].id' } }
            - { call: "POST /api/funding_settlements/${sd1}/report_wire", payload: { amount_cents: 2000000 }, as: ParticipantLender, as_user_id: "${p_id}" }
            - { call: "POST /api/funding_settlements/${sd1}/confirm", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v2: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 1000000, accrual_start_date: "2026-09-01", accrual_end_date: "2026-10-01", expected_facility_version: "${f_v2}" }, as: AgentBank, captures: { d2: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${p_id}&draw_id=${d2}", as: AgentBank, captures: { sd2: '$.data[0].id' } }
            - { call: "POST /api/funding_settlements/${sd2}/report_wire", payload: { amount_cents: 1000000 }, as: ParticipantLender, as_user_id: "${p_id}" }
            - { call: "POST /api/funding_settlements/${sd2}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/payments", payload: { facility_id: "${f_id}", payment_type: "REGULAR", amount_cents: 520625, value_date: "2026-08-31" }, as: Borrower, as_user_id: "${b_id}", captures: { pay_id: $.data.id, pay_v: $.data.version } }
            - { call: "POST /api/payments/${pay_id}/distribution_runs", payload: { expected_payment_version: "${pay_v}" }, as: AgentBank, captures: { run_id: $.data.id } }
          trigger:
            - { call: "POST /api/distribution_runs/${run_id}/remit", payload: {}, as: AgentBank }
          assert:
            - "Draw.${d1}.outstanding_cents == 1500000 (oldest draw absorbs the entire principal pool first)"
            - "Draw.${d2}.outstanding_cents == 1000000 (untouched)"
            - "Draw.${d2}.accrued_unpaid_interest_cents == 0 at run time (its accrual window starts 2026-09-01, after value_date 2026-08-31)"
            - "Facility.${f_id}.outstanding_principal_cents == 2500000"

