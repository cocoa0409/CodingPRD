        distinguishing_aspect: |
          Two identically planned promotions (planned_total_spend 10200.00 each) are accrued one
          case apart. 7344 cases at 1.25 gives recognized_spend_amount 9180.00 and a ratio of
          exactly 0.9000, which must be OVERSPEND_WARNING because the comparison is >=. 7343
          cases gives 9178.75 and a ratio of 0.8999 after 4-decimal ROUND_HALF_UP, which must
          stay WITHIN_BUDGET. An implementation using a strict > on the warning ratio reports
          WITHIN_BUDGET on the boundary promotion; one that truncates instead of rounding the
          ratio, or that carries fewer than 4 decimals, collapses 0.8999 into 0.90 and reports
          OVERSPEND_WARNING on the sub-boundary promotion. Neither promotion may reach
          OVERSPENT, so the allocation posture must remain OPEN.
