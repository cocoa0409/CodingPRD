            - { call: "GET /fafsa/senior-records/${sr}", as: MatchReviewer, captures: { sr_v2: $.data.version } }
          trigger:
            - { call: "POST /fafsa/match-links", as: MatchReviewer, payload: { senior_record_id: "${sr}", aid_record_id: "${ar2}", expected_senior_record_version: "${sr_v2} - 1" }, captures: { err: $.data.error_id } }
            - { call: "POST /fafsa/match-links", as: MatchReviewer, payload: { senior_record_id: "${sr}", aid_record_id: "${ar2}", expected_senior_record_version: "${sr_v2}" }, captures: { lk2: $.data.id, lk2_st: $.data.status } }
          assert:
            - "First link: status AUTO_REJECTED (score 0.0), and it bumped SeniorRecord.version from ${sr_v1} to ${sr_v2}"
            - "Stale retry with expected ${sr_v2} - 1: error_id == ERR_STALE_VERSION (HTTP 412)"
            - "Retry with fresh ${sr_v2}: succeeds (AUTO_REJECTED again) — no link accumulation, exactly 2 links exist for the senior"

      - name: occ_report_publish_stale_campaign_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[report-publish-stale-campaign]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on Campaign.version: publishing with a version captured before an intervening campaign mutation (an event publish bumped it) is rejected 412; re-reading and republishing with the fresh version succeeds and supersedes nothing (first publish)."
        test_recipe:
          setup: ["Campaign OPEN; school ENROLLED; one GENERATED report; an event published AFTER the campaign version was captured"]
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 50000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/completion-reports", as: CampaignAdmin, payload: { campaign_id: "${camp}", variant: "SUBMISSION_BASED" }, captures: { rep: $.data.id } }
            - { call: "GET /fafsa/campaigns/${camp}", as: CampaignAdmin, captures: { camp_v: $.data.version } }
            - { call: "POST /fafsa/events", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", title: "E1", start_time: "2026-09-10T10:00:00Z", end_time: "2026-09-10T12:00:00Z", capacity: 10, cost_estimate_cents: 1000, required_expert_count: 0, supported_languages: [] }, captures: { ev: $.data.id } }
            - { call: "POST /fafsa/events/${ev}/publish", as: SchoolCoordinator, as_user_id: "${sch}" }
          trigger:
            - { call: "POST /fafsa/completion-reports/${rep}/publish", as: CampaignAdmin, payload: { expected_campaign_version: "${camp_v}" }, captures: { err: $.data.error_id } }
            - { call: "GET /fafsa/campaigns/${camp}", as: CampaignAdmin, captures: { camp_v2: $.data.version } }
            - { call: "POST /fafsa/completion-reports/${rep}/publish", as: CampaignAdmin, payload: { expected_campaign_version: "${camp_v2}" }, captures: { rep_st: $.data.status } }
          assert:
            - "First publish: error_id == ERR_STALE_VERSION (HTTP 412) — the event publish advanced Campaign.version past the captured value"
            - "Report remains GENERATED after the 412"
            - "Second publish with fresh version succeeds: status == PUBLISHED"

      - name: no_show_threshold_suspension_with_contagion
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.StaffProfile
          - state_machines.StaffAssignment
          - calculations.staff_hours_accrual
        distinguishing_aspect: "Cumulative threshold: the 2nd NO_SHOW (no_show_limit=2) flips the staff member to SUSPENDED and the contagion cascade cancels their future CONFIRMED assignment, releasing its hours — the first NO_SHOW alone triggers neither."
        test_recipe:
          setup: ["Campaign OPEN (no_show_limit 2, budget 100000); school ENROLLED; E1 Sep 10, E2 Sep 11, E3 Sep 12 (all PUBLISHED, 2h each); staff CLEARED with CONFIRMED assignments on all three (created before any confirm, windows on different days)"]
