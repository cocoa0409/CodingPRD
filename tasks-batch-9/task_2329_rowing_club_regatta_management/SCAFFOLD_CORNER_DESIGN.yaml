              as: SafetyOfficer
              as_user_id: "${dual_id}"
          assert:
            - "the call returns HTTP 403 with data.error_id == ERR_SELF_CLEARANCE_FORBIDDEN"
            - "WaterSession.${session_id}.status == PLANNED with reading_id == null"
            - "the identical call from the independent officer (X-User-ID ${officer_id}) succeeds and moves the session to CLEARED"

      - name: corner_jury_chair_cannot_open_review_on_own_protest_returns_403
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=26]
          - errors[ERR_JURY_CONFLICT_OF_INTEREST]
