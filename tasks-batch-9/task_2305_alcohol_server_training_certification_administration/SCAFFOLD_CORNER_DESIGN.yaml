        excluded_because:
          difficulty_instance: compensating_invariant / registry_acceptance_restores_the_assignment_but_never_revives_the_voided_dram_shop_document
          rationale: "That instance pins the escalated 525-cent penalty on attempt 2, and the on-time zero-penalty case is asserted by certificate_validity_and_registry_dimensions_advance_independently."

      - name: corner_seat_credit_ledger_identity
        claim_type: Correct Result
        grounds:
          - calculations.seat_credit_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / no_show_forfeits_its_seat_credit_while_withdrawal_returns_one_to_the_balance
          rationale: "That instance reconciles balance == purchased - consumed + refunded with a non-zero forfeit term."

      - name: corner_retake_gate_cooling_off_instant
        claim_type: Correct Result
        grounds:
          - calculations.retake_gate_evaluation
        excluded_because:
          difficulty_instance: non_linear_state_machine / enrollment_retake_cycle_reenters_exam_in_progress_and_voided_attempt_costs_no_retake
          rationale: "That instance pins retake_eligible_at at 2026-08-11T15:00:00Z and retakes at exactly that instant."

  # =========================================================================
  - section: validations
    instances:
      - name: anonymous_request_returns_unauthenticated_before_the_payload_is_parsed
        claim_type: Priority Ordering
        grounds:
          - validations.priority_1_ERR_UNAUTHENTICATED
          - validations.priority_3_ERR_INVALID_REQUEST
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: |
          A request that is both unauthenticated and missing a required field must return
          ERR_UNAUTHENTICATED (401), not ERR_INVALID_REQUEST (400) - priority 1 runs before
          any shape check, so no field-level detail may leak to an anonymous caller.
        test_recipe:
          setup:
            - "Empty database; no role header is supplied on the trigger call."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /state-jurisdictions"
              payload: { mandate_type: "MANDATORY" }
              as: none
          assert:
            - "response status == 401 and error.code == 'ERR_UNAUTHENTICATED'"
            - "error.code != 'ERR_INVALID_REQUEST' and the body names no missing field"
            - "no StateJurisdiction row was created: an authenticated POST /state-jurisdictions with state_code 'TX', mandate_type 'MANDATORY' and both tracks then returns 201 instead of ERR_IDENTITY_ALREADY_REGISTERED"

      - name: mandate_type_track_cardinality_is_enforced_in_both_directions
        claim_type: Violation → Error
        grounds:
          - validations.priority_23_ERR_MANDATE_TRACK_MISMATCH
          - entities.StateJurisdiction.fields.mandated_tracks
          - errors.ERR_MANDATE_TRACK_MISMATCH
        distinguishing_aspect: |
          MANDATORY requires exactly two mandated_tracks and VOLUNTARY requires exactly
          zero, so a MANDATORY jurisdiction listing one track and a VOLUNTARY jurisdiction
          listing one track both fail with ERR_MANDATE_TRACK_MISMATCH (422) - an
          implementation that only checked "non-empty" would accept both.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /state-jurisdictions"
              payload: { state_code: "TX", mandate_type: "MANDATORY", mandated_tracks: ["ON_PREMISE"] }
              as: ProgramAdmin
            - call: "POST /state-jurisdictions"
              payload: { state_code: "MT", mandate_type: "VOLUNTARY", mandated_tracks: ["ON_PREMISE"] }
              as: ProgramAdmin
            - call: "POST /state-jurisdictions"
              payload: { state_code: "NV", mandate_type: "CONDITIONAL", mandated_tracks: ["ON_PREMISE", "OFF_PREMISE"] }
              as: ProgramAdmin
          assert:
            - "the MANDATORY-with-one-track call returns 422 with error.code == 'ERR_MANDATE_TRACK_MISMATCH'"
            - "the VOLUNTARY-with-one-track call returns 422 with error.code == 'ERR_MANDATE_TRACK_MISMATCH'"
            - "the CONDITIONAL-with-two-tracks call returns 422 with error.code == 'ERR_MANDATE_TRACK_MISMATCH' (CONDITIONAL requires exactly one)"
            - "none of the three rejected filings persisted: a follow-up POST /state-jurisdictions with state_code 'TX', mandate_type 'MANDATORY' and both tracks returns 201, and the same for 'MT' with mandate_type 'VOLUNTARY' and mandated_tracks []"

      - name: state_code_and_server_email_uniqueness_both_return_identity_already_registered
        claim_type: Violation → Error
        grounds:
          - validations.priority_24_ERR_IDENTITY_ALREADY_REGISTERED
          - errors.ERR_IDENTITY_ALREADY_REGISTERED
        distinguishing_aspect: |
          Two different uniqueness scopes share one error code: a second TX jurisdiction and
          a second server with email ari@example.com both return
          ERR_IDENTITY_ALREADY_REGISTERED (409), while the same email under a different
          jurisdiction is still rejected because the email scope is global, not per-state.
        test_recipe:
          setup:
            - "A TX MANDATORY jurisdiction, an NV CONDITIONAL jurisdiction, and server Ari Cole registered in TX."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /state-jurisdictions"
              payload: { state_code: "TX", mandate_type: "MANDATORY", mandated_tracks: ["ON_PREMISE", "OFF_PREMISE"] }
              as: ProgramAdmin
              captures: { tx_id: $.data.id }
            - call: "POST /state-jurisdictions"
              payload: { state_code: "NV", mandate_type: "CONDITIONAL", mandated_tracks: ["ON_PREMISE"] }
              as: ProgramAdmin
              captures: { nv_id: $.data.id }
            - call: "POST /alcohol-servers"
              payload: { full_name: "Ari Cole", email: "ari@example.com", state_jurisdiction_id: "${tx_id}" }
              as: ProgramAdmin
              captures: { srv_id: $.data.id }
          trigger:
            - call: "POST /state-jurisdictions"
              payload: { state_code: "TX", mandate_type: "CONDITIONAL", mandated_tracks: ["OFF_PREMISE"] }
              as: ProgramAdmin
            - call: "POST /alcohol-servers"
              payload: { full_name: "Ari C. Cole", email: "ari@example.com", state_jurisdiction_id: "${nv_id}" }
              as: ProgramAdmin
          assert:
            - "the duplicate TX call returns 409 with error.code == 'ERR_IDENTITY_ALREADY_REGISTERED'"
            - "the duplicate-email call returns 409 with error.code == 'ERR_IDENTITY_ALREADY_REGISTERED' even though the jurisdiction differs"
            - "GET /alcohol-servers returns total_count 1 with the single row id ${srv_id}, and a POST /state-jurisdictions for state_code 'CA' with mandate_type 'VOLUNTARY' and mandated_tracks [] still returns 201 (only the TX code is taken)"

      - name: a_second_live_approval_request_for_the_same_course_and_state_is_rejected_until_the_first_is_decided
        claim_type: Violation → Error
        grounds:
          - validations.priority_25_ERR_DUPLICATE_APPROVAL_REQUEST
          - state_machines.CourseApproval.SUBMITTED_to_REJECTED
          - errors.ERR_DUPLICATE_APPROVAL_REQUEST
        distinguishing_aspect: |
          Uniqueness covers only live approvals: while the first request sits in SUBMITTED a
          second identical filing returns ERR_DUPLICATE_APPROVAL_REQUEST (409), but once the
          regulator REJECTs it the same filing succeeds - an implementation using an
          unconditional unique index would reject the post-rejection refiling too.
        test_recipe:
          setup:
            - "A TX MANDATORY jurisdiction and a PUBLISHED ON_PREMISE course with one SUBMITTED approval."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /state-jurisdictions"
              payload: { state_code: "TX", mandate_type: "MANDATORY", mandated_tracks: ["ON_PREMISE", "OFF_PREMISE"] }
              as: ProgramAdmin
              captures: { tx_id: $.data.id }
            - call: "POST /courses"
              payload: { title: "TIPS On-Premise Core", track: "ON_PREMISE", delivery_mode: "CLASSROOM", contact_hours: 4, question_count: 40, version_label: "v1" }
              as: ProgramAdmin
              captures: { course_id: $.data.id }
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /course-approvals"
              payload: { course_id: "${course_id}", state_jurisdiction_id: "${tx_id}", submission_note: "initial filing" }
              as: ProgramAdmin
              captures: { appr_id: $.data.id }
          trigger:
            - call: "POST /course-approvals"
              payload: { course_id: "${course_id}", state_jurisdiction_id: "${tx_id}", submission_note: "duplicate filing" }
              as: ProgramAdmin
            - call: "POST /course-approvals/${appr_id}/decision"
              payload: { decision: "REJECT", changes_requested_note: "content does not meet TX outline" }
              as: StateRegulator
            - call: "POST /course-approvals"
              payload: { course_id: "${course_id}", state_jurisdiction_id: "${tx_id}", submission_note: "refiled after rejection" }
              as: ProgramAdmin
              captures: { appr2_id: $.data.id }
          assert:
            - "the second call while SUBMITTED returns 409 with error.code == 'ERR_DUPLICATE_APPROVAL_REQUEST'"
            - "CourseApproval.${appr_id}.approval_status == 'REJECTED' and decided_at == '2026-08-03T09:00:00Z'"
            - "the refiling after rejection returns 201 with CourseApproval.${appr2_id}.approval_status == 'SUBMITTED' and review_round == 1"
            - "GET /course-approvals filtered by course_id ${course_id} returns total_count 2"

      - name: duplicate_seat_and_capacity_ceiling_are_distinct_rejections_on_one_open_roster
        claim_type: Satisfaction → Pass
        grounds:
          - validations.priority_26_ERR_DUPLICATE_ENROLLMENT
          - validations.priority_28_ERR_SESSION_AT_CAPACITY
          - errors.ERR_DUPLICATE_ENROLLMENT
          - errors.ERR_SESSION_AT_CAPACITY
        distinguishing_aspect: |
          On a capacity-2 roster the sequence duplicate-then-fill-then-overflow separates the
          two checks: Ari's re-enrollment fails with ERR_DUPLICATE_ENROLLMENT while only one
