scenario: |
  Merchant Mariner Credentialing & Crewing (vessel crewing department): credential/endorsement inventory & expiration tracking, sea-service documentation & upgrade eligibility, medical certificate & drug-test program participation, crew rotation & relief scheduling, travel & repatriation logistics, training course booking & reimbursement, union hall vs direct hire assignment, vessel manning requirement compliance

domain_name: merchant-mariner-crewing
api_prefix: /

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers: [optimistic_concurrency, cascading_side_effects, dual_variant_calculation, rate_threshold_triggers]
  entity_topology: graph            # mariners <-> vessels via Assignment/ManningSlot junctions; Credential self-referential prerequisite chain
  state_machine_shape: cyclic       # Credential renewal loops, SeaServiceRecord dispute loop, Assignment suspend/resume loop, parallel travel dimension
  relationship_patterns: [one_to_many, many_to_many, self_referential, cross_aggregate]
  role_model: segregation_of_duties # sea-service recorder != verifier; enrollment approver != reimburser
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Mariner
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Legal name of the mariner" }
      - { name: mariner_reference_number, type: string, source: input, description: "USCG-style reference number; unique across Mariner", constraints: "unique" }
      - { name: home_port_code, type: string, source: input, description: "Home port code (e.g. SFO, NOLA)" }
      - { name: hire_channel, type: enum, source: input, description: "DIRECT | UNION_HALL — default sourcing channel" }
      - { name: rank_track, type: enum, source: input, description: "DECK | ENGINE | STEWARD" }
      - { name: rank_grade, type: integer, source: input, description: "Seniority grade within track, 1 (lowest) .. 9 (highest)", constraints: "1..9" }
      - { name: primary_endorsement_code, type: string, source: input, description: "Endorsement code the mariner must hold VALID to be posture CLEAR (e.g. DECK_AB, CHIEF_MATE)" }
      - { name: annual_training_cap_cents, type: integer, source: input, default: 500000, description: "Annual training reimbursement cap; seeds auto-created TrainingBudget rows" }
      - { name: status, type: enum, source: system, description: "APPLICANT | ACTIVE | SUSPENDED | TERMINATED" }
      - { name: readiness_posture, type: enum, source: computed, description: "CLEAR | RESTRICTED | BLOCKED — derived per calculations.mariner_readiness_posture from status, MedicalCertificate, DrugTestRecord, Credential children" }
      - { name: readiness_reasons, type: array, source: computed, description: "List of reason codes contributing to current posture (see calculation)" }
      - { name: drug_test_current_until, type: datetime, source: computed, description: "Latest qualifying NEGATIVE drug test collected_date + 365 days; null if none" }
      - { name: no_show_strike_count, type: integer, source: system, default: 0, description: "Count of TrainingEnrollment NO_SHOW outcomes; at 2, training_privileges -> SUSPENDED" }
      - { name: training_privileges, type: enum, source: system, default: ENABLED, description: "ENABLED | SUSPENDED" }

  - name: Vessel
    parent: null
    common_fields: true
    fields:
      - { name: vessel_name, type: string, source: input, description: "Vessel name" }
      - { name: imo_number, type: string, source: input, description: "IMO number; unique across Vessel", constraints: "unique" }
      - { name: vessel_class, type: enum, source: input, description: "TANKER | CONTAINER | BULK | PASSENGER | OSV" }
      - { name: flag_state, type: string, source: input, description: "Flag state (e.g. US, MH)" }
      - { name: status, type: enum, source: system, description: "REGISTERED | ACTIVE | UNDERWAY | LAID_UP | DECOMMISSIONED" }
      - { name: compliance_posture, type: enum, source: computed, description: "COMPLIANT | DEFICIENT | CRITICAL_SHORTAGE — derived per calculations.manning_compliance_posture from ManningSlot coverage" }
      - { name: slots_total, type: integer, source: computed, description: "Count of ManningSlot with status ACTIVE on this vessel" }
      - { name: slots_covered, type: integer, source: computed, description: "Count of ACTIVE slots whose current_coverage == COVERED" }

  - name: ManningSlot
    parent: Vessel
    common_fields: true
    fields:
      - { name: vessel_id, type: string, source: system, description: "FK -> Vessel.id; billet belongs to this vessel's safe manning document" }
      - { name: position_code, type: string, source: input, description: "Billet position (MASTER, CHIEF_MATE, OICNW, AB, CHIEF_ENGINEER, SECOND_ENGINEER, QMED, COOK)" }
      - { name: rank_track, type: enum, source: input, description: "DECK | ENGINE | STEWARD — required track" }
      - { name: min_rank_grade, type: integer, source: input, description: "Minimum Mariner.rank_grade to fill this billet", constraints: "1..9" }
      - { name: required_endorsement_code, type: string, source: input, description: "Endorsement code a filler's VALID Credential must carry" }
      - { name: is_critical_position, type: boolean, source: input, default: false, description: "Critical billets (MASTER, CHIEF_ENGINEER) drive CRITICAL_SHORTAGE when uncovered" }
      - { name: standard_tour_days, type: integer, source: input, description: "Standard tour length for this billet" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }
      - { name: current_coverage, type: enum, source: computed, description: "COVERED iff exists Assignment on this slot with assignment_status == ONBOARD; else UNCOVERED" }

  - name: CrewRotationPlan
    parent: Vessel
    common_fields: true
    fields:
      - { name: vessel_id, type: string, source: system, description: "FK -> Vessel.id" }
      - { name: effective_from, type: datetime, source: input, description: "Window start (inclusive) for sign_on dates this plan governs" }
      - { name: effective_to, type: datetime, source: input, description: "Window end (exclusive)" }
      - { name: standard_tour_days, type: integer, source: input, description: "Default tour length under this plan" }
      - { name: max_handover_overlap_days, type: integer, source: input, default: 3, description: "Maximum allowed overlap (whole days, <=) between incoming and outgoing assignments on one slot" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED | ARCHIVED; at most one ACTIVE per vessel (creation supersedes prior)" }

  - name: Credential
    parent: Mariner
    common_fields: true
    fields:
      - { name: mariner_id, type: string, source: system, description: "FK -> Mariner.id" }
      - { name: credential_type, type: enum, source: input, description: "MMC_BASE | OFFICER_ENDORSEMENT | STCW | TANKER | SPECIAL" }
      - { name: endorsement_code, type: string, source: input, description: "Endorsement code (e.g. DECK_AB, OICNW, CHIEF_MATE, MASTER, STCW_II_1)" }
      - { name: prerequisite_credential_id, type: string, source: input, description: "FK -> Credential.id; optional self-referential prerequisite; must belong to same mariner and be VALID at issuance", constraints: "optional" }
      - { name: issue_date, type: datetime, source: input, description: "Issuance instant" }
      - { name: expiry_date, type: datetime, source: input, description: "Expiry instant; credential valid iff expiry_date >= current clock" }
      - { name: status, type: enum, source: system, description: "VALID | RENEWAL_PENDING | SUSPENDED_PREREQ | EXPIRED | REVOKED | LAPSED" }
      - { name: renewal_count, type: integer, source: system, default: 0, description: "Number of approved renewals" }

  - name: SeaServiceRecord
    parent: Mariner
    common_fields: true
    fields:
      - { name: mariner_id, type: string, source: system, description: "FK -> Mariner.id" }
      - { name: vessel_id, type: string, source: input, description: "FK -> Vessel.id; vessel the service was performed on" }
      - { name: position_code, type: string, source: input, description: "Position served (free-form code)" }
      - { name: rank_track, type: enum, source: input, description: "DECK | ENGINE | STEWARD — track served" }
      - { name: rank_grade, type: integer, source: input, description: "Grade served at (1..9)", constraints: "1..9" }
      - { name: service_region, type: enum, source: input, description: "OCEAN | NEAR_COASTAL | INLAND | GREAT_LAKES — day-credit factor source" }
      - { name: watch_schedule, type: enum, source: input, description: "EIGHT_HOUR | TWELVE_HOUR — TWELVE_HOUR earns 1.5x days" }
      - { name: start_date, type: datetime, source: input, description: "Service start (inclusive)" }
      - { name: end_date, type: datetime, source: input, description: "Service end (inclusive); must be >= start_date and <= current clock" }
      - { name: provisional_days, type: number, source: computed, description: "Calendar days inclusive = (end_date - start_date).days + 1; no factors" }
      - { name: verified_days, type: number, source: computed, description: "Null until VERIFIED; then floor-to-0.5 of calendar_days x region_factor x watch_multiplier" }
      - { name: record_status, type: enum, source: system, description: "DRAFT | SUBMITTED | VERIFIED | DISPUTED | REJECTED" }
      - { name: entered_by_user_id, type: string, source: system, description: "X-User-ID of creator (SoD anchor for verify)" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of verifying CredentialingOfficer" }
      - { name: dispute_reason, type: string, source: system, description: "Reason recorded on last dispute" }

  - name: MedicalCertificate
    parent: Mariner
    common_fields: true
    fields:
      - { name: mariner_id, type: string, source: system, description: "FK -> Mariner.id" }
      - { name: cert_type, type: enum, source: input, description: "USCG_MEDICAL | FLAG_STATE_MEDICAL | FIT_FOR_DUTY" }
      - { name: issue_date, type: datetime, source: input, description: "Issuance instant" }
      - { name: expiry_date, type: datetime, source: input, description: "Valid iff expiry_date >= current clock" }
      - { name: limitations, type: array, source: input, description: "Optional limitation codes", constraints: "optional, default []" }
      - { name: status, type: enum, source: system, description: "VALID | SUSPENDED | EXPIRED" }

  - name: DrugTestRecord
    parent: Mariner
    common_fields: true
    fields:
      - { name: mariner_id, type: string, source: system, description: "FK -> Mariner.id" }
      - { name: test_type, type: enum, source: input, description: "PRE_EMPLOYMENT | PERIODIC | RANDOM | REASONABLE_CAUSE | RETURN_TO_DUTY" }
      - { name: scheduled_date, type: datetime, source: input, description: "Scheduled collection date" }
      - { name: collected_date, type: datetime, source: system, description: "Set at record-result; qualifying NEGATIVE results extend drug_test_current_until to collected_date + 365d" }
      - { name: result, type: enum, source: system, description: "Null until recorded; then NEGATIVE | POSITIVE | REFUSAL" }
      - { name: status, type: enum, source: system, description: "PENDING | COMPLETED" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID that recorded the result" }

  - name: TrainingCourse
    parent: null
    common_fields: true
    fields:
      - { name: course_code, type: string, source: input, description: "Unique course code", constraints: "unique" }
      - { name: title, type: string, source: input, description: "Course title" }
      - { name: provider, type: string, source: input, description: "Training provider name" }
      - { name: grants_endorsement_code, type: string, source: input, description: "Endorsement code this course satisfies for upgrade eligibility; null if none", constraints: "optional" }
      - { name: start_date, type: datetime, source: input, description: "Course start" }
      - { name: end_date, type: datetime, source: input, description: "Course end (must be >= start_date)" }
      - { name: seat_capacity, type: integer, source: input, description: "Total seats" }
      - { name: seats_reserved, type: integer, source: system, default: 0, description: "Count of enrollments in {ENROLLED, COMPLETED, NO_SHOW, REIMBURSED}" }
      - { name: seats_open, type: integer, source: computed, description: "= seat_capacity - seats_reserved" }
      - { name: cost_cents, type: integer, source: input, description: "Tuition cost" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CANCELLED" }

  - name: TrainingEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: course_id, type: string, source: system, description: "FK -> TrainingCourse.id" }
      - { name: mariner_id, type: string, source: system, description: "FK -> Mariner.id; the requesting mariner (== X-User-ID at creation)" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | REJECTED | ENROLLED | COMPLETED | NO_SHOW | CANCELLED | REIMBURSED" }
      - { name: channel_snapshot, type: enum, source: system, description: "DIRECT | UNION_HALL — mariner.hire_channel captured at approval; drives reimbursement percent" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "Reserved at ENROLLED = round_half_up(min(course.cost_cents, PER_COURSE_CAP) x channel_pct)" }
      - { name: receipt_amount_cents, type: integer, source: system, description: "Receipt total supplied at reimburse" }
      - { name: reimbursed_amount_cents, type: integer, source: computed, description: "= min(receipt_amount_cents, provisional_amount_cents) at REIMBURSED" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of requester" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approver (SoD anchor for reimburse)" }
      - { name: reimbursed_by_user_id, type: string, source: system, description: "X-User-ID of reimburser" }

  - name: TrainingBudget
    parent: Mariner
    common_fields: true
    fields:
      - { name: mariner_id, type: string, source: system, description: "FK -> Mariner.id" }
      - { name: fiscal_year, type: integer, source: system, description: "Calendar year of course start_date this budget row covers" }
      - { name: annual_cap_cents, type: integer, source: system, description: "Cap copied from Mariner.annual_training_cap_cents at auto-creation" }
      - { name: reserved_cents, type: integer, source: system, default: 0, description: "Sum of provisional_amount_cents over enrollments in {ENROLLED, COMPLETED} for this mariner+year" }
      - { name: used_cents, type: integer, source: system, default: 0, description: "Sum of reimbursed_amount_cents over REIMBURSED enrollments for this mariner+year" }
      - { name: available_cents, type: integer, source: computed, description: "= annual_cap_cents - reserved_cents - used_cents" }

  - name: UnionHall
    parent: null
    common_fields: true
    fields:
      - { name: local_number, type: string, source: input, description: "Union local number; unique", constraints: "unique" }
      - { name: name, type: string, source: input, description: "Hall name" }
      - { name: region, type: string, source: input, description: "Region code" }

  - name: UnionRegistration
    parent: null
    common_fields: true
    fields:
      - { name: hall_id, type: string, source: system, description: "FK -> UnionHall.id" }
      - { name: mariner_id, type: string, source: input, description: "FK -> Mariner.id" }
      - { name: seniority_date, type: datetime, source: input, description: "Hall seniority date" }
      - { name: shipping_card_number, type: string, source: input, description: "Shipping card number" }
      - { name: dues_current_until, type: datetime, source: system, description: "Dues paid-through date; dispatch requires >= assignment sign_on_date; set at creation = seniority_date, extended via extend-dues" }
      - { name: status, type: enum, source: system, description: "REGISTERED | SUSPENDED" }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: mariner_id, type: string, source: input, description: "FK -> Mariner.id" }
      - { name: manning_slot_id, type: string, source: input, description: "FK -> ManningSlot.id" }
      - { name: vessel_id, type: string, source: system, description: "FK -> Vessel.id; denormalized from the slot's vessel at creation" }
      - { name: union_registration_id, type: string, source: input, description: "FK -> UnionRegistration.id; required iff assignment_channel == UNION_DISPATCH", constraints: "conditional" }
      - { name: assignment_channel, type: enum, source: input, description: "DIRECT_HIRE | UNION_DISPATCH" }
      - { name: relief_of_assignment_id, type: string, source: input, description: "FK -> Assignment.id; optional link to the outgoing assignment this one relieves", constraints: "optional" }
      - { name: sign_on_date, type: datetime, source: input, description: "Planned sign-on (must be >= current clock at creation, < planned_relief_date)" }
      - { name: planned_relief_date, type: datetime, source: input, description: "Planned relief end (> sign_on_date)" }
      - { name: local_join, type: boolean, source: input, default: false, description: "Mariner already at port; travel_status starts WAIVED" }
      - { name: actual_sign_on_at, type: datetime, source: system, description: "Set at sign-on" }
      - { name: actual_relieved_at, type: datetime, source: system, description: "Set at relieve" }
      - { name: assignment_status, type: enum, source: system, description: "PROPOSED | CONFIRMED | ONBOARD | SUSPENDED | RELIEVED | CLOSED | CANCELLED" }
      - { name: travel_status, type: enum, source: system, description: "PENDING | READY | WAIVED — parallel dimension driven by JOIN TravelBookings" }
      - { name: repatriation_status, type: enum, source: system, description: "NOT_DUE | DUE | ARRANGED | COMPLETED — parallel dimension driven by REPATRIATION TravelBookings" }

  - name: TravelBooking
    parent: Assignment
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: system, description: "FK -> Assignment.id" }
      - { name: direction, type: enum, source: system, description: "JOIN | REPATRIATION; REPATRIATION bookings are system-created at relieve" }
      - { name: legs, type: array, source: input, description: "Array of {carrier, from_port, to_port, depart_at, arrive_at, base_fare_cents, markup_bps}; JOIN requires >= 1 leg at create" }
      - { name: payer, type: enum, source: input, description: "VESSEL_OWNER | UNION_HALL | MARINER" }
      - { name: total_fare_cents, type: integer, source: computed, description: "Sum of per-leg round_half_up(base_fare_cents x (1 + markup_bps/10000)); per-leg rounding THEN sum (order pinned)" }
      - { name: cancellation_fee_cents, type: integer, source: computed, description: "Null until CANCELLED from TICKETED; then round_half_up(total_fare_cents x 0.15); 0 otherwise" }
      - { name: status, type: enum, source: system, description: "QUOTED | BOOKED | TICKETED | COMPLETED | CANCELLED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Mariner
    field: status
    initial_state: APPLICANT
    terminal_states: [TERMINATED]
    transitions:
      - from: APPLICANT
        to: ACTIVE
        trigger: "POST /mariners/{id}/activate"
        actor: FleetAdmin
        preconditions:
          - ">= 1 MedicalCertificate with status VALID and expiry_date >= now (else ERR_MARINER_ACTIVATION_REQUIREMENTS_MISSING)"
          - ">= 1 COMPLETED DrugTestRecord with result NEGATIVE and collected_date + 365d >= now (else ERR_MARINER_ACTIVATION_REQUIREMENTS_MISSING)"
          - ">= 1 Credential with status VALID (else ERR_MARINER_ACTIVATION_REQUIREMENTS_MISSING)"
        side_effects:
          - "recompute readiness_posture (calculations.mariner_readiness_posture)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /mariners/{id}/suspend"
        actor: FleetAdmin
        preconditions: []
        side_effects:
          - "readiness_posture -> BLOCKED (reason STATUS_NOT_ACTIVE)"
          - "all CONFIRMED Assignments of this mariner -> SUSPENDED (cascade; slot coverage and Vessel.compliance_posture recompute)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /mariners/{id}/reinstate"
        actor: FleetAdmin
        preconditions:
          - "same three activation gates re-checked (medical VALID, drug currency, VALID credential) else ERR_MARINER_ACTIVATION_REQUIREMENTS_MISSING"
        side_effects:
          - "recompute readiness_posture"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /mariners/{id}/terminate"
        actor: FleetAdmin
        preconditions:
          - "no Assignment with assignment_status == ONBOARD for this mariner (else ERR_ACTIVE_CREW_ABOARD)"
        side_effects:
          - "readiness_posture -> BLOCKED"
          - "all PROPOSED and CONFIRMED Assignments -> CANCELLED (cascade; their non-terminal TravelBookings -> CANCELLED with fees computed for TICKETED)"
          - "all REQUESTED TrainingEnrollments -> REJECTED; APPROVED -> CANCELLED (cascade)"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /mariners/{id}/terminate"
        actor: FleetAdmin
        preconditions:
          - "no Assignment with assignment_status == ONBOARD for this mariner (else ERR_ACTIVE_CREW_ABOARD)"
        side_effects:
          - "same cascades as ACTIVE -> TERMINATED"

  - entity: Vessel
    field: status
    initial_state: REGISTERED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: REGISTERED
        to: ACTIVE
        trigger: "POST /vessels/{id}/activate"
        actor: FleetAdmin
        preconditions:
          - ">= 1 ManningSlot with status ACTIVE (else ERR_NO_MANNING_SLOTS)"
        side_effects:
          - "recompute compliance_posture"
      - from: ACTIVE
        to: UNDERWAY
        trigger: "POST /vessels/{id}/mark-underway"
        actor: PortCaptain
        preconditions:
          - "compliance_posture == COMPLIANT, OR (compliance_posture == DEFICIENT AND waiver_justification provided); CRITICAL_SHORTAGE always rejected (ERR_VESSEL_NOT_COMPLIANT)"
        side_effects: []
      - from: UNDERWAY
        to: ACTIVE
        trigger: "POST /vessels/{id}/return-to-port"
        actor: PortCaptain
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: LAID_UP
        trigger: "POST /vessels/{id}/lay-up"
        actor: PortCaptain
        preconditions:
          - "no Assignment on any slot of this vessel with assignment_status == ONBOARD (else ERR_ACTIVE_CREW_ABOARD)"
        side_effects:
          - "all PROPOSED and CONFIRMED Assignments on this vessel's slots -> CANCELLED (cascade; their non-terminal TravelBookings -> CANCELLED with TICKETED fees)"
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "POST /vessels/{id}/decommission"
        actor: FleetAdmin
        preconditions:
          - "no Assignment on any slot of this vessel with assignment_status in {PROPOSED, CONFIRMED, ONBOARD, SUSPENDED} (else ERR_ACTIVE_CREW_ABOARD)"
        side_effects:
          - "all ManningSlots of this vessel -> RETIRED"
          - "ACTIVE CrewRotationPlan (if any) -> SUPERSEDED"
      - from: LAID_UP
        to: DECOMMISSIONED
        trigger: "POST /vessels/{id}/decommission"
        actor: FleetAdmin
        preconditions: []
        side_effects:
          - "all ManningSlots of this vessel -> RETIRED"
          - "ACTIVE CrewRotationPlan (if any) -> SUPERSEDED"

  - entity: ManningSlot
    field: status
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /vessels/{id}/manning-slots/{slotId}/retire"
        actor: PortCaptain
        preconditions:
          - "no Assignment on this slot with assignment_status in {PROPOSED, CONFIRMED, ONBOARD, SUSPENDED} (else ERR_SLOT_HAS_OPEN_ASSIGNMENTS)"
        side_effects:
          - "recompute Vessel.compliance_posture, slots_total, slots_covered"

  - entity: CrewRotationPlan
    field: status
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (POST /vessels/{id}/rotation-plans supersedes the prior ACTIVE plan of the same vessel)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUPERSEDED
        to: ARCHIVED
        trigger: "POST /vessels/{id}/rotation-plans/{planId}/archive"
        actor: CrewingManager
        preconditions: []
        side_effects: []

  - entity: Credential
    field: status
    initial_state: VALID
    terminal_states: [REVOKED, LAPSED]
    transitions:
      - from: VALID
        to: RENEWAL_PENDING
        trigger: "POST /mariners/{id}/credentials/{credentialId}/submit-renewal"
        actor: "Mariner (self) | CredentialingOfficer"
        preconditions:
          - "credential in VALID or EXPIRED (else ERR_CREDENTIAL_NOT_RENEWABLE)"
        side_effects: []
      - from: EXPIRED
        to: RENEWAL_PENDING
        trigger: "POST /mariners/{id}/credentials/{credentialId}/submit-renewal (late renewal; only reachable while EXPIRED, i.e. before the LAPSED sweep at expiry_date + 180d)"
        actor: "Mariner (self) | CredentialingOfficer"
        preconditions:
          - "credential in VALID or EXPIRED (else ERR_CREDENTIAL_NOT_RENEWABLE)"
        side_effects: []
      - from: RENEWAL_PENDING
        to: VALID
        trigger: "POST /mariners/{id}/credentials/{credentialId}/approve-renewal"
        actor: CredentialingOfficer
        preconditions:
          - "credential in RENEWAL_PENDING (else ERR_RENEWAL_NOT_PENDING)"
          - "new_expiry_date > new_issue_date and new_expiry_date > now (else ERR_INVALID_REQUEST)"
          - "if prerequisite_credential_id set: prerequisite must be VALID (else ERR_ENDORSEMENT_PREREQUISITE_INVALID)"
        side_effects:
          - "issue_date := new_issue_date; expiry_date := new_expiry_date; renewal_count += 1"
          - "dependent Credentials (prerequisite_credential_id == this) in SUSPENDED_PREREQ -> VALID (cascade)"
          - "recompute Mariner.readiness_posture; resume-eligible SUSPENDED assignments stay SUSPENDED until /resume"
      - from: RENEWAL_PENDING
        to: VALID
        trigger: "POST /mariners/{id}/credentials/{credentialId}/deny-renewal"
        actor: CredentialingOfficer
        preconditions:
          - "credential in RENEWAL_PENDING (else ERR_RENEWAL_NOT_PENDING)"
        side_effects:
          - "issue_date and expiry_date unchanged (if expiry_date already past, the next clock sweep re-expires it)"
          - "recompute Mariner.readiness_posture"
      - from: VALID
        to: REVOKED
        trigger: "POST /mariners/{id}/credentials/{credentialId}/revoke"
        actor: CredentialingOfficer
        preconditions:
          - "credential in VALID (else ERR_CREDENTIAL_NOT_VALID)"
        side_effects:
          - "dependent Credentials (prerequisite_credential_id == this) in VALID or RENEWAL_PENDING -> SUSPENDED_PREREQ (cascade)"
          - "recompute Mariner.readiness_posture -> may flip BLOCKED (reason NO_VALID_PRIMARY_CREDENTIAL)"
          - "if mariner posture becomes BLOCKED: future CONFIRMED Assignments of mariner -> SUSPENDED (cascade; coverage/posture recompute)"
      - from: VALID
        to: EXPIRED
        trigger: "system (clock sweep on POST /_clock/set_current_utc: expiry_date < now)"
        actor: system
        preconditions: []
        side_effects:
          - "dependent Credentials (prerequisite_credential_id == this) in VALID or RENEWAL_PENDING -> SUSPENDED_PREREQ (cascade)"
          - "recompute Mariner.readiness_posture; if it becomes BLOCKED: future CONFIRMED Assignments -> SUSPENDED; ManningSlot.current_coverage and Vessel.compliance_posture recompute"
      - from: RENEWAL_PENDING
        to: EXPIRED
        trigger: "system (clock sweep: expiry_date < now)"
        actor: system
        preconditions: []
        side_effects:
          - "same cascade as VALID -> EXPIRED"
      - from: VALID
        to: SUSPENDED_PREREQ
        trigger: "system (prerequisite cascade: this credential's prerequisite_credential_id became EXPIRED, REVOKED, or LAPSED)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute Mariner.readiness_posture"
      - from: RENEWAL_PENDING
        to: SUSPENDED_PREREQ
        trigger: "system (prerequisite cascade, same as above)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute Mariner.readiness_posture"
      - from: SUSPENDED_PREREQ
        to: EXPIRED
        trigger: "system (clock sweep: expiry_date < now)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute Mariner.readiness_posture"
      - from: SUSPENDED_PREREQ
        to: VALID
        trigger: "system (when prerequisite credential returns to VALID via approve-renewal)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute Mariner.readiness_posture"
      - from: EXPIRED
        to: LAPSED
        trigger: "system (clock sweep: expiry_date + 180d < now)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute Mariner.readiness_posture (LAPSED credentials can never renew)"

  - entity: SeaServiceRecord
    field: record_status
    initial_state: DRAFT
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /mariners/{id}/sea-service-records/{recordId}/submit"
        actor: "Mariner (self) | CredentialingOfficer"
        preconditions:
          - "record in DRAFT or DISPUTED (else ERR_RECORD_NOT_SUBMITTABLE)"
          - "end_date >= start_date and end_date <= now (else ERR_INVALID_REQUEST)"
        side_effects: []
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /mariners/{id}/sea-service-records/{recordId}/submit (resubmission after dispute)"
        actor: "Mariner (self) | CredentialingOfficer"
        preconditions:
          - "record in DRAFT or DISPUTED (else ERR_RECORD_NOT_SUBMITTABLE)"
        side_effects: []
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /mariners/{id}/sea-service-records/{recordId}/verify"
        actor: CredentialingOfficer
        preconditions:
          - "record in SUBMITTED (else ERR_RECORD_NOT_VERIFIABLE)"
          - "X-User-ID != entered_by_user_id (segregation of duties; else ERR_SOD_VERIFY_SAME_RECORDER)"
        side_effects:
          - "compute verified_days per calculations.sea_service_day_credit (verified variant)"
          - "verified_by_user_id := X-User-ID"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /mariners/{id}/sea-service-records/{recordId}/dispute"
        actor: CredentialingOfficer
        preconditions:
          - "record in SUBMITTED (else ERR_RECORD_NOT_VERIFIABLE)"
        side_effects:
          - "dispute_reason := input reason"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /mariners/{id}/sea-service-records/{recordId}/reject"
        actor: CredentialingOfficer
        preconditions:
          - "record in SUBMITTED or DISPUTED (else ERR_RECORD_NOT_VERIFIABLE)"
        side_effects: []
      - from: DISPUTED
        to: REJECTED
        trigger: "POST /mariners/{id}/sea-service-records/{recordId}/reject"
        actor: CredentialingOfficer
        preconditions:
          - "record in SUBMITTED or DISPUTED (else ERR_RECORD_NOT_VERIFIABLE)"
        side_effects: []

  - entity: MedicalCertificate
    field: status
    initial_state: VALID
    terminal_states: [EXPIRED]
    transitions:
      - from: VALID
        to: SUSPENDED
        trigger: "POST /mariners/{id}/medical-certificates/{certId}/suspend"
        actor: CredentialingOfficer
        preconditions:
          - "certificate in VALID (else ERR_MEDICAL_CERT_NOT_VALID)"
        side_effects:
          - "recompute Mariner.readiness_posture (SUSPENDED medical does not satisfy the medical gate -> typically BLOCKED)"
          - "if posture becomes BLOCKED: future CONFIRMED Assignments of mariner -> SUSPENDED (cascade)"
      - from: SUSPENDED
        to: VALID
        trigger: "POST /mariners/{id}/medical-certificates/{certId}/reinstate"
        actor: CredentialingOfficer
        preconditions:
          - "certificate in SUSPENDED (else ERR_MEDICAL_CERT_NOT_VALID)"
        side_effects:
          - "recompute Mariner.readiness_posture"
      - from: VALID
        to: EXPIRED
        trigger: "system (clock sweep: expiry_date < now)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute Mariner.readiness_posture; if BLOCKED: future CONFIRMED Assignments -> SUSPENDED; coverage/posture recompute"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system (clock sweep: expiry_date < now)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute Mariner.readiness_posture"

  - entity: DrugTestRecord
    field: status
    initial_state: PENDING
    terminal_states: [COMPLETED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /mariners/{id}/drug-tests/{testId}/record-result"
        actor: CredentialingOfficer
        preconditions:
          - "test in PENDING (else ERR_DRUG_TEST_NOT_PENDING)"
          - "result in {NEGATIVE, POSITIVE, REFUSAL} (else ERR_INVALID_REQUEST)"
        side_effects:
          - "collected_date := input collected_date; recorded_by_user_id := X-User-ID"
          - "result NEGATIVE: recompute Mariner.drug_test_current_until = max over qualifying NEGATIVE collected_date + 365d; recompute posture"
          - "result POSITIVE or REFUSAL: Mariner.readiness_posture -> BLOCKED (reason DRUG_RESULT_POSITIVE); all CONFIRMED Assignments of mariner -> SUSPENDED (cascade; coverage/posture recompute)"

  - entity: TrainingCourse
    field: status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /training-courses/{id}/cancel"
        actor: FleetAdmin
        preconditions:
          - "course in SCHEDULED (else ERR_COURSE_NOT_SCHEDULED)"
        side_effects:
          - "enrollments in REQUESTED -> REJECTED; APPROVED -> CANCELLED (cascade, no budget effect)"
          - "enrollments in ENROLLED -> CANCELLED (cascade: TrainingBudget.reserved_cents -= provisional_amount_cents each; seats_reserved -= 1 each)"

  - entity: TrainingEnrollment
    field: status
    initial_state: REQUESTED
    terminal_states: [REIMBURSED, REJECTED, CANCELLED, NO_SHOW]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /training-enrollments/{id}/approve"
        actor: CrewingManager
        preconditions:
          - "enrollment in REQUESTED (else ERR_INVALID_STATE)"
          - "mariner readiness_posture != BLOCKED (else ERR_MARINER_NOT_CLEAR)"
        side_effects:
          - "channel_snapshot := mariner.hire_channel; approved_by_user_id := X-User-ID"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /training-enrollments/{id}/reject, or system cascade (training_privileges suspension / course cancel / mariner terminate)"
        actor: "CrewingManager | system"
        preconditions:
          - "enrollment in REQUESTED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: APPROVED
        to: ENROLLED
        trigger: "POST /training-enrollments/{id}/enroll"
        actor: FleetAdmin
        preconditions:
          - "enrollment in APPROVED (else ERR_INVALID_STATE)"
          - "course.status == SCHEDULED (else ERR_COURSE_NOT_SCHEDULED)"
          - "mariner readiness_posture != BLOCKED (else ERR_MARINER_NOT_CLEAR)"
          - "course.seats_open >= 1 (else ERR_COURSE_FULL)"
          - "TrainingBudget availability: evaluated against the existing row for (mariner, fiscal_year of course.start_date), or against mariner.annual_training_cap_cents when no row exists yet; insufficient -> ERR_TRAINING_BUDGET_EXCEEDED. The budget row is persisted ONLY on successful enroll (auto-created with annual_cap_cents := mariner.annual_training_cap_cents if absent)"
        side_effects:
          - "compute provisional_amount_cents per calculations.training_reimbursement (provisional variant)"
          - "TrainingBudget.reserved_cents += provisional_amount_cents"
          - "course.seats_reserved += 1 (seats_open recomputed)"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /training-enrollments/{id}/cancel, or system cascade (training_privileges suspension / course cancel / mariner terminate)"
        actor: "Mariner (self) | CrewingManager | FleetAdmin | system"
        preconditions:
          - "enrollment in APPROVED or ENROLLED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: ENROLLED
        to: CANCELLED
        trigger: "POST /training-enrollments/{id}/cancel"
        actor: "Mariner (self) | CrewingManager | FleetAdmin"
        preconditions:
          - "enrollment in APPROVED or ENROLLED (else ERR_INVALID_STATE)"
        side_effects:
          - "TrainingBudget.reserved_cents -= provisional_amount_cents"
          - "course.seats_reserved -= 1 (seat released)"
      - from: ENROLLED
        to: COMPLETED
        trigger: "POST /training-enrollments/{id}/record-completion with outcome == COMPLETED"
        actor: FleetAdmin
        preconditions:
          - "enrollment in ENROLLED (else ERR_INVALID_STATE)"
        side_effects:
          - "seat and budget reservation retained (reserved_cents unchanged) until reimburse"
      - from: ENROLLED
        to: NO_SHOW
        trigger: "POST /training-enrollments/{id}/record-completion with outcome == NO_SHOW"
        actor: FleetAdmin
        preconditions:
          - "enrollment in ENROLLED (else ERR_INVALID_STATE)"
        side_effects:
          - "TrainingBudget.reserved_cents -= provisional_amount_cents (seat is NOT released: seats_reserved unchanged)"
          - "Mariner.no_show_strike_count += 1"
          - "if no_show_strike_count >= 2: Mariner.training_privileges -> SUSPENDED; all REQUESTED enrollments of mariner -> REJECTED; all APPROVED enrollments of mariner -> CANCELLED (cascade)"
      - from: COMPLETED
        to: REIMBURSED
        trigger: "POST /training-enrollments/{id}/reimburse"
        actor: FleetAdmin
        preconditions:
          - "enrollment in COMPLETED (else ERR_INVALID_STATE)"
          - "X-User-ID != approved_by_user_id (segregation of duties; else ERR_SOD_REIMBURSE_SAME_APPROVER)"
        side_effects:
          - "reimbursed_amount_cents := min(receipt_amount_cents, provisional_amount_cents)"
          - "TrainingBudget.used_cents += reimbursed_amount_cents; reserved_cents -= provisional_amount_cents"
          - "reimbursed_by_user_id := X-User-ID"

  - entity: UnionRegistration
    field: status
    initial_state: REGISTERED
    terminal_states: []
    transitions:
      - from: REGISTERED
        to: SUSPENDED
        trigger: "POST /union-halls/{id}/registrations/{registrationId}/suspend"
        actor: "UnionDispatcher (own hall) | FleetAdmin"
        preconditions:
          - "registration in REGISTERED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: SUSPENDED
        to: REGISTERED
        trigger: "POST /union-halls/{id}/registrations/{registrationId}/reinstate"
        actor: "UnionDispatcher (own hall) | FleetAdmin"
        preconditions:
          - "registration in SUSPENDED (else ERR_INVALID_STATE)"
        side_effects: []

  - entity: Assignment
    field: assignment_status
    initial_state: PROPOSED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /assignments/{id}/confirm"
        actor: "CrewingManager (DIRECT_HIRE) | UnionDispatcher (UNION_DISPATCH, own hall)"
        preconditions:
          - "assignment in PROPOSED (else ERR_INVALID_STATE)"
          - "actor role matches assignment_channel and, for UNION_DISPATCH, X-User-ID == union_registration.hall_id (else ERR_CHANNEL_NOT_PERMITTED / ERR_FORBIDDEN_RESOURCE_ACCESS)"
          - "mariner readiness_posture == CLEAR, or (RESTRICTED and planned_relief_date <= earliest restricting expiry) (else ERR_MARINER_NOT_CLEAR / ERR_RESTRICTED_WINDOW_EXCEEDED)"
          - "mariner still holds VALID credential with slot.required_endorsement_code (else ERR_ENDORSEMENT_MISMATCH)"
          - "mariner rank_track == slot.rank_track and rank_grade >= slot.min_rank_grade (else ERR_RANK_BELOW_MINIMUM)"
          - "mariner strict overlap re-check vs own assignments in {CONFIRMED, ONBOARD, SUSPENDED} (else ERR_MARINER_ASSIGNMENT_OVERLAP)"
          - "slot handover overlap re-check vs slot assignments in {CONFIRMED, ONBOARD} (else ERR_HANDOVER_WINDOW_EXCEEDED)"
          - "for UNION_DISPATCH: registration REGISTERED and dues_current_until >= sign_on_date (else ERR_UNION_REGISTRATION_INVALID / ERR_DUES_NOT_CURRENT)"
        side_effects:
          - "travel_status := WAIVED if local_join else PENDING"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /assignments/{id}/cancel, or system cascade (vessel lay-up, mariner terminate)"
        actor: "CrewingManager | UnionDispatcher (own hall, UNION_DISPATCH) | system"
        preconditions:
          - "assignment in PROPOSED, CONFIRMED, or SUSPENDED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /assignments/{id}/cancel, or system cascade"
        actor: "CrewingManager | UnionDispatcher (own hall, UNION_DISPATCH) | system"
        preconditions:
          - "assignment in PROPOSED, CONFIRMED, or SUSPENDED (else ERR_INVALID_STATE)"
        side_effects:
          - "all TravelBookings of this assignment in {QUOTED, BOOKED, TICKETED} -> CANCELLED (cascade; TICKETED ones compute cancellation_fee_cents)"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /assignments/{id}/cancel"
        actor: "CrewingManager | UnionDispatcher (own hall, UNION_DISPATCH)"
        preconditions:
          - "assignment in PROPOSED, CONFIRMED, or SUSPENDED (else ERR_INVALID_STATE)"
        side_effects:
          - "same travel cascade as CONFIRMED -> CANCELLED"
      - from: CONFIRMED
        to: ONBOARD
        trigger: "POST /assignments/{id}/sign-on"
        actor: "CrewingManager | PortCaptain"
        preconditions:
          - "assignment in CONFIRMED (else ERR_INVALID_STATE)"
          - "now >= sign_on_date (else ERR_SIGN_ON_TOO_EARLY)"
          - "travel_status in {READY, WAIVED} (else ERR_TRAVEL_NOT_READY)"
          - "mariner readiness_posture != BLOCKED (else ERR_MARINER_NOT_CLEAR)"
        side_effects:
          - "actual_sign_on_at := now"
          - "ManningSlot.current_coverage recompute (this slot becomes COVERED); Vessel.slots_covered and compliance_posture recompute"
      - from: CONFIRMED
        to: SUSPENDED
        trigger: "system (mariner readiness_posture flipped to BLOCKED: credential/medical/drug cascades or mariner suspend)"
        actor: system
        preconditions: []
        side_effects:
          - "ManningSlot coverage / Vessel posture recompute (CONFIRMED does not cover; no change)"
      - from: ONBOARD
        to: SUSPENDED
        trigger: "system (mariner readiness_posture flipped to BLOCKED mid-tour)"
        actor: system
        preconditions: []
        side_effects:
          - "ManningSlot.current_coverage recompute (slot becomes UNCOVERED); Vessel.compliance_posture recompute (may flip to DEFICIENT or CRITICAL_SHORTAGE)"
      - from: SUSPENDED
        to: CONFIRMED
        trigger: "POST /assignments/{id}/resume when actual_sign_on_at is null"
        actor: CrewingManager
        preconditions:
          - "assignment in SUSPENDED (else ERR_INVALID_STATE)"
          - "mariner readiness_posture in {CLEAR, RESTRICTED with planned_relief_date <= earliest restricting expiry} (else ERR_MARINER_NOT_CLEAR / ERR_RESTRICTED_WINDOW_EXCEEDED)"
        side_effects: []
      - from: SUSPENDED
        to: ONBOARD
        trigger: "POST /assignments/{id}/resume when actual_sign_on_at is set"
        actor: CrewingManager
        preconditions:
          - "assignment in SUSPENDED (else ERR_INVALID_STATE)"
          - "mariner readiness_posture in {CLEAR, RESTRICTED} (else ERR_MARINER_NOT_CLEAR)"
        side_effects:
          - "ManningSlot.current_coverage / Vessel.compliance_posture recompute"
      - from: ONBOARD
        to: RELIEVED
        trigger: "POST /assignments/{id}/relieve"
        actor: CrewingManager
        preconditions:
          - "assignment in ONBOARD (else ERR_INVALID_STATE)"
          - "another Assignment on the same ManningSlot (different id) has assignment_status == ONBOARD (else ERR_RELIEF_NOT_ONBOARD)"
        side_effects:
          - "actual_relieved_at := now; repatriation_status -> DUE"
          - "auto-create TravelBooking(direction=REPATRIATION, legs=[], payer=VESSEL_OWNER, status=QUOTED) under this assignment (cascade)"
          - "ManningSlot.current_coverage stays COVERED (incoming ONBOARD); Vessel posture recompute"
      - from: RELIEVED
        to: CLOSED
        trigger: "POST /assignments/{id}/close"
        actor: CrewingManager
        preconditions:
          - "assignment in RELIEVED (else ERR_INVALID_STATE)"
          - "repatriation_status == COMPLETED (else ERR_REPATRIATION_INCOMPLETE)"
        side_effects: []

  - entity: Assignment
    field: travel_status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: READY
        trigger: "system (a JOIN TravelBooking of this assignment reaches TICKETED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: READY
        to: PENDING
        trigger: "system (the last TICKETED/COMPLETED JOIN TravelBooking is CANCELLED and no other TICKETED+ JOIN booking remains)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: WAIVED
        trigger: "system (at confirm when local_join == true)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Assignment
    field: repatriation_status
    initial_state: NOT_DUE
    terminal_states: [COMPLETED]
    transitions:
      - from: NOT_DUE
        to: DUE
        trigger: "system (assignment ONBOARD -> RELIEVED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DUE
        to: ARRANGED
        trigger: "system (REPATRIATION TravelBooking reaches TICKETED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ARRANGED
        to: COMPLETED
        trigger: "system (REPATRIATION TravelBooking reaches COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TravelBooking
    field: status
    initial_state: QUOTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: QUOTED
        to: BOOKED
        trigger: "POST /assignments/{id}/travel-bookings/{bookingId}/book"
        actor: CrewingManager
        preconditions:
          - "booking in QUOTED (else ERR_INVALID_STATE)"
          - "legs non-empty (else ERR_NO_TRAVEL_LEGS)"
        side_effects: []
      - from: BOOKED
        to: TICKETED
        trigger: "POST /assignments/{id}/travel-bookings/{bookingId}/ticket"
        actor: CrewingManager
        preconditions:
          - "booking in BOOKED (else ERR_INVALID_STATE)"
        side_effects:
          - "compute total_fare_cents per calculations.travel_fare_total (per-leg rounding, then sum)"
          - "if direction == JOIN: assignment.travel_status -> READY; if direction == REPATRIATION: assignment.repatriation_status -> ARRANGED"
      - from: TICKETED
        to: COMPLETED
        trigger: "POST /assignments/{id}/travel-bookings/{bookingId}/complete"
        actor: CrewingManager
        preconditions:
          - "booking in TICKETED (else ERR_INVALID_STATE)"
        side_effects:
          - "if direction == REPATRIATION: assignment.repatriation_status -> COMPLETED"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /assignments/{id}/travel-bookings/{bookingId}/cancel, or system cascade (assignment cancel)"
        actor: "CrewingManager | system"
        preconditions:
          - "booking in QUOTED, BOOKED, or TICKETED (else ERR_INVALID_STATE)"
        side_effects:
          - "cancellation_fee_cents := 0"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /assignments/{id}/travel-bookings/{bookingId}/cancel, or system cascade"
        actor: "CrewingManager | system"
        preconditions:
          - "booking in QUOTED, BOOKED, or TICKETED (else ERR_INVALID_STATE)"
        side_effects:
          - "cancellation_fee_cents := 0"
      - from: TICKETED
        to: CANCELLED
        trigger: "POST /assignments/{id}/travel-bookings/{bookingId}/cancel, or system cascade"
        actor: "CrewingManager | system"
        preconditions:
          - "booking in QUOTED, BOOKED, or TICKETED (else ERR_INVALID_STATE)"
        side_effects:
          - "cancellation_fee_cents := round_half_up(total_fare_cents x 0.15)"
          - "if direction == JOIN and no other TICKETED+ JOIN booking remains: assignment.travel_status -> PENDING"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: slot-revision-stale-slot
    parent_entity: ManningSlot
    write_endpoint: "PUT /vessels/{id}/manning-slots/{slotId}"
    occ_field: expected_manning_slot_version
    description: |
      Revising a ManningSlot billet (required endorsement, min grade, tour length,
      criticality) with an expected_manning_slot_version that no longer matches the
      slot's current version is rejected: another writer has changed the billet
      since the caller last observed it, so the caller's revision is based on a
      stale safe-manning document.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: rotation-plan-create-stale-vessel
    parent_entity: Vessel
    write_endpoint: "POST /vessels/{id}/rotation-plans"
    occ_field: expected_vessel_version
    description: |
      Creating a CrewRotationPlan legitimately supersedes the vessel's prior ACTIVE
      plan; doing so with an expected_vessel_version that no longer matches the
      vessel's current version is rejected, because another writer has already
      created (or otherwise changed) rotation state since the caller last observed
      the vessel, and the caller's new plan would supersede a plan it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: mariner-profile-update-stale-mariner
    parent_entity: Mariner
    write_endpoint: "PUT /mariners/{id}"
    occ_field: expected_mariner_version
    description: |
      Editing a Mariner profile (rank, channel, primary endorsement, training cap)
      with an expected_mariner_version that no longer matches the mariner's current
      version is rejected: cascading side effects (credential sweeps, posture
      recomputes, assignment suspensions) or another writer's edit have advanced
      the version since the caller last observed it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: sea_service_day_credit
    trigger: "SeaServiceRecord create (provisional), verify transition (verified), and sea-service-summary read (aggregates)"
    algorithm: chronological
    formula: |
      calendar_days = (end_date - start_date) in whole days + 1   # both endpoints inclusive
      provisional_days = calendar_days                            # no factors
      verified_days  = floor_to_half(calendar_days * region_factor * watch_multiplier)
        where floor_to_half(x) = floor(x * 2) / 2
      Mariner totals (sea-service-summary):
        provisional_days_total = SUM(provisional_days) over records with record_status in {SUBMITTED, VERIFIED}
        verified_days_total    = SUM(verified_days)    over records with record_status == VERIFIED
        (DRAFT, DISPUTED, REJECTED records excluded from both totals)
    input_set: "SeaServiceRecord rows of one mariner; provisional set = {SUBMITTED, VERIFIED}; verified set = {VERIFIED}"
    constants:
      REGION_DAY_FACTOR: { OCEAN: 1.0, NEAR_COASTAL: 1.0, GREAT_LAKES: 1.0, INLAND: 0.5 }
      WATCH_MULTIPLIER: { EIGHT_HOUR: 1.0, TWELVE_HOUR: 1.5 }
    precision: "days to nearest 0.5, round down (floor) at the half-day grid"
    variants:
      - name: provisional
        when: "at creation and for planning reads; counts unverified records, ignores region/watch factors"
        difference: "counts raw inclusive calendar days over {SUBMITTED, VERIFIED} — e.g. 30 calendar days always yield 30.0"
      - name: verified
        when: "at verify transition and for upgrade eligibility; only VERIFIED records"
        difference: "applies region factor and 1.5x TWELVE_HOUR watch multiplier with half-day floor — the same 30 days yield 45.0 (OCEAN TWELVE_HOUR) or 15.0 (INLAND EIGHT_HOUR)"

  - name: upgrade_eligibility
    trigger: "GET /mariners/{id}/upgrade-eligibility?target_endorsement_code=X and POST /mariners/{id}/credentials when credential_type == OFFICER_ENDORSEMENT and endorsement_code is a key of UPGRADE_REQUIREMENTS"
    algorithm: threshold
    formula: |
      req = UPGRADE_REQUIREMENTS[target_endorsement_code]   # unknown target -> eligible-by-default not allowed; ERR_INVALID_REQUEST
      window_start = now - req.lookback_months (calendar months)
      qualifying = SeaServiceRecord with record_status == VERIFIED
                   AND rank_track == req.track AND rank_grade >= req.min_serving_grade
                   AND start_date >= window_start
      verified_days_in_window = SUM(verified_days over qualifying)   # uses sea_service_day_credit verified variant
      days_met = verified_days_in_window >= req.days_required        # >= : exactly-at-threshold qualifies
      course_met = exists TrainingEnrollment of this mariner with status in {COMPLETED, REIMBURSED}
                   whose course.grants_endorsement_code == target_endorsement_code
      eligible = days_met AND course_met
      shortfall_days = max(0, req.days_required - verified_days_in_window)
    input_set: "VERIFIED SeaServiceRecords of the mariner inside the lookback window, filtered by track/grade; mariner's COMPLETED/REIMBURSED enrollments"
    constants:
      UPGRADE_REQUIREMENTS:
        CHIEF_MATE:      { days_required: 360, lookback_months: 36, track: DECK,   min_serving_grade: 4 }
        MASTER:          { days_required: 360, lookback_months: 36, track: DECK,   min_serving_grade: 6 }
        SECOND_ENGINEER: { days_required: 270, lookback_months: 36, track: ENGINE, min_serving_grade: 4 }
    precision: "days to nearest 0.5; threshold comparison is >= (360.0 qualifies, 359.5 does not)"

  - name: training_reimbursement
    trigger: "POST /training-enrollments/{id}/enroll (provisional), POST /training-enrollments/{id}/reimburse (final)"
    algorithm: tiered_pricing
    formula: |
      Evaluation order (pinned):
        1. capped_cost = min(course.cost_cents, PER_COURSE_CAP_CENTS)
        2. channel_pct = 1.00 if channel_snapshot == UNION_HALL else 0.80
        3. provisional_amount_cents = round_half_up(capped_cost * channel_pct)
        4. budget gate at ENROLLED: TrainingBudget.available_cents >= provisional_amount_cents
      At REIMBURSED (final variant):
        reimbursed_amount_cents = min(receipt_amount_cents, provisional_amount_cents)
        budget.used_cents += reimbursed_amount_cents
        budget.reserved_cents -= provisional_amount_cents   # unreimbursed remainder released
    input_set: "the TrainingEnrollment, its TrainingCourse.cost_cents, channel_snapshot, and the mariner's TrainingBudget for the course start year"
    constants:
      PER_COURSE_CAP_CENTS: 200000
      CHANNEL_PCT: { DIRECT: 0.80, UNION_HALL: 1.00 }
    precision: "integer cents, round_half_up at the single multiplication step"
    variants:
      - name: provisional
        when: "at ENROLLED; reserves budget before any receipt exists"
        difference: "based on catalog cost, not receipts: e.g. DIRECT mariner, cost 250000 -> provisional 160000"
      - name: final
        when: "at REIMBURSED; settles against the actual receipt"
        difference: "min(receipt, provisional): same enrollment with receipt 150000 -> reimbursed 150000, releasing 10000 of reservation"

  - name: travel_fare_total
    trigger: "POST .../travel-bookings/{bookingId}/ticket (total), POST .../travel-bookings/{bookingId}/cancel from TICKETED (fee)"
    algorithm: aggregation
    formula: |
      Per-leg rounding THEN sum (pinned order; the alternative sum-then-round yields different cents):
        leg_fare_i = round_half_up(base_fare_cents_i * (1 + markup_bps_i / 10000))   # each leg rounded to cents first
        total_fare_cents = SUM(leg_fare_i)
      Cancellation fee (TICKETED -> CANCELLED only):
        cancellation_fee_cents = round_half_up(total_fare_cents * CANCEL_FEE_PCT_TICKETED)
      (QUOTED/BOOKED cancellation: fee = 0)
    input_set: "legs array of the TravelBooking"
    constants:
      CANCEL_FEE_PCT_TICKETED: 0.15
    precision: "integer cents, round_half_up per leg before summation; fee rounded half_up after multiplication"

  - name: mariner_readiness_posture
    trigger: "every mutation of Mariner status, Credential, MedicalCertificate, DrugTestRecord children, and every clock sweep"
    algorithm: constraint_propagation
    formula: |
      Circular-looking dependency (posture gates Assignment confirm; confirm/suspend writes feed back
      into Mariner state) is resolved by pinned evaluation order: posture is ALWAYS computed from the
      current committed child rows BEFORE the gated transition's own writes are applied (pre-transition
      snapshot); a transition never re-enters the posture computation for itself.
      Evaluate gates in this exact order, collecting ALL applicable reason codes:
        1. if status in {APPLICANT, SUSPENDED, TERMINATED}: BLOCKED, reason STATUS_NOT_ACTIVE (skip remaining gates)
        2. medical: exists MedicalCertificate status == VALID and expiry_date >= now  (expiry == now is still valid)
           else BLOCKED reason NO_VALID_MEDICAL
        3. drug currency: drug_test_current_until = max(collected_date) over COMPLETED tests
           with result NEGATIVE and test_type in {PRE_EMPLOYMENT, PERIODIC, RANDOM, RETURN_TO_DUTY}, + 365 days;
           if null or < now: BLOCKED reason DRUG_CURRENCY_LAPSED
        4. latest result: if the most recent COMPLETED test (by collected_date, tie-break created_at) has
           result in {POSITIVE, REFUSAL}: BLOCKED reason DRUG_RESULT_POSITIVE
        5. primary credential: exists Credential status == VALID with endorsement_code == primary_endorsement_code
           else BLOCKED reason NO_VALID_PRIMARY_CREDENTIAL
      If not BLOCKED: earliest_expiry = min(medical expiry_date, drug_test_current_until, primary credential expiry_date);
      if earliest_expiry - now <= RESTRICTED_WINDOW_DAYS: RESTRICTED with reasons among
        {MEDICAL_EXPIRING_SOON, DRUG_CURRENCY_EXPIRING_SOON, CREDENTIAL_EXPIRING_SOON} (one per source <= 30d);
      else CLEAR with empty reasons.
      RESTRICTED semantic: Assignment confirm allowed only if planned_relief_date <= earliest_expiry.
    input_set: "the mariner's MedicalCertificate, DrugTestRecord, Credential child rows at pre-transition committed state"
    constants:
      DRUG_CURRENCY_DAYS: 365
      RESTRICTED_WINDOW_DAYS: 30
    precision: "datetime comparisons at second precision; expiry == now counts as valid (>=), lapsed when < now"

  - name: manning_compliance_posture
    trigger: "Assignment sign-on / relieve / suspend-resume / cancel cascades, ManningSlot create/retire, vessel activate"
    algorithm: aggregation
    formula: |
      For each ManningSlot with status == ACTIVE on the vessel:
        current_coverage = COVERED iff exists Assignment on the slot with assignment_status == ONBOARD, else UNCOVERED
      slots_total = count(ACTIVE slots); slots_covered = count(ACTIVE slots COVERED)
      compliance_posture:
        CRITICAL_SHORTAGE if any ACTIVE slot with is_critical_position == true is UNCOVERED
        else DEFICIENT if any ACTIVE slot is UNCOVERED
        else COMPLIANT
      mark-underway gate: COMPLIANT -> allowed; DEFICIENT -> allowed only with non-empty waiver_justification;
        CRITICAL_SHORTAGE -> always ERR_VESSEL_NOT_COMPLIANT.
    input_set: "ManningSlots of the vessel with status ACTIVE; Assignments on those slots with assignment_status == ONBOARD"
    constants: {}
    precision: "exact set semantics; empty slot set (slots_total == 0) yields COMPLIANT but vessel activation requires >= 1 slot"

  - name: credential_expiry_sweep
    trigger: "POST /_clock/set_current_utc"
    algorithm: chronological
    formula: |
      Executed synchronously inside the clock-set call, in this pinned order:
        1. Credentials: status in {VALID, RENEWAL_PENDING, SUSPENDED_PREREQ} and expiry_date < now -> EXPIRED
        2. Credentials: status == EXPIRED and expiry_date + 180d < now -> LAPSED
        3. Prerequisite cascade: dependents of newly EXPIRED/REVOKED credentials -> SUSPENDED_PREREQ;
           dependents of credentials returned to VALID -> VALID
        4. MedicalCertificates: status in {VALID, SUSPENDED} and expiry_date < now -> EXPIRED
        5. Recompute every affected Mariner.readiness_posture (calculations.mariner_readiness_posture)
        6. Posture cascade: mariners who became BLOCKED -> their future CONFIRMED Assignments -> SUSPENDED
        7. ManningSlot.current_coverage and Vessel.compliance_posture recompute for affected slots
    input_set: "all Credential and MedicalCertificate rows compared against the new clock value"
    constants:
      CREDENTIAL_RENEWAL_GRACE_DAYS: 180
    precision: "strict < comparison: expiry_date exactly == now is still VALID"

  - name: assignment_overlap_checks
    trigger: "POST /assignments and POST /assignments/{id}/confirm"
    algorithm: interval_merge
    formula: |
      Two DIFFERENT interval semantics on two different resources:
      (A) Mariner double-booking — strict half-open, zero tolerance:
          overlap iff new.sign_on_date < existing.planned_relief_date AND existing.sign_on_date < new.planned_relief_date
          over the mariner's own assignments with assignment_status in {CONFIRMED, ONBOARD, SUSPENDED};
          touching endpoints (new.sign_on_date == existing.planned_relief_date) do NOT overlap (half-open [start, end)).
          Violation -> ERR_MARINER_ASSIGNMENT_OVERLAP.
      (B) Slot handover — bounded buffer:
          over OTHER assignments on the same ManningSlot with assignment_status in {CONFIRMED, ONBOARD}:
          overlap_days = (min(new.planned_relief_date, other.planned_relief_date) - max(new.sign_on_date, other.sign_on_date)) in whole days (floor; negative treated as 0)
          allowed iff overlap_days <= plan.max_handover_overlap_days of the vessel's ACTIVE CrewRotationPlan
          (equality allowed). Violation -> ERR_HANDOVER_WINDOW_EXCEEDED.
      Rotation window gate (applies first): the vessel must have an ACTIVE CrewRotationPlan with
      effective_from <= sign_on_date < effective_to (else ERR_NO_ACTIVE_ROTATION_WINDOW).
    input_set: "mariner's assignments in {CONFIRMED, ONBOARD, SUSPENDED}; slot's assignments in {CONFIRMED, ONBOARD}; vessel's ACTIVE rotation plan"
    constants: {}
    precision: "whole-day floor for handover overlap; half-open interval semantics for mariner overlap"

  - name: drug_test_currency
    trigger: "POST /mariners/{id}/drug-tests/{testId}/record-result and clock sweeps (via posture recompute)"
    algorithm: threshold
    formula: |
      qualifying = COMPLETED DrugTestRecords of the mariner with result == NEGATIVE
                   and test_type in {PRE_EMPLOYMENT, PERIODIC, RANDOM, RETURN_TO_DUTY}
      drug_test_current_until = max(collected_date over qualifying) + DRUG_CURRENCY_DAYS, or null if qualifying is empty
      currency holds iff drug_test_current_until >= now  (inclusive: exactly-at boundary still current)
      Program-participation edge: mariner with ZERO qualifying NEGATIVE tests (empty set) has null until -> BLOCKED.
    input_set: "the mariner's COMPLETED DrugTestRecords"
    constants:
      DRUG_CURRENCY_DAYS: 365
    precision: "datetime second precision; boundary inclusive"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority — first matching error wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and non-empty", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "X-User-Role is listed in the endpoint's roles", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: auth, check: "Resource scoping: role Mariner may only address own mariner id (/mariners/{id}... and own-linked resources); role UnionDispatcher may only mutate registrations of own hall (path hall id == X-User-ID) and UNION_DISPATCH assignments whose union_registration.hall_id == X-User-ID", error_id: ERR_FORBIDDEN_RESOURCE_ACCESS, http_status: 403, applies_to: "scoped endpoints" }
  - { priority: 4, category: existence, check: "Path ids exist, validated left-to-right", error_id: "ERR_{RESOURCE}_NOT_FOUND", http_status: 404, applies_to: "all nested/id-addressed endpoints" }
  - { priority: 5, category: existence, check: "Body FK ids exist (mariner_id, manning_slot_id, union_registration_id, relief_of_assignment_id, prerequisite_credential_id)", error_id: "ERR_{RESOURCE}_NOT_FOUND", http_status: 404, applies_to: "create endpoints with body FKs" }
  - { priority: 6, category: business_constraint, check: "Schema: required fields present, types valid, enum membership valid, date ranges ordered (end > start where required), rank_grade in 1..9, uniqueness (mariner_reference_number, imo_number, course_code, local_number)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all mutating endpoints" }
  - { priority: 7, category: existence, check: "OCC: expected_<parent>_version matches the parent entity's current version (endpoints listed in concurrency_rules)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PUT /mariners/{id}, PUT /vessels/{id}/manning-slots/{slotId}, POST /vessels/{id}/rotation-plans" }
  - { priority: 8, category: auth, check: "Segregation of duties: verify X-User-ID != record.entered_by_user_id; reimburse X-User-ID != enrollment.approved_by_user_id", error_id: "ERR_SOD_VERIFY_SAME_RECORDER | ERR_SOD_REIMBURSE_SAME_APPROVER", http_status: 403, applies_to: "POST .../sea-service-records/{rid}/verify, POST /training-enrollments/{id}/reimburse" }
  - { priority: 9, category: state, check: "Target entity in required state for the transition (per §1.2 preconditions)", error_id: "ERR_INVALID_STATE or transition-specific (ERR_CREDENTIAL_NOT_RENEWABLE, ERR_RENEWAL_NOT_PENDING, ERR_CREDENTIAL_NOT_VALID, ERR_RECORD_NOT_SUBMITTABLE, ERR_RECORD_NOT_VERIFIABLE, ERR_DRUG_TEST_NOT_PENDING, ERR_MEDICAL_CERT_NOT_VALID, ERR_COURSE_NOT_SCHEDULED, ERR_SIGN_ON_TOO_EARLY, ERR_TRAVEL_NOT_READY, ERR_RELIEF_NOT_ONBOARD, ERR_REPATRIATION_INCOMPLETE, ERR_SLOT_NOT_ACTIVE, ERR_VESSEL_NOT_ACTIVE)", http_status: 409, applies_to: "all action endpoints" }
  - { priority: 10, category: business_safety, check: "Mariner readiness gate: posture CLEAR, or RESTRICTED with planned_relief_date <= earliest restricting expiry (confirm/resume); posture != BLOCKED (assignment create, sign-on, enrollment approve, enroll)", error_id: "ERR_MARINER_NOT_CLEAR | ERR_RESTRICTED_WINDOW_EXCEEDED", http_status: 409, applies_to: "POST /assignments, POST /assignments/{id}/confirm, /sign-on, /resume, POST /training-enrollments/{id}/approve, /enroll" }
  - { priority: 11, category: business_safety, check: "Credential/endorsement chain: assignment filler holds VALID credential with slot.required_endorsement_code; new credential prerequisite is same-mariner and VALID; OFFICER_ENDORSEMENT upgrade credentials require upgrade_eligibility == true", error_id: "ERR_ENDORSEMENT_MISMATCH | ERR_ENDORSEMENT_PREREQUISITE_INVALID | ERR_UPGRADE_REQUIREMENTS_NOT_MET | ERR_RANK_BELOW_MINIMUM", http_status: 409, applies_to: "POST /assignments, POST /assignments/{id}/confirm, POST /mariners/{id}/credentials, POST .../credentials/{cid}/approve-renewal" }
  - { priority: 12, category: business_constraint, check: "Channel rules: DIRECT_HIRE requires actor CrewingManager and mariner.hire_channel == DIRECT; UNION_DISPATCH requires actor UnionDispatcher, mariner.hire_channel == UNION_HALL, registration status REGISTERED, dues_current_until >= sign_on_date", error_id: "ERR_CHANNEL_NOT_PERMITTED | ERR_UNION_REGISTRATION_INVALID | ERR_DUES_NOT_CURRENT", http_status: 409, applies_to: "POST /assignments, POST /assignments/{id}/confirm, POST /union-halls/{id}/registrations" }
  - { priority: 13, category: business_temporal, check: "Temporal windowing: ACTIVE rotation plan covers sign_on_date; mariner strict half-open overlap; slot bounded handover overlap", error_id: "ERR_NO_ACTIVE_ROTATION_WINDOW | ERR_MARINER_ASSIGNMENT_OVERLAP | ERR_HANDOVER_WINDOW_EXCEEDED", http_status: 409, applies_to: "POST /assignments, POST /assignments/{id}/confirm" }
  - { priority: 14, category: business_constraint, check: "Aggregate/uniqueness: course.seats_open >= 1; no duplicate open enrollment per (mariner, course) in {REQUESTED, APPROVED, ENROLLED, COMPLETED}; no duplicate non-SUSPENDED registration per (hall, mariner); vessel activation requires >= 1 ACTIVE slot; lay-up/decommission blocked by ONBOARD crew; retire blocked by open assignments; training_privileges ENABLED for new enrollment; mariner.status == ACTIVE for enrollment/assignment creation", error_id: "ERR_COURSE_FULL | ERR_DUPLICATE_ENROLLMENT | ERR_DUPLICATE_REGISTRATION | ERR_NO_MANNING_SLOTS | ERR_ACTIVE_CREW_ABOARD | ERR_SLOT_HAS_OPEN_ASSIGNMENTS | ERR_TRAINING_PRIVILEGES_SUSPENDED | ERR_MARINER_NOT_ACTIVE", http_status: 409, applies_to: "various (enroll, enrollment create, registration create, vessel activate/lay-up/decommission, slot retire)" }
  - { priority: 15, category: business_fiscal, check: "Budget: TrainingBudget.available_cents >= provisional_amount_cents at enroll", error_id: ERR_TRAINING_BUDGET_EXCEEDED, http_status: 402, applies_to: "POST /training-enrollments/{id}/enroll" }

# =============================================================================
# 1.5 API Endpoint Table
# ALL_ROLES = [FleetAdmin, CrewingManager, CredentialingOfficer, PortCaptain, UnionDispatcher, Mariner]
# (written out explicitly below; Mariner/UnionDispatcher subject to validation p3 scoping)
# =============================================================================
endpoints:
  # --- Mariner ---
  - method: POST
    path: "/mariners"
    description: "Register a new mariner (status APPLICANT, posture BLOCKED until activation gates met)"
    roles: [FleetAdmin]
    code: 201
    input: [full_name, mariner_reference_number, home_port_code, hire_channel, rank_track, rank_grade, primary_endorsement_code, "annual_training_cap_cents?"]
    output: Mariner
    side_effects: ["status = APPLICANT", "readiness_posture computed (BLOCKED, STATUS_NOT_ACTIVE)", "training_privileges = ENABLED", "no_show_strike_count = 0"]
  - method: GET
    path: "/mariners"
    description: "List mariners with filters and pagination"
    roles: [FleetAdmin, CrewingManager, CredentialingOfficer, PortCaptain, UnionDispatcher, Mariner]
    code: 200
    input: ["status?", "readiness_posture?", "home_port_code?", "hire_channel?", "limit?", "offset?"]
    output: "Mariner[]"
    side_effects: []
  - method: GET
    path: "/mariners/{id}"
    description: "Get one mariner (includes computed readiness_posture, readiness_reasons, drug_test_current_until)"
    roles: [FleetAdmin, CrewingManager, CredentialingOfficer, PortCaptain, UnionDispatcher, Mariner]
    code: 200
    input: []
    output: Mariner
    side_effects: []
  - method: PUT
    path: "/mariners/{id}"
    description: "Update mariner profile fields; OCC-guarded on Mariner.version"
    roles: [FleetAdmin]
    code: 200
    input: ["full_name?", "home_port_code?", "hire_channel?", "rank_track?", "rank_grade?", "primary_endorsement_code?", "annual_training_cap_cents?", expected_mariner_version]
    output: Mariner
    side_effects: ["increments Mariner.version by 1", "recompute readiness_posture if primary_endorsement_code changed"]
  - method: POST
    path: "/mariners/{id}/activate"
    description: "APPLICANT -> ACTIVE after the three activation gates (medical, drug, credential)"
    roles: [FleetAdmin]
    code: 200
    input: []
    output: Mariner
    side_effects: ["status -> ACTIVE", "recompute readiness_posture", "increments Mariner.version by 1"]
  - method: POST
    path: "/mariners/{id}/suspend"
    description: "ACTIVE -> SUSPENDED; cascades future CONFIRMED assignments to SUSPENDED"
    roles: [FleetAdmin]
    code: 200
    input: []
    output: Mariner
    side_effects: ["status -> SUSPENDED", "posture -> BLOCKED", "CONFIRMED assignments -> SUSPENDED", "increments Mariner.version by 1"]
  - method: POST
    path: "/mariners/{id}/reinstate"
    description: "SUSPENDED -> ACTIVE with activation gates re-checked"
    roles: [FleetAdmin]
    code: 200
    input: []
    output: Mariner
    side_effects: ["status -> ACTIVE", "recompute readiness_posture", "increments Mariner.version by 1"]
  - method: POST
    path: "/mariners/{id}/terminate"
    description: "ACTIVE|SUSPENDED -> TERMINATED; cascades open assignments/enrollments"
    roles: [FleetAdmin]
    code: 200
    input: []
    output: Mariner
    side_effects: ["status -> TERMINATED", "PROPOSED/CONFIRMED assignments -> CANCELLED (travel bookings cascade with fees)", "REQUESTED enrollments -> REJECTED, APPROVED -> CANCELLED", "increments Mariner.version by 1"]
  - method: GET
    path: "/mariners/{id}/upgrade-eligibility"
    description: "Computed upgrade eligibility vs target endorsement (calculations.upgrade_eligibility)"
    roles: [FleetAdmin, CrewingManager, CredentialingOfficer, PortCaptain, Mariner]
    code: 200
    input: [target_endorsement_code]
    output: "{ eligible: boolean, target_endorsement_code: string, verified_days_in_window: number, required_days: number, course_requirement_met: boolean, shortfall_days: number, window_start: datetime }"
    side_effects: []
  - method: GET
    path: "/mariners/{id}/sea-service-summary"
    description: "Provisional vs verified sea-service totals (calculations.sea_service_day_credit variants)"
    roles: [FleetAdmin, CrewingManager, CredentialingOfficer, PortCaptain, Mariner]
    code: 200
    input: []
    output: "{ provisional_days_total: number, verified_days_total: number, by_track: array }"
    side_effects: []

  # --- Credential ---
  - method: POST
    path: "/mariners/{id}/credentials"
    description: "Issue a credential/endorsement; prerequisite + upgrade-eligibility gates apply"
    roles: [CredentialingOfficer]
    code: 201
    input: [credential_type, endorsement_code, issue_date, expiry_date, "prerequisite_credential_id?"]
    output: Credential
    side_effects: ["status = VALID", "renewal_count = 0", "recompute Mariner.readiness_posture (may lift NO_VALID_PRIMARY_CREDENTIAL)"]
  - method: GET
    path: "/mariners/{id}/credentials"
    description: "List credentials of a mariner"
    roles: [FleetAdmin, CrewingManager, CredentialingOfficer, PortCaptain, UnionDispatcher, Mariner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Credential[]"
    side_effects: []
  - method: GET
    path: "/credentials"
    description: "Flat credential list with filters (supports prerequisite-chain discovery)"
    roles: [FleetAdmin, CrewingManager, CredentialingOfficer, PortCaptain, UnionDispatcher, Mariner]
    code: 200
    input: ["mariner_id?", "prerequisite_credential_id?", "status?", "endorsement_code?", "limit?", "offset?"]
    output: "Credential[]"
    side_effects: []
  - method: GET
    path: "/credentials/{id}"
    description: "Get one credential"
    roles: [FleetAdmin, CrewingManager, CredentialingOfficer, PortCaptain, UnionDispatcher, Mariner]
    code: 200
    input: []
    output: Credential
    side_effects: []
  - method: POST
    path: "/mariners/{id}/credentials/{credentialId}/submit-renewal"
    description: "VALID|EXPIRED -> RENEWAL_PENDING (late renewal only before LAPSED sweep)"
    roles: [Mariner, CredentialingOfficer]
    code: 200
    input: []
    output: Credential
    side_effects: ["status -> RENEWAL_PENDING", "recompute Mariner.readiness_posture"]
  - method: POST
    path: "/mariners/{id}/credentials/{credentialId}/approve-renewal"
    description: "RENEWAL_PENDING -> VALID with new dates; restores SUSPENDED_PREREQ dependents"
    roles: [CredentialingOfficer]
    code: 200
    input: [new_issue_date, new_expiry_date]
    output: Credential
    side_effects: ["status -> VALID", "issue_date/expiry_date replaced", "renewal_count += 1", "dependent SUSPENDED_PREREQ credentials -> VALID", "recompute Mariner.readiness_posture"]
  - method: POST
    path: "/mariners/{id}/credentials/{credentialId}/deny-renewal"
    description: "RENEWAL_PENDING -> VALID keeping old dates"
    roles: [CredentialingOfficer]
    code: 200
    input: ["reason?"]
