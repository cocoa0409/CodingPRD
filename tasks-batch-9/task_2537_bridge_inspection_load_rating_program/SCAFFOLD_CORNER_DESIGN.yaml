      - name: missing_x_user_id_header_outranks_role_and_payload_checks
        claim_type: priority_ordering
        grounds:
          - validations.priority_1
          - validations.priority_2
          - validations.priority_3
        distinguishing_aspect: "A request that violates priorities 1, 2 and 3 at once - no X-User-ID header, a role that POST /bridges does not grant, and a missing required adt - returns 401 ERR_UNAUTHENTICATED, not 403 and not 400."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; empty bridge inventory."
            - "The trigger is sent with NO X-User-ID header at all (as: Anonymous denotes the absent-credential caller) while X-User-Role still reads BridgeInspector, a role POST /bridges does not grant, and the body omits the required adt."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, detour_length_km: 8.5 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "The response is NOT 403 ERR_ROLE_NOT_PERMITTED even though BridgeInspector is not in the endpoint's roles list"
            - "The response is NOT 400 ERR_INVALID_REQUEST even though adt is missing"
            - "GET /bridges as ProgramAdmin returns total_count == 0"
            - "The same body sent with an X-User-Role of NotARole and a present X-User-ID also returns 401 - an undeclared role fails authentication, not authorisation"

      - name: role_check_outranks_payload_validation_returns_403
        claim_type: priority_ordering
        grounds:
          - validations.priority_2
          - validations.priority_3
          - roles.BridgeInspector.exclusive_operations
        distinguishing_aspect: "With authentication satisfied, priority 2 still precedes priority 3: a BridgeInspector posting a bridge with adt omitted gets 403 ERR_ROLE_NOT_PERMITTED, so the payload defect is never reported."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; Ivy Inspector exists so the caller is a real authenticated inspector."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /personnel"
              payload: { full_name: "Ivy Inspector", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, detour_length_km: 8.5 }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED"
            - "The response is NOT 400 ERR_INVALID_REQUEST - the missing adt is never evaluated"
            - "GET /bridges as ProgramAdmin returns total_count == 0"
            - "The identical body sent as ProgramAdmin returns 400 ERR_INVALID_REQUEST, confirming the payload really was malformed"

      - name: unknown_path_bridge_outranks_unknown_body_team_leader_not_found
        claim_type: priority_ordering
        grounds:
          - validations.priority_5
          - validations.priority_6
          - errors.ERR_BRIDGE_NOT_FOUND
          - errors.ERR_PERSONNEL_NOT_FOUND
        distinguishing_aspect: "Priority 5 (path existence, left to right) precedes priority 6 (body foreign keys): a nested inspection create under an unknown bridge id whose team_leader_id is also unknown returns ERR_BRIDGE_NOT_FOUND, not ERR_PERSONNEL_NOT_FOUND, even though both are 404s."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; one real bridge and one real inspector exist, neither of which is referenced by the trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
