# =============================================================================
# Tool & Gear Lending Library (nonprofit) — Seed Tables (SCAFFOLD.yaml)
# §1.0–§1.7. Difficulty: Expert.
# =============================================================================

scenario: |
  Tool & Gear Lending Library (nonprofit): membership & catalog (tools/outdoor/
  kitchen), reservation & loan period/renewal, checkout/checkin & condition,
  hold/waitlist & late fee, donation/intake & maintenance, damage/replacement,
  volunteer/staff, usage reporting

domain_name: tool-lending-library
api_prefix: /library

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: flat
  # Peer entities linked by foreign keys; no nesting in URL paths beyond the
  # item -> copies sub-resource used for FK reverse-reachability.
  state_machine_shape: parallel
  # ItemCopy carries two independent state axes (availability x condition);
  # Loan and Member both carry cyclic revision loops (renew / suspend-reinstate).
  relationship_patterns:
    - one_to_many          # Item -> ItemCopy; Member -> Loan/Hold/Fee/Reservation
    - cross_aggregate      # Loan references Member and ItemCopy across aggregates
  role_model: hierarchical_override
  # Member < Volunteer < Coordinator; Coordinator is a superset operator.
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Member full name" }
      - { name: email, type: string, source: input, description: "Contact email, unique across members" }
      - { name: tier, type: enum, source: input, description: "Membership tier", constraints: "one of BASIC, PLUS" }
      - { name: status, type: enum, source: computed, description: "Lifecycle status", constraints: "one of ACTIVE, SUSPENDED, EXPIRED" }
      - { name: max_active_loans, type: integer, source: input, default: 5, description: "Cap on concurrently ACTIVE/OVERDUE loans" }
      - { name: max_active_holds, type: integer, source: input, default: 3, description: "Cap on concurrently PENDING/PROMOTED holds" }
      - { name: balance_limit_cents, type: integer, source: input, default: 2000, description: "Not used for gating; informational soft limit shown to member" }
      - { name: membership_expires_at, type: datetime, source: input, description: "Instant after which ops-run expires the membership" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum of amount_cents over the member's ACCRUING+PENDING fees; see calc member_ledger" }
      - { name: total_assessed_cents, type: integer, source: computed, description: "Lifetime sum of finalized fee amounts ever assessed to the member" }
      - { name: total_paid_cents, type: integer, source: computed, description: "Lifetime sum of PAID fee amounts" }
      - { name: total_waived_cents, type: integer, source: computed, description: "Lifetime sum of WAIVED fee amounts" }

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Volunteer/staff full name" }
      - { name: role_level, type: enum, source: input, description: "Operational level", constraints: "one of VOLUNTEER, COORDINATOR" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether the volunteer may perform desk operations" }

  - name: Item
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Catalog title, e.g. 'Cordless Drill 18V'" }
      - { name: category, type: enum, source: input, description: "Catalog category", constraints: "one of TOOL, OUTDOOR, KITCHEN" }
      - { name: replacement_value_cents, type: integer, source: input, description: "New replacement value used by damage/replacement charges" }
      - { name: loan_period_days, type: integer, source: input, description: "Days added to checkout instant to compute a loan due_date" }
      - { name: daily_late_fee_cents, type: integer, source: input, description: "Per-day late-fee rate after the grace period" }
      - { name: max_renewals, type: integer, source: input, default: 2, description: "Max number of renewals allowed on a single loan" }
      - { name: serviceable_copies_count, type: integer, source: computed, description: "Count of copies whose condition_status != RETIRED; see calc item_availability" }
      - { name: available_copies_count, type: integer, source: computed, description: "Count of copies with availability_status=AVAILABLE AND condition_status=GOOD" }
      - { name: reserved_count, type: integer, source: computed, description: "Count of copies with availability_status=RESERVED" }
      - { name: on_loan_count, type: integer, source: computed, description: "Count of copies with availability_status=ON_LOAN" }
      - { name: maintenance_count, type: integer, source: computed, description: "Count of copies with condition_status in {NEEDS_MAINTENANCE, UNDER_MAINTENANCE}" }
      - { name: waitlist_length, type: integer, source: computed, description: "Count of holds on this item with status in {PENDING, PROMOTED}" }

  - name: ItemCopy
    parent: null
    common_fields: true
    fields:
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; catalog title this physical copy belongs to" }
      - { name: asset_tag, type: string, source: input, description: "Human-readable asset tag stamped on the copy" }
      - { name: acquired_on, type: datetime, source: input, description: "Acquisition date; used to compute depreciation age in years" }
      - { name: origin, type: enum, source: input, default: PURCHASE, description: "How the copy entered inventory", constraints: "one of PURCHASE, DONATION" }
      - { name: availability_status, type: enum, source: computed, description: "Availability axis (independent of condition)", constraints: "one of AVAILABLE, RESERVED, ON_LOAN" }
      - { name: condition_status, type: enum, source: computed, description: "Condition axis (independent of availability)", constraints: "one of GOOD, NEEDS_MAINTENANCE, UNDER_MAINTENANCE, RETIRED" }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; member holding the reservation" }
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; reserved catalog title" }
      - { name: copy_id, type: string, source: system, description: "Identifier of the ItemCopy assigned to this reservation at creation (not an FK path; assignment is server-chosen)" }
      - { name: window_start, type: datetime, source: input, description: "Half-open reservation window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Half-open reservation window end (exclusive)" }
      - { name: source, type: enum, source: system, description: "How the reservation was created", constraints: "one of MEMBER, WAITLIST_PROMOTION" }
      - { name: status, type: enum, source: computed, description: "Reservation lifecycle", constraints: "one of PENDING, FULFILLED, CANCELLED, EXPIRED" }

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; borrower" }
      - { name: copy_id, type: string, source: input, description: "FK -> ItemCopy.id; physical copy checked out" }
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; reservation fulfilled by this checkout (null for walk-up loans)" }
      - { name: item_id, type: string, source: system, description: "Denormalized catalog title id copied from the ItemCopy (not an FK path; convenience mirror)" }
      - { name: checked_out_at, type: datetime, source: system, description: "Logical-clock instant at checkout" }
      - { name: due_date, type: datetime, source: computed, description: "checked_out_at + Item.loan_period_days; advanced on renewal" }
      - { name: renewals_used, type: integer, source: computed, description: "Number of renewals applied so far; starts 0" }
      - { name: status, type: enum, source: computed, description: "Loan lifecycle", constraints: "one of ACTIVE, OVERDUE, RETURNED, LOST" }
      - { name: return_condition, type: enum, source: input, description: "Condition captured at checkin (null until returned)", constraints: "one of GOOD, MINOR_DAMAGE, MAJOR_DAMAGE, LOST" }
      - { name: returned_at, type: datetime, source: system, description: "Logical-clock instant at checkin (null until returned)" }
      - { name: checked_out_by_volunteer_id, type: string, source: system, description: "X-User-ID of the volunteer who performed checkout (audit only, not an FK path)" }

  - name: Hold
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; member waiting" }
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; catalog title waited for" }
      - { name: promoted_reservation_id, type: string, source: system, description: "Identifier of the Reservation minted when this hold is promoted (null until PROMOTED; not an FK path)" }
      - { name: claim_deadline, type: datetime, source: computed, description: "Promotion instant + CLAIM_WINDOW_DAYS; null until PROMOTED" }
      - { name: status, type: enum, source: computed, description: "Waitlist lifecycle", constraints: "one of PENDING, PROMOTED, FULFILLED, EXPIRED" }

  - name: Fee
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; member charged" }
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; originating loan (null for manually-created fees)" }
      - { name: fee_type, type: enum, source: system, description: "Kind of charge", constraints: "one of LATE, DAMAGE, REPLACEMENT" }
      - { name: amount_cents, type: integer, source: computed, description: "Charge amount; for ACCRUING LATE fees this recomputes each ops-run, else frozen" }
      - { name: status, type: enum, source: computed, description: "Fee lifecycle", constraints: "one of ACCRUING, PENDING, PAID, WAIVED" }
      - { name: assessed_at, type: datetime, source: system, description: "Logical-clock instant the fee was first created" }

  - name: Donation
    parent: null
    common_fields: true
    fields:
      - { name: donor_name, type: string, source: input, description: "Name of the donor as recorded at intake" }
      - { name: donor_member_id, type: string, source: input, description: "Optional member id of the donor when the donor is a member (audit only, not an FK path; donors are often non-members)" }
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; catalog title this donation contributes a copy to" }
      - { name: proposed_condition, type: enum, source: input, description: "Donor-declared condition", constraints: "one of GOOD, FAIR" }
      - { name: created_copy_id, type: string, source: system, description: "Identifier of the ItemCopy minted on acceptance (null until ACCEPTED; not an FK path)" }
      - { name: status, type: enum, source: computed, description: "Intake lifecycle", constraints: "one of OFFERED, ACCEPTED, REJECTED" }

  - name: MaintenanceTicket
    parent: null
    common_fields: true
    fields:
      - { name: copy_id, type: string, source: input, description: "FK -> ItemCopy.id; copy under maintenance" }
      - { name: reason, type: enum, source: input, description: "Why the ticket was opened", constraints: "one of DAMAGE, ROUTINE, INSPECTION" }
      - { name: severity, type: enum, source: input, description: "Severity when reason=DAMAGE (null otherwise)", constraints: "one of MINOR, MAJOR" }
      - { name: source, type: enum, source: system, description: "Whether opened by hand or auto-created at damaged checkin", constraints: "one of MANUAL, DAMAGE_INTAKE" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned maintenance window start (null for immediate DAMAGE_INTAKE tickets)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned maintenance window end (null for immediate DAMAGE_INTAKE tickets)" }
      - { name: outcome, type: enum, source: input, description: "Resolution outcome (null until resolved)", constraints: "one of RETURN_TO_SERVICE, SCRAP" }
      - { name: status, type: enum, source: computed, description: "Ticket lifecycle", constraints: "one of OPEN, IN_PROGRESS, RESOLVED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    field: status
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    note: "Cyclic suspend/reinstate loop between ACTIVE and SUSPENDED (Rule 3)."
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: a fee finalization (loan return, ops-run accrual, or replacement charge) pushes outstanding_balance_cents >= SUSPEND_THRESHOLD_CENTS"
        actor: system
        preconditions:
          - "outstanding_balance_cents >= SUSPEND_THRESHOLD_CENTS (2000)"
        side_effects:
          - "All the member's PENDING reservations -> CANCELLED (each releases its assigned copy: copy availability_status RESERVED -> AVAILABLE, then item_availability recomputed)"
          - "All the member's PENDING and PROMOTED holds -> EXPIRED (a PROMOTED hold additionally releases its promoted copy back to AVAILABLE)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /_ops/run when outstanding_balance_cents == 0"
        actor: system
        preconditions:
          - "outstanding_balance_cents == 0 (all fees PAID or WAIVED)"
        side_effects: []
      - from: [ACTIVE, SUSPENDED]
        to: EXPIRED
        trigger: "POST /_ops/run when current_utc >= membership_expires_at"
        actor: system
        preconditions:
          - "current logical clock >= membership_expires_at"
        side_effects:
          - "Member's PENDING reservations -> CANCELLED and PENDING/PROMOTED holds -> EXPIRED (copies released as above)"

  - entity: ItemCopy
    field: availability_status
    initial_state: AVAILABLE
    terminal_states: []
    note: "Availability axis; evolves independently of condition_status (parallel dimensions, Rule 3)."
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /library/reservations (copy assigned) or system hold promotion"
        actor: "Member or system"
        preconditions:
          - "copy condition_status == GOOD"
        side_effects:
          - "Item.reserved_count and available_copies_count recomputed"
      - from: RESERVED
        to: ON_LOAN
        trigger: "POST /library/loans (checkout of the reserved copy)"
        actor: Volunteer
        preconditions: []
        side_effects:
          - "Item.on_loan_count and reserved_count recomputed"
      - from: AVAILABLE
        to: ON_LOAN
        trigger: "POST /library/loans (walk-up checkout, no reservation)"
        actor: Volunteer
        preconditions:
          - "copy condition_status == GOOD"
        side_effects:
          - "Item.on_loan_count and available_copies_count recomputed"
      - from: ON_LOAN
        to: AVAILABLE
        trigger: "POST /library/loans/{loan_id}/return with return_condition in {GOOD, MINOR_DAMAGE, MAJOR_DAMAGE}"
        actor: Volunteer
        preconditions: []
        note: "Availability leaves ON_LOAN on any non-LOST return. The condition axis moves independently: a MINOR/MAJOR_DAMAGE return sets condition_status=NEEDS_MAINTENANCE, so the copy is AVAILABLE yet excluded from available_copies_count (which requires condition GOOD). A LOST return instead retires the copy."
        side_effects:
          - "Item.available_copies_count recomputed; for a GOOD return the item_availability cascade may promote a waitlisted hold"
      - from: RESERVED
        to: AVAILABLE
        trigger: "POST /library/reservations/{reservation_id}/cancel or ops-run reservation expiry"
        actor: "Member or system"
        preconditions: []
        side_effects:
          - "Item.reserved_count and available_copies_count recomputed"

  - entity: ItemCopy
    field: condition_status
    initial_state: GOOD
    terminal_states: [RETIRED]
    note: "Condition axis; parallel to availability_status."
    transitions:
      - from: GOOD
        to: NEEDS_MAINTENANCE
        trigger: "POST /library/loans/{loan_id}/return with return_condition in {MINOR_DAMAGE, MAJOR_DAMAGE}"
        actor: Volunteer
        preconditions: []
        side_effects:
          - "Auto-create a MaintenanceTicket (reason=DAMAGE, source=DAMAGE_INTAKE, severity from return_condition)"
          - "Assess a DAMAGE/REPLACEMENT Fee via damage_assessment; Item.maintenance_count recomputed"
      - from: NEEDS_MAINTENANCE
        to: UNDER_MAINTENANCE
        trigger: "POST /library/maintenance-tickets/{ticket_id}/resolve start, or ops-run reaching scheduled_start"
        actor: "Volunteer or system"
        preconditions: []
        side_effects: []
      - from: [NEEDS_MAINTENANCE, UNDER_MAINTENANCE]
        to: GOOD
        trigger: "POST /library/maintenance-tickets/{ticket_id}/resolve with outcome=RETURN_TO_SERVICE"
        actor: Volunteer
        preconditions: []
        side_effects:
          - "copy availability_status set to AVAILABLE; Item.available_copies_count recomputed; item_availability cascade may promote a waitlisted hold"
      - from: [GOOD, NEEDS_MAINTENANCE, UNDER_MAINTENANCE]
        to: RETIRED
        trigger: "POST /library/maintenance-tickets/{ticket_id}/resolve with outcome=SCRAP, or ops-run declaring an OVERDUE loan LOST, or a return with return_condition=LOST"
        actor: "Volunteer or system"
        preconditions: []
        side_effects:
          - "copy removed from serviceable pool; Item.serviceable_copies_count and available_copies_count recomputed"

  - entity: Reservation
    field: status
    initial_state: PENDING
    terminal_states: [FULFILLED, CANCELLED, EXPIRED]
    transitions:
      - from: PENDING
        to: FULFILLED
        trigger: "POST /library/loans referencing this reservation_id"
        actor: Volunteer
        preconditions:
          - "reservation.member_id == loan.member_id"
        side_effects:
          - "If this reservation came from a hold (source=WAITLIST_PROMOTION), that hold -> FULFILLED"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /library/reservations/{reservation_id}/cancel, or system on member suspension/expiry"
        actor: "Member or system"
        preconditions: []
        side_effects:
          - "Assigned copy availability_status RESERVED -> AVAILABLE; Item.reserved_count/available_copies_count recomputed; item_availability cascade may promote next hold"
      - from: PENDING
        to: EXPIRED
        trigger: "POST /_ops/run when current_utc >= window_end and not fulfilled"
        actor: system
        preconditions:
          - "current logical clock >= window_end"
        side_effects:
          - "Assigned copy RESERVED -> AVAILABLE; item_availability cascade may promote next hold"

  - entity: Loan
    field: status
    initial_state: ACTIVE
    terminal_states: [RETURNED, LOST]
    note: "Cyclic renewal loop ACTIVE -> ACTIVE (Rule 3)."
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /library/loans/{loan_id}/renew"
        actor: "Member or Volunteer"
        preconditions:
          - "renewals_used < Item.max_renewals"
          - "no Hold on the loan's item with status in {PENDING, PROMOTED} (cross-entity Loan->Hold)"
          - "loan.status == ACTIVE (not yet OVERDUE)"
        side_effects:
          - "due_date += Item.loan_period_days; renewals_used += 1"
      - from: ACTIVE
        to: OVERDUE
        trigger: "POST /_ops/run when current_utc > due_date"
        actor: system
        preconditions:
          - "current logical clock > due_date"
        side_effects:
          - "Create (or keep) an ACCRUING LATE Fee for the loan; late_fee recomputed against the current clock"
      - from: [ACTIVE, OVERDUE]
        to: RETURNED
        trigger: "POST /library/loans/{loan_id}/return"
        actor: Volunteer
        preconditions:
          - "loan.status in {ACTIVE, OVERDUE}"
        side_effects:
          - "returned_at = current clock; any ACCRUING LATE fee is FINALIZED to PENDING with amount frozen by late_fee (variant=FINALIZED)"
          - "return_condition=GOOD: copy ON_LOAN -> AVAILABLE (item_availability cascade may promote a hold)"
          - "return_condition in {MINOR_DAMAGE, MAJOR_DAMAGE}: copy condition GOOD -> NEEDS_MAINTENANCE, auto-open MaintenanceTicket, assess DAMAGE Fee via damage_assessment"
          - "return_condition=LOST: copy -> RETIRED, assess REPLACEMENT Fee via damage_assessment(variant=REPLACE)"
          - "Fee finalization may push member outstanding_balance_cents >= SUSPEND_THRESHOLD_CENTS -> member ACTIVE -> SUSPENDED cascade"
      - from: OVERDUE
        to: LOST
        trigger: "POST /_ops/run when (current_utc - due_date) in days >= LOST_THRESHOLD_DAYS"
        actor: system
        preconditions:
          - "days overdue >= LOST_THRESHOLD_DAYS (30)"
        side_effects:
          - "copy -> RETIRED; ACCRUING LATE fee FINALIZED to PENDING; assess REPLACEMENT Fee via damage_assessment(variant=REPLACE)"

  - entity: Hold
    field: status
    initial_state: PENDING
    terminal_states: [FULFILLED, EXPIRED]
    transitions:
      - from: PENDING
        to: PROMOTED
        trigger: "system: a copy of the item becomes AVAILABLE (checkin, reservation cancel/expiry, or maintenance return) and this hold is the queue head per waitlist_promotion"
        actor: system
        preconditions:
          - "hold is the earliest PENDING hold on the item by created_at ASC"
          - "hold.member_id member.status == ACTIVE"
        side_effects:
          - "Mint a Reservation (source=WAITLIST_PROMOTION) assigning the now-available copy; copy AVAILABLE -> RESERVED"
          - "claim_deadline = promotion instant + CLAIM_WINDOW_DAYS; promoted_reservation_id set"
      - from: PROMOTED
        to: FULFILLED
        trigger: "POST /library/loans fulfilling the promoted reservation"
        actor: Volunteer
        preconditions: []
        side_effects: []
      - from: PROMOTED
        to: EXPIRED
        trigger: "POST /_ops/run when current_utc >= claim_deadline"
        actor: system
        preconditions:
          - "current logical clock >= claim_deadline"
        side_effects:
          - "Promoted reservation -> CANCELLED (copy RESERVED -> AVAILABLE); item_availability cascade promotes the next PENDING hold"
      - from: PENDING
        to: EXPIRED
        trigger: "system on member suspension/expiry"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Fee
    field: status
    initial_state: ACCRUING
    terminal_states: [PAID, WAIVED]
    note: "DAMAGE/REPLACEMENT fees are created directly in PENDING; LATE fees start ACCRUING."
    transitions:
      - from: ACCRUING
        to: PENDING
        trigger: "loan return or ops-run LOST declaration finalizes the late fee"
        actor: "Volunteer or system"
        preconditions: []
        side_effects:
          - "amount_cents frozen (late_fee variant=FINALIZED); member outstanding_balance_cents and total_assessed_cents recomputed"
      - from: PENDING
        to: PAID
        trigger: "POST /library/fees/{fee_id}/pay"
        actor: "Member or Volunteer"
        preconditions:
          - "fee.status == PENDING"
        side_effects:
          - "member outstanding_balance_cents -= amount_cents; total_paid_cents += amount_cents (member_ledger invariant conserved)"
      - from: [ACCRUING, PENDING]
        to: WAIVED
        trigger: "POST /library/fees/{fee_id}/waive"
        actor: Coordinator
        preconditions: []
        side_effects:
          - "member outstanding_balance_cents -= amount_cents; total_waived_cents += amount_cents (member_ledger invariant conserved)"

  - entity: Donation
    field: status
    initial_state: OFFERED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /library/donations/{donation_id}/accept"
        actor: "Volunteer or Coordinator"
        preconditions:
          - "donation.item_id item still exists"
        side_effects:
          - "Mint an ItemCopy (availability=AVAILABLE, condition=GOOD, origin=DONATION) under the item"
          - "Item.serviceable_copies_count/available_copies_count recomputed; item_availability cascade may promote a waitlisted hold"
      - from: OFFERED
        to: REJECTED
        trigger: "POST /library/donations/{donation_id}/reject"
        actor: "Volunteer or Coordinator"
        preconditions: []
        side_effects: []

  - entity: MaintenanceTicket
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /_ops/run reaching scheduled_start"
        actor: system
        preconditions:
          - "current logical clock >= scheduled_start"
        side_effects:
          - "copy condition_status -> UNDER_MAINTENANCE; Item.maintenance_count recomputed"
      - from: [OPEN, IN_PROGRESS]
        to: RESOLVED
        trigger: "POST /library/maintenance-tickets/{ticket_id}/resolve"
        actor: "Volunteer or Coordinator"
        preconditions:
          - "ticket.status in {OPEN, IN_PROGRESS}"
        side_effects:
          - "outcome=RETURN_TO_SERVICE: copy condition -> GOOD and availability -> AVAILABLE (item_availability cascade may promote a hold)"
          - "outcome=SCRAP: copy condition -> RETIRED (serviceable pool shrinks)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: checkout-stale-item
    parent_entity: Item
    write_endpoint: "POST /library/loans"
    occ_field: "expected_item_version"
    description: |
      Checking out a copy of an Item whose version has advanced since the client
      last observed it is rejected. This captures the case where another writer
      has just consumed the last serviceable copy of the item (a legitimate
      supersede under the quota model) so the current writer's view of which
      copies are available is stale. The loser observes a stale expected_item_version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: item_availability
    trigger: "any copy availability_status/condition_status change: reservation create/cancel/expire, checkout, return, donation accept, maintenance resolve, loan LOST"
    algorithm: aggregation
    formula: |
      serviceable_copies_count = count(copies c where c.condition_status != RETIRED)
      available_copies_count   = count(copies c where c.availability_status == AVAILABLE and c.condition_status == GOOD)
      reserved_count           = count(copies c where c.availability_status == RESERVED)
      on_loan_count            = count(copies c where c.availability_status == ON_LOAN)
      maintenance_count        = count(copies c where c.condition_status in {NEEDS_MAINTENANCE, UNDER_MAINTENANCE})
      waitlist_length          = count(holds h on item where h.status in {PENDING, PROMOTED})
      # Conserved: available_copies_count + reserved_count + on_loan_count + maintenance_count
      #            == serviceable_copies_count  (see invariant copy_conservation)
    input_set: "All copies of the item regardless of status; RETIRED copies excluded from serviceable_copies_count only."
    precision: "integer counts"

  - name: late_fee
    trigger: "ops-run OVERDUE accrual (variant=ACCRUING) and loan return / LOST declaration (variant=FINALIZED)"
    algorithm: threshold
    formula: |
      days_overdue = floor((observation_instant - loan.due_date) / 86400 seconds)   # whole days
      billable_days = max(0, days_overdue - GRACE_DAYS)
      raw = Item.daily_late_fee_cents * billable_days
      amount_cents = min(raw, Item.replacement_value_cents)                          # nested min/max, 3+ inputs
    input_set: "The single loan being observed; Item supplies daily_late_fee_cents and replacement_value_cents."
    constants:
      GRACE_DAYS: 2
    precision: "integer cents; round_half_up not required (integer arithmetic)"
    variants:
      - name: ACCRUING
        when: "loan is OVERDUE and not yet returned; recomputed on every ops-run against the current logical clock"
        difference: "observation_instant = current logical clock; fee.status stays ACCRUING; amount grows as the clock advances"
      - name: FINALIZED
        when: "loan is returned or declared LOST"
        difference: "observation_instant = loan.returned_at (or the ops-run instant for LOST); amount frozen and fee.status becomes PENDING"

  - name: damage_assessment
    trigger: "loan return with return_condition in {MINOR_DAMAGE, MAJOR_DAMAGE, LOST}; ops-run LOST declaration"
    algorithm: tiered_pricing
    formula: |
      age_years = floor((observation_instant - copy.acquired_on) / (365 * 86400 seconds))
      # Nested rounding — order is PINNED: round the PER-YEAR depreciation FIRST, then multiply, then subtract.
      annual_depreciation_cents = round_half_up(Item.replacement_value_cents * DEP_RATE_PER_YEAR)
      depreciated_cents = Item.replacement_value_cents - (annual_depreciation_cents * age_years)
      salvage_floor_cents = round_half_up(Item.replacement_value_cents * SALVAGE_FLOOR_PCT)
      full_replace_cents = max(depreciated_cents, salvage_floor_cents)
      # variant selection:
      #   MINOR_DAMAGE -> REPAIR
      #   MAJOR_DAMAGE or LOST -> REPLACE
    input_set: "The returned copy and its Item; observation_instant = returned_at (or ops-run instant for LOST)."
    constants:
      DEP_RATE_PER_YEAR: 0.10
      SALVAGE_FLOOR_PCT: 0.20
      REPAIR_FLAT_CENTS: 1500
    precision: "integer cents, round_half_up applied only at the pinned per-year and salvage-floor steps"
    variants:
      - name: REPAIR
        when: "return_condition == MINOR_DAMAGE"
        difference: "amount_cents = min(REPAIR_FLAT_CENTS, full_replace_cents); fee_type=DAMAGE"
      - name: REPLACE
        when: "return_condition == MAJOR_DAMAGE or LOST, or ops-run LOST"
        difference: "amount_cents = full_replace_cents; fee_type=REPLACEMENT"

  - name: member_ledger
    trigger: "fee create, fee finalize, fee pay, fee waive"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents = sum(f.amount_cents for f in member fees where f.status in {ACCRUING, PENDING})
      total_assessed_cents      = sum(f.amount_cents for f in member fees where f.status in {PENDING, PAID, WAIVED})  # finalized only
      total_paid_cents          = sum(f.amount_cents for f in member fees where f.status == PAID)
      total_waived_cents        = sum(f.amount_cents for f in member fees where f.status == WAIVED)
      # Invariant (member_balance_conservation):
      #   total_assessed_cents == outstanding_finalized + total_paid_cents + total_waived_cents
      #   where outstanding_finalized = sum over PENDING fees only.
    input_set: "All fees whose member_id == the member; ACCRUING fees count toward outstanding but not toward total_assessed."
    precision: "integer cents"

  - name: waitlist_promotion
    trigger: "a copy of an item becomes AVAILABLE (checkin GOOD, reservation cancel/expire, maintenance RETURN_TO_SERVICE, donation accept)"
    algorithm: chronological
    formula: |
      candidates = holds h on item where h.status == PENDING and member(h).status == ACTIVE
      if candidates is empty: no promotion (copy stays AVAILABLE)
      else: promote earliest by created_at ASC; tie-break created_at ASC then (still tied) the smaller created_at — created_at is the sole ordering key; id is never used
    input_set: "PENDING holds on the item whose member is ACTIVE."
    precision: "n/a — selector; ranking key = created_at ASC; fallback when empty = no promotion"

  - name: usage_report
    trigger: "GET /library/reports/usage"
    algorithm: aggregation
    formula: |
      window = [from_date, to_date] (inclusive) defaulting to [epoch, current_utc]
      loans_by_category[cat]  = count(loans l where item(l).category == cat and l.checked_out_at in window)
      active_loans            = count(loans l where l.status in {ACTIVE, OVERDUE})
      overdue_loans           = count(loans l where l.status == OVERDUE)
      fees_collected_cents    = sum(f.amount_cents for f where f.status == PAID and f.assessed_at in window)
      copies_retired          = count(copies c where c.condition_status == RETIRED)
    input_set: "Loans/fees/copies filtered by the window and optional category."
    precision: "integer counts and cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path and body-referenced resources exist (validated left-to-right)"
    error_id: "ERR_*_NOT_FOUND (per resource: MEMBER/ITEM/COPY/RESERVATION/LOAN/HOLD/FEE/DONATION/TICKET)"
    http_status: 404
    applies_to: "all endpoints with a resource id in path or body"

  - priority: 4
    category: business_referential
    check: "Acting Member (entity_backed) may only mutate resources whose member_id == X-User-ID"
    error_id: ERR_FORBIDDEN_NOT_OWNER
    http_status: 403
    applies_to: "reservation cancel, loan renew, fee pay, hold — when actor role is Member"

  - priority: 5
    category: business_constraint
    check: "Request body shape/enum values valid; window_start < window_end for reservations"
    error_id: "ERR_VALIDATION / ERR_INVALID_ENUM / ERR_INVALID_WINDOW"
    http_status: 400
    applies_to: "all POST/mutation endpoints with a body"

  - priority: 6
    category: state
    check: "Acting/target Member is ACTIVE (not SUSPENDED/EXPIRED)"
    error_id: ERR_MEMBER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /library/reservations, POST /library/loans, POST /library/holds, POST /library/loans/{id}/renew"

  - priority: 7
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: "ERR_INVALID_STATE / ERR_LOAN_NOT_ACTIVE"
    http_status: 409
    applies_to: "loan renew/return, reservation cancel, donation accept/reject, maintenance resolve, fee pay/waive"

  - priority: 8
    category: business_safety
    check: "Checkout copy must be AVAILABLE (or RESERVED to this member's reservation) AND condition_status GOOD (cross-entity Loan->ItemCopy)"
    error_id: ERR_COPY_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /library/loans"

  - priority: 9
    category: business_temporal
    check: "Reservation window must not push the item over serviceable capacity for any instant in [window_start, window_end) (half-open, aggregate overlap)"
    error_id: ERR_ITEM_NO_CAPACITY_FOR_WINDOW
    http_status: 409
    applies_to: "POST /library/reservations"

  - priority: 10
    category: business_temporal
    check: "Maintenance [scheduled_start, scheduled_end] must not overlap the copy's active loan period widened by BUFFER_DAYS on each side (closed interval + buffer)"
    error_id: ERR_MAINTENANCE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /library/maintenance-tickets"

  - priority: 11
    category: business_referential
    check: "Reserving requires at least one serviceable copy free in the window; else empty-set fallback"
    error_id: ERR_NO_COPY_AVAILABLE
    http_status: 409
    applies_to: "POST /library/reservations"

  - priority: 12
    category: business_referential
    check: "Joining a waitlist requires that the item has zero AVAILABLE serviceable copies right now; and the member must not already hold this item"
    error_id: "ERR_COPY_AVAILABLE_NO_HOLD / ERR_DUPLICATE_HOLD"
    http_status: 409
    applies_to: "POST /library/holds"

  - priority: 13
    category: business_constraint
    check: "Member active-loan count < max_active_loans (checkout); active-hold count < max_active_holds (hold); renewals_used < max_renewals AND no waitlist (renew)"
    error_id: "ERR_LOAN_LIMIT_EXCEEDED / ERR_HOLD_LIMIT_EXCEEDED / ERR_RENEWAL_LIMIT_EXCEEDED / ERR_RENEWAL_BLOCKED_WAITLIST"
    http_status: 409
    applies_to: "POST /library/loans, POST /library/holds, POST /library/loans/{id}/renew"

  - priority: 14
    category: business_fiscal
    check: "Member outstanding_balance_cents < SUSPEND_THRESHOLD_CENTS at checkout/renew"
    error_id: ERR_BALANCE_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /library/loans, POST /library/loans/{id}/renew"

  - priority: 15
    category: business_constraint
    check: "expected_item_version matches the Item's current version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /library/loans"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Members ---
  - method: POST
    path: "/library/members"
    description: "Register a member (starts ACTIVE)"
    roles: [Coordinator]
    code: 201
    input: [name, email, tier, "max_active_loans?", "max_active_holds?", "balance_limit_cents?", "membership_expires_at?"]
    output: Member
    side_effects: ["status=ACTIVE; all ledger counters=0"]

  - method: GET
    path: "/library/members/{member_id}"
    description: "Get a member"
    roles: [Member, Volunteer, Coordinator]
    code: 200
    input: []
    output: Member
    side_effects: []

  # --- Volunteers ---
  - method: POST
    path: "/library/volunteers"
    description: "Create a volunteer/staff record"
    roles: [Coordinator]
    code: 201
    input: [name, role_level, "active?"]
    output: Volunteer
    side_effects: []

  # --- Items & Copies ---
  - method: POST
    path: "/library/items"
    description: "Create a catalog item"
    roles: [Coordinator]
    code: 201
    input: [name, category, replacement_value_cents, loan_period_days, daily_late_fee_cents, "max_renewals?"]
    output: Item
    side_effects: ["all count fields=0, version=1"]

  - method: GET
    path: "/library/items/{id}"
    description: "Get an item with derived availability counts and version"
    roles: [Member, Volunteer, Coordinator]
    code: 200
    input: []
    output: Item
    side_effects: []

  - method: POST
    path: "/library/items/{id}/copies"
    description: "Add a physical copy to an item"
    roles: [Volunteer, Coordinator]
    code: 201
    input: [asset_tag, acquired_on, "origin?"]
    output: ItemCopy
    side_effects: ["copy availability=AVAILABLE, condition=GOOD; Item counts + version recomputed"]

  - method: GET
    path: "/library/items/{id}/copies"
    description: "List copies of an item (FK reverse-reachability for ItemCopy.item_id)"
    roles: [Member, Volunteer, Coordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: ItemCopy[]
    side_effects: []

  - method: GET
    path: "/library/copies/{copy_id}"
    description: "Get a physical copy"
    roles: [Member, Volunteer, Coordinator]
    code: 200
    input: []
    output: ItemCopy
    side_effects: []

  # --- Reservations ---
  - method: POST
    path: "/library/reservations"
    description: "Reserve a copy of an item for a window; server assigns a free copy"
    roles: [Member]
    code: 201
    input: [member_id, item_id, window_start, window_end]
    output: Reservation
    side_effects: ["assign a GOOD AVAILABLE copy -> RESERVED; source=MEMBER; Item counts+version recomputed"]

  - method: GET
    path: "/library/reservations/{reservation_id}"
    description: "Get a reservation"
    roles: [Member, Volunteer, Coordinator]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: GET
    path: "/library/reservations"
    description: "List/filter reservations (FK reverse for member_id and item_id)"
    roles: [Member, Volunteer, Coordinator]
    code: 200
    input: ["member_id?", "item_id?", "status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: POST
    path: "/library/reservations/{reservation_id}/cancel"
    description: "Cancel a PENDING reservation"
    roles: [Member, Volunteer, Coordinator]
    code: 200
    input: []
    output: Reservation
    side_effects: ["status->CANCELLED; assigned copy RESERVED->AVAILABLE; item_availability cascade may promote a hold"]

  # --- Loans ---
  - method: POST
    path: "/library/loans"
    description: "Check out a copy (walk-up or fulfilling a reservation). OCC on Item.version."
    roles: [Volunteer, Coordinator]
    code: 201
    input: [member_id, copy_id, expected_item_version, "reservation_id?"]
    output: Loan
    side_effects:
      - "copy availability -> ON_LOAN; checked_out_at=clock; due_date=clock+loan_period_days; renewals_used=0; status=ACTIVE"
      - "increments Item.version by 1; Item counts recomputed"
      - "if reservation_id given: reservation -> FULFILLED (and any source hold -> FULFILLED)"

  - method: GET
    path: "/library/loans/{loan_id}"
    description: "Get a loan"
    roles: [Member, Volunteer, Coordinator]
    code: 200
    input: []
    output: Loan
    side_effects: []

  - method: GET
    path: "/library/loans"
    description: "List/filter loans (FK reverse for member_id, copy_id, reservation_id)"
    roles: [Member, Volunteer, Coordinator]
    code: 200
    input: ["member_id?", "copy_id?", "reservation_id?", "status?", "limit?", "offset?"]
    output: Loan[]
    side_effects: []

  - method: POST
    path: "/library/loans/{loan_id}/renew"
    description: "Renew a loan (cyclic ACTIVE->ACTIVE)"
    roles: [Member, Volunteer, Coordinator]
    code: 200
    input: []
    output: Loan
    side_effects: ["due_date += loan_period_days; renewals_used += 1"]

  - method: POST
    path: "/library/loans/{loan_id}/return"
    description: "Check in a copy with a condition; finalizes late fee and runs damage/cascade side effects"
    roles: [Volunteer, Coordinator]
    code: 200
    input: [return_condition]
    output: Loan
    side_effects:
      - "status->RETURNED; ACCRUING late fee FINALIZED->PENDING"
      - "GOOD: copy->AVAILABLE + promote cascade; MINOR/MAJOR_DAMAGE: copy->NEEDS_MAINTENANCE + auto MaintenanceTicket + DAMAGE fee; LOST: copy->RETIRED + REPLACEMENT fee"
      - "fee finalization may suspend the member"

  # --- Holds / waitlist ---
  - method: POST
    path: "/library/holds"
    description: "Join the waitlist for an item that currently has no AVAILABLE copy"
    roles: [Member]
    code: 201
    input: [member_id, item_id]
    output: Hold
    side_effects: ["status=PENDING; Item.waitlist_length recomputed"]

  - method: GET
    path: "/library/holds/{hold_id}"
    description: "Get a hold"
    roles: [Member, Volunteer, Coordinator]
    code: 200
    input: []
    output: Hold
    side_effects: []

  - method: GET
    path: "/library/holds"
    description: "List/filter holds (FK reverse for member_id and item_id)"
    roles: [Member, Volunteer, Coordinator]
    code: 200
    input: ["member_id?", "item_id?", "status?", "limit?", "offset?"]
    output: Hold[]
    side_effects: []

  # --- Fees ---
  - method: GET
    path: "/library/fees/{fee_id}"
    description: "Get a fee"
    roles: [Member, Volunteer, Coordinator]
    code: 200
    input: []
    output: Fee
    side_effects: []

  - method: GET
    path: "/library/fees"
    description: "List/filter fees (FK reverse for member_id and loan_id)"
    roles: [Member, Volunteer, Coordinator]
    code: 200
    input: ["member_id?", "loan_id?", "status?", "limit?", "offset?"]
    output: Fee[]
    side_effects: []

  - method: POST
    path: "/library/fees/{fee_id}/pay"
    description: "Pay a PENDING fee in full"
    roles: [Member, Volunteer, Coordinator]
    code: 200
    input: []
    output: Fee
    side_effects: ["status->PAID; member outstanding_balance_cents -= amount; total_paid_cents += amount"]

  - method: POST
    path: "/library/fees/{fee_id}/waive"
    description: "Waive a fee"
    roles: [Coordinator]
    code: 200
    input: ["reason?"]
    output: Fee
    side_effects: ["status->WAIVED; member outstanding_balance_cents -= amount; total_waived_cents += amount"]

  # --- Donations / intake ---
  - method: POST
    path: "/library/donations"
    description: "Record a donation offer against a catalog item"
    roles: [Member, Volunteer, Coordinator]
    code: 201
    input: [donor_name, item_id, proposed_condition, "donor_member_id?"]
    output: Donation
    side_effects: ["status=OFFERED"]

  - method: GET
    path: "/library/donations/{donation_id}"
    description: "Get a donation"
    roles: [Volunteer, Coordinator]
    code: 200
    input: []
    output: Donation
    side_effects: []

  - method: GET
    path: "/library/donations"
    description: "List/filter donations (FK reverse for item_id)"
    roles: [Volunteer, Coordinator]
    code: 200
    input: ["item_id?", "status?", "limit?", "offset?"]
    output: Donation[]
    side_effects: []

  - method: POST
    path: "/library/donations/{donation_id}/accept"
    description: "Accept a donation and mint an ItemCopy"
    roles: [Volunteer, Coordinator]
    code: 200
    input: [asset_tag, "acquired_on?"]
    output: Donation
    side_effects: ["status->ACCEPTED; mint ItemCopy(AVAILABLE,GOOD,origin=DONATION); Item counts+version recomputed; promote cascade"]

  - method: POST
    path: "/library/donations/{donation_id}/reject"
    description: "Reject a donation offer"
    roles: [Volunteer, Coordinator]
    code: 200
    input: ["reason?"]
    output: Donation
    side_effects: ["status->REJECTED"]

  # --- Maintenance ---
  - method: POST
    path: "/library/maintenance-tickets"
    description: "Open a maintenance ticket for a copy (manual/scheduled)"
    roles: [Volunteer, Coordinator]
    code: 201
    input: [copy_id, reason, "severity?", "scheduled_start?", "scheduled_end?"]
    output: MaintenanceTicket
    side_effects: ["status=OPEN, source=MANUAL; copy condition GOOD->NEEDS_MAINTENANCE if immediate"]

  - method: GET
    path: "/library/maintenance-tickets/{ticket_id}"
    description: "Get a maintenance ticket"
    roles: [Volunteer, Coordinator]
    code: 200
    input: []
    output: MaintenanceTicket
    side_effects: []

  - method: GET
    path: "/library/maintenance-tickets"
    description: "List/filter maintenance tickets (FK reverse for copy_id)"
    roles: [Volunteer, Coordinator]
    code: 200
    input: ["copy_id?", "status?", "limit?", "offset?"]
    output: MaintenanceTicket[]
    side_effects: []

  - method: POST
    path: "/library/maintenance-tickets/{ticket_id}/resolve"
    description: "Resolve a ticket, returning the copy to service or scrapping it"
    roles: [Volunteer, Coordinator]
    code: 200
    input: [outcome]
    output: MaintenanceTicket
    side_effects: ["RETURN_TO_SERVICE: copy->GOOD+AVAILABLE + promote cascade; SCRAP: copy->RETIRED"]

  # --- Reporting ---
  - method: GET
    path: "/library/reports/usage"
    description: "Usage report: loans by category, active/overdue counts, fees collected, copies retired"
    roles: [Coordinator]
    code: 200
    input: ["from_date?", "to_date?", "category?"]
    output: "{ loans_by_category: object, active_loans: integer, overdue_loans: integer, fees_collected_cents: integer, copies_retired: integer }"
    side_effects: []

  # --- System / clock / ops ---
  - method: POST
    path: "/library/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-03-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [Coordinator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["logical clock set; no entity transitions fire (use _ops/run to advance state)"]

  - method: POST
    path: "/library/_ops/run"
    description: "Batch housekeeping: overdue->OVERDUE, LOST declarations, reservation/hold expiry, waitlist promotion, membership expiry/reinstate, late-fee accrual, scheduled maintenance start"
    roles: [Coordinator]
    code: 200
    input: []
    output: "{ overdue_count: integer, lost_count: integer, expired_reservations: integer, promoted_holds: integer, expired_holds: integer, reinstated_members: integer, expired_members: integer }"
    side_effects: ["drives all clock-gated system transitions against the current logical clock"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation per RBAC" }
  - { id: ERR_FORBIDDEN_NOT_OWNER, http: 403, condition: "Member acting on a resource whose member_id != X-User-ID" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "Referenced member does not exist" }
  - { id: ERR_ITEM_NOT_FOUND, http: 404, condition: "Referenced item does not exist" }
  - { id: ERR_COPY_NOT_FOUND, http: 404, condition: "Referenced copy does not exist" }
  - { id: ERR_RESERVATION_NOT_FOUND, http: 404, condition: "Referenced reservation does not exist" }
  - { id: ERR_LOAN_NOT_FOUND, http: 404, condition: "Referenced loan does not exist" }
  - { id: ERR_HOLD_NOT_FOUND, http: 404, condition: "Referenced hold does not exist" }
  - { id: ERR_FEE_NOT_FOUND, http: 404, condition: "Referenced fee does not exist" }
  - { id: ERR_DONATION_NOT_FOUND, http: 404, condition: "Referenced donation does not exist" }
  - { id: ERR_TICKET_NOT_FOUND, http: 404, condition: "Referenced maintenance ticket does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field or malformed body" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field carries a value outside its allowed set" }
  - { id: ERR_INVALID_WINDOW, http: 400, condition: "Reservation window_start >= window_end" }
  - { id: ERR_MEMBER_NOT_ACTIVE, http: 409, condition: "Member is SUSPENDED or EXPIRED when an ACTIVE member is required" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state that permits the requested transition" }
  - { id: ERR_LOAN_NOT_ACTIVE, http: 409, condition: "Loan is not ACTIVE/OVERDUE for renew/return" }
  - { id: ERR_COPY_NOT_AVAILABLE, http: 409, condition: "Checkout copy is not AVAILABLE/GOOD (or reserved to another member)" }
  - { id: ERR_NO_COPY_AVAILABLE, http: 409, condition: "No serviceable copy free for the reservation window (empty candidate set)" }
  - { id: ERR_ITEM_NO_CAPACITY_FOR_WINDOW, http: 409, condition: "Reservation window overlaps existing commitments beyond serviceable capacity" }
  - { id: ERR_MAINTENANCE_WINDOW_CONFLICT, http: 409, condition: "Maintenance window overlaps the copy's active loan period plus buffer" }
  - { id: ERR_LOAN_LIMIT_EXCEEDED, http: 409, condition: "Member already has max_active_loans active loans" }
  - { id: ERR_HOLD_LIMIT_EXCEEDED, http: 409, condition: "Member already has max_active_holds active holds" }
  - { id: ERR_RENEWAL_LIMIT_EXCEEDED, http: 409, condition: "Loan already used max_renewals renewals" }
  - { id: ERR_RENEWAL_BLOCKED_WAITLIST, http: 409, condition: "Renewal blocked because the item has PENDING/PROMOTED holds" }
  - { id: ERR_DUPLICATE_HOLD, http: 409, condition: "Member already holds a PENDING/PROMOTED hold on the item" }
  - { id: ERR_COPY_AVAILABLE_NO_HOLD, http: 409, condition: "Cannot join waitlist while an AVAILABLE serviceable copy exists" }
  - { id: ERR_BALANCE_LIMIT_EXCEEDED, http: 402, condition: "Member outstanding_balance_cents >= SUSPEND_THRESHOLD_CENTS at checkout/renew" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_item_version does not match Item.version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Member
    description: "A library member who reserves items, borrows/renews, joins waitlists, and pays their own fees."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /library/reservations — reserve (must be self)"
      - "POST /library/holds — join waitlist (must be self)"
    shared_operations:
      - "POST /library/reservations/{id}/cancel — own reservation"
      - "POST /library/loans/{id}/renew — own loan"
      - "POST /library/fees/{id}/pay — own fee"
      - "POST /library/donations — record a donation"
      - "GET /library/members/{id}, items, copies, reservations, loans, holds, fees — read"

  - name: Volunteer
    description: "Desk volunteer performing checkout/checkin, intake, and maintenance operations."
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "POST /library/loans — checkout"
      - "POST /library/loans/{id}/return — checkin"
      - "POST /library/items/{id}/copies — add copy"
      - "POST /library/donations/{id}/accept — intake"
      - "POST /library/donations/{id}/reject"
      - "POST /library/maintenance-tickets — open ticket"
      - "POST /library/maintenance-tickets/{id}/resolve"
    shared_operations:
      - "POST /library/reservations/{id}/cancel — any reservation"
      - "POST /library/loans/{id}/renew — any loan"
      - "POST /library/fees/{id}/pay — any fee"
      - "POST /library/donations — record a donation"
      - "GET reads across members/items/copies/reservations/loans/holds/fees/donations/tickets"

  - name: Coordinator
    description: "Library coordinator/admin operator (superset of Volunteer via hierarchical override) who manages catalog, members, fee waivers, reporting, the logical clock, and ops runs."
    identity: "opaque"
    exclusive_operations:
      - "POST /library/members — register member"
      - "POST /library/volunteers — create volunteer"
      - "POST /library/items — create catalog item"
      - "POST /library/fees/{id}/waive — waive fee"
      - "GET /library/reports/usage — usage report"
      - "POST /library/_clock/set_current_utc — set logical clock"
      - "POST /library/_ops/run — housekeeping batch"
    shared_operations:
      - "All Volunteer operations (checkout, checkin, copies, intake, maintenance)"
      - "All Member-shared operations on any resource (cancel, renew, pay)"
