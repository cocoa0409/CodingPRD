      - name: retention_expiry_instant_inclusive_to_the_millisecond
        grounds:
          - calculations.retention_expiry
          - validations[priority=29]
          - errors.ERR_RETENTION_PERIOD_NOT_ELAPSED
          - state_machines.RecordSeries.ELIGIBLE_FOR_DISPOSITION_to_DISPOSED
        distinguishing_aspect: |
          Metric: the logical clock against retention_expiry_utc at MILLISECOND
          resolution, on the third distinct endpoint POST /record-series/{id}/dispose.
          latest_record_year 2020 plus retention_years 5 fixes the expiry at
          2025-12-31T23:59:59.000Z. One millisecond earlier (23:59:58.999Z) disposal must
          fail; at the exact instant it must succeed, because the comparison is `>=`.
          Neither partner instance touches the clock: one compares two rounded decimal
          scores, the other compares a set cardinality.
        test_recipe:
          setup:
            - "RetentionSchedule with retention_years 5, disposition_action DESTROY and min_appraisal_score_for_permanent 75.00."
            - "RecordSeries 1990-2020 with annual_volume_linear_feet 60, so retention_expiry_utc == 2025-12-31T23:59:59.000Z."
            - "The clock is moved to exactly the expiry instant and a FINAL appraisal (informational 5, evidential 5, brand 0, uniqueness 3, provenance true: core 36, age_bonus 6, penalty 1 -> 41.00 < 75.00 -> DESTROY) moves the series to ELIGIBLE_FOR_DISPOSITION, itself proving the `>=` comparison is inclusive."
            - "No ArchivalItem is ON_LOAN and no FindingAid is PUBLISHED, so no other precondition interferes."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "BND-D", retention_years: 5, disposition_action: "DESTROY", legal_citation: "Retention Schedule 12.4", min_appraisal_score_for_permanent: 75.00 }
              as: ArchivesDirector
              captures: { sched_id: $.data.id }
            - call: "POST /record-series"
              payload: { title: "Routine Facilities Logs", business_unit: "FAC", retention_schedule_id: "${sched_id}", sensitivity_ceiling: "INTERNAL", annual_volume_linear_feet: 60, earliest_record_year: 1990, latest_record_year: 2020 }
              as: Archivist
              captures: { series_id: $.data.id, expiry: $.data.retention_expiry_utc }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2025-12-31T23:59:59.000Z" }
              as: SystemOperator
            - call: "GET /record-series/${series_id}"
              payload: {}
              as: Archivist
              captures: { series_v: $.data.version }
            - call: "POST /appraisals"
              payload: { record_series_id: "${series_id}", informational_value: 5, evidential_value: 5, brand_heritage_value: 0, uniqueness_factor: 3, provenance_verified: true, expected_series_version: "${series_v}" }
              as: Archivist
              captures: { appr_id: $.data.id }
            - call: "POST /appraisals/${appr_id}/screen"
              payload: {}
              as: Archivist
            - call: "POST /appraisals/${appr_id}/finalize"
              payload: {}
              as: ArchivesDirector
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2025-12-31T23:59:58.999Z" }
              as: SystemOperator
            - call: "POST /record-series/${series_id}/dispose"
              payload: { disposition_certificate_reference: "CERT-2025-0001" }
              as: ArchivesDirector
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2025-12-31T23:59:59.000Z" }
              as: SystemOperator
            - call: "POST /record-series/${series_id}/dispose"
              payload: { disposition_certificate_reference: "CERT-2025-0001" }
              as: ArchivesDirector
          assert:
            - "RecordSeries.${series_id}.retention_expiry_utc == 2025-12-31T23:59:59.000Z"
            - "AppraisalRecord.${appr_id}.final_score == 41.00"
            - "AppraisalRecord.${appr_id}.recommended_disposition == DESTROY"
            - "after finalize at the exact expiry instant: RecordSeries.${series_id}.disposition_state == ELIGIBLE_FOR_DISPOSITION"
            - "dispose at 2025-12-31T23:59:58.999Z: HTTP 422 and error_id == ERR_RETENTION_PERIOD_NOT_ELAPSED"
            - "after the failed dispose: RecordSeries.${series_id}.disposition_state == ELIGIBLE_FOR_DISPOSITION and disposition_certificate_reference == null"
            - "dispose at 2025-12-31T23:59:59.000Z: HTTP 200"
            - "RecordSeries.${series_id}.disposition_state == DISPOSED"
            - "RecordSeries.${series_id}.disposition_certificate_reference == CERT-2025-0001"

