            - "GET /safety-plans filtered by client_id returns total_count 1 (status DRAFT) for ${client_b} and 0 for both ${client_a} and ${client_c}"
            - "Client.${client_c}.resource_referral_count == 1 while ${client_a} and ${client_b} both stay at 0"

