              captures: { cust_id: $.data.id }
            - call: "POST /power/ppas"
              payload: { site_id: "${site_id}", customer_id: "${cust_id}", term_years: 15, contracted_kw: 500, contracted_efficiency_kwh_per_therm: 7.4, contracted_annual_kwh: 3240000, tariff_base_cents_per_kwh: 12.0, escalator_pct: 0.03, fuel_adder_cents_per_therm: 2.50, guaranteed_availability_pct: 0.97, guaranteed_delivery_kwh: 3240000, customer_cure_deadline_days: 30, fuel_responsibility: "PPA_FUEL_INCLUDED", loss_floor_cents: 25000 }
              as: SiteOperator
              captures: { ppa_id: $.data.id }
            - call: "POST /power/ppas/${ppa_id}/activate"
              payload: {}
              as: SiteOperator
              captures: { ppa_v: $.data.version }
            - call: "POST /power/ppa-accruals"
              payload: { ppa_id: "${ppa_id}", site_id: "${site_id}", accrual_type: "CHARGE_ACCRUAL", amount_cents: 100000, period_anchor_iso8601: "2026-03-01T00:00:00Z" }
              as: SettlementAnalyst
              captures: { accrual_id: $.data.id, ppa_v: $.data.version }
            - call: "POST /power/ppas/${ppa_id}/allowances"
              payload: { allowance_kind: "CAPACITY_ALLOWANCE", amount_cents: 185000, expected_ppa_version: "${ppa_v}" }
              as: SettlementAnalyst
              captures: { allow_id: $.data.id, ppa_v: $.data.version }
            - call: "POST /power/ppas/${ppa_id}/settlement-lines"
              payload: { period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", metered_kwh: 200000, downtime_hours: 3.0, customer_source_deadline_iso8601: "2026-03-15T00:00:00Z", hourly_settlement: false, expected_ppa_version: "${ppa_v}" }
              as: SettlementAnalyst
              captures: { line_id: $.data.id, ppa_v: $.data.version }
            - call: "POST /power/ppas/${ppa_id}/settlement-lines/${line_id}/validate"
              payload: {}
              as: SettlementAnalyst
              captures: { ppa_v: $.data.version }
            - call: "POST /power/ppas/${ppa_id}/settlement-lines/${line_id}/approve"
              payload: {}
              as: SettlementApprover
              captures: { ppa_v: $.data.version }
            - call: "POST /power/ppas/${ppa_id}/settlement-lines/${line_id}/settle"
              payload: {}
