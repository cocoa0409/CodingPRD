          Both age thresholds are strictly-greater comparisons against the
          logical clock's calendar year, and the surcharge band is closed at the
          top: with the clock in 2026, year_built 2001 (age 25) is APPROVED at
          0.00, 2000 (age 26) is OVERAGE_SURCHARGED at 0.25, 1996 (age exactly
          30) is STILL OVERAGE_SURCHARGED, and only 1995 (age 31) is BLOCKED.
          A brand-new 2024 hull on an unapproved society is BLOCKED regardless
          of age, and every BLOCKED outcome resets overage_surcharge_pct to
          0.00 rather than leaving the surcharge behind.
        test_recipe:
          setup:
            - "logical clock pinned to 2026-08-01T00:00:00Z so the calendar year is 2026"
            - "five PENDING_REVIEW vessels: 2001/LR, 2000/LR, 1996/ABS, 1995/DNV, 2024/UNCLASSED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vessels"
              payload: { name: "MV Age25", imo_number: "9100011", year_built: 2001, classification_society: "LR", flag_code: "SG", vessel_accumulation_limit_amount: 8000000 }
