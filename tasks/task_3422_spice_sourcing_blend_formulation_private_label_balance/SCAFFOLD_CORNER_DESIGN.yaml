          - roles[QualityManager]
        distinguishing_aspect: "QualityAnalyst (the posting role) calling the QualityManager-only disposition endpoint is rejected ERR_UNAUTHORIZED — peer-role exclusivity, distinct from the same-person segregation rule."
        test_recipe:
          setup: ["supplier S; lot IN_TEST (one MICRO PASS)"]
          setup_api_calls:
            - { call: "POST /spice/suppliers", payload: { name: "Malabar Exports", origin_country: "IN" }, as: SupplyPlanner, captures: { sup: $.data.id } }
