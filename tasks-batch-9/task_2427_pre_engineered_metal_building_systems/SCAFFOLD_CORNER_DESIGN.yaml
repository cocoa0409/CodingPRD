          - errors[ERR_LOT_NOT_FOUND]
          - errors[ERR_LOAD_NOT_FOUND]
        distinguishing_aspect: "Ten separate existence codes exist rather than one generic ERR_NOT_FOUND, and each read endpoint must raise its own: the same unknown UUID produces a different error_id on each of the ten single-row reads, all at HTTP 404."
        test_recipe:
          setup:
            - "Empty database — nothing has been created, so no id resolves anywhere."
          setup_api_calls: []
          trigger:
            - call: "GET /jurisdictions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
            - call: "GET /builders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SalesEngineer
            - call: "GET /building-configurations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SalesEngineer
            - call: "GET /quotes/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SalesEngineer
            - call: "GET /engineering-designs/00000000-0000-4000-8000-000000000000"
              payload: {}
