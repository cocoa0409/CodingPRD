# =============================================================================
# PRD Benchmark Scaffold — Recycling MRF & Commodity Settlement
# Difficulty: Expert
# =============================================================================

scenario: |
  838. Recycling MRF & Commodity Settlement: inbound tonnage & composition audit,
  sort & bale by commodity, contamination rate & rebate/penalty, commodity-index
  pricing & revenue share, outbound mill shipment, residual disposal, throughput &
  downtime, municipal reporting

domain_name: recycling-mrf-settlement
api_prefix: /mrf

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation      # provisional vs final on both contamination adjustment and bale value
    - derived_field_reconciliation  # municipal balance ledger, sortline throughput
    - rate_threshold_triggers       # contamination clean/penalty/reject thresholds
    - optimistic_concurrency        # OCC on Municipality.version for statement create-with-supersede

  entity_topology: flat
  # Peer entities joined by FK references; no nested resource URLs. Every FK is
  # reverse-reachable via a filtered-list GET.

  state_machine_shape: cyclic
  # InboundLoad has an AUDITED<->PENDING_REAUDIT revision loop; MillShipment has a
  # SETTLED<->DISPUTED loop. CommodityIndex, Bale, MunicipalStatement are linear.

  relationship_patterns:
    - one_to_many        # Municipality -> InboundLoad, InboundLoad -> Bale, MillShipment -> Bale
    - cross_aggregate    # Bale settlement posts revenue share across to Municipality

  role_model: peer_roles
  # ScaleOperator, SortManager, CommodityTrader, SettlementClerk each own distinct
  # resource types; Municipality is entity-backed and reads its own records.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Municipality
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Municipality name" }
      - { name: contact_email, type: string, source: input, required: false, description: "Optional contact email" }
      - { name: revenue_share_pct, type: number, source: input, description: "Fraction (0..1) of settled commodity revenue paid to this municipality", constraints: "0 <= revenue_share_pct <= 1" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }
      - { name: revenue_share_accrued_cents, type: integer, source: computed, default: 0, description: "Running sum of REVENUE_SHARE postings (net of REVERSALs)" }
      - { name: lifetime_rebate_cents, type: integer, source: computed, default: 0, description: "Running sum of REBATE postings" }
      - { name: lifetime_penalty_cents, type: integer, source: computed, default: 0, description: "Running sum of PENALTY postings (stored as positive magnitude)" }
      - { name: balance_cents, type: integer, source: computed, default: 0, description: "= revenue_share_accrued_cents + lifetime_rebate_cents - lifetime_penalty_cents; net owed to municipality" }

  - name: Mill
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Mill / buyer name" }
      - { name: commodity_focus, type: enum, source: input, description: "OCC | MIXED_PAPER | PET | HDPE | ALUMINUM | STEEL | GLASS" }
      - { name: freight_rate_cents_per_ton, type: integer, source: input, description: "Reference freight rate (documentation only)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE" }

  - name: CommodityIndex
    parent: null
    common_fields: true
    fields:
      - { name: commodity, type: enum, source: input, description: "OCC | MIXED_PAPER | PET | HDPE | ALUMINUM | STEEL | GLASS" }
      - { name: price_cents_per_ton, type: integer, source: input, description: "Published price in cents per ton" }
      - { name: effective_start, type: datetime, source: input, description: "Half-open window start, inclusive (ISO8601 UTC)" }
      - { name: effective_end, type: datetime, source: input, description: "Half-open window end, exclusive (ISO8601 UTC)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PUBLISHED | SUPERSEDED" }

  - name: SortLine
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Sort line name" }
      - { name: rated_tph, type: number, source: input, description: "Rated tons-per-hour capacity" }
      - { name: scheduled_shift_minutes, type: integer, source: input, default: 480, description: "Scheduled operating minutes per shift" }
      - { name: status, type: enum, source: system, default: IDLE, description: "IDLE | RUNNING | DOWN" }
      - { name: total_processed_tons, type: number, source: computed, default: 0, description: "Sum of net_tons over InboundLoads on this line with status=CLOSED" }
      - { name: total_downtime_minutes, type: integer, source: computed, default: 0, description: "Sum of downtime_minutes over this line's DowntimeEvents" }
      - { name: throughput_tph, type: number, source: computed, default: 0, description: "= round(total_processed_tons / uptime_hours, 2); uptime_hours=(scheduled_shift_minutes - total_downtime_minutes)/60; 0 when uptime_hours <= 0" }

  - name: DowntimeEvent
    parent: null
    common_fields: true
    fields:
      - { name: sort_line_id, type: string, source: input, description: "FK -> SortLine.id" }
      - { name: start_at, type: datetime, source: input, description: "Downtime start (ISO8601 UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Downtime end (ISO8601 UTC)" }
      - { name: reason, type: string, source: input, description: "Downtime reason" }
      - { name: downtime_minutes, type: integer, source: computed, description: "= whole minutes between start_at and end_at (floor)" }

  - name: InboundLoad
    parent: null
    common_fields: true
    fields:
      - { name: source_municipality_id, type: string, source: input, description: "FK -> Municipality.id; municipality that delivered the load" }
      - { name: sort_line_id, type: string, source: input, description: "FK -> SortLine.id; line assigned to process the load" }
      - { name: hauler, type: string, source: input, description: "Hauler name" }
      - { name: gross_tons, type: number, source: input, description: "Gross weighbridge tonnage" }
      - { name: tare_tons, type: number, source: input, description: "Truck tare tonnage" }
      - { name: net_tons, type: number, source: computed, description: "= gross_tons - tare_tons (conserved quantity for mass balance)" }
      - { name: sampled_contamination_pct, type: number, source: computed, description: "Sampled contamination percent captured at audit (0..100)" }
      - { name: audited_composition, type: array, source: computed, description: "List of {commodity, pct} captured at audit" }
      - { name: provisional_adjustment_cents, type: integer, source: computed, default: 0, description: "Rebate(+)/penalty(-) from sampled_contamination_pct at audit; not yet posted to Municipality" }
      - { name: residual_tons, type: number, source: computed, default: 0, description: "Residual disposal tonnage recorded at close" }
      - { name: final_adjustment_cents, type: integer, source: computed, default: 0, description: "Rebate(+)/penalty(-) recomputed at close from residual-derived contamination; posted to Municipality" }
      - { name: baled_tons, type: number, source: computed, default: 0, description: "Sum of net_tons over non-VOIDED bales of this load" }
      - { name: unbaled_remaining_tons, type: number, source: computed, description: "= net_tons - baled_tons - residual_tons" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "RECEIVED | AUDITED | PENDING_REAUDIT | CLOSED" }

  - name: Bale
    parent: null
    common_fields: true
    fields:
      - { name: source_load_id, type: string, source: input, description: "FK -> InboundLoad.id" }
      - { name: shipment_id, type: string, source: computed, required: false, description: "FK -> MillShipment.id; null until assigned to a shipment" }
      - { name: commodity, type: enum, source: input, description: "OCC | MIXED_PAPER | PET | HDPE | ALUMINUM | STEEL | GLASS" }
      - { name: net_tons, type: number, source: input, description: "Baled net tonnage" }
      - { name: moisture_pct, type: number, source: input, description: "Moisture dockage percent (0..100)" }
      - { name: quality_grade, type: enum, source: input, description: "A | B | C" }
      - { name: index_price_snapshot_cents, type: integer, source: computed, description: "price_cents_per_ton of the PUBLISHED index for commodity at bale created_at" }
      - { name: provisional_value_cents, type: integer, source: computed, description: "Provisional value using index snapshot at baling (see calc bale_valuation, provisional variant)" }
      - { name: final_value_cents, type: integer, source: computed, default: 0, description: "Final settled value using index at settle time minus freight share (final variant)" }
      - { name: freight_share_cents, type: integer, source: computed, default: 0, description: "Allocated freight at settlement" }
      - { name: status, type: enum, source: system, default: BALED, description: "BALED | STAGED | SHIPPED | SETTLED | VOIDED" }

  - name: MillShipment
    parent: null
    common_fields: true
    fields:
      - { name: mill_id, type: string, source: input, description: "FK -> Mill.id" }
      - { name: commodity, type: enum, source: input, description: "OCC | MIXED_PAPER | PET | HDPE | ALUMINUM | STEEL | GLASS; all bales must match" }
      - { name: freight_cost_cents, type: integer, source: input, description: "Total freight for the shipment, allocated to bales by tonnage at settlement" }
      - { name: total_net_tons, type: number, source: computed, default: 0, description: "Sum of net_tons over assigned (non-VOIDED) bales" }
      - { name: gross_settlement_cents, type: integer, source: computed, default: 0, description: "Sum of per-bale rounded final_value_cents (round-per-bale-then-sum); set at settle" }
      - { name: status, type: enum, source: system, default: BUILDING, description: "BUILDING | SHIPPED | SETTLED | DISPUTED" }

  - name: MunicipalStatement
    parent: null
    common_fields: true
    fields:
      - { name: municipality_id, type: string, source: input, description: "FK -> Municipality.id" }
      - { name: period_start, type: datetime, source: input, description: "Reporting period start, inclusive (ISO8601 UTC)" }
      - { name: period_end, type: datetime, source: input, description: "Reporting period end, exclusive (ISO8601 UTC)" }
      - { name: total_revenue_share_cents, type: integer, source: computed, default: 0, description: "Sum of REVENUE_SHARE postings in period; set at finalize" }
      - { name: total_rebate_cents, type: integer, source: computed, default: 0, description: "Sum of REBATE postings in period; set at finalize" }
      - { name: total_penalty_cents, type: integer, source: computed, default: 0, description: "Sum of PENALTY posting magnitudes in period; set at finalize" }
      - { name: net_payable_cents, type: integer, source: computed, default: 0, description: "= total_revenue_share_cents + total_rebate_cents - total_penalty_cents; set at finalize" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | FINALIZED | SUPERSEDED" }

  - name: RevenueSharePosting
    parent: null
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: municipality_id, type: string, source: input, description: "FK -> Municipality.id" }
      - { name: posting_type, type: enum, source: system, description: "REVENUE_SHARE | REBATE | PENALTY | REVERSAL" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cents applied to the municipality ledger by this posting" }
      - { name: related_bale_id, type: string, source: system, required: false, description: "Id of the bale that produced this posting, if any (audit reference, not an enforced FK)" }
      - { name: related_load_id, type: string, source: system, required: false, description: "Id of the inbound load that produced this posting, if any (audit reference, not an enforced FK)" }
      - { name: reversed, type: boolean, source: system, default: false, description: "True once a REVERSAL posting has offset this REVENUE_SHARE posting" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CommodityIndex
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /mrf/commodity-indices/{indexId}/publish"
        actor: CommodityTrader
        preconditions:
          - "Index in DRAFT (ERR_INDEX_NOT_DRAFT)"
          - "effective_start < effective_end (ERR_INVALID_INTERVAL)"
          - "No existing PUBLISHED index for the same commodity whose half-open [effective_start, effective_end) window overlaps this one; adjacency (prev.effective_end == this.effective_start) is allowed (ERR_INDEX_WINDOW_OVERLAP)"
        side_effects:
          - "status = PUBLISHED"

      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system: another index for the same commodity is published with a later effective_start"
        actor: system
        preconditions:
          - "A newer PUBLISHED index for the same commodity exists with strictly greater effective_start"
        side_effects:
          - "status = SUPERSEDED"
        note: "Single-hop: publishing index B whose effective_start is later supersedes the most recent prior PUBLISHED index A for that commodity only when their windows are adjacent (A.effective_end == B.effective_start)."

  - entity: InboundLoad
    initial_state: RECEIVED
    terminal_states: [CLOSED]
    transitions:
      - from: RECEIVED
        to: AUDITED
        trigger: "POST /mrf/inbound-loads/{loadId}/audit"
        actor: ScaleOperator
        preconditions:
          - "Load in RECEIVED or PENDING_REAUDIT (ERR_LOAD_NOT_AUDITABLE)"
          - "sampled_contamination_pct < REJECT_THRESHOLD_PCT (ERR_CONTAMINATION_UNPROCESSABLE)"
          - "audited_composition percentages each in [0,100]"
        side_effects:
          - "sampled_contamination_pct and audited_composition stored"
          - "provisional_adjustment_cents = contamination_adjustment(provisional variant)"
          - "status = AUDITED"

      - from: AUDITED
        to: PENDING_REAUDIT
        trigger: "POST /mrf/inbound-loads/{loadId}/request-reaudit"
        actor: SortManager
        preconditions:
          - "Load in AUDITED (ERR_LOAD_INVALID_STATE)"
          - "No non-VOIDED bales exist for this load (ERR_LOAD_INVALID_STATE)"
        side_effects:
          - "status = PENDING_REAUDIT"
        note: "Revision loop entry: forces a fresh audit."

      - from: PENDING_REAUDIT
        to: AUDITED
        trigger: "POST /mrf/inbound-loads/{loadId}/audit"
        actor: ScaleOperator
        preconditions:
          - "Load in RECEIVED or PENDING_REAUDIT (ERR_LOAD_NOT_AUDITABLE)"
          - "sampled_contamination_pct < REJECT_THRESHOLD_PCT (ERR_CONTAMINATION_UNPROCESSABLE)"
        side_effects:
          - "sampled_contamination_pct and audited_composition overwritten"
          - "provisional_adjustment_cents recomputed"
          - "status = AUDITED"

      - from: AUDITED
        to: CLOSED
        trigger: "POST /mrf/inbound-loads/{loadId}/close"
        actor: SortManager
        preconditions:
          - "Load in AUDITED (ERR_LOAD_NOT_AUDITED)"
          - "residual_tons + baled_tons <= net_tons (ERR_RESIDUAL_EXCEEDS_NET)"
        side_effects:
          - "residual_tons stored; unbaled_remaining_tons recomputed"
          - "final_adjustment_cents = contamination_adjustment(final variant) using residual-derived contamination"
          - "CASCADE hop 1: a RevenueSharePosting (REBATE if positive, PENALTY if negative) is created for source_municipality_id with amount = final_adjustment_cents"
          - "CASCADE hop 2: that posting updates Municipality.lifetime_rebate_cents / lifetime_penalty_cents and recomputes Municipality.balance_cents; Municipality.version increments"
          - "SortLine.total_processed_tons recomputed (adds net_tons); SortLine.throughput_tph recomputed"
          - "status = CLOSED"

  - entity: Bale
    initial_state: BALED
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: BALED
        to: STAGED
        trigger: "POST /mrf/mill-shipments/{shipmentId}/bales"
        actor: CommodityTrader
        preconditions:
          - "Shipment in BUILDING (ERR_SHIPMENT_NOT_BUILDING)"
          - "Bale in BALED (ERR_BALE_NOT_STAGEABLE)"
          - "bale.commodity == shipment.commodity (ERR_COMMODITY_MISMATCH)"
          - "bale.source_load.status == CLOSED (ERR_BALE_LOAD_NOT_CLOSED)"
        side_effects:
          - "shipment_id = shipment.id"
          - "status = STAGED"
          - "MillShipment.total_net_tons recomputed"

      - from: STAGED
        to: SHIPPED
        trigger: "POST /mrf/mill-shipments/{shipmentId}/ship"
        actor: CommodityTrader
        preconditions:
          - "Parent shipment transitions BUILDING -> SHIPPED"
        side_effects:
          - "status = SHIPPED"

      - from: SHIPPED
        to: SETTLED
        trigger: "POST /mrf/mill-shipments/{shipmentId}/settle"
        actor: CommodityTrader
        preconditions:
          - "Parent shipment in SHIPPED or DISPUTED"
        side_effects:
          - "final_value_cents = bale_valuation(final variant); freight_share_cents allocated"
          - "CASCADE hop 1: RevenueSharePosting REVENUE_SHARE created for the source municipality with amount = round_half_up(final_value_cents * municipality.revenue_share_pct)"
          - "CASCADE hop 2: posting updates Municipality.revenue_share_accrued_cents and balance_cents; Municipality.version increments"
          - "status = SETTLED"

      - from: SETTLED
        to: SHIPPED
        trigger: "POST /mrf/mill-shipments/{shipmentId}/dispute"
        actor: CommodityTrader
        preconditions:
          - "Parent shipment in SETTLED"
        side_effects:
          - "COMPENSATION: for each REVENUE_SHARE posting of this bale not yet reversed, a REVERSAL posting with amount = -original is created; original.reversed = true"
          - "COMPENSATION hop 2: Municipality.revenue_share_accrued_cents and balance_cents restored to pre-settle value"
          - "final_value_cents reset to 0"
          - "status = SHIPPED"

      - from: BALED
        to: VOIDED
        trigger: "POST /mrf/bales/{baleId}/void"
        actor: SortManager
        preconditions:
          - "Bale in BALED or STAGED (ERR_BALE_NOT_VOIDABLE)"
          - "Bale is not SHIPPED or SETTLED"
        side_effects:
          - "status = VOIDED"
          - "shipment_id cleared; MillShipment.total_net_tons recomputed if it was STAGED"
          - "InboundLoad.baled_tons recomputed (drops this bale's net_tons); unbaled_remaining_tons restored"

      - from: STAGED
        to: VOIDED
        trigger: "POST /mrf/bales/{baleId}/void"
        actor: SortManager
        preconditions:
          - "Bale in BALED or STAGED (ERR_BALE_NOT_VOIDABLE)"
        side_effects:
          - "status = VOIDED"
          - "shipment_id cleared; MillShipment.total_net_tons recomputed"
          - "InboundLoad.baled_tons recomputed; unbaled_remaining_tons restored"

  - entity: MillShipment
    initial_state: BUILDING
    terminal_states: [SETTLED]
    transitions:
      - from: BUILDING
        to: SHIPPED
        trigger: "POST /mrf/mill-shipments/{shipmentId}/ship"
        actor: CommodityTrader
        preconditions:
          - "Shipment in BUILDING (ERR_SHIPMENT_NOT_BUILDING)"
          - "At least one assigned (STAGED) bale (ERR_SHIPMENT_EMPTY)"
        side_effects:
          - "status = SHIPPED"
          - "all STAGED bales -> SHIPPED"

      - from: SHIPPED
        to: SETTLED
        trigger: "POST /mrf/mill-shipments/{shipmentId}/settle"
        actor: CommodityTrader
        preconditions:
          - "Shipment in SHIPPED or DISPUTED (ERR_SHIPMENT_NOT_SHIPPED)"
          - "A PUBLISHED CommodityIndex exists for shipment.commodity whose window contains the current clock (ERR_NO_PUBLISHED_INDEX)"
        side_effects:
          - "each SHIPPED bale settled: final_value_cents computed, bale -> SETTLED (see Bale SHIPPED->SETTLED)"
          - "gross_settlement_cents = sum of per-bale rounded final_value_cents"
          - "status = SETTLED"

      - from: SETTLED
        to: DISPUTED
        trigger: "POST /mrf/mill-shipments/{shipmentId}/dispute"
        actor: CommodityTrader
        preconditions:
          - "Shipment in SETTLED (ERR_SHIPMENT_NOT_SETTLED)"
        side_effects:
          - "each SETTLED bale -> SHIPPED with revenue-share compensation (see Bale SETTLED->SHIPPED)"
          - "gross_settlement_cents reset to 0"
          - "status = DISPUTED"

      - from: DISPUTED
        to: SETTLED
        trigger: "POST /mrf/mill-shipments/{shipmentId}/settle"
        actor: CommodityTrader
        preconditions:
          - "Shipment in SHIPPED or DISPUTED (ERR_SHIPMENT_NOT_SHIPPED)"
          - "A PUBLISHED CommodityIndex exists for shipment.commodity at current clock (ERR_NO_PUBLISHED_INDEX)"
        side_effects:
          - "re-settle: bales SHIPPED -> SETTLED, revenue share re-posted; gross_settlement_cents recomputed"
          - "status = SETTLED"

  - entity: MunicipalStatement
    initial_state: OPEN
    terminal_states: [FINALIZED, SUPERSEDED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /mrf/municipal-statements/{statementId}/finalize"
        actor: SettlementClerk
        preconditions:
          - "Statement in OPEN (ERR_STATEMENT_NOT_OPEN)"
        side_effects:
          - "total_revenue_share_cents, total_rebate_cents, total_penalty_cents aggregated over RevenueSharePostings for municipality_id with created_at in [period_start, period_end)"
          - "net_payable_cents computed"
          - "status = FINALIZED"

      - from: OPEN
        to: SUPERSEDED
        trigger: "system: a newer MunicipalStatement is created for the same municipality"
        actor: system
        preconditions:
          - "A newer OPEN statement was created for the same municipality"
        side_effects:
          - "status = SUPERSEDED"
        note: "Create-with-supersede; see concurrency_rules.statement-create-stale-municipality."

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: statement-create-stale-municipality
    parent_entity: Municipality
    write_endpoint: "POST /mrf/municipal-statements"
    occ_field: "expected_municipality_version"
    description: |
      Creating a MunicipalStatement supersedes the municipality's current OPEN
      statement (the product permits a fresh statement to replace an earlier
      draft for the same municipality). A create whose expected_municipality_version
      no longer matches the municipality's current version is rejected: the client's
      view is stale because another write already advanced the municipality (a prior
      statement create, or a settlement/close cascade that posted to the ledger).
    error_id: ERR_STALE_MUNICIPALITY_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: contamination_adjustment
    trigger: "InboundLoad audit (provisional variant) and close (final variant)"
    algorithm: tiered_threshold
    formula: |
      Inputs: net_tons, contamination_pct.
      if contamination_pct <= CLEAN_THRESHOLD_PCT:
        adjustment_cents = + round_half_up(net_tons * CLEAN_REBATE_CENTS_PER_TON)   # rebate to municipality
      elif contamination_pct >= PENALTY_THRESHOLD_PCT:
        points_over = contamination_pct - PENALTY_THRESHOLD_PCT
        adjustment_cents = - round_half_up(net_tons * points_over * PENALTY_CENTS_PER_TON_PER_POINT)  # penalty
      else:
        adjustment_cents = 0
      Boundaries are inclusive: exactly CLEAN_THRESHOLD_PCT is a rebate; exactly
      PENALTY_THRESHOLD_PCT is a (zero-point) penalty = 0; contamination strictly
      between the two thresholds yields 0.
    input_set: "single InboundLoad"
    constants:
      CLEAN_THRESHOLD_PCT: 5.0
      PENALTY_THRESHOLD_PCT: 12.0
      REJECT_THRESHOLD_PCT: 40.0
      CLEAN_REBATE_CENTS_PER_TON: 300
      PENALTY_CENTS_PER_TON_PER_POINT: 150
    precision: "round_half_up to integer cents"
    variants:
      - name: provisional
        when: "at audit"
        difference: "contamination_pct = sampled_contamination_pct from the audit payload; result stored in provisional_adjustment_cents and NOT posted to the ledger"
      - name: final
        when: "at close"
        difference: "contamination_pct = round(residual_tons / net_tons * 100, 4) (residual-derived actual); result stored in final_adjustment_cents AND posted to Municipality via a RevenueSharePosting"

  - name: bale_valuation
    trigger: "Bale creation (provisional variant) and MillShipment settle (final variant)"
    algorithm: weighted_scoring
    formula: |
      Inputs: net_tons, moisture_pct, quality_grade, index_price_cents_per_ton.
      effective_tons = net_tons * (1 - moisture_pct/100)
      grade_mult = GRADE_MULT[quality_grade]                      # A=1.00, B=0.90, C=0.75
      gross_value_cents = round_half_up(effective_tons * index_price_cents_per_ton * grade_mult)
      (provisional): value = gross_value_cents
      (final): value = gross_value_cents - freight_share_cents
      Evaluation order is pinned: compute effective_tons, then apply grade_mult,
      then round once to cents, THEN subtract freight_share_cents (final only).
    input_set: "single Bale + the PUBLISHED CommodityIndex selected for its commodity"
    constants:
      GRADE_MULT_A: 1.00
      GRADE_MULT_B: 0.90
      GRADE_MULT_C: 0.75
    precision: "round_half_up to integer cents"
    variants:
      - name: provisional
        when: "at bale creation"
        difference: "index_price = index_price_snapshot_cents (PUBLISHED index for commodity at bale.created_at clock); freight_share_cents = 0; stored in provisional_value_cents"
      - name: final
        when: "at shipment settle"
        difference: "index_price = price_cents_per_ton of the PUBLISHED index for commodity at the settle-time clock (may differ from snapshot); freight_share_cents deducted; stored in final_value_cents"

  - name: freight_allocation
    trigger: "MillShipment settle"
    algorithm: waterfall_allocation
    formula: |
      For each settling bale b of the shipment:
        freight_share_cents(b) = round_half_up(shipment.freight_cost_cents * b.net_tons / shipment.total_net_tons)
      total_net_tons is the sum of net_tons over the shipment's non-VOIDED bales.
    input_set: "all non-VOIDED bales assigned to the shipment"
    precision: "round_half_up to integer cents per bale"

  - name: mill_shipment_settlement
    trigger: "MillShipment settle"
    algorithm: aggregation
    formula: |
      gross_settlement_cents = sum over settling bales of round_half_up(bale.final_value_cents)
      ROUNDING ORDER IS PINNED: each bale's final_value_cents is already an integer
      (rounded at bale_valuation final variant); the shipment total is the sum of
      those per-bale integers (round-per-bale-then-sum), NOT a single rounding of the
      summed real-valued products. The two orders can differ by up to (n-1) cents.
    input_set: "SHIPPED bales of the shipment (status transitions to SETTLED)"
    precision: "integer cents; per-bale rounding precedes summation"

  - name: municipal_revenue_share
    trigger: "Bale settlement (posts) and shipment dispute (reverses)"
    algorithm: aggregation
    formula: |
      per_bale_share_cents = round_half_up(bale.final_value_cents * municipality.revenue_share_pct)
      The source municipality is bale.source_load.source_municipality_id.
      Posting increments Municipality.revenue_share_accrued_cents by per_bale_share_cents;
      a REVERSAL on dispute decrements it by the same amount (money conservation).
    input_set: "single settled Bale + its source Municipality"
    precision: "round_half_up to integer cents"

  - name: statement_totals
    trigger: "MunicipalStatement finalize"
    algorithm: aggregation
    formula: |
      Let P = RevenueSharePostings where municipality_id == statement.municipality_id
              AND created_at in [period_start, period_end)   # inclusive start, exclusive end
              AND (posting is not itself reversed for REVENUE_SHARE types).
      total_revenue_share_cents = sum(amount_cents of P where posting_type==REVENUE_SHARE)
                                  + sum(amount_cents of P where posting_type==REVERSAL)   # reversals are negative
      total_rebate_cents  = sum(amount_cents of P where posting_type==REBATE)             # positive
      total_penalty_cents = sum(-amount_cents of P where posting_type==PENALTY)           # stored magnitude (positive)
      net_payable_cents   = total_revenue_share_cents + total_rebate_cents - total_penalty_cents
      Tie-break / ordering: postings are summed in created_at ASC order (immaterial to
      the sum but pinned for determinism of any partial-period audit).
    input_set: "RevenueSharePostings of one municipality within the half-open period window"
    precision: "integer cents"

  - name: sortline_throughput
    trigger: "InboundLoad close (adds processed tons) and DowntimeEvent creation (adds downtime)"
    algorithm: aggregation
    formula: |
      total_processed_tons = sum(net_tons of InboundLoads where sort_line_id == line.id AND status == CLOSED)
      total_downtime_minutes = sum(downtime_minutes of DowntimeEvents where sort_line_id == line.id)
      uptime_hours = (scheduled_shift_minutes - total_downtime_minutes) / 60
      throughput_tph = round(total_processed_tons / uptime_hours, 2) if uptime_hours > 0 else 0
    input_set: "CLOSED loads and all downtime events on the line"
    precision: "throughput_tph rounded to 2 decimals; 0 when uptime_hours <= 0"

  - name: load_mass_balance
    trigger: "Bale create/void and InboundLoad close"
    algorithm: aggregation
    formula: |
      baled_tons = sum(net_tons of non-VOIDED bales of load)
      unbaled_remaining_tons = net_tons - baled_tons - residual_tons
      INVARIANT: baled_tons + residual_tons + unbaled_remaining_tons == net_tons at all times.
      Voiding a bale increases unbaled_remaining_tons by that bale's net_tons, leaving
      net_tons unchanged (mass conservation).
    input_set: "one InboundLoad and its non-VOIDED bales"
    precision: "tons to 3 decimals"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body resource ids exist (validated left-to-right)"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: state
    check: "OCC: expected_municipality_version matches Municipality.version"
    error_id: ERR_STALE_MUNICIPALITY_VERSION
    http_status: 412
    applies_to: "POST /mrf/municipal-statements"
    note: "Checked after existence, before business logic."

  - priority: 5
    category: state
    check: "Target entity is in the state required by the transition"
    error_id: "ERR_LOAD_NOT_AUDITED / ERR_LOAD_NOT_AUDITABLE / ERR_LOAD_INVALID_STATE / ERR_SHIPMENT_NOT_BUILDING / ERR_SHIPMENT_NOT_SHIPPED / ERR_SHIPMENT_NOT_SETTLED / ERR_BALE_NOT_STAGEABLE / ERR_BALE_NOT_VOIDABLE / ERR_INDEX_NOT_DRAFT / ERR_STATEMENT_NOT_OPEN"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "Cross-entity referenced state: a PUBLISHED index exists for the commodity at clock (settle); bale.source_load is CLOSED (assign to shipment)"
    error_id: "ERR_NO_PUBLISHED_INDEX / ERR_BALE_LOAD_NOT_CLOSED"
    http_status: 422
    applies_to: "POST .../settle, POST .../bales"

  - priority: 7
    category: business_safety
    check: "Contamination processable and commodity valid: sampled_contamination_pct < REJECT_THRESHOLD_PCT (audit); bale.commodity present in load.audited_composition (bale create); bale.commodity == shipment.commodity (assign)"
    error_id: "ERR_CONTAMINATION_UNPROCESSABLE / ERR_COMMODITY_NOT_IN_LOAD / ERR_COMMODITY_MISMATCH"
    http_status: 422
    applies_to: "POST .../audit, POST /mrf/bales, POST .../bales"

  - priority: 8
    category: business_temporal
    check: "Interval occupation does not conflict: DowntimeEvent windows on a line must not overlap (closed intervals, adjacency conflicts); PUBLISHED index windows for a commodity must not overlap (half-open, adjacency allowed)"
    error_id: "ERR_DOWNTIME_OVERLAP / ERR_INDEX_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "POST /mrf/downtime-events, POST .../publish"

  - priority: 9
    category: business_constraint
    check: "Quantity/interval feasibility: end_at > start_at (downtime, index window); residual_tons + baled_tons <= net_tons (close); bale.net_tons <= load.unbaled_remaining_tons (bale create); shipment has >=1 STAGED bale (ship)"
    error_id: "ERR_INVALID_INTERVAL / ERR_RESIDUAL_EXCEEDS_NET / ERR_BALE_TONS_EXCEED_REMAINING / ERR_SHIPMENT_EMPTY"
    http_status: 422
    applies_to: "POST /mrf/downtime-events, POST .../publish, POST .../close, POST /mrf/bales, POST .../ship"

  - priority: 10
    category: business_fiscal
    check: "revenue_share_pct in [0,1] on municipality create; contamination/composition percentages in [0,100]"
    error_id: "ERR_REVENUE_SHARE_PCT_OUT_OF_RANGE / ERR_INVALID_REQUEST"
    http_status: 422
    applies_to: "POST /mrf/municipalities, POST .../audit"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time. Governs created_at stamps and index-window selection."
    roles: [ScaleOperator, SortManager, CommodityTrader, SettlementClerk]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["logical clock set to to_iso8601"]

  # --- Municipality ---
  - method: POST
    path: "/mrf/municipalities"
    description: "Create a municipality"
    roles: [SettlementClerk]
    code: 201
    input: [name, "contact_email?", revenue_share_pct]
    output: Municipality
    side_effects: ["status=ACTIVE", "ledger counters initialized to 0"]

  - method: GET
    path: "/mrf/municipalities/{municipalityId}"
    description: "Get a municipality (includes computed ledger balance)"
    roles: [ScaleOperator, SortManager, CommodityTrader, SettlementClerk, Municipality]
    code: 200
    input: []
    output: Municipality
    side_effects: []

  # --- Mill ---
  - method: POST
    path: "/mrf/mills"
    description: "Create a mill / buyer"
    roles: [CommodityTrader]
    code: 201
    input: [name, commodity_focus, freight_rate_cents_per_ton]
    output: Mill
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/mrf/mills/{millId}"
    description: "Get a mill"
    roles: [ScaleOperator, SortManager, CommodityTrader, SettlementClerk, Municipality]
    code: 200
    input: []
    output: Mill
    side_effects: []

  # --- CommodityIndex ---
  - method: POST
    path: "/mrf/commodity-indices"
    description: "Create a commodity price index window (DRAFT)"
    roles: [CommodityTrader]
    code: 201
    input: [commodity, price_cents_per_ton, effective_start, effective_end]
    output: CommodityIndex
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/mrf/commodity-indices"
    description: "List commodity indices (filterable)"
    roles: [ScaleOperator, SortManager, CommodityTrader, SettlementClerk, Municipality]
    code: 200
    input: ["commodity?", "status?", "limit?", "offset?"]
    output: "CommodityIndex[]"
    side_effects: []

  - method: GET
    path: "/mrf/commodity-indices/{indexId}"
    description: "Get a commodity index"
    roles: [ScaleOperator, SortManager, CommodityTrader, SettlementClerk, Municipality]
    code: 200
    input: []
    output: CommodityIndex
    side_effects: []

  - method: POST
    path: "/mrf/commodity-indices/{indexId}/publish"
    description: "Publish a DRAFT index; rejects window overlap for the same commodity"
    roles: [CommodityTrader]
    code: 200
    input: []
    output: CommodityIndex
    side_effects: ["status DRAFT->PUBLISHED", "may supersede an adjacent earlier PUBLISHED index for the same commodity"]

  # --- SortLine ---
  - method: POST
    path: "/mrf/sort-lines"
    description: "Create a sort line"
    roles: [SortManager]
    code: 201
    input: [name, rated_tph, "scheduled_shift_minutes?"]
    output: SortLine
    side_effects: ["status=IDLE", "computed metrics initialized to 0"]

  - method: GET
    path: "/mrf/sort-lines/{sortLineId}"
    description: "Get a sort line (includes computed throughput_tph, total_processed_tons, total_downtime_minutes)"
    roles: [ScaleOperator, SortManager, CommodityTrader, SettlementClerk, Municipality]
    code: 200
    input: []
    output: SortLine
    side_effects: []

  # --- DowntimeEvent ---
  - method: POST
    path: "/mrf/downtime-events"
    description: "Record a downtime window on a sort line; rejects overlap with existing events on the same line"
    roles: [SortManager]
    code: 201
    input: [sort_line_id, start_at, end_at, reason]
    output: DowntimeEvent
    side_effects: ["downtime_minutes computed", "SortLine.total_downtime_minutes and throughput_tph recomputed"]

  - method: GET
    path: "/mrf/downtime-events"
    description: "List downtime events (filter by sort_line_id)"
    roles: [ScaleOperator, SortManager, CommodityTrader, SettlementClerk, Municipality]
    code: 200
    input: ["sort_line_id?", "limit?", "offset?"]
    output: "DowntimeEvent[]"
    side_effects: []

  - method: GET
    path: "/mrf/downtime-events/{downtimeEventId}"
    description: "Get a downtime event"
    roles: [ScaleOperator, SortManager, CommodityTrader, SettlementClerk, Municipality]
    code: 200
    input: []
    output: DowntimeEvent
    side_effects: []

  # --- InboundLoad ---
  - method: POST
    path: "/mrf/inbound-loads"
    description: "Register an inbound load"
    roles: [ScaleOperator]
    code: 201
    input: [source_municipality_id, sort_line_id, hauler, gross_tons, tare_tons]
    output: InboundLoad
    side_effects: ["net_tons computed", "status=RECEIVED"]

  - method: GET
    path: "/mrf/inbound-loads"
    description: "List inbound loads (filterable)"
    roles: [ScaleOperator, SortManager, CommodityTrader, SettlementClerk, Municipality]
    code: 200
    input: ["source_municipality_id?", "sort_line_id?", "status?", "limit?", "offset?"]
    output: "InboundLoad[]"
    side_effects: []

  - method: GET
    path: "/mrf/inbound-loads/{loadId}"
    description: "Get an inbound load"
    roles: [ScaleOperator, SortManager, CommodityTrader, SettlementClerk, Municipality]
    code: 200
    input: []
    output: InboundLoad
    side_effects: []

  - method: POST
    path: "/mrf/inbound-loads/{loadId}/audit"
    description: "Record composition audit and sampled contamination; computes provisional adjustment"
    roles: [ScaleOperator]
    code: 200
    input: [sampled_contamination_pct, audited_composition]
    output: InboundLoad
    side_effects: ["provisional_adjustment_cents computed (provisional variant)", "status RECEIVED|PENDING_REAUDIT -> AUDITED"]

  - method: POST
    path: "/mrf/inbound-loads/{loadId}/request-reaudit"
    description: "Send an AUDITED load back for re-audit (revision loop)"
    roles: [SortManager]
    code: 200
    input: [reason]
    output: InboundLoad
    side_effects: ["status AUDITED -> PENDING_REAUDIT"]

  - method: POST
    path: "/mrf/inbound-loads/{loadId}/close"
    description: "Close an audited load, record residual, finalize contamination adjustment (cascades to municipality ledger)"
    roles: [SortManager]
    code: 200
    input: [residual_tons]
    output: InboundLoad
    side_effects: ["final_adjustment_cents computed (final variant)", "RevenueSharePosting created for source municipality", "Municipality ledger + version updated", "SortLine.total_processed_tons + throughput recomputed", "status AUDITED -> CLOSED"]

  # --- Bale ---
  - method: POST
    path: "/mrf/bales"
    description: "Create a bale from an audited load; computes provisional value from index snapshot"
    roles: [SortManager]
    code: 201
    input: [source_load_id, commodity, net_tons, moisture_pct, quality_grade]
    output: Bale
    side_effects: ["index_price_snapshot_cents captured", "provisional_value_cents computed (provisional variant)", "status=BALED", "InboundLoad.baled_tons + unbaled_remaining_tons recomputed"]

  - method: GET
    path: "/mrf/bales"
    description: "List bales (filterable)"
    roles: [ScaleOperator, SortManager, CommodityTrader, SettlementClerk, Municipality]
    code: 200
    input: ["source_load_id?", "shipment_id?", "status?", "commodity?", "limit?", "offset?"]
    output: "Bale[]"
    side_effects: []

  - method: GET
    path: "/mrf/bales/{baleId}"
    description: "Get a bale"
    roles: [ScaleOperator, SortManager, CommodityTrader, SettlementClerk, Municipality]
    code: 200
    input: []
    output: Bale
    side_effects: []

  - method: POST
    path: "/mrf/bales/{baleId}/void"
    description: "Void a bale (BALED or STAGED); restores load unbaled tonnage"
    roles: [SortManager]
    code: 200
    input: []
    output: Bale
    side_effects: ["status -> VOIDED", "InboundLoad.baled_tons + unbaled_remaining_tons restored", "MillShipment.total_net_tons recomputed if it was STAGED"]

  # --- MillShipment ---
  - method: POST
    path: "/mrf/mill-shipments"
    description: "Create a mill shipment (BUILDING)"
    roles: [CommodityTrader]
    code: 201
    input: [mill_id, commodity, freight_cost_cents]
    output: MillShipment
    side_effects: ["status=BUILDING"]

  - method: GET
    path: "/mrf/mill-shipments"
    description: "List mill shipments (filterable)"
    roles: [ScaleOperator, SortManager, CommodityTrader, SettlementClerk, Municipality]
    code: 200
    input: ["mill_id?", "status?", "limit?", "offset?"]
    output: "MillShipment[]"
    side_effects: []

  - method: GET
    path: "/mrf/mill-shipments/{shipmentId}"
    description: "Get a mill shipment"
    roles: [ScaleOperator, SortManager, CommodityTrader, SettlementClerk, Municipality]
    code: 200
    input: []
    output: MillShipment
    side_effects: []

  - method: POST
    path: "/mrf/mill-shipments/{shipmentId}/bales"
    description: "Assign a bale to a BUILDING shipment (bale BALED -> STAGED)"
    roles: [CommodityTrader]
    code: 200
    input: [bale_id]
    output: MillShipment
    side_effects: ["Bale.shipment_id set, Bale.status BALED->STAGED", "total_net_tons recomputed"]

  - method: POST
    path: "/mrf/mill-shipments/{shipmentId}/ship"
    description: "Ship a shipment (BUILDING -> SHIPPED); requires >=1 staged bale"
    roles: [CommodityTrader]
    code: 200
    input: []
    output: MillShipment
    side_effects: ["status BUILDING->SHIPPED", "all STAGED bales -> SHIPPED"]

  - method: POST
    path: "/mrf/mill-shipments/{shipmentId}/settle"
    description: "Settle a shipped/disputed shipment; computes final bale values and posts revenue share"
    roles: [CommodityTrader]
    code: 200
    input: []
    output: MillShipment
    side_effects: ["final bale values computed (final variant)", "freight allocated", "gross_settlement_cents = round-per-bale-then-sum", "REVENUE_SHARE postings + Municipality ledger/version updated", "status SHIPPED|DISPUTED->SETTLED"]

  - method: POST
    path: "/mrf/mill-shipments/{shipmentId}/dispute"
    description: "Dispute a settled shipment; reverses revenue share (compensation), bales back to SHIPPED"
    roles: [CommodityTrader]
    code: 200
    input: [reason]
    output: MillShipment
    side_effects: ["REVERSAL postings restore Municipality ledger/version", "bales SETTLED->SHIPPED", "gross_settlement_cents reset", "status SETTLED->DISPUTED"]

  # --- MunicipalStatement ---
  - method: POST
    path: "/mrf/municipal-statements"
    description: "Create a municipal statement for a period; supersedes prior OPEN statement (OCC on Municipality.version)"
    roles: [SettlementClerk]
    code: 201
    input: [municipality_id, period_start, period_end, expected_municipality_version]
    output: MunicipalStatement
    side_effects: ["status=OPEN", "prior OPEN statement for municipality -> SUPERSEDED", "increments Municipality.version by 1"]

  - method: GET
    path: "/mrf/municipal-statements"
    description: "List municipal statements (filterable)"
    roles: [ScaleOperator, SortManager, CommodityTrader, SettlementClerk, Municipality]
    code: 200
    input: ["municipality_id?", "status?", "limit?", "offset?"]
    output: "MunicipalStatement[]"
    side_effects: []

  - method: GET
    path: "/mrf/municipal-statements/{statementId}"
    description: "Get a municipal statement"
    roles: [ScaleOperator, SortManager, CommodityTrader, SettlementClerk, Municipality]
    code: 200
    input: []
    output: MunicipalStatement
    side_effects: []

  - method: POST
    path: "/mrf/municipal-statements/{statementId}/finalize"
    description: "Finalize an OPEN statement; aggregates period totals"
    roles: [SettlementClerk]
    code: 200
    input: []
    output: MunicipalStatement
    side_effects: ["period totals aggregated over RevenueSharePostings", "net_payable computed", "status OPEN->FINALIZED"]

  # --- RevenueSharePosting (append-only, system-created) ---
  - method: GET
    path: "/mrf/revenue-postings"
    description: "List revenue-share/adjustment postings (filter by municipality_id)"
    roles: [ScaleOperator, SortManager, CommodityTrader, SettlementClerk, Municipality]
    code: 200
    input: ["municipality_id?", "limit?", "offset?"]
    output: "RevenueSharePosting[]"
    side_effects: []

  - method: GET
    path: "/mrf/revenue-postings/{postingId}"
    description: "Get a revenue-share posting"
    roles: [ScaleOperator, SortManager, CommodityTrader, SettlementClerk, Municipality]
    code: 200
    input: []
    output: RevenueSharePosting
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # Auth
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  # Not found
  - { id: ERR_MUNICIPALITY_NOT_FOUND, http: 404, condition: "Municipality id not found" }
  - { id: ERR_MILL_NOT_FOUND, http: 404, condition: "Mill id not found" }
  - { id: ERR_INDEX_NOT_FOUND, http: 404, condition: "Commodity index id not found" }
  - { id: ERR_SORT_LINE_NOT_FOUND, http: 404, condition: "Sort line id not found" }
  - { id: ERR_LOAD_NOT_FOUND, http: 404, condition: "Inbound load id not found" }
  - { id: ERR_BALE_NOT_FOUND, http: 404, condition: "Bale id not found" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "Mill shipment id not found" }
  - { id: ERR_STATEMENT_NOT_FOUND, http: 404, condition: "Municipal statement id not found" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Generic resource (e.g. downtime event, posting) not found" }
  # Input
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, type mismatch, out-of-range percentage" }
  - { id: ERR_REVENUE_SHARE_PCT_OUT_OF_RANGE, http: 422, condition: "revenue_share_pct outside [0,1]" }
  - { id: ERR_INVALID_INTERVAL, http: 422, condition: "end_at <= start_at (downtime) or effective_end <= effective_start (index)" }
  # Concurrency
  - { id: ERR_STALE_MUNICIPALITY_VERSION, http: 412, condition: "expected_municipality_version does not match Municipality.version on statement create" }
  # State
  - { id: ERR_LOAD_NOT_AUDITABLE, http: 409, condition: "Audit attempted on a load not in RECEIVED or PENDING_REAUDIT" }
  - { id: ERR_LOAD_NOT_AUDITED, http: 409, condition: "Close/bale-create attempted on a load not in AUDITED" }
  - { id: ERR_LOAD_INVALID_STATE, http: 409, condition: "Reaudit requested on a load not AUDITED, or load has non-VOIDED bales" }
  - { id: ERR_SHIPMENT_NOT_BUILDING, http: 409, condition: "Assign/ship attempted on a shipment not in BUILDING" }
  - { id: ERR_SHIPMENT_NOT_SHIPPED, http: 409, condition: "Settle attempted on a shipment not in SHIPPED or DISPUTED" }
  - { id: ERR_SHIPMENT_NOT_SETTLED, http: 409, condition: "Dispute attempted on a shipment not in SETTLED" }
  - { id: ERR_BALE_NOT_STAGEABLE, http: 409, condition: "Assign attempted on a bale not in BALED" }
  - { id: ERR_BALE_NOT_VOIDABLE, http: 409, condition: "Void attempted on a bale not in BALED or STAGED" }
  - { id: ERR_INDEX_NOT_DRAFT, http: 409, condition: "Publish attempted on an index not in DRAFT" }
  - { id: ERR_STATEMENT_NOT_OPEN, http: 409, condition: "Finalize attempted on a statement not in OPEN" }
  # Referential
  - { id: ERR_NO_PUBLISHED_INDEX, http: 422, condition: "No PUBLISHED index covers the commodity at the relevant clock time" }
  - { id: ERR_BALE_LOAD_NOT_CLOSED, http: 422, condition: "Bale assignment requires its source load to be CLOSED" }
  # Safety
  - { id: ERR_CONTAMINATION_UNPROCESSABLE, http: 422, condition: "sampled_contamination_pct >= REJECT_THRESHOLD_PCT (40)" }
  - { id: ERR_COMMODITY_NOT_IN_LOAD, http: 422, condition: "Bale commodity not present in load.audited_composition" }
  - { id: ERR_COMMODITY_MISMATCH, http: 422, condition: "Bale commodity differs from shipment commodity" }
  # Temporal
  - { id: ERR_DOWNTIME_OVERLAP, http: 409, condition: "Downtime window overlaps (closed intervals, adjacency conflicts) an existing event on the same line" }
  - { id: ERR_INDEX_WINDOW_OVERLAP, http: 409, condition: "PUBLISHED index window overlaps (half-open, adjacency allowed) another for the same commodity" }
  # Constraint
  - { id: ERR_RESIDUAL_EXCEEDS_NET, http: 422, condition: "residual_tons + baled_tons > net_tons at close" }
  - { id: ERR_BALE_TONS_EXCEED_REMAINING, http: 422, condition: "bale.net_tons > load.unbaled_remaining_tons at bale create" }
  - { id: ERR_SHIPMENT_EMPTY, http: 422, condition: "Ship attempted with no STAGED bales" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ScaleOperator
    description: "Weighbridge / receiving operator: registers inbound loads and performs composition audits."
    identity: opaque
    exclusive_operations:
      - "POST /mrf/inbound-loads"
      - "POST /mrf/inbound-loads/{loadId}/audit"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET (all read endpoints)"

  - name: SortManager
    description: "Sort-floor manager: manages sort lines, downtime, bales, load closing and re-audit requests."
    identity: opaque
    exclusive_operations:
      - "POST /mrf/sort-lines"
      - "POST /mrf/downtime-events"
      - "POST /mrf/inbound-loads/{loadId}/request-reaudit"
      - "POST /mrf/inbound-loads/{loadId}/close"
      - "POST /mrf/bales"
      - "POST /mrf/bales/{baleId}/void"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET (all read endpoints)"

  - name: CommodityTrader
    description: "Trading desk: manages mills, commodity indices, and the full mill-shipment settlement lifecycle."
    identity: opaque
    exclusive_operations:
      - "POST /mrf/mills"
      - "POST /mrf/commodity-indices"
      - "POST /mrf/commodity-indices/{indexId}/publish"
      - "POST /mrf/mill-shipments"
      - "POST /mrf/mill-shipments/{shipmentId}/bales"
      - "POST /mrf/mill-shipments/{shipmentId}/ship"
      - "POST /mrf/mill-shipments/{shipmentId}/settle"
      - "POST /mrf/mill-shipments/{shipmentId}/dispute"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET (all read endpoints)"

  - name: SettlementClerk
    description: "Municipal settlement: onboards municipalities and produces/finalizes municipal statements."
    identity: opaque
    exclusive_operations:
      - "POST /mrf/municipalities"
      - "POST /mrf/municipal-statements"
      - "POST /mrf/municipal-statements/{statementId}/finalize"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET (all read endpoints)"

  - name: Municipality
    description: "A municipality partner; entity-backed. Read-only access to its own records and shared reference reads. X-User-ID equals a Municipality.id."
    identity: "entity_backed:Municipality"
    exclusive_operations: []
    shared_operations:
      - "GET (all read endpoints)"
