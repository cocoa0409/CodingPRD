            - call: "POST /permits"
              payload: { project_id: "${proj_id}", jurisdiction: "Austin" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/issue"
