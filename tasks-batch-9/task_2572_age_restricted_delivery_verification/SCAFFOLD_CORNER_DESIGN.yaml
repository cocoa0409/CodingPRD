          rationale: "That §1.8 instance pins the half-open dwell interval: a start exactly 20 minutes later is accepted while 19 minutes later is 409 ERR_COURIER_SLOT_CONFLICT."

      - name: corner_overlapping_policy_effective_periods_conflict
