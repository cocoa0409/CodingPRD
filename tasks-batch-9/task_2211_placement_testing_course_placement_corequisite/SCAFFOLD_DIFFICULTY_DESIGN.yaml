  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: determination_parallel_placement_and_evidence_axes_move_independently
        grounds:
          - state_machines.PlacementDetermination.placement_state
          - state_machines.PlacementDetermination.evidence_state
          - endpoints[POST /placement-determinations/{determination_id}/evidence]
          - endpoints[POST /placement-determinations/{determination_id}/finalize]
          - errors.ERR_EVIDENCE_NOT_VERIFIED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          PlacementDetermination carries TWO parallel state axes on one row.
          The non-linearity is that the axes are independent in one direction and
          coupled in the other: the evidence action moves evidence_state while
          leaving placement_state untouched, finalize moves placement_state while
          leaving evidence_state untouched, yet finalize is GATED on the other
          axis (ERR_EVIDENCE_NOT_VERIFIED while UNVERIFIED). On top of that, only
          the UNVERIFIED -> VERIFIED and DISPUTED -> VERIFIED edges are reachable
          through the API — VERIFIED -> DISPUTED exists only as a void cascade, so
          asking for DISPUTED directly is ERR_INVALID_STATE. A single-enum
          implementation, or one that lets the client set any evidence_state,
          cannot reproduce this shape.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Course MATH-100 (level_rank 100, units 4.0) and exactly one ACTIVE PlacementRule TRANSCRIPT_GPA -> MATH-100 (min_hs_gpa 2.0, V1)."
