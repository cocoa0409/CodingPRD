              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_late: "$.data.id" }
            - call: "POST /recommerce/trade-ins"
              payload: { customer_id: "${cust_id}", store_location_id: "${store_id}", channel: "IN_STORE", product_category: "OUTERWEAR", declared_grade: "B", msrp_minor: 50000, item_mass_grams: 1400 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_store: "$.data.id", dl_store: "$.data.receive_deadline_at" }
          trigger:
            - call: "POST /recommerce/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/trade-ins/${ti_store}/receive"
              payload: {}
              as: IntakeAgent
              as_user_id: "intake-001"
              captures: { st_store: "$.data.status", recv_store: "$.data.received_at" }
            - call: "POST /recommerce/_clock/set_current_utc"
              payload: { current_utc: "2026-08-22T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/trade-ins/${ti_ontime}/receive"
              payload: {}
              as: IntakeAgent
              as_user_id: "intake-001"
              captures: { st_ontime: "$.data.status", recv_ontime: "$.data.received_at" }
            - call: "POST /recommerce/_clock/set_current_utc"
              payload: { current_utc: "2026-08-22T00:00:01Z" }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/trade-ins/${ti_late}/receive"
              payload: {}
