# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3416_aluminum_can_manufacturing_plant_proximity_sheet_supply
# Breadth probe across §1.1–§1.7 claims not covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: plant_create_returns_computed_defaults_and_open_posture
        claim_type: Creation
        grounds:
          - entities.Plant
          - endpoints.POST_/plants
          - calculations.plant_posture
        distinguishing_aspect: "A plant created with name/region/warehouse_capacity_units returns 201 with warehouse_on_hand_units 0, projected_warehouse_units 0, posture OPEN, ops_run_index 0, scrap_credit_lbs_ytd 0, recycled_content_pct 0, version 1 — all computed/system fields initialized, none client-supplied."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z (server default). Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /plants"
              payload: { name: "Phoenix Can Plant", region: "US-SW", warehouse_capacity_units: 1000000 }
              as: PlatformAdmin
              captures: { plant_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object; meta.api_request_id and meta.api_request_timestamp are present"
            - "Plant.${plant_id}.warehouse_on_hand_units == 0 and projected_warehouse_units == 0"
            - "Plant.${plant_id}.posture == OPEN and ops_run_index == 0"
            - "Plant.${plant_id}.scrap_credit_lbs_ytd == 0 and metal_consumed_lbs_ytd == 0 and recycled_content_pct == 0"
            - "Plant.${plant_id}.version == 1 and id / created_at / updated_at are present"

      - name: metal_price_index_is_immutable_common_fields_false
        claim_type: Immutability
        grounds:
          - entities.MetalPriceIndex
          - endpoints.POST_/metal-price-indices
        distinguishing_aspect: "MetalPriceIndex declares common_fields: false — the create response carries id and created_at but no version and no updated_at, and the entity has no update endpoint anywhere in §1.5."
        test_recipe:
          setup:
            - "Logical clock default. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /metal-price-indices"
              payload: { period: "2026-08", index_cents_per_lb: 128.0 }
              as: PlatformAdmin
              captures: { idx_id: $.data.id }
          assert:
            - "the response status is 201"
            - "the response data carries id, created_at, period 2026-08 and index_cents_per_lb 128.0"
            - "the response data has no version key and no updated_at key"

      - name: agreement_create_computes_freight_zone_near_mid_far
        claim_type: Computed Fields
        grounds:
          - entities.SupplyAgreement.fields.freight_zone
          - endpoints.POST_/supply-agreements
        distinguishing_aspect: "freight_zone is derived once at creation from Plant.region vs Customer.home_region: US-SW/US-SW -> NEAR, US-NE vs US-SW -> MID (shared two-char prefix US), FR-LY vs US-SW -> FAR — three agreements on one plant pin all three branches."
        test_recipe:
          setup:
            - "Logical clock default. Plant region US-SW; three customers with home_region US-SW, US-NE, FR-LY."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plants"
              payload: { name: "P", region: "US-SW", warehouse_capacity_units: 1000000 }
              as: PlatformAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Near Co", home_region: "US-SW", filling_lines_count: 2 }
              as: PlatformAdmin
              captures: { cust_near: $.data.id }
            - call: "POST /customers"
              payload: { name: "Mid Co", home_region: "US-NE", filling_lines_count: 2 }
              as: PlatformAdmin
              captures: { cust_mid: $.data.id }
            - call: "POST /customers"
              payload: { name: "Far Co", home_region: "FR-LY", filling_lines_count: 2 }
              as: PlatformAdmin
              captures: { cust_far: $.data.id }
          trigger:
            - call: "POST /supply-agreements"
              payload: { plant_id: "${plant_id}", customer_id: "${cust_near}", committed_annual_units: 12000000, pass_through_pct: 0.9, conversion_cost_cents_per_1000: 1500, start_date: "2026-01-01", end_date: "2026-12-31" }
              as: PlantManager
              captures: { fz_near: $.data.freight_zone }
            - call: "POST /supply-agreements"
              payload: { plant_id: "${plant_id}", customer_id: "${cust_mid}", committed_annual_units: 12000000, pass_through_pct: 0.9, conversion_cost_cents_per_1000: 1500, start_date: "2026-01-01", end_date: "2026-12-31" }
              as: PlantManager
              captures: { fz_mid: $.data.freight_zone }
            - call: "POST /supply-agreements"
              payload: { plant_id: "${plant_id}", customer_id: "${cust_far}", committed_annual_units: 12000000, pass_through_pct: 0.9, conversion_cost_cents_per_1000: 1500, start_date: "2026-01-01", end_date: "2026-12-31" }
              as: PlantManager
              captures: { fz_far: $.data.freight_zone }
          assert:
            - "fz_near == NEAR (identical region codes)"
            - "fz_mid == MID (region codes share the first two characters US)"
            - "fz_far == FAR (different prefixes)"
            - "all three agreements are persisted with status DRAFT"

      - name: agreement_create_applies_ledger_and_accuracy_defaults
        claim_type: Defaults
        grounds:
          - entities.SupplyAgreement.fields.ytd_settled_units
          - entities.SupplyAgreement.fields.rolling_accuracy_pct
          - entities.SupplyAgreement.fields.volume_tier
        distinguishing_aspect: "A fresh agreement starts with ytd_settled_units 0, delivered_revenue_cents 0, volume_tier STANDARD, and both accuracy fields at the pinned empty-set default of 100 (not null, not 0)."
        test_recipe:
          setup:
            - "Logical clock default. One plant and one customer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plants"
              payload: { name: "P", region: "US-SW", warehouse_capacity_units: 1000000 }
              as: PlatformAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "C", home_region: "US-SW", filling_lines_count: 1 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /supply-agreements"
              payload: { plant_id: "${plant_id}", customer_id: "${cust_id}", committed_annual_units: 12000000, pass_through_pct: 0.92, conversion_cost_cents_per_1000: 1500, start_date: "2026-01-01", end_date: "2026-12-31" }
              as: PlantManager
              captures: { agr_id: $.data.id }
          assert:
            - "the response status is 201; SupplyAgreement.${agr_id}.status == DRAFT (initial state)"
            - "SupplyAgreement.${agr_id}.ytd_settled_units == 0 and delivered_revenue_cents == 0"
            - "SupplyAgreement.${agr_id}.volume_tier == STANDARD"
            - "SupplyAgreement.${agr_id}.rolling_accuracy_pct == 100 and lifetime_accuracy_pct == 100"
            - "SupplyAgreement.${agr_id}.version == 1"

      - name: plant_get_unknown_id_returns_not_found_with_error_envelope
        claim_type: Not Found
        grounds:
          - endpoints.GET_/plants/{id}
          - errors.ERR_NOT_FOUND
          - validations.priority_4_existence
        distinguishing_aspect: "A syntactically valid but unallocated plant id returns 404 ERR_NOT_FOUND in the fixed error envelope (response_type error, data.error_id + data.message), not a 400 or empty body."
        test_recipe:
          setup:
            - "Logical clock default. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /plants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlantManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: run_create_missing_graphics_code_returns_validation
        claim_type: Required Fields
        grounds:
          - entities.ProductionRun.fields.graphics_code
          - validations.priority_3_existence
          - errors.ERR_VALIDATION
        distinguishing_aspect: "graphics_code is a required input with no default; omitting it is a 400 ERR_VALIDATION at priority 3 — before any existence, state, or temporal check runs."
        test_recipe:
          setup:
            - "Logical clock default. ACTIVE agreement; line; QUALIFIED format."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plants"
              payload: { name: "P", region: "US-SW", warehouse_capacity_units: 1000000 }
              as: PlatformAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "C", home_region: "US-SW", filling_lines_count: 1 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /supply-agreements"
              payload: { plant_id: "${plant_id}", customer_id: "${cust_id}", committed_annual_units: 12000000, pass_through_pct: 0.9, conversion_cost_cents_per_1000: 1500, start_date: "2026-01-01", end_date: "2026-12-31" }
              as: PlantManager
              captures: { agr_id: $.data.id, agr_v: $.data.version }
            - call: "POST /supply-agreements/${agr_id}/sign"
              payload: {}
              as: CustomerPlanner
              as_user_id: "${cust_id}"
              captures: { agr_v: $.data.version }
            - call: "POST /plants/${plant_id}/lines"
              payload: { name: "L", nominal_speed_cans_per_hour: 120000, base_spoilage_pct: 0.04 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "POST /plants/${plant_id}/formats"
              payload: { customer_id: "${cust_id}", size_code: "12OZ", shape: "STANDARD", is_specialty: false, metal_lbs_per_1000_units: 30.0, tooling_investment_cents: 0, min_volume_commitment_units: 0 }
              as: PlantManager
              captures: { fmt_id: $.data.id }
            - call: "POST /formats/${fmt_id}/tool"
              payload: {}
              as: PlantManager
            - call: "POST /formats/${fmt_id}/qualify"
              payload: {}
              as: PlantManager
          trigger:
            - call: "POST /supply-agreements/${agr_id}/production-runs"
              payload: { line_id: "${line_id}", format_id: "${fmt_id}", scheduled_qty: 50000, window_start: "2026-09-10T08:00:00Z", window_end: "2026-09-10T16:00:00Z", expected_agreement_version: "${agr_v}" }
              as: LineScheduler
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_VALIDATION"
            - "GET /production-runs?agreement_id=${agr_id} returns 0 rows"

      - name: format_create_with_out_of_enum_shape_returns_validation
        claim_type: Type Constraints
        grounds:
          - entities.CanFormat.fields.shape
          - validations.priority_3_existence
          - errors.ERR_VALIDATION
        distinguishing_aspect: "shape is a closed enum STANDARD|SLEEK|SLIM|STUBBY; MEGA is rejected 400 ERR_VALIDATION rather than being stored."
        test_recipe:
          setup:
            - "Logical clock default. Plant and customer exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plants"
              payload: { name: "P", region: "US-SW", warehouse_capacity_units: 1000000 }
              as: PlatformAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "C", home_region: "US-SW", filling_lines_count: 1 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /plants/${plant_id}/formats"
              payload: { customer_id: "${cust_id}", size_code: "99OZ", shape: "MEGA", is_specialty: false, metal_lbs_per_1000_units: 30.0, tooling_investment_cents: 0, min_volume_commitment_units: 0 }
              as: PlantManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_VALIDATION"
            - "GET /formats?plant_id=${plant_id} returns 0 rows"

      - name: duplicate_period_rejected_for_forecast_and_for_index
        claim_type: Type Constraints
        grounds:
          - entities.CustomerForecast.fields.period
          - entities.MetalPriceIndex.fields.period
          - errors.ERR_DUPLICATE_PERIOD
        distinguishing_aspect: "Period uniqueness is enforced in both scopes: a second 2026-06 forecast on the SAME agreement is ERR_DUPLICATE_PERIOD (409), and a second 2026-08 metal index anywhere is ERR_DUPLICATE_PERIOD (409) — a forecast of the same period on a DIFFERENT agreement is allowed."
        test_recipe:
          setup:
            - "Logical clock default. Plant; two customers; two ACTIVE agreements (one per customer); one index 2026-08 already published."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plants"
              payload: { name: "P", region: "US-SW", warehouse_capacity_units: 1000000 }
              as: PlatformAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "C1", home_region: "US-SW", filling_lines_count: 1 }
              as: PlatformAdmin
              captures: { cust1_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "C2", home_region: "US-NE", filling_lines_count: 1 }
              as: PlatformAdmin
              captures: { cust2_id: $.data.id }
            - call: "POST /supply-agreements"
              payload: { plant_id: "${plant_id}", customer_id: "${cust1_id}", committed_annual_units: 12000000, pass_through_pct: 0.9, conversion_cost_cents_per_1000: 1500, start_date: "2026-01-01", end_date: "2026-12-31" }
              as: PlantManager
              captures: { agr1_id: $.data.id }
            - call: "POST /supply-agreements/${agr1_id}/sign"
              payload: {}
              as: CustomerPlanner
              as_user_id: "${cust1_id}"
            - call: "POST /supply-agreements"
              payload: { plant_id: "${plant_id}", customer_id: "${cust2_id}", committed_annual_units: 2000000, pass_through_pct: 0.9, conversion_cost_cents_per_1000: 1500, start_date: "2026-01-01", end_date: "2026-12-31" }
              as: PlantManager
              captures: { agr2_id: $.data.id }
            - call: "POST /supply-agreements/${agr2_id}/sign"
              payload: {}
              as: CustomerPlanner
              as_user_id: "${cust2_id}"
            - call: "POST /metal-price-indices"
              payload: { period: "2026-08", index_cents_per_lb: 128.0 }
              as: PlatformAdmin
            - call: "POST /supply-agreements/${agr1_id}/forecasts"
              payload: { period: "2026-06", forecast_qty: 100000 }
              as: CustomerPlanner
              as_user_id: "${cust1_id}"
          trigger:
            - call: "POST /supply-agreements/${agr1_id}/forecasts"
              payload: { period: "2026-06", forecast_qty: 50000 }
              as: CustomerPlanner
              as_user_id: "${cust1_id}"
              captures: { err_fc: $.data.error_id }
            - call: "POST /metal-price-indices"
              payload: { period: "2026-08", index_cents_per_lb: 140.0 }
              as: PlatformAdmin
              captures: { err_idx: $.data.error_id }
            - call: "POST /supply-agreements/${agr2_id}/forecasts"
              payload: { period: "2026-06", forecast_qty: 70000 }
              as: CustomerPlanner
              as_user_id: "${cust2_id}"
              captures: { f_other: $.data.id }
          assert:
            - "err_fc == ERR_DUPLICATE_PERIOD (409) — same agreement, same period"
            - "err_idx == ERR_DUPLICATE_PERIOD (409) — index period is globally unique"
            - "the same period on the OTHER agreement succeeds 201 (CustomerForecast.${f_other}.status == OPEN)"
            - "GET /supply-agreements/${agr1_id}/forecasts returns exactly 1 row"

      - name: scrap_returns_list_filters_and_paginates
        claim_type: Listing
        grounds:
          - endpoints.GET_/scrap-returns
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three pickups on distinct UTC days (avoiding the daily cap): limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false; status filter narrows to SCHEDULED only."
        test_recipe:
          setup:
            - "Logical clock default. Plant; customer; three SCHEDULED scrap returns on 2026-09-05, 2026-09-06, 2026-09-07 (window 09:00..10:00 each day)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plants"
              payload: { name: "P", region: "US-SW", warehouse_capacity_units: 1000000 }
              as: PlatformAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "C", home_region: "US-SW", filling_lines_count: 1 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/scrap-returns"
              payload: { plant_id: "${plant_id}", pickup_window_start: "2026-09-05T09:00:00Z", pickup_window_end: "2026-09-05T10:00:00Z", declared_weight_lbs: 5000 }
              as: CustomerPlanner
              as_user_id: "${cust_id}"
            - call: "POST /customers/${cust_id}/scrap-returns"
              payload: { plant_id: "${plant_id}", pickup_window_start: "2026-09-06T09:00:00Z", pickup_window_end: "2026-09-06T10:00:00Z", declared_weight_lbs: 6000 }
              as: CustomerPlanner
              as_user_id: "${cust_id}"
            - call: "POST /customers/${cust_id}/scrap-returns"
              payload: { plant_id: "${plant_id}", pickup_window_start: "2026-09-07T09:00:00Z", pickup_window_end: "2026-09-07T10:00:00Z", declared_weight_lbs: 7000 }
              as: CustomerPlanner
              as_user_id: "${cust_id}"
          trigger:
            - call: "GET /scrap-returns"
              payload: { customer_id: "${cust_id}", limit: 2, offset: 0 }
              as: PlantManager
          assert:
            - "the response status is 200, response_type is array, exactly 2 rows, total_count == 3, has_more == true"
            - "GET /scrap-returns?customer_id=${cust_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /scrap-returns?customer_id=${cust_id}&status=SCHEDULED returns 3 rows"
            - "GET /scrap-returns?plant_id=${plant_id} returns 3 rows (plant filter)"
            - "GET /scrap-returns with no query params returns 3 rows with limit defaulting to 10 and offset 0"

      - name: agreement_get_roundtrips_stored_terms_unchanged
        claim_type: Retrieval
        grounds:
          - endpoints.GET_/supply-agreements/{id}
          - entities.SupplyAgreement
        distinguishing_aspect: "Every stored term round-trips through GET exactly as posted — committed_annual_units 12000000, pass_through_pct 0.92, conversion_cost_cents_per_1000 1500, dates — alongside the computed freight_zone NEAR."
        test_recipe:
          setup:
            - "Logical clock default. Plant US-SW; customer US-SW; one DRAFT agreement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plants"
              payload: { name: "P", region: "US-SW", warehouse_capacity_units: 1000000 }
              as: PlatformAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "C", home_region: "US-SW", filling_lines_count: 4 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /supply-agreements"
              payload: { plant_id: "${plant_id}", customer_id: "${cust_id}", committed_annual_units: 12000000, pass_through_pct: 0.92, conversion_cost_cents_per_1000: 1500, start_date: "2026-01-01", end_date: "2026-12-31" }
              as: PlantManager
              captures: { agr_id: $.data.id }
          trigger:
            - call: "GET /supply-agreements/${agr_id}"
              payload: {}
              as: CustomerPlanner
              as_user_id: "${cust_id}"
          assert:
            - "the response status is 200"
            - "SupplyAgreement.${agr_id}.committed_annual_units == 12000000 and pass_through_pct == 0.92 and conversion_cost_cents_per_1000 == 1500"
            - "SupplyAgreement.${agr_id}.start_date == 2026-01-01 and end_date == 2026-12-31"
            - "SupplyAgreement.${agr_id}.freight_zone == NEAR and status == DRAFT"

      - name: plant_create_ignores_client_supplied_id_extra_field
        claim_type: System Fields
        grounds:
          - entities.Plant
          - endpoints.POST_/plants
        distinguishing_aspect: "id and version are server-minted: a create carrying id and version 99 (fields the endpoint does not declare as input) is ignored — the plant is created with a server UUID and version 1."
        test_recipe:
          setup:
            - "Logical clock default. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /plants"
              payload: { name: "P", region: "US-SW", warehouse_capacity_units: 1000000, id: "00000000-0000-4000-8000-0000000000ff", version: 99 }
              as: PlatformAdmin
              captures: { plant_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Plant.${plant_id}.version == 1"
            - "the returned id != 00000000-0000-4000-8000-0000000000ff"

      - name: line_create_under_unknown_plant_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.ProductionLine.fields.plant_id
          - endpoints.POST_/plants/{id}/lines
          - validations.priority_4_existence
        distinguishing_aspect: "The hierarchical path parent is validated first: POSTing a line under a non-existent plant id is 404 ERR_NOT_FOUND and nothing is persisted."
        test_recipe:
          setup:
            - "Logical clock default. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /plants/00000000-0000-4000-8000-000000000000/lines"
              payload: { name: "L", nominal_speed_cans_per_hour: 120000, base_spoilage_pct: 0.04 }
              as: PlantManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"
  # ===========================================================================
  - section: state_machines
    instances:
      - name: sign_twice_returns_invalid_state_idempotency
        claim_type: Idempotency
        grounds:
          - state_machines.SupplyAgreement.DRAFT_to_ACTIVE
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "The same trigger twice: the first sign moves DRAFT -> ACTIVE (200), the second sign finds no ACTIVE -> ACTIVE transition and fails 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock default. Plant; customer; DRAFT agreement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
