              payload: { filename: "b2.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /projects/${projA}/autolayout"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { errA: $.data.error_id }
            - call: "POST /projects/${projB}/autolayout"
