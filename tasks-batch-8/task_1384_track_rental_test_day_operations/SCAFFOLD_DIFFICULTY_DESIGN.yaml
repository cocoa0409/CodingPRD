# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Track Rental & Test Day Operations
# =============================================================================
# 9 rules × 2 instances each = 18 instances.
# Every instance grounds in §1.1–§1.7 of SCAFFOLD.yaml.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cancel_refund_chronological_vs_weather
        grounds:
          - calculations.cancel_refund_cents
          - state_machines.Booking.APPROVED_to_CANCELLED
          - entities.Booking.fields.cancel_policy_snapshot
        distinguishing_aspect: |
          cancel_refund_cents has variants on the BOOKING entity domain: the
          CHRONOLOGICAL variant (CUSTOMER cancel) produces refund_cents from a
          notice-window lookup, while the WEATHER_POLICY variant (TrackDay
          WEATHER cancel) produces refund_cents = round_half_up(fee*0.75) -
          5000 for IDENTICAL booking inputs; the two variants MUST return
          different cent values for the same booking.
        test_recipe:
          setup:
            - "Track with noise_limit_db=95, run_group_capacity=10, garage_bay_count=5, paddock_stall_count=10"
            - "TrackDay date=2026-08-15, status=OPEN"
            - "RentalBlock block_index=0, [start_minute=540, end_minute=600), max_group_size=5"
            - "Booking B1 (driver_count=2, fee = 2*35000 = 70000) APPROVED with payment CAPTURED"
            - "Booking B2 (driver_count=2, fee = 70000) APPROVED with payment CAPTURED on a SECOND TrackDay identical but separately cancelled"
            - "Logical clock is positioned so that hours_until_block_start for B1 is 12 (inside 0% refund band: < HALF_REFUND_HOURS=24)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TrackOps
            - call: "POST /tracks"
              payload: { name: "Laguna", noise_limit_db: 95, run_group_capacity: 10, garage_bay_count: 5, paddock_stall_count: 10 }
              as: TrackOps
              captures: { tid: $.data.id }
            - call: "POST /tracks/${tid}/track-days"
              payload: { date: "2026-08-15" }
              as: TrackOps
              captures: { tdid_a: $.data.id }
            - call: "POST /tracks/${tid}/track-days/${tdid_a}/open"
              payload: {}
              as: TrackOps
            - call: "POST /tracks/${tid}/track-days/${tdid_a}/rental-blocks"
              payload: { block_index: 0, start_minute: 540, end_minute: 600, max_group_size: 5 }
              as: TrackOps
              captures: { rbid_a: $.data.id, rb_v_a0: $.data.version }
            - call: "POST /tracks/${tid}/track-days/${tdid_a}/rental-blocks/${rbid_a}/bookings"
              payload: { organizer_user_id: "org1", group_name: "G1", run_group_class: "ADVANCED", driver_count: 2, insurance_policy_ref: "POL-1" }
              as: Organizer
              as_user_id: org1
              captures: { bid_a: $.data.id }
            - call: "POST /tracks/${tid}/track-days/${tdid_a}/rental-blocks/${rbid_a}/bookings/${bid_a}/approve"
              payload: { expected_rental_block_version: "${rb_v_a0}" }
              as: TrackOps
            - call: "POST /_payments/simulate"
              payload: { booking_id: "${bid_a}", outcome: "AUTHORIZE" }
              as: TrackOps
            - call: "POST /_payments/simulate"
              payload: { booking_id: "${bid_a}", outcome: "CAPTURE" }
              as: TrackOps
            # Second track-day for the weather variant
            - call: "POST /tracks/${tid}/track-days"
              payload: { date: "2026-08-16" }
              as: TrackOps
              captures: { tdid_b: $.data.id }
            - call: "POST /tracks/${tid}/track-days/${tdid_b}/open"
              payload: {}
              as: TrackOps
            - call: "POST /tracks/${tid}/track-days/${tdid_b}/rental-blocks"
              payload: { block_index: 0, start_minute: 540, end_minute: 600, max_group_size: 5 }
              as: TrackOps
              captures: { rbid_b: $.data.id, rb_v_b0: $.data.version }
            - call: "POST /tracks/${tid}/track-days/${tdid_b}/rental-blocks/${rbid_b}/bookings"
              payload: { organizer_user_id: "org2", group_name: "G2", run_group_class: "ADVANCED", driver_count: 2, insurance_policy_ref: "POL-2" }
              as: Organizer
              as_user_id: org2
              captures: { bid_b: $.data.id }
            - call: "POST /tracks/${tid}/track-days/${tdid_b}/rental-blocks/${rbid_b}/bookings/${bid_b}/approve"
              payload: { expected_rental_block_version: "${rb_v_b0}" }
              as: TrackOps
            - call: "POST /_payments/simulate"
              payload: { booking_id: "${bid_b}", outcome: "AUTHORIZE" }
              as: TrackOps
            - call: "POST /_payments/simulate"
              payload: { booking_id: "${bid_b}", outcome: "CAPTURE" }
              as: TrackOps
            # Move clock so hours_until_block_start = 12 (block start 2026-08-15 09:00 UTC = 540 min)
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T21:00:00Z" }
              as: TrackOps
          trigger:
            - call: "POST /tracks/${tid}/track-days/${tdid_a}/rental-blocks/${rbid_a}/bookings/${bid_a}/cancel"
              payload: { reason: "CUSTOMER" }
              as: Organizer
              as_user_id: org1
              captures: { refund_a: $.data.refund_cents }
            - call: "POST /tracks/${tid}/track-days/${tdid_b}/cancel"
              payload: { reason: "WEATHER" }
              as: TrackOps
          assert:
            - "Booking.${bid_a}.refund_cents == 0  # CUSTOMER chronological variant: hours=12 < HALF_REFUND_HOURS=24 → 0%"
            - "Booking.${bid_b}.refund_cents == round_half_up(70000 * 0.75) - 5000 == 47500  # WEATHER variant"
            - "Booking.${bid_a}.payment_status == FORFEITED"
            - "Booking.${bid_b}.payment_status == REFUNDED"
            - "Two variants produce different cent values for identical (driver_count=2, fee=70000) inputs"

      - name: garage_utility_fee_tiered_vs_flat_paddock
        grounds:
          - calculations.garage_utility_fee_cents
          - entities.GarageAssignment
          - entities.PaddockAssignment
        distinguishing_aspect: |
          GarageAssignment uses a TIERED_PRICING calculation with two power
          tiers and an optional water flat fee; PaddockAssignment uses NO fee
          calculation at all — its cost is a flat zero (no fee field). The two
          entities implement fundamentally different pricing algorithms on
          different entity domains, satisfying the rule that dual-variant
          logic lives on more than one subject.
        test_recipe:
          setup:
            - "Track with garage_bay_count=5, paddock_stall_count=10, run_group_capacity=10"
            - "TrackDay OPEN; RentalBlock; Booking APPROVED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TrackOps
            - call: "POST /tracks"
              payload: { name: "Sonoma", noise_limit_db: 92, run_group_capacity: 10, garage_bay_count: 5, paddock_stall_count: 10 }
              as: TrackOps
              captures: { tid2: $.data.id }
            - call: "POST /tracks/${tid2}/track-days"
              payload: { date: "2026-08-20" }
              as: TrackOps
              captures: { tdid2: $.data.id }
            - call: "POST /tracks/${tid2}/track-days/${tdid2}/open"
              payload: {}
              as: TrackOps
              captures: { td2_v_open: $.data.version }
            - call: "POST /tracks/${tid2}/track-days/${tdid2}/rental-blocks"
              payload: { block_index: 0, start_minute: 480, end_minute: 540, max_group_size: 5 }
              as: TrackOps
              captures: { rbid2: $.data.id, rb2_v: $.data.version }
            - call: "POST /tracks/${tid2}/track-days/${tdid2}/rental-blocks/${rbid2}/bookings"
              payload: { organizer_user_id: "orgX", group_name: "GX", run_group_class: "INTERMEDIATE", driver_count: 1, insurance_policy_ref: "P1" }
              as: Organizer
              as_user_id: orgX
              captures: { bid2: $.data.id }
            - call: "POST /tracks/${tid2}/track-days/${tdid2}/rental-blocks/${rbid2}/bookings/${bid2}/approve"
              payload: { expected_rental_block_version: "${rb2_v}" }
              as: TrackOps
          trigger:
            # power_hookups = 4 → 2*2500 + 2*4000 = 5000+8000=13000; water=true → +3000; base 15000 → total 31000
            - call: "POST /tracks/${tid2}/track-days/${tdid2}/garage-assignments"
              payload: { booking_id: "${bid2}", bay_number: 1, power_hookups: 4, water_hookup: true, expected_track_day_version: "${td2_v_open}" }
              as: TrackOps
              captures: { gid2: $.data.id }
            - call: "POST /tracks/${tid2}/track-days/${tdid2}/paddock-assignments"
              payload: { booking_id: "${bid2}", stall_number: 3 }
              as: TrackOps
              captures: { pid2: $.data.id }
          assert:
            - "GarageAssignment.${gid2} computed fee: 15000 + (2*2500 + 2*4000) + 3000 == 31000 cents (tiered pricing with two power tiers plus water flat)"
            - "PaddockAssignment.${pid2} exposes no fee computation (paddock has no utility metering; flat-zero algorithm)"
            - "Tiered (power_hookups=4 → 13000) vs flat (power_hookups=2 → 5000) yields non-linear output for the same entity kind"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: trackday_posture_multibranch_threshold
        grounds:
          - calculations.trackday_posture
          - calculations.trackday_posture_noise_window
          - entities.TrackDay.fields.posture
        distinguishing_aspect: |
          Mode (a) — a formula with >=3 inputs and non-linear interaction:
          posture depends on weather_flag (3-way enum), open_incident_count,
          max severity among open incidents, and noise_breach_count crossing
          two distinct thresholds; the branches interact (weather==STOP forces
          SUSPENDED regardless of incidents; CAUTION can arise from 3
          independent signals).
        test_recipe:
          setup:
            - "Track noise_limit_db=90; TrackDay OPEN; one Session GREEN"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TrackOps
            - call: "POST /tracks"
              payload: { name: "RoadAtlanta", noise_limit_db: 90, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid3: $.data.id }
            - call: "POST /tracks/${tid3}/track-days"
              payload: { date: "2026-08-22" }
              as: TrackOps
              captures: { tdid3: $.data.id }
            - call: "POST /tracks/${tid3}/track-days/${tdid3}/open"
              payload: {}
              as: TrackOps
            - call: "POST /tracks/${tid3}/track-days/${tdid3}/rental-blocks"
              payload: { block_index: 0, start_minute: 480, end_minute: 540, max_group_size: 5 }
              as: TrackOps
              captures: { rbid3: $.data.id }
            - call: "POST /tracks/${tid3}/track-days/${tdid3}/sessions"
              payload: { rental_block_id: "${rbid3}", run_group_class: "INTERMEDIATE" }
              as: TrackOps
              captures: { sid3: $.data.id }
          trigger:
            - call: "POST /tracks/${tid3}/track-days/${tdid3}/noise-readings"
              payload: { session_id: "${sid3}", db_level: 91, recorded_at_utc: "2026-08-22T09:00:00Z" }
              as: TrackOps
            - call: "POST /tracks/${tid3}/track-days/${tdid3}/noise-readings"
              payload: { session_id: "${sid3}", db_level: 92, recorded_at_utc: "2026-08-22T09:10:00Z" }
              as: TrackOps
            - call: "POST /tracks/${tid3}/track-days/${tdid3}/noise-readings"
              payload: { session_id: "${sid3}", db_level: 93, recorded_at_utc: "2026-08-22T09:20:00Z" }
              as: TrackOps
            - call: "POST /tracks/${tid3}/track-days/${tdid3}/incidents"
              payload: { session_id: "${sid3}", severity: "LOW", reported_by_user_id: "ops1" }
              as: TrackOps
              captures: { iid3: $.data.id }
            - call: "POST /tracks/${tid3}/track-days/${tdid3}/weather_hold"
              payload: {}
              as: TrackOps
          assert:
            - "After 1 breach (db=91>90): TrackDay.posture == CAUTION (noise_breach_count >= NOISE_BREACH_CAUTION_THRESHOLD=1)"
            - "After 3 breaches: posture == SUSPENDED (breach_count >= NOISE_BREACH_SUSPENSION_THRESHOLD=3)"
            - "Adding LOW incident while SUSPENDED keeps posture SUSPENDED (non-linear: incidents don't lower further)"
            - "weather_hold during SUSPENDED: weather_flag=WATCH but posture stays SUSPENDED (weather branch dominates)"

      - name: cancel_refund_nested_rounding
        grounds:
          - calculations.cancel_refund_cents
          - calculations.garage_utility_fee_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: refund_cents is
          computed as round_half_up(fee*0.75) - WEATHER_FACILITY_FEE_CENTS.
          If the subtraction were applied pre-rounding (i.e.
          round_half_up(fee*0.75 - 5000)) the result can differ from
          round-then-subtract; the scaffold pins the order explicitly to
          "round first, then subtract fixed fee, then floor at 0".
        test_recipe:
          setup:
            - "TrackDay OPEN, Booking with driver_count=1 (fee=35000, an odd-half case: 35000*0.75 = 26250.0) APPROVED + CAPTURED; clock positioned inside any refund band"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TrackOps
            - call: "POST /tracks"
              payload: { name: "Watkins", noise_limit_db: 92, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid4: $.data.id }
            - call: "POST /tracks/${tid4}/track-days"
              payload: { date: "2026-08-25" }
              as: TrackOps
              captures: { tdid4: $.data.id }
            - call: "POST /tracks/${tid4}/track-days/${tdid4}/open"
              payload: {}
              as: TrackOps
            - call: "POST /tracks/${tid4}/track-days/${tdid4}/rental-blocks"
              payload: { block_index: 0, start_minute: 480, end_minute: 540, max_group_size: 5 }
              as: TrackOps
              captures: { rbid4: $.data.id, rb4_v: $.data.version }
            - call: "POST /tracks/${tid4}/track-days/${tdid4}/rental-blocks/${rbid4}/bookings"
              payload: { organizer_user_id: "org4", group_name: "G4", run_group_class: "ADVANCED", driver_count: 1, insurance_policy_ref: "P4" }
              as: Organizer
              as_user_id: org4
              captures: { bid4: $.data.id }
            - call: "POST /tracks/${tid4}/track-days/${tdid4}/rental-blocks/${rbid4}/bookings/${bid4}/approve"
              payload: { expected_rental_block_version: "${rb4_v}" }
              as: TrackOps
            - call: "POST /_payments/simulate"
              payload: { booking_id: "${bid4}", outcome: "AUTHORIZE" }
              as: TrackOps
            - call: "POST /_payments/simulate"
              payload: { booking_id: "${bid4}", outcome: "CAPTURE" }
              as: TrackOps
          trigger:
            - call: "POST /tracks/${tid4}/track-days/${tdid4}/cancel"
              payload: { reason: "WEATHER" }
              as: TrackOps
          assert:
            - "Booking.${bid4}.refund_cents == 26250 - 5000 == 21250  # order: round(35000*0.75)=26250 then subtract flat fee"
            - "If the order were reversed: round_half_up(35000*0.75 - 5000) = round_half_up(21250.0) = 21250 — same here, so test ALSO uses driver_count=3 case (fee=105000, 105000*0.75=78750) to confirm formula"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: trackday_open_running_stopped_cyclic
        grounds:
          - state_machines.TrackDay.OPEN_to_RUNNING
          - state_machines.TrackDay.RUNNING_to_STOPPED
          - state_machines.TrackDay.STOPPED_to_RUNNING
          - state_machines.TrackDay.RUNNING_to_CLOSED
        distinguishing_aspect: |
          TrackDay exhibits a cyclic non-linear shape: RUNNING ↔ STOPPED loop
          (an incident stops the day, resume returns to RUNNING) coexisting
          with a forward exit RUNNING → CLOSED. This is not a linear pipeline
          — multiple distinct cycles can repeat in one day.
        test_recipe:
          setup:
            - "Track noise_limit_db=92; TrackDay OPEN; one GREEN session"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TrackOps
            - call: "POST /tracks"
              payload: { name: "RoadAmerica", noise_limit_db: 92, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid5: $.data.id }
            - call: "POST /tracks/${tid5}/track-days"
              payload: { date: "2026-08-26" }
              as: TrackOps
              captures: { tdid5: $.data.id }
            - call: "POST /tracks/${tid5}/track-days/${tdid5}/open"
              payload: {}
              as: TrackOps
            - call: "POST /tracks/${tid5}/track-days/${tdid5}/rental-blocks"
              payload: { block_index: 0, start_minute: 480, end_minute: 540, max_group_size: 5 }
              as: TrackOps
              captures: { rbid5: $.data.id }
            - call: "POST /tracks/${tid5}/track-days/${tdid5}/sessions"
              payload: { rental_block_id: "${rbid5}", run_group_class: "ADVANCED" }
              as: TrackOps
              captures: { sid5: $.data.id }
            - call: "GET /tracks/${tid5}/track-days/${tdid5}"
              payload: {}
              as: TrackOps
              captures: { td5_v_pre_stop: $.data.version }
          trigger:
            - call: "POST /tracks/${tid5}/track-days/${tdid5}/incidents"
              payload: { session_id: "${sid5}", severity: "HIGH", reported_by_user_id: "ops1" }
              as: TrackOps
              captures: { iid5: $.data.id }
            - call: "POST /tracks/${tid5}/track-days/${tdid5}/incidents/${iid5}/investigate"
              payload: {}
              as: SafetyOfficer
            - call: "POST /tracks/${tid5}/track-days/${tdid5}/incidents/${iid5}/clear"
              payload: { cleared_by_user_id: "safety1" }
              as: SafetyOfficer
            - call: "GET /tracks/${tid5}/track-days/${tdid5}"
              payload: {}
              as: TrackOps
              captures: { td5_v_after_clear: $.data.version }
            - call: "POST /tracks/${tid5}/track-days/${tdid5}/resume"
              payload: { expected_track_day_version: "${td5_v_after_clear}" }
              as: SafetyOfficer
          assert:
            - "After HIGH incident OPEN: TrackDay.status == STOPPED (auto-transition), posture == SUSPENDED"
            - "Session.${sid5}.status == RED (cascade)"
            - "After incident CLEAR + resume: TrackDay.status == RUNNING, Session.${sid5}.status == GREEN (cycle closes)"

      - name: session_green_red_black_branching
        grounds:
          - state_machines.Session.GREEN_to_RED
          - state_machines.Session.GREEN_to_BLACK
          - state_machines.Session.RED_to_BLACK
          - state_machines.Session.RED_to_GREEN
          - state_machines.Session.GREEN_to_CHECKERED
        distinguishing_aspect: |
          Session exhibits branching fork-join shape: from GREEN three
          divergent successors {RED, BLACK, CHECKERED} exist; RED further
          branches into {GREEN (resume), BLACK (cancel)}; each branch carries
          distinct side-effects (cascade-up vs cascade-down vs end stamping).
          Different entity than TrackDay.
        test_recipe:
          setup:
            - "TrackDay RUNNING with two GREEN sessions"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TrackOps
            - call: "POST /tracks"
              payload: { name: "Sebring", noise_limit_db: 92, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid6: $.data.id }
            - call: "POST /tracks/${tid6}/track-days"
              payload: { date: "2026-08-27" }
              as: TrackOps
              captures: { tdid6: $.data.id }
            - call: "POST /tracks/${tid6}/track-days/${tdid6}/open"
              payload: {}
              as: TrackOps
            - call: "POST /tracks/${tid6}/track-days/${tdid6}/rental-blocks"
              payload: { block_index: 0, start_minute: 480, end_minute: 540, max_group_size: 5 }
              as: TrackOps
              captures: { rbid6: $.data.id }
            - call: "POST /tracks/${tid6}/track-days/${tdid6}/sessions"
              payload: { rental_block_id: "${rbid6}", run_group_class: "INTERMEDIATE" }
              as: TrackOps
              captures: { sid6a: $.data.id }
            - call: "POST /tracks/${tid6}/track-days/${tdid6}/sessions"
              payload: { rental_block_id: "${rbid6}", run_group_class: "ADVANCED" }
              as: TrackOps
              captures: { sid6b: $.data.id }
          trigger:
            - call: "POST /tracks/${tid6}/track-days/${tdid6}/incidents"
              payload: { session_id: "${sid6a}", severity: "MEDIUM", reported_by_user_id: "ops1" }
              as: TrackOps
              captures: { iid6: $.data.id }
            - call: "POST /tracks/${tid6}/track-days/${tdid6}/incidents/${iid6}/clear"
              payload: { cleared_by_user_id: "safety1" }
              as: SafetyOfficer
            - call: "POST /tracks/${tid6}/track-days/${tdid6}/cancel"
              payload: { reason: "WEATHER" }
              as: TrackOps
          assert:
            - "After MEDIUM incident: Session.${sid6a}.status == RED; Session.${sid6b}.status == GREEN (only the affected session goes RED for MEDIUM)"
            - "After TrackDay cancel: Session.${sid6b}.status transitions GREEN → BLACK; sid6a is already RED → BLACK"
            - "ended_at_utc is stamped for both sessions"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: incident_open_to_trackday_stop_to_session_red
        grounds:
          - state_machines.Incident.OPEN
          - state_machines.TrackDay.RUNNING_to_STOPPED
          - state_machines.Session.GREEN_to_RED
        distinguishing_aspect: |
          Depth-3 cascade originating at `POST .../incidents`: (1) Incident
          OPEN creates and bumps open_incident_count on TrackDay; (2) the
          TrackDay bump itself triggers TrackDay RUNNING→STOPPED (when
          severity∈{HIGH,CRITICAL}); (3) STOPPED cascades every GREEN session
          to RED. Each link is CAUSED by the previous one, not the original
          call.
        test_recipe:
          setup:
            - "TrackDay RUNNING with two GREEN sessions"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TrackOps
            - call: "POST /tracks"
              payload: { name: "COTA", noise_limit_db: 92, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid7: $.data.id }
            - call: "POST /tracks/${tid7}/track-days"
              payload: { date: "2026-08-28" }
              as: TrackOps
              captures: { tdid7: $.data.id }
            - call: "POST /tracks/${tid7}/track-days/${tdid7}/open"
              payload: {}
              as: TrackOps
            - call: "POST /tracks/${tid7}/track-days/${tdid7}/rental-blocks"
              payload: { block_index: 0, start_minute: 480, end_minute: 540, max_group_size: 5 }
              as: TrackOps
              captures: { rbid7: $.data.id }
            - call: "POST /tracks/${tid7}/track-days/${tdid7}/sessions"
              payload: { rental_block_id: "${rbid7}", run_group_class: "NOVICE" }
              as: TrackOps
              captures: { sid7a: $.data.id }
            - call: "POST /tracks/${tid7}/track-days/${tdid7}/sessions"
              payload: { rental_block_id: "${rbid7}", run_group_class: "ADVANCED" }
              as: TrackOps
              captures: { sid7b: $.data.id }
          trigger:
            - call: "POST /tracks/${tid7}/track-days/${tdid7}/incidents"
              payload: { session_id: "${sid7a}", severity: "CRITICAL", reported_by_user_id: "ops1" }
              as: TrackOps
          assert:
            - "Link1: Incident.status == OPEN; TrackDay.open_incident_count == 1"
            - "Link2: TrackDay.status transitioned RUNNING → STOPPED (caused by open_incident_count change + severity)"
            - "Link3: Session.${sid7a}.status == RED AND Session.${sid7b}.status == RED (caused by TrackDay STOPPED, not directly by the incident POST)"
            - "TrackDay.posture == SUSPENDED"

      - name: booking_cancel_to_coach_unassign_to_block_reopen
        grounds:
          - state_machines.Booking.APPROVED_to_CANCELLED
          - state_machines.RentalBlock.FULL_to_OPEN
          - entities.Coach.fields.assigned_booking_ids
        distinguishing_aspect: |
          Depth-3 cascade originating at booking cancel: (1) Booking APPROVED
          → CANCELLED; (2) the cancel causes RentalBlock.seats_reserved to
          decrement, which (3) itself triggers RentalBlock FULL → OPEN; the
          same cancel also causes Coach.assigned_booking_ids to drop this
          booking (cross-entity link). Different originating trigger than the
          incident cascade.
        test_recipe:
          setup:
            - "TrackDay OPEN; RentalBlock max_group_size=2; Coach C INTERMEDIATE"
            - "Booking (driver_count=2, NOVICE, coach assigned) APPROVED → block is FULL (seats_reserved=2)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TrackOps
            - call: "POST /tracks"
              payload: { name: "Barber", noise_limit_db: 92, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid8: $.data.id }
            - call: "POST /tracks/${tid8}/coaches"
              payload: { full_name: "Alice", cert_level: "INTERMEDIATE" }
              as: TrackOps
              captures: { cid8: $.data.id }
            - call: "POST /tracks/${tid8}/track-days"
              payload: { date: "2026-08-29" }
              as: TrackOps
              captures: { tdid8: $.data.id }
            - call: "POST /tracks/${tid8}/track-days/${tdid8}/open"
              payload: {}
              as: TrackOps
            - call: "POST /tracks/${tid8}/track-days/${tdid8}/rental-blocks"
              payload: { block_index: 0, start_minute: 480, end_minute: 540, max_group_size: 2 }
              as: TrackOps
              captures: { rbid8: $.data.id, rb8_v: $.data.version }
            - call: "POST /tracks/${tid8}/track-days/${tdid8}/rental-blocks/${rbid8}/bookings"
              payload: { organizer_user_id: "org8", group_name: "G8", run_group_class: "NOVICE", driver_count: 2, insurance_policy_ref: "P8", coach_id: "${cid8}" }
              as: Organizer
              as_user_id: org8
              captures: { bid8: $.data.id }
            - call: "POST /tracks/${tid8}/track-days/${tdid8}/rental-blocks/${rbid8}/bookings/${bid8}/assign_coach"
              payload: { coach_id: "${cid8}" }
              as: TrackOps
            - call: "POST /tracks/${tid8}/track-days/${tdid8}/rental-blocks/${rbid8}/bookings/${bid8}/approve"
              payload: { expected_rental_block_version: "${rb8_v}" }
              as: TrackOps
            - call: "POST /_payments/simulate"
              payload: { booking_id: "${bid8}", outcome: "AUTHORIZE" }
              as: TrackOps
            - call: "POST /_payments/simulate"
              payload: { booking_id: "${bid8}", outcome: "CAPTURE" }
              as: TrackOps
          trigger:
            - call: "POST /tracks/${tid8}/track-days/${tdid8}/rental-blocks/${rbid8}/bookings/${bid8}/cancel"
              payload: { reason: "CUSTOMER" }
              as: Organizer
              as_user_id: org8
          assert:
            - "Link1: Booking.${bid8}.approval_status == CANCELLED"
            - "Link2: RentalBlock.${rbid8}.seats_reserved == 0 (caused by booking cancel)"
            - "Link3: RentalBlock.${rbid8}.status transitioned FULL → OPEN (caused by seats_reserved change)"
            - "Cross-entity: Coach.${cid8}.assigned_booking_ids no longer contains ${bid8}"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: posture_vs_business_referential_pair
        grounds:
          - validations[priority=8]
          - validations[priority=11]
        distinguishing_aspect: |
          Pair = business_safety (ERR_TRACK_SUSPENDED) vs business_referential
          (ERR_COACH_CERT_INSUFFICIENT). When a coach assign is attempted on a
          SUSPENDED TrackDay AND the coach cert is insufficient for the
          run_group_class, priority 8 fires first; the response MUST be
          ERR_TRACK_SUSPENDED, not ERR_COACH_CERT_INSUFFICIENT.
        test_recipe:
          setup:
            - "TrackDay SUSPENDED (posture=SUSPENDED via 3 noise breaches)"
            - "Coach with cert_level=BASIC (insufficient for RACE)"
            - "Booking RACE class exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TrackOps
            - call: "POST /tracks"
              payload: { name: "VIR", noise_limit_db: 90, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid9: $.data.id }
            - call: "POST /tracks/${tid9}/coaches"
              payload: { full_name: "Bob", cert_level: "BASIC" }
              as: TrackOps
              captures: { cid9: $.data.id }
            - call: "POST /tracks/${tid9}/track-days"
              payload: { date: "2026-08-30" }
              as: TrackOps
              captures: { tdid9: $.data.id }
            - call: "POST /tracks/${tid9}/track-days/${tdid9}/open"
              payload: {}
              as: TrackOps
            - call: "POST /tracks/${tid9}/track-days/${tdid9}/rental-blocks"
              payload: { block_index: 0, start_minute: 480, end_minute: 540, max_group_size: 5 }
              as: TrackOps
              captures: { rbid9: $.data.id }
            - call: "POST /tracks/${tid9}/track-days/${tdid9}/rental-blocks/${rbid9}/bookings"
              payload: { organizer_user_id: "org9", group_name: "G9", run_group_class: "RACE", driver_count: 1, insurance_policy_ref: "P9" }
              as: Organizer
              as_user_id: org9
              captures: { bid9: $.data.id }
            - call: "POST /tracks/${tid9}/track-days/${tdid9}/sessions"
              payload: { rental_block_id: "${rbid9}", run_group_class: "RACE" }
              as: TrackOps
              captures: { sid9: $.data.id }
            - call: "POST /tracks/${tid9}/track-days/${tdid9}/noise-readings"
              payload: { session_id: "${sid9}", db_level: 95, recorded_at_utc: "2026-08-30T09:00:00Z" }
              as: TrackOps
            - call: "POST /tracks/${tid9}/track-days/${tdid9}/noise-readings"
              payload: { session_id: "${sid9}", db_level: 96, recorded_at_utc: "2026-08-30T09:05:00Z" }
              as: TrackOps
            - call: "POST /tracks/${tid9}/track-days/${tdid9}/noise-readings"
              payload: { session_id: "${sid9}", db_level: 97, recorded_at_utc: "2026-08-30T09:10:00Z" }
              as: TrackOps
          trigger:
            - call: "POST /tracks/${tid9}/track-days/${tdid9}/rental-blocks/${rbid9}/bookings/${bid9}/assign_coach"
              payload: { coach_id: "${cid9}" }
              as: TrackOps
              captures: { err1: $.data.error_id }
          assert:
            - "error_id == ERR_TRACK_SUSPENDED (priority 8 business_safety wins over priority 11 business_referential)"
            - "Coach.${cid9}.assigned_booking_ids is unchanged"

      - name: state_vs_business_temporal_pair
        grounds:
          - validations[priority=7]
          - validations[priority=13]
        distinguishing_aspect: |
          Pair = state (ERR_INVALID_STATE on a CLOSED TrackDay) vs
          business_temporal (ERR_BLOCK_OVERLAP). When creating a RentalBlock
          on a CANCELLED TrackDay AND the interval overlaps an existing block,
          priority 6/7 state check fires before the temporal check; the
          response MUST be ERR_TRACK_DAY_NOT_LIVE (or ERR_INVALID_STATE), not
          ERR_BLOCK_OVERLAP.
        test_recipe:
          setup:
            - "TrackDay with one existing RentalBlock [480,540)"
            - "TrackDay then CANCELLED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TrackOps
            - call: "POST /tracks"
              payload: { name: "Pocono", noise_limit_db: 92, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid10: $.data.id }
            - call: "POST /tracks/${tid10}/track-days"
              payload: { date: "2026-09-01" }
              as: TrackOps
              captures: { tdid10: $.data.id }
            - call: "POST /tracks/${tid10}/track-days/${tdid10}/open"
              payload: {}
              as: TrackOps
            - call: "POST /tracks/${tid10}/track-days/${tdid10}/rental-blocks"
              payload: { block_index: 0, start_minute: 480, end_minute: 540, max_group_size: 5 }
              as: TrackOps
              captures: { rbid10: $.data.id }
            - call: "POST /tracks/${tid10}/track-days/${tdid10}/cancel"
              payload: { reason: "CUSTOMER" }
              as: TrackOps
          trigger:
            - call: "POST /tracks/${tid10}/track-days/${tdid10}/rental-blocks"
              payload: { block_index: 1, start_minute: 500, end_minute: 560, max_group_size: 5 }
              as: TrackOps
              captures: { err2: $.data.error_id }
          assert:
            - "error_id == ERR_TRACK_DAY_NOT_LIVE (state/existence layer wins over business_temporal ERR_BLOCK_OVERLAP)"
            - "Even though interval [500,560) geometrically overlaps [480,540), the temporal rule is never evaluated"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: noise_breach_strictly_greater_boundary
        grounds:
          - calculations.noise_breach_db
          - entities.NoiseReading.fields.breach
        distinguishing_aspect: |
          Noise breach uses strict `>` — a reading exactly equal to
          Track.noise_limit_db does NOT count as a breach; one dB above does.
          Reachable through POST /noise-readings. Different metric than the
          seats boundary.
        test_recipe:
          setup:
            - "Track noise_limit_db=90; TrackDay OPEN; one GREEN session"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TrackOps
            - call: "POST /tracks"
              payload: { name: "MidOhio", noise_limit_db: 90, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid11: $.data.id }
            - call: "POST /tracks/${tid11}/track-days"
              payload: { date: "2026-09-02" }
              as: TrackOps
              captures: { tdid11: $.data.id }
            - call: "POST /tracks/${tid11}/track-days/${tdid11}/open"
              payload: {}
              as: TrackOps
            - call: "POST /tracks/${tid11}/track-days/${tdid11}/rental-blocks"
              payload: { block_index: 0, start_minute: 480, end_minute: 540, max_group_size: 5 }
              as: TrackOps
              captures: { rbid11: $.data.id }
            - call: "POST /tracks/${tid11}/track-days/${tdid11}/sessions"
              payload: { rental_block_id: "${rbid11}", run_group_class: "ADVANCED" }
              as: TrackOps
              captures: { sid11: $.data.id }
          trigger:
            - call: "POST /tracks/${tid11}/track-days/${tdid11}/noise-readings"
              payload: { session_id: "${sid11}", db_level: 90, recorded_at_utc: "2026-09-02T09:00:00Z" }
              as: TrackOps
              captures: { nr_eq: $.data.id, breach_eq: $.data.breach }
            - call: "POST /tracks/${tid11}/track-days/${tdid11}/noise-readings"
              payload: { session_id: "${sid11}", db_level: 91, recorded_at_utc: "2026-09-02T09:05:00Z" }
              as: TrackOps
              captures: { nr_gt: $.data.id, breach_gt: $.data.breach }
          assert:
            - "NoiseReading.${nr_eq}.breach == false  # db=90, limit=90, strict > is required"
            - "NoiseReading.${nr_gt}.breach == true   # db=91 > 90"
            - "TrackDay.noise_breach_count == 1 (only the strict-greater reading counts)"

      - name: rental_block_seats_zero_boundary
        grounds:
          - calculations.rental_block_seats_available
          - validations[priority=18]
          - state_machines.RentalBlock.OPEN_to_FULL
        distinguishing_aspect: |
          Block seats boundary: a booking approval that exactly consumes the
          last seat (seats_available becomes 0) MUST succeed AND transition
          the block to FULL; the next approval with driver_count=1 MUST be
          rejected with ERR_BLOCK_FULL. Empty-set / zero-count edge.
          Reachable through POST .../bookings/{bid}/approve. Distinct metric
          (seat count vs noise dB) on a distinct endpoint.
        test_recipe:
          setup:
            - "RentalBlock max_group_size=3, no bookings yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TrackOps
            - call: "POST /tracks"
              payload: { name: "Thunderhill", noise_limit_db: 92, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid12: $.data.id }
            - call: "POST /tracks/${tid12}/track-days"
              payload: { date: "2026-09-03" }
              as: TrackOps
              captures: { tdid12: $.data.id }
            - call: "POST /tracks/${tid12}/track-days/${tdid12}/open"
              payload: {}
              as: TrackOps
            - call: "POST /tracks/${tid12}/track-days/${tdid12}/rental-blocks"
              payload: { block_index: 0, start_minute: 480, end_minute: 540, max_group_size: 3 }
              as: TrackOps
              captures: { rbid12: $.data.id, rb12_v0: $.data.version }
            - call: "POST /tracks/${tid12}/track-days/${tdid12}/rental-blocks/${rbid12}/bookings"
              payload: { organizer_user_id: "orgA", group_name: "GA", run_group_class: "ADVANCED", driver_count: 3, insurance_policy_ref: "PA" }
              as: Organizer
              as_user_id: orgA
              captures: { bid12a: $.data.id }
            - call: "POST /tracks/${tid12}/track-days/${tdid12}/rental-blocks/${rbid12}/bookings"
              payload: { organizer_user_id: "orgB", group_name: "GB", run_group_class: "ADVANCED", driver_count: 1, insurance_policy_ref: "PB" }
              as: Organizer
              as_user_id: orgB
              captures: { bid12b: $.data.id }
          trigger:
            - call: "POST /tracks/${tid12}/track-days/${tdid12}/rental-blocks/${rbid12}/bookings/${bid12a}/approve"
              payload: { expected_rental_block_version: "${rb12_v0}" }
              as: TrackOps
            - call: "GET /tracks/${tid12}/track-days/${tdid12}/rental-blocks/${rbid12}"
              payload: {}
              as: TrackOps
              captures: { rb12_v_after: $.data.version }
            - call: "POST /tracks/${tid12}/track-days/${tdid12}/rental-blocks/${rbid12}/bookings/${bid12b}/approve"
              payload: { expected_rental_block_version: "${rb12_v_after}" }
              as: TrackOps
              captures: { err12: $.data.error_id }
          assert:
            - "After B_A approve: RentalBlock.seats_reserved == 3, seats_available == 0, status == FULL"
            - "Second approve returns error_id == ERR_BLOCK_FULL (zero seats boundary)"
            - "Booking.${bid12b}.approval_status remains PENDING"

