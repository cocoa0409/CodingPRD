scenario: "590. Executive Search & Retained Recruiting: engagement (retained/contingent) & fee schedule, search assignment & target list, candidate sourcing & pipeline stage, interview & assessment, offer & placement, guarantee/replacement period, off-limits & conflict, invoice (retainer/progress/completion)"
domain_name: executive-search-retained-recruiting
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential   # Invoice.credited_invoice_id -> Invoice.id (credit note points at the invoice it reverses)
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: Expert

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Consultant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Consultant's display name.
      - name: seniority
        type: enum
        source: input
        description: Seniority band of the consultant.
        constraints: "one of {PARTNER, PRINCIPAL, ASSOCIATE}"
      - name: active
        type: boolean
        source: input
        description: Whether the consultant may be assigned new work.
        default: true

  - name: Company
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered company name.
      - name: industry
        type: string
        source: input
        description: Free-text industry label.
      - name: is_client
        type: boolean
        source: computed
        description: "Cross-entity derived flag: TRUE iff at least one Engagement exists with engagement.client_company_id == this.id AND engagement.status == ACTIVE; FALSE otherwise. Recomputed on every Engagement status change."

  - name: FeeSchedule
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Label of the fee schedule.
      - name: engagement_type
        type: enum
        source: input
        description: Which billing model this schedule implements.
        constraints: "one of {RETAINED, CONTINGENT}"
      - name: base_fee_pct
        type: number
        source: input
        description: Fee rate applied to a comp basis strictly BELOW tier_threshold_cents (RETAINED only).
        constraints: "0 < base_fee_pct < 1"
      - name: premium_fee_pct
        type: number
        source: input
        description: Fee rate applied to a comp basis at or above tier_threshold_cents (RETAINED only).
        constraints: "0 < premium_fee_pct < 1"
      - name: tier_threshold_cents
        type: integer
        source: input
        description: Comp-basis breakpoint separating base_fee_pct from premium_fee_pct; the comparison is `comp_basis >= tier_threshold_cents`.
        constraints: ">= 0"
      - name: contingent_fee_pct
        type: number
        source: input
        description: Flat fee rate applied to the actual first-year comp (CONTINGENT only; no tiering).
        constraints: "0 < contingent_fee_pct < 1"
      - name: retainer_pct
        type: number
        source: input
        description: Share of the provisional total fee billed as the RETAINER tranche.
        constraints: "0 < retainer_pct < 1; retainer_pct + progress_pct < 1"
      - name: progress_pct
        type: number
        source: input
        description: Share of the provisional total fee billed as the PROGRESS tranche.
        constraints: "0 < progress_pct < 1"
      - name: admin_fee_pct
        type: number
        source: input
        description: Administrative surcharge rate applied to the post-discount base of every invoice.
        constraints: "0 <= admin_fee_pct < 1"
      - name: guarantee_days
        type: integer
        source: input
        description: Length in days of the placement guarantee/replacement period.
        constraints: ">= 1"
      - name: off_limits_days
        type: integer
        source: input
        description: Length in days a placed Candidate is off-limits after their placement start date.
        constraints: ">= 1"
      - name: client_protection_days
        type: integer
        source: input
        description: Length in days a client Company is off-limits (no sourcing FROM it) after its Engagement is activated.
        constraints: ">= 1"
      - name: completion_pct
        type: number
        source: computed
        description: "Residual tranche share: 1 - retainer_pct - progress_pct. Informational only; the COMPLETION tranche amount is a residual in cents, not a percentage product (see calculations.invoice_tranche_allocation)."

  - name: Engagement
    parent: null
    common_fields: true
    fields:
      - name: client_company_id
        type: string
        source: input
        description: "FK -> Company.id; the client this engagement serves."
      - name: fee_schedule_id
        type: string
        source: input
        description: "FK -> FeeSchedule.id; pins all rates and periods for this engagement."
      - name: lead_partner_consultant_id
        type: string
        source: system
        description: "FK -> Consultant.id; set from the X-User-ID of the Partner who created the engagement."
      - name: engagement_type
        type: enum
        source: computed
        description: Copied from fee_schedule.engagement_type at creation time and frozen.
        constraints: "one of {RETAINED, CONTINGENT}"
      - name: status
        type: enum
        source: system
        description: Engagement lifecycle state.
        constraints: "one of {DRAFT, ACTIVE, COMPLETED, TERMINATED}"
        default: DRAFT
      - name: fee_cap_cents
        type: integer
        source: input
        description: Hard ceiling on billed_gross_cents for this engagement.
        constraints: ">= 1"
      - name: min_offer_fit_score
        type: number
        source: input
        description: Minimum panel_final_fit_score a PipelineEntry must carry before an Offer may be created against it.
        default: 7.0
        constraints: "0 <= min_offer_fit_score <= 10"
      - name: guarantee_days
        type: integer
        source: computed
        description: Copied from fee_schedule.guarantee_days at creation time and frozen.
      - name: billed_gross_cents
        type: integer
        source: computed
        description: Net billed fee ledger for this engagement (see calculations.engagement_billed_ledger).
        default: 0
      - name: placements_count
        type: integer
        source: computed
        description: Count of Placements whose assignment belongs to this engagement and whose status IN {ACTIVE_GUARANTEE, GUARANTEE_EXPIRED}.
        default: 0
      - name: activated_at
        type: datetime
        source: system
        description: Logical-clock instant at which the engagement entered ACTIVE; null while DRAFT.

  - name: SearchAssignment
    parent: null
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; the engagement funding this search."
      - name: lead_consultant_id
        type: string
        source: system
        description: "FK -> Consultant.id; set from the X-User-ID of the Consultant who created the assignment."
      - name: role_title
        type: string
        source: input
        description: Title of the role being searched for.
      - name: positions_total
        type: integer
        source: input
        description: Number of seats this search must fill.
        constraints: ">= 1"
      - name: target_first_year_comp_cents
        type: integer
        source: input
        description: Estimated first-year compensation used as the RETAINED comp basis for provisional tranches.
        constraints: ">= 1"
      - name: sourcing_status
        type: enum
        source: system
        description: "Sourcing dimension of this assignment's parallel state machine (independent of billing_status)."
        constraints: "one of {OPEN, SLATE_SUBMITTED, OFFER_OUT, FILLED, CLOSED}"
        default: OPEN
      - name: billing_status
        type: enum
        source: system
        description: "Billing dimension of this assignment's parallel state machine (independent of sourcing_status)."
        constraints: "one of {UNBILLED, RETAINER_BILLED, PROGRESS_BILLED, COMPLETION_BILLED, SETTLED}"
        default: UNBILLED
      - name: open_positions_remaining
        type: integer
        source: computed
        description: See calculations.assignment_position_ledger.
      - name: replacement_count
        type: integer
        source: computed
        description: Number of times a Placement on this assignment fell off and reopened the search.
        default: 0
      - name: slate_submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent successful submit-slate; null before the first submission.

  - name: TargetCompany
    parent: null
    common_fields: true
    fields:
      - name: assignment_id
        type: string
        source: input
        description: "FK -> SearchAssignment.id; the search whose target list this entry belongs to."
      - name: company_id
        type: string
        source: input
        description: "FK -> Company.id; the company approved as a sourcing target."
      - name: rationale
        type: string
        source: input
        description: Why this company is on the target list.

  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Candidate's display name.
      - name: current_employer_company_id
        type: string
        source: input
        description: "FK -> Company.id; the company the candidate currently works for; drives off-limits screening."
      - name: current_title
        type: string
        source: input
        description: Candidate's present title.
      - name: source_channel
        type: enum
        source: input
        description: How the candidate entered the firm's universe.
        constraints: "one of {REFERRAL, RESEARCH, INBOUND}"

  - name: PipelineEntry
    parent: null
    common_fields: true
    fields:
      - name: assignment_id
        type: string
        source: input
        description: "FK -> SearchAssignment.id; the search this candidate is being pursued for."
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id; the candidate in the pipeline."
      - name: sourced_by_consultant_id
        type: string
        source: system
        description: "FK -> Consultant.id; set from the X-User-ID of the Consultant who created the pipeline entry; drives the segregation-of-duties check on offer creation."
      - name: stage
        type: enum
        source: system
        description: Pipeline stage of this candidate on this search.
        constraints: "one of {SOURCED, SCREENED, SHORTLISTED, CLIENT_INTERVIEW, OFFER_STAGE, PLACED, REJECTED, WITHDRAWN}"
        default: SOURCED
      - name: preliminary_fit_score
        type: number
        source: computed
        description: See calculations.candidate_fit_score variant PRELIMINARY; null when no SCREEN assessment exists.
      - name: panel_final_fit_score
        type: number
        source: computed
        description: See calculations.candidate_fit_score variant PANEL_FINAL; null when no assessment exists.
      - name: reslate_count
        type: integer
        source: computed
        description: Number of CLIENT_INTERVIEW -> SHORTLISTED reverts already performed on this entry.
        default: 0
      - name: rejection_reason
        type: string
        source: input
        description: Free-text reason recorded when the entry moves to REJECTED or WITHDRAWN; null otherwise.

  - name: Interview
    parent: null
    common_fields: true
    fields:
      - name: pipeline_entry_id
        type: string
        source: input
        description: "FK -> PipelineEntry.id; the pipeline entry being interviewed."
      - name: interviewer_consultant_id
        type: string
        source: input
        description: "FK -> Consultant.id; the consultant occupying the interview slot."
      - name: start_at
        type: datetime
        source: input
        description: Interval start (inclusive).
      - name: end_at
        type: datetime
        source: input
        description: Interval end (exclusive for the interviewer-occupancy rule).
        constraints: "end_at > start_at"
      - name: mode
        type: enum
        source: input
        description: Delivery mode of the interview.
        constraints: "one of {PHONE, VIDEO, ONSITE}"
      - name: status
        type: enum
        source: system
        description: SCHEDULED until the first Assessment is submitted, then COMPLETED. Only SCHEDULED interviews occupy their interviewer and candidate.
        constraints: "one of {SCHEDULED, COMPLETED}"
        default: SCHEDULED

  - name: Assessment
    parent: Interview
    common_fields: false
    fields:
      - name: interview_id
        type: string
        source: system
        description: "FK -> Interview.id; taken from the path of POST /interviews/{interview_id}/assessments."
      - name: assessor_user_id
        type: string
        source: system
        description: "Opaque copy of the submitting X-User-ID. NOT a foreign key: it is a Consultant.id when assessor_role == CONSULTANT and a Company.id when assessor_role == CLIENT, so it is polymorphic and never dereferenced by the server."
      - name: assessor_role
        type: enum
        source: system
        description: Derived from the X-User-Role header of the submitter (Consultant -> CONSULTANT, ClientContact -> CLIENT).
        constraints: "one of {CONSULTANT, CLIENT}"
      - name: assessment_kind
        type: enum
        source: input
        description: Screening pass versus formal panel evaluation.
        constraints: "one of {SCREEN, PANEL}"
      - name: leadership_score
        type: integer
        source: input
        description: Leadership competency score.
        constraints: "0 <= leadership_score <= 10"
      - name: functional_score
        type: integer
        source: input
        description: Functional competency score; drives the PANEL_FINAL competency floor cap.
        constraints: "0 <= functional_score <= 10"
      - name: culture_score
        type: integer
        source: input
        description: Culture competency score.
        constraints: "0 <= culture_score <= 10"
      - name: assessor_weight
        type: number
        source: computed
        description: "1.0 when assessment_kind == SCREEN; 2.0 when assessment_kind == PANEL and assessor_role == CONSULTANT; 3.0 when assessment_kind == PANEL and assessor_role == CLIENT."
      - name: composite_score
        type: number
        source: computed
        description: "(leadership_score + functional_score + culture_score) / 3, rounded half-up to 2 decimal places."

  - name: Offer
    parent: null
    common_fields: true
    fields:
      - name: pipeline_entry_id
        type: string
        source: input
        description: "FK -> PipelineEntry.id; the entry the offer is made against."
      - name: approved_by_partner_id
        type: string
        source: system
        description: "FK -> Consultant.id; set from the X-User-ID of the Partner who created the offer."
      - name: base_salary_cents
        type: integer
        source: input
        description: Annual base salary offered.
        constraints: ">= 1"
      - name: bonus_cents
        type: integer
        source: input
        description: Target annual bonus offered.
        constraints: ">= 0"
      - name: total_first_year_comp_cents
        type: integer
        source: computed
        description: base_salary_cents + bonus_cents. Becomes the actual comp basis on placement.
      - name: start_date_at
        type: datetime
        source: input
        description: Agreed employment start instant; anchors the guarantee window.
      - name: status
        type: enum
        source: system
        description: Offer lifecycle state.
        constraints: "one of {DRAFT, EXTENDED, ACCEPTED, DECLINED}"
        default: DRAFT
      - name: extended_at
        type: datetime
        source: system
        description: Logical-clock instant the client extended the offer; null while DRAFT.
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant the offer was accepted or declined; null otherwise.
      - name: decline_reason
        type: string
        source: input
        description: Free-text reason recorded on decline; null otherwise.

  - name: Placement
    parent: null
    common_fields: true
    fields:
      - name: offer_id
        type: string
        source: system
        description: "FK -> Offer.id; the accepted offer that produced this placement."
      - name: assignment_id
        type: string
        source: system
        description: "FK -> SearchAssignment.id; denormalised from offer -> pipeline_entry.assignment_id."
      - name: candidate_id
        type: string
        source: system
        description: "FK -> Candidate.id; denormalised from offer -> pipeline_entry.candidate_id."
      - name: actual_first_year_comp_cents
        type: integer
        source: computed
        description: Copied from offer.total_first_year_comp_cents; the CONTINGENT comp basis and the RETAINED reconciliation basis.
      - name: start_date_at
        type: datetime
        source: computed
        description: Copied from offer.start_date_at.
      - name: guarantee_end_at
        type: datetime
        source: computed
        description: See calculations.guarantee_window.
      - name: status
        type: enum
        source: system
        description: Placement lifecycle state.
        constraints: "one of {ACTIVE_GUARANTEE, GUARANTEE_EXPIRED, FALLEN_OFF}"
        default: ACTIVE_GUARANTEE
      - name: fall_off_reason
        type: string
        source: input
        description: Free-text reason recorded on fall-off; null otherwise.
      - name: fell_off_at
        type: datetime
        source: system
        description: Logical-clock instant of fall-off; null otherwise.

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; the engagement being billed."
      - name: assignment_id
        type: string
        source: input
        description: "FK -> SearchAssignment.id; the search being billed."
      - name: invoice_type
        type: enum
        source: input
        description: Which tranche (or reversal) this invoice represents. CREDIT_NOTE rows are never created through POST /invoices; they are minted only by the fall-off cascade.
        constraints: "one of {RETAINER, PROGRESS, COMPLETION, CREDIT_NOTE}"
      - name: credited_invoice_id
        type: string
        source: system
        description: "FK -> Invoice.id; on a CREDIT_NOTE row, the COMPLETION invoice it reverses; null on all other rows."
      - name: gross_amount_cents
        type: integer
        source: computed
        description: Tranche amount before discount and admin fee (see calculations.invoice_tranche_allocation).
      - name: discount_cents
        type: integer
        source: computed
        description: Volume discount applied to gross_amount_cents (see calculations.invoice_net_payable step 3).
      - name: admin_fee_cents
        type: integer
        source: computed
        description: Administrative surcharge on the post-discount base (see calculations.invoice_net_payable step 5).
      - name: net_payable_cents
        type: integer
        source: computed
        description: gross_amount_cents - discount_cents + admin_fee_cents (see calculations.invoice_net_payable step 6).
      - name: status
        type: enum
        source: system
        description: Invoice lifecycle state.
        constraints: "one of {ISSUED, PAID, CREDITED}"
        default: ISSUED
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant the invoice was issued.
      - name: paid_at
        type: datetime
        source: system
        description: Logical-clock instant the invoice was paid; null otherwise.

  - name: OffLimitsRecord
    parent: null
    common_fields: true
    fields:
      - name: scope
        type: enum
        source: system
        description: CLIENT_PROTECTION rows are minted on engagement activation; PLACEMENT rows are minted on offer acceptance.
        constraints: "one of {CLIENT_PROTECTION, PLACEMENT}"
      - name: protected_company_id
        type: string
        source: system
        description: "FK -> Company.id; the company the firm may not source FROM while this record is ACTIVE."
      - name: candidate_id
        type: string
        source: system
        description: "FK -> Candidate.id; the placed candidate on PLACEMENT rows; null on CLIENT_PROTECTION rows."
      - name: placement_id
        type: string
        source: system
        description: "FK -> Placement.id; the placement that minted this record; null on CLIENT_PROTECTION rows."
      - name: engagement_id
        type: string
        source: system
        description: "FK -> Engagement.id; the engagement that minted this record (CLIENT_PROTECTION) or funded the placement (PLACEMENT)."
      - name: off_limits_until
        type: datetime
        source: computed
        description: See calculations.off_limits_window.
      - name: status
        type: enum
        source: system
        description: ACTIVE until lifted (fall-off / engagement termination) or expired by the ops sweep.
        constraints: "one of {ACTIVE, LIFTED, EXPIRED}"
        default: ACTIVE

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: Engagement
    dimension: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /engagements/{engagement_id}/activate"
        actor: Partner
        preconditions:
          - "engagement.status == DRAFT"
          - "X-User-ID == engagement.lead_partner_consultant_id"
        side_effects:
          - "Set engagement.activated_at = logical clock now."
          - "Mint OffLimitsRecord{scope: CLIENT_PROTECTION, protected_company_id: engagement.client_company_id, engagement_id: engagement.id, candidate_id: null, placement_id: null, status: ACTIVE, off_limits_until: calculations.off_limits_window variant CLIENT_PROTECTION}."
          - "Recompute Company.is_client for engagement.client_company_id (becomes TRUE)."
          - "Increment Engagement.version by 1."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /engagements/{engagement_id}/terminate"
        actor: Partner
        preconditions:
          - "engagement.status == ACTIVE"
          - "X-User-ID == engagement.lead_partner_consultant_id"
        side_effects:
          - "CASCADE hop 1: every SearchAssignment with assignment.engagement_id == engagement.id AND sourcing_status IN {OPEN, SLATE_SUBMITTED, OFFER_OUT, FILLED} moves sourcing_status -> CLOSED (processed in created_at ASC order)."
          - "CASCADE hop 2 (caused by hop 1): for each assignment that just moved to CLOSED, every PipelineEntry with stage IN {SOURCED, SCREENED, SHORTLISTED, CLIENT_INTERVIEW, OFFER_STAGE} on that assignment moves stage -> WITHDRAWN (created_at ASC), with rejection_reason = 'ENGAGEMENT_TERMINATED'."
          - "CASCADE hop 3 (caused by hop 2): for each PipelineEntry that just moved to WITHDRAWN, every Offer on it with status IN {DRAFT, EXTENDED} moves status -> DECLINED with decline_reason = 'ENGAGEMENT_TERMINATED' and decided_at = now."
          - "Set OffLimitsRecord.status = LIFTED for every ACTIVE record with scope == CLIENT_PROTECTION and engagement_id == engagement.id."
          - "Recompute Company.is_client for engagement.client_company_id."
          - "Increment Engagement.version by 1."
      - from: ACTIVE
        to: COMPLETED
        trigger: "system, during POST /_ops/run-guarantee-sweep"
        actor: system
        preconditions:
          - "engagement.status == ACTIVE"
          - "At least one SearchAssignment exists for the engagement and EVERY SearchAssignment with assignment.engagement_id == engagement.id has sourcing_status == CLOSED"
          - "EVERY Invoice with invoice.engagement_id == engagement.id has status IN {PAID, CREDITED}"
        side_effects:
          - "Recompute Company.is_client for engagement.client_company_id (becomes FALSE unless another ACTIVE engagement exists for it)."
          - "Increment Engagement.version by 1."

  - entity: SearchAssignment
    dimension: sourcing_status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: SLATE_SUBMITTED
        trigger: "POST /search-assignments/{assignment_id}/submit-slate"
        actor: Consultant
        preconditions:
          - "assignment.sourcing_status == OPEN"
          - "engagement.status == ACTIVE"
          - "X-User-ID == assignment.lead_consultant_id"
          - "expected_assignment_version == assignment.version"
          - "COUNT(PipelineEntry where assignment_id == assignment.id AND stage == SHORTLISTED) >= 1"
        side_effects:
          - "Set assignment.slate_submitted_at = logical clock now."
          - "Increment SearchAssignment.version by 1."
      - from: SLATE_SUBMITTED
        to: OFFER_OUT
        trigger: "system, on POST /offers/{offer_id}/extend"
        actor: system
        preconditions:
          - "assignment.sourcing_status == SLATE_SUBMITTED"
        side_effects:
          - "Increment SearchAssignment.version by 1."
      - from: OFFER_OUT
        to: SLATE_SUBMITTED
        trigger: "system, on POST /offers/{offer_id}/decline (cycle back for a fresh offer round)"
        actor: system
        preconditions:
          - "assignment.sourcing_status == OFFER_OUT"
        side_effects:
          - "Increment SearchAssignment.version by 1."
        note: "Cycle: SLATE_SUBMITTED -> OFFER_OUT -> SLATE_SUBMITTED, repeatable per negotiation round."
      - from: OFFER_OUT
        to: FILLED
        trigger: "system, on POST /offers/{offer_id}/accept when the recomputed open_positions_remaining == 0"
        actor: system
        preconditions:
          - "assignment.sourcing_status == OFFER_OUT"
          - "assignment.open_positions_remaining (after the new Placement is counted) == 0"
        side_effects:
          - "Increment SearchAssignment.version by 1."
      - from: OFFER_OUT
        to: SLATE_SUBMITTED
        trigger: "system, on POST /offers/{offer_id}/accept when the recomputed open_positions_remaining > 0"
        actor: system
        preconditions:
          - "assignment.sourcing_status == OFFER_OUT"
          - "assignment.open_positions_remaining (after the new Placement is counted) > 0"
        side_effects:
          - "Increment SearchAssignment.version by 1."
      - from: FILLED
        to: OPEN
        trigger: "system, on POST /placements/{placement_id}/fall-off (replacement search reopens)"
        actor: system
        preconditions:
          - "assignment.sourcing_status == FILLED"
        side_effects:
          - "Increment assignment.replacement_count by 1."
          - "Recompute assignment.open_positions_remaining (calculations.assignment_position_ledger)."
          - "Increment SearchAssignment.version by 1."
        note: "Cycle: OPEN -> ... -> FILLED -> OPEN."
      - from: FILLED
        to: CLOSED
        trigger: "system, during POST /_ops/run-guarantee-sweep"
        actor: system
        preconditions:
          - "assignment.sourcing_status == FILLED"
          - "EVERY Placement with placement.assignment_id == assignment.id has status == GUARANTEE_EXPIRED"
        side_effects:
          - "Increment SearchAssignment.version by 1."
      - from: OPEN
        to: CLOSED
        trigger: "system, on POST /engagements/{engagement_id}/terminate (cascade hop 1)"
        actor: system
        preconditions:
          - "assignment.sourcing_status IN {OPEN, SLATE_SUBMITTED, OFFER_OUT, FILLED}"
        side_effects:
          - "Triggers cascade hop 2 on this assignment's non-terminal PipelineEntries (-> WITHDRAWN)."
          - "Increment SearchAssignment.version by 1."
        note: "Same transition applies from SLATE_SUBMITTED, OFFER_OUT and FILLED; listed once from OPEN for brevity."

  - entity: SearchAssignment
    dimension: billing_status
    initial_state: UNBILLED
    terminal_states: [SETTLED]
    transitions:
      - from: UNBILLED
        to: RETAINER_BILLED
        trigger: "POST /invoices with invoice_type == RETAINER (RETAINED engagements only)"
        actor: FinanceOfficer
        preconditions:
          - "assignment.billing_status == UNBILLED"
          - "engagement.engagement_type == RETAINED"
          - "engagement.status == ACTIVE"
        side_effects:
          - "Create Invoice (status ISSUED) with amounts from calculations.invoice_tranche_allocation + calculations.invoice_net_payable."
          - "Recompute engagement.billed_gross_cents (calculations.engagement_billed_ledger)."
          - "Increment SearchAssignment.version by 1."
      - from: RETAINER_BILLED
        to: PROGRESS_BILLED
        trigger: "POST /invoices with invoice_type == PROGRESS (RETAINED engagements only)"
        actor: FinanceOfficer
        preconditions:
          - "assignment.billing_status == RETAINER_BILLED"
          - "assignment.sourcing_status IN {SLATE_SUBMITTED, OFFER_OUT, FILLED}"
          - "engagement.status == ACTIVE"
        side_effects:
          - "Create Invoice (status ISSUED)."
          - "Recompute engagement.billed_gross_cents."
          - "Increment SearchAssignment.version by 1."
      - from: PROGRESS_BILLED
        to: COMPLETION_BILLED
        trigger: "POST /invoices with invoice_type == COMPLETION (RETAINED engagements)"
        actor: FinanceOfficer
        preconditions:
          - "assignment.billing_status == PROGRESS_BILLED"
          - "engagement.status == ACTIVE"
          - "EXISTS Placement with placement.assignment_id == assignment.id AND status == ACTIVE_GUARANTEE"
        side_effects:
          - "Create Invoice (status ISSUED) whose gross is the reconciliation residual against the ACTUAL comp basis."
          - "Recompute engagement.billed_gross_cents."
          - "Increment SearchAssignment.version by 1."
      - from: UNBILLED
        to: COMPLETION_BILLED
        trigger: "POST /invoices with invoice_type == COMPLETION (CONTINGENT engagements)"
        actor: FinanceOfficer
        preconditions:
          - "assignment.billing_status == UNBILLED"
          - "engagement.engagement_type == CONTINGENT"
          - "engagement.status == ACTIVE"
          - "EXISTS Placement with placement.assignment_id == assignment.id AND status == ACTIVE_GUARANTEE"
        side_effects:
          - "Create the single Invoice (status ISSUED) for the whole contingent fee."
          - "Recompute engagement.billed_gross_cents."
          - "Increment SearchAssignment.version by 1."
      - from: COMPLETION_BILLED
        to: SETTLED
        trigger: "system, on POST /invoices/{invoice_id}/pay for the COMPLETION invoice of this assignment"
        actor: system
        preconditions:
          - "assignment.billing_status == COMPLETION_BILLED"
          - "EVERY Invoice with invoice.assignment_id == assignment.id AND invoice_type IN {RETAINER, PROGRESS, COMPLETION} has status == PAID"
        side_effects:
          - "Increment SearchAssignment.version by 1."
      - from: COMPLETION_BILLED
        to: PROGRESS_BILLED
        trigger: "system, on POST /placements/{placement_id}/fall-off (cascade hop 2/3 — RETAINED)"
        actor: system
        preconditions:
          - "assignment.billing_status IN {COMPLETION_BILLED, SETTLED}"
          - "engagement.engagement_type == RETAINED"
        side_effects:
          - "Increment SearchAssignment.version by 1."
        note: "Same reversion applies from SETTLED; the completion tranche is re-billable after the replacement placement."
      - from: COMPLETION_BILLED
        to: UNBILLED
        trigger: "system, on POST /placements/{placement_id}/fall-off (cascade hop 2/3 — CONTINGENT)"
        actor: system
        preconditions:
          - "assignment.billing_status IN {COMPLETION_BILLED, SETTLED}"
          - "engagement.engagement_type == CONTINGENT"
        side_effects:
          - "Increment SearchAssignment.version by 1."

  - entity: PipelineEntry
    dimension: stage
    initial_state: SOURCED
    terminal_states: [PLACED, REJECTED, WITHDRAWN]
    transitions:
      - from: SOURCED
        to: SCREENED
        trigger: "POST /pipeline-entries/{pipeline_entry_id}/advance with to_stage == SCREENED"
        actor: Consultant
        preconditions:
          - "entry.stage == SOURCED"
          - "engagement.status == ACTIVE"
          - "X-User-ID == assignment.lead_consultant_id"
        side_effects:
          - "Increment PipelineEntry.version by 1."
      - from: SCREENED
        to: SHORTLISTED
        trigger: "POST /pipeline-entries/{pipeline_entry_id}/advance with to_stage == SHORTLISTED"
        actor: Consultant
        preconditions:
          - "entry.stage == SCREENED"
          - "engagement.status == ACTIVE"
          - "X-User-ID == assignment.lead_consultant_id"
          - "entry.preliminary_fit_score IS NOT NULL AND entry.preliminary_fit_score >= 6.00 (MIN_SHORTLIST_FIT)"
        side_effects:
          - "Increment PipelineEntry.version by 1."
      - from: SHORTLISTED
        to: CLIENT_INTERVIEW
        trigger: "POST /pipeline-entries/{pipeline_entry_id}/advance with to_stage == CLIENT_INTERVIEW"
        actor: Consultant
        preconditions:
          - "entry.stage == SHORTLISTED"
          - "engagement.status == ACTIVE"
          - "assignment.sourcing_status IN {SLATE_SUBMITTED, OFFER_OUT}"
          - "X-User-ID == assignment.lead_consultant_id"
        side_effects:
          - "Increment PipelineEntry.version by 1."
      - from: CLIENT_INTERVIEW
        to: SHORTLISTED
        trigger: "POST /pipeline-entries/{pipeline_entry_id}/advance with to_stage == SHORTLISTED (re-slate revert)"
        actor: Consultant
        preconditions:
          - "entry.stage == CLIENT_INTERVIEW"
          - "engagement.status == ACTIVE"
          - "X-User-ID == assignment.lead_consultant_id"
          - "entry.reslate_count < 2 (MAX_RESLATES)"
        side_effects:
          - "Increment entry.reslate_count by 1."
          - "Increment PipelineEntry.version by 1."
        note: "Cycle #1: SHORTLISTED <-> CLIENT_INTERVIEW, bounded by MAX_RESLATES = 2."
      - from: CLIENT_INTERVIEW
        to: OFFER_STAGE
        trigger: "system, on POST /offers"
        actor: system
        preconditions:
          - "entry.stage == CLIENT_INTERVIEW"
        side_effects:
          - "Increment PipelineEntry.version by 1."
      - from: OFFER_STAGE
        to: CLIENT_INTERVIEW
        trigger: "system, on POST /offers/{offer_id}/decline"
        actor: system
        preconditions:
          - "entry.stage == OFFER_STAGE"
        side_effects:
          - "Increment PipelineEntry.version by 1."
        note: "Cycle #2: CLIENT_INTERVIEW <-> OFFER_STAGE; a superseding Offer may then be created against the same entry."
      - from: OFFER_STAGE
        to: PLACED
        trigger: "system, on POST /offers/{offer_id}/accept (cascade hop 1)"
        actor: system
        preconditions:
          - "entry.stage == OFFER_STAGE"
        side_effects:
          - "CASCADE hop 2 (caused by hop 1): because this entry reached PLACED, a Placement row is created and assignment.open_positions_remaining is recomputed, moving assignment.sourcing_status OFFER_OUT -> FILLED (or back to SLATE_SUBMITTED when seats remain)."
          - "Increment PipelineEntry.version by 1."
      - from: SOURCED
        to: REJECTED
        trigger: "POST /pipeline-entries/{pipeline_entry_id}/advance with to_stage == REJECTED"
        actor: Consultant
        preconditions:
          - "entry.stage IN {SOURCED, SCREENED, SHORTLISTED, CLIENT_INTERVIEW}"
          - "engagement.status == ACTIVE"
          - "X-User-ID == assignment.lead_consultant_id"
        side_effects:
          - "Set entry.rejection_reason from the request body."
          - "Increment PipelineEntry.version by 1."
        note: "Applies from every stage in {SOURCED, SCREENED, SHORTLISTED, CLIENT_INTERVIEW}; listed once from SOURCED."
      - from: SOURCED
        to: WITHDRAWN
        trigger: "POST /pipeline-entries/{pipeline_entry_id}/advance with to_stage == WITHDRAWN"
        actor: Consultant
        preconditions:
          - "entry.stage IN {SOURCED, SCREENED, SHORTLISTED, CLIENT_INTERVIEW, OFFER_STAGE}"
          - "engagement.status == ACTIVE"
          - "X-User-ID == assignment.lead_consultant_id"
        side_effects:
          - "Set entry.rejection_reason from the request body."
          - "Increment PipelineEntry.version by 1."
        note: "Also reached as cascade hop 2 of engagement termination (actor: system, engagement.status precondition waived)."
      - from: CLIENT_INTERVIEW
        to: REJECTED
        trigger: "system, on POST /offers/{offer_id}/accept for a SIBLING entry (cascade hop 3)"
        actor: system
        preconditions:
          - "assignment.sourcing_status just became FILLED"
          - "entry.stage IN {SOURCED, SCREENED, SHORTLISTED, CLIENT_INTERVIEW}"
        side_effects:
          - "Set entry.rejection_reason = 'POSITION_FILLED'."
          - "Increment PipelineEntry.version by 1."
        note: "Processed in created_at ASC order across the assignment's remaining entries."

  - entity: Interview
    dimension: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "system, on the first POST /interviews/{interview_id}/assessments"
        actor: system
        preconditions:
          - "interview.status == SCHEDULED"
        side_effects:
          - "Recompute PipelineEntry.preliminary_fit_score and PipelineEntry.panel_final_fit_score for interview.pipeline_entry_id."
          - "Increment Interview.version by 1."
        note: "Further assessments on a COMPLETED interview are accepted (panel members submit independently) and re-trigger the fit-score recompute, but the status stays COMPLETED. Only SCHEDULED interviews occupy their interviewer / candidate for overlap purposes."

  - entity: Offer
    dimension: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED, DECLINED]
    transitions:
      - from: DRAFT
        to: EXTENDED
        trigger: "POST /offers/{offer_id}/extend"
        actor: ClientContact
        preconditions:
          - "offer.status == DRAFT"
          - "X-User-ID == engagement.client_company_id"
          - "engagement.status == ACTIVE"
        side_effects:
          - "Set offer.extended_at = logical clock now."
          - "Move assignment.sourcing_status SLATE_SUBMITTED -> OFFER_OUT."
          - "Increment Offer.version by 1."
      - from: EXTENDED
        to: DECLINED
        trigger: "POST /offers/{offer_id}/decline"
        actor: Consultant
        preconditions:
          - "offer.status == EXTENDED"
          - "engagement.status == ACTIVE"
          - "X-User-ID == assignment.lead_consultant_id"
        side_effects:
          - "Set offer.decided_at = now and offer.decline_reason from the body."
          - "Move PipelineEntry OFFER_STAGE -> CLIENT_INTERVIEW."
          - "Move assignment.sourcing_status OFFER_OUT -> SLATE_SUBMITTED."
          - "Increment Offer.version by 1."
      - from: EXTENDED
        to: ACCEPTED
        trigger: "POST /offers/{offer_id}/accept"
        actor: Consultant
        preconditions:
          - "offer.status == EXTENDED"
          - "engagement.status == ACTIVE"
          - "X-User-ID == assignment.lead_consultant_id"
          - "assignment.open_positions_remaining >= 1"
        side_effects:
          - "Set offer.decided_at = now."
          - "CASCADE hop 1: PipelineEntry OFFER_STAGE -> PLACED."
          - "CASCADE hop 2 (caused by hop 1): a Placement row is created (status ACTIVE_GUARANTEE, actual_first_year_comp_cents = offer.total_first_year_comp_cents, guarantee_end_at per calculations.guarantee_window); assignment.open_positions_remaining is recomputed and drops by 1; assignment.sourcing_status moves OFFER_OUT -> FILLED when it reaches 0."
          - "CASCADE hop 3 (caused by hop 2): because the assignment reached FILLED, every SIBLING PipelineEntry on the assignment with stage IN {SOURCED, SCREENED, SHORTLISTED, CLIENT_INTERVIEW} moves stage -> REJECTED with rejection_reason 'POSITION_FILLED' (created_at ASC)."
          - "CASCADE hop 4 (caused by hop 2): because a Placement now exists, an OffLimitsRecord{scope: PLACEMENT, candidate_id: placement.candidate_id, protected_company_id: engagement.client_company_id, placement_id, engagement_id, status: ACTIVE, off_limits_until: calculations.off_limits_window variant PLACEMENT} is minted, and engagement.placements_count is recomputed."
          - "Increment Offer.version by 1."
      - from: DRAFT
        to: DECLINED
        trigger: "system, on POST /engagements/{engagement_id}/terminate (cascade hop 3)"
        actor: system
        preconditions:
          - "offer.status IN {DRAFT, EXTENDED}"
          - "offer's PipelineEntry just moved to WITHDRAWN"
        side_effects:
          - "Set offer.decline_reason = 'ENGAGEMENT_TERMINATED', offer.decided_at = now."
          - "Increment Offer.version by 1."

  - entity: Placement
    dimension: status
    initial_state: ACTIVE_GUARANTEE
    terminal_states: [GUARANTEE_EXPIRED, FALLEN_OFF]
    transitions:
      - from: ACTIVE_GUARANTEE
        to: FALLEN_OFF
        trigger: "POST /placements/{placement_id}/fall-off"
        actor: Consultant
        preconditions:
          - "placement.status == ACTIVE_GUARANTEE"
          - "engagement.status == ACTIVE"
          - "X-User-ID == assignment.lead_consultant_id"
          - "logical clock now < placement.guarantee_end_at (strict; equality is already expired)"
        side_effects:
          - "Set placement.fell_off_at = now, placement.fall_off_reason from the body."
          - "CASCADE hop 1: the assignment's COMPLETION invoice (the Invoice with assignment_id == placement.assignment_id, invoice_type == COMPLETION, status IN {ISSUED, PAID}; if several exist, the one with the greatest created_at) moves status -> CREDITED."
          - "CASCADE hop 2 (caused by hop 1): because that COMPLETION invoice was credited, a CREDIT_NOTE Invoice is minted with credited_invoice_id = that invoice's id, gross_amount_cents / discount_cents / admin_fee_cents / net_payable_cents mirrored from it, status ISSUED; engagement.billed_gross_cents is recomputed (calculations.engagement_billed_ledger) and drops by exactly that gross."
          - "CASCADE hop 3 (caused by hop 2): because the completion tranche is no longer billed, assignment.billing_status reverts COMPLETION_BILLED/SETTLED -> PROGRESS_BILLED (RETAINED) or -> UNBILLED (CONTINGENT)."
          - "CASCADE hop 4 (caused by hop 3): because the assignment is re-billable, assignment.open_positions_remaining is recomputed (+1), engagement.placements_count is recomputed (-1), and the PLACEMENT-scope OffLimitsRecord for this placement moves status ACTIVE -> LIFTED. ONLY IF assignment.sourcing_status == FILLED at this point does it additionally move FILLED -> OPEN and increment assignment.replacement_count by 1; when the assignment still held spare seats (sourcing_status SLATE_SUBMITTED or OFFER_OUT) sourcing_status and replacement_count are left untouched."
          - "Increment Placement.version by 1."
        note: "If no COMPLETION invoice exists yet, hops 1-3 are skipped and hop 4 still runs."
      - from: ACTIVE_GUARANTEE
        to: GUARANTEE_EXPIRED
        trigger: "system, during POST /_ops/run-guarantee-sweep"
        actor: system
        preconditions:
          - "placement.status == ACTIVE_GUARANTEE"
          - "logical clock now >= placement.guarantee_end_at"
        side_effects:
          - "Increment Placement.version by 1."

  - entity: Invoice
    dimension: status
    initial_state: ISSUED
    terminal_states: [CREDITED]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{invoice_id}/pay"
        actor: FinanceOfficer
        preconditions:
          - "invoice.status == ISSUED"
        side_effects:
          - "Set invoice.paid_at = now."
          - "When invoice_type == COMPLETION and every RETAINER/PROGRESS/COMPLETION invoice of the assignment is PAID, move assignment.billing_status COMPLETION_BILLED -> SETTLED."
          - "Increment Invoice.version by 1."
      - from: ISSUED
        to: CREDITED
        trigger: "system, on POST /placements/{placement_id}/fall-off (cascade hop 1)"
        actor: system
        preconditions:
          - "invoice.invoice_type == COMPLETION"
          - "invoice.status IN {ISSUED, PAID}"
        side_effects:
          - "Mint the mirroring CREDIT_NOTE Invoice (cascade hop 2)."
          - "Increment Invoice.version by 1."
        note: "Same transition applies from PAID."

  - entity: OffLimitsRecord
    dimension: status
    initial_state: ACTIVE
    terminal_states: [LIFTED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "system, on POST /placements/{placement_id}/fall-off (PLACEMENT scope) or POST /engagements/{engagement_id}/terminate (CLIENT_PROTECTION scope)"
        actor: system
        preconditions:
          - "record.status == ACTIVE"
        side_effects:
          - "Increment OffLimitsRecord.version by 1."
      - from: ACTIVE
        to: EXPIRED
        trigger: "system, during POST /_ops/run-guarantee-sweep"
        actor: system
        preconditions:
          - "record.status == ACTIVE"
          - "logical clock now >= record.off_limits_until"
        side_effects:
          - "Increment OffLimitsRecord.version by 1."

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version`)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: slate-submit-stale-assignment
    parent_entity: SearchAssignment
    write_endpoint: "POST /search-assignments/{assignment_id}/submit-slate"
    occ_field: "expected_assignment_version"
    description: |
      Submitting a slate against a SearchAssignment whose version has advanced since
      the client last observed it is rejected with a stale-version error. A slate
      submission legitimately supersedes the previous slate composition (entries may
      have been added, rejected, or re-slated in between), so the request would
      otherwise succeed on its own merits; OCC on the assignment's version is what
      makes the stale view detectable.
    error_id: ERR_STALE_ASSIGNMENT_VERSION
    http_status: 412

  - rule_id: offer-create-stale-pipeline-entry
    parent_entity: PipelineEntry
    write_endpoint: "POST /offers"
    occ_field: "expected_pipeline_entry_version"
    description: |
      Creating an Offer against a PipelineEntry whose version has advanced since the
      client last observed it is rejected with a stale-version error. A new Offer
      legitimately supersedes a previously declined one on the same entry (the entry
      cycles OFFER_STAGE -> CLIENT_INTERVIEW and is offer-eligible again), so the
      create is a valid product operation; OCC on the entry's version is what detects
      that the writer's view of the entry predates the previous offer round.
    error_id: ERR_STALE_PIPELINE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: engagement_fee_base
    trigger: "On POST /invoices, before invoice_tranche_allocation runs."
    algorithm: threshold
    formula: |
      # RETAINED variant — PROVISIONAL basis (used for RETAINER and PROGRESS tranches)
      comp_basis_provisional = assignment.target_first_year_comp_cents
      rate_provisional = premium_fee_pct if comp_basis_provisional >= tier_threshold_cents else base_fee_pct
      provisional_total_fee_cents = round_half_up(comp_basis_provisional * rate_provisional)

      # RETAINED variant — FINAL basis (used for the COMPLETION reconciliation)
      comp_basis_final = placement.actual_first_year_comp_cents      # the assignment's
                                                                     # ACTIVE_GUARANTEE Placement
      rate_final = premium_fee_pct if comp_basis_final >= tier_threshold_cents else base_fee_pct
      final_total_fee_cents = round_half_up(comp_basis_final * rate_final)

      # CONTINGENT variant — one basis, one rate, no tiering
      contingent_total_fee_cents = round_half_up(
          placement.actual_first_year_comp_cents * contingent_fee_pct)
    input_set: |
      Rates come from the Engagement's FeeSchedule. The RETAINED provisional basis is
      SearchAssignment.target_first_year_comp_cents (known at assignment creation). Both the
      RETAINED final basis and the CONTINGENT basis are Placement.actual_first_year_comp_cents
      of the single Placement on the assignment with status == ACTIVE_GUARANTEE (a COMPLETION
      invoice is rejected with ERR_PLACEMENT_REQUIRED when no such Placement exists; when the
      assignment carries several, the one with the greatest created_at is used).
    constants:
      ROUNDING: round_half_up
    precision: "integer cents, round_half_up"
    variants:
      - name: RETAINED
        when: "engagement.engagement_type == RETAINED"
        difference: "Three tranches. RETAINER and PROGRESS are struck off the PROVISIONAL fee (target comp, tiered); COMPLETION is the residual against the FINAL fee (actual comp, re-tiered). The tier can flip between provisional and final, so the same placement yields a different total fee than the contingent reading."
      - name: CONTINGENT
        when: "engagement.engagement_type == CONTINGENT"
        difference: "One COMPLETION invoice for contingent_fee_pct * actual comp. No tiering, no retainer, no progress tranche — identical placement data therefore produces a different total fee (and a different invoice count) than the RETAINED reading."

  - name: candidate_fit_score
    trigger: "On POST /interviews/{interview_id}/assessments — both variants are recomputed for the interview's PipelineEntry."
    algorithm: weighted_scoring
    formula: |
      # per-assessment composite (always rounded to 2dp when persisted)
      composite(a) = round_half_up((a.leadership_score + a.functional_score + a.culture_score) / 3, 2)

      # weight
      weight(a) = 1.0                                   if a.assessment_kind == SCREEN
                = 2.0  if a.assessment_kind == PANEL and a.assessor_role == CONSULTANT
                = 3.0  if a.assessment_kind == PANEL and a.assessor_role == CLIENT

      # --- variant PRELIMINARY -------------------------------------------------
      S = [a for a in assessments_of(entry) if a.assessment_kind == SCREEN]
      preliminary_fit_score = NULL if len(S) == 0 else
          round_half_up( sum( (a.leadership_score + a.functional_score + a.culture_score) / 3
                              for a in S ) / len(S), 2 )
          # ROUNDING ORDER (pinned): aggregate the UNROUNDED per-assessment means,
          # divide, and round exactly ONCE at the end.

      # --- variant PANEL_FINAL -------------------------------------------------
      A = assessments_of(entry)                          # SCREEN *and* PANEL
      raw = NULL if len(A) == 0 else
          round_half_up( sum(composite(a) * weight(a) for a in A)
                         / sum(weight(a) for a in A), 2 )
          # ROUNDING ORDER (pinned): round EACH composite to 2dp FIRST, then weight,
          # sum, divide, and round once more.
      panel_final_fit_score = raw if raw is NULL else (
          min(raw, COMPETENCY_FLOOR_CAP)
              if min(a.functional_score for a in A) < COMPETENCY_FLOOR
          else raw )
    input_set: |
      assessments_of(entry) = every Assessment whose interview_id belongs to an Interview with
      interview.pipeline_entry_id == entry.id, in ANY interview status (SCHEDULED or COMPLETED).
      No status filter on assessments — they are append-only and never retracted.
    constants:
      MIN_SHORTLIST_FIT: 6.00
      COMPETENCY_FLOOR: 5
      COMPETENCY_FLOOR_CAP: 5.00
      SCREEN_WEIGHT: 1.0
      PANEL_CONSULTANT_WEIGHT: 2.0
      PANEL_CLIENT_WEIGHT: 3.0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PRELIMINARY
        when: "Gate for the SCREENED -> SHORTLISTED advance (must be >= MIN_SHORTLIST_FIT = 6.00)."
        difference: "SCREEN assessments only; unweighted mean; rounded exactly once at the end; no competency-floor cap."
      - name: PANEL_FINAL
        when: "Gate for POST /offers (must be >= engagement.min_offer_fit_score)."
        difference: "All assessments; weighted by assessor_weight; each composite rounded BEFORE weighting; capped at 5.00 whenever any assessment carries functional_score < 5. The same assessment set therefore produces a different number under the two variants."

  - name: invoice_tranche_allocation
    trigger: "On POST /invoices, immediately after engagement_fee_base; writes Invoice.gross_amount_cents."
    algorithm: waterfall_allocation
    formula: |
      # ROUNDING ORDER (pinned): round EACH tranche off the provisional fee first;
      # the COMPLETION tranche is the RESIDUAL in cents and absorbs all rounding drift.
      # (The forbidden alternative — summing the percentage products and rounding once —
      #  would put the drift in the retainer instead.)
      if engagement.engagement_type == RETAINED:
          retainer_gross   = round_half_up(provisional_total_fee_cents * retainer_pct)
          progress_gross   = round_half_up(provisional_total_fee_cents * progress_pct)
          completion_gross = final_total_fee_cents - retainer_gross - progress_gross
          gross_amount_cents = { RETAINER:   retainer_gross,
                                 PROGRESS:   progress_gross,
                                 COMPLETION: completion_gross }[invoice_type]
      else:  # CONTINGENT
          gross_amount_cents = contingent_total_fee_cents        # invoice_type is COMPLETION
    input_set: |
      retainer_pct / progress_pct from the Engagement's FeeSchedule; provisional_total_fee_cents and
      final_total_fee_cents from calculations.engagement_fee_base. RETAINER and PROGRESS never read a
      Placement; COMPLETION always does.
    constants:
      ROUNDING: round_half_up
    precision: "integer cents"

  - name: invoice_net_payable
    trigger: "On POST /invoices, immediately after invoice_tranche_allocation; writes Invoice.discount_cents, admin_fee_cents, net_payable_cents."
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED (the dependency looks circular otherwise: the admin fee
      # feeds the invoice total, and the discount tier is keyed on billed volume — so the
      # tier is deliberately keyed on the LEDGER BEFORE THIS INVOICE, never on this
      # invoice's own total).
      # 1. gross  := Invoice.gross_amount_cents (from invoice_tranche_allocation)
      # 2. prior  := engagement.billed_gross_cents as it stands BEFORE this invoice is
      #              inserted (engagement_billed_ledger over the already-persisted rows)
      # 3. discount_pct := DISCOUNT_TIER_2_PCT if prior >= DISCOUNT_TIER_2_MIN_CENTS
      #                    else DISCOUNT_TIER_1_PCT if prior >= DISCOUNT_TIER_1_MIN_CENTS
      #                    else 0.00
      # 4. discount_cents  := round_half_up(gross * discount_pct)
      # 5. discounted      := gross - discount_cents
      # 6. admin_fee_cents := round_half_up(discounted * fee_schedule.admin_fee_pct)
      #                       # admin fee is charged on the POST-discount base
      # 7. net_payable_cents := discounted + admin_fee_cents
      #
      # CREDIT_NOTE rows bypass steps 2-7 entirely: they mirror the credited invoice's
      # discount_cents, admin_fee_cents and net_payable_cents verbatim, so the reversal
      # is exact to the cent.
    input_set: |
      `prior` is the engagement's billed ledger over Invoices that already exist (see
      calculations.engagement_billed_ledger for its status/type filter). The invoice being
      created is excluded by construction.
    constants:
      DISCOUNT_TIER_1_MIN_CENTS: 5000000
      DISCOUNT_TIER_1_PCT: 0.03
      DISCOUNT_TIER_2_MIN_CENTS: 15000000
      DISCOUNT_TIER_2_PCT: 0.05
      ROUNDING: round_half_up
    precision: "integer cents, round_half_up"

  - name: engagement_billed_ledger
    trigger: "On POST /invoices (after the row is inserted) and on the CREDIT_NOTE minted by the fall-off cascade; writes Engagement.billed_gross_cents."
    algorithm: aggregation
    formula: |
      billed_gross_cents =
          SUM(i.gross_amount_cents for i in Invoice
              where i.engagement_id == engagement.id
                and i.invoice_type IN {RETAINER, PROGRESS, COMPLETION}
                and i.status IN {ISSUED, PAID, CREDITED})
        - SUM(i.gross_amount_cents for i in Invoice
              where i.engagement_id == engagement.id
                and i.invoice_type == CREDIT_NOTE
                and i.status IN {ISSUED, PAID})
    input_set: |
      Source entity: Invoice, filtered by engagement_id. Positive leg: invoice_type IN
      {RETAINER, PROGRESS, COMPLETION} with status IN {ISSUED, PAID, CREDITED} (a credited
      invoice keeps its positive leg; the CREDIT_NOTE cancels it, so the pair nets to zero).
      Negative leg: invoice_type == CREDIT_NOTE with status IN {ISSUED, PAID}. No time window
      (all rows since engagement creation). Order-insensitive (pure sum), so no tie-break needed.
    precision: "integer cents"

  - name: assignment_position_ledger
    trigger: "On offer acceptance (Placement created) and on placement fall-off; writes SearchAssignment.open_positions_remaining and Engagement.placements_count."
    algorithm: aggregation
    formula: |
      open_positions_remaining =
          assignment.positions_total
          - COUNT(p in Placement
                  where p.assignment_id == assignment.id
                    and p.status IN {ACTIVE_GUARANTEE, GUARANTEE_EXPIRED})

      engagement.placements_count =
          COUNT(p in Placement
                where p.assignment_id IN (assignments of this engagement)
                  and p.status IN {ACTIVE_GUARANTEE, GUARANTEE_EXPIRED})
    input_set: |
      Source entity: Placement, filtered by assignment_id (resp. by the engagement's assignments),
      status filter {ACTIVE_GUARANTEE, GUARANTEE_EXPIRED} — a FALLEN_OFF placement no longer
      consumes a seat. No time window. Order-insensitive (pure count).
    precision: "integer"

  - name: guarantee_window
    trigger: "On POST /offers/{offer_id}/accept, when the Placement row is created; writes Placement.guarantee_end_at."
    algorithm: interval_merge
    formula: |
      placement.start_date_at  = offer.start_date_at
      placement.guarantee_end_at = offer.start_date_at + engagement.guarantee_days days
      # Fall-off eligibility (POST /placements/{id}/fall-off):
      #     allowed  iff  clock_now  <  placement.guarantee_end_at     (STRICT)
      #     rejected iff  clock_now >=  placement.guarantee_end_at  -> ERR_GUARANTEE_EXPIRED
      # The sweep uses the mirror-image comparison:
      #     ACTIVE_GUARANTEE -> GUARANTEE_EXPIRED  iff  clock_now >= placement.guarantee_end_at
    input_set: "engagement.guarantee_days (frozen from the FeeSchedule at engagement creation)."
    precision: "whole days added to an ISO-8601 UTC instant"

  - name: off_limits_window
    trigger: "On POST /engagements/{engagement_id}/activate (CLIENT_PROTECTION) and on POST /offers/{offer_id}/accept (PLACEMENT); writes OffLimitsRecord.off_limits_until."
    algorithm: decay_function
    formula: |
      CLIENT_PROTECTION: off_limits_until = engagement.activated_at + fee_schedule.client_protection_days days
      PLACEMENT:         off_limits_until = placement.start_date_at + fee_schedule.off_limits_days days

      # Screening on POST /pipeline-entries (evaluated in this order):
      #   ERR_OFF_LIMITS_COMPANY  iff EXISTS r in OffLimitsRecord
      #        with r.status == ACTIVE and r.scope == CLIENT_PROTECTION
      #         and r.protected_company_id == candidate.current_employer_company_id
      #         and clock_now < r.off_limits_until
      #   ERR_OFF_LIMITS_CANDIDATE iff EXISTS r in OffLimitsRecord
      #        with r.status == ACTIVE and r.scope == PLACEMENT
      #         and r.candidate_id == candidate.id
      #         and clock_now < r.off_limits_until
      # Screening on POST /target-companies:
      #   ERR_CLIENT_CONFLICT     iff EXISTS r in OffLimitsRecord
      #        with r.status == ACTIVE and r.scope == CLIENT_PROTECTION
      #         and r.protected_company_id == body.company_id
      #         and clock_now < r.off_limits_until
    input_set: "OffLimitsRecord rows with status == ACTIVE only; LIFTED and EXPIRED rows never block."
    precision: "whole days added to an ISO-8601 UTC instant"

  - name: interview_slot_conflict
    trigger: "On POST /interviews, before the Interview row is created."
    algorithm: interval_merge
    formula: |
      # RULE A — interviewer occupancy: HALF-OPEN intervals [start_at, end_at), NO buffer.
      #   Candidate set: Interview rows with status == SCHEDULED and
      #                  interviewer_consultant_id == body.interviewer_consultant_id.
      #   Conflict iff  body.start_at < ex.end_at  AND  ex.start_at < body.end_at
      #   => back-to-back slots (body.start_at == ex.end_at) are ALLOWED.
      #   Error: ERR_INTERVIEWER_DOUBLE_BOOKED

      # RULE B — candidate occupancy: CLOSED intervals inflated by a symmetric
      #          CANDIDATE_BUFFER_MINUTES travel buffer on BOTH sides.
      #   Candidate set: Interview rows with status == SCHEDULED whose pipeline_entry's
      #                  candidate_id == (body.pipeline_entry's candidate_id) — across ALL
      #                  assignments and ALL pipeline entries for that candidate.
      #   Conflict iff  body.start_at < ex.end_at   + BUFFER
      #            AND  ex.start_at   < body.end_at + BUFFER
      #   => back-to-back slots are REJECTED; a gap of exactly BUFFER minutes is ALLOWED
      #      (the comparison is strict `<`).
      #   Error: ERR_CANDIDATE_BUFFER_CONFLICT
      #
      # Rule A is evaluated before Rule B (validations priority 23 then 24).
    input_set: "Only Interview rows with status == SCHEDULED occupy a slot; COMPLETED interviews are ignored by both rules."
    constants:
      CANDIDATE_BUFFER_MINUTES: 30
    precision: "minute-resolution ISO-8601 UTC instants"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is a declared role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's §1.5 roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request body shape: required fields present, enum members valid, integers non-negative and within their declared constraints, end_at > start_at, scores within 0..10."
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 4
    category: existence
    check: "Every path-templated resource exists, validated left-to-right."
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row (company_id, fee_schedule_id, engagement_id, assignment_id, candidate_id, pipeline_entry_id, interviewer_consultant_id)."
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /engagements, POST /search-assignments, POST /target-companies, POST /candidates, POST /pipeline-entries, POST /interviews, POST /offers, POST /invoices"

  - priority: 6
    category: auth
    check: "Ownership. Partner: X-User-ID == engagement.lead_partner_consultant_id. Consultant: X-User-ID == assignment.lead_consultant_id of the assignment the resource hangs off (for POST /interviews/{id}/assessments: X-User-ID == interview.interviewer_consultant_id). ClientContact: X-User-ID == engagement.client_company_id."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /engagements/{engagement_id}/activate, POST /engagements/{engagement_id}/terminate, POST /search-assignments/{assignment_id}/submit-slate, POST /target-companies, POST /pipeline-entries, POST /pipeline-entries/{pipeline_entry_id}/advance, POST /interviews, POST /interviews/{interview_id}/assessments, POST /offers, POST /offers/{offer_id}/extend, POST /offers/{offer_id}/accept, POST /offers/{offer_id}/decline, POST /placements/{placement_id}/fall-off"

  - priority: 7
    category: state
    check: "OCC: expected_assignment_version == assignment.version (submit-slate); expected_pipeline_entry_version == pipeline_entry.version (POST /offers)."
    error_id: "ERR_STALE_ASSIGNMENT_VERSION | ERR_STALE_PIPELINE_VERSION"
    http_status: 412
    applies_to: "POST /search-assignments/{assignment_id}/submit-slate, POST /offers"

  - priority: 8
    category: state
    check: "The target resource itself is in a state that permits this transition (offer.status, placement.status, invoice.status, pipeline_entry.stage, engagement.status when the engagement IS the target)."
    error_id: "ERR_INVALID_STATE | ERR_INVOICE_ALREADY_PAID"
    http_status: 409
    applies_to: "all POST action endpoints"

  - priority: 9
    category: state
    check: "Cross-entity: the governing Engagement is ACTIVE."
    error_id: ERR_ENGAGEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /search-assignments, POST /search-assignments/{assignment_id}/submit-slate, POST /target-companies, POST /pipeline-entries, POST /pipeline-entries/{pipeline_entry_id}/advance, POST /interviews, POST /offers, POST /offers/{offer_id}/extend, POST /offers/{offer_id}/accept, POST /offers/{offer_id}/decline, POST /placements/{placement_id}/fall-off, POST /invoices"

  - priority: 10
    category: state
    check: "Cross-entity: the governing SearchAssignment's sourcing_status permits the operation (pipeline-entry create requires OPEN; SHORTLISTED->CLIENT_INTERVIEW requires SLATE_SUBMITTED or OFFER_OUT; POST /offers requires SLATE_SUBMITTED; PROGRESS invoice requires SLATE_SUBMITTED/OFFER_OUT/FILLED)."
    error_id: ERR_ASSIGNMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /pipeline-entries, POST /pipeline-entries/{pipeline_entry_id}/advance, POST /offers, POST /invoices"

  - priority: 11
    category: business_constraint
    check: "invoice_type is compatible with engagement.engagement_type: RETAINER and PROGRESS are RETAINED-only; CREDIT_NOTE can never be requested through the API."
    error_id: ERR_ENGAGEMENT_TYPE_MISMATCH
    http_status: 409
    applies_to: "POST /invoices"

  - priority: 12
    category: business_safety
    check: "Segregation of duties: the Partner creating an Offer must not be the consultant who sourced the pipeline entry (X-User-ID != pipeline_entry.sourced_by_consultant_id)."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /offers"

  - priority: 13
    category: business_safety
    check: "Off-limits company: the candidate's current employer carries an ACTIVE, unexpired CLIENT_PROTECTION OffLimitsRecord."
    error_id: ERR_OFF_LIMITS_COMPANY
    http_status: 409
    applies_to: "POST /pipeline-entries"

  - priority: 14
    category: business_safety
    check: "Off-limits candidate: the candidate carries an ACTIVE, unexpired PLACEMENT OffLimitsRecord."
    error_id: ERR_OFF_LIMITS_CANDIDATE
    http_status: 409
    applies_to: "POST /pipeline-entries"

  - priority: 15
    category: business_safety
    check: "Client conflict: the company being added to a target list carries an ACTIVE, unexpired CLIENT_PROTECTION OffLimitsRecord."
    error_id: ERR_CLIENT_CONFLICT
    http_status: 409
    applies_to: "POST /target-companies"

  - priority: 16
    category: business_referential
    check: "The candidate's current_employer_company_id appears on the assignment's target list (a TargetCompany row with assignment_id == body.assignment_id and company_id == candidate.current_employer_company_id)."
    error_id: ERR_NOT_ON_TARGET_LIST
    http_status: 409
    applies_to: "POST /pipeline-entries"

  - priority: 17
    category: business_constraint
    check: "No existing PipelineEntry for the same (assignment_id, candidate_id) with stage NOT IN {REJECTED, WITHDRAWN}."
    error_id: ERR_DUPLICATE_PIPELINE_ENTRY
    http_status: 409
    applies_to: "POST /pipeline-entries"

  - priority: 18
    category: business_constraint
    check: "No existing TargetCompany row for the same (assignment_id, company_id)."
    error_id: ERR_DUPLICATE_TARGET_COMPANY
    http_status: 409
    applies_to: "POST /target-companies"

  - priority: 19
    category: business_constraint
    check: "Slate is non-empty: COUNT(PipelineEntry where assignment_id == assignment.id AND stage == SHORTLISTED) >= 1."
    error_id: ERR_EMPTY_SLATE
    http_status: 409
    applies_to: "POST /search-assignments/{assignment_id}/submit-slate"

  - priority: 20
    category: business_constraint
    check: "Fit floor. Advance to SHORTLISTED requires preliminary_fit_score >= 6.00 (MIN_SHORTLIST_FIT). POST /offers requires panel_final_fit_score >= engagement.min_offer_fit_score. A NULL score fails."
    error_id: ERR_FIT_SCORE_BELOW_FLOOR
    http_status: 409
    applies_to: "POST /pipeline-entries/{pipeline_entry_id}/advance, POST /offers"

  - priority: 21
    category: business_constraint
    check: "Re-slate budget: advancing CLIENT_INTERVIEW -> SHORTLISTED requires reslate_count < 2 (MAX_RESLATES)."
    error_id: ERR_RESLATE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /pipeline-entries/{pipeline_entry_id}/advance"

  - priority: 22
    category: business_temporal
    check: "start_at >= logical clock now."
    error_id: ERR_INTERVIEW_IN_PAST
    http_status: 422
    applies_to: "POST /interviews"

  - priority: 23
    category: business_temporal
    check: "Interviewer occupancy — half-open overlap, no buffer (calculations.interview_slot_conflict Rule A)."
    error_id: ERR_INTERVIEWER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /interviews"

  - priority: 24
    category: business_temporal
    check: "Candidate occupancy — closed intervals inflated by a 30-minute symmetric buffer (calculations.interview_slot_conflict Rule B)."
    error_id: ERR_CANDIDATE_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /interviews"

  - priority: 25
    category: business_temporal
    check: "Guarantee window: logical clock now < placement.guarantee_end_at (strict)."
    error_id: ERR_GUARANTEE_EXPIRED
    http_status: 409
    applies_to: "POST /placements/{placement_id}/fall-off"

  - priority: 26
    category: business_referential
    check: "A COMPLETION invoice requires an ACTIVE_GUARANTEE Placement on the assignment (there is otherwise no actual comp basis)."
    error_id: ERR_PLACEMENT_REQUIRED
    http_status: 409
    applies_to: "POST /invoices"

  - priority: 27
    category: business_referential
    check: "Tranche sequence on assignment.billing_status: RETAINER requires UNBILLED; PROGRESS requires RETAINER_BILLED; COMPLETION requires PROGRESS_BILLED (RETAINED) or UNBILLED (CONTINGENT)."
    error_id: ERR_TRANCHE_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /invoices"

  - priority: 28
    category: business_fiscal
    check: "Fee cap: engagement.billed_gross_cents + this invoice's gross_amount_cents <= engagement.fee_cap_cents."
    error_id: ERR_FEE_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /invoices"

  - priority: 29
    category: business_fiscal
    check: "Seat budget: assignment.open_positions_remaining >= 1 before an acceptance consumes a seat."
    error_id: ERR_NO_POSITIONS_REMAINING
    http_status: 409
    applies_to: "POST /offers/{offer_id}/accept"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:

  - method: POST
    path: "/consultants"
    description: "Register a consultant (the identity behind the Partner and Consultant roles)."
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, seniority, active?]
    output: Consultant
    side_effects: []

  - method: POST
    path: "/companies"
    description: "Register a company (client, sourcing target, or candidate employer)."
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, industry]
    output: Company
    side_effects: ["Sets is_client = false."]

  - method: GET
    path: "/companies/{company_id}"
    description: "Read a company, including the cross-entity derived is_client flag."
    roles: [PlatformAdmin, Partner, Consultant, ClientContact, FinanceOfficer]
    code: 200
    input: []
    output: Company
    side_effects: []

  - method: POST
    path: "/fee-schedules"
    description: "Create a fee schedule pinning all rates, tranche shares, guarantee and off-limits periods."
    roles: [PlatformAdmin]
    code: 201
    input: [name, engagement_type, base_fee_pct, premium_fee_pct, tier_threshold_cents, contingent_fee_pct, retainer_pct, progress_pct, admin_fee_pct, guarantee_days, off_limits_days, client_protection_days]
    output: FeeSchedule
    side_effects: ["Computes completion_pct = 1 - retainer_pct - progress_pct."]

  - method: POST
    path: "/engagements"
    description: "Open a DRAFT engagement with a client. lead_partner_consultant_id is taken from X-User-ID."
    roles: [Partner]
    code: 201
    input: [client_company_id, fee_schedule_id, fee_cap_cents, min_offer_fit_score?]
    output: Engagement
    side_effects: ["Copies engagement_type and guarantee_days from the fee schedule.", "Sets status = DRAFT, billed_gross_cents = 0, placements_count = 0."]

  - method: GET
    path: "/engagements/{engagement_id}"
    description: "Read an engagement."
    roles: [PlatformAdmin, Partner, Consultant, ClientContact, FinanceOfficer]
    code: 200
    input: []
    output: Engagement
    side_effects: []

  - method: GET
    path: "/engagements"
    description: "List engagements; filterable by client company, fee schedule, lead partner and status."
    roles: [PlatformAdmin, Partner, Consultant, ClientContact, FinanceOfficer]
    code: 200
    input: [client_company_id?, fee_schedule_id?, lead_partner_consultant_id?, status?, limit?, offset?]
    output: Engagement[]
    side_effects: []

  - method: POST
    path: "/engagements/{engagement_id}/activate"
    description: "Activate a DRAFT engagement. Mints the CLIENT_PROTECTION off-limits record for the client company."
    roles: [Partner]
    code: 200
    input: []
    output: Engagement
    side_effects: ["Engagement DRAFT -> ACTIVE.", "Mints an OffLimitsRecord (scope CLIENT_PROTECTION).", "Recomputes Company.is_client.", "Increments Engagement.version by 1."]

  - method: POST
    path: "/engagements/{engagement_id}/terminate"
    description: "Terminate an ACTIVE engagement, cascading through assignments -> pipeline entries -> offers."
    roles: [Partner]
    code: 200
    input: [reason]
    output: Engagement
    side_effects: ["Engagement ACTIVE -> TERMINATED.", "Cascade hop 1: assignments -> CLOSED.", "Cascade hop 2: their non-terminal pipeline entries -> WITHDRAWN.", "Cascade hop 3: those entries' DRAFT/EXTENDED offers -> DECLINED.", "CLIENT_PROTECTION off-limits records -> LIFTED.", "Recomputes Company.is_client.", "Increments Engagement.version by 1."]

  - method: POST
    path: "/search-assignments"
    description: "Open a search assignment under an ACTIVE engagement. lead_consultant_id is taken from X-User-ID."
    roles: [Consultant]
    code: 201
    input: [engagement_id, role_title, positions_total, target_first_year_comp_cents]
    output: SearchAssignment
    side_effects: ["Sets sourcing_status = OPEN, billing_status = UNBILLED, open_positions_remaining = positions_total, replacement_count = 0."]

  - method: GET
    path: "/search-assignments/{assignment_id}"
    description: "Read a search assignment (both state dimensions and the position ledger)."
    roles: [PlatformAdmin, Partner, Consultant, ClientContact, FinanceOfficer]
    code: 200
    input: []
    output: SearchAssignment
    side_effects: []

  - method: GET
    path: "/search-assignments"
    description: "List search assignments; filterable by engagement, lead consultant, and either state dimension."
    roles: [PlatformAdmin, Partner, Consultant, ClientContact, FinanceOfficer]
    code: 200
    input: [engagement_id?, lead_consultant_id?, sourcing_status?, billing_status?, limit?, offset?]
    output: SearchAssignment[]
    side_effects: []

  - method: POST
    path: "/search-assignments/{assignment_id}/submit-slate"
    description: "Submit the shortlisted slate to the client (OCC-guarded on the assignment's version)."
    roles: [Consultant]
    code: 200
    input: [expected_assignment_version]
    output: SearchAssignment
    side_effects: ["sourcing_status OPEN -> SLATE_SUBMITTED.", "Sets slate_submitted_at.", "Increments SearchAssignment.version by 1."]

  - method: POST
    path: "/target-companies"
    description: "Add a company to a search's approved target list. Rejected when the company is a protected client."
    roles: [Consultant]
    code: 201
    input: [assignment_id, company_id, rationale]
    output: TargetCompany
    side_effects: []

  - method: GET
    path: "/target-companies/{target_company_id}"
    description: "Read one target-list entry."
    roles: [PlatformAdmin, Partner, Consultant, ClientContact, FinanceOfficer]
    code: 200
    input: []
    output: TargetCompany
    side_effects: []

  - method: GET
    path: "/target-companies"
    description: "List target-list entries; filterable by assignment and company."
    roles: [PlatformAdmin, Partner, Consultant, ClientContact, FinanceOfficer]
    code: 200
    input: [assignment_id?, company_id?, limit?, offset?]
    output: TargetCompany[]
    side_effects: []

  - method: POST
    path: "/candidates"
    description: "Register a candidate and their current employer."
    roles: [Consultant]
    code: 201
    input: [full_name, current_employer_company_id, current_title, source_channel]
    output: Candidate
    side_effects: []

  - method: GET
    path: "/candidates/{candidate_id}"
    description: "Read a candidate."
    roles: [PlatformAdmin, Partner, Consultant, ClientContact, FinanceOfficer]
    code: 200
    input: []
    output: Candidate
    side_effects: []

  - method: GET
    path: "/candidates"
    description: "List candidates; filterable by current employer and source channel."
    roles: [PlatformAdmin, Partner, Consultant, ClientContact, FinanceOfficer]
    code: 200
    input: [current_employer_company_id?, source_channel?, limit?, offset?]
    output: Candidate[]
    side_effects: []

  - method: POST
    path: "/pipeline-entries"
    description: "Source a candidate into a search. Runs the full off-limits / conflict / target-list screen."
    roles: [Consultant]
    code: 201
    input: [assignment_id, candidate_id]
    output: PipelineEntry
    side_effects: ["Sets stage = SOURCED, sourced_by_consultant_id = X-User-ID, reslate_count = 0."]

  - method: GET
    path: "/pipeline-entries/{pipeline_entry_id}"
    description: "Read a pipeline entry, including both fit-score variants."
    roles: [PlatformAdmin, Partner, Consultant, ClientContact, FinanceOfficer]
    code: 200
    input: []
    output: PipelineEntry
    side_effects: []

  - method: GET
    path: "/pipeline-entries"
    description: "List pipeline entries; filterable by assignment, candidate, sourcing consultant and stage."
    roles: [PlatformAdmin, Partner, Consultant, ClientContact, FinanceOfficer]
    code: 200
    input: [assignment_id?, candidate_id?, sourced_by_consultant_id?, stage?, limit?, offset?]
    output: PipelineEntry[]
    side_effects: []

  - method: POST
    path: "/pipeline-entries/{pipeline_entry_id}/advance"
    description: "Move a pipeline entry to another stage (forward, re-slate revert, reject or withdraw)."
    roles: [Consultant]
    code: 200
    input: [to_stage, rejection_reason?]
    output: PipelineEntry
    side_effects: ["Applies the §1.2 PipelineEntry transition.", "Increments reslate_count on a CLIENT_INTERVIEW -> SHORTLISTED revert.", "Increments PipelineEntry.version by 1."]

  - method: POST
    path: "/interviews"
    description: "Schedule an interview slot. Enforces interviewer half-open occupancy and the candidate's buffered occupancy."
    roles: [Consultant]
    code: 201
    input: [pipeline_entry_id, interviewer_consultant_id, start_at, end_at, mode]
    output: Interview
    side_effects: ["Sets status = SCHEDULED."]

  - method: GET
    path: "/interviews/{interview_id}"
    description: "Read an interview."
    roles: [PlatformAdmin, Partner, Consultant, ClientContact, FinanceOfficer]
    code: 200
    input: []
    output: Interview
    side_effects: []

  - method: GET
    path: "/interviews"
    description: "List interviews; filterable by pipeline entry, interviewer and status."
    roles: [PlatformAdmin, Partner, Consultant, ClientContact, FinanceOfficer]
    code: 200
    input: [pipeline_entry_id?, interviewer_consultant_id?, status?, limit?, offset?]
    output: Interview[]
    side_effects: []

  - method: POST
    path: "/interviews/{interview_id}/assessments"
    description: "Submit a scorecard against an interview. assessor_role and assessor_weight are derived server-side."
    roles: [Consultant, ClientContact]
    code: 201
    input: [assessment_kind, leadership_score, functional_score, culture_score]
    output: Assessment
    side_effects: ["Interview SCHEDULED -> COMPLETED on the first assessment.", "Recomputes PipelineEntry.preliminary_fit_score and PipelineEntry.panel_final_fit_score."]

  - method: GET
    path: "/assessments/{assessment_id}"
    description: "Read one assessment scorecard."
    roles: [PlatformAdmin, Partner, Consultant, ClientContact, FinanceOfficer]
    code: 200
    input: []
    output: Assessment
    side_effects: []

  - method: GET
    path: "/assessments"
    description: "List assessments; filterable by interview and kind."
    roles: [PlatformAdmin, Partner, Consultant, ClientContact, FinanceOfficer]
    code: 200
    input: [interview_id?, assessment_kind?, limit?, offset?]
    output: Assessment[]
    side_effects: []

  - method: POST
    path: "/offers"
    description: "Draft an offer against a CLIENT_INTERVIEW pipeline entry (OCC-guarded on the entry's version; segregation-of-duties enforced)."
    roles: [Partner]
    code: 201
    input: [pipeline_entry_id, base_salary_cents, bonus_cents, start_date_at, expected_pipeline_entry_version]
    output: Offer
    side_effects: ["Sets status = DRAFT, approved_by_partner_id = X-User-ID, total_first_year_comp_cents = base + bonus.", "PipelineEntry CLIENT_INTERVIEW -> OFFER_STAGE.", "Increments PipelineEntry.version by 1."]

  - method: GET
    path: "/offers/{offer_id}"
    description: "Read an offer."
    roles: [PlatformAdmin, Partner, Consultant, ClientContact, FinanceOfficer]
    code: 200
    input: []
    output: Offer
    side_effects: []

  - method: GET
    path: "/offers"
    description: "List offers; filterable by pipeline entry, approving partner and status."
    roles: [PlatformAdmin, Partner, Consultant, ClientContact, FinanceOfficer]
    code: 200
    input: [pipeline_entry_id?, approved_by_partner_id?, status?, limit?, offset?]
    output: Offer[]
    side_effects: []

  - method: POST
    path: "/offers/{offer_id}/extend"
    description: "Client extends the drafted offer to the candidate."
    roles: [ClientContact]
    code: 200
    input: []
    output: Offer
    side_effects: ["Offer DRAFT -> EXTENDED.", "SearchAssignment sourcing_status SLATE_SUBMITTED -> OFFER_OUT.", "Increments Offer.version by 1."]

  - method: POST
    path: "/offers/{offer_id}/accept"
    description: "Record the candidate's acceptance. Drives the four-hop placement cascade."
    roles: [Consultant]
    code: 200
    input: []
    output: Offer
    side_effects: ["Offer EXTENDED -> ACCEPTED.", "Hop 1: PipelineEntry OFFER_STAGE -> PLACED.", "Hop 2: Placement created; assignment position ledger recomputed; sourcing_status -> FILLED (or back to SLATE_SUBMITTED).", "Hop 3: sibling pipeline entries -> REJECTED.", "Hop 4: PLACEMENT OffLimitsRecord minted; engagement.placements_count recomputed."]

  - method: POST
    path: "/offers/{offer_id}/decline"
    description: "Record the candidate's decline; the entry cycles back to CLIENT_INTERVIEW and the search back to SLATE_SUBMITTED."
    roles: [Consultant]
    code: 200
    input: [decline_reason]
    output: Offer
    side_effects: ["Offer EXTENDED -> DECLINED.", "PipelineEntry OFFER_STAGE -> CLIENT_INTERVIEW.", "SearchAssignment OFFER_OUT -> SLATE_SUBMITTED.", "Increments PipelineEntry.version and SearchAssignment.version by 1."]

  - method: GET
    path: "/placements/{placement_id}"
    description: "Read a placement and its guarantee window."
    roles: [PlatformAdmin, Partner, Consultant, ClientContact, FinanceOfficer]
    code: 200
    input: []
    output: Placement
    side_effects: []

  - method: GET
    path: "/placements"
    description: "List placements; filterable by assignment, candidate, offer and status. Placements are created only by the acceptance cascade, so this is their discovery channel."
    roles: [PlatformAdmin, Partner, Consultant, ClientContact, FinanceOfficer]
    code: 200
    input: [assignment_id?, candidate_id?, offer_id?, status?, limit?, offset?]
    output: Placement[]
    side_effects: []

  - method: POST
    path: "/placements/{placement_id}/fall-off"
    description: "Record a fall-off inside the guarantee window; runs the four-hop compensating cascade (credit note, billing revert, search reopen, off-limits lift)."
    roles: [Consultant]
    code: 200
    input: [fall_off_reason]
    output: Placement
    side_effects: ["Placement ACTIVE_GUARANTEE -> FALLEN_OFF.", "Hop 1: COMPLETION invoice -> CREDITED.", "Hop 2: mirroring CREDIT_NOTE minted; engagement.billed_gross_cents recomputed.", "Hop 3: assignment.billing_status reverts.", "Hop 4: sourcing_status FILLED -> OPEN, replacement_count +1, position ledger recomputed, PLACEMENT off-limits record -> LIFTED."]

  - method: POST
    path: "/invoices"
    description: "Issue a RETAINER, PROGRESS or COMPLETION invoice. Amounts are fully server-computed."
    roles: [FinanceOfficer]
    code: 201
    input: [engagement_id, assignment_id, invoice_type]
    output: Invoice
    side_effects: ["Runs engagement_fee_base -> invoice_tranche_allocation -> invoice_net_payable.", "Advances assignment.billing_status.", "Recomputes engagement.billed_gross_cents."]

  - method: GET
    path: "/invoices/{invoice_id}"
    description: "Read an invoice."
    roles: [PlatformAdmin, Partner, Consultant, ClientContact, FinanceOfficer]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/invoices"
    description: "List invoices; filterable by engagement, assignment, type, status and credited invoice (the CREDIT_NOTE minted by a fall-off is discoverable here)."
    roles: [PlatformAdmin, Partner, Consultant, ClientContact, FinanceOfficer]
    code: 200
    input: [engagement_id?, assignment_id?, invoice_type?, status?, credited_invoice_id?, limit?, offset?]
    output: Invoice[]
    side_effects: []

  - method: POST
    path: "/invoices/{invoice_id}/pay"
    description: "Mark an ISSUED invoice paid."
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Invoice
    side_effects: ["Invoice ISSUED -> PAID.", "SearchAssignment COMPLETION_BILLED -> SETTLED when all tranches are paid."]

  - method: GET
    path: "/off-limits-records/{off_limits_record_id}"
    description: "Read one off-limits record."
    roles: [PlatformAdmin, Partner, Consultant, ClientContact, FinanceOfficer]
    code: 200
    input: []
    output: OffLimitsRecord
    side_effects: []

  - method: GET
    path: "/off-limits-records"
    description: "List off-limits records; filterable by protected company, candidate, placement, engagement, scope and status. Records are minted only by cascades, so this is their discovery channel."
    roles: [PlatformAdmin, Partner, Consultant, ClientContact, FinanceOfficer]
    code: 200
    input: [protected_company_id?, candidate_id?, placement_id?, engagement_id?, scope?, status?, limit?, offset?]
    output: OffLimitsRecord[]
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. The clock's startup default is exactly 2026-05-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["Moves the logical clock. No entity is mutated."]

  - method: POST
    path: "/_ops/run-guarantee-sweep"
    description: "Ops-run checkpoint. Expires guarantee windows and off-limits records, closes fully-expired assignments, completes fully-billed engagements. Processing order is pinned: Placements (created_at ASC) -> OffLimitsRecords (created_at ASC) -> SearchAssignments (created_at ASC) -> Engagements (created_at ASC)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ expired_placement_ids: string[], expired_off_limits_record_ids: string[], closed_assignment_ids: string[], completed_engagement_ids: string[] }"
    side_effects: ["Placement ACTIVE_GUARANTEE -> GUARANTEE_EXPIRED when now >= guarantee_end_at.", "OffLimitsRecord ACTIVE -> EXPIRED when now >= off_limits_until.", "SearchAssignment FILLED -> CLOSED when all its placements are GUARANTEE_EXPIRED.", "Engagement ACTIVE -> COMPLETED when all assignments are CLOSED and all invoices are PAID/CREDITED."]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role / X-User-ID missing, or X-User-Role is not a declared role."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed for the endpoint."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, bad enum member, out-of-range score, non-positive amount, or end_at <= start_at."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity-backed role acted on a resource it does not own (wrong lead partner / lead consultant / client company / interviewer)."
  - id: ERR_CONSULTANT_NOT_FOUND
    http: 404
    condition: "interviewer_consultant_id does not resolve."
  - id: ERR_COMPANY_NOT_FOUND
    http: 404
    condition: "company_id / client_company_id / current_employer_company_id does not resolve."
  - id: ERR_FEE_SCHEDULE_NOT_FOUND
    http: 404
    condition: "fee_schedule_id does not resolve."
  - id: ERR_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "engagement_id (path or body) does not resolve."
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "assignment_id (path or body) does not resolve."
  - id: ERR_TARGET_COMPANY_NOT_FOUND
    http: 404
    condition: "target_company_id does not resolve."
  - id: ERR_CANDIDATE_NOT_FOUND
    http: 404
    condition: "candidate_id does not resolve."
  - id: ERR_PIPELINE_ENTRY_NOT_FOUND
    http: 404
    condition: "pipeline_entry_id (path or body) does not resolve."
  - id: ERR_INTERVIEW_NOT_FOUND
    http: 404
    condition: "interview_id does not resolve."
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "assessment_id does not resolve."
  - id: ERR_OFFER_NOT_FOUND
    http: 404
    condition: "offer_id does not resolve."
  - id: ERR_PLACEMENT_NOT_FOUND
    http: 404
    condition: "placement_id does not resolve."
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "invoice_id does not resolve."
  - id: ERR_OFF_LIMITS_RECORD_NOT_FOUND
    http: 404
    condition: "off_limits_record_id does not resolve."
  - id: ERR_STALE_ASSIGNMENT_VERSION
    http: 412
    condition: "expected_assignment_version != assignment.version on submit-slate."
  - id: ERR_STALE_PIPELINE_VERSION
    http: 412
    condition: "expected_pipeline_entry_version != pipeline_entry.version on POST /offers."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource's own state does not permit the requested transition (offer/placement/invoice/pipeline-entry/engagement)."
  - id: ERR_INVOICE_ALREADY_PAID
    http: 409
    condition: "POST /invoices/{id}/pay on an invoice whose status is PAID or CREDITED."
  - id: ERR_ENGAGEMENT_NOT_ACTIVE
    http: 409
    condition: "The governing Engagement is not ACTIVE."
  - id: ERR_ASSIGNMENT_STATE_INVALID
    http: 409
    condition: "The governing SearchAssignment's sourcing_status does not permit the operation."
  - id: ERR_ENGAGEMENT_TYPE_MISMATCH
    http: 409
    condition: "RETAINER/PROGRESS requested on a CONTINGENT engagement, or CREDIT_NOTE requested through POST /invoices."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The Partner creating the offer is the same consultant who sourced the pipeline entry."
  - id: ERR_OFF_LIMITS_COMPANY
    http: 409
    condition: "The candidate's current employer is a protected client (ACTIVE, unexpired CLIENT_PROTECTION record)."
  - id: ERR_OFF_LIMITS_CANDIDATE
    http: 409
    condition: "The candidate carries an ACTIVE, unexpired PLACEMENT off-limits record."
  - id: ERR_CLIENT_CONFLICT
    http: 409
    condition: "A protected client company was added to a search's target list."
  - id: ERR_NOT_ON_TARGET_LIST
    http: 409
    condition: "The candidate's current employer is not on the assignment's approved target list."
  - id: ERR_DUPLICATE_PIPELINE_ENTRY
    http: 409
    condition: "A non-terminal PipelineEntry already exists for this (assignment, candidate)."
  - id: ERR_DUPLICATE_TARGET_COMPANY
    http: 409
    condition: "The company is already on this assignment's target list."
  - id: ERR_EMPTY_SLATE
    http: 409
    condition: "submit-slate with zero SHORTLISTED pipeline entries on the assignment."
  - id: ERR_FIT_SCORE_BELOW_FLOOR
    http: 409
    condition: "preliminary_fit_score < 6.00 on the SHORTLISTED advance, or panel_final_fit_score < engagement.min_offer_fit_score on POST /offers (a NULL score also fails)."
  - id: ERR_RESLATE_LIMIT_EXCEEDED
    http: 409
    condition: "A third CLIENT_INTERVIEW -> SHORTLISTED revert was attempted (reslate_count already 2)."
  - id: ERR_INTERVIEW_IN_PAST
    http: 422
    condition: "Interview start_at is earlier than the logical clock."
  - id: ERR_INTERVIEWER_DOUBLE_BOOKED
    http: 409
    condition: "The interviewer already occupies an overlapping half-open [start, end) SCHEDULED slot."
  - id: ERR_CANDIDATE_BUFFER_CONFLICT
    http: 409
    condition: "The candidate's SCHEDULED interviews are not separated from the new slot by at least 30 minutes on both sides."
  - id: ERR_GUARANTEE_EXPIRED
    http: 409
    condition: "fall-off attempted when the logical clock is at or past placement.guarantee_end_at."
  - id: ERR_PLACEMENT_REQUIRED
    http: 409
    condition: "A COMPLETION invoice was requested for an assignment with no ACTIVE_GUARANTEE placement."
  - id: ERR_TRANCHE_OUT_OF_ORDER
    http: 409
    condition: "The requested tranche does not follow the assignment's billing_status sequence."
  - id: ERR_FEE_CAP_EXCEEDED
    http: 409
    condition: "engagement.billed_gross_cents + this invoice's gross would exceed engagement.fee_cap_cents."
  - id: ERR_NO_POSITIONS_REMAINING
    http: 409
    condition: "Offer acceptance attempted when assignment.open_positions_remaining == 0."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: PlatformAdmin
    description: "Back-office operator. Seeds reference data (consultants, companies, fee schedules) and drives the logical clock and the ops sweep. Never touches search execution or money."
    identity: opaque
    exclusive_operations:
      - "POST /consultants"
      - "POST /companies"
      - "POST /fee-schedules"
      - "POST /_clock/set_current_utc"
      - "POST /_ops/run-guarantee-sweep"
    shared_operations:
      - "All GET endpoints"

  - name: Partner
    description: "Senior consultant who owns the client relationship: opens, activates and terminates engagements and approves offers. Segregation of duties forbids approving an offer on a candidate they themselves sourced."
    identity: "entity_backed:Consultant"
    exclusive_operations:
      - "POST /engagements"
      - "POST /engagements/{engagement_id}/activate"
      - "POST /engagements/{engagement_id}/terminate"
      - "POST /offers"
    shared_operations:
      - "All GET endpoints"

  - name: Consultant
    description: "Executes the search: target list, candidate sourcing, pipeline stages, interview scheduling, slate submission, offer outcome recording and fall-off reporting. Backed by the same Consultant entity as Partner, which is what makes the segregation-of-duties check meaningful."
    identity: "entity_backed:Consultant"
    exclusive_operations:
      - "POST /search-assignments"
      - "POST /search-assignments/{assignment_id}/submit-slate"
      - "POST /target-companies"
      - "POST /candidates"
      - "POST /pipeline-entries"
      - "POST /pipeline-entries/{pipeline_entry_id}/advance"
      - "POST /interviews"
      - "POST /offers/{offer_id}/accept"
      - "POST /offers/{offer_id}/decline"
      - "POST /placements/{placement_id}/fall-off"
    shared_operations:
      - "POST /interviews/{interview_id}/assessments"
      - "All GET endpoints"

  - name: ClientContact
    description: "The client company acting on its own engagement: extends offers and submits client-side panel scorecards. X-User-ID is the Company id."
    identity: "entity_backed:Company"
    exclusive_operations:
      - "POST /offers/{offer_id}/extend"
    shared_operations:
      - "POST /interviews/{interview_id}/assessments"
      - "All GET endpoints"

  - name: FinanceOfficer
    description: "Billing operator. Issues and settles invoices; never influences the search itself."
    identity: opaque
    exclusive_operations:
      - "POST /invoices"
      - "POST /invoices/{invoice_id}/pay"
    shared_operations:
      - "All GET endpoints"
