# =============================================================================
# Task 1804: Hydraulic Cylinder & Fluid-Power Shop — seed tables
# =============================================================================

scenario: |
  1804. Hydraulic Cylinder & Fluid-Power Shop (fluid-power distributor shop): cylinder spec & seal-kit configuration, repair teardown quote & scrap decision, chrome rod & honing tube inventory, pressure test & certification, emergency repair turnaround tier, remanufactured exchange pool, contamination-control cleanliness class, field service & hose crimping

domain_name: hydraulic-cylinder-fluid-power
api_prefix: /fluid-power

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers: [optimistic_concurrency, cascading_side_effects, dual_variant_calculation, version_pinning_on_approval]
  entity_topology: flat
  state_machine_shape: branching   # WorkOrder forks to repair/scrap/exchange and contains cyclic rework + revision loops and a CERTIFIED->TEST_PENDING revert
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Shop
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Shop name" }
      - { name: labor_rate_cents_per_hour, type: integer, source: input, default: 14500, description: "Base shop labor rate" }
      - { name: expedite_multiplier, type: number, source: input, default: 1.35, description: "Labor multiplier for EXPEDITE tier" }
      - { name: emergency_multiplier, type: number, source: input, default: 1.75, description: "Labor multiplier for EMERGENCY tier" }
      - { name: expedite_cutoff_hours, type: integer, source: input, default: 48, description: "promised_hours <= this requires EXPEDITE or better" }
      - { name: emergency_cutoff_hours, type: integer, source: input, default: 24, description: "promised_hours <= this requires EMERGENCY" }
      - { name: honing_pass_fee_cents, type: integer, source: input, default: 4000, description: "Fee per honing pass" }
      - { name: cut_fee_cents, type: integer, source: input, default: 1500, description: "Flat fee per stock cut" }
      - { name: kerf_mm, type: integer, source: input, default: 3, description: "Saw kerf lost per cut" }
      - { name: min_remnant_mm, type: integer, source: input, default: 300, description: "Stock remainder below this is scrapped and charged to the job" }
      - { name: default_chrome_rod_cost_per_mm_cents, type: integer, source: input, default: 42, description: "Provisional-quote chrome rod estimate cost per mm" }
      - { name: default_honing_tube_cost_per_mm_cents, type: integer, source: input, default: 65, description: "Provisional-quote honing tube estimate cost per mm" }
      - { name: supplies_pct_of_labor, type: number, source: input, default: 0.04, description: "Shop supplies line = this fraction of the RAW (unrounded) labor line" }
      - { name: cleanliness_target_code4, type: integer, source: input, default: 18, description: "ISO 4406 target code at >4um" }
      - { name: cleanliness_target_code6, type: integer, source: input, default: 16, description: "ISO 4406 target code at >6um" }
      - { name: cleanliness_target_code14, type: integer, source: input, default: 13, description: "ISO 4406 target code at >14um" }
      - { name: quote_ttl_hours, type: integer, source: input, default: 168, description: "SENT quote lifetime in hours" }
      - { name: bay_buffer_minutes, type: integer, source: input, default: 30, description: "Mandatory gap between pressure-test bay bookings" }
      - { name: loyalty_silver_threshold_cents, type: integer, source: input, default: 100000, description: "ytd+subtotal >= this => SILVER" }
      - { name: loyalty_gold_threshold_cents, type: integer, source: input, default: 500000, description: "ytd+subtotal >= this => GOLD" }
      - { name: loyalty_silver_pct, type: number, source: input, default: 0.05, description: "SILVER discount on subtotal" }
      - { name: loyalty_gold_pct, type: number, source: input, default: 0.10, description: "GOLD discount on subtotal" }
      - { name: env_fee_pct, type: number, source: input, default: 0.02, description: "Environmental fee pct of discounted subtotal" }
      - { name: env_fee_min_cents, type: integer, source: input, default: 500, description: "Environmental fee floor" }
      - { name: callout_base_cents, type: integer, source: input, default: 25000, description: "Field service callout base" }
      - { name: emergency_callout_window_hours, type: integer, source: input, default: 4, description: "window_start - created_at <= this => emergency callout" }
      - { name: emergency_callout_multiplier, type: number, source: input, default: 2.0, description: "Callout multiplier for emergency callouts" }
      - { name: mileage_free_km, type: integer, source: input, default: 50, description: "Free travel km per field job" }
      - { name: mileage_rate_cents_per_km, type: integer, source: input, default: 250, description: "Per-km rate beyond free km" }
      - { name: crimp_fee_cents, type: integer, source: input, default: 4500, description: "Per hose assembly crimp fee" }
      - { name: crimp_tolerance_mm, type: number, source: input, default: 0.3, description: "Allowed |measured - spec| crimp diameter deviation (inclusive)" }
      - { name: hose_price_wire_braid_2sn_cents_per_m, type: integer, source: input, default: 3200, description: "WIRE_BRAID_2SN hose price per meter" }
      - { name: hose_price_spiral_4sh_cents_per_m, type: integer, source: input, default: 5700, description: "SPIRAL_4SH hose price per meter" }
      - { name: hose_price_thermoplastic_cents_per_m, type: integer, source: input, default: 1800, description: "THERMOPLASTIC hose price per meter" }
      - { name: exchange_credit_cap_pct, type: number, source: input, default: 0.30, description: "Core credit cap as fraction of exchange unit price" }
