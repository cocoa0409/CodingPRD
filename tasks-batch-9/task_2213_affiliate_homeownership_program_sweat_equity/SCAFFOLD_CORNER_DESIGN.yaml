            - { call: "POST /homeownership/households/${hh_id}/submit", payload: { attestation_signed: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_id}/screen", payload: { income_documents_received: true, verified_annual_income_cents: 3000000, verified_housing_cost_cents: 100000 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_id}/committee-referral", payload: { referral_memo: "File verified, referred to committee" }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
