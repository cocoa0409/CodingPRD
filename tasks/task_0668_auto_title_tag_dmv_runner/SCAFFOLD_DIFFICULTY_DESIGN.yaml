          assert:
            - "close returns 409 ERR_INVALID_STATE because leg ${tt_legB} is still FILED (not RESOLVED) — the join is not satisfied"
            - "after the single dispatch call both legs are FILED (fork fan-out verified via GET /dmv/runner-trips/${tt_trip}/legs)"
            - "RunnerTrip.${tt_trip}.trip_status == RETURNED (close rejected, no transition)"

  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: complete_settles_quote_then_balance_then_suspends_account_depth3
        grounds:
          - state_machines.Transaction.APPROVED_to_COMPLETED
          - calculations.fee_quote_final
          - calculations.account_balance
          - entities.Account.fields.outstanding_balance_cents
          - entities.Account.fields.status
        distinguishing_aspect: "Depth-3 cascade from APPROVED->COMPLETED: (1) FINAL FeeQuote settled, (2) the settle mutates Account.outstanding_balance_cents, (3) that balance crossing credit_limit_cents mutates Account.status to SUSPENDED. Each link is caused by the prior link, not directly by complete."
        test_recipe:
          setup:
            - "CA FeeSchedule registration_fee 8500; FLEET account credit_terms=true with credit_limit_cents=10000 (below the 13000 REGISTRATION total)."
            - "A REGISTRATION Transaction (ytd 0, no discount, total 13000) driven to APPROVED."
          setup_api_calls:
            - call: "POST /dmv/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dmv/fee-schedules"
              payload: { state_code: "CA", title_fee_cents: 2000, registration_fee_cents: 8500, transfer_fee_cents: 1500, lien_recording_fee_cents: 1000, use_tax_rate_bps: 625, trade_in_credit_allowed: true }
              as: PlatformAdmin
            - call: "POST /dmv/accounts"
              payload: { account_type: "FLEET", legal_name: "Tight Fleet", state_code: "CA", credit_terms: true, credit_limit_cents: 10000 }
              as: PlatformAdmin
              captures: { tf_acct: $.data.id }
            - call: "POST /dmv/transactions"
              payload: { account_id: "${tf_acct}", transaction_type: "REGISTRATION", vin: "1HGCM82633A004352", declared_price_cents: 0, expedite: false }
              as: IntakeClerk
              captures: { tf_txn: $.data.id }
            - call: "POST /dmv/documents"
              payload: { transaction_id: "${tf_txn}", checklist_code: "ID_PROOF", file_ref: "f1" }
              as: IntakeClerk
              captures: { tf_d1: $.data.id }
            - call: "POST /dmv/documents"
              payload: { transaction_id: "${tf_txn}", checklist_code: "INSURANCE", file_ref: "f2" }
              as: IntakeClerk
              captures: { tf_d2: $.data.id }
            - call: "POST /dmv/documents/${tf_d1}/verify"
              payload: { decision: "VERIFIED" }
              as: IntakeClerk
            - call: "POST /dmv/documents/${tf_d2}/verify"
              payload: { decision: "VERIFIED" }
              as: IntakeClerk
            - call: "POST /dmv/transactions/${tf_txn}/verify-documents"
              payload: {}
              as: IntakeClerk
              captures: { tf_v1: $.data.version }
            - call: "POST /dmv/transactions/${tf_txn}/quote"
              payload: { expected_transaction_version: "${tf_v1}" }
              as: FeeAnalyst
            - call: "POST /dmv/transactions/${tf_txn}/submit"
              payload: {}
              as: IntakeClerk
              captures: { tf_sub: $.data.id }
            - call: "POST /dmv/runner-trips"
              payload: { dmv_office_code: "CA-DMV-01", capacity: 5, window_start_at: "2026-04-01T09:00:00Z", window_end_at: "2026-04-01T12:00:00Z" }
              as: RunnerDispatcher
              captures: { tf_trip: $.data.id, tf_trip_v0: $.data.version }
            - call: "POST /dmv/runner-trips/${tf_trip}/legs"
              payload: { submission_id: "${tf_sub}", expected_runnertrip_version: "${tf_trip_v0}" }
              as: RunnerDispatcher
            - call: "POST /dmv/runner-trips/${tf_trip}/dispatch"
              payload: {}
              as: RunnerDispatcher
            - call: "POST /dmv/runner-trips/${tf_trip}/return"
              payload: {}
              as: RunnerDispatcher
            - call: "POST /dmv/submissions/${tf_sub}/decision"
              payload: { outcome: "ACCEPTED" }
              as: RunnerDispatcher
          trigger:
            - call: "POST /dmv/transactions/${tf_txn}/complete"
              payload: {}
              as: FeeAnalyst
          assert:
            - "the FINAL FeeQuote for ${tf_txn} has status == SETTLED and total_cents == 13000"
            - "Account.${tf_acct}.outstanding_balance_cents == 13000"
            - "Account.${tf_acct}.status == SUSPENDED (13000 > credit_limit 10000)"

      - name: dmv_reject_bumps_round_then_sets_documents_incomplete_depth2
        grounds:
          - state_machines.Submission.ASSIGNED_to_DMV_REJECTED
          - state_machines.Transaction.SUBMITTED_to_REJECTED
          - entities.Transaction.fields.rejection_round
          - entities.Transaction.fields.document_status
        distinguishing_aspect: "Depth-2 cascade from a DIFFERENT trigger (Submission decision DMV_REJECTED, not complete): (1) Submission->DMV_REJECTED reflects Transaction SUBMITTED->REJECTED with rejection_round bump, (2) that Transaction mutation itself sets document_status=INCOMPLETE. Originates from the decision endpoint, distinct from instance 1's complete trigger."
        test_recipe:
          setup:
            - "CA FeeSchedule; RETAIL account; REGISTRATION Transaction driven to SUBMITTED (rejection_round 0, document_status VERIFIED), trip RETURNED."
          setup_api_calls:
            - call: "POST /dmv/_clock/set_current_utc"
