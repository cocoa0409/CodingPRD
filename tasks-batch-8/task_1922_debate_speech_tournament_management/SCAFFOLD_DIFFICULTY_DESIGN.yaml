            - { call: "POST /ballots/${b1}/submit", as: Judge, as_user_id: "${j_e1}" }
            - { call: "POST /ballots/${b1}/verify", as: TabStaff }
            - { call: "GET /pairing-entries?pairing_id=${p2}", as: TabStaff, captures: { p2w: "$.data[0].entry_id", p2l: "$.data[1].entry_id" } }
            - { call: "POST /ballots", payload: { pairing_id: "${p2}", winner_entry_id: "${p2w}", speaker_points: { "${p2w}": 27, "${p2l}": 25 } }, as: Judge, as_user_id: "${j_e2}", captures: { b2: $.data.id } }
            - { call: "POST /ballots/${b2}/submit", as: Judge, as_user_id: "${j_e2}" }
