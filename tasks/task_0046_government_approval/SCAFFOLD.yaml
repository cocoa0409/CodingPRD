scenario: |
  Government service one-stop approval platform: matter catalog management with matter
  classification by department and theme, matter-handling guideline (basis/conditions/materials/
  time-limit/fees), matter version control, and online/offline channel tagging; application
  material template with required-material list, template form download, e-form online
  filling, material-type rules (original/copy/notarized), and example-material reference;
  multi-department joint review routing with parallel and serial review configuration,
  lead-department designation, inter-department data sharing, opinion-aggregation rules,
  and disagreement-escalation workflow; correction notice with reviewer-identified
  deficiency list, applicant correction submission, correction time-limit configuration,
  multi-round correction limits, and correction-failure rejection; approval time-limit
  monitoring with statutory and committed time-limit configuration, deduction rules for
  correction period, time-limit warning thresholds, overtime escalation, and time-limit
  performance reporting; electronic certificate generation with certificate template
  library, variable auto-filling, official-seal embedding, certificate verification code,
  expiration management, and re-issuance workflow; event-driven synchronization with
  identity verification, electronic-signature, payment, and inter-department data-sharing
  platforms; audit logging for approval actions and certificate issuance.

domain_name: gov-approval
api_prefix: /matters

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - scheduled_deferred_actions
    - version_pinning_on_approval
    - dual_variant_calculation
    - idempotency
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: saga

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Department
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Stable department code (e.g., DEPT_HEALTH).
        constraints: Unique; uppercase letters/underscores; 3-32 chars.
      - name: name
        type: string
        source: input
        description: Human-readable department name.
      - name: parent_department_id
        type: string
        source: input
        description: Optional parent department for hierarchical override / escalation target.
        default: null
      - name: status
        type: enum
        source: input
        description: Department lifecycle.
        default: ACTIVE
        constraints: One of {ACTIVE, ARCHIVED}.

  - name: Matter
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Stable matter code that survives across versions.
        constraints: Unique; 4-64 chars.
      - name: theme
        type: enum
        source: input
        description: Matter theme classification.
        constraints: One of {BIRTH, EDUCATION, BUSINESS, HOUSING, TRANSPORT, SOCIAL_SECURITY, OTHER}.
      - name: owning_department_id
        type: string
        source: input
        description: Catalog-owner department; FK to Department.id.
      - name: current_published_version_id
        type: string
        source: computed
        description: FK to MatterVersion.id whose status is PUBLISHED. Null until first publish.
        default: null
      - name: status
        type: enum
        source: computed
        description: Catalog-level status.
        default: DRAFT_ONLY
        constraints: One of {DRAFT_ONLY, PUBLISHED, ARCHIVED}.

  - name: MatterVersion
    parent: Matter
    common_fields: true
    fields:
      - name: matter_id
        type: string
        source: input
        description: FK to Matter.id.
      - name: version_label
        type: string
        source: input
        description: Author-supplied semantic label (e.g., "2024.03").
        constraints: Unique within (matter_id); 1-32 chars.
      - name: legal_basis
        type: string
        source: input
        description: Free-text legal basis citation block.
      - name: conditions
        type: string
        source: input
        description: Eligibility conditions prose.
      - name: required_material_template_ids
        type: array
        source: input
        description: Ordered list of MaterialTemplate.id required by this version.
        constraints: Non-empty; each id must belong to MaterialTemplate with status=PUBLISHED.
      - name: statutory_time_limit_days
        type: integer
        source: input
        description: Legal maximum working days for processing.
        constraints: 1 <= value <= 365.
      - name: committed_time_limit_days
        type: integer
        source: input
        description: Department-committed working days; must be <= statutory.
        constraints: 1 <= value <= statutory_time_limit_days.
      - name: warning_threshold_pct
        type: integer
        source: input
        description: Percent of committed time-limit elapsed before warning fires.
        default: 80
        constraints: 50 <= value <= 99.
      - name: fee_amount_cents
        type: integer
        source: input
        description: Fixed processing fee in cents (0 if free).
        default: 0
        constraints: value >= 0.
      - name: channels
        type: array
        source: input
        description: Allowed channels.
        constraints: Non-empty subset of {ONLINE, OFFLINE}.
      - name: review_routing
        type: object
        source: input
        description: |
          Routing definition. Keys:
            mode: SERIAL | PARALLEL
            lead_department_id: Department.id (must be in stages)
            stages: ordered array (length >=1) of objects {department_id, sla_days}
            aggregation_rule: ALL_AGREE | MAJORITY | LEAD_DECIDES (PARALLEL only;
              for SERIAL aggregation_rule MUST be null and any one rejection ends review).
        constraints: When mode=SERIAL, stages length >= 1 and aggregation_rule is null;
          when mode=PARALLEL, aggregation_rule is required.
      - name: max_correction_rounds
        type: integer
        source: input
        description: Maximum number of CorrectionNotice rounds allowed before auto-reject.
        default: 2
        constraints: 1 <= value <= 5.
      - name: correction_window_days
        type: integer
        source: input
        description: Working days an applicant has to submit each correction.
        default: 7
        constraints: 1 <= value <= 30.
      - name: certificate_template_id
        type: string
        source: input
        description: FK to CertificateTemplate.id used on approval.
      - name: status
        type: enum
        source: computed
        description: Version lifecycle.
        default: DRAFT
        constraints: One of {DRAFT, PUBLISHED, SUPERSEDED, RETIRED}.
      - name: published_at
        type: datetime
        source: system
        description: Timestamp when status moved to PUBLISHED.
        default: null

  - name: MaterialTemplate
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Stable template code.
        constraints: Unique; 4-64 chars.
      - name: title
        type: string
        source: input
        description: Display title.
      - name: material_type
        type: enum
        source: input
        description: Required material type.
        constraints: One of {ORIGINAL, COPY, NOTARIZED}.
      - name: form_url
        type: string
        source: input
        description: Optional download URL of blank template.
        default: null
      - name: example_url
        type: string
        source: input
        description: Optional example-material reference URL.
        default: null
      - name: e_form_schema
        type: object
        source: input
        description: |
          Optional JSON-Schema-shaped object describing online-filling fields.
          When present, online channel applications MUST attach a payload conforming
          to the listed required keys.
        default: null
      - name: status
        type: enum
        source: computed
        description: Template lifecycle.
        default: DRAFT
        constraints: One of {DRAFT, PUBLISHED, RETIRED}.

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: matter_version_id
        type: string
        source: input
        description: FK to MatterVersion.id pinned at submission.
      - name: applicant_user_id
        type: string
        source: input
        description: Opaque applicant id (the X-User-ID at submit time).
      - name: channel
        type: enum
        source: input
        description: Submission channel.
        constraints: One of {ONLINE, OFFLINE}; must be present in pinned MatterVersion.channels.
      - name: submitted_materials
        type: array
        source: input
        description: |
          Array of {material_template_id, attachment_ref, e_form_payload?} objects.
          Must cover every entry in MatterVersion.required_material_template_ids.
      - name: identity_verified
        type: boolean
        source: computed
        description: Flipped true once identity-verification event arrives.
        default: false
      - name: payment_status
        type: enum
        source: computed
        description: Independent payment dimension; evolves on payment events.
        default: PENDING
        constraints: One of {PENDING, PAID, REFUNDED}; PENDING is skipped to PAID immediately when MatterVersion.fee_amount_cents == 0.
      - name: review_status
        type: enum
        source: computed
        description: Independent review dimension; evolves through joint-review states.
        default: SUBMITTED
        constraints: One of {SUBMITTED, UNDER_REVIEW, AWAITING_CORRECTION, ESCALATED, APPROVED, REJECTED, WITHDRAWN}.
      - name: correction_round
        type: integer
        source: computed
        description: Number of CorrectionNotice instances that have been issued so far.
        default: 0
      - name: deadline_at
        type: datetime
        source: computed
        description: |
          Derived final deadline for this application; recalculated whenever a correction
          period begins or ends (see calc derive_application_deadline).
        default: null
      - name: clock_started_at
        type: datetime
        source: system
        description: Set when review_status first leaves SUBMITTED into UNDER_REVIEW.
        default: null
      - name: total_paused_seconds
        type: integer
        source: computed
        description: Cumulative elapsed seconds while review_status == AWAITING_CORRECTION (deducted).
        default: 0
      - name: pinned_routing_snapshot
        type: object
        source: system
        description: Deep copy of MatterVersion.review_routing taken when review begins.
        default: null

  - name: ReviewTask
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK to Application.id.
      - name: department_id
        type: string
        source: input
        description: Reviewing department; FK to Department.id.
      - name: stage_index
        type: integer
        source: input
        description: 0-based index into pinned_routing_snapshot.stages.
      - name: is_lead
        type: boolean
        source: input
        description: True iff this department equals routing.lead_department_id.
      - name: status
        type: enum
        source: computed
        description: Per-department review state.
        default: PENDING
        constraints: One of {PENDING, IN_PROGRESS, AGREED, DISAGREED, SKIPPED}.
      - name: opinion_text
        type: string
        source: input
        description: Free-text opinion attached when status moves to AGREED or DISAGREED.
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: Timestamp of opinion submission.
        default: null
      - name: stage_due_at
        type: datetime
        source: computed
        description: Per-stage SLA deadline for this task.
        default: null

  - name: CorrectionNotice
    parent: Application
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: FK to Application.id.
      - name: round_number
        type: integer
        source: system
        description: 1-based round counter; equals Application.correction_round at issuance.
      - name: deficiencies
        type: array
        source: input
        description: |
          Array of {material_template_id, reason} objects identifying missing or invalid
          materials. Non-empty.
      - name: issued_by_review_task_id
        type: string
        source: input
        description: FK to ReviewTask.id whose reviewer raised the deficiencies.
      - name: issued_at
        type: datetime
        source: system
        description: Issuance timestamp; opens the correction window.
      - name: due_at
        type: datetime
        source: computed
        description: issued_at + correction_window_days working days.
      - name: status
        type: enum
        source: computed
        description: Notice lifecycle.
        default: OPEN
        constraints: One of {OPEN, RESOLVED, EXPIRED}.
      - name: resolved_at
        type: datetime
        source: system
        description: Set when applicant submits a resubmission accepted by reviewer.
        default: null

  - name: CertificateTemplate
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Stable template code.
        constraints: Unique; 4-64 chars.
      - name: body_template
        type: string
        source: input
        description: Mustache-style template with variable placeholders like {{applicant_name}}.
      - name: required_variables
        type: array
        source: input
        description: List of variable names the body_template demands; every entry MUST appear in body_template.
      - name: validity_days
        type: integer
        source: input
        description: Calendar days the issued certificate remains valid; 0 means no expiration.
        default: 0
        constraints: value >= 0.
      - name: official_seal_id
        type: string
        source: input
        description: Identifier of the seal asset embedded on issuance.
      - name: status
        type: enum
        source: computed
        description: Template lifecycle.
        default: DRAFT
        constraints: One of {DRAFT, PUBLISHED, RETIRED}.

  - name: Certificate
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK to Application.id.
      - name: certificate_template_id
        type: string
        source: input
        description: FK to CertificateTemplate.id pinned at issuance.
      - name: serial_number
        type: string
        source: system
        description: Globally unique human-readable serial; opaque format.
      - name: verification_code
        type: string
        source: system
        description: 16-char alphanumeric verification code; queryable.
      - name: rendered_body
        type: string
        source: system
        description: Body_template with all variables substituted at issuance.
      - name: issued_at
        type: datetime
        source: system
        description: Issuance timestamp.
      - name: expires_at
        type: datetime
        source: system
        description: issued_at + validity_days; null if validity_days == 0.
        default: null
      - name: status
        type: enum
        source: computed
        description: Certificate lifecycle.
        default: ACTIVE
        constraints: One of {ACTIVE, EXPIRED, REVOKED, REISSUED}.
      - name: superseded_by_certificate_id
        type: string
        source: computed
        description: Set on REISSUED to point at the replacement Certificate.id.
        default: null

  - name: ExternalEvent
    parent: null
    common_fields: false
    fields:
      - name: event_type
        type: enum
        source: input
        description: Source platform tag.
        constraints: One of {IDENTITY_VERIFIED, SIGNATURE_AFFIXED, PAYMENT_SETTLED, DATA_SHARED}.
      - name: idempotency_key
        type: string
        source: input
        description: Unique per (event_type, payload); duplicates are absorbed.
        constraints: Unique within event_type.
      - name: subject_application_id
        type: string
        source: input
        description: Application this event applies to.
      - name: payload
        type: object
        source: input
        description: Arbitrary key/value payload from the source platform.
      - name: processed
        type: boolean
        source: computed
        description: True after side effects on Application have been applied.
        default: false

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: actor_role
        type: string
        source: system
        description: Snapshot of X-User-Role at the time of action.
      - name: actor_id
        type: string
        source: system
        description: Snapshot of X-User-ID at the time of action.
      - name: action
        type: enum
        source: system
        description: Audited action category.
        constraints: One of {APPLICATION_SUBMIT, REVIEW_DECIDE, CORRECTION_ISSUE, CORRECTION_RESUBMIT, ESCALATE, APPROVE, REJECT, CERT_ISSUE, CERT_REISSUE, CERT_REVOKE}.
      - name: target_entity
        type: string
        source: system
        description: Entity name acted upon.
      - name: target_id
        type: string
        source: system
        description: Entity id acted upon.
      - name: payload_snapshot
        type: object
        source: system
        description: Sanitized request body snapshot.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: MatterVersion
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /matters/{id}/versions/{vid}/publish"
        actor: CatalogManager
        preconditions:
          - "version_label is unique within matter (already enforced at create)"
          - "every required_material_template_ids entry refers to a MaterialTemplate with status==PUBLISHED"
          - "certificate_template_id refers to a CertificateTemplate with status==PUBLISHED"
          - "if Matter.current_published_version_id is set, that prior version is auto-superseded (see side_effects)"
        side_effects:
          - "set MatterVersion.published_at to now()"
          - "set Matter.current_published_version_id = this version's id"
          - "if a previous PUBLISHED version existed, transition it from PUBLISHED to SUPERSEDED in the same request"
          - "set Matter.status = PUBLISHED"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "Auto-cascade when another DRAFT version is published"
        actor: system
        preconditions: ["a sibling version is being published in the same request"]
        side_effects: ["this version becomes read-only; in-flight Applications keep their pinned matter_version_id"]
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /matters/{id}/versions/{vid}/retire"
        actor: CatalogManager
        preconditions:
          - "no Application referencing this version has review_status outside {APPROVED, REJECTED, WITHDRAWN}"
        side_effects:
          - "if this version equals Matter.current_published_version_id, clear that pointer"
          - "if no other PUBLISHED version exists, set Matter.status = ARCHIVED"
      - from: SUPERSEDED
        to: RETIRED
        trigger: "POST /matters/{id}/versions/{vid}/retire"
        actor: CatalogManager
        preconditions: ["no in-flight Application references this version"]
        side_effects: []

  - entity: Application
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "system: prerequisites_met (identity_verified == true AND payment_status == PAID)"
        actor: system
        preconditions:
          - "Application.identity_verified == true"
          - "Application.payment_status == PAID"
          - "pinned MatterVersion.status in {PUBLISHED, SUPERSEDED}"
        side_effects:
          - "snapshot pinned_routing_snapshot from MatterVersion.review_routing"
          - "create ReviewTask rows for every stage in routing.stages"
          - "if mode==SERIAL: only the stage_index==0 ReviewTask flips to IN_PROGRESS, others stay PENDING"
          - "if mode==PARALLEL: all ReviewTask rows flip to IN_PROGRESS at once"
          - "set Application.clock_started_at = now()"
          - "compute Application.deadline_at via derive_application_deadline (variant=committed)"
      - from: UNDER_REVIEW
        to: AWAITING_CORRECTION
        trigger: "POST /applications/{id}/correction-notices"
        actor: Reviewer
        preconditions:
          - "Application.correction_round < pinned MatterVersion.max_correction_rounds"
          - "the issuing ReviewTask.status == IN_PROGRESS"
        side_effects:
          - "create CorrectionNotice with round_number = Application.correction_round + 1"
          - "increment Application.correction_round by 1"
          - "freeze the time-limit clock: subsequent elapsed seconds accumulate into total_paused_seconds when leaving this state"
          - "every IN_PROGRESS ReviewTask is paused (no opinion can be filed while AWAITING_CORRECTION)"
      - from: AWAITING_CORRECTION
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/correction-notices/{cid}/resubmit"
        actor: Applicant
        preconditions:
          - "CorrectionNotice.status == OPEN"
          - "now() <= CorrectionNotice.due_at"
          - "submitted_materials cover every deficiency in the notice"
        side_effects:
          - "set CorrectionNotice.status = RESOLVED, resolved_at = now()"
          - "add (now() - CorrectionNotice.issued_at) seconds to Application.total_paused_seconds"
          - "recompute Application.deadline_at via derive_application_deadline"
          - "previously paused ReviewTasks resume at the same status they were in"
      - from: AWAITING_CORRECTION
        to: REJECTED
        trigger: "system: correction window expired (now() > CorrectionNotice.due_at) OR Application.correction_round == max_correction_rounds AND no resubmit"
        actor: system
        preconditions:
          - "CorrectionNotice.status == OPEN AND now() > CorrectionNotice.due_at"
        side_effects:
          - "set CorrectionNotice.status = EXPIRED"
          - "every non-terminal ReviewTask flips to SKIPPED"
          - "write AuditLog action=REJECT with reason CORRECTION_FAILURE"
      - from: UNDER_REVIEW
        to: ESCALATED
        trigger: "POST /applications/{id}/escalate"
        actor: LeadReviewer
        preconditions:
          - "pinned routing.mode == PARALLEL AND aggregation_rule != LEAD_DECIDES"
          - "ReviewTasks contain at least one AGREED and at least one DISAGREED (a disagreement exists)"
        side_effects:
          - "the parent of routing.lead_department_id is consulted; if no parent exists, escalate to PlatformAdmin"
          - "all IN_PROGRESS ReviewTasks pause (no further opinions accepted)"
      - from: ESCALATED
        to: APPROVED
        trigger: "POST /applications/{id}/escalation-resolve { decision: AGREED }"
        actor: PlatformAdmin
        preconditions: ["Application.review_status == ESCALATED"]
        side_effects:
          - "all PENDING/IN_PROGRESS ReviewTasks marked AGREED with system opinion"
          - "issue Certificate via certificate_issue calculation"
          - "Application.review_status -> APPROVED"
      - from: ESCALATED
        to: REJECTED
        trigger: "POST /applications/{id}/escalation-resolve { decision: DISAGREED }"
        actor: PlatformAdmin
        preconditions: ["Application.review_status == ESCALATED"]
        side_effects:
          - "all PENDING/IN_PROGRESS ReviewTasks marked DISAGREED with system opinion"
          - "Application.review_status -> REJECTED"
          - "if Application.payment_status == PAID and pinned MatterVersion.fee_amount_cents > 0, schedule refund: payment_status -> REFUNDED"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "system: aggregate_review_done (see opinion_aggregation calculation returns AGREED)"
        actor: system
        preconditions:
          - "opinion_aggregation evaluates to AGREED"
        side_effects:
          - "issue Certificate via certificate_issue calculation"
          - "write AuditLog action=APPROVE"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "system: aggregate_review_done returns DISAGREED"
        actor: system
        preconditions: ["opinion_aggregation evaluates to DISAGREED"]
        side_effects:
          - "if Application.payment_status == PAID and fee > 0, set payment_status = REFUNDED"
          - "write AuditLog action=REJECT"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions: ["Application.review_status == SUBMITTED"]
        side_effects:
          - "if payment_status == PAID, set payment_status = REFUNDED"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions:
          - "Application.review_status == UNDER_REVIEW"
          - "no ReviewTask has status DISAGREED yet (cannot withdraw to dodge a pending rejection)"
        side_effects:
          - "every non-terminal ReviewTask flips to SKIPPED"
          - "if payment_status == PAID and fee > 0, set payment_status = REFUNDED"

  - entity: ReviewTask
    initial_state: PENDING
    terminal_states: [AGREED, DISAGREED, SKIPPED]
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "system: predecessor stage AGREED (SERIAL) or all tasks activated at once (PARALLEL)"
        actor: system
        preconditions:
          - "Application.review_status == UNDER_REVIEW"
          - "for SERIAL routing: previous stage_index task.status == AGREED"
        side_effects:
          - "set stage_due_at = now() + stage.sla_days working days"
      - from: IN_PROGRESS
        to: AGREED
        trigger: "POST /review-tasks/{id}/decide { decision: AGREED }"
        actor: Reviewer
        preconditions:
          - "Application.review_status == UNDER_REVIEW"
          - "no OPEN CorrectionNotice exists for this Application"
        side_effects:
          - "set decided_at = now()"
          - "for SERIAL routing: if not the last stage, the next stage_index task auto-transitions PENDING -> IN_PROGRESS"
          - "trigger opinion_aggregation; if it returns a final verdict, drive Application transition"
      - from: IN_PROGRESS
        to: DISAGREED
        trigger: "POST /review-tasks/{id}/decide { decision: DISAGREED }"
        actor: Reviewer
        preconditions:
          - "Application.review_status == UNDER_REVIEW"
          - "no OPEN CorrectionNotice exists"
        side_effects:
          - "set decided_at = now()"
          - "trigger opinion_aggregation"
      - from: IN_PROGRESS
        to: SKIPPED
        trigger: "system cascade from Application transition to REJECTED/WITHDRAWN/APPROVED-via-escalation"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: SKIPPED
        trigger: "system cascade"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CorrectionNotice
    initial_state: OPEN
    terminal_states: [RESOLVED, EXPIRED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /applications/{id}/correction-notices/{cid}/resubmit"
        actor: Applicant
        preconditions:
          - "now() <= due_at"
          - "submitted_materials cover every deficiency"
        side_effects:
          - "set resolved_at = now()"
          - "drive Application.review_status from AWAITING_CORRECTION back to UNDER_REVIEW"
      - from: OPEN
        to: EXPIRED
        trigger: "system: now() > due_at"
        actor: system
        preconditions: ["now() > due_at"]
        side_effects:
          - "drive Application.review_status from AWAITING_CORRECTION to REJECTED"

  - entity: Certificate
    initial_state: ACTIVE
    terminal_states: [REVOKED, REISSUED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: now() >= expires_at AND expires_at != null"
        actor: system
        preconditions: ["expires_at != null"]
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /certificates/{id}/revoke"
        actor: PlatformAdmin
        preconditions:
          - "Certificate.status == ACTIVE"
        side_effects:
          - "write AuditLog action=CERT_REVOKE"
      - from: ACTIVE
        to: REISSUED
        trigger: "POST /certificates/{id}/reissue"
        actor: CertificateOfficer
        preconditions:
          - "Certificate.status in {ACTIVE, EXPIRED}"
          - "Application.review_status == APPROVED"
        side_effects:
          - "create new Certificate with same template, fresh serial_number/verification_code, fresh issued_at, fresh expires_at"
          - "set old Certificate.superseded_by_certificate_id = new.id"
          - "write AuditLog action=CERT_REISSUE"
      - from: EXPIRED
        to: REISSUED
        trigger: "POST /certificates/{id}/reissue"
        actor: CertificateOfficer
        preconditions: ["Application.review_status == APPROVED"]
        side_effects:
          - "create replacement Certificate as above"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two reviewers in different departments race on the last outstanding ReviewTask of a SERIAL routing"
    guarantee: "Only the stage_index-matching task can decide; later stages stay PENDING until the predecessor is AGREED"
    error_id: ERR_REVIEW_OUT_OF_ORDER
    http_status: 409
    serialization: "First-writer-wins on the stage_index==N task; stage_index==N+1 rejected with ERR_REVIEW_OUT_OF_ORDER"

  - scenario: "Reviewer issues correction notice while another reviewer simultaneously decides AGREED on the same Application"
    guarantee: "Exactly one operation succeeds; loser is rejected because Application.review_status changed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Application.review_status; the loser sees a status that no longer permits its action"

  - scenario: "Applicant submits resubmit while system sweep marks the same CorrectionNotice EXPIRED (due_at boundary)"
    guarantee: "The resubmit succeeds only if its server-side now() <= due_at; otherwise ERR_CORRECTION_EXPIRED"
    error_id: ERR_CORRECTION_EXPIRED
    http_status: 409
    serialization: "First-writer-wins on CorrectionNotice.status; loser sees EXPIRED"

  - scenario: "Two reissue requests for the same source Certificate fire concurrently"
    guarantee: "At most one new Certificate is created; the second sees superseded_by_certificate_id already set and is rejected"
    error_id: ERR_CERTIFICATE_ALREADY_REISSUED
    http_status: 409
    serialization: "First-writer-wins on Certificate.superseded_by_certificate_id"

  - scenario: "Same external event (identity-verified) is delivered twice with the same idempotency_key"
    guarantee: "Second delivery is absorbed (HTTP 200, processed=true returned) without re-applying side effects"
    error_id: null
    http_status: 200
    serialization: "Idempotency lookup on (event_type, idempotency_key); duplicate returns the original result"

  - scenario: "Catalog manager publishes version V2 while V1 is being retired"
    guarantee: "Exactly one transition wins; if V1 retires first, publishing V2 still succeeds and V1 is already RETIRED (no auto-supersede); if V2 publishes first, V1 auto-transitions PUBLISHED -> SUPERSEDED before retire arrives"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Matter.current_published_version_id"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: derive_application_deadline
    trigger: "When Application.review_status enters UNDER_REVIEW for the first time, and again whenever total_paused_seconds is updated by a correction round"
    algorithm: chronological
    formula: |
      # Base inputs
      working_day_seconds = 8 * 3600          # 8 hours per working day
      base_days = (variant == 'committed') ? MatterVersion.committed_time_limit_days
                                            : MatterVersion.statutory_time_limit_days
      base_window_seconds = base_days * working_day_seconds
      # Step 1: anchor on clock_started_at
      raw_deadline = Application.clock_started_at + base_window_seconds
      # Step 2: deduct paused (correction) periods cumulatively, in order they were closed
      adjusted_deadline = raw_deadline + Application.total_paused_seconds   # push deadline outward
      Application.deadline_at = adjusted_deadline
    input_set: "clock_started_at (immutable once set), total_paused_seconds (monotonic increasing), MatterVersion.{statutory,committed}_time_limit_days, current variant"
    constants:
      WORKING_DAY_SECONDS: 28800
    precision: "integer seconds (no fractional)"
    variants:
      - name: committed
        when: "Default — all SLA monitoring, warning thresholds, escalation alerts use this variant"
        difference: "Uses committed_time_limit_days; produces the EARLIER deadline; drives warning_threshold_pct"
      - name: statutory
        when: "Performance reporting endpoint and overtime-escalation governance only; never used to drive automated rejection"
        difference: "Uses statutory_time_limit_days (>= committed); produces the LATER deadline; drives only ESCALATED notifications, not state transitions"

  - name: opinion_aggregation
    trigger: "Each time a ReviewTask transitions to AGREED or DISAGREED"
    algorithm: aggregation
    formula: |
      tasks = all ReviewTask rows for this Application sorted by stage_index ASC, then created_at ASC
      lead_task = first task where is_lead==true
      mode = Application.pinned_routing_snapshot.mode
      rule = Application.pinned_routing_snapshot.aggregation_rule
      if mode == 'SERIAL':
        if any task.status == 'DISAGREED': return 'DISAGREED'  # short-circuit on first reject
        if all task.status == 'AGREED': return 'AGREED'
        return 'PENDING'
      else:  # PARALLEL
        if rule == 'ALL_AGREE':
          if any DISAGREED: return 'DISAGREED'
          if all AGREED: return 'AGREED'
          return 'PENDING'
        if rule == 'MAJORITY':
          if all decided (AGREED+DISAGREED == count of non-SKIPPED tasks):
            return 'AGREED' if AGREED count > DISAGREED count else 'DISAGREED'
          return 'PENDING'
        if rule == 'LEAD_DECIDES':
          if lead_task.status == 'AGREED': return 'AGREED'
          if lead_task.status == 'DISAGREED': return 'DISAGREED'
          return 'PENDING'
    input_set: "All ReviewTask rows for this Application (excluding SKIPPED), pinned_routing_snapshot.mode and aggregation_rule"
    constants: {}
    precision: "Discrete enum {AGREED, DISAGREED, PENDING}"
    variants: []

  - name: certificate_issue
    trigger: "Application transitions UNDER_REVIEW -> APPROVED, or ESCALATED -> APPROVED"
    algorithm: projection
    formula: |
      template = CertificateTemplate at MatterVersion.certificate_template_id
      # Step 1: variable rendering — round-half-up rule on any numeric variable to 2 decimals BEFORE substitution
      rendered_vars = {}
      for v in template.required_variables:
        raw = lookup(v, Application + MatterVersion)   # may be number, string, datetime
        rendered_vars[v] = format(raw)                  # numbers: round_half_up to 2dp THEN format
      # Step 2: literal substitution into body_template (no escaping; templates are plain text)
      rendered_body = substitute(template.body_template, rendered_vars)
      # Step 3: compute serial_number = "GOV-{matter.code}-{YYMMDD}-{6-digit zero-padded sequence}"
      seq = next_per_day_sequence_for(matter.code, today)
      serial = f"GOV-{matter.code}-{today:%y%m%d}-{seq:06d}"
      # Step 4: compute verification_code = 16 char alphanumeric, base32 of (UUID4 + serial)
      verification_code = base32(uuid4() + serial)[:16]
      # Step 5: expires_at
      expires_at = (template.validity_days == 0) ? null
                                                 : issued_at + template.validity_days * 86400
    input_set: "Application (review_status==APPROVED), MatterVersion (pinned), CertificateTemplate (pinned at issuance)"
    constants:
      DAY_SECONDS: 86400
    precision: "Numeric variables rounded to 2 decimals (round_half_up) before substitution; expires_at computed as integer seconds offset"
    variants: []

  - name: certificate_fee_breakdown
    trigger: "Read on Application detail; reported in payment receipts"
    algorithm: tiered_pricing
    formula: |
      # The fee an applicant pays is composed of two percentage-multiplied lines and a
      # capped flat surcharge:
      #   base_fee_cents      = MatterVersion.fee_amount_cents
      #   surcharge_per_round = SURCHARGE_PER_ROUND_CENTS  (constant, integer cents)
      #   surcharge_subtotal_cents:
      #     0 if Application.correction_round == 0
      #     surcharge_per_round * Application.correction_round if correction_round <= 2
      #     CAP_SURCHARGE_CENTS otherwise
      #
      # Two percentage-fee LINES are computed and each rounded INDEPENDENTLY:
      #   handling_line_cents     = ceil(base_fee_cents       * HANDLING_RATE_BP    / 10000)
      #   admin_overhead_cents    = ceil(surcharge_subtotal_cents * OVERHEAD_RATE_BP / 10000)
      #   total_cents = base_fee_cents + handling_line_cents + surcharge_subtotal_cents + admin_overhead_cents
      #
      # Rounding ORDER IS PINNED: each percentage line is ceil()-rounded to integer cents
      # BEFORE being added to total_cents. The naive alternative —
      #   total_cents_wrong = base_fee_cents + surcharge_subtotal_cents
      #                       + ceil((base_fee_cents + surcharge_subtotal_cents)
      #                              * (HANDLING_RATE_BP + OVERHEAD_RATE_BP) / 10000)
      # — produces a different cents value for many inputs (e.g., base=997, rounds=1
      # gives 997 + 20 + 500 + 50 = 1567 with the pinned per-line ceil, vs
      # 997 + 500 + ceil(1497 * 700 / 10000) = 997 + 500 + 105 = 1602 with the wrong
      # sum-then-ceil order).
    input_set: "MatterVersion.fee_amount_cents, Application.correction_round (capped per CAP_SURCHARGE_CENTS rule)"
    constants:
      HANDLING_RATE_BP: 200          # 2.00%
      OVERHEAD_RATE_BP: 500          # 5.00%
      SURCHARGE_PER_ROUND_CENTS: 500 # 5.00 yuan per correction round
      CAP_SURCHARGE_CENTS: 1000      # capped at 10.00 yuan
    precision: "Integer cents, ceil per percentage-line BEFORE summing; final total is integer sum"
    variants:
      - name: provisional
        when: "Application.review_status in {SUBMITTED, UNDER_REVIEW, AWAITING_CORRECTION, ESCALATED}"
        difference: "Reported correction_round is the running count; total_cents may rise as new corrections are issued"
      - name: final
        when: "Application.review_status in {APPROVED, REJECTED, WITHDRAWN}"
        difference: "Frozen at the correction_round value at the moment of terminal transition; never recomputes afterward"

  - name: time_limit_warning_evaluator
    trigger: "Read on GET /applications/{id}/sla; also computed at every clock-advance"
    algorithm: threshold
    formula: |
      # Compute elapsed_active_seconds excluding paused windows
      now = current server time
      if Application.clock_started_at is null: return { elapsed: 0, status: 'NOT_STARTED' }
      total_elapsed = (now - Application.clock_started_at).seconds
      active_elapsed = total_elapsed - Application.total_paused_seconds
      committed_seconds = MatterVersion.committed_time_limit_days * WORKING_DAY_SECONDS
      pct = (active_elapsed * 100) // committed_seconds          # integer division
      warning_pct = MatterVersion.warning_threshold_pct
      # Boundary semantics:
      #   pct < warning_pct                -> ON_TRACK
      #   warning_pct <= pct < 100         -> WARNING
      #   pct >= 100                       -> OVERDUE   (pct == 100 already counts as OVERDUE)
      # ESCALATION boundary: pct >= 150 schedules an admin alert (statutory still in play if statutory > committed)
    input_set: "Application.{clock_started_at,total_paused_seconds}, MatterVersion.{committed_time_limit_days,warning_threshold_pct}"
    constants:
      WORKING_DAY_SECONDS: 28800
      ESCALATION_PCT: 150
    precision: "Integer percent (truncate); >= boundary inclusive"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (priority order)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and non-empty"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the declared role names in §1.7; permitted for this endpoint"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-parameter resources exist, validated left-to-right (Matter before Version, Application before ReviewTask, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target resource is in a state that permits the requested transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all mutation endpoints"

  - priority: 5
    category: state
    check: "SERIAL routing — only the lowest stage_index PENDING/IN_PROGRESS task can decide"
    error_id: ERR_REVIEW_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /review-tasks/{id}/decide"

  - priority: 6
    category: business_referential
    check: "POST /applications: every entry of MatterVersion.required_material_template_ids has exactly one matching submitted_materials entry"
    error_id: ERR_MATERIAL_MISSING
    http_status: 422
    applies_to: "POST /applications"

  - priority: 7
    category: business_referential
    check: "POST /applications: each submitted_materials entry's material_template_id MUST belong to MaterialTemplate.status==PUBLISHED; submitted material type matches MaterialTemplate.material_type"
    error_id: ERR_MATERIAL_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /applications"

  - priority: 8
    category: business_referential
    check: "POST /applications: when channel==ONLINE and a MaterialTemplate has e_form_schema, e_form_payload MUST contain every required key listed in the schema"
    error_id: ERR_EFORM_INCOMPLETE
    http_status: 422
    applies_to: "POST /applications"

  - priority: 9
    category: business_constraint
    check: "POST /applications: channel MUST appear in MatterVersion.channels"
    error_id: ERR_CHANNEL_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /applications"

  - priority: 10
    category: business_temporal
    check: "Resubmit on a CorrectionNotice: now() <= due_at"
    error_id: ERR_CORRECTION_EXPIRED
    http_status: 409
    applies_to: "POST /applications/{id}/correction-notices/{cid}/resubmit"

  - priority: 11
    category: business_constraint
    check: "Issue CorrectionNotice: Application.correction_round < pinned MatterVersion.max_correction_rounds"
    error_id: ERR_MAX_ROUNDS_REACHED
    http_status: 409
    applies_to: "POST /applications/{id}/correction-notices"

  - priority: 12
    category: business_referential
    check: "Resubmit on a CorrectionNotice: every deficiency in the notice MUST be addressed in submitted_materials"
    error_id: ERR_DEFICIENCY_UNRESOLVED
    http_status: 422
    applies_to: "POST /applications/{id}/correction-notices/{cid}/resubmit"

  - priority: 13
    category: business_constraint
    check: "Publish a MatterVersion: every required MaterialTemplate AND the certificate_template_id MUST have status==PUBLISHED"
    error_id: ERR_DEPENDENT_TEMPLATE_UNPUBLISHED
    http_status: 422
    applies_to: "POST /matters/{id}/versions/{vid}/publish"

  - priority: 14
    category: business_fiscal
    check: "Publish a MatterVersion: committed_time_limit_days <= statutory_time_limit_days"
    error_id: ERR_TIME_LIMIT_INVERSION
    http_status: 422
    applies_to: "POST /matters/{id}/versions, POST /matters/{id}/versions/{vid}/publish"

  - priority: 15
    category: business_constraint
    check: "Routing definition: when mode==PARALLEL, aggregation_rule MUST be one of {ALL_AGREE, MAJORITY, LEAD_DECIDES}; when mode==SERIAL aggregation_rule MUST be null and stages length >= 1; lead_department_id MUST appear in stages"
    error_id: ERR_ROUTING_INVALID
    http_status: 422
    applies_to: "POST /matters/{id}/versions, POST /matters/{id}/versions/{vid}/publish"

  - priority: 16
    category: business_constraint
    check: "Issue CorrectionNotice: deficiencies MUST be non-empty and every material_template_id MUST appear in pinned MatterVersion.required_material_template_ids"
    error_id: ERR_DEFICIENCY_INVALID
    http_status: 422
    applies_to: "POST /applications/{id}/correction-notices"

  - priority: 17
    category: business_constraint
    check: "Escalate: pinned routing.mode==PARALLEL AND aggregation_rule!=LEAD_DECIDES AND a disagreement currently exists"
    error_id: ERR_ESCALATION_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /applications/{id}/escalate"

  - priority: 18
    category: business_constraint
    check: "Reissue Certificate: source must not already be REISSUED (superseded_by_certificate_id null)"
    error_id: ERR_CERTIFICATE_ALREADY_REISSUED
    http_status: 409
    applies_to: "POST /certificates/{id}/reissue"

  - priority: 19
    category: business_referential
    check: "OCC: when version is supplied on PATCH/PUT, it must equal the resource's current version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH/PUT endpoints"

  - priority: 20
    category: business_constraint
    check: "Idempotency: ExternalEvent.idempotency_key MUST be unique within event_type"
    error_id: null
    http_status: 200
    applies_to: "POST /_events/emit"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Department ---
  - method: POST
    path: "/departments"
    description: "Register a new department."
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, "parent_department_id?"]
    output: Department
    side_effects: []

  - method: GET
    path: "/departments"
    description: "List departments with optional filters."
    roles: [PlatformAdmin, CatalogManager, Reviewer, LeadReviewer, CertificateOfficer, Applicant]
    code: 200
    input: ["status?", "parent_department_id?", "limit?", "offset?"]
    output: "Department[]"
    side_effects: []

  # --- Matter & MatterVersion ---
  - method: POST
    path: "/matters"
    description: "Create a Matter shell."
    roles: [CatalogManager]
    code: 201
    input: [code, theme, owning_department_id]
    output: Matter
    side_effects: []

  - method: GET
    path: "/matters"
    description: "List matters; filter by theme, owning_department_id, status."
    roles: [PlatformAdmin, CatalogManager, Reviewer, LeadReviewer, CertificateOfficer, Applicant]
    code: 200
    input: ["theme?", "owning_department_id?", "status?", "limit?", "offset?"]
    output: "Matter[]"
    side_effects: []

  - method: GET
    path: "/matters/{matter_id}"
    description: "Read a matter (returns published_version_id)."
    roles: [PlatformAdmin, CatalogManager, Reviewer, LeadReviewer, CertificateOfficer, Applicant]
    code: 200
    input: []
    output: Matter
    side_effects: []

  - method: POST
    path: "/matters/{matter_id}/versions"
    description: "Create a DRAFT MatterVersion."
    roles: [CatalogManager]
    code: 201
    input: [version_label, legal_basis, conditions, required_material_template_ids, statutory_time_limit_days, committed_time_limit_days, "warning_threshold_pct?", "fee_amount_cents?", channels, review_routing, "max_correction_rounds?", "correction_window_days?", certificate_template_id]
    output: MatterVersion
    side_effects: []

  - method: GET
    path: "/matters/{matter_id}/versions/{version_id}"
    description: "Read a single matter version."
    roles: [PlatformAdmin, CatalogManager, Reviewer, LeadReviewer, CertificateOfficer, Applicant]
    code: 200
    input: []
    output: MatterVersion
    side_effects: []

  - method: POST
    path: "/matters/{matter_id}/versions/{version_id}/publish"
    description: "Publish a draft version (auto-supersedes prior PUBLISHED version)."
    roles: [CatalogManager]
    code: 200
    input: []
    output: MatterVersion
    side_effects:
      - "MatterVersion.status -> PUBLISHED"
      - "prior PUBLISHED version (if any) -> SUPERSEDED in same request"
      - "Matter.current_published_version_id updated"

  - method: POST
    path: "/matters/{matter_id}/versions/{version_id}/retire"
    description: "Retire a published or superseded version."
    roles: [CatalogManager]
    code: 200
    input: []
    output: MatterVersion
    side_effects:
      - "MatterVersion.status -> RETIRED"
      - "if Matter has no other PUBLISHED version, Matter.status -> ARCHIVED"

  # --- MaterialTemplate ---
  - method: POST
    path: "/material-templates"
    description: "Create a draft material template."
    roles: [CatalogManager]
    code: 201
    input: [code, title, material_type, "form_url?", "example_url?", "e_form_schema?"]
    output: MaterialTemplate
    side_effects: []

  - method: POST
    path: "/material-templates/{id}/publish"
    description: "Publish a material template (required before any MatterVersion that references it can publish)."
    roles: [CatalogManager]
    code: 200
    input: []
    output: MaterialTemplate
    side_effects: []

  - method: GET
    path: "/material-templates"
    description: "List material templates."
    roles: [PlatformAdmin, CatalogManager, Reviewer, LeadReviewer, CertificateOfficer, Applicant]
    code: 200
    input: ["status?", "material_type?", "limit?", "offset?"]
    output: "MaterialTemplate[]"
    side_effects: []

  # --- CertificateTemplate ---
  - method: POST
    path: "/certificate-templates"
    description: "Create a draft certificate template."
    roles: [CertificateOfficer]
    code: 201
    input: [code, body_template, required_variables, "validity_days?", official_seal_id]
    output: CertificateTemplate
    side_effects: []

  - method: POST
    path: "/certificate-templates/{id}/publish"
    description: "Publish a certificate template."
    roles: [CertificateOfficer]
    code: 200
    input: []
    output: CertificateTemplate
    side_effects: []

  - method: GET
    path: "/certificate-templates"
    description: "List certificate templates."
    roles: [PlatformAdmin, CatalogManager, CertificateOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CertificateTemplate[]"
    side_effects: []

  # --- Application ---
  - method: POST
    path: "/applications"
    description: "Submit a new application against a published MatterVersion."
    roles: [Applicant]
    code: 201
    input: [matter_version_id, channel, submitted_materials]
    output: Application
    side_effects:
      - "creates Application in review_status=SUBMITTED, payment_status=PENDING (or PAID if fee==0)"
      - "writes AuditLog action=APPLICATION_SUBMIT"

  - method: GET
    path: "/applications/{id}"
    description: "Read application detail (includes derived sla, fee breakdown)."
    roles: [Applicant, Reviewer, LeadReviewer, PlatformAdmin]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: GET
    path: "/applications/{id}/sla"
    description: "Time-limit monitoring snapshot (reads time_limit_warning_evaluator)."
    roles: [Applicant, Reviewer, LeadReviewer, PlatformAdmin]
    code: 200
    input: []
    output: object
    side_effects: []

  - method: POST
    path: "/applications/{id}/withdraw"
    description: "Applicant withdraws (allowed only before any DISAGREED decision)."
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects:
      - "Application.review_status -> WITHDRAWN"
      - "ReviewTasks cascade to SKIPPED"
      - "if PAID and fee>0, payment_status -> REFUNDED"

  - method: POST
    path: "/applications/{id}/escalate"
    description: "Lead reviewer escalates a disagreement to parent department / PlatformAdmin."
    roles: [LeadReviewer]
    code: 200
    input: []
    output: Application
    side_effects: ["Application.review_status -> ESCALATED, all IN_PROGRESS ReviewTasks pause"]

  - method: POST
    path: "/applications/{id}/escalation-resolve"
    description: "PlatformAdmin resolves the escalation (final AGREED or DISAGREED)."
    roles: [PlatformAdmin]
    code: 200
    input: [decision]
    output: Application
    side_effects:
      - "drives Application to APPROVED or REJECTED, cascades into ReviewTask.SKIPPED for non-terminal tasks"
      - "on APPROVED: certificate_issue runs"

  # --- ReviewTask ---
  - method: GET
    path: "/applications/{id}/review-tasks"
    description: "List review tasks for an application."
    roles: [Reviewer, LeadReviewer, PlatformAdmin, Applicant]
    code: 200
    input: []
    output: "ReviewTask[]"
    side_effects: []

  - method: POST
    path: "/review-tasks/{id}/decide"
    description: "Reviewer files an opinion (AGREED or DISAGREED)."
    roles: [Reviewer, LeadReviewer]
    code: 200
    input: [decision, "opinion_text?"]
    output: ReviewTask
    side_effects:
      - "set ReviewTask.status = AGREED|DISAGREED, decided_at = now()"
      - "for SERIAL: next stage transitions PENDING -> IN_PROGRESS"
      - "trigger opinion_aggregation; may drive Application transition"

  # --- CorrectionNotice ---
  - method: POST
    path: "/applications/{id}/correction-notices"
    description: "Reviewer issues a correction notice (Application -> AWAITING_CORRECTION)."
    roles: [Reviewer, LeadReviewer]
    code: 201
    input: [deficiencies, issued_by_review_task_id]
    output: CorrectionNotice
    side_effects:
      - "Application.review_status -> AWAITING_CORRECTION"
      - "Application.correction_round += 1"
      - "AuditLog action=CORRECTION_ISSUE"

  - method: GET
    path: "/applications/{id}/correction-notices"
    description: "List correction notices for an application."
    roles: [Applicant, Reviewer, LeadReviewer, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CorrectionNotice[]"
    side_effects: []

  - method: POST
    path: "/applications/{id}/correction-notices/{cid}/resubmit"
    description: "Applicant resubmits materials for an open correction notice."
    roles: [Applicant]
    code: 200
    input: [submitted_materials]
    output: CorrectionNotice
    side_effects:
      - "CorrectionNotice.status -> RESOLVED"
      - "Application.review_status -> UNDER_REVIEW"
      - "Application.total_paused_seconds += (now - issued_at)"
      - "deadline_at recomputed via derive_application_deadline"

  # --- Certificate ---
  - method: GET
    path: "/applications/{id}/certificate"
    description: "Read the active Certificate for an application (if APPROVED)."
    roles: [Applicant, PlatformAdmin, CertificateOfficer]
    code: 200
    input: []
    output: Certificate
    side_effects: []

  - method: POST
    path: "/certificates/{id}/reissue"
    description: "Reissue a certificate; supersedes the source one."
    roles: [CertificateOfficer]
    code: 201
    input: []
    output: Certificate
    side_effects:
      - "old Certificate.superseded_by_certificate_id = new.id, status -> REISSUED"
      - "AuditLog action=CERT_REISSUE"

  - method: POST
    path: "/certificates/{id}/revoke"
    description: "Revoke an active certificate."
    roles: [PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: Certificate
    side_effects: ["Certificate.status -> REVOKED, AuditLog action=CERT_REVOKE"]

  - method: GET
    path: "/certificates/verify/{verification_code}"
    description: "Public verification by verification_code; returns minimal status snapshot."
    roles: [Applicant, PlatformAdmin, CertificateOfficer, Reviewer, LeadReviewer, CatalogManager]
    code: 200
    input: []
    output: object
    side_effects: []

  # --- ExternalEvent (synchronization) ---
  - method: POST
    path: "/_events/emit"
    description: "Inbound event from identity, e-signature, payment, or data-share platforms; idempotent."
    roles: [PlatformAdmin]
    code: 200
    input: [event_type, idempotency_key, subject_application_id, payload]
    output: ExternalEvent
    side_effects:
      - "IDENTITY_VERIFIED -> Application.identity_verified = true"
      - "PAYMENT_SETTLED -> Application.payment_status = PAID"
      - "if both prerequisites met, drive Application from SUBMITTED to UNDER_REVIEW"
      - "duplicate idempotency_key returns the previously stored ExternalEvent unchanged"

  # --- AuditLog ---
  - method: GET
    path: "/audit-logs"
    description: "Query audit log."
    roles: [PlatformAdmin]
    code: 200
    input: ["target_entity?", "target_id?", "action?", "limit?", "offset?"]
    output: "AuditLog[]"
    side_effects: []

  # --- Test-driving endpoints (clock + sweep) ---
  - method: POST
    path: "/_clock/advance"
    description: "Test-only: advance the server clock by N seconds; required to reach time-gated states."
    roles: [PlatformAdmin]
    code: 200
    input: [seconds]
    output: object
    side_effects: ["server now() advances; CorrectionNotice.due_at boundaries become observable"]

  - method: POST
    path: "/_sweep/run"
    description: "Test-only: run the periodic sweep (CorrectionNotice expiry, Certificate expiry, time-limit warning emission)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: object
    side_effects:
      - "every OPEN CorrectionNotice with now() > due_at flips to EXPIRED, cascading Application -> REJECTED"
      - "every ACTIVE Certificate with expires_at <= now() flips to EXPIRED"

  # --- Performance reporting ---
  - method: GET
    path: "/reports/sla-performance"
    description: "Aggregate SLA performance across applications (uses statutory variant for governance reporting)."
    roles: [PlatformAdmin]
    code: 200
    input: ["matter_id?", "department_id?", "since?", "until?"]
    output: object
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "Missing or empty X-User-Role / X-User-ID header"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Caller's role lacks permission for the endpoint"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path-parameter resource does not exist"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state that permits the requested transition"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC version supplied does not match current"

  - id: ERR_REVIEW_OUT_OF_ORDER
    http: 409
    condition: "SERIAL routing — attempting to decide a stage whose predecessor is not yet AGREED"

  - id: ERR_CORRECTION_EXPIRED
    http: 409
    condition: "Resubmit attempted after CorrectionNotice.due_at"

  - id: ERR_MAX_ROUNDS_REACHED
    http: 409
    condition: "Issue correction would exceed pinned MatterVersion.max_correction_rounds"

  - id: ERR_ESCALATION_NOT_PERMITTED
    http: 409
    condition: "Escalation requires PARALLEL routing with non-LEAD_DECIDES rule and an existing disagreement"

  - id: ERR_CERTIFICATE_ALREADY_REISSUED
    http: 409
    condition: "Source certificate already has superseded_by_certificate_id set"

  - id: ERR_MATERIAL_MISSING
    http: 422
    condition: "An application omits a required MaterialTemplate"

  - id: ERR_MATERIAL_TYPE_MISMATCH
    http: 422
    condition: "submitted material does not match required material_type or template not PUBLISHED"

  - id: ERR_EFORM_INCOMPLETE
    http: 422
    condition: "ONLINE channel application missing required e_form_schema keys"

  - id: ERR_CHANNEL_NOT_ALLOWED
    http: 422
    condition: "Submitted channel not present in pinned MatterVersion.channels"

  - id: ERR_DEFICIENCY_INVALID
    http: 422
    condition: "Correction deficiencies empty, or reference unknown material_template_id"

  - id: ERR_DEFICIENCY_UNRESOLVED
    http: 422
    condition: "Resubmit does not address every deficiency in the notice"

  - id: ERR_DEPENDENT_TEMPLATE_UNPUBLISHED
    http: 422
    condition: "Publish a MatterVersion whose required MaterialTemplate or CertificateTemplate is not yet PUBLISHED"

  - id: ERR_TIME_LIMIT_INVERSION
    http: 422
    condition: "committed_time_limit_days exceeds statutory_time_limit_days"

  - id: ERR_ROUTING_INVALID
    http: 422
    condition: "Routing definition violates mode/aggregation_rule/lead_department_id contract"

  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "Unique field collision (e.g., Department.code, Matter.code, MatterVersion.version_label within a matter)"

  - id: ERR_VALIDATION_FAILED
    http: 422
    condition: "Generic field-level validation (missing/format)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Cross-platform operator: manages departments, resolves escalations, ingests external events, runs reports, queries audit log."
    identity: "opaque"
    exclusive_operations:
      - "POST /departments"
      - "POST /applications/{id}/escalation-resolve"
      - "POST /certificates/{id}/revoke"
      - "POST /_events/emit"
      - "POST /_clock/advance"
      - "POST /_sweep/run"
      - "GET /audit-logs"
      - "GET /reports/sla-performance"
    shared_operations:
      - "GET /departments"
      - "GET /applications/{id}"
      - "GET /applications/{id}/sla"
      - "GET /applications/{id}/review-tasks"
      - "GET /applications/{id}/correction-notices"
      - "GET /applications/{id}/certificate"

  - name: CatalogManager
    description: "Catalog owner: defines matters, versions, material templates."
    identity: "entity_backed:Department"
    exclusive_operations:
      - "POST /matters"
      - "POST /matters/{matter_id}/versions"
      - "POST /matters/{matter_id}/versions/{version_id}/publish"
      - "POST /matters/{matter_id}/versions/{version_id}/retire"
      - "POST /material-templates"
      - "POST /material-templates/{id}/publish"
    shared_operations:
      - "GET /matters"
      - "GET /matters/{matter_id}"
      - "GET /matters/{matter_id}/versions/{version_id}"
      - "GET /material-templates"
      - "GET /certificate-templates"

  - name: Reviewer
    description: "Departmental reviewer: decides assigned ReviewTasks, issues correction notices."
    identity: "entity_backed:Department"
    exclusive_operations: []
    shared_operations:
      - "POST /review-tasks/{id}/decide"
      - "POST /applications/{id}/correction-notices"
      - "GET /applications/{id}"
      - "GET /applications/{id}/sla"
      - "GET /applications/{id}/review-tasks"
      - "GET /applications/{id}/correction-notices"

  - name: LeadReviewer
    description: "Designated lead-department reviewer: same as Reviewer plus escalation."
    identity: "entity_backed:Department"
    exclusive_operations:
      - "POST /applications/{id}/escalate"
    shared_operations:
      - "POST /review-tasks/{id}/decide"
      - "POST /applications/{id}/correction-notices"
      - "GET /applications/{id}"
      - "GET /applications/{id}/sla"
      - "GET /applications/{id}/review-tasks"
      - "GET /applications/{id}/correction-notices"

  - name: CertificateOfficer
    description: "Owns certificate templates and reissue workflow. Cannot review or escalate (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /certificate-templates"
      - "POST /certificate-templates/{id}/publish"
      - "POST /certificates/{id}/reissue"
    shared_operations:
      - "GET /certificate-templates"
      - "GET /applications/{id}/certificate"
      - "GET /certificates/verify/{verification_code}"

  - name: Applicant
    description: "End user submitting and tracking applications."
    identity: "opaque"
    exclusive_operations:
      - "POST /applications"
      - "POST /applications/{id}/withdraw"
      - "POST /applications/{id}/correction-notices/{cid}/resubmit"
    shared_operations:
      - "GET /applications/{id}"
      - "GET /applications/{id}/sla"
      - "GET /applications/{id}/review-tasks"
      - "GET /applications/{id}/correction-notices"
      - "GET /applications/{id}/certificate"
      - "GET /matters"
      - "GET /matters/{matter_id}"
      - "GET /matters/{matter_id}/versions/{version_id}"
      - "GET /material-templates"
      - "GET /departments"
      - "GET /certificates/verify/{verification_code}"

  # NOTE — Segregation of duties: a single user (X-User-ID) acting as Reviewer for a
  # specific Application MUST NOT also be the Applicant of that Application. This is
  # enforced at decide / correction-issue / escalate time.
