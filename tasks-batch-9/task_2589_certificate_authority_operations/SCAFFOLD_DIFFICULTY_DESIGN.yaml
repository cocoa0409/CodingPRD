      - name: dcv_validation_gated_on_subscriber_account_status
        grounds:
          - validations[priority=33]
          - state_machines.Subscriber.ACTIVE_to_SUSPENDED
          - state_machines.Subscriber.SUSPENDED_to_ACTIVE
          - state_machines.DomainAuthorization.PENDING_to_VALIDATED
          - entities.Subscriber.fields.revocation_pending_count
        distinguishing_aspect: |
          A different entity pair, DomainAuthorization -> Subscriber, and a REVERSIBLE
          dependency: the guard is the subscriber's account_status, which is itself a derived
          cascade of the pending-revocation count. Denying one of the two pending revocations
          drops the count below 2, returns the subscriber to ACTIVE and lets the identical
          validate call succeed - so the same request is rejected and then accepted with no
          change to the authorization itself.
        test_recipe:
          setup:
