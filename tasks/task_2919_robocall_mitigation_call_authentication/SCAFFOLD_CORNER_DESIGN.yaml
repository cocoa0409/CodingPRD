            - "Provider.${prov_id}.auth_posture == SIGNING_SUSPENDED (no ACTIVE certificate yet, so the ladder stops at step 1)"

      - name: notice_investigation_rejects_a_customer_of_another_provider
        claim_type: cross_entity_validation
        grounds:
          - "validations[priority=34]"
          - errors[ERR_CUSTOMER_PROVIDER_MISMATCH]
          - state_machines.IllegalTrafficNotice.NOTIFIED_to_UNDER_INVESTIGATION
        distinguishing_aspect: "Validity depends on a different entity's provider_id: attributing provider A's notice to provider B's customer is 422 ERR_CUSTOMER_PROVIDER_MISMATCH and leaves the notice NOTIFIED, while the same call with A's own customer succeeds."
        test_recipe:
          setup:
            - "Provider A with customer A1, provider B with customer B1, and one illegal-traffic notice against provider A"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Notice Provider A", provider_type: "GATEWAY" }
              as: Regulator
              captures: { prov_a_id: $.data.id }
            - call: "POST /rmd/providers"
              payload: { legal_name: "Notice Provider B", provider_type: "GATEWAY" }
              as: Regulator
              captures: { prov_b_id: $.data.id }
            - call: "POST /rmd/customers"
              payload: { provider_id: "${prov_a_id}", legal_name: "A Side Co", contact_email: "ops@aside.example", kyc_evidence_level: "CONTRACT_ONLY" }
              as: ProviderAdmin
              as_user_id: "${prov_a_id}"
              captures: { cust_a_id: $.data.id }
            - call: "POST /rmd/customers"
              payload: { provider_id: "${prov_b_id}", legal_name: "B Side Co", contact_email: "ops@bside.example", kyc_evidence_level: "CONTRACT_ONLY" }
              as: ProviderAdmin
              as_user_id: "${prov_b_id}"
              captures: { cust_b_id: $.data.id }
            - call: "POST /rmd/illegal-traffic-notices"
              payload: { provider_id: "${prov_a_id}", calling_number: "+12025550701", description: "Prerecorded loan offers reported by three carriers" }
              as: Regulator
              captures: { notice_id: $.data.id }
          trigger:
            - call: "POST /rmd/illegal-traffic-notices/${notice_id}/investigate"
              payload: { customer_id: "${cust_b_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              expect: { status: 422, error_id: ERR_CUSTOMER_PROVIDER_MISMATCH }
            - call: "POST /rmd/illegal-traffic-notices/${notice_id}/investigate"
              payload: { customer_id: "${cust_a_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "The first trigger is 422 with data.error_id == ERR_CUSTOMER_PROVIDER_MISMATCH and IllegalTrafficNotice.${notice_id}.state stays NOTIFIED with customer_id null"
            - "The second trigger is 200 and IllegalTrafficNotice.${notice_id}.state == UNDER_INVESTIGATION with customer_id == ${cust_a_id}"
            - "IllegalTrafficNotice.${notice_id}.mitigation_deadline_at == 2026-08-12T00:00:00Z (notified_at + 48h, unchanged by either call)"
            - "Provider.${prov_a_id}.open_notice_count == 1 and Provider.${prov_b_id}.open_notice_count == 0"

      - name: observation_with_a_future_window_end_is_rejected
        claim_type: temporal_validation
        grounds:
          - "validations[priority=29]"
          - errors[ERR_WINDOW_IN_FUTURE]
        distinguishing_aspect: "A monitoring window may end exactly at the logical clock but not after it: window_end 2026-08-10T00:00:01Z against a clock of 2026-08-10T00:00:00Z is 422 ERR_WINDOW_IN_FUTURE, and no subscore is stored."
        test_recipe:
          setup:
            - "One provider and one customer; clock at 2026-08-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Future Window Voice", provider_type: "FACILITIES_BASED" }
              as: Regulator
              captures: { prov_id: $.data.id }
            - call: "POST /rmd/customers"
              payload: { provider_id: "${prov_id}", legal_name: "Future Co", contact_email: "ops@future.example", kyc_evidence_level: "CONTRACT_ONLY" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /rmd/traffic-observations"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", window_start: "2026-08-09T00:00:00Z", window_end: "2026-08-10T00:00:01Z", total_call_count: 100, short_duration_call_count: 90, unanswered_call_count: 90, complaint_count: 5 }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
