# =============================================================================
# Task 2023 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances each = 18 instances.
# All setup chains drive empty-DB -> precondition using only §1.5 endpoints.
# Server clock default 2026-08-01T00:00:00Z unless a recipe sets it.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: allocation_basis_backlog_vs_usage
        grounds:
          - calculations.fair_share_allocation
          - entities.ManufacturerLine.fields.allocation_policy
          - entities.Customer.fields.trailing_12mo_component_usage_units
        distinguishing_aspect: |
          Same supply (90) and identical booked quantities (1000 + 1000) produce
          different splits depending on the line's allocation_policy variant:
          BACKLOG_BASIS yields 45/45 while USAGE_BASIS yields 68/22 — this
          instance is on the Part/OrderLine (allocation) domain, unlike the
          claim-ledger instance below.
        test_recipe:
          setup:
            - "Two lines (BACKLOG_BASIS and USAGE_BASIS), each with one part and one AVAILABLE franchised lot of 90 units"
            - "Customer A usage 300, Customer B usage 100; each part has two ACKNOWLEDGED single-line orders of qty 1000 (A first, B second)"
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-B", name: "Backlog Line", sourcing_channel: "FRANCHISED", allocation_policy: "BACKLOG_BASIS" }
              as: DistributorAdmin
              captures: { line_b: $.data.id }
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-U", name: "Usage Line", sourcing_channel: "FRANCHISED", allocation_policy: "USAGE_BASIS" }
              as: DistributorAdmin
              captures: { line_u: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_b}", part_number: "PB-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_b: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_u}", part_number: "PU-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_u: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_b}", date_code: "202601", qty_received: 90, source_type: "FRANCHISED" }
              as: WarehouseOps
            - call: "POST /lots"
              payload: { part_id: "${part_u}", date_code: "202601", qty_received: 90, source_type: "FRANCHISED" }
              as: WarehouseOps
            - call: "POST /customers"
              payload: { name: "Cust A", credit_limit_cents: 100000000, trailing_12mo_component_usage_units: 300 }
              as: DistributorAdmin
              captures: { cust_a: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cust B", credit_limit_cents: 100000000, trailing_12mo_component_usage_units: 100 }
              as: DistributorAdmin
              captures: { cust_b: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_a}", lines: [ { part_id: "${part_b}", quantity: 1000, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_ba: $.data.id }
            - call: "POST /orders/${o_ba}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "POST /orders"
              payload: { customer_id: "${cust_b}", lines: [ { part_id: "${part_b}", quantity: 1000, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_bb: $.data.id }
            - call: "POST /orders/${o_bb}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "POST /orders"
              payload: { customer_id: "${cust_a}", lines: [ { part_id: "${part_u}", quantity: 1000, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_ua: $.data.id }
            - call: "POST /orders/${o_ua}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "POST /orders"
              payload: { customer_id: "${cust_b}", lines: [ { part_id: "${part_u}", quantity: 1000, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_ub: $.data.id }
            - call: "POST /orders/${o_ub}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "GET /order-lines?order_id=${o_ba}"
              as: DistributorAdmin
              captures: { l_ba: "$.data[0].id" }
            - call: "GET /order-lines?order_id=${o_bb}"
              as: DistributorAdmin
              captures: { l_bb: "$.data[0].id" }
            - call: "GET /order-lines?order_id=${o_ua}"
              as: DistributorAdmin
              captures: { l_ua: "$.data[0].id" }
            - call: "GET /order-lines?order_id=${o_ub}"
              as: DistributorAdmin
              captures: { l_ub: "$.data[0].id" }
            - call: "GET /parts/${part_b}"
              as: DistributorAdmin
              captures: { part_b_v: $.data.version }
            - call: "GET /parts/${part_u}"
              as: DistributorAdmin
              captures: { part_u_v: $.data.version }
          trigger:
            - call: "POST /allocation-runs"
              payload: { part_id: "${part_b}", expected_part_version: "${part_b_v}" }
              as: DistributorAdmin
              captures: { run_b: $.data.id }
            - call: "POST /allocation-runs"
              payload: { part_id: "${part_u}", expected_part_version: "${part_u_v}" }
              as: DistributorAdmin
              captures: { run_u: $.data.id }
          assert:
            - "AllocationRun.${run_b}.lines == [ { order_line_id: ${l_ba}, allocated_qty: 45 }, { order_line_id: ${l_bb}, allocated_qty: 45 } ]"
            - "AllocationRun.${run_u}.lines == [ { order_line_id: ${l_ua}, allocated_qty: 68 }, { order_line_id: ${l_ub}, allocated_qty: 22 } ]"
            - "AllocationRun.${run_b}.total_supply_qty == 90 and AllocationRun.${run_b}.total_demand_qty == 2000"
            - "AllocationRun.${run_u}.total_supply_qty == 90 and AllocationRun.${run_u}.total_demand_qty == 2000"
            - "AllocationRun.${run_b}.lines[0].allocated_qty != AllocationRun.${run_u}.lines[0].allocated_qty (45 vs 68 for identical booked quantities)"

      - name: claim_provisional_vs_audited_final
        grounds:
          - calculations.ship_debit_claim_amounts
          - state_machines.ShipAndDebitClaim.SUBMITTED_to_SUPPLIER_APPROVED
          - entities.ShipAndDebitClaim.fields.amount_provisional_cents
          - entities.ShipAndDebitClaim.fields.amount_final_cents
        distinguishing_aspect: |
          Identical claim data yields two different amounts: the provisional
          amount uses the registered cost (6000 cents) while the final amount
          uses the supplier-audited cost (5600 cents) — this instance is on the
          ShipAndDebitClaim (ledger) domain, unlike the allocation instance.
        test_recipe:
          setup:
            - "Franchised line/part (standard 1000, book 1500), AVAILABLE lot of 100, customer with ample credit"
            - "APPROVED registration: registered cost 700, max qty 20, window [2026-08-01, 2026-12-31]"
            - "ACKNOWLEDGED order with one line qty 20, fully allocated"
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-F", name: "Franchise Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_f: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_f}", part_number: "PF-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_f: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_f}", date_code: "202601", qty_received: 100, source_type: "FRANCHISED" }
              as: WarehouseOps
            - call: "POST /customers"
              payload: { name: "Cust C", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_c: $.data.id }
            - call: "POST /design-registrations"
              payload: { customer_id: "${cust_c}", part_id: "${part_f}", end_customer_name: "EndCo", registered_cost_cents: 700, max_registered_qty: 20, valid_from: "2026-08-01", valid_to: "2026-12-31" }
              as: SalesRep
              captures: { reg_c: $.data.id }
            - call: "POST /design-registrations/${reg_c}/decision"
              payload: { decision: "APPROVE" }
              as: SupplierAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_c}", lines: [ { part_id: "${part_f}", quantity: 20, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_c: $.data.id }
            - call: "POST /orders/${o_c}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "GET /order-lines?order_id=${o_c}"
              as: DistributorAdmin
              captures: { l_c: "$.data[0].id" }
            - call: "GET /parts/${part_f}"
              as: DistributorAdmin
              captures: { part_f_v: $.data.version }
            - call: "POST /allocation-runs"
              payload: { part_id: "${part_f}", expected_part_version: "${part_f_v}" }
              as: DistributorAdmin
              captures: { run_c: $.data.id }
            - call: "POST /allocation-runs/${run_c}/publish"
              payload: {}
              as: DistributorAdmin
          trigger:
            - call: "POST /orders/${o_c}/lines/${l_c}/ship"
              payload: { qty: 20 }
              as: WarehouseOps
            - call: "GET /claims?order_line_id=${l_c}"
              as: DistributorAdmin
              captures: { claim_c: "$.data[0].id" }
            - call: "POST /claims/${claim_c}/supplier-decision"
              payload: { decision: "APPROVE", audited_cost_cents: 720 }
              as: SupplierAdmin
          assert:
            - "ShipAndDebitClaim.${claim_c}.amount_provisional_cents == 6000"
            - "ShipAndDebitClaim.${claim_c}.amount_final_cents == 5600"
            - "ShipAndDebitClaim.${claim_c}.amount_provisional_cents != ShipAndDebitClaim.${claim_c}.amount_final_cents"
            - "ShipAndDebitClaim.${claim_c}.status == SUPPLIER_APPROVED"
            - "DesignRegistration.${reg_c}.registered_qty_remaining == 0 and .status == EXHAUSTED"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: buyback_credit_tier_crossing
        grounds:
          - calculations.buyback_credit
          - state_machines.BuyBackRequest.APPROVED_to_RECEIVED
          - entities.BuyBackRequest.fields.provisional_credit_cents
          - entities.BuyBackRequest.fields.final_credit_cents
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs with non-linear interaction: the credit nests
          min(paid price, book price) inside a tiered fee selected by
          days-since-ship with a kind branch; the receipt lands in a later tier
          so final (11250) diverges from provisional (13500).
        test_recipe:
          setup:
            - "Franchised line/part (book 1500, standard 1000), lot of 100 AVAILABLE"
            - "Customer with trailing_12mo_purchases_cents 1000000 (cap 150000) and ample credit"
            - "One line qty 10 ALLOCATED then SHIPPED on 2026-08-01 (last_shipped_at 2026-08-01)"
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-BB", name: "BuyBack Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_bb2: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_bb2}", part_number: "PBB-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_bb: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_bb}", date_code: "202601", qty_received: 100, source_type: "FRANCHISED" }
              as: WarehouseOps
            - call: "POST /customers"
              payload: { name: "Cust BB", credit_limit_cents: 100000000, trailing_12mo_purchases_cents: 1000000 }
              as: DistributorAdmin
              captures: { cust_bb: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_bb}", lines: [ { part_id: "${part_bb}", quantity: 10, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_bb2: $.data.id }
            - call: "POST /orders/${o_bb2}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "GET /order-lines?order_id=${o_bb2}"
              as: DistributorAdmin
              captures: { l_bb2: "$.data[0].id" }
            - call: "GET /parts/${part_bb}"
              as: DistributorAdmin
              captures: { part_bb_v: $.data.version }
            - call: "POST /allocation-runs"
              payload: { part_id: "${part_bb}", expected_part_version: "${part_bb_v}" }
              as: DistributorAdmin
              captures: { run_bb: $.data.id }
            - call: "POST /allocation-runs/${run_bb}/publish"
              payload: {}
              as: DistributorAdmin
            - call: "POST /orders/${o_bb2}/lines/${l_bb2}/ship"
              payload: { qty: 10 }
              as: WarehouseOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: DistributorAdmin
          trigger:
            - call: "POST /buy-backs"
              payload: { customer_id: "${cust_bb}", order_line_id: "${l_bb2}", kind: "EXCESS_RETURN", qty: 10 }
              as: SalesRep
              captures: { bb_1: $.data.id }
            - call: "POST /buy-backs/${bb_1}/decision"
              payload: { decision: "APPROVE" }
              as: DistributorAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-09T00:00:00Z" }
              as: DistributorAdmin
            - call: "POST /buy-backs/${bb_1}/receive"
              payload: { received_qty: 10, lot_date_code: "202601" }
              as: WarehouseOps
          assert:
            - "BuyBackRequest.${bb_1}.price_basis_cents == 1500"
            - "BuyBackRequest.${bb_1}.fee_pct == 0.10 (request at day 50, tier 1)"
            - "BuyBackRequest.${bb_1}.provisional_credit_cents == 13500"
            - "BuyBackRequest.${bb_1}.final_credit_cents == 11250 (receipt at day 100, tier 2 fee 0.25)"
            - "BuyBackRequest.${bb_1}.status == RECEIVED"
            - "GET /lots?part_id=${part_bb} returns a second lot with source_type OPEN_MARKET, authenticity PENDING_INSPECTION, status IN_INSPECTION, qty_received == 10"
            - "OrderLine.${l_bb2}.returned_qty == 10"

      - name: allocation_floor_then_remainder_waterfall
        grounds:
          - calculations.fair_share_allocation
          - state_machines.AllocationRun.PROVISIONAL_to_PUBLISHED
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: raw shares are floored
          per line first (30/40/30 from 30.3/40.4/30.3), then the single
          remainder unit is distributed by a one-unit waterfall ordered by
          created_at ASC (31/40/30); an exact-split-then-round interpretation
          would strand the 101st unit. Different mode from the tiered-fee
          buyback instance.
        test_recipe:
          setup:
            - "BACKLOG_BASIS line/part with one AVAILABLE lot of 101 units"
            - "Three customers; three ACKNOWLEDGED single-line orders qty 60, 80, 60 created in that order"
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-R", name: "Remainder Line", sourcing_channel: "FRANCHISED", allocation_policy: "BACKLOG_BASIS" }
              as: DistributorAdmin
              captures: { line_r: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_r}", part_number: "PR-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_r: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_r}", date_code: "202601", qty_received: 101, source_type: "FRANCHISED" }
              as: WarehouseOps
            - call: "POST /customers"
              payload: { name: "Cust R1", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_r1: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cust R2", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_r2: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cust R3", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_r3: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_r1}", lines: [ { part_id: "${part_r}", quantity: 60, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_r1: $.data.id }
            - call: "POST /orders/${o_r1}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "POST /orders"
              payload: { customer_id: "${cust_r2}", lines: [ { part_id: "${part_r}", quantity: 80, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_r2: $.data.id }
            - call: "POST /orders/${o_r2}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "POST /orders"
              payload: { customer_id: "${cust_r3}", lines: [ { part_id: "${part_r}", quantity: 60, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_r3: $.data.id }
            - call: "POST /orders/${o_r3}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "GET /order-lines?order_id=${o_r1}"
              as: DistributorAdmin
              captures: { l_r1: "$.data[0].id" }
            - call: "GET /order-lines?order_id=${o_r2}"
              as: DistributorAdmin
              captures: { l_r2: "$.data[0].id" }
            - call: "GET /order-lines?order_id=${o_r3}"
              as: DistributorAdmin
              captures: { l_r3: "$.data[0].id" }
            - call: "GET /parts/${part_r}"
              as: DistributorAdmin
              captures: { part_r_v: $.data.version }
          trigger:
            - call: "POST /allocation-runs"
              payload: { part_id: "${part_r}", expected_part_version: "${part_r_v}" }
              as: DistributorAdmin
              captures: { run_r: $.data.id }
          assert:
            - "AllocationRun.${run_r}.total_supply_qty == 101 and .total_demand_qty == 200"
            - "AllocationRun.${run_r}.lines == [ { order_line_id: ${l_r1}, allocated_qty: 31 }, { order_line_id: ${l_r2}, allocated_qty: 40 }, { order_line_id: ${l_r3}, allocated_qty: 30 } ]"
            - "The remainder unit went to the earliest-created line (${l_r1}: 31 = floor(30.3) + 1), not to the largest line"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: lot_quarantine_bake_cycle
        grounds:
          - state_machines.InventoryLot.AVAILABLE_to_QUARANTINED
          - state_machines.InventoryLot.QUARANTINED_to_AVAILABLE
          - calculations.msl_exposure_accrual
        distinguishing_aspect: |
          InventoryLot cycles AVAILABLE -> QUARANTINED -> AVAILABLE (quarantine
          then bake), a true cycle on the lot entity — distinct from the claim
          entity's SUBMITTED -> DISPUTED -> SUBMITTED negotiation cycle.
        test_recipe:
          setup:
            - "Franchised part with floor_life_hours 100; AVAILABLE lot of 50"
            - "Exposure interval opened at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-M", name: "MSL Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_m: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_m}", part_number: "PM-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_m: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_m}", date_code: "202601", qty_received: 50, source_type: "FRANCHISED" }
              as: WarehouseOps
              captures: { lot_m: $.data.id }
            - call: "POST /lots/${lot_m}/exposures"
              payload: { note: "bag opened" }
              as: WarehouseOps
              captures: { exp_m: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T04:00:00Z" }
              as: DistributorAdmin
          trigger:
            - call: "GET /lots/${lot_m}"
              as: WarehouseOps
              captures: { lot_m_status: $.data.status }
            - call: "POST /lots/${lot_m}/exposures/${exp_m}/seal"
              payload: {}
              as: WarehouseOps
            - call: "POST /lots/${lot_m}/bake"
              payload: {}
              as: WarehouseOps
            - call: "POST /lots/${lot_m}/exposures"
              payload: { note: "second open after bake" }
              as: WarehouseOps
              captures: { exp_m2: $.data.id }
          assert:
            - "After the 100-hour sweep the lot is QUARANTINED with msl_exposure_hours == 100 (${lot_m_status} == QUARANTINED)"
            - "After bake the lot is AVAILABLE with msl_exposure_hours == 0 and last_baked_at == 2026-08-05T04:00:00Z"
            - "A new exposure interval ${exp_m2} opens successfully on the baked lot (cycle continues), opened_at == 2026-08-05T04:00:00Z"

      - name: claim_dispute_resubmit_cycle
        grounds:
          - state_machines.ShipAndDebitClaim.SUBMITTED_to_DISPUTED
          - state_machines.ShipAndDebitClaim.DISPUTED_to_SUBMITTED
          - state_machines.ShipAndDebitClaim.SUBMITTED_to_SUPPLIER_APPROVED
        distinguishing_aspect: |
          ShipAndDebitClaim cycles SUBMITTED -> DISPUTED -> SUBMITTED (supplier
          dispute then distributor resubmission), a negotiation loop on the
          claim entity — distinct from the lot's physical-handling cycle.
        test_recipe:
          setup:
            - "Franchised part (standard 1000), lot of 100, APPROVED registration cost 700 max qty 20 window [2026-08-01, 2026-12-31]"
            - "ACKNOWLEDGED order line qty 10, allocated, then shipped 10 -> claim SUBMITTED"
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-D", name: "Dispute Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_d: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_d}", part_number: "PD-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_d: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_d}", date_code: "202601", qty_received: 100, source_type: "FRANCHISED" }
              as: WarehouseOps
            - call: "POST /customers"
              payload: { name: "Cust D", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_d: $.data.id }
            - call: "POST /design-registrations"
              payload: { customer_id: "${cust_d}", part_id: "${part_d}", end_customer_name: "EndCo", registered_cost_cents: 700, max_registered_qty: 20, valid_from: "2026-08-01", valid_to: "2026-12-31" }
              as: SalesRep
              captures: { reg_d: $.data.id }
            - call: "POST /design-registrations/${reg_d}/decision"
              payload: { decision: "APPROVE" }
              as: SupplierAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_d}", lines: [ { part_id: "${part_d}", quantity: 10, ship_date: "2026-10-01" } ] }
              as: SalesRep
