    output: SterilizationCycle
    side_effects: ["status initialized to IN_PROGRESS"]

  - method: GET
    path: "/piercing-services/sterilization-cycles"
    description: "List sterilization cycles, optionally filtered by store"
    roles: [AnyAuthenticated]
    code: 200
    input: ["store_location_id?"]
    output: "SterilizationCycle[]"
    side_effects: []

  - method: GET
    path: "/piercing-services/sterilization-cycles/{cycleId}"
    description: "Get one sterilization cycle"
    roles: [AnyAuthenticated]
    code: 200
    input: []
    output: SterilizationCycle
    side_effects: []

