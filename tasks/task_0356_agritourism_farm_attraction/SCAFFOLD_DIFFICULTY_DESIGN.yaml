              payload: {}
              as: GateAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "AdmissionWindow.${window_id}.status == CANCELLED"
            - "Reservation.${res_id}.status == CANCELLED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # --- Instance 1: buffered-interval window overlap ---
      - name: window_overlap_within_buffer_rejected
        grounds:
          - validations[priority=11.5]
          - entities.Farm.fields.window_buffer_minutes
          - errors[ERR_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Buffered-interval semantics on AdmissionWindow: with window_buffer_minutes=30, a new window
          starting only 15 minutes after an existing window's end collides (gap < buffer) and is rejected
          ERR_WINDOW_OVERLAP; a window starting exactly 30 minutes after (gap == buffer) is allowed.
        test_recipe:
          setup:
            - "Farm with window_buffer_minutes=30; an existing window 14:00-16:00; a valid 16:30-18:00 window also exists."
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "Buffer Farm", window_buffer_minutes: 30 }
              as: FarmManager
              captures: { farm_id: $.data.id }
            - call: "POST /farms/${farm_id}/admission-windows"
              payload: { starts_at: "2026-10-11T14:00:00Z", ends_at: "2026-10-11T16:00:00Z", capacity: 10 }
              as: FarmManager
              captures: { w1: $.data.id }
            - call: "POST /farms/${farm_id}/admission-windows"
              payload: { starts_at: "2026-10-11T16:30:00Z", ends_at: "2026-10-11T18:00:00Z", capacity: 10 }
              as: FarmManager
              captures: { w_ok: $.data.id }
          trigger:
            - call: "POST /farms/${farm_id}/admission-windows"
              payload: { starts_at: "2026-10-11T16:15:00Z", ends_at: "2026-10-11T18:30:00Z", capacity: 10 }
              as: FarmManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_WINDOW_OVERLAP"
            - "AdmissionWindow.${w_ok}.status == SCHEDULED"

      # --- Instance 2: plain half-open season-pass validity overlap ---
      - name: season_pass_validity_overlap_rejected_adjacency_ok
        grounds:
          - validations[priority=11.6]
          - entities.SeasonPass.fields.valid_from
          - entities.SeasonPass.fields.valid_until
          - errors[ERR_PASS_OVERLAP]
        distinguishing_aspect: |
          Plain half-open interval semantics (NO buffer) on SeasonPass, a different resource: a visitor's
          second ACTIVE pass whose [valid_from, valid_until) overlaps the first is rejected ERR_PASS_OVERLAP,
          but a back-to-back pass starting exactly when the first ends (valid_from == prior valid_until, zero
          gap) is allowed — adjacency does NOT collide under half-open semantics.
        test_recipe:
          setup:
            - "Farm OPEN with ACTIVE policy; a visitor with one ACTIVE season pass valid 2026-10-01..2026-10-15;"
            - "a second back-to-back pass 2026-10-15..2026-11-01 is allowed (adjacency)."
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "Pass Overlap Farm" }
              as: FarmManager
              captures: { farm_id: $.data.id }
            - call: "POST /farms/${farm_id}/pricing-policies"
              payload: { adult_admission_cents: 2000, child_admission_cents: 1200, hayride_pass_cents: 800, maze_pass_cents: 600, upick_pass_cents: 1000, pumpkin_per_lb_cents: 150, pumpkin_flat_each_cents: 2500, season_pass_price_cents: 8000 }
              as: FarmManager
              captures: { policy_id: $.data.id }
            - call: "POST /pricing-policies/${policy_id}/activate"
              payload: {}
              as: FarmManager
            - call: "POST /visitors"
              payload: { email: "ov@x.com", full_name: "Ollie Overlap" }
              as: FarmManager
              captures: { visitor_id: $.data.id }
            - call: "POST /farms/${farm_id}/season-passes"
              payload: { visitor_id: "${visitor_id}", valid_from: "2026-10-01T00:00:00Z", valid_until: "2026-10-15T00:00:00Z" }
              as: FarmManager
              captures: { pass1: $.data.id }
            - call: "POST /farms/${farm_id}/season-passes"
              payload: { visitor_id: "${visitor_id}", valid_from: "2026-10-15T00:00:00Z", valid_until: "2026-11-01T00:00:00Z" }
              as: FarmManager
              captures: { pass2: $.data.id }
          trigger:
            - call: "POST /farms/${farm_id}/season-passes"
              payload: { visitor_id: "${visitor_id}", valid_from: "2026-10-10T00:00:00Z", valid_until: "2026-10-20T00:00:00Z" }
              as: FarmManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PASS_OVERLAP"
            - "SeasonPass.${pass2}.status == ACTIVE"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # --- Instance 1: seat conservation (create then cancel leaves capacity identity) ---
      - name: seat_conservation_create_then_cancel
        grounds:
          - state_machines.Reservation.PENDING_to_CANCELLED
          - calculations.window_seats
          - entities.AdmissionWindow.fields.seats_available
          - entities.AdmissionWindow.fields.capacity
        distinguishing_aspect: |
          Conserved quantity = total seats: the invariant capacity == seats_available + seats_held +
          seats_committed must hold before and after. A forward create (held += 3, available -= 3) paired
          with its compensating cancel (held -= 3, available += 3) on a capacity-10 window returns
          seats_available to exactly 10 with zero drift.
        test_recipe:
          setup:
            - "Farm OPEN; window capacity 10, seats_available 10; create a 3-participant PENDING reservation, then cancel it."
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "Seat Farm" }
              as: FarmManager
              captures: { farm_id: $.data.id }
            - call: "POST /farms/${farm_id}/pricing-policies"
              payload: { adult_admission_cents: 2000, child_admission_cents: 1200, hayride_pass_cents: 800, maze_pass_cents: 600, upick_pass_cents: 1000, pumpkin_per_lb_cents: 150, pumpkin_flat_each_cents: 2500, season_pass_price_cents: 8000 }
              as: FarmManager
              captures: { policy_id: $.data.id }
            - call: "POST /pricing-policies/${policy_id}/activate"
              payload: {}
              as: FarmManager
            - call: "POST /farms/${farm_id}/admission-windows"
              payload: { starts_at: "2026-10-11T14:00:00Z", ends_at: "2026-10-11T16:00:00Z", capacity: 10 }
              as: FarmManager
              captures: { window_id: $.data.id, win_v0: $.data.version }
            - call: "POST /visitors"
              payload: { email: "seat@x.com", full_name: "Sam Seat" }
              as: FarmManager
              captures: { visitor_id: $.data.id }
            - call: "POST /reservations"
              payload: { window_id: "${window_id}", visitor_id: "${visitor_id}", adult_count: 2, child_count: 1, expected_window_version: "${win_v0}" }
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: Visitor
              as_user_id: "${visitor_id}"
          assert:
            - "Reservation.${res_id}.status == CANCELLED"
            - "AdmissionWindow.${window_id}.seats_held == 0"
            - "AdmissionWindow.${window_id}.seats_committed == 0"
            - "AdmissionWindow.${window_id}.seats_available == 10"

      # --- Instance 2: refund-ledger mirror invariant (closure credits both sides equally) ---
      - name: refund_ledger_mirror_wallet_equals_farm_refunds
        grounds:
          - state_machines.Farm.OPEN_to_CLOSED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - entities.Visitor.fields.wallet_credit_cents
          - entities.Farm.fields.refunds_issued_cents
        distinguishing_aspect: |
          A different conserved quantity = refund cents: the closure cascade credits Visitor.wallet_credit_cents
          and Farm.refunds_issued_cents by the SAME admission amount, so the global identity
          Farm.refunds_issued_cents == sum of all closure-credited visitor wallet cents holds with no drift.
          Two confirmed reservations (5200 and 2000) cancelled by one closure leave wallet sums == farm ledger == 7200.
        test_recipe:
          setup:
            - "Farm OPEN; window capacity 10; reservation A (2 adult 1 child, admission 5200) CONFIRMED for visitor A;"
            - "reservation B (1 adult, admission 2000) CONFIRMED for visitor B; closure cancels both."
            - "Clock 2026-10-10T12:00Z; window 2026-10-11T14:00Z within affected span."
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "Ledger Farm" }
              as: FarmManager
              captures: { farm_id: $.data.id }
            - call: "POST /farms/${farm_id}/pricing-policies"
              payload: { adult_admission_cents: 2000, child_admission_cents: 1200, hayride_pass_cents: 800, maze_pass_cents: 600, upick_pass_cents: 1000, pumpkin_per_lb_cents: 150, pumpkin_flat_each_cents: 2500, season_pass_price_cents: 8000 }
              as: FarmManager
              captures: { policy_id: $.data.id }
            - call: "POST /pricing-policies/${policy_id}/activate"
              payload: {}
              as: FarmManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T12:00:00Z" }
              as: FarmManager
            - call: "POST /farms/${farm_id}/admission-windows"
              payload: { starts_at: "2026-10-11T14:00:00Z", ends_at: "2026-10-11T16:00:00Z", capacity: 10 }
              as: FarmManager
              captures: { window_id: $.data.id, win_v0: $.data.version }
            - call: "POST /visitors"
              payload: { email: "la@x.com", full_name: "Lena A" }
              as: FarmManager
              captures: { va: $.data.id }
            - call: "POST /visitors"
              payload: { email: "lb@x.com", full_name: "Leo B" }
              as: FarmManager
              captures: { vb: $.data.id }
            - call: "POST /reservations"
              payload: { window_id: "${window_id}", visitor_id: "${va}", adult_count: 2, child_count: 1, expected_window_version: "${win_v0}" }
              as: Visitor
              as_user_id: "${va}"
              captures: { resA: $.data.id }
            - call: "POST /reservations/${resA}/confirm"
              payload: {}
              as: Visitor
              as_user_id: "${va}"
            - call: "GET /admission-windows/${window_id}"
              payload: {}
              as: FarmManager
              captures: { win_v_after_a: $.data.version }
            - call: "POST /reservations"
              payload: { window_id: "${window_id}", visitor_id: "${vb}", adult_count: 1, child_count: 0, expected_window_version: "${win_v_after_a}" }
              as: Visitor
              as_user_id: "${vb}"
              captures: { resB: $.data.id }
            - call: "POST /reservations/${resB}/confirm"
              payload: {}
              as: Visitor
              as_user_id: "${vb}"
          trigger:
            - call: "POST /farms/${farm_id}/weather-events"
              payload: { kind: "CLOSURE", affected_span_start: "2026-10-11T00:00:00Z", affected_span_end: "2026-10-12T00:00:00Z", note: "Closure ledger test" }
              as: FarmManager
          assert:
            - "Visitor.${va}.wallet_credit_cents == 5200"
            - "Visitor.${vb}.wallet_credit_cents == 2000"
            - "Farm.${farm_id}.refunds_issued_cents == 7200"
