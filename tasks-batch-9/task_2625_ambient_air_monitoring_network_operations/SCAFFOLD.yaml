scenario: |
  Generate task harder than expert level!

  2625. Ambient Air Monitoring Network Operations (state air quality monitoring program): network
  design with population, source-oriented and background site placement meeting siting criteria,
  monitor selection and reference method designation for each pollutant with instrument approval,
  site operations with calibration, span checks, zero drift monitoring and preventive maintenance
  schedules, data validation with quality control checks, invalidation criteria and completeness
  requirements for regulatory use, data submission to the national database with certification
  deadlines, exceptional event demonstration for wildfire and dust events to exclude data from
  determinations, design value calculation and attainment status determination, network assessment,
  site relocation and shutdown approvals
domain_name: ambient-air-monitoring-network-operations
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Peer collections joined by explicit foreign keys, one many-to-many junction
  # (EventExclusion links ExceptionalEventDemonstration <-> DataBatch), and a
  # self-referential edge (MonitoringSite.replaces_site_id -> MonitoringSite.id).
  # Every collection is addressed at the API root; no nesting beyond one
  # sub-resource segment.

  state_machine_shape: cyclic
  # Eight of the twelve machine blocks revisit an earlier state: DataBatch
  # validation (VALIDATED -> REOPENED -> IN_VALIDATION -> VALIDATED),
  # DataBatch submission (SUBMITTED -> UNSUBMITTED -> SUBMITTED),
  # ReferenceMethod (DESIGNATED <-> CONDITIONAL), Monitor
  # (OPERATING <-> OUT_OF_SERVICE), MonitoringSite (OPERATING <-> SUSPENDED),
  # ExceptionalEventDemonstration (SUBMITTED -> INFO_REQUESTED -> SUBMITTED),
  # NetworkAssessment / CertificationPackage / SiteChangeRequest
  # (DRAFT -> SUBMITTED -> DRAFT on return/reject/revision-request).
  # DataBatch additionally carries two independent state dimensions
  # (validation_status x submission_status) that evolve on the same row.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # Two hard segregation rules: the QA officer who applied an invalidation on a
  # batch may not validate that batch, and the program manager who validated any
  # member batch may not certify the package that includes it.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 14 entities, 60 endpoints, 43 error codes, 8 calculation rules (3 of them
  # dual-variant), 10 state machines, 2 OCC races.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Pollutant
    parent: null
    common_fields: false
    fields:
      - name: code
        type: enum
        source: input
        description: criteria pollutant measured by the network
        constraints: "enum: PM25 | PM10 | O3 | NO2 | SO2 | CO | LEAD; unique across all Pollutant rows"
      - name: averaging_period_hours
        type: integer
        source: input
        description: averaging period of the primary standard, in hours
        constraints: ">= 1 and <= 8760"
      - name: standard_form
        type: enum
        source: input
        description: statistical form of the primary standard, selects the annual-statistic branch of design_value_computation
        constraints: "enum: ANNUAL_MEAN | FOURTH_MAX_8HR | PERCENTILE_98"
      - name: primary_standard_value
        type: number
        source: input
        description: numeric level of the primary standard in the pollutant's reporting units
        constraints: "> 0"
      - name: design_value_years
        type: integer
        source: input
        description: number of consecutive calendar years averaged into a design value
        default: 3
        constraints: "== 3 for every pollutant in this scaffold"
      - name: completeness_threshold_pct
        type: number
        source: input
        description: minimum rounded DataBatch.completeness_pct for regulatory use of the quarter
        default: 75.0
        constraints: "> 0 and <= 100"
      - name: rounding_decimals
        type: integer
        source: input
        description: decimal places used for annual-statistic rounding and design-value truncation
        default: 1
        constraints: ">= 0 and <= 3"

  - name: ReferenceMethod
    parent: null
    common_fields: true
    fields:
      - name: pollutant_id
        type: string
        source: input
        description: "FK -> Pollutant.id; the pollutant this method is designated to measure"
      - name: method_code
        type: string
        source: input
        description: federal method designation code
        constraints: "unique across all ReferenceMethod rows; length 1..40"
      - name: designation_type
        type: enum
        source: input
        description: class of designation held by the method
        constraints: "enum: FRM | FEM | ARM | NON_REFERENCE"
      - name: designation_status
        type: enum
        source: system
        description: current designation standing, driven by POST /reference-methods/{id}/designation
        default: DESIGNATED
        constraints: "enum: DESIGNATED | CONDITIONAL | WITHDRAWN"
      - name: effective_from
        type: datetime
        source: input
        description: instant from which the designation is usable for regulatory data
      - name: withdrawn_on
        type: datetime
        source: system
        description: instant the designation was withdrawn; null unless designation_status == WITHDRAWN
      - name: max_span_drift_pct
        type: number
        source: input
        description: largest absolute span drift percentage that still counts as a passing span check
        constraints: "> 0"
      - name: zero_drift_limit
        type: number
        source: input
        description: largest absolute zero drift reading that still counts as a passing zero check
        constraints: "> 0"
      - name: required_span_check_interval_days
        type: integer
        source: input
        description: maximum permitted whole days between successive passing span checks
        constraints: ">= 1"
      - name: required_calibration_interval_days
        type: integer
        source: input
        description: maximum permitted whole days between successive calibrations
        constraints: ">= 1"
      - name: designation_change_count
        type: integer
        source: system
        description: number of POST /reference-methods/{id}/designation calls applied to this method
        default: 0

  - name: MonitoringNetwork
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: program name of the state monitoring network
      - name: agency_code
        type: string
        source: input
        description: reporting agency code used on national-database submissions
        constraints: "unique across all MonitoringNetwork rows"
      - name: metropolitan_population
        type: integer
        source: input
        description: population of the metropolitan area the network covers; drives the required-population-site tier
        constraints: ">= 0"
      - name: network_status
        type: enum
        source: system
        description: ACTIVE normally; UNDER_ASSESSMENT while a NetworkAssessment for the network is SUBMITTED
        default: ACTIVE
        constraints: "enum: ACTIVE | UNDER_ASSESSMENT"
      - name: current_assessment_year
        type: integer
        source: system
        description: cycle_year of the NetworkAssessment that most recently reached SUBMITTED; null before the first submission
      - name: total_site_count
        type: integer
        source: computed
        description: count of every MonitoringSite whose network_id == this network, all statuses included
      - name: proposed_site_count
        type: integer
        source: computed
        description: count of MonitoringSite rows for this network with status == PROPOSED
      - name: approved_site_count
        type: integer
        source: computed
        description: count of MonitoringSite rows for this network with status == SITING_APPROVED
      - name: operating_site_count
        type: integer
        source: computed
        description: count of MonitoringSite rows for this network with status == OPERATING
      - name: suspended_site_count
        type: integer
        source: computed
        description: count of MonitoringSite rows for this network with status == SUSPENDED
      - name: shutdown_site_count
        type: integer
        source: computed
        description: count of MonitoringSite rows for this network with status == SHUTDOWN
      - name: relocated_site_count
        type: integer
        source: computed
        description: count of MonitoringSite rows for this network with status == RELOCATED
      - name: delinquent_monitor_count
        type: integer
        source: computed
        description: count of Monitor rows at this network's sites with qc_posture == QC_DELINQUENT and monitor_status IN {APPROVED, OPERATING, OUT_OF_SERVICE}
      - name: waiver_required_site_count
        type: integer
        source: computed
        description: count of MonitoringSite rows for this network with siting_waiver_required == true and status IN {SITING_APPROVED, OPERATING, SUSPENDED}

  - name: MonitoringSite
    parent: null
    common_fields: true
    fields:
      - name: network_id
        type: string
        source: input
        description: "FK -> MonitoringNetwork.id; the network this site belongs to"
      - name: replaces_site_id
        type: string
        source: system
        description: "FK -> MonitoringSite.id; set by the RELOCATION approval cascade to the id of the site this site replaces; null otherwise"
      - name: site_code
        type: string
        source: input
        description: agency site identifier
        constraints: "unique within (network_id, site_code); length 1..20"
      - name: site_type
        type: enum
        source: input
        description: siting objective class of the site
        constraints: "enum: POPULATION_ORIENTED | SOURCE_ORIENTED | BACKGROUND | TRANSPORT"
      - name: latitude
        type: number
        source: input
        description: decimal degrees north
        constraints: ">= -90 and <= 90"
      - name: longitude
        type: number
        source: input
        description: decimal degrees east
        constraints: ">= -180 and <= 180"
      - name: population_served
        type: integer
        source: input
        description: population within the site's representative area
        constraints: ">= 0"
      - name: probe_height_m
        type: number
        source: input
        description: height of the sample probe inlet above ground, metres
        constraints: "> 0"
      - name: distance_to_roadway_m
        type: number
        source: input
        description: horizontal distance from the probe to the nearest traffic lane, metres
        constraints: ">= 0"
      - name: distance_to_obstruction_m
        type: number
        source: input
        description: horizontal distance from the probe to the nearest vertical obstruction, metres
        constraints: ">= 0"
      - name: obstruction_height_m
        type: number
        source: input
        description: height of that nearest obstruction above the probe's ground elevation, metres
        constraints: ">= 0"
      - name: distance_to_source_m
        type: number
        source: input
        description: horizontal distance from the probe to the targeted emission source, metres; 0 when no source is targeted
        default: 0.0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: site lifecycle state
        default: PROPOSED
        constraints: "enum: PROPOSED | SITING_APPROVED | OPERATING | SUSPENDED | SHUTDOWN | RELOCATED"
      - name: siting_violation_codes
        type: array
        source: computed
        description: siting criteria codes the site fails, produced by siting_criteria_evaluation, sorted ascending alphabetically
        constraints: "members: BACKGROUND_ISOLATION | OBSTRUCTION_CLEARANCE | PROBE_HEIGHT | ROADWAY_SETBACK | SOURCE_DISTANCE"
      - name: siting_waiver_required
        type: boolean
        source: computed
        description: true when siting_violation_codes is non-empty
      - name: siting_waiver_granted
        type: boolean
        source: system
        description: set true when POST /monitoring-sites/{id}/siting-approval is accepted with waiver_granted == true
        default: false
      - name: operations_start_at
        type: datetime
        source: system
        description: instant recorded by POST /monitoring-sites/{id}/commence-operations; null before then
      - name: suspended_at
        type: datetime
        source: system
        description: instant the site entered SUSPENDED; cleared to null on reinstatement
      - name: operating_monitor_count
        type: integer
        source: computed
        description: count of Monitor rows with site_id == this site and monitor_status == OPERATING
      - name: current_attainment_status
        type: enum
        source: computed
        description: attainment_status of the DesignValue row for this site with status IN {PROVISIONAL, FINAL} ordered by created_at DESC then period_end_year DESC, first row wins; UNDETERMINED when no such row exists
        default: UNDETERMINED
        constraints: "enum: UNDETERMINED | ATTAINMENT | NONATTAINMENT | INSUFFICIENT_DATA"

  - name: Monitor
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> MonitoringSite.id; the site the instrument is installed at"
      - name: reference_method_id
        type: string
        source: input
        description: "FK -> ReferenceMethod.id; the designated method the instrument implements"
      - name: poc
        type: integer
        source: input
        description: parameter occurrence code distinguishing co-located instruments for the same pollutant at one site
        constraints: ">= 1 and <= 9; unique within (site_id, reference_method_id.pollutant_id, poc) among monitors whose monitor_status != DECOMMISSIONED"
      - name: is_primary_for_design_value
        type: boolean
        source: input
        description: operator's nomination of this instrument as the site's primary sampler for design-value computation
        default: false
      - name: installed_at
        type: datetime
        source: input
        description: instant the instrument was physically installed
      - name: monitor_status
        type: enum
        source: system
        description: instrument lifecycle state
        default: PENDING_APPROVAL
        constraints: "enum: PENDING_APPROVAL | APPROVED | OPERATING | OUT_OF_SERVICE | DECOMMISSIONED"
      - name: last_calibration_at
        type: datetime
        source: system
        description: performed_at of the most recent QcEvent with event_type == CALIBRATION and outcome IN {PASS, WARN}
      - name: last_span_check_at
        type: datetime
        source: system
        description: performed_at of the most recent QcEvent with event_type == SPAN_CHECK and outcome IN {PASS, WARN}; baseline for monitor_qc_posture
      - name: last_zero_check_at
        type: datetime
        source: system
        description: performed_at of the most recent QcEvent with event_type == ZERO_CHECK and outcome IN {PASS, WARN}
      - name: last_maintenance_at
        type: datetime
        source: system
        description: performed_at of the most recent QcEvent with event_type == PREVENTIVE_MAINTENANCE and outcome IN {PASS, WARN}
      - name: consecutive_qc_failure_count
        type: integer
        source: system
        description: number of consecutive QcEvent rows with outcome == FAIL since the last outcome IN {PASS, WARN}
        default: 0
      - name: out_of_service_since
        type: datetime
        source: system
        description: instant the monitor entered OUT_OF_SERVICE; null while monitor_status != OUT_OF_SERVICE
      - name: out_of_service_day_count
        type: integer
        source: system
        description: cumulative whole days the monitor has spent in OUT_OF_SERVICE, closed out on each return to OPERATING
        default: 0
      - name: qc_posture
        type: enum
        source: computed
        description: monitor_qc_posture under the CALENDAR_ELAPSED variant; gates DataBatch validation
        default: QC_DUE
        constraints: "enum: QC_CURRENT | QC_DUE | QC_DELINQUENT"
      - name: qc_posture_in_service
        type: enum
        source: computed
        description: monitor_qc_posture under the IN_SERVICE_ELAPSED variant; reported on certification packages
        default: QC_DUE
        constraints: "enum: QC_CURRENT | QC_DUE | QC_DELINQUENT"

  - name: QcEvent
    parent: Monitor
    common_fields: false
    fields:
      - name: monitor_id
        type: string
        source: input
        description: "FK -> Monitor.id; the instrument the check was performed on"
      - name: event_type
        type: enum
        source: input
        description: kind of quality-control activity performed
        constraints: "enum: CALIBRATION | SPAN_CHECK | ZERO_CHECK | PRECISION_CHECK | PREVENTIVE_MAINTENANCE"
      - name: performed_at
        type: datetime
        source: input
        description: instant the activity was performed; must be <= the logical clock
      - name: span_drift_pct
        type: number
        source: input
        description: signed span drift percentage read during the check; required when event_type == SPAN_CHECK, ignored otherwise
      - name: zero_drift_value
        type: number
        source: input
        description: signed zero drift reading in the pollutant's reporting units; required when event_type == ZERO_CHECK, ignored otherwise
      - name: declared_failure
        type: boolean
        source: input
        description: technician's declaration that a CALIBRATION, PRECISION_CHECK or PREVENTIVE_MAINTENANCE activity failed
        default: false
      - name: outcome
        type: enum
        source: computed
        description: result of qc_event_outcome_evaluation for this event
        constraints: "enum: PASS | WARN | FAIL"
      - name: performed_by_user_id
        type: string
        source: system
        description: X-User-ID of the FieldTechnician that logged the event

  - name: DataBatch
    parent: Monitor
    common_fields: true
    fields:
      - name: monitor_id
        type: string
        source: input
        description: "FK -> Monitor.id; the instrument that produced the quarter of data"
      - name: year
        type: integer
        source: input
        description: calendar year of the reported quarter
        constraints: ">= 2000 and <= 2100"
      - name: quarter
        type: integer
        source: input
        description: calendar quarter of the reported data
        constraints: ">= 1 and <= 4; unique within (monitor_id, year, quarter)"
      - name: scheduled_hour_count
        type: integer
        source: input
        description: number of sampling hours scheduled for the quarter; the denominator before excused and event-excluded hours are removed
        constraints: ">= 1 and <= 2232"
      - name: quarterly_mean_concentration
        type: number
        source: input
        description: reported quarterly mean concentration, as measured, in the pollutant's reporting units
        constraints: ">= 0"
      - name: quarterly_mean_concentration_event_adjusted
        type: number
        source: input
        description: quarterly mean recomputed with the exceptional-event hours removed; used only by the EXCLUDING_CONCURRED_EVENTS design-value variant and only when the batch has at least one EFFECTIVE EventExclusion
        constraints: ">= 0; null when no exceptional event affects the quarter"
      - name: fourth_high_daily_max
        type: number
        source: input
        description: fourth-highest daily maximum 8-hour value for the quarter; used only when the pollutant's standard_form == FOURTH_MAX_8HR
        constraints: ">= 0; null for ANNUAL_MEAN pollutants"
      - name: excused_hour_count
        type: integer
        source: computed
        description: step S1 of batch_hour_accounting - APPLIED invalidation hours whose invalidation_code is in EXCUSED_CODES
      - name: invalidated_hour_count
        type: integer
        source: computed
        description: step S2 of batch_hour_accounting - APPLIED invalidation hours whose invalidation_code is not in EXCUSED_CODES
      - name: event_excluded_hour_count
        type: integer
        source: computed
        description: step S3 of batch_hour_accounting - EFFECTIVE EventExclusion hours on this batch
      - name: adjusted_scheduled_hour_count
        type: integer
        source: computed
        description: step S4 of batch_hour_accounting - scheduled_hour_count less excused_hour_count less event_excluded_hour_count
      - name: valid_hour_count
        type: integer
        source: computed
        description: step S5 of batch_hour_accounting - adjusted_scheduled_hour_count less invalidated_hour_count
      - name: completeness_pct
        type: number
        source: computed
        description: step S6 of batch_hour_accounting - 100 * valid_hour_count / adjusted_scheduled_hour_count, rounded to 1 decimal, round_half_up
      - name: regulatory_use_eligible
        type: boolean
        source: computed
        description: true when completeness_pct >= the pollutant's completeness_threshold_pct, comparing the rounded completeness_pct
      - name: validation_status
        type: enum
        source: system
        description: quality-assurance dimension of the batch, independent of submission_status
        default: RAW
        constraints: "enum: RAW | IN_VALIDATION | VALIDATED | INVALIDATED | REOPENED"
      - name: submission_status
        type: enum
        source: system
        description: national-database dimension of the batch, independent of validation_status
        default: UNSUBMITTED
        constraints: "enum: UNSUBMITTED | SUBMITTED | CERTIFIED"
      - name: validated_by_user_id
        type: string
        source: system
        description: X-User-ID of the QaOfficer whose validate call last moved this batch to VALIDATED; cleared to null on reopen
      - name: invalidation_applied_by_user_ids
        type: array
        source: system
        description: distinct X-User-ID values of every QaOfficer that has created an APPLIED DataInvalidation on this batch, append-only, sorted by first-append order
        default: []
      - name: batch_invalidation_reason
        type: enum
        source: system
        description: why the batch reached INVALIDATED; null in every other validation_status
        constraints: "enum: QA_REJECTED | MONITOR_DECOMMISSIONED"
      - name: reopen_count
        type: integer
        source: system
        description: number of times the batch has been reopened from VALIDATED
        default: 0

  - name: DataInvalidation
    parent: DataBatch
    common_fields: true
    fields:
      - name: data_batch_id
        type: string
        source: input
        description: "FK -> DataBatch.id; the quarter whose hours are invalidated"
      - name: start_hour_index
        type: integer
        source: input
        description: first invalidated hour, counted from 0 at the quarter's first scheduled hour; inclusive
        constraints: ">= 0 and < DataBatch.scheduled_hour_count"
      - name: end_hour_index
        type: integer
        source: input
        description: hour index one past the last invalidated hour; exclusive
        constraints: "> start_hour_index and <= DataBatch.scheduled_hour_count"
      - name: hours_affected
        type: integer
        source: computed
        description: end_hour_index minus start_hour_index
      - name: invalidation_code
        type: enum
        source: input
        description: reason the hours are not valid; membership in EXCUSED_CODES decides whether the hours leave the denominator or become invalid hours
        constraints: "enum: QC_FAILURE | OPERATOR_ERROR | INSTRUMENT_MALFUNCTION | SCHEDULED_MAINTENANCE | POWER_OUTAGE_UTILITY | SITE_SHUTDOWN"
      - name: status
        type: enum
        source: system
        description: whether the invalidation currently participates in batch_hour_accounting
        default: APPLIED
        constraints: "enum: APPLIED | WITHDRAWN"
      - name: applied_by_user_id
        type: string
        source: system
        description: X-User-ID of the QaOfficer that created the invalidation
      - name: withdrawn_reason
        type: string
        source: input
        description: free-text justification supplied to POST /data-invalidations/{id}/withdraw; null while status == APPLIED

  - name: ExceptionalEventDemonstration
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> MonitoringSite.id; the site whose data the demonstration covers"
      - name: pollutant_id
        type: string
        source: input
        description: "FK -> Pollutant.id; the pollutant whose data the demonstration covers"
      - name: event_type
        type: enum
        source: input
        description: natural event class claimed
        constraints: "enum: WILDFIRE | HIGH_WIND_DUST | PRESCRIBED_FIRE | STRATOSPHERIC_INTRUSION"
      - name: event_start_date
        type: datetime
        source: input
        description: first instant of the claimed event window; the window is treated as closed on both ends
      - name: event_end_date
        type: datetime
        source: input
        description: last instant of the claimed event window; must be >= event_start_date
      - name: narrative
        type: string
        source: input
        description: conceptual-model narrative supporting the claim
        constraints: "length 1..4000"
      - name: clear_causal_relationship
        type: boolean
        source: input
        description: whether the submitter asserts a clear causal relationship between the event and the exceedance
      - name: status
        type: enum
        source: system
        description: demonstration review state
        default: DRAFT
        constraints: "enum: DRAFT | SUBMITTED | INFO_REQUESTED | CONCURRED | NON_CONCURRED"
      - name: info_request_count
        type: integer
        source: system
        description: number of times the reviewer has returned the demonstration for more information
        default: 0
      - name: determined_by_user_id
        type: string
        source: system
        description: X-User-ID of the EpaRegionalReviewer that recorded the concurrence determination
      - name: determined_at
        type: datetime
        source: system
        description: logical-clock instant of the concurrence determination
      - name: excluded_hour_total
        type: integer
        source: computed
        description: sum of hours_affected over EventExclusion rows for this demonstration whose status == EFFECTIVE

  - name: EventExclusion
    parent: ExceptionalEventDemonstration
    common_fields: true
    fields:
      - name: demonstration_id
        type: string
        source: input
        description: "FK -> ExceptionalEventDemonstration.id; the demonstration that justifies the exclusion"
      - name: data_batch_id
        type: string
        source: input
        description: "FK -> DataBatch.id; the quarter whose hours are excluded from determinations"
      - name: start_hour_index
        type: integer
        source: input
        description: first excluded hour, counted from 0 at the quarter's first scheduled hour; inclusive
        constraints: ">= 0 and < DataBatch.scheduled_hour_count"
      - name: end_hour_index
        type: integer
        source: input
        description: hour index one past the last excluded hour; exclusive
        constraints: "> start_hour_index and <= DataBatch.scheduled_hour_count"
      - name: hours_affected
        type: integer
        source: computed
        description: end_hour_index minus start_hour_index
      - name: status
        type: enum
        source: system
        description: PROPOSED while the demonstration is undecided, EFFECTIVE after concurrence, REJECTED after non-concurrence
        default: PROPOSED
        constraints: "enum: PROPOSED | EFFECTIVE | REJECTED"
      - name: effective_at
        type: datetime
        source: system
        description: logical-clock instant the exclusion became EFFECTIVE; null in every other status

  - name: DesignValue
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> MonitoringSite.id; the site the design value is computed for"
      - name: pollutant_id
        type: string
        source: input
        description: "FK -> Pollutant.id; the pollutant whose standard is compared against"
      - name: primary_monitor_id
        type: string
        source: computed
        description: "FK -> Monitor.id; the monitor chosen by the primary-monitor selector of design_value_computation"
      - name: period_end_year
        type: integer
        source: input
        description: last calendar year of the three-year design-value period
        constraints: ">= 2000 and <= 2100"
      - name: variant
        type: enum
        source: input
        description: which design_value_computation variant produced this row
        constraints: "enum: WITH_EVENT_DATA | EXCLUDING_CONCURRED_EVENTS"
      - name: annual_statistics
        type: array
        source: computed
        description: the three rounded annual statistics, index 0 = period_end_year minus 2, index 2 = period_end_year; empty array when no year is complete
      - name: complete_year_count
        type: integer
        source: computed
        description: number of the three years having four qualifying DataBatch rows
      - name: design_value
        type: number
        source: computed
        description: truncated mean of annual_statistics; null when complete_year_count < Pollutant.design_value_years
      - name: attainment_status
        type: enum
        source: computed
        description: comparison of design_value against Pollutant.primary_standard_value
        constraints: "enum: ATTAINMENT | NONATTAINMENT | INSUFFICIENT_DATA"
      - name: status
        type: enum
        source: system
        description: PROVISIONAL on creation, FINAL once the reviewer finalizes it, SUPERSEDED when a newer row replaces it or an event exclusion invalidates its inputs
        default: PROVISIONAL
        constraints: "enum: PROVISIONAL | FINAL | SUPERSEDED"
      - name: stale_reason
        type: enum
        source: system
        description: why the row was superseded; null unless status == SUPERSEDED
        constraints: "enum: EVENT_EXCLUSION_APPLIED | BATCH_REVALIDATED | RECOMPUTED"
      - name: finalized_by_user_id
        type: string
        source: system
        description: X-User-ID of the EpaRegionalReviewer that finalized the row

  - name: NetworkAssessment
    parent: MonitoringNetwork
    common_fields: true
    fields:
      - name: network_id
        type: string
        source: input
        description: "FK -> MonitoringNetwork.id; the network being assessed"
      - name: cycle_year
        type: integer
        source: input
        description: assessment cycle year
        constraints: ">= 2000 and <= 2100; unique within (network_id, cycle_year)"
      - name: required_population_site_count
        type: integer
        source: computed
        description: population tier requirement from network_adequacy_score step A
      - name: coverage_ratio
        type: number
        source: computed
        description: credited sites divided by required sites, from network_adequacy_score step B
      - name: adequacy_score
        type: number
        source: computed
        description: coverage_ratio degraded by the QC and siting factors, times 100, rounded to 1 decimal
      - name: adequacy_tier
        type: enum
        source: computed
        description: banding of adequacy_score
        constraints: "enum: ADEQUATE | CONDITIONAL | INADEQUATE"
      - name: status
        type: enum
        source: system
        description: review state; a returned assessment goes back to DRAFT rather than to a distinct RETURNED state
        default: DRAFT
        constraints: "enum: DRAFT | SUBMITTED | APPROVED"
      - name: return_count
        type: integer
        source: system
        description: number of times the reviewer has returned this assessment to DRAFT
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent submission
      - name: approved_at
        type: datetime
        source: system
        description: logical-clock instant of approval
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the EpaRegionalReviewer that approved the assessment

  - name: SiteChangeRequest
    parent: MonitoringSite
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> MonitoringSite.id; the site the change applies to"
      - name: replacement_site_id
        type: string
        source: input
        description: "FK -> MonitoringSite.id; the site taking over monitoring after a relocation; required when request_type == RELOCATION, null otherwise"
      - name: assessment_id
        type: string
        source: input
        description: "FK -> NetworkAssessment.id; the assessment cited as justification, checked for APPROVED status at decision time"
      - name: request_type
        type: enum
        source: input
        description: kind of network change requested
        constraints: "enum: RELOCATION | SHUTDOWN | SEASONAL_SUSPENSION"
      - name: justification
        type: string
        source: input
        description: narrative justification for the change
        constraints: "length 1..2000"
      - name: status
        type: enum
        source: system
        description: approval state; a revision request returns the row to DRAFT rather than to a distinct REVISION_REQUESTED state
        default: DRAFT
        constraints: "enum: DRAFT | SUBMITTED | APPROVED | DENIED"
      - name: revision_request_count
        type: integer
        source: system
        description: number of times the reviewer has returned this request to DRAFT for revision
        default: 0
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the EpaRegionalReviewer that decided the request
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant of the decision
      - name: effective_at
        type: datetime
        source: system
        description: logical-clock instant the approved change took effect on the site

  - name: CertificationPackage
    parent: MonitoringNetwork
    common_fields: true
    fields:
      - name: network_id
        type: string
        source: input
        description: "FK -> MonitoringNetwork.id; the reporting agency network the package certifies"
      - name: pollutant_id
        type: string
        source: input
        description: "FK -> Pollutant.id; the pollutant whose annual data the package certifies"
      - name: year
        type: integer
        source: input
        description: calendar year of data being certified
        constraints: ">= 2000 and <= 2100; unique within (network_id, pollutant_id, year)"
      - name: certification_deadline
        type: datetime
        source: computed
        description: May 1 of the year after `year`, at 00:00:00Z; certification is rejected at or after this instant
      - name: included_batch_count
        type: integer
        source: computed
        description: number of DataBatch rows selected by certification_package_rollup for this package
      - name: eligible_batch_count
        type: integer
        source: computed
        description: number of selected batches with regulatory_use_eligible == true
      - name: rollup_completeness_pct
        type: number
        source: computed
        description: aggregate valid hours over aggregate adjusted scheduled hours across the selected batches, times 100, rounded to 1 decimal
      - name: certification_ready
        type: boolean
        source: computed
        description: true when included_batch_count >= 1 and eligible_batch_count == included_batch_count
      - name: status
        type: enum
        source: system
        description: submission state; a rejected package returns to DRAFT rather than to a distinct rejected state
        default: DRAFT
        constraints: "enum: DRAFT | SUBMITTED | CERTIFIED"
      - name: rejection_count
        type: integer
        source: system
        description: number of times the reviewer has rejected this package back to DRAFT
        default: 0
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramManager that certified the package
      - name: certified_at
        type: datetime
        source: system
        description: logical-clock instant of certification

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: ReferenceMethod
    initial_state: DESIGNATED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DESIGNATED
        to: CONDITIONAL
        trigger: "POST /reference-methods/{id}/designation with new_designation_status == CONDITIONAL"
        actor: EpaRegionalReviewer
        preconditions:
          - "designation_status == DESIGNATED"
        side_effects:
          - "designation_change_count increments by 1"
          - "increments ReferenceMethod.version by 1"
        note: "CONDITIONAL still satisfies validation priority 50, so monitors and data remain usable."
      - from: CONDITIONAL
        to: DESIGNATED
        trigger: "POST /reference-methods/{id}/designation with new_designation_status == DESIGNATED"
        actor: EpaRegionalReviewer
        preconditions:
          - "designation_status == CONDITIONAL"
        side_effects:
          - "designation_change_count increments by 1"
          - "increments ReferenceMethod.version by 1"
        note: "Closes the DESIGNATED <-> CONDITIONAL cycle."
      - from: DESIGNATED
        to: WITHDRAWN
        trigger: "POST /reference-methods/{id}/designation with new_designation_status == WITHDRAWN"
        actor: EpaRegionalReviewer
        preconditions:
          - "designation_status == DESIGNATED"
        side_effects:
          - "withdrawn_on is set to the logical clock instant"
          - "designation_change_count increments by 1"
          - "every subsequent POST /data-batches/{id}/validate for a Monitor whose reference_method_id == this method now fails validation priority 50 with ERR_METHOD_NOT_DESIGNATED"
          - "increments ReferenceMethod.version by 1"
      - from: CONDITIONAL
        to: WITHDRAWN
        trigger: "POST /reference-methods/{id}/designation with new_designation_status == WITHDRAWN"
        actor: EpaRegionalReviewer
        preconditions:
          - "designation_status == CONDITIONAL"
        side_effects:
          - "withdrawn_on is set to the logical clock instant"
          - "designation_change_count increments by 1"
          - "increments ReferenceMethod.version by 1"

  - entity: MonitoringSite
    initial_state: PROPOSED
    terminal_states: [SHUTDOWN, RELOCATED]
    transitions:
      - from: PROPOSED
        to: SITING_APPROVED
        trigger: "POST /monitoring-sites/{id}/siting-approval"
        actor: EpaRegionalReviewer
        preconditions:
          - "status == PROPOSED"
          - "siting_waiver_required == false OR request body waiver_granted == true (validation priority 59)"
        side_effects:
          - "siting_waiver_granted is set to the request body waiver_granted value"
          - "MonitoringNetwork.proposed_site_count decrements by 1 and MonitoringNetwork.approved_site_count increments by 1"
          - "MonitoringNetwork.waiver_required_site_count is recomputed"
          - "increments MonitoringSite.version by 1 and MonitoringNetwork.version by 1"
      - from: SITING_APPROVED
        to: OPERATING
        trigger: "POST /monitoring-sites/{id}/commence-operations"
        actor: ProgramManager
        preconditions:
          - "status == SITING_APPROVED"
          - "siting_violation_codes is empty OR siting_waiver_granted == true, which POST /monitoring-sites/{id}/siting-approval already guaranteed"
        side_effects:
          - "operations_start_at is set to the logical clock instant"
          - "MonitoringNetwork.approved_site_count decrements by 1 and MonitoringNetwork.operating_site_count increments by 1"
          - "increments MonitoringSite.version by 1 and MonitoringNetwork.version by 1"
      - from: OPERATING
        to: SUSPENDED
        trigger: "system: hop 1 of the SEASONAL_SUSPENSION cascade fired by POST /site-change-requests/{id}/decision with decision == APPROVE"
        actor: system
        preconditions:
          - "status == OPERATING (validation priority 23)"
          - "SiteChangeRequest.request_type == SEASONAL_SUSPENSION"
        side_effects:
          - "suspended_at is set to the logical clock instant"
          - "MonitoringNetwork.operating_site_count decrements by 1 and MonitoringNetwork.suspended_site_count increments by 1; total_site_count is unchanged"
          - "hop 2: because the site became SUSPENDED, every Monitor with site_id == this site and monitor_status == OPERATING moves to OUT_OF_SERVICE with out_of_service_since set to the logical clock instant"
          - "hop 3: because those monitors became OUT_OF_SERVICE, MonitoringSite.operating_monitor_count and MonitoringNetwork.delinquent_monitor_count are recomputed"
          - "increments MonitoringSite.version by 1 and MonitoringNetwork.version by 1"
      - from: SUSPENDED
        to: OPERATING
        trigger: "POST /monitoring-sites/{id}/reinstate"
        actor: ProgramManager
        preconditions:
          - "status == SUSPENDED"
        side_effects:
          - "suspended_at is cleared to null"
          - "MonitoringNetwork.suspended_site_count decrements by 1 and MonitoringNetwork.operating_site_count increments by 1; total_site_count is unchanged (compensating_invariant: network_site_census)"
          - "hop 2: because the site returned to OPERATING, every Monitor with site_id == this site, monitor_status == OUT_OF_SERVICE and out_of_service_since equal to the site's pre-clear suspended_at moves to OPERATING; each such monitor adds floor((logical clock - out_of_service_since) / 86400 seconds) whole days to out_of_service_day_count and clears out_of_service_since"
          - "hop 3: because those monitors returned to OPERATING, qc_posture and qc_posture_in_service are recomputed for each of them and MonitoringNetwork.delinquent_monitor_count is recomputed"
          - "increments MonitoringSite.version by 1 and MonitoringNetwork.version by 1"
      - from: OPERATING
        to: SHUTDOWN
        trigger: "system: hop 1 of the SHUTDOWN cascade fired by POST /site-change-requests/{id}/decision with decision == APPROVE"
        actor: system
        preconditions:
          - "status == OPERATING (validation priority 23)"
          - "SiteChangeRequest.request_type == SHUTDOWN"
        side_effects:
          - "MonitoringNetwork.operating_site_count decrements by 1 and MonitoringNetwork.shutdown_site_count increments by 1; total_site_count is unchanged"
          - "hop 2: because the site became SHUTDOWN, every Monitor with site_id == this site and monitor_status IN {PENDING_APPROVAL, APPROVED, OPERATING, OUT_OF_SERVICE} moves to DECOMMISSIONED"
          - "hop 3: because those monitors became DECOMMISSIONED, every DataBatch with monitor_id in that set and validation_status IN {RAW, IN_VALIDATION, REOPENED} moves to INVALIDATED with batch_invalidation_reason == MONITOR_DECOMMISSIONED"
          - "hop 4: because those batches became INVALIDATED, every CertificationPackage that selected any of them re-runs certification_package_rollup, which sets certification_ready false, and any such package whose status == SUBMITTED moves to DRAFT with rejection_count incremented by 1"
          - "hop 5: because those packages returned to DRAFT, every DataBatch matching the package's (network_id, pollutant_id, year) whose submission_status == SUBMITTED moves to submission_status UNSUBMITTED"
          - "increments MonitoringSite.version by 1 and MonitoringNetwork.version by 1"
      - from: OPERATING
        to: RELOCATED
        trigger: "system: hop 1 of the RELOCATION cascade fired by POST /site-change-requests/{id}/decision with decision == APPROVE"
        actor: system
        preconditions:
          - "status == OPERATING (validation priority 23)"
          - "SiteChangeRequest.request_type == RELOCATION"
          - "the SiteChangeRequest's replacement site has status IN {SITING_APPROVED, OPERATING} (validation priority 54)"
        side_effects:
          - "MonitoringNetwork.operating_site_count decrements by 1 and MonitoringNetwork.relocated_site_count increments by 1; total_site_count is unchanged"
          - "hop 2: because the site became RELOCATED, the replacement MonitoringSite has replaces_site_id set to this site's id"
          - "hop 3: because those monitors' site became RELOCATED, every Monitor with site_id == this site and monitor_status IN {PENDING_APPROVAL, APPROVED, OPERATING, OUT_OF_SERVICE} moves to DECOMMISSIONED"
          - "increments MonitoringSite.version by 1 for both sites and MonitoringNetwork.version by 1"

  - entity: Monitor
    initial_state: PENDING_APPROVAL
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /monitors/{id}/approve"
        actor: EpaRegionalReviewer
        preconditions:
          - "monitor_status == PENDING_APPROVAL"
          - "the Monitor's MonitoringSite has status IN {SITING_APPROVED, OPERATING}"
          - "the Monitor's ReferenceMethod has designation_status IN {DESIGNATED, CONDITIONAL}, effective_from <= the logical clock, and (withdrawn_on is null OR withdrawn_on > the logical clock) (validation priority 50, cross_entity_state_dependency: Monitor depends on ReferenceMethod)"
        side_effects:
          - "qc_posture and qc_posture_in_service are computed with last_span_check_at null, so the baseline is installed_at"
          - "MonitoringNetwork.delinquent_monitor_count is recomputed"
          - "increments Monitor.version by 1"
      - from: APPROVED
        to: OPERATING
        trigger: "POST /monitors/{id}/commission"
        actor: FieldTechnician
        preconditions:
          - "monitor_status == APPROVED"
          - "the Monitor's MonitoringSite has status == OPERATING"
          - "the Monitor's ReferenceMethod satisfies validation priority 50"
        side_effects:
          - "MonitoringSite.operating_monitor_count increments by 1"
          - "increments Monitor.version by 1 and MonitoringSite.version by 1"
      - from: OPERATING
        to: OUT_OF_SERVICE
        trigger: "POST /monitors/{id}/service-status with new_status == OUT_OF_SERVICE"
        actor: FieldTechnician
        preconditions:
          - "monitor_status == OPERATING"
        side_effects:
          - "out_of_service_since is set to the logical clock instant"
          - "MonitoringSite.operating_monitor_count decrements by 1"
          - "increments Monitor.version by 1 and MonitoringSite.version by 1"
      - from: OPERATING
        to: OUT_OF_SERVICE
        trigger: "system: automatic on a POST /monitors/{id}/qc-events whose computed outcome == FAIL"
        actor: system
        preconditions:
          - "monitor_status == OPERATING"
          - "the newly created QcEvent has outcome == FAIL per qc_event_outcome_evaluation"
        side_effects:
          - "out_of_service_since is set to the logical clock instant"
          - "consecutive_qc_failure_count increments by 1"
          - "MonitoringSite.operating_monitor_count decrements by 1"
          - "increments Monitor.version by 1 and MonitoringSite.version by 1"
      - from: OUT_OF_SERVICE
        to: OPERATING
        trigger: "POST /monitors/{id}/service-status with new_status == OPERATING"
        actor: FieldTechnician
        preconditions:
          - "monitor_status == OUT_OF_SERVICE"
          - "consecutive_qc_failure_count == 0, i.e. a QcEvent with outcome IN {PASS, WARN} has been logged since the last failure"
          - "the Monitor's MonitoringSite has status == OPERATING"
        side_effects:
          - "out_of_service_day_count increases by floor((logical clock - out_of_service_since) / 86400 seconds) and out_of_service_since is cleared to null"
          - "qc_posture and qc_posture_in_service are recomputed; the two variants diverge by exactly the out_of_service_day_count delta"
          - "MonitoringSite.operating_monitor_count increments by 1"
          - "increments Monitor.version by 1 and MonitoringSite.version by 1"
        note: "Closes the OPERATING <-> OUT_OF_SERVICE cycle."
      - from: PENDING_APPROVAL
        to: DECOMMISSIONED
        trigger: "system: hop 2 of the SHUTDOWN or RELOCATION cascade"
        actor: system
        preconditions:
          - "the Monitor's MonitoringSite just moved to SHUTDOWN or RELOCATED"
        side_effects:
          - "increments Monitor.version by 1"
      - from: APPROVED
        to: DECOMMISSIONED
        trigger: "system: hop 2 of the SHUTDOWN or RELOCATION cascade"
        actor: system
        preconditions:
          - "the Monitor's MonitoringSite just moved to SHUTDOWN or RELOCATED"
        side_effects:
          - "increments Monitor.version by 1"
      - from: OPERATING
        to: DECOMMISSIONED
        trigger: "system: hop 2 of the SHUTDOWN or RELOCATION cascade"
        actor: system
        preconditions:
          - "the Monitor's MonitoringSite just moved to SHUTDOWN or RELOCATED"
        side_effects:
          - "MonitoringSite.operating_monitor_count decrements by 1"
          - "hop 3 continues into the DataBatch machine as described on the MonitoringSite OPERATING -> SHUTDOWN transition"
          - "increments Monitor.version by 1"
      - from: OUT_OF_SERVICE
        to: DECOMMISSIONED
        trigger: "system: hop 2 of the SHUTDOWN or RELOCATION cascade"
        actor: system
        preconditions:
          - "the Monitor's MonitoringSite just moved to SHUTDOWN or RELOCATED"
        side_effects:
          - "out_of_service_day_count increases by floor((logical clock - out_of_service_since) / 86400 seconds) and out_of_service_since is cleared to null"
          - "increments Monitor.version by 1"

  - entity: DataBatch
    dimension: validation_status
    initial_state: RAW
    terminal_states: [INVALIDATED]
    transitions:
      - from: RAW
        to: IN_VALIDATION
        trigger: "POST /data-batches/{id}/begin-validation"
        actor: QaOfficer
        preconditions:
          - "validation_status == RAW"
        side_effects:
          - "increments DataBatch.version by 1"
      - from: REOPENED
        to: IN_VALIDATION
        trigger: "POST /data-batches/{id}/begin-validation"
        actor: QaOfficer
        preconditions:
          - "validation_status == REOPENED"
        side_effects:
          - "increments DataBatch.version by 1"
        note: "Closes the VALIDATED -> REOPENED -> IN_VALIDATION -> VALIDATED cycle."
      - from: IN_VALIDATION
        to: VALIDATED
        trigger: "POST /data-batches/{id}/validate"
        actor: QaOfficer
        preconditions:
          - "validation_status == IN_VALIDATION"
          - "the batch's Monitor's ReferenceMethod satisfies validation priority 50 (ERR_METHOD_NOT_DESIGNATED)"
          - "the calling X-User-ID does not appear in invalidation_applied_by_user_ids (validation priority 55, ERR_SEGREGATION_OF_DUTIES)"
          - "the batch's Monitor has qc_posture != QC_DELINQUENT (validation priority 57, cross_entity_state_dependency: DataBatch depends on Monitor)"
        side_effects:
          - "validated_by_user_id is set to the calling X-User-ID"
          - "batch_hour_accounting is re-run, refreshing completeness_pct and regulatory_use_eligible"
          - "every CertificationPackage selecting this batch re-runs certification_package_rollup"
          - "submission_status is left unchanged (the two dimensions are independent)"
          - "increments DataBatch.version by 1"
      - from: RAW
        to: VALIDATED
        trigger: "POST /data-batches/bulk-validate"
        actor: QaOfficer
        preconditions:
          - "validation_status == RAW"
          - "the same four checks the single-batch validate applies, evaluated per batch; the first failing batch rejects the whole request (transactional, no batch is advanced)"
        side_effects:
          - "validated_by_user_id is set to the calling X-User-ID on every advanced batch"
          - "batch_hour_accounting is re-run per advanced batch"
          - "increments DataBatch.version by 1 per advanced batch"
        note: "Compound RAW -> IN_VALIDATION -> VALIDATED advance performed atomically per batch; IN_VALIDATION is never observable for a bulk-validated batch."
      - from: VALIDATED
        to: REOPENED
        trigger: "POST /data-batches/{id}/reopen"
        actor: QaOfficer
        preconditions:
          - "validation_status == VALIDATED"
          - "submission_status != CERTIFIED (validation priority 22, ERR_BATCH_CERTIFIED)"
        side_effects:
          - "reopen_count increments by 1 and validated_by_user_id is cleared to null"
          - "every DesignValue whose site_id == the batch's site, pollutant_id == the batch's pollutant, status == PROVISIONAL and period_end_year in {batch.year, batch.year + 1, batch.year + 2} moves to SUPERSEDED with stale_reason == BATCH_REVALIDATED"
          - "MonitoringSite.current_attainment_status is recomputed"
          - "submission_status is left unchanged"
          - "increments DataBatch.version by 1"
      - from: IN_VALIDATION
        to: INVALIDATED
        trigger: "POST /data-batches/{id}/invalidate"
        actor: QaOfficer
        preconditions:
          - "validation_status == IN_VALIDATION"
        side_effects:
          - "batch_invalidation_reason is set to QA_REJECTED"
          - "every CertificationPackage selecting this batch re-runs certification_package_rollup"
          - "increments DataBatch.version by 1"
      - from: REOPENED
        to: INVALIDATED
        trigger: "POST /data-batches/{id}/invalidate"
        actor: QaOfficer
        preconditions:
          - "validation_status == REOPENED"
        side_effects:
          - "batch_invalidation_reason is set to QA_REJECTED"
          - "increments DataBatch.version by 1"
      - from: RAW
        to: INVALIDATED
        trigger: "system: hop 3 of the SHUTDOWN or RELOCATION cascade"
        actor: system
        preconditions:
          - "the batch's Monitor just moved to DECOMMISSIONED"
        side_effects:
          - "batch_invalidation_reason is set to MONITOR_DECOMMISSIONED"
          - "increments DataBatch.version by 1"
      - from: IN_VALIDATION
        to: INVALIDATED
        trigger: "system: hop 3 of the SHUTDOWN or RELOCATION cascade"
        actor: system
        preconditions:
          - "the batch's Monitor just moved to DECOMMISSIONED"
        side_effects:
          - "batch_invalidation_reason is set to MONITOR_DECOMMISSIONED"
          - "hop 4 continues into the CertificationPackage machine"
          - "increments DataBatch.version by 1"
      - from: REOPENED
        to: INVALIDATED
        trigger: "system: hop 3 of the SHUTDOWN or RELOCATION cascade"
        actor: system
        preconditions:
          - "the batch's Monitor just moved to DECOMMISSIONED"
        side_effects:
          - "batch_invalidation_reason is set to MONITOR_DECOMMISSIONED"
          - "increments DataBatch.version by 1"

  - entity: DataBatch
    dimension: submission_status
    initial_state: UNSUBMITTED
    terminal_states: []
    transitions:
      - from: UNSUBMITTED
        to: SUBMITTED
        trigger: "system: side effect of POST /certification-packages/{id}/submit"
        actor: system
        preconditions:
          - "the batch is selected by certification_package_rollup for the submitting package"
          - "validation_status == VALIDATED"
        side_effects:
          - "validation_status is left unchanged at VALIDATED (parallel dimensions)"
          - "increments DataBatch.version by 1"
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "system: side effect of POST /certification-packages/{id}/certify"
        actor: system
        preconditions:
          - "the batch is selected by the certifying package"
        side_effects:
          - "the batch can no longer be reopened (validation priority 22)"
          - "increments DataBatch.version by 1"
      - from: SUBMITTED
        to: UNSUBMITTED
        trigger: "system: side effect of any CertificationPackage returning to DRAFT - POST /certification-packages/{id}/reject, or hop 5 of the SHUTDOWN / RELOCATION cascade"
        actor: system
        preconditions:
          - "a CertificationPackage whose (network_id, pollutant_id, year) matches this batch's network, pollutant and year has just moved from SUBMITTED to DRAFT"
        side_effects:
          - "validation_status is left unchanged (a rejected submission does not un-validate data; parallel dimensions)"
          - "increments DataBatch.version by 1"

  - entity: DataInvalidation
    initial_state: APPLIED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: APPLIED
        to: WITHDRAWN
        trigger: "POST /data-invalidations/{id}/withdraw"
        actor: QaOfficer
        preconditions:
          - "status == APPLIED"
          - "the parent DataBatch has validation_status != INVALIDATED"
        side_effects:
          - "withdrawn_reason is stored"
          - "the parent DataBatch re-runs batch_hour_accounting; the hour identity scheduled_hour_count == valid_hour_count + invalidated_hour_count + excused_hour_count + event_excluded_hour_count holds before and after (compensating_invariant: batch_hour_budget)"
          - "every CertificationPackage selecting the parent batch re-runs certification_package_rollup"
          - "increments DataInvalidation.version by 1 and DataBatch.version by 1"

  - entity: ExceptionalEventDemonstration
    initial_state: DRAFT
    terminal_states: [CONCURRED, NON_CONCURRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /exceptional-event-demonstrations/{id}/submit"
        actor: ProgramManager
        preconditions:
          - "status == DRAFT"
          - "at least one EventExclusion with status == PROPOSED exists for this demonstration"
          - "clear_causal_relationship == true"
        side_effects:
          - "increments ExceptionalEventDemonstration.version by 1"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /exceptional-event-demonstrations/{id}/submit"
        actor: ProgramManager
        preconditions:
          - "status == INFO_REQUESTED"
          - "at least one EventExclusion with status == PROPOSED exists for this demonstration"
        side_effects:
          - "increments ExceptionalEventDemonstration.version by 1"
        note: "Closes the SUBMITTED -> INFO_REQUESTED -> SUBMITTED review cycle."
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /exceptional-event-demonstrations/{id}/request-info"
        actor: EpaRegionalReviewer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "info_request_count increments by 1"
          - "EventExclusion rows stay PROPOSED, so batch_hour_accounting is untouched"
          - "increments ExceptionalEventDemonstration.version by 1"
      - from: SUBMITTED
        to: CONCURRED
        trigger: "POST /exceptional-event-demonstrations/{id}/determination with determination == CONCUR"
        actor: EpaRegionalReviewer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "determined_by_user_id and determined_at are stamped"
          - "hop 2: because the demonstration became CONCURRED, every EventExclusion with demonstration_id == this demonstration and status == PROPOSED moves to EFFECTIVE with effective_at set to the logical clock instant; excluded_hour_total is recomputed"
          - "hop 3: because those exclusions became EFFECTIVE, every DataBatch referenced by them re-runs batch_hour_accounting, which lowers event_excluded_hour_count's complement adjusted_scheduled_hour_count and refreshes completeness_pct and regulatory_use_eligible"
          - "hop 4: because those batches' completeness changed, every DesignValue whose site_id == the batch's site, pollutant_id == the batch's pollutant, status == PROVISIONAL and period_end_year in {batch.year, batch.year + 1, batch.year + 2} moves to SUPERSEDED with stale_reason == EVENT_EXCLUSION_APPLIED"
          - "hop 5: because those DesignValue rows became SUPERSEDED, MonitoringSite.current_attainment_status is recomputed and falls back to UNDETERMINED when no PROVISIONAL or FINAL row remains"
          - "increments ExceptionalEventDemonstration.version by 1"
      - from: SUBMITTED
        to: NON_CONCURRED
        trigger: "POST /exceptional-event-demonstrations/{id}/determination with determination == NON_CONCUR"
        actor: EpaRegionalReviewer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "determined_by_user_id and determined_at are stamped"
          - "every EventExclusion with demonstration_id == this demonstration and status == PROPOSED moves to REJECTED; effective_at stays null"
          - "no DataBatch, DesignValue or MonitoringSite field changes - the divergence from the CONCUR branch is exactly hops 3 to 5"
          - "increments ExceptionalEventDemonstration.version by 1"

  - entity: EventExclusion
    initial_state: PROPOSED
    terminal_states: [EFFECTIVE, REJECTED]
    transitions:
      - from: PROPOSED
        to: EFFECTIVE
        trigger: "system: hop 2 of the concurrence cascade"
        actor: system
        preconditions:
          - "the parent demonstration just moved to CONCURRED"
        side_effects:
          - "effective_at is set to the logical clock instant"
          - "the referenced DataBatch re-runs batch_hour_accounting (hop 3)"
          - "increments EventExclusion.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "system: side effect of the NON_CONCUR determination"
        actor: system
        preconditions:
          - "the parent demonstration just moved to NON_CONCURRED"
        side_effects:
          - "increments EventExclusion.version by 1"

  - entity: DesignValue
    initial_state: PROVISIONAL
    terminal_states: [FINAL, SUPERSEDED]
    transitions:
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /design-values/{id}/finalize"
        actor: EpaRegionalReviewer
        preconditions:
          - "status == PROVISIONAL"
          - "complete_year_count == the Pollutant's design_value_years (validation priority 65, ERR_DESIGN_VALUE_INCOMPLETE)"
        side_effects:
          - "finalized_by_user_id is stamped"
          - "MonitoringSite.current_attainment_status is recomputed"
          - "increments DesignValue.version by 1 and MonitoringSite.version by 1"
      - from: PROVISIONAL
        to: SUPERSEDED
        trigger: "system: a newer DesignValue for the same (site_id, pollutant_id, period_end_year, variant) key is created by POST /design-values"
        actor: system
        preconditions:
          - "status == PROVISIONAL"
        side_effects:
          - "stale_reason is set to RECOMPUTED"
          - "increments DesignValue.version by 1"
      - from: PROVISIONAL
        to: SUPERSEDED
        trigger: "system: hop 4 of the concurrence cascade, or the DesignValue-staleness side effect of POST /data-batches/{id}/reopen"
        actor: system
        preconditions:
          - "status == PROVISIONAL"
          - "a DataBatch feeding this row's period changed its event-exclusion or validation state"
        side_effects:
          - "stale_reason is set to EVENT_EXCLUSION_APPLIED for the concurrence cascade, BATCH_REVALIDATED for the reopen path"
          - "MonitoringSite.current_attainment_status is recomputed (hop 5)"
          - "increments DesignValue.version by 1"

  - entity: NetworkAssessment
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /network-assessments/{id}/submit"
        actor: ProgramManager
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "network_adequacy_score is re-run, refreshing required_population_site_count, coverage_ratio, adequacy_score and adequacy_tier"
          - "submitted_at is stamped"
          - "MonitoringNetwork.network_status becomes UNDER_ASSESSMENT and MonitoringNetwork.current_assessment_year becomes cycle_year"
          - "increments NetworkAssessment.version by 1 and MonitoringNetwork.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /network-assessments/{id}/decision with decision == APPROVE"
        actor: EpaRegionalReviewer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "approved_at and approved_by_user_id are stamped"
          - "MonitoringNetwork.network_status returns to ACTIVE"
          - "SiteChangeRequest rows citing this assessment now pass validation priority 53"
          - "increments NetworkAssessment.version by 1 and MonitoringNetwork.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /network-assessments/{id}/decision with decision == RETURN"
        actor: EpaRegionalReviewer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "return_count increments by 1"
          - "MonitoringNetwork.network_status returns to ACTIVE"
          - "increments NetworkAssessment.version by 1 and MonitoringNetwork.version by 1"
        note: "Closes the DRAFT -> SUBMITTED -> DRAFT revision cycle."

  - entity: SiteChangeRequest
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /site-change-requests/{id}/submit"
        actor: ProgramManager
        preconditions:
          - "status == DRAFT"
          - "the target MonitoringSite has status == OPERATING"
        side_effects:
          - "increments SiteChangeRequest.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /site-change-requests/{id}/decision with decision == REQUEST_REVISION"
        actor: EpaRegionalReviewer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "revision_request_count increments by 1"
          - "increments SiteChangeRequest.version by 1"
        note: "Closes the DRAFT -> SUBMITTED -> DRAFT revision cycle."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /site-change-requests/{id}/decision with decision == APPROVE"
        actor: EpaRegionalReviewer
        preconditions:
          - "status == SUBMITTED"
          - "the cited NetworkAssessment exists, has status == APPROVED and network_id == the target site's network_id (validation priority 53, cross_entity_state_dependency: SiteChangeRequest depends on NetworkAssessment)"
          - "the target MonitoringSite has status == OPERATING (validation priority 23)"
          - "for request_type == RELOCATION, the replacement MonitoringSite has status IN {SITING_APPROVED, OPERATING} (validation priority 54)"
        side_effects:
          - "decided_by_user_id, decided_at and effective_at are stamped"
          - "hop 1 fires the request-type-specific MonitoringSite transition: SEASONAL_SUSPENSION -> SUSPENDED, SHUTDOWN -> SHUTDOWN, RELOCATION -> RELOCATED, each with its own downstream hop chain"
          - "increments SiteChangeRequest.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /site-change-requests/{id}/decision with decision == DENY"
        actor: EpaRegionalReviewer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "decided_by_user_id and decided_at are stamped; effective_at stays null"
          - "no MonitoringSite field changes"
          - "increments SiteChangeRequest.version by 1"

  - entity: CertificationPackage
    initial_state: DRAFT
    terminal_states: [CERTIFIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /certification-packages/{id}/submit"
        actor: ProgramManager
        preconditions:
          - "status == DRAFT"
          - "certification_ready == true after a fresh certification_package_rollup (validation priority 75, ERR_PACKAGE_NOT_READY)"
        side_effects:
          - "every selected DataBatch moves submission_status UNSUBMITTED -> SUBMITTED while validation_status stays VALIDATED"
          - "increments CertificationPackage.version by 1 and each selected DataBatch.version by 1"
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /certification-packages/{id}/certify"
        actor: ProgramManager
        preconditions:
          - "status == SUBMITTED"
          - "every selected DataBatch has validation_status == VALIDATED (validation priority 24, ERR_MEMBER_BATCH_NOT_VALIDATED)"
          - "the calling X-User-ID is not the validated_by_user_id of any selected DataBatch (validation priority 56, ERR_SEGREGATION_OF_DUTIES)"
          - "the logical clock is strictly before certification_deadline (validation priority 71, ERR_CERTIFICATION_DEADLINE_PASSED)"
        side_effects:
          - "certified_by_user_id and certified_at are stamped"
          - "every selected DataBatch moves submission_status SUBMITTED -> CERTIFIED, which locks it against reopen"
          - "increments CertificationPackage.version by 1 and each selected DataBatch.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /certification-packages/{id}/reject"
        actor: EpaRegionalReviewer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "rejection_count increments by 1"
          - "every DataBatch matching this package's (network_id, pollutant_id, year) whose submission_status == SUBMITTED moves to UNSUBMITTED while validation_status stays VALIDATED"
          - "increments CertificationPackage.version by 1 and each demoted DataBatch.version by 1"
        note: "Closes the DRAFT -> SUBMITTED -> DRAFT rejection cycle."

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: invalidation-create-stale-batch
    parent_entity: DataBatch
    write_endpoint: "POST /data-batches/{id}/invalidations"
    occ_field: "expected_data_batch_version"
    description: |
      Creating a DataInvalidation against a DataBatch whose version has advanced since the
      client last observed it is rejected. Adding a second, non-overlapping invalidation to
      the same batch is a legitimate operation that no state precondition blocks, so a writer
      whose expected_data_batch_version predates the previous invalidation's hour-accounting
      recompute would be sizing its hour range against a stale completeness figure.
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412

  - rule_id: design-value-create-stale-site
    parent_entity: MonitoringSite
    write_endpoint: "POST /design-values"
    occ_field: "expected_monitoring_site_version"
    description: |
      Computing a DesignValue against a MonitoringSite whose version has advanced since the
      client last observed it is rejected. A new row for the same
      (site_id, pollutant_id, period_end_year, variant) key legitimately supersedes the prior
      PROVISIONAL row, so nothing in the state machine blocks the second computation; the OCC
      check is what guarantees the requester's view of the site - its attainment status and its
      monitor roster - is current.
    error_id: ERR_STALE_SITE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: siting_criteria_evaluation
    trigger: "POST /monitoring-sites (creation) and re-run on POST /monitoring-sites/{id}/siting-approval before validation priority 59 is evaluated"
    algorithm: threshold
    formula: |
      violations = empty set
      # C1 probe height band, applies to every site_type
      if not (PROBE_HEIGHT_MIN_M <= probe_height_m <= PROBE_HEIGHT_MAX_M):
          violations.add("PROBE_HEIGHT")
      # C2 roadway setback, POPULATION_ORIENTED only
      if site_type == "POPULATION_ORIENTED" and distance_to_roadway_m < POPULATION_ROADWAY_MIN_M:
          violations.add("ROADWAY_SETBACK")
      # C3 source proximity, SOURCE_ORIENTED only
      if site_type == "SOURCE_ORIENTED" and distance_to_source_m > SOURCE_MAX_DISTANCE_M:
          violations.add("SOURCE_DISTANCE")
      # C4 background isolation, BACKGROUND only
      if site_type == "BACKGROUND" and distance_to_roadway_m < BACKGROUND_ROADWAY_MIN_M:
          violations.add("BACKGROUND_ISOLATION")
      # C5 two-to-one obstruction clearance, applies to every site_type
      required_clearance_m = OBSTRUCTION_RATIO * (obstruction_height_m - probe_height_m)
      if required_clearance_m > 0 and distance_to_obstruction_m < required_clearance_m:
          violations.add("OBSTRUCTION_CLEARANCE")
      siting_violation_codes = sorted(violations)            # ascending alphabetical, deterministic
      siting_waiver_required = len(siting_violation_codes) > 0
    input_set: "the single MonitoringSite row being created or approved; no other entity participates"
    constants:
      PROBE_HEIGHT_MIN_M: 2.0
      PROBE_HEIGHT_MAX_M: 15.0
      POPULATION_ROADWAY_MIN_M: 10.0
      SOURCE_MAX_DISTANCE_M: 500.0
      BACKGROUND_ROADWAY_MIN_M: 100.0
      OBSTRUCTION_RATIO: 2.0
    precision: "distances and heights compared at full input precision; no rounding"

  - name: qc_event_outcome_evaluation
    trigger: "POST /monitors/{id}/qc-events, before the QcEvent row is persisted"
    algorithm: threshold
    formula: |
      method = the Monitor's ReferenceMethod
      if event_type == "SPAN_CHECK":
          d = round(abs(span_drift_pct), 2)
          limit = method.max_span_drift_pct
          outcome = "PASS" if d <= limit else ("WARN" if d <= limit * WARN_MULTIPLIER else "FAIL")
      elif event_type == "ZERO_CHECK":
          z = round(abs(zero_drift_value), 2)
          limit = method.zero_drift_limit
          outcome = "PASS" if z <= limit else ("WARN" if z <= limit * WARN_MULTIPLIER else "FAIL")
      else:   # CALIBRATION, PRECISION_CHECK, PREVENTIVE_MAINTENANCE
          outcome = "FAIL" if declared_failure else "PASS"
    input_set: "the request body plus the Monitor's ReferenceMethod limits; prior QcEvent rows are not consulted"
    constants:
      WARN_MULTIPLIER: 1.5
    precision: "absolute drift rounded to 2 decimal places, round_half_up, BEFORE the comparison; the comparison at the limit is inclusive so d == limit is PASS, not WARN"

  - name: monitor_qc_posture
    trigger: "recomputed on POST /monitors/{id}/qc-events, POST /monitors/{id}/approve, POST /monitors/{id}/commission, POST /monitors/{id}/service-status, POST /monitoring-sites/{id}/reinstate, the SEASONAL_SUSPENSION cascade, and POST /_clock/set_current_utc"
    algorithm: decay_function
    formula: |
      baseline = last_span_check_at if last_span_check_at is not null else installed_at
      interval = the Monitor's ReferenceMethod.required_span_check_interval_days
      elapsed_days = variant-specific, see variants
      if elapsed_days <= interval:                       posture = "QC_CURRENT"
      elif elapsed_days <= interval + QC_GRACE_DAYS:     posture = "QC_DUE"
      else:                                              posture = "QC_DELINQUENT"
    input_set: "the Monitor row, its ReferenceMethod interval, and the logical clock; monitors with monitor_status == DECOMMISSIONED keep their last computed posture and are excluded from MonitoringNetwork.delinquent_monitor_count"
    constants:
      QC_GRACE_DAYS: 7
    precision: "elapsed_days is a whole number obtained with floor(); no partial days"
    variants:
      - name: CALENDAR_ELAPSED
        when: "always written to Monitor.qc_posture; this is the field that gates DataBatch validation at validation priority 57"
        difference: "elapsed_days = floor((logical_clock - baseline) / 86400 seconds); time spent in OUT_OF_SERVICE counts against the monitor"
      - name: IN_SERVICE_ELAPSED
        when: "always written to Monitor.qc_posture_in_service; this is the field reported on certification packages and network assessments"
        difference: "elapsed_days = floor((logical_clock - baseline) / 86400 seconds) - out_of_service_day_count, floored at 0; days the instrument was formally out of service are forgiven, so a monitor can be QC_DELINQUENT on qc_posture and only QC_DUE on qc_posture_in_service for the same clock instant"

  - name: batch_hour_accounting
    trigger: "POST /data-batches and POST /data-batches/bulk-ingest (creation), POST /data-batches/{id}/invalidations, POST /data-invalidations/{id}/withdraw, POST /data-batches/{id}/validate, POST /data-batches/bulk-validate, and hop 3 of the concurrence cascade"
    algorithm: constraint_propagation
    formula: |
      # The five hour counters and the ratio all draw on the SAME invalidation and
      # exclusion sets, so the evaluation order below is normative. Evaluating S5
      # before S4, or computing the ratio against scheduled_hour_count instead of
      # adjusted_scheduled_hour_count, yields a different completeness_pct.
      S1: excused_hour_count =
            sum(inv.hours_affected for inv in DataInvalidation
                where inv.data_batch_id == batch.id
                  and inv.status == "APPLIED"
                  and inv.invalidation_code in EXCUSED_CODES)
      S2: invalidated_hour_count =
            sum(inv.hours_affected for inv in DataInvalidation
                where inv.data_batch_id == batch.id
                  and inv.status == "APPLIED"
                  and inv.invalidation_code not in EXCUSED_CODES)
      S3: event_excluded_hour_count =
            sum(ex.hours_affected for ex in EventExclusion
                where ex.data_batch_id == batch.id
                  and ex.status == "EFFECTIVE")
      S4: adjusted_scheduled_hour_count =
            scheduled_hour_count - excused_hour_count - event_excluded_hour_count
      S5: valid_hour_count = adjusted_scheduled_hour_count - invalidated_hour_count
      S6: completeness_pct =
            0.0 if adjusted_scheduled_hour_count == 0
            else round(100 * valid_hour_count / adjusted_scheduled_hour_count, 1)
      S7: regulatory_use_eligible =
            completeness_pct >= the Pollutant's completeness_threshold_pct
            # compares the ROUNDED completeness_pct; the comparison is inclusive (>=)
      # Conserved identity, asserted by compensating_invariant batch_hour_budget:
      #   scheduled_hour_count == valid_hour_count + invalidated_hour_count
      #                            + excused_hour_count + event_excluded_hour_count
    input_set: "DataInvalidation rows for this batch with status == APPLIED (WITHDRAWN rows are excluded), EventExclusion rows for this batch with status == EFFECTIVE (PROPOSED and REJECTED rows are excluded), and the Pollutant reached through Monitor.reference_method_id.pollutant_id"
    constants:
      EXCUSED_CODES: ["SCHEDULED_MAINTENANCE", "POWER_OUTAGE_UTILITY"]
      NON_EXCUSED_CODES: ["QC_FAILURE", "OPERATOR_ERROR", "INSTRUMENT_MALFUNCTION", "SITE_SHUTDOWN"]
    precision: "completeness_pct rounded to 1 decimal place, round_half_up, exactly once at S6; the S7 threshold comparison uses that rounded value, never the unrounded ratio"

  - name: primary_monitor_selection
    trigger: "POST /design-values, before design_value_computation runs"
    algorithm: aggregation
    formula: |
      candidates = [m for m in Monitor
                    where m.site_id == request.site_id
                      and m.reference_method_id.pollutant_id == request.pollutant_id
                      and m.is_primary_for_design_value == true
                      and m.monitor_status in {"OPERATING", "OUT_OF_SERVICE", "DECOMMISSIONED"}]
      if len(candidates) == 0:
          reject with ERR_PRIMARY_MONITOR_MISSING (422)      # empty-pool fallback
      ranked = sort candidates by (poc ASC, created_at ASC)  # tie-break on created_at, never on id
      primary_monitor_id = ranked[0].id
    input_set: "Monitor rows at the requested site whose method measures the requested pollutant; monitors with monitor_status IN {PENDING_APPROVAL, APPROVED} are excluded because they have never produced regulatory data"
    constants: {}
    precision: "integer poc comparison; created_at compared at millisecond resolution"

  - name: design_value_computation
    trigger: "POST /design-values, after primary_monitor_selection resolves primary_monitor_id"
    algorithm: tiered_pricing
    formula: |
      pollutant = the requested Pollutant
      dec       = pollutant.rounding_decimals
      years     = [period_end_year - 2, period_end_year - 1, period_end_year]   # index 0 = earliest
      annual_statistics = []
      complete_year_count = 0
      for Y in years:
          batches_Y = [b for b in DataBatch
                       where b.monitor_id == primary_monitor_id
                         and b.year == Y
                         and b.validation_status == "VALIDATED"
                         and b.regulatory_use_eligible == true]
          if len(batches_Y) != QUARTERS_PER_YEAR:
              continue                       # the year contributes no annual statistic
          complete_year_count += 1
          values = [concentration_of(b) for b in batches_Y]     # variant-specific, see variants
          if pollutant.standard_form == "ANNUAL_MEAN":
              raw_annual = sum(values) / QUARTERS_PER_YEAR
          elif pollutant.standard_form == "FOURTH_MAX_8HR":
              raw_annual = max(b.fourth_high_daily_max for b in batches_Y)
          else:   # PERCENTILE_98
              raw_annual = sorted(values)[-1]                   # highest of the four quarters
          # STEP-1 ROUNDING - normative and non-negotiable
          annual_statistics.append(round_half_up(raw_annual, dec))
      if complete_year_count != pollutant.design_value_years:
          design_value = null
          attainment_status = "INSUFFICIENT_DATA"
      else:
          # STEP-2: average the ALREADY-ROUNDED annual statistics, then TRUNCATE
          raw_dv = sum(annual_statistics) / pollutant.design_value_years
          design_value = truncate(raw_dv, dec)                   # toward zero, never rounds up
          attainment_status = "NONATTAINMENT" if design_value > pollutant.primary_standard_value \
                              else "ATTAINMENT"
      # Rounding-order note: "average the four unrounded quarterly values across all three
      # years, then round once" is a different and FORBIDDEN order. With quarterly means
      # 9.2/9.4/9.3/9.1 (2023), 9.0/9.1/9.2/8.9 (2024), 8.9/9.0/9.1/8.8 (2025) and dec == 1 the
      # normative order yields annual_statistics [9.3, 9.1, 9.0] -> raw_dv 9.13333 -> 9.1
      # (NONATTAINMENT against a 9.0 standard), while the forbidden order yields
      # [9.25, 9.05, 8.95] -> 9.08333 -> 9.0 (ATTAINMENT). The order decides the determination.
    input_set: "DataBatch rows of the selected primary monitor only, restricted to validation_status == VALIDATED and regulatory_use_eligible == true; RAW, IN_VALIDATION, REOPENED and INVALIDATED batches and ineligible batches are excluded, and a year missing any of its four qualifying quarters contributes nothing"
    constants:
      QUARTERS_PER_YEAR: 4
    precision: "round_half_up to Pollutant.rounding_decimals at STEP-1 (once per year), then truncate toward zero to the same number of decimals at STEP-2; no other rounding occurs; the attainment comparison is strict (design_value == primary_standard_value is ATTAINMENT)"
    variants:
      - name: WITH_EVENT_DATA
        when: "request body variant == WITH_EVENT_DATA"
        difference: "concentration_of(b) == b.quarterly_mean_concentration for every batch, whether or not the batch carries an EFFECTIVE EventExclusion; exceptional-event hours still influence the reported quarterly mean"
      - name: EXCLUDING_CONCURRED_EVENTS
        when: "request body variant == EXCLUDING_CONCURRED_EVENTS"
        difference: "concentration_of(b) == b.quarterly_mean_concentration_event_adjusted when at least one EventExclusion with status == EFFECTIVE references b, else b.quarterly_mean_concentration; on the worked example above, replacing 2024 Q3's 9.2 with an event-adjusted 7.9 moves annual_statistics to [9.3, 8.7, 9.0], the design value to 9.0 and attainment_status to ATTAINMENT"

  - name: certification_package_rollup
    trigger: "POST /certification-packages (creation), POST /certification-packages/{id}/submit, POST /certification-packages/{id}/certify, and whenever any selected DataBatch changes validation_status or re-runs batch_hour_accounting"
    algorithm: aggregation
    formula: |
      selected = [b for b in DataBatch
                  where b.monitor_id.site_id.network_id == package.network_id
                    and b.monitor_id.reference_method_id.pollutant_id == package.pollutant_id
                    and b.year == package.year
                    and b.validation_status == "VALIDATED"]
      selected = sort selected by (year ASC, quarter ASC, created_at ASC)   # reporting order, id never used
      included_batch_count = len(selected)
      eligible_batch_count = count(b for b in selected if b.regulatory_use_eligible == true)
      num = sum(b.valid_hour_count for b in selected)
      den = sum(b.adjusted_scheduled_hour_count for b in selected)
      rollup_completeness_pct = 0.0 if den == 0 else round(100 * num / den, 1)
      certification_ready = included_batch_count >= 1 and eligible_batch_count == included_batch_count
      certification_deadline = datetime(package.year + 1, 5, 1, 0, 0, 0, tz="UTC")   # set once at creation
    input_set: "DataBatch rows reached through Monitor -> MonitoringSite -> MonitoringNetwork and Monitor -> ReferenceMethod -> Pollutant, restricted to validation_status == VALIDATED; batches in RAW, IN_VALIDATION, REOPENED or INVALIDATED are excluded from every counter, which is why invalidating a member batch lowers included_batch_count rather than raising a mismatch"
    constants:
      CERTIFICATION_DEADLINE_MONTH: 5
      CERTIFICATION_DEADLINE_DAY: 1
    precision: "rollup_completeness_pct rounded to 1 decimal place, round_half_up, computed from summed hours rather than by averaging the per-batch completeness_pct values"

  - name: network_adequacy_score
    trigger: "POST /network-assessments (creation) and re-run on POST /network-assessments/{id}/submit"
    algorithm: weighted_scoring
    formula: |
      # A: population tier -> required population-oriented sites
      pop = the MonitoringNetwork's metropolitan_population
      if   pop <  500000:   required_population_site_count = 1
      elif pop < 1000000:   required_population_site_count = 2
      elif pop < 2500000:   required_population_site_count = 3
      else:                 required_population_site_count = 4
      # B: credited coverage, each credit capped by the requirement (nested min)
      op = [s for s in MonitoringSite where s.network_id == network.id and s.status == "OPERATING"]
      population_credit = min(count(s in op with s.site_type == "POPULATION_ORIENTED"),
                              required_population_site_count)
      source_credit     = min(count(s in op with s.site_type == "SOURCE_ORIENTED"),
                              REQUIRED_SOURCE_SITES)
      background_credit = min(count(s in op with s.site_type == "BACKGROUND"),
                              REQUIRED_BACKGROUND_SITES)
      denominator = required_population_site_count + REQUIRED_SOURCE_SITES + REQUIRED_BACKGROUND_SITES
      coverage_ratio = round((population_credit + source_credit + background_credit) / denominator, 4)
      # C: two multiplicative degradation factors, each capped
      qc_factor     = 1.0 - min(QC_PENALTY_CAP,     QC_PENALTY_PER_MONITOR * network.delinquent_monitor_count)
      siting_factor = 1.0 - min(SITING_PENALTY_CAP, SITING_PENALTY_PER_SITE * network.waiver_required_site_count)
      adequacy_score = round(100 * coverage_ratio * qc_factor * siting_factor, 1)
      # D: banding
      adequacy_tier = "ADEQUATE"    if adequacy_score >= ADEQUATE_MIN_SCORE
                 else "CONDITIONAL" if adequacy_score >= CONDITIONAL_MIN_SCORE
                 else "INADEQUATE"
    input_set: "MonitoringSite rows for the network with status == OPERATING only (PROPOSED, SITING_APPROVED, SUSPENDED, SHUTDOWN and RELOCATED sites earn no credit), plus the network's derived delinquent_monitor_count and waiver_required_site_count"
    constants:
      REQUIRED_SOURCE_SITES: 1
      REQUIRED_BACKGROUND_SITES: 1
      QC_PENALTY_PER_MONITOR: 0.10
      QC_PENALTY_CAP: 0.30
      SITING_PENALTY_PER_SITE: 0.05
      SITING_PENALTY_CAP: 0.20
      ADEQUATE_MIN_SCORE: 90.0
      CONDITIONAL_MIN_SCORE: 75.0
    precision: "coverage_ratio rounded to 4 decimals, adequacy_score rounded to 1 decimal, both round_half_up; the tier comparisons are inclusive at the lower bound (a score of exactly 90.0 is ADEQUATE)"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the declared role for the requested method and path includes X-User-Role"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request body parses, contains every required field, and every field satisfies its declared type, enum membership and numeric range; pagination limit is 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "every id in the path resolves to a live row, validated left to right"
    error_id: "ERR_POLLUTANT_NOT_FOUND | ERR_REFERENCE_METHOD_NOT_FOUND | ERR_NETWORK_NOT_FOUND | ERR_SITE_NOT_FOUND | ERR_MONITOR_NOT_FOUND | ERR_DATA_BATCH_NOT_FOUND | ERR_INVALIDATION_NOT_FOUND | ERR_DEMONSTRATION_NOT_FOUND | ERR_DESIGN_VALUE_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_CHANGE_REQUEST_NOT_FOUND | ERR_PACKAGE_NOT_FOUND"
    http_status: 404
    applies_to: "all paths carrying an {id} segment"
  - priority: 5
    category: existence
    check: "every foreign key supplied in the request body resolves to a live row, validated in the field order declared by the endpoint's input list"
    error_id: "ERR_POLLUTANT_NOT_FOUND | ERR_REFERENCE_METHOD_NOT_FOUND | ERR_NETWORK_NOT_FOUND | ERR_SITE_NOT_FOUND | ERR_MONITOR_NOT_FOUND | ERR_DATA_BATCH_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /reference-methods, POST /monitoring-sites, POST /monitors, POST /data-batches, POST /data-batches/bulk-ingest, POST /data-batches/bulk-validate, POST /exceptional-event-demonstrations, POST /exceptional-event-demonstrations/{id}/exclusions, POST /design-values, POST /network-assessments, POST /site-change-requests, POST /certification-packages"
  - priority: 10
    category: state
    check: "expected_data_batch_version equals the target DataBatch's current version"
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412
    applies_to: "POST /data-batches/{id}/invalidations"
  - priority: 11
    category: state
    check: "expected_monitoring_site_version equals the referenced MonitoringSite's current version"
    error_id: ERR_STALE_SITE_VERSION
    http_status: 412
    applies_to: "POST /design-values"
  - priority: 20
    category: state
    check: "the target row is in one of the from-states declared for the requested transition in section 1.2, and every precondition that transition declares over ANOTHER row's state also holds - the Monitor's MonitoringSite status on approve and commission, the parent DataBatch's validation_status on a child write, the demonstration's PROPOSED-exclusion set on submit, and the Monitor's consecutive_qc_failure_count on return-to-service"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every transition endpoint"
  - priority: 21
    category: state
    check: "the target row is not already in one of its machine's terminal_states"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "every transition endpoint"
  - priority: 22
    category: state
    check: "the DataBatch's submission_status != CERTIFIED, so certified data cannot be reopened"
    error_id: ERR_BATCH_CERTIFIED
    http_status: 409
    applies_to: "POST /data-batches/{id}/reopen"
  - priority: 23
    category: state
    check: "the target MonitoringSite has status == OPERATING when an approved SiteChangeRequest is about to change it"
    error_id: ERR_SITE_NOT_OPERATING
    http_status: 409
    applies_to: "POST /site-change-requests/{id}/submit, POST /site-change-requests/{id}/decision with decision == APPROVE"
  - priority: 24
    category: state
    check: "every DataBatch in the package's scope - reached through Monitor -> MonitoringSite -> the package's network_id and Monitor -> ReferenceMethod -> the package's pollutant_id with b.year == package.year - whose submission_status == SUBMITTED still has validation_status == VALIDATED, so a quarter reopened after submission blocks certification"
    error_id: ERR_MEMBER_BATCH_NOT_VALIDATED
    http_status: 409
    applies_to: "POST /certification-packages/{id}/certify"
  - priority: 25
    category: state
    check: "the parent DataBatch has validation_status != INVALIDATED before an invalidation is created, withdrawn, or an exclusion is attached to it"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /data-batches/{id}/invalidations, POST /data-invalidations/{id}/withdraw, POST /exceptional-event-demonstrations/{id}/exclusions"
  - priority: 26
    category: state
    check: "at least one EventExclusion with demonstration_id == the target demonstration and status == PROPOSED exists, and on a DRAFT -> SUBMITTED submit the demonstration's clear_causal_relationship == true; an INFO_REQUESTED -> SUBMITTED resubmission only re-checks the PROPOSED-exclusion clause"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /exceptional-event-demonstrations/{id}/submit"
  - priority: 27
    category: state
    check: "on POST /monitors/{id}/service-status with new_status == OPERATING the Monitor has consecutive_qc_failure_count == 0 and its MonitoringSite has status == OPERATING; on new_status == OUT_OF_SERVICE no extra clause applies beyond the from-state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /monitors/{id}/service-status"
  - priority: 50
    category: business_referential
    check: "the relevant ReferenceMethod has designation_status IN {DESIGNATED, CONDITIONAL}, effective_from <= the logical clock, and (withdrawn_on is null OR withdrawn_on > the logical clock)"
    error_id: ERR_METHOD_NOT_DESIGNATED
    http_status: 422
    applies_to: "POST /monitors/{id}/approve, POST /monitors/{id}/commission, POST /data-batches/{id}/validate, POST /data-batches/bulk-validate"
  - priority: 51
    category: business_referential
    check: "primary_monitor_selection finds at least one candidate monitor"
    error_id: ERR_PRIMARY_MONITOR_MISSING
    http_status: 422
    applies_to: "POST /design-values"
  - priority: 52
    category: business_referential
    check: "replacement_site_id is present when request_type == RELOCATION, and absent when request_type IN {SHUTDOWN, SEASONAL_SUSPENSION}"
    error_id: ERR_REPLACEMENT_SITE_REQUIRED
    http_status: 422
    applies_to: "POST /site-change-requests"
  - priority: 53
    category: business_referential
    check: "the cited NetworkAssessment has status == APPROVED and its network_id equals the target site's network_id"
    error_id: ERR_ASSESSMENT_NOT_APPROVED
    http_status: 422
    applies_to: "POST /site-change-requests/{id}/decision with decision == APPROVE"
  - priority: 54
    category: business_referential
    check: "for request_type == RELOCATION, the replacement MonitoringSite has status IN {SITING_APPROVED, OPERATING} and belongs to the same network"
    error_id: ERR_REPLACEMENT_SITE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /site-change-requests/{id}/decision with decision == APPROVE"
  - priority: 55
    category: business_safety
    check: "the calling X-User-ID does not appear in the DataBatch's invalidation_applied_by_user_ids - the officer who invalidated hours may not validate the quarter"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /data-batches/{id}/validate, POST /data-batches/bulk-validate"
  - priority: 56
    category: business_safety
    check: "the calling X-User-ID is not the validated_by_user_id of any DataBatch selected by the package - the manager who validated data may not certify it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /certification-packages/{id}/certify"
  - priority: 57
    category: business_safety
    check: "the DataBatch's Monitor has qc_posture != QC_DELINQUENT"
    error_id: ERR_MONITOR_QC_DELINQUENT
    http_status: 422
    applies_to: "POST /data-batches/{id}/validate, POST /data-batches/bulk-validate"
  - priority: 59
    category: business_safety
    check: "siting_waiver_required == false, or the request body carries waiver_granted == true"
    error_id: ERR_SITING_CRITERIA_NOT_MET
    http_status: 422
    applies_to: "POST /monitoring-sites/{id}/siting-approval"
  - priority: 60
    category: business_constraint
    check: "site_code is unique within the target network across MonitoringSite rows in any status"
    error_id: ERR_DUPLICATE_SITE_CODE
    http_status: 409
    applies_to: "POST /monitoring-sites"
  - priority: 61
    category: business_constraint
    check: "(monitor_id, year, quarter) is unique across DataBatch rows in any validation_status; inside a bulk-ingest the request's own items are also checked against each other"
    error_id: ERR_DUPLICATE_BATCH_PERIOD
    http_status: 409
    applies_to: "POST /data-batches, POST /data-batches/bulk-ingest"
  - priority: 62
    category: business_constraint
    check: "(site_id, the method's pollutant_id, poc) is unique among Monitor rows whose monitor_status != DECOMMISSIONED"
    error_id: ERR_DUPLICATE_MONITOR_POC
    http_status: 409
    applies_to: "POST /monitors"
  - priority: 63
    category: business_constraint
    check: "0 <= start_hour_index < end_hour_index <= the parent DataBatch's scheduled_hour_count"
    error_id: ERR_INVALIDATION_RANGE_OUT_OF_BOUNDS
    http_status: 422
    applies_to: "POST /data-batches/{id}/invalidations, POST /exceptional-event-demonstrations/{id}/exclusions"
  - priority: 64
    category: business_constraint
    check: "no DesignValue row with status == FINAL exists for the requested (site_id, pollutant_id, period_end_year, variant) key"
    error_id: ERR_DESIGN_VALUE_FINALIZED
    http_status: 409
    applies_to: "POST /design-values"
  - priority: 65
    category: business_constraint
    check: "complete_year_count equals the Pollutant's design_value_years"
    error_id: ERR_DESIGN_VALUE_INCOMPLETE
    http_status: 422
    applies_to: "POST /design-values/{id}/finalize"
  - priority: 66
    category: business_temporal
    check: "the half-open hour range [start_hour_index, end_hour_index) does not intersect the range of any other DataInvalidation on the same batch with status == APPLIED; abutting ranges (a.end_hour_index == b.start_hour_index) are accepted because the interval is half-open and carries no buffer"
    error_id: ERR_INVALIDATION_RANGE_OVERLAP
    http_status: 409
    applies_to: "POST /data-batches/{id}/invalidations"
  - priority: 67
    category: business_temporal
    check: "the half-open exclusion hour range does not intersect the range of any DataInvalidation on the same batch with status == APPLIED"
    error_id: ERR_EXCLUSION_OVERLAPS_INVALIDATION
    http_status: 409
    applies_to: "POST /exceptional-event-demonstrations/{id}/exclusions"
  - priority: 68
    category: business_temporal
    check: "the closed event window [event_start_date, event_end_date] expanded by EVENT_BUFFER_HOURS on both ends does not intersect the closed window of any other ExceptionalEventDemonstration with the same site_id and event_type whose status IN {DRAFT, SUBMITTED, INFO_REQUESTED, CONCURRED}; formally rejected when new.event_start_date - 24h <= other.event_end_date AND other.event_start_date - 24h <= new.event_end_date"
    error_id: ERR_EVENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /exceptional-event-demonstrations"
  - priority: 69
    category: business_temporal
    check: "the exclusion hour range lies inside the demonstration's event window mapped onto the batch quarter: start_hour_index >= floor((event_start_date - quarter_start_utc)/1h) and end_hour_index <= floor((event_end_date + 24h - quarter_start_utc)/1h); the batch's quarter must also contain the whole mapped window"
    error_id: ERR_EVENT_WINDOW_OUTSIDE_BATCH_PERIOD
    http_status: 422
    applies_to: "POST /exceptional-event-demonstrations/{id}/exclusions"
  - priority: 70
    category: business_temporal
    check: "the reported quarter has ended: the first instant of the following quarter is <= the logical clock"
    error_id: ERR_BATCH_PERIOD_NOT_ENDED
    http_status: 422
    applies_to: "POST /data-batches, POST /data-batches/bulk-ingest"
  - priority: 71
    category: business_temporal
    check: "the logical clock is strictly before the package's certification_deadline"
    error_id: ERR_CERTIFICATION_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /certification-packages/{id}/certify"
  - priority: 75
    category: business_fiscal
    check: "certification_ready == true after a fresh certification_package_rollup"
    error_id: ERR_PACKAGE_NOT_READY
    http_status: 422
    applies_to: "POST /certification-packages/{id}/submit"
  - priority: 76
    category: business_fiscal
    check: "at least one DataBatch matches the bulk-validate selector (monitor_id, optional year, validation_status == RAW)"
    error_id: ERR_NO_ELIGIBLE_BATCHES
    http_status: 422
    applies_to: "POST /data-batches/bulk-validate"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # ---- Pollutant catalogue -------------------------------------------------
  - method: POST
    path: "/pollutants"
    description: "Register a criteria pollutant with its standard form, standard level, completeness threshold and rounding precision. Immutable once created."
    roles: [NetworkAdmin]
    code: 201
    input: [code, averaging_period_hours, standard_form, primary_standard_value, "design_value_years?", "completeness_threshold_pct?", "rounding_decimals?"]
    output: Pollutant
    side_effects: []
  - method: GET
    path: "/pollutants/{id}"
    description: "Fetch one pollutant."
    roles: [NetworkAdmin, FieldTechnician, QaOfficer, ProgramManager, EpaRegionalReviewer]
    code: 200
    input: []
    output: Pollutant
    side_effects: []
  - method: GET
    path: "/pollutants/{id}/reference-methods"
    description: "List every ReferenceMethod designated for this pollutant, in any designation_status."
    roles: [NetworkAdmin, FieldTechnician, QaOfficer, ProgramManager, EpaRegionalReviewer]
    code: 200
    input: ["designation_status?", "limit?", "offset?"]
    output: ReferenceMethod[]
    side_effects: []

  # ---- Reference methods --------------------------------------------------
  - method: POST
    path: "/reference-methods"
    description: "Designate a federal reference or equivalent method for a pollutant and pin its QC tolerances and check intervals. Created in designation_status DESIGNATED."
    roles: [NetworkAdmin]
    code: 201
    input: [pollutant_id, method_code, designation_type, effective_from, max_span_drift_pct, zero_drift_limit, required_span_check_interval_days, required_calibration_interval_days]
    output: ReferenceMethod
    side_effects: ["ReferenceMethod enters designation_status DESIGNATED with designation_change_count 0 and withdrawn_on null"]
  - method: POST
    path: "/reference-methods/{id}/designation"
    description: "Move a method's federal designation between DESIGNATED, CONDITIONAL and WITHDRAWN."
    roles: [EpaRegionalReviewer]
    code: 200
    input: [new_designation_status, "determination_note?"]
    output: ReferenceMethod
    side_effects: ["designation_change_count increments by 1", "withdrawn_on is set to the logical clock when new_designation_status == WITHDRAWN and cleared to null otherwise", "monitor_qc_posture and batch_hour_accounting consumers see the new tolerances from the next call onward"]
  - method: GET
    path: "/reference-methods/{id}"
    description: "Fetch one reference method."
    roles: [NetworkAdmin, FieldTechnician, QaOfficer, ProgramManager, EpaRegionalReviewer]
    code: 200
    input: []
    output: ReferenceMethod
    side_effects: []

  # ---- Networks -----------------------------------------------------------
  - method: POST
    path: "/monitoring-networks"
    description: "Create a state monitoring network with the metropolitan population that drives the population-oriented site requirement."
    roles: [NetworkAdmin]
    code: 201
    input: [name, agency_code, metropolitan_population]
    output: MonitoringNetwork
    side_effects: ["all site-census and delinquency counters initialise to 0", "network_status initialises to ACTIVE and current_assessment_year to null"]
  - method: GET
    path: "/monitoring-networks/{id}"
    description: "Fetch one network with its freshly recomputed site census, waiver count and delinquent-monitor count."
    roles: [NetworkAdmin, FieldTechnician, QaOfficer, ProgramManager, EpaRegionalReviewer]
    code: 200
    input: []
    output: MonitoringNetwork
    side_effects: []
  - method: GET
    path: "/monitoring-networks/{id}/assessments"
    description: "List every NetworkAssessment cycle recorded for this network."
    roles: [NetworkAdmin, FieldTechnician, QaOfficer, ProgramManager, EpaRegionalReviewer]
    code: 200
    input: ["status?", "cycle_year?", "limit?", "offset?"]
    output: NetworkAssessment[]
    side_effects: []
  - method: GET
    path: "/monitoring-networks/{id}/certification-packages"
    description: "List every CertificationPackage raised for this network."
    roles: [NetworkAdmin, FieldTechnician, QaOfficer, ProgramManager, EpaRegionalReviewer]
    code: 200
    input: ["year?", "status?", "limit?", "offset?"]
    output: CertificationPackage[]
    side_effects: []

  # ---- Sites --------------------------------------------------------------
  - method: POST
    path: "/monitoring-sites"
    description: "Propose a monitoring site with its siting geometry. siting_criteria_evaluation runs immediately, so the response already carries siting_violation_codes and siting_waiver_required."
    roles: [NetworkAdmin]
    code: 201
    input: [network_id, site_code, site_type, latitude, longitude, population_served, probe_height_m, distance_to_roadway_m, distance_to_obstruction_m, obstruction_height_m, "distance_to_source_m?"]
    output: MonitoringSite
    side_effects: ["siting_criteria_evaluation populates siting_violation_codes and siting_waiver_required", "MonitoringSite enters status PROPOSED with siting_waiver_granted false", "the network's total_site_count, proposed_site_count and waiver_required_site_count are recomputed"]
  - method: POST
    path: "/monitoring-sites/{id}/siting-approval"
    description: "Regional approval of the site's location; a site failing any siting criterion is approvable only with waiver_granted true."
    roles: [EpaRegionalReviewer]
    code: 200
    input: ["waiver_granted?", "approval_note?"]
    output: MonitoringSite
    side_effects: ["status moves PROPOSED -> SITING_APPROVED", "siting_waiver_granted is set to the submitted waiver_granted value", "the network's proposed_site_count and approved_site_count are recomputed"]
  - method: POST
    path: "/monitoring-sites/{id}/commence-operations"
    description: "Declare the approved site operational and stamp operations_start_at from the logical clock."
    roles: [ProgramManager]
    code: 200
    input: ["operations_note?"]
    output: MonitoringSite
    side_effects: ["status moves SITING_APPROVED -> OPERATING", "operations_start_at is set to the logical clock", "the network's approved_site_count and operating_site_count are recomputed"]
  - method: POST
    path: "/monitoring-sites/{id}/reinstate"
    description: "Return a seasonally suspended site to service, closing out the out-of-service accrual on each of its monitors."
    roles: [ProgramManager]
    code: 200
    input: ["reinstatement_note?"]
    output: MonitoringSite
    side_effects: ["status moves SUSPENDED -> OPERATING and suspended_at is cleared to null", "every Monitor at the site with monitor_status == OUT_OF_SERVICE returns to OPERATING, its out_of_service_day_count grows by the whole days elapsed since out_of_service_since, and out_of_service_since is cleared", "monitor_qc_posture is recomputed for both variants on every affected monitor", "the network's suspended_site_count and operating_site_count are recomputed"]
  - method: GET
    path: "/monitoring-sites/{id}"
    description: "Fetch one site with recomputed siting evaluation, operating monitor count and current attainment status."
    roles: [NetworkAdmin, FieldTechnician, QaOfficer, ProgramManager, EpaRegionalReviewer]
    code: 200
    input: []
    output: MonitoringSite
    side_effects: []
  - method: GET
    path: "/monitoring-sites"
    description: "List sites filtered by network, by the site they replace, by siting objective class or by lifecycle status."
    roles: [NetworkAdmin, FieldTechnician, QaOfficer, ProgramManager, EpaRegionalReviewer]
    code: 200
    input: ["network_id?", "replaces_site_id?", "site_type?", "status?", "siting_waiver_required?", "limit?", "offset?"]
    output: MonitoringSite[]
    side_effects: []

  # ---- Monitors -----------------------------------------------------------
  - method: POST
    path: "/monitors"
    description: "Install an instrument at a site under a designated reference method, with a parameter occurrence code unique among the site's live monitors for that pollutant."
    roles: [NetworkAdmin]
    code: 201
    input: [site_id, reference_method_id, poc, "is_primary_for_design_value?", installed_at]
    output: Monitor
    side_effects: ["Monitor enters monitor_status PENDING_APPROVAL with every QC timestamp null, consecutive_qc_failure_count 0 and out_of_service_day_count 0", "monitor_qc_posture yields qc_posture and qc_posture_in_service from installed_at because no QcEvent exists yet"]
  - method: POST
    path: "/monitors/{id}/approve"
    description: "Regional instrument approval: confirms the instrument implements a currently designated method."
    roles: [EpaRegionalReviewer]
    code: 200
    input: ["approval_note?"]
    output: Monitor
    side_effects: ["monitor_status moves PENDING_APPROVAL -> APPROVED"]
  - method: POST
    path: "/monitors/{id}/commission"
    description: "Place an approved instrument into routine operation at an operating site."
    roles: [FieldTechnician]
    code: 200
    input: ["commission_note?"]
    output: Monitor
    side_effects: ["monitor_status moves APPROVED -> OPERATING", "the site's operating_monitor_count and the network's delinquent_monitor_count are recomputed", "primary_monitor_selection now considers this monitor"]
  - method: POST
    path: "/monitors/{id}/service-status"
    description: "Take an operating instrument out of service or return it to service, maintaining the out-of-service day accrual that the IN_SERVICE_ELAPSED QC variant depends on."
    roles: [FieldTechnician]
    code: 200
    input: [new_status, "reason?"]
    output: Monitor
    side_effects: ["monitor_status moves OPERATING -> OUT_OF_SERVICE with out_of_service_since set to the logical clock, or OUT_OF_SERVICE -> OPERATING with out_of_service_day_count grown by the whole days elapsed since out_of_service_since and out_of_service_since cleared", "monitor_qc_posture is recomputed for both variants", "the site's operating_monitor_count and the network's delinquent_monitor_count are recomputed"]
  - method: POST
    path: "/monitors/{id}/qc-events"
    description: "Log a calibration, span check, zero check, precision check or preventive-maintenance activity. qc_event_outcome_evaluation grades the event from the method's tolerances; the event row is immutable."
    roles: [FieldTechnician]
    code: 201
    input: [event_type, performed_at, "span_drift_pct?", "zero_drift_value?", "declared_failure?"]
    output: QcEvent
    side_effects: ["qc_event_outcome_evaluation sets outcome to PASS, WARN or FAIL", "the matching last_*_at timestamp on the monitor advances to the request's performed_at when outcome IN {PASS, WARN}, and is left unchanged on FAIL", "consecutive_qc_failure_count increments on FAIL and resets to 0 on PASS or WARN", "an OPERATING monitor moves to OUT_OF_SERVICE when outcome == FAIL, setting out_of_service_since to the logical clock", "monitor_qc_posture is recomputed for both variants and the network's delinquent_monitor_count is recomputed"]
  - method: GET
    path: "/monitors/{id}"
    description: "Fetch one monitor with both recomputed QC postures."
    roles: [NetworkAdmin, FieldTechnician, QaOfficer, ProgramManager, EpaRegionalReviewer]
    code: 200
    input: []
    output: Monitor
    side_effects: []
  - method: GET
    path: "/monitors"
    description: "List monitors filtered by site, by reference method, by lifecycle status or by QC posture."
    roles: [NetworkAdmin, FieldTechnician, QaOfficer, ProgramManager, EpaRegionalReviewer]
    code: 200
    input: ["site_id?", "reference_method_id?", "monitor_status?", "qc_posture?", "is_primary_for_design_value?", "limit?", "offset?"]
    output: Monitor[]
    side_effects: []
  - method: GET
    path: "/monitors/{id}/qc-events"
    description: "List the instrument's quality-control history, most recent performed_at first."
    roles: [NetworkAdmin, FieldTechnician, QaOfficer, ProgramManager, EpaRegionalReviewer]
    code: 200
    input: ["event_type?", "outcome?", "limit?", "offset?"]
    output: QcEvent[]
    side_effects: []

  # ---- Data batches -------------------------------------------------------
  - method: POST
    path: "/data-batches"
    description: "Report one monitor-quarter of ambient data. batch_hour_accounting runs immediately, so completeness_pct and regulatory_use_eligible are populated in the response."
    roles: [QaOfficer]
    code: 201
    input: [monitor_id, year, quarter, scheduled_hour_count, quarterly_mean_concentration, "quarterly_mean_concentration_event_adjusted?", "fourth_high_daily_max?"]
    output: DataBatch
    side_effects: ["batch_hour_accounting computes the excused, invalidated, event-excluded, adjusted, valid and completeness figures", "validation_status initialises to RAW and submission_status to UNSUBMITTED", "reopen_count initialises to 0 and invalidation_applied_by_user_ids to the empty list"]
  - method: POST
    path: "/data-batches/bulk-ingest"
    description: "Report many monitor-quarters for one monitor in a single transactional call; any rejected item fails the whole request so no partial quarter set is created."
    roles: [QaOfficer]
    code: 201
    input: [monitor_id, batches]
    output: DataBatch[]
    side_effects: ["each item is validated in list order against the same rules as POST /data-batches, including the duplicate (monitor_id, year, quarter) check against the request's own earlier items", "on any item failure nothing is persisted and the first offending item's error is returned", "batch_hour_accounting runs per created batch"]
  - method: POST
    path: "/data-batches/bulk-validate"
    description: "Validate every RAW quarter for one monitor in one call, skipping quarters that are not RAW. Applies the same segregation-of-duties, method-designation and QC-posture gates as the single-batch validate."
    roles: [QaOfficer]
    code: 200
    input: [monitor_id, "year?"]
    output: DataBatch[]
    side_effects: ["every matched RAW batch moves validation_status RAW -> VALIDATED and records validated_by_user_id", "quarters in IN_VALIDATION, VALIDATED, REOPENED or INVALIDATED are skipped rather than rejected", "the response lists only the batches actually transitioned, ordered by year then quarter"]
  - method: POST
    path: "/data-batches/{id}/begin-validation"
    description: "Open a quarter for quality-control review, from RAW or from REOPENED."
    roles: [QaOfficer]
    code: 200
    input: []
    output: DataBatch
    side_effects: ["validation_status moves RAW -> IN_VALIDATION or REOPENED -> IN_VALIDATION", "validated_by_user_id is cleared to null"]
  - method: POST
    path: "/data-batches/{id}/invalidations"
    description: "Invalidate a half-open hour range of the quarter under a stated invalidation code. Requires the caller's expected_data_batch_version and bumps the batch's version."
    roles: [QaOfficer]
    code: 201
    input: [start_hour_index, end_hour_index, invalidation_code, expected_data_batch_version]
    output: DataInvalidation
    side_effects: ["DataInvalidation is created with status APPLIED, hours_affected = end_hour_index - start_hour_index and applied_by_user_id = X-User-ID", "the parent DataBatch's version increments by 1", "the caller's X-User-ID is added to the batch's invalidation_applied_by_user_ids if absent", "batch_hour_accounting reruns on the parent batch, moving hours into excused_hour_count or invalidated_hour_count according to EXCUSED_CODES and refreshing completeness_pct and regulatory_use_eligible", "certification_package_rollup is refreshed on every CertificationPackage that selects this batch, so a package in status DRAFT sees included_batch_count, eligible_batch_count, rollup_completeness_pct and certification_ready move in the same request"]
  - method: POST
    path: "/data-invalidations/{id}/withdraw"
    description: "Withdraw an applied invalidation, returning its hours to the completeness computation."
    roles: [QaOfficer]
    code: 200
    input: [withdrawn_reason]
    output: DataInvalidation
    side_effects: ["status moves APPLIED -> WITHDRAWN and withdrawn_reason is stored", "batch_hour_accounting reruns on the parent batch and the batch_hour_budget invariant holds again with the withdrawn hours back in valid_hour_count", "the parent DataBatch's version increments by 1"]
  - method: POST
    path: "/data-batches/{id}/validate"
    description: "Accept the quarter for regulatory use. Enforces segregation of duties against the invalidating officer, current method designation and non-delinquent QC posture."
    roles: [QaOfficer]
    code: 200
    input: ["validation_note?"]
    output: DataBatch
    side_effects: ["validation_status moves IN_VALIDATION -> VALIDATED", "validated_by_user_id is set to X-User-ID", "certification_package_rollup for any DRAFT CertificationPackage covering this quarter is refreshed"]
  - method: POST
    path: "/data-batches/{id}/invalidate"
    description: "Reject the whole quarter for regulatory use, terminating the batch's validation dimension."
    roles: [QaOfficer]
    code: 200
    input: ["invalidation_note?"]
    output: DataBatch
    side_effects: ["validation_status moves IN_VALIDATION -> INVALIDATED or REOPENED -> INVALIDATED", "batch_invalidation_reason is set to QA_REJECTED", "validated_by_user_id is cleared to null", "certification_package_rollup for any DRAFT CertificationPackage covering this quarter is refreshed"]
  - method: POST
    path: "/data-batches/{id}/reopen"
    description: "Reopen a validated quarter for further quality-control work; certified quarters cannot be reopened."
    roles: [QaOfficer]
    code: 200
    input: [reopen_reason]
    output: DataBatch
    side_effects: ["validation_status moves VALIDATED -> REOPENED and reopen_count increments by 1", "validated_by_user_id is cleared to null", "every DesignValue row with status == PROVISIONAL that consumed this quarter moves to SUPERSEDED with stale_reason BATCH_REOPENED"]
  - method: GET
    path: "/data-batches/{id}"
    description: "Fetch one quarter with the recomputed hour accounting and both status dimensions."
    roles: [NetworkAdmin, FieldTechnician, QaOfficer, ProgramManager, EpaRegionalReviewer]
    code: 200
    input: []
    output: DataBatch
    side_effects: []
  - method: GET
    path: "/data-batches"
    description: "List quarters filtered by monitor, calendar period, validation dimension or submission dimension."
    roles: [NetworkAdmin, FieldTechnician, QaOfficer, ProgramManager, EpaRegionalReviewer]
    code: 200
    input: ["monitor_id?", "year?", "quarter?", "validation_status?", "submission_status?", "regulatory_use_eligible?", "limit?", "offset?"]
    output: DataBatch[]
    side_effects: []
  - method: GET
    path: "/data-batches/{id}/invalidations"
    description: "List every invalidation raised against the quarter, applied and withdrawn alike, ordered by start_hour_index."
    roles: [NetworkAdmin, FieldTechnician, QaOfficer, ProgramManager, EpaRegionalReviewer]
    code: 200
    input: ["status?", "invalidation_code?", "limit?", "offset?"]
    output: DataInvalidation[]
    side_effects: []
  - method: GET
    path: "/data-batches/{id}/exclusions"
    description: "List every exceptional-event exclusion attached to the quarter, ordered by start_hour_index."
    roles: [NetworkAdmin, FieldTechnician, QaOfficer, ProgramManager, EpaRegionalReviewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EventExclusion[]
    side_effects: []

  # ---- Exceptional event demonstrations -----------------------------------
  - method: POST
    path: "/exceptional-event-demonstrations"
    description: "Open a wildfire, dust, prescribed-fire, stratospheric-ozone or volcanic-activity demonstration for one site and pollutant over a closed event window. The window is checked against other live demonstrations for the same site and event type with a 24-hour buffer."
    roles: [ProgramManager]
    code: 201
    input: [site_id, pollutant_id, event_type, event_start_date, event_end_date, narrative, clear_causal_relationship]
    output: ExceptionalEventDemonstration
    side_effects: ["ExceptionalEventDemonstration enters status DRAFT with info_request_count 0 and excluded_hour_total 0"]
  - method: POST
    path: "/exceptional-event-demonstrations/{id}/exclusions"
    description: "Nominate a half-open hour range of one quarter for exclusion from determinations. The range must sit inside the event window mapped onto that quarter and must not collide with an applied invalidation."
    roles: [ProgramManager]
    code: 201
    input: [data_batch_id, start_hour_index, end_hour_index]
    output: EventExclusion
    side_effects: ["EventExclusion is created with status PROPOSED and hours_affected = end_hour_index - start_hour_index", "the demonstration's excluded_hour_total is unchanged because only EFFECTIVE exclusions count", "batch_hour_accounting on the target quarter is unchanged for the same reason"]
  - method: POST
    path: "/exceptional-event-demonstrations/{id}/submit"
    description: "Submit the demonstration for regional review, from DRAFT or after an information request."
    roles: [ProgramManager]
    code: 200
    input: ["submission_note?"]
    output: ExceptionalEventDemonstration
    side_effects: ["status moves DRAFT -> SUBMITTED or INFO_REQUESTED -> SUBMITTED"]
  - method: POST
    path: "/exceptional-event-demonstrations/{id}/request-info"
    description: "Return a submitted demonstration to the agency for more information."
    roles: [EpaRegionalReviewer]
    code: 200
    input: [info_request_note]
    output: ExceptionalEventDemonstration
    side_effects: ["status moves SUBMITTED -> INFO_REQUESTED and info_request_count increments by 1"]
  - method: POST
    path: "/exceptional-event-demonstrations/{id}/determination"
    description: "Record the regional concurrence determination. CONCUR makes every proposed exclusion effective and ripples through hour accounting, completeness and any provisional design value; NON_CONCUR rejects them."
    roles: [EpaRegionalReviewer]
    code: 200
    input: [determination, "determination_note?"]
    output: ExceptionalEventDemonstration
    side_effects: ["status moves SUBMITTED -> CONCURRED or SUBMITTED -> NON_CONCURRED, stamping determined_by_user_id and determined_at", "on CONCUR every EventExclusion with status PROPOSED moves to EFFECTIVE with effective_at set to the logical clock, and excluded_hour_total is refreshed", "on CONCUR batch_hour_accounting reruns on every touched DataBatch, moving hours into event_excluded_hour_count and shrinking adjusted_scheduled_hour_count", "on CONCUR every DesignValue with status PROVISIONAL for the demonstration's (site_id, pollutant_id) moves to SUPERSEDED with stale_reason EVENT_EXCLUSION_APPLIED", "on NON_CONCUR every EventExclusion with status PROPOSED moves to REJECTED and no hour accounting changes"]
  - method: GET
    path: "/exceptional-event-demonstrations/{id}"
    description: "Fetch one demonstration with its refreshed effective excluded-hour total."
    roles: [NetworkAdmin, FieldTechnician, QaOfficer, ProgramManager, EpaRegionalReviewer]
    code: 200
    input: []
    output: ExceptionalEventDemonstration
    side_effects: []
  - method: GET
    path: "/exceptional-event-demonstrations"
    description: "List demonstrations filtered by site, pollutant, event class or review status."
    roles: [NetworkAdmin, FieldTechnician, QaOfficer, ProgramManager, EpaRegionalReviewer]
    code: 200
    input: ["site_id?", "pollutant_id?", "event_type?", "status?", "limit?", "offset?"]
    output: ExceptionalEventDemonstration[]
    side_effects: []
  - method: GET
    path: "/exceptional-event-demonstrations/{id}/exclusions"
    description: "List every exclusion nominated under this demonstration, ordered by data_batch_id then start_hour_index."
    roles: [NetworkAdmin, FieldTechnician, QaOfficer, ProgramManager, EpaRegionalReviewer]
    code: 200
    input: ["status?", "data_batch_id?", "limit?", "offset?"]
    output: EventExclusion[]
    side_effects: []

  # ---- Design values ------------------------------------------------------
  - method: POST
    path: "/design-values"
    description: "Compute a design value for a site, pollutant and three-year period under the chosen variant. Requires the caller's expected_monitoring_site_version and bumps the site's version, so two operators cannot race a determination against a changing site."
    roles: [ProgramManager]
    code: 201
    input: [site_id, pollutant_id, period_end_year, variant, expected_monitoring_site_version]
    output: DesignValue
    side_effects: ["primary_monitor_selection picks primary_monitor_id", "design_value_computation fills annual_statistics, complete_year_count, design_value and attainment_status under the requested variant", "any earlier DesignValue with status PROVISIONAL for the same (site_id, pollutant_id, period_end_year, variant) key moves to SUPERSEDED with stale_reason RECOMPUTED", "the referenced MonitoringSite's version increments by 1 and its current_attainment_status is refreshed", "status initialises to PROVISIONAL"]
  - method: POST
    path: "/design-values/{id}/finalize"
    description: "Finalize a provisional design value as the site's regulatory attainment determination; requires all three years complete."
    roles: [EpaRegionalReviewer]
    code: 200
    input: ["finalization_note?"]
    output: DesignValue
    side_effects: ["status moves PROVISIONAL -> FINAL and finalized_by_user_id is set to X-User-ID", "the site's current_attainment_status is refreshed from this row"]
  - method: GET
    path: "/design-values/{id}"
    description: "Fetch one design value."
    roles: [NetworkAdmin, FieldTechnician, QaOfficer, ProgramManager, EpaRegionalReviewer]
    code: 200
    input: []
    output: DesignValue
    side_effects: []
  - method: GET
    path: "/design-values"
    description: "List design values filtered by site, pollutant, primary monitor, period, variant or status."
    roles: [NetworkAdmin, FieldTechnician, QaOfficer, ProgramManager, EpaRegionalReviewer]
    code: 200
    input: ["site_id?", "pollutant_id?", "primary_monitor_id?", "period_end_year?", "variant?", "status?", "limit?", "offset?"]
    output: DesignValue[]
    side_effects: []

  # ---- Certification packages ---------------------------------------------
  - method: POST
    path: "/certification-packages"
    description: "Open the annual data-certification package for a network, pollutant and calendar year. certification_package_rollup selects the member quarters and certification_deadline is pinned to May 1 of the following year."
    roles: [ProgramManager]
    code: 201
    input: [network_id, pollutant_id, year]
    output: CertificationPackage
    side_effects: ["certification_deadline is computed as May 1 of year + 1 at 00:00:00Z", "certification_package_rollup fills included_batch_count, eligible_batch_count, rollup_completeness_pct and certification_ready", "status initialises to DRAFT with rejection_count 0"]
  - method: POST
    path: "/certification-packages/{id}/submit"
    description: "Submit the annual package to the national database; every member quarter must be eligible for regulatory use."
    roles: [ProgramManager]
    code: 200
    input: ["submission_note?"]
    output: CertificationPackage
    side_effects: ["certification_package_rollup is refreshed before the readiness gate is applied", "status moves DRAFT -> SUBMITTED", "every member DataBatch with submission_status == UNSUBMITTED moves to SUBMITTED"]
  - method: POST
    path: "/certification-packages/{id}/certify"
    description: "Certify the annual data set before the certification deadline. Enforces segregation of duties against the officers that validated the member quarters."
    roles: [ProgramManager]
    code: 200
    input: ["certification_statement?"]
    output: CertificationPackage
    side_effects: ["status moves SUBMITTED -> CERTIFIED, stamping certified_by_user_id and certified_at", "every member DataBatch with submission_status == SUBMITTED moves to CERTIFIED and is thereafter unreopenable"]
  - method: POST
    path: "/certification-packages/{id}/reject"
    description: "Regional rejection of a submitted package, returning it to DRAFT for rework."
    roles: [EpaRegionalReviewer]
    code: 200
    input: [rejection_reason]
    output: CertificationPackage
    side_effects: ["status moves SUBMITTED -> DRAFT and rejection_count increments by 1", "every member DataBatch with submission_status == SUBMITTED returns to UNSUBMITTED"]
  - method: GET
    path: "/certification-packages/{id}"
    description: "Fetch one package with a freshly recomputed rollup."
    roles: [NetworkAdmin, FieldTechnician, QaOfficer, ProgramManager, EpaRegionalReviewer]
    code: 200
    input: []
    output: CertificationPackage
    side_effects: []
  - method: GET
    path: "/certification-packages"
    description: "List packages filtered by network, pollutant, year or submission state."
    roles: [NetworkAdmin, FieldTechnician, QaOfficer, ProgramManager, EpaRegionalReviewer]
    code: 200
    input: ["network_id?", "pollutant_id?", "year?", "status?", "limit?", "offset?"]
    output: CertificationPackage[]
    side_effects: []

  # ---- Network assessments -------------------------------------------------
  - method: POST
    path: "/network-assessments"
    description: "Open a network assessment cycle. network_adequacy_score runs immediately from the network's population tier, credited site mix, delinquent monitors and waivered sites."
    roles: [ProgramManager]
    code: 201
    input: [network_id, cycle_year]
    output: NetworkAssessment
    side_effects: ["network_adequacy_score fills required_population_site_count, coverage_ratio, adequacy_score and adequacy_tier", "status initialises to DRAFT with return_count 0"]
  - method: POST
    path: "/network-assessments/{id}/submit"
    description: "Submit the assessment for regional review; the network is marked UNDER_ASSESSMENT while it is pending."
    roles: [ProgramManager]
    code: 200
    input: ["submission_note?"]
    output: NetworkAssessment
    side_effects: ["network_adequacy_score is recomputed from the network's present census before submission", "status moves DRAFT -> SUBMITTED and submitted_at is stamped from the logical clock", "the network's network_status moves to UNDER_ASSESSMENT and current_assessment_year is set to cycle_year"]
  - method: POST
    path: "/network-assessments/{id}/decision"
    description: "Approve the assessment, unlocking site relocation and shutdown requests that cite it, or return it to the agency."
    roles: [EpaRegionalReviewer]
    code: 200
    input: [decision, "decision_note?"]
    output: NetworkAssessment
    side_effects: ["APPROVE moves status SUBMITTED -> APPROVED, stamping approved_at and approved_by_user_id", "RETURN moves status SUBMITTED -> DRAFT and increments return_count", "the network's network_status returns to ACTIVE under either decision"]
  - method: GET
    path: "/network-assessments/{id}"
    description: "Fetch one assessment with its recomputed adequacy scoring."
    roles: [NetworkAdmin, FieldTechnician, QaOfficer, ProgramManager, EpaRegionalReviewer]
    code: 200
    input: []
    output: NetworkAssessment
    side_effects: []

  # ---- Site change requests -----------------------------------------------
  - method: POST
    path: "/site-change-requests"
    description: "Request a seasonal suspension, a relocation or a permanent shutdown of an operating site, citing the assessment that justifies it. A relocation must nominate the replacement site; the other request types must not."
    roles: [ProgramManager]
    code: 201
    input: [site_id, request_type, justification, assessment_id, "replacement_site_id?"]
    output: SiteChangeRequest
    side_effects: ["SiteChangeRequest enters status DRAFT with revision_request_count 0"]
  - method: POST
    path: "/site-change-requests/{id}/submit"
    description: "Submit the network-change request for regional decision; the target site must still be operating."
    roles: [ProgramManager]
    code: 200
    input: ["submission_note?"]
    output: SiteChangeRequest
    side_effects: ["status moves DRAFT -> SUBMITTED"]
  - method: POST
    path: "/site-change-requests/{id}/decision"
    description: "Approve, deny or return the network-change request. Approval fires the five-hop network cascade over monitors, quarters, certification packages and the submission dimension."
    roles: [EpaRegionalReviewer]
    code: 200
    input: [decision, "decision_note?"]
    output: SiteChangeRequest
    side_effects: ["APPROVE moves status SUBMITTED -> APPROVED, stamping decided_by_user_id, decided_at and effective_at, then runs hop 1: the site moves to SUSPENDED for SEASONAL_SUSPENSION with suspended_at stamped, to SHUTDOWN for SHUTDOWN, or to RELOCATED for RELOCATION with the replacement site's replaces_site_id set to the target site", "hop 2 of a SHUTDOWN or RELOCATION approval decommissions every Monitor at the site from any non-terminal monitor_status; a SEASONAL_SUSPENSION instead moves every OPERATING monitor to OUT_OF_SERVICE with out_of_service_since stamped", "hop 3 of a SHUTDOWN or RELOCATION approval invalidates every DataBatch of those monitors whose validation_status IN {RAW, IN_VALIDATION, REOPENED} with batch_invalidation_reason MONITOR_DECOMMISSIONED", "hop 4 returns every CertificationPackage in status SUBMITTED that covers any of those quarters to DRAFT and increments its rejection_count", "hop 5 returns every DataBatch with submission_status == SUBMITTED that belongs to those returned packages to submission_status UNSUBMITTED", "DENY moves status SUBMITTED -> DENIED with no cascade; REQUEST_REVISION moves status SUBMITTED -> DRAFT and increments revision_request_count", "the network's site census counters and delinquent_monitor_count are recomputed"]
  - method: GET
    path: "/site-change-requests/{id}"
    description: "Fetch one network-change request."
    roles: [NetworkAdmin, FieldTechnician, QaOfficer, ProgramManager, EpaRegionalReviewer]
    code: 200
    input: []
    output: SiteChangeRequest
    side_effects: []
  - method: GET
    path: "/site-change-requests"
    description: "List network-change requests filtered by target site, replacement site, cited assessment, request class or approval state."
    roles: [NetworkAdmin, FieldTechnician, QaOfficer, ProgramManager, EpaRegionalReviewer]
    code: 200
    input: ["site_id?", "replacement_site_id?", "assessment_id?", "request_type?", "status?", "limit?", "offset?"]
    output: SiteChangeRequest[]
    side_effects: []

  # ---- Test-driving surface -----------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every deadline, interval and elapsed-day rule reads. The clock's startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [NetworkAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["the logical clock becomes to_iso8601 for every subsequent request", "qc_posture and qc_posture_in_service are recomputed on every Monitor on the next read, so a clock advance alone can move a monitor to QC_DUE or QC_DELINQUENT", "each network's delinquent_monitor_count is recomputed on the next read"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID is missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the authenticated role is not listed for the requested method and path"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, wrong type, enum value outside the declared set, numeric value outside the declared range, or pagination limit outside 1..100"
  - id: ERR_POLLUTANT_NOT_FOUND
    http: 404
    condition: "the pollutant id in the path or body does not exist"
  - id: ERR_REFERENCE_METHOD_NOT_FOUND
    http: 404
    condition: "the reference method id in the path or body does not exist"
  - id: ERR_NETWORK_NOT_FOUND
    http: 404
    condition: "the monitoring network id in the path or body does not exist"
  - id: ERR_SITE_NOT_FOUND
    http: 404
    condition: "a monitoring site id in the path or body - including replacement_site_id - does not exist"
  - id: ERR_MONITOR_NOT_FOUND
    http: 404
    condition: "the monitor id in the path or body does not exist"
  - id: ERR_DATA_BATCH_NOT_FOUND
    http: 404
    condition: "the data batch id in the path or body does not exist"
  - id: ERR_INVALIDATION_NOT_FOUND
    http: 404
    condition: "the data invalidation id in the path does not exist"
  - id: ERR_DEMONSTRATION_NOT_FOUND
    http: 404
    condition: "the exceptional event demonstration id in the path does not exist"
  - id: ERR_DESIGN_VALUE_NOT_FOUND
    http: 404
    condition: "the design value id in the path does not exist"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "the network assessment id in the path or body does not exist"
  - id: ERR_CHANGE_REQUEST_NOT_FOUND
    http: 404
    condition: "the site change request id in the path does not exist"
  - id: ERR_PACKAGE_NOT_FOUND
    http: 404
    condition: "the certification package id in the path does not exist"
  - id: ERR_STALE_BATCH_VERSION
    http: 412
    condition: "expected_data_batch_version does not equal the target DataBatch's current version"
  - id: ERR_STALE_SITE_VERSION
    http: 412
    condition: "expected_monitoring_site_version does not equal the referenced MonitoringSite's current version"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target row is not in a from-state declared for the requested transition, or a parent DataBatch is already INVALIDATED when a child write is attempted, or a demonstration submit carries no PROPOSED exclusion or clear_causal_relationship false, or a return-to-service is attempted while consecutive_qc_failure_count > 0 or the monitor's site is not OPERATING, or a monitor approval or commissioning is attempted while its MonitoringSite is in the wrong status"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "the target row is already in one of its state machine's terminal states"
  - id: ERR_BATCH_CERTIFIED
    http: 409
    condition: "a reopen was attempted on a DataBatch whose submission_status == CERTIFIED"
  - id: ERR_SITE_NOT_OPERATING
    http: 409
    condition: "a network-change request was submitted or approved for a site whose status is not OPERATING"
  - id: ERR_MEMBER_BATCH_NOT_VALIDATED
    http: 409
    condition: "certification was attempted while at least one in-scope quarter already in submission_status SUBMITTED has a validation_status other than VALIDATED - typically a quarter reopened after the package was submitted"
  - id: ERR_METHOD_NOT_DESIGNATED
    http: 422
    condition: "the governing reference method is WITHDRAWN, or its effective_from is after the logical clock, when a monitor approval, commissioning or batch validation is attempted"
  - id: ERR_PRIMARY_MONITOR_MISSING
    http: 422
    condition: "primary_monitor_selection finds no candidate monitor for the site and pollutant"
  - id: ERR_REPLACEMENT_SITE_REQUIRED
    http: 422
    condition: "replacement_site_id is absent on a RELOCATION request, or present on a SHUTDOWN or SEASONAL_SUSPENSION request"
  - id: ERR_ASSESSMENT_NOT_APPROVED
    http: 422
    condition: "the cited network assessment is not APPROVED, or belongs to a different network than the target site"
  - id: ERR_REPLACEMENT_SITE_NOT_ELIGIBLE
    http: 422
    condition: "the nominated replacement site is in a status other than SITING_APPROVED or OPERATING, or belongs to a different network"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID already performed the incompatible upstream step - invalidating hours of the quarter being validated, or validating a quarter inside the package being certified"
  - id: ERR_MONITOR_QC_DELINQUENT
    http: 422
    condition: "validation was attempted on a quarter whose monitor has qc_posture == QC_DELINQUENT"
  - id: ERR_SITING_CRITERIA_NOT_MET
    http: 422
    condition: "siting approval was attempted on a site with a non-empty siting_violation_codes list and no waiver_granted true"
  - id: ERR_DUPLICATE_SITE_CODE
    http: 409
    condition: "site_code already exists within the target network"
  - id: ERR_DUPLICATE_BATCH_PERIOD
    http: 409
    condition: "a DataBatch already exists for the (monitor_id, year, quarter) triple, or two items of a bulk-ingest request collide on it"
  - id: ERR_DUPLICATE_MONITOR_POC
    http: 409
    condition: "a live monitor already holds this parameter occurrence code for the site and pollutant"
  - id: ERR_INVALIDATION_RANGE_OUT_OF_BOUNDS
    http: 422
    condition: "the requested hour range is empty, negative, or extends beyond the quarter's scheduled_hour_count"
  - id: ERR_DESIGN_VALUE_FINALIZED
    http: 409
    condition: "a design value for the same site, pollutant, period and variant is already FINAL"
  - id: ERR_DESIGN_VALUE_INCOMPLETE
    http: 422
    condition: "finalization was attempted while complete_year_count is below the pollutant's design_value_years"
  - id: ERR_INVALIDATION_RANGE_OVERLAP
    http: 409
    condition: "the requested hour range intersects an applied invalidation on the same quarter; abutting ranges are accepted"
  - id: ERR_EXCLUSION_OVERLAPS_INVALIDATION
    http: 409
    condition: "the requested exclusion hour range intersects an applied invalidation on the same quarter"
  - id: ERR_EVENT_WINDOW_CONFLICT
    http: 409
    condition: "the claimed event window, expanded by the 24-hour buffer, intersects another live demonstration for the same site and event type"
  - id: ERR_EVENT_WINDOW_OUTSIDE_BATCH_PERIOD
    http: 422
    condition: "the exclusion hour range falls outside the demonstration's event window mapped onto the target quarter"
  - id: ERR_BATCH_PERIOD_NOT_ENDED
    http: 422
    condition: "data was reported for a quarter that has not yet ended on the logical clock"
  - id: ERR_CERTIFICATION_DEADLINE_PASSED
    http: 422
    condition: "certification was attempted at or after the package's certification_deadline"
  - id: ERR_PACKAGE_NOT_READY
    http: 422
    condition: "package submission was attempted while certification_ready is false - no member quarters, or at least one member quarter below the completeness threshold"
  - id: ERR_NO_ELIGIBLE_BATCHES
    http: 422
    condition: "a bulk validation matched no RAW quarter for the selector"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: NetworkAdmin
    description: "State air program configuration officer: maintains the pollutant catalogue, method designations, networks, sites and instrument inventory, and owns the logical clock used by every temporal rule."
    identity: opaque
    exclusive_operations:
      - "POST /pollutants"
      - "POST /reference-methods"
      - "POST /monitoring-networks"
      - "POST /monitoring-sites"
      - "POST /monitors"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every GET endpoint"
  - name: FieldTechnician
    description: "Field operations technician: commissions instruments, logs calibration, span, zero, precision and preventive-maintenance activity, and takes instruments out of and back into service."
    identity: opaque
    exclusive_operations:
      - "POST /monitors/{id}/commission"
      - "POST /monitors/{id}/service-status"
      - "POST /monitors/{id}/qc-events"
    shared_operations:
      - "every GET endpoint"
  - name: QaOfficer
    description: "Quality-assurance officer: ingests monitor-quarters, invalidates and restores hour ranges, and decides each quarter's validation outcome. Barred by segregation of duties from validating a quarter whose hours the same user invalidated."
    identity: opaque
    exclusive_operations:
      - "POST /data-batches"
      - "POST /data-batches/bulk-ingest"
      - "POST /data-batches/bulk-validate"
      - "POST /data-batches/{id}/begin-validation"
      - "POST /data-batches/{id}/invalidations"
      - "POST /data-invalidations/{id}/withdraw"
      - "POST /data-batches/{id}/validate"
      - "POST /data-batches/{id}/invalidate"
      - "POST /data-batches/{id}/reopen"
    shared_operations:
      - "every GET endpoint"
  - name: ProgramManager
    description: "Monitoring program manager: brings approved sites into operation, reinstates suspended sites, prepares exceptional-event demonstrations, computes design values, runs assessment cycles, raises network-change requests and certifies the annual data set. Barred by segregation of duties from certifying a package containing a quarter the same user validated."
    identity: opaque
    exclusive_operations:
      - "POST /monitoring-sites/{id}/commence-operations"
      - "POST /monitoring-sites/{id}/reinstate"
      - "POST /exceptional-event-demonstrations"
      - "POST /exceptional-event-demonstrations/{id}/exclusions"
      - "POST /exceptional-event-demonstrations/{id}/submit"
      - "POST /design-values"
      - "POST /certification-packages"
      - "POST /certification-packages/{id}/submit"
      - "POST /certification-packages/{id}/certify"
      - "POST /network-assessments"
      - "POST /network-assessments/{id}/submit"
      - "POST /site-change-requests"
      - "POST /site-change-requests/{id}/submit"
    shared_operations:
      - "every GET endpoint"
  - name: EpaRegionalReviewer
    description: "Federal regional reviewer: holds every approval gate the state cannot self-grant - method designation changes, site siting approval, instrument approval, exceptional-event concurrence, design-value finalization, certification rejection, assessment approval and network-change decisions."
    identity: opaque
    exclusive_operations:
      - "POST /reference-methods/{id}/designation"
      - "POST /monitoring-sites/{id}/siting-approval"
      - "POST /monitors/{id}/approve"
      - "POST /exceptional-event-demonstrations/{id}/request-info"
      - "POST /exceptional-event-demonstrations/{id}/determination"
      - "POST /design-values/{id}/finalize"
      - "POST /certification-packages/{id}/reject"
      - "POST /network-assessments/{id}/decision"
      - "POST /site-change-requests/{id}/decision"
    shared_operations:
      - "every GET endpoint"
