# =============================================================================
# PRD Benchmark Seed Tables — Loan Servicing Escrow Analysis
# =============================================================================

scenario: |
  Loan Servicing Escrow Analysis (mortgage servicer escrow department): escrow account setup & initial cushion calculation, tax/insurance disbursement scheduling & payee verification, annual analysis & shortage/surplus determination, payment change notice & timing, escrow advance on shortfall & recovery, insurance lapse detection & force-placement, tax delinquency monitoring, RESPA compliance & error resolution

domain_name: loan-servicing-escrow-analysis
api_prefix: /servicing

# Step 0: Complexity Profile
complexity_profile:
  primary_archetype: Ledger reconciliation        # escrow ledger vs forward-looking projection
  secondary_archetype: Compliance / audit          # RESPA Reg X error-resolution & notice windows
  complexity_layers:
    - dual_variant_calculation      # PROSPECTIVE vs LEDGER_ACTUAL analysis; SIMPLE vs COMPOUND penalty; ACT/365 vs 30/360 refund
    - cascading_side_effects        # error correction -> ledger -> balance -> analysis reopen -> notice void
    - scheduled / deferred actions  # logical clock sweep drives lapse/delinquency/expiry transitions
    - optimistic_concurrency        # OCC on EscrowAccount.version (analysis supersede) and Disbursement.version (PATCH)
  entity_topology: flat                          # peer entities with FK references; no URL nesting of aggregates
  state_machine_shape: parallel                  # EscrowAccount account_status x hold_status evolve independently; other machines cyclic/branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties              # payee creator != verifier; disbursement scheduler != releaser; case investigator != resolver
  consistency_model: immediate                   # all mutations + cascades visible in same request

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Loan
    parent: null
    common_fields: true
    fields:
      - { name: loan_number, type: string, source: input, description: "Servicer-assigned loan number; unique across all loans" }
      - { name: borrower_name, type: string, source: input, description: "Primary borrower legal name" }
      - { name: principal_balance_cents, type: integer, source: input, description: "Current unpaid principal balance in cents" }
      - { name: monthly_pi_cents, type: integer, source: input, description: "Monthly principal+interest payment in cents (excludes escrow)" }
      - { name: escrow_required, type: boolean, source: input, default: true, description: "Whether the loan carries an escrow account" }
      - { name: closing_date, type: string, source: input, description: "Loan closing date, ISO YYYY-MM-DD" }
      - { name: status, type: enum, source: system, description: "ONBOARDING | ACTIVE | PAID_OFF | TRANSFERRED_OUT" }

  - name: EscrowAccount
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; exactly one escrow account per loan" }
      - { name: account_status, type: enum, source: system, description: "SETUP | ACTIVE | SUSPENDED | CLOSED (dimension 1 of parallel state)" }
      - { name: hold_status, type: enum, source: system, description: "NONE | COMPLIANCE_HOLD (dimension 2; gates disbursement release and analysis compute/finalize independently of account_status)" }
      - { name: balance_cents, type: integer, source: computed, description: "Current escrow balance; ALWAYS equals sum of amount_cents over all EscrowLedgerEntry rows for this account (ledger conservation invariant)" }
      - { name: target_cushion_cents, type: integer, source: computed, description: "RESPA cushion cap = round_half_up(sum of expected_annual_amount_cents over ACTIVE EscrowLineItem rows / 6); recomputed on every line-item write" }
      - { name: monthly_escrow_cents, type: integer, source: computed, description: "Current required monthly escrow portion; set at account activation, replaced when a PaymentChangeNotice is APPLIED" }
      - { name: next_analysis_due_date, type: string, source: computed, description: "closing_date + 12 months at activation; +12 months on each analysis finalize" }
      - { name: last_analysis_year, type: integer, source: system, default: null, description: "analysis_year of the most recent EFFECTIVE cycle; null before first finalize" }

  - name: EscrowLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: escrow_account_id, type: string, source: system, description: "FK -> EscrowAccount.id" }
      - { name: entry_type, type: enum, source: system, description: "DEPOSIT | DISBURSEMENT | DISBURSEMENT_RETURN | ADVANCE_ISSUED | ADVANCE_RECOVERY | SURPLUS_REFUND | FORCE_PLACEMENT_CHARGE | FORCE_PLACEMENT_REFUND | ERROR_CORRECTION" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount; credits positive, debits negative" }
      - { name: effective_date, type: string, source: input, description: "ISO date the entry is effective; drives chronological replay" }
      - { name: running_balance_cents, type: integer, source: computed, description: "Balance after this entry under replay ordered by effective_date ASC, tie-break created_at ASC" }
      - { name: source_entity_type, type: string, source: system, description: "Entity type that caused the entry (Deposit, Disbursement, EscrowAdvance, EscrowAnalysisCycle, InsurancePolicy, ErrorResolutionCase)" }
      - { name: source_entity_id, type: string, source: system, description: "Id of the causing entity" }
      - { name: note, type: string, source: system, default: "", description: "Free-text annotation" }

  - name: EscrowLineItem
    parent: null
    common_fields: true
    fields:
      - { name: escrow_account_id, type: string, source: system, description: "FK -> EscrowAccount.id" }
      - { name: payee_id, type: string, source: input, description: "FK -> Payee.id; payee must be VERIFIED at creation" }
      - { name: expense_type, type: enum, source: input, description: "PROPERTY_TAX | HAZARD_INSURANCE | FLOOD_INSURANCE | PMI; at most one ACTIVE line item per expense_type per account" }
      - { name: expected_annual_amount_cents, type: integer, source: input, description: "Projected annual disbursement for this item" }
      - { name: installments_per_year, type: integer, source: input, description: "1, 2, 4, or 12; installment amount = round_half_up(expected_annual_amount_cents / installments_per_year)" }
      - { name: first_due_date, type: string, source: input, description: "ISO date of first projected installment; subsequent installments step by 12/installments_per_year months" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REMOVED" }

  - name: Payee
    parent: null
    common_fields: true
    fields:
      - { name: payee_type, type: enum, source: input, description: "TAX_AUTHORITY | INSURANCE_CARRIER | PMI_PROVIDER" }
      - { name: legal_name, type: string, source: input, description: "Payee legal name" }
      - { name: remit_to_address, type: string, source: input, description: "Remittance address" }
      - { name: ach_routing_mask, type: string, source: input, description: "Masked routing identifier" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the DisbursementProcessor who created the payee (SoD anchor)" }
      - { name: verification_status, type: enum, source: system, description: "PENDING_VERIFICATION | VERIFIED | REJECTED | SUSPENDED | EXPIRED" }
      - { name: verified_by_user_id, type: string, source: system, default: null, description: "X-User-ID of verifying PayeeVerifier; must differ from created_by_user_id" }
      - { name: verified_at, type: datetime, source: system, default: null, description: "Timestamp of last successful verification" }
      - { name: verification_expires_at, type: string, source: computed, default: null, description: "Date of verified_at + 365 days; sweep flips VERIFIED -> EXPIRED when current date is strictly after this" }

  - name: Disbursement
    parent: null
    common_fields: true
    fields:
      - { name: escrow_account_id, type: string, source: system, description: "FK -> EscrowAccount.id" }
      - { name: line_item_id, type: string, source: input, description: "FK -> EscrowLineItem.id; must be ACTIVE and belong to the same account" }
      - { name: payee_id, type: string, source: input, description: "FK -> Payee.id; must be VERIFIED at creation and at release" }
      - { name: amount_cents, type: integer, source: input, description: "Amount to disburse; must be > 0" }
      - { name: due_date, type: string, source: input, description: "ISO date the obligation is due (tax bill / premium due date)" }
      - { name: scheduled_release_date, type: string, source: input, description: "ISO date; release before this date is rejected with ERR_RELEASE_TOO_EARLY" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | BLOCKED | RELEASED | CLEARED | RETURNED | CANCELLED" }
      - { name: scheduled_by_user_id, type: string, source: system, description: "X-User-ID of creating DisbursementProcessor (SoD anchor)" }
      - { name: released_by_user_id, type: string, source: system, default: null, description: "X-User-ID of releasing processor; must differ from scheduled_by_user_id" }
      - { name: released_at, type: datetime, source: system, default: null, description: "Release timestamp" }
      - { name: cleared_at, type: datetime, source: system, default: null, description: "Cleared timestamp" }
      - { name: returned_at, type: datetime, source: system, default: null, description: "Returned timestamp" }
      - { name: late_release, type: boolean, source: computed, default: false, description: "true when release date is strictly after due_date" }
      - { name: ledger_entry_id, type: string, source: system, default: null, description: "Id of the DISBURSEMENT ledger entry posted at release" }

  - name: InsurancePolicy
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id" }
      - { name: policy_type, type: enum, source: input, description: "HAZARD | FLOOD" }
      - { name: carrier_name, type: string, source: input, description: "Insurance carrier name" }
      - { name: policy_number, type: string, source: input, description: "Policy number" }
      - { name: coverage_start_date, type: string, source: input, description: "ISO coverage start; half-open interval [start, end)" }
      - { name: coverage_end_date, type: string, source: input, description: "ISO coverage end (exclusive); must be after coverage_start_date" }
      - { name: annual_premium_cents, type: integer, source: input, description: "Borrower-policy annual premium" }
      - { name: status, type: enum, source: system, description: "ACTIVE | LAPSED | NOTICE_1_SENT | NOTICE_2_SENT | FORCE_PLACED | REFUNDED | CANCELLED | EXPIRED_CLOSED" }
      - { name: notice_1_sent_at, type: datetime, source: system, default: null, description: "Timestamp of first force-placement notice" }
      - { name: notice_2_sent_at, type: datetime, source: system, default: null, description: "Timestamp of reminder notice" }
      - { name: force_placed_at, type: datetime, source: system, default: null, description: "Timestamp force-placement premium was charged" }
      - { name: fp_premium_cents, type: integer, source: system, default: null, description: "Force-placement premium charged to escrow" }
      - { name: fp_coverage_end, type: string, source: system, default: null, description: "Force-placement coverage end = force_placed date + 365 days" }
      - { name: day_count_convention, type: enum, source: input, default: "ACT_365", description: "ACT_365 | CONTRACT_30_360; fixed at charge-force-placement, drives refund proration" }
      - { name: fp_refund_cents, type: integer, source: system, default: null, description: "Prorated force-placement refund" }
      - { name: refund_processed_at, type: datetime, source: system, default: null, description: "Refund timestamp" }
      - { name: refund_timeliness, type: enum, source: computed, default: null, description: "ON_TIME when refund date <= evidence date + 15 days, else LATE; null until refunded" }

  - name: TaxMonitoringRecord
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id" }
      - { name: parcel_number, type: string, source: input, description: "Assessor parcel number" }
      - { name: tax_year, type: integer, source: input, description: "Tax year" }
      - { name: installment_sequence, type: integer, source: input, description: "Installment number within the tax year; (parcel_number, tax_year, installment_sequence) unique among non-terminal records" }
      - { name: amount_due_cents, type: integer, source: input, description: "Installment amount due" }
      - { name: due_date, type: string, source: input, description: "ISO due date" }
      - { name: grace_period_days, type: integer, source: input, default: 0, description: "Days after due_date before delinquency" }
      - { name: monthly_penalty_rate_bps, type: integer, source: input, description: "Penalty rate in basis points per month (e.g., 150 = 1.5%)" }
      - { name: penalty_method, type: enum, source: input, description: "SIMPLE | COMPOUND; selects the penalty accrual variant" }
      - { name: status, type: enum, source: system, description: "MONITORING | DUE_SOON | DELINQUENT | PENALTY_ACCRUING | REDEMPTION_RISK | PAID_CURRENT | PAID_DELINQUENT" }
      - { name: delinquent_since, type: string, source: system, default: null, description: "Date record went delinquent = due_date + grace_period_days + 1 day" }
      - { name: accrued_penalty_cents, type: integer, source: computed, default: 0, description: "Penalty accrued per penalty_method; recomputed by sweep, frozen at mark-paid" }
      - { name: paid_via_disbursement_id, type: string, source: system, default: null, description: "FK -> Disbursement.id; set by mark-paid" }

  - name: EscrowAnalysisCycle
    parent: null
    common_fields: true
    fields:
      - { name: escrow_account_id, type: string, source: system, description: "FK -> EscrowAccount.id" }
      - { name: analysis_year, type: integer, source: input, description: "Servicing year label" }
      - { name: projection_start_date, type: string, source: input, description: "First day of the 12-month projection window; must be day 1 of a month" }
      - { name: method, type: enum, source: input, description: "PROSPECTIVE | LEDGER_ACTUAL; selects the start-balance variant" }
      - { name: status, type: enum, source: system, description: "DRAFT | COMPUTED | STATEMENT_ISSUED | EFFECTIVE | REOPENED | SUPERSEDED | VOIDED" }
      - { name: window_end_date, type: string, source: computed, description: "projection_start_date + 364 days (closed interval, both ends inclusive)" }
      - { name: computed_at, type: datetime, source: system, default: null, description: "Timestamp of last compute" }
      - { name: statement_issued_at, type: datetime, source: system, default: null, description: "Timestamp of issue-statement" }
      - { name: statement_due_date, type: string, source: computed, default: null, description: "Date of computed_at + 30 calendar days" }
      - { name: statement_timeliness, type: enum, source: computed, default: null, description: "ON_TIME when statement issue date <= statement_due_date else LATE" }
      - { name: start_balance_cents, type: integer, source: computed, default: null, description: "Projection opening balance per method variant" }
      - { name: projected_annual_disbursements_cents, type: integer, source: computed, default: null, description: "Sum of installment amounts falling inside the window over ACTIVE line items" }
      - { name: cushion_target_cents, type: integer, source: computed, default: null, description: "round_half_up(projected_annual_disbursements_cents / 6)" }
      - { name: lowest_projected_balance_cents, type: integer, source: computed, default: null, description: "Minimum running balance across the 12 projected month-ends, using the account's CURRENT monthly_escrow_cents for all 12 months" }
      - { name: shortage_cents, type: integer, source: computed, default: 0, description: "cushion_target_cents - max(lowest_projected_balance_cents, 0) when lowest < cushion_target else 0" }
      - { name: deficiency_cents, type: integer, source: computed, default: 0, description: "max(0, -lowest_projected_balance_cents)" }
      - { name: surplus_cents, type: integer, source: computed, default: 0, description: "max(0, start_balance_cents - cushion_target_cents)" }
      - { name: base_monthly_escrow_cents, type: integer, source: computed, default: null, description: "Sum over ACTIVE line items of round_half_up(expected_annual_amount_cents / 12); per-line rounding THEN sum (pinned order)" }
      - { name: spread_monthly_cents, type: integer, source: computed, default: 0, description: "floor((shortage_cents + deficiency_cents) / 12)" }
      - { name: spread_first_month_cents, type: integer, source: computed, default: 0, description: "(shortage_cents + deficiency_cents) - 11 * spread_monthly_cents; remainder loaded on the FIRST month" }
      - { name: new_monthly_escrow_cents, type: integer, source: computed, default: null, description: "base_monthly_escrow_cents + spread_monthly_cents (assumes SPREAD_12; LUMP_SUM uses base only)" }

  - name: PaymentChangeNotice
    parent: null
    common_fields: true
    fields:
      - { name: analysis_id, type: string, source: system, description: "FK -> EscrowAnalysisCycle.id" }
      - { name: notice_type, type: enum, source: system, description: "PAYMENT_CHANGE when shortage+deficiency = 0 and no surplus; SHORTAGE when shortage > 0; DEFICIENCY when deficiency > 0; SURPLUS when surplus > 0 and shortage+deficiency = 0" }
      - { name: old_monthly_escrow_cents, type: integer, source: system, description: "Account monthly_escrow_cents at finalize time" }
      - { name: new_monthly_escrow_cents, type: integer, source: system, description: "base + spread at creation; recomputed at acknowledge to base only when shortage_option = LUMP_SUM" }
      - { name: shortage_option, type: enum, source: input, default: null, description: "LUMP_SUM | SPREAD_12; required at acknowledge when shortage+deficiency > 0, forbidden otherwise" }
      - { name: effective_date, type: string, source: system, description: "First day of the second month after the finalize month (finalize 2026-09 -> 2026-11-01)" }
      - { name: send_by_date, type: string, source: computed, description: "effective_date - 30 days" }
      - { name: sent_at, type: datetime, source: system, default: null, description: "Timestamp notice was sent" }
      - { name: timeliness, type: enum, source: computed, default: null, description: "ON_TIME when sent date <= send_by_date else LATE; null until sent" }
      - { name: status, type: enum, source: system, description: "DRAFT | SENT | ACKNOWLEDGED | APPLIED | VOIDED" }

  - name: EscrowAdvance
    parent: null
    common_fields: true
    fields:
      - { name: escrow_account_id, type: string, source: system, description: "FK -> EscrowAccount.id" }
      - { name: disbursement_id, type: string, source: system, default: null, description: "FK -> Disbursement.id; set when reason = DISBURSEMENT_SHORTFALL, else null" }
      - { name: reason, type: enum, source: system, description: "DISBURSEMENT_SHORTFALL | FORCE_PLACEMENT_PREMIUM | MANUAL_CORRECTION" }
      - { name: amount_cents, type: integer, source: system, description: "Total advanced (system-computed for auto advances; input for manual)" }
      - { name: recovered_cents, type: integer, source: computed, default: 0, description: "Cumulative recovered amount" }
      - { name: written_off_cents, type: integer, source: system, default: 0, description: "Amount written off" }
      - { name: outstanding_cents, type: integer, source: computed, description: "amount_cents - recovered_cents - written_off_cents (advance decomposition invariant)" }
      - { name: status, type: enum, source: system, description: "OUTSTANDING | RECOVERING | RECOVERED | WRITTEN_OFF" }

  - name: ErrorResolutionCase
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id" }
      - { name: error_type, type: enum, source: input, description: "DISBURSEMENT_FAILURE | DISBURSEMENT_AMOUNT_ERROR | UNTIMELY_DISBURSEMENT | FORCE_PLACEMENT_ERROR | ANALYSIS_ERROR | PAYMENT_APPLICATION_ERROR | OTHER_COVERED" }
      - { name: description, type: string, source: input, description: "Borrower's description of the asserted error" }
      - { name: asserted_amount_cents, type: integer, source: input, default: null, description: "Optional amount the borrower asserts is wrong" }
      - { name: status, type: enum, source: system, description: "RECEIVED | ACKNOWLEDGED | INVESTIGATING | EXTENDED | RESOLVED_CORRECTED | RESOLVED_NO_ERROR | DISMISSED_NOT_COVERED" }
      - { name: received_at, type: datetime, source: system, description: "Timestamp the notice of error was received" }
      - { name: acknowledged_at, type: datetime, source: system, default: null, description: "Timestamp of acknowledgment" }
      - { name: ack_deadline, type: string, source: computed, description: "received date + 5 business days (Mon-Fri, excluding FEDERAL_HOLIDAYS)" }
      - { name: ack_timeliness, type: enum, source: computed, default: null, description: "ON_TIME when ack date <= ack_deadline else LATE" }
      - { name: assigned_to_user_id, type: string, source: input, default: null, description: "Staff user id assigned to investigate (SoD: resolver must differ)" }
      - { name: resolution_deadline, type: string, source: computed, description: "received date + 30 business days; + 45 business days when EXTENDED" }
      - { name: resolved_at, type: datetime, source: system, default: null, description: "Resolution timestamp" }
      - { name: resolution_timeliness, type: enum, source: computed, default: null, description: "ON_TIME when resolved date <= resolution_deadline else LATE" }
      - { name: resolved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of resolving ComplianceOfficer" }
      - { name: outcome, type: enum, source: input, default: null, description: "CORRECTED | NO_ERROR | DISMISSED (set at resolve/dismiss)" }
      - { name: correction_amount_cents, type: integer, source: input, default: null, description: "Required > 0 when outcome = CORRECTED; posted as ERROR_CORRECTION credit" }
      - { name: resolution_note, type: string, source: input, default: "", description: "Written explanation" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Loan
    initial_state: ONBOARDING
    terminal_states: [PAID_OFF, TRANSFERRED_OUT]
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /servicing/loans/{id}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "If escrow_required = true, an EscrowAccount with loan_id = this loan and account_status = ACTIVE must exist (else ERR_ESCROW_NOT_ACTIVE)"
        side_effects:
          - "increments Loan.version by 1"
      - from: ACTIVE
        to: PAID_OFF
        trigger: "POST /servicing/loans/{id}/payoff"
        actor: ComplianceOfficer
        preconditions:
          - "No EscrowAdvance on the loan's escrow account in status OUTSTANDING or RECOVERING (else ERR_ADVANCE_OUTSTANDING)"
        side_effects:
          - "EscrowAccount for this loan transitions to CLOSED (from ACTIVE or SUSPENDED)"
          - "If escrow balance_cents > 0: post SURPLUS_REFUND ledger entry of -balance_cents, balance becomes 0"
          - "All Disbursement rows of the account in SCHEDULED or BLOCKED transition to CANCELLED"
          - "increments Loan.version by 1"
      - from: ACTIVE
        to: TRANSFERRED_OUT
        trigger: "POST /servicing/loans/{id}/transfer-out"
        actor: ComplianceOfficer
        preconditions:
          - "No ErrorResolutionCase with loan_id = this loan in status RECEIVED, ACKNOWLEDGED, INVESTIGATING, or EXTENDED (else ERR_UNRESOLVED_ERROR_CASE)"
        side_effects:
          - "EscrowAccount for this loan transitions to CLOSED; if balance_cents > 0 post SURPLUS_REFUND entry of -balance_cents"
          - "All Disbursement rows of the account in SCHEDULED or BLOCKED transition to CANCELLED"
          - "increments Loan.version by 1"

  - entity: EscrowAccount
    initial_state: SETUP
    terminal_states: [CLOSED]
    note: "PARALLEL DIMENSION 1 (account_status). Dimension 2 (hold_status) below evolves independently; both are stored on the same row and a write to either increments version."
    transitions:
      - from: SETUP
        to: ACTIVE
        trigger: "POST /servicing/escrow-accounts/{id}/activate"
        actor: EscrowAnalyst
        preconditions:
          - "At least one EscrowLineItem with escrow_account_id = this account and status = ACTIVE exists (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "monthly_escrow_cents = base_monthly sum (per-line round_half_up(annual/12) then sum)"
          - "target_cushion_cents recomputed"
          - "next_analysis_due_date = loan.closing_date + 12 months"
          - "increments EscrowAccount.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /servicing/escrow-accounts/{id}/suspend"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["increments EscrowAccount.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /servicing/escrow-accounts/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["increments EscrowAccount.version by 1"]
      - from: ACTIVE
        to: CLOSED
        trigger: "cascade from POST /servicing/loans/{id}/payoff or transfer-out"
        actor: system
        preconditions: []
        side_effects:
          - "SURPLUS_REFUND entry posted when balance_cents > 0 (see Loan transitions)"
          - "increments EscrowAccount.version by 1"
      - from: SUSPENDED
        to: CLOSED
        trigger: "cascade from POST /servicing/loans/{id}/payoff or transfer-out"
        actor: system
        preconditions: []
        side_effects: ["increments EscrowAccount.version by 1"]

  - entity: EscrowAccount.hold_status
    initial_state: NONE
    terminal_states: []
    note: "PARALLEL DIMENSION 2 (hold_status). COMPLIANCE_HOLD blocks disbursement release (ERR_ACCOUNT_ON_HOLD) and analysis compute/finalize (ERR_ACCOUNT_ON_HOLD) but never deposits, line-item maintenance, or account_status moves."
    transitions:
      - from: NONE
        to: COMPLIANCE_HOLD
        trigger: "POST /servicing/escrow-accounts/{id}/hold"
        actor: ComplianceOfficer
        preconditions:
          - "account_status != CLOSED (else ERR_ALREADY_TERMINAL)"
        side_effects: ["increments EscrowAccount.version by 1"]
      - from: COMPLIANCE_HOLD
        to: NONE
        trigger: "POST /servicing/escrow-accounts/{id}/release-hold"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["increments EscrowAccount.version by 1"]

  - entity: Payee
    initial_state: PENDING_VERIFICATION
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /servicing/payees/{id}/verify"
        actor: PayeeVerifier
        preconditions:
          - "X-User-ID != created_by_user_id (else ERR_SOD_VIOLATION)"
        side_effects:
          - "verified_by_user_id = X-User-ID; verified_at = now; verification_expires_at = date(now) + 365 days"
          - "increments Payee.version by 1"
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /servicing/payees/{id}/reject"
        actor: PayeeVerifier
        preconditions: []
        side_effects: ["increments Payee.version by 1"]
      - from: VERIFIED
        to: SUSPENDED
        trigger: "POST /servicing/payees/{id}/suspend"
        actor: "PayeeVerifier | ComplianceOfficer"
        preconditions: []
        side_effects:
          - "Every Disbursement with payee_id = this payee in status SCHEDULED transitions to BLOCKED (conditional cascade)"
          - "increments Payee.version by 1"
      - from: VERIFIED
        to: EXPIRED
        trigger: "system sweep (POST /_clock/set_current_utc) when current date is strictly after verification_expires_at"
        actor: system
        preconditions: []
        side_effects:
          - "Every Disbursement with payee_id = this payee in status SCHEDULED transitions to BLOCKED (conditional cascade)"
          - "increments Payee.version by 1"
      - from: EXPIRED
        to: VERIFIED
        trigger: "POST /servicing/payees/{id}/verify (re-verification)"
        actor: PayeeVerifier
        preconditions:
          - "X-User-ID != created_by_user_id (else ERR_SOD_VIOLATION)"
        side_effects:
          - "verified_at and verification_expires_at refreshed"
          - "Every Disbursement with payee_id = this payee in status BLOCKED returns to SCHEDULED"
          - "increments Payee.version by 1"
      - from: SUSPENDED
        to: VERIFIED
        trigger: "POST /servicing/payees/{id}/verify (re-verification)"
        actor: PayeeVerifier
        preconditions:
          - "X-User-ID != created_by_user_id (else ERR_SOD_VIOLATION)"
        side_effects:
          - "verified_at and verification_expires_at refreshed"
          - "Every Disbursement with payee_id = this payee in status BLOCKED returns to SCHEDULED"
          - "increments Payee.version by 1"

  - entity: Disbursement
    initial_state: SCHEDULED
    terminal_states: [CLEARED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /servicing/disbursements/{id}/release"
        actor: DisbursementProcessor
        preconditions:
          - "X-User-ID != scheduled_by_user_id (else ERR_SOD_VIOLATION)"
          - "EscrowAccount.hold_status = NONE (else ERR_ACCOUNT_ON_HOLD)"
          - "EscrowAccount.account_status = ACTIVE (else ERR_INVALID_STATE_TRANSITION)"
          - "Loan of the account has status = ACTIVE (else ERR_LOAN_NOT_ACTIVE)"
          - "current date >= scheduled_release_date (else ERR_RELEASE_TOO_EARLY)"
          - "If funds insufficient and resulting advance would push total outstanding advances over ADVANCE_CAP_CENTS: ERR_ADVANCE_CAP_EXCEEDED"
        side_effects:
          - "Post DISBURSEMENT ledger entry of -amount_cents effective today; late_release = (today > due_date)"
          - "Recompute EscrowAccount.balance_cents (chronological replay)"
          - "If balance would be negative: system creates EscrowAdvance (reason DISBURSEMENT_SHORTFALL, disbursement_id = this, amount_cents = amount_cents - max(pre-release balance_cents, 0)) and posts ADVANCE_ISSUED entry of +advance amount, so the post-release balance never drops below 0"
          - "released_by_user_id = X-User-ID; released_at = now; ledger_entry_id set"
          - "increments Disbursement.version by 1 and EscrowAccount.version by 1"
      - from: RELEASED
        to: CLEARED
        trigger: "POST /servicing/disbursements/{id}/mark-cleared"
        actor: DisbursementProcessor
        preconditions: []
        side_effects: ["cleared_at = now", "increments Disbursement.version by 1"]
      - from: RELEASED
        to: RETURNED
        trigger: "POST /servicing/disbursements/{id}/mark-returned"
        actor: DisbursementProcessor
        preconditions: []
        side_effects:
          - "Post DISBURSEMENT_RETURN ledger entry of +amount_cents effective today (compensating action; ledger conservation invariant restored)"
          - "If an EscrowAdvance with disbursement_id = this exists and is OUTSTANDING or RECOVERING: reduce its outstanding_cents by min(advance outstanding, amount_cents) and post ADVANCE_RECOVERY entry of that reduction; advance moves to RECOVERED when outstanding_cents reaches 0"
          - "Recompute EscrowAccount.balance_cents"
          - "returned_at = now; increments Disbursement.version by 1 and EscrowAccount.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /servicing/disbursements/{id}/cancel"
        actor: DisbursementProcessor
        preconditions: []
        side_effects: ["increments Disbursement.version by 1"]
      - from: BLOCKED
        to: CANCELLED
        trigger: "POST /servicing/disbursements/{id}/cancel"
        actor: DisbursementProcessor
        preconditions: []
        side_effects: ["increments Disbursement.version by 1"]
      - from: SCHEDULED
        to: BLOCKED
        trigger: "system cascade: the disbursement's payee is SUSPENDED or EXPIRED"
        actor: system
        preconditions: []
        side_effects: ["increments Disbursement.version by 1"]
      - from: BLOCKED
        to: SCHEDULED
        trigger: "system cascade: the disbursement's payee returns to VERIFIED"
        actor: system
        preconditions: []
        side_effects: ["increments Disbursement.version by 1"]

  - entity: InsurancePolicy
    initial_state: ACTIVE
    terminal_states: [REFUNDED, CANCELLED, EXPIRED_CLOSED]
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "system sweep when coverage_end_date < current date AND no other ACTIVE policy of the same policy_type on the same loan covers the current date; OR POST /servicing/insurance-policies/{id}/report-lapse (mid-term carrier cancellation)"
        actor: "system | InsuranceSpecialist"
        preconditions: []
        side_effects: ["increments InsurancePolicy.version by 1"]
      - from: ACTIVE
        to: EXPIRED_CLOSED
        trigger: "system sweep when coverage_end_date < current date AND another ACTIVE policy of the same policy_type on the same loan covers the current date"
        actor: system
        preconditions: []
        side_effects: ["increments InsurancePolicy.version by 1"]
      - from: LAPSED
        to: NOTICE_1_SENT
        trigger: "POST /servicing/insurance-policies/{id}/send-first-notice"
        actor: InsuranceSpecialist
        preconditions: []
        side_effects: ["notice_1_sent_at = now", "increments InsurancePolicy.version by 1"]
      - from: NOTICE_1_SENT
        to: NOTICE_2_SENT
        trigger: "POST /servicing/insurance-policies/{id}/send-reminder-notice"
        actor: InsuranceSpecialist
        preconditions:
          - "current date >= date(notice_1_sent_at) + 30 days (else ERR_REMINDER_TOO_EARLY)"
        side_effects: ["notice_2_sent_at = now", "increments InsurancePolicy.version by 1"]
      - from: NOTICE_2_SENT
        to: FORCE_PLACED
        trigger: "POST /servicing/insurance-policies/{id}/charge-force-placement"
        actor: InsuranceSpecialist
        preconditions:
          - "current date >= date(notice_1_sent_at) + 45 days AND current date >= date(notice_2_sent_at) + 15 days (else ERR_NOTICE_WINDOW_NOT_MET)"
          - "No other ACTIVE policy of the same policy_type on the same loan (else ERR_ACTIVE_COVERAGE_EXISTS)"
          - "If premium exceeds available balance and the resulting advance would push total outstanding advances over ADVANCE_CAP_CENTS: ERR_ADVANCE_CAP_EXCEEDED"
        side_effects:
          - "Post FORCE_PLACEMENT_CHARGE ledger entry of -fp_premium_cents effective today"
          - "If balance insufficient: create EscrowAdvance (reason FORCE_PLACEMENT_PREMIUM) and post ADVANCE_ISSUED entry of +shortfall; post-charge balance never below 0"
          - "force_placed_at = now; fp_coverage_end = date(now) + 365 days"
          - "increments InsurancePolicy.version by 1 and EscrowAccount.version by 1"
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /servicing/insurance-policies/{id}/reinstate (borrower evidence accepted)"
        actor: "InsuranceSpecialist | Borrower"
        preconditions:
          - "new_coverage_end_date > current date (else ERR_INVALID_REQUEST)"
          - "No half-open overlap with another ACTIVE policy of same policy_type on the loan (else ERR_COVERAGE_OVERLAP)"
        side_effects:
          - "coverage dates and annual_premium_cents replaced; notice_1_sent_at/notice_2_sent_at reset to null"
          - "increments InsurancePolicy.version by 1"
      - from: NOTICE_1_SENT
        to: ACTIVE
        trigger: "POST /servicing/insurance-policies/{id}/reinstate"
        actor: "InsuranceSpecialist | Borrower"
        preconditions:
          - "new_coverage_end_date > current date"
          - "No half-open overlap with another ACTIVE policy of same policy_type on the loan (else ERR_COVERAGE_OVERLAP)"
        side_effects: ["notice timestamps reset to null", "increments InsurancePolicy.version by 1"]
      - from: NOTICE_2_SENT
        to: ACTIVE
        trigger: "POST /servicing/insurance-policies/{id}/reinstate"
        actor: "InsuranceSpecialist | Borrower"
        preconditions:
          - "new_coverage_end_date > current date"
          - "No half-open overlap with another ACTIVE policy of same policy_type on the loan (else ERR_COVERAGE_OVERLAP)"
        side_effects: ["notice timestamps reset to null", "increments InsurancePolicy.version by 1"]
      - from: FORCE_PLACED
        to: REFUNDED
        trigger: "POST /servicing/insurance-policies/{id}/refund-force-placement"
        actor: InsuranceSpecialist
        preconditions:
          - "Evidence policy exists: another ACTIVE policy of the same policy_type on the same loan whose [coverage_start_date, coverage_end_date) contains the current date (selector: earliest coverage_start_date, tie-break created_at ASC)"
        side_effects:
          - "fp_refund_cents computed by force_placement_refund_proration using day_count_convention; refund_timeliness = ON_TIME when refund date <= evidence policy created date + 15 days else LATE"
          - "Post FORCE_PLACEMENT_REFUND ledger entry of +fp_refund_cents effective today"
          - "Apply refund to outstanding advances first (FIFO by EscrowAdvance.created_at ASC) via ADVANCE_RECOVERY entries, remainder stays in balance"
          - "refund_processed_at = now; increments InsurancePolicy.version by 1 and EscrowAccount.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /servicing/insurance-policies/{id}/cancel"
        actor: InsuranceSpecialist
        preconditions: []
        side_effects: ["increments InsurancePolicy.version by 1"]
      - from: LAPSED
        to: CANCELLED
        trigger: "POST /servicing/insurance-policies/{id}/cancel"
        actor: InsuranceSpecialist
        preconditions: []
        side_effects: ["increments InsurancePolicy.version by 1"]

  - entity: TaxMonitoringRecord
    initial_state: MONITORING
    terminal_states: [PAID_CURRENT, PAID_DELINQUENT]
    transitions:
      - from: MONITORING
        to: DUE_SOON
        trigger: "system sweep when due_date - 30 days <= current date <= due_date + grace_period_days"
        actor: system
        preconditions: []
        side_effects: ["increments TaxMonitoringRecord.version by 1"]
      - from: MONITORING
        to: DELINQUENT
        trigger: "system sweep when current date > due_date + grace_period_days"
        actor: system
        preconditions: []
        side_effects: ["delinquent_since = due_date + grace_period_days + 1 day", "increments TaxMonitoringRecord.version by 1"]
      - from: DUE_SOON
        to: DELINQUENT
        trigger: "system sweep when current date > due_date + grace_period_days"
        actor: system
        preconditions: []
        side_effects: ["delinquent_since = due_date + grace_period_days + 1 day", "increments TaxMonitoringRecord.version by 1"]
      - from: DELINQUENT
        to: PENALTY_ACCRUING
        trigger: "system sweep on first pass after delinquent_since when accrued penalty recomputes to > 0"
        actor: system
        preconditions: []
        side_effects: ["accrued_penalty_cents recomputed per tax_penalty_accrual", "increments TaxMonitoringRecord.version by 1"]
      - from: PENALTY_ACCRUING
        to: REDEMPTION_RISK
        trigger: "system sweep when current date > delinquent_since + 730 days"
        actor: system
        preconditions: []
        side_effects: ["increments TaxMonitoringRecord.version by 1"]
      - from: MONITORING
        to: PAID_CURRENT
        trigger: "POST /servicing/tax-monitoring-records/{id}/mark-paid"
        actor: EscrowAnalyst
        preconditions:
          - "current date <= due_date + grace_period_days"
          - "Disbursement (disbursement_id) exists, is RELEASED or CLEARED, belongs to an escrow account of the same loan, and amount_cents >= amount_due_cents (else ERR_INVALID_AMOUNT)"
        side_effects: ["paid_via_disbursement_id set", "accrued_penalty_cents frozen at current value (0)", "increments TaxMonitoringRecord.version by 1"]
      - from: DUE_SOON
        to: PAID_CURRENT
        trigger: "POST /servicing/tax-monitoring-records/{id}/mark-paid"
        actor: EscrowAnalyst
        preconditions:
          - "current date <= due_date + grace_period_days"
          - "Disbursement exists, is RELEASED or CLEARED, same loan, amount_cents >= amount_due_cents (else ERR_INVALID_AMOUNT)"
        side_effects: ["paid_via_disbursement_id set", "increments TaxMonitoringRecord.version by 1"]
      - from: DELINQUENT
        to: PAID_DELINQUENT
        trigger: "POST /servicing/tax-monitoring-records/{id}/mark-paid"
        actor: EscrowAnalyst
        preconditions:
          - "Disbursement exists, is RELEASED or CLEARED, same loan, amount_cents >= amount_due_cents (else ERR_INVALID_AMOUNT)"
        side_effects: ["accrued_penalty_cents recomputed one final time as of today and frozen", "paid_via_disbursement_id set", "increments TaxMonitoringRecord.version by 1"]
      - from: PENALTY_ACCRUING
        to: PAID_DELINQUENT
        trigger: "POST /servicing/tax-monitoring-records/{id}/mark-paid"
        actor: EscrowAnalyst
        preconditions:
          - "Disbursement exists, is RELEASED or CLEARED, same loan, amount_cents >= amount_due_cents (else ERR_INVALID_AMOUNT)"
        side_effects: ["accrued_penalty_cents recomputed one final time as of today and frozen", "paid_via_disbursement_id set", "increments TaxMonitoringRecord.version by 1"]
      - from: REDEMPTION_RISK
        to: PAID_DELINQUENT
        trigger: "POST /servicing/tax-monitoring-records/{id}/mark-paid"
        actor: EscrowAnalyst
        preconditions:
          - "Disbursement exists, is RELEASED or CLEARED, same loan, amount_cents >= amount_due_cents (else ERR_INVALID_AMOUNT)"
        side_effects: ["accrued_penalty_cents recomputed one final time as of today and frozen", "paid_via_disbursement_id set", "increments TaxMonitoringRecord.version by 1"]

  - entity: EscrowAnalysisCycle
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, VOIDED]
    transitions:
      - from: DRAFT
        to: COMPUTED
        trigger: "POST /servicing/analyses/{id}/compute"
        actor: EscrowAnalyst
        preconditions:
          - "EscrowAccount.hold_status = NONE (else ERR_ACCOUNT_ON_HOLD)"
          - "EscrowAccount.account_status = ACTIVE (else ERR_INVALID_STATE_TRANSITION)"
          - "At least one ACTIVE EscrowLineItem on the account (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Runs annual_escrow_analysis (method variant per cycle.method) and trial_balance_projection; all computed fields populated"
          - "computed_at = now; increments EscrowAnalysisCycle.version by 1"
      - from: REOPENED
        to: COMPUTED
        trigger: "POST /servicing/analyses/{id}/compute (recompute)"
        actor: EscrowAnalyst
        preconditions:
          - "EscrowAccount.hold_status = NONE (else ERR_ACCOUNT_ON_HOLD)"
          - "EscrowAccount.account_status = ACTIVE"
        side_effects: ["All computed fields repopulated; computed_at refreshed", "increments EscrowAnalysisCycle.version by 1"]
      - from: COMPUTED
        to: STATEMENT_ISSUED
        trigger: "POST /servicing/analyses/{id}/issue-statement"
        actor: EscrowAnalyst
        preconditions: []
        side_effects:
          - "statement_issued_at = now; statement_due_date = date(computed_at) + 30 days; statement_timeliness = ON_TIME when issue date <= statement_due_date else LATE"
          - "increments EscrowAnalysisCycle.version by 1"
      - from: STATEMENT_ISSUED
        to: EFFECTIVE
        trigger: "POST /servicing/analyses/{id}/finalize"
        actor: EscrowAnalyst
        preconditions:
          - "EscrowAccount.hold_status = NONE (else ERR_ACCOUNT_ON_HOLD)"
        side_effects:
          - "Create PaymentChangeNotice (DRAFT) carrying old/new monthly amounts; effective_date = first day of second month after finalize month; send_by_date = effective_date - 30 days"
          - "If surplus_cents >= 5000: post SURPLUS_REFUND ledger entry of -surplus_cents (refund to borrower); if 0 < surplus_cents < 5000: no ledger entry, surplus stays credited in the account"
          - "Prior cycle of this account in EFFECTIVE transitions to SUPERSEDED"
          - "EscrowAccount.last_analysis_year = analysis_year; next_analysis_due_date += 12 months"
          - "increments EscrowAnalysisCycle.version by 1 and EscrowAccount.version by 1"
      - from: EFFECTIVE
        to: REOPENED
        trigger: "POST /servicing/analyses/{id}/reopen OR system cascade from ErrorResolutionCase resolve with outcome CORRECTED"
        actor: "ComplianceOfficer | system"
        preconditions: []
        side_effects:
          - "Every PaymentChangeNotice with analysis_id = this in status DRAFT, SENT, or ACKNOWLEDGED transitions to VOIDED (cascade)"
          - "increments EscrowAnalysisCycle.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: a new analysis cycle is created for the same account while this one is DRAFT"
        actor: system
        preconditions: []
        side_effects: ["increments EscrowAnalysisCycle.version by 1"]
      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system cascade: a later cycle for the same account reaches EFFECTIVE"
        actor: system
        preconditions: []
        side_effects: ["increments EscrowAnalysisCycle.version by 1"]
      - from: DRAFT
        to: VOIDED
        trigger: "POST /servicing/analyses/{id}/void"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["increments EscrowAnalysisCycle.version by 1"]
      - from: COMPUTED
        to: VOIDED
        trigger: "POST /servicing/analyses/{id}/void"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["increments EscrowAnalysisCycle.version by 1"]
      - from: REOPENED
        to: VOIDED
        trigger: "POST /servicing/analyses/{id}/void"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["increments EscrowAnalysisCycle.version by 1"]

  - entity: PaymentChangeNotice
    initial_state: DRAFT
    terminal_states: [APPLIED, VOIDED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /servicing/notices/{id}/send"
        actor: EscrowAnalyst
        preconditions: []
        side_effects:
          - "sent_at = now; timeliness = ON_TIME when sent date <= send_by_date else LATE"
          - "increments PaymentChangeNotice.version by 1"
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /servicing/notices/{id}/acknowledge"
        actor: Borrower
        preconditions:
          - "Borrower ownership: X-User-ID = id of the Loan owning the analysis's escrow account (else ERR_BORROWER_NOT_OWNER)"
          - "shortage_option required when analysis shortage_cents + deficiency_cents > 0 (else ERR_SHORTAGE_OPTION_REQUIRED); forbidden when it is 0 (else ERR_SHORTAGE_OPTION_NOT_APPLICABLE)"
          - "shortage_option = LUMP_SUM rejected when the analysis deficiency_cents >= notice.old_monthly_escrow_cents (the account monthly payment pinned at finalize time) (else ERR_DEFICIENCY_SPREAD_MANDATORY)"
        side_effects:
          - "When shortage_option = LUMP_SUM: new_monthly_escrow_cents recomputed to base_monthly_escrow_cents only (no spread)"
          - "increments PaymentChangeNotice.version by 1"
      - from: SENT
        to: APPLIED
        trigger: "POST /servicing/notices/{id}/apply"
        actor: EscrowAnalyst
        preconditions:
          - "current date >= effective_date (else ERR_EFFECTIVE_DATE_NOT_REACHED)"
          - "Analysis must not be REOPENED or VOIDED (else ERR_INVALID_STATE_TRANSITION)"
          - "If analysis shortage+deficiency > 0 and no shortage_option chosen (not ACKNOWLEDGED): treated as SPREAD_12 default"
        side_effects:
          - "EscrowAccount.monthly_escrow_cents = notice.new_monthly_escrow_cents"
          - "increments PaymentChangeNotice.version by 1 and EscrowAccount.version by 1"
      - from: ACKNOWLEDGED
        to: APPLIED
        trigger: "POST /servicing/notices/{id}/apply"
        actor: EscrowAnalyst
        preconditions:
          - "current date >= effective_date (else ERR_EFFECTIVE_DATE_NOT_REACHED)"
          - "Analysis must not be REOPENED or VOIDED (else ERR_INVALID_STATE_TRANSITION)"
          - "If shortage_option = LUMP_SUM: sum of DEPOSIT ledger entries with effective_date >= notice sent date and <= today must be >= shortage_cents + deficiency_cents (else ERR_SHORTAGE_LUMP_SUM_MISSING)"
        side_effects:
          - "EscrowAccount.monthly_escrow_cents = notice.new_monthly_escrow_cents"
          - "increments PaymentChangeNotice.version by 1 and EscrowAccount.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /servicing/notices/{id}/void OR cascade from analysis reopen"
        actor: "ComplianceOfficer | system"
        preconditions: []
        side_effects: ["increments PaymentChangeNotice.version by 1"]
      - from: SENT
        to: VOIDED
        trigger: "POST /servicing/notices/{id}/void OR cascade from analysis reopen"
        actor: "ComplianceOfficer | system"
        preconditions: []
        side_effects: ["increments PaymentChangeNotice.version by 1"]
      - from: ACKNOWLEDGED
        to: VOIDED
        trigger: "cascade from analysis reopen"
        actor: system
        preconditions: []
        side_effects: ["increments PaymentChangeNotice.version by 1"]

  - entity: EscrowAdvance
    initial_state: OUTSTANDING
    terminal_states: [RECOVERED, WRITTEN_OFF]
    transitions:
      - from: OUTSTANDING
        to: RECOVERING
        trigger: "system: first recovery allocation (deposit waterfall or POST /servicing/advances/{id}/recover) with 0 < recovered_cents < amount_cents - written_off_cents"
        actor: "system | EscrowAnalyst"
        preconditions: []
        side_effects: ["increments EscrowAdvance.version by 1"]
      - from: OUTSTANDING
        to: RECOVERED
        trigger: "system: recovery allocation brings outstanding_cents to 0 in one step"
        actor: system
        preconditions: []
        side_effects: ["increments EscrowAdvance.version by 1"]
      - from: RECOVERING
        to: RECOVERED
        trigger: "system: outstanding_cents reaches 0"
        actor: system
        preconditions: []
        side_effects: ["increments EscrowAdvance.version by 1"]
      - from: OUTSTANDING
        to: WRITTEN_OFF
        trigger: "POST /servicing/advances/{id}/write-off"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["written_off_cents = outstanding_cents; outstanding_cents = 0", "increments EscrowAdvance.version by 1"]
      - from: RECOVERING
        to: WRITTEN_OFF
        trigger: "POST /servicing/advances/{id}/write-off"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["written_off_cents = outstanding_cents; outstanding_cents = 0", "increments EscrowAdvance.version by 1"]

  - entity: ErrorResolutionCase
    initial_state: RECEIVED
    terminal_states: [RESOLVED_CORRECTED, RESOLVED_NO_ERROR, DISMISSED_NOT_COVERED]
    transitions:
      - from: RECEIVED
        to: ACKNOWLEDGED
        trigger: "POST /servicing/error-cases/{id}/acknowledge"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "acknowledged_at = now; ack_timeliness = ON_TIME when ack date <= ack_deadline (received + 5 business days) else LATE"
          - "increments ErrorResolutionCase.version by 1"
      - from: ACKNOWLEDGED
        to: INVESTIGATING
        trigger: "POST /servicing/error-cases/{id}/assign"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["assigned_to_user_id set", "increments ErrorResolutionCase.version by 1"]
      - from: INVESTIGATING
        to: EXTENDED
        trigger: "POST /servicing/error-cases/{id}/extend"
        actor: ComplianceOfficer
        preconditions:
          - "current date <= received + 30 business days (else ERR_EXTENSION_WINDOW_PASSED)"
        side_effects: ["resolution_deadline recomputed to received + 45 business days", "increments ErrorResolutionCase.version by 1"]
      - from: INVESTIGATING
        to: RESOLVED_CORRECTED
        trigger: "POST /servicing/error-cases/{id}/resolve with outcome = CORRECTED"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID != assigned_to_user_id (else ERR_SOD_VIOLATION)"
          - "correction_amount_cents present and > 0 (else ERR_INVALID_AMOUNT)"
          - "Loan escrow account exists and account_status != CLOSED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Post ERROR_CORRECTION ledger entry of +correction_amount_cents effective today (cascade link 1)"
          - "Recompute EscrowAccount.balance_cents (cascade link 2)"
          - "If an EscrowAnalysisCycle of the account is EFFECTIVE: it transitions to REOPENED (cascade link 3)"
          - "Each PaymentChangeNotice of that analysis in DRAFT/SENT/ACKNOWLEDGED transitions to VOIDED (cascade link 4)"
          - "resolved_at = now; resolved_by_user_id = X-User-ID; resolution_timeliness computed"
          - "increments ErrorResolutionCase.version by 1 and EscrowAccount.version by 1"
      - from: EXTENDED
        to: RESOLVED_CORRECTED
        trigger: "POST /servicing/error-cases/{id}/resolve with outcome = CORRECTED"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID != assigned_to_user_id (else ERR_SOD_VIOLATION)"
          - "correction_amount_cents present and > 0 (else ERR_INVALID_AMOUNT)"
          - "Loan escrow account exists and account_status != CLOSED"
        side_effects: ["Same correction cascade as INVESTIGATING -> RESOLVED_CORRECTED", "increments ErrorResolutionCase.version by 1 and EscrowAccount.version by 1"]
      - from: INVESTIGATING
        to: RESOLVED_NO_ERROR
        trigger: "POST /servicing/error-cases/{id}/resolve with outcome = NO_ERROR"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID != assigned_to_user_id (else ERR_SOD_VIOLATION)"
        side_effects: ["resolved_at, resolved_by_user_id, resolution_timeliness set", "increments ErrorResolutionCase.version by 1"]
      - from: EXTENDED
        to: RESOLVED_NO_ERROR
        trigger: "POST /servicing/error-cases/{id}/resolve with outcome = NO_ERROR"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID != assigned_to_user_id (else ERR_SOD_VIOLATION)"
        side_effects: ["resolved_at, resolved_by_user_id, resolution_timeliness set", "increments ErrorResolutionCase.version by 1"]
      - from: RECEIVED
        to: DISMISSED_NOT_COVERED
        trigger: "POST /servicing/error-cases/{id}/dismiss"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["increments ErrorResolutionCase.version by 1"]
      - from: ACKNOWLEDGED
        to: DISMISSED_NOT_COVERED
        trigger: "POST /servicing/error-cases/{id}/dismiss"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["increments ErrorResolutionCase.version by 1"]

# =============================================================================
# Concurrency Rules (OCC only — see SKILL.md 1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: analysis-create-stale-account
    parent_entity: EscrowAccount
    write_endpoint: "POST /servicing/escrow-accounts/{id}/analyses"
    occ_field: expected_escrow_account_version
    description: |
      Creating an EscrowAnalysisCycle against an EscrowAccount whose version has
      advanced since the client last observed it is rejected. Creating a cycle
      legitimately supersedes an existing DRAFT cycle, so a writer whose view of
      the account predates another writer's create would otherwise supersede a
      cycle it never saw; the stale expected_escrow_account_version exposes this.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: disbursement-patch-stale-version
    parent_entity: Disbursement
    write_endpoint: "PATCH /servicing/disbursements/{id}"
    occ_field: expected_disbursement_version
    description: |
      Patching a SCHEDULED Disbursement whose version has advanced since the
      client last observed it is rejected. Reschedules and amount changes are
      both legitimate when applied to the current row, so a writer carrying a
      stale version would silently overwrite another writer's reschedule; the
      OCC check on Disbursement.version rejects the stale write.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: initial_cushion_and_payment
    trigger: "EscrowAccount activate; recomputed on every EscrowLineItem create/patch/remove"
    algorithm: aggregation
    formula: |
      A = sum of expected_annual_amount_cents over EscrowLineItem rows with
          escrow_account_id = account AND status = ACTIVE
      target_cushion_cents = round_half_up(A / 6)          # RESPA max cushion: 1/6 of annual disbursements
      base_monthly = sum over ACTIVE line items of round_half_up(expected_annual_amount_cents / 12)
      # PINNED ROUNDING ORDER: round each line item's monthly share to whole cents FIRST, then sum.
      monthly_escrow_cents = base_monthly (set at activation only; afterwards replaced by notice apply)
    input_set: "EscrowLineItem rows of the account with status = ACTIVE only; REMOVED excluded"
    constants:
      CUSHION_DIVISOR: 6
      MONTHS_PER_YEAR: 12
    precision: "integer cents; round_half_up at each pinned step"

  - name: trial_balance_projection
    trigger: "POST /servicing/analyses/{id}/compute"
    algorithm: forward_looking
    formula: |
      window = [projection_start_date, projection_start_date + 364 days]  (closed interval)
      months m = 0..11 starting at projection_start_date's month
      disbursement months: for each ACTIVE line item, installment amount =
        round_half_up(expected_annual_amount_cents / installments_per_year), due in
        first_due_date's month and every 12/installments_per_year months thereafter;
        an installment counts in month m when its due date falls inside window month m
      PINNED EVALUATION ORDER (circular-looking dependency resolved):
        1. Project all 12 months using the account's CURRENT monthly_escrow_cents
           (the OLD payment) for every month, including months after any notice
           effective date.
        2. lowest_projected_balance_cents = min over the 12 month-end running balances.
        3. Derive shortage/deficiency/surplus (see shortage_deficiency_surplus).
        4. ONLY THEN derive new_monthly_escrow_cents (see monthly_escrow_payment).
        Using the new payment inside the projection is forbidden and produces
        different (wrong) numbers.
      start_balance depends on cycle.method:
        PROSPECTIVE:    start_balance_cents = EscrowAccount.balance_cents at compute time
                        (includes every posted ledger entry regardless of effective_date)
        LEDGER_ACTUAL:  start_balance_cents = sum of amount_cents over EscrowLedgerEntry
                        rows of the account with effective_date strictly before
                        projection_start_date, replayed in effective_date ASC,
                        created_at ASC order
    input_set: "ACTIVE line items of the account; ledger entries per method variant"
    constants:
      WINDOW_DAYS: 364
    precision: "integer cents; round_half_up per installment"
    variants:
      - name: PROSPECTIVE
        when: "cycle.method = PROSPECTIVE"
        difference: "start balance = current posted balance_cents (forward-effective entries included)"
      - name: LEDGER_ACTUAL
        when: "cycle.method = LEDGER_ACTUAL"
        difference: "start balance = chronological replay of entries with effective_date < projection_start_date; forward-effective entries excluded"

  - name: shortage_deficiency_surplus
    trigger: "inside annual_escrow_analysis compute"
    algorithm: threshold
    formula: |
      target = cushion_target_cents = round_half_up(projected_annual_disbursements_cents / 6)
      lowest = lowest_projected_balance_cents
      deficiency_cents = max(0, -lowest)
      shortage_cents   = if lowest < target then (target - max(lowest, 0)) else 0
      surplus_cents    = max(0, start_balance_cents - target)
      Refund rule: surplus >= 5000 cents -> SURPLUS_REFUND ledger entry at finalize;
                   0 < surplus < 5000 -> credit only (no entry, no refund)
      Repayment rule: shortage+deficiency spread over 12 months;
                   LUMP_SUM option forbidden when deficiency_cents >= account
                   monthly_escrow_cents at finalize time (one full month of escrow)
    input_set: "outputs of trial_balance_projection"
    constants:
      SURPLUS_REFUND_THRESHOLD_CENTS: 5000
      SPREAD_MONTHS: 12
      CUSHION_DIVISOR: 6
    precision: "integer cents; exact boundary at >= 5000 (5000 refunds, 4999 credits)"

  - name: monthly_escrow_payment
    trigger: "inside annual_escrow_analysis compute; acknowledge (LUMP_SUM recompute); notice apply"
    algorithm: aggregation
    formula: |
      base_monthly_escrow_cents = sum over ACTIVE line items of
        round_half_up(expected_annual_amount_cents / 12)
        # PINNED: per-line rounding THEN sum. Sum-then-round is the wrong order and
        # differs by cents (e.g., 3 lines of 100001: 3 x 8333 = 24999 vs round(300003/12) = 25000).
      total_spread = shortage_cents + deficiency_cents
      spread_monthly_cents = floor(total_spread / 12)
      spread_first_month_cents = total_spread - 11 * spread_monthly_cents   # remainder loaded FIRST
      new_monthly_escrow_cents (SPREAD_12) = base_monthly_escrow_cents + spread_monthly_cents
      new_monthly_escrow_cents (LUMP_SUM)  = base_monthly_escrow_cents
    input_set: "ACTIVE line items + shortage/deficiency from shortage_deficiency_surplus"
    constants:
      SPREAD_MONTHS: 12
    precision: "integer cents; floor for spread division; remainder assigned to first month"

  - name: tax_penalty_accrual
    trigger: "system sweep (recompute while DELINQUENT/PENALTY_ACCRUING/REDEMPTION_RISK); final freeze at mark-paid"
    algorithm: chronological
    formula: |
      days_late = days_30360(delinquent_since, current_date)
        where days_30360 uses the 30/360 convention:
        days = 360*(Y2-Y1) + 30*(M2-M1) + (min(D2,30) - min(D1,30)),
        and D2 = 31 becomes 30 only when D1 in {30,31}
      months_effective = floor(days_late / 30)
      SIMPLE:   accrued_penalty_cents = round_half_up(amount_due_cents * (monthly_penalty_rate_bps/10000) * months_effective)
      COMPOUND: iterate months_effective times from bal = amount_due_cents:
                  bal = bal + round_half_up(bal * monthly_penalty_rate_bps/10000)
                accrued_penalty_cents = bal - amount_due_cents
                # per-month rounding INSIDE the loop is pinned (rounding order matters)
    input_set: "the TaxMonitoringRecord itself"
    constants:
      DAYS_PER_MONTH_30360: 30
      REDEMPTION_RISK_DAYS: 730
    precision: "integer cents; round_half_up per month for COMPOUND, once for SIMPLE"
    variants:
      - name: SIMPLE
        when: "record.penalty_method = SIMPLE"
        difference: "single multiplication; no compounding"
      - name: COMPOUND
        when: "record.penalty_method = COMPOUND"
        difference: "monthly compounding with per-month round_half_up; strictly larger than SIMPLE for months_effective >= 2"

  - name: force_placement_refund_proration
    trigger: "POST /servicing/insurance-policies/{id}/refund-force-placement"
    algorithm: constraint_propagation
    formula: |
      term_days = 365
      evidence_date = created_at date of the evidence policy (selector: another ACTIVE
        policy of same policy_type on the loan covering current date; earliest
        coverage_start_date, tie-break created_at ASC)
      ACT_365 variant:
        used_days = calendar days from date(force_placed_at) to evidence_date (exclusive)
        fp_refund_cents = round_half_up(fp_premium_cents * (365 - used_days) / 365)
      CONTRACT_30_360 variant:
        used_days = days_30360(date(force_placed_at), evidence_date)
        fp_refund_cents = round_half_up(fp_premium_cents * (360 - used_days) / 360)
      refund_timeliness: ON_TIME when refund date <= evidence_date + 15 days else LATE
    input_set: "the FORCE_PLACED policy + evidence policy set on the same loan"
    constants:
      FP_TERM_DAYS: 365
      REFUND_WINDOW_DAYS: 15
    precision: "integer cents; round_half_up"
    variants:
      - name: ACT_365
        when: "policy.day_count_convention = ACT_365 (default)"
        difference: "actual calendar days over a 365-day term"
      - name: CONTRACT_30_360
        when: "policy.day_count_convention = CONTRACT_30_360"
        difference: "30/360 day count over a 360-day term; yields a different refund for the same dates (e.g., 45 days used on 182500: 160000 ACT vs 160194 30/360)"

  - name: advance_recovery_waterfall
    trigger: "POST /servicing/escrow-accounts/{id}/deposits (after DEPOSIT entry posts); FORCE_PLACEMENT_REFUND posting"
    algorithm: waterfall_allocation
    formula: |
      R = deposit amount_cents (or refund amount)
      candidates = EscrowAdvance rows of the account with status in {OUTSTANDING, RECOVERING},
                   ordered by created_at ASC (oldest first; ties broken by larger outstanding_cents first)
      for each advance in order while R > 0:
        take = min(R, advance.outstanding_cents)
        post ADVANCE_RECOVERY ledger entry of -take (source = the advance)
        advance.recovered_cents += take
        advance.status: OUTSTANDING -> RECOVERING (partial) or -> RECOVERED (outstanding_cents = 0);
                        RECOVERING -> RECOVERED when outstanding_cents reaches 0
        R -= take
      Deposit net effect on balance: +amount_cents - total_recovered
      CAP: creating an advance (auto or manual) that would push the sum of
      outstanding_cents over all non-terminal advances of the account above
      ADVANCE_CAP_CENTS is rejected with ERR_ADVANCE_CAP_EXCEEDED.
    input_set: "non-terminal EscrowAdvance rows of the account"
    constants:
      ADVANCE_CAP_CENTS: 1000000
    precision: "integer cents"

  - name: business_day_add
    trigger: "ErrorResolutionCase create (ack_deadline, resolution_deadline) and extend"
    algorithm: chronological
    formula: |
      business_day(d) = d is Monday..Friday AND d not in FEDERAL_HOLIDAYS
      add_business_days(start, n): advance one calendar day at a time; count only
        business days; the start day itself is day 0 (never counted).
      ack_deadline        = add_business_days(received_date, 5)
      resolution_deadline = add_business_days(received_date, 30)   # 45 when EXTENDED
    input_set: "the ErrorResolutionCase received date"
    constants:
      ACK_BUSINESS_DAYS: 5
      RESOLUTION_BUSINESS_DAYS: 30
      EXTENDED_RESOLUTION_BUSINESS_DAYS: 45
      FEDERAL_HOLIDAYS: ["2026-09-07","2026-10-12","2026-11-11","2026-11-26","2026-12-25","2027-01-01","2027-01-18","2027-02-15","2027-05-31","2027-07-05","2027-09-06","2027-10-11","2027-11-11","2027-11-25","2027-12-24","2027-12-31"]
    precision: "whole days; received Fri 2026-08-07 -> ack deadline Fri 2026-08-14; received Fri 2026-09-04 -> Mon 2026-09-14 (Labor Day skipped)"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role is in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Borrower ownership: on Borrower-accessible endpoints, X-User-ID must equal the id of the Loan that owns the target resource (loan directly, or via escrow_account.loan_id / analysis.escrow_account.loan_id)"
    error_id: ERR_BORROWER_NOT_OWNER
    http_status: 403
    applies_to: "POST /servicing/loans/{id}/error-cases; POST /servicing/loans/{id}/insurance-policies; POST /servicing/insurance-policies/{id}/reinstate; POST /servicing/notices/{id}/acknowledge; POST /servicing/escrow-accounts/{id}/deposits"
  - priority: 4
    category: existence
    check: "Every path id resolves to an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: existence
    check: "Body foreign-key references (payee_id, line_item_id, disbursement_id) exist"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "endpoints taking body FK references"
  - priority: 6
    category: business_constraint
    check: "Request shape: required fields present, enum members valid, dates ISO; unknown body fields are ignored silently"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 7
    category: state
    check: "OCC: expected_<parent>_version must equal the parent's current version (endpoints that declare the field)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /servicing/escrow-accounts/{id}/analyses; PATCH /servicing/disbursements/{id}"
  - priority: 8
    category: state
    check: "Terminal-state lockout: no transitions from a terminal state"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all action endpoints on stateful entities"
  - priority: 9
    category: state
    check: "Target resource is in a from-state that names this transition"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints on stateful entities"
  - priority: 10
    category: state
    check: "Escrow hold gate: hold_status = COMPLIANCE_HOLD blocks disbursement release and analysis compute/finalize"
    error_id: ERR_ACCOUNT_ON_HOLD
    http_status: 409
    applies_to: "POST /servicing/disbursements/{id}/release; POST /servicing/analyses/{id}/compute; POST /servicing/analyses/{id}/finalize"
  - priority: 11
    category: state
    check: "Loan lifecycle gate: disbursement release, insurance and escrow writes require Loan.status = ACTIVE (account activation may happen while ONBOARDING)"
    error_id: ERR_LOAN_NOT_ACTIVE
    http_status: 409
    applies_to: "disbursement release; insurance policy create/reinstate/charge; deposits"
  - priority: 12
    category: business_safety
    check: "Segregation of duties: payee verifier != payee creator; disbursement releaser != disbursement scheduler; error-case resolver != assigned investigator"
    error_id: ERR_SOD_VIOLATION
    http_status: 409
    applies_to: "POST /servicing/payees/{id}/verify; POST /servicing/disbursements/{id}/release; POST /servicing/error-cases/{id}/resolve"
  - priority: 13
    category: business_safety
    check: "RESPA force-placement notice windows: charge requires current date >= notice_1 date + 45 days AND >= notice_2 date + 15 days; reminder requires >= notice_1 date + 30 days"
    error_id: "ERR_NOTICE_WINDOW_NOT_MET / ERR_REMINDER_TOO_EARLY"
    http_status: 409
    applies_to: "POST /servicing/insurance-policies/{id}/charge-force-placement; POST /servicing/insurance-policies/{id}/send-reminder-notice"
  - priority: 14
    category: business_safety
    check: "Force-placement blocked while other active same-type coverage exists on the loan"
    error_id: ERR_ACTIVE_COVERAGE_EXISTS
    http_status: 409
    applies_to: "POST /servicing/insurance-policies/{id}/charge-force-placement"
  - priority: 15
    category: business_temporal
    check: "Release not before scheduled_release_date; notice apply not before effective_date; case extension only on or before the 30-business-day resolution deadline; projection_start_date must be day 1 of a month"
    error_id: "ERR_RELEASE_TOO_EARLY / ERR_EFFECTIVE_DATE_NOT_REACHED / ERR_EXTENSION_WINDOW_PASSED / ERR_PROJECTION_START_INVALID"
    http_status: 409
    applies_to: "disbursement release; notice apply; case extend; analysis create"
  - priority: 16
    category: business_constraint
    check: "Uniqueness and duplicates: loan_number unique; one escrow account per loan; one ACTIVE line item per expense_type per account; no second non-terminal error case with same loan+error_type; insurance coverage half-open overlap; analysis windows (closed interval) must not overlap among non-terminal cycles of an account"
    error_id: "ERR_DUPLICATE_LOAN_NUMBER / ERR_ESCROW_ACCOUNT_EXISTS / ERR_DUPLICATE_LINE_ITEM_TYPE / ERR_DUPLICATE_ACTIVE_CASE / ERR_COVERAGE_OVERLAP / ERR_ANALYSIS_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "creation endpoints for those resources"
  - priority: 17
    category: business_referential
    check: "Cross-entity state: payee must be VERIFIED (line-item create, disbursement create/release); loan transfer blocked by open error cases; payoff blocked by outstanding advances; loan activation requires ACTIVE escrow account when escrow_required"
    error_id: "ERR_PAYEE_NOT_VERIFIED / ERR_UNRESOLVED_ERROR_CASE / ERR_ADVANCE_OUTSTANDING / ERR_ESCROW_NOT_ACTIVE"
    http_status: 409
    applies_to: "line-item create; disbursement create/release; loan transfer-out; loan payoff; loan activate"
  - priority: 18
    category: business_fiscal
    check: "Amount rules: amounts must be positive integers; disbursement amount >= tax amount_due on mark-paid; recovery amount <= advance outstanding and <= account balance; advance cap ADVANCE_CAP_CENTS; shortage-option required/applicable; lump-sum deposit present before apply"
    error_id: "ERR_INVALID_AMOUNT / ERR_RECOVERY_EXCEEDS_OUTSTANDING / ERR_ADVANCE_CAP_EXCEEDED / ERR_SHORTAGE_OPTION_REQUIRED / ERR_SHORTAGE_OPTION_NOT_APPLICABLE / ERR_SHORTAGE_LUMP_SUM_MISSING / ERR_DEFICIENCY_SPREAD_MANDATORY"
    http_status: 422
    applies_to: "amount-bearing endpoints"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving; default logical time 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Setting the clock runs the deterministic sweep: payee VERIFIED->EXPIRED past verification_expires_at (cascading SCHEDULED disbursements to BLOCKED), insurance lapse/expiry detection, tax DUE_SOON/DELINQUENT/PENALTY_ACCRUING/REDEMPTION_RISK transitions with penalty recompute."
    roles: [ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: { previous_utc: string, current_utc: string, transitions_applied: integer }
    side_effects: ["runs the full sweep described above; each transitioned entity's version increments by 1"]
  - method: GET
    path: "/_clock/current_utc"
    description: "Read the logical clock (2026-08-01T00:00:00Z before any set call)"
    roles: [ComplianceOfficer, EscrowAnalyst, DisbursementProcessor, PayeeVerifier, InsuranceSpecialist, Borrower]
    code: 200
    input: []
    output: { current_utc: string }
    side_effects: []

  # --- Loans ---
  - method: POST
    path: "/servicing/loans"
    description: "Board a loan"
    roles: [ComplianceOfficer]
    code: 201
    input: [loan_number, borrower_name, principal_balance_cents, monthly_pi_cents, closing_date, "escrow_required?"]
    output: Loan
    side_effects: ["status = ONBOARDING; ERR_DUPLICATE_LOAN_NUMBER when loan_number already exists"]
  - method: GET
    path: "/servicing/loans"
    description: "List loans"
    roles: [ComplianceOfficer, EscrowAnalyst, DisbursementProcessor, PayeeVerifier, InsuranceSpecialist, Borrower]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Loan[]
    side_effects: []
  - method: GET
    path: "/servicing/loans/{id}"
    description: "Get one loan"
    roles: [ComplianceOfficer, EscrowAnalyst, DisbursementProcessor, PayeeVerifier, InsuranceSpecialist, Borrower]
    code: 200
    input: []
    output: Loan
    side_effects: []
  - method: POST
    path: "/servicing/loans/{id}/activate"
    description: "Activate an ONBOARDING loan"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Loan
    side_effects: ["status ONBOARDING -> ACTIVE; increments Loan.version by 1"]
  - method: POST
    path: "/servicing/loans/{id}/payoff"
    description: "Pay off an ACTIVE loan; closes escrow with surplus refund cascade"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Loan
    side_effects: ["escrow account -> CLOSED with SURPLUS_REFUND of residual balance; SCHEDULED/BLOCKED disbursements -> CANCELLED; increments Loan.version by 1"]
  - method: POST
    path: "/servicing/loans/{id}/transfer-out"
    description: "Transfer servicing out; blocked while any error case is open"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Loan
    side_effects: ["escrow account -> CLOSED with SURPLUS_REFUND of residual balance; SCHEDULED/BLOCKED disbursements -> CANCELLED; increments Loan.version by 1"]

  # --- Escrow accounts ---
  - method: POST
    path: "/servicing/loans/{id}/escrow-account"
    description: "Create the loan's escrow account (one per loan)"
    roles: [EscrowAnalyst]
    code: 201
    input: []
    output: EscrowAccount
