              as: ProgramAdmin
          assert:
            - "the receipt returns 200 with status RECEIVED, disposition REMANUFACTURE, received_at 2026-08-01T00:00:00Z and rejection_reason null"
            - "the pack reads status STOCK, pack_type REMANUFACTURED, refurb_soh_pct 88.0, remanufacture_count 1, damaged_defective false and installed_vehicle_id null"
            - "the program reads reman_available_count 1 and reman_stock_state AVAILABLE"
            - "the HEALTHY module filter has total_count 16 - the whole roster was reset, so positions 3 and 7 read status HEALTHY again instead of FAULTED"
            - "the center reads open_hazmat_holds 0, rejected_shipment_count 0, compliance_score 100 and status ACTIVE - an accepted receipt is not a compliance event"
            - "the frozen shipment fields are unchanged: hazmat_classification UN3536 and soc_limit_pct 30.00"

      - name: rejection_of_an_already_quarantined_pack_counts_the_shipment_not_the_hold
        claim_type: action_endpoint
        grounds:
          - state_machines.PackShipment.transitions.TENDERED_to_REJECTED
          - entities.ServiceCenter.fields.open_hazmat_holds
          - calculations.center_compliance_score
        distinguishing_aspect: |
          Two rejections at the same center move the LIFETIME counter but not the live-hold counter,
          because the hold increment is conditioned on the pack ENTERING quarantine from the
          rejection and both packs were already QUARANTINED by a thermal event. So the center's
          compliance_score drops to 70 while its status stays ACTIVE and further shipments are still
          admitted - an implementation that increments open_hazmat_holds unconditionally suspends the
          center at the second rejection and then wrongly refuses the third shipment.
        test_recipe:
          setup:
            - "One program, one center with a technician, two vehicles each with an installed pack, both packs quarantined by an S3 ThermalEvent."
