          - calculations.case_occupancy_window.constants.PROVIDER_GAP_MIN
        distinguishing_aspect: |
          PROVIDER geometry, deliberately the mirror image of the room instance:
          the interval is CLOSED and buffered by PROVIDER_GAP_MIN on both sides,
          and it IGNORES turnover. Case 1 holds [13:50, 14:30] (14:20 end + 10) and
          case 2 starting 14:40 in a DIFFERENT room holds [14:30, 15:10]; the two
          merely touch at 14:30 and that alone is a collision, whereas the same
