  - rule_id: non_linear_state_machine
    instances:

      - name: disclosure_profile_deployed_flagged_remediated_redeployed_cycle
        grounds:
          - state_machines.ChannelDisclosureProfile
          - state_machines.ChannelDisclosureProfile.DEPLOYED_to_FLAGGED
          - state_machines.ChannelDisclosureProfile.FLAGGED_to_REMEDIATED
          - state_machines.ChannelDisclosureProfile.REMEDIATED_to_DEPLOYED
          - calculations.channel_disclosure_score
          - calculations.property_disclosure_posture
        distinguishing_aspect: |
          ChannelDisclosureProfile is a genuine cycle, not a DAG: the profile
          re-enters DEPLOYED, a state it has already occupied, and the second
          occupancy is materially different from the first — remediation_round has
          gone from 0 to 1 and disclosure_score from 58 to 90 — so the Property's
          posture walks NON_COMPLIANT -> NON_COMPLIANT -> COMPLIANT -> COMPLIANT
          rather than monotonically improving. A DAG-shaped implementation that
          treats DEPLOYED as reachable only from DRAFT cannot express this.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; jurisdiction US-NV-CLARK with both mandates true; a channel that supports totals AND itemisation, so the capability penalty is 0 throughout"
            - "One-mandatory-fee PUBLISHED program with a value-bearing inclusion, so inclusion_coverage_ratio is 1.0000 and the coverage bonus is 10"
            - "The profile is deliberately created with disclosure_placement CHECKOUT and itemized_at_first_quote false, giving 40 + 0 + 8 + 10 = 58 — deployable, but two points under the flag threshold"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /jurisdictions"
              payload: { code: "US-NV-CLARK", name: "Clark County NV", occupancy_tax_rate_bps: 1338, first_quote_total_required: true, itemization_required_on_folio: true, mandatory_fee_ban: false, opt_out_mandate: true }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { j_nv: $.data.id }
            - call: "POST /taxability-rules"
              payload: { jurisdiction_id: "${j_nv}", fee_code: "RESORT", taxability: "TAXABLE" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /properties"
              payload: { jurisdiction_id: "${j_nv}", name: "Mirage Sands Resort", brand_code: "MSR", base_room_rate_cents: 29900, status: "ACTIVE" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /channels"
              payload: { name: "BigOTA", channel_type: "OTA", supports_total_price_display: true, supports_itemization: true }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { c_ota: $.data.id }
            - call: "POST /fee-programs"
              payload: { property_id: "${p1}", version_label: "FY26-Q4", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", expected_property_version: "${p1_v}" }
              as: RevenueManager
              as_user_id: "u-rev-1"
              captures: { fp1: $.data.id }
            - call: "POST /fee-programs/${fp1}/fees"
              payload: { code: "RESORT", label: "Resort Fee", classification: "MANDATORY", basis: "PERCENT_OF_ROOM", percent_bps: 750, disclosure_text: "Resort fee of 7.5% of the nightly room rate." }
              as: RevenueManager
              as_user_id: "u-rev-1"
              captures: { fee_resort: $.data.id }
            - call: "POST /fees/${fee_resort}/inclusions"
              payload: { service_code: "POOL_ACCESS", service_label: "Pool and cabana access", retail_value_cents: 1500, units: 1 }
              as: RevenueManager
              as_user_id: "u-rev-1"
            - call: "POST /fee-programs/${fp1}/submit-review"
              payload: {}
              as: RevenueManager
              as_user_id: "u-rev-1"
            - call: "POST /fee-programs/${fp1}/publish"
              payload: { attestation_note: "Single mandatory fee, inclusion analysis complete." }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
            - call: "GET /fee-programs/${fp1}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { fp1_v: $.data.version }
            - call: "POST /channel-disclosure-profiles"
              payload: { property_id: "${p1}", channel_id: "${c_ota}", fee_program_id: "${fp1}", first_quote_shows_total: true, itemized_at_first_quote: false, disclosure_placement: "CHECKOUT", deployed_from: "2026-09-01T00:00:00Z", deployed_to: "2026-11-30T00:00:00Z", expected_fee_program_version: "${fp1_v}" }
              as: ChannelOperator
              as_user_id: "${c_ota}"
              captures: { prof_ota: $.data.id }
            - call: "POST /channel-disclosure-profiles/${prof_ota}/deploy"
              payload: {}
              as: ChannelOperator
              as_user_id: "${c_ota}"
          trigger:
            - call: "POST /channel-disclosure-profiles/${prof_ota}/audit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
            - call: "POST /channel-disclosure-profiles/${prof_ota}/remediate"
              payload: { first_quote_shows_total: true, itemized_at_first_quote: true, disclosure_placement: "RATE_DETAILS" }
              as: ChannelOperator
              as_user_id: "${c_ota}"
            - call: "POST /channel-disclosure-profiles/${prof_ota}/confirm-remediation"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
          assert:
            - "immediately after deploy: ChannelDisclosureProfile.${prof_ota}.status == DEPLOYED, disclosure_score == 58, remediation_round == 0"
            - "immediately after deploy: Property.${p1}.min_channel_disclosure_score == 58 and Property.${p1}.disclosure_posture == NON_COMPLIANT"
            - "after audit: ChannelDisclosureProfile.${prof_ota}.status == FLAGGED and disclosure_score == 58 (the stored score is unchanged; only the status moved)"
            - "after audit: Property.${p1}.min_channel_disclosure_score == 0 because a FLAGGED profile contributes 0 regardless of its stored score"
            - "after audit: Property.${p1}.disclosure_posture == NON_COMPLIANT and Property.${p1}.open_disclosure_obligation_count == 1"
            - "after remediate: ChannelDisclosureProfile.${prof_ota}.status == REMEDIATED, disclosure_score == 90, remediation_round == 1, confirmed_undisclosed_count == 0, itemized_at_first_quote == true, disclosure_placement == RATE_DETAILS"
            - "after remediate: Property.${p1}.min_channel_disclosure_score == 90, Property.${p1}.disclosure_posture == COMPLIANT, Property.${p1}.open_disclosure_obligation_count == 0"
            - "after confirm-remediation: ChannelDisclosureProfile.${prof_ota}.status == DEPLOYED for the SECOND time, with remediation_round still 1 and disclosure_score still 90"
            - "after confirm-remediation: Property.${p1}.disclosure_posture == COMPLIANT and Property.${p1}.min_channel_disclosure_score == 90"
            - "the state sequence DEPLOYED -> FLAGGED -> REMEDIATED -> DEPLOYED is recorded, so DEPLOYED is occupied twice with different field values"
            - "a second POST /channel-disclosure-profiles/${prof_ota}/confirm-remediation now fails with ERR_INVALID_STATE (409) because the profile is DEPLOYED, not REMEDIATED"
            - "POST /channel-disclosure-profiles/${prof_ota}/remediate now fails with ERR_INVALID_STATE (409) because remediate is reachable only from FLAGGED"

