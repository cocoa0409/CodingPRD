            - "The advertiser's per-rule decision-log read returns HTTP 403 with error_id ERR_FORBIDDEN_ROLE — that endpoint's roles omit Advertiser even though the decision is about the advertiser's own creative"
            - "The analyst reads the roster with HTTP 200 and the reviewer reads the per-rule log with HTTP 200, total_count == 1"

  # ===========================================================================
  - section: "From Cross-Cutting Complexity Layers"
    instances:

      - name: occ_a_screening_run_against_a_stale_creative_version_is_rejected_across_the_revision_loop
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.screening-run-stale-creative
          - validations[priority=45].ERR_STALE_CREATIVE_VERSION
          - entities.ScreeningRun.sequence_index
        distinguishing_aspect: |
          Re-screening is legitimately repeatable, so the version guard is the only thing
          separating a fresh run from one classified against text the advertiser has already
          edited. The same expected version is accepted once and stale forever after: v1 is
          stale before the first run, v2 succeeds, and after the revision loop v4 is stale
          while v5 succeeds — and every accepted write bumps the creative by exactly one.
        test_recipe:
          setup:
            - "Rule PROH_WEAPONS (PROHIBITED, weight 12.00, requires_certification false, auto 0.90, manual 0.20, default_queue STANDARD) with no country override, so its class default disposition is BLOCKED."
            - "One verified advertiser and one creative declaring PROH_WEAPONS, created at version 1 and submitted to version 2."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "PROH_WEAPONS", title: "Weapons and firearms", category_class: "PROHIBITED", base_severity_weight: 12.00, requires_certification: false, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.20, default_queue: "STANDARD" }
              as: PolicyAdmin
              captures: { proh_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Ridgeline Outfitters", country_code: "US", industry_code: "SPORTING_GOODS" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "BUSINESS_STANDING", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Range day gear", body_text: "Range day gear and accessories for the whole season.", declared_category_codes: ["PROH_WEAPONS"], target_country_codes: ["US"], landing_page_url: "https://www.ridgeline.example/range", display_url: "https://www.ridgeline.example/range" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_id: "$.data.id", cr_v1: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_v2: "$.data.version" }
          trigger:
            - call: "POST /ad-policy/ad-creatives/${cr_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${proh_id}", confidence: 0.95, matched_snippet: "range day gear" }], expected_ad_creative_version: "${cr_v1}" }
              as: PolicyAdmin
              captures: { err_stale_1: "$.data.error_id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${proh_id}", confidence: 0.95, matched_snippet: "range day gear" }], expected_ad_creative_version: "${cr_v2}" }
              as: PolicyAdmin
              captures: { run1: "$.data.id" }
            - call: "PATCH /ad-policy/ad-creatives/${cr_id}"
              payload: { headline: "Range day accessories" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_v4: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_v5: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/screening-runs"
              payload: { classifier_version: "clf-2026.08", decisions: [{ policy_rule_id: "${proh_id}", confidence: 0.50, matched_snippet: "range day accessories" }], expected_ad_creative_version: "${cr_v4}" }
              as: PolicyAdmin
              captures: { err_stale_2: "$.data.error_id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/screening-runs"
              payload: { classifier_version: "clf-2026.08", decisions: [{ policy_rule_id: "${proh_id}", confidence: 0.50, matched_snippet: "range day accessories" }], expected_ad_creative_version: "${cr_v5}" }
              as: PolicyAdmin
              captures: { run2: "$.data.id" }
            - call: "GET /ad-policy/ad-creatives/${cr_id}/screening-runs"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/ad-creatives/${cr_id}"
              payload: {}
              as: PolicyAdmin
          assert:
            - "Both stale ingests return HTTP 412 with error_id ERR_STALE_CREATIVE_VERSION and create no ScreeningRun"
            - "ScreeningRun.${run1} has sequence_index 1, creative_version_at_run 2, outcome AUTO_DISAPPROVED (confidence 0.95 >= 0.90 on a BLOCKED rule) and provisional_risk_score 11.40"
            - "ScreeningRun.${run2} has sequence_index 2, creative_version_at_run 5, outcome ROUTED_MANUAL and provisional_risk_score 6.00"
            - "The version ladder is exactly 1 create, 2 submit, 3 run1, 4 PATCH, 5 submit, 6 run2: AdCreative.${cr_id}.version == 6 and screening_run_count == 2"
            - "After run2 the creative is PENDING_MANUAL_REVIEW with one QUEUED STANDARD task, and the advertiser holds one 9.60 ledger entry from run1's auto notice with account_status ACTIVE (9.60 < ACTION_THRESHOLDS.WARNING)"

      - name: occ_a_manual_enforcement_against_a_stale_advertiser_version_outranks_the_cooldown_conflict
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.manual-enforcement-stale-advertiser
          - validations[priority=45].ERR_STALE_ADVERTISER_VERSION
          - validations[priority=78].ERR_ENFORCEMENT_COOLDOWN_CONFLICT
        distinguishing_aspect: |
          The advertiser's version moves on every verification and on every enforcement
          re-derivation, so an operator who read the account two writes ago is stale. Priority
          45 sits above the cooldown check at 78, so a request that is both stale and inside a
          blackout window reports 412 — the 409 only surfaces once the version is correct.
        test_recipe:
          setup:
            - "One advertiser created at version 1, then verified on identity (version 2) and on business standing (version 3)."
          setup_api_calls:
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Beacon Lending Co", country_code: "US", industry_code: "CONSUMER_FINANCE" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED" }
              as: PolicyAdmin
              captures: { adv_v2: "$.data.version" }
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "BUSINESS_STANDING", outcome: "VERIFIED" }
              as: PolicyAdmin
              captures: { adv_v3: "$.data.version" }
          trigger:
            - call: "POST /ad-policy/advertisers/${adv_id}/enforcement-actions"
              payload: { action_type: "WARNING", trigger_reason: "Filed against a version that is one write behind", expected_advertiser_version: "${adv_v2}" }
              as: PolicyAdmin
              captures: { err_stale_1: "$.data.error_id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/enforcement-actions"
              payload: { action_type: "WARNING", trigger_reason: "Repeated late responses to policy correspondence", expected_advertiser_version: "${adv_v3}" }
              as: PolicyAdmin
              captures: { enf1: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/enforcement-actions"
              payload: { action_type: "RESTRICTION", trigger_reason: "Both stale and inside the cooldown blackout", expected_advertiser_version: "${adv_v3}" }
              as: PolicyAdmin
              captures: { err_stale_2: "$.data.error_id" }
            - call: "GET /ad-policy/advertisers/${adv_id}"
              payload: {}
              as: PolicyAdmin
              captures: { adv_v_now: "$.data.version" }
            - call: "POST /ad-policy/advertisers/${adv_id}/enforcement-actions"
              payload: { action_type: "RESTRICTION", trigger_reason: "Correct version but still inside the cooldown blackout", expected_advertiser_version: "${adv_v_now}" }
              as: PolicyAdmin
              captures: { err_cooldown: "$.data.error_id" }
            - call: "GET /ad-policy/enforcement-actions"
              payload: { advertiser_id: "${adv_id}" }
              as: PolicyAdmin
          assert:
            - "The first attempt returns HTTP 412 with error_id ERR_STALE_ADVERTISER_VERSION (expected 2, current 3)"
            - "The correct-version attempt returns HTTP 201: EnforcementAction.${enf1} is ACTIVE with origin MANUAL, severity_index_at_issue 0.00, effective_from 2026-08-01T00:00:00Z and effective_until 2026-08-31T00:00:00Z; the advertiser is WARNED at version 4"
            - "The third attempt, stale and inside the blackout window, returns HTTP 412 with error_id ERR_STALE_ADVERTISER_VERSION — priority 45 outranks the cooldown check at 78"
            - "The fourth attempt, with the current version 4, returns HTTP 409 with error_id ERR_ENFORCEMENT_COOLDOWN_CONFLICT (the clock 2026-08-01T00:00:00Z is inside [2026-08-01T00:00:00Z, 2026-09-03T00:00:00Z], the window extended by ENFORCEMENT_COOLDOWN_HOURS of 72)"
            - "GET /ad-policy/enforcement-actions?advertiser_id=${adv_id} reports total_count == 1 and Advertiser.${adv_id}.version is still 4 — three refusals, no writes"

      - name: rate_threshold_the_severity_index_lands_exactly_on_the_warning_and_restriction_thresholds
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.enforcement_severity_index
          - calculations.disapproval_points_assessment
          - state_machines.Advertiser.account_status.WARNED_to_RESTRICTED
          - state_machines.EnforcementAction.status.ACTIVE_to_SUPERSEDED
        distinguishing_aspect: |
          Both thresholds are inclusive lower bounds and both are struck exactly: 10.00 points
          land on ACTION_THRESHOLDS.WARNING, and a second notice of 11.50 takes the balance to
          21.50, which crosses SURCHARGE_TIER_1_AT of 20.00 for a 3.50 surcharge and lands the
          index on precisely 25.00 — RESTRICTION. An implementation using strict > for either
          bound, or one that skips the surcharge, mints the wrong action or none at all.
        test_recipe:
          setup:
            - "Rule SEV_TEN (REGULATED, weight 10.00, requires_disclaimer false, auto 0.90, manual 0.20, default_queue STANDARD) and rule SEV_ELEVEN (REGULATED, weight 11.50, same thresholds and queue), neither with a country override, so every country multiplier is 1.00."
            - "One verified advertiser with two creatives, one per rule, both submitted and screened at confidence 0.50 so each routes to manual review."
            - "One reviewer on STANDARD authorised for US with a ceiling of 3 who disapproves both with reason_codes [MANUAL_REVIEW] (REASON_FACTOR 1.00)."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "SEV_TEN", title: "Ten point category", category_class: "REGULATED", base_severity_weight: 10.00, requires_disclaimer: false, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.20, default_queue: "STANDARD" }
              as: PolicyAdmin
              captures: { r10: "$.data.id" }
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "SEV_ELEVEN", title: "Eleven and a half point category", category_class: "REGULATED", base_severity_weight: 11.50, requires_disclaimer: false, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.20, default_queue: "STANDARD" }
              as: PolicyAdmin
              captures: { r11: "$.data.id" }
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Beacon Lending Co", country_code: "US", industry_code: "CONSUMER_FINANCE" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "BUSINESS_STANDING", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/reviewers"
              payload: { display_name: "R. Alvarez", queue_specialties: ["STANDARD"], country_authorizations: ["US"], max_concurrent_claims: 3 }
              as: PolicyAdmin
              captures: { rev_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Ten point offer", body_text: "The creative that carries the ten point category on its own.", declared_category_codes: ["SEV_TEN"], target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/ten", display_url: "https://www.beaconlending.example/ten" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr1: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr1}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr1_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr1}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${r10}", confidence: 0.50, matched_snippet: "ten point claim" }], expected_ad_creative_version: "${cr1_v}" }
              as: PolicyAdmin
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Eleven point offer", body_text: "The creative that carries the eleven and a half point category.", declared_category_codes: ["SEV_ELEVEN"], target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/eleven", display_url: "https://www.beaconlending.example/eleven" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr2: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr2}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr2_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr2}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${r11}", confidence: 0.50, matched_snippet: "eleven point claim" }], expected_ad_creative_version: "${cr2_v}" }
              as: PolicyAdmin
            - call: "GET /ad-policy/review-tasks"
              payload: { ad_creative_id: "${cr1}" }
              as: PolicyAdmin
              captures: { task1: "$.data[0].id" }
            - call: "GET /ad-policy/review-tasks"
              payload: { ad_creative_id: "${cr2}" }
              as: PolicyAdmin
              captures: { task2: "$.data[0].id" }
            - call: "POST /ad-policy/review-tasks/${task1}/claim"
              payload: {}
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "POST /ad-policy/review-tasks/${task2}/claim"
              payload: {}
              as: PolicyReviewer
              as_user_id: "${rev_id}"
          trigger:
            - call: "POST /ad-policy/review-tasks/${task1}/decision"
              payload: { resolution: "DISAPPROVE", reason_codes: ["MANUAL_REVIEW"], note: "First disapproval, exactly ten points" }
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "GET /ad-policy/advertisers/${adv_id}"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/enforcement-actions"
              payload: { advertiser_id: "${adv_id}" }
              as: PolicyAdmin
              captures: { enf_warning: "$.data[0].id" }
            - call: "POST /ad-policy/review-tasks/${task2}/decision"
              payload: { resolution: "DISAPPROVE", reason_codes: ["MANUAL_REVIEW"], note: "Second disapproval, eleven and a half points" }
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "GET /ad-policy/advertisers/${adv_id}"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/enforcement-actions"
              payload: { advertiser_id: "${adv_id}" }
              as: PolicyAdmin
          assert:
            - "After the first disapproval: violation_points_raw and violation_points_decayed are both 10.00, closed_action_count is 0, base_index 10.00, escalation_surcharge 0.00 (base < SURCHARGE_TIER_1_AT) and severity_index exactly 10.00"
            - "That exact 10.00 mints EnforcementAction.${enf_warning} with action_type WARNING, origin CASCADE, status ACTIVE, severity_index_at_issue 10.00 and effective_until 2026-08-31T00:00:00Z; Advertiser.account_status == WARNED"
            - "After the second disapproval: violation_points_decayed 21.50, closed_action_count still 0 (the ACTIVE WARNING is excluded), base_index 21.50, escalation_surcharge 3.50 and severity_index exactly 25.00"
            - "That exact 25.00 mints a second action with action_type RESTRICTION and severity_index_at_issue 25.00, effective_until 2026-09-30T00:00:00Z, with prior_action_id ${enf_warning}; the WARNING row moves to SUPERSEDED and Advertiser.account_status == RESTRICTED"
            - "GET /ad-policy/enforcement-actions?advertiser_id=${adv_id} reports total_count == 2 ordered by effective_from ASC then created_at ASC, and the advertiser's ledger holds two entries of 10.00 and 11.50"

      - name: cascading_side_effects_a_manual_disapproval_runs_the_full_six_hop_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / manual_disapproval_cascades_six_hops_to_suspension_and_sibling_task_expiry
          rationale: "That instance verifies all six hops end to end, including the sibling task expiry and the reviewer slot release that the suspension triggers."

      - name: cascading_side_effects_a_cloaking_finding_reverses_an_already_approved_creative
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / cloaking_destination_check_cascades_five_hops_from_an_auto_approved_creative
          rationale: "That instance drives the five-hop chain from one destination check on an AUTO_APPROVED creative, which is the ordering-sensitive half of this layer."

      - name: dual_variant_calculation_the_two_risk_score_variants_diverge_on_one_creative
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.creative_risk_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / creative_risk_provisional_vs_final_diverge_across_cert_credit_and_mismatch_penalty
          rationale: "That instance pins both variants on the same creative and the exact delta between them."

      - name: dual_variant_calculation_the_two_point_balances_diverge_after_the_decay_boundary
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.advertiser_violation_points.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / advertiser_points_raw_vs_decayed_diverge_after_ninety_two_days
          rationale: "That instance shows the raw balance frozen while the decayed balance falls, and which of the two each downstream rule reads."

  # ===========================================================================
  - section: "From Consistency Model"
    instances:

      - name: immediate_consistency_one_disapproval_is_fully_visible_before_any_sweep_runs
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/ad-policy/review-tasks/{id}/decision
          - calculations.enforcement_severity_index
        distinguishing_aspect: |
          consistency_model is immediate, so a single DISAPPROVE call must leave every derived
          artefact readable in the very next request with no sweep and no clock movement: the
          notice, the ledger entry, both advertiser balances, the severity index, the minted
          enforcement action, the account status and the creative's serving gate. Deferring any
          of them to the sweep is the failure this claim catches.
        test_recipe:
          setup:
            - "Rule SEV_TWELVE (REGULATED, weight 12.00, requires_disclaimer false, auto 0.90, manual 0.20, default_queue STANDARD) with no country override."
            - "One verified advertiser, one creative submitted and screened at confidence 0.50, one reviewer on STANDARD authorised for US holding the task."
            - "The logical clock stays at 2026-08-01T00:00:00Z and POST /ad-policy/_policy-sweeps/run is never called in this recipe."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "SEV_TWELVE", title: "Twelve point category", category_class: "REGULATED", base_severity_weight: 12.00, requires_disclaimer: false, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.20, default_queue: "STANDARD" }
              as: PolicyAdmin
              captures: { r12: "$.data.id" }
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Beacon Lending Co", country_code: "US", industry_code: "CONSUMER_FINANCE" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "BUSINESS_STANDING", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/reviewers"
              payload: { display_name: "R. Alvarez", queue_specialties: ["STANDARD"], country_authorizations: ["US"], max_concurrent_claims: 3 }
              as: PolicyAdmin
              captures: { rev_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Twelve point offer", body_text: "One offer whose disapproval must be visible immediately.", declared_category_codes: ["SEV_TWELVE"], target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/twelve", display_url: "https://www.beaconlending.example/twelve" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${r12}", confidence: 0.50, matched_snippet: "twelve point claim" }], expected_ad_creative_version: "${cr_v}" }
              as: PolicyAdmin
            - call: "GET /ad-policy/review-tasks"
              payload: { ad_creative_id: "${cr_id}" }
              as: PolicyAdmin
              captures: { task_id: "$.data[0].id" }
            - call: "POST /ad-policy/review-tasks/${task_id}/claim"
              payload: {}
              as: PolicyReviewer
              as_user_id: "${rev_id}"
          trigger:
            - call: "POST /ad-policy/review-tasks/${task_id}/decision"
              payload: { resolution: "DISAPPROVE", reason_codes: ["MANUAL_REVIEW"], note: "Unsubstantiated savings claim" }
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "GET /ad-policy/disapproval-notices"
              payload: { ad_creative_id: "${cr_id}" }
              as: PolicyAdmin
              captures: { notice_id: "$.data[0].id" }
            - call: "GET /ad-policy/advertisers/${adv_id}"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/advertisers/${adv_id}/violation-ledger-entries"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/enforcement-actions"
              payload: { advertiser_id: "${adv_id}" }
              as: PolicyAdmin
            - call: "GET /ad-policy/ad-creatives/${cr_id}"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/reviewers/${rev_id}"
              payload: {}
              as: PolicyAdmin
          assert:
            - "The decision response itself already reports ReviewTask.status RESOLVED with resolution DISAPPROVE and resolved_at 2026-08-01T00:00:00Z"
            - "The very next read finds DisapprovalNotice.${notice_id} in status ISSUED with assessed_points 12.00, reason_codes [MANUAL_REVIEW] and appeal_deadline_at 2026-08-04T00:00:00Z — no sweep was run"
            - "The advertiser already reports violation_points_raw 12.00, violation_points_decayed 12.00, severity_index 12.00 and account_status WARNED, and the ledger already holds one entry with entry_index 1 and delta_points 12.00"
            - "One EnforcementAction already exists with action_type WARNING, origin CASCADE, status ACTIVE and effective window 2026-08-01T00:00:00Z to 2026-08-31T00:00:00Z"
            - "AdCreative.${cr_id} already reports review_status DISAPPROVED, serving_eligible false and blocking_reason_codes [REVIEW_NOT_APPROVED, DESTINATION_NOT_CLEARED], and Reviewer.${rev_id}.claimed_task_count is already back to 0"

      - name: immediate_consistency_a_granted_appeal_is_reconciled_within_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/ad-policy/appeals/{id}/decision
        excluded_because:
          difficulty_instance: compensating_invariant / granted_appeal_conserves_the_violation_point_balance_back_to_zero
          rationale: "That instance reads the reversed ledger, the restored balances, the lifted enforcement and the reinstated creative immediately after the GRANTED decision, with no sweep in between."
