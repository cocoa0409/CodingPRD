          assert:
            - "before the trigger: PulpBatch.${pb_id}.final_accepted_tons == 25.500, provisional_accepted_tons == 25.050, yield_variance_tons == 0.450, consumed_tons == 0.000, available_tons == 25.500"
            - "after the start call: PulpBatch.${pb_id}.consumed_tons == 12.000 AND available_tons == 13.500, so final_accepted_tons still equals consumed_tons + available_tons"
            - "after the start call: FiberInventoryLot.${lot_id}.tons_consumed == 30.000 AND tons_available == 6.000 AND status == AVAILABLE"
            - "the first GET /mill/fiber-balance returns total_received_tons == 36.000, total_consumed_tons == 30.000, total_available_tons == 6.000, imbalance_tons == 0.000"
            - "the abort call returns HTTP 200 and ProductionRun.${run_id}.run_status == ABORTED AND quality_status == CONDEMNED"
            - "after the abort call: PulpBatch.${pb_id}.consumed_tons == 0.000 AND available_tons == 25.500 AND final_accepted_tons == 25.500 (unchanged), so the batch ledger closes again"
            - "after the abort call: FiberInventoryLot.${lot_id}.tons_consumed == 30.000 AND tons_available == 6.000 — the abort must not credit the lot"
            - "the second GET /mill/fiber-balance is identical to the first: 36.000 / 30.000 / 6.000 / 0.000"
            - "PulpBatch.${pb_id}.status is still APPROVED, so the returned pulp is drawable by a later run"

      - name: solids_net_tonnage_conserved_across_manifest_sign_then_void
        grounds:
          - calculations.solids_ledger_balance
          - endpoints.POST_sludge_manifest_sign
          - endpoints.POST_sludge_manifest_void
          - entities.RejectStream.fields.manifest_id
          - validations.priority_35
          - errors.ERR_ENV_RECORD_INVALID_STATE
        distinguishing_aspect: |
          Conserved quantity: net_solids_tons across the SIGN / VOID compensating pair. Signing
          must move the 4.500-ton PULP_REJECT row from the unmanifested bucket to the manifested
          bucket without altering gross, reversed or net; voiding must move it back and clear
          manifest_id. gross_solids_tons and net_solids_tons therefore read 4.500 at all three
          observations while manifested and unmanifested swap 0.000/4.500 -> 4.500/0.000 ->
          0.000/4.500. An implementation that subtracts manifested tonnage from the ledger reports
          net 0.000 after signing, and one that leaves manifest_id set after voiding double-counts.
        test_recipe:
          setup:
            - "Same fiber fixture: one lot of 36.00 tons at 2.50 contamination; a PulpBatch charges 30.000 tons."
            - "The batch is screened and cleaned with measured_reject_tons 4.500 (well inside the 40% ceiling of 12.000 at priority 61), which appends the mill's only RejectStream row: source_kind PULP_REJECT, dry_solids_tons 4.500, disposition PENDING, manifest_id null."
            - "The manifest is prepared by env_prep and signed by env_sign, satisfying the segregation rule on signed_by_user_id; destination LANDFILL avoids the LAND_APPLICATION posture gate entirely."
          setup_api_calls:
            - { call: "POST /fiber-grades", payload: { grade_code: "MIX_54", index_symbol: "PPI_OCC", max_contamination_pct: 6.00, max_moisture_pct: 14.00, nominal_yield_pct: 78.00, deink_required: false, rank_order: 5 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-grades", payload: { grade_code: "OCC_11", index_symbol: "PPI_OCC", max_contamination_pct: 3.00, max_moisture_pct: 12.00, nominal_yield_pct: 88.00, deink_required: false, downgrade_target_grade_code: "MIX_54", rank_order: 1 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /paper-grade-specs", payload: { product_code: "TL_140", family: "CONTAINERBOARD", basis_weight_gsm: 140.0, target_moisture_pct: 7.50, moisture_tolerance_pct: 0.80, min_sct_kn_m: 2.20, requires_deink_pulp: false, rank_order: 10 }, as: MillPlanner, as_user_id: "mp_1" }
            - { call: "POST /market-index-quotes", payload: { index_symbol: "PPI_OCC", effective_month: "2026-07", published_price_per_ton: 190.00 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /suppliers", payload: { name: "Riverbend Fiber", freight_per_ton: 22.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { sup_id: "$.data.id" } }
            - { call: "POST /fiber-purchase-orders", payload: { supplier_id: "${sup_id}", fiber_grade_code: "OCC_11", contracted_tons: 200.00, index_basis: "PRIOR_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 0.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { po_id: "$.data.id", po_v1: "$.data.version" } }
            - { call: "POST /fiber-purchase-orders/${po_id}/price", payload: { expected_purchase_order_version: "${po_v1}" }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-purchase-orders/${po_id}/confirm", payload: {}, as: Supplier, as_user_id: "${sup_id}" }
            - { call: "POST /fiber-purchase-orders/${po_id}/receipts", payload: { truck_reference: "TRK-C-003", sublots: [ { sublot_no: 1, gross_tons: 20.000, tare_tons: 2.000, moisture_pct: 12.00, contamination_pct: 2.50 }, { sublot_no: 2, gross_tons: 20.000, tare_tons: 2.000, moisture_pct: 12.00, contamination_pct: 2.50 } ] }, as: QualityLab, as_user_id: "ql_sample", captures: { rcpt_id: "$.data.id" } }
            - { call: "POST /fiber-receipts/${rcpt_id}/disposition", payload: { disposition: "ACCEPT" }, as: QualityLab, as_user_id: "ql_dispo" }
            - { call: "GET /fiber-inventory-lots", payload: { receipt_id: "${rcpt_id}" }, as: MachineOperator, as_user_id: "mo_1", captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /pulp-batches", payload: { pulper_line: "OCC_LINE", target_product_code: "TL_140", furnish_lines: [ { inventory_lot_id: "${lot_id}", tons_charged: 30.000 } ] }, as: MachineOperator, as_user_id: "mo_1", captures: { pb_id: "$.data.id" } }
            - { call: "POST /pulp-batches/${pb_id}/start", payload: {}, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "POST /pulp-batches/${pb_id}/screen", payload: {}, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "POST /pulp-batches/${pb_id}/clean", payload: { measured_reject_tons: 4.500 }, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "GET /reject-streams", payload: { source_ref_id: "${pb_id}", source_kind: "PULP_REJECT" }, as: EnvironmentalOfficer, as_user_id: "env_prep", captures: { rs_id: "$.data[0].id" } }
            - { call: "POST /sludge-manifests", payload: { manifest_number: "MAN-0001", destination: "LANDFILL", reject_stream_ids: [ "${rs_id}" ] }, as: EnvironmentalOfficer, as_user_id: "env_prep", captures: { man_id: "$.data.id" } }
          trigger:
            - { call: "GET /reject-streams/summary", payload: {}, as: EnvironmentalOfficer, as_user_id: "env_prep" }
            - { call: "POST /sludge-manifests/${man_id}/sign", payload: {}, as: EnvironmentalOfficer, as_user_id: "env_sign" }
            - { call: "GET /reject-streams/summary", payload: {}, as: EnvironmentalOfficer, as_user_id: "env_prep" }
            - { call: "POST /sludge-manifests/${man_id}/void", payload: {}, as: EnvironmentalOfficer, as_user_id: "env_sign" }
            - { call: "GET /reject-streams/summary", payload: {}, as: EnvironmentalOfficer, as_user_id: "env_prep" }
            - { call: "POST /sludge-manifests/${man_id}/sign", payload: {}, as: EnvironmentalOfficer, as_user_id: "env_sign" }
          assert:
            - "SludgeManifest.${man_id}.total_dry_solids_tons == 4.500 AND status == DRAFT AND prepared_by_user_id == \"env_prep\" while the claimed row stays PENDING with manifest_id null"
            - "the first GET /reject-streams/summary returns gross_solids_tons 4.500, reversed_solids_tons 0.000, net_solids_tons 4.500, manifested_dry_solids_tons 0.000, unmanifested_dry_solids_tons 4.500, repulped_dry_solids_tons 0.000"
            - "the sign call returns HTTP 200 with SludgeManifest.${man_id}.status == SIGNED and signed_by_user_id == \"env_sign\""
            - "after signing, RejectStream.${rs_id}.disposition == MANIFESTED AND manifest_id == ${man_id}"
            - "the second GET /reject-streams/summary returns gross 4.500, reversed 0.000, net 4.500, manifested 4.500, unmanifested 0.000, repulped 0.000 — net is unchanged by signing"
            - "the void call returns HTTP 200 with SludgeManifest.${man_id}.status == VOIDED"
            - "after voiding, RejectStream.${rs_id}.disposition == PENDING AND manifest_id == null"
            - "the third GET /reject-streams/summary is byte-identical to the first: 4.500 / 0.000 / 4.500 / 0.000 / 4.500 / 0.000"
            - "the final sign call returns HTTP 409 with data.error_id == \"ERR_ENV_RECORD_INVALID_STATE\" (sign demands DRAFT), so a voided manifest cannot re-claim the tonnage"
            - "SludgeManifest.${man_id}.total_dry_solids_tons is still 4.500 after the void — the claim amount is history, not a live balance"

      - name: solids_split_identity_holds_across_reject_reversal
        grounds:
          - calculations.solids_ledger_balance
          - endpoints.POST_reject_stream_reverse
          - entities.RejectStream.fields.reversal_of_id
          - validations.priority_24
          - validations.priority_35
          - errors.ERR_REJECT_STREAM_REFERENCE_INVALID
        distinguishing_aspect: |
          Conserved quantity: the ledger SPLIT IDENTITY
          net_solids_tons == manifested_dry_solids_tons + unmanifested_dry_solids_tons, which must
          survive a reversal that deliberately changes net. Reversing the 6.000-ton row appends a
          negative twin and flips the original to REPULPED, so it leaves both buckets at once:
          gross stays 8.500, reversed becomes 6.000, net falls to 2.500 and unmanifested falls to
          2.500 while repulped shows 6.000. Because REPULPED tonnage sits in neither bucket, the
          identity closes only if the reversal row is excluded from gross and the original is
          excluded from unmanifested; reversing twice or manifesting the negative twin would break
          it, and both are refused with different error ids.
        test_recipe:
          setup:
            - "Same fiber fixture: one lot of 36.00 tons at 2.50 contamination."
            - "Batch A charges 20.000 tons and is cleaned with measured_reject_tons 6.000; batch B charges the remaining 16.000 tons (the inclusive depletion case) and is cleaned with measured_reject_tons 2.500."
            - "The mill's solids ledger therefore holds exactly two PENDING PULP_REJECT rows totalling 8.500 tons and no manifest exists."
          setup_api_calls:
            - { call: "POST /fiber-grades", payload: { grade_code: "MIX_54", index_symbol: "PPI_OCC", max_contamination_pct: 6.00, max_moisture_pct: 14.00, nominal_yield_pct: 78.00, deink_required: false, rank_order: 5 }, as: FiberBuyer, as_user_id: "fb_1" }
