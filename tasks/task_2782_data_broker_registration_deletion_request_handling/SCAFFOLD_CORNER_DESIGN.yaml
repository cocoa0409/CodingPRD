              as_user_id: "reviewer-alpha"
              expect_error: { error_id: ERR_ASSURANCE_BELOW_THRESHOLD, http_status: 422 }
          assert:
            - "the response carries data.error_id == ERR_ASSURANCE_BELOW_THRESHOLD with HTTP 422"
            - "DeletionRequest.${req_id}.status == VERIFICATION_PENDING"
            - "DeletionRequest.${req_id}.identity_assurance_score == 45.50"
            - "DeletionRequest.${req_id}.verification_decided_by_user_id == null"
            - "GET /brokers/${broker_id}/audit-events?event_type=VERIFICATION_DECIDED reports total_count == 0"

      - name: missing_required_disclosure_outranks_completeness_and_fee_shortfalls
        claim_type: priority_ordering
        grounds:
          - validations.priority_41.ERR_REQUIRED_DISCLOSURE_MISSING
          - validations.priority_50.ERR_DISCLOSURE_INCOMPLETE
          - validations.priority_70.ERR_FILING_FEE_UNPAID
        distinguishing_aspect: >
          A submit that violates three rules at once — OPT_OUT_MECHANISM absent (41), completeness
          only 60.00 against the 80.00 floor (50) and fee_credit_cents 0 against a 45200-cent
          provisional fee (70) — must return the lowest-numbered rule's error,
          ERR_REQUIRED_DISCLOSURE_MISSING at HTTP 422, and neither of the other two codes.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one DataBroker operating in CA that has made no fee deposit, so fee_credit_cents is 0."
            - "One DRAFT CA Registration carrying full-length SOURCES, RECIPIENTS and RETENTION disclosures and no OPT_OUT_MECHANISM item, so disclosure_completeness_score is 60.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Silverleaf Data Exchange", primary_contact_email: "compliance@silverleaf.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Resells licensed automotive and household ownership attributes to lead generators." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id, broker_v1: $.data.version }
            - call: "POST /registrations"
