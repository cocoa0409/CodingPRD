    description: "Soft-delete (archive) a plan."
    roles: [Dispatcher]
    code: 200
    input: []
    output: ServicePlan
    side_effects: ["set archived = true", "increments ServicePlan.version by 1"]
  - method: POST
    path: "/collection-zones"
