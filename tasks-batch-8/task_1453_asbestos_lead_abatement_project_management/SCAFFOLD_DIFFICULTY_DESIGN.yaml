            - { call: "POST /abatement/notifications/${n_id}/acknowledge", payload: {}, as: RegulatorClerk, as_user_id: "reg_1" }
            - { call: "POST /abatement/assignments", payload: { project_id: "${p_id}", worker_id: "${w_sup}", role_on_site: "SUPERVISOR", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }, as: Supervisor, as_user_id: "${w_sup}" }
