  - rule_id: boundary_precision_check
    instances:
      - name: storage_fee_free_day_boundary
        grounds:
          - calculations.storage_fee_accrual
          - entities.DeliveryLoad.fields.storage_fee_cents
        distinguishing_aspect: |
          Metric: whole storage days against customer.storage_free_days on the CLOSED
          transition. Load X staged 2026-08-19 and dispatched 2026-08-21 stores exactly
          2 days == free_days -> fee exactly 0 (>= does not trigger); load Y staged
          2026-08-18 stores 3 days -> exactly one daily fee 15000. One day of staging
          separates 0 from 15000.
        test_recipe:
          setup:
            - "Production preamble through bat1 STAGED (design TR-01, cl1 198.67 bf / 280 plates, reservations, slot A completed)"
            - "Load X and load Y both scheduled 2026-08-21 (max_drops_per_day 2 not exceeded), each with a LOAD_PICK slot on CR-HEAVY (X: 09:00-10:00, Y: 10:30-11:30 on 2026-08-20) and a 3000-lb bundle referencing bat1"
