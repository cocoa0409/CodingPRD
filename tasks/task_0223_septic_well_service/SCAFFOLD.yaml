# =============================================================================
# Septic & Well Service — benchmark seed tables (SCAFFOLD.yaml, §1.0–§1.7)
# =============================================================================

scenario: |
  Septic & Well Service: customer/site tank profile, pumping schedule
  (gallons/frequency), inspection/compliance report, emergency call,
  parts/repair, county permit filing, route optimization, recurring reminder

domain_name: septic-well-service

# Flat topology: Account, Technician, Site, Asset, ServicePlan, WorkOrder, Route,
# InspectionReport, PermitFiling, RepairLine, Reminder are peer collections linked
# by foreign keys. api_prefix is empty because no single resource owns all paths.
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency        # OCC on Site.version for service-plan supersede
    - cascading_side_effects        # account-hold cascade, completion -> reminder cascade
    - dual_variant_calculation      # pumping cost estimate vs final; site risk provisional vs final
    - derived_field_reconciliation  # Site.next_pump_due_date, Route stop/minute counters

  entity_topology: flat
  state_machine_shape: cyclic       # PermitFiling resubmission loop; WorkOrder revert
  relationship_patterns:
    - one_to_many                   # Account->Site, Site->WorkOrder, Route->WorkOrder
    - cross_aggregate               # PermitFiling references InspectionReport + Site

  role_model: peer_roles            # Dispatcher, FieldTech, ComplianceOfficer, Account-customer
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Customer / account name" }
      - { name: billing_email, type: string, source: input, description: "Billing contact email" }
      - { name: standing, type: enum, source: system, default: GOOD, description: "GOOD | HOLD — HOLD blocks scheduling new work and cascades cancellations", constraints: "GOOD, HOLD" }
      - { name: outstanding_balance_cents, type: integer, source: system, default: 0, description: "Sum of unpaid completed work-order invoice_total_cents; recomputed on completion and on payment" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Technician full name" }
      - { name: shift_start_minute, type: integer, source: input, description: "Daily shift window start, minutes from 00:00 local (e.g. 480 = 08:00)", constraints: "0..1440" }
      - { name: shift_end_minute, type: integer, source: input, description: "Daily shift window end, minutes from 00:00 local; must be > shift_start_minute", constraints: "0..1440" }
      - { name: certified_for_wells, type: boolean, source: input, default: false, description: "Whether technician may service WELL assets / well inspections" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED — SUSPENDED technicians cannot be dispatched", constraints: "ACTIVE, SUSPENDED" }

  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; owning account" }
      - { name: address, type: string, source: input, description: "Service street address" }
      - { name: county_code, type: string, source: input, description: "County jurisdiction code used for permit filing, e.g. 'KING'" }
      - { name: service_minutes, type: integer, source: input, default: 60, description: "Default on-site service duration in minutes used for scheduling windows", constraints: ">= 15" }
      - { name: compliance_status, type: enum, source: system, default: UNKNOWN, description: "UNKNOWN | COMPLIANT | CONDITIONAL | NON_COMPLIANT — derived from latest finalized InspectionReport and permit outcome", constraints: "UNKNOWN, COMPLIANT, CONDITIONAL, NON_COMPLIANT" }
      - { name: risk_score, type: integer, source: computed, default: 0, description: "Compliance risk score 0..100; provisional at report finalize, final after permit decision (see calc site_risk_score)" }
      - { name: last_pumped_date, type: datetime, source: system, description: "ISO date of most recent completed PUMPING work order; null until first pump" }
      - { name: next_pump_due_date, type: datetime, source: computed, description: "last_pumped_date + active ServicePlan.frequency_months; null when no plan or never pumped" }

  - name: Asset
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; site this asset belongs to" }
      - { name: asset_type, type: enum, source: input, description: "SEPTIC_TANK | WELL", constraints: "SEPTIC_TANK, WELL" }
      - { name: capacity_gallons, type: integer, source: input, description: "Tank capacity in gallons (SEPTIC_TANK); well depth proxy ignored for WELL pricing", constraints: "> 0" }
      - { name: install_year, type: integer, source: input, description: "Year of installation" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DECOMMISSIONED", constraints: "ACTIVE, DECOMMISSIONED" }

  - name: ServicePlan
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; site this recurring plan covers" }
      - { name: frequency_months, type: integer, source: input, description: "Pumping cadence in months (e.g. 36)", constraints: "1..120" }
      - { name: estimated_gallons, type: integer, source: input, description: "Estimated gallons pumped per visit, used for cost estimate", constraints: "> 0" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUPERSEDED — only one ACTIVE plan per site; a new ACTIVE plan supersedes the prior", constraints: "ACTIVE, SUPERSEDED" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; site to be serviced" }
      - { name: route_id, type: string, source: system, required: false, description: "FK -> Route.id; set when assigned to a route, cleared on unassign/cancel" }
      - { name: technician_id, type: string, source: system, required: false, description: "FK -> Technician.id; set on dispatch, cleared on revert/cancel" }
      - { name: work_type, type: enum, source: input, description: "PUMPING | INSPECTION | EMERGENCY | REPAIR", constraints: "PUMPING, INSPECTION, EMERGENCY, REPAIR" }
      - { name: scheduled_date, type: datetime, source: input, description: "ISO date (YYYY-MM-DD) the visit is scheduled for" }
      - { name: window_start_minute, type: integer, source: input, description: "Planned arrival window start, minutes from 00:00 local", constraints: "0..1440" }
      - { name: estimated_gallons, type: integer, source: input, required: false, description: "Estimated pump volume; defaults from site ACTIVE ServicePlan for PUMPING when omitted" }
      - { name: measured_gallons, type: integer, source: input, required: false, description: "Actual gallons pumped, supplied at completion for PUMPING/EMERGENCY" }
      - { name: emergency_surcharge_applies, type: boolean, source: system, default: false, description: "True for EMERGENCY work_type; drives surcharge in cost calc" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SCHEDULED | DISPATCHED | IN_PROGRESS | COMPLETED | CANCELLED", constraints: "DRAFT, SCHEDULED, DISPATCHED, IN_PROGRESS, COMPLETED, CANCELLED" }
      - { name: billing_status, type: enum, source: system, default: UNBILLED, description: "UNBILLED | INVOICED | PAID — independent state axis that evolves alongside status (parallel dimensions on one row)", constraints: "UNBILLED, INVOICED, PAID" }
      - { name: estimated_cost_cents, type: integer, source: computed, default: 0, description: "Cost estimate computed at SCHEDULE from estimated_gallons (calc work_order_cost variant=estimate)" }
      - { name: final_cost_cents, type: integer, source: computed, default: 0, description: "Final cost computed at COMPLETE from measured_gallons + parts (calc work_order_cost variant=final)" }
      - { name: invoice_total_cents, type: integer, source: computed, default: 0, description: "Invoice total = final_cost_cents + parts rounded per calc invoice_total; 0 until INVOICED" }
      - { name: window_end_minute, type: integer, source: computed, description: "window_start_minute + Site.service_minutes; half-open occupation end for technician overlap" }

  - name: Route
    parent: null
    common_fields: true
    fields:
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; technician who runs this route" }
      - { name: route_date, type: datetime, source: input, description: "ISO date (YYYY-MM-DD) the route covers" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | LOCKED — LOCKED routes reject assignment changes", constraints: "OPEN, LOCKED" }
      - { name: assigned_stop_count, type: integer, source: computed, default: 0, description: "Count of WorkOrders with route_id==this.id and status IN {SCHEDULED, DISPATCHED}" }
      - { name: booked_minutes, type: integer, source: computed, default: 0, description: "Sum of (window_end_minute - window_start_minute) over WorkOrders with route_id==this.id and status IN {SCHEDULED, DISPATCHED}" }
      - { name: optimized_sequence, type: array, source: system, description: "Ordered list of work_order_ids after optimize, sorted by window_start_minute ASC then created_at ASC" }

  - name: InspectionReport
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; the COMPLETED INSPECTION work order this report documents" }
      - { name: result, type: enum, source: input, required: false, description: "PASS | CONDITIONAL | FAIL — set at finalize", constraints: "PASS, CONDITIONAL, FAIL" }
      - { name: defect_count, type: integer, source: input, default: 0, description: "Number of defects observed; feeds site risk score", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | FINALIZED — FINALIZED reports are immutable and unlock permit filing", constraints: "DRAFT, FINALIZED" }
      - { name: finalized_at, type: datetime, source: system, required: false, description: "ISO timestamp set at finalize; start of permit cooling-off window" }

  - name: PermitFiling
    parent: null
    common_fields: true
    fields:
      - { name: inspection_report_id, type: string, source: input, description: "FK -> InspectionReport.id; the FINALIZED report this filing is based on" }
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; site the permit covers" }
      - { name: county_code, type: string, source: system, description: "Copied from Site.county_code at creation" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | APPROVED | REJECTED — REJECTED returns to DRAFT for resubmission (cycle)", constraints: "DRAFT, SUBMITTED, APPROVED, REJECTED" }
      - { name: submission_count, type: integer, source: system, default: 0, description: "Number of times this filing has been SUBMITTED; increments each submit" }
      - { name: decision_reason, type: string, source: input, required: false, description: "County reason text supplied with approve/reject" }

  - name: RepairLine
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; the REPAIR work order this line belongs to" }
      - { name: part_name, type: string, source: input, description: "Part or labor line description" }
      - { name: quantity, type: integer, source: input, description: "Quantity of the line item", constraints: "> 0" }
      - { name: unit_price_cents, type: integer, source: input, description: "Per-unit price in cents", constraints: ">= 0" }
      - { name: tax_rate_bps, type: integer, source: input, default: 0, description: "Line tax rate in basis points (e.g. 825 = 8.25%)", constraints: "0..2000" }
      - { name: line_total_cents, type: integer, source: computed, description: "round_half_up(quantity * unit_price_cents * (1 + tax_rate_bps/10000)) per-line (calc invoice_total)" }

  - name: Reminder
    parent: null
    common_fields: false   # append-only event: carries only id, created_at
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; site this reminder targets" }
      - { name: reminder_type, type: enum, source: system, description: "PUMP_DUE | COMPLIANCE_OVERDUE", constraints: "PUMP_DUE, COMPLIANCE_OVERDUE" }
      - { name: due_date, type: datetime, source: system, description: "ISO date the reminder pertains to (Site.next_pump_due_date for PUMP_DUE)" }
      - { name: status, type: enum, source: input, default: PENDING, description: "PENDING | ACKNOWLEDGED | DISMISSED", constraints: "PENDING, ACKNOWLEDGED, DISMISSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Account
    field: standing
    initial_state: GOOD
    terminal_states: []
    transitions:
      - from: GOOD
        to: HOLD
        trigger: "POST /accounts/{id}/hold"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "CASCADE depth-3 root: every WorkOrder of this account's Sites in status IN {DRAFT, SCHEDULED, DISPATCHED} transitions to CANCELLED (see WorkOrder * -> CANCELLED system transition)."
          - "Each such WorkOrder cancellation, when route_id was set, itself triggers the Route counter recompute (assigned_stop_count, booked_minutes) — the next cascade hop."
          - "increments Account.version by 1"

      - from: HOLD
        to: GOOD
        trigger: "POST /accounts/{id}/release-hold"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "Account.standing set to GOOD; previously cancelled work orders are NOT auto-restored."
          - "increments Account.version by 1"

  - entity: Technician
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /technicians/{id}/suspend"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "DISPATCHED WorkOrders for this technician revert to SCHEDULED (technician_id cleared); Route counters unaffected because SCHEDULED is still counted."

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /technicians/{id}/reinstate"
        actor: Dispatcher
        preconditions: []
        side_effects: []

  - entity: WorkOrder
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /work-orders/{id}/schedule"
        actor: Dispatcher
        preconditions:
          - "Owning Site's Account.standing == GOOD (cross-entity, see validation priority 30)"
          - "route_id supplied references an OPEN Route"
          - "Route.technician overlap: half-open window [window_start_minute, window_end_minute) does not overlap any SCHEDULED/DISPATCHED WO on the same technician+date (resource_temporal_overlap technician)"
          - "Site day-buffer: no other SCHEDULED/DISPATCHED WO on the same Site within SITE_BUFFER_MINUTES of this window (resource_temporal_overlap site)"
        side_effects:
          - "route_id set; window_end_minute computed = window_start_minute + Site.service_minutes"
          - "estimated_gallons defaulted from Site ACTIVE ServicePlan.estimated_gallons when omitted and work_type==PUMPING"
          - "estimated_cost_cents computed (calc work_order_cost variant=estimate)"
          - "Route.assigned_stop_count and Route.booked_minutes recomputed (compensating_invariant route-stops, route-minutes)"

      - from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /work-orders/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "technician_id references Route.technician_id and Technician.status == ACTIVE (cross-entity)"
          - "WELL inspection/asset jobs require Technician.certified_for_wells == true"
        side_effects:
          - "technician_id set; Route counters unchanged (DISPATCHED still counted)."

      - from: DISPATCHED
        to: SCHEDULED
        trigger: "POST /work-orders/{id}/revert"
        actor: Dispatcher
        preconditions: ["Route.status == OPEN"]
        side_effects:
          - "technician_id cleared; WorkOrder returns to SCHEDULED (non-linear revert)."

      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/start"
        actor: FieldTech
        preconditions: ["acting Technician.id == WorkOrder.technician_id"]
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /work-orders/{id}/complete"
        actor: FieldTech
        preconditions:
          - "acting Technician.id == WorkOrder.technician_id"
          - "PUMPING/EMERGENCY require measured_gallons supplied (>= 0)"
        side_effects:
          - "final_cost_cents computed (calc work_order_cost variant=final)"
          - "invoice_total_cents computed = final_cost_cents + sum(RepairLine.line_total_cents) (calc invoice_total)"
          - "Route.assigned_stop_count and Route.booked_minutes recomputed (WO leaves SCHEDULED/DISPATCHED set)"
          - "CASCADE depth-2 (PUMPING/EMERGENCY): Site.last_pumped_date set to scheduled_date; Site.next_pump_due_date recomputed; that recompute itself emits a Reminder(reminder_type=PUMP_DUE, due_date=next_pump_due_date) — the next cascade hop."

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: Dispatcher
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel  (or system: Account hold cascade)"
        actor: "Dispatcher | system"
        preconditions: []
        side_effects:
          - "route_id and technician_id cleared; Route.assigned_stop_count and Route.booked_minutes recomputed (compensating_invariant)."

      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel  (or system: Account hold cascade)"
        actor: "Dispatcher | system"
        preconditions: []
        side_effects:
          - "route_id and technician_id cleared; Route.assigned_stop_count and Route.booked_minutes recomputed (compensating_invariant)."

  - entity: WorkOrder
    field: billing_status
    initial_state: UNBILLED
    terminal_states: [PAID]
    transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "POST /work-orders/{id}/invoice"
        actor: Dispatcher
        preconditions: ["WorkOrder.status == COMPLETED"]
        side_effects:
          - "invoice_total_cents frozen onto invoice; Account.outstanding_balance_cents increased by invoice_total_cents."

      - from: INVOICED
        to: PAID
        trigger: "POST /work-orders/{id}/pay"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "Account.outstanding_balance_cents decreased by invoice_total_cents."

  - entity: InspectionReport
    field: status
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /inspection-reports/{id}/finalize"
        actor: ComplianceOfficer
        preconditions:
          - "result supplied (PASS | CONDITIONAL | FAIL)"
          - "linked WorkOrder.status == COMPLETED and work_type == INSPECTION (cross-entity, PermitFiling/InspectionReport->WorkOrder)"
        side_effects:
          - "finalized_at set; Site.compliance_status set from result (PASS->COMPLIANT, CONDITIONAL->CONDITIONAL, FAIL->NON_COMPLIANT)."
          - "Site.risk_score recomputed provisionally (calc site_risk_score variant=provisional)."

  - entity: PermitFiling
    field: status
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /permit-filings/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "linked InspectionReport.status == FINALIZED (cross-entity)"
          - "Site.compliance_status != NON_COMPLIANT (business_safety, see validation priority 41)"
          - "cooling-off elapsed: current clock >= InspectionReport.finalized_at + COOLING_OFF_HOURS"
        side_effects:
          - "submission_count incremented by 1; county_code copied from Site if not already set."

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /permit-filings/{id}/decide  (decision=APPROVE)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Site.compliance_status set to COMPLIANT; Site.risk_score recomputed final (calc site_risk_score variant=final)."

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /permit-filings/{id}/decide  (decision=REJECT)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "decision_reason stored; Site.risk_score recomputed final with rejection penalty (calc site_risk_score variant=final)."

      - from: REJECTED
        to: DRAFT
        trigger: "POST /permit-filings/{id}/reopen"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Filing returns to DRAFT for resubmission (cyclic loop REJECTED->DRAFT->SUBMITTED)."

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent version — true races only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: plan-create-stale-site
    parent_entity: Site
    write_endpoint: "POST /service-plans"
    occ_field: "expected_site_version"
    description: |
      Creating a ServicePlan supersedes the Site's prior ACTIVE plan. A create
      carrying a Site version older than the Site's current version is rejected:
      another writer has already created a plan that legitimately superseded the
      prior, so this writer's view of the Site is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: work_order_cost
    trigger: "WorkOrder schedule (estimate) and complete (final)"
    algorithm: tiered_pricing
    formula: |
      gallons = (variant==estimate) ? estimated_gallons : measured_gallons
      # Tiered base: first BASE_INCLUDED_GALLONS at TIER1_RATE_CENTS/gal,
      # the remainder (overage) at TIER2_RATE_CENTS/gal.
      tier1_gallons = min(gallons, BASE_INCLUDED_GALLONS)
      overage_gallons = max(gallons - BASE_INCLUDED_GALLONS, 0)
      pump_cents = tier1_gallons*TIER1_RATE_CENTS + overage_gallons*TIER2_RATE_CENTS
      cents = TRIP_FEE_CENTS + pump_cents
      if emergency_surcharge_applies: cents = cents + round_half_up(cents * EMERGENCY_SURCHARGE_BPS / 10000)
      # estimate writes estimated_cost_cents; final writes final_cost_cents.
    input_set: "Single WorkOrder; PUMPING and EMERGENCY use gallons; INSPECTION/REPAIR use TRIP_FEE_CENTS only (gallons=0)."
    constants:
      TRIP_FEE_CENTS: 9000
      BASE_INCLUDED_GALLONS: 1000
      TIER1_RATE_CENTS: 25
      TIER2_RATE_CENTS: 40
      EMERGENCY_SURCHARGE_BPS: 5000
    precision: "integer cents, round_half_up on surcharge"
    variants:
      - name: estimate
        when: "at SCHEDULE, gallons = estimated_gallons (from input or Site ACTIVE ServicePlan)"
        difference: "writes estimated_cost_cents; emergency_surcharge_applies is false for PUMPING, true for EMERGENCY"
      - name: final
        when: "at COMPLETE, gallons = measured_gallons supplied by FieldTech"
        difference: "writes final_cost_cents; uses actual measured gallons, so overage tier can diverge from the estimate"

  - name: site_risk_score
    trigger: "InspectionReport finalize (provisional) and PermitFiling decide (final)"
    algorithm: weighted_scoring
    formula: |
      base = RESULT_WEIGHT[result]            # PASS:0, CONDITIONAL:30, FAIL:60
      defect_component = min(defect_count * DEFECT_WEIGHT, DEFECT_CAP)
      age_component = (current_year - newest_asset_install_year >= OLD_ASSET_YEARS) ? AGE_PENALTY : 0
      raw = base + defect_component + age_component
      score = max(0, min(100, raw))
      # newest_asset_install_year = max(Asset.install_year) over Site Assets with status==ACTIVE.
    input_set: "Latest FINALIZED InspectionReport.result + defect_count for the Site; ACTIVE Assets on the Site."
    constants:
      RESULT_WEIGHT: { PASS: 0, CONDITIONAL: 30, FAIL: 60 }
      DEFECT_WEIGHT: 8
      DEFECT_CAP: 24
      OLD_ASSET_YEARS: 25
      AGE_PENALTY: 15
      REJECTION_PENALTY: 20
    precision: "integer 0..100"
    variants:
      - name: provisional
        when: "at InspectionReport finalize"
        difference: "computed from report only; no permit outcome term"
      - name: final
        when: "at PermitFiling decide"
        difference: "APPROVE clamps score to max(0, score - APPROVE_RELIEF) with APPROVE_RELIEF=base; REJECT adds REJECTION_PENALTY then clamps to 0..100"

  - name: invoice_total
    trigger: "WorkOrder complete and invoice"
    algorithm: aggregation
    formula: |
      # ORDER PINNED: round each RepairLine FIRST, then sum (round-per-line-then-sum).
      for each RepairLine of the WorkOrder (created_at ASC):
        line_total_cents = round_half_up(quantity * unit_price_cents * (1 + tax_rate_bps/10000))
      parts_total = sum(line_total_cents)        # sum of already-rounded line totals
      invoice_total_cents = final_cost_cents + parts_total
    input_set: "All RepairLines whose work_order_id == this WorkOrder.id (REPAIR work orders); empty set => parts_total=0."
    constants: {}
    precision: "integer cents, round_half_up per line BEFORE summation (not sum-then-round)"

  - name: route_optimize
    trigger: "POST /routes/{id}/optimize"
    algorithm: chronological
    formula: |
      candidates = WorkOrders with route_id==route.id and status IN {SCHEDULED, DISPATCHED}
      optimized_sequence = candidates sorted by window_start_minute ASC, tie-break created_at ASC
      # No id-based ordering anywhere; created_at is the only tie-break.
    input_set: "SCHEDULED/DISPATCHED WorkOrders on the route; empty set => optimized_sequence=[]"
    constants: {}
    precision: "ordering only"

  - name: next_pump_due
    trigger: "WorkOrder complete (PUMPING/EMERGENCY) and ServicePlan create"
    algorithm: projection
    formula: |
      if Site has ACTIVE ServicePlan and last_pumped_date != null:
        next_pump_due_date = last_pumped_date + (ACTIVE ServicePlan.frequency_months months)
      else:
        next_pump_due_date = null
    input_set: "Site.last_pumped_date + the single ACTIVE ServicePlan on the Site."
    constants: {}
    precision: "calendar date; month arithmetic clamps to end-of-month"

  - name: compliance_temporal_gates
    trigger: "PermitFiling submit (cooling-off) and WorkOrder schedule (site buffer) — threshold constants used by validations priority 42 and 36"
    algorithm: threshold
    formula: |
      cooling_off_ok      = current_utc >= InspectionReport.finalized_at + COOLING_OFF_HOURS hours
      site_buffer_ok(a,b) = the gap between work-order windows a and b on the same Site+date is
                            >= SITE_BUFFER_MINUTES, where gap = (later.window_start_minute -
                            earlier.window_end_minute); windows are treated as closed and the
                            buffer is required between them (adjacency within the buffer fails).
    input_set: "Single PermitFiling + its FINALIZED InspectionReport.finalized_at; pairs of SCHEDULED/DISPATCHED WorkOrders on the same Site+date."
    constants:
      COOLING_OFF_HOURS: 48
      SITE_BUFFER_MINUTES: 120
    precision: "hours / minutes, integer comparison"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 10
    category: existence
    check: "Resource IDs in path exist (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 11
    category: business_referential
    check: "Foreign keys in body reference existing resources (account_id, site_id, work_order_id, inspection_report_id, technician_id, route_id)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 422
    applies_to: "all create endpoints with FK body fields"

  - priority: 12
    category: existence
    check: "Required body fields present and well-typed; enums in allowed set"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all create/transition endpoints

  - priority: 13
    category: business_constraint
    check: "Field-range invariants hold: Technician.shift_end_minute > shift_start_minute; Asset.capacity_gallons > 0; Site.service_minutes >= 15; RepairLine.quantity > 0; minutes in 0..1440"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "POST /technicians, POST /assets, POST /sites, POST /repair-lines, POST /work-orders"

  - priority: 20
    category: state
    check: "Target resource is in a state from which this transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 21
    category: state
    check: "FINALIZED InspectionReport / terminal WorkOrder is immutable"
    error_id: ERR_IMMUTABLE
    http_status: 409
    applies_to: "PATCH /inspection-reports/{id}, mutate terminal work orders"

  - priority: 25
    category: business_constraint
    check: "Route.status == OPEN for assignment/revert; LOCKED routes reject changes"
    error_id: ERR_ROUTE_LOCKED
    http_status: 409
    applies_to: "schedule, revert, optimize"

  - priority: 30
    category: business_constraint
    check: "Owning Site's Account.standing == GOOD when scheduling a work order (cross-entity WorkOrder->Account)"
    error_id: ERR_ACCOUNT_ON_HOLD
    http_status: 409
    applies_to: "POST /work-orders/{id}/schedule"

  - priority: 31
    category: business_constraint
    check: "Dispatch requires Technician.status == ACTIVE (cross-entity WorkOrder->Technician)"
    error_id: ERR_TECH_SUSPENDED
    http_status: 409
    applies_to: "POST /work-orders/{id}/dispatch"

  - priority: 32
    category: business_safety
    check: "WELL asset / well inspection dispatch requires Technician.certified_for_wells == true"
    error_id: ERR_TECH_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /work-orders/{id}/dispatch"

  - priority: 35
    category: business_temporal
    check: "Technician time-window overlap: half-open [window_start_minute, window_end_minute) must not overlap another SCHEDULED/DISPATCHED WO on same technician+date (resource_temporal_overlap technician)"
    error_id: ERR_TECH_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /work-orders/{id}/schedule"

  - priority: 36
    category: business_temporal
    check: "Site day-buffer overlap: window must be >= SITE_BUFFER_MINUTES away from any other SCHEDULED/DISPATCHED WO on same Site+date (closed interval + buffer; resource_temporal_overlap site)"
    error_id: ERR_SITE_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /work-orders/{id}/schedule"

  - priority: 37
    category: business_temporal
    check: "Technician window must fall within [shift_start_minute, shift_end_minute]"
    error_id: ERR_OUTSIDE_SHIFT
    http_status: 409
    applies_to: "POST /work-orders/{id}/schedule"

  - priority: 40
    category: business_referential
    check: "Permit submit requires linked InspectionReport.status == FINALIZED (cross-entity PermitFiling->InspectionReport)"
    error_id: ERR_REPORT_NOT_FINALIZED
    http_status: 409
    applies_to: "POST /permit-filings/{id}/submit"

  - priority: 41
    category: business_safety
    check: "Permit submit blocked when Site.compliance_status == NON_COMPLIANT"
    error_id: ERR_SITE_NON_COMPLIANT
    http_status: 409
    applies_to: "POST /permit-filings/{id}/submit"

  - priority: 42
    category: business_temporal
    check: "Permit submit blocked until cooling-off elapsed: clock >= finalized_at + COOLING_OFF_HOURS"
    error_id: ERR_COOLING_OFF
    http_status: 409
    applies_to: "POST /permit-filings/{id}/submit"

  - priority: 50
    category: business_constraint
    check: "PUMPING/EMERGENCY completion requires measured_gallons present and >= 0"
    error_id: ERR_MEASUREMENT_REQUIRED
    http_status: 422
    applies_to: "POST /work-orders/{id}/complete"

  - priority: 60
    category: business_constraint
    check: "OCC: expected_site_version must equal Site.version on service-plan create (a valid create supersedes the prior ACTIVE plan, so the only failure mode is a stale version)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /service-plans"

