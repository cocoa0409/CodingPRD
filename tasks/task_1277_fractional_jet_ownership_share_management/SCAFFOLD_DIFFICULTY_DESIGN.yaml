  # ==========================================================================
  # Rule 8 — resource_temporal_overlap: different interval semantics, different resources
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: aircraft_booking_half_open_adjacency
        grounds:
          - validations[priority=8]
          - errors[ERR_AIRCRAFT_WINDOW_CONFLICT]
          - endpoints: "POST /bookings/{id}/assign"
        distinguishing_aspect: |
          Interval semantics HALF-OPEN [start, end) on Aircraft booking
          windows: a booking window ending exactly at 15:00Z and another
          starting exactly at 15:00Z do NOT overlap (adjacent, gap=0 allowed),
          while a 1-minute-overlap case IS rejected. Resource: Aircraft.
        test_recipe:
          setup:
            - "Two owners each with ACTIVE 1/8 MID shares; tail N600HL; booking A [13:00,15:00) confirmed+assigned; booking B [15:00,17:30) confirmed; booking C [14:59,17:00) confirmed"
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "FJX-TO1", currency: "USD", contract_year_start_month: 8, peak_day_calendar: [] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /aircraft-classes"
              payload: { program_id: "${prog_id}", class_code: "MID", hourly_rate_cents: 450000, interchange_upgrade_multiplier_bp: 12500, monthly_fee_base_cents: 2500000, seats: 8 }
              as: ProgramAdmin
              captures: { cls_mid: $.data.id }
            - call: "POST /owners"
              payload: { program_id: "${prog_id}", legal_name: "TO1 OwnerA", initial_deposit_cents: 0 }
              as: ProgramAdmin
              captures: { own_a: $.data.id }
            - call: "POST /owners"
              payload: { program_id: "${prog_id}", legal_name: "TO1 OwnerB", initial_deposit_cents: 0 }
              as: ProgramAdmin
              captures: { own_b: $.data.id }
            - call: "POST /shares"
              payload: { owner_id: "${own_a}", class_id: "${cls_mid}", fraction_numerator: 1, fraction_denominator: 8, purchase_price_cents: 12000000, schedule_method: "STRAIGHT_LINE", recovery_years: 5 }
              as: ProgramAdmin
              captures: { sh_a: $.data.id }
            - call: "POST /shares"
              payload: { owner_id: "${own_b}", class_id: "${cls_mid}", fraction_numerator: 1, fraction_denominator: 8, purchase_price_cents: 12000000, schedule_method: "STRAIGHT_LINE", recovery_years: 5 }
              as: ProgramAdmin
              captures: { sh_b: $.data.id }
            - call: "POST /shares/${sh_a}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { sh_a_v: $.data.version }
            - call: "POST /shares/${sh_b}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { sh_b_v: $.data.version }
            - call: "POST /aircraft"
              payload: { program_id: "${prog_id}", tail_number: "N600HL", class_id: "${cls_mid}" }
              as: FleetOps
              captures: { tail_id: $.data.id }
            - call: "POST /bookings"
              payload: { share_id: "${sh_a}", requested_class_id: "${cls_mid}", scheduled_departure_utc: "2026-09-10T13:00:00Z", estimated_block_hours: 2.00, expected_share_version: "${sh_a_v}" }
              as: Owner
              as_user_id: "${own_a}"
              captures: { bk_a: $.data.id }
            - call: "POST /bookings/${bk_a}/confirm"
              payload: {}
              as: Owner
              as_user_id: "${own_a}"
            - call: "POST /bookings/${bk_a}/assign"
              payload: { aircraft_id: "${tail_id}" }
              as: FleetOps
            - call: "POST /bookings"
              payload: { share_id: "${sh_b}", requested_class_id: "${cls_mid}", scheduled_departure_utc: "2026-09-10T15:00:00Z", estimated_block_hours: 2.50, expected_share_version: "${sh_b_v}" }
              as: Owner
              as_user_id: "${own_b}"
              captures: { bk_b: $.data.id }
            - call: "POST /bookings/${bk_b}/confirm"
              payload: {}
              as: Owner
              as_user_id: "${own_b}"
          trigger:
            - call: "POST /bookings/${bk_b}/assign"
              payload: { aircraft_id: "${tail_id}" }
              as: FleetOps
              captures: { bk_b_status: $.data.booking_status }
            - call: "GET /shares/${sh_b}"
              payload: {}
              as: Owner
              as_user_id: "${own_b}"
              captures: { sh_b_v2: $.data.version }
            - call: "POST /bookings"
              payload: { share_id: "${sh_b}", requested_class_id: "${cls_mid}", scheduled_departure_utc: "2026-09-10T14:59:00Z", estimated_block_hours: 2.00, expected_share_version: "${sh_b_v2}" }
              as: Owner
              as_user_id: "${own_b}"
              captures: { bk_c: $.data.id }
            - call: "POST /bookings/${bk_c}/confirm"
              payload: {}
              as: Owner
              as_user_id: "${own_b}"
            - call: "POST /bookings/${bk_c}/assign"
              payload: { aircraft_id: "${tail_id}" }
              as: FleetOps
              captures: { err: $.data.error_id }
          assert:
            - "Booking B [15:00,17:30) assign SUCCEEDS — half-open adjacency to A [13:00,15:00) is not an overlap"
            - "Booking C [14:59,17:00) assign FAILS with ERR_AIRCRAFT_WINDOW_CONFLICT — 1-minute overlap with A"
            - "HTTP 409 on the overlapping assign"

      - name: maintenance_in_progress_singleton_per_aircraft
        grounds:
          - state_machines.MaintenanceEvent.SCHEDULED_to_IN_PROGRESS
          - errors[ERR_MAINTENANCE_OVERLAP]
        distinguishing_aspect: |
          Different interval semantics — AGGREGATE-CAPACITY singleton rather
          than geometric overlap: at most ONE IN_PROGRESS maintenance event per
          Aircraft regardless of whether the windows overlap. Two disjoint-
          window events on the same tail still collide on the capacity-1
          aggregate; resource is the same Aircraft but the rule is a count
          cap, not interval arithmetic.
        test_recipe:
          setup:
            - "Tail N700MX with two SCHEDULED maintenance events with DISJOINT windows (Sep and Oct)"
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "FJX-TO2", currency: "USD", contract_year_start_month: 8, peak_day_calendar: [] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /aircraft-classes"
              payload: { program_id: "${prog_id}", class_code: "MID", hourly_rate_cents: 450000, interchange_upgrade_multiplier_bp: 12500, monthly_fee_base_cents: 2500000, seats: 8 }
              as: ProgramAdmin
              captures: { cls_mid: $.data.id }
            - call: "POST /aircraft"
              payload: { program_id: "${prog_id}", tail_number: "N700MX", class_id: "${cls_mid}" }
              as: FleetOps
              captures: { tail_id: $.data.id }
            - call: "POST /maintenance-events"
              payload: { aircraft_id: "${tail_id}", window_start_utc: "2026-09-01T00:00:00Z", window_end_utc: "2026-09-05T00:00:00Z", cost_cents: 0, unscheduled_flag: false }
              as: FleetOps
              captures: { mx1: $.data.id }
            - call: "POST /maintenance-events"
              payload: { aircraft_id: "${tail_id}", window_start_utc: "2026-10-01T00:00:00Z", window_end_utc: "2026-10-05T00:00:00Z", cost_cents: 0, unscheduled_flag: false }
              as: FleetOps
              captures: { mx2: $.data.id }
          trigger:
            - call: "POST /maintenance-events/${mx1}/start"
              payload: {}
              as: FleetOps
            - call: "POST /maintenance-events/${mx2}/start"
              payload: {}
              as: FleetOps
              captures: { err: $.data.error_id }
          assert:
            - "First start succeeds (mx1 IN_PROGRESS)"
            - "Second start on DISJOINT window still fails with ERR_MAINTENANCE_OVERLAP — singleton capacity, not geometric overlap"
            - "HTTP 409"

  # ==========================================================================
  # Rule 9 — compensating_invariant: different conserved quantities
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: entitlement_hours_confirm_cancel_invariant
        grounds:
          - state_machines.BookingRequest.REQUESTED_to_CONFIRMED
          - state_machines.BookingRequest.CONFIRMED_to_CANCELLED
          - calculations.annual_entitlement_hours
        distinguishing_aspect: |
          Conserved quantity: Share.hours_remaining_cy. Forward confirm debits
          estimated_block_hours; compensating cancel re-credits exactly the
          same amount. Invariant: after confirm+cancel, hours_remaining_cy
          equals its pre-confirm value (100.00) to the cent-hour.
        test_recipe:
          setup:
            - "Owner with ACTIVE 1/8 MID share (100.00h); booking est 3.50h confirmed then cancelled"
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "FJX-CI1", currency: "USD", contract_year_start_month: 8, peak_day_calendar: [] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /aircraft-classes"
              payload: { program_id: "${prog_id}", class_code: "MID", hourly_rate_cents: 450000, interchange_upgrade_multiplier_bp: 12500, monthly_fee_base_cents: 2500000, seats: 8 }
              as: ProgramAdmin
              captures: { cls_mid: $.data.id }
            - call: "POST /owners"
              payload: { program_id: "${prog_id}", legal_name: "CI1 Owner", initial_deposit_cents: 0 }
              as: ProgramAdmin
              captures: { own_id: $.data.id }
            - call: "POST /shares"
              payload: { owner_id: "${own_id}", class_id: "${cls_mid}", fraction_numerator: 1, fraction_denominator: 8, purchase_price_cents: 12000000, schedule_method: "STRAIGHT_LINE", recovery_years: 5 }
              as: ProgramAdmin
              captures: { share_id: $.data.id }
            - call: "POST /shares/${share_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { share_v: $.data.version }
            - call: "POST /bookings"
              payload: { share_id: "${share_id}", requested_class_id: "${cls_mid}", scheduled_departure_utc: "2026-09-10T15:00:00Z", estimated_block_hours: 3.50, expected_share_version: "${share_v}" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /bookings/${bk_id}/confirm"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
            - call: "GET /shares/${share_id}"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { hours_mid: $.data.hours_remaining_cy }
            - call: "POST /bookings/${bk_id}/cancel"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
            - call: "GET /shares/${share_id}"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { hours_end: $.data.hours_remaining_cy }
          assert:
            - "After confirm: hours_remaining_cy == 96.50 (100.00 − 3.50)"
            - "After cancel: hours_remaining_cy == 100.00 — invariant restored exactly"
            - "INVARIANT: confirm(x) ∘ cancel(x) leaves Share.hours_remaining_cy unchanged"

      - name: deposit_balance_exit_settle_invariant
        grounds:
          - state_machines.ExitRequest.APPROVED_to_SETTLED
          - calculations.exit_buyout_formula
          - entities.Owner.fields.deposit_balance_cents
        distinguishing_aspect: |
          Conserved quantity: MONEY across the exit settlement — settlement_cents
          + retained_outstanding + deposit_consumed must equal buyout + deposit
          (no money created or destroyed). Different conserved quantity from
          hours: monetary cents. After settle: deposit_balance_cents == 0 and
          settlement_cents == buyout − outstanding + deposit exactly.
        test_recipe:
          setup:
            - "Owner with ACTIVE 1/8 MID share purchased 40000000, deposit 2000000; one PAID invoice (so outstanding == 0); contract_year_index 0 at 2026-08 (years_held=0)"
            - "Exit submitted, valued (buyout 26240000 = 32800000 − 6560000 penalty), approved, settled"
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "FJX-CI2", currency: "USD", contract_year_start_month: 8, peak_day_calendar: [] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /aircraft-classes"
              payload: { program_id: "${prog_id}", class_code: "MID", hourly_rate_cents: 450000, interchange_upgrade_multiplier_bp: 12500, monthly_fee_base_cents: 2500000, seats: 8 }
              as: ProgramAdmin
              captures: { cls_mid: $.data.id }
            - call: "POST /owners"
              payload: { program_id: "${prog_id}", legal_name: "CI2 Owner", initial_deposit_cents: 2000000 }
              as: ProgramAdmin
              captures: { own_id: $.data.id }
            - call: "POST /shares"
              payload: { owner_id: "${own_id}", class_id: "${cls_mid}", fraction_numerator: 1, fraction_denominator: 8, purchase_price_cents: 40000000, schedule_method: "STRAIGHT_LINE", recovery_years: 5 }
              as: ProgramAdmin
              captures: { share_id: $.data.id }
            - call: "POST /shares/${share_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /invoices"
              payload: { owner_id: "${own_id}", billing_period: "2026-08" }
              as: FinanceOps
              captures: { inv_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: FinanceOps
            - call: "POST /invoices/${inv_id}/pay"
              payload: { amount_cents: 312500 }
              as: Owner
              as_user_id: "${own_id}"
            - call: "POST /shares/${share_id}/exit"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { exit_id: $.data.id }
            - call: "POST /exit-requests/${exit_id}/value"
              payload: {}
              as: FinanceOps
              as_user_id: "finops-valuer-1"
            - call: "POST /exit-requests/${exit_id}/approve"
              payload: {}
              as: FinanceOps
              as_user_id: "finops-approver-1"
          trigger:
            - call: "POST /exit-requests/${exit_id}/settle"
              payload: {}
              as: FinanceOps
              as_user_id: "finops-approver-1"
              captures: { settlement: $.data.settlement_cents }
            - call: "GET /owners/${own_id}"
              payload: {}
              as: FinanceOps
              captures: { deposit_end: $.data.deposit_balance_cents }
            - call: "GET /shares/${share_id}"
              payload: {}
              as: FinanceOps
              captures: { share_status_end: $.data.share_status }
          assert:
            - "ExitRequest.${exit_id}.settlement_cents == 28240000 (buyout 26240000 − outstanding 0 + deposit 2000000)"
            - "Owner.${own_id}.deposit_balance_cents == 0 after settle (deposit fully consumed into settlement)"
            - "Share.${share_id}.share_status == CLOSED (cascade from SETTLED)"
            - "INVARIANT: settlement_cents + 0 outstanding retained == buyout 26240000 + deposit 2000000 − 0; no cents created or destroyed"
