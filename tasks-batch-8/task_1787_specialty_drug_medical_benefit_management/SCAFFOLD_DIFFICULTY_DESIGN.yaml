            - call: "POST /api/asp-schedules"
              payload: { drug_id: "${drug_id}", effective_start: "2026-01-01", asp_rate_cents: 500 }
              as: PlanAdmin
            - call: "POST /api/clinical-policies"
              payload: { drug_id: "${drug_id}", status: "ACTIVE", expected_drug_version: "${drug_ver}", covered_diagnoses: ["C50"], step_therapy_required: false, requires_site_of_care_redirection: false, biosimilar_substitution: "DISABLED" }
              as: MedicalPolicyOfficer
            - call: "POST /api/provider-accounts"
              payload: { name: "Gate Provider A" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /api/prior-authorizations"
              payload: { drug_id: "${drug_id}", member_id: "MEM-13", diagnosis_code: "C50", requested_start_date: "2026-08-01", requested_dose_mg: 100 }
              as: ProviderRep
              as_user_id: "${prov_id}"
              captures: { auth_id: $.data.id }
          trigger:
            - call: "POST /api/claims"
              payload: { auth_id: "${auth_id}", drug_id: "${drug_id}", service_date: "2026-08-01", site_of_care: "OFFICE", sourcing_path: "BUY_AND_BILL", j_code_billed: "J3200", billed_units: 10 }
              as: ProviderRep
              as_user_id: "${prov_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /api/prior-authorizations/${auth_id}/approve"
              payload: { max_administrations: 4 }
              as: MedicalPolicyOfficer
            - call: "POST /api/claims"
              payload: { auth_id: "${auth_id}", drug_id: "${drug_id}", service_date: "2026-08-01", site_of_care: "OFFICE", sourcing_path: "BUY_AND_BILL", j_code_billed: "J3200", billed_units: 10 }
              as: ProviderRep
              as_user_id: "${prov_id}"
              captures: { claim_id: $.data.id }
          assert:
            - "While auth is SUBMITTED: error_id == ERR_AUTH_NOT_APPROVED (409)"
            - "After auth approval: identical claim -> 201, InfusionClaim.${claim_id}.status == APPROVED_FOR_PAYMENT, allowed_amount_cents == 5300"

      - name: approve_gated_by_clinical_policy_state
        grounds:
          - state_machines.PriorAuthorization.SUBMITTED_to_APPROVED
          - validations[priority=5.5]
          - errors[ERR_NO_ACTIVE_POLICY]
        distinguishing_aspect: |
          Entity pair (PriorAuthorization -> ClinicalPolicy) — different pair than
          claim_gated_by_auth_state: auth approval is gated on the drug having an
          ACTIVE clinical policy; with only a DRAFT policy the approval fails, and
          after activation (OCC-guarded) it succeeds.
        test_recipe:
          setup:
            - "Drug with a ClinicalPolicy created as DRAFT (never activated); auth SUBMITTED against the drug"
          setup_api_calls:
            - call: "POST /api/drugs"
              payload: { j_code: "J3300", drug_name: "GateDrugB", billing_unit_mg: 10, vial_size_mg: 100, single_dose_vial: true, sourcing_rule: "EITHER", dose_rounding_mode: "VIAL", max_single_dose_mg: 2000, site_of_care_eligible: false }
              as: PlanAdmin
              captures: { drug_id: $.data.id, drug_ver: $.data.version }
            - call: "POST /api/clinical-policies"
              payload: { drug_id: "${drug_id}", status: "DRAFT", expected_drug_version: "${drug_ver}", covered_diagnoses: ["C50"], step_therapy_required: false, requires_site_of_care_redirection: false, biosimilar_substitution: "DISABLED" }
              as: MedicalPolicyOfficer
              captures: { pol_id: $.data.id }
            - call: "POST /api/provider-accounts"
              payload: { name: "Gate Provider B" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /api/prior-authorizations"
              payload: { drug_id: "${drug_id}", member_id: "MEM-14", diagnosis_code: "C50", requested_start_date: "2026-08-01", requested_dose_mg: 100 }
              as: ProviderRep
              as_user_id: "${prov_id}"
              captures: { auth_id: $.data.id }
          trigger:
            - call: "POST /api/prior-authorizations/${auth_id}/approve"
              payload: { max_administrations: 4 }
              as: MedicalPolicyOfficer
              captures: { err_id: $.data.error_id }
            - call: "GET /api/drugs/${drug_id}"
              as: PlanAdmin
              captures: { drug_ver2: $.data.version }
            - call: "POST /api/clinical-policies/${pol_id}/activate"
              payload: { expected_drug_version: "${drug_ver2}" }
              as: MedicalPolicyOfficer
            - call: "POST /api/prior-authorizations/${auth_id}/approve"
              payload: { max_administrations: 4 }
              as: MedicalPolicyOfficer
              captures: { auth_status: $.data.status }
          assert:
            - "With only a DRAFT policy: error_id == ERR_NO_ACTIVE_POLICY (409)"
            - "After activation: approval succeeds, status == APPROVED"
            - "PriorAuthorization.${auth_id}.policy_id == ${pol_id} and policy_version_no == 1 (version pinned at approval)"

