  # =========================================================================
  # RULE 9 - compensating_invariant
  # Two invariants over DIFFERENT CONSERVED QUANTITIES:
  #   9A -> MONEY: the Provider reimbursement ledger triple
  #         (claim_gross_cents, recouped_cents, net_reimbursed_cents);
  #   9B -> PHYSICAL UNITS: the Device inventory partition
  #         total == in_stock + issued + reclaim_pending + retired.
  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: provider_money_ledger_restored_byte_for_byte_by_appeal_reinstatement
        grounds:
          - calculations.provider_ledger_reconciliation
          - calculations.audit_recoupment_amount
          - state_machines.ReimbursementClaim.status.AUDIT_FAILED_to_AUDIT_PASSED
          - state_machines.ReimbursementClaim.status.FILED_to_HELD
          - state_machines.SubscriberCase.status.UNDER_REVIEW_to_GRANTED
          - endpoints[POST /lifeline/subscriber-cases/{id}/decide]
        distinguishing_aspect: |
          The conserved quantity is MONEY: the three-field Provider ledger
          (claim_gross_cents, recouped_cents, net_reimbursed_cents) plus audit_hold_flag is
          captured BEFORE the audit failure and asserted identical AFTER the appeal is
          granted, so the compensation must reverse the recoupment, the penalty, the hold
          flag and the collateral HELD claim with no residual drift in any of them.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-06-01T00:00:00Z."
            - "One ACTIVE provider licensed in TX with enrollment_cap 50."
            - "Two non-tribal VOICE enrollments at two DIFFERENT dwellings, E1 created before E2, both with benefit_start_date 2026-06-01 and both risk score 0, so the audit selector ranks E1 first on created_at ASC."
            - "Claim C1 for 2026-06 drafted and filed at clock 2026-07-02: 30 of 30 days for each line, round_half_up(925*30/30) = 925 per line, final_amount_cents 1850."
            - "Claim C2 for 2026-07 drafted and filed at clock 2026-08-02: 31 of 31 days per line, final_amount_cents 1850."
            - "Ledger before any audit action therefore reads claim_gross_cents 3700, recouped_cents 0, net_reimbursed_cents 3700, audit_hold_flag false."
