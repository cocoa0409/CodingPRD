        excluded_because:
          difficulty_instance: adoption_cascades_strategy_approval_objective_activation_commitment_funding
          rationale: "The §1.8 transitive_cascade instance already verifies the three-link ADOPT cascade down into strategies, objectives and commitments end to end."

      - name: cross_entity_side_effect_from_data_void
        claim_type: Cross-entity
        excluded_because:
          difficulty_instance: data_void_cascades_indicator_insufficient_candidate_invalidated_strategy_suspended
          rationale: "The §1.8 transitive_cascade instance already walks the void -> indicator -> candidate -> strategy -> cycle posture chain and asserts each affected row."

      - name: ledger_sync_of_report_derived_totals
        claim_type: Ledger sync
        excluded_because:
          difficulty_instance: posting_void_restores_report_totals_identity
          rationale: "The §1.8 compensating_invariant instance already reconciles the ancestor report's derived totals before and after each posting-level state change."

      - name: compensation_reverses_all_original_side_effects
        claim_type: Compensation
        excluded_because:
          difficulty_instance: committed_commitment_release_restores_partnership_funding_and_party_fte
          rationale: "The §1.8 compensating_invariant instance already proves that releasing a COMMITTED commitment reverses every ledger side effect it created (strategy budget, partnership funding, party FTE) with no drift."

