            - call: "POST /rep-agency/agreements/${a2}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /rep-agency/principals/${p2}/rate-schedules"
              payload: { family_rates: [{ family_code: "CONNECTORS", base_rate_bp: 1000 }], attainment_tiers: [{ min_attainment_bp: 0, multiplier_bp: 10000 }], registration_bonus_bp: 0, expected_principal_version: "${p2_v}" }
              as: AgencyAdmin
            - call: "POST /rep-agency/reps"
              payload: { display_name: "RH", territory_codes: ["NV"] }
              as: AgencyAdmin
              captures: { rh: $.data.id }
            - call: "POST /rep-agency/customers"
              payload: { name: "CH", spec_territory_code: "NV", ship_to_territory_code: "NV" }
              as: AgencyAdmin
              captures: { ch: $.data.id }
            - call: "POST /rep-agency/orders"
              payload: { customer_id: "${ch}", principal_id: "${p2}", external_order_ref: "PO-H", placed_at: "2026-08-01T00:00:00Z", lines: [{ line_id: "L1", family_code: "CONNECTORS", quantity: 100, unit_price_cents: 10000 }] }
              as: AgencyAdmin
              captures: { oh: $.data.id }
            - call: "POST /rep-agency/orders/${oh}/ship"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p2}"
            - call: "POST /rep-agency/orders/${oh}/invoice"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p2}"
            - call: "POST /rep-agency/sample-units"
              payload: { principal_id: "${p2}", serial_number: "S-1", family_code: "CONNECTORS", value_cents: 100000 }
              as: PrincipalOps
              as_user_id: "${p2}"
              captures: { u1: $.data.id }
            - call: "POST /rep-agency/sample-checkouts"
              payload: { sample_unit_id: "${u1}" }
              as: Rep
              as_user_id: "${rh}"
              captures: { co1: $.data.id }
            - call: "POST /rep-agency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "GET /rep-agency/reps/${rh}"
              as: AgencyAdmin
              captures: { bal_mid: $.data.commission_balance_cents }
            - call: "POST /rep-agency/rmas"
