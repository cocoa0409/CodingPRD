            - {call: "POST /setter-loads/${s1}/items", payload: {egg_lot_id: "${l1}", eggs_taken: 6000, expected_egg_lot_version: "${lav}"}, as: IncubationOperator}
            - {call: "POST /setter-loads/${s1}/items", payload: {egg_lot_id: "${l1}", eggs_taken: 6000, expected_egg_lot_version: "${l1v2}"}, as: IncubationOperator}
          assert:
            - "First call: HTTP 412 with error.code == ERR_STALE_VERSION (priority 10 wins over priority 12)"
            - "Second call, fresh version: HTTP 422 with error.code == ERR_EGG_LOT_INVALID_STATE, proving the state rule was also violated all along"
            - "No SetterLoadItem is created by either call and SetterLoad.${s1}.total_eggs_set stays 0"
            - "EggLot.${l1}.eggs_remaining stays 0 and version is unchanged by the two rejected calls"

      - name: start_lay_lab_clearance_beats_maturity
        grounds:
          - validations.priority_21.ERR_LAB_CLEARANCE_MISSING
          - validations.priority_34.ERR_FLOCK_NOT_MATURE
          - state_machines.BreederFlock.PLACED_to_IN_LAY
        distinguishing_aspect: |
          A 19-week-old flock with no lab clearance violates the business_safety rule at priority 21
          and the business_referential rule at priority 34 at once; the biosecurity error must be
          returned first. Curing only the clearance then surfaces ERR_FLOCK_NOT_MATURE, so neither
          rule can be an artefact of the other.
