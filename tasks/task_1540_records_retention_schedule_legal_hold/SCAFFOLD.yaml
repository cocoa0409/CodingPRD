# =============================================================================
# Scaffold: Records Retention Schedule & Legal Hold (corporate information
# governance) — generated fresh from scenario description.
# =============================================================================

scenario: |
  Records Retention Schedule & Legal Hold (corporate information governance): retention schedule by record class & jurisdiction, disposition eligibility calculation & approval, legal hold issuance, custodian acknowledgment & reminders, hold scope expansion & release decisions, suspension of auto-deletion in systems, defensible deletion documentation, hold inventory audit & over-preservation reduction, regulatory retention conflict resolution

domain_name: records-retention-legal-hold
api_prefix: /ig

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - scheduled_actions
    - derived_field_reconciliation

  entity_topology: flat
  # All entities are peers under /ig; GovernanceProgram is referenced by
  # program_id FK on every other entity (no nested URL paths).

  state_machine_shape: compound
  # Dominant shape: Record.disposition_posture is a derived aggregate that
  # gates every destructive operation; DispositionRequest and RetentionRule
  # add revision cycles; HoldCustodian adds a reminder self-loop with a
  # branching escalation path.

  relationship_patterns:
    - one_to_many          # Program -> everything; LegalHold -> HoldCustodian/HoldScopeItem; DispositionRequest -> DispositionItem
    - many_to_many         # LegalHold <-> Record via HoldScopeItem; LegalHold <-> Custodian via HoldCustodian
    - self_referential     # RetentionRule.supersedes_rule_id (version succession chain)
    - cross_aggregate      # Record -> RetentionRule governing-rule resolution; DispositionItem -> Record; RetentionConflict -> RetentionRule

  role_model: segregation_of_duties
  # Disposition requester (tracked by opaque X-User-ID) cannot approve their
  # own request; APPLY_SHORTEST conflict resolution requires LegalCounsel.

  consistency_model: immediate
  # Every mutation (including cascades) is atomic within the request.

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: GovernanceProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: fiscal_year_end_month, type: integer, source: input, description: "Fiscal year end month 1-12; used by FISCAL_YEAR_END retention anchor" }
      - { name: fiscal_year_end_day, type: integer, source: input, description: "Fiscal year end day-of-month 1-31 (must be valid for the month)" }
      - { name: ack_deadline_days, type: integer, source: input, default: 14, description: "Days from hold issuance (or custodian addition) until acknowledgment is due; > 0" }
      - { name: reminder_interval_days, type: integer, source: input, default: 7, description: "Nominal interval between custodian reminders; used by REMINDER_ADJUSTED SLA variant; > 0" }
      - { name: max_reminders_before_escalation, type: integer, source: input, default: 3, description: "Reminder count at which an assignment escalates (fires when reminder_count >= this); >= 1" }
      - { name: stale_hold_days, type: integer, source: input, default: 180, description: "Days without hold activity after which an ISSUED hold is stale for audits; > 0" }
      - { name: over_preservation_warn_pct, type: number, source: input, default: 20, description: "Audit threshold: over_preservation_pct >= this flags threshold_breached" }
      - { name: ack_sla_mode, type: enum, source: input, default: "STRICT", description: "STRICT | REMINDER_ADJUSTED — selects ack_sla_evaluation variant" }

  - name: RecordClass
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> GovernanceProgram.id; owning program" }
      - { name: code, type: string, source: input, description: "Class code, unique per program (e.g., FINANCIAL_LEDGER)" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: monthly_storage_cost_cents_per_gb, type: number, source: input, description: "Fractional cents per GB-month; feeds over_preservation_cost; > 0" }

  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> GovernanceProgram.id; owning program" }
      - { name: code, type: string, source: input, description: "Jurisdiction code, unique per program (e.g., US-CA)" }
      - { name: name, type: string, source: input, description: "Display name" }

  - name: Custodian
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> GovernanceProgram.id; owning program" }
      - { name: email, type: string, source: input, description: "Custodian email, unique per program" }
      - { name: full_name, type: string, source: input, description: "Display name" }
      - { name: department, type: string, source: input, description: "Department label" }
      - { name: open_obligation_count, type: integer, source: computed, default: 0, description: "Count of HoldCustodian rows for this custodian with status IN (PENDING, ESCALATED); reconciled on every assignment transition" }

  - name: RetentionRule
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> GovernanceProgram.id; owning program" }
      - { name: record_class_id, type: string, source: input, description: "FK -> RecordClass.id; governed class" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; governed jurisdiction" }
      - { name: rule_code, type: string, source: input, description: "Rule code, unique per program; final tie-break in governing-rule selection (lexicographic ASC)" }
      - { name: retention_months, type: integer, source: input, description: "Retention length in calendar months; > 0" }
      - { name: trigger_basis, type: enum, source: input, description: "EVENT_DATE | FISCAL_YEAR_END — anchor for retention_due_date" }
      - { name: effective_from, type: datetime, source: input, description: "Effective window start (inclusive), ISO date at 00:00:00Z" }
      - { name: effective_to, type: datetime, source: input, description: "Effective window end (exclusive); null = open-ended; half-open [from, to)" }
      - { name: supersedes_rule_id, type: string, source: system, description: "FK -> RetentionRule.id; succession pointer (self-referential), set only by POST /ig/retention-rules/{id}/supersede" }
      - { name: superseded_by_id, type: string, source: system, description: "FK -> RetentionRule.id; set when this rule is superseded" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | PENDING_CONFLICT | SUPERSEDED | RETIRED" }

  - name: RetentionConflict
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> GovernanceProgram.id; copied from challenger rule" }
      - { name: record_class_id, type: string, source: system, description: "FK -> RecordClass.id; contested class" }
      - { name: jurisdiction_id, type: string, source: system, description: "FK -> Jurisdiction.id; contested jurisdiction" }
      - { name: incumbent_rule_id, type: string, source: system, description: "FK -> RetentionRule.id; currently ACTIVE rule" }
      - { name: challenger_rule_id, type: string, source: system, description: "FK -> RetentionRule.id; rule in PENDING_CONFLICT" }
      - { name: governing_rule_id, type: string, source: system, description: "FK -> RetentionRule.id; winner after resolution; null while OPEN" }
      - { name: resolution_strategy, type: enum, source: system, description: "APPLY_LONGEST | APPLY_SHORTEST; null while OPEN" }
      - { name: resolution_justification, type: string, source: system, description: "Justification captured at resolution; null while OPEN" }
      - { name: resolved_by_user_id, type: string, source: system, description: "Opaque X-User-ID of resolver; null while OPEN" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED | WITHDRAWN" }

  - name: Record
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> GovernanceProgram.id; owning program" }
      - { name: record_class_id, type: string, source: input, description: "FK -> RecordClass.id; record class" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; governing jurisdiction" }
      - { name: owner_custodian_id, type: string, source: input, description: "FK -> Custodian.id; optional business owner custodian" }
      - { name: title, type: string, source: input, description: "Record title" }
      - { name: source_system, type: string, source: input, description: "Originating system label (e.g., EMAIL_ARCHIVE)" }
      - { name: event_date, type: datetime, source: input, description: "Retention trigger event date, ISO date at 00:00:00Z" }
      - { name: size_gb, type: number, source: input, description: "Storage footprint in GB; > 0; feeds over-preservation cost" }
      - { name: auto_delete_enabled, type: boolean, source: input, default: true, description: "Whether auto-delete sweeps may destroy this record when eligible" }
      - { name: retention_due_date, type: datetime, source: computed, description: "Computed by retention_due_date calculation from governing rule; null when UNSCHEDULED" }
      - { name: governing_rule_id, type: string, source: computed, description: "FK -> RetentionRule.id; ACTIVE rule whose effective window covers event_date; null when UNSCHEDULED or CONFLICT_BLOCKED" }
      - { name: active_hold_count, type: integer, source: computed, default: 0, description: "Count of HoldScopeItem rows with record_id = this record AND status = ACTIVE; mutated only by scope-item cascades" }
      - { name: auto_delete_suspended, type: boolean, source: computed, default: false, description: "True iff active_hold_count > 0; reconciled whenever active_hold_count changes" }
      - { name: disposition_posture, type: enum, source: computed, description: "Derived on read, precedence order: UNSCHEDULED (no governing rule) > HELD (active_hold_count > 0) > CONFLICT_BLOCKED (OPEN conflict for class+jurisdiction) > ELIGIBLE (current_utc >= retention_due_date) > RETAINED" }
      - { name: destroyed_at, type: datetime, source: system, description: "Destruction timestamp; null until destroyed" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DESTROYED" }

  - name: LegalHold
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> GovernanceProgram.id; owning program" }
      - { name: matter_ref, type: string, source: input, description: "Matter reference; unique per program among holds with status IN (DRAFT, ISSUED)" }
      - { name: title, type: string, source: input, description: "Hold title" }
      - { name: reason, type: string, source: input, description: "Business/legal reason" }
      - { name: created_by_user_id, type: string, source: system, description: "Opaque X-User-ID of issuing counsel" }
      - { name: issued_at, type: datetime, source: system, description: "Issuance timestamp; null while DRAFT" }
      - { name: released_at, type: datetime, source: system, description: "Release timestamp; null until released" }
      - { name: release_reason, type: string, source: system, description: "Release justification; null until released" }
      - { name: last_activity_at, type: datetime, source: computed, description: "Max of issued_at, latest scope-item add/exclude, latest custodian ack; staleness input; null while DRAFT" }
      - { name: late_ack_count, type: integer, source: computed, default: 0, description: "Count of assignments acknowledged with was_late = true" }
      - { name: all_acknowledged, type: boolean, source: computed, default: false, description: "True iff at least one assignment exists and every assignment has status IN (ACKNOWLEDGED, RELEASED)" }
      - { name: active_scope_count, type: integer, source: computed, default: 0, description: "Count of HoldScopeItem rows with status = ACTIVE" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | RELEASED | CANCELLED" }

  - name: HoldCustodian
    parent: null
    common_fields: true
    fields:
      - { name: hold_id, type: string, source: system, description: "FK -> LegalHold.id; parent hold" }
      - { name: custodian_id, type: string, source: system, description: "FK -> Custodian.id; obligated custodian" }
      - { name: program_id, type: string, source: system, description: "FK -> GovernanceProgram.id; denormalized from hold" }
      - { name: ack_due_date, type: datetime, source: computed, description: "issued-at/add-at + program.ack_deadline_days; null while AWAITING_ISSUANCE" }
      - { name: acknowledged_at, type: datetime, source: system, description: "Acknowledgment timestamp; null until ACKNOWLEDGED" }
      - { name: was_late, type: boolean, source: computed, description: "Computed by ack_sla_evaluation (program.ack_sla_mode variant); null until ACKNOWLEDGED" }
      - { name: reminder_count, type: integer, source: system, default: 0, description: "Reminders sent; incremented by reminder sweep while PENDING" }
      - { name: last_reminder_at, type: datetime, source: system, description: "Timestamp of latest reminder; null if none" }
      - { name: escalated_at, type: datetime, source: system, description: "Escalation timestamp; null unless ESCALATED" }
      - { name: status, type: enum, source: system, description: "AWAITING_ISSUANCE | PENDING | ESCALATED | ACKNOWLEDGED | RELEASED | CANCELLED" }

  - name: HoldScopeItem
    parent: null
    common_fields: true
    fields:
      - { name: hold_id, type: string, source: system, description: "FK -> LegalHold.id; parent hold" }
      - { name: record_id, type: string, source: system, description: "FK -> Record.id; scoped record" }
      - { name: program_id, type: string, source: system, description: "FK -> GovernanceProgram.id; denormalized from hold" }
      - { name: added_at, type: datetime, source: system, description: "Timestamp item was added to the hold" }
      - { name: activated_at, type: datetime, source: system, description: "Timestamp item became ACTIVE (at issuance for pre-issuance items); null while PENDING_ISSUANCE" }
      - { name: released_at, type: datetime, source: system, description: "Timestamp item left ACTIVE status; null while ACTIVE/PENDING_ISSUANCE" }
      - { name: status, type: enum, source: system, description: "PENDING_ISSUANCE | ACTIVE | EXCLUDED | RELEASED | CANCELLED" }

  - name: DispositionRequest
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> GovernanceProgram.id; owning program" }
      - { name: requester_user_id, type: string, source: system, description: "Opaque X-User-ID of creating RecordsManager" }
      - { name: method, type: enum, source: input, description: "SECURE_ERASE | SHRED | CRYPTO_SHRED — destruction method applied to every item" }
      - { name: justification, type: string, source: input, description: "Business justification, >= 20 characters" }
      - { name: submitted_at, type: datetime, source: system, description: "Submission timestamp; null while DRAFT" }
      - { name: decided_at, type: datetime, source: system, description: "Approve/reject timestamp; null until decided" }
      - { name: decided_by_user_id, type: string, source: system, description: "Opaque X-User-ID of deciding LegalCounsel; null until decided" }
      - { name: rejection_reason, type: string, source: system, description: "Rejection reason; null unless REJECTED" }
      - { name: executed_at, type: datetime, source: system, description: "Execution timestamp; null until EXECUTED" }
      - { name: stale_item_count, type: integer, source: system, default: 0, description: "Stored counter: items whose record posture changed while request was SUBMITTED or APPROVED; mutated only by cascades; must be 0 to approve" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | EXECUTED | WITHDRAWN" }

  - name: DispositionItem
    parent: null
    common_fields: true
    fields:
      - { name: request_id, type: string, source: system, description: "FK -> DispositionRequest.id; parent request" }
      - { name: record_id, type: string, source: system, description: "FK -> Record.id; target record" }
      - { name: program_id, type: string, source: system, description: "FK -> GovernanceProgram.id; denormalized from request" }
      - { name: snapshot_posture, type: enum, source: system, description: "Record posture captured at submit/refresh; null while DRAFT" }
      - { name: snapshot_due_date, type: datetime, source: system, description: "Record retention_due_date captured at submit/refresh; null while DRAFT" }
      - { name: snapshot_hold_count, type: integer, source: system, description: "Record active_hold_count captured at submit/refresh; null while DRAFT" }
      - { name: destroyed_at, type: datetime, source: system, description: "Per-item destruction timestamp; null unless DESTROYED" }
      - { name: status, type: enum, source: system, description: "PENDING | DESTROYED | SKIPPED_HELD | SKIPPED_ALREADY_DESTROYED" }

  - name: DestructionCertificate
    parent: null
    common_fields: false
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> GovernanceProgram.id; owning program" }
      - { name: request_id, type: string, source: system, description: "FK -> DispositionRequest.id; executing request" }
      - { name: disposition_item_id, type: string, source: system, description: "FK -> DispositionItem.id; destroyed item" }
      - { name: record_id, type: string, source: system, description: "FK -> Record.id; destroyed record (tombstone reference)" }
      - { name: record_title, type: string, source: system, description: "Snapshot of Record.title at destruction" }
      - { name: record_class_code, type: string, source: system, description: "Snapshot of RecordClass.code at destruction" }
      - { name: jurisdiction_code, type: string, source: system, description: "Snapshot of Jurisdiction.code at destruction" }
      - { name: retention_due_date, type: datetime, source: system, description: "Snapshot of Record.retention_due_date at destruction" }
      - { name: destroyed_at, type: datetime, source: system, description: "Destruction timestamp (logical clock)" }
      - { name: method, type: enum, source: system, description: "SECURE_ERASE | SHRED | CRYPTO_SHRED" }
      - { name: content_hash, type: string, source: system, description: "System-generated SHA-256 hex digest over (record_id, title, destroyed_at)" }
      - { name: witness_user_id, type: string, source: system, description: "Opaque X-User-ID of executing user" }
      - { name: certificate_seq, type: integer, source: system, description: "Per-program monotonically increasing sequence starting at 1, assigned in destruction order (created_at ASC within a batch)" }

  - name: HoldAudit
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> GovernanceProgram.id; audited program" }
      - { name: active_hold_count, type: integer, source: computed, description: "Snapshot: holds with status = ISSUED at audit creation" }
      - { name: stale_hold_count, type: integer, source: computed, description: "Snapshot: ISSUED holds whose last_activity_at is strictly more than program.stale_hold_days before audit time" }
      - { name: held_record_count, type: integer, source: computed, description: "Snapshot: records with disposition_posture = HELD" }
      - { name: eligible_record_count, type: integer, source: computed, description: "Snapshot: records with disposition_posture = ELIGIBLE" }
      - { name: over_preserved_record_count, type: integer, source: computed, description: "Snapshot: ELIGIBLE records with auto_delete_enabled = false" }
      - { name: over_preservation_pct, type: number, source: computed, description: "= round_half_up(over_preserved_record_count * 100 / eligible_record_count, 2); 0 when eligible_record_count = 0" }
      - { name: over_preservation_cost_cents, type: integer, source: computed, description: "Sum over over-preserved records of per-record cost (see over_preservation_cost calculation; round per record then sum)" }
      - { name: threshold_breached, type: boolean, source: computed, description: "True iff over_preservation_pct >= program.over_preservation_warn_pct" }
      - { name: closed_at, type: datetime, source: system, description: "Close timestamp; null while OPEN" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED" }

  - name: ReminderLog
    parent: null
    common_fields: false
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> GovernanceProgram.id; owning program" }
      - { name: hold_id, type: string, source: system, description: "FK -> LegalHold.id; related hold" }
      - { name: hold_custodian_id, type: string, source: system, description: "FK -> HoldCustodian.id; related assignment" }
      - { name: custodian_id, type: string, source: system, description: "FK -> Custodian.id; notified custodian" }
      - { name: kind, type: enum, source: system, description: "ISSUED_NOTICE | REMINDER | ESCALATION | RELEASE_NOTICE | CANCEL_NOTICE" }
      - { name: sent_at, type: datetime, source: system, description: "Logical-clock timestamp of the notice" }
      - { name: reminder_seq, type: integer, source: system, description: "Value of assignment.reminder_count after this entry; 0 for non-REMINDER kinds" }

  - name: DispositionFreezeWindow
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> GovernanceProgram.id; owning program" }
      - { name: start_at, type: datetime, source: input, description: "Freeze window start (inclusive) — CLOSED interval semantics" }
      - { name: end_at, type: datetime, source: input, description: "Freeze window end (inclusive) — CLOSED interval semantics; must be >= start_at" }
      - { name: reason, type: string, source: input, description: "Reason for the freeze (e.g., audit season)" }
      - { name: cancelled_at, type: datetime, source: system, description: "Cancellation timestamp; null while ACTIVE" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CANCELLED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RetentionRule
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /ig/retention-rules/{ruleId}/activate"
        actor: RecordsManager
        preconditions:
          - "Rule status == DRAFT (ERR_RULE_INVALID_STATE)"
          - "If supersedes_rule_id set: target rule status == ACTIVE (ERR_SUPERSEDE_TARGET_NOT_ACTIVE)"
          - "No other ACTIVE rule for same (record_class_id, jurisdiction_id) with overlapping half-open [effective_from, effective_to) window — unless supersedes_rule_id names exactly that rule"
        side_effects:
          - "status -> ACTIVE"
          - "If supersedes_rule_id set: target rule status -> SUPERSEDED, target.superseded_by_id = this rule, target.version += 1"
          - "Recompute retention_due_date, governing_rule_id, disposition_posture for every ACTIVE-status Record with matching (record_class_id, jurisdiction_id) whose governing rule changed"
          - "For each recomputed Record whose disposition_posture flipped ELIGIBLE <-> (RETAINED | UNSCHEDULED | CONFLICT_BLOCKED | HELD): adjust stale_item_count (+1 on leaving ELIGIBLE, -1 on entering ELIGIBLE) on every DispositionRequest in SUBMITTED or APPROVED containing that record"

      - from: DRAFT
        to: PENDING_CONFLICT
        trigger: "POST /ig/retention-rules/{ruleId}/activate"
        actor: RecordsManager
        preconditions:
          - "Rule status == DRAFT (ERR_RULE_INVALID_STATE)"
          - "supersedes_rule_id is null"
          - "Another ACTIVE rule exists for same (record_class_id, jurisdiction_id) with overlapping half-open window"
        side_effects:
          - "status -> PENDING_CONFLICT"
          - "Create RetentionConflict: status OPEN, challenger_rule_id = this rule (window overlap computed with half-open semantics: overlap iff from < other.to AND other.from < to; adjacency from == other.to is NOT overlap)"
          - "Incumbent selection when several ACTIVE rules overlap: the overlapping rule with earliest created_at (tie-break: rule_code ASC) becomes incumbent_rule_id; if a resolution supersedes that incumbent while further overlaps remain, the challenger STAYS PENDING_CONFLICT and a fresh OPEN conflict is spawned against the next overlapping rule by the same selector"
          - "Records of the contested (record_class_id, jurisdiction_id) in SUBMITTED/APPROVED DispositionRequests whose posture was ELIGIBLE: stale_item_count += 1 (posture flips to CONFLICT_BLOCKED on read)"

      - from: PENDING_CONFLICT
        to: DRAFT
        trigger: "POST /ig/retention-rules/{ruleId}/withdraw"
        actor: RecordsManager
        preconditions:
          - "Rule status == PENDING_CONFLICT (ERR_RULE_INVALID_STATE)"
        side_effects:
          - "status -> DRAFT"
          - "Linked OPEN RetentionConflict (challenger_rule_id = this rule) -> WITHDRAWN"

      - from: PENDING_CONFLICT
        to: ACTIVE
        trigger: "POST /ig/retention-conflicts/{conflictId}/resolve (when this rule wins)"
        actor: RecordsManager | LegalCounsel
        preconditions:
          - "Conflict status == OPEN (ERR_CONFLICT_NOT_OPEN)"
        side_effects:
          - "status -> ACTIVE"
          - "See RetentionConflict OPEN -> RESOLVED for the full cascade"

      - from: DRAFT
        to: RETIRED
        trigger: "POST /ig/retention-rules/{ruleId}/retire"
        actor: RecordsManager
        preconditions:
          - "Rule status IN (DRAFT, ACTIVE) (ERR_RULE_INVALID_STATE)"
          - "If ACTIVE: zero Records with status == ACTIVE have governing_rule_id == this rule (ERR_RULE_HAS_GOVERNED_RECORDS); DESTROYED tombstones do not block retirement"
        side_effects:
          - "status -> RETIRED"
        note: "DRAFT retire discards; ACTIVE retire allowed only when no records governed"

      - from: ACTIVE
        to: RETIRED
        trigger: "POST /ig/retention-rules/{ruleId}/retire"
        actor: RecordsManager
        preconditions:
          - "Rule status IN (DRAFT, ACTIVE) (ERR_RULE_INVALID_STATE)"
          - "Zero Records with status == ACTIVE have governing_rule_id == this rule (ERR_RULE_HAS_GOVERNED_RECORDS)"
        side_effects:
          - "status -> RETIRED"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (a DRAFT rule declaring supersedes_rule_id = this rule is activated, or this rule loses a conflict resolution)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> SUPERSEDED; superseded_by_id = winning rule; version += 1"
          - "Recompute cascade over governed Records exactly as in DRAFT -> ACTIVE"

  - entity: RetentionConflict
    initial_state: OPEN
    terminal_states: [RESOLVED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /ig/retention-conflicts/{conflictId}/resolve"
        actor: RecordsManager | LegalCounsel
        preconditions:
          - "Conflict status == OPEN (ERR_CONFLICT_NOT_OPEN)"
          - "strategy == APPLY_SHORTEST requires actor role LegalCounsel (ERR_SHORTEST_STRATEGY_REQUIRES_COUNSEL)"
          - "strategy == APPLY_SHORTEST requires justification >= 20 chars (ERR_JUSTIFICATION_TOO_SHORT)"
        side_effects:
          - "Winner = rule with max(retention_months) for APPLY_LONGEST, min(retention_months) for APPLY_SHORTEST over {incumbent, challenger}; tie-break: created_at DESC (newer wins), then rule_code ASC"
          - "Winner: status -> ACTIVE (challenger) or stays ACTIVE (incumbent)"
          - "Loser: status -> SUPERSEDED, superseded_by_id = winner, version += 1"
          - "Conflict: status -> RESOLVED, governing_rule_id = winner, resolution_strategy/justification/resolved_by_user_id set"
          - "Recompute retention_due_date, governing_rule_id, disposition_posture for every Record with matching (record_class_id, jurisdiction_id)"
          - "For each Record whose posture flipped into or out of ELIGIBLE: adjust stale_item_count on containing SUBMITTED/APPROVED DispositionRequests (+1 leaving ELIGIBLE, -1 entering ELIGIBLE)"

      - from: OPEN
        to: WITHDRAWN
        trigger: "system (challenger rule withdrawn via POST /ig/retention-rules/{ruleId}/withdraw)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> WITHDRAWN; challenger rule returns to DRAFT; incumbent remains ACTIVE and governing"
          - "Records of the contested pair whose posture re-enters ELIGIBLE (conflict cleared): stale_item_count -= 1 on containing SUBMITTED/APPROVED DispositionRequests"

  - entity: LegalHold
    initial_state: DRAFT
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /ig/legal-holds/{holdId}/issue"
        actor: LegalCounsel
        preconditions:
          - "Hold status == DRAFT (ERR_HOLD_INVALID_STATE)"
          - "At least one HoldScopeItem with status == PENDING_ISSUANCE (ERR_EMPTY_HOLD_SCOPE)"
          - "At least one HoldCustodian with status == AWAITING_ISSUANCE (ERR_EMPTY_HOLD_SCOPE)"
        side_effects:
          - "status -> ISSUED; issued_at = current_utc; last_activity_at = current_utc; version += 1"
          - "Every HoldScopeItem PENDING_ISSUANCE -> ACTIVE (activated_at set); per item: Record.active_hold_count += 1; Record.auto_delete_suspended = true; Record.disposition_posture recomputed; if posture left ELIGIBLE: stale_item_count += 1 on containing SUBMITTED/APPROVED DispositionRequests"
          - "Every HoldCustodian AWAITING_ISSUANCE -> PENDING; ack_due_date = issued_at + program.ack_deadline_days"
          - "Custodian.open_obligation_count += 1 per new PENDING assignment"
          - "ReminderLog entry kind=ISSUED_NOTICE per custodian"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /ig/legal-holds/{holdId}/cancel"
        actor: LegalCounsel
        preconditions:
          - "Hold status == DRAFT (ERR_HOLD_INVALID_STATE)"
        side_effects:
          - "status -> CANCELLED"
          - "HoldScopeItems PENDING_ISSUANCE -> CANCELLED (no record cascade: they were never ACTIVE)"
          - "HoldCustodians AWAITING_ISSUANCE -> CANCELLED (no obligation-count change: they were never PENDING)"
          - "ReminderLog entry kind=CANCEL_NOTICE per custodian"

      - from: ISSUED
        to: RELEASED
        trigger: "POST /ig/legal-holds/{holdId}/release"
        actor: LegalCounsel
        preconditions:
          - "Hold status == ISSUED (ERR_HOLD_INVALID_STATE)"
          - "expected_legal_hold_version == hold.version (ERR_STALE_VERSION, 412 — see concurrency_rules)"
          - "Every HoldCustodian status == ACKNOWLEDGED (ERR_HOLD_HAS_UNACKNOWLEDGED_CUSTODIANS)"
          - "release_reason present, >= 10 chars (ERR_JUSTIFICATION_TOO_SHORT)"
        side_effects:
          - "status -> RELEASED; released_at = current_utc; release_reason stored; version += 1"
          - "Every HoldScopeItem ACTIVE -> RELEASED (released_at set); per item: Record.active_hold_count -= 1; Record.auto_delete_suspended = (active_hold_count > 0); posture recomputed; if posture entered ELIGIBLE: stale_item_count -= 1 on containing SUBMITTED/APPROVED DispositionRequests"
          - "Every HoldCustodian ACKNOWLEDGED -> RELEASED; Custodian.open_obligation_count unchanged (ACKNOWLEDGED was not counted)"
          - "ReminderLog entry kind=RELEASE_NOTICE per custodian"

  - entity: HoldCustodian
    initial_state: AWAITING_ISSUANCE
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: AWAITING_ISSUANCE
        to: PENDING
        trigger: "system (parent hold issued)"
        actor: system
        preconditions: []
        side_effects:
          - "ack_due_date = hold.issued_at + program.ack_deadline_days"
          - "Custodian.open_obligation_count += 1"

      - from: PENDING
        to: PENDING
        trigger: "system (reminder sweep: POST /ig/sweeps/reminders)"
        actor: system
        preconditions:
          - "status == PENDING AND ack_due_date < current_utc (strictly past due)"
          - "reminder_count < program.max_reminders_before_escalation"
        side_effects:
          - "reminder_count += 1; last_reminder_at = current_utc"
          - "ReminderLog entry kind=REMINDER, reminder_seq = reminder_count"
        note: "Self-loop with counter — cyclic machine; escalation fires on the next sweep once reminder_count >= max"

      - from: PENDING
        to: ESCALATED
        trigger: "system (reminder sweep: POST /ig/sweeps/reminders)"
        actor: system
        preconditions:
          - "status == PENDING AND ack_due_date < current_utc"
          - "reminder_count >= program.max_reminders_before_escalation (inclusive boundary)"
        side_effects:
          - "status -> ESCALATED; escalated_at = current_utc"
          - "ReminderLog entry kind=ESCALATION, reminder_seq = reminder_count"

      - from: PENDING
        to: ACKNOWLEDGED
        trigger: "POST /ig/hold-custodians/{assignmentId}/acknowledge"
        actor: Custodian
        preconditions:
          - "X-User-ID == assignment.custodian_id (ERR_NOT_CUSTODIAN_OF_ASSIGNMENT)"
          - "status IN (PENDING, ESCALATED) (ERR_ASSIGNMENT_NOT_ACKNOWLEDGEABLE)"
        side_effects:
          - "status -> ACKNOWLEDGED; acknowledged_at = current_utc"
          - "was_late per ack_sla_evaluation (program.ack_sla_mode variant)"
          - "If was_late: LegalHold.late_ack_count += 1"
          - "Custodian.open_obligation_count -= 1"
          - "LegalHold.all_acknowledged recomputed; LegalHold.last_activity_at = current_utc; LegalHold.version += 1"

      - from: ESCALATED
        to: ACKNOWLEDGED
        trigger: "POST /ig/hold-custodians/{assignmentId}/acknowledge"
        actor: Custodian
        preconditions:
          - "X-User-ID == assignment.custodian_id (ERR_NOT_CUSTODIAN_OF_ASSIGNMENT)"
          - "status IN (PENDING, ESCALATED) (ERR_ASSIGNMENT_NOT_ACKNOWLEDGEABLE)"
        side_effects:
          - "Same as PENDING -> ACKNOWLEDGED (was_late computed identically; ESCALATED assignments acked after due are always was_late = true under both variants)"

      - from: ACKNOWLEDGED
        to: RELEASED
        trigger: "system (parent hold released)"
        actor: system
        preconditions: []
        side_effects: []

      - from: AWAITING_ISSUANCE
        to: CANCELLED
        trigger: "system (parent hold cancelled while DRAFT)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: HoldScopeItem
    initial_state: PENDING_ISSUANCE
    terminal_states: [RELEASED, EXCLUDED, CANCELLED]
    transitions:
      - from: PENDING_ISSUANCE
        to: ACTIVE
        trigger: "system (parent hold issued)"
        actor: system
        preconditions: []
        side_effects:
          - "activated_at = current_utc"
          - "Record.active_hold_count += 1; Record.auto_delete_suspended = true; posture recomputed; ELIGIBLE-exit adjusts stale_item_count += 1"

      - from: ACTIVE
        to: EXCLUDED
        trigger: "DELETE /ig/legal-holds/{holdId}/scope-items/{itemId}"
        actor: LegalCounsel
        preconditions:
          - "Parent hold status == ISSUED (ERR_HOLD_INVALID_STATE)"
          - "Item status == ACTIVE (ERR_HOLD_INVALID_STATE)"
        side_effects:
          - "status -> EXCLUDED; released_at = current_utc"
          - "Record.active_hold_count -= 1; auto_delete_suspended recomputed; posture recomputed; ELIGIBLE-entry adjusts stale_item_count -= 1"
          - "LegalHold.active_scope_count recomputed; last_activity_at = current_utc; version += 1"

      - from: PENDING_ISSUANCE
        to: CANCELLED
        trigger: "DELETE /ig/legal-holds/{holdId}/scope-items/{itemId} (while hold DRAFT) or system (hold cancelled)"
        actor: LegalCounsel | system
        preconditions:
          - "Parent hold status == DRAFT (ERR_HOLD_INVALID_STATE)"
        side_effects:
          - "status -> CANCELLED (no record cascade: never ACTIVE)"

      - from: ACTIVE
        to: RELEASED
        trigger: "system (parent hold released)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> RELEASED; released_at = current_utc"
          - "Record.active_hold_count -= 1; auto_delete_suspended recomputed; posture recomputed; ELIGIBLE-entry adjusts stale_item_count -= 1"

  - entity: Record
    initial_state: ACTIVE
    terminal_states: [DESTROYED]
    transitions:
      - from: ACTIVE
        to: DESTROYED
        trigger: "POST /ig/disposition-requests/{requestId}/execute (per item) or POST /ig/sweeps/auto-delete"
        actor: RecordsManager
        preconditions:
          - "Record status == ACTIVE (ERR_RECORD_ALREADY_DESTROYED)"
          - "disposition_posture == ELIGIBLE at execution time (else item SKIPPED_HELD / sweep skips)"
          - "Via sweep: auto_delete_enabled == true AND auto_delete_suspended == false"
          - "No ACTIVE DispositionFreezeWindow covering current_utc for the program (ERR_DISPOSITION_FREEZE_ACTIVE)"
        side_effects:
          - "status -> DESTROYED; destroyed_at = current_utc"
          - "DestructionCertificate created (method, snapshots, content_hash, witness_user_id, certificate_seq)"

  - entity: DispositionRequest
    initial_state: DRAFT
    terminal_states: [EXECUTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /ig/disposition-requests/{requestId}/submit"
        actor: RecordsManager
        preconditions:
          - "X-User-ID == request.requester_user_id (ERR_NOT_REQUEST_OWNER)"
          - "status == DRAFT (ERR_REQUEST_INVALID_STATE)"
          - "Every item's record currently disposition_posture == ELIGIBLE (ERR_RECORD_NOT_ELIGIBLE; message names first failing record_id in request creation order)"
        side_effects:
          - "status -> SUBMITTED; submitted_at = current_utc"
          - "Per item: snapshot_posture/snapshot_due_date/snapshot_hold_count captured from the record"
          - "stale_item_count reset to 0"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /ig/disposition-requests/{requestId}/approve"
        actor: LegalCounsel
        preconditions:
          - "status == SUBMITTED (ERR_REQUEST_INVALID_STATE)"
          - "X-User-ID != request.requester_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "No OPEN RetentionConflict for any item's (record_class_id, jurisdiction_id) (ERR_DISPOSITION_CONFLICT_BLOCKED)"
          - "stale_item_count == 0 (ERR_STALE_ELIGIBILITY_SNAPSHOT)"
          - "Every item's record still disposition_posture == ELIGIBLE at approval time (ERR_RECORD_NOT_ELIGIBLE)"
        side_effects:
          - "status -> APPROVED; decided_at = current_utc; decided_by_user_id = X-User-ID"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /ig/disposition-requests/{requestId}/reject"
        actor: LegalCounsel
        preconditions:
          - "status == SUBMITTED (ERR_REQUEST_INVALID_STATE)"
          - "rejection_reason present, >= 10 chars (ERR_JUSTIFICATION_TOO_SHORT)"
        side_effects:
          - "status -> REJECTED; decided_at/decided_by_user_id set; rejection_reason stored"
        note: "Reject is NOT subject to segregation of duties — any LegalCounsel may reject"

      - from: REJECTED
        to: DRAFT
        trigger: "POST /ig/disposition-requests/{requestId}/revise"
        actor: RecordsManager
        preconditions:
          - "X-User-ID == request.requester_user_id (ERR_NOT_REQUEST_OWNER)"
          - "status == REJECTED (ERR_REQUEST_INVALID_STATE)"
        side_effects:
          - "status -> DRAFT; snapshots cleared (null); rejection_reason cleared; stale_item_count reset to 0"
        note: "Revision loop DRAFT -> SUBMITTED -> REJECTED -> DRAFT — cyclic machine"

      - from: APPROVED
        to: EXECUTED
        trigger: "POST /ig/disposition-requests/{requestId}/execute"
        actor: RecordsManager
        preconditions:
          - "status == APPROVED (ERR_REQUEST_INVALID_STATE)"
          - "No ACTIVE DispositionFreezeWindow covering current_utc (ERR_DISPOSITION_FREEZE_ACTIVE)"
        side_effects:
          - "Per item, processed in request creation order (the record_ids order of the request), conditional destruction cascade: if record.status == DESTROYED -> item SKIPPED_ALREADY_DESTROYED; elif record.disposition_posture != ELIGIBLE (HELD or CONFLICT_BLOCKED; RETAINED/UNSCHEDULED cannot occur for a record that was ELIGIBLE at approval absent rule drift — if it nonetheless occurs, also SKIPPED_HELD) -> item SKIPPED_HELD; else record -> DESTROYED, item -> DESTROYED, DestructionCertificate created with certificate_seq assigned in processing order"
          - "status -> EXECUTED; executed_at = current_utc"
        note: "Bulk partial-execution semantics: skips do not fail the request"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /ig/disposition-requests/{requestId}/withdraw"
        actor: RecordsManager
        preconditions:
          - "X-User-ID == request.requester_user_id (ERR_NOT_REQUEST_OWNER)"
          - "status == DRAFT (ERR_REQUEST_INVALID_STATE)"
        side_effects:
          - "status -> WITHDRAWN"

      - from: SUBMITTED
        to: SUBMITTED
        trigger: "POST /ig/disposition-requests/{requestId}/refresh-snapshots"
        actor: RecordsManager
        preconditions:
          - "X-User-ID == request.requester_user_id (ERR_NOT_REQUEST_OWNER)"
          - "status == SUBMITTED (ERR_REQUEST_INVALID_STATE)"
          - "Every item's record currently disposition_posture == ELIGIBLE (ERR_RECORD_NOT_ELIGIBLE)"
        side_effects:
          - "Snapshots re-captured from current record state; stale_item_count reset to 0"
        note: "Self-loop used to clear staleness after holds/conflicts resolve"

  - entity: DispositionItem
    initial_state: PENDING
    terminal_states: [DESTROYED, SKIPPED_HELD, SKIPPED_ALREADY_DESTROYED]
    transitions:
      - from: PENDING
        to: DESTROYED
        trigger: "system (parent request executed; record destroyed)"
        actor: system
        preconditions:
          - "Record was ACTIVE and posture ELIGIBLE at execution"
        side_effects:
          - "destroyed_at = current_utc; DestructionCertificate created for this item"

      - from: PENDING
        to: SKIPPED_HELD
        trigger: "system (parent request executed; record not destroyable)"
        actor: system
        preconditions:
          - "Record ACTIVE but disposition_posture != ELIGIBLE at execution (hold or open conflict landed between approve and execute)"
        side_effects: []

      - from: PENDING
        to: SKIPPED_ALREADY_DESTROYED
        trigger: "system (parent request executed; record already DESTROYED by another path)"
        actor: system
        preconditions:
          - "Record status == DESTROYED at execution"
        side_effects: []

  - entity: HoldAudit
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /ig/hold-audits/{auditId}/close"
        actor: Auditor
        preconditions:
          - "status == OPEN (ERR_AUDIT_NOT_OPEN)"
        side_effects:
          - "closed_at = current_utc (snapshot fields frozen as computed at creation)"

  - entity: DispositionFreezeWindow
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /ig/disposition-freeze-windows/{windowId}/cancel"
        actor: PlatformAdmin
        preconditions:
          - "status == ACTIVE (ERR_FREEZE_WINDOW_NOT_ACTIVE)"
        side_effects:
          - "cancelled_at = current_utc"

# =============================================================================
# 1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: rule-supersede-stale-head
    parent_entity: RetentionRule
    write_endpoint: "POST /ig/retention-rules/{ruleId}/supersede"
    occ_field: "expected_retention_rule_version"
    description: |
      Authoring the successor of an ACTIVE RetentionRule whose version has
      advanced since the client last observed it is rejected with 412. This
      captures the case where another writer has just claimed the succession
      head of the same target (a supersede creation legitimately bumps the
      target's version), so the current writer's view of the succession chain
      is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: hold-release-stale-scope
    parent_entity: LegalHold
    write_endpoint: "POST /ig/legal-holds/{holdId}/release"
    occ_field: "expected_legal_hold_version"
    description: |
      Releasing a LegalHold with an expected_legal_hold_version that no longer
      matches the hold's current version is rejected with 412. Scope expansion,
      scope exclusion, custodian addition, and acknowledgments all bump
      hold.version, so a release decision made against an older observed scope
      is stale even though hold.status is still ISSUED.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: retention_due_date
    trigger: "record creation; record event_date PATCH; rule activation (plain or superseding); conflict resolution; rule supersede"
    algorithm: calendar_arithmetic
    formula: |
      anchor(rule, record):
        if rule.trigger_basis == EVENT_DATE:
          anchor = record.event_date
        if rule.trigger_basis == FISCAL_YEAR_END:
          # First program fiscal-year-end date ON OR AFTER event_date.
          # FYE for calendar year Y = date(Y, program.fiscal_year_end_month, program.fiscal_year_end_day).
          # If event_date <= FYE(year(event_date)): anchor = FYE(year(event_date))
          # else: anchor = FYE(year(event_date) + 1)
          # Boundary: event_date exactly ON the FYE anchors to that same day.
      due = add_months(anchor, rule.retention_months)
      add_months clamping: if anchor day-of-month exceeds the target month's
      length, clamp to the target month's last day (e.g., 2026-01-31 + 1 month
      -> 2026-02-28 in a non-leap year).
      record.retention_due_date = due (compared at >= for eligibility:
      record is due iff current_utc >= retention_due_date, inclusive).
    input_set: "Records with status = ACTIVE whose (record_class_id, jurisdiction_id) has a governing rule per governing_rule_selection; records with no governing rule get retention_due_date = null (posture UNSCHEDULED)"
    precision: "date granularity; all rule window and event dates interpreted at 00:00:00Z"
    variants:
      - name: event_date_basis
        when: "governing rule has trigger_basis = EVENT_DATE"
        difference: "anchor is the raw record.event_date"
      - name: fiscal_year_end_basis
        when: "governing rule has trigger_basis = FISCAL_YEAR_END"
        difference: "anchor is the first program fiscal-year-end on or after event_date — the same event_date yields a later due date than event_date_basis whenever the FYE falls after the event"

  - name: governing_rule_selection
    trigger: "governing-rule resolution for a record; conflict resolution winner determination"
    algorithm: constraint_propagation
    formula: |
      Per-record governing rule (used by retention_due_date):
        1. If an OPEN RetentionConflict exists for the record's
           (record_class_id, jurisdiction_id): no governing rule (record
           posture = CONFLICT_BLOCKED, unless HELD outranks it).
        2. Else candidates = rules with status == ACTIVE, matching
           (record_class_id, jurisdiction_id), whose half-open
           [effective_from, effective_to) window covers record.event_date
           (coverage iff effective_from <= event_date AND (effective_to is
           null OR event_date < effective_to)).
        3. The conflict/withdraw machinery guarantees |candidates| <= 1 for
           any event_date; that rule is governing. Zero candidates -> UNSCHEDULED.
      Conflict-resolution winner (used by RetentionConflict.resolve):
        winner = argmax over {incumbent, challenger} of retention_months
          (APPLY_LONGEST) or argmin (APPLY_SHORTEST);
        tie-break 1: created_at DESC (newer rule wins);
        tie-break 2: rule_code ASC (lexicographic; never id).
    input_set: "RetentionRules status = ACTIVE for record resolution; {incumbent, challenger} pair for conflict resolution"
    constants:
      TIEBREAK_1: "created_at DESC"
      TIEBREAK_2: "rule_code ASC"
    precision: "deterministic total order; no random inputs"

  - name: disposition_posture
    trigger: "computed on every Record read; recomputed by cascades from scope-item activation/exclusion/release, rule activation/resolution/supersede, clock reads"
    algorithm: constraint_propagation
    formula: |
      Evaluation order is pinned (breaks the circular-looking dependency
      between due date, holds, and conflicts):
        1. governing = governing_rule_selection(record)
        2. if governing is null because no ACTIVE window covers event_date
           (and no OPEN conflict): posture = UNSCHEDULED
        3. elif record.active_hold_count > 0: posture = HELD
        4. elif OPEN RetentionConflict exists for (class, jurisdiction):
           posture = CONFLICT_BLOCKED
        5. elif current_utc >= record.retention_due_date: posture = ELIGIBLE
        6. else: posture = RETAINED
      Note the precedence: HELD outranks CONFLICT_BLOCKED; a record under an
      active hold reports HELD even if its class is mid-conflict.
    input_set: "Record fields active_hold_count, retention_due_date, event_date, (record_class_id, jurisdiction_id); OPEN RetentionConflicts; current logical clock"
    precision: "enum; deterministic"

  - name: ack_sla_evaluation
    trigger: "HoldCustodian acknowledgment (PENDING/ESCALATED -> ACKNOWLEDGED)"
    algorithm: threshold
    formula: |
      base_due = assignment.ack_due_date
      STRICT variant:
        was_late = (acknowledged_at > base_due)     # strict >; ack exactly AT due is on time
      REMINDER_ADJUSTED variant:
        effective_due = base_due + (reminder_count_at_ack * program.reminder_interval_days)
        was_late = (acknowledged_at > effective_due)
      LegalHold.late_ack_count increments by 1 iff was_late.
    input_set: "The acknowledged HoldCustodian, program.ack_sla_mode, program.reminder_interval_days, current logical clock"
    constants:
      LATE_COMPARATOR: "strict >"
    precision: "timestamp comparison at second precision"
    variants:
      - name: strict
        when: "program.ack_sla_mode = STRICT"
        difference: "lateness measured against the original ack_due_date regardless of reminders sent"
      - name: reminder_adjusted
        when: "program.ack_sla_mode = REMINDER_ADJUSTED"
        difference: "each reminder already sent extends the due date by reminder_interval_days; identical timestamps can flip was_late from true to false"

  - name: over_preservation_cost
    trigger: "HoldAudit creation (snapshot)"
    algorithm: tiered_pricing
    formula: |
      For each over-preserved record r (posture ELIGIBLE AND auto_delete_enabled = false):
        days_over = floor((audit_created_at - r.retention_due_date) / 86400)
        months_over = floor(days_over / 30)
        monthly_cents = r.size_gb * record_class(r).monthly_storage_cost_cents_per_gb
        per_record_cost = round_half_up(monthly_cents * months_over, 0)   # integer cents
      PINNED ROUNDING ORDER: round each per-record cost to integer cents
      FIRST, then sum. Sum-then-round is FORBIDDEN (e.g., two records at
      41.25 raw cost yield 41 + 41 = 82 pinned, not round(82.5) = 83).
      total = sum(per_record_cost) over the over-preserved set; 0 when empty.
    input_set: "Records of the program with posture = ELIGIBLE and auto_delete_enabled = false at audit creation; their RecordClass monthly_storage_cost_cents_per_gb"
    constants:
      DAYS_PER_MONTH: 30
      ROUNDING: "round_half_up per record to 0 decimals, then sum"
    precision: "integer cents"

  - name: over_preservation_pct
    trigger: "HoldAudit creation (snapshot)"
    algorithm: threshold
    formula: |
      eligible = count of program records with disposition_posture = ELIGIBLE
      over = count of those with auto_delete_enabled = false
      pct = (eligible == 0) ? 0 : round_half_up(over * 100 / eligible, 2)
      threshold_breached = (pct >= program.over_preservation_warn_pct)   # inclusive
    input_set: "Program records at audit creation time"
    constants:
      EMPTY_SET_PCT: 0
      BREACH_COMPARATOR: ">= (inclusive)"
    precision: "2 decimal places, round_half_up"

  - name: stale_hold_detection
    trigger: "HoldAudit creation (snapshot)"
    algorithm: threshold
    formula: |
      hold is stale iff hold.status == ISSUED AND
        (audit_created_at - hold.last_activity_at) > program.stale_hold_days * 86400
      # strict > : activity exactly stale_hold_days ago is NOT stale
      last_activity_at = max(issued_at, latest scope-item added_at,
        latest scope-item released_at, latest assignment acknowledged_at)
    input_set: "Program LegalHolds with status = ISSUED at audit creation"
    constants:
      STALE_COMPARATOR: "strict >"
    precision: "second precision over logical clock"

  - name: obligation_reconciliation
    trigger: "HoldCustodian transitions into/out of (PENDING, ESCALATED)"
    algorithm: aggregation
    formula: |
      custodian.open_obligation_count =
        count of HoldCustodian rows with custodian_id = custodian.id
        AND status IN (PENDING, ESCALATED)
      Incremental maintenance (pin): +1 on AWAITING_ISSUANCE -> PENDING;
      -1 on PENDING/ESCALATED -> ACKNOWLEDGED; 0 on ACKNOWLEDGED -> RELEASED,
      AWAITING_ISSUANCE -> CANCELLED. Full recompute on any read of Custodian.
    input_set: "HoldCustodian rows for the custodian"
    precision: "integer"

  - name: hold_coverage_reconciliation
    trigger: "HoldScopeItem transitions into/out of ACTIVE"
    algorithm: aggregation
    formula: |
      record.active_hold_count = count of HoldScopeItem rows with
        record_id = record.id AND status = ACTIVE
      record.auto_delete_suspended = (record.active_hold_count > 0)
      hold.active_scope_count = count of HoldScopeItem rows with
        hold_id = hold.id AND status = ACTIVE
      Incremental maintenance (pin): +1 on PENDING_ISSUANCE -> ACTIVE and on
      ACTIVE-creating scope expansion; -1 on ACTIVE -> EXCLUDED and
      ACTIVE -> RELEASED. All increments/decrements atomic with the causing
      transition.
    input_set: "HoldScopeItem rows for the record / hold"
    precision: "integer"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must both be present and non-empty; X-User-Role must be one of the declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "The role in X-User-Role must be listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Resource ids in the URL path must exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: business_constraint
    check: "Request body shape: required fields present, types correct, enum values in their declared sets, dates parse, numeric ranges respected (retention_months > 0, ack_deadline_days > 0, size_gb > 0, monthly_storage_cost_cents_per_gb > 0, fiscal_year_end_month 1-12, fiscal_year_end_day valid for month)"
    error_id: ERR_INVALID_REQUEST / ERR_INVALID_ENUM_VALUE
    http_status: 400
    applies_to: "all POST/PATCH endpoints"

  - priority: 5
    category: business_temporal
    check: "Date-range sanity: effective_to > effective_from (retention rules); end_at >= start_at (freeze windows)"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 400
    applies_to: "POST /ig/retention-rules, POST /ig/disposition-freeze-windows"

  - priority: 6
    category: business_constraint
    check: "Minimum-length text: justification >= 20 chars (disposition request, APPLY_SHORTEST resolution); release_reason >= 10; rejection_reason >= 10"
    error_id: ERR_JUSTIFICATION_TOO_SHORT
    http_status: 400
    applies_to: "POST /ig/disposition-requests, POST /ig/retention-conflicts/{id}/resolve, POST /ig/legal-holds/{id}/release, POST /ig/disposition-requests/{id}/reject"

  - priority: 7
    category: business_constraint
    check: "Non-empty collections: custodian_ids and record_ids at hold creation; record_ids at request creation; record_ids at scope expansion; custodian_ids at custodian addition"
    error_id: ERR_EMPTY_COLLECTION
    http_status: 400
    applies_to: "POST /ig/legal-holds, POST /ig/disposition-requests, POST /ig/legal-holds/{id}/scope-items, POST /ig/legal-holds/{id}/custodians"

  - priority: 8
    category: existence
    check: "Entity ids referenced in the request body must exist (record_ids, custodian_ids, record_class_id, jurisdiction_id, supersedes_rule_id, program_id)"
    error_id: ERR_REFERENCED_RECORD_NOT_FOUND / ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with body-carried entity references"

  - priority: 9
    category: state
    check: "OCC precondition: expected_retention_rule_version == supersede target's current version; expected_legal_hold_version == hold.version (release)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /ig/retention-rules/{id}/supersede, POST /ig/legal-holds/{id}/release"
    note: "Evaluated before domain state checks per priority; the version the client last observed can only come from a prior response"

  - priority: 10
    category: state
    check: "Target resource state preconditions per state machine: rule DRAFT for activate, PENDING_CONFLICT for withdraw, DRAFT/ACTIVE for retire; conflict OPEN for resolve; hold DRAFT for issue/cancel, ISSUED for release, DRAFT/ISSUED for scope & custodian edits; request DRAFT for submit/withdraw, SUBMITTED for approve/reject/refresh, REJECTED for revise, APPROVED for execute; assignment PENDING/ESCALATED for acknowledge; audit OPEN for close; freeze window ACTIVE for cancel"
    error_id: ERR_RULE_INVALID_STATE / ERR_CONFLICT_NOT_OPEN / ERR_HOLD_INVALID_STATE / ERR_REQUEST_INVALID_STATE / ERR_ASSIGNMENT_NOT_ACKNOWLEDGEABLE / ERR_AUDIT_NOT_OPEN / ERR_FREEZE_WINDOW_NOT_ACTIVE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 11
    category: business_temporal
    check: "Disposition freeze: no ACTIVE DispositionFreezeWindow with start_at <= current_utc <= end_at (CLOSED interval) for the program"
    error_id: ERR_DISPOSITION_FREEZE_ACTIVE
    http_status: 409
    applies_to: "POST /ig/disposition-requests/{id}/execute, POST /ig/sweeps/auto-delete"

  - priority: 12
    category: business_referential
    check: "Same-program integrity: every body-referenced entity (records, custodians, classes, jurisdictions, rules) must carry program_id == the program the parent resource or payload names; cross-program references rejected"
    error_id: ERR_CROSS_PROGRAM_REFERENCE
    http_status: 409
    applies_to: "POST /ig/retention-rules, POST /ig/records, POST /ig/legal-holds, POST /ig/legal-holds/{id}/scope-items, POST /ig/legal-holds/{id}/custodians, POST /ig/disposition-requests, POST /ig/hold-audits"

  - priority: 13
    category: business_constraint
    check: "Uniqueness: RecordClass.code, Jurisdiction.code, Custodian.email, RetentionRule.rule_code unique per program; LegalHold.matter_ref unique per program among DRAFT/ISSUED holds; no duplicate custodian within a hold; no duplicate record within a hold scope or a disposition request"
    error_id: ERR_DUPLICATE_CODE / ERR_DUPLICATE_CUSTODIAN / ERR_DUPLICATE_MATTER_REF / ERR_DUPLICATE_SCOPE_RECORD / ERR_DUPLICATE_REQUEST_ITEM
    http_status: 409
    applies_to: "creation and expansion endpoints"

  - priority: 14
    category: business_safety
    check: "Held/destroyed record protection: records with status DESTROYED cannot be scoped into holds, added to new disposition requests, or PATCHed"
    error_id: ERR_RECORD_ALREADY_DESTROYED
    http_status: 409
    applies_to: "POST /ig/legal-holds, POST /ig/legal-holds/{id}/scope-items, POST /ig/disposition-requests, PATCH /ig/records/{id}"

  - priority: 15
    category: business_safety
    check: "Ownership: acknowledge requires X-User-ID == assignment.custodian_id; submit/refresh/revise/withdraw require X-User-ID == request.requester_user_id"
    error_id: ERR_NOT_CUSTODIAN_OF_ASSIGNMENT / ERR_NOT_REQUEST_OWNER
    http_status: 403
    applies_to: "POST /ig/hold-custodians/{id}/acknowledge, POST /ig/disposition-requests/{id}/{submit,refresh-snapshots,revise,withdraw}"

  - priority: 16
    category: business_safety
    check: "Segregation of duties: disposition approver's X-User-ID must differ from request.requester_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /ig/disposition-requests/{id}/approve"

  - priority: 17
    category: business_safety
    check: "Conflict gate: approve rejected while any OPEN RetentionConflict covers an item's (record_class_id, jurisdiction_id)"
    error_id: ERR_DISPOSITION_CONFLICT_BLOCKED
    http_status: 409
    applies_to: "POST /ig/disposition-requests/{id}/approve"

  - priority: 18
    category: business_safety
    check: "Eligibility gate: submit/refresh require every item's record posture == ELIGIBLE; approve additionally requires stale_item_count == 0 (checked first) and a current posture re-check of every item"
    error_id: ERR_RECORD_NOT_ELIGIBLE / ERR_STALE_ELIGIBILITY_SNAPSHOT
    http_status: 409
    applies_to: "POST /ig/disposition-requests/{id}/{submit,refresh-snapshots,approve}"

  - priority: 19
    category: business_safety
    check: "Hold release gate: all custodian assignments must be ACKNOWLEDGED before release"
    error_id: ERR_HOLD_HAS_UNACKNOWLEDGED_CUSTODIANS
    http_status: 409
    applies_to: "POST /ig/legal-holds/{id}/release"

  - priority: 20
    category: business_safety
    check: "APPLY_SHORTEST regulatory downgrade requires LegalCounsel role"
    error_id: ERR_SHORTEST_STRATEGY_REQUIRES_COUNSEL
    http_status: 403
    applies_to: "POST /ig/retention-conflicts/{id}/resolve"

  - priority: 21
    category: business_referential
    check: "Retire protection: an ACTIVE rule governing at least one record cannot be retired"
    error_id: ERR_RULE_HAS_GOVERNED_RECORDS
    http_status: 409
    applies_to: "POST /ig/retention-rules/{id}/retire"

  - priority: 22
    category: business_constraint
    check: "Freeze window overlap: a new ACTIVE window must not overlap any existing ACTIVE window for the program under CLOSED-interval semantics (overlap iff start_at <= other.end_at AND other.start_at <= end_at; shared boundary timestamps ARE overlap)"
    error_id: ERR_FREEZE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /ig/disposition-freeze-windows"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Governance Programs ---
  - method: POST
    path: "/ig/programs"
    description: "Create a governance program (config is immutable after creation)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, fiscal_year_end_month, fiscal_year_end_day, "ack_deadline_days?", "reminder_interval_days?", "max_reminders_before_escalation?", "stale_hold_days?", "over_preservation_warn_pct?", "ack_sla_mode?"]
    output: GovernanceProgram
    side_effects: ["config defaults applied per entity field defaults"]

  - method: GET
    path: "/ig/programs"
    description: "List governance programs"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor, Custodian]
    code: 200
    input: ["limit?", "offset?"]
    output: "GovernanceProgram[]"
    side_effects: []

  - method: GET
    path: "/ig/programs/{programId}"
    description: "Get a governance program"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor, Custodian]
    code: 200
    input: []
    output: GovernanceProgram
    side_effects: []

  # --- Record Classes ---
  - method: POST
    path: "/ig/record-classes"
    description: "Create a record class"
    roles: [PlatformAdmin]
    code: 201
    input: [program_id, code, name, monthly_storage_cost_cents_per_gb]
    output: RecordClass
    side_effects: []

  - method: GET
    path: "/ig/record-classes"
    description: "List record classes"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor, Custodian]
    code: 200
    input: ["program_id?", "limit?", "offset?"]
    output: "RecordClass[]"
    side_effects: []

  - method: GET
    path: "/ig/record-classes/{classId}"
    description: "Get a record class"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor, Custodian]
    code: 200
    input: []
    output: RecordClass
    side_effects: []

  # --- Jurisdictions ---
  - method: POST
    path: "/ig/jurisdictions"
    description: "Create a jurisdiction"
    roles: [PlatformAdmin]
    code: 201
    input: [program_id, code, name]
    output: Jurisdiction
    side_effects: []

  - method: GET
    path: "/ig/jurisdictions"
    description: "List jurisdictions"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor, Custodian]
    code: 200
    input: ["program_id?", "limit?", "offset?"]
    output: "Jurisdiction[]"
    side_effects: []

  - method: GET
    path: "/ig/jurisdictions/{jurisdictionId}"
    description: "Get a jurisdiction"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor, Custodian]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []

  # --- Custodians ---
  - method: POST
    path: "/ig/custodians"
    description: "Register a custodian"
    roles: [RecordsManager]
    code: 201
    input: [program_id, email, full_name, department]
    output: Custodian
    side_effects: ["open_obligation_count initialized to 0"]

  - method: GET
    path: "/ig/custodians"
    description: "List custodians"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor, Custodian]
    code: 200
    input: ["program_id?", "limit?", "offset?"]
    output: "Custodian[]"
    side_effects: []

  - method: GET
    path: "/ig/custodians/{custodianId}"
    description: "Get a custodian"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor, Custodian]
    code: 200
    input: []
    output: Custodian
    side_effects: []

  # --- Retention Rules ---
  - method: POST
    path: "/ig/retention-rules"
    description: "Author a retention rule (DRAFT). Succession of an existing ACTIVE rule is declared via the dedicated supersede endpoint below, never here"
    roles: [RecordsManager]
    code: 201
    input: [program_id, record_class_id, jurisdiction_id, rule_code, retention_months, trigger_basis, effective_from, "effective_to?"]
    output: RetentionRule
    side_effects:
      - "status = DRAFT"

  - method: POST
    path: "/ig/retention-rules/{ruleId}/supersede"
    description: "Author the successor (DRAFT) of the ACTIVE rule at {ruleId}; program/class/jurisdiction are inherited from the target; OCC on the target's version claims the succession head"
    roles: [RecordsManager]
    code: 201
    input: [rule_code, retention_months, trigger_basis, effective_from, "effective_to?", expected_retention_rule_version]
    output: RetentionRule
    side_effects:
      - "New rule created with status = DRAFT, supersedes_rule_id = {ruleId}, program_id/record_class_id/jurisdiction_id inherited from target"
      - "increments RetentionRule.version of the supersede target by 1 (succession head claimed)"

  - method: GET
    path: "/ig/retention-rules"
    description: "List retention rules"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor, Custodian]
    code: 200
    input: ["program_id?", "record_class_id?", "jurisdiction_id?", "status?", "supersedes_rule_id?", "superseded_by_id?", "limit?", "offset?"]
    output: "RetentionRule[]"
    side_effects: []

  - method: GET
    path: "/ig/retention-rules/{ruleId}"
    description: "Get a retention rule"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor, Custodian]
    code: 200
    input: []
    output: RetentionRule
    side_effects: []

  - method: POST
    path: "/ig/retention-rules/{ruleId}/activate"
    description: "Activate a DRAFT rule; without overlap -> ACTIVE (supersede target if declared -> SUPERSEDED, increments target RetentionRule.version by 1); with undeclared overlap -> PENDING_CONFLICT and an OPEN RetentionConflict is created"
    roles: [RecordsManager]
    code: 200
    input: []
    output: RetentionRule
    side_effects:
      - "status -> ACTIVE or PENDING_CONFLICT per conflict detection (half-open window overlap)"
      - "On succession: supersede target -> SUPERSEDED, increments RetentionRule.version by 1"
      - "On PENDING_CONFLICT: creates RetentionConflict (OPEN)"
      - "Record recompute cascade over matching (class, jurisdiction); stale_item_count adjustments on SUBMITTED/APPROVED requests"

  - method: POST
    path: "/ig/retention-rules/{ruleId}/withdraw"
    description: "Withdraw a PENDING_CONFLICT challenger back to DRAFT; linked conflict -> WITHDRAWN"
    roles: [RecordsManager]
    code: 200
    input: []
    output: RetentionRule
    side_effects: ["status -> DRAFT", "linked RetentionConflict -> WITHDRAWN"]

  - method: POST
    path: "/ig/retention-rules/{ruleId}/retire"
    description: "Retire a DRAFT rule, or an ACTIVE rule governing zero records"
    roles: [RecordsManager]
    code: 200
    input: []
    output: RetentionRule
    side_effects: ["status -> RETIRED"]

  # --- Retention Conflicts ---
  - method: GET
    path: "/ig/retention-conflicts"
    description: "List retention conflicts"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor, Custodian]
    code: 200
    input: ["program_id?", "status?", "record_class_id?", "jurisdiction_id?", "incumbent_rule_id?", "challenger_rule_id?", "governing_rule_id?", "limit?", "offset?"]
    output: "RetentionConflict[]"
    side_effects: []

  - method: GET
    path: "/ig/retention-conflicts/{conflictId}"
    description: "Get a retention conflict"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor, Custodian]
    code: 200
    input: []
    output: RetentionConflict
    side_effects: []

  - method: POST
    path: "/ig/retention-conflicts/{conflictId}/resolve"
    description: "Resolve an OPEN conflict; APPLY_LONGEST keeps the longer retention, APPLY_SHORTEST the shorter (LegalCounsel only, justification >= 20 chars)"
    roles: [RecordsManager, LegalCounsel]
    code: 200
    input: [strategy, "justification?"]
    output: RetentionConflict
    side_effects:
      - "Winner ACTIVE (challenger promoted) or incumbent stays ACTIVE; loser -> SUPERSEDED, increments loser RetentionRule.version by 1"
      - "Conflict -> RESOLVED with governing_rule_id, resolution_strategy, resolution_justification, resolved_by_user_id"
      - "Record recompute cascade over the contested (class, jurisdiction); stale_item_count adjustments on SUBMITTED/APPROVED requests"

  # --- Records ---
  - method: POST
    path: "/ig/records"
    description: "Register a record; retention_due_date, governing_rule_id, disposition_posture computed at creation"
    roles: [RecordsManager]
    code: 201
    input: [program_id, record_class_id, jurisdiction_id, title, source_system, event_date, size_gb, "owner_custodian_id?", "auto_delete_enabled?"]
    output: Record
    side_effects:
      - "status = ACTIVE"
      - "retention_due_date/governing_rule_id computed via retention_due_date + governing_rule_selection"

  - method: GET
    path: "/ig/records"
    description: "List records"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor]
    code: 200
    input: ["program_id?", "record_class_id?", "jurisdiction_id?", "owner_custodian_id?", "governing_rule_id?", "disposition_posture?", "status?", "limit?", "offset?"]
    output: "Record[]"
    side_effects: []

  - method: GET
    path: "/ig/records/{recordId}"
    description: "Get a record (posture computed on read against the logical clock)"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor]
    code: 200
    input: []
    output: Record
    side_effects: []

  - method: PATCH
    path: "/ig/records/{recordId}"
    description: "Correct record metadata; event_date change recomputes retention_due_date and posture; forbidden once DESTROYED"
    roles: [RecordsManager]
    code: 200
    input: ["title?", "size_gb?", "event_date?"]
    output: Record
    side_effects:
      - "On event_date change: retention_due_date/governing_rule_id/posture recomputed; stale_item_count adjustments on SUBMITTED/APPROVED requests containing this record"

  # --- Legal Holds ---
  - method: POST
    path: "/ig/legal-holds"
    description: "Create a legal hold (DRAFT) with initial custodians and record scope; assignments AWAITING_ISSUANCE, scope items PENDING_ISSUANCE"
    roles: [LegalCounsel]
    code: 201
    input: [program_id, matter_ref, title, reason, custodian_ids, record_ids]
    output: LegalHold
    side_effects:
      - "status = DRAFT; created_by_user_id = X-User-ID"
      - "HoldCustodian rows created (AWAITING_ISSUANCE); HoldScopeItem rows created (PENDING_ISSUANCE)"

  - method: GET
    path: "/ig/legal-holds"
    description: "List legal holds"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor, Custodian]
    code: 200
    input: ["program_id?", "status?", "custodian_id?", "limit?", "offset?"]
    output: "LegalHold[]"
    side_effects: []

  - method: GET
    path: "/ig/legal-holds/{holdId}"
    description: "Get a legal hold"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor, Custodian]
    code: 200
    input: []
    output: LegalHold
    side_effects: []

  - method: POST
    path: "/ig/legal-holds/{holdId}/issue"
    description: "Issue a DRAFT hold: activates scope (suspends auto-deletion on every scoped record) and starts custodian acknowledgment clocks"
    roles: [LegalCounsel]
    code: 200
    input: []
    output: LegalHold
    side_effects:
      - "status -> ISSUED; issued_at/last_activity_at = current_utc; increments LegalHold.version by 1"
      - "Scope items PENDING_ISSUANCE -> ACTIVE with per-record cascade (active_hold_count += 1, auto_delete_suspended = true, posture recompute, stale_item_count adjustments)"
      - "Assignments AWAITING_ISSUANCE -> PENDING with ack_due_date; Custodian.open_obligation_count += 1 each"
      - "ReminderLog ISSUED_NOTICE per custodian"

  - method: POST
    path: "/ig/legal-holds/{holdId}/cancel"
    description: "Cancel a DRAFT hold (never issued); assignments and scope items CANCELLED without record cascades"
    roles: [LegalCounsel]
    code: 200
    input: []
    output: LegalHold
    side_effects: ["status -> CANCELLED", "children -> CANCELLED", "ReminderLog CANCEL_NOTICE per custodian"]

  - method: POST
    path: "/ig/legal-holds/{holdId}/release"
    description: "Release an ISSUED hold; OCC-guarded against stale scope view; all custodians must have acknowledged"
    roles: [LegalCounsel]
    code: 200
    input: [release_reason, expected_legal_hold_version]
    output: LegalHold
    side_effects:
      - "status -> RELEASED; released_at set; increments LegalHold.version by 1"
      - "Scope items ACTIVE -> RELEASED with per-record cascade (active_hold_count -= 1, auto_delete_suspended recompute, posture recompute, stale_item_count adjustments)"
      - "Assignments ACKNOWLEDGED -> RELEASED"
      - "ReminderLog RELEASE_NOTICE per custodian"

  - method: POST
    path: "/ig/legal-holds/{holdId}/scope-items"
    description: "Expand hold scope with additional records (DRAFT -> PENDING_ISSUANCE items; ISSUED -> immediately ACTIVE items with full cascade); increments LegalHold.version by 1 on ISSUED holds"
    roles: [LegalCounsel]
    code: 201
    input: [record_ids]
    output: "HoldScopeItem[]"
    side_effects:
      - "Items created; on ISSUED holds: ACTIVE with per-record cascade (active_hold_count += 1, auto_delete_suspended = true, posture recompute, stale_item_count adjustments)"
      - "increments LegalHold.version by 1; last_activity_at = current_utc (ISSUED holds)"

  - method: DELETE
    path: "/ig/legal-holds/{holdId}/scope-items/{itemId}"
    description: "Exclude a scope item: DRAFT -> item CANCELLED (no cascade); ISSUED -> item EXCLUDED with reverse cascade"
    roles: [LegalCounsel]
    code: 204
    input: []
    output: null
    side_effects:
      - "Item -> CANCELLED (DRAFT) or EXCLUDED (ISSUED)"
      - "On exclusion: Record.active_hold_count -= 1, auto_delete_suspended recompute, posture recompute, stale_item_count adjustments"
      - "increments LegalHold.version by 1; last_activity_at = current_utc (ISSUED holds)"

  - method: POST
    path: "/ig/legal-holds/{holdId}/custodians"
    description: "Add custodians to a DRAFT or ISSUED hold; on ISSUED holds assignments start PENDING immediately with ack_due_date = current_utc + ack_deadline_days"
    roles: [LegalCounsel]
    code: 201
    input: [custodian_ids]
    output: "HoldCustodian[]"
    side_effects:
      - "Assignments created (AWAITING_ISSUANCE on DRAFT; PENDING on ISSUED with open_obligation_count += 1 each)"
      - "increments LegalHold.version by 1; last_activity_at = current_utc (ISSUED holds)"

  # --- Hold Custodian assignments ---
  - method: GET
    path: "/ig/hold-custodians"
    description: "List hold custodian assignments"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor, Custodian]
    code: 200
    input: ["hold_id?", "custodian_id?", "status?", "program_id?", "limit?", "offset?"]
    output: "HoldCustodian[]"
    side_effects: []

  - method: GET
    path: "/ig/hold-custodians/{assignmentId}"
    description: "Get a hold custodian assignment"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor, Custodian]
    code: 200
    input: []
    output: HoldCustodian
    side_effects: []

  - method: POST
    path: "/ig/hold-custodians/{assignmentId}/acknowledge"
    description: "Custodian acknowledges their own assignment (PENDING or ESCALATED -> ACKNOWLEDGED); computes was_late per program ack_sla_mode"
    roles: [Custodian]
    code: 200
    input: []
    output: HoldCustodian
    side_effects:
      - "status -> ACKNOWLEDGED; acknowledged_at = current_utc; was_late computed"
      - "Custodian.open_obligation_count -= 1; if was_late: LegalHold.late_ack_count += 1"
      - "LegalHold.all_acknowledged recomputed; last_activity_at = current_utc; increments LegalHold.version by 1"

  # --- Hold Scope Items (read) ---
  - method: GET
    path: "/ig/hold-scope-items"
    description: "List hold scope items"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor, Custodian]
    code: 200
    input: ["hold_id?", "record_id?", "status?", "program_id?", "limit?", "offset?"]
    output: "HoldScopeItem[]"
    side_effects: []

  - method: GET
    path: "/ig/hold-scope-items/{itemId}"
    description: "Get a hold scope item"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor, Custodian]
    code: 200
    input: []
    output: HoldScopeItem
    side_effects: []

  # --- Disposition Requests ---
  - method: POST
    path: "/ig/disposition-requests"
    description: "Create a disposition request (DRAFT) with per-record items (PENDING, no snapshots until submit)"
    roles: [RecordsManager]
    code: 201
    input: [program_id, record_ids, method, justification]
    output: DispositionRequest
    side_effects:
      - "status = DRAFT; requester_user_id = X-User-ID; stale_item_count = 0"
      - "DispositionItem rows created (PENDING)"

  - method: GET
    path: "/ig/disposition-requests"
    description: "List disposition requests"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor]
    code: 200
    input: ["program_id?", "status?", "requester_user_id?", "limit?", "offset?"]
    output: "DispositionRequest[]"
    side_effects: []

  - method: GET
    path: "/ig/disposition-requests/{requestId}"
    description: "Get a disposition request"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor]
    code: 200
    input: []
    output: DispositionRequest
    side_effects: []

  - method: POST
    path: "/ig/disposition-requests/{requestId}/submit"
    description: "Submit a DRAFT request; captures eligibility snapshots; every record must currently be ELIGIBLE"
    roles: [RecordsManager]
    code: 200
    input: []
    output: DispositionRequest
    side_effects: ["status -> SUBMITTED; submitted_at set; per-item snapshots captured; stale_item_count reset to 0"]

  - method: POST
    path: "/ig/disposition-requests/{requestId}/refresh-snapshots"
    description: "Re-capture eligibility snapshots on a SUBMITTED request; fails if any record is not currently ELIGIBLE; clears stale_item_count"
    roles: [RecordsManager]
    code: 200
    input: []
    output: DispositionRequest
    side_effects: ["snapshots re-captured; stale_item_count reset to 0"]

  - method: POST
    path: "/ig/disposition-requests/{requestId}/approve"
    description: "Approve a SUBMITTED request (LegalCounsel); segregation of duties enforced against requester_user_id"
    roles: [LegalCounsel]
    code: 200
    input: []
    output: DispositionRequest
    side_effects: ["status -> APPROVED; decided_at/decided_by_user_id set"]

  - method: POST
    path: "/ig/disposition-requests/{requestId}/reject"
    description: "Reject a SUBMITTED request with reason"
    roles: [LegalCounsel]
    code: 200
    input: [rejection_reason]
    output: DispositionRequest
    side_effects: ["status -> REJECTED; decided_at/decided_by_user_id set; rejection_reason stored"]

  - method: POST
    path: "/ig/disposition-requests/{requestId}/revise"
    description: "Return a REJECTED request to DRAFT for rework (revision loop); snapshots and rejection cleared"
    roles: [RecordsManager]
    code: 200
    input: []
    output: DispositionRequest
    side_effects: ["status -> DRAFT; snapshots cleared; stale_item_count reset to 0"]

  - method: POST
    path: "/ig/disposition-requests/{requestId}/withdraw"
    description: "Withdraw a DRAFT request"
    roles: [RecordsManager]
    code: 200
    input: []
    output: DispositionRequest
    side_effects: ["status -> WITHDRAWN"]

  - method: POST
    path: "/ig/disposition-requests/{requestId}/execute"
    description: "Execute an APPROVED request: per-item conditional destruction with certificates; held/conflicted records skipped, already-destroyed records skipped"
    roles: [RecordsManager]
    code: 200
    input: []
    output: DispositionRequest
    side_effects:
      - "Per item, processed in request creation order (the record_ids order): DESTROYED (record -> DESTROYED + DestructionCertificate) | SKIPPED_HELD | SKIPPED_ALREADY_DESTROYED; certificate_seq assigned in that processing order"
      - "status -> EXECUTED; executed_at set"

  # --- Disposition Items (read) ---
  - method: GET
    path: "/ig/disposition-items"
    description: "List disposition items"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor]
    code: 200
    input: ["request_id?", "record_id?", "status?", "program_id?", "limit?", "offset?"]
    output: "DispositionItem[]"
    side_effects: []

  - method: GET
    path: "/ig/disposition-items/{itemId}"
    description: "Get a disposition item"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor]
    code: 200
    input: []
    output: DispositionItem
    side_effects: []

  # --- Destruction Certificates (read-only, immutable) ---
  - method: GET
    path: "/ig/destruction-certificates"
    description: "List destruction certificates (defensible deletion documentation)"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor]
    code: 200
    input: ["program_id?", "record_id?", "request_id?", "disposition_item_id?", "limit?", "offset?"]
    output: "DestructionCertificate[]"
    side_effects: []

  - method: GET
    path: "/ig/destruction-certificates/{certificateId}"
    description: "Get a destruction certificate"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor]
    code: 200
    input: []
    output: DestructionCertificate
    side_effects: []

  # --- Hold Audits ---
  - method: POST
    path: "/ig/hold-audits"
    description: "Open a hold inventory audit; computes snapshot fields including stale holds, over-preservation counts/pct/cost, threshold breach"
    roles: [Auditor]
    code: 201
    input: [program_id]
    output: HoldAudit
    side_effects: ["snapshot fields computed at creation per over_preservation_cost / over_preservation_pct / stale_hold_detection"]

  - method: GET
    path: "/ig/hold-audits"
    description: "List hold audits"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: "HoldAudit[]"
    side_effects: []

  - method: GET
    path: "/ig/hold-audits/{auditId}"
    description: "Get a hold audit"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor]
    code: 200
    input: []
    output: HoldAudit
    side_effects: []

  - method: POST
    path: "/ig/hold-audits/{auditId}/close"
    description: "Close an OPEN audit; snapshot fields remain as computed at creation"
    roles: [Auditor]
    code: 200
    input: []
    output: HoldAudit
    side_effects: ["status -> CLOSED; closed_at set"]

  # --- Reminder Log (read-only, append-only) ---
  - method: GET
    path: "/ig/reminder-logs"
    description: "List reminder/notification log entries"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor]
    code: 200
    input: ["program_id?", "hold_id?", "hold_custodian_id?", "custodian_id?", "kind?", "limit?", "offset?"]
    output: "ReminderLog[]"
    side_effects: []

  - method: GET
    path: "/ig/reminder-logs/{logId}"
    description: "Get a reminder log entry"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor]
    code: 200
    input: []
    output: ReminderLog
    side_effects: []

  # --- Disposition Freeze Windows ---
  - method: POST
    path: "/ig/disposition-freeze-windows"
    description: "Create a disposition freeze window (CLOSED interval); overlapping an existing ACTIVE window is rejected"
    roles: [PlatformAdmin]
    code: 201
    input: [program_id, start_at, end_at, reason]
    output: DispositionFreezeWindow
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/ig/disposition-freeze-windows"
    description: "List disposition freeze windows"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: "DispositionFreezeWindow[]"
    side_effects: []

  - method: GET
    path: "/ig/disposition-freeze-windows/{windowId}"
    description: "Get a disposition freeze window"
    roles: [PlatformAdmin, RecordsManager, LegalCounsel, Auditor]
    code: 200
    input: []
    output: DispositionFreezeWindow
    side_effects: []

  - method: POST
    path: "/ig/disposition-freeze-windows/{windowId}/cancel"
    description: "Cancel an ACTIVE freeze window"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: DispositionFreezeWindow
    side_effects: ["status -> CANCELLED; cancelled_at set"]

  # --- Sweeps (scheduled batch operations) ---
  - method: POST
    path: "/ig/sweeps/reminders"
    description: "Run the custodian reminder sweep: every PENDING assignment strictly past ack_due_date gets a REMINDER (reminder_count += 1) or, once reminder_count >= program.max_reminders_before_escalation, escalates to ESCALATED"
    roles: [RecordsManager]
    code: 200
    input: [program_id]
    output: { reminders_sent: integer, escalations_raised: integer }
    side_effects: ["HoldCustodian reminder/escalation transitions", "ReminderLog entries"]

  - method: POST
    path: "/ig/sweeps/auto-delete"
    description: "Run the auto-deletion sweep: destroys every program record with posture ELIGIBLE, auto_delete_enabled = true, auto_delete_suspended = false; blocked wholesale by an ACTIVE freeze window covering current_utc"
    roles: [RecordsManager]
    code: 200
    input: [program_id, method]
    output: { destroyed_count: integer, certificate_ids: "string[]" }
    side_effects: ["Records -> DESTROYED", "DestructionCertificates created in record processing order: created_at ASC, tie-break title ASC (never id)"]

  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Logical clock advanced; time-dependent computed fields (disposition_posture, was_late, staleness) reflect the new clock on next read"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, empty, or role not declared" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint" }

  # --- Existence ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist (checked left-to-right)" }
  - { id: ERR_REFERENCED_RECORD_NOT_FOUND, http: 404, condition: "A record id in the request body does not exist" }
  - { id: ERR_REFERENCED_ENTITY_NOT_FOUND, http: 404, condition: "A non-record entity id in the request body (custodian, rule, class, jurisdiction, program) does not exist" }

  # --- Request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, numeric range violation (retention_months <= 0, size_gb <= 0, fiscal year end invalid, etc.)" }
  - { id: ERR_INVALID_ENUM_VALUE, http: 400, condition: "Enum field value outside its declared set (trigger_basis, ack_sla_mode, method, strategy, disposition_posture filter)" }
  - { id: ERR_INVALID_DATE_RANGE, http: 400, condition: "effective_to <= effective_from on a rule, or end_at < start_at on a freeze window" }
  - { id: ERR_JUSTIFICATION_TOO_SHORT, http: 400, condition: "justification < 20 chars (request creation, APPLY_SHORTEST), release_reason < 10, or rejection_reason < 10" }
  - { id: ERR_EMPTY_COLLECTION, http: 400, condition: "custodian_ids or record_ids empty at hold creation; record_ids empty at request creation or scope expansion; custodian_ids empty at custodian addition" }

  # --- Concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_retention_rule_version mismatches the supersede target's current version, or expected_legal_hold_version mismatches the hold's current version" }

  # --- State ---
  - { id: ERR_RULE_INVALID_STATE, http: 409, condition: "Rule not DRAFT for activate, not PENDING_CONFLICT for withdraw, not DRAFT/ACTIVE for retire" }
  - { id: ERR_SUPERSEDE_TARGET_NOT_ACTIVE, http: 409, condition: "supersedes_rule_id names a rule that is not currently ACTIVE (checked at creation and again at activation)" }
  - { id: ERR_RULE_HAS_GOVERNED_RECORDS, http: 409, condition: "Retiring an ACTIVE rule that still governs at least one ACTIVE-status record (DESTROYED tombstones do not block)" }
  - { id: ERR_CONFLICT_NOT_OPEN, http: 409, condition: "Resolving a RetentionConflict that is RESOLVED or WITHDRAWN" }
  - { id: ERR_HOLD_INVALID_STATE, http: 409, condition: "Hold not DRAFT for issue/cancel, not ISSUED for release/exclusion, not DRAFT/ISSUED for scope or custodian edits" }
  - { id: ERR_EMPTY_HOLD_SCOPE, http: 409, condition: "Issuing a hold with zero PENDING_ISSUANCE scope items or zero AWAITING_ISSUANCE custodians" }
  - { id: ERR_HOLD_HAS_UNACKNOWLEDGED_CUSTODIANS, http: 409, condition: "Releasing a hold while any assignment is PENDING or ESCALATED" }
  - { id: ERR_REQUEST_INVALID_STATE, http: 409, condition: "Request not DRAFT for submit/withdraw, not SUBMITTED for approve/reject/refresh, not REJECTED for revise, not APPROVED for execute" }
  - { id: ERR_ASSIGNMENT_NOT_ACKNOWLEDGEABLE, http: 409, condition: "Acknowledging an assignment not in PENDING or ESCALATED" }
  - { id: ERR_AUDIT_NOT_OPEN, http: 409, condition: "Closing an audit that is not OPEN" }
  - { id: ERR_FREEZE_WINDOW_NOT_ACTIVE, http: 409, condition: "Cancelling a freeze window that is not ACTIVE" }

  # --- Uniqueness / overlap ---
  - { id: ERR_DUPLICATE_CODE, http: 409, condition: "RecordClass.code, Jurisdiction.code, or RetentionRule.rule_code already exists in the program" }
  - { id: ERR_DUPLICATE_CUSTODIAN, http: 409, condition: "Custodian email already exists in the program, or custodian already assigned to the hold" }
  - { id: ERR_DUPLICATE_MATTER_REF, http: 409, condition: "matter_ref already used by a DRAFT or ISSUED hold in the program" }
  - { id: ERR_DUPLICATE_SCOPE_RECORD, http: 409, condition: "Record already in the hold's scope with status PENDING_ISSUANCE or ACTIVE" }
  - { id: ERR_DUPLICATE_REQUEST_ITEM, http: 409, condition: "Same record id appears twice in a disposition request" }
  - { id: ERR_FREEZE_WINDOW_OVERLAP, http: 409, condition: "New freeze window overlaps an existing ACTIVE window under CLOSED-interval semantics (shared boundary counts as overlap)" }

  # --- Temporal ---
  - { id: ERR_DISPOSITION_FREEZE_ACTIVE, http: 409, condition: "An ACTIVE freeze window covers current_utc (start_at <= now <= end_at); blocks disposition execution and auto-delete sweeps" }

  # --- Safety / compliance ---
  - { id: ERR_RECORD_ALREADY_DESTROYED, http: 409, condition: "Scoping, requesting, or patching a record with status DESTROYED" }
  - { id: ERR_RECORD_NOT_ELIGIBLE, http: 409, condition: "Submit/refresh/approve finds a record whose disposition_posture is not ELIGIBLE; message names the first failing record_id in request creation order" }
  - { id: ERR_STALE_ELIGIBILITY_SNAPSHOT, http: 409, condition: "Approving a request whose stale_item_count > 0 (posture drift since submit)" }
  - { id: ERR_DISPOSITION_CONFLICT_BLOCKED, http: 409, condition: "Approving while an OPEN RetentionConflict covers an item's (record_class_id, jurisdiction_id)" }
  - { id: ERR_CROSS_PROGRAM_REFERENCE, http: 409, condition: "Body-referenced entity's program_id differs from the target program" }
  - { id: ERR_NOT_REQUEST_OWNER, http: 403, condition: "submit/refresh-snapshots/revise/withdraw by a user other than requester_user_id" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Approver X-User-ID equals request.requester_user_id" }
  - { id: ERR_NOT_CUSTODIAN_OF_ASSIGNMENT, http: 403, condition: "Acknowledging an assignment whose custodian_id differs from X-User-ID" }
  - { id: ERR_SHORTEST_STRATEGY_REQUIRES_COUNSEL, http: 403, condition: "APPLY_SHORTEST resolution attempted by a non-LegalCounsel role" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform administrator; owns program setup, controlled vocabularies (record classes, jurisdictions), freeze windows, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /ig/programs"
      - "POST /ig/record-classes"
      - "POST /ig/jurisdictions"
      - "POST /ig/disposition-freeze-windows"
      - "POST /ig/disposition-freeze-windows/{id}/cancel"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints except none — full read access"

  - name: RecordsManager
    description: "Records manager; owns the retention schedule, records, custodian registry, disposition request lifecycle (except approval), and sweeps"
    identity: opaque
    exclusive_operations:
      - "POST /ig/custodians"
      - "POST /ig/retention-rules, POST .../supersede, POST .../activate, POST .../withdraw, POST .../retire"
      - "POST /ig/records, PATCH /ig/records/{id}"
      - "POST /ig/disposition-requests, POST .../submit, .../refresh-snapshots, .../revise, .../withdraw, .../execute"
      - "POST /ig/sweeps/reminders, POST /ig/sweeps/auto-delete"
    shared_operations:
      - "POST /ig/retention-conflicts/{id}/resolve (APPLY_LONGEST only; shared with LegalCounsel)"
      - "GET endpoints except Custodian-only scope (all GETs except none; see endpoint table)"

  - name: LegalCounsel
    description: "Legal counsel; owns legal hold lifecycle (create, issue, expand, release, cancel) and disposition approval decisions"
    identity: opaque
    exclusive_operations:
      - "POST /ig/legal-holds, POST .../issue, .../cancel, .../release, .../scope-items, DELETE .../scope-items/{id}, POST .../custodians"
      - "POST /ig/disposition-requests/{id}/approve, POST .../reject"
      - "POST /ig/retention-conflicts/{id}/resolve with strategy APPLY_SHORTEST"
    shared_operations:
      - "POST /ig/retention-conflicts/{id}/resolve with strategy APPLY_LONGEST (shared with RecordsManager)"
      - "GET endpoints (see endpoint table)"

  - name: Auditor
    description: "Compliance auditor; runs hold inventory audits and reads everything except custodian self-service scope"
    identity: opaque
    exclusive_operations:
      - "POST /ig/hold-audits"
      - "POST /ig/hold-audits/{id}/close"
    shared_operations:
      - "GET endpoints (see endpoint table)"

  - name: Custodian
    description: "Entity-backed records custodian; acknowledges own hold assignments and views holds/scope they are obligated under; cannot read records, disposition requests, certificates, audits, or reminder logs"
    identity: "entity_backed:Custodian"
    exclusive_operations:
      - "POST /ig/hold-custodians/{id}/acknowledge (own assignments only: X-User-ID == assignment.custodian_id)"
    shared_operations:
      - "GET /ig/programs, /ig/record-classes, /ig/jurisdictions, /ig/custodians, /ig/retention-rules, /ig/retention-conflicts, /ig/legal-holds, /ig/hold-custodians, /ig/hold-scope-items (list and detail)"
