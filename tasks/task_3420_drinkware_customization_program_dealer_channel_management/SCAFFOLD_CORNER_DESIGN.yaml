      - name: allocation_window_temporal_edges
        claim_type: Violation → Error
        grounds:
          - validations[priority=10]
          - errors.ERR_ALLOCATION_WINDOW_NOT_OPEN
          - errors.ERR_ALLOCATION_WINDOW_OPEN
          - errors.ERR_ALLOCATION_WINDOW_CLOSED
        distinguishing_aspect: "Three temporal edges in one window lifecycle: open-allocation before opens_at (422 NOT_OPEN), lock-allocation before closes_at (422 OPEN), an allocation request at exactly closes_at (422 CLOSED — strict less-than), then the lock at exactly closes_at succeeds."
        test_recipe:
          setup:
            - "Clock set; dealer authorized via canonical chain; line and drop with window 2026-09-05T00:00:00Z .. 2026-09-10T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_dealer
            - *c_app
            - *c_sched
            - *c_clock2
            - *c_record
            - *c_docs
            - *c_decide
            - *c_line
            - call: "POST /drinkware/colorway-drops"
              payload: { product_line_id: "${c_line}", color_name: "Window Wine", pantone_code: "PMS 1815", drop_type: "STANDARD", total_units: 40, dtc_reserved_units: 10, dealer_unit_price_cents: 1000, allocation_opens_at: "2026-09-05T00:00:00Z", allocation_closes_at: "2026-09-10T00:00:00Z", go_live_at: "2026-12-01T00:00:00Z", sales_end_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { drop_we: $.data.id }
          trigger:
            - call: "POST /drinkware/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drinkware/colorway-drops/${drop_we}/open-allocation"
              payload: {}
              as: PlatformAdmin
              captures: { err_not_open: $.data.error_id }
            - call: "POST /drinkware/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drinkware/colorway-drops/${drop_we}/open-allocation"
              payload: {}
              as: PlatformAdmin
            - call: "GET /drinkware/colorway-drops/${drop_we}"
              payload: {}
              as: PlatformAdmin
              captures: { drop_we_v: $.data.version }
            - call: "POST /drinkware/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drinkware/colorway-drops/${drop_we}/lock-allocation"
              payload: { expected_drop_version: "${drop_we_v}" }
              as: PlatformAdmin
              captures: { err_lock_early: $.data.error_id }
            - call: "POST /drinkware/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drinkware/launch-allocations"
              payload: { dealer_id: "${c_dealer}", drop_id: "${drop_we}", requested_units: 2 }
              as: Dealer
              as_user_id: "${c_dealer}"
              captures: { err_closed_edge: $.data.error_id }
            - call: "GET /drinkware/colorway-drops/${drop_we}"
              payload: {}
              as: PlatformAdmin
              captures: { drop_we_v2: $.data.version }
            - call: "POST /drinkware/colorway-drops/${drop_we}/lock-allocation"
              payload: { expected_drop_version: "${drop_we_v2}" }
              as: PlatformAdmin
          assert:
            - "err_not_open == ERR_ALLOCATION_WINDOW_NOT_OPEN (422) at clock < opens_at"
            - "err_lock_early == ERR_ALLOCATION_WINDOW_OPEN (422) at clock < closes_at"
            - "err_closed_edge == ERR_ALLOCATION_WINDOW_CLOSED (422) at clock == closes_at exactly (requests need clock < closes_at)"
            - "final lock at clock == closes_at succeeds: status == ALLOCATION_LOCKED"

