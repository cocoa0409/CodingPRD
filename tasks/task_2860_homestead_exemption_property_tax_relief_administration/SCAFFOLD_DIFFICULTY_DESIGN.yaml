      - name: fraud_hold_beats_unowned_destination_on_freeze_port
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - errors[ERR_FRAUD_HOLD_ACTIVE]
          - errors[ERR_DESTINATION_NOT_OWNED]
          - state_machines.ExemptionGrant.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          A different conflicting pair on a different endpoint: (11 business_safety, 409) vs
          (12 business_referential, 422) on POST /exemption-grants/{id}/port. The OPEN FraudCase sits on
          a SECOND grant of the same taxpayer, so the ported SENIOR_FREEZE grant is still ACTIVE and
          priority 9 cannot pre-empt the pair — the taxpayer-wide fraud hold must beat the
          destination-ownership lookup.
        conflict_pair:
          lower_priority_rule: "priority 11 — category business_safety — no FraudCase of the taxpayer may have investigation_status OPEN when porting a freeze"
          higher_priority_rule: "priority 12 — category business_referential — the destination parcel needs a VERIFIED PRIMARY_RESIDENCE OwnershipRecord for the grant's taxpayer"
          expected_winner: ERR_FRAUD_HOLD_ACTIVE
          expected_http: 409
          rationale: "The safety hold is evaluated first so an account under active investigation cannot move value at all; revealing the destination-ownership verdict would also leak which parcels the county has on file for a suspect."
