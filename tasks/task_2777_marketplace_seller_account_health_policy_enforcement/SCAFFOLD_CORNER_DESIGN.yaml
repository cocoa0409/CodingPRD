          repeat_offense_count EXCLUDES the appealed action itself, so three same-category actions
          are needed to reach the threshold of 2. With the count at 2 the reviewer's discretion is
          removed: GRANTED is refused at priority 100 and only a denial can be recorded. The
          refusal is not a 403 — the reviewer is authorised and segregation is satisfied (inv-1
          issued, ar-1 decides); it is a compliance gate.
