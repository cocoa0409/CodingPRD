# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_2205_excess_surplus_lines_placement_tax
#
# Breadth probe. Every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners that §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: broker_create_returns_every_declared_field_and_starts_active
        claim_type: Creation
        grounds:
          - entities.Broker
          - endpoints.POST_/brokers
        distinguishing_aspect: "A brokerage created with only firm_name and home_state comes back 201 with status ACTIVE, version 1, and system-generated id / created_at / updated_at — status is never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Any
          trigger:
            - &k_broker
              call: "POST /brokers"
              payload: { firm_name: "Lone Star Surplus Partners", home_state: "TX" }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Broker.${broker_id}.firm_name == \"Lone Star Surplus Partners\" and home_state == \"TX\""
            - "Broker.${broker_id}.status == ACTIVE"
            - "Broker.${broker_id}.version == 1"
            - "the response data carries non-null id, created_at and updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: state_program_get_returns_the_stored_configuration_unchanged
        claim_type: Retrieval
        grounds:
          - entities.StateProgram
          - endpoints.GET_/state-programs/{id}
        distinguishing_aspect: "Every StateProgram configuration field round-trips through GET exactly as posted, including the null stamping_fee_cap_cents and the two-element required_notice_codes array."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. StateProgram TX created with the full configuration."
          setup_api_calls:
            - *k_clock
            - &k_prog_tx
              call: "POST /state-programs"
              payload: { state_code: "TX", premium_tax_rate: 0.0485, stamping_fee_rate: 0.0015, stamping_fee_cap_cents: null, stamping_office_required: true, allocation_method: "ALLOCATED_MULTI", diligent_search_min_declinations: 3, export_list_exempts_search: true, filing_frequency: "MONTHLY", filing_deadline_days: 30, return_premium_tax_refundable: true, return_premium_stamping_refundable: false, min_carrier_capital_surplus_cents: 1500000000, required_notice_codes: ["TX-SL-1", "TX-SL-2"] }
              as: PlatformAdmin
              captures: { tx_program_id: $.data.id }
          trigger:
            - call: "GET /state-programs/${tx_program_id}"
              payload: {}
              as: Any
              as_user_id: "tf-nina"
          assert:
            - "the response status is 200"
            - "StateProgram.${tx_program_id}.premium_tax_rate == 0.0485 and stamping_fee_rate == 0.0015"
            - "StateProgram.${tx_program_id}.stamping_fee_cap_cents is null"
            - "StateProgram.${tx_program_id}.allocation_method == ALLOCATED_MULTI and filing_frequency == MONTHLY"
            - "StateProgram.${tx_program_id}.required_notice_codes == [\"TX-SL-1\", \"TX-SL-2\"]"
            - "StateProgram.${tx_program_id}.return_premium_tax_refundable == true and return_premium_stamping_refundable == false"

      - name: placements_list_paginates_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/placements
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three placements on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the remaining 1 row with has_more false — total_count counts the whole filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. One brokerage with three placements, all still DRAFT."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - call: "POST /placements"
              payload: { insured_name: "Alpha Risk LLC", principal_place_of_business_state: "TX", coverage_class: "PROPERTY", is_export_list_risk: false, state_exposures: [{ state_code: "TX", insured_value_cents: 100000000 }] }
              as: PlacementBroker
              as_user_id: "${broker_id}"
            - call: "POST /placements"
              payload: { insured_name: "Beta Risk LLC", principal_place_of_business_state: "TX", coverage_class: "PROPERTY", is_export_list_risk: false, state_exposures: [{ state_code: "TX", insured_value_cents: 200000000 }] }
              as: PlacementBroker
              as_user_id: "${broker_id}"
            - call: "POST /placements"
              payload: { insured_name: "Gamma Risk LLC", principal_place_of_business_state: "NV", coverage_class: "CASUALTY", is_export_list_risk: false, state_exposures: [{ state_code: "NV", insured_value_cents: 300000000 }] }
              as: PlacementBroker
              as_user_id: "${broker_id}"
          trigger:
            - call: "GET /placements"
              payload: { broker_id: "${broker_id}", limit: 2, offset: 0 }
              as: Any
              as_user_id: "co-anders"
          assert:
            - "the response status is 200 and response_type is array"
            - "the response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /placements?broker_id=${broker_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /placements?home_state=NV returns exactly 1 row, the Gamma Risk placement"
            - "GET /placements?status=DRAFT returns 3 rows"
            - "GET /placements with no query parameters returns 3 rows with limit defaulting to 10 and offset to 0"

      - name: carrier_get_with_an_unknown_id_returns_carrier_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/carriers/{id}
          - errors.ERR_CARRIER_NOT_FOUND
          - validations.priority_4_existence
        distinguishing_aspect: "A syntactically valid but unallocated id on a path segment produces the entity-specific 404 ERR_CARRIER_NOT_FOUND, not a generic ERR_NOT_FOUND and not a 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. No carrier has been created."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /carriers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Any
              as_user_id: "co-anders"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_CARRIER_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: placement_create_missing_state_exposures_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Placement.fields.state_exposures
          - validations.priority_6_existence
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "state_exposures is a required input with no default, so omitting it entirely is a 400 ERR_INVALID_REQUEST from the required-field check — it is NOT the 422 ERR_HOME_STATE_INDETERMINATE that an empty-but-present array produces."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. One brokerage."
          setup_api_calls:
            - *k_clock
            - *k_broker
          trigger:
            - call: "POST /placements"
              payload: { insured_name: "Omission Risk LLC", principal_place_of_business_state: "TX", coverage_class: "PROPERTY", is_export_list_risk: false }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "error_id != ERR_HOME_STATE_INDETERMINATE"
            - "GET /placements?broker_id=${broker_id} returns 0 rows"

      - name: policy_create_omitting_the_fee_fields_defaults_them_to_zero
        claim_type: Defaults
        grounds:
          - entities.Policy.fields.policy_fee_cents
          - entities.Policy.fields.broker_fee_cents
          - calculations.premium_tax_and_stamping_fee
        distinguishing_aspect: "policy_fee_cents and broker_fee_cents each declare a default of 0, so omitting both stores 0 rather than null, and the taxable premium equals the gross premium exactly — 1000000, not 1075000."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; the base TX-home setup with an APPROVED, TX-white-listed carrier and a SEARCH_COMPLETE placement."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - &k_lic_tx
              call: "POST /brokers/${broker_id}/licenses"
              payload: { state_code: "TX", license_number: "SL-TX-1001", license_type: "SURPLUS_LINES", expires_on: "2027-12-31T00:00:00Z" }
              as: PlatformAdmin
            - *k_prog_tx
            - &k_prog_nv
              call: "POST /state-programs"
              payload: { state_code: "NV", premium_tax_rate: 0.0350, stamping_fee_rate: 0.0040, stamping_fee_cap_cents: null, stamping_office_required: false, allocation_method: "ALLOCATED_MULTI", diligent_search_min_declinations: 2, export_list_exempts_search: false, filing_frequency: "MONTHLY", filing_deadline_days: 45, return_premium_tax_refundable: false, return_premium_stamping_refundable: false, min_carrier_capital_surplus_cents: 500000000, required_notice_codes: ["NV-SL"] }
              as: PlatformAdmin
              captures: { nv_program_id: $.data.id }
            - &k_prog_ca
              call: "POST /state-programs"
              payload: { state_code: "CA", premium_tax_rate: 0.0300, stamping_fee_rate: 0.0018, stamping_fee_cap_cents: 50000, stamping_office_required: true, allocation_method: "HOME_STATE_SINGLE", diligent_search_min_declinations: 3, export_list_exempts_search: false, filing_frequency: "QUARTERLY", filing_deadline_days: 45, return_premium_tax_refundable: true, return_premium_stamping_refundable: true, min_carrier_capital_surplus_cents: 1500000000, required_notice_codes: ["CA-D1", "CA-D2"] }
              as: PlatformAdmin
              captures: { ca_program_id: $.data.id }
            - &k_carrier
              call: "POST /carriers"
              payload: { naic_number: "12345", legal_name: "Atlas Specialty Insurance Company", domicile_type: "US_STATE", capital_surplus_cents: 6000000000, am_best_rating: "A_PLUS", trust_fund_cents: 0, naic_quarterly_listing: true }
              as: PlatformAdmin
              captures: { carrier_id: $.data.id, carrier_v0: $.data.version }
            - &k_review_new
              call: "POST /carriers/${carrier_id}/security-reviews"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
              captures: { review_id: $.data.id }
            - &k_review_start
              call: "POST /market-security-reviews/${review_id}/start"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
            - &k_review_approve
              call: "POST /market-security-reviews/${review_id}/decide"
              payload: { decision: "APPROVE", expected_carrier_version: "${carrier_v0}" }
              as: ComplianceOfficer
              as_user_id: "co-anders"
            - &k_elig_tx
              call: "POST /carrier-eligibilities"
              payload: { carrier_id: "${carrier_id}", state_program_id: "${tx_program_id}", listed_on: "2026-01-01T00:00:00Z" }
              as: StateRegulator
              as_user_id: "sr-tx"
              captures: { elig_tx_id: $.data.id }
            - &k_placement
              call: "POST /placements"
              payload: { insured_name: "Gulf Fabricators LLC", principal_place_of_business_state: "TX", coverage_class: "PROPERTY", is_export_list_risk: false, state_exposures: [{ state_code: "TX", insured_value_cents: 300000000 }, { state_code: "NV", insured_value_cents: 300000000 }, { state_code: "CA", insured_value_cents: 300000000 }] }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { placement_id: $.data.id }
            - &k_begin_search
              call: "POST /placements/${placement_id}/begin-search"
              payload: {}
              as: PlacementBroker
              as_user_id: "${broker_id}"
            - &k_decl_1
              call: "POST /placements/${placement_id}/declinations"
              payload: { admitted_carrier_name: "Republic Admitted Mutual", state_code: "TX", reason_code: "NO_APPETITE", declined_on: "2026-07-10T00:00:00Z" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { declination_1_id: $.data.id }
            - &k_decl_2
              call: "POST /placements/${placement_id}/declinations"
              payload: { admitted_carrier_name: "Pecos Standard Insurance", state_code: "TX", reason_code: "CAPACITY", declined_on: "2026-07-12T00:00:00Z" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
            - &k_decl_3
              call: "POST /placements/${placement_id}/declinations"
              payload: { admitted_carrier_name: "Trinity Mutual Casualty", state_code: "TX", reason_code: "UNDERWRITING", declined_on: "2026-07-14T00:00:00Z" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
            - &k_complete_search
              call: "POST /placements/${placement_id}/complete-search"
              payload: {}
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { placement_v: $.data.version }
          trigger:
            - call: "POST /policies"
              payload: { placement_id: "${placement_id}", carrier_id: "${carrier_id}", policy_number: "SL-2026-0200", effective_date: "2026-08-01T00:00:00Z", expiration_date: "2027-08-01T00:00:00Z", original_gross_premium_cents: 1000000, min_earned_premium_pct: 0.25, expected_placement_version: "${placement_v}" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { policy_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Policy.${policy_id}.policy_fee_cents == 0 and broker_fee_cents == 0"
            - "Policy.${policy_id}.gross_premium_cents == 1000000"
            - "after POST /policies/${policy_id}/calculate-tax, Policy.${policy_id}.taxable_premium_cents == 1000000"
            - "Policy.${policy_id}.taxable_premium_cents != 1075000"

      - name: broker_license_status_is_computed_on_read_and_never_stored
        claim_type: Computed Fields
        grounds:
          - entities.BrokerLicense.fields.status
          - endpoints.GET_/brokers/{id}/licenses
        distinguishing_aspect: "BrokerLicense.status is derived from the logical clock against expires_on on every read: ACTIVE strictly before expires_on, LAPSED once the clock reaches it. The same row reads ACTIVE at 2026-08-01, ACTIVE at 2026-08-31T23:59:59Z, and LAPSED at exactly 2026-09-01 — with no write in between."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. One brokerage with a TX SURPLUS_LINES license whose expires_on is 2026-09-01T00:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - call: "POST /brokers/${broker_id}/licenses"
              payload: { state_code: "TX", license_number: "SL-TX-9001", license_type: "SURPLUS_LINES", expires_on: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { license_id: $.data.id }
          trigger:
            - call: "GET /brokers/${broker_id}/licenses"
              payload: { license_type: "SURPLUS_LINES", state_code: "TX" }
              as: Any
              as_user_id: "tf-nina"
          assert:
            - "the response returns exactly 1 row and BrokerLicense.${license_id}.status == ACTIVE"
            - "after POST /_clock/set_current_utc with current_utc 2026-08-31T23:59:59Z, the same GET reports status == ACTIVE"
            - "after POST /_clock/set_current_utc with current_utc 2026-09-01T00:00:00Z, the same GET reports status == LAPSED — the clock reaching expires_on is enough"
            - "BrokerLicense.${license_id}.version is unchanged across all three reads"

      - name: declination_create_extra_field_status_is_ignored_input
        claim_type: System Fields
        grounds:
          - entities.Declination.fields.status
          - endpoints.POST_/placements/{id}/declinations
        distinguishing_aspect: "Declination.status is source: system with initial state RECORDED. A client that sends status INVALIDATED (a field the endpoint does not declare as input) is ignored: the row is created RECORDED, and version is 1 regardless of any supplied version."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; a brokerage with a placement in SEARCH_IN_PROGRESS."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_prog_tx
            - *k_placement
            - *k_begin_search
          trigger:
            - call: "POST /placements/${placement_id}/declinations"
              payload: { admitted_carrier_name: "Republic Admitted Mutual", state_code: "TX", reason_code: "NO_APPETITE", declined_on: "2026-07-10T00:00:00Z", status: "INVALIDATED", version: 99 }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { declination_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Declination.${declination_id}.status == RECORDED"
            - "Declination.${declination_id}.version == 1"
            - "Declination.${declination_id}.placement_id == ${placement_id}"
            - "GET /placements/${placement_id}/declinations?status=RECORDED returns exactly 1 row"

      - name: carrier_create_with_an_out_of_enum_am_best_rating_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Carrier.fields.am_best_rating
          - validations.priority_6_existence
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "am_best_rating is a closed enum whose members are exactly the seven keys of the market_security_score RATING_POINTS table; a value such as AAA is rejected at priority 6 with 400 ERR_INVALID_REQUEST rather than silently scoring zero."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /carriers"
              payload: { naic_number: "99999", legal_name: "Nonexistent Rating Company", domicile_type: "US_STATE", capital_surplus_cents: 6000000000, am_best_rating: "AAA", trust_fund_cents: 0, naic_quarterly_listing: true }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /carrier-eligibilities returns 0 rows and no Carrier was persisted"

      - name: policy_create_body_foreign_keys_are_checked_in_declared_input_order
        claim_type: Parent Relationships
        grounds:
          - validations.priority_5_existence
          - endpoints.POST_/policies
          - errors.ERR_PLACEMENT_NOT_FOUND
          - errors.ERR_CARRIER_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "The flat topology puts both foreign keys in the request body, and priority 5 checks them in the order the endpoint's input list declares — placement_id before carrier_id. With BOTH ids unknown the answer is ERR_PLACEMENT_NOT_FOUND; with only carrier_id unknown it is ERR_CARRIER_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; the base TX-home setup with a SEARCH_COMPLETE placement and an APPROVED, TX-white-listed carrier."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic_tx
            - *k_prog_tx
            - *k_prog_nv
            - *k_prog_ca
            - *k_carrier
            - *k_review_new
            - *k_review_start
            - *k_review_approve
            - *k_elig_tx
            - *k_placement
            - *k_begin_search
            - *k_decl_1
            - *k_decl_2
            - *k_decl_3
            - *k_complete_search
          trigger:
            - call: "POST /policies"
              payload: { placement_id: "00000000-0000-4000-8000-000000000001", carrier_id: "00000000-0000-4000-8000-000000000002", policy_number: "SL-2026-0300", effective_date: "2026-08-01T00:00:00Z", expiration_date: "2027-08-01T00:00:00Z", original_gross_premium_cents: 1000000, policy_fee_cents: 0, broker_fee_cents: 0, min_earned_premium_pct: 0.25, expected_placement_version: "${placement_v}" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { error_id_both: $.data.error_id }
            - call: "POST /policies"
              payload: { placement_id: "${placement_id}", carrier_id: "00000000-0000-4000-8000-000000000002", policy_number: "SL-2026-0301", effective_date: "2026-08-01T00:00:00Z", expiration_date: "2027-08-01T00:00:00Z", original_gross_premium_cents: 1000000, policy_fee_cents: 0, broker_fee_cents: 0, min_earned_premium_pct: 0.25, expected_placement_version: "${placement_v}" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { error_id_carrier: $.data.error_id }
          assert:
            - "the first request returns 404 and error_id_both == ERR_PLACEMENT_NOT_FOUND"
            - "error_id_both != ERR_CARRIER_NOT_FOUND"
            - "the second request returns 404 and error_id_carrier == ERR_CARRIER_NOT_FOUND"
            - "GET /policies?placement_id=${placement_id} returns 0 rows"
            - "Placement.${placement_id}.status is still SEARCH_COMPLETE"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: filing_batch_is_born_open_with_a_null_due_date_and_zero_totals
        claim_type: Initial State
        grounds:
          - state_machines.FilingBatch.initial_state
          - endpoints.POST_/filing-batches
        distinguishing_aspect: "A freshly created FilingBatch is OPEN with line_count 0, total_tax_cents 0, total_stamping_fee_cents 0, penalty_cents 0, total_due_cents 0, late false and a null due_date — the due date is not computed until prepare runs."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; a brokerage and the TX MONTHLY program on file."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_prog_tx
          trigger:
            - call: "POST /filing-batches"
              payload: { state_program_id: "${tx_program_id}", broker_id: "${broker_id}", period_key: "2026-08" }
              as: TaxFiler
              as_user_id: "tf-nina"
              captures: { batch_id: $.data.id }
          assert:
            - "the response status is 201"
            - "FilingBatch.${batch_id}.status == OPEN"
            - "FilingBatch.${batch_id}.line_count == 0 and total_tax_cents == 0 and total_stamping_fee_cents == 0"
            - "FilingBatch.${batch_id}.penalty_cents == 0 and total_due_cents == 0 and late == false"
            - "FilingBatch.${batch_id}.due_date is null"
            - "FilingBatch.${batch_id}.prepared_by_user_id is null and remitted_by_user_id is null"

      - name: begin_search_on_a_placement_past_the_search_stage_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Placement.transitions
          - validations.priority_9_state
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "begin-search is only legal from DRAFT. Once the placement has reached SEARCH_COMPLETE, replaying begin-search is a 409 ERR_INVALID_STATE and — critically — it does NOT reset the placement or its declination_count."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; the base TX-home setup carried to a SEARCH_COMPLETE placement with three RECORDED declinations."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic_tx
            - *k_prog_tx
            - *k_prog_nv
            - *k_prog_ca
            - *k_placement
            - *k_begin_search
            - *k_decl_1
            - *k_decl_2
            - *k_decl_3
            - *k_complete_search
          trigger:
            - call: "POST /placements/${placement_id}/begin-search"
              payload: {}
              as: PlacementBroker
