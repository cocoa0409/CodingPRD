      - name: role_check_on_a_missing_order_returns_403
        claim_type: priority_ordering
        grounds:
          - validations.priority_2
          - validations.priority_20
          - errors.ERR_ROLE_NOT_PERMITTED
          - errors.ERR_REPAIR_ORDER_NOT_FOUND
        distinguishing_aspect: >-
          Authorisation is settled before existence: a Technician calling the Estimator-only blueprint
          endpoint on an id that does not exist gets 403 ERR_ROLE_NOT_PERMITTED, never the 404. An
          implementation that resolves the path parameter first leaks the fact that the order is absent
          to a caller with no business touching the endpoint at all.
        test_recipe:
          setup:
            - "No fixture is needed beyond an empty database - the addressed id is deliberately absent."
          setup_api_calls: []
          trigger:
            - call: "POST /repair-orders/00000000-0000-4000-8000-000000000404/blueprint"
              payload: {}
              as: Technician
              as_user_id: "tech-100"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED"
            - "the same call as an Estimator returns HTTP 404 with data.error_id == ERR_REPAIR_ORDER_NOT_FOUND, which is the only way to see the 404 on this endpoint"
            - "the same call with both headers blank returns HTTP 401 ERR_UNAUTHENTICATED, ranking above both"

      - name: pagination_bounds_on_a_missing_order_returns_400
        claim_type: priority_ordering
        grounds:
          - validations.priority_7
          - validations.priority_20
          - errors.ERR_INVALID_PAGINATION
          - errors.ERR_REPAIR_ORDER_NOT_FOUND
        distinguishing_aspect: >-
          Request-shape checks outrank parent resolution: limit 0 on a child listing under an absent
          parent answers 400 ERR_INVALID_PAGINATION, not 404. Rule 7 sits at priority 7 precisely so a
          malformed page request is never mistaken for a missing resource.
        test_recipe:
          setup:
            - "No fixture is needed - the addressed repair order does not exist."
          setup_api_calls: []
          trigger:
            - call: "GET /repair-orders/00000000-0000-4000-8000-000000000404/supplements"
              payload: { limit: 0 }
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_PAGINATION"
            - "limit 101 and offset -1 on the same URL are likewise 400 ERR_INVALID_PAGINATION"
            - "the same URL with limit 10 returns HTTP 404 ERR_REPAIR_ORDER_NOT_FOUND, proving the 404 is only reached once the page request is well formed"

