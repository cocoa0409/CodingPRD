        distinguishing_aspect: "A case with |variance| >= 2x the investigation threshold cannot be waived (ERR_WAIVER_NOT_ALLOWED); a sub-2x case waives and records an OVER_SHORT_WAIVER approval."
        test_recipe:
          setup:
            - "Branch B (threshold 1000); teller T1 with a drawer closed OUT_OF_BALANCE with variance -5000 (severe: case 1, teller auto-suspended); teller T2 with a drawer closed OUT_OF_BALANCE with variance -1500 (case 2, not severe)"
