# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of testable claims)
# Walks references/claim-extraction-guide.md section-by-section against this
# scaffold's §1.1-§1.7. excluded_because stubs cite §1.8 instances by name.
# Every active instance's setup_api_calls is empty-DB executable via §1.5.
# Canonical fixture mirrors §1.8: Term FALL2026 (2026-09-01..2026-12-31),
# Template 4PAY (count 4, down 0.20, plan_fee 4500, grace 3).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_institution_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Institution, endpoints]
        distinguishing_aspect: "POST /institutions with name + currency returns 201 and a body carrying id, name, currency, refund_policy default DATE_BASED, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /institutions"
              payload: { name: "Inst Corner", currency: "USD" }
              as: Registrar
              captures: { ic_id: $.data.id, ic_policy: $.data.refund_policy, ic_v: $.data.version }
          assert:
            - "Response status == 201"
            - "Institution.${ic_id}.refund_policy == DATE_BASED (default applied)"
            - "Institution.${ic_id}.version == 1"

      - name: get_enrollment_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Enrollment, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /institutions/enrollments/{id} with a non-existent UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Institution exists; no enrollment with the queried id."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst NF", currency: "USD" }
              as: Registrar
              captures: { nf_inst: $.data.id }
          trigger:
            - call: "GET /institutions/enrollments/00000000-0000-4000-8000-000000000000"
              as: Registrar
              captures: { err_id: $.data.error_id }
          assert:
            - "Response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_term_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.AcademicTerm, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /institutions/terms omitting required enroll_close is rejected ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Institution exists."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst RF", currency: "USD" }
              as: Registrar
              captures: { rf_inst: $.data.id }
          trigger:
            - call: "POST /institutions/terms"
              payload: { institution_id: "${rf_inst}", code: "FALL2026", term_start: "2026-09-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z", enroll_open: "2026-08-01T00:00:00.000Z" }
              as: Registrar
              captures: { err_id: $.data.error_id }
          assert:
            - "Response status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_enrollment_autopay_default_false
        claim_type: Defaults
        grounds: [entities.Enrollment.fields.autopay_enabled]
        distinguishing_aspect: "POST /institutions/enrollments omitting autopay_enabled stores false (the declared default)."
        test_recipe:
          setup: ["Institution, term, student, template exist."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst DEF", currency: "USD" }
              as: Registrar
              captures: { def_inst: $.data.id }
            - call: "POST /institutions/terms"
              payload: { institution_id: "${def_inst}", code: "FALL2026", term_start: "2026-09-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z", enroll_open: "2026-08-01T00:00:00.000Z", enroll_close: "2026-09-30T00:00:00.000Z" }
              as: Registrar
              captures: { def_term: $.data.id }
            - call: "POST /institutions/students"
              payload: { institution_id: "${def_inst}", external_ref: "SD", full_name: "Stu D", email: "sd@x.edu" }
              as: Registrar
              captures: { def_stu: $.data.id }
            - call: "POST /institutions/plan-templates"
              payload: { institution_id: "${def_inst}", name: "4PAY", installment_count: 4, down_payment_pct: 0.20, plan_fee_cents: 4500 }
              as: Registrar
              captures: { def_tpl: $.data.id }
          trigger:
            - call: "POST /institutions/enrollments"
              payload: { student_id: "${def_stu}", term_id: "${def_term}", plan_template_id: "${def_tpl}" }
              as: Registrar
              captures: { def_enr: $.data.id, def_ap: $.data.autopay_enabled }
          assert:
            - "Enrollment.${def_enr}.autopay_enabled == false"

      - name: enrollment_computed_balances_zero_before_charges
        claim_type: Computed Fields
        grounds: [entities.Enrollment.fields.gross_charges_cents, entities.Enrollment.fields.net_after_aid_cents]
        distinguishing_aspect: "A freshly created PENDING enrollment with no charges has gross_charges_cents 0 and net_after_aid_cents 0 (computed, not client-set)."
        test_recipe:
          setup: ["Institution, term, student, template exist; enrollment created with no charges."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst CF", currency: "USD" }
              as: Registrar
              captures: { cf_inst: $.data.id }
            - call: "POST /institutions/terms"
              payload: { institution_id: "${cf_inst}", code: "FALL2026", term_start: "2026-09-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z", enroll_open: "2026-08-01T00:00:00.000Z", enroll_close: "2026-09-30T00:00:00.000Z" }
              as: Registrar
              captures: { cf_term: $.data.id }
            - call: "POST /institutions/students"
              payload: { institution_id: "${cf_inst}", external_ref: "SC", full_name: "Stu C", email: "sc@x.edu" }
              as: Registrar
              captures: { cf_stu: $.data.id }
            - call: "POST /institutions/plan-templates"
              payload: { institution_id: "${cf_inst}", name: "4PAY", installment_count: 4, down_payment_pct: 0.20, plan_fee_cents: 4500 }
              as: Registrar
              captures: { cf_tpl: $.data.id }
          trigger:
            - call: "POST /institutions/enrollments"
              payload: { student_id: "${cf_stu}", term_id: "${cf_term}", plan_template_id: "${cf_tpl}" }
              as: Registrar
              captures: { cf_enr: $.data.id, cf_gross: $.data.gross_charges_cents }
          assert:
            - "Enrollment.${cf_enr}.gross_charges_cents == 0"
            - "Enrollment.${cf_enr}.net_after_aid_cents == 0"

      - name: charge_amount_zero_returns_invalid_amount
        claim_type: Type Constraints
        grounds: [entities.Charge.fields.amount_cents, "errors[ERR_INVALID_AMOUNT]"]
        distinguishing_aspect: "POST /institutions/charges with amount_cents 0 is rejected ERR_INVALID_AMOUNT 400 (amount must be strictly positive)."
        test_recipe:
          setup: ["Institution, term, student, template, PENDING enrollment exist."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst ZA", currency: "USD" }
              as: Registrar
              captures: { za_inst: $.data.id }
            - call: "POST /institutions/terms"
              payload: { institution_id: "${za_inst}", code: "FALL2026", term_start: "2026-09-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z", enroll_open: "2026-08-01T00:00:00.000Z", enroll_close: "2026-09-30T00:00:00.000Z" }
              as: Registrar
              captures: { za_term: $.data.id }
            - call: "POST /institutions/students"
              payload: { institution_id: "${za_inst}", external_ref: "SZ", full_name: "Stu Z", email: "sz@x.edu" }
              as: Registrar
              captures: { za_stu: $.data.id }
            - call: "POST /institutions/plan-templates"
              payload: { institution_id: "${za_inst}", name: "4PAY", installment_count: 4, down_payment_pct: 0.20, plan_fee_cents: 4500 }
              as: Registrar
              captures: { za_tpl: $.data.id }
            - call: "POST /institutions/enrollments"
              payload: { student_id: "${za_stu}", term_id: "${za_term}", plan_template_id: "${za_tpl}" }
              as: Registrar
              captures: { za_enr: $.data.id }
          trigger:
            - call: "POST /institutions/charges"
              payload: { enrollment_id: "${za_enr}", kind: "TUITION", amount_cents: 0 }
              as: Registrar
              captures: { err_id: $.data.error_id }
          assert:
            - "Response status == 400"
            - "data.error_id == ERR_INVALID_AMOUNT"

      - name: plan_template_pct_out_of_range_rejected
        claim_type: Type Constraints
        grounds: [entities.PlanTemplate.fields.down_payment_pct, "errors[ERR_INVALID_PLAN_TEMPLATE]"]
        distinguishing_aspect: "POST /institutions/plan-templates with down_payment_pct 0.75 (> 0.5 cap) is rejected ERR_INVALID_PLAN_TEMPLATE 400."
        test_recipe:
          setup: ["Institution exists."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst PT", currency: "USD" }
              as: Registrar
              captures: { pt_inst: $.data.id }
          trigger:
            - call: "POST /institutions/plan-templates"
              payload: { institution_id: "${pt_inst}", name: "BAD", installment_count: 4, down_payment_pct: 0.75, plan_fee_cents: 4500 }
              as: Registrar
              captures: { err_id: $.data.error_id }
          assert:
            - "Response status == 400"
            - "data.error_id == ERR_INVALID_PLAN_TEMPLATE"

      - name: term_window_malformed_rejected
        claim_type: Type Constraints
        grounds: [entities.AcademicTerm.fields.term_end, "errors[ERR_INVALID_TERM_WINDOW]"]
        distinguishing_aspect: "POST /institutions/terms with term_end before term_start is rejected ERR_INVALID_TERM_WINDOW 400."
        test_recipe:
          setup: ["Institution exists."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst TW", currency: "USD" }
              as: Registrar
              captures: { tw_inst: $.data.id }
          trigger:
            - call: "POST /institutions/terms"
              payload: { institution_id: "${tw_inst}", code: "BADTERM", term_start: "2026-12-31T00:00:00.000Z", term_end: "2026-09-01T00:00:00.000Z", enroll_open: "2026-08-01T00:00:00.000Z", enroll_close: "2026-09-30T00:00:00.000Z" }
              as: Registrar
              captures: { err_id: $.data.error_id }
          assert:
            - "Response status == 400"
            - "data.error_id == ERR_INVALID_TERM_WINDOW"

      - name: system_fields_generated_not_client_set
        claim_type: System Fields
        grounds: [entities.Student.fields.has_active_hold, entities.Student.fields.institution_id]
        distinguishing_aspect: "POST /institutions/students returns server-minted id, created_at, version 1, and computed has_active_hold false; institution_id is system-set from the body reference."
        test_recipe:
          setup: ["Institution exists."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst SF", currency: "USD" }
              as: Registrar
              captures: { sf_inst: $.data.id }
          trigger:
            - call: "POST /institutions/students"
              payload: { institution_id: "${sf_inst}", external_ref: "SS", full_name: "Stu S", email: "ss@x.edu" }
              as: Registrar
              captures: { sf_stu: $.data.id, sf_hold: $.data.has_active_hold, sf_v: $.data.version }
          assert:
            - "Student.${sf_stu}.has_active_hold == false"
            - "Student.${sf_stu}.version == 1"

      - name: list_students_paginated_envelope
        claim_type: Listing
        grounds: [entities.Student, endpoints]
        distinguishing_aspect: "GET /institutions/students returns an array envelope with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Institution with one student."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst LS", currency: "USD" }
              as: Registrar
              captures: { ls_inst: $.data.id }
            - call: "POST /institutions/students"
              payload: { institution_id: "${ls_inst}", external_ref: "SL", full_name: "Stu L", email: "sl@x.edu" }
              as: Registrar
              captures: { ls_stu: $.data.id }
          trigger:
            - call: "GET /institutions/students?institution_id=${ls_inst}"
              as: Registrar
          assert:
            - "Response response_type == array"
            - "meta total_count == 1 and has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_already_active_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Enrollment.PENDING_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating an already-ACTIVE enrollment is rejected ERR_INVALID_STATE 409 (PENDING-only transition)."
        test_recipe:
          setup: ["Enrollment ACTIVE (charges 500000 aid 100000, activated)."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst IA", currency: "USD" }
              as: Registrar
              captures: { ia_inst: $.data.id }
            - call: "POST /institutions/${ia_inst}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00.000Z" }
              as: Registrar
            - call: "POST /institutions/terms"
              payload: { institution_id: "${ia_inst}", code: "FALL2026", term_start: "2026-09-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z", enroll_open: "2026-08-01T00:00:00.000Z", enroll_close: "2026-09-30T00:00:00.000Z" }
              as: Registrar
              captures: { ia_term: $.data.id }
            - call: "POST /institutions/students"
              payload: { institution_id: "${ia_inst}", external_ref: "SIA", full_name: "Stu IA", email: "sia@x.edu" }
              as: Registrar
              captures: { ia_stu: $.data.id }
            - call: "POST /institutions/plan-templates"
              payload: { institution_id: "${ia_inst}", name: "4PAY", installment_count: 4, down_payment_pct: 0.20, plan_fee_cents: 4500 }
              as: Registrar
              captures: { ia_tpl: $.data.id }
            - call: "POST /institutions/enrollments"
              payload: { student_id: "${ia_stu}", term_id: "${ia_term}", plan_template_id: "${ia_tpl}" }
              as: Registrar
              captures: { ia_enr: $.data.id }
            - call: "POST /institutions/charges"
              payload: { enrollment_id: "${ia_enr}", kind: "TUITION", amount_cents: 500000 }
              as: Registrar
            - call: "POST /institutions/aids"
              payload: { enrollment_id: "${ia_enr}", source: "GRANT", amount_cents: 100000 }
              as: Registrar
            - call: "GET /institutions/enrollments/${ia_enr}"
              as: Registrar
              captures: { ia_v0: $.data.version }
            - call: "POST /institutions/enrollments/${ia_enr}/activate"
              payload: { expected_enrollment_version: "${ia_v0}" }
              as: Registrar
            - call: "GET /institutions/enrollments/${ia_enr}"
              as: Registrar
              captures: { ia_v1: $.data.version }
          trigger:
            - call: "POST /institutions/enrollments/${ia_enr}/activate"
              payload: { expected_enrollment_version: "${ia_v1}" }
              as: Registrar
              captures: { err_id: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: term_close_from_open_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.AcademicTerm, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Closing an OPEN term (close requires LOCKED) is rejected ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["Term FALL2026 OPEN (never locked)."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst TC", currency: "USD" }
              as: Registrar
              captures: { tc_inst: $.data.id }
            - call: "POST /institutions/terms"
              payload: { institution_id: "${tc_inst}", code: "FALL2026", term_start: "2026-09-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z", enroll_open: "2026-08-01T00:00:00.000Z", enroll_close: "2026-09-30T00:00:00.000Z" }
              as: Registrar
              captures: { tc_term: $.data.id }
          trigger:
            - call: "POST /institutions/terms/${tc_term}/close"
              as: Registrar
              captures: { err_id: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: charge_reverse_twice_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Charge.POSTED_to_REVERSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Reversing an already-REVERSED charge a second time is rejected ERR_INVALID_STATE 409 (not idempotent)."
        test_recipe:
          setup: ["Enrollment ACTIVE with an extra FEE charge already reversed once."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst RT", currency: "USD" }
              as: Registrar
              captures: { rt_inst: $.data.id }
            - call: "POST /institutions/${rt_inst}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00.000Z" }
              as: Registrar
            - call: "POST /institutions/terms"
              payload: { institution_id: "${rt_inst}", code: "FALL2026", term_start: "2026-09-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z", enroll_open: "2026-08-01T00:00:00.000Z", enroll_close: "2026-09-30T00:00:00.000Z" }
              as: Registrar
              captures: { rt_term: $.data.id }
            - call: "POST /institutions/students"
              payload: { institution_id: "${rt_inst}", external_ref: "SRT", full_name: "Stu RT", email: "srt@x.edu" }
              as: Registrar
              captures: { rt_stu: $.data.id }
            - call: "POST /institutions/plan-templates"
              payload: { institution_id: "${rt_inst}", name: "4PAY", installment_count: 4, down_payment_pct: 0.20, plan_fee_cents: 4500 }
              as: Registrar
              captures: { rt_tpl: $.data.id }
            - call: "POST /institutions/enrollments"
              payload: { student_id: "${rt_stu}", term_id: "${rt_term}", plan_template_id: "${rt_tpl}" }
              as: Registrar
              captures: { rt_enr: $.data.id }
            - call: "POST /institutions/charges"
              payload: { enrollment_id: "${rt_enr}", kind: "TUITION", amount_cents: 500000 }
              as: Registrar
            - call: "GET /institutions/enrollments/${rt_enr}"
              as: Registrar
              captures: { rt_v0: $.data.version }
            - call: "POST /institutions/enrollments/${rt_enr}/activate"
              payload: { expected_enrollment_version: "${rt_v0}" }
              as: Registrar
            - call: "POST /institutions/charges"
              payload: { enrollment_id: "${rt_enr}", kind: "FEE", amount_cents: 60000 }
              as: Registrar
              captures: { rt_chg: $.data.id }
            - call: "POST /institutions/charges/${rt_chg}/reverse"
              as: Registrar
          trigger:
            - call: "POST /institutions/charges/${rt_chg}/reverse"
              as: Registrar
              captures: { err_id: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: hold_release_while_delinquent_returns_unresolved
        claim_type: Precondition Enforcement
        grounds: [state_machines.Hold.ACTIVE_to_RELEASED, "errors[ERR_DELINQUENCY_UNRESOLVED]"]
        distinguishing_aspect: "Manual hold release while delinquency thresholds still tripped is rejected ERR_DELINQUENCY_UNRESOLVED 409."
        test_recipe:
          setup: ["Enrollment with an ACTIVE AMOUNT hold (installments 1,2 OVERDUE, total 160000), delinquency uncured."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst HR", currency: "USD" }
              as: Registrar
              captures: { hr_inst: $.data.id }
            - call: "POST /institutions/${hr_inst}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00.000Z" }
              as: Registrar
            - call: "POST /institutions/terms"
              payload: { institution_id: "${hr_inst}", code: "FALL2026", term_start: "2026-09-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z", enroll_open: "2026-08-01T00:00:00.000Z", enroll_close: "2026-09-30T00:00:00.000Z" }
              as: Registrar
              captures: { hr_term: $.data.id }
            - call: "POST /institutions/students"
              payload: { institution_id: "${hr_inst}", external_ref: "SHR", full_name: "Stu HR", email: "shr@x.edu" }
              as: Registrar
              captures: { hr_stu: $.data.id }
            - call: "POST /institutions/plan-templates"
              payload: { institution_id: "${hr_inst}", name: "4PAY", installment_count: 4, down_payment_pct: 0.20, plan_fee_cents: 4500 }
              as: Registrar
              captures: { hr_tpl: $.data.id }
            - call: "POST /institutions/enrollments"
              payload: { student_id: "${hr_stu}", term_id: "${hr_term}", plan_template_id: "${hr_tpl}" }
              as: Registrar
              captures: { hr_enr: $.data.id }
            - call: "POST /institutions/charges"
              payload: { enrollment_id: "${hr_enr}", kind: "TUITION", amount_cents: 500000 }
              as: Registrar
            - call: "POST /institutions/aids"
              payload: { enrollment_id: "${hr_enr}", source: "GRANT", amount_cents: 100000 }
              as: Registrar
            - call: "GET /institutions/enrollments/${hr_enr}"
              as: Registrar
              captures: { hr_v0: $.data.version }
            - call: "POST /institutions/enrollments/${hr_enr}/activate"
              payload: { expected_enrollment_version: "${hr_v0}" }
              as: Registrar
            - call: "POST /institutions/payments"
              payload: { enrollment_id: "${hr_enr}", purpose: "DOWN_PAYMENT", amount_cents: 80000 }
              as: Bursar
              captures: { hr_payd: $.data.id }
            - call: "POST /institutions/payments/${hr_payd}/settle"
              as: Bursar
            - call: "POST /institutions/${hr_inst}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-28T00:00:00.000Z" }
              as: Registrar
            - call: "POST /institutions/enrollments/${hr_enr}/run-delinquency"
              as: Registrar
            - call: "GET /institutions/holds?enrollment_id=${hr_enr}"
              as: Registrar
              captures: { hr_hold: $.data.0.id }
          trigger:
            - call: "POST /institutions/holds/${hr_hold}/release"
              as: Registrar
              captures: { err_id: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_DELINQUENCY_UNRESOLVED"

      - name: enrollment_completes_when_all_installments_paid
        claim_type: Side Effect Execution
        grounds: [state_machines.Enrollment.ACTIVE_to_COMPLETED, state_machines.Installment.SCHEDULED_to_PAID]
        distinguishing_aspect: "Bubble-up: paying the down payment and all 4 installments drives the Enrollment ACTIVE->COMPLETED with scheduled_balance 0."
        test_recipe:
          setup: ["Enrollment ACTIVE [80000 x4]; small numbers via a 1-installment template for a short chain: use template 1PAY (count 1, down 0)."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst CP", currency: "USD" }
              as: Registrar
              captures: { cp_inst: $.data.id }
            - call: "POST /institutions/${cp_inst}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00.000Z" }
              as: Registrar
            - call: "POST /institutions/terms"
              payload: { institution_id: "${cp_inst}", code: "FALL2026", term_start: "2026-09-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z", enroll_open: "2026-08-01T00:00:00.000Z", enroll_close: "2026-09-30T00:00:00.000Z" }
              as: Registrar
              captures: { cp_term: $.data.id }
            - call: "POST /institutions/students"
              payload: { institution_id: "${cp_inst}", external_ref: "SCP", full_name: "Stu CP", email: "scp@x.edu" }
              as: Registrar
              captures: { cp_stu: $.data.id }
            - call: "POST /institutions/plan-templates"
              payload: { institution_id: "${cp_inst}", name: "1PAY", installment_count: 1, down_payment_pct: 0, plan_fee_cents: 0 }
              as: Registrar
              captures: { cp_tpl: $.data.id }
            - call: "POST /institutions/enrollments"
              payload: { student_id: "${cp_stu}", term_id: "${cp_term}", plan_template_id: "${cp_tpl}" }
              as: Registrar
              captures: { cp_enr: $.data.id }
            - call: "POST /institutions/charges"
              payload: { enrollment_id: "${cp_enr}", kind: "TUITION", amount_cents: 120000 }
              as: Registrar
            - call: "GET /institutions/enrollments/${cp_enr}"
              as: Registrar
              captures: { cp_v0: $.data.version }
            - call: "POST /institutions/enrollments/${cp_enr}/activate"
              payload: { expected_enrollment_version: "${cp_v0}" }
              as: Registrar
            - call: "GET /institutions/installments?enrollment_id=${cp_enr}"
              as: Registrar
              captures: { cp_i1: $.data.0.id }
          trigger:
            - call: "POST /institutions/payments"
              payload: { enrollment_id: "${cp_enr}", purpose: "INSTALLMENT", amount_cents: 120000, installment_id: "${cp_i1}" }
              as: Bursar
              captures: { cp_pay: $.data.id }
            - call: "POST /institutions/payments/${cp_pay}/settle"
              as: Bursar
            - call: "GET /institutions/enrollments/${cp_enr}"
              as: Registrar
              captures: { cp_status: $.data.status, cp_bal: $.data.scheduled_balance_cents }
          assert:
            - "Enrollment.${cp_enr}.status == COMPLETED"
            - "Enrollment.${cp_enr}.scheduled_balance_cents == 0"

      - name: error_activate_outside_term_open_stub
        claim_type: Precondition Enforcement
        grounds: [state_machines.Enrollment.PENDING_to_ACTIVE, "errors[ERR_TERM_NOT_OPEN]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / activate_depends_on_term_open
          rationale: "ERR_TERM_NOT_OPEN on activate against a LOCKED term is the asserted failure path of that §1.8 instance."

      - name: error_payment_settle_on_withdrawn_enrollment_stub
        claim_type: Precondition Enforcement
        grounds: [state_machines.Payment.PENDING_to_SETTLED, "errors[ERR_ENROLLMENT_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / payment_settle_depends_on_enrollment_active
          rationale: "ERR_ENROLLMENT_NOT_ACTIVE on settle after withdraw is the asserted failure path of that §1.8 instance."

