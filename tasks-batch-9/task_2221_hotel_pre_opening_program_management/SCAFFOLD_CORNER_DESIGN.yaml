      - name: peer_roles_all_read_the_program_but_only_its_owner_writes_it
        claim_type: peer_roles
        grounds:
          - "§1.7 role_model is segregation_of_duties over eight peer roles: every GET endpoint in §1.5 lists all eight, while each write lists only its owners, so read access is uniform and write access is partitioned."
        distinguishing_aspect: "Read access is uniform across the eight peer roles while the write is partitioned: ProcurementManager reads the same program it cannot suspend, and the 403 arrives instead of the state error the call would otherwise hit."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' baselined by pd-baseline-1 over a single 30-day CONSTRUCTION_COMPLETE milestone, which was started and then completed at clock 2026-10-01: schedule_state CONSTRUCTION_COMPLETE, projected_opening_date_committed 2026-10-15, schedule_slip_days 0, version 2."
