            - "trigger call 1 returns 201 and lot B becomes DISPUTED"
            - "trigger call 2 returns 200 with data.status == \"UPHELD\" and data.resolved_by_user_id == \"fa-2\"; lot B is LOT_REJECTED again with reject_reason \"DISPUTE_UPHELD\", and its CouponItem is still REJECTED_MISREDEEMED"
            - "trigger call 3 returns 201 — a second dispute on the same lot is legal because the guard excludes UPHELD, and the window test uses lot.updated_at, which the first cycle refreshed"
            - "trigger call 4 returns 200 with data.status == \"OVERTURNED\""
            - "trigger call 5: lot B is \"REINSTATED\" with reject_reason null, accepted_qty == 1, rejected_qty == 0, gross_face_value_cents == 50, handling_fee_cents == 7, and its CouponItem is REINSTATED with reject_code and duplicate_of_item_id cleared"
            - "trigger call 6: data.adjudicated_face_value_cents == 100 — numerically unchanged across the whole loop — while accepted_item_face_value_cents == 100, rejected_item_face_value_cents == 0, settled_gross_face_value_cents == 100, settled_handling_fee_cents == 14, rejected_lot_count == 0"
            - "trigger call 7: data.accepted_redemption_count == 2 — one unit from lot A's finalize plus one from the reinstatement"
            - "trigger call 8: total_count == 2, one UPHELD and one OVERTURNED dispute on the same lot"

      - name: digital_event_records_unmatched_when_the_only_clip_has_expired
        claim_type: valid_transition
        grounds:
          - state_machines.DigitalRedemptionEvent.transitions.creation_to_UNMATCHED
          - state_machines.DigitalClip.transitions.CLIPPED_to_EXPIRED_UNUSED
          - calculations.clip_expiry
          - calculations.digital_clip_match
        distinguishing_aspect: |
          The clip sweep is strictly less-than while the matcher's expiry test is
          inclusive, and the two agree exactly on the boundary day: on
          2026-08-06 both clips survive the sweep and consumer C1's event still
          MATCHES a clip expiring that very day, while one day later C2's clip is
          EXPIRED_UNUSED and the event is created as a 201 with status UNMATCHED
          and reject_code NO_ELIGIBLE_CLIP — an unmatched redemption is recorded,
          never rejected.
        test_recipe:
          setup:
            - "digital offer with clip_validity_days 5, face 50, expiring 2026-12-31, so both clips get clip_expires_at min(2026-08-06, 2027-01-30) = 2026-08-06"
            - "two clips taken at the default clock 2026-08-01, one for consumer C1 and one for C2"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { mfr_id: $.data.id }
            - call: "POST /retailers"
              payload: { legal_name: "Northgate Markets" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { ret_id: $.data.id }
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "SOUPDIG", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-12-31", redemption_instructions: "Clip and save", barcode_family: "GS1_DATABAR", max_redemptions: 1000, digital_enabled: true, clip_validity_days: 5 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/register"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /offers/${offer_id}/activate"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /digital-clips"
              payload: { offer_id: "${offer_id}", consumer_ref: "C1" }
              as: Retailer
              as_user_id: "${ret_id}"
              captures: { clip1_id: $.data.id }
            - call: "POST /digital-clips"
              payload: { offer_id: "${offer_id}", consumer_ref: "C2" }
              as: Retailer
              as_user_id: "${ret_id}"
              captures: { clip2_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T00:00:00Z" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /digital-redemption-events"
              payload: { offer_id: "${offer_id}", retailer_id: "${ret_id}", consumer_ref: "C1" }
              as: Retailer
              as_user_id: "${ret_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-07T00:00:00Z" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "GET /digital-clips/${clip2_id}"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fa-1"
            - call: "POST /digital-redemption-events"
              payload: { offer_id: "${offer_id}", retailer_id: "${ret_id}", consumer_ref: "C2" }
              as: Retailer
              as_user_id: "${ret_id}"
            - call: "GET /offers/${offer_id}"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
          assert:
            - "both setup clips returned clipped_at \"2026-08-01\" and clip_expires_at \"2026-08-06\" with status \"CLIPPED\""
            - "trigger call 1 returns expired_clip_count == 0 — the sweep uses clip_expires_at < the new date, and 2026-08-06 is not < 2026-08-06"
            - "trigger call 2 returns 201 with data.status == \"MATCHED\", data.matched_clip_id == ${clip1_id}, data.reject_code null, data.redeemed_at \"2026-08-06\" and data.face_value_cents == 50 — the matcher's clip_expires_at >= redeemed_at test is inclusive"
            - "trigger call 3 returns expired_clip_count == 1 — only C2's clip is swept; C1's is already MATCHED and therefore out of the sweep's input set"
            - "trigger call 4: data.status == \"EXPIRED_UNUSED\" and data.matched_event_id is null"
            - "trigger call 5 returns 201, not an error: data.status == \"UNMATCHED\", data.reject_code == \"NO_ELIGIBLE_CLIP\", data.matched_clip_id is null, data.face_value_cents == 50"
            - "trigger call 6: data.accepted_redemption_count == 1 — the MATCHED event advanced it once and the UNMATCHED event did not touch it"

      - name: manufacturer_suspended_is_terminal_and_blocks_offer_registration
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Manufacturer.terminal_states
          - state_machines.Offer.transitions.DRAFT_to_REGISTERED
          - validations[priority=11][ERR_MANUFACTURER_SUSPENDED]
        distinguishing_aspect: |
          SUSPENDED is the Manufacturer machine's only terminal state and there
          is no reinstate path, so a second suspend is 409 while the suspension's
          real bite is cross-entity: registering a DRAFT offer of that
          manufacturer returns 422 ERR_MANUFACTURER_SUSPENDED and the offer keeps
          barcode_payload null, proving the barcode side effect never ran.
        test_recipe:
          setup:
            - "one ACTIVE manufacturer with one DRAFT offer that has never been registered"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { mfr_id: $.data.id }
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "SOUP50", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-12-31", redemption_instructions: "Save 50c", barcode_family: "GS1_DATABAR", max_redemptions: 1000 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { offer_id: $.data.id }
          trigger:
            - call: "POST /manufacturers/${mfr_id}/suspend"
              payload: { reason: "Unfunded invoices past 90 days" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /manufacturers/${mfr_id}/suspend"
              payload: { reason: "Second attempt" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /offers/${offer_id}/register"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "GET /offers/${offer_id}"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "GET /manufacturers/${mfr_id}"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
          assert:
            - "trigger call 1 returns 200 with data.status == \"SUSPENDED\" and data.version == 2"
            - "trigger call 2 returns 409 ERR_INVALID_STATE_TRANSITION — there is no SUSPENDED -> SUSPENDED row and no reinstate trigger anywhere in the Manufacturer machine"
            - "trigger call 3 returns 422 ERR_MANUFACTURER_SUSPENDED"
            - "trigger call 4: data.status is still \"DRAFT\", data.barcode_payload is null and data.version == 1 — the register side effect did not run"
            - "trigger call 5: data.status == \"SUSPENDED\" and data.version == 2, unchanged by the two refused calls"

      - name: submission_parallel_intake_and_settlement_dimensions_move_independently
        claim_type: parallel_dimensions
        grounds:
          - state_machines.Submission.dimension.intake_status
          - state_machines.Submission.dimension.settlement_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / submission_parallel_intake_and_settlement_dimensions
          rationale: "The named §1.8 instance walks both Submission dimensions and asserts the combined (intake_status, settlement_status) pair after each move."

      - name: invoice_fund_branch_selects_funded_or_short_funded_on_the_same_trigger
        claim_type: branching_fork
        grounds:
          - state_machines.ManufacturerInvoice.transitions.ISSUED_to_FUNDED
          - state_machines.ManufacturerInvoice.transitions.ISSUED_to_SHORT_FUNDED
        excluded_because:
          difficulty_instance: non_linear_state_machine / manufacturer_invoice_fund_branch_fork
          rationale: "The named §1.8 instance drives one fund endpoint into both branches and asserts the branch guard on funded_amount_cents + amount_cents."

      - name: dispute_info_request_cycle_terminates_at_the_round_cap
        claim_type: cyclic
        grounds:
          - state_machines.Dispute.transitions.UNDER_REVIEW_to_INFO_REQUESTED
          - validations[priority=31][ERR_INFO_ROUND_LIMIT]
        excluded_because:
          difficulty_instance: non_linear_state_machine / dispute_info_request_cycle_capped_at_two_rounds
          rationale: "The named §1.8 instance runs both legal rounds and asserts ERR_INFO_ROUND_LIMIT on the third request-info."

      - name: funding_reversal_reverses_every_original_side_effect
        claim_type: compensation
        grounds:
          - state_machines.ManufacturerInvoice.transitions.FUNDED_to_REVERSED
        excluded_because:
          difficulty_instance: compensating_invariant / funding_reversal_restores_manufacturer_ledger_exactly
          rationale: "The named §1.8 instance asserts the manufacturer ledger, invoice funding fields and statement/submission holds before and after the reversal with no drift."

      - name: invoice_reconciles_when_every_statement_is_paid
        claim_type: bubble_up
        grounds:
          - state_machines.ManufacturerInvoice.transitions.FUNDED_to_RECONCILED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / statement_release_gated_on_invoice_funded
          rationale: "The named §1.8 instance asserts the FUNDED -> RECONCILED bubble-up after the last statement of the invoice reaches PAID."

      - name: release_payment_syncs_manufacturer_and_retailer_ledgers
        claim_type: ledger_sync
        grounds:
          - state_machines.SettlementStatement.transitions.SCHEDULED_to_PAID
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / statement_release_gated_on_invoice_funded
          rationale: "The named §1.8 instance asserts Manufacturer.disbursed_total_cents, funding_balance_cents and Retailer.unpaid_balance_cents before and after release-payment."

      - name: statement_schedule_is_guarded_by_the_absence_of_an_open_dispute
        claim_type: guarded_transitions
        grounds:
          - state_machines.SettlementStatement.transitions.DRAFT_to_SCHEDULED
          - validations[priority=13][ERR_DISPUTE_OPEN]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / statement_schedule_gated_on_no_open_dispute
          rationale: "The named §1.8 instance asserts ERR_DISPUTE_OPEN with the dispute open and the identical schedule succeeding once it is resolved."

  # =====================================================================
  # Table 3 — Calculations
  # =====================================================================
  - section: calculations
    instances:

      - name: upc_barcode_family_encodes_units_and_grace_but_drops_the_expiry
        claim_type: correct_result
        grounds:
          - calculations.offer_barcode_payload
          - entities.Offer.fields.barcode_family
          - entities.Offer.fields.barcode_payload
        distinguishing_aspect: |
          The UPC_A_WITH_EXT5 branch folds purchase_requirement_units and
          redemption_grace_days into one ext5 field (units * 1000 + grace) and
          encodes no expiration date at all, so two offers differing only in
          expiration_date register byte-identical 17-digit payloads, while the
          GS1_DATABAR branch of the same offer terms yields a 25-digit payload
          carrying YYMMDD — which is exactly why expiry rejection is ladder step
          2 and cannot be inferred from the barcode alone.
        test_recipe:
          setup:
            - "one manufacturer with gs1_company_prefix 038000"
            - "three DRAFT offers on face 50, purchase_requirement_units 1, redemption_grace_days 30: two UPC_A_WITH_EXT5 differing only in expiration_date, one GS1_DATABAR"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { mfr_id: $.data.id }
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "SOUPU1", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-12-31", redemption_instructions: "Save 50c", barcode_family: "UPC_A_WITH_EXT5", max_redemptions: 1000 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { u1_id: $.data.id }
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "SOUPU2", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2027-01-31", redemption_instructions: "Save 50c", barcode_family: "UPC_A_WITH_EXT5", max_redemptions: 1000 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { u2_id: $.data.id }
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "SOUPG1", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-12-31", redemption_instructions: "Save 50c", barcode_family: "GS1_DATABAR", max_redemptions: 1000 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { g1_id: $.data.id }
          trigger:
            - call: "POST /offers/${u1_id}/register"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /offers/${u2_id}/register"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /offers/${g1_id}/register"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
          assert:
            - "trigger call 1: data.barcode_payload == \"50380000005001030\" — \"5\" + \"038000\" + \"00050\" + zero_pad_left(1*1000 + 30, 5); length 17"
            - "trigger call 2: data.barcode_payload == \"50380000005001030\", byte-identical to trigger call 1 despite the 2027-01-31 expiration_date"
            - "trigger call 3: data.barcode_payload == \"8110380000005001261231030\" — \"811\" + \"038000\" + \"00050\" + \"01\" + \"261231\" + \"030\"; length 25"
            - "all three offers moved DRAFT -> REGISTERED with version 2 and status \"REGISTERED\""

      - name: count_variance_of_exactly_two_percent_is_accepted
        claim_type: threshold
        grounds:
          - calculations.submission_count_variance
          - validations[priority=25][ERR_COUNT_VARIANCE_EXCEEDED]
          - state_machines.Submission.transitions.RECEIVED_to_COUNT_VERIFIED
        distinguishing_aspect: |
          The tolerance comparison is strictly greater-than on a value already
          rounded to two decimals: declared 100 against verified 98 gives exactly
          2.00 and is accepted, while verified 97 gives 3.00 and is refused with
          422 ERR_COUNT_VARIANCE_EXCEEDED, leaving the submission in RECEIVED
          with verified_count 0 so the clerk can recount and retry.
        test_recipe:
          setup:
            - "one retailer with two submissions, each declared_count 100, on adjacent non-overlapping postmark windows"
          setup_api_calls:
            - call: "POST /retailers"
              payload: { legal_name: "Northgate Markets" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { ret_id: $.data.id }
            - call: "POST /submissions"
              payload: { retailer_id: "${ret_id}", channel: "MAIL", declared_count: 100, postmark_window_start: "2026-07-01", postmark_window_end: "2026-07-15" }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { sub_ok: $.data.id }
            - call: "POST /submissions"
              payload: { retailer_id: "${ret_id}", channel: "MAIL", declared_count: 100, postmark_window_start: "2026-07-15", postmark_window_end: "2026-07-31" }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { sub_bad: $.data.id }
          trigger:
            - call: "POST /submissions/${sub_ok}/verify-count"
              payload: { verified_count: 98 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submissions/${sub_bad}/verify-count"
              payload: { verified_count: 97 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "GET /submissions/${sub_bad}"
              payload: {}
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submissions/${sub_bad}/verify-count"
              payload: { verified_count: 102 }
              as: IntakeClerk
              as_user_id: "clerk-1"
          assert:
            - "trigger call 1 returns 200 with data.count_variance_pct == 2.00, data.verified_count == 98, data.intake_status == \"COUNT_VERIFIED\""
            - "trigger call 2 returns 422 ERR_COUNT_VARIANCE_EXCEEDED — round_half_up(3 * 100 / 100, 2) == 3.00 > 2.00"
            - "trigger call 3: data.intake_status is still \"RECEIVED\", data.verified_count == 0, data.count_variance_pct == 0.00, data.version == 1 — the refused verification wrote nothing"
            - "trigger call 4 returns 200 with data.count_variance_pct == 2.00 — the absolute value makes an overcount of 2 as acceptable as an undercount of 2 — and data.verified_count == 102"

      - name: clip_expiry_is_capped_by_the_offer_grace_not_the_validity_days
        claim_type: threshold
        grounds:
          - calculations.clip_expiry
          - entities.Offer.fields.redemption_grace_days
          - entities.DigitalClip.fields.clip_expires_at
        distinguishing_aspect: |
          Both offers would give by_validity 2026-09-30 from clip_validity_days
          60 at the 2026-08-01 clock, but the min() against expiration_date +
          redemption_grace_days wins in both cases and differs between them:
          grace 0 pins the clip to 2026-08-10 (the expiration date itself) while
          grace 30 pins it to 2026-09-09 — so the same validity setting produces
          two different expiries on the same day.
        test_recipe:
          setup:
            - "two digital offers expiring 2026-08-10 with clip_validity_days 60, one with redemption_grace_days 0 and one with 30, both ACTIVE at the 2026-08-01 clock"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { mfr_id: $.data.id }
            - call: "POST /retailers"
              payload: { legal_name: "Northgate Markets" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { ret_id: $.data.id }
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "NOGRACE", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-08-10", redemption_instructions: "Clip and save", barcode_family: "GS1_DATABAR", max_redemptions: 1000, redemption_grace_days: 0, digital_enabled: true, clip_validity_days: 60 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { off_a: $.data.id }
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "GRACE30", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-08-10", redemption_instructions: "Clip and save", barcode_family: "GS1_DATABAR", max_redemptions: 1000, redemption_grace_days: 30, digital_enabled: true, clip_validity_days: 60 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { off_b: $.data.id }
            - call: "POST /offers/${off_a}/register"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /offers/${off_a}/activate"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /offers/${off_b}/register"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /offers/${off_b}/activate"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /digital-clips"
              payload: { offer_id: "${off_a}", consumer_ref: "C1" }
              as: Retailer
              as_user_id: "${ret_id}"
            - call: "POST /digital-clips"
              payload: { offer_id: "${off_b}", consumer_ref: "C1" }
              as: Retailer
              as_user_id: "${ret_id}"
          assert:
            - "trigger call 1: data.clipped_at == \"2026-08-01\" and data.clip_expires_at == \"2026-08-10\" == min(2026-08-01 + 60 days, 2026-08-10 + 0 days)"
            - "trigger call 2: data.clipped_at == \"2026-08-01\" and data.clip_expires_at == \"2026-09-09\" == min(2026-09-30, 2026-08-10 + 30 days)"
            - "neither clip took the 2026-09-30 value that clip_validity_days alone would imply, and both are status \"CLIPPED\" with matched_event_id null"
            - "the two clips coexist because CLIP_CONCURRENCY_LIMIT is per (offer_id, consumer_ref): consumer C1 holds one live clip on each offer"

      - name: misredemption_match_picks_the_earliest_qualifying_basket
        claim_type: chronological
        grounds:
          - calculations.misredemption_match
          - entities.CouponItem.fields.matched_purchase_record_id
          - entities.CouponItem.fields.claimed_units
        distinguishing_aspect: |
          Two baskets share pos_transaction_ref POS-1 and both satisfy the
          3-unit requirement, but the winner is chosen by transaction_date ASC,
          not by creation order and not by basket size: the 2026-07-10 basket
          with qualifying_units 3 is named on the item even though the
          2026-07-20 basket with qualifying_units 5 was created first and is
          larger.
        test_recipe:
          setup:
            - "one ACTIVE offer with purchase_requirement_units 1, face 50, fee 7"
            - "two PurchaseDataRecords under POS-1, created late-date-first: (2026-07-20, qualifying_units 5) then (2026-07-10, qualifying_units 3)"
            - "one lot of counted_qty 1 holding a single item with claimed_units 3"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { mfr_id: $.data.id }
            - call: "POST /retailers"
              payload: { legal_name: "Northgate Markets" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { ret_id: $.data.id }
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "SOUP50", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-12-31", redemption_instructions: "Save 50c", barcode_family: "GS1_DATABAR", max_redemptions: 1000 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/register"
              payload: {}
