  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: adjustment_reversal_restores_the_balance_identity
        grounds:
          - endpoints.POST /assessment-adjustments/{id}/reverse
          - entities.Assessment.fields.balance_due_cents
          - entities.Assessment.fields.total_adjustments_cents
          - state_machines.Assessment
        distinguishing_aspect: |
          A MANUAL PAYMENT of the whole 4762-cent balance drives balance_due_cents to 0
          and the collection axis to SATISFIED; reversing that row must undo BOTH — the
          ledger returns to total_adjustments_cents 0, the balance back to 4762 and the
          collection axis back to DUE, with the invariant
          balance + adjustments + paid == total_due holding at every step. An
          implementation that only re-adds the money leaves the assessment SATISFIED
          with a positive balance.
        test_recipe:
          setup:
            - "The MINI fixture with the clock on 2026-06-30 and a 76192-cent CONSUMABLE purchase, issued 2026-06-30 at total_due_cents 4762 with balance_due_cents 4762; the version returned by the issue call is captured for the OCC field."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
            - call: "POST /taxpayers"
              payload: { legal_name: "Ridgeline Tools Inc", permit_number: "P-2710-K1", industry_naics_code: "444140", filing_frequency: "QUARTERLY", gross_receipts_annual_cents: 100000000, delinquent_period_count: 0 }
              as: SelectionAnalyst
              captures: { tk_id: "$.data.id" }
            - call: "POST /industry-projects"
              payload: { project_name: "Hardware K1", industry_naics_code: "444140", industry_error_rate_bp: 3000, selection_mode: "THRESHOLD", selection_threshold_score: 0, selection_quota: 2 }
              as: SelectionAnalyst
              captures: { projk_id: "$.data.id" }
            - call: "POST /industry-projects/${projk_id}/selection-runs"
              payload: {}
              as: SelectionAnalyst
            - call: "GET /audit-leads"
              payload: { industry_project_id: "${projk_id}", status: "SELECTED" }
              as: SelectionAnalyst
              captures: { leadk_id: "$.data[0].id" }
            - call: "POST /audit-leads/${leadk_id}/convert"
              payload: { lead_auditor_user_id: "auditor-1", audit_type: "DESK" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
              captures: { audit_id: "$.data.id" }
            - call: "POST /audits/${audit_id}/scope"
              payload: { audit_type: "DESK", scope_period_start: "2026-01-01", scope_period_end: "2026-06-30" }
              as: FieldAuditor
              as_user_id: "auditor-1"
              captures: { audit_v: "$.data.version" }
            - call: "POST /sampling-agreements"
              payload: { audit_id: "${audit_id}", expected_audit_version: "${audit_v}", methodology: "RATIO_ESTIMATION", confidence_level_bp: 9000, minimum_sample_size: 1, strata: [{ period_start: "2026-01-01", period_end: "2026-07-01", population_base_amount_cents: 10000000, population_unit_count: 100 }] }
              as: FieldAuditor
              as_user_id: "auditor-1"
              captures: { agr_id: "$.data.id" }
            - call: "POST /sampling-agreements/${agr_id}/agree"
              payload: { agreed_by_name: "T. Alvarez" }
              as: Taxpayer
              as_user_id: "${tk_id}"
            - call: "POST /sample-units"
              payload: { sampling_agreement_id: "${agr_id}", stratum_index: 0, invoice_reference: "K1-1", invoice_date: "2026-03-02", invoice_amount_cents: 100000, error_class: "NO_ERROR" }
              as: FieldAuditor
              as_user_id: "auditor-1"
            - call: "POST /use-tax-purchases"
              payload: { audit_id: "${audit_id}", vendor_name: "Northline Abrasives", invoice_date: "2026-04-01", purchase_price_cents: 76192, asset_class: "CONSUMABLE" }
              as: FieldAuditor
