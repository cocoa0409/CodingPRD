      - name: trust_officer_cannot_confirm_default
        claim_type: role_permission
        grounds: ["roles[TrustOfficer]", "endpoints.POST /default-cases/{id}/confirm", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "TrustOfficer declaring a default cannot confirm it at the ROLE level either (confirm is TrustManager-exclusive): a TrustOfficer confirm attempt fails ERR_FORBIDDEN — distinct from the same-user SoD check."
        test_recipe:
          setup: ["active indenture; ALLEGED default case declared by officer-1"]
          setup_api_calls:
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 400000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /default-cases", payload: { indenture_id: "${ind}", default_type: "PAYMENT", cure_deadline: "2026-12-31T00:00:00Z" }, as: TrustOfficer, as_user_id: "officer-1", captures: { dc: $.data.id } }
          trigger:
            - { call: "POST /default-cases/${dc}/confirm", payload: {}, as: TrustOfficer, as_user_id: "officer-2", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN (role gate fires before SoD even for a different officer id)"

  # =====================================================================
  # Section: complexity_layers
  # =====================================================================
  - section: complexity_layers
    instances:
      - name: occ_trustee_appointment_stale_version_and_supersede
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[appointment-supersede-stale-indenture]", "endpoints.POST /trustee-appointments"]
        distinguishing_aspect: "Two strictly sequential creates: the first succeeds with the observed indenture version; the second, replaying the SAME captured version, fails 412 ERR_STALE_VERSION — and a correctly-versioned retry supersedes the in-flight first appointment (PROPOSED -> SUPERSEDED)."
        test_recipe:
          setup: ["active indenture; client has observed version after activation"]
          setup_api_calls:
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 400000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "GET /indentures/${ind}", payload: {}, as: PlatformAdmin, captures: { ind_v: $.data.version } }
          trigger:
            - { call: "POST /trustee-appointments", payload: { indenture_id: "${ind}", incoming_trustee_ref: "trustee-beta", reason: "RESIGNATION", proposed_effective_date: "2026-09-01", expected_indenture_version: "${ind_v}" }, as: PlatformAdmin, captures: { appt1: $.data.id } }
            - { call: "POST /trustee-appointments", payload: { indenture_id: "${ind}", incoming_trustee_ref: "trustee-gamma", reason: "REMOVAL", proposed_effective_date: "2026-10-01", expected_indenture_version: "${ind_v}" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /indentures/${ind}", payload: {}, as: PlatformAdmin, captures: { ind_v2: $.data.version } }
            - { call: "POST /trustee-appointments", payload: { indenture_id: "${ind}", incoming_trustee_ref: "trustee-gamma", reason: "REMOVAL", proposed_effective_date: "2026-10-01", expected_indenture_version: "${ind_v2}" }, as: PlatformAdmin, captures: { appt2: $.data.id } }
          assert:
            - "first create succeeds: TrusteeAppointment.${appt1}.status == PROPOSED"
            - "second create replaying the stale version fails with error_id == ERR_STALE_VERSION (412)"
            - "correctly-versioned retry succeeds: ${appt2} PROPOSED, and ${appt1} is now SUPERSEDED"
            - "Indenture.${ind}.version advanced by exactly 2 across the two successful creates"

      - name: occ_release_request_stale_item_and_supersede
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[release-request-supersede-stale-item]", "endpoints.POST /collateral-release-requests"]
        distinguishing_aspect: "OCC on CollateralItem.version: a second create with the pre-first-create version fails 412; a correctly-versioned retry supersedes the prior SUBMITTED request (SUBMITTED -> SUPERSEDED)."
        test_recipe:
          setup: ["active indenture, position 400000000; collateral C2 PLEDGED with fresh valuation"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 400000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 400000000 }, as: PlatformAdmin }
            - { call: "POST /collateral-items", payload: { indenture_id: "${ind}", description: "C2", collateral_type: "REAL_ESTATE", appraised_value_cents: 500000000, valuation_date: "2026-04-01" }, as: TrustOfficer, captures: { c2: $.data.id, c2_v: $.data.version } }
          trigger:
            - { call: "POST /collateral-release-requests", payload: { collateral_item_id: "${c2}", request_type: "RELEASE", expected_collateral_item_version: "${c2_v}" }, as: Issuer, as_user_id: "issuer-1", captures: { rr1: $.data.id } }
            - { call: "POST /collateral-release-requests", payload: { collateral_item_id: "${c2}", request_type: "RELEASE", expected_collateral_item_version: "${c2_v}" }, as: Issuer, as_user_id: "issuer-1", captures: { err: $.data.error_id } }
            - { call: "GET /collateral-items/${c2}", payload: {}, as: TrustOfficer, captures: { c2_v2: $.data.version } }
            - { call: "POST /collateral-release-requests", payload: { collateral_item_id: "${c2}", request_type: "RELEASE", expected_collateral_item_version: "${c2_v2}" }, as: Issuer, as_user_id: "issuer-1", captures: { rr2: $.data.id } }
          assert:
            - "first request ${rr1} SUBMITTED"
            - "stale replay: error_id == ERR_STALE_VERSION (412)"
            - "retry ${rr2} SUBMITTED and ${rr1} now SUPERSEDED"
            - "CollateralItem.${c2}.version advanced by exactly 2 across the two successful creates"

      - name: occ_direction_stale_case_and_supersede
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[direction-supersede-stale-case]", "endpoints.POST /directions"]
        distinguishing_aspect: "OCC on DefaultCase.version: a second direction create with the pre-first-create version fails 412; a correctly-versioned retry supersedes the CIRCULATING first direction (CIRCULATING -> SUPERSEDED)."
        test_recipe:
          setup: ["active indenture, tranche, position A; CONFIRMED default case with observed version"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 400000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 400000000 }, as: PlatformAdmin }
            - { call: "POST /default-cases", payload: { indenture_id: "${ind}", default_type: "PAYMENT", cure_deadline: "2026-12-31T00:00:00Z" }, as: TrustOfficer, as_user_id: "officer-1", captures: { dc: $.data.id } }
            - { call: "POST /default-cases/${dc}/confirm", payload: {}, as: TrustManager, as_user_id: "manager-1" }
            - { call: "GET /default-cases/${dc}", payload: {}, as: TrustOfficer, captures: { dc_v: $.data.version } }
          trigger:
            - { call: "POST /directions", payload: { default_case_id: "${dc}", instruction_type: "ACCELERATE", expires_at: "2026-12-31T00:00:00Z", expected_default_case_version: "${dc_v}" }, as: TrustOfficer, captures: { dir1: $.data.id } }
            - { call: "POST /directions", payload: { default_case_id: "${dc}", instruction_type: "WAIVE_DEFAULT", expires_at: "2026-12-31T00:00:00Z", expected_default_case_version: "${dc_v}" }, as: TrustOfficer, captures: { err: $.data.error_id } }
            - { call: "GET /default-cases/${dc}", payload: {}, as: TrustOfficer, captures: { dc_v2: $.data.version } }
            - { call: "POST /directions", payload: { default_case_id: "${dc}", instruction_type: "WAIVE_DEFAULT", expires_at: "2026-12-31T00:00:00Z", expected_default_case_version: "${dc_v2}" }, as: TrustOfficer, captures: { dir2: $.data.id } }
          assert:
            - "first direction ${dir1} CIRCULATING"
            - "stale replay: error_id == ERR_STALE_VERSION (412)"
            - "retry ${dir2} CIRCULATING and ${dir1} now SUPERSEDED"

      - name: interest_gross_recomputed_at_execute_from_current_positions
        claim_type: derived_field_reconciliation
        grounds: ["endpoints.POST /payment-runs", "calculations.interest_accrual", "entities.PaymentRun.fields.gross_amount_cents"]
        distinguishing_aspect: "An INTEREST run created when positions summed 1000000000 (provisional gross 25416667) is executed only AFTER a redemption cuts principals to 900000001; the executed gross is recomputed from current positions to 22875000 (9150000 + 8006250 + 5718750), not the creation-time figure."
        test_recipe:
          setup: ["active indenture, tranche, positions A 400000000 / B 350000000 / C 250000000; INTEREST run created (unfunded); SINKING_FUND_REDEMPTION 99999999 executed in between"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 1000000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15", notice_period_days: 30 }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-B", legal_name: "Holder B", contact_email: "b@x.com" }, as: PlatformAdmin, captures: { nhb: $.data.id } }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-C", legal_name: "Holder C", contact_email: "c@x.com" }, as: PlatformAdmin, captures: { nhc: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 400000000 }, as: PlatformAdmin }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nhb}", original_principal_cents: 350000000 }, as: PlatformAdmin }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nhc}", original_principal_cents: 250000000 }, as: PlatformAdmin }
            - { call: "POST /payment-runs", payload: { tranche_id: "${t1}", payment_type: "INTEREST", period_start_date: "2026-06-15", period_end_date: "2026-12-15", scheduled_payment_date: "2026-12-15" }, as: TrustOfficer, captures: { irun: $.data.id } }
            - { call: "POST /payment-runs", payload: { tranche_id: "${t1}", payment_type: "SINKING_FUND_REDEMPTION", scheduled_payment_date: "2026-06-15", target_amount_cents: 99999999 }, as: TrustOfficer, captures: { red: $.data.id } }
            - { call: "POST /payment-runs/${red}/fund", payload: { amount_cents: 99999999 }, as: Issuer, as_user_id: "issuer-1" }
            - { call: "POST /payment-runs/${red}/execute", payload: {}, as: TrustOfficer }
            - { call: "POST /payment-runs/${irun}/fund", payload: { amount_cents: 22875000 }, as: Issuer, as_user_id: "issuer-1" }
          trigger:
            - { call: "POST /payment-runs/${irun}/execute", payload: {}, as: TrustOfficer }
            - { call: "GET /distribution-records?payment_run_id=${irun}", payload: {}, as: TrustOfficer }
          assert:
            - "PaymentRun.${irun}.gross_amount_cents == 22875000 (recomputed at execute from reduced principals 360000001/315000000/225000000)"
            - "allocations in position-creation order are [9150000, 8006250, 5718750]"
            - "gross != 25416667 (the creation-time provisional figure) — reconciliation proven"

