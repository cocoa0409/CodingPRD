- section: rbac
  instances:
  - name: rbac_logistics_chief_cannot_create_incident
    claim_type: role_denial
    grounds:
    - roles.IncidentCommander
    - errors[ERR_FORBIDDEN_ROLE]
    distinguishing_aspect: Incident declaration is IncidentCommander-exclusive; LogisticsChief
      gets 403 before any payload validation.
    test_recipe:
      setup:
      - Empty database
      setup_api_calls: []
      trigger:
      - call: POST /emergency/incidents
        payload:
          incident_name: Nope
          incident_type: NATURAL
          declared_at: '2026-08-01T00:00:00Z'
        as: LogisticsChief
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_FORBIDDEN_ROLE (HTTP 403)
  - name: rbac_oncall_staff_cannot_create_callbacks
    claim_type: role_denial
    grounds:
    - roles.PlanningChief
    - roles.OnCallStaff
    distinguishing_aspect: OnCallStaff may only respond to their own requests; creation
      is PlanningChief-exclusive.
    test_recipe:
      setup:
      - Incident ACTIVATED
      setup_api_calls:
      - call: POST /emergency/incidents
        payload:
          incident_name: MCI-rbac
          incident_type: HUMAN
          declared_at: '2026-08-01T00:00:00Z'
        as: IncidentCommander
        captures:
          inc_id: $.data.id
      trigger:
      - call: POST /emergency/callback-requests
        payload:
          incident_id: ${inc_id}
          auto_select_count: 1
        as: OnCallStaff
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_FORBIDDEN_ROLE (HTTP 403)
  - name: rbac_hospital_admin_cannot_patch_improvement_task
    claim_type: role_denial
    grounds:
    - roles.EmergencyManager
    - roles.HospitalAdministrator
    distinguishing_aspect: Improvement-task advancement is EmergencyManager-exclusive;
      the executive approver role cannot drive task workflow.
    test_recipe:
      setup:
      - Incident demobilized; AAR DRAFT; task OPEN
      setup_api_calls:
      - call: POST /emergency/incidents
        payload:
          incident_name: MCI-rbac2
          incident_type: NATURAL
          declared_at: '2026-08-01T00:00:00Z'
        as: IncidentCommander
        captures:
          inc_id: $.data.id
      - call: POST /emergency/incidents/${inc_id}/demobilize
        as: IncidentCommander
      - call: POST /emergency/after-action-reports
        payload:
          subject_type: INCIDENT
          subject_id: ${inc_id}
          summary: AAR
        as: IncidentCommander
        captures:
          aar: $.data.id
      - call: POST /emergency/improvement-tasks
        payload:
          after_action_report_id: ${aar}
          description: Task
          priority: MEDIUM
          due_date: '2026-08-10T00:00:00Z'
          assigned_department: NURSING
        as: EmergencyManager
        captures:
          task: $.data.id
      trigger:
      - call: PATCH /emergency/improvement-tasks/${task}
        payload:
          target_status: IN_PROGRESS
        as: HospitalAdministrator
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_FORBIDDEN_ROLE (HTTP 403)
      - ImprovementTask.${task}.status remains OPEN
  - name: callback_respond_by_other_staff_rejected
    claim_type: ownership_enforcement
    grounds:
    - roles.OnCallStaff
    - errors[ERR_NOT_CALLBACK_OWNER]
    distinguishing_aspect: 'Entity-backed identity: respond requires X-User-ID ==
      request.staff_member_id; a different staff member is 403.'
    test_recipe:
      setup:
      - Staff s1 (request owner) and s2; incident ACTIVATED; PENDING request for s1
      setup_api_calls:
      - call: POST /emergency/staff-members
        payload:
          full_name: Owner
          badge_number: B-513
          department: ICU
          role_qualifications: []
          callback_eligible: true
          callback_seniority_score: 5
        as: HospitalAdministrator
        captures:
          s1: $.data.id
      - call: POST /emergency/staff-members
        payload:
          full_name: Other
          badge_number: B-514
          department: ICU
          role_qualifications: []
          callback_eligible: true
          callback_seniority_score: 4
        as: HospitalAdministrator
        captures:
          s2: $.data.id
      - call: POST /emergency/incidents
        payload:
          incident_name: MCI-owner
          incident_type: HUMAN
          declared_at: '2026-08-01T00:00:00Z'
        as: IncidentCommander
        captures:
          inc_id: $.data.id
      - call: POST /emergency/callback-requests
        payload:
          incident_id: ${inc_id}
          staff_member_id: ${s1}
        as: PlanningChief
        captures:
          cb1: $.data[0].id
      trigger:
      - call: POST /emergency/callback-requests/${cb1}/respond
        payload:
          outcome: ACCEPT
        as: OnCallStaff
        as_user_id: ${s2}
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_NOT_CALLBACK_OWNER (HTTP 403)
      - CallBackRequest.${cb1}.status remains PENDING
  - name: plan_approve_by_creator_rejected_segregation
    claim_type: segregation_of_duties
    grounds:
    - roles.HospitalAdministrator
    - errors[ERR_SEGREGATION_OF_DUTIES]
    - entities.PlanRevision.fields.created_by_id
    distinguishing_aspect: 'The same person may not draft and approve a plan: approve
      with the creator''s X-User-ID is 403 even under the HospitalAdministrator role;
      a different approver succeeds.'
    test_recipe:
      setup:
      - Staff u_em (plan creator) and u_ha; plan IN_REVIEW created by u_em
      setup_api_calls:
      - call: POST /emergency/staff-members
        payload:
          full_name: Em
          badge_number: B-960
          department: ADMINISTRATION
          role_qualifications: []
        as: HospitalAdministrator
        captures:
          u_em: $.data.id
      - call: POST /emergency/staff-members
        payload:
          full_name: Ha
          badge_number: B-961
          department: ADMINISTRATION
          role_qualifications: []
        as: HospitalAdministrator
        captures:
          u_ha: $.data.id
      - call: POST /emergency/plan-revisions
        payload:
          revision_label: EOP-sod
          change_summary: x
          effective_date: '2026-09-01T00:00:00Z'
        as: EmergencyManager
        as_user_id: ${u_em}
        captures:
          plan_id: $.data.id
      - call: POST /emergency/plan-revisions/${plan_id}/submit-review
        as: EmergencyManager
        as_user_id: ${u_em}
      trigger:
      - call: POST /emergency/plan-revisions/${plan_id}/approve
        as: HospitalAdministrator
        as_user_id: ${u_em}
        captures:
          err: $.data.error_id
      - call: POST /emergency/plan-revisions/${plan_id}/approve
        as: HospitalAdministrator
        as_user_id: ${u_ha}
        captures:
          st: $.data.status
      assert:
      - ${err} == ERR_SEGREGATION_OF_DUTIES (HTTP 403) for the creator-approver
      - ${st} == APPROVED for the independent approver
  - name: report_submit_by_creator_rejected_segregation
    claim_type: segregation_of_duties
    grounds:
    - roles.LiaisonOfficer
    - errors[ERR_SEGREGATION_OF_DUTIES]
    - entities.ExternalReport.fields.created_by_id
    distinguishing_aspect: 'Report filing has the same SoD wall: the drafting LiaisonOfficer
      cannot submit; a HospitalAdministrator can, and an on-time submission is flagged
      late=false.'
    test_recipe:
      setup:
      - Staff u_lo (creator) and u_ha; SITREP report DRAFT with due_at 2026-08-11
        (clock still at 2026-08-01 default)
      setup_api_calls:
      - call: POST /emergency/staff-members
        payload:
          full_name: Lo
          badge_number: B-970
          department: ADMINISTRATION
          role_qualifications:
          - LIAISON_OFFICER
        as: HospitalAdministrator
        captures:
          u_lo: $.data.id
      - call: POST /emergency/staff-members
        payload:
          full_name: Ha
          badge_number: B-971
          department: ADMINISTRATION
          role_qualifications: []
        as: HospitalAdministrator
        captures:
          u_ha: $.data.id
      - call: POST /emergency/external-reports
        payload:
          audience: REGIONAL_COALITION
          report_type: SITREP
          period_start: '2026-08-09T00:00:00Z'
          period_end: '2026-08-10T00:00:00Z'
          body_summary: coalition sitrep
        as: LiaisonOfficer
        as_user_id: ${u_lo}
        captures:
          rep: $.data.id
      trigger:
      - call: POST /emergency/external-reports/${rep}/submit
        as: LiaisonOfficer
        as_user_id: ${u_lo}
        captures:
          err: $.data.error_id
      - call: POST /emergency/external-reports/${rep}/submit
        as: HospitalAdministrator
        as_user_id: ${u_ha}
        captures:
          st: $.data.status
          late: $.data.submitted_late
      assert:
      - ${err} == ERR_SEGREGATION_OF_DUTIES (HTTP 403) for the creator-submitter
      - ${st} == SUBMITTED and ${late} == false (submitted at 2026-08-01T00:00:00Z,
        well before due 2026-08-11T00:00:00Z)
      - ExternalReport.${rep}.hours_late == 0.0
  - name: aar_approve_by_creator_rejected_segregation
    claim_type: segregation_of_duties
    grounds:
    - roles.HospitalAdministrator
    - errors[ERR_SEGREGATION_OF_DUTIES]
    - entities.AfterActionReport.fields.created_by_id
    distinguishing_aspect: 'AAR approval carries the third SoD wall: the IncidentCommander
      who drafted the AAR cannot also approve it as HospitalAdministrator under the
      same X-User-ID.'
    test_recipe:
      setup:
      - Staff u_ic (AAR creator) and u_ha; incident demobilized; AAR SUBMITTED
      setup_api_calls:
      - call: POST /emergency/staff-members
        payload:
          full_name: Ic
          badge_number: B-980
          department: ADMINISTRATION
          role_qualifications:
          - INCIDENT_COMMANDER
        as: HospitalAdministrator
        captures:
          u_ic: $.data.id
      - call: POST /emergency/staff-members
        payload:
          full_name: Ha
          badge_number: B-981
          department: ADMINISTRATION
          role_qualifications: []
        as: HospitalAdministrator
        captures:
          u_ha: $.data.id
      - call: POST /emergency/incidents
        payload:
          incident_name: MCI-aar-sod
          incident_type: NATURAL
          declared_at: '2026-08-01T00:00:00Z'
        as: IncidentCommander
        as_user_id: ${u_ic}
        captures:
          inc_id: $.data.id
      - call: POST /emergency/incidents/${inc_id}/demobilize
        as: IncidentCommander
        as_user_id: ${u_ic}
      - call: POST /emergency/after-action-reports
        payload:
          subject_type: INCIDENT
          subject_id: ${inc_id}
          summary: AAR
        as: IncidentCommander
        as_user_id: ${u_ic}
        captures:
          aar: $.data.id
      - call: POST /emergency/after-action-reports/${aar}/submit
        as: IncidentCommander
        as_user_id: ${u_ic}
      trigger:
      - call: POST /emergency/after-action-reports/${aar}/approve
        as: HospitalAdministrator
        as_user_id: ${u_ic}
        captures:
          err: $.data.error_id
      - call: POST /emergency/after-action-reports/${aar}/approve
        as: HospitalAdministrator
        as_user_id: ${u_ha}
        captures:
          st: $.data.status
      assert:
      - ${err} == ERR_SEGREGATION_OF_DUTIES (HTTP 403)
      - ${st} == APPROVED
- section: cross_cutting_layers
  instances:
  - name: occ_stale_expected_incident_version_rejected
    claim_type: optimistic_concurrency_stale
    grounds:
    - concurrency_rules[command-assignment-stale-incident]
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: 'Two strictly sequential assignment creates carrying the
      same observed incident version: the first succeeds (version 2→3), the second
      is rejected 412 because its expected version is now stale.'
    test_recipe:
      setup:
      - Incident ACTIVATED; two INCIDENT_COMMANDER-qualified staff; version advanced
        to 2 by a surge assessment and captured
      setup_api_calls:
      - call: POST /emergency/staff-members
        payload:
          full_name: Q Four
          badge_number: B-604
          department: ADMINISTRATION
          role_qualifications:
          - INCIDENT_COMMANDER
        as: HospitalAdministrator
        captures:
          q1: $.data.id
      - call: POST /emergency/staff-members
        payload:
          full_name: Q Five
          badge_number: B-605
          department: ADMINISTRATION
          role_qualifications:
          - INCIDENT_COMMANDER
        as: HospitalAdministrator
        captures:
          q2: $.data.id
      - call: POST /emergency/incidents
        payload:
          incident_name: MCI-occ
          incident_type: HUMAN
          declared_at: '2026-08-01T00:00:00Z'
        as: IncidentCommander
        captures:
          inc_id: $.data.id
      - call: POST /emergency/incidents/${inc_id}/assess-surge
        payload:
          staffed_bed_count: 100
          projected_census: 50
        as: IncidentCommander
        captures:
          v2: $.data.version
      trigger:
      - call: POST /emergency/command-assignments
        payload:
          incident_id: ${inc_id}
          staff_member_id: ${q1}
          command_role: INCIDENT_COMMANDER
          expected_incident_version: ${v2}
        as: IncidentCommander
        captures:
          a1: $.data.id
      - call: POST /emergency/command-assignments
        payload:
          incident_id: ${inc_id}
          staff_member_id: ${q2}
          command_role: SAFETY_OFFICER
          expected_incident_version: ${v2}
        as: IncidentCommander
        captures:
          err: $.data.error_id
      assert:
      - First create succeeds (201) and bumps IncidentEvent.${inc_id}.version to 3
      - ${err} == ERR_STALE_VERSION (HTTP 412) — the second create's expected version
        2 no longer matches
      - No SAFETY_OFFICER assignment row is created by the rejected call
  - name: occ_fresh_version_succeeds_and_increments
    claim_type: optimistic_concurrency_fresh
    grounds:
    - concurrency_rules[command-assignment-stale-incident]
    distinguishing_aspect: 'The happy path: a create carrying the current incident
      version succeeds and advances version by exactly 1.'
    test_recipe:
      setup:
      - Incident ACTIVATED at version 1; one qualified staff member
      setup_api_calls:
      - call: POST /emergency/staff-members
        payload:
          full_name: Q Six
          badge_number: B-606
          department: ADMINISTRATION
          role_qualifications:
          - LOGISTICS_CHIEF
        as: HospitalAdministrator
        captures:
          q1: $.data.id
      - call: POST /emergency/incidents
        payload:
          incident_name: MCI-occ2
          incident_type: HUMAN
          declared_at: '2026-08-01T00:00:00Z'
        as: IncidentCommander
        captures:
          inc_id: $.data.id
          v1: $.data.version
      trigger:
      - call: POST /emergency/command-assignments
        payload:
          incident_id: ${inc_id}
          staff_member_id: ${q1}
          command_role: LOGISTICS_CHIEF
          expected_incident_version: ${v1}
        as: IncidentCommander
        captures:
          a1: $.data.id
      - call: GET /emergency/incidents/${inc_id}
        as: IncidentCommander
        captures:
          v_after: $.data.version
      assert:
      - ${v1} == 1
      - CommandRoleAssignment.${a1}.status == ACTIVE
      - ${v_after} == 2 (exactly one increment per mutation)
  - name: auto_select_ranking_seniority_then_badge_tiebreak
    claim_type: selector_determinism
    grounds:
    - entities.StaffMember.fields.callback_seniority_score
    - entities.StaffMember.fields.badge_number
    distinguishing_aspect: 'Ranking pins score DESC with created_at ASC then badge_number
      ASC: two staff tied at score 90 under one clock timestamp are ordered by badge,
      ahead of a score-80 staff member.'
    test_recipe:
      setup:
      - Staff B-001 (score 90), B-002 (score 90), B-003 (score 80), all eligible;
        incident ACTIVATED
      setup_api_calls:
      - call: POST /emergency/staff-members
        payload:
          full_name: Tie A
          badge_number: B-001
          department: EMERGENCY
          role_qualifications: []
          callback_eligible: true
          callback_seniority_score: 90
        as: HospitalAdministrator
        captures:
          s1: $.data.id
      - call: POST /emergency/staff-members
        payload:
          full_name: Tie B
          badge_number: B-002
          department: EMERGENCY
          role_qualifications: []
          callback_eligible: true
          callback_seniority_score: 90
        as: HospitalAdministrator
        captures:
          s2: $.data.id
      - call: POST /emergency/staff-members
        payload:
          full_name: Low
          badge_number: B-003
          department: EMERGENCY
          role_qualifications: []
          callback_eligible: true
          callback_seniority_score: 80
        as: HospitalAdministrator
        captures:
          s3: $.data.id
      - call: POST /emergency/incidents
        payload:
          incident_name: MCI-rank
          incident_type: HUMAN
          declared_at: '2026-08-01T00:00:00Z'
        as: IncidentCommander
        captures:
          inc_id: $.data.id
      trigger:
      - call: POST /emergency/callback-requests
        payload:
          incident_id: ${inc_id}
          auto_select_count: 2
        as: PlanningChief
        captures:
          c1: $.data[0].staff_member_id
          c2: $.data[1].staff_member_id
      assert:
      - '${c1} == ${s1} (score 90 tie broken by badge_number ASC: B-001 before B-002)'
      - ${c2} == ${s2}
      - Exactly 2 requests created; ${s3} (score 80) not selected
  - name: auto_select_excludes_staff_with_open_callback
    claim_type: selector_eligibility_filter
    grounds:
    - entities.CallBackRequest.fields.status
    distinguishing_aspect: 'The eligibility filter excludes anyone already holding
      a PENDING or ACCEPTED request for the same incident: the top-ranked staff member
      is skipped on the second round.'
    test_recipe:
      setup:
      - Staff s1 (score 90) with an existing PENDING request; staff s2 (score 80)
        free; incident ACTIVATED
      setup_api_calls:
      - call: POST /emergency/staff-members
        payload:
          full_name: Busy
          badge_number: B-011
          department: EMERGENCY
          role_qualifications: []
          callback_eligible: true
          callback_seniority_score: 90
        as: HospitalAdministrator
        captures:
          s1: $.data.id
      - call: POST /emergency/staff-members
        payload:
          full_name: Free
          badge_number: B-012
          department: EMERGENCY
          role_qualifications: []
          callback_eligible: true
          callback_seniority_score: 80
        as: HospitalAdministrator
        captures:
          s2: $.data.id
      - call: POST /emergency/incidents
        payload:
          incident_name: MCI-excl
          incident_type: HUMAN
          declared_at: '2026-08-01T00:00:00Z'
        as: IncidentCommander
        captures:
          inc_id: $.data.id
      - call: POST /emergency/callback-requests
        payload:
          incident_id: ${inc_id}
          staff_member_id: ${s1}
        as: PlanningChief
      trigger:
      - call: POST /emergency/callback-requests
        payload:
          incident_id: ${inc_id}
          auto_select_count: 1
        as: PlanningChief
        captures:
          c1: $.data[0].staff_member_id
      assert:
      - ${c1} == ${s2} — s1 is excluded despite the higher score because of the open
        PENDING request
  - name: reorder_threshold_strict_less_than
    claim_type: threshold_boundary
    grounds:
    - calculations.ppe_burn_rate
    - entities.SupplyItem.fields.below_reorder_level
    distinguishing_aspect: days_of_supply == reorder_min_days is NOT below (strict
      <); only days == min − 1 flips the flag — exercised at 13 vs 13 then 12 vs 13.
    test_recipe:
      setup:
      - Item reorder_min_days 13; RECEIVE 20 then ISSUE 7 in-window (observed 1.0,
        no incident ⇒ projected 1.0, QOH 13, days 13)
      setup_api_calls:
      - call: POST /emergency/supply-items
        payload:
          item_name: Oxygen tanks
          category: OXYGEN
          unit: tank
          reorder_min_days: 13
        as: LogisticsChief
        captures:
          item_id: $.data.id
      - call: POST /emergency/stock-transactions
        payload:
          supply_item_id: ${item_id}
          transaction_type: RECEIVE
          quantity: 20
          occurred_at: '2026-07-30T09:00:00Z'
        as: LogisticsChief
      - call: POST /emergency/stock-transactions
        payload:
          supply_item_id: ${item_id}
          transaction_type: ISSUE
          quantity: 7
          occurred_at: '2026-07-30T10:00:00Z'
        as: LogisticsChief
      - call: GET /emergency/supply-items/${item_id}
        as: LogisticsChief
        captures:
          days0: $.data.days_of_supply
          below0: $.data.below_reorder_level
      trigger:
      - call: POST /emergency/stock-transactions
        payload:
          supply_item_id: ${item_id}
          transaction_type: ADJUST
          quantity: 12
          occurred_at: '2026-07-30T12:00:00Z'
        as: LogisticsChief
      - call: GET /emergency/supply-items/${item_id}
        as: LogisticsChief
        captures:
          days1: $.data.days_of_supply
          below1: $.data.below_reorder_level
      assert:
      - ${days0} == 13 and ${below0} == false (13 < 13 is false)
      - ${days1} == 12 and ${below1} == true (12 < 13)
      - ADJUST reset quantity_on_hand to 12 without touching the burn window (observed
        still 1.0)
  - name: quantity_on_hand_reconciles_across_transaction_types
    claim_type: derived_field_reconciliation
    grounds:
    - entities.SupplyItem.fields.quantity_on_hand
    - entities.StockTransaction.fields.transaction_type
    distinguishing_aspect: 'The derived ledger stays consistent through every mutation
      kind: 10 − 3 + 1 → adjust-to-25 reset → − 5 == 20.'
    test_recipe:
      setup:
      - 'Item exists; ledger: RECEIVE 10, ISSUE 3, RETURN 1, ADJUST 25, ISSUE 5 —
        all in-window'
      setup_api_calls:
      - call: POST /emergency/supply-items
        payload:
          item_name: Trauma kits
          category: OTHER_SUPPLY
          unit: each
          reorder_min_days: 1
        as: LogisticsChief
        captures:
          item_id: $.data.id
      - call: POST /emergency/stock-transactions
        payload:
          supply_item_id: ${item_id}
          transaction_type: RECEIVE
          quantity: 10
          occurred_at: '2026-07-30T09:00:00Z'
        as: LogisticsChief
      - call: POST /emergency/stock-transactions
        payload:
          supply_item_id: ${item_id}
          transaction_type: ISSUE
          quantity: 3
          occurred_at: '2026-07-30T09:10:00Z'
        as: LogisticsChief
      - call: POST /emergency/stock-transactions
        payload:
          supply_item_id: ${item_id}
          transaction_type: RETURN
          quantity: 1
          occurred_at: '2026-07-30T09:20:00Z'
        as: LogisticsChief
      - call: POST /emergency/stock-transactions
        payload:
          supply_item_id: ${item_id}
          transaction_type: ADJUST
          quantity: 25
          occurred_at: '2026-07-30T09:30:00Z'
        as: LogisticsChief
      trigger:
      - call: POST /emergency/stock-transactions
        payload:
          supply_item_id: ${item_id}
          transaction_type: ISSUE
          quantity: 5
          occurred_at: '2026-07-30T09:40:00Z'
        as: LogisticsChief
      - call: GET /emergency/supply-items/${item_id}
        as: LogisticsChief
        captures:
          qoh: $.data.quantity_on_hand
          obs: $.data.observed_daily_burn_rate
      assert:
      - ${qoh} == 20 (10 − 3 + 1, reset to 25 by ADJUST, then − 5)
      - ${obs} == 1.0 (round_half_up((3 + 5 − 1)/7, 4) = round_half_up(7/7, 4) — ADJUST
        never enters the burn window)
  - name: cascading_side_effects_coverage
    claim_type: cascade_chain
    grounds:
    - state_machines.AlternateCareSite.ACTIVATED_to_DEMOBILIZED
    excluded_because:
      difficulty_instance: acs_demobilize_capacity_tier_burn_chain
      rationale: The N-level cascade (site → capacity → tier → burn) is asserted hop-by-hop
        in the named §1.8 instance; incident-level fan-out is covered by incident_demobilize_transitions_callbacks_and_sites
        in §1.9 state_machines.
- section: consistency_model
  instances:
  - name: immediate_read_after_write_reflects_mutation
    claim_type: immediate_consistency
    grounds:
    - complexity_profile.consistency_model
    distinguishing_aspect: 'Immediate consistency: a PATCH is visible on the very
      next read, including the version bump — no lag, no stale cache.'
    test_recipe:
      setup:
      - Staff member created (version 1, is_active true)
      setup_api_calls:
      - call: POST /emergency/staff-members
        payload:
          full_name: M Fourteen
          badge_number: B-514b
          department: PHARMACY
          role_qualifications: []
        as: HospitalAdministrator
        captures:
          s1: $.data.id
      trigger:
      - call: PATCH /emergency/staff-members/${s1}
        payload:
          is_active: false
        as: HospitalAdministrator
        captures:
          act: $.data.is_active
          ver: $.data.version
      - call: GET /emergency/staff-members/${s1}
        as: HospitalAdministrator
        captures:
          act2: $.data.is_active
      assert:
      - ${act} == false and ${ver} == 2 in the PATCH response itself
      - ${act2} == false on the immediate follow-up read
