  # ===========================================================================
  - rule_id: non_linear_state_machine
    rule_name: "Non-linear state machine — states are revisited or forked rather than traversed once in a line"
    instances:

      - name: fee_negotiation_offer_counter_cycle_with_revision_ceiling
        differentiation: |
          A true CYCLE: the round returns to a state it has already occupied (OFFERED -> COUNTERED ->
          OFFERED) an unbounded number of times except for the explicit revision_count ceiling, and
          the counter fields are cleared on every return so the state is not merely re-labelled. The
          sibling instance below is a FORK-JOIN with no repetition: three mutually exclusive
          successors of one state, two of which reconverge with different side-effect sets.
        mechanism: "state_machines FeeNegotiation transitions OFFERED->COUNTERED->OFFERED, guarded by MAX_REVISIONS_PER_ROUND = 2 (validation priority 74, ERR_NEGOTIATION_ROUND_LIMIT)"
        entities_involved: [Engagement, Artist, FeeNegotiation]
        test_recipe:
          setup: |
            One PRESENTED engagement in DRAFT with an artist whose guarantee_floor_cents is 1000000.
            One negotiation round is opened at 1200000/0.10 and then driven twice around the cycle:
            counter 1800000/0.15 -> revise to 1400000/0.12 (revision_count 1) -> counter
            1750000/0.14 -> revise to 1500000/0.13 (revision_count 2) -> counter 1700000/0.14.
            The round is now COUNTERED with revision_count == 2 == MAX_REVISIONS_PER_ROUND, so the
            third revision must be refused while leaving the round exactly where it is.
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload:
                name: "Grand Hall"
                seat_capacity: 1200
                base_facility_fee_cents: 500000
                load_in_day_fee_cents: 200000
                changeover_buffer_minutes: 120
                rigging_capacity_kg: 5000
                house_power_amps: 400
                dmx_universes: 4
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload:
                legal_name: "Halcyon Quartet"
                agency_name: "Northline Artists"
                guarantee_floor_cents: 1000000
                historical_sell_through_pct: 0.70
                routing_window_start_utc: "2026-09-01T00:00:00Z"
                routing_window_end_utc: "2026-12-31T00:00:00Z"
                min_days_between_engagements: 0
              captures: { artist_id: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload:
                engagement_type: "PRESENTED"
                space_id: "${space_id}"
                artist_id: "${artist_id}"
                title: "Halcyon Quartet"
                load_in_start_utc: "2026-10-01T08:00:00Z"
