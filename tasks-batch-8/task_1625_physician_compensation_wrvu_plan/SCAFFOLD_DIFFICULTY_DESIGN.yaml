  - rule_id: cross_entity_state_dependency
    instances:
      - name: agreement_activation_requires_plan_active
        grounds:
          - state_machines.PhysicianAgreement.FMV_APPROVED_to_EFFECTIVE
          - state_machines.CompPlan.FMV_APPROVED_to_ACTIVE
          - validations[priority=8]
        distinguishing_aspect: |
          Entity pair PhysicianAgreement -> CompPlan: the agreement's FMV_APPROVED -> EFFECTIVE
          transition is gated on the plan's state. Both directions shown: blocked while the plan
          is FMV_APPROVED, permitted once the plan is ACTIVE.
        test_recipe:
          setup:
            - "Plan FMV_APPROVED (never activated); physician PH with agreement AGR in FMV_APPROVED (base salary within cap)"
          setup_api_calls:
            - { call: "POST /comp/_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /comp/physicians", payload: { npi: "1000000080", full_name: "Dr Gate", specialty: "IM", provider_type: PHYSICIAN, fte: 1.0, hire_date: "2018-01-01" }, as: SystemAdmin, captures: { phys: $.data.id } }
            - { call: "POST /comp/comp-plans", payload: { name: "Gate Plan", fiscal_year_start: "2026-01-01", fiscal_year_end: "2026-12-31", credit_attribution_mode: SERVICE_DATE, quality_model: ALL_OR_NOTHING, quality_pool_cents: 100000, fmv_cap_cents: 90000000, tiers: [ { tier_code: T1, threshold_wrvu: 0, conversion_factor_cents: 4500, tier_bonus_cents: 0 } ] }, as: CompAnalyst, as_user_id: an_1, captures: { plan: $.data.id } }
            - { call: "POST /comp/comp-plans/${plan}/cpt-rates", payload: { cpt_code: "99213", wrvu_value: 0.97, effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/submit-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/review-decision", payload: { decision: APPROVED }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/physician-agreements", payload: { physician_id: "${phys}", plan_id: "${plan}", base_salary_cents: 24000000, period_draw_cents: 1000000, effective_date: "2026-01-01" }, as: CompAnalyst, as_user_id: an_1, captures: { agr: $.data.id } }
            - { call: "POST /comp/physician-agreements/${agr}/submit-fmv", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/physician-agreements/${agr}/fmv-review", payload: { decision: APPROVED, benchmark_percentile: 55 }, as: ComplianceOfficer, as_user_id: co_1 }
          trigger:
            - { call: "POST /comp/physician-agreements/${agr}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1, captures: { err: $.data.error_id } }
            - { call: "POST /comp/comp-plans/${plan}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements/${agr}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1, captures: { agr_st: $.data.status } }
          assert:
            - "First activation attempt: 409 ERR_PLAN_NOT_ACTIVE (agreement valid in itself; the PLAN's state gates it)"
            - "After plan activation: second attempt succeeds, PhysicianAgreement.${agr}.status == \"EFFECTIVE\""

      - name: statement_finalize_blocked_by_open_dispute
        grounds:
          - state_machines.CompStatement.UNDER_REVIEW_to_FINALIZED
          - state_machines.Dispute.FILED_to_UNDER_REVIEW
          - validations[priority=22]
        distinguishing_aspect: |
          Entity pair CompStatement -> Dispute (different pair than agreement->plan): finalize is
          gated on the absence of non-terminal disputes on the same agreement; after the dispute
          is resolved REJECTED (terminal), the same finalize succeeds.
        test_recipe:
          setup:
            - "ACTIVE plan; physician PH EFFECTIVE; capture CAP validated (9.70 wRVU, 2026-02); statement ST for 2026-02 in UNDER_REVIEW"
            - "Dispute DSP filed by PH on CAP (status FILED)"
