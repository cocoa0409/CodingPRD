- section: rbac
  instances:
  - name: every_role_is_refused_every_other_roles_exclusive_operation
    claim_type: role_denial
    grounds:
    - roles.EdPhysician exclusive_operations
    - roles.Neurologist exclusive_operations
    - roles.TransferCoordinator exclusive_operations
    - roles.QualityAbstractor exclusive_operations
    - roles.ProgramCoordinator exclusive_operations
    - roles.CertificationReviewer exclusive_operations
    - validations.priority 5 -> ERR_FORBIDDEN_ROLE (403)
    distinguishing_aspect: 'Six roles, six exclusive sets, and the endpoints most likely to be left open are the ones whose names sound administrative: /certification-reports/{id}/submit belongs to the ProgramCoordinator and /decide to the CertificationReviewer, so the two roles that both work on reports must each be refused the other''s half. The sweep also pins that the role check at priority 5 fires BEFORE the state check at 30 — the reviewer''s submit attempt on a DRAFT report would be a legal transition for the right role.'
