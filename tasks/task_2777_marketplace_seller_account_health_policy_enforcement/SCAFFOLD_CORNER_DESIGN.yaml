            - "Seller.${s_id}.enforcement_state == ACTIVE and Seller.${s_id}.severity_points_balance == 0.00"

      - name: state_vacated_action_is_locked_against_acknowledge_and_re_appeal
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.EnforcementAction.terminal_states (VACATED)"
          - "state_machines.Appeal.terminal_states (GRANTED)"
          - "errors[ERR_ACTION_NOT_APPEALABLE_STATE]"
          - "errors[ERR_APPEAL_ALREADY_EXISTS]"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: |
          Once an appeal is GRANTED the pair of rows is frozen from three different directions,
          each with its OWN error code: acknowledging the VACATED action returns
          ERR_ACTION_NOT_APPEALABLE_STATE (409, priority 85), filing a second appeal against it
          returns ERR_APPEAL_ALREADY_EXISTS (409, priority 120 — the at-most-one-appeal rule
          fires before any state reasoning), and escalating the GRANTED appeal returns
          ERR_INVALID_STATE because escalation is reachable only from DENIED.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-LOCK-1 (LISTING_ACCURACY, base 2.00, ACCOUNT, requires_poa false)."
            - "One seller, one SUBSTANTIATED violation, one issued WARNING action (severity 2.00), one appeal taken through start-review to GRANTED."
            - "repeat_offense_count for the appealed action is 0 (no other action in that category), so the grant is not blocked by APPEAL_REPEAT_DENIAL_THRESHOLD 2."
            - "The grant vacates the action: balance recomputes to 0.00, enforcement_state returns to ACTIVE, disbursement_state to NORMAL."
