      - name: grind_cap_applies_both_multipliers_under_curtailment
        claim_type: constants_applied
        grounds:
          - calculations.daily_grind_cap
          - calculations.plant_compliance_posture
          - validations[priority=40]
        distinguishing_aspect: |
          The two postures multiply rather than override: a MAJOR exceedance
          curtails the plant (0.60) while a 150000 bushel contract book under a
          200000 floor is SHORT (0.75), so the cap floors to 54000 — not 72000
          from the compliance leg alone and not 90000 from the procurement leg
          alone. A 60000 bushel charge is then refused with
          ERR_GRIND_CAP_EXCEEDED at priority 40, ahead of the empty corn
          inventory at priority 58.
        test_recipe:
          setup:
            - "Plant exists with the default base cap 120000 and floor 200000; one OPEN contract covers 150000.00 bushels; permit condition NOX-1 is MAJOR with limit 12.500 over 24 hours and one 13.000 reading."
          setup_api_calls:
