      - name: cyclic_state_machine_shape_already_covered
        claim_type: cyclic
        grounds: ["state_machines.CollateralAsset (UNDER_REVIEW <-> ELIGIBLE <-> SUSPENDED)", "state_machines.CollateralVerificationReview (FIELD_WORK -> FINDINGS_ISSUED -> REMEDIATION -> FIELD_WORK)"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / collateral_asset_cycles_eligible_suspended_under_review_eligible
          rationale: "The cycle-return claim (same state re-entered with different derived data, and the retest cycle bounded by MAX_RETESTS) is exactly what that §1.8 instance and its sibling review_field_work_remediation_cycle_third_retest_rejected assert, including the re-entry pricing difference."

      - name: parallel_state_dimensions_already_covered
        claim_type: parallel
        grounds: ["state_machines.Advance.credit_status", "state_machines.Advance.collateral_status"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / advance_credit_dimension_holds_while_collateral_dimension_moves_to_shortfall
          rationale: "The independence of the two Advance dimensions — credit_status frozen at FUNDED while collateral_status walks SECURED -> SHORTFALL -> SECURED — is the whole subject of that §1.8 instance."

