  - rule_id: boundary_precision_check
    instances:
      - name: work_order_at_exact_plan_budget_equality_is_accepted
        grounds:
          - validations[priority=110]
          - calculations.farming_plan_total_budget
          - calculations.farming_plan_committed_cost
          - calculations.farming_plan_budget_posture
          - errors[ERR_PLAN_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          The fiscal ceiling is inclusive at both edges at once: an order whose
          estimated_labor_cost is exactly 1028.00 against total_budget 1028.00 is ACCEPTED and
          drives remaining_budget to 0.00 with budget_posture AT_RISK (utilization exactly 1.00 is
          <= EXHAUSTED_FLOOR), while the very next order at 64.25 is refused — the boundary is
          tested at value, and at value + smallest observable increment.
        test_recipe:
          setup:
            - "Vineyard Ridgecrest Ranch with block B-14 (6.0 x 10.0 ft on 4.0 acres), planted 2020."
            - "FarmingPlan P2 for B-14 APPROVED with per-acre budgets 100.00 / 60.00 / 37.00 / 60.00 -> total_budget 1028.00, committed_cost 0.00."
            - "HOURLY crew CR3 (crew_size 1, base_hourly_rate 100.00, piece_rate_per_vine 0) ACTIVE with PRUNING and SUCKERING capability."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
