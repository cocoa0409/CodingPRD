  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: guide_overlap_halfopen_adjacency_allowed
        grounds:
          - validations[priority=8]
          - errors[ERR_GUIDE_DOUBLE_BOOKED]
          - state_machines.GuideAssignment.ASSIGNED_to_CANCELLED
          - entities.TimeSlot.fields.end_at
        distinguishing_aspect: |
          Guide overlap uses half-open [start,end): assigning to an adjacent slot (start == prior end,
          11:30==11:30) is ALLOWED, while a truly overlapping slot (11:00 inside [10:00,11:30)) is
          rejected ERR_GUIDE_DOUBLE_BOOKED — Guide resource, adjacency-permitting semantics.
        test_recipe:
          setup:
            - "Course (duration 90), slot A 2026-06-06T10:00 (end 11:30), guide g1 ASSIGNED to A"
            - "Slot B 2026-06-06T11:30 (adjacent), slot C 2026-06-06T11:00 (overlaps A)"
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Zip A", difficulty_level: 2, min_weight_kg: 30, max_weight_kg: 120, min_age_years: 8, base_price_cents: 5000, duration_minutes: 90, default_capacity: 4, max_participants_per_guide: 4, weekend_surcharge_pct: 0.15 }
              as: Operator
              captures: { course_id: $.data.id }
            - call: "POST /time-slots"
              payload: { course_id: "${course_id}", start_at: "2026-06-06T10:00:00Z" }
              as: Operator
              captures: { ts_a: $.data.id }
            - call: "POST /time-slots"
              payload: { course_id: "${course_id}", start_at: "2026-06-06T11:30:00Z" }
              as: Operator
              captures: { ts_b: $.data.id }
            - call: "POST /time-slots"
              payload: { course_id: "${course_id}", start_at: "2026-06-06T11:00:00Z" }
              as: Operator
              captures: { ts_c: $.data.id }
            - call: "POST /guides"
              payload: { name: "G1", certification_level: 3 }
              as: Operator
              captures: { g1_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { guide_id: "${g1_id}", time_slot_id: "${ts_a}" }
              as: Operator
          trigger:
            - call: "POST /guide-assignments"
              payload: { guide_id: "${g1_id}", time_slot_id: "${ts_b}" }
              as: Operator
              captures: { ga_b_id: $.data.id, ga_b_status: $.data.status }
            - call: "POST /guide-assignments"
              payload: { guide_id: "${g1_id}", time_slot_id: "${ts_c}" }
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "ga_b_status == ASSIGNED"
            - "GuideAssignment.${ga_b_id}.status == ASSIGNED"
            - "response.data.error_id == ERR_GUIDE_DOUBLE_BOOKED"

      - name: gear_overlap_buffered_backtoback_rejected
        grounds:
          - validations[priority=8]
          - errors[ERR_GEAR_UNAVAILABLE]
          - entities.GearCheckout.fields.window_end
          - state_machines.GearCheckout.OUT_to_RETURNED
        distinguishing_aspect: |
          Gear overlap uses a buffered window [start, end+30): a checkout for a back-to-back slot
          (11:30, inside prior [10:00,12:00)) is REJECTED ERR_GEAR_UNAVAILABLE, whereas a slot at 12:00
          (== end+buffer) is ALLOWED — GearItem resource, buffer-inclusive semantics (contrast guide adjacency).
        test_recipe:
          setup:
            - "Course (duration 90), three slots on 2026-06-06 at 10:00, 11:30, 12:00; guide assigned to each"
            - "Participants p_a,p_b,p_c booked into slots A,B,C; harness gi checked out to booking b_a (window [10:00,12:00))"
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Zip A", difficulty_level: 2, min_weight_kg: 30, max_weight_kg: 120, min_age_years: 8, base_price_cents: 5000, duration_minutes: 90, default_capacity: 4, max_participants_per_guide: 4, weekend_surcharge_pct: 0.15 }
              as: Operator
              captures: { course_id: $.data.id }
            - call: "POST /time-slots"
              payload: { course_id: "${course_id}", start_at: "2026-06-06T10:00:00Z" }
              as: Operator
              captures: { ts_a: $.data.id }
            - call: "POST /time-slots"
              payload: { course_id: "${course_id}", start_at: "2026-06-06T11:30:00Z" }
              as: Operator
              captures: { ts_b: $.data.id }
            - call: "POST /time-slots"
              payload: { course_id: "${course_id}", start_at: "2026-06-06T12:00:00Z" }
              as: Operator
              captures: { ts_c: $.data.id }
            - call: "POST /guides"
              payload: { name: "G1", certification_level: 3 }
              as: Operator
              captures: { g1_id: $.data.id }
            - call: "POST /guides"
              payload: { name: "G2", certification_level: 3 }
              as: Operator
              captures: { g2_id: $.data.id }
            - call: "POST /guides"
              payload: { name: "G3", certification_level: 3 }
              as: Operator
              captures: { g3_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { guide_id: "${g1_id}", time_slot_id: "${ts_a}" }
              as: Operator
            - call: "POST /guide-assignments"
              payload: { guide_id: "${g2_id}", time_slot_id: "${ts_b}" }
              as: Operator
            - call: "POST /guide-assignments"
