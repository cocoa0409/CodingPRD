            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667, endowment_market_value_cents: 900000000 }
