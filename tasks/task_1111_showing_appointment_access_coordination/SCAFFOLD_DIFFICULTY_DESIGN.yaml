# =============================================================================
# Task 1111: Showing Appointment & Access Coordination
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — 9 rules x 2 instances
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: access_window_vacant_vs_occupied
        grounds:
          - calculations.calc_access_window
          - entities.AccessCredential.fields.active_from
          - entities.AccessCredential.fields.expires_at
          - entities.AccessCredential.fields.instructions_text
        distinguishing_aspect: |
          Same showing window (2026-05-02T10:00-10:30Z) yields different credential
          windows per occupancy variant on the AccessCredential domain: VACANT gives
          [09:00, 11:30) with vacant instructions; OCCUPIED gives [09:45, 11:00)
          (expiry riding buffer_minutes=30) with occupied instructions.
        test_recipe:
          setup:
            - "clock at 2026-05-01T00:00:00Z; verified buyer agent BA; listing agent LA"
            - "seller SV (auto_approve true) with VACANT listing LV (buffer 30)"
            - "seller SM (auto_approve false) with OCCUPIED listing LM (buffer 30)"
            - "request RV on LV 2026-05-02T10:00-10:30Z auto-approved + confirmed"
            - "request RM on LM same window, manually approved by SM + confirmed"
          setup_api_calls:
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/agents", payload: { full_name: "LA One", license_number: "LIC-LA-1", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "BA One", license_number: "LIC-BA-1", brokerage_name: "B2" }, as: Anonymous, captures: { ba_id: $.data.id } }
            - { call: "POST /showing-desk/agents/${ba_id}/verification-cases", payload: { license_document_ref: "doc-ba-1" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { case_id: $.data.id } }
            - { call: "POST /showing-desk/verification-cases/${case_id}/review", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "SV", contact_email: "sv@x.com", auto_approve: true }, as: PlatformAdmin, captures: { sv_id: $.data.id } }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "SM", contact_email: "sm@x.com" }, as: PlatformAdmin, captures: { sm_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${sv_id}", address: "1 Vacant St", occupancy_type: "VACANT" }, as: ListingAgent, as_user_id: "${la_id}", captures: { lv_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${sm_id}", address: "2 Occupied Ave", occupancy_type: "OCCUPIED" }, as: ListingAgent, as_user_id: "${la_id}", captures: { lm_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${lv_id}", start_at: "2026-05-02T10:00:00Z", end_at: "2026-05-02T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { rv_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests/${rv_id}/confirm", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${lm_id}", start_at: "2026-05-02T10:00:00Z", end_at: "2026-05-02T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { rm_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests/${rm_id}/approve", payload: {}, as: Seller, as_user_id: "${sm_id}" }
            - { call: "POST /showing-desk/showing-requests/${rm_id}/confirm", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
          trigger:
            - { call: "POST /showing-desk/showing-requests/${rv_id}/access-credentials", payload: { credential_type: "LOCKBOX_CODE" }, as: ListingAgent, as_user_id: "${la_id}", captures: { cred_v_from: $.data.active_from, cred_v_exp: $.data.expires_at, cred_v_txt: $.data.instructions_text } }
            - { call: "POST /showing-desk/showing-requests/${rm_id}/access-credentials", payload: { credential_type: "DOOR_CODE" }, as: ListingAgent, as_user_id: "${la_id}", captures: { cred_m_from: $.data.active_from, cred_m_exp: $.data.expires_at, cred_m_txt: $.data.instructions_text } }
          assert:
            - "VACANT credential: active_from == '2026-05-02T09:00:00Z'"
            - "VACANT credential: expires_at == '2026-05-02T11:30:00Z'"
            - "VACANT credential: instructions_text == 'Vacant property: self-access with lockbox/code anytime inside the access window.'"
            - "OCCUPIED credential: active_from == '2026-05-02T09:45:00Z'"
            - "OCCUPIED credential: expires_at == '2026-05-02T11:00:00Z'"
            - "OCCUPIED credential: instructions_text == 'Occupied property: occupant-approved access; arrive no earlier than 15 minutes before start.'"
      - name: report_provisional_vs_final
        grounds:
          - calculations.calc_seller_report_metrics
        distinguishing_aspect: |
          Identical listing data (1 COMPLETED + 1 CONFIRMED showing) produces
          completion_rate == 1.00 under the FINAL variant but
          provisional_completion_rate == 0.50 under the PROVISIONAL variant
          (CONFIRMED counted as will-complete) — different entity domain (Listing
          report) from the AccessCredential instance above.
        test_recipe:
          setup:
            - "clock 2026-05-01T00:00:00Z; verified buyer BA; listing agent LA; VACANT auto-approve listing L"
            - "R1 10:00-10:30 confirmed, credential issued and redeemed at 10:05; swept at 10:45 -> COMPLETED"
            - "R2 12:00-12:30 confirmed (confirm_by 11:00, end 12:30 both > 10:45, stays CONFIRMED)"
          setup_api_calls:
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/agents", payload: { full_name: "LA Two", license_number: "LIC-LA-2", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "BA Two", license_number: "LIC-BA-2", brokerage_name: "B2" }, as: Anonymous, captures: { ba_id: $.data.id } }
            - { call: "POST /showing-desk/agents/${ba_id}/verification-cases", payload: { license_document_ref: "doc-ba-2" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { case_id: $.data.id } }
            - { call: "POST /showing-desk/verification-cases/${case_id}/review", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "SR", contact_email: "sr@x.com", auto_approve: true }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "3 Report Rd", occupancy_type: "VACANT" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests/${r1_id}/confirm", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "POST /showing-desk/showing-requests/${r1_id}/access-credentials", payload: { credential_type: "LOCKBOX_CODE" }, as: ListingAgent, as_user_id: "${la_id}", captures: { c1_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-01T12:00:00Z", end_at: "2026-05-01T12:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r2_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests/${r2_id}/confirm", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:05:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/access-credentials/${c1_id}/redeem", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:45:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/_ops/run_expiration_sweep", payload: {}, as: PlatformAdmin, captures: { sweep_done: $.data.requests_completed_count } }
          trigger:
            - { call: "GET /showing-desk/listings/${l_id}/activity-report", payload: { mode: "FINAL" }, as: ListingAgent, as_user_id: "${la_id}", captures: { rep_final_rate: $.data.completion_rate, rep_final_completed: $.data.completed_count } }
            - { call: "GET /showing-desk/listings/${l_id}/activity-report", payload: { mode: "PROVISIONAL" }, as: ListingAgent, as_user_id: "${la_id}", captures: { rep_prov_rate: $.data.provisional_completion_rate, rep_prov_confirmed: $.data.confirmed_count } }
          assert:
            - "FINAL report: completed_count == 1 and completion_rate == 1.00"
            - "PROVISIONAL report: confirmed_count == 1 and provisional_completion_rate == 0.50"
            - "GET /showing-desk/showing-requests/${r1_id}.status == COMPLETED and ${r2_id}.status == CONFIRMED"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: approval_deadline_nested_minmax
        grounds:
          - calculations.calc_approval_deadline
          - entities.ShowingRequest.fields.approval_deadline
        distinguishing_aspect: |
          Mode (a): 5-input non-linear formula with nested min/max plus an
          occupancy/auto-approve branch — at clock 2026-05-01T00:00:00Z with
          timeout 240 / min_notice 120: start 06:00 clamps to 04:00 (both bounds
          meet), start 03:00 clamps to 01:00 (min-notice bound wins over the
          30-minute floor), and a VACANT+auto_approve request collapses to
          created_at 00:00 while entering APPROVED directly.
        test_recipe:
          setup:
            - "clock 2026-05-01T00:00:00Z; verified buyer BA; listing agent LA"
            - "seller S1 (timeout default 240, auto_approve false), OCCUPIED listing L1 (min_notice default 120)"
            - "seller S2 (auto_approve true), VACANT listing L2"
          setup_api_calls:
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/agents", payload: { full_name: "LA Three", license_number: "LIC-LA-3", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "BA Three", license_number: "LIC-BA-3", brokerage_name: "B2" }, as: Anonymous, captures: { ba_id: $.data.id } }
            - { call: "POST /showing-desk/agents/${ba_id}/verification-cases", payload: { license_document_ref: "doc-ba-3" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { case_id: $.data.id } }
            - { call: "POST /showing-desk/verification-cases/${case_id}/review", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "S1", contact_email: "s1@x.com" }, as: PlatformAdmin, captures: { s1_id: $.data.id } }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "S2", contact_email: "s2@x.com", auto_approve: true }, as: PlatformAdmin, captures: { s2_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s1_id}", address: "10 Clamp Ct", occupancy_type: "OCCUPIED" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l1_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s2_id}", address: "11 Auto Ln", occupancy_type: "VACANT" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l2_id: $.data.id } }
          trigger:
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l1_id}", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T06:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { ra_dl: $.data.approval_deadline, ra_st: $.data.status } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l1_id}", start_at: "2026-05-01T03:00:00Z", end_at: "2026-05-01T03:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { rb_dl: $.data.approval_deadline } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l2_id}", start_at: "2026-05-02T10:00:00Z", end_at: "2026-05-02T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { rc_dl: $.data.approval_deadline, rc_st: $.data.status } }
          assert:
            - "request A approval_deadline == '2026-05-01T04:00:00Z' and status == PENDING_APPROVAL"
            - "request B approval_deadline == '2026-05-01T01:00:00Z'"
            - "request C approval_deadline == '2026-05-01T00:00:00Z' and status == APPROVED"
      - name: feedback_rollup_per_feedback_rounding_order
        grounds:
          - calculations.calc_feedback_score_rollup
          - entities.FeedbackRequest.fields.overall_score
          - entities.Listing.fields.avg_feedback_score
        distinguishing_aspect: |
          Mode (b): nested rounding with pinned order (per-feedback round to 1dp
          first, then average). Raw scores {4.25, 4.25, 4.20} from weights
          (0.30,0.25,0.20,0.15,0.10): pinned order yields per-feedback 4.3/4.3/4.2
          and listing average 4.3; the forbidden aggregate-first order yields 4.2.
        test_recipe:
          setup:
            - "clock 2026-05-01T00:00:00Z; verified buyer BA; LA; VACANT auto-approve listing L (buffer 30)"
            - "three showings 10:00/12:00/14:00 (30 min each), all confirmed at t0, credentials issued, redeemed at 10:05/12:05/14:05, swept at 14:45 -> all COMPLETED, feedback requests SENT"
          setup_api_calls:
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/agents", payload: { full_name: "LA Four", license_number: "LIC-LA-4", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "BA Four", license_number: "LIC-BA-4", brokerage_name: "B2" }, as: Anonymous, captures: { ba_id: $.data.id } }
            - { call: "POST /showing-desk/agents/${ba_id}/verification-cases", payload: { license_document_ref: "doc-ba-4" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { case_id: $.data.id } }
            - { call: "POST /showing-desk/verification-cases/${case_id}/review", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "SF", contact_email: "sf@x.com", auto_approve: true }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "20 Round Way", occupancy_type: "VACANT" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests/${r1_id}/confirm", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "POST /showing-desk/showing-requests/${r1_id}/access-credentials", payload: { credential_type: "LOCKBOX_CODE" }, as: ListingAgent, as_user_id: "${la_id}", captures: { c1_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-01T12:00:00Z", end_at: "2026-05-01T12:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r2_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests/${r2_id}/confirm", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "POST /showing-desk/showing-requests/${r2_id}/access-credentials", payload: { credential_type: "DOOR_CODE" }, as: ListingAgent, as_user_id: "${la_id}", captures: { c2_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-01T14:00:00Z", end_at: "2026-05-01T14:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r3_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests/${r3_id}/confirm", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "POST /showing-desk/showing-requests/${r3_id}/access-credentials", payload: { credential_type: "SMART_LOCK" }, as: ListingAgent, as_user_id: "${la_id}", captures: { c3_id: $.data.id } }
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:05:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/access-credentials/${c1_id}/redeem", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T12:05:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/access-credentials/${c2_id}/redeem", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T14:05:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/access-credentials/${c3_id}/redeem", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T14:45:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/_ops/run_expiration_sweep", payload: {}, as: PlatformAdmin }
            - { call: "GET /showing-desk/showing-requests/${r1_id}/feedback-request", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}", captures: { f1_id: "$.data[0].id" } }
            - { call: "GET /showing-desk/showing-requests/${r2_id}/feedback-request", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}", captures: { f2_id: "$.data[0].id" } }
            - { call: "GET /showing-desk/showing-requests/${r3_id}/feedback-request", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}", captures: { f3_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /showing-desk/feedback-requests/${f1_id}/submit", payload: { q1: 4, q2: 5, q3: 4, q4: 4, q5: 4 }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { f1_score: $.data.overall_score } }
            - { call: "POST /showing-desk/feedback-requests/${f2_id}/submit", payload: { q1: 4, q2: 5, q3: 4, q4: 4, q5: 4 }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { f2_score: $.data.overall_score } }
            - { call: "POST /showing-desk/feedback-requests/${f3_id}/submit", payload: { q1: 4, q2: 4, q3: 4, q4: 4, q5: 4 }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { f3_score: $.data.overall_score } }
            - { call: "GET /showing-desk/listings/${l_id}", payload: {}, as: ListingAgent, as_user_id: "${la_id}", captures: { l_avg: $.data.avg_feedback_score } }
          assert:
            - "feedback 1 overall_score == 4.3 (raw 4.25, per-feedback round first)"
            - "feedback 2 overall_score == 4.3"
            - "feedback 3 overall_score == 4.2 (raw 4.20)"
            - "Listing.avg_feedback_score == 4.3 (mean of rounded 4.3/4.3/4.2 = 4.2667 -> 4.3; aggregate-first 4.2333 -> 4.2 is forbidden)"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: showing_request_decline_reschedule_cycle
        grounds:
          - state_machines.ShowingRequest.DECLINED_to_PENDING_APPROVAL
          - entities.ShowingRequest.fields.reschedule_count
        distinguishing_aspect: |
          ShowingRequest is cyclic: DECLINED -> reschedule -> PENDING_APPROVAL ->
          approve -> APPROVED. Reschedule recomputes approval_deadline (formula
          re-run at reschedule time t0: max(min(00:00+240m, 14:00-120m), 00:00+30m)
          = 2026-05-01T04:00:00Z) and bumps reschedule_count to 1.
        test_recipe:
          setup:
            - "clock 2026-05-01T00:00:00Z; verified buyer BA; LA; seller SM (manual); OCCUPIED listing L (min_notice 120)"
            - "request R 2026-05-01T10:00-10:30Z created -> PENDING_APPROVAL, declined by seller"
          setup_api_calls:
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/agents", payload: { full_name: "LA Five", license_number: "LIC-LA-5", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "BA Five", license_number: "LIC-BA-5", brokerage_name: "B2" }, as: Anonymous, captures: { ba_id: $.data.id } }
            - { call: "POST /showing-desk/agents/${ba_id}/verification-cases", payload: { license_document_ref: "doc-ba-5" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { case_id: $.data.id } }
            - { call: "POST /showing-desk/verification-cases/${case_id}/review", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "SM5", contact_email: "sm5@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "30 Cycle Ct", occupancy_type: "OCCUPIED" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests/${r_id}/decline", payload: { reason: "occupied then" }, as: Seller, as_user_id: "${s_id}" }
          trigger:
            - { call: "POST /showing-desk/showing-requests/${r_id}/reschedule", payload: { start_at: "2026-05-01T14:00:00Z", end_at: "2026-05-01T14:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r_st: $.data.status, r_dl: $.data.approval_deadline, r_rc: $.data.reschedule_count } }
            - { call: "POST /showing-desk/showing-requests/${r_id}/approve", payload: {}, as: Seller, as_user_id: "${s_id}", captures: { r_st2: $.data.status } }
          assert:
            - "after reschedule: status == PENDING_APPROVAL, reschedule_count == 1, approval_deadline == '2026-05-01T04:00:00Z'"
            - "after approve: status == APPROVED (cycle DECLINED -> PENDING_APPROVAL -> APPROVED completed)"
      - name: verification_case_reject_resubmit_cycle
        grounds:
          - state_machines.VerificationCase.REJECTED_to_SUBMITTED
          - entities.Agent.fields.verification_status
        distinguishing_aspect: |
          VerificationCase is cyclic on a different entity than ShowingRequest:
          SUBMITTED -> REJECTED -> (resubmit) SUBMITTED -> APPROVED, with
          resubmission_count == 1 and Agent.verification_status flipping
          UNVERIFIED -> VERIFIED only at the second review.
        test_recipe:
          setup:
            - "clock default; agent A registered; case submitted then REJECTED"
          setup_api_calls:
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/agents", payload: { full_name: "BA Six", license_number: "LIC-BA-6", brokerage_name: "B2" }, as: Anonymous, captures: { ba_id: $.data.id } }
            - { call: "POST /showing-desk/agents/${ba_id}/verification-cases", payload: { license_document_ref: "doc-v1" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { case_id: $.data.id } }
            - { call: "POST /showing-desk/verification-cases/${case_id}/review", payload: { decision: "REJECT", review_notes: "blurry scan" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /showing-desk/verification-cases/${case_id}/resubmit", payload: { license_document_ref: "doc-v2" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { c_st: $.data.status, c_rc: $.data.resubmission_count } }
            - { call: "POST /showing-desk/verification-cases/${case_id}/review", payload: { decision: "APPROVE" }, as: PlatformAdmin, captures: { c_st2: $.data.status } }
            - { call: "GET /showing-desk/agents/${ba_id}", payload: {}, as: PlatformAdmin, captures: { a_vs: $.data.verification_status } }
          assert:
            - "after resubmit: case status == SUBMITTED and resubmission_count == 1"
            - "after second review: case status == APPROVED"
            - "Agent.verification_status == VERIFIED"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: withdraw_cascade_depth3
        grounds:
          - state_machines.Listing.ACTIVE_to_WITHDRAWN
          - state_machines.ShowingRequest.CONFIRMED_to_CANCELLED
          - state_machines.AccessCredential.ISSUED_to_REVOKED
          - state_machines.FeedbackRequest.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Trigger = listing withdraw; chain depth 3+: Listing WITHDRAWN ->
          ShowingRequests CANCELLED (cancel_actor=SYSTEM) -> their ISSUED
          credentials REVOKED -> their SCHEDULED feedback requests CANCELLED;
          confirmed_showing_count returns to 0. Each hop is caused by the
          previous hop, not by the withdraw directly.
        test_recipe:
          setup:
            - "clock 2026-05-01T00:00:00Z; verified buyer BA; LA; seller SM (manual); OCCUPIED listing L"
            - "R1 10:00-10:30 PENDING -> approved -> confirmed -> credential ISSUED (feedback SCHEDULED created at confirm)"
            - "R2 12:00-12:30 left PENDING_APPROVAL"
          setup_api_calls:
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/agents", payload: { full_name: "LA Seven", license_number: "LIC-LA-7", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "BA Seven", license_number: "LIC-BA-7", brokerage_name: "B2" }, as: Anonymous, captures: { ba_id: $.data.id } }
            - { call: "POST /showing-desk/agents/${ba_id}/verification-cases", payload: { license_document_ref: "doc-ba-7" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { case_id: $.data.id } }
            - { call: "POST /showing-desk/verification-cases/${case_id}/review", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "SM7", contact_email: "sm7@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "40 Cascade Blvd", occupancy_type: "OCCUPIED" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests/${r1_id}/approve", payload: {}, as: Seller, as_user_id: "${s_id}" }
            - { call: "POST /showing-desk/showing-requests/${r1_id}/confirm", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "POST /showing-desk/showing-requests/${r1_id}/access-credentials", payload: { credential_type: "LOCKBOX_CODE" }, as: ListingAgent, as_user_id: "${la_id}", captures: { c1_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-01T12:00:00Z", end_at: "2026-05-01T12:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r2_id: $.data.id } }
          trigger:
            - { call: "POST /showing-desk/listings/${l_id}/withdraw", payload: {}, as: ListingAgent, as_user_id: "${la_id}" }
            - { call: "GET /showing-desk/showing-requests/${r1_id}", payload: {}, as: ListingAgent, as_user_id: "${la_id}", captures: { r1_st: $.data.status, r1_ca: $.data.cancel_actor } }
            - { call: "GET /showing-desk/showing-requests/${r2_id}", payload: {}, as: ListingAgent, as_user_id: "${la_id}", captures: { r2_st: $.data.status } }
            - { call: "GET /showing-desk/showing-requests/${r1_id}/access-credentials", payload: {}, as: ListingAgent, as_user_id: "${la_id}", captures: { c1_st: "$.data[0].status" } }
            - { call: "GET /showing-desk/showing-requests/${r1_id}/feedback-request", payload: {}, as: ListingAgent, as_user_id: "${la_id}", captures: { f1_st: "$.data[0].status" } }
            - { call: "GET /showing-desk/listings/${l_id}", payload: {}, as: ListingAgent, as_user_id: "${la_id}", captures: { l_st: $.data.status, l_cc: $.data.confirmed_showing_count } }
          assert:
            - "R1 status == CANCELLED with cancel_actor == SYSTEM"
            - "R1 credential status == REVOKED (hop 2)"
            - "R1 feedback request status == CANCELLED (hop 3)"
            - "R2 status == CANCELLED"
            - "Listing status == WITHDRAWN and confirmed_showing_count == 0"
      - name: no_show_suspension_cascade_depth4
        grounds:
          - state_machines.ShowingRequest.CONFIRMED_to_NO_SHOW
          - state_machines.Agent_standing.RESTRICTED_to_SUSPENDED
          - state_machines.AccessCredential.ISSUED_to_REVOKED
        distinguishing_aspect: |
          Different trigger (declare-no-show) and depth-4 chain: NO_SHOW ->
          StrikeRecord(25) on the agent -> standing recompute crosses 30 with the
          earlier LATE_CANCEL(10) -> transition INTO SUSPENDED cancels the agent's
          future CONFIRMED request on a third listing -> that request's ISSUED
          credential is REVOKED.
        test_recipe:
          setup:
            - "clock 2026-05-01T00:00:00Z; verified buyer BA; LA; seller SA (auto_approve); VACANT listings L1, L2, L3"
            - "R1 on L1 10:00-10:30 confirmed then cancelled at t0 (10h to start < 24h) -> LATE_CANCEL strike (10 points)"
            - "R2 on L2 12:00-12:30 confirmed; no credential issued"
            - "R3 on L3 2026-05-03T10:00-10:30 confirmed with credential ISSUED"
          setup_api_calls:
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/agents", payload: { full_name: "LA Eight", license_number: "LIC-LA-8", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "BA Eight", license_number: "LIC-BA-8", brokerage_name: "B2" }, as: Anonymous, captures: { ba_id: $.data.id } }
            - { call: "POST /showing-desk/agents/${ba_id}/verification-cases", payload: { license_document_ref: "doc-ba-8" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { case_id: $.data.id } }
            - { call: "POST /showing-desk/verification-cases/${case_id}/review", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "SA8", contact_email: "sa8@x.com", auto_approve: true }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "51 A St", occupancy_type: "VACANT" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l1_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "52 B St", occupancy_type: "VACANT" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l2_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "53 C St", occupancy_type: "VACANT" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l3_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l1_id}", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests/${r1_id}/confirm", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "POST /showing-desk/showing-requests/${r1_id}/cancel", payload: { reason: "buyer cold feet" }, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l2_id}", start_at: "2026-05-01T12:00:00Z", end_at: "2026-05-01T12:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r2_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests/${r2_id}/confirm", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l3_id}", start_at: "2026-05-03T10:00:00Z", end_at: "2026-05-03T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r3_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests/${r3_id}/confirm", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "POST /showing-desk/showing-requests/${r3_id}/access-credentials", payload: { credential_type: "DOOR_CODE" }, as: ListingAgent, as_user_id: "${la_id}", captures: { c3_id: $.data.id } }
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T12:45:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /showing-desk/showing-requests/${r2_id}/declare-no-show", payload: {}, as: ListingAgent, as_user_id: "${la_id}", captures: { r2_st: $.data.status } }
            - { call: "GET /showing-desk/agents/${ba_id}", payload: {}, as: PlatformAdmin, captures: { ba_standing: $.data.standing, ba_pts: $.data.active_strike_points } }
            - { call: "GET /showing-desk/showing-requests/${r3_id}", payload: {}, as: ListingAgent, as_user_id: "${la_id}", captures: { r3_st: $.data.status, r3_ca: $.data.cancel_actor } }
            - { call: "GET /showing-desk/showing-requests/${r3_id}/access-credentials", payload: {}, as: ListingAgent, as_user_id: "${la_id}", captures: { c3_st: "$.data[0].status" } }
            - { call: "GET /showing-desk/listings/${l3_id}", payload: {}, as: ListingAgent, as_user_id: "${la_id}", captures: { l3_cc: $.data.confirmed_showing_count } }
          assert:
            - "R2 status == NO_SHOW"
            - "Agent standing == SUSPENDED and active_strike_points == 35 (10 LATE_CANCEL + 25 NO_SHOW)"
            - "R3 status == CANCELLED with cancel_actor == SYSTEM (hop 3)"
            - "R3 credential status == REVOKED (hop 4)"
            - "L3 confirmed_showing_count == 0"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_temporal_overlap
        grounds:
          - "validations[priority=7]"
          - "validations[priority=11]"
        distinguishing_aspect: |
          Pair (state, business_temporal): a request that violates BOTH
          listing-not-active (priority 7) and buffered-overlap (priority 11) MUST
          return ERR_LISTING_NOT_ACTIVE, not ERR_SHOWING_OVERLAP_CONFLICT.
        test_recipe:
          setup:
            - "clock 2026-05-01T00:00:00Z; verified buyer BA; LA; VACANT auto-approve listing L (buffer 30)"
            - "R1 2026-05-01T10:00-10:30 confirmed (occupies buffered zone [09:30, 11:00))"
            - "L paused afterwards"
          setup_api_calls:
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/agents", payload: { full_name: "LA Nine", license_number: "LIC-LA-9", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "BA Nine", license_number: "LIC-BA-9", brokerage_name: "B2" }, as: Anonymous, captures: { ba_id: $.data.id } }
            - { call: "POST /showing-desk/agents/${ba_id}/verification-cases", payload: { license_document_ref: "doc-ba-9" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { case_id: $.data.id } }
            - { call: "POST /showing-desk/verification-cases/${case_id}/review", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "SP9", contact_email: "sp9@x.com", auto_approve: true }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "60 Conflict Ct", occupancy_type: "VACANT" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests/${r1_id}/confirm", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "POST /showing-desk/listings/${l_id}/pause", payload: {}, as: ListingAgent, as_user_id: "${la_id}" }
          trigger:
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-01T10:15:00Z", end_at: "2026-05-01T10:45:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LISTING_NOT_ACTIVE (state priority 7 beats temporal overlap priority 11)"
            - "GET /showing-desk/listings?listing_id filter: no new request persisted (list for L still has exactly 1 request)"
      - name: safety_beats_daily_capacity
        grounds:
          - "validations[priority=8]"
          - "validations[priority=14]"
        distinguishing_aspect: |
          Different category pair (business_safety, business_constraint): an
          UNVERIFIED buyer agent creating a same-day request on a listing whose
          daily cap (max_showings_per_day=1) is already full MUST get
          ERR_AGENT_NOT_VERIFIED (priority 8), not ERR_DAILY_SHOWING_LIMIT
          (priority 14).
        test_recipe:
          setup:
            - "clock 2026-05-01T00:00:00Z; verified buyer BA1; UNVERIFIED buyer BA2; LA; VACANT auto-approve listing L with max_showings_per_day=1"
            - "BA1's request 10:00-10:30 occupies the single daily slot (APPROVED counts)"
          setup_api_calls:
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/agents", payload: { full_name: "LA Ten", license_number: "LIC-LA-10", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "BA Ten", license_number: "LIC-BA-10", brokerage_name: "B2" }, as: Anonymous, captures: { ba1_id: $.data.id } }
            - { call: "POST /showing-desk/agents/${ba1_id}/verification-cases", payload: { license_document_ref: "doc-ba-10" }, as: BuyerAgent, as_user_id: "${ba1_id}", captures: { case_id: $.data.id } }
            - { call: "POST /showing-desk/verification-cases/${case_id}/review", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/agents", payload: { full_name: "BA TenU", license_number: "LIC-BA-10U", brokerage_name: "B3" }, as: Anonymous, captures: { ba2_id: $.data.id } }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "SC10", contact_email: "sc10@x.com", auto_approve: true }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "61 Cap Ct", occupancy_type: "VACANT", max_showings_per_day: 1 }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba1_id}", captures: { r1_id: $.data.id } }
          trigger:
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-01T12:00:00Z", end_at: "2026-05-01T12:30:00Z" }, as: BuyerAgent, as_user_id: "${ba2_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_AGENT_NOT_VERIFIED (safety priority 8 beats capacity priority 14, even though the cap is also full)"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: daily_cap_at_exact_max
        grounds:
          - calculations.calc_daily_showing_count
          - "validations[priority=14]"
        distinguishing_aspect: |
          Metric = daily request count; endpoint = POST /showing-desk/showing-requests.
          With max_showings_per_day=2 the 2nd same-day request succeeds (count 1 < 2)
          and the 3rd is rejected (count 2 == 2): the boundary is inclusive-up-to-max.
        test_recipe:
          setup:
            - "clock 2026-05-01T00:00:00Z; verified buyer BA; LA; VACANT auto-approve listing L with max_showings_per_day=2 (buffer 30)"
          setup_api_calls:
