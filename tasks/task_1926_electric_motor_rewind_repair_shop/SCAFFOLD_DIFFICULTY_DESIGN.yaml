              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CLAIMS_OPEN while WarrantyClaim.${claim_id}.status == FILED"
            - "After the claim is denied, POST .../close succeeds and WorkOrder.status == CLOSED"

  # ==========================================================================
  # Rule 8 — resource_temporal_overlap: two overlap rules with DIFFERENT
  # interval semantics on DIFFERENT resource entities.
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: pool_slot_capacity_is_count_not_interval
        grounds:
          - validations[priority=11]
          - entities.PoolLoan.fields.status
        distinguishing_aspect: |
          Aggregate-capacity semantics on SparePoolContract: the Nth concurrent
          OUT loan is allowed while count < slot_count and the (slot_count)th
          concurrent loan is rejected — adjacency in time is irrelevant; only
          the cardinality of non-returned loans matters (zero-count edge: a
          contract with slot_count=1 rejects the second open loan even
          when the first loan's interval has not ended).
        test_recipe:
          setup:
            - "Contract with slot_count=1; spare P1 already OUT on loan L1; spare P2 IN_POOL; second work order W2 diagnosed"
          setup_api_calls:
            - call: "POST /shops"
              payload: { shop_name: "S", easa_accreditation_id: "EASA-12345", labor_rate_small_cents: 8500, labor_rate_medium_cents: 9500, labor_rate_large_cents: 11200, labor_rate_xlarge_cents: 13800, rush_premium_pct: 0.35, replace_threshold_pct: 0.65, supplies_low_pct: 0.08, supplies_high_pct: 0.06, warranty_months: 12, pool_slot_monthly_cents: 4500, pool_loan_daily_cents: 1800, pool_loan_grace_days: 3 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
