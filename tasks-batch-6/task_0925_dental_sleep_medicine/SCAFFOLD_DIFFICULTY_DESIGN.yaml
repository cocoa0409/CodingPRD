      - name: records_freeze_beats_referral_state_gate
        grounds:
          - validations[priority=5]
          - validations[priority=12]
          - errors[ERR_RECORDS_FROZEN]
          - errors[ERR_INVALID_STATE]
          - entities.Patient.fields.records_frozen
        distinguishing_aspect: |
          Category pair business_safety (rung 5, ERR_RECORDS_FROZEN) versus state (rung 12,
          ERR_INVALID_STATE): the referral is already ACCEPTED, so a second respond is an invalid
          transition, and the patient is also under an OPEN payer audit. The global write
          gate wins and the state error is never reported.
        test_recipe:
          setup:
            - "An ACCEPTED referral for a patient who is also under an OPEN AuditHold."
            - "Both rung 5 and rung 12 would reject the same request."
