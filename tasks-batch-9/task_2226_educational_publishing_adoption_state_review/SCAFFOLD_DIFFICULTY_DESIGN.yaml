              as_user_id: "${st_ga_id}"
          assert:
            - "PresentationSlot.${slot_id}.status == TALLIED"
            - "PresentationSlot.${slot_id}.tally_outcome == RECOMMEND"
            - "Submission.${sub_id}.review_status == ADOPTED"
            - "Title.${ttl_id}.adopted_state_codes == [\"GA\"]"
            - "PricingProposal.${prop_id}.contract_locked == true"
            - "AdoptionCycle.${cyc_id}.adopted_count == 1"
            - "AdoptionCycle.${cyc_id}.submission_count == 0"

      - name: phase_advance_escalation_four_hop_cascade
        grounds:
          - state_machines.AdoptionCycle.OPEN_to_CLOSED_FOR_SUBMISSION
          - state_machines.PublicComment.OPEN_to_ESCALATED
          - calculations.comment_response_obligation
          - calculations.compliance_score
          - state_machines.PresentationSlot.RESERVED_to_CANCELLED
        distinguishing_aspect: |
          Depth-4 chain from a third trigger, POST /adoption-cycles/{id}/phase-advance: sweep S1
          escalates three overdue CRITICAL comments; BECAUSE they escalated S2 drops compliance_score
          to 40 and sets adoption_blocked true; BECAUSE the submission is blocked S3 cancels its
          RESERVED slot and releases 30 panel minutes; BECAUSE the slot left the live set the
          submission falls SCHEDULED -> FILED - none of these hops is a direct effect of the advance.
        test_recipe:
          setup:
            - "State CO is OPEN_TERRITORY with comment_response_days 10, sampling_copies_required 0 and min_verified_coverage_pct 50.00"
            - "Cycle 2027 is OPEN; the submission was FILED at clock 2026-09-15 and holds a RESERVED 30-minute slot on panel CO-A, so review_status is SCHEDULED and reserved_minutes is 30"
            - "Three CRITICAL public comments were filed at 2026-09-15 and are due 2026-09-25, all still OPEN"
            - "The clock stands at 2026-10-01, at the submission deadline and past every response_due_at"
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CO", adoption_model: "OPEN_TERRITORY", sampling_copies_required: 0, comment_response_days: 10, min_verified_coverage_pct: 50.00 }
              as: PlatformAdmin
              captures: { st_co_id: $.data.id }
            - call: "POST /state-profiles/${st_co_id}/standards"
              payload: { subject: "ELA", standard_code: "CO.E.4.1", grade_low: 4, grade_high: 4, weight: 2 }
              as: StateAdoptionOfficer
              as_user_id: "${st_co_id}"
            - call: "POST /adoption-cycles"
              payload: { state_id: "${st_co_id}", subject: "ELA", cycle_year: 2027, submission_open_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-10-01T00:00:00Z", committee_review_at: "2026-10-15T00:00:00Z", public_comment_start_at: "2026-11-01T00:00:00Z", public_comment_end_at: "2026-11-15T00:00:00Z", adoption_decision_at: "2026-12-01T00:00:00Z", contract_term_years: 6 }
              as: StateAdoptionOfficer
              as_user_id: "${st_co_id}"
              captures: { cyc_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn_base: "9780000001401", subject: "ELA", grade_low: 4, grade_high: 4, copyright_year: 2026, content_tags: ["CLOSE_READING"], page_count: 300, signature_page_capacity: 384, list_price_cents: 8700 }
              as: PublisherEditor
              captures: { ttl_id: $.data.id }
            - call: "POST /titles/${ttl_id}/release"
              payload: {}
              as: PublisherEditor
            - call: "POST /submissions"
              payload: { cycle_id: "${cyc_id}", title_id: "${ttl_id}" }
              as: PublisherEditor
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/correlations"
              payload: { standard_code: "CO.E.4.1", depth_level: "MASTERY", page_reference: "pp. 22-52", evidence_citation: "Unit 2 anchor texts assess the standard to mastery." }
              as: PublisherEditor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /adoption-cycles/${cyc_id}/phase-advance"
              payload: {}
              as: StateAdoptionOfficer
              as_user_id: "${st_co_id}"
            - call: "POST /submissions/${sub_id}/file"
              payload: {}
              as: PublisherEditor
            - call: "POST /committee-panels"
              payload: { cycle_id: "${cyc_id}", panel_label: "CO ELA Panel A", session_start_at: "2026-10-20T14:00:00Z", session_end_at: "2026-10-20T18:00:00Z", buffer_minutes: 10, member_count: 3, quorum_required: 2 }
              as: StateAdoptionOfficer
              as_user_id: "${st_co_id}"
              captures: { pnl_id: $.data.id, pnl_v0: $.data.version }
            - call: "POST /committee-panels/${pnl_id}/slots"
              payload: { submission_id: "${sub_id}", start_at: "2026-10-20T14:00:00Z", end_at: "2026-10-20T14:30:00Z", expected_panel_version: "${pnl_v0}" }
              as: StateAdoptionOfficer
              as_user_id: "${st_co_id}"
              captures: { slot_id: $.data.id }
            - call: "POST /submissions/${sub_id}/public-comments"
              payload: { commenter_ref: "co-parent-01", category: "ERROR_OF_FACT", severity: "CRITICAL", body: "Timeline on page 40 contradicts the state framework." }
              as: PublicCommenter
              as_user_id: "pc-1"
              captures: { cm1_id: $.data.id }
            - call: "POST /submissions/${sub_id}/public-comments"
              payload: { commenter_ref: "co-parent-02", category: "BIAS_CONCERN", severity: "CRITICAL", body: "Unit 3 excerpt presents a one-sided narrative." }
              as: PublicCommenter
              as_user_id: "pc-2"
              captures: { cm2_id: $.data.id }
            - call: "POST /submissions/${sub_id}/public-comments"
              payload: { commenter_ref: "co-parent-03", category: "OTHER", severity: "CRITICAL", body: "Assessment rubric omits the required writing strand." }
              as: PublicCommenter
              as_user_id: "pc-3"
