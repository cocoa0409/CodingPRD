            - "LINK 6: OnlineService.${svc_id}.open_audit_count == 1"
            - "LINK 6: OnlineService.${svc_id}.compliance_posture == RESTRICTED (FROZEN before the trigger; clause 3 open_audit_count >= 1 now decides, NOT clause 6 OPEN)"
            - "OnlineService.${svc_id}.audit_decision_count == 1 (the system-forced re-audit is not an audit decision)"
            - "OnlineService.${svc_id}.posture_override == null throughout"

      - name: determination_escalation_forces_integration_reaudit_and_locks_override
        grounds:
          - state_machines.OnlineService.determination_status_IN_{GENERAL_AUDIENCE,MIXED_AUDIENCE,CHILD_DIRECTED_PRIMARY}_to_determination_status_=_CHILD_DIRECTED_PRIMARY
          - state_machines.ThirdPartyIntegration.DECLARED|APPROVED_to_AUDIT_PENDING
          - calculations.design_factor_weighted_score
          - calculations.third_party_exposure_points
          - calculations.compliance_posture
          - validations[priority=116]
          - entities.ThirdPartyIntegration.fields.audit_note
        distinguishing_aspect: |
          Escalating determination_status to CHILD_DIRECTED_PRIMARY (design_score 0.60 -> 0.76
          crossing DESIGN_PRIMARY_THRESHOLD 0.75) cascades three links across two other entity
          types in one request — the APPROVED CHILD_DIRECTED_AREA integration is demoted to
          AUDIT_PENDING, exposure drops 5 -> 0 while open_audit_count rises 0 -> 1, and the posture
          flips OPEN -> RESTRICTED — and the cascade's tail then blocks an unrelated later call:
          posture_override=OPEN is refused with ERR_OPEN_AUDITS_PRESENT. Appending the evidence row
          alone does NOT cascade (determination_status is untouched by POST /determination-evidence).
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; service determined MIXED_AUDIENCE from SUBJECT_MATTER/MODERATE (design_score 0.60)."
            - "Notice published with all 7 content keys and disclosed_integration_vendors ['PlaySafe Contextual']."
            - "Integration 'PlaySafe Contextual' (CONTEXTUAL_AD_NETWORK, no persistent identifier, CHILD_DIRECTED_AREA) moved DECLARED -> AUDIT_PENDING -> APPROVED, so exposure is 5 and the posture is OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Junior Jams", operator_organization: "Jams Audio Co", service_category: "VIDEO_PLATFORM", subject_matter_code: "FAMILY_MIXED" }
