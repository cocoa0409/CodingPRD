              as: GovernanceAdmin
              captures: { own_id: $.data.id }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Sam Steward", email: "sam@mdm.test", certification_level: "SENIOR" }
              as: GovernanceAdmin
              captures: { std_id: $.data.id }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${own_id}", steward_role: "DATA_OWNER", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v1}" }
              as: GovernanceAdmin
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_v2: $.data.version }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${std_id}", steward_role: "DATA_STEWARD", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v2}" }
              as: GovernanceAdmin
            - call: "POST /mdm/source-systems"
              payload: { code: "ERP", name: "ERP Core", trust_tier: 4 }
              as: GovernanceAdmin
              captures: { erp_id: $.data.id }
            - call: "POST /mdm/source-systems/${erp_id}/certify"
              payload: {}
              as: GovernanceAdmin
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_v3: $.data.version }
            - call: "POST /mdm/source-registrations"
              payload: { domain_id: "${dom_id}", source_system_id: "${erp_id}", role: "AUTHORITATIVE", trust_rank: 1, effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v3}" }
              as: GovernanceAdmin
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${std_id}", rule_code: "QR1", dimension: "COMPLETENESS", weight_points: 40, threshold_pct: 90.00, severity: "HIGH" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { qr1_id: $.data.id }
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${std_id}", rule_code: "QR2", dimension: "TIMELINESS", weight_points: 60, threshold_pct: 80.00, severity: "LOW" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { qr2_id: $.data.id }
            - call: "PATCH /mdm/quality-rules/${qr2_id}"
              payload: { status: "RETIRED" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { qr2_status: $.data.status }
          trigger:
            - call: "POST /mdm/domains/${dom_id}/scorecard-runs"
              payload: { basis: "CERTIFIED", measurements: [{ rule_code: "QR1", measured_pct: 45.00 }, { rule_code: "QR2", measured_pct: 90.00 }] }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { err_code: $.data.error_id }
            - call: "POST /mdm/domains/${dom_id}/scorecard-runs"
              payload: { basis: "CERTIFIED", measurements: [{ rule_code: "QR1", measured_pct: 45.00 }] }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { run_score: $.data.weighted_score, run_eval: $.data.rules_evaluated_count, run_failed: $.data.rules_failed_count, run_seq: $.data.run_seq }
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_certified: $.data.quality_score_certified, dom_seq: $.data.scorecard_run_seq }
          assert:
            - "setup: ${qr2_status} == RETIRED (ACTIVE rule with no open finding retires cleanly)"
            - "first trigger -> HTTP 422 and ${err_code} == ERR_UNKNOWN_RULE_CODE - a RETIRED rule_code is not measurable; ${dom_seq} proves the rejected run created nothing"
            - "second trigger -> HTTP 201, ${run_eval} == 1 and ${run_failed} == 1 (QR2 is out of the evaluated set entirely)"
            - "${run_score} == 50.00 (earned round(40 * 45.00 / 90.00, 2) == 20.00 over weight_total 40; had QR2 stayed ACTIVE the score would be 20.00 over 100)"
            - "${run_seq} == 1 and ${dom_seq} == 1 and ${dom_certified} == 50.00"

      - name: empty_evaluated_rule_set_scores_zero_and_opens_nothing
        claim_type: Constants Applied
        grounds:
          - calculations.domain_quality_scorecard.constants.EMPTY_RULE_SET_SCORE
          - calculations.domain_quality_scorecard.variants.PROVISIONAL
        distinguishing_aspect: "A PROVISIONAL run with no measurements has an empty evaluated set, so the declared EMPTY_RULE_SET_SCORE 0.00 must be stored rather than a division by a zero weight_total; the run still consumes a scorecard epoch and still opens no finding."
        test_recipe:
          setup:
