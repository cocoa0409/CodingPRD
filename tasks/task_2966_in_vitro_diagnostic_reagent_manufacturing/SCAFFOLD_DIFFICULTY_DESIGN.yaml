# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# In Vitro Diagnostic Reagent Manufacturing — task 2966
# Nine §0.5 rule_ids, 20 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1-§1.7; every chain starts from an empty database and uses
# only §1.5 endpoints; every numeric assert below was computed by executing the
# corresponding §1.3 formula.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: material_acceptance_all_pass_versus_weighted_score_divergence
        grounds:
          - calculations.material_lot_acceptance_decision
          - calculations.material_lot_acceptance_score
          - calculations.test_result_outcome
          - entities.MaterialSpecification.fields.acceptance_mode
          - entities.MaterialLot.fields.acceptance_score
          - state_machines.MaterialLot.UNDER_TEST_to_QUALIFIED
          - validations[priority=92]
        distinguishing_aspect: |
          Two MaterialLots carrying byte-identical measurement sets (POTENCY 89.5,
          PURITY 99.5, ENDOTOXIN 0.5, IDENTITY 1.0) reach opposite dispositions
          purely because their specifications differ in acceptance_mode: ALL_PASS
          rejects on the single out-of-bound POTENCY result while WEIGHTED_SCORE
          qualifies the same evidence at acceptance_score 91.60. The ALL_PASS lot
          never even materialises a score (the field stays null under that mode),
          so the two variants differ in output SHAPE as well as verdict.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "Two MaterialSpecifications for the same antibody with identical bounds (potency 90.0-110.0, purity_min 95.0, endotoxin_max 2.0) and the same four required test codes, differing only in acceptance_mode (ALL_PASS vs WEIGHTED_SCORE)."
            - "One MaterialLot per specification, each in UNDER_TEST with all four acceptance tests recorded at the same four measured values."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /material-specifications"
              payload: { material_code: "AB-CD19-AP", material_type: "ANTIBODY", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY", "PURITY", "ENDOTOXIN", "IDENTITY"], is_critical: false, acceptance_mode: "ALL_PASS", max_retests: 1, retest_window_days: 30 }
              as: RegulatoryAffairs
              captures: { ms_ap_id: $.data.id }
            - call: "POST /material-specifications"
              payload: { material_code: "AB-CD19-WS", material_type: "ANTIBODY", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY", "PURITY", "ENDOTOXIN", "IDENTITY"], is_critical: false, acceptance_mode: "WEIGHTED_SCORE", max_retests: 1, retest_window_days: 30 }
              as: RegulatoryAffairs
              captures: { ms_ws_id: $.data.id }
            - call: "POST /material-lots"
              payload: { material_specification_id: "${ms_ap_id}", vendor_lot_code: "V-1001", received_quantity_units: 1000.0, expiry_date: "2027-06-30T00:00:00Z" }
              as: ProductionOperator
              captures: { ml_ap_id: $.data.id }
            - call: "POST /material-lots"
              payload: { material_specification_id: "${ms_ws_id}", vendor_lot_code: "V-1001", received_quantity_units: 1000.0, expiry_date: "2027-06-30T00:00:00Z" }
              as: ProductionOperator
              captures: { ml_ws_id: $.data.id }
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_ap_id}", test_code: "POTENCY", measured_value: 89.5 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_ap_id}", test_code: "PURITY", measured_value: 99.5 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_ap_id}", test_code: "ENDOTOXIN", measured_value: 0.5 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_ap_id}", test_code: "IDENTITY", measured_value: 1.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_ws_id}", test_code: "POTENCY", measured_value: 89.5 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_ws_id}", test_code: "PURITY", measured_value: 99.5 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_ws_id}", test_code: "ENDOTOXIN", measured_value: 0.5 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_ws_id}", test_code: "IDENTITY", measured_value: 1.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
          trigger:
            - call: "POST /material-lots/${ml_ap_id}/disposition"
              payload: { decision: "QUALIFY" }
              as: QAReleaser
              as_user_id: "qa-01"
              captures: { err_all_pass: $.data.error_id }
            - call: "POST /material-lots/${ml_ws_id}/disposition"
              payload: { decision: "QUALIFY" }
              as: QAReleaser
              as_user_id: "qa-01"
              captures: { ws_status: $.data.qualification_status, ws_score: $.data.acceptance_score }
          assert:
            - "the ALL_PASS disposition returns HTTP 409 with data.error_id == ERR_ACCEPTANCE_CRITERIA_NOT_MET"
            - "MaterialLot.${ml_ap_id}.qualification_status == UNDER_TEST (unchanged by the rejected disposition)"
            - "MaterialLot.${ml_ap_id}.acceptance_score == null throughout, because the score is only materialised under acceptance_mode WEIGHTED_SCORE"
            - "the WEIGHTED_SCORE disposition returns HTTP 200 and MaterialLot.${ml_ws_id}.qualification_status == QUALIFIED"
            - "MaterialLot.${ml_ws_id}.acceptance_score == 91.60 == 100 * (0.45*0.90 + 0.30*0.995 + 0.15*0.75 + 0.10*1.0) / 1.00, where the POTENCY sub-score is 1 - (90.0 - 89.5) / 5.0 == 0.90; it clears ACCEPTANCE_SCORE_MIN 85.0 with no zero sub-score"
            - "MaterialLot.${ml_ws_id}.dispositioned_by_user_id == qa-01 and dispositioned_at == 2026-08-01T00:00:00.000Z"
            - "on BOTH lots the POTENCY TestResult.outcome == FAIL and the other three TestResult.outcome == PASS, so the divergence is produced by acceptance_mode alone and not by different measurements"
            - "MaterialLot.${ml_ap_id}.first_oos_at == 2026-08-01T00:00:00.000Z and MaterialLot.${ml_ws_id}.first_oos_at == 2026-08-01T00:00:00.000Z"

      - name: stability_shelf_life_real_time_versus_accelerated_divergence
        grounds:
          - calculations.stability_shelf_life
          - entities.StabilityStudy.fields.study_type
          - entities.StabilityStudy.fields.established_shelf_life_months
          - entities.StabilityStudy.fields.shelf_life_method
          - entities.StabilityStudy.fields.last_conforming_month
          - state_machines.StabilityStudy.IN_PROGRESS_to_COMPLETE
        distinguishing_aspect: |
          Two studies on the SAME ProductSpecification whose recovery curves both
          break the 90.00 floor one timepoint after their last conforming pull
          establish 9 months and 18 months respectively, because the REAL_TIME
          variant reads the last conforming month straight off the protocol while
          the ACCELERATED variant multiplies it by the Q10 factor 2**3.2 and
          floors; this instance lives in the stability domain, not the raw-material
          acceptance domain of the first instance.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "One ProductSpecification stored TWO_TO_EIGHT_C with shelf_life_months_claim 24, so the 24-month cap binds neither result."
            - "One ReagentLot of that product (still PLANNED) placed on stability."
            - "A REAL_TIME study at 5.0 C in chamber CH-RT with planned timepoints [0, 3, 6, 9, 12] and baseline_value 100.0, all five timepoints recorded at 100.0 / 98.0 / 95.0 / 92.0 / 88.0."
            - "An ACCELERATED study at 37.0 C in chamber CH-AC with planned timepoints [0, 1, 2, 3] and baseline_value 100.0, all four timepoints recorded at 100.0 / 97.0 / 94.0 / 89.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /product-specifications"
              payload: { product_code: "IVD-STB-1", reference_material_code: "REF-1", required_material_codes: ["AB-CD19"], release_test_codes: ["ACTIVITY"], max_reference_bias_pct: 5.0, shelf_life_months_claim: 24, storage_condition: "TWO_TO_EIGHT_C", min_shelf_life_days_at_ship: 90 }
              as: RegulatoryAffairs
              captures: { ps_id: $.data.id }
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "STB-LOT-1", planned_units: 500 }
              as: ProductionOperator
              captures: { rl_id: $.data.id }
            - call: "POST /stability-studies"
              payload: { product_specification_id: "${ps_id}", reagent_lot_id: "${rl_id}", study_type: "REAL_TIME", chamber_code: "CH-RT", storage_temp_c: 5.0, protocol_start: "2026-08-01T00:00:00Z", protocol_end: "2028-08-01T00:00:00Z", planned_timepoints_months: [0, 3, 6, 9, 12], baseline_value: 100.0 }
              as: RegulatoryAffairs
              captures: { st_rt_id: $.data.id }
            - call: "POST /stability-studies"
              payload: { product_specification_id: "${ps_id}", reagent_lot_id: "${rl_id}", study_type: "ACCELERATED", chamber_code: "CH-AC", storage_temp_c: 37.0, protocol_start: "2026-08-01T00:00:00Z", protocol_end: "2027-08-01T00:00:00Z", planned_timepoints_months: [0, 1, 2, 3], baseline_value: 100.0 }
              as: RegulatoryAffairs
              captures: { st_ac_id: $.data.id }
            - call: "POST /stability-studies/${st_rt_id}/approve-protocol"
              payload: {}
              as: QAReleaser
              as_user_id: "qa-01"
            - call: "POST /stability-studies/${st_ac_id}/approve-protocol"
              payload: {}
              as: QAReleaser
              as_user_id: "qa-01"
            - call: "POST /test-results"
              payload: { subject_type: "STABILITY_TIMEPOINT", stability_study_id: "${st_rt_id}", month_index: 0, test_code: "ACTIVITY", measured_value: 100.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /test-results"
              payload: { subject_type: "STABILITY_TIMEPOINT", stability_study_id: "${st_rt_id}", month_index: 3, test_code: "ACTIVITY", measured_value: 98.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /test-results"
              payload: { subject_type: "STABILITY_TIMEPOINT", stability_study_id: "${st_rt_id}", month_index: 6, test_code: "ACTIVITY", measured_value: 95.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /test-results"
              payload: { subject_type: "STABILITY_TIMEPOINT", stability_study_id: "${st_rt_id}", month_index: 9, test_code: "ACTIVITY", measured_value: 92.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /test-results"
              payload: { subject_type: "STABILITY_TIMEPOINT", stability_study_id: "${st_rt_id}", month_index: 12, test_code: "ACTIVITY", measured_value: 88.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /test-results"
              payload: { subject_type: "STABILITY_TIMEPOINT", stability_study_id: "${st_ac_id}", month_index: 0, test_code: "ACTIVITY", measured_value: 100.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /test-results"
              payload: { subject_type: "STABILITY_TIMEPOINT", stability_study_id: "${st_ac_id}", month_index: 1, test_code: "ACTIVITY", measured_value: 97.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /test-results"
              payload: { subject_type: "STABILITY_TIMEPOINT", stability_study_id: "${st_ac_id}", month_index: 2, test_code: "ACTIVITY", measured_value: 94.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /test-results"
              payload: { subject_type: "STABILITY_TIMEPOINT", stability_study_id: "${st_ac_id}", month_index: 3, test_code: "ACTIVITY", measured_value: 89.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
          trigger:
            - call: "POST /stability-studies/${st_rt_id}/conclude"
              payload: {}
              as: RegulatoryAffairs
              captures: { rt_months: $.data.established_shelf_life_months, rt_method: $.data.shelf_life_method }
            - call: "POST /stability-studies/${st_ac_id}/conclude"
              payload: {}
              as: RegulatoryAffairs
              captures: { ac_months: $.data.established_shelf_life_months, ac_method: $.data.shelf_life_method }
          assert:
            - "StabilityStudy.${st_rt_id}.last_conforming_month == 9 (recovery_pct 92.00 at month 9 clears the 90.00 floor, 88.00 at month 12 does not)"
            - "StabilityStudy.${st_rt_id}.established_shelf_life_months == 9"
            - "StabilityStudy.${st_rt_id}.shelf_life_method == REAL_TIME_LAST_CONFORMING"
            - "StabilityStudy.${st_ac_id}.last_conforming_month == 2"
            - "StabilityStudy.${st_ac_id}.established_shelf_life_months == 18 (2 * 2 ** ((37.0 - 5.0) / 10.0) == 18.37917367995256, floored)"
            - "StabilityStudy.${st_ac_id}.shelf_life_method == ACCELERATED_Q10"
            - "both studies end in status COMPLETE and both results are strictly below shelf_life_months_claim 24, so the 24-month cap did not produce the divergence"
            - "StabilityStudy.${st_rt_id}.timepoint_count == 5 and StabilityStudy.${st_ac_id}.timepoint_count == 4"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: acceptance_score_present_set_denominator_and_zero_subscore_veto
        grounds:
          - calculations.material_lot_acceptance_score
          - calculations.material_lot_acceptance_decision
          - entities.MaterialSpecification.fields.required_test_codes
          - entities.MaterialLot.fields.acceptance_score
          - state_machines.MaterialLot.UNDER_TEST_to_UNDER_TEST
          - validations[priority=92]
        distinguishing_aspect: |
          The score is NOT a fixed weighted sum: the denominator is the sum of the
          weights of the codes that actually have a result, so recording a fourth
          measurement can LOWER the score (96.00 -> 86.40) even though the new
          measurement adds a positive numerator term, and a single zero sub-score
          vetoes the QUALIFY even while the 85.00 threshold is still met. Five
          inputs interact: which codes are present, each measured value, the
          per-code weights, the threshold, and the zero-sub-score veto.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "One WEIGHTED_SCORE MaterialSpecification requiring all four codes (potency 90.0-110.0, purity_min 95.0, endotoxin_max 2.0)."
            - "One MaterialLot with only THREE of the four results recorded: POTENCY 100.0, PURITY 98.0, ENDOTOXIN 0.4 — no IDENTITY result at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /material-specifications"
              payload: { material_code: "EN-HRP-01", material_type: "ENZYME", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY", "PURITY", "ENDOTOXIN", "IDENTITY"], is_critical: false, acceptance_mode: "WEIGHTED_SCORE", max_retests: 1, retest_window_days: 30 }
              as: RegulatoryAffairs
              captures: { ms_id: $.data.id }
            - call: "POST /material-lots"
              payload: { material_specification_id: "${ms_id}", vendor_lot_code: "V-2001", received_quantity_units: 1000.0, expiry_date: "2027-06-30T00:00:00Z" }
              as: ProductionOperator
              captures: { ml_id: $.data.id }
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_id}", test_code: "POTENCY", measured_value: 100.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_id}", test_code: "PURITY", measured_value: 98.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_id}", test_code: "ENDOTOXIN", measured_value: 0.4 }
              as: QCAnalyst
              as_user_id: "qc-01"
          trigger:
            - call: "GET /material-lots/${ml_id}"
              payload: {}
              as: QAReleaser
              captures: { score_three_present: $.data.acceptance_score }
            - call: "POST /material-lots/${ml_id}/disposition"
              payload: { decision: "QUALIFY" }
              as: QAReleaser
              as_user_id: "qa-01"
              captures: { err_missing_code: $.data.error_id }
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_id}", test_code: "IDENTITY", measured_value: 0.5 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /material-lots/${ml_id}/disposition"
              payload: { decision: "QUALIFY" }
              as: QAReleaser
              as_user_id: "qa-01"
              captures: { err_zero_subscore: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_id}", test_code: "IDENTITY", measured_value: 1.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /material-lots/${ml_id}/disposition"
              payload: { decision: "QUALIFY" }
              as: QAReleaser
              as_user_id: "qa-01"
              captures: { final_status: $.data.qualification_status, final_score: $.data.acceptance_score }
          assert:
            - "with three of four codes present acceptance_score == 96.00, because the denominator is 0.45 + 0.30 + 0.15 == 0.90, not 1.00: 100 * (0.45*1.0 + 0.30*0.98 + 0.15*0.8) / 0.90 == 100 * 0.864 / 0.90 == 96.00"
            - "the first QUALIFY returns HTTP 409 ERR_ACCEPTANCE_CRITERIA_NOT_MET because IDENTITY has no result, even though 96.00 is far above ACCEPTANCE_SCORE_MIN 85.0"
            - "after IDENTITY 0.5 is recorded the score FALLS to 86.40 == 100 * (0.864 + 0.10*0.0) / 1.00, since the denominator grows to 1.00 while the IDENTITY sub-score is 0.0"
            - "the second QUALIFY still returns HTTP 409 ERR_ACCEPTANCE_CRITERIA_NOT_MET: 86.40 >= 85.0 holds, so only the any_zero_subscore veto can explain the rejection"
            - "MaterialLot.qualification_status is still UNDER_TEST after both rejected dispositions and MaterialLot.first_oos_at == 2026-08-01T00:00:00.000Z (the IDENTITY 0.5 record is the first FAIL)"
            - "after the superseding IDENTITY 1.0 record at 2026-08-02T00:00:00Z the score is 96.40 == 100 * (0.864 + 0.10*1.0) / 1.00, because only the LATEST record per test_code enters the sum"
            - "the third QUALIFY returns HTTP 200 with qualification_status QUALIFIED and acceptance_score 96.40"
            - "the superseded IDENTITY 0.5 TestResult row still exists with outcome FAIL and is not deleted"

      - name: release_bias_rounding_order_pinned_per_test_then_sum
        grounds:
          - calculations.lot_release_reference_bias
          - entities.TestResult.fields.bias_pct
          - entities.ReagentLot.fields.release_bias_sum_pct
          - entities.ReagentLot.fields.release_bias_max_pct
          - state_machines.ReagentLot.FILLED_to_UNDER_RELEASE_TEST
          - state_machines.ReagentLot.UNDER_RELEASE_TEST_to_UNDER_RELEASE_TEST
        distinguishing_aspect: |
          Three release measurements each 101.004 against a reference of 100.0 pin
          the rounding ORDER rather than the arithmetic: rounding each bias to
          1.00 before summing yields release_bias_sum_pct 3.00, while the natural
          implementation of summing 1.004 three times and rounding once yields
          3.01. The distinguishing quantity lives on a different entity and a
          different formula from the acceptance-score instance above.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "One qualified ANTIBODY MaterialLot of material_code AB-CD19 (single required test POTENCY, ALL_PASS, is_critical false)."
            - "One ProductSpecification IVD-BIAS-1 whose required_material_codes is [AB-CD19] and whose release_test_codes are [ACTIVITY, CALIBRATION_SLOPE, PRECISION], max_reference_bias_pct 5.0."
            - "One ReagentLot of that product taken all the way to disposition_status FILLED through one component, one fill run with a conforming BIOBURDEN_BULK sample, and completion of 500 units at 2026-08-10T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /material-specifications"
              payload: { material_code: "AB-CD19", material_type: "ANTIBODY", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY"], is_critical: false, acceptance_mode: "ALL_PASS", max_retests: 1, retest_window_days: 30 }
              as: RegulatoryAffairs
              captures: { ms_id: $.data.id }
            - call: "POST /material-lots"
              payload: { material_specification_id: "${ms_id}", vendor_lot_code: "V-3001", received_quantity_units: 1000.0, expiry_date: "2027-06-30T00:00:00Z" }
              as: ProductionOperator
              captures: { ml_id: $.data.id }
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_id}", test_code: "POTENCY", measured_value: 100.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /material-lots/${ml_id}/disposition"
              payload: { decision: "QUALIFY" }
              as: QAReleaser
              as_user_id: "qa-01"
            - call: "POST /product-specifications"
              payload: { product_code: "IVD-BIAS-1", reference_material_code: "REF-1", required_material_codes: ["AB-CD19"], release_test_codes: ["ACTIVITY", "CALIBRATION_SLOPE", "PRECISION"], max_reference_bias_pct: 5.0, shelf_life_months_claim: 12, storage_condition: "TWO_TO_EIGHT_C", min_shelf_life_days_at_ship: 90 }
              as: RegulatoryAffairs
              captures: { ps_id: $.data.id }
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "BIAS-LOT-1", planned_units: 500 }
              as: ProductionOperator
              captures: { rl_id: $.data.id, rl_v: $.data.version }
            - call: "POST /reagent-lots/${rl_id}/components"
