              as: Athlete
              as_user_id: "${v_cas}"
              captures: { a1_up: $.data.id }
            - call: "POST /v1/athletes/${v_cas}/activities"
              payload: { device_source: "garmin-edge", sport_type: "RUN", started_at: "2026-09-01T07:00:00Z", duration_s: 100, distance_m: 1000, track_points: [{lat: 40.00, lng: -125.00, t_offset_s: 0}, {lat: 40.01, lng: -125.00, t_offset_s: 100}], start_lat: 40.00, start_lng: -125.00, end_lat: 40.01, end_lng: -125.00, idempotency_key: "up-a2", effort_hints: [{segment_id: "${seg_up}", elapsed_time_s: 100, elevation_gain_m: 0}] }
              as: Athlete
              as_user_id: "${v_cas}"
              captures: { a2_up: $.data.id }
            - call: "POST /v1/athletes/${v_cas}/activities"
              payload: { device_source: "garmin-edge", sport_type: "RUN", started_at: "2026-09-01T08:00:00Z", duration_s: 100, distance_m: 1000, track_points: [{lat: 40.00, lng: -125.00, t_offset_s: 0}, {lat: 40.01, lng: -125.00, t_offset_s: 100}], start_lat: 40.00, start_lng: -125.00, end_lat: 40.01, end_lng: -125.00, idempotency_key: "up-a3", effort_hints: [{segment_id: "${seg_up}", elapsed_time_s: 100, elevation_gain_m: 0}] }
              as: Athlete
              as_user_id: "${v_cas}"
              captures: { a3_up: $.data.id }
            - call: "GET /v1/efforts?activity_id=${a1_up}"
              as: Athlete
              as_user_id: "${v_cas}"
              captures: { e1_up: "$.data[0].id" }
            - call: "GET /v1/efforts?activity_id=${a2_up}"
              as: Athlete
              as_user_id: "${v_cas}"
              captures: { e2_up: "$.data[0].id" }
            - call: "GET /v1/efforts?activity_id=${a3_up}"
              as: Athlete
              as_user_id: "${v_cas}"
              captures: { e3_up: "$.data[0].id" }
            - call: "POST /v1/efforts/${e1_up}/flags"
              payload: { reporter_id: "${q_cas}", reason: "IMPOSSIBLE_TIME" }
              as: Athlete
              as_user_id: "${q_cas}"
