              captures: { hca2_id: $.data.id }
            - call: "POST /host-community-agreements"
              payload: { landfill_id: "${lf_id}", community_name: "Ridgeview Township", posted_tipping_fee_per_ton: 45.00, host_fee_per_ton: 4.25, tier1_monthly_tons: 130, royalty_tier1_pct: 0.05, royalty_tier2_pct: 0.09, minimum_annual_payment: 270000, effective_from: "2028-01-01T00:00:00Z", expires_on: "2032-12-31T00:00:00Z" }
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { hca3_id: $.data.id }
            - call: "GET /landfills/${lf_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { lf_v1: $.data.version }
            - call: "POST /host-community-agreements/${hca1_id}/execute"
              payload: { expected_landfill_version: "${lf_v1}" }
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { hca1_state: $.data.status }
            - call: "GET /landfills/${lf_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { lf_v2: $.data.version }
          trigger:
            - call: "POST /host-community-agreements/${hca2_id}/execute"
              payload: { expected_landfill_version: "${lf_v2}" }
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { hca2_state: $.data.status }
            - call: "GET /host-community-agreements/${hca1_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { hca1_state2: $.data.status, hca1_term: $.data.termination_reason }
            - call: "POST /host-community-agreements/${hca2_id}/open-amendment"
              payload: { amendment_reason: "Annual fee reopener" }
