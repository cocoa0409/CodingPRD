          assert:
            - "the invoice carries issued_at == \"2026-08-01T00:00:00Z\" and net_due_cents == 5200000"
            - "the day-119 WRITE_OFF returns 422 with data.error_id == \"ERR_WRITE_OFF_TOO_EARLY\""
            - "GET /carriage/invoices/${inv_id} after that attempt returns status == \"ISSUED\" and paid_cents == 0"
            - "the day-120 WRITE_OFF returns 200 with data.status == \"WRITTEN_OFF\" and data.paid_cents == 0"
            - "GET /carriage/distributors/${dc_id} afterwards returns receivable_balance_cents == 0"
            - "a further RECORD_PAYMENT of 1 returns 422 with data.error_id == \"ERR_INVALID_INVOICE_STATE\""

      - name: clock_must_move_strictly_forward
        claim_type: temporal_validation
        grounds:
          - validations[priority=38]
          - errors[ERR_CLOCK_MUST_MOVE_FORWARD]
          - entities.LogicalClock.fields.set_count
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: >-
          The clock is forward-only and the comparison is strict: from the
          2026-08-01T00:00:00Z startup default, both an earlier instant and the
          IDENTICAL instant are rejected 422 ERR_CLOCK_MUST_MOVE_FORWARD with
          set_count still 0, and only 2026-08-01T00:00:01Z is accepted.
        test_recipe:
          setup:
            - "Empty database; the clock is untouched at its 2026-08-01T00:00:00Z startup default with set_count 0."
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload:
                to_iso8601: "2026-07-31T23:59:59Z"
              as: NetworkAdmin
              as_user_id: "u-admin-1"
            - call: "POST /_clock/set_current_utc"
              payload:
                to_iso8601: "2026-08-01T00:00:00Z"
              as: NetworkAdmin
              as_user_id: "u-admin-1"
            - call: "POST /_clock/set_current_utc"
              payload:
                to_iso8601: "2026-08-01T00:00:01Z"
              as: NetworkAdmin
              as_user_id: "u-admin-1"
          assert:
            - "GET /_clock before any trigger returns current_utc == \"2026-08-01T00:00:00Z\" and set_count == 0"
            - "the backward call returns 422 with data.error_id == \"ERR_CLOCK_MUST_MOVE_FORWARD\""
            - "the equal-instant call also returns 422 with data.error_id == \"ERR_CLOCK_MUST_MOVE_FORWARD\" — the rule is <=, not <"
            - "GET /_clock after those two rejections still returns current_utc == \"2026-08-01T00:00:00Z\" and set_count == 0"
            - "the one-second-forward call returns 200 with data.current_utc == \"2026-08-01T00:00:01Z\" and data.set_count == 1"

      # priority 5 (shape) is evaluated before priority 10 (path-parameter existence)
      - name: malformed_action_outranks_missing_path_resource
        claim_type: priority_ordering
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_INVOICE_NOT_FOUND]
        distinguishing_aspect: >-
          One call violates two rules at once — an undeclared action value and an
          invoiceId that names nothing — and the answer is 400 ERR_INVALID_REQUEST,
          not 404 ERR_INVOICE_NOT_FOUND, because priority 5 precedes priority 10;
          repairing only the action then surfaces the 404.
        test_recipe:
          setup:
            - "Empty database; no Invoice has ever been created."
          setup_api_calls: []
          trigger:
            - call: "POST /carriage/invoices/00000000-0000-4000-8000-0000000000d4/lifecycle"
              payload:
                action: "SHRED"
              as: RevenueAccountant
              as_user_id: "u-rev-1"
          assert:
            - "response status code == 400"
            - "response body data.error_id == \"ERR_INVALID_REQUEST\""
            - "response body data.error_id is NOT \"ERR_INVOICE_NOT_FOUND\""
            - "the same path with action=\"ISSUE\" returns 404 with data.error_id == \"ERR_INVOICE_NOT_FOUND\""

      - name: authorization_outranks_resource_existence
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=10]
          - errors[ERR_FORBIDDEN_ROLE]
          - errors[ERR_REPORT_NOT_FOUND]
        excluded_because:
          difficulty_instance: forbidden_role_precedes_report_not_found
          rationale: >-
            The §1.8 priority_pair_validation_conflict instance already drives a
            RightsAdministrator at a non-existent report id and pins
            ERR_FORBIDDEN_ROLE ahead of ERR_REPORT_NOT_FOUND, then shows the 404
            emerging once the role is legal — identical to this corner's claim.

      - name: blackout_rule_priority_conflict_between_separation_and_cap
        claim_type: priority_conflict
        grounds:
          - validations[priority=50]
          - validations[priority=51]
          - errors[ERR_BLACKOUT_SEPARATION_VIOLATION]
          - errors[ERR_BLACKOUT_MONTHLY_CAP_EXCEEDED]
        excluded_because:
          difficulty_instance: blackout_separation_precedes_monthly_cap
          rationale: >-
            The §1.8 priority_pair_validation_conflict instance already constructs a
            proposed blackout that violates BOTH the 24-hour separation and the
            72-hour monthly cap and pins the separation error as the winner, plus the
            cap error once the separation is repaired.

  # ===========================================================================
  # SECTION 5 — endpoints
  # ===========================================================================
  - section: endpoints
    instances:

      - name: distributor_patch_is_a_partial_update
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /carriage/distributors/{distributorId}]
          - entities.Distributor.fields.credit_limit_cents
          - entities.Distributor.fields.total_subscribers
        distinguishing_aspect: >-
          PATCH with only credit_limit_cents leaves total_subscribers and legal_name
          untouched while bumping version from 1 to 2, and a PATCH body carrying the
          undeclared field legal_name is rejected 400 ERR_INVALID_REQUEST rather than
          partially applied.
        test_recipe:
          setup:
            - "One Distributor with 1,500,000 homes and the default 100,000,000 credit limit."
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Meridian Broadband"
                distributor_type: "CABLE_MSO"
                rate_card_class: "CLASS_A"
                total_subscribers: 1500000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                dm_id: "id"
          trigger:
            - call: "PATCH /carriage/distributors/${dm_id}"
              payload:
                credit_limit_cents: 250000000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
          assert:
            - "response status code == 200"
            - "response body data.credit_limit_cents == 250000000 and data.total_subscribers == 1500000"
            - "response body data.legal_name == \"Meridian Broadband\", data.status == \"ACTIVE\" and data.credit_hold_reason == \"NONE\""
            - "response body data.version == 2"
            - "a PATCH with body { legal_name: \"Renamed\" } returns 400 with data.error_id == \"ERR_INVALID_REQUEST\" and leaves version at 2"
            - "a PATCH on 00000000-0000-4000-8000-0000000000e5 returns 404 with data.error_id == \"ERR_DISTRIBUTOR_NOT_FOUND\""

      - name: agreement_terms_are_patchable_only_before_execution
        claim_type: conditional_action
        grounds:
          - validations[priority=30]
          - endpoints[PATCH /carriage/agreements/{agreementId}]
          - errors[ERR_INVALID_AGREEMENT_STATE]
          - calculations.agreement_effective_rate
        distinguishing_aspect: >-
          The same PATCH succeeds in DRAFT — re-stamping effective_rate_cents_per_sub
          to 44.0000 — and is refused 422 ERR_INVALID_AGREEMENT_STATE after EXECUTE,
          so executed commercial terms are frozen while draft terms are freely
          negotiable.
        test_recipe:
          setup:
            - "One Distributor with one DRAFT agreement at base 40.0000 cents."
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Meridian Broadband"
                distributor_type: "CABLE_MSO"
                rate_card_class: "CLASS_A"
                total_subscribers: 1500000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                dm_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${dm_id}"
                contract_code: "MB-PATCH"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.00
                penetration_floor_pct: 0.50
                committed_tier: "BASIC"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                ag_id: "id"
          trigger:
            - call: "PATCH /carriage/agreements/${ag_id}"
              payload:
                base_license_fee_cents_per_sub: 44.0000
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/agreements/${ag_id}/lifecycle"
              payload:
                action: "SUBMIT_FOR_NEGOTIATION"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/agreements/${ag_id}/lifecycle"
              payload:
                action: "EXECUTE"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "PATCH /carriage/agreements/${ag_id}"
              payload:
                base_license_fee_cents_per_sub: 50.0000
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
          assert:
            - "the DRAFT PATCH returns 200 with data.base_license_fee_cents_per_sub == 44.0000 and data.lifecycle_status == \"DRAFT\""
            - "the EXECUTE returns 200 with data.effective_rate_cents_per_sub == 44.0000 — the patched base, not the original 40.0000"
            - "the post-execution PATCH returns 422 with data.error_id == \"ERR_INVALID_AGREEMENT_STATE\""
            - "GET /carriage/agreements/${ag_id} still returns base_license_fee_cents_per_sub == 44.0000"

      - name: release_hold_clears_status_without_reinstating_agreements
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /carriage/distributors/{distributorId}/credit-review]
          - entities.Distributor.fields.credit_hold_reason
          - state_machines.CarriageAgreement.EXECUTED_to_SUSPENDED
          - state_machines.RightsWindow.CLEARED_to_BLOCKED
        distinguishing_aspect: >-
          The credit-review action is deliberately asymmetric: PLACE_HOLD cascades
          down to agreements and windows, but RELEASE_HOLD only restores the
          Distributor to ACTIVE with credit_hold_reason NONE — the agreement stays
          SUSPENDED with suspension_reason DISTRIBUTOR_CREDIT_HOLD and the window stays
          BLOCKED until an explicit REINSTATE.
        test_recipe:
          setup:
            - "One executed agreement with one CLEARED VOD window, no invoices at all, so both RELEASE_HOLD balance preconditions are trivially met."
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Meridian Broadband"
                distributor_type: "CABLE_MSO"
                rate_card_class: "CLASS_A"
                total_subscribers: 1500000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                dm_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${dm_id}"
                contract_code: "MB-HOLD"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
