scaffold_difficulty_design:
  # ==========================================================================
  # Rule 1 — dual_variant_calc (different entity domains: FormulaLine vs Batch)
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: overage_theoretical_vs_label_claim_basis
        grounds:
          - calculations.planned_overage_qty
          - entities.Formula.fields.overage_basis
          - entities.FormulaLine.fields.planned_weigh_qty_mg
        distinguishing_aspect: |
          Dual-variant logic on the FormulaLine (production-planning) domain: with
          identical line numbers (theoretical 500 mg/unit, label claim 450 mg/unit,
          overage 10%, batch 1000 units), the THEORETICAL variant yields
          planned_weigh_qty_mg == 550000.00 while the LABEL_CLAIM variant yields
          495000.00 — the two valid prose readings of "apply 10% overage" differ.
        test_recipe:
          setup:
            - "Customer exists; RawMaterial exists"
            - "Formula F1 (overage_basis THEORETICAL) and F2 (overage_basis LABEL_CLAIM) with identical line numbers, both APPROVED"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { brand_name: "Acme" }
              as: ProductionPlanner
              captures: { cust_id: $.data.id }
            - call: "POST /api/raw-materials"
              payload: { name: "VitC", allergen_class: "NONE" }
              as: ProductionPlanner
              captures: { rm_id: $.data.id }
            - call: "POST /api/customers/${cust_id}/formulas"
              payload:
                name: "C500-T"
                dosage_form: "TABLET"
                allergen_class: "NONE"
                min_order_qty: 1000
                batch_size_units: 1000
                shelf_life_months: 24
                overage_basis: "THEORETICAL"
                lines: [ { raw_material_id: "${rm_id}", theoretical_qty_mg_per_unit: 500, overage_pct: 10, is_label_claim_line: true, label_claim_mg_per_unit: 450 } ]
                price_tiers: [ { min_qty: 1000, unit_price_cents: 120 } ]
              as: ProductionPlanner
              captures: { f1_id: $.data.id }
            - call: "POST /api/customers/${cust_id}/formulas"
              payload:
                name: "C500-L"
                dosage_form: "TABLET"
                allergen_class: "NONE"
                min_order_qty: 1000
                batch_size_units: 1000
                shelf_life_months: 24
                overage_basis: "LABEL_CLAIM"
                lines: [ { raw_material_id: "${rm_id}", theoretical_qty_mg_per_unit: 500, overage_pct: 10, is_label_claim_line: true, label_claim_mg_per_unit: 450 } ]
                price_tiers: [ { min_qty: 1000, unit_price_cents: 120 } ]
              as: ProductionPlanner
              captures: { f2_id: $.data.id }
            - call: "POST /api/formulas/${f1_id}/approve"
              payload: {}
              as: QAManager
            - call: "POST /api/formulas/${f2_id}/approve"
              payload: {}
              as: QAManager
          trigger:
            - call: "GET /api/formulas/${f1_id}/lines"
              payload: {}
              as: QAManager
              captures: { f1_planned: "$.data[0].planned_weigh_qty_mg" }
            - call: "GET /api/formulas/${f2_id}/lines"
              payload: {}
              as: QAManager
              captures: { f2_planned: "$.data[0].planned_weigh_qty_mg" }
          assert:
            - "F1 line planned_weigh_qty_mg == 550000.0 (round_half_up(500*1.10,2)=550.00 per unit, x1000)"
            - "F2 line planned_weigh_qty_mg == 495000.0 (round_half_up(450*1.10,2)=495.00 per unit, x1000)"
            - "${f1_planned} != ${f2_planned}"
      - name: yield_units_vs_mass_basis
        grounds:
          - calculations.yield_variance_pct
          - entities.Batch.fields.yield_variance_pct
          - state_machines.Batch.production_status=IN_PROCESS_to_production_status=COMPLETED
        distinguishing_aspect: |
          Dual-variant logic on the Batch (yield-reconciliation) domain — a
          different entity domain than overage_theoretical_vs_label_claim_basis:
          with actual_yield_units 9600 vs theoretical 10000 but independently
          measured bulk mass 4750 g vs nominal 5000 g, the PINNED units basis
          yields -4.00% while the documented mass-basis reading yields -5.00%.
        test_recipe:
          setup:
            - "Full happy path to an IN_PROCESS batch: customer, raw material, APPROVED formula (batch_size_units 10000), RELEASED lot, MO placed and scheduled, batch started, consumption recorded"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: QAManager
            - call: "POST /api/customers"
              payload: { brand_name: "Acme" }
              as: ProductionPlanner
              captures: { cust_id: $.data.id }
            - call: "POST /api/raw-materials"
              payload: { name: "VitC", allergen_class: "NONE" }
              as: ProductionPlanner
              captures: { rm_id: $.data.id }
            - call: "POST /api/customers/${cust_id}/formulas"
              payload:
                name: "C500"
                dosage_form: "TABLET"
                allergen_class: "NONE"
                min_order_qty: 1000
                batch_size_units: 10000
                shelf_life_months: 24
                overage_basis: "THEORETICAL"
                lines: [ { raw_material_id: "${rm_id}", theoretical_qty_mg_per_unit: 500, overage_pct: 10, is_label_claim_line: true, label_claim_mg_per_unit: 450 } ]
                price_tiers: [ { min_qty: 1000, unit_price_cents: 120 } ]
              as: ProductionPlanner
              captures: { f_id: $.data.id }
            - call: "POST /api/formulas/${f_id}/approve"
              payload: {}
              as: QAManager
            - call: "POST /api/production-lines"
              payload: { name: "L1" }
              as: ProductionPlanner
              captures: { line_id: $.data.id }
            - call: "POST /api/material-lots"
              payload: { raw_material_id: "${rm_id}", supplier_name: "SuppCo", supplier_coa_ref: "COA-1", qty_received: 10000000 }
              as: ProductionOperator
              captures: { lot_id: $.data.id }
            - call: "POST /api/material-lots/${lot_id}/identity-tests"
              payload: { result: "PASS", coa_match: true }
              as: QAChemist
              as_user_id: "chem-1"
              captures: { it_id: $.data.id }
            - call: "POST /api/identity-tests/${it_id}/coa-review"
              payload: { review_outcome: "APPROVE" }
              as: QAManager
              as_user_id: "qm-1"
            - call: "POST /api/manufacturing-orders"
              payload: { customer_id: "${cust_id}", formula_id: "${f_id}", ordered_qty: 10000 }
              as: BrandRep
              as_user_id: "${cust_id}"
              captures: { mo_id: $.data.id }
            - call: "POST /api/manufacturing-orders/${mo_id}/schedule"
              payload: { production_line_id: "${line_id}", planned_start: "2026-09-01T08:00:00Z", planned_end: "2026-09-01T16:00:00Z" }
              as: ProductionPlanner
              captures: { batch_id: $.data.id }
            - call: "POST /api/batches/${batch_id}/start"
              payload: {}
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /api/batches/${batch_id}/consumptions"
              payload: { material_lot_id: "${lot_id}", qty_consumed: 5500000 }
              as: ProductionOperator
              as_user_id: "op-1"
          trigger:
            - call: "POST /api/batches/${batch_id}/complete"
              payload: { actual_yield_units: 9600, actual_bulk_mass_g: 4750 }
              as: ProductionOperator
              as_user_id: "op-1"
          assert:
            - "Batch.${batch_id}.yield_variance_pct == -4.0 (units basis: (9600-10000)/10000*100)"
            - "Batch.${batch_id}.yield_variance_pct != -5.0 (mass basis (4750-5000)/5000*100 is the rejected reading)"
            - "Batch.${batch_id}.production_status == COMPLETED"

  # ==========================================================================
  # Rule 2 — combinatorial_formula (mode (a) tiered pricing; mode (b) nested rounding)
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_pricing_flat_rate_tier_selection
        grounds:
          - calculations.tiered_unit_price
          - entities.ManufacturingOrder.fields.unit_price_cents
          - entities.ManufacturingOrder.fields.total_price_cents
        distinguishing_aspect: |
          Mode (a) combinatorial formula: tier selection over 3 inputs
          (ordered_qty, MOQ gate, tier breakpoints) with non-linear tier-rate
          branches; flat-rate semantics pinned against the marginal reading —
          ordered_qty 20000 prices ALL units at 85 cents (total 1700000), not the
          marginal blend 4999*120 + ... which would be larger.
        test_recipe:
          setup:
            - "Customer and APPROVED formula with tiers [{1000,120},{5000,100},{20000,85}] and MOQ 1000"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { brand_name: "Acme" }
              as: ProductionPlanner
              captures: { cust_id: $.data.id }
            - call: "POST /api/raw-materials"
              payload: { name: "VitC", allergen_class: "NONE" }
              as: ProductionPlanner
              captures: { rm_id: $.data.id }
            - call: "POST /api/customers/${cust_id}/formulas"
              payload:
                name: "C500"
                dosage_form: "TABLET"
                allergen_class: "NONE"
                min_order_qty: 1000
                batch_size_units: 10000
                shelf_life_months: 24
                overage_basis: "THEORETICAL"
                lines: [ { raw_material_id: "${rm_id}", theoretical_qty_mg_per_unit: 500, overage_pct: 10, is_label_claim_line: true, label_claim_mg_per_unit: 450 } ]
                price_tiers: [ { min_qty: 1000, unit_price_cents: 120 }, { min_qty: 5000, unit_price_cents: 100 }, { min_qty: 20000, unit_price_cents: 85 } ]
              as: ProductionPlanner
              captures: { f_id: $.data.id }
            - call: "POST /api/formulas/${f_id}/approve"
              payload: {}
              as: QAManager
          trigger:
            - call: "POST /api/manufacturing-orders"
              payload: { customer_id: "${cust_id}", formula_id: "${f_id}", ordered_qty: 4999 }
              as: BrandRep
              as_user_id: "${cust_id}"
              captures: { mo1_id: $.data.id, mo1_unit: $.data.unit_price_cents, mo1_total: $.data.total_price_cents }
            - call: "POST /api/manufacturing-orders"
              payload: { customer_id: "${cust_id}", formula_id: "${f_id}", ordered_qty: 5000 }
              as: BrandRep
              as_user_id: "${cust_id}"
              captures: { mo2_id: $.data.id, mo2_unit: $.data.unit_price_cents, mo2_total: $.data.total_price_cents }
            - call: "POST /api/manufacturing-orders"
              payload: { customer_id: "${cust_id}", formula_id: "${f_id}", ordered_qty: 20000 }
              as: BrandRep
              as_user_id: "${cust_id}"
              captures: { mo3_id: $.data.id, mo3_unit: $.data.unit_price_cents, mo3_total: $.data.total_price_cents }
          assert:
            - "MO ${mo1_id}: unit_price_cents == 120, total_price_cents == 599880 (4999*120; greatest min_qty <= 4999 is 1000)"
            - "MO ${mo2_id}: unit_price_cents == 100, total_price_cents == 500000 (breakpoint 5000 inclusive -> tier 2)"
            - "MO ${mo3_id}: unit_price_cents == 85, total_price_cents == 1700000 (flat rate for all 20000 units, NOT marginal blend 4999*120+15000*100+1*85)"
      - name: overage_nested_rounding_order
        grounds:
          - calculations.planned_overage_qty
          - entities.FormulaLine.fields.planned_weigh_qty_mg
        distinguishing_aspect: |
          Mode (b) combinatorial formula (different mode than
          tiered_pricing_flat_rate_tier_selection): nested rounding where order
          matters — with theoretical 100.25 mg/unit, overage 10%, batch 100
          units, the PINNED round-per-unit-then-multiply order yields 11028.00
          mg, while multiply-then-round yields 11027.50 mg.
        test_recipe:
          setup:
            - "Customer, raw material, and a formula with fractional per-unit theoretical quantity, APPROVED"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { brand_name: "Acme" }
              as: ProductionPlanner
              captures: { cust_id: $.data.id }
            - call: "POST /api/raw-materials"
              payload: { name: "BotanicalExt", allergen_class: "NONE" }
              as: ProductionPlanner
              captures: { rm_id: $.data.id }
            - call: "POST /api/customers/${cust_id}/formulas"
              payload:
                name: "B100"
                dosage_form: "CAPSULE"
                allergen_class: "NONE"
                min_order_qty: 100
                batch_size_units: 100
                shelf_life_months: 12
                overage_basis: "THEORETICAL"
                lines: [ { raw_material_id: "${rm_id}", theoretical_qty_mg_per_unit: 100.25, overage_pct: 10, is_label_claim_line: true, label_claim_mg_per_unit: 100 } ]
                price_tiers: [ { min_qty: 100, unit_price_cents: 50 } ]
              as: ProductionPlanner
              captures: { f_id: $.data.id }
            - call: "POST /api/formulas/${f_id}/approve"
              payload: {}
              as: QAManager
          trigger:
            - call: "GET /api/formulas/${f_id}/lines"
              payload: {}
              as: QAManager
              captures: { planned: "$.data[0].planned_weigh_qty_mg" }
          assert:
            - "planned_weigh_qty_mg == 11028.0 (PINNED order: round_half_up(100.25*1.10,2)=110.28 per unit, then 110.28*100=11028.00)"
            - "planned_weigh_qty_mg != 11027.5 (the multiply-first reading 100.25*100*1.10=11027.50 is rejected)"

  # ==========================================================================
  # Rule 3 — non_linear_state_machine (Batch parallel dimensions; ProductionLine cycle)
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: batch_parallel_production_and_quality_dimensions
        grounds:
          - state_machines.Batch
          - entities.Batch.fields.production_status
          - entities.Batch.fields.quality_status
        distinguishing_aspect: |
          Parallel state dimensions on the Batch entity: production_status and
          quality_status evolve independently — the batch reaches
          production_status == RECORD_REVIEWED while quality_status is still
          ASSAY_HOLD, proving neither dimension blocks the other's legal moves;
          only the RELEASED transition joins the two dimensions.
        test_recipe:
          setup:
            - "IN_PROCESS batch (same base chain as yield instance), consumption recorded"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: QAManager
            - call: "POST /api/customers"
              payload: { brand_name: "Acme" }
              as: ProductionPlanner
              captures: { cust_id: $.data.id }
            - call: "POST /api/raw-materials"
              payload: { name: "VitC", allergen_class: "NONE" }
              as: ProductionPlanner
              captures: { rm_id: $.data.id }
            - call: "POST /api/customers/${cust_id}/formulas"
              payload:
                name: "C500"
                dosage_form: "TABLET"
                allergen_class: "NONE"
                min_order_qty: 1000
                batch_size_units: 10000
                shelf_life_months: 24
                overage_basis: "THEORETICAL"
                lines: [ { raw_material_id: "${rm_id}", theoretical_qty_mg_per_unit: 500, overage_pct: 10, is_label_claim_line: true, label_claim_mg_per_unit: 450 } ]
                price_tiers: [ { min_qty: 1000, unit_price_cents: 120 } ]
              as: ProductionPlanner
              captures: { f_id: $.data.id }
            - call: "POST /api/formulas/${f_id}/approve"
              payload: {}
              as: QAManager
            - call: "POST /api/production-lines"
              payload: { name: "L1" }
              as: ProductionPlanner
              captures: { line_id: $.data.id }
            - call: "POST /api/material-lots"
              payload: { raw_material_id: "${rm_id}", supplier_name: "SuppCo", supplier_coa_ref: "COA-1", qty_received: 10000000 }
              as: ProductionOperator
              captures: { lot_id: $.data.id }
            - call: "POST /api/material-lots/${lot_id}/identity-tests"
              payload: { result: "PASS", coa_match: true }
              as: QAChemist
              as_user_id: "chem-1"
              captures: { it_id: $.data.id }
            - call: "POST /api/identity-tests/${it_id}/coa-review"
              payload: { review_outcome: "APPROVE" }
              as: QAManager
              as_user_id: "qm-1"
            - call: "POST /api/manufacturing-orders"
              payload: { customer_id: "${cust_id}", formula_id: "${f_id}", ordered_qty: 10000 }
              as: BrandRep
              as_user_id: "${cust_id}"
              captures: { mo_id: $.data.id }
            - call: "POST /api/manufacturing-orders/${mo_id}/schedule"
              payload: { production_line_id: "${line_id}", planned_start: "2026-09-01T08:00:00Z", planned_end: "2026-09-01T16:00:00Z" }
              as: ProductionPlanner
              captures: { batch_id: $.data.id }
            - call: "POST /api/batches/${batch_id}/start"
              payload: {}
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /api/batches/${batch_id}/consumptions"
              payload: { material_lot_id: "${lot_id}", qty_consumed: 5500000 }
              as: ProductionOperator
              as_user_id: "op-1"
          trigger:
            - call: "POST /api/batches/${batch_id}/complete"
              payload: { actual_yield_units: 9800, actual_bulk_mass_g: 5390 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /api/batches/${batch_id}/assay-results"
              payload: { assayed_mg_per_unit: 400 }
              as: QAChemist
              as_user_id: "chem-1"
              captures: { ar_id: $.data.id }
            - call: "POST /api/batches/${batch_id}/record-review"
              payload: {}
              as: QAManager
              as_user_id: "qm-1"
          assert:
            - "After complete: production_status == COMPLETED while quality_status == PENDING_QC"
            - "After below-claim assay (400/450 = 88.9): quality_status == ASSAY_HOLD while production_status stays COMPLETED"
            - "After record-review: production_status == RECORD_REVIEWED while quality_status == ASSAY_HOLD (dimensions independent until release join)"
            - "AssayResult.${ar_id}.pct_of_claim == 88.9"
      - name: production_line_cleaning_cycle
        grounds:
          - state_machines.ProductionLine
          - entities.ProductionLine.fields.cleaning_status
        distinguishing_aspect: |
          True A->B->C->A->B cycle on the ProductionLine entity (a different
          entity than the Batch machine of
          batch_parallel_production_and_quality_dimensions):
          CLEAN_VALIDATED -> DIRTY -> CLEAN_PENDING_VALIDATION ->
          CLEAN_VALIDATED -> DIRTY again across two consecutive batches.
        test_recipe:
          setup:
            - "Full chain: one batch completed on line L1 (line now DIRTY), cleaning recorded+swabbed+approved (line CLEAN_VALIDATED), second order scheduled on L1 and started"
          setup_api_calls:
