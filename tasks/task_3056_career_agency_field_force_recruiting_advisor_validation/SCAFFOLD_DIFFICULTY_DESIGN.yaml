              captures: { reg_s6_id: $.data.id }
            - call: "POST /agency/securities-registrations"
              payload: { advisor_id: "${adv_id}", registration_type: "SERIES_65", crd_number: "CRD-6065", effective_date: "2026-09-01T00:00:00Z", expires_at: "2027-12-31T00:00:00Z", prerequisite_registration_id: "${reg_s6_id}" }
              as: LicensingCoordinator
              captures: { reg_s65_id: $.data.id }
          trigger:
            - call: "POST /agency/securities-registrations/${reg_s65_id}/activate"
              payload: {}
