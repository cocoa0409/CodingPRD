              payload: { to_iso8601: "2031-07-31T00:00:00Z" }
              as: ComplianceDirector
          trigger:
            - call: "POST /compliance/audit-records/purge"
              payload: {}
              as: ComplianceDirector
              captures: { purge1: $.data.purged_count }
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2031-07-31T00:00:01Z" }
              as: ComplianceDirector
            - call: "POST /compliance/audit-records/purge"
              payload: {}
              as: ComplianceDirector
              captures: { purge2: $.data.purged_count }
          assert:
            - "purge1 == 0 (retain_until == clock: strict comparison retains the record)"
            - "purge2 == 1 (one second past retain_until: record purged)"

