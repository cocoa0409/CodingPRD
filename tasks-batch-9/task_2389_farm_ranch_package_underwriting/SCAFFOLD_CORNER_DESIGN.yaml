  - section: validations
    instances:

      - name: corner_blanket_limit_required_and_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors.ERR_BLANKET_LIMIT_REQUIRED", "calculations.livestock_covered_limit"]
        distinguishing_aspect: "The conditional field is enforced in both directions on the same endpoint: BLANKET without blanket_limit_cents and PER_HEAD with it both return ERR_BLANKET_LIMIT_REQUIRED (422), and the corrected BLANKET call freezes covered_limit_cents at 20400000."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, one DRAFT policy"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_acct
            - *k_policy
          trigger:
            - call: "POST /farm-policies/${pol_id}/livestock-groups"
              payload: { species: "CATTLE", head_count: 170, per_head_value_cents: 150000, limit_basis: "BLANKET", peril_scope: "FULL_PERIL" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { e_bl1: $.data.error_id }
            - call: "POST /farm-policies/${pol_id}/livestock-groups"
              payload: { species: "CATTLE", head_count: 170, per_head_value_cents: 150000, limit_basis: "PER_HEAD", peril_scope: "FULL_PERIL", blanket_limit_cents: 25500000 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { e_bl2: $.data.error_id }
            - call: "POST /farm-policies/${pol_id}/livestock-groups"
              payload: { species: "CATTLE", head_count: 170, per_head_value_cents: 150000, limit_basis: "BLANKET", peril_scope: "FULL_PERIL", blanket_limit_cents: 25500000 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { lg_ok: $.data.id, lg_ok_limit: $.data.covered_limit_cents }
          assert:
            - "the first two calls return HTTP 422 with error_id == ERR_BLANKET_LIMIT_REQUIRED"
            - "the third call succeeds with covered_limit_cents == 20400000 (25500000 * 0.80) — the 30000000 aggregate cap does not apply on the BLANKET branch"
            - "GET /farm-policies/${pol_id}/livestock-groups returns exactly 1 row"

      - name: corner_peak_season_triple_is_all_or_nothing
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors.ERR_PEAK_SEASON_FIELDS_REQUIRED", "entities.ScheduledItem.fields.peak_season_value_cents"]
        distinguishing_aspect: "Three distinct shapes of the same violation are rejected with ERR_PEAK_SEASON_FIELDS_REQUIRED (422): peak fields on a DWELLING, a STORED_CROP with no peak fields, and a STORED_CROP whose peak value is below its stated value."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, one DRAFT policy"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_acct
            - *k_policy
          trigger:
            - call: "POST /farm-policies/${pol_id}/scheduled-items"
              payload: { item_class: "DWELLING", description: "Ranch house", valuation_basis: "RC", stated_value_cents: 40000000, age_years: 22, condition_grade: "B", peak_season_value_cents: 50000000, peak_season_start_month: 10, peak_season_end_month: 2 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { e_pk1: $.data.error_id }
            - call: "POST /farm-policies/${pol_id}/scheduled-items"
              payload: { item_class: "STORED_CROP", description: "Bin 4 corn", valuation_basis: "RC", stated_value_cents: 6005000, age_years: 0, condition_grade: "A" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { e_pk2: $.data.error_id }
            - call: "POST /farm-policies/${pol_id}/scheduled-items"
              payload: { item_class: "STORED_CROP", description: "Bin 4 corn", valuation_basis: "RC", stated_value_cents: 6005000, age_years: 0, condition_grade: "A", peak_season_value_cents: 5000000, peak_season_start_month: 10, peak_season_end_month: 2 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { e_pk3: $.data.error_id }
            - call: "POST /farm-policies/${pol_id}/scheduled-items"
              payload: { item_class: "STORED_CROP", description: "Bin 4 corn", valuation_basis: "RC", stated_value_cents: 6005000, age_years: 0, condition_grade: "A", peak_season_value_cents: 18000000, peak_season_start_month: 10, peak_season_end_month: 2 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { it_crop: $.data.id, crop_iv: $.data.insured_value_cents }
          assert:
            - "the first three calls all return HTTP 422 with error_id == ERR_PEAK_SEASON_FIELDS_REQUIRED"
            - "the fourth call succeeds with insured_value_cents == 6005000 — the clock month 8 is outside the 10..2 wrap-around season"
