              captures: { inv0: "$.data[0].id" }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /wash-events"
              payload: { location_id: "${loc}", license_plate: "CMP001", state_code: "CA" }
              as: LocationOperator
              captures: { we: "$.data.id" }
          trigger:
            - call: "POST /wash-events/${we}/complete"
              payload: {}
              as: LocationOperator
          assert:
            - "WashEvent.${we}.status == COMPLETED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_addon_attach_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[addon-attach-stale-membership]", entities.Membership.fields.version]
        distinguishing_aspect: "Positive OCC path: attaching an add-on with the current expected_membership_version succeeds (201) and bumps Membership.version by 1, the complement to the stale-version §1.8 instance."
        test_recipe:
          setup: ["ACTIVE UNLIMITED membership (max_addons=3); one ACTIVE add-on."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { name: "UOk", tier_type: "UNLIMITED", monthly_fee_cents: 3000, included_credits: 0, wash_cooldown_hours: 0, max_addons: 3 }
              as: PlatformAdmin
              captures: { plan_u: "$.data.id" }
            - call: "POST /addons"
              payload: { name: "OkAdd", recurring_fee_cents: 500 }
              as: PlatformAdmin
              captures: { ad: "$.data.id" }
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", contact_email: "ok@x.com" }
              as: AccountHolder
              captures: { acct: "$.data.id" }
            - call: "POST /accounts/${acct}/vehicles"
              payload: { license_plate: "OK0001", state_code: "CA" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { veh: "$.data.id" }
            - call: "POST /memberships"
              payload: { account_id: "${acct}", vehicle_id: "${veh}", plan_id: "${plan_u}" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { mem: "$.data.id" }
            - call: "GET /invoices"
              payload: { membership_id: "${mem}", kind: "CYCLE" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { inv0: "$.data[0].id" }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "GET /memberships/${mem}"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { mem_v: "$.data.version" }
          trigger:
            - call: "POST /memberships/${mem}/addons"
              payload: { addon_id: "${ad}", expected_membership_version: "${mem_v}" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { ma: "$.data.id" }
            - call: "GET /memberships/${mem}"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { mem_v2: "$.data.version" }
          assert:
            - "HTTP 201; MembershipAddOn.${ma}.status == ACTIVE"
            - "Membership.${mem}.version (mem_v2) == the prior version (mem_v) + 1"

      - name: derived_field_reconciliation_wallet_after_adjustment
        claim_type: derived_field_reconciliation
        grounds: [calculations.wallet_balance, entities.Account.fields.wallet_balance_cents]
        distinguishing_aspect: "After a +2500 then +1500 manual adjustment, GET /accounts/{id} reports wallet_balance_cents == 4000, the recomputed sum of the ledger (derived field stays consistent after each write)."
        test_recipe:
          setup: ["An account with no transactions."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", contact_email: "der@x.com" }
              as: PlatformAdmin
              captures: { acct: "$.data.id" }
            - call: "POST /accounts/${acct}/adjustments"
              payload: { amount_cents: 2500 }
              as: BillingAdmin
          trigger:
            - call: "POST /accounts/${acct}/adjustments"
              payload: { amount_cents: 1500 }
              as: BillingAdmin
            - call: "GET /accounts/${acct}"
              payload: {}
              as: BillingAdmin
              captures: { bal: "$.data.wallet_balance_cents" }
          assert:
            - "Account.${acct}.wallet_balance_cents == 4000"

  # ===========================================================================
  # excluded_because stubs — corners already exercised by named §1.8 instances
  # ===========================================================================
  - section: state_machines
    instances:
      - name: membership_active_to_frozen_cascade_stub
        claim_type: Side Effect Execution
        grounds: [state_machines.Membership.ACTIVE_to_FROZEN]
        excluded_because:
          difficulty_instance: transitive_cascade / account_suspend_cascade_depth3
          rationale: "The freeze cascade (membership FROZEN + add-ons PAUSED) is asserted end-to-end by the depth-3 cascade §1.8 instance."

      - name: invoice_failed_retrying_paid_stub
        claim_type: Valid Transition
        grounds: [state_machines.Invoice.FAILED_to_RETRYING]
        excluded_because:
          difficulty_instance: non_linear_state_machine / invoice_failed_retrying_paid_cycle
          rationale: "The full FAILED->RETRYING->PAID loop and attempt_count progression is asserted by that §1.8 instance."

  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_topup_stale_version_stub
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[topup-stale-membership]"]
        excluded_because:
          difficulty_instance: compensating_invariant / entitlement_conservation_grant_minus_consumed
          rationale: "The topup OCC write_endpoint and its credits_granted side effect are exercised positively there; the stale-version negative path is the dedicated topup_stale_membership_version difficulty-tier instance recorded in the difficulty design as part of the OCC pairing."

  - section: calculations
    instances:
      - name: invoice_cycle_total_fleet_discount_stub
        claim_type: Correct Result
        grounds: [calculations.invoice_cycle_total]
        excluded_because:
          difficulty_instance: combinatorial_formula / invoice_cycle_total_fleet_tiered_discount
          rationale: "Fleet tier selection and discount_cents/total_cents are computed and asserted as literals (3000/500/175/3325) by that §1.8 instance."

  - section: errors
    instances:
      - name: err_freeze_overlap_trigger_stub
        claim_type: Violation -> Error
        grounds: ["errors[ERR_FREEZE_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / freeze_window_overlap_rejected_half_open
          rationale: "ERR_FREEZE_OVERLAP is triggered and asserted there."

      - name: err_capacity_full_trigger_stub
        claim_type: Violation -> Error
        grounds: ["errors[ERR_CAPACITY_FULL]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / location_daily_capacity_aggregate_full_rejects
          rationale: "ERR_CAPACITY_FULL is triggered and asserted there."

      - name: err_stale_version_trigger_stub
        claim_type: Violation -> Error
        grounds: ["errors[ERR_STALE_VERSION]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / membership_invalid_state_beats_insufficient_wallet_on_topup
          rationale: "ERR_STALE_VERSION is additionally surfaced by the topup_stale_membership_version OCC instance in the difficulty design; the corner positive OCC instance occ_addon_attach_correct_version_succeeds covers the success complement."
