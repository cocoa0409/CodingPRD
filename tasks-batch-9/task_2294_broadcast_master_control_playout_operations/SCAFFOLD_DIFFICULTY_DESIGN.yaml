            - "Channel 12.3 has air_status ON_AIR and posture NORMAL."
            - "SpotOrder ORD-4A on channel 12.3: ordered_spots 3, unit_duration_seconds 30, rate_cents_total 1500 so per_spot_rate_cents == 500 exactly, priority_class PREEMPTIBLE."
            - "Playlist on 12.3 for 2026-08-01, schedule_start_utc 12:00:00Z, window 1800 s: seq 1 PROGRAM (asset A3, 1740 s) at 12:00:00Z, seq 2 and seq 3 COMMERCIAL (asset C3, 30 s each) at 12:29:00Z and 12:29:30Z, both linked to ORD-4A; status ON_AIR."
            - "Item seq 1 is PLAYING with actual_start_utc 12:00:00Z; seq 2 and seq 3 are SCHEDULED. The logical clock stands at 2026-08-01T12:20:00Z."
