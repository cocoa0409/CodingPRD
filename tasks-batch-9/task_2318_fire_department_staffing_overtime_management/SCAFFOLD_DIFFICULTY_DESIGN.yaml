              as: StaffingOfficer
              captures: { ff54a: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st54}", full_name: "A Abel", rank: "FIREFIGHTER", platoon: "C", seniority_rank: 2, kelly_day_cycle_position: 2, certifications: [], hourly_rate_cents: 4000 }
