  - rule_id: cross_entity_state_dependency
    instances:
      - name: railcar_in_shop_blocks_assignment
        grounds:
          - validations[priority=7]
          - state_machines.Railcar.AVAILABLE_to_IN_SHOP
          - errors[ERR_RAILCAR_NOT_AVAILABLE]
        distinguishing_aspect: |
          Pair Railcar -> LeaseAssignment: a car in IN_SHOP (entered through the repair
          lifecycle) cannot be assigned even though the lease, tariffs, and dates are all valid.
        test_recipe:
          setup:
            - "Car GATX9201 AVAILABLE; PRE_EXISTING shop repair 80000 approved and started (car IN_SHOP)"
            - "Tariffs 9000/55; lessee; lease ACTIVE 2026-08-01..2027-07-31"
          setup_api_calls:
            - { call: "POST /railcars", payload: { car_mark: "GATX9201", car_type: "BOX", built_year: 2018 }, as: FleetPlanner, captures: { car: "$.data.id" } }
            - { call: "POST /repair-authorizations", payload: { railcar_id: "${car}", defect_description: "floor", defect_cause: "PRE_EXISTING", estimate_cents: 80000, requires_shop: true }, as: MaintenanceController, captures: { rep: "$.data.id" } }
            - { call: "POST /repair-authorizations/${rep}/approve", payload: { approved_amount_cents: 80000 }, as: MaintenanceController }
            - { call: "POST /repair-authorizations/${rep}/start-work", payload: {}, as: MaintenanceController }
            - { call: "POST /tariff-rates", payload: { car_type: "BOX", rate_kind: "CAR_HIRE_BASE", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 9000 }, as: LeaseAdmin }
            - { call: "POST /tariff-rates", payload: { car_type: "BOX", rate_kind: "MILEAGE_CREDIT", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 55 }, as: LeaseAdmin }
