            - { call: "POST /participants", payload: { ssn_hash: "hash-d", full_name: "Dan D", date_of_birth: "1983-04-04", mailing_address_line1: "4 Main St", mailing_city: "Springfield", mailing_state: "IL", mailing_zip: "62701" }, as: PlanSponsor, captures: { p_d: $.data.id } }
