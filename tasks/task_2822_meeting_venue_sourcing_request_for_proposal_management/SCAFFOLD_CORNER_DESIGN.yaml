  - section: state_machines
    instances:
    - name: lock_requirements_moves_event_from_draft_to_requirements_locked
      claim_type: Valid Transition
      grounds:
      - state_machines.MeetingEvent.DRAFT_to_REQUIREMENTS_LOCKED
      - endpoints[POST /sourcing/events/{event_id}/lock-requirements]
      - entities.MeetingEvent.fields.status
      - entities.MeetingEvent.fields.version
      distinguishing_aspect: 'The lock-requirements trigger is the only DRAFT exit other than cancel: it moves the event to REQUIREMENTS_LOCKED, bumps version 1 -> 2 and refreshes updated_at, while leaving every requirement figure and the untouched money envelope exactly as created.'
      test_recipe:
        setup:
        - Empty database.
        - Logical clock at 2026-08-05T09:00:00.000Z.
        - MeetingEvent EVT-2822-A 2027-03-15..2027-03-18, ceiling 500000.00, still in DRAFT.
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload: {current_utc: '2026-08-05T09:00:00.000Z'}
          as: ProgramAdmin
        - call: POST /sourcing/events
          payload: {event_code: EVT-2822-A, name: Global User Conference 2027, program_type: USER_CONFERENCE, start_date: '2027-03-15', end_date: '2027-03-18', peak_attendees: 200, requested_room_nights: 600, largest_meeting_space_sqft: 12000, budget_ceiling_usd: 500000.0, preferred_program_only: false}
          as: SourcingManager
          as_user_id: planner-anita
          captures: {ev_id: $.data.id}
        trigger:
        - call: POST /sourcing/events/${ev_id}/lock-requirements
          payload: {}
          as: SourcingManager
          as_user_id: planner-anita
        assert:
        - HTTP 200
        - MeetingEvent.${ev_id}.status == REQUIREMENTS_LOCKED
        - MeetingEvent.${ev_id}.version == 2
        - MeetingEvent.${ev_id}.updated_at == 2026-08-05T09:00:00.000Z
        - MeetingEvent.${ev_id}.requested_room_nights == 600 and largest_meeting_space_sqft == 12000 (unchanged)
        - MeetingEvent.${ev_id}.budget_remaining_usd == 500000.00 and committed_spend_usd == 0.00
    - name: lock_requirements_twice_returns_event_state_invalid
      claim_type: Idempotency
      grounds:
      - state_machines.MeetingEvent.DRAFT_to_REQUIREMENTS_LOCKED
      - validations[priority=40]
      - errors[ERR_EVENT_STATE_INVALID]
      distinguishing_aspect: 'lock-requirements is NOT idempotent: the second call finds the event already in REQUIREMENTS_LOCKED, which is not the DRAFT the transition demands, so it returns HTTP 409 ERR_EVENT_STATE_INVALID and - critically - does not bump version a second time (it stays 2).'
      test_recipe:
        setup:
        - Logical clock at 2026-08-05T09:00:00.000Z throughout.
        - MeetingEvent EVT-2822-A already moved to REQUIREMENTS_LOCKED by one successful lock-requirements call (version 2).
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload: {current_utc: '2026-08-05T09:00:00.000Z'}
          as: ProgramAdmin
        - call: POST /sourcing/events
          payload: {event_code: EVT-2822-A, name: Global User Conference 2027, program_type: USER_CONFERENCE, start_date: '2027-03-15', end_date: '2027-03-18', peak_attendees: 200, requested_room_nights: 600, largest_meeting_space_sqft: 12000, budget_ceiling_usd: 500000.0, preferred_program_only: false}
          as: SourcingManager
          as_user_id: planner-anita
          captures: {ev_id: $.data.id}
        - call: POST /sourcing/events/${ev_id}/lock-requirements
          payload: {}
          as: SourcingManager
          as_user_id: planner-anita
        trigger:
        - call: POST /sourcing/events/${ev_id}/lock-requirements
          payload: {}
          as: SourcingManager
          as_user_id: planner-anita
          captures: {err_relock: $.data.error_id}
        assert:
        - HTTP 409 with data.error_id == ERR_EVENT_STATE_INVALID
        - MeetingEvent.${ev_id}.status == REQUIREMENTS_LOCKED (unchanged)
        - MeetingEvent.${ev_id}.version == 2 (the refused call did not increment it)
    - name: rfp_starts_in_draft_with_zero_response_counters
      claim_type: Initial State
      grounds:
      - state_machines.Rfp.initial_state
      - entities.Rfp.fields.status
      - entities.Rfp.fields.invited_count
      - entities.Rfp.fields.submitted_count
      - endpoints[POST /sourcing/events/{event_id}/rfps]
      distinguishing_aspect: 'A freshly created Rfp lands in DRAFT - not ISSUED - so no Proposal exists yet: invited_count and submitted_count are both 0, issued_at and closed_at are null, and the parent event is still REQUIREMENTS_LOCKED because only the issue trigger moves it to SOURCING.'
      test_recipe:
        setup:
        - Logical clock at 2026-08-05T09:00:00.000Z throughout.
        - RateBenchmark (TIER_1, USER_CONFERENCE) at 260.00 ADR.
