  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_waitlist_offer_waitlist_cycle
        grounds:
          - state_machines.Application.WAITLISTED_to_OFFERED
          - state_machines.Application.OFFERED_to_WAITLISTED
          - entities.Application.fields.status
        distinguishing_aspect: |
          Application cycles WAITLISTED -> OFFERED -> WAITLISTED -> OFFERED: after declining an offer
          the application returns to WAITLISTED and a later selection run can offer it again — a genuine
          cycle, not a linear pipeline.
        test_recipe:
          setup:
            - "Single eligible application AB waitlisted in a PRESCHOOL_4 cohort (funded_slots 2); one selection run has issued a PENDING offer."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HS", program_type: "HEAD_START", funded_enrollment: 4, age_cutoff_date: "2026-09-01", total_instructional_days: 160 }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", age_band: "PRESCHOOL_4", funded_slots: 2, min_age_months: 48, max_age_months: 60, session_start: "09:00", session_end: "12:00" }
              as: ProgramAdmin
              captures: { coh_id: "$.data.id" }
            - call: "POST /families"
              payload: { guardian_name: "B", household_size: 3, annual_income_cents: 800000, categorical_eligibility: "TANF" }
              as: EnrollmentSpecialist
              captures: { fam_id: "$.data.id" }
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", cohort_id: "${coh_id}", family_id: "${fam_id}", child_first_name: "Bo", child_last_name: "B", child_dob: "2022-01-10" }
              as: EnrollmentSpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: EnrollmentSpecialist
            - call: "POST /applications/${app_id}/verify-eligibility"
              payload: { verified_income_cents: 800000 }
              as: EnrollmentSpecialist
            - call: "POST /applications/${app_id}/waitlist"
              payload: {}
              as: EnrollmentSpecialist
            - call: "POST /cohorts/${coh_id}/run-selection"
              payload: {}
              as: ProgramAdmin
            - call: "GET /offers?application_id=${app_id}"
              payload: {}
              as: EnrollmentSpecialist
              captures: { offer_id: "$.data[0].id" }
          trigger:
            - call: "POST /offers/${offer_id}/decline"
              payload: {}
              as: Family
              as_user_id: "${fam_id}"
              captures: { off_status: "$.data.status" }
            - call: "POST /cohorts/${coh_id}/run-selection"
              payload: {}
              as: ProgramAdmin
            - call: "GET /applications/${app_id}"
              payload: {}
              as: EnrollmentSpecialist
              captures: { app_status: "$.data.status" }
          assert:
            - "${off_status} == \"DECLINED\""
            - "${app_status} == \"OFFERED\""

      - name: enrollment_status_and_health_dimensions_independent
        grounds:
          - state_machines.Enrollment.PENDING_to_NON_COMPLIANT
          - state_machines.Enrollment.NON_COMPLIANT_to_COMPLIANT
          - entities.Enrollment.fields.status
          - entities.Enrollment.fields.health_compliance_status
        distinguishing_aspect: |
          Enrollment carries two parallel dimensions: while status stays ACTIVE, health_compliance_status
          moves PENDING -> NON_COMPLIANT -> COMPLIANT via health-screening updates, independently of the
          enrollment lifecycle dimension.
        test_recipe:
          setup:
            - "Enrollment ACTIVE for AB with a single IMMUNIZATION screening created (status DUE)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HS", program_type: "HEAD_START", funded_enrollment: 4, age_cutoff_date: "2026-09-01", total_instructional_days: 160 }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", age_band: "PRESCHOOL_4", funded_slots: 2, min_age_months: 48, max_age_months: 60, session_start: "09:00", session_end: "12:00" }
              as: ProgramAdmin
              captures: { coh_id: "$.data.id" }
            - call: "POST /families"
              payload: { guardian_name: "B", household_size: 3, annual_income_cents: 800000, categorical_eligibility: "TANF" }
              as: EnrollmentSpecialist
              captures: { fam_id: "$.data.id" }
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", cohort_id: "${coh_id}", family_id: "${fam_id}", child_first_name: "Bo", child_last_name: "B", child_dob: "2022-01-10" }
              as: EnrollmentSpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: EnrollmentSpecialist
            - call: "POST /applications/${app_id}/verify-eligibility"
              payload: { verified_income_cents: 800000 }
              as: EnrollmentSpecialist
            - call: "POST /applications/${app_id}/waitlist"
              payload: {}
              as: EnrollmentSpecialist
            - call: "POST /cohorts/${coh_id}/run-selection"
              payload: {}
              as: ProgramAdmin
            - call: "GET /offers?application_id=${app_id}"
              payload: {}
              as: EnrollmentSpecialist
              captures: { offer_id: "$.data[0].id" }
            - call: "GET /cohorts/${coh_id}"
              payload: {}
              as: ProgramAdmin
              captures: { coh_v: "$.data.version" }
            - call: "POST /offers/${offer_id}/accept"
              payload: { expected_cohort_version: "${coh_v}" }
              as: Family
              as_user_id: "${fam_id}"
            - call: "GET /enrollments?application_id=${app_id}"
              payload: {}
              as: EnrollmentSpecialist
              captures: { enr_id: "$.data[0].id" }
            - call: "POST /health-screenings"
              payload: { enrollment_id: "${enr_id}", screening_type: "IMMUNIZATION", due_date: "2026-03-15" }
              as: FamilyServicesWorker
              captures: { hs_id: "$.data.id" }
          trigger:
            - call: "PATCH /health-screenings/${hs_id}"
              payload: { status: "OVERDUE" }
              as: FamilyServicesWorker
            - call: "GET /enrollments/${enr_id}"
              payload: {}
              as: EnrollmentSpecialist
              captures: { st1: "$.data.status", hc1: "$.data.health_compliance_status" }
            - call: "PATCH /health-screenings/${hs_id}"
              payload: { status: "UP_TO_DATE", completed_date: "2026-03-16" }
              as: FamilyServicesWorker
            - call: "GET /enrollments/${enr_id}"
              payload: {}
