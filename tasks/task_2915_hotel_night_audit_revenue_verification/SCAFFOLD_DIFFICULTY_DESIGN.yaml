          assert:
            - "The trigger response returns balance_amount == 47.50: overdue 31 > grace 30, overdue <= 180 so pct is 0.25, tiered = round(189.99 * 0.25, 2) = 47.50, and neither the 25.00 floor nor the 189.99 ceiling bites."
            - "GET /night-audit/folios/${folio_grace_id} returns balance_amount == 0.00 and stay_status == DEPARTED - exactly 30 overdue minutes is free."
            - "GET /night-audit/journal-postings?folio_id=${folio_grace_id}&charge_type=LATE_CHECKOUT returns an empty list; a 0.00 charge writes no line at all."
