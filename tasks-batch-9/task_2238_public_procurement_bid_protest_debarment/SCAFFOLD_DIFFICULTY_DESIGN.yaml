            - "ProtestHearing.${h3_id}.status == SCHEDULED and room_code == ROOM-A (untouched)"

  - rule_id: boundary_precision_check
    instances:
      - name: reinstatement_petition_accepted_at_exactly_the_earliest_petition_instant
        grounds:
          - calculations.reinstatement_earliest_petition_utc
          - validations[priority=33]
          - errors[ERR_PETITION_PREMATURE]
          - entities.ReinstatementPetition.fields.months_served_at_filing
          - endpoints[POST /procurement/debarment-proceedings/{id}/reinstatement-petitions]
        distinguishing_aspect: |
          The metric under test is a DATETIME instant boundary — the clock compared to
          Vendor.reinstatement_earliest_petition_utc with an inclusive `>=` — exercised on
          POST /procurement/debarment-proceedings/{id}/reinstatement-petitions. The clock
          is parked at exactly 2027-02-16T00:00:00Z, the computed earliest instant itself,
          so the request must be ACCEPTED (201) rather than refused with
          ERR_PETITION_PREMATURE.
        test_recipe:
          setup:
            - "logical clock starts at its default 2026-08-01T00:00:00Z"
            - "one Vendor V15 with eligibility_status ELIGIBLE and debarment_strike_count 0"
            - "one DebarmentProceeding D3 on V15 created at 2026-08-01T00:00:00Z with cause_code REPEATED_NONPERFORMANCE, aggravating_factor_codes [REPEATED_NONPERFORMANCE, SAFETY_VIOLATION] (20 + 15 = 35), no mitigating codes and interim_suspension false, so response_deadline_utc is 2026-08-15T00:00:00Z"
            - "the clock is moved to 2026-08-16T00:00:00Z (strictly past the response window) and the default-branch hearing is recorded, so D3 reaches HEARING_HELD"
            - "the DebarmentAuthority decides DEBARRED, producing severity_score 35.00, debarment_period_months 12, debarment_start_utc 2026-08-16T00:00:00Z, debarment_end_utc 2027-08-16T00:00:00Z and Vendor.reinstatement_earliest_petition_utc 2027-02-16T00:00:00Z (CEIL(12 * 0.5) == 6 calendar months)"
            - "the clock is then set to exactly 2027-02-16T00:00:00Z — the boundary instant itself, not one second later"
          setup_api_calls:
            - call: "POST /procurement/vendors"
              payload: { legal_name: "Havenridge Bridge Works", tax_id: "100000015", contact_email: "v15@example.gov" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
              captures: { v15_id: $.data.id }
            - call: "POST /procurement/debarment-proceedings"
              payload: { vendor_id: "${v15_id}", cause_code: "REPEATED_NONPERFORMANCE", aggravating_factor_codes: ["REPEATED_NONPERFORMANCE", "SAFETY_VIOLATION"], mitigating_factor_codes: [], interim_suspension: false }
              as: DebarmentAuthority
              as_user_id: "U-DEBAR-1"
              captures: { d3_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/debarment-proceedings/${d3_id}/hearing"
              payload: { hearing_summary: "no response filed within the notice window; default branch recorded" }
              as: DebarmentAuthority
              as_user_id: "U-DEBAR-1"
            - call: "POST /procurement/debarment-proceedings/${d3_id}/decision"
              payload: { outcome: "DEBARRED", rationale: "repeated nonperformance with an uncorrected safety finding" }
              as: DebarmentAuthority
              as_user_id: "U-DEBAR-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-16T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "GET /procurement/debarment-proceedings/${d3_id}"
              payload: {}
              as: DebarmentAuthority
              as_user_id: "U-DEBAR-1"
              captures: { d3_v: $.data.version }
          trigger:
            - call: "POST /procurement/debarment-proceedings/${d3_id}/reinstatement-petitions"
              payload: { remediation_evidence_codes: ["MANAGEMENT_REPLACED", "COMPLIANCE_AUDIT_PASSED"], narrative: "ownership replaced the responsible managers and passed an independent compliance audit", expected_proceeding_version: "${d3_v}" }
              as: Vendor
              as_user_id: "${v15_id}"
          assert:
            - "the trigger returns HTTP 201 and NOT ERR_PETITION_PREMATURE"
            - "the created ReinstatementPetition has status == FILED, proceeding_id == ${d3_id} and filed_at_utc == 2027-02-16T00:00:00Z"
            - "the created ReinstatementPetition has months_served_at_filing == 6"
            - "Vendor.${v15_id}.reinstatement_earliest_petition_utc == 2027-02-16T00:00:00Z, exactly equal to filed_at_utc"
            - "DebarmentProceeding.${d3_id}.severity_score == 35.00, debarment_period_months == 12, debarment_end_utc == 2027-08-16T00:00:00Z"
            - "Vendor.${v15_id}.eligibility_status == DEBARRED (filing a petition does not by itself reinstate the vendor)"

      - name: hearing_officer_docket_accepted_at_exactly_four_hundred_eighty_minutes
        grounds:
          - calculations.hearing_officer_daily_docket_minutes
          - validations[priority=36]
          - errors[ERR_OFFICER_DOCKET_CAPACITY_EXCEEDED]
          - endpoints[POST /procurement/protests/{id}/hearings]
          - entities.ProtestHearing.fields.scheduled_start_utc
