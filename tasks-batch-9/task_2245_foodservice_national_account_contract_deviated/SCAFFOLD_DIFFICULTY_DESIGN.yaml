              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/sign"
              payload: {}
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { ct_ver1: $.data.version }
            - call: "POST /nac/deviation-agreements"
              payload: { contract_id: "${ct_id}", product_id: "${prod_id}", manufacturer_id: "${nwb_id}", bill_back_basis: "FIXED_NET_PRICE", requested_net_price_cents: 5800, max_operator_price_cents: 6200, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", expected_contract_version: "${ct_ver1}" }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { dev_first_id: $.data.id }
            - call: "GET /nac/contracts/${ct_id}"
              payload: {}
              as: PricingAnalyst
              captures: { ct_ver2: $.data.version }
          trigger:
            - call: "POST /nac/deviation-agreements"
              payload: { contract_id: "${ct_id}", product_id: "${prod_id}", manufacturer_id: "${cpc_id}", bill_back_basis: "FIXED_NET_PRICE", requested_net_price_cents: 5800, max_operator_price_cents: 6200, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", expected_contract_version: "${ct_ver2}" }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /nac/deviation-agreements"
              payload: { contract_id: "${ct_id}", product_id: "${prod_id}", manufacturer_id: "${nwb_id}", bill_back_basis: "FIXED_NET_PRICE", requested_net_price_cents: 5800, max_operator_price_cents: 6200, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", expected_contract_version: "${ct_ver2}" }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { err_id_lower: $.data.error_id }
          assert:
            - "DeviationAgreement.${dev_first_id}.status == DRAFT"
            - "DeviationAgreement.${dev_first_id}.manufacturer_id == ${nwb_id}"
            - "the first trigger call returns HTTP 422 and ${err_id} == ERR_DEVIATION_MANUFACTURER_MISMATCH"
            - "${err_id} != ERR_DEVIATION_PERIOD_OVERLAP"
            - "the second trigger call returns HTTP 409 and ${err_id_lower} == ERR_DEVIATION_PERIOD_OVERLAP, proving priority 18 was also violated by the first call"
            - "GET /nac/deviation-agreements?contract_id=${ct_id} returns exactly 1 row"

  # ===========================================================================
  # Rule 6 — Boundary and precision checks on different metrics and endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: compliance_pct_exactly_95_selects_top_rebate_band
        grounds:
          - calculations.rebate_accrual_split
          - calculations.contracted_purchase_compliance_pct
          - entities.RebatePeriod.fields.rebate_rate_pct
          - entities.ContractTier.fields.counts_as_contracted
          - endpoints["POST /nac/rebate-periods/{rebate_period_id}/close"]
        distinguishing_aspect: |
          Metric: RebatePeriod.compliance_pct at the inclusive 95.00 rate-band
          boundary, reached through POST /nac/rebate-periods/{id}/close. A contract
          landing on exactly 95.00 takes rebate_rate_pct 4.00 while an otherwise
          identical contract at 94.00 takes 3.00, so an exclusive comparison would
          under-accrue the boundary contract by 4900 cents.
        test_recipe:
          setup:
            - "Operator BND, manufacturer SNF, DC-PHX, two products priced to exactly 5000 per case: P-BOUND (PROTEIN, avg_cost_cents 4850) and P-CUP-BIG (DISPOSABLES, avg_cost_cents 4850)."
            - "Two DOLLAR_WEIGHTED contracts, each with an unbounded PROTEIN AVG_COST DOLLARS_PER_CASE 150 tier with counts_as_contracted true, an unbounded DISPOSABLES AVG_COST DOLLARS_PER_CASE 150 tier with counts_as_contracted false, and an IN_MARKET coverage so no service fee ever applies."
            - "Contract BND-95 receives a 95-case contracted line (475000) and a 5-case non-contracted line (25000); contract BND-94 receives 94 cases (470000) and 6 cases (30000). Both gross to exactly 500000."
            - "Each contract has one rebate period 2026-08-01 .. 2026-09-01; the clock is advanced to 2026-09-01 before closing."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Boundary Dining Group", operator_code: "BND" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Sonoran Foods", manufacturer_code: "SNF" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
            - call: "POST /nac/distribution-centers"
              payload: { dc_code: "DC-PHX", name: "Phoenix DC", in_market_state_codes: ["AZ"], out_of_market_fee_per_case_cents: 275 }
              as: SystemAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "P-BOUND", description: "Beef Patty 4/10#", product_class_code: "PROTEIN", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 4900, avg_cost_cents: 4850, replacement_cost_cents: 4950 }
              as: SystemAdmin
              captures: { beef_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "P-CUP-BIG", description: "32oz Cups 500ct", product_class_code: "DISPOSABLES", manufacturer_id: "${mfg_id}", pack_size: 1, last_cost_cents: 4900, avg_cost_cents: 4850, replacement_cost_cents: 4950 }
              as: SystemAdmin
              captures: { cup_id: $.data.id }
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "BND-95", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z", compliance_basis: "DOLLAR_WEIGHTED" }
              as: NationalAccountManager
              captures: { c95_id: $.data.id }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${c95_id}", product_class_code: "PROTEIN", cost_basis: "AVG_COST", markup_type: "DOLLARS_PER_CASE", markup_value: 150, min_case_volume: 0, counts_as_contracted: true }
              as: NationalAccountManager
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${c95_id}", product_class_code: "DISPOSABLES", cost_basis: "AVG_COST", markup_type: "DOLLARS_PER_CASE", markup_value: 150, min_case_volume: 0, counts_as_contracted: false }
              as: NationalAccountManager
            - call: "POST /nac/dc-coverages"
              payload: { contract_id: "${c95_id}", distribution_center_id: "${dc_id}", coverage_type: "IN_MARKET", coverage_from: "2026-08-01T00:00:00Z", coverage_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
            - call: "POST /nac/contracts/${c95_id}/submit-for-signature"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/contracts/${c95_id}/sign"
              payload: {}
              as: OperatorBuyer
              as_user_id: "${op_id}"
            - call: "POST /nac/rebate-periods"
              payload: { contract_id: "${c95_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: RebateAccountant
              captures: { rp95_id: $.data.id }
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "BND-94", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z", compliance_basis: "DOLLAR_WEIGHTED" }
              as: NationalAccountManager
