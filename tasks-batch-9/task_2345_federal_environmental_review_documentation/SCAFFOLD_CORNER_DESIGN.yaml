      - name: corner_consultation_requirement_set_derived_from_action_flags
        claim_type: correct_result
        grounds: [calculations.consultation_requirement_set, entities.ConsultationRequest.fields.is_required]
        distinguishing_aspect: "is_required is a function of the action's four flags, not of the agency: on an action with all flags true the ESA, NHPA and CWA requests are all required while COOPERATING_AGENCY is never required, and each statutory_due_at is requested_start_at plus the agency's 135 days."
        test_recipe:
          setup:
            - "ReviewOffice ERO-1 exists and Agency EPA has statutory_response_days 135, handoff_buffer_days 3 and max_concurrent_consultations 5."
            - "An action with in_critical_habitat, affects_historic_property, tribal_interest and floodplain_or_wetland all true is CLASSIFIED as ENVIRONMENTAL_ASSESSMENT."
          setup_api_calls:
            - *k_office
            - call: "POST /proposed-actions"
              payload: { office_id: "${off_id}", title: "River Crossing Replacement", disturbance_hectares: 40.0, reference_cost_cents: 10000000, in_critical_habitat: true, affects_historic_property: true, tribal_interest: true, floodplain_or_wetland: true }
              as: NepaCoordinator
              captures: { act_all_id: $.data.id }
            - call: "POST /proposed-actions/${act_all_id}/ec-screens"
              payload:
                findings:
                  - { code: "EC_HISTORIC", present: true, severity: 2, narrative: "Bridge abutment is a contributing element" }
                  - { code: "EC_ENDANGERED_SPECIES", present: true, severity: 2, narrative: "Designated critical habitat downstream" }
                  - { code: "EC_WETLAND", present: true, severity: 2, narrative: "Fringe wetland at the north abutment" }
              as: NepaCoordinator
              captures: { scr_all_id: $.data.id }
            - call: "POST /ec-screens/${scr_all_id}/adjudicate"
              payload: { disposition: "CLEARED", adjudicator_note: "No finding reaches the severity trigger of 3" }
              as: ReviewingOfficial
            - call: "POST /proposed-actions/${act_all_id}/classify"
              payload: {}
              as: NepaCoordinator
            - call: "POST /agencies"
              payload: { agency_code: "EPA", name: "Environmental Protection Agency", agency_role: "BOTH", max_concurrent_consultations: 5, handoff_buffer_days: 3, statutory_response_days: 135, status: "ACTIVE" }
              as: PolicyAdmin
              captures: { epa_id: $.data.id }
          trigger:
            - call: "POST /consultations"
              payload: { action_id: "${act_all_id}", agency_id: "${epa_id}", consultation_type: "ESA_SECTION_7", requested_start_at: "2026-08-05T00:00:00Z" }
              as: NepaCoordinator
              captures: { req_esa_id: $.data.id }
            - call: "POST /consultations"
              payload: { action_id: "${act_all_id}", agency_id: "${epa_id}", consultation_type: "NHPA_SECTION_106", requested_start_at: "2026-08-05T00:00:00Z" }
              as: NepaCoordinator
              captures: { req_nhpa_id: $.data.id }
            - call: "POST /consultations"
              payload: { action_id: "${act_all_id}", agency_id: "${epa_id}", consultation_type: "CWA_SECTION_404", requested_start_at: "2026-08-05T00:00:00Z" }
              as: NepaCoordinator
              captures: { req_cwa_id: $.data.id }
            - call: "POST /consultations"
              payload: { action_id: "${act_all_id}", agency_id: "${epa_id}", consultation_type: "COOPERATING_AGENCY", requested_start_at: "2026-08-05T00:00:00Z" }
              as: NepaCoordinator
              captures: { req_coop_id: $.data.id }
          assert:
            - "ConsultationRequest.${req_esa_id}.is_required == true"
            - "ConsultationRequest.${req_nhpa_id}.is_required == true"
            - "ConsultationRequest.${req_cwa_id}.is_required == true"
            - "ConsultationRequest.${req_coop_id}.is_required == false"
            - "All four rows have statutory_due_at == 2026-12-18T00:00:00Z and status == PENDING"
            - "Agency.${epa_id}.active_consultation_count == 4 and no capacity error is raised because max_concurrent_consultations is 5"

