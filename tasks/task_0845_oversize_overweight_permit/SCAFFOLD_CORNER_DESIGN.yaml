scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: create_carrier_success
        claim_type: Creation
        grounds:
          - entities.Carrier
        distinguishing_aspect: "POST /carriers with legal_name + usdot_number returns 201 with a server-minted id, version 1, escrow_balance_cents 0, compliance_standing GOOD_STANDING."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /carriers"
              payload: { legal_name: "Fresh Carrier", usdot_number: "USDOT-C1" }
              as: DOTAdmin
              captures: { cid: $.data.id, ver: $.data.version, esc: $.data.escrow_balance_cents, stand: $.data.compliance_standing }
          assert:
            - "response HTTP status == 201"
            - "Carrier.${cid}.version == 1"
            - "Carrier.${cid}.escrow_balance_cents == 0"
            - "Carrier.${cid}.compliance_standing == GOOD_STANDING"

      - name: create_permit_default_overhang_applied
        claim_type: Defaults
        grounds:
          - entities.Permit.fields.front_overhang_in
          - entities.Permit.fields.rear_overhang_in
        distinguishing_aspect: "Omitting front_overhang_in/rear_overhang_in applies default 0."
        test_recipe:
          setup: ["A carrier exists."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Def Carrier", usdot_number: "USDOT-C2" }
              as: DOTAdmin
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /permits"
              payload: { carrier_id: "${cid}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, gross_weight_lbs: 120000, num_axles: 9, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${cid}"
              captures: { pid: $.data.id, fo: $.data.front_overhang_in }
          assert:
            - "Permit.${pid}.front_overhang_in == 0"
            - "Permit.${pid}.rear_overhang_in == 0"

      - name: permit_system_fields_on_create
        claim_type: System Fields
        grounds:
          - entities.Permit.fields.status
        distinguishing_aspect: "A newly created Permit has status DRAFT, version 1, and a server-minted id regardless of input."
        test_recipe:
          setup: ["A carrier exists."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Sys Carrier", usdot_number: "USDOT-C3" }
              as: DOTAdmin
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /permits"
              payload: { carrier_id: "${cid}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, gross_weight_lbs: 120000, num_axles: 9, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${cid}"
              captures: { pid: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "Permit.${pid}.status == DRAFT"
            - "Permit.${pid}.version == 1"

      - name: error_missing_required_field_on_create_permit
        claim_type: Required Fields
        grounds:
          - entities.Permit.fields.gross_weight_lbs
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Creating a permit without gross_weight_lbs returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A carrier exists."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Miss Carrier", usdot_number: "USDOT-C4" }
              as: DOTAdmin
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /permits"
              payload: { carrier_id: "${cid}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, num_axles: 9, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "response HTTP status == 400"

      - name: error_invalid_enum_permit_type_on_create
        claim_type: Type Constraints
        grounds:
          - entities.Permit.fields.permit_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "permit_type outside {SINGLE_TRIP, ANNUAL} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A carrier exists."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Enum Carrier", usdot_number: "USDOT-C5" }
              as: DOTAdmin
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /permits"
              payload: { carrier_id: "${cid}", permit_type: "WEEKLY", length_in: 900, width_in: 100, height_in: 100, gross_weight_lbs: 120000, num_axles: 9, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: travel_restriction_immutable_no_version
        claim_type: Immutability
        grounds:
          - entities.TravelRestriction
        distinguishing_aspect: "TravelRestriction has common_fields false: it carries id + created_at only, no version field and no update endpoint."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /travel-restrictions"
              payload: { restriction_type: "CURFEW", start_utc: "2026-06-05T07:00:00Z", end_utc: "2026-06-05T09:00:00Z", applies_to_classification: "ALL" }
              as: DOTAdmin
              captures: { rid: $.data.id }
          assert:
            - "response HTTP status == 201"
            - "TravelRestriction.${rid} has no version field (no PATCH/PUT endpoint exists for it)"

      - name: error_permit_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_PERMIT_NOT_FOUND]
        distinguishing_aspect: "GET a non-existent permit id returns ERR_PERMIT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /permits/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PermitOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PERMIT_NOT_FOUND"
            - "response HTTP status == 404"

      - name: error_carrier_not_found_on_create_permit
        claim_type: Parent Relationships
        grounds:
          - entities.Permit.fields.carrier_id
          - errors[ERR_CARRIER_NOT_FOUND]
        distinguishing_aspect: "Creating a permit with a non-existent carrier_id returns ERR_CARRIER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /permits"
              payload: { carrier_id: "00000000-0000-4000-8000-000000000001", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, gross_weight_lbs: 120000, num_axles: 9, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CARRIER_NOT_FOUND"

      - name: error_structure_not_found_on_route_segment
        claim_type: Parent Relationships
        grounds:
          - entities.RouteSegment.fields.structure_id
          - errors[ERR_STRUCTURE_NOT_FOUND]
        distinguishing_aspect: "Adding a route segment referencing a non-existent structure_id returns ERR_STRUCTURE_NOT_FOUND (404)."
        test_recipe:
          setup: ["A carrier and a DRAFT permit."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "FK Carrier", usdot_number: "USDOT-C6" }
              as: DOTAdmin
              captures: { cid: $.data.id }
            - call: "POST /permits"
              payload: { carrier_id: "${cid}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, gross_weight_lbs: 120000, num_axles: 9, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${cid}"
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /permits/${pid}/route-segments"
              payload: { sequence_index: 1, highway_id: "I-80", from_milepost: 0, to_milepost: 10, structure_id: "00000000-0000-4000-8000-000000000009", planned_cross_start_utc: "2026-06-05T10:00:00Z", planned_cross_end_utc: "2026-06-05T10:30:00Z" }
              as: Carrier
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STRUCTURE_NOT_FOUND"

      - name: structure_computed_available_and_posture
        claim_type: Computed Fields
        grounds:
          - entities.Structure.fields.available_tonnage
          - entities.Structure.fields.posture
        distinguishing_aspect: "A fresh structure (rated 200) reports committed_tonnage 0, available_tonnage 200, posture OPEN."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /structures"
              payload: { name: "Span Fresh", highway_id: "I-80", milepost: 5, rated_capacity_tonnage: 200, dead_load_tonnage: 40 }
              as: DOTAdmin
              captures: { sid: $.data.id }
          trigger:
            - call: "GET /structures/${sid}"
              payload: {}
              as: DOTAdmin
              captures: { avail: $.data.available_tonnage, post: $.data.posture }
          assert:
            - "Structure.${sid}.committed_tonnage == 0"
            - "Structure.${sid}.available_tonnage == 200"
            - "Structure.${sid}.posture == OPEN"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: error_approve_from_draft_invalid_transition
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Permit
          - errors[ERR_INVALID_PERMIT_STATE]
        distinguishing_aspect: "Approving a DRAFT permit (never submitted/reviewed) returns ERR_INVALID_PERMIT_STATE (409)."
        test_recipe:
          setup: ["A carrier and a DRAFT permit."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "SM Carrier", usdot_number: "USDOT-S1" }
              as: DOTAdmin
              captures: { cid: $.data.id }
            - call: "POST /permits"
              payload: { carrier_id: "${cid}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, gross_weight_lbs: 120000, num_axles: 9, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${cid}"
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /permits/${pid}/approve"
              payload: {}
              as: PermitOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_PERMIT_STATE"

      - name: error_submit_from_rejected_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Permit.UNDER_STANDARD_REVIEW_to_REJECTED
          - errors[ERR_INVALID_PERMIT_STATE]
        distinguishing_aspect: "A REJECTED permit is terminal: re-submitting it returns ERR_INVALID_PERMIT_STATE."
        test_recipe:
          setup: ["An OVERWEIGHT permit taken to REJECTED via begin-review + reject."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Term Carrier", usdot_number: "USDOT-S2" }
              as: DOTAdmin
              captures: { cid: $.data.id }
            - call: "POST /permits"
              payload: { carrier_id: "${cid}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, gross_weight_lbs: 120000, num_axles: 9, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${cid}"
              captures: { pid: $.data.id }
            - call: "POST /permits/${pid}/route-segments"
              payload: { sequence_index: 1, highway_id: "I-80", from_milepost: 0, to_milepost: 10 }
              as: Carrier
              as_user_id: "${cid}"
            - call: "POST /permits/${pid}/submit"
              payload: {}
              as: Carrier
              as_user_id: "${cid}"
            - call: "POST /permits/${pid}/begin-review"
              payload: {}
              as: PermitOfficer
            - call: "POST /permits/${pid}/reject"
              payload: { reason: "unsafe" }
              as: PermitOfficer
          trigger:
            - call: "POST /permits/${pid}/submit"
              payload: {}
              as: Carrier
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_PERMIT_STATE"

      - name: error_double_submit_idempotency
        claim_type: Idempotency
        grounds:
          - state_machines.Permit.DRAFT_to_SUBMITTED
          - errors[ERR_INVALID_PERMIT_STATE]
        distinguishing_aspect: "Submitting an already-SUBMITTED permit again returns ERR_INVALID_PERMIT_STATE (submit is defined only from DRAFT/RETURNED_FOR_CORRECTION)."
        test_recipe:
          setup: ["A SUBMITTED OVERWEIGHT permit."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Idem Carrier", usdot_number: "USDOT-S3" }
              as: DOTAdmin
              captures: { cid: $.data.id }
            - call: "POST /permits"
              payload: { carrier_id: "${cid}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, gross_weight_lbs: 120000, num_axles: 9, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${cid}"
              captures: { pid: $.data.id }
            - call: "POST /permits/${pid}/route-segments"
              payload: { sequence_index: 1, highway_id: "I-80", from_milepost: 0, to_milepost: 10 }
              as: Carrier
              as_user_id: "${cid}"
            - call: "POST /permits/${pid}/submit"
              payload: {}
              as: Carrier
              as_user_id: "${cid}"
          trigger:
            - call: "POST /permits/${pid}/submit"
              payload: {}
              as: Carrier
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_PERMIT_STATE"

      - name: error_accept_conditions_on_requested_analysis
        claim_type: Invalid Transitions
        grounds:
          - state_machines.BridgeAnalysis.CONDITIONAL_to_CLEARED
          - errors[ERR_INVALID_ANALYSIS_STATE]
        distinguishing_aspect: "accept-conditions on a REQUESTED (not CONDITIONAL) analysis returns ERR_INVALID_ANALYSIS_STATE."
        test_recipe:
          setup: ["An OVERWEIGHT permit crossing a structure, submitted (analysis REQUESTED)."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "BA Carrier", usdot_number: "USDOT-S4" }
              as: DOTAdmin
              captures: { cid: $.data.id }
            - call: "POST /structures"
              payload: { name: "Span S4", highway_id: "I-80", milepost: 5, rated_capacity_tonnage: 200, dead_load_tonnage: 40 }
              as: DOTAdmin
              captures: { sid: $.data.id }
            - call: "POST /permits"
              payload: { carrier_id: "${cid}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, gross_weight_lbs: 120000, num_axles: 9, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${cid}"
              captures: { pid: $.data.id }
            - call: "POST /permits/${pid}/route-segments"
              payload: { sequence_index: 1, highway_id: "I-80", from_milepost: 0, to_milepost: 10, structure_id: "${sid}", planned_cross_start_utc: "2026-06-05T10:00:00Z", planned_cross_end_utc: "2026-06-05T10:30:00Z" }
              as: Carrier
              as_user_id: "${cid}"
            - call: "POST /permits/${pid}/submit"
              payload: {}
              as: Carrier
              as_user_id: "${cid}"
            - call: "GET /bridge-analyses?permit_id=${pid}"
              payload: {}
              as: Carrier
              as_user_id: "${cid}"
              captures: { ba_id: "$.data[0].id"}
          trigger:
            - call: "POST /bridge-analyses/${ba_id}/accept-conditions"
              payload: {}
              as: Carrier
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_ANALYSIS_STATE"

      - name: error_contest_upheld_violation
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Violation.OPEN_to_UPHELD
          - errors[ERR_INVALID_VIOLATION_STATE]
        distinguishing_aspect: "Contesting an already-UPHELD violation returns ERR_INVALID_VIOLATION_STATE."
        test_recipe:
          setup: ["A MINOR violation on a DRAFT permit, upheld."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "V Carrier", usdot_number: "USDOT-S5" }
              as: DOTAdmin
              captures: { cid: $.data.id }
            - call: "POST /permits"
              payload: { carrier_id: "${cid}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, gross_weight_lbs: 120000, num_axles: 9, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${cid}"
              captures: { pid: $.data.id }
            - call: "POST /violations"
              payload: { permit_id: "${pid}", violation_type: "OVER_DIMENSION", severity: "MINOR" }
              as: EnforcementOfficer
              captures: { vid: $.data.id }
            - call: "POST /violations/${vid}/uphold"
              payload: {}
              as: EnforcementOfficer
          trigger:
            - call: "POST /violations/${vid}/contest"
              payload: {}
              as: Carrier
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_VIOLATION_STATE"

      - name: violation_dismiss_reinstates_suspended_permit
        claim_type: Compensation
        grounds:
          - state_machines.Permit.ISSUED_to_SUSPENDED
          - state_machines.Permit.SUSPENDED_to_ISSUED
          - state_machines.Violation.OPEN_to_DISMISSED
        distinguishing_aspect: "A MAJOR violation suspends an ISSUED permit; dismissing it (no other open violations) reinstates it to ISSUED — the ISSUED<->SUSPENDED cycle."
        test_recipe:
          setup: ["An OVERWEIGHT permit (gross 120000, no-structure segment) driven to ISSUED, then a MAJOR OFF_SCHEDULE violation cited (permit SUSPENDED)."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Reinstate Co", usdot_number: "USDOT-S6" }
              as: DOTAdmin
              captures: { cid: $.data.id }
            - call: "POST /permits"
              payload: { carrier_id: "${cid}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, gross_weight_lbs: 120000, num_axles: 9, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${cid}"
              captures: { pid: $.data.id }
            - call: "POST /permits/${pid}/route-segments"
              payload: { sequence_index: 1, highway_id: "I-80", from_milepost: 0, to_milepost: 10 }
              as: Carrier
              as_user_id: "${cid}"
            - call: "POST /permits/${pid}/submit"
              payload: {}
              as: Carrier
              as_user_id: "${cid}"
            - call: "POST /permits/${pid}/begin-review"
              payload: {}
              as: PermitOfficer
            - call: "POST /permits/${pid}/approve"
              payload: {}
              as: PermitOfficer
            - call: "POST /permits/${pid}/issue"
              payload: {}
              as: PermitOfficer
            - call: "POST /violations"
              payload: { permit_id: "${pid}", violation_type: "OFF_SCHEDULE", severity: "MAJOR" }
              as: EnforcementOfficer
              captures: { vid: $.data.id }
          trigger:
            - call: "POST /violations/${vid}/dismiss"
              payload: {}
              as: EnforcementOfficer
              captures: { vst: $.data.status }
          assert:
            - "Violation.${vid}.status == DISMISSED"
            - "Permit.${pid}.status == ISSUED (reinstated)"

  # ===========================================================================
  - section: calculations
    instances:
      - name: superload_bond_amount_and_reverse_lookup
        claim_type: Constants Applied
        grounds:
          - calculations.compute_bond_amount
          - entities.Bond.fields.amount_cents
        distinguishing_aspect: "Submitting a SUPERLOAD permit (gross 210000) creates a Bond(DRAFT) with amount 6000000 (5000000 base + 10 klb * 100000), discoverable via GET /bonds?permit_id."
        test_recipe:
          setup: ["A SUPERLOAD permit (gross 210000) with a no-structure segment, submitted."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Bond Carrier", usdot_number: "USDOT-K1" }
              as: DOTAdmin
              captures: { cid: $.data.id }
            - call: "POST /permits"
              payload: { carrier_id: "${cid}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, gross_weight_lbs: 210000, num_axles: 13, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${cid}"
              captures: { pid: $.data.id }
            - call: "POST /permits/${pid}/route-segments"
              payload: { sequence_index: 1, highway_id: "I-80", from_milepost: 0, to_milepost: 10 }
              as: Carrier
              as_user_id: "${cid}"
            - call: "POST /permits/${pid}/submit"
              payload: {}
              as: Carrier
              as_user_id: "${cid}"
          trigger:
            - call: "GET /bonds?permit_id=${pid}"
              payload: {}
              as: Carrier
              as_user_id: "${cid}"
              captures: { amt: "$.data[0].amount_cents", st: "$.data[0].status"}
          assert:
            - "Bond for ${pid}: amount_cents == 6000000"
            - "Bond for ${pid}: status == DRAFT"

      - name: violation_penalty_repeat_multiplier
        claim_type: Correct Result
        grounds:
          - calculations.compute_violation_penalty
          - entities.Violation.fields.penalty_cents
        distinguishing_aspect: "With one prior UPHELD violation, a second OVER_DIMENSION MAJOR penalty is 100000*2*(1+0.5*1) = 300000 (vs 200000 for the first)."
        test_recipe:
          setup: ["A carrier with one UPHELD OVER_DIMENSION MAJOR violation (penalty 200000) on a DRAFT permit."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Repeat Carrier", usdot_number: "USDOT-K2" }
              as: DOTAdmin
              captures: { cid: $.data.id }
            - call: "POST /permits"
              payload: { carrier_id: "${cid}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, gross_weight_lbs: 120000, num_axles: 9, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${cid}"
              captures: { pid: $.data.id }
            - call: "POST /violations"
