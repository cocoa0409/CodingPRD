            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_b}", share_pct: 50.00, expected_formulation_version: "${f1v2}" }
              as: BodyEngineer
            - call: "POST /formulations/${f1}/qualify"
              payload: {}
              as: BodyEngineer
            - call: "POST /plants/${p1}/kilns"
              payload: { kiln_code: "K1", position_count: 5, setpoint_peak_c: 1050, cooldown_buffer_hours: 6.0 }
