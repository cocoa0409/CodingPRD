              as: ComplianceEngineer
          assert:
            - "the 1200 C furnace returns 400 with error_id == 'ERR_INVALID_REQUEST'"
            - "the 650 C furnace returns 400 with error_id == 'ERR_INVALID_REQUEST'"
            - "the 1000 C furnace returns 201 with max_firing_temp_c == 1000 and occupied_window_count == 0 (the range boundary is inclusive)"
            - "the SOLAR fuel_type returns 400 with error_id == 'ERR_INVALID_REQUEST'"
            - "exactly one Furnace row and zero ProductModel rows exist afterwards"
      - name: lining_inspection_is_immutable_and_has_no_version
        claim_type: immutability
        grounds:
          - entities.LiningInspection
          - entities.LiningInspection.fields.record_status
          - endpoints[GET /mfg/tank-lots/{id}/lining-inspections]
        distinguishing_aspect: >
          LiningInspection is declared `common_fields: false`, so its rows are append-only evidence: they carry
          no version and no updated_at, no endpoint updates them, and a re-inspection is expressed by INSERTING a
          new CURRENT row that supersedes the previous one rather than mutating it. The superseded row must keep
          its original holiday_count and result, which an in-place update would destroy.
        test_recipe:
          setup:
            - "Tank lot TL-001 is LINED with planned_quantity 120, so the required sample size is 6."
            - "One HOLIDAY inspection with 1 holiday in a sample of 6 has already been recorded and passed."
