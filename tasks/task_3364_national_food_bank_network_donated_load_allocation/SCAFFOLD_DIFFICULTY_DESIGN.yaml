            - call: "POST /network/store-programs"
              payload: { member_id: "${m1}", store_name: "Kroger Dublin", store_chain: "Kroger", pickup_frequency: "WEEKLY", expected_weekly_lbs: 1200 }
              as: MemberFoodBank
              as_user_id: "${m1}"
              captures: { prog: $.data.id, prog_status: $.data.program_status }
          trigger:
            - call: "POST /network/store-programs/${prog}/pickups"
              payload: { scheduled_date: "2026-09-10T00:00:00Z", window_start: "2026-09-10T08:00:00Z", window_end: "2026-09-10T12:00:00Z" }
              as: MemberFoodBank
              as_user_id: "${m1}"
              captures: { err: $.data.error_id }
            - call: "POST /network/members/${m1}/certify"
              payload: {}
              as: NetworkAdmin
              captures: { m1_v: $.data.version }
            - call: "POST /network/store-programs/${prog}/pickups"
              payload: { scheduled_date: "2026-09-10T00:00:00Z", window_start: "2026-09-10T08:00:00Z", window_end: "2026-09-10T12:00:00Z" }
              as: MemberFoodBank
              as_user_id: "${m1}"
              captures: { pk: $.data.id, pk_status: $.data.pickup_status }
          assert:
            - "the program was created in PENDING: ${prog_status} == PENDING while the member was PENDING_CERTIFICATION"
            - "the pickup attempt while the member is PENDING returns ${err} == ERR_MEMBER_NOT_CERTIFIED with HTTP 403"
            - "after POST /network/members/${m1}/certify StoreDonationProgram.${prog}.program_status == ACTIVE"
            - "the identical pickup then succeeds with ${pk_status} == SCHEDULED and StorePickup.${pk}.collected_lbs == 0"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: delivery_window_half_open_adjacency_on_member
        grounds:
          - validations[priority=29]
          - state_machines.DonatedLoad.AWARDED_to_IN_TRANSIT
          - errors[ERR_DELIVERY_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics on the DonatedLoad resource: two dispatched loads of the
          same member may touch at an endpoint ([08:00,12:00) and [12:00,14:00) both succeed)
          while a 11:00-13:00 window collides and is rejected with ERR_DELIVERY_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Member M1 is CERTIFIED with a 100000-share grant and two AWARDED loads L11A and L11B, both with freight_decision COVERED and no delivery window yet."
          setup_api_calls:
            - *clk_sep
            - *agr_dry
            - *agr_dry_act
            - &load_l11a
              call: "POST /network/loads"
              payload: { donor_agreement_id: "${agr}", product_category: "DRY_GOODS", storage_type: "DRY", weight_lbs: 30000, lot_code: "LOT-11A", origin_zip: "44101", destination_region: "MIDWEST", distance_miles: 400 }
              as: NetworkAdmin
              captures: { l11a: $.data.id }
            - call: "POST /network/loads/${l11a}/post"
              payload: {}
              as: NetworkAdmin
              captures: { l11a_v: $.data.version }
            - &load_l11b
              call: "POST /network/loads"
              payload: { donor_agreement_id: "${agr}", product_category: "DRY_GOODS", storage_type: "DRY", weight_lbs: 30000, lot_code: "LOT-11B", origin_zip: "44101", destination_region: "MIDWEST", distance_miles: 400 }
              as: NetworkAdmin
              captures: { l11b: $.data.id }
            - call: "POST /network/loads/${l11b}/post"
              payload: {}
              as: NetworkAdmin
              captures: { l11b_v: $.data.version }
            - *mem_m1_certified
            - *audit_m1_pass
            - *audit_m1_done
            - *certify_m1
            - *grant_m1_solo
            - call: "POST /network/loads/${l11a}/bids"
              payload: { member_id: "${m1}", shares_offered: 300, preference_rank: 1, can_self_transport: true, expected_load_version: "${l11a_v}" }
              as: MemberFoodBank
              as_user_id: "${m1}"
            - call: "POST /network/loads/${l11a}/award"
              payload: {}
              as: NetworkAdmin
              captures: { l11a_a: $.data.version }
            - call: "POST /network/loads/${l11a}/freight-decision"
              payload: { decision: "COVERED" }
              as: NetworkAdmin
            - call: "POST /network/loads/${l11b}/bids"
              payload: { member_id: "${m1}", shares_offered: 300, preference_rank: 1, can_self_transport: true, expected_load_version: "${l11b_v}" }
              as: MemberFoodBank
              as_user_id: "${m1}"
            - call: "POST /network/loads/${l11b}/award"
              payload: {}
              as: NetworkAdmin
              captures: { l11b_a: $.data.version }
            - call: "POST /network/loads/${l11b}/freight-decision"
              payload: { decision: "COVERED" }
              as: NetworkAdmin
          trigger:
            - call: "POST /network/loads/${l11a}/dispatch"
              payload: { delivery_window_start: "2026-09-10T08:00:00Z", delivery_window_end: "2026-09-10T12:00:00Z" }
              as: NetworkAdmin
              captures: { l11a_status: $.data.status }
            - call: "POST /network/loads/${l11b}/dispatch"
              payload: { delivery_window_start: "2026-09-10T11:00:00Z", delivery_window_end: "2026-09-10T13:00:00Z" }
              as: NetworkAdmin
              captures: { err: $.data.error_id }
            - call: "POST /network/loads/${l11b}/dispatch"
              payload: { delivery_window_start: "2026-09-10T12:00:00Z", delivery_window_end: "2026-09-10T14:00:00Z" }
              as: NetworkAdmin
              captures: { l11b_status: $.data.status }
          assert:
            - "the first dispatch succeeds with DonatedLoad.${l11a}.status == ${l11a_status} == IN_TRANSIT"
            - "the 11:00-13:00 window collides with the member's [08:00,12:00) window and returns ${err} == ERR_DELIVERY_WINDOW_OVERLAP with HTTP 409"
            - "the touching window [12:00,14:00) is accepted: DonatedLoad.${l11b}.status == ${l11b_status} == IN_TRANSIT"
            - "DonatedLoad.${l11b}.delivery_window_start == \"2026-09-10T12:00:00Z\" (the half-open interval treats the shared endpoint as free)"

      - name: pickup_window_24h_buffer_on_program
        grounds:
          - validations[priority=30]
          - state_machines.StorePickup.NONE_to_SCHEDULED
          - errors[ERR_PICKUP_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Buffer semantics on the StorePickup resource (different resource and different interval
          arithmetic from the delivery rule): a second pickup starting 20 hours after the first
          window ends is rejected, while one starting exactly 24 hours after is accepted.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Member M1 is CERTIFIED, its store program PROG is ACTIVE, and pickup P1 is SCHEDULED for 2026-09-10 08:00-12:00Z."
          setup_api_calls:
            - *clk_sep
            - *mem_m1_certified
            - *audit_m1_pass
            - *audit_m1_done
            - *certify_m1
            - call: "POST /network/store-programs"
              payload: { member_id: "${m1}", store_name: "Kroger Dublin", store_chain: "Kroger", pickup_frequency: "DAILY", expected_weekly_lbs: 1200 }
              as: MemberFoodBank
              as_user_id: "${m1}"
              captures: { prog: $.data.id }
            - call: "POST /network/store-programs/${prog}/pickups"
              payload: { scheduled_date: "2026-09-10T00:00:00Z", window_start: "2026-09-10T08:00:00Z", window_end: "2026-09-10T12:00:00Z" }
              as: MemberFoodBank
              as_user_id: "${m1}"
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /network/store-programs/${prog}/pickups"
              payload: { scheduled_date: "2026-09-11T00:00:00Z", window_start: "2026-09-11T08:00:00Z", window_end: "2026-09-11T12:00:00Z" }
              as: MemberFoodBank
              as_user_id: "${m1}"
              captures: { err: $.data.error_id }
            - call: "POST /network/store-programs/${prog}/pickups"
              payload: { scheduled_date: "2026-09-11T00:00:00Z", window_start: "2026-09-11T12:00:00Z", window_end: "2026-09-11T16:00:00Z" }
              as: MemberFoodBank
              as_user_id: "${m1}"
              captures: { p2: $.data.id, p2_status: $.data.pickup_status }
          assert:
            - "the 08:00 window (20 hours after P1 ends) returns ${err} == ERR_PICKUP_WINDOW_OVERLAP with HTTP 409"
            - "the 12:00 window (exactly 24 hours after P1 ends at 2026-09-10T12:00:00Z) is accepted with ${p2_status} == SCHEDULED"
            - "StorePickup.${p1}.pickup_status is still SCHEDULED and exactly two pickup rows exist for program ${prog}"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: share_balance_conserved_across_award_and_refund
        grounds:
          - calculations.share_balance_recompute
          - state_machines.LoadBid.AWARDED_to_REJECTED
          - state_machines.DonatedLoad.AWARDED_to_BIDDING
          - endpoints.POST_/network/loads/{id}/freight-decision
        distinguishing_aspect: |
          The conserved quantity is share currency: awarding load L12 debits 400 shares and the
          declined-freight compensation refunds exactly 400, so the member's share_balance and the
          ledger sum both return to the pre-award 100000 with zero drift.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Member M1 is CERTIFIED with a 100000-share grant. Load L12 (40000 lbs, 20 miles) is AWARDED to M1 with freight_decision PENDING and M1's 400-share bid AWARDED."
          setup_api_calls:
            - *clk_sep
            - *agr_dry
            - *agr_dry_act
            - &load_l12
              call: "POST /network/loads"
              payload: { donor_agreement_id: "${agr}", product_category: "DRY_GOODS", storage_type: "DRY", weight_lbs: 40000, lot_code: "LOT-12", origin_zip: "44101", destination_region: "MIDWEST", distance_miles: 20 }
              as: NetworkAdmin
              captures: { l12: $.data.id }
            - call: "POST /network/loads/${l12}/post"
              payload: {}
              as: NetworkAdmin
              captures: { l12_v: $.data.version }
            - *mem_m1_certified
            - *audit_m1_pass
            - *audit_m1_done
            - *certify_m1
            - *grant_m1_solo
            - call: "POST /network/loads/${l12}/bids"
              payload: { member_id: "${m1}", shares_offered: 400, preference_rank: 1, can_self_transport: false, expected_load_version: "${l12_v}" }
              as: MemberFoodBank
              as_user_id: "${m1}"
              captures: { bid_12: $.data.id }
            - call: "POST /network/loads/${l12}/award"
              payload: {}
              as: NetworkAdmin
              captures: { l12_a: $.data.version }
          trigger:
            - call: "POST /network/loads/${l12}/freight-decision"
              payload: { decision: "DECLINED" }
              as: NetworkAdmin
              captures: { l12_f: $.data.version }
          assert:
            - "the provisional subsidy for a 20-mile LOCAL member is 2775 cents, below MIN_SUBSIDY_CENTS 5000, so the decision resolves to DECLINED and the load reverts"
            - "MemberFoodBank.${m1}.share_balance == 100000 after the compensation, exactly the pre-award balance"
            - "the ledger holds BID_HOLD -400, BID_RELEASE +400, AWARD_DEBIT -400 and AWARD_REFUND +400, summing to 0 over the award/revert pair"
            - "sum(ShareLedgerEntry.amount) over M1 == MemberFoodBank.${m1}.share_balance == 100000"
            - "DonatedLoad.${l12}.status == BIDDING and LoadBid.${bid_12}.bid_status == REJECTED with rejection_reason FREIGHT_DECLINED"

      - name: agreement_poundage_conserved_across_hold_and_release
        grounds:
          - calculations.recall_hold_selection
          - state_machines.ProductRecall.TRACING_to_RESOLVED
          - state_machines.DonatedLoad.HELD_to_CLEAR
          - entities.ProductRecall.fields.held_lbs
        distinguishing_aspect: |
          The conserved quantity is pounds (not shares): the trace moves 1300 lbs into held_lbs and
          the resolve moves them back out, while the agreement's received poundage — sum of
          weight_lbs over its non-CANCELLED loads — stays 1300 before, during and after.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Agreement AGR13 is ACTIVE with load R1 (800 lbs, lot LOT-77, BIDDING) and load R2 (500 lbs, lot LOT-77, POSTED)."
          setup_api_calls:
            - *clk_sep
            - &agr_pounds
              call: "POST /network/donor-agreements"
              payload: { donor_name: "Valley Protein Partners", donor_type: "DISTRIBUTOR", product_category: "FROZEN_PROTEIN", committed_lbs: 400000, freight_subsidy_pool_cents: 150000 }
              as: NetworkAdmin
              captures: { agr13: $.data.id }
            - call: "POST /network/donor-agreements/${agr13}/activate"
              payload: {}
              as: NetworkAdmin
            - &load_p800
              call: "POST /network/loads"
              payload: { donor_agreement_id: "${agr13}", product_category: "FROZEN_PROTEIN", storage_type: "FROZEN", weight_lbs: 800, lot_code: "LOT-77", origin_zip: "68102", destination_region: "MIDWEST", distance_miles: 260 }
              as: NetworkAdmin
              captures: { p800: $.data.id }
            - call: "POST /network/loads/${p800}/post"
              payload: {}
              as: NetworkAdmin
            - &load_p500
              call: "POST /network/loads"
              payload: { donor_agreement_id: "${agr13}", product_category: "FROZEN_PROTEIN", storage_type: "FROZEN", weight_lbs: 500, lot_code: "LOT-77", origin_zip: "68102", destination_region: "MIDWEST", distance_miles: 260 }
              as: NetworkAdmin
              captures: { p500: $.data.id }
          trigger:
            - call: "POST /network/recalls"
              payload: { donor_agreement_id: "${agr13}", lot_code: "LOT-77", product_category: "FROZEN_PROTEIN", affected_lbs: 1300 }
              as: NetworkAdmin
              captures: { rc13: $.data.id }
            - call: "POST /network/recalls/${rc13}/trace"
              payload: {}
              as: NetworkAdmin
              captures: { held_mid: $.data.held_lbs, traced_mid: $.data.traced_load_count }
            - call: "POST /network/recalls/${rc13}/resolve"
              payload: {}
              as: NetworkAdmin
              captures: { held_end: $.data.held_lbs, rc_status: $.data.recall_status }
          assert:
            - "after the trace ProductRecall.${rc13}.held_lbs == ${held_mid} == 1300 and traced_load_count == ${traced_mid} == 2"
            - "DonatedLoad.${p800}.safety_status == HELD and DonatedLoad.${p500}.safety_status == HELD after the trace"
            - "after the resolve ProductRecall.${rc13}.held_lbs == ${held_end} == 0 and recall_status == ${rc_status} == RESOLVED"
            - "DonatedLoad.${p800}.safety_status == CLEAR and DonatedLoad.${p500}.safety_status == CLEAR"
            - "the agreement's received poundage (sum of weight_lbs over non-CANCELLED loads) is 1300 both before the trace and after the resolve — the hold/release pair conserves pounds"
