      - name: quota_available_tons_exact_equality_admits_dispatch_but_one_hundredth_more_fails
        grounds:
          - calculations.mill_contract_quota_position
          - validations[priority=90]
          - errors[ERR_QUOTA_EXCEEDED]
          - entities.MillContract.fields.available_tons
          - state_machines.MillContract.OPEN_to_FILLED
        distinguishing_aspect: |
          Boundary metric: quota tons on POST /loads. With available_tons at exactly 10.00,
          10.01 tons is refused and 10.00 tons is admitted, driving available_tons to exactly
          0.00 and the contract to FILLED - the >= versus > distinction on a decimal tonnage.
        test_recipe:
          setup:
            - "MillContract A has quota_tons 30.00 and overrun_tolerance_pct 0.05"
            - "Load 1 of 20.00 estimated tons is already DISPATCHED, leaving reserved_tons 20.00 and available_tons exactly 10.00 with the contract still OPEN"
            - "Both trigger dispatches use haul intervals on later days so the closed truck-interval rule never fires"
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Cascade Mill A", state_code: "OR", receiving_status: "OPEN" }
