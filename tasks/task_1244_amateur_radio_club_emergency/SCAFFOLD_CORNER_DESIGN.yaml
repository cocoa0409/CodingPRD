        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: the return response itself carries status RETURNED and the computed late_fee_cents (200 for DAMAGED, not overdue, value 2000) with no re-read delay."
        test_recipe:
          setup: ["ACTIVE member with an ACTIVE loan (item HT-6, value 2000, due 2026-06-01)"]
          setup_api_calls:
            - call: "POST /members"
              payload: { callsign: "K1OPR", full_name: "Operator", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { m: $.data.id }
            - call: "POST /members/${m}/renew"
              payload: { periods: 1 }
              as: ClubAdmin
            - call: "POST /equipment-loans"
              payload: { item_tag: "HT-6", due_at: "2026-06-01T00:00:00Z", estimated_value_cents: 2000 }
              as: Member
              as_user_id: "${m}"
              captures: { loan: $.data.id }
          trigger:
            - call: "POST /equipment-loans/${loan}/return"
