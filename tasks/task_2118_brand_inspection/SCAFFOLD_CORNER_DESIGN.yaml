  # ===========================================================================
  - section: errors
    instances:
      - name: corner_duplicate_badge_number_rejected
        claim_type: Violation to Error
        grounds: ['errors[ERR_DUPLICATE_BADGE_NUMBER]', 'validations[priority=72]']
        distinguishing_aspect: "Inspector.badge_number is unique across all rows, so commissioning a second inspector with badge DUP-01 returns 409 ERR_DUPLICATE_BADGE_NUMBER."
        test_recipe:
          setup: ["One district with one inspector already commissioned as badge DUP-01."]
          setup_api_calls:
            - call: "POST /brand-inspection/territories"
              payload: { territory_code: "T-BADGE", state_code: "MT", travel_surcharge_cents: 2500, impound_capacity_head: 100 }
              as: BoardAdmin
              captures: { terr_b: "$.data.id" }
            - call: "POST /brand-inspection/inspectors"
              payload: { badge_number: "DUP-01", home_territory_id: "${terr_b}", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: BoardAdmin
              captures: { insp_1: "$.data.id" }
          trigger:
            - call: "POST /brand-inspection/inspectors"
              payload: { badge_number: "DUP-01", home_territory_id: "${terr_b}", certification_expires_on: "2028-12-31T00:00:00Z" }
              as: BoardAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 409 and ${err_id} == ERR_DUPLICATE_BADGE_NUMBER"
            - "GET /brand-inspection/inspectors?home_territory_id=${terr_b} returns total_count 1"

      - name: corner_duplicate_territory_code_rejected
        claim_type: Violation to Error
        grounds: ['errors[ERR_DUPLICATE_TERRITORY_CODE]', 'validations[priority=72]']
        distinguishing_aspect: "Territory.territory_code is unique, so a second district coded T-TWICE returns 409 ERR_DUPLICATE_TERRITORY_CODE even with a different state_code."
        test_recipe:
          setup: ["One district already coded T-TWICE in state MT."]
          setup_api_calls:
            - call: "POST /brand-inspection/territories"
              payload: { territory_code: "T-TWICE", state_code: "MT", travel_surcharge_cents: 2500, impound_capacity_head: 100 }
              as: BoardAdmin
              captures: { terr_1: "$.data.id" }
