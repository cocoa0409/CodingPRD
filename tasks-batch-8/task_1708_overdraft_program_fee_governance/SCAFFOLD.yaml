# =============================================================================
# Task 1708 — Overdraft Program & Fee Governance (retail bank deposit products)
# Seed tables: §1.0–§1.7 (difficulty design §1.8 and corner design §1.9 live in
# sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml).
# =============================================================================

scenario: |
  Overdraft Program & Fee Governance (retail bank deposit products): opt-in
  status for one-time debit transactions & documentation, transaction posting
  order & impact on fee count, daily fee cap & de minimis threshold, sustained
  overdraft & account closure timeline, fee waiver/refund authority levels,
  program change communication & disclosure requirement, revenue reporting &
  regulatory scrutiny metrics, customer education & alternative product steering

domain_name: overdraft-fee-governance
api_prefix: /v1

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency        # OCC on Program.version / Account.version for create-with-supersede
    - cascading_side_effects        # settle sweep: fees -> balance -> day-count -> restrict -> steering offer
    - dual_variant_calculation      # posting-order variants; provisional vs settled revenue basis
    - rate_threshold_triggers       # daily caps, sustained-day threshold, steering fee-count window
  entity_topology: flat             # peer resources linked by FKs in request bodies
  state_machine_shape: cyclic       # OPTED_IN<->REVOKED, ACTIVE<->RESTRICTED, ACTIVE<->SUSPENDED, deny->appeal loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties # waiver requester != approver; report finalizer != submitter; notice issuer != activator
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: OverdraftProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: fee_amount_cents, type: integer, source: input, description: "Per-item overdraft fee; > 0" }
      - { name: daily_fee_cap_cents, type: integer, source: input, description: "Max total overdraft fee cents per account per business-date batch; a fee is assessed only while fees_cents_so_far + fee_amount_cents <= this cap" }
      - { name: max_daily_fees_count, type: integer, source: input, description: "Max number of OVERDRAFT fees per account per business-date batch; a fee is assessed only while fees_count_so_far < this count" }
      - { name: de_minimis_threshold_cents, type: integer, source: input, description: "Fee assessed only when the post-item working balance is strictly more negative than -de_minimis (magnitude > threshold; exactly == threshold yields NO fee)" }
      - { name: sustained_overdraft_days_threshold, type: integer, source: input, description: "Consecutive settled business days with negative ledger that trigger RESTRICTED (>= semantics)" }
      - { name: sustained_overdraft_fee_cents, type: integer, source: input, description: "One-time SUSTAINED fee assessed on the settle that first reaches the sustained-day threshold; exempt from daily caps" }
      - { name: charge_off_grace_business_days, type: integer, source: input, description: "Settled business days an account may remain RESTRICTED with negative ledger before CLOSED_CHARGEOFF (>= semantics)" }
      - { name: notice_window_days, type: integer, source: input, description: "Calendar days between notice issue (sent_at) and earliest activation (effective_at = sent_at + notice_window_days)" }
      - { name: steering_fee_count_threshold, type: integer, source: input, description: "Posted+waived fees within trailing steering window that trigger an auto EducationOffer (>= semantics)" }
      - { name: steering_window_days, type: integer, source: input, description: "Trailing calendar-day window for steering fee count and the one-auto-offer-per-window cap" }
      - { name: offer_expiry_days, type: integer, source: input, description: "Calendar days an EducationOffer stays OFFERED before it is EXPIRED" }
      - { name: posting_order_policy, type: enum, source: input, description: "HIGH_TO_LOW | CHRONOLOGICAL — debit ordering inside a batch seal; credits always post first" }
      - { name: current_disclosure_version, type: string, source: input, description: "Disclosure text version that opt-in elections must reference" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED — SUSPENDED gates fee assessment, account opening, notice activation" }

  - name: DepositAccount
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> OverdraftProgram.id; program governing fees and thresholds" }
      - { name: holder_name, type: string, source: input, description: "Account holder display name" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RESTRICTED | CLOSED_VOLUNTARY | CLOSED_CHARGEOFF" }
      - { name: ledger_balance_cents, type: integer, source: computed, default: 0, description: "Posted items minus POSTED fees; fees debit at settle, never during their own batch's seal" }
      - { name: consecutive_negative_business_days, type: integer, source: system, default: 0, description: "Count of settled batches after which ledger stayed negative; resets to 0 on any settle with ledger >= 0" }
      - { name: restricted_business_days, type: integer, source: system, default: 0, description: "Settled business days elapsed since entering RESTRICTED while still negative" }
      - { name: lifetime_fees_assessed_cents, type: integer, source: system, default: 0, description: "Sum of amount_cents of all fees ever assessed (OVERDRAFT at seal, SUSTAINED at settle)" }
      - { name: lifetime_fees_waived_cents, type: integer, source: system, default: 0, description: "Sum of waived cents applied by approved waiver requests or system voids" }
      - { name: charged_off_cents, type: integer, source: system, default: 0, description: "Remaining unrecovered charge-off principal" }
      - { name: recovered_cents, type: integer, source: system, default: 0, description: "Sum of recovery credits posted to a CLOSED_CHARGEOFF account" }
      - { name: charge_off_original_cents, type: integer, source: system, default: 0, description: "Charge-off principal at closure; invariant: charged_off_cents + recovered_cents == charge_off_original_cents" }

  - name: OptInElection
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> DepositAccount.id; at most one election per account ever" }
      - { name: status, type: enum, source: system, default: OPTED_IN, description: "OPTED_IN | REVOKED — cyclic; absence of any election means not opted in" }
      - { name: channel, type: enum, source: input, description: "BRANCH | ONLINE | PHONE | MAIL — documentation of how consent was captured" }
      - { name: disclosure_version, type: string, source: input, description: "Must equal program.current_disclosure_version at create and at reinstate" }
      - { name: elected_at, type: datetime, source: system, description: "Logical clock at creation" }
      - { name: last_changed_at, type: datetime, source: system, description: "Logical clock of latest status change" }

  - name: AccountTransaction
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> DepositAccount.id" }
      - { name: type, type: enum, source: input, description: "DEBIT_ONE_TIME | DEBIT_RECURRING | DEBIT_ACH | DEBIT_CHECK | CREDIT_DEPOSIT" }
      - { name: amount_cents, type: integer, source: input, description: "> 0" }
      - { name: status, type: enum, source: system, default: AUTHORIZED, description: "AUTHORIZED | POSTED | RETURNED_NSF | REVERSED" }
      - { name: authorized_date, type: string, source: system, description: "YYYY-MM-DD of the logical clock at creation" }
      - { name: batch_id, type: string, source: system, default: null, description: "FK -> PostingBatch.id; assigned by the sealing batch (null for immediate recovery posts)" }
      - { name: posting_sequence, type: integer, source: system, default: null, description: "Per-account 1-based order assigned at seal (credits first, then debits per program policy)" }
      - { name: posted_date, type: string, source: system, default: null, description: "Business date of the sealing batch (or creation date for immediate recovery posts)" }

  - name: PostingBatch
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> OverdraftProgram.id" }
      - { name: business_date, type: string, source: input, description: "YYYY-MM-DD; must be a Monday–Friday date; unique per program" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | SEALED | SETTLED | CANCELLED" }
      - { name: items_posted_count, type: integer, source: system, default: 0, description: "Transactions moved to POSTED at seal" }
      - { name: items_returned_count, type: integer, source: system, default: 0, description: "One-time debits returned NSF at seal (not opted in, would overdraw)" }
      - { name: fees_assessed_count, type: integer, source: system, default: 0, description: "OVERDRAFT fees created at seal" }
      - { name: fees_assessed_cents, type: integer, source: system, default: 0, description: "Sum of OVERDRAFT fee amounts created at seal" }

  - name: OverdraftFee
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> DepositAccount.id" }
      - { name: batch_id, type: string, source: system, description: "FK -> PostingBatch.id" }
      - { name: transaction_id, type: string, source: system, default: null, description: "FK -> AccountTransaction.id; null for SUSTAINED fees" }
      - { name: fee_type, type: enum, source: system, description: "OVERDRAFT | SUSTAINED" }
      - { name: amount_cents, type: integer, source: system, description: "Face value assessed" }
      - { name: waived_cents, type: integer, source: system, default: 0, description: "Cumulative waived portion" }
      - { name: outstanding_cents, type: integer, source: computed, description: "amount_cents - waived_cents" }
      - { name: status, type: enum, source: system, default: ASSESSED, description: "ASSESSED | POSTED | WAIVED | VOIDED — WAIVED requires outstanding_cents == 0" }
      - { name: posted_date, type: string, source: system, default: null, description: "Business date when fee moved ASSESSED -> POSTED at settle (SUSTAINED fees are born POSTED)" }

  - name: FeeWaiverRequest
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> DepositAccount.id" }
      - { name: fee_ids, type: array, source: input, description: "Ordered list of OverdraftFee ids to waive; all must belong to account_id and be ASSESSED or POSTED" }
      - { name: kind, type: enum, source: input, description: "FULL | FIXED_AMOUNT | PERCENT_BPS" }
      - { name: amount_cents, type: integer, source: input, default: null, description: "Required when kind == FIXED_AMOUNT; must be <= sum of listed fees' outstanding at submit" }
      - { name: percent_bps, type: integer, source: input, default: null, description: "Required when kind == PERCENT_BPS; 1..10000" }
      - { name: reason_code, type: enum, source: input, description: "HARDSHIP | BANK_ERROR | FIRST_TIME | GOODWILL" }
      - { name: computed_total_cents, type: integer, source: computed, description: "Authority-routing total computed at submit (per-item rounding, then summed)" }
      - { name: routing_band, type: enum, source: computed, description: "TELLER | SUPERVISOR | MANAGER | COMPLIANCE — band of computed_total_cents" }
      - { name: status, type: enum, source: system, description: "APPLIED | PENDING_SUPERVISOR | PENDING_MANAGER | PENDING_COMPLIANCE | DENIED | DENIED_FINAL" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator (segregation of duties)" }
      - { name: created_by_role, type: string, source: system, description: "X-User-Role of creator" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of latest approve/deny actor" }
      - { name: denied_band, type: enum, source: system, default: null, description: "SUPERVISOR | MANAGER | COMPLIANCE — band at which the latest denial occurred" }

  - name: WaiverRequestItem
    parent: null
    common_fields: false
    fields:
      - { name: waiver_request_id, type: string, source: system, description: "FK -> FeeWaiverRequest.id" }
      - { name: fee_id, type: string, source: system, description: "FK -> OverdraftFee.id" }
      - { name: waived_cents, type: integer, source: system, default: 0, description: "Amount applied to this fee at approval (per-item rounded for PERCENT_BPS)" }

  - name: ProgramChangeNotice
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> OverdraftProgram.id" }
      - { name: parameter, type: enum, source: input, description: "FEE_AMOUNT | DAILY_CAP_CENTS | MAX_DAILY_FEES | DE_MINIMIS | POSTING_ORDER | SUSTAINED_FEE" }
      - { name: new_value, type: string, source: input, description: "Target value; integer-as-string for cent/count parameters, enum member for POSTING_ORDER" }
      - { name: old_value, type: string, source: system, description: "Snapshot of the program field at notice creation" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ISSUED | EFFECTIVE | WITHDRAWN | SUPERSEDED" }
      - { name: sent_at, type: datetime, source: system, default: null, description: "Logical clock at issue" }
      - { name: effective_at, type: datetime, source: system, default: null, description: "sent_at + program.notice_window_days; activation requires clock >= effective_at" }

  - name: EducationOffer
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> DepositAccount.id" }
      - { name: offer_type, type: enum, source: input, description: "LINKED_SAVINGS | OVERDRAFT_LINE_OF_CREDIT | COUNSELING" }
      - { name: trigger_reason, type: enum, source: system, description: "MANUAL | FEE_THRESHOLD | SUSTAINED_OD" }
      - { name: status, type: enum, source: system, default: OFFERED, description: "OFFERED | ACCEPTED | DECLINED | EXPIRED | SUPERSEDED" }
      - { name: expires_at, type: datetime, source: system, description: "Creation clock + program.offer_expiry_days" }

  - name: RegulatoryReport
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> OverdraftProgram.id" }
      - { name: period_start, type: string, source: input, description: "YYYY-MM-DD; closed interval start; must equal previous report's period_end + 1 day (first report: any date)" }
      - { name: period_end, type: string, source: input, description: "YYYY-MM-DD; >= period_start; closed interval end; must not overlap any existing report" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | FINALIZED | SUBMITTED" }
      - { name: revenue_provisional_cents, type: integer, source: computed, default: null, description: "Accrual basis: sum(amount - waived) over fees whose batch business_date is in period and status in {ASSESSED, POSTED, WAIVED}" }
      - { name: revenue_final_cents, type: integer, source: computed, default: null, description: "Settled basis: same but status in {POSTED, WAIVED} only" }
      - { name: waiver_ratio_bps, type: integer, source: computed, default: null, description: "floor(sum waived_cents in period * 10000 / sum amount_cents of POSTED/WAIVED fees in period); 0 when denominator is 0" }
      - { name: avg_fees_per_overdrafter_centi, type: integer, source: computed, default: null, description: "floor(count of POSTED/WAIVED fees in period * 100 / distinct accounts with >= 1 such fee); 0 when no overdrafters" }
      - { name: scrutiny_flag, type: boolean, source: computed, default: null, description: "true iff waiver_ratio_bps > 1500 OR avg_fees_per_overdrafter_centi >= 1200" }
      - { name: finalized_by_user_id, type: string, source: system, default: null, description: "X-User-ID of finalizer; submitter must differ" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: OverdraftProgram
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /v1/programs/{id}/suspend"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "increments OverdraftProgram.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /v1/programs/{id}/resume"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "increments OverdraftProgram.version by 1"
    note: "SUSPENDED gates: account opening, fee assessment during seal (items still post), SUSTAINED fee at settle, notice activation."

  - entity: DepositAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED_VOLUNTARY, CLOSED_CHARGEOFF]
    transitions:
      - from: ACTIVE
        to: RESTRICTED
        trigger: "system (during POST /v1/batches/{id}/settle when consecutive_negative_business_days reaches program.sustained_overdraft_days_threshold)"
        actor: system
        preconditions:
          - "ledger_balance_cents < 0 after fee posting"
          - "consecutive_negative_business_days >= sustained_overdraft_days_threshold"
        side_effects:
          - "restricted_business_days = 0"
          - "SUSTAINED fee (program.sustained_overdraft_fee_cents, born POSTED, exempt from daily caps) is created and debited from ledger, unless program SUSPENDED"
          - "lifetime_fees_assessed_cents += sustained fee amount"
          - "EducationOffer (OVERDRAFT_LINE_OF_CREDIT, trigger_reason SUSTAINED_OD) auto-created if no OFFERED offer exists and no offer was created within trailing steering_window_days"
          - "increments DepositAccount.version by 1"
      - from: RESTRICTED
        to: ACTIVE
        trigger: "system (during settle when ledger_balance_cents >= 0 after fee posting — cure)"
        actor: system
        preconditions:
          - "ledger_balance_cents >= 0 after settle fee posting"
        side_effects:
          - "consecutive_negative_business_days = 0; restricted_business_days = 0"
          - "increments DepositAccount.version by 1"
      - from: ACTIVE
        to: CLOSED_VOLUNTARY
        trigger: "POST /v1/accounts/{id}/close"
        actor: Teller | ProgramAdmin
        preconditions:
          - "ledger_balance_cents >= 0 (else ERR_CLOSE_NEGATIVE_BALANCE)"
          - "no OverdraftFee in ASSESSED for this account (else ERR_OPEN_ITEMS_BLOCK_CLOSE)"
          - "no FeeWaiverRequest in PENDING_SUPERVISOR/PENDING_MANAGER/PENDING_COMPLIANCE for this account (else ERR_OPEN_ITEMS_BLOCK_CLOSE)"
          - "no EducationOffer in OFFERED for this account (else ERR_OPEN_ITEMS_BLOCK_CLOSE)"
        side_effects:
          - "increments DepositAccount.version by 1"
      - from: RESTRICTED
        to: CLOSED_CHARGEOFF
        trigger: "system (during settle when restricted_business_days reaches program.charge_off_grace_business_days while ledger still negative)"
        actor: system
        preconditions:
          - "ledger_balance_cents < 0"
          - "restricted_business_days >= charge_off_grace_business_days"
        side_effects:
          - "charged_off_cents = -ledger_balance_cents; charge_off_original_cents = -ledger_balance_cents; recovered_cents = 0; ledger_balance_cents = 0"
          - "PENDING_* FeeWaiverRequests for this account -> DENIED_FINAL"
          - "OFFERED EducationOffers for this account -> EXPIRED"
          - "increments DepositAccount.version by 1"

  - entity: OptInElection
    initial_state: OPTED_IN
    terminal_states: []
    transitions:
      - from: OPTED_IN
        to: REVOKED
        trigger: "POST /v1/opt-in-elections/{id}/revoke"
        actor: AccountHolder | Teller
        preconditions:
          - "owning account not CLOSED_VOLUNTARY and not CLOSED_CHARGEOFF (else ERR_ACCOUNT_CLOSED)"
        side_effects:
          - "last_changed_at = clock"
      - from: REVOKED
        to: OPTED_IN
        trigger: "POST /v1/opt-in-elections/{id}/reinstate"
        actor: AccountHolder | Teller
        preconditions:
          - "owning account status == ACTIVE (RESTRICTED blocks reinstatement: ERR_ACCOUNT_RESTRICTED; closed: ERR_ACCOUNT_CLOSED)"
          - "payload disclosure_version == program.current_disclosure_version (else ERR_STALE_DISCLOSURE_VERSION)"
        side_effects:
          - "last_changed_at = clock"
    note: "Cyclic: revoke/reinstate may repeat without bound on the same election record."

  - entity: AccountTransaction
    initial_state: AUTHORIZED
    terminal_states: [RETURNED_NSF, REVERSED]
    note: "POSTED is non-terminal: POSTED -> REVERSED is allowed while the batch is SEALED."
    transitions:
      - from: AUTHORIZED
        to: POSTED
        trigger: "system (POST /v1/batches/{id}/seal sweep) or immediate post for CREDIT_DEPOSIT recovery on CLOSED_CHARGEOFF account"
        actor: system
        preconditions:
          - "batch seal: transaction authorized_date <= batch.business_date and account belongs to batch program"
          - "debit pay decision passes (paid into overdraft allowed: type != DEBIT_ONE_TIME OR account's OptInElection is OPTED_IN)"
        side_effects:
          - "batch_id, posting_sequence, posted_date assigned"
          - "ledger working balance reduced (debit) or increased (credit)"
          - "may trigger OverdraftFee creation per fee_assessment calculation"
      - from: AUTHORIZED
        to: RETURNED_NSF
        trigger: "system (batch seal sweep)"
        actor: system
        preconditions:
          - "type == DEBIT_ONE_TIME AND account has no OPTED_IN election AND posting the item would make working balance negative"
        side_effects:
          - "batch_id, posting_sequence, posted_date assigned; balance unchanged; NO fee"
      - from: POSTED
        to: REVERSED
        trigger: "POST /v1/transactions/{id}/reverse"
        actor: OperationsClerk
        preconditions:
          - "transaction.batch_id references a batch with status == SEALED (once SETTLED: ERR_REVERSAL_WINDOW_CLOSED)"
        side_effects:
          - "ledger_balance_cents credited back (debit) or debited back (credit) by amount_cents"
          - "OverdraftFee rows with transaction_id == this id and status == ASSESSED become VOIDED; their amounts added to lifetime_fees_waived_cents"
          - "recompute account derived aggregates; increments DepositAccount.version by 1"

  - entity: PostingBatch
    initial_state: OPEN
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: OPEN
        to: SEALED
        trigger: "POST /v1/batches/{id}/seal"
        actor: OperationsClerk
        preconditions: []
        side_effects:
          - "runs posting_order_and_fee_assessment calculation (credits first, debits per program policy)"
          - "items_posted_count / items_returned_count / fees_assessed_count / fees_assessed_cents set"
          - "touches each swept account's ledger_balance_cents (items only) and version"
      - from: SEALED
        to: SETTLED
        trigger: "POST /v1/batches/{id}/settle"
        actor: OperationsClerk
        preconditions:
          - "every batch of the same program with an earlier business_date is SETTLED or CANCELLED (else ERR_EARLIER_BATCH_UNSETTLED)"
        side_effects:
          - "ASSESSED fees -> POSTED (posted_date = business_date); their amounts debit ledger_balance_cents"
          - "per-account sustained-overdraft day counting, RESTRICTED/cure/charge-off transitions (see DepositAccount)"
          - "steering sweep: FEE_THRESHOLD EducationOffer auto-creation per steering_fee_trigger calculation"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /v1/batches/{id}/cancel"
        actor: OperationsClerk
        preconditions:
          - "no transaction has been assigned batch_id == this batch (a seal already consumed OPEN; only an unsealed empty batch may be cancelled)"
        side_effects: []

  - entity: OverdraftFee
    initial_state: ASSESSED
    terminal_states: [WAIVED, VOIDED]
    transitions:
      - from: ASSESSED
        to: POSTED
        trigger: "system (batch settle)"
        actor: system
        preconditions: []
        side_effects:
          - "posted_date = batch.business_date; amount debited from account ledger"
      - from: ASSESSED
        to: POSTED
        trigger: "system (SUSTAINED fee creation at restrict — born directly POSTED)"
        actor: system
        preconditions: []
        side_effects:
          - "posted_date = settle business_date; amount debited immediately"
        note: "SUSTAINED fees are created in POSTED state; ASSESSED->POSTED covers OVERDRAFT fees at settle."
      - from: ASSESSED
        to: WAIVED
        trigger: "system (approved FeeWaiverRequest application covering full outstanding)"
        actor: system
        preconditions:
          - "waived_cents reaches amount_cents (outstanding_cents == 0)"
        side_effects:
          - "account ledger credited by waived amount at application time; lifetime_fees_waived_cents updated"
      - from: POSTED
        to: WAIVED
        trigger: "system (approved FeeWaiverRequest application covering full outstanding)"
        actor: system
        preconditions:
          - "waived_cents reaches amount_cents (outstanding_cents == 0)"
        side_effects:
          - "account ledger credited by waived amount; lifetime_fees_waived_cents updated"
      - from: ASSESSED
        to: VOIDED
        trigger: "system (reversal of the originating transaction while its batch is still SEALED)"
        actor: system
        preconditions: []
        side_effects:
          - "voided amount added to lifetime_fees_waived_cents; ledger not debited (fee was never posted)"
    note: "Partial waivers leave the fee in its current status with reduced outstanding_cents; only outstanding == 0 flips to WAIVED."

  - entity: FeeWaiverRequest
    initial_state: PENDING_SUPERVISOR
    terminal_states: [APPLIED, DENIED_FINAL]
    transitions:
      - from: null
        to: APPLIED
        trigger: "POST /v1/fee-waiver-requests (creation-time auto band)"
        actor: Teller | Supervisor | Manager
        preconditions:
          - "computed_total_cents <= TELLER_CAP_CENTS (5000) AND creator role is staff (not AccountHolder)"
        side_effects:
          - "WaiverRequestItems created with waived_cents per waiver_allocation calculation; fees updated (WAIVED when fully covered); account ledger credited; lifetime_fees_waived_cents updated"
        note: "AccountHolder-created requests never auto-approve; they route to PENDING_SUPERVISOR minimum."
      - from: null
        to: PENDING_SUPERVISOR
        trigger: "POST /v1/fee-waiver-requests"
        actor: AccountHolder | Teller | Supervisor | Manager
        preconditions:
          - "TELLER_CAP_CENTS < computed_total_cents <= SUPERVISOR_CAP_CENTS (20000), OR creator is AccountHolder and computed_total_cents <= SUPERVISOR_CAP_CENTS"
        side_effects:
          - "WaiverRequestItems created with waived_cents = 0 (computed at apply time)"
      - from: null
        to: PENDING_MANAGER
        trigger: "POST /v1/fee-waiver-requests"
        actor: AccountHolder | Teller | Supervisor | Manager
        preconditions:
          - "SUPERVISOR_CAP_CENTS < computed_total_cents <= MANAGER_CAP_CENTS (100000)"
        side_effects:
          - "WaiverRequestItems created with waived_cents = 0"
      - from: null
        to: PENDING_COMPLIANCE
        trigger: "POST /v1/fee-waiver-requests"
        actor: AccountHolder | Teller | Supervisor | Manager
        preconditions:
          - "computed_total_cents > MANAGER_CAP_CENTS"
        side_effects:
          - "WaiverRequestItems created with waived_cents = 0"
      - from: PENDING_SUPERVISOR
        to: APPLIED
        trigger: "POST /v1/fee-waiver-requests/{id}/approve"
        actor: Supervisor | Manager | ComplianceOfficer
        preconditions:
          - "X-User-ID != created_by_user_id (else ERR_SELF_APPROVAL_FORBIDDEN)"
          - "every listed fee still ASSESSED or POSTED (else ERR_FEE_STATE_CHANGED)"
        side_effects:
          - "per-item waived_cents computed (waiver_allocation); fees updated; account ledger credited; lifetime_fees_waived_cents updated; decided_by_user_id set"
      - from: PENDING_MANAGER
        to: APPLIED
        trigger: "POST /v1/fee-waiver-requests/{id}/approve"
        actor: Manager | ComplianceOfficer
        preconditions:
          - "Supervisor attempt here fails with ERR_WAIVER_EXCEEDS_AUTHORITY"
          - "X-User-ID != created_by_user_id; fees unchanged"
        side_effects: ["same as approve above"]
      - from: PENDING_COMPLIANCE
        to: APPLIED
        trigger: "POST /v1/fee-waiver-requests/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "Supervisor/Manager attempt here fails with ERR_WAIVER_EXCEEDS_AUTHORITY"
          - "X-User-ID != created_by_user_id; fees unchanged"
        side_effects: ["same as approve above"]
      - from: PENDING_SUPERVISOR
        to: PENDING_MANAGER
        trigger: "POST /v1/fee-waiver-requests/{id}/escalate"
        actor: Supervisor | Manager
        preconditions: []
        side_effects: []
      - from: PENDING_MANAGER
        to: PENDING_COMPLIANCE
        trigger: "POST /v1/fee-waiver-requests/{id}/escalate"
        actor: Manager
        preconditions: []
        side_effects: []
      - from: PENDING_SUPERVISOR
        to: DENIED
        trigger: "POST /v1/fee-waiver-requests/{id}/deny"
        actor: Supervisor | Manager | ComplianceOfficer
        preconditions:
          - "X-User-ID != created_by_user_id (else ERR_SELF_APPROVAL_FORBIDDEN)"
        side_effects:
          - "denied_band = SUPERVISOR; decided_by_user_id set"
      - from: PENDING_MANAGER
        to: DENIED
        trigger: "POST /v1/fee-waiver-requests/{id}/deny"
        actor: Manager | ComplianceOfficer
        preconditions:
          - "X-User-ID != created_by_user_id"
        side_effects:
          - "denied_band = MANAGER; decided_by_user_id set"
      - from: PENDING_COMPLIANCE
        to: DENIED_FINAL
        trigger: "POST /v1/fee-waiver-requests/{id}/deny"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID != created_by_user_id"
        side_effects:
          - "denied_band = COMPLIANCE; decided_by_user_id set"
      - from: DENIED
        to: PENDING_MANAGER
        trigger: "POST /v1/fee-waiver-requests/{id}/appeal (only when denied_band == SUPERVISOR)"
        actor: AccountHolder | Teller | Supervisor | Manager
        preconditions:
          - "denied_band == SUPERVISOR (appeal from MANAGER denial routes to compliance; from DENIED_FINAL impossible)"
        side_effects: []
      - from: DENIED
        to: PENDING_COMPLIANCE
        trigger: "POST /v1/fee-waiver-requests/{id}/appeal (only when denied_band == MANAGER)"
        actor: AccountHolder | Teller | Supervisor | Manager
        preconditions:
          - "denied_band == MANAGER"
        side_effects: []
    note: "Branching entry (auto band vs three pending bands) plus the deny->appeal->higher-band cycle make this machine non-linear."

  - entity: ProgramChangeNotice
    initial_state: DRAFT
    terminal_states: [EFFECTIVE, WITHDRAWN, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (creation of a new DRAFT notice for the same program + parameter)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: ISSUED
        trigger: "POST /v1/notices/{id}/issue"
        actor: ProgramAdmin
        preconditions:
          - "no other notice for the same program + parameter is in ISSUED with a window overlapping [clock, clock + notice_window_days) — half-open; sent_at == prior effective_at is allowed (else ERR_NOTICE_WINDOW_OVERLAP)"
        side_effects:
          - "sent_at = clock; effective_at = sent_at + program.notice_window_days"
      - from: ISSUED
        to: EFFECTIVE
        trigger: "POST /v1/notices/{id}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "program status == ACTIVE (else ERR_PROGRAM_SUSPENDED)"
          - "clock >= effective_at (else ERR_NOTICE_WINDOW_NOT_ELAPSED)"
        side_effects:
          - "applies new_value to the mapped OverdraftProgram field; increments OverdraftProgram.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /v1/notices/{id}/withdraw"
        actor: ProgramAdmin
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: WITHDRAWN
        trigger: "POST /v1/notices/{id}/withdraw"
        actor: ProgramAdmin
        preconditions:
          - "clock < effective_at (an already-effective notice cannot be withdrawn)"
        side_effects: []

  - entity: EducationOffer
    initial_state: OFFERED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED, SUPERSEDED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /v1/education-offers/{id}/accept"
        actor: AccountHolder
        preconditions:
          - "clock <= expires_at (else ERR_OFFER_EXPIRED)"
          - "owning account status IN {ACTIVE, RESTRICTED} (closed: ERR_ACCOUNT_CLOSED)"
        side_effects: []
      - from: OFFERED
        to: DECLINED
        trigger: "POST /v1/education-offers/{id}/decline"
        actor: AccountHolder
        preconditions:
          - "clock <= expires_at (else ERR_OFFER_EXPIRED)"
          - "owning account status IN {ACTIVE, RESTRICTED}"
        side_effects: []
      - from: OFFERED
        to: SUPERSEDED
        trigger: "system (creation of a new EducationOffer for the same account auto-supersedes any OFFERED one)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OFFERED
        to: EXPIRED
        trigger: "system (evaluated lazily at read/action time when clock > expires_at; also applied by the charge-off cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RegulatoryReport
    initial_state: OPEN
    terminal_states: [SUBMITTED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /v1/reports/{id}/finalize"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "computes revenue_provisional_cents, revenue_final_cents, waiver_ratio_bps, avg_fees_per_overdrafter_centi, scrutiny_flag per report_revenue_metrics"
          - "finalized_by_user_id = X-User-ID"
      - from: FINALIZED
        to: SUBMITTED
        trigger: "POST /v1/reports/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID != finalized_by_user_id (else ERR_SELF_SUBMISSION_FORBIDDEN)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: notice-create-stale-program
    parent_entity: OverdraftProgram
    write_endpoint: "POST /v1/notices"
    occ_field: "expected_program_version"
    description: |
      Creating a ProgramChangeNotice against a program whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just created a notice (which
      legitimately supersedes the prior DRAFT on the same parameter) or a
      notice activation has just repriced the program, leaving the current
      writer's view of the program stale.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
  - rule_id: offer-create-stale-account
    parent_entity: DepositAccount
    write_endpoint: "POST /v1/education-offers"
    occ_field: "expected_account_version"
    description: |
      Creating an EducationOffer against an account whose version has
      advanced since the client last observed it is rejected. Creation
      legitimately supersedes any OFFERED offer, so a stale view means the
      writer may be superseding an offer it never saw.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: posting_order_and_fee_assessment
    trigger: "POST /v1/batches/{id}/seal"
    algorithm: chronological
    formula: |
      Input set: AccountTransaction rows with status == AUTHORIZED,
      authorized_date <= batch.business_date, account.program_id == batch.program_id.
      Accounts processed in DepositAccount.created_at ASC order.
      Per account A (P = A's program):
        working = A.ledger_balance_cents          # items-only balance; fees NEVER enter working
        fee_count = 0; fee_cents = 0
        Order items: CREDIT_DEPOSIT first (authorized_at ASC, tie created_at ASC),
        then debits:
          HIGH_TO_LOW: amount_cents DESC, tie authorized_at ASC, tie created_at ASC
          CHRONOLOGICAL: authorized_at ASC, tie created_at ASC
        For each item (1-based posting_sequence per account):
          credit: working += amount; item -> POSTED (batch_id, sequence, posted_date set)
          debit:
            projected = working - amount
            if projected >= 0: working = projected; item -> POSTED; continue
            # would overdraw:
            payable = (item.type != DEBIT_ONE_TIME) OR election(A).status == OPTED_IN
            if NOT payable: item -> RETURNED_NSF (balance unchanged, no fee); continue
            working = projected; item -> POSTED
            if P.status == ACTIVE
               AND (-working) > P.de_minimis_threshold_cents          # strict; == threshold means NO fee
               AND fee_count < P.max_daily_fees_count                 # strict; == count cap blocks
               AND fee_cents + P.fee_amount_cents <= P.daily_fee_cap_cents:   # <= allows exact-fit
              create OverdraftFee(OVERDRAFT, amount = P.fee_amount_cents, ASSESSED, batch, A, item)
              fee_count += 1; fee_cents += P.fee_amount_cents
              A.lifetime_fees_assessed_cents += P.fee_amount_cents
        A.ledger_balance_cents = working      # fees debit later, at settle
        Batch counters: items_posted_count, items_returned_count, fees_assessed_count, fees_assessed_cents
    input_set: "AUTHORIZED transactions with authorized_date <= batch.business_date on accounts of the batch's program; RETURNED/POSTED/REVERSED excluded"
    constants:
      TIE_BREAK: "created_at ASC (never id)"
    precision: "integer cents; no rounding"
    variants:
      - name: high_to_low
        when: "program.posting_order_policy == HIGH_TO_LOW"
        difference: "debits ordered by amount_cents DESC; identical input set can yield MORE fees than chronological because large items push the balance negative earlier"
      - name: chronological
        when: "program.posting_order_policy == CHRONOLOGICAL"
        difference: "debits ordered by authorized_at ASC; identical input set can yield FEWER fees (small items absorbed by the starting balance)"

  - name: working_vs_ledger_balance_ordering
    trigger: "inside posting_order_and_fee_assessment (per item)"
    algorithm: constraint_propagation
    formula: |
      Two balances exist during a seal:
        working_balance  = prior ledger + credits - paid debits (NO fees)
        ledger_balance   = persisted on account at seal end = working_balance (fees debit only at settle)
      Evaluation order per item (pinned, breaks the circularity):
        (1) projected = working - amount
        (2) pay/return decision uses projected only
        (3) de minimis and cap checks use working AFTER the item posts
        (4) any fee created does NOT modify working, so it cannot influence
            pay/return or de minimis decisions of later items in the same batch
      Consequence: same-batch fees never cascade into extra returns or extra fees.
    input_set: "same as posting_order_and_fee_assessment"
    constants: {}
    precision: "integer cents"

  - name: waiver_allocation
    trigger: "FeeWaiverRequest creation (computed_total_cents for routing) and approval (actual per-item application)"
    algorithm: waterfall_allocation
    formula: |
      Items ordered by OverdraftFee.created_at ASC, tie amount_cents ASC (never id).
      Per kind:
        FULL:        per_item = fee.outstanding_cents
        FIXED_AMOUNT: waterfall: per_item = min(remaining_amount, fee.outstanding_cents);
                      remaining_amount decreases left to right
        PERCENT_BPS: per_item = round_half_up(fee.outstanding_cents * percent_bps / 10000)
                      — ROUND PER ITEM FIRST, THEN SUM (pinned order; sum-then-round
                      can differ by a cent and is forbidden)
      computed_total_cents = sum(per_item)
      At apply: WaiverRequestItem.waived_cents = per_item; fee.waived_cents += per_item;
      fee -> WAIVED iff outstanding_cents == 0; account ledger credited by
      sum(per_item); lifetime_fees_waived_cents += sum(per_item).
    input_set: "the request's fee_ids, each ASSESSED or POSTED at submit; re-validated at approve"
    constants:
      TELLER_CAP_CENTS: 5000
      SUPERVISOR_CAP_CENTS: 20000
      MANAGER_CAP_CENTS: 100000
    precision: "integer cents; round_half_up per item for PERCENT_BPS"

  - name: sustained_overdraft_day_count
    trigger: "POST /v1/batches/{id}/settle"
    algorithm: threshold
    formula: |
      After fees post, for EVERY account of the program with status in
      {ACTIVE, RESTRICTED} (accounts with no activity this batch are still counted),
      processed in DepositAccount.created_at ASC order:
        if ledger_balance_cents < 0:
          consecutive_negative_business_days += 1
          if status == ACTIVE AND consecutive_negative_business_days >= P.sustained_overdraft_days_threshold:
            -> RESTRICTED; restricted_business_days = 0
            unless P.status == SUSPENDED:
              assess SUSTAINED fee (born POSTED, posted_date = batch.business_date,
                EXEMPT from daily caps and de minimis), debit ledger immediately
            create EducationOffer(OVERDRAFT_LINE_OF_CREDIT, SUSTAINED_OD) subject to steering caps
          elif status == RESTRICTED:
            restricted_business_days += 1
            if restricted_business_days >= P.charge_off_grace_business_days:
              -> CLOSED_CHARGEOFF with charge-off fields and cascades (see state machine)
        else:
          consecutive_negative_business_days = 0
          if status == RESTRICTED: -> ACTIVE (cure); restricted_business_days = 0
    input_set: "all ACTIVE/RESTRICTED accounts of the batch's program"
    constants: {}
    precision: "integer day counts; >= semantics at both thresholds"

  - name: steering_fee_trigger
    trigger: "POST /v1/batches/{id}/settle (after sustained-day counting)"
    algorithm: aggregation
    formula: |
      For each account (created_at ASC) of the program with status in {ACTIVE, RESTRICTED}:
        window = [business_date - (P.steering_window_days - 1), business_date]   # closed date interval
        n = count of OverdraftFee with posted_date in window AND status IN {POSTED, WAIVED}
            (both OVERDRAFT and SUSTAINED types count)
        auto_offer_allowed = no EducationOffer with status OFFERED
            AND no EducationOffer (any status) with created date in window
        if n >= P.steering_fee_count_threshold AND auto_offer_allowed:
          create EducationOffer(OVERDRAFT_LINE_OF_CREDIT, FEE_THRESHOLD, OFFERED,
                                expires_at = settle clock + P.offer_expiry_days)
    input_set: "fees with posted_date inside the trailing window; ASSESSED and VOIDED excluded"
    constants: {}
    precision: "integer counts; >= semantics"

  - name: report_revenue_metrics
    trigger: "POST /v1/reports/{id}/finalize"
    algorithm: aggregation
    formula: |
      Period = [period_start, period_end] CLOSED date interval; fee's period date =
      its batch's business_date (SUSTAINED fees: posted_date).
      revenue_provisional_cents = sum(amount_cents - waived_cents) over fees with
        period date in period AND status IN {ASSESSED, POSTED, WAIVED}
      revenue_final_cents       = same but status IN {POSTED, WAIVED} only
      waiver_ratio_bps = floor( sum(waived_cents over POSTED/WAIVED fees in period) * 10000
                                / sum(amount_cents over POSTED/WAIVED fees in period) );
                         0 when denominator == 0
      avg_fees_per_overdrafter_centi = floor( count(POSTED/WAIVED fees in period) * 100
                                / count(DISTINCT account_id with >= 1 such fee) );
                         0 when no such accounts
      scrutiny_flag = (waiver_ratio_bps > 1500) OR (avg_fees_per_overdrafter_centi >= 1200)
    input_set: "fees of the report's program; VOIDED fees excluded everywhere"
    constants:
      SCRUTINY_WAIVER_RATIO_BPS: 1500
      SCRUTINY_AVG_FEES_CENTI: 1200
    precision: "integer cents/bps; floor division"
    variants:
      - name: provisional_accrual
        when: "revenue_provisional_cents"
        difference: "includes ASSESSED (unsettled-batch) fees at face value"
      - name: final_settled
        when: "revenue_final_cents"
        difference: "excludes ASSESSED fees; identical period data yields a lower-or-equal figure whenever any batch covering the period is sealed but not settled"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Request body well-formed: required fields present, enums valid, amounts > 0, date strings parse; kind-specific requirements (FIXED_AMOUNT needs amount_cents, PERCENT_BPS needs percent_bps in 1..10000, fee_ids non-empty)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a body"
  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right; body-referenced ids (program_id, account_id, fee_ids) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: existence
    check: "Ownership: when X-User-Role == AccountHolder, X-User-ID must equal the target account's id (transactions account_id, opt-in path account, waiver account_id, offer accept/decline's owning account)"
    error_id: ERR_ACCOUNT_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "AccountHolder-accessible endpoints"
  - priority: 6
    category: state
    check: "Account status gate: RESTRICTED blocks new debit authorizations and opt-in reinstatement (ERR_ACCOUNT_RESTRICTED); CLOSED_* blocks everything except recovery credits on CLOSED_CHARGEOFF (ERR_ACCOUNT_CLOSED)"
    error_id: "ERR_ACCOUNT_RESTRICTED / ERR_ACCOUNT_CLOSED"
    http_status: 409
    applies_to: "account-scoped mutations"
  - priority: 7
    category: state
    check: "Resource state machine: transition valid from current state (seal only from OPEN, settle only from SEALED, approve only from matching PENDING_*, appeal only from DENIED, revoke only from OPTED_IN, etc.); waiver targets must be ASSESSED/POSTED (ERR_FEE_NOT_WAIVABLE)"
    error_id: "ERR_INVALID_STATE_TRANSITION / ERR_FEE_NOT_WAIVABLE"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 8
    category: business_safety
    check: "Program posture and compliance: SUSPENDED blocks account opening, fee assessment effects, notice activation (ERR_PROGRAM_SUSPENDED); opt-in create/reinstate requires disclosure_version == program.current_disclosure_version (ERR_STALE_DISCLOSURE_VERSION)"
    error_id: "ERR_PROGRAM_SUSPENDED / ERR_STALE_DISCLOSURE_VERSION"
    http_status: 409
    applies_to: "accounts create, notices activate, opt-in create/reinstate"
  - priority: 9
    category: business_temporal
    check: "Time-window rules: notice activation requires clock >= effective_at (ERR_NOTICE_WINDOW_NOT_ELAPSED); notice issue requires no overlapping ISSUED window on same parameter (ERR_NOTICE_WINDOW_OVERLAP); report period must not overlap (ERR_REPORT_PERIOD_OVERLAP) and must start exactly previous period_end + 1 day (ERR_REPORT_PERIOD_GAP); batch business_date must be Mon–Fri (ERR_NON_BUSINESS_DAY); settle requires earlier batches settled/cancelled (ERR_EARLIER_BATCH_UNSETTLED); reversal requires batch still SEALED (ERR_REVERSAL_WINDOW_CLOSED); offer accept/decline requires clock <= expires_at (ERR_OFFER_EXPIRED)"
    error_id: "ERR_NOTICE_WINDOW_NOT_ELAPSED / ERR_NOTICE_WINDOW_OVERLAP / ERR_REPORT_PERIOD_OVERLAP / ERR_REPORT_PERIOD_GAP / ERR_NON_BUSINESS_DAY / ERR_EARLIER_BATCH_UNSETTLED / ERR_REVERSAL_WINDOW_CLOSED / ERR_OFFER_EXPIRED"
    http_status: 409
    applies_to: "notices, reports, batches, reversal, offers"
  - priority: 10
    category: business_constraint
    check: "Uniqueness and segregation: one non-CANCELLED batch per program per business_date (ERR_BATCH_ALREADY_EXISTS); one OptInElection per account ever (ERR_ELECTION_ALREADY_EXISTS); approver != created_by_user_id (ERR_SELF_APPROVAL_FORBIDDEN); report submitter != finalized_by_user_id (ERR_SELF_SUBMISSION_FORBIDDEN); at approve, listed fees must still be ASSESSED/POSTED (ERR_FEE_STATE_CHANGED)"
    error_id: "ERR_BATCH_ALREADY_EXISTS / ERR_ELECTION_ALREADY_EXISTS / ERR_SELF_APPROVAL_FORBIDDEN / ERR_SELF_SUBMISSION_FORBIDDEN / ERR_FEE_STATE_CHANGED"
    http_status: 409
    applies_to: "batches create, opt-in create, waiver approve/deny, report submit"
  - priority: 11
    category: business_constraint
    check: "Close economics: close requires ledger_balance_cents >= 0 (ERR_CLOSE_NEGATIVE_BALANCE) and no ASSESSED fees / PENDING waiver requests / OFFERED offers (ERR_OPEN_ITEMS_BLOCK_CLOSE)"
    error_id: "ERR_CLOSE_NEGATIVE_BALANCE / ERR_OPEN_ITEMS_BLOCK_CLOSE"
    http_status: 409
    applies_to: "accounts close"
  - priority: 12
    category: business_fiscal
    check: "Money rules: approver's authority band must cover the request band (ERR_WAIVER_EXCEEDS_AUTHORITY); FIXED_AMOUNT amount_cents must be <= sum of listed fees' outstanding at submit (ERR_WAIVER_AMOUNT_INVALID); recovery credit must be <= charged_off_cents (ERR_RECOVERY_EXCEEDS_CHARGEOFF)"
    error_id: "ERR_WAIVER_EXCEEDS_AUTHORITY / ERR_WAIVER_AMOUNT_INVALID / ERR_RECOVERY_EXCEEDS_CHARGEOFF"
    http_status: 409
    applies_to: "waiver approve, waiver create, transactions create"
  - priority: 13
    category: business_fiscal
    check: "OCC: expected_program_version / expected_account_version must equal the parent's current version"
    error_id: "ERR_STALE_PROGRAM_VERSION / ERR_STALE_ACCOUNT_VERSION"
    http_status: 412
    applies_to: "notices create, education-offers create"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving; default time 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["lazy EducationOffer expiry re-evaluates on subsequent reads/actions"]

  # --- OverdraftProgram ---
  - method: POST
    path: "/v1/programs"
    description: "Create an overdraft program (status ACTIVE)"
    roles: [ProgramAdmin]
    code: 201
    input: [name, fee_amount_cents, daily_fee_cap_cents, max_daily_fees_count, de_minimis_threshold_cents, sustained_overdraft_days_threshold, sustained_overdraft_fee_cents, charge_off_grace_business_days, notice_window_days, steering_fee_count_threshold, steering_window_days, offer_expiry_days, posting_order_policy, current_disclosure_version]
    output: OverdraftProgram
    side_effects: ["status=ACTIVE, version=1"]
  - method: GET
    path: "/v1/programs/{id}"
    description: "Get a program"
    roles: &all_roles [ProgramAdmin, OperationsClerk, Teller, Supervisor, Manager, ComplianceOfficer, AccountHolder]
    code: 200
    input: []
    output: OverdraftProgram
    side_effects: []
  - method: POST
    path: "/v1/programs/{id}/suspend"
    description: "Suspend a program (gates fee assessment, account opening, notice activation)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: OverdraftProgram
    side_effects: ["status -> SUSPENDED", "increments OverdraftProgram.version by 1"]
  - method: POST
    path: "/v1/programs/{id}/resume"
    description: "Resume a suspended program"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: OverdraftProgram
    side_effects: ["status -> ACTIVE", "increments OverdraftProgram.version by 1"]

  # --- DepositAccount ---
  - method: POST
    path: "/v1/accounts"
    description: "Open a deposit account under a program (program must be ACTIVE)"
    roles: [Teller, ProgramAdmin]
    code: 201
    input: [program_id, holder_name]
    output: DepositAccount
    side_effects: ["status=ACTIVE, ledger_balance_cents=0, counters=0"]
  - method: GET
    path: "/v1/accounts"
    description: "List accounts (filterable)"
    roles: *all_roles
    code: 200
    input: ["program_id?", "status?"]
    output: "DepositAccount[]"
    side_effects: []
  - method: GET
    path: "/v1/accounts/{id}"
    description: "Get an account"
    roles: *all_roles
    code: 200
    input: []
    output: DepositAccount
    side_effects: []
  - method: POST
    path: "/v1/accounts/{id}/close"
    description: "Voluntarily close an account (ACTIVE only, non-negative balance, no open items)"
    roles: [Teller, ProgramAdmin]
    code: 200
    input: []
    output: DepositAccount
    side_effects: ["status -> CLOSED_VOLUNTARY", "increments DepositAccount.version by 1"]

  # --- OptInElection ---
  - method: POST
    path: "/v1/accounts/{id}/opt-in-election"
    description: "Create the account's single Reg-E opt-in election (status OPTED_IN)"
    roles: [AccountHolder, Teller]
    code: 201
    input: [channel, disclosure_version]
    output: OptInElection
    side_effects: ["status=OPTED_IN, elected_at=clock"]
  - method: GET
    path: "/v1/opt-in-elections"
    description: "List opt-in elections (account_id filter returns array of 0 or 1)"
    roles: *all_roles
    code: 200
    input: ["account_id?"]
    output: "OptInElection[]"
    side_effects: []
  - method: GET
    path: "/v1/opt-in-elections/{id}"
    description: "Get an opt-in election"
    roles: *all_roles
    code: 200
    input: []
    output: OptInElection
    side_effects: []
  - method: POST
    path: "/v1/opt-in-elections/{id}/revoke"
    description: "Revoke an election"
    roles: [AccountHolder, Teller]
    code: 200
    input: []
    output: OptInElection
    side_effects: ["status -> REVOKED, last_changed_at=clock"]
  - method: POST
    path: "/v1/opt-in-elections/{id}/reinstate"
    description: "Reinstate a revoked election (requires current disclosure version, ACTIVE account)"
    roles: [AccountHolder, Teller]
    code: 200
    input: [disclosure_version]
    output: OptInElection
    side_effects: ["status -> OPTED_IN, last_changed_at=clock"]

  # --- AccountTransaction ---
  - method: POST
    path: "/v1/transactions"
    description: "Authorize a transaction. On CLOSED_CHARGEOFF accounts only CREDIT_DEPOSIT is allowed and posts immediately as a recovery (no batch)."
    roles: [AccountHolder, Teller]
    code: 201
    input: [account_id, type, amount_cents]
    output: AccountTransaction
    side_effects: ["status=AUTHORIZED (or POSTED for charge-off recovery)", "authorized_date = clock date"]
  - method: GET
    path: "/v1/transactions"
    description: "List transactions (filterable)"
    roles: *all_roles
    code: 200
    input: ["account_id?", "batch_id?", "status?", "type?"]
    output: "AccountTransaction[]"
    side_effects: []
  - method: GET
    path: "/v1/transactions/{id}"
    description: "Get a transaction"
    roles: *all_roles
    code: 200
    input: []
    output: AccountTransaction
    side_effects: []
  - method: POST
    path: "/v1/transactions/{id}/reverse"
    description: "Reverse a POSTED transaction while its batch is still SEALED"
    roles: [OperationsClerk]
    code: 200
    input: []
    output: AccountTransaction
    side_effects:
      - "status -> REVERSED; ledger credited/debited back by amount_cents"
      - "linked ASSESSED fees -> VOIDED; amounts added to lifetime_fees_waived_cents"
      - "increments DepositAccount.version by 1"

  # --- PostingBatch ---
  - method: POST
    path: "/v1/batches"
    description: "Open a posting batch for a business date (unique per program; Mon–Fri only)"
    roles: [OperationsClerk]
    code: 201
    input: [program_id, business_date]
    output: PostingBatch
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/v1/batches"
    description: "List batches (filterable)"
    roles: *all_roles
    code: 200
    input: ["program_id?", "business_date?", "status?"]
    output: "PostingBatch[]"
    side_effects: []
  - method: GET
    path: "/v1/batches/{id}"
    description: "Get a batch"
    roles: *all_roles
    code: 200
    input: []
    output: PostingBatch
    side_effects: []
  - method: POST
    path: "/v1/batches/{id}/seal"
    description: "Seal a batch: sweep AUTHORIZED items, order them, post, assess OVERDRAFT fees"
    roles: [OperationsClerk]
    code: 200
    input: []
    output: PostingBatch
    side_effects: ["runs posting_order_and_fee_assessment", "sets items/fees counters", "status -> SEALED"]
  - method: POST
    path: "/v1/batches/{id}/settle"
    description: "Settle a sealed batch: post fees, run sustained-day counting, steering sweep"
    roles: [OperationsClerk]
    code: 200
    input: []
    output: PostingBatch
    side_effects: ["ASSESSED fees -> POSTED and debit ledger", "runs sustained_overdraft_day_count and steering_fee_trigger", "status -> SETTLED"]
  - method: POST
    path: "/v1/batches/{id}/cancel"
    description: "Cancel an OPEN batch that has no assigned transactions"
    roles: [OperationsClerk]
    code: 200
    input: []
    output: PostingBatch
    side_effects: ["status -> CANCELLED"]

  # --- OverdraftFee ---
  - method: GET
    path: "/v1/fees"
    description: "List fees (filterable; transaction_id filter returns array of 0 or 1)"
    roles: *all_roles
    code: 200
    input: ["account_id?", "batch_id?", "transaction_id?", "status?", "fee_type?"]
    output: "OverdraftFee[]"
    side_effects: []
  - method: GET
    path: "/v1/fees/{id}"
    description: "Get a fee"
    roles: *all_roles
    code: 200
    input: []
    output: OverdraftFee
    side_effects: []

  # --- FeeWaiverRequest ---
  - method: POST
    path: "/v1/fee-waiver-requests"
    description: "Submit a waiver request; routes to an authority band or auto-applies (staff, <= teller cap)"
    roles: [AccountHolder, Teller, Supervisor, Manager]
    code: 201
    input: [account_id, fee_ids, kind, "amount_cents?", "percent_bps?", reason_code]
    output: FeeWaiverRequest
    side_effects: ["creates WaiverRequestItems", "routes status by computed_total_cents and creator role", "auto band applies waivers immediately"]
  - method: GET
    path: "/v1/fee-waiver-requests"
    description: "List waiver requests (filterable)"
    roles: *all_roles
    code: 200
    input: ["account_id?", "status?"]
    output: "FeeWaiverRequest[]"
    side_effects: []
  - method: GET
    path: "/v1/fee-waiver-requests/{id}"
    description: "Get a waiver request"
    roles: *all_roles
    code: 200
    input: []
    output: FeeWaiverRequest
    side_effects: []
  - method: POST
    path: "/v1/fee-waiver-requests/{id}/approve"
    description: "Approve a pending request within the caller's authority band and apply waivers"
    roles: [Supervisor, Manager, ComplianceOfficer]
    code: 200
    input: []
    output: FeeWaiverRequest
    side_effects: ["runs waiver_allocation application", "fees may -> WAIVED", "account ledger credited", "status -> APPLIED"]
  - method: POST
    path: "/v1/fee-waiver-requests/{id}/deny"
    description: "Deny a pending request (compliance-stage denial is DENIED_FINAL)"
    roles: [Supervisor, Manager, ComplianceOfficer]
    code: 200
    input: []
    output: FeeWaiverRequest
    side_effects: ["status -> DENIED or DENIED_FINAL", "denied_band set"]
  - method: POST
    path: "/v1/fee-waiver-requests/{id}/escalate"
    description: "Move a pending request up one authority band"
    roles: [Supervisor, Manager]
    code: 200
    input: []
    output: FeeWaiverRequest
    side_effects: ["PENDING_SUPERVISOR -> PENDING_MANAGER, or PENDING_MANAGER -> PENDING_COMPLIANCE"]
  - method: POST
    path: "/v1/fee-waiver-requests/{id}/appeal"
    description: "Appeal a DENIED request to the next higher band"
    roles: [AccountHolder, Teller, Supervisor, Manager]
    code: 200
    input: []
    output: FeeWaiverRequest
    side_effects: ["DENIED -> PENDING_MANAGER (from SUPERVISOR denial) or PENDING_COMPLIANCE (from MANAGER denial)"]
  - method: GET
    path: "/v1/waiver-items"
    description: "List waiver request items (filterable by request or fee)"
    roles: *all_roles
    code: 200
    input: ["waiver_request_id?", "fee_id?"]
    output: "WaiverRequestItem[]"
    side_effects: []
  - method: GET
    path: "/v1/waiver-items/{id}"
    description: "Get a waiver request item"
    roles: *all_roles
    code: 200
    input: []
    output: WaiverRequestItem
    side_effects: []

  # --- ProgramChangeNotice ---
  - method: POST
    path: "/v1/notices"
    description: "Create a DRAFT program-change notice (supersedes existing DRAFT on same parameter; OCC on program version)"
    roles: [ProgramAdmin]
    code: 201
    input: [program_id, parameter, new_value, expected_program_version]
    output: ProgramChangeNotice
    side_effects: ["existing DRAFT notice on same program+parameter -> SUPERSEDED", "increments OverdraftProgram.version by 1"]
  - method: GET
    path: "/v1/notices"
    description: "List notices (filterable)"
    roles: *all_roles
    code: 200
    input: ["program_id?", "parameter?", "status?"]
    output: "ProgramChangeNotice[]"
    side_effects: []
  - method: GET
    path: "/v1/notices/{id}"
    description: "Get a notice"
    roles: *all_roles
    code: 200
    input: []
    output: ProgramChangeNotice
    side_effects: []
  - method: POST
    path: "/v1/notices/{id}/issue"
    description: "Issue a DRAFT notice: sets sent_at=clock, effective_at=clock+notice_window_days; enforces window non-overlap"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ProgramChangeNotice
    side_effects: ["status -> ISSUED", "sent_at/effective_at set"]
  - method: POST
    path: "/v1/notices/{id}/activate"
    description: "Activate an ISSUED notice after its window elapsed; applies the new parameter value to the program"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ProgramChangeNotice
    side_effects: ["status -> EFFECTIVE", "program field updated", "increments OverdraftProgram.version by 1"]
  - method: POST
    path: "/v1/notices/{id}/withdraw"
    description: "Withdraw a DRAFT or ISSUED notice before it becomes effective"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ProgramChangeNotice
    side_effects: ["status -> WITHDRAWN"]

  # --- EducationOffer ---
  - method: POST
    path: "/v1/education-offers"
    description: "Banker creates a steering offer (supersedes any OFFERED offer on the account; OCC on account version)"
    roles: [Teller]
    code: 201
    input: [account_id, offer_type, expected_account_version]
    output: EducationOffer
    side_effects: ["existing OFFERED offer -> SUPERSEDED", "trigger_reason=MANUAL", "expires_at = clock + offer_expiry_days", "increments DepositAccount.version by 1"]
  - method: GET
    path: "/v1/education-offers"
    description: "List education offers (filterable)"
    roles: *all_roles
    code: 200
    input: ["account_id?", "status?"]
    output: "EducationOffer[]"
    side_effects: []
  - method: GET
    path: "/v1/education-offers/{id}"
    description: "Get an education offer"
    roles: *all_roles
    code: 200
    input: []
    output: EducationOffer
    side_effects: []
  - method: POST
    path: "/v1/education-offers/{id}/accept"
    description: "Account holder accepts an offer"
    roles: [AccountHolder]
    code: 200
    input: []
    output: EducationOffer
    side_effects: ["status -> ACCEPTED"]
  - method: POST
    path: "/v1/education-offers/{id}/decline"
    description: "Account holder declines an offer"
    roles: [AccountHolder]
    code: 200
    input: []
    output: EducationOffer
    side_effects: ["status -> DECLINED"]

  # --- RegulatoryReport ---
  - method: POST
    path: "/v1/reports"
    description: "Create a regulatory report for a closed period (tiling: no overlap, no gap)"
    roles: [ProgramAdmin, ComplianceOfficer]
    code: 201
    input: [program_id, period_start, period_end]
    output: RegulatoryReport
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/v1/reports"
    description: "List reports (filterable)"
    roles: *all_roles
    code: 200
    input: ["program_id?", "status?"]
    output: "RegulatoryReport[]"
    side_effects: []
  - method: GET
    path: "/v1/reports/{id}"
    description: "Get a report"
    roles: *all_roles
    code: 200
    input: []
    output: RegulatoryReport
    side_effects: []
  - method: POST
    path: "/v1/reports/{id}/finalize"
    description: "Finalize a report: compute revenue bases, waiver ratio, per-overdrafter average, scrutiny flag"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RegulatoryReport
    side_effects: ["runs report_revenue_metrics", "finalized_by_user_id set", "status -> FINALIZED"]
  - method: POST
    path: "/v1/reports/{id}/submit"
    description: "Submit a finalized report (submitter must differ from finalizer)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RegulatoryReport
    side_effects: ["status -> SUBMITTED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not in endpoint's roles" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, invalid enum, non-positive amount, unparseable date, kind-specific field absent" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced id does not exist" }
  - { id: ERR_ACCOUNT_OWNERSHIP_MISMATCH, http: 403, condition: "AccountHolder's X-User-ID does not equal the target account id" }
  - { id: ERR_ACCOUNT_RESTRICTED, http: 409, condition: "RESTRICTED account: new debit authorization or opt-in reinstatement attempted" }
  - { id: ERR_ACCOUNT_CLOSED, http: 409, condition: "CLOSED_VOLUNTARY account any mutation; CLOSED_CHARGEOFF account anything but CREDIT_DEPOSIT recovery" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Transition not valid from the resource's current state" }
  - { id: ERR_FEE_NOT_WAIVABLE, http: 409, condition: "A fee_ids entry references a fee that is WAIVED or VOIDED, or not on the request account" }
  - { id: ERR_PROGRAM_SUSPENDED, http: 409, condition: "Program SUSPENDED: account opening or notice activation attempted" }
  - { id: ERR_STALE_DISCLOSURE_VERSION, http: 409, condition: "disclosure_version != program.current_disclosure_version at election create/reinstate" }
  - { id: ERR_NOTICE_WINDOW_NOT_ELAPSED, http: 409, condition: "Notice activation attempted before effective_at" }
  - { id: ERR_NOTICE_WINDOW_OVERLAP, http: 409, condition: "Notice issue would overlap an existing ISSUED window for the same program+parameter (half-open [sent_at, effective_at))" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 409, condition: "Report closed period intersects an existing report's period (checked before gap)" }
  - { id: ERR_REPORT_PERIOD_GAP, http: 409, condition: "Report period_start is not exactly previous report's period_end + 1 day (first report exempt)" }
  - { id: ERR_NON_BUSINESS_DAY, http: 422, condition: "Batch business_date falls on Saturday or Sunday" }
  - { id: ERR_REVERSAL_WINDOW_CLOSED, http: 409, condition: "Reverse attempted on a transaction whose batch is SETTLED (or CANCELLED)" }
  - { id: ERR_EARLIER_BATCH_UNSETTLED, http: 409, condition: "Settle attempted while an earlier-dated batch of the same program is not SETTLED/CANCELLED" }
  - { id: ERR_OFFER_EXPIRED, http: 409, condition: "Accept/decline attempted when clock > expires_at" }
  - { id: ERR_BATCH_ALREADY_EXISTS, http: 409, condition: "A non-CANCELLED batch already exists for this program + business_date (a CANCELLED batch frees the date)" }
  - { id: ERR_ELECTION_ALREADY_EXISTS, http: 409, condition: "An OptInElection already exists for this account" }
  - { id: ERR_SELF_APPROVAL_FORBIDDEN, http: 409, condition: "Approver/denier X-User-ID equals the waiver request's created_by_user_id" }
  - { id: ERR_SELF_SUBMISSION_FORBIDDEN, http: 409, condition: "Report submitter X-User-ID equals finalized_by_user_id" }
  - { id: ERR_FEE_STATE_CHANGED, http: 409, condition: "At approve, a listed fee is no longer ASSESSED/POSTED (e.g., waived by another request)" }
  - { id: ERR_CLOSE_NEGATIVE_BALANCE, http: 409, condition: "Close attempted with ledger_balance_cents < 0" }
  - { id: ERR_OPEN_ITEMS_BLOCK_CLOSE, http: 409, condition: "Close attempted with ASSESSED fees, PENDING_* waiver requests, or OFFERED offers" }
  - { id: ERR_WAIVER_EXCEEDS_AUTHORITY, http: 409, condition: "Approver's authority band below the request's pending band" }
  - { id: ERR_WAIVER_AMOUNT_INVALID, http: 422, condition: "FIXED_AMOUNT amount_cents > sum of listed fees' outstanding at submit (or <= 0)" }
  - { id: ERR_RECOVERY_EXCEEDS_CHARGEOFF, http: 422, condition: "Recovery credit amount_cents > charged_off_cents" }
  - { id: ERR_STALE_PROGRAM_VERSION, http: 412, condition: "expected_program_version != program.version at notice creation" }
  - { id: ERR_STALE_ACCOUNT_VERSION, http: 412, condition: "expected_account_version != account.version at education-offer creation" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Bank program administrator: owns program configuration, change notices, batches-of-record calendar, report creation, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /v1/programs, POST /v1/programs/{id}/suspend, POST /v1/programs/{id}/resume"
      - "POST /v1/notices, POST /v1/notices/{id}/issue, POST /v1/notices/{id}/withdraw"
      - "POST /v1/_clock/set_current_utc"
    shared_operations:
      - "POST /v1/accounts, POST /v1/accounts/{id}/close (with Teller)"
      - "POST /v1/reports (with ComplianceOfficer)"
      - "all GET endpoints (with all roles)"
  - name: OperationsClerk
    description: "Back-office posting operator: runs the daily batch lifecycle and transaction reversals"
    identity: opaque
    exclusive_operations:
      - "POST /v1/batches, POST /v1/batches/{id}/seal, POST /v1/batches/{id}/settle, POST /v1/batches/{id}/cancel"
      - "POST /v1/transactions/{id}/reverse"
    shared_operations:
      - "all GET endpoints"
  - name: Teller
    description: "Frontline staff: opens accounts, assists opt-in elections, submits waiver requests, creates steering offers"
    identity: opaque
    exclusive_operations:
      - "POST /v1/education-offers"
    shared_operations:
      - "POST /v1/accounts, POST /v1/accounts/{id}/close (with ProgramAdmin)"
      - "POST /v1/accounts/{id}/opt-in-election, POST /v1/opt-in-elections/{id}/revoke, POST /v1/opt-in-elections/{id}/reinstate (with AccountHolder)"
      - "POST /v1/transactions (with AccountHolder)"
      - "POST /v1/fee-waiver-requests, POST /v1/fee-waiver-requests/{id}/appeal (with AccountHolder, Supervisor, Manager)"
      - "all GET endpoints"
  - name: Supervisor
    description: "First-line waiver authority (band <= 20000 cents); may escalate"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /v1/fee-waiver-requests, POST /v1/fee-waiver-requests/{id}/appeal (with AccountHolder, Teller, Manager)"
      - "POST /v1/fee-waiver-requests/{id}/approve, POST /v1/fee-waiver-requests/{id}/deny (with Manager, ComplianceOfficer; band-limited)"
      - "POST /v1/fee-waiver-requests/{id}/escalate (with Manager)"
      - "all GET endpoints"
  - name: Manager
    description: "Branch manager: waiver authority band <= 100000 cents; may escalate to compliance"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "same waiver-request surface as Supervisor, with higher band"
      - "all GET endpoints"
  - name: ComplianceOfficer
    description: "Compliance: unlimited waiver authority, activates change notices, finalizes and submits regulatory reports"
    identity: opaque
    exclusive_operations:
      - "POST /v1/notices/{id}/activate"
      - "POST /v1/reports/{id}/finalize, POST /v1/reports/{id}/submit"
    shared_operations:
      - "POST /v1/fee-waiver-requests/{id}/approve, POST /v1/fee-waiver-requests/{id}/deny (any band)"
      - "POST /v1/reports (with ProgramAdmin)"
      - "all GET endpoints"
  - name: AccountHolder
    description: "The deposit account holder: acts only on the account whose id equals X-User-ID"
    identity: "entity_backed:DepositAccount"
    exclusive_operations:
      - "POST /v1/education-offers/{id}/accept, POST /v1/education-offers/{id}/decline"
    shared_operations:
      - "POST /v1/accounts/{id}/opt-in-election, POST /v1/opt-in-elections/{id}/revoke, POST /v1/opt-in-elections/{id}/reinstate (with Teller; own account only)"
      - "POST /v1/transactions (with Teller; own account only)"
      - "POST /v1/fee-waiver-requests, POST /v1/fee-waiver-requests/{id}/appeal (own account only)"
      - "all GET endpoints"
