    roles: [QualityLead]
    code: 200
    input: ["investigation_note?"]
    output: TrendSignal
    side_effects:
      - "status DETECTED -> INVESTIGATION_OPEN; opened_by_ref stamped"
      - "Plant.open_investigation_count += 1; Plant.oversight_posture re-derived"
  - method: POST
    path: /trend-signals/{id}/dismiss
    description: Dismiss a detected signal as noise.
    roles: [QualityLead]
    code: 200
    input: ["reason?"]
    output: TrendSignal
    side_effects:
      - "status DETECTED -> DISMISSED (terminal); Plant.oversight_posture re-derived"
  - method: POST
    path: /trend-signals/{id}/escalate-recall-evaluation
    description: Escalate an investigation to recall evaluation, freezing every member complaint and every lot in scope.
    roles: [QualityLead]
    code: 200
    input: ["escalation_note?"]
    output: TrendSignal
    side_effects:
      - "status INVESTIGATION_OPEN -> RECALL_EVALUATION"
      - "member complaints not already RESOLVED / CLOSED / DUPLICATE -> ON_QUALITY_HOLD, voiding their live remedies and reconciling the consumer goodwill ledger"
      - "every RELEASED lot in scope -> HOLD; Plant.oversight_posture -> INVESTIGATION_HOLD"
  - method: POST
    path: /trend-signals/{id}/initiate-recall
    description: Initiate the recall.
    roles: [QualityLead]
    code: 200
    input: [recall_reference]
    output: TrendSignal
    side_effects:
      - "status RECALL_EVALUATION -> RECALL_INITIATED (terminal); every lot in scope -> WITHDRAWN"
      - "Plant.recall_initiated_count += 1; oversight_posture stays INVESTIGATION_HOLD"
  - method: POST
    path: /trend-signals/{id}/close-no-action
    description: Close an investigation or recall evaluation without action.
    roles: [QualityLead]
    code: 200
    input: ["closing_note?"]
    output: TrendSignal
    side_effects:
      - "status -> CLOSED_NO_ACTION (terminal); Plant.open_investigation_count -= 1; oversight_posture re-derived"
      - "lots held solely by this signal return to RELEASED"

