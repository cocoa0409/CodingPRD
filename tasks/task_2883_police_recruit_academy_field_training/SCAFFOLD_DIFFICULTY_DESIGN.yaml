  # ===========================================================================

  - rule_id: non_linear_state_machine
    instances:

      - name: screening_retest_loop_reenters_findings_recorded_and_resets_adjudicator
        grounds:
          - state_machines[ScreeningRecord].transitions[FINDINGS_RECORDED -> RETEST_REQUIRED]
          - state_machines[ScreeningRecord].transitions[RETEST_REQUIRED -> FINDINGS_RECORDED]
          - entities.ScreeningRecord.fields.attempt_number
          - entities.ScreeningRecord.fields.adjudicated_by_user_id
          - calculations.physical_fitness_composite
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          The ScreeningRecord graph is not a DAG: FINDINGS_RECORDED -> RETEST_REQUIRED ->
          FINDINGS_RECORDED re-enters a state the row has already occupied, and re-entry is NOT
          idempotent - attempt_number increments, raw_metrics and composite_score are REPLACED
          (earlier attempts are ignored entirely by the composite formula), and
          adjudicated_by_user_id is reset to null so the RETEST decision does not count as this
          attempt's adjudication. RETEST_REQUIRED also has exactly one outgoing trigger: adjudicate
          is not declared from it, so an adjudication attempted mid-loop is rejected while the
          identical call succeeds one state later. A linear ORDERED -> FINDINGS_RECORDED -> terminal
          reading of the machine cannot produce any of these four observations.
        test_recipe:
          setup:
            - "One CertificationStandard with fitness_event_floor_points 10 and fitness_pass_score 60, one AcademyClass, one AGE_20_29 Recruit."
            - "One PHYSICAL_FITNESS ScreeningRecord whose first attempt scored composite 59 (vertical_jump 13 in caps the sum at COMPOSITE_FLOOR_CAP)."
            - "That screening adjudicated RETEST by tc-2, so status is RETEST_REQUIRED, attempt_number 1, adjudicated_by_user_id tc-2, and the recruit's clearance_status is untouched."
            - "Logical clock stays at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /certification-standards"
              payload: { code: "TCOLE-RETEST", state_code: "TX", min_total_hours: 6.00, min_passing_score: 70.00, max_remediation_attempts: 1, max_absence_hours: 4.00, topic_requirements: [{ topic_code: "PATROL", required_hours: 6.00, exam_required: false }], fitness_event_floor_points: 10, fitness_pass_score: 60 }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { std_id: $.data.id }
            - call: "POST /academy-classes"
              payload: { certification_standard_id: "${std_id}", class_code: "CLS-R", start_date: "2026-08-03", planned_seats: 30 }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { class_id: $.data.id }
            - call: "POST /recruits"
              payload: { academy_class_id: "${class_id}", applicant_number: "R-001", full_name: "Alba Reyes", date_of_birth: "1999-04-12", age_bracket: "AGE_20_29" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { rec_id: $.data.id }
            - call: "POST /recruits/${rec_id}/screenings"
              payload: { screening_type: "PHYSICAL_FITNESS" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { scr_id: $.data.id }
            - call: "POST /screening-records/${scr_id}/findings"
              payload: { raw_metrics: { push_ups: 36, sit_ups: 38, run_1_5_mile_seconds: 700, vertical_jump_inches: 13 }, disqualifier_codes: [] }
              as: TrainingCoordinator
              as_user_id: "tc-1"
            - call: "POST /screening-records/${scr_id}/adjudicate"
              payload: { decision: "RETEST" }
              as: TrainingCoordinator
              as_user_id: "tc-2"
          trigger:
            - call: "POST /screening-records/${scr_id}/adjudicate"
              payload: { decision: "CLEAR" }
              as: TrainingCoordinator
              as_user_id: "tc-2"
            - call: "POST /screening-records/${scr_id}/findings"
              payload: { raw_metrics: { push_ups: 36, sit_ups: 38, run_1_5_mile_seconds: 700, vertical_jump_inches: 16 }, disqualifier_codes: [] }
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { comp2: $.data.composite_score, attempt2: $.data.attempt_number }
            - call: "POST /screening-records/${scr_id}/adjudicate"
              payload: { decision: "CLEAR" }
              as: TrainingCoordinator
              as_user_id: "tc-2"
          assert:
            - "POST /screening-records/${scr_id}/adjudicate { decision: 'CLEAR' } from RETEST_REQUIRED -> 409 ERR_INVALID_STATE (adjudicate is not a declared trigger of RETEST_REQUIRED)"
            - "ScreeningRecord.${scr_id}.status == RETEST_REQUIRED  # the rejected adjudication changed nothing"
            - "the retest findings call -> 200"
            - "${attempt2} == 2"
            - "${comp2} == 77"
            - "ScreeningRecord.${scr_id}.status == FINDINGS_RECORDED  # a state the row already occupied"
            - "ScreeningRecord.${scr_id}.attempt_number == 2"
            - "ScreeningRecord.${scr_id}.composite_score == 77  # REPLACED, not merged with the 59 of attempt 1"
            - "ScreeningRecord.${scr_id}.adjudicated_by_user_id == null  # the RETEST adjudicator was cleared by loop re-entry"
            - "ScreeningRecord.${scr_id}.findings_recorded_by_user_id == tc-1"
            - "the second adjudicate CLEAR -> 200; ScreeningRecord.${scr_id}.status == CLEARED and adjudicated_by_user_id == tc-2"
            - "Recruit.${rec_id}.clearance_status == PARTIAL"
            - "Recruit.${rec_id}.pipeline_stage == SCREENING  # auto-advanced by the FIRST screening order, not by the loop"

      - name: rotation_remedial_loop_returns_to_active_but_probation_stays_extension_required
        grounds:
          - state_machines[FieldTrainingRotation].transitions[ACTIVE -> REMEDIAL]
          - state_machines[FieldTrainingRotation].transitions[REMEDIAL -> ACTIVE]
          - state_machines[Recruit.probation_status].transitions[ACTIVE -> EXTENSION_REQUIRED]
          - state_machines[Recruit.probation_status].transitions[EXTENSION_REQUIRED -> ACTIVE]
          - calculations.field_training_competency_score
          - calculations.probation_schedule
        distinguishing_aspect: |
          The rotation dimension loops ACTIVE -> REMEDIAL -> ACTIVE driven purely by the
          recomputed TERMINAL_WEIGHTED score crossing 4.00 in each direction, but the loop is
          ASYMMETRIC across entities: the downward flip cascades into probation_status
          (ACTIVE -> EXTENSION_REQUIRED) and re-derives probation_schedule, while the upward flip
          does NOT undo either. EXTENSION_REQUIRED -> ACTIVE is reachable only through
          POST /recruits/{recruitId}/probation-decisions { decision: 'EXTEND' } or the abort
