            - "error_id == ERR_INVALID_STATE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: inspector_double_booked_halfopen_overlap
        grounds:
          - validations[priority=9]
          - errors[ERR_INSPECTOR_DOUBLE_BOOKED]
          - entities.Inspection.fields.scheduled_start
        distinguishing_aspect: "Inspector occupancy uses HALF-OPEN [start,end): a second inspection [10:00,12:00) overlapping an existing [09:00,11:00) on the same inspector is rejected with ERR_INSPECTOR_DOUBLE_BOOKED, while a back-to-back [11:00,13:00) would be allowed."
        test_recipe:
          setup:
            - "Commissioned inspector A already booked for insp1 on 2026-06-02 [09:00,11:00) against a registered vessel."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: JurisdictionAdmin
            - call: "POST /jurisdictions"
              payload: { code: "CA", name: "California" }
              as: JurisdictionAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /owners"
              payload: { name: "Acme Boilers", contact_email: "o@x.com" }
              as: JurisdictionAdmin
              captures: { owner: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "Insp A", commission_number: "NBC-A", inspector_type: "JURISDICTION", commissioning_jurisdiction_id: "${jur}" }
              as: JurisdictionAdmin
              captures: { insp_a: "$.data.id" }
            - call: "POST /inspectors/${insp_a}/commission"
              payload: {}
              as: JurisdictionAdmin
            - call: "POST /vessels"
              payload: { owner_id: "${owner}", jurisdiction_id: "${jur}", manufacturer: "M", national_board_number: "NBV-1", vessel_class: "POWER_BOILER", mawp_psig: 120, installed_at: "2020-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${owner}"
              captures: { vessel: "$.data.id" }
            - call: "POST /vessels/${vessel}/register"
              payload: {}
              as: JurisdictionAdmin
            - call: "POST /inspections"
              payload: { vessel_id: "${vessel}", inspector_id: "${insp_a}", inspection_type: "EXTERNAL", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: JurisdictionAdmin
              captures: { insp1: "$.data.id" }
          trigger:
            - call: "POST /inspections"
              payload: { vessel_id: "${vessel}", inspector_id: "${insp_a}", inspection_type: "INTERNAL", scheduled_start: "2026-06-02T10:00:00Z", scheduled_end: "2026-06-02T12:00:00Z" }
              as: JurisdictionAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INSPECTOR_DOUBLE_BOOKED"

      - name: policy_coverage_overlap_closed_touching_endpoints
        grounds:
          - validations[priority=9]
          - errors[ERR_POLICY_COVERAGE_OVERLAP]
          - entities.InsurancePolicy.fields.coverage_end
        distinguishing_aspect: "InsurancePolicy coverage uses a CLOSED interval [start,end]: a new policy [2026-06-01,2026-12-01] whose start TOUCHES an existing policy's end 2026-06-01 is rejected with ERR_POLICY_COVERAGE_OVERLAP — the opposite adjacency rule to the inspector's half-open window, on a different resource (Vessel policies)."
        test_recipe:
          setup:
            - "Vessel with an ACTIVE policy1 covering [2026-01-01, 2026-06-01] from insurer X."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: JurisdictionAdmin
            - call: "POST /jurisdictions"
              payload: { code: "CA", name: "California" }
              as: JurisdictionAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /owners"
              payload: { name: "Acme Boilers", contact_email: "o@x.com" }
              as: JurisdictionAdmin
              captures: { owner: "$.data.id" }
            - call: "POST /insurance-companies"
              payload: { name: "Insurer X", nb_accreditation_number: "NBA-X" }
              as: JurisdictionAdmin
              captures: { ins_x: "$.data.id" }
            - call: "POST /vessels"
              payload: { owner_id: "${owner}", jurisdiction_id: "${jur}", manufacturer: "M", national_board_number: "NBV-1", vessel_class: "PRESSURE_VESSEL", mawp_psig: 300, installed_at: "2020-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${owner}"
              captures: { vessel: "$.data.id" }
            - call: "POST /insurance-policies"
              payload: { vessel_id: "${vessel}", insurance_company_id: "${ins_x}", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2026-06-01T00:00:00Z" }
              as: JurisdictionAdmin
              captures: { pol1: "$.data.id" }
          trigger:
            - call: "POST /insurance-policies"
              payload: { vessel_id: "${vessel}", insurance_company_id: "${ins_x}", coverage_start: "2026-06-01T00:00:00Z", coverage_end: "2026-12-01T00:00:00Z" }
              as: JurisdictionAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_POLICY_COVERAGE_OVERLAP"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: fee_ledger_conserved_on_pay_then_refund_money
        grounds:
          - state_machines.FeeInvoice.UNPAID_to_PAID
          - state_machines.FeeInvoice.PAID_to_REFUNDED
          - entities.Jurisdiction.fields.collected_fees_cents
        distinguishing_aspect: "The named conserved MONEY quantity Jurisdiction.collected_fees_cents returns to its pre-pay value 0 after pay (+26338) then refund (-26338) — a forward action paired with its exact compensating action leaves the ledger unchanged."
        test_recipe:
          setup:
            - "Registered POWER_BOILER (MAWP 120); an UNPAID fee invoice fee1 (FINAL amount 26338, 0 deficiencies) not tied to any certificate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: JurisdictionAdmin
            - call: "POST /jurisdictions"
              payload: { code: "CA", name: "California" }
              as: JurisdictionAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /owners"
              payload: { name: "Acme Boilers", contact_email: "o@x.com" }
              as: JurisdictionAdmin
              captures: { owner: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "Insp A", commission_number: "NBC-A", inspector_type: "JURISDICTION", commissioning_jurisdiction_id: "${jur}" }
              as: JurisdictionAdmin
              captures: { insp_a: "$.data.id" }
            - call: "POST /inspectors/${insp_a}/commission"
              payload: {}
              as: JurisdictionAdmin
            - call: "POST /vessels"
