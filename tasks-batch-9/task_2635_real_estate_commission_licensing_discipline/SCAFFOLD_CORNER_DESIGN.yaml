      - name: designated_broker_must_be_a_broker_in_a_licensable_state
        claim_type: violation_to_error
        grounds:
          - validations[priority=23]
          - errors.ERR_DESIGNATED_BROKER_NOT_BROKER
          - state_machines.Brokerage.PENDING_to_ACTIVE
        distinguishing_aspect: |
          Two distinct ways to fail one rule at two different endpoints: a SALESPERSON can never be a
          designated broker (person_type), and a BROKER still in APPLICANT cannot be one yet
          (license_status must be EXAM_PASSED or ACTIVE). The same rule is re-evaluated at activation,
          so a brokerage cannot be registered against a valid broker and then activated after the
          broker's licence collapses.
        test_recipe:
          setup:
            - "Sam Sales is an EXAM_PASSED salesperson; Ned New is an APPLICANT broker with 180 hours and no exam result"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "SALESPERSON", full_name: "Sam Sales", prelicense_hours: 90 }
              as: LicensingAnalyst
              captures: { sam_id: $.data.id }
            - call: "POST /commission/licensees/${sam_id}/exam-results"
              payload: { score: 84, taken_on: "2026-07-05" }
              as: LicensingAnalyst
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Ned New", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { ned_id: $.data.id }
          trigger:
            - call: "POST /commission/brokerages"
              payload: { name: "Sales Only Group", designated_broker_id: "${sam_id}", trust_account_required: false, record_retention_years: 5 }
              as: LicensingAnalyst
              captures: { e1: $.data.error_id }
            - call: "POST /commission/brokerages"
              payload: { name: "Ned Group", designated_broker_id: "${ned_id}", trust_account_required: false, record_retention_years: 5 }
              as: LicensingAnalyst
              captures: { e2: $.data.error_id }
            - call: "POST /commission/licensees/${ned_id}/exam-results"
              payload: { score: 91, taken_on: "2026-07-25" }
              as: LicensingAnalyst
            - call: "POST /commission/brokerages"
              payload: { name: "Ned Group", designated_broker_id: "${ned_id}", trust_account_required: false, record_retention_years: 5 }
              as: LicensingAnalyst
              captures: { bkg_id: $.data.id }
          assert:
            - "naming the SALESPERSON returns 422 ERR_DESIGNATED_BROKER_NOT_BROKER even though Sam is EXAM_PASSED"
            - "naming the APPLICANT broker returns 422 ERR_DESIGNATED_BROKER_NOT_BROKER - person_type is right, license_status is not"
            - "GET /commission/brokerages returns total_count == 0 after both refusals"
            - "once Ned passes with 91 the identical registration returns 201 as ${bkg_id} with status == PENDING, supervision_posture == COMPLIANT and affiliated_licensee_count == 0"
      - name: prelicense_hours_below_the_class_requirement_block_the_exam_result
        claim_type: violation_to_error
        grounds:
          - validations[priority=36]
          - errors.ERR_PRELICENSE_HOURS_INSUFFICIENT
        distinguishing_aspect: |
          The hour floor is per person_type (SALESPERSON 90, BROKER 180) and is enforced when the exam
          result is recorded, not at application - so the same 90 hours that let a salesperson sit the
          exam bar a broker, and the refused attempt must not consume an exam attempt.
        test_recipe:
          setup:
            - "Bea Broker applied as a BROKER with only 90 classroom hours; Sam Sales applied as a SALESPERSON with 90"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Bea Broker", prelicense_hours: 90 }
              as: LicensingAnalyst
              captures: { bea_id: $.data.id }
            - call: "POST /commission/licensees"
