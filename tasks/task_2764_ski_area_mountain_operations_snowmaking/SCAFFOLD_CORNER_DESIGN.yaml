        claim_type: cascading_side_effects
        grounds:
          - endpoints[POST /mountain-ops/day-plans/{id}/weather]
          - state_machines.Lift.OPEN_to_WIND_HOLD
          - state_machines.GroomingTask.PLANNED_to_DEFERRED
          - entities.SeasonConfig.fields.water_reserved_af
        excluded_because:
          difficulty_instance: weather_wind_hold_cascade_depth_four_to_season_water_ledger
          rationale: "The section 1.8 instance already drives the same head-of-cascade call across two lifts and three areas with PLANNED and DISPATCHED grooming tasks and RUNNING sessions, asserting the lift_code ASC and trail_code ASC orderings, the DEFERRED task set and the exact water refund; the corner instance above adds only the conditional per-area re-gate on the way back, so a second end-to-end depth test would be redundant."

  - section: consistency_model
    instances:
      - name: every_cascade_effect_is_already_visible_in_the_response_body_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope
          - endpoints[POST /mountain-ops/day-plans/{id}/weather]
          - entities.SeasonConfig.fields.water_reserved_af
          - entities.PumpHouse.fields.peak_committed_gpm
        distinguishing_aspect: |
          The declared consistency model is immediate, and the deepest cascade in the system is the place
          where a queue or a deferred recompute would be tempting: one weather call has to move a lift, a
          terrain area, a snowmaking session, a pump house commitment and the season water ledger. The
          claim under test is that the mutating call's OWN response body already carries the settled
          numbers - not the pre-cascade ones - and that every follow-up read agrees with it on the first
          attempt, with no retry, no sleep and no second write. The final pair of triggers closes the other
          loophole: repeating the read does not move anything, so nothing converged in the background
          between the two reads.
        test_recipe:
          setup:
            - "A season OPERATING with lift L1 (wind_hold_threshold_mph 40.0) OPEN at 1800 pph, one OPEN area of 18.0 acres on a PUBLISHED_FULL day plan, and an ONLINE pump house PH1 of max_gpm 2400."
            - "One SCHEDULED snowmaking session on that area over [05:00, 12:00) at 1200 gpm, reserving 1.547 acre-feet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
              payload: { season_label: "2026-27", base_depth_policy: "MEAN_OF_STAKES", water_right_seasonal_af: 250.000, plant_max_gpm: 6000, snowmaking_kwh_per_af: 620.0, min_patrollers_per_open_area: 2, groom_freshness_hours: 18, energy_windows: [{ code: "OFF_1", start_hour_utc: 0, end_hour_utc: 6, price_usd_per_kwh: 0.062, tier: "OFF_PEAK" }, { code: "MID_1", start_hour_utc: 6, end_hour_utc: 9, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }, { code: "ON_1", start_hour_utc: 9, end_hour_utc: 21, price_usd_per_kwh: 0.187, tier: "ON_PEAK" }, { code: "MID_2", start_hour_utc: 21, end_hour_utc: 24, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }] }
              as: MountainOpsDirector
              captures: { season_id: $.data.id }
            - call: "POST /mountain-ops/lifts"
              payload: { season_id: "${season_id}", lift_code: "L1", name: "Summit Express", lift_type: "DETACHABLE", wind_hold_threshold_mph: 40.0, hourly_capacity_pph: 1800, required_operator_count: 2 }
