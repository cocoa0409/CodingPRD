              as_user_id: "${insb}"
          assert:
            - "claim A: exclusion_basis AGGREGATE_PRORATION (the verifying graph supersedes nothing), eligible_damage_usd 2000.00, excluded_pre_existing_usd 0.00"
            - "claim A: deductible_usd == 140.00 — rate 0.07, because 2000.00 < 2000.00 is FALSE at the tier-1 boundary"
            - "claim A: projected_payout_usd == 1860.00, well under the 11664.00 headroom, so the cap does not bind"
            - "claim B: eligible_damage_usd 1999.99 but deductible_usd == 200.00 — rate 0.10 and round_half_up(199.999, 2) rounds the third decimal UP"
            - "claim B: projected_payout_usd == 1799.99, i.e. 60.01 LESS than claim A despite a one-cent-smaller claim — the tier edge dominates"
            - "the withdrawal between the two verifications released claim A's 1860.00 reserve, so claim B's cap_headroom_usd is the full 11664.00 and ERR_CLAIM_ALREADY_RESERVED does not fire"

      - name: conducive_ledger_counts_distinct_codes_of_the_latest_graph_only
        claim_type: input_set_filtering
        grounds:
          - calculations.conducive_condition_ledger
          - entities.Property.total_conducive_condition_count
          - entities.Inspection.conducive_condition_count
        distinguishing_aspect: >-
          Two different counts are maintained over the same rows: Inspection.conducive_condition_count
          counts ROWS while the property ledger counts DISTINCT codes, so a graph with two
          EXCESS_MOISTURE cells reports 3 and 2 respectively. And when a later graph is completed,
          the earlier GRAPHED inspection stops contributing entirely — the ledger is not cumulative
          and is not a union across graphs.
        test_recipe:
          setup:
            - "P1 with graph A (two EXCESS_MOISTURE cells plus one WOOD_TO_GROUND cell) and a second graph B holding a single FAULTY_GRADE cell."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "411 Cypress Row", state_code: "FL", construction_type: "CRAWLSPACE", square_footage: 1400, linear_footage: 150, year_built: 1968, crawl_clearance_inches: 14 }
              as: ComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Rosa Vance", license_number: "FL-10001", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insb: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "INITIAL", scheduled_start_at: "2026-08-01T13:00:00Z", scheduled_end_at: "2026-08-01T15:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { insA: $.data.id }
            - call: "POST /inspections/${insA}/findings"
              payload: { finding_type: "CONDUCIVE_CONDITION", grid_ref: "A1", conducive_code: "EXCESS_MOISTURE", severity: 2 }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /inspections/${insA}/findings"
              payload: { finding_type: "CONDUCIVE_CONDITION", grid_ref: "A2", conducive_code: "EXCESS_MOISTURE", severity: 1 }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /inspections/${insA}/findings"
              payload: { finding_type: "CONDUCIVE_CONDITION", grid_ref: "A3", conducive_code: "WOOD_TO_GROUND", severity: 3 }
              as: FieldInspector
              as_user_id: "${insb}"
          trigger:
            - call: "POST /inspections/${insA}/graph-complete"
              payload: {}
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "GET /properties/${p1}"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "INITIAL", scheduled_start_at: "2026-08-04T13:00:00Z", scheduled_end_at: "2026-08-04T15:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { insB: $.data.id }
            - call: "POST /inspections/${insB}/findings"
              payload: { finding_type: "CONDUCIVE_CONDITION", grid_ref: "J10", conducive_code: "FAULTY_GRADE", severity: 1 }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "GET /properties/${p1}"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /inspections/${insB}/graph-complete"
              payload: {}
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "GET /properties/${p1}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "after graph A completes: the property reads total_conducive_condition_count 2, waived 0, open 2 — the duplicated EXCESS_MOISTURE code counts once"
            - "graph A itself reads conducive_condition_count 3 and findings_count 3 — the per-row surcharge basis, deliberately different from the distinct-code ledger"
            - "while graph B is still DRAFT the property ledger is UNCHANGED at 2: a DRAFT graph contributes nothing even though its finding row exists"
            - "after graph B completes at 2026-08-05 the property reads total 1, waived 0, open 1 — graph A's two codes drop out entirely rather than accumulating to 3"
            - "graph A is still status GRAPHED (nothing superseded it); it is simply no longer the latest by (graph_completed_at, sequence_no)"
            - "active_infestation_on_record stays false throughout, and open + waived == total holds after every one of the three reads"

      - name: wdo_due_at_and_required_form_are_keyed_on_the_property_state
        claim_type: constants_applied
        grounds:
