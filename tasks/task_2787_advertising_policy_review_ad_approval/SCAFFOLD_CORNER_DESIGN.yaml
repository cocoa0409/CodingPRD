      - name: projection_first_matching_destination_clause_wins_over_every_later_clause
        claim_type: Correct Result
        grounds:
          - calculations.destination_check_result
          - state_machines.AdCreative.destination_status
        distinguishing_aspect: |
          Five checks walk the clause ladder from the top down on one creative: an
          unreachable fetch that also has a wrong host and a wrong category reports only
          DEST_UNREACHABLE, and a wrong host with a wrong category reports only
          HOST_MISMATCH — CATEGORY_MISMATCH is reachable only once the earlier clauses
          are all satisfied.
        test_recipe:
          setup:
            - "Rule FIN_CREDIT (REGULATED, weight 4.00, auto 0.90, manual 0.55) with no override; one verified advertiser."
            - "A second rule ADULT_CONTENT exists only so that the mismatching fetched_content_category is an existing PolicyRule.code and therefore survives validations[priority=84]; it is never declared on the creative and never matched by a classifier decision."
            - "One creative declaring FIN_CREDIT with display_url host www.beaconlending.example, submitted and screened at confidence 0.30 so it lands AUTO_APPROVED."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "FIN_CREDIT", title: "Consumer credit offers", category_class: "REGULATED", base_severity_weight: 4.00, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.55 }
              as: PolicyAdmin
              captures: { fin_id: "$.data.id" }
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "ADULT_CONTENT", title: "Adult content", category_class: "PROHIBITED", base_severity_weight: 18.00 }
              as: PolicyAdmin
              captures: { adult_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Beacon Lending Co", country_code: "US", industry_code: "CONSUMER_FINANCE" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "BUSINESS_STANDING", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Clause ladder", body_text: "A creative used to walk every destination verdict clause in order.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/ladder", display_url: "https://www.beaconlending.example/ladder" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${fin_id}", confidence: 0.30, matched_snippet: "destination verdict clause" }], expected_ad_creative_version: "${cr_v}" }
              as: PolicyAdmin
          trigger:
            - call: "POST /ad-policy/ad-creatives/${cr_id}/destination-checks"
              payload: { check_type: "INITIAL", user_agent_variant: "CRAWLER", fetched_final_url: "https://down.other-host.example/ladder", fetched_content_category: "ADULT_CONTENT", http_status: 503 }
              as: IntegrityAnalyst
              captures: { chk1: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/destination-checks"
              payload: { check_type: "RECHECK", user_agent_variant: "CRAWLER", fetched_final_url: "https://www.beaconlending.example/ladder", fetched_content_category: "GENERAL", http_status: 200 }
              as: IntegrityAnalyst
              captures: { chk2: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/destination-checks"
              payload: { check_type: "RECHECK", user_agent_variant: "CRAWLER", fetched_final_url: "https://promo.other-host.example/ladder", fetched_content_category: "ADULT_CONTENT", http_status: 200 }
              as: IntegrityAnalyst
              captures: { chk3: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/destination-checks"
              payload: { check_type: "RECHECK", user_agent_variant: "CRAWLER", fetched_final_url: "https://www.beaconlending.example/ladder", fetched_content_category: "GENERAL", http_status: 200 }
              as: IntegrityAnalyst
              captures: { chk4: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/destination-checks"
              payload: { check_type: "RECHECK", user_agent_variant: "CRAWLER", fetched_final_url: "https://www.beaconlending.example/ladder", fetched_content_category: "ADULT_CONTENT", http_status: 200 }
              as: IntegrityAnalyst
              captures: { chk5: "$.data.id" }
            - call: "GET /ad-policy/ad-creatives/${cr_id}"
              payload: {}
              as: PolicyAdmin
          assert:
            - "DestinationCheck.${chk1}.result == MISMATCH with mismatch_detail DEST_UNREACHABLE — clause 1 wins even though the host and the category are also wrong"
            - "DestinationCheck.${chk2}.result == CLEARED with mismatch_detail null, moving the axis MISMATCH_FLAGGED -> DESTINATION_CLEARED"
            - "DestinationCheck.${chk3}.result == MISMATCH with mismatch_detail HOST_MISMATCH — clause 3 wins over clause 4 although the category is also wrong; the axis returns to MISMATCH_FLAGGED"
            - "DestinationCheck.${chk4}.result == CLEARED with mismatch_detail null, back to DESTINATION_CLEARED"
            - "DestinationCheck.${chk5}.result == MISMATCH with mismatch_detail CATEGORY_MISMATCH — reachable only once clauses 1 to 3 are all satisfied (ADULT_CONTENT is an existing rule code, so it passes validations[priority=84], but it is not one of the creative's declared category codes)"
            - "No check ever reports CLOAKING: every trigger used the CRAWLER variant, so clause 2 is unreachable throughout and destination_status ends at MISMATCH_FLAGGED"
            - "AdCreative.${cr_id}.review_status == PENDING_MANUAL_REVIEW (the first MISMATCH re-routed it off AUTO_APPROVED) and exactly one ReviewTask exists for the creative"

      - name: constraint_propagation_serving_gate_appends_every_failing_conjunct_in_the_declared_order
        claim_type: Correct Result
        grounds:
          - calculations.serving_eligibility_gate
          - entities.AdCreative.blocking_reason_codes
        distinguishing_aspect: |
          blocking_reason_codes is an ordered projection of the four conjuncts, not a set:
          a DRAFT political creative under a suspended account must report exactly
          [REVIEW_NOT_APPROVED, DESTINATION_NOT_CLEARED, ACCOUNT_ENFORCEMENT,
          POLITICAL_ARCHIVE_MISSING], while its non-political sibling on the same account
          reports the first three only.
        test_recipe:
          setup:
            - "Rule POL_ISSUE (REGULATED, weight 5.00) with no override; one advertiser verified on identity and business standing (version 3) whose political_eligibility_status is left at NOT_REQUESTED."
            - "Two DRAFT creatives created before any enforcement: one with political_flag true, one plain."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "POL_ISSUE", title: "Political and social issue advertising", category_class: "REGULATED", base_severity_weight: 5.00 }
              as: PolicyAdmin
              captures: { pol_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Civic Voice Committee", country_code: "US", industry_code: "POLITICAL_COMMITTEE" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "BUSINESS_STANDING", outcome: "VERIFIED" }
              as: PolicyAdmin
              captures: { adv_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Vote yes on measure four", body_text: "Measure four funds neighbourhood transit repairs across the county.", declared_category_codes: ["POL_ISSUE"], target_country_codes: ["US"], landing_page_url: "https://www.civicvoice.example/measure4", display_url: "https://www.civicvoice.example/measure4", political_flag: true, disclaimer_text: "Paid for by Civic Voice Committee" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { pol_cr: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Volunteer with us", body_text: "Volunteer with our committee at the county fair this weekend.", declared_category_codes: ["POL_ISSUE"], target_country_codes: ["US"], landing_page_url: "https://www.civicvoice.example/volunteer", display_url: "https://www.civicvoice.example/volunteer" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { plain_cr: "$.data.id" }
          trigger:
            - call: "POST /ad-policy/advertisers/${adv_id}/enforcement-actions"
              payload: { action_type: "SUSPENSION", trigger_reason: "Account suspended pending an offline compliance review", expected_advertiser_version: "${adv_v}" }
              as: PolicyAdmin
            - call: "GET /ad-policy/ad-creatives/${pol_cr}"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/ad-creatives/${plain_cr}"
              payload: {}
              as: PolicyAdmin
            - call: "POST /ad-policy/ad-creatives/${pol_cr}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "Advertiser.${adv_id}.account_status == SUSPENDED"
            - "AdCreative.${pol_cr}.serving_eligible == false with blocking_reason_codes == [REVIEW_NOT_APPROVED, DESTINATION_NOT_CLEARED, ACCOUNT_ENFORCEMENT, POLITICAL_ARCHIVE_MISSING] in exactly that order"
            - "AdCreative.${plain_cr}.serving_eligible == false with blocking_reason_codes == [REVIEW_NOT_APPROVED, DESTINATION_NOT_CLEARED, ACCOUNT_ENFORCEMENT] — the political conjunct passes for a non-political creative"
            - "Both creatives are still review_status DRAFT and destination_status NOT_CHECKED: the suspension cascade moves only PENDING_MANUAL_REVIEW creatives to SUSPENDED_HOLD"
            - "The final submit attempt returns HTTP 409 with error_id ERR_ADVERTISER_SUSPENDED (priority 52), confirming the gate and the validation are separate mechanisms"

