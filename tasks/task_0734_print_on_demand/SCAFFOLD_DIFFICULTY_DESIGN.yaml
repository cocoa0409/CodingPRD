              captures: { creator_id: $.data.id }
            - call: "POST /pod/creators/${creator_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: PlatformAdmin
            - call: "POST /pod/storefronts"
              payload: { creator_id: "${creator_id}", slug: "g-sf", integration_channel: "NATIVE", markup_bps: 5000 }
              as: Creator
