  - name: computed_and_system_fields_input_ignored_on_create
    claim_type: computed_fields
    grounds:
    - entities.InstallationZone.fields.thermal_movement_allowance_mm
    - entities.InstallationZone.fields.install_status
    - endpoints[POST /installation-zones]
    - validations[priority=25]
    distinguishing_aspect: 'Computed and system fields are not part of the endpoint input contract: a create payload that
      also carries thermal_movement_allowance_mm 99.99, install_status PANELS_HUNG and version 7 is either rejected as ERR_INVALID_REQUEST
      or stored with the server-derived values 7.34 / PLANNED / 1 - the client values are never honoured.'
    test_recipe:
      setup:
      - logical clock 2026-08-03T08:00:00Z; package decided UNITIZED with design_temp_delta_c 60.0
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T08:00:00Z'
        as: CWProjectManager
      - call: POST /facade-packages
        payload:
          name: Tower A Facade
          floor_count: 20
          total_area_sqm: 9000.0
