  - section: endpoints
    instances:
      - name: rate_cases_list_paginates_with_envelope
        claim_type: listing
        grounds:
          - "endpoints: GET /api/programs/{id}/rate-cases"
          - "response_envelope.pagination_fields"
        distinguishing_aspect: "List responses carry the fixed envelope: meta.api_request_id, response_type array, and pagination fields; limit=1 pages a 2-case list into exactly 1 item per page with has_more flipping."
        test_recipe:
          setup: ["program M1 with two DRAFT rate cases (proposed 8 and 9)"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id", prog_v: "$.data.version" } }
            - { call: "POST /api/programs/${prog_id}/rate-cases", payload: { proposed_rate: 8, effective_month: "2027-01", demand_backlog_units: 100, expected_program_version: "${prog_v}" }, as: ProductionPlanner, captures: { rc1: "$.data.id" } }
            - { call: "GET /api/programs/${prog_id}", payload: {}, as: ProgramAdmin, captures: { prog_v2: "$.data.version" } }
            - { call: "POST /api/programs/${prog_id}/rate-cases", payload: { proposed_rate: 9, effective_month: "2027-01", demand_backlog_units: 100, expected_program_version: "${prog_v2}" }, as: ProductionPlanner, captures: { rc2: "$.data.id" } }
          trigger:
            - { call: "GET /api/programs/${prog_id}/rate-cases?limit=1&offset=0", payload: {}, as: ProductionPlanner, captures: { first_id: "$.data[0].id" } }
            - { call: "GET /api/programs/${prog_id}/rate-cases?limit=1&offset=1", payload: {}, as: ProductionPlanner, captures: { second_id: "$.data[0].id" } }
          assert:
            - "page 1 returns exactly 1 item with total_count == 2 and has_more == true; envelope carries meta.api_request_id and response_type == array"
            - "page 2 (offset 1) returns exactly 1 item with has_more == false"
            - "the two pages return the two distinct case ids ${rc1} and ${rc2}"
      - name: rate_cases_list_filters_by_status
        claim_type: listing
        grounds:
          - "endpoints: GET /api/programs/{id}/rate-cases"
        distinguishing_aspect: "The status filter selects exactly the matching subset: after shelving one of two cases, status=SHELVED returns 1 item and status=DRAFT returns the other."
        test_recipe:
          setup: ["program M1 with rate case A (DRAFT) and rate case B (SHELVED)"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id", prog_v: "$.data.version" } }
            - { call: "POST /api/programs/${prog_id}/rate-cases", payload: { proposed_rate: 8, effective_month: "2027-01", demand_backlog_units: 100, expected_program_version: "${prog_v}" }, as: ProductionPlanner, captures: { rc_a: "$.data.id" } }
            - { call: "GET /api/programs/${prog_id}", payload: {}, as: ProgramAdmin, captures: { prog_v2: "$.data.version" } }
            - { call: "POST /api/programs/${prog_id}/rate-cases", payload: { proposed_rate: 9, effective_month: "2027-01", demand_backlog_units: 100, expected_program_version: "${prog_v2}" }, as: ProductionPlanner, captures: { rc_b: "$.data.id" } }
            - { call: "POST /api/rate-cases/${rc_b}/shelve", payload: {}, as: ProductionPlanner }
          trigger:
            - { call: "GET /api/programs/${prog_id}/rate-cases?status=SHELVED", payload: {}, as: ProductionPlanner, captures: { shelved_id: "$.data[0].id" } }
            - { call: "GET /api/programs/${prog_id}/rate-cases?status=DRAFT", payload: {}, as: ProductionPlanner, captures: { draft_id: "$.data[0].id" } }
          assert:
            - "status=SHELVED returns exactly case ${rc_b} (total_count 1)"
            - "status=DRAFT returns exactly case ${rc_a} (total_count 1)"
      - name: cascade_created_rework_discoverable_via_work_package_listing
        claim_type: parent_relationships
        grounds:
          - "entities.ReworkOrder.fields.work_package_id"
          - "endpoints: GET /api/work-packages/{id}/rework-orders"
        distinguishing_aspect: "The TRAVELED_WORK rework order is created as a cascade side effect of travel (never in any creation response); the work-package reverse listing is its discovery channel and returns it with work_package_id set."
        test_recipe:
          setup: ["program M1, customer AL1, aircraft line 1023 with one traveled work package"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 1023, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id" } }
