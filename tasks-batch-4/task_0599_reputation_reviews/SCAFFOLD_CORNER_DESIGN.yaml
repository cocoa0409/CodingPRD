scaffold_corner_design:
  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: business_create_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Business.fields.plan_tier
          - entities.Business.fields.default_frequency_cap_days
          - entities.Business.fields.location_count
        distinguishing_aspect: "Omitting plan_tier and default_frequency_cap_days yields BASIC and 30; location_count starts at 0 and version at 1."
        test_recipe:
          setup:
            - "Empty database; logical clock at its startup default 2026-05-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Minimal Co" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
          trigger:
            - call: "GET /reputation/businesses/${biz_id}"
              payload: {}
              as: PlatformAdmin
              captures: { tier: $.data.plan_tier }
          assert:
            - "Business.${biz_id}.plan_tier == BASIC"
            - "Business.${biz_id}.default_frequency_cap_days == 30"
            - "Business.${biz_id}.location_count == 0"
            - "Business.${biz_id}.version == 1"
            - "Business.${biz_id}.created_at == 2026-05-01T00:00:00.000Z"

      - name: location_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_LOCATION_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unknown location UUID on GET /reputation/locations/{location_id} returns 404 ERR_LOCATION_NOT_FOUND, not 200 with an empty body."
        test_recipe:
          setup:
            - "Empty database (no Location has ever been created)."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
          trigger:
            - call: "GET /reputation/locations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_LOCATION_NOT_FOUND"
            - "response_type == error"

      - name: review_ingest_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=6]
          - entities.Review.fields.rating
        distinguishing_aspect: "Ingesting a review without the required `rating` field returns 400 ERR_INVALID_REQUEST and creates no Review row."
        test_recipe:
          setup:
            - "One Business and one Location; clock at default 2026-05-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
          trigger:
            - call: "POST /reputation/locations/${loc_id}/reviews"
              payload: { site: "GOOGLE", external_review_id: "g-r1", author_name: "Ann", text: "No stars given", posted_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "Location.${loc_id}.review_count == 0"

      - name: review_ingest_rating_out_of_range_rejected
        claim_type: type_constraints
        grounds:
          - entities.Review.fields.rating
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=6]
        distinguishing_aspect: "rating 6 sits outside the declared 1..5 band and is rejected with 400 ERR_INVALID_REQUEST before any sentiment is assigned."
        test_recipe:
          setup:
            - "One Business and one Location; clock at default 2026-05-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
          trigger:
            - call: "POST /reputation/locations/${loc_id}/reviews"
              payload: { site: "GOOGLE", external_review_id: "g-r1", author_name: "Ann", rating: 6, text: "Off scale", posted_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "Location.${loc_id}.review_count == 0"

      - name: widget_system_fields_minted_by_server
        claim_type: system_fields
        grounds:
          - entities.Widget.fields.embed_token
          - entities.Widget.fields.status
          - entities.Widget.fields.published_at
        distinguishing_aspect: "POST /reputation/locations/{location_id}/widget with only min_rating/max_reviews yields status DRAFT, published_at null and a server-minted embed_token that no client input supplied."
        test_recipe:
          setup:
            - "One Business and one Location; clock at default 2026-05-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
          trigger:
            - call: "POST /reputation/locations/${loc_id}/widget"
              payload: { min_rating: 4, max_reviews: 10 }
              as: PlatformAdmin
              captures: { wid: $.data.id, tok: $.data.embed_token }
          assert:
            - "HTTP status == 201"
            - "Widget.${wid}.status == DRAFT"
            - "Widget.${wid}.published_at == null"
            - "Widget.${wid}.embed_token is a non-empty string"
            - "Widget.${wid}.min_rating == 4 and Widget.${wid}.max_reviews == 10"

      - name: widget_create_omitting_optionals_uses_defaults
        claim_type: defaults
        grounds:
          - entities.Widget.fields.min_rating
          - entities.Widget.fields.max_reviews
        distinguishing_aspect: "Omitting min_rating and max_reviews yields the declared defaults 4 and 10 respectively."
        test_recipe:
          setup:
            - "One Business and one Location; clock at default 2026-05-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
          trigger:
            - call: "POST /reputation/locations/${loc_id}/widget"
              payload: {}
              as: PlatformAdmin
              captures: { wid: $.data.id }
          assert:
            - "Widget.${wid}.min_rating == 4"
            - "Widget.${wid}.max_reviews == 10"
            - "Widget.${wid}.status == DRAFT"

      - name: competitor_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.Competitor.fields.avg_rating
          - entities.Competitor.fields.review_count
        distinguishing_aspect: "Competitor is declared common_fields: false, so its create response carries id and created_at but no version and no updated_at, and §1.5 exposes no update endpoint for it."
        test_recipe:
          setup:
            - "One Business and one Location; clock at default 2026-05-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
          trigger:
            - call: "POST /reputation/locations/${loc_id}/competitors"
              payload: { name: "Rival Dental", site: "GOOGLE", avg_rating: 4.20, review_count: 80 }
              as: PlatformAdmin
              captures: { comp: $.data.id }
          assert:
            - "HTTP status == 201"
            - "the Competitor object exposes `id` and `created_at` but NO `version` and NO `updated_at` key"
            - "GET /reputation/locations/${loc_id}/competitors returns exactly one Competitor with avg_rating == 4.20 and review_count == 80"

      - name: contacts_list_paginates_with_limit_offset
        claim_type: listing
        grounds:
          - entities.Contact.fields.business_id
          - endpoints
        distinguishing_aspect: "GET /reputation/businesses/{business_id}/contacts with limit 2 and offset 2 over three contacts returns one row, total_count 3 and has_more false."
        test_recipe:
          setup:
            - "One Business with exactly three contacts; clock at default 2026-05-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/contacts"
              payload: { full_name: "E One", email: "e1@example.com" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/contacts"
              payload: { full_name: "E Two", email: "e2@example.com" }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/contacts"
              payload: { full_name: "E Three", email: "e3@example.com" }
              as: PlatformAdmin
              captures: { c3: $.data.id }
          trigger:
            - call: "GET /reputation/businesses/${biz_id}/contacts"
              payload: { limit: 2, offset: 2 }
              as: PlatformAdmin
              captures: { first_id: "$.data[0].id" }
          assert:
            - "HTTP status == 200 and response_type == array"
            - "meta pagination: total_count == 3, has_more == false, limit == 2, offset == 2"
            - "exactly 1 Contact row is returned"

  # =========================================================================
  # State machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: verify_an_already_verified_review_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Review.UNVERIFIED_to_VERIFIED
          - errors[ERR_INVALID_STATE]
          - validations[priority=10]
        distinguishing_aspect: "There is no VERIFIED -> VERIFIED transition, so a second verify on the same review is rejected with 409 ERR_INVALID_STATE and no counter is double-counted."
        test_recipe:
          setup:
            - "One Location with one ingested review already moved to moderation_state VERIFIED; clock at default 2026-05-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/reviews"
              payload: { site: "GOOGLE", external_review_id: "g-r1", author_name: "Ann", rating: 5, text: "Superb", posted_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rev: $.data.id }
            - call: "POST /reputation/reviews/${rev}/verify"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /reputation/reviews/${rev}/verify"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Review.${rev}.moderation_state == VERIFIED"
            - "Location.${loc_id}.review_count == 1"

      - name: listing_disconnects_after_three_failures_and_further_sync_is_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Listing.SYNC_FAILED_to_DISCONNECTED
          - entities.Listing.fields.sync_failure_count
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "The third consecutive FAILURE drives the listing to the terminal DISCONNECTED state (sync_failure_count 3); a fourth sync call is rejected with 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "One Location with a single GOOGLE listing in PENDING_SYNC; clock at default 2026-05-01T00:00:00Z."
            - "Two FAILURE syncs have already been recorded, so sync_state == SYNC_FAILED and sync_failure_count == 2."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "GOOGLE", external_listing_id: "g-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_g: $.data.id }
            - call: "POST /reputation/listings/${lst_g}/sync"
              payload: { outcome: "FAILURE" }
              as: PlatformAdmin
            - call: "POST /reputation/listings/${lst_g}/sync"
              payload: { outcome: "FAILURE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /reputation/listings/${lst_g}/sync"
              payload: { outcome: "FAILURE" }
              as: PlatformAdmin
              captures: { st: $.data.sync_state }
            - call: "POST /reputation/listings/${lst_g}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "after the third FAILURE: Listing.${lst_g}.sync_state == DISCONNECTED and sync_failure_count == 3"
            - "the fourth sync call: HTTP status == 409 and error_id == ERR_INVALID_STATE"
            - "Listing.${lst_g}.sync_state == DISCONNECTED (unchanged)"
            - "GET /reputation/locations/${loc_id}/alerts returns 3 Alert rows with alert_type == LISTING_SYNC_FAILED"

      - name: nap_update_reverts_connected_listing_to_pending_sync
        claim_type: side_effect_execution
        grounds:
          - state_machines.Listing.CONNECTED_to_PENDING_SYNC
          - calculations.listing_health_score
          - entities.Listing.fields.nap_match_count
        distinguishing_aspect: "Replacing the Location's NAP phone knocks the CONNECTED GOOGLE listing back to PENDING_SYNC with its old listed_nap_phone intact, so nap_match_count drops from 3 to 2 and listing_health_score falls from 50.00 to 20.00."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z."
            - "One Location whose only listing (GOOGLE) is CONNECTED, NAP-matched and freshly synced -> listing_health_score == 50.00 (GOOGLE weight 0.5, the other two sites score 0)."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "GOOGLE", external_listing_id: "g-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_g: $.data.id }
            - call: "POST /reputation/listings/${lst_g}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
          trigger:
            - call: "PUT /reputation/locations/${loc_id}/nap"
              payload: { nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15559990000" }
              as: PlatformAdmin
              captures: { health: $.data.listing_health_score }
          assert:
            - "before the trigger: Location.${loc_id}.listing_health_score == 50.00"
            - "Listing.${lst_g}.sync_state == PENDING_SYNC"
            - "Listing.${lst_g}.listed_nap_phone == +15551110000 (the stale site value, NOT the new canonical one)"
            - "Listing.${lst_g}.nap_match_count == 2"
            - "Location.${loc_id}.nap_phone == +15559990000"
            - "Location.${loc_id}.listing_health_score == 20.00"
            - "Location.${loc_id}.posture == RESTRICTED"

      - name: manual_campaign_pause_keeps_queued_requests_and_reserved_credits
        claim_type: side_effect_execution
        grounds:
          - state_machines.Campaign.RUNNING_to_PAUSED
          - entities.Campaign.fields.credits_reserved
          - entities.ReviewRequest.fields.status
        distinguishing_aspect: "A MANUAL pause leaves QUEUED requests QUEUED and credits_reserved at 1 — unlike the system pause driven by a posture flip, which suppresses them and releases the credits."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; Location OPEN with a CONNECTED, NAP-matched GOOGLE listing (listing_health_score 50.00)."
            - "An EMAIL campaign (credits_allocated 5, daily_send_cap 5) RUNNING with one QUEUED request."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "GOOGLE", external_listing_id: "g-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_g: $.data.id }
            - call: "POST /reputation/listings/${lst_g}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
            - call: "POST /reputation/businesses/${biz_id}/contacts"
              payload: { full_name: "E One", email: "e1@example.com", email_consent: true }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "GET /reputation/locations/${loc_id}"
              payload: {}
              as: PlatformAdmin
              captures: { loc_v: $.data.version }
            - call: "POST /reputation/locations/${loc_id}/campaigns"
              payload: { name: "Spring Asks", channel: "EMAIL", message_body: "Rate us", send_window_start: "09:00", send_window_end: "11:00", daily_send_cap: 5, credits_allocated: 5, expected_location_version: "${loc_v}" }
              as: PlatformAdmin
              captures: { camp: $.data.id }
            - call: "POST /reputation/campaigns/${camp}/schedule"
              payload: {}
              as: PlatformAdmin
            - call: "POST /reputation/campaigns/${camp}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /reputation/campaigns/${camp}/requests"
              payload: { contact_id: "${c1}" }
              as: PlatformAdmin
              captures: { req1: $.data.id }
          trigger:
            - call: "POST /reputation/campaigns/${camp}/pause"
              payload: {}
              as: PlatformAdmin
              captures: { st: $.data.status }
          assert:
            - "Campaign.${camp}.status == PAUSED"
            - "ReviewRequest.${req1}.status == QUEUED (NOT suppressed)"
            - "Campaign.${camp}.credits_reserved == 1"
            - "Campaign.${camp}.credits_released == 0"

      - name: campaign_complete_suppresses_queued_requests_and_releases_credits
        claim_type: side_effect_execution
        grounds:
          - state_machines.Campaign.RUNNING_to_COMPLETED
          - state_machines.ReviewRequest.QUEUED_to_SUPPRESSED
          - entities.Campaign.fields.credits_released
        distinguishing_aspect: "Completing a RUNNING campaign that still holds two QUEUED requests suppresses both and moves their two reserved credits into credits_released, leaving credits_reserved at 0."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; Location OPEN with a CONNECTED GOOGLE listing."
            - "An EMAIL campaign (credits_allocated 5) RUNNING with two QUEUED requests for two different contacts."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "GOOGLE", external_listing_id: "g-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_g: $.data.id }
            - call: "POST /reputation/listings/${lst_g}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
            - call: "POST /reputation/businesses/${biz_id}/contacts"
              payload: { full_name: "E One", email: "e1@example.com", email_consent: true }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/contacts"
              payload: { full_name: "E Two", email: "e2@example.com", email_consent: true }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "GET /reputation/locations/${loc_id}"
              payload: {}
              as: PlatformAdmin
              captures: { loc_v: $.data.version }
            - call: "POST /reputation/locations/${loc_id}/campaigns"
              payload: { name: "Spring Asks", channel: "EMAIL", message_body: "Rate us", send_window_start: "09:00", send_window_end: "11:00", daily_send_cap: 5, credits_allocated: 5, expected_location_version: "${loc_v}" }
              as: PlatformAdmin
              captures: { camp: $.data.id }
            - call: "POST /reputation/campaigns/${camp}/schedule"
              payload: {}
              as: PlatformAdmin
            - call: "POST /reputation/campaigns/${camp}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /reputation/campaigns/${camp}/requests"
              payload: { contact_id: "${c1}" }
              as: PlatformAdmin
              captures: { req1: $.data.id }
            - call: "POST /reputation/campaigns/${camp}/requests"
              payload: { contact_id: "${c2}" }
              as: PlatformAdmin
              captures: { req2: $.data.id }
          trigger:
            - call: "POST /reputation/campaigns/${camp}/complete"
              payload: {}
              as: PlatformAdmin
              captures: { st: $.data.status }
          assert:
            - "Campaign.${camp}.status == COMPLETED"
            - "ReviewRequest.${req1}.status == SUPPRESSED"
            - "ReviewRequest.${req2}.status == SUPPRESSED"
            - "Campaign.${camp}.credits_reserved == 0"
            - "Campaign.${camp}.credits_released == 2"
            - "Campaign.${camp}.credits_consumed == 0"

      - name: escalation_acknowledge_still_counts_as_open
        claim_type: valid_transition
        grounds:
          - state_machines.Escalation.OPEN_to_ACKNOWLEDGED
          - entities.Location.fields.open_escalation_count
          - entities.Escalation.fields.acknowledged_by_user_id
        distinguishing_aspect: "OPEN -> ACKNOWLEDGED stamps acknowledged_by_user_id but leaves Location.open_escalation_count at 1, because ACKNOWLEDGED is still an open state for the posture predicate."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; one Location with one 1-star review, so one Escalation is OPEN and open_escalation_count == 1."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/reviews"
              payload: { site: "GOOGLE", external_review_id: "g-r1", author_name: "Angry Ann", rating: 1, text: "Terrible", posted_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rev: $.data.id }
            - call: "GET /reputation/reviews/${rev}/escalations"
              payload: {}
              as: PlatformAdmin
              captures: { esc: "$.data[0].id" }
          trigger:
            - call: "POST /reputation/escalations/${esc}/acknowledge"
              payload: {}
              as: PlatformAdmin
              captures: { st: $.data.state }
          assert:
            - "Escalation.${esc}.state == ACKNOWLEDGED"
            - "Escalation.${esc}.acknowledged_by_user_id equals the X-User-ID sent on the acknowledge call"
            - "Escalation.${esc}.resolved_at == null"
            - "Location.${loc_id}.open_escalation_count == 1"
            - "GET /reputation/locations/${loc_id}/alerts contains one Alert with alert_type == NEGATIVE_REVIEW and severity == WARNING"

      - name: compliance_hold_freezes_location_and_unpublishes_widget
        claim_type: side_effect_execution
        grounds:
          - state_machines.Location.OPEN_to_FROZEN
          - entities.Location.fields.compliance_hold
          - entities.Widget.fields.status
        distinguishing_aspect: "Placing a compliance hold on an OPEN location with a PUBLISHED widget sets posture FROZEN, reverts the widget to DRAFT with published_at null, and appends a CRITICAL POSTURE_CHANGED alert."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; Location OPEN with three CONNECTED NAP-matched listings (listing_health_score 100.00)."
            - "The Location's widget has been published, so Widget.status == PUBLISHED."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "GOOGLE", external_listing_id: "g-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_g: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "YELP", external_listing_id: "y-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_y: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "FACEBOOK", external_listing_id: "f-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_f: $.data.id }
            - call: "POST /reputation/listings/${lst_g}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
            - call: "POST /reputation/listings/${lst_y}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
            - call: "POST /reputation/listings/${lst_f}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
            - call: "POST /reputation/locations/${loc_id}/widget"
              payload: { min_rating: 4, max_reviews: 10 }
              as: PlatformAdmin
              captures: { wid: $.data.id }
            - call: "POST /reputation/widgets/${wid}/publish"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /reputation/locations/${loc_id}/compliance-hold"
              payload: { on_hold: true }
              as: PlatformAdmin
              captures: { posture: $.data.posture }
          assert:
            - "before the trigger: Location.${loc_id}.posture == OPEN and Widget.${wid}.status == PUBLISHED"
            - "Location.${loc_id}.compliance_hold == true"
            - "Location.${loc_id}.posture == FROZEN"
            - "Widget.${wid}.status == DRAFT"
            - "Widget.${wid}.published_at == null"
            - "GET /reputation/locations/${loc_id}/alerts contains an Alert with alert_type == POSTURE_CHANGED and severity == CRITICAL"

      - name: flagged_review_reinstated_by_verify_reopens_escalation
        claim_type: valid_transition
        grounds:
          - state_machines.Review.FLAGGED_to_VERIFIED
          - state_machines.Escalation.OPEN_to_CANCELLED
          - entities.Location.fields.open_escalation_count
        distinguishing_aspect: "The moderation cycle UNVERIFIED -> FLAGGED -> VERIFIED reinstates a 1-star review: a FRESH Escalation is opened (the cancelled one stays CANCELLED) and open_escalation_count returns to 1."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; one Location with one 1-star review whose Escalation was CANCELLED by a flag, so open_escalation_count == 0."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/reviews"
              payload: { site: "GOOGLE", external_review_id: "g-r1", author_name: "Angry Ann", rating: 1, text: "Terrible", posted_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rev: $.data.id }
            - call: "GET /reputation/reviews/${rev}/escalations"
              payload: {}
              as: PlatformAdmin
              captures: { esc1: "$.data[0].id" }
            - call: "POST /reputation/reviews/${rev}/flag"
              payload: { reason: "Suspected fake" }
              as: PlatformAdmin
          trigger:
            - call: "POST /reputation/reviews/${rev}/verify"
              payload: {}
              as: PlatformAdmin
              captures: { mod: $.data.moderation_state }
          assert:
            - "before the trigger: Review.${rev}.moderation_state == FLAGGED and Location.${loc_id}.open_escalation_count == 0"
            - "Review.${rev}.moderation_state == VERIFIED"
            - "Escalation.${esc1}.state == CANCELLED (the cancelled escalation is NOT resurrected)"
            - "GET /reputation/reviews/${rev}/escalations returns 2 rows, exactly one of which has state == OPEN"
            - "Location.${loc_id}.open_escalation_count == 1"
            - "Location.${loc_id}.review_count == 1"
            - "Location.${loc_id}.sentiment_negative_count == 1"

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: nps_bucketing_boundaries_9_promoter_8_passive_6_detractor
        claim_type: correct_result
        grounds:
          - calculations.nps_score
          - entities.SurveyResponse.fields.nps_category
          - entities.Location.fields.nps_score
        distinguishing_aspect: "Scores 9, 10, 8 and 6 bucket to PROMOTER, PROMOTER, PASSIVE and DETRACTOR, giving nps_score == 25.00 ((2/4)*100 - (1/4)*100); a `> 9` promoter cut or a `< 6` detractor cut would produce a different number."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; one Location with four contacts, each holding one PENDING survey."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/contacts"
              payload: { full_name: "S One", email: "s1@example.com" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/contacts"
              payload: { full_name: "S Two", email: "s2@example.com" }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/contacts"
              payload: { full_name: "S Three", email: "s3@example.com" }
              as: PlatformAdmin
              captures: { c3: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/contacts"
              payload: { full_name: "S Four", email: "s4@example.com" }
              as: PlatformAdmin
              captures: { c4: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/surveys"
              payload: { contact_id: "${c1}" }
              as: PlatformAdmin
              captures: { sv1: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/surveys"
              payload: { contact_id: "${c2}" }
              as: PlatformAdmin
              captures: { sv2: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/surveys"
              payload: { contact_id: "${c3}" }
              as: PlatformAdmin
              captures: { sv3: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/surveys"
              payload: { contact_id: "${c4}" }
              as: PlatformAdmin
              captures: { sv4: $.data.id }
            - call: "POST /reputation/surveys/${sv1}/submit"
              payload: { nps_score: 9 }
              as: Anonymous
            - call: "POST /reputation/surveys/${sv2}/submit"
              payload: { nps_score: 10 }
              as: Anonymous
            - call: "POST /reputation/surveys/${sv3}/submit"
              payload: { nps_score: 8 }
              as: Anonymous
          trigger:
            - call: "POST /reputation/surveys/${sv4}/submit"
              payload: { nps_score: 6, comment: "Slow front desk" }
              as: Anonymous
              captures: { cat: $.data.nps_category }
          assert:
            - "SurveyResponse.${sv1}.nps_category == PROMOTER"
            - "SurveyResponse.${sv2}.nps_category == PROMOTER"
            - "SurveyResponse.${sv3}.nps_category == PASSIVE"
            - "SurveyResponse.${sv4}.nps_category == DETRACTOR"
            - "SurveyResponse.${sv4}.status == SUBMITTED and submitted_at == 2026-05-01T00:00:00.000Z"
            - "Location.${loc_id}.nps_score == 25.00"
            - "GET /reputation/locations/${loc_id}/alerts contains one Alert with alert_type == NPS_DETRACTOR and severity == WARNING"

      - name: nps_score_is_zero_when_no_survey_has_been_submitted
        claim_type: input_set_filtering
        grounds:
          - calculations.nps_score
          - entities.SurveyResponse.fields.status
        distinguishing_aspect: "A PENDING survey is excluded from the NPS input set, so a location with one issued-but-unanswered survey still reports nps_score 0.00 rather than an error or a null."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; one Location with one contact holding a single PENDING survey."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/contacts"
              payload: { full_name: "S One", email: "s1@example.com" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/surveys"
              payload: { contact_id: "${c1}" }
              as: PlatformAdmin
              captures: { sv1: $.data.id }
          trigger:
            - call: "GET /reputation/locations/${loc_id}/dashboard"
              payload: {}
              as: PlatformAdmin
              captures: { nps: $.data.nps_score }
          assert:
            - "SurveyResponse.${sv1}.status == PENDING and nps_score == null and nps_category == null"
            - "SurveyResponse.${sv1}.expires_at == 2026-05-15T00:00:00.000Z"
            - "dashboard.nps_score == 0.00"

      - name: competitor_benchmark_deltas_against_two_snapshots
        claim_type: correct_result
        grounds:
          - calculations.competitor_benchmark
          - entities.Competitor.fields.avg_rating
          - entities.Location.fields.avg_rating
        distinguishing_aspect: "With competitors rated 4.00 and 3.00 (80 and 60 reviews) and a location averaging 5.00 over 1 review, competitor_avg_rating == 3.50, rating_delta == 1.50 and review_volume_delta == 1 - floor(70) == -69."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z."
            - "One Location with a single 5-star review (avg_rating 5.00, review_count 1)."
            - "Two Competitor snapshots: (4.00, 80 reviews) and (3.00, 60 reviews)."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/reviews"
              payload: { site: "GOOGLE", external_review_id: "g-r1", author_name: "Ann", rating: 5, text: "Superb", posted_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rev: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/competitors"
              payload: { name: "Rival A", site: "GOOGLE", avg_rating: 4.00, review_count: 80 }
              as: PlatformAdmin
              captures: { comp_a: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/competitors"
              payload: { name: "Rival B", site: "YELP", avg_rating: 3.00, review_count: 60 }
              as: PlatformAdmin
              captures: { comp_b: $.data.id }
          trigger:
            - call: "GET /reputation/locations/${loc_id}/dashboard"
              payload: {}
              as: PlatformAdmin
          assert:
            - "dashboard.competitor_avg_rating == 3.50"
            - "dashboard.rating_delta == 1.50"
            - "dashboard.review_volume_delta == -69"
            - "dashboard.avg_rating == 5.00"

      - name: listing_health_is_zero_when_no_listing_exists
        claim_type: input_set_filtering
        grounds:
          - calculations.listing_health_score
          - calculations.location_posture
          - entities.Location.fields.listing_health_score
        distinguishing_aspect: "With zero Listing rows every site contributes 0.0 for its weight, so listing_health_score is 0.00 (< LISTING_MIN_HEALTH 40.00) and the first mutation that feeds posture drives it to RESTRICTED."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; one Location with no listings at all."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
          trigger:
            - call: "POST /reputation/locations/${loc_id}/reviews"
              payload: { site: "GOOGLE", external_review_id: "g-r1", author_name: "Ann", rating: 5, text: "Superb", posted_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rev: $.data.id }
          assert:
            - "Location.${loc_id}.listing_health_score == 0.00"
            - "Location.${loc_id}.avg_rating == 5.00"
            - "Location.${loc_id}.reputation_score_provisional == 60.00"
            - "Location.${loc_id}.posture == RESTRICTED (driven purely by listing health, not by the score)"

  # =========================================================================
  # Validations
  # =========================================================================
  - section: validations
    instances:
      - name: business_owner_cannot_touch_another_businesss_location
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=3]
          - errors[ERR_CROSS_TENANT_ACCESS]
          - roles
        distinguishing_aspect: "A BusinessOwner whose X-User-ID is Business A's id is refused with 403 ERR_CROSS_TENANT_ACCESS when reading a Location that belongs to Business B."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; two Businesses, each with one Location."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Business A" }
              as: PlatformAdmin
              captures: { biz_a: $.data.id }
            - call: "POST /reputation/businesses"
              payload: { name: "Business B" }
              as: PlatformAdmin
              captures: { biz_b: $.data.id }
            - call: "POST /reputation/businesses/${biz_b}/locations"
              payload: { name: "B Downtown", nap_name: "B Dental", nap_address: "2 Main St", nap_phone: "+15552220000" }
              as: PlatformAdmin
              captures: { loc_b: $.data.id }
          trigger:
            - call: "GET /reputation/locations/${loc_b}"
              payload: {}
              as: BusinessOwner
              as_user_id: "${biz_a}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "error_id == ERR_CROSS_TENANT_ACCESS"

      - name: enqueue_without_spendable_credits_returns_insufficient_credits
        claim_type: violation_to_error
        grounds:
          - validations[priority=22]
          - errors[ERR_INSUFFICIENT_CREDITS]
          - entities.Campaign.fields.credits_allocated
        distinguishing_aspect: "With credits_allocated 1 already fully reserved by the first request, the second enqueue sees allocated - reserved - consumed == 0 and is refused with 402 ERR_INSUFFICIENT_CREDITS."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; Location OPEN with a CONNECTED GOOGLE listing."
            - "An EMAIL campaign with credits_allocated 1, RUNNING, already holding one QUEUED request for contact 1."
            - "A second email-consenting contact exists."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "GOOGLE", external_listing_id: "g-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_g: $.data.id }
            - call: "POST /reputation/listings/${lst_g}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
            - call: "POST /reputation/businesses/${biz_id}/contacts"
              payload: { full_name: "E One", email: "e1@example.com", email_consent: true }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/contacts"
              payload: { full_name: "E Two", email: "e2@example.com", email_consent: true }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "GET /reputation/locations/${loc_id}"
              payload: {}
              as: PlatformAdmin
              captures: { loc_v: $.data.version }
            - call: "POST /reputation/locations/${loc_id}/campaigns"
              payload: { name: "Thin Budget", channel: "EMAIL", message_body: "Rate us", send_window_start: "09:00", send_window_end: "11:00", daily_send_cap: 5, credits_allocated: 1, expected_location_version: "${loc_v}" }
              as: PlatformAdmin
              captures: { camp: $.data.id }
            - call: "POST /reputation/campaigns/${camp}/schedule"
              payload: {}
              as: PlatformAdmin
            - call: "POST /reputation/campaigns/${camp}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /reputation/campaigns/${camp}/requests"
              payload: { contact_id: "${c1}" }
              as: PlatformAdmin
              captures: { req1: $.data.id }
          trigger:
            - call: "POST /reputation/campaigns/${camp}/requests"
              payload: { contact_id: "${c2}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 402"
            - "error_id == ERR_INSUFFICIENT_CREDITS"
            - "Campaign.${camp}.credits_reserved == 1"
            - "Contact.${c2}.request_count == 0"

      - name: duplicate_listing_for_same_site_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=17]
          - errors[ERR_DUPLICATE_LISTING]
          - entities.Listing.fields.site
        distinguishing_aspect: "A second GOOGLE listing on the same Location violates the (location_id, site) uniqueness constraint and is rejected with 409 ERR_DUPLICATE_LISTING."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; one Location that already has a GOOGLE listing."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "GOOGLE", external_listing_id: "g-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_g: $.data.id }
          trigger:
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "GOOGLE", external_listing_id: "g-2", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_DUPLICATE_LISTING"
            - "GET /reputation/locations/${loc_id}/listings returns exactly 1 Listing"

      - name: duplicate_external_review_id_on_same_site_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=18]
          - errors[ERR_DUPLICATE_EXTERNAL_REVIEW]
          - entities.Review.fields.external_review_id
        distinguishing_aspect: "Re-ingesting the same (location_id, site, external_review_id) triple is refused with 409 ERR_DUPLICATE_EXTERNAL_REVIEW, so a connector replay cannot double-count a review."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; one Location with one ingested GOOGLE review whose external_review_id is g-r1."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/reviews"
              payload: { site: "GOOGLE", external_review_id: "g-r1", author_name: "Ann", rating: 5, text: "Superb", posted_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rev: $.data.id }
          trigger:
            - call: "POST /reputation/locations/${loc_id}/reviews"
              payload: { site: "GOOGLE", external_review_id: "g-r1", author_name: "Ann", rating: 5, text: "Superb (replay)", posted_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_DUPLICATE_EXTERNAL_REVIEW"
            - "Location.${loc_id}.review_count == 1"
            - "Location.${loc_id}.avg_rating == 5.00"

      - name: second_widget_on_same_location_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=19]
          - errors[ERR_WIDGET_ALREADY_EXISTS]
          - entities.Widget.fields.location_id
        distinguishing_aspect: "A Location may hold at most one Widget; the second create is refused with 409 ERR_WIDGET_ALREADY_EXISTS and the original widget's config is untouched."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; one Location that already has a Widget with min_rating 4."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/widget"
              payload: { min_rating: 4, max_reviews: 10 }
              as: PlatformAdmin
              captures: { wid: $.data.id }
          trigger:
            - call: "POST /reputation/locations/${loc_id}/widget"
              payload: { min_rating: 1, max_reviews: 50 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_WIDGET_ALREADY_EXISTS"
            - "Widget.${wid}.min_rating == 4 and Widget.${wid}.max_reviews == 10 (unchanged)"

      - name: template_outside_review_rating_band_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
          - errors[ERR_TEMPLATE_RATING_MISMATCH]
          - entities.ResponseTemplate.fields.min_rating
        distinguishing_aspect: "Applying a 4..5-star template to a 2-star review is refused with 422 ERR_TEMPLATE_RATING_MISMATCH; no ReviewResponse row is created and Review.response_state stays NONE."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z."
            - "One Business with a ResponseTemplate whose band is min_rating 4 / max_rating 5."
            - "One Location with a 2-star ingested review (response_state NONE, Review.version 1)."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/templates"
              payload: { name: "Praise", body: "Thanks for the kind words!", min_rating: 4, max_rating: 5 }
              as: PlatformAdmin
              captures: { tpl: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/reviews"
              payload: { site: "GOOGLE", external_review_id: "g-r1", author_name: "Bob", rating: 2, text: "Not great", posted_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rev: $.data.id, rev_v: $.data.version }
          trigger:
            - call: "POST /reputation/reviews/${rev}/responses"
              payload: { body: "Thanks for the kind words!", template_id: "${tpl}", expected_review_version: "${rev_v}" }
              as: ResponseAgent
              as_user_id: "agent-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_TEMPLATE_RATING_MISMATCH"
            - "Review.${rev}.response_state == NONE"
            - "GET /reputation/review-responses?review_id=${rev} returns 0 rows"

      - name: survey_submit_at_exactly_expires_at_is_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=11]
          - errors[ERR_SURVEY_EXPIRED]
          - entities.SurveyResponse.fields.expires_at
        distinguishing_aspect: "expires_at is created_at + 14 days == 2026-05-15T00:00:00Z and the check is `current_utc >= expires_at`, so a submit at exactly that instant is refused with 409 ERR_SURVEY_EXPIRED while the survey stays PENDING."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; one Location, one contact and one PENDING survey with expires_at 2026-05-15T00:00:00Z."
            - "The clock is then moved to exactly 2026-05-15T00:00:00Z."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/contacts"
              payload: { full_name: "S One", email: "s1@example.com" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/surveys"
              payload: { contact_id: "${c1}" }
              as: PlatformAdmin
              captures: { sv: $.data.id }
            - call: "POST /reputation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /reputation/surveys/${sv}/submit"
              payload: { nps_score: 10 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_SURVEY_EXPIRED"
            - "SurveyResponse.${sv}.status == PENDING"
            - "SurveyResponse.${sv}.nps_score == null"
            - "Location.${loc_id}.nps_score == 0.00"

      - name: escalation_resolve_before_review_is_responded_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=16]
          - errors[ERR_REVIEW_NOT_RESPONDED]
          - state_machines.Escalation.OPEN_to_RESOLVED
        distinguishing_aspect: "Manually resolving an OPEN escalation whose Review.response_state is still NONE is refused with 409 ERR_REVIEW_NOT_RESPONDED, and open_escalation_count stays at 1."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; one Location with one 1-star review, so one Escalation is OPEN and Review.response_state == NONE."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/reviews"
              payload: { site: "GOOGLE", external_review_id: "g-r1", author_name: "Angry Ann", rating: 1, text: "Terrible", posted_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rev: $.data.id }
            - call: "GET /reputation/reviews/${rev}/escalations"
              payload: {}
              as: PlatformAdmin
              captures: { esc: "$.data[0].id" }
          trigger:
            - call: "POST /reputation/escalations/${esc}/resolve"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_REVIEW_NOT_RESPONDED"
            - "Escalation.${esc}.state == OPEN"
            - "Location.${loc_id}.open_escalation_count == 1"

      - name: send_batch_over_daily_cap_is_rejected_whole
        claim_type: aggregate_validation
        grounds:
          - validations[priority=23]
          - errors[ERR_SEND_CAP_EXCEEDED]
          - entities.Campaign.fields.daily_send_cap
        distinguishing_aspect: "With daily_send_cap 1 and two QUEUED requests, a batch_size 2 send is rejected WHOLE with 422 ERR_SEND_CAP_EXCEEDED — no partial send occurs and credits_consumed stays 0."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; Location OPEN with a CONNECTED GOOGLE listing."
            - "An EMAIL campaign (credits_allocated 5, daily_send_cap 1) RUNNING with two QUEUED requests."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "GOOGLE", external_listing_id: "g-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_g: $.data.id }
            - call: "POST /reputation/listings/${lst_g}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
            - call: "POST /reputation/businesses/${biz_id}/contacts"
              payload: { full_name: "E One", email: "e1@example.com", email_consent: true }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/contacts"
              payload: { full_name: "E Two", email: "e2@example.com", email_consent: true }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "GET /reputation/locations/${loc_id}"
              payload: {}
              as: PlatformAdmin
              captures: { loc_v: $.data.version }
            - call: "POST /reputation/locations/${loc_id}/campaigns"
              payload: { name: "Capped", channel: "EMAIL", message_body: "Rate us", send_window_start: "09:00", send_window_end: "11:00", daily_send_cap: 1, credits_allocated: 5, expected_location_version: "${loc_v}" }
              as: PlatformAdmin
