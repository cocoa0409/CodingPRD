  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: repair_escalation_threshold_exact_boundary_adds_one_point
        grounds:
          - calculations.damage_penalty_assessment
          - constants.REPAIR_ESCALATION_CENTS
          - constants.SUSPENSION_POINTS_BY_SEVERITY
          - entities.DamageAssessment.fields.suspension_points_assessed
          - entities.Reservation.fields.uncovered_liability_cents
        distinguishing_aspect: |
          The metric under test is assessed_repair_cents against
          REPAIR_ESCALATION_CENTS (50000) on endpoint
          POST /damage-assessments/{assessmentId}/finalize: 49999 stays at the
          MINOR base of 1 point while 50000 — the threshold itself, tested with
          >= and not > — adds the escalation point, and the one-cent difference
          also shifts uncovered_liability_cents by exactly one cent.
        test_recipe:
          setup:
            - "Producers P1 and P2 both graduated TV-101 (seat_capacity 12), so both are ACTIVE with competency_codes [STUDIO_FLOOR, EDIT_SUITE] and 0 suspension points."
            - "StudioResource STUDIO-A has base_deposit_cents 12345, replacement_value_cents 900000, capacity_slots 1, turnaround_minutes 30 — the replacement value is far above both repair figures, so the min() clamp never engages."
            - "P1 holds Reservation R1 (2026-08-08T10:00:00Z-12:00:00Z) and P2 holds Reservation R2 (2026-08-09T10:00:00Z-12:00:00Z); both are CONFIRMED at 12962 cents and both are returned damaged with severity MINOR."
            - "R1's repair_estimate_cents is 49999 (one cent below the threshold) and R2's is 50000 (exactly the threshold)."
          setup_api_calls:
            - call: "POST /producers"
              payload: {legal_name: "Ada Lovelace", email: "ada@patv.example"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p1_id: $.data.id}
            - call: "POST /producers"
              payload: {legal_name: "Grace Hopper", email: "grace@patv.example"}
