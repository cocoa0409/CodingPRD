      - name: filing_stamped_exactly_on_statutory_deadline_is_not_late
        grounds:
          - calculations.filing_accession_and_lateness
          - calculations.statutory_deadline_resolution
          - calculations.cycle_milestone_slack
          - entities.Filing.fields.late_flag
          - entities.Filing.fields.accession_label
          - state_machines.Milestone.PLANNED_to_BREACHED
          - endpoints["POST /_clock/set_current_utc"]
        distinguishing_aspect: |
          late_flag uses a STRICT `>` against statutory_deadline_utc, so a filing stamped at exactly
          2026-08-10T17:30:00Z is on time; one second later it would be late. The same clock jump also
          exercises the empty-open-set convention of cycle_milestone_slack: the breach sweep run by
          DECLARE_FILING_READY moves the last PLANNED milestone to BREACHED, which empties the open set,
          and min_slack_days_business must therefore read the sentinel 9999 (not 0 and not a negative
          number), which is exactly what lets the readiness gate pass at the deadline instant.
