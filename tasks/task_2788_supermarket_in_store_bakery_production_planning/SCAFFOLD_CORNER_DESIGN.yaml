              payload: { department_id: "${dept_id}", business_date: "2026-08-12", labor_budget_minutes: 600, oven_shift_start_utc: "2026-08-12T04:00:00Z", oven_shift_end_utc: "2026-08-12T20:00:00Z" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_id: $.data.id }
            - call: "POST /bakery/bake-days/${bd_id}/forecast-lines"
              payload: { product_id: "${fil_id}", daypart: "MORNING", forecasted_units: 1 }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_v1: $.data.version }
            - call: "POST /bakery/bake-days/${bd_id}/generate-plan"
              payload: { expected_bake_day_version: "${bd_v1}" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
            - call: "POST /bakery/production-runs"
              payload: { bake_day_id: "${bd_id}", product_id: "${crois_id}", rack_count: 2, oven_id: "${oven_a_id}", deck_index: 0, bake_start_utc: "2026-08-12T04:00:00Z" }
              as: Baker
              as_user_id: "baker-01"
              captures: { run_id: $.data.id }
          trigger:
            - call: "GET /bakery/production-runs/${run_id}"
              payload: {}
              as: Decorator
              as_user_id: "decorator-01"
            - call: "GET /bakery/bake-days/${bd_id}"
              payload: {}
              as: Decorator
              as_user_id: "decorator-01"
          assert:
            - "the run read shows bake_end_utc 2026-08-12T04:20:00Z, ready_utc 2026-08-12T04:35:00Z and expires_utc 2026-08-12T14:35:00Z"
            - "the run read shows planned_units 80, planned_labor_minutes 27.00 (setup 15 + 2 racks * 10 * PAR_BAKED factor 0.60) and ingredient_cost_cents 600"
            - "the run read shows proof_required false, execution_status SCHEDULED, disposition_status PENDING and actual_units null"
            - "the bake-day read shows planned_units_total 81 and planned_labor_minutes 27.00 — the zero-labor filler run contributes one unit and no minutes"

      - name: forecast_line_links_a_product_to_a_bake_day_on_the_parent_record
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_/bakery/bake-days/{bakeDayId}/forecast-lines
          - entities.BakeDay.forecast_lines
          - calculations.bake_day_plan_generation
        distinguishing_aspect: "The link lives on the BakeDay, not on the Product: two forecast lines for the same product in different dayparts both attach to BakeDay.forecast_lines, the Product record itself is unchanged, and plan generation then materialises runs that reference both sides of the link."
        test_recipe:
