              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T2", min_credit_score: 660, max_credit_score: 719, max_ltv_pct: 115, max_term_months: 72, buy_rate_apr_bps: 749, advance_rate_pct: 115, acquisition_fee_cents: 20000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T3", min_credit_score: 600, max_credit_score: 659, max_ltv_pct: 110, max_term_months: 60, buy_rate_apr_bps: 1099, advance_rate_pct: 110, acquisition_fee_cents: 30000 }
