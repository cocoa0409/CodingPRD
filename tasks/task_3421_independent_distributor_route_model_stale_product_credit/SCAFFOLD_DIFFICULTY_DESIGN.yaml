        distinguishing_aspect: "Depth-2 chain from a different trigger (production-day close, not an audit): close -> FinancingPlan ACTIVE -> DELINQUENT -> Distributor.account_standing GOOD -> WATCH, with a parallel claim auto-expiry branch (SUBMITTED claim older than 3 days -> DENIED/AUTO_EXPIRED) proving the checkpoint fans out."
