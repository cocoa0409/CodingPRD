          setup:
            - "Departure cancelled (CANCELLED_OPS), seat_capacity 4; a DRAFT booking party 8 (> remaining)"
          setup_api_calls:
            - call: "POST /tour-products"
              payload: { name: "P", theme: "WINE", base_price_per_person_cents: 9000 }
              as: Operator
              captures: { prod_id: $.data.id }
