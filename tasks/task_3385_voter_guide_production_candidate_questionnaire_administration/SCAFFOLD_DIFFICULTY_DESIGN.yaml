            - { call: "GET /contests/${ct2}", as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct2_ver: "$.data.version" } }
            - { call: "POST /contests/${ct2}/transitions", payload: { to: "QUESTIONNAIRE_PHASE", expected_contest_version: "${ct2_ver}" }, as: ChapterCoordinator, as_user_id: "${coord_id}" }
          trigger:
