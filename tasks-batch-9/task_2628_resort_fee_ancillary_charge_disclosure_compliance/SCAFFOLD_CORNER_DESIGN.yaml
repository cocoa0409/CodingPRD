          setup:
            - "3-FEE PUBLISHED PROGRAM; a second GDS channel that supports both capabilities so no capability penalty applies"
            - "A DRAFT profile on the GDS channel with first_quote_shows_total false, itemized_at_first_quote false and disclosure_placement ABSENT, scoring 0 + 0 + 0 + 10 = 10"
            - "A full-disclosure profile on the OTA channel, created but not yet deployed, scoring 40 + 25 + 25 + 10 = 100"
