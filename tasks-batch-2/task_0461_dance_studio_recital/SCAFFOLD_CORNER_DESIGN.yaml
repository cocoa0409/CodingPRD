              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", section_id: "${sec_id}" }
              as: StudioAdmin
          trigger:
            - call: "GET /sections/${sec_id}"
              payload: {}
              as: StudioAdmin
              captures: { ec: $.data.enrolled_count }
          assert:
            - "ClassSection.${sec_id}.enrolled_count == 1"
            - "ClassSection.${sec_id}.status == OPEN"
