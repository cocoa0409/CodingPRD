            - "logical clock at 2026-08-05T00:00:00Z"
            - "one AppProduct with two DISCOVERED BreachIncidents, both breach_scope CHD_ONLY, one UNPROTECTED with 200 affected consumers and one ENCRYPTED_SECURED with 300"
