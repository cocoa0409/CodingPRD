          trigger:
            - { call: "POST /regulatory-filings/${fil_id}/submit-review", payload: {}, as: ComplianceOfficer, as_user_id: "comp_1" }
            - { call: "POST /regulatory-filings/${fil_id}/approve", payload: {}, as: FundController, as_user_id: "ctl_1" }
            - { call: "POST /regulatory-filings/${fil_id}/file", payload: {}, as: ComplianceOfficer, as_user_id: "comp_1", captures: { st_file1: "$.data.status", late1: "$.data.filed_after_deadline" } }
            - { call: "POST /regulatory-filings/${fil_id}/amend", payload: {}, as: ComplianceOfficer, as_user_id: "comp_1", captures: { st_amend: "$.data.status" } }
            - { call: "POST /regulatory-filings/${fil_id}/submit-review", payload: {}, as: ComplianceOfficer, as_user_id: "comp_1" }
            - { call: "POST /regulatory-filings/${fil_id}/approve", payload: {}, as: FundController, as_user_id: "ctl_1" }
            - { call: "POST /regulatory-filings/${fil_id}/file", payload: {}, as: ComplianceOfficer, as_user_id: "comp_1", captures: { st_file2: "$.data.status" } }
