      - name: study_with_no_components_cannot_be_certified
        claim_type: error_triggerable
        grounds:
          - errors.ERR_STUDY_HAS_NO_COMPONENTS
          - validations[priority=23]
          - validations[priority=22]
        distinguishing_aspect: |
          An empty study has nothing to demonstrate a nexus with, so certify-nexus must fail
          at priority 23. This also disambiguates rule 22 from rule 23: with zero components
          the 'every component is VALID' test at priority 22 is vacuously true, so an
          implementation that only checks 22 would certify an empty study.
