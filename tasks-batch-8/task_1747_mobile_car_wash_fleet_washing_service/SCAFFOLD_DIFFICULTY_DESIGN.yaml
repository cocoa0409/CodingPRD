            - { call: "POST /fleet-wash/compliance-incidents/${inc_id}/events", payload: { event_type: "START_REVIEW" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /fleet-wash/compliance-incidents/${inc_id}/events", payload: { event_type: "CONFIRM" }, as: ComplianceOfficer }
            - { call: "GET /fleet-wash/sites/${site_id}", payload: {}, as: Dispatcher, captures: { site_status: $.data.status, site_reason: $.data.suspension_reason } }
            - { call: "GET /fleet-wash/wash-orders/${o1_id}", payload: {}, as: Dispatcher, captures: { o1_status: $.data.status, o1_reason: $.data.cancel_reason } }
            - { call: "GET /fleet-wash/wash-orders/${o2_id}", payload: {}, as: Dispatcher, captures: { o2_status: $.data.status, o2_reason: $.data.cancel_reason } }
            - { call: "GET /fleet-wash/routes/${route_id}/stops", payload: {}, as: Dispatcher, captures: { stop_status: "$.data[0].status" } }
            - { call: "GET /fleet-wash/vans/${van_id}", payload: {}, as: Dispatcher, captures: { reserved_post: $.data.water_reserved_gal } }
            - { call: "GET /fleet-wash/routes/${route_id}", payload: {}, as: Dispatcher, captures: { route_vehicles: $.data.assigned_vehicle_count } }
          assert:
            - "site_status == SUSPENDED and site_reason == COMPLIANCE_INCIDENT (link 1)"
            - "o1_status == CANCELLED and o1_reason == SITE_SUSPENDED (link 2, unrouted)"
            - "o2_status == CANCELLED and o2_reason == SITE_SUSPENDED (link 2, routed)"
            - "stop_status == CANCELLED (link 3)"
            - "reserved_post == 0.0 (van water released) and route_vehicles == 0 (counters recomputed)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_cancelled_order_at_noncontained_site_state_beats_safety
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CONTAINMENT_REQUIRED]
        distinguishing_aspect: |
          Pair state x business_safety: CONFIRM on a CANCELLED order whose site fails
          containment (water_reclaim_required=true, containment_type=NONE) violates both
          priority 6 (invalid from-state) and priority 7 (ERR_CONTAINMENT_REQUIRED);
          the state error MUST win.
        test_recipe:
          setup:
            - "RETAIL customer; reclaim site with containment_type NONE; 1 SEDAN; order created then CANCELLED from DRAFT"
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "Retail P", email: "rp@x.com", customer_type: "RETAIL" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "BARE", lot_size_sqft: 8000, containment_type: "NONE", water_reclaim_required: true, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "P01", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v1: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-06T13:00:00Z", scheduled_window_end: "2026-08-06T14:00:00Z" }, as: PlatformAdmin, captures: { order_id: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "CANCEL", cancel_reason: "CUSTOMER_REQUEST" }, as: Dispatcher }
          trigger:
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (priority 6 state beats priority 7 business_safety even though the containment violation is also present)"
            - "WashOrder.${order_id}.status remains CANCELLED"

      - name: invoice_generate_suspended_contract_referential_beats_fiscal
        grounds:
          - validations[priority=28]
          - validations[priority=29]
          - errors[ERR_CONTRACT_NOT_ACTIVE]
          - errors[ERR_INVOICE_EXISTS]
        distinguishing_aspect: |
          Pair business_referential x business_fiscal (different pair than the state x
          safety instance): generating a FINAL invoice when the contract is SUSPENDED
          AND a DRAFT FINAL invoice already exists for the period violates priority 25
          and priority 26; ERR_CONTRACT_NOT_ACTIVE MUST win.
        test_recipe:
          setup:
            - "FLEET customer; site; 1 SEDAN; contract ACTIVE (minimum 50000) with one COMPLETED order in 2026-08"
            - "A FINAL invoice for 2026-08 already exists in DRAFT; contract then SUSPENDED"
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "Fleet P", email: "fp@x.com", customer_type: "FLEET" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "YARD", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "F01", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v1: $.data.id } }
            - { call: "POST /fleet-wash/fleet-contracts", payload: { customer_id: "${cust_id}", start_date: "2026-01-01", end_date: "2026-12-31", monthly_minimum_cents: 50000, sedan_rate_cents: 3000, suv_pickup_rate_cents: 4000, van_boxtruck_rate_cents: 6000, heavy_fleet_rate_cents: 10000 }, as: PlatformAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /fleet-wash/fleet-contracts/${contract_id}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-03T13:00:00Z", scheduled_window_end: "2026-08-03T14:00:00Z" }, as: PlatformAdmin, captures: { order_id: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher }
            - { call: "POST /fleet-wash/vans", payload: { name: "VAN-P", tank_capacity_gal: 100, reclaim_system: "BASIC" }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /fleet-wash/vans/${van_id}/events", payload: { event_type: "LOAD_WATER", gallons: 96 }, as: Dispatcher }
            - { call: "POST /fleet-wash/technicians", payload: { name: "Tech P" }, as: PlatformAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /fleet-wash/routes", payload: { route_date: "2026-08-03", van_id: "${van_id}", lead_technician_id: "${tech_id}" }, as: Dispatcher, captures: { route_id: $.data.id, route_v: $.data.version } }
            - { call: "POST /fleet-wash/routes/${route_id}/stops", payload: { wash_order_id: "${order_id}", expected_route_version: "${route_v}" }, as: Dispatcher, captures: { stop_id: $.data.id } }
            - { call: "POST /fleet-wash/routes/${route_id}/events", payload: { event_type: "PUBLISH" }, as: Dispatcher }
            - { call: "POST /fleet-wash/routes/${route_id}/stops/${stop_id}/events", payload: { event_type: "ARRIVE" }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "START" }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "COMPLETE", vehicles_washed_ids: ["${v1}"] }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /fleet-wash/invoices/generate", payload: { fleet_contract_id: "${contract_id}", period_month: "2026-08", variant: "FINAL" }, as: Dispatcher, captures: { inv_id: $.data.id } }
            - { call: "POST /fleet-wash/fleet-contracts/${contract_id}/events", payload: { event_type: "SUSPEND" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /fleet-wash/invoices/generate", payload: { fleet_contract_id: "${contract_id}", period_month: "2026-08", variant: "FINAL" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CONTRACT_NOT_ACTIVE (priority 25 business_referential beats priority 26 business_fiscal ERR_INVOICE_EXISTS)"
            - "Existing invoice ${inv_id} remains DRAFT"

      - name: stop_add_containment_safety_beats_technician_buffer
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_CONTAINMENT_REQUIRED]
          - errors[ERR_TECHNICIAN_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Pair business_safety x business_temporal (third distinct category pair): adding
          a stop whose van recovery (NONE = 0.00) fails a reclaim-required site AND whose
          planned window (09:30-10:05 via shift_start_at) leaves only a 15-minute gap to
          the lead technician's other-route stop violates priorities 7 and 11;
          ERR_CONTAINMENT_REQUIRED MUST win.
        test_recipe:
          setup:
            - "RETAIL customer; site PLAIN (non-reclaim, lot 8000) and site RECLAIM (BERMS, water_reclaim_required, max_discharge_gal 1000)"
            - "3 SEDANs; technician T1; route R0 (2026-08-05, BASIC van, lead T1, default shift) with stop for O0 (3 sedans) planned 08:00-09:15"
            - "Order OX (1 sedan) at RECLAIM CONFIRMED; route R3 (2026-08-05, NONE van, lead T1, shift_start_at 2026-08-05T09:30:00Z) empty, version 1"
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "Retail B", email: "rb@x.com", customer_type: "RETAIL" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "PLAIN", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_plain: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "RECLAIM", lot_size_sqft: 60000, containment_type: "BERMS", water_reclaim_required: true, max_discharge_gal: 1000 }, as: PlatformAdmin, captures: { site_reclaim: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_plain}", plate: "B01", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v1: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_plain}", plate: "B02", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v2: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_plain}", plate: "B03", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v3: $.data.id } }
            - { call: "POST /fleet-wash/technicians", payload: { name: "Tech B" }, as: PlatformAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /fleet-wash/vans", payload: { name: "VAN-B1", tank_capacity_gal: 100, reclaim_system: "BASIC" }, as: PlatformAdmin, captures: { van1_id: $.data.id } }
            - { call: "POST /fleet-wash/vans/${van1_id}/events", payload: { event_type: "LOAD_WATER", gallons: 96 }, as: Dispatcher }
            - { call: "POST /fleet-wash/vans", payload: { name: "VAN-B3", tank_capacity_gal: 100, reclaim_system: "NONE" }, as: PlatformAdmin, captures: { van3_id: $.data.id } }
            - { call: "POST /fleet-wash/vans/${van3_id}/events", payload: { event_type: "LOAD_WATER", gallons: 100 }, as: Dispatcher }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_plain}", vehicle_ids: ["${v1}", "${v2}", "${v3}"], scheduled_window_start: "2026-08-05T13:00:00Z", scheduled_window_end: "2026-08-05T14:00:00Z" }, as: PlatformAdmin, captures: { o0_id: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders/${o0_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_reclaim}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-05T15:00:00Z", scheduled_window_end: "2026-08-05T16:00:00Z" }, as: PlatformAdmin, captures: { ox_id: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders/${ox_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher }
            - { call: "POST /fleet-wash/routes", payload: { route_date: "2026-08-05", van_id: "${van1_id}", lead_technician_id: "${tech_id}" }, as: Dispatcher, captures: { r0_id: $.data.id, r0_v: $.data.version } }
            - { call: "POST /fleet-wash/routes/${r0_id}/stops", payload: { wash_order_id: "${o0_id}", expected_route_version: "${r0_v}" }, as: Dispatcher }
            - { call: "POST /fleet-wash/routes", payload: { route_date: "2026-08-05", van_id: "${van3_id}", lead_technician_id: "${tech_id}", shift_start_at: "2026-08-05T09:30:00Z" }, as: Dispatcher, captures: { r3_id: $.data.id, r3_v: $.data.version } }
          trigger:
