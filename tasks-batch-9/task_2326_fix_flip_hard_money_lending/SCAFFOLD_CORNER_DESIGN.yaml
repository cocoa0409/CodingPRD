          - state_machines.RehabLineItem
          - state_machines.Loan
          - entities.LedgerEntry
          - endpoints[POST /lending/draw-requests/{id}/fund]
        excluded_because:
          difficulty_instance: transitive_cascade / fund_cascade_allocation_to_line_completion_to_construction_complete
          rationale: "That instance funds the last outstanding allocation and follows the chain DrawLineItem -> RehabLineItem COMPLETE -> Loan construction_status CONSTRUCTION_COMPLETE with the ledger and holdback buckets asserted at each level, including the ordering requirement that the line completes before the loan axis moves."
