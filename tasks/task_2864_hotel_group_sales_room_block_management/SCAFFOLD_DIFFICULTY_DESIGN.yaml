  - rule_id: transitive_cascade
    instances:

      - name: contract_sign_cascade_four_hops_block_inventory_hold_and_function_space
        grounds:
          - state_machines.GroupContract.SENT_to_SIGNED
          - state_machines.FunctionSpaceHold.HELD_to_CONFIRMED
          - entities.RoomBlock.fields.cutoff_date
          - entities.InventoryDay.fields.committed_group_rooms
          - entities.InventoryDay.fields.held_group_rooms
          - complexity_profile.complexity_layers.cascading_side_effects
        distinguishing_aspect: |
          One signature fires four dependent hops that each touch a different entity: (1) the master
          RoomBlock plus one BlockNight per allotment entry are minted, (2) InventoryDay
          committed_group_rooms rises to 4 on all three dates *because* those BlockNight rows exist,
          (3) the accepted quote's soft hold is released so held_group_rooms falls 4 -> 0 on the same
          dates, and (4) the lead's HELD FunctionSpaceHold becomes CONFIRMED. Hops 2 and 3 move in
          opposite directions on the same rows, so a partial cascade is visible as a double count.
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z, InventoryDay rows for 2026-11-09..11"
            - "package P1, lead CLEARED, quote 23950/4/12 PROPOSED then ACCEPTED (hold of 4 rooms on each date)"
            - "one FunctionSpaceHold on GRAND_BALLROOM 2026-11-09T09:00:00Z..12:00:00Z in status HELD"
            - "contract created with cutoff_days_before_arrival 21 and allotments 4/4/4, then SENT"
