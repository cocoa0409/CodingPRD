              captures: { win_vol: $.data.id }
            - call: "POST /clearing/trade-submissions"
              payload: { counterparty_participant_id: "${p_vb}", security_id: "${sec_vol}", side: "BUY", quantity: 1, trade_price_cents: 1000000, trade_date: "2026-09-08T14:00:00Z" }
              as: ClearingMember
              as_user_id: "${p_va}"
              captures: { t_vol: $.data.id }
