      - name: completion_needs_a_signed_plan_and_a_completed_student_is_terminal
        claim_type: violation_to_error
        grounds:
          - validations[priority=40]
          - validations[priority=12]
          - errors[ERR_ADVISING_REQUIRED]
          - errors[ERR_STUDENT_STATE_INVALID]
          - state_machines.DisplacedStudent
        distinguishing_aspect: |
          The two student errors partition the same endpoint by cause, not by
          shape: from PENDING and from ADVISED a COMPLETE reports the actionable
          ERR_ADVISING_REQUIRED, while from the terminal COMPLETED status every
          further advising or progress write reports ERR_STUDENT_STATE_INVALID.
          Merely recording advice is not enough — plan_signed false leaves the
          student in ADVISED and the COMPLETE is refused a second time with the
