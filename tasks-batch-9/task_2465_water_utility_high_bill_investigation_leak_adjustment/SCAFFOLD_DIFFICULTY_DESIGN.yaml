      # -------- pair: ServiceAccount <- HighBillInvestigation --------
      - name: cross_entity_execute_shutoff_blocked_while_investigation_hold_outstanding
        grounds:
          - validations[ERR_SHUTOFF_HOLD_ACTIVE]
          - state_machines.ServiceAccount
          - state_machines.HighBillInvestigation
          - entities.ServiceAccount.fields.open_investigation_hold_count
          - entities.HighBillInvestigation.fields.shutoff_hold_active
          - endpoints[POST /service-accounts/{id}/execute-shutoff]
        distinguishing_aspect: |
          ENTITY PAIR: ServiceAccount depends on HighBillInvestigation — a different pair and a
          different direction from the investigation-depends-on-test instance. The investigation
          is opened BEFORE the shutoff is scheduled, so open_investigation_hold_count is already 1
          when schedule-shutoff runs and the account lands in SHUTOFF_SCHEDULED rather than
          SHUTOFF_HELD. Execution is then barred by the hold, not by the account's own state or
          by the notice clock: the notice period has elapsed, the account is PAST_DUE, and
          service_status is exactly the state execute-shutoff wants, yet the call returns
          ERR_SHUTOFF_HOLD_ACTIVE. Closing the investigation on the other entity drops the count
          to 0 and the identical call then succeeds.
        test_recipe:
          setup:
            - "RS-STD-2026, the four SUMMER periods, and ServiceAccount ACC-1002 with a 1.0 inch master and reads 100000 / 104000 / 108000 / 112000 / 124000 exist; all four bills are ISSUED and the balance is 30887 with credit_status PAST_DUE."
            - "An investigation is opened on the 12000-gallon 2026-07 bill FIRST, so open_investigation_hold_count is 1 while service_status is still ACTIVE."
            - "schedule-shutoff is then called, landing the account in SHUTOFF_SCHEDULED with shutoff_scheduled_for 2026-08-11."
            - "The clock is advanced to 2026-08-12 so the notice period has fully elapsed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
