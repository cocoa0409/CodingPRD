        captures:
          run_delta_after: $.data.attributed_records_delta
          run_status_after: $.data.attribution_status
      assert:
      - the index run reports run_comps == 2 and run_delta == 2 on creation
      - after the attribution removal the same run reports run_delta_after == 0 and run_status_after == UNWOUND
