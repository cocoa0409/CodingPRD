# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # --- Session: CYCLIC (SCHEDULED <-> WEATHER_HOLD) -----------------------------
  - entity: Session
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Cyclic schedule loop: SCHEDULED<->WEATHER_HOLD may repeat any number of times before the session starts."
    transitions:
      - from: SCHEDULED
        to: WEATHER_HOLD
        trigger: "POST /sessions/{id}/weather-hold"
        actor: SchoolAdmin
        preconditions:
          - "Session.status == SCHEDULED"
        side_effects:
          - "No bookings released; check-in and start blocked while held"

      - from: WEATHER_HOLD
        to: SCHEDULED
        trigger: "POST /sessions/{id}/clear-hold"
        actor: SchoolAdmin
        preconditions:
          - "Session.status == WEATHER_HOLD"
          - "School.storm_advisory_active == false (school not STORM_CLOSED)"
        side_effects:
          - "Re-opens check-in/start; loop may repeat"

      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /sessions/{id}/start"
        actor: [SchoolAdmin, Instructor]
        preconditions:
          - "Session.status == SCHEDULED"
          - "School.operating_status == OPEN (not STORM_CLOSED)"
          - "current logical clock >= Session.tide_window_start AND current logical clock < Session.tide_window_end"
        side_effects:
          - "School.open_session_count unchanged (session still counted)"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /sessions/{id}/complete"
        actor: [SchoolAdmin, Instructor]
        preconditions:
          - "Session.status == IN_PROGRESS"
        side_effects:
          - "BRANCH: each CHECKED_IN SessionBooking -> ATTENDED (Enrollment.attended_count += 1); each remaining BOOKED -> NO_SHOW (no attendance credit)"
          - "School.open_session_count decremented"

      - from: [SCHEDULED, WEATHER_HOLD]
        to: CANCELLED
        trigger: "POST /sessions/{id}/cancel"
        actor: SchoolAdmin
        preconditions:
          - "Session.status IN {SCHEDULED, WEATHER_HOLD}"
        side_effects:
          - "CASCADE hop 1: every non-terminal SessionBooking (BOOKED, CHECKED_IN) on this session -> CANCELLED"
          - "CASCADE hop 2: for each cancelled booking whose Enrollment has membership_id (Membership.status==ACTIVE), that Membership.makeup_credit_balance += 1 (school-caused cancellation grants makeup)"
          - "School.open_session_count decremented"

  # --- Enrollment: PARALLEL dimensions (progress_status x payment_status) --------
  - entity: Enrollment
    field: progress_status
    initial_state: ACTIVE
    terminal_states: [COMPLETED, WITHDRAWN]
    note: "progress_status evolves INDEPENDENTLY of payment_status (parallel dimensions on one row)."
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /enrollments/{id}/complete"
        actor: SchoolAdmin
        preconditions:
          - "Enrollment.progress_status == ACTIVE"
          - "Enrollment.payment_status == PAID (cross-dimension gate)"
          - "Enrollment.attended_count >= Enrollment.planned_sessions"
        side_effects:
          - "Compute Enrollment.final_price_cents via enrollment_final_price (chronological)"
          - "CASCADE: if parent Course.kind == CERTIFICATION and no card exists for this enrollment, issue one CertificationCard (cross-entity)"

      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/withdraw"
        actor: [SchoolAdmin, Student]
        preconditions:
          - "Enrollment.progress_status == ACTIVE"
        side_effects:
          - "CASCADE hop 1: every BOOKED/CHECKED_IN SessionBooking on this enrollment -> CANCELLED (student-caused, NO makeup credit)"
          - "CASCADE hop 2: each cancellation decrements its Session.enrolled_count, which recomputes that Session.required_instructors"

  - entity: Enrollment
    field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    note: "payment_status evolves INDEPENDENTLY of progress_status (parallel dimensions on one row)."
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /enrollments/{id}/pay"
        actor: [SchoolAdmin, Student]
        preconditions:
          - "Enrollment.payment_status == UNPAID"
          - "Enrollment.progress_status != WITHDRAWN"
        side_effects:
          - "No change to progress_status (independent dimension)"

      - from: PAID
        to: REFUNDED
        trigger: "POST /enrollments/{id}/refund"
        actor: SchoolAdmin
        preconditions:
          - "Enrollment.payment_status == PAID"
          - "Enrollment.progress_status == WITHDRAWN (cross-dimension gate)"
        side_effects:
          - "Compute Enrollment.refund_cents via enrollment_refund (lead-time waterfall over earliest remaining session)"

  # --- SessionBooking: BRANCHING fork at completion (ATTENDED | NO_SHOW) ---------
  - entity: SessionBooking
    field: status
    initial_state: BOOKED
    terminal_states: [ATTENDED, NO_SHOW, CANCELLED]
    note: "Forks at session completion into ATTENDED vs NO_SHOW with divergent side effects."
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /bookings/{id}/check-in"
        actor: [SchoolAdmin, Instructor]
        preconditions:
          - "SessionBooking.status == BOOKED"
          - "parent Session.status == IN_PROGRESS (cross-entity)"
          - "Student.waiver_status == SIGNED (cross-entity via Enrollment.student)"
          - "School.operating_status == OPEN (cross-entity)"
        side_effects: []

      - from: CHECKED_IN
        to: ATTENDED
        trigger: "system (parent Session -> COMPLETED)"
        actor: system
        preconditions:
          - "parent Session is transitioning to COMPLETED"
        side_effects:
          - "Enrollment.attended_count += 1"

      - from: BOOKED
        to: NO_SHOW
        trigger: "system (parent Session -> COMPLETED, booking never checked in)"
        actor: system
        preconditions:
          - "parent Session is transitioning to COMPLETED"
        side_effects:
          - "No attendance credit; Enrollment.attended_count unchanged"

      - from: [BOOKED, CHECKED_IN]
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel, or system (session-cancel / enrollment-withdraw cascade)"
        actor: [SchoolAdmin, Student, system]
        preconditions:
          - "SessionBooking.status IN {BOOKED, CHECKED_IN}"
        side_effects:
          - "Session.enrolled_count decremented; Session.required_instructors recomputed; Session.version +1"

  # --- RentalAgreement: linear with cancel revert -------------------------------
  - entity: RentalAgreement
    field: status
    initial_state: RESERVED
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: RESERVED
        to: ACTIVE
        trigger: "POST /rentals/{id}/checkout"
        actor: [SchoolAdmin, Student]
        preconditions:
          - "RentalAgreement.status == RESERVED"
          - "EquipmentItem.status != MAINTENANCE (cross-entity)"
          - "current logical clock >= RentalAgreement.starts_at"
        side_effects:
          - "EquipmentItem.status -> RENTED (cross-entity); EquipmentItem.version +1"

      - from: ACTIVE
        to: RETURNED
        trigger: "POST /rentals/{id}/return"
        actor: [SchoolAdmin, Student]
        preconditions:
          - "RentalAgreement.status == ACTIVE"
        side_effects:
          - "EquipmentItem.status -> AVAILABLE (cross-entity); EquipmentItem.version +1"
          - "deposit_held_cents released to student"

      - from: [RESERVED, ACTIVE]
        to: CANCELLED
        trigger: "POST /rentals/{id}/cancel"
        actor: [SchoolAdmin, Student]
        preconditions:
          - "RentalAgreement.status IN {RESERVED, ACTIVE}"
        side_effects:
          - "If was ACTIVE: EquipmentItem.status -> AVAILABLE; EquipmentItem.version +1"
          - "deposit_held_cents released to student"

  # --- Waiver: append + revoke / expire (drives Student.waiver_status) ----------
  - entity: Waiver
    field: status
    initial_state: SIGNED
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: SIGNED
        to: REVOKED
        trigger: "POST /waivers/{id}/revoke"
        actor: [SchoolAdmin, Student]
        preconditions:
          - "Waiver.status == SIGNED"
        side_effects:
          - "Student.waiver_status recomputed from the latest non-REVOKED, non-EXPIRED waiver (cross-entity); becomes NONE if none remain"

      - from: SIGNED
        to: EXPIRED
        trigger: "system (logical clock advances to or past Waiver.expires_at; observed on next read or check-in)"
        actor: system
        preconditions:
          - "current logical clock >= Waiver.expires_at"
        side_effects:
          - "Student.waiver_status recomputed (cross-entity)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent.version)
# =============================================================================
concurrency_rules:
  - rule_id: booking-create-stale-session
    parent_entity: Session
    write_endpoint: "POST /bookings"
    occ_field: "expected_session_version"
    description: |
      Creating a SessionBooking against a Session whose version has advanced
      since the client last observed it is rejected with a stale-version error.
      A prior booking create (which legitimately fills a seat and bumps
      Session.version via the enrolled_count/required_instructors recompute)
      makes the current writer's view of the session stale; the seat it believed
      free may already be taken.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: rental-create-stale-equipment
    parent_entity: EquipmentItem
    write_endpoint: "POST /rentals"
    occ_field: "expected_equipment_version"
    description: |
      Creating a RentalAgreement against an EquipmentItem whose version has
      advanced since the client last observed it is rejected. A prior rental
      create on the same item (which legitimately reserves a window and bumps
      EquipmentItem.version) makes the current writer's view stale; the window
      it believed free may now collide.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- DUAL VARIANT 1/2: cost accounting on Enrollment (forward vs chronological)
  - name: enrollment_estimate_price
    trigger: "POST /enrollments (creation)"
    algorithm: forward_looking
    formula: |
      group_pct(n):
        n <= 1  -> 0.00
        n <= 3  -> 0.10
        n <= 6  -> 0.20
        else    -> 0.30
      member_pct(tier):
        none    -> 0.00
        BASIC   -> 0.05
        PREMIUM -> 0.15
      gross       = planned_sessions * level.base_price_cents
      after_group = gross * (1 - group_pct(party_size))
      estimated_price_cents = round_half_up(after_group * (1 - member_pct(membership.tier)))
    input_set: "All PLANNED sessions; the single supplied party_size; membership tier iff membership_id present and Membership.status==ACTIVE, else none."
    constants:
      GROUP_PCT_2_3: 0.10
      GROUP_PCT_4_6: 0.20
      GROUP_PCT_7PLUS: 0.30
      MEMBER_PCT_BASIC: 0.05
      MEMBER_PCT_PREMIUM: 0.15
    precision: "round_half_up to whole cents, applied ONCE at the end (sum-then-round)"
    variants:
      - name: forward_looking_estimate
        when: "at enrollment creation"
        difference: "Uses planned_sessions and the single supplied party_size; the group discount is applied once over the whole package gross, rounded once."

  - name: enrollment_final_price
    trigger: "state_machines.Enrollment.progress_status ACTIVE_to_COMPLETED"
    algorithm: chronological
    formula: |
      # Process ATTENDED SessionBookings of this enrollment in chronological order
      # of Session.starts_at ASC, tie-break Session.created_at ASC (never id).
      subtotal = 0
      for booking in attended_bookings_sorted_by(session.starts_at ASC, session.created_at ASC):
        per_session_party = count of ATTENDED SessionBookings on that same Session  # actual attended group size
        line = round_half_up(level.base_price_cents * (1 - group_pct(per_session_party)))
        subtotal += line                          # ROUND-PER-LINE then sum
      final_price_cents = round_half_up(subtotal * (1 - member_pct(membership.tier)))
    input_set: "Only this enrollment's SessionBookings in ATTENDED status; the group tier is recomputed PER session from that session's actual ATTENDED count (NO_SHOW excluded)."
    constants:
      GROUP_PCT_2_3: 0.10
      GROUP_PCT_4_6: 0.20
      GROUP_PCT_7PLUS: 0.30
      MEMBER_PCT_BASIC: 0.05
      MEMBER_PCT_PREMIUM: 0.15
    precision: "round_half_up PER attended-session line, then sum, then round_half_up once after member discount (round-per-line, NOT sum-then-round)"
    variants:
      - name: chronological_final
        when: "at enrollment completion"
        difference: "Diverges from the estimate: per-session group tier from ACTUAL attended size, rounding applied per line then summed, and only ATTENDED sessions count."

  # --- COMBINATORIAL (a): ratio ceiling threshold on Session ---------------------
  - name: session_required_instructors
    trigger: "SessionBooking create/cancel; Session read"
    algorithm: threshold
    formula: |
      enrolled_count = count(SessionBookings on the session in {BOOKED, CHECKED_IN, ATTENDED})
      required_instructors = ceil(enrolled_count / level.max_students_per_instructor)   # 0 when enrolled_count == 0
    input_set: "SessionBookings on this session in {BOOKED, CHECKED_IN, ATTENDED}; max_students_per_instructor from the session's CourseLevel."
    constants: {}
    precision: "integer ceiling division"
    variants:
      - name: ratio_ceiling
        when: "every booking add/remove"
        difference: "Boundary at exact multiples: enrolled==max -> 1 instructor, enrolled==max+1 -> 2 (>= vs > on the ceil boundary)."

  # --- COMBINATORIAL (a, 2nd mode-axis): tiered marginal rental fee --------------
  - name: rental_fee
    trigger: "POST /rentals (creation)"
    algorithm: tiered_pricing
    formula: |
      hours = ceil((ends_at - starts_at) total_seconds / 3600)   # round up to whole hours
      rate  = equipment.hourly_rate_cents
      t1 = min(hours, 2)                       # first 2h at full rate
      t2 = min(max(hours - 2, 0), 6)           # next 6h at 50%
      t3 = max(hours - 8, 0)                   # 8h+ at 25%
      rental_fee_cents   = round_half_up(t1*rate + t2*rate*0.5 + t3*rate*0.25)
      deposit_held_cents = equipment.deposit_cents
    input_set: "Single equipment item; duration from the requested window, ceil to whole hours."
    constants:
      TIER1_HOURS: 2
      TIER2_HOURS: 6
      TIER2_RATE_PCT: 0.5
      TIER3_RATE_PCT: 0.25
    precision: "round_half_up to whole cents once at the end"
    variants:
      - name: marginal_tiered
        when: "rental creation"
        difference: "Marginal (not average) rate per tier; the 2h and 8h boundaries are tested at exact crossings."

  # --- WATERFALL: refund by earliest-session lead time ---------------------------
  - name: enrollment_refund
    trigger: "state_machines.Enrollment.payment_status PAID_to_REFUNDED"
    algorithm: waterfall_allocation
    formula: |
      # Lead time from current logical clock to the EARLIEST remaining (non-terminal,
      # not-yet-started) Session.starts_at for this enrollment's bookings.
      remaining = SessionBookings of this enrollment in {BOOKED, CHECKED_IN}
                  whose Session.starts_at > now
                  sorted by Session.starts_at ASC, Session.created_at ASC
      if remaining is empty: lead_hours = +infinity
      else:                  lead_hours = (remaining[0].session.starts_at - now) / 3600
      refund_pct = 1.00 if lead_hours >= 48
                   else 0.50 if lead_hours >= 24
                   else 0.00
      refund_cents = round_half_up(enrollment.estimated_price_cents * refund_pct)
    input_set: "This enrollment's non-terminal future bookings; the EARLIEST drives the tier."
    constants:
      FULL_REFUND_LEAD_HOURS: 48
      HALF_REFUND_LEAD_HOURS: 24
    precision: "round_half_up to whole cents"
    variants:
      - name: lead_time_waterfall
        when: "refund after withdrawal"
        difference: "Tier selected by the EARLIEST remaining session's lead time; boundary at exactly 48h and 24h (>=)."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path resource {id} exists"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all /{id} endpoints"

  - priority: 4
    category: existence
    check: "Every FK in the request body resolves to an existing resource in the same school"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "create endpoints with body FKs"

  - priority: 5
    category: business_referential
    check: "entity_backed acting user owns/scopes the target (Student owns own enrollment/booking/rental; Instructor is the session's lead)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Student/Instructor-scoped mutations"

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches parent.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /bookings, POST /rentals, POST /schools/{id}/storm-advisory, POST /equipment/{id}/maintenance"

  - priority: 7
    category: state
    check: "Target resource in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: business_constraint
    check: "Storm advisory: no session scheduling, session start, or check-in while School.operating_status == STORM_CLOSED"
    error_id: ERR_SCHOOL_STORM_CLOSED
    http_status: 409
    applies_to: "POST /sessions, POST /sessions/{id}/start, POST /bookings/{id}/check-in"

  - priority: 9
    category: business_safety
    check: "Student waiver_status == SIGNED for enroll and check-in"
    error_id: ERR_WAIVER_REQUIRED
    http_status: 422
    applies_to: "POST /enrollments, POST /bookings/{id}/check-in"

  - priority: 10
    category: business_safety
    check: "Student age_years >= level.min_age"
    error_id: ERR_AGE_REQUIREMENT_NOT_MET
    http_status: 422
    applies_to: "POST /enrollments"

  - priority: 11
    category: business_safety
    check: "If level.requires_swim_test then Student.swim_test_status == PASSED"
    error_id: ERR_SWIM_TEST_REQUIRED
    http_status: 422
    applies_to: "POST /enrollments"

  - priority: 12
    category: business_safety
    check: "Lead instructor certified for the CourseLevel's Course.discipline"
    error_id: ERR_INSTRUCTOR_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /sessions"

  - priority: 13
    category: business_constraint
    check: "Prerequisite: enrolling in a level of rank>1 requires a COMPLETED enrollment at the rank-1 level of the same course for this student"
    error_id: ERR_PREREQUISITE_NOT_MET
    http_status: 422
    applies_to: "POST /enrollments"

  - priority: 14
    category: business_temporal
    check: "Tide window must contain the session interval: tide_window_start <= starts_at AND ends_at <= tide_window_end"
    error_id: ERR_TIDE_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /sessions"

  - priority: 15
    category: business_temporal
    check: "Instructor double-booking: new Session interval [starts_at, ends_at) must not overlap another non-terminal Session of the same instructor (HALF-OPEN; touching endpoints allowed, no buffer)"
    error_id: ERR_INSTRUCTOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /sessions"

  - priority: 16
    category: business_temporal
    check: "Equipment rental overlap: new RentalAgreement window must not collide with any non-terminal agreement on the same item, where each existing agreement reserves [starts_at, ends_at + 1h turnaround buffer] (CLOSED interval WITH buffer)"
    error_id: ERR_EQUIPMENT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /rentals"

  - priority: 17
    category: business_constraint
    check: "Equipment type must equal level.required_equipment_type when the rental supplies session_id"
    error_id: ERR_EQUIPMENT_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /rentals with session_id"

  - priority: 18
    category: business_constraint
    check: "Session capacity: enrolled_count < capacity before adding a booking"
    error_id: ERR_SESSION_FULL
    http_status: 409
    applies_to: "POST /bookings"

  - priority: 19
    category: business_constraint
    check: "Makeup booking requires Membership.makeup_credit_balance >= 1"
    error_id: ERR_NO_MAKEUP_CREDIT
    http_status: 422
    applies_to: "POST /bookings with use_makeup_credit=true"

  - priority: 20
    category: business_constraint
    check: "Checkout blocked on an EquipmentItem in MAINTENANCE"
    error_id: ERR_EQUIPMENT_IN_MAINTENANCE
    http_status: 409
    applies_to: "POST /rentals/{id}/checkout"

  - priority: 21
    category: business_fiscal
    check: "Enrollment must be PAID before completion"
    error_id: ERR_PAYMENT_REQUIRED
    http_status: 422
    applies_to: "POST /enrollments/{id}/complete"

  - priority: 22
    category: business_constraint
    check: "Enrollment attended_count >= planned_sessions before completion"
    error_id: ERR_ATTENDANCE_INCOMPLETE
    http_status: 422
    applies_to: "POST /enrollments/{id}/complete"

# =============================================================================
# §1.5 API Endpoint Table  (flat topology; all collections top-level)
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Server startup default is 2026-03-01T00:00:00Z; before any call here the clock reads exactly that default and NEVER falls back to wall-clock time. All age/waiver/tide/lead-time rules read this clock."
    roles: [SchoolAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["Sets logical clock; recomputes age_years and waiver_status on subsequent reads"]

  # --- School ---
  - method: POST
    path: "/schools"
    description: "Create a school"
    roles: [SchoolAdmin]
    code: 201
    input: [name, "timezone?"]
    output: School
    side_effects: ["operating_status=OPEN, storm_advisory_active=false, open_session_count=0, version=1"]

  - method: GET
    path: "/schools"
    description: "List schools"
    roles: [SchoolAdmin, Instructor, Student]
    code: 200
    input: ["limit?", "offset?"]
    output: School[]
    side_effects: []

  - method: GET
    path: "/schools/{id}"
    description: "Get a school (derived operating_status, open_session_count)"
    roles: [SchoolAdmin, Instructor, Student]
    code: 200
    input: []
    output: School
    side_effects: []

  - method: POST
    path: "/schools/{id}/storm-advisory"
    description: "Set or clear a storm advisory (OCC on School.version)"
    roles: [SchoolAdmin]
    code: 200
    input: [active, expected_school_version]
    output: School
    side_effects:
      - "storm_advisory_active=active; operating_status -> STORM_CLOSED when active else OPEN"
      - "increments School.version by 1"

  # --- Course ---
  - method: POST
    path: "/courses"
    description: "Create a course"
    roles: [SchoolAdmin]
    code: 201
    input: [school_id, discipline, title, kind]
    output: Course
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/courses"
    description: "List courses filtered by school_id (reverse-reachability for Course.school_id)"
    roles: [SchoolAdmin, Instructor, Student]
    code: 200
    input: ["school_id?", "limit?", "offset?"]
    output: Course[]
    side_effects: []

  - method: GET
    path: "/courses/{id}"
    description: "Get a course"
    roles: [SchoolAdmin, Instructor, Student]
    code: 200
    input: []
    output: Course
    side_effects: []

  # --- CourseLevel ---
  - method: POST
    path: "/levels"
    description: "Create a course level"
    roles: [SchoolAdmin]
    code: 201
    input: [course_id, rank, name, max_students_per_instructor, base_price_cents, min_age, "requires_swim_test?", required_equipment_type]
    output: CourseLevel
    side_effects: ["school_id copied from parent Course"]

  - method: GET
    path: "/levels"
    description: "List levels filtered by course_id or school_id (reverse-reachability for CourseLevel.course_id and CourseLevel.school_id)"
    roles: [SchoolAdmin, Instructor, Student]
    code: 200
    input: ["course_id?", "school_id?", "limit?", "offset?"]
    output: CourseLevel[]
    side_effects: []

  - method: GET
    path: "/levels/{id}"
    description: "Get a course level"
    roles: [SchoolAdmin, Instructor, Student]
    code: 200
    input: []
    output: CourseLevel
    side_effects: []

  # --- Instructor ---
  - method: POST
    path: "/instructors"
    description: "Register an instructor"
    roles: [SchoolAdmin]
    code: 201
    input: [school_id, full_name, certified_disciplines]
    output: Instructor
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/instructors"
    description: "List instructors filtered by school_id (reverse-reachability for Instructor.school_id)"
    roles: [SchoolAdmin, Instructor, Student]
    code: 200
    input: ["school_id?", "limit?", "offset?"]
    output: Instructor[]
    side_effects: []

  - method: GET
    path: "/instructors/{id}"
    description: "Get an instructor"
    roles: [SchoolAdmin, Instructor, Student]
    code: 200
    input: []
    output: Instructor
    side_effects: []

  # --- Equipment ---
  - method: POST
    path: "/equipment"
    description: "Add an equipment item"
    roles: [SchoolAdmin]
    code: 201
    input: [school_id, equipment_type, asset_tag, hourly_rate_cents, deposit_cents]
    output: EquipmentItem
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/equipment"
    description: "List equipment filtered by school_id (reverse-reachability for EquipmentItem.school_id)"
    roles: [SchoolAdmin, Instructor, Student]
    code: 200
    input: ["school_id?", "equipment_type?", "limit?", "offset?"]
    output: EquipmentItem[]
    side_effects: []

  - method: GET
    path: "/equipment/{id}"
    description: "Get an equipment item"
    roles: [SchoolAdmin, Instructor, Student]
    code: 200
    input: []
    output: EquipmentItem
    side_effects: []

  - method: POST
    path: "/equipment/{id}/maintenance"
    description: "Toggle equipment MAINTENANCE status (OCC on EquipmentItem.version)"
    roles: [SchoolAdmin]
    code: 200
    input: [in_maintenance, expected_equipment_version]
    output: EquipmentItem
    side_effects:
      - "status -> MAINTENANCE when in_maintenance=true (only from AVAILABLE); -> AVAILABLE when false"
      - "increments EquipmentItem.version by 1"

  # --- Student ---
  - method: POST
    path: "/students"
    description: "Register a student"
    roles: [SchoolAdmin, Student]
    code: 201
    input: [school_id, full_name, birthdate]
    output: Student
    side_effects: ["swim_test_status=UNTESTED, waiver_status=NONE, age_years computed vs clock"]

  - method: GET
    path: "/students"
    description: "List students filtered by school_id (reverse-reachability for Student.school_id)"
    roles: [SchoolAdmin, Instructor]
    code: 200
    input: ["school_id?", "limit?", "offset?"]
    output: Student[]
    side_effects: []

  - method: GET
    path: "/students/{id}"
    description: "Get a student (derived age_years and waiver_status)"
    roles: [SchoolAdmin, Instructor, Student]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: POST
    path: "/students/{id}/swim-test"
    description: "Record a swim test result"
    roles: [SchoolAdmin]
    code: 200
    input: [result]
    output: Student
    side_effects: ["swim_test_status -> PASSED|FAILED"]

  # --- Waiver ---
  - method: POST
    path: "/waivers"
    description: "Sign a waiver for a student"
    roles: [SchoolAdmin, Student]
    code: 201
    input: [student_id, signed_by, "is_guardian?", expires_at]
    output: Waiver
    side_effects: ["status=SIGNED; Student.waiver_status recomputed -> SIGNED (cross-entity)"]

  - method: GET
    path: "/waivers"
    description: "List waivers filtered by student_id (reverse-reachability for Waiver.student_id)"
    roles: [SchoolAdmin, Instructor, Student]
    code: 200
    input: ["student_id?", "limit?", "offset?"]
    output: Waiver[]
    side_effects: []

  - method: GET
    path: "/waivers/{id}"
    description: "Get a waiver"
    roles: [SchoolAdmin, Instructor, Student]
    code: 200
    input: []
    output: Waiver
    side_effects: []

  - method: POST
    path: "/waivers/{id}/revoke"
    description: "Revoke a signed waiver"
    roles: [SchoolAdmin, Student]
    code: 200
    input: []
    output: Waiver
    side_effects: ["status -> REVOKED; Student.waiver_status recomputed (cross-entity)"]

  # --- Membership ---
  - method: POST
    path: "/memberships"
    description: "Create a membership for a student"
    roles: [SchoolAdmin, Student]
    code: 201
    input: [student_id, tier]
    output: Membership
    side_effects: ["status=ACTIVE, makeup_credit_balance=0"]

  - method: GET
    path: "/memberships"
    description: "List memberships filtered by student_id (reverse-reachability for Membership.student_id)"
    roles: [SchoolAdmin, Instructor, Student]
    code: 200
    input: ["student_id?", "limit?", "offset?"]
    output: Membership[]
    side_effects: []

  - method: GET
    path: "/memberships/{id}"
    description: "Get a membership (derived makeup_credit_balance)"
    roles: [SchoolAdmin, Instructor, Student]
    code: 200
    input: []
    output: Membership
    side_effects: []

  # --- Enrollment ---
  - method: POST
    path: "/enrollments"
    description: "Enroll a student in a course level (package)"
    roles: [SchoolAdmin, Student]
    code: 201
    input: [school_id, student_id, course_level_id, "membership_id?", planned_sessions, party_size]
    output: Enrollment
    side_effects:
      - "progress_status=ACTIVE, payment_status=UNPAID; estimated_price_cents via enrollment_estimate_price"
      - "Validates storm-closed N/A, waiver, age, swim test, prerequisite"

  - method: GET
    path: "/enrollments"
    description: "List enrollments filtered by school_id, student_id, course_level_id, or membership_id (reverse-reachability for Enrollment FKs)"
    roles: [SchoolAdmin, Instructor, Student]
    code: 200
    input: ["school_id?", "student_id?", "course_level_id?", "membership_id?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  - method: GET
    path: "/enrollments/{id}"
    description: "Get an enrollment (both parallel dimensions + prices)"
    roles: [SchoolAdmin, Instructor, Student]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: POST
    path: "/enrollments/{id}/pay"
    description: "Mark enrollment PAID (payment dimension)"
    roles: [SchoolAdmin, Student]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["payment_status -> PAID"]

  - method: POST
    path: "/enrollments/{id}/withdraw"
    description: "Withdraw an enrollment (progress dimension)"
    roles: [SchoolAdmin, Student]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "progress_status -> WITHDRAWN"
      - "CASCADE: BOOKED/CHECKED_IN bookings -> CANCELLED; each decrements its Session.enrolled_count and recomputes required_instructors"

  - method: POST
    path: "/enrollments/{id}/refund"
    description: "Refund a withdrawn, paid enrollment (payment dimension)"
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["payment_status -> REFUNDED; refund_cents via enrollment_refund"]

  - method: POST
    path: "/enrollments/{id}/complete"
    description: "Complete an enrollment (progress dimension)"
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "progress_status -> COMPLETED; final_price_cents via enrollment_final_price"
      - "If Course.kind==CERTIFICATION: issue CertificationCard (cross-entity cascade)"

  # --- Session ---
  - method: POST
    path: "/sessions"
    description: "Schedule a session"
    roles: [SchoolAdmin]
    code: 201
    input: [school_id, course_level_id, instructor_id, starts_at, ends_at, tide_window_start, tide_window_end, capacity]
    output: Session
    side_effects:
      - "status=SCHEDULED; School.open_session_count incremented"
      - "Validates storm closure, instructor certification, tide window, instructor double-booking"

  - method: GET
    path: "/sessions"
    description: "List sessions filtered by school_id, course_level_id, or instructor_id (reverse-reachability for Session FKs)"
    roles: [SchoolAdmin, Instructor, Student]
    code: 200
    input: ["school_id?", "course_level_id?", "instructor_id?", "limit?", "offset?"]
    output: Session[]
    side_effects: []

  - method: GET
    path: "/sessions/{id}"
    description: "Get a session (derived enrolled_count, required_instructors)"
    roles: [SchoolAdmin, Instructor, Student]
    code: 200
    input: []
    output: Session
    side_effects: []

  - method: POST
    path: "/sessions/{id}/weather-hold"
    description: "Put a session on WEATHER_HOLD"
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: Session
    side_effects: ["status SCHEDULED -> WEATHER_HOLD"]

  - method: POST
    path: "/sessions/{id}/clear-hold"
    description: "Clear WEATHER_HOLD back to SCHEDULED (cyclic)"
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: Session
    side_effects: ["status WEATHER_HOLD -> SCHEDULED"]

  - method: POST
    path: "/sessions/{id}/start"
    description: "Start a session (SCHEDULED -> IN_PROGRESS)"
    roles: [SchoolAdmin, Instructor]
    code: 200
    input: []
    output: Session
    side_effects: ["status -> IN_PROGRESS; validates storm closure and tide window"]

  - method: POST
    path: "/sessions/{id}/complete"
    description: "Complete a session (IN_PROGRESS -> COMPLETED)"
    roles: [SchoolAdmin, Instructor]
    code: 200
    input: []
    output: Session
    side_effects:
      - "status -> COMPLETED"
      - "CASCADE: CHECKED_IN bookings -> ATTENDED (+1 Enrollment.attended_count); BOOKED -> NO_SHOW"
      - "School.open_session_count decremented"

  - method: POST
    path: "/sessions/{id}/cancel"
    description: "Cancel a session (school-caused)"
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: Session
    side_effects:
      - "status -> CANCELLED"
      - "CASCADE: non-terminal bookings -> CANCELLED; +1 makeup_credit_balance per affected member booking"
      - "School.open_session_count decremented"

  # --- SessionBooking ---
  - method: POST
    path: "/bookings"
    description: "Book an enrollment into a session (OCC on Session.version)"
    roles: [SchoolAdmin, Student]
    code: 201
    input: [session_id, enrollment_id, expected_session_version, "use_makeup_credit?"]
    output: SessionBooking
    side_effects:
      - "status=BOOKED; Session.enrolled_count incremented; required_instructors recomputed; Session.version +1"
      - "If use_makeup_credit=true: Membership.makeup_credit_balance -= 1, is_makeup=true"
      - "Validates session capacity, makeup credit, OCC"

  - method: GET
    path: "/bookings"
    description: "List bookings filtered by session_id or enrollment_id (reverse-reachability for SessionBooking.session_id and .enrollment_id)"
    roles: [SchoolAdmin, Instructor, Student]
    code: 200
    input: ["session_id?", "enrollment_id?", "limit?", "offset?"]
    output: SessionBooking[]
    side_effects: []

  - method: GET
    path: "/bookings/{id}"
    description: "Get a booking"
    roles: [SchoolAdmin, Instructor, Student]
    code: 200
    input: []
    output: SessionBooking
    side_effects: []

  - method: POST
    path: "/bookings/{id}/check-in"
    description: "Check a student in for a started session"
    roles: [SchoolAdmin, Instructor]
    code: 200
    input: []
    output: SessionBooking
    side_effects:
      - "status BOOKED -> CHECKED_IN"
      - "Validates Session IN_PROGRESS, Student.waiver_status==SIGNED, storm closure"

  - method: POST
    path: "/bookings/{id}/cancel"
    description: "Cancel a booking (student/admin)"
    roles: [SchoolAdmin, Student]
    code: 200
    input: []
    output: SessionBooking
    side_effects: ["status -> CANCELLED; Session.enrolled_count decremented; required_instructors recomputed"]

  # --- Rentals ---
  - method: POST
    path: "/rentals"
    description: "Create an equipment rental agreement (OCC on EquipmentItem.version)"
    roles: [SchoolAdmin, Student]
    code: 201
    input: [school_id, student_id, equipment_item_id, starts_at, ends_at, expected_equipment_version, "session_id?"]
    output: RentalAgreement
    side_effects:
      - "status=RESERVED; rental_fee_cents and deposit_held_cents computed; EquipmentItem.version +1"
      - "Validates equipment overlap (buffer), type match when session_id given, OCC"

  - method: GET
    path: "/rentals"
    description: "List rentals filtered by school_id, student_id, or equipment_item_id (reverse-reachability for RentalAgreement FKs)"
    roles: [SchoolAdmin, Instructor, Student]
    code: 200
    input: ["school_id?", "student_id?", "equipment_item_id?", "session_id?", "limit?", "offset?"]
    output: RentalAgreement[]
    side_effects: []

  - method: GET
    path: "/rentals/{id}"
    description: "Get a rental agreement (computed fees)"
    roles: [SchoolAdmin, Instructor, Student]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: []

  - method: POST
    path: "/rentals/{id}/checkout"
    description: "Check out equipment (RESERVED -> ACTIVE)"
    roles: [SchoolAdmin, Student]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: ["status -> ACTIVE; EquipmentItem.status -> RENTED"]

  - method: POST
    path: "/rentals/{id}/return"
    description: "Return equipment (ACTIVE -> RETURNED)"
    roles: [SchoolAdmin, Student]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: ["status -> RETURNED; EquipmentItem.status -> AVAILABLE; deposit released"]

  - method: POST
    path: "/rentals/{id}/cancel"
    description: "Cancel a rental (RESERVED or ACTIVE -> CANCELLED)"
    roles: [SchoolAdmin, Student]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: ["status -> CANCELLED; if was ACTIVE EquipmentItem.status -> AVAILABLE; deposit released"]

  # --- Certification cards ---
  - method: GET
    path: "/certification-cards"
    description: "List certification cards filtered by student_id, enrollment_id, or course_level_id (reverse-reachability for CertificationCard FKs)"
    roles: [SchoolAdmin, Instructor, Student]
    code: 200
    input: ["student_id?", "enrollment_id?", "course_level_id?", "limit?", "offset?"]
    output: CertificationCard[]
    side_effects: []

  - method: GET
    path: "/certification-cards/{id}"
    description: "Get a certification card"
    roles: [SchoolAdmin, Instructor, Student]
    code: 200
    input: []
    output: CertificationCard
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation per §1.7" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "entity_backed user acting on a resource they do not own/scope to" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource or body FK does not exist within the school" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, bad enum, or simple constraint (rank<1, negative price, ends_at<=starts_at)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_SCHOOL_STORM_CLOSED, http: 409, condition: "Operation blocked while School.operating_status == STORM_CLOSED" }
  - { id: ERR_WAIVER_REQUIRED, http: 422, condition: "Student waiver_status != SIGNED for enroll or check-in" }
  - { id: ERR_AGE_REQUIREMENT_NOT_MET, http: 422, condition: "Student age_years < level.min_age" }
  - { id: ERR_SWIM_TEST_REQUIRED, http: 422, condition: "Level requires swim test and Student.swim_test_status != PASSED" }
  - { id: ERR_INSTRUCTOR_NOT_CERTIFIED, http: 422, condition: "Lead instructor not certified for the course discipline" }
  - { id: ERR_PREREQUISITE_NOT_MET, http: 422, condition: "Enrolling in rank>1 without a COMPLETED enrollment at rank-1 of the same course" }
  - { id: ERR_TIDE_WINDOW_INVALID, http: 422, condition: "Session interval not contained within [tide_window_start, tide_window_end)" }
  - { id: ERR_INSTRUCTOR_DOUBLE_BOOKED, http: 409, condition: "New session interval overlaps another non-terminal session for the same instructor (half-open)" }
  - { id: ERR_EQUIPMENT_UNAVAILABLE, http: 409, condition: "Rental window overlaps another non-terminal agreement on the same item within the 1h turnaround buffer (closed-with-buffer)" }
  - { id: ERR_EQUIPMENT_TYPE_MISMATCH, http: 422, condition: "Rented equipment_type != level.required_equipment_type for a session-linked rental" }
  - { id: ERR_SESSION_FULL, http: 409, condition: "Session enrolled_count == capacity at booking time" }
  - { id: ERR_NO_MAKEUP_CREDIT, http: 422, condition: "Makeup booking requested with Membership.makeup_credit_balance < 1" }
  - { id: ERR_EQUIPMENT_IN_MAINTENANCE, http: 409, condition: "Checkout attempted on an EquipmentItem in MAINTENANCE status" }
  - { id: ERR_PAYMENT_REQUIRED, http: 422, condition: "Enrollment not PAID at completion" }
  - { id: ERR_ATTENDANCE_INCOMPLETE, http: 422, condition: "Enrollment.attended_count < planned_sessions at completion" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SchoolAdmin
    description: "Operator role: full administrative surface over schools and all child resources."
    identity: "opaque"
    exclusive_operations:
      - "POST /schools — create school"
      - "POST /schools/{id}/storm-advisory — set/clear storm advisory"
      - "POST /courses — create course"
      - "POST /levels — create level"
      - "POST /instructors — register instructor"
      - "POST /equipment — add equipment"
      - "POST /equipment/{id}/maintenance — toggle maintenance"
      - "POST /students/{id}/swim-test — record swim test"
      - "POST /sessions — schedule session"
      - "POST /sessions/{id}/weather-hold — weather hold"
      - "POST /sessions/{id}/clear-hold — clear hold"
      - "POST /sessions/{id}/cancel — cancel session"
      - "POST /enrollments/{id}/complete — complete enrollment"
      - "POST /enrollments/{id}/refund — refund enrollment"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "POST /students — with Student"
      - "POST /waivers — with Student"
      - "POST /waivers/{id}/revoke — with Student"
      - "POST /memberships — with Student"
      - "POST /enrollments — with Student"
      - "POST /enrollments/{id}/pay — with Student"
      - "POST /enrollments/{id}/withdraw — with Student"
      - "POST /sessions/{id}/start — with Instructor"
      - "POST /sessions/{id}/complete — with Instructor"
      - "POST /bookings — with Student"
      - "POST /bookings/{id}/check-in — with Instructor"
      - "POST /bookings/{id}/cancel — with Student"
      - "POST /rentals — with Student"
      - "POST /rentals/{id}/checkout — with Student"
      - "POST /rentals/{id}/return — with Student"
      - "POST /rentals/{id}/cancel — with Student"
      - "All GET reads"

  - name: Instructor
    description: "Teaching role: starts/completes sessions and checks students in. X-User-ID equals an Instructor.id."
    identity: "entity_backed:Instructor"
    exclusive_operations: []
    shared_operations:
      - "POST /sessions/{id}/start — with SchoolAdmin"
      - "POST /sessions/{id}/complete — with SchoolAdmin"
      - "POST /bookings/{id}/check-in — with SchoolAdmin"
      - "GET reads of schools, courses, levels, instructors, students, sessions, bookings, enrollments, memberships, waivers, rentals, equipment, certification-cards"

  - name: Student
    description: "Customer role: manages own waivers, membership, enrollments, bookings, rentals. X-User-ID equals a Student.id."
    identity: "entity_backed:Student"
    exclusive_operations: []
    shared_operations:
      - "POST /students — self-register (with SchoolAdmin)"
      - "POST /waivers — own (with SchoolAdmin)"
      - "POST /waivers/{id}/revoke — own (with SchoolAdmin)"
      - "POST /memberships — own (with SchoolAdmin)"
      - "POST /enrollments — own (with SchoolAdmin)"
      - "POST /enrollments/{id}/pay — own (with SchoolAdmin)"
      - "POST /enrollments/{id}/withdraw — own (with SchoolAdmin)"
      - "POST /bookings — own enrollment (with SchoolAdmin)"
      - "POST /bookings/{id}/cancel — own (with SchoolAdmin)"
      - "POST /rentals — own (with SchoolAdmin)"
      - "POST /rentals/{id}/checkout — own (with SchoolAdmin)"
      - "POST /rentals/{id}/return — own (with SchoolAdmin)"
      - "POST /rentals/{id}/cancel — own (with SchoolAdmin)"
      - "GET reads scoped to self"
