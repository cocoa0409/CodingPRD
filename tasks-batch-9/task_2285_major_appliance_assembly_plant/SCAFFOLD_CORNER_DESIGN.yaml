            - "Trigger 1: HTTP 409 with error.error_id == ERR_PART_CHANGE_PENDING; BuildSlot.${slot1_id}.status still PLANNED"
            - "Trigger 3: HTTP 200 — EngineeringChange.${ec1_id}.status == REJECTED with decided_by_user_id == 'eng-2', and Part.${p_door_id}.lifecycle_status is back to ACTIVE"
