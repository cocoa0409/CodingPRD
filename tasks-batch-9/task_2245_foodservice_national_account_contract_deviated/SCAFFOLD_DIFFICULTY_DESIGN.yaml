              captures: { err_id: $.data.error_id }
          assert:
            - "DeviationAgreement.${dev_id}.deviated_price_cents == 3900"
            - "revision_round after the first submit == 0"
            - "revision_round after the third REVISION_REQUESTED -> SUBMITTED loop == 3"
            - "DeviationAgreement.${dev_id}.status == REVISION_REQUESTED after the fourth REQUEST_REVISION decision"
            - "the ninth trigger call returns HTTP 409 with ${err_id} == ERR_MAX_REVISION_ROUNDS_EXCEEDED"
            - "DeviationAgreement.${dev_id}.revision_round == 3 (unchanged by the rejected resubmit)"
            - "DeviationAgreement.${dev_id}.submitted_by_user_id == analyst-1"

