# SCAFFOLD_CORNER_DESIGN.yaml -- task 2747, Appraisal Review & Reconsideration of Value
#
# SKILL.md §1.9. Breadth probe over §1.1-§1.7 of SCAFFOLD.yaml, walked row-by-row against
# references/claim-extraction-guide.md. Sections and claim_type values are taken from that
# guide only. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# `excluded_because:` stubs citing the covering §1.8 instance by name.
#
# Conventions shared with SCAFFOLD_DIFFICULTY_DESIGN.yaml:
#   * the logical clock starts at 2026-08-01T00:00:00Z and only POST /_clock/set_current_utc moves it
#   * opaque-role audit ids: chief_user_1 / desk_user_1 / desk_user_2 / compliance_user_1 / lo_user_1
#   * entity-backed roles pass their own row id as as_user_id: AMCCoordinator -> ${amc1_id},
#     Appraiser -> ${apr_a_id}, Borrower -> ${lf1_id}
#   * the clean narrative literal is "Average condition, typical marketability for the market area."
#     and the biased narrative literal carries exactly three PROHIBITED_TERMS (indexes 1, 2 and 8)
#   * the standard three-comparable grid (39000000/+390000, 40000000/0, 41000000/-410000 at
#     1.00/1.50/2.00 miles) reconciles to 39993333, i.e. variance 2 bps, and maxes at 100 gross bps

scaffold_corner_design:
  - section: entities
    instances:
      - name: creation_loan_file_echoes_inputs_and_seeds_computed_fields
        claim_type: Creation
        grounds:
          - endpoints.POST_loan_files
          - entities.LoanFile
          - response_envelope.success
        distinguishing_aspect: "POST /loan-files with every required field returns 201, the success envelope, version 1, collateral_status PENDING_APPRAISAL and null collateral computeds."
        test_recipe:
          setup:
            - "Empty database; clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /appraisal-desk/loan-files"
              payload: { loan_number: "LN-2747-C001", loan_purpose: "REFINANCE", market_type: "SUBURBAN", risk_tier: "STANDARD", loan_amount_cents: 30000000, borrower_display_name: "Ada Borrower" }
              as: LoanOfficer
              as_user_id: "lo_user_1"
              captures: { lf1_id: $.data.id }
          assert:
            - "HTTP 201 with response_type == object and meta.api_request_id present"
            - "data.loan_number == LN-2747-C001, loan_purpose == REFINANCE, market_type == SUBURBAN, risk_tier == STANDARD, loan_amount_cents == 30000000"
            - "data.contract_price_cents is null (optional input omitted)"
            - "data.underwriting_status == SUBMITTED and collateral_status == PENDING_APPRAISAL"
            - "data.current_appraised_value_cents, effective_value_cents, ltv_bps, decision_impact and value_of_record_appraisal_id are all null"
            - "data.rov_request_count == 0 and data.version == 1 and created_at == 2026-08-01T00:00:00Z"

      - name: retrieval_appraisal_returns_stored_and_computed_fields
        claim_type: Retrieval
        grounds:
          - endpoints.GET_appraisals_id
          - entities.Appraisal
        distinguishing_aspect: "GET /appraisals/{id} returns the same row the intake POST minted, including the pre-rule-check nulls (completeness_score_bps null, review_status RECEIVED)."
        test_recipe:
          setup:
            - "One AMC, one ACTIVE panelled appraiser, one STANDARD loan file, one delivered appraisal with no comparables and no rule checks yet."
          setup_api_calls:
            - call: "POST /appraisal-desk/amcs"
              payload: { name: "Corner AMC One" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
              captures: { amc1_id: $.data.id }
            - call: "POST /appraisal-desk/appraisers"
              payload: { full_name: "Alice Author", license_number: "CA-AL-C002", license_state: "CA" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
              captures: { apr_a_id: $.data.id, apr_a_v: $.data.version }
            - call: "POST /appraisal-desk/panel-memberships"
              payload: { appraiser_id: "${apr_a_id}", amc_id: "${amc1_id}", coverage_state: "CA", tier: "GENERAL", expected_appraiser_version: "${apr_a_v}" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
            - call: "POST /appraisal-desk/loan-files"
              payload: { loan_number: "LN-2747-C002", loan_purpose: "REFINANCE", market_type: "SUBURBAN", risk_tier: "STANDARD", loan_amount_cents: 30000000, borrower_display_name: "Ben Borrower" }
              as: LoanOfficer
              as_user_id: "lo_user_1"
              captures: { lf1_id: $.data.id, lf1_v: $.data.version }
            - call: "POST /appraisal-desk/appraisals"
              payload: { loan_file_id: "${lf1_id}", appraiser_id: "${apr_a_id}", amc_id: "${amc1_id}", report_form_type: "FORM_1004", effective_date: "2026-07-15T00:00:00Z", reported_value_cents: 40000000, sections_present: ["SUBJECT", "CONTRACT", "NEIGHBORHOOD", "SITE", "IMPROVEMENTS", "SALES_COMPARISON", "RECONCILIATION", "CERTIFICATION"], exhibit_count: 7, narrative_text: "Average condition, typical marketability for the market area.", subject_census_tract_band: "A", expected_loan_file_version: "${lf1_v}" }
              as: AMCCoordinator
              as_user_id: "${amc1_id}"
              captures: { ap1_id: $.data.id }
          trigger:
            - call: "GET /appraisal-desk/appraisals/${ap1_id}"
              payload: {}
              as: AppraisalDeskReviewer
              as_user_id: "desk_user_1"
          assert:
            - "HTTP 200, response_type == object, data.id == ${ap1_id}"
            - "data.loan_file_id == ${lf1_id}, appraiser_id == ${apr_a_id}, amc_id == ${amc1_id}, reported_value_cents == 40000000, exhibit_count == 7"
            - "data.review_status == RECEIVED and bias_screen_status == NOT_SCREENED"
            - "data.completeness_score_bps is null, indicated_value_cents is null, bias_risk_index is null"
            - "data.eligible_comp_count == 0, closed_comp_count == 0, rule_check_fail_count == 0, rule_check_warn_count == 0"
            - "LoanFile.${lf1_id}.collateral_status == PENDING_APPRAISAL (intake alone does not open a review)"

      - name: listing_comparables_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_appraisals_id_comparables
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /appraisals/{id}/comparables with limit 2 returns 2 of 3 rows with total_count 3 and has_more true; offset 2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "One AMC, one ACTIVE panelled appraiser, one loan file, one appraisal carrying the standard three-comparable grid."
          setup_api_calls:
            - call: "POST /appraisal-desk/amcs"
              payload: { name: "Corner AMC Two" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
              captures: { amc1_id: $.data.id }
            - call: "POST /appraisal-desk/appraisers"
              payload: { full_name: "Alice Author", license_number: "CA-AL-C003", license_state: "CA" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
              captures: { apr_a_id: $.data.id, apr_a_v: $.data.version }
            - call: "POST /appraisal-desk/panel-memberships"
              payload: { appraiser_id: "${apr_a_id}", amc_id: "${amc1_id}", coverage_state: "CA", tier: "GENERAL", expected_appraiser_version: "${apr_a_v}" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
            - call: "POST /appraisal-desk/loan-files"
              payload: { loan_number: "LN-2747-C003", loan_purpose: "REFINANCE", market_type: "SUBURBAN", risk_tier: "STANDARD", loan_amount_cents: 30000000, borrower_display_name: "Cleo Borrower" }
              as: LoanOfficer
              as_user_id: "lo_user_1"
              captures: { lf1_id: $.data.id, lf1_v: $.data.version }
            - call: "POST /appraisal-desk/appraisals"
              payload: { loan_file_id: "${lf1_id}", appraiser_id: "${apr_a_id}", amc_id: "${amc1_id}", report_form_type: "FORM_1004", effective_date: "2026-07-15T00:00:00Z", reported_value_cents: 40000000, sections_present: ["SUBJECT", "CONTRACT", "NEIGHBORHOOD", "SITE", "IMPROVEMENTS", "SALES_COMPARISON", "RECONCILIATION", "CERTIFICATION"], exhibit_count: 7, narrative_text: "Average condition, typical marketability for the market area.", subject_census_tract_band: "A", expected_loan_file_version: "${lf1_v}" }
              as: AMCCoordinator
              as_user_id: "${amc1_id}"
              captures: { ap1_id: $.data.id }
            - call: "POST /appraisal-desk/appraisals/${ap1_id}/comparables"
              payload: { street_address: "1 Alder Street", sale_price_cents: 39000000, gross_adjustment_cents: 390000, net_adjustment_cents: 390000, distance_miles: 1.00, sale_date: "2026-05-01T00:00:00Z", sale_status: "CLOSED", dwelling_type: "SFR", census_tract_band: "A" }
              as: AMCCoordinator
              as_user_id: "${amc1_id}"
              captures: { cmp1_id: $.data.id }
            - call: "POST /appraisal-desk/appraisals/${ap1_id}/comparables"
              payload: { street_address: "2 Alder Street", sale_price_cents: 40000000, gross_adjustment_cents: 400000, net_adjustment_cents: 0, distance_miles: 1.50, sale_date: "2026-06-01T00:00:00Z", sale_status: "CLOSED", dwelling_type: "SFR", census_tract_band: "A" }
              as: AMCCoordinator
              as_user_id: "${amc1_id}"
            - call: "POST /appraisal-desk/appraisals/${ap1_id}/comparables"
              payload: { street_address: "3 Alder Street", sale_price_cents: 41000000, gross_adjustment_cents: 410000, net_adjustment_cents: -410000, distance_miles: 2.00, sale_date: "2026-06-15T00:00:00Z", sale_status: "CLOSED", dwelling_type: "SFR", census_tract_band: "A" }
              as: AMCCoordinator
              as_user_id: "${amc1_id}"
          trigger:
            - call: "GET /appraisal-desk/appraisals/${ap1_id}/comparables"
              payload: { limit: 2, offset: 0 }
              as: AppraisalDeskReviewer
              as_user_id: "desk_user_1"
            - call: "GET /appraisal-desk/appraisals/${ap1_id}/comparables"
              payload: { limit: 2, offset: 2 }
              as: AppraisalDeskReviewer
              as_user_id: "desk_user_1"
          assert:
            - "first response: response_type == array, total_count == 3, limit == 2, offset == 0, has_more == true, and exactly 2 rows"
            - "first response rows are ordered created_at ASC, so data[0].id == ${cmp1_id}"
            - "second response: total_count == 3, offset == 2, has_more == false, exactly 1 row, data[0].street_address == 3 Alder Street"
            - "omitting limit and offset entirely returns all 3 rows with limit == 10 and offset == 0 from pagination_defaults"

      - name: not_found_get_appraisal_with_unknown_id_returns_404
        claim_type: Not Found
        grounds:
          - errors.ERR_APPRAISAL_NOT_FOUND
          - endpoints.GET_appraisals_id
        distinguishing_aspect: "GET /appraisals/{id} with a well-formed but unknown UUID returns ERR_APPRAISAL_NOT_FOUND (404) and the error envelope, not an empty object."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /appraisal-desk/appraisals/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AppraisalDeskReviewer
              as_user_id: "desk_user_1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 404 with response_type == error and data.error_id == ERR_APPRAISAL_NOT_FOUND"
            - "data.message is a non-empty string"

      - name: required_fields_appraisal_intake_missing_narrative_text_rejected
        claim_type: Required Fields
        grounds:
          - errors.ERR_INVALID_REQUEST
          - validations.priority_8_ERR_INVALID_REQUEST
          - endpoints.POST_appraisals
        distinguishing_aspect: "narrative_text is a required input with no default; omitting it returns ERR_INVALID_REQUEST (400) and no Appraisal row is written."
        test_recipe:
          setup:
            - "One AMC, one ACTIVE panelled appraiser and one loan file, so every other referential rule is satisfied."
          setup_api_calls:
            - call: "POST /appraisal-desk/amcs"
              payload: { name: "Corner AMC Three" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
              captures: { amc1_id: $.data.id }
            - call: "POST /appraisal-desk/appraisers"
              payload: { full_name: "Alice Author", license_number: "CA-AL-C005", license_state: "CA" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
              captures: { apr_a_id: $.data.id, apr_a_v: $.data.version }
            - call: "POST /appraisal-desk/panel-memberships"
              payload: { appraiser_id: "${apr_a_id}", amc_id: "${amc1_id}", coverage_state: "CA", tier: "GENERAL", expected_appraiser_version: "${apr_a_v}" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
            - call: "POST /appraisal-desk/loan-files"
              payload: { loan_number: "LN-2747-C005", loan_purpose: "REFINANCE", market_type: "SUBURBAN", risk_tier: "STANDARD", loan_amount_cents: 30000000, borrower_display_name: "Dev Borrower" }
              as: LoanOfficer
              as_user_id: "lo_user_1"
              captures: { lf1_id: $.data.id, lf1_v: $.data.version }
          trigger:
            - call: "POST /appraisal-desk/appraisals"
              payload: { loan_file_id: "${lf1_id}", appraiser_id: "${apr_a_id}", amc_id: "${amc1_id}", report_form_type: "FORM_1004", effective_date: "2026-07-15T00:00:00Z", reported_value_cents: 40000000, sections_present: ["SUBJECT", "CONTRACT", "NEIGHBORHOOD", "SITE", "IMPROVEMENTS", "SALES_COMPARISON", "RECONCILIATION", "CERTIFICATION"], exhibit_count: 7, subject_census_tract_band: "A", expected_loan_file_version: "${lf1_v}" }
              as: AMCCoordinator
              as_user_id: "${amc1_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /appraisal-desk/appraisals filtered by loan_file_id == ${lf1_id} returns total_count == 0"
            - "LoanFile.${lf1_id}.version is unchanged from ${lf1_v} (the OCC bump does not fire on a rejected body)"

      - name: defaults_amc_created_without_optional_config_uses_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.AMC.fields.sla_response_hours
          - entities.AMC.fields.concurrent_dispute_capacity
          - entities.AMC.fields.escalation_budget_cents
          - endpoints.POST_amcs
        distinguishing_aspect: "POST /amcs with only `name` applies sla_response_hours 72, concurrent_dispute_capacity 2, escalation_budget_cents 500000 and panel_status ACTIVE."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /appraisal-desk/amcs"
              payload: { name: "Default Config AMC" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
          assert:
            - "HTTP 201 with data.sla_response_hours == 72, concurrent_dispute_capacity == 2, escalation_budget_cents == 500000, panel_status == ACTIVE"
            - "data.ytd_escalation_spend_cents == 0, sla_breach_count == 0, open_dispute_count == 0, version == 1"

      - name: computed_fields_comparable_adjustment_metrics_derived_not_accepted
        claim_type: Computed Fields
        grounds:
          - calculations.comparable_adjustment_magnitudes
          - entities.ComparableSale.fields.adjusted_price_cents
          - entities.ComparableSale.fields.gross_adjustment_bps
          - endpoints.POST_appraisals_id_comparables
        distinguishing_aspect: "adjusted_price_cents, gross_adjustment_bps and net_adjustment_bps are computed from sale_price_cents and the two adjustment amounts: 41000000 with gross 410000 and net -410000 yields 40590000, 100 and 100."
        test_recipe:
          setup:
            - "One AMC, one ACTIVE panelled appraiser, one loan file and one appraisal with no comparables yet."
          setup_api_calls:
            - call: "POST /appraisal-desk/amcs"
              payload: { name: "Corner AMC Four" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
              captures: { amc1_id: $.data.id }
            - call: "POST /appraisal-desk/appraisers"
              payload: { full_name: "Alice Author", license_number: "CA-AL-C007", license_state: "CA" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
              captures: { apr_a_id: $.data.id, apr_a_v: $.data.version }
            - call: "POST /appraisal-desk/panel-memberships"
              payload: { appraiser_id: "${apr_a_id}", amc_id: "${amc1_id}", coverage_state: "CA", tier: "GENERAL", expected_appraiser_version: "${apr_a_v}" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
            - call: "POST /appraisal-desk/loan-files"
              payload: { loan_number: "LN-2747-C007", loan_purpose: "REFINANCE", market_type: "SUBURBAN", risk_tier: "STANDARD", loan_amount_cents: 30000000, borrower_display_name: "Eve Borrower" }
              as: LoanOfficer
              as_user_id: "lo_user_1"
              captures: { lf1_id: $.data.id, lf1_v: $.data.version }
            - call: "POST /appraisal-desk/appraisals"
              payload: { loan_file_id: "${lf1_id}", appraiser_id: "${apr_a_id}", amc_id: "${amc1_id}", report_form_type: "FORM_1004", effective_date: "2026-07-15T00:00:00Z", reported_value_cents: 40000000, sections_present: ["SUBJECT", "CONTRACT", "NEIGHBORHOOD", "SITE", "IMPROVEMENTS", "SALES_COMPARISON", "RECONCILIATION", "CERTIFICATION"], exhibit_count: 7, narrative_text: "Average condition, typical marketability for the market area.", subject_census_tract_band: "A", expected_loan_file_version: "${lf1_v}" }
              as: AMCCoordinator
              as_user_id: "${amc1_id}"
              captures: { ap1_id: $.data.id }
          trigger:
            - call: "POST /appraisal-desk/appraisals/${ap1_id}/comparables"
              payload: { street_address: "9 Hazel Street", sale_price_cents: 41000000, gross_adjustment_cents: 410000, net_adjustment_cents: -410000, distance_miles: 2.00, sale_date: "2026-06-15T00:00:00Z", sale_status: "CLOSED", dwelling_type: "SFR", census_tract_band: "A" }
              as: AMCCoordinator
              as_user_id: "${amc1_id}"
          assert:
            - "HTTP 201 with data.adjusted_price_cents == 40590000"
            - "data.gross_adjustment_bps == 100 and data.net_adjustment_bps == 100 (absolute value, so the negative net still reports 100)"
            - "data.included_in_grid == true from its declared default"
            - "Appraisal.${ap1_id}.eligible_comp_count == 1 and closed_comp_count == 1"
            - "Appraisal.${ap1_id}.completeness_score_bps is still null -- comparables alone do not run the battery"

      - name: system_fields_comparable_parent_and_timestamps_are_server_owned
        claim_type: System Fields
        grounds:
          - entities.ComparableSale.fields.appraisal_id
          - entities.AppraiserCommunication.fields.sender_role
          - global_conventions.logical_clock
        distinguishing_aspect: "ComparableSale.appraisal_id comes from the path and AppraiserCommunication stamps sender_role, sender_user_id and sent_at from the request headers and the logical clock, none of them from the body."
        test_recipe:
          setup:
            - "One AMC, one ACTIVE panelled appraiser, one loan file and one appraisal; the clock is then moved to 2026-08-03T08:15:00Z before the communication is sent."
          setup_api_calls:
            - call: "POST /appraisal-desk/amcs"
              payload: { name: "Corner AMC Five" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
              captures: { amc1_id: $.data.id }
            - call: "POST /appraisal-desk/appraisers"
              payload: { full_name: "Alice Author", license_number: "CA-AL-C008", license_state: "CA" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
              captures: { apr_a_id: $.data.id, apr_a_v: $.data.version }
            - call: "POST /appraisal-desk/panel-memberships"
              payload: { appraiser_id: "${apr_a_id}", amc_id: "${amc1_id}", coverage_state: "CA", tier: "GENERAL", expected_appraiser_version: "${apr_a_v}" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
            - call: "POST /appraisal-desk/loan-files"
              payload: { loan_number: "LN-2747-C008", loan_purpose: "REFINANCE", market_type: "SUBURBAN", risk_tier: "STANDARD", loan_amount_cents: 30000000, borrower_display_name: "Fritz Borrower" }
              as: LoanOfficer
              as_user_id: "lo_user_1"
              captures: { lf1_id: $.data.id, lf1_v: $.data.version }
            - call: "POST /appraisal-desk/appraisals"
              payload: { loan_file_id: "${lf1_id}", appraiser_id: "${apr_a_id}", amc_id: "${amc1_id}", report_form_type: "FORM_1004", effective_date: "2026-07-15T00:00:00Z", reported_value_cents: 40000000, sections_present: ["SUBJECT", "CONTRACT", "NEIGHBORHOOD", "SITE", "IMPROVEMENTS", "SALES_COMPARISON", "RECONCILIATION", "CERTIFICATION"], exhibit_count: 7, narrative_text: "Average condition, typical marketability for the market area.", subject_census_tract_band: "A", expected_loan_file_version: "${lf1_v}" }
              as: AMCCoordinator
              as_user_id: "${amc1_id}"
              captures: { ap1_id: $.data.id }
            - call: "POST /appraisal-desk/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:15:00Z" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
          trigger:
            - call: "POST /appraisal-desk/appraisals/${ap1_id}/communications"
              payload: { recipient: "APPRAISER", intent: "CLARIFICATION_REQUEST", body: "Please confirm the gross living area source for the subject." }
              as: AppraisalDeskReviewer
              as_user_id: "desk_user_1"
          assert:
            - "HTTP 201 with data.appraisal_id == ${ap1_id} (taken from the path)"
            - "data.sender_role == AppraisalDeskReviewer and data.sender_user_id == desk_user_1, both from the request headers"
            - "data.sent_at == 2026-08-03T08:15:00Z, read from the logical clock and not from the host wall clock"
            - "data carries no version field (AppraiserCommunication declares common_fields false)"

      - name: type_constraints_invalid_report_form_type_enum_rejected
        claim_type: Type Constraints
        grounds:
          - errors.ERR_INVALID_REQUEST
          - validations.priority_8_ERR_INVALID_REQUEST
          - entities.Appraisal.fields.report_form_type
        distinguishing_aspect: "report_form_type is an enum; the value FORM_9999 is rejected with ERR_INVALID_REQUEST (400) before any referential or OCC rule runs."
        test_recipe:
          setup:
            - "One AMC, one ACTIVE panelled appraiser and one loan file."
          setup_api_calls:
            - call: "POST /appraisal-desk/amcs"
              payload: { name: "Corner AMC Six" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
              captures: { amc1_id: $.data.id }
            - call: "POST /appraisal-desk/appraisers"
              payload: { full_name: "Alice Author", license_number: "CA-AL-C009", license_state: "CA" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
              captures: { apr_a_id: $.data.id, apr_a_v: $.data.version }
            - call: "POST /appraisal-desk/panel-memberships"
              payload: { appraiser_id: "${apr_a_id}", amc_id: "${amc1_id}", coverage_state: "CA", tier: "GENERAL", expected_appraiser_version: "${apr_a_v}" }
              as: ChiefAppraiser
