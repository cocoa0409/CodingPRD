            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "POST /ehs/training-assignments", payload: { lab_id: "${l}", worker_id: "${pi}", hazard_class: "FLAMMABLE", due_date: "2027-01-01T00:00:00Z" }, as: EHSAdmin, captures: { tr: $.data.id } }
            - { call: "POST /ehs/training-assignments/${tr}/complete", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/accumulation-areas", payload: { lab_id: "${l}", name: "SAA-1", area_type: "SAA", capacity_containers: 10 }, as: EHSAdmin, captures: { area: $.data.id } }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "D-1", chemical_name: "Ethanol", hazard_class: "FLAMMABLE", quantity_value: 1.0, quantity_unit: "GAL" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { c1: $.data.id } }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "D-2", chemical_name: "Methanol", hazard_class: "FLAMMABLE", quantity_value: 1.0, quantity_unit: "GAL" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { c2: $.data.id } }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "D-3", chemical_name: "Acetone", hazard_class: "FLAMMABLE", quantity_value: 1.0, quantity_unit: "GAL" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { c3: $.data.id } }
            - { call: "POST /ehs/containers/${c1}/tag-waste", payload: { accumulation_area_id: "${area}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/containers/${c2}/tag-waste", payload: { accumulation_area_id: "${area}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/containers/${c3}/tag-waste", payload: { accumulation_area_id: "${area}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests", payload: { lab_id: "${l}" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { p1: $.data.id } }
            - { call: "POST /ehs/waste-pickup-requests", payload: { lab_id: "${l}" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { p2: $.data.id } }
            - { call: "POST /ehs/waste-pickup-requests", payload: { lab_id: "${l}" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { p3: $.data.id } }
            - { call: "POST /ehs/waste-pickup-requests/${p1}/add-item", payload: { container_id: "${c1}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests/${p2}/add-item", payload: { container_id: "${c2}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests/${p3}/add-item", payload: { container_id: "${c3}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests/${p1}/submit", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests/${p2}/submit", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests/${p3}/submit", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests/${p1}/schedule", payload: { dock_id: "DOCK-1", window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T11:00:00Z" }, as: EHSAdmin }
          trigger:
            - { call: "POST /ehs/waste-pickup-requests/${p2}/schedule", payload: { dock_id: "DOCK-1", window_start: "2026-08-10T11:30:00Z", window_end: "2026-08-10T12:30:00Z" }, as: EHSAdmin }
