      - 'extension_days 7: HTTP 200, status == EXTENDED, extension_count == 1, total_extension_days == 7'
      - projected_release_at == 2026-09-07T00:00:00Z (started_at 2026-08-01 + 30 protocol days + 7)
      - 'RESUME with no extension_days: HTTP 200, status == ACTIVE, extension_count == 1 and projected_release_at unchanged at 2026-09-07T00:00:00Z'
      - Specimen.disposition_status == QUARANTINE throughout
- section: errors
  instances:
  - name: error_request_missing_x_user_id_header_returns_401
    claim_type: Error Triggerable
    grounds:
    - §1.6 ERR_MISSING_USER_CONTEXT (401, applies_to all)
    - §1.4 priority 1 (identity before everything else)
    - §1.0 response_envelope error form
    distinguishing_aspect: 'The identity gate runs before pagination shape and before path resolution: the same call is 401 ERR_MISSING_USER_CONTEXT even when it ALSO carries limit 0 and an unknown exhibit id, which would otherwise be 400 and 404.'
    test_recipe:
      setup:
      - One exhibit exists. Every call in the trigger is sent with a valid X-User-Role header but with the X-User-ID header omitted entirely.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      trigger:
      - call: GET /aquarium/exhibits/${ex_id}
        payload: {}
        captures: {err: $.data.error_id}
      - call: GET /aquarium/species
        payload: {limit: 0}
      - call: GET /aquarium/exhibits/00000000-0000-4000-8000-000000000999
        payload: {}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-9, name: Surge Channel, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 40000, bioload_capacity_units: 20}
      assert:
      - 'every call: HTTP 401 and data.error_id == ERR_MISSING_USER_CONTEXT'
      - the limit-0 call is 401, NOT 400 ERR_INVALID_PAGINATION
      - the unknown-exhibit call is 401, NOT 404 ERR_EXHIBIT_NOT_FOUND
      - the create call is 401 and no Exhibit row is written
      - each error body carries data.message and meta.api_request_id
  - name: error_unrecognised_role_header_is_invalid_role_not_unauthorized
    claim_type: Error Triggerable
    grounds:
    - §1.6 ERR_INVALID_ROLE (401, X-User-Role not one of the six §1.7 roles)
    - §1.6 ERR_UNAUTHORIZED (403)
    - §1.4 priority 2 then priority 3
    - §1.7 the six declared roles
    distinguishing_aspect: An UNRECOGNISED role string is a 401 ERR_INVALID_ROLE — a malformed identity — while a recognised-but-wrong role on the same endpoint is a 403 ERR_UNAUTHORIZED. The two failures are one priority step apart and must not collapse into a single code.
    test_recipe:
      setup:
      - One life-support plant and one exhibit; the acting X-User-ID header is always present.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      trigger:
      - call: GET /aquarium/exhibits/${ex_id}
        payload: {}
        as: MarineBiologistIntern
        as_user_id: u-1
        captures: {err: $.data.error_id}
      - call: POST /aquarium/species
        payload: {scientific_name: Sebastes ruberrimus, common_name: yelloweye rockfish, taxon_group: TELEOST, protection_status: UNLISTED, sustainability_rating: GREEN, bioload_units_per_specimen: 12, base_quarantine_days: 30}
        as: PartnerInstitutionLiaison
        as_user_id: ${lss_id}
      - call: GET /aquarium/exhibits/${ex_id}
        payload: {}
        as: PartnerInstitutionLiaison
        as_user_id: ${lss_id}
      assert:
      - 'the unrecognised role: HTTP 401 and data.error_id == ERR_INVALID_ROLE'
      - 'the liaison creating a species: HTTP 403 and data.error_id == ERR_UNAUTHORIZED (POST /aquarium/species is exclusive to CuratorOfCollections)'
      - 'the liaison reading an exhibit: HTTP 403 and data.error_id == ERR_UNAUTHORIZED — GET /aquarium/exhibits/{id} does not list PartnerInstitutionLiaison in its §1.5 roles, so ''all GET endpoints'' is not a blanket grant for that role'
      - no Species row is created
  - name: error_every_unknown_id_returns_its_own_entity_not_found_code
    claim_type: Error Triggerable
    grounds:
    - §1.6 ERR_LIFE_SUPPORT_SYSTEM_NOT_FOUND / ERR_EXHIBIT_NOT_FOUND / ERR_SPECIES_NOT_FOUND / ERR_INSTITUTION_NOT_FOUND / ERR_COLLECTION_PLAN_ENTRY_NOT_FOUND / ERR_ACQUISITION_REQUEST_NOT_FOUND / ERR_PERMIT_NOT_FOUND / ERR_SPECIMEN_NOT_FOUND / ERR_QUARANTINE_CASE_NOT_FOUND / ERR_VETERINARY_CASE_NOT_FOUND / ERR_TRANSFER_REQUEST_NOT_FOUND / ERR_INTERACTION_SESSION_NOT_FOUND / ERR_ACCREDITATION_AUDIT_NOT_FOUND (all 404)
    - §1.4 priority 5 (path-id existence)
    distinguishing_aspect: Thirteen entity families each own a DISTINCT 404 code; a shared generic ERR_NOT_FOUND would pass a status-code-only test but fail every assertion here.
    test_recipe:
      setup:
      - An empty database apart from the logical clock.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      trigger:
      - call: GET /aquarium/life-support-systems/00000000-0000-4000-8000-000000000999
        payload: {}
        as: ComplianceDirector
        captures: {err: $.data.error_id}
      - call: GET /aquarium/exhibits/00000000-0000-4000-8000-000000000999
        payload: {}
        as: ComplianceDirector
      - call: GET /aquarium/species/00000000-0000-4000-8000-000000000999
        payload: {}
        as: ComplianceDirector
      - call: GET /aquarium/institutions/00000000-0000-4000-8000-000000000999
        payload: {}
        as: ComplianceDirector
      - call: GET /aquarium/collection-plan-entries/00000000-0000-4000-8000-000000000999
        payload: {}
        as: ComplianceDirector
      - call: GET /aquarium/acquisition-requests/00000000-0000-4000-8000-000000000999
        payload: {}
        as: ComplianceDirector
      - call: GET /aquarium/permits/00000000-0000-4000-8000-000000000999
        payload: {}
        as: ComplianceDirector
      - call: GET /aquarium/specimens/00000000-0000-4000-8000-000000000999
        payload: {}
        as: ComplianceDirector
      - call: GET /aquarium/quarantine-cases/00000000-0000-4000-8000-000000000999
        payload: {}
        as: ComplianceDirector
      - call: GET /aquarium/veterinary-cases/00000000-0000-4000-8000-000000000999
        payload: {}
        as: ComplianceDirector
      - call: GET /aquarium/transfer-requests/00000000-0000-4000-8000-000000000999
        payload: {}
        as: ComplianceDirector
      - call: GET /aquarium/interaction-sessions/00000000-0000-4000-8000-000000000999
        payload: {}
        as: ComplianceDirector
      - call: GET /aquarium/accreditation-audits/00000000-0000-4000-8000-000000000999
        payload: {}
        as: ComplianceDirector
      assert:
      - 'every call: HTTP 404'
      - the codes are, in call order, ERR_LIFE_SUPPORT_SYSTEM_NOT_FOUND, ERR_EXHIBIT_NOT_FOUND, ERR_SPECIES_NOT_FOUND, ERR_INSTITUTION_NOT_FOUND, ERR_COLLECTION_PLAN_ENTRY_NOT_FOUND, ERR_ACQUISITION_REQUEST_NOT_FOUND, ERR_PERMIT_NOT_FOUND, ERR_SPECIMEN_NOT_FOUND, ERR_QUARANTINE_CASE_NOT_FOUND, ERR_VETERINARY_CASE_NOT_FOUND, ERR_TRANSFER_REQUEST_NOT_FOUND, ERR_INTERACTION_SESSION_NOT_FOUND and ERR_ACCREDITATION_AUDIT_NOT_FOUND
      - no call returns 200 with an empty object
  - name: error_reused_unique_codes_return_duplicate_code_per_entity_family
    claim_type: Error Triggerable
    grounds:
    - §1.6 ERR_DUPLICATE_CODE (409)
    - §1.4 priority 41 (system_code, exhibit_code, scientific_name, institution_code, accession_code, audit_code)
    - §1.1 uniqueness constraints on those fields
    distinguishing_aspect: 'Uniqueness is enforced on scientific_name — not on common_name — and per family: re-using EX-COLD-1 and LSS-COLD-1 and "Sebastes ruberrimus" each returns 409, while a second species sharing only the common name is created successfully.'
    test_recipe:
