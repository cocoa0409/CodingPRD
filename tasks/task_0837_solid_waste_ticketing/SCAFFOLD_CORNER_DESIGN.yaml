        claim_type: rate_threshold_triggers
        grounds: [entities.ScaleReservation.fields.window_end, "validations[priority=11]"]
        distinguishing_aspect: "Half-open adjacency: reserving lane 1 [11:00,12:00) directly after an existing [10:00,11:00) succeeds (touching endpoint is not an overlap)."
        test_recipe:
          setup: ["Facility OPEN with a RESERVED lane-1 window [10:00,11:00)."]
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 500 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { fac_id: $.data.id }
