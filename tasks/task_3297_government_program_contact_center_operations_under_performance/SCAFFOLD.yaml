scenario: 'Government Program Contact Center Operations Under Performance Contracts (Maximus): contract award with defined service levels covering
  answer speed, abandonment, accuracy and quality with financial consequences, staffing and training pipelines for program-specific eligibility
  rules with certification before taking calls, call routing across programs, languages and specialized queues with overflow arrangements, quality
  monitoring with call scoring, coaching plans and corrective action, volume surge planning around enrollment periods, policy changes and public
  events, knowledge base maintenance as program rules change with rapid retraining, privacy and security controls for sensitive program data with
  incident reporting, invoice preparation tied to measured performance and staffing levels'
domain_name: gov-program-contact-center
api_prefix: ''
complexity_profile:
  primary_archetype: compliance / audit
  secondary_archetype: workflow orchestration
  complexity_layers:
  - dual_variant_calculation
  - cascading_side_effects
  - rate_threshold_triggers
  - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
  - one_to_many
  - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\": \"object\" | \"array\"\
    , \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: Contract
  parent: null
  common_fields: true
  fields:
  - name: agency_name
    type: string
    source: input
    description: Awarding government agency name
  - name: measurement_tz
    type: string
    source: input
    description: IANA timezone name in which service-level measurement windows are evaluated (e.g. America/New_York)
  - name: cap_absolutes
    type: boolean
    source: input
    description: 'Cumulative-cap mode. When false the monthly withholding floor applies: withheld_cents_cum for month m may not exceed the sum
      of gross_cents of all months up to and including m (so a first-month gross of 50000 caps month-1 withholding at 50000). When true the cumulative
      cap is not applied; only per-line absolute caps (cap_pct_of_gross) bind, so a month-1 line may withhold more than month-1 gross.'
  - name: status
    type: enum
    source: system
    description: DRAFT -> ACTIVE -> CLOSED; DRAFT->CLOSED allowed (withdrawn before award effect)
    constraints: values {DRAFT, ACTIVE, CLOSED}
  - name: withheld_cents_cum
    type: integer
    source: computed
    description: Cumulative amount withheld across all invoices of this contract; maintained by the withholding cascade
    default: 0
  - name: cure_periods_used
    type: integer
    source: computed
    description: Count of completed CurePeriods (status REMEDIED or FORFEIT) on this contract; drives AUTO-REVIEW in invoice preparation
    default: 0
- name: ServiceLevel
  parent: null
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: input
    description: 'FK -> Contract.id; service level is scoped to one contract; derivation exception: reachable via GET /service-levels?contract_id=
      (filter belongs to the canonical Contract collection)'
  - name: program_code
    type: string
    source: input
    description: Program scope the metric is measured over (e.g. MEDICAID); the same program_code groups queues, articles, agents and calls
  - name: metric
    type: enum
    source: input
    description: Service-level metric
    constraints: values {ASA, ABANDON, QA_AVG}
  - name: target
    type: number
    source: input
    description: 'Contractual target: ASA in seconds (compliant when measured <= target), ABANDON as fraction (compliant when measured <= target),
      QA_AVG as 0-100 score (compliant when measured >= target)'
  - name: cap_pct_of_gross
    type: number
    source: input
    description: 'Per-line absolute cap: withheld_cents for this line may not exceed cap_pct_of_gross * invoice gross_cents (round_half_up to
      cents); applies in both cap modes'
  - name: remedy_fee_cents
    type: integer
    source: input
    description: Fee that converts an open breach's CurePeriod from PENDING to REMEDIED when the remediation fee is paid
  - name: effective_from
    type: datetime
    source: input
    description: Start of the effectiveness window; the binding service level for (contract, program_code, metric) at time t is the one with status
      EFFECTIVE and effective_from <= t, ties broken by latest effective_from then latest created_at
  - name: status
    type: enum
    source: system
    description: DRAFT -> EFFECTIVE -> SUPERSEDED -> ARCHIVED; EFFECTIVE -> ARCHIVED allowed
    constraints: values {DRAFT, EFFECTIVE, SUPERSEDED, ARCHIVED}
- name: Agent
  parent: null
  common_fields: true
  fields:
  - name: full_name
    type: string
    source: input
    description: Agent full name
  - name: languages
    type: array
    source: input
    description: ISO 639-1 language codes the agent can serve (e.g. ["en", "es"]); routing eligibility filter
  - name: employment_status
    type: enum
    source: system
    description: ACTIVE | INACTIVE; INACTIVE agents are excluded from routing pools and staffing counts; reactivation requires certification freshness
    constraints: values {ACTIVE, INACTIVE}
- name: Certification
  parent: null
  common_fields: false
  fields:
  - name: agent_id
    type: string
    source: input
    description: 'FK -> Agent.id; the agent being certified; derivation exception: reverse lookup via GET /certifications?agent_id= on the canonical
      Certification collection'
  - name: program_code
    type: string
    source: input
    description: Program whose eligibility rules the certification covers
  - name: training_course_id
    type: string
    source: input
    description: 'FK -> TrainingCourse.id; the course whose completion grounded this certification; derivation exception: reverse lookup via GET
      /certifications?training_course_id='
  - name: valid_until
    type: datetime
    source: input
    description: Certification expiry; fresh at time t when valid_until > t (a certification expiring exactly at t is already stale)
  - name: invalidated_at
    type: datetime
    source: computed
    description: Set by the retraining cascade when a published KnowledgeArticle for the same program_code has effective_at > this certification's
      training course completion time; null while the certification stands
    default: null
  - name: invalidated_by_article_id
    type: string
    source: computed
    description: 'FK -> KnowledgeArticle.id; the article whose publication invalidated this certification (null while valid); derivation exception:
      reverse lookup via GET /certifications?invalidated_by_article_id='
    default: null
- name: Queue
  parent: null
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: input
    description: FK -> Contract.id
  - name: program_code
    type: string
    source: input
    description: Program scope of the queue
  - name: language_code
    type: string
    source: input
    description: ISO 639-1 language served by this queue; a call in language L may only be assigned to a queue with language_code == L, unless
      it overflows
  - name: overflow_queue_id
    type: string
    source: input
    description: 'FK -> Queue.id; optional designated overflow target; derivation exception: reverse lookup via GET /queues?overflow_queue_id=
      on the canonical Queue collection. Must be another queue of the same contract with the same language_code and (for SPECIALTY queues) the
      same specialty_tag; the reference must already exist at creation and on every later PATCH; clearing it once any call is assigned is rejected'
    default: null
  - name: queue_type
    type: enum
    source: input
    description: GENERAL queues take any call of their program; SPECIALTY queues require the call's required_specialty to equal specialty_tag
    constraints: values {GENERAL, SPECIALTY}
  - name: specialty_tag
    type: string
    source: input
    description: Required when queue_type is SPECIALTY; must be null for GENERAL queues
    default: null
  - name: status
    type: enum
    source: system
    description: OPEN <-> PAUSED cyclic; CLOSED terminal (only when no assigned call exists in a non-terminal state)
    constraints: values {OPEN, PAUSED, CLOSED}
- name: Call
  parent: null
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: input
    description: FK -> Contract.id; contract under which the call arrived
  - name: program_code
    type: string
    source: input
    description: Program the caller dialed; drives queue eligibility and agent certification checks
  - name: language_code
    type: string
    source: input
    description: Caller language; hard routing constraint
  - name: required_specialty
    type: string
    source: input
    description: Optional specialty tag the call requires; only SPECIALTY queues with this tag are eligible
    default: null
  - name: enqueued_at
    type: datetime
    source: input
    description: Logical timestamp the call entered the system; drives chronological measurement ordering and surge-window membership
  - name: status
    type: enum
    source: system
    description: WAITING -> ASSIGNED -> ANSWERED -> COMPLETED, or WAITING -> ABANDONED; ASSIGNED -> ABANDONED allowed (caller hangs up while ringing)
    constraints: values {WAITING, ASSIGNED, ANSWERED, COMPLETED, ABANDONED}
  - name: queue_id
    type: string
    source: computed
    description: FK -> Queue.id; set by the route action; null while WAITING. Reverse-reachable via GET /queues/{id}/calls.
    default: null
  - name: agent_id
    type: string
    source: computed
    description: FK -> Agent.id; set by the route action (the selector's pick); null while WAITING. Reverse-reachable via GET /agents/{id}/calls.
    default: null
  - name: assigned_via
    type: enum
    source: computed
    description: PRIMARY when routed to a queue whose program_code and language_code equal the call's; OVERFLOW when routed through overflow_queue_id;
      null while WAITING
    constraints: values {PRIMARY, OVERFLOW} or null
    default: null
  - name: route_depth
    type: integer
    source: computed
    description: 1 for a PRIMARY assignment; parent route_depth + 1 for an OVERFLOW hop; rejected when the hop would exceed MAX_ROUTE_DEPTH (2)
      — a call may overflow at most once
    default: 0
  - name: answered_at
    type: datetime
    source: computed
    description: Set on the ANSWERED transition from the logical clock
    default: null
  - name: ended_at
    type: datetime
    source: computed
    description: Set on the COMPLETED transition from the logical clock
    default: null
  - name: abandoned_at
    type: datetime
    source: computed
    description: Set on the ABANDONED transition from the logical clock
    default: null
  - name: answer_seconds
    type: integer
    source: computed
    description: = answered_at - enqueued_at in whole seconds, set at the ANSWERED transition
    default: null
  - name: talk_seconds
    type: integer
    source: computed
    description: = ended_at - answered_at in whole seconds, set at the COMPLETED transition
    default: null
  - name: handled_by_agent_id
    type: string
    source: computed
    description: 'FK -> Agent.id; derivation exception: reverse lookup via GET /calls?handled_by_agent_id= on the canonical Call collection (the
      calls collection itself is canonical for Call). Copied from agent_id at the ANSWERED transition and never changed afterwards.'
    default: null
- name: QualityReview
  parent: null
  common_fields: true
  fields:
  - name: call_id
    type: string
    source: input
    description: FK -> Call.id; the call under review
  - name: accuracy_score
    type: integer
    source: input
    description: Accuracy component 0-100
  - name: compliance_score
    type: integer
    source: input
    description: Compliance component 0-100
  - name: total_score
    type: integer
    source: computed
    description: = round_half_up(accuracy_weight * accuracy_score + compliance_weight * compliance_score) to integer; accuracy_weight defaults
      to 0.5
  - name: accuracy_weight
    type: number
    source: input
    description: Weight of accuracy_score in total_score; compliance weight is (1 - accuracy_weight); must lie in (0, 1) exclusive
    default: 0.5
  - name: status
    type: enum
    source: system
    description: SUBMITTED -> ACCEPTED | DISPUTED; DISPUTED -> UPHELD | OVERTURNED
    constraints: values {SUBMITTED, ACCEPTED, DISPUTED, UPHELD, OVERTURNED}
  - name: final
    type: boolean
    source: computed
    description: True once the review is in ACCEPTED or UPHELD; only final reviews feed QA_AVG and coaching-plan triggering
    default: false
- name: CoachingPlan
  parent: null
  common_fields: true
  fields:
  - name: agent_id
    type: string
    source: input
    description: FK -> Agent.id; exactly one OPEN plan per agent at any time
  - name: trigger
    type: enum
    source: input
    description: AUTO_QUALITY when created by the cascade after a final low score; MANUAL when a supervisor opens one directly
    constraints: values {AUTO_QUALITY, MANUAL}
  - name: due_date
    type: datetime
    source: input
    description: Logical deadline for completion
  - name: status
    type: enum
    source: system
    description: OPEN -> COMPLETED | ESCALATED | CANCELLED; ESCALATED -> COMPLETED allowed after corrective action resolves; CANCELLED reachable
      from OPEN or ESCALATED
    constraints: values {OPEN, COMPLETED, ESCALATED, CANCELLED}
- name: KnowledgeArticle
  parent: null
  common_fields: true
  fields:
  - name: program_code
    type: string
    source: input
    description: Program whose eligibility rules this article documents
  - name: title
    type: string
    source: input
    description: Article title
  - name: body
    type: string
    source: input
    description: Article content
  - name: effective_at
    type: datetime
    source: input
    description: The instant the underlying program rule takes effect; the retraining cascade compares this against certification training-completion
      times
  - name: status
    type: enum
    source: system
    description: DRAFT -> PUBLISHED -> RETIRED
    constraints: values {DRAFT, PUBLISHED, RETIRED}
- name: TrainingCourse
  parent: null
  common_fields: true
  fields:
  - name: program_code
    type: string
    source: input
    description: Program the course teaches
  - name: knowledge_article_id
    type: string
    source: input
    description: FK -> KnowledgeArticle.id; optional source article. When set, completion of this course RE-VALIDATES matching invalidated certifications
      (same agent, same program_code) that were invalidated by that article — the retraining path.
    default: null
  - name: required
    type: boolean
    source: input
    description: Whether the course is mandatory for certification in the program
    default: true
- name: CourseCompletion
  parent: null
  common_fields: false
  fields:
  - name: training_course_id
    type: string
    source: input
    description: 'FK -> TrainingCourse.id; the completed course; derivation exception: reverse lookup via GET /course-completions?training_course_id='
  - name: agent_id
    type: string
    source: input
    description: FK -> Agent.id; the completing agent
  - name: completed_at
    type: datetime
    source: computed
    description: Logical-clock timestamp of completion; certifications grounded in this course compare this instant against published articles'
      effective_at
- name: SurgeWindow
  parent: null
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: input
    description: FK -> Contract.id
  - name: program_code
    type: string
    source: input
    description: Program the surge affects
  - name: surge_type
    type: enum
    source: input
    description: Driver of the surge
    constraints: values {ENROLLMENT_PERIOD, POLICY_CHANGE, PUBLIC_EVENT}
  - name: starts_on
    type: datetime
    source: input
    description: Start of the declared window
  - name: ends_on
    type: datetime
    source: input
    description: End of the declared window; must be strictly after starts_on
  - name: expected_volume_factor
    type: number
    source: input
    description: Forecast multiplier over baseline volume; must be > 1.0
  - name: status
    type: enum
    source: system
    description: DECLARED -> ACTIVE (auto when the logical clock reaches starts_on) -> EXPIRED (auto when the clock passes ends_on); CANCELLED
      terminal from DECLARED only; a declared window may not overlap any DECLARED or ACTIVE window for the same contract + program_code with adjacency
      blocked (candidate [s,e) collides when s < e2 and e > s2; auto-transitions are evaluated on clock-set and on any list/read of surge windows)
    constraints: values {DECLARED, ACTIVE, EXPIRED, CANCELLED}
- name: Incident
  parent: null
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: input
    description: FK -> Contract.id; contract whose program data was affected
  - name: severity
    type: enum
    source: input
    description: Incident severity
    constraints: values {LOW, MEDIUM, HIGH, CRITICAL}
  - name: category
    type: enum
    source: input
    description: Nature of the incident
    constraints: values {PRIVACY_BREACH, SECURITY, DATA_QUALITY}
  - name: occurred_at
    type: datetime
    source: input
    description: When the incident happened; may be earlier than the report time
  - name: reported_at
    type: datetime
    source: computed
    description: Logical-clock timestamp of the report creation; drives reporting-sla-breach computation
  - name: description
    type: string
    source: input
    description: Free-text incident description
  - name: status
    type: enum
    source: system
    description: OPEN -> CONTAINED -> RESOLVED -> CLOSED; RESOLVED -> OPEN allowed (reopen on regression)
    constraints: values {OPEN, CONTAINED, RESOLVED, CLOSED}
- name: Invoice
  parent: null
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: input
    description: FK -> Contract.id
  - name: period
    type: string
    source: input
    description: Billing month in YYYY-MM form; unique per contract. Measurement window is [period-01T00:00:00 in measurement_tz, first instant
      of next month in measurement_tz); naive local wall time, not a UTC conversion
  - name: status
    type: enum
    source: system
    description: DRAFT -> SUBMITTED -> APPROVED -> PAID; SUBMITTED -> REJECTED -> DRAFT (revision loop)
    constraints: values {DRAFT, SUBMITTED, APPROVED, PAID, REJECTED}
  - name: gross_cents
    type: integer
    source: computed
    description: = base_fee_cents + sum over ACTIVE agents holding a standing certification for any program used by the contract of rate_card_cents
      x per-cert multiplier (sum first, round_half_up once)
    default: null
  - name: withheld_cents
    type: integer
    source: computed
    description: Sum over InvoiceLines of withheld_cents
    default: 0
  - name: net_cents
    type: integer
    source: computed
    description: = gross_cents - withheld_cents
    default: null
  - name: auto_review
    type: boolean
    source: computed
    description: True when preparation recomputed any line while a completed CurePeriod existed for that line's service level (AUTO-REVIEW); forces
      the approving actor to differ from the preparing actor
    default: false
- name: InvoiceLine
  parent: null
  common_fields: true
  fields:
  - name: invoice_id
    type: string
    source: computed
    description: FK -> Invoice.id; set at creation (lines are synthesized by invoice preparation)
  - name: service_level_id
    type: string
    source: computed
    description: FK -> ServiceLevel.id; the binding service level for the line's (program_code, metric) at the period end
  - name: metric
    type: enum
    source: computed
    description: Copied from the service level
    constraints: values {ASA, ABANDON, QA_AVG}
  - name: measured_value
    type: number
    source: computed
    description: 'Measured performance for the period: ASA in seconds (round_half_up), ABANDON as fraction (4 decimal places), QA_AVG as score
      (2 decimal places); QA_AVG is null when no final review exists in the window'
  - name: staffing_actual
    type: integer
    source: computed
    description: Count of distinct ACTIVE agents with a standing certification for the line's program_code at preparation time
  - name: staffing_target
    type: integer
    source: computed
    description: = ceil(baseline_staffing x surge_multiplier) where surge_multiplier is the ACTIVE (or, when none is ACTIVE, the most recently
      EXPIRED by ends_on, tie-break latest created_at) SurgeWindow's expected_volume_factor for the program at period end, else 1.0
  - name: compliant
    type: boolean
    source: computed
    description: 'ASA/ABANDON: measured_value <= target. QA_AVG: measured_value >= target, and null measured_value counts as NON-compliant. Staffing
      shortfall (staffing_actual < staffing_target) forces non-compliance regardless of the metric.'
  - name: withheld_cents
    type: integer
    source: computed
    description: 0 when compliant; otherwise tiered withholding on gross_cents by miss magnitude with the cumulative cap applied in chronological
      period order, floored at 0 (see withholding_amount)
    default: 0
- name: CurePeriod
  parent: null
  common_fields: true
  fields:
  - name: invoice_line_id
    type: string
    source: computed
    description: FK -> InvoiceLine.id; set at creation by the breach-detection cascade
  - name: status
    type: enum
    source: system
    description: PENDING -> REMEDIED | FORFEIT
    constraints: values {PENDING, REMEDIED, FORFEIT}
  - name: opened_at
    type: datetime
    source: computed
    description: Logical-clock timestamp when the breach was detected (line preparation or recompute)
  - name: deadline
    type: datetime
    source: computed
    description: = opened_at + CURE_WINDOW_HOURS (72); auto-FORFEIT when the logical clock passes deadline with status still PENDING
  - name: remedy_fee_cents
    type: integer
    source: computed
    description: Copied from the line's ServiceLevel.remedy_fee_cents at creation
state_machines:
- entity: Contract
  initial_state: DRAFT
  terminal_states:
  - CLOSED
  transitions:
  - from: DRAFT
    to: ACTIVE
    trigger: POST /contracts/{id}/transition
    actor: OpsManager
    preconditions:
    - At least one ServiceLevel of this contract has status EFFECTIVE
    side_effects:
    - increments Contract.version by 1
  - from: ACTIVE
    to: CLOSED
    trigger: POST /contracts/{id}/transition
    actor: OpsManager
    preconditions:
    - No Queue of this contract has status OPEN
    - No Invoice of this contract is in DRAFT, SUBMITTED, or APPROVED
    - No Incident of this contract is in OPEN, CONTAINED, or RESOLVED
    side_effects:
    - increments Contract.version by 1
  - from: DRAFT
    to: CLOSED
    trigger: POST /contracts/{id}/transition
    actor: OpsManager
    preconditions: []
    side_effects:
    - increments Contract.version by 1
- entity: ServiceLevel
  initial_state: DRAFT
  terminal_states:
  - ARCHIVED
  transitions:
  - from: DRAFT
    to: EFFECTIVE
    trigger: POST /service-levels/{id}/transition
    actor: OpsManager
    preconditions:
    - Parent Contract.status == ACTIVE
    - effective_from <= logical clock now
    side_effects:
    - Every other ServiceLevel with same (contract_id, program_code, metric) in EFFECTIVE whose effective_from < this.effective_from -> SUPERSEDED
    - Activation with effective_from equal to an already-EFFECTIVE sibling -> ERR_SL_CONFLICT
  - from: EFFECTIVE
    to: SUPERSEDED
    trigger: system cascade from a later activation (same contract_id, program_code, metric, strictly later effective_from)
    actor: system
    preconditions: []
    side_effects: []
  - from: EFFECTIVE
    to: ARCHIVED
    trigger: POST /service-levels/{id}/transition
    actor: OpsManager
    preconditions:
    - No InvoiceLine references this ServiceLevel on an Invoice in DRAFT or SUBMITTED
    side_effects: []
  - from: SUPERSEDED
    to: ARCHIVED
    trigger: POST /service-levels/{id}/transition
    actor: OpsManager
    preconditions: []
    side_effects: []
- entity: Agent
  initial_state: ACTIVE
  terminal_states: []
  transitions:
  - from: ACTIVE
    to: INACTIVE
    trigger: POST /agents/{id}/transition
    actor: OpsManager
    preconditions:
    - Agent is not agent_id of any Call in ASSIGNED or ANSWERED
    side_effects:
    - Agent excluded from all future routing pools and staffing_actual counts
    - increments Agent.version by 1
  - from: INACTIVE
    to: ACTIVE
    trigger: POST /agents/{id}/transition
    actor: OpsManager
    preconditions:
    - Agent holds at least one certification that is standing (valid_until > now AND invalidated_at is null)
    side_effects:
    - increments Agent.version by 1
- entity: Queue
  initial_state: OPEN
  terminal_states:
  - CLOSED
  transitions:
  - from: OPEN
    to: PAUSED
    trigger: POST /queues/{id}/transition
    actor: OpsManager
    preconditions: []
    side_effects:
    - Queue removed from routing eligibility
  - from: PAUSED
    to: OPEN
    trigger: POST /queues/{id}/transition
    actor: OpsManager
    preconditions: []
    side_effects: []
  - from: OPEN
    to: CLOSED
    trigger: POST /queues/{id}/transition
    actor: OpsManager
    preconditions:
    - No Call with queue_id == this queue is in WAITING, ASSIGNED, or ANSWERED
    side_effects: []
  - from: PAUSED
    to: CLOSED
    trigger: POST /queues/{id}/transition
    actor: OpsManager
    preconditions:
    - No Call with queue_id == this queue is in WAITING, ASSIGNED, or ANSWERED
    side_effects: []
- entity: Call
  initial_state: WAITING
  terminal_states:
  - COMPLETED
  - ABANDONED
  transitions:
  - from: WAITING
    to: ASSIGNED
    trigger: POST /calls/{id}/transition
    actor: Supervisor
    preconditions:
    - Contract.status == ACTIVE
    - An eligible queue exists (see queue_selector) and a certified agent is available on it (see agent_selector)
    side_effects:
    - Sets queue_id, agent_id, assigned_via, route_depth; increments Call.version by 1
  - from: ASSIGNED
    to: ANSWERED
    trigger: POST /calls/{id}/transition
    actor: Agent
    preconditions:
    - Acting X-User-ID == Call.agent_id
    side_effects:
    - answered_at = logical clock now; answer_seconds = answered_at - enqueued_at
    - handled_by_agent_id = agent_id (frozen)
  - from: ANSWERED
    to: COMPLETED
    trigger: POST /calls/{id}/transition
    actor: Agent
    preconditions:
    - Acting X-User-ID == Call.agent_id
    side_effects:
    - ended_at = logical clock now; talk_seconds = ended_at - answered_at
  - from: WAITING
    to: ABANDONED
    trigger: POST /calls/{id}/transition
    actor: Supervisor
    preconditions: []
    side_effects:
    - abandoned_at = logical clock now
  - from: ASSIGNED
    to: ABANDONED
    trigger: POST /calls/{id}/transition
    actor: Supervisor
    preconditions: []
    side_effects:
    - abandoned_at = logical clock now
- entity: QualityReview
  initial_state: SUBMITTED
  terminal_states:
  - ACCEPTED
  - UPHELD
  - OVERTURNED
  transitions:
  - from: SUBMITTED
    to: ACCEPTED
    trigger: POST /quality-reviews/{id}/transition
    actor: QualityAnalyst
    preconditions: []
    side_effects:
    - final = true
    - 'AUTO-COACHING cascade: if total_score < AUTO_COACH_THRESHOLD (70), handled_by_agent_id agent has no OPEN or ESCALATED CoachingPlan, and
      no AUTO_QUALITY CoachingPlan exists for that agent with created_at in [now - 7 days, now]: create CoachingPlan(agent_id=handled_by_agent_id,
      trigger=AUTO_QUALITY, due_date=now + 14 days, status=OPEN); the new plan''s creation increments nothing on the review'
  - from: SUBMITTED
    to: DISPUTED
    trigger: POST /quality-reviews/{id}/transition
    actor: Agent
    preconditions:
    - Acting X-User-ID == the reviewed Call.handled_by_agent_id
    side_effects: []
  - from: DISPUTED
    to: UPHELD
    trigger: POST /quality-reviews/{id}/transition with outcome=UPHELD
    actor: QualityAnalyst
    preconditions: []
    side_effects:
    - final = true
    - AUTO-COACHING cascade identical to the ACCEPTED transition
  - from: DISPUTED
    to: OVERTURNED
    trigger: POST /quality-reviews/{id}/transition with outcome=OVERTURNED
    actor: QualityAnalyst
    preconditions: []
    side_effects:
    - review excluded from QA_AVG and coaching triggers (final stays false)
- entity: CoachingPlan
  initial_state: OPEN
  terminal_states:
  - COMPLETED
  - CANCELLED
  transitions:
  - from: OPEN
    to: COMPLETED
    trigger: POST /coaching-plans/{id}/transition
    actor: Supervisor
    preconditions: []
    side_effects: []
  - from: OPEN
    to: ESCALATED
    trigger: POST /coaching-plans/{id}/transition
    actor: Supervisor
    preconditions: []
    side_effects: []
  - from: ESCALATED
    to: COMPLETED
    trigger: POST /coaching-plans/{id}/transition
    actor: Supervisor
    preconditions: []
    side_effects: []
  - from: OPEN
    to: CANCELLED
    trigger: POST /coaching-plans/{id}/transition
    actor: Supervisor
    preconditions: []
    side_effects: []
  - from: ESCALATED
    to: CANCELLED
    trigger: POST /coaching-plans/{id}/transition
    actor: Supervisor
    preconditions: []
    side_effects: []
- entity: KnowledgeArticle
  initial_state: DRAFT
  terminal_states:
  - RETIRED
  transitions:
  - from: DRAFT
    to: PUBLISHED
    trigger: POST /knowledge-articles/{id}/transition
    actor: KnowledgeManager
    preconditions: []
    side_effects:
    - 'RETRAINING cascade: every Certification with program_code == article.program_code whose training course''s completion (completed_at of
      the grounding CourseCompletion) is strictly before article.effective_at gets invalidated_at = now and invalidated_by_article_id = article.id;
      Agents holding no remaining standing certification for that program_code are NOT deactivated but become unroutable for it'
  - from: PUBLISHED
    to: RETIRED
    trigger: POST /knowledge-articles/{id}/transition
    actor: KnowledgeManager
    preconditions: []
    side_effects:
    - 'No revalidation: retirement never resurrects invalidated certifications'
- entity: SurgeWindow
  initial_state: DECLARED
  terminal_states:
  - EXPIRED
  - CANCELLED
  transitions:
  - from: DECLARED
    to: ACTIVE
    trigger: system auto-transition when logical clock >= starts_on (evaluated on every clock-set and on every read of the window)
    actor: system
    preconditions: []
    side_effects: []
  - from: ACTIVE
    to: EXPIRED
    trigger: system auto-transition when logical clock > ends_on
    actor: system
    preconditions: []
    side_effects: []
  - from: DECLARED
    to: CANCELLED
    trigger: POST /surge-windows/{id}/transition
    actor: OpsManager
    preconditions:
    - logical clock now < starts_on (cannot cancel a window that already activated)
    side_effects: []
- entity: Incident
  initial_state: OPEN
  terminal_states:
  - CLOSED
  transitions:
  - from: OPEN
    to: CONTAINED
    trigger: POST /incidents/{id}/transition
    actor: SecurityOfficer
    preconditions: []
    side_effects: []
  - from: CONTAINED
    to: RESOLVED
    trigger: POST /incidents/{id}/transition
    actor: SecurityOfficer
    preconditions: []
    side_effects: []
  - from: RESOLVED
    to: CLOSED
    trigger: POST /incidents/{id}/transition
    actor: SecurityOfficer
    preconditions: []
    side_effects: []
  - from: RESOLVED
    to: OPEN
    trigger: POST /incidents/{id}/transition
    actor: SecurityOfficer
    preconditions: []
    side_effects:
    - Reporting-sla timestamps are NOT reset; reported_at is immutable
- entity: Invoice
  initial_state: DRAFT
  terminal_states:
  - PAID
  transitions:
  - from: DRAFT
    to: SUBMITTED
    trigger: POST /invoices/{id}/transition
    actor: BillingAnalyst
    preconditions:
    - At least one InvoiceLine exists for this invoice
    side_effects: []
  - from: SUBMITTED
    to: APPROVED
    trigger: POST /invoices/{id}/transition
    actor: OpsManager
    preconditions:
    - If Invoice.auto_review is true, the acting X-User-ID must differ from the BillingAnalyst user id recorded as preparer on the invoice
    side_effects: []
  - from: APPROVED
    to: PAID
    trigger: POST /invoices/{id}/transition
    actor: OpsManager
    preconditions: []
    side_effects: []
  - from: SUBMITTED
    to: REJECTED
    trigger: POST /invoices/{id}/transition
    actor: OpsManager
    preconditions: []
    side_effects: []
  - from: REJECTED
    to: DRAFT
    trigger: POST /invoices/{id}/transition
    actor: BillingAnalyst
    preconditions: []
    side_effects:
    - Lines are NOT discarded; the next /recompute refreshes them against current measurements and caps
concurrency_rules:
- rule_id: service-level-activate-stale-contract
  parent_entity: Contract
  write_endpoint: POST /service-levels/{id}/transition
  occ_field: expected_contract_version
  description: 'Activating a ServiceLevel against a Contract whose version has advanced

    since the client last observed it is rejected. This captures the case

    where another writer has just changed contract-level terms (activation,

    cap mode, or closure) and the activating client''s view of the contract is

    therefore stale.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: invoice-approve-stale-contract
  parent_entity: Contract
  write_endpoint: POST /invoices/{id}/transition
  occ_field: expected_contract_version
  description: 'Approving an Invoice while carrying a stale observed Contract version is

    rejected: approval releases funds against contract terms (cap mode,

    active service levels) that may have changed since the client read them.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
calculations:
- name: measured_asa
  trigger: invoice preparation and recompute, per InvoiceLine with metric ASA
  algorithm: chronological
  formula: 'Input set: calls of the line''s (contract via invoice, program_code)

    whose status is ANSWERED or COMPLETED AND enqueued_at inside the

    invoice period window [period-01T00:00:00 in contract.measurement_tz,

    first instant of next month) — naive local wall time.

    Process in enqueued_at order (tie-break: created_at ASC), take

    answer_seconds of each, arithmetic mean, round_half_up to whole seconds.

    ABANDONED calls never enter the set. Overflow-routed calls count toward

    the call''s program_code, not toward the overflow queue''s program.

    Empty input set -> measured_value is 0 (a month with no answered calls

    is compliant for ASA).

    '
  constants:
    ROUNDING: round_half_up
  precision: whole seconds, round_half_up
  variants:
  - name: provisional
    when: first /prepare of the invoice
    difference: input set taken at preparation instant; stored on the line
  - name: official
    when: every /recompute while the invoice is not PAID
    difference: input set re-taken at recompute instant; late-arriving completions shift the mean; the new value overwrites measured_value
- name: measured_qa_avg
  trigger: invoice preparation and recompute, per InvoiceLine with metric QA_AVG
  algorithm: aggregation
  formula: 'Input set: QualityReviews with final == true (status ACCEPTED or

    UPHELD) whose Call belongs to the line''s (contract, program_code) and

    whose Call.enqueued_at is inside the invoice period window.

    Arithmetic mean of total_score, round_half_up to 2 decimal places.

    Empty input set -> measured_value is null, which counts as

    NON-compliant for QA_AVG.

    '
  constants:
    ROUNDING: round_half_up
  precision: 2 decimal places, round_half_up
  variants:
  - name: provisional
    when: first /prepare of the invoice
    difference: only reviews final at preparation instant count
  - name: official
    when: every /recompute while the invoice is not PAID
    difference: reviews that became final since preparation (dispute resolved UPHELD, late ACCEPTED) enter the set and shift the average
- name: measured_abandon_rate
  trigger: invoice preparation and recompute, per InvoiceLine with metric ABANDON
  algorithm: aggregation
  formula: 'Input set: all calls of the line''s (contract, program_code) with

    enqueued_at inside the invoice period window and status in

    {ANSWERED, COMPLETED, ABANDONED} (WAITING and ASSIGNED calls are

    excluded — they have not resolved).

    rate = count(ABANDONED) / count(input set), 4 decimal places,

    round_half_up. Empty input set -> 0.0000.

    '
  constants:
    ROUNDING: round_half_up
  precision: 4 decimal places, round_half_up
  variants: []
- name: gross_fee
  trigger: invoice preparation and recompute (before withholding)
  algorithm: combinatorial
  formula: "P = set of distinct program_code values for which the contract has a\nServiceLevel that reached EFFECTIVE at any time on or before\
    \ the\nperiod end (includes later SUPERSEDED or ARCHIVED ones).\nFor each p in P:\n  A(p) = agents with employment_status ACTIVE holding at\
    \ least one\n         standing certification (valid_until > period end AND\n         invalidated_at is null) with program_code == p\n  c(p)\
    \ = count over A(p) of that agent's standing certifications for p\n  rate_card_cents(p) = RATE_CARD_CENTS (fixed per-agent monthly rate)\n\
    \  surge_mult(p) = expected_volume_factor of the ACTIVE SurgeWindow for\n         (contract, p) at period end; if none is ACTIVE, the most\n\
    \         recently EXPIRED by ends_on (tie-break latest created_at);\n         if none at all, 1.0\n  mult(p) = max(1.0, surge_mult(p))\n\
    gross_cents = BASE_FEE_CENTS + round_half_up(\n    sum over p of rate_card_cents(p) * c(p) * mult(p) )\nEvaluation order is pinned: per-program\
    \ subtotals are computed at full\nprecision, summed, and rounded ONCE — never rounded per program.\n"
  constants:
    BASE_FEE_CENTS: 50000
    RATE_CARD_CENTS: 4000
    ROUNDING: round_half_up
  precision: integer cents; sum first, round once, round_half_up
- name: staffing_target
  trigger: invoice preparation and recompute, per InvoiceLine
  algorithm: threshold
  formula: 'staffing_target(p) = ceil(BASELINE_STAFFING * surge_mult(p))

    where surge_mult(p) is the same selector as in gross_fee (ACTIVE

    window at period end, else most recently EXPIRED by ends_on with

    created_at tie-break, else 1.0). Surge multiplier affects the TARGET

    only, never staffing_actual.

    '
  constants:
    BASELINE_STAFFING: 10
  precision: integer, ceil
  variants: []
- name: withholding_amount
  trigger: invoice preparation and recompute, per non-compliant InvoiceLine
  algorithm: tiered_pricing
  formula: "Per line, by miss magnitude against the line's ServiceLevel.target:\n  ASA:      miss = measured_value - target (seconds)\n  ABANDON:\
    \  miss = measured_value - target (fraction, 4dp)\n  QA_AVG:   miss = target - measured_value; null measured_value -> miss = target\nmiss_ratio\
    \ = miss / target\ntier(miss_ratio): < 0.05 -> 0.10; [0.05, 0.15) -> 0.25; >= 0.15 -> 0.40\nraw_withheld = round_half_up(gross_cents * tier)\n\
    Per-line absolute cap: raw_withheld = min(raw_withheld,\n    round_half_up(cap_pct_of_gross * gross_cents))\nCumulative cap (only when contract.cap_absolutes\
    \ == false): the sum of\nwithheld_cents across all invoices of the contract may not exceed the\nsum of gross_cents of those invoices; invoices\
    \ are processed in\nchronological period order (YYYY-MM string order), and this line's\nwithholding is floored at max(0, cumulative_gross_through_this_period\
    \ -\nwithheld_cents_cum_before_this_invoice) — applied AFTER the per-line\ncap.\nA compliant line always withholds 0.\n"
  constants:
    TIER1_BOUND: 0.05
    TIER2_BOUND: 0.15
    TIER1_RATE: 0.1
    TIER2_RATE: 0.25
    TIER3_RATE: 0.4
    ROUNDING: round_half_up
  precision: integer cents, round_half_up; tier boundary comparisons are strict-less-than for tier 1 and inclusive for tier 3
- name: quality_total_score
  trigger: QualityReview creation
  algorithm: combinatorial
  formula: "total_score = round_half_up(accuracy_weight * accuracy_score +\n    (1 - accuracy_weight) * compliance_score) to integer in [0, 100].\n\
    The weight application is single-rounding: compute the weighted sum at\nfull precision, round once. (Rounding each weighted component first\
    \ and\nthen summing is a rejected alternative — it can differ by a point at\n.5 boundaries, and .5 rounds half up, never to even.)\n"
  constants:
    ROUNDING: round_half_up
  precision: integer 0-100, round_half_up, single rounding
- name: queue_selector
  trigger: POST /calls/{id}/transition
  algorithm: selector
  formula: "Candidate queues for a call (contract C, program P, language L,\nspecialty S):\n  queue_type GENERAL and S is null, or queue_type\
    \ SPECIALTY and\n  specialty_tag == S; queue.program_code == P; queue.contract_id == C;\n  queue.status == OPEN.\nEligibility filter A (language):\
    \ queue.language_code == L.\nRanking: earliest created_at ASC among eligible queues that have at\nleast one available certified agent (see\
    \ agent_selector).\nOverflow fallback (only when set A is empty): for each candidate\nignoring the language filter but still requiring status\
    \ OPEN, walk its\noverflow_queue_id chain at most one hop; the overflow target must\nitself have an available certified agent for P; overflow\
    \ targets are\nranked by the PARENT queue's created_at ASC. A hop is forbidden when\ncall.route_depth would reach MAX_ROUTE_DEPTH + 1 (call\
    \ overflows at\nmost once) and forbidden when the target queue is PAUSED or CLOSED.\nEmpty after fallback -> ERR_NO_ELIGIBLE_QUEUE.\n"
  constants:
    MAX_ROUTE_DEPTH: 2
  precision: deterministic selector; tie-break created_at ASC; id never used
- name: agent_selector
  trigger: inside queue_selector, per candidate queue; selects Call.agent_id
  algorithm: selector
  formula: "Candidate agents for queue q and call (program P, language L):\n  employment_status == ACTIVE; L in agent.languages; agent holds a\n\
    \  standing certification for P (valid_until > now AND invalidated_at\n  is null); agent is not agent_id of any Call in ASSIGNED or ANSWERED.\n\
    Ranking: fewest Calls COMPLETED by this agent for program P today\n(logical date in contract.measurement_tz); tie-break agent.created_at\n\
    ASC.\nEmpty set -> the queue is treated as having no available agent and the\nqueue selector moves on.\n"
  precision: deterministic selector; tie-break created_at ASC; id never used
- name: reporting_sla_breach
  trigger: Incident creation
  algorithm: threshold
  formula: 'For severity CRITICAL: if reported_at - occurred_at > 24h, the

    creation succeeds but the incident is stamped sla_breached = true

    (derived on read; never blocks creation).

    Reporting hours = (reported_at - occurred_at) in whole seconds / 3600,

    compared strictly greater than 24.

    '
  constants:
    CRITICAL_REPORT_SLA_HOURS: 24
  precision: whole seconds; strict >
validations:
- priority: 1
  category: auth
  check: X-User-Role and X-User-ID headers present and role is a declared role
  error_id: ERR_UNAUTHENTICATED
  http_status: 401
  applies_to: all endpoints except POST /_clock/set_current_utc (which still requires PlatformAdmin)
- priority: 2
  category: auth
  check: Role permitted for this endpoint per §1.5 roles
  error_id: ERR_FORBIDDEN
  http_status: 403
  applies_to: all
- priority: 3
  category: existence
  check: Path ids exist, validated left-to-right; body foreign keys checked in the endpoint's declared input order, each with its entity-specific
    404
  error_id: ERR_CONTRACT_NOT_FOUND | ERR_SERVICE_LEVEL_NOT_FOUND | ERR_AGENT_NOT_FOUND | ERR_QUEUE_NOT_FOUND | ERR_CALL_NOT_FOUND | ERR_REVIEW_NOT_FOUND
    | ERR_COACHING_PLAN_NOT_FOUND | ERR_ARTICLE_NOT_FOUND | ERR_TRAINING_COURSE_NOT_FOUND | ERR_SURGE_WINDOW_NOT_FOUND | ERR_INCIDENT_NOT_FOUND
    | ERR_INVOICE_NOT_FOUND | ERR_INVOICE_LINE_NOT_FOUND | ERR_CERTIFICATION_NOT_FOUND
  http_status: 404
  applies_to: all endpoints with path or body ids
- priority: 4
  category: existence
  check: Required request fields present, well-typed, enum values within declared sets, referential fields well-formed
  error_id: ERR_INVALID_REQUEST
  http_status: 400
  applies_to: all mutating endpoints
- priority: 5
  category: state
  check: 'OCC: expected_contract_version equals Contract.version on the two concurrency-guarded endpoints'
  error_id: ERR_STALE_VERSION
  http_status: 412
  applies_to: POST /service-levels/{id}/transition, POST /invoices/{id}/transition
- priority: 6
  category: state
  check: Target resource in a state from which the requested transition exists (covers invalid-from, terminal lockdown, idempotent re-fire)
  error_id: ERR_INVALID_STATE
  http_status: 409
  applies_to: all action endpoints
- priority: 7
  category: business_safety
  check: 'Privacy/security gates: no endpoint returns a Call or Incident row whose contract differs from the caller-visible scope; agents may
    only act on calls assigned to themselves; reviewers may only dispute reviews of their own calls'
  error_id: ERR_FORBIDDEN
  http_status: 403
  applies_to: GET /calls/{id}, POST /calls/{id}/transition, POST /calls/{id}/transition, POST /quality-reviews/{id}/transition
- priority: 8
  category: business_safety
  check: 'Segregation of duties: on an invoice with auto_review true, the approving X-User-ID must differ from the preparer''s'
  error_id: ERR_AUTO_REVIEW_REQUIRES_SECOND_APPROVER
  http_status: 409
  applies_to: POST /invoices/{id}/transition
- priority: 9
  category: business_constraint
  check: 'Domain constraint rules: ERR_SL_CONFLICT (duplicate EFFECTIVE key or equal effective_from), ERR_QUEUE_OVERFLOW_MISMATCH (overflow target
    violates same-contract/language/specialty), ERR_OVERFLOW_LOCKED (clearing overflow after assignments), ERR_QUEUE_NOT_EMPTY (close with live
    calls), ERR_CALL_OVERFLOW_FORBIDDEN (route_depth would exceed MAX_ROUTE_DEPTH), ERR_DUPLICATE_PLAN (second OPEN plan for an agent), ERR_INVOICE_PERIOD_DUPLICATE
    (period reuse per contract), ERR_SURGE_OVERLAP (adjacency-inclusive window overlap)'
  error_id: ERR_SL_CONFLICT | ERR_QUEUE_OVERFLOW_MISMATCH | ERR_OVERFLOW_LOCKED | ERR_QUEUE_NOT_EMPTY | ERR_CALL_OVERFLOW_FORBIDDEN | ERR_NO_ELIGIBLE_QUEUE
    | ERR_DUPLICATE_PLAN | ERR_INVOICE_PERIOD_DUPLICATE | ERR_SURGE_OVERLAP
  http_status: 409
  applies_to: per-error endpoints as named in §1.6
- priority: 10
  category: business_temporal
  check: 'Temporal rules: surge window ends_on > starts_on; certification valid_until in the future at creation; cure payment within window; cancel
    surge only before activation'
  error_id: ERR_INVALID_REQUEST | ERR_CURE_WINDOW_CLOSED | ERR_INVALID_STATE
  http_status: 400 | 409
  applies_to: POST /surge-windows, POST /training-courses/{id}/complete, POST /cure-periods/{id}/pay-remedy, POST /surge-windows/{id}/transition
- priority: 11
  category: business_fiscal
  check: 'Fiscal gates: invoice close precondition on Contract.close; service-level archive precondition; agent deactivation with live calls'
  error_id: ERR_INVALID_STATE | ERR_AGENT_HAS_LIVE_CALLS
  http_status: 409
  applies_to: POST /contracts/{id}/transition, POST /service-levels/{id}/transition, POST /agents/{id}/transition
endpoints:
- method: POST
  path: /_clock/set_current_utc
  description: 'Test-driving endpoint: sets the logical clock. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and never
    falls back to wall-clock time. Fires time-based auto-transitions (SurgeWindow DECLARED->ACTIVE / ACTIVE->EXPIRED, CurePeriod PENDING->FORFEIT
    past deadline).'
  roles:
  - PlatformAdmin
  code: 200
  input:
  - to_iso8601
  output:
    current_utc: string
  side_effects:
  - SurgeWindow auto-transitions; CurePeriod auto-FORFEIT with Contract.cure_periods_used increment
- method: POST
  path: /contracts
  description: Create a contract in DRAFT
  roles:
  - PlatformAdmin
  code: 201
  input:
  - agency_name
  - measurement_tz
  - cap_absolutes
  output: Contract
  side_effects:
  - status=DRAFT, withheld_cents_cum=0, cure_periods_used=0
- method: GET
  path: /contracts
  description: List contracts with pagination
  roles:
  - PlatformAdmin
  - OpsManager
  - BillingAnalyst
  - QualityAnalyst
  - Supervisor
  - KnowledgeManager
  - SecurityOfficer
  - Agent
  code: 200
  input:
  - status?
  - limit?
  - offset?
  output: Contract[]
  side_effects: []
- method: POST
  path: /service-levels
  description: Create a service level in DRAFT
  roles:
  - OpsManager
  code: 201
  input:
  - contract_id
  - program_code
  - metric
  - target
  - cap_pct_of_gross
  - remedy_fee_cents
  - effective_from
  output: ServiceLevel
  side_effects:
  - status=DRAFT
- method: GET
  path: /service-levels
  description: List service levels, filterable by contract/program/metric/status
  roles:
  - PlatformAdmin
  - OpsManager
  - BillingAnalyst
  code: 200
  input:
  - contract_id?
  - program_code?
  - metric?
  - status?
  - limit?
  - offset?
  output: ServiceLevel[]
  side_effects: []
- method: POST
  path: /agents
  description: Register an agent (employment_status ACTIVE)
  roles:
  - OpsManager
  code: 201
  input:
  - full_name
  - languages
  output: Agent
  side_effects: []
- method: GET
  path: /agents
  description: List agents
  roles:
  - PlatformAdmin
  - OpsManager
  - Supervisor
  - QualityAnalyst
  code: 200
  input:
  - employment_status?
  - limit?
  - offset?
  output: Agent[]
  side_effects: []
- method: POST
  path: /training-courses
  description: Create a training course for a program
  roles:
  - KnowledgeManager
  code: 201
  input:
  - program_code
  - knowledge_article_id?
  - required?
  output: TrainingCourse
  side_effects: []
- method: POST
  path: /training-courses/{id}/complete
  description: Record an agent's completion; mints a Certification; re-validates certifications invalidated by the linked article
  roles:
  - KnowledgeManager
  code: 200
  input:
  - agent_id
  - valid_until
  output: CourseCompletion
  side_effects:
  - create Certification(agent_id, program_code of course, training_course_id, valid_until)
  - 'if course.knowledge_article_id is set: every Certification of this agent for this program with invalidated_by_article_id == that article
    is re-validated (invalidated_at=null, invalidated_by_article_id=null)'
- method: GET
  path: /certifications
  description: List certifications filtered by agent and program (reverse reachability for Agent/TrainingCourse/KnowledgeArticle FKs)
  roles:
  - PlatformAdmin
  - OpsManager
  - KnowledgeManager
  - Supervisor
  code: 200
  input:
  - agent_id?
  - program_code?
  - training_course_id?
  - invalidated_by_article_id?
  - limit?
