      - name: venue_posture_restricted_when_required_certified_count_unmet
        claim_type: correct_result
        grounds:
          - calculations.venue_data_posture
          - entities.Venue.fields.required_certified_installations
          - entities.Venue.fields.data_posture
        distinguishing_aspect: |
          The aggregation's middle branch: certified_count 1 is non-zero (so not UNCERTIFIED) but below
          required_certified_installations 2, so the posture is RESTRICTED. The census invariant
          certified + recalibrating + uncertified == active_installation_count must hold at 1 + 0 + 0 == 1.
          Falsified if a single certified rig is enough to reach CERTIFIED.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T12:00:00Z"
            - "Harbor Arena with required_certified_installations 2 and one rig at PASS -> VALIDATED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 2, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { v_id: $.data.id }
            - call: "POST /installations"
              payload: { venue_id: "${v_id}", rig_label: "RIG-A", modality: "UWB_ANCHOR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { i_id: $.data.id }
            - call: "POST /installations/${i_id}/calibration-runs"
              payload: { axis_rms_x_mm: 90.0, axis_rms_y_mm: 90.0, axis_rms_z_mm: 90.0, sample_count: 6000, reference_point_count: 16 }
              as: CalibrationEngineer
              as_user_id: "eng-01"
          trigger:
            - call: "POST /installations/${i_id}/certify"
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "GET /venues/${v_id}"
              as: LeagueDataOps
              as_user_id: "ops-01"
          assert:
            - "certify: HTTP 200 with data.status == \"CERTIFIED\", data.certified_by_user_id == \"ops-01\", data.certified_at_utc == \"2026-08-01T12:00:00Z\""
            - "GET /venues: data.data_posture == \"RESTRICTED\""
            - "GET /venues: data.certified_installation_count == 1, data.recalibrating_installation_count == 0, data.uncertified_installation_count == 0, data.active_installation_count == 1, data.retired_installation_count == 0"

      - name: normalization_canonical_season_rounds_once_on_generation_g2
        claim_type: precision
        grounds:
          - calculations.normalized_tracking_metric
          - entities.NormalizationRun.fields.normalized_value
          - entities.NormalizationRun.fields.mapping_version
        distinguishing_aspect: |
          Sum-then-round with the G2 drift correction: 260.391 * 1.017 * (1 - 0.002) = 264.288011... which
          must round to exactly 264.29 with a single terminal round_half_up, and the run must stamp
          scale_factor_applied 1.017, drift_correction_pct -0.2 and mapping_version "MAP-2026.1".
          Falsified by any per-segment rounding, which would land on a different cent-level value.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T12:00:00Z; Harbor Arena CERTIFIED"
            - "a G2 game taken LIVE and then COLLECTED (no tags needed)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
