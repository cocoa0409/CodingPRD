              as: ProjectManager
              captures: { job7_id: "$.data.id" }
            - call: "POST /panel-shop/jobs/${job7_id}/change-orders"
              payload: { description: "add surge protection", price_delta_cents: 200000, discount_pct: 0.02 }
              as: ProjectManager
              captures: { co_c: "$.data.id", co_c_v0: "$.data.version" }
          trigger:
            - call: "POST /panel-shop/change-orders/${co_c}/revise"
              payload: { price_delta_cents: 180000, discount_pct: 0.0 }
              as: Customer
              as_user_id: "${cust7_id}"
            - call: "POST /panel-shop/change-orders/${co_c}/repropose"
              payload: {}
              as: ProjectManager
            - call: "POST /panel-shop/change-orders/${co_c}/revise"
              payload: { price_delta_cents: 150000, discount_pct: 0.0 }
              as: Customer
              as_user_id: "${cust7_id}"
            - call: "GET /panel-shop/jobs/${job7_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust7_id}"
              captures: { job7_ver: "$.data.version" }
            - call: "POST /panel-shop/change-orders/${co_c}/approve"
              payload: { expected_job_version: "${job7_ver}" }
              as: Customer
              as_user_id: "${cust7_id}"
          assert:
            - "ChangeOrder.${co_c}.status == APPROVED after two REVISED cycles"
            - "ChangeOrder.${co_c}.computed_delta_cents == 142500 (150000 * (1 - 0.05 T1 floor))"
            - "Job.${job7_id}.approved_co_delta_cents == 142500"
            - "Job.${job7_id}.contract_price_cents == 1142500"

