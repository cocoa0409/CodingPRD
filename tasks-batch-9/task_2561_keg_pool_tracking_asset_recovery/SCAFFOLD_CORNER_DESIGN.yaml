            - call: "POST /kegs/${k1_id}/scan"
              payload: { scan_point: "DISTRIBUTION", party_type: "DISTRIBUTOR", scanned_at: "2026-08-05T00:00:00Z", brand_code_scanned: "RDG", distributor_id: "${d1_id}" }
