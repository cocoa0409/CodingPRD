# =============================================================================
# Task 1028 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids × 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: appraisal_fair_market_vs_retail_replacement
        grounds:
          - calculations.appraised_value
          - entities.Appraisal.fields.fair_market_value_cents
          - entities.Appraisal.fields.retail_replacement_value_cents
        distinguishing_aspect: "Valuation domain (Appraisal on a BookItem): FAIR_MARKET and RETAIL_REPLACEMENT use identical inputs but diverge by the RETAIL_MARKUP=1.6 factor (21000 vs 33600)."
        test_recipe:
          setup:
            - "A BookItem graded FINE (condition_mult 1.4), stated first edition & printing 1 (is_first_edition true, premium 0.5), comp_median_cents 10000."
          setup_api_calls:
            - call: "POST /patrons"
              payload: { display_name: "Ada Dealer", email: "ada.dv1@x.com" }
              as: Manager
              captures: { p_id: $.data.id }
            - call: "POST /intake-lots"
              payload: { acquisition_channel: "CONSIGNMENT", consignor_id: "${p_id}" }
              as: StoreClerk
              captures: { lot_id: $.data.id }
            - call: "POST /intake-lots/${lot_id}/book-items"
              payload: { title: "Ulysses", author: "James Joyce", comp_median_cents: 10000, printing_number: 1, stated_first_edition: true }
              as: StoreClerk
              captures: { b_id: $.data.id }
            - call: "POST /book-items/${b_id}/grade"
              payload: { condition_grade: "FINE" }
              as: Appraiser
              captures: { b_v: $.data.version }
          trigger:
            - call: "POST /book-items/${b_id}/appraisals"
              payload: { basis: "FAIR_MARKET", expected_book_item_version: "${b_v}" }
              as: Appraiser
              captures: { appr_id: $.data.id }
          assert:
            - "Appraisal.${appr_id}.fair_market_value_cents == 21000"
            - "Appraisal.${appr_id}.retail_replacement_value_cents == 33600"
            - "Appraisal.${appr_id}.final_value_cents == 21000"
            - "BookItem.${b_id}.appraised_value_cents == 21000"

      - name: consignment_payout_gross_vs_net_commission
        grounds:
          - calculations.consignment_payout
          - entities.Patron.fields.consignor_payable_cents
          - state_machines.ConsignmentAgreement.ACTIVE_to_SETTLED
        distinguishing_aspect: "Payout domain (ConsignmentAgreement -> Patron ledger), a different entity domain than valuation: GROSS_COMMISSION pays round(30000*0.70)=21000 whereas NET_COMMISSION with flat_fee 2000 would pay 19600."
        test_recipe:
          setup:
            - "A consigned BookItem LISTED and shelved (shop_status ON_SHELF), with an ACTIVE GROSS_COMMISSION agreement at commission_pct 0.30; a DRAFT SHOP SaleOrder selling it at 30000."
          setup_api_calls:
            - call: "POST /patrons"
              payload: { display_name: "Ada Dealer", email: "ada.dv2@x.com" }
              as: Manager
              captures: { p_id: $.data.id }
            - call: "POST /intake-lots"
              payload: { acquisition_channel: "CONSIGNMENT", consignor_id: "${p_id}" }
              as: StoreClerk
              captures: { lot_id: $.data.id }
            - call: "POST /intake-lots/${lot_id}/book-items"
              payload: { title: "Dubliners", author: "James Joyce", comp_median_cents: 20000, printing_number: 1, stated_first_edition: true }
              as: StoreClerk
              captures: { b_id: $.data.id }
            - call: "POST /book-items/${b_id}/grade"
              payload: { condition_grade: "VERY_GOOD" }
              as: Appraiser
              captures: { b_v: $.data.version }
            - call: "POST /book-items/${b_id}/appraisals"
              payload: { basis: "FAIR_MARKET", expected_book_item_version: "${b_v}" }
              as: Appraiser
            - call: "POST /book-items/${b_id}/listing"
              payload: { list_price_cents: 30000 }
              as: StoreClerk
              captures: { cl_id: $.data.id, cl_v: $.data.version }
            - call: "PATCH /catalog-listings/${cl_id}"
              payload: { shop_status: "ON_SHELF", expected_catalog_listing_version: "${cl_v}" }
              as: StoreClerk
            - call: "POST /consignment-agreements"
              payload: { patron_id: "${p_id}", book_item_id: "${b_id}", commission_pct: 0.30, fee_model: "GROSS_COMMISSION" }
              as: Manager
              captures: { ag_id: $.data.id }
            - call: "POST /consignment-agreements/${ag_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /sale-orders"
              payload: { channel: "SHOP", line_items: [ { book_item_id: "${b_id}", sale_price_cents: 30000, discount_pct: 0 } ] }
              as: StoreClerk
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /sale-orders/${so_id}/confirm"
              payload: {}
              as: Manager
          assert:
            - "ConsignmentAgreement.${ag_id}.status == SETTLED"
            - "Patron.${p_id}.consignor_payable_cents == 21000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: shipping_cost_nested_min_max_mode_a
        grounds:
          - calculations.shipping_cost
          - entities.Shipment.fields.shipping_cost_cents
        distinguishing_aspect: "Mode (a): >=3 inputs (weight, zone, declared_value, insured) with nested min/max — weight 900g zone 2 insured declared 100000 -> carriage clamp(1100)=1100 + insurance clamp(2000)=2000 = 3100."
        test_recipe:
          setup:
            - "A SaleOrder exists to attach a shipment to (no confirm required)."
          setup_api_calls:
            - call: "POST /sale-orders"
              payload: { channel: "ONLINE", line_items: [], tax_pct: 0.08 }
              as: StoreClerk
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /sale-orders/${so_id}/shipment"
              payload: { packing_station_label: "S1", weight_grams: 900, zone: 2, declared_value_cents: 100000, insured: true, pack_start: "2026-07-01T10:00:00.000Z", pack_end: "2026-07-01T11:00:00.000Z" }
              as: StoreClerk
              captures: { sh_id: $.data.id }
          assert:
            - "Shipment.${sh_id}.shipping_cost_cents == 3100"

      - name: order_total_round_per_line_then_sum_mode_b
        grounds:
          - calculations.order_total
          - entities.SaleOrder.fields.subtotal_cents
        distinguishing_aspect: "Mode (b): rounding order pinned — per-line rounding of 505 and 515 at tax 0.08 gives 545+556=1101; sum-then-round would give 1102. The scaffold pins per-line."
        test_recipe:
          setup:
            - "A DRAFT SHOP SaleOrder with two line items (505 and 515, no discount) at tax 0.08."
          setup_api_calls: []
          trigger:
            - call: "POST /sale-orders"
              payload: { channel: "SHOP", tax_pct: 0.08, line_items: [ { book_item_id: "unused-1", sale_price_cents: 505, discount_pct: 0 }, { book_item_id: "unused-2", sale_price_cents: 515, discount_pct: 0 } ] }
              as: StoreClerk
              captures: { so_id: $.data.id }
          assert:
            - "SaleOrder.${so_id}.subtotal_cents == 1101"
            - "SaleOrder.${so_id}.total_cents == 1101"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: consignment_agreement_amend_cycle
        grounds:
          - state_machines.ConsignmentAgreement.PROPOSED_to_AMENDED
          - entities.ConsignmentAgreement.fields.amendment_no
        distinguishing_aspect: "Cyclic PROPOSED->AMENDED->AMENDED loop on ConsignmentAgreement: two successive amends leave status AMENDED with amendment_no 2."
        test_recipe:
          setup:
            - "A PROPOSED ConsignmentAgreement on an APPRAISED consigned item."
          setup_api_calls:
            - call: "POST /patrons"
              payload: { display_name: "Ben Dealer", email: "ben.nl1@x.com" }
              as: Manager
              captures: { p_id: $.data.id }
            - call: "POST /intake-lots"
              payload: { acquisition_channel: "CONSIGNMENT", consignor_id: "${p_id}" }
              as: StoreClerk
              captures: { lot_id: $.data.id }
            - call: "POST /intake-lots/${lot_id}/book-items"
              payload: { title: "Exiles", author: "James Joyce", comp_median_cents: 8000 }
              as: StoreClerk
              captures: { b_id: $.data.id }
            - call: "POST /book-items/${b_id}/grade"
              payload: { condition_grade: "GOOD" }
              as: Appraiser
              captures: { b_v: $.data.version }
            - call: "POST /book-items/${b_id}/appraisals"
              payload: { basis: "FAIR_MARKET", expected_book_item_version: "${b_v}" }
              as: Appraiser
            - call: "POST /consignment-agreements"
              payload: { patron_id: "${p_id}", book_item_id: "${b_id}", commission_pct: 0.30 }
              as: Manager
              captures: { ag_id: $.data.id, ag_v0: $.data.version }
          trigger:
            - call: "POST /consignment-agreements/${ag_id}/amend"
              payload: { commission_pct: 0.25, expected_consignment_agreement_version: "${ag_v0}" }
              as: Manager
              captures: { ag_v1: $.data.version }
            - call: "POST /consignment-agreements/${ag_id}/amend"
              payload: { commission_pct: 0.20, expected_consignment_agreement_version: "${ag_v1}" }
              as: Manager
          assert:
            - "ConsignmentAgreement.${ag_id}.status == AMENDED"
            - "ConsignmentAgreement.${ag_id}.amendment_no == 2"
            - "ConsignmentAgreement.${ag_id}.commission_pct == 0.20"

      - name: catalog_listing_parallel_axes_independent
        grounds:
          - state_machines.CatalogListing.online_status_DRAFT_to_LIVE
          - state_machines.CatalogListing.shop_status_DRAFT_to_ON_SHELF
        distinguishing_aspect: "Parallel dimensions on CatalogListing (different entity from the amend cycle): online_status and shop_status evolve independently — set LIVE then ON_SHELF and both persist."
        test_recipe:
          setup:
            - "A CatalogListing (DRAFT/DRAFT) on an APPRAISED item."
          setup_api_calls:
            - call: "POST /patrons"
              payload: { display_name: "Cara Dealer", email: "cara.nl2@x.com" }
              as: Manager
              captures: { p_id: $.data.id }
            - call: "POST /intake-lots"
              payload: { acquisition_channel: "PURCHASE" }
              as: StoreClerk
              captures: { lot_id: $.data.id }
            - call: "POST /intake-lots/${lot_id}/book-items"
              payload: { title: "Chamber Music", author: "James Joyce", comp_median_cents: 6000 }
              as: StoreClerk
              captures: { b_id: $.data.id }
            - call: "POST /book-items/${b_id}/grade"
              payload: { condition_grade: "FINE" }
              as: Appraiser
              captures: { b_v: $.data.version }
            - call: "POST /book-items/${b_id}/appraisals"
              payload: { basis: "FAIR_MARKET", expected_book_item_version: "${b_v}" }
              as: Appraiser
            - call: "POST /book-items/${b_id}/listing"
              payload: { list_price_cents: 9000 }
              as: StoreClerk
              captures: { cl_id: $.data.id, cl_v0: $.data.version }
          trigger:
            - call: "PATCH /catalog-listings/${cl_id}"
              payload: { online_status: "LIVE", expected_catalog_listing_version: "${cl_v0}" }
              as: StoreClerk
              captures: { cl_v1: $.data.version }
            - call: "PATCH /catalog-listings/${cl_id}"
              payload: { shop_status: "ON_SHELF", expected_catalog_listing_version: "${cl_v1}" }
              as: StoreClerk
          assert:
            - "CatalogListing.${cl_id}.online_status == LIVE"
            - "CatalogListing.${cl_id}.shop_status == ON_SHELF"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: sale_confirm_depth3_book_listing_agreement_payable
        grounds:
          - state_machines.SaleOrder.DRAFT_to_CONFIRMED
          - state_machines.BookItem.LISTED_to_SOLD
          - state_machines.CatalogListing.shop_status_ON_SHELF_to_SOLD
          - state_machines.ConsignmentAgreement.ACTIVE_to_SETTLED
        distinguishing_aspect: "Depth-3 cascade from SaleOrder confirm: order -> BookItem SOLD -> CatalogListing shop_status SOLD -> ConsignmentAgreement SETTLED accruing payout; each hop caused by the previous."
        test_recipe:
          setup:
            - "A consigned BookItem LISTED and shelved (ON_SHELF) with an ACTIVE GROSS_COMMISSION agreement (0.30); DRAFT SHOP order selling at 30000."
          setup_api_calls:
            - call: "POST /patrons"
              payload: { display_name: "Ada Dealer", email: "ada.tc1@x.com" }
              as: Manager
              captures: { p_id: $.data.id }
            - call: "POST /intake-lots"
              payload: { acquisition_channel: "CONSIGNMENT", consignor_id: "${p_id}" }
              as: StoreClerk
              captures: { lot_id: $.data.id }
            - call: "POST /intake-lots/${lot_id}/book-items"
              payload: { title: "Ulysses", author: "James Joyce", comp_median_cents: 20000, printing_number: 1, stated_first_edition: true }
              as: StoreClerk
              captures: { b_id: $.data.id }
            - call: "POST /book-items/${b_id}/grade"
              payload: { condition_grade: "VERY_GOOD" }
              as: Appraiser
              captures: { b_v: $.data.version }
            - call: "POST /book-items/${b_id}/appraisals"
              payload: { basis: "FAIR_MARKET", expected_book_item_version: "${b_v}" }
              as: Appraiser
            - call: "POST /book-items/${b_id}/listing"
              payload: { list_price_cents: 30000 }
              as: StoreClerk
              captures: { cl_id: $.data.id, cl_v: $.data.version }
            - call: "PATCH /catalog-listings/${cl_id}"
              payload: { shop_status: "ON_SHELF", expected_catalog_listing_version: "${cl_v}" }
              as: StoreClerk
            - call: "POST /consignment-agreements"
              payload: { patron_id: "${p_id}", book_item_id: "${b_id}", commission_pct: 0.30, fee_model: "GROSS_COMMISSION" }
              as: Manager
              captures: { ag_id: $.data.id }
            - call: "POST /consignment-agreements/${ag_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /sale-orders"
              payload: { channel: "SHOP", line_items: [ { book_item_id: "${b_id}", sale_price_cents: 30000, discount_pct: 0 } ] }
              as: StoreClerk
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /sale-orders/${so_id}/confirm"
              payload: {}
              as: Manager
          assert:
            - "BookItem.${b_id}.status == SOLD"
            - "CatalogListing.${cl_id}.shop_status == SOLD"
            - "CatalogListing.${cl_id}.online_status == DELISTED"
            - "CatalogListing.${cl_id}.sold_channel == SHOP"
            - "ConsignmentAgreement.${ag_id}.status == SETTLED"
            - "Patron.${p_id}.consignor_payable_cents == 21000"

      - name: intake_reject_depth2_book_withdrawn_appraisal_voided
        grounds:
          - state_machines.IntakeLot.DRAFT_to_REJECTED
          - state_machines.BookItem.to_WITHDRAWN
          - state_machines.Appraisal.ISSUED_to_VOIDED
        distinguishing_aspect: "Depth-2 cascade from IntakeLot reject (a different trigger than sale confirm): lot -> BookItem WITHDRAWN -> its ISSUED Appraisal VOIDED and appraised_value_cents cleared."
        test_recipe:
          setup:
            - "A DRAFT IntakeLot with one APPRAISED BookItem (an ISSUED Appraisal exists)."
          setup_api_calls:
            - call: "POST /intake-lots"
              payload: { acquisition_channel: "PURCHASE" }
              as: StoreClerk
              captures: { lot_id: $.data.id }
            - call: "POST /intake-lots/${lot_id}/book-items"
              payload: { title: "Pomes Penyeach", author: "James Joyce", comp_median_cents: 5000 }
              as: StoreClerk
              captures: { b_id: $.data.id }
            - call: "POST /book-items/${b_id}/grade"
              payload: { condition_grade: "GOOD" }
              as: Appraiser
              captures: { b_v: $.data.version }
            - call: "POST /book-items/${b_id}/appraisals"
              payload: { basis: "FAIR_MARKET", expected_book_item_version: "${b_v}" }
              as: Appraiser
              captures: { appr_id: $.data.id }
          trigger:
            - call: "POST /intake-lots/${lot_id}/reject"
              payload: {}
              as: Manager
          assert:
            - "IntakeLot.${lot_id}.status == REJECTED"
            - "BookItem.${b_id}.status == WITHDRAWN"
            - "BookItem.${b_id}.appraised_value_cents == null"
            - "Appraisal.${appr_id}.status == VOIDED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_state_outranks_referential
        grounds:
          - validations[priority=6]
          - validations[priority=7]
        distinguishing_aspect: "Category pair {state, business_referential}: a consigned item that is APPRAISED (not LISTED) AND whose agreement is PROPOSED (not ACTIVE) yields ERR_ITEM_NOT_LISTED (priority 6, state) rather than ERR_CONSIGNMENT_NOT_ACTIVE (priority 7, referential)."
        test_recipe:
          setup:
            - "A consigned BookItem still APPRAISED (no listing) with a PROPOSED (not activated) agreement; a DRAFT order whose single line references it."
          setup_api_calls:
            - call: "POST /patrons"
              payload: { display_name: "Ada Dealer", email: "ada.pp1@x.com" }
              as: Manager
              captures: { p_id: $.data.id }
            - call: "POST /intake-lots"
              payload: { acquisition_channel: "CONSIGNMENT", consignor_id: "${p_id}" }
              as: StoreClerk
              captures: { lot_id: $.data.id }
            - call: "POST /intake-lots/${lot_id}/book-items"
              payload: { title: "Giacomo Joyce", author: "James Joyce", comp_median_cents: 7000 }
              as: StoreClerk
              captures: { b_id: $.data.id }
            - call: "POST /book-items/${b_id}/grade"
              payload: { condition_grade: "GOOD" }
              as: Appraiser
              captures: { b_v: $.data.version }
            - call: "POST /book-items/${b_id}/appraisals"
              payload: { basis: "FAIR_MARKET", expected_book_item_version: "${b_v}" }
              as: Appraiser
            - call: "POST /consignment-agreements"
              payload: { patron_id: "${p_id}", book_item_id: "${b_id}", commission_pct: 0.30 }
              as: Manager
              captures: { ag_id: $.data.id }
            - call: "POST /sale-orders"
              payload: { channel: "SHOP", line_items: [ { book_item_id: "${b_id}", sale_price_cents: 7000, discount_pct: 0 } ] }
              as: StoreClerk
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /sale-orders/${so_id}/confirm"
              payload: {}
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ITEM_NOT_LISTED"
            - "http_status == 409"

      - name: booth_temporal_outranks_capacity_constraint
        grounds:
          - validations[priority=8]
          - validations[priority=9]
        distinguishing_aspect: "Category pair {business_temporal, business_constraint}: a new booth slot that both overlaps an existing slot on the same table AND would exceed table_capacity yields ERR_BOOTH_SLOT_CONFLICT (priority 8) not ERR_FAIR_CAPACITY_EXCEEDED (priority 9)."
        test_recipe:
          setup:
            - "A FairEvent with table_capacity 1 and one RESERVED BoothSlot on table T1 over [10:00,12:00) with display_item_count 1."
          setup_api_calls:
            - call: "POST /fair-events"
              payload: { name: "Spring Book Fair", table_capacity: 1 }
              as: Manager
              captures: { fair_id: $.data.id }
            - call: "POST /fair-events/${fair_id}/booth-slots"
              payload: { booth_table: "T1", window_start: "2026-07-10T10:00:00.000Z", window_end: "2026-07-10T12:00:00.000Z", display_item_count: 1 }
              as: StoreClerk
          trigger:
            - call: "POST /fair-events/${fair_id}/booth-slots"
              payload: { booth_table: "T1", window_start: "2026-07-10T11:00:00.000Z", window_end: "2026-07-10T13:00:00.000Z", display_item_count: 5 }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_BOOTH_SLOT_CONFLICT"
            - "http_status == 409"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: buyback_auto_approve_at_exact_limit
        grounds:
          - calculations.buyback_auto_approval
          - entities.BuybackOffer.fields.auto_approved
        distinguishing_aspect: "Numeric threshold boundary on POST /buyback-offers: offer_value_cents == 5000 auto-approves (<=), whereas 5001 stays PENDING."
        test_recipe:
          setup:
            - "A Patron to receive the offer."
          setup_api_calls:
            - call: "POST /patrons"
              payload: { display_name: "Seller One", email: "seller.bp1@x.com" }
              as: StoreClerk
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /buyback-offers"
              payload: { patron_id: "${p_id}", offer_value_cents: 5000 }
              as: StoreClerk
              captures: { offer_id: $.data.id }
          assert:
            - "BuybackOffer.${offer_id}.status == AUTO_APPROVED"
            - "BuybackOffer.${offer_id}.auto_approved == true"

      - name: confirm_empty_line_items_rejected
        grounds:
          - validations[priority=6]
          - errors[ERR_EMPTY_ORDER]
        distinguishing_aspect: "Empty-collection boundary (different metric and endpoint from the numeric buyback threshold): confirming a SaleOrder whose line_items is [] returns ERR_EMPTY_ORDER."
        test_recipe:
          setup:
            - "A DRAFT SaleOrder created with an empty line_items array."
          setup_api_calls:
            - call: "POST /sale-orders"
              payload: { channel: "SHOP", line_items: [] }
              as: StoreClerk
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /sale-orders/${so_id}/confirm"
              payload: {}
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_EMPTY_ORDER"
            - "http_status == 409"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: listing_requires_book_item_appraised
        grounds:
          - state_machines.BookItem.APPRAISED_to_LISTED
          - validations[priority=6]
        distinguishing_aspect: "Entity pair (CatalogListing depends on BookItem): creating a listing while the BookItem is only GRADED (not APPRAISED) returns ERR_ITEM_NOT_APPRAISED."
        test_recipe:
          setup:
            - "A BookItem graded but not yet appraised (status GRADED)."
          setup_api_calls:
            - call: "POST /intake-lots"
              payload: { acquisition_channel: "PURCHASE" }
              as: StoreClerk
              captures: { lot_id: $.data.id }
            - call: "POST /intake-lots/${lot_id}/book-items"
              payload: { title: "Stephen Hero", author: "James Joyce", comp_median_cents: 4000 }
              as: StoreClerk
              captures: { b_id: $.data.id }
            - call: "POST /book-items/${b_id}/grade"
              payload: { condition_grade: "GOOD" }
              as: Appraiser
          trigger:
            - call: "POST /book-items/${b_id}/listing"
              payload: { list_price_cents: 5000 }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ITEM_NOT_APPRAISED"
            - "http_status == 409"

      - name: confirm_requires_consignment_active
        grounds:
          - validations[priority=7]
          - state_machines.ConsignmentAgreement.PROPOSED_to_ACTIVE
        distinguishing_aspect: "Entity pair (SaleOrder depends on ConsignmentAgreement), different from the listing/BookItem pair: a LISTED consigned item whose agreement is still PROPOSED yields ERR_CONSIGNMENT_NOT_ACTIVE at confirm (item IS listed, so the state check passes)."
        test_recipe:
          setup:
            - "A consigned BookItem LISTED and shelved with a PROPOSED (not activated) agreement; a DRAFT order selling it."
          setup_api_calls:
            - call: "POST /patrons"
              payload: { display_name: "Ada Dealer", email: "ada.ce2@x.com" }
              as: Manager
              captures: { p_id: $.data.id }
            - call: "POST /intake-lots"
              payload: { acquisition_channel: "CONSIGNMENT", consignor_id: "${p_id}" }
              as: StoreClerk
              captures: { lot_id: $.data.id }
            - call: "POST /intake-lots/${lot_id}/book-items"
              payload: { title: "Finnegans Wake", author: "James Joyce", comp_median_cents: 15000 }
              as: StoreClerk
              captures: { b_id: $.data.id }
            - call: "POST /book-items/${b_id}/grade"
              payload: { condition_grade: "FINE" }
              as: Appraiser
              captures: { b_v: $.data.version }
            - call: "POST /book-items/${b_id}/appraisals"
              payload: { basis: "FAIR_MARKET", expected_book_item_version: "${b_v}" }
              as: Appraiser
            - call: "POST /book-items/${b_id}/listing"
              payload: { list_price_cents: 25000 }
              as: StoreClerk
              captures: { cl_id: $.data.id, cl_v: $.data.version }
            - call: "PATCH /catalog-listings/${cl_id}"
              payload: { shop_status: "ON_SHELF", expected_catalog_listing_version: "${cl_v}" }
              as: StoreClerk
            - call: "POST /consignment-agreements"
              payload: { patron_id: "${p_id}", book_item_id: "${b_id}", commission_pct: 0.30 }
              as: Manager
              captures: { ag_id: $.data.id }
            - call: "POST /sale-orders"
              payload: { channel: "SHOP", line_items: [ { book_item_id: "${b_id}", sale_price_cents: 25000, discount_pct: 0 } ] }
              as: StoreClerk
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /sale-orders/${so_id}/confirm"
              payload: {}
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CONSIGNMENT_NOT_ACTIVE"
            - "http_status == 409"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: booth_slot_half_open_adjacency_accepted
        grounds:
          - validations[priority=8]
          - entities.BoothSlot.fields.window_start
        distinguishing_aspect: "Interval semantics: half-open [start,end) with adjacency allowed on a FairEvent booth table — a slot [12:00,14:00) exactly abutting an existing [10:00,12:00) on the same table is ACCEPTED (no overlap)."
        test_recipe:
          setup:
            - "A FairEvent with capacity 10 and a RESERVED BoothSlot on T1 over [10:00,12:00)."
          setup_api_calls:
            - call: "POST /fair-events"
              payload: { name: "Autumn Fair", table_capacity: 10 }
              as: Manager
              captures: { fair_id: $.data.id }
            - call: "POST /fair-events/${fair_id}/booth-slots"
              payload: { booth_table: "T1", window_start: "2026-07-11T10:00:00.000Z", window_end: "2026-07-11T12:00:00.000Z", display_item_count: 1 }
              as: StoreClerk
          trigger:
            - call: "POST /fair-events/${fair_id}/booth-slots"
              payload: { booth_table: "T1", window_start: "2026-07-11T12:00:00.000Z", window_end: "2026-07-11T14:00:00.000Z", display_item_count: 1 }
              as: StoreClerk
              captures: { slot2_id: $.data.id }
          assert:
            - "BoothSlot.${slot2_id}.status == RESERVED"
            - "http_status == 201"

      - name: packing_slot_within_buffer_rejected
        grounds:
          - validations[priority=10]
          - entities.Shipment.fields.pack_start
        distinguishing_aspect: "Interval semantics: BUFFER gap on a packing_station_label (different resource than the booth table) — a second slot only 10 min after the first (buffer 15) on the same station is rejected with ERR_PACKING_SLOT_CONFLICT."
        test_recipe:
          setup:
            - "Two SaleOrders; the first already has a shipment packed on station 'S9' over [10:00,11:00)."
          setup_api_calls:
            - call: "POST /sale-orders"
              payload: { channel: "ONLINE", line_items: [] }
              as: StoreClerk
              captures: { so1_id: $.data.id }
            - call: "POST /sale-orders/${so1_id}/shipment"
              payload: { packing_station_label: "S9", weight_grams: 400, zone: 1, pack_start: "2026-07-12T10:00:00.000Z", pack_end: "2026-07-12T11:00:00.000Z" }
              as: StoreClerk
            - call: "POST /sale-orders"
              payload: { channel: "ONLINE", line_items: [] }
              as: StoreClerk
              captures: { so2_id: $.data.id }
          trigger:
            - call: "POST /sale-orders/${so2_id}/shipment"
              payload: { packing_station_label: "S9", weight_grams: 400, zone: 1, pack_start: "2026-07-12T11:10:00.000Z", pack_end: "2026-07-12T12:00:00.000Z" }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PACKING_SLOT_CONFLICT"
            - "http_status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: store_credit_conserved_across_buyback_void
        grounds:
          - calculations.store_credit_balance
          - state_machines.BuybackOffer.ACCEPTED_to_VOIDED
          - entities.Patron.fields.store_credit_cents
        distinguishing_aspect: "Conserved quantity = Patron.store_credit_cents: accept (+3000) then void (-3000) returns the balance to its exact pre-action 0."
        test_recipe:
          setup:
            - "A Patron with an ACCEPTED buyback offer of 3000 (store_credit_cents == 3000)."
          setup_api_calls:
            - call: "POST /patrons"
              payload: { display_name: "Seller Two", email: "seller.ci1@x.com" }
              as: StoreClerk
              captures: { p_id: $.data.id }
            - call: "POST /buyback-offers"
              payload: { patron_id: "${p_id}", offer_value_cents: 3000 }
              as: StoreClerk
              captures: { offer_id: $.data.id }
            - call: "POST /buyback-offers/${offer_id}/accept"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /buyback-offers/${offer_id}/void"
              payload: {}
              as: Manager
          assert:
            - "BuybackOffer.${offer_id}.status == VOIDED"
            - "Patron.${p_id}.store_credit_cents == 0"

      - name: consignor_payable_conserved_across_sale_refund
        grounds:
          - calculations.consignor_payable_balance
          - state_machines.SaleOrder.CONFIRMED_to_REFUNDED
          - entities.Patron.fields.consignor_payable_cents
        distinguishing_aspect: "Conserved quantity = Patron.consignor_payable_cents (a different ledger than store credit): confirm accrues 21000 then refund subtracts the identical 21000, returning the balance to 0."
        test_recipe:
          setup:
            - "A CONFIRMED SHOP sale of a consigned item at 30000 (GROSS 0.30) so the consignor's payable == 21000 before refund."
          setup_api_calls:
            - call: "POST /patrons"
              payload: { display_name: "Ada Dealer", email: "ada.ci2@x.com" }
              as: Manager
              captures: { p_id: $.data.id }
            - call: "POST /intake-lots"
              payload: { acquisition_channel: "CONSIGNMENT", consignor_id: "${p_id}" }
              as: StoreClerk
              captures: { lot_id: $.data.id }
            - call: "POST /intake-lots/${lot_id}/book-items"
              payload: { title: "Ulysses 2e", author: "James Joyce", comp_median_cents: 20000, printing_number: 1, stated_first_edition: true }
              as: StoreClerk
              captures: { b_id: $.data.id }
            - call: "POST /book-items/${b_id}/grade"
              payload: { condition_grade: "VERY_GOOD" }
              as: Appraiser
              captures: { b_v: $.data.version }
            - call: "POST /book-items/${b_id}/appraisals"
              payload: { basis: "FAIR_MARKET", expected_book_item_version: "${b_v}" }
              as: Appraiser
            - call: "POST /book-items/${b_id}/listing"
              payload: { list_price_cents: 30000 }
              as: StoreClerk
              captures: { cl_id: $.data.id, cl_v: $.data.version }
            - call: "PATCH /catalog-listings/${cl_id}"
              payload: { shop_status: "ON_SHELF", expected_catalog_listing_version: "${cl_v}" }
              as: StoreClerk
            - call: "POST /consignment-agreements"
              payload: { patron_id: "${p_id}", book_item_id: "${b_id}", commission_pct: 0.30, fee_model: "GROSS_COMMISSION" }
              as: Manager
              captures: { ag_id: $.data.id }
            - call: "POST /consignment-agreements/${ag_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /sale-orders"
              payload: { channel: "SHOP", line_items: [ { book_item_id: "${b_id}", sale_price_cents: 30000, discount_pct: 0 } ] }
              as: StoreClerk
              captures: { so_id: $.data.id }
            - call: "POST /sale-orders/${so_id}/confirm"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /sale-orders/${so_id}/refund"
              payload: {}
              as: Manager
          assert:
            - "SaleOrder.${so_id}.status == REFUNDED"
            - "ConsignmentAgreement.${ag_id}.status == ACTIVE"
            - "Patron.${p_id}.consignor_payable_cents == 0"
