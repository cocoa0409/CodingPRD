  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: cancel_confirmed_booking_preserves_money_ledger_invariant
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - state_machines.Booking.REQUESTED_to_CONFIRMED
          - entities.Owner.fields.wallet_credit_cents
          - entities.Sitter.fields.pending_payout_cents
          - entities.Booking.fields.booking_quote_cents
        distinguishing_aspect: |
          Conserved quantity: money_ledger = Owner.wallet_credit_cents +
          Sitter.pending_payout_cents + sum(Booking.booking_quote_cents
          where status==CONFIRMED). REQUEST→CONFIRM and then CANCEL must
          leave money_ledger unchanged from the pre-REQUEST baseline.
          (Owner initially had 0 wallet, no Sitter pending, no Booking;
          after REQUEST+CONFIRM+CANCEL, Owner.wallet has booking_quote
          back, Sitter.pending_payout returns to 0, no CONFIRMED Booking
          exists — quantities re-balance.)
        test_recipe:
          setup:
            - "Owner o13 wallet=0; Sitter s13 ACTIVE CLEARED with pending_payout==0; Pet p13; MG13 APPROVED."
          setup_api_calls:
            - call: "POST /api/v1/owners/register"
              payload: { email: "o13@example.com", full_name: "O Thirteen", phone: "+12025551601" }
              as: Anonymous
              captures: { o13_id: $.data.id }
            - call: "POST /api/v1/sitters/register"
              payload: { email: "s13@example.com", full_name: "S Thirteen", phone: "+12025551602" }
              as: Anonymous
              captures: { s13_id: $.data.id }
            - call: "POST /api/v1/background-checks"
              payload: { sitter_id: "${s13_id}", provider: "CHECKR" }
              as: PlatformAdmin
              captures: { bg13_id: $.data.id }
            - call: "POST /api/v1/background-checks/${bg13_id}/clear"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/v1/pets"
              payload: { owner_id: "${o13_id}", name: "Lucky", species: "DOG", weight_kg: 11 }
              as: Owner
              as_user_id: "${o13_id}"
              captures: { p13_id: $.data.id }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/meet-and-greets"
              payload: { owner_id: "${o13_id}", sitter_id: "${s13_id}", pet_id: "${p13_id}", scheduled_at: "2026-06-15T07:30:00Z" }
              as: Owner
              as_user_id: "${o13_id}"
              captures: { mg13_id: $.data.id }
            - call: "POST /api/v1/meet-and-greets/${mg13_id}/approve"
              payload: {}
              as: Owner
              as_user_id: "${o13_id}"
            - call: "POST /api/v1/bookings"
              payload: { owner_id: "${o13_id}", sitter_id: "${s13_id}", pet_id: "${p13_id}", service_type: "WALK_60MIN", time_of_day: "STANDARD", recurring_cadence: "NONE", start_at: "2026-06-15T09:00:00Z", end_at: "2026-06-15T10:00:00Z" }
              as: Owner
              as_user_id: "${o13_id}"
              captures: { b13_id: $.data.id, b13_quote: $.data.booking_quote_cents }
            - call: "POST /api/v1/bookings/${b13_id}/confirm"
              payload: {}
              as: Sitter
              as_user_id: "${s13_id}"
              captures: { b13_v_post_confirm: $.data.version }
          trigger:
            - call: "POST /api/v1/bookings/${b13_id}/cancel"
              payload: { reason: "owner changed plans", expected_booking_version: "${b13_v_post_confirm}" }
              as: Owner
              as_user_id: "${o13_id}"
              captures: { b13_status_post: $.data.status }
            - call: "GET /api/v1/owners/${o13_id}"
              payload: {}
              as: PlatformAdmin
              captures: { o13_wallet_post: $.data.wallet_credit_cents }
            - call: "GET /api/v1/sitters/${s13_id}"
              payload: {}
              as: PlatformAdmin
              captures: { s13_pending_post: $.data.pending_payout_cents }
          assert:
            - "Booking.${b13_id}.status == CANCELLED"
            - "Owner.${o13_id}.wallet_credit_cents == 3500  # booking_quote returned as wallet credit"
            - "Sitter.${s13_id}.pending_payout_cents == 0  # provisional payout reservation reversed"
            - "money_ledger invariant: Owner.wallet (3500) + Sitter.pending_payout (0) + sum(CONFIRMED Booking.booking_quote_cents)(0) == 3500 == initial booking_quote_cents charged at create"

      - name: withdraw_submitted_claim_preserves_claim_pool_invariant
        grounds:
          - state_machines.InsuranceClaim.SUBMITTED_to_WITHDRAWN
          - calculations.claim_payout
          - entities.InsuranceClaim.fields.provisional_payout_cents
        distinguishing_aspect: |
          Different conserved quantity from money_ledger: claim_reserve =
          sum(InsuranceClaim.provisional_payout_cents where status IN
          {SUBMITTED, UNDER_REVIEW, APPROVED}). Filing a claim adds the
          provisional payout to the reserve; WITHDRAWN removes it. Pre-
          and post-WITHDRAW reserves match within the same Sitter scope
          (different quantity dimension from Booking money_ledger).
        test_recipe:
