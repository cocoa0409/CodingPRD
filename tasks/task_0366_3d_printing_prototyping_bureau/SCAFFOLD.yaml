# =============================================================================
# 3D Printing & Prototyping Service Bureau — Scaffold (Expert)
# §1.0–§1.7 only. Difficulty/Corner designs live in sibling files.
# =============================================================================

scenario: |
  3D Printing & Prototyping Service Bureau: file upload & printability check,
  material/process & resolution, instant quote by volume/time, queue & machine
  scheduling, post-processing/finishing, rush, reprint/failure policy, shipment

domain_name: printing-bureau
api_prefix: /bureaus

complexity_profile:
  primary_archetype: Workflow orchestration
  secondary_archetype: Quota / allocation
  complexity_layers:
    - Optimistic concurrency
    - Cascading side effects
    - Dual-variant calculation
    - Rate / threshold triggers
    - Derived field reconciliation

  entity_topology: hybrid
  # Bureau is the multi-tenant root (parent of Machine, Material, Customer, Order,
  # PrintFile, Spool). PrintRun/OrderLine/FinishingTask/Shipment hang off Order &
  # Machine via flat FK references — a tree with heavy cross-cutting associations.

  state_machine_shape: parallel
  # Order carries two independent axes: fulfillment_status (DRAFT…SHIPPED) and
  # payment_status (UNPAID/ESCROWED/CAPTURED/REFUNDED). PrintRun is a cyclic
  # machine (QUEUED→PRINTING→FAILED→QUEUED reprint loop). PrintFile branches
  # (UPLOADED→{PRINTABLE,FLAGGED,REJECTED}).

  relationship_patterns:
    - one_to_many        # Order has many OrderLine; Machine has many PrintRun
    - cross_aggregate    # PrintRun -> Spool (Material aggregate) -> deducts grams
    - self_referential   # OrderLine.reprint_of_line_id -> OrderLine.id (reprint chain)

  role_model: peer_roles
  # Customer owns Orders/PrintFiles. Operator runs machines & post-processing.
  # QAReviewer adjudicates printability & failure causes. BureauAdmin = config +
  # override. Identity is entity_backed for Customer, opaque for staff roles.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Bureau
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Service bureau name" }
      - { name: cooldown_buffer_min, type: integer, source: input, default: 15, description: "Required gap (minutes) between post-process station jobs; closed-interval semantics" }
      - { name: shift_capacity_minutes, type: integer, source: input, default: 480, description: "Per-machine schedulable minutes in the current shift window" }
      - { name: clock_utc, type: datetime, source: system, description: "Bureau-scoped current UTC clock; advanced only via POST /bureaus/{bureauId}/clock" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 per mutation" }

  - name: Customer
    parent: Bureau
    common_fields: true
    fields:
      - { name: bureau_id, type: string, source: input, description: "FK -> Bureau.id" }
      - { name: email, type: string, source: input, description: "Login/identity email; unique within bureau" }
      - { name: display_name, type: string, source: input, description: "Customer display name" }
      - { name: lifetime_deposits_cents, type: integer, source: computed, default: 0, description: "Total ever deposited; monotonic; = wallet + escrow_held + captured_revenue_attributed (conservation anchor)" }
      - { name: wallet_balance_cents, type: integer, source: computed, default: 0, description: "Spendable balance; debited into escrow on confirm, credited on refund/deposit" }
      - { name: escrow_held_cents, type: integer, source: computed, default: 0, description: "Sum of grand_total_cents over this customer's Orders in payment_status=ESCROWED" }
      - { name: captured_revenue_cents, type: integer, source: computed, default: 0, description: "Sum of grand_total_cents over this customer's Orders in payment_status=CAPTURED" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 per mutation" }

  - name: Material
    parent: Bureau
    common_fields: true
    fields:
      - { name: bureau_id, type: string, source: input, description: "FK -> Bureau.id" }
      - { name: process, type: enum, source: input, description: "SLA | FDM | SLS — printing technology" }
      - { name: name, type: string, source: input, description: "Material trade name e.g. 'Tough Resin'" }
      - { name: density_g_per_cm3, type: number, source: input, description: "Density used to convert volume_cm3 to grams" }
      - { name: material_rate_cents_per_cm3, type: integer, source: input, description: "Quote rate per cm3 of part volume" }
      - { name: machine_rate_cents_per_min, type: integer, source: input, description: "Quote rate per minute of machine print time" }
      - { name: setup_fee_cents, type: integer, source: input, description: "Fixed per-order-line setup fee for this material/process" }
      - { name: min_wall_thickness_mm, type: number, source: input, description: "Minimum printable wall thickness for printability scoring" }
      - { name: max_overhang_deg, type: number, source: input, description: "Maximum unsupported overhang angle for printability scoring" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | RETIRED — RETIRED blocks new lines (ERR_MATERIAL_RETIRED)" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 per mutation" }

  - name: Machine
    parent: Bureau
    common_fields: true
    fields:
      - { name: bureau_id, type: string, source: input, description: "FK -> Bureau.id" }
      - { name: process, type: enum, source: input, description: "SLA | FDM | SLS — must match a PrintRun's material.process" }
      - { name: label, type: string, source: input, description: "Machine label e.g. 'Form3-A'" }
      - { name: build_x_mm, type: number, source: input, description: "Build volume X dimension (mm)" }
      - { name: build_y_mm, type: number, source: input, description: "Build volume Y dimension (mm)" }
      - { name: build_z_mm, type: number, source: input, description: "Build volume Z dimension (mm)" }
      - { name: scheduled_minutes, type: integer, source: computed, default: 0, description: "Sum of duration_min over this machine's PrintRuns in {QUEUED, PRINTING}" }
      - { name: active_minutes, type: integer, source: computed, default: 0, description: "Sum of duration_min over this machine's PrintRuns in {PRINTING} only" }
      - { name: utilization_pct, type: integer, source: computed, default: 0, description: "COMMITTED variant: round_half_up(scheduled_minutes / bureau.shift_capacity_minutes * 100)" }
      - { name: active_utilization_pct, type: integer, source: computed, default: 0, description: "ACTIVE variant: round_half_up(active_minutes / bureau.shift_capacity_minutes * 100)" }
      - { name: status, type: enum, source: system, default: "ONLINE", description: "ONLINE | MAINTENANCE — MAINTENANCE blocks queueing (ERR_MACHINE_OFFLINE)" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 per mutation" }

  - name: Spool
    parent: Bureau
    common_fields: true
    fields:
      - { name: bureau_id, type: string, source: input, description: "FK -> Bureau.id" }
      - { name: material_id, type: string, source: input, description: "FK -> Material.id; spool stock of a specific material" }
      - { name: grams_total, type: integer, source: input, description: "Original grams loaded; conservation anchor for this spool" }
      - { name: grams_committed, type: integer, source: computed, default: 0, description: "Sum of run_grams over this spool's PrintRuns in {QUEUED, PRINTING}" }
      - { name: grams_consumed, type: integer, source: computed, default: 0, description: "Sum of run_grams over this spool's PrintRuns in {DONE, FAILED} (waste counts as consumed)" }
      - { name: grams_remaining, type: integer, source: computed, description: "= grams_total - grams_committed - grams_consumed" }
      - { name: status, type: enum, source: system, default: "LOADED", description: "LOADED | DEPLETED — DEPLETED when grams_remaining == 0" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 per mutation" }

  - name: PrintFile
    parent: Bureau
    common_fields: true
    fields:
      - { name: bureau_id, type: string, source: input, description: "FK -> Bureau.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; uploader/owner" }
      - { name: filename, type: string, source: input, description: "Uploaded mesh filename" }
      - { name: volume_cm3, type: number, source: input, description: "Mesh solid volume in cm3 (client-supplied geometry summary)" }
      - { name: bbox_x_mm, type: number, source: input, description: "Bounding box X (mm)" }
      - { name: bbox_y_mm, type: number, source: input, description: "Bounding box Y (mm)" }
      - { name: bbox_z_mm, type: number, source: input, description: "Bounding box Z (mm); also part_height for layer count" }
      - { name: min_wall_mm, type: number, source: input, description: "Thinnest wall measured in mesh (mm)" }
      - { name: max_overhang_deg, type: number, source: input, description: "Steepest unsupported overhang (deg)" }
      - { name: is_manifold, type: boolean, source: input, description: "True if mesh is watertight/manifold" }
      - { name: printability_score, type: integer, source: computed, description: "0..100 weighted score vs a target Material (set on /check)" }
      - { name: checked_against_material_id, type: string, source: system, description: "FK -> Material.id; material used in the most recent printability check" }
      - { name: status, type: enum, source: system, default: "UPLOADED", description: "UPLOADED | PRINTABLE | FLAGGED | REJECTED — set by printability check" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 per mutation" }

  - name: Order
    parent: Bureau
    common_fields: true
    fields:
      - { name: bureau_id, type: string, source: input, description: "FK -> Bureau.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; order owner" }
      - { name: lead_tier, type: enum, source: input, default: "STANDARD", description: "STANDARD | EXPEDITE | RUSH — drives rush surcharge tier" }
      - { name: parts_subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of line_total_cents over non-VOID OrderLines" }
      - { name: finishing_subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of finishing_total_cents over non-VOID OrderLines" }
      - { name: rush_surcharge_cents, type: integer, source: computed, default: 0, description: "round_half_up((parts_subtotal_cents+finishing_subtotal_cents)*rush_pct/100)" }
      - { name: grand_total_cents, type: integer, source: computed, default: 0, description: "parts_subtotal_cents + finishing_subtotal_cents + rush_surcharge_cents" }
      - { name: fulfillment_status, type: enum, source: system, default: "DRAFT", description: "DRAFT | QUOTED | CONFIRMED | IN_PRODUCTION | POST_PROCESSING | READY | SHIPPED | CANCELLED" }
      - { name: payment_status, type: enum, source: system, default: "UNPAID", description: "UNPAID | ESCROWED | CAPTURED | REFUNDED — independent axis" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 per mutation" }

  - name: OrderLine
    parent: Bureau
    common_fields: true
    fields:
      - { name: bureau_id, type: string, source: input, description: "FK -> Bureau.id" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; owning order" }
      - { name: print_file_id, type: string, source: input, description: "FK -> PrintFile.id; geometry being printed" }
      - { name: material_id, type: string, source: input, description: "FK -> Material.id; material/process for this line" }
      - { name: layer_height_mm, type: number, source: input, description: "Resolution; smaller = more layers = more time" }
      - { name: quantity, type: integer, source: input, description: "Number of identical parts; must be >= 1" }
      - { name: print_minutes, type: integer, source: computed, description: "ceil(ceil(bbox_z_mm/layer_height_mm)*SECONDS_PER_LAYER/60) per part" }
      - { name: per_part_cents, type: integer, source: computed, description: "round_half_up(volume_cm3*material_rate + print_minutes*machine_rate)" }
      - { name: line_total_cents, type: integer, source: computed, description: "per_part_cents*quantity + material.setup_fee_cents" }
      - { name: finishing_total_cents, type: integer, source: computed, default: 0, description: "Sum of FinishingTask.addon_cents for this line * quantity" }
      - { name: reprint_of_line_id, type: string, source: system, description: "FK -> OrderLine.id; set when this line was spawned as a reprint of a failed line (self-referential)" }
      - { name: reprint_cause, type: enum, source: system, description: "MACHINE_FAULT | OPERATOR_ERROR | FILE_DEFECT | CUSTOMER_CHANGE — set when adjudicated" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | VOID — VOID excluded from order totals" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 per mutation" }

  - name: FinishingTask
    parent: Bureau
    common_fields: true
    fields:
      - { name: bureau_id, type: string, source: input, description: "FK -> Bureau.id" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; line being finished" }
      - { name: kind, type: enum, source: input, description: "SUPPORT_REMOVAL | SANDING | DYE_BLACK | UV_CURE | POLISH" }
      - { name: addon_cents, type: integer, source: input, description: "Per-part finishing add-on charge" }
      - { name: station_start_min, type: integer, source: input, description: "Post-process station start offset (minutes from clock epoch) when scheduled" }
      - { name: station_duration_min, type: integer, source: input, description: "Station occupation duration (minutes)" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | SCHEDULED | DONE | SKIPPED" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 per mutation" }

  - name: PrintRun
    parent: Bureau
    common_fields: true
    fields:
      - { name: bureau_id, type: string, source: input, description: "FK -> Bureau.id" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; line this run produces" }
      - { name: machine_id, type: string, source: input, description: "FK -> Machine.id; assigned machine" }
      - { name: spool_id, type: string, source: input, description: "FK -> Spool.id; material stock drawn down" }
      - { name: start_min, type: integer, source: input, description: "Machine schedule start (minutes from clock epoch)" }
      - { name: duration_min, type: integer, source: input, description: "Machine occupation duration (minutes)" }
      - { name: run_grams, type: integer, source: computed, description: "round_half_up(print_file.volume_cm3 * material.density_g_per_cm3 * quantity)" }
      - { name: fail_cause, type: enum, source: system, description: "MACHINE_FAULT | OPERATOR_ERROR | FILE_DEFECT | CUSTOMER_CHANGE — set on FAIL" }
      - { name: status, type: enum, source: system, default: "QUEUED", description: "QUEUED | PRINTING | DONE | FAILED | CANCELLED" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 per mutation" }

  - name: Shipment
    parent: Bureau
    common_fields: true
    fields:
      - { name: bureau_id, type: string, source: input, description: "FK -> Bureau.id" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; order being shipped" }
      - { name: carrier, type: enum, source: input, description: "UPS | FEDEX | DHL" }
      - { name: tracking_number, type: string, source: input, description: "Carrier tracking number" }
      - { name: status, type: enum, source: system, default: "CREATED", description: "CREATED | DISPATCHED" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 per mutation" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- PrintFile: branching on printability -------------------------------
  - entity: PrintFile
    initial_state: UPLOADED
    terminal_states: [REJECTED]
    transitions:
      - from: UPLOADED
        to: PRINTABLE
        trigger: "POST /bureaus/print-files/{fileId}/check"
        actor: QAReviewer
        preconditions:
          - "Target Material exists and material.status == ACTIVE"
          - "printability_score >= 70 AND is_manifold == true"
        side_effects:
          - "Compute printability_score (calc: printability_score), persist checked_against_material_id"
      - from: UPLOADED
        to: FLAGGED
        trigger: "POST /bureaus/print-files/{fileId}/check"
        actor: QAReviewer
        preconditions:
          - "is_manifold == true AND 50 <= printability_score < 70"
        side_effects:
          - "Compute printability_score; persist checked_against_material_id"
      - from: UPLOADED
        to: REJECTED
        trigger: "POST /bureaus/print-files/{fileId}/check"
        actor: QAReviewer
        preconditions:
          - "is_manifold == false OR printability_score < 50"
        side_effects:
          - "Compute printability_score; persist checked_against_material_id"
      - from: FLAGGED
        to: PRINTABLE
        trigger: "POST /bureaus/print-files/{fileId}/override"
        actor: QAReviewer
        preconditions:
          - "PrintFile.status == FLAGGED"
        side_effects:
          - "QAReviewer accepts a FLAGGED file for production despite sub-70 score"
      - from: FLAGGED
        to: REJECTED
        trigger: "POST /bureaus/print-files/{fileId}/check"
        actor: QAReviewer
        preconditions:
          - "Re-check after geometry summary edit yields is_manifold == false OR printability_score < 50"
        side_effects:
          - "Recompute printability_score; persist checked_against_material_id"
        note: "A FLAGGED file may be re-checked against a different material; cyclic re-evaluation back through UPLOADED scoring logic."

  # ---- Order: PARALLEL dimensions (fulfillment_status × payment_status) ----
  - entity: Order
    initial_state: DRAFT
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      # fulfillment axis
      - from: DRAFT
        to: QUOTED
        trigger: "POST /bureaus/orders/{orderId}/quote"
        actor: Customer
        preconditions:
          - "Order has >= 1 ACTIVE OrderLine (ERR_ORDER_EMPTY)"
          - "Every ACTIVE line's PrintFile.status IN {PRINTABLE} (ERR_FILE_NOT_PRINTABLE)"
        side_effects:
          - "Recompute parts_subtotal_cents, finishing_subtotal_cents, rush_surcharge_cents, grand_total_cents (calc: order_totals + rush_surcharge)"
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /bureaus/orders/{orderId}/confirm"
        actor: Customer
        preconditions:
          - "payment_status == UNPAID"
          - "customer.wallet_balance_cents >= grand_total_cents (ERR_INSUFFICIENT_WALLET)"
          - "expected_order_version matches Order.version"
        side_effects:
          - "payment_status -> ESCROWED"
          - "customer.wallet_balance_cents -= grand_total_cents; customer.escrow_held_cents += grand_total_cents (calc: wallet_ledger)"
          - "increments Order.version by 1"
      - from: CONFIRMED
        to: IN_PRODUCTION
        trigger: "system (automatic when first PrintRun for the order transitions QUEUED->PRINTING)"
        actor: system
        preconditions:
          - "payment_status == ESCROWED"
        side_effects: []
      - from: IN_PRODUCTION
        to: POST_PROCESSING
        trigger: "system (automatic when every ACTIVE line's terminal PrintRun is DONE and >= 1 FinishingTask is PENDING/SCHEDULED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: POST_PROCESSING
        to: READY
        trigger: "system (automatic when every FinishingTask for the order is DONE or SKIPPED)"
        actor: system
        preconditions: []
        side_effects: []
        note: "If an order has no FinishingTasks, IN_PRODUCTION bubbles directly to READY when all runs DONE."
      - from: IN_PRODUCTION
        to: READY
        trigger: "system (automatic when every ACTIVE line's terminal PrintRun is DONE and the order has zero FinishingTasks)"
        actor: system
        preconditions: []
        side_effects: []
      - from: READY
        to: SHIPPED
        trigger: "POST /bureaus/orders/{orderId}/ship"
        actor: Operator
        preconditions:
          - "fulfillment_status == READY (ERR_ORDER_NOT_READY)"
          - "payment_status == ESCROWED"
          - "A Shipment with status==CREATED exists for the order (ERR_NO_SHIPMENT)"
          - "expected_order_version matches Order.version"
        side_effects:
          - "payment_status -> CAPTURED"
          - "customer.escrow_held_cents -= grand_total_cents; customer.captured_revenue_cents += grand_total_cents (calc: wallet_ledger)"
          - "linked Shipment.status -> DISPATCHED"
          - "increments Order.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /bureaus/orders/{orderId}/cancel"
        actor: Customer
        preconditions: []
        side_effects:
          - "All ACTIVE OrderLines -> VOID"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /bureaus/orders/{orderId}/cancel"
        actor: Customer
        preconditions: []
        side_effects:
          - "All ACTIVE OrderLines -> VOID"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /bureaus/orders/{orderId}/cancel"
        actor: Customer
        preconditions:
          - "No PrintRun for any line in status PRINTING or DONE (ERR_PRODUCTION_STARTED)"
        side_effects:
          - "payment_status -> REFUNDED"
          - "customer.escrow_held_cents -= grand_total_cents; customer.wallet_balance_cents += grand_total_cents (calc: wallet_ledger — compensation, full refund)"
          - "All QUEUED PrintRuns -> CANCELLED (releasing spool grams_committed)"
          - "All ACTIVE OrderLines -> VOID"

  # ---- PrintRun: CYCLIC (failure -> reprint loop) -------------------------
  - entity: PrintRun
    initial_state: QUEUED
    terminal_states: [DONE, CANCELLED]
    transitions:
      - from: QUEUED
        to: PRINTING
        trigger: "POST /bureaus/print-runs/{runId}/start"
        actor: Operator
        preconditions:
          - "machine.status == ONLINE (ERR_MACHINE_OFFLINE)"
          - "No other PrintRun on machine_id in status PRINTING (ERR_MACHINE_BUSY)"
          - "owning Order.payment_status == ESCROWED (ERR_ORDER_NOT_ESCROWED)"
        side_effects:
          - "Recompute machine.active_minutes/active_utilization_pct (calc: machine_utilization ACTIVE variant)"
          - "If owning Order.fulfillment_status == CONFIRMED: Order.fulfillment_status -> IN_PRODUCTION (bubble-up)"
      - from: PRINTING
        to: DONE
        trigger: "POST /bureaus/print-runs/{runId}/complete"
        actor: Operator
        preconditions:
          - "PrintRun.status == PRINTING"
        side_effects:
          - "spool: grams_committed -= run_grams; grams_consumed += run_grams (calc: spool_conservation)"
          - "If every ACTIVE line of the order now has a DONE terminal run: Order bubbles to POST_PROCESSING (if FinishingTasks exist) else READY"
      - from: PRINTING
        to: FAILED
        trigger: "POST /bureaus/print-runs/{runId}/fail"
        actor: Operator
        preconditions:
          - "PrintRun.status == PRINTING"
        side_effects:
          - "Set fail_cause from request body"
          - "spool: grams_committed -= run_grams; grams_consumed += run_grams (material wasted, calc: spool_conservation)"
          - "Spawn reprint OrderLine (copy of failed line, reprint_of_line_id set, reprint_cause = fail_cause)"
          - "Reprint billing applied per calc: reprint_attribution variant=FORWARD (provisional charge added to order totals immediately)"
          - "Order totals recomputed (calc: order_totals); customer escrow top-up debited for the delta (calc: wallet_ledger)"
        note: "FAILED is non-terminal: the spawned reprint line gets a fresh QUEUED PrintRun, closing the cycle."
      - from: FAILED
        to: QUEUED
        trigger: "POST /bureaus/print-runs/{runId}/adjudicate"
        actor: QAReviewer
        preconditions:
          - "PrintRun.status == FAILED"
          - "expected_run_version matches PrintRun.version"
        side_effects:
          - "Final reprint cost re-attributed per calc: reprint_attribution variant=CHRONOLOGICAL (cause-based)"
          - "Order totals recomputed; escrow delta vs the provisional FORWARD charge reconciled on customer ledger (calc: wallet_ledger)"
          - "A new QUEUED PrintRun is created for the reprint line (caller supplies machine/spool/slot via the run create endpoint referenced in side effect chain)"
          - "increments PrintRun.version by 1"
        note: "Cycle close: FAILED run re-enters scheduling as the reprint's QUEUED run after cost is finalized."
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /bureaus/print-runs/{runId}/cancel"
        actor: Operator
        preconditions:
          - "PrintRun.status == QUEUED"
        side_effects:
          - "spool: grams_committed -= run_grams (released, NOT consumed — compensation, calc: spool_conservation)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version; serial-observable)
# =============================================================================
concurrency_rules:
  - rule_id: order-confirm-stale-order
    parent_entity: Order
    write_endpoint: "POST /bureaus/orders/{orderId}/confirm"
    occ_field: "expected_order_version"
    description: |
      Confirming an Order whose version has advanced since the client last
      observed it is rejected. Captures the case where a reprint failure or a
      re-quote has already mutated the order's totals (and version), so the
      client's observed grand_total is stale and the escrow debit would be
      computed against an out-of-date figure.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: printrun-adjudicate-stale-run
    parent_entity: PrintRun
    write_endpoint: "POST /bureaus/print-runs/{runId}/adjudicate"
    occ_field: "expected_run_version"
    description: |
      Adjudicating a FAILED PrintRun whose version has advanced since the
      client last observed it is rejected. Captures the case where the run was
      already adjudicated (advancing version and re-attributing cost) and a
      second adjudication carrying the stale version would double-reconcile.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: printability_score
    trigger: "POST /print-files/{fileId}/check (PrintFile UPLOADED|FLAGGED -> PRINTABLE|FLAGGED|REJECTED)"
    algorithm: weighted_scoring
    formula: |
      # Scored against the target Material supplied in the check request.
      manifold_pts   = 40 if print_file.is_manifold else 0
      fits_pts       = 30 if (sorted([bbox_x_mm,bbox_y_mm,bbox_z_mm]) fits inside
                              sorted([machine?])) ... NO machine here -> use Material's
                              build envelope proxy: fits if every bbox dim <=
                              the LARGEST online Machine.build dim of material.process.
                              Pinned: fits_pts = 30 if max(bbox_x,bbox_y,bbox_z) <=
                              max build dim across ONLINE Machines with same process,
                              else 0. If no such machine, fits_pts = 0.
      wall_pts       = 20 if print_file.min_wall_mm >= material.min_wall_thickness_mm else 0
      overhang_pts   = 10 if print_file.max_overhang_deg <= material.max_overhang_deg else 0
      printability_score = manifold_pts + fits_pts + wall_pts + overhang_pts   # 0..100
      # HARD GATE precedence: is_manifold==false forces REJECTED regardless of score.
      if not is_manifold:                status = REJECTED
      elif printability_score >= 70:     status = PRINTABLE
      elif printability_score >= 50:     status = FLAGGED
      else:                              status = REJECTED
    input_set: "Single PrintFile vs one target Material; fits checked against ONLINE same-process Machines."
    constants:
      W_MANIFOLD: 40
      W_FITS: 30
      W_WALL: 20
      W_OVERHANG: 10
      PRINTABLE_MIN: 70
      FLAGGED_MIN: 50
    precision: "integer points; no rounding"

  - name: order_line_pricing
    trigger: "POST /orders/{orderId}/lines (OrderLine create) and on reprint line spawn"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial mode (b): per-part round THEN multiply by quantity (pinned order).
      layer_count   = ceil(print_file.bbox_z_mm / order_line.layer_height_mm)
      print_seconds = layer_count * SECONDS_PER_LAYER
      print_minutes = ceil(print_seconds / 60)                       # per part
      material_cost = print_file.volume_cm3 * material.material_rate_cents_per_cm3   # cents, may be fractional
      machine_cost  = print_minutes * material.machine_rate_cents_per_min           # integer cents
      per_part_cents  = round_half_up(material_cost + machine_cost)   # ROUND PER PART FIRST
      line_total_cents = per_part_cents * quantity + material.setup_fee_cents        # THEN multiply + setup
    input_set: "One OrderLine; its PrintFile geometry; its Material rates."
    constants:
      SECONDS_PER_LAYER: 7
    precision: "round_half_up to integer cents, per-part then sum"

  - name: order_totals
    trigger: "OrderLine create/void, FinishingTask attach, reprint spawn, /quote"
    algorithm: aggregation
    formula: |
      parts_subtotal_cents     = sum(line_total_cents for OrderLine where status==ACTIVE)
      finishing_subtotal_cents = sum(finishing_total_cents for OrderLine where status==ACTIVE)
      # finishing_total_cents per line = sum(FinishingTask.addon_cents for that line) * line.quantity
      base = parts_subtotal_cents + finishing_subtotal_cents
      rush_pct = RUSH_TIER[order.lead_tier]
      rush_surcharge_cents = round_half_up(base * rush_pct / 100)     # rounded once at order level
      grand_total_cents = base + rush_surcharge_cents
    input_set: "OrderLines with status==ACTIVE only; VOID lines excluded."
    constants:
      RUSH_TIER: "{ STANDARD: 0, EXPEDITE: 30, RUSH: 75 }"
    precision: "round_half_up to integer cents; rush rounded once at base level"

  - name: reprint_attribution
    trigger: "PrintRun PRINTING->FAILED (FORWARD) and FAILED->QUEUED adjudicate (CHRONOLOGICAL)"
    algorithm: forward_looking
    formula: |
      # original failed line's per-part split:
      material_portion = round_half_up(failed_line.volume_cm3 * material.material_rate_cents_per_cm3) * failed_line.quantity
      machine_portion  = failed_line.print_minutes * material.machine_rate_cents_per_min * failed_line.quantity
      # FORWARD (provisional, at /fail): customer billed full reprint immediately
      reprint_charge_FORWARD = failed_line.line_total_cents          # full line re-billed, estimate
      # CHRONOLOGICAL (final, at /adjudicate): cause-based attribution
      if reprint_cause in {MACHINE_FAULT, OPERATOR_ERROR}:
          reprint_charge_FINAL = 0                                   # bureau absorbs
      else:  # FILE_DEFECT, CUSTOMER_CHANGE
          reprint_charge_FINAL = material_portion + round_half_up(machine_portion * 0.5)
      # reconciliation delta applied to order totals & customer ledger:
      reconcile_delta = reprint_charge_FINAL - reprint_charge_FORWARD
    input_set: "The failed OrderLine and its spawned reprint line; same data, two variants."
    variants:
      - name: FORWARD
        when: "at PrintRun /fail — provisional charge added before cause adjudicated"
        difference: "Customer billed the FULL original line_total_cents as reprint estimate."
      - name: CHRONOLOGICAL
        when: "at PrintRun /adjudicate — final cause-based attribution"
        difference: "Bureau-fault causes set charge to 0; customer-fault causes bill material + 50% machine."
    precision: "round_half_up to integer cents"

  - name: machine_utilization
    trigger: "PrintRun create/start/cancel/complete/fail; any change to {QUEUED,PRINTING} membership on a machine"
    algorithm: aggregation
    formula: |
      # DUAL-VARIANT on the Machine domain — same PrintRun set, two inclusion algorithms.
      # COMMITTED counts everything that holds a slot (queued + printing);
      # ACTIVE counts only what is physically running now (printing).
      scheduled_minutes      = sum(duration_min for PrintRun where machine_id==M and status IN {QUEUED, PRINTING})
      active_minutes         = sum(duration_min for PrintRun where machine_id==M and status IN {PRINTING})
      utilization_pct        = round_half_up(scheduled_minutes / bureau.shift_capacity_minutes * 100)   # COMMITTED
      active_utilization_pct = round_half_up(active_minutes / bureau.shift_capacity_minutes * 100)       # ACTIVE
      # capacity gate on create: reject if scheduled_minutes + new.duration_min > shift_capacity_minutes
    input_set: "PrintRuns on one machine; COMMITTED partitions on {QUEUED,PRINTING}, ACTIVE on {PRINTING}."
    variants:
      - name: COMMITTED
        when: "utilization_pct — reported as capacity reservation (queued slots count)"
        difference: "Includes QUEUED runs; rises the moment a run is scheduled, before it starts."
      - name: ACTIVE
        when: "active_utilization_pct — reported as live floor load (only running jobs count)"
        difference: "Excludes QUEUED runs; rises only when a run transitions to PRINTING."
    precision: "round_half_up to integer percent"

  - name: spool_conservation
    trigger: "PrintRun create (commit), complete/fail (consume), cancel (release)"
    algorithm: aggregation
    formula: |
      run_grams         = round_half_up(print_file.volume_cm3 * material.density_g_per_cm3 * order_line.quantity)
      grams_committed   = sum(run_grams for PrintRun where spool_id==S and status IN {QUEUED, PRINTING})
      grams_consumed    = sum(run_grams for PrintRun where spool_id==S and status IN {DONE, FAILED})
      grams_remaining   = grams_total - grams_committed - grams_consumed
      # INVARIANT: grams_remaining + grams_committed + grams_consumed == grams_total  (always)
      # gate on PrintRun create: reject if run_grams > grams_remaining (ERR_SPOOL_INSUFFICIENT)
      # status -> DEPLETED when grams_remaining == 0
    input_set: "PrintRuns on one Spool partitioned by status."
    precision: "integer grams, round_half_up at run_grams"

  - name: wallet_ledger
    trigger: "Order confirm (escrow), ship (capture), cancel (refund), reprint reconcile"
    algorithm: aggregation
    formula: |
      # conserved quantity: lifetime_deposits_cents == wallet + escrow_held + captured_revenue (always)
      # confirm:  wallet -= grand_total; escrow_held += grand_total
      # ship:     escrow_held -= grand_total; captured_revenue += grand_total
      # cancel(CONFIRMED): escrow_held -= grand_total; wallet += grand_total   (compensation)
      # reprint FORWARD (at /fail): escrow top-up = +reprint_charge_FORWARD -> wallet -= delta; escrow_held += delta
      # reprint CHRONOLOGICAL (at /adjudicate): reconcile_delta applied:
      #     escrow_held += reconcile_delta ; wallet -= reconcile_delta   (delta may be negative => refund to wallet)
      escrow_held_cents     = sum(grand_total_cents for Order where customer matches and payment_status==ESCROWED)
      captured_revenue_cents= sum(grand_total_cents for Order where customer matches and payment_status==CAPTURED)
    input_set: "Customer's Orders partitioned by payment_status."
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role permitted for this endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resources exist within bureau scope, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Body FK references (customer_id, material_id, print_file_id, machine_id, spool_id, order_id, order_line_id) resolve within the same bureau"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "create endpoints with FK body fields"

  - priority: 5
    category: business_constraint
    check: "Required body fields present and well-typed (quantity >= 1, positive numerics, valid enum members)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 6
    category: state
    check: "Target resource in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 7
    category: business_safety
    check: "Quote/confirm gating: every ACTIVE line's PrintFile must be PRINTABLE; an order with zero ACTIVE lines cannot be quoted"
    error_id: "ERR_FILE_NOT_PRINTABLE / ERR_ORDER_EMPTY"
    http_status: 409
    applies_to: "POST /orders/{id}/quote"

  - priority: 8
    category: business_safety
    check: "Material/process integrity: material.status must be ACTIVE for new lines/runs; machine.process must equal line material.process; machine.status must be ONLINE to start a run"
    error_id: "ERR_MATERIAL_RETIRED / ERR_PROCESS_MISMATCH / ERR_MACHINE_OFFLINE"
    http_status: 409
    applies_to: "OrderLine create, PrintRun create, PrintRun /start"

  - priority: 9
    category: business_temporal
    check: "Machine slot half-open overlap: a new PrintRun [start,start+dur) must not overlap an existing {QUEUED,PRINTING} run on the same machine (back-to-back allowed)"
    error_id: ERR_MACHINE_SLOT_CONFLICT
    http_status: 409
    applies_to: "PrintRun create"

  - priority: 10
    category: business_temporal
    check: "Post-process station closed-interval overlap with cooldown buffer: a new FinishingTask [start,start+dur] must leave a gap > bureau.cooldown_buffer_min from any SCHEDULED task on the same station kind"
    error_id: ERR_STATION_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /finishing-tasks/{id}/schedule"

  - priority: 11
    category: business_constraint
    check: "Machine capacity: scheduled_minutes + new.duration_min must NOT exceed bureau.shift_capacity_minutes (boundary: > rejects, == allowed)"
    error_id: ERR_MACHINE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "PrintRun create"

  - priority: 12
    category: business_constraint
    check: "Spool stock: run_grams must NOT exceed spool.grams_remaining"
    error_id: ERR_SPOOL_INSUFFICIENT
    http_status: 409
    applies_to: "PrintRun create"

  - priority: 13
    category: business_fiscal
    check: "Customer wallet_balance_cents must be >= grand_total_cents to confirm; escrow top-up for reprint must be covered"
    error_id: ERR_INSUFFICIENT_WALLET
    http_status: 402
    applies_to: "POST /orders/{id}/confirm, PrintRun /fail reprint top-up"

  - priority: 14
    category: state
    check: "OCC: expected_<parent>_version must equal current parent.version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /orders/{id}/confirm, POST /orders/{id}/ship, POST /print-runs/{id}/adjudicate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Bureau (tenant root) ----
  - { method: POST, path: "/bureaus", description: "Create bureau (tenant root)", roles: [BureauAdmin], code: 201, input: [name, "cooldown_buffer_min?", "shift_capacity_minutes?"], output: Bureau, side_effects: ["clock_utc initialized to epoch 0 (1970-01-01T00:00:00.000Z)", "version=1"] }
  - { method: GET, path: "/bureaus/{bureauId}", description: "Get bureau", roles: [BureauAdmin, Operator, QAReviewer, Customer], code: 200, input: [], output: Bureau, side_effects: [] }
  - { method: POST, path: "/bureaus/{bureauId}/clock", description: "Test-driving: set bureau clock_utc", roles: [BureauAdmin], code: 200, input: [to_iso8601], output: Bureau, side_effects: ["bureau.clock_utc = to_iso8601"] }

  # ---- Customer (flat: /bureaus/customers) ----
  - { method: POST, path: "/bureaus/customers", description: "Register a customer", roles: [BureauAdmin], code: 201, input: [bureau_id, email, display_name], output: Customer, side_effects: ["wallet_balance_cents=0, escrow_held_cents=0, captured_revenue_cents=0, lifetime_deposits_cents=0"] }
  - { method: GET, path: "/bureaus/customers/{customerId}", description: "Get a customer", roles: [BureauAdmin, Operator, QAReviewer, Customer], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: GET, path: "/bureaus/customers", description: "List customers (filter by bureau_id/email)", roles: [BureauAdmin, Operator, QAReviewer], code: 200, input: ["bureau_id?", "email?"], output: "Customer[]", side_effects: [] }
  - { method: POST, path: "/bureaus/customers/{customerId}/deposit", description: "Deposit funds into wallet", roles: [BureauAdmin], code: 200, input: [amount_cents], output: Customer, side_effects: ["wallet_balance_cents += amount_cents", "lifetime_deposits_cents += amount_cents"] }

  # ---- Material ----
  - { method: POST, path: "/bureaus/materials", description: "Create a material/process spec", roles: [BureauAdmin], code: 201, input: [bureau_id, process, name, density_g_per_cm3, material_rate_cents_per_cm3, machine_rate_cents_per_min, setup_fee_cents, min_wall_thickness_mm, max_overhang_deg], output: Material, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/bureaus/materials/{materialId}", description: "Get a material", roles: [BureauAdmin, Operator, QAReviewer, Customer], code: 200, input: [], output: Material, side_effects: [] }
  - { method: GET, path: "/bureaus/materials", description: "List materials (filter by bureau_id/process/status)", roles: [BureauAdmin, Operator, QAReviewer, Customer], code: 200, input: ["bureau_id?", "process?", "status?"], output: "Material[]", side_effects: [] }
  - { method: POST, path: "/bureaus/materials/{materialId}/retire", description: "Retire a material", roles: [BureauAdmin], code: 200, input: [], output: Material, side_effects: ["status -> RETIRED"] }

  # ---- Machine ----
  - { method: POST, path: "/bureaus/machines", description: "Create a machine", roles: [BureauAdmin], code: 201, input: [bureau_id, process, label, build_x_mm, build_y_mm, build_z_mm], output: Machine, side_effects: ["status=ONLINE, scheduled_minutes=0, utilization_pct=0"] }
  - { method: GET, path: "/bureaus/machines/{machineId}", description: "Get a machine (with computed utilization)", roles: [BureauAdmin, Operator, QAReviewer], code: 200, input: [], output: Machine, side_effects: [] }
  - { method: GET, path: "/bureaus/machines", description: "List machines (filter by bureau_id/process/status)", roles: [BureauAdmin, Operator, QAReviewer], code: 200, input: ["bureau_id?", "process?", "status?"], output: "Machine[]", side_effects: [] }
  - { method: POST, path: "/bureaus/machines/{machineId}/maintenance", description: "Toggle machine maintenance status", roles: [BureauAdmin, Operator], code: 200, input: [status], output: Machine, side_effects: ["status -> MAINTENANCE | ONLINE"] }

  # ---- Spool ----
  - { method: POST, path: "/bureaus/spools", description: "Create/load a material spool", roles: [BureauAdmin, Operator], code: 201, input: [bureau_id, material_id, grams_total], output: Spool, side_effects: ["grams_committed=0, grams_consumed=0, grams_remaining=grams_total, status=LOADED"] }
  - { method: GET, path: "/bureaus/spools/{spoolId}", description: "Get a spool (with computed grams)", roles: [BureauAdmin, Operator, QAReviewer], code: 200, input: [], output: Spool, side_effects: [] }
  - { method: GET, path: "/bureaus/spools", description: "List spools (filter by bureau_id/material_id/status)", roles: [BureauAdmin, Operator, QAReviewer], code: 200, input: ["bureau_id?", "material_id?", "status?"], output: "Spool[]", side_effects: [] }

  # ---- PrintFile ----
  - { method: POST, path: "/bureaus/print-files", description: "Upload a print file (geometry summary)", roles: [Customer, BureauAdmin], code: 201, input: [bureau_id, customer_id, filename, volume_cm3, bbox_x_mm, bbox_y_mm, bbox_z_mm, min_wall_mm, max_overhang_deg, is_manifold], output: PrintFile, side_effects: ["status=UPLOADED, printability_score=null"] }
  - { method: GET, path: "/bureaus/print-files/{fileId}", description: "Get a print file", roles: [Customer, BureauAdmin, QAReviewer, Operator], code: 200, input: [], output: PrintFile, side_effects: [] }
  - { method: GET, path: "/bureaus/print-files", description: "List print files (filter by bureau_id/customer_id/checked_against_material_id/status)", roles: [Customer, BureauAdmin, QAReviewer, Operator], code: 200, input: ["bureau_id?", "customer_id?", "checked_against_material_id?", "status?"], output: "PrintFile[]", side_effects: [] }
  - { method: POST, path: "/bureaus/print-files/{fileId}/check", description: "Run printability check against a material", roles: [QAReviewer], code: 200, input: [material_id], output: PrintFile, side_effects: ["compute printability_score (calc: printability_score)", "set checked_against_material_id", "status -> PRINTABLE | FLAGGED | REJECTED"] }
  - { method: POST, path: "/bureaus/print-files/{fileId}/override", description: "QA override a FLAGGED file to PRINTABLE", roles: [QAReviewer], code: 200, input: [], output: PrintFile, side_effects: ["status FLAGGED -> PRINTABLE"] }

  # ---- Order ----
  - { method: POST, path: "/bureaus/orders", description: "Create a draft order", roles: [Customer], code: 201, input: [bureau_id, customer_id, "lead_tier?"], output: Order, side_effects: ["fulfillment_status=DRAFT, payment_status=UNPAID, all totals=0"] }
  - { method: GET, path: "/bureaus/orders/{orderId}", description: "Get an order (with computed totals)", roles: [Customer, BureauAdmin, Operator, QAReviewer], code: 200, input: [], output: Order, side_effects: [] }
  - { method: GET, path: "/bureaus/orders", description: "List orders (filter by bureau_id/customer_id/fulfillment_status/payment_status)", roles: [Customer, BureauAdmin, Operator, QAReviewer], code: 200, input: ["bureau_id?", "customer_id?", "fulfillment_status?", "payment_status?"], output: "Order[]", side_effects: [] }
  - { method: POST, path: "/bureaus/orders/{orderId}/quote", description: "Quote a draft order", roles: [Customer], code: 200, input: [], output: Order, side_effects: ["recompute totals (calc: order_totals)", "fulfillment_status -> QUOTED"] }
  - { method: POST, path: "/bureaus/orders/{orderId}/confirm", description: "Confirm & escrow a quoted order", roles: [Customer], code: 200, input: [expected_order_version], output: Order, side_effects: ["payment_status -> ESCROWED", "wallet -> escrow debit (calc: wallet_ledger)", "fulfillment_status -> CONFIRMED", "increments Order.version by 1"] }
  - { method: POST, path: "/bureaus/orders/{orderId}/ship", description: "Ship a ready order (captures escrow)", roles: [Operator], code: 200, input: [expected_order_version], output: Order, side_effects: ["fulfillment_status -> SHIPPED", "payment_status -> CAPTURED", "escrow -> captured_revenue (calc: wallet_ledger)", "Shipment -> DISPATCHED", "increments Order.version by 1"] }
  - { method: POST, path: "/bureaus/orders/{orderId}/cancel", description: "Cancel an order", roles: [Customer], code: 200, input: [], output: Order, side_effects: ["fulfillment_status -> CANCELLED", "VOID all ACTIVE lines", "CONFIRMED: refund escrow (calc: wallet_ledger), cancel QUEUED runs"] }

  # ---- OrderLine ----
  - { method: POST, path: "/bureaus/order-lines", description: "Add a line to a draft order", roles: [Customer], code: 201, input: [order_id, print_file_id, material_id, layer_height_mm, quantity], output: OrderLine, side_effects: ["compute print_minutes, per_part_cents, line_total_cents (calc: order_line_pricing)", "recompute order totals (calc: order_totals)"] }
  - { method: GET, path: "/bureaus/order-lines/{lineId}", description: "Get an order line", roles: [Customer, BureauAdmin, Operator, QAReviewer], code: 200, input: [], output: OrderLine, side_effects: [] }
  - { method: GET, path: "/bureaus/order-lines", description: "List order lines (filter by order_id/print_file_id/material_id/reprint_of_line_id/status)", roles: [Customer, BureauAdmin, Operator, QAReviewer], code: 200, input: ["bureau_id?", "order_id?", "print_file_id?", "material_id?", "reprint_of_line_id?", "status?"], output: "OrderLine[]", side_effects: [] }

  # ---- FinishingTask ----
  - { method: POST, path: "/bureaus/finishing-tasks", description: "Attach a finishing task to a line", roles: [Customer, Operator], code: 201, input: [order_line_id, kind, addon_cents, station_start_min, station_duration_min], output: FinishingTask, side_effects: ["status=PENDING", "recompute line.finishing_total_cents and order totals (calc: order_totals)"] }
  - { method: GET, path: "/bureaus/finishing-tasks/{taskId}", description: "Get a finishing task", roles: [Customer, BureauAdmin, Operator, QAReviewer], code: 200, input: [], output: FinishingTask, side_effects: [] }
  - { method: GET, path: "/bureaus/finishing-tasks", description: "List finishing tasks (filter by order_line_id/status)", roles: [Customer, BureauAdmin, Operator, QAReviewer], code: 200, input: ["bureau_id?", "order_line_id?", "status?"], output: "FinishingTask[]", side_effects: [] }
  - { method: POST, path: "/bureaus/finishing-tasks/{taskId}/schedule", description: "Schedule a finishing task on its station (closed-interval overlap check)", roles: [Operator], code: 200, input: [], output: FinishingTask, side_effects: ["status PENDING -> SCHEDULED"] }
  - { method: POST, path: "/bureaus/finishing-tasks/{taskId}/complete", description: "Mark a finishing task done", roles: [Operator], code: 200, input: [], output: FinishingTask, side_effects: ["status SCHEDULED -> DONE", "if all order tasks DONE/SKIPPED: order POST_PROCESSING -> READY (bubble-up)"] }
  - { method: POST, path: "/bureaus/finishing-tasks/{taskId}/skip", description: "Skip a PENDING/SCHEDULED finishing task", roles: [Operator], code: 200, input: [], output: FinishingTask, side_effects: ["status PENDING|SCHEDULED -> SKIPPED", "if all order tasks DONE/SKIPPED: order POST_PROCESSING -> READY (bubble-up)"] }

  # ---- PrintRun ----
  - { method: POST, path: "/bureaus/print-runs", description: "Schedule a print run for a line on a machine+spool+slot", roles: [Operator], code: 201, input: [order_line_id, machine_id, spool_id, start_min, duration_min], output: PrintRun, side_effects: ["compute run_grams (calc: spool_conservation)", "spool.grams_committed += run_grams", "recompute machine.scheduled_minutes/utilization (calc: machine_utilization)", "status=QUEUED"] }
  - { method: GET, path: "/bureaus/print-runs/{runId}", description: "Get a print run", roles: [Operator, BureauAdmin, QAReviewer, Customer], code: 200, input: [], output: PrintRun, side_effects: [] }
  - { method: GET, path: "/bureaus/print-runs", description: "List print runs (filter by order_line_id/machine_id/spool_id/status)", roles: [Operator, BureauAdmin, QAReviewer, Customer], code: 200, input: ["bureau_id?", "order_line_id?", "machine_id?", "spool_id?", "status?"], output: "PrintRun[]", side_effects: [] }
  - { method: POST, path: "/bureaus/print-runs/{runId}/start", description: "Start a queued run (machine exclusivity)", roles: [Operator], code: 200, input: [], output: PrintRun, side_effects: ["status QUEUED -> PRINTING", "recompute machine.active_minutes/active_utilization_pct (calc: machine_utilization)", "Order CONFIRMED -> IN_PRODUCTION (bubble-up)"] }
  - { method: POST, path: "/bureaus/print-runs/{runId}/complete", description: "Complete a printing run", roles: [Operator], code: 200, input: [], output: PrintRun, side_effects: ["status PRINTING -> DONE", "spool grams_committed->consumed (calc: spool_conservation)", "Order bubble to POST_PROCESSING/READY"] }
  - { method: POST, path: "/bureaus/print-runs/{runId}/fail", description: "Fail a printing run; spawn reprint line (FORWARD provisional charge)", roles: [Operator], code: 200, input: [fail_cause], output: PrintRun, side_effects: ["status PRINTING -> FAILED", "set fail_cause", "spool grams committed->consumed (waste)", "spawn reprint OrderLine (reprint_of_line_id, reprint_cause)", "reprint_attribution FORWARD charge added", "order totals + customer escrow top-up (calc: wallet_ledger)"] }
  - { method: POST, path: "/bureaus/print-runs/{runId}/adjudicate", description: "Adjudicate a failed run; finalize reprint cost (CHRONOLOGICAL) and re-queue reprint", roles: [QAReviewer], code: 200, input: [expected_run_version, machine_id, spool_id, start_min, duration_min], output: PrintRun, side_effects: ["reprint_attribution CHRONOLOGICAL finalize", "reconcile escrow delta (calc: wallet_ledger)", "create new QUEUED PrintRun for reprint line", "increments PrintRun.version by 1"] }
  - { method: POST, path: "/bureaus/print-runs/{runId}/cancel", description: "Cancel a queued run (release spool grams)", roles: [Operator], code: 200, input: [], output: PrintRun, side_effects: ["status QUEUED -> CANCELLED", "spool grams_committed released (calc: spool_conservation)", "recompute machine utilization"] }

  # ---- Shipment ----
  - { method: POST, path: "/bureaus/shipments", description: "Create a shipment for an order", roles: [Operator], code: 201, input: [order_id, carrier, tracking_number], output: Shipment, side_effects: ["status=CREATED"] }
  - { method: GET, path: "/bureaus/shipments/{shipmentId}", description: "Get a shipment", roles: [Operator, BureauAdmin, Customer], code: 200, input: [], output: Shipment, side_effects: [] }
  - { method: GET, path: "/bureaus/shipments", description: "List shipments (filter by order_id/status)", roles: [Operator, BureauAdmin, Customer], code: 200, input: ["bureau_id?", "order_id?", "status?"], output: "Shipment[]", side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted for this endpoint, or Customer acting on another customer's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource does not exist within bureau scope" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "Body FK reference does not resolve within the bureau" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/ill-typed body field, invalid enum, quantity < 1, non-positive numeric" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_ORDER_EMPTY, http: 409, condition: "Quote attempted on an order with zero ACTIVE lines" }
  - { id: ERR_FILE_NOT_PRINTABLE, http: 409, condition: "Quote/line uses a PrintFile whose status is not PRINTABLE" }
  - { id: ERR_MATERIAL_RETIRED, http: 409, condition: "New line/run references a RETIRED material" }
  - { id: ERR_PROCESS_MISMATCH, http: 409, condition: "Machine.process != line material.process on run create" }
  - { id: ERR_MACHINE_OFFLINE, http: 409, condition: "Run start/create on a MAINTENANCE machine" }
  - { id: ERR_MACHINE_BUSY, http: 409, condition: "Run start while another run on the same machine is PRINTING" }
  - { id: ERR_MACHINE_SLOT_CONFLICT, http: 409, condition: "New run interval overlaps an existing QUEUED/PRINTING run on the machine (half-open)" }
  - { id: ERR_MACHINE_CAPACITY_EXCEEDED, http: 409, condition: "scheduled_minutes + new duration exceeds bureau.shift_capacity_minutes" }
  - { id: ERR_STATION_SLOT_CONFLICT, http: 409, condition: "Finishing task interval violates cooldown buffer vs a SCHEDULED task of same kind (closed-interval)" }
  - { id: ERR_SPOOL_INSUFFICIENT, http: 409, condition: "run_grams exceeds spool.grams_remaining" }
  - { id: ERR_ORDER_NOT_ESCROWED, http: 409, condition: "Run start while owning order payment_status != ESCROWED" }
  - { id: ERR_ORDER_NOT_READY, http: 409, condition: "Ship attempted while fulfillment_status != READY" }
  - { id: ERR_NO_SHIPMENT, http: 409, condition: "Ship attempted with no CREATED Shipment for the order" }
  - { id: ERR_PRODUCTION_STARTED, http: 409, condition: "Cancel of CONFIRMED order while a run is PRINTING or DONE" }
  - { id: ERR_INSUFFICIENT_WALLET, http: 402, condition: "wallet_balance_cents < amount needed for escrow (confirm or reprint top-up)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version != current parent.version on a guarded write" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BureauAdmin
    description: "Bureau operator-admin: tenant/config setup (materials, machines, customers, deposits, retire/maintenance)."
    identity: opaque
    exclusive_operations:
      - "POST /bureaus — create bureau"
      - "POST /bureaus/{bureauId}/clock — set clock"
      - "POST /bureaus/customers — register customer"
      - "POST /bureaus/customers/{customerId}/deposit — deposit funds"
      - "POST /bureaus/materials — create material"
      - "POST /bureaus/materials/{materialId}/retire — retire material"
      - "POST /bureaus/machines — create machine"
    shared_operations:
      - "POST /bureaus/spools — load spool (with Operator)"
      - "POST /bureaus/machines/{machineId}/maintenance — toggle maintenance (with Operator)"
      - "POST /bureaus/print-files — upload file (with Customer)"
      - "GET endpoints — read access across the bureau"

  - name: Customer
    description: "End user: uploads files, builds/quotes/confirms orders, owns wallet."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /bureaus/orders — create order"
      - "POST /bureaus/order-lines — add line"
      - "POST /bureaus/orders/{orderId}/quote — quote"
      - "POST /bureaus/orders/{orderId}/confirm — confirm/escrow"
      - "POST /bureaus/orders/{orderId}/cancel — cancel"
    shared_operations:
      - "POST /bureaus/print-files — upload file (with BureauAdmin)"
      - "POST /bureaus/finishing-tasks — attach finishing task (with Operator)"
      - "GET endpoints scoped to own resources (own PrintFiles/Orders/Lines/Runs/Shipments)"

  - name: Operator
    description: "Production floor: schedules/starts/completes/fails/cancels runs, schedules finishing, ships."
    identity: opaque
    exclusive_operations:
      - "POST /bureaus/print-runs — schedule run"
      - "POST /bureaus/print-runs/{runId}/start — start run"
      - "POST /bureaus/print-runs/{runId}/complete — complete run"
      - "POST /bureaus/print-runs/{runId}/fail — fail run"
      - "POST /bureaus/print-runs/{runId}/cancel — cancel run"
      - "POST /bureaus/finishing-tasks/{taskId}/schedule — schedule finishing"
      - "POST /bureaus/finishing-tasks/{taskId}/complete — complete finishing"
      - "POST /bureaus/finishing-tasks/{taskId}/skip — skip finishing"
      - "POST /bureaus/shipments — create shipment"
      - "POST /bureaus/orders/{orderId}/ship — ship order"
    shared_operations:
      - "POST /bureaus/spools — load spool (with BureauAdmin)"
      - "POST /bureaus/machines/{machineId}/maintenance — toggle maintenance (with BureauAdmin)"
      - "POST /bureaus/finishing-tasks — attach finishing task (with Customer)"
      - "GET endpoints — read access across the bureau"

  - name: QAReviewer
    description: "Quality control: printability checks/overrides, failure-cause adjudication & reprint finalization."
    identity: opaque
    exclusive_operations:
      - "POST /bureaus/print-files/{fileId}/check — printability check"
      - "POST /bureaus/print-files/{fileId}/override — override FLAGGED to PRINTABLE"
      - "POST /bureaus/print-runs/{runId}/adjudicate — adjudicate failure & finalize reprint"
    shared_operations:
      - "GET endpoints — read access across the bureau"
