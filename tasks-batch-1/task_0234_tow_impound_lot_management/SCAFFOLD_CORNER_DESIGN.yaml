        distinguishing_aspect: "Claimant calling LotOperator-exclusive authorize-release -> ERR_FORBIDDEN_FOR_ROLE (403)."
        test_recipe:
          setup: ["Order STORED."]
          setup_api_calls:
            - call: "POST /impound-lots"
              payload: { name: "Lot RB", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
            - call: "POST /tow-orders"
              payload: { lot_id: "${lot_id}", tow_type: "POLICE", vin: "V", plate: "P", owner_name: "O", owner_address: "A" }
              as: LotOperator
              captures: { order_id: $.data.id }
            - call: "POST /tow-orders/${order_id}/inventory-items"
              payload: { category: "EXTERIOR_PHOTO", description: "d", photo_ref: "r" }
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/store"
              payload: {}
              as: LotOperator
          trigger:
            - call: "POST /tow-orders/${order_id}/authorize-release"
              payload: {}
              as: Claimant
              as_user_id: "claimant-rb"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_FOR_ROLE"

      - name: missing_user_context_header_returns_400
        claim_type: peer_roles
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Request with no X-User-Role header -> ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /tow-orders/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: NONE
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: provider_cannot_accept_others_offer
        claim_type: peer_roles
        grounds: [roles, state_machines.RotationAssignment.OFFERED_to_ACCEPTED, "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "A TowProvider whose X-User-ID != the offered provider_id cannot accept the offer -> ERR_FORBIDDEN_FOR_ROLE (403)."
        test_recipe:
          setup: ["Two providers; rank-1 is offered; rank-2 (different id) tries to accept."]
          setup_api_calls:
            - call: "POST /impound-lots"
              payload: { name: "Lot PO", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10, max_provider_concurrent_offers: 5 }
              as: LotOperator
              captures: { lot_id: $.data.id, lot_v0: $.data.version }
            - call: "POST /tow-providers"
              payload: { company_name: "P1", license_number: "L1", rotation_rank: 1 }
              as: LotOperator
              captures: { p1_id: $.data.id }
            - call: "POST /tow-providers"
              payload: { company_name: "P2", license_number: "L2", rotation_rank: 2 }
              as: LotOperator
              captures: { p2_id: $.data.id }
            - call: "POST /impound-lots/${lot_id}/dispatch-rotation"
              payload: { expected_lot_version: "${lot_v0}" }
              as: LotOperator
              captures: { ra1: $.data.id }
          trigger:
            - call: "POST /rotation-assignments/${ra1}/accept"
              payload: {}
              as: TowProvider
              as_user_id: "${p2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_FOR_ROLE"

      - name: segregation_of_duties_excluded
        claim_type: Segregation of duties
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        excluded_because:
          difficulty_instance: combinatorial_formula / waiver_credit_tier_keyed_on_pre_waiver_balance
          rationale: "Approval happens with a distinct decider id in the §1.8 waiver instance; the SoD violation is asserted directly here."

      - name: segregation_of_duties_same_user_rejected
        claim_type: Segregation of duties
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]", state_machines.FeeWaiver.UNDER_REVIEW_to_APPROVED]
        distinguishing_aspect: "FeeWaiver approve where decider X-User-ID equals filed_by_user_id -> ERR_SEGREGATION_OF_DUTIES (409)."
        test_recipe:
          setup: ["Order STORED; same user files and (after review) attempts to approve."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2028-02-01T00:00:00Z" }
              as: LotOperator
            - call: "POST /impound-lots"
              payload: { name: "Lot SD", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
            - call: "POST /tow-orders"
              payload: { lot_id: "${lot_id}", tow_type: "POLICE", vin: "V", plate: "P", owner_name: "O", owner_address: "A" }
              as: LotOperator
              captures: { order_id: $.data.id }
            - call: "POST /tow-orders/${order_id}/inventory-items"
              payload: { category: "EXTERIOR_PHOTO", description: "d", photo_ref: "r" }
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/store"
              payload: {}
              as: LotOperator
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2028-02-06T00:00:00Z" }
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/fee-waivers"
              payload: { reason: "HARDSHIP", requested_amount_cents: 1000 }
              as: Claimant
              as_user_id: "shared-user-1"
              captures: { wid: $.data.id }
            - call: "POST /tow-orders/${order_id}/fee-waivers/${wid}/start-review"
              payload: {}
              as: LotOperator
          trigger:
            - call: "POST /tow-orders/${order_id}/fee-waivers/${wid}/approve"
              payload: {}
              as: LotOperator
              as_user_id: "shared-user-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SEGREGATION_OF_DUTIES"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_dispatch_stale_lot_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[rotation-dispatch-stale-lot]", "errors[ERR_STALE_LOT_VERSION]", "validations[priority=15]"]
        distinguishing_aspect: "Two sequential dispatches: the second carrying the pre-first lot version (stale) -> ERR_STALE_LOT_VERSION (412); version advanced by the first dispatch."
        test_recipe:
          setup: ["Lot with two ACTIVE providers; capture lot version after create; first dispatch succeeds and bumps version; second dispatch reuses the stale captured version."]
          setup_api_calls:
            - call: "POST /impound-lots"
              payload: { name: "Lot OC", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10, max_provider_concurrent_offers: 5 }
              as: LotOperator
              captures: { lot_id: $.data.id, lot_v0: $.data.version }
            - call: "POST /tow-providers"
              payload: { company_name: "P1", license_number: "L1", rotation_rank: 1 }
              as: LotOperator
              captures: { p1_id: $.data.id }
            - call: "POST /tow-providers"
              payload: { company_name: "P2", license_number: "L2", rotation_rank: 2 }
              as: LotOperator
              captures: { p2_id: $.data.id }
            - call: "POST /impound-lots/${lot_id}/dispatch-rotation"
              payload: { expected_lot_version: "${lot_v0}" }
              as: LotOperator
              captures: { ra1: $.data.id }
          trigger:
            - call: "POST /impound-lots/${lot_id}/dispatch-rotation"
              payload: { expected_lot_version: "${lot_v0}" }
              as: LotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_LOT_VERSION"

      - name: occ_correct_version_succeeds_and_increments
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[rotation-dispatch-stale-lot]", entities.ImpoundLot.fields.version]
        distinguishing_aspect: "dispatch with the current lot version succeeds (201) and increments ImpoundLot.version by 1 (1 -> 2)."
        test_recipe:
          setup: ["Lot with one ACTIVE provider; lot version 1 after create."]
          setup_api_calls:
            - call: "POST /impound-lots"
              payload: { name: "Lot OK", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10, max_provider_concurrent_offers: 5 }
              as: LotOperator
              captures: { lot_id: $.data.id, lot_v0: $.data.version }
            - call: "POST /tow-providers"
              payload: { company_name: "P1", license_number: "L1", rotation_rank: 1 }
              as: LotOperator
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /impound-lots/${lot_id}/dispatch-rotation"
              payload: { expected_lot_version: "${lot_v0}" }
              as: LotOperator
              captures: { ra: $.data.id }
            - call: "GET /impound-lots/${lot_id}"
              payload: {}
              as: LotOperator
              captures: { v_after: $.data.version }
          assert:
            - "RotationAssignment.${ra}.status == OFFERED"
            - "ImpoundLot.${lot_id}.version == 2"

      - name: derived_net_due_reconciles_after_waiver_approval_excluded
        claim_type: derived_field_reconciliation
        grounds: [entities.TowOrder.fields.net_due_cents, entities.TowOrder.fields.waiver_credit_cents]
        excluded_because:
          difficulty_instance: combinatorial_formula / waiver_credit_tier_keyed_on_pre_waiver_balance
          rationale: "net_due_cents recomputation after waiver approval is asserted by the named §1.8 instance."

      - name: cascading_reoffer_chain_excluded
        claim_type: cascading_side_effects
        grounds: [state_machines.RotationAssignment.OFFERED_to_DECLINED]
        excluded_because:
          difficulty_instance: transitive_cascade / decline_cascades_reoffer_and_counter_bump
          rationale: "The decline -> re-offer -> counter-bump cascade is asserted by the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_accrual_on_read
        claim_type: immediate
        grounds: [entities.TowOrder.fields.accrued_storage_cents]
        distinguishing_aspect: "After store + clock advance, a single GET /tow-orders/{id} reflects updated accrued_storage_cents in the same request (no eventual lag)."
        test_recipe:
          setup: ["Order STORED at T0; clock advanced 5 days."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2028-03-01T00:00:00Z" }
              as: LotOperator
            - call: "POST /impound-lots"
              payload: { name: "Lot CM", jurisdiction_code: "CA", daily_storage_rate_cents: 5000, admin_fee_cents: 7500, lien_processing_fee_cents: 3000, statutory_hold_days: 30, notice_grace_days: 10 }
              as: LotOperator
              captures: { lot_id: $.data.id }
            - call: "POST /tow-orders"
              payload: { lot_id: "${lot_id}", tow_type: "POLICE", vin: "V", plate: "P", owner_name: "O", owner_address: "A" }
              as: LotOperator
              captures: { order_id: $.data.id }
            - call: "POST /tow-orders/${order_id}/inventory-items"
              payload: { category: "EXTERIOR_PHOTO", description: "d", photo_ref: "r" }
              as: LotOperator
            - call: "POST /tow-orders/${order_id}/store"
              payload: {}
              as: LotOperator
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2028-03-06T00:00:00Z" }
              as: LotOperator
          trigger:
            - call: "GET /tow-orders/${order_id}"
              payload: {}
              as: LotOperator
              captures: { accrued: $.data.accrued_storage_cents }
          assert:
            - "TowOrder.${order_id}.accrued_storage_cents == 25000"
