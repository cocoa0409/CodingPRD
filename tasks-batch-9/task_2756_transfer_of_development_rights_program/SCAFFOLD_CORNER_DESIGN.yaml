          assert:
            - "each read returns HTTP 404 with the envelope's error.code set to, in order: ERR_PARTY_NOT_FOUND, ERR_SENDING_AREA_NOT_FOUND, ERR_RECEIVING_AREA_NOT_FOUND, ERR_APPRAISAL_SCHEDULE_NOT_FOUND, ERR_SENDING_PARCEL_NOT_FOUND, ERR_SEVERANCE_APPLICATION_NOT_FOUND, ERR_CONSERVATION_EASEMENT_NOT_FOUND, ERR_CONSERVATION_EASEMENT_NOT_FOUND, ERR_CERTIFICATE_NOT_FOUND, ERR_CERTIFICATE_TRANSFER_NOT_FOUND, ERR_MARKET_TRANSACTION_NOT_FOUND, ERR_RECEIVING_SITE_APPLICATION_NOT_FOUND, ERR_CERTIFICATE_REDEMPTION_NOT_FOUND, ERR_MONITORING_INSPECTION_NOT_FOUND, ERR_PROGRAM_EVALUATION_NOT_FOUND"
            - "the sub-resource read GET /tdr/conservation-easements/{unknown}/inspections reports the PARENT's code (ERR_CONSERVATION_EASEMENT_NOT_FOUND), not an empty 200 list"
            - "every response carries data == null and a non-empty error.message; no response is 200"
            - "the same reads with a syntactically non-uuid path id also return 404 with the same code, never 400 or 500"

      - name: a_missing_or_undeclared_role_header_is_rejected_before_existence
        claim_type: violation_to_error
        grounds:
          - validations.priority_1_ERR_UNAUTHENTICATED
          - validations.priority_2_ERR_ROLE_NOT_PERMITTED
          - validations.priority_3_path_existence
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Priority 1 outranks both authorization (2) and existence (3), so a request with no X-User-Role — or with a role string absent from §1.7 such as Auditor — must return 401 ERR_UNAUTHENTICATED even when the target id also does not exist. The header-omission variants cannot be written as structured calls (a structured call must name a declared role), so they are pinned in the assertions against the identical, well-formed baseline call below."
        test_recipe:
          setup:
            - "empty database; no rows of any kind"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "GET /tdr/parties"
              payload: { limit: 10, offset: 0 }
              as: ProgramAdministrator
          assert:
            - "the baseline call with both headers present returns 200 with data == [] and meta.total_count == 0"
            - "the identical call with the X-User-Role header omitted returns 401 ERR_UNAUTHENTICATED"
            - "the identical call with X-User-Role present but empty returns 401 ERR_UNAUTHENTICATED"
            - "the identical call with the X-User-ID header omitted returns 401 ERR_UNAUTHENTICATED"
            - "the identical call with X-User-Role: Auditor (a role not declared in §1.7) returns 401 ERR_UNAUTHENTICATED, not 403 ERR_ROLE_NOT_PERMITTED"
            - "GET /tdr/parties/00000000-0000-4000-8000-000000000000 with no X-User-Role returns 401 ERR_UNAUTHENTICATED, not 404 ERR_PARTY_NOT_FOUND — priority 1 precedes priority 3"
            - "POST /tdr/parties with no X-User-Role returns 401 and creates no Party row"

      - name: sending_side_intake_and_grant_guards_each_report_their_own_code
        claim_type: violation_to_error
        grounds:
          - validations.priority_22_ERR_PARCEL_FULLY_SEVERED
          - validations.priority_35_ERR_PARCEL_HAS_OPEN_APPLICATION
          - validations.priority_46_ERR_NO_ALLOCABLE_UNITS
          - validations.priority_47_ERR_SENDING_CAP_EXHAUSTED
          - calculations.severance_allocation_grant
        distinguishing_aspect: "Four distinct refusals on the sending side, separated by WHICH bucket is empty and WHEN it is checked: a fully severed parcel is refused at intake (409, priority 22), a duplicate open filing is refused at intake (409, priority 35), an exhausted area cap is refused at the review decision (409, priority 47), and a parcel with a zero baseline is refused at the review decision (422, priority 46) — the area check precedes the min(), so an exhausted area never reports ERR_NO_ALLOCABLE_UNITS."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; one LANDOWNER party"
            - "ACTIVE SA-TIGHT with sending_cap_units 22, and ACTIVE SA-WIDE with sending_cap_units 200"
            - "parcel B in SA-TIGHT (100.00 / 22.00 / PRIME / 2) -> baseline 22, fully severed and certified for all 22 units, so SA-TIGHT.severed_units_total == 22 == its cap"
            - "parcel C in SA-TIGHT (40.00 / 0.00 / LOCAL / 0) -> baseline 10, untouched"
            - "parcel Z in SA-WIDE (40.00 / 40.00 / LOCAL / 0) -> eligible acres 0.00, so baseline_allocation_units 0 and parcel_status UNSEVERED"
