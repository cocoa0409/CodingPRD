# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3073_merchant_acquiring_program_closed_loop_network_economics
#
# Cross-references §1.1–§1.7 against the nine Difficulty Rules of SKILL.md §0.5.
# Two instances per rule → 18 instances. Every instance's test_recipe drives
# empty-DB → the stated precondition using only §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: discount_rate_provisional_vs_final_on_merchant
        grounds:
          - calculations.merchant_discount_rate
          - state_machines.Merchant.ACCEPTED_to_ACTIVE
          - entities.Merchant.fields.applied_discount_rate_bps
        distinguishing_aspect: "The merchant discount rate has a PROVISIONAL variant quoted from the merchant's current volume-tier bucket and a FINAL variant recomputed on settled volume as the volume-weighted average across negotiated tiers; they diverge once settled volume crosses a tier boundary — this instance is the rate dimension on the Merchant entity."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. High-risk USD industry category (base_discount_rate_bps=250). Merchant A created DIRECT with negotiated_rate_bps=175, accepted and activated."
            - "One settlement captured for A with gross 500000 cents and refund 100000 cents."
            - "The batch is finalized, sealing the final discount fields; the settlement is still IN_FUNDING."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "HIGH", base_discount_rate_bps: 250, high_risk_flag: true }
              as: NetworkAcquirer
              captures: { ic_usd: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_usd}", merchant_name: "Merchant A", region_code: "US-NE", acquisition_channel: "DIRECT", negotiated_rate_bps: 175 }
              as: NetworkAcquirer
              captures: { m_a_id: $.data.id, m_a_v: $.data.version }
            - call: "POST /network/merchants/${m_a_id}/accept"
              payload: { expected_merchant_version: "${m_a_v}" }
              as: NetworkAcquirer
              captures: { m_a_v2: $.data.version }
            - call: "POST /network/merchants/${m_a_id}/activate"
              payload: {}
              as: NetworkAcquirer
              captures: { m_a_v3: $.data.version }
            - call: "POST /network/merchants/${m_a_id}/settlements"
              payload: { settlement_cycle: 1, gross_volume_cents: 500000, refund_volume_cents: 100000 }
              as: NetworkSettlementOps
              captures: { s_a_id: $.data.id }
            - call: "POST /network/merchants/${m_a_id}/funding/batches/1/finalize"
              payload: {}
              as: NetworkSettlementOps
          trigger:
            - call: "GET /network/settlements/${s_a_id}"
              payload: {}
              as: NetworkSettlementOps
          assert:
            - "Settlement.${s_a_id}.post_refund_volume_cents == 400000"
            - "Settlement.${s_a_id}.final_discount_fee_cents == 8750"
            - "Settlement.${s_a_id}.net_funding_cents == 393000 (post_refund 400000 - final_discount 7000)"
            - "Settlement.${s_a_id}.discount_fee_cents (provisional, quoted from gross) == 12500 and therefore != final_discount_fee_cents"
            - "Settlement.${s_a_id}.settlement_status == IN_FUNDING and finalized_at_batch_seq == 1"

      - name: premium_value_funding_assessed_vs_disbursed_on_statement
        grounds:
          - calculations.premium_value_funding
          - state_machines.AnnualFeeStatement
          - entities.AnnualFeeStatement.fields.value_fund_allocation_cents
        distinguishing_aspect: "Premium value funding has an ASSESSED variant applying the fund share to the full gross fee and a DISBURSED variant applying it to the per-authorised-user portion only; the two differ by exactly the principal-fee share — this instance is the premium-proposition dimension on the AnnualFeeStatement entity, a different domain from the Merchant rate."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One active Platinum card member and a DRAFT annual fee statement with principal 1000000 cents, 2 authorised users at 50000 cents each."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/cardmembers"
              payload: { member_name: "Member A", card_product: "PLATINUM" }
              as: NetworkIssuer
              captures: { cm_a_id: $.data.id }
            - call: "POST /network/cardmembers/${cm_a_id}/activate"
              payload: {}
              as: NetworkIssuer
            - call: "POST /network/annual-fee-statements"
              payload: { cardmember_id: "${cm_a_id}", statement_year: 2026, principal_fee_cents: 1000000, authorised_user_count: 2, per_user_fee_cents: 50000 }
              as: NetworkIssuer
              captures: { stmt_id: $.data.id }
          trigger:
            - call: "POST /network/annual-fee-statements/${stmt_id}/assess"
              payload: {}
              as: NetworkIssuer
              captures: { stmt_id2: $.data.id }
          assert:
            - "AnnualFeeStatement.${stmt_id}.gross_fee_assessed_cents == 1100000"
            - "AnnualFeeStatement.${stmt_id}.value_fund_allocation_cents == 440000 (ASSESSED variant: 40% of the full gross fee)"
            - "the DISBURSED variant would be 40000 (40% of the per-authorised-user portion only)"
            - "annual-fee-statements.${stmt_id}.value_fund_allocation_cents - 40000 == 400000"
            - "annual-fee-statements.${stmt_id}.statement_status == ASSESSED"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes: (a) tiered, (b) rounding,
  #          (c) evaluation order)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: merchant_discount_rate_tier_selection_mode_a
        grounds:
          - calculations.merchant_discount_rate
          - entities.Merchant.fields.volume_tier
          - entities.IndustryCategory.fields.base_discount_rate_bps
        distinguishing_aspect: "Mode (a): the discount-rate formula branches on entity state (volume_tier) across three bucket rates — industry base, 75% of base, and the negotiated rate — so the output is a non-linear tier selection over ≥3 inputs rather than an arithmetic aggregation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A HIGH-risk USD category (base 250 bps) and an ACTIVITY-tier DIRECT merchant."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "HIGH", base_discount_rate_bps: 250, high_risk_flag: true }
              as: NetworkAcquirer
              captures: { ic_tier: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_tier}", merchant_name: "Tier Merchant", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_t_id: $.data.id, m_t_v: $.data.version }
          trigger:
            - call: "POST /network/merchants/${m_t_id}/accept"
              payload: { expected_merchant_version: "${m_t_v}" }
              as: NetworkAcquirer
          assert:
            - "the merchant's volume_tier == ACTIVITY at creation with applied_discount_rate_bps == 250 (the industry base)"
            - "after accept, applied_discount_rate_bps == 250 — the ACTIVITY bucket rate, not 75% of base"
            - "the FIXED bucket rate for this category is 188 (round_half_up(250 * 0.75)) and the LOW bucket rate is the negotiated rate"

      - name: settlement_discount_rounding_order_mode_b
        grounds:
          - calculations.settlement_discount_rounding
          - entities.Merchant.fields.last_batch_discount_fee_cents
          - state_machines.Settlement.CAPTURED_to_IN_FUNDING
        distinguishing_aspect: "Mode (b): nested rounding where the ORDER is pinned — round once on the batch total (sum-then-round) rather than rounding each settlement then summing; the two orders differ by cents for the same data."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A HIGH-risk USD category (base 250 bps), an ACTIVITY DIRECT merchant, accepted and activated."
            - "Two settlements each with gross 1000020 cents and refund 0 cents, captured into funding batch 1."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "HIGH", base_discount_rate_bps: 250, high_risk_flag: true }
              as: NetworkAcquirer
              captures: { ic_rnd: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_rnd}", merchant_name: "Rounding Merchant", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_r_id: $.data.id, m_r_v: $.data.version }
            - call: "POST /network/merchants/${m_r_id}/accept"
              payload: { expected_merchant_version: "${m_r_v}" }
              as: NetworkAcquirer
              captures: { m_r_v2: $.data.version }
            - call: "POST /network/merchants/${m_r_id}/activate"
              payload: {}
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_r_id}/settlements"
              payload: { settlement_cycle: 1, gross_volume_cents: 1000020, refund_volume_cents: 0 }
              as: NetworkSettlementOps
              captures: { s_r1: $.data.id }
            - call: "POST /network/merchants/${m_r_id}/settlements"
              payload: { settlement_cycle: 2, gross_volume_cents: 1000020, refund_volume_cents: 0 }
              as: NetworkSettlementOps
              captures: { s_r2: $.data.id }
          trigger:
            - call: "POST /network/merchants/${m_r_id}/funding/batches/1/finalize"
              payload: {}
              as: NetworkSettlementOps
          assert:
            - "Merchant.${m_r_id}.last_batch_discount_fee_cents == 50001 (sum-then-round: round_half_up(2000040 * 250 / 10000))"
            - "the forbidden round-then-sum order would give sum of round_half_up(1000020 * 250 / 10000) == 50002"
            - "Merchant.${m_r_id}.last_batch_discount_fee_cents != 50002"
            - "Settlement.${s_r1}.settlement_status == IN_FUNDING and Settlement.${s_r2}.settlement_status == IN_FUNDING"

      - name: dispute_outcome_points_evaluation_order_mode_c
        grounds:
          - calculations.dispute_outcome_points
          - state_machines.Dispute.MERCHANT_RESPONDED_to_WON
          - entities.CardMember.fields.reward_points_balance
        distinguishing_aspect: "Mode (c): a circular-looking dependency whose evaluation order is pinned — the gross resolution points are rounded FIRST and the rounded merchant share is subtracted SECOND; rounding the net directly is the forbidden order and drifts by one point."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One active card member and two active merchants."
            - "A dispute of 60050 cents opened by the member against merchant M1 and resolved WON in favour of the member."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "MEDIUM", base_discount_rate_bps: 250, high_risk_flag: false }
              as: NetworkAcquirer
              captures: { ic_pts: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_pts}", merchant_name: "Points Merchant 1", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_p1: $.data.id, m_p1_v: $.data.version }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_pts}", merchant_name: "Points Merchant 2", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_p2: $.data.id, m_p2_v: $.data.version }
            - call: "POST /network/merchants/${m_p1}/accept"
              payload: { expected_merchant_version: "${m_p1_v}" }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_p2}/accept"
              payload: { expected_merchant_version: "${m_p2_v}" }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_p1}/activate"
              payload: {}
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_p2}/activate"
              payload: {}
              as: NetworkAcquirer
            - call: "POST /network/cardmembers"
              payload: { member_name: "Member Points", card_product: "PLATINUM" }
              as: NetworkIssuer
              captures: { cm_pts: $.data.id }
            - call: "POST /network/cardmembers/${cm_pts}/activate"
              payload: {}
              as: NetworkIssuer
            - call: "POST /network/disputes"
              payload: { cardmember_id: "${cm_pts}", original_merchant_id: "${m_p1}", final_merchant_id: "${m_p2}", amount_cents: 60050 }
              as: CardMember
              as_user_id: "${cm_pts}"
              captures: { d_pts: $.data.id }
            - call: "POST /network/disputes/${d_pts}/respond"
              payload: {}
              as: Merchant
              as_user_id: "${m_p1}"
          trigger:
            - call: "POST /network/disputes/${d_pts}/resolve"
              payload: { outcome: "WON" }
              as: NetworkDisputeOps
          assert:
            - "Dispute.${d_pts}.dispute_status == WON"
            - "CardMember.${cm_pts}.reward_points_balance == 601 (round_half_up(60050/100) = 601, then minus round_half_up(60050*4000/10000) = 240 → 361)"
            - "CardMember.${cm_pts}.reward_points_balance == 361"
            - "MerchantRiskState.${m_p1}.rolling_chargeback_count == 0 and MerchantRiskState.${m_p2}.rolling_chargeback_count == 1"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: merchant_acceptance_cycle_closes_on_declined_attempt_plus_sweep
        grounds:
          - state_machines.Merchant.DORMANT_to_PROSPECT
          - state_machines.Merchant.ACTIVE_to_DORMANT
          - state_machines.Merchant.PROSPECT_to_ACCEPTED
        distinguishing_aspect: "A true CYCLE on the Merchant acceptance machine — ACTIVE→DORMANT→PROSPECT→ACCEPTED returns to a previously held state, and the closing hop is gated on the sweep generation equalling the merchant's status_version (a generation guard, not a time delay)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A MEDIUM USD category and a DIRECT merchant accepted and activated, then marked DORMANT."
            - "An open 30-day acceptance-gap window for region US-NE and the category, qualified PROSPECTING."
            - "A matching sweep generation stamped at the merchant's status_version."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "MEDIUM", base_discount_rate_bps: 250, high_risk_flag: false }
              as: NetworkAcquirer
              captures: { ic_cyc: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_cyc}", merchant_name: "Cycle Merchant", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_c_id: $.data.id, m_c_v: $.data.version }
            - call: "POST /network/merchants/${m_c_id}/accept"
              payload: { expected_merchant_version: "${m_c_v}" }
              as: NetworkAcquirer
              captures: { m_c_v2: $.data.version }
            - call: "POST /network/merchants/${m_c_id}/activate"
              payload: {}
              as: NetworkAcquirer
              captures: { m_c_v3: $.data.version }
            - call: "POST /network/merchants/${m_c_id}/mark-dormant"
              payload: {}
              as: NetworkAcquirer
              captures: { m_c_v4: $.data.version }
            - call: "POST /network/acceptance-gaps/rollup"
              payload: { region_code: "US-NE", industry_category_id: "${ic_cyc}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-31T00:00:00Z", window_days: 30 }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_c_id}/declined-attempts"
              payload: { card_product: "PLATINUM", attempted_amount_cents: 100000, decline_reason: "MERCHANT_NOT_ACCEPTED", occurred_at: "2026-08-10T00:00:00Z" }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_c_id}/declined-attempts"
              payload: { card_product: "PLATINUM", attempted_amount_cents: 100000, decline_reason: "MERCHANT_NOT_ACCEPTED", occurred_at: "2026-08-11T00:00:00Z" }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_c_id}/declined-attempts"
              payload: { card_product: "PLATINUM", attempted_amount_cents: 100000, decline_reason: "MERCHANT_NOT_ACCEPTED", occurred_at: "2026-08-12T00:00:00Z" }
              as: NetworkAcquirer
            - call: "POST /network/acceptance-gaps/rollup"
              payload: { region_code: "US-NE", industry_category_id: "${ic_cyc}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-31T00:00:00Z", window_days: 30 }
              as: NetworkAcquirer
            - call: "GET /network/merchants/${m_c_id}"
              payload: {}
              as: NetworkAcquirer
              captures: { m_c_sv: $.data.status_version }
            - call: "POST /network/_sweep-index/stamp"
              payload: { sweep_index: "${m_c_sv}", rolled_at: "2026-09-01T00:00:00Z" }
              as: NetworkAcquirer
          trigger:
            - call: "POST /network/merchants/${m_c_id}/declined-attempts"
              payload: { card_product: "PLATINUM", attempted_amount_cents: 250000, decline_reason: "MERCHANT_NOT_ACCEPTED", occurred_at: "2026-08-13T00:00:00Z" }
              as: NetworkAcquirer
          assert:
            - "the merchant's acceptance_status is PROSPECT again — the cycle closed"
            - "GET /network/merchants/${m_c_id} returns acceptance_status == PROSPECT"
            - "GET /network/acceptance-gaps?region_code=US-NE returns one gap with decline_count == 4 and qualified_status == PROSPECTING"
            - "a stamp whose sweep_index does NOT equal the merchant's status_version leaves the outlet DORMANT"

      - name: offer_privacy_machine_reverts_from_review_to_draft
        grounds:
          - state_machines.Offer.PRIVACY_REVIEW_to_DRAFT
          - state_machines.Offer.LIVE_to_MERCHANT_CONSENT
          - state_machines.Offer.MERCHANT_CONSENT_to_LIVE
        distinguishing_aspect: "A true CYCLE plus a revert on the Offer privacy machine — MERCHANT_CONSENT→LIVE→MERCHANT_CONSENT loops and PRIVACY_REVIEW→DRAFT rolls back to the start — on a different entity from the merchant acceptance cycle."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One active card member with trailing spend 100000; one ACTIVE merchant; an offer for the merchant at min_segment_spend_cents 10000."
            - "The offer is submitted for review, consent requested, then rolled back to DRAFT."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "MEDIUM", base_discount_rate_bps: 250, high_risk_flag: false }
              as: NetworkAcquirer
              captures: { ic_ofr: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_ofr}", merchant_name: "Offer Merchant", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_o_id: $.data.id, m_o_v: $.data.version }
            - call: "POST /network/merchants/${m_o_id}/accept"
              payload: { expected_merchant_version: "${m_o_v}" }
              as: NetworkAcquirer
              captures: { m_o_v2: $.data.version }
            - call: "POST /network/merchants/${m_o_id}/activate"
              payload: {}
              as: NetworkAcquirer
            - call: "POST /network/cardmembers"
              payload: { member_name: "Member Offer", card_product: "PLATINUM" }
              as: NetworkIssuer
              captures: { cm_o: $.data.id }
            - call: "POST /network/cardmembers/${cm_o}/activate"
              payload: {}
              as: NetworkIssuer
            - call: "POST /network/cardmembers/${cm_o}/set-monthly-spend"
              payload: { trailing_lowest_month_spend_cents: 100000 }
              as: NetworkIssuer
            - call: "POST /network/offers"
              payload: { merchant_id: "${m_o_id}", audience_segment: "HIGH_SPEND", min_segment_spend_cents: 10000, reward_bps: 1000 }
              as: NetworkDataSteward
              captures: { off_id: $.data.id, off_v: $.data.version }
            - call: "POST /network/offers/${off_id}/submit-review"
              payload: {}
              as: NetworkDataSteward
              captures: { off_v2: $.data.version }
            - call: "POST /network/offers/${off_id}/request-consent"
              payload: {}
              as: NetworkDataSteward
              captures: { off_v3: $.data.version }
          trigger:
            - call: "POST /network/offers/${off_id}/return-to-draft"
              payload: {}
              as: NetworkDataSteward
          assert:
            - "Offer.${off_id}.privacy_state == DRAFT after the revert"
            - "Offer.${off_id}.audience_size == 0 and Offer.${off_id}.aggregated_spend_cents == 0 after the revert"
            - "GET /network/offers/${off_id} returns privacy_state == DRAFT"
            - "a subsequent GET /network/offers/${off_id} shows version advanced by exactly one from the pre-revert version"

  # ===========================================================================
  # Rule 4 — transitive_cascade (depth ≥3 and depth ≥2, different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: dispute_loss_cascade_depth3
        grounds:
          - state_machines.Dispute.MERCHANT_RESPONDED_to_LOST
          - state_machines.Dispute.AUTO_ACCEPTED_to_LOST
          - entities.Dispute.fields.representment_stage
        distinguishing_aspect: "Depth-3 cascade: LOST on the dispute (hop 1) flips representment_stage NONE→FIRST_ROUND (hop 2), which is the pre-condition on which the charged-back merchant's rolling chargeback count folds into its suppression flag (hop 3) — each hop caused by the previous, not by the resolve call."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE merchant and an active card member; three disputes each 100000 cents against the merchant, all responded and then resolved LOST."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "MEDIUM", base_discount_rate_bps: 250, high_risk_flag: false }
              as: NetworkAcquirer
              captures: { ic_cas: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_cas}", merchant_name: "Cascade Merchant", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_k_id: $.data.id, m_k_v: $.data.version }
            - call: "POST /network/merchants/${m_k_id}/accept"
              payload: { expected_merchant_version: "${m_k_v}" }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_k_id}/activate"
              payload: {}
              as: NetworkAcquirer
            - call: "POST /network/cardmembers"
              payload: { member_name: "Member Cascade", card_product: "PLATINUM" }
              as: NetworkIssuer
              captures: { cm_k: $.data.id }
            - call: "POST /network/cardmembers/${cm_k}/activate"
              payload: {}
              as: NetworkIssuer
            - call: "POST /network/disputes"
              payload: { cardmember_id: "${cm_k}", original_merchant_id: "${m_k_id}", final_merchant_id: "${m_k_id}", amount_cents: 100000 }
              as: CardMember
              as_user_id: "${cm_k}"
              captures: { d_k1: $.data.id }
            - call: "POST /network/disputes"
              payload: { cardmember_id: "${cm_k}", original_merchant_id: "${m_k_id}", final_merchant_id: "${m_k_id}", amount_cents: 100000 }
              as: CardMember
              as_user_id: "${cm_k}"
              captures: { d_k2: $.data.id }
            - call: "POST /network/disputes"
              payload: { cardmember_id: "${cm_k}", original_merchant_id: "${m_k_id}", final_merchant_id: "${m_k_id}", amount_cents: 100000 }
              as: CardMember
              as_user_id: "${cm_k}"
              captures: { d_k3: $.data.id }
          trigger:
            - call: "POST /network/disputes/${d_k1}/respond"
              payload: {}
              as: Merchant
              as_user_id: "${m_k_id}"
            - call: "POST /network/disputes/${d_k1}/resolve"
              payload: { outcome: "LOST" }
              as: NetworkDisputeOps
              captures: { d_k1_after: $.data.id }
          assert:
            - "Dispute.${d_k1}.dispute_status == LOST (hop 1)"
            - "Dispute.${d_k1}.representment_stage == FIRST_ROUND (hop 2 — derived from hop 1)"
            - "a second LOST resolve is rejected with ERR_INVALID_STATE because the dispute is terminal"
            - "on the same merchant, GET /network/merchants/${m_k_id}/risk-state shows unresolved_chargeback_count that only decreases after all three disputes reach a terminal WON/LOST state"

      - name: payment_reversal_cascade_depth2
        grounds:
          - state_machines.Merchant.ACTIVE_to_SUPPRESSED
          - state_machines.Settlement.IN_FUNDING_to_REVERSED
          - entities.Offer.fields.privacy_state
        distinguishing_aspect: "Depth-2 cascade originating from a DIFFERENT trigger than the dispute cascade: suppressing a merchant (hop 1) terminates its offers (hop 2a) and reverses its unhealthy settlements (hop 2b), each caused by the suppression rather than by the request that suppressed."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A HIGH-risk USD category (250 bps), a DIRECT merchant accepted and activated, and two settlements each gross 500000 refund 0 (batch sequence 1 and 2)."
            - "The second settlement's batch is finalized so settlement 1 is IN_FUNDING; the merchant's rolling chargeback count is at 2 (below the ceiling of 2 means not yet over)."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "HIGH", base_discount_rate_bps: 250, high_risk_flag: true }
              as: NetworkAcquirer
              captures: { ic_cas2: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_cas2}", merchant_name: "Cascade Merchant 2", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_k2_id: $.data.id, m_k2_v: $.data.version }
            - call: "POST /network/merchants/${m_k2_id}/accept"
              payload: { expected_merchant_version: "${m_k2_v}" }
              as: NetworkAcquirer
              captures: { m_k2_v2: $.data.version }
            - call: "POST /network/merchants/${m_k2_id}/activate"
              payload: {}
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_k2_id}/settlements"
              payload: { settlement_cycle: 1, gross_volume_cents: 500000, refund_volume_cents: 0 }
              as: NetworkSettlementOps
              captures: { s_k1: $.data.id }
            - call: "POST /network/merchants/${m_k2_id}/settlements"
              payload: { settlement_cycle: 2, gross_volume_cents: 500000, refund_volume_cents: 0 }
              as: NetworkSettlementOps
              captures: { s_k2: $.data.id }
            - call: "POST /network/merchants/${m_k2_id}/funding/batches/2/finalize"
              payload: {}
              as: NetworkSettlementOps
          trigger:
            - call: "POST /network/merchants/${m_k2_id}/suppress"
              payload: {}
              as: NetworkCompliance
          assert:
            - "Merchant.${m_k2_id}.acceptance_status == SUPPRESSED (hop 1)"
            - "Settlement.${s_k1}.settlement_status == REVERSED (hop 2a — caused by the suppression)"
            - "Settlement.${s_k2}.settlement_status == REVERSED (hop 2b)"
            - "Settlement.${s_k1}.net_funding_cents == 0 and Settlement.${s_k1}.final_discount_fee_cents == 0 after reversal"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: activation_risk_flag_beats_invalid_state
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - state_machines.Merchant.ACCEPTED_to_ACTIVE
        distinguishing_aspect: "Category pair (business_constraint vs state): a DORMANT merchant with a set suppression flag fails BOTH the risk check (priority 7) and the state check (priority 8); the lower-numbered business_constraint error wins."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A MEDIUM USD category, a DIRECT merchant accepted, activated then marked DORMANT."
            - "Two open disputes on the merchant push its unresolved_chargeback_count to the suppression threshold."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "MEDIUM", base_discount_rate_bps: 250, high_risk_flag: false }
              as: NetworkAcquirer
              captures: { ic_pri: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_pri}", merchant_name: "Priority Merchant", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_pri: $.data.id, m_pri_v: $.data.version }
            - call: "POST /network/merchants/${m_pri}/accept"
              payload: { expected_merchant_version: "${m_pri_v}" }
              as: NetworkAcquirer
              captures: { m_pri_v2: $.data.version }
            - call: "POST /network/merchants/${m_pri}/activate"
              payload: {}
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_pri}/mark-dormant"
              payload: {}
              as: NetworkAcquirer
            - call: "POST /network/cardmembers"
              payload: { member_name: "Member Priority", card_product: "PLATINUM" }
              as: NetworkIssuer
              captures: { cm_pri: $.data.id }
            - call: "POST /network/cardmembers/${cm_pri}/activate"
              payload: {}
              as: NetworkIssuer
            - call: "POST /network/disputes"
              payload: { cardmember_id: "${cm_pri}", original_merchant_id: "${m_pri}", final_merchant_id: "${m_pri}", amount_cents: 100000 }
              as: CardMember
              as_user_id: "${cm_pri}"
            - call: "POST /network/disputes"
              payload: { cardmember_id: "${cm_pri}", original_merchant_id: "${m_pri}", final_merchant_id: "${m_pri}", amount_cents: 100000 }
              as: CardMember
              as_user_id: "${cm_pri}"
          trigger:
            - call: "POST /network/merchants/${m_pri}/activate"
              payload: {}
              as: NetworkAcquirer
              captures: { err_pri: $.data.error_id }
          assert:
            - "the response status is 409 and the error_id is ERR_MERCHANT_RISK_SUPPRESSED (priority 7)"
            - "the returned error_id is NOT ERR_INVALID_STATE (priority 8) even though the merchant is DORMANT"

      - name: pool_fiscal_check_beats_privacy_quorum
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors.ERR_POOL_INSUFFICIENT_RESERVE
        distinguishing_aspect: "Category pair (business_fiscal vs business_constraint): accepting on a non-live offer whose pool is also unfunded fails both the fiscal pool check (priority 5) and the privacy/data-sharing check (priority 6); the fiscal error wins."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE merchant, an active card member, and a DRAFT offer with an unfunded redemption pool."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "MEDIUM", base_discount_rate_bps: 250, high_risk_flag: false }
              as: NetworkAcquirer
              captures: { ic_pri2: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_pri2}", merchant_name: "Priority Merchant 2", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_pri2: $.data.id, m_pri2_v: $.data.version }
            - call: "POST /network/merchants/${m_pri2}/accept"
              payload: { expected_merchant_version: "${m_pri2_v}" }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_pri2}/activate"
              payload: {}
              as: NetworkAcquirer
            - call: "POST /network/cardmembers"
              payload: { member_name: "Member Priority 2", card_product: "PLATINUM" }
              as: NetworkIssuer
              captures: { cm_pri2: $.data.id }
            - call: "POST /network/cardmembers/${cm_pri2}/activate"
              payload: {}
              as: NetworkIssuer
            - call: "POST /network/cardmembers/${cm_pri2}/set-monthly-spend"
              payload: { trailing_lowest_month_spend_cents: 100000 }
              as: NetworkIssuer
            - call: "POST /network/offers"
              payload: { merchant_id: "${m_pri2}", audience_segment: "HIGH_SPEND", min_segment_spend_cents: 10000, reward_bps: 1000 }
              as: NetworkDataSteward
              captures: { off_pri: $.data.id }
            - call: "POST /network/offers/${off_pri}/redemption-pool"
              payload: { funder: "MERCHANT", initial_funded_cents: 0 }
              as: NetworkDataSteward
          trigger:
            - call: "POST /network/offers/${off_pri}/accept"
              payload: { cardmember_id: "${cm_pri2}", trigger_amount_cents: 100000 }
              as: CardMember
              as_user_id: "${cm_pri2}"
              captures: { err_pri2: $.data.error_id }
          assert:
            - "the response status is 402 and the error_id is ERR_POOL_INSUFFICIENT_RESERVE (priority 5)"
            - "the returned error_id is NOT ERR_PRIVACY_VIOLATION (priority 6) even though the offer is not LIVE"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: acceptance_gap_qualifies_exactly_at_decline_minimum
        grounds:
          - calculations.acceptance_gap_window
          - entities.AcceptanceGap.fields.qualified_status
          - endpoints.POST_/network/acceptance-gaps/rollup
        distinguishing_aspect: "Numeric threshold crossing: decline_count 2 yields BELOW_THRESHOLD, decline_count exactly 3 yields PROSPECTING (>=, not >) — reached through the rollup endpoint, a different metric from the dispute priority boundary."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A MEDIUM USD category and a merchant in region US-NE."
            - "Two MERCHANT_NOT_ACCEPTED declines recorded inside the window and rolled up."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "MEDIUM", base_discount_rate_bps: 250, high_risk_flag: false }
              as: NetworkAcquirer
              captures: { ic_bnd: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_bnd}", merchant_name: "Boundary Merchant", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_bnd: $.data.id }
            - call: "POST /network/acceptance-gaps/rollup"
              payload: { region_code: "US-NE", industry_category_id: "${ic_bnd}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-31T00:00:00Z", window_days: 30 }
              as: NetworkAcquirer
              captures: { gap_bnd: $.data.id }
            - call: "POST /network/merchants/${m_bnd}/declined-attempts"
              payload: { card_product: "PLATINUM", attempted_amount_cents: 100000, decline_reason: "MERCHANT_NOT_ACCEPTED", occurred_at: "2026-08-10T00:00:00Z" }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_bnd}/declined-attempts"
              payload: { card_product: "PLATINUM", attempted_amount_cents: 100000, decline_reason: "MERCHANT_NOT_ACCEPTED", occurred_at: "2026-08-11T00:00:00Z" }
              as: NetworkAcquirer
            - call: "POST /network/acceptance-gaps/rollup"
              payload: { region_code: "US-NE", industry_category_id: "${ic_bnd}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-31T00:00:00Z", window_days: 30 }
              as: NetworkAcquirer
          trigger:
            - call: "POST /network/merchants/${m_bnd}/declined-attempts"
              payload: { card_product: "PLATINUM", attempted_amount_cents: 100000, decline_reason: "MERCHANT_NOT_ACCEPTED", occurred_at: "2026-08-12T00:00:00Z" }
              as: NetworkAcquirer
            - call: "POST /network/acceptance-gaps/rollup"
              payload: { region_code: "US-NE", industry_category_id: "${ic_bnd}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-31T00:00:00Z", window_days: 30 }
              as: NetworkAcquirer
          assert:
            - "with two declines the gap's qualified_status == BELOW_THRESHOLD and decline_count == 2 (observed mid-chain)"
            - "after the third decline and a re-rollup the gap's decline_count == 3 and qualified_status == PROSPECTING (>= 3, not > 3)"
            - "the gap's declined_volume_cents == 300000"

      - name: dispute_priority_crosses_at_exact_amount
        grounds:
          - endpoints.POST_/network/disputes
          - entities.Dispute.fields.priority
          - entities.Dispute.fields.amount_cents
        distinguishing_aspect: "Numeric threshold on a different metric/endpoint: dispute priority is STANDARD at 49999 cents and HIGH at exactly 50000 (>=, not >), reached through the dispute-creation endpoint rather than the rollup endpoint."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE merchant, an active card member, and a dispute of 49999 cents."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "MEDIUM", base_discount_rate_bps: 250, high_risk_flag: false }
              as: NetworkAcquirer
              captures: { ic_bnd2: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_bnd2}", merchant_name: "Boundary Merchant 2", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_bnd2: $.data.id, m_bnd2_v: $.data.version }
            - call: "POST /network/merchants/${m_bnd2}/accept"
              payload: { expected_merchant_version: "${m_bnd2_v}" }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_bnd2}/activate"
              payload: {}
              as: NetworkAcquirer
            - call: "POST /network/cardmembers"
              payload: { member_name: "Member Boundary", card_product: "PLATINUM" }
              as: NetworkIssuer
              captures: { cm_bnd: $.data.id }
            - call: "POST /network/cardmembers/${cm_bnd}/activate"
              payload: {}
              as: NetworkIssuer
            - call: "POST /network/disputes"
              payload: { cardmember_id: "${cm_bnd}", original_merchant_id: "${m_bnd2}", final_merchant_id: "${m_bnd2}", amount_cents: 49999 }
              as: CardMember
              as_user_id: "${cm_bnd}"
              captures: { d_bnd_lo: $.data.id }
          trigger:
            - call: "POST /network/disputes"
              payload: { cardmember_id: "${cm_bnd}", original_merchant_id: "${m_bnd2}", final_merchant_id: "${m_bnd2}", amount_cents: 50000 }
              as: CardMember
              as_user_id: "${cm_bnd}"
              captures: { d_bnd_hi: $.data.id }
          assert:
            - "Dispute.${d_bnd_lo}.priority == STANDARD"
            - "Dispute.${d_bnd_hi}.priority == HIGH (50000 is >= the 50000 boundary)"
            - "Dispute.${d_bnd_lo}.amount_cents == 49999 and Dispute.${d_bnd_hi}.amount_cents == 50000"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: offer_lifecycle_gated_by_merchant_acceptance_state
        grounds:
          - state_machines.Offer.MERCHANT_CONSENT_to_LIVE
          - state_machines.Merchant.ACTIVE_to_SUPPRESSED
          - validations[priority=8]
        distinguishing_aspect: "Pair (Offer → Merchant): the offer's MERCHANT_CONSENT→LIVE transition requires its funding Merchant to be ACTIVE, and suppressing the merchant terminates the offer so no later offer transition succeeds — a different entity pair from the settlement→merchant dependency."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Merchant M1 ACTIVE, merchant M2 only PROSPECT, an active card member with trailing spend 100000."
