            - call: "POST /participant-pools/${pool_id}/participants"
              payload: { external_ref: "P-001", segment: "POWER_USER", locale: "en-US", pii_on_file: false }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
              captures: { p1_id: $.data.id }
            - call: "POST /participant-pools/${pool_id}/participants"
