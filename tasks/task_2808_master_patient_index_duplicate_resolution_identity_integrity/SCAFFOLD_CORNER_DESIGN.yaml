          trigger:
            - call: "POST /mpi/candidate-pairs/${pair_s3_id}/return-to-review"
              payload: { triage_note: "Trying to reopen a terminal pair." }
              as: IdentityStewardApprover
              as_user_id: "steward-1"
            - call: "POST /mpi/candidate-pairs/${pair_s3_id}/triage"
              payload: { triage_note: "Trying to re-triage a terminal pair." }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
          assert:
            - "${pair_s3_final_state} == \"RESOLVED_DISTINCT\" and ${pair_s3_final_version} == 7"
            - "Before the triggers: DuplicateCandidatePair.${pair_s3_id}.recommendation == DISTINCT, recommended_by_user_id == \"analyst-1\" and approved_by_user_id == \"steward-1\""
            - "Before the triggers: evidence_points == -5.00, evidence_adjustment == -5.00, effective_score == 65.00, base_band == P2, priority_band == P3"
            - "First trigger call: HTTP 409 with $.data.error_id == \"ERR_PAIR_INVALID_STATE\""
            - "Second trigger call: HTTP 409 with $.data.error_id == \"ERR_PAIR_INVALID_STATE\""
            - "After both triggers: DuplicateCandidatePair.${pair_s3_id}.queue_state == RESOLVED_DISTINCT and version == 7"

      - name: start_review_twice_returns_pair_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.DuplicateCandidatePair.TRIAGED_to_UNDER_REVIEW
          - validations[priority=26]
        distinguishing_aspect: "start-review is not idempotent by design: the second call finds queue_state UNDER_REVIEW, which is not a declared from: state for that transition, so it returns 409 ERR_PAIR_INVALID_STATE and leaves the version at 3."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-S4, one MatchRuleSet RS-BASE, and two PatientRecord rows scoring STRICT 70.00 so the pair starts NEW."
