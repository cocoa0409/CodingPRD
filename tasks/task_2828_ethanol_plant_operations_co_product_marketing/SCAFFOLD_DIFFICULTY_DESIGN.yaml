  - rule_id: boundary_precision_check
    instances:

      - name: health_index_exactly_seventy_stays_fermenting
        grounds:
          - calculations.fermentation_health_index
          - calculations.batch_yield
          - state_machines.FermentationBatch.status.FERMENTING_to_DISTILLING
          - entities.FermentationBatch.fields.fermentation_health_index
        distinguishing_aspect: |
          HEALTH_WATCH_THRESHOLD is strict: a weighted index of exactly 70.00
          leaves the batch FERMENTING and therefore distillable, and the yield
          ladder reads that same 70.00 as the >= 60.00 tier, fixing
          effective_yield_gal_per_bushel at 2.700.
        test_recipe:
          setup:
            - "Plant exists with base_grind_cap_bushels 120000 and coverage_floor_bushels 5000."
            - "Tank T-101 is an ETHANOL_200_PROOF tank; contract C-1 is PRICED with one settled 940.00-bushel delivery."
            - "Batch FB-5001 is charged with 900.00 bushels at charge test weight 54.0 (so starch_bonus is 0.000)."
            - "Two readings exist: hours_elapsed 12 with lactic 1367 / acetic 322 / 35.0 C (score 71.57) and hours_elapsed 24 with lactic 870 / acetic 443 / 29.0 C (score 71.48), leaving the index at 71.51."
