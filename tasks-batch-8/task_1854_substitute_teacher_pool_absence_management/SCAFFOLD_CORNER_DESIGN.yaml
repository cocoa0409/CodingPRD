          assert:
            - "First extend: error_id == ERR_LONG_TERM_APPROVAL_REQUIRED (would reach 6 days > 5)"
            - "After review APPROVE (NOT_REQUIRED -> APPROVED), extend succeeds: scheduled_days == 6, provisional_pay_cents == 120000"
            - "School committed == 120000 (delta +60000 applied to the existing commitment)"
            - "Absence.${abs1}.end_date == 2026-08-10 and total_days == 6"

      - name: budget_insufficient_blocks_accept
        claim_type: violation_to_error
        grounds:
          - validations[priority=19]
          - errors[ERR_COVERAGE_BUDGET_INSUFFICIENT]
        distinguishing_aspect: "Fiscal layer: a school with 1 cent of budget can host the offer but the accept fails with 402 ERR_COVERAGE_BUDGET_INSUFFICIENT and the assignment stays OFFERED."
