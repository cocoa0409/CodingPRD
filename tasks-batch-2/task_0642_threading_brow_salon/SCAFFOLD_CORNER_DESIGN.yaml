scaffold_corner_design:
- section: entities
  instances:
  - name: create_salon_returns_201_with_system_fields
    claim_type: Creation
    grounds:
    - entities.Salon
    - endpoints
    distinguishing_aspect: POST /salons with all required fields -> 201; status=CLOSED, active_occupancy_count=0, version=1, id/created_at minted.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /salon-svc/salons
        payload:
          name: Brow Bar
          license_number: LIC-C1
          license_expiry: '2027-01-01T00:00:00Z'
        as: SalonManager
        captures:
          salon_id: $.data.id
          st: $.data.status
          occ: $.data.active_occupancy_count
          v: $.data.version
      assert:
      - response.http_status == 201
      - Salon.${salon_id}.status == CLOSED
      - Salon.${salon_id}.active_occupancy_count == 0
      - Salon.${salon_id}.version == 1
  - name: get_salon_not_found
    claim_type: Not Found
    grounds:
    - entities.Salon
    - errors[ERR_SALON_NOT_FOUND]
    distinguishing_aspect: GET /salons/{random-uuid} -> ERR_SALON_NOT_FOUND (404).
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: GET /salon-svc/salons/00000000-0000-4000-8000-000000000000
        payload: {}
        as: SalonManager
        captures:
          err: $.data.error_id
      assert:
      - response.error_id == ERR_SALON_NOT_FOUND
      - response.http_status == 404
  - name: create_salon_missing_required_field_returns_validation
    claim_type: Required Fields
    grounds:
    - entities.Salon.fields.license_number
    - errors[ERR_VALIDATION]
    distinguishing_aspect: POST /salons without license_number -> ERR_VALIDATION (422).
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /salon-svc/salons
        payload:
          name: Brow Bar
          license_expiry: '2027-01-01T00:00:00Z'
        as: SalonManager
        captures:
          err: $.data.error_id
      assert:
      - response.error_id == ERR_VALIDATION
      - response.http_status == 422
  - name: salon_default_loyalty_earn_rate_applied
    claim_type: Defaults
    grounds:
    - entities.Salon.fields.loyalty_earn_rate_bps
    distinguishing_aspect: Omitting loyalty_earn_rate_bps applies default 500.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /salon-svc/salons
        payload:
          name: Brow Bar
          license_number: LIC-C2
          license_expiry: '2027-01-01T00:00:00Z'
        as: SalonManager
        captures:
          salon_id: $.data.id
      assert:
      - Salon.${salon_id}.loyalty_earn_rate_bps == 500
  - name: list_salons_pagination_envelope
    claim_type: Listing
    grounds:
    - entities.Salon
    - endpoints
    distinguishing_aspect: GET /salons returns paginated array with total_count and has_more in meta.
    test_recipe:
      setup:
      - two salons created
      setup_api_calls:
      - call: POST /salon-svc/salons
        payload:
          name: S1
          license_number: LIC-C3
          license_expiry: '2027-01-01T00:00:00Z'
        as: SalonManager
      - call: POST /salon-svc/salons
        payload:
          name: S2
          license_number: LIC-C4
          license_expiry: '2027-01-01T00:00:00Z'
        as: SalonManager
      trigger:
      - call: GET /salon-svc/salons
        payload:
          limit: 1
          offset: 0
        as: SalonManager
      assert:
      - response.total_count == 2
      - response.has_more == true
      - len(response.data) == 1
  - name: member_loyalty_balance_computed_input_ignored
    claim_type: Computed Fields
    grounds:
    - entities.Member.fields.loyalty_balance
    distinguishing_aspect: Member loyalty_balance is computed (starts 0); not a client input on member create.
    test_recipe:
      setup:
      - salon created
      setup_api_calls:
      - call: POST /salon-svc/salons
        payload:
          name: S
          license_number: LIC-C5
          license_expiry: '2027-01-01T00:00:00Z'
        as: SalonManager
        captures:
          salon_id: $.data.id
      trigger:
      - call: POST /salon-svc/members
        payload:
          salon_id: ${salon_id}
          full_name: M
          phone: 555-C001
        as: FrontDeskAgent
        captures:
          member_id: $.data.id
      assert:
      - Member.${member_id}.loyalty_balance == 0
      - Member.${member_id}.no_show_strikes == 0
      - Member.${member_id}.status == ACTIVE
  - name: duplicate_member_phone_within_salon_rejected
    claim_type: Type Constraints
    grounds:
    - validations[priority=20]
    - errors[ERR_DUPLICATE_RESOURCE]
    distinguishing_aspect: Second member with same phone in same salon -> ERR_DUPLICATE_RESOURCE (409).
    test_recipe:
      setup:
      - salon with one member phone 555-C010
      setup_api_calls:
      - call: POST /salon-svc/salons
        payload:
          name: S
          license_number: LIC-C6
          license_expiry: '2027-01-01T00:00:00Z'
        as: SalonManager
        captures:
          salon_id: $.data.id
      - call: POST /salon-svc/members
        payload:
          salon_id: ${salon_id}
          full_name: A
          phone: 555-C010
        as: FrontDeskAgent
      trigger:
      - call: POST /salon-svc/members
        payload:
          salon_id: ${salon_id}
          full_name: B
          phone: 555-C010
        as: FrontDeskAgent
        captures:
          err: $.data.error_id
      assert:
      - response.error_id == ERR_DUPLICATE_RESOURCE
      - response.http_status == 409
  - name: loyalty_ledger_entry_immutable_no_version
    claim_type: Immutability
    grounds:
    - entities.LoyaltyLedgerEntry
    distinguishing_aspect: LoyaltyLedgerEntry has common_fields:false — append-only, no update endpoint, carries only id+created_at+member_id+entry_type+points.
    test_recipe:
      setup:
      - salon, member, manager loyalty adjustment of +50
      setup_api_calls:
      - call: POST /salon-svc/salons
        payload:
          name: S
          license_number: LIC-C7
          license_expiry: '2027-01-01T00:00:00Z'
        as: SalonManager
        captures:
          salon_id: $.data.id
      - call: POST /salon-svc/members
        payload:
          salon_id: ${salon_id}
          full_name: M
          phone: 555-C011
        as: FrontDeskAgent
        captures:
          member_id: $.data.id
      trigger:
      - call: POST /salon-svc/members/${member_id}/loyalty-adjustments
        payload:
          points: 50
        as: SalonManager
        captures:
          entry_id: $.data.id
          et: $.data.entry_type
          pts: $.data.points
      assert:
      - LoyaltyLedgerEntry.${entry_id}.entry_type == ADJUSTMENT
      - LoyaltyLedgerEntry.${entry_id}.points == 50
      - Member.${member_id}.loyalty_balance == 50
- section: state_machines
  instances:
  - name: open_salon_initial_state_closed
    claim_type: Initial State
    grounds:
    - state_machines.Salon
    - entities.Salon.fields.status
    distinguishing_aspect: Newly created salon is CLOSED (initial_state).
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /salon-svc/salons
        payload:
          name: S
          license_number: LIC-C8
          license_expiry: '2027-01-01T00:00:00Z'
        as: SalonManager
        captures:
          salon_id: $.data.id
      assert:
      - Salon.${salon_id}.status == CLOSED
  - name: open_salon_valid_transition_bumps_version
    claim_type: Valid Transition
    grounds:
    - state_machines.Salon.CLOSED_to_OPEN
    - entities.Salon.fields.version
    distinguishing_aspect: POST /salons/{id}/open with correct expected_salon_version -> OPEN; version increments 1->2.
    test_recipe:
      setup:
      - CLOSED salon, license valid
      setup_api_calls:
      - call: POST /salon-svc/salons
        payload:
          name: S
          license_number: LIC-C9
          license_expiry: '2027-01-01T00:00:00Z'
        as: SalonManager
        captures:
          salon_id: $.data.id
          sv0: $.data.version
      trigger:
      - call: POST /salon-svc/salons/${salon_id}/open
        payload:
          expected_salon_version: ${sv0}
        as: SalonManager
        captures:
          v: $.data.version
      assert:
      - Salon.${salon_id}.status == OPEN
      - Salon.${salon_id}.version == 2
  - name: open_salon_with_lapsed_license_rejected
    claim_type: Precondition Enforcement
    grounds:
    - state_machines.Salon.CLOSED_to_OPEN
    - validations[priority=7]
    - errors[ERR_LICENSE_LAPSED]
    distinguishing_aspect: Opening a salon whose license_expiry is in the past -> ERR_LICENSE_LAPSED (403).
    test_recipe:
      setup:
      - salon with license_expiry 2026-01-15; clock advanced past it
      setup_api_calls:
      - call: POST /salon-svc/salons
        payload:
          name: S
          license_number: LIC-C10
          license_expiry: '2026-01-15T00:00:00Z'
        as: SalonManager
        captures:
          salon_id: $.data.id
          sv0: $.data.version
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-02-01T00:00:00Z'
        as: SalonManager
      trigger:
      - call: POST /salon-svc/salons/${salon_id}/open
        payload:
          expected_salon_version: ${sv0}
        as: SalonManager
        captures:
          err: $.data.error_id
      assert:
      - response.error_id == ERR_LICENSE_LAPSED
      - response.http_status == 403
  - name: open_already_open_salon_rejected_invalid_from
    claim_type: Invalid Transitions
    grounds:
    - state_machines.Salon.CLOSED_to_OPEN
    - errors[ERR_STALE_SALON_VERSION]
    distinguishing_aspect: Re-opening an OPEN salon with the stale pre-open version -> ERR_STALE_SALON_VERSION (412) because version already advanced.
    test_recipe:
      setup:
      - OPEN salon (opened once)
      setup_api_calls:
      - call: POST /salon-svc/salons
        payload:
          name: S
          license_number: LIC-C11
          license_expiry: '2027-01-01T00:00:00Z'
        as: SalonManager
        captures:
          salon_id: $.data.id
          sv0: $.data.version
      - call: POST /salon-svc/salons/${salon_id}/open
        payload:
          expected_salon_version: ${sv0}
        as: SalonManager
      trigger:
      - call: POST /salon-svc/salons/${salon_id}/open
        payload:
          expected_salon_version: ${sv0}
        as: SalonManager
        captures:
          err: $.data.error_id
      assert:
      - response.error_id == ERR_STALE_SALON_VERSION
      - response.http_status == 412
  - name: close_salon_with_active_visit_rejected
    claim_type: Precondition Enforcement
    grounds:
    - state_machines.Salon.OPEN_to_CLOSED
    - validations[priority=17]
    - errors[ERR_SALON_HAS_ACTIVE_VISITS]
    distinguishing_aspect: Closing a salon with an OCCUPIED chair (active_occupancy_count>0) -> ERR_SALON_HAS_ACTIVE_VISITS (409).
    test_recipe:
      setup:
      - OPEN salon with one IN_SERVICE visit (occupancy=1)
      setup_api_calls:
      - call: POST /salon-svc/salons
        payload:
          name: S
          license_number: LIC-C12
          license_expiry: '2027-01-01T00:00:00Z'
        as: SalonManager
        captures:
          salon_id: $.data.id
          sv0: $.data.version
      - call: POST /salon-svc/salons/${salon_id}/open
        payload:
          expected_salon_version: ${sv0}
        as: SalonManager
        captures:
          sv1: $.data.version
      - call: POST /salon-svc/chairs
        payload:
          salon_id: ${salon_id}
          label: Bar 1
        as: SalonManager
        captures:
          chair_id: $.data.id
      - call: POST /salon-svc/technicians
        payload:
          salon_id: ${salon_id}
          display_name: T
          sanitation_cert_expiry: '2027-01-01T00:00:00Z'
        as: SalonManager
        captures:
          tech_id: $.data.id
      - call: POST /salon-svc/service-menu-items
        payload:
          salon_id: ${salon_id}
          code: BROW_THREAD
          name: Threading
          base_price_cents: 2000
          est_minutes: 15
        as: SalonManager
        captures:
          svc_id: $.data.id
      - call: POST /salon-svc/members
        payload:
          salon_id: ${salon_id}
          full_name: M
          phone: 555-C012
        as: FrontDeskAgent
        captures:
          member_id: $.data.id
      - call: POST /salon-svc/queue-tickets
        payload:
          salon_id: ${salon_id}
          member_id: ${member_id}
          service_menu_item_id: ${svc_id}
        as: FrontDeskAgent
        captures:
          ticket_id: $.data.id
      - call: POST /salon-svc/queue-tickets/${ticket_id}/call
        payload: {}
        as: FrontDeskAgent
      - call: POST /salon-svc/service-visits
        payload:
          salon_id: ${salon_id}
          queue_ticket_id: ${ticket_id}
          chair_id: ${chair_id}
          technician_id: ${tech_id}
          expected_salon_version: ${sv1}
        as: FrontDeskAgent
        captures:
          sv2: $.data.version
      trigger:
      - call: POST /salon-svc/salons/${salon_id}/close
        payload:
          expected_salon_version: ${sv2}
        as: SalonManager
        captures:
          err: $.data.error_id
      assert:
      - Salon.${salon_id}.active_occupancy_count == 1
      - response.error_id == ERR_SALON_HAS_ACTIVE_VISITS
  - name: close_salon_cancels_waiting_tickets_cascade
    claim_type: Side Effect Execution
    grounds:
    - state_machines.Salon.OPEN_to_CLOSED
    - state_machines.QueueTicket
    distinguishing_aspect: Closing a salon with a WAITING ticket cascades the ticket to CANCELLED.
    test_recipe:
      setup:
      - OPEN salon, one WAITING ticket, no occupied chairs
      setup_api_calls:
      - call: POST /salon-svc/salons
        payload:
          name: S
          license_number: LIC-C13
          license_expiry: '2027-01-01T00:00:00Z'
        as: SalonManager
        captures:
          salon_id: $.data.id
          sv0: $.data.version
      - call: POST /salon-svc/salons/${salon_id}/open
        payload:
          expected_salon_version: ${sv0}
        as: SalonManager
        captures:
          sv1: $.data.version
      - call: POST /salon-svc/service-menu-items
        payload:
          salon_id: ${salon_id}
          code: BROW_THREAD
          name: Threading
          base_price_cents: 2000
          est_minutes: 15
        as: SalonManager
        captures:
          svc_id: $.data.id
      - call: POST /salon-svc/members
        payload:
          salon_id: ${salon_id}
          full_name: M
          phone: 555-C013
        as: FrontDeskAgent
        captures:
          member_id: $.data.id
      - call: POST /salon-svc/queue-tickets
        payload:
          salon_id: ${salon_id}
          member_id: ${member_id}
          service_menu_item_id: ${svc_id}
        as: FrontDeskAgent
        captures:
          ticket_id: $.data.id
      trigger:
      - call: POST /salon-svc/salons/${salon_id}/close
        payload:
          expected_salon_version: ${sv1}
        as: SalonManager
      assert:
      - Salon.${salon_id}.status == CLOSED
      - QueueTicket.${ticket_id}.status == CANCELLED
  - name: complete_already_completed_visit_invalid_from
    claim_type: Invalid Transitions
    grounds:
    - state_machines.ServiceVisit.IN_SERVICE_to_COMPLETED
    - errors[ERR_VISIT_NOT_IN_SERVICE]
    distinguishing_aspect: Completing a visit already COMPLETED -> ERR_VISIT_NOT_IN_SERVICE (409).
    test_recipe:
      setup:
      - COMPLETED visit
      setup_api_calls:
      - call: POST /salon-svc/salons
        payload:
          name: S
          license_number: LIC-C14
          license_expiry: '2027-01-01T00:00:00Z'
        as: SalonManager
        captures:
          salon_id: $.data.id
          sv0: $.data.version
      - call: POST /salon-svc/salons/${salon_id}/open
        payload:
          expected_salon_version: ${sv0}
        as: SalonManager
        captures:
          sv1: $.data.version
      - call: POST /salon-svc/chairs
        payload:
          salon_id: ${salon_id}
          label: Bar 1
        as: SalonManager
        captures:
          chair_id: $.data.id
      - call: POST /salon-svc/technicians
        payload:
          salon_id: ${salon_id}
          display_name: T
          sanitation_cert_expiry: '2027-01-01T00:00:00Z'
        as: SalonManager
        captures:
          tech_id: $.data.id
      - call: POST /salon-svc/service-menu-items
        payload:
          salon_id: ${salon_id}
          code: BROW_THREAD
          name: Threading
          base_price_cents: 2000
          est_minutes: 15
        as: SalonManager
        captures:
          svc_id: $.data.id
      - call: POST /salon-svc/members
        payload:
          salon_id: ${salon_id}
          full_name: M
          phone: 555-C014
        as: FrontDeskAgent
        captures:
          member_id: $.data.id
      - call: POST /salon-svc/queue-tickets
        payload:
          salon_id: ${salon_id}
          member_id: ${member_id}
          service_menu_item_id: ${svc_id}
        as: FrontDeskAgent
        captures:
          ticket_id: $.data.id
      - call: POST /salon-svc/queue-tickets/${ticket_id}/call
        payload: {}
        as: FrontDeskAgent
      - call: POST /salon-svc/service-visits
        payload:
          salon_id: ${salon_id}
          queue_ticket_id: ${ticket_id}
          chair_id: ${chair_id}
          technician_id: ${tech_id}
          expected_salon_version: ${sv1}
        as: FrontDeskAgent
        captures:
          visit_id: $.data.id
      - call: POST /salon-svc/service-visits/${visit_id}/complete
        payload: {}
        as: Technician
        as_user_id: ${tech_id}
      trigger:
      - call: POST /salon-svc/service-visits/${visit_id}/complete
        payload: {}
        as: Technician
        as_user_id: ${tech_id}
        captures:
          err: $.data.error_id
      assert:
      - response.error_id == ERR_VISIT_NOT_IN_SERVICE
      - response.http_status == 409
  - name: settle_before_complete_rejected_cross_dimension_guard
    claim_type: Precondition Enforcement
    grounds:
    - state_machines.ServiceVisit.UNPAID_to_SETTLED
    - errors[ERR_VISIT_NOT_COMPLETED]
    distinguishing_aspect: 'Settling a visit still IN_SERVICE -> ERR_VISIT_NOT_COMPLETED (409): the payment dimension is guarded by the service dimension.'
    test_recipe:
      setup:
      - IN_SERVICE/UNPAID visit
      setup_api_calls:
      - call: POST /salon-svc/salons
        payload:
          name: S
          license_number: LIC-C15
          license_expiry: '2027-01-01T00:00:00Z'
        as: SalonManager
        captures:
          salon_id: $.data.id
          sv0: $.data.version
      - call: POST /salon-svc/salons/${salon_id}/open
        payload:
          expected_salon_version: ${sv0}
        as: SalonManager
        captures:
          sv1: $.data.version
      - call: POST /salon-svc/chairs
        payload:
          salon_id: ${salon_id}
          label: Bar 1
        as: SalonManager
        captures:
          chair_id: $.data.id
      - call: POST /salon-svc/technicians
        payload:
          salon_id: ${salon_id}
          display_name: T
          sanitation_cert_expiry: '2027-01-01T00:00:00Z'
        as: SalonManager
        captures:
          tech_id: $.data.id
      - call: POST /salon-svc/service-menu-items
        payload:
          salon_id: ${salon_id}
          code: BROW_THREAD
          name: Threading
          base_price_cents: 2000
          est_minutes: 15
        as: SalonManager
        captures:
          svc_id: $.data.id
      - call: POST /salon-svc/members
        payload:
          salon_id: ${salon_id}
          full_name: M
          phone: 555-C015
        as: FrontDeskAgent
        captures:
          member_id: $.data.id
      - call: POST /salon-svc/queue-tickets
        payload:
          salon_id: ${salon_id}
          member_id: ${member_id}
          service_menu_item_id: ${svc_id}
        as: FrontDeskAgent
        captures:
          ticket_id: $.data.id
      - call: POST /salon-svc/queue-tickets/${ticket_id}/call
        payload: {}
        as: FrontDeskAgent
      - call: POST /salon-svc/service-visits
        payload:
          salon_id: ${salon_id}
          queue_ticket_id: ${ticket_id}
          chair_id: ${chair_id}
          technician_id: ${tech_id}
          expected_salon_version: ${sv1}
        as: FrontDeskAgent
        captures:
          visit_id: $.data.id
      trigger:
      - call: POST /salon-svc/service-visits/${visit_id}/settle
        payload: {}
        as: FrontDeskAgent
        captures:
          err: $.data.error_id
      assert:
      - response.error_id == ERR_VISIT_NOT_COMPLETED
  - name: requeue_beyond_recall_limit_rejected
    claim_type: Precondition Enforcement
    grounds:
    - state_machines.QueueTicket.CALLED_to_WAITING
    - validations[priority=13]
    - errors[ERR_RECALL_LIMIT_REACHED]
    distinguishing_aspect: Third requeue (called_count would exceed MAX_RECALLS=2) -> ERR_RECALL_LIMIT_REACHED (409).
    test_recipe:
      setup:
      - OPEN salon, ticket already requeued twice (called_count=2), currently CALLED
      setup_api_calls:
      - call: POST /salon-svc/salons
        payload:
          name: S
          license_number: LIC-C16
          license_expiry: '2027-01-01T00:00:00Z'
        as: SalonManager
        captures:
          salon_id: $.data.id
          sv0: $.data.version
      - call: POST /salon-svc/salons/${salon_id}/open
        payload:
          expected_salon_version: ${sv0}
        as: SalonManager
      - call: POST /salon-svc/service-menu-items
        payload:
          salon_id: ${salon_id}
          code: BROW_THREAD
          name: Threading
          base_price_cents: 2000
          est_minutes: 15
        as: SalonManager
        captures:
          svc_id: $.data.id
      - call: POST /salon-svc/members
        payload:
          salon_id: ${salon_id}
          full_name: M
          phone: 555-C016
        as: FrontDeskAgent
