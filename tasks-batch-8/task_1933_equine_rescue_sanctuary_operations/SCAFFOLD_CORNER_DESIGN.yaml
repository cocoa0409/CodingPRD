          setup_api_calls:
            - { call: "POST /rescue-ops/practitioners", payload: { name: "Dr V", specialty: VETERINARIAN }, as: SanctuaryDirector, captures: { vet_id: $.data.id } }
            - { call: "POST /rescue-ops/horses", payload: { name: "H", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 9, body_condition_score: 4, training_level: GREEN }, as: IntakeCoordinator, captures: { h: $.data.id } }
