  - section: validations
    instances:
      - name: c_missing_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers returns 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /programs/00000000-0000-0000-0000-000000000000", payload: {}, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 401 and error_id == ERR_UNAUTHENTICATED (sent with no auth headers; auth beats 404)"

      - name: c_wrong_role_create_program_forbidden
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN]"
          - "roles"
        distinguishing_aspect: "ClinicStaff calling POST /programs (ProgramAdmin-exclusive) returns 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["Clinic exists"]
          setup_api_calls:
            - { call: "POST /clinics", payload: { name: "C1", npi_number: "1111111111", max_active_referrals: 50 }, as: ProgramAdmin, captures: { cl: $.data.id } }
          trigger:
            - { call: "POST /programs", payload: { name: "P", start_date: "2026-05-01", end_date: "2026-10-31", base_monthly_benefit_cents: 10000, household_increment_cents: 2500, max_household_size: 6, double_up_multiplier: 1.0, double_up_daily_cap_cents: 100000, double_up_pool_cents: 200000, tier2_completions: 3, tier3_completions: 6, renewal_window_days: 30, outcome_improvement_threshold: 0.5 }, as: ClinicStaff, as_user_id: "${cl}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 403 and error_id == ERR_FORBIDDEN"

      - name: c_clinic_scope_mismatch_forbidden
        claim_type: priority_ordering
        grounds:
          - "validations[priority=2]"
          - "validations[priority=3]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "ClinicStaff of clinic A creating a patient with clinic_id of clinic B is an ownership failure: 403 ERR_FORBIDDEN fires at priority 2 even though clinic B exists (no information leak, no validation error)."
        test_recipe:
          setup: ["Two ACTIVE clinics A and B"]
          setup_api_calls:
            - { call: "POST /clinics", payload: { name: "CA", npi_number: "1111111111", max_active_referrals: 50 }, as: ProgramAdmin, captures: { cla: $.data.id } }
            - { call: "POST /clinics", payload: { name: "CB", npi_number: "2222222222", max_active_referrals: 50 }, as: ProgramAdmin, captures: { clb: $.data.id } }
          trigger:
            - { call: "POST /patients", payload: { clinic_id: "${clb}", full_name: "Pat X", date_of_birth: "1990-01-01", household_size: 1 }, as: ClinicStaff, as_user_id: "${cla}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 403 and error_id == ERR_FORBIDDEN (acting clinic ${cla} != payload clinic ${clb})"

      - name: c_create_cycle_invalid_date_range
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_INVALID_DATE_RANGE]"
        distinguishing_aspect: "Cycle with start_date >= end_date returns 400 ERR_INVALID_DATE_RANGE; also a cycle outside the program window is rejected."
        test_recipe:
          setup: ["Program exists (DRAFT)"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", start_date: "2026-05-01", end_date: "2026-10-31", base_monthly_benefit_cents: 10000, household_increment_cents: 2500, max_household_size: 6, double_up_multiplier: 1.0, double_up_daily_cap_cents: 100000, double_up_pool_cents: 200000, tier2_completions: 3, tier3_completions: 6, renewal_window_days: 30, outcome_improvement_threshold: 0.5 }, as: ProgramAdmin, captures: { pg: $.data.id } }
