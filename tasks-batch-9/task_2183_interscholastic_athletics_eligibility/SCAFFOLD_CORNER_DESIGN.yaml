      - name: clock_checkpoint_expires_a_cleared_credential_and_renewal_closes_the_gap_again
        claim_type: cyclic
        grounds:
          - state_machines.StaffCredential.CLEARED_to_EXPIRED
          - state_machines.StaffCredential.EXPIRED_to_CLEARED
          - entities.School.fields.credential_gap_sports
          - endpoints[POST /athletics/_clock/set_current_utc]
        distinguishing_aspect: "The CLEARED -> EXPIRED -> CLEARED loop is driven by the clock checkpoint: setting the clock to the credential's certification_expires_on date expires it (expired_credential_count 1) and reopens School.credential_gap_sports, and a renewal background-check closes the gap again without creating a new credential row."
        test_recipe:
          setup: ["One C3A school holding a CLEARED HEAD_COACH FOOTBALL credential whose certification_expires_on is 2026-09-20, with the clock at 2026-09-10."]
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T09:00:00Z" }
              as: AssociationAdmin
            - call: "POST /athletics/schools"
              payload: { name: "North High", classification: "C3A", region_code: "R-NORTH" }
              as: AssociationAdmin
              captures: { sch_a: $.data.id }
            - call: "POST /athletics/staff-credentials"
              payload: { school_id: "${sch_a}", coach_name: "Teri Vance", sport: "FOOTBALL", role_title: "HEAD_COACH", certification_expires_on: "2026-09-20" }
              as: SchoolAthleticDirector
