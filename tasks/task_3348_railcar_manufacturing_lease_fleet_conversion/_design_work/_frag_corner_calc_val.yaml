scaffold_corner_design:
  - section: calculations
    instances:
      - name: order_price_quote_correct_result_three_line_committed_quote
        claim_type: Correct Result
        grounds:
          - calculations.order_price_quote
          - entities.ProductionOrder.fields.unit_price_cents
          - validations[priority=14]
        distinguishing_aspect: "A three-row bill of materials (wheelset, casting, coating) quotes exactly 1614500 cents on the SOLD order BOX-200 x5 at day 0 past order_date, proving the per-line ceiling plus the 45000-cent labor rate are summed before any fee term is added."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z, the same day as the order_date, so the forecast variant's 120-day lapse window is empty and forecast == committed."
            - "Car type BOX-200 (BOXCAR, build_hours 30, regulatory_life_years 25, line_count_family LINE-B) carries three bill-of-material rows: WS-210 WHEELSET qty_per_car 4 unit_cost 18000, CS-210 CASTING qty_per_car 2 unit_cost 40000, CT-210 COATING qty_per_car 3 unit_cost 12500."
            - "Wheelset stock 40 and casting stock 20 cover the order's 20-unit and 10-unit requirements exactly, so the reservation at priority 13 passes."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "BOX-200", car_class: "BOXCAR", build_hours: 30, regulatory_life_years: 25, line_count_family: "LINE-B" }
              as: ProductionPlanner
              captures: { ct_box_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-210", component_class: "WHEELSET", unit_cost_cents: 18000, lead_time_days: 30, on_hand_qty: 40 }
              as: SupplyChainCoordinator
              captures: { ws210_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "CS-210", component_class: "CASTING", unit_cost_cents: 40000, lead_time_days: 45, on_hand_qty: 20 }
              as: SupplyChainCoordinator
              captures: { cs210_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "CT-210", component_class: "COATING", unit_cost_cents: 12500, lead_time_days: 20, on_hand_qty: 100 }
              as: SupplyChainCoordinator
              captures: { ct210_id: $.data.id }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_box_id}", component_id: "${ws210_id}", qty_per_car: 4 }
              as: ProductionPlanner
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_box_id}", component_id: "${cs210_id}", qty_per_car: 2 }
              as: ProductionPlanner
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_box_id}", component_id: "${ct210_id}", qty_per_car: 3 }
              as: ProductionPlanner
          trigger:
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_box_id}", quantity: 5, planned_shop_days: 150, disposition: "SOLD", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-12-01" }
              as: ProductionPlanner
              captures: { po_id: $.data.id, price_draft: $.data.unit_price_cents, po_status: $.data.status }
            - call: "POST /api/v1/production-orders/${po_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
              captures: { price_committed: $.data.unit_price_cents, po_status_reserved: $.data.status }
          assert:
            - "ProductionOrder.${po_id}.status == ${po_status} == \"DRAFT\" after creation and ${po_status_reserved} == \"COMPONENT_RESERVED\" after the reservation"
            - "Line values before summing: WS-210 ceil((4 * 18000 + 25000) / 100) * 100 == 97000; CS-210 ceil((2 * 40000 + 25000) / 100) * 100 == 105000; CT-210 ceil((3 * 12500 + 25000) / 100) * 100 == 62500"
            - "COMPONENT_SUBTOTAL == 97000 + 105000 + 62500 == 264500 and LABOR_CENTS == 30 * 45000 == 1350000, so UNROUNDED == 1614500"
            - "CHANGE_FEE == 0 because RAW_FEE == 15000 * 0 endorsements in {APPROVED, APPLIED} == 0, so ProductionOrder.${po_id}.unit_price_cents == ${price_draft} == 1614500"
            - "The committed re-quote is the same literal: ${price_committed} == 1614500, since day 0 past order_date leaves the forecast variant's lapse uplift empty"
            - "The lead-time gate passed rather than short-circuiting the quote: horizon 2026-09-01 to 2026-12-01 == 91 days >= worst_lead max(ceil(30/4), ceil(45/2)) == 23"

      - name: lease_fleet_capital_allocation_correct_result_retained_completion
        claim_type: Correct Result
        grounds:
          - calculations.lease_fleet_capital_allocation
          - entities.LeaseContract.fields.capital_allocation_cents
          - state_machines.ProductionOrder.IN_PRODUCTION_to_COMPLETED
        distinguishing_aspect: "Completing a RETAINED order of 2 cars at unit_price_cents 1614500 sets LeaseContract.capital_allocation_cents to exactly 3229000 (2 live cars x the committed quote) and the derived lessor equity to exactly 226030."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "Car type BOX-200 (BOXCAR, build_hours 30, regulatory_life_years 25, line_count_family LINE-B) with WS-210 WHEELSET qty 4 cost 18000 on_hand 40, CS-210 CASTING qty 2 cost 40000 on_hand 20, CT-210 COATING qty 3 cost 12500 on_hand 100."
            - "An ACTIVE FULL_SERVICE contract (per_diem_rate_cents 5000, liability_bearer LESSOR, term 2026-09-01..2027-09-01, fleet_car_cap 10) names the lessee; a CONFIRMED coating purchase order with expected_receipt_date 2026-09-21 satisfies the release precondition for the COATING row."
            - "RETAINED order of 2 cars, planned_shop_days 60 == build_hours 30 * quantity 2, reserved and released against that contract, changed over on LINE-B for [2026-09-05, 2026-11-04) (width 60) and completed on 2026-11-04 with completed_qty 2."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "BOX-200", car_class: "BOXCAR", build_hours: 30, regulatory_life_years: 25, line_count_family: "LINE-B" }
              as: ProductionPlanner
              captures: { ct_box_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-210", component_class: "WHEELSET", unit_cost_cents: 18000, lead_time_days: 30, on_hand_qty: 40 }
              as: SupplyChainCoordinator
              captures: { ws210_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "CS-210", component_class: "CASTING", unit_cost_cents: 40000, lead_time_days: 45, on_hand_qty: 20 }
              as: SupplyChainCoordinator
              captures: { cs210_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "CT-210", component_class: "COATING", unit_cost_cents: 12500, lead_time_days: 20, on_hand_qty: 100 }
              as: SupplyChainCoordinator
              captures: { ct210_id: $.data.id }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_box_id}", component_id: "${ws210_id}", qty_per_car: 4 }
              as: ProductionPlanner
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_box_id}", component_id: "${cs210_id}", qty_per_car: 2 }
              as: ProductionPlanner
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_box_id}", component_id: "${ct210_id}", qty_per_car: 3 }
              as: ProductionPlanner
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "Capital Rail Co", credit_tier: "A", utilization_threshold_pct: 70, credit_ceiling_cents: 50000000 }
              as: LeaseAdministrator
              captures: { lessee_id: $.data.id }
            - call: "POST /api/v1/lease-contracts"
              payload: { lessee_id: "${lessee_id}", lease_type: "FULL_SERVICE", per_diem_rate_cents: 5000, liability_bearer: "LESSOR", term_start_date: "2026-09-01", term_end_date: "2027-09-01", fleet_car_cap: 10 }
              as: LeaseAdministrator
              captures: { lc_id: $.data.id }
            - call: "POST /api/v1/lease-contracts/${lc_id}/activate"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /api/v1/component-purchase-orders"
              payload: { component_id: "${ct210_id}", qty_ordered: 6, unit_cost_cents: 12500, order_date: "2026-09-01", expected_receipt_date: "2026-09-21" }
              as: SupplyChainCoordinator
              captures: { cpo_id: $.data.id }
            - call: "POST /api/v1/component-purchase-orders/${cpo_id}/confirm"
              payload: {}
              as: SupplyChainCoordinator
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_box_id}", quantity: 2, planned_shop_days: 60, disposition: "RETAINED", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-12-01" }
              as: ProductionPlanner
              captures: { po_id: $.data.id }
            - call: "POST /api/v1/production-orders/${po_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/release"
              payload: { lease_contract_id: "${lc_id}" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-lines/LINE-B/changeover"
              payload: { production_order_id: "${po_id}", scheduled_start_date: "2026-09-05", scheduled_end_date: "2026-11-04" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/complete"
              payload: { completed_qty: 2, completion_date: "2026-11-04" }
              as: ProductionPlanner
          trigger:
            - call: "GET /api/v1/lease-contracts/${lc_id}"
              payload: {}
              as: LeaseAdministrator
              captures: { capital_after: $.data.capital_allocation_cents }
            - call: "GET /api/v1/lease-fleet-cars?production_order_id=${po_id}"
              payload: {}
              as: LeaseAdministrator
              captures: { car_a: "$.data[0].id", car_b: "$.data[1].id" }
          assert:
            - "retained_cars == 2 (both completed cars are in status HELD), so LeaseContract.${lc_id}.capital_allocation_cents == ${capital_after} == 3229000 == 2 * 1614500"
            - "The per-car basis is the committed quote: LeaseFleetCar.${car_a}.acquisition_cost_cents == 1614500 and LeaseFleetCar.${car_b}.acquisition_cost_cents == 1614500"
            - "Both cars are live fleet members: LeaseFleetCar.${car_a}.status == \"HELD\" and LeaseFleetCar.${car_b}.status == \"HELD\" with built_date 2026-11-04 and regulatory_life_end_date 2051-11-04"
            - "Derived lessor equity == floor(3229000 * min(700, 900) / 10000) == floor(226030.0) == 226030, i.e. the 700-bps constant is applied under the 900-bps ceiling and floored once at the end"
            - "Capital is a re-derivation, not an increment: the figure equals count(live cars of this order) * unit_price_cents == 2 * 1614500 exactly"

      - name: assignment_per_diem_accrual_correct_result_utilization_credit_applied
        claim_type: Correct Result
        grounds:
          - calculations.assignment_per_diem_accrual
          - entities.CarAssignment.fields.per_diem_accrued_cents
          - entities.Lessee.fields.utilization_threshold_pct
          - state_machines.CarAssignment.ACTIVE_to_COMPLETED
        distinguishing_aspect: "A 30-day placement at 2000 cents per day with 6000 miles run accrues exactly 52800 cents because the lessee's 50 percent utilization threshold is met at floor(6000/100) == 60 and the 12 percent credit floor(60000 * 12 / 100) == 7200 is deducted from the 60000-cent gross."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "Car type FLT-100 (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family FLT_LINE) with a single WS-310 WHEELSET bill-of-material row at qty_per_car 1 and on_hand_qty 1000."
            - "A RETAINED order of 2 cars (planned_shop_days 2) is reserved, released, changed over on FLT-L1 for [2026-09-02, 2026-09-04) and completed on 2026-09-04, producing two HELD cars with acquisition_cost_cents 71000."
            - "Lessee with utilization_threshold_pct 50 and credit_ceiling_cents 50000000; ACTIVE FULL_SERVICE contract at per_diem_rate_cents 2000, fleet_car_cap 10; car A is placed 2026-09-04..2026-10-04 with mileage_allowance 5000."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "FLT-100", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 25, line_count_family: "FLT_LINE" }
              as: ProductionPlanner
              captures: { ct_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-310", component_class: "WHEELSET", unit_cost_cents: 1000, lead_time_days: 5, on_hand_qty: 1000 }
              as: SupplyChainCoordinator
              captures: { ws_id: $.data.id }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${ws_id}", qty_per_car: 1 }
              as: ProductionPlanner
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "Perdiem Rail Co", credit_tier: "B", utilization_threshold_pct: 50, credit_ceiling_cents: 50000000 }
              as: LeaseAdministrator
              captures: { lessee_id: $.data.id }
            - call: "POST /api/v1/lease-contracts"
              payload: { lessee_id: "${lessee_id}", lease_type: "FULL_SERVICE", per_diem_rate_cents: 2000, liability_bearer: "LESSOR", term_start_date: "2026-09-01", term_end_date: "2027-09-01", fleet_car_cap: 10 }
              as: LeaseAdministrator
              captures: { lc_id: $.data.id }
            - call: "POST /api/v1/lease-contracts/${lc_id}/activate"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 2, planned_shop_days: 2, disposition: "RETAINED", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-20" }
              as: ProductionPlanner
              captures: { po_id: $.data.id }
            - call: "POST /api/v1/production-orders/${po_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/release"
              payload: { lease_contract_id: "${lc_id}" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-lines/FLT-L1/changeover"
              payload: { production_order_id: "${po_id}", scheduled_start_date: "2026-09-02", scheduled_end_date: "2026-09-04" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/complete"
              payload: { completed_qty: 2, completion_date: "2026-09-04" }
              as: ProductionPlanner
            - call: "GET /api/v1/lease-fleet-cars?production_order_id=${po_id}"
              payload: {}
              as: LeaseAdministrator
              captures: { car_a: "$.data[0].id" }
            - call: "POST /api/v1/car-assignments"
              payload: { lease_fleet_car_id: "${car_a}", lease_contract_id: "${lc_id}", lessee_id: "${lessee_id}", start_date: "2026-09-04", end_date: "2026-10-04", mileage_allowance: 5000 }
              as: LeaseAdministrator
              captures: { asg_a: $.data.id }
          trigger:
            - call: "POST /api/v1/car-returns"
              payload: { lease_fleet_car_id: "${car_a}", car_assignment_id: "${asg_a}", return_date: "2026-10-04", mileage_since_last: 6000, condition_grade: "A" }
              as: LeaseAdministrator
              captures: { ret_a: $.data.id, over_a: $.data.mileage_overage_cents }
            - call: "GET /api/v1/car-assignments/${asg_a}"
              payload: {}
              as: LeaseAdministrator
              captures: { accrued: $.data.per_diem_accrued_cents, asg_status: $.data.status }
          assert:
            - "CarAssignment.${asg_a}.status == ${asg_status} == \"COMPLETED\", so the accrual window closes on end_date 2026-10-04 and days == 2026-10-04 - 2026-09-04 == 30"
            - "gross == 30 * 2000 == 60000 and util_pct == floor(6000 / 100) == 60, which is at or above Lessee.utilization_threshold_pct 50"
            - "credit == floor(60000 * 12 / 100) == floor(7200.0) == 7200, so CarAssignment.${asg_a}.per_diem_accrued_cents == ${accrued} == 52800"
            - "The rate is the snapshot on the assignment, not a live contract read: per_diem_rate_cents == 2000, the value snapshotted at placement time"
            - "The same return's mileage true-up is a separate figure: CarReturn.${ret_a}.mileage_overage_cents == ${over_a} == 12000 (blocks ceil(30/30) == 1, included_miles 1 * 5000 == 5000, overage 6000 - 5000 == 1000 miles * 12 cents)"

      - name: mileage_true_up_settlement_correct_result_two_block_proration
        claim_type: Correct Result
        grounds:
          - calculations.mileage_true_up_settlement
          - entities.CarReturn.fields.mileage_overage_cents
          - entities.CarAssignment.fields.mileage_charge_cents
          - entities.CarAssignment.fields.mileage_allowance
        distinguishing_aspect: "A 60-day placement with a 1000-mile allowance re-grants the allowance once per 30-day block (ceil(60/30) == 2 blocks, included 2000 miles), so 2500 miles used charges exactly 6000 cents rather than the 18000 a single-grant reading would produce."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "Car type FLT-100 (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family FLT_LINE) with a single WS-310 WHEELSET bill-of-material row at qty_per_car 1 and on_hand_qty 1000."
            - "A RETAINED order of 2 cars is reserved, released, changed over on FLT-L1 for [2026-09-02, 2026-09-04) and completed on 2026-09-04, producing two HELD cars."
            - "ACTIVE FULL_SERVICE contract at per_diem_rate_cents 2000 with fleet_car_cap 10; car A is placed 2026-09-04..2026-11-03 (60 days) with mileage_allowance 1000 and the lessee credit ceiling is 50000000 so priority 18 never binds."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "FLT-100", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 25, line_count_family: "FLT_LINE" }
              as: ProductionPlanner
              captures: { ct_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-310", component_class: "WHEELSET", unit_cost_cents: 1000, lead_time_days: 5, on_hand_qty: 1000 }
              as: SupplyChainCoordinator
              captures: { ws_id: $.data.id }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${ws_id}", qty_per_car: 1 }
              as: ProductionPlanner
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "Trueup Rail Co", credit_tier: "B", utilization_threshold_pct: 80, credit_ceiling_cents: 50000000 }
              as: LeaseAdministrator
              captures: { lessee_id: $.data.id }
            - call: "POST /api/v1/lease-contracts"
              payload: { lessee_id: "${lessee_id}", lease_type: "FULL_SERVICE", per_diem_rate_cents: 2000, liability_bearer: "LESSOR", term_start_date: "2026-09-01", term_end_date: "2027-09-01", fleet_car_cap: 10 }
              as: LeaseAdministrator
              captures: { lc_id: $.data.id }
            - call: "POST /api/v1/lease-contracts/${lc_id}/activate"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 2, planned_shop_days: 2, disposition: "RETAINED", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-20" }
              as: ProductionPlanner
              captures: { po_id: $.data.id }
            - call: "POST /api/v1/production-orders/${po_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/release"
              payload: { lease_contract_id: "${lc_id}" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-lines/FLT-L1/changeover"
              payload: { production_order_id: "${po_id}", scheduled_start_date: "2026-09-02", scheduled_end_date: "2026-09-04" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/complete"
              payload: { completed_qty: 2, completion_date: "2026-09-04" }
              as: ProductionPlanner
            - call: "GET /api/v1/lease-fleet-cars?production_order_id=${po_id}"
              payload: {}
              as: LeaseAdministrator
              captures: { car_a: "$.data[0].id" }
            - call: "POST /api/v1/car-assignments"
              payload: { lease_fleet_car_id: "${car_a}", lease_contract_id: "${lc_id}", lessee_id: "${lessee_id}", start_date: "2026-09-04", end_date: "2026-11-03", mileage_allowance: 1000 }
              as: LeaseAdministrator
              captures: { asg_a: $.data.id }
          trigger:
            - call: "POST /api/v1/car-returns"
              payload: { lease_fleet_car_id: "${car_a}", car_assignment_id: "${asg_a}", return_date: "2026-11-03", mileage_since_last: 2500, condition_grade: "A" }
              as: LeaseAdministrator
              captures: { ret_a: $.data.id, over_a: $.data.mileage_overage_cents }
            - call: "GET /api/v1/car-assignments/${asg_a}"
              payload: {}
              as: LeaseAdministrator
              captures: { charge_a: $.data.mileage_charge_cents }
          assert:
            - "days_in_placement == 2026-11-03 - 2026-09-04 == 60, so blocks == ceil(60 / 30) == 2"
            - "included_miles == 2 blocks * 1000 == 2000, so overage_miles == max(0, 2500 - 2000) == 500"
            - "CarReturn.${ret_a}.mileage_overage_cents == ${over_a} == 6000 == 500 * 12, the MILEAGE_OVERAGE_RATE_CENTS constant applied to the overage only"
            - "CarAssignment.${asg_a}.mileage_charge_cents == ${charge_a} == 6000, so the assignment stores the same true-up the return records"
            - "A single-grant reading of the same data would charge max(0, 2500 - 1000) * 12 == 18000, so the 6000 literal pins the per-30-day-block re-grant"
            - "The allowance read is the assignment's own 1000, not the contract's rate: CarAssignment.${asg_a}.mileage_allowance == 1000"

      - name: maintenance_burden_allocation_correct_result_lessor_absorbs_parts
        claim_type: Correct Result
        grounds:
          - calculations.maintenance_burden_allocation
          - entities.CarReturn.fields.maintenance_parts_cents
          - entities.CarAssignment.fields.maintenance_cost_cents
          - entities.LeaseContract.fields.liability_bearer
        distinguishing_aspect: "A grade-C return on a LESSOR-liable contract stores exactly 400000 cents of parts on the return and the whole 400000 on the placement, because the CONDITION_PARTS_CENTS table is indexed by grade and the lessor absorbs 100 percent when liability_bearer is LESSOR."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "Car type FLT-100 (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family FLT_LINE) with a single WS-310 WHEELSET bill-of-material row at qty_per_car 1 and on_hand_qty 1000."
