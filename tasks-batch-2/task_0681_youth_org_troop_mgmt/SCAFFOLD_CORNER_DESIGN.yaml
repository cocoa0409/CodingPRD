              payload: { unit_number: "R-4", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { tid: $.data.id }
            - call: "POST /troops/${tid}/members"
              payload: { member_type: "ADULT", full_name: "Adult R4", birthdate: "1980-01-01" }
              as: TroopLeader
              captures: { mid: $.data.id }
            - call: "POST /members/${mid}/leader-credentials"
              payload: { requested_by_user_id: "registrar-amy" }
              as: TroopLeader
              captures: { lc: $.data.id }
            - call: "POST /leader-credentials/${lc}/start-bgcheck"
              payload: {}
              as: CouncilRegistrar
          trigger:
            - call: "POST /leader-credentials/${lc}/resolve-bgcheck"
              payload: { outcome: "CLEAR" }
              as: CouncilRegistrar
              as_user_id: "registrar-amy"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES"

