        grounds:
          - validations[priority=40].ERR_INVALID_TASK_STATE
          - validations[priority=66].ERR_REVIEWER_CAPACITY_EXCEEDED
          - state_machines.ReviewTask.status.QUEUED_to_CLAIMED
        distinguishing_aspect: |
          Error-category pair (state, business_constraint). A reviewer already at its
          claim ceiling targets a task another reviewer has already claimed, so priority 40
          and priority 66 are both violated by one request. Only the priority-40
          ERR_INVALID_TASK_STATE may surface. The companion calls prove the lower-priority
          rule is genuinely live: the same reviewer aiming at a still-QUEUED task gets
          ERR_REVIEWER_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Rule SUPPLEMENTS_CLAIMS (REGULATED, weight 4.02, requires_certification false, auto 0.90, manual 0.50, sla 48, default_queue STANDARD) with a DE override ALLOWED_WITH_DISCLAIMER, severity_multiplier 1.15."
            - "One advertiser, three creatives each declaring SUPPLEMENTS_CLAIMS and targeting DE only."
            - "Reviewer R1 with queue_specialties [STANDARD], country_authorizations [DE], max_concurrent_claims 1."
            - "Reviewer R2 with queue_specialties [STANDARD], country_authorizations [DE], max_concurrent_claims 2."
            - "All three creatives are screened at confidence 0.60 into the STANDARD queue, producing tasks t1, t2 and t3 in status QUEUED."
            - "R1 claims t1 (reaching its ceiling of 1) and R2 claims t2 (moving t2 out of QUEUED); t3 is left QUEUED."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "SUPPLEMENTS_CLAIMS", title: "Supplement health claims", category_class: "REGULATED", base_severity_weight: 4.02, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.50, review_sla_hours: 48, default_queue: "STANDARD" }
              as: PolicyAdmin
              captures: { sup_id: "$.data.id" }
            - call: "POST /ad-policy/policy-rules/${sup_id}/country-overrides"
              payload: { country_code: "DE", disposition: "ALLOWED_WITH_DISCLAIMER", severity_multiplier: 1.15 }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Rheinvale Wellness GmbH", country_code: "DE", industry_code: "SUPPLEMENTS" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/reviewers"
              payload: { display_name: "Rev One", queue_specialties: ["STANDARD"], country_authorizations: ["DE"], max_concurrent_claims: 1 }
              as: PolicyAdmin
              captures: { rev1_id: "$.data.id" }
            - call: "POST /ad-policy/reviewers"
              payload: { display_name: "Rev Two", queue_specialties: ["STANDARD"], country_authorizations: ["DE"], max_concurrent_claims: 2 }
              as: PolicyAdmin
              captures: { rev2_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Immunity boost one", body_text: "Our immunity boost formula supports daily wellness.", declared_category_codes: ["SUPPLEMENTS_CLAIMS"], target_country_codes: ["DE"], landing_page_url: "https://www.rheinvale.example/a", display_url: "https://www.rheinvale.example/a" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr1_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Immunity boost two", body_text: "Second immunity boost blend with added vitamins.", declared_category_codes: ["SUPPLEMENTS_CLAIMS"], target_country_codes: ["DE"], landing_page_url: "https://www.rheinvale.example/b", display_url: "https://www.rheinvale.example/b" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr2_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Immunity boost three", body_text: "Third immunity boost pack for the whole family.", declared_category_codes: ["SUPPLEMENTS_CLAIMS"], target_country_codes: ["DE"], landing_page_url: "https://www.rheinvale.example/c", display_url: "https://www.rheinvale.example/c" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr3_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr1_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr1_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr1_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${sup_id}", confidence: 0.60, matched_snippet: "immunity boost" }], expected_ad_creative_version: "${cr1_v}" }
              as: PolicyAdmin
            - call: "POST /ad-policy/ad-creatives/${cr2_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr2_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr2_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${sup_id}", confidence: 0.60, matched_snippet: "added vitamins" }], expected_ad_creative_version: "${cr2_v}" }
              as: PolicyAdmin
            - call: "POST /ad-policy/ad-creatives/${cr3_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr3_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr3_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${sup_id}", confidence: 0.60, matched_snippet: "whole family" }], expected_ad_creative_version: "${cr3_v}" }
              as: PolicyAdmin
            - call: "GET /ad-policy/review-tasks"
              payload: { ad_creative_id: "${cr1_id}" }
              as: PolicyAdmin
              captures: { t1_id: "$.data[0].id" }
            - call: "GET /ad-policy/review-tasks"
              payload: { ad_creative_id: "${cr2_id}" }
              as: PolicyAdmin
              captures: { t2_id: "$.data[0].id" }
            - call: "GET /ad-policy/review-tasks"
              payload: { ad_creative_id: "${cr3_id}" }
              as: PolicyAdmin
              captures: { t3_id: "$.data[0].id" }
            - call: "POST /ad-policy/review-tasks/${t1_id}/claim"
              payload: {}
              as: PolicyReviewer
              as_user_id: "${rev1_id}"
            - call: "POST /ad-policy/review-tasks/${t2_id}/claim"
              payload: {}
              as: PolicyReviewer
              as_user_id: "${rev2_id}"
          trigger:
            - call: "POST /ad-policy/review-tasks/${t2_id}/claim"
              payload: {}
              as: PolicyReviewer
              as_user_id: "${rev1_id}"
            - call: "POST /ad-policy/review-tasks/${t3_id}/claim"
              payload: {}
              as: PolicyReviewer
              as_user_id: "${rev1_id}"
          assert:
            - "The first trigger call returns 409 with error_id ERR_INVALID_TASK_STATE, never ERR_REVIEWER_CAPACITY_EXCEEDED, even though R1.claimed_task_count == 1 == max_concurrent_claims"
            - "The second trigger call returns 409 with error_id ERR_REVIEWER_CAPACITY_EXCEEDED, proving the priority-66 rule was genuinely violated by the first call too"
            - "ReviewTask.${t2_id}.status == CLAIMED with assigned_reviewer_id == ${rev2_id} (unchanged by the rejected claim)"
            - "ReviewTask.${t3_id}.status == QUEUED with assigned_reviewer_id == null"
            - "Reviewer.${rev1_id}.claimed_task_count == 1 and Reviewer.${rev2_id}.claimed_task_count == 1"

      - name: appeal_window_closed_error_outranks_certification_owner_mismatch
        grounds:
          - validations[priority=74].ERR_APPEAL_WINDOW_CLOSED
          - validations[priority=88].ERR_CERTIFICATION_OWNER_MISMATCH
          - calculations.appeal_window_deadline
          - state_machines.DisapprovalNotice.status.ISSUED_to_APPEALED
        distinguishing_aspect: |
          Error-category pair (business_temporal, business_referential) — a different pair
          from the state/business_constraint conflict above. One POST /ad-policy/appeals
          violates both the 72-hour appeal window and the evidence-ownership rule; only
          ERR_APPEAL_WINDOW_CLOSED (409) may surface, not ERR_CERTIFICATION_OWNER_MISMATCH
          (422). The sweep is deliberately never run, so the stale notice is still ISSUED
          and priority 40 ERR_NOTICE_NOT_APPEALABLE cannot mask either rule. A second,
          fresh notice shows priority 88 firing once the window is satisfied.
        test_recipe:
          setup:
            - "Rule WEAPONS_FIREARMS (PROHIBITED, weight 12.00, auto 0.90, manual 0.50, sla 24) with overrides SE BLOCKED 2.00 and US RESTRICTED_CERT_REQUIRED 1.00."
            - "Advertiser A1 (the appellant) and Advertiser A2 (an unrelated holder)."
            - "A2 holds a certification for WEAPONS_FIREARMS issued in US valid 2026-07-01 to 2026-12-01, which is ACTIVE at the 2026-08-01 clock."
            - "A1 owns two creatives, both created up front, each declaring WEAPONS_FIREARMS and targeting SE and US."
            - "cr1 is submitted and screened at confidence 0.95; because SE is BLOCKED the run auto-disapproves and mints notice1 with appeal_deadline_at 2026-08-04T00:00:00Z (72 standard hours)."
            - "The logical clock is then advanced to 2026-08-05T00:00:00Z, past notice1's deadline, and cr2 is submitted and screened the same way, minting notice2 with appeal_deadline_at 2026-08-08T00:00:00Z."
            - "POST /ad-policy/_policy-sweeps/run is never called, so notice1 keeps status ISSUED."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "WEAPONS_FIREARMS", title: "Weapons and firearms", category_class: "PROHIBITED", base_severity_weight: 12.00, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.50, review_sla_hours: 24, default_queue: "STANDARD" }
              as: PolicyAdmin
              captures: { wpn_id: "$.data.id" }
            - call: "POST /ad-policy/policy-rules/${wpn_id}/country-overrides"
              payload: { country_code: "SE", disposition: "BLOCKED", severity_multiplier: 2.00 }
              as: PolicyAdmin
            - call: "POST /ad-policy/policy-rules/${wpn_id}/country-overrides"
              payload: { country_code: "US", disposition: "RESTRICTED_CERT_REQUIRED", requires_license: true, severity_multiplier: 1.00 }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Ironpoint Outfitters", country_code: "US", industry_code: "SPORTING_GOODS" }
              as: PolicyAdmin
              captures: { adv1_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Granite Range Supply", country_code: "US", industry_code: "SPORTING_GOODS" }
              as: PolicyAdmin
              captures: { adv2_id: "$.data.id" }
            - call: "POST /ad-policy/certifications"
              payload: { advertiser_id: "${adv2_id}", policy_rule_id: "${wpn_id}", license_number: "FFL-GRS-2026-118", issuing_country_code: "US", valid_from: "2026-07-01T00:00:00Z", valid_until: "2026-12-01T00:00:00Z" }
              as: Advertiser
              as_user_id: "${adv2_id}"
              captures: { cert2_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv1_id}", headline: "Range day bundle", body_text: "Range day bundle with two rifles and a case.", declared_category_codes: ["WEAPONS_FIREARMS"], target_country_codes: ["SE", "US"], landing_page_url: "https://www.ironpoint.example/bundle", display_url: "https://www.ironpoint.example/bundle" }
              as: Advertiser
              as_user_id: "${adv1_id}"
              captures: { cr1_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv1_id}", headline: "Optics clearance", body_text: "Optics clearance sale including rifle scopes.", declared_category_codes: ["WEAPONS_FIREARMS"], target_country_codes: ["SE", "US"], landing_page_url: "https://www.ironpoint.example/optics", display_url: "https://www.ironpoint.example/optics" }
              as: Advertiser
              as_user_id: "${adv1_id}"
              captures: { cr2_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr1_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv1_id}"
              captures: { cr1_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr1_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${wpn_id}", confidence: 0.95, matched_snippet: "two rifles" }], expected_ad_creative_version: "${cr1_v}" }
              as: PolicyAdmin
            - call: "GET /ad-policy/disapproval-notices"
              payload: { ad_creative_id: "${cr1_id}" }
              as: PolicyAdmin
              captures: { notice1_id: "$.data[0].id", notice1_deadline: "$.data[0].appeal_deadline_at" }
            - call: "POST /ad-policy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PolicyAdmin
            - call: "POST /ad-policy/ad-creatives/${cr2_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv1_id}"
              captures: { cr2_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr2_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${wpn_id}", confidence: 0.95, matched_snippet: "rifle scopes" }], expected_ad_creative_version: "${cr2_v}" }
              as: PolicyAdmin
            - call: "GET /ad-policy/disapproval-notices"
              payload: { ad_creative_id: "${cr2_id}" }
              as: PolicyAdmin
              captures: { notice2_id: "$.data[0].id" }
          trigger:
            - call: "POST /ad-policy/appeals"
              payload: { disapproval_notice_id: "${notice1_id}", justification: "The Swedish targeting was a configuration mistake and has been corrected.", evidence_certification_id: "${cert2_id}" }
              as: Advertiser
              as_user_id: "${adv1_id}"
            - call: "POST /ad-policy/appeals"
              payload: { disapproval_notice_id: "${notice1_id}", justification: "Resubmitting the same appeal without any evidence attachment at all." }
              as: Advertiser
              as_user_id: "${adv1_id}"
            - call: "POST /ad-policy/appeals"
              payload: { disapproval_notice_id: "${notice2_id}", justification: "Optics are not firearms and the listing should be reinstated.", evidence_certification_id: "${cert2_id}" }
              as: Advertiser
              as_user_id: "${adv1_id}"
            - call: "GET /ad-policy/appeals"
              payload: { disapproval_notice_id: "${notice1_id}" }
              as: PolicyAdmin
          assert:
            - "DisapprovalNotice.${notice1_id}.appeal_deadline_at == 2026-08-04T00:00:00Z and appeal_window_hours == 72"
            - "DisapprovalNotice.${notice2_id}.appeal_deadline_at == 2026-08-08T00:00:00Z"
            - "The first trigger call returns 409 with error_id ERR_APPEAL_WINDOW_CLOSED, never ERR_CERTIFICATION_OWNER_MISMATCH and never ERR_NOTICE_NOT_APPEALABLE"
            - "The second trigger call also returns 409 ERR_APPEAL_WINDOW_CLOSED, confirming the window rule is what rejects notice1"
            - "The third trigger call returns 422 with error_id ERR_CERTIFICATION_OWNER_MISMATCH, proving priority 88 is live once the window is satisfied"
            - "DisapprovalNotice.${notice1_id}.status == ISSUED and DisapprovalNotice.${notice2_id}.status == ISSUED (no notice moved to APPEALED)"
            - "GET /ad-policy/appeals filtered by notice1 returns an empty list with total_count == 0"

      - name: political_disclosure_error_outranks_certification_missing_on_approval
        grounds:
          - validations[priority=56].ERR_POLITICAL_DISCLOSURE_MISSING
          - validations[priority=70].ERR_CERTIFICATION_MISSING
          - calculations.certification_coverage
          - state_machines.AdCreative.review_status.PENDING_MANUAL_REVIEW_to_APPROVED_LIMITED
        distinguishing_aspect: |
          Error-category pair (business_safety, business_constraint) — a third distinct
          pair. One APPROVE_WITH_LIMITS request on a political creative with no disclaimer
          and no license coverage violates both priority 56 and priority 70; only
          ERR_POLITICAL_DISCLOSURE_MISSING may surface. A sibling creative that carries a
          disclaimer but still lacks coverage returns ERR_CERTIFICATION_MISSING, proving
          the masked rule is live. Political eligibility is set to ELIGIBLE so priority 54
          cannot pre-empt either rule.
        test_recipe:
          setup:
            - "Rule POLITICAL_ISSUE (REGULATED, weight 5.00, requires_disclaimer true, auto 0.95, manual 0.60, sla 12, default_queue POLITICAL) with a US override ALLOWED_WITH_DISCLAIMER 1.00."
            - "Rule ALC_SPIRITS (RESTRICTED, weight 6.00, requires_certification true, requires_disclaimer true, auto 0.90, manual 0.55, sla 48, default_queue REGULATED_CERT) with a US override RESTRICTED_CERT_REQUIRED, requires_license true, severity_multiplier 1.50."
            - "One advertiser with identity and business standing VERIFIED and political_eligibility_status driven to ELIGIBLE. It holds NO certification for ALC_SPIRITS."
            - "One reviewer with queue_specialties [POLITICAL], country_authorizations [US], max_concurrent_claims 2."
            - "Creative crNoDisc declares [POLITICAL_ISSUE, ALC_SPIRITS], targets US only, political_flag true and omits disclaimer_text."
            - "Creative crWithDisc is identical except that disclaimer_text is supplied."
            - "Both are screened with POLITICAL_ISSUE at 0.70 and ALC_SPIRITS at 0.60, so both route to the POLITICAL queue, and the reviewer claims both tasks."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "POLITICAL_ISSUE", title: "Political and social issue advertising", category_class: "REGULATED", base_severity_weight: 5.00, requires_disclaimer: true, confidence_auto_disapprove_threshold: 0.95, confidence_manual_threshold: 0.60, review_sla_hours: 12, default_queue: "POLITICAL" }
              as: PolicyAdmin
              captures: { pol_id: "$.data.id" }
            - call: "POST /ad-policy/policy-rules/${pol_id}/country-overrides"
              payload: { country_code: "US", disposition: "ALLOWED_WITH_DISCLAIMER", severity_multiplier: 1.00 }
              as: PolicyAdmin
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "ALC_SPIRITS", title: "Alcohol - spirits", category_class: "RESTRICTED", base_severity_weight: 6.00, requires_certification: true, requires_disclaimer: true, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.55, review_sla_hours: 48, default_queue: "REGULATED_CERT" }
              as: PolicyAdmin
              captures: { alc_id: "$.data.id" }
            - call: "POST /ad-policy/policy-rules/${alc_id}/country-overrides"
              payload: { country_code: "US", disposition: "RESTRICTED_CERT_REQUIRED", requires_license: true, requires_disclaimer: true, severity_multiplier: 1.50 }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Harbor Civic Media Inc", country_code: "US", industry_code: "POLITICAL_CONSULTING" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED", evidence_ref: "kyc-2026-0055" }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "BUSINESS_STANDING", outcome: "VERIFIED", evidence_ref: "reg-2026-0055" }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "POLITICAL_ELIGIBILITY", outcome: "ELIGIBLE", evidence_ref: "fec-2026-0055" }
              as: PolicyAdmin
            - call: "POST /ad-policy/reviewers"
              payload: { display_name: "Rev Political US", queue_specialties: ["POLITICAL"], country_authorizations: ["US"], max_concurrent_claims: 2 }
              as: PolicyAdmin
              captures: { rev_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Vote yes on measure 4", body_text: "Our coalition urges a yes vote, sponsored with spirits industry support.", declared_category_codes: ["POLITICAL_ISSUE", "ALC_SPIRITS"], target_country_codes: ["US"], landing_page_url: "https://www.harborcivic.example/m4", display_url: "https://www.harborcivic.example/m4", political_flag: true }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_nodisc_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Vote yes on measure 4 today", body_text: "Same coalition message with spirits industry support disclosed.", declared_category_codes: ["POLITICAL_ISSUE", "ALC_SPIRITS"], target_country_codes: ["US"], landing_page_url: "https://www.harborcivic.example/m4b", display_url: "https://www.harborcivic.example/m4b", political_flag: true, disclaimer_text: "Paid for by Harbor Civic Media Inc. 21+ only." }
