# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Livestock Health Certificate & Interstate Movement
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: cvi_fee_provisional_vs_final_on_premises_upgrade
        grounds:
          - calculations.cvi_issuance_fee
          - entities.Certificate.fields.provisional_fee_cents
          - entities.Certificate.fields.final_fee_cents
        distinguishing_aspect: |
          Certificate-domain dual variant: the provisional variant evaluates the
          origin premises' disease_status at submit (MONITORED -> +1000 surcharge)
          while the final variant re-evaluates at issue after accredit flips the
          premises to ACCREDITED_FREE, so identical certificate data yields
          provisional_fee_cents 5000 but final_fee_cents 4000.
        test_recipe:
          setup:
            - "Premises P (Yolo/CA, CATTLE, 20 head, MONITORED); accredited vet V (expires 2027-01-01)"
            - "KS/CATTLE matrix row: BRUCELLOSIS, validity 30d, vaccination required >=14d, permit required, effective 2026-06-01"
            - "NEGATIVE test 2026-07-12; clock at 2026-08-10; certificate head_count 10, inspection 2026-08-10, vaccination 2026-07-12, submitted (provisional = 2500 + 150*10 + 1000 = 5000)"
            - "Premises accredited to ACCREDITED_FREE before issue"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch A", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 20, disease_status: "MONITORED" }
              as: ProgramAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Ada", accreditation_number: "ACCRED-1", accreditation_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_validity_days: 30, vaccination_required: true, vaccination_min_days_before_inspection: 14, permit_required: true, effective_from: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/test-records"
              payload: { premises_id: "${prem_id}", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_date: "2026-07-12T00:00:00Z", lab_reference: "LAB-1" }
              as: LabTechnician
              captures: { test_id: $.data.id }
            - call: "POST /api/test-records/${test_id}/result"
              payload: { result: "NEGATIVE" }
              as: LabTechnician
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "${prem_id}", destination_state_code: "KS", species_code: "CATTLE", head_count: 10, inspection_date: "2026-08-10T00:00:00Z", test_record_id: "${test_id}", vaccination_date: "2026-07-12T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /api/certificates/${cert_id}/submit"
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { prov_fee: $.data.provisional_fee_cents }
            - call: "POST /api/premises/${prem_id}/accredit"
              as: StateVetOfficer
          trigger:
            - call: "POST /api/certificates/${cert_id}/issue"
              as: StateVetOfficer
              captures: { final_fee: $.data.final_fee_cents, cvi: $.data.cvi_number, valid_until: $.data.valid_until }
          assert:
            - "Certificate.${cert_id}.provisional_fee_cents == 5000"
            - "Certificate.${cert_id}.final_fee_cents == 4000"
            - "final_fee_cents == provisional_fee_cents - 1000 (MONITORED surcharge dropped after accredit)"
            - "Certificate.${cert_id}.cvi_number == 'CVI-CA-000001'"
            - "Certificate.${cert_id}.valid_until == '2026-09-09T00:00:00Z' (issued_at 2026-08-10 + 30 days)"

      - name: permit_headroom_committed_vs_projected_diverge
        grounds:
          - calculations.permit_headroom
          - entities.MovementPermit.fields.committed_headroom
          - entities.MovementPermit.fields.projected_headroom
        distinguishing_aspect: |
          Permit-domain dual variant (different entity domain from the fee
          instance): with one SCHEDULED record of 6 against allocation 20, the
          committed variant counts SCHEDULED capacity (headroom 14) while the
          projected variant counts only IN_TRANSIT/DELIVERED (headroom 20) —
          same underlying rows, two valid readings, different numbers.
        test_recipe:
          setup:
            - "Issued certificate (10 head CATTLE, Yolo premises, KS destination) at clock 2026-08-10; permit allocated 20, window [2026-08-11, 2026-09-08], ISSUED"
            - "One SCHEDULED movement record of 6 head"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch B", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 30, disease_status: "MONITORED" }
              as: ProgramAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Ada", accreditation_number: "ACCRED-1", accreditation_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_validity_days: 30, vaccination_required: true, vaccination_min_days_before_inspection: 14, permit_required: true, effective_from: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/test-records"
              payload: { premises_id: "${prem_id}", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_date: "2026-07-12T00:00:00Z", lab_reference: "LAB-1" }
              as: LabTechnician
              captures: { test_id: $.data.id }
            - call: "POST /api/test-records/${test_id}/result"
              payload: { result: "NEGATIVE" }
              as: LabTechnician
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "${prem_id}", destination_state_code: "KS", species_code: "CATTLE", head_count: 10, inspection_date: "2026-08-10T00:00:00Z", test_record_id: "${test_id}", vaccination_date: "2026-07-12T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /api/certificates/${cert_id}/submit"
              as: AccreditedVet
              as_user_id: "${vet_id}"
            - call: "POST /api/certificates/${cert_id}/issue"
              as: StateVetOfficer
            - call: "POST /api/movement-permits"
              payload: { certificate_id: "${cert_id}", allocated_head_count: 20, valid_from: "2026-08-11T00:00:00Z", valid_until: "2026-09-08T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { perm_id: $.data.id }
            - call: "POST /api/movement-permits/${perm_id}/issue"
              as: StateVetOfficer
            - call: "POST /api/movement-records"
              payload: { permit_id: "${perm_id}", head_count: 6, destination_name: "KS Feedlot", planned_ship_date: "2026-08-21T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
          trigger:
            - call: "GET /api/movement-permits/${perm_id}"
              as: StateAuditor
              captures: { committed: $.data.committed_headroom, projected: $.data.projected_headroom }
          assert:
            - "MovementPermit.${perm_id}.committed_headroom == 14 (20 - 6 SCHEDULED)"
            - "MovementPermit.${perm_id}.projected_headroom == 20 (SCHEDULED not counted)"
            - "committed_headroom != projected_headroom for identical underlying MovementRecord rows"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: cvi_fee_tiered_surcharge_cap_combination
        grounds:
          - calculations.cvi_issuance_fee
        distinguishing_aspect: |
          Mode (a) combinatorial: four inputs (head_count, species tier rate,
          premises-status surcharge, cap) interact non-linearly via
          min(CAP, BASE + rate*head + surcharge) — a 200-head ACCREDITED_FREE
          consignment clamps at the 20000 cap while a 110-head MONITORED
          consignment lands exactly on 20000 with no clamping effect.
        test_recipe:
          setup:
            - "Premises P1 (ACCREDITED_FREE, 250 head) and P2 (MONITORED, 150 head), both Yolo/CA CATTLE; vet; KS matrix row (validity 30d, vax >=14d); NEGATIVE test per premises; clock 2026-08-10"
            - "cert1 on P1 head_count 200: raw = 2500 + 150*200 + 0 = 32500 -> capped 20000"
            - "cert2 on P2 head_count 110: raw = 2500 + 150*110 + 1000 = 20000 -> exactly at cap"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch Free", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 250, disease_status: "ACCREDITED_FREE" }
              as: ProgramAdmin
              captures: { prem1_id: $.data.id }
            - call: "POST /api/premises"
              payload: { name: "Ranch Mon", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 150, disease_status: "MONITORED" }
              as: ProgramAdmin
              captures: { prem2_id: $.data.id }
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Ada", accreditation_number: "ACCRED-1", accreditation_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_validity_days: 30, vaccination_required: true, vaccination_min_days_before_inspection: 14, permit_required: true, effective_from: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/test-records"
              payload: { premises_id: "${prem1_id}", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_date: "2026-07-12T00:00:00Z", lab_reference: "LAB-1" }
              as: LabTechnician
              captures: { test1_id: $.data.id }
            - call: "POST /api/test-records/${test1_id}/result"
              payload: { result: "NEGATIVE" }
              as: LabTechnician
            - call: "POST /api/test-records"
              payload: { premises_id: "${prem2_id}", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_date: "2026-07-12T00:00:00Z", lab_reference: "LAB-2" }
              as: LabTechnician
              captures: { test2_id: $.data.id }
            - call: "POST /api/test-records/${test2_id}/result"
              payload: { result: "NEGATIVE" }
              as: LabTechnician
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "${prem1_id}", destination_state_code: "KS", species_code: "CATTLE", head_count: 200, inspection_date: "2026-08-10T00:00:00Z", test_record_id: "${test1_id}", vaccination_date: "2026-07-12T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { cert1_id: $.data.id }
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "${prem2_id}", destination_state_code: "KS", species_code: "CATTLE", head_count: 110, inspection_date: "2026-08-10T00:00:00Z", test_record_id: "${test2_id}", vaccination_date: "2026-07-12T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { cert2_id: $.data.id }
          trigger:
            - call: "POST /api/certificates/${cert1_id}/submit"
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { fee1: $.data.provisional_fee_cents }
            - call: "POST /api/certificates/${cert2_id}/submit"
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { fee2: $.data.provisional_fee_cents }
          assert:
            - "Certificate.${cert1_id}.provisional_fee_cents == 20000 (raw 32500 clamped by FEE_CAP_CENTS)"
            - "Certificate.${cert2_id}.provisional_fee_cents == 20000 (raw exactly 20000: 2500 + 16500 + 1000, boundary where clamp has no effect)"

      - name: movement_fee_per_line_rounding_pinned
        grounds:
          - calculations.movement_fee_reconciliation
          - entities.MovementRecord.fields.movement_fee_cents
          - entities.MovementPermit.fields.total_movement_fees_cents
        distinguishing_aspect: |
          Mode (b) combinatorial (different mode from the fee-tier instance):
          rounding order is pinned per-line — two 3-head CATTLE records each
          round 137.5*3 = 412.5 up to 413 before summation, giving 826;
          the rejected sum-then-round reading would give 825.
        test_recipe:
          setup:
            - "Issued certificate (10 head CATTLE) at clock 2026-08-10; ISSUED permit allocated 10, window [2026-08-11, 2026-09-08]"
            - "Two SCHEDULED movement records of 3 head each"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch C", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 30, disease_status: "MONITORED" }
              as: ProgramAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Ada", accreditation_number: "ACCRED-1", accreditation_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_validity_days: 30, vaccination_required: true, vaccination_min_days_before_inspection: 14, permit_required: true, effective_from: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/test-records"
              payload: { premises_id: "${prem_id}", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_date: "2026-07-12T00:00:00Z", lab_reference: "LAB-1" }
              as: LabTechnician
              captures: { test_id: $.data.id }
            - call: "POST /api/test-records/${test_id}/result"
              payload: { result: "NEGATIVE" }
              as: LabTechnician
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "${prem_id}", destination_state_code: "KS", species_code: "CATTLE", head_count: 10, inspection_date: "2026-08-10T00:00:00Z", test_record_id: "${test_id}", vaccination_date: "2026-07-12T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /api/certificates/${cert_id}/submit"
              as: AccreditedVet
              as_user_id: "${vet_id}"
            - call: "POST /api/certificates/${cert_id}/issue"
              as: StateVetOfficer
            - call: "POST /api/movement-permits"
              payload: { certificate_id: "${cert_id}", allocated_head_count: 10, valid_from: "2026-08-11T00:00:00Z", valid_until: "2026-09-08T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { perm_id: $.data.id }
            - call: "POST /api/movement-permits/${perm_id}/issue"
              as: StateVetOfficer
          trigger:
            - call: "POST /api/movement-records"
              payload: { permit_id: "${perm_id}", head_count: 3, destination_name: "KS Feedlot", planned_ship_date: "2026-08-21T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { rec1_fee: $.data.movement_fee_cents }
            - call: "POST /api/movement-records"
              payload: { permit_id: "${perm_id}", head_count: 3, destination_name: "KS Feedlot", planned_ship_date: "2026-08-22T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { rec2_fee: $.data.movement_fee_cents }
            - call: "GET /api/movement-permits/${perm_id}"
              as: StateAuditor
              captures: { total_fees: $.data.total_movement_fees_cents }
          assert:
            - "MovementRecord 1.movement_fee_cents == 413 (round_half_up(3 * 137.5) = round_half_up(412.5))"
            - "MovementRecord 2.movement_fee_cents == 413"
            - "MovementPermit.${perm_id}.total_movement_fees_cents == 826 (per-line rounding; sum-then-round would yield 825)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: certificate_revision_cycle_returns_to_draft
        grounds:
          - state_machines.Certificate.PENDING_REVIEW_to_REJECTED
          - state_machines.Certificate.REJECTED_to_DRAFT
          - state_machines.Certificate.DRAFT_to_PENDING_REVIEW
        distinguishing_aspect: |
          Certificate machine is cyclic: DRAFT -> PENDING_REVIEW -> REJECTED ->
          DRAFT -> PENDING_REVIEW; the loop restores submittability and clears
          reject_reason, which a linear pipeline could never exercise.
        test_recipe:
          setup:
            - "Standard Yolo CATTLE premises/vet/matrix/NEGATIVE-test fixtures; clock 2026-08-10; certificate submitted then rejected with reason_code INCOMPLETE"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch D", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 20, disease_status: "MONITORED" }
              as: ProgramAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Ada", accreditation_number: "ACCRED-1", accreditation_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_validity_days: 30, vaccination_required: true, vaccination_min_days_before_inspection: 14, permit_required: true, effective_from: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/test-records"
              payload: { premises_id: "${prem_id}", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_date: "2026-07-12T00:00:00Z", lab_reference: "LAB-1" }
              as: LabTechnician
              captures: { test_id: $.data.id }
            - call: "POST /api/test-records/${test_id}/result"
              payload: { result: "NEGATIVE" }
              as: LabTechnician
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "${prem_id}", destination_state_code: "KS", species_code: "CATTLE", head_count: 10, inspection_date: "2026-08-10T00:00:00Z", test_record_id: "${test_id}", vaccination_date: "2026-07-12T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /api/certificates/${cert_id}/submit"
              as: AccreditedVet
              as_user_id: "${vet_id}"
            - call: "POST /api/certificates/${cert_id}/reject"
              payload: { reason_code: "INCOMPLETE" }
              as: StateVetOfficer
          trigger:
            - call: "POST /api/certificates/${cert_id}/revise"
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { st_after_revise: $.data.status }
            - call: "POST /api/certificates/${cert_id}/submit"
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { st_after_resubmit: $.data.status, prov2: $.data.provisional_fee_cents }
          assert:
            - "Certificate.${cert_id}.status == 'DRAFT' after revise (loop back)"
            - "Certificate.${cert_id}.reject_reason == null after revise"
            - "Certificate.${cert_id}.status == 'PENDING_REVIEW' after resubmission"
            - "Certificate.${cert_id}.provisional_fee_cents == 5000 (recomputed on the second submit)"

      - name: outbreak_zone_reescalation_cycle
        grounds:
          - state_machines.OutbreakZone.MONITORING_to_ACTIVE
          - state_machines.OutbreakZone.ACTIVE_to_CONTAINED
          - state_machines.OutbreakZone.CONTAINED_to_ACTIVE
        distinguishing_aspect: |
          OutbreakZone machine (a different entity from Certificate) is cyclic:
          MONITORING -> ACTIVE -> CONTAINED -> ACTIVE; the CONTAINED -> ACTIVE
          re-escalation arc distinguishes it from any fork-only branching shape.
        test_recipe:
          setup:
            - "Empty DB; default clock 2026-08-01"
          setup_api_calls:
            - call: "POST /api/outbreak-zones"
              payload: { county: "Colusa", state_code: "CA", disease_code: "AVIAN_INFLUENZA", species_code: "POULTRY", severity: "MODERATE", effective_from: "2026-08-01T00:00:00Z" }
              as: StateVetOfficer
              captures: { zone_id: $.data.id, st0: $.data.status }
          trigger:
            - call: "POST /api/outbreak-zones/${zone_id}/escalate"
              as: StateVetOfficer
              captures: { st1: $.data.status }
            - call: "POST /api/outbreak-zones/${zone_id}/contain"
              as: StateVetOfficer
              captures: { st2: $.data.status }
            - call: "POST /api/outbreak-zones/${zone_id}/escalate"
              as: StateVetOfficer
              captures: { st3: $.data.status }
          assert:
            - "OutbreakZone.${zone_id}.status sequence == MONITORED -> ACTIVE -> CONTAINED -> ACTIVE"
            - "Second escalate succeeds with HTTP 200, proving the CONTAINED -> ACTIVE cycle arc exists"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: outbreak_escalate_cascades_three_levels
        grounds:
          - state_machines.OutbreakZone.MONITORING_to_ACTIVE
          - state_machines.Certificate.ISSUED_to_ENTRY_BLOCKED
          - state_machines.MovementPermit.ISSUED_to_SUSPENDED
        distinguishing_aspect: |
          Depth-3 causal chain from the escalate trigger: zone -> ACTIVE mutates
          premises to QUARANTINE_HOLD (link 1); the premises hold blocks its
          ISSUED certificate to ENTRY_BLOCKED (link 2); the certificate block
          suspends its ISSUED permit to SUSPENDED (link 3) — each link caused by
          the previous mutation, not fan-out from the original call.
        test_recipe:
          setup:
            - "Yolo/CA CATTLE premises (20 head, MONITORED); issued certificate (10 head) at clock 2026-08-10; ISSUED permit allocated 10, window [2026-08-11, 2026-09-08]"
            - "MONITORING zone covering (Yolo, VESICULAR_STOMATITIS, CATTLE), effective 2026-08-01 open-ended"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch E", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 20, disease_status: "MONITORED" }
              as: ProgramAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /api/veterinarians"
