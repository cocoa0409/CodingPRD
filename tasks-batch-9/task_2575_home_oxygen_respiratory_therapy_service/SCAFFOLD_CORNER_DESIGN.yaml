            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", spo2_percent: 87, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { qt_id: $.data.id }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_id}", form_type: "INITIAL", prescribed_lpm: 3.0, hours_per_day: 24, portable_prescribed: true, length_of_need_months: 99, narrative_element_count: 3, expected_patient_version: "${p_ver}" }
              as: IntakeCoordinator
              captures: { cmn_id: $.data.id }
            - call: "POST /home-oxygen/cmns/${cmn_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "u-phys-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/approve"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "u-audit-1"
            - call: "POST /home-oxygen/rental-contracts"
              payload: { patient_id: "${p_id}", cmn_id: "${cmn_id}", pricing_basis: "COMPETITIVE_BID_SINGLE_PAYMENT", cap_month_limit: 36 }
              as: BillingSpecialist
              captures: { c_id: $.data.id, c_ver: $.data.version }
          trigger:
            - call: "POST /home-oxygen/rental-contracts/${c_id}/travel-authorizations"
              payload: { receiving_branch_id: "${b1}", destination_altitude_feet: 500, depart_utc: "2026-08-02T00:00:00Z", return_utc: "2026-08-03T06:00:00Z", expected_contract_version: "${c_ver}" }
              as: IntakeCoordinator
              captures: { e_branch: $.data.error_id }
            - call: "POST /home-oxygen/rental-contracts/${c_id}/travel-authorizations"
              payload: { receiving_branch_id: "${b2}", destination_altitude_feet: 500, depart_utc: "2026-08-02T00:00:00Z", return_utc: "2026-08-02T00:00:00Z", expected_contract_version: "${c_ver}" }
              as: IntakeCoordinator
              captures: { e_interval: $.data.error_id }
            - call: "POST /home-oxygen/rental-contracts/${c_id}/travel-authorizations"
              payload: { receiving_branch_id: "${b2}", destination_altitude_feet: 500, depart_utc: "2026-08-05T00:00:00Z", return_utc: "2026-08-06T07:00:00Z", expected_contract_version: "${c_ver}" }
              as: IntakeCoordinator
              captures: { e_limit: $.data.error_id }
            - call: "POST /home-oxygen/rental-contracts/${c_id}/travel-authorizations"
              payload: { receiving_branch_id: "${b2}", destination_altitude_feet: 500, depart_utc: "2026-08-02T00:00:00Z", return_utc: "2026-08-03T06:00:00Z", expected_contract_version: "${c_ver}" }
              as: IntakeCoordinator
              captures: { ta_id: $.data.id, ta_cyl: $.data.supply_cylinders_authorized, ta_hours: $.data.trip_hours, ta_req: $.data.required_liters, ta_status: $.data.status }
