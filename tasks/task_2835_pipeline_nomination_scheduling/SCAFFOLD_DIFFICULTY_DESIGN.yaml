  - rule_id: non_linear_state_machine
    instances:
      - name: nomination_revision_loop_returns_to_submitted_and_then_locks
        grounds:
          - state_machines.Nomination.PRORATED_to_REVISION_REQUESTED
          - state_machines.Nomination.REVISION_REQUESTED_to_SUBMITTED
          - entities.Nomination.fields.revision_count
          - validations[priority=40]
          - validations[priority=63]
        distinguishing_aspect: |
          A cyclic re-entry on the Nomination aggregate: the row leaves SUBMITTED, reaches PRORATED,
          and is driven back to the SUBMITTED state it already occupied, with revision_count as the
          loop counter (0 -> 1); the loop's termination condition is that request-revision from
          SUBMITTED is refused with ERR_NOMINATION_INVALID_STATE.
        test_recipe:
          setup:
            - "Segment HOU-NAS with effective capacity 100000 bbl and linefill funded to 20000 bbl."
            - "ALPHA has two FINAL history rows (30000, 42000) so its history base is 36000 bbl."
            - "ALPHA nominated 70000 bbl of ULSD; the cycle is CLOSED and then PRORATED, so the nomination holds allocated_bbl 70000 and the cycle holds 30000 bbl unallocated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TariffAdministrator
