              as: StateProgramAdmin
              captures: { nu_id: "$.data.id", posture0: "$.data.operational_posture", avail0: "$.data.available_bed_count" }
            - call: "POST /svh/applicants"
              payload: { veterans_home_id: "${home_id}", full_name: "Greta Lindahl", date_of_birth: "1945-02-02", service_days: 900, discharge_character: "HONORABLE", wartime_service: true, service_connected_disability_pct: 80, nursing_care_for_service_connected: false, state_residency_years: 8, requested_care_level: "NURSING", application_received_date: "2026-08-01" }
              as: AdmissionsCoordinator
              captures: { app_id: "$.data.id" }
            - call: "POST /svh/applicants/${app_id}/eligibility-determination"
              payload: {}
              as: AdmissionsCoordinator
            - call: "POST /svh/waitlist-entries"
              payload: { applicant_id: "${app_id}", care_unit_id: "${nu_id}" }
              as: AdmissionsCoordinator
              captures: { w_id: "$.data.id", w_status0: "$.data.status" }
            - call: "POST /svh/applicants/${app_id}/clinical-assessments"
              payload: { assessed_care_level: "NURSING", adl_dependency_count: 4, cognitive_impairment: true, behavioral_risk_flag: false, skilled_nursing_hours_per_day: 3.00, assessment_date: "2026-08-01" }
              as: ClinicalAssessor
              as_user_id: "assessor-1"
              captures: { asmt_id: "$.data.id" }
            - call: "POST /svh/clinical-assessments/${asmt_id}/submit"
              payload: {}
              as: ClinicalAssessor
              as_user_id: "assessor-1"
          trigger:
            - call: "POST /svh/_ops/census-run"
              payload: { through_date: "2026-08-01" }
              as: StateProgramAdmin
              captures: { offered1: "$.data.offered_waitlist_entry_count", expired1: "$.data.expired_offer_count" }
            - call: "GET /svh/care-units/${nu_id}/waitlist-entries"
              payload: { status: "OFFERED" }
              as: AdmissionsCoordinator
              captures: { off_total: "$.meta.total_count", off_id: "$.data[0].id", off_expires: "$.data[0].offer_expires_at", off_pos: "$.data[0].queue_position" }
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/_ops/census-run"
              payload: { through_date: "2026-08-09" }
              as: StateProgramAdmin
              captures: { offered2: "$.data.offered_waitlist_entry_count", expired2: "$.data.expired_offer_count" }
            - call: "GET /svh/applicants/${app_id}/waitlist-entries"
              payload: { limit: 10 }
              as: AdmissionsCoordinator
              captures: { w_status2: "$.data[0].status", w_expires2: "$.data[0].offer_expires_at" }
            - call: "GET /svh/applicants/${app_id}"
              payload: {}
              as: AdmissionsCoordinator
              captures: { declined2: "$.data.declined_offer_count" }
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/_ops/census-run"
              payload: { through_date: "2026-08-10" }
              as: StateProgramAdmin
              captures: { offered3: "$.data.offered_waitlist_entry_count", expired3: "$.data.expired_offer_count" }
