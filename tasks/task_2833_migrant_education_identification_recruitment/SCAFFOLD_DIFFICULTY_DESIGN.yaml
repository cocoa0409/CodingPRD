      - name: assignment_activation_rechecks_live_recruiter_and_area_status
        grounds:
          - validations[priority 22 ERR_RECRUITER_NOT_ACTIVE]
          - validations[priority 23 ERR_AREA_NOT_OPEN]
          - state_machines.RecruiterAssignment.PLANNED_to_ACTIVE
          - endpoints[POST /mep/recruiter-assignments/{assignment_id}/activate]
          - endpoints[PATCH /mep/recruiters/{recruiter_id}]
          - endpoints[PATCH /mep/areas/{area_id}]
        distinguishing_aspect: |
          A THIRD dependency shape: the guarded transition depends on TWO sibling entities at once
          and, unlike the two instances above, both were valid when the row was created and are
          invalidated afterwards - so an implementation that caches the create-time check passes
          creation and wrongly activates. The two gates are also ordered against each other:
          with the recruiter SUSPENDED and the area CLOSED in the same stored state, priority 22's
          ERR_RECRUITER_NOT_ACTIVE must win over priority 23's ERR_AREA_NOT_OPEN.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea with recruiter_capacity 3 and peak season 2026-06-01..2026-09-30"
            - "one ACTIVE Recruiter"
            - "one PLANNED PRIMARY assignment created while both parents were valid"
            - "the recruiter is then SUSPENDED and the area is then CLOSED, both after creation"
          setup_api_calls:
            - call: "POST /mep/areas"
