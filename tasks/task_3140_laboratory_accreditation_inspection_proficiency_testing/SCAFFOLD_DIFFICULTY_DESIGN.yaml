        distinguishing_aspect: "state (priority 4) vs business_temporal (priority 7): a PT result submitted to a shipment that is BOTH already CLOSED (admin-closed) AND past its due_at must fail with ERR_SHIPMENT_CLOSED (409), never ERR_SUBMISSION_DEADLINE_PASSED — the state precondition is checked before any temporal check."
