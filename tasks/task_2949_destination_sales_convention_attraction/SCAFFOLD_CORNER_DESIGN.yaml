      - name: servicing_lifecycle_rejects_deliver_before_schedule_and_after_delivery
        claim_type: invalid_transition
        grounds:
          - state_machines[ServicingOrder REQUESTED -> SCHEDULED]
          - state_machines[ServicingOrder SCHEDULED -> DELIVERED]
          - errors[ERR_INVALID_SERVICING_STATE]
        distinguishing_aspect: "The order must walk REQUESTED -> SCHEDULED -> DELIVERED: delivering a REQUESTED order is 409 ERR_INVALID_SERVICING_STATE, and delivering or cancelling an already DELIVERED order is the same 409 because DELIVERED is terminal."
        test_recipe:
          setup:
            - "CANONICAL DEFINITE CHAIN, then two servicing orders on ${opp_id}: HOUSING 900 units (${so_housing_id}) and TRANSPORTATION 20 units (${so_transport_id})"
          setup_api_calls:
            - call: "POST /servicing-orders"
              payload: { opportunity_id: "${opp_id}", category: "HOUSING", requested_units: 900, window_start: "2028-04-09T00:00:00Z", window_end: "2028-04-13T00:00:00Z" }
              as: ServicesManager
              captures: { so_housing_id: $.data.id, so_status_0: $.data.status, assigned_0: $.data.assigned_units }
            - call: "POST /servicing-orders"
              payload: { opportunity_id: "${opp_id}", category: "TRANSPORTATION", requested_units: 20, window_start: "2028-04-09T00:00:00Z", window_end: "2028-04-13T00:00:00Z" }
              as: ServicesManager
              captures: { so_transport_id: $.data.id }
          trigger:
            - call: "POST /servicing-orders/${so_housing_id}/deliver"
              payload: { delivered_units: 880 }
              as: ServicesManager
              captures: { err_early: $.data.error_id }
            - call: "POST /servicing-orders/${so_housing_id}/schedule"
              payload: { assigned_units: 880 }
              as: ServicesManager
              captures: { sched_status: $.data.status, assigned_1: $.data.assigned_units }
            - call: "POST /servicing-orders/${so_housing_id}/deliver"
              payload: { delivered_units: 860 }
              as: ServicesManager
              captures: { del_status: $.data.status, delivered_1: $.data.delivered_units }
            - call: "POST /servicing-orders/${so_housing_id}/deliver"
              payload: { delivered_units: 860 }
              as: ServicesManager
              captures: { err_again: $.data.error_id }
            - call: "POST /servicing-orders/${so_housing_id}/cancel"
              payload: {}
              as: ServicesManager
              captures: { err_cancel: $.data.error_id }
          assert:
            - "${so_status_0} == REQUESTED and ${assigned_0} == null"
            - "first deliver: HTTP 409 and ${err_early} == ERR_INVALID_SERVICING_STATE"
            - "${sched_status} == SCHEDULED with ${assigned_1} == 880, then ${del_status} == DELIVERED with ${delivered_1} == 860"
            - "second deliver: HTTP 409 and ${err_again} == ERR_INVALID_SERVICING_STATE; cancel: HTTP 409 and ${err_cancel} == ERR_INVALID_SERVICING_STATE"
            - "GET /opportunities/${opp_id} still shows sales_stage DEFINITE - ${so_transport_id} is still REQUESTED, so no bubble-up fires"

      - name: serviced_bubble_up_fires_only_when_the_last_active_order_clears
        claim_type: bubble_up
        grounds:
          - state_machines[Opportunity sales_stage DEFINITE -> SERVICED]
          - state_machines[SpaceHold CONFIRMED -> RELEASED]
          - endpoints[POST /servicing-orders/{id}/cancel]
        distinguishing_aspect: "The parent transition is driven by the children's aggregate state, and a CANCELLED sibling counts as cleared: with HOUSING DELIVERED and TRANSPORTATION still REQUESTED the opportunity stays DEFINITE, and only cancelling TRANSPORTATION bubbles it to SERVICED - which then releases the CONFIRMED hall hold with EVENT_SERVICED, releases the three COMMITTED blocks and disburses the 12600.00 fund charge."
        test_recipe:
          setup:
            - "the end state of servicing_lifecycle_rejects_deliver_before_schedule_and_after_delivery: ${opp_id} DEFINITE, ${so_housing_id} DELIVERED, ${so_transport_id} REQUESTED, ${hold_a_id} CONFIRMED, fund committed 12600.00 / disbursed 0.00"
          setup_api_calls:
            - call: "GET /opportunities/${opp_id}"
              payload: {}
              as: SalesManager
              captures: { stage_before: $.data.sales_stage }
            - call: "GET /incentive-funds/${fund_id}"
              payload: {}
              as: BoardAnalyst
              captures: { committed_before: $.data.committed_amount, disbursed_before: $.data.disbursed_amount }
          trigger:
            - call: "POST /servicing-orders/${so_transport_id}/cancel"
              payload: {}
              as: ServicesManager
              captures: { cancel_status: $.data.status }
            - call: "GET /opportunities/${opp_id}"
              payload: {}
              as: SalesManager
              captures: { stage_after: $.data.sales_stage, posture_after: $.data.hold_posture, attrition: $.data.attrition_settlement_amount }
            - call: "GET /space-holds/${hold_a_id}"
              payload: {}
              as: CenterScheduler
              captures: { hold_status: $.data.status, hold_reason: $.data.release_reason }
            - call: "GET /room-block-commitments?opportunity_id=${opp_id}&status=RELEASED"
              payload: {}
              as: SalesManager
              captures: { first_released: "$.data[0].status" }
            - call: "GET /incentive-funds/${fund_id}"
              payload: {}
              as: BoardAnalyst
              captures: { committed_after: $.data.committed_amount, disbursed_after: $.data.disbursed_amount, uncommitted_after: $.data.uncommitted_amount }
          assert:
            - "${stage_before} == DEFINITE and ${cancel_status} == CANCELLED"
            - "${stage_after} == SERVICED - a DELIVERED sibling plus a CANCELLED sibling satisfies the bubble-up precondition"
            - "${hold_status} == RELEASED and ${hold_reason} == EVENT_SERVICED; CenterHall.${hall_id}.confirmed_hold_count == 0"
            - "${posture_after} == CONFIRMED - the posture dimension is not rewound by servicing"
            - "the RELEASED commitment list has total_count == 3 and ${first_released} == RELEASED; Hotel.${hotel_a_id}.committed_peak_rooms == 0"
            - "${committed_before} == 12600.00, ${disbursed_before} == 0.00, ${committed_after} == 0.00, ${disbursed_after} == 12600.00 and ${uncommitted_after} == 487400.00 - the charge moved, it was not re-spent"
            - "${attrition} is frozen at this moment by calculations.attrition_settlement and no longer changes on re-read"
            - "a further POST /servicing-orders for ${opp_id} now returns HTTP 409 ERR_INVALID_OPPORTUNITY_STAGE - SERVICED is terminal"

