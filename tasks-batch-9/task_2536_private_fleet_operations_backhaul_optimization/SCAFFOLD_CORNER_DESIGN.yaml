        grounds:
          - errors.ERR_ZERO_PAY_SETTLEMENT
          - validations[priority 16]
        distinguishing_aspect: "The money objection is the last rule in the ladder, so it is only observable once every structural and state gate has passed: a statement legitimately accrued at gross 0 under an all-zero pay plan is refused at settle time with ERR_ZERO_PAY_SETTLEMENT and stays ACCRUED, while reversal - which carries no fiscal floor - still works."
