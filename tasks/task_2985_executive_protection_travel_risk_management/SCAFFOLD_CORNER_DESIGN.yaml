              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { pol_id: $.data.id }
            - call: "POST /exec-protection/insurance-policies/${pol_id}/verify"
              payload: { outcome: "VERIFY", verification_note: "first pass" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
