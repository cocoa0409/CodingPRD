  - { method: GET, path: "/margin/customers/{id}", description: "Get a customer", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: [], output: Customer, side_effects: [] }

  - { method: POST, path: "/margin/account-applications", description: "Customer submits a margin account application", roles: [Customer], code: 201, input: [customer_id, annual_income_cents, liquid_net_worth_cents, investment_experience_years], output: AccountApplication, side_effects: ["application_status = SUBMITTED"] }
  - { method: GET, path: "/margin/account-applications/{id}", description: "Get an application", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: [], output: AccountApplication, side_effects: [] }
  - { method: GET, path: "/margin/account-applications", description: "List applications (filterable by customer)", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: ["customer_id?", "account_id?", "limit?", "offset?"], output: "AccountApplication[]", side_effects: [] }
  - { method: POST, path: "/margin/account-applications/{id}/review", description: "MarginAnalyst moves application to compliance review", roles: [MarginAnalyst], code: 200, input: [], output: AccountApplication, side_effects: ["SUBMITTED -> COMPLIANCE_REVIEW; reviewed_by_user_id := X-User-ID"] }
  - { method: POST, path: "/margin/account-applications/{id}/approve", description: "MarginSupervisor approves; creates the MarginAccount", roles: [MarginSupervisor], code: 200, input: [], output: AccountApplication, side_effects: ["COMPLIANCE_REVIEW -> APPROVED; create MarginAccount ACTIVE; account_id set"] }
  - { method: POST, path: "/margin/account-applications/{id}/reject", description: "MarginSupervisor rejects", roles: [MarginSupervisor], code: 200, input: ["reason?"], output: AccountApplication, side_effects: ["COMPLIANCE_REVIEW -> REJECTED"] }
  - { method: POST, path: "/margin/account-applications/{id}/resubmit", description: "Customer resubmits a rejected application (cycle REJECTED -> SUBMITTED)", roles: [Customer], code: 200, input: ["annual_income_cents?", "liquid_net_worth_cents?", "investment_experience_years?"], output: AccountApplication, side_effects: ["REJECTED -> SUBMITTED; reviewer/decider reset"] }

  - { method: GET, path: "/margin/accounts/{id}", description: "Get a margin account incl. computed fields and version", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: [], output: MarginAccount, side_effects: [] }
  - { method: GET, path: "/margin/accounts", description: "List accounts (filterable)", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: ["customer_id?", "application_id?", "limit?", "offset?"], output: "MarginAccount[]", side_effects: [] }
  - { method: POST, path: "/margin/accounts/{id}/close", description: "Close a flat, call-free, zero-cash account", roles: [Customer], code: 200, input: [], output: MarginAccount, side_effects: ["account_status -> CLOSED"] }

  - { method: POST, path: "/margin/security-profiles", description: "Register a security with house margin policy", roles: [MarginSupervisor], code: 201, input: [symbol, marginable, house_maint_long_bps, house_maint_short_bps, liquidity_tier, concentration_threshold_bps], output: SecurityProfile, side_effects: [] }
  - { method: GET, path: "/margin/security-profiles/{id}", description: "Get a security profile", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: [], output: SecurityProfile, side_effects: [] }
  - { method: GET, path: "/margin/security-profiles", description: "List security profiles", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: ["limit?", "offset?"], output: "SecurityProfile[]", side_effects: [] }
  - { method: PATCH, path: "/margin/security-profiles/{id}", description: "Change house margin policy; recomputes official requirements and may issue calls for every holding account", roles: [MarginSupervisor], code: 200, input: ["house_maint_long_bps?", "house_maint_short_bps?", "concentration_threshold_bps?", "marginable?"], output: SecurityProfile, side_effects: ["Recompute official requirements for all accounts holding the security; run call evaluation for each affected account (may issue calls and flip account to RESTRICTED)"] }

  - { method: POST, path: "/margin/market-marks", description: "Post a price mark; REALTIME updates realtime fields only, OFFICIAL_CLOSE additionally runs call evaluation cascade (equity -> requirements -> call issuance -> account posture)", roles: [MarketDataOps], code: 201, input: [security_id, mark_type, price_cents], output: PriceMark, side_effects: ["Update mv_realtime_cents or mv_official_cents on all positions in the security", "Recompute account equity/requirement/buying-power fields for all holders", "OFFICIAL_CLOSE: run call_amount evaluation and one-open-per-type issuance; newly issued calls flip account ACTIVE -> RESTRICTED; satisfied OPEN calls cure with MARKET_RECOVERY"] }
  - { method: GET, path: "/margin/market-marks/{id}", description: "Get a price mark", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: [], output: PriceMark, side_effects: [] }
  - { method: GET, path: "/margin/market-marks", description: "List marks (filterable)", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: ["security_id?", "mark_type?", "limit?", "offset?"], output: "PriceMark[]", side_effects: [] }

  - { method: POST, path: "/margin/accounts/{id}/orders", description: "Place a market order, filled immediately at the security's latest REALTIME mark; updates/creates the Position, records a TradeFill, runs day-trade detection", roles: [Customer], code: 201, input: [security_id, side, quantity], output: Position, side_effects: ["Fill at latest REALTIME mark; cash_balance_cents updated (BUY debits, SELL/SELL_SHORT credits)", "Position quantity/avg_cost/day counters updated; TradeFill recorded", "Day-trade detection may create a DayTradeEvent", "Equity/requirement/buying-power fields recomputed (realtime and official)", "Opening orders require ACTIVE account, marginable security, PDT gate, and post-trade Reg T initial + house requirement satisfaction"] }
  - { method: GET, path: "/margin/accounts/{id}/positions", description: "List positions of an account", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: ["limit?", "offset?"], output: "Position[]", side_effects: [] }
  - { method: GET, path: "/margin/positions/{id}", description: "Get a position", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: [], output: Position, side_effects: [] }
  - { method: GET, path: "/margin/positions", description: "List positions (filterable)", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: ["account_id?", "security_id?", "limit?", "offset?"], output: "Position[]", side_effects: [] }
  - { method: GET, path: "/margin/accounts/{id}/fills", description: "List trade fills of an account", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: ["limit?", "offset?"], output: "TradeFill[]", side_effects: [] }
  - { method: GET, path: "/margin/fills/{id}", description: "Get a trade fill", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: [], output: TradeFill, side_effects: [] }
  - { method: GET, path: "/margin/fills", description: "List trade fills (filterable)", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: ["account_id?", "security_id?", "limit?", "offset?"], output: "TradeFill[]", side_effects: [] }
  - { method: GET, path: "/margin/accounts/{id}/day-trade-events", description: "List day-trade events of an account", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: ["limit?", "offset?"], output: "DayTradeEvent[]", side_effects: [] }
  - { method: GET, path: "/margin/day-trade-events/{id}", description: "Get a day-trade event", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: [], output: DayTradeEvent, side_effects: [] }
  - { method: GET, path: "/margin/day-trade-events", description: "List day-trade events (filterable)", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: ["account_id?", "security_id?", "limit?", "offset?"], output: "DayTradeEvent[]", side_effects: [] }

  - { method: GET, path: "/margin/accounts/{id}/margin-calls", description: "List margin calls of an account", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: ["call_status?", "limit?", "offset?"], output: "MarginCall[]", side_effects: [] }
  - { method: GET, path: "/margin/margin-calls/{id}", description: "Get a margin call", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: [], output: MarginCall, side_effects: [] }
  - { method: POST, path: "/margin/margin-calls/{id}/waive", description: "Supervisor waives an OPEN or EXPIRED call", roles: [MarginSupervisor], code: 200, input: [], output: MarginCall, side_effects: ["call_status -> WAIVED; cure_method WAIVER; account posture recheck"] }

  - { method: POST, path: "/margin/accounts/{id}/liquidation-orders", description: "Create liquidation order(s) against an EXPIRED call using the server selector policy; OCC-guarded", roles: [LiquidationDesk], code: 201, input: [call_id, expected_account_version], output: LiquidationOrder, side_effects: ["increments MarginAccount.version by 1", "Call EXPIRED -> LIQUIDATION_IN_PROGRESS", "Selector picks position(s); Position.reserved_qty += quantity; one order per selected position; response is the first-ranked order", "created_by_user_id := X-User-ID"] }
  - { method: GET, path: "/margin/liquidation-orders/{id}", description: "Get a liquidation order", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: [], output: LiquidationOrder, side_effects: [] }
  - { method: GET, path: "/margin/liquidation-orders", description: "List liquidation orders (filterable)", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: ["account_id?", "call_id?", "position_id?", "limit?", "offset?"], output: "LiquidationOrder[]", side_effects: [] }
  - { method: GET, path: "/margin/margin-calls/{id}/liquidation-orders", description: "List liquidation orders for a call", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: ["limit?", "offset?"], output: "LiquidationOrder[]", side_effects: [] }
  - { method: POST, path: "/margin/liquidation-orders/{id}/fill", description: "Fill a liquidation order (must be a different desk user than the creator)", roles: [LiquidationDesk], code: 200, input: [filled_quantity, fill_price_cents], output: LiquidationOrder, side_effects: ["Position quantity/reserved_qty reduced; cash credited; equity/requirements recomputed", "Call cure test (LIQUIDATION_IN_PROGRESS -> CURED; posture recheck)", "PENDING/PARTIALLY_FILLED -> PARTIALLY_FILLED or EXECUTED"] }
  - { method: POST, path: "/margin/liquidation-orders/{id}/cancel", description: "Cancel unfilled remainder; compensates the share reservation", roles: [LiquidationDesk], code: 200, input: [], output: LiquidationOrder, side_effects: ["Position.reserved_qty -= remaining quantity", "Call LIQUIDATION_IN_PROGRESS -> EXPIRED if no non-terminal orders remain"] }

  - { method: POST, path: "/margin/accounts/{id}/cash-movements", description: "Deposit, withdraw, or journal cash; OCC-guarded; deposits cure satisfied OPEN calls", roles: [Customer], code: 201, input: [movement_type, amount_cents, expected_account_version], output: CashMovement, side_effects: ["increments MarginAccount.version by 1", "cash_balance_cents updated; equity recomputed on both bases", "OPEN calls whose cure test now passes -> CURED with DEPOSIT; posture recheck", "WITHDRAWAL/JOURNAL_DEBIT: require ACTIVE, amount <= cash, post-action official binding excess >= 0"] }
  - { method: GET, path: "/margin/accounts/{id}/cash-movements", description: "List cash movements of an account", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: ["limit?", "offset?"], output: "CashMovement[]", side_effects: [] }
  - { method: GET, path: "/margin/cash-movements/{id}", description: "Get a cash movement", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: [], output: CashMovement, side_effects: [] }

  - { method: POST, path: "/margin/rate-tiers", description: "Create an effective-dated interest rate tier", roles: [MarginSupervisor], code: 201, input: [tier_level, min_balance_cents, annual_rate_bps, effective_from, effective_to], output: RateTier, side_effects: [] }
  - { method: GET, path: "/margin/rate-tiers/{id}", description: "Get a rate tier", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: [], output: RateTier, side_effects: [] }
  - { method: GET, path: "/margin/rate-tiers", description: "List rate tiers", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: ["limit?", "offset?"], output: "RateTier[]", side_effects: [] }
  - { method: GET, path: "/margin/accounts/{id}/interest-entries", description: "List interest ledger entries of an account", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: ["entry_type?", "limit?", "offset?"], output: "InterestLedgerEntry[]", side_effects: [] }
  - { method: GET, path: "/margin/interest-entries/{id}", description: "Get an interest ledger entry", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: [], output: InterestLedgerEntry, side_effects: [] }
  - { method: GET, path: "/margin/accounts/{id}/interest-summary", description: "Computed interest read: provisional estimate vs posted actuals", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: [], output: { debit_balance_cents: integer, current_daily_accrual_cents: integer, month_to_date_accrued_cents: integer, provisional_month_estimate_cents: integer, posted_month_total_cents: integer }, side_effects: [] }

  - { method: POST, path: "/margin/disputes", description: "Customer disputes an OPEN margin call", roles: [Customer], code: 201, input: [call_id, reason], output: Dispute, side_effects: ["MarginCall OPEN -> DISPUTED (expiry clock pauses while DISPUTED)", "dispute_status = OPEN"] }
  - { method: GET, path: "/margin/disputes/{id}", description: "Get a dispute", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: [], output: Dispute, side_effects: [] }
  - { method: GET, path: "/margin/disputes", description: "List disputes (filterable)", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: ["account_id?", "call_id?", "limit?", "offset?"], output: "Dispute[]", side_effects: [] }
  - { method: GET, path: "/margin/accounts/{id}/disputes", description: "List disputes of an account", roles: [Customer, MarginAnalyst, MarginSupervisor, LiquidationDesk, MarketDataOps], code: 200, input: ["limit?", "offset?"], output: "Dispute[]", side_effects: [] }
  - { method: POST, path: "/margin/disputes/{id}/start-review", description: "Analyst opens review", roles: [MarginAnalyst], code: 200, input: [], output: Dispute, side_effects: ["OPEN -> UNDER_REVIEW; reviewed_by_user_id := X-User-ID"] }
  - { method: POST, path: "/margin/disputes/{id}/request-info", description: "Analyst requests more info; cycle UNDER_REVIEW -> OPEN", roles: [MarginAnalyst], code: 200, input: [], output: Dispute, side_effects: ["UNDER_REVIEW -> OPEN; reviewed_by_user_id reset to null"] }
  - { method: POST, path: "/margin/disputes/{id}/decide", description: "Supervisor decides; decider must differ from reviewer", roles: [MarginSupervisor], code: 200, input: [decision], output: Dispute, side_effects: ["UNDER_REVIEW -> UPHELD/OVERTURNED -> CLOSED (auto)", "UPHELD: call DISPUTED -> OPEN, due_at unchanged", "OVERTURNED: call DISPUTED -> WAIVED; posture recheck"] }

  - { method: POST, path: "/_clock/set_current_utc", description: "Test-driving logical clock. Server default before any set: 2026-05-01T00:00:00Z; never falls back to wall clock. New time must be >= current time.", roles: [MarketDataOps], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["Sets the logical clock used by issued_at/due_at/sweeps/accruals"] }
  - { method: POST, path: "/_sweeps/daily", description: "Test-driving end-of-day sweep. Pinned order: (1) interest DAILY_ACCRUAL for debit accounts, MONTHLY_POST on month roll; (2) PDT flag evaluation; (3) call evaluation: issue new calls (official basis), cure satisfied OPEN calls (MARKET_RECOVERY), expire OPEN calls at/past due_at (DISPUTED calls do not expire); (4) interest-post cash debits feed step 3", roles: [MarketDataOps], code: 200, input: [], output: { calls_issued: integer, calls_cured: integer, calls_expired: integer, interest_accruals_created: integer, interest_posts_created: integer, pdt_flags_set: integer, pdt_flags_cleared: integer }, side_effects: ["All step-1..3 mutations cascade to account computed fields and posture"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing or role unrecognized" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, bad enum, or non-positive amount/quantity" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "AccountApplication id does not exist" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "MarginAccount id does not exist" }
  - { id: ERR_SECURITY_NOT_FOUND, http: 404, condition: "SecurityProfile id does not exist" }
  - { id: ERR_POSITION_NOT_FOUND, http: 404, condition: "Position id does not exist" }
  - { id: ERR_CALL_NOT_FOUND, http: 404, condition: "MarginCall id does not exist" }
  - { id: ERR_LIQUIDATION_ORDER_NOT_FOUND, http: 404, condition: "LiquidationOrder id does not exist" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "Dispute id does not exist" }
  - { id: ERR_RATE_TIER_NOT_FOUND, http: 404, condition: "RateTier id does not exist" }
  - { id: ERR_ACCOUNT_OWNERSHIP_MISMATCH, http: 403, condition: "X-User-ID is not the owning customer of the target resource" }
  - { id: ERR_ACCOUNT_CLOSED, http: 409, condition: "Operation requires a non-CLOSED account" }
  - { id: ERR_ACCOUNT_RESTRICTED, http: 409, condition: "Opening orders and withdrawals require account_status ACTIVE" }
  - { id: ERR_APPLICATION_INVALID_STATE, http: 409, condition: "Application not in a valid from-state for the invoked transition" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same X-User-ID attempted both halves of a controlled step (review+approve, create+fill, review+decide)" }
  - { id: ERR_SUITABILITY_NOT_MET, http: 422, condition: "Approval suitability: liquid net worth < 200000 cents or experience < 1 year" }
  - { id: ERR_ACCOUNT_ALREADY_EXISTS, http: 422, condition: "Customer already has a MarginAccount" }
  - { id: ERR_PDT_MIN_EQUITY, http: 403, condition: "PDT-flagged account with equity_realtime < 2500000 cents attempted an opening order" }
  - { id: ERR_SECURITY_NOT_MARGINABLE, http: 422, condition: "Opening order on a non-marginable security" }
  - { id: ERR_NO_MARKET_MARK, http: 422, condition: "No REALTIME mark exists for the security at order time" }
  - { id: ERR_INVALID_MARK, http: 400, condition: "Mark price_cents must be positive" }
  - { id: ERR_CALL_NOT_OPEN, http: 409, condition: "Dispute or waiver requires call OPEN (waive also allows EXPIRED)" }
  - { id: ERR_CALL_NOT_EXPIRED, http: 409, condition: "Liquidation order creation requires the referenced call EXPIRED" }
  - { id: ERR_DISPUTE_INVALID_STATE, http: 409, condition: "Dispute not in a valid from-state for the invoked transition" }
  - { id: ERR_DUPLICATE_DISPUTE, http: 409, condition: "An OPEN or UNDER_REVIEW dispute already exists for this call" }
  - { id: ERR_LIQUIDATION_INVALID_STATE, http: 409, condition: "Fill/cancel requires order PENDING or PARTIALLY_FILLED" }
  - { id: ERR_FILL_EXCEEDS_QUANTITY, http: 422, condition: "filled_quantity <= 0 or exceeds the remaining unfilled quantity" }
  - { id: ERR_LIQUIDATION_IN_PROGRESS, http: 409, condition: "Another non-terminal liquidation order exists for this account" }
  - { id: ERR_POSITION_RESERVED, http: 409, condition: "Selected position is already reserved by a non-terminal liquidation order" }
  - { id: ERR_NO_LIQUIDATABLE_POSITIONS, http: 409, condition: "No eligible unreserved positions, or total eligible official market value < call amount" }
  - { id: ERR_INSUFFICIENT_BUYING_POWER, http: 402, condition: "Post-trade equity fails Reg T initial or house requirement" }
  - { id: ERR_INSUFFICIENT_CASH, http: 402, condition: "Withdrawal/journal debit exceeds cash_balance_cents" }
  - { id: ERR_MAINTENANCE_EXCESS_NEGATIVE, http: 402, condition: "Post-withdrawal official binding maintenance excess would be < 0" }
  - { id: ERR_RATE_TIER_OVERLAP, http: 409, condition: "Effective window shares a calendar date with another tier of the same tier_level (closed intervals; back-to-back allowed)" }
  - { id: ERR_POSITIONS_EXIST, http: 409, condition: "Close requires all position quantities == 0" }
  - { id: ERR_OPEN_CALLS_EXIST, http: 409, condition: "Close requires no non-terminal margin calls" }
  - { id: ERR_NONZERO_BALANCE, http: 409, condition: "Close requires cash_balance_cents == 0" }
  - { id: ERR_CLOCK_REGRESSION, http: 400, condition: "set_current_utc to an earlier time than the current logical clock" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_account_version does not match the account's current version (OCC)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "Retail client; owns applications, accounts, orders, cash movements, disputes"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /margin/account-applications (customer_id must equal X-User-ID)"
      - "POST /margin/account-applications/{id}/resubmit"
      - "POST /margin/accounts/{id}/orders"
      - "POST /margin/accounts/{id}/cash-movements"
      - "POST /margin/accounts/{id}/close"
      - "POST /margin/disputes"
    shared_operations:
      - "All GET endpoints"
  - name: MarginAnalyst
    description: "Margin operations analyst; onboards customers, reviews applications and disputes"
    identity: "opaque"
    exclusive_operations:
      - "POST /margin/customers"
      - "POST /margin/account-applications/{id}/review"
      - "POST /margin/disputes/{id}/start-review"
      - "POST /margin/disputes/{id}/request-info"
    shared_operations:
      - "All GET endpoints"
  - name: MarginSupervisor
    description: "Margin supervisor; approves/rejects applications, sets house policy and rate tiers, waives calls, decides disputes"
    identity: "opaque"
    exclusive_operations:
      - "POST /margin/account-applications/{id}/approve"
      - "POST /margin/account-applications/{id}/reject"
      - "POST /margin/security-profiles"
      - "PATCH /margin/security-profiles/{id}"
      - "POST /margin/rate-tiers"
      - "POST /margin/margin-calls/{id}/waive"
      - "POST /margin/disputes/{id}/decide"
    shared_operations:
      - "All GET endpoints"
  - name: LiquidationDesk
    description: "Liquidation desk operator; creates, fills, and cancels liquidation orders (fill requires a different desk user than the creator)"
    identity: "opaque"
    exclusive_operations:
      - "POST /margin/accounts/{id}/liquidation-orders"
      - "POST /margin/liquidation-orders/{id}/fill"
      - "POST /margin/liquidation-orders/{id}/cancel"
    shared_operations:
      - "All GET endpoints"
  - name: MarketDataOps
    description: "Market data and batch operator; posts price marks, drives the logical clock and daily sweep"
    identity: "opaque"
    exclusive_operations:
      - "POST /margin/market-marks"
      - "POST /_clock/set_current_utc"
      - "POST /_sweeps/daily"
    shared_operations:
      - "All GET endpoints"
