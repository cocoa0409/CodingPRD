      - name: anchor_revision_limit_rejects_the_fourth_submission
        claim_type: violation_to_error
        grounds:
          - validations[priority 27]
          - errors[ERR_ANCHOR_REVISION_LIMIT]
          - state_machines.AnchorCertification.CHANGES_REQUIRED_to_SUBMITTED
        distinguishing_aspect: |
          revision_round starts at 1 on creation and increments on each resubmit, and
          the guard is revision_round < MAX_ANCHOR_REVISIONS (3). Two resubmissions
          therefore succeed (rounds 2 and 3) and the third is refused with a 422
          ERR_ANCHOR_REVISION_LIMIT while the row stays in CHANGES_REQUIRED with
          revision_round pinned at 3 - the counter must not advance on the rejected
          call.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "an AZ plant, a single-section AZ order in wind zone I, a licensed SetCrew, and a SCHEDULED SetJob on that order"
            - "an anchor certification submitted with only 6 anchors (below the required 8) so every review can legitimately request changes"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /installations/plants"
              payload: { name: "Champion Chandler", state_code: "AZ", hud_plant_code: "AZ-014" }
              as: NetworkAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /installations/set-crews"
              payload: { company_name: "Sonoran Set", hud_installer_license_no: "AZ-INST-88", license_state: "AZ", license_expiry_date: "2027-06-30", daily_capacity: 1 }
              as: NetworkAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Valley Homes", home_model: "Titan 1660", section_count: 1, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { order_id: $.data.id }
            - call: "GET /installations/orders/${order_id}"
              payload: {}
              as: NetworkAdmin
              captures: { order_v: $.data.version }
            - call: "POST /installations/set-jobs"
              payload: { order_id: "${order_id}", set_crew_id: "${crew_id}", scheduled_start_date: "2026-08-10", scheduled_end_date: "2026-08-11", labor_base_cents: 480000, expected_order_version: "${order_v}" }
              as: NetworkAdmin
              captures: { job_id: $.data.id }
            - call: "POST /installations/anchor-certifications"
              payload: { set_job_id: "${job_id}", anchor_count: 6, avg_torque_ft_lb: 200, strap_count: 6, pier_count: 6 }
              as: SetCrewLead
              as_user_id: "${crew_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /installations/anchor-certifications/${cert_id}/review"
              payload: { decision: "REQUEST_CHANGES", findings: "6 anchors, 8 required" }
              as: InstallationInspector
              as_user_id: "insp-anchor-1"
            - call: "POST /installations/anchor-certifications/${cert_id}/resubmit"
              payload: { anchor_count: 7, avg_torque_ft_lb: 200, strap_count: 7, pier_count: 6 }
              as: SetCrewLead
              as_user_id: "${crew_id}"
            - call: "POST /installations/anchor-certifications/${cert_id}/review"
              payload: { decision: "REQUEST_CHANGES", findings: "still one anchor short" }
              as: InstallationInspector
              as_user_id: "insp-anchor-1"
            - call: "POST /installations/anchor-certifications/${cert_id}/resubmit"
              payload: { anchor_count: 8, avg_torque_ft_lb: 120, strap_count: 8, pier_count: 6 }
              as: SetCrewLead
              as_user_id: "${crew_id}"
            - call: "POST /installations/anchor-certifications/${cert_id}/review"
              payload: { decision: "REQUEST_CHANGES", findings: "anchor count fixed, torque now below 175" }
              as: InstallationInspector
              as_user_id: "insp-anchor-1"
          trigger:
            - call: "POST /installations/anchor-certifications/${cert_id}/resubmit"
              payload: { anchor_count: 8, avg_torque_ft_lb: 200, strap_count: 8, pier_count: 6 }
              as: SetCrewLead
              as_user_id: "${crew_id}"
          assert:
            - "before trigger: AnchorCertification.${cert_id}.revision_round == 3"
            - "before trigger: AnchorCertification.${cert_id}.status == CHANGES_REQUIRED"
            - "before trigger: AnchorCertification.${cert_id}.anchor_count == 8 and avg_torque_ft_lb == 120 and hud_pass == false"
            - "trigger returns HTTP 422 with error_id ERR_ANCHOR_REVISION_LIMIT"
            - "AnchorCertification.${cert_id}.revision_round == 3 (unchanged)"
            - "AnchorCertification.${cert_id}.status == CHANGES_REQUIRED (unchanged)"
            - "AnchorCertification.${cert_id}.avg_torque_ft_lb == 120 (the rejected payload is not written)"
            - "AnchorCertification.${cert_id}.hud_pass == false"

      - name: section_mate_pointer_must_stay_inside_the_order_and_be_unclaimed
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 16]
          - errors[ERR_SECTION_MATE_INVALID]
          - entities.HomeSection.fields.mates_to_section_id
        distinguishing_aspect: |
          The mate pointer is checked against two different foreign rows: a section
          of order B pointing at a section of order A is rejected even though the
          target exists, and a third section of order A pointing at a section that
          section 2 has already claimed is rejected as well - both with
          ERR_SECTION_MATE_INVALID, while the legitimate 2-to-1 pairing inside order
          A succeeds.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one AZ plant"
            - "order A is a three-section AZ home; order B is a single-section AZ home"
            - "section A1 exists with no mate; section A2 exists and mates to A1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /installations/plants"
              payload: { name: "Champion Chandler", state_code: "AZ", hud_plant_code: "AZ-014" }
              as: NetworkAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Valley Homes", home_model: "Titan 3266", section_count: 3, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { orderA_id: $.data.id }
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Desert Living", home_model: "Titan 1660", section_count: 1, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { orderB_id: $.data.id }
            - call: "POST /installations/sections"
              payload: { order_id: "${orderA_id}", section_index: 1, declared_width_in: 168, declared_height_in: 150, declared_length_in: 768, declared_weight_lb: 24000 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /installations/sections"
              payload: { order_id: "${orderA_id}", section_index: 2, declared_width_in: 168, declared_height_in: 150, declared_length_in: 768, declared_weight_lb: 24000, mates_to_section_id: "${a1_id}" }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { a2_id: $.data.id }
          trigger:
            - call: "POST /installations/sections"
              payload: { order_id: "${orderB_id}", section_index: 1, declared_width_in: 168, declared_height_in: 150, declared_length_in: 720, declared_weight_lb: 22000, mates_to_section_id: "${a1_id}" }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
            - call: "POST /installations/sections"
              payload: { order_id: "${orderA_id}", section_index: 3, declared_width_in: 168, declared_height_in: 150, declared_length_in: 768, declared_weight_lb: 24000, mates_to_section_id: "${a1_id}" }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
            - call: "POST /installations/sections"
              payload: { order_id: "${orderA_id}", section_index: 3, declared_width_in: 168, declared_height_in: 150, declared_length_in: 768, declared_weight_lb: 24000, mates_to_section_id: "${a2_id}" }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { a3_id: $.data.id }
          assert:
            - "before trigger: HomeSection.${a2_id}.mates_to_section_id == ${a1_id}"
            - "trigger step 1 returns HTTP 422 with error_id ERR_SECTION_MATE_INVALID (cross-order mate)"
            - "after trigger step 1: no HomeSection row exists with order_id == ${orderB_id}"
            - "trigger step 2 returns HTTP 422 with error_id ERR_SECTION_MATE_INVALID (A1 already mated to A2)"
            - "after trigger step 2: GET /installations/sections?order_id=${orderA_id} returns total_count == 2"
            - "trigger step 3 returns HTTP 201"
            - "HomeSection.${a3_id}.mates_to_section_id == ${a2_id}"
            - "HomeSection.${a3_id}.section_index == 3"
            - "GET /installations/sections?order_id=${orderA_id} returns total_count == 3"

