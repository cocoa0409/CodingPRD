scaffold_corner_design:

  # =========================================================================
  # Entities — creation, retrieval, not-found, required fields, computed/system
  # =========================================================================
  - section: entities
    instances:
      - name: create_tax_jurisdiction_returns_201_with_combined_rate
        claim_type: Creation
        grounds:
          - entities.TaxJurisdiction
          - endpoints
        distinguishing_aspect: "POST /tax-jurisdictions with all required fields -> 201; combined_rate computed as state_rate+local_rate (0.0725+0.0100=0.0825)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id, cr: $.data.combined_rate }
          assert:
            - "response.status == 201"
            - "TaxJurisdiction.${ca_id}.combined_rate == 0.0825"
            - "TaxJurisdiction.${ca_id}.version == 1"

      - name: get_seller_by_id_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - entities.Seller
          - endpoints
        distinguishing_aspect: "GET /sellers/{id} returns the created seller with status ACTIVE default."
        test_recipe:
          setup: ["A seller exists."]
          setup_api_calls:
            - call: "POST /sellers"
              payload: { legal_name: "Acme", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
          trigger:
            - call: "GET /sellers/${s_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { st: $.data.status }
          assert:
            - "response.status == 200"
            - "Seller.${s_id}.status == ACTIVE"
            - "Seller.${s_id}.legal_name == Acme"

      - name: get_transaction_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Transaction
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /transactions/{id} with a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /transactions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_tax_jurisdiction_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.TaxJurisdiction
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /tax-jurisdictions omitting required state_rate -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", economic_nexus_sales_threshold: 100000.00 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_jurisdiction_invalid_enum_sourcing_rule_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.TaxJurisdiction.fields.sourcing_rule
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "sourcing_rule outside {ORIGIN,DESTINATION} -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "HYBRID", state_rate: 0.07, local_rate: 0.01, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: line_item_default_customer_exempt_requested_false
        claim_type: Defaults
        grounds:
          - entities.Transaction.fields.customer_exempt_requested
        distinguishing_aspect: "Creating a transaction without customer_exempt_requested defaults it to false."
        test_recipe:
          setup: ["CA jurisdiction and ACTIVE seller exist."]
          setup_api_calls:
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /transactions"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", customer_ref: "b1" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { t_id: $.data.id, ce: $.data.customer_exempt_requested }
          assert:
            - "response.status == 201"
            - "Transaction.${t_id}.customer_exempt_requested == false"

      - name: transaction_system_fields_generated_on_create
        claim_type: System Fields
        grounds:
          - entities.Transaction.fields.settlement_status
          - entities.Transaction.fields.audit_status
        distinguishing_aspect: "On create, settlement_status=PENDING and audit_status=UNREVIEWED are system-set; version=1."
        test_recipe:
          setup: ["CA jurisdiction and ACTIVE seller exist."]
          setup_api_calls:
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /transactions"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", customer_ref: "b1", customer_exempt_requested: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { t_id: $.data.id }
          assert:
            - "Transaction.${t_id}.settlement_status == PENDING"
            - "Transaction.${t_id}.audit_status == UNREVIEWED"
            - "Transaction.${t_id}.version == 1"

      - name: create_transaction_with_unknown_jurisdiction_returns_reference_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Transaction.fields.jurisdiction_id
          - "errors[ERR_REFERENCE_NOT_FOUND]"
        distinguishing_aspect: "POST /transactions whose jurisdiction_id FK does not resolve -> ERR_REFERENCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["An ACTIVE seller exists; no jurisdiction with the cited id."]
          setup_api_calls:
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /transactions"
              payload: { seller_id: "${s_id}", jurisdiction_id: "00000000-0000-4000-8000-000000000000", customer_ref: "b1", customer_exempt_requested: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_REFERENCE_NOT_FOUND"

  # =========================================================================
  # Entity topology (flat) — FK reverse-reachability via filtered lists
  # =========================================================================
  - section: entities
    instances:
      - name: list_transactions_filtered_by_seller_id_reverse_reachability
        claim_type: Listing
        grounds:
          - entities.Transaction.fields.seller_id
          - endpoints
        distinguishing_aspect: "GET /transactions?seller_id=... returns only that seller's transactions as an array with pagination fields."
        test_recipe:
          setup: ["CA jurisdiction; ACTIVE seller s with one PENDING transaction."]
          setup_api_calls:
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
            - call: "POST /transactions"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", customer_ref: "b1", customer_exempt_requested: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { t_id: $.data.id }
          trigger:
            - call: "GET /transactions?seller_id=${s_id}"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { first_id: "$.data[0].id" }
          assert:
            - "response.status == 200"
            - "response.response_type == array"
            - "every element has seller_id == ${s_id}"

      - name: list_line_items_filtered_by_transaction_id_reverse_reachability
        claim_type: Listing
        grounds:
          - entities.TransactionLineItem.fields.transaction_id
          - endpoints
        distinguishing_aspect: "GET /line-items?transaction_id=... returns the parent transaction's line items (cascade-discovery channel)."
        test_recipe:
          setup: ["CA jurisdiction; seller s; PENDING transaction with one line item."]
          setup_api_calls:
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id }
            - call: "POST /product-categories"
              payload: { jurisdiction_id: "${ca_id}", category_code: "TANGIBLE", taxability: "FULL" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
            - call: "POST /transactions"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", customer_ref: "b1", customer_exempt_requested: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { t_id: $.data.id }
            - call: "POST /line-items"
              payload: { transaction_id: "${t_id}", category_code: "TANGIBLE", quantity: 2, unit_price: 5.00 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { li_id: $.data.id }
          trigger:
            - call: "GET /line-items?transaction_id=${t_id}"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { first: "$.data[0].id" }
          assert:
            - "response.status == 200"
            - "every element has transaction_id == ${t_id}"

  # =========================================================================
  # State machines — valid transitions, invalid-from, terminal, idempotency
  # =========================================================================
  - section: state_machines
    instances:
      - name: settle_pending_transaction_moves_to_settled
        claim_type: Valid Transition
        grounds:
          - state_machines.Transaction.PENDING_to_SETTLED
          - entities.Transaction.fields.settlement_status
        distinguishing_aspect: "POST /transactions/{id}/settle on a PENDING transaction with a line item moves settlement_status to SETTLED."
        test_recipe:
          setup: ["CA jurisdiction; TANGIBLE=FULL; ACTIVE seller s; PENDING CA transaction with one TANGIBLE line qty1 @10.00."]
          setup_api_calls:
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id }
            - call: "POST /product-categories"
              payload: { jurisdiction_id: "${ca_id}", category_code: "TANGIBLE", taxability: "FULL" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
            - call: "POST /transactions"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", customer_ref: "b1", customer_exempt_requested: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { t_id: $.data.id }
            - call: "POST /line-items"
              payload: { transaction_id: "${t_id}", category_code: "TANGIBLE", quantity: 1, unit_price: 10.00 }
              as: Seller
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /transactions/${t_id}/settle"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { st: $.data.settlement_status }
          assert:
            - "Transaction.${t_id}.settlement_status == SETTLED"
            - "Transaction.${t_id}.tax_collected == 0.83"

      - name: settle_transaction_with_no_line_items_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Transaction.PENDING_to_SETTLED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Settling a PENDING transaction with zero line items -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["CA jurisdiction; ACTIVE seller s; PENDING CA transaction with NO line items."]
          setup_api_calls:
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
            - call: "POST /transactions"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", customer_ref: "b1", customer_exempt_requested: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /transactions/${t_id}/settle"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: settle_already_settled_transaction_idempotency_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Transaction.PENDING_to_SETTLED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Settling a transaction twice -> second call rejected ERR_INVALID_STATE (settlement_status already SETTLED)."
        test_recipe:
          setup: ["CA jurisdiction; TANGIBLE=FULL; seller s; a SETTLED transaction."]
          setup_api_calls:
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id }
            - call: "POST /product-categories"
              payload: { jurisdiction_id: "${ca_id}", category_code: "TANGIBLE", taxability: "FULL" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
            - call: "POST /transactions"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", customer_ref: "b1", customer_exempt_requested: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { t_id: $.data.id }
            - call: "POST /line-items"
              payload: { transaction_id: "${t_id}", category_code: "TANGIBLE", quantity: 1, unit_price: 10.00 }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /transactions/${t_id}/settle"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /transactions/${t_id}/settle"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: void_pending_transaction_invalid_from_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Transaction.SETTLED_to_VOIDED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Voiding a PENDING (not SETTLED) transaction -> ERR_INVALID_STATE; void is only valid from SETTLED."
        test_recipe:
          setup: ["CA jurisdiction; seller s; a PENDING transaction (never settled)."]
          setup_api_calls:
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
            - call: "POST /transactions"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", customer_ref: "b1", customer_exempt_requested: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /transactions/${t_id}/void"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: clear_unflagged_transaction_invalid_from_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Transaction.FLAGGED_to_CLEARED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Clearing an UNREVIEWED (not FLAGGED) transaction -> ERR_INVALID_STATE on the audit dimension."
        test_recipe:
          setup: ["CA jurisdiction; seller s; a PENDING (UNREVIEWED) transaction."]
          setup_api_calls:
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
            - call: "POST /transactions"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", customer_ref: "b1", customer_exempt_requested: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /transactions/${t_id}/clear"
              payload: {}
              as: Auditor
              as_user_id: "aud-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: reinstate_certificate_past_validity_window_returns_validation_failed
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ExemptionCertificate.REVOKED_to_ACTIVE
          - "errors[ERR_VALIDATION_FAILED]"
        distinguishing_aspect: "Reinstating a REVOKED certificate after the clock has passed valid_to -> ERR_VALIDATION_FAILED (422)."
        test_recipe:
          setup: ["Clock 2026-01-01; CA jurisdiction; seller s; certificate valid [2026-01-01,2026-02-01); revoked; clock advanced to 2026-03-01 (past valid_to)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
            - call: "POST /exemption-certificates"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", customer_ref: "b1", exempt_category_code: "TANGIBLE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-02-01T00:00:00Z" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /exemption-certificates/${cert_id}/revoke"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /exemption-certificates/${cert_id}/reinstate"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_VALIDATION_FAILED"

      - name: remit_filed_return_reaches_terminal_remitted
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.TaxReturn.FILED_to_REMITTED
          - entities.TaxReturn.fields.status
        distinguishing_aspect: "A FILED return paid in full reaches REMITTED (terminal); a subsequent file/accept would be rejected."
        test_recipe:
          setup: ["CA jurisdiction; seller s REGISTERED; one SETTLED SELLER txn tax 0.83 in Feb; a FILED CA return with tax_due 0.83."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /tax-jurisdictions"
