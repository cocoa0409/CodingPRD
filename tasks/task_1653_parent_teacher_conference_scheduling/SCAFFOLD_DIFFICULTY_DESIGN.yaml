            - { call: "POST /conf/windows/${w}/publish", payload: {}, as: SchoolAdmin, captures: { w_v2: $.data.version } }
            - { call: "POST /conf/windows/${w}/generate-slots", payload: { expected_window_version: "${w_v2}" }, as: SchoolAdmin }
            - { call: "GET /conf/teachers/${t2}/slots", payload: { window_id: "${w}" }, as: SchoolAdmin, captures: { q0: "$.data[0].id", q1: "$.data[1].id" } }
            - { call: "POST /conf/windows/${w}/open-booking", payload: {}, as: SchoolAdmin }
            - { call: "POST /conf/interpreters", payload: { full_name: "I One", languages: ["es"], max_consecutive_minutes: 120, base_minutes_per_window: 600, hourly_rate_cents: 6000 }, as: SchoolAdmin, captures: { interp: $.data.id } }
            - { call: "POST /conf/families", payload: { primary_guardian_name: "GC", email: "fc@x.com", preferred_language: "es" }, as: FrontOfficeStaff, captures: { famC: $.data.id } }
            - { call: "POST /conf/families", payload: { primary_guardian_name: "GD", email: "fd@x.com" }, as: FrontOfficeStaff, captures: { famD: $.data.id } }
            - { call: "POST /conf/families", payload: { primary_guardian_name: "GE", email: "fe@x.com" }, as: FrontOfficeStaff, captures: { famE: $.data.id } }
            - { call: "POST /conf/families/${famC}/students", payload: { full_name: "C1", grade_level: 1 }, as: FrontOfficeStaff, captures: { c1: $.data.id } }
            - { call: "POST /conf/families/${famD}/students", payload: { full_name: "D1", grade_level: 2 }, as: FrontOfficeStaff, captures: { d1: $.data.id } }
            - { call: "POST /conf/families/${famE}/students", payload: { full_name: "E1", grade_level: 3 }, as: FrontOfficeStaff, captures: { e1: $.data.id } }
            - { call: "POST /conf/students/${c1}/teacher-links", payload: { teacher_id: "${t2}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/students/${d1}/teacher-links", payload: { teacher_id: "${t2}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/students/${e1}/teacher-links", payload: { teacher_id: "${t2}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/bookings", payload: { slot_id: "${q0}", student_id: "${c1}", channel: "IN_PERSON", interpreter_language: "es" }, as: FamilyGuardian, as_user_id: "${famC}", captures: { bkC: $.data.id } }
            - { call: "POST /conf/bookings", payload: { slot_id: "${q1}", student_id: "${d1}", channel: "IN_PERSON" }, as: FamilyGuardian, as_user_id: "${famD}", captures: { bkD: $.data.id } }
            - { call: "GET /conf/interpreter-requests", payload: { booking_id: "${bkC}" }, as: FrontOfficeStaff, captures: { rC: "$.data[0].id" } }
