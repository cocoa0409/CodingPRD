# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Genetic Counseling & Cascade Testing — breadth probe over §1.1–§1.7
# =============================================================================
scaffold_corner_design:

  # ---------------------------- Entities -------------------------------------
  - section: entities
    instances:
      - name: create_family_returns_envelope_and_ledger_defaults
        claim_type: Creation
        grounds: [entities.Family.fields.outreach_available_cents]
        distinguishing_aspect: "POST /families returns 201 with server-minted id and initialized ledger: outreach_reserved_cents 0, outreach_spent_cents 0, outreach_available_cents == outreach_budget_cents."
        test_recipe:
          setup: ["No prerequisites"]
          setup_api_calls: []
          trigger:
            - { call: "POST /families", payload: { family_name: "Kindred A", outreach_budget_cents: 25000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
          assert:
            - "response HTTP status == 201"
            - "Family.${fid}.outreach_reserved_cents == 0"
            - "Family.${fid}.outreach_spent_cents == 0"
            - "Family.${fid}.outreach_available_cents == 25000"

      - name: get_case_not_found_returns_404
        claim_type: Not Found
        grounds:
          - errors[ERR_CASE_NOT_FOUND]
        distinguishing_aspect: "GET /counseling-cases/{unknown-uuid} returns ERR_CASE_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["No case created"]
          setup_api_calls: []
          trigger:
            - { call: "GET /counseling-cases/00000000-0000-4000-8000-000000000000", payload: {}, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "response HTTP status == 404"
            - "response data.error_id == ERR_CASE_NOT_FOUND"

      - name: create_case_missing_required_covered_sessions_rejected
        claim_type: Required Fields
        grounds: [entities.CounselingCase.fields.covered_sessions]
        distinguishing_aspect: "POST /counseling-cases without the required covered_sessions field returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Family and counselor exist"]
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Kindred B", outreach_budget_cents: 10000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC R", npi: "2000000001" }, as: ProgramAdmin, captures: { cid: $.data.id } }
          trigger:
            - { call: "POST /counseling-cases", payload: { family_id: "${fid}", assigned_counselor_id: "${cid}", patient_name: "P", patient_dob: "1980-01-01", sex: "FEMALE", ancestry: "EUROPEAN", referral_reason: "FHx" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { err: $.data.error_id } }
          assert:
            - "response HTTP status == 422"
            - "response data.error_id == ERR_VALIDATION"

      - name: create_case_defaults_applied
        claim_type: Defaults
        grounds: [entities.CounselingCase.fields.relationship_to_proband, entities.CounselingCase.fields.familial_variant_known]
        distinguishing_aspect: "Omitting relationship_to_proband and familial_variant_known applies defaults PROBAND and false; clinical_status defaults INTAKE, billing_status UNBILLED, sessions_remaining == covered_sessions."
        test_recipe:
          setup: ["Family and counselor exist"]
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Kindred C", outreach_budget_cents: 10000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC S", npi: "2000000002" }, as: ProgramAdmin, captures: { cid: $.data.id } }
          trigger:
            - { call: "POST /counseling-cases", payload: { family_id: "${fid}", assigned_counselor_id: "${cid}", patient_name: "P", patient_dob: "1980-01-01", sex: "FEMALE", ancestry: "EUROPEAN", referral_reason: "FHx", covered_sessions: 4 }, as: GeneticCounselor, as_user_id: "${cid}", captures: { case_id: $.data.id } }
          assert:
            - "CounselingCase.${case_id}.relationship_to_proband == PROBAND"
            - "CounselingCase.${case_id}.familial_variant_known == false"
            - "CounselingCase.${case_id}.clinical_status == INTAKE"
            - "CounselingCase.${case_id}.billing_status == UNBILLED"
            - "CounselingCase.${case_id}.sessions_remaining == 4"

      - name: create_case_invalid_enum_sex_rejected
        claim_type: Type Constraints
        grounds: [entities.CounselingCase.fields.sex]
        distinguishing_aspect: "POST /counseling-cases with sex 'X' (not in enum) returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Family and counselor exist"]
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Kindred D", outreach_budget_cents: 10000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC T", npi: "2000000003" }, as: ProgramAdmin, captures: { cid: $.data.id } }
          trigger:
            - { call: "POST /counseling-cases", payload: { family_id: "${fid}", assigned_counselor_id: "${cid}", patient_name: "P", patient_dob: "1980-01-01", sex: "X", ancestry: "EUROPEAN", referral_reason: "FHx", covered_sessions: 1 }, as: GeneticCounselor, as_user_id: "${cid}", captures: { err: $.data.error_id } }
          assert:
            - "response HTTP status == 422"
            - "response data.error_id == ERR_VALIDATION"

      - name: create_case_unknown_family_fk_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.CounselingCase.fields.family_id
          - errors[ERR_FAMILY_NOT_FOUND]
        distinguishing_aspect: "POST /counseling-cases referencing a non-existent family_id returns ERR_FAMILY_NOT_FOUND (404)."
        test_recipe:
          setup: ["Counselor exists; no such family"]
          setup_api_calls:
            - { call: "POST /counselors", payload: { full_name: "GC U", npi: "2000000004" }, as: ProgramAdmin, captures: { cid: $.data.id } }
          trigger:
            - { call: "POST /counseling-cases", payload: { family_id: "00000000-0000-4000-8000-000000000001", assigned_counselor_id: "${cid}", patient_name: "P", patient_dob: "1980-01-01", sex: "FEMALE", ancestry: "EUROPEAN", referral_reason: "FHx", covered_sessions: 1 }, as: GeneticCounselor, as_user_id: "${cid}", captures: { err: $.data.error_id } }
          assert:
            - "response HTTP status == 404"
            - "response data.error_id == ERR_FAMILY_NOT_FOUND"

      - name: create_case_system_fields_input_ignored
        claim_type: System Fields
        grounds: [entities.CounselingCase.fields.clinical_status]
        distinguishing_aspect: "Client-supplied system fields (clinical_status) are ignored on create; the case starts at INTAKE regardless of body input."
        test_recipe:
          setup: ["Family and counselor exist"]
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Kindred E", outreach_budget_cents: 10000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC V", npi: "2000000005" }, as: ProgramAdmin, captures: { cid: $.data.id } }
          trigger:
            - { call: "POST /counseling-cases", payload: { family_id: "${fid}", assigned_counselor_id: "${cid}", patient_name: "P", patient_dob: "1980-01-01", sex: "FEMALE", ancestry: "EUROPEAN", referral_reason: "FHx", covered_sessions: 1, clinical_status: "SURVEILLANCE" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { case_id: $.data.id } }
          assert:
            - "CounselingCase.${case_id}.clinical_status == INTAKE"

      - name: list_cases_pagination_envelope
        claim_type: Listing
        grounds: [entities.CounselingCase.fields.family_id]
        distinguishing_aspect: "GET /counseling-cases?family_id filters to the family and the envelope carries pagination fields limit/offset/total_count/has_more."
        test_recipe:
          setup: ["One family with two cases"]
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Kindred F", outreach_budget_cents: 10000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC W", npi: "2000000006" }, as: ProgramAdmin, captures: { cid: $.data.id } }
            - { call: "POST /counseling-cases", payload: { family_id: "${fid}", assigned_counselor_id: "${cid}", patient_name: "P1", patient_dob: "1980-01-01", sex: "FEMALE", ancestry: "EUROPEAN", referral_reason: "FHx", covered_sessions: 1 }, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /counseling-cases", payload: { family_id: "${fid}", assigned_counselor_id: "${cid}", patient_name: "P2", patient_dob: "1981-01-01", sex: "MALE", ancestry: "EUROPEAN", referral_reason: "FHx", covered_sessions: 1 }, as: GeneticCounselor, as_user_id: "${cid}" }
          trigger:
            - { call: "GET /counseling-cases?family_id=${fid}", payload: {}, as: ProgramAdmin }
          assert:
            - "response data total_count == 2"
            - "response envelope includes has_more == false"

  # -------------------------- State machines ---------------------------------
  - section: state_machines
    instances:
      - name: sign_already_signed_consent_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ConsentRecord.PENDING_to_SIGNED
          - errors[ERR_CONSENT_INVALID_STATE]
        distinguishing_aspect: "Signing a consent already in SIGNED returns ERR_CONSENT_INVALID_STATE (409); no state change."
        test_recipe:
          setup: ["Case with a TESTING consent already SIGNED"]
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Kindred G", outreach_budget_cents: 10000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC X", npi: "2000000007" }, as: ProgramAdmin, captures: { cid: $.data.id } }
            - { call: "POST /counseling-cases", payload: { family_id: "${fid}", assigned_counselor_id: "${cid}", patient_name: "P", patient_dob: "1980-01-01", sex: "FEMALE", ancestry: "EUROPEAN", referral_reason: "FHx", covered_sessions: 1 }, as: GeneticCounselor, as_user_id: "${cid}", captures: { case_id: $.data.id } }
            - { call: "POST /consent-records", payload: { counseling_case_id: "${case_id}", consent_type: "TESTING" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { consent_id: $.data.id } }
            - { call: "POST /consent-records/${consent_id}/sign", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
          trigger:
            - { call: "POST /consent-records/${consent_id}/sign", payload: {}, as: GeneticCounselor, as_user_id: "${cid}", captures: { err: $.data.error_id } }
          assert:
            - "response data.error_id == ERR_CONSENT_INVALID_STATE"
            - "ConsentRecord.${consent_id}.status == SIGNED"

      - name: withdraw_already_withdrawn_case_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.CounselingCase.INTAKE_to_WITHDRAWN
          - errors[ERR_CASE_INVALID_CLINICAL_STATE]
        distinguishing_aspect: "Withdrawing a case already in terminal WITHDRAWN returns ERR_CASE_INVALID_CLINICAL_STATE (409)."
        test_recipe:
          setup: ["Case already WITHDRAWN"]
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Kindred H", outreach_budget_cents: 10000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC Y", npi: "2000000008" }, as: ProgramAdmin, captures: { cid: $.data.id } }
            - { call: "POST /counseling-cases", payload: { family_id: "${fid}", assigned_counselor_id: "${cid}", patient_name: "P", patient_dob: "1980-01-01", sex: "FEMALE", ancestry: "EUROPEAN", referral_reason: "FHx", covered_sessions: 1 }, as: GeneticCounselor, as_user_id: "${cid}", captures: { case_id: $.data.id } }
            - { call: "POST /counseling-cases/${case_id}/withdraw", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
          trigger:
            - { call: "POST /counseling-cases/${case_id}/withdraw", payload: {}, as: GeneticCounselor, as_user_id: "${cid}", captures: { err: $.data.error_id } }
          assert:
            - "response data.error_id == ERR_CASE_INVALID_CLINICAL_STATE"

      - name: assess_risk_empty_pedigree_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.CounselingCase.INTAKE_to_RISK_ASSESSED
          - errors[ERR_PEDIGREE_EMPTY]
        distinguishing_aspect: "assess-risk on a case with zero pedigree members returns ERR_PEDIGREE_EMPTY (409); clinical_status stays INTAKE."
        test_recipe:
          setup: ["Case with no pedigree members"]
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Kindred I", outreach_budget_cents: 10000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC Z", npi: "2000000009" }, as: ProgramAdmin, captures: { cid: $.data.id } }
            - { call: "POST /counseling-cases", payload: { family_id: "${fid}", assigned_counselor_id: "${cid}", patient_name: "P", patient_dob: "1980-01-01", sex: "FEMALE", ancestry: "EUROPEAN", referral_reason: "FHx", covered_sessions: 1 }, as: GeneticCounselor, as_user_id: "${cid}", captures: { case_id: $.data.id } }
          trigger:
            - { call: "POST /counseling-cases/${case_id}/assess-risk", payload: {}, as: GeneticCounselor, as_user_id: "${cid}", captures: { err: $.data.error_id } }
          assert:
            - "response data.error_id == ERR_PEDIGREE_EMPTY"
            - "CounselingCase.${case_id}.clinical_status == INTAKE"

      - name: revoke_consent_after_disclosure_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ConsentRecord.SIGNED_to_REVOKED
          - errors[ERR_CONSENT_LOCKED_BY_DISCLOSURE]
        distinguishing_aspect: "Once a result is DISCLOSED for the case, revoking the TESTING consent returns ERR_CONSENT_LOCKED_BY_DISCLOSURE (409)."
        test_recipe:
          setup: ["Proband case with a disclosed result and a SIGNED TESTING consent"]
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Kindred J", outreach_budget_cents: 100000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC AA", npi: "2000000010" }, as: ProgramAdmin, captures: { cid: $.data.id } }
            - { call: "POST /labs", payload: { lab_name: "LabJ", max_concurrent_capacity: 5, turnaround_days: 14 }, as: ProgramAdmin, captures: { lid: $.data.id } }
            - { call: "POST /counseling-cases", payload: { family_id: "${fid}", assigned_counselor_id: "${cid}", patient_name: "Prob J", patient_dob: "1980-01-01", sex: "FEMALE", ancestry: "EUROPEAN", referral_reason: "FHx", covered_sessions: 2 }, as: GeneticCounselor, as_user_id: "${cid}", captures: { case_id: $.data.id } }
            - { call: "POST /pedigree-members", payload: { counseling_case_id: "${case_id}", relationship: "SIBLING", degree: 1, affected: true, age_of_onset: 60 }, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /counseling-cases/${case_id}/assess-risk", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /consent-records", payload: { counseling_case_id: "${case_id}", consent_type: "TESTING" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { consent_id: $.data.id } }
            - { call: "POST /consent-records/${consent_id}/sign", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /test-orders", payload: { counseling_case_id: "${case_id}", lab_id: "${lid}", panel_name: "BRCA", list_price_cents: 300000, processing_start: "2026-05-02T09:00:00Z", processing_end: "2026-05-16T09:00:00Z" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { order_id: $.data.id } }
            - { call: "POST /test-orders/${order_id}/submit", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /test-results", payload: { test_order_id: "${order_id}", gene: "BRCA1", variant: "c.100A>G", classification: "VUS" }, as: LabTechnician, as_user_id: "${lid}", captures: { result_id: $.data.id } }
            - { call: "POST /test-results/${result_id}/release", payload: {}, as: LabTechnician, as_user_id: "${lid}" }
            - { call: "POST /test-results/${result_id}/disclose", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
          trigger:
            - { call: "POST /consent-records/${consent_id}/revoke", payload: {}, as: GeneticCounselor, as_user_id: "${cid}", captures: { err: $.data.error_id } }
          assert:
            - "response data.error_id == ERR_CONSENT_LOCKED_BY_DISCLOSURE"
            - "ConsentRecord.${consent_id}.status == SIGNED"

      - name: second_claim_on_case_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.CounselingCase.UNBILLED_to_PENDING_AUTH
          - errors[ERR_CLAIM_ALREADY_EXISTS]
        distinguishing_aspect: "Creating a second non-VOID InsuranceClaim for a case that already has one returns ERR_CLAIM_ALREADY_EXISTS (409)."
        test_recipe:
          setup: ["Case + order with one existing claim"]
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Kindred K", outreach_budget_cents: 10000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC AB", npi: "2000000011" }, as: ProgramAdmin, captures: { cid: $.data.id } }
            - { call: "POST /labs", payload: { lab_name: "LabK", max_concurrent_capacity: 5, turnaround_days: 10 }, as: ProgramAdmin, captures: { lid: $.data.id } }
            - { call: "POST /counseling-cases", payload: { family_id: "${fid}", assigned_counselor_id: "${cid}", patient_name: "P", patient_dob: "1980-01-01", sex: "FEMALE", ancestry: "EUROPEAN", referral_reason: "FHx", covered_sessions: 1 }, as: GeneticCounselor, as_user_id: "${cid}", captures: { case_id: $.data.id } }
            - { call: "POST /test-orders", payload: { counseling_case_id: "${case_id}", lab_id: "${lid}", panel_name: "Panel", list_price_cents: 100000, processing_start: "2026-05-02T09:00:00Z", processing_end: "2026-05-08T09:00:00Z" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { order_id: $.data.id } }
            - { call: "POST /insurance-claims", payload: { counseling_case_id: "${case_id}", test_order_id: "${order_id}", payer_name: "Payer", member_number: "M1", coverage_pct: 0.8, estimated_allowed_rate: 0.7, line_items: [ { cpt: "81162", billed_cents: 100000 } ] }, as: BillingSpecialist }
          trigger:
            - { call: "POST /insurance-claims", payload: { counseling_case_id: "${case_id}", test_order_id: "${order_id}", payer_name: "Payer", member_number: "M2", coverage_pct: 0.8, estimated_allowed_rate: 0.7, line_items: [ { cpt: "81162", billed_cents: 100000 } ] }, as: BillingSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "response data.error_id == ERR_CLAIM_ALREADY_EXISTS"

      - name: expire_invitation_before_deadline_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.CascadeInvitation.SENT_to_EXPIRED
          - errors[ERR_INVITATION_NOT_EXPIRABLE]
        distinguishing_aspect: "Expiring a SENT invitation while the logical clock (default 2026-05-01) is before expires_at (2026-07-01) returns ERR_INVITATION_NOT_EXPIRABLE (409)."
        test_recipe:
          setup: ["Proband disclosed PATHOGENIC; invitation SENT with expires_at 2026-07-01; clock at default 2026-05-01"]
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Kindred L", outreach_budget_cents: 100000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC AC", npi: "2000000012" }, as: ProgramAdmin, captures: { cid: $.data.id } }
            - { call: "POST /labs", payload: { lab_name: "LabL", max_concurrent_capacity: 5, turnaround_days: 14 }, as: ProgramAdmin, captures: { lid: $.data.id } }
            - { call: "POST /counseling-cases", payload: { family_id: "${fid}", assigned_counselor_id: "${cid}", patient_name: "Prob L", patient_dob: "1980-01-01", sex: "FEMALE", ancestry: "EUROPEAN", referral_reason: "FHx", covered_sessions: 2 }, as: GeneticCounselor, as_user_id: "${cid}", captures: { case_id: $.data.id } }
            - { call: "POST /pedigree-members", payload: { counseling_case_id: "${case_id}", relationship: "SIBLING", degree: 1, affected: false }, as: GeneticCounselor, as_user_id: "${cid}", captures: { mem_id: $.data.id } }
            - { call: "POST /pedigree-members", payload: { counseling_case_id: "${case_id}", relationship: "PARENT", degree: 1, affected: true, age_of_onset: 40 }, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /counseling-cases/${case_id}/assess-risk", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /consent-records", payload: { counseling_case_id: "${case_id}", consent_type: "TESTING" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { consent_id: $.data.id } }
            - { call: "POST /consent-records/${consent_id}/sign", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /test-orders", payload: { counseling_case_id: "${case_id}", lab_id: "${lid}", panel_name: "BRCA", list_price_cents: 300000, processing_start: "2026-05-02T09:00:00Z", processing_end: "2026-05-16T09:00:00Z" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { order_id: $.data.id } }
            - { call: "POST /test-orders/${order_id}/submit", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /test-results", payload: { test_order_id: "${order_id}", gene: "BRCA1", variant: "c.68del", classification: "PATHOGENIC" }, as: LabTechnician, as_user_id: "${lid}", captures: { result_id: $.data.id } }
            - { call: "POST /test-results/${result_id}/release", payload: {}, as: LabTechnician, as_user_id: "${lid}" }
            - { call: "POST /test-results/${result_id}/disclose", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /cascade-invitations", payload: { family_id: "${fid}", proband_case_id: "${case_id}", pedigree_member_id: "${mem_id}", relative_name: "Rel L", relationship: "SIBLING", degree: 1, contact_method: "LETTER", expires_at: "2026-07-01T00:00:00Z" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { inv_id: $.data.id } }
            - { call: "POST /cascade-invitations/${inv_id}/send", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
          trigger:
            - { call: "POST /cascade-invitations/${inv_id}/expire", payload: {}, as: GeneticCounselor, as_user_id: "${cid}", captures: { err: $.data.error_id } }
          assert:
            - "response data.error_id == ERR_INVITATION_NOT_EXPIRABLE"
            - "CascadeInvitation.${inv_id}.status == SENT"

      - name: order_cancel_releases_lab_load
        claim_type: Side Effect Execution
        grounds: [state_machines.TestOrder.SUBMITTED_to_CANCELLED, entities.Lab.fields.current_processing_load]
        distinguishing_aspect: "Cancelling a SUBMITTED order returns the lab's current_processing_load to 0 (slot released)."
        test_recipe:
          setup: ["Case consented; order submitted (lab load 1)"]
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Kindred M", outreach_budget_cents: 10000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC AD", npi: "2000000013" }, as: ProgramAdmin, captures: { cid: $.data.id } }
            - { call: "POST /labs", payload: { lab_name: "LabM", max_concurrent_capacity: 3, turnaround_days: 14 }, as: ProgramAdmin, captures: { lid: $.data.id } }
