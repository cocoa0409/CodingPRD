      - name: fee_monthly_rounding_order
        grounds:
          - calculations.authorizer_fee_billing
          - entities.FeeInvoice.fields.billed_amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — round each monthly installment to cents
          THEN multiply by 12. For total_funding 406400000 at rate 0.020 the pinned order yields
          677333*12 == 8127996, while the unpinned round-of-annual yields 8128000; the 4-cent
          delta is observable on the create response (ESTIMATED variant already bills).
        test_recipe:
          setup:
            - "School OPEN with ACTIVE contract (standard fixture, composite 90.0)"
            - "Logical clock at default 2026-05-01T00:00:00Z"
