          - entities.PhysicalExam.fields.expires_at
        distinguishing_aspect: "expires_at is performed_at + 14 days exactly, and the sweep's precondition is a strict overshoot: at 2026-08-24T14:00:00Z the exam is already non-citable but still PASSED, and only at 2026-08-24T14:00:01Z does the sweep move it to EXPIRED."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z with Harbor Kings, Ray Alder and one SCHEDULED ENTRY_PHYSICAL in [2026-08-10T13:00:00Z, 2026-08-10T20:00:00Z)."
            - "The exam is recorded PASSED with performed_at 2026-08-10T14:00:00Z, so PHYSICAL_VALIDITY_DAYS 14 puts expires_at at 2026-08-24T14:00:00Z."
            - "The club has no other obligations, so every compliance sweep below finds an empty violation list."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
