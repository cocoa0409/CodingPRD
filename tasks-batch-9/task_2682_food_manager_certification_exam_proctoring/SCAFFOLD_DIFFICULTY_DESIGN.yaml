          A third metric (allowed_minutes) reached through a third endpoint (session creation). The
          Spanish form contributes translated_extra_minutes 30 on top of round_half_up(base_minutes *
          multiplier), and the cap MAX_SESSION_MINUTES 240 is applied LAST: multiplier 1.75 gives
          210 + 30 = 240, exactly the cap, so nothing is clamped and the value must be 240; multiplier
          2.0 on a REMOTE sitting gives 240 + 30 + 10 = 280, above the cap, so it is clamped to 240;
          multiplier 1.5 gives 180 + 30 = 210, below the cap. An implementation that clamps
          base_minutes * multiplier before adding the allowances returns 240 for the 1.5 case too, and
          one that applies the cap first returns 280.
