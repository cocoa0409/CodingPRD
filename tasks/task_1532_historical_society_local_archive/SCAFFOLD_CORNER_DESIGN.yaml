            - { call: "GET /accessions/${a}", as: Registrar, captures: { av: $.data.version } }
            - { call: "POST /deeds/${d}/execute", payload: { expected_accession_version: "${av}" }, as: Registrar }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "I1" }, as: Archivist, captures: { i: $.data.id } }
            - { call: "POST /deaccession-proposals", payload: { item_ids: ["${i}"], justification: "repatriation", disposal_method: "TRANSFER" }, as: Registrar, as_user_id: "reg_1", captures: { p: $.data.id } }
            - { call: "POST /deaccession-proposals/${p}/submit", as: Registrar, as_user_id: "reg_1" }
            - { call: "POST /deaccession-proposals/${p}/send-to-board", as: Registrar, as_user_id: "reg_1" }
            - { call: "POST /deaccession-proposals/${p}/approve", as: BoardOfficer, as_user_id: "board_1" }
          trigger:
            - { call: "POST /deaccession-proposals/${p}/finalize", payload: {}, as: Registrar, as_user_id: "reg_1", captures: { e1: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-30T00:00:00Z" }, as: SystemAdmin }
            - { call: "GET /deaccession-proposals/${p}", as: Registrar, captures: { st1: $.data.status } }
            - { call: "POST /deaccession-proposals/${p}/finalize", payload: {}, as: Registrar, as_user_id: "reg_1", captures: { e2: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: SystemAdmin }
            - { call: "GET /deaccession-proposals/${p}", as: Registrar, captures: { st2: $.data.status } }
            - { call: "POST /deaccession-proposals/${p}/finalize", payload: {}, as: Registrar, as_user_id: "reg_1", captures: { fin: $.data.status } }
          assert:
            - "immediately after approval: finalize fails ERR_COOLING_OFF_NOT_ELAPSED (${e1})"
            - "at 2026-08-30 (one day early): still APPROVED (${st1}); finalize fails again (${e2} == ERR_COOLING_OFF_NOT_ELAPSED)"
            - "at exactly 2026-08-31T00:00:00Z the sweep moves the proposal to COOLED_OFF (${st2})"
            - "finalize then succeeds: FINALIZED (${fin}); Item.${i} DEACCESSIONED; Collection.${c} DEACCESSIONED (last item gone)"

      - name: volunteer_hour_cap_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.volunteer_hours_accumulation
          - errors[ERR_VOLUNTEER_HOUR_CAP_EXCEEDED]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Cumulative threshold at exact boundary: logging 25.0 then 15.0 hours reaches exactly the 40-hour cap (allowed, ==); a further 0.25 fails ERR_VOLUNTEER_HOUR_CAP_EXCEEDED; a 1.3-hour entry fails ERR_INVALID_REQUEST (positive multiples of 0.25 only) and the shape error outranks the cap."
        test_recipe:
