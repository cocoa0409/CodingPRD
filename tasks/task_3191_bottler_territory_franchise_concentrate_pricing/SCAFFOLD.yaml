  # --- ConcentratePurchaseOrder ---
  - method: POST
    path: "/bottler/concentrate-purchase-orders"
    description: "Place a concentrate purchase order at provisional pricing (OCC on agreement version)"
    roles: [BottlerOps]
    code: 201
    input: [agreement_id, product_line_id, quantity_gallons, delivery_quarter, expected_agreement_version]
    output: ConcentratePurchaseOrder
    side_effects:
      - "computes provisional_unit_price / provisional_amount_cents per concentrate_unit_price provisional variant"
      - "increments BottlerAgreement.version by 1"
  - method: GET
    path: "/bottler/concentrate-purchase-orders/{id}"
    description: "Fetch one CPO"
    roles: [PlatformAdmin, BrandOwnerAdmin, BottlerOps]
    code: 200
    input: []
    output: ConcentratePurchaseOrder
    side_effects: []
  - method: GET
    path: "/bottler/concentrate-purchase-orders"
    description: "List CPOs, optionally by agreement or product line"
    roles: [PlatformAdmin, BrandOwnerAdmin, BottlerOps]
    code: 200
    input: ["agreement_id?", "product_line_id?", "limit?", "offset?"]
    output: ConcentratePurchaseOrder[]
    side_effects: []
  - method: POST
    path: "/bottler/concentrate-purchase-orders/{id}/receive"
    description: "Mark a PLACED CPO received"
