            - { call: "POST /referral-orders/${o1}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-1", approved_nights: 1, window_start: "2026-07-01", window_end: "2026-09-30", expected_referral_order_version: "${o1_v}" }, as: Scheduler, captures: { a1: $.data.id } }
            - { call: "POST /authorizations/${a1}/decision", payload: { outcome: "APPROVED" }, as: Scheduler }
            - { call: "POST /sleep-studies", payload: { patient_id: "${p1}", order_id: "${o1}", study_type: "HST", scheduled_date: "2026-08-01" }, as: Scheduler, captures: { st1: $.data.id } }
            - { call: "POST /sleep-studies/${st1}/check-in", payload: {}, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /sleep-studies/${st1}/complete-acquisition", payload: { total_recording_time_minutes: 360 }, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /scoring-tasks", payload: { study_id: "${st1}", scorer_id: "${s1}", assignment_kind: "PRIMARY" }, as: LabDirector, captures: { tk1: $.data.id } }
            - { call: "POST /scoring-tasks/${tk1}/start", payload: {}, as: Scorer, as_user_id: "${s1}" }
            - { call: "POST /scoring-tasks/${tk1}/submit", payload: { obstructive_apneas: 30, central_apneas: 0, mixed_apneas: 0, hypopneas: 30, reras: 0, epochs_total: 1000, total_recording_time_minutes: 360 }, as: Scorer, as_user_id: "${s1}" }
            - { call: "POST /scoring-tasks/${tk1}/accept", payload: {}, as: InterpretingPhysician, as_user_id: "${dr1}" }
            - { call: "POST /scoring-tasks", payload: { study_id: "${st1}", scorer_id: "${s2}", assignment_kind: "RELIABILITY_RESCORE" }, as: LabDirector, captures: { rt1: $.data.id } }
            - { call: "POST /scoring-tasks/${rt1}/start", payload: {}, as: Scorer, as_user_id: "${s2}" }
            - { call: "POST /scoring-tasks/${rt1}/submit", payload: { obstructive_apneas: 10, central_apneas: 0, mixed_apneas: 0, hypopneas: 10, reras: 0, epochs_total: 1000, total_recording_time_minutes: 360 }, as: Scorer, as_user_id: "${s2}" }
            - { call: "POST /scoring-tasks/${rt1}/accept", payload: {}, as: InterpretingPhysician, as_user_id: "${dr1}" }
            - { call: "POST /inter-rater-cases", payload: { study_id: "${st1}", primary_task_id: "${tk1}", rescore_task_id: "${rt1}" }, as: LabDirector, captures: { c1: $.data.id } }
