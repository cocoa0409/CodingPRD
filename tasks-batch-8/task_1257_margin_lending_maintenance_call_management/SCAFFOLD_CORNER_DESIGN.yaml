            - { call: "POST /margin/accounts/${acct_id}/orders", payload: { security_id: "${sec_abc}", side: "BUY", quantity: 200 }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "OFFICIAL_CLOSE", price_cents: 7000 }, as: MarketDataOps }
            - { call: "GET /margin/accounts/${acct_id}/margin-calls", payload: {}, as: MarginSupervisor, captures: { call_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T23:59:59Z" }, as: MarketDataOps }
            - { call: "POST /_sweeps/daily", payload: {}, as: MarketDataOps }
            - { call: "GET /margin/margin-calls/${call_id}", payload: {}, as: MarginSupervisor, captures: { st_early: $.data.call_status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:01Z" }, as: MarketDataOps }
            - { call: "POST /_sweeps/daily", payload: {}, as: MarketDataOps }
            - { call: "GET /margin/margin-calls/${call_id}", payload: {}, as: MarginSupervisor, captures: { st_late: $.data.call_status } }
          assert:
            - "at due_at - 2s: call_status == OPEN"
            - "at due_at + 1s: call_status == EXPIRED  # HOUSE deadline issued_at + 48h"

  # ==========================================================================
  # Section: consistency_model
  # ==========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_order_effects
        claim_type: immediate_consistency
        grounds:
          - 'complexity_profile.consistency_model'
          - 'endpoints.POST /margin/accounts/{id}/orders'
        distinguishing_aspect: "Order response (Position) and a subsequent account GET in the same logical instant reflect the fill: cash debited and equity recomputed — no eventual lag."
        test_recipe:
          setup: ["funded account, ABC marked 10000 both bases"]
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "Imm Ediate", email: "imm@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id } }
            - { call: "POST /margin/security-profiles", payload: { symbol: "ABC", marginable: true, house_maint_long_bps: 3000, house_maint_short_bps: 3500, liquidity_tier: 1, concentration_threshold_bps: 6000 }, as: MarginSupervisor, captures: { sec_abc: $.data.id } }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "REALTIME", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "OFFICIAL_CLOSE", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/account-applications", payload: { customer_id: "${c_id}", annual_income_cents: 15000000, liquid_net_worth_cents: 50000000, investment_experience_years: 5 }, as: Customer, as_user_id: "${c_id}", captures: { app_id: $.data.id } }
            - { call: "POST /margin/account-applications/${app_id}/review", payload: {}, as: MarginAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /margin/account-applications/${app_id}/approve", payload: {}, as: MarginSupervisor, as_user_id: "sup-1", captures: { acct_id: $.data.account_id } }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { v0: $.data.version } }
            - { call: "POST /margin/accounts/${acct_id}/cash-movements", payload: { movement_type: "DEPOSIT", amount_cents: 1000000, expected_account_version: "${v0}" }, as: Customer, as_user_id: "${c_id}" }
          trigger:
            - { call: "POST /margin/accounts/${acct_id}/orders", payload: { security_id: "${sec_abc}", side: "BUY", quantity: 10 }, as: Customer, as_user_id: "${c_id}", captures: { pos_qty: $.data.quantity, pos_mv: $.data.mv_realtime_cents } }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { cash: $.data.cash_balance_cents } }
          assert:
            - "order response: quantity == 10 and mv_realtime_cents == 100000 in the same response"
            - "immediate GET: cash_balance_cents == 900000"

  # ==========================================================================
  # Stubs: corners already covered by 1.8 difficulty instances
  # ==========================================================================
  - section: state_machines
    instances:
      - name: corner_liquidation_requires_expired_call_stub
        claim_type: precondition_enforcement
        grounds:
          - 'state_machines.MarginCall.EXPIRED_to_LIQUIDATION_IN_PROGRESS'
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / liquidation_requires_call_expired_pair_liqorder_call"
          rationale: "Asserted as the failure path of the named 1.8 instance."
      - name: corner_opening_order_blocked_when_restricted_stub
        claim_type: invalid_transition
        grounds:
          - 'state_machines.MarginAccount.ACTIVE_to_RESTRICTED'
          - 'errors[ERR_ACCOUNT_RESTRICTED"]'
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / withdrawal_state_beats_fiscal"
          rationale: "ERR_ACCOUNT_RESTRICTED on a RESTRICTED account is the asserted outcome; order-gating shares the same priority-5 check."
