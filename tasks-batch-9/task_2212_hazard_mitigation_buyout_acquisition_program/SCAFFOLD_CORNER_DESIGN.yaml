              payload: { disconnection_id: "${ud_water}", outcome: "CONFIRMED", confirmation_reference: "W-1" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /utility-disconnections/${ud_elec}/resolve"
              payload: { disconnection_id: "${ud_elec}", outcome: "CONFIRMED", confirmation_reference: "E-1" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
