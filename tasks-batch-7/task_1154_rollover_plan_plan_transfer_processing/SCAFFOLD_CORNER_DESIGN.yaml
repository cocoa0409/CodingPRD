        distinguishing_aspect: "Plan lifecycle guards: double-freeze -> ERR_PLAN_FROZEN; unfreeze of an ACTIVE plan -> ERR_PLAN_NOT_FROZEN; double-terminate -> ERR_PLAN_TERMINATED."
        test_recipe:
