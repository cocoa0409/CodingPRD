# =============================================================================
# Task 1235: Thermoforming & Vacuum-Form Plant — §1.8 Test Targeting Index
# 9 Difficulty Rules x 2 instances = 18 instances.
# Logical clock default 2026-05-01T00:00:00Z; cert windows 2026-04-01..2026-09-01
# are therefore valid at the default clock unless an instance sets the clock.
# =============================================================================

scaffold_difficulty_design:
  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: order_cost_provisional_vs_final_divergence
        grounds:
          - calculations.order_cost
          - entities.ProductionOrder.fields.provisional_cost
          - entities.ProductionOrder.fields.final_cost
          - state_machines.ProductionOrder(schedule_status).QUEUED_to_STAGED
          - state_machines.ProductionOrder(schedule_status).RUNNING_to_COMPLETED
        distinguishing_aspect: |
          Dual-variant logic on the ProductionOrder cost domain: the provisional
          variant prices the plan (std_cycle_time_s x std_machine_rate_per_hour
          over ordered_qty against RESERVED allocations) while the final variant
          prices actuality (measured window actual_end - planned_start at the
          station's machine_rate_per_hour against CONSUMED allocations). With
          identical nominal inputs the actual 1.0h window exceeds the standard
          0.8333h cycle budget, so provisional 369.00 != final 379.00.
        test_recipe:
          setup:
            - "CERTIFIED INDUSTRIAL lot (PETG, 1.500mm, 10.000kg @ 10.00/kg)"
            - "PRODUCTION tool T-100 (part P-100, gauge 1.000-3.000, INDUSTRIAL, production_cost 10000.00, rated_lifetime_shots 100000)"
            - "STOCK spec ACTIVE (INDUSTRIAL); FORMING_STATION ST-1 (INDUSTRIAL, 60.00/h); INSPECTION_BOOTH B-1 (INDUSTRIAL)"
            - "Order O-1 INDUSTRIAL qty 100 (spec_min 1.230, nominal 1.300, part weight 0.050kg, std cycle 30s, std rate 60.00) with 5.900kg RESERVED virgin allocation"
          setup_api_calls:
            - { call: "POST /material-lots", payload: { lot_code: "L-100", resin_type: PETG, gauge_mm: 1.500, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 10.000, unit_cost_per_kg: 10.00 }, as: MaterialsPlanner, captures: { lot_id: $.data.id } }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: MATERIAL_LOT, subject_id: "${lot_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools", payload: { tool_code: "T-100", part_number: "P-100", tool_type: MATCHED_SET, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 2000.00 }, as: ToolingEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /tools/${tool_id}/complete-prototype", as: ToolingEngineer }
            - { call: "POST /tools/${tool_id}/submit-qualification", as: ToolingEngineer }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: TOOL, subject_id: "${tool_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools/${tool_id}/approve-production", payload: { production_cost: 10000.00, rated_lifetime_shots: 100000 }, as: ToolingEngineer }
            - { call: "POST /packaging-specs", payload: { spec_code: "S-1", spec_type: STOCK, cleanliness_grade: INDUSTRIAL, per_pack_cost: 0.50 }, as: PackagingEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /machine-resources", payload: { resource_code: "ST-1", resource_type: FORMING_STATION, cleanliness_grade: INDUSTRIAL, machine_rate_per_hour: 60.00 }, as: ProductionScheduler, captures: { station_id: $.data.id } }
            - { call: "POST /machine-resources", payload: { resource_code: "B-1", resource_type: INSPECTION_BOOTH, cleanliness_grade: INDUSTRIAL, machine_rate_per_hour: 25.00 }, as: ProductionScheduler, captures: { booth_id: $.data.id } }
            - { call: "POST /production-orders", payload: { order_code: "O-1", part_number: "P-100", resin_type: PETG, ordered_qty: 100, required_gauge_mm: 1.500, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.300, spec_min_wall_mm: 1.230, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 60.00, tool_id: "${tool_id}", packaging_spec_id: "${spec_id}", is_prototype_order: false }, as: ProductionScheduler, captures: { order_id: $.data.id } }
            - { call: "POST /material-allocations", payload: { production_order_id: "${order_id}", source_type: VIRGIN_LOT, lot_id: "${lot_id}", qty_kg: 5.900 }, as: ProductionScheduler }
            - { call: "GET /production-orders/${order_id}", as: Any, captures: { o_ver: $.data.version } }
          trigger:
            - { call: "POST /production-orders/${order_id}/stage", payload: { expected_production_order_version: "${o_ver}" }, as: ProductionScheduler, captures: { prov_cost: $.data.provisional_cost, prov_tooling: $.data.tooling_charge } }
            - { call: "POST /forming-runs", payload: { production_order_id: "${order_id}", station_id: "${station_id}", planned_start: "2026-05-02T10:00:00Z", planned_end: "2026-05-02T11:00:00Z", oven_temp_c: 180.0, cycle_time_s: 28, shots_planned: 100 }, as: ProductionScheduler, captures: { run_id: $.data.id } }
            - { call: "POST /forming-runs/${run_id}/complete", payload: { shots_completed: 100, scrap_weight_kg: 0.000, actual_end: "2026-05-02T11:00:00Z" }, as: ProductionScheduler }
            - { call: "POST /quality-inspections", payload: { production_order_id: "${order_id}", booth_id: "${booth_id}", inspection_type: FINAL, scheduled_start: "2026-05-02T12:00:00Z", scheduled_end: "2026-05-02T12:30:00Z", wall_measurements_mm: [1.240, 1.250] }, as: QualityInspector, as_user_id: qi-1, captures: { insp_id: $.data.id } }
            - { call: "POST /quality-inspections/${insp_id}/disposition", payload: { disposition: PASS }, as: QualityInspector, as_user_id: qi-2 }
            - { call: "GET /production-orders/${order_id}", as: Any, captures: { fin_cost: $.data.final_cost, sched: $.data.schedule_status } }
            - { call: "GET /material-lots/${lot_id}", as: Any, captures: { lot_avail: $.data.available_kg } }
          assert:
            - "provisional_cost == 369.00 (captured ${prov_cost})"
            - "tooling_charge at stage == 10.00 (captured ${prov_tooling})"
            - "final_cost == 379.00 (captured ${fin_cost})"
            - "final_cost != provisional_cost (delta exactly 10.00)"
            - "ProductionOrder.${order_id}.schedule_status == COMPLETED (captured ${sched})"
            - "MaterialLot.${lot_id}.available_kg == 4.100 (captured ${lot_avail})"
      - name: tool_amortization_prototype_vs_production_variants
        grounds:
          - calculations.tool_amortization_charge
          - entities.Tool.fields.prototype_cost
          - entities.Tool.fields.production_cost
          - entities.Tool.fields.rated_lifetime_shots
        distinguishing_aspect: |
          Dual-variant logic on the Tool amortization domain (distinct entity
          domain from order cost): a PROTOTYPE tool charges its full
          prototype_cost to the order (2000.00) while a PRODUCTION tool charges
          round(production_cost / rated_lifetime_shots, 4) per shot (10.00 for
          the same 100-shot order), a 1990.00 divergence on identical order data.
        test_recipe:
          setup:
            - "CERTIFIED INDUSTRIAL lot 20.000kg @ 10.00/kg"
            - "Tool TP prototype-only (complete-prototype; prototype_cost 2000.00); Tool TQ full production path (production_cost 10000.00, 100000 shots)"
            - "STOCK spec ACTIVE; order OP on TP (is_prototype_order=true, qty 100) and OQ on TQ (qty 100), each with 5.900kg RESERVED virgin"
          setup_api_calls:
            - { call: "POST /material-lots", payload: { lot_code: "L-200", resin_type: PETG, gauge_mm: 1.500, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 20.000, unit_cost_per_kg: 10.00 }, as: MaterialsPlanner, captures: { lot_id: $.data.id } }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: MATERIAL_LOT, subject_id: "${lot_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools", payload: { tool_code: "TP", part_number: "P-100", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 2000.00 }, as: ToolingEngineer, captures: { tool_p: $.data.id } }
            - { call: "POST /tools/${tool_p}/complete-prototype", as: ToolingEngineer }
            - { call: "POST /tools", payload: { tool_code: "TQ", part_number: "P-100", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 2000.00 }, as: ToolingEngineer, captures: { tool_q: $.data.id } }
            - { call: "POST /tools/${tool_q}/complete-prototype", as: ToolingEngineer }
            - { call: "POST /tools/${tool_q}/submit-qualification", as: ToolingEngineer }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: TOOL, subject_id: "${tool_q}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools/${tool_q}/approve-production", payload: { production_cost: 10000.00, rated_lifetime_shots: 100000 }, as: ToolingEngineer }
            - { call: "POST /packaging-specs", payload: { spec_code: "S-2", spec_type: STOCK, cleanliness_grade: INDUSTRIAL, per_pack_cost: 0.50 }, as: PackagingEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /production-orders", payload: { order_code: "OP", part_number: "P-100", resin_type: PETG, ordered_qty: 100, required_gauge_mm: 1.500, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.300, spec_min_wall_mm: 1.230, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 60.00, tool_id: "${tool_p}", packaging_spec_id: "${spec_id}", is_prototype_order: true }, as: ProductionScheduler, captures: { ord_p: $.data.id } }
            - { call: "POST /material-allocations", payload: { production_order_id: "${ord_p}", source_type: VIRGIN_LOT, lot_id: "${lot_id}", qty_kg: 5.900 }, as: ProductionScheduler }
            - { call: "GET /production-orders/${ord_p}", as: Any, captures: { op_ver: $.data.version } }
            - { call: "POST /production-orders", payload: { order_code: "OQ", part_number: "P-100", resin_type: PETG, ordered_qty: 100, required_gauge_mm: 1.500, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.300, spec_min_wall_mm: 1.230, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 60.00, tool_id: "${tool_q}", packaging_spec_id: "${spec_id}", is_prototype_order: false }, as: ProductionScheduler, captures: { ord_q: $.data.id } }
            - { call: "POST /material-allocations", payload: { production_order_id: "${ord_q}", source_type: VIRGIN_LOT, lot_id: "${lot_id}", qty_kg: 5.900 }, as: ProductionScheduler }
            - { call: "GET /production-orders/${ord_q}", as: Any, captures: { oq_ver: $.data.version } }
          trigger:
            - { call: "POST /production-orders/${ord_p}/stage", payload: { expected_production_order_version: "${op_ver}" }, as: ProductionScheduler, captures: { p_tooling: $.data.tooling_charge, p_prov: $.data.provisional_cost } }
            - { call: "POST /production-orders/${ord_q}/stage", payload: { expected_production_order_version: "${oq_ver}" }, as: ProductionScheduler, captures: { q_tooling: $.data.tooling_charge, q_prov: $.data.provisional_cost } }
          assert:
            - "Order.${ord_p}.tooling_charge == 2000.00 (prototype flat variant; captured ${p_tooling})"
            - "Order.${ord_q}.tooling_charge == 10.00 (production per-shot variant: round(10000.00/100000,4)=0.1000 x 100; captured ${q_tooling})"
            - "Order.${ord_p}.provisional_cost == 2359.00 (captured ${p_prov})"
            - "Order.${ord_q}.provisional_cost == 369.00 (captured ${q_prov})"
            - "provisional divergence == 1990.00 driven solely by tool status variant"
  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: regrind_blend_cap_nested_min_gate
        grounds:
          - calculations.regrind_blend_plan
          - entities.RegrindBatch.fields.certified_grade
          - entities.MaterialAllocation.fields.source_type
          - errors[ERR_BLEND_CAP_EXCEEDED]
        distinguishing_aspect: |
          Mode (a) combinatorial formula: blend eligibility combines >= 3 inputs
          (order.required_material_kg, BLEND_CAP[order.cleanliness_grade], batch
          eligible_kg) through a nested min with a grade-rank conditional branch
          (batch.certified_grade must rank >= order grade). FOOD cap on 5.900kg
          required = 0.885kg; cumulative 0.800 then +0.100 = 0.900 > 0.885 is
          rejected even though the batch holds 2.500kg eligible.
        test_recipe:
          setup:
            - "Donor INDUSTRIAL order completed one run yielding 2.500kg scrap; batch RB-1 (PETG, source FOOD, target 2.000kg) accumulated 2.500 and decided CERTIFIED/FOOD by a second planner"
            - "Target FOOD order OF qty 100 (required_material_kg 5.900) QUEUED with 5.900kg virgin RESERVED from FOOD-certified lot"
          setup_api_calls:
            - { call: "POST /material-lots", payload: { lot_code: "LD", resin_type: PETG, gauge_mm: 1.500, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 10.000, unit_cost_per_kg: 10.00 }, as: MaterialsPlanner, captures: { lot_d: $.data.id } }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: MATERIAL_LOT, subject_id: "${lot_d}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools", payload: { tool_code: "TD", part_number: "P-D", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 1500.00 }, as: ToolingEngineer, captures: { tool_d: $.data.id } }
            - { call: "POST /tools/${tool_d}/complete-prototype", as: ToolingEngineer }
            - { call: "POST /tools/${tool_d}/submit-qualification", as: ToolingEngineer }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: TOOL, subject_id: "${tool_d}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools/${tool_d}/approve-production", payload: { production_cost: 9000.00, rated_lifetime_shots: 90000 }, as: ToolingEngineer }
            - { call: "POST /packaging-specs", payload: { spec_code: "S-D", spec_type: STOCK, cleanliness_grade: INDUSTRIAL, per_pack_cost: 0.40 }, as: PackagingEngineer, captures: { spec_d: $.data.id } }
            - { call: "POST /machine-resources", payload: { resource_code: "ST-D", resource_type: FORMING_STATION, cleanliness_grade: INDUSTRIAL, machine_rate_per_hour: 55.00 }, as: ProductionScheduler, captures: { st_d: $.data.id } }
            - { call: "POST /production-orders", payload: { order_code: "OD", part_number: "P-D", resin_type: PETG, ordered_qty: 100, required_gauge_mm: 1.500, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.300, spec_min_wall_mm: 1.230, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 55.00, tool_id: "${tool_d}", packaging_spec_id: "${spec_d}", is_prototype_order: false }, as: ProductionScheduler, captures: { ord_d: $.data.id } }
            - { call: "POST /material-allocations", payload: { production_order_id: "${ord_d}", source_type: VIRGIN_LOT, lot_id: "${lot_d}", qty_kg: 5.900 }, as: ProductionScheduler }
            - { call: "GET /production-orders/${ord_d}", as: Any, captures: { od_ver: $.data.version } }
            - { call: "POST /production-orders/${ord_d}/stage", payload: { expected_production_order_version: "${od_ver}" }, as: ProductionScheduler }
            - { call: "POST /forming-runs", payload: { production_order_id: "${ord_d}", station_id: "${st_d}", planned_start: "2026-05-02T10:00:00Z", planned_end: "2026-05-02T11:00:00Z", oven_temp_c: 180.0, cycle_time_s: 30, shots_planned: 100 }, as: ProductionScheduler, captures: { run_d: $.data.id } }
            - { call: "POST /forming-runs/${run_d}/complete", payload: { shots_completed: 100, scrap_weight_kg: 2.500, actual_end: "2026-05-02T11:00:00Z" }, as: ProductionScheduler }
            - { call: "GET /scrap-records", payload: { forming_run_id: "${run_d}" }, as: Any, captures: { scrap_id: "$.data[0].id" } }
            - { call: "POST /regrind-batches", payload: { batch_code: "RB-1", resin_type: PETG, source_grade: FOOD, target_kg: 2.000 }, as: MaterialsPlanner, as_user_id: planner-1, captures: { rb_id: $.data.id } }
            - { call: "POST /scrap-records/${scrap_id}/certify", payload: { regrind_batch_id: "${rb_id}", decision: CERTIFY }, as: MaterialsPlanner }
            - { call: "POST /regrind-batches/${rb_id}/decide", payload: { decision: CERTIFIED, certified_grade: FOOD }, as: MaterialsPlanner, as_user_id: planner-2 }
            - { call: "POST /material-lots", payload: { lot_code: "LT", resin_type: PETG, gauge_mm: 1.500, cleanliness_grade_required: FOOD, quantity_kg: 10.000, unit_cost_per_kg: 12.00 }, as: MaterialsPlanner, captures: { lot_t: $.data.id } }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: MATERIAL_LOT, subject_id: "${lot_t}", grade: FOOD, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools", payload: { tool_code: "TT", part_number: "P-F", tool_type: MATCHED_SET, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: FOOD, prototype_cost: 1800.00 }, as: ToolingEngineer, captures: { tool_t: $.data.id } }
            - { call: "POST /tools/${tool_t}/complete-prototype", as: ToolingEngineer }
            - { call: "POST /tools/${tool_t}/submit-qualification", as: ToolingEngineer }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: TOOL, subject_id: "${tool_t}", grade: FOOD, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools/${tool_t}/approve-production", payload: { production_cost: 9500.00, rated_lifetime_shots: 95000 }, as: ToolingEngineer }
            - { call: "POST /packaging-specs", payload: { spec_code: "S-F", spec_type: STOCK, cleanliness_grade: FOOD, per_pack_cost: 0.60 }, as: PackagingEngineer, captures: { spec_t: $.data.id } }
            - { call: "POST /production-orders", payload: { order_code: "OF", part_number: "P-F", resin_type: PETG, ordered_qty: 100, required_gauge_mm: 1.500, cleanliness_grade: FOOD, spec_nominal_wall_mm: 1.300, spec_min_wall_mm: 1.230, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 60.00, tool_id: "${tool_t}", packaging_spec_id: "${spec_t}", is_prototype_order: false }, as: ProductionScheduler, captures: { ord_f: $.data.id } }
            - { call: "POST /material-allocations", payload: { production_order_id: "${ord_f}", source_type: VIRGIN_LOT, lot_id: "${lot_t}", qty_kg: 5.900 }, as: ProductionScheduler }
          trigger:
            - { call: "POST /material-allocations", payload: { production_order_id: "${ord_f}", source_type: REGRIND, regrind_batch_id: "${rb_id}", qty_kg: 0.800 }, as: ProductionScheduler, captures: { alloc_r: $.data.id } }
            - { call: "POST /material-allocations", payload: { production_order_id: "${ord_f}", source_type: REGRIND, regrind_batch_id: "${rb_id}", qty_kg: 0.100 }, as: ProductionScheduler, captures: { err: $.data.error_id } }
            - { call: "GET /regrind-batches/${rb_id}", as: Any, captures: { rb_reserved: $.data.reserved_kg } }
          assert:
            - "First regrind allocation 0.800kg succeeds (id ${alloc_r}); cumulative 0.800 <= cap 0.885"
            - "Second regrind allocation 0.100kg rejected: error == ERR_BLEND_CAP_EXCEEDED (captured ${err}); cumulative 0.900 > round(5.900 x 0.15, 3) == 0.885"
            - "RegrindBatch.${rb_id}.reserved_kg == 0.800 (captured ${rb_reserved})"
      - name: wall_thickness_per_measurement_rounding_order
        grounds:
          - calculations.wall_thickness_distribution
          - entities.QualityInspection.fields.min_wall_mm
          - entities.QualityInspection.fields.avg_wall_mm
          - entities.QualityInspection.fields.deviation_pct
          - state_machines.QualityInspection.RECORDED_to_DISPOSITIONED
        distinguishing_aspect: |
          Mode (b) nested rounding with pinned order: each measurement is rounded
          to 0.001 HALF_UP BEFORE aggregation. Reading 1.2305 rounds to 1.231, so
          min_wall_mm == 1.231 >= spec_min 1.231 and PASS is legal; an
          implementation that aggregates raw values first would compute min
          1.2305 < 1.231 and be forced to reject PASS.
        test_recipe:
          setup:
            - "RUNNING INDUSTRIAL order (spec_nominal 1.300, spec_min 1.231) with one COMPLETED first-article run (10 good shots)"
            - "INSPECTION_BOOTH B-R available"
          setup_api_calls:
            - { call: "POST /material-lots", payload: { lot_code: "LR", resin_type: HIPS, gauge_mm: 1.500, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 10.000, unit_cost_per_kg: 8.00 }, as: MaterialsPlanner, captures: { lot_id: $.data.id } }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: MATERIAL_LOT, subject_id: "${lot_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools", payload: { tool_code: "TR", part_number: "P-R", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 1500.00 }, as: ToolingEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /tools/${tool_id}/complete-prototype", as: ToolingEngineer }
            - { call: "POST /tools/${tool_id}/submit-qualification", as: ToolingEngineer }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: TOOL, subject_id: "${tool_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools/${tool_id}/approve-production", payload: { production_cost: 9000.00, rated_lifetime_shots: 90000 }, as: ToolingEngineer }
            - { call: "POST /packaging-specs", payload: { spec_code: "S-R", spec_type: STOCK, cleanliness_grade: INDUSTRIAL, per_pack_cost: 0.40 }, as: PackagingEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /machine-resources", payload: { resource_code: "ST-R", resource_type: FORMING_STATION, cleanliness_grade: INDUSTRIAL, machine_rate_per_hour: 55.00 }, as: ProductionScheduler, captures: { station_id: $.data.id } }
            - { call: "POST /machine-resources", payload: { resource_code: "B-R", resource_type: INSPECTION_BOOTH, cleanliness_grade: INDUSTRIAL, machine_rate_per_hour: 25.00 }, as: ProductionScheduler, captures: { booth_id: $.data.id } }
