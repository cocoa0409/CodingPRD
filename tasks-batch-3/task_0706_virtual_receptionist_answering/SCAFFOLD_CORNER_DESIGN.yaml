        distinguishing_aspect: "An ES-requesting call with only EN-speaking AVAILABLE receptionists during business hours yields an empty candidate set -> the explicit answer attempt routes to OVERFLOW; with no overflow fallback path it raises ERR_NO_LANGUAGE_MATCH (409) when language is the sole disqualifier."
        test_recipe:
          setup:
            - "Account PUBLISHED 24h script overflow_action VOICEMAIL. One AVAILABLE EN-only receptionist. A call requesting ES."
          setup_api_calls:
            - call: "POST /va/_clock/set_current_utc"
