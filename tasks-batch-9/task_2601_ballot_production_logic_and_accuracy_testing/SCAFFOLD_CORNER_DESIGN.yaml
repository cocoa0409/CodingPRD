      - name: val_authentication_precedes_authorization_returns_unauthenticated
        claim_type: priority_ordering
        grounds:
          - validations.authentication-required
          - validations.role-authorized
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "An absent X-Role header and an unrecognized role string are the same 401 fault, and both outrank every later gate: the same request that would also fail the schema gate and the path gate still answers 401. Only a header naming one of the seven declared roles reaches the 403 authorization gate."
        test_recipe:
          setup:
            - "One election in SETUP. In the calls below `as: NO_ROLE_HEADER` means the request is sent with the X-Role header omitted entirely, and `as: BallotAuditor` means it is sent with a role string that is not one of the seven roles of §1.7."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { name: "November 2026 General", jurisdiction: "Kestrel County", election_date: "2026-11-03" }
              as: ElectionsDirector
              captures: { el: $.data.id }
          trigger:
            - call: "POST /elections/${el}/contests"
              payload: { title: "County Sheriff", contest_type: "CANDIDATE", district_code: "D-12", seats_open: 1 }
              as: NO_ROLE_HEADER
              captures: { err1: $.data.error_id }
            - call: "POST /elections/00000000-0000-0000-0000-0000000000ff/contests"
              payload: { contest_type: "REFERENDUM", seats_open: 0 }
              as: NO_ROLE_HEADER
              captures: { err2: $.data.error_id }
            - call: "POST /elections/${el}/contests"
              payload: { title: "County Sheriff", contest_type: "CANDIDATE", district_code: "D-12", seats_open: 1 }
              as: BallotAuditor
              captures: { err3: $.data.error_id }
            - call: "POST /elections/${el}/contests"
              payload: { title: "County Sheriff", contest_type: "CANDIDATE", district_code: "D-12", seats_open: 1 }
              as: PublicObserver
              captures: { err4: $.data.error_id }
            - call: "POST /elections/${el}/contests"
              payload: { title: "County Sheriff", contest_type: "CANDIDATE", district_code: "D-12", seats_open: 1 }
              as: BallotCoordinator
              captures: { ct_status: $.data.status }
          assert:
            - "Call 1: HTTP 401 with ${err1} == \"ERR_UNAUTHENTICATED\"."
            - "Call 2: HTTP 401 with ${err2} == \"ERR_UNAUTHENTICATED\" - the missing header is reported even though the body is malformed (priority 30) and the path id resolves to nothing (priority 40)."
            - "Call 3: HTTP 401 with ${err3} == \"ERR_UNAUTHENTICATED\" - an unknown role string is an authentication failure, not an authorization failure."
            - "Call 4: HTTP 403 with ${err4} == \"ERR_UNAUTHORIZED\" - PublicObserver is a declared role, so the request authenticates and then fails the endpoint's roles list."
            - "Call 5: HTTP 201 with ${ct_status} == \"DRAFT\"; exactly one Contest row exists, so none of the four rejected calls wrote anything."
            - "POST /_clock/set_current_utc is the one endpoint exempt from the authentication gate, which is why the setup chain can pin the clock under any role."

