# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2628_resort_fee_ancillary_charge_disclosure_compliance
#
# 9 rule_id blocks, 22 instances. Every rule_id is verbatim from SKILL.md §0.5.
# Every `grounds:` ref resolves into SCAFFOLD.yaml §1.1-§1.6.
#
# Fixture conventions used throughout (all literals below were computed by
# executing the §1.3 formulas, not estimated):
#   Jurisdiction US-NV-CLARK  occupancy_tax_rate_bps 1338, both display mandates
#                             true, mandatory_fee_ban false, opt_out_mandate true
#   Property     base_room_rate_cents 29900 (secondary property 32854)
#   Fees         RESORT       PERCENT_OF_ROOM 750 bps   TAXABLE
#                DESTINATION  PER_NIGHT 1495, avoidable, 48h window
#                                                       TAXABLE_IF_MANDATORY
#                WIFI_PREMIUM PER_PERSON_PER_NIGHT 325  EXEMPT
#   Booking      nights 4, guests 2, room_rate_cents 29900,
#                arrival_date 2026-09-10T00:00:00Z
#   Opaque user ids: u-admin-1, u-rev-1, u-comp-1, u-comp-2, u-liaison-1,
#                    u-liaison-2, u-gsa-1
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: booking_quote_per_night_rounding_versus_folio_stay_aggregation
        grounds:
          - calculations.booking_fee_subtotal
          - calculations.booking_quoted_total
          - calculations.quote_variance_reconciliation
          - entities.Booking.fields.quoted_mandatory_fee_cents
          - entities.Booking.fields.folio_fee_total_cents
          - entities.Booking.fields.quote_folio_variance_cents
        distinguishing_aspect: |
          This dual variant operates on the Booking/Folio money domain: the SAME
          three mandatory fees produce quoted_mandatory_fee_cents 17552 under
          per_night_rounding and folio_fee_total_cents 17550 under
          stay_aggregation, a 2-cent divergence that widens to a 3-cent
          quote_folio_variance_cents once each variant's tax rounding is applied.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z, one jurisdiction at 1338 bps with taxability rules for all three fee codes"
            - "One ACTIVE property at base_room_rate_cents 29900, one OTA channel that supports both totals and itemization"
            - "One PUBLISHED fee program carrying RESORT (PERCENT_OF_ROOM 750 bps), DESTINATION (PER_NIGHT 1495) and WIFI_PREMIUM (PER_PERSON_PER_NIGHT 325), each with one value-bearing inclusion"
            - "One DEPLOYED disclosure profile with all three switches at their best values"
            - "One booking for 4 nights, 2 guests, room_rate_cents 29900, checked in and checked out"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /jurisdictions"
              payload: { code: "US-NV-CLARK", name: "Clark County NV", occupancy_tax_rate_bps: 1338, first_quote_total_required: true, itemization_required_on_folio: true, mandatory_fee_ban: false, opt_out_mandate: true }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { j_nv: $.data.id }
            - call: "POST /taxability-rules"
              payload: { jurisdiction_id: "${j_nv}", fee_code: "RESORT", taxability: "TAXABLE" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /taxability-rules"
              payload: { jurisdiction_id: "${j_nv}", fee_code: "DESTINATION", taxability: "TAXABLE_IF_MANDATORY" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /taxability-rules"
              payload: { jurisdiction_id: "${j_nv}", fee_code: "WIFI_PREMIUM", taxability: "EXEMPT" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /properties"
              payload: { jurisdiction_id: "${j_nv}", name: "Mirage Sands Resort", brand_code: "MSR", base_room_rate_cents: 29900, status: "ACTIVE" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /channels"
              payload: { name: "BigOTA", channel_type: "OTA", supports_total_price_display: true, supports_itemization: true }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { c_ota: $.data.id }
            - call: "POST /fee-programs"
              payload: { property_id: "${p1}", version_label: "FY26-Q4", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", expected_property_version: "${p1_v}" }
              as: RevenueManager
              as_user_id: "u-rev-1"
              captures: { fp1: $.data.id }
            - call: "POST /fee-programs/${fp1}/fees"
              payload: { code: "RESORT", label: "Resort Fee", classification: "MANDATORY", basis: "PERCENT_OF_ROOM", percent_bps: 750, disclosure_text: "Resort fee of 7.5% of the nightly room rate." }
              as: RevenueManager
              as_user_id: "u-rev-1"
              captures: { fee_resort: $.data.id }
            - call: "POST /fees/${fee_resort}/inclusions"
              payload: { service_code: "POOL_ACCESS", service_label: "Pool and cabana access", retail_value_cents: 1500, units: 1 }
              as: RevenueManager
              as_user_id: "u-rev-1"
            - call: "POST /fee-programs/${fp1}/fees"
              payload: { code: "DESTINATION", label: "Destination Fee", classification: "MANDATORY", basis: "PER_NIGHT", amount_cents: 1495, avoidable: true, opt_out_window_hours: 48, disclosure_text: "Destination fee, avoidable up to 48 hours before arrival." }
              as: RevenueManager
              as_user_id: "u-rev-1"
              captures: { fee_dest: $.data.id }
            - call: "POST /fees/${fee_dest}/inclusions"
              payload: { service_code: "SHUTTLE", service_label: "Airport shuttle", retail_value_cents: 1200, units: 1 }
              as: RevenueManager
              as_user_id: "u-rev-1"
            - call: "POST /fee-programs/${fp1}/fees"
              payload: { code: "WIFI_PREMIUM", label: "Premium Wi-Fi", classification: "MANDATORY", basis: "PER_PERSON_PER_NIGHT", amount_cents: 325, disclosure_text: "Premium Wi-Fi, charged per guest per night." }
              as: RevenueManager
              as_user_id: "u-rev-1"
              captures: { fee_wifi: $.data.id }
            - call: "POST /fees/${fee_wifi}/inclusions"
              payload: { service_code: "WIFI_TIER2", service_label: "Tier-2 bandwidth", retail_value_cents: 400, units: 2 }
              as: RevenueManager
              as_user_id: "u-rev-1"
            - call: "POST /fee-programs/${fp1}/submit-review"
              payload: {}
              as: RevenueManager
              as_user_id: "u-rev-1"
            - call: "POST /fee-programs/${fp1}/publish"
              payload: { attestation_note: "Inclusion analysis reviewed for all three mandatory fees." }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
            - call: "GET /fee-programs/${fp1}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { fp1_v: $.data.version }
            - call: "POST /channel-disclosure-profiles"
              payload: { property_id: "${p1}", channel_id: "${c_ota}", fee_program_id: "${fp1}", first_quote_shows_total: true, itemized_at_first_quote: true, disclosure_placement: "FIRST_QUOTE", deployed_from: "2026-09-01T00:00:00Z", deployed_to: "2026-11-30T00:00:00Z", expected_fee_program_version: "${fp1_v}" }
              as: RevenueManager
              as_user_id: "u-rev-1"
              captures: { prof_ota: $.data.id }
            - call: "POST /channel-disclosure-profiles/${prof_ota}/deploy"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
            - call: "POST /bookings"
              payload: { property_id: "${p1}", channel_id: "${c_ota}", channel_disclosure_profile_id: "${prof_ota}", arrival_date: "2026-09-10T00:00:00Z", nights: 4, guests: 2, room_rate_cents: 29900, disclosed_fee_amounts: { RESORT: 6000, DESTINATION: 5980 } }
              as: ChannelOperator
              as_user_id: "${c_ota}"
              captures: { b1: $.data.id }
            - call: "POST /bookings/${b1}/confirm"
              payload: {}
              as: GuestServicesAgent
              as_user_id: "u-gsa-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /bookings/${b1}/check-in"
              payload: {}
              as: GuestServicesAgent
              as_user_id: "u-gsa-1"
            - call: "GET /bookings/${b1}/folios"
              payload: {}
              as: GuestServicesAgent
              as_user_id: "u-gsa-1"
              captures: { f1: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /bookings/${b1}/check-out"
              payload: {}
              as: GuestServicesAgent
              as_user_id: "u-gsa-1"
          trigger:
            - call: "POST /folios/${f1}/itemize"
              payload: {}
              as: GuestServicesAgent
              as_user_id: "u-gsa-1"
          assert:
            - "Booking.${b1}.quoted_room_total_cents == 119600"
            - "Booking.${b1}.quoted_mandatory_fee_cents == 17552"
            - "Booking.${b1}.quoted_tax_cents == 18003"
            - "Booking.${b1}.quoted_total_cents == 155155"
            - "Booking.${b1}.folio_fee_total_cents == 17550"
            - "Booking.${b1}.folio_fee_total_cents != Booking.${b1}.quoted_mandatory_fee_cents"
            - "Folio.${f1}.charges_subtotal_cents == 137150"
            - "Folio.${f1}.credits_total_cents == 0"
            - "Folio.${f1}.tax_total_cents == 18002"
            - "Folio.${f1}.folio_total_cents == 155152"
            - "Folio.${f1}.line_count == 4"
            - "Booking.${b1}.folio_total_cents == 155152"
            - "Booking.${b1}.quote_folio_variance_cents == -3"
            - "Booking.${b1}.guest_out_of_pocket_cents == 155152"
            - "Booking.${b1}.disclosure_status == PENDING_AUDIT"
            - "GET /folio-lines?folio_id=${f1}&line_type=MANDATORY_FEE returns 3 rows with amount_cents 8970, 5980 and 2600"

      - name: revenue_roll_in_rate_parity_versus_tax_absorbed_net_revenue
        grounds:
          - calculations.revenue_impact_roll_in
          - entities.RevenueImpactModel.fields.modeled_adr_cents
          - entities.RevenueImpactModel.fields.modeled_net_revenue_delta_cents
          - entities.RevenueImpactModel.fields.modeled_guest_total_delta_cents
        distinguishing_aspect: |
          This second dual variant operates on a completely different entity
          domain — property-level RevenueImpactModel forecasting rather than
          per-stay Booking money: rolling DESTINATION and WIFI_PREMIUM into a
          29900 rate yields modeled_adr_cents 32045 and net delta -226 under
          RATE_PARITY but modeled_adr_cents 28263 and net delta -3610 under
          TAX_ABSORBED, from byte-identical inputs.
        test_recipe:
