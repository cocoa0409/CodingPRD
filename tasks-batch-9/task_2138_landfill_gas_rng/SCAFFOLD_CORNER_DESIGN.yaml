      - name: accepting_an_exceedance_report_without_corrective_action_is_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=90]", "errors[ERR_PERMIT_EXCEEDANCE_UNRESOLVED]", "entities.ComplianceReport.fields.exceedance_flag", "entities.LandfillSite.fields.compliance_posture"]
        distinguishing_aspect: "nmoc_lb_per_hr_reported 5.0 against a 3.5 permit limit freezes exceedance_flag true and drives compliance_posture to VIOLATION once submitted; accepting without corrective_action_note returns 422 ERR_PERMIT_EXCEEDANCE_UNRESOLVED, and supplying the note lets the same call through."
        test_recipe:
          setup:
            - "One LandfillSite with permit_nmoc_limit_lb_per_hr 3.5."
            - "One NSPS_ANNUAL ComplianceReport for 2026-Q3 with nmoc_lb_per_hr_reported 5.0 prepared by officer-alice, SUBMITTED and taken UNDER_REVIEW by officer-bob."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /compliance-reports"
              payload: { site_id: "${site_id}", report_type: "NSPS_ANNUAL", period: "2026-Q3", nmoc_lb_per_hr_reported: 5.0 }
              as: ComplianceOfficer
              as_user_id: "officer-alice"
              captures: { cr_id: $.data.id }
            - call: "POST /compliance-reports/${cr_id}/status"
              payload: { to_status: "SUBMITTED" }
              as: ComplianceOfficer
              as_user_id: "officer-alice"
            - call: "POST /compliance-reports/${cr_id}/status"
              payload: { to_status: "UNDER_REVIEW" }
              as: ComplianceOfficer
              as_user_id: "officer-bob"
          trigger:
            - call: "POST /compliance-reports/${cr_id}/status"
              payload: { to_status: "ACCEPTED" }
              as: ComplianceOfficer
              as_user_id: "officer-bob"
              captures: { err_id: $.data.error_id }
            - call: "POST /compliance-reports/${cr_id}/status"
              payload: { to_status: "ACCEPTED", corrective_action_note: "Additional cover installed on cells 4-6; re-test scheduled" }
              as: ComplianceOfficer
              as_user_id: "officer-bob"
          assert:
            - "ComplianceReport.${cr_id}.exceedance_flag == true"
            - "The first accept returns HTTP 422 with data.error_id == 'ERR_PERMIT_EXCEEDANCE_UNRESOLVED'"
            - "After that call ComplianceReport.${cr_id}.status == UNDER_REVIEW"
            - "The second accept returns HTTP 200 and ComplianceReport.${cr_id}.status == ACCEPTED"
            - "ComplianceReport.${cr_id}.corrective_action_note == 'Additional cover installed on cells 4-6; re-test scheduled'"
            - "LandfillSite.${site_id}.compliance_posture == VIOLATION"

