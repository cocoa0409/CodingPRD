      - name: offering_bidding_window_half_open_adjacency_is_legal
        grounds:
          - validations[priority=60]
          - state_machines.DispositionOffering.null_to_DRAFT
          - concurrency_rules[offering-create-stale-declaration]
          - entities.DispositionOffering.fields.bid_open_at
          - errors[ERR_OFFERING_WINDOW_CONFLICT]
        distinguishing_aspect: |
          A DIFFERENT contended resource - the PARCEL's disposition timeline -
          and the OPPOSITE interval semantics: bidding windows are HALF-OPEN
          [bid_open_at, bid_close_at), so sharing the boundary INSTANT is legal.
          Against a live offering over [2026-12-01, 2026-12-31), a second
          offering over [2026-12-30, 2027-01-15) overlaps by one day and is
          refused with ERR_OFFERING_WINDOW_CONFLICT (409), while
          [2026-12-31, 2027-01-15) - starting exactly at the first window's
          exclusive upper bound - is accepted. Because the refused create never
          incremented SurplusDeclaration.version, the SAME
          expected_declaration_version token is replayed on the accepted call.
        test_recipe:
          setup:
            - "One custodian Agency, one TRANSIT Agency that DECLINES its notice."
            - "One Parcel with no title items, so open_title_item_count is 0."
            - "An ACCEPTED Appraisal at 100000000 with effective_date 2026-08-01T00:00:00Z, so expires_on 2027-08-01T00:00:00Z covers both attempted windows."
            - "The declaration adopted, EXEMPT review certified, notice declined, preference window closed and COMPETITIVE_SALE authorized."
            - "A first DRAFT offering over the half-open window [2026-12-01T00:00:00Z, 2026-12-31T00:00:00Z), which is live and therefore blocking."
            - "The logical clock stays at the default 2026-08-01T00:00:00Z throughout."
