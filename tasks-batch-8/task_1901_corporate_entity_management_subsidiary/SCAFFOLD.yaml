    input: [legal_name, entity_type, formation_jurisdiction_id, formation_date, "fiscal_year_end_month?", "authorized_shares?"]
    output: LegalEntity
    side_effects: ["status = DRAFT", "compliance_posture = GOOD_STANDING", "fees_accrued_cents = 0", "version = 1"]
  - method: GET
    path: "/api/entities"
    description: "List entities"
    roles: [CorporateSecretary, FilingCoordinator, AuthorizedOfficer, RegisteredAgentUser, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "formation_jurisdiction_id?", "status?", "entity_type?"]
    output: "LegalEntity[]"
    side_effects: []
  - method: GET
    path: "/api/entities/{entityId}"
    description: "Get an entity (lazily applies time-driven transitions to it and its children before responding)"
    roles: [CorporateSecretary, FilingCoordinator, AuthorizedOfficer, RegisteredAgentUser, ComplianceAuditor]
    code: 200
    input: []
    output: LegalEntity
    side_effects: ["lazy clock-driven transition evaluation for this entity graph"]
  - method: PATCH
    path: "/api/entities/{entityId}"
    description: "Update legal_name / authorized_shares / fiscal_year_end_month while status == ACTIVE"
    roles: [CorporateSecretary]
    code: 200
    input: ["legal_name?", "authorized_shares?", "fiscal_year_end_month?"]
    output: LegalEntity
    side_effects: ["increments LegalEntity.version by 1"]
  - method: POST
    path: "/api/entities/{id}/submit-formation"
    description: "DRAFT -> FORMATION_PENDING"
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: LegalEntity
    side_effects: ["status -> FORMATION_PENDING", "increments LegalEntity.version by 1"]
  - method: POST
