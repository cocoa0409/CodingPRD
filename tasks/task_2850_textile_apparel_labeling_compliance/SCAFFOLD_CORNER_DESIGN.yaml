          - validations[priority=58]
          - validations[priority=65]
          - validations[priority=75]
        distinguishing_aspect: "Four labels of one fully substantiated style each carry exactly one defect, so each approval must fail on its own gate and no other: a wash temperature that contradicts the wash actually tested, a non-permanent placement on a permanent label, a fiber text that is not the style's canonical string, and a Canadian market whose required French is absent from the language list. All four rows stay in PENDING_APPROVAL with their versions untouched, proving a refused approval is a pure read."
