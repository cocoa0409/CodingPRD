              as: GuaranteeAdmin
          assert:
            - "Filing after approval's guarantee-void cascade -> HTTP 409 ERR_GUARANTEE_NOT_ENROLLED (listing no longer ENROLLED)"
            - "pay1 == 700000 (severity delta 4 -> 100% of 700,000c)"

  # =====================================================================
  # Rule 8 — resource_temporal_overlap across different interval semantics.
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: claim_closed_occupancy_overlap_on_listing
        grounds:
          - calculations.claim_window_overlap
          - errors[ERR_CLAIM_OVERLAP]
        distinguishing_aspect: |
          Closed-occupancy semantics on the InventoryListing resource: a second
          claim is rejected for as long as the first claim is OPEN or APPROVED —
          occupancy ends only at a terminal state (REJECTED/PAID), after which
          a new claim may be filed. The occupancy set is closed (no adjacency
          allowance of any kind).
