            - { call: "POST /rescue-ops/sponsors", payload: { name: "SP2", contact_email: "s2@x.com" }, as: Sponsor, captures: { sp2: $.data.id } }
            - { call: "POST /rescue-ops/sponsorships", payload: { sponsor_id: "${sp2}", horse_id: "${h}", monthly_pledge_cents: 3000 }, as: Sponsor, as_user_id: "${sp2}", captures: { s: $.data.id } }
