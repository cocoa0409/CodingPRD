      - name: transfer_complete_depends_on_account_active
        grounds:
          - state_machines.TransferRequest.APPROVED_to_COMPLETED
          - entities.Account.fields.status
          - validations[priority=5]
        distinguishing_aspect: |
          TransferRequest APPROVED->COMPLETED is gated by Account.status == ACTIVE:
          completing a transfer whose account is SUSPENDED is rejected
          ERR_ACCOUNT_NOT_ACTIVE — entity pair TransferRequest->Account (different
          pair from ServiceOrder->ServiceAddress).
        test_recipe:
          setup:
            - "ACTIVE account with an APPROVED transfer, then the account is SUSPENDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
