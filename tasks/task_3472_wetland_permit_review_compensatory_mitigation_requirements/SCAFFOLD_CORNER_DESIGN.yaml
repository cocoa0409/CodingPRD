            - { call: "POST /wetland-permits/applications/${app_id}/screening", payload: { action: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/alternatives-analyses", payload: { application_id: "${app_id}", avoidance_demonstrated: true, avoidance_narrative: "Avoidance shown", minimization_steps: ["Step one", "Step two"], ledpa_conclusion: "ALTERNATIVE_IS_LEDPA", offsite_alternatives_considered: 2 }, as: Applicant, as_user_id: "${ap_id}", captures: { aa_id: "$.data.id" } }
