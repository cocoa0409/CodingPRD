              as: PlantAdmin
              captures: { fin_ok: $.data.financing_status, principal: $.data.financed_principal_cents }
            - call: "POST /unit-orders/${ord_id}/ship"
              payload: {}
              as: ProductionScheduler
              captures: { ship_status: $.data.status, final_invoice: $.data.final_invoice_cents }
          assert:
            - "wt_result == PASS and pdi_result == PASS and station_ready == READY_TO_SHIP, so the priority-9 safety band is clear before the fiscal band is reached"
            - "e_fund == ERR_FLOOR_PLAN_FUNDING_REQUIRED with status 422 — the order is BUILT and NOT_FINANCED and its order_type is STOCK"
            - "UnitOrder.${ord_id}.status is still BUILT after the refusal and UnitBuild.${build_id}.current_station is still READY_TO_SHIP"
            - "fin_req == FUNDING_REQUESTED and fin_ok == FLOOR_PLAN_FUNDED with principal == 5958315"
            - "ship_status == SHIPPED and UnitBuild.${build_id}.current_station == SHIPPED"
            - "final_invoice == 6612850: the FINAL_AT_SHIP variant starts from the same 6322750 subtotal and 297600 freight, adds 0 overtime (actual_station_hours 40.00 is below the 41.00 planned) and 0 rework, and subtracts a 7500 quality credit for defect_points_total 5 — that is 7500 below the provisional 6620350"
            - "the gate is conditional on order_type: it is declared for STOCK orders only, which is why this unit could not leave the plant until the funding decision landed"

      - name: dealer_curtailment_delinquency_cascades_onto_a_sibling_order
        claim_type: cascading_validation
        grounds:
          - validations[priority 16]
          - errors.ERR_DEALER_CURTAILMENT_DELINQUENT
          - calculations.floor_plan_curtailment_due.formula
        distinguishing_aspect: "A delinquency recorded on one order blocks a different order of the same dealer: the check is dealer-wide, it fires only after the curtailment amount becomes positive at day 180, and paying the exact amount due unblocks the sibling immediately."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; TOW kit with LINE-T (240.00 h, 4 units); dealer D-TOW at 1500 bp."
            - "Order 1 is submitted, funding-requested and APPROVED at principal 5958315 with funded_at 2026-08-01; the clock then moves to 2027-01-28 (age 180 days) and daily-close runs."
            - "Order 2 is a fresh submitted 41.00 h order for the same dealer."
          setup_api_calls:
            - call: "POST /floor-plans"
              payload: { model_code: "FP-TOW", chassis_class: "TOWABLE", length_ft: 28, base_msrp_cents: 8000000, base_station_hours: 40.00, base_dry_weight_lbs: 6000, gvwr_lbs: 9000, required_wheelbase_in: 180, electrical_service_amps: 50, fresh_water_capacity_gal: 60 }
              as: PlantAdmin
              captures: { fp_id: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-E1", category: "ELECTRICAL", install_station: "ROUGH_IN", price_cents: 100000, weight_lbs: 0, added_station_hours: 1.00, amp_draw: 20, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { opt_e1_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-TOW", region: "CENTRAL", allocation_share_bp: 1500, floor_plan_credit_limit_cents: 100000000, goodwill_budget_cents: 500000 }
              as: PlantAdmin
              captures: { dlr_id: $.data.id }
            - call: "POST /production-lines"
              payload: { line_code: "LINE-T", chassis_class_supported: "TOWABLE", daily_station_hour_capacity: 240.00, max_units_per_day: 4 }
              as: PlantAdmin
              captures: { line_id: $.data.id }
            - call: "POST /unit-orders"
              payload: { dealer_id: "${dlr_id}", floor_plan_id: "${fp_id}", order_type: "STOCK", selected_option_ids: ["${opt_e1_id}"], requested_delivery_date: "2026-10-01T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { ord_1: $.data.id }
            - call: "POST /unit-orders/${ord_1}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
            - call: "POST /unit-orders/${ord_1}/request-funding"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
            - call: "POST /unit-orders/${ord_1}/funding-decision"
              payload: { decision: "APPROVED" }
              as: PlantAdmin
              captures: { principal_1: $.data.financed_principal_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-28T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /daily-close"
              payload: {}
              as: PlantAdmin
              captures: { curtailed_n: $.data.curtailed_order_count }
            - call: "POST /unit-orders"
              payload: { dealer_id: "${dlr_id}", floor_plan_id: "${fp_id}", order_type: "STOCK", selected_option_ids: ["${opt_e1_id}"], requested_delivery_date: "2027-04-01T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { ord_2: $.data.id }
            - call: "POST /unit-orders/${ord_2}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { v_2: $.data.version }
          trigger:
            - call: "GET /unit-orders/${ord_1}"
              payload: {}
              as: PlantAdmin
              captures: { fin_1: $.data.financing_status, due_1: $.data.curtailment_due_cents }
            - call: "POST /unit-orders/${ord_2}/production-slots"
              payload: { line_id: "${line_id}", slot_date: "2027-02-05T00:00:00Z", expected_unit_order_version: "${v_2}" }
              as: ProductionScheduler
              captures: { e_delinq: $.data.error_id }
            - call: "POST /unit-orders/${ord_1}/floor-plan-payment"
              payload: { amount_cents: 595832 }
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { fin_1_after: $.data.financing_status, paid_1: $.data.curtailment_paid_cents, due_1_after: $.data.curtailment_due_cents }
            - call: "POST /unit-orders/${ord_2}/production-slots"
              payload: { line_id: "${line_id}", slot_date: "2027-02-05T00:00:00Z", expected_unit_order_version: "${v_2}" }
              as: ProductionScheduler
              captures: { slot_2: $.data.id, seq_2: $.data.sequence_position }
          assert:
            - "principal_1 == 5958315 and curtailed_n == 1 — at age exactly 180 days the stage-1 requirement of 1000 bp turns positive"
            - "fin_1 == CURTAILED and due_1 == 595832 (round_half_up(5958315 * 1000 / 10000) = 595831.5 -> 595832)"
            - "e_delinq == ERR_DEALER_CURTAILMENT_DELINQUENT with status 422 on order 2, which is itself neither funded nor delinquent"
            - "the refusal is not ERR_DEALER_CREDIT_HOLD: credit_utilization_bp is 595 against the 100000000 limit, far below CREDIT_HOLD_BP 9500"
            - "fin_1_after == FLOOR_PLAN_FUNDED with paid_1 == 595832 and due_1_after == 0"
            - "slot_2 is created with seq_2 == 1 on (LINE-T, 2027-02-05) — the sibling is unblocked by the payment alone, with no change to order 2"
            - "UnitOrder.${ord_2}.version is unchanged by the refused attempt, so the second call reuses the same expected_unit_order_version"

      - name: station_hours_limit_rejects_a_single_over_long_unit
        claim_type: violation_to_error
        grounds:
          - validations[priority 13]
          - errors.ERR_STATION_HOURS_LIMIT_EXCEEDED
          - calculations.unit_order_configuration_totals.constants.MAX_SINGLE_UNIT_HOURS
        distinguishing_aspect: "MAX_SINGLE_UNIT_HOURS 96.00 is measured on the class-adjusted total, not on the raw sum: the same floor plan validates at 92.00 h with no options and is refused at 97.75 h once one 5.00 h option is added, because the 1.15 CLASS_A factor multiplies the addition too."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; FloorPlan FP-BIG (CLASS_A, 34 ft, msrp 18500000, base hours 80.00, dry 22400, gvwr 26000, wheelbase 242, 50 A, 90 gal); option OPT-BIG5 (INTERIOR, 5.00 h, 0 lbs, 0 A); dealer D-WEST; two DRAFT orders, one bare and one with the option."
          setup_api_calls:
            - call: "POST /floor-plans"
              payload: { model_code: "FP-BIG", chassis_class: "CLASS_A", length_ft: 34, base_msrp_cents: 18500000, base_station_hours: 80.00, base_dry_weight_lbs: 22400, gvwr_lbs: 26000, required_wheelbase_in: 242, electrical_service_amps: 50, fresh_water_capacity_gal: 90 }
              as: PlantAdmin
              captures: { fp_id: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-BIG5", category: "INTERIOR", install_station: "FINISH", price_cents: 100000, weight_lbs: 0, added_station_hours: 5.00, amp_draw: 0, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { o_big5: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-WEST", region: "WEST", allocation_share_bp: 1500, floor_plan_credit_limit_cents: 100000000, goodwill_budget_cents: 500000 }
              as: PlantAdmin
              captures: { dlr_id: $.data.id }
            - call: "POST /unit-orders"
              payload: { dealer_id: "${dlr_id}", floor_plan_id: "${fp_id}", order_type: "STOCK", selected_option_ids: [], requested_delivery_date: "2026-10-01T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { ord_bare: $.data.id, hours_bare: $.data.required_station_hours }
            - call: "POST /unit-orders"
              payload: { dealer_id: "${dlr_id}", floor_plan_id: "${fp_id}", order_type: "STOCK", selected_option_ids: ["${o_big5}"], requested_delivery_date: "2026-10-01T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { ord_long: $.data.id, hours_long: $.data.required_station_hours }
          trigger:
            - call: "POST /unit-orders/${ord_bare}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { st_bare: $.data.status }
            - call: "POST /unit-orders/${ord_long}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { e_hours: $.data.error_id }
          assert:
            - "hours_bare == 92.00 (80.00 * 1.00 * 1.15) and st_bare == CONFIG_VALIDATED"
            - "hours_long == 97.75 (85.00 * 1.00 * 1.15) and e_hours == ERR_STATION_HOURS_LIMIT_EXCEEDED with status 422"
            - "the 5.00 h option contributed 5.75 h after the class factor, which is what crosses 96.00"
            - "UnitOrder.${ord_long}.status is still DRAFT at version 1, and its required_station_hours stays 97.75 — the total is stored even though the order cannot be validated"
            - "no physical ceiling was breached: config_weight_lbs 22400 <= 26000, total_amp_draw 0 <= 50, total_water_demand_gal 0 <= 45"

  # ===========================================================================
  # From Table 5 (Endpoints)
  # ===========================================================================
  - section: endpoints
    instances:

      - name: floor_plan_and_option_crud_read_back_and_bump_version
        claim_type: standard_crud
        grounds:
          - endpoints["POST /floor-plans"]
          - endpoints["GET /floor-plans/{id}"]
          - endpoints["PATCH /floor-plans/{id}"]
        distinguishing_aspect: "Reference data is fully CRUD-able except for deletion: create returns 201 with the computed max_payload_lbs, the read returns exactly what was stored, and each PATCH returns 200 and lifts version by one while leaving untouched fields alone."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; nothing but master data is needed."
          setup_api_calls:
            - call: "POST /floor-plans"
              payload: { model_code: "FP-TOW", chassis_class: "TOWABLE", length_ft: 28, base_msrp_cents: 8000000, base_station_hours: 40.00, base_dry_weight_lbs: 6000, gvwr_lbs: 9000, required_wheelbase_in: 180, electrical_service_amps: 50, fresh_water_capacity_gal: 60 }
              as: PlantAdmin
              captures: { fp_id: $.data.id, fp_payload: $.data.max_payload_lbs, fp_v: $.data.version, fp_status: $.data.status }
            - call: "POST /option-items"
              payload: { option_code: "OPT-E1", category: "ELECTRICAL", install_station: "ROUGH_IN", price_cents: 100000, weight_lbs: 0, added_station_hours: 1.00, amp_draw: 20, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { opt_id: $.data.id, opt_v: $.data.version }
          trigger:
            - call: "GET /floor-plans/${fp_id}"
              payload: {}
              as: DealerPrincipal
              as_user_id: "D-ANY"
              captures: { read_msrp: $.data.base_msrp_cents, read_hours: $.data.base_station_hours, read_v: $.data.version }
            - call: "PATCH /floor-plans/${fp_id}"
              payload: { base_msrp_cents: 8400000 }
              as: PlantAdmin
              captures: { new_msrp: $.data.base_msrp_cents, new_payload: $.data.max_payload_lbs, v_after_price: $.data.version }
            - call: "PATCH /floor-plans/${fp_id}"
              payload: { status: "RETIRED" }
              as: PlantAdmin
              captures: { retired_status: $.data.status, v_after_retire: $.data.version, msrp_after_retire: $.data.base_msrp_cents }
            - call: "PATCH /option-items/${opt_id}"
              payload: { price_cents: 120000 }
              as: PlantAdmin
              captures: { opt_price: $.data.price_cents, opt_v_after: $.data.version, opt_amps: $.data.amp_draw }
          assert:
            - "the create returned 201 with fp_payload == 3000 (9000 - 6000), fp_v == 1 and fp_status == ACTIVE"
            - "read_msrp == 8000000, read_hours == 40.00 and read_v == 1 — the GET is a faithful read-back and does not bump version"
            - "new_msrp == 8400000, v_after_price == 2 and new_payload == 3000: repricing does not disturb the computed payload"
            - "retired_status == RETIRED, v_after_retire == 3 and msrp_after_retire == 8400000 — the second PATCH left the price alone"
            - "opt_price == 120000, opt_v_after == 2 and opt_amps == 20, while opt_v was 1 at create"
            - "no DELETE exists for either collection: retirement is a status, not a removal"

      - name: status_action_endpoints_move_dealer_booth_and_line
        claim_type: action_endpoint
        grounds:
          - endpoints["POST /dealers/{id}/status"]
          - endpoints["POST /test-booths/{id}/status"]
          - endpoints["POST /production-lines/{id}/status"]
        distinguishing_aspect: "Three sibling action endpoints each take a single status field, return the mutated row with 200 and leave every other field untouched — the resource state is changed by a named action rather than by a general PATCH."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one dealer, one WATER_TEST booth and one production line."
          setup_api_calls:
            - call: "POST /dealers"
              payload: { dealer_code: "D-TOW", region: "CENTRAL", allocation_share_bp: 1500, floor_plan_credit_limit_cents: 100000000, goodwill_budget_cents: 500000 }
              as: PlantAdmin
              captures: { dlr_id: $.data.id, dlr_status: $.data.status }
            - call: "POST /test-booths"
              payload: { booth_code: "BOOTH-W", booth_type: "WATER_TEST", bay_count: 1, turnaround_minutes: 30 }
              as: PlantAdmin
              captures: { booth_id: $.data.id, booth_status: $.data.status }
            - call: "POST /production-lines"
              payload: { line_code: "LINE-T", chassis_class_supported: "TOWABLE", daily_station_hour_capacity: 240.00, max_units_per_day: 4 }
              as: PlantAdmin
              captures: { line_id: $.data.id, line_status: $.data.status }
          trigger:
            - call: "POST /dealers/${dlr_id}/status"
              payload: { status: "SUSPENDED" }
              as: PlantAdmin
              captures: { d_susp: $.data.status, d_limit: $.data.floor_plan_credit_limit_cents, d_v: $.data.version }
            - call: "POST /dealers/${dlr_id}/status"
              payload: { status: "ACTIVE" }
              as: PlantAdmin
              captures: { d_back: $.data.status, d_v2: $.data.version }
            - call: "POST /test-booths/${booth_id}/status"
              payload: { status: "DOWN" }
              as: PlantAdmin
              captures: { b_down: $.data.status, b_bays: $.data.bay_count }
            - call: "POST /production-lines/${line_id}/status"
              payload: { status: "PAUSED" }
              as: ProductionScheduler
              captures: { l_paused: $.data.status, l_cap: $.data.daily_station_hour_capacity }
          assert:
            - "dlr_status == ACTIVE, booth_status == OPEN and line_status == RUNNING at creation"
            - "d_susp == SUSPENDED with d_limit still 100000000 and d_v == 2"
            - "d_back == ACTIVE with d_v2 == 3 — the action is reversible and each call is a write"
            - "b_down == DOWN with b_bays still 1"
            - "l_paused == PAUSED with l_cap still 240.00, and a PAUSED line still contributes to dealer_slot_entitlement"
            - "every call returned 200, not 201: these actions mutate rather than create"

      - name: campaign_expand_adds_two_lots_in_one_bulk_action
        claim_type: bulk_action
        grounds:
          - endpoints["POST /recall-campaigns/{id}/expand"]
