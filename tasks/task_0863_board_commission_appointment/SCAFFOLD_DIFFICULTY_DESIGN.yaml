      - name: confirm_seat_fill_depth2_cascade
        grounds:
          - state_machines.Appointment.NOMINATED_to_CONFIRMED
          - state_machines.Term.ACTIVE_to_HOLDOVER
          - entities.Seat.fields.occupancy_status
        distinguishing_aspect: "Depth-2 chain from a different trigger (confirm): Appointment.CONFIRMED creates Term(ACTIVE) (link1); the new ACTIVE Term sets Seat.occupancy_status=FILLED (link2)."
        test_recipe:
          setup:
            - "An eligible application nominated to a VACANT seat (appointment NOMINATED)."
          setup_api_calls:
            - call: "POST /civic/boards"
              payload: { name: "Zoning Board", jurisdiction: "Springfield", board_type: "COMMISSION", authorized_seat_count: 5, quorum_count: 3, term_length_months: 48, max_consecutive_terms: 2, max_cumulative_years: 12, attendance_threshold_pct: 75.0, sunshine_notice_days: 7 }
