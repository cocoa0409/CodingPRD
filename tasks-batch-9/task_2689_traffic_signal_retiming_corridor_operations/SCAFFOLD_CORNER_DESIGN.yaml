            - "${past_score} == 91.25 — the complaint component drops to 0 and the score falls by exactly 1.25"

      - name: webster_constants_with_ceiling_to_five_and_both_clamps
        claim_type: constants_applied
        grounds:
          - calculations.intersection_recommended_cycle_length
          - errors.ERR_OVERSATURATED_APPROACH
          - endpoints[POST /signal-ops/intersections/{id}/turning-movement-counts]
        distinguishing_aspect: "Four counts on the same intersection exercise every constant in the formula: the 1800 vphpl saturation flow and 4.0 s/phase lost time (0.7111 -> 105), the 5-second ceiling plus the MIN_CYCLE_SEC 60 floor on a light count (19.1 -> 60), the max_cycle_length_sec clamp applied AFTER the ceiling (332.6 -> 335 -> 150), and the >= comparison against OVERSATURATION_RATIO 0.95 which rejects a count sitting exactly on 0.95."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Intersection i1 (max_cycle_length_sec 150) is the sole member of SELECTED corridor c1, and project p1 is in DATA_COLLECTION so BEFORE counts may be logged."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET", max_cycle_length_sec: 150 }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/screen"
              payload: {}
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/selection-decision"
              payload: { decision: "SELECT", rationale: "Programme corridor" }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/retiming-projects"
              payload: { corridor_id: "${c1_id}", study_window_start_at: "2026-07-01T00:00:00Z", study_window_days: 180, lead_engineer_user_id: "eng-1" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /signal-ops/intersections/${i1_id}/turning-movement-counts"
              payload: { project_id: "${p1_id}", study_role: "BEFORE", count_date: "2026-07-10T00:00:00Z", period: "AM_PEAK", phase_volumes: { "1": 350, "2": 500, "4": 250, "6": 180 } }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { c_mid_cfr: $.data.critical_flow_ratio_sum, c_mid_cycle: $.data.recommended_cycle_sec }
            - call: "POST /signal-ops/intersections/${i1_id}/turning-movement-counts"
              payload: { project_id: "${p1_id}", study_role: "BEFORE", count_date: "2026-07-11T00:00:00Z", period: "MID_DAY", phase_volumes: { "1": 100, "2": 100 } }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { c_light_cfr: $.data.critical_flow_ratio_sum, c_light_cycle: $.data.recommended_cycle_sec }
            - call: "POST /signal-ops/intersections/${i1_id}/turning-movement-counts"
              payload: { project_id: "${p1_id}", study_role: "BEFORE", count_date: "2026-07-12T00:00:00Z", period: "PM_PEAK", phase_volumes: { "1": 854, "2": 854 } }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { c_heavy_cfr: $.data.critical_flow_ratio_sum, c_heavy_cycle: $.data.recommended_cycle_sec }
            - call: "POST /signal-ops/intersections/${i1_id}/turning-movement-counts"
              payload: { project_id: "${p1_id}", study_role: "BEFORE", count_date: "2026-07-13T00:00:00Z", period: "PM_PEAK", phase_volumes: { "1": 855, "2": 855 } }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { err_sat: $.data.error_id }
            - call: "GET /signal-ops/intersections/${i1_id}/turning-movement-counts"
              payload: { study_role: "BEFORE" }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { row0_cycle: "$.data[0].recommended_cycle_sec" }
          assert:
            - "${c_mid_cfr} == 0.7111 and ${c_mid_cycle} == 105 — (1.5 * 16.0 + 5.0) / (1 - 0.711111) == 100.3846, ceiled to the next multiple of 5"
            - "${c_light_cfr} == 0.1111 and ${c_light_cycle} == 60 — the raw Webster value 19.125 ceils to 20 and is then lifted to the MIN_CYCLE_SEC floor"
            - "${c_heavy_cfr} == 0.9489 and ${c_heavy_cycle} == 150 — 332.6087 ceils to 335 and is only then clamped down to max_cycle_length_sec, so the answer is exactly 150 rather than 335 or 330"
            - "the 855/855 count returns HTTP 422 with ${err_sat} == ERR_OVERSATURATED_APPROACH: 1710/1800 == 0.95 exactly, and the comparison is >= not >"
            - "GET /signal-ops/intersections/${i1_id}/turning-movement-counts?study_role=BEFORE has total_count == 3 — the rejected count wrote no row; ${row0_cycle} == 105 for the first (count_date ASC) row"

