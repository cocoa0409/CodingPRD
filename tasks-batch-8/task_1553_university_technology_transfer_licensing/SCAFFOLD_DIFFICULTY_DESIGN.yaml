            - { call: "POST /tlo/disclosures/${disc_id}/compliance-reports", payload: { report_type: "INITIAL_DISCLOSURE" }, as: ComplianceOfficer, as_user_id: "comp_officer_1", captures: { r1: "$.data.id", r1_due: "$.data.due_date" } }
            - { call: "POST /tlo/compliance-reports/${r1}/submit", payload: {}, as: ComplianceOfficer, as_user_id: "comp_officer_1" }
            - { call: "POST /tlo/disclosures/${disc_id}/compliance-reports", payload: { report_type: "UTILIZATION_REPORT", due_date: "2027-01-28T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "comp_officer_1", captures: { r2: "$.data.id" } }
            - { call: "POST /tlo/compliance-reports/${r2}/submit", payload: {}, as: ComplianceOfficer, as_user_id: "comp_officer_1" }
          trigger:
            - { call: "POST /tlo/_clock/set_current_utc", payload: { to_iso8601: "2027-01-28T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /tlo/compliance-reports/${r1}/certify", payload: {}, as: ComplianceDirector, as_user_id: "comp_director_1", captures: { r1_late: "$.data.late_flag" } }
            - { call: "POST /tlo/_clock/set_current_utc", payload: { to_iso8601: "2027-01-28T00:00:01Z" }, as: SystemAdmin }
            - { call: "POST /tlo/compliance-reports/${r2}/certify", payload: {}, as: ComplianceDirector, as_user_id: "comp_director_1", captures: { r2_late: "$.data.late_flag" } }
          assert:
            - "FederalComplianceReport.${r1}.due_date == 2027-01-28T00:00:00Z (created_at + 180 days)"
            - "FederalComplianceReport.${r1}.late_flag == false (submitted_at == due_date is ON TIME; strictly-greater comparison)"
            - "FederalComplianceReport.${r2}.late_flag == true (one second past due_date)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: nonprovisional_filing_requires_election_of_title
        grounds:
          - validations[priority=6]
          - errors[ERR_TITLE_NOT_ELECTED]
          - state_machines.FederalComplianceReport
        distinguishing_aspect: |
          Pair FederalComplianceReport -> PatentApplication: a NON_PROVISIONAL
          filing on a FEDERAL disclosure is rejected until an ELECTION_OF_TITLE
          report reaches SUBMITTED; PROVISIONAL filings are exempt.
        test_recipe:
          setup:
            - "FEDERAL disclosure gated to PATENT_PURSUED; no compliance reports yet"
