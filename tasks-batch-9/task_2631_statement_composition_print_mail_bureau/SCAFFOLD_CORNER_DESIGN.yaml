            - "GET /bureau/clients?limit=100 returns total_count == 1, so none of the rejected writes persisted anything"

      - name: request_missing_auth_headers_is_rejected_before_any_role_check
        claim_type: authentication_required
        grounds: [errors.ERR_MISSING_AUTH_HEADERS, errors.ERR_UNAUTHORIZED]
        distinguishing_aspect: "The 401 for absent identity headers outranks the 403 for a wrong role: a call with no X-User-Role attempting a BureauAdmin-only write reports ERR_MISSING_AUTH_HEADERS, never ERR_UNAUTHORIZED."
        test_recipe:
          setup:
            - "An empty system with the clock set."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-R2", name: "Headerless Holdings" }
              as: "(request sent with no X-User-Role header, X-User-ID present)"
              captures: { r2_no_role: "$.data.error_id" }
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-R2B", name: "Anonymous Anonymous" }
              as: "(request sent with no X-User-ID header, X-User-Role: BureauAdmin)"
              captures: { r2_no_user: "$.data.error_id" }
            - call: "GET /bureau/clients?limit=100"
              payload: {}
              as: "(request sent with neither identity header)"
              captures: { r2_no_read: "$.data.error_id" }
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-R2", name: "Headerless Holdings" }
              as: BureauAdmin
              captures: { r2_created: "$.data.client_code" }
          assert:
            - "${r2_no_role} == ERR_MISSING_AUTH_HEADERS with HTTP 401, not the 403 ERR_UNAUTHORIZED that a wrong-but-present role would produce"
            - "${r2_no_user} == ERR_MISSING_AUTH_HEADERS with HTTP 401 — both headers are mandatory, even when the role would have been allowed"
            - "${r2_no_read} == ERR_MISSING_AUTH_HEADERS with HTTP 401: shared read endpoints are authenticated too"
            - "${r2_created} == CL-R2 once both headers are supplied, proving the payload was never the problem"

