      - name: commission_tier_breakpoint_inclusive
        grounds:
          - calculations.session_settlement_amount
          - entities.CommissionPolicy.fields.tier_breakpoints_cents
          - entities.Settlement.fields.commission_bps
        distinguishing_aspect: |
          Numeric-threshold boundary via POST /sessions/{id}/confirm: tier index is
          the largest i with tier_breakpoints_cents[i] <= lifetime_net_earnings_cents.
          A tutor whose pre-settlement lifetime is EXACTLY 100000 must be charged the
          1500-bps tier (inclusive >=), not the 2500-bps tier — the at-breakpoint case.
        test_recipe:
          setup:
            - "Effective rate 400000c/hr via a subject_rate_cents override (tutor base stays within its 1000..50000 bound)."
            - "Trial session (planned 30 -> gross 200000, trial 5000 bps -> net 100000) confirmed first, so lifetime_net_earnings_cents == EXACTLY 100000."
            - "A standard session (planned 60 -> gross 400000) delivered and about to be confirmed; its pre-settlement lifetime is exactly 100000."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /commission-policies"
              payload: { name: "P1", tier_breakpoints_cents: [0, 100000, 1000000], tier_rates_bps: [2500, 1500, 800], trial_commission_bps: 5000, trial_max_billed_minutes: 30, refund_window_hours: 168 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /commission-policies/${policy_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /subjects"
              payload: { code: "MATH_ALG2", display_name: "Algebra 2", category: "STEM", requires_credential: false }
              as: PlatformAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /tutors"
              payload: { email: "t1@x.com", full_name: "T One", base_hourly_rate_cents: 50000 }
              as: PlatformAdmin
              captures: { tutor_id: $.data.id }
            - call: "POST /credentials"
              payload: { tutor_id: "${tutor_id}", subject_id: "${subj_id}", kind: "DEGREE", document_ref: "doc1" }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { cred_id: $.data.id }
            - call: "POST /credentials/${cred_id}/start-review"
              payload: {}
              as: TrustOfficer
            - call: "POST /credentials/${cred_id}/verify"
              payload: {}
              as: TrustOfficer
            - call: "POST /subject-tags"
              payload: { tutor_id: "${tutor_id}", subject_id: "${subj_id}", subject_rate_cents: 400000 }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { tag_id: $.data.id }
            - call: "POST /subject-tags/${tag_id}/approve"
              payload: {}
              as: TrustOfficer
            - call: "POST /parent-accounts"
              payload: { email: "p1@x.com", full_name: "P One" }
              as: ParentGuardian
              captures: { parent_id: $.data.id }
            - call: "POST /parent-accounts/${parent_id}/deposit"
              payload: { amount_cents: 1000000 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
            - call: "POST /parent-accounts/${parent_id}/students"
              payload: { display_name: "Kid", grade_level: 9 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { student_id: $.data.id }
            # trial booking: effective rate 400000, planned 30 -> billed 30 -> gross 200000, trial 5000 bps -> net 100000
            - call: "POST /bookings"
              payload: { parent_account_id: "${parent_id}", student_id: "${student_id}", tutor_id: "${tutor_id}", subject_id: "${subj_id}", scheduled_start: "2026-06-02T06:00:00Z", planned_minutes: 30 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { b_trial: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-02T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${b_trial}/deliver"
              payload: { actual_minutes: 30 }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { s_trial: $.data.id }
            - call: "POST /sessions/${s_trial}/confirm"
              payload: {}
              as: ParentGuardian
              as_user_id: "${parent_id}"
            # standard booking: effective rate 400000, planned 60 -> gross 400000; pre-settlement lifetime == 100000
            - call: "POST /bookings"
              payload: { parent_account_id: "${parent_id}", student_id: "${student_id}", tutor_id: "${tutor_id}", subject_id: "${subj_id}", scheduled_start: "2026-06-02T08:00:00Z", planned_minutes: 60 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { b1: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-02T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${b1}/deliver"
              payload: { actual_minutes: 60 }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /sessions/${s1}/confirm"
              payload: {}
              as: ParentGuardian
              as_user_id: "${parent_id}"
            - call: "GET /settlements?session_id=${s1}"
              payload: {}
              as: TrustOfficer
              captures: { s1_commission_bps: "$.data[0].commission_bps" }
          assert:
            - "the Settlement for ${s1} has commission_bps == 1500 because the tutor's pre-settlement lifetime_net_earnings_cents was EXACTLY 100000 (inclusive >= breakpoint selects tier 1)"
            - "the Settlement for ${s1} has gross_amount_cents == 400000, commission_cents == 60000, tutor_net_cents == 340000"

      # --- Instance 2: empty-set boundary — verify with zero VERIFIED credentials ---
      - name: subject_tag_approve_zero_verified_credentials_empty_set
        grounds:
          - validations[priority=8]
          - errors[ERR_SUBJECT_REQUIRES_CREDENTIAL]
          - entities.Subject.fields.requires_credential
        distinguishing_aspect: |
          Empty-collection boundary on a different endpoint (POST
          /subject-tags/{id}/approve): when the tutor's VERIFIED-credential set FOR
          this credential-gated subject is empty (count == 0), approval is rejected
          with ERR_SUBJECT_REQUIRES_CREDENTIAL — a zero-cardinality edge, not a
          numeric threshold.
        test_recipe:
          setup:
            - "VERIFIED tutor (verified via a credential on a DIFFERENT subject) proposes a tag on a requires_credential subject for which it holds NO verified credential."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subjects"
              payload: { code: "MATH_ALG2", display_name: "Algebra 2", category: "STEM", requires_credential: false }
              as: PlatformAdmin
              captures: { subj_free: $.data.id }
            - call: "POST /subjects"
              payload: { code: "CHEM_CRED", display_name: "Chemistry", category: "STEM", requires_credential: true }
              as: PlatformAdmin
              captures: { subj_gated: $.data.id }
            - call: "POST /tutors"
              payload: { email: "t1@x.com", full_name: "T One", base_hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { tutor_id: $.data.id }
            - call: "POST /credentials"
              payload: { tutor_id: "${tutor_id}", subject_id: "${subj_free}", kind: "DEGREE", document_ref: "doc1" }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { cred_id: $.data.id }
            - call: "POST /credentials/${cred_id}/start-review"
              payload: {}
              as: TrustOfficer
            - call: "POST /credentials/${cred_id}/verify"
              payload: {}
              as: TrustOfficer
            - call: "POST /subject-tags"
              payload: { tutor_id: "${tutor_id}", subject_id: "${subj_gated}" }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { gated_tag_id: $.data.id }
          trigger:
            - call: "POST /subject-tags/${gated_tag_id}/approve"
              payload: {}
              as: TrustOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SUBJECT_REQUIRES_CREDENTIAL and HTTP 409 (zero VERIFIED credentials for the gated subject)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      # --- Instance 1: Booking transition depends on Tutor state (different pair) ---
      - name: booking_deliver_requires_tutor_verified
        grounds:
          - state_machines.Booking.SCHEDULED_to_DELIVERED
          - entities.Tutor.fields.verification_status
          - errors[ERR_TUTOR_NOT_VERIFIED]
        distinguishing_aspect: |
          Entity pair Booking -> Tutor: a SCHEDULED booking can only deliver while the
          tutor is VERIFIED. If the tutor is SUSPENDED after the booking was created,
          POST /bookings/{id}/deliver is rejected with ERR_TUTOR_NOT_VERIFIED — the
          booking's valid transition depends on a sibling Tutor's state.
        test_recipe:
          setup:
            - "A SCHEDULED booking on a tutor that becomes SUSPENDED before the lesson time."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
