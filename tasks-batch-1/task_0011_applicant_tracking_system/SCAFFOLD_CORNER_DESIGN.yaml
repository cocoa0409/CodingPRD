  # ===================================================================
  # consistency_model — immediate consistency
  # ===================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_filled_count_visible_in_same_response
        claim_type: immediate
        grounds:
          - entities.JobRequisition.fields.filled_count
          - state_machines.Offer.EXTENDED_to_ACCEPTED
          - state_machines.JobRequisition.APPROVED_to_CLOSED
        distinguishing_aspect: |
          consistency_model=immediate: the cascade chain offer.accept → application.HIRED →
          requisition.filled_count++ → requisition CLOSED must all be visible in a single
          subsequent GET — no eventual lag, no need to re-read.
        test_recipe:
          setup:
            - "Offer in EXTENDED, openings=1, filled_count=0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ats/departments"
              payload: { name: "ImmCDept", cost_center_code: "IMC-001", hiring_budget_cents: 100000000 }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /ats/requisitions"
              payload: { department_id: "${dept_id}", title: "ImcRole", target_level: "MID", base_salary_min_cents: 10000000, base_salary_max_cents: 15000000, openings: 1 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { req_id: $.data.id }
            - call: "POST /ats/requisitions/${req_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/requisitions/${req_id}/approve"
              payload: {}
              as: HiringManager
              as_user_id: "hm_bob"
            - call: "POST /ats/candidates"
              payload: { full_name: "Imc Cand", email: "imcc@example.com", source_channel: "DIRECT" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { cand_id: $.data.id }
            - call: "POST /ats/applications"
              payload: { candidate_id: "${cand_id}", requisition_id: "${req_id}" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app_id: $.data.id }
            - call: "POST /ats/applications/${app_id}/screen"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/offers"
              payload: { application_id: "${app_id}", base_salary_cents: 12000000, signing_bonus_cents: 0 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { offer_id: $.data.id, offer_v1: $.data.version }
            - call: "POST /ats/offers/${offer_id}/approve"
              payload: { expected_offer_version: "${offer_v1}" }
              as: CompApprover
              as_user_id: "comp_carol"
              captures: { offer_v2: $.data.version }
            - call: "POST /ats/offers/${offer_id}/approve"
              payload: { expected_offer_version: "${offer_v2}" }
              as: VP
              as_user_id: "vp_dave"
            - call: "POST /ats/offers/${offer_id}/extend"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/offers/${offer_id}/accept"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
          trigger:
            - call: "GET /ats/requisitions/${req_id}"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { filled: $.data.filled_count, status: $.data.status }
          assert:
            - "JobRequisition.filled_count == 1 immediately"
            - "JobRequisition.status == CLOSED immediately (cascade completed in single request)"
