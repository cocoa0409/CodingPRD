            - "RecertificationRecord.${rec}.status == RECERTIFIED   (25.0 >= 20.0 and 6.0 >= 5.0)"
            - "Volunteer.${vol}.status == ACTIVE and consecutive_shortfall_cycles == 0"

      - name: training_quiz_boundary_completion_vs_failure
        claim_type: correct_result
        grounds: [state_machines.TrainingEnrollment.ENROLLED_to_COMPLETED, state_machines.TrainingEnrollment.ENROLLED_to_FAILED]
        distinguishing_aspect: "Threshold boundary on quiz_average: 70.0 exactly (>= pass mark) COMPLETES and activates the volunteer; 69.9 FAILS and the volunteer stays TRAINEE."
        test_recipe:
          setup: ["cycle 2026 OPEN (pass mark 70.0, 5 modules); two TRAINEE volunteers each ENROLLED"]
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: $.data.id } }
