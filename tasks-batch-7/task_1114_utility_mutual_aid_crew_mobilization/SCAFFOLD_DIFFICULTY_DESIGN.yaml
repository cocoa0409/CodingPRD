            - { call: "POST /mutual-aid/events/${ev_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /mutual-aid/billing-rate-schedules", payload: { event_id: "${ev_id}", effective_start_date: "2026-05-01", effective_end_date: "2026-05-31", rate_lines: [{ crew_type: "LINE", hourly_rate_cents: 12000 }], storm_premium_bps: 1000, per_diem_rate_cents: 8950, per_diem_method: "STANDARD", mobilization_fee_tiers: [{ min_subtotal_cents: 0, fee_bps: 800 }] }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { sch_id: "$.data.id" } }
            - { call: "POST /mutual-aid/billing-rate-schedules/${sch_id}/publish", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
            - { call: "POST /mutual-aid/assistance-requests", payload: { event_id: "${ev_id}", responding_utility_id: "${rsp_id}", requested_crews: [{ crew_type: "LINE", count: 2 }], required_minimum_crews: 1, earliest_start_date: "2026-05-03", latest_end_date: "2026-05-15" }, as: HostCoordinator, as_user_id: "${host_id}", captures: { req_id: "$.data.id" } }
            - { call: "POST /mutual-aid/assistance-requests/${req_id}/submit", payload: {}, as: HostCoordinator, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/assistance-requests/${req_id}/accept", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
            - { call: "POST /mutual-aid/crews", payload: { request_id: "${req_id}", crew_type: "LINE", home_base: "Depot 7", roster: [{ member_ref: "M1", member_role: "foreman" }], equipment_units: [] }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { crew_id: "$.data.id" } }
            - { call: "POST /mutual-aid/safety-briefings", payload: { crew_id: "${crew_id}", event_id: "${ev_id}", conductor_operator_ref: "OFF-1", host_rules_version: "HR-2026.1", topics: ["grounding"] }, as: HostSafetyOfficer, as_user_id: "${host_id}", captures: { brf_id: "$.data.id" } }
            - { call: "POST /mutual-aid/safety-briefings/${brf_id}/acknowledge", payload: { supervisor_operator_ref: "SUP-1" }, as: CrewSupervisor, as_user_id: "${crew_id}" }
            - { call: "POST /mutual-aid/crews/${crew_id}/confirm_arrival", payload: {}, as: HostCoordinator, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /mutual-aid/timesheets", payload: { crew_id: "${crew_id}", work_date: "2026-05-04", day_classification: "WORK", reported_work_minutes: 480 }, as: CrewSupervisor, as_user_id: "${crew_id}", captures: { ts_id: "$.data.id" } }
            - { call: "POST /mutual-aid/timesheets/${ts_id}/submit", payload: { submitted_by_operator_ref: "SUP-1" }, as: CrewSupervisor, as_user_id: "${crew_id}" }
            - { call: "POST /mutual-aid/per-diem-claims", payload: { crew_id: "${crew_id}", claim_date: "2026-05-03", member_count: 1, meals_provided_count: 0, day_factor_type: "TRAVEL" }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { pd_id: "$.data.id" } }
            - { call: "GET /mutual-aid/assistance-requests/${req_id}", payload: {}, as: ProgramAdmin, captures: { pre_status: "$.data.status" } }
          trigger:
            - { call: "POST /mutual-aid/crews/${crew_id}/suspend", payload: { reason: "PPE violation" }, as: HostSafetyOfficer, as_user_id: "${host_id}" }
            - { call: "GET /mutual-aid/crews/${crew_id}", payload: {}, as: ProgramAdmin, captures: { post_ready: "$.data.readiness_status" } }
            - { call: "GET /mutual-aid/timesheets/${ts_id}", payload: {}, as: ProgramAdmin, captures: { post_ts: "$.data.status" } }
            - { call: "GET /mutual-aid/per-diem-claims/${pd_id}", payload: {}, as: ProgramAdmin, captures: { post_pd: "$.data.status" } }
            - { call: "GET /mutual-aid/assistance-requests/${req_id}", payload: {}, as: ProgramAdmin, captures: { post_req: "$.data.status", post_deploy: "$.data.deployable_crew_count" } }
          assert:
            - "Precondition sanity: AssistanceRequest.${req_id}.status == FULFILLED before suspend (capture pre_status)"
            - "Link 1: Crew.${crew_id}.readiness_status == SAFETY_HOLD"
            - "Link 2: TimeSheet.${ts_id}.status == HELD and PerDiemClaim.${pd_id}.status == HELD"
            - "Link 3: AssistanceRequest.${req_id}.deployable_crew_count == 0 and status == IN_PROGRESS"

      - name: complete_return_depth2_releases_request
        grounds:
          - state_machines.Crew.DEMOBILIZING_to_RETURNED
          - state_machines.AssistanceRequest.IN_PROGRESS_to_RELEASED
          - state_machines.LodgingAssignment.OCCUPIED_to_CHECKED_OUT
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (POST /crews/{id}/complete_return,
          vs the suspend trigger of safety_suspend_depth3_cascade): (1) the crew
          mutation DEMOBILIZING -> RETURNED itself causes (2) the request mutation
          IN_PROGRESS -> RELEASED once every crew is terminal; the prior release
          cascade (OCCUPIED -> CHECKED_OUT) is also verified as the release leg.
        test_recipe:
