  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: program_aggregate_capacity_collision_net_retained
        grounds:
          - validations[priority=12]
          - state_machines.BondApplication.APPROVED_to_BOUND
          - entities.SuretyProgram.fields.aggregate_available_cents
        distinguishing_aspect: |
          Aggregate-capacity overlap on the SuretyProgram resource: a new bond's net_retained slice
          "occupies" the program's finite aggregate pool; binding a bond whose net_retained exceeds
          aggregate_available collides with the already-committed bonds and is rejected with
          ERR_AGGREGATE_LIMIT_EXCEEDED. Interval semantic: sum of net_retained over ACTIVE/ISSUED
          bonds only.
        test_recipe:
          setup:
            - "Program aggregate_limit 10,000,000 with one ISSUED/ACTIVE bond already committing net_retained 8,000,000; a second APPROVED application penal 3,000,000 (8,000,000 + 3,000,000 > 10,000,000)."
