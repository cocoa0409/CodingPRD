scenario: "Campus Dining Operations (Aramark/Sodexo campus dining): menu cycle & production forecast from swipe data, allergen/dietary labeling & special-diet accommodations, retail vs board operations accounting, labor scheduling around class rush, food waste tracking & sustainability metrics, inspection/food-safety compliance, catering orders from campus departments, contract with dining vendor & commission"

domain_name: campus-dining-operations
api_prefix: "/"

complexity_profile:
  primary_archetype: Posture-driven gating
  secondary_archetype: Ledger reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# All date/datetime comparisons in state machines, calculations and validations
# use the logical clock (POST /_clock/set_current_utc; default 2026-08-01T00:00:00Z).
# =============================================================================
entities:
  - name: DiningHall
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Hall display name" }
      - { name: service_model, type: enum, source: input, description: "BOARD | RETAIL | HYBRID", constraints: "enum {BOARD, RETAIL, HYBRID}" }
      - { name: dining_capacity, type: integer, source: input, description: "Dining-room seat capacity; feeds forecast fallback (C1)", constraints: "> 0" }
      - { name: catering_kitchen_capacity, type: integer, source: input, description: "Max aggregate guaranteed_covers per (event_date, time_slot) pool (C7)", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE, constraints: "enum {ACTIVE, SUSPENDED}" }

  - name: VendorContract
    parent: null
    common_fields: true
    fields:
      - { name: dining_hall_id, type: string, source: input, description: "FK -> DiningHall.id" }
      - { name: vendor_name, type: string, source: input, description: "Dining vendor legal name" }
      - { name: board_rate_per_cover_cents, type: integer, source: input, description: "University pays vendor this per BOARD_SWIPE cover", constraints: ">= 0" }
      - { name: retail_commission_bps, type: integer, source: input, description: "Vendor pays university this many basis points of each RETAIL_SALE", constraints: "0..10000" }
      - { name: catering_commission_bps, type: integer, source: input, description: "Vendor pays university this many basis points of catering totals", constraints: "0..10000" }
      - { name: minimum_monthly_guarantee_cents, type: integer, source: input, description: "Vendor guarantees university at least this much commission per period_month", constraints: ">= 0" }
      - { name: effective_start_date, type: string, source: input, description: "ISO date; half-open interval start" }
      - { name: effective_end_date, type: string, source: input, description: "ISO date; half-open interval end (exclusive)", constraints: "> effective_start_date" }
      - { name: status, type: enum, source: system, description: "NEGOTIATION | ACTIVE | EXPIRED | TERMINATED", default: NEGOTIATION, constraints: "enum {NEGOTIATION, ACTIVE, EXPIRED, TERMINATED}" }

  - name: MenuCycle
    parent: null
    common_fields: true
    fields:
      - { name: dining_hall_id, type: string, source: input, description: "FK -> DiningHall.id" }
      - { name: name, type: string, source: input, description: "Cycle name (e.g. Fall-2026 Cycle A)" }
      - { name: cycle_length_weeks, type: integer, source: input, description: "Menu rotation length in weeks", constraints: "1..8" }
      - { name: start_date, type: string, source: input, description: "ISO date; half-open interval start (inclusive)" }
      - { name: end_date, type: string, source: input, description: "ISO date; half-open interval end (exclusive)", constraints: "> start_date" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | ARCHIVED", default: DRAFT, constraints: "enum {DRAFT, PUBLISHED, ARCHIVED}" }

  - name: Recipe
    parent: null
    common_fields: true
    fields:
      - { name: dining_hall_id, type: string, source: input, description: "FK -> DiningHall.id" }
      - { name: name, type: string, source: input, description: "Recipe name" }
      - { name: station, type: enum, source: input, description: "GRILL | DELI | PIZZA | SALAD | GLOBAL | BAKERY", constraints: "enum {GRILL, DELI, PIZZA, SALAD, GLOBAL, BAKERY}" }
      - { name: allergen_tags, type: array, source: input, description: "Array of enum {MILK, EGG, PEANUT, TREE_NUT, SOY, WHEAT, FISH, SHELLFISH, SESAME}; [] means allergen-free (only valid when allergen_reviewed is true)" }
      - { name: dietary_flags, type: array, source: input, description: "Array of enum {VEGAN, VEGETARIAN, HALAL, KOSHER, GLUTEN_FREE}" }
      - { name: popularity_share, type: number, source: input, description: "Fraction of a meal period's covers that choose this recipe (C1 input)", constraints: "0 < share <= 1" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Food cost per portion; catering quote input (C2)", constraints: "> 0" }
      - { name: allergen_reviewed, type: boolean, source: input, description: "True once a dietitian-reviewed allergen label exists", default: false }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE, constraints: "enum {ACTIVE, SUSPENDED}" }

  - name: MealPeriodService
    parent: null
    common_fields: true
    fields:
      - { name: dining_hall_id, type: string, source: input, description: "FK -> DiningHall.id" }
      - { name: menu_cycle_id, type: string, source: input, description: "FK -> MenuCycle.id; cycle must be PUBLISHED and cover service_date" }
      - { name: service_date, type: string, source: input, description: "ISO date of service" }
      - { name: meal_period, type: enum, source: input, description: "BREAKFAST | LUNCH | DINNER | LATE_NIGHT", constraints: "enum {BREAKFAST, LUNCH, DINNER, LATE_NIGHT}" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | FORECAST_LOCKED | IN_SERVICE | RECONCILED | CLOSED | CANCELLED", default: SCHEDULED, constraints: "enum {SCHEDULED, FORECAST_LOCKED, IN_SERVICE, RECONCILED, CLOSED, CANCELLED}" }
      - { name: forecasted_covers, type: integer, source: computed, description: "Base covers computed by C1 BASE rule at lock-forecast", default: 0 }
      - { name: actual_board_swipes, type: integer, source: computed, description: "Count of BOARD_SWIPE SwipeEvents (C8), maintained on reconcile", default: 0 }
      - { name: actual_retail_sales_cents, type: integer, source: computed, description: "Sum of RETAIL_SALE amount_cents (C8), maintained on reconcile", default: 0 }
      - { name: actual_covers, type: integer, source: computed, description: "board swipes + retail sale event count (C8)", default: 0 }
      - { name: forecast_variance_pct, type: number, source: computed, description: "(actual_covers - forecasted_covers)/forecasted_covers*100; null when forecasted_covers == 0", default: null }
      - { name: posted_waste_kg, type: number, source: computed, description: "Sum of POSTED WasteLog weight_kg (C6), recomputed on every post/reject-side-effect", default: 0 }
      - { name: landfill_waste_kg, type: number, source: computed, description: "Sum of POSTED WasteLog weight_kg with disposition LANDFILL", default: 0 }
      - { name: diversion_rate, type: number, source: computed, description: "(compost+donation kg)/total posted kg; null when total == 0", default: null }
      - { name: sustainability_alert, type: boolean, source: computed, description: "true iff landfill_waste_kg/actual_covers > 0.15 (C6); false when actual_covers == 0", default: false }

  - name: SwipeEvent
    parent: null
    common_fields: false
    fields:
      - { name: meal_period_id, type: string, source: input, description: "FK -> MealPeriodService.id" }
      - { name: entry_type, type: enum, source: input, description: "BOARD_SWIPE | RETAIL_SALE", constraints: "enum {BOARD_SWIPE, RETAIL_SALE}" }
      - { name: amount_cents, type: integer, source: input, description: "Gross sale amount; MUST be > 0 iff entry_type == RETAIL_SALE, MUST be 0 iff BOARD_SWIPE", constraints: "conditional on entry_type" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical-clock timestamp of ingestion" }

  - name: ProductionForecast
    parent: null
    common_fields: true
    fields:
      - { name: meal_period_id, type: string, source: input, description: "FK -> MealPeriodService.id" }
      - { name: recipe_id, type: string, source: input, description: "FK -> Recipe.id; recipe must be ACTIVE and belong to the period's hall" }
      - { name: variant, type: enum, source: input, description: "BASE (moving average w/ capacity fallback) | TREND (slope-adjusted, needs >=2 history)", constraints: "enum {BASE, TREND}" }
      - { name: forecasted_portions, type: integer, source: computed, description: "C1 output, frozen at creation" }
      - { name: base_covers, type: integer, source: computed, description: "C1 intermediate period-level cover estimate" }
      - { name: status, type: enum, source: system, description: "DRAFT | LOCKED | SUPERSEDED", default: DRAFT, constraints: "enum {DRAFT, LOCKED, SUPERSEDED}" }

  - name: AccommodationRequest
    parent: null
    common_fields: true
    fields:
      - { name: dining_hall_id, type: string, source: input, description: "FK -> DiningHall.id" }
      - { name: student_ref, type: string, source: input, description: "Opaque student identifier (e.g. campus ID)" }
      - { name: allergen_exclusions, type: array, source: input, description: "Allergen enum values that must not appear in suitable menu items" }
      - { name: dietary_requirement, type: enum, source: input, description: "VEGAN | VEGETARIAN | HALAL | KOSHER | GLUTEN_FREE | OTHER", constraints: "enum {VEGAN, VEGETARIAN, HALAL, KOSHER, GLUTEN_FREE, OTHER}" }
      - { name: review_notes, type: string, source: system, description: "Latest dietitian note (set by request-info)", default: "" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | NUTRITION_REVIEW | APPROVED | ACTIVE | CANCELLED", default: SUBMITTED, constraints: "enum {SUBMITTED, NUTRITION_REVIEW, APPROVED, ACTIVE, CANCELLED}" }

  - name: LaborShift
    parent: null
    common_fields: true
    fields:
      - { name: dining_hall_id, type: string, source: input, description: "FK -> DiningHall.id" }
      - { name: staff_ref, type: string, source: input, description: "Opaque staff identifier; optional at creation (PLANNED when absent, ASSIGNED when present)" , default: null }
      - { name: role, type: enum, source: input, description: "COOK | SERVER | CASHIER | DISHWASHER", constraints: "enum {COOK, SERVER, CASHIER, DISHWASHER}" }
      - { name: shift_date, type: string, source: input, description: "ISO date" }
      - { name: start_minute, type: integer, source: input, description: "Minutes from midnight [0, 1439]", constraints: "0..1439" }
      - { name: end_minute, type: integer, source: input, description: "Minutes from midnight; half-open [start_minute, end_minute)", constraints: "start_minute < end_minute <= 1440" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Straight-time hourly rate", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "PLANNED | ASSIGNED | CONFIRMED | COMPLETED | NO_SHOW", default: "PLANNED (ASSIGNED when staff_ref supplied at creation)", constraints: "enum {PLANNED, ASSIGNED, CONFIRMED, COMPLETED, NO_SHOW}" }
      - { name: worked_minutes, type: integer, source: input, description: "Actual minutes worked, supplied at complete; 1..(end_minute-start_minute)+60", default: null }
      - { name: regular_minutes, type: integer, source: computed, description: "C4 output: worked minutes up to the 2400-min weekly threshold", default: 0 }
      - { name: overtime_minutes, type: integer, source: computed, description: "C4 output: worked minutes beyond the 2400-min weekly threshold", default: 0 }
      - { name: regular_pay_cents, type: integer, source: computed, description: "round_half_up(regular_minutes * hourly_rate_cents / 60)", default: 0 }
      - { name: overtime_pay_cents, type: integer, source: computed, description: "round_half_up(overtime_minutes * hourly_rate_cents * 1.5 / 60)", default: 0 }

  - name: WasteLog
    parent: null
    common_fields: true
    fields:
      - { name: meal_period_id, type: string, source: input, description: "FK -> MealPeriodService.id" }
      - { name: category, type: enum, source: input, description: "PRE_CONSUMER | POST_CONSUMER | SPOILAGE", constraints: "enum {PRE_CONSUMER, POST_CONSUMER, SPOILAGE}" }
      - { name: disposition, type: enum, source: input, description: "LANDFILL | COMPOST | DONATION", constraints: "enum {LANDFILL, COMPOST, DONATION}" }
      - { name: weight_kg, type: number, source: input, description: "Waste mass", constraints: "> 0" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the recorder; segregation-of-duties anchor" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the verifier", default: null }
      - { name: status, type: enum, source: system, description: "RECORDED | VERIFIED | POSTED", default: RECORDED, constraints: "enum {RECORDED, VERIFIED, POSTED}" }

  - name: InspectionReport
    parent: null
    common_fields: true
    fields:
      - { name: dining_hall_id, type: string, source: input, description: "FK -> DiningHall.id" }
      - { name: inspector_user_id, type: string, source: system, description: "X-User-ID of the filing HealthInspector" }
      - { name: inspection_date, type: string, source: input, description: "ISO date of the inspection" }
      - { name: violations, type: array, source: input, description: "Array of {code: string, severity: enum {CRITICAL, MAJOR, MINOR}}" }
      - { name: score, type: integer, source: computed, description: "C5: max(0, 100 - sum of demerits); CRITICAL=25, MAJOR=10, MINOR=3; computed at submit" , default: null }
      - { name: outcome, type: enum, source: computed, description: "C5: FAIL if any CRITICAL or score < 40; CONDITIONAL if 40..69; PASS if score >= 70 and no CRITICAL", default: null, constraints: "enum {PASS, CONDITIONAL, FAIL}" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACKNOWLEDGED | CLOSED", default: DRAFT, constraints: "enum {DRAFT, SUBMITTED, ACKNOWLEDGED, CLOSED}" }

  - name: CorrectiveAction
    parent: null
    common_fields: true
    fields:
      - { name: inspection_report_id, type: string, source: input, description: "FK -> InspectionReport.id" }
      - { name: violation_code, type: string, source: input, description: "Code of the violation being remediated" }
      - { name: severity, type: enum, source: input, description: "CRITICAL | MAJOR | MINOR", constraints: "enum {CRITICAL, MAJOR, MINOR}" }
      - { name: due_date, type: string, source: input, description: "ISO date; cascade-created rows use inspection_date + 7d (CRITICAL) / 14d (MAJOR) / 30d (MINOR)" }
      - { name: status, type: enum, source: system, description: "OPEN | OVERDUE | RESOLVED | VERIFIED", default: OPEN, constraints: "enum {OPEN, OVERDUE, RESOLVED, VERIFIED}" }
      - { name: resolved_by_user_id, type: string, source: system, description: "X-User-ID of resolving HallManager", default: null }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of verifying HealthInspector", default: null }

  - name: Department
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Campus department name" }
      - { name: department_code, type: string, source: input, description: "Unique billing code", constraints: "unique across all Departments" }
      - { name: semester_budget_cents, type: integer, source: input, description: "Semester catering budget", constraints: ">= 0" }
      - { name: reserved_cents, type: integer, source: computed, description: "C7: sum of quoted_total_cents over own CateringOrders with approval_status == SUBMITTED", default: 0 }
      - { name: committed_cents, type: integer, source: computed, description: "C7: sum of quoted_total_cents over own orders APPROVED with fulfillment_status in {NONE, SCHEDULED, FULFILLED, INVOICED}", default: 0 }
      - { name: spent_cents, type: integer, source: computed, description: "C7: sum of final_total_cents over PAID orders plus cancellation fees charged", default: 0 }
      - { name: available_cents, type: integer, source: computed, description: "C7: semester_budget_cents - reserved_cents - committed_cents - spent_cents", default: 0 }

  - name: CateringOrder
    parent: null
    common_fields: true
    fields:
      - { name: dining_hall_id, type: string, source: input, description: "FK -> DiningHall.id" }
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; must equal X-User-ID when role is DepartmentUser" }
      - { name: revised_from_id, type: string, source: input, description: "FK -> CateringOrder.id; optional self-reference to a REJECTED order this one revises", default: null }
      - { name: event_date, type: string, source: input, description: "ISO date of the event" }
      - { name: time_slot, type: enum, source: input, description: "BREAKFAST (starts 07:00) | LUNCH (11:00) | DINNER (17:00); slot start drives lead-time and capacity pool", constraints: "enum {BREAKFAST, LUNCH, DINNER}" }
      - { name: guaranteed_covers, type: integer, source: input, description: "Guaranteed headcount; drives quote tier and capacity pool", constraints: "> 0" }
      - { name: menu_lines, type: array, source: input, description: "Array of {recipe_id, portions}; each recipe must be ACTIVE at the order's hall; portions > 0" }
      - { name: dietary_plates, type: integer, source: input, description: "Count of special-diet plates (C2 premium)", default: 0, constraints: ">= 0" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "C2 output, frozen at creation" }
      - { name: final_total_cents, type: integer, source: input, description: "Actual invoice amount set at invoice; must be within [80%, 120%] of quoted_total_cents (bounds inclusive)", default: null }
      - { name: cancellation_fee_cents, type: integer, source: computed, description: "0 when cancelled from DRAFT/SUBMITTED; from APPROVED: round_half_up(quoted_total_cents * fee_bps/10000), fee_bps 1000 if event_start - now >= 72h else 2500", default: 0 }
      - { name: approval_status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | CANCELLED (dimension 1)", default: DRAFT, constraints: "enum {DRAFT, SUBMITTED, APPROVED, REJECTED, CANCELLED}" }
      - { name: fulfillment_status, type: enum, source: system, description: "NONE | SCHEDULED | FULFILLED | INVOICED | PAID | CANCELLED (dimension 2)", default: NONE, constraints: "enum {NONE, SCHEDULED, FULFILLED, INVOICED, PAID, CANCELLED}" }

  - name: CommissionStatement
    parent: null
    common_fields: true
    fields:
      - { name: vendor_contract_id, type: string, source: input, description: "FK -> VendorContract.id" }
      - { name: period_month, type: string, source: input, description: "Settlement month, format YYYY-MM; unique per contract", constraints: "unique per vendor_contract_id" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINALIZED | DISPUTED", default: PROVISIONAL, constraints: "enum {PROVISIONAL, FINALIZED, DISPUTED}" }
      - { name: board_revenue_cents, type: integer, source: computed, description: "C3: sum of actual_board_swipes * board_rate_per_cover_cents over included periods" }
      - { name: retail_commission_cents, type: integer, source: computed, description: "C3: per-event round_half_up(amount_cents * retail_commission_bps / 10000), then summed over included RETAIL_SALE events" }
      - { name: catering_commission_cents, type: integer, source: computed, description: "C3: per-order round_half_up(base * catering_commission_bps / 10000), then summed over included orders" }
      - { name: guarantee_top_up_cents, type: integer, source: computed, description: "C3 FINAL only: max(0, minimum_monthly_guarantee_cents - (retail + catering)); 0 in PROVISIONAL" }
      - { name: total_due_to_university_cents, type: integer, source: computed, description: "retail_commission_cents + catering_commission_cents + guarantee_top_up_cents" }
      - { name: provisional_total_due_cents, type: integer, source: computed, description: "PROVISIONAL total captured at creation; immutable thereafter" }
      - { name: finalized_at, type: datetime, source: system, description: "Logical-clock timestamp of finalize", default: null }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: DiningHall
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /dining-halls/{id}/suspend, OR cascade when an InspectionReport submit computes outcome FAIL, OR cascade when a CRITICAL CorrectiveAction is reopened"
        actor: DiningAdmin | system
        preconditions: []
        side_effects:
          - "Every MealPeriodService at this hall with status == SCHEDULED transitions to CANCELLED (FORECAST_LOCKED and later states are NOT auto-cancelled)"
          - "increments DiningHall.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /dining-halls/{id}/reactivate"
        actor: DiningAdmin
        preconditions:
          - "No CorrectiveAction with severity == CRITICAL and status in {OPEN, OVERDUE} exists on any InspectionReport whose dining_hall_id == this hall (else ERR_CRITICAL_VIOLATION_OPEN)"
        side_effects:
          - "increments DiningHall.version by 1"

  - entity: VendorContract
    initial_state: NEGOTIATION
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: NEGOTIATION
        to: ACTIVE
        trigger: "POST /vendor-contracts/{id}/activate"
        actor: ContractManager
        preconditions:
          - "No other VendorContract with dining_hall_id == this contract's hall has status == ACTIVE (else ERR_DUPLICATE_ACTIVE_CONTRACT)"
        side_effects: ["increments VendorContract.version by 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /vendor-contracts/{id}/terminate"
        actor: ContractManager
        preconditions: []
        side_effects: ["increments VendorContract.version by 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system sweep executed inside POST /_clock/set_current_utc: contracts with status == ACTIVE and effective_end_date <= new clock value transition to EXPIRED (boundary: end_date == now expires, since the interval is half-open)"
        actor: system
        preconditions: []
        side_effects: ["increments VendorContract.version by 1", "sweep response lists the id in expired_contract_ids"]

  - entity: MenuCycle
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /menu-cycles/{id}/publish"
        actor: DiningAdmin
        preconditions:
          - "Every Recipe with dining_hall_id == cycle's hall and status == ACTIVE has allergen_reviewed == true (else ERR_ALLERGEN_UNDECLARED; vacuously true when no ACTIVE recipes exist)"
          - "No other MenuCycle at the same hall with status == PUBLISHED has [start_date, end_date) intersecting this cycle's [start_date, end_date); intervals are half-open so end_date == other.start_date is NOT an overlap (else ERR_CYCLE_OVERLAP)"
        side_effects: ["increments MenuCycle.version by 1"]
      - from: DRAFT
        to: ARCHIVED
        trigger: "POST /menu-cycles/{id}/archive"
        actor: DiningAdmin
        preconditions: []
        side_effects: ["increments MenuCycle.version by 1"]
      - from: PUBLISHED
        to: ARCHIVED
        trigger: "POST /menu-cycles/{id}/archive"
        actor: DiningAdmin
        preconditions: []
        side_effects: ["increments MenuCycle.version by 1"]

  - entity: Recipe
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /recipes/{id}/suspend (allergen audit)"
        actor: DiningAdmin
        preconditions: []
        side_effects: ["increments Recipe.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /recipes/{id}/reinstate"
        actor: DiningAdmin
        preconditions:
          - "allergen_reviewed == true (else ERR_ALLERGEN_UNDECLARED)"
        side_effects: ["increments Recipe.version by 1"]

  - entity: MealPeriodService
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: FORECAST_LOCKED
        trigger: "POST /meal-periods/{id}/lock-forecast"
        actor: HallManager
        preconditions:
          - "At least 1 ProductionForecast exists with meal_period_id == this period (else ERR_INVALID_STATE)"
          - "No ProductionForecast with meal_period_id == this period has status == DRAFT (else ERR_INVALID_STATE)"
        side_effects:
          - "computes and stores forecasted_covers via C1 BASE rule (capacity fallback allowed)"
          - "increments MealPeriodService.version by 1"
      - from: FORECAST_LOCKED
        to: IN_SERVICE
        trigger: "POST /meal-periods/{id}/open-service"
        actor: HallManager
        preconditions:
          - "DiningHall of this period has status == ACTIVE (else ERR_HALL_SUSPENDED)"
        side_effects: ["increments MealPeriodService.version by 1"]
      - from: IN_SERVICE
        to: RECONCILED
        trigger: "POST /meal-periods/{id}/reconcile"
        actor: HallManager
        preconditions: []
        side_effects:
          - "computes actual_board_swipes, actual_retail_sales_cents, actual_covers via C8"
          - "computes forecast_variance_pct (null when forecasted_covers == 0)"
          - "increments MealPeriodService.version by 1"
      - from: RECONCILED
        to: CLOSED
        trigger: "POST /meal-periods/{id}/close"
        actor: DiningAdmin
        preconditions:
          - "No WasteLog with meal_period_id == this period has status in {RECORDED, VERIFIED} (else ERR_PENDING_WASTE_LOGS)"
        side_effects: ["increments MealPeriodService.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system cascade: parent DiningHall transitions ACTIVE -> SUSPENDED"
        actor: system
        preconditions: []
        side_effects: ["increments MealPeriodService.version by 1"]

  - entity: ProductionForecast
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /production-forecasts/{id}/lock"
        actor: KitchenLead
        preconditions:
          - "The parent MealPeriodService has status == SCHEDULED (else ERR_FORECAST_LOCKED_PERIOD)"
        side_effects: ["increments ProductionForecast.version by 1"]
      - from: LOCKED
        to: SUPERSEDED
        trigger: "system cascade: POST /meal-periods/{id}/forecasts succeeds for the same (meal_period_id, recipe_id) pair"
        actor: system
        preconditions: []
        side_effects:
          - "increments ProductionForecast.version by 1"
          - "invariant INV-2: count of LOCKED forecasts per (meal_period_id, recipe_id) is at most 1 before and after the supersede"

  - entity: AccommodationRequest
    initial_state: SUBMITTED
    terminal_states: [CANCELLED]
    transitions:
      - from: SUBMITTED
        to: NUTRITION_REVIEW
        trigger: "POST /accommodation-requests/{id}/start-review"
        actor: Dietitian
        preconditions: []
        side_effects: ["increments AccommodationRequest.version by 1"]
      - from: NUTRITION_REVIEW
        to: SUBMITTED
        trigger: "POST /accommodation-requests/{id}/request-info (dietitian needs more information; cycle)"
        actor: Dietitian
        preconditions: []
        side_effects: ["stores review_notes", "increments AccommodationRequest.version by 1"]
      - from: NUTRITION_REVIEW
        to: APPROVED
        trigger: "POST /accommodation-requests/{id}/approve"
        actor: Dietitian
        preconditions:
          - "Suitable menu exists: at least 1 Recipe at the request's hall with status == ACTIVE, allergen_tags disjoint from allergen_exclusions, and (dietary_requirement == OTHER OR dietary_requirement in recipe.dietary_flags) (else ERR_NO_SUITABLE_MENU)"
        side_effects: ["increments AccommodationRequest.version by 1"]
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /accommodation-requests/{id}/activate (kitchen confirms production plan)"
        actor: KitchenLead
        preconditions: []
        side_effects: ["increments AccommodationRequest.version by 1"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /accommodation-requests/{id}/cancel"
        actor: HallManager | Dietitian
        preconditions: []
        side_effects: ["increments AccommodationRequest.version by 1"]
      - from: NUTRITION_REVIEW
        to: CANCELLED
        trigger: "POST /accommodation-requests/{id}/cancel"
        actor: HallManager | Dietitian
        preconditions: []
        side_effects: ["increments AccommodationRequest.version by 1"]
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /accommodation-requests/{id}/cancel"
        actor: HallManager | Dietitian
        preconditions: []
        side_effects: ["increments AccommodationRequest.version by 1"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /accommodation-requests/{id}/cancel"
        actor: HallManager | Dietitian
        preconditions: []
        side_effects: ["increments AccommodationRequest.version by 1"]

  - entity: LaborShift
    initial_state: "PLANNED (ASSIGNED when staff_ref supplied at creation)"
    terminal_states: [COMPLETED, NO_SHOW]
    transitions:
      - from: PLANNED
        to: ASSIGNED
        trigger: "POST /labor-shifts (with staff_ref) OR POST /labor-shifts/{id}/assign"
        actor: HallManager
        preconditions:
          - "No other LaborShift with the same staff_ref and status in {ASSIGNED, CONFIRMED, COMPLETED} has [start_minute, end_minute) on the same shift_date intersecting the new [start_minute, end_minute); half-open: end == other.start is not an overlap (else ERR_SHIFT_OVERLAP)"
          - "Rest buffer: for every prior shift of the same staff_ref with status in {ASSIGNED, CONFIRMED, COMPLETED}, the gap (new_start_absolute_minutes - prior_end_absolute_minutes), where absolute = day_offset*1440 + minute, must be >= 480 when the prior shift ends before the new one starts (else ERR_REST_PERIOD_VIOLATION); boundary: exactly 480 is allowed"
        side_effects: ["increments LaborShift.version by 1"]
      - from: ASSIGNED
        to: CONFIRMED
        trigger: "POST /labor-shifts/{id}/confirm"
        actor: HallManager
        preconditions:
          - "DiningHall of this shift has status == ACTIVE (else ERR_HALL_SUSPENDED)"
        side_effects: ["increments LaborShift.version by 1"]
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /labor-shifts/{id}/complete"
        actor: HallManager
        preconditions:
          - "1 <= worked_minutes <= (end_minute - start_minute) + 60 (else ERR_VALIDATION)"
        side_effects:
          - "runs C4: recomputes regular_minutes / overtime_minutes / regular_pay_cents / overtime_pay_cents for this shift against all COMPLETED shifts of the same staff_ref in the same ISO week"
          - "increments LaborShift.version by 1"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /labor-shifts/{id}/mark-no-show"
        actor: HallManager
        preconditions: []
        side_effects: ["increments LaborShift.version by 1"]

  - entity: WasteLog
    initial_state: RECORDED
    terminal_states: [POSTED]
    transitions:
      - from: RECORDED
        to: VERIFIED
        trigger: "POST /waste-logs/{id}/verify"
        actor: HallManager
        preconditions:
          - "Parent MealPeriodService status in {IN_SERVICE, RECONCILED} (else ERR_INVALID_STATE)"
          - "Segregation of duties: X-User-ID != recorded_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["sets verified_by_user_id", "increments WasteLog.version by 1"]
      - from: VERIFIED
        to: RECORDED
        trigger: "POST /waste-logs/{id}/reject (verification failed; cycle)"
        actor: HallManager
        preconditions: []
        side_effects: ["clears verified_by_user_id to null", "increments WasteLog.version by 1"]
      - from: VERIFIED
        to: POSTED
        trigger: "POST /waste-logs/{id}/post"
        actor: HallManager
        preconditions:
          - "Parent MealPeriodService status == RECONCILED (else ERR_INVALID_STATE)"
        side_effects:
          - "recomputes parent MealPeriodService.posted_waste_kg, landfill_waste_kg, diversion_rate (C6)"
          - "re-evaluates parent sustainability_alert (C6 threshold rule); sets or clears the flag"
          - "increments parent MealPeriodService.version by 1"
          - "increments WasteLog.version by 1"

  - entity: InspectionReport
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /inspection-reports/{id}/submit"
        actor: HealthInspector
        preconditions: []
        side_effects:
          - "computes score and outcome via C5"
          - "creates one CorrectiveAction per violation (severity copied; due_date = inspection_date + 7d CRITICAL / +14d MAJOR / +30d MINOR; status OPEN)"
          - "if outcome == FAIL: parent DiningHall transitions ACTIVE -> SUSPENDED, whose own side effect CANCELS every SCHEDULED MealPeriodService at the hall (transitive cascade depth 3: report -> hall -> periods)"
          - "increments InspectionReport.version by 1"
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /inspection-reports/{id}/acknowledge"
        actor: HallManager
        preconditions: []
        side_effects: ["increments InspectionReport.version by 1"]
      - from: ACKNOWLEDGED
        to: CLOSED
        trigger: "POST /inspection-reports/{id}/close"
        actor: HealthInspector
        preconditions:
          - "Every CorrectiveAction with inspection_report_id == this report has status == VERIFIED (else ERR_INSPECTION_INCOMPLETE)"
        side_effects: ["increments InspectionReport.version by 1"]

  - entity: CorrectiveAction
    initial_state: OPEN
    terminal_states: [VERIFIED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /corrective-actions/{id}/resolve"
        actor: HallManager
        preconditions:
          - "Parent InspectionReport status in {SUBMITTED, ACKNOWLEDGED} (else ERR_INVALID_STATE)"
        side_effects: ["sets resolved_by_user_id", "increments CorrectiveAction.version by 1"]
      - from: OVERDUE
        to: RESOLVED
        trigger: "POST /corrective-actions/{id}/resolve"
        actor: HallManager
        preconditions:
          - "Parent InspectionReport status in {SUBMITTED, ACKNOWLEDGED} (else ERR_INVALID_STATE)"
        side_effects: ["sets resolved_by_user_id", "increments CorrectiveAction.version by 1"]
      - from: RESOLVED
        to: VERIFIED
        trigger: "POST /corrective-actions/{id}/verify"
        actor: HealthInspector
        preconditions:
          - "Parent InspectionReport status == ACKNOWLEDGED (else ERR_INVALID_STATE)"
        side_effects: ["sets verified_by_user_id", "increments CorrectiveAction.version by 1"]
      - from: RESOLVED
        to: OPEN
        trigger: "POST /corrective-actions/{id}/reopen (verification failed; cycle)"
        actor: HealthInspector
        preconditions: []
        side_effects:
          - "clears resolved_by_user_id to null"
          - "if severity == CRITICAL and the report's DiningHall has status == ACTIVE: hall transitions ACTIVE -> SUSPENDED, whose own side effect CANCELS every SCHEDULED MealPeriodService at the hall (transitive cascade: corrective action -> hall -> periods)"
          - "increments CorrectiveAction.version by 1"
      - from: OPEN
        to: OVERDUE
        trigger: "system sweep executed inside POST /_clock/set_current_utc: actions with status == OPEN and due_date < new clock date transition to OVERDUE (boundary: due_date == now is NOT overdue)"
        actor: system
        preconditions: []
        side_effects: ["increments CorrectiveAction.version by 1", "sweep response lists the id in overdue_corrective_action_ids"]

  - entity: CateringOrder
    initial_state: "approval_status=DRAFT, fulfillment_status=NONE (parallel dimensions)"
    terminal_states: ["approval_status=CANCELLED", "fulfillment_status=PAID", "fulfillment_status=CANCELLED"]
    transitions:
      - from: "approval DRAFT | REJECTED"
        to: "approval SUBMITTED"
        trigger: "POST /catering-orders/{id}/submit"
        actor: DepartmentUser
        preconditions:
          - "DiningHall of this order has status == ACTIVE (else ERR_HALL_SUSPENDED)"
          - "Lead time: event_start (event_date + slot start hour: BREAKFAST 07:00, LUNCH 11:00, DINNER 17:00) minus logical now >= 48h; exactly 48h is allowed (else ERR_LEAD_TIME_VIOLATION)"
          - "Department available_cents >= quoted_total_cents; exact equality is allowed (else ERR_INSUFFICIENT_BUDGET)"
        side_effects:
          - "Department.reserved_cents += quoted_total_cents; available_cents recomputed (C7)"
          - "increments Department.version by 1"
          - "increments CateringOrder.version by 1"
      - from: "approval SUBMITTED"
        to: "approval APPROVED"
        trigger: "POST /catering-orders/{id}/approve"
        actor: HallManager
        preconditions:
          - "OCC: expected_department_version must equal Department.version (else ERR_STALE_VERSION, checked after from-state validation)"
          - "No CorrectiveAction with severity == CRITICAL and status in {OPEN, OVERDUE} exists on any InspectionReport at the order's hall (else ERR_CRITICAL_VIOLATION_OPEN)"
          - "Slot capacity (C7): sum of guaranteed_covers over orders at the same hall with approval_status == APPROVED, same event_date, same time_slot, plus this order's guaranteed_covers, <= hall.catering_kitchen_capacity; equality allowed (else ERR_CATERING_CAPACITY_EXCEEDED)"
        side_effects:
          - "Department.reserved_cents -= quoted_total_cents; Department.committed_cents += quoted_total_cents; available_cents recomputed (C7)"
          - "increments Department.version by 1"
          - "increments CateringOrder.version by 1"
      - from: "approval SUBMITTED"
        to: "approval REJECTED"
        trigger: "POST /catering-orders/{id}/reject"
        actor: HallManager
        preconditions: []
        side_effects:
          - "Department.reserved_cents -= quoted_total_cents; available_cents recomputed (C7) — compensating action for submit"
          - "increments Department.version by 1"
          - "increments CateringOrder.version by 1"
      - from: "approval APPROVED, fulfillment NONE"
        to: "fulfillment SCHEDULED"
        trigger: "POST /catering-orders/{id}/schedule"
        actor: HallManager
        preconditions: []
        side_effects: ["increments CateringOrder.version by 1"]
      - from: "fulfillment SCHEDULED"
        to: "fulfillment FULFILLED"
        trigger: "POST /catering-orders/{id}/fulfill"
        actor: KitchenLead
        preconditions: []
        side_effects: ["increments CateringOrder.version by 1"]
      - from: "fulfillment FULFILLED"
        to: "fulfillment INVOICED"
        trigger: "POST /catering-orders/{id}/invoice"
        actor: HallManager
        preconditions:
          - "final_total_cents within [round_half_up(quoted_total_cents*0.80), round_half_up(quoted_total_cents*1.20)] inclusive (else ERR_VALIDATION)"
        side_effects: ["stores final_total_cents", "increments CateringOrder.version by 1"]
      - from: "fulfillment INVOICED"
        to: "fulfillment PAID"
        trigger: "POST /catering-orders/{id}/pay"
        actor: DiningAdmin
        preconditions: []
        side_effects:
          - "Department.committed_cents -= quoted_total_cents; Department.spent_cents += final_total_cents; available_cents recomputed (C7)"
          - "increments Department.version by 1"
          - "increments CateringOrder.version by 1"
      - from: "approval DRAFT (fulfillment NONE)"
        to: "approval CANCELLED (fulfillment NONE)"
        trigger: "POST /catering-orders/{id}/cancel"
        actor: DepartmentUser | HallManager
        preconditions: []
        side_effects: ["cancellation_fee_cents = 0", "increments CateringOrder.version by 1"]
      - from: "approval SUBMITTED (fulfillment NONE)"
        to: "approval CANCELLED (fulfillment NONE)"
        trigger: "POST /catering-orders/{id}/cancel"
        actor: DepartmentUser | HallManager
        preconditions: []
        side_effects:
          - "Department.reserved_cents -= quoted_total_cents; available_cents recomputed"
          - "cancellation_fee_cents = 0"
          - "increments Department.version by 1 and CateringOrder.version by 1"
      - from: "approval APPROVED, fulfillment NONE | SCHEDULED"
        to: "approval CANCELLED, fulfillment CANCELLED"
        trigger: "POST /catering-orders/{id}/cancel"
        actor: DepartmentUser | HallManager
        preconditions: []
        side_effects:
          - "cancellation_fee_cents = round_half_up(quoted_total_cents * fee_bps/10000); fee_bps = 1000 when event_start - now >= 72h (boundary inclusive), else 2500"
          - "Department.committed_cents -= quoted_total_cents; Department.spent_cents += cancellation_fee_cents; available_cents recomputed (C7)"
          - "increments Department.version by 1 and CateringOrder.version by 1"

  - entity: CommissionStatement
    initial_state: PROVISIONAL
    terminal_states: []
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /commission-statements/{id}/finalize"
        actor: ContractManager
        preconditions:
          - "Parent VendorContract status == ACTIVE (else ERR_CONTRACT_NOT_ACTIVE)"
        side_effects:
          - "recomputes all monetary fields under the FINAL variant (C3); provisional_total_due_cents is left unchanged"
          - "sets finalized_at"
          - "increments CommissionStatement.version by 1"
      - from: FINALIZED
        to: DISPUTED
        trigger: "POST /commission-statements/{id}/dispute"
        actor: DiningAdmin
        preconditions: []
        side_effects: ["increments CommissionStatement.version by 1"]
      - from: DISPUTED
        to: PROVISIONAL
        trigger: "POST /commission-statements/{id}/recompute (dispute resolved by regeneration; cycle)"
        actor: DiningAdmin
        preconditions: []
        side_effects:
          - "recomputes all monetary fields under the PROVISIONAL variant (C3); provisional_total_due_cents left unchanged"
          - "clears finalized_at to null"
          - "increments CommissionStatement.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only; both pass the serial-observability filter)
# =============================================================================
concurrency_rules:
  - rule_id: forecast-create-stale-period
    parent_entity: MealPeriodService
    write_endpoint: "POST /meal-periods/{id}/forecasts"
    occ_field: expected_meal_period_version
    description: |
      Creating a ProductionForecast against a MealPeriodService whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another planner has just created a forecast (which legitimately
      supersedes the prior LOCKED forecast for the same recipe and bumps the
      period version), leaving the current writer's view of the period stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: catering-approve-stale-department
    parent_entity: Department
    write_endpoint: "POST /catering-orders/{id}/approve"
    occ_field: expected_department_version
    description: |
      Approving a CateringOrder against a Department whose version has advanced
      since the approver last observed it is rejected. This captures the case
      where another approval or rejection has just moved funds between the
      department's reserved and committed buckets, so the approver's budget view
      is stale and the approval must be re-issued against fresh figures.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: production_forecast_portions
    trigger: "POST /meal-periods/{id}/forecasts (per forecast row); BASE rule also runs at POST /meal-periods/{id}/lock-forecast to store forecasted_covers"
    algorithm: forward_looking
    formula: |
      occurrences = MealPeriodServices with same dining_hall_id, same meal_period,
        service_date == target.service_date - 7*k days for k >= 1 (same weekday),
        and status in {IN_SERVICE, RECONCILED, CLOSED};
        take the 4 most recent by service_date DESC (tie impossible: one period per date+slot is NOT enforced, so tie-break by created_at ASC).
      covers(p) = count of SwipeEvents with meal_period_id == p (BOARD_SWIPE and RETAIL_SALE both count as 1 cover).
      if |occurrences| >= 2:
        mean_covers = round_half_up(avg(covers over the selected occurrences))
        if variant == BASE:  base_covers = mean_covers
        if variant == TREND: slope = (covers_newest - covers_oldest) / (n-1)  [n = |occurrences|, 2..4; oldest/newest by service_date]
                             base_covers = round_half_up(mean_covers + slope)
      else:  # fewer than 2 historical occurrences
        if variant == TREND: reject with ERR_INSUFFICIENT_HISTORY
        if variant == BASE:  base_covers = round_half_up(dining_capacity * DEFAULT_OCCUPANCY_PCT)
      forecasted_portions = round_half_up(base_covers * recipe.popularity_share * (1 + PREP_BUFFER_PCT))
    input_set: "Same-hall MealPeriodServices in {IN_SERVICE, RECONCILED, CLOSED} on the same weekday and meal_period, strictly before service_date; SwipeEvents of those periods"
    constants:
      HISTORY_WINDOW_OCCURRENCES: 4
      PREP_BUFFER_PCT: 0.05
      DEFAULT_OCCUPANCY_PCT: 0.60
    precision: "integer portions; all internal rounding round_half_up"
    variants:
      - name: BASE
        when: "default planning variant; also used for MealPeriodService.forecasted_covers at lock-forecast"
        difference: "plain moving average; falls back to capacity * 0.60 when history < 2"
      - name: TREND
        when: "planner explicitly requests trend-adjusted variant"
        difference: "adds linear slope between oldest and newest occurrence; requires >= 2 occurrences else ERR_INSUFFICIENT_HISTORY; produces different portions whenever slope != 0"

  - name: catering_quote
    trigger: "POST /catering-orders (quoted_total_cents frozen at creation; resubmit reuses the frozen quote)"
    algorithm: tiered_pricing
    formula: |
      food_cost_cents = sum over menu_lines of (portions * recipe.unit_cost_cents)   [exact integer]
      markup_rate = 1.40 if guaranteed_covers < 50
                    1.25 if 50 <= guaranteed_covers < 200
                    1.15 if guaranteed_covers >= 200        [tier boundaries: 50 and 200 belong to the higher tier... i.e. covers == 50 uses 1.25, covers == 200 uses 1.15]
      marked_up_cents = round_half_up(food_cost_cents * markup_rate)                  [rounding step 1: food only]
      dietary_premium_cents = dietary_plates * DIETARY_PREMIUM_CENTS                  [exact integer]
      service_fee_cents = SERVICE_FEE_BASE_CENTS + PER_COVER_STAFFING_CENTS * guaranteed_covers
      quoted_total_cents = max(MINIMUM_ORDER_CENTS, marked_up_cents + dietary_premium_cents + service_fee_cents)  [floor applied LAST]
    input_set: "menu_lines recipes (must be ACTIVE at order's hall), guaranteed_covers, dietary_plates"
    constants:
      DIETARY_PREMIUM_CENTS: 300
      SERVICE_FEE_BASE_CENTS: 7500
      PER_COVER_STAFFING_CENTS: 25
      MINIMUM_ORDER_CENTS: 50000
    precision: "integer cents; round_half_up applied once to the marked-up food cost before integer additions"

  - name: commission_settlement
    trigger: "POST /vendor-contracts/{id}/commission-statements (PROVISIONAL variant); POST /commission-statements/{id}/finalize (FINAL variant); POST /commission-statements/{id}/recompute (PROVISIONAL again)"
    algorithm: aggregation
    formula: |
      periods(contract, month) = MealPeriodServices at contract.dining_hall_id with service_date inside period_month.
      PROVISIONAL inclusion: periods with status in {RECONCILED, CLOSED}.
      FINAL inclusion:       periods with status in {CLOSED} only.
      board_revenue_cents = sum over included periods of (actual_board_swipes * board_rate_per_cover_cents)
      retail events: every RETAIL_SALE SwipeEvent of included periods contributes
        round_half_up(amount_cents * retail_commission_bps / 10000); retail_commission_cents = SUM of those per-event rounded values
        [rounding order PINNED: round per event, then sum — sum-then-round is a different, forbidden result]
      catering orders: orders at the hall with event_date inside period_month.
        PROVISIONAL inclusion: fulfillment_status in {SCHEDULED, FULFILLED, INVOICED, PAID}, base = quoted_total_cents.
        FINAL inclusion:       fulfillment_status == PAID only, base = final_total_cents.
        each included order contributes round_half_up(base * catering_commission_bps / 10000); catering_commission_cents = SUM of per-order rounded values.
      guarantee_top_up_cents = 0 in PROVISIONAL;
        in FINAL: max(0, minimum_monthly_guarantee_cents - (retail_commission_cents + catering_commission_cents))
      total_due_to_university_cents = retail_commission_cents + catering_commission_cents + guarantee_top_up_cents
    input_set: "MealPeriodServices and SwipeEvents at the contract's hall inside period_month (status-filtered per variant); CateringOrders at the hall with event_date inside period_month (status-filtered per variant)"
    constants: {}
    precision: "integer cents; per-event and per-order round_half_up before summation"
    variants:
      - name: PROVISIONAL
        when: "at statement creation and after recompute"
        difference: "includes RECONCILED periods; catering on quoted totals incl. non-PAID; no guarantee top-up"
      - name: FINAL
        when: "at finalize"
        difference: "CLOSED periods only; PAID catering only on final_total_cents; guarantee top-up applied"

  - name: weekly_overtime_allocation
    trigger: "POST /labor-shifts/{id}/complete"
    algorithm: chronological
    formula: |
      week(shifts) = ISO week (Monday 00:00 - Sunday 24:00) containing shift_date.
      candidate set = all LaborShifts with the same staff_ref, same ISO week, status == COMPLETED,
        PLUS the shift just completed.
      evaluation order (PINNED): shift_date ASC, then start_minute ASC, then created_at ASC.
      Walk the ordered list with running_total_minutes = 0:
        for each shift: regular_part = max(0, min(worked_minutes, WEEKLY_OT_THRESHOLD_MINUTES - running_total_minutes))
                        overtime_part = worked_minutes - regular_part
                        running_total_minutes += worked_minutes
      Boundary: a shift that brings running_total_minutes to EXACTLY 2400 contributes 0 overtime minutes;
        only minutes strictly beyond 2400 are overtime.
      regular_pay_cents  = round_half_up(regular_minutes  * hourly_rate_cents / 60)
      overtime_pay_cents = round_half_up(overtime_minutes * hourly_rate_cents * OT_MULTIPLIER / 60)
      Because completion order may differ from chronological order, the just-completed shift is
      re-scored against the full week; earlier COMPLETED shifts are NOT retroactively adjusted
      (their stored split is frozen at their own completion time).
    input_set: "COMPLETED LaborShifts of the same staff_ref in the same ISO week"
    constants:
      WEEKLY_OT_THRESHOLD_MINUTES: 2400
      OT_MULTIPLIER: 1.5
    precision: "integer cents; round_half_up"

  - name: inspection_scoring
    trigger: "POST /inspection-reports/{id}/submit"
    algorithm: threshold
    formula: |
      demerits = sum over violations: CRITICAL -> 25, MAJOR -> 10, MINOR -> 3
      score = max(0, 100 - demerits)
      outcome: if any violation.severity == CRITICAL -> FAIL (regardless of score)
               else if score >= PASS_THRESHOLD -> PASS        [boundary: exactly 70 is PASS]
               else if score >= CONDITIONAL_THRESHOLD -> CONDITIONAL   [40..69]
               else FAIL
    input_set: "violations array of the report"
    constants:
      DEMERIT_CRITICAL: 25
      DEMERIT_MAJOR: 10
      DEMERIT_MINOR: 3
      PASS_THRESHOLD: 70
      CONDITIONAL_THRESHOLD: 40
    precision: "integer score"

  - name: sustainability_metrics
    trigger: "POST /waste-logs/{id}/post (recompute parent period); POST /waste-logs/{id}/reject does NOT recompute (only POSTED rows count and reject does not change the POSTED set)"
    algorithm: aggregation
    formula: |
      posted = WasteLogs with meal_period_id == period and status == POSTED
      posted_waste_kg  = sum(weight_kg over posted)
      landfill_waste_kg = sum(weight_kg over posted with disposition == LANDFILL)
      diverted_kg = sum(weight_kg over posted with disposition in {COMPOST, DONATION})
      diversion_rate = diverted_kg / posted_waste_kg; null when posted_waste_kg == 0
      waste_per_cover = landfill_waste_kg / actual_covers; when actual_covers == 0 the ratio is undefined
      sustainability_alert = true iff actual_covers > 0 AND waste_per_cover > ALERT_THRESHOLD_KG
        [boundary: exactly 0.15 is NOT an alert; strictly greater required]
    input_set: "POSTED WasteLogs of the period only (RECORDED/VERIFIED excluded)"
    constants:
      ALERT_THRESHOLD_KG: 0.15
    precision: "2 decimal places for *_kg fields, round_half_up; diversion_rate 4 decimal places"

  - name: department_budget_ledger
    trigger: "catering submit / approve / reject / pay / cancel transitions"
    algorithm: aggregation
    formula: |
      reserved_cents  = sum(quoted_total_cents) over own orders with approval_status == SUBMITTED
      committed_cents = sum(quoted_total_cents) over own orders with approval_status == APPROVED
                          and fulfillment_status in {NONE, SCHEDULED, FULFILLED, INVOICED}
      spent_cents     = sum(final_total_cents) over own orders with fulfillment_status == PAID
                          + sum(cancellation_fee_cents) over own cancelled orders that incurred a fee
      available_cents = semester_budget_cents - reserved_cents - committed_cents - spent_cents
      INVARIANT INV-1: available_cents + reserved_cents + committed_cents + spent_cents == semester_budget_cents
        at all times; the submit/reject pair and approve/cancel-with-fee pair conserve the total exactly.
    input_set: "CateringOrders with department_id == this Department"
    constants: {}
    precision: "integer cents"

  - name: meal_period_reconciliation
    trigger: "POST /meal-periods/{id}/reconcile"
    algorithm: aggregation
    formula: |
      actual_board_swipes = count of SwipeEvents with meal_period_id == period and entry_type == BOARD_SWIPE
      actual_retail_sales_cents = sum(amount_cents) over RETAIL_SALE events
      actual_covers = actual_board_swipes + count of RETAIL_SALE events
      forecast_variance_pct = (actual_covers - forecasted_covers) / forecasted_covers * 100;
        null when forecasted_covers == 0 (division-by-zero rule)
    input_set: "SwipeEvents of the period (all of them; period must be IN_SERVICE to accept swipes)"
    constants: {}
    precision: "forecast_variance_pct 2 decimal places, round_half_up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority — lower number wins on dual failure)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared role names; X-User-ID present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is listed in the endpoint's roles; ownership: when role == DepartmentUser, X-User-ID must equal the target CateringOrder.department_id (or the request body's department_id on create) — a DepartmentUser acting for another department is rejected here"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids resolve left-to-right, then body FK fields in declared input order (dining_hall_id before menu_cycle_id before recipe_id; department_id before revised_from_id; etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "Target entity is in a from-state listed for the transition (else ERR_INVALID_STATE). Cross-entity state gates also live here: ERR_HALL_SUSPENDED (hall not ACTIVE), ERR_CONTRACT_NOT_ACTIVE (contract not ACTIVE), ERR_FORECAST_LOCKED_PERIOD (period no longer SCHEDULED), ERR_PENDING_WASTE_LOGS (period close with RECORDED/VERIFIED waste), ERR_INSPECTION_INCOMPLETE (close with non-VERIFIED actions). OCC: after from-state validation, expected_<parent>_version must equal the parent's current version (else ERR_STALE_VERSION)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: business_safety
    check: "Segregation of duties: on POST /waste-logs/{id}/verify, X-User-ID must differ from the log's recorded_by_user_id — even when the verifier's role is otherwise allowed"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /waste-logs/{id}/verify"]
  - priority: 6
    category: business_safety
    check: "Food-safety gates: menu-cycle publish and recipe reinstate require allergen_reviewed == true on every ACTIVE recipe (ERR_ALLERGEN_UNDECLARED); accommodation approve requires a suitable ACTIVE recipe (ERR_NO_SUITABLE_MENU); catering approve and hall reactivate are blocked while any CRITICAL CorrectiveAction is OPEN/OVERDUE at the hall (ERR_CRITICAL_VIOLATION_OPEN)"
    error_id: ERR_ALLERGEN_UNDECLARED
    http_status: 422
    applies_to: ["POST /menu-cycles/{id}/publish", "POST /recipes/{id}/reinstate", "POST /accommodation-requests/{id}/approve", "POST /catering-orders/{id}/approve", "POST /dining-halls/{id}/reactivate"]
  - priority: 7
    category: business_constraint
    check: "Structural conflicts: PUBLISHED menu-cycle half-open interval overlap (ERR_CYCLE_OVERLAP); staff shift half-open overlap (ERR_SHIFT_OVERLAP); catering slot aggregate capacity (ERR_CATERING_CAPACITY_EXCEEDED); second ACTIVE contract per hall (ERR_DUPLICATE_ACTIVE_CONTRACT); second DRAFT forecast for the same (meal_period_id, recipe_id) (ERR_DUPLICATE_FORECAST); second statement for the same (vendor_contract_id, period_month) (ERR_DUPLICATE_STATEMENT)"
    error_id: ERR_CYCLE_OVERLAP
    http_status: 409
    applies_to: ["POST /menu-cycles/{id}/publish", "POST /labor-shifts", "POST /labor-shifts/{id}/assign", "POST /catering-orders/{id}/approve", "POST /vendor-contracts/{id}/activate", "POST /meal-periods/{id}/forecasts", "POST /vendor-contracts/{id}/commission-statements"]
  - priority: 8
    category: business_temporal
    check: "Time-based rules against the logical clock: catering submit lead time >= 48h before slot start (ERR_LEAD_TIME_VIOLATION); staff rest buffer >= 480 min between shifts (ERR_REST_PERIOD_VIOLATION); waste recording only while period IN_SERVICE/RECONCILED, ERR_WASTE_WINDOW_CLOSED once CLOSED; TREND forecast with < 2 historical occurrences (ERR_INSUFFICIENT_HISTORY)"
    error_id: ERR_LEAD_TIME_VIOLATION
    http_status: 422
    applies_to: ["POST /catering-orders/{id}/submit", "POST /labor-shifts", "POST /labor-shifts/{id}/assign", "POST /meal-periods/{id}/waste-logs", "POST /meal-periods/{id}/forecasts"]
  - priority: 9
    category: business_fiscal
    check: "Money last: catering submit requires Department.available_cents >= quoted_total_cents (exact equality allowed)"
    error_id: ERR_INSUFFICIENT_BUDGET
    http_status: 402
    applies_to: ["POST /catering-orders/{id}/submit"]
  - priority: 10
    category: business_constraint
    check: "Field-shape rules evaluated when no earlier rule failed: required fields present, enum values in range, date interval start < end, swipe amount_cents conditional on entry_type, worked_minutes within [1, scheduled+60], invoice final_total_cents within [80%, 120%] of quoted (bounds inclusive). NOTE: malformed-field rejection uses ERR_VALIDATION and is reported only after all higher-priority business checks pass for the affected resource — except auth/existence which always precede."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

# =============================================================================
# 1.5 API Endpoint Table
# List GETs all support limit?/offset? per response_envelope pagination defaults.
# =============================================================================
endpoints:
  # ---- DiningHall ----
  - { method: POST, path: "/dining-halls", description: "Create a dining hall", roles: [DiningAdmin], code: 201, input: [name, service_model, dining_capacity, catering_kitchen_capacity], output: DiningHall, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/dining-halls", description: "List dining halls", roles: [DiningAdmin, HallManager, KitchenLead, Dietitian, HealthInspector, ContractManager, DepartmentUser], code: 200, input: ["status?", "limit?", "offset?"], output: "DiningHall[]", side_effects: [] }
  - { method: GET, path: "/dining-halls/{id}", description: "Get one dining hall", roles: [DiningAdmin, HallManager, KitchenLead, Dietitian, HealthInspector, ContractManager, DepartmentUser], code: 200, input: [], output: DiningHall, side_effects: [] }
  - { method: POST, path: "/dining-halls/{id}/suspend", description: "Suspend a hall; cancels its SCHEDULED meal periods", roles: [DiningAdmin], code: 200, input: [], output: DiningHall, side_effects: ["MealPeriodService SCHEDULED -> CANCELLED cascade", "increments DiningHall.version by 1"] }
  - { method: POST, path: "/dining-halls/{id}/reactivate", description: "Reactivate a suspended hall; blocked by open CRITICAL corrective actions", roles: [DiningAdmin], code: 200, input: [], output: DiningHall, side_effects: ["increments DiningHall.version by 1"] }

  # ---- VendorContract ----
  - { method: POST, path: "/vendor-contracts", description: "Create a vendor contract in NEGOTIATION", roles: [DiningAdmin], code: 201, input: [dining_hall_id, vendor_name, board_rate_per_cover_cents, retail_commission_bps, catering_commission_bps, minimum_monthly_guarantee_cents, effective_start_date, effective_end_date], output: VendorContract, side_effects: [] }
  - { method: GET, path: "/vendor-contracts", description: "List contracts (FK reverse-reachability for VendorContract.dining_hall_id)", roles: [DiningAdmin, HallManager, KitchenLead, Dietitian, HealthInspector, ContractManager, DepartmentUser], code: 200, input: ["dining_hall_id?", "status?", "limit?", "offset?"], output: "VendorContract[]", side_effects: [] }
  - { method: GET, path: "/vendor-contracts/{id}", description: "Get one contract", roles: [DiningAdmin, HallManager, KitchenLead, Dietitian, HealthInspector, ContractManager, DepartmentUser], code: 200, input: [], output: VendorContract, side_effects: [] }
  - { method: POST, path: "/vendor-contracts/{id}/activate", description: "Activate a contract; at most one ACTIVE per hall", roles: [ContractManager], code: 200, input: [], output: VendorContract, side_effects: ["increments VendorContract.version by 1"] }
  - { method: POST, path: "/vendor-contracts/{id}/terminate", description: "Terminate an ACTIVE contract", roles: [ContractManager], code: 200, input: [], output: VendorContract, side_effects: ["increments VendorContract.version by 1"] }

  # ---- MenuCycle ----
  - { method: POST, path: "/menu-cycles", description: "Create a menu cycle in DRAFT", roles: [DiningAdmin], code: 201, input: [dining_hall_id, name, cycle_length_weeks, start_date, end_date], output: MenuCycle, side_effects: [] }
  - { method: GET, path: "/menu-cycles", description: "List menu cycles (FK reverse-reachability)", roles: [DiningAdmin, HallManager, KitchenLead, Dietitian, HealthInspector, ContractManager, DepartmentUser], code: 200, input: ["dining_hall_id?", "status?", "limit?", "offset?"], output: "MenuCycle[]", side_effects: [] }
  - { method: GET, path: "/menu-cycles/{id}", description: "Get one menu cycle", roles: [DiningAdmin, HallManager, KitchenLead, Dietitian, HealthInspector, ContractManager, DepartmentUser], code: 200, input: [], output: MenuCycle, side_effects: [] }
  - { method: POST, path: "/menu-cycles/{id}/publish", description: "Publish a cycle; allergen-review gate + half-open overlap check", roles: [DiningAdmin], code: 200, input: [], output: MenuCycle, side_effects: ["increments MenuCycle.version by 1"] }
  - { method: POST, path: "/menu-cycles/{id}/archive", description: "Archive a DRAFT or PUBLISHED cycle", roles: [DiningAdmin], code: 200, input: [], output: MenuCycle, side_effects: ["increments MenuCycle.version by 1"] }

  # ---- Recipe ----
  - { method: POST, path: "/recipes", description: "Create a recipe (ACTIVE; allergen_reviewed defaults false)", roles: [KitchenLead], code: 201, input: [dining_hall_id, name, station, allergen_tags, dietary_flags, popularity_share, unit_cost_cents, "allergen_reviewed?"], output: Recipe, side_effects: [] }
  - { method: GET, path: "/recipes", description: "List recipes (FK reverse-reachability)", roles: [DiningAdmin, HallManager, KitchenLead, Dietitian, HealthInspector, ContractManager, DepartmentUser], code: 200, input: ["dining_hall_id?", "station?", "status?", "limit?", "offset?"], output: "Recipe[]", side_effects: [] }
  - { method: GET, path: "/recipes/{id}", description: "Get one recipe", roles: [DiningAdmin, HallManager, KitchenLead, Dietitian, HealthInspector, ContractManager, DepartmentUser], code: 200, input: [], output: Recipe, side_effects: [] }
  - { method: PATCH, path: "/recipes/{id}", description: "Re-label / re-cost a recipe", roles: [KitchenLead], code: 200, input: ["name?", "station?", "allergen_tags?", "dietary_flags?", "popularity_share?", "unit_cost_cents?", "allergen_reviewed?"], output: Recipe, side_effects: ["increments Recipe.version by 1"] }
  - { method: POST, path: "/recipes/{id}/suspend", description: "Suspend a recipe (allergen audit)", roles: [DiningAdmin], code: 200, input: [], output: Recipe, side_effects: ["increments Recipe.version by 1"] }
  - { method: POST, path: "/recipes/{id}/reinstate", description: "Reinstate a suspended recipe; requires allergen_reviewed == true", roles: [DiningAdmin], code: 200, input: [], output: Recipe, side_effects: ["increments Recipe.version by 1"] }

  # ---- MealPeriodService ----
  - { method: POST, path: "/meal-periods", description: "Schedule a meal period; menu cycle must be PUBLISHED and cover service_date", roles: [HallManager], code: 201, input: [dining_hall_id, menu_cycle_id, service_date, meal_period], output: MealPeriodService, side_effects: ["status=SCHEDULED"] }
  - { method: GET, path: "/meal-periods", description: "List meal periods (FK reverse-reachability for dining_hall_id and menu_cycle_id)", roles: [DiningAdmin, HallManager, KitchenLead, Dietitian, HealthInspector, ContractManager, DepartmentUser], code: 200, input: ["dining_hall_id?", "menu_cycle_id?", "service_date?", "meal_period?", "status?", "limit?", "offset?"], output: "MealPeriodService[]", side_effects: [] }
  - { method: GET, path: "/meal-periods/{id}", description: "Get one meal period (incl. version for OCC)", roles: [DiningAdmin, HallManager, KitchenLead, Dietitian, HealthInspector, ContractManager, DepartmentUser], code: 200, input: [], output: MealPeriodService, side_effects: [] }
  - { method: POST, path: "/meal-periods/{id}/lock-forecast", description: "SCHEDULED -> FORECAST_LOCKED; stores forecasted_covers via C1 BASE", roles: [HallManager], code: 200, input: [], output: MealPeriodService, side_effects: ["computes forecasted_covers (C1 BASE)", "increments MealPeriodService.version by 1"] }
  - { method: POST, path: "/meal-periods/{id}/open-service", description: "FORECAST_LOCKED -> IN_SERVICE; requires hall ACTIVE", roles: [HallManager], code: 200, input: [], output: MealPeriodService, side_effects: ["increments MealPeriodService.version by 1"] }
  - { method: POST, path: "/meal-periods/{id}/reconcile", description: "IN_SERVICE -> RECONCILED; runs C8", roles: [HallManager], code: 200, input: [], output: MealPeriodService, side_effects: ["computes actual_* and forecast_variance_pct (C8)", "increments MealPeriodService.version by 1"] }
  - { method: POST, path: "/meal-periods/{id}/close", description: "RECONCILED -> CLOSED; requires no unposted waste", roles: [DiningAdmin], code: 200, input: [], output: MealPeriodService, side_effects: ["increments MealPeriodService.version by 1"] }

  # ---- SwipeEvent ----
  - { method: POST, path: "/meal-periods/{id}/swipes", description: "Bulk-ingest swipe/sale events; events[] elements {entry_type, amount_cents, count?}; all-or-nothing: any invalid element rejects the whole batch with ERR_VALIDATION; period must be IN_SERVICE", roles: [HallManager], code: 201, input: [events], output: "SwipeEvent[]", side_effects: ["creates count-expanded SwipeEvent rows in array order"] }
  - { method: GET, path: "/swipe-events", description: "List swipe events (FK reverse-reachability for meal_period_id)", roles: [DiningAdmin, HallManager, KitchenLead, Dietitian, HealthInspector, ContractManager, DepartmentUser], code: 200, input: ["meal_period_id?", "entry_type?", "limit?", "offset?"], output: "SwipeEvent[]", side_effects: [] }
  - { method: GET, path: "/swipe-events/{id}", description: "Get one swipe event", roles: [DiningAdmin, HallManager, KitchenLead, Dietitian, HealthInspector, ContractManager, DepartmentUser], code: 200, input: [], output: SwipeEvent, side_effects: [] }

  # ---- ProductionForecast ----
  - { method: POST, path: "/meal-periods/{id}/forecasts", description: "Create a forecast for one recipe on a SCHEDULED period; OCC-guarded; supersedes the pair's LOCKED forecast", roles: [KitchenLead], code: 201, input: [recipe_id, variant, expected_meal_period_version], output: ProductionForecast, side_effects: ["computes forecasted_portions (C1)", "supersedes prior LOCKED forecast for same (meal_period_id, recipe_id)", "increments MealPeriodService.version by 1"] }
  - { method: GET, path: "/production-forecasts", description: "List forecasts (FK reverse-reachability)", roles: [DiningAdmin, HallManager, KitchenLead, Dietitian, HealthInspector, ContractManager, DepartmentUser], code: 200, input: ["meal_period_id?", "recipe_id?", "status?", "variant?", "limit?", "offset?"], output: "ProductionForecast[]", side_effects: [] }
  - { method: GET, path: "/production-forecasts/{id}", description: "Get one forecast", roles: [DiningAdmin, HallManager, KitchenLead, Dietitian, HealthInspector, ContractManager, DepartmentUser], code: 200, input: [], output: ProductionForecast, side_effects: [] }
  - { method: POST, path: "/production-forecasts/{id}/lock", description: "DRAFT -> LOCKED; period must still be SCHEDULED", roles: [KitchenLead], code: 200, input: [], output: ProductionForecast, side_effects: ["increments ProductionForecast.version by 1"] }

  # ---- AccommodationRequest ----
  - { method: POST, path: "/accommodation-requests", description: "File a special-diet accommodation request", roles: [HallManager], code: 201, input: [dining_hall_id, student_ref, allergen_exclusions, dietary_requirement], output: AccommodationRequest, side_effects: ["status=SUBMITTED"] }
  - { method: GET, path: "/accommodation-requests", description: "List accommodation requests (FK reverse-reachability)", roles: [DiningAdmin, HallManager, KitchenLead, Dietitian, HealthInspector, ContractManager, DepartmentUser], code: 200, input: ["dining_hall_id?", "status?", "student_ref?", "limit?", "offset?"], output: "AccommodationRequest[]", side_effects: [] }
  - { method: GET, path: "/accommodation-requests/{id}", description: "Get one accommodation request", roles: [DiningAdmin, HallManager, KitchenLead, Dietitian, HealthInspector, ContractManager, DepartmentUser], code: 200, input: [], output: AccommodationRequest, side_effects: [] }
  - { method: POST, path: "/accommodation-requests/{id}/start-review", description: "SUBMITTED -> NUTRITION_REVIEW", roles: [Dietitian], code: 200, input: [], output: AccommodationRequest, side_effects: ["increments AccommodationRequest.version by 1"] }
  - { method: POST, path: "/accommodation-requests/{id}/request-info", description: "NUTRITION_REVIEW -> SUBMITTED (cycle)", roles: [Dietitian], code: 200, input: [review_notes], output: AccommodationRequest, side_effects: ["stores review_notes", "increments AccommodationRequest.version by 1"] }
  - { method: POST, path: "/accommodation-requests/{id}/approve", description: "NUTRITION_REVIEW -> APPROVED; suitable-menu safety gate", roles: [Dietitian], code: 200, input: [], output: AccommodationRequest, side_effects: ["increments AccommodationRequest.version by 1"] }
  - { method: POST, path: "/accommodation-requests/{id}/activate", description: "APPROVED -> ACTIVE", roles: [KitchenLead], code: 200, input: [], output: AccommodationRequest, side_effects: ["increments AccommodationRequest.version by 1"] }
  - { method: POST, path: "/accommodation-requests/{id}/cancel", description: "Cancel from any non-terminal state", roles: [HallManager, Dietitian], code: 200, input: [], output: AccommodationRequest, side_effects: ["increments AccommodationRequest.version by 1"] }

  # ---- LaborShift ----
  - { method: POST, path: "/labor-shifts", description: "Create a shift; staff_ref optional (PLANNED without it); overlap + rest checks run when staff_ref present", roles: [HallManager], code: 201, input: [dining_hall_id, "staff_ref?", role, shift_date, start_minute, end_minute, hourly_rate_cents], output: LaborShift, side_effects: [] }
  - { method: GET, path: "/labor-shifts", description: "List shifts (FK reverse-reachability for dining_hall_id; staff_ref filter)", roles: [DiningAdmin, HallManager, KitchenLead, Dietitian, HealthInspector, ContractManager, DepartmentUser], code: 200, input: ["dining_hall_id?", "staff_ref?", "shift_date?", "status?", "limit?", "offset?"], output: "LaborShift[]", side_effects: [] }
  - { method: GET, path: "/labor-shifts/{id}", description: "Get one shift", roles: [DiningAdmin, HallManager, KitchenLead, Dietitian, HealthInspector, ContractManager, DepartmentUser], code: 200, input: [], output: LaborShift, side_effects: [] }
  - { method: POST, path: "/labor-shifts/{id}/assign", description: "PLANNED -> ASSIGNED with overlap + rest checks", roles: [HallManager], code: 200, input: [staff_ref], output: LaborShift, side_effects: ["increments LaborShift.version by 1"] }
  - { method: POST, path: "/labor-shifts/{id}/confirm", description: "ASSIGNED -> CONFIRMED; requires hall ACTIVE", roles: [HallManager], code: 200, input: [], output: LaborShift, side_effects: ["increments LaborShift.version by 1"] }
  - { method: POST, path: "/labor-shifts/{id}/complete", description: "CONFIRMED -> COMPLETED; runs C4 weekly overtime allocation", roles: [HallManager], code: 200, input: [worked_minutes], output: LaborShift, side_effects: ["computes regular/overtime minutes and pay (C4)", "increments LaborShift.version by 1"] }
  - { method: POST, path: "/labor-shifts/{id}/mark-no-show", description: "CONFIRMED -> NO_SHOW", roles: [HallManager], code: 200, input: [], output: LaborShift, side_effects: ["increments LaborShift.version by 1"] }

  # ---- WasteLog ----
  - { method: POST, path: "/meal-periods/{id}/waste-logs", description: "Record a waste log; period must be IN_SERVICE or RECONCILED (CLOSED -> ERR_WASTE_WINDOW_CLOSED)", roles: [KitchenLead], code: 201, input: [category, disposition, weight_kg], output: WasteLog, side_effects: ["sets recorded_by_user_id from X-User-ID", "status=RECORDED"] }
  - { method: GET, path: "/waste-logs", description: "List waste logs (FK reverse-reachability)", roles: [DiningAdmin, HallManager, KitchenLead, Dietitian, HealthInspector, ContractManager, DepartmentUser], code: 200, input: ["meal_period_id?", "status?", "category?", "disposition?", "limit?", "offset?"], output: "WasteLog[]", side_effects: [] }
  - { method: GET, path: "/waste-logs/{id}", description: "Get one waste log", roles: [DiningAdmin, HallManager, KitchenLead, Dietitian, HealthInspector, ContractManager, DepartmentUser], code: 200, input: [], output: WasteLog, side_effects: [] }
  - { method: POST, path: "/waste-logs/{id}/verify", description: "RECORDED -> VERIFIED; segregation of duties vs recorder", roles: [HallManager], code: 200, input: [], output: WasteLog, side_effects: ["sets verified_by_user_id", "increments WasteLog.version by 1"] }
  - { method: POST, path: "/waste-logs/{id}/post", description: "VERIFIED -> POSTED; recomputes period waste aggregates + sustainability alert (C6)", roles: [HallManager], code: 200, input: [], output: WasteLog, side_effects: ["recomputes parent MealPeriodService posted_waste_kg, landfill_waste_kg, diversion_rate, sustainability_alert (C6)", "increments MealPeriodService.version by 1", "increments WasteLog.version by 1"] }
  - { method: POST, path: "/waste-logs/{id}/reject", description: "VERIFIED -> RECORDED (cycle); POSTED set unchanged so period aggregates do not drift", roles: [HallManager], code: 200, input: ["reason?"], output: WasteLog, side_effects: ["clears verified_by_user_id", "increments WasteLog.version by 1"] }

  # ---- InspectionReport / CorrectiveAction ----
  - { method: POST, path: "/inspection-reports", description: "File an inspection report in DRAFT", roles: [HealthInspector], code: 201, input: [dining_hall_id, inspection_date, violations], output: InspectionReport, side_effects: ["sets inspector_user_id from X-User-ID"] }
  - { method: GET, path: "/inspection-reports", description: "List inspection reports (FK reverse-reachability)", roles: [DiningAdmin, HallManager, KitchenLead, Dietitian, HealthInspector, ContractManager, DepartmentUser], code: 200, input: ["dining_hall_id?", "status?", "outcome?", "limit?", "offset?"], output: "InspectionReport[]", side_effects: [] }
  - { method: GET, path: "/inspection-reports/{id}", description: "Get one inspection report", roles: [DiningAdmin, HallManager, KitchenLead, Dietitian, HealthInspector, ContractManager, DepartmentUser], code: 200, input: [], output: InspectionReport, side_effects: [] }
  - { method: POST, path: "/inspection-reports/{id}/submit", description: "DRAFT -> SUBMITTED; computes C5, cascade-creates CorrectiveActions, FAIL suspends hall", roles: [HealthInspector], code: 200, input: [], output: InspectionReport, side_effects: ["computes score/outcome (C5)", "creates one CorrectiveAction per violation", "on FAIL: DiningHall -> SUSPENDED and its SCHEDULED periods -> CANCELLED", "increments InspectionReport.version by 1"] }
  - { method: POST, path: "/inspection-reports/{id}/acknowledge", description: "SUBMITTED -> ACKNOWLEDGED", roles: [HallManager], code: 200, input: [], output: InspectionReport, side_effects: ["increments InspectionReport.version by 1"] }
  - { method: POST, path: "/inspection-reports/{id}/close", description: "ACKNOWLEDGED -> CLOSED; all corrective actions must be VERIFIED", roles: [HealthInspector], code: 200, input: [], output: InspectionReport, side_effects: ["increments InspectionReport.version by 1"] }
  - { method: POST, path: "/inspection-reports/{id}/corrective-actions", description: "Add an extra corrective action to a SUBMITTED or ACKNOWLEDGED report", roles: [HealthInspector], code: 201, input: [violation_code, severity, due_date], output: CorrectiveAction, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/corrective-actions", description: "List corrective actions (FK reverse-reachability)", roles: [DiningAdmin, HallManager, KitchenLead, Dietitian, HealthInspector, ContractManager, DepartmentUser], code: 200, input: ["inspection_report_id?", "status?", "severity?", "limit?", "offset?"], output: "CorrectiveAction[]", side_effects: [] }
  - { method: GET, path: "/corrective-actions/{id}", description: "Get one corrective action", roles: [DiningAdmin, HallManager, KitchenLead, Dietitian, HealthInspector, ContractManager, DepartmentUser], code: 200, input: [], output: CorrectiveAction, side_effects: [] }
  - { method: POST, path: "/corrective-actions/{id}/resolve", description: "OPEN|OVERDUE -> RESOLVED", roles: [HallManager], code: 200, input: [], output: CorrectiveAction, side_effects: ["sets resolved_by_user_id", "increments CorrectiveAction.version by 1"] }
  - { method: POST, path: "/corrective-actions/{id}/verify", description: "RESOLVED -> VERIFIED; parent report must be ACKNOWLEDGED", roles: [HealthInspector], code: 200, input: [], output: CorrectiveAction, side_effects: ["sets verified_by_user_id", "increments CorrectiveAction.version by 1"] }
  - { method: POST, path: "/corrective-actions/{id}/reopen", description: "RESOLVED -> OPEN (cycle); CRITICAL reopen re-suspends the hall", roles: [HealthInspector], code: 200, input: [], output: CorrectiveAction, side_effects: ["clears resolved_by_user_id", "on CRITICAL with ACTIVE hall: DiningHall -> SUSPENDED and its SCHEDULED periods -> CANCELLED", "increments CorrectiveAction.version by 1"] }

  # ---- Department / CateringOrder ----
  - { method: POST, path: "/departments", description: "Create a campus department with its semester budget", roles: [DiningAdmin], code: 201, input: [name, department_code, semester_budget_cents], output: Department, side_effects: ["computed budget buckets start at 0; available_cents = semester_budget_cents"] }
  - { method: GET, path: "/departments/{id}", description: "Get one department incl. computed budget ledger (DepartmentUser: own id only)", roles: [DiningAdmin, HallManager, ContractManager, DepartmentUser], code: 200, input: [], output: Department, side_effects: [] }
  - { method: POST, path: "/catering-orders", description: "Create a catering order in DRAFT/NONE; computes C2 quote; DepartmentUser may only use own department_id", roles: [DepartmentUser], code: 201, input: [dining_hall_id, department_id, event_date, time_slot, guaranteed_covers, menu_lines, "dietary_plates?", "revised_from_id?"], output: CateringOrder, side_effects: ["computes quoted_total_cents (C2)"] }
  - { method: GET, path: "/catering-orders", description: "List catering orders (FK reverse-reachability for dining_hall_id, department_id, revised_from_id)", roles: [DiningAdmin, HallManager, KitchenLead, Dietitian, HealthInspector, ContractManager, DepartmentUser], code: 200, input: ["dining_hall_id?", "department_id?", "approval_status?", "fulfillment_status?", "revised_from_id?", "limit?", "offset?"], output: "CateringOrder[]", side_effects: [] }
  - { method: GET, path: "/catering-orders/{id}", description: "Get one catering order", roles: [DiningAdmin, HallManager, KitchenLead, Dietitian, HealthInspector, ContractManager, DepartmentUser], code: 200, input: [], output: CateringOrder, side_effects: [] }
  - { method: POST, path: "/catering-orders/{id}/submit", description: "DRAFT|REJECTED -> SUBMITTED; hall-gate, 48h lead time, budget reservation", roles: [DepartmentUser], code: 200, input: [], output: CateringOrder, side_effects: ["Department.reserved_cents += quoted_total_cents (C7)", "increments Department.version by 1", "increments CateringOrder.version by 1"] }
  - { method: POST, path: "/catering-orders/{id}/approve", description: "SUBMITTED -> APPROVED; OCC on Department, critical-violation gate, slot capacity check", roles: [HallManager], code: 200, input: [expected_department_version], output: CateringOrder, side_effects: ["Department.reserved_cents -> committed_cents (C7)", "increments Department.version by 1", "increments CateringOrder.version by 1"] }
  - { method: POST, path: "/catering-orders/{id}/reject", description: "SUBMITTED -> REJECTED; releases the reservation (compensating action)", roles: [HallManager], code: 200, input: ["reason?"], output: CateringOrder, side_effects: ["Department.reserved_cents -= quoted_total_cents", "increments Department.version by 1", "increments CateringOrder.version by 1"] }
  - { method: POST, path: "/catering-orders/{id}/schedule", description: "fulfillment NONE -> SCHEDULED (approval must be APPROVED)", roles: [HallManager], code: 200, input: [], output: CateringOrder, side_effects: ["increments CateringOrder.version by 1"] }
  - { method: POST, path: "/catering-orders/{id}/fulfill", description: "fulfillment SCHEDULED -> FULFILLED", roles: [KitchenLead], code: 200, input: [], output: CateringOrder, side_effects: ["increments CateringOrder.version by 1"] }
  - { method: POST, path: "/catering-orders/{id}/invoice", description: "fulfillment FULFILLED -> INVOICED; final_total within [80%,120%] of quoted", roles: [HallManager], code: 200, input: [final_total_cents], output: CateringOrder, side_effects: ["stores final_total_cents", "increments CateringOrder.version by 1"] }
  - { method: POST, path: "/catering-orders/{id}/pay", description: "fulfillment INVOICED -> PAID; settles committed into spent at final_total", roles: [DiningAdmin], code: 200, input: [], output: CateringOrder, side_effects: ["Department.committed_cents -= quoted_total_cents; spent_cents += final_total_cents (C7)", "increments Department.version by 1", "increments CateringOrder.version by 1"] }
  - { method: POST, path: "/catering-orders/{id}/cancel", description: "Cancel from DRAFT/SUBMITTED (free) or APPROVED with fulfillment NONE|SCHEDULED (fee 10% if >=72h before event else 25%)", roles: [DepartmentUser, HallManager], code: 200, input: [], output: CateringOrder, side_effects: ["releases reservation or commitment per C7", "charges cancellation_fee_cents to spent_cents when APPROVED", "increments Department.version by 1 when a reservation/commitment existed", "increments CateringOrder.version by 1"] }

  # ---- CommissionStatement ----
  - { method: POST, path: "/vendor-contracts/{id}/commission-statements", description: "Generate the PROVISIONAL commission statement for a period_month; contract must be ACTIVE; unique (contract, period_month)", roles: [DiningAdmin], code: 201, input: [period_month], output: CommissionStatement, side_effects: ["computes all monetary fields under PROVISIONAL variant (C3)", "pins provisional_total_due_cents"] }
  - { method: GET, path: "/commission-statements", description: "List commission statements (FK reverse-reachability)", roles: [DiningAdmin, HallManager, KitchenLead, Dietitian, HealthInspector, ContractManager, DepartmentUser], code: 200, input: ["vendor_contract_id?", "period_month?", "status?", "limit?", "offset?"], output: "CommissionStatement[]", side_effects: [] }
  - { method: GET, path: "/commission-statements/{id}", description: "Get one commission statement", roles: [DiningAdmin, HallManager, KitchenLead, Dietitian, HealthInspector, ContractManager, DepartmentUser], code: 200, input: [], output: CommissionStatement, side_effects: [] }
  - { method: POST, path: "/commission-statements/{id}/finalize", description: "PROVISIONAL -> FINALIZED; recomputes under FINAL variant; contract must be ACTIVE", roles: [ContractManager], code: 200, input: [], output: CommissionStatement, side_effects: ["recomputes monetary fields under FINAL variant (C3)", "sets finalized_at", "increments CommissionStatement.version by 1"] }
  - { method: POST, path: "/commission-statements/{id}/dispute", description: "FINALIZED -> DISPUTED", roles: [DiningAdmin], code: 200, input: ["reason?"], output: CommissionStatement, side_effects: ["increments CommissionStatement.version by 1"] }
  - { method: POST, path: "/commission-statements/{id}/recompute", description: "DISPUTED -> PROVISIONAL (cycle); recomputes PROVISIONAL variant", roles: [DiningAdmin], code: 200, input: [], output: CommissionStatement, side_effects: ["recomputes monetary fields under PROVISIONAL variant (C3)", "clears finalized_at", "increments CommissionStatement.version by 1"] }

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server default before any call is exactly 2026-08-01T00:00:00Z (never the wall clock). Setting the clock runs the ops sweep: ACTIVE VendorContracts with effective_end_date <= now become EXPIRED; OPEN CorrectiveActions with due_date < now become OVERDUE."
    roles: [DiningAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, expired_contract_ids: "string[]", overdue_corrective_action_ids: "string[]" }
    side_effects: ["contract expiry sweep", "corrective-action overdue sweep"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/blank X-User-Role or X-User-ID, or unrecognized role name" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not in the endpoint's roles, or DepartmentUser acting on another department's resource (checked before existence)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not resolve" }
  - { id: ERR_VALIDATION, http: 400, condition: "Required field missing, enum out of range, interval start >= end, swipe amount violates entry_type rule, worked_minutes out of range, or invoice final_total outside [80%,120%] of quoted" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity not in a from-state allowed for the transition (includes terminal-state lockdown and missing-prerequisite-forecast gates)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_HALL_SUSPENDED, http: 409, condition: "Operation requires the parent DiningHall to be ACTIVE (open-service, shift confirm, catering submit)" }
  - { id: ERR_CYCLE_OVERLAP, http: 409, condition: "Publishing would overlap another PUBLISHED cycle at the same hall (half-open intervals; adjacency allowed)" }
  - { id: ERR_ALLERGEN_UNDECLARED, http: 422, condition: "Cycle publish or recipe reinstate with an ACTIVE recipe whose allergen_reviewed is false" }
  - { id: ERR_NO_SUITABLE_MENU, http: 422, condition: "Accommodation approve finds no ACTIVE recipe at the hall whose allergen_tags avoid the exclusions and whose dietary_flags cover the requirement" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "New/assigned shift's half-open interval intersects another shift of the same staff_ref on the same date" }
  - { id: ERR_REST_PERIOD_VIOLATION, http: 422, condition: "Gap between a staff_ref's prior shift end and the new shift start is < 480 minutes (exactly 480 allowed)" }
  - { id: ERR_CATERING_CAPACITY_EXCEEDED, http: 409, condition: "Approving would push the (hall, event_date, time_slot) aggregate guaranteed_covers above catering_kitchen_capacity" }
  - { id: ERR_LEAD_TIME_VIOLATION, http: 422, condition: "Catering submit when logical now is less than 48h before event slot start (exactly 48h allowed)" }
  - { id: ERR_INSUFFICIENT_BUDGET, http: 402, condition: "Catering submit when Department.available_cents < quoted_total_cents" }
  - { id: ERR_INSUFFICIENT_HISTORY, http: 422, condition: "TREND forecast requested with fewer than 2 qualifying historical occurrences" }
  - { id: ERR_FORECAST_LOCKED_PERIOD, http: 409, condition: "Forecast create or lock when the parent period is no longer SCHEDULED" }
  - { id: ERR_DUPLICATE_FORECAST, http: 409, condition: "Creating a forecast for a (meal_period_id, recipe_id) pair that already has a DRAFT forecast" }
  - { id: ERR_WASTE_WINDOW_CLOSED, http: 422, condition: "Recording waste against a CLOSED (or CANCELLED) meal period" }
  - { id: ERR_PENDING_WASTE_LOGS, http: 409, condition: "Closing a period that still has RECORDED or VERIFIED waste logs" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Waste verify attempted by the same X-User-ID that recorded the log" }
  - { id: ERR_CRITICAL_VIOLATION_OPEN, http: 422, condition: "Hall reactivate or catering approve while a CRITICAL corrective action is OPEN/OVERDUE at the hall" }
  - { id: ERR_INSPECTION_INCOMPLETE, http: 409, condition: "Closing an inspection report before every corrective action is VERIFIED" }
  - { id: ERR_DUPLICATE_ACTIVE_CONTRACT, http: 409, condition: "Activating a contract when the hall already has an ACTIVE contract" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Statement creation or finalize when the parent contract is not ACTIVE" }
  - { id: ERR_DUPLICATE_STATEMENT, http: 409, condition: "A statement already exists for the same (vendor_contract_id, period_month)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DiningAdmin
    description: "Vendor-side operations administrator; owns halls, contracts lifecycle data, menu cycles, statements, and the logical clock"
    identity: opaque
    exclusive_operations: ["POST /dining-halls", "POST /dining-halls/{id}/suspend", "POST /dining-halls/{id}/reactivate", "POST /vendor-contracts", "POST /menu-cycles*", "POST /recipes/{id}/suspend|reinstate", "POST /meal-periods/{id}/close", "POST /departments", "POST /catering-orders/{id}/pay", "POST /vendor-contracts/{id}/commission-statements", "POST /commission-statements/{id}/dispute|recompute", "POST /_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
  - name: HallManager
    description: "Runs a dining hall day to day: meal periods, labor, waste verification, catering approval, inspection acknowledgment"
    identity: opaque
    exclusive_operations: ["POST /meal-periods*", "POST /meal-periods/{id}/swipes", "POST /labor-shifts*", "POST /waste-logs/{id}/verify|post|reject", "POST /catering-orders/{id}/approve|reject|schedule|invoice", "POST /inspection-reports/{id}/acknowledge", "POST /corrective-actions/{id}/resolve", "POST /accommodation-requests"]
    shared_operations: ["all GET endpoints", "POST /accommodation-requests/{id}/cancel", "POST /catering-orders/{id}/cancel"]
  - name: KitchenLead
    description: "Production lead: recipes, production forecasts, waste recording, catering fulfillment, accommodation activation"
    identity: opaque
    exclusive_operations: ["POST /recipes", "PATCH /recipes/{id}", "POST /meal-periods/{id}/forecasts", "POST /production-forecasts/{id}/lock", "POST /meal-periods/{id}/waste-logs", "POST /catering-orders/{id}/fulfill", "POST /accommodation-requests/{id}/activate"]
    shared_operations: ["all GET endpoints"]
  - name: Dietitian
    description: "Nutrition specialist; drives the accommodation review loop"
    identity: opaque
    exclusive_operations: ["POST /accommodation-requests/{id}/start-review", "POST /accommodation-requests/{id}/request-info", "POST /accommodation-requests/{id}/approve"]
    shared_operations: ["all GET endpoints", "POST /accommodation-requests/{id}/cancel"]
  - name: HealthInspector
    description: "University EHS inspector; files and submits inspection reports, manages corrective-action verification"
    identity: opaque
    exclusive_operations: ["POST /inspection-reports", "POST /inspection-reports/{id}/submit|close", "POST /inspection-reports/{id}/corrective-actions", "POST /corrective-actions/{id}/verify|reopen"]
    shared_operations: ["all GET endpoints"]
  - name: ContractManager
    description: "University procurement; activates/terminates contracts and finalizes commission statements"
    identity: opaque
    exclusive_operations: ["POST /vendor-contracts/{id}/activate|terminate", "POST /commission-statements/{id}/finalize"]
    shared_operations: ["all GET endpoints", "GET /departments/{id}"]
  - name: DepartmentUser
    description: "Campus department staffer ordering catering; X-User-ID equals the Department id they belong to"
    identity: "entity_backed:Department"
    exclusive_operations: ["POST /catering-orders", "POST /catering-orders/{id}/submit"]
    shared_operations: ["all GET endpoints", "GET /departments/{id} (own id only)", "POST /catering-orders/{id}/cancel (own orders only)"]
