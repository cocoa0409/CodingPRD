            - "assessment_status is still 'ASSESSED' throughout - paying and issuing the certificate never touch the assessment dimension."
            - "Two COLLECTION rows were booked (PARKS 2617930, ROADS 2571591) with vintage_at 2026-05-01T00:00:00Z and deadline_at 2031-05-01T00:00:00Z."

      - name: payment_state_check_runs_before_the_payment_amount_check
        claim_type: cascading
        grounds:
          - validations[priority=26]
          - validations[priority=52]
          - errors.ERR_APPLICATION_INVALID_STATE
          - errors.ERR_PAYMENT_AMOUNT_MISMATCH
        distinguishing_aspect: |
          The amount rule at priority 52 is defined against net_due_cents - paid_cents, so on
          an already PAID application it would compute a target of 0 and report
          ERR_PAYMENT_AMOUNT_MISMATCH for any positive amount. The state check at priority 26
          must run first, so a second payment returns 409 ERR_APPLICATION_INVALID_STATE - and
          the third call proves the amount rule is still alive on a payable application by
          under-paying an unpaid one by a single cent.
        test_recipe:
          setup:
            - "BP-1001 assessed at net 5189521 and paid in full on 2026-05-10, so collection_status is PAID."
            - "BP-1002 assessed at the same net 5189521 and still DUE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-programs"
