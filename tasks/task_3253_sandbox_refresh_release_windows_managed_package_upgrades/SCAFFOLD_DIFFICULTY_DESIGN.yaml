# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — 20 instances across
# the nine §0.5 Difficulty Rules (≥2 per rule). Every `grounds:` reference
# resolves into SCAFFOLD.yaml §1.1–§1.6; every `setup_api_calls:` chain drives
# empty-DB into the described state using only §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: refresh_window_curve_vs_fixed_mode
        grounds:
          - calculations.refresh_window_next_at
          - calculations.refresh_window_next_at.variants.refresh_window_next_at_unrounded
          - entities.Environment.fields.next_refresh_at
          - endpoints.POST_/platform/refresh-jobs/{id}/complete-refresh
        distinguishing_aspect: "Two valid refresh projections over the identical environment row: the pinned scheduled_deferred formula adds `2 * (refresh_generation mod 3)` days while the MANUAL_FIXED variant drops the curve, so the same refresh_generation 2 yields 2026-09-19T00:00:00Z versus 2026-09-15T00:00:00Z."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox exists with refresh_interval_days 7 and no last_refresh_at."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Dev Curve", type: "DEVELOPER", refresh_interval_days: 7, aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_curve_id: $.data.id }
          trigger:
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_curve_id}", partition: "ACCOUNT_PARTIAL", masked_field_count: 3 }
              as: EnvironmentAdmin
              captures: { rj_curve_id: $.data.id }
            - call: "POST /platform/refresh-jobs/${rj_curve_id}/complete-masking"
              payload: {}
              as: EnvironmentAdmin
            - call: "POST /platform/refresh-jobs/${rj_curve_id}/complete-refresh"
              payload: {}
              as: EnvironmentAdmin
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_curve_id}", partition: "ACCOUNT_PARTIAL", masked_field_count: 3 }
              as: EnvironmentAdmin
              captures: { rj_curve_id2: $.data.id }
            - call: "POST /platform/refresh-jobs/${rj_curve_id2}/complete-masking"
              payload: {}
              as: EnvironmentAdmin
            - call: "POST /platform/refresh-jobs/${rj_curve_id2}/complete-refresh"
              payload: {}
              as: EnvironmentAdmin
          assert:
            - "Environment.${env_curve_id}.refresh_generation == 2"
            - "Environment.${env_curve_id}.last_refresh_at == 2026-09-01T00:00:00Z"
            - "Environment.${env_curve_id}.next_refresh_at == 2026-09-19T00:00:00Z"
            - "the refresh_window_next_at_unrounded variant applied to the same row returns 2026-09-15T00:00:00Z, so the two variants differ by exactly 4 days"

      - name: permission_layer_total_before_vs_after_snapshot_dispatch
        grounds:
          - calculations.permission_layer_diagnostics
          - calculations.permission_layer_diagnostics.variants.permission_layer_diagnostics_before
          - calculations.permission_layer_diagnostics.variants.permission_layer_diagnostics_dispatched
          - entities.Environment.fields.permission_layer_total
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "The same environment plus the same grant set yields permission_layer_total 2 before the SNAPSHOT_DISPATCH_AT instant and 4 after it, because the forward_looking variant folds the two ASYNC_BACKLOG_LAYERS in only once the logical clock has reached the dispatch."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, i.e. before SNAPSHOT_DISPATCH_AT 2026-10-05T00:00:00Z. One PARTIAL sandbox with two single-layer operators."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Partial Layers", type: "PARTIAL", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_tot_id: $.data.id }
            - call: "POST /platform/environments/${env_tot_id}/permissions"
              payload: { principal_type: "PROFILE", principal_name: "StandardUser", user_id: "0050a000010001" }
              as: SecurityAuditor
              captures: { pa_one_id: $.data.id }
            - call: "POST /platform/environments/${env_tot_id}/permissions"
              payload: { principal_type: "PROFILE", principal_name: "ReadOnly", user_id: "0050a000010002" }
              as: SecurityAuditor
              captures: { pa_two_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /platform/environments/${env_tot_id}"
              payload: {}
              as: PlatformAdmin
              captures: { total_before: $.data.permission_layer_total }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /platform/environments/${env_tot_id}"
              payload: {}
              as: PlatformAdmin
              captures: { total_after: $.data.permission_layer_total }
          assert:
            - "after the first clock set Environment.${env_tot_id}.permission_layer_total == 2"
            - "after the second clock set Environment.${env_tot_id}.permission_layer_total == 4"
            - "the two reads of the same environment with the same grant set differ by exactly 2"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: governor_depth_max_nonlinear_projection
        grounds:
          - calculations.governor_cost_projection
          - calculations.governor_cost_projection.variants.governor_cost_projection_batch_only
          - entities.GovernorLimitRequest.fields.callout_graph
          - endpoints.POST_/platform/environments/{id}/governor-limit-requests
        distinguishing_aspect: "Mode (a): the projection takes three inputs (scope_count, the reachable cell count and the maximum callout depth) with a non-linear cell-count multiplier, so a deeper graph costs more than a wider one; the batch-only variant collapses the same row to the scope term alone."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox exists."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Gov Depth", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_gov_id: $.data.id }
          trigger:
            - call: "POST /platform/environments/${env_gov_id}/governor-limit-requests"
              payload: { request_kind: "BATCH", scope_count: 5, callout_graph: [{ node: "syncA", calls: ["syncB"] }, { node: "syncB", calls: [] }], max_concurrent_jobs: 5 }
              as: AppDeveloper
              captures: { gov_id: $.data.id }
          assert:
            - "GovernorLimitRequest.${gov_id}.projected_governor_units == 510"
            - "GovernorLimitRequest.${gov_id}.governor_headroom_units == 99490"
            - "the governor_cost_projection_batch_only variant applied to the same row returns 10, so the two variants differ by exactly 500"

      - name: storage_breach_projection_rounding_order
        grounds:
          - calculations.storage_breach_evaluation
          - calculations.storage_breach_evaluation.variants.storage_breach_evaluation_consumed
          - entities.Environment.fields.storage_headroom_bytes
          - endpoints.POST_/platform/environments/{id}/storage/archive
        distinguishing_aspect: "Mode (b): nested evaluation order is pinned — the breach flag is read against storage_used_bytes (= sum of LIVE rows) while the headroom is computed against the conserved storage_total_bytes (= LIVE + ARCHIVED), so archiving an eight-megabyte window flips storage_breach to false while storage_headroom_bytes is unchanged at 83886080."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox with storage_cap_bytes 104857600, three FILE ledgers at rank_index 1 to 3 summing to 104857600 bytes, and release ordinal 5."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Storage Order", type: "DEVELOPER", storage_cap_bytes: 104857600, aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_sto_id: $.data.id }
            - call: "POST /platform/environments/${env_sto_id}/storage-ledgers"
              payload: { kind: "FILE", bytes: 83886080, rank_index: 1 }
              as: StorageArchivist
              captures: { sl_a_id: $.data.id }
            - call: "POST /platform/environments/${env_sto_id}/storage-ledgers"
              payload: { kind: "FILE", bytes: 20971520, rank_index: 2 }
              as: StorageArchivist
              captures: { sl_b_id: $.data.id }
            - call: "POST /platform/environments/${env_sto_id}/storage-ledgers"
              payload: { kind: "FILE", bytes: 8388608, rank_index: 3 }
              as: StorageArchivist
              captures: { sl_c_id: $.data.id }
          trigger:
            - call: "POST /platform/environments/${env_sto_id}/schedule-release"
              payload: { target_release_version: "SU26" }
              as: ReleaseManager
            - call: "POST /platform/environments/${env_sto_id}/apply-release"
              payload: {}
              as: ReleaseManager
            - call: "POST /platform/environments/${env_sto_id}/storage/archive"
              payload: { from_rank: 1, to_rank: 1 }
              as: StorageArchivist
          assert:
            - "before the archive Environment.${env_sto_id}.storage_breach == true"
            - "after the archive Environment.${env_sto_id}.storage_breach == false"
            - "after the archive Environment.${env_sto_id}.storage_used_bytes == 12582912"
            - "after the archive Environment.${env_sto_id}.storage_archived_bytes == 83886080"
            - "after the archive Environment.${env_sto_id}.storage_total_bytes == 96468992 and storage_headroom_bytes == -8388608, both identical to their pre-archive values"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: environment_release_schedule_reopens_after_release
        grounds:
          - state_machines.Environment.RELEASED_to_SCHEDULED
          - state_machines.Environment.RELEASED_to_CONFIG
          - entities.Environment.fields.release_status
          - endpoints.POST_/platform/environments/{id}/open-release-window
        distinguishing_aspect: "The Environment release axis is genuinely cyclic rather than a pipeline: RELEASED -> SCHEDULED re-enters the schedule from the released state, and RELEASED -> CONFIG reopens the release window, so the same row traverses SCHEDULED twice with different scheduled_release_version values."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox, level 1, aperture_limit 5."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Cycle Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_cyc_id: $.data.id }
            - call: "POST /platform/environments/${env_cyc_id}/schedule-release"
              payload: { target_release_version: "SU26" }
              as: ReleaseManager
            - call: "POST /platform/environments/${env_cyc_id}/apply-release"
              payload: {}
              as: ReleaseManager
          trigger:
            - call: "POST /platform/environments/${env_cyc_id}/schedule-release"
              payload: { target_release_version: "WI26" }
              as: ReleaseManager
              captures: { cyc_v: $.data.version }
            - call: "POST /platform/environments/${env_cyc_id}/open-release-window"
              payload: {}
              as: ReleaseManager
          assert:
            - "immediately after apply-release Environment.${env_cyc_id}.release_status == RELEASED and applied_release_version == \"SU26\""
            - "after the reopened schedule Environment.${env_cyc_id}.release_status == SCHEDULED and scheduled_release_version == \"WI26\""
            - "after open-release-window Environment.${env_cyc_id}.release_status == CONFIG and scheduled_release_version is null"
            - "Environment.${env_cyc_id}.applied_release_version remains \"SU26\" through the reopen"

      - name: metadata_change_set_approval_reopen_cycle
        grounds:
          - state_machines.MetadataChangeSet.APPROVED_to_VALIDATED
          - state_machines.MetadataChangeSet.VALIDATED_to_APPROVED
          - entities.MetadataChangeSet.fields.component_digests
          - endpoints.POST_/platform/change-sets/{id}/reopen
        distinguishing_aspect: "The MetadataChangeSet axis returns from APPROVED to VALIDATED and then back to APPROVED, which is a revision loop rather than the forward-only DRAFT→VALIDATED→APPROVED→DEPLOYED pipeline; each APPROVED pass re-pins component_digests."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER source sandbox and one DEVELOPER target sandbox, both level 1."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Rev Source", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_src_id: $.data.id, env_src_v: $.data.version }
            - call: "POST /platform/environments"
              payload: { name: "Rev Target", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_tgt_id: $.data.id, env_tgt_v: $.data.version }
            - call: "POST /platform/change-sets"
              payload: { source_environment_id: "${env_src_id}", target_environment_id: "${env_tgt_id}", component_list: [{ component: "acme_controller", version_tag: 1 }], component_dependencies: [], expected_environment_version: "${env_tgt_v}" }
              as: ReleaseManager
              captures: { cs_id: $.data.id }
          trigger:
            - call: "POST /platform/change-sets/${cs_id}/validate"
              payload: {}
              as: ReleaseManager
            - call: "POST /platform/change-sets/${cs_id}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { cs_v1: $.data.version }
            - call: "POST /platform/change-sets/${cs_id}/reopen"
              payload: {}
              as: ReleaseManager
            - call: "POST /platform/change-sets/${cs_id}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { cs_v2: $.data.version }
          assert:
            - "after reopen MetadataChangeSet.${cs_id}.status == VALIDATED and component_digests == {}"
            - "after the second approve MetadataChangeSet.${cs_id}.status == APPROVED"
            - "MetadataChangeSet.${cs_id}.component_digests == {\"acme_controller\": 1}"
            - "MetadataChangeSet.${cs_id}.version after the second approve is greater than after the first approve"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: refresh_completion_three_hop_cascade
        grounds:
          - state_machines.RefreshJob.COMPLETING_to_COMPLETED
          - state_machines.InstalledPackage.INSTALLED_to_NEEDS_UPGRADE
          - calculations.upgrade_candidate_evaluation
          - calculations.permission_overreach_resolution
        distinguishing_aspect: "Depth 3 and each hop causes the next: completing the refresh writes Environment.refresh_generation, which itself recomputes every InstalledPackage of that environment, which itself re-derives Environment.installed_version_ids — the third hop cannot fire unless the second did."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One PARTIAL sandbox with acme-core 1 installed, plus a published acme-core 2 that supersedes it."
          setup_api_calls:
            - call: "POST /platform/package-versions"
              payload: { namespace: "acme", major_version: 1, name: "Acme Core 1" }
              as: PlatformAdmin
              captures: { pv_acme1_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Cascade Sandbox", type: "PARTIAL", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_cas_id: $.data.id, env_cas_v: $.data.version }
            - call: "POST /platform/environments/${env_cas_id}/package-installations"
              payload: { package_version_id: "${pv_acme1_id}", expected_environment_version: "${env_cas_v}" }
              as: ReleaseManager
              captures: { pkg_cas_id: $.data.id }
            - call: "POST /platform/package-versions"
              payload: { namespace: "acme", major_version: 2, name: "Acme Core 2", supersedes_version_id: "${pv_acme1_id}" }
              as: PlatformAdmin
              captures: { pv_acme2_id: $.data.id }
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_cas_id}", partition: "ACCOUNT_PARTIAL", masked_field_count: 5 }
              as: EnvironmentAdmin
              captures: { rj_cas_id: $.data.id }
            - call: "POST /platform/refresh-jobs/${rj_cas_id}/complete-masking"
              payload: {}
              as: EnvironmentAdmin
          trigger:
            - call: "POST /platform/refresh-jobs/${rj_cas_id}/complete-refresh"
              payload: {}
              as: EnvironmentAdmin
          assert:
            - "RefreshJob.${rj_cas_id}.status == COMPLETED"
            - "HOP 1: Environment.${env_cas_id}.refresh_generation == 1 and last_refresh_at == 2026-09-01T00:00:00Z"
            - "HOP 2: InstalledPackage.${pkg_cas_id}.refreshed_at == 2026-09-01T00:00:00Z and pending_refresh_job_id == \"${rj_cas_id}\""
            - "HOP 3: Environment.${env_cas_id}.installed_version_ids == [\"${pv_acme1_id}\"] and InstalledPackage.${pkg_cas_id}.stale == true"

      - name: release_apply_three_hop_cascade
        grounds:
          - state_machines.Environment.SCHEDULED_to_RELEASED
          - state_machines.InstalledPackage.INSTALLED_to_NEEDS_UPGRADE
          - calculations.upgrade_candidate_evaluation
          - calculations.permission_overreach_resolution
        distinguishing_aspect: "Depth 3 again from a different trigger: applying the seasonal release writes InstalledPackage rows, and only that write allows the PermissionAssignment sharing_rule_scope re-derivation and the installed_version_ids re-derivation to run."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One PARTIAL sandbox with acme-core 1 installed and one acme grant scoped to object_prefix acme."
          setup_api_calls:
            - call: "POST /platform/package-versions"
              payload: { namespace: "acme", major_version: 1, name: "Acme Core 1" }
              as: PlatformAdmin
              captures: { pv_acme1b_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Release Sandbox", type: "PARTIAL", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_rel_id: $.data.id, env_rel_v: $.data.version }
            - call: "POST /platform/environments/${env_rel_id}/package-installations"
              payload: { package_version_id: "${pv_acme1b_id}", expected_environment_version: "${env_rel_v}" }
              as: ReleaseManager
              captures: { pkg_rel_id: $.data.id }
            - call: "POST /platform/environments/${env_rel_id}/permissions"
              payload: { principal_type: "PROFILE", principal_name: "AcmeUser", user_id: "0050a000020001", object_prefix: "acme" }
              as: SecurityAuditor
              captures: { pa_rel_id: $.data.id }
            - call: "POST /platform/environments/${env_rel_id}/schedule-release"
              payload: { target_release_version: "SU26" }
              as: ReleaseManager
          trigger:
            - call: "POST /platform/environments/${env_rel_id}/apply-release"
              payload: {}
              as: ReleaseManager
          assert:
            - "HOP 1: InstalledPackage.${pkg_rel_id}.status == NEEDS_UPGRADE and stale == true"
            - "HOP 2: PermissionAssignment.${pa_rel_id}.sharing_rule_scope == ORG_WIDE, having been NAMESPACE_READ before the release"
            - "HOP 2: Environment.${env_rel_id}.storage_breach == false and StorageLedger rows of the environment all carry archivable == true after the release"
            - "Environment.${env_rel_id}.applied_release_version == \"SU26\""

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: storage_breach_precedes_aperture_check
        grounds:
          - validations[priority=21]
          - validations[priority=22]
          - errors[ERR_STORAGE_BREACH]
          - errors[ERR_REFRESH_APERTURE_EXCEEDED]
        distinguishing_aspect: "A business_fiscal vs business_fiscal conflict on one request: the environment is both over its storage cap and out of aperture, and priority 21's ERR_STORAGE_BREACH must win over priority 22's ERR_REFRESH_APERTURE_EXCEEDED for POST /platform/refresh-jobs/{id}/complete-refresh."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A level-2 sandbox with storage_cap_bytes 100 and one 200-byte DATA ledger, and aperture_limit 1 already consumed by an earlier completed refresh."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Overreach Parent", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_p1_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Overreach Sandbox", type: "DEVELOPER", parent_environment_id: "${env_p1_id}", storage_cap_bytes: 100, aperture_limit: 1 }
              as: PlatformAdmin
              captures: { env_p2_id: $.data.id }
            - call: "POST /platform/environments/${env_p2_id}/storage-ledgers"
              payload: { kind: "DATA", bytes: 200, rank_index: 1 }
              as: StorageArchivist
              captures: { sl_p_id: $.data.id }
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_p2_id}", partition: "ACCOUNT_PARTIAL", masked_field_count: 2 }
              as: EnvironmentAdmin
              captures: { rj_p1_id: $.data.id }
            - call: "POST /platform/refresh-jobs/${rj_p1_id}/complete-masking"
              payload: {}
              as: EnvironmentAdmin
            - call: "POST /platform/refresh-jobs/${rj_p1_id}/complete-refresh"
              payload: {}
              as: EnvironmentAdmin
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_p2_id}", partition: "ACCOUNT_PARTIAL", masked_field_count: 2 }
              as: EnvironmentAdmin
              captures: { rj_p2_id: $.data.id }
            - call: "POST /platform/refresh-jobs/${rj_p2_id}/complete-masking"
              payload: {}
              as: EnvironmentAdmin
          trigger:
            - call: "POST /platform/refresh-jobs/${rj_p2_id}/complete-refresh"
              payload: {}
              as: EnvironmentAdmin
              captures: { err_breach: $.data.error_id }
          assert:
            - "Environment.${env_p2_id}.storage_breach == true"
            - "Environment.${env_p2_id}.aperture_used == 1 and aperture_limit == 1"
            - "the response carries error_id ERR_STORAGE_BREACH with http 402, not ERR_REFRESH_APERTURE_EXCEEDED"
            - "RefreshJob.${rj_p2_id}.status remains COMPLETING"

      - name: invalid_state_precedes_component_dependency_validation
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_MISSING_COMPONENT_DEPENDENCY]
        distinguishing_aspect: "state vs business_referential on one request: a DRAFT change set whose dependency graph names an absent requires target is rejected with ERR_INVALID_STATE because the state precondition is evaluated before the dependency-graph check, so ERR_MISSING_COMPONENT_DEPENDENCY is never reached."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A DEVELOPER source sandbox and a DEVELOPER target sandbox."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Pri Source", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_ps_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Pri Target", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_pt_id: $.data.id, env_pt_v: $.data.version }
          trigger:
            - call: "POST /platform/change-sets"
              payload: { source_environment_id: "${env_ps_id}", target_environment_id: "${env_pt_id}", component_list: [{ component: "acme_controller", version_tag: 1 }], component_dependencies: [{ component: "acme_controller", requires: ["acme_absent"], min_version: 1 }], expected_environment_version: "${env_pt_v}" }
              as: ReleaseManager
              captures: { cs_pri_id: $.data.id }
            - call: "POST /platform/change-sets/${cs_pri_id}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { err_state: $.data.error_id }
          assert:
            - "the second call's response carries error_id ERR_INVALID_STATE with http 409, not ERR_MISSING_COMPONENT_DEPENDENCY"
            - "MetadataChangeSet.${cs_pri_id}.status == DRAFT"
            - "MetadataChangeSet.${cs_pri_id}.component_digests == {}"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: aperture_inclusive_at_limit
        grounds:
          - calculations.aperture_consumption_evaluation
          - validations[priority=22]
          - entities.Environment.fields.aperture_used
          - endpoints.POST_/platform/refresh-jobs/{id}/complete-refresh
        distinguishing_aspect: "A numeric threshold crossing on the aperture counter: with aperture_limit 1 the second completion lands on aperture_used == 1 and is admitted (inclusive `<=`), while a third completion lands on aperture_used == 2 and is refused — the exact boundary is 1 versus 2, not 2 versus 3."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A level-2 sandbox with aperture_limit 1."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Aperture Parent", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_a1_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Aperture Sandbox", type: "DEVELOPER", parent_environment_id: "${env_a1_id}", aperture_limit: 1 }
              as: PlatformAdmin
              captures: { env_a2_id: $.data.id }
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_a2_id}", partition: "ACCOUNT_PARTIAL", masked_field_count: 2 }
              as: EnvironmentAdmin
              captures: { rj_a1_id: $.data.id }
            - call: "POST /platform/refresh-jobs/${rj_a1_id}/complete-masking"
              payload: {}
              as: EnvironmentAdmin
            - call: "POST /platform/refresh-jobs/${rj_a1_id}/complete-refresh"
              payload: {}
              as: EnvironmentAdmin
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_a2_id}", partition: "ACCOUNT_PARTIAL", masked_field_count: 2 }
              as: EnvironmentAdmin
              captures: { rj_a2_id: $.data.id }
            - call: "POST /platform/refresh-jobs/${rj_a2_id}/complete-masking"
              payload: {}
              as: EnvironmentAdmin
            - call: "POST /platform/refresh-jobs/${rj_a2_id}/complete-refresh"
              payload: {}
              as: EnvironmentAdmin
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_a2_id}", partition: "ACCOUNT_PARTIAL", masked_field_count: 2 }
              as: EnvironmentAdmin
              captures: { rj_a3_id: $.data.id }
            - call: "POST /platform/refresh-jobs/${rj_a3_id}/complete-masking"
              payload: {}
              as: EnvironmentAdmin
          trigger:
            - call: "POST /platform/refresh-jobs/${rj_a3_id}/complete-refresh"
              payload: {}
              as: EnvironmentAdmin
              captures: { err_aperture: $.data.error_id }
          assert:
            - "after the second completion Environment.${env_a2_id}.aperture_used == 1 and RefreshJob.${rj_a2_id}.status == COMPLETED"
            - "the third completion returns error_id ERR_REFRESH_APERTURE_EXCEEDED with http 402"
            - "Environment.${env_a2_id}.aperture_used remains 1 after the refusal"
            - "RefreshJob.${rj_a3_id}.consumed_aperture == false"

      - name: full_copy_masking_exactly_twenty
        grounds:
          - validations[priority=18]
          - state_machines.RefreshJob.PENDING_to_MASKING
          - errors[ERR_MASKING_INSUFFICIENT]
          - endpoints.POST_/platform/refresh-jobs/{id}/complete-masking
        distinguishing_aspect: "A different metric — an empty/zero-count style edge on a declared masked-field count: a FULL_COPY refresh with masked_field_count 20 advances to MASKING while the same job with 19 is refused, so the boundary is exactly >= 20."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One FULL_COPY sandbox."
          setup_api_calls:
            - call: "POST /platform/environments"
