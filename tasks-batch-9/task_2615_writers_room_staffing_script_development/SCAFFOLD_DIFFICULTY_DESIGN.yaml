              as: Showrunner
              as_user_id: "${sr}"
              captures: { lr: "$.data.id" }
            - call: "POST /rooms/${lr}/open-staffing"
              payload: {}
              as: Showrunner
              as_user_id: "${sr}"
              captures: { lrv: "$.data.version" }
          trigger:
            - call: "POST /rooms/${lr}/seats"
              payload: { writer_id: "${pq}", level_at_hire: "STAFF_WRITER", offered_weekly_compensation_cents: 450000, exclusivity: "NON_EXCLUSIVE", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-18T00:00:00Z", episodic_guarantee_count: 0, diversity_program_funded: false, expected_room_version: "${lrv}" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { sb: "$.data.id" }
          assert:
            - "RoomSeat.${sb}.guild_floor_weekly_cents == 450000"
            - "RoomSeat.${sb}.weekly_compensation_cents == 450000"
            - "RoomSeat.${sb}.diversity_subsidy_weekly_cents == 0"
            - "RoomSeat.${sb}.studio_charge_weekly_cents == 450000"
            - "RoomSeat.${sb}.prorated_commitment_cents == 1092858"
            - "RoomSeat.${sb}.prorated_commitment_cents != 1092857 (the rejected multiply-then-round order)"

      - name: mode_c_room_weekly_burn_tier_keyed_on_pre_surcharge_subtotal
        grounds:
          - calculations.room_weekly_burn
          - calculations.room_weekly_burn.formula
          - calculations.room_weekly_burn.constants.EVALUATION_ORDER
          - calculations.room_weekly_burn.constants.TIER_BOUNDS
          - calculations.season_staffing_commitment
          - entities.GuildAgreement.fields.facility_tier_subtotal_bounds
          - entities.GuildAgreement.fields.format_surcharge_pct
          - entities.WritersRoom.fields.seat_subtotal_weekly_cents
