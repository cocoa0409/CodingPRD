# §1.9 Scaffold Corner Design — breadth probe over §1.1–§1.7 of SCAFFOLD.yaml.
# Walked row-by-row against references/claim-extraction-guide.md; sections and
# claim_types are taken verbatim from that guide. Corners already asserted by a
# named SCAFFOLD_DIFFICULTY_DESIGN.yaml instance carry an excluded_because stub
# and no test_recipe.
#
# Shared short chain used by many instances ("accepted brief -> approved
# single-material formula -> released 500 g lot"):
#   GUM-BASE @ 2000 cents/kg, 100.0000 wt% -> bench_cost_per_kg_cents 2000
#   brief dosage 1.0000 %, annual 500 kg  -> bench_cost_in_use 20000 cents/tonne
#                                            firm_cost_in_use  19690 cents/tonne
scaffold_corner_design:

  - section: entities
    instances:

      - name: brief_creation_returns_envelope_and_system_defaults
        claim_type: creation
        grounds:
          - endpoints[POST /customer-briefs]
          - entities.CustomerBrief.fields.status
          - entities.CustomerBrief.fields.clarification_round_count
        distinguishing_aspect: "A brief created with only the required inputs comes back 201 inside the meta/response_type/data envelope with status DRAFT, clarification_round_count 0, version 1 and every system field null."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to the default instant so created_at is deterministic."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccountManager
          trigger:
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0001", customer_name: "Nordica Dairy", matrix_type: "DAIRY_YOGURT", target_profile: "VANILLA_CREAM", dosage_pct: 1.0, annual_volume_kg: 500, cost_in_use_cap_cents_per_tonne: 100000, confidentiality_tier: "TIER_1_STANDARD" }
              as: AccountManager
              as_user_id: "u_am_1"
              captures: { b1: "$.data.id", b1_ver: "$.data.version" }
          assert:
            - "HTTP status == 201"
            - "response body has exactly the keys meta, response_type, data; meta has api_request_id and api_request_timestamp"
            - "response_type == \"object\""
            - "CustomerBrief.${b1}.brief_code == \"BRF-0001\""
            - "CustomerBrief.${b1}.dosage_pct == 1.0000"
            - "CustomerBrief.${b1}.status == DRAFT"
            - "CustomerBrief.${b1}.clarification_round_count == 0"
            - "CustomerBrief.${b1}.clarification_note is null"
            - "CustomerBrief.${b1}.decision_note is null"
            - "CustomerBrief.${b1}.outcome is null"
            - "CustomerBrief.${b1}.loss_reason is null"
            - "CustomerBrief.${b1}.closed_at is null"
            - "CustomerBrief.${b1}.version == 1"
            - "CustomerBrief.${b1}.created_at == \"2026-08-01T00:00:00.000Z\""

      - name: brief_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /customer-briefs/{brief_id}]
          - entities.CustomerBrief.fields.allergen_exclusions
        distinguishing_aspect: "GET /customer-briefs/{brief_id} returns the same field values that the create call persisted, including the allergen_exclusions array in the order supplied, and does not mutate version."
        test_recipe:
          setup:
            - "One brief created with two allergen exclusions and kosher_required true."
          setup_api_calls:
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0001", customer_name: "Nordica Dairy", matrix_type: "DAIRY_YOGURT", target_profile: "VANILLA_CREAM", dosage_pct: 1.0, annual_volume_kg: 500, cost_in_use_cap_cents_per_tonne: 100000, confidentiality_tier: "TIER_2_RESTRICTED", kosher_required: true, allergen_exclusions: ["MILK", "PEANUT"] }
              as: AccountManager
              captures: { b1: "$.data.id" }
          trigger:
            - call: "GET /customer-briefs/${b1}"
              payload: {}
              as: LabTech
          assert:
            - "HTTP status == 200"
            - "CustomerBrief.${b1}.customer_name == \"Nordica Dairy\""
            - "CustomerBrief.${b1}.confidentiality_tier == TIER_2_RESTRICTED"
            - "CustomerBrief.${b1}.kosher_required == true"
            - "CustomerBrief.${b1}.natural_claim_required == false"
            - "CustomerBrief.${b1}.allergen_exclusions == [\"MILK\", \"PEANUT\"]"
            - "CustomerBrief.${b1}.version == 1"

      - name: brief_listing_filters_by_status_and_reports_pagination_fields
        claim_type: listing
        grounds:
          - endpoints[GET /customer-briefs]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three briefs of which one has been submitted, GET /customer-briefs?status=DRAFT&limit=1 returns exactly one row, total_count 2 and has_more true — the filter is applied before the page window, not after."
        test_recipe:
          setup:
            - "Three briefs BRF-0001, BRF-0002, BRF-0003 created in that order; BRF-0002 submitted so only two remain DRAFT."
          setup_api_calls:
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0001", customer_name: "Nordica Dairy", matrix_type: "DAIRY_YOGURT", target_profile: "VANILLA_CREAM", dosage_pct: 1.0, annual_volume_kg: 500, cost_in_use_cap_cents_per_tonne: 100000, confidentiality_tier: "TIER_1_STANDARD" }
              as: AccountManager
              captures: { b1: "$.data.id" }
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0002", customer_name: "Nordica Dairy", matrix_type: "BAKERY_SWEET", target_profile: "RED_FRUIT", dosage_pct: 0.5, annual_volume_kg: 200, cost_in_use_cap_cents_per_tonne: 90000, confidentiality_tier: "TIER_1_STANDARD" }
              as: AccountManager
              captures: { b2: "$.data.id" }
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0003", customer_name: "Alpine Snacks", matrix_type: "SAVOURY_SNACK", target_profile: "SAVOURY_UMAMI", dosage_pct: 0.2, annual_volume_kg: 3000, cost_in_use_cap_cents_per_tonne: 70000, confidentiality_tier: "TIER_1_STANDARD" }
              as: AccountManager
              captures: { b3: "$.data.id" }
            - call: "POST /customer-briefs/${b2}/submit"
              payload: {}
              as: AccountManager
          trigger:
            - call: "GET /customer-briefs"
              payload: { status: "DRAFT", limit: 1, offset: 0 }
              as: TechnicalDirector
          assert:
            - "HTTP status == 200"
            - "response_type == \"array\""
            - "len(data) == 1 and data[0].id == ${b1}"
            - "total_count == 2"
            - "limit == 1 and offset == 0"
            - "has_more == true"
            - "no returned row has status SUBMITTED"

      - name: formula_get_with_unknown_id_returns_formula_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /formulas/{formula_id}]
          - validations[priority=34]
          - errors.ERR_FORMULA_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unknown formula id returns ERR_FORMULA_NOT_FOUND with HTTP 404, not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database; no Formula rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Flavorist
          trigger:
            - call: "GET /formulas/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: Flavorist
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 404"
            - "response_type == \"error\""
            - "data.error_id == ERR_FORMULA_NOT_FOUND"

      - name: raw_material_missing_cost_per_kg_cents_rejected
        claim_type: required_fields
        grounds:
          - endpoints[POST /raw-materials]
          - entities.RawMaterial.fields.cost_per_kg_cents
          - validations[priority=30]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "cost_per_kg_cents has source input and no default, so omitting it returns ERR_INVALID_REQUEST (400) and persists no RawMaterial row."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PurchasingManager
          trigger:
            - call: "POST /raw-materials"
              payload: { material_code: "GUM-BASE", name: "Gum Base 40", natural_status: "NATURE_IDENTICAL", potency_class: "STANDARD", max_use_ppm: 1000000 }
              as: PurchasingManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "GET /raw-materials returns total_count == 0"

      - name: brief_claim_flags_and_exclusions_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.CustomerBrief.fields.natural_claim_required
          - entities.CustomerBrief.fields.kosher_required
          - entities.CustomerBrief.fields.halal_required
          - entities.CustomerBrief.fields.allergen_exclusions
        distinguishing_aspect: "Omitting the four optional intake fields yields false/false/false and an empty array — not null — so the downstream regulatory_packet requirement set stays [SDS, ALLERGEN_STATEMENT]."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccountManager
          trigger:
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0001", customer_name: "Nordica Dairy", matrix_type: "DAIRY_YOGURT", target_profile: "VANILLA_CREAM", dosage_pct: 1.0, annual_volume_kg: 500, cost_in_use_cap_cents_per_tonne: 100000, confidentiality_tier: "TIER_1_STANDARD" }
              as: AccountManager
              captures: { b1: "$.data.id" }
          assert:
            - "CustomerBrief.${b1}.natural_claim_required == false"
            - "CustomerBrief.${b1}.kosher_required == false"
            - "CustomerBrief.${b1}.halal_required == false"
            - "CustomerBrief.${b1}.allergen_exclusions == []"

      - name: raw_material_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - endpoints[POST /raw-materials]
          - entities.RawMaterial.fields.claim_status
        distinguishing_aspect: "id, created_at, version and the computed claim_status supplied in the request body are ignored: the server mints its own id, stamps created_at from the logical clock, sets version 1 and computes claim_status CLEAR with verified_claim_types empty."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned so the stamped created_at is deterministic."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PurchasingManager
          trigger:
            - call: "POST /raw-materials"
              payload: { material_code: "GUM-BASE", name: "Gum Base 40", cost_per_kg_cents: 2000, natural_status: "NATURE_IDENTICAL", potency_class: "STANDARD", max_use_ppm: 1000000, id: "00000000-0000-4000-8000-0000000000ff", created_at: "1999-01-01T00:00:00Z", version: 77, claim_status: "RESTRICTED" }
              as: PurchasingManager
              captures: { m1: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "RawMaterial.${m1}.id != \"00000000-0000-4000-8000-0000000000ff\""
            - "RawMaterial.${m1}.created_at == \"2026-08-01T00:00:00.000Z\""
            - "RawMaterial.${m1}.version == 1"
            - "RawMaterial.${m1}.claim_status == CLEAR"
            - "RawMaterial.${m1}.verified_claim_types == []"

      - name: formula_bench_cost_computed_field_is_derived_not_supplied
        claim_type: computed_fields
        grounds:
          - entities.Formula.fields.bench_cost_per_kg_cents
          - calculations.formula_bench_cost
        excluded_because:
          difficulty_instance: combinatorial_formula / bench_cost_rounds_per_component_line_before_summing
          rationale: "That instance pins the per-line-round-then-sum result 2977 against the sum-then-round trap 2978 from the same component set, which is exactly the computed-field correctness claim for bench_cost_per_kg_cents."

      - name: raw_material_invalid_natural_status_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.RawMaterial.fields.natural_status
          - validations[priority=30]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "A natural_status value outside {NATURAL, NATURAL_FLAVOR_WONF, NATURE_IDENTICAL, ARTIFICIAL} returns ERR_INVALID_REQUEST (400) and no row is stored."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PurchasingManager
          trigger:
            - call: "POST /raw-materials"
              payload: { material_code: "GUM-BASE", name: "Gum Base 40", cost_per_kg_cents: 2000, natural_status: "ORGANIC", potency_class: "STANDARD", max_use_ppm: 1000000 }
              as: PurchasingManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "GET /raw-materials returns total_count == 0"

      - name: formula_create_with_unknown_brief_id_not_found
        claim_type: parent_relationships
        grounds:
          - endpoints[POST /formulas]
          - entities.Formula.parent
          - validations[priority=36]
          - errors.ERR_BRIEF_NOT_FOUND
        distinguishing_aspect: "A body-supplied brief_id that names no CustomerBrief returns ERR_BRIEF_NOT_FOUND (404) — body FKs are validated by priority 36, distinct from the path-id check at priority 34."
        test_recipe:
          setup:
            - "Empty database; no CustomerBrief rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Flavorist
          trigger:
            - call: "POST /formulas"
              payload: { brief_id: "00000000-0000-4000-8000-000000000001", name: "Vanilla Cream F1" }
              as: Flavorist
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 404"
            - "data.error_id == ERR_BRIEF_NOT_FOUND"
            - "GET /formulas returns total_count == 0"

      - name: sub_formula_component_priced_through_the_dag
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.FormulaComponent.fields.sub_formula_id
          - calculations.formula_bench_cost
          - entities.Formula.fields.component_count
        distinguishing_aspect: "A parent formula built from one SUB_FORMULA line at 50.0000 % and one RAW_MATERIAL line at 50.0000 % prices the sub-formula line from the child's own bench_cost_per_kg_cents (2000), producing contribution_cents 1000 on both lines and bench_cost_per_kg_cents 2000 on the parent."
        test_recipe:
          setup:
            - "Material GUM-BASE at 2000 cents/kg, max_use_ppm 1000000."
            - "Brief BRF-0001 accepted (dosage 1.0000 %, annual 500 kg, cap 100000 cents/tonne, TIER_1_STANDARD)."
            - "Sub-formula SF holds GUM-BASE at 100.0000 % and has been costed, so SF.bench_cost_per_kg_cents == 2000 and SF.status == COSTED."
            - "Parent formula F holds one SUB_FORMULA line on SF at 50.0000 % (sequence_no 1) and one RAW_MATERIAL line on GUM-BASE at 50.0000 % (sequence_no 2); F.total_weight_pct == 100.0000."
          setup_api_calls:
            - call: "POST /raw-materials"
              payload: { material_code: "GUM-BASE", name: "Gum Base 40", cost_per_kg_cents: 2000, natural_status: "NATURE_IDENTICAL", potency_class: "STANDARD", max_use_ppm: 1000000 }
              as: PurchasingManager
              captures: { m1: "$.data.id" }
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0001", customer_name: "Nordica Dairy", matrix_type: "DAIRY_YOGURT", target_profile: "VANILLA_CREAM", dosage_pct: 1.0, annual_volume_kg: 500, cost_in_use_cap_cents_per_tonne: 100000, confidentiality_tier: "TIER_1_STANDARD" }
              as: AccountManager
              captures: { b1: "$.data.id" }
            - call: "POST /customer-briefs/${b1}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /customer-briefs/${b1}/decision"
              payload: { decision: "ACCEPTED" }
              as: TechnicalDirector
            - call: "POST /formulas"
              payload: { brief_id: "${b1}", name: "Vanilla Base SF" }
              as: Flavorist
              captures: { sf: "$.data.id" }
            - call: "POST /formulas/${sf}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m1}", weight_pct: 100.0 }
              as: Flavorist
            - call: "POST /formulas/${sf}/cost"
              payload: {}
              as: Flavorist
            - call: "POST /formulas"
              payload: { brief_id: "${b1}", name: "Vanilla Cream F1" }
              as: Flavorist
              captures: { f1: "$.data.id" }
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "SUB_FORMULA", sub_formula_id: "${sf}", weight_pct: 50.0 }
              as: Flavorist
              captures: { c_sub: "$.data.id", c_sub_seq: "$.data.sequence_no" }
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m1}", weight_pct: 50.0 }
              as: Flavorist
              captures: { c_raw: "$.data.id" }
          trigger:
            - call: "POST /formulas/${f1}/cost"
              payload: {}
              as: Flavorist
          assert:
            - "Formula.${sf}.bench_cost_per_kg_cents == 2000"
            - "FormulaComponent.${c_sub}.contribution_cents == 1000"
            - "FormulaComponent.${c_raw}.contribution_cents == 1000"
            - "Formula.${f1}.bench_cost_per_kg_cents == 2000"
            - "Formula.${f1}.bench_cost_in_use_cents_per_tonne == 20000"
            - "Formula.${f1}.component_count == 2"
            - "Formula.${f1}.total_weight_pct == 100.0000"
            - "Formula.${f1}.status == COSTED"
            - "GET /formula-components?sub_formula_id=${sf} returns exactly one row whose id == ${c_sub}"

      - name: sub_formula_self_reference_rejected
        claim_type: graph
        grounds:
          - validations[priority=60]
          - validations[priority=62]
          - errors.ERR_FORMULA_CYCLE
        distinguishing_aspect: "Adding a SUB_FORMULA line whose sub_formula_id is the parent formula itself returns ERR_FORMULA_CYCLE (422) even though the resulting total_weight_pct 110.0000 also breaches priority 62 — the cycle check at priority 60 outranks the weight-sum check, and the formula stays COSTED with component_count 1."
        test_recipe:
          setup:
            - "Material GUM-BASE at 2000 cents/kg, max_use_ppm 1000000."
            - "Brief BRF-0001 accepted."
            - "Formula F holds GUM-BASE at 100.0000 % and has been costed, so F.status == COSTED (which satisfies the priority-42 SUB_FORMULA-must-be-costed guard for a self reference)."
          setup_api_calls:
            - call: "POST /raw-materials"
              payload: { material_code: "GUM-BASE", name: "Gum Base 40", cost_per_kg_cents: 2000, natural_status: "NATURE_IDENTICAL", potency_class: "STANDARD", max_use_ppm: 1000000 }
              as: PurchasingManager
              captures: { m1: "$.data.id" }
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0001", customer_name: "Nordica Dairy", matrix_type: "DAIRY_YOGURT", target_profile: "VANILLA_CREAM", dosage_pct: 1.0, annual_volume_kg: 500, cost_in_use_cap_cents_per_tonne: 100000, confidentiality_tier: "TIER_1_STANDARD" }
              as: AccountManager
              captures: { b1: "$.data.id" }
            - call: "POST /customer-briefs/${b1}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /customer-briefs/${b1}/decision"
              payload: { decision: "ACCEPTED" }
              as: TechnicalDirector
            - call: "POST /formulas"
              payload: { brief_id: "${b1}", name: "Vanilla Cream F1" }
              as: Flavorist
              captures: { f1: "$.data.id" }
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m1}", weight_pct: 100.0 }
              as: Flavorist
            - call: "POST /formulas/${f1}/cost"
              payload: {}
              as: Flavorist
          trigger:
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "SUB_FORMULA", sub_formula_id: "${f1}", weight_pct: 10.0 }
              as: Flavorist
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 422"
            - "data.error_id == ERR_FORMULA_CYCLE"
            - "Formula.${f1}.component_count == 1"
            - "Formula.${f1}.total_weight_pct == 100.0000"
            - "Formula.${f1}.status == COSTED"

      - name: formula_parent_from_another_brief_rejected
        claim_type: parent_relationships
        grounds:
          - validations[priority=75]
          - entities.Formula.fields.parent_formula_id
          - errors.ERR_PARENT_FORMULA_MISMATCH
        distinguishing_aspect: "A parent_formula_id naming a Formula whose brief_id differs from the new formula's brief_id returns ERR_PARENT_FORMULA_MISMATCH (422) — the self-referential FK is scoped to one brief, unlike the plain existence check which the id would pass."
        test_recipe:
          setup:
            - "Two accepted briefs BRF-0001 and BRF-0002."
            - "Formula FA created under BRF-0002."
          setup_api_calls:
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0001", customer_name: "Nordica Dairy", matrix_type: "DAIRY_YOGURT", target_profile: "VANILLA_CREAM", dosage_pct: 1.0, annual_volume_kg: 500, cost_in_use_cap_cents_per_tonne: 100000, confidentiality_tier: "TIER_1_STANDARD" }
              as: AccountManager
              captures: { b1: "$.data.id" }
            - call: "POST /customer-briefs/${b1}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /customer-briefs/${b1}/decision"
              payload: { decision: "ACCEPTED" }
              as: TechnicalDirector
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0002", customer_name: "Alpine Snacks", matrix_type: "SAVOURY_SNACK", target_profile: "SAVOURY_UMAMI", dosage_pct: 0.2, annual_volume_kg: 3000, cost_in_use_cap_cents_per_tonne: 70000, confidentiality_tier: "TIER_1_STANDARD" }
              as: AccountManager
              captures: { b2: "$.data.id" }
            - call: "POST /customer-briefs/${b2}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /customer-briefs/${b2}/decision"
              payload: { decision: "ACCEPTED" }
              as: TechnicalDirector
            - call: "POST /formulas"
              payload: { brief_id: "${b2}", name: "Umami Snack F1" }
              as: Flavorist
              captures: { fa: "$.data.id" }
          trigger:
            - call: "POST /formulas"
              payload: { brief_id: "${b1}", name: "Vanilla Cream F2", parent_formula_id: "${fa}" }
              as: Flavorist
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 422"
            - "data.error_id == ERR_PARENT_FORMULA_MISMATCH"
            - "GET /formulas?brief_id=${b1} returns total_count == 0"

  - section: state_machines
    instances:

      - name: brief_submit_moves_draft_to_submitted
        claim_type: valid_transition
        grounds:
          - state_machines.CustomerBrief.DRAFT_to_SUBMITTED
          - endpoints[POST /customer-briefs/{brief_id}/submit]
        distinguishing_aspect: "POST submit on a DRAFT brief returns 200 with status SUBMITTED, version 2 and clarification_round_count still 0."
        test_recipe:
          setup:
            - "One DRAFT brief BRF-0001 at version 1."
          setup_api_calls:
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0001", customer_name: "Nordica Dairy", matrix_type: "DAIRY_YOGURT", target_profile: "VANILLA_CREAM", dosage_pct: 1.0, annual_volume_kg: 500, cost_in_use_cap_cents_per_tonne: 100000, confidentiality_tier: "TIER_1_STANDARD" }
