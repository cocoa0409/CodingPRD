    description: "Create an incident report in DRAFT (occurred_at <= clock)"
    roles: [Driver, ContractorOps]
    code: 201
    input: [district_id, category, severity, description, occurred_at, "route_id?", "driver_id?", "service_day_id?", "student_discipline_flag?"]
    output: Incident
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/busops/incidents"
    description: "List incidents (paginated, filterable)"
    roles: [SystemAdmin, DistrictAdmin, ContractorOps, HRRecruiter, Driver]
    code: 200
    input: ["district_id?", "route_id?", "driver_id?", "service_day_id?", "status?", "severity?", "limit?", "offset?"]
    output: Incident[]
    side_effects: []
  - method: GET
    path: "/busops/incidents/{id}"
    description: "Get an incident"
    roles: [SystemAdmin, DistrictAdmin, ContractorOps, HRRecruiter, Driver]
    code: 200
    input: []
    output: Incident
    side_effects: []
  - method: POST
    path: "/busops/incidents/{id}/submit"
    description: "DRAFT|RETURNED_FOR_INFO -> SUBMITTED; sets submitted_at and SLA deadline"
    roles: [Driver, ContractorOps]
    code: 200
    input: []
    output: Incident
    side_effects: ["submitted_at/district_due_by set from clock and severity"]
  - method: POST
    path: "/busops/incidents/{id}/acknowledge"
    description: "SUBMITTED -> ACKNOWLEDGED; computes sla_breached"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: Incident
    side_effects: ["acknowledged_at set", "sla_breached computed (strictly greater than due_by)"]
  - method: POST
    path: "/busops/incidents/{id}/return"
    description: "SUBMITTED -> RETURNED_FOR_INFO (requests more info)"
    roles: [DistrictAdmin]
    code: 200
    input: ["reason?"]
    output: Incident
    side_effects: []
  - method: POST
    path: "/busops/incidents/{id}/close"
    description: "ACKNOWLEDGED -> CLOSED"
    roles: [DistrictAdmin, ContractorOps]
    code: 200
    input: ["resolution_note?"]
    output: Incident
    side_effects: []

  # --- RidershipReport ---
  - method: POST
    path: "/busops/ridership-reports"
    description: "Submit GPS/ridership data for a COMPLETED assignment (one per assignment)"
    roles: [Driver, ContractorOps]
    code: 201
    input: [assignment_id, service_day_id, boardings, alightings, first_pickup_actual_minute, last_dropoff_actual_minute]
    output: RidershipReport
    side_effects: ["minutes_late / on_time / student_minutes_late computed vs assignment.planned_start_minute with 5-minute grace"]
  - method: GET
    path: "/busops/ridership-reports"
    description: "List ridership reports (filterable)"
    roles: [SystemAdmin, DistrictAdmin, ContractorOps, Driver]
    code: 200
    input: ["assignment_id?", "service_day_id?", "limit?", "offset?"]
    output: RidershipReport[]
    side_effects: []
  - method: GET
    path: "/busops/ridership-reports/{id}"
    description: "Get a ridership report"
    roles: [SystemAdmin, DistrictAdmin, ContractorOps, Driver]
    code: 200
    input: []
    output: RidershipReport
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum value, or out-of-range integer" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Entity-backed identity mismatch: DistrictAdmin acting on another district's resource, or Driver acting on another driver's assignment/record" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a valid from-state for the requested transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Entity is in a terminal state; no further transitions" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Operation requires contract status=ACTIVE (routes, service days, charters, quotes, schedules)" }
  - { id: ERR_CONTRACT_NOT_YET_STARTED, http: 409, condition: "Activation requires logical clock date >= contract.start_date" }
  - { id: ERR_DRIVER_NOT_ACTIVE, http: 409, condition: "Driver status != ACTIVE where dispatch requires ACTIVE" }
  - { id: ERR_CREDENTIAL_EXPIRED, http: 409, condition: "CDL_B credential missing, EXPIRED, or REVOKED where required (TEST_PASS, confirm, REINSTATE, charter driver assignment)" }
  - { id: ERR_ENDORSEMENT_MISSING, http: 409, condition: "S_ENDORSEMENT credential missing, EXPIRED, or REVOKED where required (ACTIVATE, confirm, REINSTATE, charter driver assignment)" }
  - { id: ERR_LICENSE_CLASS_INSUFFICIENT, http: 409, condition: "Driver license_class != B for school bus dispatch" }
  - { id: ERR_TRAINING_HOURS_INSUFFICIENT, http: 422, condition: "SCHEDULE_TEST requires behind_wheel_minutes >= 2400 and classroom_minutes >= 1200" }
  - { id: ERR_BUS_NOT_IN_SERVICE, http: 409, condition: "Bus status != IN_SERVICE where dispatch/schedule requires it" }
  - { id: ERR_INSPECTION_OVERDUE, http: 409, condition: "bus.next_inspection_due < service/trip date, or an OVERDUE inspection exists on the bus" }
  - { id: ERR_CAPACITY_INSUFFICIENT, http: 422, condition: "bus.capacity < route.student_count or charter passenger_count" }
  - { id: ERR_DRIVER_OVERLAP_CONFLICT, http: 409, condition: "Driver has another CONFIRMED/EN_ROUTE assignment (or scheduled charter) on the same date whose half-open [start,end) interval intersects; adjacency is allowed" }
  - { id: ERR_BUS_OVERLAP_CONFLICT, http: 409, condition: "Bus has another commitment on the same date whose interval intersects (half-open for route assignments; intersecting charter buffered window for charters)" }
  - { id: ERR_CHARTER_BUS_UNAVAILABLE, http: 409, condition: "Another SCHEDULED/IN_PROGRESS charter on same bus+date has a closed buffered [pickup-30, return+30] window intersecting this charter's buffered window" }
  - { id: ERR_INSPECTION_DAY_CONFLICT, http: 409, condition: "Bus has a CONFIRMED assignment on the proposed inspection scheduled_date (whole-day occupation; interval arithmetic does not apply)" }
  - { id: ERR_DRIVER_HOURS_CAP_EXCEEDED, http: 422, condition: "Projected weekly minutes > 2400 soft cap (confirm) or > 2700 hard cap (doubling)" }
  - { id: ERR_DOUBLING_INFEASIBLE, http: 422, condition: "Doubling rejected: absorbing not CONFIRMED on same day, capacity shortfall, or absorbing.planned_end_minute > uncovered route.am_start_minute + 45" }
  - { id: ERR_CHARTER_DATE_PAST, http: 422, condition: "Charter trip_date < logical clock date" }
  - { id: ERR_DISPUTE_WINDOW_CLOSED, http: 409, condition: "Dispute attempted after issued_on + district.billing_dispute_window_days (strictly later; exactly at window end is allowed)" }
  - { id: ERR_OUTSIDE_CONTRACT_TERM, http: 422, condition: "service_date outside contract [start_date, end_date]" }
  - { id: ERR_FUTURE_INCIDENT, http: 422, condition: "incident occurred_at > logical clock" }
  - { id: ERR_INVALID_TIME_RANGE, http: 422, condition: "end minute <= start minute, or inspection reschedule date < clock date" }
  - { id: ERR_DUPLICATE_ROUTE_CODE, http: 409, condition: "route_code already exists on the contract (any non-ARCHIVED status)" }
  - { id: ERR_FUEL_ENTRY_DUPLICATE_MONTH, http: 409, condition: "FuelPriceEntry already exists for (district_id, effective_month)" }
  - { id: ERR_FUEL_ENTRY_MISSING, http: 422, condition: "No FuelPriceEntry for (contract.district_id, period_month) at invoice generate" }
  - { id: ERR_SERVICE_DAY_DATE_CONFLICT, http: 409, condition: "A service day already exists for (contract_id, service_date)" }
  - { id: ERR_DUPLICATE_RIDERSHIP_REPORT, http: 409, condition: "A RidershipReport already exists for the assignment" }
  - { id: ERR_DISCIPLINE_CONTEXT_REQUIRED, http: 422, condition: "student_discipline_flag=true requires route_id and service_day_id" }
  - { id: ERR_CROSS_DISTRICT_REFERENCE, http: 422, condition: "Incident route_id/service_day_id resolve to a different district than incident.district_id" }
  - { id: ERR_BUS_DISTRICT_MISMATCH, http: 409, condition: "bus.district_id != the service-day contract's district_id at confirm/doubling, or != charter contract's district at schedule" }
  - { id: ERR_DRIVER_REQUIRED, http: 422, condition: "Confirm requires both driver_id and bus_id" }
  - { id: ERR_ASSIGNMENTS_IN_FLIGHT, http: 422, condition: "Reconcile blocked: assignments still EN_ROUTE on this service day" }
  - { id: ERR_DISTRICT_CREDIT_HOLD, http: 402, condition: "district.outstanding_balance_cents + quote_price_cents > district.credit_limit_cents at charter schedule" }
  - { id: ERR_INVOICE_PERIOD_INCOMPLETE, http: 422, condition: "Invoice generate: period has no RECONCILED service day (nothing final to bill)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Platform operator; owns districts and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /busops/districts"
      - "POST /busops/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: DistrictAdmin
    description: "District transportation administrator; awards/terminates contracts, requests and approves charters, disputes invoices, acknowledges incidents"
    identity: "entity_backed:District"
    exclusive_operations:
      - "POST /busops/contracts/{id}/award | mark-lost | terminate | amendments"
      - "POST /busops/charter-trips (create) | approve | decline"
      - "POST /busops/invoices/{id}/dispute"
      - "POST /busops/incidents/{id}/acknowledge | return"
    shared_operations:
      - "GET endpoints incl. district-report"
      - "POST /busops/charter-trips/{id}/cancel"
      - "POST /busops/incidents/{id}/close"
  - name: ContractorOps
    description: "Contractor operations manager; bids contracts, manages routes/drivers dispatch, service days, doubling decisions, charters pricing/scheduling"
    identity: opaque
    exclusive_operations:
      - "POST /busops/contracts (create) | submit | withdraw | activate"
      - "POST /busops/routes | deactivate | reactivate"
      - "POST /busops/service-days | open-dispatch | lock | reconcile | cancel | doubling-decisions"
      - "POST /busops/assignments/{id}/confirm | no-show | cancel"
      - "POST /busops/drivers/{id}/discipline"
      - "POST /busops/charter-trips/{id}/quote | schedule | start | complete"
    shared_operations:
      - "GET endpoints"
      - "POST /busops/incidents (create) | submit | close"
      - "POST /busops/charter-trips/{id}/cancel"
      - "POST /busops/ridership-reports"
  - name: HRRecruiter
    description: "Driver recruitment and credentialing pipeline owner"
    identity: opaque
    exclusive_operations:
      - "POST /busops/drivers (create) | events"
      - "POST /busops/training-events"
      - "POST /busops/credentials (create) | revoke"
    shared_operations:
      - "GET endpoints"
  - name: FleetManager
    description: "Fleet maintenance and state inspection compliance owner"
    identity: opaque
    exclusive_operations:
      - "POST /busops/buses (create) | events"
      - "POST /busops/inspections (create) | record-result | reschedule | cancel"
      - "POST /busops/work-orders (create) | events"
    shared_operations:
      - "GET endpoints"
  - name: FinanceClerk
    description: "Billing owner; fuel index entries and invoice lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /busops/fuel-price-entries"
      - "POST /busops/invoices/generate | issue | reissue | pay | write-off"
    shared_operations:
      - "GET endpoints"
  - name: Driver
    description: "Credentialed school bus driver; self-service run execution and reporting"
    identity: "entity_backed:Driver"
    exclusive_operations:
      - "POST /busops/assignments/{id}/start | complete (own assignments only)"
    shared_operations:
      - "GET own driver record and assignments"
      - "POST /busops/incidents (create) | submit"
      - "POST /busops/ridership-reports (own assignments)"
