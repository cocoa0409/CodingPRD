  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: treatment_gated_by_contract_state
        grounds:
          - state_machines.ServiceContract.ACTIVE_to_SUSPENDED
          - state_machines.ServiceContract.SUSPENDED_to_ACTIVE
          - validations[priority=4]
        distinguishing_aspect: |
          Entity pair Treatment -> ServiceContract: scheduling is rejected
          while the contract is SUSPENDED and accepted again after reactivation
          (the SUSPENDED -> ACTIVE cycle restores the gate).
        test_recipe:
          setup:
            - "Property with contract (scope ROACHES, budget 1000000) ACTIVATED then SUSPENDED; unit 101; technician"
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Fir Court", address: "13 Fir St" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/contracts", payload: { vendor_name: "PestCo", scope_pest_types: ["ROACHES"], visits_per_month: 4, coverage_per_incident_cents: 20000, heat_treatment_included: true, monthly_budget_cents: 1000000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: ProgramAdmin, captures: { contract_id: "$.data.id" } }
            - { call: "POST /pest/contracts/${contract_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "101", floor: 1, stack_index: 1, bedrooms: 1 }, as: ProgramAdmin, captures: { unit_id: "$.data.id" } }
            - { call: "POST /pest/technicians", payload: { full_name: "T One", vendor_name: "PestCo" }, as: ProgramAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /pest/contracts/${contract_id}/suspend", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /pest/units/${unit_id}/treatments", payload: { technician_id: "${tech_id}", pest_type: "ROACHES", treatment_type: "CHEMICAL", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T10:00:00Z" }, as: PropertyManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /pest/contracts/${contract_id}/reactivate", payload: {}, as: ProgramAdmin }
            - { call: "POST /pest/units/${unit_id}/treatments", payload: { technician_id: "${tech_id}", pest_type: "ROACHES", treatment_type: "CHEMICAL", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T10:00:00Z" }, as: PropertyManager, captures: { tr_id: "$.data.id", tr_status: "$.data.status" } }
