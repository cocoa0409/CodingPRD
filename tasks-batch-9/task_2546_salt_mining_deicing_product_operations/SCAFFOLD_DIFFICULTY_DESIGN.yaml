              as: LogisticsPlanner
              captures: { routine_status: $.data.status, routine_alloc: $.data.allocated_tons }
          assert:
            - "${c12_status} == ACTIVE, ${c12_cov} == 5527.20 and ${c12_cov_req} == 4000.00 — a SURGE depot DOES count toward pre-season coverage, so activation cleared validations priority 38"
            - "${routine_err} == ERR_NO_ELIGIBLE_STOCKPILE with HTTP 409 (validations priority 36): the pool is empty because the only stocked depot is SURGE and a ROUTINE order admits {OPEN} only"
            - "after the refusal DeliveryOrder.${o12r}.status == REQUESTED, allocated_tons == 0.00, shorted_tons == 0.00, penalty_state == NONE — an empty-pool refusal is NOT a short and accrues no penalty"
            - "GET /salt/allocations?delivery_order_id=${o12r} returns 0 rows at that point"
            - "${storm_status} == ALLOCATED and ${storm_alloc} == 1000.00 — the identical order with storm_priority STORM_EMERGENCY admits {OPEN, SURGE} and draws from the same lot"
            - "${routine_status} == ALLOCATED and ${routine_alloc} == 1000.00 after the depot is posted back to OPEN — nothing about the order changed, only the other entity's state"
            - "the lot now shows tons_reserved == 2000.00 and tons_available == 3527.20 with tons_on_hand still 5527.20"

      - name: mine_citation_re_derives_child_panel_reserve_but_spares_depleted_panels
        grounds:
          - calculations.panel_recoverable_tons
          - calculations.mine_effective_hoist_capacity
          - state_machines.Mine.compliance_state.COMPLIANT_to_CITED
          - state_machines.Panel.PRODUCING_to_DEPLETED
          - entities.Panel.fields.recoverable_tons
        distinguishing_aspect: |
          The child's stored NUMBER, not its state, depends on the parent's state: a CITE on the mine
          strips the pillar-recovery bonus from every live panel (617600.00 -> 585600.00) and derates
          capacity to 19200.00, while a DEPLETED sibling panel is excluded from the re-run input set
          and keeps its frozen 617600.00 — so the two children of one parent legitimately disagree.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T00:00:00Z."
            - "Mine Retsof (NY, rated 24000 t/day) COMPLIANT, effective 24000.00 t/day."
            - "Panel P-LIVE PRODUCING with recoverable_tons 617600.00 and Panel P-DONE moved to DEPLETED, also holding 617600.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: MinePlanner
            - call: "POST /salt/mines"
              payload: { name: "Retsof", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { m13_id: $.data.id }
            - call: "POST /salt/panels"
              payload: { mine_id: "${m13_id}", panel_code: "P-LIVE", gross_tons_in_place: 1000000, extraction_ratio_pct: 60, grade_pct_nacl: 95.0, insolubles_pct: 5.0, pillar_recovery_allowed: true }
              as: MinePlanner
              captures: { live_id: $.data.id, live_rec_before: $.data.recoverable_tons }
            - call: "POST /salt/panels/${live_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${live_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels"
              payload: { mine_id: "${m13_id}", panel_code: "P-DONE", gross_tons_in_place: 1000000, extraction_ratio_pct: 60, grade_pct_nacl: 95.0, insolubles_pct: 5.0, pillar_recovery_allowed: true }
              as: MinePlanner
              captures: { done_id: $.data.id, done_rec_before: $.data.recoverable_tons }
            - call: "POST /salt/panels/${done_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${done_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${done_id}/deplete"
              payload: {}
              as: MinePlanner
              captures: { done_status: $.data.status }
          trigger:
            - call: "POST /salt/mines/${m13_id}/compliance-action"
              payload: { action: "CITE", note: "MSHA citation, ground control plan deficiency" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { m13_compliance: $.data.compliance_state, m13_cap: $.data.effective_hoist_tons_per_day }
          assert:
            - "${live_rec_before} == 617600.00 and ${done_rec_before} == 617600.00 and ${done_status} == DEPLETED"
            - "${m13_compliance} == CITED and ${m13_cap} == 19200.00 (24000 x 1.00 x 0.80)"
            - "Panel.${live_id}.recoverable_tons == 585600.00 — the pillar bonus of 32000.00 requires Mine.compliance_state == COMPLIANT and is stripped on the citation"
            - "Panel.${done_id}.recoverable_tons == 617600.00 — a DEPLETED panel is outside the re-run input set and keeps its frozen value"
            - "Panel.${live_id}.status == PRODUCING and Panel.${done_id}.status == DEPLETED — the citation changed numbers, not child states"
            - "Mine.${m13_id}.hoist_state == HOIST_AVAILABLE — compliance and hoist are independent dimensions, and 0.80 came from the compliance dimension alone"
            - "Mine.${m13_id}.producing_panel_count == 1 (only P-LIVE) and Mine.${m13_id}.version incremented by exactly 1 for the citation"

  - rule_id: resource_temporal_overlap
    instances:
      - name: half_open_hoist_windows_touch_and_aggregate_rate_equals_capacity
        grounds:
          - calculations.hoist_window_aggregate_capacity
          - validations[priority=31]
          - entities.ProductionRun.fields.planned_tons_per_hour
          - entities.Mine.fields.scheduled_hoist_tons_open
          - concurrency_rules[production-run-create-stale-mine]
        distinguishing_aspect: |
          HALF-OPEN windows with an AGGREGATE-SUM capacity sweep: [00:00,06:00) and [06:00,12:00) at
          1000.0000 t/h each are both accepted because the touching endpoint is not an overlap and
          because peak == capacity is allowed (the comparison is `>`), while [05:00,11:00) at the same
          rate peaks at 2000.0000 and is refused. Two genuinely CONCURRENT 500.0000 t/h runs are then
          accepted (sum exactly 1000.0000) and a further 10.0000 t/h run on the same span is refused.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T00:00:00Z."
            - "Mine Retsof (NY, rated 24000 t/day) HOIST_AVAILABLE + COMPLIANT, so mine_hourly_capacity is exactly 1000.00 t/h."
            - "Panel P-1 PRODUCING with recoverable_tons 617600.00."
            - "Run 1 SCHEDULED for 6000 t over [2026-08-11T00:00Z, 06:00Z) and run 2 SCHEDULED for 6000 t over [06:00Z, 12:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: MinePlanner
            - call: "POST /salt/mines"
              payload: { name: "Retsof", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { m14_id: $.data.id }
            - call: "POST /salt/panels"
              payload: { mine_id: "${m14_id}", panel_code: "P-1", gross_tons_in_place: 1000000, extraction_ratio_pct: 60, grade_pct_nacl: 95.0, insolubles_pct: 5.0, pillar_recovery_allowed: true }
              as: MinePlanner
              captures: { p14_id: $.data.id }
            - call: "POST /salt/panels/${p14_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${p14_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${m14_id}"
              payload: {}
              as: MinePlanner
              captures: { mv1: $.data.version }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${m14_id}", panel_id: "${p14_id}", planned_tons: 6000, hoist_window_start: "2026-08-11T00:00:00Z", hoist_window_end: "2026-08-11T06:00:00Z", expected_mine_version: "${mv1}" }
              as: MinePlanner
              captures: { run_a: $.data.id, rate_a: $.data.planned_tons_per_hour }
            - call: "GET /salt/mines/${m14_id}"
              payload: {}
              as: MinePlanner
              captures: { mv2: $.data.version }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${m14_id}", panel_id: "${p14_id}", planned_tons: 6000, hoist_window_start: "2026-08-11T06:00:00Z", hoist_window_end: "2026-08-11T12:00:00Z", expected_mine_version: "${mv2}" }
              as: MinePlanner
              captures: { run_b: $.data.id, rate_b: $.data.planned_tons_per_hour }
          trigger:
            - call: "GET /salt/mines/${m14_id}"
              payload: {}
              as: MinePlanner
              captures: { mv3: $.data.version, open_before: $.data.scheduled_hoist_tons_open }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${m14_id}", panel_id: "${p14_id}", planned_tons: 6000, hoist_window_start: "2026-08-11T05:00:00Z", hoist_window_end: "2026-08-11T11:00:00Z", expected_mine_version: "${mv3}" }
              as: MinePlanner
              captures: { overlap_err: $.data.error_id }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${m14_id}", panel_id: "${p14_id}", planned_tons: 3000, hoist_window_start: "2026-08-11T12:00:00Z", hoist_window_end: "2026-08-11T18:00:00Z", expected_mine_version: "${mv3}" }
              as: MinePlanner
              captures: { run_c: $.data.id, rate_c: $.data.planned_tons_per_hour }
            - call: "GET /salt/mines/${m14_id}"
              payload: {}
              as: MinePlanner
              captures: { mv4: $.data.version }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${m14_id}", panel_id: "${p14_id}", planned_tons: 3000, hoist_window_start: "2026-08-11T15:00:00Z", hoist_window_end: "2026-08-11T21:00:00Z", expected_mine_version: "${mv4}" }
              as: MinePlanner
              captures: { run_d: $.data.id, rate_d: $.data.planned_tons_per_hour }
            - call: "GET /salt/mines/${m14_id}"
              payload: {}
              as: MinePlanner
              captures: { mv5: $.data.version, open_after: $.data.scheduled_hoist_tons_open }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${m14_id}", panel_id: "${p14_id}", planned_tons: 60, hoist_window_start: "2026-08-11T15:00:00Z", hoist_window_end: "2026-08-11T21:00:00Z", expected_mine_version: "${mv5}" }
              as: MinePlanner
              captures: { aggregate_err: $.data.error_id }
          assert:
            - "${rate_a} == 1000.0000 and ${rate_b} == 1000.0000 — both accepted at exactly mine_hourly_capacity, so the comparison is strict `>` and the 06:00 endpoint shared by the two windows is NOT an overlap (half-open, -end sorted before +start)"
            - "${open_before} == 12000.00"
            - "${overlap_err} == ERR_HOIST_CAPACITY_EXCEEDED with HTTP 409 — [05:00,11:00) genuinely overlaps run A between 05:00 and 06:00 for a peak of 2000.0000 t/h"
            - "${rate_c} == 500.0000 and ${rate_d} == 500.0000 — two CONCURRENT runs are legal because the aggregate sweep sums to exactly 1000.0000 t/h over [15:00,18:00)"
            - "${aggregate_err} == ERR_HOIST_CAPACITY_EXCEEDED — adding 10.0000 t/h to that same span peaks at 1010.0000 t/h, proving the rule is a rate SUM and not a pairwise-overlap ban"
            - "${open_after} == 18000.00 (6000 + 6000 + 3000 + 3000) and GET /salt/production-runs?mine_id=${m14_id}&status=SCHEDULED returns exactly 4 rows"
            - "Mine.${m14_id}.version == ${mv5} after the two refusals — a rejected create neither writes a run nor bumps the OCC parent"

      - name: closed_loadout_windows_collide_across_mode_switch_buffer_by_one_minute
        grounds:
          - calculations.depot_loadout_bay_conflict
          - validations[priority=32]
          - entities.Shipment.fields.required_gap_minutes
          - state_machines.Shipment.PLANNED_to_LOADED
        distinguishing_aspect: |
          The SAME rule family with deliberately OPPOSITE geometry: the depot loadout bay is closed on
          both ends, pairwise exclusive, and padded by the larger of the two modes' buffers, so a TRUCK
          shipment starting at exactly 10:45 collides with a RAIL window ending at 10:00 (10:00 + 45 min
          == 10:45, equality collides) while 10:46 is accepted. One minute separates the two outcomes,
          and the buffer is inherited from the PEER's mode even though the new shipment's own buffer
          is 0.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T00:00:00Z."
            - "Depot A (NY, OPEN, loadout 500 t/h) holds one 5527.20 t HIGHWAY_DEICING COVERED lot; Depot B (NY, OPEN) is the destination."
            - "Shipment S1 PLANNED: RAIL, 1000 t, load window [2026-08-12T08:00Z, 10:00Z], required_gap_minutes 45."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: MinePlanner
            - call: "POST /salt/mines"
              payload: { name: "Retsof", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { m15_id: $.data.id }
            - call: "POST /salt/panels"
              payload: { mine_id: "${m15_id}", panel_code: "P-1", gross_tons_in_place: 1000000, extraction_ratio_pct: 60, grade_pct_nacl: 95.0, insolubles_pct: 5.0, pillar_recovery_allowed: true }
              as: MinePlanner
              captures: { p15_id: $.data.id }
            - call: "POST /salt/panels/${p15_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${p15_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${m15_id}"
              payload: {}
              as: MinePlanner
              captures: { m15_v: $.data.version }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${m15_id}", panel_id: "${p15_id}", planned_tons: 6000, hoist_window_start: "2026-08-11T00:00:00Z", hoist_window_end: "2026-08-11T06:00:00Z", expected_mine_version: "${m15_v}" }
              as: MinePlanner
              captures: { r15_id: $.data.id }
            - call: "POST /salt/production-runs/${r15_id}/hoist"
              payload: { hoisted_tons: 6000 }
              as: MinePlanner
            - call: "POST /salt/depots"
              payload: { name: "Depot A", state_code: "NY", covered_capacity_tons: 40000, open_pad_capacity_tons: 20000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 4.00 }
              as: LogisticsPlanner
              captures: { d15a: $.data.id }
            - call: "POST /salt/depots"
              payload: { name: "Depot B", state_code: "NY", covered_capacity_tons: 40000, open_pad_capacity_tons: 20000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 5.00 }
              as: LogisticsPlanner
              captures: { d15b: $.data.id }
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${r15_id}", depot_id: "${d15a}", product_line: "HIGHWAY_DEICING", screen_spec: "COARSE", anticaking_ppm: 30, corrosion_inhibitor_pct: 0.5, input_tons: 6000, moisture_pct: 2.0, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "lab-tech-1"
              captures: { b15: $.data.id }
            - call: "POST /salt/treatment-batches/${b15}/qc-decision"
              payload: { decision: "PASS" }
              as: QualityLab
              as_user_id: "lab-lead-2"
            - call: "GET /salt/stockpile-lots?treatment_batch_id=${b15}"
              payload: {}
              as: LogisticsPlanner
              captures: { lot15: "$.data[0].id" }
            - call: "POST /salt/shipments"
              payload: { stockpile_lot_id: "${lot15}", origin_depot_id: "${d15a}", destination_depot_id: "${d15b}", mode: "RAIL", tons: 1000, load_window_start: "2026-08-12T08:00:00Z", load_window_end: "2026-08-12T10:00:00Z", destination_storage_kind: "COVERED" }
              as: LogisticsPlanner
              captures: { s15_rail: $.data.id, rail_gap: $.data.required_gap_minutes }
          trigger:
            - call: "POST /salt/shipments"
              payload: { stockpile_lot_id: "${lot15}", origin_depot_id: "${d15a}", destination_depot_id: "${d15b}", mode: "TRUCK", tons: 100, load_window_start: "2026-08-12T10:45:00Z", load_window_end: "2026-08-12T12:45:00Z", destination_storage_kind: "COVERED" }
              as: LogisticsPlanner
              captures: { bay_err: $.data.error_id }
            - call: "POST /salt/shipments"
              payload: { stockpile_lot_id: "${lot15}", origin_depot_id: "${d15a}", destination_depot_id: "${d15b}", mode: "TRUCK", tons: 100, load_window_start: "2026-08-12T10:46:00Z", load_window_end: "2026-08-12T12:46:00Z", destination_storage_kind: "COVERED" }
              as: LogisticsPlanner
              captures: { s15_truck: $.data.id, truck_gap: $.data.required_gap_minutes }
          assert:
            - "${rail_gap} == 45 and ${truck_gap} == 0 — required_gap_minutes is stored per shipment from its OWN mode"
            - "${bay_err} == ERR_LOADOUT_BAY_CONFLICT with HTTP 409 — the effective gap is max(0, 45) == 45, so the RAIL peer blocks [07:15, 10:45] and a start at exactly 10:45 collides on the closed upper end"
            - "${s15_truck} exists with status PLANNED — the identical shipment one minute later at 10:46 clears the blocked window"
            - "GET /salt/shipments?origin_depot_id=${d15a} returns exactly 2 rows (the RAIL peer and the 10:46 TRUCK); the refused shipment wrote nothing"
            - "StockpileLot.${lot15}.tons_on_hand is still 5527.20 while both shipments are PLANNED — creating a shipment does not move tonnage; only POST /salt/shipments/{id}/load does"
            - "the geometry is the mirror image of calculations.hoist_window_aggregate_capacity: there touching windows are legal and rates are summed, here touching windows collide and the bay admits exactly one shipment"

