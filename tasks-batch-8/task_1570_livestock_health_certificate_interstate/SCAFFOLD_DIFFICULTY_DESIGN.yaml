          - state_machines.MovementRecord.IN_TRANSIT_to_CANCELLED
        distinguishing_aspect: |
          Depth-2 causal chain from a different trigger (void, not escalate):
          certificate -> VOID voids its ISSUED permit (link 1); the permit
          voiding cancels its IN_TRANSIT movement record (link 2), and that
          cancellation restores the origin premises inventory.
