              captures: { app_a: "$.data.id" }
            - call: "POST /credit-applications/${app_a}/decision"
              payload: { credit_score_band: "PRIME" }
              as: CreditUnderwriter
              as_user_id: "u-uw-1"
            - call: "POST /loans"
              payload: { credit_application_id: "${app_a}", down_payment_cents: 0, imei: "356938035643004" }
