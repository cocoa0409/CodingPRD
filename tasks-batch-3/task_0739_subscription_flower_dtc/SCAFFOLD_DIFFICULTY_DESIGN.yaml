  # =================================================================
  # Rule 6 — boundary-precision checks on different metrics/endpoints
  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: cold_chain_expiry_at_exact_deadline
        grounds:
          - calculations.cold_chain_deadline
          - entities.StemLot.fields.cold_chain_state
          - state_machines.StemAllocation.RESERVED_to_COMMITTED
        distinguishing_aspect: |
          Time metric on POST /confirm-sourced: at clock == usable_until (2026-03-06T00:00:00Z) the lot is
          EXPIRED (>= boundary is inclusive), so commit is rejected with ERR_LOT_EXPIRED.
        test_recipe:
          setup:
            - "Lot L sourced 2026-03-04, shelf_life 48h -> usable_until exactly 2026-03-06T00:00:00Z; a 10-stem RESERVED allocation exists."
