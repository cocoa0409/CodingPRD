  # =====================================================================================
  # RULE 4 — transitive_cascade
  # Instance 1: depth 6, triggered by effectuate (forward cutover).
  # Instance 2: depth 5, triggered by a consent withdrawal (backward unwind).
  # =====================================================================================
  - rule_id: transitive_cascade
    instances:
      - name: effectuate_six_link_cutover_annexes_parcels_accounts_and_plan
        grounds:
          - state_machines.AnnexationCase.ORDINANCE_ADOPTED_to_EFFECTIVE
          - state_machines.UtilityAccount.OUTSIDE_CITY_to_INSIDE_CITY_PENDING_TRANSITION
          - state_machines.UtilityAccount.INSIDE_CITY_PENDING_TRANSITION_to_INSIDE_CITY_ACTIVE
          - state_machines.ServiceCommitment.ACTIVE_to_FULFILLED
          - state_machines.PlanOfServices.PARTIAL_to_READY
          - calculations.plan_service_readiness
          - calculations.utility_effective_rate
        distinguishing_aspect: |
          One effectuate call propagates six links deep, each caused strictly by the previous one:
          (1) case ORDINANCE_ADOPTED -> EFFECTIVE, (2) because the case became effective its four
          PENDING_ANNEX parcels -> INCORPORATED, (3) because those parcels were incorporated their
          two OUTSIDE_CITY utility accounts -> INSIDE_CITY_PENDING_TRANSITION with the surcharge
          dropped (7,500 -> 5,000 and 6,000 -> 4,000 cents), (4) because those accounts entered
          pending transition the WATER and SEWER commitments' activated_account_count reached
          committed_account_count and both -> FULFILLED, (5) because they became FULFILLED the plan
          recomputed service_readiness PARTIAL -> READY, (6) because the plan became READY both
          accounts -> INSIDE_CITY_ACTIVE.
        test_recipe:
          setup:
            - "One StatuteProfile requiring POLICE, FIRE, WATER and SEWER, effective_date_rule IMMEDIATE."
            - "One Municipality with utility_outside_surcharge_pct 0.50, a public-safety provider (POLICE, FIRE; capacity 2) and a utility provider (WATER, SEWER; capacity 2)."
            - "One AnnexationCase (INVOLUNTARY_ORDINANCE) certified with four PENDING_ANNEX parcels worth 100,000,000 cents in total."
            - "A WATER account (monthly_base_cents 5,000) on the first parcel and a SEWER account (monthly_base_cents 4,000) on the second, both OUTSIDE_CITY with the surcharge applied."
            - "An ADOPTED plan of services carrying four ACTIVE/FULFILLED commitments totalling 2,500,000 cents; the WATER and SEWER commitments each declare committed_account_count 1, so the plan sits at service_readiness PARTIAL."
            - "A FINALIZED fiscal analysis with deficit_ratio_pct 0.00, a HELD hearing whose protest period closed FAILED, and an adopted ordinance; logical clock at 2026-10-11T09:00:00Z."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["INVOLUNTARY_ORDINANCE"], required_service_types: ["POLICE", "FIRE", "WATER", "SEWER"], effective_date_rule: "IMMEDIATE" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_ef: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_ef}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000, utility_outside_surcharge_pct: 0.50 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_ef: $.data.id }
            - call: "POST /municipalities/${muni_ef}/service-providers"
              payload: { provider_name: "Cedar Grove Public Safety", service_types: ["POLICE", "FIRE"], concurrent_project_capacity: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_ef}"
              captures: { prov_saf: $.data.id }
            - call: "POST /municipalities/${muni_ef}/service-providers"
              payload: { provider_name: "Cedar Grove Utilities", service_types: ["WATER", "SEWER"], concurrent_project_capacity: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_ef}"
              captures: { prov_ut: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Ann Reyes", contact_email: "ann@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { ow_ef: $.data.id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_ef}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 20000, total_lot_count: 4, developed_lot_count: 4, dwelling_units: 8 }
              as: MunicipalPlanner
              as_user_id: "${muni_ef}"
              captures: { case_ef: $.data.id }
            - call: "POST /annexation-cases/${case_ef}/parcels"
              payload: { primary_owner_id: "${ow_ef}", parcel_apn: "EF-1", assessed_value_cents: 40000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_ef}"
              captures: { ef_p1: $.data.id }
            - call: "POST /annexation-cases/${case_ef}/parcels"
              payload: { primary_owner_id: "${ow_ef}", parcel_apn: "EF-2", assessed_value_cents: 30000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_ef}"
              captures: { ef_p2: $.data.id }
            - call: "POST /annexation-cases/${case_ef}/parcels"
              payload: { primary_owner_id: "${ow_ef}", parcel_apn: "EF-3", assessed_value_cents: 20000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_ef}"
              captures: { ef_p3: $.data.id }
            - call: "POST /annexation-cases/${case_ef}/parcels"
              payload: { primary_owner_id: "${ow_ef}", parcel_apn: "EF-4", assessed_value_cents: 10000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_ef}"
              captures: { ef_p4: $.data.id }
            - call: "POST /annexation-cases/${case_ef}/certify-territory"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_ef}"
            - call: "POST /utility-accounts"
