scenario: |
  Insurance claims management system: claim intake with multi-channel reporting, policy validity
  verification, duplicate claim detection, and reporting time limit check; field investigation and
  loss assessment with damage photo upload, third-party adjuster assignment, and repair shop
  estimate integration; multi-level review workflow with rule-based auto-approval thresholds,
  manual review for high-amount claims, and reviewer separation of duties; payout calculation
  with deductible, coinsurance ratio, and coverage limit application, multi-policy coordination,
  salvage value deduction, and subrogation recovery; denial appeal with reconsideration request,
  secondary review, and final decision recording; anti-fraud risk control with claim-pattern
  analysis, repair-shop collusion detection, and document authenticity verification;
  event-driven synchronization with policy, payment, and banking systems; audit logging for all
  claim status changes and approval actions.

domain_name: insurance-claims
api_prefix: /claims

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - idempotency
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Policy
    parent: null
    common_fields: true
    fields:
      - name: policy_number
        type: string
        source: input
        description: External insurer policy identifier; unique
        constraints: "Unique; uppercase alphanumeric, length 8-24"
      - name: insured_party_id
        type: string
        source: input
        description: Identifier of the insured (a Customer role X-User-ID)
      - name: coverage_type
        type: enum
        source: input
        description: Coverage line of business
        constraints: "One of {AUTO, PROPERTY, LIABILITY}"
      - name: coverage_limit_cents
        type: integer
        source: input
        description: Per-occurrence maximum payable, in cents
        constraints: ">= 0"
      - name: deductible_cents
        type: integer
        source: input
        description: Insured's per-claim out-of-pocket, in cents
        constraints: ">= 0"
      - name: coinsurance_ratio
        type: number
        source: input
        description: Insurer's share of post-deductible loss (0.0-1.0)
        constraints: "0 <= value <= 1; 4 decimal places"
      - name: effective_from
        type: datetime
        source: input
        description: Inclusive policy effective start (ISO 8601 UTC)
      - name: effective_to
        type: datetime
        source: input
        description: Exclusive policy effective end (ISO 8601 UTC)
      - name: reporting_window_days
        type: integer
        source: input
        description: Maximum number of days between loss_date and claim intake
        constraints: ">= 1"
        default: 30
      - name: status
        type: enum
        source: system
        description: Policy administrative status
        constraints: "One of {ACTIVE, SUSPENDED, EXPIRED, CANCELLED}"
        default: ACTIVE

  - name: Adjuster
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Adjuster legal name
      - name: license_number
        type: string
        source: input
        description: Regulator license id; unique
        constraints: "Unique"
      - name: specialty
        type: enum
        source: input
        description: Coverage line they may investigate
        constraints: "One of {AUTO, PROPERTY, LIABILITY}"
      - name: status
        type: enum
        source: system
        description: Roster status
        constraints: "One of {ACTIVE, SUSPENDED}"
        default: ACTIVE

  - name: RepairShop
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Repair shop business name
      - name: tax_id
        type: string
        source: input
        description: Government tax identifier; unique
        constraints: "Unique"
      - name: trust_score
        type: number
        source: computed
        description: Anti-collusion trust score in [0.00, 1.00]; starts at 1.00 and decays on collusion flags
        default: 1.00
        constraints: "0 <= value <= 1; 2 decimal places"
      - name: status
        type: enum
        source: system
        description: Listing status; BLACKLISTED if trust_score < 0.40
        constraints: "One of {ACTIVE, BLACKLISTED}"
        default: ACTIVE

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - name: claim_number
        type: string
        source: system
        description: Server-minted human-readable id of the form CLM-YYYYMMDD-NNNN
        constraints: "Unique"
      - name: policy_id
        type: string
        source: input
        description: FK to Policy.id
      - name: claimant_id
        type: string
        source: input
        description: X-User-ID of the Customer filing the claim
      - name: report_channel
        type: enum
        source: input
        description: Intake channel
        constraints: "One of {WEB, MOBILE, PHONE, AGENT}"
      - name: idempotency_key
        type: string
        source: input
        description: Client-supplied idempotency key for duplicate intake suppression
        constraints: "Unique per (claimant_id, idempotency_key) within 24h"
      - name: loss_date
        type: datetime
        source: input
        description: When the loss occurred (ISO 8601 UTC)
      - name: reported_at
        type: datetime
        source: system
        description: Server timestamp at intake
      - name: incident_description
        type: string
        source: input
        description: Free-text description of the loss
      - name: claimed_amount_cents
        type: integer
        source: input
        description: Insured's stated loss amount in cents
        constraints: "> 0"
      - name: assessed_loss_cents
        type: integer
        source: computed
        description: Final assessed loss after investigation; 0 until investigation completes
        default: 0
      - name: salvage_value_cents
        type: integer
        source: input
        description: Value of damaged property recoverable as salvage
        default: 0
        constraints: ">= 0"
      - name: subrogation_recovery_cents
        type: integer
        source: system
        description: Amount recovered from a third party post-payout
        default: 0
      - name: status
        type: enum
        source: system
        description: Lifecycle status of the claim
        constraints: "One of {INTAKE, UNDER_INVESTIGATION, UNDER_REVIEW, APPROVED, DENIED, PAID, APPEALED, CLOSED}"
        default: INTAKE
      - name: review_path
        type: enum
        source: computed
        description: Set by intake validation; AUTO if claimed_amount_cents <= AUTO_APPROVAL_THRESHOLD_CENTS, else MANUAL
        constraints: "One of {AUTO, MANUAL}"
      - name: gross_payout_cents
        type: integer
        source: computed
        description: Pre-recovery payout, computed at approval; see calculation rule gross_payout
      - name: net_payout_cents
        type: integer
        source: computed
        description: Final payable amount after salvage and subrogation; differs from gross when recoveries exist
      - name: denial_reason
        type: string
        source: system
        description: Populated when status transitions to DENIED
        default: null
      - name: fraud_score
        type: number
        source: computed
        description: Anti-fraud risk score in [0.00, 1.00]; computed at submission for review
        default: 0.00

  - name: Investigation
    parent: Claim
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: FK to Claim.id
      - name: adjuster_id
        type: string
        source: input
        description: FK to Adjuster.id; assigned at investigation start
      - name: photo_urls
        type: array
        source: input
        description: List of damage photo URLs
        constraints: "Non-empty; each entry must be a valid http(s) URL"
      - name: assessed_loss_cents
        type: integer
        source: input
        description: Adjuster's final loss assessment in cents
        constraints: ">= 0"
      - name: document_authenticity_passed
        type: boolean
        source: input
        description: Whether the adjuster verified document authenticity
        default: false
      - name: status
        type: enum
        source: system
        description: Investigation lifecycle
        constraints: "One of {OPEN, COMPLETED, REJECTED}"
        default: OPEN

  - name: EstimateLineItem
    parent: Investigation
    common_fields: false
    fields:
      - name: investigation_id
        type: string
        source: input
        description: FK to Investigation.id
      - name: repair_shop_id
        type: string
        source: input
        description: FK to RepairShop.id
      - name: description
        type: string
        source: input
        description: Description of repair work
      - name: amount_cents
        type: integer
        source: input
        description: Quoted amount in cents
        constraints: "> 0"

  - name: ReviewDecision
    parent: Claim
    common_fields: false
    fields:
      - name: claim_id
        type: string
        source: input
        description: FK to Claim.id
      - name: reviewer_id
        type: string
        source: system
        description: X-User-ID of the Reviewer who recorded the decision
      - name: review_level
        type: enum
        source: system
        description: Which review tier produced this record
        constraints: "One of {PRIMARY, SECONDARY}"
      - name: outcome
        type: enum
        source: input
        description: Decision outcome
        constraints: "One of {APPROVE, DENY}"
      - name: rationale
        type: string
        source: input
        description: Reviewer's written rationale
      - name: decided_at
        type: datetime
        source: system
        description: Server timestamp of the decision

  - name: Appeal
    parent: Claim
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: FK to Claim.id
      - name: requestor_id
        type: string
        source: input
        description: X-User-ID of the Customer raising the appeal
      - name: grounds
        type: string
        source: input
        description: Free-text appeal grounds
      - name: secondary_reviewer_id
        type: string
        source: system
        description: Reviewer assigned for secondary review (must differ from primary)
      - name: status
        type: enum
        source: system
        description: Appeal lifecycle
        constraints: "One of {SUBMITTED, UNDER_RECONSIDERATION, UPHELD_DENIAL, OVERTURNED, WITHDRAWN}"
        default: SUBMITTED
      - name: final_decision_recorded_at
        type: datetime
        source: system
        description: Server timestamp when secondary review concluded

  - name: Payout
    parent: Claim
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: FK to Claim.id; unique per claim
        constraints: "Unique"
      - name: amount_cents
        type: integer
        source: computed
        description: Snapshot of Claim.net_payout_cents at the moment of payout creation
      - name: bank_reference
        type: string
        source: system
        description: Pseudo-reference returned by the banking gateway
      - name: status
        type: enum
        source: system
        description: Payout lifecycle
        constraints: "One of {PENDING, SETTLED, REVERSED}"
        default: PENDING
      - name: settled_at
        type: datetime
        source: system
        description: Server timestamp of bank settlement

  - name: FraudFlag
    parent: Claim
    common_fields: false
    fields:
      - name: claim_id
        type: string
        source: input
        description: FK to Claim.id
      - name: signal
        type: enum
        source: system
        description: Risk signal type
        constraints: "One of {DUPLICATE_PATTERN, REPAIR_SHOP_COLLUSION, DOCUMENT_FORGERY, RAPID_RESUBMISSION}"
      - name: severity
        type: number
        source: system
        description: Signal severity contribution to fraud_score, in [0.00, 1.00]

  - name: AuditLogEntry
    parent: Claim
    common_fields: false
    fields:
      - name: claim_id
        type: string
        source: input
        description: FK to Claim.id
      - name: actor_id
        type: string
        source: system
        description: X-User-ID of the actor; "system" for clock/sweep events
      - name: actor_role
        type: string
        source: system
        description: Role string at the time of action
      - name: event_type
        type: enum
        source: system
        description: Audit event type
        constraints: "One of {STATUS_CHANGE, REVIEW_DECISION, APPEAL_DECISION, PAYOUT_EVENT, FRAUD_FLAG_ADDED}"
      - name: from_state
        type: string
        source: system
        description: Prior state (where applicable)
      - name: to_state
        type: string
        source: system
        description: New state (where applicable)
      - name: payload
        type: object
        source: system
        description: Structured event payload (e.g., outcome, severity, amounts)

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Claim
    initial_state: INTAKE
    terminal_states: [CLOSED]
    transitions:
      - from: INTAKE
        to: UNDER_INVESTIGATION
        trigger: "POST /claims/{id}/investigations"
        actor: Adjuster
        preconditions:
          - "Claim.status == INTAKE"
          - "Policy.status == ACTIVE"
          - "loss_date is within Policy.effective_from (inclusive) and Policy.effective_to (exclusive)"
          - "(reported_at - loss_date).days <= Policy.reporting_window_days"
          - "Adjuster.status == ACTIVE and Adjuster.specialty == Policy.coverage_type"
        side_effects:
          - "Investigation row created in OPEN state with adjuster_id"
          - "AuditLogEntry recorded with event_type=STATUS_CHANGE, from_state=INTAKE, to_state=UNDER_INVESTIGATION"

      - from: UNDER_INVESTIGATION
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/submit-for-review"
        actor: Adjuster
        preconditions:
          - "Claim.status == UNDER_INVESTIGATION"
          - "Investigation.status == OPEN"
          - "len(Investigation.photo_urls) >= 1"
          - "Investigation.document_authenticity_passed == true"
          - "At least one EstimateLineItem exists for the Investigation"
        side_effects:
          - "Investigation.status set to COMPLETED"
          - "Claim.assessed_loss_cents copied from Investigation.assessed_loss_cents"
          - "Calculation gross_payout runs and writes Claim.gross_payout_cents"
          - "Calculation net_payout runs and writes Claim.net_payout_cents (with subrogation_recovery_cents=0 at this point)"
          - "Calculation fraud_score runs and writes Claim.fraud_score; if any FraudFlag with signal=REPAIR_SHOP_COLLUSION exists, the linked RepairShop's trust_score decays per calculation repair_shop_trust_decay (cascade depth 3: submit -> trust_score decay -> RepairShop.status -> BLACKLISTED if score < 0.40)"
          - "Claim.review_path is set: AUTO if claimed_amount_cents <= AUTO_APPROVAL_THRESHOLD_CENTS (=200000) AND fraud_score < 0.30, else MANUAL"
          - "AuditLogEntry STATUS_CHANGE INVESTIGATION -> UNDER_REVIEW"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /claims/{id}/decisions (auto path) OR POST /claims/{id}/decisions with outcome=APPROVE (manual path)"
        actor: system | Reviewer
        preconditions:
          - "Claim.status == UNDER_REVIEW"
          - "If review_path == AUTO: trigger may be a system call; reviewer_id == \"system\""
          - "If review_path == MANUAL: actor.role == Reviewer AND actor.id != Investigation.adjuster_id (segregation of duties)"
        side_effects:
          - "ReviewDecision row recorded with review_level=PRIMARY, outcome=APPROVE"
          - "AuditLogEntry REVIEW_DECISION recorded"
          - "AuditLogEntry STATUS_CHANGE UNDER_REVIEW -> APPROVED"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /claims/{id}/decisions with outcome=DENY"
        actor: Reviewer
        preconditions:
          - "Claim.status == UNDER_REVIEW"
          - "review_path == MANUAL"
          - "actor.id != Investigation.adjuster_id"
        side_effects:
          - "Claim.denial_reason populated from request rationale"
          - "ReviewDecision row recorded with review_level=PRIMARY, outcome=DENY"
          - "AuditLogEntry REVIEW_DECISION + STATUS_CHANGE UNDER_REVIEW -> DENIED"

      - from: APPROVED
        to: PAID
        trigger: "POST /claims/{id}/payouts"
        actor: PayoutOfficer
        preconditions:
          - "Claim.status == APPROVED"
          - "No existing Payout for this claim"
          - "Claim.net_payout_cents > 0"
        side_effects:
          - "Payout row created with status=PENDING, amount_cents = Claim.net_payout_cents"
          - "System emits banking_dispatch event; on settle, Payout.status -> SETTLED, Claim transitions to CLOSED via auto-transition (cascade depth 3: payout creation -> bank settle event -> Payout.SETTLED -> Claim.CLOSED)"
          - "AuditLogEntry PAYOUT_EVENT + STATUS_CHANGE APPROVED -> PAID"

      - from: PAID
        to: CLOSED
        trigger: "system: Payout.status transitions to SETTLED via POST /_events/bank-settle"
        actor: system
        preconditions:
          - "Claim.status == PAID"
          - "Payout.status == SETTLED"
        side_effects:
          - "Policy event-sync emitted (POLICY_CLAIM_CLOSED) via event log"
          - "AuditLogEntry STATUS_CHANGE PAID -> CLOSED"

      - from: DENIED
        to: APPEALED
        trigger: "POST /claims/{id}/appeals"
        actor: Customer
        preconditions:
          - "Claim.status == DENIED"
          - "actor.id == Claim.claimant_id"
          - "No prior Appeal exists for this claim (only one appeal allowed)"
        side_effects:
          - "Appeal row created with status=SUBMITTED"
          - "Appeal automatically advances to UNDER_RECONSIDERATION on creation"
          - "Claim.status -> APPEALED"
          - "AuditLogEntry APPEAL_DECISION + STATUS_CHANGE DENIED -> APPEALED"

      - from: APPEALED
        to: APPROVED
        trigger: "POST /claims/{id}/appeals/{appeal_id}/decisions with outcome=OVERTURN"
        actor: Reviewer
        preconditions:
          - "Claim.status == APPEALED"
          - "Appeal.status == UNDER_RECONSIDERATION"
          - "actor.id != Investigation.adjuster_id"
          - "actor.id != reviewer_id of any ReviewDecision with review_level=PRIMARY for this claim (separation of duties: secondary reviewer must differ from primary)"
        side_effects:
          - "ReviewDecision row recorded with review_level=SECONDARY, outcome=APPROVE"
          - "Appeal.status -> OVERTURNED; Appeal.final_decision_recorded_at set"
          - "Claim.gross_payout_cents and Claim.net_payout_cents recomputed"
          - "AuditLogEntry STATUS_CHANGE APPEALED -> APPROVED"

      - from: APPEALED
        to: CLOSED
        trigger: "POST /claims/{id}/appeals/{appeal_id}/decisions with outcome=UPHOLD"
        actor: Reviewer
        preconditions:
          - "Claim.status == APPEALED"
          - "Appeal.status == UNDER_RECONSIDERATION"
          - "actor.id != Investigation.adjuster_id"
          - "actor.id != primary reviewer_id"
        side_effects:
          - "ReviewDecision row recorded with review_level=SECONDARY, outcome=DENY"
          - "Appeal.status -> UPHELD_DENIAL; Appeal.final_decision_recorded_at set"
          - "AuditLogEntry STATUS_CHANGE APPEALED -> CLOSED"

      - from: PAID
        to: PAID
        trigger: "POST /claims/{id}/subrogations (third-party recovery received)"
        actor: PayoutOfficer
        preconditions:
          - "Claim.status == PAID"
          - "Payout.status == SETTLED"
          - "request.amount_cents > 0"
        side_effects:
          - "Claim.subrogation_recovery_cents incremented"
          - "Calculation net_payout recomputed; net_payout_cents reflects new recovery (does not retroactively adjust the Payout row, which records original gross-of-recovery payment; recovery is a ledger entry)"
          - "Compensating invariant: gross_payout_cents - subrogation_recovery_cents - salvage_value_cents == net_payout_cents (held throughout)"
          - "AuditLogEntry PAYOUT_EVENT (subrogation) recorded"

  - entity: Investigation
    initial_state: OPEN
    terminal_states: [COMPLETED, REJECTED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "Implicit: Claim transition UNDER_INVESTIGATION -> UNDER_REVIEW"
        actor: system
        preconditions:
          - "All Claim transition preconditions for submit-for-review hold"
        side_effects:
          - "Investigation.status -> COMPLETED"

      - from: OPEN
        to: REJECTED
        trigger: "POST /claims/{id}/investigations/{inv_id}/reject"
        actor: Adjuster
        preconditions:
          - "Investigation.status == OPEN"
          - "actor.id == Investigation.adjuster_id"
        side_effects:
          - "Claim.status reverts to INTAKE (revert/branch); Claim.review_path cleared"
          - "AuditLogEntry STATUS_CHANGE for both Claim and Investigation"

  - entity: Appeal
    initial_state: SUBMITTED
    terminal_states: [UPHELD_DENIAL, OVERTURNED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_RECONSIDERATION
        trigger: "Auto on appeal creation"
        actor: system
        preconditions: ["Appeal.status == SUBMITTED"]
        side_effects: ["No additional cascade"]

      - from: UNDER_RECONSIDERATION
        to: OVERTURNED
        trigger: "POST /claims/{id}/appeals/{appeal_id}/decisions with outcome=OVERTURN"
        actor: Reviewer
        preconditions:
          - "Appeal.status == UNDER_RECONSIDERATION"
          - "actor.id != primary reviewer_id"
          - "actor.id != Investigation.adjuster_id"
        side_effects:
          - "Linked Claim transitions APPEALED -> APPROVED"

      - from: UNDER_RECONSIDERATION
        to: UPHELD_DENIAL
        trigger: "POST /claims/{id}/appeals/{appeal_id}/decisions with outcome=UPHOLD"
        actor: Reviewer
        preconditions:
          - "Appeal.status == UNDER_RECONSIDERATION"
          - "actor.id != primary reviewer_id"
          - "actor.id != Investigation.adjuster_id"
        side_effects:
          - "Linked Claim transitions APPEALED -> CLOSED"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "DELETE /claims/{id}/appeals/{appeal_id}"
        actor: Customer
        preconditions:
          - "Appeal.status == SUBMITTED"
          - "actor.id == Appeal.requestor_id"
        side_effects:
          - "Linked Claim reverts from APPEALED back to DENIED"
          - "AuditLogEntry STATUS_CHANGE recorded"

  - entity: Payout
    initial_state: PENDING
    terminal_states: [SETTLED, REVERSED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /_events/bank-settle"
        actor: system
        preconditions:
          - "Payout.status == PENDING"
          - "Linked Claim.status == PAID"
        side_effects:
          - "Payout.settled_at set; Payout.bank_reference set"
          - "Cascades to Claim PAID -> CLOSED"

      - from: PENDING
        to: REVERSED
        trigger: "POST /_events/bank-fail"
        actor: system
        preconditions:
          - "Payout.status == PENDING"
        side_effects:
          - "Linked Claim reverts PAID -> APPROVED (compensating action: gross_payout_cents and net_payout_cents must remain unchanged; only the Payout row reverses)"
          - "AuditLogEntry PAYOUT_EVENT recorded"

  - entity: RepairShop
    initial_state: ACTIVE
    terminal_states: [BLACKLISTED]
    transitions:
      - from: ACTIVE
        to: BLACKLISTED
        trigger: "Auto when trust_score decays below 0.40"
        actor: system
        preconditions:
          - "RepairShop.trust_score < 0.40"
        side_effects:
          - "All EstimateLineItem rows referencing this shop in OPEN Investigations are flagged; future estimates from this shop are rejected (ERR_REPAIR_SHOP_BLACKLISTED)"
          - "AuditLogEntry STATUS_CHANGE recorded under each affected Claim"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two intake requests with the same idempotency_key and claimant_id submitted simultaneously"
    guarantee: "At most one Claim row created; second receives ERR_DUPLICATE_CLAIM_INTAKE referencing the surviving Claim.id"
    error_id: ERR_DUPLICATE_CLAIM_INTAKE
    http_status: 409
    serialization: "First-writer-wins on (claimant_id, idempotency_key) within 24h"

  - scenario: "Primary reviewer approves while another reviewer denies the same claim simultaneously"
    guarantee: "Exactly one ReviewDecision created at PRIMARY level; loser is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Claim.status leaving UNDER_REVIEW"

  - scenario: "Two Payout creations for the same claim race"
    guarantee: "Exactly one Payout row exists per Claim"
    error_id: ERR_PAYOUT_ALREADY_EXISTS
    http_status: 409
    serialization: "First-writer-wins on Payout.claim_id uniqueness"

  - scenario: "Adjuster assignment race: two POST /investigations for the same claim"
    guarantee: "At most one Investigation row per Claim (only when Claim.status == INTAKE)"
    error_id: ERR_INVESTIGATION_ALREADY_OPEN
    http_status: 409
    serialization: "First-writer-wins on Claim.status transition out of INTAKE"

  - scenario: "Subrogation recorded while a bank-fail reversal arrives"
    guarantee: "If reversal wins, subrogation is rejected because Claim.status no longer == PAID"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Claim.status"

  - scenario: "Appeal creation race: two appeals for the same denied claim"
    guarantee: "Only one Appeal per Claim allowed"
    error_id: ERR_APPEAL_ALREADY_EXISTS
    http_status: 409
    serialization: "First-writer-wins on Appeal.claim_id uniqueness"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: gross_payout
    trigger: "On Claim transition UNDER_INVESTIGATION -> UNDER_REVIEW (via submit-for-review). Recomputed on appeal OVERTURNED transition."
    algorithm: forward_looking
    formula: |
      # All cents (integers). Steps in this exact order (no per-step rounding required).
      L  = Claim.assessed_loss_cents
      D  = Policy.deductible_cents
      C  = Policy.coinsurance_ratio       # 0.0..1.0, 4 decimal
      M  = Policy.coverage_limit_cents
      after_deductible = max(0, L - D)
      insurer_share_raw = after_deductible * C
      insurer_share_cents = round_half_up(insurer_share_raw)        # round once at the end
      gross_payout_cents = min(insurer_share_cents, M)
      return gross_payout_cents
    input_set: "Single (Claim, Policy) pair. Loss cents from Investigation. Coinsurance ratio and deductible from Policy. Coverage limit from Policy."
    constants:
      AUTO_APPROVAL_THRESHOLD_CENTS: 200000   # $2,000.00
    precision: "Integer cents. Coinsurance multiplication produces a float; round_half_up to integer cents BEFORE applying the coverage_limit min."
    variants:
      - name: estimate_at_intake
        when: "Pre-investigation preview only (read-only) requested via GET /claims/{id}/estimate"
        difference: "Uses Claim.claimed_amount_cents as L instead of assessed_loss_cents. Salvage and subrogation are NOT subtracted (this is the gross-payout PROVISIONAL view)."
      - name: final_at_review
        when: "Triggered by submit-for-review transition; pinned into Claim.gross_payout_cents"
        difference: "Uses Claim.assessed_loss_cents (final adjuster figure)."

  - name: net_payout
    trigger: "Recomputed at every transition that mutates assessed_loss_cents, salvage_value_cents, or subrogation_recovery_cents (submit-for-review, appeal OVERTURNED, subrogation post)."
    algorithm: aggregation
    formula: |
      net_payout_cents = max(0, gross_payout_cents - salvage_value_cents - subrogation_recovery_cents)
      return net_payout_cents
    input_set: "Same Claim row's gross_payout_cents, salvage_value_cents, subrogation_recovery_cents."
    constants: {}
    precision: "Integer cents; max with 0 to prevent negative payouts."
    variants:
      - name: at_approval
        when: "On submit-for-review transition; subrogation_recovery_cents is 0 at this point"
        difference: "net_payout_cents == gross_payout_cents - salvage_value_cents (no recovery yet)"
      - name: post_recovery
        when: "After POST /claims/{id}/subrogations is recorded"
        difference: "net_payout_cents = gross_payout_cents - salvage_value_cents - subrogation_recovery_cents (gross unchanged; only net moves)"

  - name: fraud_score
    trigger: "On Claim transition UNDER_INVESTIGATION -> UNDER_REVIEW. Inputs are the FraudFlag rows recorded for this claim plus pattern signals derived from the last LOOKBACK_DAYS of claims."
    algorithm: weighted_scoring
    formula: |
      # Weighted, capped score in [0.00, 1.00], 2 decimal precision.
      # Step 1 — collect signals (each contributes one or more flags):
      flags = list_FraudFlag(claim_id)
      pattern_score = sum(f.severity for f in flags if f.signal == DUPLICATE_PATTERN)
      collusion_score = sum(f.severity for f in flags if f.signal == REPAIR_SHOP_COLLUSION)
      forgery_score = sum(f.severity for f in flags if f.signal == DOCUMENT_FORGERY)
      rapid_score = sum(f.severity for f in flags if f.signal == RAPID_RESUBMISSION)
      # Step 2 — weighted combination with explicit weights (sum to 1.0):
      W_PATTERN, W_COLLUSION, W_FORGERY, W_RAPID = 0.30, 0.30, 0.30, 0.10
      raw = W_PATTERN*min(1, pattern_score) + W_COLLUSION*min(1, collusion_score) + W_FORGERY*min(1, forgery_score) + W_RAPID*min(1, rapid_score)
      # Step 3 — round once to 2 decimal places, then clamp:
      score = clamp(round_half_up(raw, 2), 0.00, 1.00)
      return score
    input_set: "FraudFlag rows for this claim. Severity contributions are clipped at 1.0 within each signal type before the weighted sum (per-signal cap, then weighted sum), then rounded once."
    constants:
      W_PATTERN: 0.30
      W_COLLUSION: 0.30
      W_FORGERY: 0.30
      W_RAPID: 0.10
      LOOKBACK_DAYS: 90
      AUTO_FRAUD_GATE: 0.30
    precision: "Round to 2 decimal places using round_half_up exactly once (after the weighted sum). Per-signal min(1,…) is integer-safe."
    variants: []

  - name: review_path_assignment
    trigger: "On Claim transition UNDER_INVESTIGATION -> UNDER_REVIEW (after gross_payout and fraud_score are pinned)."
    algorithm: threshold
    formula: |
      if Claim.claimed_amount_cents <= AUTO_APPROVAL_THRESHOLD_CENTS and Claim.fraud_score < AUTO_FRAUD_GATE:
        Claim.review_path = AUTO
      else:
        Claim.review_path = MANUAL
    input_set: "Single Claim row's claimed_amount_cents and fraud_score."
    constants:
      AUTO_APPROVAL_THRESHOLD_CENTS: 200000   # $2,000.00 boundary; <= is AUTO, > is MANUAL
      AUTO_FRAUD_GATE: 0.30                   # < is AUTO, >= is MANUAL
    precision: "Integer compare for amount; 2-decimal compare for fraud_score; both inclusive/exclusive boundaries pinned above."
    variants: []

  - name: repair_shop_trust_decay
    trigger: "On Claim transition UNDER_INVESTIGATION -> UNDER_REVIEW for any RepairShop that appears in a FraudFlag with signal=REPAIR_SHOP_COLLUSION on this claim. The per_flag variant is the canonical (pinned) algorithm; the pattern_threshold variant exists at GET /repair-shops/{id} as a what-if projection only and does NOT mutate state."
    algorithm: decay_function
    formula: |
      # Canonical (per_flag): for each collusion FraudFlag against this shop on this claim,
      # apply one step decay in chronological order:
      for flag in chronological(collusion_flags_on_this_shop_on_this_claim):
        new_trust_score = max(0.00, current_trust_score - DECAY_PER_FLAG)
      # If after all steps new_trust_score < BLACKLIST_THRESHOLD, RepairShop.status -> BLACKLISTED.
    input_set: "Per RepairShop. Iterates over distinct collusion FraudFlag events ordered by created_at ascending."
    constants:
      DECAY_PER_FLAG: 0.20
      BLACKLIST_THRESHOLD: 0.40
      COLLUSION_PATTERN_THRESHOLD: 3
    precision: "2 decimal places; never below 0.00."
    variants:
      - name: per_flag
        when: "Canonical: state-mutating path on submit-for-review."
        difference: "Each FraudFlag of signal=REPAIR_SHOP_COLLUSION decays trust_score by DECAY_PER_FLAG independently. With N collusion flags on the same shop in one submission, trust_score decays by N * DECAY_PER_FLAG (capped at 0.00). Pinned for state mutation."
      - name: pattern_threshold
        when: "Read-only projection at GET /repair-shops/{id} when client passes ?projection=pattern_threshold; never mutates state."
        difference: "If COLLUSION_PATTERN_THRESHOLD or more flags exist for this shop in the lookback window (LOOKBACK_DAYS), the projected trust_score is min(current_trust_score, 0.20) — i.e., a single aggregate hit, not one-per-flag. With 3 collusion flags on a shop currently at 1.00, per_flag yields 0.40 (1.00 - 3*0.20) while pattern_threshold yields 0.20. Different result for identical inputs."

  - name: claim_number_minting
    trigger: "On POST /claims (intake)."
    algorithm: chronological
    formula: |
      # Format: CLM-YYYYMMDD-NNNN where NNNN is a daily-zero-padded sequence of claims created on the same UTC date.
      yyyymmdd = utc_date_of(now())
      seq = 1 + count(Claim.created_at on yyyymmdd)
      claim_number = "CLM-" + yyyymmdd + "-" + zfill(seq, 4)
    input_set: "All Claim rows whose created_at UTC date == today."
    constants: {}
    precision: "Sequence is integer; padding to 4 digits."
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and well-formed"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: "all except POST /_events/* and POST /_clock/advance which require X-Admin-Token"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the declared roles in §1.7; for admin endpoints, X-Admin-Token matches"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-referenced resources exist (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target Claim is in the required state for the operation (e.g., DENIED for appeals; APPROVED for payouts; UNDER_REVIEW for decisions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /claims/{id}/* action endpoints"

  - priority: 5
    category: business_referential
    check: "Policy.id referenced in claim intake must reference an existing Policy whose status == ACTIVE"
    error_id: ERR_POLICY_INACTIVE
    http_status: 422
    applies_to: "POST /claims"

  - priority: 6
    category: business_temporal
    check: "Claim.loss_date must lie within Policy.effective_from (inclusive) and Policy.effective_to (exclusive)"
    error_id: ERR_LOSS_OUTSIDE_POLICY_PERIOD
    http_status: 422
    applies_to: "POST /claims"

  - priority: 7
    category: business_temporal
    check: "(reported_at - loss_date).days <= Policy.reporting_window_days; reported_at uses server clock (or advanced clock)"
    error_id: ERR_REPORTING_WINDOW_EXCEEDED
    http_status: 422
    applies_to: "POST /claims"

  - priority: 8
    category: business_constraint
    check: "Idempotency: if (claimant_id, idempotency_key) already exists with created_at within last 24h, reject"
    error_id: ERR_DUPLICATE_CLAIM_INTAKE
    http_status: 409
    applies_to: "POST /claims"

  - priority: 9
    category: business_safety
    check: "Anti-fraud: when Claim.fraud_score >= 0.80 at submit-for-review, transition is blocked and a manual fraud-hold is required"
    error_id: ERR_FRAUD_HOLD
    http_status: 422
    applies_to: "POST /claims/{id}/submit-for-review"

  - priority: 10
    category: business_safety
    check: "Document authenticity: Investigation.document_authenticity_passed must be true at submit-for-review"
    error_id: ERR_DOCUMENT_AUTHENTICITY_FAILED
    http_status: 422
    applies_to: "POST /claims/{id}/submit-for-review"

  - priority: 11
    category: business_referential
    check: "Adjuster.specialty must equal Policy.coverage_type at investigation start"
    error_id: ERR_ADJUSTER_SPECIALTY_MISMATCH
    http_status: 422
    applies_to: "POST /claims/{id}/investigations"

  - priority: 12
    category: business_constraint
    check: "Repair shop on EstimateLineItem must not be BLACKLISTED"
    error_id: ERR_REPAIR_SHOP_BLACKLISTED
    http_status: 422
    applies_to: "POST /claims/{id}/investigations/{inv_id}/estimates"

  - priority: 13
    category: business_constraint
    check: "Segregation of duties (PRIMARY review): X-User-ID making a manual review decision must differ from Investigation.adjuster_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /claims/{id}/decisions"

  - priority: 14
    category: business_constraint
    check: "Segregation of duties (SECONDARY review): X-User-ID making the appeal decision must differ from primary reviewer_id and from Investigation.adjuster_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /claims/{id}/appeals/{appeal_id}/decisions"

  - priority: 15
    category: business_fiscal
    check: "Coverage limit: Claim.gross_payout_cents must not exceed Policy.coverage_limit_cents (the calculation enforces this; this is a guard against direct mutation)"
    error_id: ERR_COVERAGE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /claims/{id}/submit-for-review"

  - priority: 16
    category: business_fiscal
    check: "Net payout must remain non-negative; salvage_value_cents + subrogation_recovery_cents must not exceed gross_payout_cents (otherwise reject the offending mutation)"
    error_id: ERR_NEGATIVE_NET_PAYOUT
    http_status: 422
    applies_to: "POST /claims/{id}/subrogations"

  - priority: 17
    category: business_constraint
    check: "Photo upload: Investigation.photo_urls must contain at least one URL at submit-for-review"
    error_id: ERR_PHOTOS_REQUIRED
    http_status: 422
    applies_to: "POST /claims/{id}/submit-for-review"

  - priority: 18
    category: business_constraint
    check: "Estimate required: at least one EstimateLineItem must exist for the Investigation at submit-for-review"
    error_id: ERR_ESTIMATE_REQUIRED
    http_status: 422
    applies_to: "POST /claims/{id}/submit-for-review"

  - priority: 19
    category: business_constraint
    check: "Appeal uniqueness: at most one Appeal per Claim"
    error_id: ERR_APPEAL_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /claims/{id}/appeals"

  - priority: 20
    category: business_constraint
    check: "Payout uniqueness: at most one Payout per Claim"
    error_id: ERR_PAYOUT_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /claims/{id}/payouts"

  - priority: 21
    category: business_constraint
    check: "Optimistic concurrency: PATCH/PUT requests with stale `version` are rejected"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PATCH /policies/{id}, PATCH /repair-shops/{id}, PATCH /adjusters/{id}"

  - priority: 22
    category: business_constraint
    check: "Pagination: limit in [1,100]; offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "list endpoints"

  - priority: 23
    category: business_constraint
    check: "Field validation: missing/typed wrong/out-of-range bodies"
    error_id: ERR_VALIDATION_FAILED
    http_status: 400
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Policies (admin-managed reference data) ---
  - method: POST
    path: "/policies"
    description: "Create a Policy."
    roles: [PlatformAdmin]
    code: 201
    input: [policy_number, insured_party_id, coverage_type, coverage_limit_cents, deductible_cents, coinsurance_ratio, effective_from, effective_to, "reporting_window_days?"]
    output: Policy
    side_effects: []

  - method: GET
    path: "/policies/{id}"
    description: "Get a Policy."
    roles: [PlatformAdmin, Customer, Adjuster, Reviewer, PayoutOfficer]
    code: 200
    input: []
    output: Policy
    side_effects: []

  - method: PATCH
    path: "/policies/{id}"
    description: "Suspend, expire, or reactivate a policy."
    roles: [PlatformAdmin]
    code: 200
    input: ["status?", version]
    output: Policy
    side_effects: []

  # --- Adjusters ---
  - method: POST
    path: "/adjusters"
    description: "Create an Adjuster."
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, license_number, specialty]
    output: Adjuster
    side_effects: []

  - method: GET
    path: "/adjusters"
    description: "List adjusters with optional filters."
    roles: [PlatformAdmin, Reviewer]
    code: 200
    input: ["status?", "specialty?", "limit?", "offset?"]
    output: Adjuster[]
    side_effects: []

  - method: PATCH
    path: "/adjusters/{id}"
    description: "Update adjuster status."
    roles: [PlatformAdmin]
    code: 200
    input: ["status?", version]
    output: Adjuster
    side_effects: []

  # --- Repair shops ---
  - method: POST
    path: "/repair-shops"
    description: "Create a RepairShop."
    roles: [PlatformAdmin]
    code: 201
    input: [name, tax_id]
    output: RepairShop
    side_effects: []

  - method: GET
    path: "/repair-shops/{id}"
    description: "Get a RepairShop. Optional ?projection=pattern_threshold returns a what-if projected trust_score using the alternate variant (read-only; never mutates)."
    roles: [PlatformAdmin, Adjuster, Reviewer]
    code: 200
    input: ["projection?"]
    output: RepairShop
    side_effects: ["calculation: repair_shop_trust_decay (variant pattern_threshold) — read-only when projection=pattern_threshold"]

  - method: PATCH
    path: "/repair-shops/{id}"
    description: "Manually update a repair shop (admin override; cannot raise trust_score)."
    roles: [PlatformAdmin]
    code: 200
    input: ["status?", version]
    output: RepairShop
    side_effects: []

  # --- Claim intake & lifecycle ---
  - method: POST
    path: "/claims"
    description: "Intake a new claim. Mints claim_number; sets status=INTAKE."
    roles: [Customer]
    code: 201
    input: [policy_id, report_channel, idempotency_key, loss_date, incident_description, claimed_amount_cents, "salvage_value_cents?"]
    output: Claim
    side_effects: ["claim_number_minting", "AuditLogEntry STATUS_CHANGE NULL->INTAKE"]

  - method: GET
    path: "/claims/{id}"
    description: "Get a claim with snapshot fields."
    roles: [Customer, Adjuster, Reviewer, PayoutOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/claims"
    description: "List claims (filter by status, claimant_id, policy_id)."
    roles: [Customer, Adjuster, Reviewer, PayoutOfficer, PlatformAdmin]
    code: 200
    input: ["status?", "claimant_id?", "policy_id?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: GET
    path: "/claims/{id}/estimate"
    description: "Read-only provisional payout estimate using claimed_amount_cents (calculation variant estimate_at_intake)."
    roles: [Customer, Adjuster, Reviewer, PlatformAdmin]
    code: 200
    input: []
    output: object
    side_effects: ["calculation: gross_payout (variant estimate_at_intake)"]

  - method: POST
    path: "/claims/{id}/investigations"
    description: "Open investigation; assign adjuster."
    roles: [Adjuster]
    code: 201
    input: [adjuster_id]
    output: Investigation
    side_effects: ["Claim.status INTAKE->UNDER_INVESTIGATION; AuditLogEntry"]

  - method: PATCH
    path: "/claims/{id}/investigations/{inv_id}"
    description: "Update investigation fields (photos, document_authenticity_passed, assessed_loss_cents)."
    roles: [Adjuster]
    code: 200
    input: ["photo_urls?", "document_authenticity_passed?", "assessed_loss_cents?"]
    output: Investigation
    side_effects: []

  - method: POST
    path: "/claims/{id}/investigations/{inv_id}/estimates"
    description: "Append a repair-shop estimate line item."
    roles: [Adjuster]
    code: 201
    input: [repair_shop_id, description, amount_cents]
    output: EstimateLineItem
    side_effects: []

  - method: POST
    path: "/claims/{id}/investigations/{inv_id}/reject"
    description: "Adjuster rejects the investigation; Claim reverts to INTAKE."
    roles: [Adjuster]
    code: 200
    input: []
    output: Investigation
    side_effects: ["Claim status revert; Investigation.status -> REJECTED; AuditLogEntry"]

  - method: POST
    path: "/claims/{id}/submit-for-review"
    description: "Submit for review; runs gross_payout, net_payout (variant at_approval), fraud_score, review_path_assignment, repair_shop_trust_decay; transitions Claim to UNDER_REVIEW."
    roles: [Adjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["multiple calculations and cascades described in §1.2"]

  - method: POST
    path: "/claims/{id}/decisions"
    description: "Record a primary review decision (manual path) or auto-approve (review_path=AUTO triggers system-decision via this endpoint with role=Reviewer X-User-ID=system)."
    roles: [Reviewer]
    code: 201
    input: [outcome, rationale]
    output: ReviewDecision
    side_effects: ["Claim.status UNDER_REVIEW -> APPROVED or DENIED; AuditLogEntry"]

  - method: POST
    path: "/claims/{id}/payouts"
    description: "Create a payout for an APPROVED claim. Status PENDING; banks settle asynchronously via /_events/bank-settle."
    roles: [PayoutOfficer]
    code: 201
    input: []
    output: Payout
    side_effects: ["Claim.status APPROVED -> PAID; AuditLogEntry"]

  - method: GET
    path: "/claims/{id}/payouts"
    description: "Get the payout (if any) for a claim."
    roles: [Customer, PayoutOfficer, Reviewer, PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: []

  - method: POST
    path: "/claims/{id}/subrogations"
    description: "Record a third-party recovery against a PAID claim."
    roles: [PayoutOfficer]
    code: 200
    input: [amount_cents]
    output: Claim
    side_effects: ["Claim.subrogation_recovery_cents incremented; net_payout recomputed; AuditLogEntry"]

  - method: POST
    path: "/claims/{id}/appeals"
    description: "Customer appeals a denial."
    roles: [Customer]
    code: 201
    input: [grounds]
    output: Appeal
    side_effects: ["Claim.status DENIED -> APPEALED; Appeal auto SUBMITTED -> UNDER_RECONSIDERATION; AuditLogEntry"]

  - method: DELETE
    path: "/claims/{id}/appeals/{appeal_id}"
    description: "Customer withdraws an appeal."
    roles: [Customer]
    code: 200
    input: []
    output: Appeal
    side_effects: ["Appeal.status SUBMITTED -> WITHDRAWN; Claim reverts APPEALED -> DENIED"]

  - method: POST
    path: "/claims/{id}/appeals/{appeal_id}/decisions"
    description: "Secondary reviewer records final decision (OVERTURN or UPHOLD)."
    roles: [Reviewer]
    code: 201
    input: [outcome, rationale]
    output: ReviewDecision
    side_effects: ["Appeal.status -> OVERTURNED|UPHELD_DENIAL; Claim.status APPEALED -> APPROVED|CLOSED; AuditLogEntry"]

  - method: POST
    path: "/claims/{id}/fraud-flags"
    description: "Add a fraud flag (admin/system); contributes to fraud_score and may trigger repair-shop decay."
    roles: [PlatformAdmin]
    code: 201
    input: [signal, severity, "repair_shop_id?"]
    output: FraudFlag
    side_effects: ["AuditLogEntry FRAUD_FLAG_ADDED; trust decay if signal=REPAIR_SHOP_COLLUSION"]

  - method: GET
    path: "/claims/{id}/audit-log"
    description: "Return the audit log for this claim, ordered by created_at ascending."
    roles: [Reviewer, PlatformAdmin]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: AuditLogEntry[]
    side_effects: []

  # --- Test-driving control endpoints (per §1.5 testability-completeness) ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance the simulated server clock for time-gated transitions (e.g., reporting-window check)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: object
    side_effects: ["server clock advanced"]

  - method: POST
    path: "/_events/bank-settle"
    description: "Drive bank settlement event for a PENDING payout (Payout PENDING->SETTLED; Claim PAID->CLOSED)."
    roles: [PlatformAdmin]
    code: 200
    input: [payout_id]
    output: Payout
    side_effects: ["cascading state changes per §1.2"]

  - method: POST
    path: "/_events/bank-fail"
    description: "Drive bank failure event for a PENDING payout (Payout PENDING->REVERSED; Claim PAID->APPROVED)."
    roles: [PlatformAdmin]
    code: 200
    input: [payout_id]
    output: Payout
    side_effects: ["compensating cascade"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "X-User-Role / X-User-ID headers missing or malformed"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this endpoint or admin token missing"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in required state for this operation"
  - id: ERR_VALIDATION_FAILED
    http: 400
    condition: "Body fields missing, wrong type, or out of range"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit out of [1,100] or offset < 0"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "PATCH/PUT supplied stale version"
  - id: ERR_DUPLICATE_CLAIM_INTAKE
    http: 409
    condition: "Same (claimant_id, idempotency_key) seen within 24h"
  - id: ERR_POLICY_INACTIVE
    http: 422
    condition: "Policy.status != ACTIVE at intake"
  - id: ERR_LOSS_OUTSIDE_POLICY_PERIOD
    http: 422
    condition: "loss_date outside [Policy.effective_from, Policy.effective_to)"
  - id: ERR_REPORTING_WINDOW_EXCEEDED
    http: 422
    condition: "(reported_at - loss_date).days > Policy.reporting_window_days"
  - id: ERR_ADJUSTER_SPECIALTY_MISMATCH
    http: 422
    condition: "Adjuster.specialty != Policy.coverage_type at investigation start"
  - id: ERR_REPAIR_SHOP_BLACKLISTED
    http: 422
    condition: "RepairShop.status == BLACKLISTED at estimate creation"
  - id: ERR_PHOTOS_REQUIRED
    http: 422
    condition: "Investigation.photo_urls empty at submit-for-review"
  - id: ERR_ESTIMATE_REQUIRED
    http: 422
    condition: "No EstimateLineItem exists for Investigation at submit-for-review"
  - id: ERR_DOCUMENT_AUTHENTICITY_FAILED
    http: 422
    condition: "Investigation.document_authenticity_passed != true at submit-for-review"
  - id: ERR_FRAUD_HOLD
    http: 422
    condition: "Claim.fraud_score >= 0.80 at submit-for-review"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "Reviewer (primary) is the same person as the assigned adjuster, or secondary reviewer equals primary reviewer or the adjuster"
  - id: ERR_COVERAGE_LIMIT_EXCEEDED
    http: 422
    condition: "Computed gross_payout_cents > Policy.coverage_limit_cents (sanity guard)"
  - id: ERR_NEGATIVE_NET_PAYOUT
    http: 422
    condition: "salvage_value_cents + subrogation_recovery_cents would exceed gross_payout_cents"
  - id: ERR_APPEAL_ALREADY_EXISTS
    http: 409
    condition: "An Appeal already exists for this Claim"
  - id: ERR_PAYOUT_ALREADY_EXISTS
    http: 409
    condition: "A Payout already exists for this Claim"
  - id: ERR_INVESTIGATION_ALREADY_OPEN
    http: 409
    condition: "An Investigation already exists for this Claim"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "Insured party who files claims and (optionally) appeals. X-User-ID is an opaque insured-party identifier; ownership of a Claim is verified by Claim.claimant_id == X-User-ID, and a Customer may only act on a Policy whose insured_party_id == X-User-ID."
    identity: "opaque"
    exclusive_operations:
      - "POST /claims (intake)"
      - "POST /claims/{id}/appeals"
      - "DELETE /claims/{id}/appeals/{appeal_id}"
    shared_operations:
      - "GET /claims/{id} (own claims only)"
      - "GET /claims (own claims only)"
      - "GET /claims/{id}/payouts (own claims only)"
      - "GET /claims/{id}/estimate (own claims only)"
      - "GET /policies/{id} (own policy only)"

  - name: Adjuster
    description: "Field investigator performing loss assessment. Cannot also act as Reviewer on the same claim (segregation of duties)."
    identity: "entity_backed:Adjuster"
    exclusive_operations:
      - "POST /claims/{id}/investigations"
      - "PATCH /claims/{id}/investigations/{inv_id}"
      - "POST /claims/{id}/investigations/{inv_id}/estimates"
      - "POST /claims/{id}/investigations/{inv_id}/reject"
      - "POST /claims/{id}/submit-for-review"
    shared_operations:
      - "GET /claims/{id}"
      - "GET /claims"
      - "GET /repair-shops/{id}"
      - "GET /policies/{id}"

  - name: Reviewer
    description: "Reviews claims for approval/denial. Primary reviewer != adjuster; secondary reviewer != primary != adjuster."
    identity: "opaque"
    exclusive_operations:
      - "POST /claims/{id}/decisions"
      - "POST /claims/{id}/appeals/{appeal_id}/decisions"
    shared_operations:
      - "GET /claims/{id}"
      - "GET /claims"
      - "GET /adjusters"
      - "GET /claims/{id}/audit-log"

  - name: PayoutOfficer
    description: "Disburses payouts and records subrogation recoveries."
    identity: "opaque"
    exclusive_operations:
      - "POST /claims/{id}/payouts"
      - "POST /claims/{id}/subrogations"
    shared_operations:
      - "GET /claims/{id}/payouts"
      - "GET /claims/{id}"

  - name: PlatformAdmin
    description: "Operational admin for reference data, fraud flags, audit log, and test-driving control endpoints."
    identity: "opaque"
    exclusive_operations:
      - "POST /policies, PATCH /policies/{id}"
      - "POST /adjusters, PATCH /adjusters/{id}"
      - "POST /repair-shops, PATCH /repair-shops/{id}"
      - "POST /claims/{id}/fraud-flags"
      - "POST /_clock/advance"
      - "POST /_events/bank-settle"
      - "POST /_events/bank-fail"
    shared_operations:
      - "GET /claims/{id}/audit-log"
      - "GET /claims (no filter)"
      - "GET /policies/{id}"
