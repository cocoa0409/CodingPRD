scenario: "2406. Executive Compensation & Say-on-Pay Disclosure (public company compensation committee): peer group construction and benchmarking against revenue and market capitalization ranges, pay mix design across salary, annual incentive and long-term equity with performance metric selection, goal setting with threshold, target and maximum payout curves and adjustment policies, realized versus realizable pay analysis and pay-for-performance alignment testing, compensation discussion and analysis drafting with required tabular disclosures, proxy advisor policy screening and shareholder outreach before the vote, say-on-pay result response and program changes, clawback policy application on restatement events"
domain_name: "executive-compensation-say-on-pay"
api_prefix: "/exec-comp"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: graph
  # Company is referenced both as the issuer and (self-referentially, through the
  # PeerGroupMember junction) as a peer of itself-class entities; PayProgram fans
  # into four independent aggregates (metrics, awards, disclosure, engagement).

  state_machine_shape: parallel
  # PayProgram carries two independent dimensions (design_status × vote_status);
  # CdaDraft, PeerGroup, PayoutAward and ClawbackDetermination are cyclic.

  relationship_patterns:
    - one_to_many
    - many_to_many          # PeerGroupMember junction between PeerGroup and Company
    - self_referential      # Company (issuer) -> PeerGroupMember -> Company (peer)
    - cross_aggregate       # ClawbackDetermination spans RestatementEvent and PayoutAward

  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Company
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered company name
        constraints: 1-120 chars, non-blank
      - name: ticker
        type: string
        source: input
        description: exchange ticker symbol
        constraints: 1-5 uppercase letters
      - name: is_issuer
        type: boolean
        source: input
        description: true for the single filing issuer whose program is being designed
        default: false
        constraints: at most one Company row may carry true
      - name: gics_sector
        type: enum
        source: input
        description: sector used for industry comparability screening
        constraints: "one of {TECH, INDUSTRIALS, HEALTHCARE, FINANCIALS, CONSUMER, ENERGY}"
      - name: revenue_usd
        type: number
        source: input
        description: trailing-twelve-month revenue used for size banding
        constraints: "> 0, 2 decimal places"
      - name: market_cap_usd
        type: number
        source: input
        description: market capitalization used for size banding
        constraints: "> 0, 2 decimal places"
      - name: share_price_usd
        type: number
        source: input
        description: current share price used for realizable-pay marking and vest pricing
        constraints: "> 0, 2 decimal places"
      - name: ceo_tdc_usd
        type: number
        source: input
        description: last disclosed CEO total direct compensation used as the benchmark datum
        constraints: ">= 0, 2 decimal places"
      - name: listing_status
        type: enum
        source: system
        description: "listing lifecycle; DELISTED companies are ineligible as new peers"
        default: ACTIVE
        constraints: "one of {ACTIVE, DELISTED}"
      - name: market_data_updated_at
        type: datetime
        source: system
        description: logical-clock instant of the last market-data refresh, null before the first refresh
        default: null

  - name: PeerGroup
    parent: null
    common_fields: true
    fields:
      - name: issuer_company_id
        type: string
        source: input
        description: "FK -> Company.id; the issuer this peer group benchmarks; referenced Company MUST have is_issuer == true"
      - name: fiscal_year
        type: integer
        source: input
        description: fiscal year the peer group supports
        constraints: 2020-2035
      - name: benchmark_basis
        type: enum
        source: input
        description: which benchmark variant populates benchmark_target_tdc_usd
        default: RAW_MEDIAN
        constraints: "one of {RAW_MEDIAN, SIZE_ADJUSTED}"
      - name: status
        type: enum
        source: system
        description: construction lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, SCREENED, APPROVED}"
      - name: accepted_member_count
        type: integer
        source: computed
        description: "count of PeerGroupMember rows of this group with status == ACCEPTED"
        default: 0
      - name: median_revenue_usd
        type: number
        source: computed
        description: median revenue_usd over ACCEPTED members, null until screened
        default: null
      - name: median_market_cap_usd
        type: number
        source: computed
        description: median market_cap_usd over ACCEPTED members, null until screened
        default: null
      - name: benchmark_target_tdc_raw_usd
        type: number
        source: computed
        description: RAW_MEDIAN variant of the benchmark CEO total direct comp, null until screened
        default: null
      - name: benchmark_target_tdc_adjusted_usd
        type: number
        source: computed
        description: SIZE_ADJUSTED variant of the benchmark CEO total direct comp, null until screened
        default: null
      - name: benchmark_target_tdc_usd
        type: number
        source: computed
        description: the variant selected by benchmark_basis, null until screened
        default: null
      - name: size_fit_score
        type: number
        source: computed
        description: 0.00-100.00 closeness of median_revenue_usd to the issuer revenue, null until screened
        default: null
      - name: screened_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent successful screen
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the CompCommitteeChair that approved the group
        default: null

  - name: PeerGroupMember
    parent: PeerGroup
    common_fields: true
    fields:
      - name: peer_group_id
        type: string
        source: input
        description: "FK -> PeerGroup.id; owning peer group"
      - name: peer_company_id
        type: string
        source: input
        description: "FK -> Company.id; the peer; MUST NOT be the issuer of the owning group"
      - name: inclusion_reason
        type: enum
        source: input
        description: documented rationale for including this peer
        constraints: "one of {SIZE_MATCH, INDUSTRY_MATCH, BUSINESS_MODEL_ANALOG, TALENT_COMPETITOR}"
      - name: revenue_ratio
        type: number
        source: computed
        description: "round(peer.revenue_usd / issuer.revenue_usd, 4)"
      - name: market_cap_ratio
        type: number
        source: computed
        description: "round(peer.market_cap_usd / issuer.market_cap_usd, 4)"
      - name: in_size_band
        type: boolean
        source: computed
        description: true when revenue_ratio and market_cap_ratio both sit inside their bands
      - name: status
        type: enum
        source: system
        description: membership state
        default: ACCEPTED
        constraints: "one of {ACCEPTED, EXCLUDED}"
      - name: exclusion_reason
        type: string
        source: system
        description: rationale captured when the member is excluded, null while ACCEPTED
        default: null

  - name: Executive
    parent: Company
    common_fields: true
    fields:
      - name: company_id
        type: string
        source: input
        description: "FK -> Company.id; employing company"
      - name: full_name
        type: string
        source: input
        description: executive name as disclosed
        constraints: 1-120 chars
      - name: role_title
        type: enum
        source: input
        description: officer role
        constraints: "one of {CEO, CFO, COO, CHRO, GC}"
      - name: is_neo
        type: boolean
        source: input
        description: named executive officer flag driving tabular disclosure
        default: true
      - name: base_salary_usd
        type: number
        source: input
        description: annualized base salary
        constraints: "> 0, 2 decimal places"
      - name: sti_target_pct
        type: number
        source: input
        description: annual incentive target as a percentage of base salary
        constraints: "0.00-400.00, 2 decimal places"

  - name: PayProgram
    parent: null
    common_fields: true
    fields:
      - name: issuer_company_id
        type: string
        source: input
        description: "FK -> Company.id; the issuer; MUST have is_issuer == true"
      - name: peer_group_id
        type: string
        source: input
        description: "FK -> PeerGroup.id; benchmark peer group; its issuer_company_id MUST equal this program's issuer_company_id"
      - name: ceo_executive_id
        type: string
        source: input
        description: "FK -> Executive.id; the CEO whose target pay the program sizes; its company_id MUST equal issuer_company_id"
      - name: fiscal_year
        type: integer
        source: input
        description: program fiscal year
        constraints: 2020-2035
      - name: salary_pct
        type: number
        source: input
        description: salary share of the target pay mix
        constraints: "5.00-80.00, 2 decimal places"
      - name: sti_pct
        type: number
        source: input
        description: annual-incentive share of the target pay mix
        constraints: "5.00-80.00, 2 decimal places"
      - name: lti_pct
        type: number
        source: input
        description: long-term-equity share of the target pay mix
        constraints: "5.00-80.00, 2 decimal places; salary_pct + sti_pct + lti_pct == 100.00"
      - name: lti_performance_share_pct
        type: number
        source: input
        description: share of LTI delivered as performance shares rather than time-vested units
        constraints: "0.00-100.00, 2 decimal places"
      - name: sti_max_multiple
        type: number
        source: input
        description: hard cap on annual incentive expressed as a multiple of target
        default: 2.0
        constraints: "1.0-3.0"
      - name: tsr_percentile_rank
        type: number
        source: input
        description: issuer three-year TSR percentile rank versus the peer group
        constraints: "0.00-100.00, 2 decimal places"
      - name: meeting_date
        type: datetime
        source: input
        description: annual meeting instant at which the say-on-pay vote is held
      - name: performance_based_pct
        type: number
        source: computed
        description: share of target pay that is performance-contingent
      - name: fixed_leg_usd
        type: number
        source: computed
        description: salary plus annual-incentive target for the CEO
      - name: benchmark_ratio
        type: number
        source: computed
        description: issuer fixed leg divided by the benchmark fixed leg
      - name: lti_multiple
        type: number
        source: computed
        description: LTI multiple of the fixed leg selected by the benchmark_ratio tier
      - name: lti_target_usd
        type: number
        source: computed
        description: CEO long-term incentive target value
      - name: target_tdc_usd
        type: number
        source: computed
        description: CEO target total direct compensation
      - name: benchmark_posture
        type: enum
        source: computed
        description: positioning of target_tdc_usd against the benchmark
        default: UNBENCHMARKED
        constraints: "one of {UNBENCHMARKED, BELOW_MARKET, ALIGNED, ABOVE_MARKET}"
      - name: realized_pay_total_usd
        type: number
        source: computed
        description: sum of realized_value_usd over this program's non-forfeited awards
        default: 0.00
      - name: realizable_pay_total_usd
        type: number
        source: computed
        description: sum of realizable_value_usd over this program's non-forfeited awards
        default: 0.00
      - name: pay_percentile_rank
        type: number
        source: computed
        description: realized pay percentile against ACCEPTED peers' ceo_tdc_usd, null before any award exists
        default: null
      - name: degree_of_alignment
        type: number
        source: computed
        description: "round(tsr_percentile_rank - pay_percentile_rank, 2), null while pay_percentile_rank is null"
        default: null
      - name: alignment_status
        type: enum
        source: computed
        description: pay-for-performance alignment band
        default: UNRATED
        constraints: "one of {UNRATED, ALIGNED, WATCH, MISALIGNED}"
      - name: design_status
        type: enum
        source: system
        description: design/disclosure dimension of the program lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, COMMITTEE_APPROVED, DISCLOSED, CLOSED}"
      - name: vote_status
        type: enum
        source: system
        description: say-on-pay dimension of the program lifecycle, independent of design_status
        default: NOT_VOTED
        constraints: "one of {NOT_VOTED, PASSED, FAILED, REMEDIATED}"
      - name: votes_for
        type: integer
        source: system
        description: shares voted FOR, null until the vote is certified
        default: null
      - name: votes_against
        type: integer
        source: system
        description: shares voted AGAINST, null until the vote is certified
        default: null
      - name: abstentions
        type: integer
        source: system
        description: shares abstaining; excluded from the support denominator
        default: null
      - name: support_pct
        type: number
        source: computed
        description: say-on-pay support percentage, null until the vote is certified
        default: null
      - name: enhanced_engagement_required
        type: boolean
        source: computed
        description: true when the vote passed with support_pct below the 70.00 responsiveness trigger
        default: false
      - name: outreach_coverage_pct
        type: number
        source: computed
        description: sum of ownership_pct over HELD engagements, deduplicated by investor_key
        default: 0.00
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the CompCommitteeChair that approved the design
        default: null

  - name: IncentiveMetric
    parent: PayProgram
    common_fields: true
    fields:
      - name: pay_program_id
        type: string
        source: input
        description: "FK -> PayProgram.id; owning program"
      - name: metric_code
        type: enum
        source: input
        description: performance metric selected for the vehicle
        constraints: "one of {ADJ_EPS, REVENUE_GROWTH, FCF, ROIC, RTSR, COST_RATIO}; unique per (pay_program_id, metric_code, vehicle)"
      - name: vehicle
        type: enum
        source: input
        description: incentive vehicle the metric drives
        constraints: "one of {ANNUAL_INCENTIVE, LONG_TERM_PSU}"
      - name: direction
        type: enum
        source: input
        description: whether higher or lower achievement is better
        constraints: "one of {HIGHER_IS_BETTER, LOWER_IS_BETTER}"
      - name: weight_pct
        type: number
        source: input
        description: weight inside its vehicle
        constraints: "5.00-100.00, 2 decimal places"
      - name: threshold_value
        type: number
        source: input
        description: goal value paying threshold_payout_pct
      - name: target_value
        type: number
        source: input
        description: goal value paying target_payout_pct
        constraints: "non-zero"
      - name: maximum_value
        type: number
        source: input
        description: goal value paying maximum_payout_pct
      - name: threshold_payout_pct
        type: number
        source: input
        description: payout percentage at threshold
        default: 50.00
      - name: target_payout_pct
        type: number
        source: input
        description: payout percentage at target
        default: 100.00
      - name: maximum_payout_pct
        type: number
        source: input
        description: payout percentage at maximum
        default: 200.00
      - name: interpolation
        type: enum
        source: input
        description: payout curve shape between inflection points
        default: LINEAR
        constraints: "one of {LINEAR, STEP}"
      - name: locked_target_value
        type: number
        source: system
        description: target_value snapshot taken when the metric was locked, null while DRAFT
        default: null
      - name: goal_adjustment_pct
        type: number
        source: computed
        description: percentage magnitude of the goal move against locked_target_value, null until adjusted
        default: null
      - name: as_reported_value
        type: number
        source: system
        description: GAAP as-reported achievement submitted with the result, null before submission
        default: null
      - name: non_gaap_adjusted_value
        type: number
        source: system
        description: adjusted achievement asserted under the adjustment policy, null when no adjustment
        default: null
      - name: result_adjustment_reason
        type: string
        source: system
        description: rationale for the non-GAAP result adjustment, null when none
        default: null
      - name: achieved_value
        type: number
        source: computed
        description: "non_gaap_adjusted_value when non-null, else as_reported_value; null before submission"
        default: null
      - name: payout_factor_pct
        type: number
        source: computed
        description: payout curve output for achieved_value, null until certified
        default: null
      - name: original_payout_factor_pct
        type: number
        source: system
        description: payout_factor_pct snapshot at first certification, immutable afterwards
        default: null
      - name: restated_payout_factor_pct
        type: number
        source: system
        description: payout factor recomputed from restated achievement, null until a restatement analysis touches the metric
        default: null
      - name: status
        type: enum
        source: system
        description: goal/result lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, LOCKED, ADJUSTED, RESULT_SUBMITTED, CERTIFIED, RESTATED}"
      - name: adjusted_by_user_id
        type: string
        source: system
        description: X-User-ID that ordered the goal adjustment, null when never adjusted
        default: null
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID that certified the result, null before certification
        default: null

  - name: PayoutAward
    parent: PayProgram
    common_fields: true
    fields:
      - name: pay_program_id
        type: string
        source: input
        description: "FK -> PayProgram.id; owning program"
      - name: executive_id
        type: string
        source: input
        description: "FK -> Executive.id; award holder; its company_id MUST equal the program's issuer_company_id"
      - name: vehicle
        type: enum
        source: input
        description: delivery vehicle
        constraints: "one of {ANNUAL_INCENTIVE, LONG_TERM_PSU, RSU}"
      - name: units_granted
        type: number
        source: input
        description: share units granted; MUST be 0 for ANNUAL_INCENTIVE and > 0 otherwise
        constraints: ">= 0, 2 decimal places"
      - name: grant_price_usd
        type: number
        source: system
        description: issuer share_price_usd captured at grant
      - name: target_amount_usd
        type: number
        source: computed
        description: cash target for ANNUAL_INCENTIVE awards, 0.00 for equity vehicles
        default: 0.00
      - name: certified_factor_pct
        type: number
        source: computed
        description: weighted payout factor once every metric of this vehicle is certified, else null
        default: null
      - name: earned_amount_usd
        type: number
        source: computed
        description: capped cash earned for ANNUAL_INCENTIVE awards, null until certified_factor_pct exists
        default: null
      - name: settlement_date
        type: datetime
        source: system
        description: instant of vesting or forfeiture, null while GRANTED
        default: null
      - name: vest_price_usd
        type: number
        source: system
        description: issuer share_price_usd captured at vesting, null unless VESTED
        default: null
      - name: realized_value_usd
        type: number
        source: computed
        description: value actually delivered, net of any recovered clawback amount
        default: 0.00
      - name: realizable_value_usd
        type: number
        source: computed
        description: value of the award marked to current price with target performance assumed while outstanding
        default: 0.00
      - name: status
        type: enum
        source: system
        description: award lifecycle state
        default: GRANTED
        constraints: "one of {GRANTED, VESTED, FORFEITED, CLAWED_BACK}"

  - name: CdaDraft
    parent: PayProgram
    common_fields: true
    fields:
      - name: pay_program_id
        type: string
        source: input
        description: "FK -> PayProgram.id; program the disclosure describes"
      - name: section_code
        type: enum
        source: input
        description: disclosure section
        constraints: "one of {CD_AND_A, SUMMARY_COMP_TABLE, PAY_RATIO, PVP_TABLE}; unique per (pay_program_id, section_code)"
      - name: word_count
        type: integer
        source: input
        description: drafted word count
        constraints: ">= 0"
      - name: required_tables_included
        type: boolean
        source: input
        description: whether every tabular disclosure required for the section is present
        default: false
      - name: revision_round
        type: integer
        source: system
        description: number of drafting rounds, incremented on every return to DRAFTING
        default: 0
      - name: authored_by_user_id
        type: string
        source: system
        description: X-User-ID that last submitted the draft for review
        default: null
      - name: cleared_by_user_id
        type: string
        source: system
        description: X-User-ID that legally cleared the draft, cleared to null on any revert
        default: null
      - name: status
        type: enum
        source: system
        description: drafting lifecycle state
        default: DRAFTING
        constraints: "one of {DRAFTING, IN_REVIEW, LEGAL_CLEARED, FILED}"
      - name: filed_at
        type: datetime
        source: system
        description: logical-clock instant of filing, null before FILED
        default: null

  - name: ProxyAdvisorScreen
    parent: PayProgram
    common_fields: true
    fields:
      - name: pay_program_id
        type: string
        source: input
        description: "FK -> PayProgram.id; screened program"
      - name: advisor
        type: enum
        source: input
        description: proxy advisor whose policy is applied
        constraints: "one of {ISS, GLASS_LEWIS}; unique per (pay_program_id, advisor)"
      - name: alignment_component
        type: number
        source: computed
        description: misalignment component of the concern score
      - name: mix_component
        type: number
        source: computed
        description: pay-mix component of the concern score
      - name: rigor_component
        type: number
        source: computed
        description: goal-rigor component of the concern score
      - name: outreach_component
        type: number
        source: computed
        description: engagement component of the concern score, null for the ISS policy
        default: null
      - name: concern_score
        type: number
        source: computed
        description: advisor-policy weighted concern score, 0.00-100.00
      - name: concern_level
        type: enum
        source: computed
        description: banded concern level
        constraints: "one of {LOW, MEDIUM, HIGH}"
      - name: recommendation
        type: enum
        source: computed
        description: vote recommendation derived from concern_level
        constraints: "one of {FOR, AGAINST}"
      - name: status
        type: enum
        source: system
        description: freshness of the screen against the program's current numbers
        default: SCREENED
        constraints: "one of {SCREENED, STALE}"
      - name: screened_at
        type: datetime
        source: system
        description: logical-clock instant of the last computation

  - name: OutreachEngagement
    parent: PayProgram
    common_fields: true
    fields:
      - name: pay_program_id
        type: string
        source: input
        description: "FK -> PayProgram.id; program the engagement covers"
      - name: investor_name
        type: string
        source: input
        description: investor as supplied by the requester
        constraints: 1-120 chars, non-blank
      - name: investor_key
        type: string
        source: computed
        description: "investor_name trimmed and upper-cased; the identity used for window-overlap and coverage dedup"
      - name: ownership_pct
        type: number
        source: input
        description: investor's percentage of shares outstanding
        constraints: "0.01-100.00, 2 decimal places"
      - name: channel
        type: enum
        source: input
        description: engagement channel
        constraints: "one of {CALL, MEETING, LETTER}"
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the engagement window
      - name: window_end
        type: datetime
        source: input
        description: exclusive end of the engagement window; MUST be strictly after window_start
      - name: engagement_status
        type: enum
        source: system
        description: engagement lifecycle state
        default: REQUESTED
        constraints: "one of {REQUESTED, SCHEDULED, HELD}"
      - name: feedback_position
        type: enum
        source: system
        description: investor position recorded when the engagement is held, null before
        default: null
        constraints: "one of {SUPPORTIVE, CONCERNED, OPPOSED}"
      - name: feedback_summary
        type: string
        source: system
        description: free-text notes recorded when the engagement is held, null before
        default: null
      - name: held_at
        type: datetime
        source: system
        description: logical-clock instant the engagement was held, null before
        default: null

  - name: RestatementEvent
    parent: Company
    common_fields: true
    fields:
      - name: company_id
        type: string
        source: input
        description: "FK -> Company.id; restating issuer"
      - name: restatement_date
        type: datetime
        source: input
        description: instant the restatement was determined; MUST be at or after lookback_end
      - name: lookback_start
        type: datetime
        source: input
        description: inclusive start of the three-year recovery lookback
      - name: lookback_end
        type: datetime
        source: input
        description: inclusive end of the recovery lookback; MUST be strictly after lookback_start
      - name: accounting_reason
        type: string
        source: input
        description: accounting basis for the restatement
        constraints: 1-500 chars
      - name: status
        type: enum
        source: system
        description: recovery lifecycle state
        default: DECLARED
        constraints: "one of {DECLARED, ANALYZED, RECOVERY_ORDERED, CLOSED}"
      - name: determination_count
        type: integer
        source: computed
        description: number of ClawbackDetermination rows created by the analysis
        default: 0
      - name: recoverable_total_usd
        type: number
        source: computed
        description: sum of recoverable_amount_usd over this event's determinations
        default: 0.00
      - name: recovered_total_usd
        type: number
        source: computed
        description: sum of recoverable_amount_usd over this event's determinations in status RECOVERED
        default: 0.00

  - name: ClawbackDetermination
    parent: RestatementEvent
    common_fields: true
    fields:
      - name: restatement_event_id
        type: string
        source: input
        description: "FK -> RestatementEvent.id; owning restatement event"
      - name: payout_award_id
        type: string
        source: input
        description: "FK -> PayoutAward.id; the erroneously-paid award"
      - name: original_factor_pct
        type: number
        source: system
        description: award certified_factor_pct as originally certified
      - name: restated_factor_pct
        type: number
        source: system
        description: award factor recomputed from restated achievement
      - name: restated_amount_usd
        type: number
        source: computed
        description: value the award would have delivered under restated results
      - name: recoverable_amount_usd
        type: number
        source: computed
        description: erroneously-awarded compensation subject to recovery
      - name: status
        type: enum
        source: system
        description: recovery state of this determination
        default: CALCULATED
        constraints: "one of {CALCULATED, NOTICED, RECOVERED}"
      - name: noticed_at
        type: datetime
        source: system
        description: instant recovery was ordered, null while CALCULATED
        default: null
      - name: acknowledged_at
        type: datetime
        source: system
        description: instant the officer acknowledged the notice, null before acknowledgement
        default: null
      - name: acknowledged_by_user_id
        type: string
        source: system
        description: X-User-ID (an Executive.id) that acknowledged the notice
        default: null
      - name: recovered_at
        type: datetime
        source: system
        description: instant recovery was booked, null unless RECOVERED
        default: null

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Company
    initial_state: ACTIVE
    terminal_states: [DELISTED]
    transitions:
      - from: ACTIVE
        to: DELISTED
        trigger: "POST /exec-comp/companies/{id}/market-data with listing_status: DELISTED"
        actor: CompConsultant
        preconditions:
          - "company.listing_status == ACTIVE"
        side_effects:
          - "sets listing_status = DELISTED; increments Company.version by 1"
          - "the company remains referenceable by existing PeerGroupMember rows (no cascade removal); only NEW membership creation is blocked by ERR_PEER_COMPANY_DELISTED"
        note: "market-data refreshes that do not carry listing_status leave the state unchanged and are self-transitions on ACTIVE."
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /exec-comp/companies/{id}/market-data without listing_status"
        actor: CompConsultant
        preconditions:
          - "company.listing_status == ACTIVE"
          - "at least one of revenue_usd, market_cap_usd, share_price_usd, ceo_tdc_usd, listing_status is present"
        side_effects:
          - "overwrites the supplied market fields; sets market_data_updated_at = current_utc; increments Company.version by 1"
          - "CASCADE L1: for every PeerGroupMember row with peer_company_id == this company OR whose PeerGroup.issuer_company_id == this company, and whose PeerGroup.status IN {DRAFT, SCREENED}, recomputes revenue_ratio, market_cap_ratio and in_size_band (calculations.peer_size_band_fit)"
          - "CASCADE L2: caused by L1 — any PeerGroup in status SCREENED that owns a recomputed member whose in_size_band flipped to false transitions SCREENED -> DRAFT (see PeerGroup machine), clearing its medians and benchmarks"
          - "CASCADE L3: caused by L2 — every PayProgram referencing that PeerGroup with design_status == DRAFT has benchmark_ratio, lti_multiple, lti_target_usd, target_tdc_usd set to null and benchmark_posture set to UNBENCHMARKED"
          - "recomputes realizable_value_usd on every PayoutAward of the issuer's programs whose status == GRANTED (share_price_usd change), then recomputes those programs' realizable_pay_total_usd"

  - entity: PeerGroup
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SCREENED
        trigger: "POST /exec-comp/peer-groups/{id}/screen"
        actor: CompConsultant
        preconditions:
          - "peer_group.status == DRAFT"
          - "accepted_member_count >= 1 (zero ACCEPTED members is rejected with ERR_PEER_GROUP_EMPTY)"
          - "every ACCEPTED member has in_size_band == true OR inclusion_reason == BUSINESS_MODEL_ANALOG"
        side_effects:
          - "computes median_revenue_usd, median_market_cap_usd, size_fit_score (calculations.peer_group_medians)"
          - "computes benchmark_target_tdc_raw_usd and benchmark_target_tdc_adjusted_usd, then sets benchmark_target_tdc_usd to the variant named by benchmark_basis (calculations.benchmark_target_tdc)"
          - "sets screened_at = current_utc; increments PeerGroup.version by 1"
      - from: SCREENED
        to: APPROVED
        trigger: "POST /exec-comp/peer-groups/{id}/approve"
        actor: CompCommitteeChair
        preconditions:
          - "peer_group.status == SCREENED (DRAFT is rejected with ERR_PEER_GROUP_NOT_SCREENED)"
          - "benchmark_target_tdc_usd IS NOT NULL"
        side_effects:
          - "sets approved_by_user_id = X-User-ID; increments PeerGroup.version by 1"
          - "CASCADE L1: every PayProgram with peer_group_id == this group and design_status == DRAFT recomputes fixed_leg_usd, benchmark_ratio, lti_multiple, lti_target_usd, target_tdc_usd and benchmark_posture (calculations.target_total_direct_comp)"
          - "CASCADE L2: caused by L1 — each such PayProgram whose pay_percentile_rank is non-null recomputes pay_percentile_rank, degree_of_alignment and alignment_status (calculations.pay_for_performance_alignment)"
          - "CASCADE L3: caused by L2 — every SCREENED ProxyAdvisorScreen of a program touched by L1 or L2 transitions SCREENED -> STALE"
      - from: SCREENED
        to: DRAFT
        trigger: "system: a member of the group is excluded, or a market-data refresh flips a member's in_size_band to false"
        actor: system
        preconditions:
          - "peer_group.status == SCREENED"
        side_effects:
          - "sets median_revenue_usd, median_market_cap_usd, benchmark_target_tdc_raw_usd, benchmark_target_tdc_adjusted_usd, benchmark_target_tdc_usd, size_fit_score and screened_at to null; increments PeerGroup.version by 1"
          - "CASCADE: every PayProgram referencing this group with design_status == DRAFT has benchmark_ratio, lti_multiple, lti_target_usd, target_tdc_usd set to null and benchmark_posture set to UNBENCHMARKED"
        note: "This is the revision loop: DRAFT -> SCREENED -> DRAFT. Groups already in APPROVED never revert; member mutation on an APPROVED group is rejected with ERR_PEER_GROUP_NOT_MUTABLE."

  - entity: PeerGroupMember
    initial_state: ACCEPTED
    terminal_states: [EXCLUDED]
    transitions:
      - from: ACCEPTED
        to: EXCLUDED
        trigger: "POST /exec-comp/peer-group-members/{id}/exclude"
        actor: CompConsultant
        preconditions:
          - "member.status == ACCEPTED"
          - "owning PeerGroup.status IN {DRAFT, SCREENED} (APPROVED is rejected with ERR_PEER_GROUP_NOT_MUTABLE)"
        side_effects:
          - "CASCADE L1: sets status = EXCLUDED, exclusion_reason = request body reason; increments PeerGroupMember.version by 1"
          - "CASCADE L2: caused by L1 — owning PeerGroup recomputes accepted_member_count; if the group was SCREENED it transitions SCREENED -> DRAFT and clears every median/benchmark field"
          - "CASCADE L3: caused by L2 — every PayProgram referencing that group with design_status == DRAFT has target_tdc_usd/lti_target_usd/lti_multiple/benchmark_ratio cleared and benchmark_posture set to UNBENCHMARKED"
          - "CASCADE L4: caused by L3 — every ProxyAdvisorScreen of those programs in status SCREENED transitions to STALE"

  - entity: PayProgram
    initial_state: "design_status: DRAFT × vote_status: NOT_VOTED"
    terminal_states: ["design_status: CLOSED"]
    transitions:
      - from: "design_status: DRAFT"
        to: "design_status: COMMITTEE_APPROVED"
        trigger: "POST /exec-comp/pay-programs/{id}/approve"
        actor: CompCommitteeChair
        preconditions:
          - "program.design_status == DRAFT (any other value is rejected with ERR_PROGRAM_NOT_MUTABLE)"
          - "referenced PeerGroup.status == APPROVED (else ERR_PEER_GROUP_NOT_APPROVED) — cross-entity guard"
          - "salary_pct + sti_pct + lti_pct == 100.00"
          - "for each vehicle that has at least one IncentiveMetric, the sum of weight_pct over that vehicle's metrics == 100.00 (else ERR_METRIC_WEIGHTS_NOT_100)"
          - "target_tdc_usd <= round(1.50 * PeerGroup.benchmark_target_tdc_usd, 2) (else ERR_TDC_EXCEEDS_BENCHMARK_CAP)"
        side_effects:
          - "sets design_status = COMMITTEE_APPROVED, approved_by_user_id = X-User-ID; increments PayProgram.version by 1"
          - "CASCADE: every IncentiveMetric of this program with status == DRAFT transitions DRAFT -> LOCKED and snapshots locked_target_value = target_value"
        note: "vote_status is untouched by this transition — the two dimensions advance independently."
      - from: "design_status: COMMITTEE_APPROVED"
        to: "design_status: DISCLOSED"
        trigger: "system: the program's CD_AND_A CdaDraft transitions LEGAL_CLEARED -> FILED"
        actor: system
        preconditions:
          - "program.design_status == COMMITTEE_APPROVED"
        side_effects:
          - "sets design_status = DISCLOSED; increments PayProgram.version by 1"
      - from: "design_status: DISCLOSED"
        to: "design_status: CLOSED"
        trigger: "system: vote certification yields support_pct >= 70.00, or a FAILED vote is remediated"
        actor: system
        preconditions:
          - "program.design_status == DISCLOSED"
          - "vote_status IN {PASSED, REMEDIATED}"
        side_effects:
          - "sets design_status = CLOSED; increments PayProgram.version by 1"
        note: "A PASSED vote with support_pct < 70.00 leaves design_status at DISCLOSED and sets enhanced_engagement_required = true."
      - from: "vote_status: NOT_VOTED"
        to: "vote_status: PASSED"
        trigger: "POST /exec-comp/pay-programs/{id}/vote-certification with support_pct >= 50.00"
        actor: InvestorRelationsLead
        preconditions:
          - "program.vote_status == NOT_VOTED (else ERR_VOTE_ALREADY_CERTIFIED)"
          - "program.design_status == DISCLOSED (else ERR_PROGRAM_NOT_DISCLOSED)"
          - "the program's CD_AND_A CdaDraft exists and is in status FILED (else ERR_CDA_NOT_FILED) — cross-entity guard"
        side_effects:
          - "stores votes_for, votes_against, abstentions; computes support_pct (calculations.say_on_pay_support)"
          - "sets enhanced_engagement_required = (support_pct < 70.00)"
          - "when support_pct >= 70.00, also advances design_status DISCLOSED -> CLOSED"
          - "increments PayProgram.version by 1"
      - from: "vote_status: NOT_VOTED"
        to: "vote_status: FAILED"
        trigger: "POST /exec-comp/pay-programs/{id}/vote-certification with support_pct < 50.00"
        actor: InvestorRelationsLead
        preconditions:
          - "same preconditions as the PASSED branch"
        side_effects:
          - "stores votes_for, votes_against, abstentions; computes support_pct; sets enhanced_engagement_required = true"
          - "CASCADE L1: sets vote_status = FAILED; increments PayProgram.version by 1"
          - "CASCADE L2: caused by L1 — every ProxyAdvisorScreen of this program in status SCREENED transitions to STALE (the failed vote is a new policy input)"
          - "CASCADE L3: caused by L2 — every CdaDraft of this program in status LEGAL_CLEARED transitions LEGAL_CLEARED -> DRAFTING, increments revision_round by 1 and clears cleared_by_user_id"
        note: "design_status stays DISCLOSED on the FAILED branch — the divergent side-effect set is what distinguishes the two branches of this fork."
      - from: "vote_status: FAILED"
        to: "vote_status: REMEDIATED"
        trigger: "POST /exec-comp/pay-programs/{id}/remediation"
        actor: CompCommitteeChair
        preconditions:
          - "program.vote_status == FAILED (else ERR_VOTE_NOT_FAILED)"
          - "program.outreach_coverage_pct >= 30.00 (else ERR_OUTREACH_COVERAGE_INSUFFICIENT)"
        side_effects:
          - "sets vote_status = REMEDIATED; advances design_status DISCLOSED -> CLOSED; increments PayProgram.version by 1"

  - entity: IncentiveMetric
    initial_state: DRAFT
    terminal_states: [RESTATED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "system: owning PayProgram transitions design_status DRAFT -> COMMITTEE_APPROVED"
        actor: system
        preconditions:
          - "metric.status == DRAFT"
        side_effects:
          - "snapshots locked_target_value = target_value; increments IncentiveMetric.version by 1"
      - from: LOCKED
        to: ADJUSTED
        trigger: "POST /exec-comp/incentive-metrics/{id}/adjustments"
        actor: CompCommitteeChair
        preconditions:
          - "metric.status == LOCKED (else ERR_METRIC_STATE_INVALID)"
          - "expected_incentive_metric_version == metric.version (else ERR_STALE_INCENTIVE_METRIC_VERSION)"
          - "the resulting curve is monotonic for the metric direction (else ERR_GOAL_CURVE_NOT_MONOTONIC)"
          - "goal_adjustment_pct <= 15.00 (else ERR_ADJUSTMENT_EXCEEDS_POLICY_LIMIT)"
        side_effects:
          - "overwrites the supplied goal values; computes goal_adjustment_pct (calculations.goal_adjustment_magnitude)"
          - "sets adjusted_by_user_id = X-User-ID; increments IncentiveMetric.version by 1"
      - from: LOCKED
        to: RESULT_SUBMITTED
        trigger: "POST /exec-comp/incentive-metrics/{id}/results"
        actor: CompConsultant
        preconditions:
          - "metric.status IN {LOCKED, ADJUSTED} (else ERR_METRIC_STATE_INVALID)"
        side_effects:
          - "stores as_reported_value, non_gaap_adjusted_value, result_adjustment_reason; computes achieved_value"
          - "increments IncentiveMetric.version by 1"
      - from: ADJUSTED
        to: RESULT_SUBMITTED
        trigger: "POST /exec-comp/incentive-metrics/{id}/results"
        actor: CompConsultant
        preconditions:
          - "metric.status == ADJUSTED"
        side_effects:
          - "same as the LOCKED -> RESULT_SUBMITTED transition"
      - from: RESULT_SUBMITTED
        to: CERTIFIED
        trigger: "POST /exec-comp/incentive-metrics/{id}/certify-result"
        actor: CompCommitteeChair
        preconditions:
          - "metric.status == RESULT_SUBMITTED (else ERR_METRIC_STATE_INVALID)"
          - "X-User-ID != metric.adjusted_by_user_id (else ERR_SEGREGATION_OF_DUTIES) — the chair that moved the goal may not certify the result against it"
        side_effects:
          - "CASCADE L1: computes payout_factor_pct (calculations.metric_payout_factor), snapshots original_payout_factor_pct, sets certified_by_user_id = X-User-ID, status = CERTIFIED; increments IncentiveMetric.version by 1"
          - "CASCADE L2: caused by L1 — if every IncentiveMetric of (pay_program_id, vehicle) is now CERTIFIED, each PayoutAward of that program with the same vehicle recomputes certified_factor_pct, earned_amount_usd (calculations.annual_incentive_payout), realized_value_usd and realizable_value_usd (calculations.realized_and_realizable_pay)"
          - "CASCADE L3: caused by L2 — the owning PayProgram recomputes realized_pay_total_usd, realizable_pay_total_usd, pay_percentile_rank, degree_of_alignment and alignment_status (calculations.pay_for_performance_alignment)"
          - "CASCADE L4: caused by L3 — if alignment_status changed, every ProxyAdvisorScreen of the program in status SCREENED transitions to STALE"
          - "CASCADE L5: caused by L4 — every CdaDraft of the program in status LEGAL_CLEARED transitions to DRAFTING, revision_round += 1, cleared_by_user_id = null"
      - from: CERTIFIED
        to: RESTATED
        trigger: "system: POST /exec-comp/restatement-events/{id}/analyze supplies a restated value for this metric"
        actor: system
        preconditions:
          - "metric.status == CERTIFIED (else ERR_METRIC_NOT_CERTIFIED)"
        side_effects:
          - "stores restated_payout_factor_pct recomputed from the restated achievement; leaves payout_factor_pct and original_payout_factor_pct untouched; increments IncentiveMetric.version by 1"

  - entity: PayoutAward
    initial_state: GRANTED
    terminal_states: [FORFEITED]
    transitions:
      - from: GRANTED
        to: VESTED
        trigger: "POST /exec-comp/payout-awards/{id}/settlement with settlement: VEST"
        actor: CompConsultant
        preconditions:
          - "award.status == GRANTED (else ERR_AWARD_NOT_GRANTED)"
          - "for vehicles ANNUAL_INCENTIVE and LONG_TERM_PSU, award.certified_factor_pct IS NOT NULL (else ERR_METRIC_NOT_CERTIFIED) — cross-entity guard on IncentiveMetric certification"
        side_effects:
          - "sets settlement_date from the request body, vest_price_usd = issuer Company.share_price_usd (or the vest_price_usd override when supplied), status = VESTED"
          - "recomputes realized_value_usd and realizable_value_usd (calculations.realized_and_realizable_pay)"
          - "CASCADE: owning PayProgram recomputes realized_pay_total_usd, realizable_pay_total_usd, pay_percentile_rank, degree_of_alignment, alignment_status; a changed alignment_status flips the program's SCREENED ProxyAdvisorScreen rows to STALE"
          - "increments PayoutAward.version by 1"
      - from: GRANTED
        to: FORFEITED
        trigger: "POST /exec-comp/payout-awards/{id}/settlement with settlement: FORFEIT"
        actor: CompConsultant
        preconditions:
          - "award.status == GRANTED"
        side_effects:
          - "sets settlement_date = current_utc, status = FORFEITED, realized_value_usd = 0.00, realizable_value_usd = 0.00"
          - "CASCADE: owning PayProgram recomputes realized_pay_total_usd and realizable_pay_total_usd (a forfeited award contributes nothing to either)"
          - "increments PayoutAward.version by 1"
        note: "FORFEIT requires no metric certification — the divergent precondition set is what distinguishes the two branches of this fork."
      - from: VESTED
        to: CLAWED_BACK
        trigger: "system: POST /exec-comp/clawback-determinations/{id}/recover on a determination pointing at this award"
        actor: system
        preconditions:
          - "award.status == VESTED"
        side_effects:
          - "reduces realized_value_usd by determination.recoverable_amount_usd; sets realizable_value_usd = realized_value_usd; increments PayoutAward.version by 1"
      - from: CLAWED_BACK
        to: VESTED
        trigger: "system: POST /exec-comp/clawback-determinations/{id}/reverse-recovery on the same determination"
        actor: system
        preconditions:
          - "award.status == CLAWED_BACK"
        side_effects:
          - "increases realized_value_usd by determination.recoverable_amount_usd, restoring the pre-recovery value; increments PayoutAward.version by 1"
        note: "VESTED -> CLAWED_BACK -> VESTED is the compensating cycle that conserves realized dollars."

  - entity: CdaDraft
    initial_state: DRAFTING
    terminal_states: []
    transitions:
      - from: DRAFTING
        to: IN_REVIEW
        trigger: "POST /exec-comp/cda-drafts/{id}/submit-review"
        actor: SecuritiesCounsel
        preconditions:
          - "draft.status == DRAFTING (else ERR_CDA_STATE_INVALID)"
          - "owning PayProgram.design_status IN {COMMITTEE_APPROVED, DISCLOSED} (else ERR_PROGRAM_NOT_MUTABLE)"
        side_effects:
          - "sets authored_by_user_id = X-User-ID; increments CdaDraft.version by 1"
      - from: IN_REVIEW
        to: DRAFTING
        trigger: "POST /exec-comp/cda-drafts/{id}/request-revision"
        actor: CompCommitteeChair
        preconditions:
          - "draft.status == IN_REVIEW (else ERR_CDA_STATE_INVALID)"
        side_effects:
          - "increments revision_round by 1; clears cleared_by_user_id; increments CdaDraft.version by 1"
        note: "DRAFTING -> IN_REVIEW -> DRAFTING is the review cycle; revision_round counts the loops."
      - from: IN_REVIEW
        to: LEGAL_CLEARED
        trigger: "POST /exec-comp/cda-drafts/{id}/legal-clear"
        actor: SecuritiesCounsel
        preconditions:
          - "draft.status == IN_REVIEW (else ERR_CDA_STATE_INVALID)"
          - "X-User-ID != draft.authored_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "required_tables_included == true AND (section_code != CD_AND_A OR word_count >= 1500) (else ERR_CDA_TABLES_INCOMPLETE)"
          - "the owning program has a ProxyAdvisorScreen with advisor == ISS in status SCREENED (else ERR_ISS_SCREEN_NOT_CURRENT) — cross-entity guard"
        side_effects:
          - "sets cleared_by_user_id = X-User-ID; increments CdaDraft.version by 1"
      - from: LEGAL_CLEARED
        to: FILED
        trigger: "POST /exec-comp/cda-drafts/{id}/file"
        actor: SecuritiesCounsel
        preconditions:
          - "draft.status == LEGAL_CLEARED (else ERR_CDA_STATE_INVALID)"
        side_effects:
          - "sets filed_at = current_utc; increments CdaDraft.version by 1"
          - "CASCADE: when section_code == CD_AND_A, the owning PayProgram advances design_status COMMITTEE_APPROVED -> DISCLOSED"
      - from: FILED
        to: DRAFTING
        trigger: "POST /exec-comp/cda-drafts/{id}/request-revision"
        actor: CompCommitteeChair
        preconditions:
          - "draft.status == FILED (else ERR_CDA_STATE_INVALID)"
          - "owning PayProgram.vote_status == NOT_VOTED (else ERR_VOTE_ALREADY_CERTIFIED)"
        side_effects:
          - "increments revision_round by 1; clears cleared_by_user_id and filed_at; increments CdaDraft.version by 1"
        note: "Amended-proxy path. Reopening the FILED CD_AND_A leaves the owning PayProgram at design_status DISCLOSED but makes ERR_CDA_NOT_FILED reachable on vote certification until the section is re-cleared and re-filed."
      - from: LEGAL_CLEARED
        to: DRAFTING
        trigger: "system: a ProxyAdvisorScreen of the owning program transitions SCREENED -> STALE"
        actor: system
        preconditions:
          - "draft.status == LEGAL_CLEARED"
        side_effects:
          - "increments revision_round by 1; clears cleared_by_user_id; increments CdaDraft.version by 1"
        note: "This is the tail link of the certification and clawback cascades."

  - entity: ProxyAdvisorScreen
    initial_state: SCREENED
    terminal_states: []
    transitions:
      - from: SCREENED
        to: STALE
        trigger: "system: any of the owning PayProgram's realized_pay_total_usd, realizable_pay_total_usd, pay_percentile_rank, degree_of_alignment, alignment_status, target_tdc_usd, performance_based_pct, outreach_coverage_pct or vote_status is recomputed to a new value"
        actor: system
        preconditions:
          - "screen.status == SCREENED"
        side_effects:
          - "sets status = STALE, leaving concern_score, concern_level and recommendation at their last computed values; increments ProxyAdvisorScreen.version by 1"
          - "CASCADE: every CdaDraft of the program in status LEGAL_CLEARED transitions LEGAL_CLEARED -> DRAFTING"
      - from: STALE
        to: SCREENED
        trigger: "POST /exec-comp/proxy-advisor-screens/{id}/rerun"
        actor: CompConsultant
        preconditions:
          - "screen.status IN {SCREENED, STALE}"
        side_effects:
          - "recomputes alignment_component, mix_component, rigor_component, outreach_component, concern_score, concern_level, recommendation (calculations.proxy_concern_score); sets screened_at = current_utc; increments ProxyAdvisorScreen.version by 1"
      - from: SCREENED
        to: SCREENED
        trigger: "POST /exec-comp/proxy-advisor-screens/{id}/rerun"
        actor: CompConsultant
        preconditions:
          - "screen.status == SCREENED"
        side_effects:
          - "same recomputation as the STALE -> SCREENED transition"

  - entity: OutreachEngagement
    initial_state: REQUESTED
    terminal_states: [HELD]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /exec-comp/outreach-engagements/{id}/schedule"
        actor: InvestorRelationsLead
        preconditions:
          - "engagement.engagement_status == REQUESTED (else ERR_ENGAGEMENT_STATE_INVALID)"
          - "the window does not intersect the program's quiet period (else ERR_QUIET_PERIOD_ENGAGEMENT)"
          - "the window does not overlap another SCHEDULED or HELD engagement with the same investor_key on the same program (else ERR_OUTREACH_WINDOW_OVERLAP)"
        side_effects:
          - "sets engagement_status = SCHEDULED; increments OutreachEngagement.version by 1"
      - from: SCHEDULED
        to: HELD
        trigger: "POST /exec-comp/outreach-engagements/{id}/hold"
        actor: InvestorRelationsLead
        preconditions:
          - "engagement.engagement_status == SCHEDULED (else ERR_ENGAGEMENT_STATE_INVALID)"
        side_effects:
          - "sets feedback_position, feedback_summary, held_at = current_utc, engagement_status = HELD"
          - "CASCADE L1: owning PayProgram recomputes outreach_coverage_pct (calculations.outreach_coverage)"
          - "CASCADE L2: caused by L1 — every ProxyAdvisorScreen of the program in status SCREENED transitions to STALE (coverage is a GLASS_LEWIS policy input)"
          - "increments OutreachEngagement.version by 1"

  - entity: RestatementEvent
    initial_state: DECLARED
    terminal_states: [CLOSED]
    transitions:
      - from: DECLARED
        to: ANALYZED
        trigger: "POST /exec-comp/restatement-events/{id}/analyze"
        actor: SecuritiesCounsel
        preconditions:
          - "event.status == DECLARED (else ERR_EVENT_STATE_INVALID)"
          - "every referenced incentive_metric_id resolves to an IncentiveMetric of a PayProgram of this company with status == CERTIFIED (else ERR_METRIC_NOT_CERTIFIED)"
        side_effects:
          - "each referenced IncentiveMetric transitions CERTIFIED -> RESTATED with restated_payout_factor_pct recomputed"
          - "creates one ClawbackDetermination in status CALCULATED for every in-scope PayoutAward whose recoverable_amount_usd > 0.00 (calculations.clawback_recoverable_amount); awards with recoverable_amount_usd == 0.00 produce no row"
          - "sets determination_count and recoverable_total_usd; increments RestatementEvent.version by 1"
      - from: ANALYZED
        to: RECOVERY_ORDERED
        trigger: "POST /exec-comp/restatement-events/{id}/order-recovery"
        actor: CompCommitteeChair
        preconditions:
          - "event.status == ANALYZED (else ERR_EVENT_STATE_INVALID)"
        side_effects:
          - "every ClawbackDetermination of this event in status CALCULATED transitions to NOTICED with noticed_at = current_utc"
          - "increments RestatementEvent.version by 1"
      - from: RECOVERY_ORDERED
        to: CLOSED
        trigger: "system: the last ClawbackDetermination of the event reaches status RECOVERED"
        actor: system
        preconditions:
          - "event.status == RECOVERY_ORDERED"
          - "every ClawbackDetermination of this event has status == RECOVERED"
        side_effects:
          - "sets status = CLOSED; increments RestatementEvent.version by 1"
        note: "Bubble-up: the parent state is a function of its children's states and is re-derived on every child transition, including the reversal that moves a child back to NOTICED."

  - entity: ClawbackDetermination
    initial_state: CALCULATED
    terminal_states: []
    transitions:
      - from: CALCULATED
        to: NOTICED
        trigger: "system: owning RestatementEvent transitions ANALYZED -> RECOVERY_ORDERED"
        actor: system
        preconditions:
          - "determination.status == CALCULATED"
        side_effects:
          - "sets noticed_at = current_utc; increments ClawbackDetermination.version by 1"
      - from: NOTICED
        to: RECOVERED
        trigger: "POST /exec-comp/clawback-determinations/{id}/recover"
        actor: CompCommitteeChair
        preconditions:
          - "determination.status == NOTICED (else ERR_DETERMINATION_STATE_INVALID)"
          - "determination.acknowledged_at IS NOT NULL (else ERR_DETERMINATION_NOT_ACKNOWLEDGED)"
        side_effects:
          - "CASCADE L1: sets recovered_at = current_utc, status = RECOVERED; the owning RestatementEvent recomputes recovered_total_usd and, when every determination is RECOVERED, transitions RECOVERY_ORDERED -> CLOSED; increments ClawbackDetermination.version by 1"
          - "CASCADE L2: caused by L1 — the linked PayoutAward transitions VESTED -> CLAWED_BACK with realized_value_usd reduced by recoverable_amount_usd"
          - "CASCADE L3: caused by L2 — the award's PayProgram recomputes realized_pay_total_usd, realizable_pay_total_usd, pay_percentile_rank, degree_of_alignment and alignment_status"
          - "CASCADE L4: caused by L3 — every ProxyAdvisorScreen of that program in status SCREENED transitions to STALE"
          - "CASCADE L5: caused by L4 — every CdaDraft of that program in status LEGAL_CLEARED transitions to DRAFTING with revision_round += 1"
      - from: RECOVERED
        to: NOTICED
        trigger: "POST /exec-comp/clawback-determinations/{id}/reverse-recovery"
        actor: CompCommitteeChair
        preconditions:
          - "determination.status == RECOVERED (else ERR_DETERMINATION_STATE_INVALID)"
        side_effects:
          - "clears recovered_at; sets status = NOTICED; owning RestatementEvent recomputes recovered_total_usd and reverts CLOSED -> RECOVERY_ORDERED when it had closed"
          - "the linked PayoutAward transitions CLAWED_BACK -> VESTED with realized_value_usd increased by recoverable_amount_usd"
          - "the award's PayProgram recomputes realized_pay_total_usd, realizable_pay_total_usd, pay_percentile_rank, degree_of_alignment and alignment_status"
          - "increments ClawbackDetermination.version by 1"
        note: "Compensating action for the recover transition; the pair conserves realized dollars."

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned mechanism)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: peer-member-add-stale-group
    parent_entity: PeerGroup
    write_endpoint: "POST /exec-comp/peer-groups/{id}/members"
    occ_field: "expected_peer_group_version"
    description: |
      Adding a peer to a PeerGroup whose version has advanced since the client
      last observed it is rejected. Membership changes legitimately supersede the
      group's screened medians and benchmark values, so a writer holding a stale
      view of the group would be composing a peer set against numbers that no
      longer exist.
    error_id: ERR_STALE_PEER_GROUP_VERSION
    http_status: 412
  - rule_id: mix-reallocation-stale-program
    parent_entity: PayProgram
    write_endpoint: "POST /exec-comp/pay-programs/{id}/mix-reallocation"
    occ_field: "expected_pay_program_version"
    description: |
      Reallocating pay-mix points on a PayProgram whose version has advanced
      since the client last observed it is rejected. Each reallocation legitimately
      supersedes the prior mix, so applying a delta derived from a stale mix would
      silently shift different components than the client intended.
    error_id: ERR_STALE_PAY_PROGRAM_VERSION
    http_status: 412
  - rule_id: goal-adjustment-stale-metric
    parent_entity: IncentiveMetric
    write_endpoint: "POST /exec-comp/incentive-metrics/{id}/adjustments"
    occ_field: "expected_incentive_metric_version"
    description: |
      Ordering a goal adjustment against an IncentiveMetric whose version has
      advanced since the client last observed it is rejected. An adjustment
      legitimately supersedes the locked goal curve, so a stale view would compute
      the 15.00% policy limit against a target that has already moved.
    error_id: ERR_STALE_INCENTIVE_METRIC_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: peer_size_band_fit
    trigger: "on POST /exec-comp/peer-groups/{id}/members, and on POST /exec-comp/companies/{id}/market-data for every ACCEPTED member of a PeerGroup in status DRAFT or SCREENED that references the refreshed company (as issuer or as peer)"
    algorithm: threshold
    formula: |
      issuer   = Company where id == member.PeerGroup.issuer_company_id
      peer     = Company where id == member.peer_company_id
      revenue_ratio    = round(peer.revenue_usd    / issuer.revenue_usd,    4)   # round_half_up
      market_cap_ratio = round(peer.market_cap_usd / issuer.market_cap_usd, 4)   # round_half_up
      in_size_band = (REVENUE_BAND_LOW <= revenue_ratio    <= REVENUE_BAND_HIGH)
                 AND (MCAP_BAND_LOW    <= market_cap_ratio <= MCAP_BAND_HIGH)
      # Both bands are CLOSED intervals: a ratio exactly equal to a bound is INSIDE the band.
    input_set: "exactly one peer Company and the issuer Company of the member's PeerGroup; member status is irrelevant to the ratio itself but only ACCEPTED members are recomputed on market-data refresh"
    constants:
      REVENUE_BAND_LOW: 0.5
      REVENUE_BAND_HIGH: 2.0
      MCAP_BAND_LOW: 0.25
      MCAP_BAND_HIGH: 4.0
    precision: "4 decimal places, round_half_up"

  - name: peer_group_medians
    trigger: "on POST /exec-comp/peer-groups/{id}/screen (DRAFT -> SCREENED)"
    algorithm: aggregation
    formula: |
      members = PeerGroupMember rows where peer_group_id == group.id AND status == ACCEPTED
      accepted_member_count = count(members)
      # Sort key is the peer's own field; ties are broken by the member row's created_at ASC.
      rev_sorted  = [Company(m.peer_company_id).revenue_usd    for m in members sorted by (peer.revenue_usd    ASC, m.created_at ASC)]
      mcap_sorted = [Company(m.peer_company_id).market_cap_usd for m in members sorted by (peer.market_cap_usd ASC, m.created_at ASC)]
      def median(xs):                       # PINNED: mean-of-middles for even n
          n = len(xs)
          if n % 2 == 1: return round(xs[(n - 1) // 2], 2)
          return round((xs[n // 2 - 1] + xs[n // 2]) / 2, 2)
      median_revenue_usd    = median(rev_sorted)
      median_market_cap_usd = median(mcap_sorted)
      issuer = Company(group.issuer_company_id)
      size_fit_score = round(100 * (1 - min(1, abs(median_revenue_usd - issuer.revenue_usd) / issuer.revenue_usd)), 2)
    input_set: "ACCEPTED members only; EXCLUDED members are never included, regardless of when they were excluded"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: benchmark_target_tdc
    trigger: "on POST /exec-comp/peer-groups/{id}/screen (DRAFT -> SCREENED), immediately after peer_group_medians"
    algorithm: weighted_scoring
    formula: |
      members = PeerGroupMember rows where peer_group_id == group.id AND status == ACCEPTED
      issuer  = Company(group.issuer_company_id)

      # --- variant RAW_MEDIAN ---------------------------------------------------
      raw_values = [Company(m.peer_company_id).ceo_tdc_usd for m in members]
      # --- variant SIZE_ADJUSTED ----------------------------------------------
      # PINNED ORDER: the adjustment factor is rounded to 4 dp FIRST, then multiplied,
      # then the product is rounded to 2 dp. Rounding the product first is wrong.
      adj_values = []
      for m in members:
          peer = Company(m.peer_company_id)
          factor = round(min(ADJ_FACTOR_HIGH, max(ADJ_FACTOR_LOW, issuer.revenue_usd / peer.revenue_usd)), 4)
          adj_values.append(round(peer.ceo_tdc_usd * factor, 2))

      # PINNED percentile method: NEAREST-RANK at the 50th percentile over the ASC-sorted
      # list, index = ceil(0.50 * n) - 1 (0-based). For even n this selects the LOWER
      # middle element and therefore does NOT equal the mean-of-middles median used by
      # peer_group_medians. Ties in value keep the member with the earlier created_at first.
      def p50_nearest_rank(xs):
          s = sorted(xs)                        # ASC; equal values ordered by member.created_at ASC
          return round(s[ceil(0.50 * len(s)) - 1], 2)

      benchmark_target_tdc_raw_usd      = p50_nearest_rank(raw_values)
      benchmark_target_tdc_adjusted_usd = p50_nearest_rank(adj_values)
      benchmark_target_tdc_usd = benchmark_target_tdc_raw_usd      if group.benchmark_basis == RAW_MEDIAN
                            else benchmark_target_tdc_adjusted_usd
    input_set: "ACCEPTED members only; both variants are always computed and stored, and benchmark_basis only selects which one populates benchmark_target_tdc_usd"
    constants:
      ADJ_FACTOR_LOW: 0.5
      ADJ_FACTOR_HIGH: 2.0
      PERCENTILE: 0.50
    precision: "factors 4 decimal places; money 2 decimal places; round_half_up throughout"
    variants:
      - name: RAW_MEDIAN
        when: "PeerGroup.benchmark_basis == RAW_MEDIAN"
        difference: "uses each peer's disclosed ceo_tdc_usd unadjusted, so a peer group skewed toward larger peers pulls the benchmark up"
      - name: SIZE_ADJUSTED
        when: "PeerGroup.benchmark_basis == SIZE_ADJUSTED"
        difference: "scales each peer's ceo_tdc_usd by the clamped issuer/peer revenue ratio before ranking, which reorders the list and therefore selects a different element as the 50th-percentile value"

  - name: target_total_direct_comp
    trigger: "on POST /exec-comp/pay-programs (creation), on POST /exec-comp/pay-programs/{id}/mix-reallocation, and as the L1 cascade of PeerGroup SCREENED -> APPROVED for programs in design_status DRAFT"
    algorithm: constraint_propagation
    formula: |
      ceo   = Executive(program.ceo_executive_id)
      group = PeerGroup(program.peer_group_id)
      performance_based_pct = round(program.sti_pct + round(program.lti_pct * program.lti_performance_share_pct / 100, 2), 2)

      # STEP 1 — fixed leg (salary + annual-incentive target), independent of LTI.
      sti_target_usd = round(ceo.base_salary_usd * ceo.sti_target_pct / 100, 2)
      fixed_leg_usd  = round(ceo.base_salary_usd + sti_target_usd, 2)

      if group.benchmark_target_tdc_usd IS NULL:
          benchmark_ratio = null; lti_multiple = null; lti_target_usd = null
          target_tdc_usd = null; benchmark_posture = UNBENCHMARKED
      else:
          # STEP 2 — benchmark fixed leg uses the program's declared salary+STI mix share.
          benchmark_fixed_leg_usd = round(group.benchmark_target_tdc_usd * (program.salary_pct + program.sti_pct) / 100, 2)
          benchmark_ratio = round(fixed_leg_usd / benchmark_fixed_leg_usd, 4)
          # STEP 3 — tier lookup. EVALUATION ORDER IS PINNED: the tier is keyed on the
          # STEP-2 ratio, which is derived from the FIXED LEG ONLY. It is NOT keyed on
          # target_tdc_usd (which does not exist yet) and is NOT re-evaluated after STEP 5.
          # There is no fixed-point iteration: the apparent circularity
          # (target_tdc -> tier -> lti_target -> target_tdc) is broken here, once.
          lti_multiple = LTI_MULTIPLE_LOW_TIER  if benchmark_ratio <  RATIO_TIER_MID
                    else LTI_MULTIPLE_MID_TIER  if benchmark_ratio <  RATIO_TIER_HIGH
                    else LTI_MULTIPLE_HIGH_TIER
          # STEP 4 / STEP 5
          lti_target_usd = round(fixed_leg_usd * lti_multiple, 2)
          target_tdc_usd = round(fixed_leg_usd + lti_target_usd, 2)
          posture_ratio  = round(target_tdc_usd / group.benchmark_target_tdc_usd, 4)
          benchmark_posture = ABOVE_MARKET if posture_ratio >= POSTURE_HIGH
                         else BELOW_MARKET if posture_ratio <= POSTURE_LOW
                         else ALIGNED
    input_set: "exactly one Executive (the program's CEO) and one PeerGroup; no other program's numbers participate"
    constants:
      RATIO_TIER_MID: 0.80
      RATIO_TIER_HIGH: 1.20
      LTI_MULTIPLE_LOW_TIER: 4.0
      LTI_MULTIPLE_MID_TIER: 3.0
      LTI_MULTIPLE_HIGH_TIER: 2.0
      POSTURE_HIGH: 1.20
      POSTURE_LOW: 0.80
      BENCHMARK_CAP_MULTIPLE: 1.50
    precision: "ratios 4 decimal places; money 2 decimal places; round_half_up"

  - name: metric_payout_factor
    trigger: "on POST /exec-comp/incentive-metrics/{id}/certify-result (RESULT_SUBMITTED -> CERTIFIED), and again on POST /exec-comp/restatement-events/{id}/analyze with the restated achievement to produce restated_payout_factor_pct"
    algorithm: threshold
    formula: |
      a  = metric.achieved_value          # non_gaap_adjusted_value when non-null, else as_reported_value
      T0 = metric.threshold_value; T1 = metric.target_value; T2 = metric.maximum_value
      P0 = metric.threshold_payout_pct;  P1 = metric.target_payout_pct;  P2 = metric.maximum_payout_pct

      if metric.direction == HIGHER_IS_BETTER:
          if metric.interpolation == LINEAR:
              if   a <  T0: f = 0.00
              elif a <  T1: f = P0 + (P1 - P0) * (a - T0) / (T1 - T0)
              elif a <  T2: f = P1 + (P2 - P1) * (a - T1) / (T2 - T1)
              else:         f = P2
          else:                                  # STEP
              if   a >= T2: f = P2
              elif a >= T1: f = P1
              elif a >= T0: f = P0
              else:         f = 0.00
      else:                                      # LOWER_IS_BETTER — the curve mirrors
          if metric.interpolation == LINEAR:
              if   a >  T0: f = 0.00
              elif a >  T1: f = P0 + (P1 - P0) * (T0 - a) / (T0 - T1)
              elif a >  T2: f = P1 + (P2 - P1) * (T1 - a) / (T1 - T2)
              else:         f = P2
          else:                                  # STEP
              if   a <= T2: f = P2
              elif a <= T1: f = P1
              elif a <= T0: f = P0
              else:         f = 0.00
      payout_factor_pct = round(f, 2)
      # Boundary semantics: achieved_value exactly equal to threshold_value pays exactly
      # threshold_payout_pct; exactly equal to maximum_value pays exactly maximum_payout_pct;
      # one unit of the metric beyond threshold in the failing direction pays 0.00.
    input_set: "the single IncentiveMetric row being certified; sibling metrics never enter this formula"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: annual_incentive_payout
    trigger: "as the L2 cascade of IncentiveMetric RESULT_SUBMITTED -> CERTIFIED once every metric of (pay_program_id, vehicle) is CERTIFIED; and on POST /exec-comp/pay-programs/{id}/payout-awards when those metrics are already CERTIFIED"
    algorithm: aggregation
    formula: |
      all_metrics = IncentiveMetric rows where pay_program_id == award.pay_program_id
                    AND vehicle == award.vehicle
      # A vehicle carrying NO metrics at all is never factored: an empty contribution list
      # must NOT collapse to 0.00, it leaves the award unfactored so the REALIZABLE variant
      # falls back to ASSUMED_TARGET_FACTOR_PCT.
      if count(all_metrics) == 0:
          certified_factor_pct = null; earned_amount_usd = null; STOP
      metrics = all_metrics where status IN {CERTIFIED, RESTATED}
      if count(metrics) != count(all_metrics):
          certified_factor_pct = null; earned_amount_usd = null; STOP
      # PINNED ROUNDING ORDER: round EACH metric's weighted contribution to 2 dp FIRST,
      # THEN sum the rounded contributions. Summing the unrounded products and rounding
      # the total afterwards is WRONG and produces a different cent (and a different
      # earned_amount_usd once multiplied by the target).
      contributions = [round(m.payout_factor_pct * m.weight_pct / 100, 2) for m in metrics]
      certified_factor_pct = round(sum(contributions), 2)

      if award.vehicle == ANNUAL_INCENTIVE:
          exec = Executive(award.executive_id)
          target_amount_usd = round(exec.base_salary_usd * exec.sti_target_pct / 100, 2)
          uncapped_usd = round(target_amount_usd * certified_factor_pct / 100, 2)
          cap_usd      = round(target_amount_usd * PayProgram(award.pay_program_id).sti_max_multiple, 2)
          earned_amount_usd = min(uncapped_usd, cap_usd)      # cap applied AFTER rounding
      else:
          target_amount_usd = 0.00
          earned_amount_usd = null
    input_set: "metrics of the award's own (pay_program_id, vehicle) pair in status CERTIFIED or RESTATED; metrics of the other vehicle and of other programs are excluded"
    constants: {}
    precision: "2 decimal places, round_half_up, per-contribution then summed"

  - name: realized_and_realizable_pay
    trigger: "on PayoutAward creation, on GRANTED -> VESTED/FORFEITED, on VESTED <-> CLAWED_BACK, as the L2 cascade of metric certification, and on POST /exec-comp/companies/{id}/market-data (share_price_usd change) for GRANTED awards"
    algorithm: dual_variant
    formula: |
      issuer = Company(PayProgram(award.pay_program_id).issuer_company_id)
      f      = award.certified_factor_pct if award.certified_factor_pct IS NOT NULL else ASSUMED_TARGET_FACTOR_PCT

      # --- variant REALIZED (chronological: only what has actually been delivered) ---
      if   award.status == GRANTED:   realized_value_usd = 0.00
      elif award.status == FORFEITED: realized_value_usd = 0.00
      elif award.status == VESTED:
           if award.vehicle == ANNUAL_INCENTIVE: realized_value_usd = award.earned_amount_usd
           elif award.vehicle == LONG_TERM_PSU:
                units_effective    = round(award.units_granted * award.certified_factor_pct / 100, 2)
                realized_value_usd = round(units_effective * award.vest_price_usd, 2)
           else:  # RSU
                realized_value_usd = round(award.units_granted * award.vest_price_usd, 2)
      elif award.status == CLAWED_BACK:
           realized_value_usd = round(value_at_vest - ClawbackDetermination.recoverable_amount_usd, 2)

      # --- variant REALIZABLE (forward-looking: outstanding grants marked to today) ---
      if   award.status == GRANTED:
           if award.vehicle == ANNUAL_INCENTIVE: realizable_value_usd = round(award.target_amount_usd * f / 100, 2)
           elif award.vehicle == LONG_TERM_PSU:  realizable_value_usd = round(award.units_granted * issuer.share_price_usd * f / 100, 2)
           else:                                 realizable_value_usd = round(award.units_granted * issuer.share_price_usd, 2)
      elif award.status == FORFEITED:            realizable_value_usd = 0.00
      else:                                      realizable_value_usd = award.realized_value_usd
    input_set: "one award at a time; the issuer's CURRENT share_price_usd for the realizable variant, the award's frozen vest_price_usd for the realized variant"
    constants:
      ASSUMED_TARGET_FACTOR_PCT: 100.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: REALIZED
        when: "reported as realized_value_usd and summed into PayProgram.realized_pay_total_usd"
        difference: "counts nothing for an outstanding grant and freezes delivered equity at vest_price_usd, so it is insensitive to later price moves"
      - name: REALIZABLE
        when: "reported as realizable_value_usd and summed into PayProgram.realizable_pay_total_usd"
        difference: "marks outstanding grants to the issuer's current share_price_usd and assumes ASSUMED_TARGET_FACTOR_PCT performance while no factor is certified, so identical award data yields a different total"

  - name: pay_for_performance_alignment
    trigger: "whenever a PayoutAward of the program changes realized_value_usd, realizable_value_usd or status; and as the L2 cascade of PeerGroup SCREENED -> APPROVED"
    algorithm: threshold
    formula: |
      awards = PayoutAward rows where pay_program_id == program.id AND status IN {GRANTED, VESTED, CLAWED_BACK}
      realized_pay_total_usd   = round(sum(a.realized_value_usd   for a in awards), 2)
      realizable_pay_total_usd = round(sum(a.realizable_value_usd for a in awards), 2)
      # FORFEITED awards are excluded from both totals.

      members = PeerGroupMember rows where peer_group_id == program.peer_group_id AND status == ACCEPTED
      if count(members) == 0 OR count(awards) == 0:
          pay_percentile_rank = null; degree_of_alignment = null; alignment_status = UNRATED
      else:
          below = count(m for m in members if Company(m.peer_company_id).ceo_tdc_usd < realized_pay_total_usd)
          pay_percentile_rank = round(100 * below / count(members), 2)
          degree_of_alignment = round(program.tsr_percentile_rank - pay_percentile_rank, 2)
          alignment_status = ALIGNED    if degree_of_alignment >= ALIGNED_FLOOR
                        else WATCH      if degree_of_alignment >= WATCH_FLOOR
                        else MISALIGNED
      # Boundaries are inclusive on the floor: exactly -10.00 is ALIGNED, exactly -30.00 is WATCH.
    input_set: "awards of this program in {GRANTED, VESTED, CLAWED_BACK} and ACCEPTED members of the program's peer group; strict `<` comparison against each peer's ceo_tdc_usd"
    constants:
      ALIGNED_FLOOR: -10.00
      WATCH_FLOOR: -30.00
    precision: "2 decimal places, round_half_up"

  - name: proxy_concern_score
    trigger: "on POST /exec-comp/pay-programs/{id}/proxy-advisor-screens and on POST /exec-comp/proxy-advisor-screens/{id}/rerun"
    algorithm: weighted_scoring
    formula: |
      p = PayProgram(screen.pay_program_id)
      d = p.degree_of_alignment if p.degree_of_alignment IS NOT NULL else 0.00
      adjusted_metric_count = count(IncentiveMetric where pay_program_id == p.id
                                    AND (status == ADJUSTED OR goal_adjustment_pct IS NOT NULL))
      alignment_component = round(max(0.00, min(100.00, MISALIGN_PIVOT - d)), 2)
      mix_component       = round(max(0.00, 100.00 - p.performance_based_pct), 2)
      rigor_component     = round(min(100.00, RIGOR_PER_ADJUSTMENT * adjusted_metric_count), 2)
      if screen.advisor == ISS:
          outreach_component = null
          concern_score = round(ISS_W_ALIGN * alignment_component
                              + ISS_W_MIX   * mix_component
                              + ISS_W_RIGOR * rigor_component, 2)
      else:                                        # GLASS_LEWIS
          outreach_component = round(max(0.00, 100.00 - p.outreach_coverage_pct), 2)
          concern_score = round(GL_W_ALIGN * alignment_component
                              + GL_W_MIX   * mix_component
                              + GL_W_RIGOR * rigor_component
                              + GL_W_OUTREACH * outreach_component, 2)
      concern_level  = LOW    if concern_score <  LEVEL_MEDIUM_FLOOR
                  else MEDIUM if concern_score <  LEVEL_HIGH_FLOOR
                  else HIGH
      recommendation = AGAINST if concern_level == HIGH else FOR
      # Boundaries: exactly 30.00 is MEDIUM, exactly 60.00 is HIGH.
    input_set: "the single PayProgram the screen points at, its IncentiveMetric rows for the rigor component, and its outreach_coverage_pct for the GLASS_LEWIS component only"
    constants:
      MISALIGN_PIVOT: 50.00
      RIGOR_PER_ADJUSTMENT: 25.00
      ISS_W_ALIGN: 0.50
      ISS_W_MIX: 0.30
      ISS_W_RIGOR: 0.20
      GL_W_ALIGN: 0.35
      GL_W_MIX: 0.15
      GL_W_RIGOR: 0.30
      GL_W_OUTREACH: 0.20
      LEVEL_MEDIUM_FLOOR: 30.00
      LEVEL_HIGH_FLOOR: 60.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: ISS
        when: "ProxyAdvisorScreen.advisor == ISS"
        difference: "weights alignment at 0.50 and ignores engagement entirely (outreach_component is null), so an issuer with zero outreach is not penalised"
      - name: GLASS_LEWIS
        when: "ProxyAdvisorScreen.advisor == GLASS_LEWIS"
        difference: "weights alignment at only 0.35 but adds a 0.20-weighted engagement penalty, so identical program data yields a higher score and can land in a different concern_level band"

  - name: goal_adjustment_magnitude
    trigger: "on POST /exec-comp/incentive-metrics/{id}/adjustments, before the policy-limit check"
    algorithm: threshold
    formula: |
      new_target = request.target_value if present else metric.target_value
      goal_adjustment_pct = round(100 * abs(new_target - metric.locked_target_value) / abs(metric.locked_target_value), 2)
      reject with ERR_ADJUSTMENT_EXCEEDS_POLICY_LIMIT when goal_adjustment_pct > ADJUSTMENT_LIMIT_PCT
      # Exactly ADJUSTMENT_LIMIT_PCT is permitted; strictly greater is rejected.
    input_set: "the single metric being adjusted; locked_target_value is the snapshot taken at LOCKED and never moves"
    constants:
      ADJUSTMENT_LIMIT_PCT: 15.00
    precision: "2 decimal places, round_half_up"

  - name: say_on_pay_support
    trigger: "on POST /exec-comp/pay-programs/{id}/vote-certification"
    algorithm: threshold
    formula: |
      denominator = votes_for + votes_against          # PINNED: abstentions are EXCLUDED
      if denominator == 0: reject with ERR_INVALID_REQUEST
      support_pct = round(100 * votes_for / denominator, 2)
      vote_status = PASSED if support_pct >= PASS_FLOOR_PCT else FAILED
      enhanced_engagement_required = (support_pct < RESPONSIVENESS_FLOOR_PCT)
      # Exactly PASS_FLOOR_PCT passes. Exactly RESPONSIVENESS_FLOOR_PCT does NOT trigger
      # enhanced engagement and closes the program.
    input_set: "the three vote tallies supplied in the request; abstentions are stored for disclosure but never enter the denominator"
    constants:
      PASS_FLOOR_PCT: 50.00
      RESPONSIVENESS_FLOOR_PCT: 70.00
    precision: "2 decimal places, round_half_up"

  - name: outreach_coverage
    trigger: "on POST /exec-comp/outreach-engagements/{id}/hold (SCHEDULED -> HELD)"
    algorithm: aggregation
    formula: |
      held = OutreachEngagement rows where pay_program_id == program.id AND engagement_status == HELD
      # Dedup: at most one row per investor_key contributes. When an investor_key has
      # several HELD rows, the row with the EARLIEST created_at is the contributor
      # (created_at ASC; no other tie-break is needed because created_at is unique per row).
      contributors = [earliest-created_at row per distinct investor_key in held]
      outreach_coverage_pct = round(min(100.00, sum(r.ownership_pct for r in contributors)), 2)
    input_set: "HELD engagements of this program only; REQUESTED and SCHEDULED rows contribute nothing"
    constants:
      REMEDIATION_COVERAGE_FLOOR_PCT: 30.00
    precision: "2 decimal places, round_half_up"

  - name: outreach_window_conflict
    trigger: "on POST /exec-comp/outreach-engagements/{id}/schedule"
    algorithm: interval_merge
    formula: |
      p = PayProgram(candidate.pay_program_id)
      # (1) QUIET PERIOD — a CLOSED interval ending at the meeting instant.
      quiet_start = p.meeting_date - QUIET_PERIOD_DAYS days
      quiet_end   = p.meeting_date
      intersects_quiet = (candidate.window_start <= quiet_end) AND (candidate.window_end > quiet_start)
      # (2) SAME-INVESTOR OVERLAP — HALF-OPEN [window_start, window_end) intervals, so
      # exact adjacency (prior.window_end == candidate.window_start) is PERMITTED.
      rivals = OutreachEngagement rows where pay_program_id == p.id
               AND investor_key == candidate.investor_key AND id != candidate.id
               AND engagement_status IN {SCHEDULED, HELD}
      overlaps = any(r for r in rivals
                     if candidate.window_start < r.window_end AND r.window_start < candidate.window_end)
    input_set: "SCHEDULED and HELD engagements of the same program sharing the candidate's investor_key; REQUESTED rivals are ignored"
    constants:
      QUIET_PERIOD_DAYS: 10
    precision: "instant comparison at second granularity"

  - name: restatement_lookback_conflict
    trigger: "on POST /exec-comp/companies/{id}/restatement-events"
    algorithm: interval_merge
    formula: |
      # CLOSED intervals on BOTH ends, PLUS a symmetric buffer: two lookback periods on
      # the same company collide when they are within LOOKBACK_BUFFER_DAYS of each other,
      # so exact adjacency is FORBIDDEN (unlike the half-open outreach windows).
      rivals = RestatementEvent rows where company_id == candidate.company_id
               AND status IN {DECLARED, ANALYZED, RECOVERY_ORDERED}
      buffer = LOOKBACK_BUFFER_DAYS days
      collides = any(r for r in rivals
                     if candidate.lookback_start <= (r.lookback_end + buffer)
                     AND candidate.lookback_end  >= (r.lookback_start - buffer))
    input_set: "non-CLOSED restatement events of the same company; CLOSED events never block a new declaration"
    constants:
      LOOKBACK_BUFFER_DAYS: 1
    precision: "instant comparison at second granularity"

  - name: clawback_recoverable_amount
    trigger: "on POST /exec-comp/restatement-events/{id}/analyze (DECLARED -> ANALYZED)"
    algorithm: waterfall_allocation
    formula: |
      in_scope = PayoutAward rows a where
          PayProgram(a.pay_program_id).issuer_company_id == event.company_id
          AND a.vehicle IN {ANNUAL_INCENTIVE, LONG_TERM_PSU}
          AND a.status == VESTED
          AND event.lookback_start <= a.settlement_date <= event.lookback_end   # CLOSED both ends
      # Awards are processed in settlement_date ASC, created_at ASC order.
      for a in in_scope:
          original_factor_pct = a.certified_factor_pct
          # restated factor: recompute every metric of (a.pay_program_id, a.vehicle) with the
          # restated achievement supplied in the request (metrics not named keep achieved_value),
          # then re-run annual_incentive_payout's PINNED per-metric-rounding order.
          restated_factor_pct = round(sum(round(m.restated_or_current_factor_pct * m.weight_pct / 100, 2)
                                          for m in metrics_of(a.pay_program_id, a.vehicle)), 2)
          if original_factor_pct == 0.00:
              restated_amount_usd   = a.realized_value_usd     # division guard
              recoverable_amount_usd = 0.00
          else:
              restated_amount_usd    = round(a.realized_value_usd * restated_factor_pct / original_factor_pct, 2)
              recoverable_amount_usd = max(0.00, round(a.realized_value_usd - restated_amount_usd, 2))
          create ClawbackDetermination only when recoverable_amount_usd > 0.00
      determination_count    = count(created rows)
      recoverable_total_usd  = round(sum(r.recoverable_amount_usd for r in created rows), 2)
      # Zero-boundary: when no award yields a positive recoverable amount the event still
      # reaches ANALYZED with determination_count == 0 and recoverable_total_usd == 0.00.
      # CONSERVED QUANTITY (invariant): for every determination,
      #   PayoutAward.realized_value_usd + RestatementEvent.recovered_total_usd
      # is unchanged by the recover/reverse-recovery pair.
    input_set: "VESTED incentive awards of the restating issuer whose settlement_date lies inside the CLOSED lookback window; GRANTED, FORFEITED, CLAWED_BACK and RSU awards are out of scope"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: pay_mix_reallocation
    trigger: "on POST /exec-comp/pay-programs/{id}/mix-reallocation"
    algorithm: constraint_propagation
    formula: |
      # CONSERVED QUANTITY (invariant): salary_pct + sti_pct + lti_pct == MIX_TOTAL_PCT
      # before and after every reallocation, and the forward/reverse pair restores each
      # component to its exact prior value.
      from_new = round(program[request.from_component] - request.points, 2)
      to_new   = round(program[request.to_component]   + request.points, 2)
      reject with ERR_MIX_COMPONENT_OUT_OF_BOUNDS when from_new < MIX_COMPONENT_MIN
                                                    OR from_new > MIX_COMPONENT_MAX
                                                    OR to_new   < MIX_COMPONENT_MIN
                                                    OR to_new   > MIX_COMPONENT_MAX
      reject with ERR_PAY_MIX_MUST_TOTAL_100 when round(sum of the three resulting components, 2) != MIX_TOTAL_PCT
      then re-run target_total_direct_comp for the program
    input_set: "the single program named in the path; from_component and to_component must be different members of {SALARY, STI, LTI}"
    constants:
      MIX_TOTAL_PCT: 100.00
      MIX_COMPONENT_MIN: 5.00
      MIX_COMPONENT_MAX: 80.00
    precision: "2 decimal places, round_half_up"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the five roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every path id resolves to an existing row, validated left-to-right"
    error_id: "ERR_COMPANY_NOT_FOUND | ERR_PEER_GROUP_NOT_FOUND | ERR_PEER_GROUP_MEMBER_NOT_FOUND | ERR_EXECUTIVE_NOT_FOUND | ERR_PAY_PROGRAM_NOT_FOUND | ERR_INCENTIVE_METRIC_NOT_FOUND | ERR_PAYOUT_AWARD_NOT_FOUND | ERR_CDA_DRAFT_NOT_FOUND | ERR_SCREEN_NOT_FOUND | ERR_ENGAGEMENT_NOT_FOUND | ERR_RESTATEMENT_EVENT_NOT_FOUND | ERR_DETERMINATION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 4
    category: existence
    check: "every FK supplied in the request body resolves to an existing row (peer_company_id, peer_group_id, ceo_executive_id, executive_id, payout_award_id), validated in the order the endpoint's input list declares them"
    error_id: "ERR_COMPANY_NOT_FOUND | ERR_PEER_GROUP_NOT_FOUND | ERR_EXECUTIVE_NOT_FOUND | ERR_PAYOUT_AWARD_NOT_FOUND"
    http_status: 404
    applies_to: "POST /exec-comp/peer-groups, POST /exec-comp/peer-groups/{id}/members, POST /exec-comp/pay-programs, POST /exec-comp/pay-programs/{id}/payout-awards"

  - priority: 5
    category: auth
    check: "a NamedExecutiveOfficer may only read or act on rows whose executive_id (directly, or via the determination's PayoutAward) equals the acting X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "GET /exec-comp/payout-awards, GET /exec-comp/payout-awards/{id}, GET /exec-comp/clawback-determinations, GET /exec-comp/clawback-determinations/{id}, POST /exec-comp/clawback-determinations/{id}/acknowledge"

  - priority: 6
    category: business_constraint
    check: "request body is well-formed: required fields present, enums within their declared sets, numbers non-negative where the field's semantics require it, from_component != to_component, points > 0, vote tallies integers with votes_for + votes_against > 0, window_end > window_start, lookback_end > lookback_start, ISO-8601 instants parseable"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 7
    category: business_constraint
    check: "expected_<parent>_version equals the parent's current version (§1.2.1 optimistic concurrency)"
    error_id: "ERR_STALE_PEER_GROUP_VERSION | ERR_STALE_PAY_PROGRAM_VERSION | ERR_STALE_INCENTIVE_METRIC_VERSION"
    http_status: 412
    applies_to: "POST /exec-comp/peer-groups/{id}/members, POST /exec-comp/pay-programs/{id}/mix-reallocation, POST /exec-comp/incentive-metrics/{id}/adjustments"

  - priority: 8
    category: auth
    check: "segregation of duties: the acting X-User-ID must differ from the user recorded on the conflicting earlier step — CdaDraft.authored_by_user_id may not legal-clear the same draft; IncentiveMetric.adjusted_by_user_id may not certify that metric's result; ClawbackDetermination.acknowledged_by_user_id may not order its recovery"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /exec-comp/cda-drafts/{id}/legal-clear, POST /exec-comp/incentive-metrics/{id}/certify-result, POST /exec-comp/clawback-determinations/{id}/recover"

  - priority: 9
    category: state
    check: "the owning PeerGroup is still mutable: status == DRAFT for member add and for screening, status IN {DRAFT, SCREENED} for member exclusion; APPROVED is always rejected"
    error_id: ERR_PEER_GROUP_NOT_MUTABLE
    http_status: 409
    applies_to: "POST /exec-comp/peer-groups/{id}/members, POST /exec-comp/peer-group-members/{id}/exclude, POST /exec-comp/peer-groups/{id}/screen"

  - priority: 10
    category: state
    check: "PeerGroup is in SCREENED before it can be approved"
    error_id: ERR_PEER_GROUP_NOT_SCREENED
    http_status: 409
    applies_to: "POST /exec-comp/peer-groups/{id}/approve"

  - priority: 11
    category: state
    check: "PayProgram.design_status is DRAFT for mix reallocation, metric definition and committee approval"
    error_id: ERR_PROGRAM_NOT_MUTABLE
    http_status: 409
    applies_to: "POST /exec-comp/pay-programs/{id}/mix-reallocation, POST /exec-comp/pay-programs/{id}/incentive-metrics, POST /exec-comp/pay-programs/{id}/approve"

  - priority: 12
    category: state
    check: "IncentiveMetric is in the state the operation requires: LOCKED for adjustments, LOCKED or ADJUSTED for result submission, RESULT_SUBMITTED for certification"
    error_id: ERR_METRIC_STATE_INVALID
    http_status: 409
    applies_to: "POST /exec-comp/incentive-metrics/{id}/adjustments, POST /exec-comp/incentive-metrics/{id}/results, POST /exec-comp/incentive-metrics/{id}/certify-result"

  - priority: 13
    category: state
    check: "PayoutAward is in GRANTED before settlement (vest or forfeit)"
    error_id: ERR_AWARD_NOT_GRANTED
    http_status: 409
    applies_to: "POST /exec-comp/payout-awards/{id}/settlement"

  - priority: 14
    category: state
    check: "CdaDraft is in the state the operation requires: DRAFTING for submit-review, IN_REVIEW or FILED for request-revision, IN_REVIEW for legal-clear, LEGAL_CLEARED for file"
    error_id: ERR_CDA_STATE_INVALID
    http_status: 409
    applies_to: "POST /exec-comp/cda-drafts/{id}/submit-review, POST /exec-comp/cda-drafts/{id}/request-revision, POST /exec-comp/cda-drafts/{id}/legal-clear, POST /exec-comp/cda-drafts/{id}/file"

  - priority: 15
    category: state
    check: "OutreachEngagement is REQUESTED before scheduling and SCHEDULED before being held"
    error_id: ERR_ENGAGEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /exec-comp/outreach-engagements/{id}/schedule, POST /exec-comp/outreach-engagements/{id}/hold"

  - priority: 16
    category: state
    check: "PayProgram.design_status is DISCLOSED before a say-on-pay result can be certified"
    error_id: ERR_PROGRAM_NOT_DISCLOSED
    http_status: 409
    applies_to: "POST /exec-comp/pay-programs/{id}/vote-certification"

  - priority: 17
    category: state
    check: "PayProgram.vote_status is NOT_VOTED when certifying a say-on-pay result, and also when reopening a FILED CD&A section for amendment"
    error_id: ERR_VOTE_ALREADY_CERTIFIED
    http_status: 409
    applies_to: "POST /exec-comp/pay-programs/{id}/vote-certification, POST /exec-comp/cda-drafts/{id}/request-revision"

  - priority: 18
    category: state
    check: "PayProgram.vote_status is FAILED before a remediation package can be recorded"
    error_id: ERR_VOTE_NOT_FAILED
    http_status: 409
    applies_to: "POST /exec-comp/pay-programs/{id}/remediation"

  - priority: 19
    category: state
    check: "RestatementEvent is DECLARED for analysis and ANALYZED for recovery ordering"
    error_id: ERR_EVENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /exec-comp/restatement-events/{id}/analyze, POST /exec-comp/restatement-events/{id}/order-recovery"

  - priority: 20
    category: state
    check: "ClawbackDetermination is NOTICED for acknowledge and recover, and RECOVERED for reverse-recovery"
    error_id: ERR_DETERMINATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /exec-comp/clawback-determinations/{id}/acknowledge, POST /exec-comp/clawback-determinations/{id}/recover, POST /exec-comp/clawback-determinations/{id}/reverse-recovery"

  - priority: 21
    category: business_safety
    check: "an engagement window may not intersect the CLOSED quiet period [meeting_date - 10 days, meeting_date]; the SEC-mandated pre-vote blackout outranks every scheduling-hygiene rule below"
    error_id: ERR_QUIET_PERIOD_ENGAGEMENT
    http_status: 409
    applies_to: "POST /exec-comp/outreach-engagements/{id}/schedule"

  - priority: 22
    category: business_safety
    check: "a determination must be acknowledged by the affected executive before recovery is executed"
    error_id: ERR_DETERMINATION_NOT_ACKNOWLEDGED
    http_status: 422
    applies_to: "POST /exec-comp/clawback-determinations/{id}/recover"

  - priority: 23
    category: business_referential
    check: "a peer company may not be a delisted company (listing_status == DELISTED)"
    error_id: ERR_PEER_COMPANY_DELISTED
    http_status: 422
    applies_to: "POST /exec-comp/peer-groups/{id}/members"

  - priority: 24
    category: business_referential
    check: "a peer company may not be the group's own issuer"
    error_id: ERR_PEER_IS_ISSUER
    http_status: 422
    applies_to: "POST /exec-comp/peer-groups/{id}/members"

  - priority: 25
    category: business_referential
    check: "the program's PeerGroup must be APPROVED before the compensation committee can approve the program; the referential gate on the benchmark outranks the fiscal cap check below"
    error_id: ERR_PEER_GROUP_NOT_APPROVED
    http_status: 409
    applies_to: "POST /exec-comp/pay-programs/{id}/approve"

  - priority: 26
    category: business_referential
    check: "a current (status == SCREENED) ISS ProxyAdvisorScreen must exist for the program before its CD&A can be legally cleared"
    error_id: ERR_ISS_SCREEN_NOT_CURRENT
    http_status: 409
    applies_to: "POST /exec-comp/cda-drafts/{id}/legal-clear"

  - priority: 27
    category: business_referential
    check: "every metric of the program must be CERTIFIED (or RESTATED) before an award can be settled as VESTED"
    error_id: ERR_METRIC_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /exec-comp/payout-awards/{id}/settlement"

  - priority: 28
    category: business_referential
    check: "the CD_AND_A draft of the program must be FILED before a say-on-pay vote result can be certified"
    error_id: ERR_CDA_NOT_FILED
    http_status: 409
    applies_to: "POST /exec-comp/pay-programs/{id}/vote-certification"

  - priority: 29
    category: business_constraint
    check: "only one Company may carry is_issuer == true per ticker, and a ticker is unique across companies"
    error_id: ERR_ISSUER_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /exec-comp/companies"

  - priority: 30
    category: business_constraint
    check: "a peer company may appear at most once per peer group, counting EXCLUDED members"
    error_id: ERR_PEER_ALREADY_IN_GROUP
    http_status: 409
    applies_to: "POST /exec-comp/peer-groups/{id}/members"

  - priority: 31
    category: business_constraint
    check: "(pay_program_id, metric_code, vehicle) is unique"
    error_id: ERR_METRIC_ALREADY_DEFINED
    http_status: 409
    applies_to: "POST /exec-comp/pay-programs/{id}/incentive-metrics"

  - priority: 32
    category: business_constraint
    check: "(pay_program_id, section_code) is unique"
    error_id: ERR_CDA_SECTION_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /exec-comp/pay-programs/{id}/cda-drafts"

  - priority: 33
    category: business_constraint
    check: "(pay_program_id, advisor) is unique — rerun the existing screen instead of creating a second one"
    error_id: ERR_SCREEN_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /exec-comp/pay-programs/{id}/proxy-advisor-screens"

  - priority: 34
    category: business_temporal
    check: "an engagement window_start must be at or after the current logical time"
    error_id: ERR_ENGAGEMENT_WINDOW_IN_PAST
    http_status: 422
    applies_to: "POST /exec-comp/outreach-engagements/{id}/schedule"

  - priority: 35
    category: business_temporal
    check: "the candidate HALF-OPEN window [window_start, window_end) may not overlap another SCHEDULED or HELD window of the same program and the same investor_key; exact adjacency is allowed"
    error_id: ERR_OUTREACH_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /exec-comp/outreach-engagements/{id}/schedule"

  - priority: 36
    category: business_temporal
    check: "the candidate CLOSED lookback period may not come within 1 day of another non-CLOSED restatement event's lookback period for the same company; exact adjacency is forbidden"
    error_id: ERR_LOOKBACK_PERIOD_COLLISION
    http_status: 409
    applies_to: "POST /exec-comp/companies/{id}/restatement-events"

  - priority: 37
    category: business_temporal
    check: "a program's meeting_date must be strictly after the current logical time when the program is created"
    error_id: ERR_MEETING_DATE_NOT_FUTURE
    http_status: 422
    applies_to: "POST /exec-comp/pay-programs"

  - priority: 38
    category: business_constraint
    check: "salary_pct + sti_pct + lti_pct must equal exactly 100.00"
    error_id: ERR_PAY_MIX_MUST_TOTAL_100
    http_status: 422
    applies_to: "POST /exec-comp/pay-programs, POST /exec-comp/pay-programs/{id}/mix-reallocation"

  - priority: 39
    category: business_constraint
    check: "each of salary_pct, sti_pct and lti_pct must lie in the CLOSED range [5.00, 80.00]"
    error_id: ERR_MIX_COMPONENT_OUT_OF_BOUNDS
    http_status: 422
    applies_to: "POST /exec-comp/pay-programs, POST /exec-comp/pay-programs/{id}/mix-reallocation"

  - priority: 40
    category: business_constraint
    check: "the goal curve must be strictly monotonic in the metric's direction: threshold < target < maximum for HIGHER_IS_BETTER, threshold > target > maximum for LOWER_IS_BETTER"
    error_id: ERR_GOAL_CURVE_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /exec-comp/pay-programs/{id}/incentive-metrics, POST /exec-comp/incentive-metrics/{id}/adjustments"

  - priority: 41
    category: business_constraint
    check: "the weight_pct values of the program's metrics for a vehicle must sum to exactly 100.00 at committee approval"
    error_id: ERR_METRIC_WEIGHTS_NOT_100
    http_status: 422
    applies_to: "POST /exec-comp/pay-programs/{id}/approve"

  - priority: 42
    category: business_constraint
    check: "a candidate peer must satisfy peer_size_band_fit (in_size_band == true) unless inclusion_reason is BUSINESS_MODEL_ANALOG or TALENT_COMPETITOR, which permit an out-of-band peer"
    error_id: ERR_PEER_OUTSIDE_SIZE_BAND
    http_status: 422
    applies_to: "POST /exec-comp/peer-groups/{id}/members"

  - priority: 43
    category: business_constraint
    check: "a peer group must have at least one ACCEPTED member to be screened"
    error_id: ERR_PEER_GROUP_EMPTY
    http_status: 422
    applies_to: "POST /exec-comp/peer-groups/{id}/screen"

  - priority: 44
    category: business_constraint
    check: "the CD&A draft must include every required table (required_tables_included == true) and, for the CD_AND_A section, reach word_count >= 1500 before legal clearance"
    error_id: ERR_CDA_TABLES_INCOMPLETE
    http_status: 422
    applies_to: "POST /exec-comp/cda-drafts/{id}/legal-clear"

  - priority: 45
    category: business_fiscal
    check: "a goal adjustment may not move target_value more than 15.00% away from locked_target_value"
    error_id: ERR_ADJUSTMENT_EXCEEDS_POLICY_LIMIT
    http_status: 422
    applies_to: "POST /exec-comp/incentive-metrics/{id}/adjustments"

  - priority: 46
    category: business_fiscal
    check: "target_tdc_usd may not exceed 1.50 x the peer group's benchmark_target_tdc_usd at committee approval"
    error_id: ERR_TDC_EXCEEDS_BENCHMARK_CAP
    http_status: 422
    applies_to: "POST /exec-comp/pay-programs/{id}/approve"

  - priority: 47
    category: business_fiscal
    check: "a remediation package requires outreach_coverage_pct >= 30.00 of shares outstanding engaged"
    error_id: ERR_OUTREACH_COVERAGE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /exec-comp/pay-programs/{id}/remediation"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
#   api_prefix: /exec-comp
#   Read surface (20 endpoints) — every FK declared in §1.1 is reverse-reachable
#   either as a sub-resource list or as a filtered list.
# ---------------------------------------------------------------------------
endpoints:
  # ---------------------- Company ----------------------
  - method: POST
    path: "/exec-comp/companies"
    description: "Register a public company. Exactly one company per ticker may carry is_issuer == true; peers are registered the same way with is_issuer false."
    roles: [CompConsultant]
    code: 201
    input: ["legal_name", "ticker", "is_issuer", "gics_sector", "revenue_usd", "market_cap_usd", "share_price_usd", "ceo_tdc_usd", "listing_status?"]
    output: Company
    side_effects: ["sets listing_status to ACTIVE when omitted", "sets market_data_updated_at to the current logical time"]

  - method: GET
    path: "/exec-comp/companies/{id}"
    description: "Read one company including its current market data."
    roles: [CompConsultant, CompCommitteeChair, SecuritiesCounsel, InvestorRelationsLead]
    code: 200
    input: []
    output: Company
    side_effects: []

  - method: POST
    path: "/exec-comp/companies/{id}/market-data"
    description: "Refresh a company's market data (revenue, market capitalisation, share price, disclosed CEO total direct compensation, listing status). This is the operator surface that drives every downstream re-derivation."
    roles: [CompConsultant]
    code: 200
    input: ["revenue_usd?", "market_cap_usd?", "share_price_usd?", "ceo_tdc_usd?", "listing_status?"]
    output: Company
    side_effects:
      - "sets market_data_updated_at to the current logical time"
      - "recomputes peer_size_band_fit for every ACCEPTED PeerGroupMember of a DRAFT or SCREENED PeerGroup that references this company as issuer or as peer (L1)"
      - "recomputes realized_and_realizable_pay for every GRANTED PayoutAward of a PayProgram whose issuer is this company (L2)"
      - "recomputes pay_for_performance_alignment for those PayPrograms (L3)"

  - method: GET
    path: "/exec-comp/companies/{id}/peer-groups"
    description: "List the peer groups this company owns as issuer."
    roles: [CompConsultant, CompCommitteeChair, SecuritiesCounsel]
    code: 200
    input: ["limit?", "offset?"]
    output: PeerGroup[]
    side_effects: []

  - method: GET
    path: "/exec-comp/companies/{id}/peer-memberships"
    description: "List the peer-group memberships in which this company appears AS A PEER of somebody else's group."
    roles: [CompConsultant, CompCommitteeChair]
    code: 200
    input: ["limit?", "offset?"]
    output: PeerGroupMember[]
    side_effects: []

  - method: GET
    path: "/exec-comp/companies/{id}/executives"
    description: "List the named executive officers of a company."
    roles: [CompConsultant, CompCommitteeChair, SecuritiesCounsel]
    code: 200
    input: ["limit?", "offset?"]
    output: Executive[]
    side_effects: []

  - method: GET
    path: "/exec-comp/companies/{id}/restatement-events"
    description: "List the accounting restatement events declared against a company."
    roles: [CompConsultant, CompCommitteeChair, SecuritiesCounsel]
    code: 200
    input: ["limit?", "offset?"]
    output: RestatementEvent[]
    side_effects: []

  # ---------------------- Executive ----------------------
  - method: POST
    path: "/exec-comp/companies/{id}/executives"
    description: "Register a named executive officer with the salary and annual-incentive target that anchor every payout formula."
    roles: [CompConsultant]
    code: 201
    input: ["full_name", "role_title", "is_neo?", "base_salary_usd", "sti_target_pct"]
    output: Executive
    side_effects: ["sets is_neo to true when omitted"]

  # ---------------------- PeerGroup ----------------------
  - method: POST
    path: "/exec-comp/peer-groups"
    description: "Open a DRAFT peer group for an issuer and fiscal year, choosing the benchmarking basis that will select which of the two benchmark variants drives the target."
    roles: [CompConsultant]
    code: 201
    input: ["issuer_company_id", "fiscal_year", "benchmark_basis"]
    output: PeerGroup
    side_effects: ["sets status to DRAFT", "sets accepted_member_count to 0"]

  - method: GET
    path: "/exec-comp/peer-groups/{id}"
    description: "Read one peer group including both benchmark variants and the selected benchmark_target_tdc_usd."
    roles: [CompConsultant, CompCommitteeChair, SecuritiesCounsel]
    code: 200
    input: []
    output: PeerGroup
    side_effects: []

  - method: POST
    path: "/exec-comp/peer-groups/{id}/members"
    description: "Add a candidate peer to a DRAFT peer group. Optimistic concurrency: expected_peer_group_version must equal the group's current version."
    roles: [CompConsultant]
    code: 201
    input: ["peer_company_id", "inclusion_reason", "expected_peer_group_version"]
    output: PeerGroupMember
    side_effects:
      - "computes peer_size_band_fit (revenue_ratio, market_cap_ratio, in_size_band)"
      - "sets status to ACCEPTED"
      - "increments PeerGroup.version by 1"
      - "increments PeerGroup.accepted_member_count by 1"

  - method: GET
    path: "/exec-comp/peer-groups/{id}/members"
    description: "List the members of a peer group, ACCEPTED and EXCLUDED alike."
    roles: [CompConsultant, CompCommitteeChair, SecuritiesCounsel]
    code: 200
    input: ["limit?", "offset?"]
    output: PeerGroupMember[]
    side_effects: []

  - method: POST
    path: "/exec-comp/peer-group-members/{id}/exclude"
    description: "Exclude an ACCEPTED member from a DRAFT or SCREENED peer group, recording why the peer was dropped. Excluding from a SCREENED group invalidates the benchmark and sends the group back to DRAFT."
    roles: [CompConsultant]
    code: 200
    input: ["exclusion_reason"]
    output: PeerGroupMember
    side_effects:
      - "L1: sets status to EXCLUDED and exclusion_reason from the body"
      - "L2: decrements PeerGroup.accepted_member_count by 1 and, when the group was SCREENED, transitions it SCREENED -> DRAFT clearing every median, size_fit_score, screened_at and both benchmark variants"
      - "L3: clears benchmark_ratio, lti_multiple, lti_target_usd and target_tdc_usd and sets benchmark_posture to UNBENCHMARKED on every DRAFT PayProgram referencing the group"
      - "L4: transitions every SCREENED ProxyAdvisorScreen of those programs to STALE"

  - method: POST
    path: "/exec-comp/peer-groups/{id}/screen"
    description: "Screen a DRAFT peer group: compute the medians, the size-fit score and BOTH benchmark variants, then move it to SCREENED."
    roles: [CompConsultant]
    code: 200
    input: []
    output: PeerGroup
    side_effects:
      - "computes peer_group_medians (median_revenue_usd, median_market_cap_usd, size_fit_score, accepted_member_count)"
      - "computes benchmark_target_tdc (benchmark_target_tdc_raw_usd, benchmark_target_tdc_adjusted_usd, benchmark_target_tdc_usd)"
      - "sets screened_at to the current logical time"
      - "sets status to SCREENED"

  - method: POST
    path: "/exec-comp/peer-groups/{id}/approve"
    description: "Committee approval of a SCREENED peer group. Freezes the benchmark and pushes it through every DRAFT program that references the group."
    roles: [CompCommitteeChair]
    code: 200
    input: []
    output: PeerGroup
    side_effects:
      - "sets status to APPROVED and approved_by_user_id to the acting X-User-ID"
      - "recomputes target_total_direct_comp for every referencing PayProgram in design_status DRAFT (L1)"
      - "recomputes pay_for_performance_alignment for those programs (L2)"
      - "marks every ProxyAdvisorScreen of those programs STALE (L3)"

  # ---------------------- PayProgram ----------------------
  - method: POST
    path: "/exec-comp/pay-programs"
    description: "Open a DRAFT pay program: the pay mix across salary, annual incentive and long-term equity, the peer group that benchmarks it, and the annual-meeting date that anchors the quiet period."
    roles: [CompConsultant]
    code: 201
    input: ["issuer_company_id", "peer_group_id", "ceo_executive_id", "fiscal_year", "salary_pct", "sti_pct", "lti_pct", "lti_performance_share_pct", "sti_max_multiple?", "tsr_percentile_rank?", "meeting_date"]
    output: PayProgram
    side_effects:
      - "sets design_status to DRAFT and vote_status to NOT_VOTED"
      - "defaults sti_max_multiple to 2.0"
      - "computes target_total_direct_comp (performance_based_pct, fixed_leg_usd, benchmark_ratio, lti_multiple, lti_target_usd, target_tdc_usd, benchmark_posture)"
      - "sets outreach_coverage_pct to 0.00, realized_pay_total_usd to 0.00, realizable_pay_total_usd to 0.00 and alignment_status to UNRATED"

  - method: GET
    path: "/exec-comp/pay-programs"
    description: "List pay programs, optionally filtered by issuer, peer group or CEO."
    roles: [CompConsultant, CompCommitteeChair, SecuritiesCounsel, InvestorRelationsLead]
    code: 200
    input: ["issuer_company_id?", "peer_group_id?", "ceo_executive_id?", "design_status?", "vote_status?", "limit?", "offset?"]
    output: PayProgram[]
    side_effects: []

  - method: GET
    path: "/exec-comp/pay-programs/{id}"
    description: "Read one pay program including its mix, benchmark posture, alignment verdict and vote outcome."
    roles: [CompConsultant, CompCommitteeChair, SecuritiesCounsel, InvestorRelationsLead]
    code: 200
    input: []
    output: PayProgram
    side_effects: []

  - method: POST
    path: "/exec-comp/pay-programs/{id}/mix-reallocation"
    description: "Move whole percentage points of the pay mix from one component to another while conserving the 100.00-point total. Optimistic concurrency: expected_pay_program_version must equal the program's current version."
    roles: [CompConsultant]
    code: 200
    input: ["from_component", "to_component", "points", "expected_pay_program_version"]
    output: PayProgram
    side_effects:
      - "applies pay_mix_reallocation (salary_pct, sti_pct, lti_pct)"
      - "recomputes target_total_direct_comp (performance_based_pct, benchmark_ratio, lti_multiple, lti_target_usd, target_tdc_usd, benchmark_posture)"
      - "increments PayProgram.version by 1"
      - "marks every SCREENED ProxyAdvisorScreen of the program STALE"

  - method: GET
    path: "/exec-comp/pay-programs/{id}/pay-for-performance"
    description: "Computed read: the realized-versus-realizable pay comparison and the pay-for-performance alignment verdict for one program."
    roles: [CompConsultant, CompCommitteeChair, SecuritiesCounsel, InvestorRelationsLead]
    code: 200
    input: []
    output: { realized_pay_total_usd: number, realizable_pay_total_usd: number, pay_percentile_rank: number, tsr_percentile_rank: number, degree_of_alignment: number, alignment_status: string, accepted_peer_count: integer }
    side_effects: []

  - method: POST
    path: "/exec-comp/pay-programs/{id}/approve"
    description: "Compensation-committee approval of the program design. Locks every metric's goal curve and freezes the target."
    roles: [CompCommitteeChair]
    code: 200
    input: []
    output: PayProgram
    side_effects:
      - "sets design_status to COMMITTEE_APPROVED and approved_by_user_id to the acting X-User-ID"
      - "transitions every DRAFT IncentiveMetric of the program to LOCKED, snapshotting locked_target_value = target_value"
      - "increments PayProgram.version by 1"

  # ---------------------- IncentiveMetric ----------------------
  - method: POST
    path: "/exec-comp/pay-programs/{id}/incentive-metrics"
    description: "Select a performance metric for a vehicle and set its threshold / target / maximum goal curve and payout percentages."
    roles: [CompConsultant]
    code: 201
    input: ["metric_code", "vehicle", "direction", "weight_pct", "threshold_value", "target_value", "maximum_value", "threshold_payout_pct?", "target_payout_pct?", "maximum_payout_pct?", "interpolation"]
    output: IncentiveMetric
    side_effects:
      - "sets status to DRAFT"
      - "defaults threshold_payout_pct to 50.00, target_payout_pct to 100.00, maximum_payout_pct to 200.00"

  - method: GET
    path: "/exec-comp/pay-programs/{id}/incentive-metrics"
    description: "List the performance metrics of a pay program across both vehicles."
    roles: [CompConsultant, CompCommitteeChair, SecuritiesCounsel]
    code: 200
    input: ["vehicle?", "limit?", "offset?"]
    output: IncentiveMetric[]
    side_effects: []

  - method: POST
    path: "/exec-comp/incentive-metrics/{id}/adjustments"
    description: "Apply a mid-cycle goal adjustment to a LOCKED metric within the 15.00% policy limit. Optimistic concurrency: expected_incentive_metric_version must equal the metric's current version."
    roles: [CompCommitteeChair]
    code: 200
    input: ["target_value?", "threshold_value?", "maximum_value?", "result_adjustment_reason", "expected_incentive_metric_version"]
    output: IncentiveMetric
    side_effects:
      - "computes goal_adjustment_magnitude (goal_adjustment_pct)"
      - "sets status to ADJUSTED and adjusted_by_user_id to the acting X-User-ID"
      - "increments IncentiveMetric.version by 1"
      - "raises the rigor_component of every subsequent proxy_concern_score and marks every SCREENED ProxyAdvisorScreen of the program STALE"

  - method: POST
    path: "/exec-comp/incentive-metrics/{id}/results"
    description: "Submit the fiscal-year achievement for a LOCKED or ADJUSTED metric, as reported and (optionally) with a non-GAAP adjustment that supersedes it."
    roles: [CompConsultant]
    code: 200
    input: ["as_reported_value", "non_gaap_adjusted_value?", "result_adjustment_reason?"]
    output: IncentiveMetric
    side_effects:
      - "sets achieved_value to non_gaap_adjusted_value when supplied, otherwise to as_reported_value"
      - "sets status to RESULT_SUBMITTED"

  - method: POST
    path: "/exec-comp/incentive-metrics/{id}/certify-result"
    description: "Committee certification of a submitted result. Segregation of duties: the chair who adjusted this metric's goal may not certify its result."
    roles: [CompCommitteeChair]
    code: 200
    input: []
    output: IncentiveMetric
    side_effects:
      - "L1: computes metric_payout_factor (payout_factor_pct, original_payout_factor_pct), sets status to CERTIFIED and certified_by_user_id to the acting X-User-ID"
      - "L2: once every metric of (pay_program_id, vehicle) is CERTIFIED, computes annual_incentive_payout for each PayoutAward of that (program, vehicle) — certified_factor_pct and earned_amount_usd"
      - "L3: recomputes realized_and_realizable_pay for those awards"
      - "L4: recomputes pay_for_performance_alignment on the program (realized_pay_total_usd, realizable_pay_total_usd, pay_percentile_rank, degree_of_alignment, alignment_status)"
      - "L5: marks every SCREENED ProxyAdvisorScreen of the program STALE because its alignment_component is now out of date"

  # ---------------------- PayoutAward ----------------------
  - method: POST
    path: "/exec-comp/pay-programs/{id}/payout-awards"
    description: "Grant an award to an executive under a program: an annual-incentive opportunity, a performance share unit grant, or a time-vesting RSU grant."
    roles: [CompConsultant]
    code: 201
    input: ["executive_id", "vehicle", "units_granted?", "grant_price_usd?"]
    output: PayoutAward
    side_effects:
      - "sets status to GRANTED"
      - "computes target_amount_usd for ANNUAL_INCENTIVE from the executive's base_salary_usd and sti_target_pct"
      - "computes annual_incentive_payout immediately when every IncentiveMetric of the award's (pay_program_id, vehicle) is already CERTIFIED or RESTATED, so an award granted after certification is not left factorless"
      - "computes realized_and_realizable_pay (realized_value_usd 0.00, realizable_value_usd marked to the issuer's current share_price_usd for equity vehicles)"
      - "recomputes pay_for_performance_alignment on the program"

  - method: GET
    path: "/exec-comp/payout-awards"
    description: "List awards, optionally filtered by program or executive. A NamedExecutiveOfficer sees only their own awards."
    roles: [CompConsultant, CompCommitteeChair, SecuritiesCounsel, NamedExecutiveOfficer]
    code: 200
    input: ["pay_program_id?", "executive_id?", "status?", "limit?", "offset?"]
    output: PayoutAward[]
    side_effects: []

  - method: GET
    path: "/exec-comp/payout-awards/{id}"
    description: "Read one award including both its realized and its realizable value."
    roles: [CompConsultant, CompCommitteeChair, SecuritiesCounsel, NamedExecutiveOfficer]
    code: 200
    input: []
    output: PayoutAward
    side_effects: []

  - method: POST
    path: "/exec-comp/payout-awards/{id}/settlement"
    description: "Settle a GRANTED award. disposition VEST requires every metric of the award's vehicle to be certified and freezes the delivery price; disposition FORFEIT zeroes both values."
    roles: [CompConsultant]
    code: 200
    input: ["disposition", "settlement_date", "vest_price_usd?"]
    output: PayoutAward
    side_effects:
      - "VEST: sets status to VESTED, freezes vest_price_usd and settlement_date, computes realized_and_realizable_pay"
      - "FORFEIT: sets status to FORFEITED, sets realized_value_usd and realizable_value_usd to 0.00, and excludes the award from both program totals"
      - "recomputes pay_for_performance_alignment on the program"

  # ---------------------- CdaDraft ----------------------
  - method: POST
    path: "/exec-comp/pay-programs/{id}/cda-drafts"
    description: "Open a disclosure section for the program — the Compensation Discussion & Analysis narrative or one of the required tabular disclosures."
    roles: [SecuritiesCounsel, CompConsultant]
    code: 201
    input: ["section_code", "word_count", "required_tables_included?"]
    output: CdaDraft
    side_effects:
      - "sets status to DRAFTING, revision_round to 0 and authored_by_user_id to the acting X-User-ID"
      - "defaults required_tables_included to false"

  - method: GET
    path: "/exec-comp/pay-programs/{id}/cda-drafts"
    description: "List the disclosure sections drafted for a program."
    roles: [SecuritiesCounsel, CompConsultant, CompCommitteeChair, InvestorRelationsLead]
    code: 200
    input: ["section_code?", "limit?", "offset?"]
    output: CdaDraft[]
    side_effects: []

  - method: POST
    path: "/exec-comp/cda-drafts/{id}/submit-review"
    description: "Send a DRAFTING section into review, optionally revising the word count and confirming the required tables are attached."
    roles: [SecuritiesCounsel, CompConsultant]
    code: 200
    input: ["word_count?", "required_tables_included?"]
    output: CdaDraft
    side_effects: ["sets status to IN_REVIEW"]

  - method: POST
    path: "/exec-comp/cda-drafts/{id}/request-revision"
    description: "Bounce a section back to the author for another drafting round — either from IN_REVIEW, or from FILED as an amended-proxy reopening (which clears filed_at and blocks vote certification until the section is re-filed)."
    roles: [SecuritiesCounsel, CompCommitteeChair]
    code: 200
    input: ["feedback_summary?"]
    output: CdaDraft
    side_effects:
      - "sets status to DRAFTING"
      - "increments revision_round by 1"

  - method: POST
    path: "/exec-comp/cda-drafts/{id}/legal-clear"
    description: "Legal clearance of a section under review. Segregation of duties: the counsel who authored the draft may not clear it. Cross-entity guard: the program must carry a current (SCREENED) ISS proxy-advisor screen."
    roles: [SecuritiesCounsel]
    code: 200
    input: []
    output: CdaDraft
    side_effects:
      - "sets status to LEGAL_CLEARED and cleared_by_user_id to the acting X-User-ID"

  - method: POST
    path: "/exec-comp/cda-drafts/{id}/file"
    description: "File a legally cleared section. Filing the CD_AND_A section discloses the whole program."
    roles: [SecuritiesCounsel]
    code: 200
    input: []
    output: CdaDraft
    side_effects:
      - "sets status to FILED and filed_at to the current logical time"
      - "when section_code == CD_AND_A, transitions the PayProgram design_status COMMITTEE_APPROVED -> DISCLOSED and increments PayProgram.version by 1"

  # ---------------------- ProxyAdvisorScreen ----------------------
  - method: POST
    path: "/exec-comp/pay-programs/{id}/proxy-advisor-screens"
    description: "Run a proxy-advisor policy screen against the program under one advisor's published methodology."
    roles: [InvestorRelationsLead, CompConsultant]
    code: 201
    input: ["advisor"]
    output: ProxyAdvisorScreen
    side_effects:
      - "computes proxy_concern_score (alignment_component, mix_component, rigor_component, outreach_component, concern_score, concern_level, recommendation)"
      - "sets status to SCREENED and screened_at to the current logical time"

  - method: GET
    path: "/exec-comp/pay-programs/{id}/proxy-advisor-screens"
    description: "List the proxy-advisor screens held against a program, with each advisor's component breakdown."
    roles: [InvestorRelationsLead, CompConsultant, CompCommitteeChair, SecuritiesCounsel]
    code: 200
    input: ["advisor?", "limit?", "offset?"]
    output: ProxyAdvisorScreen[]
    side_effects: []

  - method: POST
    path: "/exec-comp/proxy-advisor-screens/{id}/rerun"
    description: "Re-run a screen against the program's current numbers. This is how a STALE screen becomes current again."
    roles: [InvestorRelationsLead, CompConsultant]
    code: 200
    input: []
    output: ProxyAdvisorScreen
    side_effects:
      - "recomputes proxy_concern_score"
      - "sets status to SCREENED and screened_at to the current logical time"

  # ---------------------- OutreachEngagement ----------------------
  - method: POST
    path: "/exec-comp/pay-programs/{id}/outreach-engagements"
    description: "Request a shareholder engagement ahead of the say-on-pay vote. investor_key is the dedup key that prevents double-counting the same investor's ownership."
    roles: [InvestorRelationsLead]
    code: 201
    input: ["investor_name", "investor_key", "ownership_pct", "channel"]
    output: OutreachEngagement
    side_effects: ["sets engagement_status to REQUESTED"]

  - method: GET
    path: "/exec-comp/pay-programs/{id}/outreach-engagements"
    description: "List the shareholder engagements booked for a program."
    roles: [InvestorRelationsLead, CompConsultant, CompCommitteeChair, SecuritiesCounsel]
    code: 200
    input: ["engagement_status?", "limit?", "offset?"]
    output: OutreachEngagement[]
    side_effects: []

  - method: POST
    path: "/exec-comp/outreach-engagements/{id}/schedule"
    description: "Schedule a requested engagement into a half-open [window_start, window_end) slot. The slot may not intersect the closed pre-meeting quiet period, and may not overlap another slot booked with the same investor_key."
    roles: [InvestorRelationsLead]
    code: 200
    input: ["window_start", "window_end"]
    output: OutreachEngagement
    side_effects:
      - "evaluates outreach_window_conflict (quiet period first, then same-investor overlap)"
      - "sets engagement_status to SCHEDULED"

  - method: POST
    path: "/exec-comp/outreach-engagements/{id}/hold"
    description: "Record that a scheduled engagement was held and capture the investor's position on the pay program."
    roles: [InvestorRelationsLead]
    code: 200
    input: ["feedback_position", "feedback_summary?"]
    output: OutreachEngagement
    side_effects:
      - "sets engagement_status to HELD and held_at to the current logical time"
      - "recomputes outreach_coverage on the program (outreach_coverage_pct), deduplicated by investor_key"
      - "recomputes proxy_concern_score for every GLASS_LEWIS screen of the program"

  # ---------------------- Say-on-pay result ----------------------
  - method: POST
    path: "/exec-comp/pay-programs/{id}/vote-certification"
    description: "Certify the say-on-pay ballot for a disclosed program. Support is measured on votes cast for and against; abstentions are recorded for disclosure but excluded from the denominator."
    roles: [CompCommitteeChair]
    code: 200
    input: ["votes_for", "votes_against", "abstentions"]
    output: PayProgram
    side_effects:
      - "computes say_on_pay_support (support_pct, vote_status, enhanced_engagement_required)"
      - "PASSED with enhanced_engagement_required false also transitions design_status DISCLOSED -> CLOSED"
      - "FAILED sets alignment_status to MISALIGNED, marks every SCREENED ProxyAdvisorScreen of the program STALE, and reverts every FILED CdaDraft of the program other than CD_AND_A to DRAFTING for the responsiveness rewrite"
      - "increments PayProgram.version by 1"

  - method: POST
    path: "/exec-comp/pay-programs/{id}/remediation"
    description: "Record the program changes made in response to a failed say-on-pay vote. Requires that at least 30.00% of ownership has actually been engaged."
    roles: [CompCommitteeChair]
    code: 200
    input: ["feedback_summary"]
    output: PayProgram
    side_effects:
      - "sets vote_status to REMEDIATED and design_status to CLOSED"
      - "sets enhanced_engagement_required to false"
      - "increments PayProgram.version by 1"

  # ---------------------- RestatementEvent ----------------------
  - method: POST
    path: "/exec-comp/companies/{id}/restatement-events"
    description: "Declare an accounting restatement with the closed clawback lookback window it opens. Two non-closed events on one company may not have lookback windows within one day of each other."
    roles: [SecuritiesCounsel]
    code: 201
    input: ["restatement_date", "lookback_start", "lookback_end", "accounting_reason"]
    output: RestatementEvent
    side_effects:
      - "evaluates restatement_lookback_conflict"
      - "sets status to DECLARED, determination_count to 0, recoverable_total_usd to 0.00 and recovered_total_usd to 0.00"

  - method: POST
    path: "/exec-comp/restatement-events/{id}/analyze"
    description: "Recompute the incentive metrics of the restated period with corrected achievements and derive one clawback determination per over-paid award. restated_metric_results is an array of objects shaped { incentive_metric_id: string, restated_achieved_value: number }; any metric of the period not named keeps its current achieved_value."
    roles: [SecuritiesCounsel]
    code: 200
    input: ["restated_metric_results"]
    output: RestatementEvent
    side_effects:
      - "L1: applies each restated achievement to its IncentiveMetric, setting restated_payout_factor_pct and status RESTATED"
      - "L2: applies clawback_recoverable_amount and creates one ClawbackDetermination in status CALCULATED per in-scope award with a positive recoverable amount"
      - "L3: sets determination_count and recoverable_total_usd on the event and moves it to ANALYZED"

  - method: POST
    path: "/exec-comp/restatement-events/{id}/order-recovery"
    description: "Order recovery of every calculated determination, issuing the recovery notice to each affected executive."
    roles: [CompCommitteeChair]
    code: 200
    input: []
    output: RestatementEvent
    side_effects:
      - "transitions every CALCULATED ClawbackDetermination to NOTICED and stamps noticed_at"
      - "sets status to RECOVERY_ORDERED"

  # ---------------------- ClawbackDetermination ----------------------
  - method: GET
    path: "/exec-comp/clawback-determinations"
    description: "List clawback determinations, optionally filtered by restatement event or by award. A NamedExecutiveOfficer sees only determinations against their own awards."
    roles: [SecuritiesCounsel, CompCommitteeChair, CompConsultant, NamedExecutiveOfficer]
    code: 200
    input: ["restatement_event_id?", "payout_award_id?", "status?", "limit?", "offset?"]
    output: ClawbackDetermination[]
    side_effects: []

  - method: GET
    path: "/exec-comp/clawback-determinations/{id}"
    description: "Read one clawback determination including the restated factor and the recoverable amount."
    roles: [SecuritiesCounsel, CompCommitteeChair, CompConsultant, NamedExecutiveOfficer]
    code: 200
    input: []
    output: ClawbackDetermination
    side_effects: []

  - method: POST
    path: "/exec-comp/clawback-determinations/{id}/acknowledge"
    description: "The affected executive acknowledges a noticed determination. Ownership check: X-User-ID must equal the award's executive_id."
    roles: [NamedExecutiveOfficer]
    code: 200
    input: []
    output: ClawbackDetermination
    side_effects:
      - "sets acknowledged_at to the current logical time and acknowledged_by_user_id to the acting X-User-ID"

  - method: POST
    path: "/exec-comp/clawback-determinations/{id}/recover"
    description: "Execute recovery of an acknowledged determination. Segregation of duties: the user who acknowledged the determination may not execute its recovery."
    roles: [CompCommitteeChair]
    code: 200
    input: []
    output: ClawbackDetermination
    side_effects:
      - "L1: sets status to RECOVERED and recovered_at to the current logical time"
      - "L2: transitions the PayoutAward VESTED -> CLAWED_BACK and reduces its realized_value_usd by recoverable_amount_usd"
      - "L3: increases RestatementEvent.recovered_total_usd by recoverable_amount_usd"
      - "L4: recomputes pay_for_performance_alignment on the award's PayProgram"
      - "L5: marks every SCREENED ProxyAdvisorScreen of that program STALE"

  - method: POST
    path: "/exec-comp/clawback-determinations/{id}/reverse-recovery"
    description: "Compensating action: reverse an executed recovery (for example when the restatement itself is withdrawn), restoring every value the recovery moved and returning the determination to NOTICED."
    roles: [CompCommitteeChair]
    code: 200
    input: ["reversal_reason"]
    output: ClawbackDetermination
    side_effects:
      - "L1: sets status back to NOTICED and clears recovered_at"
      - "L2: transitions the PayoutAward CLAWED_BACK -> VESTED and restores its realized_value_usd by recoverable_amount_usd"
      - "L3: decreases RestatementEvent.recovered_total_usd by recoverable_amount_usd"
      - "L4: recomputes pay_for_performance_alignment on the award's PayProgram"
      - "INVARIANT: PayoutAward.realized_value_usd + RestatementEvent.recovered_total_usd is identical before the recovery and after this reversal"

  # ---------------------- Test-driving surface ----------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical current time. The logical clock starts at the fixed default 2026-08-01T00:00:00Z on a cold server and never falls back to wall-clock time, so every window, quiet period and lookback rule is deterministic."
    roles: [CompConsultant, CompCommitteeChair, SecuritiesCounsel, InvestorRelationsLead]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: string }
    side_effects: ["all subsequent current-logical-time reads return to_iso8601"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- authentication / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header absent, or X-User-Role is not one of the five declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a NamedExecutiveOfficer reads or acts on an award or determination that does not belong to them"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID already performed the conflicting prior step (authored the draft it is clearing, adjusted the metric whose result it is certifying, or acknowledged the determination whose recovery it is executing)"

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "required body field missing, enum value outside its declared set, non-parseable instant, non-positive points, from_component equal to to_component, window_end at or before window_start, lookback_end at or before lookback_start, or votes_for + votes_against equal to zero"

  # --- existence ---
  - id: ERR_COMPANY_NOT_FOUND
    http: 404
    condition: "no Company with the supplied id"
  - id: ERR_PEER_GROUP_NOT_FOUND
    http: 404
    condition: "no PeerGroup with the supplied id"
  - id: ERR_PEER_GROUP_MEMBER_NOT_FOUND
    http: 404
    condition: "no PeerGroupMember with the supplied id"
  - id: ERR_EXECUTIVE_NOT_FOUND
    http: 404
    condition: "no Executive with the supplied id"
  - id: ERR_PAY_PROGRAM_NOT_FOUND
    http: 404
    condition: "no PayProgram with the supplied id"
  - id: ERR_INCENTIVE_METRIC_NOT_FOUND
    http: 404
    condition: "no IncentiveMetric with the supplied id"
  - id: ERR_PAYOUT_AWARD_NOT_FOUND
    http: 404
    condition: "no PayoutAward with the supplied id"
  - id: ERR_CDA_DRAFT_NOT_FOUND
    http: 404
    condition: "no CdaDraft with the supplied id"
  - id: ERR_SCREEN_NOT_FOUND
    http: 404
    condition: "no ProxyAdvisorScreen with the supplied id"
  - id: ERR_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "no OutreachEngagement with the supplied id"
  - id: ERR_RESTATEMENT_EVENT_NOT_FOUND
    http: 404
    condition: "no RestatementEvent with the supplied id"
  - id: ERR_DETERMINATION_NOT_FOUND
    http: 404
    condition: "no ClawbackDetermination with the supplied id"

  # --- optimistic concurrency (§1.2.1) ---
  - id: ERR_STALE_PEER_GROUP_VERSION
    http: 412
    condition: "expected_peer_group_version does not equal the PeerGroup's current version on member add"
  - id: ERR_STALE_PAY_PROGRAM_VERSION
    http: 412
    condition: "expected_pay_program_version does not equal the PayProgram's current version on mix reallocation"
  - id: ERR_STALE_INCENTIVE_METRIC_VERSION
    http: 412
    condition: "expected_incentive_metric_version does not equal the IncentiveMetric's current version on goal adjustment"

  # --- state preconditions ---
  - id: ERR_PEER_GROUP_NOT_MUTABLE
    http: 409
    condition: "the owning PeerGroup is APPROVED (or SCREENED for a member add or a re-screen), so its composition can no longer change"
  - id: ERR_PEER_GROUP_NOT_SCREENED
    http: 409
    condition: "approval attempted on a PeerGroup that is not in SCREENED"
  - id: ERR_PROGRAM_NOT_MUTABLE
    http: 409
    condition: "mix reallocation, metric definition or committee approval attempted on a PayProgram whose design_status is not DRAFT"
  - id: ERR_METRIC_STATE_INVALID
    http: 409
    condition: "the IncentiveMetric is not in the state the operation requires (LOCKED to adjust, LOCKED or ADJUSTED to submit a result, RESULT_SUBMITTED to certify)"
  - id: ERR_AWARD_NOT_GRANTED
    http: 409
    condition: "settlement attempted on a PayoutAward that is not GRANTED"
  - id: ERR_CDA_STATE_INVALID
    http: 409
    condition: "the CdaDraft is not in the state the operation requires (DRAFTING to submit, IN_REVIEW or FILED to revise, IN_REVIEW to clear, LEGAL_CLEARED to file)"
  - id: ERR_ENGAGEMENT_STATE_INVALID
    http: 409
    condition: "the OutreachEngagement is not REQUESTED when scheduled or not SCHEDULED when held"
  - id: ERR_PROGRAM_NOT_DISCLOSED
    http: 409
    condition: "vote certification attempted on a PayProgram whose design_status is not DISCLOSED"
  - id: ERR_VOTE_ALREADY_CERTIFIED
    http: 409
    condition: "vote certification attempted on a PayProgram whose vote_status is no longer NOT_VOTED, or a FILED CD&A section reopened after the vote was certified"
  - id: ERR_VOTE_NOT_FAILED
    http: 409
    condition: "a remediation package recorded against a PayProgram whose vote_status is not FAILED"
  - id: ERR_EVENT_STATE_INVALID
    http: 409
    condition: "the RestatementEvent is not DECLARED when analysed or not ANALYZED when recovery is ordered"
  - id: ERR_DETERMINATION_STATE_INVALID
    http: 409
    condition: "the ClawbackDetermination is not NOTICED when acknowledged or recovered, or not RECOVERED when a recovery is reversed"

  # --- safety / compliance ---
  - id: ERR_QUIET_PERIOD_ENGAGEMENT
    http: 409
    condition: "the engagement window intersects the closed pre-meeting quiet period [meeting_date - 10 days, meeting_date]"
  - id: ERR_DETERMINATION_NOT_ACKNOWLEDGED
    http: 422
    condition: "recovery executed against a determination the affected executive has not acknowledged"

  # --- referential / cross-entity gates ---
  - id: ERR_PEER_COMPANY_DELISTED
    http: 422
    condition: "the candidate peer Company has listing_status DELISTED"
  - id: ERR_PEER_IS_ISSUER
    http: 422
    condition: "the candidate peer Company is the peer group's own issuer"
  - id: ERR_PEER_GROUP_NOT_APPROVED
    http: 409
    condition: "committee approval of a PayProgram whose PeerGroup is not APPROVED"
  - id: ERR_ISS_SCREEN_NOT_CURRENT
    http: 409
    condition: "legal clearance attempted while the program has no ISS ProxyAdvisorScreen in status SCREENED"
  - id: ERR_METRIC_NOT_CERTIFIED
    http: 409
    condition: "an award is vested while at least one IncentiveMetric of its vehicle is not CERTIFIED or RESTATED"
  - id: ERR_CDA_NOT_FILED
    http: 409
    condition: "vote certification attempted while the program's CD_AND_A CdaDraft is not FILED"

  # --- uniqueness ---
  - id: ERR_ISSUER_ALREADY_EXISTS
    http: 409
    condition: "a Company with this ticker already exists, or a second issuer is registered for it"
  - id: ERR_PEER_ALREADY_IN_GROUP
    http: 409
    condition: "the candidate peer already has a PeerGroupMember row in this group, ACCEPTED or EXCLUDED"
  - id: ERR_METRIC_ALREADY_DEFINED
    http: 409
    condition: "(pay_program_id, metric_code, vehicle) already exists"
  - id: ERR_CDA_SECTION_ALREADY_EXISTS
    http: 409
    condition: "(pay_program_id, section_code) already exists"
  - id: ERR_SCREEN_ALREADY_EXISTS
    http: 409
    condition: "(pay_program_id, advisor) already exists — rerun the screen instead"

  # --- temporal ---
  - id: ERR_ENGAGEMENT_WINDOW_IN_PAST
    http: 422
    condition: "window_start is strictly before the current logical time"
  - id: ERR_OUTREACH_WINDOW_OVERLAP
    http: 409
    condition: "the half-open [window_start, window_end) slot overlaps another SCHEDULED or HELD slot of the same program and investor_key"
  - id: ERR_LOOKBACK_PERIOD_COLLISION
    http: 409
    condition: "the closed lookback window comes within one day of another non-CLOSED RestatementEvent's lookback window for the same company"
  - id: ERR_MEETING_DATE_NOT_FUTURE
    http: 422
    condition: "meeting_date is at or before the current logical time at program creation"

  # --- constraint satisfaction ---
  - id: ERR_PAY_MIX_MUST_TOTAL_100
    http: 422
    condition: "salary_pct + sti_pct + lti_pct does not equal exactly 100.00"
  - id: ERR_MIX_COMPONENT_OUT_OF_BOUNDS
    http: 422
    condition: "a resulting mix component falls outside the closed range [5.00, 80.00]"
  - id: ERR_GOAL_CURVE_NOT_MONOTONIC
    http: 422
    condition: "threshold / target / maximum are not strictly ordered in the metric's direction"
  - id: ERR_METRIC_WEIGHTS_NOT_100
    http: 422
    condition: "the weight_pct values of a vehicle's metrics do not sum to exactly 100.00 at committee approval"
  - id: ERR_PEER_OUTSIDE_SIZE_BAND
    http: 422
    condition: "the candidate peer fails the revenue or market-capitalisation band and its inclusion_reason is SIZE_MATCH or INDUSTRY_MATCH"
  - id: ERR_PEER_GROUP_EMPTY
    http: 422
    condition: "screening attempted on a PeerGroup with zero ACCEPTED members"
  - id: ERR_CDA_TABLES_INCOMPLETE
    http: 422
    condition: "legal clearance attempted while required_tables_included is false, or while a CD_AND_A section has word_count below 1500"

  # --- fiscal ---
  - id: ERR_ADJUSTMENT_EXCEEDS_POLICY_LIMIT
    http: 422
    condition: "the goal adjustment moves target_value more than 15.00% away from locked_target_value"
  - id: ERR_TDC_EXCEEDS_BENCHMARK_CAP
    http: 422
    condition: "target_tdc_usd exceeds 1.50 x the peer group's benchmark_target_tdc_usd at committee approval"
  - id: ERR_OUTREACH_COVERAGE_INSUFFICIENT
    http: 422
    condition: "a remediation package is recorded while outreach_coverage_pct is below 30.00"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix — segregation of duties
# ---------------------------------------------------------------------------
roles:
  - name: CompConsultant
    description: "Independent compensation consultant to the committee. Builds the peer group, drafts the pay mix, defines metrics, submits fiscal-year results and administers awards. Cannot approve anything."
    identity: "opaque"
    exclusive_operations:
      - "POST /exec-comp/companies"
      - "POST /exec-comp/companies/{id}/market-data"
      - "POST /exec-comp/companies/{id}/executives"
      - "POST /exec-comp/peer-groups"
      - "POST /exec-comp/peer-groups/{id}/members"
      - "POST /exec-comp/peer-group-members/{id}/exclude"
      - "POST /exec-comp/peer-groups/{id}/screen"
      - "POST /exec-comp/pay-programs"
      - "POST /exec-comp/pay-programs/{id}/mix-reallocation"
      - "POST /exec-comp/pay-programs/{id}/incentive-metrics"
      - "POST /exec-comp/incentive-metrics/{id}/results"
      - "POST /exec-comp/pay-programs/{id}/payout-awards"
      - "POST /exec-comp/payout-awards/{id}/settlement"
    shared_operations:
      - "POST /exec-comp/pay-programs/{id}/cda-drafts (with SecuritiesCounsel)"
      - "POST /exec-comp/cda-drafts/{id}/submit-review (with SecuritiesCounsel)"
      - "POST /exec-comp/pay-programs/{id}/proxy-advisor-screens (with InvestorRelationsLead)"
      - "POST /exec-comp/proxy-advisor-screens/{id}/rerun (with InvestorRelationsLead)"
      - "POST /_clock/set_current_utc"
      - "all read endpoints except the executive-scoped views"

  - name: CompCommitteeChair
    description: "Chair of the compensation committee. The only role that approves peer groups and program designs, adjusts goals, certifies results and vote outcomes, orders and executes clawback recovery."
    identity: "opaque"
    exclusive_operations:
      - "POST /exec-comp/peer-groups/{id}/approve"
      - "POST /exec-comp/pay-programs/{id}/approve"
      - "POST /exec-comp/incentive-metrics/{id}/adjustments"
      - "POST /exec-comp/incentive-metrics/{id}/certify-result"
      - "POST /exec-comp/pay-programs/{id}/vote-certification"
      - "POST /exec-comp/pay-programs/{id}/remediation"
      - "POST /exec-comp/restatement-events/{id}/order-recovery"
      - "POST /exec-comp/clawback-determinations/{id}/recover"
      - "POST /exec-comp/clawback-determinations/{id}/reverse-recovery"
    shared_operations:
      - "POST /exec-comp/cda-drafts/{id}/request-revision (with SecuritiesCounsel)"
      - "POST /_clock/set_current_utc"
      - "all read endpoints except the executive-scoped views"

  - name: SecuritiesCounsel
    description: "In-house securities counsel. Owns the disclosure workflow — drafting, legal clearance and filing of the CD&A and its required tables — and declares and analyses accounting restatements."
    identity: "opaque"
    exclusive_operations:
      - "POST /exec-comp/cda-drafts/{id}/legal-clear"
      - "POST /exec-comp/cda-drafts/{id}/file"
      - "POST /exec-comp/companies/{id}/restatement-events"
      - "POST /exec-comp/restatement-events/{id}/analyze"
    shared_operations:
      - "POST /exec-comp/pay-programs/{id}/cda-drafts (with CompConsultant)"
      - "POST /exec-comp/cda-drafts/{id}/submit-review (with CompConsultant)"
      - "POST /exec-comp/cda-drafts/{id}/request-revision (with CompCommitteeChair)"
      - "POST /_clock/set_current_utc"
      - "all read endpoints except the executive-scoped views"
    segregation_of_duties:
      - "the X-User-ID recorded as CdaDraft.authored_by_user_id may not legal-clear that draft (ERR_SEGREGATION_OF_DUTIES)"

  - name: InvestorRelationsLead
    description: "Investor-relations lead. Runs proxy-advisor policy screening and the shareholder outreach programme ahead of the say-on-pay vote."
    identity: "opaque"
    exclusive_operations:
      - "POST /exec-comp/pay-programs/{id}/outreach-engagements"
      - "POST /exec-comp/outreach-engagements/{id}/schedule"
      - "POST /exec-comp/outreach-engagements/{id}/hold"
    shared_operations:
      - "POST /exec-comp/pay-programs/{id}/proxy-advisor-screens (with CompConsultant)"
      - "POST /exec-comp/proxy-advisor-screens/{id}/rerun (with CompConsultant)"
      - "POST /_clock/set_current_utc"
      - "GET /exec-comp/companies/{id}, GET /exec-comp/pay-programs, GET /exec-comp/pay-programs/{id}, GET /exec-comp/pay-programs/{id}/pay-for-performance, GET /exec-comp/pay-programs/{id}/cda-drafts, GET /exec-comp/pay-programs/{id}/proxy-advisor-screens, GET /exec-comp/pay-programs/{id}/outreach-engagements"

  - name: NamedExecutiveOfficer
    description: "A named executive officer acting for themselves. May inspect only their own awards and clawback determinations, and acknowledge a recovery notice served on them. X-User-ID is the id of the Executive row."
    identity: "entity_backed:Executive"
    exclusive_operations:
      - "POST /exec-comp/clawback-determinations/{id}/acknowledge"
    shared_operations:
      - "GET /exec-comp/payout-awards and GET /exec-comp/payout-awards/{id}, restricted to rows whose executive_id equals X-User-ID"
      - "GET /exec-comp/clawback-determinations and GET /exec-comp/clawback-determinations/{id}, restricted to determinations whose award's executive_id equals X-User-ID"
    segregation_of_duties:
      - "the X-User-ID recorded as ClawbackDetermination.acknowledged_by_user_id may not execute that determination's recovery; recovery is a CompCommitteeChair operation and the chair identifier must differ from the acknowledging identifier (ERR_SEGREGATION_OF_DUTIES)"

sod_rules:
  - rule_id: sod-cda-author-not-clearer
    step_a: "POST /exec-comp/pay-programs/{id}/cda-drafts (records authored_by_user_id)"
    step_b: "POST /exec-comp/cda-drafts/{id}/legal-clear (records cleared_by_user_id)"
    constraint: "cleared_by_user_id != authored_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
  - rule_id: sod-goal-adjuster-not-certifier
    step_a: "POST /exec-comp/incentive-metrics/{id}/adjustments (records adjusted_by_user_id)"
    step_b: "POST /exec-comp/incentive-metrics/{id}/certify-result (records certified_by_user_id)"
    constraint: "certified_by_user_id != adjusted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
  - rule_id: sod-acknowledger-not-recoverer
    step_a: "POST /exec-comp/clawback-determinations/{id}/acknowledge (records acknowledged_by_user_id)"
    step_b: "POST /exec-comp/clawback-determinations/{id}/recover"
    constraint: "the acting X-User-ID on recover != acknowledged_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
