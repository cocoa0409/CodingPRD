            - "Vehicle VB is IN_FLEETING with REGISTRATION and LICENSING already COMPLETED (in that order, because a PREPARATION task cannot be created before both are resolved) and a PENDING PREPARATION task on 2026-01-09, a different calendar date from VA's so neither the bay buffer nor the ATL prep_capacity_per_day of 2 interferes."
