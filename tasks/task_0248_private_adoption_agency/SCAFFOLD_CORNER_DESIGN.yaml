        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_INSUFFICIENT_ESCROW]"]
        distinguishing_aspect: "A REFUND of 900000 against a case whose escrow_balance_cents is only 500000 -> ERR_INSUFFICIENT_ESCROW (409); balance unchanged."
        test_recipe:
          setup: ["Case with a single DEPOSIT of 500000 (balance 500000)."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-1", child_state: "CA", family_state: "CA" }
              as: Supervisor
              captures: { case_id: $.data.id, cv0: $.data.version }
            - call: "POST /escrow-transactions"
              payload: { case_id: "${case_id}", txn_type: "DEPOSIT", amount_cents: 500000, expected_case_version: "${cv0}" }
              as: FinanceOfficer
            - call: "GET /cases/${case_id}"
