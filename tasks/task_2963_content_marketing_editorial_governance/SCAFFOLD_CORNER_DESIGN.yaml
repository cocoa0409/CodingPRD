              payload: { audit_type: "ACCURACY", accuracy_finding: "INACCURATE" }
              as: ManagingEditor
              captures: { acc_verdict: $.data.last_audit_verdict, acc_status: $.data.accuracy_status, state_after_accuracy: $.data.workflow_state, refresh_flag: $.data.refresh_required }
            - call: "POST /editorial/content-items/${item_id}/refresh"
              payload: {}
              as: ManagingEditor
              captures: { state_after_refresh: $.data.workflow_state, published_after_refresh: $.data.published_at }
          assert:
            - "${dist_state_at_publish} == PUBLISHED"
            - "${commit} == 16"
            - "the first refresh returns HTTP 409 and ${e_refresh} == ERR_REFRESH_NOT_REQUIRED"
            - "the first prune returns HTTP 409 and ${e_prune_1} == ERR_PRUNE_NOT_ELIGIBLE"
            - "the DECAY audit returns HTTP 200, ${decay_value} == 0.00, ${decay_verdict} == KEEP, ${state_after_decay} == PUBLISHED and ${audit_at} == 2026-08-03T08:00:00.000Z"
            - "the second prune returns HTTP 409 and ${e_prune_2} == ERR_PRUNE_NOT_ELIGIBLE"
            - "the ACCURACY audit returns HTTP 200, ${acc_status} == INACCURATE, ${acc_verdict} == REFRESH, ${refresh_flag} == true and ${state_after_accuracy} == NEEDS_REFRESH"
            - "the second refresh returns HTTP 200, ${state_after_refresh} == DRAFT and ${published_after_refresh} == null"
            - "GET /editorial/content-items/${item_id}/review-gates?state=VOIDED returns exactly 3 rows"
            - "GET /editorial/content-items/${item_id}/distributions?state=RETRACTED returns exactly 1 row"
            - "CalendarSlot.${slot_id}.committed_points == 16 and utilization_pct == 40.00"
            - "Campaign.${cmp_id}.committed_points_total == 16"

      - name: asset_renewal_must_strictly_extend_past_both_the_clock_and_the_current_license_end
        claim_type: Conditional action
        grounds:
          - endpoints[POST /editorial/assets/{id}/renew]
          - validations[priority=34]
          - errors[ERR_ASSET_RENEWAL_NOT_EXTENDING]
          - calculations.asset_license_status
          - errors[ERR_ASSET_STATE_INVALID]
        distinguishing_aspect: "Both comparisons at priority 34 are strict: renewing to the instant the asset already expires is refused, and so is any date at or before the clock, and both legs report ERR_ASSET_RENEWAL_NOT_EXTENDING rather than ERR_INVALID_REQUEST. A one-millisecond extension is accepted and stamps status LICENSED even though the 30-day threshold would read EXPIRING — renewal sets the state, the sweep re-derives it — which makes an immediate second renewal an undeclared transition refused at priority 15 before the extension rule is ever consulted."
        test_recipe:
          setup:
            - "Clock parked at 2026-08-03T00:00:00.000Z; one STOCK asset licensed from 2026-07-01 to 2026-09-02T00:00:00.000Z, exactly 30 days out, so it reads EXPIRING with no usages attached."
          setup_api_calls:
            - call: "POST /editorial/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00.000Z" }
              as: ManagingEditor
            - call: "POST /editorial/assets"
              payload: { name: "Zero trust hero photo", asset_type: "STOCK", license_start: "2026-07-01T00:00:00.000Z", license_end: "2026-09-02T00:00:00.000Z", licensed_channels: ["OWNED"], max_licensed_uses: 3 }
              as: ManagingEditor
              captures: { asset_id: $.data.id, v1: $.data.version, status_1: $.data.status }
          trigger:
            - call: "POST /editorial/assets/${asset_id}/renew"
              payload: { new_license_end: "2026-09-02T00:00:00.000Z" }
              as: ManagingEditor
              captures: { e_equal: $.data.error_id }
            - call: "POST /editorial/assets/${asset_id}/renew"
              payload: { new_license_end: "2026-08-01T00:00:00.000Z" }
              as: ManagingEditor
              captures: { e_backwards: $.data.error_id }
            - call: "POST /editorial/assets/${asset_id}/renew"
              payload: { new_license_end: "2026-09-02T00:00:00.001Z" }
              as: ManagingEditor
              captures: { end_2: $.data.license_end, status_2: $.data.status, v2: $.data.version }
            - call: "POST /editorial/assets/${asset_id}/renew"
              payload: { new_license_end: "2027-01-01T00:00:00.000Z" }
              as: ManagingEditor
              captures: { e_relicensed: $.data.error_id }
          assert:
            - "${status_1} == EXPIRING and ${v1} == 1"
            - "the first renew returns HTTP 422 and ${e_equal} == ERR_ASSET_RENEWAL_NOT_EXTENDING"
            - "the second renew returns HTTP 422 and ${e_backwards} == ERR_ASSET_RENEWAL_NOT_EXTENDING"
            - "after the two refusals Asset.${asset_id}.license_end == 2026-09-02T00:00:00.000Z and version == 1"
            - "the third renew returns HTTP 200, ${end_2} == 2026-09-02T00:00:00.001Z, ${status_2} == LICENSED and ${v2} == 2"
            - "the fourth renew returns HTTP 409 and ${e_relicensed} == ERR_ASSET_STATE_INVALID because renewal is declared only from EXPIRING and EXPIRED"
            - "after the fourth call Asset.${asset_id}.license_end is still 2026-09-02T00:00:00.001Z and version is still 2"
            - "Asset.${asset_id}.active_use_count == 0 and remaining_licensed_uses == 3"
            - "GET /editorial/assets/${asset_id}/usages returns exactly 0 rows"

      - name: governance_sweep_activates_only_due_distributions_and_replays_as_a_no_op
        claim_type: Bulk action
        grounds:
          - endpoints[POST /editorial/_ops/governance-sweep]
          - state_machines.Distribution.transitions[SCHEDULED->LIVE]
        distinguishing_aspect: "The sweep is the one batch endpoint, and on this system only step 5 has work to do: the counter envelope must report distributions_activated 1 with all eight sibling counters 0, and a second sweep at the unchanged clock must report every counter 0 while leaving went_live_at at its first value — a server that re-stamps activated rows or recounts them fails the replay."
        test_recipe:
          setup:
            - "The T-chain to a PUBLISHED item at clock 2026-08-03T08:00:00.000Z, published by me-2 on the OWNED channel with scheduled_at 2026-08-05T09:00:00.000Z, so its single Distribution starts SCHEDULED."
            - "No assets, no claims, no snapshots exist, and all three review gates were approved before the clock moved, so steps 1, 2, 3, 4, 6 and 7 have nothing to act on."
            - "The clock is then advanced to exactly 2026-08-05T09:00:00.000Z, making the scheduled_at due under the <= comparison."
          setup_api_calls:
            - call: "POST /editorial/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00.000Z" }
              as: ManagingEditor
            - call: "POST /editorial/campaigns"
              payload: { code: "CMP-SWEEPNOOP", persona: "IT_BUYER", primary_funnel_stage: "DECISION", quarter_code: "2026Q3" }
