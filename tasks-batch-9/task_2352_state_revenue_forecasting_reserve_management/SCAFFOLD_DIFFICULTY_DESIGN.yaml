            - "Clock moved to 2026-08-05T00:00:00Z — past fund.last_transaction_at (2026-08-01) + 48 hours, so the briefing can be published."
            - "A PUBLISHED briefing whose snapshot is ADEQUATE / 9057."
            - "One SUPERMAJORITY_VOTE request for 30000000, APPROVED by 8 YES of 11 ballots, authorized_amount_cents 15000000."
            - "Requester tr-req-1 and executor tr-exec-9 are different users, so the segregation-of-duties rule at priority 39 does not fire."
