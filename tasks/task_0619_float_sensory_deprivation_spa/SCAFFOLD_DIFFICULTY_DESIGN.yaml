# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_0619_float_sensory_deprivation_spa — EXPERT
# Nine §0.5 rules, >=2 instances each (18 total).
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# All numeric asserts are literals computed against the §1.3 formulas/constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # ---- A: Booking domain — provisional vs final session charge diverge for couples
      - name: dvc_booking_provisional_vs_final_couples
        grounds:
          - calculations.provisional_session_charge
          - calculations.final_session_charge
          - entities.Booking.fields.provisional_charge_cents
          - entities.Booking.fields.final_charge_cents
          - state_machines.Booking.CHECKED_IN_to_COMPLETED
        distinguishing_aspect: |
          On the Booking entity, the couples surcharge (COUPLES_SURCHARGE_CENTS=1500)
          enters only the FINAL settle, so final_charge_cents (13500) != provisional_charge_cents (12000)
          for the identical couples 60-min booking — two algorithms, one input set, divergent results.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; Admin DUO plan (retail_float_cents=6000, member_discount_pct=0)"
            - "An oriented ACTIVE member; a DUAL tank IN_SERVICE/CLEAN; a gift card with ample balance"
            - "A couples 60-min GIFT_CARD booking driven RESERVED->CONFIRMED->CHECKED_IN->COMPLETED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Admin
            - call: "POST /plans"
              payload: { tier: "DUO", monthly_fee_cents: 9000, included_floats_per_cycle: 8, rollover_cap: 6, retail_float_cents: 6000, member_discount_pct: 0.0 }
              as: Admin
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { email: "duo@x.com", full_name: "Duo Prime" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /attendants"
              payload: { full_name: "Ana" }
              as: Admin
              captures: { att_id: $.data.id }
            - call: "POST /orientations"
              payload: { member_id: "${mem_id}", attendant_id: "${att_id}", start_utc: "2026-03-01T01:00:00Z", end_utc: "2026-03-01T01:30:00Z", waiver_version: 1 }
              as: FrontDesk
              captures: { ori_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T01:05:00Z" }
              as: Admin
            - call: "POST /orientations/${ori_id}/complete"
              payload: {}
              as: FrontDesk
            - call: "POST /tanks"
              payload: { name: "Pod-Dual-1", capacity_kind: "DUAL", turnover_buffer_minutes: 30 }
              as: Admin
              captures: { tank_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { code: "GC-DVC-1", initial_balance_cents: 100000 }
              as: FrontDesk
              captures: { gc_id: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${mem_id}", tank_id: "${tank_id}", session_minutes: 60, start_utc: "2026-03-02T10:00:00Z", pay_source: "GIFT_CARD", is_couples: true, gift_card_id: "${gc_id}" }
              as: FrontDesk
              captures: { bk_id: $.data.id, prov: $.data.provisional_charge_cents }
            - call: "POST /bookings/${bk_id}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T09:55:00Z" }
              as: Admin
            - call: "POST /bookings/${bk_id}/check-in"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /bookings/${bk_id}/complete"
              payload: {}
              as: FrontDesk
              captures: { fin: $.data.final_charge_cents, prov2: $.data.provisional_charge_cents }
          assert:
            - "Booking.${bk_id}.provisional_charge_cents == 12000"
            - "Booking.${bk_id}.final_charge_cents == 13500"
            - "Booking.${bk_id}.final_charge_cents != Booking.${bk_id}.provisional_charge_cents"

      # ---- B: Membership domain — refund valuation: prorated vs consumed-basis diverge
      - name: dvc_membership_refund_prorated_vs_consumed
        grounds:
          - calculations.refund_valuation
          - entities.Membership.fields.monthly_fee_cents_snapshot
          - state_machines.Membership.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          On the Membership entity, the AUTHORITATIVE prorated_value (days-remaining proration = 4500)
          diverges from the alternate consumed_basis (fee - floats_taken*retail = 0) for identical
          inputs (15 days remaining, 2 floats consumed) — a different entity domain than the Booking
          dual-variant above.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; DUO plan monthly_fee 9000, retail_float 6000, CYCLE 30d"
            - "Membership ACTIVE at cycle_start 2026-03-01, cycle_end 2026-03-31"
            - "Member consumed 2 credits via one completed couples CREDIT booking this cycle"
            - "Clock advanced to 2026-03-16 (15 days remaining) then membership cancelled"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Admin
            - call: "POST /plans"
              payload: { tier: "DUO", monthly_fee_cents: 9000, included_floats_per_cycle: 8, rollover_cap: 6, retail_float_cents: 6000, member_discount_pct: 0.0 }
              as: Admin
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { email: "refund@x.com", full_name: "Ray Fund" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /attendants"
              payload: { full_name: "Bo" }
              as: Admin
              captures: { att_id: $.data.id }
            - call: "POST /orientations"
              payload: { member_id: "${mem_id}", attendant_id: "${att_id}", start_utc: "2026-03-01T01:00:00Z", end_utc: "2026-03-01T01:30:00Z" }
              as: FrontDesk
              captures: { ori_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T01:05:00Z" }
              as: Admin
            - call: "POST /orientations/${ori_id}/complete"
              payload: {}
              as: FrontDesk
            - call: "POST /memberships"
              payload: { member_id: "${mem_id}", plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { ship_id: $.data.id }
            - call: "POST /memberships/${ship_id}/activate"
              payload: {}
              as: FrontDesk
            - call: "POST /tanks"
              payload: { name: "Pod-Dual-R", capacity_kind: "DUAL", turnover_buffer_minutes: 30 }
              as: Admin
              captures: { tank_id: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${mem_id}", tank_id: "${tank_id}", session_minutes: 60, start_utc: "2026-03-02T10:00:00Z", pay_source: "CREDIT", is_couples: true, membership_id: "${ship_id}" }
              as: FrontDesk
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T09:55:00Z" }
              as: Admin
            - call: "POST /bookings/${bk_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /bookings/${bk_id}/complete"
              payload: {}
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-16T00:00:00Z" }
              as: Admin
          trigger:
            - call: "POST /memberships/${ship_id}/cancel"
              payload: {}
              as: FrontDesk
          assert:
            - "A Payment with kind=SESSION_REFUND and booking_id=null exists for this membership's member with amount_cents == -4500"
            - "Membership.${ship_id}.credit_balance == 0"
            - "Membership.${ship_id}.status == CANCELLED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # ---- mode (a): nested branches/min-max, >=3 inputs — final_session_charge
      - name: comb_a_final_charge_nested_branches
        grounds:
          - calculations.final_session_charge
          - entities.Booking.fields.final_charge_cents
          - state_machines.Booking.CHECKED_IN_to_COMPLETED
        distinguishing_aspect: |
          MODE (a): final_charge depends non-linearly on >=3 inputs (session_minutes tier via
          NINETY_MIN_MULTIPLIER, is_couples doubling + surcharge, member_discount_pct), with the
          member discount applied AFTER couples doubling+surcharge — a 90-min single member booking
          settles to 5600.
        test_recipe:
          setup:
            - "SOLO plan retail_float 5000, member_discount_pct 0.20; oriented active member with ACTIVE membership holding credits"
            - "SINGLE tank; a 90-min CREDIT booking taken to COMPLETED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Admin
            - call: "POST /plans"
              payload: { tier: "SOLO", monthly_fee_cents: 8000, included_floats_per_cycle: 4, rollover_cap: 4, retail_float_cents: 5000, member_discount_pct: 0.20 }
              as: Admin
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { email: "solo90@x.com", full_name: "Sol Niner" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /attendants"
              payload: { full_name: "Cy" }
              as: Admin
              captures: { att_id: $.data.id }
            - call: "POST /orientations"
              payload: { member_id: "${mem_id}", attendant_id: "${att_id}", start_utc: "2026-04-01T01:00:00Z", end_utc: "2026-04-01T01:30:00Z" }
              as: FrontDesk
              captures: { ori_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T01:05:00Z" }
              as: Admin
            - call: "POST /orientations/${ori_id}/complete"
              payload: {}
              as: FrontDesk
            - call: "POST /memberships"
              payload: { member_id: "${mem_id}", plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { ship_id: $.data.id }
            - call: "POST /memberships/${ship_id}/activate"
              payload: {}
              as: FrontDesk
            - call: "POST /tanks"
              payload: { name: "Pod-Single-A", capacity_kind: "SINGLE", turnover_buffer_minutes: 30 }
              as: Admin
              captures: { tank_id: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${mem_id}", tank_id: "${tank_id}", session_minutes: 90, start_utc: "2026-04-02T10:00:00Z", pay_source: "CREDIT", membership_id: "${ship_id}" }
              as: FrontDesk
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T09:55:00Z" }
              as: Admin
            - call: "POST /bookings/${bk_id}/check-in"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /bookings/${bk_id}/complete"
              payload: {}
              as: FrontDesk
              captures: { fin: $.data.final_charge_cents }
          assert:
            - "Booking.${bk_id}.final_charge_cents == 5600"
            - "Booking.${bk_id}.credits_consumed == 1"

      # ---- mode (b): rounding/aggregation order pinned — rollover_credit
      - name: comb_b_rollover_order_pinned
        grounds:
          - calculations.rollover_credit
          - state_machines.Membership.ACTIVE_to_ACTIVE
          - entities.CreditLedgerEntry.fields.reason
          - entities.Membership.fields.credit_balance
        distinguishing_aspect: |
          MODE (b): renewal pins the ORDER overflow-EXPIRE-then-GRANT. With pre_balance 10,
          rollover_cap 6, included 8: EXPIRE -4 (balance->6) THEN GRANT +8 (balance->14). Doing
          GRANT-then-cap would yield 6 (wrong). Post balance is deterministically 14.
        test_recipe:
          setup:
            - "Plan included_floats_per_cycle=10, rollover_cap=6; member with a PENDING membership"
            - "Activate grants 10 -> credit_balance==10 (pre-renew state)"
            - "Renew: overflow=max(0,10-6)=4 -> EXPIRE -4 (balance 6) THEN GRANT +10 (balance 16)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Admin
            - call: "POST /plans"
              payload: { tier: "ROLL", monthly_fee_cents: 7000, included_floats_per_cycle: 10, rollover_cap: 6, retail_float_cents: 5000, member_discount_pct: 0.0 }
              as: Admin
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { email: "roll@x.com", full_name: "Rolly" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${mem_id}", plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { ship_id: $.data.id }
            - call: "POST /memberships/${ship_id}/activate"
              payload: {}
              as: FrontDesk
              captures: { mv: $.data.version, bal0: $.data.credit_balance }
          trigger:
            - call: "POST /memberships/${ship_id}/renew"
              payload: { expected_membership_version: "${mv}" }
              as: FrontDesk
              captures: { bal1: $.data.credit_balance }
          assert:
            - "Membership.${ship_id}.credit_balance == 16"
            - "A CreditLedgerEntry with reason=EXPIRE and delta=-4 exists for this membership"
            - "A CreditLedgerEntry with reason=GRANT and delta=10 exists for this membership (renewal grant)"

      # ---- mode (c): circular-looking dependency, evaluation order pinned — deposit_and_fee
      - name: comb_c_deposit_then_fee_order
        grounds:
          - calculations.deposit_and_fee
          - entities.Booking.fields.deposit_cents
          - state_machines.Booking.CONFIRMED_to_NO_SHOW
        distinguishing_aspect: |
          MODE (c): the no-show fee is keyed on deposit_cents which is keyed on is_couples — the
          scaffold pins deposit FIRST (couples doubling -> 4000) THEN fee = deposit (4000). The
          NO_SHOW_FEE payment equals the doubled deposit, not the flat 2000.
        test_recipe:
          setup:
            - "Oriented active member; DUAL tank; couples CASH booking CONFIRMED; clock past start+grace"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /plans"
              payload: { tier: "DUO", monthly_fee_cents: 9000, included_floats_per_cycle: 8, rollover_cap: 6, retail_float_cents: 6000 }
              as: Admin
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { email: "noshow@x.com", full_name: "Noa Show" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /attendants"
              payload: { full_name: "Di" }
              as: Admin
              captures: { att_id: $.data.id }
            - call: "POST /orientations"
              payload: { member_id: "${mem_id}", attendant_id: "${att_id}", start_utc: "2026-06-01T01:00:00Z", end_utc: "2026-06-01T01:30:00Z" }
              as: FrontDesk
              captures: { ori_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T01:05:00Z" }
              as: Admin
            - call: "POST /orientations/${ori_id}/complete"
              payload: {}
              as: FrontDesk
            - call: "POST /tanks"
              payload: { name: "Pod-Dual-C", capacity_kind: "DUAL", turnover_buffer_minutes: 30 }
              as: Admin
              captures: { tank_id: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${mem_id}", tank_id: "${tank_id}", session_minutes: 60, start_utc: "2026-06-03T10:00:00Z", pay_source: "CASH", is_couples: true }
              as: FrontDesk
              captures: { bk_id: $.data.id, dep: $.data.deposit_cents }
            - call: "POST /bookings/${bk_id}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T10:20:00Z" }
              as: Admin
          trigger:
            - call: "POST /bookings/${bk_id}/no-show"
              payload: {}
              as: FrontDesk
          assert:
            - "Booking.${bk_id}.deposit_cents == 4000"
            - "A Payment with kind=NO_SHOW_FEE and booking_id=${bk_id} has amount_cents == 4000"
            - "Booking.${bk_id}.status == NO_SHOW"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # ---- A: Booking cyclic CONFIRMED->RESCHEDULED->CONFIRMED
      - name: nlsm_booking_reschedule_cycle
        grounds:
          - state_machines.Booking.CONFIRMED_to_RESCHEDULED
          - state_machines.Booking.RESCHEDULED_to_CONFIRMED
          - entities.Booking.fields.status
        distinguishing_aspect: |
          Booking is cyclic: CONFIRMED -> RESCHEDULED -> CONFIRMED returns to a previously visited
          state with start_utc/end_utc moved, distinct from any linear pipeline.
        test_recipe:
          setup:
            - "Oriented active member; SINGLE tank; CASH 60-min booking CONFIRMED with start far in the future"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Admin
            - call: "POST /plans"
              payload: { tier: "SOLO", monthly_fee_cents: 8000, included_floats_per_cycle: 4, rollover_cap: 4, retail_float_cents: 5000 }
              as: Admin
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { email: "cyc@x.com", full_name: "Cy Clic" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /attendants"
              payload: { full_name: "Ev" }
              as: Admin
              captures: { att_id: $.data.id }
            - call: "POST /orientations"
              payload: { member_id: "${mem_id}", attendant_id: "${att_id}", start_utc: "2026-07-01T01:00:00Z", end_utc: "2026-07-01T01:30:00Z" }
              as: FrontDesk
              captures: { ori_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T01:05:00Z" }
              as: Admin
            - call: "POST /orientations/${ori_id}/complete"
              payload: {}
              as: FrontDesk
            - call: "POST /tanks"
              payload: { name: "Pod-Single-Cyc", capacity_kind: "SINGLE", turnover_buffer_minutes: 30 }
              as: Admin
              captures: { tank_id: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${mem_id}", tank_id: "${tank_id}", session_minutes: 60, start_utc: "2026-07-10T10:00:00Z", pay_source: "CASH" }
              as: FrontDesk
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/confirm"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /bookings/${bk_id}/reschedule"
              payload: { new_start_utc: "2026-07-11T14:00:00Z" }
              as: FrontDesk
            - call: "POST /bookings/${bk_id}/confirm"
              payload: {}
              as: FrontDesk
              captures: { st: $.data.status, start2: $.data.start_utc }
          assert:
            - "Booking.${bk_id}.status == CONFIRMED"
            - "Booking.${bk_id}.start_utc == 2026-07-11T14:00:00Z"
            - "Booking.${bk_id}.end_utc == 2026-07-11T15:00:00Z"

      # ---- B: Tank parallel dimensions (operational_status x sanitation_status)
      - name: nlsm_tank_parallel_dimensions
        grounds:
          - state_machines.Tank.IN_SERVICE_to_MAINTENANCE
          - state_machines.Tank.CLEAN_to_IN_CYCLE
          - entities.Tank.fields.operational_status
          - entities.Tank.fields.sanitation_status
        distinguishing_aspect: |
          Tank carries two independent status axes: putting it into MAINTENANCE
          (operational_status) leaves sanitation_status untouched at CLEAN, and a DEEP_CLEAN cycle
          flips sanitation_status to IN_CYCLE while operational_status stays MAINTENANCE — the two
          dimensions evolve independently on one row.
        test_recipe:
          setup:
            - "A SINGLE tank IN_SERVICE/CLEAN"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: Admin
            - call: "POST /tanks"
              payload: { name: "Pod-Par", capacity_kind: "SINGLE", turnover_buffer_minutes: 30 }
              as: Admin
              captures: { tank_id: $.data.id }
            - call: "POST /tanks/${tank_id}/maintenance"
              payload: {}
              as: Admin
              captures: { op1: $.data.operational_status, san1: $.data.sanitation_status }
          trigger:
            - call: "POST /sanitation-cycles"
              payload: { tank_id: "${tank_id}", kind: "DEEP_CLEAN", duration_minutes: 60 }
              as: FrontDesk
              captures: { cyc_id: $.data.id }
            - call: "GET /tanks/${tank_id}"
              payload: {}
              as: Admin
              captures: { op2: $.data.operational_status, san2: $.data.sanitation_status }
          assert:
            - "After maintenance: Tank.${tank_id}.operational_status == MAINTENANCE and Tank.${tank_id}.sanitation_status == CLEAN"
            - "After deep-clean start: Tank.${tank_id}.operational_status == MAINTENANCE and Tank.${tank_id}.sanitation_status == IN_CYCLE"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # ---- A: depth 3 — booking complete -> sanitation -> tank IN_CYCLE -> auto-cancel RESERVED
      - name: cascade_complete_sanitation_tank_autocancel
        grounds:
          - state_machines.Booking.CHECKED_IN_to_COMPLETED
          - state_machines.Tank.CLEAN_to_IN_CYCLE
          - entities.SanitationCycle.fields.status
          - entities.Booking.fields.status
        distinguishing_aspect: |
          Depth-3 chain from booking completion: (L1) complete creates a TURNOVER SanitationCycle;
          (L2) that cycle insert flips Tank CLEAN->IN_CYCLE; (L3) the tank entering IN_CYCLE
          auto-cancels a separate RESERVED booking on that tank whose start_utc < cycle.ends_utc and
          refunds its deposit. Each link is caused by the previous, not by the complete call directly.
        test_recipe:
          setup:
            - "Oriented active member; SINGLE tank buffer 30m"
            - "Booking#1 CASH 60m start 10:00 (occupies [10:00,11:30)); driven to CHECKED_IN"
            - "Booking#2 CASH 60m start 11:30 RESERVED (non-overlapping at creation)"
            - "Clock advanced to 11:45 so completing #1 starts a cycle ending 12:15 > #2.start 11:30"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Admin
            - call: "POST /plans"
              payload: { tier: "SOLO", monthly_fee_cents: 8000, included_floats_per_cycle: 4, rollover_cap: 4, retail_float_cents: 5000 }
