              captures: { err_empty: $.data.error_id }
          assert:
            - "the response status is 409 and the error_id is ERR_EMPTY_NET_POSITION_SET"
            - "GET /clearing/net-positions?window_id=${win_emp} returns zero rows, because the suspension cancelled EA's own row and left EB's contra at match_status ALLEGED"
            - "GET /clearing/settlement-windows/${win_emp} still reports status == NETTED"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: trade_lockin_requires_open_window_state
        grounds:
          - state_machines.TradeSubmission.OPEN_to_LOCKED_IN
          - state_machines.SettlementWindow.OPEN_to_NETTED
          - entities.SettlementWindow.fields.status
          - errors[ERR_WINDOW_ALREADY_NETTED]
        distinguishing_aspect: "The entity pair is TradeSubmission depending on SettlementWindow: a trade's lock-in is legal only while its designated window is OPEN, so netting the window first makes the identical lock-in request fail on the pair — not on the trade's own state, which is still OPEN."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Participants XA (legal name 'Cross Alpha') and XB (legal name 'Cross Beta') ACTIVE."
            - "Security XPA1 with an OPEN window for 2026-09-10. XA submits a BUY against XB but does not lock it in."
            - "The window is then netted, moving it from OPEN to NETTED, so the trade's designated window is no longer OPEN."
          setup_api_calls:
