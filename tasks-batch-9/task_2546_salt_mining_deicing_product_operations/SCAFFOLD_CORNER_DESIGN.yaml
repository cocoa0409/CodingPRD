      - name: yield_rounds_half_up_once_at_two_decimals
        claim_type: precision
        grounds:
          - calculations.treatment_yield_and_purity
          - entities.TreatmentBatch.fields.yield_tons
        distinguishing_aspect: |
          Two batches on one run land on rounding boundaries that a truncating or 3-decimal
          implementation gets wrong: 1003 * 0.94 * 0.975 = 919.2495 must round HALF-UP to 919.25
          (truncation gives 919.24), and 1000 * 0.94 * 0.9667 = 908.698 must give 908.70
          (truncation gives 908.69). Purity is unaffected and stays at 3 decimals.
        test_recipe:
          setup:
            - "Mine, PRODUCING panel P-1 (grade 96.00), one run hoisted with 2003 t and Syracuse Depot."
          setup_api_calls:
