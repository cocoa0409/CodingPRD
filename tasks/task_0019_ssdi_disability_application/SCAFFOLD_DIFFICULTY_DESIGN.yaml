          mutates Application.status=CESSATION → that mutation triggers
          BenefitAward.status=TERMINATED → that mutation triggers
          ChildAuxiliaryBenefit.status=TERMINATED_PARENT (one hop further, the
          child's termination is caused by the award's termination, not by
          the original CDR call). SSISupplement also terminates. Each link
          observable.
