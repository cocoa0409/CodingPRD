            - "Grant.${g_id}.changes_requested_count == 1 in both cases; revise never advances it"

      - name: role_check_precedes_existence_check_returns_403
        claim_type: priority_ordering
        grounds:
          - validations[priority=10]
          - validations[priority=20]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - errors[ERR_GRANT_NOT_FOUND]
        distinguishing_aspect: |
          A PlanAdministrator approving a grant id that does not exist gets
          ERR_ROLE_NOT_PERMITTED (403) from priority 10 rather than ERR_GRANT_NOT_FOUND (404)
          from priority 20, while a BoardMember hitting the same missing id gets the 404 -
          the ladder leaks no existence information to an unauthorized caller.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T09:00:00Z; a plan exists but no Grant row has the id 00000000-0000-0000-0000-0000000000ff."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /equity-plans"
              payload: { name: "Corner Plan November Two", total_authorized_shares: 1000000, common_shares_outstanding: 1000000, fiscal_year_start_date: "2026-01-01" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /grants/00000000-0000-0000-0000-0000000000ff/approve"
              payload: { approval_path: "BOARD" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { err_role: $.data.error_id }
            - call: "POST /grants/00000000-0000-0000-0000-0000000000ff/approve"
