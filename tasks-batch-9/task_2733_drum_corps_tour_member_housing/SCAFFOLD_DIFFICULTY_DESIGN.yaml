  - rule_id: priority_pair_validation_conflict
    instances:
      - name: closed_plan_state_error_outranks_oversized_payment_fiscal_error
        grounds:
          - validations.priority_15_ERR_PLAN_NOT_ACCEPTING_PAYMENTS
          - validations.priority_57_ERR_PAYMENT_EXCEEDS_BALANCE
          - state_machines.PaymentPlan.transitions.ACTIVE_to_CLOSED_WITH_BALANCE
        distinguishing_aspect: |
          A state-category rule at priority 15 versus a business_fiscal rule at
          priority 57 on the SAME endpoint: one payment violates both (the plan is
          CLOSED_WITH_BALANCE and the amount exceeds the outstanding balance) and must
          report ERR_PLAN_NOT_ACCEPTING_PAYMENTS. A control payment of the identical
          oversized amount against an ACTIVE plan proves rule 57 is really live, so
          the pair cannot be satisfied by simply never implementing 57.
        test_recipe:
          setup:
            - "A 2027 season with member A (399900 STANDARD_3, EXECUTED, plan first due 2027-01-15) and member B on an identical plan."
            - "The clock is moved to 2027-05-10 (the first legal withdrawal date, since a withdrawal may not precede spring_training_start_date) and member A is withdrawn, which closes A's plan as CLOSED_WITH_BALANCE while B's plan stays ACTIVE with financed_total_cents 399900 and nothing paid."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
