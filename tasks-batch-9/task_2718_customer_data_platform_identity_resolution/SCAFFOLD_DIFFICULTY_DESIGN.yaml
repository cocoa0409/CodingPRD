      - name: vendor_ack_verifies_request_tombstones_profile_dissolves_household
        grounds:
          - state_machines.VendorDeletionTask.DISPATCHED_to_ACKNOWLEDGED
          - state_machines.DeletionRequest.PROPAGATING_to_VERIFIED
          - state_machines.Profile.DELETION_PENDING_to_DELETED
          - state_machines.ConsentRecord.ACTIVE_to_TOMBSTONED
          - state_machines.Household.ACTIVE_to_DISSOLVED
          - state_machines.IdentityLink.PROPOSED_to_VOIDED
        distinguishing_aspect: |
          Depth 4, triggered by POST /cdp/vendor-deletion-tasks/{taskId}/acknowledge — a
          different triggering transition from the sibling instance's link REJECT. Hop 1 moves
          the task to ACKNOWLEDGED and recomputes the parent counters; hop 2 fires ONLY because
          acknowledged_vendor_task_count then equals total_vendor_task_count, moving the
          DeletionRequest to VERIFIED; hop 3 fires ONLY because the request reached VERIFIED,
          moving the Profile DELETION_PENDING -> DELETED and nulling its PII; hop 4 fires ONLY
          because the profile reached DELETED, TOMBSTONING its ConsentRecord, VOIDING its
          PROPOSED IdentityLink with void_reason PROFILE_DELETED and DISSOLVING its Household.
          resolution_status stays RESOLVED throughout, proving the cascade rides the privacy axis.
