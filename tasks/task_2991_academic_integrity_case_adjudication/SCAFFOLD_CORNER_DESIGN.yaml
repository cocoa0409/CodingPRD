            - "the final proposal returns HTTP 201 with Sanction.${sanction_ok_id}.status == PROPOSED, ladder_rank == 3, kind == GRADE_PENALTY_COURSE, origin == OFFICE_PROPOSAL, grade_component_code == null"
            - "GET /integrity/sanctions?case_id=${case_id} returns total_count 1 - five refusals wrote nothing - and Case.${case_id}.version == ${case_v_decided} + 1"

      - name: report_creation_requires_exactly_one_score_per_declared_grade_component
