            - { call: "GET /api/classes/${cl_id}", as: TrainingDirector, captures: { cl_v: $.data.version } }
            - { call: "POST /api/classes/${cl_id}/enrollments", payload: { match_id: "${m_id}", expected_class_version: "${cl_v}" }, as: TrainingDirector, captures: { enr_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
