      - name: student_cannot_touch_others_application
        claim_type: role_denied
        grounds:
          - roles[Student]
          - validations[priority=2]
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "Ownership enforcement for the entity_backed Student role: student B cannot read or withdraw student A's application (X-User-ID != application.student_id)."
        test_recipe:
          setup: ["FR program OPEN; student A holds a SUBMITTED application; student B exists"]
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
            - call: "POST /api/v1/partner-agreements/${agr_id}/activate"
              as: ProgramCoordinator
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Lyon Spring 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "PROGRAM_FEE", program_fee_cents: 1800000, min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /api/v1/programs/${prog_id}/publish"
              as: ProgramCoordinator
            - call: "POST /api/v1/students"
              payload: { full_name: "Owner A", email: "ownera@uni.edu", gpa: 3.00, conduct_standing: "GOOD_STANDING" }
              as: ProgramCoordinator
              captures: { stu_a: $.data.id }
            - call: "POST /api/v1/students"
              payload: { full_name: "Other B", email: "otherb@uni.edu", gpa: 3.10, conduct_standing: "GOOD_STANDING" }
              as: ProgramCoordinator
              captures: { stu_b: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { student_id: "${stu_a}", program_id: "${prog_id}" }
              as: Student
              as_user_id: "${stu_a}"
              captures: { app_a: $.data.id }
          trigger:
            - call: "GET /api/v1/applications/${app_a}"
              as: Student
              as_user_id: "${stu_b}"
              captures: { err1: $.data.error_id }
            - call: "POST /api/v1/applications/${app_a}/withdraw"
              as: Student
              as_user_id: "${stu_b}"
              captures: { err2: $.data.error_id }
          assert:
            - "read by non-owner student: error_id == ERR_FORBIDDEN (403)"
            - "withdraw by non-owner student: error_id == ERR_FORBIDDEN (403); application stays SUBMITTED"
      - name: missing_auth_headers_unauthenticated
        claim_type: role_denied
        grounds:
          - validations[priority=1]
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers fails ERR_UNAUTHENTICATED (401) before any role or business check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "00000000-0000-0000-0000-000000000000", name: "No Auth", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "PROGRAM_FEE", program_fee_cents: 1800000, min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED, http 401 (test harness sends this one request with both headers omitted)"

  # ===========================================================================
  # Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_rejected_and_fresh_accepted
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[cpa-create-stale-application]
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "OCC on Application.version: after CPA1 create bumps the version, a second create replaying the stale expected_application_version is rejected 412 ERR_STALE_VERSION; re-reading and resubmitting with the fresh version succeeds."
        test_recipe:
          setup: ["FR program OPEN; SUBMITTED application (version captured at creation)"]
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
            - call: "POST /api/v1/partner-agreements/${agr_id}/activate"
              as: ProgramCoordinator
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Lyon Spring 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "PROGRAM_FEE", program_fee_cents: 1800000, min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /api/v1/programs/${prog_id}/publish"
              as: ProgramCoordinator
            - call: "POST /api/v1/students"
              payload: { full_name: "Occ Student", email: "occ@uni.edu", gpa: 3.00, conduct_standing: "GOOD_STANDING" }
              as: ProgramCoordinator
              captures: { stu_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { student_id: "${stu_id}", program_id: "${prog_id}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { app_id: $.data.id, app_v1: $.data.version }
          trigger:
            - call: "POST /api/v1/applications/${app_id}/course-preapprovals"
              payload: { course_code: "HIST310", course_title: "Modern French History", host_credits: 3, expected_application_version: "${app_v1}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { cpa1: $.data.id }
            - call: "POST /api/v1/applications/${app_id}/course-preapprovals"
              payload: { course_code: "ART220", course_title: "Studio Art", host_credits: 5, expected_application_version: "${app_v1}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { err: $.data.error_id }
            - call: "GET /api/v1/applications/${app_id}"
              as: ProgramCoordinator
              captures: { app_v2: $.data.version }
            - call: "POST /api/v1/applications/${app_id}/course-preapprovals"
              payload: { course_code: "ART220", course_title: "Studio Art", host_credits: 5, expected_application_version: "${app_v2}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { cpa2: $.data.id }
          assert:
            - "CPA1 with expected_application_version == ${app_v1} succeeds (201)"
            - "CPA2 replaying the same stale version fails: error_id == ERR_STALE_VERSION, http 412"
            - "after re-reading, the version has advanced (${app_v2} == ${app_v1} + 1) and the retry with the fresh version succeeds (201, PENDING)"
      - name: cascading_side_effects_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Program.OPEN_to_SUSPENDED
        excluded_because:
          difficulty_instance: advisory_suspension_cascade
          rationale: "The full advisory -> program -> application -> billing/insurance chain with literal end-states is asserted there."
      - name: dual_variant_layer_coverage
        claim_type: dual_variant_calculation
        grounds:
          - calculations.billing_charge_calculation
          - calculations.transfer_credit_conversion
        excluded_because:
          difficulty_instance: credit_posting_provisional_vs_final
          rationale: "Variant divergence (6.5 provisional vs 2.5 final) and billing model divergence (940000 vs 1540000) are asserted in the two dual_variant_calc difficulty instances."
      - name: derived_field_reconciliation_seats
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.seats_taken_aggregation
        excluded_because:
          difficulty_instance: seat_count_commit_withdraw_invariant
          rationale: "seats_taken after commit (1) and after compensating withdraw (0) is asserted there; the RETURNED_HOME exclusion is asserted in the seats_taken_excludes_returned corner instance above."
