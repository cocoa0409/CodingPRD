            - "the refused call leaves FacilityAgreement.${agreement_id}.version at ${agreement_version_3} and occupied_bed_nights at 20"
            - "the 2027-05-20 stay returns 201 — check_out_date is exclusive, so a stay starting on another stay's check-out day does not overlap"
            - "HousingAssignment.${housing_a2_id}.nights == 5 and status == ACTIVE, and HousingAssignment.${housing_a1_id} is still ACTIVE"
            - "FacilityAgreement.${agreement_id}.occupied_bed_nights == 25 (10 + 10 + 5, counted once each) and billable_bed_nights == 25 and billable_cents == 11250"
            - "HostSchool.${school_id}.reserved_bed_nights == 25 and Season.${season_id}.housing_cost_cents == 11250"

      - name: touching_volunteer_shifts_allowed_while_overlapping_shift_is_rejected
        grounds:
          - validations.priority_43_ERR_VOLUNTEER_SHIFT_OVERLAP
          - validations.priority_42_ERR_SHIFT_OUTSIDE_STOP_WINDOW
          - entities.StaffAssignment.fields.shift_start_at
          - state_machines.StaffAssignment
        distinguishing_aspect: |
          The same half-open reasoning applied to a PERSON rather than a bed, and at
          instant rather than date granularity, across two different parent stops:
          one volunteer may hold a 08:00-13:00 shift at stop 1 and a 13:00-18:00
          shift at stop 2, but a 12:00-18:00 shift at stop 2 collides with the first.
          It also pins that the stop-window rule at priority 42 outranks the overlap
          rule at 43, so an 11:00 start (before stop 2's 12:00 arrival, and also
          overlapping) reports ERR_SHIFT_OUTSIDE_STOP_WINDOW.
        test_recipe:
          setup:
            - "A 2027 season with two unchained REHEARSAL_ONLY stops on 2027-06-20: stop 1 running 08:00 to 14:00 and stop 2 running 12:00 to 22:00."
            - "One DRIVER volunteer is screened CLEARED by scr-remy and holds a PROPOSED 08:00-13:00 DRIVE shift on stop 1."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /tour-stops"
              payload: { season_id: "${season_id}", stop_type: "REHEARSAL_ONLY", venue_name: "Rockford AM block", city: "Rockford", state_code: "IL", arrive_at: "2027-06-20T08:00:00Z", depart_at: "2027-06-20T14:00:00Z", travel_miles_from_previous: 0, uniform_trunks: 0, instrument_cases: 0, prop_units: 0, truck_count: 1, rehearsal_minutes: 120, heat_index_f: 82 }
              as: TourManager
              captures: { stop1_id: "$.data.id" }
            - call: "POST /tour-stops"
              payload: { season_id: "${season_id}", stop_type: "REHEARSAL_ONLY", venue_name: "Rockford PM block", city: "Rockford", state_code: "IL", arrive_at: "2027-06-20T12:00:00Z", depart_at: "2027-06-20T22:00:00Z", travel_miles_from_previous: 0, uniform_trunks: 0, instrument_cases: 0, prop_units: 0, truck_count: 1, rehearsal_minutes: 120, heat_index_f: 82 }
              as: TourManager
              captures: { stop2_id: "$.data.id" }
            - call: "POST /volunteers"
              payload: { full_name: "Sam Herrera", email: "sam@corps.test", role_type: "DRIVER", cdl_number: "IL-CDL-88213" }
              as: VolunteerScreener
              as_user_id: "scr-remy"
              captures: { driver_id: "$.data.id" }
            - call: "POST /volunteers/${driver_id}/screening-decision"
              payload: { decision: "CLEAR", decided_on: "2026-08-01" }
              as: VolunteerScreener
              as_user_id: "scr-remy"
            - call: "POST /staff-assignments"
              payload: { volunteer_id: "${driver_id}", tour_stop_id: "${stop1_id}", duty: "DRIVE", shift_start_at: "2027-06-20T08:00:00Z", shift_end_at: "2027-06-20T13:00:00Z" }
              as: TourManager
              captures: { shift1_id: "$.data.id" }
          trigger:
            - call: "POST /staff-assignments"
              payload: { volunteer_id: "${driver_id}", tour_stop_id: "${stop2_id}", duty: "DRIVE", shift_start_at: "2027-06-20T12:00:00Z", shift_end_at: "2027-06-20T18:00:00Z" }
              as: TourManager
            - call: "POST /staff-assignments"
              payload: { volunteer_id: "${driver_id}", tour_stop_id: "${stop2_id}", duty: "DRIVE", shift_start_at: "2027-06-20T11:00:00Z", shift_end_at: "2027-06-20T18:00:00Z" }
              as: TourManager
            - call: "POST /staff-assignments"
              payload: { volunteer_id: "${driver_id}", tour_stop_id: "${stop2_id}", duty: "DRIVE", shift_start_at: "2027-06-20T13:00:00Z", shift_end_at: "2027-06-20T18:00:00Z" }
              as: TourManager
              captures: { shift2_id: "$.data.id" }
          assert:
            - "the 12:00-18:00 shift returns 409 ERR_VOLUNTEER_SHIFT_OVERLAP: the existing PROPOSED shift is counted, so a shift does not have to be APPROVED to block another"
            - "the 11:00-18:00 shift returns 409 ERR_SHIFT_OUTSIDE_STOP_WINDOW, not ERR_VOLUNTEER_SHIFT_OVERLAP, because priority 42 precedes priority 43 even though both are violated"
            - "the 13:00-18:00 shift returns 201: StaffAssignment.${shift2_id}.status == PROPOSED with tour_stop_id == ${stop2_id}"
            - "StaffAssignment.${shift1_id}.status == PROPOSED and shift_end_at == 2027-06-20T13:00:00Z — touching instants are legal because the window is half-open"
            - "Volunteer.${driver_id}.assignment_count == 0 (only APPROVED shifts count, and neither shift has been approved)"
            - "exactly two StaffAssignments exist for volunteer ${driver_id} (the two rejected calls created nothing)"

  - rule_id: compensating_invariant
    instances:
      - name: payment_reversal_restores_plan_member_and_season_ledgers_and_delinquency
        grounds:
          - state_machines.TuitionPayment.transitions.POSTED_to_REVERSED
          - state_machines.PaymentPlan.transitions.ACTIVE_to_DELINQUENT_on_reversal
          - calculations.payment_waterfall_allocation
          - entities.Season.fields.tuition_collected_cents
          - entities.Member.fields.tuition_paid_cents
        distinguishing_aspect: |
          A four-level compensation: reversing one cure payment must unwind BOTH
          waterfall buckets (2500 of late fee and 136634 of principal), re-derive the
          Member and Season ledgers, and re-open the plan ACTIVE -> DELINQUENT, while
          deliberately NOT compensating delinquency_strikes or late_fee_accrued_cents
          (strikes never decrease and an accrued fee stays accrued). The end state is
          byte-identical to the pre-payment state except for those two monotone
          fields and the version counters.
        test_recipe:
          setup:
            - "A 2027 season with one member on an EXECUTED 399900-cent EXTENDED_6 contract and a plan whose first installment was due 2027-01-15."
            - "One zero-payment sweep at 2027-02-20 leaves the plan DELINQUENT with delinquency_strikes 1, late_fee_accrued_cents 2500, arrears 136634 and outstanding 412398."
            - "A single cure payment of 139134 is then posted on 2027-02-20."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Avery Nakamura", email: "avery@corps.test", date_of_birth: "2005-03-04", section: "BRASS", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { member_id: "$.data.id" }
            - call: "POST /members/${member_id}/audition-decision"
              payload: { decision: "OFFER", audition_score: 91.5 }
              as: MembershipCoordinator
            - call: "POST /member-contracts"
              payload: { member_id: "${member_id}", tuition_amount_cents: 399900, payment_plan_type: "EXTENDED_6" }
              as: MembershipCoordinator
              captures: { contract_id: "$.data.id" }
            - call: "POST /member-contracts/${contract_id}/sign"
              payload: { signature_name: "Avery Nakamura" }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /member-contracts/${contract_id}/execute"
              payload: {}
              as: CorpsDirector
            - call: "GET /members/${member_id}"
              as: BusinessManager
              captures: { member_version: "$.data.version" }
            - call: "POST /payment-plans"
              payload: { member_id: "${member_id}", member_contract_id: "${contract_id}", first_due_date: "2027-01-15", expected_member_version: "${member_version}" }
              as: BusinessManager
              captures: { plan_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-20T00:00:00Z" }
              as: BusinessManager
            - call: "POST /seasons/${season_id}/run-billing-cycle"
              payload: {}
              as: BusinessManager
            - call: "POST /tuition-payments"
              payload: { payment_plan_id: "${plan_id}", amount_cents: 139134, received_on: "2027-02-20", method: "ACH" }
              as: BusinessManager
              captures: { payment_id: "$.data.id" }
          trigger:
            - call: "POST /tuition-payments/${payment_id}/reverse"
              payload: { reversal_reason: "ACH returned for insufficient funds" }
              as: BusinessManager
          assert:
            - "before the trigger: TuitionPayment.${payment_id}.allocated_to_late_fee_cents == 2500 and allocated_to_principal_cents == 136634 (late fees fill first)"
            - "before the trigger: PaymentPlan.${plan_id}.status == ACTIVE (cured), arrears_cents == 0, principal_paid_cents == 136634, late_fee_paid_cents == 2500, outstanding_cents == 273264, delinquency_strikes == 1"
            - "before the trigger: Member.${member_id}.tuition_paid_cents == 136634 and tuition_balance_cents == 263266 (the 2500 late fee is excluded from the member's tuition ledger)"
            - "before the trigger: Season.${season_id}.tuition_collected_cents == 136634 and late_fee_collected_cents == 2500"
            - "after the reversal: TuitionPayment.${payment_id}.status == REVERSED with reversed_at == 2027-02-20T00:00:00Z and the allocation fields retained for audit"
            - "after the reversal: PaymentPlan.${plan_id}.principal_paid_cents == 0 and late_fee_paid_cents == 0 and arrears_cents == 136634 and outstanding_cents == 412398"
            - "after the reversal: PaymentPlan.${plan_id}.status == DELINQUENT again (the compensating transition) and delinquency_strikes is still 1 — strikes never decrease"
            - "after the reversal: PaymentPlan.${plan_id}.late_fee_accrued_cents is still 2500 — the accrued fee is not compensated, only the payment against it"
            - "after the reversal: Member.${member_id}.tuition_paid_cents == 0, tuition_balance_cents == 399900, refund_due_cents == 0"
            - "after the reversal: Season.${season_id}.tuition_collected_cents == 0 and late_fee_collected_cents == 0 — no drift is left anywhere in the three-level ledger"

      - name: housing_release_and_rebooking_restore_bed_night_ledgers_without_drift
