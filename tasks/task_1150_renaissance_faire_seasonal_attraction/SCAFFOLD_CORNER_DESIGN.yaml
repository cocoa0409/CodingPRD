            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-11T00:00:00Z" }, as: FaireOperator }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-12T00:00:00Z" }, as: FaireOperator }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-13T00:00:00Z" }, as: FaireOperator }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-14T00:00:00Z" }, as: FaireOperator }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-15T00:00:00Z" }, as: FaireOperator }
