              payload: { name: "Stk", campaign_type: "CATALOG", goal_cents: 100000, profit_split_pct: 0.50, vendor_name: "V", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: CampaignAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /fundraising/prize-tiers"
