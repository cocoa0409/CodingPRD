            - "F-ONE: F_MINI geometry with exactly one well; F-TWO: same geometry with two wells; both wells rated 600000."
            - "F-PRESS: total 1,000,000 / cushion 500,000 / base 2000 / span 1400 / max 3000, opening 350000 (inventory_pct 70.00 -> 2980 psig), one healthy well rated 600000."
