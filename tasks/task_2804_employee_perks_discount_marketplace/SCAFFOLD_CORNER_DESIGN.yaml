                row0_category: "$.data.category_rows[0].category"
                row0_count: "$.data.category_rows[0].redemption_count"
                row0_discount: "$.data.category_rows[0].discount_amount_cents"
                row0_redeemers: "$.data.category_rows[0].distinct_redeemer_count"
                row0_suppressed: "$.data.category_rows[0].suppressed"
                row1_category: "$.data.category_rows[1].category"
                row1_count: "$.data.category_rows[1].redemption_count"
                row1_discount: "$.data.category_rows[1].discount_amount_cents"
                row1_redeemers: "$.data.category_rows[1].distinct_redeemer_count"
                row1_suppressed: "$.data.category_rows[1].suppressed"
                suppressed_count: $.data.suppressed_category_count
                total_count: $.data.total_redemption_count
                total_discount: $.data.total_discount_amount_cents
                total_redeemers: $.data.total_distinct_redeemer_count
          assert:
            - "${d1_discount} == 1000 and ${w1_discount} == 800"
            - "${floor_echo} == 3"
            - "${row0_category} == DINING, ${row0_suppressed} == false, ${row0_count} == 3, ${row0_discount} == 3000 and ${row0_redeemers} == 3: rows are ordered by category name ascending"
            - "${row1_category} == WELLNESS and ${row1_suppressed} == true"
            - "${row1_count}, ${row1_discount} and ${row1_redeemers} are all null: 2 distinct redeemers is strictly below the floor of 3"
            - "${suppressed_count} == 1"
            - "${total_count} == 5, ${total_discount} == 4600 and ${total_redeemers} == 3: totals span the suppressed category so spend still reconciles"
            - "no membership id, external_employee_ref or redemption id appears anywhere in the response body"

      - name: placement_slot_links_an_offer_to_an_employer_and_prices_itself_from_both
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /perks/offers/{id}/placement-slots]
          - endpoints[GET /perks/placement-slots]
          - calculations.placement_fee_pricing
          - entities.PlacementSlot.fields.employer_id
          - errors[ERR_EMPLOYER_NOT_FOUND]
        distinguishing_aspect: |
          The slot is addressed under the offer but carries the employer as a payload reference, so
          an unknown employer_id yields ERR_EMPLOYER_NOT_FOUND while the valid call prices itself
          from the agreement's 36000-cent daily base, the 2-day window and the employer's
          eligible_headcount of 2, landing on 72000 with both reference ids echoed and queryable
          from either side.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; merchant Bistro Uno ACTIVE with an ACTIVE DINING/CA agreement whose placement_fee_base_cents is 36000."
            - "Employer Northwind Co is LIVE with exactly two ELIGIBLE in-window memberships, so eligible_headcount is 2 (reach tier 1, 0 bps)."
            - "One ACTIVE offer whose version was captured from the approving review response."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", primary_category: "DINING", region_codes: ["CA"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { merchant_id: $.data.id }
            - call: "POST /perks/agreements"
