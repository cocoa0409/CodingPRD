              captures: { fund_id: $.data.id }
            - call: "POST /advocacy/candidates"
              payload: { name: "Dana Whitfield", office: "US_HOUSE", jurisdiction_code: "FEDERAL", district_code: "CA-30", election_cycle: "2026-GENERAL", incumbency: "OPEN_SEAT", voting_alignment_pct: 60.00, committee_relevance_score: 50 }
              as: GovAffairsDirector
              as_user_id: "gad-1"
              captures: { cand_id: $.data.id }
          trigger:
            - call: "POST /advocacy/pac-contributions"
              payload: { fund_id: "${fund_id}", candidate_id: "${cand_id}", amount_cents: 125000 }
              as: GovAffairsDirector
              as_user_id: "gad-1"
              captures: { contrib_id: $.data.id }
          assert:
            - "support_score == round_half_up(0.45*60.00 + 0.25*50 + 0.20*80 + 0.10*0, 2) == round_half_up(27.00 + 12.50 + 16.00 + 0.00, 2) == 55.50"
            - "55.50 >= SCORE_TIER_QUARTER 55.00 but < SCORE_TIER_HALF 70.00, so tier_share == 0.25"
            - "max_allowed_cents == round_half_up(500000 * 0.25) == 125000 and amount_cents 125000 is accepted at the inclusive boundary"
            - "HTTP 201 with status PENDING_BOARD; Candidate.${cand_id}.latest_support_score == 55.50 and pending_support_cents == 125000"
            - "Constant sensitivity: with incumbency INCUMBENT the same inputs give 0.20*100 == 20.00 and a score of 59.50; with CHALLENGER they give 0.20*60 == 12.00 and a score of 51.50, which is below the 55.00 floor and is refused with ERR_SCORE_BELOW_FLOOR"
      - name: expenditure_report_two_bases_diverge_on_identical_activities
        claim_type: Variant Divergence
        grounds:
