            - "GET /stores/${store_id}/fund-ledger with fund == DIVIDEND returns total_count == 1 and data[0].entry_type == ALLOWANCE_CREDIT with amount_cents == 300"
            - "Store.${store_id}.period_close_index == 1"
            - "Sale.${sale_id}.settled_allowance_cents == 300 and allowance_variance_cents == 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: sale_tender_blocked_by_revoked_delegation_state
        grounds:
          - validations[priority=23]
          - errors[ERR_DELEGATION_NOT_ACTIVE]
          - state_machines.ShopperDelegation.ACTIVE_to_REVOKED
          - state_machines.Sale.OPEN_to_TENDERED
        distinguishing_aspect: |
          Entity pair Sale <- ShopperDelegation. Nothing about the Sale itself is
          wrong: it is OPEN, it has priced lines, its patron's card is VALID and
          the delegation window still covers business_date. Tender must still be
          refused purely because the referenced delegation left ACTIVE, and the
          sale must stay OPEN with no ledger entries written.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store, surcharge_rate_bp 500."
            - "One ACTIVE_DUTY sponsor patron and one DEPENDENT delegate patron sponsored by them."
            - "One ACTIVE delegation of the sponsor to the delegate over [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z) with per_sale_spend_cap_cents 50000."
            - "One ACTIVE WAREHOUSE assortment for a 600-cent product."
            - "One OPEN sale at business_date 2026-08-11T00:00:00Z citing acting_delegation_id, carrying one line of quantity 2 (merchandise 1200, surcharge 60)."
            - "The delegation is then REVOKED, which also flags the open sale."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Drum Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-GRO-L02", name: "Long Grain Rice 10lb", category: "GROCERY_STAPLE", unit_cost_cents: 600 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "L2", facings: 4, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "SSG M Okafor", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { sponsor_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "N Okafor", id_card_class: "DEPENDENT", sponsor_patron_id: "${sponsor_id}" }
              as: ComplianceOfficer
              captures: { delegate_id: $.data.id, delegate_v0: $.data.version }
            - call: "POST /shopper-delegations"
              payload: { sponsor_patron_id: "${sponsor_id}", delegate_patron_id: "${delegate_id}", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-09-01T00:00:00Z", per_sale_spend_cap_cents: 50000, expected_delegate_patron_version: "${delegate_v0}" }
              as: ComplianceOfficer
              captures: { delegation_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: SystemOperator
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${sponsor_id}", acting_delegation_id: "${delegation_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 2 }
              as: StoreCashier
            - call: "POST /shopper-delegations/${delegation_id}/revoke"
              payload: { reason: "PRIVILEGE_WITHDRAWN" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /sales/${sale_id}/tender"
              payload: {}
              as: StoreCashier
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409 and data.error_id == ERR_DELEGATION_NOT_ACTIVE"
            - "ShopperDelegation.${delegation_id}.status == REVOKED"
            - "Sale.${sale_id}.tender_state == OPEN and settled_allowance_cents == null"
            - "Sale.${sale_id}.compliance_state == FLAGGED and merchandise_cents == 1200 and surcharge_total_cents == 60"
            - "GET /stores/${store_id}/fund-ledger returns total_count == 0"
            - "Store.${store_id}.surcharge_fund_balance_cents == 0"

      - name: capital_project_approval_parks_awaiting_funds_when_store_posture_frozen
        grounds:
          - state_machines.CapitalProject.SUBMITTED_to_AWAITING_FUNDS
          - calculations.store_fund_posture
          - entities.Store.fields.fund_posture
          - entities.CapitalProject.fields.obligation_cents
        distinguishing_aspect: |
          A different entity pair, CapitalProject <- Store, and an approval that
          is neither accepted nor refused: the board's APPROVE decision is
          well-formed and authorised, yet the destination state is decided by the
          Store's fund_posture. With an empty fund (posture FROZEN) the project
          must land in AWAITING_FUNDS with surcharge_obligated_cents still 0,
          rather than APPROVED.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store whose surcharge fund has never received a collection, so surcharge_fund_balance_cents == 0 and fund_posture == FROZEN."
            - "One CapitalProject with requested_amount_cents 300000, contingency_bp 1000, contingency_cents 30000 and obligation_cents 330000."
            - "The project has been submitted by user sfc-030 and is in state SUBMITTED."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Bliss Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id }
            - call: "POST /capital-projects"
              payload: { store_id: "${store_id}", title: "Checkout lane refit", requested_amount_cents: 300000 }
              as: SurchargeFundController
              as_user_id: "sfc-030"
              captures: { project_id: $.data.id }
            - call: "POST /capital-projects/${project_id}/submit"
              payload: {}
              as: SurchargeFundController
              as_user_id: "sfc-030"
          trigger:
            - call: "POST /capital-projects/${project_id}/decision"
              payload: { decision: "APPROVE", note: "Board concurs, funding subject to availability" }
              as: MwrBoardOfficer
              as_user_id: "mwr-030"
          assert:
            - "HTTP status == 200"
            - "CapitalProject.${project_id}.state == AWAITING_FUNDS"
            - "CapitalProject.${project_id}.contingency_bp == 1000, contingency_cents == 30000, obligation_cents == 330000"
            - "CapitalProject.${project_id}.decided_by_user_id == mwr-030 and submitted_by_user_id == sfc-030"
            - "Store.${store_id}.surcharge_obligated_cents == 0 and surcharge_fund_balance_cents == 0"
            - "Store.${store_id}.fund_posture == FROZEN"
            - "GET /stores/${store_id}/fund-ledger returns total_count == 0"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: same_pair_delegation_windows_half_open_adjacent_allowed_overlap_rejected
        grounds:
          - validations[priority=37]
          - errors[ERR_DELEGATION_WINDOW_OVERLAP]
          - concurrency_rules[delegation-create-stale-delegate]
          - entities.ShopperDelegation.fields.valid_to
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [valid_from, valid_to). The contested
          resource is the (sponsor, delegate) pair. [08-01, 08-10) followed by
          [08-10, 08-20) share the instant 2026-08-10T00:00:00Z as one interval's
          exclusive end and the other's inclusive start, so they are adjacent and
          both must be ACTIVE; a third window [08-05, 08-15) genuinely straddles
          both and must be rejected.
        test_recipe:
          setup:
            - "One ACTIVE_DUTY sponsor patron and one DEPENDENT delegate patron sponsored by them."
            - "Two ACTIVE delegations of that same pair over the adjacent half-open windows [2026-08-01T00:00:00Z, 2026-08-10T00:00:00Z) and [2026-08-10T00:00:00Z, 2026-08-20T00:00:00Z)."
            - "The delegate patron's version is re-read before each create, because every delegation create bumps it."
          setup_api_calls:
            - call: "POST /patrons"
              payload: { full_name: "CPO R Halvorsen", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { sponsor_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "T Halvorsen", id_card_class: "DEPENDENT", sponsor_patron_id: "${sponsor_id}" }
              as: ComplianceOfficer
              captures: { delegate_id: $.data.id, delegate_v0: $.data.version }
            - call: "POST /shopper-delegations"
              payload: { sponsor_patron_id: "${sponsor_id}", delegate_patron_id: "${delegate_id}", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-08-10T00:00:00Z", per_sale_spend_cap_cents: 40000, expected_delegate_patron_version: "${delegate_v0}" }
              as: ComplianceOfficer
              captures: { delegation_1_id: $.data.id }
            - call: "GET /patrons/${delegate_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { delegate_v1: $.data.version }
            - call: "POST /shopper-delegations"
              payload: { sponsor_patron_id: "${sponsor_id}", delegate_patron_id: "${delegate_id}", valid_from: "2026-08-10T00:00:00Z", valid_to: "2026-08-20T00:00:00Z", per_sale_spend_cap_cents: 40000, expected_delegate_patron_version: "${delegate_v1}" }
              as: ComplianceOfficer
              captures: { delegation_2_id: $.data.id }
            - call: "GET /patrons/${delegate_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { delegate_v2: $.data.version }
          trigger:
            - call: "POST /shopper-delegations"
              payload: { sponsor_patron_id: "${sponsor_id}", delegate_patron_id: "${delegate_id}", valid_from: "2026-08-05T00:00:00Z", valid_to: "2026-08-15T00:00:00Z", per_sale_spend_cap_cents: 40000, expected_delegate_patron_version: "${delegate_v2}" }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "The second setup create returned HTTP 201 — adjacency at 2026-08-10T00:00:00Z is not an overlap"
            - "HTTP status == 409 and data.error_id == ERR_DELEGATION_WINDOW_OVERLAP"
            - "GET /shopper-delegations with delegate_patron_id == ${delegate_id} and status == ACTIVE returns total_count == 2"
            - "ShopperDelegation.${delegation_1_id}.status == ACTIVE and superseded_by_delegation_id == null"
            - "ShopperDelegation.${delegation_2_id}.status == ACTIVE and superseded_by_delegation_id == null"
            - "Patron.${delegate_id}.version == ${delegate_v2} — the rejected create bumped nothing"

      - name: closed_window_assortments_touching_at_endpoint_exceed_shelf_capacity
        grounds:
          - validations[priority=41]
          - errors[ERR_SHELF_CAPACITY_EXCEEDED]
          - entities.Assortment.fields.effective_to
          - entities.Store.fields.shelf_block_capacity_facings
        distinguishing_aspect: |
          The opposite interval semantics on a different resource entity: an
          Assortment's effective window is CLOSED [effective_from, effective_to],
          and the contested resource is a (store, shelf_block) facing pool rather
          than a patron pair. [08-01, 08-10] and [08-10, 08-20] both contain
          2026-08-10T00:00:00Z, so 16 + 16 == 32 facings coexist there against a
          capacity of 24 and the second create must fail — the exact arrangement
          that the half-open delegation case accepts.
        test_recipe:
          setup:
            - "One COMMISSARY / OVERSEAS store with shelf_block_capacity_facings 24."
            - "Two GROCERY_STAPLE products."
            - "One ACTIVE assortment of 16 facings on shelf_block M3 over the closed window 2026-08-01 through 2026-08-10."
            - "The store version has been re-read after that create."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Yokota Commissary", channel: "COMMISSARY", region: "OVERSEAS", surcharge_rate_bp: 500, shelf_block_capacity_facings: 24 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-GRO-M31", name: "Rolled Oats 3lb", category: "GROCERY_STAPLE", unit_cost_cents: 320 }
              as: AssortmentPlanner
              captures: { product_c_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-GRO-M32", name: "Peanut Butter 40oz", category: "GROCERY_STAPLE", unit_cost_cents: 410 }
              as: AssortmentPlanner
              captures: { product_d_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_c_id}", shelf_block: "M3", facings: 16, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-10T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
              captures: { assortment_c_id: $.data.id }
            - call: "GET /stores/${store_id}"
              payload: {}
              as: AssortmentPlanner
              captures: { store_v1: $.data.version }
          trigger:
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_d_id}", shelf_block: "M3", facings: 16, supply_mode: "WAREHOUSE", effective_from: "2026-08-10T00:00:00Z", effective_to: "2026-08-20T00:00:00Z", expected_store_version: "${store_v1}" }
              as: AssortmentPlanner
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409 and data.error_id == ERR_SHELF_CAPACITY_EXCEEDED"
            - "GET /assortments with store_id == ${store_id} and shelf_block == M3 returns total_count == 1 and data[0].id == ${assortment_c_id}"
            - "Assortment.${assortment_c_id}.facings == 16 and status == ACTIVE"
            - "Store.${store_id}.version == ${store_v1} — the rejected create did not bump the store"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_after_tender_restores_surcharge_fund_balance_exactly
        grounds:
          - state_machines.Sale.TENDERED_to_VOIDED
          - entities.FundLedgerEntry.fields.balance_after_cents
          - entities.Store.fields.surcharge_fund_balance_cents
          - calculations.sale_surcharge_rollup
        distinguishing_aspect: |
          Conserved quantity: sum(FundLedgerEntry.amount_cents) over the store's
          SURCHARGE fund, which must equal Store.surcharge_fund_balance_cents at
          every instant. Voiding a tendered sale writes a compensating
          SURCHARGE_REVERSAL of exactly -106 rather than recomputing the balance,
          so the fund returns to 0 with both entries retained and the sale's own
          surcharge_total_cents left untouched at 106 for audit. A per-line
          re-derivation would produce -105 and leak a cent.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store, surcharge_rate_bp 500."
            - "One INFANT_FORMULA product at unit_cost_cents 350 with no quantity limit."
            - "One ACTIVE WAREHOUSE assortment covering 2026-08-01 through 2026-08-31."
            - "One TENDERED sale at business_date 2026-08-12T00:00:00Z with two lines of quantity 3 each: each line's surcharge is round_half_up(1050 * 500 / 10000) == 53, so surcharge_total_cents == 106."
            - "Store.surcharge_fund_balance_cents == 106 and one SURCHARGE_COLLECTION entry exists."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Camp Lejeune Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-FOR-350", name: "Infant Formula 12oz", category: "INFANT_FORMULA", unit_cost_cents: 350 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "N4", facings: 8, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "GYSGT P Arriaga", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: SystemOperator
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 3 }
              as: StoreCashier
              captures: { line_a_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 3 }
              as: StoreCashier
              captures: { line_b_id: $.data.id }
            - call: "POST /sales/${sale_id}/tender"
              payload: {}
              as: StoreCashier
          trigger:
            - call: "POST /sales/${sale_id}/void"
              payload: { voided_reason: "OPERATOR_ERROR" }
              as: ComplianceOfficer
          assert:
            - "HTTP status == 200 and Sale.${sale_id}.tender_state == VOIDED"
            - "Store.${store_id}.surcharge_fund_balance_cents == 0"
            - "GET /stores/${store_id}/fund-ledger with fund == SURCHARGE returns total_count == 2"
            - "data[0].entry_type == SURCHARGE_COLLECTION with amount_cents == 106 and balance_after_cents == 106"
            - "data[1].entry_type == SURCHARGE_REVERSAL with amount_cents == -106 and balance_after_cents == 0"
            - "Sale.${sale_id}.surcharge_total_cents == 106 and merchandise_cents == 2100 — the sale record keeps its audit values"
            - "SaleLine.${line_a_id}.line_surcharge_cents == 53 and SaleLine.${line_b_id}.line_surcharge_cents == 53"
            - "Store.${store_id}.fund_posture == FROZEN"

      - name: cancel_after_overseas_route_releases_exact_committed_shipping_allowance
        grounds:
          - state_machines.SpecialOrder.OVERSEAS_SHIP_PENDING_to_CANCELLED
          - calculations.special_order_shipping_allowance
          - entities.Store.fields.shipping_allowance_committed_cents
          - entities.SpecialOrder.fields.shipping_allowance_cents
        distinguishing_aspect: |
          A different conserved quantity: Store.shipping_allowance_committed_cents
          must always equal the sum of shipping_allowance_cents over that store's
          orders in {LOCAL_FILL_PENDING, OVERSEAS_SHIP_PENDING, FULFILLED}.
          Cancelling releases exactly the 1260 that routing committed — not the
          1680 gross and not a recomputed figure — while the order keeps
          shipping_allowance_cents 1260 on its own record.
        test_recipe:
          setup:
            - "One EXCHANGE / OVERSEAS store (ship rate 210 cents per kg)."
            - "One GENERAL_MERCHANDISE product at unit_cost_cents 900 with unit_weight_grams 900."
            - "One ACTIVE WAREHOUSE assortment for that (store, product) covering 2026-08-01 through 2026-08-31."
            - "One SpecialOrder for quantity 8 routed OVERSEAS_SHIP: billable_weight_kg == ceil(7200/1000) == 8, gross_ship_cents == 1680, patron_share_cents == 420, shipping_allowance_cents == min(15000, 1260) == 1260."
            - "Store.shipping_allowance_committed_cents == 1260 before the trigger."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Kadena Exchange", channel: "EXCHANGE", region: "OVERSEAS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-GEN-900", name: "Camp Chair", category: "GENERAL_MERCHANDISE", unit_cost_cents: 900, unit_weight_grams: 900 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "P5", facings: 3, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "TSGT L Beaumont", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T00:00:00Z" }
              as: SystemOperator
            - call: "POST /special-orders"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}", product_id: "${product_id}", quantity: 8 }
              as: StoreCashier
              captures: { order_id: $.data.id }
            - call: "POST /special-orders/${order_id}/route"
              payload: { route: "OVERSEAS_SHIP" }
              as: StoreCashier
          trigger:
            - call: "POST /special-orders/${order_id}/cancel"
              payload: { cancelled_reason: "PATRON_REQUEST" }
              as: StoreCashier
          assert:
            - "HTTP status == 200 and SpecialOrder.${order_id}.state == CANCELLED"
            - "SpecialOrder.${order_id}.cancelled_reason == PATRON_REQUEST"
            - "SpecialOrder.${order_id}.billable_weight_kg == 8, gross_ship_cents == 1680, patron_share_cents == 420"
            - "SpecialOrder.${order_id}.shipping_allowance_cents == 1260 — retained on the cancelled record"
            - "Store.${store_id}.shipping_allowance_committed_cents == 0 — exactly 1260 released, not 1680"
            - "GET /stores/${store_id}/fund-ledger returns total_count == 0 — shipping allowance is appropriated funding, never a surcharge or dividend ledger movement"
