          setup:
            - "Two fully connected, dealer-activated machines (M1, M2) in one organization; one PUBLISHED package; delivery D1 on M1 still AWAITING_CONSENT (ticket REQUESTED); delivery D2 on M2 with consent GRANTED (CONSENT_GRANTED)."
