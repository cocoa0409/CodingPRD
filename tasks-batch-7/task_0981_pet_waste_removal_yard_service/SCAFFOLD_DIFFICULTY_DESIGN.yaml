              as: OperationsManager
              captures: { pl_o: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/subscriptions"
              payload: { customer_id: "${cu_o}", yard_id: "${y_o}", plan_id: "${pl_o}" }
              as: Customer
              as_user_id: "${cu_o}"
              captures: { sub_o: $.data.id }
            - call: "POST /api/subscriptions/${sub_o}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cu_o}"
            - call: "POST /api/technicians"
              payload: { full_name: "TO", employee_code: "T104" }
              as: OperationsManager
              captures: { t_o: $.data.id }
            - call: "POST /api/service-routes"
              payload: { route_code: "RO", service_date: "2026-05-08T00:00:00Z", service_region_code: "R1", assigned_technician_id: "${t_o}", max_visit_capacity: 10 }
              as: OperationsManager
              captures: { rt_o: $.data.id }
            - call: "POST /api/visits"
              payload: { subscription_id: "${sub_o}", scheduled_date: "2026-05-08T00:00:00Z", scheduled_window_start: "2026-05-08T09:00:00Z", scheduled_window_end: "2026-05-08T10:00:00Z", service_route_id: "${rt_o}" }
              as: OperationsManager
              captures: { v_o1: $.data.id }
          trigger:
            - call: "POST /api/visits"
              payload: { subscription_id: "${sub_o}", scheduled_date: "2026-05-08T00:00:00Z", scheduled_window_start: "2026-05-08T10:20:00Z", scheduled_window_end: "2026-05-08T11:00:00Z", service_route_id: "${rt_o}" }
              as: OperationsManager
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_VISIT_WINDOW_CONFLICT (10:20 - 10:00 = 20min < 15min buffer on each side; intervals [10:20,11:00) and [08:45,10:15) do intersect)"
            - "Route.${rt_o}.committed_visit_count == 1 (unchanged)"

  # =========================================================================
  # Rule 9 — compensating_invariant (2 instances, different conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: customer_credit_balance_invariant
        grounds:
          - entities.Customer.fields.credit_balance_cents
          - state_machines.Invoice.OPEN_to_FINALIZED
          - state_machines.Invoice.DISPUTED_to_RESOLVED
          - state_machines.SatisfactionReport.UNDER_REVIEW_to_RESOLVED
        distinguishing_aspect: |
          Conserved quantity: Customer.credit_balance_cents + Invoice.total_due_cents
          (when FINALIZED). credit_balance_cents increment by resolution credit
          then immediate finalize debit must net out. Forward action: resolve
          dispute granting 1500c. Compensating action: finalize invoice absorbs
          1500c. Invariant: sum of (credit_balance_cents + total_due_cents) is
          preserved across the pair.
        test_recipe:
          setup:
            - "Customer cu_p credit_balance_cents=0"
            - "Invoice inv_p FINALIZED with total_due=2000, then DISPUTED, then RESOLVED with 1500c credit"
            - "Invoice inv_p2 OPEN for next period"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "P", email: "p@x.com", phone: "+14155550116" }
              as: OperationsManager
              captures: { cu_p: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/invoices"
              payload: { customer_id: "${cu_p}", billing_period_start: "2026-05-01T00:00:00Z", billing_period_end: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
              captures: { inv_p: $.data.id, inv_p_v: $.data.version }
            - call: "POST /api/invoices/${inv_p}/finalize"
              payload: { expected_invoice_version: "${inv_p_v}" }
              as: BillingAdmin
            - call: "POST /api/invoices/${inv_p}/dispute"
              payload: { reason: "test" }
              as: Customer
              as_user_id: "${cu_p}"
            - call: "POST /api/invoices/${inv_p}/resolve-dispute"
              payload: { resolution_credit_cents: 1500 }
              as: BillingAdmin
          trigger:
            - call: "GET /api/customers/${cu_p}"
              payload: {}
              as: BillingAdmin
              captures: { bal: $.data.credit_balance_cents }
          assert:
            - "Customer.${cu_p}.credit_balance_cents == 1500 (credited by dispute resolution)"
            - "Invoice.${inv_p}.invoice_status == RESOLVED"
            - "When inv_p2 (next OPEN invoice) is finalized, its credits_applied_cents will debit this 1500 against its subtotal — preserving the global invariant credit_balance + finalized_total_due = const"
      - name: route_committed_visit_count_invariant
        grounds:
          - entities.ServiceRoute.fields.committed_visit_count
          - calculations.route_load_factor_bp
          - state_machines.Visit.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: ServiceRoute.committed_visit_count. Forward action:
          schedule visit (count += 1). Compensating action: cancel that visit
          (count -= 1). Invariant: count returns to its pre-pair value; the
          load_factor_bp returns identically.
        test_recipe:
          setup:
            - "Route rt_q cap 5, initially 1 committed visit (load=2000bp)"
            - "Subscription sub_q ACTIVE"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "Q", email: "q@x.com", phone: "+14155550117" }
              as: OperationsManager
              captures: { cu_q: $.data.id }
            - call: "POST /api/yards"
              payload: { customer_id: "${cu_q}", address_line1: "14 Main", city: "SF", state_code: "CA", postal_code: "94110", yard_size_sqft: 1500, pet_count: 1, service_region_code: "R1" }
              as: OperationsManager
              captures: { y_q: $.data.id }
            - call: "POST /api/yards/${y_q}/access-profile"
              payload: { gate_access_code: "1", gate_instructions: "", pet_on_premises: false, pet_aggression_flag: "NONE" }
              as: OperationsManager
              captures: { pap_q: $.data.id }
            - call: "POST /api/property-access-profiles/${pap_q}/verify"
              payload: {}
              as: OperationsManager
            - call: "POST /api/subscription-plans"
              payload: { plan_code: "WQ", display_name: "WQ", visit_frequency: "WEEKLY", applies_to_multifamily: false, base_monthly_fee_cents: 10000, yard_tier_thresholds: [], yard_tier_surcharges_cents: [0], pet_tier_thresholds: [], pet_tier_surcharges_cents: [0] }
              as: OperationsManager
              captures: { pl_q: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/subscriptions"
              payload: { customer_id: "${cu_q}", yard_id: "${y_q}", plan_id: "${pl_q}" }
              as: Customer
              as_user_id: "${cu_q}"
              captures: { sub_q: $.data.id }
            - call: "POST /api/subscriptions/${sub_q}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cu_q}"
            - call: "POST /api/technicians"
              payload: { full_name: "TQ", employee_code: "T105" }
              as: OperationsManager
              captures: { t_q: $.data.id }
            - call: "POST /api/service-routes"
              payload: { route_code: "RQ", service_date: "2026-05-12T00:00:00Z", service_region_code: "R1", assigned_technician_id: "${t_q}", max_visit_capacity: 5 }
              as: OperationsManager
              captures: { rt_q: $.data.id }
            - call: "POST /api/visits"
              payload: { subscription_id: "${sub_q}", scheduled_date: "2026-05-12T00:00:00Z", scheduled_window_start: "2026-05-12T09:00:00Z", scheduled_window_end: "2026-05-12T10:00:00Z", service_route_id: "${rt_q}" }
              as: OperationsManager
              captures: { v_q_pre: $.data.id }
            - call: "GET /api/service-routes/${rt_q}"
              payload: {}
              as: OperationsManager
              captures: { count_pre: $.data.committed_visit_count, load_pre: $.data.route_load_factor_bp }
          trigger:
            - call: "POST /api/visits"
              payload: { subscription_id: "${sub_q}", scheduled_date: "2026-05-12T00:00:00Z", scheduled_window_start: "2026-05-12T11:00:00Z", scheduled_window_end: "2026-05-12T12:00:00Z", service_route_id: "${rt_q}" }
              as: OperationsManager
              captures: { v_q_new: $.data.id }
            - call: "POST /api/visits/${v_q_new}/cancel"
              payload: {}
              as: Customer
