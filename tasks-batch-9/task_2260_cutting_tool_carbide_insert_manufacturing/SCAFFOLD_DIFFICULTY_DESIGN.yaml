# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cutting Tool & Carbide Insert Manufacturing — 9 rule_ids / 19 instances
# Every numeric literal in `assert:` was computed by executing the matching
# §1.3 formula with Decimal ROUND_HALF_UP against the pinned setup inputs.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: trial_life_rating_variant_divergence
        grounds:
          - calculations.trial_tool_life_rating
          - calculations.trial_verdict
          - entities.MachiningTrial.fields.rated_life_min
          - entities.MachiningTrial.fields.projected_life_min
          - entities.MachiningTrial.fields.censored
          - state_machines.MachiningTrial.RUNNING_to_COMPLETED
        distinguishing_aspect: |
          One wear curve produces two persisted tool-life numbers on the same row because
          MEASURED_INTERPOLATED interpolates inside the pair that brackets the 300 um wear
          criterion (rated_life_min = 20.0) while PROJECTED_TAYLOR extrapolates the slope of the
          last two points, which lie past the criterion, and therefore walks backwards to 18.0.
        test_recipe:
          setup:
            - "CarbideGrade WC-P25 (P group, 6.0% Co, 1600 HV) with one SINTERED, QC-PASSED blend batch of 180 units, grade in PILOT"
            - "InsertGeometry CNMG-MM in RELEASED, application_class MEDIUM (REQUIRED_LIFE_MIN 18.0 min, MAX_RA_UM 1.6), nose_radius_mm 0.8"
            - "Uncoated CATALOG ToolProduct in QUALIFICATION with an OPEN dossier and one RUNNING trial on workpiece group P"
            - "Logical clock left at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-P25", target_workpiece_group: "P", co_binder_pct: 6.0, wc_grain_um: 1.2, hardness_hv: 1600, trs_mpa: 2100 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/powder-blend-batches"
              payload: { grade_id: "${grade_id}", batch_code: "BLD-1", planned_mass_kg: 120.0 }
              as: MetallurgyEngineer
              captures: { batch_id: $.data.id }
            - call: "POST /tooling/powder-blend-batches/${batch_id}/press"
              payload: { pressed_units: 200 }
              as: MetallurgyEngineer
            - call: "POST /tooling/powder-blend-batches/${batch_id}/sinter"
              payload: { sintered_units: 180, scrap_units: 20, measured_density_gcc: 14.35, measured_hardness_hv: 1580 }
              as: MetallurgyEngineer
            - call: "POST /tooling/carbide-grades/${grade_id}/start-pilot"
              as: MetallurgyEngineer
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "CNMG-MM", iso_designation: "CNMG120408", application_class: "MEDIUM", chipbreaker_code: "MM", rake_angle_deg: 12.0, nose_radius_mm: 0.8, max_depth_of_cut_mm: 4.0, edge_prep: "HONED" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
            - call: "POST /tooling/insert-geometries/${geometry_id}/release"
              as: GeometryEngineer
            - call: "POST /tooling/tool-products"
              payload: { sku: "CAT-INS-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "INSERT", list_price_cents: 4550, min_order_qty: 25, nominal_length_mm: 12.7, min_regrind_length_mm: 12.7, regrind_step_mm: 0.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { product_id: $.data.id }
            - call: "POST /tooling/tool-products/${product_id}/enter-qualification"
              as: ApplicationEngineer
            - call: "POST /tooling/qualification-dossiers"
              payload: { product_id: "${product_id}", dossier_code: "DOS-1" }
              as: ApplicationEngineer
              captures: { dossier_id: $.data.id }
            - call: "POST /tooling/machining-trials"
              payload: { dossier_id: "${dossier_id}", batch_id: "${batch_id}", trial_code: "TRL-1", workpiece_material_code: "C45E", workpiece_group: "P", units_consumed: 20, cutting_speed_vc: 250.0, feed_fz: 0.25, depth_ap: 2.0, coolant: "FLOOD" }
              as: ApplicationEngineer
              as_user_id: "op-1"
              captures: { trial1_id: $.data.id }
          trigger:
            - call: "POST /tooling/machining-trials/${trial1_id}/complete"
              payload: { wear_measurements: [{ minutes: 0, vb_um: 0 }, { minutes: 6, vb_um: 150 }, { minutes: 12, vb_um: 225 }, { minutes: 18, vb_um: 290 }, { minutes: 24, vb_um: 320 }, { minutes: 30, vb_um: 340 }], measured_surface_ra_um: 1.20 }
              as: ApplicationEngineer
              as_user_id: "op-1"
          assert:
            - "MachiningTrial.${trial1_id}.rated_life_min == 20.0"
            - "MachiningTrial.${trial1_id}.projected_life_min == 18.0"
            - "MachiningTrial.${trial1_id}.rated_life_min - MachiningTrial.${trial1_id}.projected_life_min == 2.0"
            - "MachiningTrial.${trial1_id}.censored == false"
            - "MachiningTrial.${trial1_id}.verdict == PASS"
            - "MachiningTrial.${trial1_id}.status == COMPLETED"
            - "QualificationDossier.${dossier_id}.composite_score == 1.20"
            - "QualificationDossier.${dossier_id}.completed_trial_count == 1 and passed_trial_count == 1"

      - name: recondition_life_extension_variant_divergence
        grounds:
          - calculations.recondition_life_extension
          - entities.ReconditionJob.fields.life_extension_pct
          - entities.ReconditionJob.fields.warranted_life_extension_pct
          - entities.ReconditionJob.fields.remaining_regrinds
          - state_machines.ReconditionJob.RECEIVED_to_INSPECTED
        distinguishing_aspect: |
          The same inspected job carries two life-extension percentages that cannot agree because
          RESIDUAL_GEOMETRY reads only the measured remaining length against the 2.5 mm regrind step
          (12.5%) while CUMULATIVE_PASS_HISTORY reads only the regrind pass number through the 35.0%
          / 0.7 decay curve (35.0%), ignoring every measurement.
        test_recipe:
          setup:
            - "A SOLID_CARBIDE_ENDMILL product with nominal_length_mm 100.0, min_regrind_length_mm 70.0, regrind_step_mm 2.5, grind_units_per_tool 20"
            - "Customer CU-1 with an opening regrind_credit_cents of 50000"
            - "First-pass ReconditionJob RJ-1 in RECEIVED for 10 tools (intake reservation 10 * 1850 = 18500)"
          setup_api_calls:
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-K10", target_workpiece_group: "K", co_binder_pct: 6.0, wc_grain_um: 0.8, hardness_hv: 1750, trs_mpa: 1900 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "EM-4F-30", iso_designation: "EM10-4F", application_class: "MEDIUM", chipbreaker_code: "NONE", rake_angle_deg: 10.0, nose_radius_mm: 0.5, max_depth_of_cut_mm: 10.0, edge_prep: "SHARP" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
            - call: "POST /tooling/tool-products"
              payload: { sku: "EM-10-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "SOLID_CARBIDE_ENDMILL", list_price_cents: 12000, min_order_qty: 1, nominal_length_mm: 100.0, min_regrind_length_mm: 70.0, regrind_step_mm: 2.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { em_product_id: $.data.id }
            - call: "POST /tooling/customers"
              payload: { customer_code: "CU-1", name: "Acme Machining", tier: "PREFERRED", regrind_credit_cents: 50000 }
              as: ProductionPlanner
              captures: { customer_id: $.data.id, cust_ver: $.data.version }
            - call: "POST /tooling/recondition-jobs"
              payload: { customer_id: "${customer_id}", product_id: "${em_product_id}", job_code: "RJ-1", units_received: 10, expected_customer_version: "${cust_ver}" }
              as: ProductionPlanner
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /tooling/recondition-jobs/${job_id}/inspect"
              payload: { units_inspected: 10, measured_length_mm: 82.5, measured_corner_wear_um: 120 }
              as: ProductionPlanner
          assert:
            - "ReconditionJob.${job_id}.remaining_regrinds == 5"
            - "ReconditionJob.${job_id}.life_extension_pct == 12.5"
            - "ReconditionJob.${job_id}.warranted_life_extension_pct == 35.0"
            - "ReconditionJob.${job_id}.life_extension_pct != ReconditionJob.${job_id}.warranted_life_extension_pct"
            - "ReconditionJob.${job_id}.scrap_recommended == false"
            - "ReconditionJob.${job_id}.regrind_pass_no == 1"
            - "ReconditionJob.${job_id}.status == INSPECTED"
            - "Customer.${customer_id}.regrind_credit_cents == 31500 and reserved_credit_cents == 18500"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: order_per_unit_round_then_multiply
        grounds:
          - calculations.order_price
          - entities.ToolOrder.fields.per_unit_net_cents
          - entities.ToolOrder.fields.total_price_cents
          - state_machines.ToolOrder.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (b) — rounding-order sensitivity: rounding the surcharged, discounted price to whole
          cents once per unit and then multiplying by 100 yields 4485 / 448500, whereas multiplying
          the unrounded 4485.39 by 100 and rounding the total once yields 448539, a 39-cent gap.
        test_recipe:
          setup:
            - "Fully qualified and RELEASED CATALOG insert: grade WC-P25 QUALIFIED, geometry RELEASED, PVD recipe validated (3.00 um), list_price_cents 4550, min_order_qty 25"
            - "The product's grade is P group (no exotic surcharge), the coating is PVD (+6%), order_class CATALOG (no special surcharge)"
            - "Customer CU-1 ACTIVE with 50000 cents of regrind credit"
            - "Order quantity 100 lands in the >= 100 volume tier (-7%)"
          setup_api_calls:
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-P25", target_workpiece_group: "P", co_binder_pct: 6.0, wc_grain_um: 1.2, hardness_hv: 1600, trs_mpa: 2100 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/powder-blend-batches"
              payload: { grade_id: "${grade_id}", batch_code: "BLD-1", planned_mass_kg: 120.0 }
              as: MetallurgyEngineer
              captures: { batch_id: $.data.id }
            - call: "POST /tooling/powder-blend-batches/${batch_id}/press"
              payload: { pressed_units: 200 }
              as: MetallurgyEngineer
            - call: "POST /tooling/powder-blend-batches/${batch_id}/sinter"
              payload: { sintered_units: 180, scrap_units: 20, measured_density_gcc: 14.35, measured_hardness_hv: 1580 }
              as: MetallurgyEngineer
            - call: "POST /tooling/carbide-grades/${grade_id}/start-pilot"
              as: MetallurgyEngineer
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "CNMG-MM", iso_designation: "CNMG120408", application_class: "MEDIUM", chipbreaker_code: "MM", rake_angle_deg: 12.0, nose_radius_mm: 0.8, max_depth_of_cut_mm: 4.0, edge_prep: "HONED" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
            - call: "POST /tooling/insert-geometries/${geometry_id}/release"
              as: GeometryEngineer
            - call: "POST /tooling/coating-recipes"
              payload: { recipe_code: "PVD-TIALN-3", deposition_type: "PVD", layers: [{ material: "TiAlN", thickness_um: 3.0 }] }
              as: CoatingEngineer
              captures: { recipe_id: $.data.id }
            - call: "POST /tooling/coating-runs"
              payload: { recipe_id: "${recipe_id}", chamber_id: "CH1", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T12:00:00Z", loaded_area_cm2: 2500.00 }
              as: CoatingEngineer
              captures: { crun_id: $.data.id }
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T12:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/coating-runs/${crun_id}/complete"
              payload: { adhesion_hf_class: 2, measured_thickness_um: 3.10 }
              as: CoatingEngineer
            - call: "POST /tooling/tool-products"
              payload: { sku: "CAT-INS-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", coating_recipe_id: "${recipe_id}", tool_type: "INSERT", list_price_cents: 4550, min_order_qty: 25, nominal_length_mm: 12.7, min_regrind_length_mm: 12.7, regrind_step_mm: 0.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { product_id: $.data.id }
            - call: "POST /tooling/tool-products/${product_id}/enter-qualification"
              as: ApplicationEngineer
            - call: "POST /tooling/qualification-dossiers"
              payload: { product_id: "${product_id}", dossier_code: "DOS-1" }
              as: ApplicationEngineer
              captures: { dossier_id: $.data.id }
            - call: "POST /tooling/machining-trials"
              payload: { dossier_id: "${dossier_id}", batch_id: "${batch_id}", trial_code: "TRL-1", workpiece_material_code: "C45E", workpiece_group: "P", units_consumed: 20, cutting_speed_vc: 250.0, feed_fz: 0.25, depth_ap: 2.0, coolant: "FLOOD" }
              as: ApplicationEngineer
              as_user_id: "op-1"
              captures: { trial1_id: $.data.id }
            - call: "POST /tooling/machining-trials/${trial1_id}/complete"
              payload: { wear_measurements: [{ minutes: 0, vb_um: 0 }, { minutes: 6, vb_um: 150 }, { minutes: 12, vb_um: 225 }, { minutes: 18, vb_um: 290 }, { minutes: 24, vb_um: 320 }, { minutes: 30, vb_um: 340 }], measured_surface_ra_um: 1.20 }
              as: ApplicationEngineer
              as_user_id: "op-1"
            - call: "POST /tooling/machining-trials"
              payload: { dossier_id: "${dossier_id}", batch_id: "${batch_id}", trial_code: "TRL-2", workpiece_material_code: "SS316L", workpiece_group: "M", units_consumed: 20, cutting_speed_vc: 180.0, feed_fz: 0.20, depth_ap: 2.0, coolant: "THROUGH_TOOL" }
              as: ApplicationEngineer
              as_user_id: "op-2"
              captures: { trial2_id: $.data.id }
            - call: "POST /tooling/machining-trials/${trial2_id}/complete"
              payload: { wear_measurements: [{ minutes: 0, vb_um: 0 }, { minutes: 8, vb_um: 160 }, { minutes: 16, vb_um: 250 }, { minutes: 24, vb_um: 305 }, { minutes: 32, vb_um: 330 }], measured_surface_ra_um: 1.50 }
              as: ApplicationEngineer
              as_user_id: "op-2"
            - call: "POST /tooling/qualification-dossiers/${dossier_id}/submit"
              as: ApplicationEngineer
              as_user_id: "ae-7"
            - call: "POST /tooling/qualification-dossiers/${dossier_id}/approve"
              payload: { decision_note: "Qualified on P and M" }
              as: QualityApprover
              as_user_id: "qa-3"
            - call: "POST /tooling/tool-products/${product_id}/release"
              as: QualityApprover
              as_user_id: "qa-3"
            - call: "POST /tooling/customers"
              payload: { customer_code: "CU-1", name: "Acme Machining", tier: "PREFERRED", regrind_credit_cents: 50000 }
              as: ProductionPlanner
              captures: { customer_id: $.data.id }
            - call: "GET /tooling/tool-products/${product_id}"
              as: ApplicationEngineer
              captures: { p_ver: $.data.version }
          trigger:
            - call: "POST /tooling/tool-orders"
              payload: { customer_id: "${customer_id}", product_id: "${product_id}", order_code: "SO-1", quantity: 100, expedite_requested: false, expected_product_version: "${p_ver}" }
              as: ApplicationEngineer
              captures: { order_id: $.data.id }
            - call: "POST /tooling/tool-orders/${order_id}/submit"
              as: ApplicationEngineer
          assert:
            - "ToolProduct.${product_id}.release_status == RELEASED and supply_status == STOCKED"
            - "ToolProduct.${product_id}.tool_life_index == 21.7"
            - "ToolProduct.${product_id}.qualified_workpiece_groups == [M, P]"
            - "ToolOrder.${order_id}.per_unit_net_cents == 4485"
            - "ToolOrder.${order_id}.total_price_cents == 448500"
            - "ToolOrder.${order_id}.total_price_cents != 448539"
            - "ToolOrder.${order_id}.status == SUBMITTED"
            - "ToolOrder.${order_id}.promised_lead_time_days == 6"
            - "ToolProduct.${product_id}.open_order_units == 100"

      - name: product_lead_time_pre_shave_eligibility
        grounds:
          - calculations.engineering_lead_time_days
          - entities.ToolProduct.fields.engineering_lead_time_days
          - entities.ToolProduct.fields.expedite_eligible
          - validations[priority=22]
        distinguishing_aspect: |
          Mode (c) — evaluation-order sensitivity: expedite eligibility is decided on the pre-shave
          raw lead time, so a SPECIAL/CVD product with raw 22 days stays at 22 (ineligible) even
          though 22 - 3 = 19 would have been inside the 21-day expedite window, while the otherwise
          identical SPECIAL/PVD product with raw 19 is eligible and ships at 16.
        test_recipe:
          setup:
            - "Grade WC-P25 QUALIFIED, geometry CNMG-MM RELEASED, PVD recipe validated at 3.00 um, plus an unvalidated CVD recipe at 4.00 um"
            - "A RELEASED CATALOG product CAT-INS-1 exists to act as the base_catalog_product_id for the SPECIAL derivations"
          setup_api_calls:
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-P25", target_workpiece_group: "P", co_binder_pct: 6.0, wc_grain_um: 1.2, hardness_hv: 1600, trs_mpa: 2100 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/powder-blend-batches"
              payload: { grade_id: "${grade_id}", batch_code: "BLD-1", planned_mass_kg: 120.0 }
              as: MetallurgyEngineer
              captures: { batch_id: $.data.id }
            - call: "POST /tooling/powder-blend-batches/${batch_id}/press"
              payload: { pressed_units: 200 }
              as: MetallurgyEngineer
            - call: "POST /tooling/powder-blend-batches/${batch_id}/sinter"
              payload: { sintered_units: 180, scrap_units: 20, measured_density_gcc: 14.35, measured_hardness_hv: 1580 }
              as: MetallurgyEngineer
            - call: "POST /tooling/carbide-grades/${grade_id}/start-pilot"
              as: MetallurgyEngineer
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "CNMG-MM", iso_designation: "CNMG120408", application_class: "MEDIUM", chipbreaker_code: "MM", rake_angle_deg: 12.0, nose_radius_mm: 0.8, max_depth_of_cut_mm: 4.0, edge_prep: "HONED" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
            - call: "POST /tooling/insert-geometries/${geometry_id}/release"
              as: GeometryEngineer
            - call: "POST /tooling/coating-recipes"
              payload: { recipe_code: "PVD-TIALN-3", deposition_type: "PVD", layers: [{ material: "TiAlN", thickness_um: 3.0 }] }
              as: CoatingEngineer
              captures: { recipe_id: $.data.id }
            - call: "POST /tooling/coating-runs"
              payload: { recipe_id: "${recipe_id}", chamber_id: "CH1", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T12:00:00Z", loaded_area_cm2: 2500.00 }
              as: CoatingEngineer
              captures: { crun_id: $.data.id }
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T12:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/coating-runs/${crun_id}/complete"
              payload: { adhesion_hf_class: 2, measured_thickness_um: 3.10 }
              as: CoatingEngineer
            - call: "POST /tooling/coating-recipes"
              payload: { recipe_code: "CVD-TICN-4", deposition_type: "CVD", layers: [{ material: "TiCN", thickness_um: 4.0 }] }
              as: CoatingEngineer
              captures: { cvd_recipe_id: $.data.id }
            - call: "POST /tooling/tool-products"
              payload: { sku: "CAT-INS-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", coating_recipe_id: "${recipe_id}", tool_type: "INSERT", list_price_cents: 4550, min_order_qty: 25, nominal_length_mm: 12.7, min_regrind_length_mm: 12.7, regrind_step_mm: 0.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { product_id: $.data.id }
            - call: "POST /tooling/tool-products/${product_id}/enter-qualification"
              as: ApplicationEngineer
            - call: "POST /tooling/qualification-dossiers"
              payload: { product_id: "${product_id}", dossier_code: "DOS-1" }
              as: ApplicationEngineer
              captures: { dossier_id: $.data.id }
            - call: "POST /tooling/machining-trials"
              payload: { dossier_id: "${dossier_id}", batch_id: "${batch_id}", trial_code: "TRL-1", workpiece_material_code: "C45E", workpiece_group: "P", units_consumed: 20, cutting_speed_vc: 250.0, feed_fz: 0.25, depth_ap: 2.0, coolant: "FLOOD" }
              as: ApplicationEngineer
              as_user_id: "op-1"
              captures: { trial1_id: $.data.id }
            - call: "POST /tooling/machining-trials/${trial1_id}/complete"
              payload: { wear_measurements: [{ minutes: 0, vb_um: 0 }, { minutes: 6, vb_um: 150 }, { minutes: 12, vb_um: 225 }, { minutes: 18, vb_um: 290 }, { minutes: 24, vb_um: 320 }, { minutes: 30, vb_um: 340 }], measured_surface_ra_um: 1.20 }
              as: ApplicationEngineer
              as_user_id: "op-1"
            - call: "POST /tooling/machining-trials"
              payload: { dossier_id: "${dossier_id}", batch_id: "${batch_id}", trial_code: "TRL-2", workpiece_material_code: "SS316L", workpiece_group: "M", units_consumed: 20, cutting_speed_vc: 180.0, feed_fz: 0.20, depth_ap: 2.0, coolant: "THROUGH_TOOL" }
              as: ApplicationEngineer
              as_user_id: "op-2"
              captures: { trial2_id: $.data.id }
            - call: "POST /tooling/machining-trials/${trial2_id}/complete"
              payload: { wear_measurements: [{ minutes: 0, vb_um: 0 }, { minutes: 8, vb_um: 160 }, { minutes: 16, vb_um: 250 }, { minutes: 24, vb_um: 305 }, { minutes: 32, vb_um: 330 }], measured_surface_ra_um: 1.50 }
              as: ApplicationEngineer
              as_user_id: "op-2"
            - call: "POST /tooling/qualification-dossiers/${dossier_id}/submit"
              as: ApplicationEngineer
              as_user_id: "ae-7"
            - call: "POST /tooling/qualification-dossiers/${dossier_id}/approve"
              payload: { decision_note: "Qualified on P and M" }
              as: QualityApprover
              as_user_id: "qa-3"
            - call: "POST /tooling/tool-products/${product_id}/release"
              as: QualityApprover
              as_user_id: "qa-3"
          trigger:
            - call: "POST /tooling/tool-products"
