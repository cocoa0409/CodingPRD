      - name: accommodation_reference_ladder_owner_then_status_then_format
        claim_type: priority_ordering
        grounds:
          - validations[priority=60]
          - validations[priority=61]
          - validations[priority=62]
          - errors[ERR_ACCOMMODATION_OWNER_MISMATCH]
          - errors[ERR_ACCOMMODATION_NOT_APPROVED]
          - errors[ERR_ACCOMMODATION_FORMAT_UNAVAILABLE]
        distinguishing_aspect: |
          An accommodation_request_id passed to POST /exam-registrations is screened by three separate
          checks that must run in a fixed order: ownership (60) before status (61) before session format
          support (62). The three failing references are deliberately chosen so that each one passes the
          earlier rungs and fails exactly one: the other student's request is APPROVED (so only 60 can
          fire), the caller's own EXTRA_TIME request is still SUBMITTED (so only 61 can fire), and the
          caller's BRAILLE request is APPROVED and unexpired but names a format the session does not
          support (so only 62 can fire). The fourth attempt then succeeds and proves the surcharge is
          zero for EXTRA_TIME, since EXTRA_TIME is not an alternate format.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. A FULL_AUTHORIZED center with a room, a CERTIFIED proctor, and a MATH session on 2026-08-20 that keeps the default supported_formats ['STANDARD','EXTRA_TIME']."
