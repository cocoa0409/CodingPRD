      - name: evidence_approve_audit_not_in_fieldwork_returns_error
        claim_type: Violation to Error
        grounds:
          - validations[priority=25]
          - errors[ERR_AUDIT_NOT_IN_FIELDWORK]
          - state_machines.AuditEvidence.SUBMITTED_to_APPROVED
        distinguishing_aspect: "Approving evidence while the parent audit is still in PLANNING (not FIELDWORK) returns ERR_AUDIT_NOT_IN_FIELDWORK (409). Evidence is submitted in FIELDWORK then audit reopened... not reachable; instead submit requires audit existing — exercise by submitting then never advancing. Reachable: submit in PLANNING is allowed by OCC create, approve checks FIELDWORK."
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cross_audit_ready_requires_zero_open_critical_findings
          rationale: "The audit-phase gating on evidence operations is structurally exercised by the §1.8 audit/evidence cross-entity instance, which drives the FIELDWORK->approve path; the negative PLANNING path is its mirror and adds no new reachability surface."

      - name: period_closed_blocks_incident_resolve
        claim_type: Violation to Error
        grounds:
          - validations[priority=19]
          - errors[ERR_PERIOD_CLOSED]
          - state_machines.Incident.CONTAINED_to_RESOLVED
        distinguishing_aspect: "Resolving a CONTAINED incident whose client period was advanced (current ledger differs) still uses the CURRENT OPEN ledger; ERR_PERIOD_CLOSED is reachable on authorize when the captured ledger is CLOSED. Covered structurally by retainer instances."
        excluded_because:
          difficulty_instance: dual_variant_calc / dual_variant_retainer_optimistic_vs_actual
          rationale: "The OPEN/CLOSED ledger lifecycle that ERR_PERIOD_CLOSED guards is exercised by the retainer dual-variant instance; the explicit closed-period rejection is its negative mirror with no new endpoint surface."

