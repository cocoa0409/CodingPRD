# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Doula & Midwifery Birth Center — Expert difficulty.
# 9 rule_id blocks, 2 instances each = 18 instances total.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # ---- Instance 1: Charge domain — estimate vs adjudicated responsibility
      - name: dvc_charge_estimate_vs_adjudicated
        grounds:
          - calculations.charge_client_responsibility
          - entities.Charge.fields.client_responsibility_cents
          - state_machines.InsuranceClaim.transitions.SUBMITTED_to_ADJUDICATED
          - entities.Episode.fields.balance_due_cents
        distinguishing_aspect: |
          On the Charge entity: the GLOBAL_FEE charge responsibility is 160000 under the
          ESTIMATE variant (20% of 800000) at episode creation, but becomes 60000 under the
          ADJUDICATED variant (allowed 600000 - paid 540000) after the claim adjudicates —
          same charge, two formulas, different cents.
        test_recipe:
          setup:
            - "SupplyKit BK1 on_hand=5; CarePackage PKG_BIRTH global_fee=800000, kit BK1, postpartum_incl=2."
            - "One Client and one Episode (clinical PLANNING, GLOBAL_FEE charge DRAFT resp=160000, balance=160000)."
            - "InsuranceClaim SUBMITTED for the episode (billed=800000)."
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 5 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0, insurance_payer: "BlueShield", policy_number: "P1" }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${client_id}", package_code: "PKG_BIRTH", edd: "2026-08-01" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id }
            - call: "POST /birth-center/insurance-claims"
              payload: { episode_id: "${ep_id}" }
              as: BillingClerk
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /birth-center/insurance-claims/${claim_id}/adjudicate"
              payload: { allowed_amount_cents: 600000, paid_amount_cents: 540000 }
              as: BillingClerk
          assert:
            - "before trigger, the episode's GLOBAL_FEE Charge.client_responsibility_cents == 160000"
            - "after trigger, the episode's GLOBAL_FEE Charge.client_responsibility_cents == 60000"
            - "after trigger, Episode.${ep_id}.balance_due_cents == 60000"

      # ---- Instance 2: Provider domain — primary_load vs coverage_load
      - name: dvc_provider_primary_vs_coverage_load
        grounds:
          - calculations.provider_capacity_load
          - entities.Provider.fields.active_assignment_count
          - entities.OnCallAssignment.fields.coverage_role
          - entities.OnCallAssignment.fields.backup_assignment_id
        distinguishing_aspect: |
          On the Provider entity: a provider holding only a BACKUP row still in ASSIGNED has
          PRIMARY-LOAD (persisted active_assignment_count) == 0 because the BACKUP/ASSIGNED row is
          excluded, yet its COVERAGE-LOAD == 1 because that same row IS counted — same provider,
          two count variants diverge on the identical underlying row.
        test_recipe:
          setup:
            - "Standard kit+package+client+episode; episode ACTIVE."
            - "Provider PRI (max_active=2) is PRIMARY ASSIGNED on the episode; Provider BAK named as its BACKUP (ASSIGNED)."
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 5 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${client_id}", package_code: "PKG_BIRTH", edd: "2026-08-01" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id }
            - call: "POST /birth-center/episodes/${ep_id}/activate"
              payload: {}
              as: Midwife
            - call: "POST /birth-center/providers"
              payload: { full_name: "Pri Midwife", role_type: "MIDWIFE", license_number: "L-PRI", max_active_episodes: 2 }
              as: CenterAdmin
              captures: { pri_id: $.data.id }
            - call: "POST /birth-center/providers"
              payload: { full_name: "Bak Midwife", role_type: "MIDWIFE", license_number: "L-BAK", max_active_episodes: 2 }
              as: CenterAdmin
              captures: { bak_id: $.data.id }
            - call: "POST /birth-center/on-call-assignments"
              payload: { episode_id: "${ep_id}", provider_id: "${pri_id}", coverage_start: "2026-07-25T00:00:00Z", coverage_end: "2026-08-10T00:00:00Z" }
              as: CenterAdmin
              captures: { pri_asg_id: $.data.id }
          trigger:
            - call: "POST /birth-center/on-call-assignments/${pri_asg_id}/name-backup"
              payload: { provider_id: "${bak_id}", coverage_start: "2026-07-25T00:00:00Z", coverage_end: "2026-08-10T00:00:00Z" }
              as: CenterAdmin
              captures: { bak_asg_id: $.data.id }
          assert:
            - "after trigger, OnCallAssignment.${bak_asg_id}.coverage_role == BACKUP and status == ASSIGNED"
            - "after trigger, Provider.${bak_id}.active_assignment_count == 0 (PRIMARY-LOAD excludes a BACKUP/ASSIGNED row)"
            - "after trigger, Provider.${pri_id}.active_assignment_count == 1 (the PRIMARY/ASSIGNED row counts under PRIMARY-LOAD)"
            - "COVERAGE-LOAD over BAK's rows counts the BACKUP/ASSIGNED row == 1, diverging from BAK's PRIMARY-LOAD of 0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # ---- Instance 1: mode (a) — risk tier, >=3 inputs, non-linear branching
      - name: cf_risk_tier_branching_inputs
        grounds:
          - calculations.episode_risk_tier
          - entities.Episode.fields.risk_tier
          - state_machines.PrenatalVisit.transitions.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          Mode (a): episode_risk_tier folds three inputs (worst_flag, max_systolic, watch_count)
          through a first-match branch ladder. Two COMPLETED WATCH visits (each below the BP
          thresholds) escalate to TRANSFER_REQUIRED via watch_count>=2, a result no single
          input alone produces.
        test_recipe:
          setup:
            - "Standard kit+package+client+episode (risk LOW)."
            - "Two PrenatalVisits scheduled on the episode."
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 5 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${client_id}", package_code: "PKG_BIRTH", edd: "2026-08-01" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id }
            - call: "POST /birth-center/prenatal-visits"
              payload: { episode_id: "${ep_id}", visit_kind: "PRENATAL", scheduled_at: "2026-04-01T10:00:00Z" }
              as: Midwife
              captures: { v1_id: $.data.id }
            - call: "POST /birth-center/prenatal-visits"
              payload: { episode_id: "${ep_id}", visit_kind: "PRENATAL", scheduled_at: "2026-04-15T10:00:00Z" }
              as: Midwife
              captures: { v2_id: $.data.id }
            - call: "POST /birth-center/prenatal-visits/${v1_id}/complete"
              payload: { risk_flag: "WATCH", blood_pressure_systolic: 120 }
              as: Midwife
          trigger:
            - call: "POST /birth-center/prenatal-visits/${v2_id}/complete"
              payload: { risk_flag: "WATCH", blood_pressure_systolic: 125 }
              as: Midwife
          assert:
            - "after the first complete (one WATCH, bp 120), Episode.${ep_id}.risk_tier == ELEVATED"
            - "after trigger (two WATCH visits, watch_count==2), Episode.${ep_id}.risk_tier == TRANSFER_REQUIRED"

      # ---- Instance 2: mode (b) — payment waterfall with pinned rounding order
      - name: cf_payment_waterfall_rounding_order
        grounds:
          - calculations.payment_plan_waterfall
          - entities.PaymentPlan.fields.paid_cents
          - entities.PaymentPlan.fields.remaining_cents
          - state_machines.PaymentPlan.transitions.OPEN_to_PAID_OFF
        distinguishing_aspect: |
          Mode (b): the installment schedule pins the rounding order — the leftover remainder
          cent goes to the EARLIEST installment. For total 100003 over 3, the schedule is
          [33335, 33334, 33334]; a first payment of exactly 33335 fully covers installment 1 and
          leaves remaining 66668, which only holds if the remainder lands on the earliest slot.
        test_recipe:
          setup:
            - "Standard kit+package+client+episode."
            - "An EXTRA_VISIT charge brings the balance to 100003; a PaymentPlan with 3 installments is created."
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 5 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${client_id}", package_code: "PKG_BIRTH", edd: "2026-08-01" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id }
            # Deny the global fee so global resp = 800000? No — keep balance deterministic:
            # void path not used. Instead build balance via claim deny then extra to hit 100003.
            # Simpler: adjudicate global to 100000, then EXTRA_VISIT 3 -> 100003.
            - call: "POST /birth-center/insurance-claims"
              payload: { episode_id: "${ep_id}" }
              as: BillingClerk
              captures: { claim_id: $.data.id }
            - call: "POST /birth-center/insurance-claims/${claim_id}/adjudicate"
              payload: { allowed_amount_cents: 100000, paid_amount_cents: 0 }
              as: BillingClerk
            - call: "POST /birth-center/charges"
              payload: { episode_id: "${ep_id}", charge_kind: "EXTRA_VISIT", amount_cents: 3 }
              as: BillingClerk
            - call: "GET /birth-center/episodes/${ep_id}"
              payload: {}
              as: BillingClerk
              captures: { ep_v: $.data.version }
            - call: "POST /birth-center/payment-plans"
              payload: { episode_id: "${ep_id}", installment_count: 3, expected_episode_version: "${ep_v}" }
              as: BillingClerk
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /birth-center/payment-plans/${plan_id}/payments"
              payload: { amount_cents: 33335 }
              as: BillingClerk
          assert:
            - "after the EXTRA_VISIT charge, Episode.${ep_id}.balance_due_cents == 100003"
            - "PaymentPlan.${plan_id}.total_cents == 100003"
            - "after trigger, PaymentPlan.${plan_id}.paid_cents == 33335"
            - "after trigger, PaymentPlan.${plan_id}.remaining_cents == 66668"
            - "after trigger, PaymentPlan.${plan_id}.status == OPEN"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # ---- Instance 1: PrenatalVisit cyclic risk loop (escalate then de-escalate-attempt)
      - name: nlsm_prenatal_risk_loop
        grounds:
          - state_machines.PrenatalVisit.transitions.SCHEDULED_to_COMPLETED
          - calculations.episode_risk_tier
          - entities.Episode.fields.risk_tier
        distinguishing_aspect: |
          On the PrenatalVisit/Episode pair: completing successive visits drives Episode.risk_tier
          up and back down across the loop — a WATCH visit raises it to ELEVATED, a later NONE
          visit keeps worst_flag=WATCH so it stays ELEVATED, demonstrating the cyclic re-derivation
          (not a one-way pipeline).
        test_recipe:
          setup:
            - "Standard kit+package+client+episode; two PrenatalVisits scheduled."
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 5 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${client_id}", package_code: "PKG_BIRTH", edd: "2026-08-01" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id }
            - call: "POST /birth-center/prenatal-visits"
              payload: { episode_id: "${ep_id}", visit_kind: "PRENATAL", scheduled_at: "2026-04-01T10:00:00Z" }
              as: Midwife
              captures: { v1_id: $.data.id }
            - call: "POST /birth-center/prenatal-visits"
              payload: { episode_id: "${ep_id}", visit_kind: "PRENATAL", scheduled_at: "2026-04-15T10:00:00Z" }
              as: Midwife
              captures: { v2_id: $.data.id }
            - call: "POST /birth-center/prenatal-visits/${v1_id}/complete"
              payload: { risk_flag: "WATCH", blood_pressure_systolic: 120 }
              as: Midwife
          trigger:
            - call: "POST /birth-center/prenatal-visits/${v2_id}/complete"
              payload: { risk_flag: "NONE", blood_pressure_systolic: 118 }
              as: Midwife
          assert:
            - "after the first complete, Episode.${ep_id}.risk_tier == ELEVATED"
            - "after trigger, Episode.${ep_id}.risk_tier == ELEVATED (worst_flag among COMPLETED is still WATCH; re-derivation re-evaluates over both COMPLETED visits)"
            - "PrenatalVisit.${v2_id}.status == COMPLETED"

      # ---- Instance 2: Booking branching COMPLETED vs TRANSFERRED (divergent side effects)
      - name: nlsm_booking_branch_transferred_vs_completed
        grounds:
          - state_machines.Booking.transitions.IN_USE_to_TRANSFERRED
          - state_machines.Booking.transitions.IN_USE_to_COMPLETED
          - state_machines.Episode.transitions.ACTIVE_to_TRANSFERRED
        distinguishing_aspect: |
          On the Booking entity: from IN_USE the booking forks into two terminals with divergent
          side-effect sets — the TRANSFERRED branch (driven by episode transfer) creates a
          TRANSFER_FEE Charge of 75000 on the episode, whereas the COMPLETED branch (driven by
          record-birth) creates no charge. This instance drives the TRANSFERRED branch.
        test_recipe:
          setup:
            - "Standard kit+package+client+episode; episode ACTIVE."
            - "Room R1; a Booking confirmed and checked-in (IN_USE) for the episode."
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 5 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${client_id}", package_code: "PKG_BIRTH", edd: "2026-08-01" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id }
            - call: "POST /birth-center/episodes/${ep_id}/activate"
              payload: {}
              as: Midwife
            - call: "POST /birth-center/rooms"
              payload: { name: "Garden Suite", turnover_minutes: 0 }
              as: CenterAdmin
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /birth-center/bookings"
              payload: { episode_id: "${ep_id}", room_id: "${room_id}", starts_at: "2026-01-02T00:00:00Z", ends_at: "2026-01-03T00:00:00Z", expected_room_version: "${room_v}" }
              as: CenterAdmin
              captures: { bk_id: $.data.id }
            - call: "POST /birth-center/bookings/${bk_id}/confirm"
              payload: {}
              as: CenterAdmin
            - call: "POST /birth-center/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-02T01:00:00Z" }
              as: CenterAdmin
            - call: "POST /birth-center/bookings/${bk_id}/check-in"
              payload: {}
              as: CenterAdmin
          trigger:
            - call: "POST /birth-center/episodes/${ep_id}/transfer"
              payload: {}
              as: Midwife
          assert:
            - "after trigger, Booking.${bk_id}.status == TRANSFERRED"
            - "after trigger, exactly one Charge with charge_kind==TRANSFER_FEE and amount_cents==75000 exists on Episode.${ep_id}"
            - "after trigger, Episode.${ep_id}.clinical_status == TRANSFERRED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # ---- Instance 1: depth>=3 — transfer -> booking TRANSFERRED -> TRANSFER_FEE charge -> balance
      - name: tc_transfer_booking_charge_balance_depth3
        grounds:
          - state_machines.Episode.transitions.ACTIVE_to_TRANSFERRED
          - state_machines.Booking.transitions.IN_USE_to_TRANSFERRED
          - calculations.episode_balance_due
          - entities.Episode.fields.balance_due_cents
        distinguishing_aspect: |
          Depth-3 chain from a single transfer: (A) Episode.transfer flips the episode; (B) that
          flips the episode's IN_USE Booking to TRANSFERRED; (C) the Booking transition itself
          creates a TRANSFER_FEE Charge (75000); (D) that new charge re-derives
          Episode.balance_due_cents from 160000 to 235000. Each link is caused by the prior link.
        test_recipe:
          setup:
            - "Standard kit+package+client+episode (balance 160000); episode ACTIVE."
            - "Room R1 booked, confirmed, checked-in (IN_USE)."
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 5 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${client_id}", package_code: "PKG_BIRTH", edd: "2026-08-01" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id }
            - call: "POST /birth-center/episodes/${ep_id}/activate"
              payload: {}
              as: Midwife
            - call: "POST /birth-center/rooms"
              payload: { name: "Garden Suite", turnover_minutes: 0 }
              as: CenterAdmin
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /birth-center/bookings"
              payload: { episode_id: "${ep_id}", room_id: "${room_id}", starts_at: "2026-01-02T00:00:00Z", ends_at: "2026-01-03T00:00:00Z", expected_room_version: "${room_v}" }
              as: CenterAdmin
              captures: { bk_id: $.data.id }
            - call: "POST /birth-center/bookings/${bk_id}/confirm"
              payload: {}
              as: CenterAdmin
            - call: "POST /birth-center/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-02T01:00:00Z" }
              as: CenterAdmin
            - call: "POST /birth-center/bookings/${bk_id}/check-in"
              payload: {}
              as: CenterAdmin
          trigger:
            - call: "POST /birth-center/episodes/${ep_id}/transfer"
              payload: {}
              as: Midwife
          assert:
            - "before trigger, Episode.${ep_id}.balance_due_cents == 160000"
            - "after trigger, Booking.${bk_id}.status == TRANSFERRED"
            - "after trigger, a TRANSFER_FEE Charge of amount_cents==75000 exists on the episode"
            - "after trigger, Episode.${ep_id}.balance_due_cents == 235000"

      # ---- Instance 2: depth>=2 — plan payoff -> episode SETTLED -> BILLED charges PAID
      - name: tc_payment_settles_episode_charges_depth2
        grounds:
          - state_machines.PaymentPlan.transitions.OPEN_to_PAID_OFF
          - state_machines.Episode.transitions.PLAN_ACTIVE_to_SETTLED
          - entities.Charge.fields.status
        distinguishing_aspect: |
          Depth-2 chain from a single payment: (A) the final payment drives the PaymentPlan to
          PAID_OFF; (B) that PAID_OFF flips the episode financial_status PLAN_ACTIVE->SETTLED,
          which itself marks every BILLED Charge on the episode to PAID. Triggered by a payment,
          NOT by the transfer trigger of instance 1.
        test_recipe:
          setup:
            - "Standard kit+package+client+episode; GLOBAL_FEE charge BILLED at responsibility 160000."
            - "PaymentPlan (1 installment) created on balance 160000, episode financial PLAN_ACTIVE."
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 5 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${client_id}", package_code: "PKG_BIRTH", edd: "2026-08-01" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id }
            - call: "GET /birth-center/episodes/${ep_id}/charges"
              payload: {}
              as: BillingClerk
              captures: { global_charge_id: $.data.0.id }
            - call: "POST /birth-center/charges/${global_charge_id}/bill"
              payload: {}
              as: BillingClerk
            - call: "GET /birth-center/episodes/${ep_id}"
              payload: {}
              as: BillingClerk
              captures: { ep_v: $.data.version }
            - call: "POST /birth-center/payment-plans"
              payload: { episode_id: "${ep_id}", installment_count: 1, expected_episode_version: "${ep_v}" }
              as: BillingClerk
