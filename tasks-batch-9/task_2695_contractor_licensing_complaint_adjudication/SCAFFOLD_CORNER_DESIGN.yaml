              payload: { origin: "STING" }
              as: Investigator
              as_user_id: "inv-61"
              captures: { err: $.data.error_id }
          assert:
            - "response http status == 422"
            - "${err} == ERR_INVESTIGATION_ORIGIN_MISMATCH"
            - "GET /licensing/investigations?origin=STING returns total_count == 0"

      - name: corner_second_live_application_for_the_same_classification_is_rejected
        claim_type: Violation → Error
        grounds:
