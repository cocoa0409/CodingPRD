  # ===========================================================================
  # RULE 5 — priority_pair_validation_conflict
  # Three instances, each pitting a DIFFERENT pair of validation CATEGORIES
  # against each other, so no two instances share an error pair:
  #   5a: PAIR A  state (25, 409) beats business_temporal (62, 422)
  #   5b: PAIR C  business_referential (42, 422) beats business_constraint (54, 409)
  #   5c: state (33, 409) beats business_safety (34, 422)
  # In every case the LOWER priority number wins even though the request also
  # violates the other rule, and the losing rule carries the other HTTP status,
  # so a wrong ordering is visible in the status code alone.
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: pair_a_result_state_409_outranks_expired_submission_window_422_rejected
        grounds:
          - validations[priority=25]
          - validations[priority=62]
          - validations[priority=51]
          - entities.Match.fields.result_status
          - entities.Section.fields.scorecard_submission_window_hours
        distinguishing_aspect: |
          A second scorecard submitted at 2026-08-18T00:00:00Z violates three rules at once —
          priority 25 (result_status is REPORTED, not PENDING, 409), priority 51 (a SUBMITTED
          scorecard is already open, 409) and priority 62 (the 48h window closed at
          2026-08-17T21:00:00Z, 422) — and the response must be exactly 409
          ERR_MATCH_RESULT_STATE_INVALID; an implementation that evaluates temporal windows
          first answers 422 ERR_SCORECARD_WINDOW_EXPIRED and one that dedupes scorecards first
          answers 409 ERR_SCORECARD_ALREADY_OPEN.
        test_recipe:
          setup:
            - "Section SOCAL-2026 with the default scorecard_submission_window_hours 48; SECTION league, two six-player 4.0 rosters, both teams IN_PLAY."
            - "Match M1 scheduled 2026-08-15T18:00:00Z (duration 180 -> scheduled_end_at 2026-08-15T21:00:00Z), confirmed, marked PLAYED at 2026-08-15T21:00:00Z."
            - "The home captain h1 submitted a scorecard, so Match.result_status == REPORTED and Scorecard sc1 is SUBMITTED. No review happens, so the result stays REPORTED."
            - "The clock is then moved to 2026-08-18T00:00:00Z, which is 3 hours past the submission deadline scheduled_end_at + 48h == 2026-08-17T21:00:00Z."
            - "The away captain a1 now attempts a fresh submission for the same match, tripping priorities 25, 51 and 62 in one request."
          setup_api_calls:
            - { call: "POST /tennis/sections", payload: { code: "SOCAL-2026", name: "Southern California", season_year: 2026, min_matches_for_playoff_eligibility: 1 }, as: SectionAdmin, captures: { sec: $.data.id } }
            - { call: "POST /tennis/facilities", payload: { section_id: "${sec}", name: "Balboa Courts", court_count: 3, turnaround_buffer_minutes: 30 }, as: SectionAdmin, captures: { fac: $.data.id } }
            - { call: "POST /tennis/leagues", payload: { section_id: "${sec}", tier: "SECTION", ntrp_level: 4.0, age_group: "AGE_18_OVER", format: "MENS_DOUBLES", lines_per_match: 3, min_active_roster_size: 6, max_teams: 8, match_duration_minutes: 180, registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-08T00:00:00Z", roster_lock_at: "2026-08-08T00:00:00Z", season_end_at: "2026-10-31T00:00:00Z" }, as: SectionAdmin, captures: { lg: $.data.id } }
            - { call: "POST /tennis/leagues/${lg}/open-registration", payload: {}, as: SectionAdmin }
            - { call: "POST /tennis/players", payload: { section_id: "${sec}", full_name: "H1 Alvarez", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { ph1: $.data.id } }
            - { call: "POST /tennis/players", payload: { section_id: "${sec}", full_name: "H2 Boyd", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { ph2: $.data.id } }
            - { call: "POST /tennis/players", payload: { section_id: "${sec}", full_name: "H3 Cortez", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { ph3: $.data.id } }
            - { call: "POST /tennis/players", payload: { section_id: "${sec}", full_name: "H4 Diallo", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { ph4: $.data.id } }
            - { call: "POST /tennis/players", payload: { section_id: "${sec}", full_name: "H5 Eng", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { ph5: $.data.id } }
            - { call: "POST /tennis/players", payload: { section_id: "${sec}", full_name: "H6 Fournier", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { ph6: $.data.id } }
            - { call: "POST /tennis/players", payload: { section_id: "${sec}", full_name: "A1 Garza", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { pa1: $.data.id } }
