              captures: { a_l: $.data.id }
            - call: "POST /bpp/assets/${a_l}/classify"
              payload: { taxable_classification: "TAXABLE" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/renditions"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_l}", tax_year: 2027 }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { r_l: $.data.id }
            - call: "POST /bpp/renditions/${r_l}/generate-lines"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/renditions/${r_l}/file"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/renditions/${r_l}/assessment-notices"
              payload: { notice_value_cents: 800000, received_date: "2027-05-01", protest_deadline_date: "2027-05-31" }
              as: AssessorClerk
              captures: { n_l: $.data.id }
            - call: "POST /bpp/assessment-notices/${n_l}/accept"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/assessment-notices/${n_l}/tax-bills"
              payload: { billed_amount_cents: 20000, tax_rate: 0.025, due_date: "2027-06-30" }
