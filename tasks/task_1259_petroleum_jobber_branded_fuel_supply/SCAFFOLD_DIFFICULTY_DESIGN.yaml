  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: drop_requires_active_agreement
        grounds:
          - validations[priority=6]
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
          - state_machines.SupplyAgreement
        distinguishing_aspect: |
          Entity pair TransportDrop -> SupplyAgreement: a drop cannot be
          created while the station's only agreement is DRAFT; activating the
          agreement (changing a DIFFERENT entity's state) unblocks the same
          request.
        test_recipe:
          setup:
            - "ACTIVE station; agreement exists but stays DRAFT; POSTED price; tank; truck"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { product_code: "REGULAR_87", display_name: "Regular 87", category: "GASOLINE", federal_excise_tc_per_gal: 184, temp_coeff: 0.00065 }
              as: JobberAdmin
              captures: { p_gas: $.data.id }
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-XDep", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 200, credit_limit_cents: 100000000 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/dealer-stations/${s_id}/activate"
              as: JobberAdmin
            - call: "POST /api/supply-agreements"
              payload: { station_id: "${s_id}", term_start_date: "2026-01-01", term_end_date: "2026-12-31", committed_gallons: 100000, imaging_allowance_cents: 100000, margin_tc_per_gal: 25, shortfall_penalty_tc_per_gal: 20, buyout_method: "LOST_MARGIN" }
              as: JobberAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/rack-price-postings"
              payload: { terminal_code: "TX-NORTH", product_id: "${p_gas}", effective_date: "2026-05-01", price_tc_per_gal: 2000 }
              as: PricingDesk
              captures: { pp_id: $.data.id }
            - call: "POST /api/rack-price-postings/${pp_id}/post"
              as: PricingDesk
            - call: "POST /api/storage-tanks"
              payload: { station_id: "${s_id}", product_id: "${p_gas}", capacity_gallons: 20000, opening_physical_gallons: 0 }
              as: JobberAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/trucks"
              payload: { truck_code: "TRK-1", capacity_gallons: 12000 }
              as: JobberAdmin
              captures: { tr_id: $.data.id }
          trigger:
            - call: "POST /api/transport-drops"
              payload: { station_id: "${s_id}", tank_id: "${t_id}", truck_id: "${tr_id}", product_id: "${p_gas}", planned_gallons: 1000, window_start: "2026-05-02T08:00:00Z", window_end: "2026-05-02T12:00:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
            - call: "POST /api/supply-agreements/${a_id}/activate"
              as: JobberAdmin
            - call: "POST /api/transport-drops"
              payload: { station_id: "${s_id}", tank_id: "${t_id}", truck_id: "${tr_id}", product_id: "${p_gas}", planned_gallons: 1000, window_start: "2026-05-02T08:00:00Z", window_end: "2026-05-02T12:00:00Z" }
              as: Dispatcher
              captures: { d_id: $.data.id }
          assert:
            - "First create fails: error_id == ERR_AGREEMENT_NOT_ACTIVE (409)"
            - "After agreement activation the identical create succeeds (201) and returns a drop id"

      - name: recon_resolve_requires_loss_written_off
        grounds:
          - state_machines.InventoryReconciliation.OPEN_to_RESOLVED
          - errors[ERR_LINKED_LOSS_NOT_WRITTEN_OFF]
        distinguishing_aspect: |
          Entity pair InventoryReconciliation -> LossEvent (different pair than
          Drop->Agreement): resolve is blocked while the auto-generated linked
          LossEvent is REPORTED, and succeeds only after that LossEvent reaches
          WRITTEN_OFF (with segregation of duties: resolver != opener).
        test_recipe:
          setup:
            - "Cascade setup as in reconcile_flags_recon_spawns_loss: reconciliation VARIANCE_FLAGGED with a linked auto LossEvent in REPORTED; opener was ops-alice"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { product_code: "REGULAR_87", display_name: "Regular 87", category: "GASOLINE", federal_excise_tc_per_gal: 184, temp_coeff: 0.00065 }
              as: JobberAdmin
              captures: { p_gas: $.data.id }
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-XRecon", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 200, credit_limit_cents: 100000000 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/dealer-stations/${s_id}/activate"
              as: JobberAdmin
            - call: "POST /api/supply-agreements"
              payload: { station_id: "${s_id}", term_start_date: "2026-01-01", term_end_date: "2026-12-31", committed_gallons: 100000, imaging_allowance_cents: 100000, margin_tc_per_gal: 25, shortfall_penalty_tc_per_gal: 20, buyout_method: "LOST_MARGIN" }
              as: JobberAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/supply-agreements/${a_id}/activate"
              as: JobberAdmin
            - call: "POST /api/rack-price-postings"
              payload: { terminal_code: "TX-NORTH", product_id: "${p_gas}", effective_date: "2026-05-01", price_tc_per_gal: 2000 }
              as: PricingDesk
              captures: { pp_id: $.data.id }
            - call: "POST /api/rack-price-postings/${pp_id}/post"
              as: PricingDesk
            - call: "POST /api/storage-tanks"
              payload: { station_id: "${s_id}", product_id: "${p_gas}", capacity_gallons: 20000, opening_physical_gallons: 10000 }
              as: JobberAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/storage-tanks/${t_id}/gauge"
              payload: { reading_gallons: 10000, observed_temp_f: 60 }
              as: DealerOperator
              as_user_id: "${s_id}"
            - call: "POST /api/inventory-reconciliations"
              payload: { station_id: "${s_id}", period_start: "2026-05-01", period_end: "2026-05-31" }
              as: JobberAdmin
              as_user_id: "ops-alice"
              captures: { rec_id: $.data.id }
            - call: "POST /api/trucks"
              payload: { truck_code: "TRK-1", capacity_gallons: 12000 }
              as: JobberAdmin
              captures: { tr_id: $.data.id }
            - call: "POST /api/transport-drops"
              payload: { station_id: "${s_id}", tank_id: "${t_id}", truck_id: "${tr_id}", product_id: "${p_gas}", planned_gallons: 5000, window_start: "2026-05-02T08:00:00Z", window_end: "2026-05-02T12:00:00Z" }
              as: Dispatcher
              captures: { d_id: $.data.id }
            - call: "POST /api/transport-drops/${d_id}/schedule"
              as: Dispatcher
            - call: "POST /api/transport-drops/${d_id}/dispatch"
              as: Dispatcher
            - call: "POST /api/transport-drops/${d_id}/deliver"
              payload: { delivered_gallons: 5000 }
              as: Dispatcher
            - call: "POST /api/transport-drops/${d_id}/reconcile"
              as: Dispatcher
            - call: "GET /api/loss-events"
              payload: { reconciliation_id: "${rec_id}" }
              as: JobberAdmin
              captures: { loss_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/inventory-reconciliations/${rec_id}/resolve"
              payload: { resolution_note: "premature" }
              as: JobberAdmin
              as_user_id: "ops-bob"
              captures: { err: $.data.error_id }
            - call: "POST /api/loss-events/${loss_id}/verify"
              as: JobberAdmin
            - call: "POST /api/loss-events/${loss_id}/write-off"
              as: JobberAdmin
            - call: "POST /api/inventory-reconciliations/${rec_id}/resolve"
              payload: { resolution_note: "shrinkage written off" }
              as: JobberAdmin
              as_user_id: "ops-bob"
              captures: { st: $.data.status, resolver: $.data.resolver_user_id }
          assert:
            - "First resolve fails: error_id == ERR_LINKED_LOSS_NOT_WRITTEN_OFF (409) while linked loss is REPORTED"
            - "After verify + write-off, resolve succeeds: status == RESOLVED, resolver_user_id == ops-bob"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: truck_half_open_adjacency
        grounds:
          - validations[priority=8]
          - errors[ERR_TRUCK_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Half-open interval semantics on the Truck resource: windows
          [08:00,12:00) and [12:00,16:00) touch but do NOT overlap (adjacency
          allowed), while [11:00,13:00) intersects and is rejected. Different
          tanks isolate the truck rule.
        test_recipe:
          setup:
            - "Full fixture with THREE tanks (t1, t2, t3) and one truck TRK-1"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { product_code: "REGULAR_87", display_name: "Regular 87", category: "GASOLINE", federal_excise_tc_per_gal: 184, temp_coeff: 0.00065 }
              as: JobberAdmin
              captures: { p_gas: $.data.id }
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-Trk", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 200, credit_limit_cents: 100000000 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/dealer-stations/${s_id}/activate"
              as: JobberAdmin
            - call: "POST /api/supply-agreements"
              payload: { station_id: "${s_id}", term_start_date: "2026-01-01", term_end_date: "2026-12-31", committed_gallons: 100000, imaging_allowance_cents: 100000, margin_tc_per_gal: 25, shortfall_penalty_tc_per_gal: 20, buyout_method: "LOST_MARGIN" }
              as: JobberAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/supply-agreements/${a_id}/activate"
              as: JobberAdmin
            - call: "POST /api/rack-price-postings"
              payload: { terminal_code: "TX-NORTH", product_id: "${p_gas}", effective_date: "2026-05-01", price_tc_per_gal: 2000 }
              as: PricingDesk
              captures: { pp_id: $.data.id }
            - call: "POST /api/rack-price-postings/${pp_id}/post"
              as: PricingDesk
            - call: "POST /api/storage-tanks"
              payload: { station_id: "${s_id}", product_id: "${p_gas}", capacity_gallons: 20000, opening_physical_gallons: 0 }
              as: JobberAdmin
              captures: { t1: $.data.id }
            - call: "POST /api/storage-tanks"
              payload: { station_id: "${s_id}", product_id: "${p_gas}", capacity_gallons: 20000, opening_physical_gallons: 0 }
              as: JobberAdmin
              captures: { t2: $.data.id }
            - call: "POST /api/storage-tanks"
              payload: { station_id: "${s_id}", product_id: "${p_gas}", capacity_gallons: 20000, opening_physical_gallons: 0 }
              as: JobberAdmin
              captures: { t3: $.data.id }
            - call: "POST /api/trucks"
              payload: { truck_code: "TRK-1", capacity_gallons: 12000 }
              as: JobberAdmin
              captures: { tr_id: $.data.id }
            - call: "POST /api/transport-drops"
              payload: { station_id: "${s_id}", tank_id: "${t1}", truck_id: "${tr_id}", product_id: "${p_gas}", planned_gallons: 100, window_start: "2026-06-10T08:00:00Z", window_end: "2026-06-10T12:00:00Z" }
              as: Dispatcher
          trigger:
            - call: "POST /api/transport-drops"
              payload: { station_id: "${s_id}", tank_id: "${t2}", truck_id: "${tr_id}", product_id: "${p_gas}", planned_gallons: 100, window_start: "2026-06-10T12:00:00Z", window_end: "2026-06-10T16:00:00Z" }
              as: Dispatcher
              captures: { d2: $.data.id }
            - call: "POST /api/transport-drops"
              payload: { station_id: "${s_id}", tank_id: "${t3}", truck_id: "${tr_id}", product_id: "${p_gas}", planned_gallons: 100, window_start: "2026-06-10T11:00:00Z", window_end: "2026-06-10T13:00:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent drop (start == prior end) succeeds (201) — half-open [start, end) semantics"
            - "Overlapping drop (11:00-13:00) fails: error_id == ERR_TRUCK_WINDOW_CONFLICT (409)"

      - name: tank_settle_buffer
        grounds:
          - validations[priority=8]
          - errors[ERR_TANK_SETTLE_WINDOW]
        distinguishing_aspect: |
          Different interval semantics AND different resource than the truck
          rule: same-tank drops require a >= 4h settle buffer between earlier
          end and later start — adjacency (0h) and a 3h gap are rejected, while
          exactly 4h is accepted (boundary inclusive). Distinct trucks isolate
          the tank rule.
        test_recipe:
          setup:
            - "Full fixture with ONE tank and THREE trucks"
          setup_api_calls:
