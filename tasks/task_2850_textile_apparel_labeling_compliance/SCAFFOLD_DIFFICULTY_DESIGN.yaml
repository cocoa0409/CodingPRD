  - rule_id: cross_entity_state_dependency
    instances:
      - name: approval_is_gated_by_lab_test_style_and_brand_states_it_does_not_own
        grounds:
          - validations[priority=55]
          - validations[priority=92]
          - state_machines[entity=Style, dimension=substantiation_state]
          - calculations.brand_posture
          - errors.ERR_FIBER_NOT_SUBSTANTIATED
          - errors.ERR_BRAND_POSTURE_RESTRICTED
        distinguishing_aspect: |
          The LabelSpec row never changes across three approve attempts, yet the answer changes twice because the gate reads other entities: while a re-verification LabTest sits in BENCH_RESERVED the style is FIBER_TEST_PENDING and approval is ERR_FIBER_NOT_SUBSTANTIATED, once it passes the same call is blocked by ERR_BRAND_POSTURE_RESTRICTED because a sibling audit has reached 3 critical findings, and only after one of those findings is verified away does the identical request succeed.
        test_recipe:
          setup:
            - "Market US is registered; brand Northline Apparel Co owns style S1 (WOVEN_OUTERWEAR) with an ISSUED determination naming VN, PASSED fiber evidence at 57.0/40.0/3.0 and PASSED care evidence with legibility_cycles 40."
            - "Permanent label L1 (rating 40, wash_temp_c 30) is authored by user-spec-1 and submitted, so it is in PENDING_APPROVAL and stays there for the whole instance."
            - "Audit A1 over the same brand carries three CRITICAL findings, so the brand posture is RESTRICTED."
            - "A re-verification FIBER_CONTENT LabTest T2 is reserved on a later bench interval and left without results."
          setup_api_calls:
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
