              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { o2_prod: $.data.production_status }
            - call: "GET /freight-loads/${fl_id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { t3_cnt: $.data.order_count, t3_w: $.data.assigned_weight_kg, t3_c: $.data.assigned_cube_m3, t3_util: $.data.cube_utilization_pct, t3_lh: $.data.linehaul_cost_cents }
            - call: "GET /dealer-orders/${o3_id}"
