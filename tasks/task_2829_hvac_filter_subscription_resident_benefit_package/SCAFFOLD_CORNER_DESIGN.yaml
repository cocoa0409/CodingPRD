      - name: selector_eligibility_predicate_and_created_at_tie_break
        claim_type: selector_policy
        grounds: [calculations.sku_selection, complexity_profile.complexity_layers]
        distinguishing_aspect: "This exercises the ELIGIBILITY half of the selector rather than its ranking: the per-resident MERV floor removes otherwise-cheapest candidates from the pool entirely, the per-unit pack_quantity slack is inclusive at exactly filter_slot_count + 2, and when merv_rating and unit_cost_cents both tie the winner is decided by created_at and never by id."
        test_recipe:
          setup:
            - "Five ACTIVE SKUs in size 16x25x1 are created in this order: S1 merv 8 / 700 / pack 1, S2 merv 8 / 700 / pack 1 (an exact rank tie with S1 created later), S3 merv 8 / 300 / pack 5, S4 merv 11 / 900 / pack 1, S5 merv 13 / 500 / pack 1."
            - "Unit A-101 has filter_slot_count 2, so the pack slack admits pack_quantity <= 4 and excludes S3; unit A-301 has filter_slot_count 3, so the slack admits pack_quantity <= 5 and S3 becomes eligible at the exact boundary."
            - "Resident X and Resident Z have allergy_flag false (MERV floor 8); Resident Y has allergy_flag true (MERV floor 11), which removes S1, S2 and S3 from her pool altogether."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /filter-skus"
              payload: { sku_code: "SKU-S1", size_code: "16x25x1", thickness_inches: 1, merv_rating: 8, unit_cost_cents: 700, ship_weight_oz: 14, pack_quantity: 1 }
              as: ProgramOperator
              captures: { s1_id: "$.data.id" }
            - call: "POST /filter-skus"
              payload: { sku_code: "SKU-S2", size_code: "16x25x1", thickness_inches: 1, merv_rating: 8, unit_cost_cents: 700, ship_weight_oz: 14, pack_quantity: 1 }
              as: ProgramOperator
              captures: { s2_id: "$.data.id" }
            - call: "POST /filter-skus"
              payload: { sku_code: "SKU-S3", size_code: "16x25x1", thickness_inches: 1, merv_rating: 8, unit_cost_cents: 300, ship_weight_oz: 40, pack_quantity: 5 }
              as: ProgramOperator
              captures: { s3_id: "$.data.id" }
            - call: "POST /filter-skus"
              payload: { sku_code: "SKU-S4", size_code: "16x25x1", thickness_inches: 1, merv_rating: 11, unit_cost_cents: 900, ship_weight_oz: 15, pack_quantity: 1 }
              as: ProgramOperator
              captures: { s4_id: "$.data.id" }
            - call: "POST /filter-skus"
              payload: { sku_code: "SKU-S5", size_code: "16x25x1", thickness_inches: 1, merv_rating: 13, unit_cost_cents: 500, ship_weight_oz: 16, pack_quantity: 1 }
              as: ProgramOperator
              captures: { s5_id: "$.data.id" }
            - call: "POST /properties"
              payload: { name: "Cedar Ridge", state_code: "TX", billing_mode: "PM_BILLED", benefit_tier: "PLUS", damage_waiver_enabled: true, aqg_enabled: true, credit_limit_cents: 5000000 }
              as: ProgramOperator
              captures: { prop_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/units"
              payload: { unit_label: "A-101", hvac_system_type: "TWO_STAGE", filter_slot_count: 2, return_grille_count: 1, nominal_size_code: "16x25x1" }
              as: ProgramOperator
              captures: { unit_a_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /properties/${prop_id}/units"
              payload: { unit_label: "A-201", hvac_system_type: "TWO_STAGE", filter_slot_count: 2, return_grille_count: 1, nominal_size_code: "16x25x1" }
              as: ProgramOperator
              captures: { unit_b_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/units"
              payload: { unit_label: "A-301", hvac_system_type: "TWO_STAGE", filter_slot_count: 3, return_grille_count: 1, nominal_size_code: "16x25x1" }
              as: ProgramOperator
              captures: { unit_c_id: "$.data.id" }
            - call: "POST /residents"
              payload: { full_name: "Ada Reyes", email: "ada.reyes@example.com", household_size: 3, has_pets: false, smoker: false, allergy_flag: false }
              as: ProgramOperator
              captures: { res_x_id: "$.data.id" }
            - call: "POST /residents"
              payload: { full_name: "Yara Nkemdi", email: "yara.nkemdi@example.com", household_size: 3, has_pets: false, smoker: false, allergy_flag: true }
              as: ProgramOperator
              captures: { res_y_id: "$.data.id" }
            - call: "POST /residents"
              payload: { full_name: "Zane Ortiz", email: "zane.ortiz@example.com", household_size: 3, has_pets: false, smoker: false, allergy_flag: false }
              as: ProgramOperator
              captures: { res_z_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramOperator
          trigger:
            - call: "POST /subscriptions"
              payload: { resident_id: "${res_x_id}", unit_id: "${unit_a_id}", billing_party: "PROPERTY_MANAGER", enrollment_channel: "MOVE_IN_PACKET", lease_start_date: "2026-08-01", lease_end_date: "2027-07-31" }
              as: ProgramOperator
              captures: { sub_x_id: "$.data.id", sku_x: "$.data.assigned_sku_id" }
            - call: "POST /subscriptions"
              payload: { resident_id: "${res_y_id}", unit_id: "${unit_b_id}", billing_party: "PROPERTY_MANAGER", enrollment_channel: "MOVE_IN_PACKET", lease_start_date: "2026-08-01", lease_end_date: "2027-07-31" }
              as: ProgramOperator
              captures: { sub_y_id: "$.data.id", sku_y: "$.data.assigned_sku_id" }
            - call: "POST /subscriptions"
              payload: { resident_id: "${res_z_id}", unit_id: "${unit_c_id}", billing_party: "PROPERTY_MANAGER", enrollment_channel: "MOVE_IN_PACKET", lease_start_date: "2026-08-01", lease_end_date: "2027-07-31" }
              as: ProgramOperator
              captures: { sub_z_id: "$.data.id", sku_z: "$.data.assigned_sku_id" }
          assert:
            - "${sku_x} == ${s1_id}: S3 is filtered out because pack_quantity 5 > 2 + 2, leaving S1, S2, S4, S5; S1 and S2 tie on (8, 700) and created_at ASC picks the earlier row S1"
            - "${sku_x} is NOT ${s2_id} — the tie-break is creation order, not id ordering or last-write-wins"
            - "${sku_y} == ${s4_id}: the allergy MERV floor of 11 empties S1, S2 and S3 from the pool, so the cheaper-but-higher-merv S5 loses to S4 on merv_rating ASC"
            - "${sku_z} == ${s3_id}: with filter_slot_count 3 the slack admits pack_quantity exactly 5, S3 re-enters the pool and wins on unit_cost_cents 300"
            - "all three subscriptions are created with HTTP 201, so no branch of the selector fell through to ERR_NO_ELIGIBLE_SKU"

      - name: cascade_chain_verified_end_to_end_from_case_confirmation
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers, state_machines.NonInstallCase]
        distinguishing_aspect: "A single confirm must propagate through posture, entitlements, waiver-reversal ledger rows and the property rollup without any intermediate step being skipped."
        excluded_because:
          difficulty_instance: "transitive_cascade / cascade_a_case_confirm_reaches_property_balance_five_links_deep"
          rationale: "The difficulty instance already walks all five links of that chain in one recipe and pins the exact cents at every hop, including the ordering requirement that the entitlement forfeiture precede the ledger reversal. A breadth-level repetition would assert a strict subset of the same values."

      - name: both_settlement_variants_produce_their_own_number
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers, calculations.claim_settlement_amount]
        distinguishing_aspect: "The provisional and final variants must be computed independently and stored in separate fields, with the delta on the switch traceable to the non-install haircut."
        excluded_because:
          difficulty_instance: "dual_variant_calc / claim_settlement_provisional_at_triage_vs_final_at_decision_diverge"
          rationale: "The difficulty instance triages while the posture is COMPLIANT, flips it to NON_INSTALL_SUSPECTED and then decides, asserting both provisional_amount_cents and approved_amount_cents plus their delta on the same Claim row. Testing the layer separately would reproduce that recipe verbatim."

  - section: consistency_model
    instances:

      - name: every_derived_field_is_current_in_the_same_response
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, calculations.property_ledger_rollup, state_machines.Claim.APPROVED_to_PAID]
        distinguishing_aspect: "There is no lag and no reconciliation pass: the very first read after a money-moving write already shows the recomputed rollup, a repeated read returns the identical value rather than converging toward it, and a refused write leaves the rollup untouched instead of leaving it half-applied."
        test_recipe:
          setup:
            - "Fixture A activated 2026-08-05: Property.outstanding_balance_cents == 5588 == 2500 + 3088."
            - "A DAMAGE_WAIVER claim requesting 40000 is triaged by adj-001 and approved by adj-002 at 30000, while the posture stays COMPLIANT so no haircut applies."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /filter-skus"
              payload: { sku_code: "SKU-16251-M8", size_code: "16x25x1", thickness_inches: 1, merv_rating: 8, unit_cost_cents: 680, ship_weight_oz: 14, pack_quantity: 1 }
              as: ProgramOperator
              captures: { sku_m8_id: "$.data.id" }
            - call: "POST /properties"
              payload: { name: "Cedar Ridge", state_code: "TX", billing_mode: "PM_BILLED", benefit_tier: "PLUS", damage_waiver_enabled: true, aqg_enabled: true, credit_limit_cents: 5000000 }
              as: ProgramOperator
              captures: { prop_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/units"
              payload: { unit_label: "A-101", hvac_system_type: "TWO_STAGE", filter_slot_count: 2, return_grille_count: 1, nominal_size_code: "16x25x1" }
              as: ProgramOperator
              captures: { unit_a_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /residents"
              payload: { full_name: "Ada Reyes", email: "ada.reyes@example.com", household_size: 3, has_pets: false, smoker: false, allergy_flag: false }
              as: ProgramOperator
              captures: { res_a_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /subscriptions"
              payload: { resident_id: "${res_a_id}", unit_id: "${unit_a_id}", billing_party: "PROPERTY_MANAGER", enrollment_channel: "MOVE_IN_PACKET", lease_start_date: "2026-08-01", lease_end_date: "2027-07-31" }
              as: ProgramOperator
              captures: { sub_a_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_a_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /claims"
              payload: { subscription_id: "${sub_a_id}", claim_type: "DAMAGE_WAIVER", incident_date: "2026-08-05", requested_amount_cents: 40000, description: "Blower housing destroyed" }
              as: ProgramOperator
              captures: { claim_id: "$.data.id" }
            - call: "POST /claims/${claim_id}/triage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
            - call: "POST /claims/${claim_id}/decide"
              payload: { decision: "APPROVE", decision_note: "Covered in full above the deductible" }
              as: ClaimsAdjuster
              as_user_id: "adj-002"
          trigger:
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: ProgramOperator
              captures: { bal_before: "$.data.outstanding_balance_cents" }
            - call: "POST /claims/${claim_id}/pay"
              payload: {}
              as: ProgramOperator
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: ProgramOperator
              captures: { bal_after_1: "$.data.outstanding_balance_cents" }
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: ProgramOperator
              captures: { bal_after_2: "$.data.outstanding_balance_cents" }
            - call: "POST /claims/${claim_id}/reverse-payment"
              payload: { reversal_reason: "Duplicate disbursement" }
              as: ProgramOperator
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: ProgramOperator
              captures: { bal_reversed: "$.data.outstanding_balance_cents" }
          assert:
            - "${bal_before} == 5588 and the approval alone moved no money"
            - "the pay response itself already reports status == PAID with paid_at == 2026-08-05T00:00:00Z"
            - "${bal_after_1} == -24412 == 5588 - 30000 on the FIRST read, with no retry, delay or reconciliation call in between"
            - "${bal_after_2} == ${bal_after_1} — a repeated read returns the identical value rather than converging toward it"
            - "GET /subscriptions/${sub_a_id}/ledger-entries has total_count == 3 immediately after the payout, ending with a CLAIM_PAYOUT row of -30000"
            - "${bal_reversed} == 5588 — the compensating write is equally immediate and restores the rollup exactly, with the ledger now at total_count == 4"
