  - rule_id: cross_entity_state_dependency
    instances:
      - name: listing_blocked_by_paused_channel_state
        grounds:
          - validations[priority=59]
          - errors[ERR_CHANNEL_NOT_ACTIVE]
          - entities.Channel.fields.status
          - state_machines.ResaleUnit.READY_to_LISTED
          - endpoints[POST /recommerce/resale-units/{id}/list]
        distinguishing_aspect: |
          Entity pair (ResaleUnit, Channel): a unit that is itself perfectly listable is blocked
          purely by the state of a second, unrelated entity — the channel row. Nothing about the
          unit changes between the refusal and the success; only Channel.status is toggled
          PAUSED -> ACTIVE by an administrator.
        test_recipe:
          setup:
            - "One OUTERWEAR grade B unit (msrp 50000) refurbished with zero task lines, so lifecycle_state is READY and accounting_state is CAPITALIZED."
            - "One RESALE_MARKETPLACE channel with allowed_assortment RESALE_ONLY and max_resale_price_ratio_bp 7000, created ACTIVE by default."
