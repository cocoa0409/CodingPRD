# =============================================================================
# Task 1572: Environmental Services & Room Turnover (hospital EVS department)
# Scaffold seed tables (§1.0–§1.7). Difficulty design (§1.8) and corner design
# (§1.9) live in sibling files.
# =============================================================================

scenario: |
  Environmental Services & Room Turnover (hospital EVS department): discharge notification & clean request queue, bed prioritization from placement demand, clean type (routine/isolation/terminal) & time standard, staff assignment & productivity tracking, quality audit (ATP/fluorescent marker) results, turnaround-time measurement & bed-ready notification, supply/chemical inventory, outbreak-driven enhanced cleaning protocol

domain_name: environmental-services-room-turnover
api_prefix: /evs

# =============================================================================
# Complexity Profile (§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation          # beds, staff windows, and chemicals are finite pools competed for, reserved, committed, released
  secondary_archetype: compliance_audit        # QA audits with segregation of duties, outbreak protocols, tamper-relevant ledger
  complexity_layers:
    - optimistic_concurrency                   # OCC on CleanRequest.reassign, SupplyItem.recount, CleanStandard update
    - cascading_side_effects                   # QA fail/void, mark-soiled, outbreak activation propagate 2–3 entities deep
    - selector_policy                          # pull-next-request and bed-ready matching pick from ranked candidate pools
    - rate_threshold_triggers                  # SLA breach boost, LOW stock at reorder threshold, stat eligibility at 80.00
  entity_topology: flat                        # peer entities joined by FK references; no nested URL hierarchy
  state_machine_shape: cyclic                  # CleanRequest reclean loop; Bed occupancy loop; PlacementDemand match/unmatch loop
  relationship_patterns:
    - one_to_many                              # Unit→Bed, Bed→CleanRequest, StaffMember→CleanRequest
    - cross_aggregate                          # CleanRequest pins CleanStandard; QualityAudit references CleanRequest + StaffMember
  role_model: segregation_of_duties            # the auditor of a clean must not be the technician who completed it
  consistency_model: immediate                 # every mutation is visible in the same request's response
  entity_count: 13
  state_machine_count: 8
  calculation_count: 12
  endpoint_count: 66
  error_code_count: 55
  role_count: 7

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (13 entities)
# =============================================================================
# Logical clock note: the server maintains a logical clock (see
# POST /_clock/set_current_utc in §1.5). Every server-stamped datetime below
# (created_at, started_at, completed_at, verified_at, sent_at, window stamps,
# sla_due_at bases, ops-run windows) reads the logical clock, never wall time.
entities:
  - name: Unit
    parent: null
    common_fields: true
    fields:
      - { name: unit_code, type: string, source: input, description: "Facility-unique unit code (e.g. '4W')" }
      - { name: display_name, type: string, source: input, description: "Human-readable unit name" }
      - { name: outbreak_posture, type: enum, source: computed, description: "NORMAL | OUTBREAK. OUTBREAK iff the unit has at least one OutbreakEvent with status ACTIVE; recomputed on outbreak activate/lift.", default: NORMAL }
      - { name: ops_run_index, type: integer, source: system, description: "Monotonic ops-run epoch for this unit; starts at 0; increments by 1 on each POST /evs/units/{id}/ops-runs", default: 0 }

  - name: Bed
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; unit this bed belongs to" }
      - { name: bed_code, type: string, source: input, description: "Bed label within the unit (e.g. '4W-12A')" }
      - { name: bed_kind, type: enum, source: input, description: "STANDARD | ISOLATION | ICU" }
      - { name: bed_status, type: enum, source: system, description: "VACANT_DIRTY | CLEAN_IN_PROGRESS | AWAITING_VERIFICATION | READY | OCCUPIED | OUT_OF_SERVICE; initial VACANT_DIRTY" }
      - { name: last_discharge_at, type: datetime, source: system, description: "Logical-clock time of most recent discharge; null if never occupied" }
      - { name: last_ready_at, type: datetime, source: system, description: "Logical-clock time bed last entered READY; null until first verified clean" }
      - { name: tat_total_minutes, type: integer, source: computed, description: "floor((last_ready_at - coalesce(last_discharge_at, bed.created_at))/60); null until first READY" }
      - { name: tat_clean_minutes, type: integer, source: computed, description: "floor((verified_at - first_started_at) of the VERIFIED CleanRequest that produced readiness, in minutes); null until first READY" }

  - name: PlacementDemand
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; unit needing a bed" }
      - { name: required_bed_kind, type: enum, source: input, description: "STANDARD | ISOLATION | ICU" }
      - { name: urgency_tier, type: enum, source: input, description: "STAT | URGENT | STANDARD" }
      - { name: needed_by, type: datetime, source: input, description: "Latest acceptable placement time (logical clock)" }
      - { name: status, type: enum, source: system, description: "OPEN | MATCHED | FULFILLED | EXPIRED | CANCELLED; initial OPEN" }
      - { name: priority_score, type: number, source: computed, description: "placement_demand_score; recomputed on read, on ops-run, and on any demand create/cancel/regrade/match in the unit" }
      - { name: matched_bed_id, type: string, source: system, description: "FK -> Bed.id; null unless status MATCHED" }
      - { name: fulfilled_at, type: datetime, source: system, description: "Set when the matched bed is admitted; null otherwise" }

  - name: CleanRequest
    parent: null
    common_fields: true
    fields:
      - { name: bed_id, type: string, source: input, description: "FK -> Bed.id; bed to be cleaned" }
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; denormalized copy of bed.unit_id at creation for queue filtering" }
      - { name: clean_type, type: enum, source: input, description: "ROUTINE | ISOLATION | TERMINAL" }
      - { name: status, type: enum, source: system, description: "QUEUED | ASSIGNED | IN_PROGRESS | PENDING_QA | NEEDS_RECLEAN | VERIFIED | CANCELLED; initial QUEUED" }
      - { name: priority_tier, type: enum, source: computed, description: "STAT | URGENT | STANDARD; derived from highest urgency_tier among OPEN PlacementDemands in the same unit whose required_bed_kind == bed.bed_kind; STANDARD when none" }
      - { name: priority_score, type: number, source: computed, description: "clean_request_priority_score (tier base + max contributing demand score + breach boost)" }
      - { name: sla_target_minutes, type: integer, source: computed, description: "effective_time_standard PINNED at creation (and re-pinned on outbreak upgrade); never changes otherwise" }
      - { name: sla_due_at, type: datetime, source: computed, description: "created_at + sla_target_minutes (recomputed only when sla_target_minutes is re-pinned)" }
      - { name: sla_breached, type: boolean, source: system, description: "Set true at an ops-run when now > sla_due_at and status in {QUEUED, ASSIGNED, IN_PROGRESS}; once true stays true", default: false }
      - { name: current_estimate_minutes, type: integer, source: computed, description: "effective_time_standard CURRENT variant: same formula evaluated with the clean_type's CURRENT CleanStandard row and the unit's CURRENT outbreak_posture" }
      - { name: pinned_base_minutes, type: integer, source: system, description: "CleanStandard.base_minutes captured at pin time" }
      - { name: pinned_outbreak_multiplier_bps, type: integer, source: system, description: "CleanStandard.outbreak_multiplier_bps captured at pin time" }
      - { name: pinned_with_outbreak, type: boolean, source: system, description: "Whether the outbreak multiplier applied at pin time" }
      - { name: assigned_staff_id, type: string, source: system, description: "FK -> StaffMember.id; null while QUEUED" }
      - { name: last_completed_by_staff_id, type: string, source: system, description: "FK -> StaffMember.id; technician who most recently completed this request (drives segregation-of-duties and reclean-different-technician rules)" }
      - { name: reclean_count, type: integer, source: system, description: "Number of QA failures on this request", default: 0 }
      - { name: planned_start_at, type: datetime, source: system, description: "Planned window start set at assign/reassign (defaults to assign-time clock); drives the staff double-booking check" }
      - { name: planned_end_at, type: datetime, source: computed, description: "planned_start_at + sla_target_minutes" }
      - { name: first_started_at, type: datetime, source: system, description: "Clock time of the FIRST start transition; never overwritten by recleans" }
      - { name: started_at, type: datetime, source: system, description: "Clock time of the most recent start transition" }
      - { name: completed_at, type: datetime, source: system, description: "Clock time of the most recent complete transition" }
      - { name: verified_at, type: datetime, source: system, description: "Clock time the verifying PASS audit was submitted" }
      - { name: supply_reserved, type: boolean, source: system, description: "True between start (reserve) and complete (consume) or cancel (release)", default: false }

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: employee_code, type: string, source: input, description: "Facility-unique employee code" }
      - { name: display_name, type: string, source: input, description: "Staff display name" }
      - { name: capabilities, type: array, source: input, description: "Non-empty subset of [CLEAN, AUDIT]; CLEAN required to act as EVSTechnician, AUDIT required to act as QualityAuditor" }
      - { name: certifications, type: array, source: input, description: "Subset of [ISO_CERT, TERMINAL_CERT]; ISO_CERT required for ISOLATION cleans, TERMINAL_CERT for TERMINAL cleans; ROUTINE requires none", default: [] }
      - { name: shift_status, type: enum, source: system, description: "OFF_SHIFT | ON_SHIFT | ON_BREAK; initial OFF_SHIFT" }
      - { name: active_clean_count, type: integer, source: computed, description: "count of CleanRequests with assigned_staff_id == this staff and status IN {ASSIGNED, IN_PROGRESS}" }
      - { name: completed_clean_count, type: integer, source: system, description: "Increments when a request this staff last completed becomes VERIFIED", default: 0 }
      - { name: verified_credit_total, type: number, source: system, description: "Sum of per-clean rounded credits (see productivity_score); 2 decimal places", default: 0 }
      - { name: qa_fail_count, type: integer, source: system, description: "Increments on FAIL audit of a clean this staff completed; decrements if that audit is voided", default: 0 }
      - { name: shift_seconds_today, type: integer, source: system, description: "Accumulated ON_SHIFT seconds; accrues only at break-start, break-end, and clock-out boundaries (break time excluded); open spans are NOT counted until closed", default: 0 }
      - { name: productivity_score, type: number, source: computed, description: "productivity_score rule; 0.00 when shift_seconds_today == 0" }
      - { name: stat_eligible, type: boolean, source: computed, description: "completed_clean_count == 0 OR productivity_score >= 80.00" }
      - { name: last_clock_in_at, type: datetime, source: system, description: "Start of the current ON_SHIFT span" }
      - { name: break_started_at, type: datetime, source: system, description: "Start of the current ON_BREAK span" }

  - name: QualityAudit
    parent: null
    common_fields: true
    fields:
      - { name: clean_request_id, type: string, source: input, description: "FK -> CleanRequest.id; request under audit" }
      - { name: auditor_id, type: string, source: system, description: "FK -> StaffMember.id; taken from X-User-ID of the acting QualityAuditor" }
      - { name: audit_method, type: enum, source: input, description: "ATP_SWAB | FLUORESCENT_MARKER" }
      - { name: rlu_reading, type: integer, source: input, description: "ATP relative-light-unit reading; REQUIRED iff audit_method == ATP_SWAB, FORBIDDEN otherwise (ERR_AUDIT_METHOD_FIELD_MISMATCH)" }
      - { name: marker_fraction_removed, type: number, source: input, description: "Fraction of fluorescent marker removed, 0..1 inclusive; REQUIRED iff audit_method == FLUORESCENT_MARKER, FORBIDDEN otherwise" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL per audit_result_determination" }
      - { name: threshold_used, type: number, source: computed, description: "The numeric threshold compared against (RLU threshold for ATP, 0.85 for fluorescent)" }
      - { name: audit_status, type: enum, source: system, description: "SUBMITTED | VOIDED; initial SUBMITTED" }
      - { name: created_ops_run_index, type: integer, source: system, description: "unit.ops_run_index at submission; void allowed only while it still equals the unit's current ops_run_index" }

  - name: SupplyItem
    parent: null
    common_fields: true
    fields:
      - { name: item_code, type: enum, source: input, description: "DISINFECTANT | PPE_PACK | CLOTH | SEALANT; unique per facility" }
      - { name: display_name, type: string, source: input, description: "Supply display name" }
      - { name: on_hand_quantity, type: integer, source: computed, description: "Sum of all SupplyLedgerEntry.quantity_delta for this item (ledger-derived; never set directly)" }
      - { name: reserved_quantity, type: integer, source: computed, description: "Sum of per-line BOM quantities over CleanRequests with supply_reserved == true that consume this item" }
      - { name: reorder_threshold, type: integer, source: input, description: "LOW-stock threshold; must be >= 0" }
      - { name: stock_status, type: enum, source: computed, description: "LOW iff on_hand_quantity <= reorder_threshold, else STOCKED" }

  - name: SupplyLedgerEntry
    parent: null
    common_fields: false   # append-only: id + created_at only; no update endpoint, no version
    fields:
      - { name: supply_item_id, type: string, source: system, description: "FK -> SupplyItem.id" }
      - { name: clean_request_id, type: string, source: system, description: "FK -> CleanRequest.id; set on CONSUME entries, null otherwise" }
      - { name: entry_type, type: enum, source: system, description: "RESTOCK | CONSUME | RECOUNT_ADJUSTMENT" }
      - { name: quantity_delta, type: integer, source: system, description: "Signed delta applied to on_hand_quantity (RESTOCK > 0, CONSUME < 0, RECOUNT_ADJUSTMENT signed)" }
      - { name: note, type: string, source: input, description: "Optional operator note" }

  - name: OutbreakEvent
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; affected unit" }
      - { name: pathogen_class, type: enum, source: input, description: "C_DIFF | MRSA | NOROVIRUS | OTHER" }
      - { name: declared_reason, type: string, source: input, description: "Free-text reason", default: null }
      - { name: status, type: enum, source: system, description: "DECLARED | ACTIVE | LIFTED | CANCELLED; initial DECLARED" }
      - { name: activated_at, type: datetime, source: system, description: "Set on activate" }
      - { name: lifted_at, type: datetime, source: system, description: "Set on lift" }

  - name: BedReadyNotification
    parent: null
    common_fields: true
    fields:
      - { name: bed_id, type: string, source: system, description: "FK -> Bed.id; bed that became READY" }
      - { name: demand_id, type: string, source: system, description: "FK -> PlacementDemand.id; demand the bed was matched to" }
      - { name: status, type: enum, source: system, description: "SENT | ACKNOWLEDGED | RETRACTED | EXPIRED; initial SENT" }
      - { name: sent_at, type: datetime, source: system, description: "Clock time the bed became READY and matched" }
      - { name: acknowledged_at, type: datetime, source: system, description: "Set on acknowledge or auto-acknowledge at admit" }

  - name: MaintenanceWindow
    parent: null
    common_fields: true
    fields:
      - { name: bed_id, type: string, source: input, description: "FK -> Bed.id; bed to take out of service" }
      - { name: start_at, type: datetime, source: input, description: "Window start (logical clock); must be strictly before end_at" }
      - { name: end_at, type: datetime, source: input, description: "Window end (half-open interval [start_at, end_at))" }
      - { name: reason, type: string, source: input, description: "Free-text reason", default: null }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVE | CLOSED | CANCELLED; initial SCHEDULED" }

  - name: CleanStandard
    parent: null
    common_fields: true
    fields:
      - { name: clean_type, type: enum, source: input, description: "ROUTINE | ISOLATION | TERMINAL; unique (one standard row per clean type)" }
      - { name: base_minutes, type: integer, source: input, description: "Base time standard in minutes; must be > 0" }
      - { name: outbreak_multiplier_bps, type: integer, source: input, description: "Outbreak multiplier in basis points (10000 = 1.0x); must be >= 10000" }
      - { name: atp_rlu_threshold, type: integer, source: input, description: "ATP pass threshold for this clean type: PASS iff rlu_reading <= atp_rlu_threshold; must be > 0" }

  - name: TurnaroundSnapshot
    parent: null
    common_fields: false   # computed record produced by an ops-run; append-only
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; unit the snapshot covers" }
      - { name: ops_run_index, type: integer, source: system, description: "The unit ops_run_index value BEFORE this run incremented it" }
      - { name: window_start, type: datetime, source: system, description: "Previous snapshot's window_end, or unit.created_at for the first run (inclusive)" }
      - { name: window_end, type: datetime, source: system, description: "This run's clock time (exclusive)" }
      - { name: verified_count, type: integer, source: computed, description: "CleanRequests in this unit with verified_at inside [window_start, window_end)" }
      - { name: sla_breach_count, type: integer, source: computed, description: "Of those verified-in-window requests, how many had verified_at > sla_due_at" }
      - { name: tat_total_p50_minutes, type: number, source: computed, description: "Nearest-rank p50 of tat_total_minutes over the window's verified set; null when the set is empty" }
      - { name: tat_total_p90_minutes, type: number, source: computed, description: "Nearest-rank p90 of tat_total_minutes; null when empty" }
      - { name: tat_clean_p50_minutes, type: number, source: computed, description: "Nearest-rank p50 of tat_clean_minutes; null when empty" }
      - { name: tat_clean_p90_minutes, type: number, source: computed, description: "Nearest-rank p90 of tat_clean_minutes; null when empty" }

# =============================================================================
# §1.2 State Machine Table (8 machines)
# =============================================================================
state_machines:
  - entity: Bed
    field: bed_status
    initial_state: VACANT_DIRTY
    terminal_states: []          # cyclic machine: no terminal state
    transitions:
      - from: OCCUPIED
        to: VACANT_DIRTY
        trigger: "POST /evs/beds/{bed_id}/discharge"
        actor: BedPlacementCoordinator
        preconditions:
          - "bed_status == OCCUPIED (else ERR_BED_NOT_OCCUPIED)"
        side_effects:
          - "last_discharge_at := now"
          - "Auto-create a CleanRequest for this bed: clean_type = request input clean_type if given, else ISOLATION when bed_kind == ISOLATION, else ROUTINE; FORCED to TERMINAL when unit.outbreak_posture == OUTBREAK and bed_kind == ISOLATION (enhanced protocol override beats the input value)"
          - "The new CleanRequest pins its standard per effective_time_standard"

      - from: VACANT_DIRTY
        to: CLEAN_IN_PROGRESS
        trigger: "system (linked CleanRequest transitions ASSIGNED -> IN_PROGRESS)"
        actor: system
        preconditions:
          - "The started CleanRequest has bed_id == this bed"
        side_effects: []

      - from: CLEAN_IN_PROGRESS
        to: AWAITING_VERIFICATION
        trigger: "system (linked CleanRequest transitions IN_PROGRESS -> PENDING_QA)"
        actor: system
        preconditions: []
        side_effects: []

      - from: AWAITING_VERIFICATION
        to: READY
        trigger: "system (PASS QualityAudit submitted on the linked PENDING_QA CleanRequest)"
        actor: system
        preconditions: []
        side_effects:
          - "last_ready_at := now; tat_total_minutes and tat_clean_minutes computed"
          - "Run bed_ready_match_selector: if a top-ranked OPEN PlacementDemand in this unit with required_bed_kind == bed_kind exists, set it MATCHED with matched_bed_id := this bed and create a BedReadyNotification (SENT) linking bed and demand; otherwise the bed stays READY unmatched"

      - from: AWAITING_VERIFICATION
        to: VACANT_DIRTY
        trigger: "system (FAIL QualityAudit submitted on the linked PENDING_QA CleanRequest)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Bed falls back to dirty while the SAME CleanRequest loops to NEEDS_RECLEAN; the reclean start moves it to CLEAN_IN_PROGRESS again"

      - from: VACANT_DIRTY
        to: AWAITING_VERIFICATION
        trigger: "system (compensation: the FAIL audit that dirtied the bed is voided)"
        actor: system
        preconditions:
          - "Linked CleanRequest is moving NEEDS_RECLEAN -> PENDING_QA because of the void"
        side_effects: []

      - from: READY
        to: OCCUPIED
        trigger: "POST /evs/beds/{bed_id}/admit"
        actor: BedPlacementCoordinator
        preconditions:
          - "bed_status == READY (else ERR_BED_NOT_READY)"
        side_effects:
          - "If a PlacementDemand is MATCHED to this bed: demand -> FULFILLED (fulfilled_at := now) and its BedReadyNotification -> ACKNOWLEDGED (acknowledged_at := now) if still SENT"

      - from: READY
        to: VACANT_DIRTY
        trigger: "POST /evs/beds/{bed_id}/mark-soiled"
        actor: BedPlacementCoordinator
        preconditions:
          - "bed_status == READY (else ERR_BED_NOT_READY)"
        side_effects:
          - "If a BedReadyNotification with status SENT or ACKNOWLEDGED exists for this bed: notification -> RETRACTED"
          - "That notification's PlacementDemand (if MATCHED) -> OPEN with matched_bed_id := null; priority_score recomputed"
          - "Auto-create a ROUTINE CleanRequest for this bed (pins standard at creation)"
        note: "Depth-3 cascade: bed -> notification -> demand"

      - from: [VACANT_DIRTY, READY]
        to: OUT_OF_SERVICE
        trigger: "system (MaintenanceWindow activate)"
        actor: EVSAdministrator
        preconditions:
          - "Window activation guards apply (see MaintenanceWindow transitions)"
        side_effects:
          - "If bed was READY and matched: notification -> RETRACTED, demand MATCHED -> OPEN (same cascade as mark-soiled, minus new CleanRequest)"

      - from: OUT_OF_SERVICE
        to: VACANT_DIRTY
        trigger: "system (MaintenanceWindow close)"
        actor: EVSAdministrator
        preconditions: []
        side_effects:
          - "Auto-create a ROUTINE CleanRequest for this bed (maintenance dirties the room)"

  - entity: CleanRequest
    field: status
    initial_state: QUEUED
    terminal_states: [VERIFIED, CANCELLED]
    transitions:
      - from: QUEUED
        to: ASSIGNED
        trigger: "POST /evs/clean-requests/{request_id}/assign OR POST /evs/clean-requests/pull"
        actor: "EVSDispatcher | EVSTechnician (pull, self-assign)"
        preconditions:
          - "status == QUEUED (terminal -> ERR_REQUEST_ALREADY_TERMINAL; other -> ERR_REQUEST_NOT_QUEUED)"
          - "staff certifications cover clean_type (ERR_STAFF_CERTIFICATION_MISMATCH)"
          - "priority_tier == STAT requires staff.stat_eligible == true (ERR_STAFF_NOT_STAT_ELIGIBLE)"
          - "planned window [planned_start_at, planned_start_at + sla_target_minutes) must satisfy the 10-minute buffer rule against the staff member's other ASSIGNED/IN_PROGRESS windows (ERR_STAFF_DOUBLE_BOOKED)"
        side_effects:
          - "assigned_staff_id := staff; planned_start_at := input planned_start_at or now; planned_end_at computed"
          - "staff.active_clean_count +1 (derived)"

      - from: NEEDS_RECLEAN
        to: ASSIGNED
        trigger: "POST /evs/clean-requests/{request_id}/assign"
        actor: EVSDispatcher
        preconditions:
          - "status == NEEDS_RECLEAN"
          - "All QUEUED->ASSIGNED preconditions"
          - "staff_id != last_completed_by_staff_id (ERR_RECLEAN_SAME_TECHNICIAN — second-set-of-hands rule)"
        side_effects:
          - "Same as QUEUED->ASSIGNED"

      - from: ASSIGNED
        to: QUEUED
        trigger: "POST /evs/clean-requests/{request_id}/unassign"
        actor: EVSDispatcher
        preconditions:
          - "status == ASSIGNED (else ERR_REQUEST_NOT_ASSIGNED; terminal -> ERR_REQUEST_ALREADY_TERMINAL)"
        side_effects:
          - "assigned_staff_id := null; planned window cleared; staff.active_clean_count -1 (compensation)"

      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /evs/clean-requests/{request_id}/reassign"
        actor: EVSDispatcher
        preconditions:
          - "status == ASSIGNED (else ERR_REQUEST_NOT_ASSIGNED; terminal -> ERR_REQUEST_ALREADY_TERMINAL)"
          - "expected_clean_request_version == current version (OCC, ERR_STALE_REQUEST_VERSION)"
          - "New staff certification / STAT-eligibility / window-buffer checks as in assign"
        side_effects:
          - "assigned_staff_id := new staff; planned window replaced"
          - "old staff.active_clean_count -1; new staff.active_clean_count +1"
          - "increments CleanRequest.version by 1"

      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /evs/clean-requests/{request_id}/start"
        actor: "EVSTechnician (must be the assigned staff: ERR_NOT_ASSIGNED_TECHNICIAN)"
        preconditions:
          - "status == ASSIGNED (terminal -> ERR_REQUEST_ALREADY_TERMINAL; else ERR_REQUEST_NOT_ASSIGNED)"
          - "StaffMember.shift_status == ON_SHIFT (ERR_STAFF_NOT_ON_SHIFT)"
          - "Supply availability: for every BOM line of the (possibly reclean-discounted) consumption, on_hand_quantity - reserved_quantity >= line quantity (ERR_INSUFFICIENT_SUPPLY)"
        side_effects:
          - "started_at := now; first_started_at := now if null"
          - "supply_reserved := true; reserved_quantity of each BOM SupplyItem increased"
          - "Bed VACANT_DIRTY -> CLEAN_IN_PROGRESS"

      - from: IN_PROGRESS
        to: PENDING_QA
        trigger: "POST /evs/clean-requests/{request_id}/complete"
        actor: "EVSTechnician (must be the assigned staff)"
        preconditions:
          - "status == IN_PROGRESS (terminal -> ERR_REQUEST_ALREADY_TERMINAL; else ERR_REQUEST_NOT_IN_PROGRESS)"
        side_effects:
          - "completed_at := now; last_completed_by_staff_id := assigned_staff_id"
          - "Consume supplies: supply_reserved := false; each BOM SupplyItem reserved_quantity -= line qty AND on_hand_quantity -= line qty via a CONSUME SupplyLedgerEntry (clean_request_id set); stock_status recomputed"
          - "assigned_staff_id := null; staff.active_clean_count -1"
          - "Bed CLEAN_IN_PROGRESS -> AWAITING_VERIFICATION"

      - from: PENDING_QA
        to: VERIFIED
        trigger: "system (PASS QualityAudit submitted)"
        actor: system
        preconditions: []
        side_effects:
          - "verified_at := now"
          - "Completer StaffMember: completed_clean_count +1; verified_credit_total += per_clean_credit (per productivity_score rounding); productivity_score and stat_eligible recomputed"
          - "Bed AWAITING_VERIFICATION -> READY (tat fields computed; bed_ready_match_selector runs)"

      - from: PENDING_QA
        to: NEEDS_RECLEAN
        trigger: "system (FAIL QualityAudit submitted)"
        actor: system
        preconditions: []
        side_effects:
          - "reclean_count += 1"
          - "Completer StaffMember.qa_fail_count += 1; productivity_score and stat_eligible recomputed"
          - "Bed AWAITING_VERIFICATION -> VACANT_DIRTY"

      - from: NEEDS_RECLEAN
        to: PENDING_QA
        trigger: "system (compensation: the FAIL audit that caused this state is voided)"
        actor: system
        preconditions:
          - "The voided audit is the one that caused the latest PENDING_QA -> NEEDS_RECLEAN transition"
        side_effects:
          - "Completer StaffMember.qa_fail_count -= 1; productivity_score and stat_eligible recomputed"
          - "Bed VACANT_DIRTY -> AWAITING_VERIFICATION"

      - from: [QUEUED, ASSIGNED]
        to: CANCELLED
        trigger: "POST /evs/clean-requests/{request_id}/cancel"
        actor: EVSDispatcher
        preconditions:
          - "status in {QUEUED, ASSIGNED} (IN_PROGRESS -> see below; terminal -> ERR_REQUEST_ALREADY_TERMINAL)"
        side_effects:
          - "If ASSIGNED: assigned_staff_id := null; staff.active_clean_count -1"

      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /evs/clean-requests/{request_id}/cancel (abort a started clean)"
        actor: EVSDispatcher
        preconditions:
          - "status == IN_PROGRESS"
        side_effects:
          - "Release reservation: supply_reserved := false; each BOM SupplyItem reserved_quantity -= line qty; on_hand_quantity UNCHANGED (nothing consumed)"
          - "assigned_staff_id := null; staff.active_clean_count -1"
          - "Bed CLEAN_IN_PROGRESS -> VACANT_DIRTY"

  - entity: PlacementDemand
    field: status
    initial_state: OPEN
    terminal_states: [FULFILLED, EXPIRED, CANCELLED]
    transitions:
      - from: OPEN
        to: MATCHED
        trigger: "system (bed_ready_match_selector at a bed's READY transition, or ops-run rematch)"
        actor: system
        preconditions:
          - "Candidate bed.bed_status == READY and bed.bed_kind == required_bed_kind and bed.unit_id == demand.unit_id"
        side_effects:
          - "matched_bed_id := bed; BedReadyNotification created (SENT)"

      - from: MATCHED
        to: OPEN
        trigger: "system (bed retracted via mark-soiled / maintenance activation, or notification expired at ops-run)"
        actor: system
        preconditions: []
        side_effects:
          - "matched_bed_id := null; priority_score recomputed"
        note: "Match/unmatch loop: a demand can cycle OPEN -> MATCHED -> OPEN any number of times"

      - from: MATCHED
        to: FULFILLED
        trigger: "system (matched bed admitted)"
        actor: system
        preconditions: []
        side_effects:
          - "fulfilled_at := now"

      - from: OPEN
        to: EXPIRED
        trigger: "system (ops-run: needed_by < now)"
        actor: system
        preconditions:
          - "needed_by strictly before current clock (at equality the demand stays OPEN)"
        side_effects: []

      - from: [OPEN, MATCHED]
        to: CANCELLED
        trigger: "POST /evs/placement-demands/{demand_id}/cancel"
        actor: BedPlacementCoordinator
        preconditions:
          - "status in {OPEN, MATCHED} (terminal -> ERR_DEMAND_NOT_OPEN)"
        side_effects:
          - "If MATCHED: its BedReadyNotification (SENT) -> RETRACTED; the bed stays READY unmatched"

      - from: OPEN
        to: OPEN
        trigger: "POST /evs/placement-demands/{demand_id}/regrade (urgency_tier change)"
        actor: BedPlacementCoordinator
        preconditions:
          - "status == OPEN (else ERR_DEMAND_NOT_OPEN)"
        side_effects:
          - "urgency_tier := input; priority_score recomputed; all QUEUED CleanRequests on beds of matching kind in the unit recompute priority_tier/priority_score"

  - entity: QualityAudit
    field: audit_status
    initial_state: SUBMITTED
    terminal_states: [VOIDED]   # SUBMITTED past its void window is effectively locked but remains SUBMITTED
    transitions:
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /evs/quality-audits/{audit_id}/void"
        actor: InfectionPreventionist
        preconditions:
          - "audit_status == SUBMITTED (else ERR_AUDIT_NOT_SUBMITTED)"
          - "result == FAIL and linked CleanRequest.status == NEEDS_RECLEAN (else ERR_AUDIT_NOT_VOIDABLE)"
          - "created_ops_run_index == unit.ops_run_index — no ops-run may have closed since submission (else ERR_AUDIT_VOID_WINDOW_CLOSED)"
        side_effects:
          - "Compensation cascade: CleanRequest NEEDS_RECLEAN -> PENDING_QA; Bed VACANT_DIRTY -> AWAITING_VERIFICATION; completer qa_fail_count -= 1 with productivity recompute"

  - entity: StaffMember
    field: shift_status
    initial_state: OFF_SHIFT
    terminal_states: []
    transitions:
      - from: OFF_SHIFT
        to: ON_SHIFT
        trigger: "POST /evs/staff/{staff_id}/clock-in"
        actor: "EVSTechnician | QualityAuditor (self: X-User-ID == staff_id, else ERR_STAFF_IDENTITY_MISMATCH)"
        preconditions:
          - "shift_status == OFF_SHIFT (else ERR_STAFF_NOT_ON_SHIFT-family: ERR_STAFF_ALREADY_ON_SHIFT)"
        side_effects:
          - "last_clock_in_at := now"

      - from: ON_SHIFT
        to: ON_BREAK
        trigger: "POST /evs/staff/{staff_id}/break-start"
        actor: "EVSTechnician | QualityAuditor (self)"
        preconditions:
          - "shift_status == ON_SHIFT (else ERR_STAFF_NOT_ON_SHIFT)"
          - "No IN_PROGRESS CleanRequest assigned to this staff (ERR_STAFF_HAS_ACTIVE_CLEANS)"
        side_effects:
          - "shift_seconds_today += now - last_clock_in_at; break_started_at := now"

      - from: ON_BREAK
        to: ON_SHIFT
        trigger: "POST /evs/staff/{staff_id}/break-end"
        actor: "EVSTechnician | QualityAuditor (self)"
        preconditions:
          - "shift_status == ON_BREAK (else ERR_STAFF_NOT_ON_BREAK)"
        side_effects:
          - "last_clock_in_at := now; break_started_at := null"

      - from: [ON_SHIFT, ON_BREAK]
        to: OFF_SHIFT
        trigger: "POST /evs/staff/{staff_id}/clock-out"
        actor: "EVSTechnician | QualityAuditor (self)"
        preconditions:
          - "No CleanRequest with assigned_staff_id == this staff and status IN {ASSIGNED, IN_PROGRESS} (ERR_STAFF_HAS_ACTIVE_CLEANS)"
        side_effects:
          - "If ON_SHIFT: shift_seconds_today += now - last_clock_in_at (break spans never accrue)"
          - "productivity_score and stat_eligible recomputed"

  - entity: OutbreakEvent
    field: status
    initial_state: DECLARED
    terminal_states: [LIFTED, CANCELLED]
    transitions:
      - from: DECLARED
        to: ACTIVE
        trigger: "POST /evs/outbreak-events/{event_id}/activate"
        actor: InfectionPreventionist
        preconditions:
          - "status == DECLARED (else ERR_OUTBREAK_INVALID_STATE)"
          - "No other OutbreakEvent for the same unit has status ACTIVE (ERR_OUTBREAK_ALREADY_ACTIVE)"
        side_effects:
          - "activated_at := now; unit.outbreak_posture := OUTBREAK (unit version increments)"
          - "Cascade: every CleanRequest in the unit with status IN {QUEUED, ASSIGNED} whose bed.bed_kind == ISOLATION and clean_type != TERMINAL is upgraded: clean_type := TERMINAL; standard re-pinned with outbreak (pinned_base_minutes := TERMINAL standard base, pinned_outbreak_multiplier_bps := TERMINAL standard multiplier, pinned_with_outbreak := true); sla_target_minutes and sla_due_at recomputed from the new pin (sla_due_at := created_at + new target); planned_end_at recomputed for ASSIGNED ones; each such request's version increments"

      - from: ACTIVE
        to: LIFTED
        trigger: "POST /evs/outbreak-events/{event_id}/lift"
        actor: InfectionPreventionist
        preconditions:
          - "status == ACTIVE (else ERR_OUTBREAK_INVALID_STATE)"
        side_effects:
          - "lifted_at := now"
          - "unit.outbreak_posture recomputed: OUTBREAK iff another ACTIVE outbreak exists for the unit, else NORMAL (unit version increments)"
          - "In-flight CleanRequests KEEP their pinned standards (version-pinning: no retroactive change); only future creations/pins observe NORMAL"

      - from: DECLARED
        to: CANCELLED
        trigger: "POST /evs/outbreak-events/{event_id}/cancel"
        actor: InfectionPreventionist
        preconditions:
          - "status == DECLARED (else ERR_OUTBREAK_INVALID_STATE)"
        side_effects: []

  - entity: BedReadyNotification
    field: status
    initial_state: SENT
    terminal_states: [ACKNOWLEDGED, RETRACTED, EXPIRED]
    transitions:
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /evs/bed-ready-notifications/{notification_id}/acknowledge OR system (auto-ack on admit of the matched bed)"
        actor: "BedPlacementCoordinator | system"
        preconditions:
          - "status == SENT (else ERR_NOTIFICATION_NOT_SENT)"
        side_effects:
          - "acknowledged_at := now"

      - from: SENT
        to: RETRACTED
        trigger: "system (bed left READY without admit: mark-soiled or maintenance activation; or matched demand cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "Matched PlacementDemand (if MATCHED to this bed) -> OPEN, matched_bed_id := null (demand-cancel path excepted: there the demand goes CANCELLED)"

      - from: SENT
        to: EXPIRED
        trigger: "system (ops-run: now > sent_at + 60 minutes; at exact equality the notification stays SENT)"
        actor: system
        preconditions: []
        side_effects:
          - "Matched PlacementDemand -> OPEN (matched_bed_id := null); the bed remains READY and is reconsidered by the same ops-run's rematch pass"

  - entity: MaintenanceWindow
    field: status
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /evs/maintenance-windows/{window_id}/activate"
        actor: EVSAdministrator
        preconditions:
          - "status == SCHEDULED (else ERR_WINDOW_INVALID_STATE)"
          - "bed.bed_status IN {VACANT_DIRTY, READY} (else ERR_BED_NOT_AVAILABLE_FOR_MAINTENANCE)"
          - "No CleanRequest for this bed in status {QUEUED, ASSIGNED, IN_PROGRESS, PENDING_QA, NEEDS_RECLEAN} (ERR_OPEN_REQUEST_EXISTS)"
          - "Aggregate capacity re-checked per maintenance_capacity_check with this window counted as overlapping-now (ERR_CAPACITY_EXCEEDED)"
        side_effects:
          - "bed -> OUT_OF_SERVICE (from READY: notification/demand retraction cascade fires)"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /evs/maintenance-windows/{window_id}/close"
        actor: EVSAdministrator
        preconditions:
          - "status == ACTIVE (else ERR_WINDOW_INVALID_STATE)"
        side_effects:
          - "bed OUT_OF_SERVICE -> VACANT_DIRTY; auto-create a ROUTINE CleanRequest for the bed"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /evs/maintenance-windows/{window_id}/cancel"
        actor: EVSAdministrator
        preconditions:
          - "status == SCHEDULED (else ERR_WINDOW_INVALID_STATE)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; state preconditions live in §1.2/§1.4)
# =============================================================================
concurrency_rules:
  - rule_id: clean-request-reassign-stale-version
    parent_entity: CleanRequest
    write_endpoint: "POST /evs/clean-requests/{request_id}/reassign"
    occ_field: expected_clean_request_version
    description: |
      Reassigning an ASSIGNED CleanRequest is legitimate at any time while the
      request remains ASSIGNED, so a second reassignment carries no state
      signal that another reassignment already happened. A request whose
      version has advanced since the client last read it is rejected as stale.
    error_id: ERR_STALE_REQUEST_VERSION
    http_status: 412

  - rule_id: supply-recount-stale-version
    parent_entity: SupplyItem
    write_endpoint: "POST /evs/supply-items/{item_id}/recount"
    occ_field: expected_supply_item_version
    description: |
      A recount asserts 'the physical count I observed reflects the item's
      state at version N'. Any mutation (restock, consume, another recount)
      advances the version; a recount submitted against a superseded version
      is rejected because its observation predates the latest ledger state,
      even though a recount with a fresh version would itself succeed.
    error_id: ERR_STALE_SUPPLY_VERSION
    http_status: 412

  - rule_id: clean-standard-update-stale-version
    parent_entity: CleanStandard
    write_endpoint: "PUT /evs/clean-standards/{clean_type}"
    occ_field: expected_standard_version
    description: |
      Updating a CleanStandard is a supersede-style write: any later update
      legitimately replaces the earlier values. An update carrying a version
      older than the current row version is rejected so that an operator
      editing from a stale read does not silently clobber a newer standard
      that in-flight requests may already have pinned against.
    error_id: ERR_STALE_STANDARD_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (12 rules)
# =============================================================================
# All arithmetic uses decimal math. round2(x) = round to 2 decimal places,
# round_half_up. round_int(x) = round to integer, round_half_up (so 67.5 -> 68).
calculations:
  - name: effective_time_standard
    trigger: "CleanRequest creation (PINNED variant); outbreak-activation upgrade re-pin (PINNED variant); every CleanRequest read / queue evaluation (CURRENT variant, exposed as current_estimate_minutes)"
    algorithm: threshold
    formula: |
      inputs: clean_type, pinned or current (CleanStandard.base_minutes,
              CleanStandard.outbreak_multiplier_bps, unit.outbreak_posture),
              request priority_tier
      raw = base_minutes * (outbreak_multiplier_bps / 10000) if posture == OUTBREAK at evaluation time
            else base_minutes
      target = round_int(raw)
      if priority_tier == STAT: target = min(target, STAT_CAP_MINUTES)
    constants:
      STAT_CAP_MINUTES: 45
    precision: "integer minutes, round_half_up"
    variants:
      - name: pinned
        when: "sla_target_minutes / sla_due_at — evaluated once at creation (and re-evaluated only on outbreak upgrade), using the standard row and posture AT THAT MOMENT"
        difference: "frozen forever afterwards; an outbreak declared after creation does not change it (except the ISOLATION-bed upgrade re-pin)"
      - name: current
        when: "current_estimate_minutes on every read"
        difference: "uses the CURRENT CleanStandard row (post any PUT updates) and the unit's CURRENT posture; diverges from pinned whenever the standard was edited or an outbreak was activated/lifted after pinning"

  - name: placement_demand_score
    trigger: "PlacementDemand creation, regrade, any read of the demand, ops-run recompute, and whenever a bed of the matching kind in the unit enters/leaves READY (scarcity input)"
    algorithm: weighted_scoring
    formula: |
      wait_minutes = max(0, floor((now - demand.created_at) / 60))
      score = URGENCY_BASE[urgency_tier]
            + min(wait_minutes, WAIT_CAP_MINUTES) * WAIT_WEIGHT_PER_MINUTE
            + (SCARCITY_BONUS if count(Bed in unit with bed_kind == required_bed_kind
                                        AND bed_status == READY) == 0 else 0)
      priority_score = round2(score)
    constants:
      URGENCY_BASE: { STAT: 1000, URGENT: 500, STANDARD: 100 }
      WAIT_CAP_MINUTES: 120
      WAIT_WEIGHT_PER_MINUTE: 2
      SCARCITY_BONUS: 50
    precision: "2 decimal places, round_half_up"

  - name: clean_request_priority_score
    trigger: "CleanRequest creation; PlacementDemand create/regrade/cancel/expire/match/fulfill in the same unit; ops-run; SLA breach marking"
    algorithm: aggregation
    formula: |
      contributing = PlacementDemands with unit_id == request.unit_id,
                     status == OPEN, required_bed_kind == request.bed.bed_kind
      priority_tier  = highest urgency_tier among contributing (STAT > URGENT > STANDARD);
                       STANDARD when contributing is empty
      demand_part    = max(priority_score over contributing) or 0 when empty
      priority_score = TIER_BASE[priority_tier] + demand_part
                       + (BREACH_BOOST if sla_breached else 0)
    constants:
      TIER_BASE: { STAT: 10000, URGENT: 5000, STANDARD: 0 }
      BREACH_BOOST: 2500
    precision: "2 decimal places, round_half_up"
    note: "Queue ordering for the pull selector: priority_tier rank DESC, then priority_score DESC, then sla_due_at ASC, then created_at ASC. No UUID anywhere in ordering."

  - name: turnaround_time_variants
    trigger: "Bed enters READY (PASS audit)"
    algorithm: chronological
    formula: |
      tat_total_minutes = floor((last_ready_at - coalesce(last_discharge_at, bed.created_at)) / 60 seconds)
      tat_clean_minutes = floor((verified_at - first_started_at) / 60 seconds)
                        of the VERIFIED CleanRequest that produced readiness
    precision: "integer minutes (floor)"
    variants:
      - name: tat_total
        when: "bed-side guest-flow metric"
        difference: "measures discharge (or bed creation) to ready — includes queue wait and assignment latency"
      - name: tat_clean
        when: "EVS-side execution metric"
        difference: "measures first start to verify — same ready event, numerically smaller whenever queue wait > 0"
    key_insight: "Both variants are computed from the same lifecycle events and MUST differ whenever the request waited in queue before starting."

  - name: productivity_score
    trigger: "request VERIFIED (credit accrual), FAIL audit submitted (penalty), FAIL audit voided (penalty refund), break-start / break-end / clock-out (shift-second accrual), and on read"
    algorithm: weighted_scoring
    formula: |
      Per VERIFIED request completed by this staff:
        actual_minutes = max(1, floor((completed_at - started_at) / 60))
        ef = sla_target_minutes / actual_minutes        # efficiency factor
        ef_clamped = min(EF_CAP, max(EF_FLOOR, ef))
        per_clean_credit = round2(BASE_CREDIT[clean_type] * ef_clamped)   # ROUND PER CLEAN, THEN SUM
      verified_credit_total = sum of per_clean_credit over all VERIFIED cleans
      if shift_seconds_today == 0: productivity_score = 0.00
      else:
        hours = shift_seconds_today / 3600
        productivity_score = max(0, round2(100 * verified_credit_total / hours
                                           - QA_FAIL_PENALTY * qa_fail_count))
      stat_eligible = (completed_clean_count == 0) OR (productivity_score >= STAT_ELIGIBILITY_THRESHOLD)
    constants:
      BASE_CREDIT: { ROUTINE: 1.00, ISOLATION: 1.50, TERMINAL: 2.00 }
      EF_FLOOR: 0.50
      EF_CAP: 1.50
      QA_FAIL_PENALTY: 5.00
      STAT_ELIGIBILITY_THRESHOLD: 80.00
    precision: "per-clean credit rounded to 2dp half-up BEFORE summation; final score rounded once to 2dp half-up"
    key_insight: "Rounding order is pinned: round each per-clean credit, then sum. Summing unrounded credits and rounding once yields different totals (e.g. 3 x round2(1.125) = 3.39 vs round2(3.375) = 3.38)."

  - name: audit_result_determination
    trigger: "QualityAudit submission"
    algorithm: threshold
    formula: |
      threshold_source = CleanStandard row for the request's CURRENT clean_type
      if audit_method == ATP_SWAB:
        threshold_used = threshold_source.atp_rlu_threshold
        result = PASS iff rlu_reading <= threshold_used        # boundary: exactly AT threshold PASSES
      if audit_method == FLUORESCENT_MARKER:
        threshold_used = FLUORESCENT_PASS_FRACTION
        result = PASS iff marker_fraction_removed >= FLUORESCENT_PASS_FRACTION   # boundary: exactly 0.85 PASSES
    constants:
      FLUORESCENT_PASS_FRACTION: 0.85
    note: "The two methods use OPPOSITE comparison directions (<= vs >=). The ATP threshold follows the request's current clean_type (a TERMINAL-upgraded request is audited against the TERMINAL threshold)."

  - name: supply_consumption_bom
    trigger: "CleanRequest start (reserve), complete (consume), cancel-from-IN_PROGRESS (release)"
    algorithm: waterfall_allocation
    formula: |
      BOM (full clean):  ROUTINE:  { DISINFECTANT: 2, CLOTH: 4 }
                         ISOLATION:{ DISINFECTANT: 4, PPE_PACK: 2, CLOTH: 6 }
                         TERMINAL: { DISINFECTANT: 6, PPE_PACK: 3, CLOTH: 8, SEALANT: 1 }
      If the request is in a reclean cycle (started from a state whose reclean_count > 0),
        each line quantity = round_int(full_qty * RECLEAN_CONSUMPTION_RATIO)   # round_half_up per line
      start:    for each line: require on_hand_quantity - reserved_quantity >= qty
                (ALL lines must pass; first failing line -> ERR_INSUFFICIENT_SUPPLY naming the item);
                then reserved_quantity += qty per line
      complete: reserved_quantity -= qty AND on_hand_quantity -= qty per line (CONSUME ledger entry each)
      cancel from IN_PROGRESS: reserved_quantity -= qty per line; on_hand_quantity untouched
    constants:
      RECLEAN_CONSUMPTION_RATIO: 0.5
    precision: "integer units; reclean halving rounds half-up per line (TERMINAL reclean: 3, 2, 4, 1)"

  - name: next_clean_request_selector
    trigger: "POST /evs/clean-requests/pull"
    algorithm: selector_policy
    formula: |
      eligibility filter (candidate set):
        request.status == QUEUED
        AND request clean_type covered by puller.certifications
            (ROUTINE: none; ISOLATION: ISO_CERT; TERMINAL: TERMINAL_CERT)
        AND NOT (priority_tier == STAT AND puller.stat_eligible == false)
        AND puller.shift_status == ON_SHIFT (checked before selection: ERR_STAFF_NOT_ON_SHIFT)
        AND planned window [now, now + sla_target_minutes) satisfies the 10-minute buffer
            rule against the puller's other ASSIGNED/IN_PROGRESS windows
      ranking:  priority_tier rank DESC (STAT > URGENT > STANDARD),
                then priority_score DESC, then sla_due_at ASC, then created_at ASC
      empty pool: ERR_QUEUE_EMPTY (409)
      effect: chosen request -> ASSIGNED with assigned_staff_id = puller, planned_start_at = now
    note: "Random ids MUST NOT appear in ranking or tie-break; the final tie-break is created_at ASC."

  - name: bed_ready_match_selector
    trigger: "Bed enters READY; ops-run rematch pass"
    algorithm: selector_policy
    formula: |
      eligibility filter: PlacementDemand with unit_id == bed.unit_id,
                          status == OPEN, required_bed_kind == bed.bed_kind
      ranking: priority_score DESC, then created_at ASC
      empty pool: bed stays READY unmatched (no error; no notification created)
      effect: demand -> MATCHED (matched_bed_id := bed); BedReadyNotification created (SENT)

  - name: snapshot_percentiles
    trigger: "POST /evs/units/{unit_id}/ops-runs (after expiry/breach/rematch passes)"
    algorithm: aggregation
    formula: |
      window = [previous snapshot's window_end (or unit.created_at on first run), now)
             — start INCLUSIVE, end EXCLUSIVE
      set = CleanRequests with unit_id == unit AND verified_at inside window
      tat_total series = tat_total_minutes of each set member's bed at that ready event
      tat_clean series = tat_clean_minutes likewise
      sort series ASC; nearest-rank percentile: rank = ceil(p/100 * n), value = series[rank] (1-indexed)
      verified_count = |set|
      sla_breach_count = count of set members with verified_at > sla_due_at
      empty set -> all four percentile fields null, counts 0
    precision: "integer inputs; percentile values are exact series elements (no interpolation)"

  - name: sla_breach_sweep
    trigger: "ops-run"
    algorithm: threshold
    formula: |
      for each CleanRequest in the unit with status IN {QUEUED, ASSIGNED, IN_PROGRESS}:
        if now > sla_due_at: sla_breached := true (idempotent; priority_score recomputed with BREACH_BOOST)
        at now == sla_due_at exactly: NOT breached (strict >)
      on breach: priority_tier unchanged (tier is demand-derived); only the boost applies
      then: OPEN PlacementDemands with needed_by < now -> EXPIRED (equality stays OPEN)
      then: SENT BedReadyNotifications with now > sent_at + 60 min -> EXPIRED (demand -> OPEN; equality stays SENT)
      then: rematch pass — every READY bed with no SENT/ACKNOWLEDGED notification runs bed_ready_match_selector

  - name: maintenance_capacity_check
    trigger: "MaintenanceWindow creation and activation"
    algorithm: interval_merge
    formula: |
      unit_bed_count = count of Beds in the window's bed's unit
      cap = max(1, floor(MAINTENANCE_CAP_PCT * unit_bed_count))
      overlap semantics: HALF-OPEN [start_at, end_at); windows touching at a point
        (a.end_at == b.start_at) do NOT overlap
      sweep instants T = { new.start_at } union { e.start_at : existing window e
                         with status IN {SCHEDULED, ACTIVE} and e overlaps new }
      reject iff exists t in T with (count of overlapping existing windows at t) + 1 > cap
      (checking start instants suffices: overlap counts change only at interval endpoints,
       and an endpoint that is another window's start is in T by construction)
    constants:
      MAINTENANCE_CAP_PCT: 0.20
    note: "Aggregate-capacity semantics — pairwise overlap between windows is ALLOWED up to the cap; this is deliberately different from the staff double-booking rule (pairwise + buffer, zero overlap tolerated)."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: request_format
    check: "Required fields present; types valid; enum values in range; end_at > start_at for MaintenanceWindow (ERR_INVALID_WINDOW); audit method/field consistency (ERR_AUDIT_METHOD_FIELD_MISMATCH); clock monotonicity (ERR_CLOCK_REGRESSION)"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_WINDOW | ERR_AUDIT_METHOD_FIELD_MISMATCH | ERR_CLOCK_REGRESSION"
    http_status: 400
    applies_to: "all mutating endpoints"
    note: "Shape errors beat authorization: a malformed body is rejected before role checks"

  - priority: 3
    category: auth
    check: "X-User-Role must be listed in the endpoint's roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3.5
    category: auth
    check: "Entity-backed roles: X-User-ID must identify an existing StaffMember whose capabilities include the role's capability (EVSTechnician needs CLEAN, QualityAuditor needs AUDIT)"
    error_id: ERR_ROLE_CAPABILITY_MISMATCH
    http_status: 403
    applies_to: "endpoints invoked with X-User-Role EVSTechnician or QualityAuditor"

  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right; then body FK ids (staff_id, clean_request_id, bed_id, unit_id, item ids)"
    error_id: "ERR_UNIT_NOT_FOUND | ERR_BED_NOT_FOUND | ERR_CLEAN_REQUEST_NOT_FOUND | ERR_PLACEMENT_DEMAND_NOT_FOUND | ERR_STAFF_NOT_FOUND | ERR_AUDIT_NOT_FOUND | ERR_SUPPLY_ITEM_NOT_FOUND | ERR_OUTBREAK_NOT_FOUND | ERR_NOTIFICATION_NOT_FOUND | ERR_STANDARD_NOT_FOUND | ERR_WINDOW_NOT_FOUND | ERR_SNAPSHOT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with resource ids"

  - priority: 4.5
    category: auth
    check: "Ownership: EVSTechnician may start/complete only a request assigned to X-User-ID (ERR_NOT_ASSIGNED_TECHNICIAN); clock/break endpoints require X-User-ID == staff_id path (ERR_STAFF_IDENTITY_MISMATCH)"
    error_id: "ERR_NOT_ASSIGNED_TECHNICIAN | ERR_STAFF_IDENTITY_MISMATCH"
    http_status: 403
    applies_to: "start, complete, clock-in, clock-out, break-start, break-end"

  - priority: 4.8
    category: state
    check: "OCC: expected_*_version on reassign / recount / standard-PUT must equal the parent entity's current version"
    error_id: "ERR_STALE_REQUEST_VERSION | ERR_STALE_SUPPLY_VERSION | ERR_STALE_STANDARD_VERSION"
    http_status: 412
    applies_to: "POST .../reassign, POST .../recount, PUT /evs/clean-standards/{clean_type}"

  - priority: 5
    category: state
    check: "Target entity in a valid state for the operation; terminal-state rejection (ERR_*_ALREADY_TERMINAL family) precedes wrong-state rejection (ERR_*_NOT_* family)"
    error_id: "ERR_REQUEST_ALREADY_TERMINAL | ERR_REQUEST_NOT_QUEUED | ERR_REQUEST_NOT_ASSIGNED | ERR_REQUEST_NOT_IN_PROGRESS | ERR_REQUEST_NOT_PENDING_QA | ERR_BED_NOT_OCCUPIED | ERR_BED_NOT_READY | ERR_BED_NOT_DIRTY | ERR_STAFF_NOT_ON_SHIFT | ERR_STAFF_NOT_ON_BREAK | ERR_STAFF_ALREADY_ON_SHIFT | ERR_DEMAND_NOT_OPEN | ERR_NOTIFICATION_NOT_SENT | ERR_OUTBREAK_INVALID_STATE | ERR_WINDOW_INVALID_STATE | ERR_AUDIT_NOT_SUBMITTED | ERR_AUDIT_NOT_VOIDABLE | ERR_AUDIT_VOID_WINDOW_CLOSED | ERR_BED_NOT_AVAILABLE_FOR_MAINTENANCE"
    http_status: 409
    applies_to: "state transition endpoints"

  - priority: 6
    category: business_safety
    check: "Infection-control gates, evaluated in this order: (a) staff certifications cover clean_type; (b) STAT-tier assign requires stat_eligible; (c) reclean assign requires staff_id != last_completed_by_staff_id; (d) audit submit requires auditor_id != last_completed_by_staff_id"
    error_id: "ERR_STAFF_CERTIFICATION_MISMATCH | ERR_STAFF_NOT_STAT_ELIGIBLE | ERR_RECLEAN_SAME_TECHNICIAN | ERR_AUDITOR_IS_CLEANER"
    http_status: 422
    applies_to: "assign, reassign, pull (filter), POST /evs/quality-audits"

  - priority: 7
    category: business_temporal
    check: "Staff planned-window double-booking with symmetric 10-minute buffer: conflict iff NOT(new.start >= existing.end + 10min OR existing.start >= new.end + 10min) over the staff's OTHER ASSIGNED/IN_PROGRESS windows; exactly 10 minutes of gap is allowed"
    error_id: ERR_STAFF_DOUBLE_BOOKED
    http_status: 409
    applies_to: "assign, reassign, pull (as eligibility filter)"

  - priority: 8
    category: business_referential
    check: "Bed has no open CleanRequest (status in {QUEUED, ASSIGNED, IN_PROGRESS, PENDING_QA, NEEDS_RECLEAN}) when creating a request or activating a maintenance window"
    error_id: ERR_OPEN_REQUEST_EXISTS
    http_status: 409
    applies_to: "POST /evs/clean-requests, POST /evs/beds/{id}/discharge (auto-create), maintenance-window activate"

  - priority: 9
    category: business_constraint
    check: "Supply availability for every BOM line (start); unit maintenance aggregate cap; CleanStandard clean_type uniqueness on create; at most one ACTIVE OutbreakEvent per unit"
    error_id: "ERR_INSUFFICIENT_SUPPLY | ERR_CAPACITY_EXCEEDED | ERR_DUPLICATE_STANDARD | ERR_OUTBREAK_ALREADY_ACTIVE"
    http_status: 422
    applies_to: "start, maintenance-window create/activate, clean-standard create, outbreak activate"
    note: "ERR_INSUFFICIENT_SUPPLY and ERR_CAPACITY_EXCEEDED are 422; ERR_DUPLICATE_STANDARD and ERR_OUTBREAK_ALREADY_ACTIVE are 409 (uniqueness conflicts)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving; default time 2026-08-01T00:00:00Z before any set) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the logical clock. The server's default logical time at startup is exactly 2026-08-01T00:00:00Z; the clock NEVER falls back to wall time. Monotonic: to_iso8601 must be >= current logical time (else ERR_CLOCK_REGRESSION). All server-stamped datetimes and all time-derived computations read this clock."
    roles: [EVSAdministrator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Logical clock advanced; no other entity mutates"]

  # --- Units ---
  - method: POST
    path: "/evs/units"
    description: "Create a hospital unit"
    roles: [EVSAdministrator]
    code: 201
    input: [unit_code, display_name]
    output: Unit
    side_effects: ["outbreak_posture=NORMAL, ops_run_index=0"]

  - method: GET
    path: "/evs/units"
    description: "List units"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Unit[]"
    side_effects: []

  - method: GET
    path: "/evs/units/{unit_id}"
    description: "Get a unit"
    roles: [Any]
    code: 200
    input: []
    output: Unit
    side_effects: []

  - method: POST
    path: "/evs/units/{unit_id}/ops-runs"
    description: "Run the unit's ops checkpoint: SLA breach sweep, demand expiry, notification expiry, rematch pass, snapshot creation"
    roles: [EVSAdministrator]
    code: 201
    input: []
    output: TurnaroundSnapshot
    side_effects:
      - "Applies sla_breach_sweep (breach marking + boost, demand expiry, notification expiry, rematch)"
      - "Creates the TurnaroundSnapshot for the closed window"
      - "Increments Unit.ops_run_index by 1 (Unit.version increments)"

  - method: GET
    path: "/evs/units/{unit_id}/turnaround-snapshots"
    description: "List a unit's turnaround snapshots (reverse reachability for TurnaroundSnapshot.unit_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "TurnaroundSnapshot[]"
    side_effects: []

  - method: GET
    path: "/evs/turnaround-snapshots/{snapshot_id}"
    description: "Get a snapshot"
    roles: [Any]
    code: 200
    input: []
    output: TurnaroundSnapshot
    side_effects: []

  # --- Beds ---
  - method: POST
    path: "/evs/beds"
    description: "Register a bed"
    roles: [EVSAdministrator]
    code: 201
    input: [unit_id, bed_code, bed_kind]
    output: Bed
    side_effects: ["bed_status=VACANT_DIRTY"]

  - method: GET
    path: "/evs/beds"
    description: "List beds (filterable)"
    roles: [Any]
    code: 200
    input: ["unit_id?", "bed_status?", "bed_kind?", "limit?", "offset?"]
    output: "Bed[]"
    side_effects: []

  - method: GET
    path: "/evs/beds/{bed_id}"
    description: "Get a bed"
    roles: [Any]
    code: 200
    input: []
    output: Bed
    side_effects: []

  - method: POST
    path: "/evs/beds/{bed_id}/discharge"
    description: "Discharge notification: OCCUPIED bed becomes VACANT_DIRTY and a CleanRequest is auto-created"
    roles: [BedPlacementCoordinator]
    code: 200
    input: ["clean_type?"]
    output: Bed
    side_effects: ["Bed OCCUPIED -> VACANT_DIRTY; last_discharge_at stamped; CleanRequest auto-created (type rules in §1.2)"]

  - method: POST
    path: "/evs/beds/{bed_id}/admit"
    description: "Admit a patient to a READY bed"
    roles: [BedPlacementCoordinator]
    code: 200
    input: []
    output: Bed
    side_effects: ["Bed READY -> OCCUPIED; matched demand -> FULFILLED; notification auto-ACKNOWLEDGED if still SENT"]

  - method: POST
    path: "/evs/beds/{bed_id}/mark-soiled"
    description: "A READY bed is soiled before admission: retract readiness, re-open the matched demand, queue a fresh ROUTINE clean"
    roles: [BedPlacementCoordinator]
    code: 200
    input: []
    output: Bed
    side_effects: ["Bed READY -> VACANT_DIRTY; notification RETRACTED; demand MATCHED -> OPEN; new ROUTINE CleanRequest created"]

  # --- Maintenance windows ---
  - method: POST
    path: "/evs/maintenance-windows"
    description: "Schedule a maintenance window for a bed (aggregate capacity cap applies)"
    roles: [EVSAdministrator]
    code: 201
    input: [bed_id, start_at, end_at, "reason?"]
    output: MaintenanceWindow
    side_effects: []

  - method: GET
    path: "/evs/maintenance-windows"
    description: "List maintenance windows (filterable)"
    roles: [Any]
    code: 200
    input: ["bed_id?", "status?", "limit?", "offset?"]
    output: "MaintenanceWindow[]"
    side_effects: []

  - method: GET
    path: "/evs/maintenance-windows/{window_id}"
    description: "Get a maintenance window"
    roles: [Any]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: []

  - method: POST
    path: "/evs/maintenance-windows/{window_id}/activate"
    description: "Activate a scheduled window: bed goes OUT_OF_SERVICE"
    roles: [EVSAdministrator]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: ["Bed -> OUT_OF_SERVICE (READY case fires notification/demand retraction)"]

  - method: POST
    path: "/evs/maintenance-windows/{window_id}/close"
    description: "Close an active window: bed returns to VACANT_DIRTY and a ROUTINE clean is auto-created"
    roles: [EVSAdministrator]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: ["Bed OUT_OF_SERVICE -> VACANT_DIRTY; ROUTINE CleanRequest auto-created"]

  - method: POST
    path: "/evs/maintenance-windows/{window_id}/cancel"
    description: "Cancel a scheduled window"
    roles: [EVSAdministrator]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: []

  # --- Clean requests ---
  - method: POST
    path: "/evs/clean-requests"
    description: "Manually create a clean request for a VACANT_DIRTY bed"
    roles: [EVSDispatcher]
    code: 201
    input: [bed_id, clean_type]
    output: CleanRequest
    side_effects: ["Pins effective_time_standard; computes priority_tier/priority_score; requires CleanStandard for the clean_type to exist (ERR_STANDARD_NOT_FOUND)"]

  - method: GET
    path: "/evs/clean-requests"
    description: "List clean requests (filterable)"
    roles: [Any]
    code: 200
    input: ["bed_id?", "unit_id?", "status?", "assigned_staff_id?", "priority_tier?", "limit?", "offset?"]
    output: "CleanRequest[]"
    side_effects: []

  - method: GET
    path: "/evs/clean-requests/{request_id}"
    description: "Get a clean request"
    roles: [Any]
    code: 200
    input: []
    output: CleanRequest
    side_effects: []

  - method: POST
    path: "/evs/clean-requests/{request_id}/assign"
    description: "Assign a QUEUED or NEEDS_RECLEAN request to a staff member"
    roles: [EVSDispatcher]
    code: 200
    input: [staff_id, "planned_start_at?"]
    output: CleanRequest
    side_effects: ["status -> ASSIGNED; planned window set; staff.active_clean_count +1; increments CleanRequest.version by 1"]

  - method: POST
    path: "/evs/clean-requests/{request_id}/reassign"
    description: "Reassign an ASSIGNED request to a different staff member (OCC-guarded)"
    roles: [EVSDispatcher]
    code: 200
    input: [staff_id, expected_clean_request_version, "planned_start_at?"]
    output: CleanRequest
    side_effects: ["assigned staff swapped; active counts adjusted; increments CleanRequest.version by 1"]

  - method: POST
    path: "/evs/clean-requests/{request_id}/unassign"
    description: "Return an ASSIGNED request to the queue"
    roles: [EVSDispatcher]
    code: 200
    input: []
    output: CleanRequest
    side_effects: ["status -> QUEUED; assigned_staff_id null; staff.active_clean_count -1; increments CleanRequest.version by 1"]

  - method: POST
    path: "/evs/clean-requests/{request_id}/start"
    description: "Assigned technician starts cleaning (reserves chemicals, bed -> CLEAN_IN_PROGRESS)"
    roles: [EVSTechnician]
    code: 200
    input: []
    output: CleanRequest
    side_effects: ["status -> IN_PROGRESS; supply reservation; bed transition; started_at/first_started_at stamped"]

  - method: POST
    path: "/evs/clean-requests/{request_id}/complete"
    description: "Assigned technician completes cleaning (consumes chemicals, bed -> AWAITING_VERIFICATION)"
    roles: [EVSTechnician]
    code: 200
    input: []
    output: CleanRequest
    side_effects: ["status -> PENDING_QA; supply consumption + CONSUME ledger entries; bed transition; completed_at stamped; last_completed_by_staff_id set"]

  - method: POST
    path: "/evs/clean-requests/{request_id}/cancel"
    description: "Cancel a QUEUED, ASSIGNED, or IN_PROGRESS request (IN_PROGRESS cancel releases the reservation without consuming)"
    roles: [EVSDispatcher]
    code: 200
    input: []
    output: CleanRequest
    side_effects: ["status -> CANCELLED; reservation release if supply_reserved; staff.active_clean_count -1 if assigned; bed CLEAN_IN_PROGRESS -> VACANT_DIRTY if started"]

  - method: POST
    path: "/evs/clean-requests/pull"
    description: "Pull-based dispatch: assigns the highest-ranked eligible QUEUED request to the pulling technician"
    roles: [EVSTechnician]
    code: 200
    input: []
    output: CleanRequest
    side_effects: ["next_clean_request_selector runs; chosen request -> ASSIGNED (planned_start_at := now)"]

  # --- Staff ---
  - method: POST
    path: "/evs/staff"
    description: "Register a staff member"
    roles: [EVSAdministrator]
    code: 201
    input: [employee_code, display_name, capabilities, "certifications?"]
    output: StaffMember
