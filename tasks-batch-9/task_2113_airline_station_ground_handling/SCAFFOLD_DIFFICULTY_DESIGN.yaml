        grounds:
          - entities.Station.fields.status
          - state_machines.Station.OPEN_to_SUSPENDED
          - state_machines.Station.SUSPENDED_to_OPEN
          - errors[ERR_STATION_NOT_OPEN]
          - validations[priority=11]
        distinguishing_aspect: |
          A DIFFERENT entity pair - TURNRESOURCE -> STATION: the Turn itself is still SCHEDULED
          (its bank was never published, so the suspend cascade never reached it) and the agent
          is fully certified, yet the create is refused with ERR_STATION_NOT_OPEN solely because
          the owning Station is SUSPENDED; resuming the station makes the identical call succeed.
        test_recipe:
          setup:
            - "Station ZRH was opened and then SUSPENDED."
            - "FlightBank AM1 is still in bank_status DRAFT, so the suspension cascade (which only touches PUBLISHED banks) left its turn alone."
            - "Turn LX318 (TOWING_ONLY) is therefore still SCHEDULED with zero occupations."
            - "Agent E001 holds a current RAMP_SAFETY endorsement at ZRH."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
