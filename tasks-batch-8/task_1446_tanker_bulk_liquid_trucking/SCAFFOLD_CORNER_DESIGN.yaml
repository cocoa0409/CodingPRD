            - { call: "POST /bulk-liquid/shipments/${s2}/close-meter", payload: { meter_start_gal: 0, meter_end_gal: 1000, observed_temp_F: 60 }, as: TerminalOperator, as_user_id: "op-meter" }
            - { call: "POST /bulk-liquid/shipments/${s2}/record-weights", payload: { steer_lb: 6600, drive_lb: 12500, trailer_lb: 12900 }, as: TerminalOperator, as_user_id: "op-scale" }
            - { call: "POST /bulk-liquid/shipments/${s2}/confirm-placards", payload: { observed_placard_code: "UN1993" }, as: TerminalOperator, as_user_id: "op-meter" }
            - { call: "POST /bulk-liquid/shipments/${s2}/depart", as: Dispatcher }
            - { call: "POST /bulk-liquid/shipments/${s2}/start-delivery", as: Driver, as_user_id: "${drv}" }
            - { call: "GET /bulk-liquid/delivery-tickets?shipment_id=${s2}", as: Dispatcher, captures: { dt2: "$.data[0].id" } }
          trigger:
