errors:
- id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
  http: 400
  condition: X-User-ID or X-User-Role header missing or invalid
- id: ERR_INSUFFICIENT_PERMISSIONS
  http: 403
  condition: Role not permitted for this endpoint
- id: ERR_SEGREGATION_OF_DUTIES
  http: 403
  condition: Same X-User-ID attempted both sides of a segregated duty (bill vs collect; propose vs deciding vote)
- id: ERR_DISTRICT_NOT_FOUND
  http: 404
  condition: districtId does not exist
- id: ERR_MEMBER_NOT_FOUND
  http: 404
  condition: memberId does not exist in district
- id: ERR_TAP_NOT_FOUND
  http: 404
  condition: tapId does not exist in district
- id: ERR_CYCLE_NOT_FOUND
  http: 404
  condition: cycleId does not exist in district
- id: ERR_INVOICE_NOT_FOUND
  http: 404
  condition: invoiceId does not exist in district
- id: ERR_SCHEDULE_NOT_FOUND
  http: 404
  condition: scheduleId does not exist in district
- id: ERR_PETITION_NOT_FOUND
  http: 404
  condition: petitionId does not exist in district
- id: ERR_RESOLUTION_NOT_FOUND
  http: 404
  condition: resolutionId does not exist in district
- id: ERR_ORDER_NOT_FOUND
  http: 404
  condition: boil order id does not exist in district
- id: ERR_SAMPLE_NOT_FOUND
  http: 404
  condition: sample id does not exist in district
- id: ERR_AREA_NOT_FOUND
  http: 404
  condition: service area id does not exist in district
- id: ERR_PAYMENT_NOT_FOUND
  http: 404
  condition: paymentId does not exist in district
- id: ERR_CYCLE_NOT_OPEN
  http: 409
  condition: Operation requires BillingCycle.status == OPEN
- id: ERR_CYCLE_NOT_READINGS_COMPLETE
  http: 409
  condition: bill requires READINGS_COMPLETE
- id: ERR_CYCLE_NOT_BILLED
  http: 409
  condition: close requires BILLED
- id: ERR_MEMBER_NOT_ACTIVE
  http: 409
  condition: Operation requires Member.membership_status == ACTIVE
- id: ERR_ORDER_NOT_SAMPLING
  http: 409
  condition: record-result requires BoilOrder.status == SAMPLING
- id: ERR_PETITION_NOT_REVIEWABLE
  http: 409
  condition: Petition not in a from-state for this transition
- id: ERR_RESOLUTION_NOT_PROPOSED
  http: 409
  condition: Voting requires resolution PROPOSED
- id: ERR_BOIL_ORDER_MORATORIUM
  http: 409
  condition: Disconnect blocked while a boil order is IN_EFFECT
- id: ERR_NOTIFICATION_INCOMPLETE
  http: 409
  condition: begin-sampling requires every ACTIVE member notified
- id: ERR_SAMPLE_WINDOW_VIOLATION
  http: 422
  condition: collected_utc outside [issued_utc, issued_utc+72h]
- id: ERR_READING_REGRESSION
  http: 422
  condition: reading_gallons below tap's latest accepted cumulative register
- id: ERR_DUPLICATE_READING
  http: 409
  condition: Tap already has an accepted reading for this cycle
- id: ERR_MISSING_METER_READINGS
  http: 409
  condition: Some INSTALLED/RECONNECTED tap lacks a reading this cycle
- id: ERR_CYCLE_WINDOW_INVALID
  http: 422
  condition: Cycle window malformed or overlapping prior cycle
- id: ERR_AREA_NOT_SERVICEABLE
  http: 422
  condition: service_area_id not in {ACTIVE, ANNEXED_IN} or wrong district
- id: ERR_RATE_SCHEDULE_INVALID
  http: 422
  condition: tier2_cap_gallons <= included_gallons or non-positive rates
- id: ERR_RESERVE_COVENANT_BREACH
  http: 409
  condition: Withdrawal would drop reserve below 75% of target
- id: ERR_OUTSTANDING_BALANCE
  http: 402
  condition: Reconnect requires all tap invoices PAID
- id: ERR_NOT_DISCONNECT_ELIGIBLE
  http: 409
  condition: Unpaid invoices not yet DISCONNECT_ELIGIBLE
- id: ERR_TAP_FEE_UNPAID
  http: 402
  condition: install-meter requires tap fee fully paid
- id: ERR_DUPLICATE_ACTIVE_TAP
  http: 409
  condition: Member already has an active tap in this service area
- id: ERR_STALE_VERSION
  http: 412
  condition: expected_district_version mismatch (OCC)
- id: ERR_DUPLICATE_VOTE
  http: 409
  condition: Board member already voted on this resolution
- id: ERR_MASTER_READING_REQUIRED
  http: 409
  condition: Cycle close requires exactly one MasterMeterReading
- id: ERR_NO_ACTIVE_RATE_SCHEDULE
  http: 409
  condition: Billing requires an ADOPTED rate schedule
- id: ERR_DUPLICATE_NOTIFICATION
  http: 409
  condition: Member already notified for this boil order
- id: ERR_TAP_HAS_BILLING_HISTORY
  http: 409
  condition: Abandon requires no invoices on the tap
- id: ERR_OPEN_INVOICES_EXIST
  http: 409
  condition: Terminate requires no open invoices
- id: ERR_PAYMENT_ALREADY_REVERSED
  http: 409
  condition: Payment already REVERSED
- id: ERR_INVALID_REQUEST
  http: 400
  condition: Required field missing or malformed
- id: ERR_AREA_IN_USE
  http: 409
  condition: 'Retire blocked: area still referenced by non-terminal members'
roles:
- name: SystemAdmin
  description: Platform operator; creates districts and service areas; read-mostly elsewhere
  identity: opaque
  exclusive_operations:
  - POST /districts
  - POST /districts/{id}/service-areas
  shared_operations:
  - GET endpoints
  - POST /_clock/set_current_utc
- name: BillingClerk
  description: District office clerk; membership, taps creation, readings oversight, billing runs, annexation paperwork, notices
  identity: opaque
  exclusive_operations:
  - members create/approve
  - taps create/abandon
  - billing-cycles create/mark-readings-complete/bill
  - invoices issue-notice
  - annexation-petitions create/begin-review/withdraw/resubmit
  shared_operations:
  - GET endpoints
  - POST /_clock/set_current_utc
- name: Treasurer
  description: Collects money; segregated from billing duties
  identity: opaque
  exclusive_operations:
  - payments create/reverse
  - taps pay-tap-fee
  - billing-cycles close
  shared_operations:
  - GET endpoints
  - reserve-entries list
  - POST /_clock/set_current_utc
- name: BoardDirector
  description: Board member; rate schedules, resolutions, votes, membership termination
  identity: opaque
  exclusive_operations:
  - rate-schedules create
  - board-resolutions create/record-vote
  - members terminate
  shared_operations:
  - GET endpoints
  - POST /_clock/set_current_utc
- name: FieldOperator
  description: Field crew; meter install/disconnect/reconnect, readings, boil orders, samples, feasibility recommendation
  identity: opaque
  exclusive_operations:
  - taps install-meter/disconnect/reconnect
  - meter-readings create
  - master-meter-readings create
  - boil-orders create/notifications/begin-sampling
  - compliance-samples create/record-result
  - annexation-petitions recommend
  shared_operations:
  - GET endpoints
  - POST /_clock/set_current_utc
