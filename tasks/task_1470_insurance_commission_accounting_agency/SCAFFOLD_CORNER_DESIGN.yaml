  - section: calculations
    instances:
      - name: tolerance_boundary_100_matched_101_variance
        claim_type: correct_result
        grounds: ["calculations.statement_reconciliation"]
        distinguishing_aspect: "Tolerance is inclusive at 100: reported 1200100 vs expected 1200000 (delta exactly 100) MATCHES; delta 101 flags VARIANCE."
        test_recipe:
          setup: ["producer; carrier; product; STANDARD schedule 5000bps advance 12; two bound DIRECT_BILL policies P-TA/P-TB premium 2400000 each (entries 1200000)"]
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "Tol T", license_number: "LIC-C1T" }
              as: AgencyAdmin
              captures: { w_id: "$.data.id" }
            - call: "POST /agency/carriers"
              payload: { name: "Carrier C1T", carrier_code: "CC1T" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PC1T", name: "Product C1T", line_of_business: "LIFE" }
