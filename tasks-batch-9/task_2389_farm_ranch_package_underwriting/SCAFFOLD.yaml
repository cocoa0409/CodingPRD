# =============================================================================
# PRD Benchmark Scaffold — Farm and Ranch Package Underwriting
# Task: task_2389_farm_ranch_package_underwriting
#
# §1.0 Response Envelope, §1.1 Entities, §1.2 State Machines,
# §1.2.1 Concurrency Rules, §1.3 Calculations, §1.4 Validations,
# §1.5 Endpoints, §1.6 Errors, §1.7 RBAC.
#
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: "2389. Farm and Ranch Package Underwriting (farm insurer): dwelling, farm structure and equipment scheduling with replacement cost versus actual cash value elections, livestock coverage with peril limitations and per-head or blanket limits, farm liability including custom farming, agritourism and roadside stand exposures, pollution and chemical application exclusions with buy-back endorsements, seasonal value fluctuation for stored crops, hay and inputs, employee, migrant labor and workers compensation coordination, catastrophe exposure aggregation for hail, wind and wildfire, inspection findings, loss control recommendations and compliance follow-up"

domain_name: "farm-ranch-package-underwriting"

# All resource collections are top-level (flat topology); child collections are
# reached either as sub-resources of their parent or as filtered lists.
api_prefix: "/"

complexity_profile:
  primary_archetype: quota_allocation          # finite per-peril catastrophe capacity reserved / committed / released
  secondary_archetype: pricing_engine          # multi-component premium build-up with valuation elections
  complexity_layers:
    - optimistic_concurrency                   # OCC on FarmPolicy.version and CatCapacityPool.version
    - cascading_side_effects                   # inspection -> compliance -> endorsement -> premium ledger
    - dual_variant_calculation                 # RC vs ACV valuation; per-head vs blanket livestock limits
    - rate_threshold_triggers                  # scarcity tiers, deductible credit bands, labor-exposure threshold

  entity_topology: flat
  # Peer entities linked by explicit foreign keys. Only child collections that
  # are conceptually owned by a policy appear as nested read/write paths; every
  # entity is addressable by its own flat collection.

  state_machine_shape: parallel
  # FarmPolicy carries two independent status axes (uw_status x compliance_status);
  # LaborProfile, Inspection, Recommendation and Endorsement each cycle.

  relationship_patterns:
    - one_to_many          # FarmPolicy -> ScheduledItem / LivestockGroup / LiabilityExposure / Endorsement / Inspection / CatReservation / PremiumTransaction
    - cross_aggregate      # CatReservation bridges FarmPolicy and CatCapacityPool
    - polymorphic: false

  role_model: segregation_of_duties
  # The SeniorUnderwriter who drove a policy into REFERRED may not decide that
  # same referral; loss-control, compliance and underwriting duties are split.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================

entities:

  - name: Agent
    parent: null
    common_fields: true
    fields:
      - name: agency_name
        type: string
        source: input
        description: producer agency legal name
        constraints: "1..120 chars, non-blank"
      - name: license_state
        type: string
        source: input
        description: two-letter state code the producer is licensed in
        constraints: "exactly 2 uppercase letters"
      - name: appointment_status
        type: enum
        source: input
        description: carrier appointment standing of the producer
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: authority_limit_cents
        type: integer
        source: input
        description: maximum FarmPolicy.total_premium_cents this producer may have bound on its accounts
        default: 5000000
        constraints: ">= 0"

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: loss-control inspector name
        constraints: "1..120 chars, non-blank"
      - name: region_code
        type: string
        source: input
        description: territory code the inspector covers
        constraints: "1..12 chars"
      - name: status
        type: enum
        source: input
        description: whether the inspector may be assigned new inspections
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE}"
      - name: daily_capacity_minutes
        type: integer
        source: input
        description: inspection minutes the inspector may hold on a single UTC calendar date
        default: 480
        constraints: ">= 30"

  - name: CatCapacityPool
    parent: null
    common_fields: true
    fields:
      - name: zone_code
        type: string
        source: input
        description: catastrophe aggregation zone code (matched against FarmAccount.cat_zone_code)
        constraints: "1..24 chars; (zone_code, peril) is unique"
      - name: peril
        type: enum
        source: input
        description: catastrophe peril this pool holds capacity for
        constraints: "one of {HAIL, WIND, WILDFIRE}"
      - name: participation_pct
        type: number
        source: input
        description: fraction of a policy's exposed TIV that occupies this pool when the policy is rated
        constraints: "> 0 and <= 1, at most 4 decimal places"
      - name: total_capacity_cents
        type: integer
        source: input
        description: gross capacity the pool may hold
        constraints: "> 0"
      - name: reserved_cents
        type: integer
        source: computed
        description: sum of CatReservation.amount_cents on this pool whose status == RESERVED
        default: 0
      - name: committed_cents
        type: integer
        source: computed
        description: sum of CatReservation.amount_cents on this pool whose status == COMMITTED
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: total_capacity_cents - reserved_cents - committed_cents
        default: 0
      - name: status
        type: enum
        source: input
        description: whether the pool accepts new reservations
        default: OPEN
        constraints: "one of {OPEN, FROZEN}"

  - name: FarmAccount
    parent: null
    common_fields: true
    fields:
      - name: agent_id
        type: string
        source: system
        description: "FK -> Agent.id; stamped from the X-User-ID of the Agent that created the account"
      - name: legal_name
        type: string
        source: input
        description: farm or ranch legal entity name
        constraints: "1..160 chars, non-blank"
      - name: state_code
        type: string
        source: input
        description: state the operation is located in
        constraints: "exactly 2 uppercase letters"
      - name: county_name
        type: string
        source: input
        description: county of the primary location
        constraints: "1..60 chars"
      - name: cat_zone_code
        type: string
        source: input
        description: catastrophe zone code used to select the three CatCapacityPool rows at rating
        constraints: "1..24 chars"
      - name: acreage
        type: integer
        source: input
        description: total operated acres; drives the GENERAL_FARM liability charge
        constraints: ">= 1"
      - name: operation_type
        type: enum
        source: input
        description: dominant operation classification
        constraints: "one of {CROP, LIVESTOCK, DAIRY, RANCH, MIXED}"

  - name: FarmPolicy
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> FarmAccount.id; the insured operation this package covers"
      - name: term_start_date
        type: string
        source: input
        description: first day of the annual term (YYYY-MM-DD, inclusive)
      - name: term_end_date
        type: string
        source: input
        description: last day of the annual term (YYYY-MM-DD, inclusive)
      - name: deductible_cents
        type: integer
        source: input
        description: flat property deductible; selects the deductible credit band
        constraints: ">= 0"
      - name: uw_status
        type: enum
        source: system
        description: underwriting axis of the policy state
        default: DRAFT
        constraints: "one of {DRAFT, RATED, REFERRED, BOUND, DECLINED, CANCELLED}"
      - name: compliance_status
        type: enum
        source: system
        description: loss-control axis of the policy state; evolves independently of uw_status
        default: NOT_INSPECTED
        constraints: "one of {NOT_INSPECTED, RECS_OPEN, RECS_OVERDUE, SUSPENDED, COMPLIANT}"
      - name: property_premium_cents
        type: integer
        source: computed
        description: sum of per-item rounded scheduled-property charges (calculations.property_premium)
        default: 0
      - name: livestock_premium_cents
        type: integer
        source: computed
        description: sum of per-group rounded livestock charges (calculations.livestock_premium)
        default: 0
      - name: liability_premium_cents
        type: integer
        source: computed
        description: sum of per-exposure rounded farm-liability charges (calculations.liability_exposure_premium)
        default: 0
      - name: endorsement_premium_cents
        type: integer
        source: computed
        description: sum of Endorsement.premium_cents for endorsements whose status == APPROVED
        default: 0
      - name: base_premium_cents
        type: integer
        source: computed
        description: property_premium_cents + livestock_premium_cents + liability_premium_cents + endorsement_premium_cents
        default: 0
      - name: cat_load_cents
        type: integer
        source: computed
        description: catastrophe load pinned at rating (calculations.cat_load); never recomputed by endorsement activity
        default: 0
      - name: total_premium_cents
        type: integer
        source: computed
        description: base_premium_cents + cat_load_cents; always equals the signed sum of this policy's PremiumTransaction.amount_cents
        default: 0
      - name: exposed_tiv_cents
        type: integer
        source: computed
        description: rated exposure base (calculations.exposed_tiv) used to size catastrophe reservations
        default: 0
      - name: rating_valuation_date
        type: datetime
        source: computed
        description: logical clock instant of the most recent successful rating; fixes the seasonal valuation month
        default: null
      - name: quote_expires_at
        type: datetime
        source: computed
        description: rating_valuation_date + 30 days; set only on the DRAFT->RATED branch and on REFERRED->RATED
        default: null
      - name: referred_at
        type: datetime
        source: system
        description: instant the policy entered REFERRED; cleared when the referral is returned or approved
        default: null
      - name: referred_by_user_id
        type: string
        source: system
        description: X-User-ID of the underwriter whose rating produced the referral; the segregation-of-duties comparand
        default: null
      - name: referral_reason_code
        type: enum
        source: computed
        description: first matching referral trigger at rating time
        default: null
        constraints: "one of {TIV_ABOVE_LIMIT, AGRITOURISM_VISITORS, CAT_UTILIZATION_HIGH, HAZARD_SCORE_HIGH} or null"
      - name: bound_at
        type: datetime
        source: system
        description: instant the policy was bound
        default: null
      - name: bound_by_user_id
        type: string
        source: system
        description: X-User-ID of the Underwriter that bound the policy
        default: null
      - name: closure_reason
        type: string
        source: input
        description: free-text reason captured on decline or cancellation
        default: null

  - name: ScheduledItem
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: system
        description: "FK -> FarmPolicy.id; taken from the creation path"
      - name: item_class
        type: enum
        source: input
        description: rating class of the scheduled article
        constraints: "one of {DWELLING, FARM_STRUCTURE, EQUIPMENT, STORED_CROP, HAY, INPUTS}"
      - name: description
        type: string
        source: input
        description: item description used on the schedule
        constraints: "1..160 chars, non-blank"
      - name: valuation_basis
        type: enum
        source: input
        description: replacement-cost or actual-cash-value election for this item
        constraints: "one of {RC, ACV}"
      - name: stated_value_cents
        type: integer
        source: input
        description: off-peak stated value of the article
        constraints: "> 0"
      - name: age_years
        type: integer
        source: input
        description: age of the article in whole years; drives ACV depreciation
        constraints: ">= 0 and <= 100"
      - name: condition_grade
        type: enum
        source: input
        description: physical condition grade; multiplies the depreciated value under ACV
        constraints: "one of {A, B, C, D}"
      - name: peak_season_value_cents
        type: integer
        source: input
        description: value while inside the peak window; required for STORED_CROP / HAY / INPUTS and forbidden otherwise
        default: null
        constraints: "> 0 when present"
      - name: peak_season_start_month
        type: integer
        source: input
        description: first calendar month of the peak window (inclusive); required for STORED_CROP / HAY / INPUTS
        default: null
        constraints: "1..12 when present"
      - name: peak_season_end_month
        type: integer
        source: input
        description: last calendar month of the peak window (inclusive); may be numerically lower than the start month (wrap-around window)
        default: null
        constraints: "1..12 when present"
      - name: insured_value_cents
        type: integer
        source: computed
        description: calculations.scheduled_item_insured_value output at the valuation date in force
        default: 0
      - name: valued_at
        type: datetime
        source: computed
        description: logical clock instant used for the current insured_value_cents
        default: null
      - name: status
        type: enum
        source: input
        description: whether the item participates in rating
        default: ACTIVE
        constraints: "one of {ACTIVE, REMOVED}"

  - name: LivestockGroup
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: system
        description: "FK -> FarmPolicy.id; taken from the creation path"
      - name: species
        type: enum
        source: input
        description: livestock species of the group
        constraints: "one of {CATTLE, SWINE, POULTRY, SHEEP, EQUINE}"
      - name: head_count
        type: integer
        source: input
        description: number of head in the group
        constraints: ">= 1"
      - name: per_head_value_cents
        type: integer
        source: input
        description: declared value per head
        constraints: "> 0"
      - name: limit_basis
        type: enum
        source: input
        description: whether the group is written per head or under a blanket limit
        constraints: "one of {PER_HEAD, BLANKET}"
      - name: blanket_limit_cents
        type: integer
        source: input
        description: blanket limit; required when limit_basis == BLANKET and forbidden when PER_HEAD
        default: null
        constraints: "> 0 when present"
      - name: peril_scope
        type: enum
        source: input
        description: breadth of covered perils for the group; restricts the payable limit
        constraints: "one of {FULL_PERIL, NAMED_PERIL, CATASTROPHE_ONLY}"
      - name: covered_limit_cents
        type: integer
        source: computed
        description: calculations.livestock_covered_limit output, fixed at creation time
        default: 0

  - name: LiabilityExposure
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: system
        description: "FK -> FarmPolicy.id; taken from the creation path"
      - name: exposure_type
        type: enum
        source: input
        description: farm-liability exposure being rated
        constraints: "one of {GENERAL_FARM, CUSTOM_FARMING, AGRITOURISM, ROADSIDE_STAND}"
      - name: annual_receipts_cents
        type: integer
        source: input
        description: annual receipts attributable to the exposure
        constraints: ">= 0"
      - name: annual_visitor_count
        type: integer
        source: input
        description: annual visitor headcount; required for AGRITOURISM and forbidden for every other exposure_type
        default: null
        constraints: ">= 0 when present"
      - name: exposure_premium_cents
        type: integer
        source: computed
        description: calculations.liability_exposure_premium output, fixed at creation time
        default: 0

  - name: Endorsement
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: system
        description: "FK -> FarmPolicy.id; taken from the creation path"
      - name: form_code
        type: enum
        source: input
        description: endorsement form requested
        constraints: "one of {POLLUTION_BUYBACK, CHEMICAL_APPLICATION_BUYBACK, AGRITOURISM_LIABILITY, PEAK_SEASON_INCREASE}"
      - name: sublimit_cents
        type: integer
        source: input
        description: sublimit bought back or added by the form
        constraints: "> 0"
      - name: requested_effective_date
        type: string
        source: input
        description: requested effective date (YYYY-MM-DD)
      - name: requires_inspection
        type: boolean
        source: computed
        description: true exactly when form_code is a pollution or chemical-application buy-back
        default: false
      - name: status
        type: enum
        source: system
        description: endorsement lifecycle state
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, REJECTED, SUSPENDED, RESCINDED}"
      - name: premium_cents
        type: integer
        source: computed
        description: calculations.endorsement_premium output; set on approval, retained while SUSPENDED, zeroed on rescission
        default: 0
      - name: decision_note
        type: string
        source: input
        description: note recorded by the deciding underwriter
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the underwriter that approved or rejected the endorsement
        default: null

  - name: LaborProfile
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: system
        description: "FK -> FarmPolicy.id; at most one LaborProfile exists per policy"
      - name: full_time_count
        type: integer
        source: input
        description: year-round employees
        constraints: ">= 0"
      - name: seasonal_count
        type: integer
        source: input
        description: seasonal employees
        constraints: ">= 0"
      - name: migrant_h2a_count
        type: integer
        source: input
        description: migrant H-2A workers
        constraints: ">= 0"
      - name: labor_exposure_units
        type: number
        source: computed
        description: calculations.labor_exposure_units output, two decimal places
        default: 0
      - name: wc_required
        type: boolean
        source: computed
        description: true exactly when labor_exposure_units >= 6.00
        default: false
      - name: wc_carrier_name
        type: string
        source: input
        description: workers compensation carrier named on the proof
        default: null
      - name: wc_policy_number
        type: string
        source: input
        description: workers compensation policy number on the proof
        default: null
      - name: wc_expiry_date
        type: string
        source: input
        description: expiry date of the workers compensation proof (YYYY-MM-DD, inclusive)
        default: null
      - name: coordination_status
        type: enum
        source: computed
        description: workers compensation coordination state
        default: NOT_REQUIRED
        constraints: "one of {NOT_REQUIRED, PENDING_PROOF, VERIFIED, LAPSED}"
      - name: verified_at
        type: datetime
        source: system
        description: instant a ComplianceOfficer verified the proof
        default: null
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the verifying ComplianceOfficer
        default: null

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> FarmPolicy.id; policy being inspected"
      - name: inspector_id
        type: string
        source: input
        description: "FK -> Inspector.id; assigned loss-control inspector"
      - name: inspection_type
        type: enum
        source: input
        description: kind of visit; sets the hazard-score base
        constraints: "one of {INITIAL, RE_INSPECTION, LOSS_TRIGGERED}"
      - name: scheduled_for
        type: datetime
        source: input
        description: window start instant (ISO 8601 UTC)
      - name: duration_minutes
        type: integer
        source: input
        description: window length in minutes; the window is half-open [scheduled_for, scheduled_for + duration_minutes)
        constraints: ">= 30 and <= 480"
      - name: status
        type: enum
        source: system
        description: inspection lifecycle state
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, CANCELLED}"
      - name: completed_at
        type: datetime
        source: system
        description: instant the assigned inspector completed the visit
        default: null
      - name: hazard_score
        type: integer
        source: computed
        description: calculations.inspection_hazard_score output; retained while a re-inspection is pending
        default: 0
      - name: findings_summary
        type: string
        source: input
        description: narrative summary captured at completion
        default: null
      - name: recommendation_count
        type: integer
        source: computed
        description: number of Recommendation rows created by the most recent completion of this inspection
        default: 0

  - name: Recommendation
    parent: null
    common_fields: true
    fields:
      - name: inspection_id
        type: string
        source: system
        description: "FK -> Inspection.id; the completion that raised this loss-control recommendation"
      - name: severity
        type: enum
        source: input
        description: severity of the finding
        constraints: "one of {CRITICAL, MAJOR, MINOR}"
      - name: description
        type: string
        source: input
        description: recommendation text
        constraints: "1..240 chars, non-blank"
      - name: due_date
        type: string
        source: input
        description: compliance follow-up deadline (YYYY-MM-DD, inclusive)
      - name: sequence_no
        type: integer
        source: system
        description: 1-based position of this recommendation inside its inspection's findings array
      - name: status
        type: enum
        source: system
        description: follow-up state of the recommendation
        default: OPEN
        constraints: "one of {OPEN, OVERDUE, SUBMITTED, VERIFIED, WAIVED}"
      - name: evidence_note
        type: string
        source: input
        description: remediation evidence supplied by the agent
        default: null
      - name: completed_date
        type: string
        source: input
        description: date the agent states the remediation was completed (YYYY-MM-DD)
        default: null
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer that reviewed the evidence
        default: null

  - name: CatReservation
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: system
        description: "FK -> FarmPolicy.id; the policy occupying capacity"
      - name: pool_id
        type: string
        source: system
        description: "FK -> CatCapacityPool.id; the pool whose capacity is occupied"
      - name: peril
        type: enum
        source: system
        description: peril copied from the pool at reservation time
        constraints: "one of {HAIL, WIND, WILDFIRE}"
      - name: amount_cents
        type: integer
        source: computed
        description: round_half_up(FarmPolicy.exposed_tiv_cents * CatCapacityPool.participation_pct) at rating
        default: 0
      - name: utilization_at_rating
        type: number
        source: computed
        description: prospective utilization ratio used to pick the scarcity factor, 10 decimal places
        default: 0
      - name: scarcity_factor
        type: number
        source: computed
        description: scarcity multiplier selected from utilization_at_rating
        default: 1
      - name: load_cents
        type: integer
        source: computed
        description: this peril's contribution to FarmPolicy.cat_load_cents
        default: 0
      - name: status
        type: enum
        source: system
        description: capacity occupation state
        default: RESERVED
        constraints: "one of {RESERVED, COMMITTED, RELEASED}"

  - name: PremiumTransaction
    parent: null
    common_fields: false
    fields:
      - name: policy_id
        type: string
        source: system
        description: "FK -> FarmPolicy.id; the policy whose premium this entry moves"
      - name: sequence_no
        type: integer
        source: system
        description: 1-based monotone position of this entry within its policy; the only ordering key for reversal replay
      - name: txn_type
        type: enum
        source: system
        description: premium component this entry represents
        constraints: "one of {BASE_PROPERTY, BASE_LIVESTOCK, BASE_LIABILITY, CAT_LOAD, ENDORSEMENT_ADD, ENDORSEMENT_REMOVE, REVERSAL}"
      - name: reason_code
        type: enum
        source: system
        description: action that appended this entry
        constraints: "one of {RATING, RATING_REVERT, ENDORSEMENT_APPROVAL, ENDORSEMENT_RESCISSION, COMPLIANCE_SUSPENSION, COMPLIANCE_REINSTATEMENT, POLICY_DECLINE, POLICY_CANCELLATION}"
      - name: amount_cents
        type: integer
        source: computed
        description: signed cents; positive adds premium, negative removes it
      - name: reverses_sequence_no
        type: integer
        source: system
        description: sequence_no of the entry this REVERSAL mirrors; null on non-reversal entries
        default: null

# =============================================================================
# §1.2 State Machine Table
#
# FarmPolicy carries TWO independent status axes (uw_status, compliance_status);
# each axis is declared as its own machine over the same entity. LaborProfile,
# Inspection, Recommendation and Endorsement each contain cycles.
# =============================================================================

state_machines:

  - entity: FarmPolicy
    state_field: uw_status
    initial_state: DRAFT
    terminal_states: [DECLINED, CANCELLED]
    transitions:

      - from: DRAFT
        to: RATED
        trigger: "POST /farm-policies/{id}/rate — no referral trigger matches"
        actor: Underwriter | SeniorUnderwriter
        preconditions:
          - "uw_status == DRAFT"
          - "expected_policy_version == FarmPolicy.version"
          - "at least one ScheduledItem with status == ACTIVE or at least one LivestockGroup exists, so exposed_tiv_cents > 0"
          - "for each peril in the fixed order [HAIL, WIND, WILDFIRE] a CatCapacityPool with zone_code == FarmAccount.cat_zone_code and that peril exists"
          - "every one of those three pools has status == OPEN"
          - "for each of those pools, reserved_cents + committed_cents + this policy's reservation amount <= total_capacity_cents"
          - "no sibling FarmPolicy on the same account_id with uw_status IN {RATED, REFERRED, BOUND} has a term interval that overlaps [term_start_date, term_end_date] inclusively"
          - "none of the four referral triggers in calculations.referral_trigger_evaluation matches"
        side_effects:
          - "release step: every CatReservation of this policy with status == RESERVED is set to RELEASED (no-op on a first rating), and each affected CatCapacityPool recomputes reserved_cents / committed_cents / available_cents and increments its version by 1"
          - "sets rating_valuation_date = current logical clock instant, then recomputes ScheduledItem.insured_value_cents and ScheduledItem.valued_at for every ACTIVE item of this policy at that valuation date (calculations.scheduled_item_insured_value)"
          - "recomputes exposed_tiv_cents (calculations.exposed_tiv), property_premium_cents, livestock_premium_cents, liability_premium_cents (calculations.property_premium / livestock_premium / liability_exposure_premium)"
          - "creates exactly three CatReservation rows with status RESERVED, one per peril in the order [HAIL, WIND, WILDFIRE], each carrying amount_cents, utilization_at_rating, scarcity_factor and load_cents from calculations.cat_load"
          - "each of the three CatCapacityPool rows recomputes reserved_cents / available_cents and increments its version by 1"
          - "sets cat_load_cents = sum of the three CatReservation.load_cents and total_premium_cents = base_premium_cents + cat_load_cents"
          - "appends one PremiumTransaction per non-zero component in the fixed order [BASE_PROPERTY, BASE_LIVESTOCK, BASE_LIABILITY, CAT_LOAD] with reason_code RATING"
          - "sets quote_expires_at = rating_valuation_date + 30 days"
          - "clears referred_at, referred_by_user_id and referral_reason_code"
          - "increments FarmPolicy.version by 1"

      - from: DRAFT
        to: REFERRED
        trigger: "POST /farm-policies/{id}/rate — at least one referral trigger matches"
        actor: Underwriter | SeniorUnderwriter
        preconditions:
          - "identical to the DRAFT->RATED preconditions except that at least one referral trigger in calculations.referral_trigger_evaluation matches"
        side_effects:
          - "all premium, reservation, pool and ledger side effects of the DRAFT->RATED branch fire identically"
          - "DIVERGENT: quote_expires_at stays null on this branch"
          - "DIVERGENT: sets referred_at = current logical clock instant, referred_by_user_id = X-User-ID of the rating actor, and referral_reason_code = the first matching trigger"
          - "increments FarmPolicy.version by 1"

      - from: RATED
        to: DRAFT
        trigger: "POST /farm-policies/{id}/scheduled-items, PATCH /scheduled-items/{id}, POST /farm-policies/{id}/livestock-groups or POST /farm-policies/{id}/liability-exposures — any exposure mutation on a RATED policy"
        actor: Agent
        preconditions:
          - "uw_status == RATED"
        side_effects:
          - "every CatReservation of this policy with status == RESERVED is set to RELEASED; each affected CatCapacityPool recomputes reserved_cents / available_cents and increments its version by 1"
          - "appends one REVERSAL PremiumTransaction per prior non-reversed entry of this policy, replayed in sequence_no ASC order, each with amount_cents = -original.amount_cents, reverses_sequence_no = original.sequence_no and reason_code RATING_REVERT"
          - "zeroes property_premium_cents, livestock_premium_cents, liability_premium_cents, endorsement_premium_cents, base_premium_cents, cat_load_cents, total_premium_cents and exposed_tiv_cents"
          - "sets quote_expires_at = null and rating_valuation_date = null"
          - "every Endorsement of this policy with status == APPROVED is set to SUSPENDED (its premium was already reversed by the ledger replay above)"
          - "increments FarmPolicy.version by 1"
        note: "This is the revision cycle: the policy must be re-rated after any exposure change."

      - from: REFERRED
        to: DRAFT
        trigger: "POST /farm-policies/{id}/referral-decisions with decision == RETURN"
        actor: SeniorUnderwriter
        preconditions:
          - "uw_status == REFERRED"
          - "X-User-ID != referred_by_user_id"
        side_effects:
          - "identical release / reversal / zeroing side effects as the RATED->DRAFT transition"
          - "clears referred_at, referred_by_user_id and referral_reason_code"
          - "increments FarmPolicy.version by 1"

      - from: REFERRED
        to: RATED
        trigger: "POST /farm-policies/{id}/referral-decisions with decision == APPROVE"
        actor: SeniorUnderwriter
        preconditions:
          - "uw_status == REFERRED"
          - "X-User-ID != referred_by_user_id"
        side_effects:
          - "sets quote_expires_at = rating_valuation_date + 30 days"
          - "clears referred_at, referred_by_user_id and referral_reason_code"
          - "premiums, reservations and ledger entries are untouched — the referral decision does not re-rate"
          - "increments FarmPolicy.version by 1"

      - from: REFERRED
        to: DECLINED
        trigger: "POST /farm-policies/{id}/referral-decisions with decision == DECLINE"
        actor: SeniorUnderwriter
        preconditions:
          - "uw_status == REFERRED"
          - "X-User-ID != referred_by_user_id"
        side_effects:
          - "identical release / reversal / zeroing side effects as POST /farm-policies/{id}/decline, with reason_code POLICY_DECLINE on the reversal entries"
          - "increments FarmPolicy.version by 1"

      - from: RATED
        to: BOUND
        trigger: "POST /farm-policies/{id}/bind"
        actor: Underwriter
        preconditions:
          - "uw_status == RATED"
          - "expected_policy_version == FarmPolicy.version"
          - "compliance_status != SUSPENDED"
          - "no Recommendation with severity == CRITICAL and status == OVERDUE exists on any Inspection of this policy"
          - "a LaborProfile exists for this policy and its coordination_status IN {NOT_REQUIRED, VERIFIED}"
          - "if the LaborProfile has wc_expiry_date, that date >= the current logical clock date"
          - "Agent(FarmAccount.agent_id).appointment_status == ACTIVE"
          - "current logical clock instant <= quote_expires_at"
          - "for each of this policy's RESERVED CatReservation rows the pool has status == OPEN and reserved_cents + committed_cents <= total_capacity_cents"
          - "total_premium_cents <= Agent(FarmAccount.agent_id).authority_limit_cents"
        side_effects:
          - "every CatReservation of this policy with status == RESERVED is set to COMMITTED; each affected CatCapacityPool recomputes reserved_cents / committed_cents / available_cents and increments its version by 1"
          - "sets bound_at = current logical clock instant and bound_by_user_id = X-User-ID"
          - "increments FarmPolicy.version by 1"

      - from: DRAFT
        to: DECLINED
        trigger: "POST /farm-policies/{id}/decline"
        actor: Underwriter | SeniorUnderwriter
        preconditions:
          - "uw_status IN {DRAFT, RATED, REFERRED}"
        side_effects:
          - "every CatReservation of this policy with status == RESERVED is set to RELEASED; each affected CatCapacityPool recomputes reserved_cents / available_cents and increments its version by 1"
          - "appends one REVERSAL PremiumTransaction per prior non-reversed entry in sequence_no ASC order with reason_code POLICY_DECLINE"
          - "zeroes every premium field and exposed_tiv_cents; sets quote_expires_at = null"
          - "every Inspection of this policy with status == SCHEDULED is set to CANCELLED"
          - "sets closure_reason from the request body"
          - "increments FarmPolicy.version by 1"

      - from: RATED
        to: DECLINED
        trigger: "POST /farm-policies/{id}/decline"
        actor: Underwriter | SeniorUnderwriter
        preconditions:
          - "uw_status IN {DRAFT, RATED, REFERRED}"
        side_effects:
          - "identical to the DRAFT->DECLINED side effects"
          - "increments FarmPolicy.version by 1"

      - from: BOUND
        to: CANCELLED
        trigger: "POST /farm-policies/{id}/cancel"
        actor: Underwriter
        preconditions:
          - "uw_status == BOUND"
          - "expected_policy_version == FarmPolicy.version"
        side_effects:
          - "CASCADE HOP 1: uw_status becomes CANCELLED and closure_reason is stored"
          - "CASCADE HOP 2: because the policy left BOUND, every CatReservation of this policy with status == COMMITTED is set to RELEASED"
          - "CASCADE HOP 3: because those reservation rows changed status, each referenced CatCapacityPool recomputes committed_cents and available_cents and increments its version by 1"
          - "flat cancellation: appends one REVERSAL PremiumTransaction per prior non-reversed entry in sequence_no ASC order with reason_code POLICY_CANCELLATION, then zeroes every premium field"
          - "every Endorsement of this policy with status IN {APPROVED, SUSPENDED} is set to RESCINDED with premium_cents = 0"
          - "every Inspection of this policy with status == SCHEDULED is set to CANCELLED"
          - "increments FarmPolicy.version by 1"

  - entity: FarmPolicy
    state_field: compliance_status
    initial_state: NOT_INSPECTED
    terminal_states: []
    transitions:

      - from: NOT_INSPECTED
        to: RECS_OPEN
        trigger: "POST /inspections/{id}/complete on an inspection of this policy whose findings array is non-empty"
        actor: LossControlSpecialist
        preconditions:
          - "compliance_status IN {NOT_INSPECTED, COMPLIANT}"
          - "the completing inspection supplied at least one finding"
        side_effects:
          - "CASCADE HOP 3 (of the completion chain): because compliance_status left {NOT_INSPECTED, COMPLIANT}, every Endorsement of this policy with requires_inspection == true and status == APPROVED is set to SUSPENDED"
          - "CASCADE HOP 4: because each of those endorsements was suspended, one ENDORSEMENT_REMOVE PremiumTransaction with amount_cents = -Endorsement.premium_cents and reason_code COMPLIANCE_SUSPENSION is appended per suspended endorsement in Endorsement.created_at ASC order, and endorsement_premium_cents / base_premium_cents / total_premium_cents are decremented accordingly"
          - "increments FarmPolicy.version by 1"

      - from: COMPLIANT
        to: RECS_OPEN
        trigger: "POST /inspections/{id}/complete with a non-empty findings array"
        actor: LossControlSpecialist
        preconditions:
          - "compliance_status == COMPLIANT"
        side_effects:
          - "identical endorsement-suspension and ledger cascade as NOT_INSPECTED->RECS_OPEN"
          - "increments FarmPolicy.version by 1"

      - from: NOT_INSPECTED
        to: COMPLIANT
        trigger: "POST /inspections/{id}/complete with an empty findings array"
        actor: LossControlSpecialist
        preconditions:
          - "compliance_status IN {NOT_INSPECTED, RECS_OPEN, RECS_OVERDUE, SUSPENDED}"
          - "after this completion, no Recommendation of any Inspection of this policy has status IN {OPEN, OVERDUE, SUBMITTED}"
        side_effects:
          - "every Endorsement of this policy with status == SUSPENDED is set back to APPROVED, and one ENDORSEMENT_ADD PremiumTransaction with amount_cents = +Endorsement.premium_cents and reason_code COMPLIANCE_REINSTATEMENT is appended per reinstated endorsement in Endorsement.created_at ASC order"
          - "endorsement_premium_cents / base_premium_cents / total_premium_cents are incremented accordingly"
          - "increments FarmPolicy.version by 1"

      - from: RECS_OPEN
        to: RECS_OVERDUE
        trigger: "POST /compliance-sweeps — system checkpoint"
        actor: ComplianceOfficer | PlatformAdmin
        preconditions:
          - "compliance_status == RECS_OPEN"
          - "at least one Recommendation on an Inspection of this policy has status == OPEN and due_date < current logical clock date"
        side_effects:
          - "each such Recommendation is set to OVERDUE"
          - "increments FarmPolicy.version by 1"

      - from: RECS_OVERDUE
        to: SUSPENDED
        trigger: "POST /compliance-sweeps — system checkpoint"
        actor: ComplianceOfficer | PlatformAdmin
        preconditions:
          - "compliance_status == RECS_OVERDUE"
          - "uw_status IN {RATED, BOUND}"
          - "a single sweep run performs BOTH hops in one pass: it first ages the recommendation and moves the policy RECS_OPEN -> RECS_OVERDUE, then escalates that same policy to SUSPENDED"
          - "at least one Recommendation with severity == CRITICAL has status == OVERDUE"
        side_effects:
          - "every Endorsement of this policy with requires_inspection == true and status == APPROVED is set to SUSPENDED with the same ENDORSEMENT_REMOVE ledger entry as the RECS_OPEN cascade (reason_code COMPLIANCE_SUSPENSION)"
          - "increments FarmPolicy.version by 1"

      - from: RECS_OPEN
        to: COMPLIANT
        trigger: "POST /recommendations/{id}/review — the review that resolves the last unresolved recommendation"
        actor: ComplianceOfficer
        preconditions:
          - "compliance_status IN {RECS_OPEN, RECS_OVERDUE, SUSPENDED}"
          - "after this review, every Recommendation on every Inspection of this policy has status IN {VERIFIED, WAIVED}"
        side_effects:
          - "every Endorsement of this policy with status == SUSPENDED is set back to APPROVED and an ENDORSEMENT_ADD PremiumTransaction with reason_code COMPLIANCE_REINSTATEMENT is appended per reinstated endorsement in Endorsement.created_at ASC order"
          - "endorsement_premium_cents / base_premium_cents / total_premium_cents are incremented accordingly"
          - "increments FarmPolicy.version by 1"

      - from: RECS_OVERDUE
        to: COMPLIANT
        trigger: "POST /recommendations/{id}/review — the review that resolves the last unresolved recommendation"
        actor: ComplianceOfficer
        preconditions:
          - "identical to RECS_OPEN->COMPLIANT"
        side_effects:
          - "identical to RECS_OPEN->COMPLIANT"
          - "increments FarmPolicy.version by 1"

      - from: SUSPENDED
        to: COMPLIANT
        trigger: "POST /recommendations/{id}/review — the review that resolves the last unresolved recommendation"
        actor: ComplianceOfficer
        preconditions:
          - "identical to RECS_OPEN->COMPLIANT"
        side_effects:
          - "identical to RECS_OPEN->COMPLIANT"
          - "increments FarmPolicy.version by 1"

  - entity: Endorsement
    state_field: status
    initial_state: REQUESTED
    terminal_states: [REJECTED, RESCINDED]
    transitions:

      - from: REQUESTED
        to: APPROVED
        trigger: "POST /endorsements/{id}/decision with decision == APPROVE"
        actor: Underwriter | SeniorUnderwriter
        preconditions:
          - "status == REQUESTED"
          - "FarmPolicy.uw_status IN {RATED, BOUND}"
          - "FarmPolicy.compliance_status != SUSPENDED"
          - "if form_code == CHEMICAL_APPLICATION_BUYBACK, the policy has a LiabilityExposure with exposure_type == CUSTOM_FARMING"
          - "if requires_inspection == true, the policy has at least one Inspection with status == COMPLETED"
          - "if requires_inspection == true, the hazard_score of the latest COMPLETED Inspection (max completed_at, tie-break created_at ASC) is <= 35"
        side_effects:
          - "sets premium_cents = calculations.endorsement_premium output and decided_by_user_id = X-User-ID"
          - "appends one ENDORSEMENT_ADD PremiumTransaction with amount_cents = +premium_cents and reason_code ENDORSEMENT_APPROVAL"
          - "increments FarmPolicy.endorsement_premium_cents, base_premium_cents and total_premium_cents by premium_cents; cat_load_cents is NOT recomputed"
          - "increments FarmPolicy.version by 1 and Endorsement.version by 1"

      - from: REQUESTED
        to: REJECTED
        trigger: "POST /endorsements/{id}/decision with decision == REJECT"
        actor: Underwriter | SeniorUnderwriter
        preconditions:
          - "status == REQUESTED"
        side_effects:
          - "sets decision_note and decided_by_user_id; premium_cents stays 0"
          - "no PremiumTransaction is appended and no FarmPolicy field changes"
          - "increments Endorsement.version by 1"

      - from: APPROVED
        to: SUSPENDED
        trigger: "system cascade — FarmPolicy.compliance_status enters {RECS_OPEN, RECS_OVERDUE, SUSPENDED}, or the policy reverts RATED->DRAFT"
        actor: system
        preconditions:
          - "status == APPROVED"
          - "requires_inspection == true, OR the cascade source is a RATED->DRAFT revert (which suspends every APPROVED endorsement)"
        side_effects:
          - "premium_cents is retained on the row for later reinstatement"
          - "the suspending cascade appends the ENDORSEMENT_REMOVE ledger entry described on the compliance-axis transition"
          - "increments Endorsement.version by 1"

      - from: SUSPENDED
        to: APPROVED
        trigger: "system cascade — FarmPolicy.compliance_status returns to COMPLIANT"
        actor: system
        preconditions:
          - "status == SUSPENDED"
        side_effects:
          - "the reinstating cascade appends the ENDORSEMENT_ADD ledger entry with reason_code COMPLIANCE_REINSTATEMENT"
          - "increments Endorsement.version by 1"

      - from: APPROVED
        to: RESCINDED
        trigger: "POST /endorsements/{id}/rescind"
        actor: Underwriter
        preconditions:
          - "status IN {APPROVED, SUSPENDED}"
          - "FarmPolicy.uw_status IN {RATED, BOUND}"
        side_effects:
          - "appends one ENDORSEMENT_REMOVE PremiumTransaction with amount_cents = -premium_cents and reason_code ENDORSEMENT_RESCISSION when status was APPROVED; no ledger entry when status was SUSPENDED because that premium was already removed"
          - "decrements FarmPolicy.endorsement_premium_cents, base_premium_cents and total_premium_cents by the removed amount"
          - "sets premium_cents = 0"
          - "increments FarmPolicy.version by 1 and Endorsement.version by 1"

  - entity: Inspection
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /inspections/{id}/complete"
        actor: LossControlSpecialist
        preconditions:
          - "status == SCHEDULED"
          - "X-User-ID == inspector_id"
          - "FarmPolicy.uw_status NOT IN {DECLINED, CANCELLED}"
        side_effects:
          - "CASCADE HOP 1: sets completed_at, findings_summary, recommendation_count and hazard_score = calculations.inspection_hazard_score output"
          - "CASCADE HOP 1: creates one Recommendation with status OPEN per element of the findings array; sequence_no continues from the highest sequence_no already present on THIS inspection (so a first completion assigns 1..N in array order and a later re-inspection completion continues N+1..N+M)"
          - "CASCADE HOP 2: because at least one Recommendation now exists in status OPEN, FarmPolicy.compliance_status moves to RECS_OPEN (or to COMPLIANT when the findings array was empty and nothing is unresolved)"
          - "the compliance-axis transition then drives CASCADE HOPS 3 and 4 (endorsement suspension, ledger removal) declared on the compliance machine"
          - "increments Inspection.version by 1"

      - from: COMPLETED
        to: SCHEDULED
        trigger: "POST /inspections/{id}/reinspection"
        actor: Underwriter | ComplianceOfficer
        preconditions:
          - "status == COMPLETED"
          - "FarmPolicy.uw_status NOT IN {DECLINED, CANCELLED}"
          - "Inspector(inspector_id).status == ACTIVE"
          - "the new window does not collide with another inspection of the same inspector per validations priority 17"
          - "the inspector's booked minutes on the new UTC date plus duration_minutes <= Inspector.daily_capacity_minutes"
        side_effects:
          - "sets inspection_type = RE_INSPECTION, scheduled_for and duration_minutes from the body, completed_at = null"
          - "hazard_score and recommendation_count are retained until the re-inspection completes"
          - "existing Recommendation rows of this inspection are untouched"
          - "increments Inspection.version by 1"
        note: "The follow-up cycle: an inspection row can be driven back to SCHEDULED any number of times."

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system cascade — POST /farm-policies/{id}/decline, POST /farm-policies/{id}/cancel, or a referral DECLINE"
        actor: system
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "no Recommendation rows are created"
          - "increments Inspection.version by 1"

  - entity: Recommendation
    state_field: status
    initial_state: OPEN
    terminal_states: [VERIFIED, WAIVED]
    transitions:

      - from: OPEN
        to: OVERDUE
        trigger: "POST /compliance-sweeps — system checkpoint"
        actor: ComplianceOfficer | PlatformAdmin
        preconditions:
          - "status == OPEN"
          - "due_date < current logical clock date"
        side_effects:
          - "the owning policy's compliance_status moves RECS_OPEN -> RECS_OVERDUE"
          - "increments Recommendation.version by 1"

      - from: OPEN
        to: SUBMITTED
        trigger: "POST /recommendations/{id}/evidence"
        actor: Agent
        preconditions:
          - "status IN {OPEN, OVERDUE}"
          - "X-User-ID == Agent id on the owning FarmAccount"
          - "FarmPolicy.uw_status NOT IN {DECLINED, CANCELLED}"
        side_effects:
          - "stores evidence_note and completed_date"
          - "increments Recommendation.version by 1"

      - from: OVERDUE
        to: SUBMITTED
        trigger: "POST /recommendations/{id}/evidence"
        actor: Agent
        preconditions:
          - "status IN {OPEN, OVERDUE}"
        side_effects:
          - "stores evidence_note and completed_date; the policy's compliance_status is unchanged (still RECS_OVERDUE until every recommendation resolves)"
          - "increments Recommendation.version by 1"

      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /recommendations/{id}/review with decision == ACCEPT"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "sets reviewed_by_user_id"
          - "when this leaves no Recommendation of the policy in {OPEN, OVERDUE, SUBMITTED}, the policy's compliance_status moves to COMPLIANT and the endorsement reinstatement cascade fires"
          - "increments Recommendation.version by 1"

      - from: SUBMITTED
        to: OPEN
        trigger: "POST /recommendations/{id}/review with decision == REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "sets reviewed_by_user_id; evidence_note and completed_date are retained for the next attempt"
          - "the policy's compliance_status is unchanged"
          - "increments Recommendation.version by 1"
        note: "Remediation loop: evidence can be resubmitted after a rejection."

      - from: OPEN
        to: WAIVED
        trigger: "POST /recommendations/{id}/review with decision == WAIVE"
        actor: ComplianceOfficer
        preconditions:
          - "status IN {OPEN, OVERDUE, SUBMITTED}"
        side_effects:
          - "sets reviewed_by_user_id"
          - "when this leaves no Recommendation of the policy in {OPEN, OVERDUE, SUBMITTED}, the policy's compliance_status moves to COMPLIANT and the endorsement reinstatement cascade fires"
          - "increments Recommendation.version by 1"

      - from: OVERDUE
        to: WAIVED
        trigger: "POST /recommendations/{id}/review with decision == WAIVE"
        actor: ComplianceOfficer
        preconditions:
          - "status IN {OPEN, OVERDUE, SUBMITTED}"
        side_effects:
          - "identical to OPEN->WAIVED"
          - "increments Recommendation.version by 1"

  - entity: LaborProfile
    state_field: coordination_status
    initial_state: NOT_REQUIRED
    terminal_states: []
    transitions:

      - from: NOT_REQUIRED
        to: PENDING_PROOF
        trigger: "PUT /farm-policies/{id}/labor-profile — recomputed labor_exposure_units >= 6.00"
        actor: Agent
        preconditions:
          - "FarmPolicy.uw_status NOT IN {DECLINED, CANCELLED}"
        side_effects:
          - "recomputes labor_exposure_units and wc_required (calculations.labor_exposure_units)"
          - "clears verified_at and verified_by_user_id"
          - "does NOT change FarmPolicy.uw_status and does NOT touch premiums"
          - "increments LaborProfile.version by 1"

      - from: PENDING_PROOF
        to: NOT_REQUIRED
        trigger: "PUT /farm-policies/{id}/labor-profile — recomputed labor_exposure_units < 6.00"
        actor: Agent
        preconditions:
          - "FarmPolicy.uw_status NOT IN {DECLINED, CANCELLED}"
        side_effects:
          - "clears verified_at and verified_by_user_id"
          - "increments LaborProfile.version by 1"

      - from: PENDING_PROOF
        to: VERIFIED
        trigger: "POST /labor-profiles/{id}/wc-verification"
        actor: ComplianceOfficer
        preconditions:
          - "coordination_status == PENDING_PROOF"
          - "wc_carrier_name, wc_policy_number and wc_expiry_date are all non-null"
          - "wc_expiry_date >= current logical clock date"
        side_effects:
          - "sets verified_at = current logical clock instant and verified_by_user_id = X-User-ID"
          - "increments LaborProfile.version by 1"

      - from: VERIFIED
        to: LAPSED
        trigger: "POST /compliance-sweeps — system checkpoint"
        actor: ComplianceOfficer | PlatformAdmin
        preconditions:
          - "coordination_status == VERIFIED"
          - "wc_expiry_date < current logical clock date"
        side_effects:
          - "clears verified_at and verified_by_user_id"
          - "increments LaborProfile.version by 1"

      - from: LAPSED
        to: PENDING_PROOF
        trigger: "PUT /farm-policies/{id}/labor-profile with fresh proof fields"
        actor: Agent
        preconditions:
          - "recomputed labor_exposure_units >= 6.00"
        side_effects:
          - "increments LaborProfile.version by 1"
        note: "Closes the coordination cycle PENDING_PROOF -> VERIFIED -> LAPSED -> PENDING_PROOF."

      - from: VERIFIED
        to: PENDING_PROOF
        trigger: "PUT /farm-policies/{id}/labor-profile — every PUT invalidates a prior verification"
        actor: Agent
        preconditions:
          - "recomputed labor_exposure_units >= 6.00"
        side_effects:
          - "clears verified_at and verified_by_user_id"
          - "increments LaborProfile.version by 1"

  - entity: CatReservation
    state_field: status
    initial_state: RESERVED
    terminal_states: [RELEASED]
    transitions:

      - from: RESERVED
        to: COMMITTED
        trigger: "POST /farm-policies/{id}/bind"
        actor: Underwriter
        preconditions:
          - "status == RESERVED"
          - "CatCapacityPool.status == OPEN"
        side_effects:
          - "the pool's reserved_cents decreases and committed_cents increases by amount_cents; available_cents is unchanged; pool version increments by 1"
          - "increments CatReservation.version by 1"

      - from: RESERVED
        to: RELEASED
        trigger: "system cascade — rating revert, re-rating, decline, or referral DECLINE"
        actor: system
        preconditions:
          - "status == RESERVED"
        side_effects:
          - "the pool's reserved_cents decreases by amount_cents and available_cents increases by the same amount; pool version increments by 1"
          - "increments CatReservation.version by 1"

      - from: COMMITTED
        to: RELEASED
        trigger: "system cascade — POST /farm-policies/{id}/cancel"
        actor: system
        preconditions:
          - "status == COMMITTED"
        side_effects:
          - "the pool's committed_cents decreases by amount_cents and available_cents increases by the same amount; pool version increments by 1"
          - "increments CatReservation.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
#
# Only true CREATE-with-supersede situations appear here: a strictly later
# request that observes the same state would legitimately succeed, so the
# rejection can only come from a stale parent version.
# =============================================================================

concurrency_rules:

  - rule_id: endorsement-create-stale-policy
    parent_entity: FarmPolicy
    write_endpoint: "POST /farm-policies/{id}/endorsements"
    occ_field: "expected_policy_version"
    description: |
      Requesting an endorsement against a FarmPolicy whose version has advanced
      since the client last read it is rejected with a stale-version error. A
      policy legitimately accepts any number of endorsement requests, so the
      second create is not blocked by state; what makes it wrong is that the
      client's view of the policy predates the premium, reservation or
      compliance movement that another writer already applied, and the new
      endorsement would be priced against that superseded view.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

  - rule_id: pool-adjust-stale-pool
    parent_entity: CatCapacityPool
    write_endpoint: "PATCH /cat-capacity-pools/{id}"
    occ_field: "expected_pool_version"
    description: |
      Adjusting a catastrophe pool's total capacity or open/frozen status while
      holding a superseded version of that pool is rejected. Repeated capacity
      adjustments are legitimate, so nothing about the pool's state forbids the
      second write; the rejection exists because the adjustment was computed
      against a utilization picture that reservations have since moved.
    error_id: ERR_STALE_POOL_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
#
# Money is stored in integer cents. Every rounding step is
# round_half_up = Decimal(x).quantize(Decimal('1'), rounding=ROUND_HALF_UP).
# Every multi-step formula below pins its evaluation order explicitly; the
# order is load-bearing (see §1.8 combinatorial_formula instances).
# =============================================================================

calculations:

  - name: scheduled_item_insured_value
    applies_to: ScheduledItem.insured_value_cents
    algorithm: threshold
    trigger: "POST /farm-policies/{id}/scheduled-items, PATCH /scheduled-items/{id}, and re-evaluated for every ACTIVE item on POST /farm-policies/{id}/rate"
    inputs:
      - "ScheduledItem.item_class, valuation_basis, stated_value_cents, age_years, condition_grade"
      - "ScheduledItem.peak_season_value_cents, peak_season_start_month, peak_season_end_month"
      - "valuation month = calendar month (UTC) of FarmPolicy.rating_valuation_date when rating, otherwise of the current logical clock instant"
    constants:
      DEP_RATE_PER_YEAR: { DWELLING: 0.015, FARM_STRUCTURE: 0.025, EQUIPMENT: 0.070, STORED_CROP: 0, HAY: 0, INPUTS: 0 }
      MAX_DEP_PCT: 0.60
      CONDITION_FACTOR: { A: 1.00, B: 0.92, C: 0.80, D: 0.45 }
      SALVAGE_FLOOR_PCT: 0.20
      CLASS_CAP_CENTS: { DWELLING: 120000000, FARM_STRUCTURE: 60000000, EQUIPMENT: 40000000, STORED_CROP: 25000000, HAY: 15000000, INPUTS: 10000000 }
    formula: |
      STEP 1 — seasonal effective value (all item classes):
        if peak_season_start_month is null:
            in_peak = false
        elif peak_season_start_month <= peak_season_end_month:
            in_peak = (peak_season_start_month <= month <= peak_season_end_month)
        else:                                   # wrap-around season, e.g. 10..2
            in_peak = (month >= peak_season_start_month or month <= peak_season_end_month)
        effective_cents = peak_season_value_cents if in_peak else stated_value_cents

      STEP 2 — branch on valuation_basis (see `variants` below).

      STEP 3 — class cap and rounding are applied last on both branches.
    variants:
      - variant: RC
        when: "valuation_basis == 'RC'"
        formula: |
          insured_value_cents = round_half_up( min(effective_cents, CLASS_CAP_CENTS[item_class]) )
          age_years and condition_grade are read but contribute nothing on this branch.
      - variant: ACV
        when: "valuation_basis == 'ACV'"
        formula: |
          dep_pct       = min(MAX_DEP_PCT, DEP_RATE_PER_YEAR[item_class] * age_years)
          depreciated   = effective_cents * (1 - dep_pct) * CONDITION_FACTOR[condition_grade]
          salvage_floor = effective_cents * SALVAGE_FLOOR_PCT
          insured_value_cents = round_half_up( min( max(depreciated, salvage_floor),
                                                    CLASS_CAP_CENTS[item_class] ) )
          The floor is applied BEFORE the cap; reversing the two would let a
          floored value escape its class cap.
    precision: "integer cents, round_half_up once at the end of the branch; no intermediate rounding"
    worked_examples:
      - "RC / DWELLING, stated 40000000, age 22, grade B -> min(40000000, 120000000) = 40000000 (age and grade ignored)"
      - "ACV / FARM_STRUCTURE, stated 12000000, age 18, grade C, no season -> dep_pct = min(0.60, 0.025*18) = 0.45; depreciated = 12000000*0.55*0.80 = 5280000; floor = 2400000; cap 60000000 -> 5280000"
      - "ACV / EQUIPMENT, stated 30001000, age 12, grade B -> dep_pct = min(0.60, 0.84) = 0.60 (cap binds); depreciated = 30001000*0.40*0.92 = 11040368.0 -> floor 6000200 -> 11040368"
      - "ACV / EQUIPMENT, stated 8000000, age 12, grade D -> dep_pct = 0.60; depreciated = 8000000*0.40*0.45 = 1440000; floor = 1600000 -> max picks the floor -> 1600000"
      - "RC / STORED_CROP, stated 6005000, peak 18000000, season 10..2, valuation month 8 -> not in peak -> 6005000"
      - "RC / STORED_CROP, same row, valuation month 2 -> wrap-around season includes month 2 -> min(18000000, 25000000) = 18000000"
      - "RC / HAY, stated 2760000, peak 8280000, season 6..9, valuation month 8 -> in peak -> 8280000; at month 2 -> 2760000"

  - name: property_premium
    applies_to: FarmPolicy.property_premium_cents
    algorithm: aggregation
    trigger: "POST /farm-policies/{id}/rate"
    inputs:
      - "every ScheduledItem of the policy with status == ACTIVE (REMOVED items are excluded)"
      - "FarmPolicy.deductible_cents"
    constants:
      PROP_RATE: { DWELLING: 0.0040, FARM_STRUCTURE: 0.0065, EQUIPMENT: 0.0090, STORED_CROP: 0.0110, HAY: 0.0135, INPUTS: 0.0120 }
      DEDUCTIBLE_CREDIT_BANDS: |
        deductible_cents <   100000 -> 1.00
        deductible_cents <   500000 -> 0.95
        deductible_cents <  1000000 -> 0.90
        deductible_cents >= 1000000 -> 0.85
    formula: |
      credit = band(FarmPolicy.deductible_cents)
      PINNED ORDER — round every line, then sum the rounded lines:
        line_i = round_half_up( item_i.insured_value_cents * PROP_RATE[item_i.item_class] * credit )
        property_premium_cents = sum(line_i)
      Summing the unrounded products and rounding once at the end is WRONG and
      is observably different (see §1.8 combinatorial_formula).
      Items are visited in ScheduledItem.created_at ASC order; because addition
      of already-rounded integers commutes, the order does not change the total,
      but it does fix which line appears in a per-line breakdown.
    precision: "integer cents; one round_half_up per line; the sum is exact"
    worked_examples:
      - "deductible 500000 -> credit 0.90 (the < 500000 band does not apply at exactly 500000)"
      - "5 items with insured values 40000000 DWELLING / 5280000 FARM_STRUCTURE / 11040368 EQUIPMENT / 6005000 STORED_CROP / 8280000 HAY at credit 0.90 -> lines 144000, 30888, 89427 (89426.9808 rounds up), 59450 (exactly 59449.50 -> half-up), 100602 -> property_premium_cents = 424367"
      - "same five items summed before rounding: 424366.4808 -> 424366, which differs from the pinned 424367 by 1 cent"
      - "single DWELLING item, insured 40000000, credit 0.90 -> 144000"

  - name: livestock_covered_limit
    applies_to: LivestockGroup.covered_limit_cents
    algorithm: threshold
    trigger: "POST /farm-policies/{id}/livestock-groups (fixed at creation; never recomputed by rating)"
    inputs: ["LivestockGroup.limit_basis, head_count, per_head_value_cents, blanket_limit_cents"]
    constants:
      PER_HEAD_AGG_CAP_CENTS: 30000000
      BLANKET_COINSURANCE_PCT: 0.80
    formula: "branch on limit_basis (see `variants`)"
    variants:
      - variant: PER_HEAD
        when: "limit_basis == 'PER_HEAD'"
        formula: |
          covered_limit_cents = min( head_count * per_head_value_cents,
                                     PER_HEAD_AGG_CAP_CENTS )
          blanket_limit_cents must be absent on this branch.
      - variant: BLANKET
        when: "limit_basis == 'BLANKET'"
        formula: |
          covered_limit_cents = round_half_up( blanket_limit_cents * BLANKET_COINSURANCE_PCT )
          The aggregate cap does NOT apply on this branch; head_count and
          per_head_value_cents are recorded but do not enter the limit.
    precision: "integer cents, round_half_up on the BLANKET branch only"
    worked_examples:
      - "PER_HEAD, head_count 170, per_head_value 150000 -> min(25500000, 30000000) = 25500000"
      - "BLANKET, blanket_limit 25500000 -> 25500000*0.80 = 20400000 (same herd, 5100000 cents lower limit than the PER_HEAD election)"
      - "PER_HEAD, head_count 400, per_head_value 150000 -> min(60000000, 30000000) = 30000000 (cap binds)"

  - name: livestock_premium
    applies_to: FarmPolicy.livestock_premium_cents
    algorithm: aggregation
    trigger: "POST /farm-policies/{id}/rate"
    inputs: ["every LivestockGroup of the policy", "FarmPolicy.deductible_cents"]
    constants:
      LIVE_RATE: { CATTLE: 0.0125, SWINE: 0.0180, POULTRY: 0.0240, SHEEP: 0.0150, EQUINE: 0.0300 }
      PERIL_RESTRICTION: { FULL_PERIL: 1.00, NAMED_PERIL: 0.85, CATASTROPHE_ONLY: 0.60 }
    formula: |
      credit = the same deductible credit band used by property_premium
      line_g = round_half_up( group.covered_limit_cents
                              * LIVE_RATE[group.species]
                              * PERIL_RESTRICTION[group.peril_scope]
                              * credit )
      livestock_premium_cents = sum(line_g)          # round per group, then sum
    precision: "integer cents; one round_half_up per group"
    worked_examples:
      - "CATTLE, covered 25500000, FULL_PERIL, credit 0.90 -> 25500000*0.0125*1.00*0.90 = 286875"
      - "same herd on the BLANKET election, covered 20400000 -> 229500 (delta 57375 against the PER_HEAD election)"
      - "CATTLE, covered 25500000, CATASTROPHE_ONLY, credit 0.90 -> 25500000*0.0125*0.60*0.90 = 172125"

  - name: liability_exposure_premium
    applies_to: LiabilityExposure.exposure_premium_cents
    algorithm: tiered_pricing
    trigger: "POST /farm-policies/{id}/liability-exposures (fixed at creation)"
    inputs:
      - "LiabilityExposure.exposure_type, annual_receipts_cents, annual_visitor_count"
      - "FarmAccount.acreage (GENERAL_FARM only)"
    constants:
      GENERAL_FARM: { base_cents: 25000, per_acre_cents: 90, cap_cents: 500000 }
      CUSTOM_FARMING: { base_cents: 45000, receipts_rate: 0.0075, cap_cents: 900000 }
      AGRITOURISM: { base_cents: 60000, free_visitors: 500, per_visitor_cents: 120, receipts_rate: 0.0040, cap_cents: 800000 }
      ROADSIDE_STAND: { base_cents: 30000, receipts_rate: 0.0050, cap_cents: 300000 }
    formula: |
      GENERAL_FARM:    raw = 25000 + round_half_up(FarmAccount.acreage * 90)
      CUSTOM_FARMING:  raw = 45000 + round_half_up(annual_receipts_cents * 0.0075)
      AGRITOURISM:     raw = 60000
                             + max(annual_visitor_count - 500, 0) * 120
                             + round_half_up(annual_receipts_cents * 0.0040)
      ROADSIDE_STAND:  raw = 30000 + round_half_up(annual_receipts_cents * 0.0050)
      exposure_premium_cents = min(raw, cap_cents[exposure_type])
      The deductible credit is NOT applied to liability lines — it is a property
      and livestock concept only.
    precision: "integer cents; round_half_up on each receipts/acreage term before summing"
    worked_examples:
      - "GENERAL_FARM, acreage 1200 -> 25000 + 108000 = 133000 (cap 500000 not reached)"
      - "AGRITOURISM, visitors 800, receipts 4000000 -> 60000 + 300*120 + 16000 = 112000"
      - "AGRITOURISM, visitors 2500, receipts 4000000 -> 60000 + 2000*120 + 16000 = 316000"
      - "CUSTOM_FARMING, receipts 15000000 -> 45000 + 112500 = 157500"
      - "ROADSIDE_STAND, receipts 90000000 -> 30000 + 450000 = 480000 -> capped to 300000"

  - name: liability_premium_rollup
    applies_to: FarmPolicy.liability_premium_cents
    algorithm: aggregation
    trigger: "POST /farm-policies/{id}/rate"
    inputs: ["every LiabilityExposure of the policy"]
    formula: "liability_premium_cents = sum(exposure.exposure_premium_cents) over all LiabilityExposure rows of the policy (each already rounded at creation)"
    precision: "integer cents; exact sum"
    worked_examples:
      - "GENERAL_FARM 133000 + AGRITOURISM 112000 + CUSTOM_FARMING 157500 -> 402500"

  - name: exposed_tiv
    applies_to: FarmPolicy.exposed_tiv_cents
    algorithm: aggregation
    trigger: "POST /farm-policies/{id}/rate"
    inputs:
      - "every ScheduledItem of the policy with status == ACTIVE"
      - "every LivestockGroup of the policy"
    formula: |
      exposed_tiv_cents = sum(item.insured_value_cents for ACTIVE items)
                        + sum(group.covered_limit_cents for all groups)
      Liability exposures and endorsement sublimits are NOT part of the
      catastrophe-exposed total insured value.
    precision: "integer cents; exact sum of already-rounded values"
    worked_examples:
      - "items 40000000 + 5280000 + 11040368 + 6005000 + 8280000 = 70605368, plus livestock 25500000 -> 96105368"
      - "same policy rated in February (seasonal values in peak: STORED_CROP 18000000, HAY 2760000) -> 102580368"

  - name: cat_load
    applies_to: "FarmPolicy.cat_load_cents and the three CatReservation rows it creates"
    algorithm: waterfall_allocation
    trigger: "POST /farm-policies/{id}/rate"
    inputs:
      - "FarmPolicy.exposed_tiv_cents (already recomputed in this same rating call)"
      - "the CatCapacityPool rows for FarmAccount.cat_zone_code, one per peril"
      - "each pool's reserved_cents and committed_cents AFTER this policy's own prior RESERVED rows were released"
    constants:
      PERIL_ORDER: [HAIL, WIND, WILDFIRE]
      CAT_RATE: { HAIL: 0.0032, WIND: 0.0021, WILDFIRE: 0.0045 }
      SCARCITY_TIERS: |
        prospective_utilization <= 0.50 -> 1.00
        prospective_utilization <= 0.75 -> 1.15
        prospective_utilization <= 0.90 -> 1.35
        prospective_utilization <= 1.00 -> 1.60
        prospective_utilization  > 1.00 -> reject with ERR_CAT_CAPACITY_EXCEEDED
    formula: |
      PINNED ORDER — for each peril p in PERIL_ORDER (HAIL, then WIND, then WILDFIRE):
        1. amount_cents   = round_half_up(exposed_tiv_cents * pool_p.participation_pct)
        2. prospective_utilization = (pool_p.reserved_cents + pool_p.committed_cents
                                      + amount_cents) / pool_p.total_capacity_cents
           evaluated as an exact rational / Decimal ratio, NOT rounded first
        3. scarcity_factor = tier(prospective_utilization); a ratio strictly
           greater than 1.00 aborts the whole rating call with
           ERR_CAT_CAPACITY_EXCEEDED and leaves no reservation behind
        4. load_cents      = round_half_up(amount_cents * CAT_RATE[p] * scarcity_factor)
        5. a CatReservation row is written with amount_cents,
           utilization_at_rating = prospective_utilization rounded to 6 dp,
           scarcity_factor and load_cents
        6. pool_p.reserved_cents grows by amount_cents so the NEXT peril in the
           order sees the updated figure only for its own pool (pools are
           per-peril, so the three amounts are independent)
      cat_load_cents = sum of the three load_cents
      The deductible credit is NOT applied to the catastrophe load.
      Rounding the utilization ratio before the tier lookup, or applying the
      scarcity factor to the TIV instead of to the rated amount, both produce
      observably different loads (see §1.8 combinatorial_formula).
    precision: "amount_cents and load_cents are integer cents via round_half_up; utilization_at_rating is a ratio stored to 6 decimal places"
    worked_examples:
      - "tiv 96105368, three pools of total_capacity 200000000 each with participation 0.50 / 0.30 / 0.20, all empty -> amounts 48052684 / 28831610 / 19221074; utilizations 0.240263 / 0.144158 / 0.096105 -> all factor 1.00; loads 153769 / 60546 / 86495 -> cat_load_cents = 300810"
      - "tiv 40000000, participation 0.50, HAIL pool total 40000000, empty -> amount 20000000, utilization exactly 0.500000 -> factor 1.00 -> load 64000"
      - "same, HAIL pool total 39999999 -> utilization 0.500000013 > 0.50 -> factor 1.15 -> load round_half_up(20000000*0.0032*1.15) = 73600"
      - "same, HAIL pool total 21000000 -> utilization 0.952381 -> factor 1.60 -> load 102400"
      - "same, HAIL pool total 30000000 with 20000000 already RESERVED -> utilization 1.333333 > 1.00 -> ERR_CAT_CAPACITY_EXCEEDED, no CatReservation rows written for any peril"

  - name: premium_rollup
    applies_to: "FarmPolicy.base_premium_cents and FarmPolicy.total_premium_cents"
    algorithm: aggregation
    trigger: "POST /farm-policies/{id}/rate and every endorsement approval, rescission, compliance suspension or reinstatement"
    inputs: ["property_premium_cents", "livestock_premium_cents", "liability_premium_cents", "endorsement_premium_cents", "cat_load_cents"]
    formula: |
      base_premium_cents  = property_premium_cents + livestock_premium_cents
                          + liability_premium_cents + endorsement_premium_cents
      total_premium_cents = base_premium_cents + cat_load_cents
      endorsement_premium_cents is the sum of premium_cents over this policy's
      Endorsement rows with status == APPROVED (SUSPENDED, REJECTED and
      RESCINDED rows contribute zero). An endorsement approval therefore moves
      base and total but NEVER re-derives cat_load_cents — the catastrophe load
      is frozen at the rating that produced the current reservations.
    precision: "integer cents; exact sums"
    worked_examples:
      - "property 424367 + livestock 286875 + liability 402500 + endorsements 0 = base 1113742; + cat_load 300810 -> total 1414552"
      - "then a POLLUTION_BUYBACK endorsement of 150000 is approved -> endorsement 150000, base 1263742, total 1564552, cat_load still 300810"

  - name: endorsement_premium
    applies_to: Endorsement.premium_cents
    algorithm: threshold
    trigger: "POST /endorsements/{id}/decision with decision == APPROVE"
    inputs: ["Endorsement.form_code", "Endorsement.sublimit_cents"]
    constants:
      POLLUTION_BUYBACK: { rate: 0.0150, min_cents: 75000 }
      CHEMICAL_APPLICATION_BUYBACK: { rate: 0.0220, min_cents: 90000 }
      AGRITOURISM_LIABILITY: { rate: 0.0090, flat_cents: 25000 }
      PEAK_SEASON_INCREASE: { rate: 0.0110 }
    formula: |
      POLLUTION_BUYBACK:            max(round_half_up(sublimit_cents * 0.0150), 75000)
      CHEMICAL_APPLICATION_BUYBACK: max(round_half_up(sublimit_cents * 0.0220), 90000)
      AGRITOURISM_LIABILITY:        round_half_up(sublimit_cents * 0.0090) + 25000
      PEAK_SEASON_INCREASE:         round_half_up(sublimit_cents * 0.0110)
      A REQUESTED endorsement carries premium_cents = 0; the value is written
      only by an APPROVE decision and reset to 0 on rescission.
    precision: "integer cents, round_half_up before the minimum / flat adder is applied"
    worked_examples:
      - "POLLUTION_BUYBACK, sublimit 10000000 -> max(150000, 75000) = 150000"
      - "POLLUTION_BUYBACK, sublimit 4000000 -> max(60000, 75000) = 75000 (floor binds)"
      - "CHEMICAL_APPLICATION_BUYBACK, sublimit 5000000 -> max(110000, 90000) = 110000"
      - "AGRITOURISM_LIABILITY, sublimit 25000000 -> 225000 + 25000 = 250000"
      - "PEAK_SEASON_INCREASE, sublimit 12000000 -> 132000"

  - name: labor_exposure_units
    applies_to: "LaborProfile.labor_exposure_units and LaborProfile.wc_required"
    algorithm: weighted_scoring
    trigger: "PUT /farm-policies/{id}/labor-profile"
    inputs: ["LaborProfile.full_time_count", "seasonal_count", "migrant_h2a_count"]
    constants:
      WEIGHT_FULL_TIME: 1.00
      WEIGHT_SEASONAL: 0.50
      WEIGHT_MIGRANT_H2A: 0.75
      WC_REQUIRED_THRESHOLD: 6.00
    formula: |
      labor_exposure_units = round_half_up_2dp( full_time_count * 1.00
                                              + seasonal_count * 0.50
                                              + migrant_h2a_count * 0.75 )
      wc_required = (labor_exposure_units >= 6.00)      # inclusive at the boundary
      coordination_status is then recomputed from scratch on every PUT:
        NOT_REQUIRED when wc_required is false, PENDING_PROOF when it is true.
    precision: "labor_exposure_units carries exactly 2 decimal places, round_half_up"
    worked_examples:
      - "(4, 4, 0) -> 4.00 + 2.00 + 0.00 = 6.00 -> wc_required true (threshold is inclusive)"
      - "(3, 4, 0) -> 5.00 -> wc_required false"
      - "(3, 4, 2) -> 3.00 + 2.00 + 1.50 = 6.50 -> wc_required true"
      - "(2, 4, 3) -> 2.00 + 2.00 + 2.25 = 6.25 -> wc_required true"
      - "(0, 0, 0) -> 0.00 -> wc_required false"

  - name: inspection_hazard_score
    applies_to: "Inspection.hazard_score and Inspection.recommendation_count"
    algorithm: weighted_scoring
    trigger: "POST /inspections/{id}/complete"
    inputs: ["Inspection.inspection_type", "the severity of each element of the findings array supplied to the completion call"]
    constants:
      BASE_SCORE: { INITIAL: 10, RE_INSPECTION: 5, LOSS_TRIGGERED: 20 }
      SEVERITY_WEIGHT: { CRITICAL: 30, MAJOR: 12, MINOR: 4 }
      SCORE_CAP: 100
    formula: |
      hazard_score = min( SCORE_CAP,
                          BASE_SCORE[inspection_type]
                          + sum(SEVERITY_WEIGHT[f.severity] for f in findings) )
      recommendation_count = len(findings)
      Only the findings supplied to THIS completion call are scored;
      recommendations carried over from an earlier inspection of the same policy
      do not contribute to this inspection's hazard_score.
    precision: "integer 0..100"
    worked_examples:
      - "INITIAL with findings [MAJOR, MINOR] -> 10 + 12 + 4 = 26, recommendation_count 2"
      - "INITIAL with findings [CRITICAL] -> 10 + 30 = 40 (exactly at the referral threshold)"
      - "INITIAL with an empty findings array -> 10, recommendation_count 0"
      - "INITIAL with [CRITICAL, MAJOR, MAJOR] -> 10 + 30 + 12 + 12 = 64"
      - "RE_INSPECTION with [MINOR] -> 5 + 4 = 9"
      - "LOSS_TRIGGERED with [CRITICAL, CRITICAL, CRITICAL] -> min(100, 20 + 90) = 100 (cap binds)"

  - name: referral_trigger_evaluation
    applies_to: "FarmPolicy.uw_status (RATED vs REFERRED) and FarmPolicy.referral_reason_code"
    algorithm: threshold
    trigger: "POST /farm-policies/{id}/rate, after every premium and reservation figure has been computed"
    inputs:
      - "FarmPolicy.exposed_tiv_cents"
      - "the annual_visitor_count of every LiabilityExposure with exposure_type == AGRITOURISM"
      - "the prospective_utilization of each of the three CatReservation rows just written"
      - "the hazard_score of the latest COMPLETED Inspection of the policy"
    constants:
      TIV_REFERRAL_LIMIT_CENTS: 250000000
      AGRITOURISM_VISITOR_LIMIT: 2000
      CAT_UTILIZATION_LIMIT: 0.90
      HAZARD_SCORE_LIMIT: 40
    formula: |
      PINNED EVALUATION ORDER — the FIRST matching trigger wins and becomes
      referral_reason_code; later matches are not recorded:
        1. exposed_tiv_cents > 250000000                     -> TIV_ABOVE_LIMIT
        2. max AGRITOURISM annual_visitor_count > 2000       -> AGRITOURISM_VISITORS
        3. any peril's prospective_utilization > 0.90        -> CAT_UTILIZATION_HIGH
        4. latest COMPLETED Inspection hazard_score >= 40    -> HAZARD_SCORE_HIGH
      "latest COMPLETED" = max completed_at, ties broken by created_at ASC.
      Trigger 4 is inclusive (>= 40); triggers 1-3 are strict.
      If none match, uw_status becomes RATED and quote_expires_at is set.
    precision: "exact integer / Decimal comparisons; the utilization ratio is compared unrounded"
    worked_examples:
      - "tiv 250000000 exactly -> trigger 1 does NOT fire"
      - "tiv 250000001 -> TIV_ABOVE_LIMIT even if a later trigger also matches"
      - "AGRITOURISM visitors 2000 -> no referral; 2001 -> AGRITOURISM_VISITORS"
      - "HAIL prospective_utilization 0.952381 -> CAT_UTILIZATION_HIGH"
      - "latest COMPLETED inspection hazard_score 40 -> HAZARD_SCORE_HIGH; 39 -> no referral"

  - name: premium_ledger_projection
    applies_to: "the PremiumTransaction stream of a FarmPolicy"
    algorithm: projection
    trigger: "every write that moves a premium figure (rate, revert, endorsement decision, rescission, compliance suspension / reinstatement, decline, cancel)"
    inputs: ["all PremiumTransaction rows of the policy ordered by sequence_no ASC"]
    formula: |
      sequence_no is assigned 1, 2, 3, ... per policy and is the ONLY ordering
      key for the ledger; created_at is never used to order entries.
      INVARIANT: sum(amount_cents over all PremiumTransaction rows of a policy)
                 == FarmPolicy.total_premium_cents
      at every observable point in the policy's life.
      A reversal batch replays the prior non-reversed entries in sequence_no ASC
      order, emitting one REVERSAL row per source entry with
      amount_cents = -source.amount_cents and reverses_sequence_no =
      source.sequence_no. An entry that already has a REVERSAL pointing at it is
      never reversed twice.
    precision: "integer cents; signed amounts"
    worked_examples:
      - "after rating: BASE_PROPERTY 424367, BASE_LIVESTOCK 286875, BASE_LIABILITY 402500, CAT_LOAD 300810 -> sequence_no 1..4, sum 1414552 == total_premium_cents"
      - "after an exposure change reverts the policy to DRAFT: four REVERSAL rows at sequence_no 5..8 with amounts -424367, -286875, -402500, -300810 and reverses_sequence_no 1..4 -> ledger sum 0 == total_premium_cents 0"
      - "a zero-value component is not written: a policy with no LivestockGroup emits no BASE_LIVESTOCK row, so its rating ledger is sequence_no 1..3"

  - name: quote_expiry
    applies_to: FarmPolicy.quote_expires_at
    algorithm: forward_looking
    trigger: "POST /farm-policies/{id}/rate (RATED branch) and POST /farm-policies/{id}/referral-decisions with decision == APPROVE"
    inputs: ["FarmPolicy.rating_valuation_date", "current logical clock instant"]
    constants:
      QUOTE_VALID_DAYS: 30
    formula: |
      quote_expires_at = rating_valuation_date + 30 days (exact instant arithmetic)
      Binding requires current_clock <= quote_expires_at, so the expiry instant
      itself is still bindable and the first non-bindable instant is one second
      later. A referral that ends in APPROVE re-derives the expiry from the
      ORIGINAL rating_valuation_date, not from the decision instant.
    precision: "ISO-8601 UTC instant"
    worked_examples:
      - "rating at 2026-08-15T00:00:00Z -> quote_expires_at 2026-09-14T00:00:00Z; bind at 2026-09-14T00:00:00Z succeeds, bind at 2026-09-14T00:00:01Z -> ERR_QUOTE_EXPIRED"
      - "rating with the clock never set (server default 2026-08-01T00:00:00Z) -> quote_expires_at 2026-08-31T00:00:00Z"

  - name: inspector_day_load
    applies_to: "the capacity check on POST /inspections and POST /inspections/{id}/reinspection"
    algorithm: aggregation
    trigger: "POST /inspections, POST /inspections/{id}/reinspection"
    inputs:
      - "every Inspection of the same inspector_id with status == SCHEDULED whose scheduled_for falls on the same UTC calendar date as the requested window"
      - "Inspector.daily_capacity_minutes"
    formula: |
      booked = sum(duration_minutes of those SCHEDULED inspections)
      The row being re-scheduled by POST /inspections/{id}/reinspection is
      excluded from `booked` (it is being replaced, not duplicated).
      Requirement: booked + requested duration_minutes <= daily_capacity_minutes
      COMPLETED and CANCELLED inspections never consume capacity.
    precision: "integer minutes"
    worked_examples:
      - "capacity 240, existing SCHEDULED 120 minutes, request 120 -> 240 <= 240, accepted"
      - "capacity 240, existing SCHEDULED 120 minutes, request 180 -> 300 > 240 -> ERR_INSPECTOR_DAY_CAPACITY_EXCEEDED"
      - "capacity 240, existing 300 minutes but all COMPLETED, request 180 -> accepted"

# =============================================================================
# §1.4 Validation Rules — strict priority ladder
#
# Checks run in ascending `priority`. The FIRST violated rule determines the
# response; no later check is evaluated, and no side effect of any kind is
# applied when a check fails. Within one priority, the `order_within_priority`
# note pins the tie-break.
# =============================================================================

validations:

  - priority: 1
    category: auth
    rule: "The X-User-ID header must be present and non-blank on every endpoint except POST /_clock/set_current_utc."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: permission
    rule: "The caller's role (resolved from X-User-ID against §1.7) must appear in the `roles` list of the endpoint being called."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
    note: "Evaluated before any body parsing, so a role violation outranks a malformed payload."

  - priority: 3
    category: schema
    rule: |
      Body and query validation, all reported as ERR_INVALID_REQUEST:
        - a required input field of the endpoint is missing or null
        - a field has the wrong JSON type
        - an enum field carries a value outside its §1.1 constraint set
        - a numeric field violates its declared range (e.g. head_count < 1,
          duration_minutes outside 30..480, participation_pct outside (0,1],
          month fields outside 1..12, negative *_cents, acreage <= 0)
        - a string field is blank or exceeds its length bound
        - pagination limit outside 1..100 or offset < 0
        - an unknown field is present in the body
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a body or query string"
    order_within_priority: "missing required fields are reported before type errors, type errors before enum errors, enum errors before range errors, in the field order declared in §1.1"

  - priority: 3
    category: schema
    rule: "On POST /farm-policies, term_end_date must be strictly after term_start_date and the term must span at least 90 days."
    error_id: ERR_INVALID_TERM_DATES
    http_status: 400
    applies_to: "POST /farm-policies"
    order_within_priority: "evaluated after the field-level checks of the same priority"

  - priority: 4
    category: existence
    rule: "Every {id} in the path must resolve to a live row, checked LEFT TO RIGHT: the leftmost unresolvable path id determines the 404."
    error_id: "ERR_<ENTITY>_NOT_FOUND (see §1.6)"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 5
    category: existence
    rule: "Every id referenced from the request BODY must resolve: FarmPolicy.account_id, Inspection.policy_id and Inspection.inspector_id."
    error_id: "ERR_FARM_ACCOUNT_NOT_FOUND / ERR_FARM_POLICY_NOT_FOUND / ERR_INSPECTOR_NOT_FOUND"
    http_status: 404
    applies_to: "POST /farm-policies, POST /inspections"
    order_within_priority: "body ids are checked in the order the fields are declared in §1.5 `input`"

  - priority: 6
    category: ownership
    rule: |
      A caller acting in the Agent role may only read or write rows reachable
      from a FarmAccount whose agent_id equals its X-User-ID.
    error_id: ERR_NOT_ACCOUNT_AGENT
    http_status: 403
    applies_to: "all Agent-role endpoints and Agent-role reads of account-scoped rows"

  - priority: 6
    category: ownership
    rule: "POST /inspections/{id}/complete requires X-User-ID == Inspection.inspector_id; another LossControlSpecialist cannot complete a peer's inspection."
    error_id: ERR_NOT_ASSIGNED_INSPECTOR
    http_status: 403
    applies_to: "POST /inspections/{id}/complete"
    order_within_priority: "evaluated after ERR_NOT_ACCOUNT_AGENT"

  - priority: 7
    category: segregation_of_duties
    rule: "On POST /farm-policies/{id}/referral-decisions, X-User-ID must differ from FarmPolicy.referred_by_user_id — the underwriter whose rating produced the referral cannot decide it."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /farm-policies/{id}/referral-decisions"

  - priority: 8
    category: occ
    rule: "When the endpoint declares expected_policy_version, it must equal the current FarmPolicy.version."
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412
    applies_to: "POST /farm-policies/{id}/rate, POST /farm-policies/{id}/bind, POST /farm-policies/{id}/cancel, POST /farm-policies/{id}/endorsements"

  - priority: 8
    category: occ
    rule: "PATCH /cat-capacity-pools/{id} requires expected_pool_version == CatCapacityPool.version."
    error_id: ERR_STALE_POOL_VERSION
    http_status: 412
    applies_to: "PATCH /cat-capacity-pools/{id}"

  - priority: 9
    category: state
    rule: |
      The target row must be in a state from which the requested transition
      exists in §1.2:
        - rate / exposure writes / PATCH scheduled-item      -> policy uw_status must be DRAFT or RATED
        - referral-decisions                                 -> uw_status == REFERRED
        - bind                                               -> uw_status == RATED
        - decline                                            -> uw_status IN {DRAFT, RATED, REFERRED}
        - cancel                                             -> uw_status == BOUND
        - endorsement create / decision                      -> uw_status IN {RATED, BOUND}
        - endorsement decision                               -> status == REQUESTED
        - endorsement rescind                                -> status IN {APPROVED, SUSPENDED}
        - inspection complete                                -> status == SCHEDULED
        - inspection reinspection                            -> status == COMPLETED
        - recommendation evidence                            -> status IN {OPEN, OVERDUE}
        - recommendation review ACCEPT/REJECT                -> status == SUBMITTED
        - recommendation review WAIVE                        -> status IN {OPEN, OVERDUE, SUBMITTED}
        - wc-verification                                    -> coordination_status == PENDING_PROOF
      A policy in a terminal uw_status (DECLINED, CANCELLED) rejects every
      mutating call on itself or on any of its children.
    error_id: "ERR_POLICY_NOT_IN_DRAFT / ERR_POLICY_NOT_RATED / ERR_POLICY_NOT_REFERRED / ERR_POLICY_NOT_BOUND / ERR_POLICY_TERMINAL / ERR_ENDORSEMENT_NOT_REQUESTED / ERR_ENDORSEMENT_NOT_APPROVED / ERR_INSPECTION_STATE_INVALID / ERR_RECOMMENDATION_STATE_INVALID / ERR_WC_STATE_INVALID"
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 10
    category: conditional_field
    rule: "blanket_limit_cents is required when limit_basis == BLANKET and must be absent when limit_basis == PER_HEAD."
    error_id: ERR_BLANKET_LIMIT_REQUIRED
    http_status: 422
    applies_to: "POST /farm-policies/{id}/livestock-groups"

  - priority: 10
    category: conditional_field
    rule: "peak_season_value_cents, peak_season_start_month and peak_season_end_month must all three be present when item_class IN {STORED_CROP, HAY, INPUTS} and all three absent otherwise; peak_season_value_cents must be >= stated_value_cents."
    error_id: ERR_PEAK_SEASON_FIELDS_REQUIRED
    http_status: 422
    applies_to: "POST /farm-policies/{id}/scheduled-items, PATCH /scheduled-items/{id}"
    order_within_priority: "checked after ERR_BLANKET_LIMIT_REQUIRED (different endpoints, so the two never collide)"

  - priority: 10
    category: conditional_field
    rule: "annual_visitor_count is required when exposure_type == AGRITOURISM and must be absent for every other exposure_type."
    error_id: ERR_VISITOR_COUNT_REQUIRED
    http_status: 422
    applies_to: "POST /farm-policies/{id}/liability-exposures"

  - priority: 11
    category: business_safety
    rule: "No policy whose compliance_status == SUSPENDED may be bound, may accept a new endorsement request, or may have an endorsement approved."
    error_id: ERR_COMPLIANCE_SUSPENDED
    http_status: 409
    applies_to: "POST /farm-policies/{id}/bind, POST /farm-policies/{id}/endorsements, POST /endorsements/{id}/decision"
    order_within_priority: "first check of priority 11"

  - priority: 11
    category: business_safety
    rule: "A policy with any CRITICAL Recommendation in status OVERDUE cannot be bound."
    error_id: ERR_CRITICAL_REC_OVERDUE
    http_status: 422
    applies_to: "POST /farm-policies/{id}/bind"
    order_within_priority: "second check of priority 11 — evaluated after ERR_COMPLIANCE_SUSPENDED"

  - priority: 11
    category: business_safety
    rule: "Approving an endorsement whose requires_inspection == true needs at least one COMPLETED Inspection on the policy."
    error_id: ERR_BUYBACK_INSPECTION_REQUIRED
    http_status: 422
    applies_to: "POST /endorsements/{id}/decision"
    order_within_priority: "third check of priority 11"

  - priority: 11
    category: business_safety
    rule: "Approving an endorsement whose requires_inspection == true needs the latest COMPLETED Inspection to carry hazard_score <= 35."
    error_id: ERR_BUYBACK_HAZARD_TOO_HIGH
    http_status: 422
    applies_to: "POST /endorsements/{id}/decision"
    order_within_priority: "fourth check of priority 11 — the inspection must exist before its hazard score can be judged"

  - priority: 12
    category: business_constraint
    rule: "(zone_code, peril) must be unique across CatCapacityPool rows."
    error_id: ERR_DUPLICATE_POOL
    http_status: 409
    applies_to: "POST /cat-capacity-pools"

  - priority: 12
    category: business_constraint
    rule: |
      A new or re-scheduled inspection must not collide with another SCHEDULED
      inspection of the same inspector. Each inspection occupies the HALF-OPEN
      interval [scheduled_for, scheduled_for + duration_minutes) extended by a
      90-minute travel buffer appended AFTER the end instant. Two windows
      collide when the requested start is strictly before an existing
      (end + 90 minutes) and the requested (end + 90 minutes) is strictly after
      the existing start. Touching exactly at a buffer edge is allowed.
      CANCELLED and COMPLETED inspections never collide.
    error_id: ERR_INSPECTOR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /inspections, POST /inspections/{id}/reinspection"
    order_within_priority: "evaluated after ERR_DUPLICATE_POOL and before the day-capacity check"

  - priority: 12
    category: business_constraint
    rule: "calculations.inspector_day_load must hold: booked SCHEDULED minutes on the requested UTC date plus the requested duration_minutes must not exceed Inspector.daily_capacity_minutes."
    error_id: ERR_INSPECTOR_DAY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /inspections, POST /inspections/{id}/reinspection"
    order_within_priority: "evaluated immediately after ERR_INSPECTOR_WINDOW_CONFLICT"

  - priority: 12
    category: business_constraint
    rule: |
      A FarmPolicy term must not overlap the term of a sibling policy on the
      same account_id whose uw_status IN {RATED, REFERRED, BOUND}. Policy terms
      are CLOSED-CLOSED date intervals with NO buffer: two terms overlap when
      new.term_start_date <= other.term_end_date AND
      new.term_end_date  >= other.term_start_date, so terms that merely share a
      single boundary date DO overlap. DRAFT, DECLINED and CANCELLED siblings
      are ignored.
    error_id: ERR_OVERLAPPING_POLICY_TERM
    http_status: 409
    applies_to: "POST /farm-policies/{id}/rate"
    order_within_priority: "evaluated after the inspector checks (different endpoints, so no collision)"

  - priority: 12
    category: business_constraint
    rule: "The Inspector named on POST /inspections (or holding the row on reinspection) must have status == ACTIVE."
    error_id: ERR_INSPECTOR_INACTIVE
    http_status: 422
    applies_to: "POST /inspections, POST /inspections/{id}/reinspection"
    order_within_priority: "evaluated after the two window/capacity checks"

  - priority: 12
    category: business_constraint
    rule: "A CHEMICAL_APPLICATION_BUYBACK endorsement can only be approved on a policy that carries a LiabilityExposure with exposure_type == CUSTOM_FARMING; an AGRITOURISM_LIABILITY endorsement requires an AGRITOURISM exposure."
    error_id: ERR_ENDORSEMENT_EXPOSURE_MISSING
    http_status: 422
    applies_to: "POST /endorsements/{id}/decision"
    order_within_priority: "evaluated after the priority-11 buy-back safety checks"

  - priority: 13
    category: business_referential
    rule: "Binding requires Agent(FarmAccount.agent_id).appointment_status == ACTIVE."
    error_id: ERR_AGENT_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /farm-policies/{id}/bind"
    order_within_priority: "first check of priority 13"

  - priority: 13
    category: business_referential
    rule: "Binding requires a LaborProfile on the policy whose coordination_status IN {NOT_REQUIRED, VERIFIED}; a PENDING_PROOF or LAPSED profile blocks the bind."
    error_id: ERR_WC_COORDINATION_UNVERIFIED
    http_status: 422
    applies_to: "POST /farm-policies/{id}/bind"
    order_within_priority: "second check of priority 13"

  - priority: 13
    category: business_referential
    rule: "Binding requires a LaborProfile row to exist at all; a policy that never had one submitted cannot bind. POST /labor-profiles/{id}/wc-verification likewise requires wc_carrier_name, wc_policy_number and wc_expiry_date to all be populated."
    error_id: ERR_WC_PROOF_MISSING
    http_status: 422
    applies_to: "POST /farm-policies/{id}/bind, POST /labor-profiles/{id}/wc-verification"
    order_within_priority: "third check of priority 13"

  - priority: 14
    category: business_temporal
    rule: "Binding requires the current logical clock instant to be <= FarmPolicy.quote_expires_at; the expiry instant itself is still bindable."
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    applies_to: "POST /farm-policies/{id}/bind"
    order_within_priority: "first check of priority 14"

  - priority: 14
    category: business_temporal
    rule: "Binding and wc-verification require LaborProfile.wc_expiry_date >= the current logical clock date when a proof is on file."
    error_id: ERR_WC_PROOF_EXPIRED
    http_status: 422
    applies_to: "POST /farm-policies/{id}/bind, POST /labor-profiles/{id}/wc-verification"
    order_within_priority: "second check of priority 14"

  - priority: 15
    category: business_fiscal
    rule: "Rating requires a CatCapacityPool to exist for the account's cat_zone_code for EACH of HAIL, WIND and WILDFIRE."
    error_id: ERR_CAT_POOL_NOT_CONFIGURED
    http_status: 422
    applies_to: "POST /farm-policies/{id}/rate"
    order_within_priority: "first check of priority 15"

  - priority: 15
    category: business_fiscal
    rule: "Rating requires at least one ACTIVE ScheduledItem or at least one LivestockGroup, so exposed_tiv_cents > 0."
    error_id: ERR_NO_RATEABLE_EXPOSURE
    http_status: 422
    applies_to: "POST /farm-policies/{id}/rate"
    order_within_priority: "second check of priority 15"

  - priority: 15
    category: business_fiscal
    rule: "Rating and binding require every pool involved to have status == OPEN."
    error_id: ERR_POOL_FROZEN
    http_status: 409
    applies_to: "POST /farm-policies/{id}/rate, POST /farm-policies/{id}/bind"
    order_within_priority: "third check of priority 15 — a frozen pool is rejected before its utilization is computed"

  - priority: 15
    category: business_fiscal
    rule: "calculations.cat_load must not drive any pool's prospective utilization above 1.00; perils are evaluated in the order HAIL, WIND, WILDFIRE and the first breach aborts the call, leaving no CatReservation behind."
    error_id: ERR_CAT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /farm-policies/{id}/rate, POST /farm-policies/{id}/bind"
    order_within_priority: "fourth check of priority 15"

  - priority: 15
    category: business_fiscal
    rule: "Binding requires FarmPolicy.total_premium_cents <= Agent(FarmAccount.agent_id).authority_limit_cents."
    error_id: ERR_AGENT_AUTHORITY_EXCEEDED
    http_status: 422
    applies_to: "POST /farm-policies/{id}/bind"
    order_within_priority: "last check of priority 15"

# =============================================================================
# §1.5 Endpoint Table
#
# api_prefix is "/", so every path below is the complete route. `input:` lists
# body fields for writes and query parameters for reads; a trailing `?` marks an
# optional field. Every list endpoint additionally honours limit / offset.
# =============================================================================

endpoints:

  # ---------------------------------------------------------------- producers
  - method: POST
    path: /agents
    description: "Register a producer agency. The returned id is the X-User-ID used by Agent-role callers."
    roles: [PlatformAdmin]
    input: ["agency_name", "license_state", "appointment_status?", "authority_limit_cents?"]
    output: Agent
    side_effects: ["creates an Agent row with appointment_status defaulting to ACTIVE and authority_limit_cents defaulting to 5000000"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: PATCH
    path: /agents/{id}
    description: "Suspend, reinstate or re-authorize a producer."
    roles: [PlatformAdmin]
    input: ["appointment_status?", "authority_limit_cents?"]
    output: Agent
    side_effects: ["updates the Agent row and increments its version by 1", "already-bound policies are NOT revisited; the appointment state is only read at bind time"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_AGENT_NOT_FOUND]

  - method: GET
    path: /agents/{id}
    description: "Read one producer."
    roles: [Agent, Underwriter, SeniorUnderwriter, LossControlSpecialist, ComplianceOfficer, PlatformAdmin]
    input: []
    output: Agent
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_AGENT_NOT_FOUND]

  # ---------------------------------------------------------------- inspectors
  - method: POST
    path: /inspectors
    description: "Register a loss-control inspector. The returned id is the X-User-ID used by LossControlSpecialist callers."
    roles: [PlatformAdmin]
    input: ["full_name", "region_code", "status?", "daily_capacity_minutes?"]
    output: Inspector
    side_effects: ["creates an Inspector row with status defaulting to ACTIVE and daily_capacity_minutes defaulting to 480"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: PATCH
    path: /inspectors/{id}
    description: "Deactivate an inspector or change the daily capacity."
    roles: [PlatformAdmin]
    input: ["status?", "daily_capacity_minutes?"]
    output: Inspector
    side_effects: ["updates the Inspector row and increments its version by 1", "already-SCHEDULED inspections are left in place"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_INSPECTOR_NOT_FOUND]

  - method: GET
    path: /inspectors/{id}
    description: "Read one inspector."
    roles: [Agent, Underwriter, SeniorUnderwriter, LossControlSpecialist, ComplianceOfficer, PlatformAdmin]
    input: []
    output: Inspector
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INSPECTOR_NOT_FOUND]

  # ------------------------------------------------------ catastrophe capacity
  - method: POST
    path: /cat-capacity-pools
    description: "Open a catastrophe capacity pool for one (zone, peril) pair."
    roles: [PlatformAdmin]
    input: ["zone_code", "peril", "participation_pct", "total_capacity_cents", "status?"]
    output: CatCapacityPool
    side_effects: ["creates the pool with reserved_cents = 0, committed_cents = 0 and available_cents = total_capacity_cents"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_DUPLICATE_POOL]

  - method: GET
    path: /cat-capacity-pools/{id}
    description: "Read one pool, including live reserved / committed / available figures."
    roles: [Agent, Underwriter, SeniorUnderwriter, LossControlSpecialist, ComplianceOfficer, PlatformAdmin]
    input: []
    output: CatCapacityPool
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_CAT_POOL_NOT_FOUND]

  - method: GET
    path: /cat-capacity-pools
    description: "List pools, filterable by zone and peril."
    roles: [Agent, Underwriter, SeniorUnderwriter, LossControlSpecialist, ComplianceOfficer, PlatformAdmin]
    input: ["zone_code?", "peril?", "status?", "limit?", "offset?"]
    output: CatCapacityPool[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: PATCH
    path: /cat-capacity-pools/{id}
    description: "Resize a pool or freeze / unfreeze it. OCC-guarded on the pool version."
    roles: [PlatformAdmin]
    input: ["expected_pool_version", "total_capacity_cents?", "status?"]
    output: CatCapacityPool
    side_effects: ["updates total_capacity_cents and/or status", "recomputes available_cents = total_capacity_cents - reserved_cents - committed_cents (the value may go negative when the pool is shrunk below what is already held)", "increments CatCapacityPool.version by 1"]
