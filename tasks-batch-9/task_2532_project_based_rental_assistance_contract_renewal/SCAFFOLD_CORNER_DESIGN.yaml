            - "${c1_ttp} == 45000 and ${c1_tr} == 33500 and ${c1_reimb} == 0 and ${c1_hap} == 84500"
            - "${c2_ttp} == 2500 and ${c2_tr} == 0 and ${c2_reimb} == 9000 and ${c2_hap} == 127000"
            - "${t1_cur_ttp} == 45000 and ${t1_cur_hap} == 84500"
            - "TenantCertification.${c1_id}.status == ACTIVE"

      - name: system_fields_are_server_minted_and_version_advances_on_every_write
        claim_type: System Fields
        grounds:
          - entities.TenantHousehold
          - entities.TenantCertification.fields.status
          - complexity_profile.complexity_layers
        distinguishing_aspect: "id is a bare UUID with no type prefix, created_at is ISO 8601 UTC with three fractional digits, version opens at 1 and advances by exactly one per mutation — including a mutation caused by a sibling write: creating a certification bumps the HOUSEHOLD's version even though the household body was untouched, and refreshes its updated_at."
