        claim_type: auth_required
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A protected GET (GET /box/memberships) issued without auth headers returns ERR_UNAUTHENTICATED (401). Modeled via the Anonymous role hitting a non-Anonymous endpoint with no user id."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /box/memberships"
              payload: {}
