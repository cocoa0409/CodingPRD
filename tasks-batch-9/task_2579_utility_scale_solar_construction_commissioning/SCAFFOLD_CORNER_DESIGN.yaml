              captures: { ms: $.data.mechanical_status, dev: $.data.max_torque_tube_deviation_mm, q: $.data.modules_installed_qty }
          assert:
            - "${bms0} == ACCEPTED so Block.${blk}.mechanical_status is PILES_COMPLETE before the trigger"
            - "the 25.1 mm attempt returns 422 with ${eid} == ERR_TORQUE_TUBE_TOLERANCE_EXCEEDED"
            - "${mid} == PILES_COMPLETE and ${midq} is null — the refused attempt stored nothing"
            - "the 25.0 mm attempt returns 200 with ${ms} == MECH_COMPLETE, ${dev} == 25.0 and ${q} == 50 — the tolerance comparison is inclusive"

      - name: role_check_outranks_shape_check_which_outranks_existence_and_is_rejected
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - validations[priority=5]
          - errors[ERR_FORBIDDEN_ROLE]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_PROJECT_NOT_FOUND]
        distinguishing_aspect: "Three rungs of the ladder are exercised on one endpoint with a single non-existent project id: a wrong role returns 403 even though the payload is also malformed and the project also does not exist; with the right role but a malformed payload the answer is 400, not 404; only a well-formed request from the right role reaches the existence check and returns 404."
        test_recipe:
          setup:
            - "One project (used only for the final success rung)"
            - "The literal id 00000000-0000-4000-8000-000000000000 belongs to no project"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Ladder Flat", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /solar/projects/00000000-0000-4000-8000-000000000000/change-orders"
              payload: { amount_cents: 100000 }
              as: CivilSuperintendent
              captures: { e1: $.data.error_id }
            - call: "POST /solar/projects/00000000-0000-4000-8000-000000000000/change-orders"
              payload: { amount_cents: 100000 }
              as: EpcProjectManager
              captures: { e2: $.data.error_id }
            - call: "POST /solar/projects/00000000-0000-4000-8000-000000000000/change-orders"
              payload: { amount_cents: 100000, reason: "added access road culvert" }
              as: EpcProjectManager
              captures: { e3: $.data.error_id }
            - call: "POST /solar/projects/${proj}/change-orders"
              payload: { amount_cents: 100000, reason: "added access road culvert" }
              as: EpcProjectManager
              captures: { co: $.data.approved_change_order_cents }
          assert:
            - "${e1} == ERR_FORBIDDEN_ROLE with HTTP 403 — priority 2 wins over both the missing reason (priority 3) and the unknown project (priority 5)"
            - "${e2} == ERR_INVALID_REQUEST with HTTP 400 — priority 3 wins over the unknown project"
            - "${e3} == ERR_PROJECT_NOT_FOUND with HTTP 404 — only a well-formed authorised request reaches priority 5"
            - "the same request against the real project returns 200 with ${co} == 100000"

      - name: payroll_lock_versus_wage_gate_stub
        claim_type: priority_conflict
        grounds:
          - validations[priority=8]
          - validations[priority=28]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / payroll_week_lock_outranks_below_prevailing_wage
          rationale: "Both rules are violated by one request there and the priority-8 error is asserted, with the priority-28 error shown in isolation on an OPEN week."

      - name: energization_cross_entity_gate_stub
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=10]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / capacity_test_finalization_gated_on_substation_energization
          rationale: "Finalization is exercised against both a non-energized and an energized substation there, with the test left untouched by the refusal."

      - name: zero_length_and_inverted_windows_are_rejected_before_conflict_checks
        claim_type: temporal_validation
        grounds:
          - validations[priority=4]
          - validations[priority=14]
          - errors[ERR_INVALID_WINDOW_BOUNDS]
          - errors[ERR_EARTHWORK_WINDOW_CONFLICT]
        distinguishing_aspect: "Window bounds are checked at priority 4, before any occupancy comparison: an inverted earthwork window that would ALSO collide returns ERR_INVALID_WINDOW_BOUNDS, and the same interval written forward returns ERR_EARTHWORK_WINDOW_CONFLICT — and a zero-length laydown window is refused on the same rung even though the yard has capacity."
        test_recipe:
          setup:
            - "One project with a grading area holding one CLEARING window [2026-08-01T08:00Z, 2026-08-01T16:00Z] and one empty yard zone of capacity 100"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Bounds Wash", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/grading-areas"
              payload: { area_code: "A1", permit_number: "CGP-2026-118", disturbed_acreage_limit: 40.00, bmp_inspection_interval_days: 14 }
              as: CivilSuperintendent
              captures: { ga: $.data.id }
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "CLEARING", work_start_at: "2026-08-01T08:00:00Z", work_end_at: "2026-08-01T16:00:00Z", acreage_disturbed_delta: 5.00 }
              as: CivilSuperintendent
              captures: { s0: $.data.status }
            - call: "POST /solar/projects/${proj}/yard-zones"
              payload: { zone_code: "Y1", pallet_capacity: 100 }
              as: ProcurementCoordinator
              captures: { yz: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "DRAINAGE", work_start_at: "2026-08-01T12:00:00Z", work_end_at: "2026-08-01T10:00:00Z", acreage_disturbed_delta: 1.00 }
              as: CivilSuperintendent
              captures: { e1: $.data.error_id }
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "DRAINAGE", work_start_at: "2026-08-01T12:00:00Z", work_end_at: "2026-08-01T12:00:00Z", acreage_disturbed_delta: 1.00 }
              as: CivilSuperintendent
              captures: { e2: $.data.error_id }
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "DRAINAGE", work_start_at: "2026-08-01T10:00:00Z", work_end_at: "2026-08-01T12:00:00Z", acreage_disturbed_delta: 1.00 }
              as: CivilSuperintendent
              captures: { e3: $.data.error_id }
            - call: "POST /solar/deliveries"
              payload: { project_id: "${proj}", yard_zone_id: "${yz}", component_type: "TRACKER", unit_qty: 10, pallets: 10, planned_arrival_at: "2026-08-03T09:00:00Z", laydown_window_start: "2026-08-03T00:00:00Z", laydown_window_end: "2026-08-03T00:00:00Z", expected_yard_zone_version: "${v0}" }
              as: ProcurementCoordinator
              captures: { e4: $.data.error_id }
          assert:
            - "${s0} == CLEARED and GradingArea.${ga}.earthwork_windows holds exactly 1 entry"
            - "${e1} == ERR_INVALID_WINDOW_BOUNDS with HTTP 400 — the inverted window is refused at priority 4 even though [10:00, 12:00] also collides with the stored window"
            - "${e2} == ERR_INVALID_WINDOW_BOUNDS — a zero-length window is not a valid interval"
            - "${e3} == ERR_EARTHWORK_WINDOW_CONFLICT with HTTP 409 — written forward, the same interval reaches priority 14"
            - "${e4} == ERR_INVALID_WINDOW_BOUNDS — the laydown window is bound-checked before any pallet arithmetic, and YardZone.${yz}.reserved_pallets is still 0 with version unchanged"
            - "GradingArea.${ga}.earthwork_windows still holds exactly 1 entry and disturbed_acreage_current is still 5.00"

      - name: change_orders_are_individually_valid_but_capped_in_aggregate
        claim_type: aggregate_validation
        grounds:
          - validations[priority=29]
          - calculations.change_order_ledger
          - errors[ERR_CHANGE_ORDER_CAP_EXCEEDED]
          - entities.Project.fields.approved_change_order_cents
        distinguishing_aspect: "Each change order is well under the cap on its own; the ledger is cumulative, so the second one lands exactly on 20% of a 10000000-cent contract and is approved while a further single cent is refused — proving the cap is compared against the running total with an inclusive bound."
        test_recipe:
          setup:
            - "One PRECONSTRUCTION project with contract_value_cents 10000000, so the cap is round_half_up(10000000 * 0.20, 0) == 2000000"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Cap Bench", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id, co0: $.data.approved_change_order_cents }
          trigger:
            - call: "POST /solar/projects/${proj}/change-orders"
              payload: { amount_cents: 1500000, reason: "rock excavation in the north array" }
              as: EpcProjectManager
              captures: { co1: $.data.approved_change_order_cents }
            - call: "POST /solar/projects/${proj}/change-orders"
              payload: { amount_cents: 500000, reason: "additional laydown yard fencing" }
              as: EpcProjectManager
              captures: { co2: $.data.approved_change_order_cents }
            - call: "POST /solar/projects/${proj}/change-orders"
              payload: { amount_cents: 1, reason: "one cent past the cap" }
              as: EpcProjectManager
              captures: { eid: $.data.error_id }
            - call: "GET /solar/projects/${proj}/settlement-summary"
              payload: {}
              as: EpcProjectManager
              captures: { adj: $.data.adjusted_contract_cents }
          assert:
            - "${co0} == 0 at creation"
            - "${co1} == 1500000 — 15% of the contract, comfortably inside the cap"
            - "${co2} == 2000000 — the running total lands exactly on the cap and is admitted"
            - "the one-cent order returns 422 with ${eid} == ERR_CHANGE_ORDER_CAP_EXCEEDED because 2000001 > 2000000"
            - "Project.${proj}.approved_change_order_cents is still 2000000 after the refusal"
            - "${adj} == 12000000 (10000000 + 2000000) — the refused order never entered the ledger"

      - name: underpayment_gate_applies_only_under_a_strict_wage_election
        claim_type: conditional_validation
        grounds:
          - validations[priority=28]
          - errors[ERR_BELOW_PREVAILING_WAGE]
          - entities.Project.fields.prevailing_wage_election
          - calculations.prevailing_wage_restitution
        distinguishing_aspect: "The identical underpaid entry (4000 + 500 against a 5000 determination) is refused outright on a STRICT project and accepted on a REMEDIABLE one, where it instead materialises as 25000 cents of restitution — the flag switches the rule from a gate into a ledger."
        test_recipe:
          setup:
            - "Project S with prevailing_wage_election STRICT and Project R with prevailing_wage_election REMEDIABLE, each with one OPEN payroll week starting 2026-08-03"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Strict Ridge", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69, prevailing_wage_election: "STRICT" }
              as: EpcProjectManager
              captures: { ps: $.data.id, elect_s: $.data.prevailing_wage_election }
            - call: "POST /solar/projects"
              payload: { name: "Remediable Ridge", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69, prevailing_wage_election: "REMEDIABLE" }
              as: EpcProjectManager
              captures: { pr: $.data.id, elect_r: $.data.prevailing_wage_election }
            - call: "POST /solar/projects/${ps}/payroll-weeks"
              payload: { week_start_date: "2026-08-03" }
              as: LaborComplianceOfficer
              captures: { wks: $.data.id }
            - call: "POST /solar/projects/${pr}/payroll-weeks"
              payload: { week_start_date: "2026-08-03" }
              as: LaborComplianceOfficer
              captures: { wkr: $.data.id }
          trigger:
            - call: "POST /solar/payroll-weeks/${wks}/labor-entries"
              payload: { worker_ref: "W-801", classification: "IRONWORKER", is_apprentice: false, hours: 50.00, paid_rate_cents: 4000, fringe_rate_cents: 500, prevailing_rate_cents: 5000, work_date: "2026-08-03" }
              as: LaborComplianceOfficer
              captures: { eid: $.data.error_id }
            - call: "POST /solar/payroll-weeks/${wks}/labor-entries"
              payload: { worker_ref: "W-801", classification: "IRONWORKER", is_apprentice: false, hours: 50.00, paid_rate_cents: 4500, fringe_rate_cents: 500, prevailing_rate_cents: 5000, work_date: "2026-08-03" }
              as: LaborComplianceOfficer
              captures: { ok_st: $.data.status, ok_short: $.data.shortfall_cents_per_hour, ok_rest: $.data.restitution_cents }
            - call: "POST /solar/payroll-weeks/${wkr}/labor-entries"
              payload: { worker_ref: "W-802", classification: "IRONWORKER", is_apprentice: false, hours: 50.00, paid_rate_cents: 4000, fringe_rate_cents: 500, prevailing_rate_cents: 5000, work_date: "2026-08-03" }
              as: LaborComplianceOfficer
              captures: { r_st: $.data.status, r_short: $.data.shortfall_cents_per_hour, r_rest: $.data.restitution_cents }
          assert:
            - "${elect_s} == STRICT and ${elect_r} == REMEDIABLE"
            - "the underpaid entry on the STRICT week returns 422 with ${eid} == ERR_BELOW_PREVAILING_WAGE and PayrollWeek.${wks}.total_hours is still 0"
            - "the at-par entry on the STRICT week returns 200 with ${ok_st} == POSTED, ${ok_short} == 0 and ${ok_rest} == 0 — 4500 + 500 == 5000 satisfies the inclusive comparison"
            - "the identical underpaid entry on the REMEDIABLE week returns 200 with ${r_st} == POSTED, ${r_short} == 500 and ${r_rest} == 25000 (500 * 50.00)"
            - "PayrollWeek.${wkr}.total_hours == 50.00 — the REMEDIABLE election records the shortfall instead of rejecting it"

      - name: acreage_gate_runs_after_the_window_conflict_check_and_leaves_the_ledger_untouched
        claim_type: cascading_validation
        grounds:
          - validations[priority=14]
          - validations[priority=17]
          - calculations.earthwork_window_conflict_check
          - calculations.earthwork_disturbance_ledger
        distinguishing_aspect: "The acreage gate is only reached once the window-conflict check clears, so a log that both collides AND would breach the limit reports the conflict; and because the gate is evaluated BEFORE the append, neither refusal leaves a window record or advances disturbed_acreage_current."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "One grading area with disturbed_acreage_limit 20.00 holding one CLEARING window [2026-08-01T08:00Z, 2026-08-01T16:00Z] of 19.00 acres"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CivilSuperintendent
            - call: "POST /solar/projects"
              payload: { name: "Cascade Flat", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/grading-areas"
              payload: { area_code: "A1", permit_number: "CGP-2026-118", disturbed_acreage_limit: 20.00, bmp_inspection_interval_days: 14 }
              as: CivilSuperintendent
              captures: { ga: $.data.id }
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "CLEARING", work_start_at: "2026-08-01T08:00:00Z", work_end_at: "2026-08-01T16:00:00Z", acreage_disturbed_delta: 19.00 }
              as: CivilSuperintendent
              captures: { c0: $.data.disturbed_acreage_current, s0: $.data.status }
          trigger:
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "GRADING", work_start_at: "2026-08-01T12:00:00Z", work_end_at: "2026-08-01T20:00:00Z", acreage_disturbed_delta: 5.00 }
              as: CivilSuperintendent
              captures: { e1: $.data.error_id }
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "GRADING", work_start_at: "2026-08-02T08:00:00Z", work_end_at: "2026-08-02T16:00:00Z", acreage_disturbed_delta: 5.00 }
              as: CivilSuperintendent
              captures: { e2: $.data.error_id }
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "GRADING", work_start_at: "2026-08-02T08:00:00Z", work_end_at: "2026-08-02T16:00:00Z", acreage_disturbed_delta: 1.00 }
              as: CivilSuperintendent
              captures: { c3: $.data.disturbed_acreage_current, s3: $.data.status }
          assert:
            - "${c0} == 19.00 with ${s0} == CLEARED"
            - "${e1} == ERR_EARTHWORK_WINDOW_CONFLICT (409) — the colliding log would ALSO have pushed the ledger to 24.00, but priority 14 answers before priority 17"
            - "${e2} == ERR_DISTURBED_ACREAGE_EXCEEDED (422) — moved to a free day the same 5.00 acres now reaches priority 17, since 24.00 > 20.00"
            - "after both refusals GradingArea.${ga}.disturbed_acreage_current is still 19.00, earthwork_windows still holds exactly 1 entry and status is still CLEARED"
            - "the 1.00-acre log on the free day returns 200 with ${c3} == 20.00 and ${s3} == GRADED, and earthwork_windows holds 2 entries"

  - section: endpoints
    instances:
      - name: delivery_round_trip_across_item_and_filtered_collection_reads
        claim_type: standard_crud
        grounds:
          - endpoints[POST /solar/deliveries]
          - endpoints[GET /solar/deliveries/{id}]
          - endpoints[GET /solar/deliveries]
          - response_envelope
        distinguishing_aspect: "The collection endpoint composes three independent filters with the pagination envelope: component_type and status together isolate exactly one of three deliveries, and a limit of 2 still reports total_count 3 with has_more true — the counts describe the FILTERED set, not the page."
        test_recipe:
          setup:
            - "One project with a yard zone of capacity 200 holding three deliveries in the same laydown window: an ACCEPTED MODULE (60 units, 3 damaged), a RESERVED MODULE (40 units) and a RESERVED TRACKER (50 units)"
          setup_api_calls:
