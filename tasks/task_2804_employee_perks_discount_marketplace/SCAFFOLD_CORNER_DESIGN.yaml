            - call: "POST /perks/employers/${employer_id}/storefront/publish"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { posture_live: $.data.program_posture, integ_synced: $.data.integration_status, sync_1: $.data.last_sync_at, headcount_1: $.data.eligible_headcount }
            - call: "GET /perks/memberships"
              payload: { employer_id: "${employer_id}" }
