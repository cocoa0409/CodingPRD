            - "Screening.${screening_legal_id}.status == REFERRED"
            - "Screening.${screening_legal_id}.referral_reason == PRISM_TARGET"

      - name: inspection_create_gated_by_screening_referred
        grounds:
          - state_machines.Inspection.IN_PROGRESS_to_OOS_ISSUED
          - validations[priority=6]
          - errors[ERR_SCREENING_NOT_REFERRED]
          - entities.Screening.fields.status
        distinguishing_aspect: "Inspection creation depends on Screening.status: a CLEARED (bypassed) screening cannot spawn an inspection -> ERR_SCREENING_NOT_REFERRED (Inspection<-Screening pair, distinct from Screening<-Carrier)."
        test_recipe:
          setup:
            - "Active carrier; a legal screening that computed to CLEARED; a bay."
          setup_api_calls:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-844-N", legal_name: "November Nav", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "I-64", state_code: "KY" }, as: ComplianceAdmin, captures: { station_id: "$.data.id" } }
            - { call: "POST /stations/${station_id}/bays", payload: { label: "Bay 1" }, as: ComplianceAdmin, captures: { bay_id: "$.data.id" } }
            - { call: "POST /carriers/${carrier_id}/drivers", payload: { cdl_number: "CDL-14", full_name: "Omar Driver" }, as: ComplianceAdmin, captures: { driver_id: "$.data.id" } }
            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_id}", driver_id: "${driver_id}", vehicle_plate: "PLT-14", axle_count: 5, gross_weight_lbs: 79000, heaviest_axle_lbs: 19000, hazmat_placarded: false }, as: Screener, captures: { screening_clear_id: "$.data.id" } }
          trigger:
            - { call: "POST /inspections", payload: { screening_id: "${screening_clear_id}", bay_id: "${bay_id}", level: "LEVEL_I", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }, as: Inspector, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_SCREENING_NOT_REFERRED"
            - "HTTP status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: bay_window_halfopen_adjacency_allowed
        grounds:
          - validations[priority=9]
          - errors[ERR_BAY_WINDOW_CONFLICT]
          - entities.Inspection.fields.scheduled_start
          - entities.InspectionBay.fields.reserved_minutes
        distinguishing_aspect: "InspectionBay windows are half-open [start,end): an adjacent window [11:00,12:00) after [10:00,11:00) is accepted, but an interior overlap [10:30,11:30) is rejected ERR_BAY_WINDOW_CONFLICT."
        test_recipe:
          setup:
            - "Active carrier; three REFERRED overweight screenings; bay holds inspection A [10:00,11:00) and adjacent B [11:00,12:00) (both accepted)."
