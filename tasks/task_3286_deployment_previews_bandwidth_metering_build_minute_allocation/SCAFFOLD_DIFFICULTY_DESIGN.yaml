scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1: dual_variant_calc — two valid algorithms, different results,
  # different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: usage_provisional_vs_final_bill_on_usageperiod
        grounds:
          - calculations.usage_overage_charge
          - entities.UsagePeriod.fields.projected_bill_cents
          - entities.UsagePeriod.fields.final_bill_cents
          - entities.UsageEvent.fields.status
          - state_machines.UsagePeriod.OPEN_to_CLOSED
        distinguishing_aspect: |
          Entity domain: UsagePeriod billing. Provisional (forward-looking,
          includes ESTIMATED events) vs final (chronological, ESTIMATED
          converted first) variants of usage_overage_charge diverge when an
          ESTIMATED bandwidth event pushes the period across the included
          threshold: the provisional projection charges overage while a final
          computed after the ESTIMATED batch is voided would not — here the
          ESTIMATED event IS converted, so both include it, but the
          period-level ceil over bytes lands differently than naive summing
          would, and the provisional value is pinned exactly.
        test_recipe:
          setup:
            - "Team on plan PRO with included_bandwidth_gb=100, tier1 10c/GB for first 50 overage GB, tier2 5c/GB beyond; tier2_threshold=50"
            - "One OPEN usage period"
            - "One RECORDED BANDWIDTH event of 100,000,000,000 bytes (exactly 100 GB)"
            - "One ESTIMATED BANDWIDTH event of 1,000,000,000 bytes (1 GB)"
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { tier: "PRO", seat_limit: 10, included_build_minutes: 300, build_concurrency_limit: 2, included_bandwidth_gb: 100, included_invocations_millions: 5, bandwidth_tier1_rate_cents_per_gb: 10, bandwidth_tier2_rate_cents_per_gb: 5, bandwidth_tier2_threshold_gb: 50, invocation_rate_cents_per_million: 40, seat_price_cents_monthly: 2000, overage_build_minute_rate_cents: 5 }
              as: PlatformAdmin
            - call: "POST /v1/teams"
              payload: { name: "Acme", plan_tier: "PRO" }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/projects"
              payload: { name: "web", production_branch: "main" }
              as: TeamOwner
              captures: { project_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/usage-periods"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: TeamBillingManager
              captures: { period_id: $.data.id }
            - call: "POST /v1/git-events"
              payload: { project_id: "${project_id}", branch: "feat-a", git_ref: "refs/heads/feat-a", commit_sha: "aaa111", region: "IAD" }
              as: SystemWebhook
              captures: { dep_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/usage-events"
              payload: { deployment_id: "${dep_id}", event_type: "BANDWIDTH", bandwidth_bytes: 100000000000, region: "IAD" }
              as: SystemWebhook
            - call: "POST /v1/teams/${team_id}/usage-events"
              payload: { deployment_id: "${dep_id}", event_type: "BANDWIDTH", bandwidth_bytes: 1000000000, region: "IAD", status: "ESTIMATED" }
              as: SystemWebhook
          trigger:
            - call: "GET /v1/usage-periods/${period_id}"
              as: TeamBillingManager
              captures: { proj_bill: $.data.projected_bill_cents }
            - call: "POST /v1/usage-periods/${period_id}/close"
              as: TeamBillingManager
          assert:
            - "provisional projected_bill_cents == 10 (total ceil(101e9/1e9)=101 GB, overage 1 GB x 10c tier1)"
            - "after close, UsagePeriod.${period_id}.final_bill_cents == 10 (ESTIMATED event converted to RECORDED, same total)"
            - "the ESTIMATED event's status == RECORDED after close"

      - name: deployment_estimated_vs_actual_build_minutes_on_deployment
        grounds:
          - calculations.build_minute_billing
          - entities.Deployment.fields.estimated_build_minutes
          - entities.Deployment.fields.billable_minutes
        distinguishing_aspect: |
          Entity domain: Deployment build minutes (distinct from UsagePeriod
          billing). The forward-looking admission estimate (prior READY build's
          billable_minutes, else 2) vs the chronological actual
          ceil(build_duration_seconds/60) diverge for the same deployment when
          the prior build ran long but the new build is short.
        test_recipe:
          setup:
            - "Team PRO with included_build_minutes=300"
            - "OPEN usage period"
            - "First deployment built SUCCESS with build_duration_seconds=300 (billable 5 min)"
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { tier: "PRO", seat_limit: 10, included_build_minutes: 300, build_concurrency_limit: 2, included_bandwidth_gb: 100, included_invocations_millions: 5, bandwidth_tier1_rate_cents_per_gb: 10, bandwidth_tier2_rate_cents_per_gb: 5, bandwidth_tier2_threshold_gb: 50, invocation_rate_cents_per_million: 40, seat_price_cents_monthly: 2000, overage_build_minute_rate_cents: 5 }
              as: PlatformAdmin
            - call: "POST /v1/teams"
              payload: { name: "Acme", plan_tier: "PRO" }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/projects"
              payload: { name: "web", production_branch: "main" }
              as: TeamOwner
              captures: { project_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/usage-periods"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: TeamBillingManager
            - call: "POST /v1/git-events"
              payload: { project_id: "${project_id}", branch: "feat-a", git_ref: "refs/heads/feat-a", commit_sha: "aaa111", region: "IAD" }
              as: SystemWebhook
              captures: { dep1: $.data.id, dep1_est: $.data.estimated_build_minutes }
            - call: "POST /v1/deployments/${dep1}/build-start"
              payload: {}
              as: SystemWebhook
            - call: "POST /v1/deployments/${dep1}/build-complete"
              payload: { outcome: "SUCCESS", build_duration_seconds: 300 }
              as: SystemWebhook
          trigger:
            - call: "POST /v1/git-events"
              payload: { project_id: "${project_id}", branch: "feat-a", git_ref: "refs/heads/feat-a", commit_sha: "bbb222", region: "IAD" }
              as: SystemWebhook
              captures: { dep2: $.data.id, dep2_est: $.data.estimated_build_minutes }
            - call: "POST /v1/deployments/${dep2}/build-start"
              payload: {}
              as: SystemWebhook
            - call: "POST /v1/deployments/${dep2}/build-complete"
              payload: { outcome: "SUCCESS", build_duration_seconds: 30 }
              as: SystemWebhook
          assert:
            - "Deployment.${dep1}.estimated_build_minutes == 2 (no prior READY deployment; DEFAULT_ESTIMATE_MINUTES)"
            - "Deployment.${dep2}.estimated_build_minutes == 5 (estimated from prior READY build)"
            - "Deployment.${dep2}.billable_minutes == 1 (ceil(30/60)); estimate 5 != actual 1"

  # ===========================================================================
  # Rule 2: combinatorial_formula — different modes (a) vs (c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_bandwidth_with_regional_edge_fee_mode_a
        grounds:
          - calculations.usage_overage_charge
          - entities.PlanCatalogEntry.fields.bandwidth_tier1_rate_cents_per_gb
          - entities.PlanCatalogEntry.fields.bandwidth_tier2_rate_cents_per_gb
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — tiered marginal
          bandwidth rates (two tiers + included threshold) combined with a
          per-event regional edge multiplier that is independent of the
          bandwidth tiers; the total requires selecting the right tier split
          AND summing region-keyed ceil-per-million fees.
        test_recipe:
          setup:
            - "PRO plan: included 100 GB; tier1 10c/GB for first 50 overage GB; tier2 5c/GB beyond; invocation overage 40c/million; edge multipliers IAD=1, FRA=2, SIN=3"
            - "Bandwidth: 160 GB RECORDED (overage 60 GB -> 50x10 + 10x5 = 550c)"
            - "Invocations: 5,000,000 exactly (at included, no overage)"
            - "Edge: one INVOCATION event edge_execution=true region=SIN invocations=2,000,000 -> ceil(2)=2 million-units x 3 = 6c"
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { tier: "PRO", seat_limit: 10, included_build_minutes: 300, build_concurrency_limit: 2, included_bandwidth_gb: 100, included_invocations_millions: 5, bandwidth_tier1_rate_cents_per_gb: 10, bandwidth_tier2_rate_cents_per_gb: 5, bandwidth_tier2_threshold_gb: 50, invocation_rate_cents_per_million: 40, seat_price_cents_monthly: 2000, overage_build_minute_rate_cents: 5 }
              as: PlatformAdmin
            - call: "POST /v1/teams"
              payload: { name: "Acme", plan_tier: "PRO" }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/projects"
              payload: { name: "web", production_branch: "main" }
              as: TeamOwner
              captures: { project_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/usage-periods"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: TeamBillingManager
              captures: { period_id: $.data.id }
            - call: "POST /v1/git-events"
              payload: { project_id: "${project_id}", branch: "feat-a", git_ref: "refs/heads/feat-a", commit_sha: "aaa111", region: "IAD" }
              as: SystemWebhook
              captures: { dep_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/usage-events"
              payload: { deployment_id: "${dep_id}", event_type: "BANDWIDTH", bandwidth_bytes: 160000000000, region: "IAD" }
              as: SystemWebhook
            - call: "POST /v1/teams/${team_id}/usage-events"
              payload: { deployment_id: "${dep_id}", event_type: "INVOCATION", invocations: 5000000, region: "IAD" }
              as: SystemWebhook
            - call: "POST /v1/teams/${team_id}/usage-events"
              payload: { deployment_id: "${dep_id}", event_type: "INVOCATION", invocations: 2000000, region: "SIN", edge_execution: true }
              as: SystemWebhook
          trigger:
            - call: "POST /v1/usage-periods/${period_id}/close"
              as: TeamBillingManager
          assert:
            - "UsagePeriod.${period_id}.final_bill_cents == 556 (bandwidth 550 + invocation overage 80 [ceil(7e6/1e6)=7-5=2M x 40c] + edge 6)"

      - name: seat_proration_evaluation_order_mode_c
        grounds:
          - calculations.seat_proration
          - entities.Team.fields.prorated_charges_cents
          - entities.PlanCatalogEntry.fields.seat_price_cents_monthly
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — the charge depends on the
          plan's seat price while the seat count/team config gates which plan
          applies; the scaffold pins evaluation order (read plan price BEFORE
          proration; multiply-then-divide; single final round_half_up) so
          2000c * 16 / 30 rounds once to 1067, not per-step.
        test_recipe:
          setup:
            - "PRO plan seat_price 2000c/month; period 2026-09-01..2026-10-01 (30 days)"
            - "Clock advanced to 2026-09-14T00:00:00Z (16 days remaining of 30)"
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { tier: "PRO", seat_limit: 10, included_build_minutes: 300, build_concurrency_limit: 2, included_bandwidth_gb: 100, included_invocations_millions: 5, bandwidth_tier1_rate_cents_per_gb: 10, bandwidth_tier2_rate_cents_per_gb: 5, bandwidth_tier2_threshold_gb: 50, invocation_rate_cents_per_million: 40, seat_price_cents_monthly: 2000, overage_build_minute_rate_cents: 5 }
              as: PlatformAdmin
            - call: "POST /v1/teams"
              payload: { name: "Acme", plan_tier: "PRO" }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/usage-periods"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: TeamBillingManager
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/teams/${team_id}/members"
              payload: { user_email: "dev@acme.com", role: "DEVELOPER" }
              as: TeamOwner
          assert:
            - "Team.${team_id}.prorated_charges_cents == 1067 (2000 * 16/30 = 1066.67 -> single round_half_up; per-step rounding would give 1066 or 1067 depending on order)"
            - "Team.${team_id}.seats_used == 1"

  # ===========================================================================
  # Rule 3: non_linear_state_machine — different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: deployment_promotion_rollback_cycle_on_deployment
        grounds:
          - state_machines.Deployment.READY_to_PROMOTED
          - state_machines.Deployment.PROMOTED_to_ROLLED_BACK
          - state_machines.Deployment.PROMOTED_to_PROMOTED
        distinguishing_aspect: |
          Entity: Deployment — cyclic promotion/rollback loop (READY -> PROMOTED
          -> ROLLED_BACK -> PROMOTED again) with divergent side-effect sets per
          hop: forward promotion displaces the incumbent; rollback swaps the
          pair's roles and rewrites project.production_deployment_id.
        test_recipe:
          setup:
            - "Project with two READY deployments d1 (sha aaa111) and d2 (sha bbb222) on branch main"
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { tier: "PRO", seat_limit: 10, included_build_minutes: 300, build_concurrency_limit: 2, included_bandwidth_gb: 100, included_invocations_millions: 5, bandwidth_tier1_rate_cents_per_gb: 10, bandwidth_tier2_rate_cents_per_gb: 5, bandwidth_tier2_threshold_gb: 50, invocation_rate_cents_per_million: 40, seat_price_cents_monthly: 2000, overage_build_minute_rate_cents: 5 }
              as: PlatformAdmin
            - call: "POST /v1/teams"
              payload: { name: "Acme", plan_tier: "PRO" }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/projects"
              payload: { name: "web", production_branch: "main" }
              as: TeamOwner
              captures: { project_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/usage-periods"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: TeamBillingManager
            - call: "POST /v1/git-events"
              payload: { project_id: "${project_id}", branch: "main", git_ref: "refs/heads/main", commit_sha: "aaa111", region: "IAD" }
              as: SystemWebhook
              captures: { d1: $.data.id }
            - call: "POST /v1/deployments/${d1}/build-start"
              payload: {}
              as: SystemWebhook
            - call: "POST /v1/deployments/${d1}/build-complete"
              payload: { outcome: "SUCCESS", build_duration_seconds: 60 }
              as: SystemWebhook
            - call: "POST /v1/git-events"
              payload: { project_id: "${project_id}", branch: "main", git_ref: "refs/heads/main", commit_sha: "bbb222", region: "IAD" }
              as: SystemWebhook
              captures: { d2: $.data.id }
            - call: "POST /v1/deployments/${d2}/build-start"
              payload: {}
              as: SystemWebhook
            - call: "POST /v1/deployments/${d2}/build-complete"
              payload: { outcome: "SUCCESS", build_duration_seconds: 60 }
              as: SystemWebhook
          trigger:
            - call: "POST /v1/deployments/${d1}/promote"
              payload: {}
              as: TeamOwner
            - call: "POST /v1/deployments/${d2}/promote"
              payload: {}
              as: TeamOwner
            - call: "POST /v1/projects/${project_id}/rollback"
              payload: {}
              as: TeamOwner
          assert:
            - "after d1 promote: Project.production_deployment_id == ${d1}"
            - "after d2 promote: Deployment.${d1}.status == ROLLED_BACK and Project.production_deployment_id == ${d2}"
            - "after rollback: Deployment.${d2}.status == ROLLED_BACK and Deployment.${d1}.status == PROMOTED and Project.production_deployment_id == ${d1}"
            - "Deployment.${d1}.target == PRODUCTION throughout (target is sticky once promoted)"

      - name: domain_verification_retry_loop_on_domain
        grounds:
          - state_machines.Domain.PENDING_to_FAILED
          - state_machines.Domain.FAILED_to_PENDING
          - state_machines.Domain.PENDING_to_VERIFIED
        distinguishing_aspect: |
          Entity: Domain (different entity than Deployment) — cyclic
          verification retry loop PENDING -> FAILED -> PENDING -> VERIFIED, and
          the VERIFIED hop carries a divergent side effect (spawns Certificate
          ISSUING) that the FAILED hop does not.
        test_recipe:
          setup:
            - "Project with domain example.com assigned (verification PENDING)"
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { tier: "PRO", seat_limit: 10, included_build_minutes: 300, build_concurrency_limit: 2, included_bandwidth_gb: 100, included_invocations_millions: 5, bandwidth_tier1_rate_cents_per_gb: 10, bandwidth_tier2_rate_cents_per_gb: 5, bandwidth_tier2_threshold_gb: 50, invocation_rate_cents_per_million: 40, seat_price_cents_monthly: 2000, overage_build_minute_rate_cents: 5 }
              as: PlatformAdmin
            - call: "POST /v1/teams"
              payload: { name: "Acme", plan_tier: "PRO" }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/projects"
              payload: { name: "web", production_branch: "main" }
              as: TeamOwner
              captures: { project_id: $.data.id }
            - call: "POST /v1/projects/${project_id}/domains"
              payload: { name: "example.com" }
              as: TeamOwner
              captures: { dom_id: $.data.id }
          trigger:
            - call: "POST /v1/domains/${dom_id}/verify"
              payload: { outcome: "FAILURE" }
              as: Developer
            - call: "POST /v1/domains/${dom_id}/reverify"
              payload: {}
              as: Developer
            - call: "POST /v1/domains/${dom_id}/verify"
              payload: { outcome: "SUCCESS" }
              as: Developer
          assert:
            - "after FAILURE: Domain.verification_status == FAILED and GET /v1/domains/${dom_id}/certificates returns 0 items"
            - "after reverify: Domain.verification_status == PENDING"
            - "after SUCCESS: Domain.verification_status == VERIFIED and exactly 1 Certificate with status ISSUING exists for the domain"

  # ===========================================================================
  # Rule 4: transitive_cascade — different triggers, depth >=3 and >=2
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: project_archive_four_hop_cascade
        grounds:
          - state_machines.Project.ACTIVE_to_ARCHIVED
          - state_machines.Certificate.ACTIVE_to_REVOKED
          - state_machines.Deployment.QUEUED_to_CANCELED
        distinguishing_aspect: |
          Trigger: POST /v1/projects/{id}/archive. Depth-3 chain where each
          link is caused by the previous: archive -> QUEUED deployment
          CANCELED; archive -> ACTIVE domain SUSPENDED; the domain suspension
          itself forces its ACTIVE certificate -> REVOKED (link 3), and the
          certificate revocation in turn nulls domain.certificate_id (link 4
          as a field mutation). Verified hop-by-hop.
        test_recipe:
          setup:
            - "Project ACTIVE with one QUEUED deployment, one VERIFIED domain holding one ACTIVE certificate"
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { tier: "PRO", seat_limit: 10, included_build_minutes: 300, build_concurrency_limit: 2, included_bandwidth_gb: 100, included_invocations_millions: 5, bandwidth_tier1_rate_cents_per_gb: 10, bandwidth_tier2_rate_cents_per_gb: 5, bandwidth_tier2_threshold_gb: 50, invocation_rate_cents_per_million: 40, seat_price_cents_monthly: 2000, overage_build_minute_rate_cents: 5 }
              as: PlatformAdmin
            - call: "POST /v1/teams"
              payload: { name: "Acme", plan_tier: "PRO" }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/projects"
              payload: { name: "web", production_branch: "main" }
              as: TeamOwner
              captures: { project_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/usage-periods"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: TeamBillingManager
            - call: "POST /v1/git-events"
              payload: { project_id: "${project_id}", branch: "feat-a", git_ref: "refs/heads/feat-a", commit_sha: "aaa111", region: "IAD" }
              as: SystemWebhook
              captures: { dep_id: $.data.id }
            - call: "POST /v1/projects/${project_id}/domains"
              payload: { name: "example.com" }
              as: TeamOwner
              captures: { dom_id: $.data.id }
            - call: "POST /v1/domains/${dom_id}/verify"
              payload: { outcome: "SUCCESS" }
              as: Developer
            - call: "GET /v1/domains/${dom_id}/certificates"
              as: TeamOwner
              captures: { cert_id: $.data.0.id }
            - call: "POST /v1/certificates/${cert_id}/complete"
              payload: {}
              as: SystemWebhook
          trigger:
            - call: "POST /v1/projects/${project_id}/archive"
              payload: {}
              as: TeamOwner
          assert:
            - "Project.${project_id}.status == ARCHIVED"
            - "Deployment.${dep_id}.status == CANCELED (link 1)"
            - "Domain.${dom_id}.status == SUSPENDED (link 2)"
            - "Certificate.${cert_id}.status == REVOKED (link 3)"
            - "Domain.${dom_id}.certificate_id == null (link 4, field mutation caused by link 3)"

      - name: build_complete_to_spendcap_to_project_suspension
        grounds:
          - state_machines.Deployment.BUILDING_to_READY
          - state_machines.SpendCap.ACTIVE_to_TRIPPED
          - state_machines.Project.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Trigger: POST /v1/deployments/{id}/build-complete (different trigger
          than archive). Depth-2 chain: build completion meters minutes into
          the period and recomputes projected_bill_cents (link 1); the
          recompute trips the ACTIVE BLOCK_DEPLOYS_AND_SUSPEND SpendCap (link
          2); the cap trip suspends the owning Project (link 3 field-level
          state mutation on a third entity type).
        test_recipe:
          setup:
            - "PRO plan included_build_minutes=2, overage_build_minute_rate_cents=100; spend cap cap_cents=300 action=BLOCK_DEPLOYS_AND_SUSPEND"
            - "OPEN period; one deployment BUILDING that will bill 5 minutes (overage 3 min x 100c = 300c, exactly at cap)"
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { tier: "PRO", seat_limit: 10, included_build_minutes: 2, build_concurrency_limit: 2, included_bandwidth_gb: 100, included_invocations_millions: 5, bandwidth_tier1_rate_cents_per_gb: 10, bandwidth_tier2_rate_cents_per_gb: 5, bandwidth_tier2_threshold_gb: 50, invocation_rate_cents_per_million: 40, seat_price_cents_monthly: 2000, overage_build_minute_rate_cents: 100 }
              as: PlatformAdmin
            - call: "POST /v1/teams"
              payload: { name: "Acme", plan_tier: "PRO" }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/projects"
              payload: { name: "web", production_branch: "main" }
              as: TeamOwner
              captures: { project_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/usage-periods"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: TeamBillingManager
            - call: "POST /v1/teams/${team_id}/spend-caps"
              payload: { cap_cents: 300, action: "BLOCK_DEPLOYS_AND_SUSPEND" }
              as: TeamBillingManager
              captures: { cap_id: $.data.id }
            - call: "POST /v1/git-events"
              payload: { project_id: "${project_id}", branch: "feat-a", git_ref: "refs/heads/feat-a", commit_sha: "aaa111", region: "IAD" }
              as: SystemWebhook
              captures: { dep_id: $.data.id }
            - call: "POST /v1/deployments/${dep_id}/build-start"
              payload: {}
              as: SystemWebhook
          trigger:
            - call: "POST /v1/deployments/${dep_id}/build-complete"
              payload: { outcome: "SUCCESS", build_duration_seconds: 300 }
              as: SystemWebhook
          assert:
            - "Deployment.${dep_id}.status == READY and billable_minutes == 5"
            - "SpendCap.${cap_id}.status == TRIPPED (projected bill 300 >= cap 300, inclusive boundary)"
            - "Project.${project_id}.status == SUSPENDED and suspended_reason == SPEND_CAP_BREACHED"

  # ===========================================================================
  # Rule 5: priority_pair_validation_conflict — different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_referential_env_scope_on_archived_project
        grounds:
          - "validations[priority=5]"
          - "validations[priority=6]"
          - "errors[ERR_PROJECT_ARCHIVED]"
          - "errors[ERR_ENV_SCOPE_OVERLAP]"
        distinguishing_aspect: |
          Pair: state (priority 5, project archived) vs business_referential
          (priority 6, env scope overlap). A request violating both MUST return
          ERR_PROJECT_ARCHIVED, proving state is checked before referential
          uniqueness.
        test_recipe:
          setup:
            - "Project has env var KEY=DATABASE_URL scopes=[PRODUCTION]; project then ARCHIVED (archiving needs no deployments/domains)"
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { tier: "PRO", seat_limit: 10, included_build_minutes: 300, build_concurrency_limit: 2, included_bandwidth_gb: 100, included_invocations_millions: 5, bandwidth_tier1_rate_cents_per_gb: 10, bandwidth_tier2_rate_cents_per_gb: 5, bandwidth_tier2_threshold_gb: 50, invocation_rate_cents_per_million: 40, seat_price_cents_monthly: 2000, overage_build_minute_rate_cents: 5 }
              as: PlatformAdmin
            - call: "POST /v1/teams"
              payload: { name: "Acme", plan_tier: "PRO" }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/projects"
              payload: { name: "web", production_branch: "main" }
              as: TeamOwner
              captures: { project_id: $.data.id }
            - call: "POST /v1/projects/${project_id}/env-vars"
              payload: { key: "DATABASE_URL", value: "postgres://x", scopes: ["PRODUCTION"] }
              as: Developer
            - call: "POST /v1/projects/${project_id}/archive"
              payload: {}
              as: TeamOwner
          trigger:
            - call: "POST /v1/projects/${project_id}/env-vars"
              payload: { key: "DATABASE_URL", value: "postgres://y", scopes: ["PRODUCTION"] }
              as: Developer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PROJECT_ARCHIVED (priority 5 state beats priority 6 ERR_ENV_SCOPE_OVERLAP)"

      - name: business_fiscal_seat_limit_vs_business_referential_duplicate_member
        grounds:
          - "validations[priority=9]"
          - "validations[priority=6]"
          - "errors[ERR_SEAT_LIMIT_EXCEEDED]"
          - "errors[ERR_MEMBER_ALREADY_EXISTS]"
        distinguishing_aspect: |
          Pair: business_referential (priority 6, duplicate member email) vs
          business_fiscal (priority 9, seat limit). A member add that is BOTH a
          duplicate email AND beyond the seat limit MUST return
          ERR_MEMBER_ALREADY_EXISTS, proving referential (6) precedes fiscal (9).
        test_recipe:
          setup:
            - "HOBBY plan seat_limit=1; team already has member dev@acme.com"
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { tier: "HOBBY", seat_limit: 1, included_build_minutes: 100, build_concurrency_limit: 1, included_bandwidth_gb: 10, included_invocations_millions: 1, bandwidth_tier1_rate_cents_per_gb: 20, bandwidth_tier2_rate_cents_per_gb: 10, bandwidth_tier2_threshold_gb: 100, invocation_rate_cents_per_million: 100, seat_price_cents_monthly: 0, overage_build_minute_rate_cents: 10 }
              as: PlatformAdmin
            - call: "POST /v1/teams"
              payload: { name: "Tiny", plan_tier: "HOBBY" }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/members"
              payload: { user_email: "dev@acme.com", role: "DEVELOPER" }
              as: TeamOwner
          trigger:
            - call: "POST /v1/teams/${team_id}/members"
              payload: { user_email: "dev@acme.com", role: "VIEWER" }
              as: TeamOwner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MEMBER_ALREADY_EXISTS (priority 6 referential beats priority 9 ERR_SEAT_LIMIT_EXCEEDED)"

  # ===========================================================================
  # Rule 6: boundary_precision_check — different metrics, different endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: spend_cap_trips_at_exact_equality_via_usage_ingest
        grounds:
          - state_machines.SpendCap.ACTIVE_to_TRIPPED
          - calculations.usage_overage_charge
          - "validations[priority=12]"
        distinguishing_aspect: |
          Metric: projected spend cents via POST /v1/teams/{teamId}/usage-events.
          Inclusive >= boundary: projected_bill_cents == cap_cents trips the cap;
          cap_cents - 1 does not.
        test_recipe:
          setup:
            - "PRO plan: included_bandwidth_gb=10, tier1 rate 100c/GB, tier2_threshold=50; spend cap 1000c ALERT_ONLY... use BLOCK_DEPLOYS_AND_SUSPEND"
            - "OPEN period; ALERT via cap at 1000"
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { tier: "PRO", seat_limit: 10, included_build_minutes: 300, build_concurrency_limit: 2, included_bandwidth_gb: 10, included_invocations_millions: 5, bandwidth_tier1_rate_cents_per_gb: 100, bandwidth_tier2_rate_cents_per_gb: 5, bandwidth_tier2_threshold_gb: 50, invocation_rate_cents_per_million: 40, seat_price_cents_monthly: 0, overage_build_minute_rate_cents: 5 }
              as: PlatformAdmin
            - call: "POST /v1/teams"
              payload: { name: "Acme", plan_tier: "PRO" }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/projects"
              payload: { name: "web", production_branch: "main" }
              as: TeamOwner
              captures: { project_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/usage-periods"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: TeamBillingManager
              captures: { period_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/spend-caps"
              payload: { cap_cents: 1000, action: "BLOCK_DEPLOYS_AND_SUSPEND" }
              as: TeamBillingManager
              captures: { cap_id: $.data.id }
            - call: "POST /v1/git-events"
              payload: { project_id: "${project_id}", branch: "feat-a", git_ref: "refs/heads/feat-a", commit_sha: "aaa111", region: "IAD" }
              as: SystemWebhook
              captures: { dep_id: $.data.id }
          trigger:
            - call: "POST /v1/teams/${team_id}/usage-events"
              payload: { deployment_id: "${dep_id}", event_type: "BANDWIDTH", bandwidth_bytes: 19000000000, region: "IAD" }
              as: SystemWebhook
            - call: "GET /v1/usage-periods/${period_id}"
              as: TeamBillingManager
              captures: { bill_19: $.data.projected_bill_cents }
            - call: "POST /v1/teams/${team_id}/usage-events"
              payload: { deployment_id: "${dep_id}", event_type: "BANDWIDTH", bandwidth_bytes: 1000000000, region: "IAD" }
              as: SystemWebhook
          assert:
            - "after 19 GB: projected_bill_cents == 900 (ceil(19)=19-10=9 overage x 100c) and SpendCap.${cap_id}.status == ACTIVE (900 < 1000)"
            - "after +1 GB (20 GB total): projected_bill_cents == 1000 and SpendCap.${cap_id}.status == TRIPPED (== cap trips, inclusive)"

      - name: build_concurrency_boundary_at_limit_via_build_start
        grounds:
          - calculations.build_queue_admission
          - "validations[priority=11]"
          - "errors[ERR_BUILD_CONCURRENCY_EXCEEDED]"
        distinguishing_aspect: |
          Metric: count of BUILDING deployments via POST
          /v1/deployments/{id}/build-start (different metric and endpoint than
          the spend-cap ingest boundary). BUILDING count == limit-1 admits;
          == limit rejects with ERR_BUILD_CONCURRENCY_EXCEEDED.
        test_recipe:
          setup:
            - "PRO plan build_concurrency_limit=1, included_build_minutes=300"
            - "OPEN period; two QUEUED deployments d1, d2"
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { tier: "PRO", seat_limit: 10, included_build_minutes: 300, build_concurrency_limit: 1, included_bandwidth_gb: 100, included_invocations_millions: 5, bandwidth_tier1_rate_cents_per_gb: 10, bandwidth_tier2_rate_cents_per_gb: 5, bandwidth_tier2_threshold_gb: 50, invocation_rate_cents_per_million: 40, seat_price_cents_monthly: 2000, overage_build_minute_rate_cents: 5 }
              as: PlatformAdmin
            - call: "POST /v1/teams"
              payload: { name: "Acme", plan_tier: "PRO" }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/projects"
              payload: { name: "web", production_branch: "main" }
              as: TeamOwner
              captures: { project_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/usage-periods"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: TeamBillingManager
            - call: "POST /v1/git-events"
              payload: { project_id: "${project_id}", branch: "feat-a", git_ref: "refs/heads/feat-a", commit_sha: "aaa111", region: "IAD" }
              as: SystemWebhook
              captures: { d1: $.data.id }
            - call: "POST /v1/git-events"
              payload: { project_id: "${project_id}", branch: "feat-b", git_ref: "refs/heads/feat-b", commit_sha: "bbb222", region: "IAD" }
              as: SystemWebhook
              captures: { d2: $.data.id }
          trigger:
            - call: "POST /v1/deployments/${d1}/build-start"
              payload: {}
              as: SystemWebhook
            - call: "POST /v1/deployments/${d2}/build-start"
              payload: {}
              as: SystemWebhook
              captures: { err: $.data.error_id }
          assert:
            - "Deployment.${d1}.status == BUILDING (count 0 < limit 1 admits)"
            - "second build-start response error_id == ERR_BUILD_CONCURRENCY_EXCEEDED (count 1 >= limit 1, inclusive >= boundary)"
            - "Deployment.${d2}.status == QUEUED (unchanged)"

  # ===========================================================================
  # Rule 7: cross_entity_state_dependency — different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: promote_blocked_by_project_suspension_project_to_deployment
        grounds:
          - state_machines.Deployment.READY_to_PROMOTED
          - state_machines.Project.ACTIVE_to_SUSPENDED
          - "errors[ERR_PROJECT_SUSPENDED]"
        distinguishing_aspect: |
          Pair: Deployment -> Project. A READY deployment's promote transition
          is gated on the owning Project.status == ACTIVE; a spend-cap-driven
          SUSPENDED project blocks promotion even though the deployment itself
          is in a promotable state.
        test_recipe:
          setup:
            - "PRO plan included_build_minutes=1, overage rate 100c/min; spend cap 200c BLOCK_DEPLOYS_AND_SUSPEND"
            - "d1 built 3 min (bill 200 -> trips cap, suspends project); d2 built 1 min BEFORE d1 so it is READY while project still ACTIVE... sequence: d2 completed first (1 min, no overage), then d1 completes 3 min tripping cap"
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { tier: "PRO", seat_limit: 10, included_build_minutes: 1, build_concurrency_limit: 2, included_bandwidth_gb: 100, included_invocations_millions: 5, bandwidth_tier1_rate_cents_per_gb: 10, bandwidth_tier2_rate_cents_per_gb: 5, bandwidth_tier2_threshold_gb: 50, invocation_rate_cents_per_million: 40, seat_price_cents_monthly: 0, overage_build_minute_rate_cents: 100 }
              as: PlatformAdmin
            - call: "POST /v1/teams"
              payload: { name: "Acme", plan_tier: "PRO" }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/projects"
              payload: { name: "web", production_branch: "main" }
              as: TeamOwner
              captures: { project_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/usage-periods"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: TeamBillingManager
            - call: "POST /v1/teams/${team_id}/spend-caps"
              payload: { cap_cents: 200, action: "BLOCK_DEPLOYS_AND_SUSPEND" }
              as: TeamBillingManager
            - call: "POST /v1/git-events"
              payload: { project_id: "${project_id}", branch: "feat-a", git_ref: "refs/heads/feat-a", commit_sha: "aaa111", region: "IAD" }
              as: SystemWebhook
              captures: { d2: $.data.id }
            - call: "POST /v1/deployments/${d2}/build-start"
              payload: {}
              as: SystemWebhook
            - call: "POST /v1/deployments/${d2}/build-complete"
              payload: { outcome: "SUCCESS", build_duration_seconds: 60 }
              as: SystemWebhook
            - call: "POST /v1/git-events"
              payload: { project_id: "${project_id}", branch: "feat-b", git_ref: "refs/heads/feat-b", commit_sha: "bbb222", region: "IAD" }
              as: SystemWebhook
              captures: { d1: $.data.id }
            - call: "POST /v1/deployments/${d1}/build-start"
              payload: {}
              as: SystemWebhook
            - call: "POST /v1/deployments/${d1}/build-complete"
              payload: { outcome: "SUCCESS", build_duration_seconds: 180 }
              as: SystemWebhook
          trigger:
            - call: "POST /v1/deployments/${d2}/promote"
              payload: {}
              as: TeamOwner
              captures: { err: $.data.error_id }
          assert:
            - "Project.${project_id}.status == SUSPENDED after d1 completes (bill 60+180=240s -> 1+3=4 min, overage 3 x 100 = 300 >= 200)"
            - "promote response error_id == ERR_PROJECT_SUSPENDED"
            - "Deployment.${d2}.status == READY (unchanged)"

      - name: usage_ingest_blocked_by_period_state_period_to_event
        grounds:
          - state_machines.UsagePeriod.OPEN_to_CLOSED
          - "validations[priority=5]"
          - "errors[ERR_USAGE_PERIOD_CLOSED]"
        distinguishing_aspect: |
          Pair: UsageEvent -> UsagePeriod (different pair than
          Deployment->Project). Ingesting a usage event requires an OPEN
          period; after close, ingest fails with ERR_USAGE_PERIOD_CLOSED even
          though the deployment reference is valid.
        test_recipe:
          setup:
            - "Team with one READY deployment; usage period closed"
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { tier: "PRO", seat_limit: 10, included_build_minutes: 300, build_concurrency_limit: 2, included_bandwidth_gb: 100, included_invocations_millions: 5, bandwidth_tier1_rate_cents_per_gb: 10, bandwidth_tier2_rate_cents_per_gb: 5, bandwidth_tier2_threshold_gb: 50, invocation_rate_cents_per_million: 40, seat_price_cents_monthly: 0, overage_build_minute_rate_cents: 5 }
              as: PlatformAdmin
            - call: "POST /v1/teams"
              payload: { name: "Acme", plan_tier: "PRO" }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/projects"
              payload: { name: "web", production_branch: "main" }
              as: TeamOwner
              captures: { project_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/usage-periods"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: TeamBillingManager
              captures: { period_id: $.data.id }
            - call: "POST /v1/git-events"
              payload: { project_id: "${project_id}", branch: "feat-a", git_ref: "refs/heads/feat-a", commit_sha: "aaa111", region: "IAD" }
              as: SystemWebhook
              captures: { dep_id: $.data.id }
            - call: "POST /v1/usage-periods/${period_id}/close"
              payload: {}
              as: TeamBillingManager
          trigger:
            - call: "POST /v1/teams/${team_id}/usage-events"
              payload: { deployment_id: "${dep_id}", event_type: "BANDWIDTH", bandwidth_bytes: 1000, region: "IAD" }
              as: SystemWebhook
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_USAGE_PERIOD_CLOSED (UsageEvent ingest gated on UsagePeriod.state)"

  # ===========================================================================
  # Rule 8: resource_temporal_overlap — different interval semantics, resources
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: usage_period_half_open_interval_overlap_on_team
        grounds:
          - "errors[ERR_USAGE_PERIOD_OVERLAP]"
          - entities.UsagePeriod.fields.period_start
          - entities.UsagePeriod.fields.period_end
        distinguishing_aspect: |
          Resource: Team (one OPEN period at a time). Interval semantics:
          half-open [start, end) — an adjacent period whose start equals the
          prior period's end does NOT overlap, while start one second earlier
          does.
        test_recipe:
          setup:
            - "Team with period P1 [2026-09-01, 2026-10-01) CLOSED... needs P1 closed first? No: overlap check is against any existing period; P1 left OPEN would also block via one-OPEN rule, so close P1 to isolate the interval check"
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { tier: "PRO", seat_limit: 10, included_build_minutes: 300, build_concurrency_limit: 2, included_bandwidth_gb: 100, included_invocations_millions: 5, bandwidth_tier1_rate_cents_per_gb: 10, bandwidth_tier2_rate_cents_per_gb: 5, bandwidth_tier2_threshold_gb: 50, invocation_rate_cents_per_million: 40, seat_price_cents_monthly: 0, overage_build_minute_rate_cents: 5 }
              as: PlatformAdmin
            - call: "POST /v1/teams"
              payload: { name: "Acme", plan_tier: "PRO" }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/usage-periods"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: TeamBillingManager
              captures: { p1: $.data.id }
            - call: "POST /v1/usage-periods/${p1}/close"
              payload: {}
              as: TeamBillingManager
          trigger:
            - call: "POST /v1/teams/${team_id}/usage-periods"
              payload: { period_start: "2026-10-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z" }
              as: TeamBillingManager
              captures: { p2: $.data.id }
            - call: "POST /v1/usage-periods/${p2}/close"
              payload: {}
              as: TeamBillingManager
            - call: "POST /v1/teams/${team_id}/usage-periods"
              payload: { period_start: "2026-09-30T23:59:59Z", period_end: "2026-12-01T00:00:00Z" }
              as: TeamBillingManager
              captures: { err: $.data.error_id }
          assert:
            - "adjacent period [2026-10-01, 2026-11-01) created successfully (half-open adjacency is not overlap)"
            - "overlapping period [2026-09-30T23:59:59, ...) rejected with ERR_USAGE_PERIOD_OVERLAP (1 second inside P1's [start,end))"

      - name: env_var_scope_set_overlap_on_project
        grounds:
          - "errors[ERR_ENV_SCOPE_OVERLAP]"
          - entities.EnvironmentVariable.fields.scopes
        distinguishing_aspect: |
          Resource: Project env-var key namespace. Interval semantics: set
          overlap (discrete scopes, not continuous time) — sharing any scope
          element is a conflict; disjoint scopes for the same key coexist.
          Different semantics (membership vs half-open interval) and different
          resource entity than the usage-period rule.
        test_recipe:
          setup:
            - "Project with env var API_KEY scopes=[PRODUCTION]"
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { tier: "PRO", seat_limit: 10, included_build_minutes: 300, build_concurrency_limit: 2, included_bandwidth_gb: 100, included_invocations_millions: 5, bandwidth_tier1_rate_cents_per_gb: 10, bandwidth_tier2_rate_cents_per_gb: 5, bandwidth_tier2_threshold_gb: 50, invocation_rate_cents_per_million: 40, seat_price_cents_monthly: 0, overage_build_minute_rate_cents: 5 }
              as: PlatformAdmin
            - call: "POST /v1/teams"
              payload: { name: "Acme", plan_tier: "PRO" }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/projects"
              payload: { name: "web", production_branch: "main" }
              as: TeamOwner
              captures: { project_id: $.data.id }
            - call: "POST /v1/projects/${project_id}/env-vars"
              payload: { key: "API_KEY", value: "prod-key", scopes: ["PRODUCTION"] }
              as: Developer
          trigger:
            - call: "POST /v1/projects/${project_id}/env-vars"
              payload: { key: "API_KEY", value: "prev-key", scopes: ["PREVIEW", "DEVELOPMENT"] }
              as: Developer
              captures: { ev2: $.data.id }
            - call: "POST /v1/projects/${project_id}/env-vars"
              payload: { key: "API_KEY", value: "dup-key", scopes: ["DEVELOPMENT", "PRODUCTION"] }
              as: Developer
              captures: { err: $.data.error_id }
          assert:
            - "disjoint scopes [PREVIEW, DEVELOPMENT] accepted (201)"
            - "overlapping scopes [DEVELOPMENT, PRODUCTION] rejected with ERR_ENV_SCOPE_OVERLAP (shares DEVELOPMENT with ev2 and PRODUCTION with the first var)"

  # ===========================================================================
  # Rule 9: compensating_invariant — different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: promote_rollback_pair_conserves_production_deployment_count
        grounds:
          - state_machines.Deployment.READY_to_PROMOTED
          - state_machines.Deployment.PROMOTED_to_ROLLED_BACK
          - state_machines.Deployment.PROMOTED_to_PROMOTED
          - entities.Project.fields.production_deployment_id
        distinguishing_aspect: |
          Conserved quantity: count of deployments with status == PROMOTED per
          project (must always be exactly 1 once any promotion happened).
          Forward action (promote d2) paired with its compensating action
          (rollback) leaves the project with exactly one PROMOTED deployment
          and the SAME production_deployment_id as before the pair — no drift.
        test_recipe:
          setup:
            - "Project with d1 PROMOTED to production and d2 READY"
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { tier: "PRO", seat_limit: 10, included_build_minutes: 300, build_concurrency_limit: 2, included_bandwidth_gb: 100, included_invocations_millions: 5, bandwidth_tier1_rate_cents_per_gb: 10, bandwidth_tier2_rate_cents_per_gb: 5, bandwidth_tier2_threshold_gb: 50, invocation_rate_cents_per_million: 40, seat_price_cents_monthly: 0, overage_build_minute_rate_cents: 5 }
              as: PlatformAdmin
            - call: "POST /v1/teams"
              payload: { name: "Acme", plan_tier: "PRO" }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/projects"
              payload: { name: "web", production_branch: "main" }
              as: TeamOwner
              captures: { project_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/usage-periods"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: TeamBillingManager
            - call: "POST /v1/git-events"
              payload: { project_id: "${project_id}", branch: "main", git_ref: "refs/heads/main", commit_sha: "aaa111", region: "IAD" }
              as: SystemWebhook
              captures: { d1: $.data.id }
            - call: "POST /v1/deployments/${d1}/build-start"
              payload: {}
              as: SystemWebhook
            - call: "POST /v1/deployments/${d1}/build-complete"
              payload: { outcome: "SUCCESS", build_duration_seconds: 60 }
              as: SystemWebhook
            - call: "POST /v1/deployments/${d1}/promote"
              payload: {}
              as: TeamOwner
            - call: "POST /v1/git-events"
              payload: { project_id: "${project_id}", branch: "main", git_ref: "refs/heads/main", commit_sha: "bbb222", region: "IAD" }
              as: SystemWebhook
              captures: { d2: $.data.id }
            - call: "POST /v1/deployments/${d2}/build-start"
              payload: {}
              as: SystemWebhook
            - call: "POST /v1/deployments/${d2}/build-complete"
              payload: { outcome: "SUCCESS", build_duration_seconds: 60 }
              as: SystemWebhook
          trigger:
            - call: "POST /v1/deployments/${d2}/promote"
              payload: {}
              as: TeamOwner
            - call: "POST /v1/projects/${project_id}/rollback"
              payload: {}
              as: TeamOwner
            - call: "GET /v1/deployments?project_id=${project_id}&status=PROMOTED"
              as: TeamOwner
              captures: { promoted_count: $.data.0.id }
          assert:
            - "after the promote+rollback pair: exactly 1 deployment has status PROMOTED (list length 1 and it is ${d1})"
            - "Project.${project_id}.production_deployment_id == ${d1} (identical to before the pair — invariant conserved)"
            - "Deployment.${d2}.status == ROLLED_BACK"

      - name: member_add_remove_pair_conserves_seat_count
        grounds:
          - entities.Team.fields.seats_used
          - entities.Team.fields.prorated_charges_cents
          - calculations.seat_proration
        distinguishing_aspect: |
          Conserved quantity: Team.seats_used (a count, different type of
          quantity than a status-set cardinality). Forward action (add member)
          paired with compensating action (remove the same member) restores
          seats_used exactly; prorated_charges_cents is NOT refunded (it is a
          historical ledger, deliberately not part of the conserved quantity —
          asserts pin that asymmetry).
        test_recipe:
          setup:
            - "PRO team with OPEN period, clock at period mid; one member added then removed"
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { tier: "PRO", seat_limit: 10, included_build_minutes: 300, build_concurrency_limit: 2, included_bandwidth_gb: 100, included_invocations_millions: 5, bandwidth_tier1_rate_cents_per_gb: 10, bandwidth_tier2_rate_cents_per_gb: 5, bandwidth_tier2_threshold_gb: 50, invocation_rate_cents_per_million: 40, seat_price_cents_monthly: 2000, overage_build_minute_rate_cents: 5 }
              as: PlatformAdmin
            - call: "POST /v1/teams"
              payload: { name: "Acme", plan_tier: "PRO" }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /v1/teams/${team_id}/usage-periods"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: TeamBillingManager
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/teams/${team_id}/members"
              payload: { user_email: "dev@acme.com", role: "DEVELOPER" }
              as: TeamOwner
              captures: { member_id: $.data.id }
            - call: "DELETE /v1/teams/${team_id}/members/${member_id}"
              payload: {}
              as: TeamOwner
          assert:
            - "Team.${team_id}.seats_used == 0 (add+remove pair conserves seat count)"
            - "Team.${team_id}.prorated_charges_cents == 1000 (2000 * 15/30; charge NOT refunded — ledger asymmetry pinned)"
