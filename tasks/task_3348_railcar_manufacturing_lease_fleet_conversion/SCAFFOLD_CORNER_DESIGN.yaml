        keeps the component_class, so decides_material is false, while the CS-O -> CS-O2 swap changes
        the class, so decides_material is true.
      - Two SOLD orders of 1 car each are reserved and then carry one APPROVED endorsement apiece, each
        created against the order version current after its reservation.
      setup_api_calls:
