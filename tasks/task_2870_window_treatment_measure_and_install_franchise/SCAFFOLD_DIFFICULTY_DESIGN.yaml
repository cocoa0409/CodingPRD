              captures: { q1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:00:00.000Z" }
              as: Franchisor
              as_user_id: "hq-ops"
            - call: "POST /blinds/quotes/${q1}/present"
              as: Designer
              as_user_id: "${d1}"
            - call: "POST /blinds/quotes/${q1}/accept"
              as: Designer
              as_user_id: "${d1}"
              captures: { qv1: $.data.version }
            - call: "POST /blinds/vendor-orders"
              payload: { quote_id: "${q1}", opening_ids: ["${o1}", "${o2}"], expected_quote_version: "${qv1}", preferred_vendor_id: "${v1}" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { ord1: $.data.id }
            - call: "POST /blinds/vendor-orders/${ord1}/ship"
              as: VendorRep
              as_user_id: "${v1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-17T09:00:00.000Z" }
              as: Franchisor
              as_user_id: "hq-ops"
            - call: "POST /blinds/vendor-orders/${ord1}/receive"
              as: Franchisee
              as_user_id: "${t1}"
            - call: "POST /blinds/install-jobs"
              payload: { vendor_order_id: "${ord1}", designer_id: "${d1}", scheduled_start_at: "2026-08-20T09:00:00.000Z", scheduled_end_at: "2026-08-20T12:00:00.000Z", service_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { j1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T09:30:00.000Z" }
              as: Franchisor
              as_user_id: "hq-ops"
          trigger:
            - call: "POST /blinds/install-jobs/${j1}/commissioning/pair"
              payload: { paired_channel_count: 1, hub_platform: "MATTER" }
              as: Designer
              as_user_id: "${d1}"
            - call: "POST /blinds/install-jobs/${j1}/commissioning/verify"
              as: Designer
              as_user_id: "${d1}"
            - call: "POST /blinds/install-jobs/${j1}/commissioning/pair"
              payload: { paired_channel_count: 2, hub_platform: "HOMEKIT" }
              as: Designer
              as_user_id: "${d1}"
            - call: "POST /blinds/install-jobs/${j1}/commissioning/verify"
              as: Designer
              as_user_id: "${d1}"
            - call: "POST /blinds/install-jobs/${j1}/complete"
              as: Designer
              as_user_id: "${d1}"
          assert:
            - "at job creation: InstallJob.${j1}.motorized_channel_count == 2, commissioning_status == PENDING, install_status == SCHEDULED"
            - "after the first pair call: commissioning_status == PAIRED, paired_channel_count == 1, commissioning_attempt_count == 1, hub_platform == MATTER, install_status still == SCHEDULED"
            - "the first verify call returns 200 (not an error) with commissioning_status == FAILED because 1 < 2, and install_status is still SCHEDULED"
            - "a POST /blinds/install-jobs/${j1}/complete attempted at this point fails with ERR_COMMISSIONING_NOT_VERIFIED (409) and install_status remains SCHEDULED"
            - "after the second pair call: commissioning_status == PAIRED, paired_channel_count == 2, commissioning_attempt_count == 2, hub_platform == HOMEKIT (overwritten)"
            - "the second verify call returns 200 with commissioning_status == VERIFIED and install_status STILL == SCHEDULED - verification never advances the first dimension"
            - "the final complete call yields install_status == COMPLETED with commissioning_status unchanged at VERIFIED and commissioning_attempt_count unchanged at 2"
            - "Opening.${o1}.install_outcome == INSTALLED and Opening.${o2}.install_outcome == INSTALLED"
            - "Quote.${q1}.net_sales_cents == 86282 and Quote.${q1}.recognized_net_sales_cents == 86282"
            - "Territory.${t1}.royalty_accrued_cents == 4746 (the final variant reproduces the provisional figure, so the true-up delta is 0)"

      - name: quote_revision_cycle_restarts_the_expiry_window_and_halts_at_the_third_revise
        grounds:
          - state_machines.Quote.DRAFT_to_PRESENTED
          - state_machines.Quote.PRESENTED_to_DRAFT
          - calculations.quote_expiry_window
          - entities.Quote.fields.revision_count
          - entities.Quote.fields.expires_at
          - validations.priority_19_ERR_REVISION_LIMIT_REACHED
        distinguishing_aspect: |
          Non-linearity of the CYCLIC kind, on a different entity and a different loop
          counter from the commissioning instance: PRESENTED -> DRAFT -> PRESENTED is legal
          exactly QUOTE_MAX_REVISIONS (2) times, each re-presentation clears and re-stamps
          the six money fields and RESTARTS the 14-day expiry window from the later clock
