  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:

      - name: list_offers_filtered_by_status
        claim_type: standard_crud
        grounds:
          - endpoints[GET /ncaa/scholarship-offers]
        distinguishing_aspect: |
          GET /ncaa/scholarship-offers?status=SENT returns only SENT offers;
          DRAFT offers are excluded.
        test_recipe:
          setup:
            - "One DRAFT and one SENT scholarship-offer."
          setup_api_calls:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "MBB", school_name: "Filter U", scholarship_slot_cap: 13 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "AA", sport_code: "MBB", gpa: 3.500, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { a_id: $.data.id }
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "BB", sport_code: "MBB", gpa: 3.400, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { b_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${a_id}" }
              as: EligibilityCenter
              captures: { ca_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications/${ca_id}/approve"
              payload: {}
              as: EligibilityCenter
            - call: "POST /ncaa/scholarship-offers"
              payload: { program_id: "${prog_id}", student_athlete_id: "${a_id}", annual_value_cents: 3000000 }
              as: Coach
              captures: { off_a_id: $.data.id }
            - call: "POST /ncaa/scholarship-offers/${off_a_id}/send"
              payload: { expected_program_version: "${prog_v0}" }
              as: Coach
            - call: "POST /ncaa/scholarship-offers"
              payload: { program_id: "${prog_id}", student_athlete_id: "${b_id}", annual_value_cents: 3000000 }
              as: Coach
              captures: { off_b_id: $.data.id }
          trigger:
            - call: "GET /ncaa/scholarship-offers"
              payload: { status: "SENT", program_id: "${prog_id}" }
              as: ComplianceOfficer
          assert:
            - "data length == 1"
            - "every element has status == SENT"

      - name: utilization_endpoint_default_variant_is_base
        claim_type: computed_read
        grounds:
          - endpoints[GET /ncaa/programs/{id}/utilization]
          - calculations.scholarship_slot_utilization
        distinguishing_aspect: |
          GET /ncaa/programs/{id}/utilization without variant param defaults
          to base (slots_committed).
        test_recipe:
          setup:
            - "Program with no offers."
          setup_api_calls:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "FOOTBALL", school_name: "Default U", scholarship_slot_cap: 85 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /ncaa/programs/${prog_id}/utilization"
              payload: {}
              as: Coach
              captures: { variant: $.data.variant, count: $.data.slot_count }
          assert:
            - "variant == base"
            - "count == 0"

      - name: period_list_for_program_sub_resource
        claim_type: cross_reference
        grounds:
          - endpoints[GET /ncaa/programs/{id}/periods]
        distinguishing_aspect: |
          GET /ncaa/programs/{id}/periods returns all Periods for that Program;
          empty array when none exist.
        test_recipe:
          setup:
            - "Program with two periods."
          setup_api_calls:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "BASEBALL", school_name: "Cal U", scholarship_slot_cap: 11 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /ncaa/programs/${prog_id}/periods"
              payload: { period_type: "CONTACT", starts_at: "2026-12-01T00:00:00Z", ends_at: "2026-12-05T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /ncaa/programs/${prog_id}/periods"
              payload: { period_type: "QUIET", starts_at: "2026-12-05T00:00:00Z", ends_at: "2026-12-10T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /ncaa/programs/${prog_id}/periods"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "data length == 2"

  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:

      - name: error_coach_program_mismatch_on_withdraw
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_COACH_PROGRAM_MISMATCH]
        distinguishing_aspect: |
          A Coach whose X-User-ID was never affiliated to offer.program_id
          (i.e., does not appear as any prior coach_user_id on the program)
          cannot withdraw it.
        test_recipe:
          setup:
            - "Program; offer SENT by coach_x; coach_y attempts to withdraw."
          setup_api_calls:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "FOOTBALL", school_name: "Mismatch U", scholarship_slot_cap: 85 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /ncaa/programs/${prog_id}/periods"
              payload: { period_type: "CONTACT", starts_at: "2026-05-01T00:00:00Z", ends_at: "2026-05-31T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /ncaa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "K", sport_code: "FOOTBALL", gpa: 3.500, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { k_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${k_id}" }
              as: EligibilityCenter
              captures: { ck_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications/${ck_id}/approve"
              payload: {}
              as: EligibilityCenter
            - call: "POST /ncaa/recruiting-contacts"
              payload: { program_id: "${prog_id}", student_athlete_id: "${k_id}", coach_user_id: "coach_x", contact_at: "2026-05-10T12:00:00Z", channel: "IN_PERSON" }
              as: Coach
              as_user_id: "coach_x"
            - call: "POST /ncaa/scholarship-offers"
              payload: { program_id: "${prog_id}", student_athlete_id: "${k_id}", annual_value_cents: 4000000 }
              as: Coach
              as_user_id: "coach_x"
              captures: { off_id: $.data.id }
            - call: "POST /ncaa/scholarship-offers/${off_id}/send"
              payload: { expected_program_version: "${prog_v0}" }
              as: Coach
              as_user_id: "coach_x"
          trigger:
            - call: "POST /ncaa/scholarship-offers/${off_id}/withdraw"
              payload: {}
              as: Coach
              as_user_id: "coach_y"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_COACH_PROGRAM_MISMATCH"

      - name: error_stale_program_version_on_send
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[scholarship-send-stale-program]
          - errors[ERR_STALE_PROGRAM_VERSION]
        distinguishing_aspect: |
          A second send-call carrying the pre-first-send program version is
          rejected with 412 ERR_STALE_PROGRAM_VERSION (OCC fence).
        test_recipe:
          setup:
            - "Program cap=85; two CERTIFIED athletes; two DRAFT offers."
            - "First send succeeds and advances Program.version."
          setup_api_calls:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "FOOTBALL", school_name: "OCC U", scholarship_slot_cap: 85 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "A1", sport_code: "FOOTBALL", gpa: 3.500, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { a1_id: $.data.id }
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "A2", sport_code: "FOOTBALL", gpa: 3.400, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { a2_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${a1_id}" }
              as: EligibilityCenter
              captures: { c1_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications/${c1_id}/approve"
              payload: {}
              as: EligibilityCenter
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${a2_id}" }
              as: EligibilityCenter
              captures: { c2_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications/${c2_id}/approve"
              payload: {}
              as: EligibilityCenter
            - call: "POST /ncaa/scholarship-offers"
              payload: { program_id: "${prog_id}", student_athlete_id: "${a1_id}", annual_value_cents: 3000000 }
              as: Coach
              captures: { o1_id: $.data.id }
            - call: "POST /ncaa/scholarship-offers/${o1_id}/send"
              payload: { expected_program_version: "${prog_v0}" }
              as: Coach
              captures: { prog_v1: $.data.version }
            - call: "POST /ncaa/scholarship-offers"
              payload: { program_id: "${prog_id}", student_athlete_id: "${a2_id}", annual_value_cents: 3000000 }
              as: Coach
              captures: { o2_id: $.data.id }
          trigger:
            - call: "POST /ncaa/scholarship-offers/${o2_id}/send"
              payload: { expected_program_version: "${prog_v0}" }
              as: Coach
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_STALE_PROGRAM_VERSION"

      - name: error_stale_incident_version_on_sustain
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[incident-sustain-stale-incident]
          - errors[ERR_STALE_INCIDENT_VERSION]
        distinguishing_aspect: |
          A second sustain-call carrying the pre-open-investigation incident
          version is rejected with ERR_STALE_INCIDENT_VERSION; OCC on
          BoosterIncident.
        test_recipe:
          setup:
            - "BoosterIncident in INVESTIGATING."
          setup_api_calls:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "MBB", school_name: "Inc U", scholarship_slot_cap: 13 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "AthInc", sport_code: "MBB", gpa: 3.000, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { ath_id: $.data.id }
            - call: "POST /ncaa/booster-incidents"
              payload: { program_id: "${prog_id}", booster_name: "B", student_athlete_id: "${ath_id}", alleged_value_cents: 100000 }
              as: ComplianceOfficer
              captures: { inc_id: $.data.id, inc_v0: $.data.version }
            - call: "POST /ncaa/booster-incidents/${inc_id}/open-investigation"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /ncaa/booster-incidents/${inc_id}/sustain"
              payload: { expected_boosterincident_version: "${inc_v0}" }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_STALE_INCIDENT_VERSION"

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:

      - name: rbac_coach_cannot_create_program
        claim_type: role_denied
        grounds:
          - roles[Coach]
          - endpoints[POST /ncaa/programs]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          POST /ncaa/programs is exclusive to ComplianceOfficer; a Coach
          attempt returns ERR_UNAUTHORIZED (403).
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "FOOTBALL", school_name: "Denied U", scholarship_slot_cap: 85 }
              as: Coach
              as_user_id: "coach_y"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_UNAUTHORIZED"

      - name: rbac_unauthenticated_request_rejected
        claim_type: missing_auth
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          A request without X-User-Role (or X-User-ID) headers returns
          ERR_UNAUTHENTICATED 401, regardless of endpoint.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /ncaa/programs"
              payload: {}
              as: ""
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_UNAUTHENTICATED"

      - name: rbac_eligibilitycenter_cannot_send_offer
        claim_type: role_denied
        grounds:
          - roles[EligibilityCenter]
          - endpoints[POST /ncaa/scholarship-offers/{id}/send]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          POST /ncaa/scholarship-offers/{id}/send is restricted to Coach.
          EligibilityCenter call returns ERR_UNAUTHORIZED.
        test_recipe:
          setup:
            - "Program + offer exist; Eligibility Center attempts to send."
          setup_api_calls:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "FOOTBALL", school_name: "RBAC U", scholarship_slot_cap: 85 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "M", sport_code: "FOOTBALL", gpa: 3.500, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { m_id: $.data.id }
            - call: "POST /ncaa/scholarship-offers"
              payload: { program_id: "${prog_id}", student_athlete_id: "${m_id}", annual_value_cents: 4000000 }
              as: Coach
              captures: { off_id: $.data.id }
          trigger:
            - call: "POST /ncaa/scholarship-offers/${off_id}/send"
              payload: { expected_program_version: "${prog_v0}" }
              as: EligibilityCenter
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_UNAUTHORIZED"

  # ===========================================================================
  # Section: cross_cutting_complexity_layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[scholarship-send-stale-program]
        distinguishing_aspect: |
          The first send call with the current Program.version is accepted;
          Program.version increments by exactly 1.
        test_recipe:
          setup:
            - "Program version=1; one CERTIFIED athlete; one DRAFT offer."
          setup_api_calls:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "FOOTBALL", school_name: "Happy U", scholarship_slot_cap: 85 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "OkAth", sport_code: "FOOTBALL", gpa: 3.500, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { ok_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${ok_id}" }
              as: EligibilityCenter
              captures: { c_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications/${c_id}/approve"
              payload: {}
              as: EligibilityCenter
            - call: "POST /ncaa/scholarship-offers"
              payload: { program_id: "${prog_id}", student_athlete_id: "${ok_id}", annual_value_cents: 3000000 }
              as: Coach
              captures: { off_id: $.data.id }
          trigger:
            - call: "POST /ncaa/scholarship-offers/${off_id}/send"
              payload: { expected_program_version: "${prog_v0}" }
              as: Coach
              captures: { off_status: $.data.status }
            - call: "GET /ncaa/programs/${prog_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { prog_v_new: $.data.version }
          assert:
            - "off_status == SENT"
            - "prog_v_new == 2"

      - name: clock_set_current_utc_drives_window_logic
        claim_type: scheduled_actions
        grounds:
          - endpoints[POST /ncaa/_clock/set_current_utc]
          - state_machines.TransferPortalEntry
        distinguishing_aspect: |
          The clock-set endpoint is the only mechanism to advance time;
          window_closes_at is computed from the clock at entered_at, and
          subsequent window logic respects later clock-sets.
        test_recipe:
          setup:
            - "Clock=2026-01-01. CERTIFIED athlete enters portal; window_closes_at == 2026-02-15."
          setup_api_calls:
            - call: "POST /ncaa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /ncaa/programs"
              payload: { sport_code: "MBB", school_name: "Clock U", scholarship_slot_cap: 13 }
              as: ComplianceOfficer
              captures: { src_id: $.data.id }
            - call: "POST /ncaa/student-athletes"
              payload: { full_name: "Cl", sport_code: "MBB", gpa: 3.000, amateurism_flag: true }
              as: ComplianceOfficer
              captures: { cl_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications"
              payload: { student_athlete_id: "${cl_id}" }
              as: EligibilityCenter
              captures: { cer_id: $.data.id }
            - call: "POST /ncaa/eligibility-certifications/${cer_id}/approve"
              payload: {}
              as: EligibilityCenter
          trigger:
            - call: "POST /ncaa/transfer-portal-entries"
              payload: { student_athlete_id: "${cl_id}", source_program_id: "${src_id}" }
              as: StudentAthlete
              as_user_id: "${cl_id}"
              captures: { entry_id: $.data.id, wc: $.data.window_closes_at, ea: $.data.entered_at }
          assert:
            - "ea == 2026-01-01T00:00:00Z"
            - "wc == 2026-02-15T00:00:00Z"

      - name: cascade_cert_deny_already_exercised
        claim_type: cascading_side_effects
        grounds:
          - state_machines.EligibilityCertification
        excluded_because:
          difficulty_instance: transitive_cascade / eligibility_deny_cascade_withdraws_offers_depth2
          rationale: "Exercised by the named §1.8 transitive_cascade instance."

      - name: tiered_pricing_high_value_already_exercised
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.nil_value_classification
        excluded_because:
          difficulty_instance: combinatorial_formula / nil_value_classification_nested_rounding_order
          rationale: "Exercised by the named §1.8 combinatorial_formula instance."

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_visibility_after_create
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[GET /ncaa/programs/{id}]
        distinguishing_aspect: |
          A Program created in one request is visible via GET immediately;
          no eventual-consistency lag.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /ncaa/programs"
              payload: { sport_code: "SOFTBALL", school_name: "Now U", scholarship_slot_cap: 12 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id, ver_after_create: $.data.version }
            - call: "GET /ncaa/programs/${prog_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { name: $.data.school_name, ver_after_get: $.data.version }
          assert:
            - "name == Now U"
            - "ver_after_create == 1"
            - "ver_after_get == 1"
