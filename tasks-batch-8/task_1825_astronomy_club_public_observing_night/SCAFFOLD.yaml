# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/mistyped required field, out-of-range number, or unknown enum value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the requested transition exists" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "window_start >= window_end or period_start >= period_end" }
  - { id: ERR_MOON_TOO_BRIGHT, http: 422, condition: "PUBLIC_NIGHT schedule with moon_illumination_pct > 40" }
  - { id: ERR_NOT_DAYLIGHT_WINDOW, http: 422, condition: "SOLAR_SESSION window outside civil daylight of the event date" }
  - { id: ERR_WEATHER_RISK, http: 422, condition: "Confirm attempted while latest weather_cancellation_pct >= 70" }
  - { id: ERR_INSUFFICIENT_OPERATORS, http: 422, condition: "Confirm attempted with confirmed_operator_count < min_operators" }
  - { id: ERR_NO_SOLAR_CERTIFIED_OPERATOR, http: 422, condition: "SOLAR_SESSION confirm without a CONFIRMED operator holding ACTIVE SOLAR_SCOPE certification" }
  - { id: ERR_CERTIFICATION_REQUIRED, http: 422, condition: "Member lacks ACTIVE TrainingCertification for the telescope's equipment_class" }
  - { id: ERR_MEMBER_NOT_IN_GOOD_STANDING, http: 422, condition: "Member not ACTIVE (or tier lacks loan_privilege) for a standing-gated operation" }
  - { id: ERR_TELESCOPE_NOT_RESERVABLE, http: 409, condition: "Telescope not AVAILABLE, or collimation_due_at <= logical clock" }
  - { id: ERR_LOAN_WINDOW_CONFLICT, http: 409, condition: "New loan window intersects an existing non-terminal reservation of the same telescope (half-open semantics)" }
  - { id: ERR_OPERATOR_OVERLAP, http: 409, condition: "Accepting assignment would give the member two CONFIRMED assignments at overlapping event windows (closed-touch counts)" }
  - { id: ERR_EVENT_GROUP_CAPACITY, http: 422, condition: "Confirm would push the event's aggregate CONFIRMED party_size over 60" }
  - { id: ERR_NO_SHOW_THROTTLED, http: 422, condition: "Contact member has no_show_strikes >= 2 in the trailing 365-day window" }
  - { id: ERR_PAYMENT_INSUFFICIENT, http: 422, condition: "Payment plus available member credit below invoice amount_cents" }
  - { id: ERR_LOANS_OUTSTANDING, http: 422, condition: "Resign attempted while member has CHECKED_OUT or OVERDUE loans" }
  - { id: ERR_INSUFFICIENT_READINGS, http: 422, condition: "DarkSkyReport finalize with reading_count < 3" }
  - { id: ERR_LOAN_CAP_REACHED, http: 422, condition: "Member already holds tier.max_concurrent_loans non-terminal reservations" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ClubOfficer
    description: "Club officer — membership, dues, tiers, dark-sky reports, clock; administrative superset for member operations"
    identity: opaque
    exclusive_operations:
      - "POST /club/membership-tiers"
      - "POST /club/members"
      - "POST /club/dues-invoices"
      - "POST /club/dues-invoices/{invoiceId}/void"
      - "POST /club/members/{memberId}/reinstate"
      - "POST /club/dark-sky-reports"
      - "POST /club/dark-sky-reports/{reportId}/finalize"
      - "POST /club/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints (all)"
      - "POST /club/dues-payments"
      - "POST /club/members/{memberId}/resign"
  - name: Member
    description: "Club member — acts on own loans, bookings, assignments, readings, payments"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /club/event-operator-assignments/{assignmentId}/accept"
      - "POST /club/event-operator-assignments/{assignmentId}/decline"
      - "POST /club/event-operator-assignments/{assignmentId}/withdraw"
      - "POST /club/group-visit-bookings"
      - "POST /club/sky-quality-readings"
    shared_operations:
      - "GET endpoints (member-visible subset)"
      - "POST /club/loan-reservations"
      - "POST /club/loan-reservations/{loanId}/cancel"
      - "POST /club/group-visit-bookings/{bookingId}/cancel"
      - "POST /club/dues-payments"
      - "POST /club/members/{memberId}/resign"
  - name: EventCoordinator
    description: "Event coordinator — observing events, operator invitations, group booking confirmations"
    identity: opaque
    exclusive_operations:
      - "POST /club/observing-events"
      - "POST /club/observing-events/{eventId}/schedule"
      - "POST /club/observing-events/{eventId}/unschedule"
      - "POST /club/observing-events/{eventId}/weather-check"
      - "POST /club/observing-events/{eventId}/confirm"
      - "POST /club/observing-events/{eventId}/cancel"
      - "POST /club/observing-events/{eventId}/complete"
      - "POST /club/event-operator-assignments"
      - "POST /club/event-operator-assignments/{assignmentId}/mark-no-show"
      - "POST /club/group-visit-bookings/{bookingId}/confirm"
      - "POST /club/group-visit-bookings/{bookingId}/mark-no-show"
    shared_operations:
      - "GET endpoints (all)"
      - "POST /club/group-visit-bookings/{bookingId}/cancel"
  - name: EquipmentChair
    description: "Equipment chair — telescopes, maintenance, certifications, loan checkout/return"
    identity: opaque
    exclusive_operations:
      - "POST /club/telescopes"
      - "PUT /club/telescopes/{telescopeId}"
      - "POST /club/telescopes/{telescopeId}/retire"
      - "POST /club/maintenance-tickets and all ticket actions"
      - "POST /club/training-certifications"
      - "POST /club/training-certifications/{certId}/revoke"
      - "POST /club/loan-reservations/{loanId}/checkout"
      - "POST /club/loan-reservations/{loanId}/return"
    shared_operations:
      - "GET endpoints (all)"
      - "POST /club/loan-reservations"
      - "POST /club/loan-reservations/{loanId}/cancel"
