        distinguishing_aspect: |
          Mode (c): evaluation ORDER inside one formula. The pre-burden
          cumulative accrual is 4,900,000 cents, just under the 5,000,000
          tier-1 ceiling, while the burden-loaded figure (5,274,850) sits
          above it. The pinned reading keys the tier on the pre-burden
