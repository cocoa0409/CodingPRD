          trigger:
            - { call: "POST /naic/model-acts", payload: { model_code: "MDL-870", version_label: "v1", title: "Model Immediate Act", act_type: "MODEL_REGULATION", committee_name: "B Committee", is_core: true }, as: AssociationStaff, captures: { act_id: $.data.id } }
            - { call: "GET /naic/model-acts/${act_id}", payload: {}, as: Actuary, as_user_id: "actuary-7", captures: { g_title: $.data.title, g_st: $.data.status, g_core: $.data.is_core } }
          assert:
            - "GET returns title == Model Immediate Act, status == DRAFTING, is_core == true in the immediately following request"










