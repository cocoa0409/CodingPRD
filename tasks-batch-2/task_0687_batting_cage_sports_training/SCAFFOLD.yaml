# =============================================================================
# SCAFFOLD — task_0687_batting_cage_sports_training
# Batting Cage & Sports-Training Complex
# Difficulty: Expert
# =============================================================================

scenario: |
  Batting Cage & Sports-Training Complex: cage/tunnel & lane reservation,
  per-token/hourly vs membership, lesson & instructor scheduling, team/cage
  rental block, pitching-machine/equipment & maintenance, party package,
  league/clinic, waiver 输出文件夹：tasks/task_0687_batting_cage_sports_training

domain_name: batting-cage-sports-training
api_prefix: /v1

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: hybrid
  # Facility is the aggregate root (posture-gated). Lanes/Machines hang under it.
  # Reservations / Lessons / TeamBlocks / Parties reference Lanes + Members +
  # Instructors via FK across the hierarchy (cross_aggregate references).

  state_machine_shape: branching
  # Booking lifecycle forks REQUESTED -> {CONFIRMED, REJECTED}; CONFIRMED ->
  # {CHECKED_IN -> COMPLETED, CANCELLED, NO_SHOW}. Lane posture is compound /
  # posture_driven (OPEN/RESTRICTED/CLOSED) gating child bookings.

  relationship_patterns:
    - one_to_many        # Facility -> Lane, Facility -> Machine, Member -> Waiver
    - cross_aggregate    # Booking references Lane + Member + Machine across roots
    - polymorphic        # Booking.kind ∈ {OPEN_SLOT, LESSON, TEAM_BLOCK, PARTY} share one interval table

  role_model: peer_roles
  # Member books own slots; Instructor owns lessons they coach; FacilityManager
  # owns lanes/machines/maintenance/posture; FrontDesk does check-in/operational.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  # --- Facility: aggregate root, posture-gated ---
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: name, type: string, source: input, description: "Facility name" }
      - { name: timezone, type: string, source: input, description: "IANA tz; informational only — all times are UTC ISO8601", default: "UTC" }
      - { name: open_minute, type: integer, source: input, description: "Daily opening offset in minutes from 00:00 UTC, inclusive", default: 480, constraints: "0..1440" }
      - { name: close_minute, type: integer, source: input, description: "Daily closing offset in minutes from 00:00 UTC, exclusive; close_minute > open_minute", default: 1320, constraints: "0..1440" }
      - { name: token_price_cents, type: integer, source: input, description: "Price of one token sold via wallet top-up", default: 500, constraints: ">= 1" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Per-lane base rate per 60 minutes for non-member OPEN_SLOT bookings", default: 4000, constraints: ">= 0" }
      - { name: posture, type: enum, source: computed, description: "OPEN | RESTRICTED | CLOSED — gates all child booking creation; see calc facility_posture", constraints: "OPEN,RESTRICTED,CLOSED" }
      - { name: open_incident_count, type: integer, source: computed, description: "Count of Lane rows in CLOSED maint_status under this facility" }
      - { name: epoch_index, type: integer, source: system, description: "Monotonic ops-run counter; increments on POST /v1/facilities/{id}/run-ops", default: 0 }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts 1, +1 per mutation" }

  # --- Lane: a cage/tunnel/lane resource. Temporal occupation lives here. ---
  - name: Lane
    parent: Facility
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; owning facility" }
      - { name: label, type: string, source: input, description: "Human label e.g. 'Cage 1'" }
      - { name: kind, type: enum, source: input, description: "CAGE | TUNNEL | LANE — geometry class", constraints: "CAGE,TUNNEL,LANE" }
      - { name: buffer_minutes, type: integer, source: input, description: "Required idle gap AFTER each booking before the next may start on this lane; closed-interval adjacency uses this buffer", default: 0, constraints: ">= 0" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Lane-specific override of facility hourly_rate_cents for OPEN_SLOT; null means inherit facility rate", default: null }
      - { name: maint_status, type: enum, source: computed, description: "AVAILABLE | UNDER_MAINTENANCE | CLOSED — derived from open MaintenanceWindow rows; see calc lane_maint_status", constraints: "AVAILABLE,UNDER_MAINTENANCE,CLOSED" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts 1, +1 per mutation" }

  # --- PitchingMachine: equipment attachable to a Lane; has its own maintenance ---
  - name: PitchingMachine
    parent: Facility
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; owning facility" }
      - { name: lane_id, type: string, source: input, description: "FK -> Lane.id; the lane this machine is installed on; one machine per lane" }
      - { name: model, type: enum, source: input, description: "WHEEL | ARM | SOFT_TOSS — surcharge tier source", constraints: "WHEEL,ARM,SOFT_TOSS" }
      - { name: pitch_count, type: integer, source: computed, description: "Cumulative pitches thrown; +1000 per COMPLETED booking that used this machine; reset to 0 on maintenance completion", default: 0 }
      - { name: status, type: enum, source: computed, description: "OPERATIONAL | DEGRADED | OUT_OF_SERVICE — see calc machine_status (threshold on pitch_count)", constraints: "OPERATIONAL,DEGRADED,OUT_OF_SERVICE" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts 1, +1 per mutation" }

  # --- MaintenanceWindow: append-only time interval making a Lane/Machine unusable ---
  - name: MaintenanceWindow
    parent: Facility
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; owning facility" }
      - { name: lane_id, type: string, source: input, description: "FK -> Lane.id; the lane taken out of service for this window" }
      - { name: start_utc, type: datetime, source: input, description: "Window start, ISO8601 UTC; half-open [start, end)" }
      - { name: end_utc, type: datetime, source: input, description: "Window end, exclusive; end_utc > start_utc" }
      - { name: severity, type: enum, source: input, description: "ROUTINE -> lane UNDER_MAINTENANCE; CRITICAL -> lane CLOSED and facility incident", constraints: "ROUTINE,CRITICAL" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED — RESOLVED stops gating the lane", default: "OPEN", constraints: "OPEN,RESOLVED" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts 1, +1 per mutation" }

  # --- Member: membership identity + token wallet ---
  - name: Member
    parent: Facility
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; home facility" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: tier, type: enum, source: input, description: "NONE | BRONZE | GOLD — membership tier; NONE = pay-per-use only", default: "NONE", constraints: "NONE,BRONZE,GOLD" }
      - { name: token_balance, type: integer, source: computed, description: "Tokens available; +n on top-up, -cost on CONFIRMED booking, +cost refunded on CANCELLED/REJECTED per refund rules", default: 0 }
      - { name: monthly_member_minutes_used, type: integer, source: computed, description: "Member-rate minutes consumed in current epoch; reset to 0 on run-ops; see calc member_minutes_ledger", default: 0 }
      - { name: no_show_strikes, type: integer, source: computed, description: "Count of NO_SHOW bookings in current epoch; gates booking when >= MAX_STRIKES", default: 0 }
      - { name: waiver_ok, type: boolean, source: computed, description: "True iff member has a SIGNED, non-expired Waiver; see calc waiver_validity", default: false }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts 1, +1 per mutation" }

  # --- Waiver: append-only signed liability waiver for a Member ---
  - name: Waiver
    parent: Facility
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; owning facility" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the signer" }
      - { name: signed_at, type: datetime, source: system, description: "Logical-clock instant at signing, ISO8601 UTC" }
      - { name: expires_at, type: datetime, source: computed, description: "signed_at + WAIVER_VALID_DAYS days; waiver invalid once clock >= expires_at" }
      - { name: status, type: enum, source: input, description: "SIGNED | VOID — only SIGNED counts; VOID set explicitly", default: "SIGNED", constraints: "SIGNED,VOID" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }

  # --- Instructor: coach offering lessons; books own lanes ---
  - name: Instructor
    parent: Facility
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; home facility" }
      - { name: full_name, type: string, source: input, description: "Instructor full name" }
      - { name: rate_cents_per_hour, type: integer, source: input, description: "Coaching fee per 60 minutes, added to lane cost for LESSON bookings", constraints: ">= 0" }
      - { name: active, type: boolean, source: input, description: "False -> cannot be assigned to new lessons", default: true }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts 1, +1 per mutation" }

  # --- Booking: THE temporal entity. Polymorphic over kind. ---
  - name: Booking
    parent: Facility
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; owning facility" }
      - { name: lane_id, type: string, source: input, description: "FK -> Lane.id; the reserved lane (primary lane for TEAM_BLOCK)" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the booking member (also payer)" }
      - { name: instructor_id, type: string, source: input, description: "FK -> Instructor.id; coach, required iff kind=LESSON else null", default: null }
      - { name: machine_id, type: string, source: input, description: "FK -> PitchingMachine.id; optional machine used; null means none", default: null }
      - { name: kind, type: enum, source: input, description: "OPEN_SLOT | LESSON | TEAM_BLOCK | PARTY", constraints: "OPEN_SLOT,LESSON,TEAM_BLOCK,PARTY" }
      - { name: pay_mode, type: enum, source: input, description: "TOKEN | HOURLY | MEMBERSHIP — pins the pricing variant; MEMBERSHIP only valid for tier!=NONE", constraints: "TOKEN,HOURLY,MEMBERSHIP" }
      - { name: lane_count, type: integer, source: input, description: "Lanes occupied; 1 for non-team; team_lane_ids length for TEAM_BLOCK", default: 1, constraints: ">= 1" }
      - { name: team_lane_ids, type: array, source: input, description: "FK -> Lane.id (each element); extra lanes beyond lane_id for TEAM_BLOCK; empty otherwise" }
      - { name: party_guests, type: integer, source: input, description: "Guest headcount for PARTY pricing add-on; 0 for non-party", default: 0, constraints: ">= 0" }
      - { name: start_utc, type: datetime, source: input, description: "Reservation start, ISO8601 UTC; half-open [start, end)" }
      - { name: end_utc, type: datetime, source: input, description: "Reservation end, exclusive; end_utc > start_utc" }
      - { name: duration_minutes, type: integer, source: computed, description: "(end_utc - start_utc) in whole minutes; must be a positive multiple of SLOT_MINUTES" }
      - { name: quoted_cost_cents, type: integer, source: computed, description: "Provisional price at REQUESTED time; see calc booking_quote (forward_looking variant)" }
      - { name: final_cost_cents, type: integer, source: computed, description: "Charged price at CONFIRMED time; see calc booking_charge (chronological variant); 0 until CONFIRMED" }
      - { name: token_cost, type: integer, source: computed, description: "Tokens debited at CONFIRMED when pay_mode=TOKEN; see calc token_cost" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | CHECKED_IN | COMPLETED | CANCELLED | REJECTED | NO_SHOW", default: "REQUESTED", constraints: "REQUESTED,CONFIRMED,CHECKED_IN,COMPLETED,CANCELLED,REJECTED,NO_SHOW" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts 1, +1 per mutation" }

  # --- Program: league or clinic; recurring sessions consume lane capacity ---
  - name: Program
    parent: Facility
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; owning facility" }
      - { name: lane_id, type: string, source: input, description: "FK -> Lane.id; lane reserved for every session of this program" }
      - { name: kind, type: enum, source: input, description: "LEAGUE | CLINIC", constraints: "LEAGUE,CLINIC" }
      - { name: capacity, type: integer, source: input, description: "Max enrolled members", constraints: ">= 1" }
      - { name: price_cents, type: integer, source: input, description: "Flat enrollment price per member, charged from token wallet at enrollment in cents-equivalent tokens? No — charged as direct cents debit recorded on Enrollment", constraints: ">= 0" }
      - { name: session_start_utc, type: datetime, source: input, description: "First session start, ISO8601 UTC; half-open [start, end)" }
      - { name: session_end_utc, type: datetime, source: input, description: "First session end, exclusive; end_utc > start_utc" }
      - { name: enrolled_count, type: integer, source: computed, description: "Count of Enrollment rows in ENROLLED status; see calc program_enrollment_ledger" }
      - { name: status, type: enum, source: system, description: "OPEN | FULL | CLOSED — FULL when enrolled_count == capacity; CLOSED stops enrollment", default: "OPEN", constraints: "OPEN,FULL,CLOSED" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts 1, +1 per mutation" }

  # --- Enrollment: junction Member<->Program ---
  - name: Enrollment
    parent: Facility
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; owning facility" }
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; enrolled program" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; enrolled member" }
      - { name: status, type: enum, source: system, description: "ENROLLED | WITHDRAWN", default: "ENROLLED", constraints: "ENROLLED,WITHDRAWN" }
      - { name: charged_cents, type: integer, source: computed, description: "Cents charged at enrollment = Program.price_cents; refunded to 0 effect on WITHDRAWN per refund policy" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts 1, +1 per mutation" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # --- Facility.posture: posture-driven gate (compound / derived) ---
  - entity: Facility
    field: posture
    initial_state: OPEN
    terminal_states: []
    note: "Derived field; never set directly. See calc facility_posture."
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system (a CRITICAL MaintenanceWindow opened, but open_incident_count < CLOSE_THRESHOLD)"
        actor: system
        preconditions: ["open_incident_count >= 1 AND open_incident_count < CLOSE_THRESHOLD"]
        side_effects:
          - "Blocks creation of PARTY and TEAM_BLOCK bookings (large-footprint) but still allows OPEN_SLOT and LESSON"
      - from: RESTRICTED
        to: CLOSED
        trigger: "system (open_incident_count >= CLOSE_THRESHOLD)"
        actor: system
        preconditions: ["open_incident_count >= CLOSE_THRESHOLD"]
        side_effects:
          - "Blocks creation of ALL booking kinds and ALL program enrollment facility-wide"
      - from: [RESTRICTED, CLOSED]
        to: OPEN
        trigger: "system (POST .../maintenance/{id}/resolve drops open_incident_count to 0)"
        actor: system
        preconditions: ["open_incident_count == 0"]
        side_effects: []
      - from: CLOSED
        to: RESTRICTED
        trigger: "system (open_incident_count drops below CLOSE_THRESHOLD but still >= 1)"
        actor: system
        preconditions: ["open_incident_count >= 1 AND open_incident_count < CLOSE_THRESHOLD"]
        side_effects: []

  # --- Lane.maint_status: compound, derived from MaintenanceWindow rows ---
  - entity: Lane
    field: maint_status
    initial_state: AVAILABLE
    terminal_states: []
    note: "Derived from OPEN MaintenanceWindow rows on this lane. See calc lane_maint_status."
    transitions:
      - from: AVAILABLE
        to: UNDER_MAINTENANCE
        trigger: "POST .../maintenance (severity=ROUTINE) on this lane"
        actor: FacilityManager
        preconditions: ["No CRITICAL OPEN window on lane"]
        side_effects:
          - "Lane blocks new OPEN_SLOT/LESSON/PARTY/TEAM_BLOCK whose interval overlaps any OPEN window (half-open)"
      - from: [AVAILABLE, UNDER_MAINTENANCE]
        to: CLOSED
        trigger: "POST .../maintenance (severity=CRITICAL) on this lane"
        actor: FacilityManager
        preconditions: []
        side_effects:
          - "CONFIRMED/CHECKED_IN Bookings on this lane that overlap the window are CASCADE-cancelled -> CANCELLED (each cancel refunds payer, releasing tokens/minutes)"
          - "facility.open_incident_count recomputed -> may push facility OPEN->RESTRICTED->CLOSED"
      - from: [UNDER_MAINTENANCE, CLOSED]
        to: AVAILABLE
        trigger: "POST .../maintenance/{id}/resolve (last OPEN window on lane resolved)"
        actor: FacilityManager
        preconditions: ["No remaining OPEN MaintenanceWindow on lane"]
        side_effects:
          - "If lane held an installed PitchingMachine, machine pitch_count reset to 0 and status recomputed -> OPERATIONAL"
          - "facility.open_incident_count recomputed -> may relax CLOSED->RESTRICTED->OPEN"

  # --- PitchingMachine.status: threshold on pitch_count ---
  - entity: PitchingMachine
    field: status
    initial_state: OPERATIONAL
    terminal_states: []
    note: "Derived from pitch_count thresholds. See calc machine_status."
    transitions:
      - from: OPERATIONAL
        to: DEGRADED
        trigger: "system (pitch_count crosses >= DEGRADE_AT after a COMPLETED booking)"
        actor: system
        preconditions: ["pitch_count >= DEGRADE_AT AND pitch_count < OOS_AT"]
        side_effects: ["New bookings may still use machine but quote adds DEGRADED surcharge waiver=0 (no extra)"]
      - from: [OPERATIONAL, DEGRADED]
        to: OUT_OF_SERVICE
        trigger: "system (pitch_count crosses >= OOS_AT after a COMPLETED booking)"
        actor: system
        preconditions: ["pitch_count >= OOS_AT"]
        side_effects: ["Booking creation referencing this machine_id is rejected until reset via maintenance resolve"]
      - from: [DEGRADED, OUT_OF_SERVICE]
        to: OPERATIONAL
        trigger: "system (lane maintenance resolved -> pitch_count reset to 0)"
        actor: system
        preconditions: ["pitch_count == 0"]
        side_effects: []

  # --- Booking.status: BRANCHING fork-join lifecycle ---
  - entity: Booking
    field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, REJECTED, NO_SHOW]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST .../bookings/{id}/confirm"
        actor: "Member or FrontDesk"
        preconditions:
          - "facility.posture permits this kind (OPEN/RESTRICTED rules)"
          - "member.waiver_ok == true"
          - "member.no_show_strikes < MAX_STRIKES"
          - "Lane(s) free over [start,end) including buffer (no temporal overlap with other CONFIRMED/CHECKED_IN bookings or OPEN maintenance windows)"
          - "pay_mode=TOKEN: member.token_balance >= token_cost"
          - "pay_mode=MEMBERSHIP: member.tier != NONE AND projected monthly_member_minutes_used + duration <= MEMBER_MINUTE_CAP"
          - "machine (if any) status != OUT_OF_SERVICE"
        side_effects:
          - "final_cost_cents computed via booking_charge (chronological)"
          - "pay_mode=TOKEN: member.token_balance -= token_cost"
          - "pay_mode=MEMBERSHIP: member.monthly_member_minutes_used += duration_minutes (per-lane*lane_count)"
          - "Lane interval [start,end) marked occupied for overlap checks"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST .../bookings/{id}/reject"
        actor: FacilityManager
        preconditions: []
        side_effects:
          - "No charge applied (charge only happens on CONFIRMED); quote discarded"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST .../bookings/{id}/check-in"
        actor: FrontDesk
        preconditions:
          - "clock within [start - EARLY_CHECKIN_MIN, end)"
          - "member.waiver_ok == true"
        side_effects: []
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST .../bookings/{id}/complete"
        actor: FrontDesk
        preconditions: ["clock >= start_utc"]
        side_effects:
          - "If machine_id set: machine.pitch_count += PITCHES_PER_SESSION; machine.status recomputed (may cross DEGRADE_AT/OOS_AT)"
      - from: [REQUESTED, CONFIRMED]
        to: CANCELLED
        trigger: "POST .../bookings/{id}/cancel or system (lane CRITICAL maintenance cascade)"
        actor: "Member or FrontDesk or system"
        preconditions: ["status in {REQUESTED, CONFIRMED}"]
        side_effects:
          - "If was CONFIRMED and pay_mode=TOKEN: refund tokens per refund_policy (full if clock < start - REFUND_CUTOFF_MIN, else REFUND_FORFEIT_PCT forfeited)"
          - "If was CONFIRMED and pay_mode=MEMBERSHIP: member.monthly_member_minutes_used -= duration_minutes (full restore — minutes are not forfeited)"
          - "Lane interval released"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST .../v1/facilities/{id}/run-ops (clock >= end_utc and never CHECKED_IN)"
        actor: system
        preconditions: ["clock >= end_utc", "status == CONFIRMED"]
        side_effects:
          - "member.no_show_strikes += 1"
          - "No refund (token cost / member minutes forfeited)"
          - "Lane interval released"

  # --- Program.status: capacity-driven compound ---
  - entity: Program
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system (enrolled_count reaches capacity after POST .../enrollments)"
        actor: system
        preconditions: ["enrolled_count == capacity"]
        side_effects: ["Further enrollment rejected with ERR_PROGRAM_FULL"]
      - from: FULL
        to: OPEN
        trigger: "system (a WITHDRAWN enrollment drops enrolled_count below capacity)"
        actor: system
        preconditions: ["enrolled_count < capacity"]
        side_effects: []
      - from: [OPEN, FULL]
        to: CLOSED
        trigger: "POST .../programs/{id}/close"
        actor: FacilityManager
        preconditions: []
        side_effects: ["ENROLLED enrollments stay enrolled; new enrollment blocked"]

  # --- Enrollment.status ---
  - entity: Enrollment
    field: status
    initial_state: ENROLLED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST .../enrollments/{id}/withdraw"
        actor: "Member or FacilityManager"
        preconditions: ["status == ENROLLED"]
        side_effects:
          - "program.enrolled_count -= 1; program FULL->OPEN if it was FULL"
          - "Refund charged_cents to member token wallet as cents/token-equivalent? No — recorded as account credit on member.token_balance += floor(charged_cents / facility.token_price_cents)"

# --- Concurrency Rules (§1.2.1): true CREATE-with-supersede races, OCC-resolved ---
concurrency_rules:
  - rule_id: booking-confirm-stale-lane
    parent_entity: Lane
    write_endpoint: "POST /v1/bookings/{booking_id}/confirm"
    occ_field: "expected_lane_version"
    description: |
      Confirming a Booking against a Lane whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has already confirmed an overlapping booking on the same lane (which
      legitimately occupies the interval), so the current writer's view of the
      lane's occupancy is stale. The stale-version check fails before the overlap
      test, giving a deterministic rejection.
    error_id: ERR_STALE_LANE_VERSION
    http_status: 412

  - rule_id: enrollment-create-stale-program
    parent_entity: Program
    write_endpoint: "POST /v1/programs/{program_id}/enrollments"
    occ_field: "expected_program_version"
    description: |
      Creating an Enrollment against a Program whose version has advanced since
      the client last observed it is rejected. This captures the case where the
      last open seat was just taken by another writer (legitimately filling the
      program), so the current writer's view of remaining capacity is stale.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  # --- DUAL-VARIANT #1: Booking pricing — forward-looking quote vs chronological charge ---
  - name: booking_quote
    trigger: "POST .../bookings (REQUESTED) — provisional quote stamped at request time"
    algorithm: forward_looking
    formula: |
      hours = duration_minutes / 60        # exact rational, applied as cents below
      base_lane_rate = lane.hourly_rate_cents if lane.hourly_rate_cents is not null else facility.hourly_rate_cents
      # forward-looking: uses the CURRENT lane rate and the member's tier discount as it stands NOW,
      # and projects the machine surcharge from the machine's CURRENT model tier (not its future status).
      lane_part_cents   = round_half_up(base_lane_rate * hours * lane_count)
      coach_part_cents  = round_half_up(instructor.rate_cents_per_hour * hours) if kind==LESSON else 0
      machine_part_cents= MACHINE_SURCHARGE_CENTS[machine.model] if machine_id else 0   # per booking, flat
      party_part_cents  = (PARTY_BASE_CENTS + party_guests * PARTY_PER_GUEST_CENTS) if kind==PARTY else 0
      gross = lane_part_cents + coach_part_cents + machine_part_cents + party_part_cents
      tier_discount_pct = TIER_DISCOUNT_PCT[member.tier]    # applied to gross
      quoted_cost_cents = round_half_up(gross * (1 - tier_discount_pct))
    input_set: "Single booking; rates read at REQUESTED time"
    constants:
      SLOT_MINUTES: 10
      MACHINE_SURCHARGE_CENTS: { WHEEL: 800, ARM: 1200, SOFT_TOSS: 300 }
      PARTY_BASE_CENTS: 15000
      PARTY_PER_GUEST_CENTS: 1200
      TIER_DISCOUNT_PCT: { NONE: 0.0, BRONZE: 0.10, GOLD: 0.25 }
    precision: "round_half_up to whole cents, applied PER COMPONENT before summing (round each *_part_cents, then sum, then apply discount and round once). Pinned order: round-per-component-then-sum; sum-then-round is the wrong order and produces different cents in fractional cases."

  - name: booking_charge
    trigger: "POST .../bookings/{id}/confirm (CONFIRMED) — final charge, side_effect of CONFIRMED transition writes final_cost_cents"
    algorithm: chronological
    formula: |
      # chronological: re-reads the lane rate AS IT STANDS AT CONFIRM TIME (a maintenance/rate
      # change between request and confirm shifts the charge), and applies the membership
      # peak/off-peak multiplier keyed on the booking's start minute-of-day (request-time quote
      # ignored the peak window — this is the divergence).
      hours = duration_minutes / 60
      base_lane_rate = lane.hourly_rate_cents if lane.hourly_rate_cents is not null else facility.hourly_rate_cents
      peak = (start_minute_of_day >= PEAK_START_MIN and start_minute_of_day < PEAK_END_MIN)
      peak_mult = PEAK_MULTIPLIER if peak else 1.0
      lane_part_cents   = round_half_up(base_lane_rate * hours * lane_count * peak_mult)
      coach_part_cents  = round_half_up(instructor.rate_cents_per_hour * hours) if kind==LESSON else 0
      machine_part_cents= MACHINE_SURCHARGE_CENTS[machine.model] if machine_id else 0
      party_part_cents  = (PARTY_BASE_CENTS + party_guests * PARTY_PER_GUEST_CENTS) if kind==PARTY else 0
      gross = lane_part_cents + coach_part_cents + machine_part_cents + party_part_cents
      tier_discount_pct = TIER_DISCOUNT_PCT[member.tier]
      final_cost_cents = round_half_up(gross * (1 - tier_discount_pct))
    input_set: "Single booking; rates and peak window read at CONFIRM time"
    constants:
      PEAK_START_MIN: 1020      # 17:00 UTC
      PEAK_END_MIN: 1260        # 21:00 UTC
      PEAK_MULTIPLIER: 1.5
      MACHINE_SURCHARGE_CENTS: { WHEEL: 800, ARM: 1200, SOFT_TOSS: 300 }
      PARTY_BASE_CENTS: 15000
      PARTY_PER_GUEST_CENTS: 1200
      TIER_DISCOUNT_PCT: { NONE: 0.0, BRONZE: 0.10, GOLD: 0.25 }
    precision: "round_half_up per component, then once after discount"
    variants:
      - name: peak_charge
        when: "start_minute_of_day in [PEAK_START_MIN, PEAK_END_MIN)"
        difference: "lane_part multiplied by PEAK_MULTIPLIER; quote (forward_looking) NEVER applies peak, so final_cost_cents > quoted_cost_cents for peak HOURLY/TOKEN bookings"
      - name: offpeak_charge
        when: "start_minute_of_day outside the peak window"
        difference: "peak_mult = 1.0; final equals quote unless the lane rate changed between request and confirm"

  # --- token cost: cents -> tokens, ceil ---
  - name: token_cost
    trigger: "POST .../bookings/{id}/confirm when pay_mode=TOKEN — side effect of CONFIRMED"
    algorithm: threshold
    formula: |
      # tokens are integral; a booking costs ceil(final_cost_cents / token_price_cents) tokens.
      token_cost = ceil(final_cost_cents / facility.token_price_cents)
    input_set: "Single booking at confirm time"
    precision: "integer ceil; never below 1 for any booking whose final_cost_cents > 0"

  # --- DUAL-VARIANT #2: machine status threshold (risk/wear on PitchingMachine) ---
  - name: machine_status
    trigger: "POST .../bookings/{id}/complete (pitch_count incremented); also maintenance resolve (reset)"
    algorithm: threshold
    formula: |
      if pitch_count >= OOS_AT:        status = OUT_OF_SERVICE
      elif pitch_count >= DEGRADE_AT:  status = DEGRADED
      else:                            status = OPERATIONAL
    input_set: "Single machine"
    constants:
      DEGRADE_AT: 5000
      OOS_AT: 10000
      PITCHES_PER_SESSION: 1000
    precision: "integer comparison; boundary is >= (pitch_count exactly DEGRADE_AT is DEGRADED)"
    variants:
      - name: degrade_boundary
        when: "pitch_count == DEGRADE_AT exactly (e.g., 5 COMPLETED sessions)"
        difference: "status flips to DEGRADED at exactly 5000 (>=), not at 5001"
      - name: oos_boundary
        when: "pitch_count == OOS_AT exactly (e.g., 10 COMPLETED sessions)"
        difference: "status flips to OUT_OF_SERVICE at exactly 10000 (>=); booking creation referencing machine then rejected"

  # --- facility posture (derived, threshold over incident count) ---
  - name: facility_posture
    trigger: "MaintenanceWindow open/resolve (CRITICAL); recomputed on each maintenance mutation"
    algorithm: threshold
    formula: |
      open_incident_count = count(Lane L under facility where L.maint_status == CLOSED)
      if open_incident_count >= CLOSE_THRESHOLD:   posture = CLOSED
      elif open_incident_count >= 1:               posture = RESTRICTED
      else:                                        posture = OPEN
    input_set: "All lanes under the facility"
    constants:
      CLOSE_THRESHOLD: 2
    precision: "integer comparison; >= boundary"

  # --- lane maint_status (derived, interval-overlap of OPEN windows vs clock) ---
  - name: lane_maint_status
    trigger: "MaintenanceWindow open/resolve; recomputed on each maintenance mutation and on run-ops"
    algorithm: interval_merge
    formula: |
      open_windows = MaintenanceWindow rows on lane with status == OPEN
      if any open_window has severity == CRITICAL:   maint_status = CLOSED
      elif any open_window has severity == ROUTINE:   maint_status = UNDER_MAINTENANCE
      else:                                           maint_status = AVAILABLE
    input_set: "OPEN MaintenanceWindow rows on the lane"
    precision: "n/a — categorical"

  # --- member minutes ledger (aggregation, reset per epoch) ---
  - name: member_minutes_ledger
    trigger: "booking CONFIRMED (+), booking CANCELLED-from-CONFIRMED (-), run-ops (reset to 0)"
    algorithm: aggregation
    formula: |
      monthly_member_minutes_used = sum(b.duration_minutes * b.lane_count
        for b in MEMBERSHIP bookings of member with status in {CONFIRMED, CHECKED_IN, COMPLETED}
        created in current epoch)
      # reset to 0 at the start of every run-ops epoch boundary
    input_set: "MEMBERSHIP bookings of the member in current epoch with status in {CONFIRMED,CHECKED_IN,COMPLETED}"
    constants:
      MEMBER_MINUTE_CAP: 1200
      MAX_STRIKES: 3
      EARLY_CHECKIN_MIN: 30
    precision: "integer minutes"

  # --- program enrollment ledger (aggregation) ---
  - name: program_enrollment_ledger
    trigger: "enrollment create (+), enrollment withdraw (-)"
    algorithm: aggregation
    formula: |
      enrolled_count = count(Enrollment e on program with e.status == ENROLLED)
      status = FULL if enrolled_count == capacity else (CLOSED if explicitly closed else OPEN)
    input_set: "ENROLLED Enrollment rows on the program"
    precision: "integer count; tie-break n/a"

  # --- waiver validity (derived over clock) ---
  - name: waiver_validity
    trigger: "waiver sign/void; run-ops; read when evaluating booking confirm/check-in preconditions"
    algorithm: threshold
    formula: |
      latest = the SIGNED Waiver of member with the greatest signed_at
               (tie-break: greatest created_at; no id tie-break)
      waiver_ok = (latest exists) AND (clock < latest.expires_at)
      expires_at = signed_at + WAIVER_VALID_DAYS days
    input_set: "SIGNED Waiver rows of the member"
    constants:
      WAIVER_VALID_DAYS: 365
    precision: "datetime comparison; clock == expires_at means EXPIRED (waiver_ok false at the boundary)"

  # --- refund policy (waterfall over time-to-start) ---
  - name: refund_policy
    trigger: "booking CANCELLED from CONFIRMED with pay_mode=TOKEN"
    algorithm: threshold
    formula: |
      minutes_to_start = (start_utc - clock) in whole minutes
      if minutes_to_start >= REFUND_CUTOFF_MIN:
          refund_tokens = token_cost                       # full refund
      else:
          forfeit = ceil(token_cost * REFUND_FORFEIT_PCT)
          refund_tokens = token_cost - forfeit             # partial
      member.token_balance += refund_tokens
    input_set: "Single CONFIRMED token booking being cancelled"
    constants:
      REFUND_CUTOFF_MIN: 120
      REFUND_FORFEIT_PCT: 0.5
    precision: "integer tokens; forfeit uses ceil so the facility keeps at least half, rounded up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist within facility scope, validated left-to-right in path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, end_utc > start_utc, duration a positive multiple of SLOT_MINUTES, lane_count == 1 + len(team_lane_ids)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST .../bookings, POST .../maintenance, POST .../programs, all creates"

  - priority: 5
    category: state
    check: "Target resource in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints (confirm/reject/check-in/complete/cancel/withdraw/close/resolve)"

  - priority: 6
    category: business_safety
    check: "Member has a SIGNED non-expired waiver (waiver_ok) before confirm and check-in"
    error_id: ERR_WAIVER_REQUIRED
    http_status: 422
    applies_to: "POST .../bookings/{id}/confirm, POST .../bookings/{id}/check-in"

  - priority: 7
    category: business_safety
    check: "Facility posture permits this booking kind: RESTRICTED blocks PARTY/TEAM_BLOCK, CLOSED blocks all booking confirms and all enrollment"
    error_id: ERR_FACILITY_POSTURE_BLOCK
    http_status: 422
    applies_to: "POST .../bookings/{id}/confirm, POST .../enrollments"

  - priority: 8
    category: business_safety
    check: "member.no_show_strikes < MAX_STRIKES at confirm time"
    error_id: ERR_TOO_MANY_STRIKES
    http_status: 422
    applies_to: "POST .../bookings/{id}/confirm"

  - priority: 9
    category: business_safety
    check: "Referenced machine status != OUT_OF_SERVICE; lane(s) maint_status == AVAILABLE for the booked interval"
    error_id: ERR_RESOURCE_UNAVAILABLE
    http_status: 422
    applies_to: "POST .../bookings, POST .../bookings/{id}/confirm"

  - priority: 10
    category: business_temporal
    check: "Booked interval [start,end) plus lane buffer does not overlap any CONFIRMED/CHECKED_IN booking or any OPEN maintenance window on each occupied lane"
    error_id: ERR_LANE_TIME_CONFLICT
    http_status: 409
    applies_to: "POST .../bookings/{id}/confirm"

  - priority: 11
    category: business_temporal
    check: "Booked interval falls within facility open hours [open_minute, close_minute) on its day"
    error_id: ERR_OUTSIDE_HOURS
    http_status: 422
    applies_to: "POST .../bookings, POST .../bookings/{id}/confirm"

  - priority: 12
    category: business_referential
    check: "LESSON requires active instructor; MEMBERSHIP pay_mode requires member.tier != NONE; PARTY requires party_guests >= 1"
    error_id: ERR_BOOKING_SHAPE_INVALID
    http_status: 422
    applies_to: "POST .../bookings, POST .../bookings/{id}/confirm"

  - priority: 13
    category: business_fiscal
    check: "pay_mode=TOKEN: member.token_balance >= token_cost; pay_mode=MEMBERSHIP: projected monthly_member_minutes_used + duration*lane_count <= MEMBER_MINUTE_CAP"
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 422
    applies_to: "POST .../bookings/{id}/confirm"

  - priority: 14
    category: business_constraint
    check: "Program has an open seat: enrolled_count < capacity and status != CLOSED; member not already ENROLLED in this program"
    error_id: ERR_PROGRAM_FULL
    http_status: 409
    applies_to: "POST .../enrollments"

  - priority: 15
    category: concurrency
    check: "OCC: expected_lane_version / expected_program_version matches parent.version"
    error_id: ERR_STALE_LANE_VERSION
    http_status: 412
    applies_to: "POST .../bookings/{id}/confirm, POST .../enrollments"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Facility ---
  - method: POST
    path: "/v1/facilities"
    description: "Create a facility. posture=OPEN, epoch_index=0."
    roles: [FacilityManager]
    code: 201
    input: [name, "timezone?", "open_minute?", "close_minute?", "token_price_cents?", "hourly_rate_cents?"]
    output: Facility
    side_effects: ["posture=OPEN", "epoch_index=0", "open_incident_count=0"]

  - method: GET
    path: "/v1/facilities"
    description: "List facilities (paginated)."
    roles: [FacilityManager, FrontDesk, Member, Instructor]
    code: 200
    input: ["limit?", "offset?"]
    output: Facility[]
    side_effects: []

  - method: GET
    path: "/v1/facilities/{facility_id}"
    description: "Get facility incl. computed posture and incident count."
    roles: [FacilityManager, FrontDesk, Member, Instructor]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: POST
    path: "/v1/facilities/{facility_id}/run-ops"
    description: "Advance epoch: NO_SHOW sweep (CONFIRMED past end never checked-in -> NO_SHOW, +1 strike), reset member monthly minutes and no_show_strikes to 0, recompute lane/machine/posture/waiver derived fields. Default server clock before any /_clock/set_current_utc is 2026-04-01T00:00:00Z."
    roles: [FacilityManager]
    code: 200
    input: []
    output: Facility
    side_effects: ["epoch_index += 1", "CONFIRMED past end_utc -> NO_SHOW + strike", "member monthly_member_minutes_used reset to 0", "member no_show_strikes reset to 0"]

  # --- Lane ---
  - method: POST
    path: "/v1/lanes"
    description: "Create a lane. maint_status=AVAILABLE."
    roles: [FacilityManager]
    code: 201
    input: [facility_id, label, kind, "buffer_minutes?", "hourly_rate_cents?"]
    output: Lane
    side_effects: ["maint_status=AVAILABLE"]

  - method: GET
    path: "/v1/lanes/{lane_id}"
    description: "Get a lane incl. computed maint_status."
    roles: [FacilityManager, FrontDesk, Member, Instructor]
    code: 200
    input: []
    output: Lane
    side_effects: []

  - method: GET
    path: "/v1/lanes"
    description: "List lanes; filter by facility_id (paginated). Reverse-reachability for Lane.facility_id."
    roles: [FacilityManager, FrontDesk, Member, Instructor]
    code: 200
    input: ["facility_id?", "limit?", "offset?"]
    output: Lane[]
    side_effects: []

  # --- PitchingMachine ---
  - method: POST
    path: "/v1/machines"
    description: "Install a pitching machine on a lane. status=OPERATIONAL, pitch_count=0."
    roles: [FacilityManager]
    code: 201
    input: [facility_id, lane_id, model]
    output: PitchingMachine
    side_effects: ["status=OPERATIONAL", "pitch_count=0"]

  - method: GET
    path: "/v1/machines/{machine_id}"
    description: "Get a machine incl. computed status and pitch_count."
    roles: [FacilityManager, FrontDesk, Member, Instructor]
    code: 200
    input: []
    output: PitchingMachine
    side_effects: []

  - method: GET
    path: "/v1/machines"
    description: "List machines (paginated); filter by facility_id and/or lane_id. Reverse-reachability for PitchingMachine.facility_id and PitchingMachine.lane_id."
    roles: [FacilityManager, FrontDesk, Member, Instructor]
    code: 200
    input: ["facility_id?", "lane_id?", "limit?", "offset?"]
    output: PitchingMachine[]
    side_effects: []

  # --- MaintenanceWindow ---
  - method: POST
    path: "/v1/maintenance"
    description: "Open a maintenance window on a lane (ROUTINE or CRITICAL). CRITICAL cascade-cancels overlapping CONFIRMED/CHECKED_IN bookings and may shift facility posture."
    roles: [FacilityManager]
    code: 201
    input: [facility_id, lane_id, start_utc, end_utc, severity]
    output: MaintenanceWindow
    side_effects: ["status=OPEN", "lane maint_status recomputed", "CRITICAL: overlapping CONFIRMED/CHECKED_IN bookings -> CANCELLED with refund cascade", "facility posture recomputed"]

  - method: GET
    path: "/v1/maintenance/{window_id}"
    description: "Get a maintenance window."
    roles: [FacilityManager, FrontDesk, Member, Instructor]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: []

  - method: GET
    path: "/v1/maintenance"
    description: "List maintenance windows; filter by facility_id and/or lane_id. Reverse-reachability for MaintenanceWindow.facility_id and MaintenanceWindow.lane_id."
    roles: [FacilityManager, FrontDesk, Member, Instructor]
    code: 200
    input: ["facility_id?", "lane_id?", "limit?", "offset?"]
    output: MaintenanceWindow[]
    side_effects: []

  - method: POST
    path: "/v1/maintenance/{window_id}/resolve"
    description: "Resolve a maintenance window (status RESOLVED). Recomputes lane maint_status; if last window on lane, resets installed machine pitch_count to 0; recomputes facility posture."
    roles: [FacilityManager]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: ["status=RESOLVED", "lane maint_status recomputed", "machine pitch_count reset to 0 if last window resolved", "facility posture recomputed"]

  # --- Member ---
  - method: POST
    path: "/v1/members"
    description: "Register a member. token_balance=0, strikes=0, waiver_ok=false."
    roles: [FacilityManager, FrontDesk]
    code: 201
    input: [facility_id, full_name, "tier?"]
    output: Member
    side_effects: ["token_balance=0", "no_show_strikes=0", "waiver_ok=false"]

  - method: GET
    path: "/v1/members/{member_id}"
    description: "Get a member incl. token_balance, minutes used, strikes, waiver_ok."
    roles: [FacilityManager, FrontDesk, Member]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/v1/members"
    description: "List members; filter by facility_id (paginated). Reverse-reachability for Member.facility_id."
    roles: [FacilityManager, FrontDesk]
    code: 200
    input: ["facility_id?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  - method: POST
    path: "/v1/members/{member_id}/wallet/top-up"
    description: "Add tokens to a member's wallet (admin/front-desk top-up)."
    roles: [FacilityManager, FrontDesk]
    code: 200
    input: [tokens]
    output: Member
    side_effects: ["token_balance += tokens"]

  # --- Waiver ---
  - method: POST
    path: "/v1/waivers"
    description: "Sign a waiver for a member. signed_at = current clock, expires_at = signed_at + WAIVER_VALID_DAYS. Recomputes member.waiver_ok. A Member acting on self must pass their own id as member_id (X-User-ID == member_id)."
    roles: [FacilityManager, FrontDesk, Member]
    code: 201
    input: [facility_id, member_id]
    output: Waiver
    side_effects: ["status=SIGNED", "member.waiver_ok recomputed -> true"]

  - method: GET
    path: "/v1/waivers/{waiver_id}"
    description: "Get a waiver."
    roles: [FacilityManager, FrontDesk, Member]
    code: 200
    input: []
    output: Waiver
    side_effects: []

  - method: GET
    path: "/v1/waivers"
    description: "List waivers; filter by member_id and/or facility_id. Reverse-reachability for Waiver.member_id and Waiver.facility_id."
    roles: [FacilityManager, FrontDesk, Member]
    code: 200
    input: ["member_id?", "facility_id?", "limit?", "offset?"]
    output: Waiver[]
    side_effects: []

  - method: POST
    path: "/v1/waivers/{waiver_id}/void"
    description: "Void a signed waiver. Recomputes member.waiver_ok."
    roles: [FacilityManager]
    code: 200
    input: []
    output: Waiver
    side_effects: ["status=VOID", "member.waiver_ok recomputed"]

  # --- Instructor ---
  - method: POST
    path: "/v1/instructors"
    description: "Create an instructor."
    roles: [FacilityManager]
    code: 201
    input: [facility_id, full_name, rate_cents_per_hour, "active?"]
    output: Instructor
    side_effects: []

  - method: GET
    path: "/v1/instructors/{instructor_id}"
    description: "Get an instructor."
    roles: [FacilityManager, FrontDesk, Member, Instructor]
    code: 200
    input: []
    output: Instructor
    side_effects: []

  - method: GET
    path: "/v1/instructors"
    description: "List instructors; filter by facility_id (paginated). Reverse-reachability for Instructor.facility_id."
    roles: [FacilityManager, FrontDesk, Member, Instructor]
    code: 200
    input: ["facility_id?", "limit?", "offset?"]
    output: Instructor[]
    side_effects: []

  # --- Booking ---
  - method: POST
    path: "/v1/bookings"
    description: "Request a booking (status REQUESTED). Computes quoted_cost_cents (forward-looking). Validates body shape, hours, machine not OUT_OF_SERVICE, lanes AVAILABLE. Does NOT charge or occupy yet."
    roles: [Member, FrontDesk]
    code: 201
    input: [facility_id, lane_id, member_id, kind, pay_mode, "instructor_id?", "machine_id?", "lane_count?", "team_lane_ids?", "party_guests?", start_utc, end_utc]
    output: Booking
    side_effects: ["status=REQUESTED", "quoted_cost_cents computed via booking_quote"]

  - method: GET
    path: "/v1/bookings/{booking_id}"
    description: "Get a booking incl. quoted/final cost and token_cost."
    roles: [FacilityManager, FrontDesk, Member, Instructor]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: GET
    path: "/v1/bookings"
    description: "List bookings; filter by facility_id, lane_id, member_id, instructor_id, machine_id, status. team_lane_ids reverse lookup also served here via lane_id (a team lane appears in results when lane_id matches any occupied lane). Reverse-reachability for Booking.facility_id, lane_id, member_id, instructor_id, machine_id, team_lane_ids."
    roles: [FacilityManager, FrontDesk, Member, Instructor]
    code: 200
    input: ["facility_id?", "lane_id?", "member_id?", "instructor_id?", "machine_id?", "team_lane_ids?", "status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: POST
    path: "/v1/bookings/{booking_id}/confirm"
    description: "Confirm a REQUESTED booking. OCC on lane via expected_lane_version. Runs all validations 5-15, computes final_cost_cents (chronological + peak), charges tokens or debits member minutes, occupies lane interval, bumps lane.version."
    roles: [Member, FrontDesk]
    code: 200
    input: [expected_lane_version]
    output: Booking
    side_effects: ["status=CONFIRMED", "final_cost_cents via booking_charge", "token_cost via token_cost", "TOKEN: member.token_balance -= token_cost", "MEMBERSHIP: member.monthly_member_minutes_used += duration*lane_count", "lane interval occupied", "increments Lane.version by 1"]

  - method: POST
    path: "/v1/bookings/{booking_id}/reject"
    description: "Reject a REQUESTED booking (manager). No charge."
    roles: [FacilityManager]
    code: 200
    input: []
    output: Booking
    side_effects: ["status=REJECTED"]

  - method: POST
    path: "/v1/bookings/{booking_id}/check-in"
    description: "Check in a CONFIRMED booking. Requires clock in [start - EARLY_CHECKIN_MIN, end) and member.waiver_ok."
    roles: [FrontDesk]
    code: 200
    input: []
    output: Booking
    side_effects: ["status=CHECKED_IN"]

  - method: POST
    path: "/v1/bookings/{booking_id}/complete"
    description: "Complete a CHECKED_IN booking. If machine used, machine.pitch_count += PITCHES_PER_SESSION and status recomputed."
    roles: [FrontDesk]
    code: 200
    input: []
    output: Booking
    side_effects: ["status=COMPLETED", "machine.pitch_count += PITCHES_PER_SESSION", "machine.status recomputed via machine_status"]

  - method: POST
    path: "/v1/bookings/{booking_id}/cancel"
    description: "Cancel a REQUESTED or CONFIRMED booking. TOKEN refund per refund_policy; MEMBERSHIP restores minutes fully; releases lane interval."
    roles: [Member, FrontDesk]
    code: 200
    input: []
    output: Booking
    side_effects: ["status=CANCELLED", "TOKEN refund via refund_policy -> member.token_balance += refund_tokens", "MEMBERSHIP: member.monthly_member_minutes_used -= duration*lane_count", "lane interval released"]

  # --- Program ---
  - method: POST
    path: "/v1/programs"
    description: "Create a league/clinic program reserving a lane for its session interval. status=OPEN, enrolled_count=0."
    roles: [FacilityManager]
    code: 201
    input: [facility_id, lane_id, kind, capacity, price_cents, session_start_utc, session_end_utc]
    output: Program
    side_effects: ["status=OPEN", "enrolled_count=0"]

  - method: GET
    path: "/v1/programs/{program_id}"
    description: "Get a program incl. enrolled_count and status."
    roles: [FacilityManager, FrontDesk, Member, Instructor]
    code: 200
    input: []
    output: Program
    side_effects: []

  - method: GET
    path: "/v1/programs"
    description: "List programs; filter by facility_id and/or lane_id. Reverse-reachability for Program.facility_id and Program.lane_id."
    roles: [FacilityManager, FrontDesk, Member, Instructor]
    code: 200
    input: ["facility_id?", "lane_id?", "limit?", "offset?"]
    output: Program[]
    side_effects: []

  - method: POST
    path: "/v1/programs/{program_id}/close"
    description: "Close a program to new enrollment."
    roles: [FacilityManager]
    code: 200
    input: []
    output: Program
    side_effects: ["status=CLOSED"]

  # --- Enrollment ---
  - method: POST
    path: "/v1/programs/{program_id}/enrollments"
    description: "Enroll a member into a program. OCC on program via expected_program_version. Charges price_cents; recomputes enrolled_count and status; bumps program.version."
    roles: [Member, FrontDesk]
    code: 201
    input: [member_id, expected_program_version]
    output: Enrollment
    side_effects: ["status=ENROLLED", "charged_cents = program.price_cents", "program.enrolled_count += 1", "program OPEN->FULL if capacity reached", "increments Program.version by 1"]

  - method: GET
    path: "/v1/programs/{program_id}/enrollments"
    description: "List enrollments of a program; filter by member_id. Sub-resource reverse-reachability for Enrollment.program_id."
    roles: [FacilityManager, FrontDesk, Member, Instructor]
    code: 200
    input: ["member_id?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  - method: GET
    path: "/v1/enrollments/{enrollment_id}"
    description: "Get an enrollment."
    roles: [FacilityManager, FrontDesk, Member, Instructor]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: GET
    path: "/v1/enrollments"
    description: "List enrollments; filter by facility_id, program_id, member_id. Filtered-list reverse-reachability for Enrollment.facility_id, Enrollment.program_id, Enrollment.member_id."
    roles: [FacilityManager, FrontDesk, Member, Instructor]
    code: 200
    input: ["facility_id?", "program_id?", "member_id?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  - method: POST
    path: "/v1/enrollments/{enrollment_id}/withdraw"
    description: "Withdraw an enrollment. program.enrolled_count -= 1, FULL->OPEN; refunds price_cents as floor(charged_cents/token_price_cents) tokens to member wallet."
    roles: [Member, FacilityManager]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status=WITHDRAWN", "program.enrolled_count -= 1", "program FULL->OPEN", "member.token_balance += floor(charged_cents / token_price_cents)"]

  # --- Test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an arbitrary ISO8601 UTC instant for deterministic temporal tests. Server startup default (before any call) is 2026-04-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [FacilityManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set; all waiver/refund/check-in/no-show/peak rules read this clock"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist within facility scope" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, end<=start, duration not a multiple of SLOT_MINUTES, lane_count mismatch" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_WAIVER_REQUIRED, http: 422, condition: "Member lacks a SIGNED non-expired waiver at confirm/check-in" }
  - { id: ERR_FACILITY_POSTURE_BLOCK, http: 422, condition: "Facility posture forbids this booking kind / all enrollment (RESTRICTED blocks PARTY+TEAM_BLOCK; CLOSED blocks everything)" }
  - { id: ERR_TOO_MANY_STRIKES, http: 422, condition: "member.no_show_strikes >= MAX_STRIKES at confirm" }
  - { id: ERR_RESOURCE_UNAVAILABLE, http: 422, condition: "Machine OUT_OF_SERVICE, or lane maint_status != AVAILABLE for the interval" }
  - { id: ERR_LANE_TIME_CONFLICT, http: 409, condition: "Booked interval + buffer overlaps another CONFIRMED/CHECKED_IN booking or OPEN maintenance window on an occupied lane" }
  - { id: ERR_OUTSIDE_HOURS, http: 422, condition: "Booked interval falls outside facility [open_minute, close_minute)" }
  - { id: ERR_BOOKING_SHAPE_INVALID, http: 422, condition: "LESSON without active instructor, MEMBERSHIP with tier NONE, or PARTY with party_guests < 1" }
  - { id: ERR_INSUFFICIENT_FUNDS, http: 422, condition: "Token balance below token_cost, or membership minutes would exceed MEMBER_MINUTE_CAP" }
  - { id: ERR_PROGRAM_FULL, http: 409, condition: "Program at capacity, CLOSED, or member already ENROLLED" }
  - { id: ERR_STALE_LANE_VERSION, http: 412, condition: "expected_lane_version != Lane.version at confirm" }
  - { id: ERR_STALE_PROGRAM_VERSION, http: 412, condition: "expected_program_version != Program.version at enrollment" }
  - { id: ERR_VALIDATION, http: 400, condition: "Generic query/path parameter validation failure (bad pagination limit/offset, malformed UUID)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FacilityManager
    description: "Owns facility configuration: lanes, machines, maintenance, programs, instructors, posture-affecting ops. Approves/rejects bookings."
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/facilities — create facility"
      - "POST .../lanes — create lane"
      - "POST .../machines — install machine"
      - "POST .../maintenance — open maintenance window"
      - "POST .../maintenance/{id}/resolve — resolve window"
      - "POST .../instructors — create instructor"
      - "POST .../programs — create program"
      - "POST .../programs/{id}/close — close program"
      - "POST .../bookings/{id}/reject — reject booking"
      - "POST .../waivers/{id}/void — void waiver"
      - "POST .../run-ops — advance epoch"
    shared_operations:
      - "GET endpoints (all reads)"
      - "POST .../members — register member (with FrontDesk)"
      - "POST .../members/{id}/wallet/top-up — top up wallet (with FrontDesk)"
      - "POST .../enrollments/{id}/withdraw — withdraw enrollment (with Member)"

  - name: FrontDesk
    description: "Operational desk staff: register members, top-ups, check-in, complete, request/confirm/cancel bookings on behalf of members."
    identity: "opaque"
    exclusive_operations:
      - "POST .../bookings/{id}/check-in — check in"
      - "POST .../bookings/{id}/complete — complete"
    shared_operations:
      - "GET endpoints (most reads)"
      - "POST .../members — register member (with FacilityManager)"
      - "POST .../members/{id}/wallet/top-up — top up wallet (with FacilityManager)"
      - "POST .../bookings — request booking (with Member)"
      - "POST .../bookings/{id}/confirm — confirm booking (with Member)"
      - "POST .../bookings/{id}/cancel — cancel booking (with Member)"
      - "POST .../enrollments — enroll member (with Member)"
      - "POST .../waivers — sign waiver (with Member, FacilityManager)"

  - name: Member
    description: "A registered patron acting on their own resources. X-User-ID equals the Member.id they act as; ownership enforced on own bookings/enrollments/waivers/wallet reads."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "GET own member / bookings / enrollments / waivers"
      - "GET facility/lane/machine/instructor/program reads"
      - "POST .../bookings — request own booking (with FrontDesk)"
      - "POST .../bookings/{id}/confirm — confirm own booking (with FrontDesk)"
      - "POST .../bookings/{id}/cancel — cancel own booking (with FrontDesk)"
      - "POST .../waivers — sign own waiver (with FrontDesk, FacilityManager)"
      - "POST .../enrollments — enroll self (with FrontDesk)"
      - "POST .../enrollments/{id}/withdraw — withdraw self (with FacilityManager)"

  - name: Instructor
    description: "A coach. Reads facility/lane/booking data and their assigned lessons. Read-only acting role in v1."
    identity: "entity_backed:Instructor"
    exclusive_operations: []
    shared_operations:
      - "GET facility / lanes / machines / instructors / programs / bookings reads"
