            - { call: "POST /waste-manifests/${mt}/ship", payload: { transporter_name: "HazTrans Inc" }, as: EHSOfficer, captures: { mt_ship: $.data.status } }
            - { call: "POST /waste-manifests/${mt}/receive", as: EHSOfficer, captures: { mt_recv: $.data.status } }
