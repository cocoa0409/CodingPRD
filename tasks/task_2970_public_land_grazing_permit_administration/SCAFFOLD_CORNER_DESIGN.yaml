          assert:
            - "first call: HTTP 200 whose OWN response body already reads aoi_status \"ISSUED\", authorized_aums 150, authorized_aums_at_issue 150 and billable_aums 150 — no follow-up read is needed to see the derived fields"
            - "second call: allocated_aums == 150 and open_aums == 50 in the very next request, with no reconciliation step between"
