          assert:
            - "trigger response error_id == ERR_SOD_VIOLATION"
            - "Job.${job_id}.verification_status == PENDING"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: wap_income_at_exact_limit_eligible
        grounds:
          - calculations.wap_income_eligibility
          - entities.WapApplication.fields.status
          - entities.WapApplication.fields.income_limit_cents
        distinguishing_aspect: |
          wap_income_eligibility is inclusive (<=): household_size 3 has income_limit 5000000 and an
          income of exactly 5000000 is ELIGIBLE — the numeric threshold boundary, reached via the
          wap-applications create endpoint.
        test_recipe:
          setup:
            - "A dwelling to attach the household application to"
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "11 Poplar St", year_built: 1955, conditioned_area_sqft: 1300, foundation_type: "SLAB", heating_fuel_type: "GAS" }
              as: ProgramAdmin
              captures: { dwelling_id: $.data.id }
          trigger:
            - call: "POST /weatherization/wap-applications"
              payload: { dwelling_id: "${dwelling_id}", household_size: 3, annual_gross_income_cents: 5000000 }
              as: Homeowner
              captures: { wap_id: $.data.id }
          assert:
            - "WapApplication.${wap_id}.income_limit_cents == 5000000"
            - "WapApplication.${wap_id}.status == ELIGIBLE"

      - name: verify_empty_installed_scope_set_rejected
        grounds:
          - validations[priority=10]
          - errors[ERR_SCOPE_INCOMPLETE]
