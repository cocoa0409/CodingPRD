        distinguishing_aspect: "Only the most recent RightsCheck governs: an earlier CLEAN check does not rescue the pitch once a later DISPUTED check is filed, and the failed advance leaves the pitch COVERED with no project created."
        test_recipe:
          setup:
            - "pitch \"Fault Lines\" is COVERED with recommendation ADVANCE; its first rights check was CLEAN and a second, later check filed at 2026-08-02 has chain_of_title_status DISPUTED so its result is DISPUTED"
          setup_api_calls:
