            - "AlarmSite.${site_id}.credit_balance_cents is still 0 — EXPLICIT never converts a shortfall into credit"
            - "correcting the second line to 5500 (sum 11000) is accepted with 201 and settles both invoices"

      - name: compliance_report_correction_with_identical_counts_is_rejected
        claim_type: Violation -> Error
        grounds:
          - validations.priority_47_business_constraint_ERR_NO_REPORTABLE_VARIANCE
          - endpoints.POST_/false-alarm-program/compliance-reports/{reportId}/correct
