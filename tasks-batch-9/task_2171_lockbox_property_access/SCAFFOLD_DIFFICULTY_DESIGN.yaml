              captures: { lstA_v2: $.data.version }
            - call: "POST /listings/${lstA_id}/state"
              payload: { action: "CLOSE", close_date: "2026-08-10", expected_listing_version: "${lstA_v2}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "GET /listings/${lstB_id}"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
              captures: { lstB_v: $.data.version }
            - call: "POST /listings/${lstB_id}/state"
              payload: { action: "MARK_UNDER_CONTRACT", expected_listing_version: "${lstB_v}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { lstB_v2: $.data.version }
            - call: "POST /listings/${lstB_id}/state"
              payload: { action: "CLOSE", close_date: "2026-08-10", expected_listing_version: "${lstB_v2}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: AssociationAdmin
