            - call: "POST /supply-centers/${center_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores"
              payload: { store_number: "ST-X", operator_name: "X", credit_limit_cents: 100000000 }
              as: SupplyChainAdmin
              captures: { store_x: $.data.id, store_x_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_x}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores"
              payload: { store_number: "ST-Y", operator_name: "Y", credit_limit_cents: 100000000 }
              as: SupplyChainAdmin
              captures: { store_y: $.data.id, store_y_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_y}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores/${store_y}/suspend"
