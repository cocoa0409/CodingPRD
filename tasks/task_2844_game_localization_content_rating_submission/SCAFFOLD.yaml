    input: ["language_code?", "union_flag?", "limit?", "offset?"]
    output: VoiceTalent[]
    side_effects: []

  # ---- TalentContract ----------------------------------------------------
  - method: POST
    path: "/talent-contracts"
    description: "Draft a usage-rights contract between a talent and a title. Carries the OCC guard expected_voice_talent_version (see §1.2.1)."
    roles: [LocalizationProducer, PlatformAdmin]
    code: 201
    input: [voice_talent_id, title_id, territory_scope, media_scope, buyout_fee_cents, per_line_rate_cents, rights_start_utc, rights_end_utc, expected_voice_talent_version]
    output: TalentContract
    side_effects: ["status DRAFT", "committed_fee_cents initialised to 0", "VoiceTalent.version incremented"]

  - method: GET
    path: "/talent-contracts/{talent_contract_id}"
    description: "Fetch one contract with its conserved committed_fee_cents."
    roles: [LocalizationProducer, TranslationVendor, LqaTester, ComplianceOfficer, RatingBoardLiaison, TalentAgent, PlatformAdmin]
    code: 200
    input: []
    output: TalentContract
    side_effects: []

  - method: GET
    path: "/talent-contracts"
    description: "List contracts; filter by voice_talent_id or title_id for reverse reachability. created_at ASC."
    roles: [LocalizationProducer, TranslationVendor, LqaTester, ComplianceOfficer, RatingBoardLiaison, TalentAgent, PlatformAdmin]
    code: 200
    input: ["voice_talent_id?", "title_id?", "status?", "media_scope?", "limit?", "offset?"]
    output: TalentContract[]
    side_effects: []

  - method: POST
    path: "/talent-contracts/{talent_contract_id}/sign"
    description: "Execute the contract. DRAFT -> SIGNED. A TalentAgent may only sign a contract for the talent it is (X-User-ID == voice_talent_id)."
    roles: [TalentAgent, LocalizationProducer, PlatformAdmin]
    code: 200
    input: []
    output: TalentContract
    side_effects: ["signed_at_utc := logical clock now", "calculations.talent_commitment_ledger -> committed_fee_cents := buyout_fee_cents"]

  - method: POST
    path: "/talent-contracts/{talent_contract_id}/terminate"
    description: "Terminate a SIGNED contract. SIGNED -> TERMINATED. Cancels every SCHEDULED session booked against it."
    roles: [LocalizationProducer, PlatformAdmin]
    code: 200
    input: []
    output: TalentContract
    side_effects: ["every SCHEDULED VoiceSession on this contract -> CANCELLED", "calculations.booth_reserved_minutes_total", "calculations.talent_commitment_ledger", "calculations.market_localization_cost_cents for each affected market plan"]

  # ---- VoiceSession ------------------------------------------------------
  - method: POST
    path: "/voice-sessions"
    description: "Book a recording session. Enforces contract territory/media coverage, the rights window, single-UTC-date containment, the booth's buffered half-open interval and the talent's aggregate daily minute cap, in that priority order."
    roles: [LocalizationProducer, PlatformAdmin]
    code: 201
    input: [market_plan_id, voice_talent_id, recording_booth_id, talent_contract_id, start_utc, end_utc, planned_line_count]
    output: VoiceSession
    side_effects: ["duration_minutes := (end_utc - start_utc) in whole minutes", "occupied_end_utc := end_utc + booth.turnaround_buffer_minutes", "status SCHEDULED", "calculations.booth_reserved_minutes_total increased by duration + buffer", "calculations.talent_reserved_minutes_on_date"]

  - method: GET
    path: "/voice-sessions/{voice_session_id}"
    description: "Fetch one session with its occupied_end_utc and line_fee_cents."
    roles: [LocalizationProducer, TranslationVendor, LqaTester, ComplianceOfficer, RatingBoardLiaison, TalentAgent, PlatformAdmin]
    code: 200
    input: []
    output: VoiceSession
    side_effects: []

  - method: GET
    path: "/voice-sessions"
    description: "List sessions; filter by market_plan_id, voice_talent_id, recording_booth_id or talent_contract_id for reverse reachability. created_at ASC."
    roles: [LocalizationProducer, TranslationVendor, LqaTester, ComplianceOfficer, RatingBoardLiaison, TalentAgent, PlatformAdmin]
    code: 200
    input: ["market_plan_id?", "voice_talent_id?", "recording_booth_id?", "talent_contract_id?", "status?", "limit?", "offset?"]
    output: VoiceSession[]
    side_effects: []

  - method: POST
    path: "/voice-sessions/{voice_session_id}/start"
    description: "Open the booth door. SCHEDULED -> IN_PROGRESS."
    roles: [TalentAgent, LocalizationProducer, PlatformAdmin]
    code: 200
    input: []
    output: VoiceSession
    side_effects: []

  - method: POST
    path: "/voice-sessions/{voice_session_id}/complete"
    description: "Record the delivered line count. IN_PROGRESS -> RECORDED. Feeds the contract ledger, the market's voice line tally and its cost."
    roles: [TalentAgent, LocalizationProducer, PlatformAdmin]
    code: 200
    input: [recorded_line_count]
    output: VoiceSession
    side_effects: ["line_fee_cents := recorded_line_count * contract.per_line_rate_cents", "MarketPlan.voice_recorded_line_count increased by recorded_line_count", "calculations.talent_commitment_ledger", "calculations.market_localization_cost_cents"]

  - method: POST
    path: "/voice-sessions/{voice_session_id}/cancel"
    description: "Cancel a SCHEDULED, IN_PROGRESS or RECORDED session. -> CANCELLED and every side effect the session ever applied is reversed exactly, with no residual drift."
    roles: [LocalizationProducer, PlatformAdmin]
    code: 200
    input: []
    output: VoiceSession
    side_effects: ["line_fee_cents := 0", "MarketPlan.voice_recorded_line_count decreased by the previously recorded lines", "calculations.talent_commitment_ledger back to its pre-complete value", "calculations.booth_reserved_minutes_total back to its pre-create value", "calculations.market_localization_cost_cents", "the booth interval is released so a previously conflicting booking now succeeds"]

  # ---- QaPass ------------------------------------------------------------
  - method: POST
    path: "/qa-passes"
    description: "Open a linguistic or functional QA pass over a market plan. At most one OPEN pass per (market_plan_id, pass_type). pass_index is assigned as the next integer for that pair."
    roles: [LqaTester, PlatformAdmin]
    code: 201
    input: [market_plan_id, pass_type, inspected_unit_count]
    output: QaPass
    side_effects: ["status OPEN", "opened_by_user_id := X-User-ID", "reopen_count 0", "weighted_defect_points 0", "defect_density 0.0000"]

  - method: GET
    path: "/qa-passes/{qa_pass_id}"
    description: "Fetch one QA pass with its weighted_defect_points and defect_density."
    roles: [LocalizationProducer, TranslationVendor, LqaTester, ComplianceOfficer, RatingBoardLiaison, TalentAgent, PlatformAdmin]
    code: 200
    input: []
    output: QaPass
    side_effects: []

  - method: GET
    path: "/qa-passes"
    description: "List QA passes; filter by market_plan_id for reverse reachability. created_at ASC."
    roles: [LocalizationProducer, TranslationVendor, LqaTester, ComplianceOfficer, RatingBoardLiaison, TalentAgent, PlatformAdmin]
    code: 200
    input: ["market_plan_id?", "pass_type?", "status?", "limit?", "offset?"]
    output: QaPass[]
    side_effects: []

  - method: POST
    path: "/qa-passes/{qa_pass_id}/close"
    description: "Close the pass. OPEN -> CLOSED, permitted only while defect_density is STRICTLY below 0.0500. The user who opened the pass may not close it."
    roles: [LqaTester, PlatformAdmin]
    code: 200
    input: []
    output: QaPass
    side_effects: ["closed_at_utc := logical clock now", "calculations.qa_defect_density re-evaluated as the gate"]

  - method: POST
    path: "/qa-passes/{qa_pass_id}/reopen"
    description: "Reopen a CLOSED pass, e.g. after a content edit invalidated inspected units. CLOSED -> OPEN and reopen_count incremented."
    roles: [LqaTester, PlatformAdmin]
    code: 200
    input: []
    output: QaPass
    side_effects: ["reopen_count incremented", "closed_at_utc cleared to null", "calculations.qa_defect_density"]

  # ---- LqaBug ------------------------------------------------------------
  - method: POST
    path: "/lqa-bugs"
    description: "Log a bug against an OPEN QA pass, optionally against one translation unit. severity_weight and axis are derived, never supplied."
    roles: [LqaTester, PlatformAdmin]
    code: 201
    input: [qa_pass_id, bug_class, severity, summary, "translation_unit_id?"]
    output: LqaBug
    side_effects: ["status NEW", "logged_by_user_id := X-User-ID", "severity_weight := SEVERITY_WEIGHT[severity]", "axis := LINGUISTIC for MISTRANSLATION/CULTURAL/LEGAL_TEXT and FUNCTIONAL for TEXT_OVERFLOW/TRUNCATION/FUNCTIONAL_CRASH", "TranslationUnit.open_bug_count incremented when linked", "calculations.qa_defect_density", "calculations.rating_risk_score BOARD_ADJUSTED inputs change when bug_class == LEGAL_TEXT"]

  - method: GET
    path: "/lqa-bugs/{lqa_bug_id}"
    description: "Fetch one bug."
    roles: [LocalizationProducer, TranslationVendor, LqaTester, ComplianceOfficer, RatingBoardLiaison, TalentAgent, PlatformAdmin]
    code: 200
    input: []
    output: LqaBug
    side_effects: []

  - method: GET
    path: "/lqa-bugs"
    description: "List bugs; filter by qa_pass_id, translation_unit_id or duplicate_of_bug_id for reverse reachability. created_at ASC."
    roles: [LocalizationProducer, TranslationVendor, LqaTester, ComplianceOfficer, RatingBoardLiaison, TalentAgent, PlatformAdmin]
    code: 200
    input: ["qa_pass_id?", "translation_unit_id?", "duplicate_of_bug_id?", "bug_class?", "severity?", "status?", "limit?", "offset?"]
    output: LqaBug[]
    side_effects: []

  - method: POST
    path: "/lqa-bugs/{lqa_bug_id}/triage"
    description: "Triage fork from NEW: triage_action ACCEPT -> TRIAGED, REJECT -> REJECTED, DUPLICATE -> DUPLICATE (requires duplicate_of_bug_id). REJECTED and DUPLICATE leave the open set and therefore lower the pass's defect_density."
    roles: [LqaTester, LocalizationProducer, PlatformAdmin]
    code: 200
    input: [triage_action, "duplicate_of_bug_id?"]
    output: LqaBug
    side_effects: ["calculations.qa_defect_density", "TranslationUnit.open_bug_count decremented on REJECTED/DUPLICATE when linked", "calculations.rating_risk_score BOARD_ADJUSTED inputs change for LEGAL_TEXT bugs"]

  - method: POST
    path: "/lqa-bugs/{lqa_bug_id}/submit-fix"
    description: "Vendor claims a fix. TRIAGED -> FIX_SUBMITTED. The bug stays in the open set, so the density is unchanged."
    roles: [TranslationVendor, PlatformAdmin]
    code: 200
    input: []
    output: LqaBug
    side_effects: ["calculations.qa_defect_density (value unchanged - FIX_SUBMITTED is still open)"]

  - method: POST
    path: "/lqa-bugs/{lqa_bug_id}/verify"
    description: "Verify a submitted fix. FIX_SUBMITTED -> VERIFIED, which removes the bug from the open set and lowers the pass's defect_density. The user who logged the bug may not verify it. A verified bug can be dragged back to TRIAGED only by the QaPass reopening."
    roles: [LqaTester, PlatformAdmin]
    code: 200
    input: []
    output: LqaBug
    side_effects: ["verified_by_user_id := X-User-ID", "calculations.qa_defect_density", "TranslationUnit.open_bug_count decremented when linked", "calculations.rating_risk_score BOARD_ADJUSTED inputs change for LEGAL_TEXT bugs"]

  # ---- RatingSubmission --------------------------------------------------
  - method: POST
    path: "/rating-submissions"
    description: "Draft a rating submission for a market. submission_round is assigned as (greatest existing round for the market plan) + 1, starting at 1. Carries the OCC guard expected_market_plan_version (see §1.2.1)."
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 201
    input: [market_plan_id, disclosed_content_codes, footage_asset_count, target_rating, expected_market_plan_version]
    output: RatingSubmission
    side_effects: ["status DRAFT", "rating_board copied from the MarketPlan", "submission_round assigned", "appeal_count 0", "MarketPlan.version incremented"]

  - method: GET
    path: "/rating-submissions/{rating_submission_id}"
    description: "Fetch one submission with both risk-score variants, its projected band and its frozen fee."
    roles: [LocalizationProducer, TranslationVendor, LqaTester, ComplianceOfficer, RatingBoardLiaison, TalentAgent, PlatformAdmin]
    code: 200
    input: []
    output: RatingSubmission
    side_effects: []

  - method: GET
    path: "/rating-submissions"
    description: "List submissions; filter by market_plan_id for reverse reachability. created_at ASC."
    roles: [LocalizationProducer, TranslationVendor, LqaTester, ComplianceOfficer, RatingBoardLiaison, TalentAgent, PlatformAdmin]
    code: 200
    input: ["market_plan_id?", "rating_board?", "status?", "limit?", "offset?"]
    output: RatingSubmission[]
    side_effects: []

  - method: POST
    path: "/rating-submissions/{rating_submission_id}/submit"
    description: "File the questionnaire with the board. DRAFT -> SUBMITTED. Freezes self_assessed_risk_score and fee_cents. Enforces mandatory disclosures and footage evidence. A submission that came back EDITS_REQUIRED is never re-submitted: the next round is a new RatingSubmission, whose creation supersedes the old one into WITHDRAWN."
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: RatingSubmission
    side_effects: ["submitted_by_user_id := X-User-ID", "submitted_at_utc := logical clock now", "calculations.rating_risk_score variant SELF_ASSESSED (frozen)", "calculations.submission_fee_cents (frozen)"]

  - method: POST
    path: "/rating-submissions/{rating_submission_id}/begin-review"
    description: "Board picks the submission up. SUBMITTED -> UNDER_REVIEW. Computes the BOARD_ADJUSTED risk score and the projected rating band."
    roles: [RatingBoardLiaison, PlatformAdmin]
    code: 200
    input: []
    output: RatingSubmission
    side_effects: ["reviewed_by_user_id := X-User-ID", "calculations.rating_risk_score variant BOARD_ADJUSTED", "projected_rating_band := rating_band(board_adjusted_risk_score)"]

  - method: POST
    path: "/rating-submissions/{rating_submission_id}/record-outcome"
    description: "Board issues its decision. board_decision RATE -> RATED (assigned_rating required), board_decision REQUIRE_EDITS -> EDITS_REQUIRED. The user who submitted may not record the outcome."
    roles: [RatingBoardLiaison, PlatformAdmin]
    code: 200
    input: [board_decision, "assigned_rating?"]
    output: RatingSubmission
    side_effects: ["board_decision RATE -> assigned_rating stored; it must equal the current projected_rating_band", "board_decision REQUIRE_EDITS -> assigned_rating stays null and the market plan may not be marked release ready"]

  - method: POST
    path: "/rating-submissions/{rating_submission_id}/appeal"
    description: "Appeal a RATED outcome back into review. RATED -> UNDER_REVIEW, at most MAX_APPEALS (2) times. Recomputes BOARD_ADJUSTED against the current edit and bug picture."
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: RatingSubmission
    side_effects: ["appeal_count incremented", "assigned_rating cleared to null", "calculations.rating_risk_score variant BOARD_ADJUSTED", "projected_rating_band recomputed"]

  - method: POST
    path: "/rating-submissions/{rating_submission_id}/withdraw"
    description: "Withdraw a submission from any non-terminal state. -> WITHDRAWN. Every PROPOSED ContentEdit under it is withdrawn too."
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: RatingSubmission
    side_effects: ["every PROPOSED ContentEdit of this submission -> WITHDRAWN"]

  # ---- ContentEdit -------------------------------------------------------
  - method: POST
    path: "/content-edits"
    description: "Propose an edit to reach the target rating. Requires the submission to be in EDITS_REQUIRED. removed_content_codes must be a subset of the submission's disclosed_content_codes."
    roles: [ComplianceOfficer, LocalizationProducer, PlatformAdmin]
    code: 201
    input: [rating_submission_id, edit_kind, rationale, "affected_string_key_ids?", "removed_content_codes?"]
    output: ContentEdit
    side_effects: ["status PROPOSED", "invalidated_unit_count 0", "calculations.rating_risk_score BOARD_ADJUSTED inputs change (+9 per PROPOSED edit at the next review)"]

  - method: GET
    path: "/content-edits/{content_edit_id}"
    description: "Fetch one content edit."
    roles: [LocalizationProducer, TranslationVendor, LqaTester, ComplianceOfficer, RatingBoardLiaison, TalentAgent, PlatformAdmin]
    code: 200
    input: []
    output: ContentEdit
    side_effects: []

  - method: GET
    path: "/content-edits"
    description: "List content edits; filter by rating_submission_id for reverse reachability. created_at ASC."
    roles: [LocalizationProducer, TranslationVendor, LqaTester, ComplianceOfficer, RatingBoardLiaison, TalentAgent, PlatformAdmin]
    code: 200
    input: ["rating_submission_id?", "edit_kind?", "status?", "limit?", "offset?"]
    output: ContentEdit[]
    side_effects: []

  - method: POST
    path: "/content-edits/{content_edit_id}/apply"
    description: "Apply the edit to the shipped content. PROPOSED -> APPLIED. The deepest cascade in the system (see §1.2 ContentEdit PROPOSED -> APPLIED for the authoritative hop list): it reverts translation for every affected string key, un-delivers those units, drags the market plan back out of LQA, reopens the affected QA passes, drags their VERIFIED bugs back to TRIAGED, reverts the title out of its cert window and shrinks the effective disclosure set."
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: ContentEdit
    side_effects: ["hop 1: status := APPLIED, applied_at_utc := logical clock now, invalidated_unit_count := the hop-2 count", "hop 2: every TranslationUnit of the submission's market plan whose string_key_id is in affected_string_key_ids and whose translation_status IN {DRAFTED, DELIVERED} -> PENDING with qa_status NOT_CHECKED and target_text cleared; MarketPlan.delivered_unit_count decreased accordingly", "hop 2b (only when edit_kind == REMOVE_CONTENT): every affected LOCKED StringKey -> RETIRED, lowering MarketPlan.required_unit_count", "hop 3: MarketPlan LQA -> IN_LOCALIZATION when delivered_unit_count fell below required_unit_count", "hop 3b: calculations.market_text_effort_units variant DELIVERED_ACTUAL and calculations.market_localization_cost_cents recomputed over the shrunken DELIVERED set", "hop 4: every CLOSED QaPass of that market plan reopens to OPEN with reopen_count incremented and closed_at_utc null", "hop 5: every VERIFIED LqaBug of those passes whose translation_unit_id was reverted in hop 2 -> TRIAGED, which raises calculations.qa_defect_density again", "hop 6: Title.localization_state CERT_WINDOW -> STRINGS_LOCKED and calculations.title_release_gate_state recomputed", "removed_content_codes leave the effective disclosure set, lowering the next calculations.rating_risk_score BOARD_ADJUSTED by their weights and crediting -5"]

  - method: POST
    path: "/content-edits/{content_edit_id}/withdraw"
    description: "Withdraw a proposed edit. PROPOSED -> WITHDRAWN. No cascade, because nothing was applied."
    roles: [ComplianceOfficer, LocalizationProducer, PlatformAdmin]
    code: 200
    input: []
    output: ContentEdit
    side_effects: ["calculations.rating_risk_score BOARD_ADJUSTED inputs change (the +9 PROPOSED penalty disappears)"]

  # ---- Test-driving endpoint (§1.5 priority ladder step 3) ---------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z and the server MUST NOT fall back to real wall-clock time before this endpoint is called. Every deadline, rights window, expedite threshold and cert-window computation reads this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["logical clock set", "calculations.title_release_gate_state recomputed for every title", "response body is the inline object { current_utc: datetime }"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # ---- auth --------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header absent, or X-User-Role is not one of the seven declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_OWNERSHIP_VIOLATION
    http: 403
    condition: "a TalentAgent acts on a TalentContract or VoiceSession whose voice_talent_id differs from the acting X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the same X-User-ID attempts both halves of a separated duty: open+close a QaPass, log+verify an LqaBug, or submit+record-outcome a RatingSubmission"

  # ---- request shape -----------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, enum value outside its declared set, negative count, malformed RFC3339 instant, non-array where an array is required, end_utc <= start_utc, or rating_board != MARKET_BOARD[market_code]"

  # ---- existence (404) ---------------------------------------------------
  - id: ERR_TITLE_NOT_FOUND
    http: 404
    condition: "no Title with the given id"
  - id: ERR_MARKET_PLAN_NOT_FOUND
    http: 404
    condition: "no MarketPlan with the given id"
  - id: ERR_STRING_KEY_NOT_FOUND
    http: 404
    condition: "no StringKey with the given id (also raised for an unknown id inside ContentEdit.affected_string_key_ids)"
  - id: ERR_TRANSLATION_UNIT_NOT_FOUND
    http: 404
    condition: "no TranslationUnit with the given id"
  - id: ERR_BOOTH_NOT_FOUND
    http: 404
    condition: "no RecordingBooth with the given id"
  - id: ERR_TALENT_NOT_FOUND
    http: 404
    condition: "no VoiceTalent with the given id"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "no TalentContract with the given id"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "no VoiceSession with the given id"
  - id: ERR_QA_PASS_NOT_FOUND
    http: 404
    condition: "no QaPass with the given id"
  - id: ERR_BUG_NOT_FOUND
    http: 404
    condition: "no LqaBug with the given id (also raised for an unknown duplicate_of_bug_id)"
  - id: ERR_SUBMISSION_NOT_FOUND
    http: 404
    condition: "no RatingSubmission with the given id"
  - id: ERR_CONTENT_EDIT_NOT_FOUND
    http: 404
    condition: "no ContentEdit with the given id"

  # ---- referential integrity --------------------------------------------
  - id: ERR_CROSS_PARENT_MISMATCH
    http: 422
    condition: "two supplied references belong to different ancestors: a string key from another title, a contract for another talent or title, a bug's unit outside the pass's market plan, or an affected string key outside the submission's title"

  # ---- concurrency (412) -------------------------------------------------
  - id: ERR_STALE_MARKET_PLAN_VERSION
    http: 412
    condition: "expected_market_plan_version does not equal the MarketPlan's current version at POST /rating-submissions"
  - id: ERR_STALE_TALENT_VERSION
    http: 412
    condition: "expected_voice_talent_version does not equal the VoiceTalent's current version at POST /talent-contracts"

  # ---- uniqueness (409) --------------------------------------------------
  - id: ERR_DUPLICATE_TITLE_CODE
    http: 409
    condition: "another Title already uses this title_code"
  - id: ERR_DUPLICATE_MARKET_CODE
    http: 409
    condition: "the title already has a MarketPlan for this market_code"
  - id: ERR_DUPLICATE_STRING_KEY
    http: 409
    condition: "the title already has a StringKey with this key_name"
  - id: ERR_OPEN_QA_PASS_EXISTS
    http: 409
    condition: "the market plan already has an OPEN QaPass of the requested pass_type"

  # ---- state preconditions (409) ----------------------------------------
  - id: ERR_TITLE_STRINGS_ALREADY_LOCKED
    http: 409
    condition: "lock-strings called on a Title whose localization_state is not PLANNING"
  - id: ERR_MARKET_PLAN_STATE_INVALID
    http: 409
    condition: "the MarketPlan is not in a status that permits the requested transition (scope requires DRAFT, start-localization requires SCOPED, enter-lqa requires IN_LOCALIZATION, mark-release-ready requires LQA, block forbids RELEASE_READY)"
  - id: ERR_STRING_KEY_LOCKED
    http: 409
    condition: "PATCH /string-keys/{id} on a key whose status is LOCKED or RETIRED"
  - id: ERR_UNIT_NOT_DELIVERED
    http: 409
    condition: "qa-mark on a TranslationUnit whose translation_status is not DELIVERED, or deliver on a unit that is not DRAFTED, or PUT on a unit that is already DELIVERED"
  - id: ERR_CONTRACT_NOT_DRAFT
    http: 409
    condition: "sign on a TalentContract that is not DRAFT, or terminate on a contract that is not SIGNED"
  - id: ERR_SESSION_STATE_INVALID
    http: 409
    condition: "start requires SCHEDULED, complete requires IN_PROGRESS, cancel forbids an already CANCELLED session"
  - id: ERR_QA_PASS_NOT_OPEN
    http: 409
    condition: "close on a QaPass that is not OPEN, or a bug logged against a QaPass that is not OPEN"
  - id: ERR_QA_PASS_NOT_CLOSED
    http: 409
    condition: "reopen on a QaPass that is not CLOSED"
  - id: ERR_BUG_STATE_INVALID
    http: 409
    condition: "triage requires NEW, submit-fix requires TRIAGED, verify requires FIX_SUBMITTED; a bug in REJECTED, DUPLICATE or VERIFIED accepts nothing further"
  - id: ERR_SUBMISSION_STATE_INVALID
    http: 409
    condition: "submit requires DRAFT, begin-review requires SUBMITTED, record-outcome requires UNDER_REVIEW, appeal requires RATED, withdraw forbids WITHDRAWN"
  - id: ERR_CONTENT_EDIT_NOT_PROPOSED
    http: 409
    condition: "apply or withdraw on a ContentEdit that is not PROPOSED"
  - id: ERR_PREREQUISITE_STATE_NOT_MET
    http: 409
    condition: "a cross-entity precondition fails: Title not STRINGS_LOCKED at start-localization, contract not SIGNED or market plan not IN_LOCALIZATION at session booking, market plan outside {IN_LOCALIZATION, LQA} at qa-pass creation, outside {LQA, RELEASE_READY} at submission creation, or submission not EDITS_REQUIRED at content-edit creation"

  # ---- scheduling and capacity (409) ------------------------------------
  - id: ERR_BOOTH_WINDOW_CONFLICT
    http: 409
    condition: "the new session's buffered half-open interval [start_utc, end_utc + turnaround_buffer_minutes) intersects that of an existing SCHEDULED, IN_PROGRESS or RECORDED session on the same booth"
  - id: ERR_TALENT_DAILY_CAPACITY_EXCEEDED
    http: 409
    condition: "the talent's already-reserved minutes on the session's UTC date plus the new duration exceed max_daily_recording_minutes, even when the sessions do not overlap in time"

  # ---- compliance and quality (422) -------------------------------------
  - id: ERR_MANDATORY_DISCLOSURE_MISSING
    http: 422
    condition: "a code in MANDATORY_DISCLOSURES[market_code] is absent from disclosed_content_codes at submit"
  - id: ERR_CONTENT_RESTRICTION_UNRESOLVED
    http: 422
    condition: "a code in RESTRICTED_CODES[market_code] is still in the governing submission's effective disclosure set at mark-release-ready"
  - id: ERR_FOOTAGE_EVIDENCE_MISSING
    http: 422
    condition: "the effective disclosure set intersects FOOTAGE_MANDATORY_CODES but footage_asset_count is 0"
  - id: ERR_CONTRACT_TERRITORY_NOT_COVERED
    http: 422
    condition: "the contract's territory_scope omits the market_code, or its media_scope is IN_GAME_ONLY for a FULL_CULTURAL market"
  - id: ERR_CONTRACT_RIGHTS_WINDOW_EXCEEDED
    http: 422
    condition: "the requested session window falls outside [rights_start_utc, rights_end_utc]"
  - id: ERR_SESSION_SPANS_TWO_DATES
    http: 422
    condition: "start_utc and end_utc fall on different UTC calendar dates"
  - id: ERR_DEFECT_DENSITY_EXCEEDED
    http: 422
    condition: "close attempted while defect_density >= 0.0500 - a density exactly equal to the ceiling is a violation"
  - id: ERR_TEXT_OVERFLOW_UNRESOLVED
    http: 422
    condition: "a unit still has overflow_chars > 0 with qa_status != PASSED, or a TEXT_OVERFLOW/TRUNCATION bug is still open, at mark-release-ready"
  - id: ERR_LOCALIZATION_INCOMPLETE
    http: 422
    condition: "enter-lqa attempted while delivered_unit_count < required_unit_count, or while a voiced market plan has voice_recorded_line_count < required_voice_line_count"
  - id: ERR_RATING_BAND_MISMATCH
    http: 422
    condition: "the governing submission is not RATED, or its assigned_rating is stricter than the market plan's target_rating"
  - id: ERR_MAX_APPEALS_EXCEEDED
    http: 422
    condition: "appeal attempted when appeal_count has already reached MAX_APPEALS (2)"
  - id: ERR_BUDGET_OVERAGE
    http: 422
    condition: "mark-release-ready attempted while the market plan's overage_cents is greater than 0"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: LocalizationProducer
    description: "Publisher-side owner of the localization programme: registers titles, extracts strings, scopes markets, books recording and applies content edits."
    identity: opaque
    exclusive_operations:
      - "POST /titles"
      - "POST /titles/{title_id}/lock-strings"
      - "POST /market-plans"
      - "POST /string-keys"
      - "PATCH /string-keys/{string_key_id}"
      - "POST /market-plans/{market_plan_id}/scope"
      - "POST /market-plans/{market_plan_id}/start-localization"
      - "POST /market-plans/{market_plan_id}/enter-lqa"
      - "POST /booths"
      - "POST /voice-talents"
      - "POST /talent-contracts"
      - "POST /talent-contracts/{talent_contract_id}/terminate"
      - "POST /voice-sessions"
      - "POST /voice-sessions/{voice_session_id}/cancel"
    shared_operations:
      - "POST /talent-contracts/{talent_contract_id}/sign (with TalentAgent)"
      - "POST /voice-sessions/{voice_session_id}/start (with TalentAgent)"
      - "POST /voice-sessions/{voice_session_id}/complete (with TalentAgent)"
      - "POST /lqa-bugs/{lqa_bug_id}/triage (with LqaTester)"
      - "POST /content-edits (with ComplianceOfficer)"
      - "POST /content-edits/{content_edit_id}/withdraw (with ComplianceOfficer)"
      - "all GET endpoints"

  - name: TranslationVendor
    description: "External language service provider: writes target text, delivers units and submits bug fixes."
    identity: opaque
    exclusive_operations:
      - "PUT /translation-units/{translation_unit_id}"
      - "POST /translation-units/{translation_unit_id}/deliver"
      - "POST /lqa-bugs/{lqa_bug_id}/submit-fix"
    shared_operations:
      - "all GET endpoints"

  - name: LqaTester
    description: "Linguistic and functional QA: opens and closes passes, marks unit QA status, logs bugs and verifies fixes."
    identity: opaque
    exclusive_operations:
      - "POST /translation-units/{translation_unit_id}/qa-mark"
      - "POST /qa-passes"
      - "POST /qa-passes/{qa_pass_id}/close"
      - "POST /qa-passes/{qa_pass_id}/reopen"
      - "POST /lqa-bugs"
      - "POST /lqa-bugs/{lqa_bug_id}/verify"
    shared_operations:
      - "POST /lqa-bugs/{lqa_bug_id}/triage (with LocalizationProducer)"
      - "all GET endpoints"

  - name: ComplianceOfficer
    description: "Owns ratings and regional legal compliance: drafts and files submissions, appeals outcomes, blocks markets and declares release readiness."
    identity: opaque
    exclusive_operations:
      - "POST /rating-submissions"
      - "POST /rating-submissions/{rating_submission_id}/submit"
      - "POST /rating-submissions/{rating_submission_id}/appeal"
      - "POST /rating-submissions/{rating_submission_id}/withdraw"
      - "POST /market-plans/{market_plan_id}/mark-release-ready"
      - "POST /market-plans/{market_plan_id}/block"
      - "POST /content-edits/{content_edit_id}/apply"
    shared_operations:
      - "POST /content-edits (with LocalizationProducer)"
      - "POST /content-edits/{content_edit_id}/withdraw (with LocalizationProducer)"
      - "all GET endpoints"

  - name: RatingBoardLiaison
    description: "Acts for the rating board: picks submissions up for review and records the board's outcome."
    identity: opaque
    exclusive_operations:
      - "POST /rating-submissions/{rating_submission_id}/begin-review"
      - "POST /rating-submissions/{rating_submission_id}/record-outcome"
    shared_operations:
      - "all GET endpoints"

  - name: TalentAgent
    description: "Acts on behalf of one voice talent. X-User-ID is that VoiceTalent's id, so every write is ownership-checked against voice_talent_id."
    identity: "entity_backed:VoiceTalent"
    exclusive_operations: []
    shared_operations:
      - "POST /talent-contracts/{talent_contract_id}/sign (with LocalizationProducer, ownership-checked)"
      - "POST /voice-sessions/{voice_session_id}/start (with LocalizationProducer, ownership-checked)"
      - "POST /voice-sessions/{voice_session_id}/complete (with LocalizationProducer, ownership-checked)"
      - "all GET endpoints"

  - name: PlatformAdmin
    description: "Operator of the publishing platform. Permitted on every endpoint, and the only role that may move the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every other endpoint in §1.5, shared with its domain role"
