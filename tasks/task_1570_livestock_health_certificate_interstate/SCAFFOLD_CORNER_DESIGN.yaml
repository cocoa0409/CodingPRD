              payload: { premises_id: "${prem_id}", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_date: "2026-07-12T00:00:00Z", lab_reference: "LAB-S23-A" }
              as: LabTechnician
              captures: { t1: $.data.id }
            - call: "POST /api/test-records/${t1}/result"
              payload: { result: "NEGATIVE" }
              as: LabTechnician
            - call: "POST /api/test-records"
              payload: { premises_id: "${prem_id}", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_date: "2026-08-09T00:00:00Z", lab_reference: "LAB-S23-B" }
              as: LabTechnician
              captures: { t2: $.data.id }
            - call: "POST /_clock/set_current_utc"
