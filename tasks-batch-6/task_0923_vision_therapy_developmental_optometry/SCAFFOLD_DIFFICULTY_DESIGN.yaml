  - rule_id: transitive_cascade
    instances:

      - name: red_flag_finalize_depth_five_cascade
        grounds:
          - state_machines.Assessment.DRAFT_to_FINALIZED
          - state_machines.TherapyPlan.ACTIVE_to_SUSPENDED
          - state_machines.TherapySession.SCHEDULED_to_CANCELLED
          - state_machines.Authorization.ACTIVE_to_ACTIVE
          - state_machines.KitLoan.CHECKED_OUT_to_RECALLED
          - entities.Referral.fields.triggering_assessment_id
        distinguishing_aspect: |
          CASCADE-A, five caused links deep, all from one finalize: red-flag finding creates an urgent
          outbound Referral; that Referral suspends the plan; the suspension cancels the future session;
          the cancellation releases the authorization unit; the release recalls the outstanding kit loan.
          No link is a direct fan-out from the finalize - each is caused by the previous one.
