  - name: meeting_thirty_minute_buffer_rule
    grounds:
    - calculations.meeting_overlap_check
    - errors[ERR_MEETING_OVERLAP]
    distinguishing_aspect: 'Resource = meeting scope (nonprofit board), semantics = 30-minute BUFFER on both sides (different

      from half-open adjacency): a meeting starting exactly at the prior meeting''s end (11:00) is a

      conflict, 11:29 is a conflict, and exactly 11:30 (buffer fully satisfied) is allowed.

      '
    test_recipe:
      setup:
      - Org; existing board meeting M1 occupying [2026-08-01T10:00, 2026-08-01T11:00)
      setup_api_calls:
      - call: POST /boardgov/nonprofits
        payload:
          name: Buffer Org
          ein: EIN-BUF-1
          state_of_incorporation: CA
          fiscal_year_end_month: 12
          annual_gross_receipts_cents: 4000000000
        as: GovernanceAdmin
        captures:
          np: $.data.id
      - call: POST /boardgov/meetings
        payload:
          nonprofit_id: ${np}
          scheduled_start: '2026-08-01T10:00:00Z'
          duration_minutes: 60
          notice_waived: true
        as: GovernanceAdmin
        captures:
          m1: $.data.id
      trigger:
      - call: POST /boardgov/meetings
        payload:
          nonprofit_id: ${np}
          scheduled_start: '2026-08-01T11:00:00Z'
          duration_minutes: 60
          notice_waived: true
        as: GovernanceAdmin
        captures:
          err_adjacent: $.data.error_id
      - call: POST /boardgov/meetings
        payload:
          nonprofit_id: ${np}
          scheduled_start: '2026-08-01T11:29:00Z'
          duration_minutes: 60
          notice_waived: true
        as: GovernanceAdmin
        captures:
          err_29: $.data.error_id
      - call: POST /boardgov/meetings
        payload:
          nonprofit_id: ${np}
          scheduled_start: '2026-08-01T11:30:00Z'
          duration_minutes: 60
          notice_waived: true
        as: GovernanceAdmin
        captures:
          m2: $.data.id
          m2_status: $.data.status
      assert:
      - err_adjacent == ERR_MEETING_OVERLAP (bare adjacency violates the buffer — unlike BoardTerm semantics)
      - err_29 == ERR_MEETING_OVERLAP (29 minutes of buffer < 30)
      - m2_status == SCHEDULED (exactly 30 minutes satisfies the buffer — >= boundary)
  - name: insurance_renewal_gap_and_overlap_detection
    grounds:
    - calculations.coverage_gap_detection
    - errors[ERR_COVERAGE_GAP]
    - errors[ERR_POLICY_OVERLAP]
    distinguishing_aspect: 'Resource = InsurancePolicy chain (DNO), semantics = adjacency REQUIRED (different from both

      BoardTerm and Meeting): a renewal starting the day AFTER the prior end is a gap

      (ERR_COVERAGE_GAP without acknowledgement), a renewal starting BEFORE the prior end is an overlap

      (ERR_POLICY_OVERLAP), and only exact abutment (start == prior end) binds cleanly.

      '
    test_recipe:
      setup:
      - Org receipts 4,000,000,000 (D&O floor = 1,000,000,000); ACTIVE DNO policy P1 [2026-01-01, 2027-01-01) with coverage 2,000,000,000
      setup_api_calls:
