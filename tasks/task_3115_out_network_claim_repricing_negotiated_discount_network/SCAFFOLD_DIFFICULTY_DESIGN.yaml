            - call: "POST /medicare-fee-schedule"
              payload: { procedure_code: "99283", region_code: "R1", base_rate_cents: 10000, geographic_adjustment_factor: 1.10, effective_year: 2026 }
              as: NetworkAdmin
            - call: "POST /repricing-policies"
              payload: { payer_client_id: "${p1_id}", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", methodology: "PERCENT_OF_MEDICARE", percent_of_medicare: 1.50, priority: 1 }
              as: PayerAdmin
              as_user_id: "${p1_id}"
            - call: "POST /claims"
              payload: { payer_client_id: "${p1_id}", provider_id: "${pr1_id}", external_claim_ref: "H1", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", service_date: "2026-09-10T00:00:00Z", patient_responsibility_cents: 0 }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { claim_h_id: $.data.id, claim_h_v: $.data.version }
            - call: "POST /claims/${claim_h_id}/lines"
              payload: { procedure_code: "99283", quantity_units: 2, unit_charge_cents: 30000, region_code: "R1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /claims/${claim_h_id}/reprice"
              payload: { expected_claim_version: "${claim_h_v} + 1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /negotiation-cases"
              payload: { claim_id: "${claim_h_id}" }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { case_h_id: $.data.id, case_h_v: $.data.version }
            - call: "POST /negotiation-cases/${case_h_id}/offer"
              payload: { offer_cents: 30000, expected_case_version: "${case_h_v}" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /negotiation-cases/${case_h_id}/counter"
              payload: { counter_cents: 50000 }
              as: ProviderRep
              as_user_id: "${pr1_id}"
            - call: "POST /negotiation-cases/${case_h_id}/accept"
              payload: {}
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "GET /settlement-agreements"
              payload: { negotiation_case_id: "${case_h_id}" }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { sa_h_id: "$.data[0].id" }
          trigger:
            - call: "POST /settlement-agreements/${sa_h_id}/void"
              payload: {}
              as: PayerRep
              as_user_id: "${p1_id}"
          assert:
            - "SettlementAgreement.${sa_h_id}.status == VOIDED"
            - "NegotiationCase.${case_h_id}.status == COUNTERED (reverted from ACCEPTED)"
            - "NegotiationCase.${case_h_id}.current_offer_cents == 50000 (preserved)"
            - "NegotiationCase.${case_h_id}.round_count == 1 (not re-incremented)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: appeal_adjusted_cascades_determination_supersede_and_claim_recompute
        grounds:
          - state_machines.ProviderAppeal.UNDER_REVIEW_to_RE_REVIEWED_ADJUSTED
          - state_machines.RepricingDetermination.ACTIVE_to_SUPERSEDED
          - entities.RepricingDetermination.fields.supersedes_determination_id
          - entities.Claim.fields.allowed_amount_cents
        distinguishing_aspect: |
          Depth-3 cascade triggered by the appeal resolve transition: (1) appeal
          ADJUSTED creates a new ACTIVE RepricingDetermination; (2) that creation
          supersedes the prior ACTIVE determination; (3) the supersession recomputes
          the Claim's allowed/liability/savings and bumps Claim.version. Each hop
          is caused by the previous hop, not by the resolve call directly.
        test_recipe:
          setup:
            - "Claim I PRICED at allowed 33000 (fixture: billed 60000, 99283 qty 2 unit 30000, Medicare x1.5, patient 5000) with determination DET1 ACTIVE."
            - "ProviderAppeal AP1 on DET1, moved SUBMITTED -> UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /payer-clients"
              payload: { payer_name: "P1", fee_percent: 0.25, fee_cap_cents_per_claim: 5000 }
              as: OpsAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1000000007", legal_name: "PR1", tin: "T1" }
              as: NetworkAdmin
              captures: { pr1_id: $.data.id }
            - call: "POST /medicare-fee-schedule"
