          assert:
            - "MachineOperator role on inspection endpoint -> http 403 ERR_FORBIDDEN_ROLE"
            - "QCInspector with X-User-ID == completing operator op-1 -> http 403 ERR_SOD_VIOLATION (segregation of duties)"
            - "a QCInspector with a different user id succeeds"

      - name: inventory_clerk_cannot_void_credit
        claim_type: rbac_denial
        grounds: [roles]
        distinguishing_aspect: "void is ShopManager-exclusive; the clerk who posted the credit cannot void it."
        test_recipe:
