      - name: the_third_contaminated_field_blank_suspends_the_entry_point
        claim_type: side_effect_execution
        grounds:
          - state_machines.Sample.transitions.IN_TRANSIT_to_INVALIDATED
          - state_machines.EntryPoint.transitions.any_state_to_SUSPENDED
          - global_constants.SUSPENSION_INVALIDATION_STREAK
          - global_constants.FIELD_BLANK_LIMIT_NG_PER_L
        distinguishing_aspect: "A counter side effect that only fires on its third execution: field blanks of exactly 2.00 ng/L invalidate on receipt each time, and the entry point stays in INITIAL after the first two and flips to SUSPENDED on the third."
        test_recipe:
          setup:
            - "Contaminant PFOA, one Laboratory with capacity 5, EntryPoint EPTDS-01 in INITIAL."
