          - calculations.metric_normalization
          - calculations.composite_prequalification_score
          - state_machines.Prequalification.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          The exact-equality boundary is exercised on BOTH branches of the same formula at once:
          in metric_normalization value == threshold is the crossover between the two piecewise
          branches (both branches evaluate to exactly 50.00 there), and in grading_decision the
          hard/soft comparisons against eff[m] are strict, so value == eff[m] is not a deficiency.
