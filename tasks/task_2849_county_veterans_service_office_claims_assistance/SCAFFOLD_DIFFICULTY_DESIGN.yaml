          The reporting window is a CLOSED calendar interval and the empty input set is scored, not
          rejected: a claim filed on 2026-04-01 sits exactly one day past the 2026Q1 right endpoint of
          2026-03-31, so the 2026Q1 report computes filed_claim_count 0 and performance_score
          EMPTY_SET_SCORE 0.0 with retro_dollars_cents 0, while the 2026Q2 report over the very same row
