              payload: { expected_certification_version: "${c1_ver}" }
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "POST /cpo/listings"
              payload: { certification_id: "${c1}", channel: "OEM_SITE", price_cents: 2450000, disclosure_fields: ["CERTIFIED_BADGE", "WARRANTY_END_DATE", "INSPECTION_DATE", "CERTIFICATION_NUMBER"] }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { l_oem: $.data.id }
            - call: "POST /cpo/listings/${l_oem}/syndicate"
              payload: { expected_certification_version: "${c1_ver}" }
              as: DealerPrincipal
              as_user_id: "${d1}"
          assert:
            - "trigger call 1 returns 403 ERR_DEALER_PRIVILEGE_SUSPENDED and Vehicle.${v2}.cpo_state stays NOT_CERTIFIED"
            - "trigger call 3 returns 403 ERR_DEALER_PRIVILEGE_SUSPENDED, Dealer.${d1}.lifetime_submitted_count stays 0 and Vehicle.${v1}.active_certification_count stays 0"
            - "after trigger call 4: Dealer.${d1}.privilege_status == PROBATION with privilege_reason ADMIN_ACTION"
            - "trigger call 5 returns 201 with status SUBMITTED: the byte-identical body that was refused at call 3 now succeeds, and ${v1_ver} is still the vehicle's current version because the refused call bumped nothing"
            - "trigger call 6 returns 200 with Certification.${c1}.status == ACTIVE and fee_charged_cents == 120400: approval tolerates PROBATION"
            - "trigger call 7 returns 201: a PROBATION dealer may draft a THIRD_PARTY_AGGREGATOR listing"
            - "trigger call 9 returns 422 ERR_MARKETING_STANDARD_VIOLATION and Listing.${l_agg}.status stays DRAFT: publishing to an aggregator demands privilege_status ACTIVE"
            - "trigger call 11 returns 200 with Listing.${l_oem}.status == SYNDICATED: the identical disclosure set on OEM_SITE is acceptable for a PROBATION dealer"

  - rule_id: resource_temporal_overlap
    instances:
      - name: technician_buffered_slot_adjacency_forbidden
        grounds:
          - calculations.technician_slot_overlap
          - validations[priority=28]
          - errors.ERR_TECHNICIAN_SLOT_CONFLICT
          - entities.ProgramConfig.fields.technician_buffer_minutes
          - entities.ProgramConfig.fields.inspection_slot_minutes
          - entities.Inspection.fields.slot_end_at
        distinguishing_aspect: |
          The buffered interval is probed on both sides at one-minute resolution against the same
          09:00 inspection ([08:30, 11:30] after buffering): 12:00 touches from above and is refused,
          12:01 is accepted, 06:00 touches from below and is refused, 05:59 is accepted. Because both
          ends are closed, the two rejections are exact-instant contacts rather than overlaps — the
          opposite convention from the vehicle coverage intervals.
        test_recipe:
          setup:
            - "One dealer, one technician T1, the published MPI-172 template, three eligible vehicles."
            - "Default ProgramConfig: inspection_slot_minutes 120, technician_buffer_minutes 30."
            - "An accepted inspection on V1 at 2026-07-31T09:00:00Z occupies the buffered closed slot [08:30, 11:30]."
