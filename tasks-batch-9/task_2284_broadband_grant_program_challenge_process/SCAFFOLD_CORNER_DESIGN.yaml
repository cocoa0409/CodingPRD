          A freshly obligated award with no environmental review and no children shows that existence
          checks at priorities 25-28 outrank the award-state gate at priority 45: an unknown
          milestoneId or auditId reports NOT_FOUND even though the OBLIGATED award would also have
          refused the operation, a determination on a review that was never opened reports
