        grounds:
          - errors[ERR_SLICER_WINDOW_CONFLICT]
          - validations[priority=13]
          - state_machines.SlicerAsset.NEEDS_SANITATION_to_SANITIZING
          - calculations.sanitation_cycle_due
        distinguishing_aspect: "Slicer occupancy uses half-open [start, becomed usable) intervals with NO buffer, so an abutting commit whose start equals the previous interval's exclusive end is accepted while a one-minute overlap is rejected — the interval arithmetic is adjacency-permitting and the two artifacts are slicer windows, not 15-minute pickup buckets."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T06:00:00Z. Store S3 has a 300 lb case capacity. Associates A1 (DELI_CLERK, ACTIVE SLICER_OPERATION and FOOD_HANDLING) and A3 exist; items J2 (case_life 180) and J1 exist."
