scaffold_corner_design:

  # =================================================================
  # Section: entities
  # =================================================================
  - section: entities
    instances:
      - name: create_issuer_returns_201_with_onboarding_status
        claim_type: Creation
        grounds: [entities.Issuer.fields.status, endpoints]
        distinguishing_aspect: "POST /issuers with all required fields -> 201, status==ONBOARDING, server-minted id present."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /issuers"
              payload: { legal_name: "Fresh Co", ein: "200000001", home_state_code: "DE", entity_type: "C_CORP" }
              as: Anonymous
              captures: { iss_id: $.data.id, st: $.data.status }
          assert:
            - "response.http_status == 201"
            - "Issuer.${iss_id}.status == ONBOARDING"
            - "Issuer.${iss_id}.bad_actor_flag == false"

      - name: create_investor_computes_annual_limit_default_unaccredited
        claim_type: Computed Fields
        grounds: [entities.Investor.fields.annual_limit_cents, entities.Investor.fields.accreditation_status]
        distinguishing_aspect: "POST /investors with income 10,000,000c / net worth 10,000,000c -> annual_limit_cents==500000, accreditation_status==UNACCREDITED."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /investors"
              payload: { email: "comp@inv.com", legal_name: "Comp Inv", annual_income_cents: 10000000, net_worth_cents: 10000000 }
              as: Anonymous
              captures: { inv_id: $.data.id, lim: $.data.annual_limit_cents, acc: $.data.accreditation_status }
          assert:
            - "Investor.${inv_id}.annual_limit_cents == 500000"
            - "Investor.${inv_id}.accreditation_status == UNACCREDITED"

      - name: get_offering_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /offerings/{random-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /offerings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_offering_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /offerings omitting min_target_cents -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Verified issuer exists."]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { legal_name: "Mr Co", ein: "200000002", home_state_code: "DE", entity_type: "C_CORP" }
              as: Anonymous
              captures: { iss_id: $.data.id }
          trigger:
            - call: "POST /offerings"
              payload: { issuer_id: "${iss_id}", regulation: "REG_CF", security_type: "SAFE", max_target_cents: 1000000, deadline_at: "2026-12-01T00:00:00Z" }
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_offering_system_fields_input_ignored
        claim_type: System Fields
        grounds: [entities.Offering.fields.status, entities.Offering.fields.committed_amount_cents]
        distinguishing_aspect: "POST /offerings -> status forced to DRAFT and committed_amount_cents to 0 regardless of input; id/created_at/version system-minted."
        test_recipe:
          setup: ["Verified issuer exists."]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { legal_name: "Sf Co", ein: "200000003", home_state_code: "DE", entity_type: "C_CORP" }
              as: Anonymous
              captures: { iss_id: $.data.id }
          trigger:
            - call: "POST /offerings"
              payload: { issuer_id: "${iss_id}", regulation: "REG_CF", security_type: "SAFE", min_target_cents: 100000, max_target_cents: 1000000, deadline_at: "2026-12-01T00:00:00Z" }
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { off_id: $.data.id, st: $.data.status, v: $.data.version }
          assert:
            - "Offering.${off_id}.status == DRAFT"
            - "Offering.${off_id}.form_c_status == DRAFT"
            - "Offering.${off_id}.committed_amount_cents == 0"
            - "Offering.${off_id}.version == 1"

      - name: create_offering_invalid_terms_equity_missing_price
        claim_type: Type Constraints
        grounds: ["validations[priority=15]", "errors[ERR_INVALID_OFFERING_TERMS]"]
        distinguishing_aspect: "EQUITY offering with no price_per_security_cents -> ERR_INVALID_OFFERING_TERMS (422)."
        test_recipe:
          setup: ["Verified issuer exists."]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { legal_name: "Eqt Co", ein: "200000004", home_state_code: "DE", entity_type: "C_CORP" }
              as: Anonymous
              captures: { iss_id: $.data.id }
          trigger:
            - call: "POST /offerings"
              payload: { issuer_id: "${iss_id}", regulation: "REG_CF", security_type: "EQUITY", min_target_cents: 100000, max_target_cents: 1000000, deadline_at: "2026-12-01T00:00:00Z" }
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 422"
            - "response.data.error_id == ERR_INVALID_OFFERING_TERMS"

      - name: captable_entry_is_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.CapTableEntry]
        distinguishing_aspect: "CapTableEntry has common_fields:false — no version field, no update endpoint; only id and created_at as system fields."
        test_recipe:
          setup: ["A FUNDED SAFE offering minted exactly one CapTableEntry (single 200,000c accredited commit, min 100,000c)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /issuers"
              payload: { legal_name: "Im Co", ein: "200000005", home_state_code: "DE", entity_type: "C_CORP" }
              as: Anonymous
              captures: { iss_id: $.data.id }
            - call: "POST /issuers/${iss_id}/verify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /investors"
              payload: { email: "im@inv.com", legal_name: "Im Inv", annual_income_cents: 100000000, net_worth_cents: 100000000 }
              as: Anonymous
              captures: { inv_id: $.data.id }
            - call: "POST /accreditation-requests"
              payload: { investor_id: "${inv_id}", method: "INCOME" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { req: $.data.id }
            - call: "POST /accreditation-requests/${req}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /offerings"
              payload: { issuer_id: "${iss_id}", regulation: "REG_CF", security_type: "SAFE", min_target_cents: 100000, max_target_cents: 1000000, deadline_at: "2026-12-01T00:00:00Z" }
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { off_id: $.data.id }
            - call: "POST /offerings/${off_id}/form-c/submit"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
            - call: "POST /offerings/${off_id}/form-c/qualify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /offerings/${off_id}/go-live"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { v0: $.data.version }
            - call: "POST /investments"
              payload: { offering_id: "${off_id}", investor_id: "${inv_id}", amount_cents: 200000, expected_offering_version: "${v0}" }
              as: Investor
              as_user_id: "${inv_id}"
            - call: "POST /offerings/${off_id}/close"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
          trigger:
            - call: "GET /offerings/${off_id}/cap-table"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
          assert:
            - "GET /offerings/${off_id}/cap-table returns total_count == 1"
            - "CapTableEntry[0].instrument == SAFE"
            - "CapTableEntry[0].principal_cents == 200000"
            - "CapTableEntry[0].quantity == null"

  # =================================================================
  # Section: state_machines
  # =================================================================
  - section: state_machines
    instances:
      - name: verify_issuer_twice_second_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Issuer.ONBOARDING_to_VERIFIED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second POST /issuers/{id}/verify on an already-VERIFIED issuer -> ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["Issuer VERIFIED."]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { legal_name: "Idv Co", ein: "200000006", home_state_code: "DE", entity_type: "C_CORP" }
              as: Anonymous
              captures: { iss_id: $.data.id }
            - call: "POST /issuers/${iss_id}/verify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /issuers/${iss_id}/verify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Issuer.${iss_id}.status == VERIFIED"

      - name: golive_from_draft_without_qualified_form_c_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Offering.DRAFT_to_LIVE, entities.Offering.fields.form_c_status, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /go-live while form_c_status==DRAFT (never submitted) -> ERR_INVALID_STATE (409); offering stays DRAFT."
        test_recipe:
          setup: ["Verified issuer; offering created, Form C still DRAFT (not submitted)."]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { legal_name: "Gd Co", ein: "200000007", home_state_code: "DE", entity_type: "C_CORP" }
              as: Anonymous
              captures: { iss_id: $.data.id }
            - call: "POST /issuers/${iss_id}/verify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /offerings"
              payload: { issuer_id: "${iss_id}", regulation: "REG_CF", security_type: "SAFE", min_target_cents: 100000, max_target_cents: 1000000, deadline_at: "2026-12-01T00:00:00Z" }
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { off_id: $.data.id }
          trigger:
            - call: "POST /offerings/${off_id}/go-live"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Offering.${off_id}.status == DRAFT"

      - name: cancel_terminal_funded_offering_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Offering.LIVE_to_FUNDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /cancel on a FUNDED (terminal) offering -> ERR_INVALID_STATE (409); cancel is only defined from DRAFT/LIVE."
        test_recipe:
          setup: ["A FUNDED SAFE offering (200,000c accredited commit, min 100,000c, closed)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /issuers"
              payload: { legal_name: "Tl Co", ein: "200000008", home_state_code: "DE", entity_type: "C_CORP" }
              as: Anonymous
              captures: { iss_id: $.data.id }
            - call: "POST /issuers/${iss_id}/verify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /investors"
              payload: { email: "tl@inv.com", legal_name: "Tl Inv", annual_income_cents: 100000000, net_worth_cents: 100000000 }
              as: Anonymous
              captures: { inv_id: $.data.id }
            - call: "POST /accreditation-requests"
              payload: { investor_id: "${inv_id}", method: "INCOME" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { req: $.data.id }
            - call: "POST /accreditation-requests/${req}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /offerings"
              payload: { issuer_id: "${iss_id}", regulation: "REG_CF", security_type: "SAFE", min_target_cents: 100000, max_target_cents: 1000000, deadline_at: "2026-12-01T00:00:00Z" }
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { off_id: $.data.id }
            - call: "POST /offerings/${off_id}/form-c/submit"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
            - call: "POST /offerings/${off_id}/form-c/qualify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /offerings/${off_id}/go-live"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { v0: $.data.version }
            - call: "POST /investments"
              payload: { offering_id: "${off_id}", investor_id: "${inv_id}", amount_cents: 200000, expected_offering_version: "${v0}" }
              as: Investor
              as_user_id: "${inv_id}"
            - call: "POST /offerings/${off_id}/close"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
          trigger:
            - call: "POST /offerings/${off_id}/cancel"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Offering.${off_id}.status == FUNDED"

      - name: reconfirm_not_required_investment_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Investment.COMMITTED_to_RECONFIRMED, entities.Investment.fields.reconfirm_required, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /investments/{id}/reconfirm on a COMMITTED investment whose reconfirm_required==false (no amendment fired) -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Verified issuer; LIVE SAFE offering; one accredited 300,000c COMMITTED investment, never amended (reconfirm_required==false)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /issuers"
              payload: { legal_name: "Rc Co", ein: "200000009", home_state_code: "DE", entity_type: "C_CORP" }
              as: Anonymous
              captures: { iss_id: $.data.id }
            - call: "POST /issuers/${iss_id}/verify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /investors"
              payload: { email: "rc@inv.com", legal_name: "Rc Inv", annual_income_cents: 100000000, net_worth_cents: 100000000 }
              as: Anonymous
              captures: { inv_id: $.data.id }
            - call: "POST /accreditation-requests"
              payload: { investor_id: "${inv_id}", method: "INCOME" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { req: $.data.id }
            - call: "POST /accreditation-requests/${req}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /offerings"
              payload: { issuer_id: "${iss_id}", regulation: "REG_CF", security_type: "SAFE", min_target_cents: 100000, max_target_cents: 1000000, deadline_at: "2026-12-01T00:00:00Z" }
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { off_id: $.data.id }
            - call: "POST /offerings/${off_id}/form-c/submit"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
            - call: "POST /offerings/${off_id}/form-c/qualify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /offerings/${off_id}/go-live"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { v0: $.data.version }
            - call: "POST /investments"
              payload: { offering_id: "${off_id}", investor_id: "${inv_id}", amount_cents: 300000, expected_offering_version: "${v0}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { my_inv_id: $.data.id }
          trigger:
            - call: "POST /investments/${my_inv_id}/reconfirm"
              payload: {}
              as: Investor
              as_user_id: "${inv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Investment.${my_inv_id}.status == COMMITTED"

      - name: publish_superseding_update_supersedes_prior_cascade
        claim_type: Cross-entity
        grounds: [state_machines.InvestorUpdate.DRAFT_to_PUBLISHED, state_machines.InvestorUpdate.PUBLISHED_to_SUPERSEDED, entities.InvestorUpdate.fields.supersedes_update_id]
        distinguishing_aspect: "Publishing an update with supersedes_update_id set drives the prior PUBLISHED update to SUPERSEDED (cascade); a corrective republish is exempt from the quiet period."
        test_recipe:
          setup: ["Verified issuer; LIVE SAFE offering; update U1 PUBLISHED at 2026-03-01; U2 drafted with supersedes_update_id=U1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /issuers"
              payload: { legal_name: "Su Co", ein: "200000010", home_state_code: "DE", entity_type: "C_CORP" }
              as: Anonymous
              captures: { iss_id: $.data.id }
            - call: "POST /issuers/${iss_id}/verify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /offerings"
              payload: { issuer_id: "${iss_id}", regulation: "REG_CF", security_type: "SAFE", min_target_cents: 100000, max_target_cents: 1000000, deadline_at: "2026-12-01T00:00:00Z" }
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { off_id: $.data.id }
            - call: "POST /offerings/${off_id}/form-c/submit"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
            - call: "POST /offerings/${off_id}/form-c/qualify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /offerings/${off_id}/go-live"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
            - call: "POST /investor-updates"
              payload: { offering_id: "${off_id}", title: "U1", body: "First" }
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { u1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /investor-updates/${u1_id}/publish"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
            - call: "POST /investor-updates"
              payload: { offering_id: "${off_id}", title: "U2 correction", body: "Corrected", supersedes_update_id: "${u1_id}" }
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { u2_id: $.data.id }
          trigger:
            - call: "POST /investor-updates/${u2_id}/publish"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { u2_status: $.data.status }
          assert:
            - "InvestorUpdate.${u2_id}.status == PUBLISHED"
            - "InvestorUpdate.${u1_id}.status == SUPERSEDED"

  # =================================================================
  # Section: calculations
  # =================================================================
  - section: calculations
    instances:
      - name: accredited_bypass_skips_annual_limit
        claim_type: Variant Selection
        grounds: [calculations.investor_trailing_12mo_committed, entities.Investor.fields.accreditation_status]
        distinguishing_aspect: "An ACCREDITED investor with low income commits 5,000,000c (far above the unaccredited limit) and succeeds — the accredited_bypass variant skips the limit entirely."
        test_recipe:
          setup: ["Verified issuer; LIVE SAFE offering (max 10,000,000c); investor with tiny income (limit would be $2,500) but APPROVED accreditation."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /issuers"
              payload: { legal_name: "Ab Co", ein: "200000011", home_state_code: "DE", entity_type: "C_CORP" }
              as: Anonymous
              captures: { iss_id: $.data.id }
            - call: "POST /issuers/${iss_id}/verify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /investors"
              payload: { email: "ab@inv.com", legal_name: "Ab Inv", annual_income_cents: 1000000, net_worth_cents: 1000000 }
              as: Anonymous
              captures: { inv_id: $.data.id }
            - call: "POST /accreditation-requests"
              payload: { investor_id: "${inv_id}", method: "THIRD_PARTY_LETTER" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { req: $.data.id }
            - call: "POST /accreditation-requests/${req}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /offerings"
              payload: { issuer_id: "${iss_id}", regulation: "REG_CF", security_type: "SAFE", min_target_cents: 100000, max_target_cents: 10000000, deadline_at: "2026-12-01T00:00:00Z" }
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { off_id: $.data.id }
            - call: "POST /offerings/${off_id}/form-c/submit"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
            - call: "POST /offerings/${off_id}/form-c/qualify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /offerings/${off_id}/go-live"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /investments"
              payload: { offering_id: "${off_id}", investor_id: "${inv_id}", amount_cents: 5000000, expected_offering_version: "${v0}" }
