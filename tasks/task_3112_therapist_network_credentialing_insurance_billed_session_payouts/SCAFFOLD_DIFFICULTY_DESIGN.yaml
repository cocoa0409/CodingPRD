  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: payer_suspension_cascades_three_hops_into_session_cancellation
        grounds:
          - state_machines.Payer.transitions.ACTIVE_to_SUSPENDED_AT_PAYER
          - state_machines.PayerEnrollment.transitions.EFFECTIVE_to_SUSPENDED
          - state_machines.Clinician.transitions.BILLABLE_to_FROZEN
          - state_machines.Session.transitions.REQUESTED_to_CANCELLED
          - calculations.clinician_billing_posture_derived
          - endpoints.PATCH_/network/payers/{id}
        distinguishing_aspect: "A three-hop transitive cascade: suspending the Payer mutates each EFFECTIVE enrollment, that enrollment mutation itself re-derives the clinician's posture to FROZEN, and that posture mutation alone cancels the clinician's open sessions — the session cancellation is caused by hop two, not by the PATCH."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z, then 2026-06-20T00:00:00Z."
            - "Payer SOLO is ACTIVE. Clinician Dana Reyes has exactly one EFFECTIVE enrollment, with SOLO, and no other enrollment, so enrolled_payer_count is 1."
            - "Clinician is BILLABLE and ACTIVE, with a Tuesday 08:00-18:00 UTC availability block."
            - "Patient Priya Anand is registered with payer SOLO and has a VERIFIED benefit snapshot."
            - "The clinician holds three 60-minute sessions: s1 on 2026-06-23T14:00:00Z SCHEDULED, s2 on 2026-06-30T14:00:00Z SCHEDULED, and s3 on 2026-06-16T14:00:00Z COMPLETED with billing_state UNBILLED, so open_slot_count is 600 - 180 = 420."
