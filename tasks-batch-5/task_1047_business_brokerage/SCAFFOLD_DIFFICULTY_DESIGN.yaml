# =============================================================================
# task_1047 — Business Brokerage & Main-Street M&A — §1.8 Difficulty Design
# Test Targeting Index: 9 Difficulty Rules x 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: valuation_sde_multiple_vs_asset_based
        grounds:
          - calculations.cim_recommended_price
          - entities.CIM.fields.recommended_price_cents
          - state_machines.CIM.DRAFT_to_PUBLISHED
        distinguishing_aspect: |
          Same Listing inputs, two CIM valuation_method values yield different
          recommended_price_cents: SDE_MULTIPLE = annual_sde*multiple (120000000)
          vs ASSET_BASED = ffe+inventory (30000000). Divergence lives on the CIM
          entity domain (valuation), distinct from the commission dual-variant.
        test_recipe:
          setup:
            - "Broker + Seller onboarded; one Listing with annual_sde_cents=40000000, industry_multiple=3.0, ffe_value_cents=20000000, inventory_value_cents=10000000; two CIMs on it."
          setup_api_calls:
            - call: "POST /brokerage/brokers"
              payload: { firm_name: "Main St M&A", license_number: "BRK-1" }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /brokerage/sellers"
              payload: { full_name: "Sam Seller", email: "s@x.com" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /brokerage/listings"
              payload: { seller_id: "${seller_id}", business_name: "Corner Diner", industry_code: "722511", annual_sde_cents: 40000000, annual_revenue_cents: 150000000, ffe_value_cents: 20000000, inventory_value_cents: 10000000, industry_multiple: 3.0, asking_price_cents: 120000000, exclusive_start_date: "2026-01-01", exclusive_end_date: "2026-12-31" }
              as: Broker
              as_user_id: "${broker_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /brokerage/listings/${listing_id}/cims"
              payload: { valuation_method: "SDE_MULTIPLE" }
              as: Broker
              as_user_id: "${broker_id}"
              captures: { cim_sde_id: $.data.id }
            - call: "POST /brokerage/listings/${listing_id}/cims"
              payload: { valuation_method: "ASSET_BASED" }
              as: Broker
              as_user_id: "${broker_id}"
              captures: { cim_asset_id: $.data.id }
          trigger:
            - call: "POST /brokerage/cims/${cim_sde_id}/publish"
              payload: {}
              as: Broker
              as_user_id: "${broker_id}"
              captures: { sde_price: $.data.recommended_price_cents }
            - call: "POST /brokerage/cims/${cim_asset_id}/publish"
              payload: {}
              as: Broker
              as_user_id: "${broker_id}"
              captures: { asset_price: $.data.recommended_price_cents }
          assert:
            - "CIM.${cim_sde_id}.recommended_price_cents == 120000000"
            - "CIM.${cim_asset_id}.recommended_price_cents == 30000000"
            - "CIM.${cim_sde_id}.recommended_price_cents != CIM.${cim_asset_id}.recommended_price_cents"

      - name: commission_provisional_at_accept_vs_final_at_close
        grounds:
          - calculations.broker_commission
          - entities.Deal.fields.provisional_commission_cents
          - entities.Deal.fields.final_commission_cents
          - state_machines.Deal.IN_ESCROW_to_CLOSED
        distinguishing_aspect: |
          Provisional commission is Lehman(accepted LOI price 115000000)=5600000 at
          LOI accept; final commission is Lehman(escrow closing price 110000000)=5400000
          at close. Same ladder, different base, different result — on the Deal domain,
          distinct from the CIM valuation dual-variant.
        test_recipe:
          setup:
            - "Full pipeline to CLOSED: listing asking 120000000; LOI accepted at 115000000; escrow closing_price 110000000 (re-traded down)."
          setup_api_calls:
            - call: "POST /brokerage/brokers"
              payload: { firm_name: "Main St M&A", license_number: "BRK-1" }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /brokerage/sellers"
              payload: { full_name: "Sam Seller", email: "s@x.com" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /brokerage/buyers"
              payload: { full_name: "Bea Buyer", email: "b@x.com", proof_of_funds_cents: 30000000, net_worth_cents: 150000000 }
              as: PlatformAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /brokerage/listings"
              payload: { seller_id: "${seller_id}", business_name: "Corner Diner", industry_code: "722511", annual_sde_cents: 40000000, annual_revenue_cents: 150000000, ffe_value_cents: 20000000, inventory_value_cents: 10000000, industry_multiple: 3.0, asking_price_cents: 120000000, exclusive_start_date: "2026-01-01", exclusive_end_date: "2026-12-31" }
              as: Broker
              as_user_id: "${broker_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /brokerage/listings/${listing_id}/cims"
              payload: { valuation_method: "SDE_MULTIPLE" }
              as: Broker
              as_user_id: "${broker_id}"
              captures: { cim_id: $.data.id }
            - call: "POST /brokerage/cims/${cim_id}/publish"
              payload: {}
              as: Broker
              as_user_id: "${broker_id}"
            - call: "POST /brokerage/listings/${listing_id}/activate"
              payload: {}
              as: Broker
              as_user_id: "${broker_id}"
            - call: "POST /brokerage/listings/${listing_id}/ndas"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
            - call: "POST /brokerage/deals"
              payload: { listing_id: "${listing_id}", buyer_id: "${buyer_id}" }
              as: Broker
              as_user_id: "${broker_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /brokerage/deals/${deal_id}/qualify"
              payload: {}
              as: Broker
              as_user_id: "${broker_id}"
              captures: { deal_v: $.data.version }
            - call: "POST /brokerage/deals/${deal_id}/lois"
              payload: { offer_price_cents: 115000000, earnest_deposit_cents: 5000000, earnout_amount_cents: 30000000, earnout_periods: 3, financing_contingency: true, expected_deal_version: "${deal_v}" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { loi_id: $.data.id }
            - call: "POST /brokerage/lois/${loi_id}/accept"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /brokerage/listings/${listing_id}/documents"
              payload: { title: "P&L 2025", doc_type: "FINANCIALS" }
              as: Broker
              as_user_id: "${broker_id}"
            - call: "POST /brokerage/deals/${deal_id}/open-diligence"
              payload: {}
              as: Broker
              as_user_id: "${broker_id}"
            - call: "POST /brokerage/deals/${deal_id}/enter-financing"
              payload: {}
              as: Broker
              as_user_id: "${broker_id}"
            - call: "POST /brokerage/deals/${deal_id}/loan-applications"
              payload: { requested_amount_cents: 99000000 }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { loan_id: $.data.id }
            - call: "POST /brokerage/loan-applications/${loan_id}/decision"
              payload: { outcome: "APPROVED" }
              as: Lender
            - call: "POST /brokerage/deals/${deal_id}/escrow"
              payload: { closing_price_cents: 110000000, required_deposit_cents: 5000000 }
              as: EscrowAgent
              captures: { escrow_id: $.data.id }
            - call: "POST /brokerage/escrow-accounts/${escrow_id}/deposit"
              payload: { amount_cents: 5000000 }
              as: Buyer
              as_user_id: "${buyer_id}"
          trigger:
            - call: "POST /brokerage/escrow-accounts/${escrow_id}/close"
              payload: {}
              as: EscrowAgent
          assert:
            - "Deal.${deal_id}.provisional_commission_cents == 5600000"
            - "Deal.${deal_id}.final_commission_cents == 5400000"
            - "Deal.${deal_id}.provisional_commission_cents != Deal.${deal_id}.final_commission_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: commission_lehman_marginal_ladder
        grounds:
          - calculations.broker_commission
          - entities.Deal.fields.provisional_commission_cents
          - state_machines.LOI.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear tiered-rate formula. Accepted price
          250000000 spans three marginal tranches (100M@5% + 100M@4% + 50M@3%)
          = 10500000, not a flat percentage. Marginal-rate selection, not average.
        test_recipe:
          setup:
            - "Listing asking 250000000; buyer with capacity >= 250M; LOI accepted at 250000000."
          setup_api_calls:
            - call: "POST /brokerage/brokers"
              payload: { firm_name: "Main St M&A", license_number: "BRK-1" }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /brokerage/sellers"
              payload: { full_name: "Sam Seller", email: "s@x.com" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /brokerage/buyers"
              payload: { full_name: "Bea Buyer", email: "b@x.com", proof_of_funds_cents: 40000000, net_worth_cents: 200000000 }
              as: PlatformAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /brokerage/listings"
              payload: { seller_id: "${seller_id}", business_name: "Big Shop", industry_code: "44", annual_sde_cents: 80000000, annual_revenue_cents: 400000000, ffe_value_cents: 50000000, inventory_value_cents: 20000000, industry_multiple: 3.0, asking_price_cents: 250000000, exclusive_start_date: "2026-01-01", exclusive_end_date: "2026-12-31" }
              as: Broker
              as_user_id: "${broker_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /brokerage/listings/${listing_id}/cims"
              payload: { valuation_method: "SDE_MULTIPLE" }
              as: Broker
              as_user_id: "${broker_id}"
              captures: { cim_id: $.data.id }
            - call: "POST /brokerage/cims/${cim_id}/publish"
              payload: {}
              as: Broker
              as_user_id: "${broker_id}"
            - call: "POST /brokerage/listings/${listing_id}/activate"
              payload: {}
              as: Broker
              as_user_id: "${broker_id}"
            - call: "POST /brokerage/listings/${listing_id}/ndas"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
            - call: "POST /brokerage/deals"
              payload: { listing_id: "${listing_id}", buyer_id: "${buyer_id}" }
              as: Broker
              as_user_id: "${broker_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /brokerage/deals/${deal_id}/qualify"
              payload: {}
              as: Broker
              as_user_id: "${broker_id}"
              captures: { deal_v: $.data.version }
            - call: "POST /brokerage/deals/${deal_id}/lois"
              payload: { offer_price_cents: 250000000, earnest_deposit_cents: 10000000, earnout_amount_cents: 0, earnout_periods: 1, financing_contingency: true, expected_deal_version: "${deal_v}" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { loi_id: $.data.id }
          trigger:
            - call: "POST /brokerage/lois/${loi_id}/accept"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
          assert:
            - "Deal.${deal_id}.provisional_commission_cents == 10500000"

      - name: earnout_round_per_period_then_sum
        grounds:
          - calculations.earnout_period_payment
          - entities.Deal.fields.earnout_paid_cents
          - state_machines.EscrowAccount.FUNDED_to_CLOSED
        distinguishing_aspect: |
          Mode (b): nested rounding whose ORDER matters. earnout_total=10000000 over
          3 periods at performance 1.0 rounds per period to 3333333 (round_half_up),
          so one recorded period yields earnout_paid_cents=3333333 and three would
          sum to 9999999 — not round(10000000/1)=10000000 (sum-then-round).
        test_recipe:
          setup:
            - "Deal CLOSED with earnout_total_cents=10000000, earnout_periods=3, earnout_baseline_sde_cents=40000000; record one period with actual_sde_cents=40000000 (perf 1.0)."
          setup_api_calls:
            - call: "POST /brokerage/brokers"
              payload: { firm_name: "Main St M&A", license_number: "BRK-1" }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /brokerage/sellers"
              payload: { full_name: "Sam Seller", email: "s@x.com" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /brokerage/buyers"
              payload: { full_name: "Bea Buyer", email: "b@x.com", proof_of_funds_cents: 30000000, net_worth_cents: 150000000 }
              as: PlatformAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /brokerage/listings"
              payload: { seller_id: "${seller_id}", business_name: "Corner Diner", industry_code: "722511", annual_sde_cents: 40000000, annual_revenue_cents: 150000000, ffe_value_cents: 20000000, inventory_value_cents: 10000000, industry_multiple: 3.0, asking_price_cents: 120000000, exclusive_start_date: "2026-01-01", exclusive_end_date: "2026-12-31" }
              as: Broker
              as_user_id: "${broker_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /brokerage/listings/${listing_id}/cims"
              payload: { valuation_method: "SDE_MULTIPLE" }
              as: Broker
              as_user_id: "${broker_id}"
              captures: { cim_id: $.data.id }
            - call: "POST /brokerage/cims/${cim_id}/publish"
              payload: {}
              as: Broker
              as_user_id: "${broker_id}"
            - call: "POST /brokerage/listings/${listing_id}/activate"
              payload: {}
              as: Broker
              as_user_id: "${broker_id}"
            - call: "POST /brokerage/listings/${listing_id}/ndas"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
            - call: "POST /brokerage/deals"
              payload: { listing_id: "${listing_id}", buyer_id: "${buyer_id}" }
              as: Broker
              as_user_id: "${broker_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /brokerage/deals/${deal_id}/qualify"
              payload: {}
              as: Broker
              as_user_id: "${broker_id}"
              captures: { deal_v: $.data.version }
            - call: "POST /brokerage/deals/${deal_id}/lois"
              payload: { offer_price_cents: 115000000, earnest_deposit_cents: 5000000, earnout_amount_cents: 10000000, earnout_periods: 3, financing_contingency: true, expected_deal_version: "${deal_v}" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { loi_id: $.data.id }
            - call: "POST /brokerage/lois/${loi_id}/accept"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /brokerage/listings/${listing_id}/documents"
              payload: { title: "P&L 2025", doc_type: "FINANCIALS" }
              as: Broker
              as_user_id: "${broker_id}"
            - call: "POST /brokerage/deals/${deal_id}/open-diligence"
              payload: {}
              as: Broker
              as_user_id: "${broker_id}"
            - call: "POST /brokerage/deals/${deal_id}/enter-financing"
              payload: {}
              as: Broker
              as_user_id: "${broker_id}"
            - call: "POST /brokerage/deals/${deal_id}/loan-applications"
              payload: { requested_amount_cents: 99000000 }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { loan_id: $.data.id }
            - call: "POST /brokerage/loan-applications/${loan_id}/decision"
              payload: { outcome: "APPROVED" }
              as: Lender
            - call: "POST /brokerage/deals/${deal_id}/escrow"
              payload: { closing_price_cents: 110000000, required_deposit_cents: 5000000 }
              as: EscrowAgent
              captures: { escrow_id: $.data.id }
            - call: "POST /brokerage/escrow-accounts/${escrow_id}/deposit"
              payload: { amount_cents: 5000000 }
              as: Buyer
              as_user_id: "${buyer_id}"
            - call: "POST /brokerage/escrow-accounts/${escrow_id}/close"
              payload: {}
              as: EscrowAgent
          trigger:
            - call: "POST /brokerage/deals/${deal_id}/record-earnout-period"
              payload: { actual_sde_cents: 40000000 }
              as: Broker
              as_user_id: "${broker_id}"
          assert:
            - "Deal.${deal_id}.earnout_paid_cents == 3333333"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: loi_negotiation_counter_revise_cycle
        grounds:
          - state_machines.LOI.SUBMITTED_to_COUNTERED
          - state_machines.LOI.COUNTERED_to_SUBMITTED
          - entities.LOI.fields.round_number
        distinguishing_aspect: |
          LOI is cyclic: SUBMITTED->COUNTERED->SUBMITTED returns to a prior state
          (round_number 1->2->3, status back to SUBMITTED). This loop lives on the
          LOI entity, distinct from the SBALoanApplication branch below.
        test_recipe:
          setup:
            - "A QUALIFIED deal with a SUBMITTED LOI; seller counters; buyer revises."
          setup_api_calls:
            - call: "POST /brokerage/brokers"
              payload: { firm_name: "Main St M&A", license_number: "BRK-1" }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /brokerage/sellers"
              payload: { full_name: "Sam Seller", email: "s@x.com" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /brokerage/buyers"
              payload: { full_name: "Bea Buyer", email: "b@x.com", proof_of_funds_cents: 30000000, net_worth_cents: 150000000 }
              as: PlatformAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /brokerage/listings"
              payload: { seller_id: "${seller_id}", business_name: "Corner Diner", industry_code: "722511", annual_sde_cents: 40000000, annual_revenue_cents: 150000000, ffe_value_cents: 20000000, inventory_value_cents: 10000000, industry_multiple: 3.0, asking_price_cents: 120000000, exclusive_start_date: "2026-01-01", exclusive_end_date: "2026-12-31" }
              as: Broker
              as_user_id: "${broker_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /brokerage/listings/${listing_id}/cims"
              payload: { valuation_method: "SDE_MULTIPLE" }
              as: Broker
              as_user_id: "${broker_id}"
              captures: { cim_id: $.data.id }
            - call: "POST /brokerage/cims/${cim_id}/publish"
              payload: {}
              as: Broker
              as_user_id: "${broker_id}"
            - call: "POST /brokerage/listings/${listing_id}/activate"
              payload: {}
              as: Broker
              as_user_id: "${broker_id}"
            - call: "POST /brokerage/listings/${listing_id}/ndas"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
            - call: "POST /brokerage/deals"
              payload: { listing_id: "${listing_id}", buyer_id: "${buyer_id}" }
              as: Broker
              as_user_id: "${broker_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /brokerage/deals/${deal_id}/qualify"
              payload: {}
              as: Broker
              as_user_id: "${broker_id}"
              captures: { deal_v: $.data.version }
            - call: "POST /brokerage/deals/${deal_id}/lois"
              payload: { offer_price_cents: 110000000, earnest_deposit_cents: 5000000, earnout_amount_cents: 0, earnout_periods: 1, financing_contingency: true, expected_deal_version: "${deal_v}" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { loi_id: $.data.id }
            - call: "POST /brokerage/lois/${loi_id}/counter"
              payload: { counter_price_cents: 118000000 }
              as: Seller
              as_user_id: "${seller_id}"
          trigger:
            - call: "POST /brokerage/lois/${loi_id}/revise"
              payload: { offer_price_cents: 115000000, earnest_deposit_cents: 5000000 }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { loi_round: $.data.round_number, loi_status: $.data.status }
          assert:
            - "LOI.${loi_id}.status == SUBMITTED"
            - "LOI.${loi_id}.round_number == 3"

      - name: loan_conditional_branch_then_finalize
        grounds:
          - state_machines.SBALoanApplication.SUBMITTED_to_CONDITIONALLY_APPROVED
          - state_machines.SBALoanApplication.CONDITIONALLY_APPROVED_to_APPROVED
          - entities.SBALoanApplication.fields.approved_amount_cents
        distinguishing_aspect: |
          SBALoanApplication branches SUBMITTED -> {APPROVED, CONDITIONALLY_APPROVED,
          DECLINED} with divergent side effects; CONDITIONALLY_APPROVED does NOT set
          the escrow-unlock and requires a second finalize step to reach APPROVED.
          Branch shape on the loan entity, distinct from the LOI cycle.
        test_recipe:
          setup:
            - "A deal in FINANCING with a SUBMITTED loan application."
          setup_api_calls:
            - call: "POST /brokerage/brokers"
              payload: { firm_name: "Main St M&A", license_number: "BRK-1" }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /brokerage/sellers"
              payload: { full_name: "Sam Seller", email: "s@x.com" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /brokerage/buyers"
              payload: { full_name: "Bea Buyer", email: "b@x.com", proof_of_funds_cents: 30000000, net_worth_cents: 150000000 }
              as: PlatformAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /brokerage/listings"
              payload: { seller_id: "${seller_id}", business_name: "Corner Diner", industry_code: "722511", annual_sde_cents: 40000000, annual_revenue_cents: 150000000, ffe_value_cents: 20000000, inventory_value_cents: 10000000, industry_multiple: 3.0, asking_price_cents: 120000000, exclusive_start_date: "2026-01-01", exclusive_end_date: "2026-12-31" }
              as: Broker
              as_user_id: "${broker_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /brokerage/listings/${listing_id}/cims"
              payload: { valuation_method: "SDE_MULTIPLE" }
              as: Broker
              as_user_id: "${broker_id}"
              captures: { cim_id: $.data.id }
            - call: "POST /brokerage/cims/${cim_id}/publish"
              payload: {}
              as: Broker
              as_user_id: "${broker_id}"
            - call: "POST /brokerage/listings/${listing_id}/activate"
              payload: {}
              as: Broker
              as_user_id: "${broker_id}"
            - call: "POST /brokerage/listings/${listing_id}/ndas"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
            - call: "POST /brokerage/deals"
              payload: { listing_id: "${listing_id}", buyer_id: "${buyer_id}" }
              as: Broker
