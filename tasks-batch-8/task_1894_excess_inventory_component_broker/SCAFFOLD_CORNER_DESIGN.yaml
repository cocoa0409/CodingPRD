scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: customer_default_urgency_tier_applied
        claim_type: defaults
        grounds: ["entities.Customer.fields.urgency_tier"]
        distinguishing_aspect: "Omitting urgency_tier at POST /customers stores STANDARD and a subsequent order prices with zero premium."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Default Dan", contact_email: "dan@x.com", credit_limit_cents: 50000 }
              as: BrokerOps
              captures: { cust_id: $.data.id, tier: $.data.urgency_tier }
          trigger:
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: BrokerOps
          assert:
            - "tier == STANDARD"
            - "Customer.${cust_id}.open_order_exposure_cents == 0"

      - name: seller_creation_returns_computed_zero_balances
        claim_type: creation
        grounds: ["entities.Seller.fields.account_balance_cents", "entities.Seller.fields.total_payouts_cents"]
        distinguishing_aspect: "POST /sellers returns 201 with account_balance_cents and total_payouts_cents both initialized to 0 by the system, not from input."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /sellers"
              payload: { name: "Init Ian", contact_email: "ian@x.com" }
              as: BrokerOps
              captures: { sid: $.data.id, bal: $.data.account_balance_cents, tot: $.data.total_payouts_cents }
          trigger:
            - call: "GET /sellers/${sid}"
              payload: {}
              as: FinanceAdmin
          assert:
            - "bal == 0 and tot == 0"
            - "Seller.${sid}.payout_terms_days == 30 (default applied)"

      - name: get_listing_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_LISTING_NOT_FOUND]"]
        distinguishing_aspect: "GET /listings/{id} with a well-formed but absent UUID returns ERR_LISTING_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /listings/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: BrokerOps
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_LISTING_NOT_FOUND"

      - name: buy_offer_missing_required_quantity_rejected
        claim_type: required_fields
        grounds: ["entities.BuyOffer.fields.quantity", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /buy-offers without quantity returns ERR_INVALID_REQUEST (400); seller_id, mpn, ask_price_per_unit_cents are likewise required."
        test_recipe:
          setup: ["one seller exists"]
          setup_api_calls:
            - call: "POST /sellers"
              payload: { name: "Req Rachel", contact_email: "rachel@x.com" }
              as: BrokerOps
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /buy-offers"
              payload: { seller_id: "${s_id}", mpn: "LM317T", ask_price_per_unit_cents: 5000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_REQUEST"

      - name: buy_offer_invalid_enum_acquisition_mode_rejected
        claim_type: type_constraints
        grounds: ["entities.BuyOffer.fields.acquisition_mode", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /buy-offers/{id}/accept with acquisition_mode 'LEASE' (not in {BROKER_OWNED, CONSIGNMENT}) returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["one PENDING_REVIEW offer"]
          setup_api_calls:
            - call: "POST /sellers"
              payload: { name: "Enum Erin", contact_email: "erin@x.com" }
              as: BrokerOps
              captures: { s_id: $.data.id }
            - call: "POST /buy-offers"
              payload: { seller_id: "${s_id}", mpn: "LM358", quantity: 5, ask_price_per_unit_cents: 3000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /buy-offers/${o_id}/accept"
              payload: { agreed_unit_price_cents: 3000, acquisition_mode: "LEASE" }
              as: BrokerOps
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_REQUEST"
            - "BuyOffer.${o_id}.status remains PENDING_REVIEW"

      - name: escrow_entry_is_immutable_append_only
        claim_type: immutability
        grounds: ["entities.EscrowEntry"]
        distinguishing_aspect: "EscrowEntry has common_fields: false (no version/updated_at) and the scaffold declares no PATCH/PUT/DELETE endpoint for it; only the sub-resource GET exists."
        test_recipe:
          setup: ["one order with a single deposit"]
          setup_api_calls:
            - call: "POST /sellers"
              payload: { name: "Imm Ivy", contact_email: "ivy@x.com" }
              as: BrokerOps
              captures: { s_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Imm Ivan", contact_email: "ivan@x.com", credit_limit_cents: 100000, urgency_tier: "STANDARD" }
              as: BrokerOps
              captures: { c_id: $.data.id }
            - call: "POST /storage-bins"
              payload: { bin_code: "BIN-IM1", capacity_units: 20 }
              as: BrokerOps
              captures: { b_id: $.data.id }
            - call: "POST /buy-offers"
              payload: { seller_id: "${s_id}", mpn: "BC547", quantity: 5, ask_price_per_unit_cents: 4000, provenance_doc_url: "https://docs.x.com/pi.pdf" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { o_id: $.data.id }
            - call: "POST /buy-offers/${o_id}/accept"
              payload: { agreed_unit_price_cents: 4000, acquisition_mode: "BROKER_OWNED" }
              as: BrokerOps
            - call: "POST /buy-offers/${o_id}/receive"
              payload: {}
              as: BrokerOps
            - call: "POST /buy-offers/${o_id}/inspect"
              payload: { outcome: "PASS" }
              as: Inspector
            - call: "POST /buy-offers/${o_id}/convert-to-lot"
              payload: { storage_bin_id: "${b_id}" }
              as: BrokerOps
              captures: { lot_id: $.data.id }
            - call: "POST /listings"
              payload: { lot_id: "${lot_id}", asking_price_per_unit_cents: 5000 }
              as: BrokerOps
              captures: { l_id: $.data.id }
            - call: "POST /listings/${l_id}/activate"
              payload: {}
              as: BrokerOps
            - call: "POST /sales-orders"
              payload: { customer_id: "${c_id}", listing_id: "${l_id}", quantity: 1 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /sales-orders/${ord_id}/escrow/deposit"
              payload: { amount_cents: 2500 }
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "GET /sales-orders/${ord_id}/escrow-entries"
              payload: {}
              as: FinanceAdmin
              captures: { e_amt: "$.data[0].amount_cents", e_type: "$.data[0].entry_type" }
          assert:
            - "e_type == DEPOSIT and e_amt == 2500"
            - "entry objects expose id and created_at but no version field (common_fields: false)"

      - name: lot_fk_reverse_reachable_from_bin_and_offer
        claim_type: parent_relationships
        grounds: ["entities.Lot.fields.buy_offer_id", "entities.Lot.fields.storage_bin_id"]
        distinguishing_aspect: "GET /lots filtered by buy_offer_id returns exactly the lot converted from that offer; filtering by storage_bin_id returns all lots in the bin."
        test_recipe:
          setup: ["one converted lot in bin BIN-FK1"]
          setup_api_calls:
            - call: "POST /sellers"
              payload: { name: "FK Fred", contact_email: "fred@x.com" }
              as: BrokerOps
              captures: { s_id: $.data.id }
            - call: "POST /storage-bins"
              payload: { bin_code: "BIN-FK1", capacity_units: 20 }
              as: BrokerOps
              captures: { b_id: $.data.id }
            - call: "POST /buy-offers"
              payload: { seller_id: "${s_id}", mpn: "NE555", quantity: 5, ask_price_per_unit_cents: 4000, provenance_doc_url: "https://docs.x.com/pfk.pdf" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { o_id: $.data.id }
            - call: "POST /buy-offers/${o_id}/accept"
              payload: { agreed_unit_price_cents: 4000, acquisition_mode: "BROKER_OWNED" }
              as: BrokerOps
            - call: "POST /buy-offers/${o_id}/receive"
              payload: {}
              as: BrokerOps
            - call: "POST /buy-offers/${o_id}/inspect"
              payload: { outcome: "PASS" }
              as: Inspector
            - call: "POST /buy-offers/${o_id}/convert-to-lot"
              payload: { storage_bin_id: "${b_id}" }
              as: BrokerOps
              captures: { lot_id: $.data.id }
          trigger:
            - call: "GET /lots"
              payload: { buy_offer_id: "${o_id}" }
              as: BrokerOps
            - call: "GET /lots"
              payload: { storage_bin_id: "${b_id}" }
              as: BrokerOps
          assert:
            - "filter by buy_offer_id returns exactly [${lot_id}]"
            - "filter by storage_bin_id returns exactly [${lot_id}]"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: buy_offer_rejected_is_terminal
        claim_type: terminal_lockdown
        grounds: ["state_machines.BuyOffer.PENDING_REVIEW_to_REJECTED"]
        distinguishing_aspect: "From REJECTED no further transition exists: accept on a rejected offer returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["one offer rejected"]
          setup_api_calls:
            - call: "POST /sellers"
              payload: { name: "Term Tina", contact_email: "tina@x.com" }
              as: BrokerOps
              captures: { s_id: $.data.id }
            - call: "POST /buy-offers"
              payload: { seller_id: "${s_id}", mpn: "LM358", quantity: 5, ask_price_per_unit_cents: 3000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { o_id: $.data.id }
            - call: "POST /buy-offers/${o_id}/reject"
              payload: {}
              as: BrokerOps
          trigger:
            - call: "POST /buy-offers/${o_id}/accept"
              payload: { agreed_unit_price_cents: 3000, acquisition_mode: "BROKER_OWNED" }
              as: BrokerOps
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE"

      - name: deposit_on_cancelled_order_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.SalesOrder.PENDING_ESCROW_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /sales-orders/{id}/escrow/deposit on a CANCELLED order is rejected with ERR_INVALID_STATE and creates no EscrowEntry."
        test_recipe:
          setup: ["one order cancelled from PENDING_ESCROW (no deposits)"]
          setup_api_calls:
            - call: "POST /sellers"
              payload: { name: "Inv Ian", contact_email: "iani@x.com" }
              as: BrokerOps
              captures: { s_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Inv Ivy", contact_email: "ivyi@x.com", credit_limit_cents: 100000, urgency_tier: "STANDARD" }
              as: BrokerOps
              captures: { c_id: $.data.id }
            - call: "POST /storage-bins"
              payload: { bin_code: "BIN-IV1", capacity_units: 20 }
              as: BrokerOps
              captures: { b_id: $.data.id }
            - call: "POST /buy-offers"
              payload: { seller_id: "${s_id}", mpn: "BC547", quantity: 5, ask_price_per_unit_cents: 4000, provenance_doc_url: "https://docs.x.com/piv.pdf" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { o_id: $.data.id }
            - call: "POST /buy-offers/${o_id}/accept"
              payload: { agreed_unit_price_cents: 4000, acquisition_mode: "BROKER_OWNED" }
              as: BrokerOps
            - call: "POST /buy-offers/${o_id}/receive"
              payload: {}
              as: BrokerOps
            - call: "POST /buy-offers/${o_id}/inspect"
              payload: { outcome: "PASS" }
              as: Inspector
            - call: "POST /buy-offers/${o_id}/convert-to-lot"
              payload: { storage_bin_id: "${b_id}" }
              as: BrokerOps
              captures: { lot_id: $.data.id }
            - call: "POST /listings"
              payload: { lot_id: "${lot_id}", asking_price_per_unit_cents: 5000 }
              as: BrokerOps
              captures: { l_id: $.data.id }
            - call: "POST /listings/${l_id}/activate"
              payload: {}
              as: BrokerOps
            - call: "POST /sales-orders"
              payload: { customer_id: "${c_id}", listing_id: "${l_id}", quantity: 1 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /sales-orders/${ord_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /sales-orders/${ord_id}/escrow/deposit"
              payload: { amount_cents: 100 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE"
            - "GET /sales-orders/${ord_id}/escrow-entries returns an empty array"

      - name: newly_created_offer_starts_pending_review
        claim_type: initial_state
        grounds: ["state_machines.BuyOffer"]
        distinguishing_aspect: "POST /buy-offers response has status PENDING_REVIEW and inspection_result NONE."
        test_recipe:
          setup: ["one seller"]
          setup_api_calls:
            - call: "POST /sellers"
              payload: { name: "Init Ingrid", contact_email: "ingrid@x.com" }
              as: BrokerOps
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /buy-offers"
              payload: { seller_id: "${s_id}", mpn: "LM317T", quantity: 3, ask_price_per_unit_cents: 4500 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { st: $.data.status, ir: $.data.inspection_result }
          assert:
            - "st == PENDING_REVIEW and ir == NONE"

      - name: withdraw_is_terminal_for_listing
        claim_type: terminal_lockdown
        grounds: ["state_machines.Listing"]
        distinguishing_aspect: "A WITHDRAWN listing cannot be activated: activate returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["one listing withdrawn from DRAFT"]
          setup_api_calls:
            - call: "POST /sellers"
              payload: { name: "Wd Wanda", contact_email: "wanda@x.com" }
              as: BrokerOps
              captures: { s_id: $.data.id }
            - call: "POST /storage-bins"
              payload: { bin_code: "BIN-W1", capacity_units: 20 }
              as: BrokerOps
              captures: { b_id: $.data.id }
            - call: "POST /buy-offers"
              payload: { seller_id: "${s_id}", mpn: "NE555", quantity: 5, ask_price_per_unit_cents: 4000, provenance_doc_url: "https://docs.x.com/pw.pdf" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { o_id: $.data.id }
            - call: "POST /buy-offers/${o_id}/accept"
              payload: { agreed_unit_price_cents: 4000, acquisition_mode: "BROKER_OWNED" }
              as: BrokerOps
            - call: "POST /buy-offers/${o_id}/receive"
              payload: {}
              as: BrokerOps
            - call: "POST /buy-offers/${o_id}/inspect"
              payload: { outcome: "PASS" }
              as: Inspector
            - call: "POST /buy-offers/${o_id}/convert-to-lot"
              payload: { storage_bin_id: "${b_id}" }
              as: BrokerOps
              captures: { lot_id: $.data.id }
            - call: "POST /listings"
              payload: { lot_id: "${lot_id}", asking_price_per_unit_cents: 5000 }
              as: BrokerOps
              captures: { l_id: $.data.id }
            - call: "POST /listings/${l_id}/withdraw"
              payload: {}
              as: BrokerOps
          trigger:
            - call: "POST /listings/${l_id}/activate"
              payload: {}
              as: BrokerOps
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE"

      - name: quarantine_cascades_active_listing_to_withdrawn
        claim_type: side_effect_execution
        grounds: ["state_machines.Lot"]
        distinguishing_aspect: "POST /lots/{id}/quarantine on a lot with an ACTIVE listing moves the lot to QUARANTINED and withdraws the listing in the same request."
        test_recipe:
          setup: ["lot with ACTIVE listing, flagged suspect"]
          setup_api_calls:
            - call: "POST /sellers"
              payload: { name: "Q Quinn", contact_email: "quinn@x.com" }
              as: BrokerOps
              captures: { s_id: $.data.id }
            - call: "POST /storage-bins"
              payload: { bin_code: "BIN-Q2", capacity_units: 20 }
              as: BrokerOps
              captures: { b_id: $.data.id }
            - call: "POST /buy-offers"
              payload: { seller_id: "${s_id}", mpn: "ATmega328P", quantity: 5, ask_price_per_unit_cents: 7000, provenance_doc_url: "https://docs.x.com/pq.pdf" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { o_id: $.data.id }
            - call: "POST /buy-offers/${o_id}/accept"
              payload: { agreed_unit_price_cents: 7000, acquisition_mode: "BROKER_OWNED" }
              as: BrokerOps
            - call: "POST /buy-offers/${o_id}/receive"
              payload: {}
              as: BrokerOps
            - call: "POST /buy-offers/${o_id}/inspect"
              payload: { outcome: "PASS" }
              as: Inspector
            - call: "POST /buy-offers/${o_id}/convert-to-lot"
              payload: { storage_bin_id: "${b_id}" }
              as: BrokerOps
              captures: { lot_id: $.data.id }
            - call: "POST /listings"
              payload: { lot_id: "${lot_id}", asking_price_per_unit_cents: 9000 }
              as: BrokerOps
              captures: { l_id: $.data.id }
            - call: "POST /listings/${l_id}/activate"
              payload: {}
              as: BrokerOps
            - call: "POST /lots/${lot_id}/flag-counterfeit-suspect"
              payload: {}
              as: Inspector
          trigger:
            - call: "POST /lots/${lot_id}/quarantine"
              payload: { quarantine_note: "x-ray anomaly" }
              as: Inspector
          assert:
            - "Lot.${lot_id}.status == QUARANTINED"
            - "Listing.${l_id}.status == WITHDRAWN"

      - name: fulfill_blocked_on_quarantined_lot
        claim_type: precondition_enforcement
        grounds: ["state_machines.SalesOrder.ESCROW_FUNDED_to_FULFILLING", "errors[ERR_LOT_QUARANTINED]"]
        distinguishing_aspect: "An ESCROW_FUNDED order whose lot is quarantined after funding cannot fulfill: ERR_LOT_QUARANTINED."
        test_recipe:
          setup: ["order escrowed 5000 (qty 1, STANDARD, asking 5000); lot subsequently flagged and quarantined"]
          setup_api_calls:
            - call: "POST /sellers"
              payload: { name: "Ful Phil", contact_email: "phil@x.com" }
              as: BrokerOps
              captures: { s_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Ful Faye", contact_email: "faye@x.com", credit_limit_cents: 50000, urgency_tier: "STANDARD" }
              as: BrokerOps
              captures: { c_id: $.data.id }
            - call: "POST /storage-bins"
              payload: { bin_code: "BIN-FU1", capacity_units: 20 }
              as: BrokerOps
              captures: { b_id: $.data.id }
            - call: "POST /buy-offers"
              payload: { seller_id: "${s_id}", mpn: "MCP6002", quantity: 5, ask_price_per_unit_cents: 4000, provenance_doc_url: "https://docs.x.com/pfu.pdf" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { o_id: $.data.id }
            - call: "POST /buy-offers/${o_id}/accept"
              payload: { agreed_unit_price_cents: 4000, acquisition_mode: "BROKER_OWNED" }
              as: BrokerOps
            - call: "POST /buy-offers/${o_id}/receive"
              payload: {}
              as: BrokerOps
            - call: "POST /buy-offers/${o_id}/inspect"
              payload: { outcome: "PASS" }
              as: Inspector
            - call: "POST /buy-offers/${o_id}/convert-to-lot"
              payload: { storage_bin_id: "${b_id}" }
              as: BrokerOps
              captures: { lot_id: $.data.id }
            - call: "POST /listings"
              payload: { lot_id: "${lot_id}", asking_price_per_unit_cents: 5000 }
              as: BrokerOps
              captures: { l_id: $.data.id }
            - call: "POST /listings/${l_id}/activate"
              payload: {}
              as: BrokerOps
            - call: "POST /sales-orders"
              payload: { customer_id: "${c_id}", listing_id: "${l_id}", quantity: 1 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /sales-orders/${ord_id}/escrow/deposit"
              payload: { amount_cents: 5000 }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /lots/${lot_id}/flag-counterfeit-suspect"
              payload: {}
              as: Inspector
            - call: "POST /lots/${lot_id}/quarantine"
              payload: {}
              as: Inspector
          trigger:
            - call: "POST /sales-orders/${ord_id}/fulfill"
              payload: {}
              as: BrokerOps
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_LOT_QUARANTINED"
            - "SalesOrder.${ord_id}.status remains ESCROW_FUNDED"

      - name: consignment_terminate_pauses_active_listing
        claim_type: side_effect_execution
        grounds: ["state_machines.ConsignmentAgreement.ACTIVE_to_TERMINATED"]
        distinguishing_aspect: "Terminating the ACTIVE consignment agreement pauses the lot's ACTIVE listing and the lot posture falls back to IN_STOCK."
        test_recipe:
          setup: ["CONSIGNMENT lot with current agreement and ACTIVE listing"]
          setup_api_calls:
            - call: "POST /sellers"
              payload: { name: "Ter Tess", contact_email: "tess@x.com" }
              as: BrokerOps
              captures: { s_id: $.data.id }
            - call: "POST /storage-bins"
              payload: { bin_code: "BIN-T1", capacity_units: 20 }
              as: BrokerOps
              captures: { b_id: $.data.id }
            - call: "POST /buy-offers"
              payload: { seller_id: "${s_id}", mpn: "PIC16F877", quantity: 5, ask_price_per_unit_cents: 9000, provenance_doc_url: "https://docs.x.com/pt.pdf" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { o_id: $.data.id }
            - call: "POST /buy-offers/${o_id}/accept"
              payload: { agreed_unit_price_cents: 9000, acquisition_mode: "CONSIGNMENT" }
              as: BrokerOps
            - call: "POST /buy-offers/${o_id}/receive"
              payload: {}
              as: BrokerOps
            - call: "POST /buy-offers/${o_id}/inspect"
              payload: { outcome: "PASS" }
              as: Inspector
            - call: "POST /buy-offers/${o_id}/convert-to-lot"
              payload: { storage_bin_id: "${b_id}" }
              as: BrokerOps
              captures: { lot_id: $.data.id }
            - call: "POST /consignment-agreements"
