  - rule_id: cross_entity_state_dependency
    instances:
      - name: cesd_plan_submit_blocked_by_sibling_plan_trade_fund_reservation
        grounds:
          - state_machines.BudgetPlan.DRAFT_to_PENDING_APPROVAL
          - state_machines.BudgetPlan.PENDING_APPROVAL_to_APPROVED
          - calculations.trade_fund_available
          - validations[priority=74]
          - entities.TradeFundAccount.fields.available_cents
          - entities.TradeFundAccount.fields.reserved_cents
          - entities.BudgetPlan.fields.trade_fund_share_cents
        distinguishing_aspect: |
          This dependency crosses the BudgetPlan -> TradeFundAccount pair: plan B's DRAFT -> PENDING_APPROVAL
          transition is refused with ERR_TRADE_FUND_INSUFFICIENT purely because sibling plan A reaching
          plan_status == ACTIVE pushed TradeFundAccount.reserved_cents to 2500000 and therefore
          available_cents down to 500000, while every field of plan B itself is individually valid.
        test_recipe:
          setup:
            - "Logical clock left at its 2026-08-01T00:00:00Z startup default."
            - "One SELF_SERVE Advertiser driven to onboarding_status == ACTIVE with credit_limit_cents = 100000000."
            - "One TradeFundAccount for (advertiser, 2026-Q3) in account_status == OPEN carrying accrued_cents = 3000000."
            - "BudgetPlan A (committed_total_cents = 5000000, trade_fund_share_cents = 2500000) driven all the way to plan_status == ACTIVE, so it occupies 2500000 of the pool as reserved_cents."
            - "BudgetPlan B (committed_total_cents = 1200000, trade_fund_share_cents = 600000) left in plan_status == DRAFT, never submitted."
            - "TradeFundAccount decomposition at the end of setup: accrued 3000000, reserved 2500000, deducted 0, available 500000."
          setup_api_calls:
            - call: "POST /rmn/advertisers"
              payload: { legal_name: "Northwind Grocery Brands LLC", brand_code: "NWGB01", service_model: "SELF_SERVE", credit_limit_cents: 100000000, self_serve_daily_spend_cap_cents: 500000 }
              as: NetworkAdmin
              as_user_id: "na_001"
              captures: { adv_id: $.data.id }
            - call: "POST /rmn/advertisers/${adv_id}/submit-onboarding"
              payload: { kyc_document_count: 2 }
              as: AccountManager
              as_user_id: "am_001"
            - call: "POST /rmn/advertisers/${adv_id}/kyc-decision"
              payload: { decision: "APPROVE", decision_note: "KYC cleared" }
              as: CreditAnalyst
              as_user_id: "ca_001"
              captures: { adv_v_after_kyc: $.data.version }
            - call: "POST /rmn/trade-fund-accounts"
              payload: { advertiser_id: "${adv_id}", fiscal_period_code: "2026-Q3", accrual_basis: "PURCHASE_VOLUME", deduction_cap_pct: 0.6 }
              as: BillingOps
              as_user_id: "bo_001"
              captures: { tfa_id: $.data.id }
            - call: "POST /rmn/trade-fund-accounts/${tfa_id}/accruals"
              payload: { accrual_amount_cents: 3000000, accrual_reference: "ACCR-2026-Q3-001" }
              as: BillingOps
              as_user_id: "bo_001"
              captures: { tfa_accrued_seed: $.data.accrued_cents }
            - call: "POST /rmn/budget-plans"
              payload: { advertiser_id: "${adv_id}", fiscal_period_code: "2026-Q3", committed_total_cents: 5000000, trade_fund_share_cents: 2500000, window_start_at: "2026-07-01T00:00:00Z", window_end_at: "2026-10-01T00:00:00Z", expected_advertiser_version: "${adv_v_after_kyc}" }
              as: AccountManager
              as_user_id: "am_001"
              captures: { plan_a_id: $.data.id }
            - call: "POST /rmn/budget-plans/${plan_a_id}/submit"
              payload: { submission_note: "Q3 core commitment" }
              as: AccountManager
              as_user_id: "am_001"
            - call: "POST /rmn/budget-plans/${plan_a_id}/approve"
              payload: { approval_note: "inside credit limit" }
              as: CreditAnalyst
              as_user_id: "ca_001"
            - call: "GET /rmn/advertisers/${adv_id}"
              payload: {}
              as: AccountManager
              as_user_id: "am_001"
              captures: { adv_v_before_plan_b: $.data.version }
            - call: "POST /rmn/budget-plans"
              payload: { advertiser_id: "${adv_id}", fiscal_period_code: "2026-Q3", committed_total_cents: 1200000, trade_fund_share_cents: 600000, window_start_at: "2026-07-01T00:00:00Z", window_end_at: "2026-10-01T00:00:00Z", expected_advertiser_version: "${adv_v_before_plan_b}" }
              as: AccountManager
              as_user_id: "am_001"
              captures: { plan_b_id: $.data.id }
            - call: "GET /rmn/trade-fund-accounts/${tfa_id}"
              payload: {}
              as: BillingOps
              as_user_id: "bo_001"
              captures: { tfa_avail_before: $.data.available_cents, tfa_reserved_before: $.data.reserved_cents }
          trigger:
            - call: "POST /rmn/budget-plans/${plan_b_id}/submit"
              payload: { submission_note: "Q3 incremental commitment" }
              as: AccountManager
              as_user_id: "am_001"
          assert:
            - "trigger response HTTP status == 402"
            - "trigger response data.error_id == ERR_TRADE_FUND_INSUFFICIENT"
            - "${tfa_accrued_seed} == 3000000"
            - "${tfa_reserved_before} == 2500000"
            - "${tfa_avail_before} == 500000"
            - "TradeFundAccount.${tfa_id}.accrued_cents == 3000000"
            - "TradeFundAccount.${tfa_id}.reserved_cents == 2500000"
            - "TradeFundAccount.${tfa_id}.deducted_cents == 0"
            - "TradeFundAccount.${tfa_id}.available_cents == 500000"
            - "TradeFundAccount.${tfa_id}.account_status == OPEN"
            - "BudgetPlan.${plan_a_id}.plan_status == ACTIVE"
            - "BudgetPlan.${plan_a_id}.trade_fund_share_cents == 2500000"
            - "BudgetPlan.${plan_b_id}.plan_status == DRAFT"
            - "BudgetPlan.${plan_b_id}.trade_fund_share_cents == 600000"
            - "BudgetPlan.${plan_b_id}.submitted_by_user_id is null"
            - "600000 > 500000, i.e. the refusal is decided by TradeFundAccount.available_cents and not by any field of BudgetPlan.${plan_b_id}"

