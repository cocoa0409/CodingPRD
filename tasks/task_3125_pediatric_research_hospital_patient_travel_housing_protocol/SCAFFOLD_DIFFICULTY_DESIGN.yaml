      - name: cascade_withdraw_fans_out_across_three_resource_types
        grounds:
          - state_machines.Referral.ACCEPTED_to_WITHDRAWN
          - state_machines.HousingAssignment.SCHEDULED_to_CANCELLED
          - state_machines.FamilySupportPledge.ACTIVE_to_VOIDED
          - entities.ClinicalProtocol.fields.reserved_cents
