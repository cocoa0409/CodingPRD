  - method: GET
    path: "/senior-games/personnel/{personnel_id}"
    description: "Read one official or volunteer including the served-minutes and no-show ledgers."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: []
    output: Personnel
    side_effects: []
  - method: GET
    path: "/senior-games/personnel"
    description: "List personnel, filterable by edition or type."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: ["games_edition_id?", "personnel_type?", "limit?", "offset?"]
    output: Personnel[]
    side_effects: []

  # ---------------- PersonnelAssignment ----------------
  - method: POST
    path: "/senior-games/personnel-assignments"
    description: "Assign an official or volunteer to a session slot, gated by certification, the travel-buffered conflict window and the daily minutes cap."
    roles: [GamesAdmin]
    code: 201
    input: [personnel_id, session_slot_id, role_at_event]
    output: PersonnelAssignment
    side_effects: ["status = ASSIGNED", "sets duration_minutes from the slot interval", "increments Personnel.assigned_minutes_total by duration_minutes"]
  - method: GET
    path: "/senior-games/personnel-assignments/{personnel_assignment_id}"
    description: "Read one assignment."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: []
    output: PersonnelAssignment
    side_effects: []
  - method: GET
    path: "/senior-games/personnel-assignments"
    description: "List assignments, filterable by person, slot or status."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: ["personnel_id?", "session_slot_id?", "status?", "limit?", "offset?"]
    output: PersonnelAssignment[]
    side_effects: []
  - method: POST
    path: "/senior-games/personnel-assignments/{personnel_assignment_id}/confirm"
    description: "Official or volunteer confirms their own assignment; X-User-ID must equal personnel_id."
    roles: [SportOfficial]
    code: 200
    input: []
    output: PersonnelAssignment
    side_effects: ["status = CONFIRMED", "increments SessionSlot.confirmed_official_count when personnel_type == OFFICIAL", "increments PersonnelAssignment.version by 1"]
  - method: POST
    path: "/senior-games/personnel-assignments/{personnel_assignment_id}/release"
    description: "Release an assignment, reversing the served-minutes debit exactly."
    roles: [GamesAdmin]
    code: 200
    input: ["reason?"]
    output: PersonnelAssignment
    side_effects: ["status = RELEASED", "decrements Personnel.assigned_minutes_total by duration_minutes", "decrements SessionSlot.confirmed_official_count when it was CONFIRMED and OFFICIAL", "increments PersonnelAssignment.version by 1"]

  # ---------------- CompetitionResult ----------------
  - method: POST
    path: "/senior-games/competition-results"
    description: "An official records a mark for an accepted entry in a competed slot."
    roles: [SportOfficial]
    code: 201
    input: [sport_entry_id, session_slot_id, submitted_by_personnel_id, mark_value, placement]
    output: CompetitionResult
    side_effects: ["status = SUBMITTED", "national_qualifying = false", "protest_round = 0", "verified_by_user_id = null"]
  - method: GET
    path: "/senior-games/competition-results/{competition_result_id}"
    description: "Read one result including the national-qualification flag and verifier identity."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: []
    output: CompetitionResult
    side_effects: []
  - method: GET
    path: "/senior-games/competition-results"
    description: "List results, filterable by entry, slot, submitting official or status."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: ["sport_entry_id?", "session_slot_id?", "submitted_by_personnel_id?", "status?", "limit?", "offset?"]
    output: CompetitionResult[]
    side_effects: []
  - method: POST
    path: "/senior-games/competition-results/{competition_result_id}/verify"
    description: "Verify a submitted mark. Forks: a mark that beats the event's current ratified record goes to RECORD_PENDING (record-eligible, not published), any other mark goes to VERIFIED."
    roles: [RegistrationOfficer]
    code: 200
    input: []
    output: CompetitionResult
    side_effects: ["status = RECORD_PENDING or VERIFIED", "verified_by_user_id = X-User-ID", "sets national_qualifying via calculations.national_qualification_flag", "increments CompetitionResult.version by 1"]
  - method: POST
    path: "/senior-games/competition-results/{competition_result_id}/publish"
    description: "Publish a verified or record-pending result; the record-pending branch additionally requires a filed record claim."
    roles: [RegistrationOfficer]
    code: 200
    input: []
    output: CompetitionResult
    side_effects: ["status = PUBLISHED", "increments CompetitionResult.version by 1"]
  - method: POST
    path: "/senior-games/competition-results/{competition_result_id}/protest"
    description: "The athlete whose entry the result belongs to protests it, at most once."
    roles: [Athlete]
    code: 200
    input: [grounds]
    output: CompetitionResult
    side_effects: ["status = PROTESTED", "PENDING_RATIFICATION AgeGroupRecord claims citing the result move to REJECTED", "increments CompetitionResult.version by 1"]
  - method: POST
    path: "/senior-games/competition-results/{competition_result_id}/resolve-protest"
    description: "Resolve a protest: REMEASURE rewrites the mark and returns the result to SUBMITTED (closing the cycle), VOID terminates it and unwinds any record derived from it."
    roles: [RegistrationOfficer]
    code: 200
    input: [decision, "mark_value?", "placement?"]
    output: CompetitionResult
    side_effects: ["REMEASURE: mark_value/placement rewritten, status = SUBMITTED, verified_by_user_id = null, national_qualifying = false, protest_round incremented", "VOID: status = VOIDED and AgeGroupRecord unwind with SportEvent.current_record_id restoration", "increments CompetitionResult.version by 1"]

  # ---------------- AgeGroupRecord ----------------
  - method: POST
    path: "/senior-games/age-group-records"
    description: "File an age-group record claim against a record-eligible result. Carries OCC on the parent SportEvent's version."
    roles: [RecordsRatifier]
    code: 201
    input: [sport_event_id, competition_result_id, claimed_by_user_id, expected_sport_event_version]
    output: AgeGroupRecord
    side_effects: ["status = PENDING_RATIFICATION", "sets holder_athlete_id, age_group_code, mark_value and superseded_record_id from the event's current_record_id", "increments SportEvent.version by 1"]
  - method: GET
    path: "/senior-games/age-group-records/{age_group_record_id}"
    description: "Read one record claim including its supersede pointer."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: []
    output: AgeGroupRecord
    side_effects: []
  - method: GET
    path: "/senior-games/age-group-records"
    description: "List record claims, filterable by event, cited result, holder, supersede pointer or status."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: ["sport_event_id?", "competition_result_id?", "holder_athlete_id?", "superseded_record_id?", "status?", "limit?", "offset?"]
    output: AgeGroupRecord[]
    side_effects: []
  - method: POST
    path: "/senior-games/age-group-records/{age_group_record_id}/ratify"
    description: "Ratify or reject a record claim under segregation of duties: the acting X-User-ID may be neither the claimer nor the verifier of the cited result."
    roles: [RecordsRatifier]
    code: 200
    input: [decision]
    output: AgeGroupRecord
    side_effects: ["RATIFY: status = RATIFIED, ratified_by_user_id = X-User-ID, SportEvent.current_record_id = record.id, prior record -> SUPERSEDED", "REJECT: status = REJECTED", "increments AgeGroupRecord.version by 1"]

  # ---------------- AccommodationBlock / VillageStay ----------------
  - method: POST
    path: "/senior-games/accommodation-blocks"
    description: "Create an athlete-village accommodation block."
    roles: [GamesAdmin]
    code: 201
    input: [games_edition_id, name, bed_capacity, nightly_rate_cents, "accessible_units?"]
    output: AccommodationBlock
    side_effects: ["reserved_bed_nights = 0"]
  - method: GET
    path: "/senior-games/accommodation-blocks/{accommodation_block_id}"
    description: "Read one block including the reserved bed-night ledger and version for OCC."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: []
    output: AccommodationBlock
    side_effects: []
  - method: GET
    path: "/senior-games/accommodation-blocks"
    description: "List accommodation blocks for an edition."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: ["games_edition_id?", "limit?", "offset?"]
    output: AccommodationBlock[]
    side_effects: []
  - method: POST
    path: "/senior-games/village-stays"
    description: "Reserve a bed for an athlete. Carries OCC on the parent AccommodationBlock's version and is gated night by night by bed capacity."
    roles: [GamesAdmin, Athlete]
    code: 201
    input: [athlete_id, accommodation_block_id, check_in_date, check_out_date, expected_block_version]
    output: VillageStay
    side_effects: ["status = RESERVED", "sets nights and total_charge_cents", "increments AccommodationBlock.reserved_bed_nights by nights", "increments AccommodationBlock.version by 1"]
  - method: GET
    path: "/senior-games/village-stays/{village_stay_id}"
    description: "Read one village stay."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: []
    output: VillageStay
    side_effects: []
  - method: GET
    path: "/senior-games/village-stays"
    description: "List village stays, filterable by athlete, block or status."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: ["athlete_id?", "accommodation_block_id?", "status?", "limit?", "offset?"]
    output: VillageStay[]
    side_effects: []
  - method: POST
    path: "/senior-games/village-stays/{village_stay_id}/cancel"
    description: "Cancel a stay, releasing exactly the bed-nights it consumed."
    roles: [GamesAdmin, Athlete]
    code: 200
    input: ["reason?"]
    output: VillageStay
    side_effects: ["status = CANCELLED", "decrements AccommodationBlock.reserved_bed_nights by nights", "total_charge_cents = 0", "increments VillageStay.version by 1"]

  # ---------------- SponsorshipCommitment ----------------
  - method: POST
    path: "/senior-games/sponsorship-commitments"
    description: "Record a corporate, municipal or foundation pledge."
    roles: [SponsorLiaison]
    code: 201
    input: [games_edition_id, sponsor_name, sponsor_kind, tier, pledged_cents]
    output: SponsorshipCommitment
    side_effects: ["status = PLEDGED", "recognized_cents = 0", "allocation_map = {}"]
  - method: GET
    path: "/senior-games/sponsorship-commitments/{sponsorship_commitment_id}"
    description: "Read one commitment including its per-bucket allocation map."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: []
    output: SponsorshipCommitment
    side_effects: []
  - method: GET
    path: "/senior-games/sponsorship-commitments"
    description: "List commitments, filterable by edition or status."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: ["games_edition_id?", "status?", "limit?", "offset?"]
    output: SponsorshipCommitment[]
    side_effects: []
  - method: POST
    path: "/senior-games/sponsorship-commitments/{sponsorship_commitment_id}/allocate"
    description: "Allocate the pledge across the four recognition buckets, rounding per bucket then summing, and post the total to the edition ledger. Carries OCC on the parent GamesEdition's version."
    roles: [SponsorLiaison]
    code: 200
    input: [expected_games_edition_version]
    output: SponsorshipCommitment
    side_effects: ["sets allocation_map and recognized_cents via calculations.sponsorship_recognition_allocation", "status = ALLOCATED", "increments GamesEdition.sponsorship_recognized_cents by recognized_cents", "increments GamesEdition.version by 1", "increments SponsorshipCommitment.version by 1"]
  - method: POST
    path: "/senior-games/sponsorship-commitments/{sponsorship_commitment_id}/withdraw"
    description: "Withdraw a pledge, reversing any recognition posted to the edition ledger exactly."
    roles: [SponsorLiaison]
    code: 200
    input: ["reason?"]
    output: SponsorshipCommitment
    side_effects: ["decrements GamesEdition.sponsorship_recognized_cents by recognized_cents when it was ALLOCATED", "recognized_cents = 0 and allocation_map = {}", "status = WITHDRAWN", "increments GamesEdition.version by 1", "increments SponsorshipCommitment.version by 1"]

  # ---------------- Test-driving endpoint (logical clock) ----------------
  - method: POST
    path: "/senior-games/_clock/set_current_utc"
    description: "Set the server's logical clock to an arbitrary instant. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and MUST NOT fall back to real wall-clock time."
    roles: [GamesAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["all deadline, window, expiry and interval evaluations read the new instant", "no entity row is mutated"]

# =====================================================================
# 1.6 Error Code Catalog
# =====================================================================
errors:
  # ---- authentication / authorization ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header is absent or empty on any endpoint."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The X-User-Role value is not listed in the called endpoint's roles list."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity_backed role acts on a resource it does not own: Athlete whose X-User-ID differs from the target athlete_id, or SportOfficial whose X-User-ID differs from PersonnelAssignment.personnel_id or CompetitionResult.submitted_by_personnel_id."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID on POST /age-group-records/{id}/ratify equals the record's claimed_by_user_id or the cited CompetitionResult.verified_by_user_id."
  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required input field is missing, has the wrong JSON type, violates a declared enum or numeric constraint, or a date/datetime string is not parseable ISO-8601."
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit is not an integer in 1..100, or offset is not an integer >= 0, on a list GET."
  # ---- existence ----
  - id: ERR_GAMES_EDITION_NOT_FOUND
    http: 404
    condition: "games_edition_id in the path or body does not resolve to a GamesEdition row."
  - id: ERR_SPORT_NOT_FOUND
    http: 404
    condition: "sport_id in the path or body does not resolve to a Sport row."
  - id: ERR_SPORT_EVENT_NOT_FOUND
    http: 404
    condition: "sport_event_id in the path or body does not resolve to a SportEvent row."
  - id: ERR_VENUE_NOT_FOUND
    http: 404
    condition: "venue_id in the path or body does not resolve to a Venue row."
  - id: ERR_SESSION_SLOT_NOT_FOUND
    http: 404
    condition: "session_slot_id in the path or body does not resolve to a SessionSlot row."
  - id: ERR_ATHLETE_NOT_FOUND
    http: 404
    condition: "athlete_id in the path or body does not resolve to an Athlete row."
  - id: ERR_QUALIFYING_RESULT_NOT_FOUND
    http: 404
    condition: "qualifying_result_id in the path or body does not resolve to a QualifyingResult row."
  - id: ERR_SPORT_ENTRY_NOT_FOUND
    http: 404
    condition: "sport_entry_id in the path or body does not resolve to a SportEntry row."
  - id: ERR_MEDICAL_SCREENING_NOT_FOUND
    http: 404
    condition: "medical_screening_id in the path does not resolve to a MedicalScreening row."
  - id: ERR_PERSONNEL_NOT_FOUND
    http: 404
    condition: "personnel_id or submitted_by_personnel_id in the path or body does not resolve to a Personnel row."
  - id: ERR_PERSONNEL_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "personnel_assignment_id in the path does not resolve to a PersonnelAssignment row."
  - id: ERR_COMPETITION_RESULT_NOT_FOUND
    http: 404
    condition: "competition_result_id in the path or body does not resolve to a CompetitionResult row."
  - id: ERR_AGE_GROUP_RECORD_NOT_FOUND
    http: 404
    condition: "age_group_record_id in the path does not resolve to an AgeGroupRecord row."
  - id: ERR_ACCOMMODATION_BLOCK_NOT_FOUND
    http: 404
    condition: "accommodation_block_id in the path or body does not resolve to an AccommodationBlock row."
  - id: ERR_VILLAGE_STAY_NOT_FOUND
    http: 404
    condition: "village_stay_id in the path does not resolve to a VillageStay row."
  - id: ERR_SPONSORSHIP_COMMITMENT_NOT_FOUND
    http: 404
    condition: "sponsorship_commitment_id in the path does not resolve to a SponsorshipCommitment row."
  # ---- optimistic concurrency (§1.2.1) ----
  - id: ERR_STALE_SPORT_EVENT_VERSION
    http: 412
    condition: "expected_sport_event_version on POST /age-group-records does not equal the parent SportEvent's current version."
  - id: ERR_STALE_BLOCK_VERSION
    http: 412
    condition: "expected_block_version on POST /village-stays does not equal the parent AccommodationBlock's current version."
  - id: ERR_STALE_GAMES_EDITION_VERSION
    http: 412
    condition: "expected_games_edition_version on POST /sponsorship-commitments/{id}/allocate does not equal the parent GamesEdition's current version."
  # ---- state / lifecycle ----
  - id: ERR_EDITION_STATE_INVALID
    http: 409
    condition: "The governing GamesEdition is not in a status that permits the operation (registration writes need REGISTRATION_OPEN; check-in needs REGISTRATION_CLOSED or IN_PROGRESS; finalize-impact needs COMPLETED; sponsorship allocation needs any status other than IMPACT_FINALIZED)."
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The target row's current status is not a declared from-state of the requested §1.2 transition."
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "The target row already sits in a terminal state of its machine, so no transition is admissible."
  - id: ERR_ATHLETE_NOT_REGISTERED
    http: 409
    condition: "An entry is accepted or waitlist-promoted while the entering athlete's registration_status is not REGISTERED."
  - id: ERR_VENUE_CLOSED
    http: 409
    condition: "A session slot is created, rescheduled or advanced at a Venue whose status is CLOSED."
  - id: ERR_RESULT_NOT_RECORD_ELIGIBLE
    http: 409
    condition: "A record claim is filed or ratified against a CompetitionResult whose status is not RECORD_PENDING or PUBLISHED."
  - id: ERR_SLOT_NOT_COMPETED
    http: 409
    condition: "A result is submitted for a SessionSlot that is neither IN_PROGRESS nor COMPLETED, or verified while its slot is not COMPLETED."
  # ---- safety / medical ----
  - id: ERR_ATHLETE_MEDICAL_HOLD
    http: 422
    condition: "The athlete's medical_status is SCREENED_HOLD when an entry is submitted or accepted, or is not one of SCREENED_CLEARED / SCREENED_RESTRICTED / CLEARED_BY_APPEAL at check-in."
  - id: ERR_MEDICAL_COVERAGE_REQUIRED
    http: 422
    condition: "A session slot for an event whose Sport.contact_class is HIGH is placed at a Venue with has_onsite_medical_bay == false."
  - id: ERR_EMERGENCY_PROTOCOL_INSUFFICIENT
    http: 422
    condition: "A session slot for an event whose age_group_code floor is 75 or above is placed at a Venue whose emergency_protocol_code is not EP_CARDIAC."
  # ---- eligibility / referential business rules ----
  - id: ERR_QUALIFYING_RESULT_INVALID
    http: 422
    condition: "The cited QualifyingResult does not belong to the entering athlete, was contested in a different sport or event_code, is not sanctioned, has a meet_level below what qualification_source demands, or qualifying_result_id is supplied for an AGE_EXEMPT / ORGANIZER_INVITE source (or omitted for a qualifier source)."
  - id: ERR_AGE_GROUP_MISMATCH
    http: 422
    condition: "The target SportEvent.age_group_code differs from the athlete's computed age_group_code, the athlete's basis age is below the event's Sport.min_age, or an AGE_EXEMPT entry is filed by an athlete whose basis age is below 75."
  - id: ERR_CERTIFICATION_INSUFFICIENT
    http: 422
    condition: "An OFFICIAL assignment is requested for a person whose certification_level is below the event's Sport.required_certification_level, or whose certified_sport_codes does not contain the slot's sport_code."
  - id: ERR_ATHLETE_UNDER_MINIMUM_AGE
    http: 422
    condition: "The athlete's basis age under the edition's age_basis is below MIN_ELIGIBLE_AGE (50)."
  # ---- temporal business rules ----
  - id: ERR_PERSONNEL_DOUBLE_BOOKED
    http: 409
    condition: "calculations.personnel_conflict_window reports a travel-buffer-expanded closed-interval collision with one of the person's ASSIGNED or CONFIRMED assignments."
  - id: ERR_ATHLETE_SCHEDULE_CONFLICT
    http: 409
    condition: "calculations.athlete_multisport_gap reports a pair of the athlete's scheduled slots separated by fewer than ATHLETE_RECOVERY_GAP_MINUTES."
  - id: ERR_REGISTRATION_DEADLINE_PASSED
    http: 422
    condition: "The logical clock is at or after GamesEdition.registration_deadline_utc on a registration write."
  - id: ERR_STAY_OUTSIDE_VILLAGE_WINDOW
    http: 422
    condition: "A village stay interval falls outside [competition_start_date - 2 days, competition_end_date + 2 days], or check_out_date is not strictly after check_in_date."
  # ---- capacity / aggregate constraints ----
  - id: ERR_VENUE_AREA_CAPACITY_EXCEEDED
    http: 409
    condition: "calculations.venue_area_occupancy reports that the candidate buffered window would place more overlapping SCHEDULED/IN_PROGRESS slots at the venue than Venue.competition_area_count."
  - id: ERR_BLOCK_NIGHT_FULL
    http: 409
    condition: "calculations.bed_night_occupancy reports at least one night of the candidate stay already at AccommodationBlock.bed_capacity."
  - id: ERR_EVENT_CAPACITY_FULL
    http: 409
    condition: "An entry is accepted while SportEvent.available_slots is 0."
  - id: ERR_PERSONNEL_DAILY_LIMIT_EXCEEDED
    http: 422
    condition: "Adding the assignment would push the person's same-UTC-date assigned minutes above MAX_DAILY_ASSIGNED_MINUTES (480)."
  - id: ERR_REVISION_LIMIT_REACHED
    http: 422
    condition: "A revision is requested or a resubmission filed when SportEntry.revision_round already equals MAX_REVISION_ROUNDS (2)."
  - id: ERR_PROTEST_LIMIT_REACHED
    http: 422
    condition: "A protest is filed when CompetitionResult.protest_round is already 1 or more."
  - id: ERR_NO_ELIGIBLE_ENTRIES
    http: 422
    condition: "Seeding is requested for an event with zero ACCEPTED SportEntry rows."
  - id: ERR_MIN_ENTRIES_NOT_MET
    http: 422
    condition: "Seeding is requested while SportEvent.accepted_entry_count is below SportEvent.min_entries_to_stage."
  # ---- uniqueness ----
  - id: ERR_SPORT_CODE_TAKEN
    http: 409
    condition: "The requested Sport.sport_code already exists."
  - id: ERR_ATHLETE_EMAIL_TAKEN
    http: 409
    condition: "The pair (games_edition_id, email) already exists on an Athlete row."
  - id: ERR_ASSIGNMENT_DUPLICATE
    http: 409
    condition: "The pair (personnel_id, session_slot_id) already exists on a PersonnelAssignment with status ASSIGNED, CONFIRMED or COMPLETED."
  - id: ERR_RESULT_ALREADY_RECORDED
    http: 409
    condition: "The sport_entry_id already carries a CompetitionResult with status SUBMITTED, VERIFIED, RECORD_PENDING or PUBLISHED."
  - id: ERR_DUPLICATE_ENTRY
    http: 409
    condition: "The athlete already holds a SportEntry on the same sport_event_id with status SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, ACCEPTED, WAITLISTED or MEDICAL_HOLD."
  # ---- fiscal ----
  - id: ERR_FEE_AMOUNT_MISMATCH
    http: 422
    condition: "request.amount_cents differs from the fee_total_cents produced by calculations.athlete_fee_settlement for the athlete."
  - id: ERR_IMPACT_ALREADY_FINALIZED
    http: 409
    condition: "finalize-impact or a further ops-run checkpoint is called when GamesEdition.final_impact_cents is already set; the impact ledger is frozen after finalization."

# =====================================================================
# 1.7 RBAC Matrix
# =====================================================================
# Role model: segregation_of_duties. Two independent segregations are enforced:
#   (1) record ratification — the RecordsRatifier X-User-ID that ratifies a claim may be
#       neither the claimer nor the RegistrationOfficer X-User-ID that verified the cited result
#       (validations priority 58 -> ERR_SEGREGATION_OF_DUTIES);
#   (2) result production vs verification — SportOfficial submits marks, RegistrationOfficer verifies
#       and publishes them; neither role appears in the other's endpoint list.
# There is no Anonymous role: every endpoint requires X-User-Role and X-User-ID
# (absent or empty -> ERR_UNAUTHENTICATED).
# Every read endpoint (single-resource GET and list GET) is shared by all seven roles.
roles:
  - name: GamesAdmin
    description: "Organizing-committee operations staff: builds the edition, the sport catalogue, venues and the schedule, recruits personnel, runs the ops-run checkpoint, and drives the logical clock in test harnesses."
    identity: "opaque"
    exclusive_operations:
      - "POST /senior-games/games-editions"
      - "POST /senior-games/games-editions/{games_edition_id}/open-registration"
      - "POST /senior-games/games-editions/{games_edition_id}/ops-run"
      - "POST /senior-games/sports"
      - "POST /senior-games/sport-events"
      - "POST /senior-games/sport-events/{sport_event_id}/cancel"
      - "POST /senior-games/venues"
      - "POST /senior-games/venues/{venue_id}/close"
      - "POST /senior-games/session-slots"
      - "POST /senior-games/session-slots/{session_slot_id}/reschedule"
      - "POST /senior-games/session-slots/{session_slot_id}/advance"
      - "POST /senior-games/athletes/{athlete_id}/check-in"
      - "POST /senior-games/personnel"
      - "POST /senior-games/personnel-assignments"
      - "POST /senior-games/personnel-assignments/{personnel_assignment_id}/release"
      - "POST /senior-games/accommodation-blocks"
      - "POST /senior-games/_clock/set_current_utc"
    shared_operations:
      - "POST /senior-games/athletes (with RegistrationOfficer)"
      - "POST /senior-games/athletes/{athlete_id}/pay-fees (with Athlete)"
      - "POST /senior-games/athletes/{athlete_id}/withdraw (with Athlete)"
      - "POST /senior-games/qualifying-results (with RegistrationOfficer)"
      - "POST /senior-games/village-stays (with Athlete)"
      - "POST /senior-games/village-stays/{village_stay_id}/cancel (with Athlete)"
      - "every single-resource GET and list GET (with all roles)"
  - name: RegistrationOfficer
    description: "Entry-desk and results officer: reviews entries against qualification and age-group rules, seeds events, and verifies, publishes and adjudicates marks produced by officials."
    identity: "opaque"
    exclusive_operations:
      - "POST /senior-games/sport-events/{sport_event_id}/seed"
      - "POST /senior-games/sport-entries/{sport_entry_id}/review"
      - "POST /senior-games/competition-results/{competition_result_id}/verify"
      - "POST /senior-games/competition-results/{competition_result_id}/publish"
      - "POST /senior-games/competition-results/{competition_result_id}/resolve-protest"
    shared_operations:
      - "POST /senior-games/athletes (with GamesAdmin)"
      - "POST /senior-games/qualifying-results (with GamesAdmin)"
      - "POST /senior-games/sport-entries (with Athlete)"
      - "POST /senior-games/sport-entries/{sport_entry_id}/withdraw (with Athlete)"
      - "every single-resource GET and list GET (with all roles)"
  - name: Athlete
    description: "A registered masters competitor acting on their own registration: pays fees, files and revises entries, books a village bed, protests a mark, and withdraws."
    identity: "entity_backed:Athlete"
    exclusive_operations:
      - "POST /senior-games/sport-entries/{sport_entry_id}/resubmit"
      - "POST /senior-games/competition-results/{competition_result_id}/protest"
    shared_operations:
      - "POST /senior-games/athletes/{athlete_id}/pay-fees (with GamesAdmin)"
      - "POST /senior-games/athletes/{athlete_id}/withdraw (with GamesAdmin)"
      - "POST /senior-games/sport-entries (with RegistrationOfficer)"
      - "POST /senior-games/sport-entries/{sport_entry_id}/withdraw (with RegistrationOfficer)"
      - "POST /senior-games/village-stays (with GamesAdmin)"
      - "POST /senior-games/village-stays/{village_stay_id}/cancel (with GamesAdmin)"
      - "every single-resource GET and list GET (with all roles)"
  - name: MedicalDirector
    description: "Games medical director: records screening recommendations from the risk model and hears medical appeals against a screening hold."
    identity: "opaque"
    exclusive_operations:
      - "POST /senior-games/medical-screenings"
      - "POST /senior-games/athletes/{athlete_id}/medical-appeal"
    shared_operations:
      - "every single-resource GET and list GET (with all roles)"
  - name: SportOfficial
    description: "A certified official or volunteer acting as themselves: confirms their own assignment and submits marks for the sessions they officiate."
    identity: "entity_backed:Personnel"
    exclusive_operations:
      - "POST /senior-games/personnel-assignments/{personnel_assignment_id}/confirm"
      - "POST /senior-games/competition-results"
    shared_operations:
      - "every single-resource GET and list GET (with all roles)"
  - name: RecordsRatifier
    description: "National-body records officer: files age-group record claims against record-eligible results and ratifies or rejects them under segregation of duties."
    identity: "opaque"
    exclusive_operations:
      - "POST /senior-games/age-group-records"
      - "POST /senior-games/age-group-records/{age_group_record_id}/ratify"
    shared_operations:
      - "every single-resource GET and list GET (with all roles)"
  - name: SponsorLiaison
    description: "Sponsorship and municipal-support liaison: books pledges, allocates recognition across buckets, and finalizes the edition's economic-impact report."
    identity: "opaque"
    exclusive_operations:
      - "POST /senior-games/sponsorship-commitments"
      - "POST /senior-games/sponsorship-commitments/{sponsorship_commitment_id}/allocate"
      - "POST /senior-games/sponsorship-commitments/{sponsorship_commitment_id}/withdraw"
      - "POST /senior-games/games-editions/{games_edition_id}/finalize-impact"
    shared_operations:
      - "every single-resource GET and list GET (with all roles)"
