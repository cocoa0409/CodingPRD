              as: IdentityAnalyst
              captures: { rec_s4a_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_s4_id}", mrn: "S4-2000", last_name: "Grimaldi", first_name: "Chiara", dob: "1987-06-06", sex: "F", clinical_element_count: 1 }
              as: IdentityAnalyst
              captures: { rec_s4b_id: $.data.id }
            - call: "POST /mpi/candidate-pairs"
              payload: { record_a_id: "${rec_s4a_id}", record_b_id: "${rec_s4b_id}", rule_set_id: "${rs_base_id}", score_variant: "STRICT" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { pair_s4_id: $.data.id }
            - call: "POST /mpi/candidate-pairs/${pair_s4_id}/triage"
