  # ===========================================================================
  - section: consistency_model
    instances:
      - name: confirm_response_reflects_final_price_immediately
        claim_type: immediate
        grounds: [entities.Booking.fields.gross_price_cents, calculations.booking_price]
        distinguishing_aspect: "The confirm response immediately carries the FINAL gross_price_cents and cash_due_cents in the same request (immediate consistency), no re-read needed."
        test_recipe:
          setup: ["PER_HEAT plan base=1500 OFF_PEAK heat; signed-waiver guest; party 2."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T09:00:00Z" }
              as: OpsManager
              as_user_id: "ops-1"
            - call: "POST /attractions"
              payload: { venue_id: "${venue_id}", name: "Karts", kind: "GO_KART", min_height_cm: 0, lane_count: 5 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { attr_id: $.data.id }
            - call: "POST /pricing-plans"
              payload: { venue_id: "${venue_id}", name: "Heat", mode: "PER_HEAT", base_price_cents: 1500 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { plan_id: $.data.id }
            - call: "POST /heats"
              payload: { venue_id: "${venue_id}", attraction_id: "${attr_id}", start_utc: "2026-06-14T10:00:00Z", end_utc: "2026-06-14T10:15:00Z", window: "OFF_PEAK" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { heat_id: $.data.id }
            - call: "POST /heats/${heat_id}/open"
              payload: {}
              as: OpsManager
              as_user_id: "ops-1"
              captures: { heat_v: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "G", height_cm: 180 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { g: $.data.id }
            - call: "POST /waivers"
              payload: { guest_id: "${g}" }
              as: OpsManager
              as_user_id: "ops-1"
            - call: "POST /bookings"
              payload: { venue_id: "${venue_id}", guest_id: "${g}", slot_kind: "HEAT", heat_id: "${heat_id}", pricing_plan_id: "${plan_id}", origin: "RESERVATION", party_size: 2 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { bk: $.data.id }
          trigger:
            - call: "POST /bookings/${bk}/confirm"
              payload: { expected_heat_version: "${heat_v}" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { gross: $.data.gross_price_cents, cash: $.data.cash_due_cents }
          assert:
            - "Booking.${bk}.gross_price_cents == 3000   # 1500*1*2 OFF_PEAK, no combo"
            - "Booking.${bk}.cash_due_cents == 3000"
            - "Booking.${bk}.status == CONFIRMED"
