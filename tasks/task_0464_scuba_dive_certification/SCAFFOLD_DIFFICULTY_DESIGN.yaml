              as: ShopAdmin
              captures: { boat_id: $.data.id }
            - call: "POST /dive-trips"
              payload: { boat_id: "${boat_id}", starts_at: "2026-06-25T08:00:00Z", ends_at: "2026-06-25T12:00:00Z", min_cert_level: "ADVANCED", base_fare_cents: 12000, fill_addon_cents: 1500 }
              as: ShopAdmin
              captures: { trip_id: $.data.id, trip_v: $.data.version }
            - call: "POST /divers"
