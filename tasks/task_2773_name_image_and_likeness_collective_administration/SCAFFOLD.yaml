  - { error_id: ERR_RESUBMISSION_LIMIT_REACHED, http_status: 422, message: "This deliverable has reached its submission limit.", raised_by: "validation priority 33" }
  - { error_id: ERR_TIER_RANK_DUES_INVERSION,   http_status: 422, message: "Tier dues must increase strictly with benefit_rank among OPEN tiers.", raised_by: "validation priority 34" }
  - { error_id: ERR_STRUCTURE_CHANGE_LIMIT,     http_status: 422, message: "This collective has already used its entity-structure changes.", raised_by: "validation priority 35" }
  - { error_id: ERR_STRUCTURE_UNCHANGED,        http_status: 422, message: "The submitted entity_structure matches the current one.", raised_by: "validation priority 35" }
