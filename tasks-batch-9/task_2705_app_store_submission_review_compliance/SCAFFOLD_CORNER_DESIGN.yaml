      - name: mark_remediated_while_the_mapping_is_still_stale_returns_remediation_incomplete
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ImpactAssessment.transitions.REMEDIATION_REQUIRED_to_REMEDIATED
          - errors.ERR_REMEDIATION_INCOMPLETE
        distinguishing_aspect: "MARK_REMEDIATED inspects every feature_code in affected_feature_codes and returns 409 ERR_REMEDIATION_INCOMPLETE while ACCOUNT_DELETION is still STALE, so the row cannot be closed by assertion alone."
        test_recipe:
          setup:
            - "The impact assessment is REMEDIATION_REQUIRED with affected_feature_codes [ACCOUNT_DELETION]; that mapping is STALE."
          setup_api_calls: *CH_IA_REQ
          trigger:
            - call: "POST /impact-assessments/${ia_id}/assess"
              payload: { action: "MARK_REMEDIATED" }
              as: ComplianceOfficer
