              payload: { menu_item_id: "${mi_id}", units_sold: 100, gross_sales_cents: 40000 }
              as: CostAnalyst
          trigger:
            - call: "POST /culinary/menu-period-reviews/${rev_id}/count-lines"
              payload: { ingredient_id: "${ched_id}", opening_base_units: 10000, received_base_units: 0, counted_base_units: 1800 }
              as: CostAnalyst
              captures: { c_exp: $.data.expected_base_units, c_used: $.data.used_base_units, c_var: $.data.variance_base_units, c_sync: $.data.sync_state, c_val: $.data.valued_usage_micros }
            - call: "POST /culinary/menu-period-reviews/${rev_id}/count-lines"
