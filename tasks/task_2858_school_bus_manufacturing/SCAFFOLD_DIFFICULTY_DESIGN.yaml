  - rule_id: transitive_cascade
    instances:

      - name: cascade_a_test_failure_reaches_order_breach_and_damages
        grounds:
          - state_machines.QualityTest.SCHEDULED_to_FAILED
          - state_machines.BusUnit.PENDING_to_NONCONFORMING
          - state_machines.BuildSlot.IN_PROGRESS_to_RELEASED
          - state_machines.BusUnit.BODY_JOINED_to_PLANNED
          - state_machines.ContractOrder.ACTIVE_to_BREACHED
          - calculations.line_capacity_ledger
          - calculations.delivery_posture
          - calculations.liquidated_damages
        distinguishing_aspect: |
          CASCADE-A is four hops deep and crosses four aggregates from a single record-result call:
          test FAILED (hop 1) -> unit NONCONFORMING (hop 2) -> the live slot RELEASED, which unbooks the
          line ledger, reverts the unit to PLANNED and VOIDs the sibling test (hop 3) -> the order
          recomputes its posture to BREACHED and only then computes liquidated damages (hop 4). Nothing
          in the record-result payload mentions the line, the order or damages.
