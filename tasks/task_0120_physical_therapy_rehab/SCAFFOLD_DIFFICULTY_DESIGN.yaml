scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: capped_poc_projection_vs_chronological_actual
        grounds:
          - calculations.capped_poc_projection
          - calculations.capped_poc_projection.variants.chronological_capped_actual
          - entities.PlanOfCare.fields.capped_projection_cents
          - entities.Therapist.fields.credential
          - state_machines.Visit.IN_SESSION_to_SIGNED
        distinguishing_aspect: |
          Operates on the PlanOfCare entity domain (forward-looking, uses planned_visit_count and
          PT/DPT rate regardless of who actually delivers). The chronological variant operates on
          the Visit entity domain (sums actual Visit.charge_cents using actual clinician credential,
          which may be PTA at 3500 cents/unit instead of 4200). For 20 planned visits @ 3 units
          MODERATE complexity, projection = 259500 cents; if every visit is actually delivered by
          a PTA at 30 timed_minutes (= 2 units), actual = 147500 cents. Same plan, different result.
        test_recipe:
          setup:
            - "Patient P1 with insurance_type=MEDICARE_PART_B"
            - "Therapist PT_T1 with credential=DPT, can_evaluate=true"
            - "Therapist PTA_T2 with credential=PTA, can_evaluate=false"
            - "Episode E1 on P1"
            - "Evaluation EV1 on E1: type=INITIAL, clinician=PT_T1, complexity=MODERATE, baseline=50"
            - "POST /evaluations/EV1/finalize -> Episode.cap_policy=CAPPED"
            - "PlanOfCare POC1 on E1: evaluation=EV1, planned_visit_count=20, planned_units_per_visit=3, cert window 90 days"
            - "Authorization A1 on E1 with unit_quota=60 covering cert window"
          trigger:
            - "POST /plan-of-cares/POC1/certify"
            - "Schedule and sign 20 visits each delivered by PTA_T2 with timed_minutes=30 (2 units each), first visit window contains EV1.finalized_at"
          assert:
            - "After certify, PlanOfCare.capped_projection_cents == 259500"
            - "After all 20 visits SIGNED, SUM(Visit.charge_cents) == 147500"
            - "Patient.ytd_capped_amount_cents == 147500"
            - "PlanOfCare.capped_projection_cents - SUM(Visit.charge_cents) == 112000  (the divergence is required, not a bug)"

      - name: forward_projection_vs_kx_threshold_check
        grounds:
          - calculations.capped_poc_projection
          - calculations.poc_cap_remaining_cents
          - entities.Patient.fields.ytd_capped_amount_cents
          - entities.Episode.fields.kx_modifier_required
        distinguishing_aspect: |
          Operates on different entity domains than the previous instance. capped_poc_projection
          writes a PlanOfCare-scoped field at certify; poc_cap_remaining_cents reads only
          Patient.ytd_capped_amount_cents and derives a Patient-scoped status (remaining cents to
          KX threshold and to hard cap). Two interpretations: "has KX been crossed?" tested
          against the live Patient row (correct) vs against the static plan projection (wrong);
          they diverge when the plan projection alone would cross 241000 cents but no visits have
          signed yet, so kx_required must still be false.
        test_recipe:
          setup:
            - "Patient P2 (MEDICARE_PART_B) with ytd_capped_amount_cents=0"
            - "Therapist DPT_T1"
            - "Episode E2 + Eval EV2 (INITIAL MODERATE, baseline=40) finalized"
            - "PlanOfCare POC2 planned_visit_count=20 planned_units_per_visit=3 (projection 259500)"
            - "Authorization A2 unit_quota=60"
          trigger:
            - "POST /plan-of-cares/POC2/certify"
            - "GET /patients/P2/cap-status (before any visits)"
          assert:
            - "PlanOfCare.capped_projection_cents == 259500"
            - "GET cap-status .data.ytd_capped_amount_cents == 0"
            - "GET cap-status .data.kx_required == false  (projection alone does NOT flip kx_required)"
            - "GET cap-status .data.remaining_to_threshold_cents == 241000"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: visit_charge_with_eval_in_window_mode_a
        grounds:
          - calculations.visit_charge_cents
          - calculations.billed_units_eight_minute_rule
          - entities.Therapist.fields.credential
          - entities.Evaluation.fields.complexity
          - entities.Visit.fields.scheduled_start
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs (timed_minutes, clinician.credential,
          eval_in_window flag, eval.complexity) and non-linear branching — units come from the
          8-minute rule (tiered band), the per-unit rate switches on credential, and a discrete
          surcharge is added only when the linked Evaluation.finalized_at falls inside
          [scheduled_start, scheduled_end]. For PT credential, timed_minutes=45 (-> 3 units),
          and a MODERATE eval whose finalized_at lies in the visit window:
          charge_cents = 3*4200 + 7500 = 20100.
        test_recipe:
          setup:
            - "Patient P3 (COMMERCIAL)"
            - "Therapist DPT_T3 (credential=DPT)"
            - "Episode E3 in DRAFT"
            - "Eval EV3 INITIAL MODERATE baseline=55"
            - "POST /evaluations/EV3/finalize at clock T0"
            - "PlanOfCare POC3 cert window covers T0"
            - "Authorization A3 unit_quota=12 covering window"
            - "Schedule Visit V3 on POC3: clinician=DPT_T3, scheduled_start=T0-1min, scheduled_end=T0+59min, units_planned=3"
          trigger:
            - "POST /visits/V3/start"
            - "POST /visits/V3/sign with timed_minutes=45"
          assert:
            - "Visit.units_billed == 3"
            - "Visit.charge_cents == 20100"
            - "(units_billed * 4200) + 7500 == 20100"

      - name: mips_aggregate_then_round_mode_b
        grounds:
          - calculations.mips_quality_score
          - calculations.mips_quality_score.variants.per_measure_round_then_aggregate
          - entities.MipsMeasure.fields.numerator_met
          - entities.MipsMeasure.fields.exception_reason
          - entities.DischargeAssessment.fields.mips_quality_score
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The scaffold pins
          aggregate-then-round_half_up(2dp). The rejected variant rounds each per-measure rate to
          2dp before averaging; for Q126={3met/3applicable}, Q127={2met/3applicable},
          Q128={1met/1applicable after excluding 2 MEDICAL exceptions}, aggregate-then-round =
          88.89 whereas per-measure-round-then-aggregate = 89.00. The two values differ in the
          hundredths digit purely because of rounding-order — a textbook (b) case.
        test_recipe:
          setup:
            - "Patient P4 (COMMERCIAL)"
            - "Therapist DPT_T4 (evaluator)"
            - "Therapist DPT_T5 (discharger) — distinct id"
            - "Episode E4: Eval INITIAL by DPT_T4, plan certified, 3 visits scheduled+signed by DPT_T4"
            - "Three MipsMeasure rows per visit: V_i has (Q126,met=true,NONE), (Q127, V1+V2 met=true / V3 met=false NONE), (Q128 V1 met=true NONE, V2/V3 met=false MEDICAL)"
            - "POST /episodes/E4/discharge-assessments (discharging_clinician_id=DPT_T5, outcome=PARTIAL, final_functional_score=70)"
          trigger:
            - "POST /discharge-assessments/{id}/sign as DPT_T5"
          assert:
            - "DischargeAssessment.mips_quality_score == 88.89"
            - "DischargeAssessment.mips_quality_score != 89.00  (i.e., NOT per-measure-round-then-aggregate)"

      - name: capped_poc_certify_evaluation_order_mode_c
        grounds:
          - calculations.capped_poc_projection
          - state_machines.PlanOfCare.DRAFT_to_CERTIFIED
          - state_machines.PlanOfCare.CERTIFIED_to_ACTIVE
          - state_machines.Episode.EVALUATED_to_ACTIVE
          - entities.Episode.fields.kx_modifier_required
          - entities.Episode.fields.cap_policy
        distinguishing_aspect: |
          Mode (c): circular-looking dependency where evaluation order must be explicit. On
          /plan-of-cares/{id}/certify, FOUR fields are written in a single request — PlanOfCare
          status DRAFT->CERTIFIED->ACTIVE, capped_projection_cents (depends on eval.complexity),
          Episode.kx_modifier_required (depends on whether
          ytd_capped_amount_cents + projection > KX_THRESHOLD_CENTS), and Episode.status
          EVALUATED->ACTIVE. The scaffold pins the order:
          (1) PlanOfCare.status to CERTIFIED, (2) capped_projection_cents written,
          (3) Episode.kx_modifier_required re-derived against the NEW projection, (4)
          PlanOfCare.status to ACTIVE, (5) Episode.status to ACTIVE if first plan.
          Reversing (2) and (3) would test against a stale projection and miss the KX flip.
        test_recipe:
          setup:
            - "Patient P5 MEDICARE_PART_B ytd_capped_amount_cents=200000 (already close to KX_THRESHOLD_CENTS=241000)"
            - "Therapist DPT_T6"
            - "Episode E5; Eval EV5 INITIAL MODERATE finalized -> Episode.cap_policy=CAPPED, kx_modifier_required=false"
            - "PlanOfCare POC5 planned_visit_count=20 planned_units_per_visit=3 (projection=259500)"
            - "Authorization A5 unit_quota=60"
          trigger:
            - "POST /plan-of-cares/POC5/certify"
          assert:
            - "PlanOfCare.status == 'ACTIVE'  (single request transitions through CERTIFIED to ACTIVE)"
            - "PlanOfCare.capped_projection_cents == 259500"
            - "Episode.kx_modifier_required == true  (200000 + 259500 = 459500 > 241000)"
            - "Episode.status == 'ACTIVE'"
            - "Patient.ytd_capped_amount_cents == 200000  (projection does NOT increment YTD)"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: episode_reeval_cycle_branching
        grounds:
          - state_machines.Episode.ACTIVE_to_REEVAL_DUE
          - state_machines.Episode.REEVAL_DUE_to_ACTIVE
          - state_machines.Episode.REEVAL_DUE_to_DISCHARGE_PENDING
          - state_machines.Evaluation.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          Episode is a cyclic + branching machine: ACTIVE -> REEVAL_DUE -> ACTIVE forms a cycle
          (revision loop driven by 30-day reeval requirement), and from REEVAL_DUE there is a
          fork — either finalize a REEVAL Evaluation (cycles back to ACTIVE) or start a
          DischargeAssessment (branches to DISCHARGE_PENDING with a divergent side-effect set:
          authorizations expire, HEPs supersede). A linear pipeline A->B->C cannot model this.
        test_recipe:
          setup:
            - "Episode E6 in ACTIVE with one FINALIZED INITIAL Evaluation at clock T0"
            - "Authorization A6 with unit_quota=60 valid for 120 days"
            - "Plan POC6 ACTIVE"
          trigger:
            - "POST /_clock/advance to T0 + 31 days  -> Episode.status becomes REEVAL_DUE"
            - "POST /episodes/E6/evaluations type=REEVAL clinician=DPT_T7 complexity=LOW baseline=70"
            - "POST /evaluations/{id}/finalize  -> Episode.status returns to ACTIVE"
          assert:
            - "Between calls 1 and 2, GET Episode shows status='REEVAL_DUE'"
            - "After call 3, GET Episode shows status='ACTIVE'"
            - "Episode has visited the state set {ACTIVE, REEVAL_DUE, ACTIVE} confirming a cycle"

      - name: home_exercise_program_supersede_branching
        grounds:
          - state_machines.HomeExerciseProgram.DRAFT_to_ISSUED
          - state_machines.HomeExerciseProgram.ISSUED_to_ACKNOWLEDGED
          - state_machines.HomeExerciseProgram.ISSUED_to_SUPERSEDED
          - state_machines.HomeExerciseProgram.ACKNOWLEDGED_to_SUPERSEDED
        distinguishing_aspect: |
          HomeExerciseProgram is a branching diamond on a different entity than Episode:
          ISSUED splits into either ACKNOWLEDGED (patient action) or SUPERSEDED (system action
          when a newer HEP is issued or Episode discharges). Both sink to terminal SUPERSEDED but
          via divergent triggers and actors. A second HEP issuance on the same Episode causes the
          older HEP — whether ISSUED or ACKNOWLEDGED — to transition to SUPERSEDED, not the new
          one.
        test_recipe:
          setup:
            - "Episode E7 ACTIVE; PlanOfCare POC7 ACTIVE"
            - "HEP H1 created and POST /home-exercise-programs/H1/issue (status=ISSUED)"
            - "POST /home-exercise-programs/H1/acknowledge as Patient (status=ACKNOWLEDGED)"
            - "HEP H2 created on same Episode"
          trigger:
            - "POST /home-exercise-programs/H2/issue"
          assert:
            - "After trigger, GET H1.status == 'SUPERSEDED'"
            - "After trigger, GET H2.status == 'ISSUED'"
            - "H1 path was DRAFT -> ISSUED -> ACKNOWLEDGED -> SUPERSEDED — branching with two distinct exits from ISSUED proven across H1 and H2"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: discharge_signs_cascade_depth_3
        grounds:
          - state_machines.DischargeAssessment.DRAFT_to_SIGNED
          - state_machines.Episode.DISCHARGE_PENDING_to_DISCHARGED
          - state_machines.HomeExerciseProgram.ISSUED_to_SUPERSEDED
          - calculations.mips_quality_score
        distinguishing_aspect: |
          Depth-3 cascade originating from POST /discharge-assessments/{id}/sign:
          (1) DischargeAssessment.DRAFT->SIGNED (the direct mutation);
          (2) the SIGNED row causes Episode.DISCHARGE_PENDING->DISCHARGED (link 2 is triggered
              by link 1, not by the original API call);
          (3) the DISCHARGED Episode causes any HEP in {ISSUED, ACKNOWLEDGED} on that Episode to
              transition to SUPERSEDED, and APPROVED Authorizations to EXPIRED (link 3 is
              triggered by link 2).
          Each link is caused by its predecessor, satisfying the "not fan-out" clause.
        test_recipe:
          setup:
            - "Episode E8 in DISCHARGE_PENDING with a DRAFT DischargeAssessment D8 (discharger != evaluator)"
            - "HEP H3 on E8 in ACKNOWLEDGED"
            - "Authorization A8 on E8 in APPROVED"
            - "3 MipsMeasure rows present so mips_quality_score writes a non-zero value"
          trigger:
            - "POST /discharge-assessments/D8/sign"
          assert:
            - "DischargeAssessment.status == 'SIGNED'"
            - "Episode.status == 'DISCHARGED'  (link 2 — caused by link 1)"
            - "HomeExerciseProgram.status == 'SUPERSEDED'  (link 3 — caused by link 2)"
            - "Authorization.status == 'EXPIRED'             (link 3 — caused by link 2)"

      - name: visit_sign_cascade_kx_depth_2
        grounds:
          - state_machines.Visit.IN_SESSION_to_SIGNED
          - calculations.visit_charge_cents
          - entities.Patient.fields.ytd_capped_amount_cents
          - entities.Episode.fields.kx_modifier_required
          - entities.Visit.fields.kx_applied
        distinguishing_aspect: |
          Depth-2 cascade originating from POST /visits/{id}/sign (different trigger than the
          discharge cascade):
          (1) Visit.IN_SESSION->SIGNED with charge_cents computed (the direct mutation);
          (2) Patient.ytd_capped_amount_cents += charge_cents — and IF the new YTD exceeds
              KX_THRESHOLD_CENTS, Episode.kx_modifier_required flips to true AND the current
              Visit.kx_applied is set to true. Link 2's flip is caused by link 1's increment,
              not by the original API call.
        test_recipe:
          setup:
            - "Patient P9 (MEDICARE_PART_B) with ytd_capped_amount_cents=237000  (below KX_THRESHOLD_CENTS=241000)"
            - "Episode E9 ACTIVE with cap_policy=CAPPED, kx_modifier_required=false"
            - "Plan POC9 ACTIVE, Authorization A9 unit_quota=12"
            - "Visit V9 IN_SESSION with units_planned=3, clinician=DPT, no eval in window"
          trigger:
            - "POST /visits/V9/sign with timed_minutes=45"
          assert:
            - "Visit.units_billed == 3"
            - "Visit.charge_cents == 12600  (3*4200)"
            - "Patient.ytd_capped_amount_cents == 249600  (237000 + 12600 — link 1 effect)"
            - "Episode.kx_modifier_required == true  (link 2 caused by link 1 crossing 241000)"
            - "Visit.kx_applied == true             (link 2 same)"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_pair
        grounds:
          - validations[priority=6]
          - validations[priority=17]
        distinguishing_aspect: |
          Pair is (state) vs (business_fiscal). On POST /visits, scheduling a visit on an Episode
          in REEVAL_DUE while ALSO requesting more units than Episode.total_authorized_units can
          accommodate — priority 7 (state: ERR_REEVAL_DUE) MUST win over priority 17
          (business_fiscal: ERR_INSUFFICIENT_UNITS). A wrong implementation that surfaces the
          unit-shortfall first yields ERR_INSUFFICIENT_UNITS.
        test_recipe:
          setup:
            - "Episode E10 in REEVAL_DUE (created ACTIVE then clock-advanced past 30 days)"
            - "Plan POC10 still ACTIVE; Authorization A10 unit_quota=2"
            - "Existing SCHEDULED Visit on E10 consuming all 2 units"
          trigger:
            - "POST /episodes/E10/visits  units_planned=4  (would fail BOTH ERR_REEVAL_DUE and ERR_INSUFFICIENT_UNITS)"
          assert:
            - "HTTP 409"
            - "response.data.error_id == 'ERR_REEVAL_DUE'  (state wins over business_fiscal)"

      - name: business_safety_vs_business_referential_pair
        grounds:
          - validations[priority=8]
          - validations[priority=10]
        distinguishing_aspect: |
          Pair is (business_safety) vs (business_referential), distinct from the previous
          pair. A VA-insured patient with NO VeteranReferral attempts to finalize an Evaluation
          as a PTA-credential therapist. business_safety priority 8
          (ERR_THERAPIST_NOT_LICENSED_TO_EVALUATE on /evaluations/finalize) is upstream of
          business_referential priority 10 (ERR_VETERAN_REFERRAL_REQUIRED, which applies only
          to /visits). On the relevant /finalize call the licensing check must win. (Tested
          structurally: even when both classes of error are imminent for this Patient/Episode,
          finalizing the Evaluation with a PTA surfaces ERR_THERAPIST_NOT_LICENSED_TO_EVALUATE.)
        test_recipe:
          setup:
            - "Patient P11 VA, NO VeteranReferral yet"
            - "Therapist PTA_T11 credential=PTA can_evaluate=false"
            - "Episode E11 DRAFT"
            - "Eval EV11 type=INITIAL clinician=PTA_T11 complexity=LOW baseline=40"
          trigger:
            - "POST /evaluations/EV11/finalize as PTA_T11"
          assert:
            - "HTTP 403"
            - "response.data.error_id == 'ERR_THERAPIST_NOT_LICENSED_TO_EVALUATE'  (business_safety wins over business_referential)"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: eight_minute_rule_lower_boundary
        grounds:
          - calculations.billed_units_eight_minute_rule
          - endpoints[POST /visits/{visit_id}/sign]
        distinguishing_aspect: |
          Numeric threshold boundary at timed_minutes >= 8 (not > 8). The scaffold pins
          minutes < 8 -> 0 units, minutes >= 8 -> 1 unit. Two adjacent inputs differing by 1
          yield qualitatively different units_billed values:
          timed_minutes=7 -> 0 units, charge_cents=0; timed_minutes=8 -> 1 unit, charge_cents=4200.
          Endpoint: POST /visits/{visit_id}/sign.
        test_recipe:
          setup:
            - "Two parallel episodes/visits identical except for the timed_minutes used at sign"
            - "Visit Va: timed_minutes plan 1, clinician=DPT, no eval in window"
            - "Visit Vb: identical sibling"
          trigger:
            - "POST /visits/Va/sign timed_minutes=7"
            - "POST /visits/Vb/sign timed_minutes=8"
          assert:
            - "Va.units_billed == 0 AND Va.charge_cents == 0"
            - "Vb.units_billed == 1 AND Vb.charge_cents == 4200"

      - name: mips_empty_applicable_set_boundary
        grounds:
          - calculations.mips_quality_score
          - entities.MipsMeasure.fields.exception_reason
          - endpoints[POST /discharge-assessments/{discharge_id}/sign]
        distinguishing_aspect: |
          Different metric (count-of-applicable-measures empty-set boundary) and different
          endpoint (POST /discharge-assessments/{id}/sign). If every MipsMeasure row has
          exception_reason != NONE — i.e., applicable_rows is empty for every measure code —
          mips_quality_score MUST be 0.00 (the zero-division fallback), not undefined and not
          rejected.
        test_recipe:
          setup:
            - "Episode E13 DISCHARGE_PENDING with valid discharger != evaluator"
            - "Three MipsMeasure rows, all numerator_met=false, all exception_reason=MEDICAL"
          trigger:
            - "POST /discharge-assessments/{id}/sign"
          assert:
            - "HTTP 200"
            - "DischargeAssessment.mips_quality_score == 0.00  (empty applicable set -> 0.00, not error)"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: visit_start_requires_episode_active
        grounds:
          - state_machines.Visit.SCHEDULED_to_IN_SESSION
          - state_machines.Episode.ACTIVE_to_REEVAL_DUE
          - validations[priority=6]
        distinguishing_aspect: |
          Pair is (Visit, Episode). Visit.SCHEDULED->IN_SESSION transition's preconditions test
          Episode.status — specifically, the transition is rejected when the parent Episode is
          in REEVAL_DUE even if the Visit row itself is perfectly valid.
        test_recipe:
          setup:
            - "Episode E14 ACTIVE, plan ACTIVE, Visit V14 SCHEDULED valid"
            - "POST /_clock/advance past 30 days from latest Evaluation.finalized_at -> Episode.status='REEVAL_DUE'"
          trigger:
            - "POST /visits/V14/start"
          assert:
            - "HTTP 409"
            - "response.data.error_id == 'ERR_EPISODE_NOT_ACTIVE'"
            - "Visit.status remains 'SCHEDULED' (no transition occurred)"

      - name: poc_certify_requires_evaluation_finalized
        grounds:
          - state_machines.PlanOfCare.DRAFT_to_CERTIFIED
          - state_machines.Evaluation.DRAFT_to_FINALIZED
          - validations[priority=5]
        distinguishing_aspect: |
          Different entity pair (PlanOfCare, Evaluation). PlanOfCare.DRAFT->CERTIFIED's
          preconditions test the linked Evaluation's status — Evaluation MUST be FINALIZED or
          AMENDED. A DRAFT Evaluation blocks certification regardless of the PlanOfCare row's own
          validity.
        test_recipe:
          setup:
            - "Episode E15 DRAFT"
            - "Eval EV15 INITIAL DRAFT (not finalized)"
            - "Plan POC15 created referencing EV15"
            - "Authorization A15 covering the cert window"
          trigger:
            - "POST /plan-of-cares/POC15/certify"
          assert:
            - "HTTP 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'  (linked Evaluation not in FINALIZED/AMENDED)"
            - "PlanOfCare.status remains 'DRAFT'"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: clinician_double_booking_half_open
        grounds:
          - validations[priority=14]
          - entities.Visit.fields.scheduled_start
          - entities.Visit.fields.scheduled_end
          - errors[ERR_CLINICIAN_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Resource: Therapist (clinician). Interval semantics: half-open [start, end).
          Back-to-back visits sharing an instant (V1 ends exactly when V2 starts) DO NOT
          overlap and BOTH succeed. Geometric distinction: under half-open arithmetic the
          point of contact is allowed.
        test_recipe:
          setup:
            - "Episode E16 ACTIVE on Patient_a, Plan ACTIVE, Auth, clinician=DPT_T16"
            - "Episode E16b ACTIVE on Patient_b same clinician=DPT_T16 (different patient so patient-overlap rule does not interfere)"
            - "Existing SCHEDULED Visit Vx on E16: scheduled_start=10:00 scheduled_end=11:00 clinician=DPT_T16"
          trigger:
            - "POST /episodes/E16b/visits scheduled_start=11:00 scheduled_end=12:00 clinician=DPT_T16"
            - "POST /episodes/E16b/visits scheduled_start=10:59 scheduled_end=11:30 clinician=DPT_T16"
          assert:
            - "Trigger 1 returns 201 (half-open: 11:00==11:00 is NOT overlap)"
            - "Trigger 2 returns 409 ERR_CLINICIAN_DOUBLE_BOOKED (10:59 < 11:00 IS overlap)"

      - name: patient_double_booking_closed
        grounds:
          - validations[priority=15]
          - entities.Visit.fields.scheduled_start
          - entities.Visit.fields.scheduled_end
          - errors[ERR_PATIENT_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Different resource (Patient via Episode) and different interval semantics: closed
          [start, end]. Back-to-back visits sharing an instant DO overlap and the second is
          rejected — a patient cannot be in two places at the same instant. Adjacency arithmetic
          is the opposite of the clinician rule.
        test_recipe:
          setup:
            - "Patient P17"
            - "Two episodes E17a and E17b on P17, both ACTIVE, Plans ACTIVE, Auths, different clinicians DPT_T17a and DPT_T17b (so clinician rule does not interfere)"
            - "Existing SCHEDULED Visit on E17a scheduled_start=14:00 scheduled_end=15:00 clinician=DPT_T17a"
          trigger:
            - "POST /episodes/E17b/visits scheduled_start=15:00 scheduled_end=16:00 clinician=DPT_T17b"
          assert:
            - "HTTP 409"
            - "response.data.error_id == 'ERR_PATIENT_DOUBLE_BOOKED'  (closed-interval adjacency overlaps)"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: unit_reservation_release_invariant
        grounds:
          - state_machines.Visit.SCHEDULED_to_CANCELLED
          - calculations.episode_unit_balance
          - entities.Episode.fields.total_reserved_units
          - entities.Episode.fields.total_authorized_units
        distinguishing_aspect: |
          Conserved quantity: unit pool, defined as
              total_authorized_units - total_reserved_units - total_committed_units
          For any (POST /visits create) paired with its compensating (POST /visits/{id}/cancel)
          while still SCHEDULED, the named quantity MUST equal its pre-action value with zero
          drift. Specifically before and after the pair:
              total_authorized_units, total_reserved_units, total_committed_units MUST be
              identical to their pre-create values.
        test_recipe:
          setup:
            - "Episode E18 ACTIVE; Plan ACTIVE; Authorization A18 unit_quota=10"
            - "GET /episodes/E18 -> snapshot {total_authorized_units=10, total_reserved_units=0, total_committed_units=0}"
          trigger:
            - "POST /episodes/E18/visits  units_planned=3  (creates V18 SCHEDULED)"
            - "POST /visits/V18/cancel"
          assert:
            - "After trigger 1: total_reserved_units == 3 (forward action)"
            - "After trigger 2: total_authorized_units == 10  AND  total_reserved_units == 0  AND  total_committed_units == 0  (invariant holds: drift==0)"

      - name: cap_ytd_no_drift_on_cancel_before_sign
        grounds:
          - state_machines.Visit.SCHEDULED_to_CANCELLED
          - state_machines.Visit.IN_SESSION_to_SIGNED
          - calculations.visit_charge_cents
          - entities.Patient.fields.ytd_capped_amount_cents
        distinguishing_aspect: |
          Different conserved quantity: Patient.ytd_capped_amount_cents. The forward action is a
          Visit lifecycle that ends BEFORE sign (SCHEDULED->IN_SESSION->CANCELLED), the
          compensating action is the same cancel. Patient.ytd_capped_amount_cents MUST remain
          identical to its pre-action value with zero drift — sign is the ONLY producer of
          ytd_capped_amount_cents increments, so unsigned cancellations cannot leak cents.
        test_recipe:
          setup:
            - "Patient P19 (MEDICARE_PART_B) ytd_capped_amount_cents=237000"
            - "Episode E19 ACTIVE cap_policy=CAPPED; Plan ACTIVE; Authorization unit_quota=10"
          trigger:
            - "POST /episodes/E19/visits units_planned=3 -> V19 SCHEDULED"
            - "POST /visits/V19/start  -> V19 IN_SESSION"
            - "POST /visits/V19/cancel -> V19 CANCELLED"
          assert:
            - "Patient.ytd_capped_amount_cents == 237000 (unchanged across the entire cycle)"
            - "Visit.charge_cents == 0 (never written because never SIGNED)"
            - "Episode.total_committed_units == 0 (no committed units)"
            - "Episode.total_reserved_units == 0 (reservation released by cancel)"
