      - name: err_circle_frozen_blocks_member_invite
        claim_type: ViolationToError
        grounds:
          - errors.ERR_CIRCLE_FROZEN
          - validations[priority=5]
        distinguishing_aspect: "Member invite on a FROZEN circle is rejected 409 ERR_CIRCLE_FROZEN."
        test_recipe:
