  - rule_id: compensating_invariant
    instances:
      - name: endorsement_void_restores_policy_written_premium_exactly
        grounds:
          - calculations.policy_written_premium
          - state_machines.Endorsement.status.QUOTED_to_BOUND
          - state_machines.Endorsement.status.BOUND_to_VOID
          - state_machines.AircraftSchedule.coverage_status.ACTIVE_to_REMOVED
          - calculations.endorsement_premium_delta
          - entities.PremiumTransaction.fields.txn_type
          - validations[priority=25]
        distinguishing_aspect: |
          The conserved quantity is MONEY on the append-only premium ledger. Binding an ADD_AIRCRAFT
          endorsement charges a pro-rata delta and materialises a new ACTIVE schedule; voiding it
          before inception must append the EXACT negation (no short-rate penalty, deliberately unlike
          the REMOVE_AIRCRAFT branch of calculations.endorsement_premium_delta, which floors a 90%
          short-rate return) and must retract the schedule, so written_premium_cents returns to the
          byte-identical pre-bind figure while the ledger keeps all three rows. Nothing is erased: the
          invariant written_premium_cents == sum(ledger) has to hold on a ledger that now nets to the
          original value.
        test_recipe:
          setup:
            - "Clock parked at 2026-08-15T00:00:00Z for the whole test, which is strictly before the endorsement's 2026-11-01 effective_date, so the BOUND -> VOID transition is legal."
