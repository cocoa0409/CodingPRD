              as: SupplyChainAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /supply-centers/${center_id}/products/${prod_id}/discontinue"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores"
              payload: { store_number: "ST-PU", operator_name: "PU", credit_limit_cents: 1000000 }
