            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:05:00Z" }
              as: ProgramAdmin
            - call: "GET /drive-thru/restaurants/${r_id}"
              payload: {}
              as: ProgramAdmin
              captures: { rv1: $.data.version }
            - call: "POST /drive-thru/throughput-reports"
              payload: { restaurant_id: "${r_id}", window_start_at: "2026-08-01T11:00:00Z", window_end_at: "2026-08-01T11:05:00Z", variant: "PROVISIONAL", expected_restaurant_version: "${rv1}" }
              as: MarketCoach
              as_user_id: "coach-1"
              captures: { rep_id: $.data.id, rep_state_initial: $.data.report_state, rep_band: $.data.attainment_band, rep_pts: $.data.coaching_pool_points }
          trigger:
            - call: "POST /drive-thru/coaching-interventions"
              payload: { throughput_report_id: "${rep_id}", staff_member_id: "${sl_id}", focus_segment: "GREET" }
              as: MarketCoach
              as_user_id: "coach-1"
              captures: { err: $.data.error_id }
            - call: "POST /drive-thru/throughput-reports/${rep_id}/publish"
              payload: {}
              as: MarketCoach
              as_user_id: "coach-1"
            - call: "POST /drive-thru/coaching-interventions"
              payload: { throughput_report_id: "${rep_id}", staff_member_id: "${sl_id}", focus_segment: "GREET" }
              as: MarketCoach
              as_user_id: "coach-1"
