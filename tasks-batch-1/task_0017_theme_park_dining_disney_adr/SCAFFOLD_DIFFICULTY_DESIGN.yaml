        distinguishing_aspect: |
          Depth-2 transitive cascade originating from POST /v1/reservations/{id}/mark-no-show
          (different trigger from instance 1): hop 1 increments Guest.no_show_strike_count
          (from 4 → 5); hop 2 (caused by the counter reaching the threshold ≥5) sets
          Guest.status=SUSPENDED. Hop 2 is causally triggered by hop 1's value change —
