scaffold_corner_design:
  - section: endpoints
    instances:
      - name: rider_create_returns_full_success_envelope
        claim_type: standard_crud
        grounds: ['endpoints."POST /riders"', 'entities.Rider']
        distinguishing_aspect: "POST /riders returns HTTP 201 with meta.api_request_id, meta.api_request_timestamp, response_type object and a data object carrying every declared Rider field."
        test_recipe:
          setup: ["Empty database, logical clock untouched so it reads LOGICAL_CLOCK_DEFAULT_UTC."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /riders"
              payload: { full_name: "Rae Rider", date_of_birth: "2012-03-04", weight_lb: 150, household_income_band: "BAND_B", demographic_group: "ADULT", program_code: "THERAPEUTIC_RIDING", condition_codes: ["CP_MILD_ASD"] }
              as: IntakeCoordinator
              captures: { r1_id: "$.data.id", r1_v: "$.data.version" }
          assert:
            - "HTTP status is 201"
            - "response_type == object and meta.api_request_id is a non-empty string"
            - "Rider.${r1_id}.status == INTAKE"
            - "${r1_v} == 1"
            - "Rider.${r1_id}.funding_mode == PRIVATE_PAY_ALLOWED (declared default applied)"
            - "Rider.${r1_id}.payer_rate_cents == 0 (declared default applied)"
            - "Rider.${r1_id}.assessment_status == NEVER_ASSESSED"
            - "Rider.${r1_id}.independence_level == null and required_sidewalker_count == null"

      - name: riders_list_returns_pagination_envelope_with_defaults
        claim_type: listing
        grounds: ['endpoints."GET /riders"', 'response_envelope.pagination_defaults']
        distinguishing_aspect: "GET /riders with no query parameters returns limit 10, offset 0, an accurate total_count and has_more false for a 3-row table."
        test_recipe:
          setup: ["Three riders exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /riders"
              payload: { full_name: "Rider One", date_of_birth: "2012-03-04", weight_lb: 150, household_income_band: "BAND_A", demographic_group: "YOUTH", program_code: "THERAPEUTIC_RIDING", condition_codes: [] }
              as: IntakeCoordinator
            - call: "POST /riders"
              payload: { full_name: "Rider Two", date_of_birth: "2010-03-04", weight_lb: 150, household_income_band: "BAND_B", demographic_group: "ADULT", program_code: "HIPPOTHERAPY", condition_codes: [] }
              as: IntakeCoordinator
            - call: "POST /riders"
              payload: { full_name: "Rider Three", date_of_birth: "1960-03-04", weight_lb: 150, household_income_band: "BAND_C", demographic_group: "SENIOR", program_code: "EQUINE_LEARNING", condition_codes: [] }
              as: IntakeCoordinator
          trigger:
            - call: "GET /riders"
              payload: {}
              as: IntakeCoordinator
          assert:
            - "response_type == array"
            - "meta or body pagination reports limit == 10, offset == 0, total_count == 3, has_more == false"
            - "The data array has exactly 3 elements"
            - "GET /riders with program_code HIPPOTHERAPY returns total_count == 1"

      - name: riders_list_pagination_limit_above_max_returns_400
        claim_type: listing
        grounds: ['endpoints."GET /riders"', 'validations[priority=5]', 'errors[ERR_VALIDATION]']
        distinguishing_aspect: "limit 101 exceeds the declared maximum of 100 and is rejected with ERR_VALIDATION at rung 5, before any row is read."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /riders"
              payload: { limit: 101 }
              as: IntakeCoordinator
              captures: { err_id: "$.data.error_id" }
          assert:
            - "${err_id} == ERR_VALIDATION with HTTP status 400"
            - "response_type == error"

      - name: eligibility_read_reports_release_active_at_booking_and_expired_at_ride
        claim_type: computed_read
        grounds:
          - endpoints."GET /sessions/{session_id}/eligibility"
          - calculations.medical_release_validity_at_instant
          - calculations.instructor_certification_status_at_instant
        distinguishing_aspect: "One session booked 2026-05-11 whose ride date is 2027-05-11 reports release_status ACTIVE under variant at_booking_instant and EXPIRED under variant at_ride_instant from identical stored data."
        test_recipe:
          setup:
            - "Clock 2026-05-11T00:00:00Z; MASTER instructor; horse Comet; LEVEL_4 rider Rae."
            - "The rider's release was signed 2026-04-01 so expires_at is 2027-04-01T00:00:00.000Z."
            - "A 60-minute session is booked for 2027-05-11T10:00:00Z, i.e. after the release expires."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /condition-policies"
              payload: { condition_code: "CP_MILD_ASD", activity_type: "THERAPEUTIC_RIDING", tier: "CLEAR", min_instructor_tier: "REGISTERED" }
              as: ProgramAdmin
            - call: "POST /horses"
              payload: { name: "Comet", body_weight_lb: 1100, tack_weight_lb: 30 }
              as: ProgramAdmin
              captures: { h1_id: "$.data.id" }
            - call: "POST /instructors"
              payload: { full_name: "Ada Reins", certification_level: "MASTER", certification_expires_at: "2028-04-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { i1_id: "$.data.id" }
            - call: "POST /riders"
              payload: { full_name: "Rae Rider", date_of_birth: "2012-03-04", weight_lb: 150, household_income_band: "BAND_D", demographic_group: "ADULT", program_code: "THERAPEUTIC_RIDING", condition_codes: ["CP_MILD_ASD"], funding_mode: "PRIVATE_PAY_ALLOWED", payer_rate_cents: 0 }
              as: IntakeCoordinator
              captures: { r1_id: "$.data.id", r1_v1: "$.data.version" }
            - call: "POST /riders/${r1_id}/medical-releases"
              payload: { signed_on: "2026-04-01", physician_name: "Dr Oak", cleared_condition_codes: [], expected_rider_version: "${r1_v1}" }
              as: IntakeCoordinator
              captures: { rel1_id: "$.data.id", rel1_exp: "$.data.expires_at" }
            - call: "GET /riders/${r1_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { r1_v2: "$.data.version" }
            - call: "POST /riders/${r1_id}/assessments"
              payload: { assessment_type: "INTAKE", performed_on: "2026-04-01", balance_score: 9, trunk_control_score: 9, rider_weight_lb: 150, backriding_required: false, expected_rider_version: "${r1_v2}" }
              as: Instructor
              as_user_id: "${i1_id}"
            - call: "POST /riders/${r1_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /sessions"
              payload: { rider_id: "${r1_id}", horse_id: "${h1_id}", instructor_id: "${i1_id}", activity_type: "THERAPEUTIC_RIDING", scheduled_start: "2027-05-11T10:00:00Z", duration_minutes: 60 }
              as: Instructor
              as_user_id: "${i1_id}"
              captures: { s1_id: "$.data.id" }
          trigger:
            - call: "GET /sessions/${s1_id}/eligibility"
              payload: { variant: "at_booking_instant" }
              as: Instructor
              as_user_id: "${i1_id}"
              captures: { rel_at_booking: "$.data.release_status" }
            - call: "GET /sessions/${s1_id}/eligibility"
              payload: { variant: "at_ride_instant" }
              as: Instructor
              as_user_id: "${i1_id}"
              captures: { rel_at_ride: "$.data.release_status" }
          assert:
            - "${rel1_exp} == 2027-04-01T00:00:00.000Z"
            - "${rel_at_booking} == ACTIVE"
            - "${rel_at_ride} == EXPIRED"
            - "Both responses report instructor_certification_status == CURRENT, quoted_fee_cents == 9000 and horse_max_load_lb == 220.0"
            - "The at_booking_instant response reports admissible == true and the at_ride_instant response reports admissible == false with blocking_gate naming the medical release gate"

      - name: eligibility_read_reports_load_at_assessment_vs_current_declared
        claim_type: computed_read
        grounds: ['endpoints."GET /sessions/{session_id}/eligibility"', 'calculations.effective_load_lb', 'endpoints."PATCH /riders/{rider_id}"']
        distinguishing_aspect: "After PATCHing weight_lb from 150 to 180, the eligibility read gives effective_load_lb 210.0 for variant current_declared and 180.0 for variant at_assessment."
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z; horse Comet (tack 30 lb); LEVEL_4 rider assessed at rider_weight_lb 150."
            - "A 60-minute session exists; afterwards the rider's declared weight is PATCHed to 180."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /condition-policies"
              payload: { condition_code: "CP_MILD_ASD", activity_type: "THERAPEUTIC_RIDING", tier: "CLEAR", min_instructor_tier: "REGISTERED" }
              as: ProgramAdmin
            - call: "POST /horses"
              payload: { name: "Comet", body_weight_lb: 1100, tack_weight_lb: 30 }
              as: ProgramAdmin
              captures: { h1_id: "$.data.id" }
            - call: "POST /instructors"
              payload: { full_name: "Ada Reins", certification_level: "MASTER", certification_expires_at: "2028-04-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { i1_id: "$.data.id" }
            - call: "POST /riders"
              payload: { full_name: "Rae Rider", date_of_birth: "2012-03-04", weight_lb: 150, household_income_band: "BAND_D", demographic_group: "ADULT", program_code: "THERAPEUTIC_RIDING", condition_codes: ["CP_MILD_ASD"], funding_mode: "PRIVATE_PAY_ALLOWED", payer_rate_cents: 0 }
              as: IntakeCoordinator
              captures: { r1_id: "$.data.id", r1_v1: "$.data.version" }
            - call: "POST /riders/${r1_id}/medical-releases"
              payload: { signed_on: "2026-04-01", physician_name: "Dr Oak", cleared_condition_codes: [], expected_rider_version: "${r1_v1}" }
              as: IntakeCoordinator
            - call: "GET /riders/${r1_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { r1_v2: "$.data.version" }
            - call: "POST /riders/${r1_id}/assessments"
              payload: { assessment_type: "INTAKE", performed_on: "2026-04-01", balance_score: 9, trunk_control_score: 9, rider_weight_lb: 150, backriding_required: false, expected_rider_version: "${r1_v2}" }
              as: Instructor
              as_user_id: "${i1_id}"
            - call: "POST /riders/${r1_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /sessions"
              payload: { rider_id: "${r1_id}", horse_id: "${h1_id}", instructor_id: "${i1_id}", activity_type: "THERAPEUTIC_RIDING", scheduled_start: "2026-05-11T10:00:00Z", duration_minutes: 60 }
              as: Instructor
              as_user_id: "${i1_id}"
              captures: { s1_id: "$.data.id" }
            - call: "PATCH /riders/${r1_id}"
              payload: { weight_lb: 180 }
              as: IntakeCoordinator
          trigger:
            - call: "GET /sessions/${s1_id}/eligibility"
              payload: { variant: "current_declared" }
              as: Instructor
              as_user_id: "${i1_id}"
              captures: { load_now: "$.data.effective_load_lb" }
            - call: "GET /sessions/${s1_id}/eligibility"
              payload: { variant: "at_assessment" }
              as: Instructor
              as_user_id: "${i1_id}"
              captures: { load_assess: "$.data.effective_load_lb" }
          assert:
            - "${load_now} == 210.0"
            - "${load_assess} == 180.0"
            - "Both responses report horse_max_load_lb == 220.0 and admissible == true"

      - name: horse_workload_delivered_variant_counts_only_completed_mounted_minutes
        claim_type: computed_read
        grounds: ['endpoints."GET /horses/{horse_id}/workload"', 'calculations.horse_workload_minutes']
        distinguishing_aspect: "For a horse with one COMPLETED 60-minute session ridden 45 minutes and one CREW_PENDING 60-minute session on the same day, committed reports day_minutes 120 and delivered reports day_minutes 45."
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z; LEVEL_4 rider; MASTER instructor; horse Comet."
            - "Session A 2026-05-11T09:00:00Z for 60 minutes is COMPLETED with mounted_minutes 45; Session B 2026-05-11T10:15:00Z for 60 minutes stays CREW_PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /condition-policies"
              payload: { condition_code: "CP_MILD_ASD", activity_type: "THERAPEUTIC_RIDING", tier: "CLEAR", min_instructor_tier: "REGISTERED" }
              as: ProgramAdmin
            - call: "POST /horses"
              payload: { name: "Comet", body_weight_lb: 1100, tack_weight_lb: 30 }
              as: ProgramAdmin
              captures: { h1_id: "$.data.id" }
            - call: "POST /instructors"
              payload: { full_name: "Ada Reins", certification_level: "MASTER", certification_expires_at: "2028-04-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { i1_id: "$.data.id" }
            - call: "POST /riders"
              payload: { full_name: "Rae Rider", date_of_birth: "2012-03-04", weight_lb: 150, household_income_band: "BAND_D", demographic_group: "ADULT", program_code: "THERAPEUTIC_RIDING", condition_codes: ["CP_MILD_ASD"], funding_mode: "PRIVATE_PAY_ALLOWED", payer_rate_cents: 0 }
              as: IntakeCoordinator
              captures: { r1_id: "$.data.id", r1_v1: "$.data.version" }
            - call: "POST /riders/${r1_id}/medical-releases"
              payload: { signed_on: "2026-04-01", physician_name: "Dr Oak", cleared_condition_codes: [], expected_rider_version: "${r1_v1}" }
              as: IntakeCoordinator
            - call: "GET /riders/${r1_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { r1_v2: "$.data.version" }
            - call: "POST /riders/${r1_id}/assessments"
              payload: { assessment_type: "INTAKE", performed_on: "2026-04-01", balance_score: 9, trunk_control_score: 9, rider_weight_lb: 150, backriding_required: false, expected_rider_version: "${r1_v2}" }
              as: Instructor
              as_user_id: "${i1_id}"
            - call: "POST /riders/${r1_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /sessions"
              payload: { rider_id: "${r1_id}", horse_id: "${h1_id}", instructor_id: "${i1_id}", activity_type: "THERAPEUTIC_RIDING", scheduled_start: "2026-05-11T09:00:00Z", duration_minutes: 60 }
              as: Instructor
              as_user_id: "${i1_id}"
              captures: { sa_id: "$.data.id" }
            - call: "POST /sessions/${sa_id}/confirm"
              payload: {}
              as: Instructor
              as_user_id: "${i1_id}"
            - call: "POST /sessions/${sa_id}/complete"
              payload: { mounted_minutes: 45 }
              as: Instructor
              as_user_id: "${i1_id}"
            - call: "POST /sessions"
              payload: { rider_id: "${r1_id}", horse_id: "${h1_id}", instructor_id: "${i1_id}", activity_type: "THERAPEUTIC_RIDING", scheduled_start: "2026-05-11T10:15:00Z", duration_minutes: 60 }
              as: Instructor
              as_user_id: "${i1_id}"
              captures: { sb_id: "$.data.id" }
          trigger:
            - call: "GET /horses/${h1_id}/workload"
              payload: { on_date: "2026-05-11", variant: "committed" }
              as: ProgramAdmin
              captures: { day_committed: "$.data.day_minutes" }
            - call: "GET /horses/${h1_id}/workload"
              payload: { on_date: "2026-05-11", variant: "delivered" }
              as: ProgramAdmin
              captures: { day_delivered: "$.data.day_minutes" }
          assert:
            - "${day_committed} == 120"
            - "${day_delivered} == 45"
            - "The committed response reports day_session_count == 2, week_start_date == 2026-05-11, week_minutes == 120 and week_remaining_minutes == 120"
            - "The committed response reports day_remaining_minutes == 30"

  - section: entities
    instances:
      - name: get_rider_with_unknown_uuid_returns_404
        claim_type: not_found
        grounds: ['validations[priority=9]', 'errors[ERR_RIDER_NOT_FOUND]']
        distinguishing_aspect: "A well-formed but unknown rider id on GET /riders/{rider_id} returns ERR_RIDER_NOT_FOUND, not the generic ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /riders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: IntakeCoordinator
              captures: { err_id: "$.data.error_id" }
          assert:
            - "${err_id} == ERR_RIDER_NOT_FOUND with HTTP status 404"

      - name: get_grant_with_unknown_uuid_returns_generic_resource_not_found
        claim_type: not_found
        grounds: ['validations[priority=12]', 'errors[ERR_RESOURCE_NOT_FOUND]']
        distinguishing_aspect: "A non-rider, non-session, non-horse id such as {grant_id} falls through to the generic ERR_RESOURCE_NOT_FOUND at rung 12."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /grants/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ProgramAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "${err_id} == ERR_RESOURCE_NOT_FOUND with HTTP status 404"

      - name: horse_create_computes_max_load_and_ignores_input_system_fields
        claim_type: computed_fields
        grounds: ['entities.Horse.fields.max_load_lb', 'calculations.horse_max_load_lb']
        distinguishing_aspect: "POST /horses derives max_load_lb == 197.5 from body_weight_lb 987.5 * 0.20 rounded to 2 decimals, and starts status AVAILABLE with hold_release_at null."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /horses"
              payload: { name: "Pebble", body_weight_lb: 987.5, tack_weight_lb: 28.25 }
              as: ProgramAdmin
              captures: { h_id: "$.data.id", h_max: "$.data.max_load_lb" }
          assert:
            - "${h_max} == 197.5"
            - "Horse.${h_id}.status == AVAILABLE and hold_release_at == null and hold_reason == null"
            - "Horse.${h_id}.current_week_committed_minutes == 0 and current_day_session_count == 0"
            - "Horse.${h_id}.version == 1"

      - name: instructor_self_reference_discoverable_by_supervisor_filter
        claim_type: parent_relationships
        grounds: ['entities.Instructor.fields.supervisor_instructor_id', 'endpoints."GET /instructors"']
        distinguishing_aspect: "The self-referential FK Instructor.supervisor_instructor_id is reverse-reachable: GET /instructors filtered by supervisor_instructor_id returns exactly the trainees of that supervisor."
        test_recipe:
          setup: ["One MASTER instructor and two IN_TRAINING instructors supervised by them, plus one unrelated ADVANCED instructor."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /instructors"
              payload: { full_name: "Ada Reins", certification_level: "MASTER", certification_expires_at: "2028-04-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { sup_id: "$.data.id" }
            - call: "POST /instructors"
              payload: { full_name: "Trainee One", certification_level: "IN_TRAINING", certification_expires_at: "2028-04-30T00:00:00Z", supervisor_instructor_id: "${sup_id}" }
              as: ProgramAdmin
              captures: { t1_id: "$.data.id" }
            - call: "POST /instructors"
              payload: { full_name: "Trainee Two", certification_level: "IN_TRAINING", certification_expires_at: "2028-04-30T00:00:00Z", supervisor_instructor_id: "${sup_id}" }
              as: ProgramAdmin
              captures: { t2_id: "$.data.id" }
            - call: "POST /instructors"
              payload: { full_name: "Cy Cinch", certification_level: "ADVANCED", certification_expires_at: "2028-04-30T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /instructors"
              payload: { supervisor_instructor_id: "${sup_id}" }
              as: ProgramAdmin
          assert:
            - "total_count == 2 and the data array holds exactly ${t1_id} and ${t2_id}"
            - "Instructor.${t1_id}.certification_status == CURRENT and ce_hours_accrued == 0"
            - "GET /instructors with certification_level MASTER returns total_count == 1"

      - name: condition_policy_is_immutable_configuration_without_version
        claim_type: immutability
        grounds: ['entities.ConditionPolicy', 'endpoints."POST /condition-policies"', 'endpoints."GET /condition-policies"']
        distinguishing_aspect: "ConditionPolicy declares common_fields false, so it exposes only id and created_at - no updated_at, no version - and the scaffold declares no update or delete endpoint for it."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /condition-policies"
              payload: { condition_code: "CP_SPASTIC", activity_type: "VAULTING", tier: "CONTRAINDICATION", min_instructor_tier: "MASTER" }
              as: ProgramAdmin
              captures: { p_id: "$.data.id" }
            - call: "GET /condition-policies"
              payload: { condition_code: "CP_SPASTIC" }
              as: ProgramAdmin
          assert:
            - "The created policy carries id and created_at but neither updated_at nor version"
            - "GET /condition-policies filtered by condition_code CP_SPASTIC returns total_count == 1 with tier CONTRAINDICATION"
            - "Omitting min_instructor_tier on a second policy applies the declared default REGISTERED"

      - name: assessment_derives_combined_score_level_and_next_due
        claim_type: computed_fields
        grounds: ['entities.Assessment', 'calculations.independence_level_derivation', 'calculations.crew_requirement_derivation']
        distinguishing_aspect: "An assessment with balance 4 and trunk 2 derives combined_score 6, independence_level LEVEL_1, 2 sidewalkers, requires_leader true, hold OVER_THE_THIGH and next_due_at 2027-04-01T00:00:00.000Z."
        test_recipe:
          setup: ["Clock 2026-05-01T00:00:00Z; one MASTER instructor; one rider in INTAKE with a release filed."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
