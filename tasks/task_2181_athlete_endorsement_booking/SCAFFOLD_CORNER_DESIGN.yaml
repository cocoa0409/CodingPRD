          difficulty_instance: priority_pair_validation_conflict / safety_beats_fiscal_on_accept_with_sanctioned_brand_over_fee_cap
          rationale: "Triggered there as the winning error of the safety-versus-fiscal pair."
      - name: error_no_billable_deliverables_on_payout
