            - { call: "POST /legs/${leg_id}/permits", payload: { permit_number: "TX-P-61", valid_from: "2026-08-09T00:00:00Z", valid_until: "2026-08-12T00:00:00Z" }, as: Dispatcher, captures: { permit_id: $.data.id } }
            - { call: "POST /permits/${permit_id}/issue", payload: {}, as: Dispatcher }
            - { call: "POST /legs/${leg_id}/assignments", payload: { position: "REAR", escort_id: "${esc_id}" }, as: Dispatcher, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: EscortOperator, as_user_id: "${esc_id}" }
            - { call: "POST /jobs/${job_id}/schedule", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/depart", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/deliver", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/invoices", payload: {}, as: BillingClerk, as_user_id: "bc-1", captures: { inv_id: $.data.id } }
          trigger:
            - { call: "GET /carriers/${carrier_id}", payload: {}, as: Dispatcher, captures: { avail_draft: $.data.credit_available_cents } }
            - { call: "POST /invoices/${inv_id}/finalize", payload: {}, as: BillingClerk, as_user_id: "bc-2" }
            - { call: "GET /carriers/${carrier_id}", payload: {}, as: Dispatcher, captures: { avail_final: $.data.credit_available_cents } }
            - { call: "POST /invoices/${inv_id}/record-payment", payload: { amount_cents: 38520 }, as: FinanceManager }
