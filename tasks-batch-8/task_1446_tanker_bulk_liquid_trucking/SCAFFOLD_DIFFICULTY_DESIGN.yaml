  - rule_id: compensating_invariant
    instances:
      - name: cert_hold_release_round_trip
        grounds:
          - state_machines.TankWashCertificate.CERTIFIED_to_HELD
          - state_machines.TankWashCertificate.HELD_to_CERTIFIED
          - state_machines.Shipment.PLANNED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: the multiset of wash-certificate statuses.
          plan() moves CERTIFIED -> HELD and cancel() compensates HELD ->
          CERTIFIED; after the round trip the certificate is CERTIFIED again
          with consumed_by_shipment_id null and zero HELD certificates exist
          — no status drift.
        test_recipe:
          setup:
            - "FLUSH certificate CERTIFIED for trailer T-101; shipment in DRAFT; clock 2026-08-01T08:00:00Z"
          setup_api_calls:
            - { call: "POST /bulk-liquid/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: FleetAdmin }
            - { call: "POST /bulk-liquid/customers", payload: { name: "Acme Chem", credit_limit_cents: 1000000000 }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bulk-liquid/products", payload: { name: "Diesel ULSD", compatibility_group: PETROLEUM, hazmat_class: CLASS_3_FLAMMABLE, packing_group: II, density_lb_per_gal: 7.0, temp_coeff_per_degF: 0.0007, placard_code: "UN1993" }, as: FleetAdmin, captures: { prod: $.data.id } }
            - { call: "POST /bulk-liquid/compatibility-rules", payload: { prior_group: PETROLEUM, next_group: PETROLEUM, required_wash_level: NONE }, as: FleetAdmin }
            - { call: "POST /bulk-liquid/trailers", payload: { unit_number: "T-101", capacity_gallons: 8000, tare_weight_lb: 25000, tare_steer_lb: 6000, tare_drive_lb: 9000, tare_trailer_lb: 10000, steer_axle_rating_lb: 12000, drive_axle_rating_lb: 34000, trailer_axle_rating_lb: 34000, gvwr_lb: 80000 }, as: FleetAdmin, captures: { trl: $.data.id } }
            - { call: "POST /bulk-liquid/drivers", payload: { full_name: "Dana Roe", cdl_number: "CDL-1", tanker_endorsement: true, hazmat_endorsement: true, endorsement_expires_on: "2027-06-01" }, as: FleetAdmin, captures: { drv: $.data.id } }
            - { call: "POST /bulk-liquid/loading-racks", payload: { rack_code: "R-1", terminal_name: "Baytown", authorized_groups: [PETROLEUM], open_hour: 6, close_hour: 22, meter_id: "M-1" }, as: FleetAdmin, captures: { rack: $.data.id } }
            - { call: "POST /bulk-liquid/wash-bays", payload: { bay_code: "WB-1", supported_wash_levels: [FLUSH], cleanup_buffer_minutes: 30 }, as: FleetAdmin, captures: { bay: $.data.id } }
            - { call: "POST /bulk-liquid/tank-wash-certificates", payload: { trailer_id: "${trl}", wash_bay_id: "${bay}", wash_level: FLUSH, window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T07:00:00Z" }, as: WashOperator, captures: { cert: $.data.id } }
            - { call: "POST /bulk-liquid/tank-wash-certificates/${cert}/certify", as: WashOperator }
            - { call: "POST /bulk-liquid/shipments", payload: { customer_id: "${cust}", product_id: "${prod}", ordered_gallons: 1000, route_miles: 100, rate_per_gal_cents: 100 }, as: Dispatcher, captures: { ship: $.data.id } }
          trigger:
            - { call: "POST /bulk-liquid/shipments/${ship}/plan", payload: { trailer_id: "${trl}", driver_id: "${drv}", rack_id: "${rack}", rack_window_start: "2026-08-02T10:00:00Z", rack_window_end: "2026-08-02T12:00:00Z", wash_cert_id: "${cert}" }, as: Dispatcher }
            - { call: "GET /bulk-liquid/tank-wash-certificates/${cert}", as: Dispatcher, captures: { mid_status: $.data.status } }
            - { call: "POST /bulk-liquid/shipments/${ship}/cancel", as: Dispatcher }
            - { call: "GET /bulk-liquid/tank-wash-certificates/${cert}", as: Dispatcher, captures: { end_status: $.data.status, end_consumer: $.data.consumed_by_shipment_id } }
          assert:
            - "after plan: TankWashCertificate.${cert}.status == HELD (forward action)"
            - "after cancel: TankWashCertificate.${cert}.status == CERTIFIED and consumed_by_shipment_id == null (compensation)"
            - "GET /bulk-liquid/tank-wash-certificates?status=HELD returns total_count == 0 — certificate-status multiset unchanged by the round trip"
      - name: trailer_dedication_round_trip
        grounds:
          - state_machines.DedicatedTrailerAgreement.PENDING_to_ACTIVE
          - state_machines.DedicatedTrailerAgreement.ACTIVE_to_TERMINATED
          - entities.TankTrailer.fields.dedicated_customer_id
        distinguishing_aspect: |
          Conserved quantity (distinct from the sibling's certificate-status
          multiset): the pairing invariant count(trailers with
          dedicated_customer_id set) == count(agreements in ACTIVE or
          SUSPENDED). activate() then terminate() leaves both sides at zero
          and the trailer's dedicated_customer_id null — no dedication leak.
        test_recipe:
          setup:
            - "Enrolled customer; free trailer T-101; no agreements"
          setup_api_calls:
            - { call: "POST /bulk-liquid/customers", payload: { name: "Dedicated Co", credit_limit_cents: 1000000000, dedicated_program_enrolled: true }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bulk-liquid/trailers", payload: { unit_number: "T-101", capacity_gallons: 8000, tare_weight_lb: 25000, tare_steer_lb: 6000, tare_drive_lb: 9000, tare_trailer_lb: 10000, steer_axle_rating_lb: 12000, drive_axle_rating_lb: 34000, trailer_axle_rating_lb: 34000, gvwr_lb: 80000 }, as: FleetAdmin, captures: { trl: $.data.id } }
            - { call: "POST /bulk-liquid/dedicated-trailer-agreements", payload: { customer_id: "${cust}", trailer_id: "${trl}", committed_loads_per_month: 5, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: FleetAdmin, captures: { agr: $.data.id } }
          trigger:
            - { call: "POST /bulk-liquid/dedicated-trailer-agreements/${agr}/activate", as: FleetAdmin }
            - { call: "GET /bulk-liquid/trailers/${trl}", as: FleetAdmin, captures: { mid_ded: $.data.dedicated_customer_id } }
            - { call: "POST /bulk-liquid/dedicated-trailer-agreements/${agr}/terminate", as: FleetAdmin }
            - { call: "GET /bulk-liquid/trailers/${trl}", as: FleetAdmin, captures: { end_ded: $.data.dedicated_customer_id } }
          assert:
            - "after activate: TankTrailer.${trl}.dedicated_customer_id == ${cust} (1 dedicated trailer == 1 ACTIVE agreement)"
            - "after terminate: TankTrailer.${trl}.dedicated_customer_id == null (0 == 0; invariant restored)"
            - "GET /bulk-liquid/dedicated-trailer-agreements?trailer_id=${trl}&status=ACTIVE returns total_count == 0"
