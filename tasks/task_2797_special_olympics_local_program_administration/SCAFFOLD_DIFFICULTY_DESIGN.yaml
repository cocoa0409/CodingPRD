              as: ProgramManager
              captures: { sess2: $.data.id }
          assert:
            - "the 11:10 request returns HTTP 409 with error_id ERR_COACH_SESSION_OVERLAP because [11:10, 11:40) intersects the buffered [09:45, 11:15)"
