            - "Appraiser.${apr_a_id}.panel_status == SUSPENDED"

  - rule_id: combinatorial_formula
    instances:
      - name: escalation_matrix_three_input_nonlinear_upgrade
        grounds:
          - calculations.escalation_requirement_matrix
          - calculations.desk_review_quality_score
          - calculations.comparable_adjustment_magnitudes
          - entities.DeskReview.fields.required_escalation
          - entities.DeskReview.fields.risk_tier_at_review
          - entities.Appraisal.fields.max_gross_adjustment_bps
        distinguishing_aspect: |
          Mode (a): the outcome is a non-linear function of four inputs -- final_quality_score_bps,
          risk_tier_at_review, bias_screen_status and max_gross_adjustment_bps -- and it is
          non-monotonic in the score, because a HIGH-tier review scoring 9400 maps to NONE under
          clause 2 yet clause 3 re-raises it to FIELD_REVIEW on a single 3000 bps gross adjustment.
        test_recipe:
          setup:
            - "Clock at its default 2026-08-01T00:00:00Z."
            - "AMC, appraiser A with an ACTIVE CA membership, and a HIGH-risk REFINANCE loan file (SUBURBAN, 30000000 cents)."
            - "A fully complete appraisal (8 sections, 7 exhibits, benign narrative, FORM_1004) reporting 40000000."
            - "Three CLOSED comparables inside the SUBURBAN distance ceiling, one of which carries a 12000000 gross adjustment on a 40000000 sale (3000 bps, above MAX_SINGLE_GROSS_BPS) while its net adjustment stays at 100 bps."
            - "Rule checks give completeness 10000, exactly 1 FAIL (gross) and 0 WARNs; the bias screen is CLEAR; a DRAFT desk review exists."
          setup_api_calls:
            - call: "POST /appraisal-desk/amcs"
              payload: { name: "Meridian Appraisal Management" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
              captures: { amc1_id: $.data.id }
