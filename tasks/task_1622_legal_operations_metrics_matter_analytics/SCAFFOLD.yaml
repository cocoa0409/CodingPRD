scenario: |
  Legal Operations Metrics & Matter Analytics (legal operations analytics): matter taxonomy & data hygiene, spend by practice area/firm/matter type reporting, cycle time & outcome benchmarking, workload allocation across in-house team, insource vs outsource cost modeling, budget accuracy & accrual variance, technology adoption & self-service deflection, executive dashboard & annual planning

domain_name: legal-ops-matter-analytics
api_prefix: /legal-ops

complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: event_sourcing
  complexity_layers:
    - derived_field_reconciliation
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1)
# =============================================================================
entities:
  - name: LegalDepartment
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Legal department name"
        constraints: "1..200 chars"
      - name: budget_warning_pct
        type: number
        source: input
        description: "Warning threshold, 0 < pct <= 1.0; budget posture flips to WARNING when utilization >= this value"
        default: 0.8
      - name: budget_critical_pct
        type: number
        source: input
        description: "Critical threshold, 0 < pct <= 1.0; MUST be > budget_warning_pct"
        default: 0.95
      - name: deflection_target_pct
        type: number
        source: input
        description: "Self-service deflection target for technology adoption scorecard, 0 <= pct <= 1.0"
        default: 0.30
      - name: active_fiscal_period_id
        type: string
        source: computed
        description: "FK -> FiscalPeriod.id; the single period whose status == OPEN; null when no OPEN period"

  - name: FiscalPeriod
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: "Human label, e.g. FY2026"
      - name: start_date
        type: string
        source: input
        description: "ISO date YYYY-MM-DD, period start (inclusive)"
      - name: end_date
        type: string
        source: input
        description: "ISO date YYYY-MM-DD, period end (inclusive); MUST be > start_date"
      - name: status
        type: enum
        source: system
        description: "OPEN, SOFT_CLOSED, HARD_CLOSED, REOPENED"
        default: OPEN
      - name: reopen_count
        type: integer
        source: system
        description: "Number of times this period has been transitioned HARD_CLOSED -> REOPENED"
        default: 0
      - name: total_actual_spend_cents
        type: integer
        source: computed
        description: "Sum of SpendLine.amount_cents for lines whose posting_date in [start_date, end_date] AND source_status == POSTED"
        default: 0
      - name: total_accrual_cents
        type: integer
        source: computed
        description: "Sum of Accrual.amount_cents where Accrual.fiscal_period_id == this AND Accrual.status == OUTSTANDING"
        default: 0

  - name: PracticeArea
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Stable taxonomy code, e.g. LIT, CORP, IP; unique across all practice areas"
        constraints: "uppercase alphanum 2..8 chars; unique"
      - name: display_name
        type: string
        source: input
        description: "Human readable name"
      - name: status
        type: enum
        source: system
        description: "ACTIVE, ARCHIVED; archived practice areas reject new matters"
        default: ACTIVE

  - name: MatterType
    parent: PracticeArea
    common_fields: true
    fields:
      - name: practice_area_id
        type: string
        source: input
        description: "FK -> PracticeArea.id; owning practice area"
      - name: code
        type: string
        source: input
        description: "Stable code unique within practice area, e.g. LIT-COMMERCIAL"
      - name: display_name
        type: string
        source: input
        description: "Human readable name"
      - name: default_budget_cents
        type: integer
        source: input
        description: "Default matter budget when matter created without explicit budget"
        default: 0

  - name: OutsideCounselFirm
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Firm name, unique"
      - name: tier
        type: enum
        source: input
        description: "TIER_1, TIER_2, TIER_3; used for benchmark cohorts"
      - name: blended_hourly_rate_cents
        type: integer
        source: input
        description: "Blended hourly rate used for insource-vs-outsource modeling"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "ACTIVE, SUSPENDED, ARCHIVED; suspended firms cannot receive new invoices"
        default: ACTIVE

  - name: Matter
    parent: null
    common_fields: true
    fields:
      - name: matter_number
        type: string
        source: input
        description: "Business key, unique, format LGL-YYYY-NNNNN"
      - name: title
        type: string
        source: input
        description: "Matter title"
      - name: practice_area_id
        type: string
        source: input
        description: "FK -> PracticeArea.id"
      - name: matter_type_id
        type: string
        source: input
        description: "FK -> MatterType.id; matter_type.practice_area_id MUST equal practice_area_id"
      - name: fiscal_period_id
        type: string
        source: input
        description: "FK -> FiscalPeriod.id; period in which the matter is opened"
      - name: primary_firm_id
        type: string
        source: input
        description: "FK -> OutsideCounselFirm.id; nullable when matter is fully insourced"
      - name: lead_counsel_id
        type: string
        source: input
        description: "FK -> InHouseCounsel.id"
      - name: status
        type: enum
        source: system
        description: "INTAKE, ACTIVE, ON_HOLD, CLOSED, REOPENED, ARCHIVED"
        default: INTAKE
      - name: budget_cents
        type: integer
        source: input
        description: "Matter budget; defaults to MatterType.default_budget_cents if omitted"
      - name: actual_spend_cents
        type: integer
        source: computed
        description: "Sum of SpendLine.amount_cents for this matter with source_status == POSTED"
        default: 0
      - name: accrual_outstanding_cents
        type: integer
        source: computed
        description: "Sum of Accrual.amount_cents where matter_id == this AND status == OUTSTANDING"
        default: 0
      - name: cycle_days
        type: integer
        source: computed
        description: "Days between first transition INTAKE->ACTIVE and final transition -> CLOSED; null while never closed"

  - name: InHouseCounsel
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Counsel name"
      - name: email
        type: string
        source: input
        description: "Unique email"
      - name: annual_capacity_hours
        type: integer
        source: input
        description: "Total billable-equivalent capacity hours per fiscal year, > 0"
      - name: loaded_hourly_cost_cents
        type: integer
        source: input
        description: "Loaded hourly cost used for insource-vs-outsource modeling"
      - name: status
        type: enum
        source: system
        description: "ACTIVE, INACTIVE"
        default: ACTIVE

  - name: MatterAssignment
    parent: Matter
    common_fields: true
    fields:
      - name: matter_id
        type: string
        source: input
        description: "FK -> Matter.id"
      - name: counsel_id
        type: string
        source: input
        description: "FK -> InHouseCounsel.id"
      - name: allocated_hours
        type: integer
        source: input
        description: "Hours allocated for the current fiscal period; >= 0"
      - name: status
        type: enum
        source: system
        description: "ACTIVE, RELEASED"
        default: ACTIVE

  - name: Budget
    parent: FiscalPeriod
    common_fields: true
    fields:
      - name: fiscal_period_id
        type: string
        source: input
        description: "FK -> FiscalPeriod.id"
      - name: practice_area_id
        type: string
        source: input
        description: "FK -> PracticeArea.id"
      - name: matter_type_id
        type: string
        source: input
        description: "FK -> MatterType.id; nullable — null means the budget covers the whole practice area"
      - name: allocated_cents
        type: integer
        source: input
        description: "Total budget envelope for this grain; >= 0"
      - name: consumed_cents
        type: integer
        source: computed
        description: "Sum of SpendLine.amount_cents matching this budget grain (same period, practice area, matter type via matter join) with source_status == POSTED"
        default: 0
      - name: posture
        type: enum
        source: computed
        description: "OK, WARNING, CRITICAL, EXCEEDED; derived from consumed_cents / allocated_cents vs department thresholds"
        default: OK

  - name: Accrual
    parent: Matter
    common_fields: true
    fields:
      - name: matter_id
        type: string
        source: input
        description: "FK -> Matter.id"
      - name: fiscal_period_id
        type: string
        source: input
        description: "FK -> FiscalPeriod.id"
      - name: firm_id
        type: string
        source: input
        description: "FK -> OutsideCounselFirm.id"
      - name: amount_cents
        type: integer
        source: input
        description: "Estimated unpaid fees for this period; >= 0"
      - name: status
        type: enum
        source: system
        description: "OUTSTANDING, MATCHED, RELEASED, EXPIRED"
        default: OUTSTANDING

  - name: Invoice
    parent: Matter
    common_fields: true
    fields:
      - name: matter_id
        type: string
        source: input
        description: "FK -> Matter.id"
      - name: firm_id
        type: string
        source: input
        description: "FK -> OutsideCounselFirm.id"
      - name: fiscal_period_id
        type: string
        source: input
        description: "FK -> FiscalPeriod.id; posting period"
      - name: invoice_number
        type: string
        source: input
        description: "Vendor-supplied number; unique per (firm_id, invoice_number)"
      - name: amount_cents
        type: integer
        source: input
        description: "Invoice total, > 0"
      - name: payment_status
        type: enum
        source: system
        description: "SUBMITTED, APPROVED, PAID, REJECTED — parallel dimension 1"
        default: SUBMITTED
      - name: accrual_match_status
        type: enum
        source: system
        description: "UNMATCHED, PARTIALLY_MATCHED, FULLY_MATCHED, OVER_BILLED — parallel dimension 2"
        default: UNMATCHED
      - name: matched_accrual_id
        type: string
        source: system
        description: "FK -> Accrual.id; the accrual this invoice was matched against, null until matched"

  - name: SpendLine
    parent: FiscalPeriod
    common_fields: false
    fields:
      - name: matter_id
        type: string
        source: system
        description: "FK -> Matter.id"
      - name: fiscal_period_id
        type: string
        source: system
        description: "FK -> FiscalPeriod.id"
      - name: firm_id
        type: string
        source: system
        description: "FK -> OutsideCounselFirm.id"
      - name: invoice_id
        type: string
        source: system
        description: "FK -> Invoice.id; the invoice this line was generated from"
      - name: posting_date
        type: string
        source: system
        description: "ISO date; set from invoice's fiscal period start_date on post"
      - name: amount_cents
        type: integer
        source: system
        description: "Posted amount; positive"
      - name: source_status
        type: enum
        source: system
        description: "POSTED, REVERSED; REVERSED lines excluded from aggregates"
        default: POSTED
      - name: reversal_of_id
        type: string
        source: system
        description: "FK -> SpendLine.id; non-null when this line is a reversal entry"

  - name: Dashboard
    parent: FiscalPeriod
    common_fields: true
    fields:
      - name: fiscal_period_id
        type: string
        source: input
        description: "FK -> FiscalPeriod.id; unique — one dashboard per period"
      - name: snapshot_label
        type: string
        source: input
        description: "Human label, e.g. FY2026-Q3-snapshot"
      - name: total_matters_opened
        type: integer
        source: computed
        description: "Count of matters whose fiscal_period_id == this period AND status in {ACTIVE, ON_HOLD, CLOSED, REOPENED}"
        default: 0
      - name: total_matters_closed
        type: integer
        source: computed
        description: "Count of matters in this period whose current status == CLOSED"
        default: 0
      - name: mean_cycle_days
        type: number
        source: computed
        description: "Mean cycle_days across closed matters in this period; null when no closed matters"
      - name: total_actual_spend_cents
        type: integer
        source: computed
        description: "Mirrors FiscalPeriod.total_actual_spend_cents at snapshot time"
        default: 0
      - name: total_accrual_outstanding_cents
        type: integer
        source: computed
        description: "Mirrors FiscalPeriod.total_accrual_cents at snapshot time"
        default: 0
      - name: budget_accuracy_pct
        type: number
        source: computed
        description: "1 - |total_budget_allocated - total_actual_spend| / total_budget_allocated across all budgets in this period; null when allocated == 0"
      - name: deflection_rate_pct
        type: number
        source: computed
        description: "deflected_matters / total_matters_opened where deflected matters are matters with no firm (primary_firm_id IS NULL) and status in {CLOSED, ACTIVE}"
      - name: status
        type: enum
        source: system
        description: "DRAFT, PUBLISHED, SUPERSEDED"
        default: DRAFT

# =============================================================================
# Table 2: State Machine Table (§1.2)
# =============================================================================
state_machines:
  - entity: FiscalPeriod
    initial_state: OPEN
    terminal_states: [HARD_CLOSED]
    transitions:
      - from: OPEN
        to: SOFT_CLOSED
        trigger: "POST /legal-ops/fiscal-periods/{id}/soft-close"
        actor: LegalOpsAnalyst
        preconditions:
          - "FiscalPeriod.status == OPEN"
          - "No Matter in this period has status == INTAKE (all matters must be past intake)"
        side_effects:
          - "Accrual auto-expiry sweep: every Accrual in this period with status == OUTSTANDING transitions to EXPIRED"
          - "Matter.accrual_outstanding_cents recomputed to 0 for affected matters"
          - "FiscalPeriod.total_accrual_cents recomputed to 0"
          - "increments FiscalPeriod.version by 1"
      - from: SOFT_CLOSED
        to: HARD_CLOSED
        trigger: "POST /legal-ops/fiscal-periods/{id}/hard-close"
        actor: LegalOpsManager
        preconditions:
          - "FiscalPeriod.status == SOFT_CLOSED"
          - "No Invoice in this period with payment_status == SUBMITTED"
          - "All Dashboard rows for this period have status == PUBLISHED or SUPERSEDED"
        side_effects:
          - "increments FiscalPeriod.version by 1"
      - from: HARD_CLOSED
        to: REOPENED
        trigger: "POST /legal-ops/fiscal-periods/{id}/reopen"
        actor: LegalOpsManager
        preconditions:
          - "FiscalPeriod.status == HARD_CLOSED"
          - "FiscalPeriod.reopen_count < 2"
        side_effects:
          - "FiscalPeriod.reopen_count += 1"
          - "increments FiscalPeriod.version by 1"
      - from: REOPENED
        to: SOFT_CLOSED
        trigger: "POST /legal-ops/fiscal-periods/{id}/soft-close"
        actor: LegalOpsAnalyst
        preconditions:
          - "FiscalPeriod.status == REOPENED"
        side_effects:
          - "Accrual auto-expiry sweep (same as OPEN -> SOFT_CLOSED)"
          - "increments FiscalPeriod.version by 1"

  - entity: Matter
    initial_state: INTAKE
    terminal_states: [ARCHIVED]
    transitions:
      - from: INTAKE
        to: ACTIVE
        trigger: "POST /legal-ops/matters/{id}/activate"
        actor: LegalOpsAnalyst
        preconditions:
          - "Matter.status == INTAKE"
          - "Matter.fiscal_period.status == OPEN"
          - "Matter.practice_area.status == ACTIVE"
          - "If primary_firm_id is not null: firm.status == ACTIVE"
          - "At least one MatterAssignment row exists with matter_id == this AND status == ACTIVE"
        side_effects:
          - "increments Matter.version by 1"
      - from: ACTIVE
        to: ON_HOLD
        trigger: "POST /legal-ops/matters/{id}/hold"
        actor: LegalOpsAnalyst
        preconditions:
          - "Matter.status == ACTIVE"
        side_effects:
          - "increments Matter.version by 1"
      - from: ON_HOLD
        to: ACTIVE
        trigger: "POST /legal-ops/matters/{id}/resume"
        actor: LegalOpsAnalyst
        preconditions:
          - "Matter.status == ON_HOLD"
          - "Matter.fiscal_period.status IN {OPEN, REOPENED}"
        side_effects:
          - "increments Matter.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /legal-ops/matters/{id}/close"
        actor: LegalOpsAnalyst
        preconditions:
          - "Matter.status == ACTIVE"
          - "No Accrual with matter_id == this AND status == OUTSTANDING"
          - "No Invoice with matter_id == this AND payment_status == SUBMITTED"
        side_effects:
          - "cycle_days computed: days between INTAKE->ACTIVE transition timestamp and this transition timestamp"
          - "All MatterAssignment rows for this matter with status == ACTIVE transition to RELEASED"
          - "increments Matter.version by 1"
      - from: CLOSED
        to: REOPENED
        trigger: "POST /legal-ops/matters/{id}/reopen"
        actor: LegalOpsManager
        preconditions:
          - "Matter.status == CLOSED"
          - "Matter.fiscal_period.status IN {OPEN, REOPENED}"
        side_effects:
          - "cycle_days reset to null"
          - "increments Matter.version by 1"
      - from: REOPENED
        to: CLOSED
        trigger: "POST /legal-ops/matters/{id}/close"
        actor: LegalOpsAnalyst
        preconditions:
          - "Matter.status == REOPENED"
          - "No Accrual with matter_id == this AND status == OUTSTANDING"
          - "No Invoice with matter_id == this AND payment_status == SUBMITTED"
        side_effects:
          - "cycle_days recomputed from original activation timestamp to this close timestamp"
          - "increments Matter.version by 1"
      - from: CLOSED
        to: ARCHIVED
        trigger: "POST /legal-ops/matters/{id}/archive"
        actor: LegalOpsManager
        preconditions:
          - "Matter.status == CLOSED"
          - "Matter.fiscal_period.status == HARD_CLOSED"
        side_effects:
          - "increments Matter.version by 1"

  - entity: Invoice
    initial_state: SUBMITTED
    terminal_states: [PAID, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /legal-ops/invoices/{id}/approve"
        actor: LegalOpsAnalyst
        preconditions:
          - "Invoice.payment_status == SUBMITTED"
          - "Invoice.fiscal_period.status IN {OPEN, REOPENED}"
          - "If invoice.amount_cents >= 100000 (>= $1000): actor.id != invoice creator id (segregation of duties)"
        side_effects:
          - "Run accrual_match: find Accrual where matter_id == invoice.matter_id AND fiscal_period_id == invoice.fiscal_period_id AND firm_id == invoice.firm_id AND status == OUTSTANDING"
          - "If exactly one OUTSTANDING accrual found: set Invoice.matched_accrual_id, update accrual_match_status per matching rule (FULLY_MATCHED if accrual.amount_cents == invoice.amount_cents; PARTIALLY_MATCHED if accrual.amount_cents > invoice.amount_cents; OVER_BILLED if accrual.amount_cents < invoice.amount_cents)"
          - "If zero OUTSTANDING accruals found: accrual_match_status stays UNMATCHED"
          - "increments Invoice.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /legal-ops/invoices/{id}/pay"
        actor: LegalOpsManager
        preconditions:
          - "Invoice.payment_status == APPROVED"
          - "Invoice.fiscal_period.status IN {OPEN, REOPENED}"
        side_effects:
          - "Generate SpendLine: amount_cents = invoice.amount_cents, posting_date = fiscal_period.start_date, source_status = POSTED"
          - "If matched_accrual_id is not null: matched Accrual transitions OUTSTANDING -> MATCHED"
          - "Matter.actual_spend_cents += invoice.amount_cents"
          - "Matter.accrual_outstanding_cents recomputed"
          - "FiscalPeriod.total_actual_spend_cents += invoice.amount_cents"
          - "FiscalPeriod.total_accrual_cents recomputed"
          - "Matching Budget rows recompute consumed_cents; posture re-derived"
          - "increments Invoice.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /legal-ops/invoices/{id}/reject"
        actor: LegalOpsAnalyst
        preconditions:
          - "Invoice.payment_status == SUBMITTED"
        side_effects:
          - "increments Invoice.version by 1"

  - entity: Accrual
    initial_state: OUTSTANDING
    terminal_states: [MATCHED, RELEASED, EXPIRED]
    transitions:
      - from: OUTSTANDING
        to: MATCHED
        trigger: "system: invoice payment side effect"
        actor: system
        preconditions:
          - "Accrual.status == OUTSTANDING"
          - "An Invoice with matching matter_id, fiscal_period_id, firm_id transitions APPROVED -> PAID with matched_accrual_id == this"
        side_effects:
          - "FiscalPeriod.total_accrual_cents -= this.amount_cents"
          - "Matter.accrual_outstanding_cents -= this.amount_cents"
      - from: OUTSTANDING
        to: RELEASED
        trigger: "POST /legal-ops/accruals/{id}/release"
        actor: LegalOpsAnalyst
        preconditions:
          - "Accrual.status == OUTSTANDING"
          - "Accrual.fiscal_period.status IN {OPEN, REOPENED}"
        side_effects:
          - "FiscalPeriod.total_accrual_cents -= this.amount_cents"
          - "Matter.accrual_outstanding_cents -= this.amount_cents"
          - "increments Accrual.version by 1"
      - from: OUTSTANDING
        to: EXPIRED
        trigger: "system: fiscal period soft-close sweep"
        actor: system
        preconditions:
          - "Accrual.status == OUTSTANDING"
          - "Accrual.fiscal_period transitions to SOFT_CLOSED"
        side_effects:
          - "FiscalPeriod.total_accrual_cents -= this.amount_cents"
          - "Matter.accrual_outstanding_cents -= this.amount_cents"

  - entity: MatterAssignment
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /legal-ops/matter-assignments/{id}/release OR system: matter close side effect"
        actor: LegalOpsAnalyst
        preconditions:
          - "MatterAssignment.status == ACTIVE"
          - "If manual release: Matter.status IN {ACTIVE, ON_HOLD}"
        side_effects:
          - "increments MatterAssignment.version by 1"

  - entity: Dashboard
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /legal-ops/dashboards/{id}/publish"
        actor: LegalOpsManager
        preconditions:
          - "Dashboard.status == DRAFT"
          - "Dashboard.fiscal_period.status IN {SOFT_CLOSED, HARD_CLOSED}"
        side_effects:
          - "All other Dashboard rows for same fiscal_period with status == PUBLISHED transition to SUPERSEDED"
          - "increments Dashboard.version by 1"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system: another dashboard for same period published"
        actor: system
        preconditions:
          - "Dashboard.status == PUBLISHED"
        side_effects:
          - "increments Dashboard.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: budget-update-stale-version
    parent_entity: Budget
    write_endpoint: "PATCH /legal-ops/budgets/{id}"
    occ_field: "expected_budget_version"
    description: |
      Updating a Budget whose version has advanced since the client last observed
      it is rejected. This captures the case where a cascaded posture recompute
      (driven by invoice payment) has silently bumped Budget.version between the
      client's read and this write.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: matter-close-stale-version
    parent_entity: Matter
    write_endpoint: "POST /legal-ops/matters/{id}/close"
    occ_field: "expected_matter_version"
    description: |
      Closing a Matter whose version has advanced since the client last observed
      it is rejected. A second sequential close after a peer's close observes
      status == CLOSED and is rejected by state validation; this OCC rule instead
      guards the case where the client sends a close against a Matter whose
      version has drifted (e.g., because an invoice payment cascade bumped
      Matter.version).
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: dashboard-publish-stale-version
    parent_entity: Dashboard
    write_endpoint: "POST /legal-ops/dashboards/{id}/publish"
    occ_field: "expected_dashboard_version"
    description: |
      Publishing a Dashboard whose version has advanced since the client last
      observed it is rejected. Guards against a peer publishing a different
      snapshot for the same fiscal period in between, which would have cascaded
      this row's status to SUPERSEDED.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# =============================================================================
calculations:
  - name: budget_posture_derivation
    trigger: "After any SpendLine insert, any Budget.allocated_cents PATCH, or any change to department budget_warning_pct / budget_critical_pct"
    algorithm: threshold
    formula: |
      ratio = consumed_cents / allocated_cents            # if allocated_cents > 0
      ratio = +infinity                                    # if allocated_cents == 0 AND consumed_cents > 0
      ratio = 0                                            # if allocated_cents == 0 AND consumed_cents == 0
      if ratio >= 1.0:                posture = EXCEEDED
      elif ratio >= budget_critical_pct: posture = CRITICAL
      elif ratio >= budget_warning_pct:  posture = WARNING
      else:                            posture = OK
      Boundary pins: ">= 1.0" is inclusive; ">= budget_critical_pct" is inclusive;
      ">= budget_warning_pct" is inclusive. Exact ties round toward the more
      severe posture.
    input_set: "All SpendLine rows where source_status == POSTED, fiscal_period_id matches, and the matter join resolves practice_area_id and matter_type_id matching this Budget's grain (null matter_type_id matches all matter types in the practice area)."
    constants:
      EXCEEDED_THRESHOLD: 1.0
    precision: "ratio compared as exact rational (no rounding); boundary >= inclusive"

  - name: accrual_match_amount_classification
    trigger: "On Invoice approve transition, after matched Accrual is located"
    algorithm: threshold
    formula: |
      if accrual.amount_cents == invoice.amount_cents: accrual_match_status = FULLY_MATCHED
      elif accrual.amount_cents > invoice.amount_cents: accrual_match_status = PARTIALLY_MATCHED
      else:                                              accrual_match_status = OVER_BILLED
      Boundary pin: exact equality goes to FULLY_MATCHED; the > / < split is
      exclusive on both sides.
    input_set: "Exactly the matched Accrual located by the invoice approval transition's selector (status == OUTSTANDING, same matter_id, fiscal_period_id, firm_id; tie-break by created_at ASC when multiple exist)."
    constants: {}
    precision: "exact integer cents comparison"

  - name: insource_vs_outsource_cost_model
    trigger: "On matter close (cycle_days computed) or on demand via GET /legal-ops/matters/{id}/cost-model"
    algorithm: weighted_scoring
    formula: |
      insource_cost_cents = sum over MatterAssignment rows where matter_id == this:
          assignment.allocated_hours * counsel.loaded_hourly_cost_cents
      outsource_cost_cents = actual_spend_cents
      modeled_outsource_cost_cents = total_hours * firm.blended_hourly_rate_cents
          where total_hours = sum of allocated_hours across all assignments on this matter
      savings_cents = modeled_outsource_cost_cents - insource_cost_cents
      decision = INSOURCE_CHEAPER if savings_cents > 0
                 OUTSOURCE_CHEAPER if savings_cents < 0
                 BREAK_EVEN if savings_cents == 0
    input_set: "All MatterAssignment rows for the matter (both ACTIVE and RELEASED); the Matter's primary_firm_id for firm.blended_hourly_rate_cents. If primary_firm_id is null, modeled_outsource_cost_cents is null and decision is null."
    constants: {}
    precision: "integer cents, no rounding"
    variants:
      - name: provisional_at_activation
        when: "Matter is ACTIVE or ON_HOLD; actual_spend_cents may be partial"
        difference: "outsource_cost_cents uses actual_spend_cents + accrual_outstanding_cents (forward-looking view)"
      - name: final_at_close
        when: "Matter is CLOSED, REOPENED, or ARCHIVED"
        difference: "outsource_cost_cents uses actual_spend_cents only (chronological view); accruals are ignored"

  - name: spend_line_posting_order
    trigger: "On Invoice pay transition"
    algorithm: chronological
    formula: |
      SpendLine rows are written in invoice-pay order. When multiple invoices for
      the same matter are paid on the same logical clock tick, ordering is by
      (posting_date ASC, invoice.created_at ASC). SpendLine.id is never used
      as a sort key.
    input_set: "All invoices being paid within one logical clock tick."
    constants: {}
    precision: "n/a — ordering rule"

  - name: dashboard_budget_accuracy
    trigger: "On Dashboard publish; recomputed from scratch (snapshot semantics)"
    algorithm: aggregation
    formula: |
      total_alloc = sum of Budget.allocated_cents where fiscal_period_id == dashboard.fiscal_period_id
      total_spend = FiscalPeriod.total_actual_spend_cents
      if total_alloc == 0:
          budget_accuracy_pct = null
      else:
          # rounding order pinned: compute absolute delta first, then divide, then round
          delta = abs(total_alloc - total_spend)
          budget_accuracy_pct = round_half_up( (1 - delta / total_alloc) * 100, 2 ) / 100
    input_set: "All Budget rows for the period, regardless of posture; all POSTED SpendLine rows for the period."
    constants: {}
    precision: "round_half_up to 2 decimal places AFTER multiplication by 100, then divide by 100 — pins rounding order"
    variants:
      - name: provisional_dashboard
        when: "Dashboard.status == DRAFT (read via GET before publish)"
        difference: "Uses live FiscalPeriod totals at read time; values may drift between reads"
      - name: published_snapshot
        when: "Dashboard.status == PUBLISHED or SUPERSEDED"
        difference: "Values frozen at publish time; subsequent invoices do not update this row"

  - name: deflection_rate
    trigger: "On Dashboard publish or read of DRAFT dashboard"
    algorithm: aggregation
    formula: |
      deflected = count of Matter where fiscal_period_id == dashboard.fiscal_period_id
                  AND primary_firm_id IS NULL
                  AND status IN {ACTIVE, CLOSED}
      total_opened = count of Matter where fiscal_period_id == dashboard.fiscal_period_id
                     AND status IN {ACTIVE, ON_HOLD, CLOSED, REOPENED}
      if total_opened == 0: deflection_rate_pct = null
      else:                 deflection_rate_pct = round_half_up( deflected / total_opened * 100, 2 ) / 100
    input_set: "Matters in this fiscal period only; INTAKE and ARCHIVED matters excluded from denominator."
    constants: {}
    precision: "round_half_up to 2 decimal places AFTER multiplication by 100"

  - name: workload_utilization_per_counsel
    trigger: "On MatterAssignment create/release, or on demand via GET /legal-ops/in-house-counsel/{id}/utilization"
    algorithm: aggregation
    formula: |
      total_allocated = sum of MatterAssignment.allocated_hours
                        where counsel_id == this AND status == ACTIVE
      utilization_pct = round_half_up( total_allocated / annual_capacity_hours * 100, 2 ) / 100
      over_capacity = (total_allocated > annual_capacity_hours)   # strict >
    input_set: "ACTIVE MatterAssignment rows for the counsel whose parent Matter has status IN {ACTIVE, ON_HOLD}. Assignments on INTAKE, CLOSED, REOPENED, ARCHIVED matters do NOT consume capacity."
    constants: {}
    precision: "round_half_up to 2 decimal places"

  - name: mean_cycle_days
    trigger: "On Dashboard publish or read of DRAFT dashboard"
    algorithm: aggregation
    formula: |
      closed_matters = Matter rows where fiscal_period_id == dashboard.fiscal_period_id
                       AND status == CLOSED AND cycle_days IS NOT NULL
      if closed_matters is empty: mean_cycle_days = null
      else:
          # sum first as integer, then divide once, then round — pinned order
          s = sum(cycle_days)
          n = count(closed_matters)
          mean_cycle_days = round_half_up( s / n, 2 )
    input_set: "CLOSED matters in this fiscal period with non-null cycle_days. REOPENED matters excluded (their cycle_days was reset to null on reopen)."
    constants: {}
    precision: "round_half_up to 2 decimal places AFTER sum-then-divide"

# =============================================================================
# Table 4: Validation Rules Table (§1.4) — ordered by priority
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is authorized for this endpoint per §1.5 roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-templated resource ids exist (left-to-right); body FK fields exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (activate/hold/resume/close/reopen/archive/soft-close/hard-close/approve/pay/reject/release/publish)"

  - priority: 5
    category: business_safety
    check: "Segregation of duties: actor.id != invoice.creator_id when invoice.amount_cents >= 100000"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /legal-ops/invoices/{id}/approve"

  - priority: 6
    category: business_referential
    check: "Matter.matter_type_id resolves to a MatterType whose practice_area_id matches Matter.practice_area_id"
    error_id: ERR_TAXONOMY_MISMATCH
    http_status: 422
    applies_to: "POST /legal-ops/matters, PATCH /legal-ops/matters/{id}"

  - priority: 7
    category: business_temporal
    check: "FiscalPeriod.end_date > start_date; new period's [start_date, end_date] does not overlap any existing period's [start_date, end_date] (half-open adjacency permitted: a.end_date + 1 day == b.start_date is allowed)"
    error_id: ERR_PERIOD_OVERLAP
    http_status: 422
    applies_to: "POST /legal-ops/fiscal-periods"

  - priority: 8
    category: business_temporal
    check: "Referenced fiscal period is in a state that accepts the write (OPEN or REOPENED for matters/accruals/invoices)"
    error_id: ERR_PERIOD_CLOSED
    http_status: 409
    applies_to: "POST /legal-ops/matters, POST /legal-ops/accruals, POST /legal-ops/invoices, POST /legal-ops/matters/{id}/activate, POST /legal-ops/matters/{id}/resume, POST /legal-ops/invoices/{id}/approve, POST /legal-ops/invoices/{id}/pay, POST /legal-ops/accruals/{id}/release"

  - priority: 9
    category: business_referential
    check: "PracticeArea.status == ACTIVE when creating a Matter under it; OutsideCounselFirm.status == ACTIVE when creating an Invoice against it"
    error_id: ERR_ENTITY_INACTIVE
    http_status: 422
    applies_to: "POST /legal-ops/matters, POST /legal-ops/invoices"

  - priority: 10
    category: business_constraint
    check: "Uniqueness: LegalDepartment.name, PracticeArea.code, MatterType.code within practice_area, OutsideCounselFirm.name, InHouseCounsel.email, Matter.matter_number, Invoice.(firm_id, invoice_number), Dashboard.fiscal_period_id+snapshot_label"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST endpoints"

  - priority: 11
    category: business_constraint
    check: "MatterType.practice_area_id matches the PracticeArea under which it is nested (URL/body consistency)"
    error_id: ERR_PARENT_MISMATCH
    http_status: 422
    applies_to: "POST /legal-ops/practice-areas/{id}/matter-types"

  - priority: 12
    category: business_fiscal
    check: "Budget.allocated_cents >= 0; Matter.budget_cents >= 0; Accrual.amount_cents >= 0; Invoice.amount_cents > 0"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "POST/PATCH on budgets, matters, accruals, invoices"

  - priority: 13
    category: business_fiscal
    check: "Invoice payment does not push matching Budget past allocated_cents * (1 + OVERRUN_ALLOWANCE_PCT) — hard cap on overrun. OVERRUN_ALLOWANCE_PCT is fixed at 0.10."
    error_id: ERR_BUDGET_OVERRUN_EXCEEDED
    http_status: 422
    applies_to: "POST /legal-ops/invoices/{id}/pay"

  - priority: 14
    category: business_constraint
    check: "Matter has at least one ACTIVE MatterAssignment before activation"
    error_id: ERR_NO_ACTIVE_ASSIGNMENT
    http_status: 422
    applies_to: "POST /legal-ops/matters/{id}/activate"

  - priority: 15
    category: business_constraint
    check: "FiscalPeriod.hard_close precondition: no Invoice in period with payment_status == SUBMITTED; no Dashboard in period with status == DRAFT"
    error_id: ERR_PERIOD_NOT_CLOSABLE
    http_status: 422
    applies_to: "POST /legal-ops/fiscal-periods/{id}/hard-close"

  - priority: 16
    category: business_constraint
    check: "FiscalPeriod.reopen precondition: reopen_count < 2"
    error_id: ERR_REOPEN_LIMIT
    http_status: 422
    applies_to: "POST /legal-ops/fiscal-periods/{id}/reopen"

  - priority: 17
    category: business_constraint
    check: "MatterAssignment counsel capacity check on create: new total_allocated must be <= annual_capacity_hours (strict; over-capacity allocations rejected at write time)"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /legal-ops/matters/{id}/assignments"

  - priority: 18
    category: state
    check: "OCC: expected_<parent>_version matches current version (rule per §1.2.1)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /legal-ops/budgets/{id}, POST /legal-ops/matters/{id}/close, POST /legal-ops/dashboards/{id}/publish"

  - priority: 19
    category: business_temporal
    check: "Matter archive precondition: fiscal period is HARD_CLOSED"
    error_id: ERR_PERIOD_NOT_HARD_CLOSED
    http_status: 409
    applies_to: "POST /legal-ops/matters/{id}/archive"

  - priority: 20
    category: business_constraint
    check: "Required-field presence and scalar type correctness on all POST/PATCH payloads"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# Table 5: API Endpoint Table (§1.5)
# =============================================================================
endpoints:
  # --- Department (singleton-ish config) ---
  - method: POST
    path: "/legal-ops/departments"
    description: "Create legal department (one per deployment in this benchmark)"
    roles: [LegalOpsManager]
    code: 201
    input: [name, "budget_warning_pct?", "budget_critical_pct?", "deflection_target_pct?"]
    output: LegalDepartment
    side_effects: []
  - method: GET
    path: "/legal-ops/departments"
    description: "List departments, paginated, filterable by active_fiscal_period_id"
    roles: [LegalOpsManager, LegalOpsAnalyst, LegalOpsExecutive]
    code: 200
    input: ["active_fiscal_period_id?", "limit?", "offset?"]
    output: LegalDepartment[]
    side_effects: []
  - method: GET
    path: "/legal-ops/departments/{id}"
    description: "Fetch department"
    roles: [LegalOpsManager, LegalOpsAnalyst, LegalOpsExecutive]
    code: 200
    input: []
    output: LegalDepartment
    side_effects: []
  - method: PATCH
    path: "/legal-ops/departments/{id}"
    description: "Update thresholds"
    roles: [LegalOpsManager]
    code: 200
    input: ["budget_warning_pct?", "budget_critical_pct?", "deflection_target_pct?"]
    output: LegalDepartment
    side_effects: ["Re-derive posture for all Budget rows referencing this department's periods"]

  # --- Fiscal periods ---
  - method: POST
    path: "/legal-ops/fiscal-periods"
    description: "Create a fiscal period"
    roles: [LegalOpsManager]
    code: 201
    input: [label, start_date, end_date]
    output: FiscalPeriod
    side_effects: ["If this is the only OPEN period, set department.active_fiscal_period_id"]
  - method: GET
    path: "/legal-ops/fiscal-periods"
    description: "List fiscal periods, paginated, filterable by status"
    roles: [LegalOpsManager, LegalOpsAnalyst, LegalOpsExecutive]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FiscalPeriod[]
    side_effects: []
  - method: GET
    path: "/legal-ops/fiscal-periods/{id}"
    description: "Fetch one fiscal period"
    roles: [LegalOpsManager, LegalOpsAnalyst, LegalOpsExecutive]
    code: 200
    input: []
    output: FiscalPeriod
    side_effects: []
  - method: POST
    path: "/legal-ops/fiscal-periods/{id}/soft-close"
    description: "OPEN/REOPENED -> SOFT_CLOSED; auto-expires all OUTSTANDING accruals in the period"
    roles: [LegalOpsAnalyst]
    code: 200
    input: []
    output: FiscalPeriod
    side_effects: ["Accrual sweep", "Matter.accrual_outstanding_cents recompute", "FiscalPeriod.total_accrual_cents recompute", "increments FiscalPeriod.version by 1"]
  - method: POST
    path: "/legal-ops/fiscal-periods/{id}/hard-close"
    description: "SOFT_CLOSED -> HARD_CLOSED"
    roles: [LegalOpsManager]
    code: 200
    input: []
    output: FiscalPeriod
    side_effects: ["increments FiscalPeriod.version by 1"]
  - method: POST
    path: "/legal-ops/fiscal-periods/{id}/reopen"
    description: "HARD_CLOSED -> REOPENED (max 2 reopens)"
    roles: [LegalOpsManager]
    code: 200
    input: []
    output: FiscalPeriod
    side_effects: ["reopen_count += 1", "increments FiscalPeriod.version by 1"]

  # --- Practice areas ---
  - method: POST
    path: "/legal-ops/practice-areas"
    description: "Create practice area"
    roles: [LegalOpsManager]
    code: 201
    input: [code, display_name]
    output: PracticeArea
    side_effects: []
  - method: GET
    path: "/legal-ops/practice-areas"
    description: "List practice areas, paginated"
    roles: [LegalOpsManager, LegalOpsAnalyst, LegalOpsExecutive]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PracticeArea[]
    side_effects: []
  - method: GET
    path: "/legal-ops/practice-areas/{id}"
    description: "Fetch practice area"
    roles: [LegalOpsManager, LegalOpsAnalyst, LegalOpsExecutive]
    code: 200
    input: []
    output: PracticeArea
    side_effects: []
  - method: POST
    path: "/legal-ops/practice-areas/{id}/archive"
    description: "Archive a practice area (rejects new matters)"
    roles: [LegalOpsManager]
    code: 200
    input: []
    output: PracticeArea
    side_effects: []

  # --- Matter types ---
  - method: POST
    path: "/legal-ops/practice-areas/{id}/matter-types"
    description: "Create a matter type under a practice area"
    roles: [LegalOpsManager]
    code: 201
    input: [code, display_name, "default_budget_cents?"]
    output: MatterType
    side_effects: []
  - method: GET
    path: "/legal-ops/practice-areas/{id}/matter-types"
    description: "List matter types under a practice area"
    roles: [LegalOpsManager, LegalOpsAnalyst, LegalOpsExecutive]
    code: 200
    input: ["limit?", "offset?"]
    output: MatterType[]
    side_effects: []
  - method: GET
    path: "/legal-ops/matter-types/{id}"
    description: "Fetch one matter type"
    roles: [LegalOpsManager, LegalOpsAnalyst, LegalOpsExecutive]
    code: 200
    input: []
    output: MatterType
    side_effects: []

  # --- Outside counsel firms ---
  - method: POST
    path: "/legal-ops/firms"
    description: "Register outside counsel firm"
    roles: [LegalOpsManager]
    code: 201
    input: [name, tier, blended_hourly_rate_cents]
    output: OutsideCounselFirm
    side_effects: []
  - method: GET
    path: "/legal-ops/firms"
    description: "List firms, paginated, filterable by tier / status"
    roles: [LegalOpsManager, LegalOpsAnalyst, LegalOpsExecutive]
    code: 200
    input: ["tier?", "status?", "limit?", "offset?"]
    output: OutsideCounselFirm[]
    side_effects: []
  - method: GET
    path: "/legal-ops/firms/{id}"
    description: "Fetch firm"
    roles: [LegalOpsManager, LegalOpsAnalyst, LegalOpsExecutive]
    code: 200
    input: []
    output: OutsideCounselFirm
    side_effects: []
  - method: POST
    path: "/legal-ops/firms/{id}/suspend"
    description: "Suspend a firm — rejects new invoices"
    roles: [LegalOpsManager]
    code: 200
    input: []
    output: OutsideCounselFirm
    side_effects: []

  # --- In-house counsel ---
  - method: POST
    path: "/legal-ops/in-house-counsel"
    description: "Register in-house counsel"
    roles: [LegalOpsManager]
    code: 201
    input: [full_name, email, annual_capacity_hours, loaded_hourly_cost_cents]
    output: InHouseCounsel
    side_effects: []
  - method: GET
    path: "/legal-ops/in-house-counsel"
