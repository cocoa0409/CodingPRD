      - name: cascading_side_effects_layer_covered_by_the_five_hop_escalation
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - endpoints.POST_/diligence-requests/{id}/escalate
          - state_machines.Restructuring
        excluded_because:
          difficulty_instance: critical_escalation_five_hop_cascade_unwinds_letter_approvals_and_seats
          rationale: "That §1.8 transitive_cascade instance already verifies the N-level chain end-to-end at its full declared depth of five hops (finding ESCALATED, deal reverted to LOI_NEGOTIATION with round_no incremented, EXECUTED letter SUPERSEDED and RELEASED, both CERTIFIED approvals SUPERSEDED, seats returned to the pool and governance_seats reset), tests ordering sensitivity by asserting the intermediate hop states rather than only the endpoints, and tests partial failure by escalating a HIGH finding in the same fixture, which must stop at hop 1 and leave the Restructuring untouched. A second corner instance would restate it call for call."

      - name: dual_variant_calculation_layer_covered_by_the_alignment_variant_pair
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.mission_program_alignment_score
          - endpoints.POST_/alignment-assessments
        excluded_because:
          difficulty_instance: alignment_screening_vs_diligence_adjusted_variant_divergence
          rationale: "That §1.8 dual_variant_calc instance already computes both declared variants over identical inputs, asserts each field of each variant independently, and asserts the composite delta produced by the switch from SCREENING to DILIGENCE_ADJUSTED, which is exactly the layer claim (both variants produce expected results; the delta on switch is correct). The scaffold's second variant pair, the DONOR_CONSENT / JUDICIAL_MODIFICATION transferable amount, is covered the same way by restricted_fund_donor_consent_vs_judicial_modification_divergence, so a corner instance here would be a third restatement."

  # ------------------------------------------------------ consistency_model
  # complexity_profile.consistency_model is `immediate`, whose claim is that all
  # changes are visible in the same request's response. The scaffold nevertheless
  # OWNS a checkpoint endpoint (POST /regulatory-sweeps) for the three genuinely
  # time-driven transitions, so the sharp form of the immediate claim here is a
  # pair of instances in which every derived and cascaded change is asserted from
  # the mutating response itself and from reads taken before any sweep, with a
  # sweep at the end acting as the control that must change nothing.
  - section: consistency_model
    instances:
      - name: the_certification_response_already_carries_the_seats_it_moved
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/board-approvals/{id}/certify
          - calculations.governance_seat_allocation
          - endpoints.GET_/restructurings/{id}/dossier
        distinguishing_aspect: "Certification writes four rows at once - the approval, the deal's seat pool, the certifying party's governance_seats and, on the second certification, the deal status - and under immediate consistency every one of them must be readable at once. The response body of the certify call itself must already carry the allocated seats and the pinned score; no read-your-writes delay, no sweep and no second request may be required. The trailing sweep is the control: it must report three empty id lists and mutate nothing, proving the visibility came from the write and not from the checkpoint."
        test_recipe:
          setup:
            - "Both board approvals RECORDED, reserved_seat_pool 15, both governance_seats 0"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: PlatformAdmin
              captures: { org_a: $.data.id }
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Youth Collective", ein: "22-2222222", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 40000000 }
              as: PlatformAdmin
              captures: { org_b: $.data.id }
            - call: "POST /restructurings"
              payload: { initiator_org_id: "${org_a}", target_org_id: "${org_b}", confidentiality_tier: "RESTRICTED" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { deal: $.data.id }
            - call: "POST /alignment-assessments"
              payload: { restructuring_id: "${deal}", variant: "SCREENING" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
            - call: "GET /restructurings/${deal}"
              payload: {}
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { rv_a: $.data.version }
            - call: "POST /letters-of-intent"
              payload: { restructuring_id: "${deal}", expected_restructuring_version: "${rv_a}", proposed_structure_type: "MERGER", combined_board_seats: 15, board_seat_split_initiator: 8, exclusivity_days: 60, exclusivity_start_date: "2026-08-01" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { loi: $.data.id }
            - call: "POST /letters-of-intent/${loi}/execute"
              payload: { executed_note: "countersigned" }
              as: StrategyOfficer
              as_user_id: "${org_b}"
            - call: "POST /diligence-requests"
              payload: { restructuring_id: "${deal}", workstream: "FINANCE", severity: "HIGH", summary: "Unreconciled pledge receivable", exposure_cents: 29916670 }
              as: DiligenceLead
              as_user_id: "dl-001"
              captures: { finding: $.data.id }
            - call: "POST /alignment-assessments"
              payload: { restructuring_id: "${deal}", variant: "DILIGENCE_ADJUSTED" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
            - call: "POST /diligence-requests/${finding}/respond"
              payload: { response_ref: "RESP-0001" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
            - call: "POST /diligence-requests/${finding}/clear"
              payload: { clearance_note: "Reconciled against audited schedule" }
              as: DiligenceLead
              as_user_id: "dl-002"
            - call: "POST /restructurings/${deal}/select-structure"
              payload: { structure_type: "MERGER", unrestricted_transfer_value_cents: 200000000 }
              as: StrategyOfficer
              as_user_id: "${org_a}"
            - call: "GET /restructurings/${deal}"
              payload: {}
              as: BoardSecretary
              as_user_id: "${org_a}"
              captures: { rv_b: $.data.version }
            - call: "POST /board-approvals"
              payload: { restructuring_id: "${deal}", expected_restructuring_version: "${rv_b}", approving_party: "INITIATOR", seats_total: 15, recusals: 1, votes_for: 10, votes_against: 4, abstentions: 0, conflict_disclosures_count: 1, recording_secretary_ref: "SEC-A-1" }
              as: BoardSecretary
              as_user_id: "${org_a}"
              captures: { ba_i: $.data.id }
            - call: "GET /restructurings/${deal}"
              payload: {}
              as: BoardSecretary
              as_user_id: "${org_b}"
              captures: { rv_c: $.data.version }
            - call: "POST /board-approvals"
              payload: { restructuring_id: "${deal}", expected_restructuring_version: "${rv_c}", approving_party: "TARGET", seats_total: 12, recusals: 0, votes_for: 8, votes_against: 4, abstentions: 0, conflict_disclosures_count: 0, recording_secretary_ref: "SEC-B-1" }
              as: BoardSecretary
              as_user_id: "${org_b}"
              captures: { ba_t: $.data.id }
          trigger:
            - call: "POST /board-approvals/${ba_i}/certify"
              payload: { fiduciary_memo_ref: "MEMO-A-1", certifying_secretary_ref: "SEC-A-2" }
              as: BoardSecretary
              as_user_id: "${org_a}"
            - call: "GET /restructurings/${deal}"
              payload: {}
              as: StrategyOfficer
              as_user_id: "${org_a}"
            - call: "GET /organizations/${org_a}"
              payload: {}
              as: StrategyOfficer
              as_user_id: "${org_a}"
            - call: "POST /board-approvals/${ba_t}/certify"
              payload: { fiduciary_memo_ref: "MEMO-B-1", certifying_secretary_ref: "SEC-B-2" }
              as: BoardSecretary
              as_user_id: "${org_b}"
            - call: "GET /restructurings/${deal}/dossier"
              payload: {}
              as: StrategyOfficer
              as_user_id: "${org_a}"
            - call: "POST /regulatory-sweeps"
              payload: {}
              as: PlatformAdmin
            - call: "GET /restructurings/${deal}/dossier"
              payload: {}
              as: StrategyOfficer
              as_user_id: "${org_a}"
          assert:
            - "the FIRST certify response body already contains status CERTIFIED, allocated_seats 8, pinned_composite_score 60.00 and pinned_assessment_sequence_no 2 - the derived fields are in the mutating response, not in a later read"
            - "the immediately following GET /restructurings/${deal} shows reserved_seat_pool 7 with no sweep in between"
            - "the immediately following GET /organizations/${org_a} shows governance_seats 8"
            - "the SECOND certify response body already contains allocated_seats 7"
            - "the dossier read taken straight after that second certify shows reserved_seat_pool 0, certified_allocated_seats_total 15, seat_ledger_total 15, combined_board_seats 15 and deal_status REGULATORY_REVIEW - the bubble-up transition is visible in the same instant as the write that caused it"
            - "the dossier also shows screening_composite_score, diligence_adjusted_composite_score and composite_delta already populated from the two setup assessments"
            - "POST /regulatory-sweeps returns HTTP status 200 with deemed_approved_filing_ids, lapsed_letter_of_intent_ids and expired_exclusivity_letter_of_intent_ids all empty - at clock 2026-08-01T00:00:00.000Z the EXECUTED letter is neither lapsed nor expired and there is no filing to deem"
            - "the dossier read after the sweep is identical to the one before it, and Restructuring.${deal}.version is unchanged by the sweep"

