      - name: offer_close_blocked_by_open_incident
        grounds:
          - state_machines.SurplusOffer.GLEANED_to_CLOSED
          - state_machines.FoodSafetyIncident
          - errors[ERR_INCIDENT_OPEN]
        distinguishing_aspect: |
          Pair SurplusOffer -> FoodSafetyIncident (third distinct pair): offer
          close requires zero OPEN incidents across the offer's events. With an
          OPEN incident the close fails ERR_INVALID_STATE (state precondition,
          priority 4); after FoodSafetyOfficer resolves the incident the same
          close succeeds — the gate depends on a DIFFERENT role resolving a
          DIFFERENT entity, enforcing segregation of duties end-to-end.
        test_recipe:
          setup:
            - "Offer GLEANED (event reconciled... no — reconcile requires incidents resolved, so: event HARVESTED, distribution delivered, incident OPEN; reconcile blocked; actually reconcile requires incidents resolved too. Use: event RECONCILED requires no OPEN incidents, so to have offer GLEANED with an OPEN incident the incident must be opened AFTER reconcile but BEFORE close.)"
            - "Sequence: event harvested -> reconcile -> offer GLEANED; then open incident on the (already reconciled) event; close attempt -> ERR_INVALID_STATE; resolve incident; close succeeds"
