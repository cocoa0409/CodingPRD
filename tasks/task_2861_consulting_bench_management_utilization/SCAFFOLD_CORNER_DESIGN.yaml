# SCAFFOLD_CORNER_DESIGN.yaml — task_2861_consulting_bench_management_utilization
#
# §1.9 breadth index for SCAFFOLD.yaml, walked row-by-row against
# references/claim-extraction-guide.md. `section:` values are the guide's nine sections and
# `claim_type:` values are its per-section rows; nothing here declares new behaviour.
#
# Query parameters are expressed as `payload:` keys on GET calls (every one is a declared
# §1.5 `input:` token of that endpoint). Calendar facts are the same set the difficulty
# design pins: 2026-08-03 Mon, 2026-08-17 Mon, 2026-08-28 Fri, 2026-09-02 Wed,
# 2026-09-30 Wed; Mon–Fri in [2026-08-03, 2026-08-29) = 20.
# Every §1.6 error code is triggered by at least one instance below or by a named §1.8
# instance cited in an `excluded_because:` stub.

scaffold_corner_design:

  - section: entities
    instances:

      - name: practice_group_create_returns_201_with_every_declared_field
        claim_type: Creation
        grounds:
          - entities.PracticeGroup
          - endpoints[POST /practice-groups]
        distinguishing_aspect: "A minimal POST /practice-groups returns 201 with all eleven declared fields present, the five derived counters at their empty-collection values and posture OPEN."
        test_recipe:
          setup:
            - "Empty database. Clock left at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id, pg_v: $.data.version }
          assert:
            - "HTTP 201 with response_type == \"object\" and meta.api_request_id / meta.api_request_timestamp present"
            - "data.name == \"Cloud NA\" and data.geography_code == \"NA\""
            - "data.parent_group_id is null and data.level_targets == {}"
            - "data.total_headcount == 0, bench_headcount == 0, escalated_l2_count == 0"
            - "data.own_bench_ratio == 0.0000 and rollup_bench_ratio == 0.0000 (the zero-denominator case reports 0.0000, not an error)"
            - "data.posture == \"OPEN\""
            - "${pg_v} == 1 and ${pg_id} is a bare UUID with no type prefix"

      - name: practice_group_get_by_id_returns_the_stored_row
        claim_type: Retrieval
        grounds:
          - entities.PracticeGroup
          - endpoints[GET /practice-groups/{id}]
        distinguishing_aspect: "GET /practice-groups/{id} returns the same field values the create response reported, including the non-default external_sourcing_cap_pct, with no version bump for a read."
        test_recipe:
          setup:
            - "One group created with an explicit external_sourcing_cap_pct of 45.00."
          setup_api_calls:
            - call: "POST /practice-groups"
              payload: { name: "Cloud EMEA", geography_code: "EMEA", external_sourcing_cap_pct: 45.00 }
              as: PracticePartner
              captures: { pg_id: $.data.id }
          trigger:
            - call: "GET /practice-groups/${pg_id}"
              payload: {}
              as: ResourceManager
          assert:
            - "HTTP 200 with data.id == ${pg_id}"
            - "data.name == \"Cloud EMEA\", data.geography_code == \"EMEA\", data.external_sourcing_cap_pct == 45.00"
            - "data.version == 1 — a GET is not a mutation"
            - "data.posture == \"OPEN\" and data.total_headcount == 0"

      - name: skills_list_reports_total_count_and_has_more_across_pages
        claim_type: Listing
        grounds:
          - entities.Skill
          - endpoints[GET /skills]
        distinguishing_aspect: "With three skills stored, GET /skills at limit 2 reports total_count 3 / has_more true on page one and total_count 3 / has_more false with a single row on page two."
        test_recipe:
          setup:
            - "Three skills registered: CLOUD_ARCH and DATA_ENG in family CLOUD/DATA, plus one retired skill."
          setup_api_calls:
            - call: "POST /skills"
              payload: { code: "CLOUD_ARCH", name: "Cloud Architecture", family: "CLOUD" }
              as: PracticePartner
            - call: "POST /skills"
              payload: { code: "DATA_ENG", name: "Data Engineering", family: "DATA" }
              as: PracticePartner
            - call: "POST /skills"
              payload: { code: "MAINFRAME", name: "Mainframe Ops", family: "CLOUD", retired: true }
              as: PracticePartner
          trigger:
            - call: "GET /skills"
              payload: { limit: 2, offset: 0 }
              as: ResourceManager
            - call: "GET /skills"
              payload: { limit: 2, offset: 2 }
              as: ResourceManager
            - call: "GET /skills"
              payload: { retired: true }
              as: ResourceManager
          assert:
            - "page one: HTTP 200, response_type == \"array\", 2 rows, limit == 2, offset == 0, total_count == 3, has_more == true"
            - "page two: 1 row, offset == 2, total_count == 3, has_more == false"
            - "the retired filter returns exactly 1 row whose code == \"MAINFRAME\" and retired == true, with total_count == 1"
            - "default pagination is not applied when limit is supplied explicitly; total_count counts the whole filtered set, not the page"

      - name: consultant_get_with_unknown_uuid_returns_consultant_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=4]
          - errors[ERR_CONSULTANT_NOT_FOUND]
          - endpoints[GET /consultants/{id}]
        distinguishing_aspect: "A well-formed but unused UUID on GET /consultants/{id} yields 404 ERR_CONSULTANT_NOT_FOUND, not 400 and not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database — no consultant has ever been created, so any UUID is unused."
          setup_api_calls: []
          trigger:
            - call: "GET /consultants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ResourceManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 with ${err_id} == ERR_CONSULTANT_NOT_FOUND and response_type == \"error\""
            - "data.message is a non-empty string; no data.id field is present on an error envelope"

      - name: skill_create_missing_required_family_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - entities.Skill.fields.family
          - endpoints[POST /skills]
        distinguishing_aspect: "family has source input and no default, so omitting it is a 422 ERR_INVALID_REQUEST rather than a silently-defaulted row."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /skills"
              payload: { code: "CLOUD_ARCH", name: "Cloud Architecture" }
              as: PracticePartner
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422 with ${err_id} == ERR_INVALID_REQUEST"
            - "GET /skills returns total_count == 0 — the rejected create persisted nothing"

      - name: omitted_optional_inputs_apply_the_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Skill.fields.scarcity_index
          - entities.Consultant.fields.travel_max_nights_per_week
          - entities.SubcontractorFirm.fields.markup_pct
          - entities.SubcontractorFirm.fields.approval_status
          - entities.ReskillingProgram.fields.cooldown_days
          - endpoints[POST /consultants]
        distinguishing_aspect: "Four creates that omit every optional token land on the §1.1 defaults exactly — scarcity 0.5000, travel 3 nights / international false, markup 15.00 with approval APPROVED, cooldown 3 days."
        test_recipe:
          setup:
            - "One NA group so the consultant create has a parent to reference."
          setup_api_calls:
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
          trigger:
            - call: "POST /skills"
              payload: { code: "CLOUD_ARCH", name: "Cloud Architecture", family: "CLOUD" }
              as: PracticePartner
              captures: { sk_id: $.data.id }
            - call: "POST /consultants"
              payload: { full_name: "Ada Byron", email: "ada.byron@firm.test", level: "CONSULTANT", practice_group_id: "${pg_id}", home_city: "Boston", home_geo_code: "NA", cost_rate_usd_per_hour: 120.00, standard_bill_rate_usd_per_hour: 300.00 }
              as: ResourceManager
              captures: { c1_id: $.data.id }
            - call: "POST /subcontractor-firms"
              payload: { name: "NorthStar Partners", geo_code: "NA", max_concurrent_placements: 2, pass_through_rate_usd_per_hour: 150.00 }
              as: PracticePartner
              captures: { f1_id: $.data.id }
            - call: "POST /reskilling-programs"
              payload: { skill_id: "${sk_id}", target_proficiency_level: 4, cohort_start_on: "2026-09-01", cohort_end_on: "2026-09-30", seat_capacity: 2 }
              as: ResourceManager
              captures: { rp_id: $.data.id }
          assert:
            - "Skill.${sk_id}.scarcity_index == 0.5000 and retired == false"
            - "Consultant.${c1_id}.travel_max_nights_per_week == 3, travel_willing_international == false, development_goal_skill_id is null, industry_experience == []"
            - "Consultant.${c1_id}.availability_status == \"BENCH\" and allocated_pct == 0.00"
            - "SubcontractorFirm.${f1_id}.markup_pct == 15.00, approval_status == \"APPROVED\", active_placements_count == 0"
            - "ReskillingProgram.${rp_id}.cooldown_days == 3, seats_taken == 0, status == \"PLANNED\""
            - "PracticeGroup.${pg_id}.external_sourcing_cap_pct == 20.00 (the group default) and total_headcount == 1 after the consultant create"

      - name: demand_create_derives_every_computed_field_from_the_inputs
        claim_type: Computed Fields
        grounds:
          - entities.DemandOpportunity.fields.weighted_fte
          - entities.DemandOpportunity.fields.effective_rate_usd_per_hour
          - entities.DemandOpportunity.fields.booked_realization_pct
          - entities.DemandOpportunity.fields.earned_realization_pct
          - entities.DemandOpportunity.fields.open_fte
          - endpoints[POST /demand-opportunities]
        distinguishing_aspect: "None of the fifteen computed/system fields is a §1.5 input token, and all of them come back correct on create: weighted_fte 1.30 from 2.00 × 65%, effective rate falling back to the requested 240.00, booked realization 96.00 and a null earned realization."
        test_recipe:
          setup:
            - "One NA group and one CLOUD_ARCH skill."
          setup_api_calls:
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
            - call: "POST /skills"
              payload: { code: "CLOUD_ARCH", name: "Cloud Architecture", family: "CLOUD" }
              as: PracticePartner
              captures: { sk_id: $.data.id }
          trigger:
            - call: "POST /demand-opportunities"
              payload: { client_name: "Acme Retail", practice_group_id: "${pg_id}", required_skill_id: "${sk_id}", min_proficiency_level: 3, required_fte: 2.00, win_probability_pct: 65, start_date: "2026-08-03", end_date: "2026-08-28", industry_code: "RETAIL", onsite_nights_per_week: 2, standard_rate_usd_per_hour: 250.00, requested_rate_usd_per_hour: 240.00 }
              as: SalesLead
              captures: { d1_id: $.data.id }
          assert:
            - "HTTP 201; DemandOpportunity.${d1_id}.weighted_fte == 1.30 (round(2.00 * 65 / 100, 2))"
            - "approved_rate_usd_per_hour is null and effective_rate_usd_per_hour == 240.00 (the requested-rate fallback)"
            - "booked_realization_pct == 96.00 (round(100 * 240.00 / 250.00, 2))"
            - "earned_realization_pct is null and blended_margin_pct is null; blended_cost_rate_usd_per_hour == 0.00 and margin_breach == false"
            - "covered_internal_fte == 0.00, covered_external_fte == 0.00, open_fte == 2.00"
            - "pipeline_status == \"QUALIFYING\", staffing_status == \"UNSTAFFED\", staffing_mode is null, closed_outcome is null, is_international == false"

      - name: system_fields_are_server_minted_and_version_bumps_per_mutation
        claim_type: System Fields
        grounds:
          - entities.Skill
          - endpoints[POST /skills]
          - endpoints[PATCH /skills/{id}]
        distinguishing_aspect: "id / created_at / updated_at / version are minted by the server: version is 1 with created_at == updated_at after the create, and the PATCH leaves id and created_at untouched while moving version to 2 and refreshing updated_at."
        test_recipe:
          setup:
            - "One skill at its default scarcity_index."
          setup_api_calls:
            - call: "POST /skills"
              payload: { code: "CLOUD_ARCH", name: "Cloud Architecture", family: "CLOUD" }
              as: PracticePartner
              captures: { sk_id: $.data.id, sk_created: $.data.created_at, sk_v1: $.data.version }
          trigger:
            - call: "PATCH /skills/${sk_id}"
              payload: { scarcity_index: 0.8000 }
              as: PracticePartner
              captures: { sk_v2: $.data.version }
          assert:
            - "${sk_v1} == 1 and, on the create response, updated_at == created_at == ${sk_created} (ISO 8601 UTC with exactly three fractional digits)"
            - "${sk_v2} == 2 — version increments by exactly one per mutation"
            - "after the PATCH: data.id == ${sk_id} and data.created_at == ${sk_created} (both immutable), while updated_at is strictly greater than ${sk_created}"
            - "data.scarcity_index == 0.8000 and data.retired == false — the untouched optional field keeps its stored value"

      - name: type_and_range_violations_are_rejected_before_any_business_rule
        claim_type: Type Constraints
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - entities.Skill.fields.family
          - entities.Consultant.fields.level
          - entities.DemandOpportunity.fields.required_fte
          - endpoints[POST /demand-opportunities]
        distinguishing_aspect: "Four different shape violations — an out-of-catalogue enum, an unknown body key, a sub-minimum decimal and an end date before its start — all return 422 ERR_INVALID_REQUEST from the same priority-3 gate."
        test_recipe:
          setup:
            - "One NA group and one CLOUD_ARCH skill, so every rejection below is about shape rather than a missing FK."
          setup_api_calls:
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
            - call: "POST /skills"
              payload: { code: "CLOUD_ARCH", name: "Cloud Architecture", family: "CLOUD" }
              as: PracticePartner
              captures: { sk_id: $.data.id }
          trigger:
            - call: "POST /skills"
              payload: { code: "QUANTUM_ML", name: "Quantum ML", family: "QUANTUM" }
              as: PracticePartner
              captures: { err_enum: $.data.error_id }
            - call: "POST /skills"
              payload: { code: "GRAPH_DB", name: "Graph Databases", family: "DATA", unexpected_key: 1 }
              as: PracticePartner
              captures: { err_unknown_key: $.data.error_id }
            - call: "POST /demand-opportunities"
              payload: { client_name: "Acme Retail", practice_group_id: "${pg_id}", required_skill_id: "${sk_id}", min_proficiency_level: 3, required_fte: 0.10, win_probability_pct: 60, start_date: "2026-08-03", end_date: "2026-08-28", industry_code: "RETAIL", onsite_nights_per_week: 2, standard_rate_usd_per_hour: 250.00, requested_rate_usd_per_hour: 240.00 }
              as: SalesLead
              captures: { err_range: $.data.error_id }
            - call: "POST /demand-opportunities"
              payload: { client_name: "Acme Retail", practice_group_id: "${pg_id}", required_skill_id: "${sk_id}", min_proficiency_level: 3, required_fte: 1.00, win_probability_pct: 60, start_date: "2026-08-28", end_date: "2026-08-03", industry_code: "RETAIL", onsite_nights_per_week: 2, standard_rate_usd_per_hour: 250.00, requested_rate_usd_per_hour: 240.00 }
              as: SalesLead
              captures: { err_order: $.data.error_id }
          assert:
            - "${err_enum} == ERR_INVALID_REQUEST with HTTP 422 — QUANTUM is not in the Skill.family enum"
            - "${err_unknown_key} == ERR_INVALID_REQUEST — unknown body keys are rejected, not ignored"
            - "${err_range} == ERR_INVALID_REQUEST — required_fte 0.10 is below the declared 0.25 minimum"
            - "${err_order} == ERR_INVALID_REQUEST — end_date must be >= start_date"
            - "GET /skills returns total_count == 1 and GET /demand-opportunities returns total_count == 0 — none of the four rejections persisted a row"

      - name: hiring_forecast_is_an_immutable_snapshot_with_no_version_field
        claim_type: Immutability
        grounds:
          - entities.HiringForecast
          - endpoints[POST /hiring-forecasts]
          - endpoints[GET /hiring-forecasts/{id}]
        distinguishing_aspect: "HiringForecast is declared common_fields: false, so it carries id and created_at but no version or updated_at, §1.5 offers no PATCH for it, and a later qualified demand in the same skill/geography cut does not alter the stored numbers."
        test_recipe:
          setup:
            - "One NA group and one CLOUD_ARCH skill; no consultants, no demands, no placements — so every forecast term starts at zero."
          setup_api_calls:
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
            - call: "POST /skills"
              payload: { code: "CLOUD_ARCH", name: "Cloud Architecture", family: "CLOUD" }
              as: PracticePartner
              captures: { sk_id: $.data.id }
            - call: "POST /hiring-forecasts"
              payload: { skill_code: "CLOUD_ARCH", geography_code: "NA", horizon_start_on: "2026-08-01", horizon_end_on: "2026-09-30" }
              as: FinanceController
              captures: { hf_id: $.data.id, hf_generated: $.data.generated_at }
          trigger:
            - call: "POST /demand-opportunities"
              payload: { client_name: "Acme Retail", practice_group_id: "${pg_id}", required_skill_id: "${sk_id}", min_proficiency_level: 3, required_fte: 2.00, win_probability_pct: 80, start_date: "2026-08-03", end_date: "2026-08-28", industry_code: "RETAIL", onsite_nights_per_week: 2, standard_rate_usd_per_hour: 250.00, requested_rate_usd_per_hour: 240.00 }
              as: SalesLead
              captures: { d1_id: $.data.id }
            - call: "POST /demand-opportunities/${d1_id}/qualify"
              payload: {}
              as: SalesLead
            - call: "GET /hiring-forecasts/${hf_id}"
              payload: {}
              as: FinanceController
          assert:
            - "the create response carries id, created_at, generated_at == ${hf_generated} and basis == \"WEIGHTED\", and carries NO version and NO updated_at field"
            - "weighted_demand_fte == 0.00, internal_supply_fte == 0.00, external_supply_fte == 0.00, gap_fte == 0.00, recommended_hires == 0 at generation time"
            - "the newly QUALIFIED demand has weighted_fte == 1.60, and it IS in the forecast scope for CLOUD_ARCH / NA over 2026-08-01..2026-09-30"
            - "the re-read of ${hf_id} still reports weighted_demand_fte == 0.00 and gap_fte == 0.00 — the row is a frozen snapshot, not a live view"
            - "§1.5 declares no PATCH or DELETE for /hiring-forecasts, so no endpoint can mutate ${hf_id}"

      - name: consultant_create_with_unknown_practice_group_returns_group_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_PRACTICE_GROUP_NOT_FOUND]
          - entities.Consultant.fields.practice_group_id
          - endpoints[POST /consultants]
        distinguishing_aspect: "A body FK naming no existing group is a 404 ERR_PRACTICE_GROUP_NOT_FOUND at priority 5, before any geography or uniqueness rule can look at the payload."
        test_recipe:
          setup:
            - "Empty database — no group exists, so the referenced parent cannot resolve."
          setup_api_calls: []
          trigger:
            - call: "POST /consultants"
              payload: { full_name: "Ada Byron", email: "ada.byron@firm.test", level: "CONSULTANT", practice_group_id: "00000000-0000-4000-8000-000000000000", home_city: "Boston", home_geo_code: "EMEA", cost_rate_usd_per_hour: 120.00, standard_bill_rate_usd_per_hour: 300.00 }
              as: ResourceManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 with ${err_id} == ERR_PRACTICE_GROUP_NOT_FOUND"
            - "the home_geo_code EMEA would also have violated priority 35 once a group existed, yet the 404 wins because priority 5 runs first"
            - "GET /consultants returns total_count == 0"

      - name: self_referential_parent_link_is_readable_from_both_directions
        claim_type: flat
        grounds:
          - entities.PracticeGroup.fields.parent_group_id
          - endpoints[GET /practice-groups/{id}/child-groups]
          - endpoints[GET /practice-groups]
        distinguishing_aspect: "The self-referential FK is validated on create and then readable both through the nested child-groups path and through the parent_group_id list filter, with the parent's own row unchanged."
        test_recipe:
          setup:
            - "A parent group 'Cloud NA' and one child group 'Cloud NA East' pointing at it."
          setup_api_calls:
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { parent_id: $.data.id }
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA East", geography_code: "NA", parent_group_id: "${parent_id}" }
              as: PracticePartner
              captures: { child_id: $.data.id }
          trigger:
            - call: "GET /practice-groups/${parent_id}/child-groups"
              payload: {}
              as: ResourceManager
            - call: "GET /practice-groups"
              payload: { parent_group_id: "${parent_id}" }
              as: ResourceManager
          assert:
            - "the nested read returns total_count == 1 with the single row's id == ${child_id} and parent_group_id == ${parent_id}"
            - "the filtered list returns the same single row — the two paths agree"
            - "PracticeGroup.${parent_id}.parent_group_id is null and its version is still 1: adding a child does not rewrite the parent row, only its derived rollup terms (both still 0.0000 with no headcount)"
            - "GET /practice-groups/${child_id}/child-groups returns total_count == 0"

  - section: state_machines
    instances:

      - name: every_state_machine_starts_in_its_declared_initial_state
        claim_type: Initial State
        grounds:
          - state_machines.DemandOpportunity.pipeline_status
          - state_machines.DemandOpportunity.staffing_status
          - state_machines.Assignment
          - state_machines.BenchSpell
          - state_machines.ReskillingProgram
          - state_machines.UtilizationPeriod
        distinguishing_aspect: "Six freshly created rows report exactly the six declared initial_state values — QUALIFYING/UNSTAFFED, PROPOSED, MONITORING, PLANNED, OPEN — with the bench spell appearing as a side effect of the consultant create rather than through any endpoint of its own."
        test_recipe:
          setup:
            - "Clock at 2026-08-03. One NA group and one CLOUD_ARCH skill."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ResourceManager
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
            - call: "POST /skills"
              payload: { code: "CLOUD_ARCH", name: "Cloud Architecture", family: "CLOUD" }
              as: PracticePartner
              captures: { sk_id: $.data.id }
          trigger:
            - call: "POST /consultants"
              payload: { full_name: "Ada Byron", email: "ada.byron@firm.test", level: "CONSULTANT", practice_group_id: "${pg_id}", home_city: "Boston", home_geo_code: "NA", cost_rate_usd_per_hour: 120.00, standard_bill_rate_usd_per_hour: 300.00 }
              as: ResourceManager
              captures: { c1_id: $.data.id, c1_v: $.data.version }
            - call: "POST /skill-assertions"
              payload: { consultant_id: "${c1_id}", skill_id: "${sk_id}", proficiency_level: 4 }
              as: ResourceManager
              captures: { sa_id: $.data.id }
            - call: "POST /demand-opportunities"
              payload: { client_name: "Acme Retail", practice_group_id: "${pg_id}", required_skill_id: "${sk_id}", min_proficiency_level: 3, required_fte: 1.00, win_probability_pct: 60, start_date: "2026-08-03", end_date: "2026-08-28", industry_code: "RETAIL", onsite_nights_per_week: 2, standard_rate_usd_per_hour: 250.00, requested_rate_usd_per_hour: 240.00 }
              as: SalesLead
              captures: { d1_id: $.data.id }
            - call: "POST /demand-opportunities/${d1_id}/qualify"
              payload: {}
              as: SalesLead
