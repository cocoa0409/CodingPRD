    side_effects: ["order_status := RELEASED", "increments CatalogOrder.version by 1"]

  - method: POST
    path: "/orders/{id}/allocate"
    description: "Run the DC selector, reserve the units and price the small-line handling fees"
    roles: [CustomerAccount]
    code: 200
    input: [expected_order_version]
    output: CatalogOrder
    side_effects: ["recompute dc_allocation_selector", "InventoriedStock.reserved_units += allocated_units", "recompute small_line_fee_total_and_allocate", "increments CatalogOrder.version by 1"]

  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel an order; releases reservations when the order had already been allocated"
    roles: [CustomerAccount]
    code: 200
    input: []
    output: CatalogOrder
    side_effects: ["order_status := CANCELLED", "InventoriedStock.reserved_units -= allocated_units", "increments CatalogOrder.version by 1"]

  - method: GET
    path: "/orders/{id}/lines"
    description: "List the lines of an order, or find every line of an order that a given DC allocated"
    roles: [PlatformAdmin, CustomerAccount, DCManager, WarehousePicker]
    code: 200
    input: ["allocated_dc_id?", "limit?", "offset?"]
    output: CatalogOrderLine[]
    side_effects: []





  - method: POST
    path: "/orders/{id}/lines/{line_id}/pick"
    description: "Start a pick against one allocated line (creates or reopens its PickTask)"
    roles: [WarehousePicker]
    code: 200
    input: [requested_units]
    output: PickTask
    side_effects: ["PickTask.pick_status := PICKING", "line_status := ALLOCATED on reopen"]

  - method: POST
    path: "/orders/{id}/lines/{line_id}/pick_complete"
    description: "Complete a pick, record the shortage and roll the order's fees and statuses forward"
    roles: [WarehousePicker]
    code: 200
    input: [actual_units]
    output: PickTask
    side_effects: ["InventoriedStock.on_hand_units -= picked_units", "line_status := PICKED or SHORT", "recompute small_line_fee_total_and_allocate", "recompute order_total_cents_factor_first when the shipment is already confirmed", "increments CatalogOrder.version by 1"]

  - method: POST
    path: "/orders/{id}/confirm_cutoff"
    description: "Certify the shipment cutoff for an order whose units are picked"
    roles: [DCManager]
    code: 200
    input: [expected_order_version, service_level, "promised_delivery_by?"]
    output: Shipment
    side_effects: ["Shipment.shipment_status := CUTOFF_CONFIRMED", "recompute freight_charge_two_variant", "recompute order_total_cents_factor_first", "increments CatalogOrder.version by 1"]

  # ---- PickTask / Shipment ----
  - method: GET
    path: "/pick-tasks"
    description: "List pick tasks, filterable by order"
    roles: [PlatformAdmin, DCManager, WarehousePicker]
    code: 200
    input: ["order_id?", "line_id?", "dc_id?", "pick_status?", "limit?", "offset?"]
    output: PickTask[]
    side_effects: []

  - method: GET
    path: "/pick-tasks/{id}"
    description: "Read one pick task with its shortage_units and shortage_disposition"
    roles: [PlatformAdmin, DCManager, WarehousePicker]
    code: 200
    input: []
    output: PickTask
    side_effects: []

  - method: GET
    path: "/shipments"
    description: "List shipments, filterable by order or by distribution center"
    roles: [PlatformAdmin, DCManager, CustomerAccount]
    code: 200
    input: ["order_id?", "dc_id?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []

  - method: GET
    path: "/shipments/{id}"
    description: "Read one shipment with its freight figures and committed delivery date"
    roles: [PlatformAdmin, DCManager, CustomerAccount]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: POST
    path: "/shipments/{id}/dispatch"
    description: "Dispatch a cutoff-confirmed shipment"
    roles: [DCManager]
    code: 200
    input: []
    output: Shipment
    side_effects: ["Shipment.shipment_status := DISPATCHED"]

  # ---- Returns ----
  - method: POST
    path: "/returns"
    description: "Create a return authorization against a shipped order with the units claimed per line"
    roles: [CustomerAccount, DCManager]
    code: 201
    input: [order_id, lines]
    output: ReturnAuthorization
    side_effects: []

  - method: GET
    path: "/returns"
    description: "List return authorizations, filterable by order"
    roles: [PlatformAdmin, DCManager, CustomerAccount]
    code: 200
    input: ["order_id?", "dc_id?", "return_status?", "limit?", "offset?"]
    output: ReturnAuthorization[]
    side_effects: []

  - method: GET
    path: "/returns/{id}"
    description: "Read one return authorization with its restock mix"
    roles: [PlatformAdmin, DCManager, CustomerAccount]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: []

  - method: POST
    path: "/returns/{id}/approve"
    description: "Approve the return and split it into restock and damage shares"
    roles: [DCManager]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: ["recompute restock_cap_allocation"]

  - method: POST
    path: "/returns/{id}/receive"
    description: "Receive the returned material, restore restockable units and run the seven-stage cascade"
    roles: [DCManager]
    code: 200
    input: [removed_manufacturer_part_numbers]
    output: ReturnAuthorization
    side_effects: ["stage A..G cascade per §1.2 ReturnAuthorization RECEIVED transition", "increments CatalogOrder.version by 1"]

  - method: POST
    path: "/returns/{id}/cancel"
    description: "Cancel a draft return authorization"
    roles: [DCManager]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: ["return_status := CANCELLED"]

  # ---- DamageClaim ----
  - method: GET
    path: "/damage-claims"
    description: "List damage claims, filterable by order or by line"
    roles: [PlatformAdmin, DCManager, WarehousePicker, CustomerAccount]
    code: 200
    input: ["order_id?", "line_id?", "claim_status?", "limit?", "offset?"]
    output: DamageClaim[]
    side_effects: []


  - method: GET
    path: "/damage-claims/{id}"
    description: "Read one damage claim with its disposition and damage_value_cents"
    roles: [PlatformAdmin, DCManager, WarehousePicker, CustomerAccount]
    code: 200
    input: []
    output: DamageClaim
    side_effects: []

  - method: POST
    path: "/damage-claims/{id}/resume_fulfillment"
    description: "Resume fulfillment of the order that owns this claim"
    roles: [WarehousePicker]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["claim_status := RESUMED", "CatalogOrder.fulfillment_status := ALLOCATED"]

  - method: POST
    path: "/damage-claims/{id}/resolve"
    description: "Resolve a resumed claim at zero charge"
    roles: [DCManager]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["claim_status := RESOLVED", "DamageClaim.disposition := ZERO_CHARGE_RESHIP", "CustomerAccount.open_claim_count -= 1"]

  - method: POST
    path: "/damage-claims/{id}/reject"
    description: "Reject an open claim and schedule a replacement from stock"
    roles: [DCManager]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["claim_status := REJECTED", "DamageClaim.disposition := REPLACE_FROM_STOCK", "CustomerAccount.open_claim_count -= 1"]

  - method: POST
    path: "/damage-claims/{id}/void"
    description: "Void a resumed claim"
    roles: [DCManager]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["claim_status := VOIDED", "CustomerAccount.open_claim_count -= 1"]

  # ---- Square-footage consignment (dual-variant pipe-length commitment) ----
  - method: POST
    path: "/square-footage-requests"
    description: "Quote a square-footage consignment of cut pipe lengths and return both commitment variants"
    roles: [CustomerAccount]
    code: 201
    input: [account_id, lines]
    output: SquareFootageRequest
    side_effects: ["recompute pipe_length_commitment_two_variant (both variants)"]

  - method: GET
    path: "/square-footage-requests"
    description: "List square-footage requests, filterable by account"
    roles: [PlatformAdmin, CustomerAccount, WarehousePicker]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: SquareFootageRequest[]
    side_effects: []

  - method: GET
    path: "/square-footage-requests/{id}"
    description: "Read one square-footage request with both committed-length variants"
    roles: [PlatformAdmin, CustomerAccount, WarehousePicker]
    code: 200
    input: []
    output: SquareFootageRequest
    side_effects: []

  - method: GET
    path: "/square-footage-requests/{id}/lines"
    description: "List the cut-list lines of one square-footage request, in cut-list ordinal order"
    roles: [PlatformAdmin, CustomerAccount, WarehousePicker]
    code: 200
    input: ["limit?", "offset?"]
    output: SquareFootageLine[]
    side_effects: []

  - method: GET
    path: "/square-footage-lines"
    description: "List square-footage cut lines, filterable by request"
    roles: [PlatformAdmin, CustomerAccount, WarehousePicker]
    code: 200
    input: ["request_id?", "line_status?", "limit?", "offset?"]
    output: SquareFootageLine[]
    side_effects: []

  - method: POST
    path: "/square-footage-requests/{id}/cut"
    description: "Record that a cut-list line has been cut, by cut-list ordinal; flips the request to the on_hand_only variant"
    roles: [WarehousePicker]
    code: 200
    input: [cut_list_ordinal]
    output: SquareFootageRequest
    side_effects: ["the line with that cut_list_ordinal: line_status := CUT", "SquareFootageRequest.request_status := CUTTING", "recompute pipe_length_commitment_two_variant"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not a declared role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "the calling role is not permitted to invoke this operation" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "the calling account is not the owner of the order or account being acted on" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "no order exists for the given order id" }
  - { id: ERR_ITEM_NOT_FOUND, http: 404, condition: "no catalog item exists for the given item id" }
  - { id: ERR_DC_NOT_FOUND, http: 404, condition: "no distribution center exists for the given DC id" }
  - { id: ERR_LINE_NOT_FOUND, http: 404, condition: "no order line exists for the given line id" }
  - { id: ERR_RETURN_NOT_FOUND, http: 404, condition: "no return authorization exists for the given return id" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "no damage claim exists for the given claim id" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "the target resource is not in a state that permits this operation" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_order_version does not equal the order's current version" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "the resource has already reached a terminal state and can no longer be mutated" }
  - { id: ERR_DC_LOCKDOWN, http: 409, condition: "the allocated distribution center is in posture LOCKDOWN" }
  - { id: ERR_ITEM_SUSPENDED, http: 409, condition: "the item has catalog_status SUSPENDED, so no further order-backed fulfillment is permitted against it" }
  - { id: ERR_NO_ELIGIBLE_DC, http: 409, condition: "no distribution center satisfies the dc_allocation_selector eligibility filter for the order" }
  - { id: ERR_DC_NOT_CANDIDATE, http: 409, condition: "the order's allocated DC is not a member of the candidate DC set produced by dc_allocation_selector" }
  - { id: ERR_INBOUND_CAPACITY_EXCEEDED, http: 409, condition: "allocation would push the DC's inbound_reserved_units past its inbound_capacity_units" }
  - { id: ERR_CURATION_NOT_APPROVED, http: 409, condition: "at least one line's item has curation_review_state UNREVIEWED" }
  - { id: ERR_CURATION_ATTRIBUTES_MISSING, http: 409, condition: "an item submitted for curation review has no attribute rows" }
  - { id: ERR_CUTOFF_WINDOW_PASSED, http: 422, condition: "the committed delivery deadline falls on or before a candidate DC's local cutoff, judged by local weekday first and local wall-clock time second" }
  - { id: ERR_PROMISE_DATE_IN_PAST, http: 422, condition: "promised_delivery_by is earlier than the DC's local current time" }
  - { id: ERR_RETURN_PART_NUMBER_REQUIRED, http: 422, condition: "a claimed return unit has no removed_manufacturer_part_number recorded" }
  - { id: ERR_SUPPLIER_CANDIDATE_EMPTY, http: 409, condition: "no supplier survives the supplier_selector eligibility filter" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "a required body field is missing or a field value fails its type or range constraint" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator that manages distribution centers, suppliers and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /distribution-centers"
      - "POST /suppliers"
      - "POST /suppliers/{id}/availability_reports"
    shared_operations:
      - "GET /distribution-centers, GET /distribution-centers/{id}, GET /distribution-centers/{id}/stock, GET /distribution-centers/{id}/shipments"
      - "GET /suppliers, GET /suppliers/{id}"
      - "GET /items, GET /items/{id}, GET /items/{id}/attributes, GET /items/{id}/cross-references"
      - "GET /stock, GET /stock/{id}, GET /accounts, GET /accounts/{id}"
      - "GET /orders, GET /orders/{id}, GET /orders/{id}/lines, GET /orders/{id}/shipments, GET /shipments, GET /shipments/{id}"
      - "GET /pick-tasks, GET /pick-tasks/{id}, GET /returns, GET /returns/{id}, GET /damage-claims, GET /damage-claims/{id}"

  - name: CatalogCurator
    description: "Owns product data curation, standardized attributes, cross-references and supplier records"
    identity: opaque
    exclusive_operations:
      - "POST /items"
      - "POST /items/{id}/attributes"
      - "POST /items/{id}/cross-references"
      - "POST /curation-reviews"
      - "POST /curation-reviews/{id}/revoke"
    shared_operations:
      - "GET /items, GET /items/{id}, GET /items/{id}/attributes, GET /items/{id}/cross-references"
      - "GET /suppliers, GET /suppliers/{id}"
      - "GET /distribution-centers, GET /distribution-centers/{id}"

  - name: CustomerAccount
    description: "Purchasing account that searches the catalog, places orders and files returns"
    identity: "entity_backed:CustomerAccount"
    exclusive_operations:
      - "POST /orders"
      - "POST /orders/{id}/release"
      - "POST /orders/{id}/allocate"
      - "POST /orders/{id}/cancel"
      - "POST /square-footage-requests"
    shared_operations:
      - "POST /returns"
      - "GET /orders, GET /orders/{id}, GET /orders/{id}/lines, GET /orders/{id}/shipments, GET /shipments, GET /shipments/{id}"
      - "GET /returns, GET /returns/{id}, GET /damage-claims, GET /damage-claims/{id}"
      - "GET /distribution-centers, GET /distribution-centers/{id}, GET /stock, GET /stock/{id}"

  - name: WarehousePicker
    description: "Picks small-line orders and reopens picks after damage write-offs"
    identity: opaque
    exclusive_operations:
      - "POST /orders/{id}/lines/{line_id}/pick"
      - "POST /orders/{id}/lines/{line_id}/pick_complete"
      - "POST /damage-claims/{id}/resume_fulfillment"
      - "POST /square-footage-requests/{id}/cut"
    shared_operations:
      - "GET /orders, GET /orders/{id}, GET /orders/{id}/lines"
      - "GET /pick-tasks, GET /pick-tasks/{id}"
      - "GET /items, GET /items/{id}, GET /stock, GET /stock/{id}"

  - name: DCManager
    description: "Owns a distribution center's cutoff, posture, shipments, returns receiving and damage disposition"
    identity: opaque
    exclusive_operations:
      - "POST /distribution-centers/{id}/roll_cutoff"
      - "POST /distribution-centers/{id}/reeducate"
      - "POST /orders/{id}/confirm_cutoff"
      - "POST /shipments/{id}/dispatch"
      - "POST /returns/{id}/approve"
      - "POST /returns/{id}/receive"
      - "POST /returns/{id}/cancel"
      - "POST /damage-claims/{id}/resolve"
      - "POST /damage-claims/{id}/reject"
      - "POST /damage-claims/{id}/void"
    shared_operations:
      - "POST /returns"
      - "GET /orders, GET /orders/{id}, GET /orders/{id}/lines, GET /orders/{id}/shipments, GET /shipments, GET /shipments/{id}"
      - "GET /returns, GET /returns/{id}, GET /damage-claims, GET /damage-claims/{id}"
      - "GET /pick-tasks, GET /pick-tasks/{id}"
      - "GET /suppliers, GET /suppliers/{id}, GET /stock, GET /stock/{id}, GET /distribution-centers/{id}/stock"