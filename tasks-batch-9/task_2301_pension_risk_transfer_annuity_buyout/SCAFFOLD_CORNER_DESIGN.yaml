      - name: regulator_cannot_write_outside_the_registry_and_filing_review
        claim_type: shared_operations
        grounds:
          - roles.Regulator
          - roles.PlanSponsor
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: |
          The Regulator's supervisory access is total on reads and empty on writes
          outside the carrier registry and filing review: the same session that reads
          the plan, its participants and its funded status cannot load a participant,
          cannot adopt an amendment and cannot open a window, yet can register a carrier
          and record a rating action.
        test_recipe:
          setup:
            - "one plan with one participant"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Regulator
              as_user_id: "regulator-01"
