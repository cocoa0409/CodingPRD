- section: errors
  instances:
  - name: unknown_fee_schedule_requisition_candidate_and_trial_ids_return_their_own_not_found_ids
    claim_type: error_triggerable
    grounds: errors[ERR_FEE_SCHEDULE_NOT_FOUND]; errors[ERR_REQUISITION_NOT_FOUND]; errors[ERR_CANDIDATE_NOT_FOUND];
      errors[ERR_TRIAL_NOT_FOUND]; validations.path_entity_exists (priority 30)
    distinguishing_aspect: Four reads with the same unknown uuid must return four different error ids,
      so a single shared NOT_FOUND constant cannot pass; the catalogue is keyed on the addressed entity,
      not on the shape of the id.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      trigger:
      - call: GET /fee-schedules/00000000-0000-0000-0000-000000000000
        as: AgencyPrincipal
      - call: GET /role-requisitions/00000000-0000-0000-0000-000000000000
        as: PlacementConsultant
      - call: GET /candidates/00000000-0000-0000-0000-000000000000
        as: VettingSpecialist
        as_user: u_vet_1
      - call: GET /trial-engagements/00000000-0000-0000-0000-000000000000
        as: PlacementConsultant
      asserts:
      - the first trigger call returns 404 with error_id == ERR_FEE_SCHEDULE_NOT_FOUND
      - the second returns 404 with error_id == ERR_REQUISITION_NOT_FOUND
      - the third returns 404 with error_id == ERR_CANDIDATE_NOT_FOUND
      - the fourth returns 404 with error_id == ERR_TRIAL_NOT_FOUND
      - every one of the four carries response_type == error and a null data payload
  - name: unknown_reference_background_term_and_milestone_ids_return_their_own_not_found_ids
    claim_type: error_triggerable
    grounds: errors[ERR_REFERENCE_CHECK_NOT_FOUND]; errors[ERR_BACKGROUND_VERIFICATION_NOT_FOUND]; errors[ERR_ACCOMMODATION_TERM_NOT_FOUND];
      errors[ERR_FEE_MILESTONE_NOT_FOUND]; validations.path_entity_exists (priority 30)
    distinguishing_aspect: These four ids are only reachable through their own top-level read paths, so
      each one needs its own probe; the four answers must differ from each other and from the parent-entity
      ids.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      trigger:
