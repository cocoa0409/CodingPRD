            - call: "GET /svh/veterans-homes/${home_id}"
              payload: {}
              as: StateProgramAdmin
              captures: { home_status1: "$.data.recognition_status", dec_count1: "$.data.decertified_unit_count" }
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/care-units/${nu_id}/survey-result"
              payload: { survey_date: "2026-08-02", deficiencies: [] }
              as: SurveyAgency
              captures: { cert2: "$.data.certification_status", post2: "$.data.operational_posture", score2: "$.data.last_survey_compliance_score" }
            - call: "GET /svh/veterans-homes/${home_id}"
              payload: {}
