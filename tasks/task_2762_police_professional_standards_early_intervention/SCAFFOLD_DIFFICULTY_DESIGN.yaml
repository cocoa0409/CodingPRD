      - name: plan_creation_depends_on_the_alert_status_the_sweep_promotes
        grounds:
          - validations[priority=8]
          - validations[priority=7]
          - state_machines.EarlyInterventionAlert.OPEN_to_PLAN_REQUIRED
          - calculations.eis_composite_score
          - endpoints["POST /eis-runs"]
          - endpoints["POST /eis-alerts/{id}/intervention-plans"]
        distinguishing_aspect: |
          An intervention plan may not be created against an alert that is still OPEN, even after
          the officer's stored score has climbed into the ALERT band, because the alert row itself
          carries the stale WATCH snapshot until POST /eis-runs refreshes and promotes it; the
          identical payload with the refreshed version then succeeds.
        test_recipe:
          setup:
            - "Officer Vance is a PATROL officer, so the assignment multiplier is 1.0 and the score is 2.5 times the weighted total plus 10 per breached indicator."
            - "Three events take the score to 31.25, which creates one alert in the WATCH band and therefore in status OPEN."
            - "Two further events lift the officer to 63.75 in the ALERT band, but no new alert is created because one is already open, and the existing row keeps its 31.25 snapshot."
            - "The logical clock stands at 2026-08-01T00:00:00Z for the whole recipe."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Internal Affairs", unit_role: "INTERNAL_AFFAIRS", command_code: "IA", peer_group_code: "PG_IA", sworn_headcount: 12, intake_enabled: true }
              as: SystemAdmin
              captures: { ia_unit_id: $.data.id }
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-001", full_name: "Commander Reyes", rank: "CAPTAIN", assignment_type: "ADMIN", annual_salary_cents: 14000000, demographic_code: "DG_A", hire_date: "2008-03-01T00:00:00Z", is_investigator: false, certification_level: 3, max_case_load: 0 }
              as: SystemAdmin
              captures: { cmdr_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-010", full_name: "Sergeant Doyle", rank: "SERGEANT", assignment_type: "PATROL", annual_salary_cents: 10500000, demographic_code: "DG_A", hire_date: "2012-02-02T00:00:00Z" }
              as: SystemAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-501", full_name: "Officer Vance", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9100013, demographic_code: "DG_C", hire_date: "2019-09-16T00:00:00Z" }
              as: SystemAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /officers/${subj_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_3", occurred_at: "2026-07-01T12:00:00Z", source_reference: "UOF-1" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /officers/${subj_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_2", occurred_at: "2026-07-10T12:00:00Z", source_reference: "UOF-2" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /officers/${subj_id}/activity-events"
              payload: { event_type: "PURSUIT", severity_code: "NA", occurred_at: "2026-07-15T12:00:00Z", source_reference: "PUR-1" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "GET /eis-alerts"
              payload: { officer_id: "${subj_id}" }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { alert_id: "$.data[0].id", alert_v0: "$.data[0].version", alert_status0: "$.data[0].status", alert_score0: "$.data[0].composite_score", alert_level0: "$.data[0].alert_level" }
            - call: "POST /officers/${subj_id}/activity-events"
              payload: { event_type: "PURSUIT", severity_code: "NA", occurred_at: "2026-07-20T12:00:00Z", source_reference: "PUR-2" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /officers/${subj_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_1", occurred_at: "2026-07-25T12:00:00Z", source_reference: "UOF-3" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "GET /officers/${subj_id}"
              payload: {}
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { officer_score: $.data.eis_score, officer_level: $.data.eis_alert_level, officer_alerts: $.data.open_alert_count }
          trigger:
            - call: "POST /eis-alerts/${alert_id}/intervention-plans"
              payload: { expected_alert_version: "${alert_v0}", supervisor_officer_id: "${sup_id}", required_checkin_count: 2, duration_days: 30, interventions: ["RETRAINING", "COUNSELING"] }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { open_alert_error: $.data.error_id }
            - call: "POST /eis-runs"
              payload: { officer_id: "${subj_id}" }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { run_seq: $.data.run_sequence, run_evaluated: $.data.evaluated_officer_count, run_created: $.data.alerts_created, run_promoted: $.data.alerts_promoted, run_missed: $.data.checkins_missed, run_expired: $.data.disclosures_expired }
            - call: "GET /eis-alerts/${alert_id}"
              payload: {}
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { alert_v1: $.data.version, alert_status1: $.data.status, alert_score1: $.data.composite_score, alert_level1: $.data.alert_level, alert_run: $.data.run_sequence, alert_review: $.data.review_due_at }
            - call: "POST /eis-alerts/${alert_id}/intervention-plans"
              payload: { expected_alert_version: "${alert_v1}", supervisor_officer_id: "${sup_id}", required_checkin_count: 2, duration_days: 30, interventions: ["RETRAINING", "COUNSELING"] }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { plan_id: $.data.id, plan_status: $.data.status }
            - call: "POST /intervention-plans/${plan_id}/activate"
              payload: { activation_note: "Monitoring begins." }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { plan_status2: $.data.status, plan_activated: $.data.activated_at, plan_end: $.data.end_date }
            - call: "GET /eis-alerts/${alert_id}"
              payload: {}
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { alert_status2: $.data.status, alert_plans: $.data.plan_count }
          assert:
            - "${alert_status0} == OPEN, ${alert_score0} == 31.25 and ${alert_level0} == WATCH, so the creation-time promotion did not fire"
            - "${officer_score} == 63.75, ${officer_level} == ALERT and ${officer_alerts} == 1, so the officer is in the ALERT band while the alert row is stale"
            - "the first trigger call responds 409 and ${open_alert_error} == ERR_ALERT_STATE_INVALID, having passed the priority-7 version check with the correct ${alert_v0}"
            - "${run_seq} == 1, ${run_evaluated} == 1, ${run_created} == 0, ${run_promoted} == 1, ${run_missed} == 0 and ${run_expired} == 0"
            - "${alert_status1} == PLAN_REQUIRED, ${alert_score1} == 63.75, ${alert_level1} == ALERT, ${alert_run} == 1 and ${alert_review} == 2026-08-31T00:00:00Z"
            - "the refreshed alert breached_indicators equals [FORCE_COUNT, PURSUIT_COUNT] in that exact order"
            - "${alert_v1} is strictly greater than ${alert_v0}, so the same payload had to be re-versioned"
            - "the fourth trigger call responds 201 with ${plan_status} == DRAFT"
            - "${plan_status2} == ACTIVE, ${plan_activated} == 2026-08-01T00:00:00Z and ${plan_end} == 2026-08-31T00:00:00Z"
            - "${alert_status2} == PLAN_ACTIVE and ${alert_plans} == 1"
            - "GET /intervention-plans/${plan_id}/check-ins returns 2 PENDING rows with due_at 2026-08-11T00:00:00Z and 2026-08-21T00:00:00Z, since floor(30 / (2 + 1)) is 10"

      - name: investigation_close_depends_on_every_sibling_allegation_being_disposed
        grounds:
          - validations[priority=10]
          - state_machines.Investigation.PENDING_REVIEW_to_CLOSED
          - state_machines.Complaint.ADJUDICATION_to_CLOSED
          - calculations.retention_expiry_evaluation
          - endpoints["POST /investigations/{id}/close"]
        distinguishing_aspect: |
          Closing an investigation is refused with ERR_PENDING_DISPOSITIONS while any sibling
          allegation on the same complaint is still PENDING, even though the investigation itself
          is in the correct PENDING_REVIEW state; once the sibling is disposed the same call
          succeeds and the complaint's retention_until is driven by the strongest disposition
          across both allegations, not by the last one entered.
        test_recipe:
          setup:
            - "One CLASS_II complaint carries two allegations against Officer Vance: an offense_class C NEGLECT_OF_DUTY and an offense_class D DISCOURTESY."
            - "Investigator Ahn is assigned, one interview has been held and findings have been submitted for both allegations, so the investigation sits in PENDING_REVIEW."
            - "The NEGLECT_OF_DUTY findings are 60 against 40 and the DISCOURTESY findings are 40 against 60."
            - "The logical clock stands at 2026-08-05T09:00:00Z until the close, which happens at 2026-08-20T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Internal Affairs", unit_role: "INTERNAL_AFFAIRS", command_code: "IA", peer_group_code: "PG_IA", sworn_headcount: 12, intake_enabled: true }
              as: SystemAdmin
              captures: { ia_unit_id: $.data.id }
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-001", full_name: "Commander Reyes", rank: "CAPTAIN", assignment_type: "ADMIN", annual_salary_cents: 14000000, demographic_code: "DG_A", hire_date: "2008-03-01T00:00:00Z", is_investigator: false, certification_level: 3, max_case_load: 0 }
              as: SystemAdmin
              captures: { cmdr_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-101", full_name: "Investigator Ahn", rank: "SERGEANT", assignment_type: "INVESTIGATIVE", annual_salary_cents: 11000000, demographic_code: "DG_B", hire_date: "2014-05-12T00:00:00Z", is_investigator: true, certification_level: 3, max_case_load: 3 }
              as: SystemAdmin
              captures: { inv_a_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-010", full_name: "Sergeant Doyle", rank: "SERGEANT", assignment_type: "PATROL", annual_salary_cents: 10500000, demographic_code: "DG_A", hire_date: "2012-02-02T00:00:00Z" }
              as: SystemAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-501", full_name: "Officer Vance", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9100013, demographic_code: "DG_C", hire_date: "2019-09-16T00:00:00Z" }
              as: SystemAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /hearing-rooms"
              payload: { facility_code: "HQ", room_name: "Interview 1", concurrent_capacity: 1, recording_enabled: true }
              as: SystemAdmin
              captures: { room1_id: $.data.id }
            - call: "POST /complaints"
              payload: { intake_channel: "SUPERVISOR", narrative: "Missing reports and a rude exchange.", incident_datetime: "2026-07-15T20:00:00Z", alleged_injury: false, reported_allegation_types: ["NEGLECT_OF_DUTY", "DISCOURTESY"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Sergeant Doyle", complainant_contact: "doyle@dept.gov", complainant_demographic_code: "DG_A", reporting_supervisor_officer_id: "${sup_id}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { c1_id: $.data.id, c1_class: $.data.classification }
            - call: "POST /complaints/${c1_id}/allegations"
              payload: { subject_officer_id: "${subj_id}", allegation_type: "NEGLECT_OF_DUTY", narrative: "Shift reports missing.", offense_class: "C" }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /complaints/${c1_id}/allegations"
              payload: { subject_officer_id: "${subj_id}", allegation_type: "DISCOURTESY", narrative: "Rude exchange with the complainant.", offense_class: "D" }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { a2_id: $.data.id }
            - call: "POST /complaints/${c1_id}/investigations"
              payload: { opening_note: "Two allegations." }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { i1_id: $.data.id, i1_v: $.data.version }
            - call: "POST /investigations/${i1_id}/assignments"
              payload: { expected_investigation_version: "${i1_v}", investigator_officer_id: "${inv_a_id}" }
              as: IACommander
              as_user_id: "${cmdr_id}"
            - call: "POST /investigations/${i1_id}/interview-sessions"
              payload: { subject_officer_id: "${subj_id}", hearing_room_id: "${room1_id}", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:30:00Z", notice_served_at: "2026-08-01T00:00:00Z", representation_status: "REP_PRESENT" }
              as: Investigator
              as_user_id: "${inv_a_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /interview-sessions/${s1_id}/hold"
              payload: { interview_summary: "Both allegations covered." }
              as: Investigator
              as_user_id: "${inv_a_id}"
            - call: "POST /investigations/${i1_id}/findings"
              payload: { allegation_findings: [{ allegation_id: "${a1_id}", evidence_weight_for: 60, evidence_weight_against: 40, policy_compliant: false }, { allegation_id: "${a2_id}", evidence_weight_for: 40, evidence_weight_against: 60, policy_compliant: true }], summary: "Split outcome." }
              as: Investigator
              as_user_id: "${inv_a_id}"
              captures: { i1_status: $.data.status }
            - call: "POST /allegations/${a1_id}/disposition"
              payload: { disposition: "SUSTAINED", aggravator_count: 0, mitigator_count: 0, rationale: "Neglect established." }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { a1_disp: $.data.disposition }
          trigger:
            - call: "POST /investigations/${i1_id}/close"
              payload: { closing_note: "Premature close." }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { close_error: $.data.error_id }
            - call: "POST /allegations/${a2_id}/disposition"
              payload: { disposition: "NOT_SUSTAINED", rationale: "Insufficient evidence of discourtesy." }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { a2_disp: $.data.disposition }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /investigations/${i1_id}/close"
              payload: { closing_note: "All allegations disposed." }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { i1_status2: $.data.status, i1_closed: $.data.closed_at }
            - call: "GET /complaints/${c1_id}"
              payload: {}
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { c1_status: $.data.status, c1_closed: $.data.closed_at, c1_retention: $.data.retention_until, c1_sustained: $.data.sustained_allegation_count }
            - call: "GET /officers/${inv_a_id}"
              payload: {}
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { inv_load_after: $.data.open_case_load }
          assert:
            - "${c1_class} == CLASS_II, so statutory_days is 121 and required_certification_level is 2"
            - "${i1_status} == PENDING_REVIEW and ${a1_disp} == SUSTAINED"
            - "the first trigger call responds 409 and ${close_error} == ERR_PENDING_DISPOSITIONS, although Investigation.${i1_id}.status is the valid PENDING_REVIEW from-state"
            - "Investigation.${i1_id}.status is still PENDING_REVIEW after the refusal, Complaint.${c1_id}.status is still ADJUDICATION and Officer.${inv_a_id}.open_case_load is still 1"
            - "${a2_disp} == NOT_SUSTAINED, entered without any evidence-weight change because preponderance is only tested for SUSTAINED"
            - "${i1_status2} == CLOSED and ${i1_closed} == 2026-08-20T00:00:00Z"
            - "${c1_status} == CLOSED, ${c1_closed} == 2026-08-20T00:00:00Z, ${c1_sustained} == 1"
