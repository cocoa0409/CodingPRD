              captures: { d1: $.data.id }
            - call: "POST /api/donors"
              payload: { full_name: "D 40" }
              as: IntakeAttendant
              captures: { d2: $.data.id }
            - call: "POST /api/donors"
              payload: { full_name: "D 1" }
              as: IntakeAttendant
              captures: { d3: $.data.id }
            - call: "POST /api/pickup-routes"
              payload: { route_date: "2026-08-10", driver_worker_id: "${w1}", truck_capacity_cuft: 100 }
