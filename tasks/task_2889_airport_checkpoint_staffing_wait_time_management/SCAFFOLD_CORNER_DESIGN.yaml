              payload: { suspended: false }
              as: CheckpointManager
              captures: { s_unsusp: $.data.suspended, s_posture_after: $.data.posture }
            - call: "POST /lanes/${lane_id}/open"
              payload: {}
              as: CheckpointManager
              captures: { s_reopen_state: $.data.lane_state }
          assert:
            - "${s_posture} == SUSPENDED and the lane went OPEN -> PAUSED with paused_reason_code SECURITY_INCIDENT"
            - "${s_open_error} == ERR_CHECKPOINT_SUSPENDED (409) — priority 10 outranks the priority 11 transition check, which would have ALLOWED PAUSED -> OPEN"
            - "${s_obs_error}, ${s_ref_error} and ${s_submit_error} are all ERR_CHECKPOINT_SUSPENDED (409)"
            - "${s_read_n} == 0 and the read returned 200 — reads are never gated by posture"
            - "${s_unsusp} == false with ${s_posture_after} == NORMAL (no open escalation, no OUT_OF_SERVICE lane)"
            - "${s_reopen_state} == OPEN — the same open call now succeeds, so the earlier rejection was the posture gate and nothing else"

      - name: escalation_resolution_lane_must_match_scope_and_be_open
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 20]
          - errors[ERR_RESOLUTION_LANE_INVALID]
        distinguishing_aspect: "Three separate ways for a resolution lane to be wrong (other checkpoint, wrong lane_type for the ticket's scope, not currently OPEN) collapse into one error code, and all three require reading the TICKET's scope rather than the lane alone."
        test_recipe:
          setup:
            - "an ACKNOWLEDGED STANDARD-scope ticket, plus an expedited lane and a foreign lane"
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_lane
            - *c_eq_wtmd
            - *c_eq_xray
            - *c_eq_ai
            - *c_open
            - *c_off_sup
            - &c_lane_exp
              call: "POST /lanes"
              payload: { checkpoint_id: "${cp_id}", lane_type: "EXPEDITED", position_index: 4, required_officer_count: 1, max_concurrent_officers: 1, secondary_positions: 0 }
              as: CheckpointManager
              captures: { exp_lane_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { lane_id: "${exp_lane_id}", equipment_type: "WTMD", serial_number: "WT-E4", calibration_due_utc: "2027-01-01T00:00:00Z" }
              as: CheckpointManager
            - call: "POST /equipment-units"
              payload: { lane_id: "${exp_lane_id}", equipment_type: "AT_XRAY", serial_number: "XR-E4", calibration_due_utc: "2027-01-01T00:00:00Z" }
              as: CheckpointManager
            - call: "POST /lanes/${exp_lane_id}/open"
              payload: {}
              as: CheckpointManager
              captures: { exp_lane_state: $.data.lane_state }
            - *c_cp2
            - *c_lane_other
            - *c_obs_breach_1
            - *c_obs_breach_2
            - call: "GET /escalation-tickets"
              payload: { checkpoint_id: "${cp_id}", state: "RAISED" }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { rl_tk: "$.data[0].id", rl_scope: "$.data[0].lane_type_scope" }
            - call: "POST /escalation-tickets/${rl_tk}/acknowledge"
              payload: {}
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
          trigger:
            - call: "POST /escalation-tickets/${rl_tk}/resolve"
              payload: { resolution: "LANE_OPENED", resolved_lane_id: "${other_lane_id}" }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              expect_status: 422
              captures: { rl_foreign_error: $.data.error_id }
            - call: "POST /escalation-tickets/${rl_tk}/resolve"
              payload: { resolution: "LANE_OPENED", resolved_lane_id: "${exp_lane_id}" }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              expect_status: 422
              captures: { rl_scope_error: $.data.error_id }
            - call: "POST /lanes/${lane_id}/stand-down"
              payload: { target_state: "PAUSED", paused_reason_code: "LOW_DEMAND" }
              as: CheckpointManager
              captures: { rl_lane_paused: $.data.lane_state }
            - call: "POST /escalation-tickets/${rl_tk}/resolve"
              payload: { resolution: "LANE_OPENED", resolved_lane_id: "${lane_id}" }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              expect_status: 422
              captures: { rl_closed_error: $.data.error_id }
            - call: "POST /lanes/${lane_id}/open"
              payload: {}
              as: CheckpointManager
              captures: { rl_lane_reopened: $.data.lane_state }
            - call: "POST /escalation-tickets/${rl_tk}/resolve"
              payload: { resolution: "LANE_OPENED", resolved_lane_id: "${lane_id}" }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { rl_final_state: $.data.state, rl_final_lane: $.data.resolved_lane_id }
          assert:
            - "${rl_scope} == STANDARD and ${exp_lane_state} == OPEN (an EXPEDITED lane needs only WTMD + AT_XRAY)"
            - "${rl_foreign_error} == ERR_RESOLUTION_LANE_INVALID (422) — the lane exists, so this is not a 404; it simply belongs to T2"
            - "${rl_scope_error} == ERR_RESOLUTION_LANE_INVALID (422) — an OPEN lane of the wrong lane_type does not resolve a STANDARD-scope ticket"
            - "${rl_lane_paused} == PAUSED and ${rl_closed_error} == ERR_RESOLUTION_LANE_INVALID (422) — the lane must be OPEN at resolve time"
            - "${rl_lane_reopened} == OPEN and ${rl_final_state} == RESOLVED_LANE_OPENED with ${rl_final_lane} == ${lane_id}"
            - "Checkpoint.diverted_pax_total is still 0 — the LANE_OPENED branch never touches it"

      - name: surge_detail_window_must_end_inside_the_plans_operational_day
        claim_type: temporal_validation
        grounds:
          - validations[priority 24]
          - errors[ERR_DETAIL_WINDOW_OUTSIDE_PLAN]
        distinguishing_aspect: "The interval is derived, not supplied: window_start_utc plus detail_minutes. A start that is comfortably inside the day still fails when the duration pushes the end past midnight, and the boundary is half-open so a window ending exactly at 00:00 is accepted."
        test_recipe:
          setup: ["a SUBMITTED plan for operational_date 2026-09-10"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_lane
            - *c_eq_wtmd
            - *c_eq_xray
            - *c_eq_ai
            - *c_officer
            - *c_curve
            - *c_band1000
            - *c_flight1030
            - *c_forecast1
            - *c_cpver
            - *c_plan
            - *c_asg1
            - *c_submit
          trigger:
            - call: "GET /officers/${off_id}"
              payload: {}
              as: StaffingPlanner
              captures: { sd_v1: $.data.version }
            - call: "POST /surge-details"
              payload: { staffing_plan_id: "${plan_id}", officer_id: "${off_id}", event_code: "IRREGULAR_OPS", window_start_utc: "2026-09-10T23:30:00Z", detail_minutes: 31, expected_officer_version: "${sd_v1}" }
              as: StaffingPlanner
              as_user_id: planner-1
              expect_status: 422
              captures: { sd_outside_error: $.data.error_id }
            - call: "POST /surge-details"
              payload: { staffing_plan_id: "${plan_id}", officer_id: "${off_id}", event_code: "IRREGULAR_OPS", window_start_utc: "2026-09-09T23:30:00Z", detail_minutes: 10, expected_officer_version: "${sd_v1}" }
              as: StaffingPlanner
              as_user_id: planner-1
              expect_status: 422
              captures: { sd_prevday_error: $.data.error_id }
            - call: "POST /surge-details"
              payload: { staffing_plan_id: "${plan_id}", officer_id: "${off_id}", event_code: "IRREGULAR_OPS", window_start_utc: "2026-09-10T23:30:00Z", detail_minutes: 30, expected_officer_version: "${sd_v1}" }
              as: StaffingPlanner
              as_user_id: planner-1
              captures: { sd_ok_id: $.data.id, sd_ok_state: $.data.state, sd_ok_cost: $.data.detail_cost_cents }
          assert:
            - "${sd_outside_error} == ERR_DETAIL_WINDOW_OUTSIDE_PLAN (422) — [23:30, 00:01 next day) leaves the operational day"
            - "${sd_prevday_error} == ERR_DETAIL_WINDOW_OUTSIDE_PLAN (422) — a window wholly on 2026-09-09 is outside too, so the rule is a containment test and not a 'before midnight' test"
            - "${sd_ok_state} == REQUESTED with ${sd_ok_cost} == null — [23:30, 00:00) is inside the day and detail_cost_cents is only computed on approval"
            - "the two rejected creates did NOT bump Officer.version, so the same ${sd_v1} was still valid for the accepted create"

      - name: two_violations_at_different_priorities_report_the_lower_number
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / check_in_plan_not_activated_outranks_calibration_overdue"
          rationale: "That §1.8 instance (with its sibling assignment_certification_outranks_officer_double_booked) already violates two rules at once on two different endpoints and asserts that the lower priority number wins across two different error-category pairs — state vs business_safety and business_safety vs business_temporal — which is the whole priority-ordering claim for this scaffold."

  # ===========================================================================
  - section: endpoints
    instances:

      - name: checkpoint_patch_updates_only_supplied_fields_and_always_bumps_version
        claim_type: standard_crud
        grounds:
          - endpoints.PATCH_checkpoints
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Every input on this endpoint is optional, so the handler must distinguish 'absent' from 'null' and leave untouched fields alone. The version bump is declared unconditionally, so even a body that changes nothing increments it — while a rejected body must not."
        test_recipe:
          setup: ["one checkpoint with thresholds 15 / 8, discount 0, secondary_slot_capacity 2 and cap 10000000"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_cpver
          trigger:
            - call: "PATCH /checkpoints/${cp_id}"
              payload: { wait_threshold_minutes_standard: 12 }
              as: CheckpointManager
              captures: { p1_std: $.data.wait_threshold_minutes_standard, p1_exp: $.data.wait_threshold_minutes_expedited, p1_disc: $.data.connecting_pax_discount_pct, p1_sec: $.data.secondary_slot_capacity, p1_cap: $.data.plan_cost_cap_cents, p1_v: $.data.version }
            - call: "PATCH /checkpoints/${cp_id}"
              payload: {}
              as: CheckpointManager
              captures: { p2_std: $.data.wait_threshold_minutes_standard, p2_v: $.data.version }
            - call: "PATCH /checkpoints/${cp_id}"
              payload: { connecting_pax_discount_pct: 150 }
              as: CheckpointManager
              expect_status: 400
              captures: { p3_error: $.data.error_id }
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: CheckpointManager
              captures: { p4_disc: $.data.connecting_pax_discount_pct, p4_v: $.data.version }
          assert:
            - "${cp_v1} == 1 on creation"
            - "${p1_std} == 12 while ${p1_exp} == 8, ${p1_disc} == 0, ${p1_sec} == 2 and ${p1_cap} == 10000000 — one supplied field, one changed field"
            - "${p1_v} == 2"
            - "${p2_std} == 12 and ${p2_v} == 3 — an empty PATCH still increments version because the side effect is unconditional"
            - "${p3_error} == ERR_INVALID_REQUEST (400) — connecting_pax_discount_pct is constrained to 0..100"
            - "${p4_disc} == 0 and ${p4_v} == 3 — the rejected write left neither the field nor the version touched"

      - name: officer_separation_is_refused_until_every_commitment_is_cleared
        claim_type: conditional_action
        grounds:
          - state_machines.Officer[OFF_DUTY -> SEPARATED]
          - endpoints.POST_officers_duty-status
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "Separation does NOT cascade a cancellation; it is refused while any live assignment or detail remains, and each blocker must be cleared through its own endpoint. Two different blockers of two different entity types must each be sufficient on their own."
        test_recipe:
          setup: ["an OFF_DUTY officer holding one SCHEDULED assignment on a SUBMITTED plan and one REQUESTED surge detail"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_lane
            - *c_eq_wtmd
            - *c_eq_xray
            - *c_eq_ai
            - *c_officer
            - *c_curve
            - *c_band1000
            - *c_flight1030
            - *c_forecast1
            - *c_cpver
            - *c_plan
            - *c_asg1
            - *c_submit
            - call: "GET /officers/${off_id}"
              payload: {}
              as: StaffingPlanner
              captures: { sep_v1: $.data.version, sep_duty: $.data.duty_status }
            - call: "POST /surge-details"
              payload: { staffing_plan_id: "${plan_id}", officer_id: "${off_id}", event_code: "CONVENTION", window_start_utc: "2026-09-10T12:00:00Z", detail_minutes: 30, expected_officer_version: "${sep_v1}" }
              as: StaffingPlanner
              as_user_id: planner-1
              captures: { sep_sd_id: $.data.id }
          trigger:
            - call: "POST /officers/${off_id}/duty-status"
              payload: { duty_status: "SEPARATED" }
              as: CheckpointManager
              expect_status: 409
              captures: { sep_err1: $.data.error_id }
            - call: "POST /surge-details/${sep_sd_id}/decision"
              payload: { decision: "DENY", denial_reason_code: "COVERAGE" }
              as: DutyManager
              as_user_id: duty-1
              captures: { sep_sd_state: $.data.state }
            - call: "POST /officers/${off_id}/duty-status"
              payload: { duty_status: "SEPARATED" }
              as: CheckpointManager
              expect_status: 409
              captures: { sep_err2: $.data.error_id }
            - call: "POST /lane-assignments/${asg1_id}/duty"
              payload: { action: "CANCEL" }
              as: DutyManager
              as_user_id: duty-1
              captures: { sep_asg_state: $.data.assignment_state }
            - call: "GET /staffing-plans/${plan_id}/cost-summary"
              payload: {}
              as: StaffingPlanner
              captures: { sep_sub: $.data.subtotal_cents, sep_total: $.data.total_cost_cents }
            - call: "POST /officers/${off_id}/duty-status"
              payload: { duty_status: "SEPARATED" }
              as: CheckpointManager
              captures: { sep_final: $.data.duty_status, sep_committed: $.data.committed_duty_minutes }
          assert:
            - "${sep_duty} == OFF_DUTY — the from-state precondition is satisfied throughout, so every rejection below comes from the commitment preconditions"
            - "${sep_err1} == ERR_INVALID_STATE_TRANSITION (409) with both blockers live"
            - "${sep_sd_state} == DENIED and detail_cost_cents is still null"
            - "${sep_err2} == ERR_INVALID_STATE_TRANSITION (409) — the SCHEDULED assignment alone still blocks separation"
            - "${sep_asg_state} == CANCELLED and CANCEL debited committed_duty_minutes by planned_minutes 30"
            - "${sep_sub} == 0 and ${sep_total} == 0 — CANCEL recomputes the plan cost, and a zero subtotal takes admin_fee_rate \"0.060\" on 0 cents"
            - "${sep_final} == SEPARATED and ${sep_committed} == 0"

      - name: lane_stand_down_requires_a_pause_reason_only_for_the_paused_target
        claim_type: conditional_action
        grounds:
          - endpoints.POST_lanes_stand-down
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "paused_reason_code is conditionally required on the value of ANOTHER input field, and the same endpoint also gates DECOMMISSIONED on the current lane_state — so one endpoint yields a 422 input error and a 409 transition error depending only on target_state."
        test_recipe:
          setup: ["one OPEN, fully-equipped STANDARD lane"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_lane
            - *c_eq_wtmd
            - *c_eq_xray
            - *c_eq_ai
            - *c_open
          trigger:
            - call: "POST /lanes/${lane_id}/stand-down"
              payload: { target_state: "PAUSED" }
              as: CheckpointManager
              expect_status: 400
              captures: { sd_missing_reason: $.data.error_id }
            - call: "POST /lanes/${lane_id}/stand-down"
              payload: { target_state: "DECOMMISSIONED" }
              as: CheckpointManager
              expect_status: 409
              captures: { sd_bad_target: $.data.error_id }
            - call: "POST /lanes/${lane_id}/stand-down"
              payload: { target_state: "PAUSED", paused_reason_code: "LOW_DEMAND" }
              as: CheckpointManager
              captures: { sd_state: $.data.lane_state, sd_reason: $.data.paused_reason_code }
            - call: "POST /lanes/${lane_id}/stand-down"
              payload: { target_state: "CLOSED" }
              as: CheckpointManager
              captures: { sd_closed: $.data.lane_state }
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: CheckpointManager
              captures: { sd_avail: $.data.available_lane_positions, sd_open_ct: $.data.open_lane_count }
          assert:
            - "${sd_missing_reason} == ERR_INVALID_REQUEST (400) — PAUSED without paused_reason_code"
            - "${sd_bad_target} == ERR_INVALID_STATE_TRANSITION (409) — DECOMMISSIONED is reachable only from CLOSED, and the lane is still OPEN"
            - "${sd_state} == PAUSED with ${sd_reason} == LOW_DEMAND"
            - "${sd_closed} == CLOSED even though paused_reason_code was omitted — the requirement is conditional on target_state and nothing else"
            - "${sd_avail} == 6 and ${sd_open_ct} == 0 — the OPEN -> PAUSED leg already returned the single required position, and PAUSED -> CLOSED must NOT return it a second time"

      - name: throughput_analysis_is_a_pure_read_that_mutates_nothing
        claim_type: computed_read
        grounds:
          - endpoints.GET_checkpoints_throughput-analysis
          - calculations.throughput_and_diversion_index
        distinguishing_aspect: "A computed read over live rows is the easiest place to accidentally snapshot or bump a version. Calling it twice with no intervening write must return byte-identical numbers and leave Checkpoint.version untouched, and it must cover only bands that carry a forecast."
        test_recipe:
          setup: ["a checkpoint with one OPEN lane, band 10:00 forecast at 10 pax and band 10:30 forecast at 0 pax"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_lane
            - *c_eq_wtmd
            - *c_eq_xray
            - *c_eq_ai
            - *c_open
            - *c_curve
            - *c_band1000
            - *c_band1030
            - *c_flight1030
            - *c_forecast1
            - *c_forecast2
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: CheckpointManager
              captures: { ta_v_before: $.data.version }
          trigger:
            - call: "GET /checkpoints/${cp_id}/throughput-analysis"
              payload: {}
              as: CheckpointManager
              captures: { ta1_forecast: $.data.total_forecast_pax, ta1_bands: $.data.band_results, ta1_run: $.data.max_consecutive_shortfall_bands, ta1_rate: $.data.diversion_rate, ta1_flag: $.data.design_change_recommended }
            - call: "GET /checkpoints/${cp_id}/throughput-analysis"
              payload: {}
              as: StaffingPlanner
              captures: { ta2_forecast: $.data.total_forecast_pax, ta2_run: $.data.max_consecutive_shortfall_bands, ta2_rate: $.data.diversion_rate, ta2_flag: $.data.design_change_recommended }
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: CheckpointManager
              captures: { ta_v_after: $.data.version }
          assert:
            - "${ta1_forecast} == 10 — only forecast bands contribute, and band 10:30 contributes 0"
            - "${ta1_bands} holds exactly two entries ordered by band_start_utc ASC, the first for 10:00 with forecast_pax 10 and served_capacity 90 (one OPEN STANDARD lane at 180 pph over a 30-minute band)"
            - "${ta1_run} == 0 and ${ta1_rate} == \"0.0000\" and ${ta1_flag} == false"
            - "${ta2_forecast} == ${ta1_forecast}, ${ta2_run} == ${ta1_run}, ${ta2_rate} == ${ta1_rate}, ${ta2_flag} == ${ta1_flag} — the second read is identical and was made by a different role"
            - "${ta_v_after} == ${ta_v_before} — no version bump, no stored snapshot"

      - name: lane_assignment_links_four_parents_and_is_findable_from_each
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_lane-assignments
          - endpoints.GET_lane-assignments
        distinguishing_aspect: "One create writes four foreign keys at once, and each of the four list filters must retrieve the same row — the reverse-reachability guarantee for every FK on the entity, not just the primary parent."
        test_recipe:
          setup: ["one DRAFT plan with a single assignment"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_lane
            - *c_eq_wtmd
            - *c_eq_xray
            - *c_eq_ai
            - *c_officer
            - *c_curve
            - *c_band1000
            - *c_flight1030
            - *c_forecast1
            - *c_cpver
            - *c_plan
            - *c_asg1
          trigger:
            - call: "GET /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}" }
              as: StaffingPlanner
              captures: { by_plan: "$.data[0].id" }
            - call: "GET /lane-assignments"
              payload: { lane_id: "${lane_id}" }
              as: StaffingPlanner
              captures: { by_lane: "$.data[0].id" }
            - call: "GET /lane-assignments"
              payload: { officer_id: "${off_id}" }
