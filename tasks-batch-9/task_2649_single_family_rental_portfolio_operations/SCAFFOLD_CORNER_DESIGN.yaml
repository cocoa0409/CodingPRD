  - section: rbac
    instances:
      - name: exclusive_operations_deny_other_roles_with_unauthorized
        claim_type: role_denial
        grounds:
          - rbac.AcquisitionAnalyst
          - rbac.InvestmentCommittee
          - rbac.OperationsManager
          - rbac.VendorManager
          - validations[V040]
        distinguishing_aspect: |
          Authority is checked before anything else about the request: the analyst who submitted the
          case cannot also take the committee's decision endpoint, an OperationsManager cannot touch a
          disposition even on a home id that does not exist (403, not 404, because V040 precedes V054),
          and only after the correct role calls does the case reach APPROVED and the home ACQUIRED.
        test_recipe:
          setup:
            - "Market ATL and PIPELINE Home H1 exist; underwriting case UC was submitted by analyst-1 and sits in SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: System
            - call: "POST /markets"
              payload: { code: "ATL", name: "Atlanta", tax_jurisdiction_code: "GA-FULTON", millage_bps: 125, rent_index_cents: 210000, cost_index_bps: 10250, cost_variance_tolerance_bps: 1000, make_ready_target_days: 30, turn_holdback_cap_bps: 1500, showing_buffer_minutes: 30, min_showing_duration_minutes: 30, pet_deposit_per_pet_cents: 30000, pet_deposit_cap_cents: 50000, max_pets: 2, restricted_breeds: ["PIT_BULL", "ROTTWEILER"], standard_lease_term_months: 12, fraud_block_threshold_bps: 6000, rent_to_income_max_bps: 4000, vacancy_loss_bps: 500, bad_debt_bps: 100, mgmt_fee_bps: 800, underwriting_yield_floor_bps: 500, disposition_yield_floor_bps: 540, max_rent_concession_bps: 500 }
