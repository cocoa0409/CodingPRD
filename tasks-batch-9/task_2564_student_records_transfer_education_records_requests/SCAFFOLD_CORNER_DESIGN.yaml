            - "Student.${student_id}.enrollment_status == \"WITHDRAWN\" and exit_effective_date == \"2026-08-14\""
            - "trigger call 3 returns HTTP 409 with data.error_id == \"ERR_STUDENT_NOT_ENROLLED\""
