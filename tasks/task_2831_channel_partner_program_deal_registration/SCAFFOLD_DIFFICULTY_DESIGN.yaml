          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-30T23:59:59.999Z" }
              as: ChannelOpsAnalyst
            - call: "POST /deal-registrations/${rl1_id}/submit"
              payload: {}
              as: Partner
              as_user_id: "${pl_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00.000Z" }
