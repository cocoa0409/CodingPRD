  - section: cross_cutting_complexity_layers
    instances:
      - name: a_stale_segment_version_blocks_the_second_route
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[route-create-stale-segment]
          - validations[priority=60]
          - errors[ERR_STALE_PATHWAY_VERSION]
        distinguishing_aspect: "The version read before the first route is replayed on the second route request and is refused with 412 because the first route already advanced the segment to 2; re-reading the segment and resubmitting the same payload with version 2 succeeds, and the segment ends at version 3."
        test_recipe:
          setup: ["Project RVT1 with tray PS-A at version 1 and two DESIGNED links TR01-A01 and TR01-A02"]
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id }
            - call: "POST /cabling/telecom-rooms"
              payload: { project_id: "${proj}", room_code: "TR01", floor: 3, branch_circuit_amps: 20, ups_capacity_va: 3000 }
              as: ProjectManager
              captures: { room: $.data.id }
            - call: "POST /cabling/cable-types"
              payload: { category: "CAT6A", jacket_rating: "CMP", outer_diameter_mm: 7.9, max_channel_length_m: 100.0, shielded: false, cost_per_meter_cents: 150, applications: ["DATA_HORIZONTAL"] }
              as: DesignEngineer
              captures: { ct: $.data.id }
