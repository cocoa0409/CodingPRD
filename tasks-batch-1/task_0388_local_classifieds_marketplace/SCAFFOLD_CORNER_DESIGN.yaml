# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe: walks references/claim-extraction-guide.md row-by-row against
# SCAFFOLD.yaml §1.1–§1.7. §1.8 already covers the nine depth rules; corners that
# overlap a §1.8 instance are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_listing_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Listing, endpoints]
        distinguishing_aspect: "POST /listings with all required fields -> 201; response carries publication_status DRAFT, sale_status AVAILABLE, version 1, server-minted id."
        test_recipe:
          setup: ["A furniture Category and a Seller exist."]
          setup_api_calls:
            - call: "POST /categories"
              payload: { slug: "furniture", name: "Furniture" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
              as: Anonymous
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", category_slug: "furniture", title: "Oak Desk", description: "solid", ask_price_cents: 10000, min_acceptable_price_cents: 5000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
          assert:
            - "http status == 201"
            - "Listing.${lst_id}.publication_status == DRAFT"
            - "Listing.${lst_id}.sale_status == AVAILABLE"
            - "Listing.${lst_id}.version == 1"
            - "Listing.${lst_id}.ask_price_cents == 10000"

      - name: get_listing_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Listing, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /listings/{non-existent-uuid} -> ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /listings/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Anonymous
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: create_listing_missing_ask_price_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Listing.fields.ask_price_cents, "errors[ERR_INVALID_REQUEST]", "validations[priority=20]"]
        distinguishing_aspect: "POST /listings omitting ask_price_cents (input, no default) -> ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["A furniture Category and a Seller exist."]
          setup_api_calls:
            - call: "POST /categories"
              payload: { slug: "furniture", name: "Furniture" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
              as: Anonymous
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", category_slug: "furniture", title: "Desk", description: "oak", min_acceptable_price_cents: 5000 }
              as: Seller
              as_user_id: "${s_id}"
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http status == 400"

      - name: member_role_kind_defaults_to_both
        claim_type: Defaults
        grounds: [entities.Member.fields.role_kind]
        distinguishing_aspect: "POST /members without role_kind -> role_kind defaults to BOTH; status ACTIVE; trust_score 50."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { email: "m@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id }
          assert:
            - "Member.${m_id}.role_kind == BOTH"
            - "Member.${m_id}.status == ACTIVE"
            - "Member.${m_id}.trust_score == 50"

      - name: listing_system_fields_ignore_client_input
        claim_type: System Fields
        grounds: [entities.Listing.fields.publication_status, entities.Listing.fields.expires_at]
        distinguishing_aspect: "Client-supplied publication_status/expires_at/version in POST /listings are ignored; server forces DRAFT, null expires_at, version 1."
        test_recipe:
          setup: ["A furniture Category and a Seller exist."]
          setup_api_calls:
            - call: "POST /categories"
              payload: { slug: "furniture", name: "Furniture" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
              as: Anonymous
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", category_slug: "furniture", title: "Desk", description: "oak", ask_price_cents: 10000, min_acceptable_price_cents: 5000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
          assert:
            - "Listing.${lst_id}.publication_status == DRAFT"
            - "Listing.${lst_id}.expires_at == null"
            - "Listing.${lst_id}.version == 1"

      - name: create_flag_invalid_reason_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.Flag.fields.reason, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /flags with reason not in {SPAM,PROHIBITED,SCAM,MISCATEGORIZED,OTHER} -> ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["A reporter member and a target listing exist."]
          setup_api_calls:
            - call: "POST /categories"
              payload: { slug: "furniture", name: "Furniture" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /members"
              payload: { email: "r@x.com", display_name: "R", role_kind: "BUYER" }
              as: Anonymous
              captures: { r_id: $.data.id }
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", category_slug: "furniture", title: "Desk", description: "oak", ask_price_cents: 10000, min_acceptable_price_cents: 5000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
          trigger:
            - call: "POST /flags"
              payload: { reporter_id: "${r_id}", target_type: "LISTING", target_listing_id: "${lst_id}", reason: "NONSENSE" }
              as: Member
              as_user_id: "${r_id}"
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http status == 400"

      - name: category_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Category]
        distinguishing_aspect: "Category has common_fields:false — it carries id+created_at only, no version, and no update endpoint exists in §1.5."
        test_recipe:
          setup: ["One category created."]
          setup_api_calls:
            - call: "POST /categories"
              payload: { slug: "furniture", name: "Furniture" }
              as: PlatformAdmin
          trigger:
            - call: "GET /categories"
              payload: {}
              as: Anonymous
              captures: { cats: $.data }
          assert:
            - "GET /categories returns the category; the object exposes no 'version' field"
            - "§1.5 declares no PATCH/PUT/DELETE /categories endpoint"

      - name: listing_requires_existing_category
        claim_type: Parent Relationships
        grounds: [entities.Listing.fields.category_slug, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /listings referencing a non-existent category_slug -> ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["A seller exists; no category named 'ghost'."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
              as: Anonymous
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", category_slug: "ghost", title: "Desk", description: "oak", ask_price_cents: 10000, min_acceptable_price_cents: 5000 }
              as: Seller
              as_user_id: "${s_id}"
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: flat_topology_fk_integrity_offer_listing_id_copied
        claim_type: flat_fk_integrity
        grounds: [entities.Offer.fields.listing_id, entities.Conversation.fields.listing_id]
        distinguishing_aspect: "Flat topology: Offer.listing_id and Offer.seller_id are copied from the conversation at create, matching the conversation's listing_id/seller_id (cross-reference integrity)."
        test_recipe:
          setup: ["Published listing; conversation opened by buyer; one offer posted."]
          setup_api_calls:
            - call: "POST /categories"
              payload: { slug: "furniture", name: "Furniture" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /members"
              payload: { email: "b@x.com", display_name: "B", role_kind: "BUYER" }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", category_slug: "furniture", title: "Desk", description: "oak", ask_price_cents: 10000, min_acceptable_price_cents: 5000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /conversations"
              payload: { listing_id: "${lst_id}", buyer_id: "${b_id}" }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { conv_id: $.data.id }
          trigger:
            - call: "POST /offers"
              payload: { conversation_id: "${conv_id}", amount_cents: 9000 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { off_id: $.data.id }
          assert:
            - "Offer.${off_id}.listing_id == ${lst_id}"
            - "Offer.${off_id}.seller_id == ${s_id}"
            - "Offer.${off_id}.buyer_id == ${b_id}"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: publish_from_active_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Listing.transitions.DRAFT_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Re-publishing an already-ACTIVE listing -> ERR_INVALID_STATE 409 (publish only defined from DRAFT)."
        test_recipe:
          setup: ["Published (ACTIVE) listing."]
          setup_api_calls:
            - call: "POST /categories"
              payload: { slug: "furniture", name: "Furniture" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", category_slug: "furniture", title: "Desk", description: "oak", ask_price_cents: 10000, min_acceptable_price_cents: 5000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: new_listing_initial_state_is_draft_available
        claim_type: Initial State
        grounds: [state_machines.Listing, entities.Listing.fields.publication_status]
        distinguishing_aspect: "A newly created listing has publication_status DRAFT and sale_status AVAILABLE (both dimensions at their initial states)."
        test_recipe:
          setup: ["A category and seller exist."]
          setup_api_calls:
            - call: "POST /categories"
              payload: { slug: "furniture", name: "Furniture" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
              as: Anonymous
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", category_slug: "furniture", title: "Desk", description: "oak", ask_price_cents: 10000, min_acceptable_price_cents: 5000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
          assert:
            - "Listing.${lst_id}.publication_status == DRAFT"
            - "Listing.${lst_id}.sale_status == AVAILABLE"

      - name: counter_on_withdrawn_offer_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Offer.transitions.PROPOSED_to_WITHDRAWN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Countering a WITHDRAWN (terminal) offer -> ERR_INVALID_STATE 409; no transition leaves a terminal Offer state."
        test_recipe:
          setup: ["Published listing; buyer proposes then withdraws an offer."]
          setup_api_calls:
            - call: "POST /categories"
              payload: { slug: "furniture", name: "Furniture" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /members"
              payload: { email: "b@x.com", display_name: "B", role_kind: "BUYER" }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", category_slug: "furniture", title: "Desk", description: "oak", ask_price_cents: 10000, min_acceptable_price_cents: 1000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /conversations"
              payload: { listing_id: "${lst_id}", buyer_id: "${b_id}" }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { conv_id: $.data.id }
            - call: "POST /offers"
              payload: { conversation_id: "${conv_id}", amount_cents: 5000 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { off_id: $.data.id }
            - call: "POST /offers/${off_id}/withdraw"
              payload: {}
              as: Buyer
              as_user_id: "${b_id}"
          trigger:
            - call: "POST /offers/${off_id}/counter"
              payload: { amount_cents: 6000 }
              as: Seller
              as_user_id: "${s_id}"
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: accept_offer_rejects_sibling_offers_cascade
        claim_type: Side Effect Execution
        grounds: [state_machines.Offer.transitions.PROPOSED_to_ACCEPTED, state_machines.Offer.transitions.PROPOSED_to_REJECTED]
        distinguishing_aspect: "Accepting one open offer transitions every sibling PROPOSED/COUNTERED offer on the same listing to REJECTED (cascade-down side effect)."
        test_recipe:
          setup: ["Published listing with two buyer offers (9000 and 8500), both open."]
          setup_api_calls:
            - call: "POST /categories"
              payload: { slug: "furniture", name: "Furniture" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /members"
              payload: { email: "b1@x.com", display_name: "B1", role_kind: "BUYER" }
              as: Anonymous
              captures: { b1_id: $.data.id }
            - call: "POST /members"
              payload: { email: "b2@x.com", display_name: "B2", role_kind: "BUYER" }
              as: Anonymous
              captures: { b2_id: $.data.id }
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", category_slug: "furniture", title: "Desk", description: "oak", ask_price_cents: 10000, min_acceptable_price_cents: 5000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_v: $.data.version }
            - call: "POST /conversations"
              payload: { listing_id: "${lst_id}", buyer_id: "${b1_id}" }
              as: Buyer
              as_user_id: "${b1_id}"
              captures: { conv1_id: $.data.id }
            - call: "POST /conversations"
              payload: { listing_id: "${lst_id}", buyer_id: "${b2_id}" }
              as: Buyer
              as_user_id: "${b2_id}"
              captures: { conv2_id: $.data.id }
            - call: "POST /offers"
              payload: { conversation_id: "${conv1_id}", amount_cents: 9000 }
              as: Buyer
              as_user_id: "${b1_id}"
              captures: { off1_id: $.data.id }
            - call: "POST /offers"
              payload: { conversation_id: "${conv2_id}", amount_cents: 8500 }
              as: Buyer
              as_user_id: "${b2_id}"
              captures: { off2_id: $.data.id }
          trigger:
            - call: "POST /offers/${off1_id}/accept"
              payload: { expected_listing_version: "${lst_v}" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "GET /offers/${off2_id}"
              payload: {}
              as: Member
              as_user_id: "${b2_id}"
              captures: { o2st: $.data.status }
          assert:
            - "Offer.${off1_id}.status == ACCEPTED"
            - "Offer.${off2_id}.status == REJECTED (sibling cascade)"
            - "Listing.${lst_id}.open_offer_count == 0"

      - name: member_reinstate_does_not_republish_listings
        claim_type: Compensation
        grounds: [state_machines.Member.transitions.SUSPENDED_to_ACTIVE, state_machines.Listing.transitions.ACTIVE_to_REMOVED]
        distinguishing_aspect: "Reinstating a suspended member returns status ACTIVE but does NOT re-publish the listings that the suspension REMOVED — removal is not reversed."
        test_recipe:
          setup: ["Seller with one published listing; moderator suspends (listing -> REMOVED), then reinstates."]
          setup_api_calls:
            - call: "POST /categories"
              payload: { slug: "furniture", name: "Furniture" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", category_slug: "furniture", title: "Desk", description: "oak", ask_price_cents: 10000, min_acceptable_price_cents: 5000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /members/${s_id}/suspend"
              payload: {}
              as: Moderator
          trigger:
            - call: "POST /members/${s_id}/reinstate"
              payload: {}
              as: Moderator
            - call: "GET /listings/${lst_id}"
              payload: {}
              as: Member
              as_user_id: "${s_id}"
              captures: { pub: $.data.publication_status }
          assert:
            - "Member.${s_id}.status == ACTIVE"
            - "Listing.${lst_id}.publication_status == REMOVED (not re-published)"
            - "Member.${s_id}.active_listing_count == 0"

      - name: listing_expiry_sweep_via_clock_advance
        claim_type: Side Effect Execution
        grounds: [state_machines.Listing.transitions.ACTIVE_to_EXPIRED, entities.Listing.fields.expires_at]
        distinguishing_aspect: "Advancing the clock past a published listing's expires_at (30 days) sweeps it ACTIVE->EXPIRED and decrements seller.active_listing_count."
        test_recipe:
          setup: ["Clock 2026-06-01T00:00:00Z; listing published (expires_at = clock + 30 days = 2026-07-01)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /categories"
              payload: { slug: "furniture", name: "Furniture" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", category_slug: "furniture", title: "Desk", description: "oak", ask_price_cents: 10000, min_acceptable_price_cents: 5000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /listings/${lst_id}"
              payload: {}
              as: Member
              as_user_id: "${s_id}"
              captures: { pub: $.data.publication_status }
            - call: "GET /members/${s_id}"
              payload: {}
              as: Member
              as_user_id: "${s_id}"
              captures: { alc: $.data.active_listing_count }
          assert:
            - "Listing.${lst_id}.publication_status == EXPIRED"
            - "Member.${s_id}.active_listing_count == 0"

      - name: spam_flag_threshold_auto_hides_listing
        claim_type: Conditional cascade
        grounds: [state_machines.Flag.transitions.OPEN_to_UPHELD, state_machines.Listing.transitions.ACTIVE_to_REMOVED, entities.Listing.fields.active_flag_count]
        distinguishing_aspect: "When a listing's active_flag_count reaches SPAM_FLAG_THRESHOLD (3) on the third OPEN flag, the listing auto-transitions ACTIVE->REMOVED."
        test_recipe:
          setup: ["Published listing; three distinct reporters file SPAM flags against it."]
          setup_api_calls:
            - call: "POST /categories"
              payload: { slug: "furniture", name: "Furniture" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /members"
              payload: { email: "r1@x.com", display_name: "R1", role_kind: "BUYER" }
              as: Anonymous
              captures: { r1_id: $.data.id }
            - call: "POST /members"
              payload: { email: "r2@x.com", display_name: "R2", role_kind: "BUYER" }
              as: Anonymous
              captures: { r2_id: $.data.id }
            - call: "POST /members"
              payload: { email: "r3@x.com", display_name: "R3", role_kind: "BUYER" }
              as: Anonymous
              captures: { r3_id: $.data.id }
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", category_slug: "furniture", title: "Desk", description: "oak", ask_price_cents: 10000, min_acceptable_price_cents: 5000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /flags"
