      - name: corner_credit_event_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.CreditEvent
          - endpoints[POST /credit-events]
          - endpoints[GET /borrowers/{id}/credit-events]
        distinguishing_aspect: "CreditEvent declares common_fields false: its response carries id and created_at but no version and no updated_at, and 1.5 exposes no endpoint that mutates an existing credit event."
        test_recipe:
          setup: ["One borrower with one filed credit event."]
          setup_api_calls:
            - call: "POST /borrowers"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload:
                legal_name: "Ida Novak"
                fico_score: 700
                monthly_debt_obligations_cents: 0
                verified_liquid_assets_cents: 5000000
                age_years: 50
              captures: { borr_id: "$.data.id" }
            - call: "POST /credit-events"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload:
                borrower_id: "${borr_id}"
                event_type: "SHORT_SALE"
                completion_date: "2024-06-15T00:00:00Z"
                documented_flag: true
              captures: { ce_id: "$.data.id" }
          trigger:
            - call: "GET /borrowers/${borr_id}/credit-events"
              as: Underwriter
              as_user_id: "uw-1"
              payload: { event_type: "SHORT_SALE" }
          assert:
            - "HTTP status == 200 and exactly 1 row returned"
            - "CreditEvent.${ce_id} exposes id and created_at"
            - "CreditEvent.${ce_id} exposes no version field and no updated_at field"
            - "CreditEvent.completion_date == \"2024-06-15T00:00:00Z\""
            - "No endpoint in 1.5 accepts an update or delete of an existing CreditEvent"

