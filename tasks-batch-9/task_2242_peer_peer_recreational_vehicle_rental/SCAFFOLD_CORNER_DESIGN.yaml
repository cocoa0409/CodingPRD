      - name: booking_trip_and_settlement_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.Booking.initial_state
          - entities.Booking.fields.trip_status
          - entities.Booking.fields.settlement_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / booking_two_dimensions_advance_on_different_triggers
          rationale: >-
            The named §1.8 instance walks both Booking dimensions across the same
            trigger sequence and pins every (trip_status, settlement_status)
            pair, which is exactly this parallel-shape claim.

      - name: listing_suspension_cascades_down_to_its_live_bookings
        claim_type: cascade_down
        grounds:
          - state_machines.Listing.transitions.LISTED_to_SUSPENDED
          - state_machines.Booking.transitions.CONFIRMED_to_CANCELLED_BY_PLATFORM
        excluded_because:
          difficulty_instance: transitive_cascade / owner_cancellation_propagates_five_levels_to_a_second_listings_campground_slot
          rationale: >-
            The named §1.8 instance drives the full L1→L5 chain including the
            LISTED → SUSPENDED cascade onto every non-terminal Booking and the
            assignment void beneath it.

      - name: settlement_returns_to_reconciling_when_all_claims_are_terminal
        claim_type: bubble_up
        grounds:
          - state_machines.Booking.transitions.DISPUTED_to_RECONCILING
          - state_machines.DamageClaim.terminal_states
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / settlement_is_gated_by_a_child_damage_claim_and_released_by_its_withdrawal
          rationale: >-
            The named §1.8 instance asserts both halves of the bubble-up: the
            settle gate while a child claim is non-terminal, and the automatic
            DISPUTED → RECONCILING release once the last child reaches a terminal
            status.

      - name: settlement_reversal_undoes_every_posting_side_effect
        claim_type: compensation
        grounds:
          - state_machines.Booking.transitions.SETTLED_to_RECONCILING
          - calculations.booking_ledger_conservation
        excluded_because:
          difficulty_instance: compensating_invariant / settlement_reversal_restores_every_derived_money_field_and_keeps_the_ledger_at_zero
          rationale: >-
            The named §1.8 instance pins the eight-row ledger, the restored
            wallet and payout balances and the decremented
            completed_night_count after the compensating reversal.

      - name: waitlist_promotion_only_fires_when_a_scheduled_slot_is_released
        claim_type: conditional_cascade
        grounds:
          - state_machines.DeliveryAssignment.transitions.WAITLISTED_to_VOIDED
          - calculations.dropoff_waitlist_promotion
        excluded_because:
          difficulty_instance: compensating_invariant / voiding_a_scheduled_dropoff_releases_the_slot_and_unwinds_the_delivery_fee
          rationale: >-
            The named §1.8 instance contrasts voiding a SCHEDULED row (slot
            released, promotion runs) with voiding a WAITLISTED row (no slot
            released, no promotion), which is the conditional half of this
            cascade.

