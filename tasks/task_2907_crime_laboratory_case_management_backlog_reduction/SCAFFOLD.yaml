    code: 200
    input: [rationale]
    output: Analyst
    side_effects: ["qualification_state SUSPENDED -> PROBATION", "consecutive_pt_failures reset to 0, suspended_at_utc cleared, probation_entered_at_utc stamped", "assignments released by the earlier FULL_RELEASE are NOT restored", "increments Analyst.version by 1"]

  # ---------------------------------------------------------------- methods
