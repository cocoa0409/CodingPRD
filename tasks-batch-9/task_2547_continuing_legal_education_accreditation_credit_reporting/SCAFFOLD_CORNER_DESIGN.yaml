          assert:
            - "The setup draw produced ProviderAudit.${audit_id}.sample_size == 2 with sampled_course_ids == ['${c1}', '${c2}'] ordered by presented_at, and Provider.${prov_id}.courses_sampled_lifetime == 2"
            - "Trigger call 1 returned HTTP 409 ERR_FINDINGS_EXCEED_SAMPLE for findings_count 3 against sample_size 2, and the audit version stayed ${audit_v2}"
            - "Trigger call 2 returned HTTP 200 with findings_count == 2, status 'FINDINGS_ISSUED' and Provider.${prov_id}.audit_findings_count == 2"
            - "Trigger call 3 returned HTTP 409 ERR_INVALID_STATE_TRANSITION — FINDINGS_ISSUED -> CLEARED is declared but requires findings_count <= AUDIT_CLEAR_MAX_FINDINGS (1), and that unmet data precondition has no dedicated error id"
            - "Trigger call 4 returned HTTP 200 with status 'SANCTIONED', sanction_type 'PROBATION' and closed_at == '2026-08-01T00:00:00Z'"
            - "Provider.${prov_id}.accreditation_status == 'PROBATIONARY' and self_certification_enabled == false after the sanction cascade"
            - "GET /cle/fee-assessments?provider_id=${prov_id}&fee_type=AUDIT_SANCTION returns one ASSESSED row with amount_cents == 250000"
            - "Provider.${prov_id}.last_audit_closed_at == '2026-08-01T00:00:00Z'"

      - name: one_complaint_can_be_escalated_into_only_one_audit_ever
        claim_type: violation_to_error
        grounds:
          - errors[ERR_COMPLAINT_ALREADY_ESCALATED]
          - validations[priority 72 -> ERR_COMPLAINT_ALREADY_ESCALATED]
          - entities.Complaint.fields.escalated
          - endpoints[POST /cle/provider-audits]
        distinguishing_aspect: "The escalation flag survives the audit that consumed it: the first audit is closed CLEARED and its window is left far behind, so neither the single-engagement rule nor the overlap rule can explain the second refusal — and the same second window is accepted the moment the request stops citing the spent complaint."
        test_recipe:
          setup:
            - "One ACCREDITED self-certifying provider with one course in each of two non-abutting windows, and one substantiated complaint against the provider."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Escalation Test Sponsors", provider_type: "GOVERNMENT" }
              as: BoardAdmin
              as_user_id: "22222222-2222-4222-8222-222222222222"
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
              as_user_id: "22222222-2222-4222-8222-222222222222"
            - call: "POST /cle/courses"
              payload: { title: "First Window Programme", delivery_format: "ON_DEMAND", total_minutes: 300, presented_at: "2026-03-01T09:00:00Z", attendance_verification_method: "CERTIFICATE", credit_allocations: [ { category: "GENERAL", minutes: 300 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { c1: $.data.id }
            - call: "POST /cle/courses"
              payload: { title: "Second Window Programme", delivery_format: "ON_DEMAND", total_minutes: 300, presented_at: "2026-09-01T09:00:00Z", attendance_verification_method: "CERTIFICATE", credit_allocations: [ { category: "GENERAL", minutes: 300 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { c2: $.data.id }
            - call: "POST /cle/complaints"
              payload: { subject_type: "PROVIDER", subject_id: "${prov_id}", allegation: "Attendance records for the spring programme cannot be produced.", allegation_category: "ATTENDANCE_FRAUD" }
              as: BoardAdmin
              as_user_id: "11111111-1111-4111-8111-111111111111"
              captures: { comp_id: $.data.id }
            - call: "POST /cle/complaints/${comp_id}/disposition"
              payload: { action: "OPEN_REVIEW" }
              as: BoardAdmin
              as_user_id: "22222222-2222-4222-8222-222222222222"
            - call: "POST /cle/complaints/${comp_id}/disposition"
              payload: { action: "SUBSTANTIATE", disposition_reason: "The sponsor produced no roster for the audited session." }
              as: BoardAdmin
              as_user_id: "22222222-2222-4222-8222-222222222222"
            - call: "POST /cle/provider-audits"
              payload: { provider_id: "${prov_id}", audit_period_start: "2026-01-01T00:00:00Z", audit_period_end: "2026-06-30T00:00:00Z", trigger_type: "COMPLAINT_ESCALATION", originating_complaint_id: "${comp_id}" }
              as: BoardAdmin
              captures: { audit_1: $.data.id, a1_v1: $.data.version }
            - call: "POST /cle/provider-audits/${audit_1}/audit-actions"
              payload: { action: "DRAW_SAMPLE", expected_audit_version: "${a1_v1}" }
              as: BoardAdmin
              captures: { a1_v2: $.data.version }
            - call: "POST /cle/provider-audits/${audit_1}/audit-actions"
              payload: { action: "ISSUE_FINDINGS", expected_audit_version: "${a1_v2}", findings_count: 0 }
              as: BoardAdmin
              captures: { a1_v3: $.data.version }
            - call: "POST /cle/provider-audits/${audit_1}/audit-actions"
              payload: { action: "CLOSE_CLEARED", expected_audit_version: "${a1_v3}" }
              as: BoardAdmin
          trigger:
            - call: "POST /cle/provider-audits"
              payload: { provider_id: "${prov_id}", audit_period_start: "2026-08-01T00:00:00Z", audit_period_end: "2026-12-31T00:00:00Z", trigger_type: "COMPLAINT_ESCALATION", originating_complaint_id: "${comp_id}" }
              as: BoardAdmin
              expect_error: ERR_COMPLAINT_ALREADY_ESCALATED
            - call: "POST /cle/provider-audits"
              payload: { provider_id: "${prov_id}", audit_period_start: "2026-08-01T00:00:00Z", audit_period_end: "2026-12-31T00:00:00Z", trigger_type: "RISK_BASED" }
              as: BoardAdmin
              captures: { audit_2: $.data.id }
          assert:
            - "Complaint.${comp_id}.status == 'SUBSTANTIATED' and escalated == true after the first audit was created"
            - "ProviderAudit.${audit_1}.sample_size == 1 with sampled_course_ids == ['${c1}'] — the pool held only the first-window course, so the drawn size is pool-limited whatever the risk tier"
            - "ProviderAudit.${audit_1}.status == 'CLEARED' with sanction_type 'NONE' and closed_at set — the engagement is terminal, so the single-engagement rule is satisfied"
            - "Trigger call 1 returned HTTP 409 ERR_COMPLAINT_ALREADY_ESCALATED — the 2026-08-01 window neither overlaps nor abuts [2026-01-01, 2026-06-30], so only the spent complaint can explain the refusal"
            - "Trigger call 2 returned HTTP 201 with the identical window and trigger_type RISK_BASED and originating_complaint_id null"
            - "GET /cle/provider-audits?originating_complaint_id=${comp_id} returns exactly one row (${audit_1}) and GET /cle/provider-audits?provider_id=${prov_id} returns two"
            - "Provider.${prov_id}.accreditation_status == 'PROBATIONARY' and substantiated_complaint_count == 1 (the substantiation cascade), with courses_sampled_lifetime == 1"

      - name: comity_is_available_only_from_a_comity_jurisdiction_that_is_the_attorneys_own
        claim_type: violation_to_error
        grounds:
          - errors[ERR_COMITY_NOT_AVAILABLE]
          - validations[priority 72 -> ERR_COMITY_NOT_AVAILABLE]
          - calculations.reciprocity_credit_conversion
          - domain_constants.COMITY_JURISDICTIONS
          - endpoints[POST /cle/reciprocity-claims/{id}/determination]
        distinguishing_aspect: "Two independent comity gates are separated on one attorney whose principal office is in New York: an origin jurisdiction outside COMITY_JURISDICTIONS fails the first gate, and a comity jurisdiction that is not the attorney's own fails the second — while the third gate (principal office equal to HOME_JURISDICTION 'ST') is unreachable by construction, because 'ST' is not itself a comity jurisdiction."
        test_recipe:
          setup:
            - "One attorney whose principal_office_jurisdiction is NY, with a 2026-01-01 -> 2028-01-01 cycle and two SUBMITTED COMITY claims."
          setup_api_calls:
            - call: "POST /cle/attorneys"
              payload: { bar_number: "CMT-8001", full_name: "Yuki Tanaka", admission_date: "2002-02-02T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "NY" }
              as: BoardAdmin
              captures: { att_id: $.data.id, att_v1: $.data.version }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_id: $.data.id, cyc_v1: $.data.version }
            - call: "POST /cle/reciprocity-claims"
              payload: { attorney_id: "${att_id}", basis: "COMITY", origin_jurisdiction: "TX", origin_course_title: "Texas Full Compliance Certificate", origin_credit_hours: 15.0, origin_category: "GENERAL", completion_date: "2026-05-01T00:00:00Z", expected_attorney_version: "${att_v1}" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { claim_tx: $.data.id }
            - call: "GET /cle/attorneys/${att_id}"
              as: Attorney
              as_user_id: "${att_id}"
              captures: { att_v2: $.data.version }
            - call: "POST /cle/reciprocity-claims"
              payload: { attorney_id: "${att_id}", basis: "COMITY", origin_jurisdiction: "IL", origin_course_title: "Illinois Full Compliance Certificate", origin_credit_hours: 15.0, origin_category: "GENERAL", completion_date: "2026-06-01T00:00:00Z", expected_attorney_version: "${att_v2}" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { claim_il: $.data.id }
          trigger:
            - call: "POST /cle/reciprocity-claims/${claim_tx}/determination"
              payload: { action: "APPROVE" }
              as: BoardAdmin
              expect_error: ERR_COMITY_NOT_AVAILABLE
            - call: "POST /cle/reciprocity-claims/${claim_il}/determination"
              payload: { action: "APPROVE" }
              as: BoardAdmin
              expect_error: ERR_COMITY_NOT_AVAILABLE
          assert:
            - "Trigger call 1 returned HTTP 409 ERR_COMITY_NOT_AVAILABLE — TX is a reciprocity jurisdiction but not a comity jurisdiction, so the pathway matters as much as the jurisdiction"
            - "Trigger call 2 returned HTTP 409 ERR_COMITY_NOT_AVAILABLE — IL is a comity jurisdiction, but the attorney's principal office is NY"
            - "ReciprocityClaim.${claim_tx}.status == 'SUBMITTED' and ReciprocityClaim.${claim_il}.status == 'SUBMITTED' with converted_minutes == 0 and determination_reason null on both"
            - "ComplianceCycle.${cyc_id}.credit_status == 'OPEN', comity_claim_id is null and version is still ${cyc_v1}"
            - "GET /cle/credit-records?attorney_id=${att_id} returns 0 rows — a refused comity determination never creates credit, and an approved one would not either"

      - name: a_reciprocity_claim_from_an_unlisted_jurisdiction_is_refused
        claim_type: violation_to_error
        grounds:
          - errors[ERR_JURISDICTION_NOT_RECIPROCAL]
          - validations[priority 72 -> ERR_JURISDICTION_NOT_RECIPROCAL]
          - calculations.reciprocity_credit_conversion
          - domain_constants.RECIPROCITY_JURISDICTIONS
        distinguishing_aspect: "The jurisdiction list is consulted at determination time rather than at filing time — a claim from Ohio is accepted into SUBMITTED and only then refused — and a claim from a listed jurisdiction filed by the same attorney converts on the same call pattern, so the refusal is about the two-letter code alone."
        test_recipe:
          setup:
            - "One attorney with a 2026-01-01 -> 2028-01-01 cycle and two SUBMITTED RECIPROCITY claims, one from OH and one from CA."
          setup_api_calls:
            - call: "POST /cle/attorneys"
              payload: { bar_number: "RCP-8101", full_name: "Declan Moore", admission_date: "2002-03-03T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id, att_v1: $.data.version }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /cle/reciprocity-claims"
              payload: { attorney_id: "${att_id}", basis: "RECIPROCITY", origin_jurisdiction: "OH", origin_course_title: "Ohio Professional Conduct Seminar", origin_credit_hours: 2.0, origin_category: "ETHICS", completion_date: "2026-05-01T00:00:00Z", expected_attorney_version: "${att_v1}" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { claim_oh: $.data.id }
            - call: "GET /cle/attorneys/${att_id}"
              as: Attorney
              as_user_id: "${att_id}"
              captures: { att_v2: $.data.version }
            - call: "POST /cle/reciprocity-claims"
              payload: { attorney_id: "${att_id}", basis: "RECIPROCITY", origin_jurisdiction: "CA", origin_course_title: "California Professional Responsibility Intensive", origin_credit_hours: 3.0, origin_category: "PROFESSIONALISM", completion_date: "2026-07-01T00:00:00Z", expected_attorney_version: "${att_v2}" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { claim_ca: $.data.id }
          trigger:
            - call: "POST /cle/reciprocity-claims/${claim_oh}/determination"
              payload: { action: "APPROVE" }
              as: BoardAdmin
              expect_error: ERR_JURISDICTION_NOT_RECIPROCAL
            - call: "POST /cle/reciprocity-claims/${claim_ca}/determination"
              payload: { action: "APPROVE" }
              as: BoardAdmin
          assert:
            - "The OH claim was created with HTTP 201 and status 'SUBMITTED' — filing does not consult RECIPROCITY_JURISDICTIONS"
            - "Trigger call 1 returned HTTP 409 ERR_JURISDICTION_NOT_RECIPROCAL and ReciprocityClaim.${claim_oh}.status is still 'SUBMITTED' with converted_minutes == 0"
            - "Trigger call 2 returned HTTP 200 with ReciprocityClaim.${claim_ca}.status == 'APPROVED', converted_minutes == 180 (3.0 * 60 California minutes, already a 15-minute multiple) and converted_category == 'ETHICS' (PROFESSIONALISM maps to ETHICS)"
            - "GET /cle/credit-records?reciprocity_claim_id=${claim_ca} returns exactly one VERIFIED row with credited_ethics_minutes == 180 and source 'RECIPROCITY'"
            - "GET /cle/credit-records?reciprocity_claim_id=${claim_oh} returns 0 rows"
            - "ComplianceCycle.${cyc_id}.earned_ethics_minutes == 180 and earned_countable_minutes == 180"

      - name: reinstatement_is_refused_while_any_assessment_is_still_outstanding
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OUTSTANDING_FEE_BALANCE]
          - validations[priority 76 -> ERR_OUTSTANDING_FEE_BALANCE]
          - state_machines.ComplianceCycle.ADMIN_SUSPENDED_to_REINSTATED
          - state_machines.FeeAssessment.ASSESSED_to_PAID
          - domain_constants.REINSTATEMENT_FEE_CENTS
          - domain_constants.LATE_FEE_CAP_CENTS
          - endpoints[POST /cle/attorneys/{id}/reinstatement]
        distinguishing_aspect: "The money gate is evaluated last and refuses a cure that is otherwise entirely legal: the attorney is ADMIN_SUSPENDED, the cycle is ADMIN_SUSPENDED and the cure_basis is BOARD_ORDER, so only the 150000-cent balance stands in the way — paying both assessments makes the identical request succeed, and the BOARD_ORDER cure deliberately leaves credit_status OPEN."
        test_recipe:
          setup:
            - "One attorney (GROUP_1, admitted 2000) with a 2026-01-01 -> 2028-01-01 cycle and no credit records; the clock is advanced past the filing deadline and then past the suspension threshold, with one sweep at each stop."
          setup_api_calls:
            - call: "POST /cle/attorneys"
              payload: { bar_number: "FEE-9001", full_name: "Ingrid Halvorsen", admission_date: "2000-01-01T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-02-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /cle/reporting-sweeps"
              payload: {}
              as: BoardAdmin
              captures: { sweep_1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-04-05T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /cle/reporting-sweeps"
              payload: {}
              as: BoardAdmin
              captures: { sweep_2: $.data.id }
          trigger:
            - call: "POST /cle/attorneys/${att_id}/reinstatement"
              payload: { cycle_id: "${cyc_id}", cure_basis: "BOARD_ORDER", reason: "Board order of 2028-04-05." }
              as: BoardAdmin
              expect_error: ERR_OUTSTANDING_FEE_BALANCE
            - call: "GET /cle/fee-assessments?attorney_id=${att_id}&fee_type=LATE_COMPLIANCE"
              as: BoardAdmin
              captures: { fee_late: "$.data[0].id" }
            - call: "POST /cle/fee-assessments/${fee_late}/settlement"
              payload: { action: "PAY" }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /cle/attorneys/${att_id}/reinstatement"
              payload: { cycle_id: "${cyc_id}", cure_basis: "BOARD_ORDER", reason: "Board order of 2028-04-05." }
              as: BoardAdmin
              expect_error: ERR_OUTSTANDING_FEE_BALANCE
            - call: "GET /cle/fee-assessments?attorney_id=${att_id}&fee_type=REINSTATEMENT"
              as: BoardAdmin
              captures: { fee_reinst: "$.data[0].id" }
            - call: "POST /cle/fee-assessments/${fee_reinst}/settlement"
              payload: { action: "PAY" }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /cle/attorneys/${att_id}/reinstatement"
              payload: { cycle_id: "${cyc_id}", cure_basis: "BOARD_ORDER", reason: "Board order of 2028-04-05." }
              as: BoardAdmin
          assert:
            - "Sweep ${sweep_1} at as_of 2028-02-01 moved the cycle to DELINQUENT with delinquent_since == '2028-02-01T00:00:00Z', delinquencies_issued == 1, cycles_examined == 1 and late_fees_assessed_cents == 100000 — deficiency 1800 + 180 + 60 + 120 = 2160 minutes, 36 hours, base 60000 plus a 20-hour-capped surcharge of 50000, trimmed by LATE_FEE_CAP_CENTS"
            - "Sweep ${sweep_2} at as_of 2028-04-05 moved the cycle to ADMIN_SUSPENDED with suspensions_issued == 1, late_fees_assessed_cents == 50000 and delinquencies_issued == 0"
            - "Attorney.${att_id}.status == 'ADMIN_SUSPENDED' and outstanding_fee_cents == 150000 after the second sweep"
            - "Trigger call 1 returned HTTP 402 ERR_OUTSTANDING_FEE_BALANCE with the whole 150000 outstanding"
            - "Trigger call 4 returned HTTP 402 ERR_OUTSTANDING_FEE_BALANCE again with 50000 still outstanding — the gate demands a zero balance, not merely progress"
            - "Trigger call 7 returned HTTP 200: ComplianceCycle.${cyc_id}.administrative_status == 'REINSTATED', delinquent_since is null, and credit_status is still 'OPEN' because cure_basis was BOARD_ORDER rather than FEES_AND_CREDITS_CURED"
            - "Attorney.${att_id}.status == 'ACTIVE' and outstanding_fee_cents == 0"
            - "Both FeeAssessment rows are PAID with settled_at == '2028-04-05T00:00:00Z' and GET /cle/fee-assessments?attorney_id=${att_id}&status=ASSESSED returns 0 rows"

      - name: settling_an_already_settled_assessment_is_refused
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FEE_ALREADY_SETTLED]
          - validations[priority 76 -> ERR_FEE_ALREADY_SETTLED]
        excluded_because:
          difficulty_instance: outstanding_fee_cents_always_equals_the_sum_of_assessed_assessments
          rationale: "That §1.8 instance walks the whole fee ledger and includes the re-settlement refusal on an already WAIVED assessment, asserting that outstanding_fee_cents never goes negative."

      - name: a_third_information_request_on_one_application_is_refused
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INFO_REQUEST_LIMIT_EXCEEDED]
          - domain_constants.MAX_INFO_REQUEST_ROUNDS
        excluded_because:
          difficulty_instance: course_application_info_request_loop_then_remand_refills_the_budget
          rationale: "The two-round information-request budget and the third request that exceeds it are asserted there, together with the remand that resets the counter."

      - name: a_second_remand_of_one_application_is_refused
        claim_type: violation_to_error
        grounds:
          - errors[ERR_REMAND_LIMIT_EXCEEDED]
          - domain_constants.MAX_REMANDS
        excluded_because:
          difficulty_instance: course_application_info_request_loop_then_remand_refills_the_budget
          rationale: "The single-remand budget is part of that instance's bounded-loop claim, including the appeal that can no longer be remanded a second time."

  # ===========================================================================
  # Table 7 of the claim-extraction guide states its coverage as two bullets
  # rather than named pattern rows ("can perform all exclusive and shared
  # operations" / "cannot perform other roles' exclusive operations"), so the
  # claim types below are `role_can_perform_permitted_operations` and
  # `role_cannot_perform_others_exclusive_operations`. The declared
  # complexity_profile.role_model is `segregation_of_duties`, which supplies the
  # `segregation_of_duties` claim type; the `peer_roles` row is used for the two
  # entity_backed roles of §1.7, which are peers of one another even though the
  # scaffold's headline role model is segregation of duties.
  - section: rbac
    instances:

      - name: the_board_alone_drives_registration_standing_and_the_reporting_sweep
        claim_type: role_can_perform_permitted_operations
        grounds:
          - roles.BoardAdmin.exclusive_operations
          - roles.BoardAdmin.shared_operations
          - endpoints[POST /cle/providers]
          - endpoints[POST /cle/attorneys]
          - endpoints[POST /cle/attorneys/{id}/status-changes]
          - endpoints[POST /cle/reporting-sweeps]
          - endpoints[POST /_clock/set_current_utc]
