# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Perfusion Services & Cardiopulmonary Bypass Case Coverage — 20 instances
# across the nine section 0.5 difficulty rules.
#
# Shared fixture conventions used by every chain below:
#   * The logical clock is 2026-08-01T00:00:00Z until a call moves it.
#   * Contract rates: per_case_fee_cents 400000, prolonged_pump_threshold_minutes
#     180, prolonged_surcharge_pct 0.15, disposable_discount_pct 0.10,
#     disposable_markup_pct 0.20, monthly_coverage_fee_cents 1200000.
#   * Preference card lines A_OXYGENATOR/B_TUBING_PACK/C_CANNULA_SET at
#     1055 / 1155 / 1255 cents, quantity 1 each.
#   * PRIMARY_CALL slot [2026-08-01T00:00:00Z, 2026-08-04T00:00:00Z) on the
#     assigned perfusionist plus a BACKUP_CALL slot on a second perfusionist
#     put the contract at coverage_posture COVERED (4320 of 4320 primary
#     minutes, 2880 backup minutes >= 2160).
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: case_fee_provisional_vs_final_diverges_on_actual_pump_time
        grounds:
          - calculations.case_fee_settlement
          - entities.BypassCase.fields.provisional_fee_cents
          - entities.BypassCase.fields.final_fee_cents
          - entities.BypassCase.fields.accrued_fee_cents
          - entities.HospitalContract.fields.accrued_case_fee_cents
          - state_machines.BypassCase.SCHEDULED_to_STAFFED
          - state_machines.BypassCase.OFF_BYPASS_to_CLOSED
        distinguishing_aspect: |
          This instance is the money-accounting half of the dual-variant pair: the PROVISIONAL
          variant prices the case from the preference card's standard_pump_minutes (150, below
          the 180-minute prolonged threshold, 0 surcharge units) while the FINAL variant prices
          the identical case from the reported pump_time_minutes (210, 2 surcharge units), so the
          same BypassCase row yields 400000 cents at assignment and 520000 cents at close and the
          contract ledger absorbs exactly the 120000-cent delta.
        test_recipe:
          setup:
            - "One HospitalContract at per_case_fee_cents 400000 with prolonged threshold 180 minutes and surcharge 0.15."
            - "One ACTIVE PreferenceCard for (surgeon, CABG) with standard_pump_minutes 150."
            - "One ACTIVE perfusionist with career_case_count 150, a CCP certification ACTIVE for 2026, and 20 SUBMITTED CE credit hours, giving ADMISSION readiness 0.694."
            - "A PRIMARY_CALL slot covering the case window and a BACKUP_CALL slot on a second perfusionist, so coverage_posture is COVERED."
            - "One ELECTIVE BypassCase scheduled [2026-08-02T06:00:00Z, 2026-08-02T12:00:00Z), bypass_status SCHEDULED, billing_status UNBILLED."
          setup_api_calls:
            - call: "POST /hospital-contracts"
              payload: { hospital_name: "St Aldate Cardiac Center", staffing_model: "COVERAGE_PLUS_PER_CASE", per_case_fee_cents: 400000, ecmo_hourly_fee_cents: 90000, monthly_case_cap: 5, monthly_coverage_fee_cents: 1200000, prolonged_surcharge_pct: 0.15, prolonged_pump_threshold_minutes: 180, disposable_markup_pct: 0.20, disposable_discount_pct: 0.10 }
              as: ContractAdmin
              captures: { c1: $.data.id }
            - call: "POST /surgeons"
              payload: { full_name: "Dr Imani Cole", npi_code: "NPI-3300110", specialty: "ADULT_CARDIAC" }
              as: ContractAdmin
              captures: { s1: $.data.id }
            - call: "POST /preference-cards"
              payload: { surgeon_id: "${s1}", procedure_type: "CABG", standard_pump_minutes: 150, prime_volume_ml: 1500, pack_line_items: [ { line_code: "A_OXYGENATOR", quantity: 1, unit_cost_cents: 1055 }, { line_code: "B_TUBING_PACK", quantity: 1, unit_cost_cents: 1155 }, { line_code: "C_CANNULA_SET", quantity: 1, unit_cost_cents: 1255 } ], required_safety_check_codes: ["ACT_BASELINE", "CIRCUIT_INTEGRITY", "GAS_LINE"], blood_management_protocol: "STANDARD", min_hematocrit_pct: 22, revision: 1 }
              as: Surgeon
              as_user_id: "${s1}"
              captures: { pc1: $.data.id }
            - call: "POST /perfusionists"
              payload: { full_name: "Rafe Mbeki", employee_code: "EMP-1001", ecmo_privileged: true, career_case_count: 150 }
              as: ContractAdmin
              captures: { p1: $.data.id }
            - call: "POST /perfusionists"
              payload: { full_name: "Nadia Oyelaran", employee_code: "EMP-1002", is_chief: true, career_case_count: 200 }
              as: ContractAdmin
              captures: { chief: $.data.id }
            - call: "POST /perfusionists"
              payload: { full_name: "Tom Vasquez", employee_code: "EMP-1003", ecmo_privileged: true, career_case_count: 90 }
              as: ContractAdmin
              captures: { p2: $.data.id }
            - call: "POST /perfusionists/${p1}/certifications"
              payload: { cert_code: "CCP", issued_on: "2026-01-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z", cycle_credit_requirement: 45 }
              as: ContractAdmin
              captures: { cert1: $.data.id }
            - call: "POST /perfusionists/${p1}/ce-activities"
              payload: { category: "CLINICAL", credit_hours: 20, activity_date: "2026-03-01T00:00:00Z", accreditation_body: "ABCP" }
              as: ContractAdmin
              captures: { ce1: $.data.id }
            - call: "POST /perfusion-devices"
              payload: { contract_id: "${c1}", asset_tag: "HLM-002", device_class: "HEART_LUNG_MACHINE" }
              as: BiomedTech
              captures: { d2: $.data.id }
            - call: "POST /perfusion-devices"
              payload: { contract_id: "${c1}", asset_tag: "HLM-001", device_class: "HEART_LUNG_MACHINE", backup_device_id: "${d2}" }
              as: BiomedTech
              captures: { d1: $.data.id }
            - call: "POST /call-rotation-slots"
              payload: { contract_id: "${c1}", perfusionist_id: "${p1}", slot_type: "PRIMARY_CALL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-04T00:00:00Z" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
              captures: { slot_p1: $.data.id }
            - call: "POST /call-rotation-slots"
              payload: { contract_id: "${c1}", perfusionist_id: "${p2}", slot_type: "BACKUP_CALL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-03T00:00:00Z" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
              captures: { slot_p2: $.data.id }
            - call: "POST /bypass-cases"
              payload: { contract_id: "${c1}", surgeon_id: "${s1}", procedure_type: "CABG", scheduled_start: "2026-08-02T06:00:00Z", scheduled_end: "2026-08-02T12:00:00Z", acuity: "ELECTIVE" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
              captures: { case1: $.data.id, case1_v: $.data.version }
          trigger:
            - call: "POST /bypass-cases/${case1}/assign-perfusionist"
              payload: { perfusionist_id: "${p1}", expected_case_version: "${case1_v}" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
              captures: { prov_fee: $.data.provisional_fee_cents }
            - call: "POST /bypass-cases/${case1}/disposable-packs"
              payload: { primary_device_id: "${d1}" }
              as: Perfusionist
              as_user_id: "${p1}"
              captures: { pack1: $.data.id }
            - call: "POST /bypass-cases/${case1}/pump-checklists"
              payload: { check_results: [ { check_code: "ACT_BASELINE", passed: true, note: "3.2 units heparin" }, { check_code: "CIRCUIT_INTEGRITY", passed: true, note: "no leak" }, { check_code: "GAS_LINE", passed: true, note: "blender ok" } ], blood_management_protocol: "STANDARD", hematocrit_pct: 26 }
              as: Perfusionist
              as_user_id: "${p1}"
              captures: { chk1: $.data.id }
            - call: "POST /pump-checklists/${chk1}/verify"
              payload: { }
              as: Perfusionist
              as_user_id: "${p1}"
            - call: "POST /bypass-cases/${case1}/start-bypass"
              payload: { }
              as: Perfusionist
              as_user_id: "${p1}"
            - call: "POST /bypass-cases/${case1}/end-bypass"
              payload: { pump_time_minutes: 210, cross_clamp_minutes: 95, lowest_hematocrit_pct: 24, adverse_event_count: 0 }
              as: Perfusionist
              as_user_id: "${p1}"
            - call: "POST /bypass-cases/${case1}/close"
              payload: { }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
          assert:
            - "BypassCase.${case1}.provisional_fee_cents == 400000"
            - "BypassCase.${case1}.final_fee_cents == 520000"
            - "BypassCase.${case1}.final_fee_cents - BypassCase.${case1}.provisional_fee_cents == 120000"
            - "BypassCase.${case1}.accrued_fee_cents == 520000"
            - "BypassCase.${case1}.billing_status == FINAL_ACCRUED"
            - "HospitalContract.${c1}.accrued_case_fee_cents == 520000"
            - "HospitalContract.${c1}.accrued_case_count == 1"

      - name: readiness_admission_counts_pending_ce_audit_does_not
        grounds:
          - calculations.perfusionist_readiness_score
          - entities.Perfusionist.fields.ce_credits_verified
          - entities.Perfusionist.fields.ce_credits_pending
          - entities.Perfusionist.fields.readiness_score
          - entities.Perfusionist.fields.readiness_variant_last
          - entities.IncidentReport.fields.reviewed_readiness_score
          - state_machines.IncidentReport.SUBMITTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          This instance is the risk-scoring half of the dual-variant pair and sits on a different
          entity domain (Perfusionist competence, not BypassCase money): with 27.0 VERIFIED and
          9.0 SUBMITTED credit hours against a 45-hour cycle and career_case_count 130, the
          ADMISSION variant scores 0.830 because it counts pending credits while the AUDIT
          variant frozen onto the incident report scores 0.720 because it counts verified credits
          only — a 0.110 divergence from byte-identical stored data.
        test_recipe:
          setup:
            - "Same contract, surgeon, preference card, devices and rotation slots as the shared fixture."
            - "The assigned perfusionist has career_case_count 130 and a CCP certification with cycle_credit_requirement 45."
            - "That perfusionist has three CE activities inside the cycle: 20.0 and 7.0 credit hours VERIFIED (ce_credits_verified 27.0) and 9.0 credit hours still SUBMITTED (ce_credits_pending 9.0)."
            - "One case has been assigned, packed, verified, taken on and off bypass, and an incident report naming that perfusionist has been filed by a second perfusionist and submitted."
            - "The logical clock has never moved, so consecutive_case_count_24h and ecmo_hours_rolling_7d are both 0 (bypass_started_at equals the clock and the fatigue window is half-open)."
          setup_api_calls:
            - call: "POST /hospital-contracts"
              payload: { hospital_name: "St Aldate Cardiac Center", staffing_model: "COVERAGE_PLUS_PER_CASE", per_case_fee_cents: 400000, ecmo_hourly_fee_cents: 90000, monthly_case_cap: 5, monthly_coverage_fee_cents: 1200000, prolonged_surcharge_pct: 0.15, prolonged_pump_threshold_minutes: 180, disposable_markup_pct: 0.20, disposable_discount_pct: 0.10 }
              as: ContractAdmin
              captures: { c1: $.data.id }
            - call: "POST /surgeons"
              payload: { full_name: "Dr Imani Cole", npi_code: "NPI-3300110", specialty: "ADULT_CARDIAC" }
              as: ContractAdmin
              captures: { s1: $.data.id }
            - call: "POST /preference-cards"
              payload: { surgeon_id: "${s1}", procedure_type: "CABG", standard_pump_minutes: 150, prime_volume_ml: 1500, pack_line_items: [ { line_code: "A_OXYGENATOR", quantity: 1, unit_cost_cents: 1055 }, { line_code: "B_TUBING_PACK", quantity: 1, unit_cost_cents: 1155 }, { line_code: "C_CANNULA_SET", quantity: 1, unit_cost_cents: 1255 } ], required_safety_check_codes: ["ACT_BASELINE", "CIRCUIT_INTEGRITY", "GAS_LINE"], blood_management_protocol: "STANDARD", min_hematocrit_pct: 22, revision: 1 }
              as: Surgeon
              as_user_id: "${s1}"
              captures: { pc1: $.data.id }
            - call: "POST /perfusionists"
              payload: { full_name: "Rafe Mbeki", employee_code: "EMP-1001", ecmo_privileged: true, career_case_count: 130 }
              as: ContractAdmin
              captures: { p1: $.data.id }
            - call: "POST /perfusionists"
              payload: { full_name: "Nadia Oyelaran", employee_code: "EMP-1002", is_chief: true, career_case_count: 200 }
              as: ContractAdmin
              captures: { chief: $.data.id }
            - call: "POST /perfusionists"
              payload: { full_name: "Tom Vasquez", employee_code: "EMP-1003", ecmo_privileged: true, career_case_count: 90 }
              as: ContractAdmin
              captures: { p2: $.data.id }
            - call: "POST /perfusionists/${p1}/certifications"
              payload: { cert_code: "CCP", issued_on: "2026-01-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z", cycle_credit_requirement: 45 }
              as: ContractAdmin
              captures: { cert1: $.data.id }
            - call: "POST /perfusionists/${p1}/ce-activities"
              payload: { category: "CLINICAL", credit_hours: 20, activity_date: "2026-02-01T00:00:00Z", accreditation_body: "ABCP" }
              as: ContractAdmin
              captures: { ce_a: $.data.id }
            - call: "POST /ce-activities/${ce_a}/verification"
              payload: { decision: "VERIFIED" }
              as: ContractAdmin
            - call: "POST /perfusionists/${p1}/ce-activities"
              payload: { category: "TECHNICAL", credit_hours: 7, activity_date: "2026-03-01T00:00:00Z", accreditation_body: "AMSECT" }
              as: ContractAdmin
              captures: { ce_b: $.data.id }
            - call: "POST /ce-activities/${ce_b}/verification"
              payload: { decision: "VERIFIED" }
              as: ContractAdmin
            - call: "POST /perfusionists/${p1}/ce-activities"
              payload: { category: "SAFETY", credit_hours: 9, activity_date: "2026-04-01T00:00:00Z", accreditation_body: "ABCP" }
              as: ContractAdmin
              captures: { ce_c: $.data.id }
            - call: "POST /perfusion-devices"
              payload: { contract_id: "${c1}", asset_tag: "HLM-002", device_class: "HEART_LUNG_MACHINE" }
              as: BiomedTech
              captures: { d2: $.data.id }
            - call: "POST /perfusion-devices"
              payload: { contract_id: "${c1}", asset_tag: "HLM-001", device_class: "HEART_LUNG_MACHINE", backup_device_id: "${d2}" }
              as: BiomedTech
              captures: { d1: $.data.id }
            - call: "POST /call-rotation-slots"
              payload: { contract_id: "${c1}", perfusionist_id: "${p1}", slot_type: "PRIMARY_CALL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-04T00:00:00Z" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
              captures: { slot_p1: $.data.id }
            - call: "POST /call-rotation-slots"
              payload: { contract_id: "${c1}", perfusionist_id: "${p2}", slot_type: "BACKUP_CALL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-03T00:00:00Z" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
              captures: { slot_p2: $.data.id }
            - call: "POST /bypass-cases"
              payload: { contract_id: "${c1}", surgeon_id: "${s1}", procedure_type: "CABG", scheduled_start: "2026-08-02T06:00:00Z", scheduled_end: "2026-08-02T12:00:00Z", acuity: "ELECTIVE" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
              captures: { case1: $.data.id, case1_v: $.data.version }
            - call: "POST /bypass-cases/${case1}/assign-perfusionist"
              payload: { perfusionist_id: "${p1}", expected_case_version: "${case1_v}" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
              captures: { adm_score: $.data.id }
            - call: "POST /bypass-cases/${case1}/disposable-packs"
              payload: { primary_device_id: "${d1}" }
              as: Perfusionist
              as_user_id: "${p1}"
              captures: { pack1: $.data.id }
            - call: "POST /bypass-cases/${case1}/pump-checklists"
              payload: { check_results: [ { check_code: "ACT_BASELINE", passed: true, note: "ok" }, { check_code: "CIRCUIT_INTEGRITY", passed: true, note: "ok" }, { check_code: "GAS_LINE", passed: true, note: "ok" } ], blood_management_protocol: "STANDARD", hematocrit_pct: 26 }
              as: Perfusionist
              as_user_id: "${p1}"
              captures: { chk1: $.data.id }
            - call: "POST /pump-checklists/${chk1}/verify"
              payload: { }
              as: Perfusionist
              as_user_id: "${p1}"
            - call: "POST /bypass-cases/${case1}/start-bypass"
              payload: { }
              as: Perfusionist
              as_user_id: "${p1}"
            - call: "POST /bypass-cases/${case1}/end-bypass"
              payload: { pump_time_minutes: 210, cross_clamp_minutes: 95, lowest_hematocrit_pct: 24, adverse_event_count: 1 }
              as: Perfusionist
              as_user_id: "${p1}"
            - call: "POST /incident-reports"
              payload: { case_id: "${case1}", involved_perfusionist_id: "${p1}", severity: "MAJOR", category: "GAS_EXCHANGE", narrative: "Oxygenator gas transfer degraded during rewarming." }
              as: Perfusionist
              as_user_id: "${p2}"
              captures: { inc1: $.data.id }
            - call: "POST /incident-reports/${inc1}/submit"
              payload: { }
              as: Perfusionist
              as_user_id: "${p2}"
          trigger:
            - call: "POST /incident-reports/${inc1}/review"
              payload: { decision: "ACCEPT_FOR_REVIEW", review_note: "quality review opened" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
              captures: { audit_score: $.data.reviewed_readiness_score }
          assert:
            - "Perfusionist.${p1}.ce_credits_verified == 27.0"
            - "Perfusionist.${p1}.ce_credits_pending == 9.0"
            - "Perfusionist.${p1}.readiness_score == 0.830"
            - "Perfusionist.${p1}.readiness_variant_last == ADMISSION"
            - "IncidentReport.${inc1}.reviewed_readiness_score == 0.720"
            - "${audit_score} == 0.720 and Perfusionist.${p1}.readiness_score - IncidentReport.${inc1}.reviewed_readiness_score == 0.110"
            - "IncidentReport.${inc1}.status == UNDER_REVIEW"

  - rule_id: combinatorial_formula
    instances:
      - name: pack_cost_rounds_per_line_then_sums
        grounds:
          - calculations.disposable_pack_cost
          - entities.DisposablePack.fields.line_items
          - entities.DisposablePack.fields.pack_cost_cents
          - entities.DisposablePack.fields.applied_preference_card_id
          - entities.HospitalContract.fields.disposable_discount_pct
          - entities.HospitalContract.fields.disposable_markup_pct
        distinguishing_aspect: |
          Mode (b), rounding order: three pack lines each priced 1055 / 1155 / 1255 cents run through
          discount 0.10 then markup 0.20, giving unrounded 1139.4 / 1247.4 / 1355.4. Rounding PER LINE
          (the normative order) yields 1139 + 1247 + 1355 = 3741, while rounding the summed 3742.2
          yields 3742 — a one-cent gap that is only reachable if the implementation applies
          ROUND_HALF_UP at the line, not at the aggregate. Nothing about thresholds or evaluation
          order is exercised here, only the rounding boundary.
        test_recipe:
          setup:
            - "Contract with disposable_discount_pct 0.10 and disposable_markup_pct 0.20."
            - "One ACTIVE preference card with exactly three pack lines at 1055, 1155 and 1255 cents, quantity 1 each."
            - "One STAFFED ELECTIVE case with an available primary device that has a backup device."
          setup_api_calls:
            - call: "POST /hospital-contracts"
              payload: { hospital_name: "St Aldate Cardiac Center", staffing_model: "COVERAGE_PLUS_PER_CASE", per_case_fee_cents: 400000, ecmo_hourly_fee_cents: 90000, monthly_case_cap: 5, monthly_coverage_fee_cents: 1200000, prolonged_surcharge_pct: 0.15, prolonged_pump_threshold_minutes: 180, disposable_markup_pct: 0.20, disposable_discount_pct: 0.10 }
