  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      # ---------------------------------------------------------------- 1 / 2 --
      - name: contract_suspend_four_link_cascade_offering_session_assignment_ledger
        depth: 4
        grounds:
          - state_machines.ClientContract.ACTIVE_to_SUSPENDED
          - state_machines.ProgramOffering.ACTIVE_to_PAUSED
          - state_machines.ProgramSession.STAFFED_to_CANCELLED_CLIENT
          - state_machines.StaffAssignment.CONFIRMED_to_RELEASED
          - entities.StaffMember.fields.committed_minutes_current_period
          - calculations.program_attainment
        distinguishing_aspect: |
          Trigger: POST /client-contracts/{id}/service-status with action == SUSPEND.
          LINK 1 pauses the ACTIVE offering; the PAUSE — not the suspension — is
          what cancels that offering's open sessions (LINK 2); each cancellation is
          what releases that session's assignments (LINK 3); and each release is
          what decrements the holder's committed_minutes_current_period and forces
          calculations.program_attainment to drop the vanished forecast (LINK 4).
          Removing any middle link changes the observable tail, so the chain cannot
          be faked by a fan-out from the contract row.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; ACTIVE COST_PLUS contract with Studio A OPEN and a READY AED."
            - "One ACTIVE offering (participation_target 4) with one SCHEDULED session on 2026-08-05 12:00-12:55Z, forecast_attendance 3, and a CONFIRMED LEAD assignment so the session sits in STAFFED and the instructor's committed_minutes_current_period is 70."
            - "No invoice exists in DRAFT or DISPUTED, so suspension is not blocked by the fiscal guard."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OperatorAdmin
            - call: "POST /client-contracts"
              payload: { client_name: "Northwind Manufacturing", site_code: "NWM-01", fee_structure: "COST_PLUS", staffing_model: "OPERATOR_EMPLOYED", budgeted_staff_fte: 3.5, participation_target_pct: 35, term_start_on: "2026-07-01", term_end_on: "2027-06-30", not_to_exceed_cents: 5000000 }
