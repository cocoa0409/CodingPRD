              captures: { e_empty: $.data.error_id }
            - call: "POST /compliance/routing-guides/${g_id}/requirements"
              payload: { requirement_code: "LBL-01", domain: "LABELING", severity_tier: "TIER_1", min_evidence_count: 2, fixed_fee_cents: 25000, per_unit_recovery_cents: 30, handling_pct: 2.00, min_fee_cents: 30000, cap_cents: 40000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
