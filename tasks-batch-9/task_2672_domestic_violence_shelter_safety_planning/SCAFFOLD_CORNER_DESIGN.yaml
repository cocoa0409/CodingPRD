  - section: calculations
    instances:
      - name: hmis_export_projection_releases_only_the_five_allowed_keys
        claim_type: correct_result
        grounds:
          - calculations.disclosure_field_projection
          - endpoints[POST /disclosure-events/{id}/decide]
          - state_machines.DisclosureEvent.REQUESTED_to_PARTIALLY_RELEASED
        distinguishing_aspect: |
          The HMIS_EXPORT allow-list is exactly five keys, so a six-key request splits 3/3 and both
          arrays come back in KEY_VOCABULARY order rather than request order: released
          [client_code, household_size, entry_date] and suppressed [legal_name,
          shelter_street_address, hotline_call_transcript], status PARTIALLY_RELEASED.
        test_recipe:
          setup:
            - "One HotlineAdvocate (Rosa Marin) and one PrivacyOfficer (Opal Reed) exist."
            - "Client C-3001 was created with hmis_disclosure_consent GRANTED and is in confidentiality_posture NORMAL."
            - "A REQUESTED HMIS_EXPORT disclosure event asks for six keys in a deliberately scrambled order: hotline_call_transcript, client_code, shelter_street_address, entry_date, legal_name, household_size."
            - "The logical clock is at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /staff-members"
              payload: { full_name: "Opal Reed", role_type: "PRIVACY_OFFICER", max_caseload: 12 }
              as: AgencyAdmin
              captures: { po_id: "$.data.id" }
            - call: "POST /clients"
              payload: { client_code: "C-3001", legal_name: "Ada Verne", household_size: 3, minor_children_count: 1, accessibility_required: false, location_confidential: true, hmis_disclosure_consent: "GRANTED" }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_id: "$.data.id", client_v: "$.data.version" }
            - call: "POST /disclosure-events"
              payload: { client_id: "${client_id}", requested_by_staff_id: "${adv_id}", kind: "HMIS_EXPORT", requester_org: "Regional Continuum of Care", requested_field_keys: ["hotline_call_transcript", "client_code", "shelter_street_address", "entry_date", "legal_name", "household_size"] }
              as: PrivacyOfficer
              as_user_id: "${po_id}"
              captures: { de_id: "$.data.id" }
          trigger:
            - call: "POST /disclosure-events/${de_id}/decide"
              payload: { decision: "RELEASE" }
              as: PrivacyOfficer
              as_user_id: "${po_id}"
          assert:
            - "HTTP 200 and DisclosureEvent.${de_id}.status == PARTIALLY_RELEASED"
            - "released_field_keys == [client_code, household_size, entry_date] - exactly the requested keys inside the five-key HMIS allow-list, in KEY_VOCABULARY order"
            - "suppressed_field_keys == [legal_name, shelter_street_address, hotline_call_transcript] - also in KEY_VOCABULARY order, not the scrambled request order"
            - "decided_by_staff_id == ${po_id}, decided_at == 2026-08-01T00:00:00.000Z, late_filed == false and decision_deadline_utc == null"
            - "Client.${client_id}.confidentiality_posture == NORMAL and version == ${client_v} + 1: a RELEASE decision never seals, only a DENIED HMIS_EXPORT does"

      - name: corroborating_facts_exclude_reserved_admissions_and_undisposed_calls
        claim_type: input_set_filtering
        grounds:
          - calculations.lethality_danger_score.input_set
          - calculations.lethality_danger_score.variants.CORROBORATED_REVIEW
        distinguishing_aspect: |
          The CORROBORATED_REVIEW variant counts only CHECKED_IN or EXITED admissions and disposed
          calls. With one RESERVED admission and one still-RECEIVED sibling call on the record,
          corroborating_fact_count is 0 and the score stays 44.0 * 1.10 = 48.4 - the same as the
          INTAKE_SNAPSHOT read - even though the flag was set to true.
        test_recipe:
          setup:
            - "One HotlineAdvocate (Rosa Marin) and one ShelterManager (Dana Whit) exist."
            - "Shelter Cedar House has one STANDARD unit A1 of bed_capacity 4."
            - "Client C-3002 (household_size 2, minor_children_count 0) holds a RESERVED admission on A1 for [2026-08-07, 2026-08-12) and has no protective-order case."
            - "The client has a second HotlineCall that is still in status RECEIVED and awaiting assessment."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /staff-members"
              payload: { full_name: "Dana Whit", role_type: "SHELTER_MANAGER", max_caseload: 20 }
              as: AgencyAdmin
              captures: { mgr_id: "$.data.id" }
            - call: "POST /shelters"
              payload: { name: "Cedar House", confidential_location: true, nightly_rate_cents: 8500, weekend_surcharge_cents: 2500, child_supplement_cents: 1200 }
              as: ShelterManager
              as_user_id: "${mgr_id}"
              captures: { shelter_id: "$.data.id" }
            - call: "POST /shelters/${shelter_id}/units"
              payload: { unit_label: "A1", unit_type: "STANDARD", bed_capacity: 4 }
              as: ShelterManager
              as_user_id: "${mgr_id}"
              captures: { unit_id: "$.data.id" }
            - call: "POST /clients"
              payload: { client_code: "C-3002", legal_name: "Bess Crow", household_size: 2, minor_children_count: 0, accessibility_required: false, location_confidential: true }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_id: "$.data.id" }
            - call: "POST /hotline-calls"
              payload: { client_id: "${client_id}", caller_type: "SURVIVOR", presenting_concerns: "First call, needs a bed." }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { call1: "$.data.id" }
            - call: "POST /hotline-calls/${call1}/risk-assessments"
              payload: { weapon_access: true, strangulation_history: false, separation_recent: true, threats_to_kill: false, stalking_frequency_per_week: 2 }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
            - call: "POST /screening-requests"
              payload: { client_id: "${client_id}", hotline_call_id: "${call1}", requested_shelter_id: "${shelter_id}", requested_entry_date: "2026-08-07" }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { sr_id: "$.data.id" }
            - call: "POST /screening-requests/${sr_id}/decide"
              payload: { decision: "APPROVE", assigned_advocate_id: "${adv_id}" }
              as: ShelterManager
              as_user_id: "${mgr_id}"
            - call: "GET /shelter-units/${unit_id}"
              payload: {}
              as: ShelterManager
              as_user_id: "${mgr_id}"
              captures: { unit_v: "$.data.version" }
            - call: "POST /shelter-admissions"
              payload: { screening_request_id: "${sr_id}", shelter_unit_id: "${unit_id}", entry_date: "2026-08-07", planned_exit_date: "2026-08-12", expected_shelter_unit_version: "${unit_v}" }
              as: ShelterManager
              as_user_id: "${mgr_id}"
              captures: { adm_id: "$.data.id" }
            - call: "POST /hotline-calls"
              payload: { client_id: "${client_id}", caller_type: "SURVIVOR", presenting_concerns: "Second call, situation worsened." }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { call2: "$.data.id" }
          trigger:
            - call: "POST /hotline-calls/${call2}/risk-assessments"
              payload: { weapon_access: true, strangulation_history: false, separation_recent: true, threats_to_kill: false, stalking_frequency_per_week: 2, corroborate_with_history: true }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
          assert:
            - "variant_applied == CORROBORATED_REVIEW (the flag selects the variant) but corroborating_fact_count == 0"
            - "The RESERVED admission ${adm_id} is outside the input set, and so is the RECEIVED sibling call, so base_subtotal == 44.0 with no 6-point bonus"
            - "escalation_multiplier == 1.10 and danger_score == 48.4 with risk_band == MODERATE"
            - "Client.${client_id}.current_danger_score == 48.4: had the admission been CHECKED_IN the same call would have scored (44 + 6) * 1.10 == 55.0 and banded ELEVATED"

      - name: stalking_cap_limits_factor_points_at_seven_events
        claim_type: constants_applied
        grounds:
          - calculations.lethality_danger_score.constants.STALKING_CAP
          - calculations.lethality_danger_score.constants.STALKING_POINTS_PER_EVENT
        distinguishing_aspect: |
          STALKING_CAP 7 truncates the stalking term: 12 events and 7 events both contribute
          2 * 7 = 14 points, and with no co-factor present escalation_multiplier stays 1.00, so both
          clients score exactly 14.0 and band LOW.
        test_recipe:
          setup:
            - "One HotlineAdvocate (Rosa Marin) exists."
            - "Clients C-3003 and C-3004 each have one HotlineCall in status RECEIVED and no other history."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /clients"
              payload: { client_code: "C-3003", legal_name: "Cleo Nash", household_size: 2, minor_children_count: 0, accessibility_required: false, location_confidential: true }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_a: "$.data.id" }
            - call: "POST /hotline-calls"
              payload: { client_id: "${client_a}", caller_type: "SURVIVOR", presenting_concerns: "He follows her almost every day." }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { call_a: "$.data.id" }
            - call: "POST /clients"
              payload: { client_code: "C-3004", legal_name: "Dora Pike", household_size: 2, minor_children_count: 0, accessibility_required: false, location_confidential: true }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_b: "$.data.id" }
            - call: "POST /hotline-calls"
              payload: { client_id: "${client_b}", caller_type: "SURVIVOR", presenting_concerns: "He waits outside work once a day." }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { call_b: "$.data.id" }
          trigger:
            - call: "POST /hotline-calls/${call_a}/risk-assessments"
              payload: { weapon_access: false, strangulation_history: false, separation_recent: false, threats_to_kill: false, stalking_frequency_per_week: 12 }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { score_a: "$.data.danger_score" }
            - call: "POST /hotline-calls/${call_b}/risk-assessments"
              payload: { weapon_access: false, strangulation_history: false, separation_recent: false, threats_to_kill: false, stalking_frequency_per_week: 7 }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { score_b: "$.data.danger_score" }
          assert:
            - "${score_a} == 14.0 and ${score_b} == 14.0: 12 events and 7 events both cap at 2 * 7 == 14"
            - "Both rows carry base_subtotal == 14.0, escalation_multiplier == 1.00 and risk_band == LOW"
            - "Client.${client_a}.current_risk_band == LOW and Client.${client_b}.current_risk_band == LOW, both with confidentiality_posture NORMAL"

      - name: danger_score_rounds_half_up_at_the_hundredths_boundary
        claim_type: precision
        grounds:
          - calculations.lethality_danger_score.precision
          - calculations.lethality_danger_score.constants.BOTH_COFACTOR_MULTIPLIER
        distinguishing_aspect: |
          Both co-factors with no other points give base_subtotal 45 and multiplier 1.25, i.e. an
          exact 56.25 that must round half up to 56.3 at one decimal - banker's rounding would
          produce 56.2 and truncation 56.2, so the value discriminates the rounding mode.
        test_recipe:
          setup:
            - "One HotlineAdvocate (Rosa Marin) and Client C-3005 exist."
            - "The client has one HotlineCall in status RECEIVED."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /clients"
              payload: { client_code: "C-3005", legal_name: "Elsa Trent", household_size: 2, minor_children_count: 0, accessibility_required: false, location_confidential: true }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_id: "$.data.id" }
            - call: "POST /hotline-calls"
              payload: { client_id: "${client_id}", caller_type: "SURVIVOR", presenting_concerns: "He keeps a pistol and has choked her before." }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { call_id: "$.data.id" }
          trigger:
            - call: "POST /hotline-calls/${call_id}/risk-assessments"
              payload: { weapon_access: true, strangulation_history: true, separation_recent: false, threats_to_kill: false, stalking_frequency_per_week: 0 }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { score: "$.data.danger_score" }
          assert:
            - "base_subtotal == 45.0 and escalation_multiplier == 1.25 (both co-factors present)"
            - "${score} == 56.3, the round_half_up of the exact 56.25 - not 56.2"
            - "risk_band == ELEVATED (56.3 is at or above BAND_ELEVATED_MIN 50.0 and below BAND_IMMINENT_MIN 75.0)"
            - "Client.${client_id}.current_danger_score == 56.3 and confidentiality_posture == NORMAL (only IMMINENT lifts it to HEIGHTENED)"

      - name: wellness_check_contribution_decays_at_the_seven_and_thirty_day_marks
        claim_type: decay_function
        grounds:
          - calculations.staff_caseload_and_trauma_index
          - endpoints[POST /staff-members/{id}/wellness-checks]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          The decay curve is a step function keyed to whole days: the same 70.0-point check reads
          70.0 at day 7 (factor 1.0), 42.0 at day 8 (factor 0.6) and 0.0 at day 31 (factor 0.0),
          flipping the posture FROZEN, RESTRICTED, OPEN without any new check being filed.
        test_recipe:
          setup:
            - "One HotlineAdvocate (Rosa Marin) exists with no assigned screening requests, so active_caseload_count is 0."
            - "A single WellnessCheck dated 2026-08-01T00:00:00Z records distress_scale 10, exposure_hours 20.0 and no debrief."
            - "The logical clock is at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /staff-members/${adv_id}/wellness-checks"
              payload: { checked_on_utc: "2026-08-01T00:00:00Z", exposure_hours: 20.0, distress_scale: 10, debrief_completed: false }
              as: AgencyAdmin
              captures: { points: "$.data.contribution_points" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: AgencyAdmin
              captures: { restaffed_day7: "$.data.restaffed_posture_count" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T00:00:00Z" }
              as: AgencyAdmin
              captures: { restaffed_day8: "$.data.restaffed_posture_count" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AgencyAdmin
              captures: { restaffed_day31: "$.data.restaffed_posture_count" }
          assert:
            - "${points} == 70.0 == (10 * 6 + 20.0 * 0.5) with no debrief mitigation, and at creation StaffMember.${adv_id}.secondary_trauma_index == 70.0 with wellness_posture FROZEN"
            - "Day 7 (2026-08-08): decay factor 1.0 keeps secondary_trauma_index == 70.0 and wellness_posture FROZEN, so ${restaffed_day7} == 0"
            - "Day 8 (2026-08-09): decay factor 0.6 gives secondary_trauma_index == 42.0 and wellness_posture RESTRICTED, so ${restaffed_day8} == 1"
            - "Day 31 (2026-09-01): decay factor 0.0 gives secondary_trauma_index == 0.0 and wellness_posture OPEN, so ${restaffed_day31} == 1"
            - "The WellnessCheck row itself never changes: contribution_points stays 70.0 and the row carries no version field"
            - "expired_screening_request_count == 0 on all three clock calls, since no WAITLISTED request exists"

      - name: mandated_report_decided_after_the_deadline_sets_late_filed
        claim_type: projection
        grounds:
          - entities.DisclosureEvent.fields.decision_deadline_utc
          - entities.DisclosureEvent.fields.late_filed
          - calculations.disclosure_field_projection
        distinguishing_aspect: |
          MANDATED_REPORT is the only kind that gets a decision_deadline_utc (created_at + 24h) and
          the only kind whose allow-list is the full vocabulary: a decision one second past the
          deadline is still RELEASED with an empty suppressed set, but late_filed flips to true.
        test_recipe:
          setup:
            - "One HotlineAdvocate (Rosa Marin) and one PrivacyOfficer (Opal Reed) exist."
            - "Client C-3006 is in confidentiality_posture NORMAL."
            - "A REQUESTED MANDATED_REPORT disclosure event created at 2026-08-01T00:00:00Z asks for hotline_call_transcript, legal_name and shelter_street_address, and carries no release of information."
            - "The logical clock has been advanced to 2026-08-02T00:00:01Z, one second past the 24-hour deadline."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /staff-members"
              payload: { full_name: "Opal Reed", role_type: "PRIVACY_OFFICER", max_caseload: 12 }
              as: AgencyAdmin
              captures: { po_id: "$.data.id" }
            - call: "POST /clients"
              payload: { client_code: "C-3006", legal_name: "Fay Orwell", household_size: 3, minor_children_count: 1, accessibility_required: false, location_confidential: true }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_id: "$.data.id" }
            - call: "POST /disclosure-events"
              payload: { client_id: "${client_id}", requested_by_staff_id: "${adv_id}", kind: "MANDATED_REPORT", requester_org: "County Child Protection", requested_field_keys: ["hotline_call_transcript", "legal_name", "shelter_street_address"] }
              as: PrivacyOfficer
              as_user_id: "${po_id}"
              captures: { de_id: "$.data.id", deadline: "$.data.decision_deadline_utc" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:01Z" }
              as: AgencyAdmin
          trigger:
            - call: "POST /disclosure-events/${de_id}/decide"
              payload: { decision: "RELEASE" }
              as: PrivacyOfficer
              as_user_id: "${po_id}"
          assert:
            - "${deadline} == 2026-08-02T00:00:00.000Z, exactly created_at plus 24 hours"
            - "HTTP 200 with status == RELEASED: MANDATED_REPORT allows the whole vocabulary, so suppressed_field_keys == []"
            - "released_field_keys == [legal_name, shelter_street_address, hotline_call_transcript] in KEY_VOCABULARY order"
            - "late_filed == true because decided_at == 2026-08-02T00:00:01.000Z is strictly after the deadline"
            - "No ERR_ROI_EXPIRED is raised even though roi_signed_on and roi_expires_on are both null: MANDATED_REPORT needs no release of information"

      - name: sealed_posture_outranks_heightened_when_both_conditions_hold
        claim_type: constraint_propagation
        grounds:
          - calculations.client_confidentiality_posture
          - state_machines.DisclosureEvent.REQUESTED_to_DENIED
        distinguishing_aspect: |
          The posture rule is evaluated strictly sealed, then heightened, then normal. An IMMINENT
          client already reads HEIGHTENED; a DENIED HMIS_EXPORT then makes the sealed predicate
          true and the posture must jump to SEALED rather than staying HEIGHTENED.
        test_recipe:
          setup:
            - "One HotlineAdvocate (Rosa Marin) and one PrivacyOfficer (Opal Reed) exist."
            - "Client C-3007 (hmis_disclosure_consent DENIED) has a risk assessment scoring the 100.0 ceiling, so current_risk_band is IMMINENT and confidentiality_posture is HEIGHTENED."
            - "A REQUESTED HMIS_EXPORT disclosure event asks for client_code and household_size."
            - "The client has no shelter admission at all, so the only path into SEALED is the denied export."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /staff-members"
              payload: { full_name: "Opal Reed", role_type: "PRIVACY_OFFICER", max_caseload: 12 }
              as: AgencyAdmin
              captures: { po_id: "$.data.id" }
            - call: "POST /clients"
              payload: { client_code: "C-3007", legal_name: "Gwen Halle", household_size: 2, minor_children_count: 0, accessibility_required: false, location_confidential: true, hmis_disclosure_consent: "DENIED" }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_id: "$.data.id" }
            - call: "POST /hotline-calls"
              payload: { client_id: "${client_id}", caller_type: "SURVIVOR", presenting_concerns: "Strangled last night, gun in the house, said he would kill her." }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { call_id: "$.data.id" }
            - call: "POST /hotline-calls/${call_id}/risk-assessments"
              payload: { weapon_access: true, strangulation_history: true, separation_recent: true, threats_to_kill: true, stalking_frequency_per_week: 8 }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { score: "$.data.danger_score" }
            - call: "POST /disclosure-events"
              payload: { client_id: "${client_id}", requested_by_staff_id: "${adv_id}", kind: "HMIS_EXPORT", requester_org: "Regional Continuum of Care", requested_field_keys: ["client_code", "household_size"] }
              as: PrivacyOfficer
              as_user_id: "${po_id}"
              captures: { de_id: "$.data.id" }
          trigger:
            - call: "POST /disclosure-events/${de_id}/decide"
              payload: { decision: "DENY", denial_reason: "No signed consent for homeless-data-system participation." }
              as: PrivacyOfficer
              as_user_id: "${po_id}"
          assert:
            - "${score} == 100.0: base_subtotal 92.0 times 1.25 is 115.0, capped by SCORE_CEILING, and the stalking term is capped at 2 * 7 == 14"
            - "Before the decide the client read current_risk_band IMMINENT with confidentiality_posture HEIGHTENED"
            - "DisclosureEvent.${de_id}.status == DENIED with released_field_keys == [] and suppressed_field_keys == [client_code, household_size]"
            - "Client.${client_id}.confidentiality_posture == SEALED after the decide, even though current_risk_band is still IMMINENT - sealed outranks heightened"
            - "Client.${client_id}.hmis_disclosure_consent is still DENIED and protective_order_active is still false"

      - name: threshold_landlord_tier_boundaries_applied
        claim_type: threshold
        grounds:
          - calculations.landlord_engagement_incentive.constants
        excluded_because:
          difficulty_instance: combinatorial_formula / landlord_incentive_tier_pinned_to_pre_commit_score
          rationale: "That instance walks two matches across the BASE and SILVER boundaries and asserts the pinned pre-commit tier read."

      - name: chronological_settled_walk_charges_only_real_weekend_nights
        claim_type: chronological
        grounds:
          - calculations.shelter_stay_cost.variants.SETTLED
        excluded_because:
          difficulty_instance: dual_variant_calc / stay_cost_projected_vs_settled_on_shelter_admission
          rationale: "That instance asserts the calendar walk finds two surcharge nights for 59500 against the projected estimate of 57000."

      - name: aggregation_running_bed_totals_correct_after_reversal
        claim_type: aggregation
        grounds:
          - calculations.unit_bed_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / bed_ledger_fully_restored_after_reservation_cancel
          rationale: "That instance asserts the aggregate before the write, after the write and after the reversal."

      - name: weighted_scoring_rounding_does_not_drift_across_components
        claim_type: weighted_scoring
        grounds:
          - calculations.safety_plan_coverage_score.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / coverage_score_rounds_per_component_then_sums
          rationale: "That instance pins the round-then-sum order with the 1.76 versus 1.75 discriminator."

      - name: variant_divergence_same_inputs_two_risk_scores
        claim_type: variant_divergence
        grounds:
          - calculations.lethality_danger_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / risk_scoring_variant_divergence_on_risk_assessment
          rationale: "That instance asserts 48.4 MODERATE against 55.0 ELEVATED on identical factor inputs with a 6.6 delta."

      - name: variant_selection_and_reconciliation_of_stay_cost
        claim_type: variant_selection
        grounds:
          - calculations.shelter_stay_cost.variants
          - entities.Shelter.fields.settled_revenue_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / stay_cost_projected_vs_settled_on_shelter_admission
          rationale: "That instance asserts PROJECTED is stored at create and left untouched while SETTLED lands at exit and is the only figure added to Shelter.settled_revenue_cents."

  - section: validations
    instances:
      - name: duplicate_client_code_and_duplicate_unit_label_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 84]
          - errors[ERR_DUPLICATE_RESOURCE]
        distinguishing_aspect: |
          One rule guards three different uniqueness scopes. client_code is unique agency-wide and
          unit_label is unique only within its shelter, so the same label in a second shelter is
          accepted while a repeat inside the same shelter is 409 ERR_DUPLICATE_RESOURCE.
        test_recipe:
          setup:
            - "One HotlineAdvocate (Rosa Marin) and one ShelterManager (Dana Whit) exist."
            - "Client C-4001 exists and Shelter Cedar House already has a unit labelled A1."
            - "A second shelter, Birch House, has no units yet."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /staff-members"
              payload: { full_name: "Dana Whit", role_type: "SHELTER_MANAGER", max_caseload: 20 }
              as: AgencyAdmin
              captures: { mgr_id: "$.data.id" }
            - call: "POST /clients"
              payload: { client_code: "C-4001", legal_name: "Hope Lyle", household_size: 2, minor_children_count: 0, accessibility_required: false, location_confidential: true }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_id: "$.data.id" }
            - call: "POST /shelters"
              payload: { name: "Cedar House", confidential_location: true, nightly_rate_cents: 8500, weekend_surcharge_cents: 2500, child_supplement_cents: 1200 }
              as: ShelterManager
              as_user_id: "${mgr_id}"
              captures: { shelter_a: "$.data.id" }
            - call: "POST /shelters/${shelter_a}/units"
              payload: { unit_label: "A1", unit_type: "STANDARD", bed_capacity: 4 }
              as: ShelterManager
              as_user_id: "${mgr_id}"
              captures: { unit_a1: "$.data.id" }
            - call: "POST /shelters"
              payload: { name: "Birch House", confidential_location: true, nightly_rate_cents: 8000 }
              as: ShelterManager
              as_user_id: "${mgr_id}"
              captures: { shelter_b: "$.data.id" }
          trigger:
            - call: "POST /clients"
              payload: { client_code: "C-4001", legal_name: "Different Person", household_size: 3 }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { err_code: "$.data.error_id" }
            - call: "POST /shelters/${shelter_a}/units"
              payload: { unit_label: "A1", unit_type: "FAMILY_SUITE", bed_capacity: 3 }
              as: ShelterManager
              as_user_id: "${mgr_id}"
              captures: { err_label: "$.data.error_id" }
            - call: "POST /shelters/${shelter_b}/units"
              payload: { unit_label: "A1", unit_type: "STANDARD", bed_capacity: 2 }
              as: ShelterManager
              as_user_id: "${mgr_id}"
              captures: { ok_unit: "$.data.id" }
          assert:
            - "Call 1: HTTP 409 and ${err_code} == ERR_DUPLICATE_RESOURCE; Client ${client_id} is untouched with legal_name Hope Lyle"
            - "Call 2: HTTP 409 and ${err_label} == ERR_DUPLICATE_RESOURCE; unit ${unit_a1} keeps unit_type STANDARD and bed_capacity 4"
            - "Call 3: HTTP 201 - the label A1 is free inside Birch House, so ${ok_unit} exists with bed_capacity 2"
            - "Shelter.${shelter_a}.total_bed_capacity == 4 and Shelter.${shelter_b}.total_bed_capacity == 2"

      - name: second_component_of_the_same_type_on_one_plan_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 84]
          - entities.PlanComponent.fields.component_type
        distinguishing_aspect: |
          The uniqueness scope is the pair (safety_plan_id, component_type): a second COMMUNICATION
          component on the same plan is 409 and, critically, the plan's coverage_score stays at the
          single-component value 0.88 rather than doubling.
        test_recipe:
          setup:
            - "One HotlineAdvocate (Rosa Marin) and Client C-4002 exist."
            - "The client's call was disposed SAFETY_PLAN_ONLY, creating one DRAFT SafetyPlan, and one DRAFT COMMUNICATION component has been added (coverage_score 0.88)."
            - "The client's current_risk_band is MODERATE, so no IMMINENT uplift applies."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /clients"
              payload: { client_code: "C-4002", legal_name: "Iris Penn", household_size: 2, minor_children_count: 0, accessibility_required: false, location_confidential: true }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_id: "$.data.id" }
            - call: "POST /hotline-calls"
              payload: { client_id: "${client_id}", caller_type: "SURVIVOR", presenting_concerns: "Wants a communication plan for the children's school." }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { call_id: "$.data.id" }
            - call: "POST /hotline-calls/${call_id}/risk-assessments"
              payload: { weapon_access: true, strangulation_history: false, separation_recent: true, threats_to_kill: false, stalking_frequency_per_week: 2 }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
            - call: "POST /hotline-calls/${call_id}/dispose"
              payload: { disposition: "SAFETY_PLAN_ONLY" }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
            - call: "GET /safety-plans"
              payload: { client_id: "${client_id}", limit: 10, offset: 0 }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { plan_id: "$.data[0].id" }
            - call: "POST /safety-plans/${plan_id}/components"
              payload: { component_type: "COMMUNICATION", detail: "Prepaid phone kept at her sister's flat.", target_completion_date: "2026-08-20" }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { comp_id: "$.data.id", subscore: "$.data.subscore" }
          trigger:
            - call: "POST /safety-plans/${plan_id}/components"
              payload: { component_type: "COMMUNICATION", detail: "A second phone, duplicate entry.", target_completion_date: "2026-08-22" }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 and ${err} == ERR_DUPLICATE_RESOURCE"
            - "${subscore} == 0.88 == round_half_up(25 * 0.35 / 10, 2) and SafetyPlan.${plan_id}.coverage_score is still 0.88"
            - "GET /safety-plans/${plan_id}/components returns total_count == 1 with the surviving row ${comp_id} in status DRAFT"
            - "SafetyPlan.${plan_id}.version is unchanged by the rejected call"

      - name: referral_subsidy_type_must_match_the_partner_and_is_rejected_otherwise
        claim_type: violation_to_error
        grounds:
          - validations[priority 74]
          - errors[ERR_SUBSIDY_TYPE_MISMATCH]
        distinguishing_aspect: |
          Subsidy compatibility is checked at referral creation, after the active-plan gate at
          priority 72: with an ACTIVE plan in place, a HOUSING_CHOICE_VOUCHER referral to a partner
          that accepts only RAPID_REHOUSING_SUBSIDY is 422, and the same body with the matching
          subsidy is accepted.
        test_recipe:
          setup:
            - "One HotlineAdvocate (Rosa Marin) and one HousingSpecialist (Omar Diaz) exist."
            - "Client C-4003 has exactly one ACTIVE SafetyPlan holding one DRAFT RELOCATION component (coverage_score 1.05)."
            - "LandlordPartner Vista Rentals pledges 4 units, accepts RAPID_REHOUSING_SUBSIDY and has base_incentive_cents 40000."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
