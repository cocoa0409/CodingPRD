scenario: |
  User-Generated Experience Economy, Developer Payouts & Age Ratings (Roblox): creator publishing pipeline with automated and human moderation of experiences, assets and text, virtual currency economy where purchases fund creator earnings with exchange rates and payout eligibility, developer exchange program requiring identity verification, minimum balances and tax documentation, experience age guidelines with content descriptors and access restrictions by account age, parental controls and spending limits with account age verification, marketplace item creation, resale and limited-item scarcity mechanics, moderation appeals and creator account termination with earnings disposition, safety systems for chat filtering and reporting

domain_name: uge-economy-payouts-age
api_prefix: /ugc

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - selector_policy
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - polymorphic
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: User
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no type prefix" }
      - { name: username, type: string, source: input, description: "Unique handle 3-20 chars, [A-Za-z0-9_]" }
      - { name: email, type: string, source: input, description: "Contact email; used for identity verification" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD); drives computed age_band and account_age_tier" }
      - { name: parent_user_id, type: string, source: input, description: "FK -> User.id; null when not linked; for users under 13 must point to a User whose computed age_band is ADULT (18+) and whose own parent_user_id is null", constraints: "nullable; must reference an existing User with age_band == ADULT and parent_user_id == null" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED", constraints: "enum" }
      - { name: age_band, type: enum, source: computed, description: "Computed at creation and again whenever the platform clock crosses the user's birthday: CHILD (<13), TEEN (13-17), ADULT (>=18). Triggers cascades to parental controls, chat filtering, payout eligibility, and content access.", constraints: "enum: CHILD | TEEN | ADULT" }
      - { name: account_age_days, type: integer, source: computed, description: "Floor of (current_utc - created_at) / 86400. Used to gate DevEx eligibility (>= 30 days) and limited-item resale (>= 7 days)." }
      - { name: robux_balance, type: integer, source: computed, description: "Liquid Robux balance: sum of completed CurrencyPurchaseOrder.credited_robux minus sum of completed PurchaseOrder.debited_robux minus sum of completed ResalePurchase.price_robux * (1 - marketplace_fee_pct) debited to seller minus sum of completed DevExchangeRequest.debited_robux. Never allowed negative; a debit that would drive it negative is rejected with ERR_INSUFFICIENT_ROBUX." }
      - { name: earned_robux_lifetime, type: integer, source: computed, description: "Cumulative Robux credited from creator earnings (experience engagement payouts + marketplace sales + resale royalties). Drives DevEx tier eligibility." }
      - { name: is_devex_eligible, type: boolean, source: computed, description: "Derived flag: status == ACTIVE AND age_band == ADULT AND identity_verification.status == VERIFIED AND tax_document.status == ACCEPTED AND account_age_days >= 30 AND earned_robux_lifetime >= 30000." }
      - { name: chat_filter_level, type: enum, source: computed, description: "SAFE (age_band==CHILD or parental_controls.chat_mode==RESTRICTED), STANDARD (TEEN), or ADULT (ADULT and no parental override). Computed whenever age_band or parental controls change." }
      - { name: suspension_reason, type: string, source: system, description: "Populated when status transitions to SUSPENDED; cleared on reinstate" }
      - { name: terminated_at, type: datetime, source: system, description: "Set on transition to TERMINATED; immutable thereafter" }

  - name: IdentityVerification
    parent: User
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: user_id, type: string, source: system, description: "FK -> User.id" }
      - { name: status, type: enum, source: system, description: "PENDING | VERIFIED | REJECTED | EXPIRED", constraints: "enum" }
      - { name: document_type, type: enum, source: input, description: "PASSPORT | DRIVERS_LICENSE | NATIONAL_ID", constraints: "enum" }
      - { name: document_country, type: string, source: input, description: "ISO 3166-1 alpha-2" }
      - { name: submitted_at, type: datetime, source: system, description: "Set at creation" }
      - { name: reviewed_at, type: datetime, source: system, description: "Set when status leaves PENDING" }
      - { name: rejection_reason, type: string, source: system, description: "Required when status==REJECTED" }
      - { name: expiry_date, type: datetime, source: input, description: "Document expiry; EXPIRED transition fires when current_utc > expiry_date" }

  - name: TaxDocument
    parent: User
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: user_id, type: string, source: system, description: "FK -> User.id" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | ACCEPTED | REJECTED", constraints: "enum" }
      - { name: form_type, type: enum, source: input, description: "W9 | W8BEN | W8BENE", constraints: "enum" }
      - { name: tin_last4, type: string, source: input, description: "Last four of taxpayer identification number" }
      - { name: legal_name, type: string, source: input, description: "Name on tax record" }
      - { name: country_of_residence, type: string, source: input, description: "ISO 3166-1 alpha-2" }
      - { name: submitted_at, type: datetime, source: system, description: "Set at creation" }
      - { name: reviewed_at, type: datetime, source: system, description: "Set on transition out of UNDER_REVIEW" }
      - { name: rejection_reason, type: string, source: system, description: "Required when status==REJECTED" }

  - name: ParentalControls
    parent: User
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: child_user_id, type: string, source: system, description: "FK -> User.id; one row per child; the parent's User.id is implicit via X-User-ID" }
      - { name: monthly_spend_limit_robux, type: integer, source: input, description: "Hard cap on total PurchaseOrder debits per calendar month for the child; null means no cap. A debit that would exceed this cap is rejected with ERR_PARENTAL_SPEND_LIMIT." , default: null }
      - { name: chat_mode, type: enum, source: input, description: "RESTRICTED (no free-text), FILTERED (server-side lexical filter), OPEN (no extra restriction beyond age_band)", constraints: "enum: RESTRICTED | FILTERED | OPEN", default: "FILTERED" }
      - { name: allowed_age_ratings, type: array, source: input, description: "Whitelist of ExperienceAgeRating levels the child may join; subset of [ALL, NINE_PLUS, THIRTEEN_PLUS, SEVENTEEN_PLUS]. Empty array means inherit age_band defaults.", default: [] }
      - { name: pin_hash, type: string, source: input, description: "bcrypt-style hash of a 4-digit PIN required to change these settings" }
      - { name: last_changed_at, type: datetime, source: system, description: "Timestamp of last mutation" }

  - name: Experience
    parent: User
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: creator_user_id, type: string, source: system, description: "FK -> User.id; the owning creator" }
      - { name: title, type: string, source: input, description: "3-60 chars" }
      - { name: description, type: string, source: input, description: "Free text; subject to chat filter when age_band of viewer is CHILD" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_REVIEW | PUBLISHED | SUSPENDED | ARCHIVED", constraints: "enum" }
      - { name: age_rating, type: enum, source: computed, description: "ALL | NINE_PLUS | THIRTEEN_PLUS | SEVENTEEN_PLUS; assigned by the moderation pipeline (auto-assessed then confirmed/overridden by human review). A creator may appeal the assigned rating via ModerationAppeal.", constraints: "enum" }
      - { name: content_descriptors, type: array, source: system, description: "Set of descriptor codes attached by moderation, e.g. [VIOLENCE_MILD, GAMBLING_SIMULATED, ALCOHOL_REFERENCE]. Drives age_rating computation." }
      - { name: visit_count_lifetime, type: integer, source: computed, description: "Total JoinSession events" }
      - { name: engagement_minutes_30d, type: integer, source: computed, description: "Rolling 30-day sum of session minutes; recomputed daily by the engagement sweep" }
      - { name: engagement_payout_pending_robux, type: integer, source: computed, description: "Robux accrued but not yet credited to creator; settled daily by the engagement sweep into earned_robux_lifetime" }
      - { name: suspended_reason, type: string, source: system, description: "Populated on SUSPENDED" }
      - { name: archived_at, type: datetime, source: system, description: "Set on ARCHIVED; terminal" }

  - name: ExperienceAgeRating
    parent: Experience
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: experience_id, type: string, source: system, description: "FK -> Experience.id" }
      - { name: rating, type: enum, source: system, description: "ALL | NINE_PLUS | THIRTEEN_PLUS | SEVENTEEN_PLUS" }
      - { name: descriptors, type: array, source: system, description: "Final descriptor set after review" }
      - { name: assigned_by, type: enum, source: system, description: "AUTOMATED | HUMAN | APPEAL_DECISION" }
      - { name: assigned_at, type: datetime, source: system, description: "Timestamp" }
      - { name: supersedes_id, type: string, source: system, description: "FK -> ExperienceAgeRating.id; null for the first rating" }
      - { name: is_current, type: boolean, source: computed, description: "True for the rating row with the maximum assigned_at for this experience; used by access control" }

  - name: ModerationSubmission
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: subject_type, type: enum, source: input, description: "EXPERIENCE | ASSET | TEXT", constraints: "enum" }
      - { name: subject_id, type: string, source: input, description: "Polymorphic FK: Experience.id when subject_type==EXPERIENCE, MarketplaceItem.id when ASSET, ChatMessage.id when TEXT" }
      - { name: submitted_by_user_id, type: string, source: system, description: "FK -> User.id; reporter or creator" }
      - { name: status, type: enum, source: system, description: "QUEUED | AUTO_REVIEWED | HUMAN_REVIEW | APPROVED | REJECTED | ESCALATED", constraints: "enum" }
      - { name: automated_score, type: number, source: computed, description: "0.0-1.0 risk score from the automated classifier; >= 0.85 triggers auto-reject, <= 0.10 triggers auto-approve, otherwise HUMAN_REVIEW" }
      - { name: reviewer_user_id, type: string, source: system, description: "FK -> User.id of the human reviewer; set on HUMAN_REVIEW -> APPROVED/REJECTED/ESCALATED" }
      - { name: decision, type: enum, source: system, description: "APPROVE | REJECT | ESCALATE; null until reviewer acts", constraints: "nullable enum" }
      - { name: decided_at, type: datetime, source: system, description: "Set when status leaves HUMAN_REVIEW" }

  - name: ModerationAppeal
    parent: ModerationSubmission
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: submission_id, type: string, source: system, description: "FK -> ModerationSubmission.id; must be REJECTED at appeal time" }
      - { name: appellant_user_id, type: string, source: system, description: "FK -> User.id" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | UPHELD | OVERTURNED | WITHDRAWN", constraints: "enum" }
      - { name: reason, type: string, source: input, description: "Free text 10-2000 chars" }
      - { name: reviewer_user_id, type: string, source: system, description: "FK -> User.id of appeals reviewer; MUST differ from original reviewer_user_id (segregation of duties)" }
      - { name: decided_at, type: datetime, source: system, description: "Set on UPHELD/OVERTURNED" }

  - name: CurrencyPurchaseOrder
    parent: User
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: buyer_user_id, type: string, source: system, description: "FK -> User.id" }
      - { name: fiat_amount_cents, type: integer, source: input, description: "USD cents charged" }
      - { name: status, type: enum, source: system, description: "PENDING_PAYMENT | COMPLETED | FAILED | REFUNDED", constraints: "enum" }
      - { name: credited_robux, type: integer, source: computed, description: "Computed from the tiered exchange-rate table at the time of COMPLETED transition; NOT linear" }
      - { name: payment_method_token, type: string, source: input, description: "Opaque token" }
      - { name: idempotency_key, type: string, source: input, description: "Client-supplied; duplicate key returns the same order, not a new charge" }
      - { name: completed_at, type: datetime, source: system, description: "Set on COMPLETED" }

  - name: PurchaseOrder
    parent: User
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: buyer_user_id, type: string, source: system, description: "FK -> User.id" }
      - { name: item_type, type: enum, source: input, description: "MARKETPLACE_ITEM | EXPERIENCE_GAMEPASS | LIMITED_ITEM_RESALE", constraints: "enum" }
      - { name: item_id, type: string, source: input, description: "Polymorphic FK: MarketplaceItem.id or Experience.id (for gamepass) or ResaleListing.id" }
      - { name: status, type: enum, source: system, description: "PENDING | COMPLETED | REFUNDED | REVERSED", constraints: "enum" }
      - { name: price_robux, type: integer, source: input, description: "Robux charged to buyer" }
      - { name: creator_credit_robux, type: integer, source: computed, description: "Robux credited to the seller/creator after marketplace_fee_pct and (for limiteds) royalty_pct" }
      - { name: platform_fee_robux, type: integer, source: computed, description: "price_robux - creator_credit_robux; the platform's cut" }
      - { name: idempotency_key, type: string, source: input, description: "Client-supplied" }
      - { name: completed_at, type: datetime, source: system, description: "Set on COMPLETED" }

  - name: DevExchangeRequest
    parent: User
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: user_id, type: string, source: system, description: "FK -> User.id" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | PAID | REJECTED | CANCELLED", constraints: "enum" }
      - { name: requested_robux, type: integer, source: input, description: "Amount to convert; must be >= 30000 and <= earned_robux_lifetime - already_locked_robux" }
      - { name: locked_robux, type: integer, source: computed, description: "Robux locked on SUBMITTED; released on REJECTED/CANCELLED, debited on PAID" }
      - { name: usd_payout_cents, type: integer, source: computed, description: "Computed by the progressive DevEx rate ladder at APPROVED time; rounding pinned" }
      - { name: withholding_tax_cents, type: integer, source: computed, description: "Progressive tax withholding computed at APPROVED time using TaxDocument.form_type and country_of_residence" }
      - { name: net_payout_cents, type: integer, source: computed, description: "usd_payout_cents - withholding_tax_cents" }
      - { name: submitted_at, type: datetime, source: system, description: "Set at SUBMITTED" }
      - { name: approved_at, type: datetime, source: system, description: "Set at APPROVED" }
      - { name: paid_at, type: datetime, source: system, description: "Set at PAID" }
      - { name: expected_user_version, type: integer, source: input, description: "OCC field: the version of User the client last observed. Required on SUBMITTED." }

  - name: MarketplaceItem
    parent: User
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: creator_user_id, type: string, source: system, description: "FK -> User.id" }
      - { name: title, type: string, source: input, description: "3-60 chars" }
      - { name: item_kind, type: enum, source: input, description: "HAT | SHIRT | PANTS | GEAR | LIMITED_HAT | LIMITED_GEAR", constraints: "enum" }
      - { name: price_robux, type: integer, source: input, description: "Current listing price; for LIMITED_* kinds this is the initial sale price only (subsequent sales go through ResaleListing)" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_MODERATION | ON_SALE | OFF_SALE | MODERATION_REJECTED", constraints: "enum" }
      - { name: total_supply, type: integer, source: input, description: "For LIMITED_* kinds, the fixed mint count; for non-limited kinds must be null", constraints: "nullable integer; required when item_kind is LIMITED_*" }
      - { name: copies_sold, type: integer, source: computed, description: "Count of completed primary PurchaseOrders for this item" }
      - { name: is_limited, type: boolean, source: computed, description: "item_kind in {LIMITED_HAT, LIMITED_GEAR}" }
      - { name: royalty_pct, type: integer, source: input, description: "For limiteds, the percentage (0-50) of each resale that flows to the original creator on top of the marketplace fee; must be 0 for non-limiteds" }
      - { name: moderation_submission_id, type: string, source: system, description: "FK -> ModerationSubmission.id; set when status enters PENDING_MODERATION" }

  - name: ResaleListing
    parent: MarketplaceItem
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: item_id, type: string, source: system, description: "FK -> MarketplaceItem.id; must be a limited kind" }
      - { name: seller_user_id, type: string, source: system, description: "FK -> User.id" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SOLD | CANCELLED", constraints: "enum" }
      - { name: ask_price_robux, type: integer, source: input, description: "Listing price; must be >= floor(item.price_robux * 0.5) to prevent wash-trading below half the original price" }
      - { name: listed_at, type: datetime, source: system, description: "Set at creation" }
      - { name: sold_at, type: datetime, source: system, description: "Set on SOLD" }
      - { name: buyer_user_id, type: string, source: system, description: "FK -> User.id; set on SOLD" }
      - { name: expected_item_version, type: integer, source: input, description: "OCC field: version of the underlying MarketplaceItem last observed by the seller; guards against the item being delisted mid-listing" }

  - name: ChatMessage
    parent: Experience
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: experience_id, type: string, source: system, description: "FK -> Experience.id" }
      - { name: sender_user_id, type: string, source: system, description: "FK -> User.id" }
      - { name: body_raw, type: string, source: input, description: "Original text" }
      - { name: body_filtered, type: string, source: computed, description: "Text after applying the chat filter appropriate to the SENDER's chat_filter_level AND the strictest viewer's level. For SAFE, all digits and most punctuation are stripped; for STANDARD, a lexical blocklist applies; for ADULT, body_filtered == body_raw." }
      - { name: filter_applied, type: enum, source: computed, description: "SAFE | STANDARD | ADULT — echoes the level actually used" }
      - { name: was_reported, type: boolean, source: computed, description: "True once a Report against this message is filed" }
      - { name: sent_at, type: datetime, source: system, description: "Set at creation" }

  - name: Report
    parent: ChatMessage
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: message_id, type: string, source: system, description: "FK -> ChatMessage.id" }
      - { name: reporter_user_id, type: string, source: system, description: "FK -> User.id" }
      - { name: reason_code, type: enum, source: input, description: "HARASSMENT | SCAM | INAPPROPRIATE_CONTENT | PERSONAL_INFO | OTHER", constraints: "enum" }
      - { name: status, type: enum, source: system, description: "OPEN | TRIAGED | ACTIONED | DISMISSED", constraints: "enum" }
      - { name: triaged_by_user_id, type: string, source: system, description: "FK -> User.id of safety agent" }
      - { name: triaged_at, type: datetime, source: system, description: "Set on TRIAGED" }
      - { name: action_taken, type: enum, source: system, description: "NONE | WARNING | SUSPEND_SENDER | TERMINATE_SENDER", constraints: "nullable enum" }

  - name: AccountTermination
    parent: User
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: user_id, type: string, source: system, description: "FK -> User.id; the account being terminated" }
      - { name: initiated_by_user_id, type: string, source: system, description: "FK -> User.id; the admin or safety agent; MUST NOT equal user_id (segregation of duties)" }
      - { name: reason_code, type: enum, source: input, description: "FRAUD | SAFETY_VIOLATION | LEGAL_REQUEST | PARENT_REQUEST | SELF_REQUEST", constraints: "enum" }
      - { name: status, type: enum, source: system, description: "PENDING_DISPOSITION | EARNINGS_DISPOSED | COMPLETE", constraints: "enum" }
      - { name: earnings_disposition, type: enum, source: input, description: "FORFEIT_TO_PLATFORM | DONATE_TO_CHARITY | PAYOUT_TO_VERIFIED_USER. Required when reason_code != SELF_REQUEST.", constraints: "enum; FORFEIT_TO_PLATFORM or DONATE_TO_CHARITY only when reason_code in {FRAUD, SAFETY_VIOLATION, LEGAL_REQUEST}; PAYOUT_TO_VERIFIED_USER only when reason_code == SELF_REQUEST" }
      - { name: disposed_robux, type: integer, source: computed, description: "Earned Robux disposed of; set on EARNINGS_DISPOSED" }
      - { name: disposed_usd_cents, type: integer, source: computed, description: "USD equivalent at the DevEx ladder marginal rate; set on EARNINGS_DISPOSED" }
      - { name: terminated_at, type: datetime, source: system, description: "Set on COMPLETE" }

  - name: EngagementSnapshot
    parent: Experience
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: experience_id, type: string, source: system, description: "FK -> Experience.id" }
      - { name: snapshot_date, type: string, source: system, description: "ISO date of the daily sweep" }
      - { name: minutes_engaged, type: integer, source: input, description: "Minutes for the day; supplied by the sweep" }
      - { name: payout_robux, type: integer, source: computed, description: "Computed by the engagement-payout formula using tiered rates on minutes_engaged" }

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: actor_user_id, type: string, source: system, description: "FK -> User.id of actor; may be system user 00000000-0000-0000-0000-000000000000" }
      - { name: action, type: string, source: system, description: "Dot-notation action key, e.g. experience.publish, devex.approve" }
      - { name: subject_type, type: string, source: system, description: "Entity name" }
      - { name: subject_id, type: string, source: system, description: "Entity id" }
      - { name: payload, type: object, source: system, description: "Before/after snapshot fields relevant to the action" }
      - { name: at, type: datetime, source: system, description: "Server timestamp" }

state_machines:
  - entity: User
    field: status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /ugc/users/{id}/suspend or system (chat safety triage escalates)"
        actor: "PlatformAdmin or SafetyAgent or system"
        preconditions:
          - "Target user.status == ACTIVE"
          - "Actor role in {PlatformAdmin, SafetyAgent}"
        side_effects:
          - "All ACTIVE ResaleListings owned by the user -> CANCELLED"
          - "All PUBLISHED Experiences owned by the user -> SUSPENDED (cascade)"
          - "All SUBMITTED DevExchangeRequests for the user -> CANCELLED, locked_robux released"
          - "suspension_reason populated"
          - "AuditLog entry written"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /ugc/users/{id}/reinstate"
        actor: PlatformAdmin
        preconditions:
          - "Target user.status == SUSPENDED"
        side_effects:
          - "Experiences that were SUSPENDED by the cascade stay SUSPENDED; creator must re-publish each individually"
          - "suspension_reason cleared"
      - from: [ACTIVE, SUSPENDED]
        to: TERMINATED
        trigger: "system on AccountTermination transition to COMPLETE"
        actor: system
        preconditions:
          - "AccountTermination.status == EARNINGS_DISPOSED"
        side_effects:
          - "All child entities transition to their terminal state"
          - "terminated_at set"
          - "is_devex_eligible forced to false"

  - entity: Experience
    field: status
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: "POST /ugc/experiences/{id}/submit-for-review"
        actor: Creator
        preconditions:
          - "Creator owns the experience (creator_user_id == X-User-ID)"
          - "Creator.status == ACTIVE"
        side_effects:
          - "A ModerationSubmission(subject_type=EXPERIENCE, subject_id=experience.id) is created with status QUEUED"
      - from: PENDING_REVIEW
        to: PUBLISHED
        trigger: "system on ModerationSubmission.APPROVED"
        actor: system
        preconditions:
          - "ModerationSubmission.status == APPROVED"
        side_effects:
          - "ExperienceAgeRating row created from the submission's descriptor set, assigned_by=AUTOMATED or HUMAN"
          - "experience.age_rating <- new rating"
          - "If creator.age_band == CHILD and the assigned rating is SEVENTEEN_PLUS, transition is BLOCKED and the experience stays PENDING_REVIEW with ERR_CREATOR_AGE_INSUFFICIENT_FOR_RATING (cascade rule)"
      - from: PUBLISHED
        to: SUSPENDED
        trigger: "POST /ugc/experiences/{id}/suspend OR system on creator suspension OR system on ModerationSubmission.REJECTED for an update"
        actor: "PlatformAdmin or SafetyAgent or system"
        preconditions:
          - "status == PUBLISHED"
        side_effects:
          - "All in-flight ChatMessages in the experience are tombstoned (body_filtered='[removed]')"
          - "Active ResaleListings of MarketplaceItems associated with this experience are unaffected (different aggregate)"
      - from: SUSPENDED
        to: PUBLISHED
        trigger: "POST /ugc/experiences/{id}/republish"
        actor: Creator
        preconditions:
          - "Creator.status == ACTIVE"
          - "experience.status == SUSPENDED"
        side_effects: []
      - from: [DRAFT, PUBLISHED, SUSPENDED]
        to: ARCHIVED
        trigger: "POST /ugc/experiences/{id}/archive"
        actor: Creator
        preconditions:
          - "Creator owns the experience"
        side_effects:
          - "archived_at set"
          - "EngagementSnapshots stop accumulating; engagement_payout_pending_robux is settled to zero via a final sweep that credits the creator immediately (compensating invariant: pending payout is not lost on archive)"

  - entity: ModerationSubmission
    field: status
    initial_state: QUEUED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: QUEUED
        to: AUTO_REVIEWED
        trigger: "system on classifier completion"
        actor: system
        preconditions: []
        side_effects:
          - "automated_score computed"
          - "if automated_score >= 0.85 -> status = REJECTED (auto-reject branch, no human)"
          - "elif automated_score <= 0.10 -> status = APPROVED (auto-approve branch)"
          - "else -> status = HUMAN_REVIEW"
        note: "This is a fork-join: QUEUED -> AUTO_REVIEWED -> {APPROVED | REJECTED | HUMAN_REVIEW}. The AUTO_REVIEWED state is transient and immediately re-dispatched by the system."
      - from: HUMAN_REVIEW
        to: APPROVED
        trigger: "POST /ugc/moderation-submissions/{id}/decide with decision=APPROVE"
        actor: Moderator
        preconditions:
          - "ModerationSubmission.status == HUMAN_REVIEW"
          - "reviewer_user_id != submitted_by_user_id (segregation of duties)"
        side_effects:
          - "For subject_type=EXPERIENCE: Experience -> PUBLISHED with assigned rating"
          - "For subject_type=ASSET: MarketplaceItem -> ON_SALE"
          - "For subject_type=TEXT: ChatMessage.was_reported stays true; no further action"
      - from: HUMAN_REVIEW
        to: REJECTED
        trigger: "POST /ugc/moderation-submissions/{id}/decide with decision=REJECT"
        actor: Moderator
        preconditions:
          - "status == HUMAN_REVIEW"
          - "reviewer_user_id != submitted_by_user_id"
        side_effects:
          - "For subject_type=EXPERIENCE: Experience -> DRAFT (creator may edit and resubmit) if status was PENDING_REVIEW; if already PUBLISHED then Experience -> SUSPENDED"
          - "For subject_type=ASSET: MarketplaceItem -> MODERATION_REJECTED"
      - from: HUMAN_REVIEW
        to: ESCALATED
        trigger: "POST /ugc/moderation-submissions/{id}/decide with decision=ESCALATE"
        actor: Moderator
        preconditions: []
        side_effects:
          - "status returns to QUEUED with a higher-priority flag; a different Moderator picks it up (segregation: second reviewer_user_id must differ from first)"

  - entity: ModerationAppeal
    field: status
    initial_state: FILED
    terminal_states: [UPHELD, OVERTURNED, WITHDRAWN]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /ugc/moderation-appeals/{id}/start-review"
        actor: AppealsReviewer
        preconditions:
          - "appeals reviewer_user_id != original ModerationSubmission.reviewer_user_id"
        side_effects: []
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /ugc/moderation-appeals/{id}/decide with outcome=UPHELD"
        actor: AppealsReviewer
        preconditions: []
        side_effects:
          - "Original ModerationSubmission remains REJECTED"
      - from: UNDER_REVIEW
        to: OVERTURNED
        trigger: "POST /ugc/moderation-appeals/{id}/decide with outcome=OVERTURNED"
        actor: AppealsReviewer
        preconditions: []
        side_effects:
          - "Original ModerationSubmission.status -> APPROVED (retroactive)"
          - "Cascade: Experience/MarketplaceItem transition as if originally approved"
          - "If the subject is an Experience, an ExperienceAgeRating row with assigned_by=APPEAL_DECISION supersedes the prior one"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /ugc/moderation-appeals/{id}/withdraw"
        actor: Creator
        preconditions:
          - "appellant_user_id == X-User-ID"
        side_effects: []

  - entity: CurrencyPurchaseOrder
    field: status
    initial_state: PENDING_PAYMENT
    terminal_states: [COMPLETED, FAILED, REFUNDED]
    transitions:
      - from: PENDING_PAYMENT
        to: COMPLETED
        trigger: "POST /ugc/currency-purchase-orders/{id}/confirm-payment"
        actor: "Buyer or PaymentWebhook"
        preconditions:
          - "idempotency_key not previously completed"
        side_effects:
          - "credited_robux computed via tiered exchange-rate table (see calculations.currency_exchange_tiered)"
          - "buyer.robux_balance += credited_robux"
          - "completed_at set"
      - from: PENDING_PAYMENT
        to: FAILED
        trigger: "POST /ugc/currency-purchase-orders/{id}/fail-payment"
        actor: PaymentWebhook
        preconditions: []
        side_effects: []
      - from: COMPLETED
        to: REFUNDED
        trigger: "POST /ugc/currency-purchase-orders/{id}/refund"
        actor: PlatformAdmin
        preconditions:
          - "buyer.robux_balance >= credited_robux (cannot refund Robux already spent; otherwise ERR_REFUND_EXCEEDS_BALANCE)"
        side_effects:
          - "buyer.robux_balance -= credited_robux (compensating invariant: balance unchanged net of original purchase)"

  - entity: PurchaseOrder
    field: status
    initial_state: PENDING
    terminal_states: [COMPLETED, REFUNDED, REVERSED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /ugc/purchase-orders/{id}/confirm"
        actor: Buyer
        preconditions:
          - "buyer.robux_balance >= price_robux"
          - "ParentalControls check: if buyer has ParentalControls with monthly_spend_limit_robux set, the sum of this price_robux plus all COMPLETED PurchaseOrder.price_robux in the current calendar month must not exceed monthly_spend_limit_robux (>= comparison; exactly at the limit is REJECTED)"
          - "If item_type==LIMITED_ITEM_RESALE: ResaleListing.status == ACTIVE and the listed item's expected_item_version matches the item's current version (OCC)"
          - "Age-rating check: if item is a gamepass for an Experience, the buyer's age_band must be sufficient for experience.age_rating (see calculations.age_rating_access)"
        side_effects:
          - "buyer.robux_balance -= price_robux"
          - "creator_credit_robux and platform_fee_robux computed by marketplace split (see calculations.marketplace_split)"
          - "seller.earned_robux_lifetime += creator_credit_robux"
          - "For LIMITED_ITEM_RESALE: ResaleListing.status -> SOLD, item ownership transferred, original creator receives royalty_pct share on top of marketplace fee"
          - "completed_at set"
      - from: COMPLETED
        to: REFUNDED
        trigger: "POST /ugc/purchase-orders/{id}/refund"
        actor: PlatformAdmin
        preconditions:
          - "For LIMITED_ITEM_RESALE: buyer still owns the item"
        side_effects:
          - "buyer.robux_balance += price_robux"
          - "seller.earned_robux_lifetime -= creator_credit_robux (compensating invariant: seller's lifetime earned count returns to pre-purchase value)"
      - from: COMPLETED
        to: REVERSED
        trigger: "system on seller AccountTermination with earnings_disposition==FORFEIT_TO_PLATFORM within 30 days of completed_at"
        actor: system
        preconditions: []
        side_effects:
          - "creator_credit_robux clawed back; platform_fee_robux retained by platform"

  - entity: DevExchangeRequest
    field: status
    initial_state: SUBMITTED
    terminal_states: [PAID, REJECTED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /ugc/devex-requests/{id}/approve"
        actor: FinanceOfficer
        preconditions:
          - "user.is_devex_eligible == true at the moment of approval (recomputed)"
          - "expected_user_version matches user.version (OCC)"
        side_effects:
          - "usd_payout_cents computed via progressive DevEx ladder (see calculations.devex_progressive_ladder)"
          - "withholding_tax_cents computed via progressive withholding brackets keyed on TaxDocument.form_type"
          - "net_payout_cents = usd_payout_cents - withholding_tax_cents"
          - "approved_at set"
      - from: APPROVED
        to: PAID
        trigger: "POST /ugc/devex-requests/{id}/mark-paid"
        actor: FinanceOfficer
        preconditions:
          - "FinanceOfficer.user_id != the approving FinanceOfficer.user_id (segregation of duties: the same officer cannot approve and pay)"
        side_effects:
          - "user.robux_balance -= requested_robux (locked_robux becomes a real debit)"
          - "paid_at set"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /ugc/devex-requests/{id}/reject"
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "locked_robux released"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /ugc/devex-requests/{id}/cancel"
        actor: Creator
        preconditions:
          - "user_id == X-User-ID"
        side_effects:
          - "locked_robux released"

  - entity: MarketplaceItem
    field: status
    initial_state: DRAFT
    terminal_states: [MODERATION_REJECTED]
    transitions:
      - from: DRAFT
        to: PENDING_MODERATION
        trigger: "POST /ugc/marketplace-items/{id}/submit"
        actor: Creator
        preconditions:
          - "creator_user_id == X-User-ID"
          - "creator.status == ACTIVE"
        side_effects:
          - "ModerationSubmission(subject_type=ASSET) created"
      - from: PENDING_MODERATION
        to: ON_SALE
        trigger: "system on ModerationSubmission.APPROVED"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING_MODERATION
        to: MODERATION_REJECTED
        trigger: "system on ModerationSubmission.REJECTED"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_SALE
        to: OFF_SALE
        trigger: "POST /ugc/marketplace-items/{id}/take-off-sale"
        actor: Creator
        preconditions:
          - "creator_user_id == X-User-ID"
        side_effects:
          - "Active ResaleListings for this item remain ACTIVE (independent aggregate) but new listings cannot be created"
      - from: OFF_SALE
        to: ON_SALE
        trigger: "POST /ugc/marketplace-items/{id}/put-on-sale"
        actor: Creator
        preconditions: []
        side_effects: []

  - entity: ResaleListing
    field: status
    initial_state: ACTIVE
    terminal_states: [SOLD, CANCELLED]
    transitions:
      - from: ACTIVE
        to: SOLD
        trigger: "system on PurchaseOrder(item_type=LIMITED_ITEM_RESALE) COMPLETED for this listing"
        actor: system
        preconditions:
          - "seller.account_age_days >= 7 (resale account-age gate)"
          - "expected_item_version matches MarketplaceItem.version at the moment of sale (OCC)"
        side_effects:
          - "seller.robux_balance += ask_price_robux * (1 - marketplace_fee_pct) - royalty_share (see calculations.marketplace_split)"
          - "original creator earned_robux_lifetime += royalty_share"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /ugc/resale-listings/{id}/cancel"
        actor: Creator
        preconditions:
          - "seller_user_id == X-User-ID"
        side_effects: []

  - entity: AccountTermination
    field: status
    initial_state: PENDING_DISPOSITION
    terminal_states: [COMPLETE]
    transitions:
      - from: PENDING_DISPOSITION
        to: EARNINGS_DISPOSED
        trigger: "POST /ugc/account-terminations/{id}/dispose-earnings"
        actor: PlatformAdmin
        preconditions:
          - "initiated_by_user_id != user_id"
          - "earnings_disposition chosen and consistent with reason_code (see entity field constraints)"
          - "If earnings_disposition == PAYOUT_TO_VERIFIED_USER: target user.is_devex_eligible must be true"
        side_effects:
          - "disposed_robux = user.robux_balance at time of disposition"
          - "disposed_usd_cents computed via the DevEx ladder marginal rate on disposed_robux"
          - "user.robux_balance -> 0; earned_robux_lifetime is NOT reduced (historical record)"
          - "If PAYOUT_TO_VERIFIED_USER: a synthetic DevExchangeRequest in PAID state is created against the target user"
      - from: EARNINGS_DISPOSED
        to: COMPLETE
        trigger: "system once disposition side effects settle"
        actor: system
        preconditions: []
        side_effects:
          - "User.status -> TERMINATED (cascades from there)"

  - entity: Report
    field: status
    initial_state: OPEN
    terminal_states: [ACTIONED, DISMISSED]
    transitions:
      - from: OPEN
        to: TRIAGED
        trigger: "POST /ugc/reports/{id}/triage"
        actor: SafetyAgent
        preconditions: []
        side_effects:
          - "triaged_at set"
      - from: TRIAGED
        to: ACTIONED
        trigger: "POST /ugc/reports/{id}/action"
        actor: SafetyAgent
        preconditions:
          - "action_taken in {WARNING, SUSPEND_SENDER, TERMINATE_SENDER}"
        side_effects:
          - "If SUSPEND_SENDER: message.sender -> User.SUSPENDED (cascade)"
          - "If TERMINATE_SENDER: an AccountTermination row is created with reason_code=SAFETY_VIOLATION (cascade into the termination pipeline)"
          - "message.was_reported = true"
      - from: TRIAGED
        to: DISMISSED
        trigger: "POST /ugc/reports/{id}/dismiss"
        actor: SafetyAgent
        preconditions: []
        side_effects: []

concurrency_rules:
  - rule_id: devex-submit-stale-user-version
    parent_entity: User
    write_endpoint: "POST /ugc/devex-requests"
    occ_field: "expected_user_version"
    description: |
      Submitting a DevExchangeRequest against a User whose version has advanced
      since the client last observed it is rejected with 412. The cascade of
      marketplace sales, engagement payouts, and parental-control edits all bump
      user.version; a client whose snapshot of earned_robux_lifetime is stale
      would otherwise lock Robux against an out-of-date eligibility decision.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: resale-listing-stale-item-version
    parent_entity: MarketplaceItem
    write_endpoint: "POST /ugc/resale-listings"
    occ_field: "expected_item_version"
    description: |
      Creating a ResaleListing against a MarketplaceItem whose version has
      advanced since the client last observed it is rejected with 412. A price
      edit, take-off-sale / put-on-sale cycle, or a moderation-driven state
      change each bump item.version, and the listing's ask_price_robux floor
      (>= 0.5 * item.price_robux) depends on that observed price.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: age_band_compute
    trigger: "User creation and every platform clock advance that crosses the user's birthday"
    algorithm: threshold
    formula: |
      age_years = floor((current_utc - date_of_birth) / 365.2425 days)
      age_band = CHILD  if age_years < 13
                 TEEN   if 13 <= age_years < 18
                 ADULT  if age_years >= 18
      Boundary: a user whose 13th birthday is exactly current_utc (midnight) is TEEN (>= 13).
    constants:
      CHILD_MAX_AGE: 13
      ADULT_MIN_AGE: 18
    precision: "integer years, floor"

  - name: age_rating_access
    trigger: "Experience join, gamepass purchase, chat read"
    algorithm: threshold
    formula: |
      Required minimum band by rating:
        ALL            -> CHILD
        NINE_PLUS      -> CHILD if age_years >= 9 else forbidden
        THIRTEEN_PLUS  -> TEEN
        SEVENTEEN_PLUS -> ADULT
      Access allowed iff viewer's band >= required band, where CHILD < TEEN < ADULT.
      Boundary: a 17-year-old (TEEN) is DENIED a SEVENTEEN_PLUS experience (>= comparison against the band ordering, not against raw age).
    constants: {}

  - name: currency_exchange_tiered
    trigger: "CurrencyPurchaseOrder -> COMPLETED"
    algorithm: tiered_pricing
    formula: |
      credited_robux = sum over tiers of (fiat_cents_in_tier * tier.robux_per_cent)
      Tiers (applied to the fiat_amount_cents of THIS order, marginally):
        tier 1:   0 - 999 cents       -> 0.80 robux/cent
        tier 2:   1000 - 4999 cents   -> 0.90 robux/cent
        tier 3:   5000 - 19999 cents  -> 1.00 robux/cent
        tier 4:   >= 20000 cents      -> 1.10 robux/cent
      Round HALF_UP at the END on the aggregate, not per tier (mode (b): nested-rounding trap — pinned order is sum-then-round).
    constants:
      TIER1_RATE: 0.80
      TIER2_RATE: 0.90
      TIER3_RATE: 1.00
      TIER4_RATE: 1.10
    precision: "0 decimal places (integer Robux), round_half_up on the final aggregate only"
    variants:
      - name: promotional_bonus
        when: "The order carries an active promotion code (out of scope for the API surface; fixed example used by tests) that adds a flat 10% bonus on top of the tiered amount"
        difference: "credited_robux = round_half_up(tiered_amount * 1.10); the bonus is computed on the already-rounded tiered sum, not on the raw pre-round value"

  - name: marketplace_split
    trigger: "PurchaseOrder -> COMPLETED"
    algorithm: waterfall_allocation
    formula: |
      marketplace_fee_pct = 0.30
      For non-limited items:
        platform_fee_robux = round_half_up(price_robux * 0.30)
        creator_credit_robux = price_robux - platform_fee_robux
      For limited resales (waterfall — royalty is taken from the seller's share, not added on top):
        platform_fee_robux = round_half_up(price_robux * 0.30)
        gross_seller_share  = price_robux - platform_fee_robux
        royalty_robux       = round_half_up(gross_seller_share * item.royalty_pct / 100)
        creator_credit_robux (to reseller)  = gross_seller_share - royalty_robux
        creator_credit_robux (to original creator) = royalty_robux
      Rounding order pinned: fee first, then royalty from the post-fee share (mode (b) instance — round-then-allocate; doing royalty on gross price yields different cents).
    constants:
      MARKETPLACE_FEE_PCT: 0.30

  - name: devex_progressive_ladder
    trigger: "DevExchangeRequest -> APPROVED"
    algorithm: tiered_pricing
    formula: |
      usd_payout_cents = sum over brackets of (robux_in_bracket * bracket.usd_cents_per_robux)
      Brackets (applied marginally to requested_robux):
        bracket A:      0 - 30,000 robux        -> 0.35 cents/robux
        bracket B:      30,001 - 100,000 robux  -> 0.38 cents/robux
        bracket C:      100,001 - 1,000,000     -> 0.40 cents/robux
        bracket D:      >= 1,000,001            -> 0.42 cents/robux
      Evaluation order pinned (mode (c) circular-looking): the ladder is applied to requested_robux BEFORE any withholding, and the net_payout_cents = usd_payout_cents - withholding_tax_cents is computed AFTER, so the withholding never feeds back into the ladder bracket selection. Round HALF_UP only at the end.
    constants:
      BRACKET_A_RATE: 0.35
      BRACKET_B_RATE: 0.38
      BRACKET_C_RATE: 0.40
      BRACKET_D_RATE: 0.42

  - name: devex_withholding_progressive
    trigger: "DevExchangeRequest -> APPROVED"
    algorithm: tiered_pricing
    formula: |
      Withholding brackets depend on TaxDocument.form_type:
        W9 (US person):
          0 - 10,000 cents           -> 0%
          10,001 - 50,000 cents      -> 10%
          50,001 - 200,000 cents     -> 24%
          >= 200,001 cents           -> 30%
        W8BEN / W8BENE (non-US):
          flat 30% on the full usd_payout_cents (no brackets; treaty rates are out of scope)
      withholding_tax_cents = sum over brackets of (cents_in_bracket * rate)
      Round HALF_UP only at the end (mode (b) second instance — different rounding domain than currency_exchange_tiered).
      Evaluation order (mode (c)): brackets are applied against usd_payout_cents, NOT against net_payout_cents — using the net would be circular.
    constants: {}

  - name: engagement_payout
    trigger: "Daily engagement sweep on Experience"
    algorithm: forward_looking
    formula: |
      For an Experience with engagement_minutes_30d = M:
        payout_robux = floor(M / 60) * RATE_PER_HOUR
        RATE_PER_HOUR depends on the experience's age_rating:
          ALL            -> 2 robux/hour
          NINE_PLUS      -> 3 robux/hour
          THIRTEEN_PLUS  -> 4 robux/hour
          SEVENTEEN_PLUS -> 5 robux/hour
      payout_robux is accumulated into engagement_payout_pending_robux daily;
      on the 1st of each month the pending amount is credited to the creator's
      earned_robux_lifetime and pending is reset to zero (ops-run checkpoint).
    constants:
      RATE_ALL: 2
      RATE_NINE: 3
      RATE_THIRTEEN: 4
      RATE_SEVENTEEN: 5
    variants:
      - name: provisional_daily_estimate
        when: "Mid-month view used by the creator dashboard (read-only)"
        difference: "Shows floor(minutes_so_far / 60) * rate without committing; the committed credit happens only at the month boundary. Same input set, different output timing and rounding surface."

  - name: parental_monthly_spend_check
    trigger: "PurchaseOrder -> COMPLETED when buyer has ParentalControls.monthly_spend_limit_robux set"
    algorithm: aggregation
    formula: |
      spent_this_month = sum of PurchaseOrder.price_robux where
        buyer_user_id == buyer AND status == COMPLETED AND
        completed_at in [first instant of current calendar month UTC, current_utc]
      Reject with ERR_PARENTAL_SPEND_LIMIT if spent_this_month + price_robux >= monthly_spend_limit_robux.
      Boundary is STRICT: at exactly the limit, the purchase is rejected (>=). This is the opposite of most "cap" rules — pinned deliberately.
    constants: {}

  - name: devex_eligibility_derive
    trigger: "Recomputed on User read, DevEx submit, and DevEx approve"
    algorithm: constraint_propagation
    formula: |
      is_devex_eligible =
        status == ACTIVE
        AND age_band == ADULT
        AND identity_verification.status == VERIFIED
        AND tax_document.status == ACCEPTED
        AND account_age_days >= 30
        AND earned_robux_lifetime >= 30000
      All six clauses must hold; the first failure short-circuits and produces the
      specific error_id in validations.
    constants:
      MIN_ACCOUNT_AGE_DAYS: 30
      MIN_EARNED_ROBUX: 30000

  - name: automated_moderation_score_route
    trigger: "ModerationSubmission enters AUTO_REVIEWED"
    algorithm: threshold
    formula: |
      automated_score in [0.0, 1.0]:
        score >= 0.85  -> auto REJECTED
        score <= 0.10  -> auto APPROVED
        else           -> HUMAN_REVIEW
      Boundary: exactly 0.85 is REJECT (>=), exactly 0.10 is APPROVE (<=). Asymmetric boundary operators are deliberate.
    constants:
      AUTO_REJECT_THRESHOLD: 0.85
      AUTO_APPROVE_THRESHOLD: 0.10

  - name: resale_price_floor
    trigger: "ResaleListing creation"
    algorithm: threshold
    formula: |
      ask_price_robux >= floor(item.price_robux * 0.5)
      Boundary: a floor of exactly floor(price/2) is ACCEPTED (>=, not >).
      e.g. price_robux = 101 -> floor = 50; ask 50 is accepted, ask 49 rejected.
    constants:
      FLOOR_PCT: 0.5

validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role must be permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Path-segment IDs must reference existing entities, validated left-to-right"
    error_id: "ERR_USER_NOT_FOUND | ERR_EXPERIENCE_NOT_FOUND | ERR_ITEM_NOT_FOUND | ERR_LISTING_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_SUBMISSION_NOT_FOUND | ERR_APPEAL_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_TERMINATION_NOT_FOUND"
    http_status: 404
    applies_to: all nested endpoints

  - priority: 4
    category: state
    check: "Target entity must be in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all action endpoints

  - priority: 5
    category: business_safety
    check: "Age-band, parental-control, and chat-filter constraints"
    error_id: "ERR_AGE_BAND_INSUFFICIENT | ERR_PARENTAL_SPEND_LIMIT | ERR_PARENTAL_CHAT_RESTRICTED | ERR_CREATOR_AGE_INSUFFICIENT_FOR_RATING"
    http_status: 403
    applies_to: "purchase, join, chat, experience publish endpoints"
    note: "Safety checks precede all other business checks: a minor blocked by a spend limit AND insufficient funds reports the safety error."

  - priority: 6
    category: business_constraint
    check: "Structural constraints: resale floor, limited supply, segregation of duties, idempotency"
    error_id: "ERR_RESALE_FLOOR_VIOLATION | ERR_LIMITED_SUPPLY_EXHAUSTED | ERR_SEGREGATION_OF_DUTIES | ERR_DUPLICATE_IDEMPOTENCY_KEY | ERR_INVALID_REQUEST"
    http_status: 422
    applies_to: "marketplace, moderation, payout endpoints"

  - priority: 7
    category: business_referential
    check: "Cross-entity state gates: experience must be PUBLISHED to join; item must be ON_SALE to purchase; submission must be REJECTED to appeal"
    error_id: "ERR_EXPERIENCE_NOT_PUBLISHED | ERR_ITEM_NOT_ON_SALE | ERR_SUBMISSION_NOT_REJECTED"
    http_status: 409
    applies_to: "join, purchase, appeal endpoints"

  - priority: 8
    category: business_fiscal
    check: "Funds, balance, and DevEx eligibility"
    error_id: "ERR_INSUFFICIENT_ROBUX | ERR_DEVEX_NOT_ELIGIBLE | ERR_DEVEX_MINIMUM_NOT_MET | ERR_STALE_VERSION"
    http_status: "402 or 412"
    applies_to: "purchase, devex endpoints"
    note: "Fiscal checks come LAST: a request that violates both a safety rule and a fiscal rule reports the safety error."

endpoints:
