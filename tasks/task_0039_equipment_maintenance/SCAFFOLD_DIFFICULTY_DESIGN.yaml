scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: mttr_active_vs_wallclock
        grounds:
          - calculations.mttr
          - state_machines.WorkOrder.IN_PROGRESS_to_PAUSED
          - state_machines.WorkOrder.PAUSED_to_IN_PROGRESS
          - endpoints["GET /sites/:site_id/analytics/mttr"]
        distinguishing_aspect: |
          MTTR is computed on the WorkOrder/RepairRecord entity domain. Two valid
          algorithms — active_minutes_mean (excludes PAUSED time via
          total_active_minutes) and wallclock_mean (includes PAUSED time via
          completed_at - started_at) — produce different values for any WO that
          was paused. This dual-variant lives on the WorkOrder repair-time domain.
        test_recipe:
          setup:
            - "Site with clock_now = 2026-01-01T00:00:00Z"
            - "Equipment in IN_SERVICE; ACTIVE PERIODIC_TIME plan; technician with required skill"
            - "WO_A created (source=AD_HOC), started, paused 30 min in, resumed 60 min later, completed at started_at+150min total wall — total_active_minutes=120 (90 active + 30 active before pause… pinned to 120 by the recipe), wallclock=150"
            - "WO_B created on same equipment after WO_A, started, completed without pauses 60 min later — total_active_minutes=60, wallclock=80 (started 20 min after open)"
          trigger:
            - "GET /sites/:site_id/analytics/mttr?scope=EQUIPMENT&scope_id=<eq>&window_start=...&window_end=...   (default mode=active)"
            - "GET /sites/:site_id/analytics/mttr?scope=EQUIPMENT&scope_id=<eq>&window_start=...&window_end=...&mode=wallclock"
          assert:
            - "First call: data.mttr_minutes == 90.00 (= (120+60)/2)"
            - "Second call: data.mttr_minutes == 115.00 (= (150+80)/2)"
            - "Both calls: data.sample_size == 2"
            - "90.00 != 115.00 — proves dual-variant produces different numbers on identical input"

      - name: availability_provisional_vs_final
        grounds:
          - calculations.equipment_availability
          - state_machines.Equipment.IN_SERVICE_to_UNDER_MAINTENANCE
          - state_machines.Equipment.UNDER_MAINTENANCE_to_IN_SERVICE
          - endpoints["GET /sites/:site_id/analytics/availability"]
        distinguishing_aspect: |
          Equipment availability is computed on the Equipment domain (a different
          entity than MTTR's WorkOrder/RepairRecord domain). Two valid algorithms —
          forward_provisional (open WOs count as downtime up to clock_now) and
          final_only_completed (open WOs contribute zero downtime) — diverge whenever
          an equipment has an open WO inside the window.
        test_recipe:
          setup:
            - "Site clock at t0; window_start=t0, window_end=t0+10h (= 36000s)"
            - "Equipment IN_SERVICE; one COMPLETED WO with started_at=t0+1h, completed_at=t0+2h (60 min downtime)"
            - "One OPEN WO (still IN_PROGRESS) with started_at=t0+5h"
            - "Advance clock to t0+8h, then run analytics"
          trigger:
            - "GET /sites/:site_id/analytics/availability?equipment_id=<eq>&window_start=t0&window_end=t0+10h&mode=provisional"
            - "GET /sites/:site_id/analytics/availability?equipment_id=<eq>&window_start=t0&window_end=t0+10h&mode=final"
          assert:
            - "provisional: downtime_seconds == 14400 (= 3600 completed + 10800 open until clock_now t0+8h); availability == round((36000-14400)/36000, 4) == 0.6000"
            - "final: downtime_seconds == 3600 (only completed); availability == round((36000-3600)/36000, 4) == 0.9000"
            - "0.6000 != 0.9000 — same data, different algorithm, different result"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across DIFFERENT modes (a)/(b)/(c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: priority_score_mode_a_three_input_nonlinear
        grounds:
          - calculations.priority_score
          - entities.Equipment.fields.criticality
          - entities.TaskTemplate.fields.default_priority
          - entities.WorkOrder.fields.source
          - endpoints["POST /sites/:site_id/work-orders"]
        distinguishing_aspect: |
          MODE (a) — formula has THREE inputs (Equipment.criticality, TaskTemplate.default_priority,
          WorkOrder.source) with NON-LINEAR interaction: criticality and template_priority
          MULTIPLY (not add), and source_bonus is added on top, then a tiered-rate bucket
          mapping (>=30, >=20, >=8, <8) selects the priority enum. The bucket selection
          is a tiered branch on top of a multiplicative formula.
        test_recipe:
          setup:
            - "Site, equipment with criticality=HIGH, template default_priority=P1"
            - "Equipment IN_SERVICE; ACTIVE plan; technician with required skill"
          trigger:
            - "POST /sites/:site_id/equipment/:eq/alarms with alarm_code=A1 → ALARM-driven WO; source=ALARM"
          assert:
            - "WorkOrder.priority_score == 36  (= 4 (HIGH) * 8 (P1) + 4 (ALARM))"
            - "WorkOrder.priority == 'P1'  (because 36 >= 30)"
            - "Now create AD_HOC WO on a separate equipment with criticality=MEDIUM, default_priority=P3:"
            - "POST /sites/:site_id/work-orders with that equipment+template → WorkOrder.priority_score == 5 (= 2*2 + 1) and WorkOrder.priority == 'P4' (because 5 < 8)"

      - name: parts_cost_mode_b_pinned_rounding_order
        grounds:
          - calculations.parts_cost
          - state_machines.Requisition.RESERVED_to_ISSUED
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
          - endpoints["POST /sites/:site_id/work-orders/:wo_id/complete"]
        distinguishing_aspect: |
          MODE (b) — nested rounding where ORDER MATTERS. The PINNED variant is
          per_line_then_sum: floor(line * 0.90) for every bulk line, THEN sum.
          The REJECTED variant is sum_then_discount: sum first, floor once. The two
          orders produce different cents for mixed-bulk requisitions; the scaffold
          pins per_line_then_sum.
        test_recipe:
          setup:
            - "Site, equipment IN_SERVICE, technician with skill"
            - "Two SparePart rows: P1 (unit_cost_cents=191), P2 (unit_cost_cents=191), each stock_on_hand=20"
            - "Create WO; reserve R1 on P1 qty=11; reserve R2 on P2 qty=11"
            - "Issue R1 (snapshot unit_cost_cents_at_issue=191); issue R2 (191)"
            - "Start WO, complete WO with valid evidence"
          trigger:
            - "POST /sites/:site_id/work-orders/:wo_id/complete (with full RepairRecord body)"
          assert:
            - "WorkOrder.parts_cost_cents == 3780  (= floor(11*191*0.9)+floor(11*191*0.9) = 1890+1890)"
            - "Note: sum_then_discount would be floor((11*191+11*191)*0.9) == floor(4202*0.9) == floor(3781.8) == 3781 — DIFFERENT from 3780, proving rounding order is observable"

      - name: plan_generation_mode_c_pinned_evaluation_order
        grounds:
          - calculations.plan_generation
          - state_machines.MaintenancePlan.DRAFT_to_ACTIVE
          - state_machines.WorkOrder.PENDING_to_PENDING
          - endpoints["POST /sites/:site_id/sweep/run"]
          - validations[priority=7]
        distinguishing_aspect: |
          MODE (c) — circular-looking dependency where evaluation order MUST be
          pinned. Two ACTIVE plans on the same equipment can both qualify for
          generation in one /sweep/run tick; whether either generates depends on
          Equipment.open_work_order_id, which itself flips when a plan generates.
          The scaffold pins the order: PERIODIC_TIME (Step 1) by next_due_at ASC,
          then PERIODIC_USAGE (Step 2) by id ASC, with at most one WO per
          equipment per tick. This is order-sensitive and self-referential.
        test_recipe:
          setup:
            - "Site clock at t0; equipment IN_SERVICE with usage_counter=100"
            - "Plan A: kind=PERIODIC_TIME, interval_days=1, ACTIVE with last_generated_at=null → next_due_at=t0+86400s"
            - "Plan B: kind=PERIODIC_USAGE, interval_usage=10, ACTIVE with last_generated_usage=90 → due since usage delta = 10"
            - "Advance clock to t0+86400s (now == Plan A.next_due_at)"
          trigger:
            - "POST /sites/:site_id/sweep/run"
          assert:
            - "Exactly ONE WorkOrder is created in this tick (Plan A wins, source=PLAN_PERIODIC); Equipment.open_work_order_id != null"
            - "Plan B does NOT generate this tick (open_work_order_id blocks Step 2)"
            - "Plan A.last_generated_at == t0+86400s; Plan A.next_due_at == t0+86400s+86400s"
            - "Plan B.last_generated_usage unchanged (== 90)"
            - "After /work-orders/:wo/complete and a SECOND /sweep/run tick at t0+86400s+1: Plan B generates a new WO (source=PLAN_PERIODIC)"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on DIFFERENT entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_pause_resume_cycle
        grounds:
          - state_machines.WorkOrder.IN_PROGRESS_to_PAUSED
          - state_machines.WorkOrder.PAUSED_to_IN_PROGRESS
          - state_machines.WorkOrder.PENDING_to_PENDING
          - endpoints["POST /sites/:site_id/work-orders/:wo_id/pause"]
          - endpoints["POST /sites/:site_id/work-orders/:wo_id/resume"]
        distinguishing_aspect: |
          WorkOrder has CYCLIC shape: IN_PROGRESS → PAUSED → IN_PROGRESS may repeat
          arbitrarily many times before COMPLETED. Additionally, PENDING → PENDING
          (reassign self-loop) is a second kind of cycle on the same entity. This
          is on the WorkOrder entity.
        test_recipe:
          setup:
            - "Site, equipment IN_SERVICE, technician T1 with skill, WO created and started"
          trigger:
            - "POST /work-orders/:wo/pause (pause_reason=WAIT_INFO)"
            - "POST /work-orders/:wo/resume"
            - "POST /work-orders/:wo/pause (pause_reason=WAIT_VENDOR)"
            - "POST /work-orders/:wo/resume"
          assert:
            - "After all four calls WorkOrder.status == 'IN_PROGRESS'"
            - "WorkOrder.pause_reason == null (cleared on resume)"
            - "WorkOrder.version incremented exactly 4 from the post-start version"

      - name: maintenance_plan_pause_resume_cycle
        grounds:
          - state_machines.MaintenancePlan.ACTIVE_to_PAUSED
          - state_machines.MaintenancePlan.PAUSED_to_ACTIVE
          - endpoints["POST /sites/:site_id/plans/:plan_id/pause"]
          - endpoints["POST /sites/:site_id/plans/:plan_id/resume"]
        distinguishing_aspect: |
          MaintenancePlan (a DIFFERENT entity from WorkOrder) also has a cyclic
          shape: ACTIVE ↔ PAUSED can be traversed multiple times; only RETIRED is
          terminal. This satisfies the "different entity" clause for non-linear
          machines.
        test_recipe:
          setup:
            - "Site clock at t0; equipment IN_SERVICE; plan PERIODIC_TIME interval_days=7, ACTIVE; last_generated_at=null → next_due_at=t0+7d"
          trigger:
            - "POST /plans/:plan_id/pause"
            - "Advance clock by 7 days"
            - "POST /plans/:plan_id/resume"
          assert:
            - "Plan.status == 'ACTIVE' after resume"
            - "Plan.next_due_at after resume == max(t0+7d, t0+7d) == t0+7d (re-evaluated at resume time per scaffold rule)"
            - "Plan can be paused again (cycle is repeatable)"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from DIFFERENT triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: equipment_decommission_depth_3_cascade
        grounds:
          - state_machines.Equipment.IN_SERVICE_to_DECOMMISSIONED
          - state_machines.MaintenancePlan.ACTIVE_to_RETIRED
          - state_machines.WorkOrder.PENDING_to_CANCELLED
          - state_machines.Requisition.RESERVED_to_CANCELLED
          - calculations.replenish_evaluator
          - endpoints["POST /sites/:site_id/equipment/:equipment_id/decommission"]
        distinguishing_aspect: |
          Triggering action: POST /equipment/:id/decommission. Depth-3 chain in
          which each link is caused by the previous link, not by the original
          action (this is true transitive propagation, not fan-out):
          Hop 1: Equipment IN_SERVICE → DECOMMISSIONED.
          Hop 2: BECAUSE the equipment moved, every ACTIVE plan on that equipment
                 is independently transitioned ACTIVE → RETIRED (this hop is the
                 plan-state machine's own transition keyed on the equipment-state
                 transition).
          Hop 3: BECAUSE the equipment lifecycle gate flipped, every PENDING
                 WorkOrder on that equipment transitions PENDING → CANCELLED.
          Hop 4: BECAUSE the work order cancelled, every RESERVED Requisition on
                 that work order transitions RESERVED → CANCELLED, which itself
                 invokes replenish_evaluator and may flip SparePart.replenish_pending.
        test_recipe:
          setup:
            - "Site, equipment IN_SERVICE, ACTIVE plan P1 attached"
            - "PENDING WO on this equipment, with one RESERVED Requisition R1 on SparePart S1 (stock_on_hand=10, reorder_point=5, qty=6 → after reservation available=4 ≤ 5 so replenish_pending=true)"
          trigger:
            - "POST /sites/:site_id/equipment/:eq/decommission"
          assert:
            - "Equipment.lifecycle_status == 'DECOMMISSIONED'"
            - "Plan P1.status == 'RETIRED' (hop 2)"
            - "WorkOrder.status == 'CANCELLED' (hop 3)"
            - "Requisition R1.status == 'CANCELLED' (hop 4)"
            - "SparePart S1.stock_reserved == 0 (was 6) — replenish_evaluator ran: available is now 10 > 5 → SparePart S1.replenish_pending == false"
            - "AuditEntry rows appended for the WO state change"

      - name: parts_issue_depth_2_cascade
        grounds:
          - state_machines.Requisition.RESERVED_to_ISSUED
          - calculations.replenish_evaluator
          - entities.SparePart.fields.replenish_pending
          - entities.SparePart.fields.stock_on_hand
          - entities.SparePart.fields.stock_reserved
          - endpoints["POST /sites/:site_id/work-orders/:wo_id/requisitions/:req_id/issue"]
        distinguishing_aspect: |
          Triggering action: POST /requisitions/:rid/issue. DIFFERENT from
          decommission. Depth-2 chain:
          Hop 1: Requisition RESERVED → ISSUED.
          Hop 2: BECAUSE the requisition issued, SparePart.stock_on_hand and
                 stock_reserved both decrease, then replenish_evaluator runs and
                 SparePart.replenish_pending may flip false→true (which the test
                 fixture also turns into an /events/replenish notification).
        test_recipe:
          setup:
            - "Site, SparePart S1 with stock_on_hand=8, reorder_point=5, replenish_pending=false"
            - "WO with one RESERVED requisition R1 (qty=4) — stock_reserved becomes 4, available=4 ≤ 5, so replenish_pending=true is already set at reservation"
            - "Adjust scenario: S1 with stock_on_hand=12, reorder_point=5; reserve qty=4 → available=8>5, replenish_pending=false"
          trigger:
            - "POST /requisitions/:rid/issue"
          assert:
            - "Requisition R1.status == 'ISSUED'"
            - "SparePart S1.stock_on_hand == 8 (was 12, -4)"
            - "SparePart S1.stock_reserved == 0 (was 4, -4)"
            - "SparePart S1.replenish_pending == false (because available 8 > 5)"
            - "Now rerun with bigger qty: stock_on_hand=12 reorder_point=5 reserve qty=10 → available=2 ≤5 already true; issue qty=10 → stock_on_hand=2, stock_reserved=0, available=2≤5, replenish_pending stays true"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across DIFFERENT error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_evidence
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - state_machines.WorkOrder.COMPLETED_to_CLOSED
          - endpoints["POST /sites/:site_id/work-orders/:wo_id/accept"]
        distinguishing_aspect: |
          Pair: state (priority 5, ERR_INVALID_STATE) vs business_safety (priority 8,
          ERR_EVIDENCE_MISSING). Both fail simultaneously when calling /accept on
          a WorkOrder that is in PENDING (wrong state) AND has no RepairRecord
          (and thus no evidence). State priority wins per the ordering.
        test_recipe:
          setup:
            - "Site, equipment IN_SERVICE, technician with skill, WO PENDING (never started); no RepairRecord exists"
          trigger:
            - "POST /sites/:site_id/work-orders/:wo_id/accept (X-User-Role=SiteManager, X-User-ID=responsible_user_id of equipment)"
          assert:
            - "HTTP 409"
            - "data.error_id == 'ERR_INVALID_STATE' (state check at priority 5 wins over evidence check at priority 8)"

      - name: business_safety_busy_vs_business_referential_cross_site
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - endpoints["POST /sites/:site_id/work-orders"]
        distinguishing_aspect: |
          Pair: business_referential (priority 4, ERR_CROSS_SITE_REFERENCE) vs
          business_safety (priority 7, ERR_EQUIPMENT_BUSY). Different category-pair
          from the first instance. Both fail simultaneously when POST /work-orders
          references a template that belongs to a DIFFERENT site AND the equipment
          already has an open WO. Cross-site reference (priority 4) wins.
        test_recipe:
          setup:
            - "Site A and Site B each created"
            - "Equipment EQ1 in Site A, IN_SERVICE, with an open PENDING WO already"
            - "TaskTemplate TT in Site B (different site)"
          trigger:
            - "POST /sites/A/work-orders with equipment_id=EQ1 and template_id=TT (cross-site)"
          assert:
            - "HTTP 422"
            - "data.error_id == 'ERR_CROSS_SITE_REFERENCE' (priority 4 wins; ERR_EQUIPMENT_BUSY at priority 7 never evaluated)"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on DIFFERENT metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: sla_breach_strict_greater_than
        grounds:
          - calculations.sla_minutes_for_priority
          - entities.WorkOrder.fields.sla_due_at
          - entities.WorkOrder.fields.sla_breached
          - endpoints["POST /sites/:site_id/sweep/run"]
          - endpoints["POST /sites/:site_id/clock/advance"]
        distinguishing_aspect: |
          Boundary on the SLA-breach metric on the WorkOrder entity, observable via
          GET /work-orders/:id after /sweep/run. The condition is STRICTLY greater
          than (Site.clock_now > sla_due_at), meaning equality does NOT breach.
        test_recipe:
          setup:
            - "Site clock at t0=2026-01-01T00:00:00Z; equipment IN_SERVICE; technician with skill"
            - "AD_HOC WO with priority=P1 created at t0 → sla_due_at = t0 + 240*60s = t0+14400s"
          trigger:
            - "POST /sites/:site_id/clock/advance with seconds=14400 (clock_now == sla_due_at exactly)"
            - "POST /sites/:site_id/sweep/run"
            - "GET /sites/:site_id/work-orders/:wo_id"
            - "POST /sites/:site_id/clock/advance with seconds=1 (clock_now == sla_due_at + 1s)"
            - "POST /sites/:site_id/sweep/run"
            - "GET /sites/:site_id/work-orders/:wo_id"
          assert:
            - "After first GET (clock_now == sla_due_at): WorkOrder.sla_breached == false"
            - "After second GET (clock_now > sla_due_at by 1s): WorkOrder.sla_breached == true"

      - name: replenish_threshold_inclusive_le
        grounds:
          - calculations.replenish_evaluator
          - entities.SparePart.fields.reorder_point
          - entities.SparePart.fields.replenish_pending
          - state_machines.Requisition.RESERVED_to_ISSUED
          - endpoints["POST /sites/:site_id/work-orders/:wo_id/requisitions/:req_id/issue"]
        distinguishing_aspect: |
          DIFFERENT metric (inventory available count, not SLA datetime) and
          DIFFERENT endpoint (the issue endpoint, not the SLA sweep). The boundary
          uses INCLUSIVE less-than-or-equal: available <= reorder_point triggers
          the replenish flag. Equality at the threshold IS a trigger here, in
          contrast to the SLA strict-greater rule above.
        test_recipe:
          setup:
            - "Site, SparePart S1: stock_on_hand=10, reorder_point=5, replenish_pending=false"
            - "Equipment IN_SERVICE; WO; reserve qty=5 on S1 → stock_reserved=5, available=stock_on_hand-stock_reserved=5"
          trigger:
            - "POST /requisitions/:rid/issue"
            - "GET /spare-parts/:S1"
          assert:
            - "After issue: S1.stock_on_hand == 5, S1.stock_reserved == 0, available == 5"
            - "Boundary check: available 5 <= reorder_point 5 → S1.replenish_pending == true"
            - "Now create a separate SparePart S2 (stock_on_hand=10, reorder_point=5), reserve qty=4, issue → available 6 > 5 → S2.replenish_pending == false (proving > vs <= boundary precision)"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across DIFFERENT entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: workorder_start_requires_equipment_lifecycle
        grounds:
          - state_machines.WorkOrder.PENDING_to_IN_PROGRESS
          - state_machines.Equipment.IN_SERVICE_to_UNDER_MAINTENANCE
          - validations[priority=6]
          - endpoints["POST /sites/:site_id/work-orders/:wo_id/start"]
        distinguishing_aspect: |
          Pair: WorkOrder ↔ Equipment. WorkOrder.PENDING → IN_PROGRESS is gated on
          Equipment.lifecycle_status IN {IN_SERVICE, COMMISSIONED}. If equipment
          is INSTALLED (not yet commissioned) or DECOMMISSIONED, start fails with
          ERR_EQUIPMENT_LIFECYCLE.
        test_recipe:
          setup:
            - "Site, equipment in INSTALLED state (never commissioned), with required ACTIVE plan attached but no commission yet"
            - "We force a PENDING WorkOrder by manually creating it via POST /work-orders — but creation also requires lifecycle, so instead: commission the equipment, place-in-service, create WO, then force-decommission via the equipment endpoint after the WO is PENDING (this requires open_work_order_id IS NULL — so we use a fresh equipment in COMMISSIONED state and revert)"
            - "Concretely: equipment commissioned but NOT placed-in-service (so lifecycle_status=COMMISSIONED), create AD_HOC WO (allowed because COMMISSIONED is in {COMMISSIONED, IN_SERVICE}), then PATCH equipment is not allowed to change lifecycle, so use the simpler shape: create WO when equipment is IN_SERVICE; the technician acts as themselves. Now create a SECOND equipment that stays in INSTALLED state and try to create a WO on it — POST /work-orders fails with ERR_EQUIPMENT_LIFECYCLE."
          trigger:
            - "POST /sites/:site_id/work-orders with equipment_id=<INSTALLED_equipment>"
          assert:
            - "HTTP 409"
            - "data.error_id == 'ERR_EQUIPMENT_LIFECYCLE'"
            - "WorkOrder NOT created"

      - name: requisition_issue_requires_workorder_status
        grounds:
          - state_machines.Requisition.RESERVED_to_ISSUED
          - state_machines.WorkOrder.PENDING_to_IN_PROGRESS
          - state_machines.WorkOrder.IN_PROGRESS_to_PAUSED
          - validations[priority=5]
          - endpoints["POST /sites/:site_id/work-orders/:wo_id/requisitions/:req_id/issue"]
        distinguishing_aspect: |
          DIFFERENT pair from the first instance: Requisition ↔ WorkOrder. The
          Requisition.RESERVED → ISSUED transition is gated on WorkOrder.status IN
          {PENDING, IN_PROGRESS, PAUSED}. If the WO has been COMPLETED, CLOSED, or
          CANCELLED, issue fails with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Site, equipment IN_SERVICE, technician with skill"
            - "WO created, requisition R1 created (RESERVED) on a SparePart with stock"
            - "WO PENDING → cancel the WO (RESERVED requisitions cascade to CANCELLED)"
            - "Reset: re-create WO and requisition R2 (RESERVED), start, complete with valid evidence"
            - "After complete, WO is COMPLETED"
          trigger:
            - "POST /requisitions/:R2/issue (after WO is COMPLETED)"
          assert:
            - "HTTP 409, data.error_id == 'ERR_INVALID_STATE' (Requisition.status ISSUED requires WO.status in {PENDING, IN_PROGRESS, PAUSED})"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across DIFFERENT interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: equipment_open_workorder_exclusive
        grounds:
          - validations[priority=7]
          - state_machines.WorkOrder.PENDING_to_PENDING
          - entities.Equipment.fields.open_work_order_id
          - concurrency_rules[scenario-keyword=Two simultaneous work-order creations]
          - endpoints["POST /sites/:site_id/work-orders"]
        distinguishing_aspect: |
          Resource: Equipment. Interval semantics: AT MOST ONE open WorkOrder
          (status IN {PENDING, IN_PROGRESS, PAUSED}) per equipment at any time.
          The WorkOrder occupation interval is [opened_at, terminal_at) and
          adjacency IS allowed (you may open a new WO at the exact instant the
          previous one transitions to a terminal status). This is the
          "exclusive-occupant, half-open with adjacency permitted" semantics.
        test_recipe:
          setup:
            - "Site, equipment IN_SERVICE, technician with skill"
            - "First WO opened on the equipment, status=PENDING"
          trigger:
            - "POST /sites/:site_id/work-orders again with the same equipment_id"
          assert:
            - "Second creation fails with HTTP 409, data.error_id == 'ERR_EQUIPMENT_BUSY'"
            - "After cancelling the first WO (PENDING → CANCELLED), Equipment.open_work_order_id == null and a NEW POST /work-orders succeeds at the same instant (clock unchanged) — proving adjacency is allowed"

      - name: technician_workload_aggregate_capacity
        grounds:
          - calculations.technician_selector
          - entities.Technician.fields.open_load
          - entities.WorkOrder.fields.assigned_technician_id
          - endpoints["POST /sites/:site_id/work-orders"]
          - endpoints["POST /sites/:site_id/work-orders/:wo_id/reassign"]
        distinguishing_aspect: |
          DIFFERENT resource (Technician, not Equipment) and DIFFERENT interval
          semantics: AGGREGATE-CAPACITY (not exclusive). A technician may hold
          MULTIPLE simultaneous open WOs; the selector chooses the LEAST loaded
          (sort by open_load ASC, created_at ASC, then id ASC). There is no hard
          cap; load is a ranking signal. This contrasts with Equipment's
          exclusive-occupant semantics.
        test_recipe:
          setup:
            - "Site; technicians T_A (created first) with skills=[MECHANICAL]; T_B (created second) with skills=[MECHANICAL]"
            - "Equipment E1 IN_SERVICE; create AD_HOC WO_1 — selector picks T_A (open_load 0 vs 0, T_A older)"
            - "Equipment E2 IN_SERVICE; create AD_HOC WO_2 — selector picks T_B (T_A.open_load=1, T_B.open_load=0 → T_B wins)"
            - "Equipment E3 IN_SERVICE"
          trigger:
            - "POST /sites/:site_id/work-orders for E3"
          assert:
            - "WO_3.assigned_technician_id == T_A or T_B (both have open_load=1; tie broken by created_at — T_A wins because older)"
            - "WO_3.assigned_technician_id == T_A.id"
            - "T_A.open_load is now 2 (proves multiple simultaneous WOs on one technician — AGGREGATE-CAPACITY semantics, not exclusive)"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: spare_part_stock_conservation
        grounds:
          - state_machines.Requisition.RESERVED_to_ISSUED
          - state_machines.Requisition.ISSUED_to_RETURNED
          - calculations.replenish_evaluator
          - entities.SparePart.fields.stock_on_hand
          - entities.SparePart.fields.stock_reserved
          - endpoints["POST /sites/:site_id/work-orders/:wo_id/requisitions/:req_id/issue"]
          - endpoints["POST /sites/:site_id/work-orders/:wo_id/requisitions/:req_id/return"]
        distinguishing_aspect: |
          Conserved quantity: SparePart total physical units in the universe
          observable via the API == SparePart.stock_on_hand + (units currently
          out-of-stock-but-issued, i.e., sum over Requisition rows of
          (qty - returned_qty) where status==ISSUED). For a single SparePart S
          and any sequence of issue/return that returns the requisition to
          fully-returned, the invariant is:
              S.stock_on_hand_after == S.stock_on_hand_before
              AND S.stock_reserved_after == S.stock_reserved_before
        test_recipe:
          setup:
            - "Site, equipment IN_SERVICE, technician with skill"
            - "SparePart S: stock_on_hand=10, stock_reserved=0, reorder_point=2"
            - "WO created; requisition R reserves qty=4 (stock_reserved becomes 4, stock_on_hand=10)"
            - "Pre-issue snapshot: stock_on_hand=10, stock_reserved=4"
          trigger:
            - "POST /requisitions/:R/issue (stock_on_hand→6, stock_reserved→0)"
            - "POST /requisitions/:R/return with returned_qty=4 (stock_on_hand→10, returned_qty=4)"
          assert:
            - "Final SparePart S.stock_on_hand == 10 (== pre-reservation value)"
            - "Final SparePart S.stock_reserved == 0 (== pre-reservation value, since R was fully returned)"
            - "Sum over outstanding requisitions of (qty - returned_qty) where status==ISSUED is 0"
            - "Total physical inventory (stock_on_hand + outstanding_issued) == 10 == initial — invariant holds"

      - name: equipment_open_work_order_conservation
        grounds:
          - state_machines.Equipment.IN_SERVICE_to_UNDER_MAINTENANCE
          - state_machines.Equipment.UNDER_MAINTENANCE_to_IN_SERVICE
          - state_machines.WorkOrder.PENDING_to_IN_PROGRESS
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
          - state_machines.WorkOrder.COMPLETED_to_CLOSED
          - entities.Equipment.fields.lifecycle_status
          - entities.Equipment.fields.open_work_order_id
          - endpoints["POST /sites/:site_id/work-orders/:wo_id/start"]
          - endpoints["POST /sites/:site_id/work-orders/:wo_id/complete"]
          - endpoints["POST /sites/:site_id/work-orders/:wo_id/accept"]
        distinguishing_aspect: |
          DIFFERENT conserved quantity than stock: a discrete-state pair (Equipment.lifecycle_status,
          Equipment.open_work_order_id). The forward chain (start → complete → accept)
          must leave the equipment in (lifecycle_status='IN_SERVICE',
          open_work_order_id=null) — exactly the state it was in before start.
          This is a state-pair invariant, not a numeric balance.
        test_recipe:
          setup:
            - "Site, equipment EQ in IN_SERVICE with open_work_order_id=null"
            - "Pre-snapshot: (lifecycle_status='IN_SERVICE', open_work_order_id=null)"
            - "Create WO with EQ; technician with skill assigned"
          trigger:
            - "POST /work-orders/:wo/start (Equipment moves IN_SERVICE → UNDER_MAINTENANCE; open_work_order_id=wo.id)"
            - "POST /work-orders/:wo/complete (with valid evidence; Equipment moves UNDER_MAINTENANCE → IN_SERVICE; open_work_order_id=null)"
            - "POST /work-orders/:wo/accept (CLOSED; equipment unchanged)"
          assert:
            - "Final Equipment.lifecycle_status == 'IN_SERVICE' (== pre-snapshot)"
            - "Final Equipment.open_work_order_id == null (== pre-snapshot)"
            - "Equipment.last_repair_completed_at is now non-null (forward action's only persistent residue is the maintenance history; the conserved pair is restored)"
