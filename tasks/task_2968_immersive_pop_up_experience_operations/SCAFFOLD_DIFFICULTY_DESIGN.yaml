      - name: slot_capacity_ledger_conserved_across_a_buyout_hold_and_release
        grounds:
          - endpoints[POST /timed-entry-slots/{slotId}/release]
          - endpoints[POST /ticket-orders]
          - endpoints[POST /ticket-orders/{orderId}/confirm]
          - endpoints[POST /ticket-orders/{orderId}/cancel]
          - entities.TimedEntrySlot.fields.available_capacity
        distinguishing_aspect: |
          A different conserved quantity from the money invariant: the slot's seat ledger
          released_capacity == held_capacity + sold_capacity + available_capacity, which must hold after
          every one of six mutations. The hard arm is the PRIVATE_BUYOUT path, where a single order moves
