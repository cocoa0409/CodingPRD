# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 for task_2853_retailer_installation_services_program
#
# Breadth probe. Every row of references/claim-extraction-guide.md that applies
# to this scaffold's §1.1-§1.7 surface becomes an instance below; rows already
# exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml become `excluded_because:` stubs
# naming the covering §1.8 instance.
#
# Same gates as §1.8: every `grounds:` entry resolves into SCAFFOLD.yaml
# §1.1-§1.7; every `setup_api_calls` / `trigger` entry is a structured call
# against a §1.5 endpoint; every ${var} is bound by an earlier `captures:`;
# every formula-derived assert was computed by executing the §1.3 formula in
# Python against its pinned `constants:`.
#
# The server's logical clock starts at exactly 2026-08-01T00:00:00.000Z, so a
# recipe that does not call POST /_clock/set_current_utc is running at that
# instant and every created row's created_at is that instant.
#
# Canonical fixtures reused across instances (identical literals to §1.8):
#   ServiceCategory FLOOR-LVP    measurement_required true,  permit BY_JURISDICTION
#   ServiceCategory FLOOR-DIRECT measurement_required false, permit NEVER
#   ServiceCategory FLOOR-QUICK  measurement_required false, permit BY_JURISDICTION
#   Jurisdiction    METRO-01     multiplier 1.15, threshold 250.00, RETAILER
#   Jurisdiction    METRO-02     multiplier 1.00, permit_required_trades []
#   Installer       Northside Flooring LLC, FLOORING, coverage 200000000
#   Project         420.00 units in METRO-01 -> quoted 196673, deposit 59002

scaffold_corner_design:

  # ==========================================================================
  # SECTION — entities  (claim-extraction-guide Table 1; entity_topology: flat)
  # ==========================================================================
  - section: entities
    instances:

      - name: service_category_creation_echoes_every_declared_field_at_201
        claim_type: creation
        grounds:
          - entities.ServiceCategory
          - endpoints[POST /service-categories]
          - response_envelope.success
        distinguishing_aspect: "POST /service-categories with all required inputs returns HTTP 201, response_type 'object', and every §1.1 ServiceCategory field echoed with version 1."
        test_recipe:
          setup:
            - "Empty database; the logical clock is at its startup default 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "GET /_clock"
              payload: {}
              as: ProgramAdmin
              captures: { now: $.data.current_utc }
          trigger:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-LVP", name: "LVP Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: true, measurement_validity_days: 45, permit_policy: "BY_JURISDICTION", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
          assert:
            - "HTTP 201 with meta.api_request_id and meta.api_request_timestamp present and response_type == 'object'"
            - "ServiceCategory.${cat_id}.code == 'FLOOR-LVP' AND trade_code == 'FLOORING' AND unit_of_measure == 'SQFT'"
            - "ServiceCategory.${cat_id}.base_labor_rate_cents_per_unit == 425 AND minimum_billable_units == 150.00 AND deposit_pct == 0.30"
            - "ServiceCategory.${cat_id}.measurement_required == true AND measurement_validity_days == 45 AND permit_policy == 'BY_JURISDICTION' AND status == 'ACTIVE'"
            - "ServiceCategory.${cat_id}.version == 1 AND created_at == ${now} AND updated_at == ${now}"

      - name: jurisdiction_omitted_optionals_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Jurisdiction.fields.permit_unit_threshold
          - entities.Jurisdiction.fields.inspection_lead_days
          - entities.Jurisdiction.fields.max_concurrent_inspections
          - entities.Jurisdiction.fields.background_check_recency_days
          - entities.Jurisdiction.fields.license_required
          - entities.Jurisdiction.fields.labor_complexity_multiplier
          - endpoints[POST /jurisdictions]
        distinguishing_aspect: "A POST /jurisdictions body carrying ONLY the six required inputs yields permit_unit_threshold 0, inspection_lead_days 3, max_concurrent_inspections 2, background_check_recency_days 365, license_required true, labor_complexity_multiplier 1.00 and status ACTIVE."
        test_recipe:
          setup:
            - "Empty database; clock at 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "GET /_clock"
              payload: {}
              as: ProgramAdmin
              captures: { now: $.data.current_utc }
          trigger:
            - call: "POST /jurisdictions"
              payload: { code: "METRO-09", name: "Bare County", permit_required_trades: ["FLOORING"], permit_responsible_party: "RETAILER", inspection_required: false, min_liability_coverage_cents: 100000000 }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
          assert:
            - "Jurisdiction.${jur_id}.permit_unit_threshold == 0 AND inspection_lead_days == 3 AND max_concurrent_inspections == 2"
            - "Jurisdiction.${jur_id}.background_check_recency_days == 365 AND license_required == true"
            - "Jurisdiction.${jur_id}.labor_complexity_multiplier == 1.00 AND status == 'ACTIVE'"
            - "Jurisdiction.${jur_id}.permit_required_trades == ['FLOORING'] AND version == 1"

      - name: service_category_omitted_optionals_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.ServiceCategory.fields.measurement_validity_days
          - entities.ServiceCategory.fields.permit_policy
          - entities.ServiceCategory.fields.deposit_pct
          - entities.ServiceCategory.fields.status
          - endpoints[POST /service-categories]
        distinguishing_aspect: "A POST /service-categories body omitting the four optional inputs yields measurement_validity_days 45, permit_policy BY_JURISDICTION, deposit_pct 0.30 and status ACTIVE — a different entity's default set from the Jurisdiction instance."
        test_recipe:
          setup:
            - "Empty database; clock at 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "GET /_clock"
              payload: {}
              as: ProgramAdmin
              captures: { now: $.data.current_utc }
          trigger:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-BARE", name: "Bare Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: false }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
          assert:
            - "ServiceCategory.${cat_id}.measurement_validity_days == 45 AND permit_policy == 'BY_JURISDICTION'"
            - "ServiceCategory.${cat_id}.deposit_pct == 0.30 AND status == 'ACTIVE'"
            - "ServiceCategory.${cat_id}.measurement_required == false AND version == 1"

      - name: installer_system_and_computed_fields_are_server_set_with_client_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Installer.fields.status
          - entities.Installer.fields.background_check_result
          - entities.Installer.fields.committed_minutes
          - entities.Installer.fields.composite_score
          - entities.Installer.fields.removal_eligible
          - endpoints[POST /installers]
          - state_machines.Installer.initial_state
        distinguishing_aspect: "POST /installers ignores client-supplied status, committed_minutes and composite_score: the row is created APPLIED with committed_minutes 0 and all four scores 85.00."
        test_recipe:
          setup:
            - "Empty database; clock at 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "GET /_clock"
              payload: {}
              as: ProgramAdmin
              captures: { now: $.data.current_utc }
          trigger:
            - call: "POST /installers"
              payload: { legal_name: "Northside Flooring LLC", contact_email: "ops@northside.example", primary_trade_code: "FLOORING", liability_coverage_cents: 200000000, insurance_expires_on: "2027-06-30T00:00:00.000Z", status: "ACTIVE", committed_minutes: 900, composite_score: 99.00, removal_eligible: true }
              as: NetworkManager
              captures: { inst_id: $.data.id }
          assert:
            - "HTTP 201 — the three unknown/system fields in the body are ignored, not rejected"
            - "Installer.${inst_id}.status == 'APPLIED' (the §1.2 initial_state), NOT the supplied 'ACTIVE'"
            - "Installer.${inst_id}.committed_minutes == 0 AND removal_eligible == false"
            - "Installer.${inst_id}.quality_score == 85.00 AND timeliness_score == 85.00 AND satisfaction_score == 85.00 AND composite_score == 85.00 AND lifetime_composite_score == 85.00"
            - "Installer.${inst_id}.background_check_result == 'NONE' AND background_check_completed_at == null AND verified_credential_count == 0"
            - "Installer.${inst_id}.liability_coverage_cents == 200000000 AND insurance_expires_on == '2027-06-30T00:00:00.000Z' (the two client-owned fields ARE stored)"

      - name: project_creation_derives_every_computed_money_and_permit_field
        claim_type: computed_fields
        grounds:
          - entities.Project.fields.effective_units
          - entities.Project.fields.quoted_labor_cents
          - entities.Project.fields.deposit_required_cents
          - entities.Project.fields.permit_responsibility
          - calculations.project_labor_charge
          - calculations.permit_responsibility_determination
          - endpoints[POST /projects]
        distinguishing_aspect: "A 420.00-unit FLOOR-LVP project in METRO-01 is created with effective_units 420.00, quoted_labor_cents 196673, deposit_required_cents 59002 and permit_responsibility RETAILER, all four computed by the server from the category and jurisdiction rows."
        test_recipe:
          setup:
            - "ServiceCategory FLOOR-LVP (rate 425, minimum_billable_units 150.00, measurement_required true) and Jurisdiction METRO-01 (multiplier 1.15, threshold 250.00, RETAILER) exist."
            - "One Customer in METRO-01 with project_count 0."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-LVP", name: "LVP Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: true, measurement_validity_days: 45, permit_policy: "BY_JURISDICTION", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "METRO-01", name: "Metro County", permit_required_trades: ["FLOORING", "HVAC", "ROOFING"], permit_responsible_party: "RETAILER", inspection_required: true, min_liability_coverage_cents: 100000000, permit_unit_threshold: 250.00, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.15, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "18 Larch Way", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
          assert:
            - "Project.${proj_id}.effective_units == 420.00 AND quoted_labor_cents == 196673 (tier ladder 200*425 + 220*391 = 171020, then *1.15)"
            - "Project.${proj_id}.deposit_required_cents == 59002 == round_half_up(196673 * 0.30)"
            - "Project.${proj_id}.permit_responsibility == 'RETAILER' AND permit_status == 'PENDING_APPLICATION' (FLOORING is in permit_required_trades and 420.00 >= 250.00)"
            - "Project.${proj_id}.fulfillment_status == 'MEASURE_PENDING' AND financial_status == 'QUOTED'"
            - "Project.${proj_id}.deposit_paid_cents == 0 AND deposit_held_cents == 0 AND deposit_applied_cents == 0 AND deposit_refunded_cents == 0 AND deposit_forfeited_cents == 0"
            - "Project.${proj_id}.final_labor_cents == null AND total_due_cents == 0 AND balance_due_cents == 0"
            - "Customer.${cust_id}.project_count == 1"

      - name: completed_measurement_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.Measurement
          - endpoints[GET /measurements/{id}]
          - endpoints[POST /measurements/{id}/complete]
          - state_machines.Measurement.SCHEDULED_to_COMPLETED
        distinguishing_aspect: "GET /measurements/{id} after completion returns exactly the stored row — status COMPLETED, measured_units 420.00, subfloor_condition MINOR, obstruction_count 2, stair_flight_count 1, variance_pct 0.00 — with no recomputation."
        test_recipe:
          setup:
            - "FLOOR-LVP category in METRO-01 with one Customer and one 420.00-unit project in MEASURE_PENDING."
            - "One Measurement booked and then completed with measured_units exactly equal to estimated_units, so variance_pct is 0.00 and no variance change order is auto-created."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-LVP", name: "LVP Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: true, measurement_validity_days: 45, permit_policy: "BY_JURISDICTION", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "METRO-01", name: "Metro County", permit_required_trades: ["FLOORING", "HVAC", "ROOFING"], permit_responsible_party: "RETAILER", inspection_required: true, min_liability_coverage_cents: 100000000, permit_unit_threshold: 250.00, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.15, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "18 Larch Way", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/measurements"
              payload: { scheduled_at: "2026-08-05T09:00:00.000Z", technician_name: "Ivy Nakamura" }
              as: ProjectCoordinator
              captures: { meas_id: $.data.id }
            - call: "POST /measurements/${meas_id}/complete"
              payload: { measured_units: 420.00, subfloor_condition: "MINOR", obstruction_count: 2, stair_flight_count: 1, access_notes: "Side gate access only" }
              as: ProjectCoordinator
          trigger:
            - call: "GET /measurements/${meas_id}"
              payload: {}
              as: ProjectCoordinator
          assert:
            - "HTTP 200 with response_type == 'object'"
            - "Measurement.${meas_id}.project_id == ${proj_id} AND technician_name == 'Ivy Nakamura' AND scheduled_at == '2026-08-05T09:00:00.000Z'"
            - "Measurement.${meas_id}.status == 'COMPLETED' AND completed_at == '2026-08-01T00:00:00.000Z' (the logical clock, not scheduled_at)"
            - "Measurement.${meas_id}.measured_units == 420.00 AND subfloor_condition == 'MINOR' AND obstruction_count == 2 AND stair_flight_count == 1"
            - "Measurement.${meas_id}.variance_pct == 0.00 AND change_order_triggered == false AND voided_reason == null"
            - "Project.${proj_id}.fulfillment_status == 'MEASURED' AND effective_units == 420.00"

      - name: service_category_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /service-categories]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three categories stored, limit 2 offset 0 returns 2 items with total_count 3 and has_more true; limit 2 offset 2 returns 1 item with has_more false."
        test_recipe:
          setup:
            - "Three ServiceCategory rows exist: FLOOR-LVP, FLOOR-DIRECT and FLOOR-QUICK."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-LVP", name: "LVP Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: true, measurement_validity_days: 45, permit_policy: "BY_JURISDICTION", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_lvp: $.data.id }
            - call: "POST /service-categories"
              payload: { code: "FLOOR-DIRECT", name: "Direct-Ship Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: false, permit_policy: "NEVER", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_direct: $.data.id }
            - call: "POST /service-categories"
              payload: { code: "FLOOR-QUICK", name: "Quick-Ship Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: false, permit_policy: "BY_JURISDICTION", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_quick: $.data.id }
          trigger:
            - call: "GET /service-categories"
              payload: { limit: 2, offset: 0 }
              as: ProjectCoordinator
            - call: "GET /service-categories"
              payload: { limit: 2, offset: 2 }
              as: ProjectCoordinator
            - call: "GET /service-categories"
              payload: { trade_code: "FLOORING", status: "ACTIVE" }
              as: ProjectCoordinator
          assert:
            - "First page: response_type == 'array', exactly 2 items, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second page: exactly 1 item, total_count == 3, has_more == false, offset == 2"
            - "Unpaginated filtered call applies the default limit 10 and offset 0 and returns all 3 rows with has_more == false"
            - "The two pages are disjoint and their union is exactly {${cat_lvp}, ${cat_direct}, ${cat_quick}}"

      - name: unknown_project_id_returns_project_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_PROJECT_NOT_FOUND
          - validations[priority=6]
          - endpoints[GET /projects/{id}]
          - response_envelope.error
        distinguishing_aspect: "GET /projects/{id} for a well-formed but unstored UUID returns HTTP 404 with response_type 'error' and data.error_id == 'ERR_PROJECT_NOT_FOUND'."
        test_recipe:
          setup:
            - "Empty database — no Project row was ever created."
          setup_api_calls:
            - call: "GET /_clock"
              payload: {}
              as: ProgramAdmin
              captures: { now: $.data.current_utc }
          trigger:
            - call: "GET /projects/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ProjectCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with response_type == 'error'"
            - "${err} == 'ERR_PROJECT_NOT_FOUND' and data.message is a non-empty string"
            - "No Project row is created as a side effect of the failed read"

      - name: project_create_missing_required_fields_returns_missing_required_field
        claim_type: required_fields
        grounds:
          - errors.ERR_MISSING_REQUIRED_FIELD
          - validations[priority=3]
          - endpoints[POST /projects]
        distinguishing_aspect: "A POST /projects body omitting estimated_units and requested_install_date is rejected with ERR_MISSING_REQUIRED_FIELD (422) before any FK lookup runs, and no Project row is created."
        test_recipe:
          setup:
            - "FLOOR-DIRECT category, METRO-02 jurisdiction and one Customer exist, so every FK in the body is valid — only the two omitted fields are wrong."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-DIRECT", name: "Direct-Ship Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: false, permit_policy: "NEVER", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "METRO-02", name: "Harbor District", permit_required_trades: [], permit_responsible_party: "RETAILER", inspection_required: false, min_liability_coverage_cents: 100000000, permit_unit_threshold: 0, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.00, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "18 Larch Way" }
              as: ProjectCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with ${err} == 'ERR_MISSING_REQUIRED_FIELD'"
            - "GET /projects returns total_count == 0 — no partial Project row was written"
            - "Customer.${cust_id}.project_count == 0 — the counter side effect did not run"

      - name: service_category_bad_enum_and_negative_minimum_are_rejected
        claim_type: type_constraints
        grounds:
          - entities.ServiceCategory.fields.trade_code
          - entities.ServiceCategory.fields.minimum_billable_units
          - validations[priority=4]
          - validations[priority=5]
          - errors.ERR_INVALID_FIELD_TYPE
          - errors.ERR_FIELD_OUT_OF_RANGE
        distinguishing_aspect: "trade_code 'PLUMBING' is outside the declared enum set and yields ERR_INVALID_FIELD_TYPE (422); minimum_billable_units -5.00 breaks the >= 0 range and yields ERR_FIELD_OUT_OF_RANGE (422) — two different error categories from the same entity."
        test_recipe:
          setup:
            - "Empty database; clock at 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "GET /_clock"
              payload: {}
              as: ProgramAdmin
              captures: { now: $.data.current_utc }
          trigger:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-BAD1", name: "Bad Trade", trade_code: "PLUMBING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: false }
              as: ProgramAdmin
              captures: { err_enum: $.data.error_id }
            - call: "POST /service-categories"
              payload: { code: "FLOOR-BAD2", name: "Bad Minimum", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: -5.00, measurement_required: false }
              as: ProgramAdmin
              captures: { err_range: $.data.error_id }
          assert:
            - "${err_enum} == 'ERR_INVALID_FIELD_TYPE' with HTTP 422 (enum membership is a type failure, priority 4)"
            - "${err_range} == 'ERR_FIELD_OUT_OF_RANGE' with HTTP 422 (range failure, priority 5)"
            - "GET /service-categories returns total_count == 0 — neither rejected body created a row"

      - name: scorecard_event_is_immutable_with_no_version_field_and_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.ScorecardEvent
          - endpoints[POST /installers/{id}/scorecard-events]
          - endpoints[GET /installers/{id}/scorecard-events]
          - calculations.installer_scorecard
        distinguishing_aspect: "ScorecardEvent is declared common_fields false: the created row exposes no version and no updated_at, §1.5 declares no PATCH for it, and its three persisted deltas are never rewritten by a later event."
        test_recipe:
          setup:
            - "One Installer exists (status APPLIED is sufficient — scorecard events do not require activation)."
          setup_api_calls:
            - call: "POST /installers"
              payload: { legal_name: "Northside Flooring LLC", contact_email: "ops@northside.example", primary_trade_code: "FLOORING", liability_coverage_cents: 200000000, insurance_expires_on: "2027-06-30T00:00:00.000Z" }
              as: NetworkManager
              captures: { inst_id: $.data.id }
            - call: "POST /installers/${inst_id}/scorecard-events"
              payload: { event_type: "PUNCH_MAJOR", occurred_at: "2026-07-20T00:00:00.000Z" }
              as: ServiceManager
              captures: { ev1_id: $.data.id, ev1_q: $.data.quality_delta }
          trigger:
            - call: "POST /installers/${inst_id}/scorecard-events"
              payload: { event_type: "CSAT_SURVEY", occurred_at: "2026-07-22T00:00:00.000Z", csat_score: 5 }
              as: ServiceManager
              captures: { ev2_id: $.data.id }
            - call: "GET /installers/${inst_id}/scorecard-events"
              payload: { limit: 10, offset: 0 }
              as: ServiceManager
          assert:
            - "ScorecardEvent.${ev1_id} response body carries id, created_at, installer_id, event_type and the three deltas, but NO version and NO updated_at field"
            - "${ev1_q} == -8.00 and ScorecardEvent.${ev1_id}.quality_delta is still -8.00 after the second event is appended"
            - "ScorecardEvent.${ev1_id}.source == 'MANUAL' AND ScorecardEvent.${ev2_id}.satisfaction_delta == 10.00 AND ScorecardEvent.${ev2_id}.quality_delta == 0.00"
            - "§1.5 declares no PATCH or DELETE on any /installers/{id}/scorecard-events path — correction is only possible by appending a new row"
            - "GET /installers/${inst_id}/scorecard-events returns total_count == 2"

      - name: credential_naming_an_unknown_jurisdiction_returns_jurisdiction_not_found
        claim_type: foreign_key_integrity
        grounds:
          - entities.InstallerCredential.fields.jurisdiction_id
          - validations[priority=7]
          - errors.ERR_JURISDICTION_NOT_FOUND
          - endpoints[POST /installers/{id}/credentials]
          - complexity_profile.entity_topology
        distinguishing_aspect: "With a flat topology every FK is validated as a stored reference: a credential body naming an unstored jurisdiction_id is rejected with ERR_JURISDICTION_NOT_FOUND (404) and the installer stays APPLIED with verified_credential_count 0."
        test_recipe:
          setup:
            - "One Installer in status APPLIED; no Jurisdiction row matching the id used in the trigger exists."
          setup_api_calls:
            - call: "POST /installers"
              payload: { legal_name: "Northside Flooring LLC", contact_email: "ops@northside.example", primary_trade_code: "FLOORING", liability_coverage_cents: 200000000, insurance_expires_on: "2027-06-30T00:00:00.000Z" }
              as: NetworkManager
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /installers/${inst_id}/credentials"
              payload: { jurisdiction_id: "00000000-0000-4000-8000-0000000000ff", trade_code: "FLOORING", license_number: "FL-99213", license_expires_on: "2027-05-31T00:00:00.000Z", permit_pulling_authorized: true }
              as: NetworkManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with ${err} == 'ERR_JURISDICTION_NOT_FOUND'"
            - "GET /installers/${inst_id}/credentials returns total_count == 0"
            - "Installer.${inst_id}.status == 'APPLIED' — the APPLIED -> DOCS_PENDING hop did not fire, because no credential row was created"

      - name: project_quoted_labor_cents_is_frozen_at_creation
        claim_type: computed_fields
        grounds:
          - entities.Project.fields.quoted_labor_cents
          - calculations.project_labor_charge
        excluded_because:
          difficulty_instance: "dual_variant_calc / project_labor_charge_provisional_versus_final_diverge_on_same_project"
          rationale: "That instance asserts quoted_labor_cents is unchanged after the measurement and after the accepted change order, while final_labor_cents diverges — the freeze claim is its core assertion."

  # ==========================================================================
  # SECTION — state_machines  (Table 2; state_machine_shape: parallel)
  # ==========================================================================
  - section: state_machines
    instances:

      - name: credential_and_background_pair_walks_the_installer_to_verified_then_active
        claim_type: valid_transition
        grounds:
          - state_machines.Installer.APPLIED_to_DOCS_PENDING
          - state_machines.Installer.DOCS_PENDING_to_VERIFIED
          - state_machines.Installer.VERIFIED_to_ACTIVE
          - state_machines.InstallerCredential.PENDING_to_VERIFIED
          - endpoints[POST /installers/{id}/credentials]
          - endpoints[POST /installer-credentials/{id}/verify]
          - endpoints[POST /installers/{id}/background-check]
          - endpoints[POST /installers/{id}/activate]
        distinguishing_aspect: "The DOCS_PENDING -> VERIFIED hop fires on whichever of the two admissions completes the pair LAST: after the credential VERIFY alone the installer is still DOCS_PENDING, and only the background PASS moves it to VERIFIED."
        test_recipe:
          setup:
            - "Jurisdiction METRO-01 exists; one Installer has just been created in status APPLIED."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "METRO-01", name: "Metro County", permit_required_trades: ["FLOORING", "HVAC", "ROOFING"], permit_responsible_party: "RETAILER", inspection_required: true, min_liability_coverage_cents: 100000000, permit_unit_threshold: 250.00, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.15, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /installers"
              payload: { legal_name: "Northside Flooring LLC", contact_email: "ops@northside.example", primary_trade_code: "FLOORING", liability_coverage_cents: 200000000, insurance_expires_on: "2027-06-30T00:00:00.000Z" }
              as: NetworkManager
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /installers/${inst_id}/credentials"
              payload: { jurisdiction_id: "${jur_id}", trade_code: "FLOORING", license_number: "FL-99213", license_expires_on: "2027-05-31T00:00:00.000Z", permit_pulling_authorized: true }
              as: NetworkManager
              captures: { cred_id: $.data.id }
            - call: "GET /installers/${inst_id}"
              payload: {}
              as: NetworkManager
              captures: { st_after_cred: $.data.status }
            - call: "POST /installer-credentials/${cred_id}/verify"
              payload: { verification_decision: "VERIFY" }
              as: NetworkManager
            - call: "GET /installers/${inst_id}"
              payload: {}
              as: NetworkManager
              captures: { st_after_verify: $.data.status }
            - call: "POST /installers/${inst_id}/background-check"
              payload: { result: "PASS", completed_at: "2026-07-15T00:00:00.000Z" }
              as: NetworkManager
              captures: { st_after_bg: $.data.status }
            - call: "POST /installers/${inst_id}/activate"
              payload: {}
              as: NetworkManager
              captures: { st_after_activate: $.data.status }
          assert:
            - "${st_after_cred} == 'DOCS_PENDING' — the first credential row drives APPLIED -> DOCS_PENDING"
            - "${st_after_verify} == 'DOCS_PENDING' — the credential is VERIFIED but the background check is still NONE, so the pair is incomplete"
            - "InstallerCredential.${cred_id}.verification_status == 'VERIFIED' AND verified_at == '2026-08-01T00:00:00.000Z' AND Installer.${inst_id}.verified_credential_count == 1"
            - "${st_after_bg} == 'VERIFIED' — the background PASS completed the pair"
            - "${st_after_activate} == 'ACTIVE' AND Installer.${inst_id}.composite_score == 85.00 AND removal_eligible == false"

      - name: activating_an_installer_from_docs_pending_is_rejected_as_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.Installer.VERIFIED_to_ACTIVE
          - validations[priority=12]
          - errors.ERR_INVALID_STATE
          - endpoints[POST /installers/{id}/activate]
        distinguishing_aspect: "VERIFIED -> ACTIVE is the only in-edge of ACTIVE from the admission path: calling activate while the installer is DOCS_PENDING returns ERR_INVALID_STATE (409) and leaves the status untouched."
        test_recipe:
          setup:
            - "One Installer in DOCS_PENDING: a credential row exists but it is still PENDING and no background check has been recorded."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "METRO-01", name: "Metro County", permit_required_trades: ["FLOORING", "HVAC", "ROOFING"], permit_responsible_party: "RETAILER", inspection_required: true, min_liability_coverage_cents: 100000000, permit_unit_threshold: 250.00, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.15, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /installers"
              payload: { legal_name: "Northside Flooring LLC", contact_email: "ops@northside.example", primary_trade_code: "FLOORING", liability_coverage_cents: 200000000, insurance_expires_on: "2027-06-30T00:00:00.000Z" }
              as: NetworkManager
              captures: { inst_id: $.data.id }
            - call: "POST /installers/${inst_id}/credentials"
              payload: { jurisdiction_id: "${jur_id}", trade_code: "FLOORING", license_number: "FL-99213", license_expires_on: "2027-05-31T00:00:00.000Z", permit_pulling_authorized: true }
              as: NetworkManager
              captures: { cred_id: $.data.id }
          trigger:
            - call: "POST /installers/${inst_id}/activate"
              payload: {}
              as: NetworkManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with ${err} == 'ERR_INVALID_STATE'"
            - "Installer.${inst_id}.status == 'DOCS_PENDING' — unchanged"
            - "Installer.${inst_id}.composite_score == 85.00 AND removal_eligible == false — the activate side effects (scorecard run) did not execute"

      - name: newly_created_children_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.Measurement.initial_state
          - state_machines.MaterialDelivery.initial_state
          - endpoints[POST /projects/{id}/measurements]
          - endpoints[POST /projects/{id}/material-deliveries]
          - entities.MaterialDelivery.fields.delay_days
        distinguishing_aspect: "A booked Measurement starts in SCHEDULED with completed_at null, and a planned MaterialDelivery starts in PLANNED with delay_days 0 — booking the measurement does not itself move the project, which POST /projects already set to MEASURE_PENDING."
        test_recipe:
          setup:
            - "FLOOR-LVP category in METRO-01 with one Customer and one 420.00-unit project, created directly into MEASURE_PENDING because the category requires a measurement."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-LVP", name: "LVP Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: true, measurement_validity_days: 45, permit_policy: "BY_JURISDICTION", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "METRO-01", name: "Metro County", permit_required_trades: ["FLOORING", "HVAC", "ROOFING"], permit_responsible_party: "RETAILER", inspection_required: true, min_liability_coverage_cents: 100000000, permit_unit_threshold: 250.00, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.15, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "18 Larch Way", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id, fs_at_create: $.data.fulfillment_status }
          trigger:
            - call: "POST /projects/${proj_id}/measurements"
              payload: { scheduled_at: "2026-08-05T09:00:00.000Z", technician_name: "Ivy Nakamura" }
              as: ProjectCoordinator
              captures: { meas_id: $.data.id }
            - call: "POST /projects/${proj_id}/material-deliveries"
              payload: { promised_window_start: "2026-08-22T08:00:00.000Z", promised_window_end: "2026-08-24T08:00:00.000Z", sku_count: 6, material_cost_cents: 250000 }
              as: ProjectCoordinator
              captures: { deliv_id: $.data.id }
          assert:
            - "${fs_at_create} == 'MEASURE_PENDING' — set by POST /projects itself, not by the measurement booking"
            - "Measurement.${meas_id}.status == 'SCHEDULED' AND completed_at == null AND measured_units == null AND variance_pct == null AND change_order_triggered == false"
            - "MaterialDelivery.${deliv_id}.status == 'PLANNED' AND delay_days == 0 AND actual_delivered_at == null"
            - "Project.${proj_id}.fulfillment_status == 'MEASURE_PENDING' after both children are created"

      - name: completing_an_already_completed_measurement_is_rejected_as_already_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Measurement.terminal_states
          - validations[priority=13]
          - errors.ERR_ALREADY_TERMINAL
          - endpoints[POST /measurements/{id}/complete]
        distinguishing_aspect: "COMPLETED is terminal for Measurement: a second POST /measurements/{id}/complete returns ERR_ALREADY_TERMINAL (409) and does not rewrite measured_units, completed_at or the project's effective_units."
        test_recipe:
          setup:
            - "FLOOR-LVP project in METRO-01 with one Measurement already completed at measured_units 420.00 (variance 0.00, so the project sits in MEASURED)."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-LVP", name: "LVP Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: true, measurement_validity_days: 45, permit_policy: "BY_JURISDICTION", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "METRO-01", name: "Metro County", permit_required_trades: ["FLOORING", "HVAC", "ROOFING"], permit_responsible_party: "RETAILER", inspection_required: true, min_liability_coverage_cents: 100000000, permit_unit_threshold: 250.00, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.15, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "18 Larch Way", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/measurements"
              payload: { scheduled_at: "2026-08-05T09:00:00.000Z", technician_name: "Ivy Nakamura" }
              as: ProjectCoordinator
              captures: { meas_id: $.data.id }
            - call: "POST /measurements/${meas_id}/complete"
              payload: { measured_units: 420.00, subfloor_condition: "MINOR", obstruction_count: 2, stair_flight_count: 1 }
              as: ProjectCoordinator
              captures: { mv1: $.data.version }
          trigger:
            - call: "POST /measurements/${meas_id}/complete"
              payload: { measured_units: 500.00, subfloor_condition: "MAJOR", obstruction_count: 9, stair_flight_count: 4 }
              as: ProjectCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with ${err} == 'ERR_ALREADY_TERMINAL'"
            - "Measurement.${meas_id}.measured_units == 420.00 AND subfloor_condition == 'MINOR' AND obstruction_count == 2 AND stair_flight_count == 1 — none of the second body's values landed"
            - "Measurement.${meas_id}.version == ${mv1} — no write occurred"
            - "Project.${proj_id}.effective_units == 420.00 AND fulfillment_status == 'MEASURED'"

      - name: verifying_an_already_verified_credential_a_second_time_is_rejected
        claim_type: idempotency
        grounds:
          - state_machines.InstallerCredential.PENDING_to_VERIFIED
          - validations[priority=12]
          - errors.ERR_INVALID_STATE
          - endpoints[POST /installer-credentials/{id}/verify]
        distinguishing_aspect: "VERIFY is defined only from PENDING: replaying it on a VERIFIED credential returns ERR_INVALID_STATE (409) rather than silently succeeding, and verified_at keeps its first value."
        test_recipe:
          setup:
            - "One Installer with a single credential already VERIFIED at the startup clock; the installer is DOCS_PENDING because no background check has been filed."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "METRO-01", name: "Metro County", permit_required_trades: ["FLOORING", "HVAC", "ROOFING"], permit_responsible_party: "RETAILER", inspection_required: true, min_liability_coverage_cents: 100000000, permit_unit_threshold: 250.00, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.15, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /installers"
              payload: { legal_name: "Northside Flooring LLC", contact_email: "ops@northside.example", primary_trade_code: "FLOORING", liability_coverage_cents: 200000000, insurance_expires_on: "2027-06-30T00:00:00.000Z" }
              as: NetworkManager
              captures: { inst_id: $.data.id }
            - call: "POST /installers/${inst_id}/credentials"
              payload: { jurisdiction_id: "${jur_id}", trade_code: "FLOORING", license_number: "FL-99213", license_expires_on: "2027-05-31T00:00:00.000Z", permit_pulling_authorized: true }
              as: NetworkManager
              captures: { cred_id: $.data.id }
            - call: "POST /installer-credentials/${cred_id}/verify"
              payload: { verification_decision: "VERIFY" }
              as: NetworkManager
              captures: { cv1: $.data.version }
          trigger:
            - call: "POST /installer-credentials/${cred_id}/verify"
              payload: { verification_decision: "VERIFY" }
              as: NetworkManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with ${err} == 'ERR_INVALID_STATE'"
            - "InstallerCredential.${cred_id}.verification_status == 'VERIFIED' AND verified_at == '2026-08-01T00:00:00.000Z' AND version == ${cv1}"
            - "Installer.${inst_id}.verified_credential_count == 1 — not double-counted"
            - "Installer.${inst_id}.status == 'DOCS_PENDING'"

      - name: delivery_cycles_planned_delayed_in_transit_then_delivers_on_the_promise
        claim_type: valid_transition
        grounds:
          - state_machines.MaterialDelivery.PLANNED_to_DELAYED
          - state_machines.MaterialDelivery.DELAYED_to_IN_TRANSIT
          - state_machines.MaterialDelivery.IN_TRANSIT_to_DELIVERED
          - calculations.delivery_sync_slack
          - endpoints[POST /material-deliveries/{id}/status]
        distinguishing_aspect: "The DELAYED <-> IN_TRANSIT pair may repeat without limit, and an actual_delivered_at exactly equal to promised_window_end yields delay_days 0 — the DELAYED history does not by itself make the delivery late."
        test_recipe:
          setup:
            - "FLOOR-DIRECT project in METRO-02 with one MaterialDelivery promised [2026-08-22T08:00:00.000Z, 2026-08-24T08:00:00.000Z]."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-DIRECT", name: "Direct-Ship Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: false, permit_policy: "NEVER", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "METRO-02", name: "Harbor District", permit_required_trades: [], permit_responsible_party: "RETAILER", inspection_required: false, min_liability_coverage_cents: 100000000, permit_unit_threshold: 0, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.00, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "18 Larch Way", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/material-deliveries"
              payload: { promised_window_start: "2026-08-22T08:00:00.000Z", promised_window_end: "2026-08-24T08:00:00.000Z", sku_count: 6, material_cost_cents: 250000 }
              as: ProjectCoordinator
              captures: { deliv_id: $.data.id }
          trigger:
            - call: "POST /material-deliveries/${deliv_id}/status"
              payload: { new_status: "DELAYED" }
              as: ProjectCoordinator
            - call: "POST /material-deliveries/${deliv_id}/status"
              payload: { new_status: "IN_TRANSIT" }
              as: ProjectCoordinator
            - call: "POST /material-deliveries/${deliv_id}/status"
              payload: { new_status: "DELAYED" }
              as: ProjectCoordinator
            - call: "POST /material-deliveries/${deliv_id}/status"
              payload: { new_status: "IN_TRANSIT" }
              as: ProjectCoordinator
            - call: "POST /material-deliveries/${deliv_id}/status"
              payload: { new_status: "DELIVERED", actual_delivered_at: "2026-08-24T08:00:00.000Z" }
              as: ProjectCoordinator
              captures: { final_status: $.data.status, dd: $.data.delay_days }
          assert:
            - "Every hop returns HTTP 200 — the DELAYED <-> IN_TRANSIT cycle is traversed twice with no limit"
            - "${final_status} == 'DELIVERED' AND ${dd} == 0, because actual_delivered_at == promised_window_end gives max(0, 0) / 86400 = 0"
            - "MaterialDelivery.${deliv_id}.actual_delivered_at == '2026-08-24T08:00:00.000Z' AND version == 6 (one bump per status write)"
            - "Project.${proj_id}.fulfillment_status == 'MEASURED' throughout — delivery status is an independent dimension"

      - name: permit_resubmission_returns_the_dimension_to_pending_application
        claim_type: valid_transition
        grounds:
          - state_machines.Project.permit_status.PENDING_APPLICATION_to_APPLIED
          - state_machines.Project.permit_status.APPLIED_to_PENDING_APPLICATION
          - state_machines.Project.permit_status.APPLIED_to_ISSUED
          - entities.Project.fields.permit_application_reference
          - entities.Project.fields.permit_fee_cents_billed
          - endpoints[POST /projects/{id}/permit/apply]
          - endpoints[POST /projects/{id}/permit/issue]
        distinguishing_aspect: "APPLIED -> PENDING_APPLICATION fires only when resubmit is true, and the second application overwrites permit_application_reference; the issue hop then bills permit_fee_cents_billed 25000 while final_labor_cents is still null so total_due_cents stays 0."
        test_recipe:
          setup:
            - "FLOOR-QUICK category (measurement_required false, permit_policy BY_JURISDICTION) and Jurisdiction METRO-01 (FLOORING permitted trade, threshold 250.00, RETAILER)."
            - "One 420.00-unit project, so permit_responsibility is RETAILER and permit_status starts at PENDING_APPLICATION."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-QUICK", name: "Quick-Ship Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: false, permit_policy: "BY_JURISDICTION", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
