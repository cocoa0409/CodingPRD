      - name: agreement_quantity_conservation
        grounds:
          - entities.PlantingAgreement.fields.delivered_quantity
          - entities.PlantingAgreement.fields.remaining_quantity
          - entities.PlantingAgreement.fields.released_quantity
          - state_machines.PlantingAgreement.FULFILLING_to_BREACHED
        distinguishing_aspect: |
          Conserved quantity: agreement units. committed == delivered +
          remaining + released holds while active (40 + 60 + 0 == 100 after a
          partial acceptance) AND after the compensating window-close breach
          (40 + 0 + 60 == 100). Different conserved quantity from grant cents.
        test_recipe:
          setup:
            - "Standard chain through SIGNED agreement committed 100 (window weeks 5..10); one delivery qty 40 ACCEPTED (delivered 40)"
          setup_api_calls:
            - { call: "POST /f2s/program-years", payload: { school_year_label: "Y1", start_date: "2026-07-01", end_date: "2027-06-24", local_radius_miles: 100, preference_model: "TIERED", grant_award_cents: 1000000, local_spend_target_pct: 30 }, as: DistrictProgramAdmin, captures: { yr: $.data.id } }
