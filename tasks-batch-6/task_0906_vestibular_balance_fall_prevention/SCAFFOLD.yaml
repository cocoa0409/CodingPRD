scenario: |
  906. Vestibular, Balance & Fall-Prevention Clinic: referral & balance/gait
  assessment, plan & session, home-safety & fall-risk, assistive-device referral,
  insurance & visit-cap, evidence-based community-program linkage, reassessment,
  outcome

domain_name: vestibular-balance-fall-prevention
api_prefix: "/"

complexity_profile:
  primary_archetype: quota_allocation          # finite authorized-visit pool reserved/committed/released
  secondary_archetype: temporal_windowing      # clinician + room scheduling with overlap/buffer rules
  complexity_layers:
    - optimistic_concurrency                   # CREATE-with-supersede on CommunityProgramLinkage vs CarePlan.version
    - cascading_side_effects                   # discharge → cancel sessions → release visits + reverse billing
    - dual_variant_calculation                 # screening vs clinical fall-risk; estimated vs billed responsibility
    - derived_field_reconciliation             # visits_used and patient_responsibility_cents kept consistent
  entity_topology: flat                        # peer entities linked by foreign keys; no ownership URL nesting
  state_machine_shape: cyclic                  # CarePlan ACTIVE↔UNDER_REASSESSMENT; Session runs parallel dimensions
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles                       # IntakeCoordinator / Clinician / ClinicSupervisor own different surfaces
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: patient legal name
      - name: date_of_birth
        type: string
        source: input
        description: ISO date (YYYY-MM-DD)
      - name: insurance_member_id
        type: string
        source: input
        description: payer member identifier
      - name: status
        type: enum
        source: system
        description: lifecycle flag
        default: ACTIVE
        constraints: "one of {ACTIVE, DISCHARGED}"

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the referred patient"
      - name: referral_source
        type: string
        source: input
        description: referring provider / source
      - name: reason
        type: string
        source: input
        description: reason for referral (dizziness, recurrent falls, etc.)
      - name: status
        type: enum
        source: system
        description: referral triage state
        default: RECEIVED
        constraints: "one of {RECEIVED, ACCEPTED, DECLINED}"

  - name: Clinician
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: clinician name
      - name: discipline
        type: enum
        source: input
        description: therapy discipline
        constraints: "one of {PT, OT}"
      - name: npi
        type: string
        source: input
        description: national provider identifier

  - name: TherapyRoom
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: room label
      - name: room_type
        type: enum
        source: input
        description: room capability
        constraints: "one of {BALANCE_GYM, EXAM, GAIT_LAB}"

  - name: Assessment
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; assessed patient"
      - name: referral_id
        type: string
        source: input
        description: "FK -> Referral.id; originating referral"
      - name: clinician_id
        type: string
        source: input
        description: "FK -> Clinician.id; assessing clinician (owner for finalize)"
      - name: gait_speed_m_s
        type: number
        source: input
        description: measured comfortable gait speed in meters/second
      - name: tug_seconds
        type: number
        source: input
        description: Timed-Up-and-Go completion time in seconds
      - name: berg_balance_score
        type: integer
        source: input
        description: Berg Balance Scale total
        constraints: "0..56"
      - name: medication_count
        type: integer
        source: input
        description: count of prescription medications (polypharmacy input)
      - name: self_report_fall_count
        type: integer
        source: input
        description: self-reported falls in prior 12 months
      - name: screening_score
        type: integer
        source: computed
        description: "provisional self-report screening score; computed at create (see calc fall_risk_score / screening variant)"
      - name: clinical_score
        type: integer
        source: computed
        description: "final measured composite score; computed at finalize (see calc fall_risk_score / clinical variant)"
      - name: fall_risk_tier
        type: enum
        source: computed
        description: "risk tier derived from clinical_score at finalize"
        constraints: "one of {LOW, MODERATE, HIGH}; null until FINALIZED"
      - name: status
        type: enum
        source: system
        description: assessment lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, FINALIZED}"

  - name: CarePlan
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; plan owner patient"
      - name: assessment_id
        type: string
        source: input
        description: "FK -> Assessment.id; must be FINALIZED at plan create; supplies intake tier"
      - name: fall_risk_tier
        type: enum
        source: computed
        description: "current tier; copied from originating assessment at create, overwritten by finalized reassessment"
        constraints: "one of {LOW, MODERATE, HIGH}"
      - name: target_visits
        type: integer
        source: computed
        description: "planned visit count derived from fall_risk_tier (HIGH=12, MODERATE=8, LOW=4); recomputed on reassessment finalize"
      - name: estimated_patient_responsibility_cents
        type: integer
        source: computed
        description: "forward-looking estimate; computed when an authorization is APPROVED (target_visits * per_visit_copay_cents); null until then"
      - name: patient_responsibility_cents
        type: integer
        source: computed
        description: "running actual patient responsibility = sum of copay_cents over Sessions whose billing_status == BILLED"
        default: 0
      - name: status
        type: enum
        source: system
        description: care-plan lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, UNDER_REASSESSMENT, DISCHARGED}"

  - name: InsuranceAuthorization
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; covered patient"
      - name: care_plan_id
        type: string
        source: input
        description: "FK -> CarePlan.id; plan this authorization funds"
      - name: payer_name
        type: string
        source: input
        description: insurer name
      - name: visits_authorized
        type: integer
        source: input
        description: hard cap on reserved visits under this authorization
      - name: allowed_amount_cents
        type: integer
        source: input
        description: payer allowed amount per visit, in cents
      - name: coinsurance_pct
        type: number
        source: input
        description: patient coinsurance fraction (0..1)
      - name: visits_used
        type: integer
        source: computed
        description: "count of Sessions with authorization_id == this.id AND attendance_status IN {SCHEDULED, ATTENDED, NO_SHOW}"
        default: 0
      - name: status
        type: enum
        source: system
        description: authorization lifecycle
        default: PENDING
        constraints: "one of {PENDING, APPROVED, DENIED}"

  - name: Session
    parent: null
    common_fields: true
    fields:
      - name: care_plan_id
        type: string
        source: input
        description: "FK -> CarePlan.id; must be ACTIVE at schedule time"
      - name: clinician_id
        type: string
        source: input
        description: "FK -> Clinician.id; treating clinician (owner for attend/no-show)"
      - name: room_id
        type: string
        source: input
        description: "FK -> TherapyRoom.id; booked room"
      - name: authorization_id
        type: string
        source: input
        description: "FK -> InsuranceAuthorization.id; must be APPROVED; reserves one visit"
      - name: scheduled_start
        type: datetime
        source: input
        description: ISO 8601 UTC session start (inclusive)
      - name: scheduled_end
        type: datetime
        source: input
        description: ISO 8601 UTC session end (exclusive)
      - name: cpt_code
        type: string
        source: input
        description: billed procedure code
      - name: copay_cents
        type: integer
        source: computed
        description: "per-visit patient copay stamped at attend = round_half_up(allowed_amount_cents * coinsurance_pct); 0 until BILLED"
        default: 0
      - name: attendance_status
        type: enum
        source: system
        description: attendance dimension (independent of billing_status)
        default: SCHEDULED
        constraints: "one of {SCHEDULED, ATTENDED, NO_SHOW, CANCELLED}"
      - name: billing_status
        type: enum
        source: system
        description: billing dimension (independent of attendance_status)
        default: UNBILLED
        constraints: "one of {UNBILLED, BILLED, REVERSED}"

  - name: HomeSafetyEvaluation
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; evaluated patient"
      - name: care_plan_id
        type: string
        source: input
        description: "FK -> CarePlan.id; associated plan"
      - name: loose_rugs
        type: integer
        source: input
        description: count of loose-rug hazards
      - name: poor_lighting_rooms
        type: integer
        source: input
        description: count of poorly lit rooms
      - name: missing_grab_bars
        type: integer
        source: input
        description: count of locations missing grab bars
      - name: unsecured_stairs
        type: integer
        source: input
        description: count of stair runs without railings
      - name: clutter_pathways
        type: integer
        source: input
        description: count of cluttered walk paths
      - name: home_hazard_score
        type: integer
        source: computed
        description: "weighted hazard total computed at finalize (see calc home_hazard_score)"
      - name: hazard_tier
        type: enum
        source: computed
        description: "hazard tier derived from home_hazard_score at finalize"
        constraints: "one of {LOW, MODERATE, HIGH}; null until FINALIZED"
      - name: generated_device_referral_id
        type: string
        source: computed
        description: "id of the AssistiveDeviceReferral auto-created on finalize when hazard_tier == HIGH; null otherwise (back-pointer, not an input FK)"
      - name: status
        type: enum
        source: system
        description: evaluation lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, FINALIZED}"

  - name: AssistiveDeviceReferral
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; referred patient"
      - name: care_plan_id
        type: string
        source: input
        description: "FK -> CarePlan.id; associated plan"
      - name: home_safety_evaluation_id
        type: string
        source: input
        description: "FK -> HomeSafetyEvaluation.id; nullable; set to the finalized evaluation when source == AUTO_HAZARD, omitted for manual referrals"
      - name: device_type
        type: enum
        source: input
        description: device requested
        constraints: "one of {CANE, WALKER, ROLLATOR, GRAB_BAR}"
      - name: source
        type: enum
        source: system
        description: how the referral originated
        default: MANUAL
        constraints: "one of {MANUAL, AUTO_HAZARD}"
      - name: status
        type: enum
        source: system
        description: device-referral lifecycle
        default: PENDING
        constraints: "one of {PENDING, APPROVED, DECLINED, DISPENSED}"

  - name: CommunityProgramLinkage
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; linked patient"
      - name: care_plan_id
        type: string
        source: input
        description: "FK -> CarePlan.id; must be ACTIVE at link time; at most one non-terminal linkage per plan (new supersedes prior)"
      - name: assessment_id
        type: string
        source: input
        description: "FK -> Assessment.id; eligibility source; must be FINALIZED with fall_risk_tier IN {MODERATE, HIGH}"
      - name: program_name
        type: enum
        source: input
        description: evidence-based community fall-prevention program
        constraints: "one of {MATTER_OF_BALANCE, TAI_CHI_MOVING_FOR_BETTER_BALANCE, STEPPING_ON, OTAGO}"
      - name: status
        type: enum
        source: system
        description: linkage lifecycle
        default: REFERRED
        constraints: "one of {REFERRED, ENROLLED, COMPLETED, DECLINED, WITHDRAWN}"

  - name: Reassessment
    parent: null
    common_fields: true
    fields:
      - name: care_plan_id
        type: string
        source: input
        description: "FK -> CarePlan.id; plan being reassessed; must be ACTIVE at create"
      - name: clinician_id
        type: string
        source: input
        description: "FK -> Clinician.id; reassessing clinician (owner for finalize)"
      - name: gait_speed_m_s
        type: number
        source: input
        description: re-measured gait speed m/s
      - name: tug_seconds
        type: number
        source: input
        description: re-measured Timed-Up-and-Go seconds
      - name: berg_balance_score
        type: integer
        source: input
        description: re-measured Berg Balance Scale total
        constraints: "0..56"
      - name: medication_count
        type: integer
        source: input
        description: current prescription medication count
      - name: self_report_fall_count
        type: integer
        source: input
        description: self-reported falls since prior assessment
      - name: clinical_score
        type: integer
        source: computed
        description: "final composite score computed at finalize (same formula as Assessment clinical variant)"
      - name: fall_risk_tier
        type: enum
        source: computed
        description: "tier derived from clinical_score at finalize"
        constraints: "one of {LOW, MODERATE, HIGH}; null until FINALIZED"
      - name: status
        type: enum
        source: system
        description: reassessment lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, FINALIZED}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Referral
    initial_state: RECEIVED
    terminal_states: [DECLINED]
    transitions:
      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST /referrals/{id}/decision {decision: ACCEPT}"
        actor: IntakeCoordinator
        preconditions: ["referral.status == RECEIVED"]
        side_effects: ["referral.status = ACCEPTED"]
      - from: RECEIVED
        to: DECLINED
        trigger: "POST /referrals/{id}/decision {decision: DECLINE}"
        actor: IntakeCoordinator
        preconditions: ["referral.status == RECEIVED"]
        side_effects: ["referral.status = DECLINED"]

  - entity: Assessment
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /assessments/{id}/finalize"
        actor: Clinician
        preconditions:
          - "assessment.status == DRAFT"
          - "acting Clinician X-User-ID == assessment.clinician_id (else ERR_NOT_OWNER)"
        side_effects:
          - "compute clinical_score (calc fall_risk_score / clinical variant)"
          - "set fall_risk_tier from clinical_score"

  - entity: CarePlan
    initial_state: DRAFT
    terminal_states: [DISCHARGED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /care-plans/{id}/activate"
        actor: ClinicSupervisor
        preconditions: ["care_plan.status == DRAFT"]
        side_effects: ["care_plan.status = ACTIVE"]
      - from: ACTIVE
        to: UNDER_REASSESSMENT
        trigger: "POST /care-plans/{id}/reassessments (create Reassessment)"
        actor: Clinician
        preconditions:
          - "care_plan.status == ACTIVE"
          - "payload expected_care_plan_version == care_plan.version (else ERR_STALE_PLAN_VERSION)"
        side_effects:
          - "create Reassessment(status=DRAFT)"
          - "care_plan.status = UNDER_REASSESSMENT"
          - "increment care_plan.version by 1"
        note: "cyclic: pairs with the UNDER_REASSESSMENT -> ACTIVE transition below"
      - from: UNDER_REASSESSMENT
        to: ACTIVE
        trigger: "POST /reassessments/{id}/finalize"
        actor: Clinician
        preconditions:
          - "care_plan.status == UNDER_REASSESSMENT"
          - "reassessment.status == DRAFT"
          - "acting Clinician X-User-ID == reassessment.clinician_id (else ERR_NOT_OWNER)"
        side_effects:
          - "compute reassessment.clinical_score and reassessment.fall_risk_tier"
          - "CASCADE hop2: care_plan.fall_risk_tier = reassessment.fall_risk_tier; care_plan.target_visits recomputed from new tier; care_plan.status = ACTIVE"
        note: "cascade #2 (depth 2): Reassessment FINALIZED -> CarePlan tier/target/status updated"
      - from: ACTIVE
        to: DISCHARGED
        trigger: "POST /care-plans/{id}/discharge"
        actor: ClinicSupervisor
        preconditions: ["care_plan.status == ACTIVE"]
        side_effects:
          - "care_plan.status = DISCHARGED"
          - "CASCADE hop2: every Session with care_plan_id == plan.id AND attendance_status == SCHEDULED transitions attendance_status = CANCELLED (ATTENDED/NO_SHOW sessions are left intact)"
          - "CASCADE hop3 (per cancelled Session, caused by hop2): that Session's authorization.visits_used is recomputed downward (its reservation is released). Cancelled sessions here are always SCHEDULED/UNBILLED, so no billing reversal occurs in this cascade."
        note: "cascade #1 (depth 3): CarePlan -> Session -> InsuranceAuthorization(visits_used)"

  - entity: InsuranceAuthorization
    initial_state: PENDING
    terminal_states: [DENIED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /authorizations/{id}/decision {decision: APPROVE}"
        actor: ClinicSupervisor
        preconditions: ["authorization.status == PENDING"]
        side_effects:
          - "authorization.status = APPROVED"
          - "compute care_plan.estimated_patient_responsibility_cents = care_plan.target_visits * per_visit_copay_cents (calc care_plan_responsibility / estimated variant)"
      - from: PENDING
        to: DENIED
        trigger: "POST /authorizations/{id}/decision {decision: DENY}"
        actor: ClinicSupervisor
        preconditions: ["authorization.status == PENDING"]
        side_effects: ["authorization.status = DENIED"]

  - entity: Session
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ATTENDED
        trigger: "POST /sessions/{id}/attend"
        actor: Clinician
        preconditions:
          - "session.attendance_status == SCHEDULED"
          - "acting Clinician X-User-ID == session.clinician_id (else ERR_NOT_OWNER)"
        side_effects:
          - "attendance_status = ATTENDED"
          - "billing_status = BILLED (parallel dimension)"
          - "stamp copay_cents = round_half_up(allowed_amount_cents * coinsurance_pct)"
          - "care_plan.patient_responsibility_cents += copay_cents (calc care_plan_responsibility / billed variant)"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /sessions/{id}/no-show"
        actor: Clinician
        preconditions:
          - "session.attendance_status == SCHEDULED"
          - "acting Clinician X-User-ID == session.clinician_id (else ERR_NOT_OWNER)"
        side_effects:
          - "attendance_status = NO_SHOW"
          - "billing_status unchanged (stays UNBILLED); the reserved visit is NOT released (no-show consumes the authorized visit)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /sessions/{id}/cancel"
        actor: IntakeCoordinator
        preconditions: ["session.attendance_status == SCHEDULED"]
        side_effects:
          - "attendance_status = CANCELLED"
          - "authorization.visits_used recomputed downward (reservation released)"
      - from: ATTENDED
        to: CANCELLED
        trigger: "POST /sessions/{id}/cancel"
        actor: IntakeCoordinator
        preconditions: ["session.attendance_status == ATTENDED"]
        side_effects:
          - "attendance_status = CANCELLED"
          - "billing_status = REVERSED (compensating action)"
          - "care_plan.patient_responsibility_cents -= copay_cents (reverse the billed variant)"
          - "authorization.visits_used recomputed downward (reservation released)"
        note: "attendance and billing are parallel dimensions: attendance SCHEDULED/ATTENDED/NO_SHOW/CANCELLED evolves independently of billing UNBILLED/BILLED/REVERSED"

  - entity: HomeSafetyEvaluation
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /home-safety-evaluations/{id}/finalize"
        actor: Clinician
        preconditions: ["home_safety_evaluation.status == DRAFT"]
        side_effects:
          - "compute home_hazard_score and hazard_tier (calc home_hazard_score)"
          - "CASCADE hop2 (caused by finalize): if hazard_tier == HIGH, create AssistiveDeviceReferral(source=AUTO_HAZARD, status=PENDING, home_safety_evaluation_id=this.id, device_type = (missing_grab_bars > 0 ? GRAB_BAR : ROLLATOR)); set generated_device_referral_id"
        note: "cascade #2 (depth 2): HomeSafetyEvaluation FINALIZED -> AssistiveDeviceReferral created"

  - entity: AssistiveDeviceReferral
    initial_state: PENDING
    terminal_states: [DECLINED, DISPENSED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /device-referrals/{id}/decision {decision: APPROVE}"
        actor: ClinicSupervisor
        preconditions: ["device_referral.status == PENDING"]
        side_effects: ["status = APPROVED"]
      - from: PENDING
        to: DECLINED
        trigger: "POST /device-referrals/{id}/decision {decision: DECLINE}"
        actor: ClinicSupervisor
        preconditions: ["device_referral.status == PENDING"]
        side_effects: ["status = DECLINED"]
      - from: APPROVED
        to: DISPENSED
        trigger: "POST /device-referrals/{id}/decision {decision: DISPENSE}"
        actor: ClinicSupervisor
        preconditions: ["device_referral.status == APPROVED"]
        side_effects: ["status = DISPENSED"]

  - entity: CommunityProgramLinkage
    initial_state: REFERRED
    terminal_states: [COMPLETED, DECLINED, WITHDRAWN]
    transitions:
      - from: REFERRED
        to: ENROLLED
        trigger: "POST /community-linkages/{id}/status {new_status: ENROLLED}"
        actor: IntakeCoordinator
        preconditions: ["linkage.status == REFERRED"]
        side_effects: ["status = ENROLLED"]
      - from: ENROLLED
        to: COMPLETED
        trigger: "POST /community-linkages/{id}/status {new_status: COMPLETED}"
        actor: IntakeCoordinator
        preconditions: ["linkage.status == ENROLLED"]
        side_effects: ["status = COMPLETED"]
      - from: REFERRED
        to: DECLINED
        trigger: "POST /community-linkages/{id}/status {new_status: DECLINED}"
        actor: IntakeCoordinator
        preconditions: ["linkage.status == REFERRED"]
        side_effects: ["status = DECLINED"]
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /community-linkages/{id}/status {new_status: WITHDRAWN}"
        actor: IntakeCoordinator
        preconditions: ["linkage.status == ENROLLED"]
        side_effects: ["status = WITHDRAWN"]
      - from: REFERRED
        to: WITHDRAWN
        trigger: "system: superseded by a newer linkage on the same CarePlan (POST /community-linkages create)"
        actor: system
        preconditions: ["linkage.status IN {REFERRED, ENROLLED}"]
        side_effects: ["status = WITHDRAWN (supersession side-effect of a fresh linkage create)"]
        note: "supersession: creating a new linkage on a plan withdraws the prior non-terminal linkage"

  - entity: Reassessment
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /reassessments/{id}/finalize"
        actor: Clinician
        preconditions:
          - "reassessment.status == DRAFT"
          - "parent care_plan.status == UNDER_REASSESSMENT"
          - "acting Clinician X-User-ID == reassessment.clinician_id (else ERR_NOT_OWNER)"
        side_effects:
          - "compute clinical_score and fall_risk_tier"
          - "drives CarePlan UNDER_REASSESSMENT -> ACTIVE cascade (see CarePlan machine)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: linkage-create-stale-plan
    parent_entity: CarePlan
    write_endpoint: "POST /community-linkages"
    occ_field: "expected_care_plan_version"
    description: |
      Creating a CommunityProgramLinkage against a CarePlan whose version has
      advanced since the client last observed it is rejected. A fresh linkage
      legitimately supersedes the prior non-terminal linkage on the same plan
      (setting it WITHDRAWN) and bumps the plan version; a client whose
      expected_care_plan_version is behind the plan's current version has not
      observed that supersede and is rejected with a stale-version error. The
      plan remains ACTIVE throughout, so the rejection is purely a version
      mismatch, not a state precondition.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: fall_risk_score
    trigger: "screening variant at POST /assessments (create); clinical variant at POST /assessments/{id}/finalize and POST /reassessments/{id}/finalize"
    algorithm: weighted_scoring
    formula: |
      # --- screening variant (provisional, self-report only) ---
      screening_score = self_report_fall_count * 10
                      + (medication_count >= POLYPHARMACY_THRESHOLD ? 15 : 0)

      # --- clinical variant (final, measured functional tests) ---
      gait_pts = (gait_speed_m_s < 0.60) ? 30
               : (gait_speed_m_s < 0.80) ? 20
               : (gait_speed_m_s < 1.00) ? 10 : 0
      tug_pts  = (tug_seconds >= 13.5) ? 30
               : (tug_seconds >= 12.0) ? 20
               : (tug_seconds >= 10.0) ? 10 : 0
      berg_pts = (berg_balance_score <= 20) ? 30
               : (berg_balance_score <= 40) ? 15 : 0
      med_pts  = (medication_count >= POLYPHARMACY_THRESHOLD) ? 10 : 0
      hist_pts = (self_report_fall_count >= 2) ? 10
               : (self_report_fall_count == 1) ? 5 : 0
      clinical_score = gait_pts + tug_pts + berg_pts + med_pts + hist_pts   # 0..110
      fall_risk_tier = (clinical_score >= HIGH_TIER_THRESHOLD)     ? HIGH
                     : (clinical_score >= MODERATE_TIER_THRESHOLD) ? MODERATE : LOW
    input_set: "single Assessment/Reassessment row; measured fields for clinical, self-report fields for screening"
    constants:
      POLYPHARMACY_THRESHOLD: 4
      HIGH_TIER_THRESHOLD: 50
      MODERATE_TIER_THRESHOLD: 25
    precision: "integer points; comparisons use >= (inclusive) and < (exclusive) exactly as written"
    variants:
      - name: screening
        when: "at Assessment create (DRAFT); before functional tests are measured"
        difference: "uses only self_report_fall_count and medication_count; ignores gait/tug/berg; does NOT set fall_risk_tier"
      - name: clinical
        when: "at Assessment/Reassessment finalize"
        difference: "full measured composite; sets fall_risk_tier; typically diverges from screening_score for the same row"

  - name: target_visits_from_tier
    trigger: "at CarePlan create (from originating assessment tier) and at reassessment finalize (from new tier)"
    algorithm: threshold
    formula: |
      target_visits = (fall_risk_tier == HIGH)     ? 12
                    : (fall_risk_tier == MODERATE) ? 8
                    : 4
    input_set: "the CarePlan's current fall_risk_tier"
    constants:
      HIGH_TARGET: 12
      MODERATE_TARGET: 8
      LOW_TARGET: 4
    precision: "integer"

  - name: session_copay
    trigger: "at POST /sessions/{id}/attend"
    algorithm: aggregation
    formula: |
      per_visit_copay_cents = round_half_up(allowed_amount_cents * coinsurance_pct)
      session.copay_cents = per_visit_copay_cents
    input_set: "the session's authorization allowed_amount_cents and coinsurance_pct"
    constants: {}
    precision: "round_half_up to whole cents at the per-session level"

  - name: care_plan_responsibility
    trigger: "estimated variant at authorization APPROVE; billed variant on every session attend/cancel"
    algorithm: aggregation
    formula: |
      per_visit_copay_cents = round_half_up(allowed_amount_cents * coinsurance_pct)

      # --- estimated variant (forward-looking, at auth APPROVE) ---
      estimated_patient_responsibility_cents = target_visits * per_visit_copay_cents

      # --- billed variant (actual, running) ---
      # ROUNDING ORDER PINNED: round EACH session copay to whole cents FIRST,
      # THEN sum. (round-per-session-then-sum, NEVER sum-then-round.)
      patient_responsibility_cents =
          sum over Sessions s where s.billing_status == BILLED of s.copay_cents
    input_set: "estimated: single plan target_visits x per-visit copay; billed: Sessions with billing_status == BILLED for the plan"
    constants: {}
    precision: "each copay_cents already rounded_half_up at attend; the running sum adds pre-rounded integers (round-per-session-then-sum)"
    variants:
      - name: estimated
        when: "at authorization APPROVE, before any visit is delivered"
        difference: "projects target_visits * per_visit_copay_cents; a single forward estimate"
      - name: billed
        when: "running total as sessions are attended/cancelled"
        difference: "sums realized per-session copays; diverges from estimated whenever delivered visits != target_visits"

  - name: home_hazard_score
    trigger: "at POST /home-safety-evaluations/{id}/finalize"
    algorithm: weighted_scoring
    formula: |
      home_hazard_score = loose_rugs*3 + poor_lighting_rooms*2 + missing_grab_bars*5
                        + unsecured_stairs*5 + clutter_pathways*2
      hazard_tier = (home_hazard_score >= HAZARD_HIGH_THRESHOLD)     ? HIGH
                  : (home_hazard_score >= HAZARD_MODERATE_THRESHOLD) ? MODERATE : LOW
    input_set: "the single evaluation's five hazard counts"
    constants:
      HAZARD_HIGH_THRESHOLD: 20
      HAZARD_MODERATE_THRESHOLD: 10
    precision: "integer; tier comparisons inclusive (>=)"

  - name: outcome_summary
    trigger: "on demand at GET /care-plans/{id}/outcome"
    algorithm: projection
    formula: |
      origin_assessment      = Assessment(care_plan.assessment_id)   # FINALIZED
      latest_reassessment    = the Reassessment with care_plan_id == plan.id AND
                               status == FINALIZED, chosen by MAX(created_at);
                               tie-break: largest version (never id); null if none
      tier_at_intake         = origin_assessment.fall_risk_tier
      tier_current           = care_plan.fall_risk_tier
      clinical_score_delta   = latest_reassessment ?
                               latest_reassessment.clinical_score - origin_assessment.clinical_score
                               : null
      attended_visit_count   = count(Session s: s.care_plan_id == plan.id
                               AND s.attendance_status == ATTENDED)
      total_patient_responsibility_cents = care_plan.patient_responsibility_cents
      improvement_flag       = (clinical_score_delta != null AND clinical_score_delta < 0)
    input_set: "originating assessment, finalized reassessments, attended sessions, plan running responsibility"
    constants: {}
    precision: "integer counts and cents; delta may be null when no finalized reassessment exists"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and valid"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "acting role is permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "for owner-scoped Clinician operations, X-User-ID equals the target resource's clinician_id"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "POST /assessments/{id}/finalize, POST /reassessments/{id}/finalize, POST /sessions/{id}/attend, POST /sessions/{id}/no-show"

  - priority: 4
    category: business_constraint
    check: "required body fields present with correct type; enum fields hold a declared member"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all writes"

  - priority: 4
    category: business_constraint
    check: "enum-typed field carries a value outside its declared set"
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "all writes with enum inputs"

  - priority: 5
    category: existence
    check: "every referenced resource id (path + FK body fields) resolves, validated left-to-right"
    error_id: ERR_PATIENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing patient_id / other entity ids (per-entity NOT_FOUND variants apply)"

  - priority: 6
    category: state
    check: "target resource is in a state that admits this transition (generic)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "CarePlan create requires the referenced Assessment.status == FINALIZED"
    error_id: ERR_ASSESSMENT_NOT_FINALIZED
    http_status: 409
    applies_to: "POST /care-plans"

  - priority: 6
    category: state
    check: "scheduling/linking requires care_plan.status == ACTIVE"
    error_id: ERR_PLAN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /sessions, POST /community-linkages, POST /care-plans/{id}/reassessments"

  - priority: 6
    category: state
    check: "scheduling requires authorization.status == APPROVED"
    error_id: ERR_AUTH_NOT_APPROVED
    http_status: 409
    applies_to: "POST /sessions"

  - priority: 7
    category: business_constraint
    check: "scheduled_end must be strictly after scheduled_start"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 400
    applies_to: "POST /sessions"

  - priority: 8
    category: business_referential
    check: "community linkage requires referenced Assessment FINALIZED with fall_risk_tier IN {MODERATE, HIGH}"
    error_id: ERR_TIER_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /community-linkages"

  - priority: 9
    category: business_temporal
    check: "no other non-CANCELLED Session for the same clinician whose [start,end) interval overlaps (half-open; adjacency end==start allowed)"
    error_id: ERR_CLINICIAN_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /sessions"

  - priority: 9
    category: business_temporal
    check: "no other non-CANCELLED Session in the same room within ROOM_TURNOVER_BUFFER_MINUTES (gap between prev.end and next.start must be >= 15 min; overlap also rejected)"
    error_id: ERR_ROOM_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /sessions"

  - priority: 10
    category: business_fiscal
    check: "authorization.visits_used < authorization.visits_authorized (reject when used would reach or exceed the cap)"
    error_id: ERR_VISIT_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /sessions"

  - priority: 11
    category: state
    check: "expected_care_plan_version equals current CarePlan.version on supersede-create"
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412
    applies_to: "POST /community-linkages"

