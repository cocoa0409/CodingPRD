        grounds:
          - state_machines.Case.STAGED_to_CREMATED
          - state_machines.CremationBatch.FIRING_to_COMPLETED
          - entities.Case.fields.batch_id
        distinguishing_aspect: >
          Pair Case->CremationBatch: a STAGED case only becomes CREMATED when its batch is
          COMPLETED; before completion (batch FIRING) the case stays STAGED — verified by
          firing without completing.
        test_recipe:
          setup:
            - "Clock 2026-03-14T00:00:00Z; PRIVATE case STAGED in a batch that is FIRING (not completed)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
