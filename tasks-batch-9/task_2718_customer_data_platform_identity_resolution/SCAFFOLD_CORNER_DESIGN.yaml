  # ===========================================================================
  # SECTION 3 — CALCULATIONS (12 rules; algorithms weighted_scoring, aggregation,
  # projection, constraint_propagation, waterfall_allocation, chronological,
  # threshold, plus three dual-variant rules)
  # ===========================================================================
  - section: calculations
    instances:
      - name: dq_pass_rate_aggregates_valid_over_submitted_records
        claim_type: correct_result
        grounds:
          - calculations.batch_data_quality_score
          - calculations.source_system_dq_pass_rate
          - endpoints[POST /cdp/ingest-batches/{batchId}/validate]
        distinguishing_aspect: "The scaffold's own worked example is reproduced end to end under the default WEIGHTED_COMPONENTS mode: record scores 1.00 / 0.60 / 0.55 give dq_score 0.72, valid_record_count 2, and a source dq_pass_rate of 2/3 = 0.6667."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One SourceSystem with the default dq_scoring_mode WEIGHTED_COMPONENTS and default pii_completeness_floor 0.70."
            - "One RECEIVED batch of three records: R1 with all five components valid; R2 with a malformed phone (7 digits) and an absent loyalty_number; R3 with an absent email and an absent postal_code."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /cdp/source-systems"
              payload:
                code: "CA_CORRECT"
                display_name: "Correct Result Feed"
                channel_type: "TRANSACTIONS"
                trust_tier: 3
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { src_id: "$.data.id" }
            - call: "POST /cdp/ingest-batches"
              payload:
                source_system_id: "${src_id}"
                batch_label: "Correct Result Triple"
                records:
                  - external_id: "CR1"
                    email_raw: "cr1@example.com"
                    phone_raw: "+1 (555) 400-0001"
                    loyalty_number: "LY00004001"
                    first_name: "Ada"
                    last_name: "Alpha"
                    postal_code: "10001"
                    address_line: null
                    event_timestamp: "2026-07-30T10:00:00Z"
                    consent_signals: []
                  - external_id: "CR2"
                    email_raw: "cr2@example.com"
                    phone_raw: "555-0002"
                    loyalty_number: null
                    first_name: "Ben"
                    last_name: "Bravo"
                    postal_code: "20002"
                    address_line: null
                    event_timestamp: "2026-07-30T11:00:00Z"
                    consent_signals: []
                  - external_id: "CR3"
                    email_raw: null
                    phone_raw: "+1 (555) 400-0003"
                    loyalty_number: "LY00004003"
                    first_name: "Cleo"
                    last_name: "Chase"
                    postal_code: null
                    address_line: null
                    event_timestamp: "2026-07-30T12:00:00Z"
                    consent_signals: []
              as: DataEngineer
              as_user_id: "u_eng"
              captures: { batch_id: "$.data.id" }
          trigger:
            - call: "POST /cdp/ingest-batches/${batch_id}/validate"
              payload: {}
              as: DataEngineer
              as_user_id: "u_eng"
          assert:
            - "the response status is 200"
            - "IngestBatch.${batch_id}.dq_score == 0.72 (record scores 1.00, 0.30+0.15+0.15 = 0.60 and 0.20+0.20+0.15 = 0.55; 2.15 / 3 = 0.716666 rounded half up to 0.72)"
            - "IngestBatch.${batch_id}.valid_record_count == 2 and invalid_record_count == 1 (R3 at 0.55 is below DQ_RECORD_MIN 0.60)"
            - "IngestBatch.${batch_id}.dq_failure_breakdown == { phone_norm: 1 } — absent components never appear, only the malformed phone"
            - "IngestBatch.${batch_id}.status == VALIDATED because 0.72 >= 0.70"
