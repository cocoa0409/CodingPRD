            - { call: "POST /youth-ministry/scholarship-applications/${app1}/decide", payload: {decision: "APPROVE"}, as: ScholarshipReviewer, as_user_id: "reviewer-1", captures: {award1: $.data.award_cents} }
            - { call: "GET /youth-ministry/programs/${prog_id}", as: ProgramDirector, captures: {avail_mid: $.data.scholarship_available_cents} }
            - { call: "POST /youth-ministry/scholarship-applications/${app2}/decide", payload: {decision: "APPROVE"}, as: ScholarshipReviewer, as_user_id: "reviewer-1", captures: {err2: $.data.error_id} }
          assert:
            - "award1 == 75000 (need_cap round_half_up(0.75*0.5*200000)=75000 equals available exactly — the min-chain's last link binds at equality)"
            - "avail_mid == 0 (available == 0 is a legal post-approve state)"
            - "err2 == ERR_SCHOLARSHIP_FUND_EXHAUSTED with http 402 (gate is available <= 0, hit exactly at 0)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: review_approve_requires_all_required_consent_forms_verified
        grounds:
          - state_machines.Registration.SUBMITTED_to_APPROVED
          - state_machines.ConsentForm.SUBMITTED_to_VERIFIED
          - errors[ERR_REQUIRED_FORMS_INCOMPLETE]
        distinguishing_aspect: |
          Entity pair Registration <- ConsentForm: the review-APPROVE transition
          reads the state of THREE sibling ConsentForm rows; with
          CONDUCT_AGREEMENT merely SUBMITTED (not VERIFIED) the fork to
          APPROVED/WAITLISTED is unreachable, and it becomes reachable only after
          that sibling flips — capacity is not the blocker here.
        test_recipe:
          setup:
            - "Trip Alpha REGISTRATION_OPEN, capacity 30; reg1 SUBMITTED with PARENTAL_CONSENT VERIFIED, MEDICAL_RELEASE VERIFIED, CONDUCT_AGREEMENT SUBMITTED (unverified)"
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "Youth 2026", ministry_year: "2026-2027", scholarship_fund_total_cents: 0, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog_id: $.data.id} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog_id}", name: "Alpha", destination_name: "Lima", destination_type: "INTERNATIONAL", start_date: "2027-06-15", end_date: "2027-06-25", capacity_youth: 30, base_cost_cents: 200000, deposit_cents: 50000, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z", emergency_protocol_text: "Protocol"}, as: ProgramDirector, captures: {trip_id: $.data.id} }
            - { call: "POST /youth-ministry/trips/${trip_id}/open-registration", as: ProgramDirector }
