          rationale: "ERR_BUILD_NOT_READY asserted by the named §1.8 instance."
      - name: rental_not_ready_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_RENTAL_NOT_READY]"]
        excluded_because:
