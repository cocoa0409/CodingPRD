# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Property Disposition & Sale Process Management
# Canonical fixtures (verified by executing the §1.3 formulas):
#   Alpha: YM loan 3.0B @650bps, m=46, ds 19.0M/mo, defeasance fee 50M, lockout past
#     direct-cap hold 4,545,454,545 / DCF hold 4,472,790,059 (noi 250M, g 300, d 800, exit 600, 5y)
#     YM penalty @reinv 400 = 266,132,822 ; accrued 12d = 6,500,000 ; PAYOFF total 3,272,632,822
#     DEFEASANCE total 3,433,231,264 (round-once; per-month rounding would give 3,433,231,265)
#   Delta: STEP_DOWN loan 800M @550bps, m=46 -> 4% = 32,000,000 ; accrued 15d = 1,833,333 ; total 833,833,333
#   Prorations (closing 2026-10-15, tax 18,250,000 from 2026-01-01, rent 4,960,000, cam 7,300,000):
#     ACTUAL_365: tax 14,350,000 / rent 2,720,000 / cam 1,560,000 (credit 17,070,000, debit 1,560,000)
#     BANKERS_360: tax 14,397,222 / rent 2,645,333 / cam 1,541,111 (credit 17,042,555, debit 1,541,111)
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: broker_commission_provisional_vs_final
        grounds:
          - calculations.broker_commission
          - entities.BrokerEngagement.fields.commission_provisional_cents
          - entities.BrokerEngagement.fields.commission_final_cents
        distinguishing_aspect: |
          BrokerEngagement-domain dual variant: the SAME tiered commission rule produces a
          provisional value at execute (price 5,000,000,000 -> 72,500,000) and a final value at
          record_closing after two accepted retrades moved price to 4,841,200,000 -> 70,912,000;
          both variants are persisted on distinct fields and MUST differ.
        test_recipe:
          setup:
            - "Alpha asset (YM loan) marketed through full bid pipeline; PSA executed at price 5,000,000,000 with closing 2026-10-30; both deposits POSTED; two retrades accepted (60,000,000 then 200,000,000 capped to 98,800,000); payoff CONFIRMED; statement APPROVED on the reduced price; DD lapsed; begin_closing done"
          setup_api_calls:
            - { call: "POST /disposition/assets", payload: { name: "Alpha", market: "Dallas", asset_type: OFFICE, noi_cents: 250000000, noi_growth_bps: 300, book_value_cents: 4000000000, guidance_price_cents: 5000000000, loan_balance_cents: 3000000000, loan_rate_bps: 650, loan_maturity_date: "2030-06-30T00:00:00Z", monthly_debt_service_cents: 19000000, remaining_term_months: 46, prepayment_type: YIELD_MAINTENANCE, prepayment_lockout_until: "2026-01-01T00:00:00Z", defeasance_allowed: true, defeasance_fee_cents: 50000000 }, as: DispositionManager, captures: { a_id: $.data.id, a_v: $.data.version } }
            - { call: "POST /disposition/analyses", payload: { asset_id: "${a_id}", expected_asset_version: "${a_v}", cap_rate_bps: 550, discount_rate_bps: 800, exit_cap_rate_bps: 600, hold_years: 5, selected_method: DIRECT_CAP, est_sale_price_cents: 5200000000, est_selling_costs_cents: 200000000 }, as: AssetAnalyst, as_user_id: analyst-1, captures: { an_id: $.data.id } }
            - { call: "POST /disposition/analyses/${an_id}/submit", as: AssetAnalyst, as_user_id: analyst-1 }
            - { call: "POST /disposition/analyses/${an_id}/decide", payload: { decision: APPROVE }, as: InvestmentCommittee, as_user_id: ic-1 }
            - { call: "POST /disposition/engagements", payload: { asset_id: "${a_id}", broker_firm_name: "BrokerCo", broker_user_id: "broker-1", window_start: "2026-08-10T00:00:00Z", window_end: "2027-02-10T00:00:00Z" }, as: DispositionManager, as_user_id: dm-1, captures: { eng_id: $.data.id } }
            - { call: "POST /disposition/engagements/${eng_id}/activate", as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/packages", payload: { asset_id: "${a_id}" }, as: AssetAnalyst, as_user_id: analyst-1, captures: { pkg_id: $.data.id } }
            - { call: "POST /disposition/packages/${pkg_id}/upload_document", payload: { documents: [ { category: RENT_ROLL, file_name: "rr.pdf" }, { category: OPERATING_STATEMENTS, file_name: "os.pdf" }, { category: TITLE_COMMITMENT, file_name: "tc.pdf" }, { category: SURVEY, file_name: "sv.pdf" }, { category: ENVIRONMENTAL_REPORT, file_name: "er.pdf" }, { category: LEASES, file_name: "ls.pdf" }, { category: TAX_BILLS, file_name: "tb.pdf" }, { category: SERVICE_CONTRACTS, file_name: "sc.pdf" } ] }, as: AssetAnalyst, as_user_id: analyst-1 }
            - { call: "POST /disposition/packages/${pkg_id}/verify_document", payload: { categories: [RENT_ROLL, OPERATING_STATEMENTS, TITLE_COMMITMENT, SURVEY, ENVIRONMENTAL_REPORT, LEASES, TAX_BILLS, SERVICE_CONTRACTS] }, as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/packages/${pkg_id}/publish", as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/assets/${a_id}/list", as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/assets/${a_id}/open_offers", payload: { offers_deadline: "2026-09-15T00:00:00Z" }, as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/bidders", payload: { asset_id: "${a_id}", organization_name: "BuyerCo", proof_of_funds_cents: 1500000000 }, as: Broker, as_user_id: broker-1, captures: { bidr_id: $.data.id } }
            - { call: "POST /disposition/bidders/${bidr_id}/qualify", as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/bids", payload: { asset_id: "${a_id}", bidder_id: "${bidr_id}", price_cents: 5000000000, deposit_cents: 150000000, dd_period_days: 30, closing_period_days: 45 }, as: Buyer, as_user_id: "${bidr_id}", captures: { bid_id: $.data.id } }
            - { call: "POST /disposition/_clock/set_current_utc", payload: { to_iso8601: "2026-09-16T00:00:00Z" }, as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/assets/${a_id}/close_offers", as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/bids/${bid_id}/shortlist", as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/bids/${bid_id}/select", as: DispositionManager, as_user_id: dm-1 }
            - { call: "GET /disposition/assets/${a_id}", as: DispositionManager, captures: { a_v2: $.data.version } }
            - { call: "POST /disposition/psas", payload: { asset_id: "${a_id}", bid_id: "${bid_id}", proration_convention: ACTUAL_365, expected_asset_version: "${a_v2}" }, as: DispositionManager, as_user_id: dm-1, captures: { psa_id: $.data.id } }
            - { call: "POST /disposition/psas/${psa_id}/execute", payload: { closing_date: "2026-10-30T00:00:00Z" }, as: DispositionManager, as_user_id: dm-1 }
            - { call: "GET /disposition/assets/${a_id}/engagements", as: DispositionManager, captures: { eng_prov_at_exec: "$.data[0].commission_provisional_cents" } }
            - { call: "GET /disposition/psas/${psa_id}/deposits", as: ClosingOfficer, captures: { dep_init: "$.data[0].id", dep_add: "$.data[1].id" } }
            - { call: "POST /disposition/deposits/${dep_init}/post", as: ClosingOfficer, as_user_id: co-1 }
            - { call: "POST /disposition/deposits/${dep_add}/post", as: ClosingOfficer, as_user_id: co-1 }
            - { call: "POST /disposition/psas/${psa_id}/open_dd", as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/dd-items", payload: { psa_id: "${psa_id}", category: PHYSICAL, description: "roof", requested_reduction_cents: 60000000 }, as: Buyer, as_user_id: "${bidr_id}", captures: { dd1: $.data.id } }
            - { call: "POST /disposition/dd-items/${dd1}/respond", payload: { decision: ACCEPT }, as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/dd-items", payload: { psa_id: "${psa_id}", category: FINANCIAL, description: "cam audit", requested_reduction_cents: 200000000 }, as: Buyer, as_user_id: "${bidr_id}", captures: { dd2: $.data.id } }
            - { call: "POST /disposition/dd-items/${dd2}/respond", payload: { decision: ACCEPT }, as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/payoffs", payload: { asset_id: "${a_id}", method: PAYOFF, reinvestment_rate_bps: 400, accrued_days: 12, anticipated_settlement_date: "2026-10-30T00:00:00Z" }, as: DispositionManager, as_user_id: dm-1, captures: { po_id: $.data.id } }
            - { call: "POST /disposition/payoffs/${po_id}/confirm", as: LoanServicer, as_user_id: ls-1 }
            - { call: "POST /disposition/statements", payload: { psa_id: "${psa_id}", property_tax_annual_cents: 0, tax_period_start: "2026-01-01T00:00:00Z", rent_monthly_cents: 0, cam_annual_cents: 0 }, as: ClosingOfficer, as_user_id: co-1, captures: { st_id: $.data.id } }
            - { call: "POST /disposition/statements/${st_id}/submit", as: ClosingOfficer, as_user_id: co-1 }
            - { call: "POST /disposition/statements/${st_id}/approve", as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/_clock/set_current_utc", payload: { to_iso8601: "2026-10-17T00:00:00Z" }, as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/psas/${psa_id}/lapse_dd", as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/psas/${psa_id}/begin_closing", as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/payoffs/${po_id}/settle", as: ClosingOfficer, as_user_id: co-1 }
          trigger:
            - { call: "POST /disposition/psas/${psa_id}/record_closing", as: ClosingOfficer, as_user_id: co-1 }
            - { call: "GET /disposition/assets/${a_id}/engagements", as: DispositionManager, captures: { eng_final: "$.data[0].commission_final_cents", eng_prov: "$.data[0].commission_provisional_cents", eng_status: "$.data[0].status" } }
            - { call: "GET /disposition/psas/${psa_id}/statements", as: DispositionManager, captures: { st_buyer_due: "$.data[0].buyer_due_cents", st_seller_net: "$.data[0].seller_net_cents" } }
            - { call: "GET /disposition/psas/${psa_id}/escrows", as: DispositionManager, captures: { esc_amount: "$.data[0].amount_cents", esc_status: "$.data[0].status" } }
          assert:
            - "engagement commission provisional at execute (captured eng_prov_at_exec) == 72500000 — tiered commission on price 5,000,000,000"
            - "BrokerEngagement.${eng_id}.commission_provisional_cents == 70912000 after the two retrades (price 4,841,200,000)"
            - "BrokerEngagement.${eng_id}.commission_final_cents == 70912000 — final variant on closing price; differs from the at-execute provisional 72500000"
            - "BrokerEngagement.${eng_id}.status == COMPLETED"
            - "ClosingStatement.${st_id}.buyer_due_cents == 4591200000 and seller_net_cents == 1473449178"
            - "EscrowHoldback.amount_cents == 24206000 (0.5% of 4,841,200,000) and status == HELD"
            - "Asset deal_status == SOLD and final_sale_price_cents == 4841200000"

      - name: loan_exit_payoff_vs_defeasance
        grounds:
          - calculations.defeasance_cost
          - calculations.prepayment_penalty
          - calculations.accrued_interest
        distinguishing_aspect: |
          LoanPayoff-domain dual variant (different entity domain from the commission instance):
          identical loan inputs produce PAYOFF total 3,272,632,822 (balance + accrued + yield
          maintenance) vs DEFEASANCE total 3,433,231,264 (PV collateral + fee); both quotes may
          coexist in QUOTED and MUST carry different totals and disjoint cost fields.
        test_recipe:
          setup:
            - "Alpha asset only (YM loan, defeasance_allowed, lockout already past at default clock 2026-08-01)"
          setup_api_calls:
            - { call: "POST /disposition/assets", payload: { name: "Alpha", market: "Dallas", asset_type: OFFICE, noi_cents: 250000000, noi_growth_bps: 300, book_value_cents: 4000000000, guidance_price_cents: 5000000000, loan_balance_cents: 3000000000, loan_rate_bps: 650, loan_maturity_date: "2030-06-30T00:00:00Z", monthly_debt_service_cents: 19000000, remaining_term_months: 46, prepayment_type: YIELD_MAINTENANCE, prepayment_lockout_until: "2026-01-01T00:00:00Z", defeasance_allowed: true, defeasance_fee_cents: 50000000 }, as: DispositionManager, captures: { a_id: $.data.id } }
          trigger:
            - { call: "POST /disposition/payoffs", payload: { asset_id: "${a_id}", method: PAYOFF, reinvestment_rate_bps: 400, accrued_days: 12, anticipated_settlement_date: "2026-10-30T00:00:00Z" }, as: DispositionManager, as_user_id: dm-1, captures: { po_pay: $.data.id, po_pay_pen: $.data.prepayment_penalty_cents, po_pay_acc: $.data.accrued_interest_cents, po_pay_tot: $.data.total_estimated_cost_cents, po_pay_def: $.data.defeasance_cost_cents } }
            - { call: "POST /disposition/payoffs", payload: { asset_id: "${a_id}", method: DEFEASANCE, reinvestment_rate_bps: 400, accrued_days: 12, anticipated_settlement_date: "2026-10-30T00:00:00Z" }, as: DispositionManager, as_user_id: dm-1, captures: { po_def: $.data.id, po_def_cost: $.data.defeasance_cost_cents, po_def_tot: $.data.total_estimated_cost_cents, po_def_pen: $.data.prepayment_penalty_cents } }
          assert:
            - "PAYOFF quote: prepayment_penalty_cents == 266132822 (yield maintenance with 46-month annuity factor at 400bps reinvestment, above the 1% floor of 30000000)"
            - "PAYOFF quote: accrued_interest_cents == 6500000 and defeasance_cost_cents == 0"
            - "PAYOFF quote: total_estimated_cost_cents == 3272632822"
            - "DEFEASANCE quote: defeasance_cost_cents == 3433231264 and prepayment_penalty_cents == 0"
            - "DEFEASANCE quote: total_estimated_cost_cents == 3433231264"
            - "the two variants diverge: po_pay_tot != po_def_tot (3272632822 vs 3433231264) for identical loan inputs"

      - name: proration_day_count_conventions_diverge
        grounds:
          - calculations.proration_set
          - entities.ClosingStatement.fields.proration_buyer_credit_cents
          - entities.PurchaseAgreement.fields.proration_convention
        distinguishing_aspect: |
          ClosingStatement-domain dual variant (third entity domain): identical proration inputs
          produce buyer credit 17,070,000 / debit 1,560,000 under ACTUAL_365 and credit
          17,042,555 / debit 1,541,111 under BANKERS_360 — the convention is locked on the PSA
          and both pipelines MUST diverge on identical statement inputs.
        test_recipe:
          setup:
            - "Two unlevered assets (P1, P2) each taken through the bid pipeline to an EXECUTED PSA with closing_date 2026-10-15; P1 PSA convention ACTUAL_365, P2 convention BANKERS_360; identical statement inputs (tax 18,250,000 from 2026-01-01, rent 4,960,000, CAM 7,300,000)"
          setup_api_calls:
            - { call: "POST /disposition/assets", payload: { name: "P1", market: "Austin", asset_type: RETAIL, noi_cents: 100000000, noi_growth_bps: 200, book_value_cents: 1500000000, guidance_price_cents: 2000000000, loan_balance_cents: 0, loan_rate_bps: 0, loan_maturity_date: null, monthly_debt_service_cents: 0, remaining_term_months: 0, prepayment_type: NONE, defeasance_allowed: false }, as: DispositionManager, captures: { p1_id: $.data.id, p1_v: $.data.version } }
            - { call: "POST /disposition/analyses", payload: { asset_id: "${p1_id}", expected_asset_version: "${p1_v}", cap_rate_bps: 500, discount_rate_bps: 800, exit_cap_rate_bps: 600, hold_years: 5, selected_method: DIRECT_CAP, est_sale_price_cents: 2100000000, est_selling_costs_cents: 0 }, as: AssetAnalyst, as_user_id: analyst-1, captures: { p1_an: $.data.id } }
            - { call: "POST /disposition/analyses/${p1_an}/submit", as: AssetAnalyst, as_user_id: analyst-1 }
            - { call: "POST /disposition/analyses/${p1_an}/decide", payload: { decision: APPROVE }, as: InvestmentCommittee, as_user_id: ic-1 }
            - { call: "POST /disposition/engagements", payload: { asset_id: "${p1_id}", broker_firm_name: "BrokerCo", broker_user_id: "broker-1", window_start: "2026-08-10T00:00:00Z", window_end: "2027-02-10T00:00:00Z" }, as: DispositionManager, as_user_id: dm-1, captures: { p1_eng: $.data.id } }
            - { call: "POST /disposition/engagements/${p1_eng}/activate", as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/packages", payload: { asset_id: "${p1_id}" }, as: AssetAnalyst, as_user_id: analyst-1, captures: { p1_pkg: $.data.id } }
            - { call: "POST /disposition/packages/${p1_pkg}/upload_document", payload: { documents: [ { category: RENT_ROLL, file_name: "rr.pdf" }, { category: OPERATING_STATEMENTS, file_name: "os.pdf" }, { category: TITLE_COMMITMENT, file_name: "tc.pdf" }, { category: SURVEY, file_name: "sv.pdf" }, { category: ENVIRONMENTAL_REPORT, file_name: "er.pdf" }, { category: LEASES, file_name: "ls.pdf" }, { category: TAX_BILLS, file_name: "tb.pdf" }, { category: SERVICE_CONTRACTS, file_name: "sc.pdf" } ] }, as: AssetAnalyst, as_user_id: analyst-1 }
            - { call: "POST /disposition/packages/${p1_pkg}/verify_document", payload: { categories: [RENT_ROLL, OPERATING_STATEMENTS, TITLE_COMMITMENT, SURVEY, ENVIRONMENTAL_REPORT, LEASES, TAX_BILLS, SERVICE_CONTRACTS] }, as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/packages/${p1_pkg}/publish", as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/assets/${p1_id}/list", as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/assets/${p1_id}/open_offers", payload: { offers_deadline: "2026-09-15T00:00:00Z" }, as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/bidders", payload: { asset_id: "${p1_id}", organization_name: "BuyerCo", proof_of_funds_cents: 600000000 }, as: Broker, as_user_id: broker-1, captures: { p1_bidr: $.data.id } }
            - { call: "POST /disposition/bidders/${p1_bidr}/qualify", as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/bids", payload: { asset_id: "${p1_id}", bidder_id: "${p1_bidr}", price_cents: 2000000000, deposit_cents: 60000000, dd_period_days: 20, closing_period_days: 45 }, as: Buyer, as_user_id: "${p1_bidr}", captures: { p1_bid: $.data.id } }
            - { call: "POST /disposition/_clock/set_current_utc", payload: { to_iso8601: "2026-09-16T00:00:00Z" }, as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/assets/${p1_id}/close_offers", as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/bids/${p1_bid}/shortlist", as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/bids/${p1_bid}/select", as: DispositionManager, as_user_id: dm-1 }
            - { call: "GET /disposition/assets/${p1_id}", as: DispositionManager, captures: { p1_v2: $.data.version } }
            - { call: "POST /disposition/psas", payload: { asset_id: "${p1_id}", bid_id: "${p1_bid}", proration_convention: ACTUAL_365, expected_asset_version: "${p1_v2}" }, as: DispositionManager, as_user_id: dm-1, captures: { p1_psa: $.data.id } }
            - { call: "POST /disposition/psas/${p1_psa}/execute", payload: { closing_date: "2026-10-15T00:00:00Z" }, as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/statements", payload: { psa_id: "${p1_psa}", property_tax_annual_cents: 18250000, tax_period_start: "2026-01-01T00:00:00Z", rent_monthly_cents: 4960000, cam_annual_cents: 7300000 }, as: ClosingOfficer, as_user_id: co-1, captures: { p1_st: $.data.id } }
            - { call: "POST /disposition/assets", payload: { name: "P2", market: "Austin", asset_type: RETAIL, noi_cents: 100000000, noi_growth_bps: 200, book_value_cents: 1500000000, guidance_price_cents: 2000000000, loan_balance_cents: 0, loan_rate_bps: 0, loan_maturity_date: null, monthly_debt_service_cents: 0, remaining_term_months: 0, prepayment_type: NONE, defeasance_allowed: false }, as: DispositionManager, captures: { p2_id: $.data.id, p2_v: $.data.version } }
            - { call: "POST /disposition/analyses", payload: { asset_id: "${p2_id}", expected_asset_version: "${p2_v}", cap_rate_bps: 500, discount_rate_bps: 800, exit_cap_rate_bps: 600, hold_years: 5, selected_method: DIRECT_CAP, est_sale_price_cents: 2100000000, est_selling_costs_cents: 0 }, as: AssetAnalyst, as_user_id: analyst-1, captures: { p2_an: $.data.id } }
            - { call: "POST /disposition/analyses/${p2_an}/submit", as: AssetAnalyst, as_user_id: analyst-1 }
            - { call: "POST /disposition/analyses/${p2_an}/decide", payload: { decision: APPROVE }, as: InvestmentCommittee, as_user_id: ic-1 }
            - { call: "POST /disposition/engagements", payload: { asset_id: "${p2_id}", broker_firm_name: "BrokerCo", broker_user_id: "broker-1", window_start: "2026-08-10T00:00:00Z", window_end: "2027-02-10T00:00:00Z" }, as: DispositionManager, as_user_id: dm-1, captures: { p2_eng: $.data.id } }
            - { call: "POST /disposition/engagements/${p2_eng}/activate", as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/packages", payload: { asset_id: "${p2_id}" }, as: AssetAnalyst, as_user_id: analyst-1, captures: { p2_pkg: $.data.id } }
            - { call: "POST /disposition/packages/${p2_pkg}/upload_document", payload: { documents: [ { category: RENT_ROLL, file_name: "rr.pdf" }, { category: OPERATING_STATEMENTS, file_name: "os.pdf" }, { category: TITLE_COMMITMENT, file_name: "tc.pdf" }, { category: SURVEY, file_name: "sv.pdf" }, { category: ENVIRONMENTAL_REPORT, file_name: "er.pdf" }, { category: LEASES, file_name: "ls.pdf" }, { category: TAX_BILLS, file_name: "tb.pdf" }, { category: SERVICE_CONTRACTS, file_name: "sc.pdf" } ] }, as: AssetAnalyst, as_user_id: analyst-1 }
            - { call: "POST /disposition/packages/${p2_pkg}/verify_document", payload: { categories: [RENT_ROLL, OPERATING_STATEMENTS, TITLE_COMMITMENT, SURVEY, ENVIRONMENTAL_REPORT, LEASES, TAX_BILLS, SERVICE_CONTRACTS] }, as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/packages/${p2_pkg}/publish", as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/assets/${p2_id}/list", as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/assets/${p2_id}/open_offers", payload: { offers_deadline: "2026-09-15T00:00:00Z" }, as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/bidders", payload: { asset_id: "${p2_id}", organization_name: "BuyerCo", proof_of_funds_cents: 600000000 }, as: Broker, as_user_id: broker-1, captures: { p2_bidr: $.data.id } }
            - { call: "POST /disposition/bidders/${p2_bidr}/qualify", as: DispositionManager, as_user_id: dm-1 }
