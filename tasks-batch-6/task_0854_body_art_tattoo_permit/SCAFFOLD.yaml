scenario: "854. Body-Art & Tattoo Establishment Permit (health dept): establishment & artist permit, bloodborne-pathogen & sterilization compliance, inspection & violation, minor-consent & procedure-log audit, complaint & infection report, plan review, renewal & fee, suspension"
domain_name: "body-art-tattoo-permit"
api_prefix: "/body-art"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Posture-driven gating"
  complexity_layers:
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Rate / threshold triggers"
    - "Optimistic concurrency"
  entity_topology: hybrid
  state_machine_shape: cyclic
  additional_state_machine_shapes: [parallel, branching, posture_driven]
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  additional_role_model: peer_roles
  consistency_model: immediate
  difficulty_level: Expert
  notes: |
    A county health department licenses body-art establishments and the artists who
    practice inside them. The permit lifecycle is gated by plan review, pre-opening
    inspection, sterilization/bloodborne-pathogen evidence, and an annual renewal that
    carries a tiered fee. Inspections issue violations with severity-driven abatement
    deadlines; violations cycle through correction/re-inspection loops. Public
    complaints and reportable infection reports feed a derived establishment risk score
    that, on crossing thresholds, restricts or closes the operating posture and can
    auto-generate a suspension. Minor-consent records and procedure logs are audited
    against each other. Segregation of duties forbids the same health officer from both
    issuing and lifting an enforcement action.

entities:
  - name: Establishment
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Legal business name of the body-art establishment."
        constraints: "1-120 characters, non-empty after trim"
      - name: street_address
        type: string
        source: input
        description: "Physical street address of the permitted premises."
        constraints: "1-200 characters"
      - name: county_code
        type: string
        source: input
        description: "Three-letter uppercase county code that owns jurisdiction over this premises."
        constraints: "exactly 3 characters, A-Z uppercase"
      - name: establishment_type
        type: enum
        source: input
        description: "Category of body-art services offered at the premises."
        constraints: "one of TATTOO, PIERCING, PERMANENT_COSMETICS, COMBINED"
      - name: permit_status
        type: enum
        source: system
        description: "Lifecycle state of the establishment permit; see the Establishment state machine."
        default: PENDING_PLAN_REVIEW
        constraints: "one of PENDING_PLAN_REVIEW, PENDING_INSPECTION, ACTIVE, SUSPENDED, EXPIRED, REVOKED"
      - name: permit_issued_on
        type: datetime
        source: system
        description: "Logical-clock instant at which the permit most recently entered ACTIVE; null before first activation."
        default: null
      - name: permit_expires_on
        type: datetime
        source: system
        description: "Logical-clock instant at which the current permit term ends; set to permit_issued_on + PERMIT_TERM_DAYS on activation and on renewal approval."
        default: null
      - name: operating_posture
        type: enum
        source: computed
        description: "Derived gate over all child operations; recomputed by calculation operating_posture on every mutation that touches permit_status, risk_score, open_critical_violation_count, or sterilization_compliance_status."
        constraints: "one of OPEN, RESTRICTED, CLOSED"
      - name: risk_score
        type: integer
        source: computed
        description: "PROVISIONAL variant of calculation establishment_risk_score, recomputed on every violation, complaint, infection-report, and sterilization mutation."
        default: 0
        constraints: "integer 0-100 inclusive"
      - name: open_violation_count
        type: integer
        source: computed
        description: "Count of Violation rows reachable through this establishment's Inspection rows whose status is in {ISSUED, CORRECTION_SUBMITTED, ESCALATED}."
        default: 0
      - name: open_critical_violation_count
        type: integer
        source: computed
        description: "Count of Violation rows reachable through this establishment's Inspection rows whose severity == CRITICAL and status is in {ISSUED, CORRECTION_SUBMITTED, ESCALATED}."
        default: 0
      - name: sterilization_compliance_status
        type: enum
        source: computed
        description: "Output of calculation sterilization_compliance_status over the trailing STERILIZATION_LOOKBACK_DAYS window."
        default: NONCOMPLIANT
        constraints: "one of COMPLIANT, DEFICIENT, NONCOMPLIANT"
      - name: active_artist_count
        type: integer
        source: computed
        description: "Count of Artist rows with establishment_id == this id and permit_status == ACTIVE (PROBATION, SUSPENDED, INACTIVE, PENDING and REVOKED artists are excluded)."
        default: 0
      - name: fees_paid_cents
        type: integer
        source: computed
        description: "Sum of RenewalApplication.fee_paid_cents over all RenewalApplication rows with establishment_id == this id, any status."
        default: 0
      - name: fees_refunded_cents
        type: integer
        source: computed
        description: "Sum of RenewalApplication.fee_refunded_cents over all RenewalApplication rows with establishment_id == this id, any status."
        default: 0
      - name: plan_review_cycles_used
        type: integer
        source: system
        description: "Number of PlanReview submit+resubmit cycles consumed by this establishment; incremented on every PlanReview resubmit."
        default: 1

  - name: Artist
    parent: Establishment
    common_fields: true
    fields:
      - name: establishment_id
        type: string
        source: input
        description: "FK -> Establishment.id; the premises at which this artist is permitted to practice."
      - name: legal_name
        type: string
        source: input
        description: "Legal name of the individual practitioner."
        constraints: "1-120 characters"
      - name: permit_status
        type: enum
        source: system
        description: "Lifecycle state of the individual artist permit; see the Artist state machine."
        default: PENDING
        constraints: "one of PENDING, ACTIVE, PROBATION, SUSPENDED, INACTIVE, REVOKED"
      - name: bbp_training_completed_on
        type: datetime
        source: system
        description: "Logical-clock date of the most recently recorded bloodborne-pathogen training completion; null until the first bbp-training call."
        default: null
      - name: bbp_training_expires_on
        type: datetime
        source: system
        description: "bbp_training_completed_on + BBP_TRAINING_VALIDITY_DAYS; null until the first bbp-training call."
        default: null
      - name: bbp_recert_required
        type: boolean
        source: system
        description: "Set true when a linked InfectionReport reaches investigation_status CONFIRMED; cleared by a subsequent bbp-training call."
        default: false
      - name: permit_expires_on
        type: datetime
        source: system
        description: "Copy of the parent Establishment.permit_expires_on captured at artist activation; refreshed when the establishment permit term is extended by renewal approval."
        default: null
      - name: confirmed_infection_count
        type: integer
        source: computed
        description: "Count of InfectionReport rows with artist_id == this id and investigation_status == CONFIRMED."
        default: 0
      - name: suspension_count
        type: integer
        source: computed
        description: "Count of EnforcementAction rows with artist_id == this id and action_type == SUSPENSION, any status."
        default: 0

  - name: PlanReview
    parent: Establishment
    common_fields: true
    fields:
      - name: establishment_id
        type: string
        source: input
        description: "FK -> Establishment.id; the premises whose construction plans are under review."
      - name: status
        type: enum
        source: system
        description: "Plan-review lifecycle state; see the PlanReview state machine."
        default: SUBMITTED
        constraints: "one of SUBMITTED, CORRECTIONS_REQUIRED, APPROVED, DENIED"
      - name: floor_plan_reference
        type: string
        source: input
        description: "Opaque document reference for the submitted floor plan."
        constraints: "1-80 characters"
      - name: sterilization_area_sqft
        type: number
        source: input
        description: "Declared square footage of the dedicated sterilization area."
        constraints: "greater than 0"
      - name: procedure_station_count
        type: integer
        source: input
        description: "Number of procedure stations shown on the plan."
        constraints: "integer >= 1"
      - name: has_handwash_sink
        type: boolean
        source: input
        description: "Whether a dedicated handwash sink is shown in the procedure area."
      - name: cycle_count
        type: integer
        source: system
        description: "Number of times this PlanReview has been submitted, counting the original submission as 1 and each resubmit as +1."
        default: 1
      - name: decision_notes
        type: string
        source: system
        description: "Free-text note supplied by the PlanReviewer on the most recent decision."
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the PlanReviewer who recorded the most recent decision."
        default: null

  - name: Inspection
    parent: Establishment
    common_fields: true
    fields:
      - name: establishment_id
        type: string
        source: input
        description: "FK -> Establishment.id; the premises being inspected."
      - name: source_complaint_id
        type: string
        source: system
        description: "FK -> Complaint.id; set only on the COMPLAINT inspection auto-created by a Complaint TRIAGE transition, otherwise null."
        default: null
      - name: inspection_type
        type: enum
        source: input
        description: "Purpose of the inspection visit."
        constraints: "one of PREOPENING, ROUTINE, COMPLAINT, REINSPECTION"
      - name: status
        type: enum
        source: system
        description: "Inspection lifecycle state; see the Inspection state machine."
        default: SCHEDULED
        constraints: "one of SCHEDULED, IN_PROGRESS, PASSED, FAILED, CANCELLED"
      - name: scheduled_start_at
        type: datetime
        source: input
        description: "Start instant of the on-site visit window."
      - name: scheduled_end_at
        type: datetime
        source: input
        description: "End instant of the on-site visit window; must be strictly after scheduled_start_at."
      - name: inspector_user_id
        type: string
        source: system
        description: "X-User-ID of the Inspector who started the inspection; null while SCHEDULED."
        default: null
      - name: score
        type: integer
        source: computed
        description: "Output of calculation inspection_score, written on finalize; null before finalize."
        default: null
      - name: open_violation_count_at_start
        type: integer
        source: system
        description: "Snapshot of Establishment.open_violation_count taken at the moment the inspection transitions SCHEDULED -> IN_PROGRESS; feeds the carryover term of calculation inspection_score."
        default: 0
      - name: finalized_at
        type: datetime
        source: system
        description: "Logical-clock instant of the IN_PROGRESS -> PASSED/FAILED transition."
        default: null

  - name: Violation
    parent: Inspection
    common_fields: true
    fields:
      - name: inspection_id
        type: string
        source: system
        description: "FK -> Inspection.id; the inspection during which this violation was recorded."
      - name: violation_code
        type: string
        source: input
        description: "Health-code citation identifier, e.g. BBP_001 or STER_004."
        constraints: "1-16 characters, uppercase letters, digits and underscore only"
      - name: severity
        type: enum
        source: input
        description: "Regulatory severity of the cited condition."
        constraints: "one of CRITICAL, NONCRITICAL"
      - name: narrative
        type: string
        source: input
        description: "Inspector's description of the observed condition."
        constraints: "1-500 characters"
      - name: status
        type: enum
        source: system
        description: "Violation abatement lifecycle state; see the Violation state machine."
        default: ISSUED
        constraints: "one of ISSUED, CORRECTION_SUBMITTED, VERIFIED, ESCALATED"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the violation row was created."
      - name: abatement_due_at
        type: datetime
        source: computed
        description: "Output of calculation violation_abatement_deadline; issued_at plus CRITICAL_ABATEMENT_DAYS or NONCRITICAL_ABATEMENT_DAYS depending on severity."
      - name: repeat_multiplier_applied
        type: number
        source: computed
        description: "1.5 when calculation inspection_score classifies this citation as a repeat, otherwise 1.0."
        default: 1.0
      - name: deduction_points
        type: integer
        source: computed
        description: "Per-line deduction contributed by this violation to calculation inspection_score, rounded half-up to a whole point."
        default: 0
      - name: correction_note
        type: string
        source: system
        description: "Operator-supplied description of the corrective action taken; overwritten by each correction submission."
        default: null
      - name: correction_submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent ISSUED -> CORRECTION_SUBMITTED transition."
        default: null

  - name: SterilizationRecord
    parent: Establishment
    common_fields: false
    fields:
      - name: establishment_id
        type: string
        source: input
        description: "FK -> Establishment.id; the premises whose autoclave cycle this record documents."
      - name: device_serial
        type: string
        source: input
        description: "Serial number of the sterilizer that ran the cycle."
        constraints: "1-40 characters"
      - name: cycle_completed_at
        type: datetime
        source: input
        description: "Logical-clock instant at which the autoclave cycle finished."
      - name: spore_test_result
        type: enum
        source: input
        description: "Biological indicator (spore test) outcome for this cycle."
        constraints: "one of PASS, FAIL, PENDING"
      - name: supersedes_record_id
        type: string
        source: input
        description: "FK -> SterilizationRecord.id; set when this record is the retest that supersedes an earlier FAIL or PENDING record at the same establishment, otherwise null."
        default: null
      - name: recorded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the EstablishmentOperator that filed the record."

  - name: MinorConsent
    parent: Establishment
    common_fields: true
    fields:
      - name: establishment_id
        type: string
        source: input
        description: "FK -> Establishment.id; the premises holding the signed guardian consent."
      - name: minor_full_name
        type: string
        source: input
        description: "Full name of the minor client named on the consent form."
        constraints: "1-120 characters"
      - name: minor_age_at_signing
        type: integer
        source: input
        description: "Age in whole years of the minor client on consent_signed_at."
        constraints: "integer 0-17 inclusive"
      - name: guardian_full_name
        type: string
        source: input
        description: "Full name of the consenting parent or legal guardian."
        constraints: "1-120 characters"
      - name: guardian_id_document_type
        type: enum
        source: input
        description: "Government identification type presented by the guardian."
        constraints: "one of DRIVERS_LICENSE, PASSPORT, STATE_ID, MILITARY_ID"
      - name: guardian_id_document_number
        type: string
        source: input
        description: "Identifier printed on the guardian's presented document."
        constraints: "1-40 characters"
      - name: authorized_procedure_type
        type: enum
        source: input
        description: "The single procedure category this consent authorizes."
        constraints: "one of TATTOO, PIERCING, PERMANENT_COSMETICS"
      - name: consent_signed_at
        type: datetime
        source: input
        description: "Logical-clock instant at which the guardian signed the consent."
      - name: expires_at
        type: datetime
        source: computed
        description: "consent_signed_at + MINOR_CONSENT_VALIDITY_DAYS; a consent is usable only for procedures whose started_at is strictly before this instant."
      - name: verification_status
        type: enum
        source: system
        description: "Records-clerk verification state; see the MinorConsent state machine."
        default: PENDING
        constraints: "one of PENDING, VERIFIED, REJECTED"
      - name: verified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the RecordsClerk who recorded the verification decision."
        default: null
      - name: rejection_reason
        type: string
        source: system
        description: "Clerk-supplied reason recorded on a REJECT decision."
        default: null

  - name: ProcedureLog
    parent: Establishment
    common_fields: true
    fields:
      - name: establishment_id
        type: string
        source: input
        description: "FK -> Establishment.id; the premises where the procedure was performed."
      - name: artist_id
        type: string
        source: input
        description: "FK -> Artist.id; the practitioner who performed the procedure."
      - name: minor_consent_id
        type: string
        source: input
        description: "FK -> MinorConsent.id; required when client_age is below MINOR_AGE_THRESHOLD, null otherwise."
        default: null
      - name: client_age
        type: integer
        source: input
        description: "Age in whole years of the client on started_at."
        constraints: "integer 0-120 inclusive"
      - name: procedure_type
        type: enum
        source: input
        description: "Category of body-art work performed."
        constraints: "one of TATTOO, PIERCING, PERMANENT_COSMETICS"
      - name: started_at
        type: datetime
        source: input
        description: "Start instant of the procedure session."
      - name: ended_at
        type: datetime
        source: input
        description: "End instant of the procedure session; must be strictly after started_at."
      - name: aftercare_provided
        type: boolean
        source: input
        description: "Whether written aftercare instructions were handed to the client."
      - name: audit_status
        type: enum
        source: system
        description: "Health-officer audit state of this log entry; see the ProcedureLog state machine."
        default: RECORDED
        constraints: "one of RECORDED, FLAGGED, CLEARED"
      - name: audit_finding_code
        type: enum
        source: system
        description: "Finding recorded when the log is FLAGGED; cleared back to null on CLEAR."
        default: null
        constraints: "one of CONSENT_EXPIRED, CONSENT_TYPE_MISMATCH, AFTERCARE_MISSING, ARTIST_NOT_PERMITTED"

  - name: Complaint
    parent: Establishment
    common_fields: true
    fields:
      - name: establishment_id
        type: string
        source: input
        description: "FK -> Establishment.id; the premises the complaint is filed against."
      - name: complainant_contact
        type: string
        source: input
        description: "Contact string supplied by the member of the public who filed the complaint."
        constraints: "1-120 characters"
      - name: category
        type: enum
        source: input
        description: "Complaint subject category."
        constraints: "one of SANITATION, UNLICENSED_ARTIST, MINOR_PROCEDURE, INJURY, OTHER"
      - name: narrative
        type: string
        source: input
        description: "Complainant's description of the alleged condition."
        constraints: "1-500 characters"
      - name: status
        type: enum
        source: system
        description: "Complaint handling state; see the Complaint state machine."
        default: RECEIVED
        constraints: "one of RECEIVED, TRIAGED, INVESTIGATING, SUBSTANTIATED, UNSUBSTANTIATED"
      - name: received_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the complaint row was created."
      - name: triage_due_at
        type: datetime
        source: computed
        description: "received_at + COMPLAINT_TRIAGE_DEADLINE_DAYS; a TRIAGE transition recorded at or after this instant sets triage_overdue true."
      - name: triage_overdue
        type: boolean
        source: computed
        description: "True when the TRIAGE transition occurred at an instant greater than or equal to triage_due_at."
        default: false
      - name: reopen_count
        type: integer
        source: system
        description: "Number of UNSUBSTANTIATED -> INVESTIGATING reopen transitions applied to this complaint."
        default: 0

  - name: InfectionReport
    parent: Establishment
    common_fields: true
    fields:
      - name: establishment_id
        type: string
        source: input
        description: "FK -> Establishment.id; the premises implicated in the reported infection."
      - name: artist_id
        type: string
        source: input
        description: "FK -> Artist.id; the practitioner implicated, or null when the reporter cannot identify one."
        default: null
      - name: reporter_contact
        type: string
        source: input
        description: "Contact string of the reporting party."
        constraints: "1-120 characters"
      - name: infection_type
        type: enum
        source: input
        description: "Clinical category of the reported infection."
        constraints: "one of BACTERIAL, VIRAL_HEPATITIS, MRSA, MYCOBACTERIAL, OTHER"
      - name: procedure_date
        type: datetime
        source: input
        description: "Date on which the implicated procedure was performed."
      - name: symptom_onset_at
        type: datetime
        source: input
        description: "Instant at which symptoms began; must be greater than or equal to procedure_date."
      - name: investigation_status
        type: enum
        source: system
        description: "First independent axis of the InfectionReport parallel state machine."
        default: RECEIVED
        constraints: "one of RECEIVED, SCREENING, CONFIRMED, RULED_OUT"
      - name: notification_status
        type: enum
        source: system
        description: "Second independent axis of the InfectionReport parallel state machine, tracking state-registry notification."
        default: PENDING
        constraints: "one of PENDING, CDC_NOTIFIED, NOT_REQUIRED, CLOSED"
      - name: notification_due_at
        type: datetime
        source: computed
        description: "created_at + INFECTION_NOTIFICATION_DEADLINE_HOURS; notification recorded at or after this instant sets notification_late true."
      - name: notification_late
        type: boolean
        source: computed
        description: "True when the PENDING -> CDC_NOTIFIED transition occurred at an instant greater than or equal to notification_due_at."
        default: false
      - name: reopen_count
        type: integer
        source: system
        description: "Number of RULED_OUT -> SCREENING reopen transitions applied on the investigation axis."
        default: 0

  - name: EnforcementAction
    parent: null
    common_fields: true
    fields:
      - name: establishment_id
        type: string
        source: system
        description: "FK -> Establishment.id; populated when subject_type == ESTABLISHMENT, null when subject_type == ARTIST."
        default: null
      - name: artist_id
        type: string
        source: system
        description: "FK -> Artist.id; populated when subject_type == ARTIST, null when subject_type == ESTABLISHMENT."
        default: null
      - name: subject_type
        type: enum
        source: system
        description: "Which entity the action is written against, derived from the path of the creating endpoint."
        constraints: "one of ESTABLISHMENT, ARTIST"
      - name: action_type
        type: enum
        source: input
        description: "Severity of the enforcement instrument."
        constraints: "one of SUSPENSION, REVOCATION"
      - name: reason_code
        type: enum
        source: input
        description: "Statutory basis cited for the action."
        constraints: "one of IMMINENT_HEALTH_HAZARD, RISK_THRESHOLD, CONFIRMED_INFECTION, UNLICENSED_PRACTICE, FEE_DELINQUENCY"
      - name: status
        type: enum
        source: system
        description: "Enforcement lifecycle state; see the EnforcementAction state machine."
        default: ACTIVE
        constraints: "one of ACTIVE, LIFTED"
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID of the HealthOfficer that issued the action; for auto-generated actions the literal string SYSTEM."
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the action row was created."
      - name: lifted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the HealthOfficer that lifted the action; must differ from issued_by_user_id."
        default: null
      - name: lifted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the ACTIVE -> LIFTED transition."
        default: null
      - name: auto_generated
        type: boolean
        source: system
        description: "True when the action was created by the risk-threshold cascade rather than by a HealthOfficer call."
        default: false
      - name: suspension_days
        type: integer
        source: computed
        description: "Whole days between issued_at and the lift instant, computed as floor((lift_instant - issued_at) / 86400 seconds); null while ACTIVE."
        default: null
      - name: reinstatement_base_cents
        type: integer
        source: computed
        description: "Step 1 of calculation reinstatement_penalty; null while ACTIVE."
        default: null
      - name: reinstatement_admin_fee_cents
        type: integer
        source: computed
        description: "Step 3 of calculation reinstatement_penalty; null while ACTIVE."
        default: null
      - name: reinstatement_total_cents
        type: integer
        source: computed
        description: "Step 4 of calculation reinstatement_penalty; null while ACTIVE."
        default: null

  - name: RenewalApplication
    parent: Establishment
    common_fields: true
    fields:
      - name: establishment_id
        type: string
        source: input
        description: "FK -> Establishment.id; the permit being renewed."
      - name: status
        type: enum
        source: system
        description: "Renewal lifecycle state; see the RenewalApplication state machine."
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, DEFICIENT, APPROVED, DENIED, SUPERSEDED"
      - name: requested_term_start_on
        type: datetime
        source: input
        description: "Requested first instant of the renewed permit term."
      - name: expedite_requested
        type: boolean
        source: input
        description: "Whether the operator requested expedited processing, which adds the EXPEDITE_FEE_CENTS line to the fee."
        default: false
      - name: attested_bbp_current
        type: boolean
        source: input
        description: "Operator attestation that every ACTIVE artist holds unexpired bloodborne-pathogen training."
      - name: attested_sterilization_logs_complete
        type: boolean
        source: input
        description: "Operator attestation that sterilization records are complete for the trailing window."
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent DRAFT/DEFICIENT -> SUBMITTED transition."
        default: null
      - name: artist_count_at_submit
        type: integer
        source: system
        description: "Establishment.active_artist_count captured at the moment of the most recent submit; input to the ESTIMATE variant of calculation renewal_fee_total."
        default: null
      - name: fee_estimate_cents
        type: integer
        source: computed
        description: "ESTIMATE variant of calculation renewal_fee_total, written on submit."
        default: null
      - name: fee_final_cents
        type: integer
        source: computed
        description: "FINAL variant of calculation renewal_fee_total, written on the SUBMITTED -> APPROVED transition."
        default: null
      - name: fee_balance_due_cents
        type: integer
        source: computed
        description: "max(0, fee_final_cents - fee_paid_cents), recomputed on the APPROVED transition and on every payment recorded afterwards; 0 while fee_final_cents is null."
        default: 0
      - name: fee_paid_cents
        type: integer
        source: system
        description: "Cumulative cents received against this application."
        default: 0
      - name: fee_refunded_cents
        type: integer
        source: system
        description: "Cumulative cents returned against this application."
        default: 0
      - name: payment_status
        type: enum
        source: system
        description: "Money state of this application, independent of status."
        default: UNPAID
        constraints: "one of UNPAID, PAID, REFUNDED"
      - name: late_fee_applied
        type: boolean
        source: computed
        description: "True when the fee computation that produced the currently authoritative fee figure included the LATE line."
        default: false
      - name: deficiency_code
        type: enum
        source: system
        description: "Reason recorded on a MARK_DEFICIENT review decision; cleared to null on the next submit."
        default: null
        constraints: "one of MISSING_BBP_ATTESTATION, MISSING_STERILIZATION_ATTESTATION, OPEN_CRITICAL_VIOLATION, ARTIST_ROSTER_MISMATCH"
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the HealthOfficer who recorded the most recent review decision."
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent review decision."
        default: null
      - name: cycle_count
        type: integer
        source: system
        description: "Number of submissions of this application, counting the first submit as 1 and each resubmit after DEFICIENT as +1."
        default: 0

state_machines:
  - entity: Establishment
    initial_state: PENDING_PLAN_REVIEW
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING_PLAN_REVIEW
        to: PENDING_INSPECTION
        trigger: "system: a PlanReview whose establishment_id == this Establishment.id transitions SUBMITTED -> APPROVED"
        actor: system
        preconditions:
          - "Establishment.permit_status == PENDING_PLAN_REVIEW"
        side_effects:
          - "increments Establishment.version by 1 and refreshes Establishment.updated_at"
          - "recomputes Establishment.operating_posture (remains CLOSED because permit_status is not ACTIVE)"
      - from: PENDING_INSPECTION
        to: ACTIVE
        trigger: "POST /body-art/establishments/{establishment_id}/activate"
        actor: HealthOfficer
        preconditions:
          - "Establishment.permit_status == PENDING_INSPECTION"
          - "at least one Inspection with establishment_id == this Establishment.id, inspection_type == PREOPENING and status == PASSED exists"
        side_effects:
          - "sets Establishment.permit_issued_on to the current logical-clock instant"
          - "sets Establishment.permit_expires_on to permit_issued_on + PERMIT_TERM_DAYS"
          - "recomputes Establishment.sterilization_compliance_status, Establishment.risk_score (PROVISIONAL variant) and Establishment.operating_posture"
          - "increments Establishment.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: an EnforcementAction with subject_type == ESTABLISHMENT, establishment_id == this id, action_type == SUSPENSION and status == ACTIVE is created, either by POST /body-art/establishments/{establishment_id}/enforcement-actions or by the risk-threshold cascade on violation issuance"
        actor: system
        preconditions:
          - "Establishment.permit_status == ACTIVE"
        side_effects:
          - "sets Establishment.operating_posture to CLOSED"
          - "cascade: every Artist with establishment_id == this id and permit_status in {ACTIVE, PROBATION} transitions to INACTIVE, processed in Artist.created_at ASC order"
          - "cascade: every Inspection with establishment_id == this id, status == SCHEDULED and inspection_type == ROUTINE transitions to CANCELLED, processed in Inspection.created_at ASC order"
          - "recomputes Establishment.active_artist_count"
          - "increments Establishment.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "system: an EnforcementAction with subject_type == ESTABLISHMENT, establishment_id == this id and action_type == REVOCATION is created"
        actor: system
        preconditions:
          - "Establishment.permit_status == ACTIVE"
        side_effects:
          - "sets Establishment.operating_posture to CLOSED"
          - "cascade: every Artist with establishment_id == this id and permit_status in {ACTIVE, PROBATION} transitions to INACTIVE, processed in Artist.created_at ASC order"
          - "increments Establishment.version by 1"
        note: "REVOKED is terminal; no lift or renewal path leaves it."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: the EnforcementAction that suspended this establishment transitions ACTIVE -> LIFTED"
        actor: system
        preconditions:
          - "Establishment.permit_status == SUSPENDED"
          - "no other EnforcementAction with establishment_id == this id and status == ACTIVE remains"
          - "Establishment.permit_expires_on is strictly after the current logical-clock instant"
        side_effects:
          - "cascade: every Artist with establishment_id == this id and permit_status == INACTIVE transitions to ACTIVE, processed in Artist.created_at ASC order"
          - "recomputes Establishment.active_artist_count, Establishment.risk_score and Establishment.operating_posture"
          - "increments Establishment.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /body-art/_clock/set_current_utc ops-run sweep"
        actor: system
        preconditions:
          - "Establishment.permit_status == ACTIVE"
          - "Establishment.permit_expires_on is less than or equal to the new logical-clock instant"
        side_effects:
          - "cascade: every Artist with establishment_id == this id and permit_status in {ACTIVE, PROBATION} transitions to INACTIVE, processed in Artist.created_at ASC order"
          - "sets Establishment.operating_posture to CLOSED and recomputes Establishment.active_artist_count"
          - "increments Establishment.version by 1"
          - "appends this Establishment.id to the sweep response field expired_establishment_ids"
      - from: EXPIRED
        to: ACTIVE
        trigger: "system: a RenewalApplication whose establishment_id == this id transitions SUBMITTED -> APPROVED"
        actor: system
        preconditions:
          - "Establishment.permit_status == EXPIRED"
        side_effects:
          - "sets Establishment.permit_issued_on to the decision instant and Establishment.permit_expires_on to the decision instant + PERMIT_TERM_DAYS"
          - "cascade: every Artist with establishment_id == this id and permit_status == INACTIVE transitions to ACTIVE and has permit_expires_on refreshed to the new Establishment.permit_expires_on, processed in Artist.created_at ASC order"
          - "recomputes Establishment.active_artist_count, Establishment.risk_score and Establishment.operating_posture"
          - "increments Establishment.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "system: a RenewalApplication whose establishment_id == this id transitions SUBMITTED -> APPROVED while the permit is still ACTIVE"
        actor: system
        preconditions:
          - "Establishment.permit_status == ACTIVE"
        side_effects:
          - "sets Establishment.permit_issued_on to the decision instant and Establishment.permit_expires_on to the decision instant + PERMIT_TERM_DAYS (the remaining unused term is not carried forward)"
          - "refreshes permit_expires_on on every Artist with establishment_id == this id and permit_status == ACTIVE"
          - "increments Establishment.version by 1"

  - entity: Artist
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /body-art/artists/{artist_id}/activate"
        actor: HealthOfficer
        preconditions:
          - "Artist.permit_status == PENDING"
          - "the parent Establishment (Artist.establishment_id) has permit_status == ACTIVE"
          - "Artist.bbp_training_expires_on is not null and is strictly after the current logical-clock instant"
        side_effects:
          - "sets Artist.permit_expires_on to the parent Establishment.permit_expires_on"
          - "increments Establishment.active_artist_count by 1 and increments Establishment.version by 1"
      - from: ACTIVE
        to: PROBATION
        trigger: "system: an InfectionReport with artist_id == this Artist.id reaches investigation_status == CONFIRMED"
        actor: system
        preconditions:
          - "Artist.permit_status == ACTIVE"
        side_effects:
          - "sets Artist.bbp_recert_required to true and recomputes Artist.confirmed_infection_count"
          - "cascade: decrements Establishment.active_artist_count by 1 and recomputes Establishment.risk_score, which in turn recomputes Establishment.operating_posture"
          - "increments Artist.version by 1 and Establishment.version by 1"
      - from: PROBATION
        to: ACTIVE
        trigger: "POST /body-art/artists/{artist_id}/bbp-training"
        actor: Artist
        preconditions:
          - "Artist.permit_status == PROBATION"
          - "the submitted completed_on is less than or equal to the current logical-clock instant"
        side_effects:
          - "sets Artist.bbp_recert_required to false, Artist.bbp_training_completed_on to completed_on and Artist.bbp_training_expires_on to completed_on + BBP_TRAINING_VALIDITY_DAYS"
          - "cascade: increments Establishment.active_artist_count by 1 and recomputes Establishment.operating_posture"
          - "increments Artist.version by 1 and Establishment.version by 1"
        note: "The same endpoint called while permit_status is PENDING or ACTIVE records the training dates without changing permit_status."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: an EnforcementAction with subject_type == ARTIST, artist_id == this id, action_type == SUSPENSION and status == ACTIVE is created"
        actor: system
        preconditions:
          - "Artist.permit_status == ACTIVE"
        side_effects:
          - "decrements Establishment.active_artist_count by 1 and recomputes Establishment.operating_posture"
          - "increments Artist.version by 1 and Establishment.version by 1"
      - from: PROBATION
        to: SUSPENDED
        trigger: "system: an EnforcementAction with subject_type == ARTIST, artist_id == this id, action_type == SUSPENSION and status == ACTIVE is created"
        actor: system
        preconditions:
          - "Artist.permit_status == PROBATION"
        side_effects:
          - "increments Artist.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: the EnforcementAction with artist_id == this id transitions ACTIVE -> LIFTED"
        actor: system
        preconditions:
          - "Artist.permit_status == SUSPENDED"
          - "the parent Establishment has permit_status == ACTIVE"
        side_effects:
          - "increments Establishment.active_artist_count by 1 and recomputes Establishment.operating_posture"
          - "increments Artist.version by 1 and Establishment.version by 1"
      - from: ACTIVE
        to: INACTIVE
        trigger: "system: the parent Establishment transitions ACTIVE -> SUSPENDED, ACTIVE -> REVOKED or ACTIVE -> EXPIRED"
        actor: system
        preconditions:
          - "Artist.permit_status == ACTIVE"
        side_effects:
          - "increments Artist.version by 1"
      - from: PROBATION
        to: INACTIVE
        trigger: "system: the parent Establishment transitions ACTIVE -> SUSPENDED, ACTIVE -> REVOKED or ACTIVE -> EXPIRED"
        actor: system
        preconditions:
          - "Artist.permit_status == PROBATION"
        side_effects:
          - "increments Artist.version by 1"
      - from: INACTIVE
        to: ACTIVE
        trigger: "system: the parent Establishment transitions SUSPENDED -> ACTIVE or EXPIRED -> ACTIVE"
        actor: system
        preconditions:
          - "Artist.permit_status == INACTIVE"
        side_effects:
          - "refreshes Artist.permit_expires_on from the parent Establishment.permit_expires_on"
          - "increments Artist.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "system: an EnforcementAction with subject_type == ARTIST, artist_id == this id and action_type == REVOCATION is created"
        actor: system
        preconditions:
          - "Artist.permit_status == ACTIVE"
        side_effects:
          - "decrements Establishment.active_artist_count by 1"
          - "increments Artist.version by 1 and Establishment.version by 1"

  - entity: PlanReview
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /body-art/plan-reviews/{plan_review_id}/decision with decision == APPROVE"
        actor: PlanReviewer
        preconditions:
          - "PlanReview.status == SUBMITTED"
          - "PlanReview.has_handwash_sink == true"
          - "PlanReview.sterilization_area_sqft is greater than or equal to MIN_STERILIZATION_AREA_SQFT"
        side_effects:
          - "sets PlanReview.decided_by_user_id and PlanReview.decision_notes"
          - "cascade: the parent Establishment transitions PENDING_PLAN_REVIEW -> PENDING_INSPECTION"
      - from: SUBMITTED
        to: CORRECTIONS_REQUIRED
        trigger: "POST /body-art/plan-reviews/{plan_review_id}/decision with decision == REQUEST_CORRECTIONS"
        actor: PlanReviewer
        preconditions:
          - "PlanReview.status == SUBMITTED"
        side_effects:
          - "sets PlanReview.decided_by_user_id and PlanReview.decision_notes"
      - from: CORRECTIONS_REQUIRED
        to: SUBMITTED
        trigger: "POST /body-art/plan-reviews/{plan_review_id}/resubmit"
        actor: EstablishmentOperator
        preconditions:
          - "PlanReview.status == CORRECTIONS_REQUIRED"
          - "PlanReview.cycle_count is strictly less than PLAN_REVIEW_MAX_CYCLES"
        side_effects:
          - "increments PlanReview.cycle_count by 1 and copies it to Establishment.plan_review_cycles_used"
          - "clears PlanReview.decision_notes to null"
          - "overwrites floor_plan_reference, sterilization_area_sqft, procedure_station_count and has_handwash_sink with the resubmitted values"
        note: "This is the revision cycle: CORRECTIONS_REQUIRED -> SUBMITTED -> CORRECTIONS_REQUIRED may repeat until cycle_count reaches PLAN_REVIEW_MAX_CYCLES."
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /body-art/plan-reviews/{plan_review_id}/decision with decision == DENY"
        actor: PlanReviewer
        preconditions:
          - "PlanReview.status == SUBMITTED"
        side_effects:
          - "sets PlanReview.decided_by_user_id and PlanReview.decision_notes"
      - from: CORRECTIONS_REQUIRED
        to: DENIED
        trigger: "POST /body-art/plan-reviews/{plan_review_id}/decision with decision == DENY"
        actor: PlanReviewer
        preconditions:
          - "PlanReview.status == CORRECTIONS_REQUIRED"
        side_effects:
          - "sets PlanReview.decided_by_user_id and PlanReview.decision_notes"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /body-art/inspections/{inspection_id}/start"
        actor: Inspector
        preconditions:
          - "Inspection.status == SCHEDULED"
          - "the current logical-clock instant is greater than or equal to Inspection.scheduled_start_at"
        side_effects:
          - "sets Inspection.inspector_user_id to the calling X-User-ID"
          - "snapshots Establishment.open_violation_count into Inspection.open_violation_count_at_start"
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /body-art/inspections/{inspection_id}/finalize"
        actor: Inspector
        preconditions:
          - "Inspection.status == IN_PROGRESS"
          - "the calling X-User-ID equals Inspection.inspector_user_id"
          - "calculation inspection_score yields a score greater than or equal to INSPECTION_PASS_SCORE"
          - "zero Violation rows with inspection_id == this Inspection.id have severity == CRITICAL"
        side_effects:
          - "writes Inspection.score and Inspection.finalized_at"
          - "recomputes Establishment.risk_score and Establishment.operating_posture"
        note: "Branch A of the fork: PASSED and FAILED are the two outcomes of the same finalize call and carry different side-effect sets."
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /body-art/inspections/{inspection_id}/finalize"
        actor: Inspector
        preconditions:
          - "Inspection.status == IN_PROGRESS"
          - "the calling X-User-ID equals Inspection.inspector_user_id"
          - "calculation inspection_score yields a score strictly less than INSPECTION_PASS_SCORE, or at least one Violation row with inspection_id == this Inspection.id has severity == CRITICAL"
        side_effects:
          - "writes Inspection.score and Inspection.finalized_at"
          - "creates a follow-up Inspection with inspection_type == REINSPECTION, status == SCHEDULED, scheduled_start_at == finalized_at + REINSPECTION_LEAD_DAYS and scheduled_end_at == scheduled_start_at + REINSPECTION_WINDOW_MINUTES, only when Inspection.inspection_type is in {ROUTINE, COMPLAINT, REINSPECTION}"
          - "recomputes Establishment.risk_score and Establishment.operating_posture"
        note: "Branch B of the fork. A PREOPENING failure does not spawn a REINSPECTION because there is no permit to re-inspect."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: the parent Establishment transitions ACTIVE -> SUSPENDED"
        actor: system
        preconditions:
          - "Inspection.status == SCHEDULED"
          - "Inspection.inspection_type == ROUTINE"
        side_effects:
          - "increments Inspection.version by 1"

  - entity: Violation
    initial_state: ISSUED
    terminal_states: [VERIFIED, ESCALATED]
    transitions:
      - from: null
        to: ISSUED
        trigger: "POST /body-art/inspections/{inspection_id}/violations"
        actor: Inspector
        preconditions:
          - "the parent Inspection.status == IN_PROGRESS"
          - "the calling X-User-ID equals Inspection.inspector_user_id"
        side_effects:
          - "sets Violation.issued_at to the current logical-clock instant and Violation.abatement_due_at per calculation violation_abatement_deadline"
          - "cascade hop 1: recomputes Establishment.open_violation_count and Establishment.open_critical_violation_count from the new ISSUED row"
          - "cascade hop 2: because those counters changed, recomputes Establishment.risk_score (PROVISIONAL variant)"
          - "cascade hop 3: because risk_score changed, when risk_score is greater than or equal to RISK_SUSPENSION_THRESHOLD and no EnforcementAction with establishment_id == this establishment and status == ACTIVE exists, creates an EnforcementAction with subject_type ESTABLISHMENT, action_type SUSPENSION, reason_code RISK_THRESHOLD, auto_generated true and issued_by_user_id 'SYSTEM'"
          - "cascade hop 4: because that EnforcementAction is ACTIVE, the Establishment transitions ACTIVE -> SUSPENDED and operating_posture becomes CLOSED"
          - "cascade hop 5: because the Establishment became SUSPENDED, every Artist at that establishment with permit_status in {ACTIVE, PROBATION} becomes INACTIVE and every SCHEDULED ROUTINE Inspection at that establishment becomes CANCELLED"
          - "when risk_score stays strictly below RISK_SUSPENSION_THRESHOLD, hops 3-5 do not fire and only Establishment.operating_posture is recomputed"
      - from: ISSUED
        to: CORRECTION_SUBMITTED
        trigger: "POST /body-art/violations/{violation_id}/correction"
        actor: EstablishmentOperator
        preconditions:
          - "Violation.status == ISSUED"
          - "the calling X-User-ID equals the establishment_id of the Inspection referenced by Violation.inspection_id"
        side_effects:
          - "sets Violation.correction_note and Violation.correction_submitted_at"
          - "Establishment.open_violation_count is unchanged because CORRECTION_SUBMITTED is still an open status"
      - from: CORRECTION_SUBMITTED
        to: VERIFIED
        trigger: "POST /body-art/violations/{violation_id}/correction-decision with decision == VERIFY"
        actor: Inspector
        preconditions:
          - "Violation.status == CORRECTION_SUBMITTED"
        side_effects:
          - "recomputes Establishment.open_violation_count and Establishment.open_critical_violation_count (this row leaves the open set)"
          - "recomputes Establishment.risk_score and Establishment.operating_posture"
          - "increments Establishment.version by 1"
      - from: CORRECTION_SUBMITTED
        to: ISSUED
        trigger: "POST /body-art/violations/{violation_id}/correction-decision with decision == REJECT"
        actor: Inspector
        preconditions:
          - "Violation.status == CORRECTION_SUBMITTED"
          - "the current logical-clock instant is strictly before Violation.abatement_due_at"
        side_effects:
          - "clears Violation.correction_note and Violation.correction_submitted_at back to null"
          - "Establishment.open_violation_count is unchanged"
        note: "This is the abatement revision cycle: ISSUED -> CORRECTION_SUBMITTED -> ISSUED may repeat while the abatement deadline has not been reached."
      - from: CORRECTION_SUBMITTED
        to: ESCALATED
        trigger: "POST /body-art/violations/{violation_id}/correction-decision with decision == REJECT"
        actor: Inspector
        preconditions:
          - "Violation.status == CORRECTION_SUBMITTED"
          - "the current logical-clock instant is greater than or equal to Violation.abatement_due_at"
        side_effects:
          - "recomputes Establishment.risk_score and Establishment.operating_posture (ESCALATED remains in the open set, so the counters do not move)"
      - from: ISSUED
        to: ESCALATED
        trigger: "POST /body-art/_clock/set_current_utc ops-run sweep"
        actor: system
        preconditions:
          - "Violation.status == ISSUED"
          - "Violation.abatement_due_at is less than or equal to the new logical-clock instant"
        side_effects:
          - "appends this Violation.id to the sweep response field escalated_violation_ids"
          - "recomputes Establishment.risk_score and Establishment.operating_posture"

  - entity: MinorConsent
    initial_state: PENDING
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /body-art/minor-consents/{minor_consent_id}/verify with decision == VERIFY"
        actor: RecordsClerk
        preconditions:
          - "MinorConsent.verification_status == PENDING"
          - "MinorConsent.expires_at is strictly after the current logical-clock instant"
        side_effects:
          - "sets MinorConsent.verified_by_user_id to the calling X-User-ID"
      - from: PENDING
        to: REJECTED
        trigger: "POST /body-art/minor-consents/{minor_consent_id}/verify with decision == REJECT"
        actor: RecordsClerk
        preconditions:
          - "MinorConsent.verification_status == PENDING"
        side_effects:
          - "sets MinorConsent.verified_by_user_id and MinorConsent.rejection_reason"

  - entity: ProcedureLog
    initial_state: RECORDED
    terminal_states: [CLEARED]
    transitions:
      - from: RECORDED
        to: FLAGGED
        trigger: "POST /body-art/procedure-logs/{procedure_log_id}/audit with decision == FLAG"
        actor: HealthOfficer
        preconditions:
          - "ProcedureLog.audit_status == RECORDED"
        side_effects:
          - "sets ProcedureLog.audit_finding_code to the supplied finding_code"
          - "when ProcedureLog.client_age is strictly less than MINOR_AGE_THRESHOLD, recomputes Establishment.risk_score and Establishment.operating_posture"
          - "increments Establishment.version by 1"
      - from: FLAGGED
        to: CLEARED
        trigger: "POST /body-art/procedure-logs/{procedure_log_id}/audit with decision == CLEAR"
        actor: HealthOfficer
        preconditions:
          - "ProcedureLog.audit_status == FLAGGED"
        side_effects:
          - "clears ProcedureLog.audit_finding_code to null"
          - "when ProcedureLog.client_age is strictly less than MINOR_AGE_THRESHOLD, recomputes Establishment.risk_score and Establishment.operating_posture"
          - "increments Establishment.version by 1"

  - entity: Complaint
    initial_state: RECEIVED
    terminal_states: [SUBSTANTIATED]
    transitions:
      - from: RECEIVED
        to: TRIAGED
        trigger: "POST /body-art/complaints/{complaint_id}/transition with action == TRIAGE"
        actor: HealthOfficer
        preconditions:
          - "Complaint.status == RECEIVED"
          - "the derived COMPLAINT inspection window does not collide with any Inspection of the same establishment whose status is in {SCHEDULED, IN_PROGRESS}, using the buffered interval semantics of validation priority 64"
        side_effects:
          - "sets Complaint.triage_overdue to true when the current logical-clock instant is greater than or equal to Complaint.triage_due_at, false otherwise"
          - "creates an Inspection with establishment_id == Complaint.establishment_id, inspection_type == COMPLAINT, status == SCHEDULED, source_complaint_id == this Complaint.id, scheduled_start_at == current logical-clock instant + COMPLAINT_INSPECTION_LEAD_HOURS and scheduled_end_at == scheduled_start_at + COMPLAINT_INSPECTION_WINDOW_MINUTES"
      - from: TRIAGED
        to: INVESTIGATING
        trigger: "POST /body-art/complaints/{complaint_id}/transition with action == INVESTIGATE"
        actor: HealthOfficer
        preconditions:
          - "Complaint.status == TRIAGED"
        side_effects:
          - "increments Complaint.version by 1"
      - from: INVESTIGATING
        to: SUBSTANTIATED
        trigger: "POST /body-art/complaints/{complaint_id}/transition with action == SUBSTANTIATE"
        actor: HealthOfficer
        preconditions:
          - "Complaint.status == INVESTIGATING"
        side_effects:
          - "recomputes Establishment.risk_score (the SUBSTANTIATED_COMPLAINT_WEIGHT term now applies) and Establishment.operating_posture"
          - "increments Establishment.version by 1"
      - from: INVESTIGATING
        to: UNSUBSTANTIATED
        trigger: "POST /body-art/complaints/{complaint_id}/transition with action == UNSUBSTANTIATE"
        actor: HealthOfficer
        preconditions:
          - "Complaint.status == INVESTIGATING"
        side_effects:
          - "recomputes Establishment.risk_score (the AUDIT variant's in-flight term stops applying) and Establishment.operating_posture"
      - from: UNSUBSTANTIATED
        to: INVESTIGATING
        trigger: "POST /body-art/complaints/{complaint_id}/transition with action == REOPEN"
        actor: HealthOfficer
        preconditions:
          - "Complaint.status == UNSUBSTANTIATED"
          - "Complaint.reopen_count is strictly less than COMPLAINT_MAX_REOPENS"
        side_effects:
          - "increments Complaint.reopen_count by 1"
          - "recomputes Establishment.risk_score and Establishment.operating_posture"
        note: "Negotiation-style revision cycle: INVESTIGATING -> UNSUBSTANTIATED -> INVESTIGATING repeats up to COMPLAINT_MAX_REOPENS times."

  - entity: InfectionReport
    initial_state: "investigation_status=RECEIVED, notification_status=PENDING"
    terminal_states: ["investigation_status=CONFIRMED", "notification_status=CLOSED"]
    parallel_dimensions:
      - name: investigation_status
        states: [RECEIVED, SCREENING, CONFIRMED, RULED_OUT]
        endpoint: "POST /body-art/infection-reports/{infection_report_id}/investigation"
      - name: notification_status
        states: [PENDING, CDC_NOTIFIED, NOT_REQUIRED, CLOSED]
        endpoint: "POST /body-art/infection-reports/{infection_report_id}/notification"
    transitions:
      - from: "investigation_status=RECEIVED"
        to: "investigation_status=SCREENING"
        trigger: "POST /body-art/infection-reports/{infection_report_id}/investigation with action == SCREEN"
        actor: HealthOfficer
        preconditions:
          - "InfectionReport.investigation_status == RECEIVED"
        side_effects:
          - "notification_status is left untouched — the two axes advance independently"
      - from: "investigation_status=SCREENING"
        to: "investigation_status=CONFIRMED"
        trigger: "POST /body-art/infection-reports/{infection_report_id}/investigation with action == CONFIRM"
        actor: HealthOfficer
        preconditions:
          - "InfectionReport.investigation_status == SCREENING"
        side_effects:
          - "cascade hop 1: this row's investigation_status becomes CONFIRMED"
          - "cascade hop 2: because it became CONFIRMED, the Artist referenced by artist_id (when non-null) transitions ACTIVE -> PROBATION and has bbp_recert_required set to true"
          - "cascade hop 3: because that Artist left ACTIVE, Establishment.active_artist_count is decremented and Establishment.risk_score is recomputed with the CONFIRMED_INFECTION_WEIGHT term"
          - "cascade hop 4: because risk_score changed, Establishment.operating_posture is recomputed and becomes RESTRICTED when risk_score is greater than or equal to RISK_RESTRICTED_THRESHOLD"
          - "notification_status is left untouched"
      - from: "investigation_status=SCREENING"
        to: "investigation_status=RULED_OUT"
        trigger: "POST /body-art/infection-reports/{infection_report_id}/investigation with action == RULE_OUT"
        actor: HealthOfficer
        preconditions:
          - "InfectionReport.investigation_status == SCREENING"
        side_effects:
          - "recomputes Establishment.risk_score (the AUDIT variant's SCREENING term stops applying)"
      - from: "investigation_status=RULED_OUT"
        to: "investigation_status=SCREENING"
        trigger: "POST /body-art/infection-reports/{infection_report_id}/investigation with action == REOPEN"
        actor: HealthOfficer
        preconditions:
          - "InfectionReport.investigation_status == RULED_OUT"
          - "InfectionReport.reopen_count is strictly less than INFECTION_MAX_REOPENS"
        side_effects:
          - "increments InfectionReport.reopen_count by 1"
          - "recomputes Establishment.risk_score"
      - from: "notification_status=PENDING"
        to: "notification_status=CDC_NOTIFIED"
        trigger: "POST /body-art/infection-reports/{infection_report_id}/notification with action == NOTIFY"
        actor: HealthOfficer
        preconditions:
          - "InfectionReport.notification_status == PENDING"
        side_effects:
          - "sets InfectionReport.notification_late to true when the current logical-clock instant is greater than or equal to InfectionReport.notification_due_at, false otherwise"
          - "investigation_status is left untouched"
      - from: "notification_status=PENDING"
        to: "notification_status=NOT_REQUIRED"
        trigger: "POST /body-art/infection-reports/{infection_report_id}/notification with action == MARK_NOT_REQUIRED"
        actor: HealthOfficer
        preconditions:
          - "InfectionReport.notification_status == PENDING"
          - "InfectionReport.infection_type == OTHER"
        side_effects:
          - "investigation_status is left untouched"
      - from: "notification_status=CDC_NOTIFIED"
        to: "notification_status=CLOSED"
        trigger: "POST /body-art/infection-reports/{infection_report_id}/notification with action == CLOSE"
        actor: HealthOfficer
        preconditions:
          - "InfectionReport.notification_status == CDC_NOTIFIED"
        side_effects:
          - "investigation_status is left untouched"
      - from: "notification_status=NOT_REQUIRED"
        to: "notification_status=CLOSED"
        trigger: "POST /body-art/infection-reports/{infection_report_id}/notification with action == CLOSE"
        actor: HealthOfficer
        preconditions:
          - "InfectionReport.notification_status == NOT_REQUIRED"
        side_effects:
          - "investigation_status is left untouched"

  - entity: EnforcementAction
    initial_state: ACTIVE
    terminal_states: [LIFTED]
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /body-art/enforcement-actions/{enforcement_action_id}/lift"
        actor: HealthOfficer
        preconditions:
          - "EnforcementAction.status == ACTIVE"
          - "EnforcementAction.action_type == SUSPENSION"
          - "the calling X-User-ID differs from EnforcementAction.issued_by_user_id (segregation of duties)"
        side_effects:
          - "sets lifted_by_user_id and lifted_at, and writes suspension_days, reinstatement_base_cents, reinstatement_admin_fee_cents and reinstatement_total_cents per calculation reinstatement_penalty"
          - "cascade: when subject_type == ESTABLISHMENT the Establishment transitions SUSPENDED -> ACTIVE; when subject_type == ARTIST the Artist transitions SUSPENDED -> ACTIVE"
        note: "A REVOCATION action has no exit transition and stays ACTIVE forever; LIFTED is the only terminal state of this machine."

  - entity: RenewalApplication
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /body-art/renewal-applications/{renewal_application_id}/submit"
        actor: EstablishmentOperator
        preconditions:
          - "RenewalApplication.status == DRAFT"
          - "the calling X-User-ID equals RenewalApplication.establishment_id"
        side_effects:
          - "sets submitted_at to the current logical-clock instant and artist_count_at_submit to Establishment.active_artist_count"
          - "increments cycle_count by 1"
          - "writes fee_estimate_cents and late_fee_applied per the ESTIMATE variant of calculation renewal_fee_total"
      - from: DEFICIENT
        to: SUBMITTED
        trigger: "POST /body-art/renewal-applications/{renewal_application_id}/submit"
        actor: EstablishmentOperator
        preconditions:
          - "RenewalApplication.status == DEFICIENT"
          - "RenewalApplication.cycle_count is strictly less than RENEWAL_MAX_CYCLES"
        side_effects:
          - "clears deficiency_code to null"
          - "sets submitted_at, refreshes artist_count_at_submit, increments cycle_count by 1"
          - "recomputes fee_estimate_cents and late_fee_applied per the ESTIMATE variant"
        note: "Deficiency revision cycle: SUBMITTED -> DEFICIENT -> SUBMITTED repeats up to RENEWAL_MAX_CYCLES submissions."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /body-art/renewal-applications/{renewal_application_id}/review with decision == APPROVE"
        actor: HealthOfficer
        preconditions:
          - "RenewalApplication.status == SUBMITTED"
          - "RenewalApplication.attested_bbp_current == true and RenewalApplication.attested_sterilization_logs_complete == true"
          - "no EnforcementAction with establishment_id == RenewalApplication.establishment_id and status == ACTIVE exists"
          - "Establishment.open_critical_violation_count == 0"
          - "Establishment.sterilization_compliance_status is not NONCOMPLIANT"
          - "RenewalApplication.payment_status == PAID"
        side_effects:
          - "writes fee_final_cents per the FINAL variant of calculation renewal_fee_total and sets fee_balance_due_cents to max(0, fee_final_cents - fee_paid_cents)"
          - "sets decided_by_user_id and decided_at"
          - "cascade: the Establishment transitions EXPIRED -> ACTIVE or ACTIVE -> ACTIVE, extending permit_expires_on to decided_at + PERMIT_TERM_DAYS"
      - from: SUBMITTED
        to: DEFICIENT
        trigger: "POST /body-art/renewal-applications/{renewal_application_id}/review with decision == MARK_DEFICIENT"
        actor: HealthOfficer
        preconditions:
          - "RenewalApplication.status == SUBMITTED"
        side_effects:
          - "sets deficiency_code to the supplied value, decided_by_user_id and decided_at"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /body-art/renewal-applications/{renewal_application_id}/review with decision == DENY"
        actor: HealthOfficer
        preconditions:
          - "RenewalApplication.status == SUBMITTED"
        side_effects:
          - "sets decided_by_user_id and decided_at"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: a newer RenewalApplication is created for the same establishment_id via POST /body-art/renewal-applications"
        actor: system
        preconditions:
          - "RenewalApplication.status == DRAFT"
        side_effects:
          - "increments RenewalApplication.version by 1"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system: a newer RenewalApplication is created for the same establishment_id via POST /body-art/renewal-applications"
        actor: system
        preconditions:
          - "RenewalApplication.status == SUBMITTED"
        side_effects:
          - "increments RenewalApplication.version by 1"
      - from: DEFICIENT
        to: SUPERSEDED
        trigger: "system: a newer RenewalApplication is created for the same establishment_id via POST /body-art/renewal-applications"
        actor: system
        preconditions:
          - "RenewalApplication.status == DEFICIENT"
        side_effects:
          - "increments RenewalApplication.version by 1"

concurrency_rules:
  - rule_id: renewal-create-supersede-stale-establishment
    parent_entity: Establishment
    write_endpoint: "POST /body-art/renewal-applications"
    occ_field: "expected_establishment_version"
    description: |
      Creating a RenewalApplication against an Establishment whose version has
      advanced since the client last observed it is rejected. The product rule in
      the RenewalApplication state machine lets a newly created application
      legitimately supersede any prior DRAFT, SUBMITTED or DEFICIENT application
      for the same establishment, so a second create carrying a stale
      expected_establishment_version would silently discard work the client never
      saw; the stale-version check rejects it instead.
    error_id: ERR_STALE_ESTABLISHMENT_VERSION
    http_status: 412
  - rule_id: artist-enforcement-create-stale-artist
    parent_entity: Artist
    write_endpoint: "POST /body-art/artists/{artist_id}/enforcement-actions"
    occ_field: "expected_artist_version"
    description: |
      Issuing an EnforcementAction against an Artist whose version has advanced
      since the officer last read the artist record is rejected. An artist may
      legitimately have moved to PROBATION or had bloodborne-pathogen recert
      recorded between the read and the write, which changes whether the action is
      warranted, so the officer must re-read before writing.
    error_id: ERR_STALE_ARTIST_VERSION
    http_status: 412

calculations:
  - name: inspection_score
    trigger: "POST /body-art/inspections/{inspection_id}/finalize, before the IN_PROGRESS -> PASSED/FAILED branch is chosen"
    algorithm: weighted_scoring
    formula: |
      # Step 1 - per-violation line deductions (order-independent; each line stands alone)
      for each V in Violation rows with V.inspection_id == I.id, processed in V.created_at ASC order:
          base = CRITICAL_DEDUCTION_POINTS      if V.severity == CRITICAL
               = NONCRITICAL_DEDUCTION_POINTS   if V.severity == NONCRITICAL
          is_repeat = exists a Violation P at the same establishment such that
                        P.violation_code == V.violation_code
                        AND P.id != V.id
                        AND P.status IN {VERIFIED, ESCALATED}
                        AND P.issued_at >= I.scheduled_start_at - REPEAT_LOOKBACK_DAYS days
                        AND P.issued_at <  I.scheduled_start_at
          V.repeat_multiplier_applied = REPEAT_MULTIPLIER if is_repeat else 1.0
          V.deduction_points = round_half_up(base * V.repeat_multiplier_applied)   # whole points
      raw_deduction = sum of V.deduction_points over the rows above   # 0 when the inspection cited nothing

      # Step 2 - carryover term, capped
      carryover = min(CARRYOVER_CAP, CARRYOVER_PER_OPEN_VIOLATION * I.open_violation_count_at_start)

      # Step 3 - inspection-type factor (conditional branch on the entity's own state)
      type_factor = REINSPECTION_SEVERITY_FACTOR if I.inspection_type == REINSPECTION else 1.00

      # Step 4 - single final rounding, then clamp at zero
      total_deduction = round_half_up((raw_deduction + carryover) * type_factor)
      I.score = max(0, INSPECTION_SCORE_MAX - total_deduction)

      # Step 5 - outcome branch
      I.status = PASSED  if I.score >= INSPECTION_PASS_SCORE
                          and no Violation with inspection_id == I.id has severity == CRITICAL
               = FAILED  otherwise
    input_set: "Violation rows whose inspection_id equals this inspection, in any status; the repeat lookup additionally scans Violation rows of every other Inspection with the same establishment_id whose status is VERIFIED or ESCALATED and whose issued_at falls in the half-open window [I.scheduled_start_at - REPEAT_LOOKBACK_DAYS, I.scheduled_start_at)."
    constants:
      CRITICAL_DEDUCTION_POINTS: 12
      NONCRITICAL_DEDUCTION_POINTS: 6
      REPEAT_MULTIPLIER: 1.5
      REPEAT_LOOKBACK_DAYS: 365
      CARRYOVER_PER_OPEN_VIOLATION: 5
      CARRYOVER_CAP: 20
      REINSPECTION_SEVERITY_FACTOR: 1.25
      INSPECTION_SCORE_MAX: 100
      INSPECTION_PASS_SCORE: 70
    precision: "Per-line deductions and the final total_deduction are whole points, round_half_up; the score is an integer in [0, 100]."
    note: |
      Combinatorial mode (a): three independent inputs (the cited violation set, the
      establishment's open-violation carryover, and the inspection type) interact
      non-linearly through a capped min() term and a conditional multiplicative
      factor applied once to the summed deduction rather than per line.

  - name: renewal_fee_total
    trigger: "POST /body-art/renewal-applications/{renewal_application_id}/submit writes the ESTIMATE variant; POST /body-art/renewal-applications/{renewal_application_id}/review with decision == APPROVE writes the FINAL variant"
    algorithm: tiered_pricing
    formula: |
      # inputs: n = artist_count (see variants), evaluated_at = evaluation instant (see variants)
      # Step 1 - raw line items, in cents, before the county administrative multiplier
      L_base_raw     = BASE_RENEWAL_FEE_CENTS
      L_artist_raw   = min(n, 3) * ARTIST_TIER1_RATE_CENTS
                     + max(0, min(n, 8) - 3) * ARTIST_TIER2_RATE_CENTS
                     + max(0, n - 8) * ARTIST_TIER3_RATE_CENTS
      L_tech_raw     = n * TECH_FEE_PER_ARTIST_CENTS
      L_expedite_raw = EXPEDITE_FEE_CENTS if RenewalApplication.expedite_requested else 0

      # Step 2 - PINNED ROUNDING ORDER: multiply EACH line by the county multiplier and
      #          round THAT LINE to a whole cent, then sum the rounded lines.
      #          Summing the raw lines first and rounding once at the end is explicitly
      #          NOT the rule and produces a different subtotal.
      subtotal_cents = round_half_up(L_base_raw     * COUNTY_ADMIN_MULTIPLIER)
                     + round_half_up(L_artist_raw   * COUNTY_ADMIN_MULTIPLIER)
                     + round_half_up(L_tech_raw     * COUNTY_ADMIN_MULTIPLIER)
                     + round_half_up(L_expedite_raw * COUNTY_ADMIN_MULTIPLIER)

      # Step 3 - late line, computed on the already-rounded subtotal
      is_late = Establishment.permit_expires_on is not null
                AND evaluated_at > Establishment.permit_expires_on
      late_fee_cents = round_half_up(LATE_FEE_PCT * subtotal_cents) if is_late else 0
      RenewalApplication.late_fee_applied = is_late

      total_cents = subtotal_cents + late_fee_cents
    input_set: "n counts Artist rows with establishment_id == RenewalApplication.establishment_id and permit_status == ACTIVE at the evaluation instant; artists in PENDING, PROBATION, SUSPENDED, INACTIVE or REVOKED are excluded."
    constants:
      BASE_RENEWAL_FEE_CENTS: 25000
      ARTIST_TIER1_RATE_CENTS: 7500
      ARTIST_TIER2_RATE_CENTS: 6000
      ARTIST_TIER3_RATE_CENTS: 4500
      TECH_FEE_PER_ARTIST_CENTS: 1050
      EXPEDITE_FEE_CENTS: 10000
      COUNTY_ADMIN_MULTIPLIER: 1.075
      LATE_FEE_PCT: 0.15
    precision: "Every line item and the late fee are whole cents, round_half_up, rounded independently in the order pinned above."
    variants:
      - name: ESTIMATE
        when: "Written to RenewalApplication.fee_estimate_cents by the DRAFT/DEFICIENT -> SUBMITTED transition."
        difference: "n = RenewalApplication.artist_count_at_submit (the ACTIVE artist count snapshotted at submit); evaluated_at = RenewalApplication.submitted_at."
      - name: FINAL
        when: "Written to RenewalApplication.fee_final_cents by the SUBMITTED -> APPROVED transition."
        difference: "n = Establishment.active_artist_count re-read at the approval instant; evaluated_at = RenewalApplication.decided_at. Artists activated or deactivated between submit and approval move n, and an approval recorded after Establishment.permit_expires_on adds the late line even when the submission itself was on time, so the two variants produce different cents for identical stored inputs. Note the interaction with expiry: once the clock sweep has moved the permit to EXPIRED every roster artist is INACTIVE, so a late FINAL evaluation legitimately sees n == 0 and charges base plus late only until the artists are reinstated."
    note: |
      Combinatorial mode (b): the scaffold pins 'round each line then sum' over
      'sum then round'. Worked reference: n = 5, no expedite, on time gives per-line
      26875 + 37088 + 5644 = 69607, whereas sum-then-round would give 69606.

  - name: establishment_risk_score
    trigger: "Recomputed on every mutation that changes an open Violation set, a Complaint status, an InfectionReport investigation_status, a SterilizationRecord set, or a minor ProcedureLog audit_status for the establishment"
    algorithm: weighted_scoring
    formula: |
      window_start = current_logical_clock - RISK_LOOKBACK_DAYS days   # closed on both ends
      open_critical    = Establishment.open_critical_violation_count
      open_noncritical = Establishment.open_violation_count - Establishment.open_critical_violation_count
      substantiated    = count(Complaint C : C.establishment_id == E.id
                                             AND C.status == SUBSTANTIATED
                                             AND C.received_at in [window_start, now])
      confirmed_inf    = count(InfectionReport R : R.establishment_id == E.id
                                             AND R.investigation_status == CONFIRMED
                                             AND R.created_at in [window_start, now])
      flagged_minor    = count(ProcedureLog P : P.establishment_id == E.id
                                             AND P.client_age < MINOR_AGE_THRESHOLD
                                             AND P.audit_status == FLAGGED
                                             AND P.started_at in [window_start, now])
      ster_penalty     = STERILIZATION_NONCOMPLIANT_PENALTY if E.sterilization_compliance_status == NONCOMPLIANT
                       = STERILIZATION_DEFICIENT_PENALTY    if E.sterilization_compliance_status == DEFICIENT
                       = 0                                   if E.sterilization_compliance_status == COMPLIANT

      score = OPEN_CRITICAL_WEIGHT          * open_critical
            + OPEN_NONCRITICAL_WEIGHT       * open_noncritical
            + SUBSTANTIATED_COMPLAINT_WEIGHT * substantiated
            + CONFIRMED_INFECTION_WEIGHT    * confirmed_inf
            + FLAGGED_MINOR_LOG_WEIGHT      * flagged_minor
            + ster_penalty
            + in_flight_term                # variant-dependent, see variants
      result = min(RISK_SCORE_CAP, score)
    input_set: "All Violation rows in {ISSUED, CORRECTION_SUBMITTED, ESCALATED} reachable through the establishment's inspections (no time window), plus Complaint, InfectionReport and minor ProcedureLog rows whose anchor timestamp falls in the closed window [now - RISK_LOOKBACK_DAYS, now]."
    constants:
      OPEN_CRITICAL_WEIGHT: 15
      OPEN_NONCRITICAL_WEIGHT: 5
      SUBSTANTIATED_COMPLAINT_WEIGHT: 10
      CONFIRMED_INFECTION_WEIGHT: 20
      FLAGGED_MINOR_LOG_WEIGHT: 12
      STERILIZATION_NONCOMPLIANT_PENALTY: 25
      STERILIZATION_DEFICIENT_PENALTY: 10
      IN_FLIGHT_COMPLAINT_WEIGHT: 5
      IN_FLIGHT_INFECTION_WEIGHT: 10
      RISK_LOOKBACK_DAYS: 365
      RISK_SCORE_CAP: 100
    precision: "Whole integer points in [0, 100]; no rounding is required because every weight and count is an integer."
    variants:
      - name: PROVISIONAL
        when: "Persisted to Establishment.risk_score and used by calculation operating_posture and by the RISK_SUSPENSION_THRESHOLD cascade."
        difference: "in_flight_term = 0. Only Complaint rows in SUBSTANTIATED and InfectionReport rows in CONFIRMED contribute; complaints under triage or investigation and infection reports under screening are excluded entirely."
      - name: AUDIT
        when: "Exposed as risk_score_audit by GET /body-art/establishments/{establishment_id}/compliance-summary; never persisted and never used to gate a transition."
        difference: "in_flight_term = IN_FLIGHT_COMPLAINT_WEIGHT * count(Complaint in {TRIAGED, INVESTIGATING}) + IN_FLIGHT_INFECTION_WEIGHT * count(InfectionReport with investigation_status == SCREENING), both over the same closed window. Identical stored data therefore yields a strictly larger AUDIT figure whenever any complaint or infection report is still in flight."
    note: |
      Dual-variant instance on the Establishment risk domain: the same rows produce
      two different scores depending on whether in-flight cases count. The
      PROVISIONAL figure alone gates posture and suspension.

  - name: reinstatement_penalty
    trigger: "POST /body-art/enforcement-actions/{enforcement_action_id}/lift, evaluated before the ACTIVE -> LIFTED transition is written"
    algorithm: tiered_pricing
    formula: |
      # The apparent circularity is 'the administrative fee is a percentage of the
      # reinstatement total, and the total includes the administrative fee'. The
      # evaluation order below resolves it: the tier is keyed on the BASE figure,
      # never on the total.
      # Step 1
      suspension_days = floor((lift_instant - EnforcementAction.issued_at) / 86400 seconds)
      base_cents = REINSTATEMENT_BASE_CENTS + SUSPENSION_DAY_RATE_CENTS * suspension_days
      # Step 2 - tier lookup keyed on base_cents (NOT on the total)
      admin_pct = ADMIN_PCT_TIER1 if base_cents < ADMIN_TIER1_CEILING_CENTS
                = ADMIN_PCT_TIER2 if ADMIN_TIER1_CEILING_CENTS <= base_cents < ADMIN_TIER2_CEILING_CENTS
                = ADMIN_PCT_TIER3 if base_cents >= ADMIN_TIER2_CEILING_CENTS
      # Step 3
      admin_fee_cents = round_half_up(base_cents * admin_pct)
      # Step 4
      total_cents = base_cents + admin_fee_cents
    input_set: "A single EnforcementAction row with status == ACTIVE and action_type == SUSPENSION; suspension_days is whole days floored, so a lift 19 days and 23 hours after issuance yields 19."
    constants:
      REINSTATEMENT_BASE_CENTS: 50000
      SUSPENSION_DAY_RATE_CENTS: 2600
      ADMIN_TIER1_CEILING_CENTS: 100000
      ADMIN_TIER2_CEILING_CENTS: 200000
      ADMIN_PCT_TIER1: 0.05
      ADMIN_PCT_TIER2: 0.08
      ADMIN_PCT_TIER3: 0.12
    precision: "Whole cents, round_half_up, applied once at Step 3."
    note: |
      Combinatorial mode (c): 19 suspension days give base 99400, tier 1 at 5 percent,
      admin 4970 and total 104370. Keying the tier on the total (104370, which sits in
      tier 2) would instead give 7952 and 107352, so the pinned order is observable.

  - name: sterilization_compliance_status
    trigger: "Recomputed on POST /body-art/sterilization-records, on POST /body-art/_clock/set_current_utc, and whenever Establishment.risk_score is recomputed"
    algorithm: threshold
    formula: |
      window = [current_logical_clock - STERILIZATION_LOOKBACK_DAYS days, current_logical_clock]   # closed both ends
      candidates = { SterilizationRecord S : S.establishment_id == E.id
                                             AND S.cycle_completed_at in window
                                             AND no SterilizationRecord T exists with T.supersedes_record_id == S.id }
      if count(candidates) == 0:                                    return NONCOMPLIANT
      if any S in candidates has S.spore_test_result in {FAIL, PENDING}: return NONCOMPLIANT
      if count(S in candidates with S.spore_test_result == PASS) >= SPORE_TESTS_REQUIRED_PER_WINDOW:
                                                                    return COMPLIANT
      return DEFICIENT
    input_set: "SterilizationRecord rows of this establishment whose cycle_completed_at falls in the closed trailing window and which are not superseded by a later retest record; superseded rows are removed from the candidate set entirely, including their FAIL results."
    constants:
      STERILIZATION_LOOKBACK_DAYS: 30
      SPORE_TESTS_REQUIRED_PER_WINDOW: 4
    precision: "Enum result; counts are exact integers."
    note: |
      Empty-set boundary is pinned explicitly: zero candidate records is NONCOMPLIANT,
      not vacuously COMPLIANT. Exactly SPORE_TESTS_REQUIRED_PER_WINDOW passes is
      COMPLIANT (>=, not >); one fewer is DEFICIENT.

  - name: operating_posture
    trigger: "Recomputed whenever Establishment.permit_status, Establishment.risk_score, Establishment.open_critical_violation_count or Establishment.sterilization_compliance_status changes"
    algorithm: constraint_propagation
    formula: |
      if Establishment.permit_status in {PENDING_PLAN_REVIEW, PENDING_INSPECTION, SUSPENDED, EXPIRED, REVOKED}:
          return CLOSED
      # permit_status == ACTIVE from here on
      if Establishment.risk_score >= RISK_RESTRICTED_THRESHOLD
         or Establishment.open_critical_violation_count > 0:
          return RESTRICTED
      return OPEN
    input_set: "Only the four Establishment fields named in the trigger; no other entity is consulted directly."
    constants:
      RISK_RESTRICTED_THRESHOLD: 60
      RISK_SUSPENSION_THRESHOLD: 80
    precision: "Enum result."
    note: |
      RISK_SUSPENSION_THRESHOLD is not consumed here; it is the breakpoint used by the
      violation-issuance cascade to auto-create a SUSPENSION EnforcementAction.
      Posture gates child operations: CLOSED blocks all ProcedureLog creation,
      RESTRICTED blocks ProcedureLog creation only for clients below MINOR_AGE_THRESHOLD.

  - name: violation_abatement_deadline
    trigger: "POST /body-art/inspections/{inspection_id}/violations, at row creation"
    algorithm: interval_merge
    formula: |
      days = CRITICAL_ABATEMENT_DAYS    if Violation.severity == CRITICAL
           = NONCRITICAL_ABATEMENT_DAYS if Violation.severity == NONCRITICAL
      Violation.abatement_due_at = Violation.issued_at + days days
    input_set: "The single Violation row being created; issued_at is the current logical-clock instant."
    constants:
      CRITICAL_ABATEMENT_DAYS: 3
      NONCRITICAL_ABATEMENT_DAYS: 14
    precision: "Exact instant arithmetic; no rounding. Comparisons against abatement_due_at are >= for 'overdue' and < for 'still within the abatement period'."

  - name: minor_consent_audit_rate
    trigger: "GET /body-art/establishments/{establishment_id}/compliance-summary"
    algorithm: aggregation
    formula: |
      window = [current_logical_clock - AUDIT_WINDOW_DAYS days, current_logical_clock]   # closed both ends
      denominator = count(ProcedureLog P : P.establishment_id == E.id
                                           AND P.client_age < MINOR_AGE_THRESHOLD
                                           AND P.started_at in window)
      numerator   = count of those P with P.audit_status == FLAGGED
      if denominator == 0:
          return 0.0        # pinned empty-set result: exactly 0.0, never null and never an error
      return round_half_up(numerator / denominator, 4)
    input_set: "ProcedureLog rows of this establishment with client_age strictly below MINOR_AGE_THRESHOLD whose started_at falls in the closed trailing AUDIT_WINDOW_DAYS window; adult logs are excluded from both numerator and denominator."
    constants:
      AUDIT_WINDOW_DAYS: 90
      MINOR_AGE_THRESHOLD: 18
    precision: "Four decimal places, round_half_up; the empty-denominator case returns the literal 0.0."

global_constants:
  LOGICAL_CLOCK_DEFAULT_UTC: "2026-05-01T00:00:00Z"
  PERMIT_TERM_DAYS: 365
  BBP_TRAINING_VALIDITY_DAYS: 730
  MINOR_AGE_THRESHOLD: 18
  MINOR_CONSENT_VALIDITY_DAYS: 30
  MIN_STERILIZATION_AREA_SQFT: 40
  PLAN_REVIEW_MAX_CYCLES: 3
  RENEWAL_MAX_CYCLES: 3
  COMPLAINT_MAX_REOPENS: 2
  INFECTION_MAX_REOPENS: 2
  COMPLAINT_TRIAGE_DEADLINE_DAYS: 5
  COMPLAINT_INSPECTION_LEAD_HOURS: 24
  COMPLAINT_INSPECTION_WINDOW_MINUTES: 120
  INFECTION_NOTIFICATION_DEADLINE_HOURS: 24
  INSPECTION_BUFFER_MINUTES: 60
  REINSPECTION_LEAD_DAYS: 7
  REINSPECTION_WINDOW_MINUTES: 120
  CRITICAL_ABATEMENT_DAYS: 3
  NONCRITICAL_ABATEMENT_DAYS: 14
  RISK_RESTRICTED_THRESHOLD: 60
  RISK_SUSPENSION_THRESHOLD: 80
  SPORE_TESTS_REQUIRED_PER_WINDOW: 4
  STERILIZATION_LOOKBACK_DAYS: 30
  AUDIT_WINDOW_DAYS: 90
  RISK_LOOKBACK_DAYS: 365
  INSPECTION_PASS_SCORE: 70

validations:
  - priority: 1
    category: auth
    check: "Both X-User-Role and X-User-ID headers are present and X-User-Role names a role declared in the RBAC matrix."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "The role in X-User-Role appears in the called endpoint's roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Every {..._id} segment in the request path resolves to a stored row, validated left to right; the first unresolved segment decides the error: establishments -> ERR_ESTABLISHMENT_NOT_FOUND, artists -> ERR_ARTIST_NOT_FOUND, plan-reviews -> ERR_PLAN_REVIEW_NOT_FOUND, inspections -> ERR_INSPECTION_NOT_FOUND, violations -> ERR_VIOLATION_NOT_FOUND, sterilization-records -> ERR_STERILIZATION_RECORD_NOT_FOUND, minor-consents -> ERR_MINOR_CONSENT_NOT_FOUND, procedure-logs -> ERR_PROCEDURE_LOG_NOT_FOUND, complaints -> ERR_COMPLAINT_NOT_FOUND, infection-reports -> ERR_INFECTION_REPORT_NOT_FOUND, enforcement-actions -> ERR_ENFORCEMENT_ACTION_NOT_FOUND, renewal-applications -> ERR_RENEWAL_APPLICATION_NOT_FOUND."
    error_id: ERR_ESTABLISHMENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying a path id"
  - priority: 4
    category: business_constraint
    check: "Request body shape: every required input field is present, every enum field holds a declared member, numeric fields respect their declared ranges, datetime fields are ISO 8601 UTC, scheduled_end_at is strictly after scheduled_start_at, ended_at is strictly after started_at, and pagination limit is an integer in [1, 100] with offset an integer >= 0."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all
  - priority: 5
    category: existence
    check: "Every foreign-key id supplied in the request body resolves to a stored row (establishment_id, artist_id, minor_consent_id, supersedes_record_id)."
    error_id: ERR_ESTABLISHMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /body-art/artists, POST /body-art/plan-reviews, POST /body-art/inspections, POST /body-art/sterilization-records, POST /body-art/minor-consents, POST /body-art/procedure-logs, POST /body-art/complaints, POST /body-art/infection-reports, POST /body-art/renewal-applications"
  - priority: 6
    category: business_referential
    check: "For an entity_backed role, the caller owns the resource: an EstablishmentOperator's X-User-ID equals the establishment_id reached from the target resource, and an Artist's X-User-ID equals the target Artist.id or the artist_id in the body."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "every write endpoint whose roles list includes EstablishmentOperator or Artist"
  - priority: 7
    category: business_referential
    check: "On POST /body-art/procedure-logs, the Artist named by artist_id has establishment_id equal to the establishment_id in the body."
    error_id: ERR_ARTIST_ESTABLISHMENT_MISMATCH
    http_status: 409
    applies_to: "POST /body-art/procedure-logs"
  - priority: 8
    category: business_referential
    check: "Segregation of duties: on a lift, the calling X-User-ID differs from EnforcementAction.issued_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /body-art/enforcement-actions/{enforcement_action_id}/lift"
  - priority: 9
    category: business_constraint
    check: "Optimistic concurrency: expected_establishment_version equals Establishment.version, and expected_artist_version equals Artist.version, at the moment the write is applied."
    error_id: ERR_STALE_ESTABLISHMENT_VERSION
    http_status: 412
    applies_to: "POST /body-art/renewal-applications (ERR_STALE_ESTABLISHMENT_VERSION), POST /body-art/artists/{artist_id}/enforcement-actions (ERR_STALE_ARTIST_VERSION)"
  - priority: 10
    category: state
    check: "The target row is in a from-state that the requested transition declares; the entity decides the error: Establishment -> ERR_ESTABLISHMENT_STATE_INVALID, Artist -> ERR_ARTIST_STATE_INVALID, PlanReview -> ERR_PLAN_REVIEW_STATE_INVALID, Inspection -> ERR_INSPECTION_STATE_INVALID, Violation -> ERR_VIOLATION_STATE_INVALID, MinorConsent -> ERR_CONSENT_STATE_INVALID, ProcedureLog -> ERR_PROCEDURE_LOG_STATE_INVALID, Complaint -> ERR_COMPLAINT_STATE_INVALID, InfectionReport -> ERR_INFECTION_STATE_INVALID, EnforcementAction -> ERR_ENFORCEMENT_STATE_INVALID, RenewalApplication -> ERR_RENEWAL_STATE_INVALID."
    error_id: ERR_INSPECTION_STATE_INVALID
    http_status: 409
    applies_to: "every action endpoint that drives a state machine transition"
  - priority: 11
    category: state
    check: "The Establishment named by establishment_id has operating_posture != CLOSED."
    error_id: ERR_ESTABLISHMENT_NOT_OPERATING
    http_status: 409
    applies_to: "POST /body-art/procedure-logs"
  - priority: 12
    category: business_safety
    check: "The Artist named by artist_id has bbp_training_expires_on strictly after ProcedureLog.started_at."
    error_id: ERR_ARTIST_BBP_EXPIRED
    http_status: 422
    applies_to: "POST /body-art/procedure-logs"
  - priority: 13
    category: business_safety
    check: "The Artist named by artist_id has permit_status == ACTIVE."
    error_id: ERR_ARTIST_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /body-art/procedure-logs"
  - priority: 14
    category: business_safety
    check: "When Establishment.operating_posture == RESTRICTED, client_age must be greater than or equal to MINOR_AGE_THRESHOLD; a RESTRICTED premises may keep serving adults but not minors."
    error_id: ERR_RESTRICTED_POSTURE_MINOR_BLOCK
    http_status: 409
    applies_to: "POST /body-art/procedure-logs"
  - priority: 15
    category: business_safety
    check: "When client_age is strictly below MINOR_AGE_THRESHOLD, minor_consent_id is present."
    error_id: ERR_MINOR_CONSENT_REQUIRED
    http_status: 422
    applies_to: "POST /body-art/procedure-logs"
  - priority: 16
    category: business_safety
    check: "The referenced MinorConsent has verification_status == VERIFIED."
    error_id: ERR_MINOR_CONSENT_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /body-art/procedure-logs"
  - priority: 17
    category: business_temporal
    check: "ProcedureLog.started_at is strictly before MinorConsent.expires_at."
    error_id: ERR_MINOR_CONSENT_EXPIRED
    http_status: 409
    applies_to: "POST /body-art/procedure-logs"
  - priority: 18
    category: business_referential
    check: "MinorConsent.authorized_procedure_type equals ProcedureLog.procedure_type, and MinorConsent.establishment_id equals ProcedureLog.establishment_id."
    error_id: ERR_MINOR_CONSENT_MISMATCH
    http_status: 409
    applies_to: "POST /body-art/procedure-logs"
  - priority: 19
    category: business_constraint
    check: "When client_age is greater than or equal to MINOR_AGE_THRESHOLD, minor_consent_id is null."
    error_id: ERR_MINOR_CONSENT_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /body-art/procedure-logs"
  - priority: 20
    category: business_temporal
    check: "Artist session exclusivity, half-open [started_at, ended_at) with no buffer: the new session must not intersect any existing ProcedureLog with the same artist_id in any audit_status. Adjacency is allowed - an existing session ending exactly at the new session's started_at, or starting exactly at the new session's ended_at, does not conflict."
    error_id: ERR_ARTIST_SESSION_OVERLAP
    http_status: 409
    applies_to: "POST /body-art/procedure-logs"
  - priority: 21
    category: business_temporal
    check: "Establishment visit exclusivity, closed intervals expanded by INSPECTION_BUFFER_MINUTES on both sides: the new window [scheduled_start_at - 60min, scheduled_end_at + 60min] must not intersect the identically expanded window of any Inspection with the same establishment_id whose status is in {SCHEDULED, IN_PROGRESS}. Touching endpoints of the expanded windows count as a conflict. Inspections created by the FAILED-finalize follow-up cascade and by Complaint TRIAGE are also checked; only the SCHEDULED and IN_PROGRESS rows participate."
    error_id: ERR_INSPECTION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /body-art/inspections, POST /body-art/complaints/{complaint_id}/transition with action TRIAGE"
  - priority: 22
    category: business_safety
    check: "Establishment activation requires at least one Inspection with inspection_type == PREOPENING and status == PASSED for that establishment."
    error_id: ERR_PREOPENING_INSPECTION_REQUIRED
    http_status: 409
    applies_to: "POST /body-art/establishments/{establishment_id}/activate"
  - priority: 23
    category: business_referential
    check: "Artist activation requires the parent Establishment to have permit_status == ACTIVE."
    error_id: ERR_ESTABLISHMENT_PERMIT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /body-art/artists/{artist_id}/activate"
  - priority: 24
    category: business_safety
    check: "Artist activation requires bbp_training_expires_on to be non-null and strictly after the current logical-clock instant."
    error_id: ERR_ARTIST_BBP_MISSING
    http_status: 422
    applies_to: "POST /body-art/artists/{artist_id}/activate"
  - priority: 25
    category: business_constraint
    check: "A PlanReview resubmit requires cycle_count strictly less than PLAN_REVIEW_MAX_CYCLES."
    error_id: ERR_PLAN_REVIEW_CYCLE_LIMIT
    http_status: 409
    applies_to: "POST /body-art/plan-reviews/{plan_review_id}/resubmit"
  - priority: 26
    category: business_constraint
    check: "A PlanReview APPROVE decision requires has_handwash_sink == true and sterilization_area_sqft >= MIN_STERILIZATION_AREA_SQFT."
    error_id: ERR_PLAN_REVIEW_REQUIREMENTS_NOT_MET
    http_status: 422
    applies_to: "POST /body-art/plan-reviews/{plan_review_id}/decision"
  - priority: 27
    category: business_constraint
    check: "An establishment may hold at most one PlanReview whose status is in {SUBMITTED, CORRECTIONS_REQUIRED}."
    error_id: ERR_DUPLICATE_OPEN_PLAN_REVIEW
    http_status: 409
    applies_to: "POST /body-art/plan-reviews"
  - priority: 28
    category: business_constraint
    check: "A Complaint REOPEN requires reopen_count strictly less than COMPLAINT_MAX_REOPENS."
    error_id: ERR_COMPLAINT_REOPEN_LIMIT
    http_status: 409
    applies_to: "POST /body-art/complaints/{complaint_id}/transition"
  - priority: 29
    category: business_constraint
    check: "An InfectionReport REOPEN requires reopen_count strictly less than INFECTION_MAX_REOPENS."
    error_id: ERR_INFECTION_REOPEN_LIMIT
    http_status: 409
    applies_to: "POST /body-art/infection-reports/{infection_report_id}/investigation"
  - priority: 30
    category: business_constraint
    check: "MARK_NOT_REQUIRED on the notification axis requires infection_type == OTHER; every other infection_type is registry-reportable."
    error_id: ERR_NOTIFICATION_NOT_WAIVABLE
    http_status: 409
    applies_to: "POST /body-art/infection-reports/{infection_report_id}/notification"
  - priority: 31
    category: business_referential
    check: "At most one EnforcementAction with status == ACTIVE may exist per subject; a second create against the same establishment_id or artist_id is rejected."
    error_id: ERR_ACTIVE_ENFORCEMENT_EXISTS
    http_status: 409
    applies_to: "POST /body-art/establishments/{establishment_id}/enforcement-actions, POST /body-art/artists/{artist_id}/enforcement-actions"
  - priority: 32
    category: business_referential
    check: "Only a SUSPENSION action can be lifted; a REVOCATION action is permanent."
    error_id: ERR_ENFORCEMENT_NOT_LIFTABLE
    http_status: 409
    applies_to: "POST /body-art/enforcement-actions/{enforcement_action_id}/lift"
  - priority: 33
    category: business_safety
    check: "A renewal APPROVE requires Establishment.open_critical_violation_count == 0."
    error_id: ERR_OPEN_CRITICAL_VIOLATION_BLOCKS_RENEWAL
    http_status: 409
    applies_to: "POST /body-art/renewal-applications/{renewal_application_id}/review"
  - priority: 34
    category: business_safety
    check: "A renewal APPROVE requires Establishment.sterilization_compliance_status to be COMPLIANT or DEFICIENT; NONCOMPLIANT blocks the approval."
    error_id: ERR_STERILIZATION_NONCOMPLIANT
    http_status: 409
    applies_to: "POST /body-art/renewal-applications/{renewal_application_id}/review"
  - priority: 35
    category: business_referential
    check: "A renewal APPROVE requires that no EnforcementAction with establishment_id == the application's establishment and status == ACTIVE exists."
    error_id: ERR_ACTIVE_ENFORCEMENT_BLOCKS_RENEWAL
    http_status: 409
    applies_to: "POST /body-art/renewal-applications/{renewal_application_id}/review"
  - priority: 36
    category: business_referential
    check: "A renewal APPROVE requires attested_bbp_current == true and attested_sterilization_logs_complete == true on the application."
    error_id: ERR_RENEWAL_ATTESTATION_MISSING
    http_status: 422
    applies_to: "POST /body-art/renewal-applications/{renewal_application_id}/review"
  - priority: 37
    category: business_constraint
    check: "A renewal resubmit from DEFICIENT requires cycle_count strictly less than RENEWAL_MAX_CYCLES."
    error_id: ERR_RENEWAL_CYCLE_LIMIT
    http_status: 409
    applies_to: "POST /body-art/renewal-applications/{renewal_application_id}/submit"
  - priority: 38
    category: business_fiscal
    check: "A renewal APPROVE requires payment_status == PAID on the application."
    error_id: ERR_RENEWAL_FEE_UNPAID
    http_status: 402
    applies_to: "POST /body-art/renewal-applications/{renewal_application_id}/review"
  - priority: 39
    category: business_fiscal
    check: "A payment's amount_cents equals the outstanding amount: (fee_estimate_cents - fee_paid_cents) while status is in {SUBMITTED, DEFICIENT}, or fee_balance_due_cents while status == APPROVED."
    error_id: ERR_FEE_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /body-art/renewal-applications/{renewal_application_id}/payment"
  - priority: 40
    category: business_fiscal
    check: "A refund requires payment_status == PAID and status in {DENIED, SUPERSEDED}."
    error_id: ERR_REFUND_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /body-art/renewal-applications/{renewal_application_id}/refund"
  - priority: 41
    category: business_constraint
    check: "supersedes_record_id, when supplied, must reference a SterilizationRecord with the same establishment_id that is not already superseded by another record."
    error_id: ERR_STERILIZATION_SUPERSEDE_INVALID
    http_status: 409
    applies_to: "POST /body-art/sterilization-records"
  - priority: 42
    category: business_temporal
    check: "cycle_completed_at is less than or equal to the current logical-clock instant."
    error_id: ERR_CYCLE_TIMESTAMP_FUTURE
    http_status: 422
    applies_to: "POST /body-art/sterilization-records"
  - priority: 43
    category: business_temporal
    check: "The logical clock only moves forward: to_iso8601 must be strictly after the current logical-clock instant."
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 409
    applies_to: "POST /body-art/_clock/set_current_utc"

endpoints:
  - method: POST
    path: "/body-art/establishments"
    description: "Register a new body-art establishment record in PENDING_PLAN_REVIEW."
    roles: [HealthOfficer]
    code: 201
    input: [name, street_address, county_code, establishment_type]
    output: Establishment
    side_effects:
      - "creates the Establishment with permit_status PENDING_PLAN_REVIEW and operating_posture CLOSED"
      - "runs calculation sterilization_compliance_status over an empty record set, yielding NONCOMPLIANT"
      - "runs calculation establishment_risk_score (PROVISIONAL), yielding STERILIZATION_NONCOMPLIANT_PENALTY = 25"
      - "the returned id is the value an EstablishmentOperator uses as X-User-ID"
  - method: GET
    path: "/body-art/establishments/{establishment_id}"
    description: "Read one establishment with all derived posture and compliance fields."
    roles: [HealthOfficer, Inspector, PlanReviewer, RecordsClerk, EstablishmentOperator]
    code: 200
    input: []
    output: Establishment
    side_effects: []
  - method: GET
    path: "/body-art/establishments"
    description: "List establishments with filtering and pagination."
    roles: [HealthOfficer, Inspector, PlanReviewer, RecordsClerk]
    code: 200
    input: ["county_code?", "permit_status?", "operating_posture?", "limit?", "offset?"]
    output: Establishment[]
    side_effects: []
  - method: POST
    path: "/body-art/establishments/{establishment_id}/activate"
    description: "Issue the establishment permit after plan review approval and a passed pre-opening inspection."
    roles: [HealthOfficer]
    code: 200
    input: []
    output: Establishment
    side_effects:
      - "drives the Establishment PENDING_INSPECTION -> ACTIVE transition"
      - "sets permit_issued_on to the current logical clock and permit_expires_on to that instant + PERMIT_TERM_DAYS"
      - "recomputes operating_posture"
      - "increments Establishment.version by 1"
  - method: GET
    path: "/body-art/establishments/{establishment_id}/compliance-summary"
    description: "Computed read exposing both risk-score variants, the sterilization window verdict and the minor-consent audit rate."
    roles: [HealthOfficer, Inspector, RecordsClerk, EstablishmentOperator]
    code: 200
    input: []
    output: "{ establishment_id: string, permit_status: string, operating_posture: string, risk_score_provisional: integer, risk_score_audit: integer, sterilization_compliance_status: string, sterilization_candidate_count: integer, sterilization_pass_count: integer, open_violation_count: integer, open_critical_violation_count: integer, active_artist_count: integer, minor_procedure_count_in_window: integer, flagged_minor_procedure_count: integer, minor_consent_audit_rate: number }"
    side_effects:
      - "evaluates calculation establishment_risk_score under both the PROVISIONAL and the AUDIT variant"
      - "evaluates calculation sterilization_compliance_status and calculation minor_consent_audit_rate"
      - "persists nothing"
  - method: POST
    path: "/body-art/establishments/{establishment_id}/enforcement-actions"
    description: "Issue a suspension or revocation against the establishment."
    roles: [HealthOfficer]
    code: 201
    input: [action_type, reason_code]
    output: EnforcementAction
    side_effects:
      - "creates the EnforcementAction with subject_type ESTABLISHMENT, status ACTIVE, auto_generated false and issued_by_user_id set to the caller"
      - "drives the Establishment ACTIVE -> SUSPENDED or ACTIVE -> REVOKED transition and the artist and inspection cascades under it"
  - method: POST
    path: "/body-art/artists"
    description: "Register an individual artist against an establishment in PENDING."
    roles: [HealthOfficer, EstablishmentOperator]
    code: 201
    input: [establishment_id, legal_name]
    output: Artist
    side_effects:
      - "creates the Artist with permit_status PENDING and no bloodborne-pathogen training on file"
      - "the returned id is the value an Artist uses as X-User-ID"
  - method: GET
    path: "/body-art/artists/{artist_id}"
    description: "Read one artist record."
    roles: [HealthOfficer, Inspector, RecordsClerk, EstablishmentOperator, Artist]
    code: 200
    input: []
    output: Artist
    side_effects: []
  - method: GET
    path: "/body-art/artists"
    description: "List artists, filterable by establishment and permit status."
    roles: [HealthOfficer, Inspector, RecordsClerk, EstablishmentOperator]
    code: 200
    input: ["establishment_id?", "permit_status?", "limit?", "offset?"]
    output: Artist[]
    side_effects: []
  - method: POST
    path: "/body-art/artists/{artist_id}/bbp-training"
    description: "Record a bloodborne-pathogen training completion for the artist."
    roles: [Artist, EstablishmentOperator]
    code: 200
    input: [completed_on]
    output: Artist
    side_effects:
      - "sets bbp_training_completed_on to completed_on and bbp_training_expires_on to completed_on + BBP_TRAINING_VALIDITY_DAYS"
      - "clears bbp_recert_required to false"
      - "when permit_status == PROBATION, drives the Artist PROBATION -> ACTIVE transition and increments Establishment.active_artist_count"
  - method: POST
    path: "/body-art/artists/{artist_id}/activate"
    description: "Issue the individual artist permit."
    roles: [HealthOfficer]
    code: 200
    input: []
    output: Artist
    side_effects:
      - "drives the Artist PENDING -> ACTIVE transition"
      - "copies Establishment.permit_expires_on to Artist.permit_expires_on"
      - "increments Establishment.active_artist_count by 1 and Establishment.version by 1"
  - method: POST
    path: "/body-art/artists/{artist_id}/enforcement-actions"
    description: "Issue a suspension or revocation against an individual artist under optimistic concurrency on the artist record."
    roles: [HealthOfficer]
    code: 201
    input: [action_type, reason_code, expected_artist_version]
    output: EnforcementAction
    side_effects:
      - "rejects with ERR_STALE_ARTIST_VERSION (412) when expected_artist_version does not equal Artist.version"
      - "creates the EnforcementAction with subject_type ARTIST, status ACTIVE and issued_by_user_id set to the caller"
      - "drives the Artist ACTIVE/PROBATION -> SUSPENDED or ACTIVE -> REVOKED transition"
      - "increments Artist.version by 1"
  - method: POST
    path: "/body-art/plan-reviews"
    description: "Submit construction plans for the establishment."
    roles: [EstablishmentOperator]
    code: 201
    input: [establishment_id, floor_plan_reference, sterilization_area_sqft, procedure_station_count, has_handwash_sink]
    output: PlanReview
    side_effects:
      - "creates the PlanReview in SUBMITTED with cycle_count 1"
  - method: GET
    path: "/body-art/plan-reviews/{plan_review_id}"
    description: "Read one plan review."
    roles: [HealthOfficer, PlanReviewer, EstablishmentOperator]
    code: 200
    input: []
    output: PlanReview
    side_effects: []
  - method: GET
    path: "/body-art/plan-reviews"
    description: "List plan reviews, filterable by establishment and status."
    roles: [HealthOfficer, PlanReviewer, EstablishmentOperator]
    code: 200
    input: ["establishment_id?", "status?", "limit?", "offset?"]
    output: PlanReview[]
    side_effects: []
  - method: POST
    path: "/body-art/plan-reviews/{plan_review_id}/decision"
    description: "Record the plan reviewer's decision: APPROVE, REQUEST_CORRECTIONS or DENY."
    roles: [PlanReviewer]
    code: 200
    input: [decision, "decision_notes?"]
    output: PlanReview
    side_effects:
      - "drives SUBMITTED -> APPROVED / CORRECTIONS_REQUIRED / DENIED or CORRECTIONS_REQUIRED -> DENIED"
      - "on APPROVE, cascades the Establishment PENDING_PLAN_REVIEW -> PENDING_INSPECTION transition"
  - method: POST
    path: "/body-art/plan-reviews/{plan_review_id}/resubmit"
    description: "Resubmit corrected plans, re-entering the SUBMITTED state."
    roles: [EstablishmentOperator]
    code: 200
    input: [floor_plan_reference, sterilization_area_sqft, procedure_station_count, has_handwash_sink]
    output: PlanReview
    side_effects:
      - "drives CORRECTIONS_REQUIRED -> SUBMITTED, increments cycle_count and copies it to Establishment.plan_review_cycles_used"
      - "overwrites the four plan fields with the resubmitted values and clears decision_notes"
  - method: POST
    path: "/body-art/inspections"
    description: "Schedule an inspection visit window at an establishment."
    roles: [HealthOfficer, Inspector]
    code: 201
    input: [establishment_id, inspection_type, scheduled_start_at, scheduled_end_at]
    output: Inspection
    side_effects:
      - "creates the Inspection in SCHEDULED"
      - "enforces the buffered closed-interval exclusivity rule of validation priority 21 against SCHEDULED and IN_PROGRESS inspections of the same establishment"
  - method: GET
    path: "/body-art/inspections/{inspection_id}"
    description: "Read one inspection including its finalized score."
    roles: [HealthOfficer, Inspector, RecordsClerk, EstablishmentOperator]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: GET
    path: "/body-art/inspections"
    description: "List inspections, filterable by establishment, source complaint, status and type."
    roles: [HealthOfficer, Inspector, RecordsClerk, EstablishmentOperator]
    code: 200
    input: ["establishment_id?", "source_complaint_id?", "status?", "inspection_type?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: POST
    path: "/body-art/inspections/{inspection_id}/start"
    description: "Begin the on-site visit and snapshot the establishment's open-violation carryover."
    roles: [Inspector]
    code: 200
    input: []
    output: Inspection
    side_effects:
      - "drives SCHEDULED -> IN_PROGRESS"
      - "sets inspector_user_id to the caller and open_violation_count_at_start to Establishment.open_violation_count"
  - method: POST
    path: "/body-art/inspections/{inspection_id}/finalize"
    description: "Close the visit, score it via calculation inspection_score and branch to PASSED or FAILED."
    roles: [Inspector]
    code: 200
    input: []
    output: Inspection
    side_effects:
      - "writes repeat_multiplier_applied and deduction_points on every Violation of this inspection"
      - "writes Inspection.score and Inspection.finalized_at and drives IN_PROGRESS -> PASSED or IN_PROGRESS -> FAILED"
      - "on FAILED with inspection_type in {ROUTINE, COMPLAINT, REINSPECTION}, creates a follow-up REINSPECTION scheduled at finalized_at + REINSPECTION_LEAD_DAYS for REINSPECTION_WINDOW_MINUTES"
      - "recomputes Establishment.risk_score and Establishment.operating_posture"
  - method: POST
    path: "/body-art/inspections/{inspection_id}/violations"
    description: "Cite a violation during an in-progress inspection."
    roles: [Inspector]
    code: 201
    input: [violation_code, severity, narrative]
    output: Violation
    side_effects:
      - "creates the Violation in ISSUED with issued_at at the current logical clock and abatement_due_at per calculation violation_abatement_deadline"
      - "cascade hop 1: recomputes Establishment.open_violation_count and open_critical_violation_count"
      - "cascade hop 2: recomputes Establishment.risk_score from those counters"
      - "cascade hop 3: auto-creates a SUSPENSION EnforcementAction when risk_score >= RISK_SUSPENSION_THRESHOLD and no ACTIVE action exists"
      - "cascade hop 4: suspends the Establishment and sets operating_posture CLOSED"
      - "cascade hop 5: deactivates the establishment's artists and cancels its SCHEDULED ROUTINE inspections"
  - method: GET
    path: "/body-art/violations/{violation_id}"
    description: "Read one violation with its abatement deadline and scoring fields."
    roles: [HealthOfficer, Inspector, RecordsClerk, EstablishmentOperator]
    code: 200
    input: []
    output: Violation
    side_effects: []
  - method: GET
    path: "/body-art/violations"
    description: "List violations, filterable by inspection, status and severity."
    roles: [HealthOfficer, Inspector, RecordsClerk, EstablishmentOperator]
    code: 200
    input: ["inspection_id?", "status?", "severity?", "limit?", "offset?"]
    output: Violation[]
    side_effects: []
  - method: POST
    path: "/body-art/violations/{violation_id}/correction"
    description: "Operator submits evidence that the cited condition was corrected."
    roles: [EstablishmentOperator]
    code: 200
    input: [correction_note]
    output: Violation
    side_effects:
      - "drives ISSUED -> CORRECTION_SUBMITTED and stamps correction_submitted_at"
  - method: POST
    path: "/body-art/violations/{violation_id}/correction-decision"
    description: "Inspector verifies or rejects the submitted correction; a rejection after the abatement deadline escalates."
    roles: [Inspector]
    code: 200
    input: [decision]
    output: Violation
    side_effects:
      - "on VERIFY drives CORRECTION_SUBMITTED -> VERIFIED and recomputes Establishment.open_violation_count, open_critical_violation_count, risk_score and operating_posture"
      - "on REJECT before abatement_due_at drives CORRECTION_SUBMITTED -> ISSUED and clears correction_note"
      - "on REJECT at or after abatement_due_at drives CORRECTION_SUBMITTED -> ESCALATED"
  - method: POST
    path: "/body-art/sterilization-records"
    description: "File an autoclave cycle record with its biological indicator result."
    roles: [EstablishmentOperator]
    code: 201
    input: [establishment_id, device_serial, cycle_completed_at, spore_test_result, "supersedes_record_id?"]
    output: SterilizationRecord
    side_effects:
      - "creates the immutable SterilizationRecord"
      - "recomputes Establishment.sterilization_compliance_status, Establishment.risk_score and Establishment.operating_posture"
      - "increments Establishment.version by 1"
  - method: GET
    path: "/body-art/sterilization-records/{sterilization_record_id}"
    description: "Read one sterilization record."
    roles: [HealthOfficer, Inspector, RecordsClerk, EstablishmentOperator]
    code: 200
    input: []
    output: SterilizationRecord
    side_effects: []
  - method: GET
    path: "/body-art/sterilization-records"
    description: "List sterilization records, filterable by establishment, superseded record and spore test result."
    roles: [HealthOfficer, Inspector, RecordsClerk, EstablishmentOperator]
    code: 200
    input: ["establishment_id?", "supersedes_record_id?", "spore_test_result?", "limit?", "offset?"]
    output: SterilizationRecord[]
    side_effects: []
  - method: POST
    path: "/body-art/minor-consents"
    description: "File a guardian consent form for a minor client."
    roles: [EstablishmentOperator]
    code: 201
    input: [establishment_id, minor_full_name, minor_age_at_signing, guardian_full_name, guardian_id_document_type, guardian_id_document_number, authorized_procedure_type, consent_signed_at]
    output: MinorConsent
    side_effects:
      - "creates the MinorConsent in PENDING with expires_at = consent_signed_at + MINOR_CONSENT_VALIDITY_DAYS"
  - method: GET
    path: "/body-art/minor-consents/{minor_consent_id}"
    description: "Read one minor-consent record."
    roles: [HealthOfficer, Inspector, RecordsClerk, EstablishmentOperator]
    code: 200
    input: []
    output: MinorConsent
    side_effects: []
  - method: GET
    path: "/body-art/minor-consents"
    description: "List minor consents, filterable by establishment and verification status."
    roles: [HealthOfficer, Inspector, RecordsClerk, EstablishmentOperator]
    code: 200
    input: ["establishment_id?", "verification_status?", "limit?", "offset?"]
    output: MinorConsent[]
    side_effects: []
  - method: POST
    path: "/body-art/minor-consents/{minor_consent_id}/verify"
    description: "Records clerk verifies or rejects the guardian consent."
    roles: [RecordsClerk]
    code: 200
    input: [decision, "rejection_reason?"]
    output: MinorConsent
    side_effects:
      - "drives PENDING -> VERIFIED or PENDING -> REJECTED and stamps verified_by_user_id"
  - method: POST
    path: "/body-art/procedure-logs"
    description: "Artist records a completed body-art procedure session."
    roles: [Artist]
    code: 201
    input: [establishment_id, artist_id, "minor_consent_id?", client_age, procedure_type, started_at, ended_at, aftercare_provided]
    output: ProcedureLog
    side_effects:
      - "creates the ProcedureLog in audit_status RECORDED"
      - "enforces the half-open per-artist session exclusivity rule of validation priority 20"
      - "enforces the posture gate of validation priorities 11 and 14 and the minor-consent chain of priorities 15 through 19"
  - method: GET
    path: "/body-art/procedure-logs/{procedure_log_id}"
    description: "Read one procedure log."
    roles: [HealthOfficer, Inspector, RecordsClerk, EstablishmentOperator, Artist]
    code: 200
    input: []
    output: ProcedureLog
    side_effects: []
  - method: GET
    path: "/body-art/procedure-logs"
    description: "List procedure logs, filterable by establishment, artist, consent and audit status."
    roles: [HealthOfficer, Inspector, RecordsClerk, EstablishmentOperator]
    code: 200
    input: ["establishment_id?", "artist_id?", "minor_consent_id?", "audit_status?", "limit?", "offset?"]
    output: ProcedureLog[]
    side_effects: []
  - method: POST
    path: "/body-art/procedure-logs/{procedure_log_id}/audit"
    description: "Health officer flags a log entry with an audit finding or clears a previously flagged entry."
    roles: [HealthOfficer]
    code: 200
    input: [decision, "finding_code?"]
    output: ProcedureLog
    side_effects:
      - "drives RECORDED -> FLAGGED or FLAGGED -> CLEARED"
      - "for logs whose client_age is below MINOR_AGE_THRESHOLD, recomputes Establishment.risk_score and Establishment.operating_posture"
  - method: POST
    path: "/body-art/complaints"
    description: "A member of the public files a complaint against an establishment."
    roles: [PublicUser]
    code: 201
    input: [establishment_id, complainant_contact, category, narrative]
    output: Complaint
    side_effects:
      - "creates the Complaint in RECEIVED with received_at at the current logical clock and triage_due_at = received_at + COMPLAINT_TRIAGE_DEADLINE_DAYS"
  - method: GET
    path: "/body-art/complaints/{complaint_id}"
    description: "Read one complaint."
    roles: [HealthOfficer, Inspector, RecordsClerk, EstablishmentOperator]
    code: 200
    input: []
    output: Complaint
    side_effects: []
  - method: GET
    path: "/body-art/complaints"
    description: "List complaints, filterable by establishment and status."
    roles: [HealthOfficer, Inspector, RecordsClerk, EstablishmentOperator]
    code: 200
    input: ["establishment_id?", "status?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []
  - method: POST
    path: "/body-art/complaints/{complaint_id}/transition"
    description: "Advance the complaint through TRIAGE, INVESTIGATE, SUBSTANTIATE, UNSUBSTANTIATE and REOPEN."
    roles: [HealthOfficer]
    code: 200
    input: [action]
    output: Complaint
    side_effects:
      - "on TRIAGE sets triage_overdue and creates a COMPLAINT Inspection with source_complaint_id set, scheduled at the current logical clock + COMPLAINT_INSPECTION_LEAD_HOURS for COMPLAINT_INSPECTION_WINDOW_MINUTES"
      - "on SUBSTANTIATE and UNSUBSTANTIATE and REOPEN recomputes Establishment.risk_score and Establishment.operating_posture"
      - "on REOPEN increments reopen_count"
  - method: POST
    path: "/body-art/infection-reports"
    description: "File a reportable infection associated with a body-art procedure."
    roles: [PublicUser, EstablishmentOperator]
    code: 201
    input: [establishment_id, "artist_id?", reporter_contact, infection_type, procedure_date, symptom_onset_at]
    output: InfectionReport
    side_effects:
      - "creates the InfectionReport with investigation_status RECEIVED and notification_status PENDING"
      - "sets notification_due_at to created_at + INFECTION_NOTIFICATION_DEADLINE_HOURS"
  - method: GET
    path: "/body-art/infection-reports/{infection_report_id}"
    description: "Read one infection report with both parallel status axes."
    roles: [HealthOfficer, Inspector, RecordsClerk, EstablishmentOperator]
    code: 200
    input: []
    output: InfectionReport
    side_effects: []
  - method: GET
    path: "/body-art/infection-reports"
    description: "List infection reports, filterable by establishment, artist and either status axis."
    roles: [HealthOfficer, Inspector, RecordsClerk, EstablishmentOperator]
    code: 200
    input: ["establishment_id?", "artist_id?", "investigation_status?", "notification_status?", "limit?", "offset?"]
    output: InfectionReport[]
    side_effects: []
  - method: POST
    path: "/body-art/infection-reports/{infection_report_id}/investigation"
    description: "Advance the investigation axis with SCREEN, CONFIRM, RULE_OUT or REOPEN; the notification axis is untouched."
    roles: [HealthOfficer]
    code: 200
    input: [action]
    output: InfectionReport
    side_effects:
      - "on CONFIRM runs the four-hop cascade: report CONFIRMED, artist ACTIVE -> PROBATION with bbp_recert_required true, Establishment.active_artist_count decremented and risk_score recomputed, operating_posture recomputed"
      - "on REOPEN increments reopen_count"
  - method: POST
    path: "/body-art/infection-reports/{infection_report_id}/notification"
    description: "Advance the notification axis with NOTIFY, MARK_NOT_REQUIRED or CLOSE; the investigation axis is untouched."
    roles: [HealthOfficer]
    code: 200
    input: [action]
    output: InfectionReport
    side_effects:
      - "on NOTIFY sets notification_late by comparing the current logical clock against notification_due_at"
  - method: GET
    path: "/body-art/enforcement-actions/{enforcement_action_id}"
    description: "Read one enforcement action including its reinstatement penalty breakdown."
    roles: [HealthOfficer, Inspector, RecordsClerk, EstablishmentOperator]
    code: 200
    input: []
    output: EnforcementAction
    side_effects: []
  - method: GET
    path: "/body-art/enforcement-actions"
    description: "List enforcement actions, filterable by establishment, artist, subject type and status."
    roles: [HealthOfficer, Inspector, RecordsClerk, EstablishmentOperator]
    code: 200
    input: ["establishment_id?", "artist_id?", "subject_type?", "status?", "limit?", "offset?"]
    output: EnforcementAction[]
    side_effects: []
  - method: POST
    path: "/body-art/enforcement-actions/{enforcement_action_id}/lift"
    description: "Lift a suspension; segregation of duties forbids the issuing officer from lifting their own action."
    roles: [HealthOfficer]
    code: 200
    input: []
    output: EnforcementAction
    side_effects:
      - "rejects with ERR_SEGREGATION_OF_DUTIES (403) when the caller equals issued_by_user_id"
      - "drives ACTIVE -> LIFTED and writes suspension_days, reinstatement_base_cents, reinstatement_admin_fee_cents and reinstatement_total_cents per calculation reinstatement_penalty"
      - "reinstates the subject: Establishment SUSPENDED -> ACTIVE with its INACTIVE artists restored, or Artist SUSPENDED -> ACTIVE"
  - method: POST
    path: "/body-art/renewal-applications"
    description: "Open a renewal application in DRAFT under optimistic concurrency on the establishment; supersedes any prior non-terminal application for the same establishment."
    roles: [EstablishmentOperator]
    code: 201
    input: [establishment_id, requested_term_start_on, attested_bbp_current, attested_sterilization_logs_complete, "expedite_requested?", expected_establishment_version]
    output: RenewalApplication
    side_effects:
      - "rejects with ERR_STALE_ESTABLISHMENT_VERSION (412) when expected_establishment_version does not equal Establishment.version"
      - "transitions every prior RenewalApplication of the same establishment whose status is in {DRAFT, SUBMITTED, DEFICIENT} to SUPERSEDED"
      - "creates the new RenewalApplication in DRAFT with cycle_count 0 and payment_status UNPAID"
      - "increments Establishment.version by 1"
  - method: GET
    path: "/body-art/renewal-applications/{renewal_application_id}"
    description: "Read one renewal application including both fee variants."
    roles: [HealthOfficer, RecordsClerk, EstablishmentOperator]
    code: 200
    input: []
    output: RenewalApplication
    side_effects: []
  - method: GET
    path: "/body-art/renewal-applications"
    description: "List renewal applications, filterable by establishment, status and payment status."
    roles: [HealthOfficer, RecordsClerk, EstablishmentOperator]
    code: 200
    input: ["establishment_id?", "status?", "payment_status?", "limit?", "offset?"]
    output: RenewalApplication[]
    side_effects: []
  - method: POST
    path: "/body-art/renewal-applications/{renewal_application_id}/submit"
    description: "Submit the application, computing the ESTIMATE fee variant."
    roles: [EstablishmentOperator]
    code: 200
    input: []
    output: RenewalApplication
    side_effects:
      - "drives DRAFT -> SUBMITTED or DEFICIENT -> SUBMITTED, increments cycle_count and clears deficiency_code"
      - "snapshots artist_count_at_submit and writes fee_estimate_cents and late_fee_applied per the ESTIMATE variant of calculation renewal_fee_total"
  - method: POST
    path: "/body-art/renewal-applications/{renewal_application_id}/payment"
    description: "Record a payment against the outstanding renewal amount."
    roles: [EstablishmentOperator, RecordsClerk]
    code: 200
    input: [amount_cents]
    output: RenewalApplication
    side_effects:
      - "adds amount_cents to fee_paid_cents and sets payment_status to PAID"
      - "recomputes fee_balance_due_cents and Establishment.fees_paid_cents"
      - "increments Establishment.version by 1"
  - method: POST
    path: "/body-art/renewal-applications/{renewal_application_id}/review"
    description: "Health officer approves, marks deficient or denies the renewal; approval computes the FINAL fee variant."
    roles: [HealthOfficer]
    code: 200
    input: [decision, "deficiency_code?"]
    output: RenewalApplication
    side_effects:
      - "on APPROVE writes fee_final_cents and fee_balance_due_cents and extends Establishment.permit_expires_on to decided_at + PERMIT_TERM_DAYS, restoring an EXPIRED permit and its INACTIVE artists"
      - "on MARK_DEFICIENT writes deficiency_code and drives SUBMITTED -> DEFICIENT"
      - "on DENY drives SUBMITTED -> DENIED"
  - method: POST
    path: "/body-art/renewal-applications/{renewal_application_id}/refund"
    description: "Return the money collected against a denied or superseded application."
    roles: [RecordsClerk]
    code: 200
    input: []
    output: RenewalApplication
    side_effects:
      - "sets fee_refunded_cents to fee_paid_cents and payment_status to REFUNDED"
      - "recomputes Establishment.fees_refunded_cents so that fees_paid_cents - fees_refunded_cents returns to its pre-payment value"
      - "increments Establishment.version by 1"
  - method: POST
    path: "/body-art/_clock/set_current_utc"
    description: "Test-driving endpoint that moves the server's logical clock forward and runs the expiry and abatement sweep. Before the first call the logical clock reads exactly 2026-05-01T00:00:00Z; the server never falls back to real wall-clock time."
    roles: [HealthOfficer, Inspector, PlanReviewer, RecordsClerk, EstablishmentOperator, Artist, PublicUser]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, expired_establishment_ids: string[], escalated_violation_ids: string[] }"
    side_effects:
      - "sets the logical clock to to_iso8601; rejects a non-forward move with ERR_CLOCK_NOT_MONOTONIC"
      - "sweep step 1: every ACTIVE Establishment whose permit_expires_on is at or before the new instant transitions to EXPIRED, in Establishment.created_at ASC order, deactivating its artists"
      - "sweep step 2: every ISSUED Violation whose abatement_due_at is at or before the new instant transitions to ESCALATED, in Violation.created_at ASC order, recomputing the owning establishment's risk_score and operating_posture"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not a declared role."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The caller's role is not listed on the requested endpoint."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity_backed caller acts on a resource that does not belong to them."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The HealthOfficer lifting an enforcement action is the same user who issued it."
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing required field, unknown enum member, out-of-range number, malformed datetime, non-increasing interval, or pagination limit outside [1, 100]."
  - id: ERR_ESTABLISHMENT_NOT_FOUND
    http: 404
    condition: "No Establishment matches the supplied id in the path or body."
  - id: ERR_ARTIST_NOT_FOUND
    http: 404
    condition: "No Artist matches the supplied id in the path or body."
  - id: ERR_PLAN_REVIEW_NOT_FOUND
    http: 404
    condition: "No PlanReview matches the supplied id."
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "No Inspection matches the supplied id."
  - id: ERR_VIOLATION_NOT_FOUND
    http: 404
    condition: "No Violation matches the supplied id."
  - id: ERR_STERILIZATION_RECORD_NOT_FOUND
    http: 404
    condition: "No SterilizationRecord matches the supplied id, including a supersedes_record_id that resolves to nothing."
  - id: ERR_MINOR_CONSENT_NOT_FOUND
    http: 404
    condition: "No MinorConsent matches the supplied id."
  - id: ERR_PROCEDURE_LOG_NOT_FOUND
    http: 404
    condition: "No ProcedureLog matches the supplied id."
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "No Complaint matches the supplied id."
  - id: ERR_INFECTION_REPORT_NOT_FOUND
    http: 404
    condition: "No InfectionReport matches the supplied id."
  - id: ERR_ENFORCEMENT_ACTION_NOT_FOUND
    http: 404
    condition: "No EnforcementAction matches the supplied id."
  - id: ERR_RENEWAL_APPLICATION_NOT_FOUND
    http: 404
    condition: "No RenewalApplication matches the supplied id."
  - id: ERR_STALE_ESTABLISHMENT_VERSION
    http: 412
    condition: "expected_establishment_version does not equal the current Establishment.version on POST /body-art/renewal-applications."
  - id: ERR_STALE_ARTIST_VERSION
    http: 412
    condition: "expected_artist_version does not equal the current Artist.version on POST /body-art/artists/{artist_id}/enforcement-actions."
  - id: ERR_ESTABLISHMENT_STATE_INVALID
    http: 409
    condition: "The Establishment is not in a from-state that the requested transition declares."
  - id: ERR_ARTIST_STATE_INVALID
    http: 409
    condition: "The Artist is not in a from-state that the requested transition declares."
  - id: ERR_PLAN_REVIEW_STATE_INVALID
    http: 409
    condition: "The PlanReview is not in a from-state that the requested decision or resubmit declares."
  - id: ERR_INSPECTION_STATE_INVALID
    http: 409
    condition: "The Inspection is not SCHEDULED for start, not IN_PROGRESS for finalize or for citing a violation, or the caller is not the inspector who started it."
  - id: ERR_VIOLATION_STATE_INVALID
    http: 409
    condition: "The Violation is not ISSUED for a correction or not CORRECTION_SUBMITTED for a correction decision."
  - id: ERR_CONSENT_STATE_INVALID
    http: 409
    condition: "The MinorConsent is not PENDING when a verification decision is recorded."
  - id: ERR_PROCEDURE_LOG_STATE_INVALID
    http: 409
    condition: "The ProcedureLog is not RECORDED for FLAG or not FLAGGED for CLEAR."
  - id: ERR_COMPLAINT_STATE_INVALID
    http: 409
    condition: "The Complaint is not in a from-state that the requested action declares."
  - id: ERR_INFECTION_STATE_INVALID
    http: 409
    condition: "The InfectionReport axis targeted by the action is not in a declared from-state."
  - id: ERR_ENFORCEMENT_STATE_INVALID
    http: 409
    condition: "The EnforcementAction is already LIFTED when a lift is requested."
  - id: ERR_RENEWAL_STATE_INVALID
    http: 409
    condition: "The RenewalApplication is not in a from-state that the requested submit, review or payment declares."
  - id: ERR_ESTABLISHMENT_NOT_OPERATING
    http: 409
    condition: "operating_posture is CLOSED when a procedure log is filed."
  - id: ERR_RESTRICTED_POSTURE_MINOR_BLOCK
    http: 409
    condition: "operating_posture is RESTRICTED and the procedure log's client_age is below MINOR_AGE_THRESHOLD."
  - id: ERR_ARTIST_BBP_EXPIRED
    http: 422
    condition: "The artist's bloodborne-pathogen training expired at or before the procedure's started_at."
  - id: ERR_ARTIST_BBP_MISSING
    http: 422
    condition: "Artist activation attempted with no bloodborne-pathogen training on file or with training already expired."
  - id: ERR_ARTIST_NOT_PERMITTED
    http: 409
    condition: "The artist named on the procedure log is not in permit_status ACTIVE."
  - id: ERR_ARTIST_ESTABLISHMENT_MISMATCH
    http: 409
    condition: "The artist named on the procedure log belongs to a different establishment than the one in the body."
  - id: ERR_MINOR_CONSENT_REQUIRED
    http: 422
    condition: "client_age is below MINOR_AGE_THRESHOLD and no minor_consent_id was supplied."
  - id: ERR_MINOR_CONSENT_NOT_APPLICABLE
    http: 422
    condition: "client_age is at or above MINOR_AGE_THRESHOLD but a minor_consent_id was supplied."
  - id: ERR_MINOR_CONSENT_NOT_VERIFIED
    http: 409
    condition: "The referenced MinorConsent is still PENDING or was REJECTED."
  - id: ERR_MINOR_CONSENT_EXPIRED
    http: 409
    condition: "The procedure's started_at is at or after the consent's expires_at."
  - id: ERR_MINOR_CONSENT_MISMATCH
    http: 409
    condition: "The consent authorizes a different procedure type, or belongs to a different establishment."
  - id: ERR_ARTIST_SESSION_OVERLAP
    http: 409
    condition: "The new session's half-open interval intersects an existing session of the same artist."
  - id: ERR_INSPECTION_WINDOW_CONFLICT
    http: 409
    condition: "The buffered inspection window intersects the buffered window of another SCHEDULED or IN_PROGRESS inspection at the same establishment."
  - id: ERR_PREOPENING_INSPECTION_REQUIRED
    http: 409
    condition: "Establishment activation attempted without a PASSED PREOPENING inspection."
  - id: ERR_ESTABLISHMENT_PERMIT_NOT_ACTIVE
    http: 409
    condition: "Artist activation attempted while the parent establishment's permit_status is not ACTIVE."
  - id: ERR_PLAN_REVIEW_CYCLE_LIMIT
    http: 409
    condition: "A plan-review resubmit would exceed PLAN_REVIEW_MAX_CYCLES."
  - id: ERR_PLAN_REVIEW_REQUIREMENTS_NOT_MET
    http: 422
    condition: "APPROVE requested on a plan without a handwash sink or with sterilization_area_sqft below MIN_STERILIZATION_AREA_SQFT."
  - id: ERR_DUPLICATE_OPEN_PLAN_REVIEW
    http: 409
    condition: "A second PlanReview is created while one is SUBMITTED or CORRECTIONS_REQUIRED for the same establishment."
  - id: ERR_COMPLAINT_REOPEN_LIMIT
    http: 409
    condition: "A complaint REOPEN would exceed COMPLAINT_MAX_REOPENS."
  - id: ERR_INFECTION_REOPEN_LIMIT
    http: 409
    condition: "An infection-report REOPEN would exceed INFECTION_MAX_REOPENS."
  - id: ERR_NOTIFICATION_NOT_WAIVABLE
    http: 409
    condition: "MARK_NOT_REQUIRED requested on an infection report whose infection_type is not OTHER."
  - id: ERR_ACTIVE_ENFORCEMENT_EXISTS
    http: 409
    condition: "A second ACTIVE enforcement action is requested against the same establishment or artist."
  - id: ERR_ENFORCEMENT_NOT_LIFTABLE
    http: 409
    condition: "A lift is requested on a REVOCATION action."
  - id: ERR_OPEN_CRITICAL_VIOLATION_BLOCKS_RENEWAL
    http: 409
    condition: "Renewal approval attempted while open_critical_violation_count is greater than zero."
  - id: ERR_STERILIZATION_NONCOMPLIANT
    http: 409
    condition: "Renewal approval attempted while sterilization_compliance_status is NONCOMPLIANT."
  - id: ERR_ACTIVE_ENFORCEMENT_BLOCKS_RENEWAL
    http: 409
    condition: "Renewal approval attempted while an ACTIVE enforcement action exists for the establishment."
  - id: ERR_RENEWAL_ATTESTATION_MISSING
    http: 422
    condition: "Renewal approval attempted while attested_bbp_current or attested_sterilization_logs_complete is false."
  - id: ERR_RENEWAL_CYCLE_LIMIT
    http: 409
    condition: "A renewal resubmit would exceed RENEWAL_MAX_CYCLES."
  - id: ERR_RENEWAL_FEE_UNPAID
    http: 402
    condition: "Renewal approval attempted while payment_status is not PAID."
  - id: ERR_FEE_AMOUNT_MISMATCH
    http: 422
    condition: "The payment amount_cents does not equal the outstanding amount for the application's current status."
  - id: ERR_REFUND_NOT_ALLOWED
    http: 409
    condition: "Refund requested on an application that is not PAID, or whose status is not DENIED or SUPERSEDED."
  - id: ERR_STERILIZATION_SUPERSEDE_INVALID
    http: 409
    condition: "supersedes_record_id points at a record of another establishment or at a record already superseded."
  - id: ERR_CYCLE_TIMESTAMP_FUTURE
    http: 422
    condition: "cycle_completed_at is after the current logical-clock instant."
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 409
    condition: "to_iso8601 is at or before the current logical-clock instant."

roles:
  - name: HealthOfficer
    description: "County health department officer who issues establishment and artist permits, drives complaint and infection-report workflows, audits procedure logs, issues and lifts enforcement actions, and decides renewals."
    identity: opaque
    exclusive_operations:
      - "POST /body-art/establishments"
      - "POST /body-art/establishments/{establishment_id}/activate"
      - "POST /body-art/establishments/{establishment_id}/enforcement-actions"
      - "POST /body-art/artists/{artist_id}/activate"
      - "POST /body-art/artists/{artist_id}/enforcement-actions"
      - "POST /body-art/enforcement-actions/{enforcement_action_id}/lift"
      - "POST /body-art/procedure-logs/{procedure_log_id}/audit"
      - "POST /body-art/complaints/{complaint_id}/transition"
      - "POST /body-art/infection-reports/{infection_report_id}/investigation"
      - "POST /body-art/infection-reports/{infection_report_id}/notification"
      - "POST /body-art/renewal-applications/{renewal_application_id}/review"
    shared_operations:
      - "POST /body-art/artists"
      - "POST /body-art/inspections"
      - "all GET reads except GET /body-art/procedure-logs/{procedure_log_id} which Artist also holds"
      - "POST /body-art/_clock/set_current_utc"
    note: "Segregation of duties: the officer whose X-User-ID issued an EnforcementAction may not lift it, so the fixture needs two distinct HealthOfficer user ids."
  - name: Inspector
    description: "Field inspector who conducts on-site visits, cites violations and rules on submitted corrections."
    identity: opaque
    exclusive_operations:
      - "POST /body-art/inspections/{inspection_id}/start"
      - "POST /body-art/inspections/{inspection_id}/finalize"
      - "POST /body-art/inspections/{inspection_id}/violations"
      - "POST /body-art/violations/{violation_id}/correction-decision"
    shared_operations:
      - "POST /body-art/inspections"
      - "GET reads across establishments, artists, inspections, violations, sterilization records, minor consents, procedure logs, complaints, infection reports and enforcement actions"
      - "POST /body-art/_clock/set_current_utc"
    note: "Only the inspector whose X-User-ID started an inspection may finalize it or cite violations on it."
  - name: PlanReviewer
    description: "Plan examiner who rules on construction plan submissions before a permit can be issued."
    identity: opaque
    exclusive_operations:
      - "POST /body-art/plan-reviews/{plan_review_id}/decision"
    shared_operations:
      - "GET /body-art/establishments"
      - "GET /body-art/establishments/{establishment_id}"
      - "GET /body-art/plan-reviews"
      - "GET /body-art/plan-reviews/{plan_review_id}"
      - "POST /body-art/_clock/set_current_utc"
  - name: RecordsClerk
    description: "Departmental clerk who verifies guardian consent forms, takes renewal payments and issues refunds."
    identity: opaque
    exclusive_operations:
      - "POST /body-art/minor-consents/{minor_consent_id}/verify"
      - "POST /body-art/renewal-applications/{renewal_application_id}/refund"
    shared_operations:
      - "POST /body-art/renewal-applications/{renewal_application_id}/payment"
      - "GET reads across establishments, artists, inspections, violations, sterilization records, minor consents, procedure logs, complaints, infection reports, enforcement actions and renewal applications"
      - "POST /body-art/_clock/set_current_utc"
  - name: EstablishmentOperator
    description: "Owner-operator acting as the permitted premises: submits plans, files sterilization and consent records, submits corrections, and drives the renewal application."
    identity: "entity_backed:Establishment"
    exclusive_operations:
      - "POST /body-art/plan-reviews"
      - "POST /body-art/plan-reviews/{plan_review_id}/resubmit"
      - "POST /body-art/sterilization-records"
      - "POST /body-art/minor-consents"
      - "POST /body-art/violations/{violation_id}/correction"
      - "POST /body-art/renewal-applications"
      - "POST /body-art/renewal-applications/{renewal_application_id}/submit"
    shared_operations:
      - "POST /body-art/artists"
      - "POST /body-art/artists/{artist_id}/bbp-training"
      - "POST /body-art/infection-reports"
      - "POST /body-art/renewal-applications/{renewal_application_id}/payment"
      - "GET reads scoped to their own establishment"
      - "POST /body-art/_clock/set_current_utc"
    note: "X-User-ID equals the Establishment.id the operator owns; every write is checked against that id by validation priority 6."
  - name: Artist
    description: "Individual practitioner acting as their own Artist record: records bloodborne-pathogen training and files procedure logs."
    identity: "entity_backed:Artist"
    exclusive_operations:
      - "POST /body-art/procedure-logs"
    shared_operations:
      - "POST /body-art/artists/{artist_id}/bbp-training"
      - "GET /body-art/artists/{artist_id}"
      - "GET /body-art/procedure-logs/{procedure_log_id}"
      - "POST /body-art/_clock/set_current_utc"
    note: "X-User-ID equals the Artist.id; the artist_id in a procedure-log body must equal it."
  - name: PublicUser
    description: "Member of the public who files complaints and reportable infection reports; holds no read access to departmental records."
    identity: opaque
    exclusive_operations:
      - "POST /body-art/complaints"
    shared_operations:
      - "POST /body-art/infection-reports"
      - "POST /body-art/_clock/set_current_utc"
