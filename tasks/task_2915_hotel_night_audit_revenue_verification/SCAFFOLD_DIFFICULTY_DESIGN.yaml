  - rule_id: non_linear_state_machine
    instances:

      - name: folio_settlement_dimension_reverses_while_stay_dimension_holds_departed
        grounds: "§1.2 Folio state machines on dimensions stay_status and settlement_status; §1.3 calculation folio_balance ('a charge landing on an already SETTLED folio drives settlement_status backwards without disturbing stay_status'); §1.0 complexity_profile.state_machine_shape parallel."
        distinguishing_aspect: >-
          Parallel dimensions with a backwards edge: SETTLED -> PARTIALLY_SETTLED is a genuine
          reverse transition that no forward-only reading of the lifecycle would permit, and it
          fires as a derived consequence of an append rather than from an explicit trigger, while
          the orthogonal stay_status dimension stays pinned at DEPARTED.
        test_recipe:
          setup: "Standard property; business date 2026-08-01 left OPEN; one CASH folio checked in, given a 100.00 MISC_CHARGE, paid 100.00 in full so both dimensions read IN_HOUSE / SETTLED, then checked out inside the grace window so no late-checkout charge is raised and it reads DEPARTED / SETTLED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00.000Z" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id" }
            - call: "POST /night-audit/folios"
              payload: { property_id: "${prop_id}", arrival_business_date_id: "${bd1_id}", confirmation_code: "CF-5001", guest_name: "Ivo Tran", room_number: "501", nights_count: 1, contracted_rate_amount: 200.00, rate_plan_code: "BAR", market_segment: "TRANSIENT", settlement_method: "CASH", scheduled_checkout_at: "2026-08-02T11:00:00.000Z" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { folio_p_id: "$.data.id" }
            - call: "POST /night-audit/folios/${folio_p_id}/check-in"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/journal-postings"
              payload: { business_date_id: "${bd1_id}", charge_type: "MISC_CHARGE", amount: 100.00, folio_id: "${folio_p_id}", memo: "Spa treatment" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/folios/${folio_p_id}/payments"
              payload: { business_date_id: "${bd1_id}", amount: 100.00, memo: "Cash in full" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/folios/${folio_p_id}/check-out"
              payload: { business_date_id: "${bd1_id}" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
          trigger: "POST /night-audit/journal-postings with business_date_id ${bd1_id}, folio_id ${folio_p_id}, charge_type MISC_CHARGE and amount 40.00 as FrontDeskAgent (X-User-ID u_fd_1) - a late minibar charge discovered after the guest left."
          assert:
            - "GET /night-audit/folios/${folio_p_id} returns stay_status == DEPARTED - the stay dimension does not move at all."
            - "The same read returns settlement_status == PARTIALLY_SETTLED, a backwards move from SETTLED, because credits_total_amount == -100.00 is non-zero while balance_amount == 40.00 is non-zero."
            - "The same read returns charges_total_amount == 140.00 (100.00 + 40.00), credits_total_amount == -100.00 and balance_amount == 40.00."
            - "settlement_hold is still false and actual_checkout_at is unchanged - the reverse transition touches neither."
            - "An implementation that treats SETTLED as terminal, or that recomputes stay_status from the balance, fails."

      - name: allowance_revision_cycle_capped_at_two_with_tier_frozen
        grounds: "§1.2 Allowance state machine (SUBMITTED <-> RETURNED_FOR_REVISION cycle); §1.4 priority 80 ERR_REVISION_LIMIT_REACHED with ALLOWANCE_REVISION_LIMIT 2; §1.3 calculation allowance_approval_tier ('frozen and never re-derived')."
        distinguishing_aspect: >-
          A cyclic sub-graph with a hard loop bound rather than a parallel-dimension reversal. The
          loop counter is monotone across the cycle (submit does not reset it and redeclaring the
          narrative does not either), and the frozen approval tier proves the cycle carries state
          that the transitions themselves must not recompute.
        test_recipe:
          setup: "Standard property (allowance_manager_threshold_amount 250.00); business date 2026-08-01 left OPEN; one CASH folio checked in and given room and tax; a 300.00 MANAGER_DISCRETION allowance raised by FrontDeskAgent u_fd_1, so required_approval_role freezes at RevenueManager; the allowance is then submitted and returned for revision twice, consuming both allowed rounds, and submitted a third time."
