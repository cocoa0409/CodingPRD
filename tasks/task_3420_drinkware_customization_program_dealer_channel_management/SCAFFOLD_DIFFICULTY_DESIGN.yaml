  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_constraint_on_resubmitted_cancelled_order
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - errors.ERR_INVALID_STATE_TRANSITION
          - errors.ERR_BELOW_MINIMUM_QUANTITY
        distinguishing_aspect: |
          Pair (state vs business_constraint): the same submit request violates BOTH the
          order-state precondition (order already CANCELLED) and the MOQ rule (23 < 24);
          the state error ERR_INVALID_STATE_TRANSITION (priority 5) must win over
          ERR_BELOW_MINIMUM_QUANTITY (priority 11).
        test_recipe:
          setup:
            - "Clock 2026-09-01T06:00:00Z. Line RAM24 (MOQ 24) with standard drop. Order qty 23 by buyer-lowmoq; first submit failed with the MOQ error; order then cancelled."
          setup_api_calls:
            - *d_clock_sep1
            - call: "POST /drinkware/product-lines"
              payload: { name: "Rambler 24 oz", category: "DRINKWARE", base_sku: "RAM24", base_custom_price_cents: 3100, map_price_cents: 3699, min_custom_quantity: 24, warranty_months_lid: 24, warranty_months_insulation: 36, warranty_months_hardware: 12 }
              as: PlatformAdmin
              captures: { pl_pp: $.data.id }
            - call: "POST /drinkware/colorway-drops"
              payload: { product_line_id: "${pl_pp}", color_name: "Slate", pantone_code: "PMS 432", drop_type: "STANDARD", total_units: 3000, dtc_reserved_units: 500, dealer_unit_price_cents: 1900, allocation_opens_at: "2026-09-05T00:00:00Z", allocation_closes_at: "2026-09-20T00:00:00Z", go_live_at: "2026-10-01T00:00:00Z", sales_end_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { drop_pp: $.data.id }
            - call: "POST /drinkware/customization-orders"
              payload: { buyer_type: "CORPORATE", buyer_ref: "buyer-lowmoq", product_line_id: "${pl_pp}", colorway_drop_id: "${drop_pp}", quantity: 23, declared_color_count: 1, declared_placement_count: 1, print_technology: "LASER", requested_ship_date: "2026-09-15T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-lowmoq"
              captures: { order_pp: $.data.id }
            - call: "POST /drinkware/customization-orders/${order_pp}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-lowmoq"
              captures: { err_moq_first: $.data.error_id }
            - call: "POST /drinkware/customization-orders/${order_pp}/cancel"
              payload: {}
              as: Buyer
              as_user_id: "buyer-lowmoq"
          trigger:
            - call: "POST /drinkware/customization-orders/${order_pp}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-lowmoq"
              captures: { err_state_wins: $.data.error_id }
          assert:
            - "err_moq_first == ERR_BELOW_MINIMUM_QUANTITY (422) — constraint leg verified live"
            - "err_state_wins == ERR_INVALID_STATE_TRANSITION (409) although the MOQ violation is still present (23 < 24)"
            - "err_state_wins != ERR_BELOW_MINIMUM_QUANTITY"
            - "CustomizationOrder.${order_pp}.order_state == CANCELLED and payment_status == UNPAID (the failed submit never authorized)"

      - name: temporal_beats_constraint_on_overlapping_slot_creation
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors.ERR_SLOT_OVERLAP_CONFLICT
          - errors.ERR_CAPACITY_EXCEEDS_WINDOW
        distinguishing_aspect: |
          Pair (business_temporal vs business_constraint) — a DIFFERENT pair than the sibling
          instance: the new slot both overlaps an existing same-station window (temporal) AND
          declares capacity_minutes 120 > its 60-minute window (constraint); the temporal
          error ERR_SLOT_OVERLAP_CONFLICT (priority 10) must win.
        test_recipe:
          setup:
            - "Clock 2026-09-01T06:00:00Z. Station L-5 already has a LASER slot 2026-09-12 09:00-10:00 capacity 60."
          setup_api_calls:
            - *d_clock_sep1
            - call: "POST /drinkware/print-slots"
              payload: { station_code: "L-5", technology: "LASER", window_start: "2026-09-12T09:00:00Z", window_end: "2026-09-12T10:00:00Z", capacity_minutes: 60 }
              as: ProductionLead
              captures: { slot_base: $.data.id }
          trigger:
            - call: "POST /drinkware/print-slots"
              payload: { station_code: "L-5", technology: "LASER", window_start: "2026-09-12T09:30:00Z", window_end: "2026-09-12T10:30:00Z", capacity_minutes: 120 }
              as: ProductionLead
              captures: { err_overlap_wins: $.data.error_id }
          assert:
            - "err_overlap_wins == ERR_SLOT_OVERLAP_CONFLICT (409)"
            - "err_overlap_wins != ERR_CAPACITY_EXCEEDS_WINDOW although capacity_minutes 120 > 60-minute window also violates the constraint"
            - "GET /drinkware/print-slots?station_code=L-5 returns exactly 1 row"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: moq_exactly_at_threshold_passes_one_below_fails
        grounds:
          - entities.ProductLine.fields.min_custom_quantity
          - errors.ERR_BELOW_MINIMUM_QUANTITY
          - state_machines.CustomizationOrder.payment_status
        distinguishing_aspect: |
          Quantity metric via submit: min_custom_quantity uses >= semantics — qty == 24
          submits clean while qty == 23 on an identical order fails with
          ERR_BELOW_MINIMUM_QUANTITY. The boundary is inclusive at the exact minimum.
        test_recipe:
          setup:
            - "Clock 2026-09-01T06:00:00Z. Line RAM24 (MOQ 24) with a standard drop. Two identical CORPORATE orders by buyer-moq: one qty 24, one qty 23."
          setup_api_calls:
            - *d_clock_sep1
            - call: "POST /drinkware/product-lines"
              payload: { name: "Rambler 24 oz", category: "DRINKWARE", base_sku: "RAM24", base_custom_price_cents: 3100, map_price_cents: 3699, min_custom_quantity: 24, warranty_months_lid: 24, warranty_months_insulation: 36, warranty_months_hardware: 12 }
              as: PlatformAdmin
              captures: { pl_moq: $.data.id }
            - call: "POST /drinkware/colorway-drops"
              payload: { product_line_id: "${pl_moq}", color_name: "Slate", pantone_code: "PMS 432", drop_type: "STANDARD", total_units: 3000, dtc_reserved_units: 500, dealer_unit_price_cents: 1900, allocation_opens_at: "2026-09-05T00:00:00Z", allocation_closes_at: "2026-09-20T00:00:00Z", go_live_at: "2026-10-01T00:00:00Z", sales_end_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { drop_moq: $.data.id }
            - call: "POST /drinkware/customization-orders"
              payload: { buyer_type: "CORPORATE", buyer_ref: "buyer-moq", product_line_id: "${pl_moq}", colorway_drop_id: "${drop_moq}", quantity: 24, declared_color_count: 1, declared_placement_count: 1, print_technology: "LASER", requested_ship_date: "2026-09-15T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-moq"
              captures: { order_moq_ok: $.data.id }
            - call: "POST /drinkware/customization-orders"
              payload: { buyer_type: "CORPORATE", buyer_ref: "buyer-moq", product_line_id: "${pl_moq}", colorway_drop_id: "${drop_moq}", quantity: 23, declared_color_count: 1, declared_placement_count: 1, print_technology: "LASER", requested_ship_date: "2026-09-15T00:00:00Z" }
              as: Buyer
