              as: PlatformAdmin
              captures: { c_csxt: $.data.id }
            - call: "POST /stb/service-complaints"
              payload: { shipper_id: "shp-gal", carrier_id: "${c_csxt}", issue_type: "CAR_SUPPLY", territory_code: "GULF-COAST" }
              as: Shipper
              as_user_id: "shp-gal"
              captures: { sc1: $.data.id }
            - call: "POST /stb/service-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c_csxt}", issue_type: "DELAY", territory_code: "MIDWEST" }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { sc2: $.data.id }
            - call: "POST /stb/service-complaints/${sc1}/escalate"
              payload: { directive: "Restore car supply within 72 hours" }
              as: BoardAdjudicator
              captures: { eso1: $.data.id }
          trigger:
            - call: "POST /stb/service-complaints/${sc2}/escalate"
              payload: { directive: "Expedite unit trains" }
              as: BoardAdjudicator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ESO_ALREADY_ACTIVE and http status 409"
            - "ServiceComplaint.${sc2}.status == OPEN (unchanged) and EmergencyServiceOrder.${eso1}.status == ACTIVE"
            - "GET /stb/carriers/${c_csxt}/emergency-service-orders returns total_count == 1"
      - name: interchange_slots_half_open_adjacency
        grounds:
          - validations[priority=16]
          - state_machines.ReciprocalSwitchingPetition.FILED_to_GRANTED
        distinguishing_aspect: "Half-open [start, end) aggregate-capacity semantics on the interchange_code resource: four overlapping GRANTED petitions fill the 4 slots so a fifth overlapping petition is refused (ERR_INTERCHANGE_CAPACITY_EXCEEDED), but a petition whose start equals the incumbents' end (adjacency, zero overlap) is granted."
