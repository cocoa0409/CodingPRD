        distinguishing_aspect: |
          Interval semantics A — half-open [starts_on, ends_on) on the campus
          resource: a visit ending 2027-03-05 and another starting 2027-03-05
          do NOT overlap (adjacency allowed); one starting 2027-03-04 does.
        test_recipe:
          setup:
            - "Term REVIEW; campus with confirmed visit V0 2027-03-01..2027-03-05"
            - "V_ADJ 2027-03-05..2027-03-07 (adjacent, should confirm)"
            - "V_OVER 2027-03-04..2027-03-06 (overlaps V0 by one day, should fail)"
          setup_api_calls:
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
