        claim_type: role_denied
        grounds:
          - roles
          - endpoints
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "A Bettor calling POST /events/{id}/result → ERR_FORBIDDEN (403); only SettlementAgent may settle (peer/SoD roles)."
        test_recipe:
          setup: ["Event LIVE with one market."]
          setup_api_calls:
            - call: "POST /events"
              payload: { sport: "NBA", home_team: "H", away_team: "A", starts_at: "2026-02-01T18:00:00Z" }
