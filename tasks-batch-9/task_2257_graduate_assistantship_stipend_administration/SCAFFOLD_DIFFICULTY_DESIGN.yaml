      - name: non_renewal_notice_cascade_cancels_successor_and_releases_commitments
        grounds:
          - state_machines.RenewalDecision.SAP_CERTIFIED_to_NOTICE_ISSUED
          - state_machines.Appointment.ACTIVE_to_NON_RENEWAL_PENDING
          - state_machines.Appointment.FUNDING_VERIFIED_to_CANCELLED
          - entities.Appointment.fields.renewed_from_appointment_id
          - calculations.funding_source_balance
        distinguishing_aspect: |
          Issuing one NON_RENEW notice propagates across three entity types and two academic terms:
          the predecessor becomes NON_RENEWAL_PENDING with renewal_eligible false, the self-referential
          successor in the NEXT term is CANCELLED out of FUNDING_VERIFIED, its COMMITTED allocation is
          RELEASED with release_reason PREDECESSOR_NON_RENEWED, and the successor's source returns to
