          - state_machines.Wholesaler.APPOINTED_to_SUSPENDED
          - entities.Wholesaler.fields.suspended_account_count
        distinguishing_aspect: "The suspension trigger is cumulative with an exact threshold: after two CRITICAL_FAIL suspensions the wholesaler is still APPOINTED at count 2, and the third audit — identical to the first two — flips it to SUSPENDED at count 3."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z."
            - "Territory awarded to wholesaler WTH; accounts ATH1/ATH2/ATH3 served by it."
          setup_api_calls:
            - call: "POST /territories"
              payload: { name: "Threshold Territory", state_code: "TX" }
              as: BrewerAdmin
              captures: { tth_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Threshold Distributing", home_state: "TX", license_number: "TX-W-5002", tier: "SILVER", financial_capacity_score: 75, warehouse_capacity_score: 75, market_coverage_score: 75 }
              as: BrewerAdmin
              captures: { wth_id: $.data.id }
            - call: "POST /agreements"
              payload: { territory_id: "${tth_id}", wholesaler_id: "${wth_id}", brand_scope: ["BUD"], distribution_target_pct: 80, freshness_target_index: 90, share_target_pct: 40, declared_distribution_pct: 80, declared_freshness_index: 95, declared_share_pct: 40, term_years: 5 }
              as: BrewerAdmin
            - call: "POST /retail-accounts"
              payload: { name: "Threshold Bar 1", state_code: "TX", serving_wholesaler_id: "${wth_id}" }
              as: BrewerAdmin
              captures: { ath1_id: $.data.id }
            - call: "POST /retail-accounts"
              payload: { name: "Threshold Bar 2", state_code: "TX", serving_wholesaler_id: "${wth_id}" }
              as: BrewerAdmin
              captures: { ath2_id: $.data.id }
            - call: "POST /retail-accounts"
              payload: { name: "Threshold Bar 3", state_code: "TX", serving_wholesaler_id: "${wth_id}" }
              as: BrewerAdmin
              captures: { ath3_id: $.data.id }
            - call: "POST /draft-audits"
              payload: { account_id: "${ath1_id}", conducted_at: "2026-09-01T00:00:00Z", line_cleaning_last_at: "2026-08-25T00:00:00Z", kegs: [{ brand_code: "BUD", filled_at: "2026-05-03T00:00:00Z", volume_bbl: 15 }] }
              as: DraftAuditor
            - call: "POST /draft-audits"
              payload: { account_id: "${ath2_id}", conducted_at: "2026-09-01T00:00:00Z", line_cleaning_last_at: "2026-08-25T00:00:00Z", kegs: [{ brand_code: "BUD", filled_at: "2026-05-03T00:00:00Z", volume_bbl: 15 }] }
              as: DraftAuditor
          trigger:
            - call: "GET /wholesalers/${wth_id}"
              payload: {}
              as: BrewerAdmin
              captures: { wth_mid: $.data.status }
            - call: "POST /draft-audits"
              payload: { account_id: "${ath3_id}", conducted_at: "2026-09-01T00:00:00Z", line_cleaning_last_at: "2026-08-25T00:00:00Z", kegs: [{ brand_code: "BUD", filled_at: "2026-05-03T00:00:00Z", volume_bbl: 15 }] }
              as: DraftAuditor
            - call: "GET /wholesalers/${wth_id}"
              payload: {}
              as: BrewerAdmin
          assert:
            - "After two critical audits: wth_mid == APPOINTED and suspended_account_count == 2 (threshold not yet reached)"
            - "After the third: Wholesaler.${wth_id}.status == SUSPENDED and suspended_account_count == 3 (the identical audit tips the cumulative threshold)"

      - name: cascading_side_effects_coverage
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: critical_audit_cascade_releases_allocations
          rationale: "The depth-3 audit -> account -> wholesaler -> assignment cascade is asserted end-to-end by the named §1.8 transitive-cascade instance."

      - name: dual_variant_calculation_coverage
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: equity_index_provisional_vs_audited
          rationale: "Both equity variants are computed and asserted with literals by the named §1.8 dual-variant instance."

  - section: consistency_model
    instances:
      - name: immediate_read_after_write_agreement_listing
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.GET_/wholesalers/{id}/agreements
        distinguishing_aspect: "Immediate consistency: an agreement is visible in the wholesaler's agreement list in the very next request after creation, with the same status ACTIVE and matching id — no lag, no recompute endpoint."
        test_recipe:
          setup: ["Logical clock at startup default 2026-09-01T00:00:00Z. One VACANT territory and one APPLICANT wholesaler."]
          setup_api_calls:
            - call: "POST /territories"
              payload: { name: "Immediate Territory", state_code: "TX" }
              as: BrewerAdmin
              captures: { tim_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Immediate Distributing", home_state: "TX", license_number: "TX-W-6001", tier: "SILVER", financial_capacity_score: 75, warehouse_capacity_score: 75, market_coverage_score: 75 }
              as: BrewerAdmin
              captures: { wim_id: $.data.id }
          trigger:
            - call: "POST /agreements"
              payload: { territory_id: "${tim_id}", wholesaler_id: "${wim_id}", brand_scope: ["BUD"], distribution_target_pct: 80, freshness_target_index: 90, share_target_pct: 40, declared_distribution_pct: 80, declared_freshness_index: 95, declared_share_pct: 40, term_years: 5 }
              as: BrewerAdmin
              captures: { aim_id: $.data.id }
            - call: "GET /wholesalers/${wim_id}/agreements"
              payload: {}
              as: DraftAuditor
          assert:
            - "The immediate list call returns exactly 1 row whose id == ${aim_id} and status == ACTIVE"
            - "The row's territory_id == ${tim_id} and version == 1"
