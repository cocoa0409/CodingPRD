  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: documentation_exception_cure_reject_resubmit_loop
        grounds:
          - state_machines.DocumentationException.REJECTED_to_CURE_SUBMITTED
          - state_machines.DocumentationException.CURE_SUBMITTED_to_REJECTED
          - state_machines.ParticipationCertificate.ACTIVE_to_EXCEPTION
        distinguishing_aspect: |
          Cyclic machine on DocumentationException: OPEN -> CURE_SUBMITTED ->
          REJECTED -> CURE_SUBMITTED (resubmission loop) with
          cure_attempt_count incrementing per loop; entity: DocumentationException.
        test_recipe:
          setup:
            - "Funded ACTIVE certificate (10,000,000) under an agreement with cure_period_days 30"
            - "Buyer flags MISSING_NOTE exception at clock 2026-08-01 -> deadline 2026-08-31; certificate EXCEPTION"
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-BUY", legal_name: "Buyer CU", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, cure_period_days: 30, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool A", pool_principal_cents: 100000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 10000000 }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { cert_id: "$.data.id" } }
            - { call: "POST /network/commitments/${cert_id}/approve-diligence", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/commitments/${cert_id}/fund", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/exceptions", payload: { certificate_id: "${cert_id}", exception_type: "MISSING_NOTE", description: "Note missing from transmittal" }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { exc_id: "$.data.id" } }
          trigger:
            - { call: "POST /network/exceptions/${exc_id}/submit-cure", payload: { cure_notes: "Cure attempt 1" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { s1: "$.data.status" } }
            - { call: "POST /network/exceptions/${exc_id}/verify-cure", payload: { accept: false }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { s2: "$.data.status" } }
            - { call: "POST /network/exceptions/${exc_id}/submit-cure", payload: { cure_notes: "Cure attempt 2" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { s3: "$.data.status", attempts: "$.data.cure_attempt_count" } }
            - { call: "POST /network/exceptions/${exc_id}/verify-cure", payload: { accept: true }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { s4: "$.data.status" } }
          assert:
            - "s1 == CURE_SUBMITTED and s2 == REJECTED (first loop)"
            - "s3 == CURE_SUBMITTED and attempts == 2 (resubmission allowed from REJECTED)"
            - "s4 == CURED"
            - "GET /network/commitments/${cert_id} status == ACTIVE (returned from EXCEPTION once all exceptions closed)"

      - name: exam_finding_reopen_cycle
        grounds:
          - state_machines.ExamFinding.VERIFYING_to_REOPENED
          - state_machines.ExamFinding.REOPENED_to_VERIFYING
        distinguishing_aspect: |
          Cyclic machine on ExamFinding: OPEN -> VERIFYING -> REOPENED ->
          VERIFYING -> CLOSED (failed verification loops the finding back);
          entity: ExamFinding — distinct from the DocumentationException cycle.
        test_recipe:
          setup:
            - "CUSO with an IN_PROGRESS exam; CRITICAL finding recorded by regulator reg-1"
          setup_api_calls:
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/exams", payload: { cuso_id: "${cuso_id}", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-15T00:00:00Z" }, as: RegulatorUser, captures: { exam_id: "$.data.id" } }
            - { call: "POST /network/findings", payload: { exam_id: "${exam_id}", severity: "CRITICAL", description: "Loan file imaging gaps", remediation_due_date: "2026-10-01T00:00:00Z" }, as: RegulatorUser, as_user_id: "reg-1", captures: { find_id: "$.data.id" } }
          trigger:
            - { call: "POST /network/findings/${find_id}/submit-remediation", payload: { remediation_notes: "Plan v1" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { f1: "$.data.status" } }
            - { call: "POST /network/findings/${find_id}/verify", payload: { verification_passed: false }, as: RegulatorUser, as_user_id: "reg-2", captures: { f2: "$.data.status" } }
            - { call: "POST /network/findings/${find_id}/submit-remediation", payload: { remediation_notes: "Plan v2" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { f3: "$.data.status" } }
            - { call: "POST /network/findings/${find_id}/verify", payload: { verification_passed: true }, as: RegulatorUser, as_user_id: "reg-2", captures: { f4: "$.data.status" } }
          assert:
            - "f1 == VERIFYING (OPEN -> VERIFYING)"
            - "f2 == REOPENED (failed verification loops back)"
            - "f3 == VERIFYING (REOPENED -> VERIFYING resubmission)"
            - "f4 == CLOSED"
            - "Exam finding with severity CRITICAL reaches CLOSED; CUSO.status remains ACTIVE throughout (never finalized with open critical)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: late_remittance_threshold_cascade
        grounds:
          - state_machines.Remittance.SCHEDULED_to_LATE_UNPAID
          - state_machines.ServicingAgreement.ACTIVE_to_DELINQUENT
          - state_machines.ParticipationOffering.OPEN_to_SUSPENDED
        distinguishing_aspect: |
          Depth-3 chain triggered by the sweep: Remittance -> LATE_UNPAID
          increments agreement.late_remittance_count; the counter crossing
          late_remittance_threshold flips the agreement ACTIVE -> DELINQUENT;
          that flip suspends every OPEN offering of the agreement. Trigger:
          POST /network/sweeps/run.
        test_recipe:
          setup:
            - "Agreement ACTIVE (threshold 2, grace 5, due day 15); offering OPEN; two funded certs (buyers B1, B2, 10,000,000 each)"
            - "Remittance R1 (cert1) and R2 (cert2) for period 2026-08-01..2026-08-31; due_at 2026-09-15; clock moved to 2026-09-21 (past due + grace)"
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-B1", legal_name: "Buyer One", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { b1_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-B2", legal_name: "Buyer Two", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { b2_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, grace_period_days: 5, late_remittance_threshold: 2, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool A", pool_principal_cents: 100000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-12-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 10000000 }, as: BuyerUser, as_user_id: "${b1_id}", captures: { c1_id: "$.data.id" } }
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 10000000 }, as: BuyerUser, as_user_id: "${b2_id}", captures: { c2_id: "$.data.id" } }
            - { call: "POST /network/commitments/${c1_id}/approve-diligence", payload: {}, as: BuyerUser, as_user_id: "${b1_id}" }
            - { call: "POST /network/commitments/${c2_id}/approve-diligence", payload: {}, as: BuyerUser, as_user_id: "${b2_id}" }
            - { call: "POST /network/commitments/${c1_id}/fund", payload: {}, as: BuyerUser, as_user_id: "${b1_id}" }
            - { call: "POST /network/commitments/${c2_id}/fund", payload: {}, as: BuyerUser, as_user_id: "${b2_id}" }
            - { call: "POST /network/remittances", payload: { certificate_id: "${c1_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", collections_cents: 100000 }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /network/remittances", payload: { certificate_id: "${c2_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", collections_cents: 100000 }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { r2_id: "$.data.id" } }
            - { call: "POST /network/_clock/set_current_utc", payload: { to_iso8601: "2026-09-21T00:00:00Z" }, as: NetworkAdmin }
          trigger:
            - { call: "POST /network/sweeps/run", payload: {}, as: NetworkAdmin, captures: { marked_late: "$.data.remittances_marked_late" } }
          assert:
            - "marked_late == 2"
            - "GET /network/remittances/${r1_id} status == LATE_UNPAID; GET /network/remittances/${r2_id} status == LATE_UNPAID"
            - "GET /network/servicing-agreements/${ag_id} late_remittance_count == 2 and status == DELINQUENT (threshold reached)"
            - "GET /network/offerings/${off_id} status == SUSPENDED (cascade from agreement DELINQUENT)"

      - name: exam_finalize_critical_cascade
        grounds:
          - state_machines.RegulatoryExam.IN_PROGRESS_to_FINALIZED
          - state_machines.CUSO.ACTIVE_to_SUSPENDED
          - state_machines.ServicingAgreement.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Depth-2+ chain triggered by exam finalization (different trigger from
          the sweep): Exam -> FINALIZED with an open CRITICAL finding flips
          CUSO ACTIVE -> SUSPENDED; the CUSO flip suspends its ACTIVE
          ServicingAgreements (and their OPEN offerings in turn).
        test_recipe:
          setup:
            - "CUSO with ACTIVE agreement and OPEN offering (no commitments needed)"
            - "IN_PROGRESS exam on the CUSO with one CRITICAL finding still OPEN"
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool A", pool_principal_cents: 100000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-12-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
            - { call: "POST /network/exams", payload: { cuso_id: "${cuso_id}", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-15T00:00:00Z" }, as: RegulatorUser, captures: { exam_id: "$.data.id" } }
            - { call: "POST /network/findings", payload: { exam_id: "${exam_id}", severity: "CRITICAL", description: "Missing participation agreements", remediation_due_date: "2026-10-01T00:00:00Z" }, as: RegulatorUser, as_user_id: "reg-1" }
          trigger:
            - { call: "POST /network/exams/${exam_id}/finalize", payload: {}, as: RegulatorUser, captures: { exam_status: "$.data.status" } }
          assert:
            - "exam_status == FINALIZED"
            - "GET /network/cusos/${cuso_id} status == SUSPENDED (open CRITICAL finding at finalize)"
            - "GET /network/servicing-agreements/${ag_id} status == SUSPENDED (cascade link 2)"
            - "GET /network/offerings/${off_id} status == SUSPENDED (cascade link 3)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_investment_approve
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INVESTMENT_CAP_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: approving an
          investment that is already REJECTED and would also exceed the cap
          returns ERR_INVALID_STATE (priority 7), not
          ERR_INVESTMENT_CAP_EXCEEDED (priority 8).
        test_recipe:
          setup:
            - "Investor CU: total_assets 1,000,000,000 (base cap 10,000,000), net_worth 100,000,000"
            - "I1 = 8,000,000 APPROVED; I2 = 5,000,000 first rejected by cap, then regulator-REJECTED"
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-INV", legal_name: "Investor CU", cu_type: "DUAL", total_assets_cents: 1000000000, net_worth_cents: 100000000 }, as: NetworkAdmin, captures: { inv_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/cuso-investments", payload: { credit_union_id: "${inv_id}", cuso_id: "${cuso_id}", amount_cents: 8000000 }, as: TreasuryUser, as_user_id: "${inv_id}", captures: { i1_id: "$.data.id" } }
            - { call: "POST /network/cuso-investments/${i1_id}/approve", payload: {}, as: RegulatorUser }
            - { call: "POST /network/cuso-investments", payload: { credit_union_id: "${inv_id}", cuso_id: "${cuso_id}", amount_cents: 5000000 }, as: TreasuryUser, as_user_id: "${inv_id}", captures: { i2_id: "$.data.id" } }
            - { call: "POST /network/cuso-investments/${i2_id}/approve", payload: {}, as: RegulatorUser, captures: { first_err: "$.data.error_id" } }
            - { call: "POST /network/cuso-investments/${i2_id}/reject", payload: {}, as: RegulatorUser }
          trigger:
            - { call: "POST /network/cuso-investments/${i2_id}/approve", payload: {}, as: RegulatorUser, captures: { err: "$.data.error_id" } }
          assert:
            - "first_err == ERR_INVESTMENT_CAP_EXCEEDED (8,000,000 + 5,000,000 > 10,000,000 base cap; investment stays PENDING_REVIEW)"
            - "err == ERR_INVALID_STATE (I2 now REJECTED; state priority 7 beats the still-true cap violation at priority 8)"

      - name: referential_beats_temporal_on_commitment
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_CREDIT_UNION_NOT_ACTIVE]
          - errors[ERR_OFFERING_WINDOW_CLOSED]
        distinguishing_aspect: |
          Error-category pair business_referential vs business_temporal:
          commitment by a SUSPENDED buyer into an OPEN offering whose close_at
          has passed returns ERR_CREDIT_UNION_NOT_ACTIVE (priority 9), not
          ERR_OFFERING_WINDOW_CLOSED (priority 10).
        test_recipe:
          setup:
            - "Agreement ACTIVE; offering OPEN with close_at 2026-09-01 (sweep NOT run, so status remains OPEN)"
            - "Clock moved to 2026-09-02 (past close_at); buyer CU suspended"
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-BUY", legal_name: "Buyer CU", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool A", pool_principal_cents: 100000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
            - { call: "POST /network/credit-unions/${buyer_id}/suspend", payload: {}, as: NetworkAdmin }
            - { call: "POST /network/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: NetworkAdmin }
          trigger:
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 10000000 }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_CREDIT_UNION_NOT_ACTIVE (referential priority 9 beats the also-true window violation at priority 10)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: investment_cap_equality_boundary
        grounds:
          - calculations.investment_cap_check
          - errors[ERR_INVESTMENT_CAP_EXCEEDED]
        distinguishing_aspect: |
          Metric: money. Endpoint: POST /network/cuso-investments/{id}/approve.
          Aggregate exactly == base cap approves; exactly 1 cent over rejects
          (rejection requires aggregate > cap, not >=).
        test_recipe:
          setup:
            - "Investor CU: total_assets 5,000,000,000 -> base cap exactly 50,000,000; net_worth 500,000,000"
            - "I1 = 40,000,000 APPROVED; I2 = 10,000,000 PENDING; I3 = 1 PENDING"
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-INV", legal_name: "Investor CU", cu_type: "DUAL", total_assets_cents: 5000000000, net_worth_cents: 500000000 }, as: NetworkAdmin, captures: { inv_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/cuso-investments", payload: { credit_union_id: "${inv_id}", cuso_id: "${cuso_id}", amount_cents: 40000000 }, as: TreasuryUser, as_user_id: "${inv_id}", captures: { i1_id: "$.data.id" } }
            - { call: "POST /network/cuso-investments/${i1_id}/approve", payload: {}, as: RegulatorUser }
            - { call: "POST /network/cuso-investments", payload: { credit_union_id: "${inv_id}", cuso_id: "${cuso_id}", amount_cents: 10000000 }, as: TreasuryUser, as_user_id: "${inv_id}", captures: { i2_id: "$.data.id" } }
            - { call: "POST /network/cuso-investments", payload: { credit_union_id: "${inv_id}", cuso_id: "${cuso_id}", amount_cents: 1 }, as: TreasuryUser, as_user_id: "${inv_id}", captures: { i3_id: "$.data.id" } }
          trigger:
            - { call: "POST /network/cuso-investments/${i2_id}/approve", payload: {}, as: RegulatorUser, captures: { i2_status: "$.data.status", i2_agg: "$.data.post_approval_aggregate_cents" } }
            - { call: "POST /network/cuso-investments/${i3_id}/approve", payload: {}, as: RegulatorUser, captures: { i3_err: "$.data.error_id" } }
          assert:
            - "i2_status == APPROVED and i2_agg == 50000000 (aggregate == cap allowed)"
            - "i3_err == ERR_INVESTMENT_CAP_EXCEEDED (aggregate would be 50,000,001 > cap)"
            - "GET /network/cuso-investments/${i3_id} status == PENDING_REVIEW (failed approval leaves state unchanged)"

      - name: cure_deadline_inclusive_boundary
        grounds:
          - entities.DocumentationException.fields.cure_deadline
          - errors[ERR_CURE_PERIOD_EXPIRED]
        distinguishing_aspect: |
          Metric: timestamp. Endpoint: POST /network/exceptions/{id}/submit-cure.
          Cure at exactly cure_deadline succeeds (inclusive); one second after
          fails with ERR_CURE_PERIOD_EXPIRED.
        test_recipe:
          setup:
            - "Funded ACTIVE certificate; agreement cure_period_days 30"
            - "Exception E1 created at clock 2026-08-01T00:00:00Z -> cure_deadline 2026-08-31T00:00:00Z"
            - "Exception E2 created on the same certificate at the same clock -> same deadline"
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-BUY", legal_name: "Buyer CU", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, cure_period_days: 30, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool A", pool_principal_cents: 100000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 10000000 }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { cert_id: "$.data.id" } }
            - { call: "POST /network/commitments/${cert_id}/approve-diligence", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/commitments/${cert_id}/fund", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/exceptions", payload: { certificate_id: "${cert_id}", exception_type: "MISSING_NOTE", description: "E1" }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { e1_id: "$.data.id", e1_deadline: "$.data.cure_deadline" } }
            - { call: "POST /network/exceptions", payload: { certificate_id: "${cert_id}", exception_type: "STALE_APPRAISAL", description: "E2" }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { e2_id: "$.data.id" } }
            - { call: "POST /network/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: NetworkAdmin }
          trigger:
            - { call: "POST /network/exceptions/${e1_id}/submit-cure", payload: { cure_notes: "At the deadline" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { e1_status: "$.data.status" } }
            - { call: "POST /network/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:01Z" }, as: NetworkAdmin }
            - { call: "POST /network/exceptions/${e2_id}/submit-cure", payload: { cure_notes: "One second late" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { e2_err: "$.data.error_id" } }
          assert:
            - "e1_deadline == 2026-08-31T00:00:00Z"
            - "e1_status == CURE_SUBMITTED (submission at exactly the deadline is allowed)"
            - "e2_err == ERR_CURE_PERIOD_EXPIRED (one second past the deadline)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: offering_creation_requires_active_agreement
        grounds:
          - state_machines.ParticipationOffering.DRAFT_to_OPEN
          - validations[priority=9]
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair Offering <- ServicingAgreement: creating (and opening) an
          offering under a DRAFT agreement fails with ERR_AGREEMENT_NOT_ACTIVE;
          after activation it succeeds.
        test_recipe:
          setup:
            - "Originator CU and CUSO registered; servicing agreement created but NOT activated (DRAFT)"
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
          trigger:
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool A", pool_principal_cents: 100000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { err: "$.data.error_id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool A", pool_principal_cents: 100000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_status: "$.data.status" } }
          assert:
            - "err == ERR_AGREEMENT_NOT_ACTIVE while agreement is DRAFT"
            - "off_status == DRAFT after the agreement is activated (creation succeeds, initial state DRAFT)"

      - name: fund_requires_open_offering
        grounds:
          - state_machines.ParticipationCertificate.COMMITTED_to_ACTIVE
          - errors[ERR_OFFERING_NOT_OPEN]
        distinguishing_aspect: |
          Entity pair Certificate <- Offering: funding a COMMITTED certificate
          whose offering has been manually CLOSED fails with
          ERR_OFFERING_NOT_OPEN — different entity pair from
          offering_creation_requires_active_agreement.
        test_recipe:
          setup:
            - "Agreement ACTIVE; offering OPEN; certificate COMMITTED (diligence approved, not yet funded)"
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-BUY", legal_name: "Buyer CU", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool A", pool_principal_cents: 100000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-12-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 10000000 }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { cert_id: "$.data.id" } }
            - { call: "POST /network/commitments/${cert_id}/approve-diligence", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/offerings/${off_id}/close", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
          trigger:
            - { call: "POST /network/commitments/${cert_id}/fund", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_OFFERING_NOT_OPEN (offering CLOSED gates funding)"
            - "GET /network/commitments/${cert_id} status == COMMITTED (unchanged)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: exam_window_half_open_adjacency
        grounds:
          - entities.RegulatoryExam.fields.start_date
          - errors[ERR_EXAM_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open [start_date, end_date) on resource
          CUSO — an exam starting exactly when another ends (shared boundary
          date) is ALLOWED; one overlapping by a day is rejected.
        test_recipe:
          setup:
            - "CUSO registered; exam E1 [2026-03-01, 2026-03-15) exists"
          setup_api_calls:
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/exams", payload: { cuso_id: "${cuso_id}", start_date: "2026-03-01T00:00:00Z", end_date: "2026-03-15T00:00:00Z" }, as: RegulatorUser, captures: { e1_id: "$.data.id" } }
          trigger:
            - { call: "POST /network/exams", payload: { cuso_id: "${cuso_id}", start_date: "2026-03-15T00:00:00Z", end_date: "2026-03-31T00:00:00Z" }, as: RegulatorUser, captures: { e2_id: "$.data.id" } }
            - { call: "POST /network/exams", payload: { cuso_id: "${cuso_id}", start_date: "2026-03-14T00:00:00Z", end_date: "2026-03-20T00:00:00Z" }, as: RegulatorUser, captures: { e3_err: "$.data.error_id" } }
          assert:
            - "E2 creation succeeds (adjacent at the boundary: E2.start == E1.end is allowed under half-open semantics)"
            - "e3_err == ERR_EXAM_WINDOW_OVERLAP ([2026-03-14, 2026-03-20) intersects both existing windows)"

      - name: remittance_period_closed_overlap
        grounds:
          - entities.Remittance.fields.period_end
          - errors[ERR_REMITTANCE_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: CLOSED [period_start, period_end] on resource
          ParticipationCertificate — a new period sharing even one calendar day
          with an existing period collides (adjacency where next.start ==
          prev.end is REJECTED, unlike the half-open exam rule).
        test_recipe:
          setup:
            - "Funded ACTIVE certificate; remittance R1 for closed period [2026-08-01, 2026-08-31] exists"
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-BUY", legal_name: "Buyer CU", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool A", pool_principal_cents: 100000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-12-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 10000000 }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { cert_id: "$.data.id" } }
            - { call: "POST /network/commitments/${cert_id}/approve-diligence", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/commitments/${cert_id}/fund", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/remittances", payload: { certificate_id: "${cert_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", collections_cents: 100000 }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { r1_id: "$.data.id" } }
          trigger:
            - { call: "POST /network/remittances", payload: { certificate_id: "${cert_id}", period_start: "2026-08-31T00:00:00Z", period_end: "2026-09-30T00:00:00Z", collections_cents: 100000 }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { r2_err: "$.data.error_id" } }
            - { call: "POST /network/remittances", payload: { certificate_id: "${cert_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", collections_cents: 100000 }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { r3_id: "$.data.id" } }
          assert:
            - "r2_err == ERR_REMITTANCE_PERIOD_OVERLAP (shared calendar day 2026-08-31 under closed-interval semantics)"
            - "R3 creation succeeds ([2026-09-01, 2026-09-30] shares no day with [2026-08-01, 2026-08-31])"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: commit_rescind_conserves_committed_principal
        grounds:
          - state_machines.ParticipationCertificate.COMMITTED_to_RESCINDED
          - entities.ParticipationOffering.fields.remaining_principal_cents
          - entities.CreditUnion.fields.total_committed_principal_cents
        distinguishing_aspect: |
          Conserved quantity: committed principal. Invariant pinned as formula:
          offering.remaining_principal_cents == pool_principal_cents -
          sum(committed over non-terminal certs) and
          buyer.total_committed_principal_cents == sum over the buyer's
          non-terminal certs; a commit followed by its rescind returns BOTH to
          their pre-commit values.
        test_recipe:
          setup:
            - "Agreement ACTIVE; offering OPEN with pool 100,000,000 (remaining 100,000,000); buyer total_committed 0"
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-BUY", legal_name: "Buyer CU", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool A", pool_principal_cents: 100000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-12-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
          trigger:
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 20000000 }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { cert_id: "$.data.id" } }
            - { call: "POST /network/commitments/${cert_id}/approve-diligence", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/commitments/${cert_id}/rescind", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}", captures: { cert_status: "$.data.status" } }
          assert:
            - "cert_status == RESCINDED"
            - "GET /network/offerings/${off_id} remaining_principal_cents == 100000000 (unchanged from before the commit)"
            - "GET /network/offerings/${off_id} committed_principal_cents == 0"
            - "GET /network/credit-unions/${buyer_id} total_committed_principal_cents == 0 (unchanged from before the commit)"

      - name: pay_reverse_conserves_certificate_ledger
        grounds:
          - state_machines.Remittance.PAID_to_REVERSED
          - entities.ParticipationCertificate.fields.outstanding_principal_cents
        distinguishing_aspect: |
          Conserved quantity: the certificate's loan ledger. Invariant pinned
          as formula: outstanding_principal_cents and
          cumulative_interest_cents after pay + reverse equal their pre-pay
          values exactly (principal portion credited back, interest portion
          debited back) — a different conserved quantity from committed
          principal.
        test_recipe:
          setup:
            - "Funded ACTIVE certificate 10,000,000 @ 600bps under THIRTY_360 agreement (fee 25bps, due day 15)"
            - "Remittance period 2026-08-01..2026-08-31, collections 5,052,083 (interest 50,000, fee 2,083, principal 5,000,000)"
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-BUY", legal_name: "Buyer CU", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool A", pool_principal_cents: 100000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-12-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 10000000 }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { cert_id: "$.data.id" } }
            - { call: "POST /network/commitments/${cert_id}/approve-diligence", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/commitments/${cert_id}/fund", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/remittances", payload: { certificate_id: "${cert_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", collections_cents: 5052083 }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { rem_id: "$.data.id" } }
          trigger:
            - { call: "POST /network/remittances/${rem_id}/pay", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}", captures: { pay_status: "$.data.status" } }
            - { call: "POST /network/remittances/${rem_id}/reverse", payload: {}, as: NetworkAdmin, captures: { rev_status: "$.data.status" } }
          assert:
            - "pay_status == PAID (clock default 2026-08-01 <= due 2026-09-15)"
            - "rev_status == REVERSED"
            - "GET /network/commitments/${cert_id} outstanding_principal_cents == 10000000 (restored)"
            - "GET /network/commitments/${cert_id} cumulative_interest_cents == 0 (restored)"
            - "GET /network/commitments/${cert_id} status == ACTIVE"
