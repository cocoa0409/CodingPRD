              captures: { final_state: "$.data.state", final_rc: "$.data.retry_count", final_settled: "$.data.settled_at" }
            - call: "POST /monetization/payouts/${po_id}/retry"
              payload: {}
              as: FinanceOperator
          assert:
            - "${po_fee} == 200 and ${po_amount} == 19800 (BANK_TRANSFER tier T1 on payable 20000)"
            - "${st_fail1} == FAILED and ${rc_fail1} == 0 (the fork chose FAILED because retry_count < MAX_PAYOUT_RETRIES)"
            - "${st_retry1} == PROCESSING and ${rc_retry1} == 1 and ${fee_retry1} == 200 (loop closed; fee waterfall NOT re-run)"
            - "${st_fail2} == FAILED"
            - "${st_retry2} == PROCESSING and ${rc_retry2} == 2 and ${fee_retry2} == 200 and ${amount_retry2} == 19800"
            - "${final_state} == ABANDONED and ${final_rc} == 2 (same call, other branch, chosen only by retry_count == 2)"
            - "${final_settled} == '2026-08-01T00:00:00.000Z'"
            - "Payout.${po_id}.failure_code == ACCOUNT_CLOSED"
            - "trigger step 2 returns HTTP 409 with error_id ERR_PAYOUT_NOT_FAILED (ABANDONED is terminal, so the state guard fires before the retry-count guard)"
            - "Creator.${cr_id}.consecutive_payment_failures == 3 and lifetime_paid_cents == 0"
            - "Creator.${cr_id}.payout_state == ACCRUING and ledger_balance_cents == 20000 and available_balance_cents == 20000"
            - "EarningsStatement.${s1_id}.payout_id == null and status == FINALIZED"
            - "GET /monetization/creators/${cr_id}/ledger-entries returns 10 rows: 1 ACCRUAL, 3 PAYOUT_DEBIT, 3 PAYOUT_FEE, 3 PAYOUT_REVERSAL"

      - name: creator_eligibility_and_payout_state_are_independent_dimensions
        entity: Creator
        shape: "parallel_state_dimensions"
        grounds:
          - state_machines.Creator
          - "state_machines.Creator.transitions[eligibility_status IN {PENDING_REVIEW, ELIGIBLE, INELIGIBLE} -> eligibility_status=SUSPENDED]"
          - entities.Creator.fields.eligibility_status
          - entities.Creator.fields.payout_state
          - calculations.payout_state_resolution
          - "validations.priority_38"
          - "validations.priority_37"
          - errors.ERR_CREATOR_NOT_ELIGIBLE
        distinguishing_aspect: |
          A third entity carries two orthogonal state dimensions on one row:
          eligibility_status and payout_state. A policy strike drives
          eligibility_status ELIGIBLE -> SUSPENDED without touching payout_state
          (payout_state_resolution never reads eligibility_status), so the very
          same SUSPENDED creator is simultaneously blocked from accruing new
          revenue (ERR_CREATOR_NOT_ELIGIBLE) and permitted to create a Payout
          against already-earned money - and creating that Payout moves only the
          second dimension, to PAYOUT_IN_FLIGHT, leaving SUSPENDED intact.
        test_recipe:
          setup:
            - "One US Creator with payout_method BANK_TRANSFER, follower_count 10000, watch_time_minutes_365d 240000, evaluated to ELIGIBLE, and a VERIFIED W9 TaxProfile with tin_provided true (withholding rate 0 bps)."
            - "A TIPS RevenueProduct (5000/5000, min_payable_cents 0) accrued one event of gross_amount_cents 40000 in period 2026-07, so creator_share_cents == 20000."
            - "Period 2026-07 is CLOSED and its statement FINALIZED with net_payable_cents 20000, so available_balance_cents == 20000; a second OPEN period [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z) exists for the new accrual attempt."
            - "PolicyReviewer reviewer-r1 then recorded one strike, so active_strike_count == 1, eligibility_status == SUSPENDED, last_evaluation_failed_criteria == ['POLICY_COMPLIANCE'] - while payout_state is still ACCRUING because there is no outstanding clawback, no holding investigation and no live payout."
