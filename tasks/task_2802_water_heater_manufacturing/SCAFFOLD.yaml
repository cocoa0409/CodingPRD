# =============================================================================
# SCAFFOLD.yaml — Water Heater Manufacturing Plant
# §1.0–§1.7 seed tables. Single source of truth for PRD, tests, implementation.
# =============================================================================

scenario: "2802. Water Heater Manufacturing (water heater manufacturing plant): tank fabrication with welding, glass lining application and firing with adhesion and holiday testing, insulation foaming, jacket assembly and component installation across gas, electric and heat pump models, efficiency standard compliance testing with rating certification and labeling requirements, gas control and safety component sourcing with supplier qualification, first-hour rating and recovery testing on a sample basis, model proliferation across trade, retail and builder channels with private label variants, warranty analysis of tank failures by production period and water chemistry, recall management with serial-based identification"

domain_name: "water-heater-manufacturing"
api_prefix: "/mfg"

# -----------------------------------------------------------------------------
# §0 Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: graph_constraint
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: graph
  # ProductModel is self-referential (private-label variant -> base model);
  # HeaterUnit is a junction of TankLot x ProductModel x two ComponentLots;
  # RecallNotice is a junction of RecallCampaign x HeaterUnit. No URL nesting
  # except the two reverse-reachability sub-resource reads.

  state_machine_shape: cyclic
  # TankLot: LINED -> LINING_REJECTED -> RELINE_QUEUED -> LINED (rework loop).
  # ProductModel: certification_status x release_status evolve as two
  #   independent parallel dimensions on the same row.
  # RatingCertification: SUBMITTED -> REJECTED -> SUBMITTED revision loop.
  # ComponentLot: RELEASED -> BLOCKED -> RELEASED. Supplier: DISQUALIFIED ->
  #   PENDING requalification. WarrantyClaim: PAID -> VALIDATED reversal.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # A certification submitter may not approve it; a lot's weld operator may not
  # sign its lining inspections. Both are enforced on X-User-ID.

  consistency_model: immediate

  difficulty_level: expert

# -----------------------------------------------------------------------------
# §1.0 Response envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the component supplier
        constraints: non-empty, max 120 chars
      - name: component_category
        type: enum
        source: input
        description: the single component family this supplier is approved to ship
        constraints: one of GAS_VALVE, THERMOSTAT, TP_RELIEF_VALVE, ANODE, COMPRESSOR, ECO_SWITCH
      - name: audit_score
        type: number
        source: input
        description: latest on-site quality-system audit score
        constraints: 0 <= audit_score <= 100
      - name: defect_ppm
        type: integer
        source: input
        description: measured defective parts per million on incoming inspection
        constraints: defect_ppm >= 0
      - name: open_capa_count
        type: integer
        source: input
        description: number of corrective-action requests still open against this supplier
        constraints: open_capa_count >= 0
      - name: qualification_score
        type: number
        source: computed
        description: weighted qualification score from calculations.supplier_qualification_score; null until first qualify attempt
        constraints: 2 decimal places
      - name: qualification_status
        type: enum
        source: system
        description: qualification posture gating whether this supplier's lots may be released
        default: PENDING
        constraints: one of PENDING, QUALIFIED, CONDITIONAL, DISQUALIFIED
      - name: qualified_until
        type: datetime
        source: system
        description: inclusive expiry instant of the current qualification; null while PENDING or DISQUALIFIED
      - name: disqualification_reason_code
        type: string
        source: system
        description: reason_code recorded by the disqualify action; null otherwise
      - name: blocked_lot_count
        type: integer
        source: computed
        description: count of ComponentLot rows with supplier_id == this Supplier.id and status == BLOCKED

  - name: ComponentLot
    parent: null
    common_fields: true
    fields:
      - name: supplier_id
        type: string
        source: input
        description: "FK -> Supplier.id; the supplier that shipped this lot"
      - name: part_number
        type: string
        source: input
        description: manufacturer part number printed on the lot label
        constraints: non-empty, max 40 chars, unique within one supplier_id
      - name: category
        type: enum
        source: input
        description: component family of this lot; must equal the supplier's component_category
        constraints: one of GAS_VALVE, THERMOSTAT, TP_RELIEF_VALVE, ANODE, COMPRESSOR, ECO_SWITCH
      - name: quantity
        type: integer
        source: input
        description: pieces received in this lot; the conserved total for calculations.component_lot_quantity_ledger
        constraints: quantity >= 1
      - name: certificate_of_conformance
        type: boolean
        source: input
        description: whether the supplier attached a signed CoC to the shipment
        default: false
      - name: status
        type: enum
        source: system
        description: incoming-inspection and availability posture of the lot
        default: QUARANTINED
        constraints: one of QUARANTINED, RELEASED, REJECTED, BLOCKED, CONSUMED
      - name: consumed_quantity
        type: integer
        source: computed
        description: pieces drawn by HeaterUnit rows per calculations.component_lot_quantity_ledger
      - name: remaining_quantity
        type: integer
        source: computed
        description: quantity - consumed_quantity per calculations.component_lot_quantity_ledger
      - name: reject_reason_code
        type: string
        source: system
        description: reason_code recorded by reject or by the disqualification cascade; null otherwise

  - name: Furnace
    parent: null
    common_fields: true
    fields:
      - name: furnace_code
        type: string
        source: input
        description: plant-unique identifier of the glass-lining firing furnace
        constraints: unique across Furnace, non-empty, max 20 chars
      - name: max_firing_temp_c
        type: integer
        source: input
        description: maximum sustained chamber temperature in Celsius
        constraints: 700 <= max_firing_temp_c <= 1000
      - name: occupied_window_count
        type: integer
        source: computed
        description: count of GlassLiningBatch rows with furnace_id == this Furnace.id and status IN {MIXED, FIRED}

  - name: GlassLiningBatch
    parent: null
    common_fields: true
    fields:
      - name: furnace_id
        type: string
        source: input
        description: "FK -> Furnace.id; the furnace whose firing window this batch occupies"
      - name: batch_code
        type: string
        source: input
        description: plant-unique slurry/firing batch identifier
        constraints: unique across GlassLiningBatch, non-empty, max 20 chars
      - name: slurry_mix_code
        type: string
        source: input
        description: recipe code of the glass frit slurry applied in this batch
        constraints: non-empty, max 20 chars
      - name: firing_temp_c
        type: integer
        source: input
        description: setpoint chamber temperature for this batch
        constraints: 700 <= firing_temp_c <= furnace.max_firing_temp_c
      - name: firing_start
        type: datetime
        source: input
        description: inclusive start of the furnace occupation interval
      - name: firing_end
        type: datetime
        source: input
        description: exclusive end of the furnace occupation interval
        constraints: firing_end > firing_start
      - name: status
        type: enum
        source: system
        description: batch lifecycle; only FIRED batches may be applied to a tank lot
        default: MIXED
        constraints: one of MIXED, FIRED, QUARANTINED
      - name: assigned_lot_count
        type: integer
        source: computed
        description: count of TankLot rows whose glass_lining_batch_id == this GlassLiningBatch.id
      - name: rejected_lot_count
        type: integer
        source: system
        description: number of directly-rejected lining inspections charged to this batch; cascade-induced lot rejections do NOT increment it
        default: 0
      - name: quarantine_reason_code
        type: string
        source: system
        description: reason_code recorded when the batch was quarantined; null otherwise

  - name: TankLot
    parent: null
    common_fields: true
    fields:
      - name: product_model_id
        type: string
        source: input
        description: "FK -> ProductModel.id; the model whose tanks this lot fabricates"
      - name: glass_lining_batch_id
        type: string
        source: system
        description: "FK -> GlassLiningBatch.id; set by apply-lining, null before the first lining application"
      - name: lot_code
        type: string
        source: input
        description: plant-unique fabrication lot identifier
        constraints: unique across TankLot, non-empty, max 20 chars
      - name: planned_quantity
        type: integer
        source: input
        description: tanks welded into this lot; the conserved total for calculations.tank_lot_quantity_ledger
        constraints: 1 <= planned_quantity <= 1000
      - name: wip_quantity
        type: integer
        source: computed
        description: tanks still in process per calculations.tank_lot_quantity_ledger; initialised to planned_quantity
      - name: good_quantity
        type: integer
        source: computed
        description: tanks accepted at lot release per calculations.tank_lot_quantity_ledger
      - name: scrapped_quantity
        type: integer
        source: computed
        description: tanks scrapped by failed lining inspections per calculations.tank_lot_quantity_ledger
      - name: rework_count
        type: integer
        source: system
        description: number of times this lot entered LINING_REJECTED, including cascade-induced rejections
        default: 0
      - name: last_scrap_quantity
        type: integer
        source: system
        description: scrap_quantity charged by the most recent direct lining rejection; consumed by rework-reversal, null when none outstanding
      - name: weld_operator_user_id
        type: string
        source: system
        description: X-User-ID of the PlantOperator who executed the weld transition; null before welding
      - name: production_period
        type: string
        source: system
        description: "YYYY-MM string taken from the logical clock at lot creation; the cohort key used by calculations.tank_failure_rate_by_period"
      - name: status
        type: enum
        source: system
        description: fabrication lifecycle state
        default: FAB_QUEUED
        constraints: one of FAB_QUEUED, WELDED, LINED, LINING_VERIFIED, LINING_REJECTED, RELINE_QUEUED, FOAMED, JACKETED, RELEASED, SCRAPPED
      - name: foam_density_kg_m3
        type: number
        source: system
        description: insulation foam density recorded by the foam transition; null before foaming
      - name: foam_thickness_mm
        type: integer
        source: system
        description: insulation foam wall thickness recorded by the foam transition; null before foaming
      - name: achieved_r_value
        type: number
        source: computed
        description: round_half_up(foam_thickness_mm * R_VALUE_PER_MM, 1); null before foaming
      - name: cascade_rejected
        type: boolean
        source: system
        description: true when this lot's most recent rejection came from a batch-quarantine cascade rather than its own inspection
        default: false
      - name: unit_count
        type: integer
        source: computed
        description: count of HeaterUnit rows with tank_lot_id == this TankLot.id and build_status != SCRAPPED

  - name: LiningInspection
    parent: null
    common_fields: false
    fields:
      - name: tank_lot_id
        type: string
        source: input
        description: "FK -> TankLot.id; the lot sampled by this inspection"
      - name: inspection_type
        type: enum
        source: input
        description: which lining property this record measures
        constraints: one of ADHESION, HOLIDAY
      - name: sample_size
        type: integer
        source: input
        description: tanks pulled from the lot for this inspection
        constraints: sample_size >= 1
      - name: holiday_count
        type: integer
        source: input
        description: total coating discontinuities found across the sample; required when inspection_type == HOLIDAY, must be omitted otherwise
        constraints: holiday_count >= 0
      - name: adhesion_class
        type: integer
        source: input
        description: worst adhesion class observed in the sample, 1 best to 5 worst; required when inspection_type == ADHESION, must be omitted otherwise
        constraints: 1 <= adhesion_class <= 5
      - name: scrap_quantity
        type: integer
        source: input
        description: tanks condemned by this inspection; required when the computed result is FAIL, must be omitted when the result is PASS
        constraints: 1 <= scrap_quantity <= tank_lot.wip_quantity
      - name: holidays_per_tank
        type: number
        source: computed
        description: round_half_up(holiday_count / sample_size, 4) per calculations.lot_holiday_density; null for ADHESION records
      - name: result
        type: enum
        source: computed
        description: verdict from calculations.lot_holiday_density (HOLIDAY) or the adhesion class ceiling (ADHESION)
        constraints: one of PASS, FAIL
      - name: inspector_user_id
        type: string
        source: system
        description: X-User-ID of the QualityInspector who signed this record
      - name: record_status
        type: enum
        source: system
        description: CURRENT for the newest record of this inspection_type on the lot; SUPERSEDED once a newer record of the same type is filed
        default: CURRENT
        constraints: one of CURRENT, SUPERSEDED

  - name: ProductModel
    parent: null
    common_fields: true
    fields:
      - name: model_code
        type: string
        source: input
        description: catalogue model code; also the serial-number prefix once certified
        constraints: unique across ProductModel, non-empty, max 24 chars, uppercase letters, digits and hyphens only
      - name: fuel_type
        type: enum
        source: input
        description: energy source, which selects the federal minimum UEF table
        constraints: one of GAS, ELECTRIC, HEAT_PUMP
      - name: nominal_capacity_gallons
        type: integer
        source: input
        description: rated storage volume; selects the small/large capacity tier
        constraints: 20 <= nominal_capacity_gallons <= 120
      - name: channel
        type: enum
        source: input
        description: distribution channel this model is catalogued for
        constraints: one of TRADE, RETAIL, BUILDER
      - name: insulation_r_value
        type: number
        source: input
        description: declared insulation R-value, credited in calculations.uef_compliance_margin and floor-checked at foaming
        constraints: 10.0 <= insulation_r_value <= 40.0
      - name: base_model_id
        type: string
        source: input
        description: "FK -> ProductModel.id; the base model this private-label variant re-brands; null for base models"
      - name: is_private_label
        type: boolean
        source: input
        description: whether this row is a private-label variant of another model
        default: false
      - name: brand_label
        type: string
        source: input
        description: retailer brand printed on the jacket; required when is_private_label is true, must be omitted otherwise
        constraints: max 40 chars
      - name: certification_status
        type: enum
        source: system
        description: first parallel state dimension - efficiency-rating posture
        default: UNCERTIFIED
        constraints: one of UNCERTIFIED, TEST_PENDING, CERTIFIED, SUSPENDED, DECERTIFIED
      - name: release_status
        type: enum
        source: system
        description: second parallel state dimension - channel release posture, independent of certification_status
        default: DRAFT
        constraints: one of DRAFT, RELEASED, RESTRICTED, WITHDRAWN
      - name: uef_rated
        type: number
        source: computed
        description: certified UEF copied from the approved RatingCertification.certified_uef; null until first approval
      - name: fhr_rated
        type: integer
        source: computed
        description: certified first-hour rating in gallons copied from the approved RatingCertification.certified_fhr; null until first approval
      - name: recovery_rate_rated
        type: number
        source: computed
        description: certified recovery rate in gallons/hour copied from the approved RatingCertification.certified_recovery; null until first approval
      - name: label_serial_prefix
        type: string
        source: computed
        description: serial prefix minted at certification approval, equal to model_code; null until first approval
      - name: held_unit_count
        type: integer
        source: computed
        description: count of HeaterUnit rows with product_model_id == this ProductModel.id and build_status == HELD
      - name: warranty_reserve_accrued_cents
        type: integer
        source: computed
        description: cumulative accrual per calculations.warranty_reserve_ledger
      - name: warranty_paid_cents
        type: integer
        source: computed
        description: cumulative claim payments per calculations.warranty_reserve_ledger
      - name: warranty_reserve_balance_cents
        type: integer
        source: computed
        description: warranty_reserve_accrued_cents - warranty_paid_cents per calculations.warranty_reserve_ledger

  - name: TestCell
    parent: null
    common_fields: true
    fields:
      - name: cell_code
        type: string
        source: input
        description: plant-unique identifier of the efficiency test cell
        constraints: unique across TestCell, non-empty, max 20 chars
      - name: parallel_slots
        type: integer
        source: input
        description: how many test windows this cell may run overlapping at one instant
        constraints: 1 <= parallel_slots <= 8
      - name: cooldown_hours
        type: integer
        source: input
        description: mandatory thermal recovery buffer between two tests of the SAME product model in this cell
        constraints: 0 <= cooldown_hours <= 72

  - name: EfficiencyTest
    parent: null
    common_fields: true
    fields:
      - name: product_model_id
        type: string
        source: input
        description: "FK -> ProductModel.id; the model under test"
      - name: test_cell_id
        type: string
        source: input
        description: "FK -> TestCell.id; the cell whose window this test occupies"
      - name: test_type
        type: enum
        source: input
        description: which rating this run measures
        constraints: one of UEF, FIRST_HOUR_RATING, RECOVERY
      - name: sample_size
        type: integer
        source: input
        description: production units drawn for this run; feeds the UEF sample derate table
        constraints: 1 <= sample_size <= 12
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the test cell occupation interval
      - name: window_end
        type: datetime
        source: input
        description: exclusive end of the test cell occupation interval
        constraints: window_end > window_start
      - name: measured_value
        type: number
        source: system
        description: instrument reading recorded by record-result; UEF dimensionless, FIRST_HOUR_RATING gallons, RECOVERY gallons/hour; null while SCHEDULED
      - name: effective_minimum
        type: number
        source: computed
        description: applicable floor from calculations.uef_compliance_margin (UEF) or calculations.rating_floor_check (other types); null while SCHEDULED
      - name: margin
        type: number
        source: computed
        description: round_half_up(measured_value - effective_minimum, 4); null while SCHEDULED
      - name: status
        type: enum
        source: system
        description: test lifecycle; PASSED and FAILED are set by record-result, VOIDED by the decertification cascade
        default: SCHEDULED
        constraints: one of SCHEDULED, PASSED, FAILED, VOIDED
      - name: recorded_at
        type: datetime
        source: system
        description: logical-clock instant at which record-result was accepted; null while SCHEDULED

  - name: RatingCertification
    parent: null
    common_fields: true
    fields:
      - name: product_model_id
        type: string
        source: input
        description: "FK -> ProductModel.id; the model this certificate rates"
      - name: status
        type: enum
        source: system
        description: certification lifecycle with a REJECTED -> SUBMITTED revision loop
        default: DRAFT
        constraints: one of DRAFT, SUBMITTED, APPROVED, REJECTED, SUPERSEDED, REVOKED
      - name: certified_uef
        type: number
        source: computed
        description: rounded-per-test mean UEF from calculations.certified_rating_rounding; null while DRAFT
      - name: certified_fhr
        type: integer
        source: computed
        description: rounded-per-test mean first-hour rating in gallons from calculations.certified_rating_rounding; null while DRAFT
      - name: certified_recovery
        type: number
        source: computed
        description: rounded-per-test mean recovery rate from calculations.certified_rating_rounding; null while DRAFT
      - name: uef_test_count
        type: integer
        source: computed
        description: count of PASSED UEF EfficiencyTest rows on the model at submission time; null while DRAFT
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceEngineer who submitted; null while DRAFT
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the CertificationApprover who approved; null until APPROVED
      - name: effective_date
        type: datetime
        source: system
        description: logical-clock instant of approval; null until APPROVED
      - name: label_serial_prefix
        type: string
        source: computed
        description: serial prefix stamped at approval, equal to the model's model_code; null until APPROVED
      - name: reason_code
        type: string
        source: system
        description: reason_code recorded by reject or revoke; null otherwise

  - name: HeaterUnit
    parent: null
    common_fields: true
    fields:
      - name: tank_lot_id
        type: string
        source: input
        description: "FK -> TankLot.id; the released fabrication lot this unit's tank came from"
      - name: product_model_id
        type: string
        source: computed
        description: "FK -> ProductModel.id; copied from the tank lot at creation, never supplied by the client"
      - name: gas_control_lot_id
        type: string
        source: input
        description: "FK -> ComponentLot.id; the gas control valve lot installed; required for GAS models, must be omitted for ELECTRIC and HEAT_PUMP"
      - name: safety_valve_lot_id
        type: string
        source: input
        description: "FK -> ComponentLot.id; the T&P relief valve lot installed; required for every fuel type"
      - name: serial_number
        type: string
        source: computed
        description: serial minted at labeling per calculations.unit_serial_assignment; null until LABELED
      - name: build_status
        type: enum
        source: system
        description: assembly and distribution lifecycle
        default: COMPONENTS_STAGED
        constraints: one of COMPONENTS_STAGED, ASSEMBLED, LABELED, SHIPPED, HELD, SCRAPPED
      - name: held_from_status
        type: enum
        source: system
        description: build_status the unit occupied immediately before entering HELD, restored by release-hold; null when not HELD
        constraints: one of ASSEMBLED, LABELED, SHIPPED
      - name: label_status
        type: enum
        source: system
        description: rating-label posture; APPLIED at labeling, INVALID when the model is decertified
        default: NONE
        constraints: one of NONE, APPLIED, INVALID
      - name: production_period
        type: string
        source: computed
        description: YYYY-MM cohort key copied from the tank lot's production_period at creation
      - name: install_water_hardness_gpg
        type: number
        source: system
        description: field water hardness in grains per gallon recorded at shipment; null until SHIPPED
      - name: water_hardness_band
        type: enum
        source: computed
        description: band from calculations.water_hardness_band_factor; null until SHIPPED
        constraints: one of SOFT, MODERATE, HARD, VERY_HARD
      - name: hardness_factor
        type: number
        source: computed
        description: exposure multiplier from calculations.water_hardness_band_factor; null until SHIPPED
      - name: shipped_at
        type: datetime
        source: system
        description: logical-clock instant of shipment; null until SHIPPED
      - name: months_in_service
        type: integer
        source: computed
        description: floor((logical clock now - shipped_at) / 30 days) evaluated at read time; null until SHIPPED
      - name: hold_reason_code
        type: string
        source: system
        description: reason_code recorded when the unit was placed on hold or scrapped; null otherwise

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: heater_unit_id
        type: string
        source: input
        description: "FK -> HeaterUnit.id; the in-service unit that failed"
      - name: failure_mode
        type: enum
        source: input
        description: reported failure mode, which selects the coverage schedule
        constraints: one of TANK_LEAK, ANODE_DEPLETION, THERMOSTAT, GAS_VALVE, COMPRESSOR, OTHER
      - name: reported_water_hardness_gpg
        type: number
        source: input
        description: water hardness measured by the field technician at the failure site
        constraints: 0.0 <= reported_water_hardness_gpg <= 60.0
      - name: months_in_service_at_report
        type: integer
        source: computed
        description: the unit's months_in_service frozen at claim creation; drives coverage_pct
      - name: coverage_pct
        type: number
        source: computed
        description: coverage fraction from calculations.warranty_payout_proration; null while OPEN
      - name: approved_payout_cents
        type: integer
        source: computed
        description: round-per-line then sum payout from calculations.warranty_payout_proration; null while OPEN
      - name: status
        type: enum
        source: system
        description: claim lifecycle with a PAID -> VALIDATED payment-reversal loop
        default: OPEN
        constraints: one of OPEN, VALIDATED, DENIED, PAID
      - name: paid_at
        type: datetime
        source: system
        description: logical-clock instant of payment; null unless PAID
      - name: reason_code
        type: string
        source: system
        description: reason_code recorded by deny or reverse-payment; null otherwise

  - name: RecallCampaign
    parent: null
    common_fields: true
    fields:
      - name: campaign_code
        type: string
        source: input
        description: plant-unique recall campaign identifier
        constraints: unique across RecallCampaign, non-empty, max 20 chars
      - name: scope_product_model_id
        type: string
        source: input
        description: "FK -> ProductModel.id; the single model whose serials this campaign covers"
      - name: remedy_type
        type: enum
        source: input
        description: remedy kit applied to every affected unit; selects parts and labour constants
        constraints: one of TANK_REPLACEMENT, GAS_VALVE_KIT, TP_VALVE_KIT, FULL_UNIT_REPLACEMENT
      - name: budget_cents
        type: integer
        source: input
        description: authorised remedy budget checked at announcement
        constraints: budget_cents >= 0
      - name: serial_range_start
        type: string
        source: system
        description: inclusive lower serial bound recorded by scope; null while DRAFT
      - name: serial_range_end
        type: string
        source: system
        description: inclusive upper serial bound recorded by scope; null while DRAFT
      - name: affected_unit_count
        type: integer
        source: computed
        description: population size from calculations.recall_scope_resolution
        default: 0
      - name: notice_count
        type: integer
        source: computed
        description: count of RecallNotice rows with recall_campaign_id == this RecallCampaign.id
        default: 0
      - name: remedied_count
        type: integer
        source: computed
        description: count of RecallNotice rows on this campaign with status == REMEDIED
        default: 0
      - name: per_unit_remedy_cost_cents
        type: integer
        source: computed
        description: pinned-order remedy cost per unit from calculations.recall_remedy_cost; null while DRAFT
      - name: estimated_remedy_cost_cents
        type: integer
        source: computed
        description: affected_unit_count * per_unit_remedy_cost_cents; null while DRAFT
      - name: completion_pct_notice_based
        type: number
        source: computed
        description: notice_based variant of calculations.recall_completion_rate
        default: 0.00
      - name: completion_pct_population_based
        type: number
        source: computed
        description: population_based variant of calculations.recall_completion_rate
        default: 0.00
      - name: status
        type: enum
        source: system
        description: campaign lifecycle
        default: DRAFT
        constraints: one of DRAFT, SCOPED, ANNOUNCED, IN_REMEDY, CLOSED, CANCELLED
      - name: reason_code
        type: string
        source: system
        description: reason_code recorded by cancel; null otherwise

  - name: RecallNotice
    parent: null
    common_fields: true
    fields:
      - name: recall_campaign_id
        type: string
        source: computed
        description: "FK -> RecallCampaign.id; set by the announce fan-out, never client-supplied"
      - name: heater_unit_id
        type: string
        source: computed
        description: "FK -> HeaterUnit.id; the shipped unit this notice addresses, set by the announce fan-out"
      - name: status
        type: enum
        source: system
        description: per-unit remedy progress
        default: PENDING
        constraints: one of PENDING, NOTIFIED, REMEDIED, UNREACHABLE
      - name: remedy_cost_cents
        type: integer
        source: computed
        description: the campaign's per_unit_remedy_cost_cents frozen onto this notice at fan-out
      - name: notified_at
        type: datetime
        source: system
        description: logical-clock instant the owner was notified; null while PENDING
      - name: remedied_at
        type: datetime
        source: system
        description: logical-clock instant the remedy was completed; null unless REMEDIED
      - name: reason_code
        type: string
        source: system
        description: reason_code recorded by mark-unreachable; null otherwise

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:

  - entity: Supplier
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: QUALIFIED
        trigger: "POST /mfg/suppliers/{id}/qualify"
        actor: SupplierQualityManager
        preconditions:
          - "calculations.supplier_qualification_score >= QUALIFIED_SCORE_FLOOR (85.00)"
          - "qualified_until > logical clock now"
          - "blocked_lot_count == 0 (containment carried over from an earlier disqualification must be dispositioned first)"
        side_effects:
          - "set qualification_score to the computed score"
          - "set qualified_until from the request"
          - "clear disqualification_reason_code"
          - "increment Supplier.version by 1"
      - from: PENDING
        to: CONDITIONAL
        trigger: "POST /mfg/suppliers/{id}/qualify"
        actor: SupplierQualityManager
        preconditions:
          - "CONDITIONAL_SCORE_FLOOR (70.00) <= calculations.supplier_qualification_score < QUALIFIED_SCORE_FLOOR (85.00)"
          - "qualified_until > logical clock now"
          - "blocked_lot_count == 0 (containment carried over from an earlier disqualification must be dispositioned first)"
        side_effects:
          - "set qualification_score, qualified_until"
          - "increment Supplier.version by 1"
        note: "Branching outcome - the same trigger reaches two different states purely on the score band."
      - from: QUALIFIED
        to: CONDITIONAL
        trigger: "POST /mfg/suppliers/{id}/qualify"
        actor: SupplierQualityManager
        preconditions:
          - "CONDITIONAL_SCORE_FLOOR (70.00) <= score < QUALIFIED_SCORE_FLOOR (85.00)"
        side_effects:
          - "set qualification_score, qualified_until"
          - "increment Supplier.version by 1"
      - from: CONDITIONAL
        to: QUALIFIED
        trigger: "POST /mfg/suppliers/{id}/qualify"
        actor: SupplierQualityManager
        preconditions:
          - "score >= QUALIFIED_SCORE_FLOOR (85.00)"
        side_effects:
          - "set qualification_score, qualified_until"
          - "increment Supplier.version by 1"
      - from: QUALIFIED
        to: DISQUALIFIED
        trigger: "POST /mfg/suppliers/{id}/disqualify"
        actor: SupplierQualityManager
        preconditions:
          - "qualification_status IN {QUALIFIED, CONDITIONAL}"
        side_effects:
          - "set disqualification_reason_code, clear qualified_until"
          - "CASCADE HOP 1: every ComponentLot with supplier_id == this Supplier.id and status IN {QUARANTINED, RELEASED}, in created_at ASC order, transitions to BLOCKED with reject_reason_code = SUPPLIER_DISQUALIFIED"
          - "CASCADE HOP 2 (caused by hop 1): every HeaterUnit with build_status IN {COMPONENTS_STAGED, ASSEMBLED, LABELED} whose gas_control_lot_id or safety_valve_lot_id is one of the lots blocked in hop 1, in created_at ASC order, transitions to HELD (held_from_status set from the pre-hold build_status when it was ASSEMBLED or LABELED, hold_reason_code = COMPONENT_LOT_BLOCKED); a LABELED unit additionally gets label_status = INVALID"
          - "CASCADE HOP 3 (caused by hop 2): every ProductModel that owns at least one unit held in hop 2 recomputes held_unit_count, and any such model with release_status == RELEASED transitions to RESTRICTED, in created_at ASC order"
          - "increment version by 1 on the Supplier and on every entity mutated by hops 1-3"
      - from: CONDITIONAL
        to: DISQUALIFIED
        trigger: "POST /mfg/suppliers/{id}/disqualify"
        actor: SupplierQualityManager
        preconditions:
          - "qualification_status IN {QUALIFIED, CONDITIONAL}"
        side_effects:
          - "identical cascade hops 1-3 as the QUALIFIED_to_DISQUALIFIED transition"
          - "increment Supplier.version by 1"
      - from: DISQUALIFIED
        to: PENDING
        trigger: "POST /mfg/suppliers/{id}/requalify"
        actor: SupplierQualityManager
        preconditions:
          - "qualification_status == DISQUALIFIED"
        side_effects:
          - "clear disqualification_reason_code and qualification_score"
          - "increment Supplier.version by 1"
        note: "Cycle: a disqualified supplier returns to PENDING and may be qualified again. Requalification deliberately does NOT require the containment to be cleared - it is what unlocks the containment, since unblocking a BLOCKED lot is refused only while the supplier is still DISQUALIFIED. The blocked_lot_count == 0 gate sits on the following PENDING -> QUALIFIED / PENDING -> CONDITIONAL step instead, so the recovery order is requalify, then disposition every blocked lot by unblock or reject, then qualify."

  - entity: ComponentLot
    initial_state: QUARANTINED
    terminal_states: [REJECTED, CONSUMED]
    transitions:
      - from: QUARANTINED
        to: RELEASED
        trigger: "POST /mfg/component-lots/{id}/release"
        actor: QualityInspector
        preconditions:
          - "certificate_of_conformance == true"
          - "supplier.qualification_status IN {QUALIFIED, CONDITIONAL}"
          - "supplier.qualified_until >= logical clock now"
        side_effects:
          - "clear reject_reason_code"
          - "increment ComponentLot.version by 1"
        note: "Cross-entity guard on Supplier state - see §0.5 rule cross_entity_state_dependency."
      - from: QUARANTINED
        to: REJECTED
        trigger: "POST /mfg/component-lots/{id}/reject"
        actor: QualityInspector
        preconditions:
          - "status == QUARANTINED"
        side_effects:
          - "set reject_reason_code from the request"
          - "increment ComponentLot.version by 1"
      - from: RELEASED
        to: BLOCKED
        trigger: "system cascade hop 1 of Supplier QUALIFIED_to_DISQUALIFIED / CONDITIONAL_to_DISQUALIFIED"
        actor: system
        preconditions:
          - "owning supplier transitioned to DISQUALIFIED in this request"
        side_effects:
          - "set reject_reason_code = SUPPLIER_DISQUALIFIED"
          - "increment supplier.blocked_lot_count via recomputation"
          - "increment ComponentLot.version by 1"
      - from: QUARANTINED
        to: BLOCKED
        trigger: "system cascade hop 1 of Supplier QUALIFIED_to_DISQUALIFIED / CONDITIONAL_to_DISQUALIFIED"
        actor: system
        preconditions:
          - "owning supplier transitioned to DISQUALIFIED in this request"
        side_effects:
          - "set reject_reason_code = SUPPLIER_DISQUALIFIED"
          - "increment ComponentLot.version by 1"
      - from: BLOCKED
        to: REJECTED
        trigger: "POST /mfg/component-lots/{id}/reject"
        actor: QualityInspector
        preconditions:
          - "status == BLOCKED"
        side_effects:
          - "overwrite reject_reason_code from the request"
          - "recompute supplier.blocked_lot_count (a REJECTED lot is no longer contained)"
          - "increment version by 1 on the lot and on the Supplier"
        note: "Rejecting a contained lot is the one-way disposition of containment; unblocking is the other. Either disposition drops the lot out of blocked_lot_count and so moves the supplier closer to the PENDING -> QUALIFIED gate."
      - from: BLOCKED
        to: RELEASED
        trigger: "POST /mfg/component-lots/{id}/unblock"
        actor: SupplierQualityManager
        preconditions:
          - "status == BLOCKED"
          - "supplier.qualification_status != DISQUALIFIED, i.e. IN {PENDING, QUALIFIED, CONDITIONAL} - a requalified-but-not-yet-rescored supplier is enough, which is what makes this transition reachable at all"
          - "supplier.qualified_until >= logical clock now, checked ONLY when qualification_status is QUALIFIED or CONDITIONAL (a PENDING supplier has a null qualified_until and the check is skipped)"
        side_effects:
          - "clear reject_reason_code"
          - "recompute supplier.blocked_lot_count"
          - "increment ComponentLot.version by 1"
        note: "Cycle: RELEASED -> BLOCKED -> RELEASED once the supplier has been requalified back to PENDING."
      - from: RELEASED
        to: CONSUMED
        trigger: "system, on the HeaterUnit COMPONENTS_STAGED_to_ASSEMBLED transition that draws the last remaining piece"
        actor: system
        preconditions:
          - "remaining_quantity reaches 0 after the assembling unit's draw"
        side_effects:
          - "increment ComponentLot.version by 1"
        note: "Bubble-up: the lot's own terminal state is derived from the unit population that references it."

  - entity: GlassLiningBatch
    initial_state: MIXED
    terminal_states: [QUARANTINED]
    transitions:
      - from: MIXED
        to: FIRED
        trigger: "POST /mfg/glass-lining-batches/{id}/fire"
        actor: PlantOperator
        preconditions:
          - "status == MIXED"
          - "logical clock now >= firing_end"
        side_effects:
          - "increment GlassLiningBatch.version by 1"
      - from: FIRED
        to: QUARANTINED
        trigger: "system cascade hop 3 of the LiningInspection FAIL side-effect chain"
        actor: system
        preconditions:
          - "rejected_lot_count >= BATCH_QUARANTINE_THRESHOLD (2) after the current increment"
        side_effects:
          - "set quarantine_reason_code = REPEAT_LINING_FAILURE"
          - "CASCADE HOP 4 (caused by this quarantine): every other TankLot with glass_lining_batch_id == this batch and status IN {LINED, LINING_VERIFIED, FOAMED}, in created_at ASC order, transitions to LINING_REJECTED with cascade_rejected = true, rework_count incremented, scrapped_quantity unchanged and last_scrap_quantity left null; these cascade-induced rejections do NOT increment rejected_lot_count, so the chain terminates"
          - "increment version by 1 on the batch and on every lot rejected in hop 4"

  - entity: TankLot
    initial_state: FAB_QUEUED
    terminal_states: [RELEASED, SCRAPPED]
    transitions:
      - from: FAB_QUEUED
        to: WELDED
        trigger: "POST /mfg/tank-lots/{id}/weld"
        actor: PlantOperator
        preconditions:
          - "status == FAB_QUEUED"
          - "product_model.release_status != WITHDRAWN"
        side_effects:
          - "set weld_operator_user_id = X-User-ID of the caller"
          - "increment TankLot.version by 1"
      - from: WELDED
        to: LINED
        trigger: "POST /mfg/tank-lots/{id}/apply-lining"
        actor: PlantOperator
        preconditions:
          - "status IN {WELDED, RELINE_QUEUED}"
          - "referenced GlassLiningBatch.status == FIRED"
        side_effects:
          - "set glass_lining_batch_id to the referenced batch"
          - "recompute batch.assigned_lot_count"
          - "set cascade_rejected = false"
          - "increment TankLot.version by 1"
      - from: RELINE_QUEUED
        to: LINED
        trigger: "POST /mfg/tank-lots/{id}/apply-lining"
        actor: PlantOperator
        preconditions:
          - "status == RELINE_QUEUED"
          - "referenced GlassLiningBatch.status == FIRED"
        side_effects:
          - "set glass_lining_batch_id to the referenced batch (may differ from the previous batch)"
          - "recompute assigned_lot_count on the new batch"
          - "set cascade_rejected = false"
          - "increment TankLot.version by 1"
        note: "Closes the rework cycle LINED -> LINING_REJECTED -> RELINE_QUEUED -> LINED."
      - from: LINED
        to: LINING_VERIFIED
        trigger: "system, on the POST /mfg/lining-inspections call that leaves a CURRENT PASS record for BOTH inspection types"
        actor: system
        preconditions:
          - "the lot has exactly one CURRENT LiningInspection of inspection_type ADHESION with result PASS"
          - "the lot has exactly one CURRENT LiningInspection of inspection_type HOLIDAY with result PASS"
        side_effects:
          - "increment TankLot.version by 1"
        note: "Compound: the lot's state is derived from the aggregate verdict of its CURRENT inspection records."
      - from: LINED
        to: LINING_REJECTED
        trigger: "POST /mfg/lining-inspections with a record whose computed result is FAIL"
        actor: QualityInspector
        preconditions:
          - "status == LINED"
          - "1 <= scrap_quantity <= wip_quantity"
        side_effects:
          - "CASCADE HOP 1: scrapped_quantity += scrap_quantity, wip_quantity -= scrap_quantity, last_scrap_quantity = scrap_quantity, rework_count += 1, cascade_rejected = false"
          - "CASCADE HOP 2 (caused by hop 1): the lot's GlassLiningBatch.rejected_lot_count += 1"
          - "CASCADE HOP 3 (caused by hop 2): if the batch's rejected_lot_count now >= BATCH_QUARANTINE_THRESHOLD (2) the batch transitions FIRED -> QUARANTINED"
          - "CASCADE HOP 4 (caused by hop 3): the batch's other LINED / LINING_VERIFIED / FOAMED lots transition to LINING_REJECTED with cascade_rejected = true"
          - "increment version by 1 on every entity mutated by hops 1-4"
      - from: LINING_VERIFIED
        to: LINING_REJECTED
        trigger: "system cascade hop 4 of the GlassLiningBatch FIRED_to_QUARANTINED transition"
        actor: system
        preconditions:
          - "the lot's glass_lining_batch_id equals the batch quarantined in this request"
        side_effects:
          - "rework_count += 1, cascade_rejected = true, scrapped_quantity and wip_quantity unchanged, last_scrap_quantity left null"
          - "increment TankLot.version by 1"
      - from: FOAMED
        to: LINING_REJECTED
        trigger: "system cascade hop 4 of the GlassLiningBatch FIRED_to_QUARANTINED transition"
        actor: system
        preconditions:
          - "the lot's glass_lining_batch_id equals the batch quarantined in this request"
        side_effects:
          - "rework_count += 1, cascade_rejected = true"
          - "increment TankLot.version by 1"
      - from: LINING_REJECTED
        to: RELINE_QUEUED
        trigger: "POST /mfg/tank-lots/{id}/authorize-reline"
        actor: PlantOperator
        preconditions:
          - "status == LINING_REJECTED"
          - "rework_count < MAX_REWORK_CYCLES (2)"
          - "wip_quantity >= 1"
        side_effects:
          - "clear last_scrap_quantity"
          - "increment TankLot.version by 1"
      - from: LINING_REJECTED
        to: LINED
        trigger: "POST /mfg/tank-lots/{id}/rework-reversal"
        actor: QualityInspector
        preconditions:
          - "status == LINING_REJECTED"
          - "cascade_rejected == false"
          - "last_scrap_quantity is not null"
          - "the lot's GlassLiningBatch.status == FIRED"
        side_effects:
          - "COMPENSATION: wip_quantity += last_scrap_quantity, scrapped_quantity -= last_scrap_quantity, last_scrap_quantity = null, rework_count -= 1"
          - "the CURRENT FAIL LiningInspection record of the lot keeps record_status CURRENT but the lot returns to LINED; the lot's GlassLiningBatch.rejected_lot_count -= 1"
          - "increment version by 1 on the lot and on the batch"
        note: "Exact inverse of the LINED_to_LINING_REJECTED hop 1 and hop 2; calculations.tank_lot_quantity_ledger must be unchanged end to end."
      - from: LINING_REJECTED
        to: SCRAPPED
        trigger: "POST /mfg/tank-lots/{id}/scrap"
        actor: QualityInspector
        preconditions:
          - "status == LINING_REJECTED"
        side_effects:
          - "scrapped_quantity += wip_quantity, wip_quantity = 0, good_quantity unchanged"
          - "increment TankLot.version by 1"
      - from: LINING_VERIFIED
        to: FOAMED
        trigger: "POST /mfg/tank-lots/{id}/foam"
        actor: PlantOperator
        preconditions:
          - "status == LINING_VERIFIED"
          - "foam_thickness_mm >= MIN_FOAM_THICKNESS_MM (40)"
          - "round_half_up(foam_thickness_mm * R_VALUE_PER_MM, 1) >= product_model.insulation_r_value"
        side_effects:
          - "set foam_density_kg_m3, foam_thickness_mm and the computed achieved_r_value"
          - "increment TankLot.version by 1"
      - from: FOAMED
        to: JACKETED
        trigger: "POST /mfg/tank-lots/{id}/jacket"
        actor: PlantOperator
        preconditions:
          - "status == FOAMED"
        side_effects:
          - "increment TankLot.version by 1"
      - from: JACKETED
        to: RELEASED
        trigger: "POST /mfg/tank-lots/{id}/release"
        actor: PlantOperator
        preconditions:
          - "status == JACKETED"
          - "wip_quantity >= 1"
        side_effects:
          - "good_quantity = wip_quantity, wip_quantity = 0 (calculations.tank_lot_quantity_ledger stays balanced)"
          - "increment TankLot.version by 1"

  - entity: EfficiencyTest
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /mfg/efficiency-tests/{id}/record-result"
        actor: QualityInspector
        preconditions:
          - "status == SCHEDULED"
          - "logical clock now >= window_end"
          - "computed margin >= 0"
        side_effects:
          - "set measured_value, effective_minimum, margin, recorded_at"
          - "if the model's certification_status == UNCERTIFIED it transitions to TEST_PENDING"
          - "increment EfficiencyTest.version by 1"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /mfg/efficiency-tests/{id}/record-result"
        actor: QualityInspector
        preconditions:
          - "status == SCHEDULED"
          - "logical clock now >= window_end"
          - "computed margin < 0"
        side_effects:
          - "set measured_value, effective_minimum, margin, recorded_at"
          - "if the model's certification_status == UNCERTIFIED it transitions to TEST_PENDING"
          - "increment EfficiencyTest.version by 1"
        note: "Branching: identical trigger, divergent target state and divergent effect on certification eligibility."
      - from: SCHEDULED
        to: VOIDED
        trigger: "system cascade hop 4 of RatingCertification APPROVED_to_REVOKED"
        actor: system
        preconditions:
          - "the test's product_model transitioned to DECERTIFIED in this request"
        side_effects:
          - "increment EfficiencyTest.version by 1"

  - entity: RatingCertification
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, REVOKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /mfg/rating-certifications/{id}/submit"
        actor: ComplianceEngineer
        preconditions:
          - "status IN {DRAFT, REJECTED}"
          - "the model has >= MIN_UEF_SAMPLE_TESTS (3) PASSED UEF EfficiencyTest rows"
          - "the model has >= 1 PASSED FIRST_HOUR_RATING EfficiencyTest row"
          - "the model has >= 1 PASSED RECOVERY EfficiencyTest row"
        side_effects:
          - "set certified_uef, certified_fhr, certified_recovery and uef_test_count from calculations.certified_rating_rounding"
          - "set submitted_by_user_id = X-User-ID of the caller"
          - "increment RatingCertification.version by 1"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /mfg/rating-certifications/{id}/submit"
        actor: ComplianceEngineer
        preconditions:
          - "status == REJECTED"
          - "the same three sample-count preconditions re-evaluated against the model's CURRENT PASSED tests"
        side_effects:
          - "recompute certified_uef, certified_fhr, certified_recovery, uef_test_count"
          - "overwrite submitted_by_user_id with the resubmitting caller's X-User-ID, clear reason_code"
          - "increment RatingCertification.version by 1"
        note: "Revision loop SUBMITTED -> REJECTED -> SUBMITTED; the submitter may change between rounds, which moves the segregation-of-duties target."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /mfg/rating-certifications/{id}/approve"
        actor: CertificationApprover
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID of the caller != submitted_by_user_id"
        side_effects:
          - "set approved_by_user_id, effective_date = logical clock now, label_serial_prefix = model.model_code"
          - "the ProductModel's certification_status transitions UNCERTIFIED/TEST_PENDING/SUSPENDED -> CERTIFIED and uef_rated, fhr_rated, recovery_rate_rated, label_serial_prefix are copied onto the model"
          - "increment version by 1 on the certification and on the ProductModel"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /mfg/rating-certifications/{id}/reject"
        actor: CertificationApprover
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID of the caller != submitted_by_user_id"
        side_effects:
          - "set reason_code from the request"
          - "the ProductModel's certification_status returns to TEST_PENDING when it was UNCERTIFIED or TEST_PENDING; a CERTIFIED or SUSPENDED model is left untouched"
          - "increment version by 1 on the certification and, when changed, on the ProductModel"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system, on POST /mfg/rating-certifications creating a newer certification for the same model"
        actor: system
        preconditions:
          - "a new RatingCertification row for the same product_model_id is accepted in this request"
        side_effects:
          - "increment RatingCertification.version by 1"
      - from: REJECTED
        to: SUPERSEDED
        trigger: "system, on POST /mfg/rating-certifications creating a newer certification for the same model"
        actor: system
        preconditions:
          - "a new RatingCertification row for the same product_model_id is accepted in this request"
        side_effects:
          - "increment RatingCertification.version by 1"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /mfg/rating-certifications/{id}/revoke"
        actor: CertificationApprover
        preconditions:
          - "status == APPROVED"
        side_effects:
          - "set reason_code"
          - "CASCADE HOP 1: the ProductModel's certification_status transitions to DECERTIFIED and uef_rated, fhr_rated, recovery_rate_rated, label_serial_prefix are cleared"
          - "CASCADE HOP 2 (caused by hop 1): every HeaterUnit of that model with build_status IN {ASSEMBLED, LABELED}, in created_at ASC order, transitions to HELD with hold_reason_code = MODEL_DECERTIFIED; units that were LABELED additionally get label_status = INVALID"
          - "CASCADE HOP 3 (caused by hop 2): the ProductModel recomputes held_unit_count and, when release_status == RELEASED, transitions to RESTRICTED"
          - "CASCADE HOP 4 (caused by hop 1): every SCHEDULED EfficiencyTest of that model transitions to VOIDED"
          - "increment version by 1 on every entity mutated by hops 1-4"

  - entity: ProductModel
    initial_state: "UNCERTIFIED x DRAFT"
    terminal_states: ["DECERTIFIED (certification dimension)", "WITHDRAWN (release dimension)"]
    note: |
      PARALLEL STATE DIMENSIONS on one row. Dimension A is certification_status
      (UNCERTIFIED -> TEST_PENDING -> CERTIFIED <-> SUSPENDED -> DECERTIFIED).
      Dimension B is release_status (DRAFT -> RELEASED <-> RESTRICTED ->
      WITHDRAWN). Neither dimension gates the other's transitions: a model may
      be RELEASED while still UNCERTIFIED, and CERTIFIED while still DRAFT. The
      two dimensions are only read together by the HeaterUnit
      ASSEMBLED_to_LABELED precondition, which demands CERTIFIED and RELEASED
      simultaneously.
    transitions:
      - from: UNCERTIFIED
        to: TEST_PENDING
        trigger: "system, on the first POST /mfg/efficiency-tests/{id}/record-result for this model"
        actor: system
        preconditions:
          - "certification_status == UNCERTIFIED"
        side_effects:
          - "increment ProductModel.version by 1"
      - from: TEST_PENDING
        to: CERTIFIED
        trigger: "POST /mfg/rating-certifications/{id}/approve"
        actor: CertificationApprover
        preconditions:
          - "the approved certification's product_model_id == this model"
        side_effects:
          - "copy certified_uef -> uef_rated, certified_fhr -> fhr_rated, certified_recovery -> recovery_rate_rated, model_code -> label_serial_prefix"
          - "increment ProductModel.version by 1"
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /mfg/product-models/{id}/suspend-certification"
        actor: CertificationApprover
        preconditions:
          - "certification_status == CERTIFIED"
        side_effects:
          - "uef_rated, fhr_rated, recovery_rate_rated and label_serial_prefix are retained (a suspension does not erase the published rating)"
          - "increment ProductModel.version by 1"
        note: "release_status is deliberately untouched - the dimensions are independent."
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /mfg/rating-certifications/{id}/approve on a newer certification for the same model"
        actor: CertificationApprover
        preconditions:
          - "certification_status == SUSPENDED"
        side_effects:
          - "overwrite uef_rated, fhr_rated, recovery_rate_rated from the newly approved certification"
          - "increment ProductModel.version by 1"
        note: "Cycle CERTIFIED -> SUSPENDED -> CERTIFIED."
      - from: CERTIFIED
        to: DECERTIFIED
        trigger: "POST /mfg/rating-certifications/{id}/revoke (cascade hop 1)"
        actor: system
        preconditions:
          - "the revoked certification's product_model_id == this model"
        side_effects:
          - "clear uef_rated, fhr_rated, recovery_rate_rated, label_serial_prefix"
          - "hops 2-4 of the revoke cascade fire from here"
          - "increment ProductModel.version by 1"
      - from: SUSPENDED
        to: DECERTIFIED
        trigger: "POST /mfg/rating-certifications/{id}/revoke (cascade hop 1)"
        actor: system
        preconditions:
          - "the revoked certification's product_model_id == this model"
        side_effects:
          - "identical to CERTIFIED_to_DECERTIFIED"
          - "increment ProductModel.version by 1"
      - from: DRAFT
        to: RELEASED
        trigger: "POST /mfg/product-models/{id}/release-to-channel"
        actor: ComplianceEngineer
        preconditions:
          - "release_status == DRAFT"
          - "for a private-label variant, base_model.release_status IN {RELEASED, RESTRICTED}"
        side_effects:
          - "increment ProductModel.version by 1"
        note: "Cross-entity guard on the self-referential base model."
      - from: RELEASED
        to: RESTRICTED
        trigger: "system cascade hop 3 of Supplier disqualification or of RatingCertification APPROVED_to_REVOKED"
        actor: system
        preconditions:
          - "held_unit_count > 0 after the recomputation triggered by the units held earlier in this request"
        side_effects:
          - "increment ProductModel.version by 1"
      - from: RESTRICTED
        to: RELEASED
        trigger: "POST /mfg/product-models/{id}/lift-restriction"
        actor: PlantAdmin
        preconditions:
          - "release_status == RESTRICTED"
          - "held_unit_count == 0"
        side_effects:
          - "increment ProductModel.version by 1"
        note: "Cycle RELEASED -> RESTRICTED -> RELEASED."
      - from: RELEASED
        to: WITHDRAWN
        trigger: "POST /mfg/product-models/{id}/withdraw"
        actor: ComplianceEngineer
        preconditions:
          - "release_status IN {RELEASED, RESTRICTED}"
        side_effects:
          - "every private-label ProductModel whose base_model_id == this model and whose release_status IN {RELEASED, RESTRICTED} also transitions to WITHDRAWN, in created_at ASC order"
          - "increment version by 1 on this model and on each withdrawn variant"
      - from: RESTRICTED
        to: WITHDRAWN
        trigger: "POST /mfg/product-models/{id}/withdraw"
        actor: ComplianceEngineer
        preconditions:
          - "release_status IN {RELEASED, RESTRICTED}"
        side_effects:
          - "identical variant withdrawal fan-out"
          - "increment ProductModel.version by 1"

  - entity: HeaterUnit
    initial_state: COMPONENTS_STAGED
    terminal_states: [SCRAPPED]
    transitions:
      - from: COMPONENTS_STAGED
        to: ASSEMBLED
        trigger: "POST /mfg/heater-units/{id}/assemble"
        actor: PlantOperator
        preconditions:
          - "build_status == COMPONENTS_STAGED"
          - "tank_lot.status == RELEASED"
          - "every referenced ComponentLot.status == RELEASED"
          - "every referenced ComponentLot.remaining_quantity >= 1"
          - "every referenced lot's supplier.qualification_status IN {QUALIFIED, CONDITIONAL} and supplier.qualified_until >= logical clock now"
        side_effects:
          - "each referenced ComponentLot recomputes consumed_quantity and remaining_quantity; a lot whose remaining_quantity reaches 0 transitions RELEASED -> CONSUMED"
          - "increment version by 1 on the unit and on each referenced ComponentLot"
      - from: ASSEMBLED
        to: LABELED
        trigger: "POST /mfg/heater-units/{id}/label"
        actor: PlantOperator
        preconditions:
          - "build_status == ASSEMBLED"
          - "product_model.certification_status == CERTIFIED"
          - "product_model.release_status == RELEASED"
        side_effects:
          - "mint serial_number per calculations.unit_serial_assignment, set label_status = APPLIED"
          - "increment HeaterUnit.version by 1"
        note: "Reads BOTH parallel dimensions of the ProductModel simultaneously."
      - from: LABELED
        to: SHIPPED
        trigger: "POST /mfg/heater-units/{id}/ship"
        actor: PlantOperator
        preconditions:
          - "build_status == LABELED"
          - "label_status == APPLIED"
          - "product_model.release_status == RELEASED"
        side_effects:
          - "set shipped_at = logical clock now, install_water_hardness_gpg from the request, and the computed water_hardness_band / hardness_factor"
          - "the ProductModel accrues WARRANTY_ACCRUAL_CENTS_PER_UNIT[fuel_type] into warranty_reserve_accrued_cents and warranty_reserve_balance_cents per calculations.warranty_reserve_ledger"
          - "increment version by 1 on the unit and on the ProductModel"
      - from: ASSEMBLED
        to: HELD
        trigger: "system cascade hop 2 of Supplier disqualification or of RatingCertification APPROVED_to_REVOKED"
        actor: system
        preconditions:
          - "one of the unit's ComponentLots was blocked earlier in this request, or the unit's model was decertified earlier in this request"
        side_effects:
          - "set held_from_status = ASSEMBLED and hold_reason_code"
          - "increment HeaterUnit.version by 1"
      - from: LABELED
        to: HELD
        trigger: "system cascade hop 2 of Supplier disqualification, of RatingCertification APPROVED_to_REVOKED, or of RecallCampaign SCOPED_to_ANNOUNCED"
        actor: system
        preconditions:
          - "the unit is implicated by the triggering cascade"
        side_effects:
          - "set held_from_status = LABELED, hold_reason_code, and label_status = INVALID when the cause is decertification"
          - "increment HeaterUnit.version by 1"
      - from: COMPONENTS_STAGED
        to: HELD
        trigger: "system cascade hop 2 of Supplier disqualification"
        actor: system
        preconditions:
          - "one of the unit's ComponentLots was blocked earlier in this request"
        side_effects:
          - "set hold_reason_code = COMPONENT_LOT_BLOCKED; held_from_status stays null because COMPONENTS_STAGED is the pre-hold state and release-hold restores it by default"
          - "increment HeaterUnit.version by 1"
      - from: HELD
        to: ASSEMBLED
        trigger: "POST /mfg/heater-units/{id}/release-hold"
        actor: PlantOperator
        preconditions:
          - "build_status == HELD"
          - "held_from_status == ASSEMBLED"
          - "every referenced ComponentLot.status == RELEASED"
          - "product_model.certification_status != DECERTIFIED"
        side_effects:
          - "clear hold_reason_code and held_from_status; the owning ProductModel recomputes held_unit_count"
          - "increment version by 1 on the unit and on the ProductModel"
      - from: HELD
        to: LABELED
        trigger: "POST /mfg/heater-units/{id}/release-hold"
        actor: PlantOperator
        preconditions:
          - "build_status == HELD"
          - "held_from_status == LABELED"
          - "label_status == APPLIED (a unit whose label was invalidated cannot be restored to LABELED)"
          - "product_model.certification_status != DECERTIFIED"
        side_effects:
          - "clear hold_reason_code and held_from_status; the owning ProductModel recomputes held_unit_count"
          - "increment version by 1 on the unit and on the ProductModel"
      - from: HELD
        to: COMPONENTS_STAGED
        trigger: "POST /mfg/heater-units/{id}/release-hold"
        actor: PlantOperator
        preconditions:
          - "build_status == HELD"
          - "held_from_status is null"
          - "every referenced ComponentLot.status == RELEASED"
        side_effects:
          - "clear hold_reason_code; the owning ProductModel recomputes held_unit_count"
          - "increment version by 1 on the unit and on the ProductModel"
      - from: COMPONENTS_STAGED
        to: SCRAPPED
        trigger: "POST /mfg/heater-units/{id}/disassemble"
        actor: PlantOperator
        preconditions:
          - "build_status IN {COMPONENTS_STAGED, ASSEMBLED, HELD}"
        side_effects:
          - "COMPENSATION: each referenced ComponentLot recomputes consumed_quantity and remaining_quantity, returning the drawn pieces; a lot in CONSUMED whose remaining_quantity becomes >= 1 is NOT resurrected and stays CONSUMED"
          - "set hold_reason_code from the request reason_code"
          - "increment version by 1 on the unit and on each referenced ComponentLot"
      - from: ASSEMBLED
        to: SCRAPPED
        trigger: "POST /mfg/heater-units/{id}/disassemble"
        actor: PlantOperator
        preconditions:
          - "build_status IN {COMPONENTS_STAGED, ASSEMBLED, HELD}"
        side_effects:
          - "identical compensation as COMPONENTS_STAGED_to_SCRAPPED; calculations.component_lot_quantity_ledger must be unchanged end to end"
          - "increment version by 1 on the unit and on each referenced ComponentLot"
      - from: HELD
        to: SCRAPPED
        trigger: "POST /mfg/heater-units/{id}/disassemble"
        actor: PlantOperator
        preconditions:
          - "build_status == HELD"
        side_effects:
          - "identical compensation; the owning ProductModel recomputes held_unit_count and, at held_unit_count == 0, remains RESTRICTED until lift-restriction is called"
          - "increment version by 1 on the unit, on each referenced ComponentLot and on the ProductModel"

  - entity: WarrantyClaim
    initial_state: OPEN
    terminal_states: [DENIED]
    transitions:
      - from: OPEN
        to: VALIDATED
        trigger: "POST /mfg/warranty-claims/{id}/validate"
        actor: WarrantyAnalyst
        preconditions:
          - "status == OPEN"
          - "computed coverage_pct > 0"
        side_effects:
          - "set coverage_pct and approved_payout_cents from calculations.warranty_payout_proration"
          - "increment WarrantyClaim.version by 1"
      - from: OPEN
        to: DENIED
        trigger: "POST /mfg/warranty-claims/{id}/deny"
        actor: WarrantyAnalyst
        preconditions:
          - "status == OPEN"
        side_effects:
          - "set reason_code, coverage_pct = 0.00 and approved_payout_cents = 0"
          - "increment WarrantyClaim.version by 1"
      - from: VALIDATED
        to: PAID
        trigger: "POST /mfg/warranty-claims/{id}/pay"
        actor: WarrantyAnalyst
        preconditions:
          - "status == VALIDATED"
          - "approved_payout_cents <= product_model.warranty_reserve_balance_cents"
        side_effects:
          - "set paid_at = logical clock now"
          - "the unit's ProductModel adds approved_payout_cents to warranty_paid_cents and subtracts it from warranty_reserve_balance_cents; warranty_reserve_accrued_cents is untouched"
          - "increment version by 1 on the claim and on the ProductModel"
      - from: PAID
        to: VALIDATED
        trigger: "POST /mfg/warranty-claims/{id}/reverse-payment"
        actor: WarrantyAnalyst
        preconditions:
          - "status == PAID"
        side_effects:
          - "COMPENSATION: clear paid_at, set reason_code; the ProductModel subtracts approved_payout_cents from warranty_paid_cents and adds it back to warranty_reserve_balance_cents"
          - "increment version by 1 on the claim and on the ProductModel"
        note: "Cycle VALIDATED -> PAID -> VALIDATED; calculations.warranty_reserve_ledger invariant must be unchanged end to end."

  - entity: RecallCampaign
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCOPED
        trigger: "POST /mfg/recall-campaigns/{id}/scope"
        actor: WarrantyAnalyst
        preconditions:
          - "status == DRAFT"
          - "serial_range_start <= serial_range_end under ASCII lexicographic ordering"
          - "calculations.recall_scope_resolution yields affected_unit_count >= 1"
        side_effects:
          - "set serial_range_start, serial_range_end, affected_unit_count"
          - "set per_unit_remedy_cost_cents from calculations.recall_remedy_cost and estimated_remedy_cost_cents = affected_unit_count * per_unit_remedy_cost_cents"
          - "increment RecallCampaign.version by 1"
      - from: SCOPED
        to: ANNOUNCED
        trigger: "POST /mfg/recall-campaigns/{id}/announce"
        actor: WarrantyAnalyst
        preconditions:
          - "status == SCOPED"
          - "estimated_remedy_cost_cents <= budget_cents"
        side_effects:
          - "FAN-OUT: one RecallNotice in PENDING is created for every affected unit whose build_status == SHIPPED, in unit created_at ASC order, each carrying remedy_cost_cents = per_unit_remedy_cost_cents"
          - "CASCADE: every affected unit whose build_status IN {ASSEMBLED, LABELED} transitions to HELD with hold_reason_code = RECALL_SCOPE and receives NO notice; the owning ProductModel then recomputes held_unit_count and, when RELEASED, transitions to RESTRICTED"
          - "recompute notice_count, remedied_count, completion_pct_notice_based, completion_pct_population_based"
          - "increment version by 1 on the campaign and on every entity mutated"
        note: "notice_count < affected_unit_count whenever some affected units never shipped - this is exactly what makes the two completion variants diverge."
      - from: ANNOUNCED
        to: IN_REMEDY
        trigger: "system, on the first POST /mfg/recall-notices/{id}/remedy for this campaign"
        actor: system
        preconditions:
          - "status == ANNOUNCED and remedied_count becomes >= 1"
        side_effects:
          - "increment RecallCampaign.version by 1"
      - from: IN_REMEDY
        to: CLOSED
        trigger: "POST /mfg/recall-campaigns/{id}/close"
        actor: WarrantyAnalyst
        preconditions:
          - "status == IN_REMEDY"
          - "completion_pct_population_based >= CLOSE_COMPLETION_THRESHOLD_PCT (80.00)"
          - "no unit in the campaign's population is still in build_status HELD"
        side_effects:
          - "increment RecallCampaign.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /mfg/recall-campaigns/{id}/cancel"
        actor: WarrantyAnalyst
        preconditions:
          - "status IN {DRAFT, SCOPED}"
        side_effects:
          - "set reason_code"
          - "increment RecallCampaign.version by 1"
      - from: SCOPED
        to: CANCELLED
        trigger: "POST /mfg/recall-campaigns/{id}/cancel"
        actor: WarrantyAnalyst
        preconditions:
          - "status IN {DRAFT, SCOPED}"
        side_effects:
          - "set reason_code; affected_unit_count and estimated_remedy_cost_cents are retained as the cancelled scope snapshot"
          - "increment RecallCampaign.version by 1"

  - entity: RecallNotice
    initial_state: PENDING
    terminal_states: [REMEDIED, UNREACHABLE]
    transitions:
      - from: PENDING
        to: NOTIFIED
        trigger: "POST /mfg/recall-notices/{id}/notify"
        actor: WarrantyAnalyst
        preconditions:
          - "status == PENDING"
          - "recall_campaign.status IN {ANNOUNCED, IN_REMEDY}"
        side_effects:
          - "set notified_at = logical clock now"
          - "increment RecallNotice.version by 1"
      - from: NOTIFIED
        to: REMEDIED
        trigger: "POST /mfg/recall-notices/{id}/remedy"
        actor: WarrantyAnalyst
        preconditions:
          - "status == NOTIFIED"
          - "recall_campaign.status IN {ANNOUNCED, IN_REMEDY}"
        side_effects:
          - "set remedied_at = logical clock now"
          - "BUBBLE UP: the campaign recomputes remedied_count, completion_pct_notice_based and completion_pct_population_based, and transitions ANNOUNCED -> IN_REMEDY on the first remedy"
          - "increment version by 1 on the notice and on the campaign"
      - from: NOTIFIED
        to: UNREACHABLE
        trigger: "POST /mfg/recall-notices/{id}/mark-unreachable"
        actor: WarrantyAnalyst
        preconditions:
          - "status IN {PENDING, NOTIFIED}"
        side_effects:
          - "set reason_code; the campaign recomputes both completion percentages (an UNREACHABLE notice stays in the notice_based denominator)"
          - "increment version by 1 on the notice and on the campaign"
      - from: PENDING
        to: UNREACHABLE
        trigger: "POST /mfg/recall-notices/{id}/mark-unreachable"
        actor: WarrantyAnalyst
        preconditions:
          - "status IN {PENDING, NOTIFIED}"
        side_effects:
          - "set reason_code; the campaign recomputes both completion percentages"
          - "increment version by 1 on the notice and on the campaign"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` — the only sanctioned
#         write-write conflict mechanism)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: cert-create-stale-model
    parent_entity: ProductModel
    write_endpoint: "POST /mfg/rating-certifications"
    occ_field: "expected_product_model_version"
    description: |
      Creating a RatingCertification against a ProductModel whose version has
      advanced since the client last observed it is rejected. A new
      certification legitimately supersedes any DRAFT or REJECTED certification
      on the same model, so a second creation is not blocked by any state
      precondition; the stale-version check is what stops a compliance engineer
      from superseding a draft they never saw.
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412

  - rule_id: lining-inspection-stale-lot
    parent_entity: TankLot
    write_endpoint: "POST /mfg/lining-inspections"
    occ_field: "expected_tank_lot_version"
    description: |
      Filing a LiningInspection against a TankLot whose version has advanced
      since the client last observed it is rejected. Re-inspection of the same
      inspection_type is legitimate and supersedes the previous CURRENT record,
      so a second filing is not blocked by any state precondition; the
      stale-version check is what stops an inspector from superseding a record
      or a scrap decision they never saw.
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------
calculations:

  - name: supplier_qualification_score
    trigger: "POST /mfg/suppliers/{id}/qualify — writes Supplier.qualification_score and selects the QUALIFIED / CONDITIONAL branch"
    algorithm: weighted_scoring
    formula: |
      audit_component = audit_score                                  # 0..100, from the request
      ppm_component   = max(0, 100 - defect_ppm / PPM_DIVISOR)       # PPM_DIVISOR = 50
      capa_component  = max(0, 100 - open_capa_count * CAPA_PENALTY) # CAPA_PENALTY = 12.5
      qualification_score = round_half_up(
            AUDIT_WEIGHT * audit_component
          + PPM_WEIGHT   * ppm_component
          + CAPA_WEIGHT  * capa_component, 2)
      # Band selection uses the ROUNDED score, never the unrounded sum:
      if qualification_score >= QUALIFIED_SCORE_FLOOR     -> QUALIFIED
      elif qualification_score >= CONDITIONAL_SCORE_FLOOR -> CONDITIONAL
      else                                                -> reject with ERR_SUPPLIER_SCORE_BELOW_FLOOR
    input_set: "the three request values only; historical scores are not averaged in"
    constants:
      AUDIT_WEIGHT: 0.40
      PPM_WEIGHT: 0.35
      CAPA_WEIGHT: 0.25
      PPM_DIVISOR: 50
      CAPA_PENALTY: 12.5
      QUALIFIED_SCORE_FLOOR: 85.00
      CONDITIONAL_SCORE_FLOOR: 70.00
    precision: "2 decimal places, round_half_up; band comparison is >= on the rounded value"

  - name: component_lot_quantity_ledger
    trigger: "recomputed on ComponentLot read, and on the HeaterUnit assemble and disassemble transitions"
    algorithm: aggregation
    formula: |
      consumed_quantity = count of HeaterUnit rows where
            (gas_control_lot_id == lot.id OR safety_valve_lot_id == lot.id)
        AND build_status IN {ASSEMBLED, LABELED, SHIPPED, HELD}
      remaining_quantity = quantity - consumed_quantity
      INVARIANT: quantity == remaining_quantity + consumed_quantity  (always, for every lot)
    input_set: "units in ASSEMBLED, LABELED, SHIPPED or HELD draw pieces; COMPONENTS_STAGED units have not drawn yet and SCRAPPED units have returned theirs"
    constants: {}
    precision: "integer pieces; no rounding"

  - name: tank_lot_quantity_ledger
    trigger: "TankLot creation, every lining rejection, rework-reversal, scrap and release"
    algorithm: aggregation
    formula: |
      at creation:  wip_quantity = planned_quantity ; good_quantity = 0 ; scrapped_quantity = 0
      on direct lining FAIL:   wip -= scrap_quantity ; scrapped += scrap_quantity
      on rework-reversal:      wip += last_scrap_quantity ; scrapped -= last_scrap_quantity
      on cascade rejection:    wip and scrapped unchanged
      on scrap:                scrapped += wip ; wip = 0
      on release:              good = wip ; wip = 0
      INVARIANT: planned_quantity == wip_quantity + good_quantity + scrapped_quantity  (before and after every transition)
    input_set: "the lot's own three counters only; HeaterUnit rows never mutate them"
    constants: {}
    precision: "integer tanks; no rounding"

  - name: lot_holiday_density
    trigger: "POST /mfg/lining-inspections — writes LiningInspection.holidays_per_tank and result"
    algorithm: threshold
    formula: |
      required_sample_size = max(MIN_SAMPLE_SIZE, ceil(tank_lot.planned_quantity * SAMPLE_RATE))
      # sample_size < required_sample_size  ->  ERR_SAMPLE_SIZE_INSUFFICIENT (never a FAIL verdict)
      if inspection_type == HOLIDAY:
          holidays_per_tank = round_half_up(holiday_count / sample_size, 4)
          result = FAIL if holidays_per_tank > MAX_HOLIDAYS_PER_TANK else PASS
      if inspection_type == ADHESION:
          holidays_per_tank = null
          result = FAIL if adhesion_class > MAX_ADHESION_CLASS else PASS
    input_set: "the single inspection record under evaluation; prior SUPERSEDED records do not contribute"
    constants:
      MIN_SAMPLE_SIZE: 3
      SAMPLE_RATE: 0.05
      MAX_HOLIDAYS_PER_TANK: 0.50
      MAX_ADHESION_CLASS: 2
    precision: "holidays_per_tank at 4 decimal places, round_half_up; the FAIL test is strictly greater than 0.50, so exactly 0.5000 PASSES"

  - name: insulation_r_value_achieved
    trigger: "POST /mfg/tank-lots/{id}/foam — writes TankLot.achieved_r_value and gates the LINING_VERIFIED -> FOAMED transition"
    algorithm: threshold
    formula: |
      # The thickness floor is checked FIRST (validations priority 35), so a lot
      # foamed below 40 mm reports the thickness error even though it also fails
      # the R-value comparison below.
      achieved_r_value = round_half_up(foam_thickness_mm * R_VALUE_PER_MM, 1)
      if achieved_r_value < product_model.insulation_r_value:
          -> ERR_INSULATION_R_VALUE_SHORTFALL   # validations priority 36
      # foam_density_kg_m3 is recorded verbatim and never enters this formula.
    input_set: "the foam call's own foam_thickness_mm plus the owning ProductModel's declared insulation_r_value"
    constants:
      R_VALUE_PER_MM: 0.4
      MIN_FOAM_THICKNESS_MM: 40
    precision: "achieved_r_value at 1 decimal place, round_half_up; the comparison is >=, so exactly meeting the declared R-value passes"

  - name: uef_compliance_margin
    trigger: "POST /mfg/efficiency-tests/{id}/record-result when test_type == UEF — writes EfficiencyTest.effective_minimum and margin"
    algorithm: threshold
    formula: |
      # STEP 1 - capacity tier (conditional branch on the model)
      tier = "small" if product_model.nominal_capacity_gallons <= SMALL_CAPACITY_MAX_GALLONS else "large"
      # STEP 2 - tiered-rate selection keyed on BOTH fuel_type and tier
      base_min = FEDERAL_MIN_UEF[product_model.fuel_type][tier]
      # STEP 3 - non-linear sample derate (min() clamp on the sample size)
      derate = SAMPLE_DERATE[min(sample_size, 3)]
      # STEP 4 - insulation credit, a max() floor inside a min() ceiling
      credit = min(R_VALUE_CREDIT_MAX,
                   max(0, product_model.insulation_r_value - R_VALUE_CREDIT_BASE) * R_VALUE_CREDIT_PER_POINT)
      # STEP 5 - the floor and the margin, in this order; never re-derate after crediting
      effective_minimum = round_half_up(base_min + derate - credit, 4)
      margin            = round_half_up(measured_value - effective_minimum, 4)
      status = PASSED if margin >= 0 else FAILED
    input_set: "one EfficiencyTest row plus its ProductModel's fuel_type, nominal_capacity_gallons and insulation_r_value"
    constants:
      SMALL_CAPACITY_MAX_GALLONS: 55
      FEDERAL_MIN_UEF:
        GAS: { small: 0.58, large: 0.55 }
        ELECTRIC: { small: 0.92, large: 1.90 }
        HEAT_PUMP: { small: 2.20, large: 2.90 }
      SAMPLE_DERATE: { 1: 0.02, 2: 0.01, 3: 0.00 }
      R_VALUE_CREDIT_BASE: 16
      R_VALUE_CREDIT_PER_POINT: 0.005
      R_VALUE_CREDIT_MAX: 0.03
    precision: "4 decimal places, round_half_up; PASSED at margin exactly 0.0000"

  - name: rating_floor_check
    trigger: "POST /mfg/efficiency-tests/{id}/record-result when test_type IN {FIRST_HOUR_RATING, RECOVERY}"
    algorithm: threshold
    formula: |
      effective_minimum = RATING_FLOOR[test_type]
      margin            = round_half_up(measured_value - effective_minimum, 4)
      status = PASSED if margin >= 0 else FAILED
    input_set: "one EfficiencyTest row; the model's fuel_type and capacity are NOT consulted for these two test types"
    constants:
      RATING_FLOOR: { FIRST_HOUR_RATING: 30.0, RECOVERY: 10.0 }
    precision: "4 decimal places, round_half_up"

  - name: certified_rating_rounding
    trigger: "POST /mfg/rating-certifications/{id}/submit — writes certified_uef, certified_fhr, certified_recovery, uef_test_count"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: round EACH test first, then average the rounded
      # values, then round the average. Averaging the raw measured_values and
      # rounding once at the end is FORBIDDEN and produces different published
      # ratings (e.g. UEF 0.585 / 0.585 / 0.584 -> 0.59 under this order,
      # 0.58 under the forbidden order).
      uef_tests = EfficiencyTest rows with product_model_id == model
                  AND test_type == UEF AND status == PASSED,
                  ordered by created_at ASC (order does not affect the mean)
      uef_test_count = count(uef_tests)
      certified_uef  = round_half_up( sum(round_half_up(t.measured_value, 2) for t in uef_tests)
                                      / uef_test_count, 2)
      fhr_tests = same filter with test_type == FIRST_HOUR_RATING
      certified_fhr = round_half_up( sum(round_half_up(t.measured_value, 0) for t in fhr_tests)
                                     / count(fhr_tests), 0)
      rec_tests = same filter with test_type == RECOVERY
      certified_recovery = round_half_up( sum(round_half_up(t.measured_value, 1) for t in rec_tests)
                                          / count(rec_tests), 1)
    input_set: "PASSED tests only; SCHEDULED, FAILED and VOIDED tests are excluded from every mean"
    constants:
      UEF_PER_TEST_DECIMALS: 2
      FHR_PER_TEST_DECIMALS: 0
      RECOVERY_PER_TEST_DECIMALS: 1
    precision: "round_half_up at each of the two stages; per-test decimals then the same decimals on the mean"

  - name: unit_serial_assignment
    trigger: "POST /mfg/heater-units/{id}/label — writes HeaterUnit.serial_number"
    algorithm: aggregation
    formula: |
      period_compact = production_period with the hyphen removed        # "2026-08" -> "202608"
      seq = 1 + count of HeaterUnit rows where product_model_id == this unit's model
                AND production_period == this unit's production_period
                AND serial_number IS NOT NULL
      serial_number = product_model.label_serial_prefix + "-" + period_compact + "-" + zero_pad(seq, 5)
    input_set: "already-labelled units of the same model and production period; the sequence never reuses a number even after a unit is scrapped"
    constants:
      SERIAL_SEQ_WIDTH: 5
    precision: "exact string; the sequence is assigned in label-call order, and the entity `id` is never consulted"

  - name: water_hardness_band_factor
    trigger: "POST /mfg/heater-units/{id}/ship — writes water_hardness_band and hardness_factor"
    algorithm: threshold
    formula: |
      gpg = install_water_hardness_gpg
      band = SOFT       if gpg < 3.5
             MODERATE   if 3.5 <= gpg <= 7.0
             HARD       if 7.0 <  gpg <= 10.5
             VERY_HARD  if gpg > 10.5
      hardness_factor = HARDNESS_FACTOR[band]
    input_set: "one unit's install_water_hardness_gpg; the claim's reported_water_hardness_gpg never overwrites it"
    constants:
      HARDNESS_FACTOR: { SOFT: 0.80, MODERATE: 1.00, HARD: 1.35, VERY_HARD: 1.80 }
    precision: "band boundaries exactly as written: 3.5 belongs to MODERATE, 7.0 belongs to MODERATE, 10.5 belongs to HARD"

  - name: unit_months_in_service
    trigger: "recomputed on every HeaterUnit read, and frozen into WarrantyClaim.months_in_service_at_report at claim creation"
    algorithm: decay_function
    formula: |
      if shipped_at is null: months_in_service = null
      else: months_in_service = floor( (logical_clock_now - shipped_at).total_seconds()
                                       / (SERVICE_MONTH_DAYS * 86400) )
    input_set: "the logical clock, never the host wall clock"
    constants:
      SERVICE_MONTH_DAYS: 30
    precision: "integer months, floor (never round)"

  - name: warranty_reserve_ledger
    trigger: "HeaterUnit LABELED_to_SHIPPED (accrual), WarrantyClaim VALIDATED_to_PAID (debit), WarrantyClaim PAID_to_VALIDATED (credit back)"
    algorithm: aggregation
    formula: |
      on ship:             accrued += WARRANTY_ACCRUAL_CENTS_PER_UNIT[model.fuel_type] ; balance += same
      on claim pay:        paid    += claim.approved_payout_cents ; balance -= same
      on payment reversal: paid    -= claim.approved_payout_cents ; balance += same
      INVARIANT: warranty_reserve_balance_cents
                 == warranty_reserve_accrued_cents - warranty_paid_cents   (always)
      A pay whose approved_payout_cents > balance is rejected with
      ERR_WARRANTY_RESERVE_INSUFFICIENT; the ledger is never driven negative.
    input_set: "SHIPPED and HELD units accrue (a hold does not claw the accrual back); SCRAPPED units never accrued"
    constants:
      WARRANTY_ACCRUAL_CENTS_PER_UNIT: { GAS: 42000, ELECTRIC: 31000, HEAT_PUMP: 98000 }
    precision: "integer cents; no rounding"

  - name: warranty_payout_proration
    trigger: "POST /mfg/warranty-claims/{id}/validate — writes coverage_pct and approved_payout_cents"
    algorithm: waterfall_allocation
    formula: |
      m = months_in_service_at_report
      if failure_mode IN {TANK_LEAK, ANODE_DEPLETION}:
          coverage_pct = 1.00 if m <= TANK_FULL_COVERAGE_MONTHS
                         else 0.50 if m <= TANK_HALF_COVERAGE_MONTHS
                         else 0.00
          part_cents = TANK_LIST_CENTS
      elif failure_mode IN {THERMOSTAT, GAS_VALVE, COMPRESSOR}:
          coverage_pct = 1.00 if m <= COMPONENT_COVERAGE_MONTHS else 0.00
          part_cents = COMPONENT_LIST_CENTS[failure_mode]
      else:  # OTHER
          coverage_pct = 0.00 ; part_cents = 0
      # coverage_pct == 0.00 -> validate is refused with ERR_WARRANTY_COVERAGE_EXPIRED
      # PINNED ROUNDING ORDER: prorate and round EACH of the three lines to a
      # whole cent, THEN sum. Summing the three list amounts first and prorating
      # once is FORBIDDEN and differs by a cent at coverage_pct 0.50.
      line_part    = round_half_up(part_cents            * coverage_pct, 0)
      line_labor   = round_half_up(LABOR_ALLOWANCE_CENTS * coverage_pct, 0)
      line_freight = round_half_up(FREIGHT_ALLOWANCE_CENTS * coverage_pct, 0)
      approved_payout_cents = line_part + line_labor + line_freight
    input_set: "the claim's own failure_mode and months_in_service_at_report; the unit's live months_in_service is not re-read at validation"
    constants:
      TANK_FULL_COVERAGE_MONTHS: 72
      TANK_HALF_COVERAGE_MONTHS: 96
      COMPONENT_COVERAGE_MONTHS: 12
      TANK_LIST_CENTS: 41500
      COMPONENT_LIST_CENTS: { THERMOSTAT: 4200, GAS_VALVE: 8200, COMPRESSOR: 52000 }
      LABOR_ALLOWANCE_CENTS: 12525
      FREIGHT_ALLOWANCE_CENTS: 3325
    precision: "whole cents, round_half_up, applied per line before summing"

  - name: tank_failure_rate_by_period
    trigger: "GET /mfg/product-models/{id}/warranty-analysis"
    algorithm: chronological
    formula: |
      cohort = HeaterUnit rows with product_model_id == model
               AND production_period == requested production_period
               AND build_status == SHIPPED
               ordered by created_at ASC
      shipped_unit_count = count(cohort)
      tank_leak_claim_count = count of WarrantyClaim rows whose heater_unit_id is in the
               cohort AND failure_mode == TANK_LEAK AND status IN {VALIDATED, PAID}
               (OPEN and DENIED claims are excluded from BOTH variants)
      weighted_exposure_unit_months = round_half_up(
               sum( unit.months_in_service * unit.hardness_factor for unit in cohort ), 2)
      if the relevant denominator is 0 the rate is 0.0
    input_set: "SHIPPED units of one model and one production period; HELD, LABELED and SCRAPPED units are excluded from both variants"
    constants:
      PPM_SCALE: 1000000
    precision: "1 decimal place, round_half_up, on both variants"
    variants:
      - name: cohort_naive
        when: "variant query parameter is omitted or equals COHORT_NAIVE — the field-reporting view"
        difference: "denominator is shipped_unit_count; rate = round_half_up(tank_leak_claim_count / shipped_unit_count * 1000000, 1). Ignores how long each unit has been in service and ignores water chemistry entirely."
      - name: exposure_weighted
        when: "variant query parameter equals EXPOSURE_WEIGHTED — the reliability-engineering view"
        difference: "denominator is weighted_exposure_unit_months; rate = round_half_up(tank_leak_claim_count / weighted_exposure_unit_months * 1000000, 1). Each unit contributes months_in_service * hardness_factor, so a young soft-water cohort yields a far higher rate than the naive variant on identical rows."

  - name: recall_scope_resolution
    trigger: "POST /mfg/recall-campaigns/{id}/scope — writes affected_unit_count"
    algorithm: aggregation
    formula: |
      affected = HeaterUnit rows with product_model_id == campaign.scope_product_model_id
                 AND serial_number IS NOT NULL
                 AND serial_range_start <= serial_number <= serial_range_end
                     (inclusive on both ends, ASCII lexicographic string comparison,
                      NOT numeric parsing of the sequence suffix)
                 AND build_status IN {LABELED, SHIPPED, HELD}
                 ordered by serial_number ASC
      affected_unit_count = count(affected)
      affected_unit_count == 0 -> ERR_RECALL_SCOPE_EMPTY
    input_set: "labelled units only; COMPONENTS_STAGED, ASSEMBLED and SCRAPPED units have no serial or are not distributable and never enter the population"
    constants: {}
    precision: "integer count; comparison is on the full serial string"

  - name: recall_remedy_cost
    trigger: "POST /mfg/recall-campaigns/{id}/scope — writes per_unit_remedy_cost_cents and estimated_remedy_cost_cents"
    algorithm: tiered_pricing
    formula: |
      # The admin-fee tier LOOKS circular: the fee is a percentage of a total
      # that the fee itself contributes to. The evaluation order below is the
      # pinned resolution - the tier is chosen ONCE from the provisional total
      # and is NEVER re-selected after the fee is added.
      # STEP 1
      labor_cents       = round_half_up(REMEDY_LABOR_RATE_CENTS_PER_HOUR * REMEDY_HOURS[remedy_type], 0)
      provisional_total = REMEDY_PARTS_CENTS[remedy_type] + labor_cents
      # STEP 2 - tier keyed on provisional_total, first matching band wins
      admin_rate = 0.15 if provisional_total <= 20000
                   else 0.10 if provisional_total <= 50000
                   else 0.06
      # STEP 3
      admin_fee_cents = round_half_up(provisional_total * admin_rate, 0)
      # STEP 4
      per_unit_remedy_cost_cents = provisional_total + admin_fee_cents
      estimated_remedy_cost_cents = affected_unit_count * per_unit_remedy_cost_cents
      # Worked trap: GAS_VALVE_KIT gives provisional 18000 -> 0.15 -> fee 2700
      # -> 20700. Re-tiering on 20700 would pick 0.10 and give 19800.
    input_set: "one campaign's remedy_type plus its resolved affected_unit_count"
    constants:
      REMEDY_PARTS_CENTS: { TANK_REPLACEMENT: 41500, GAS_VALVE_KIT: 8200, TP_VALVE_KIT: 3100, FULL_UNIT_REPLACEMENT: 68000 }
      REMEDY_HOURS: { TANK_REPLACEMENT: 3.5, GAS_VALVE_KIT: 1.0, TP_VALVE_KIT: 0.5, FULL_UNIT_REPLACEMENT: 4.0 }
      REMEDY_LABOR_RATE_CENTS_PER_HOUR: 9800
      ADMIN_TIER_1_MAX_CENTS: 20000
      ADMIN_TIER_2_MAX_CENTS: 50000
      ADMIN_RATE_TIER_1: 0.15
      ADMIN_RATE_TIER_2: 0.10
      ADMIN_RATE_TIER_3: 0.06
    precision: "whole cents, round_half_up, at STEP 1 and STEP 3 only"

  - name: recall_completion_rate
    trigger: "POST /mfg/recall-campaigns/{id}/announce, every RecallNotice transition, and GET /mfg/recall-campaigns/{id}/completion"
    algorithm: aggregation
    formula: |
      notice_count   = count of RecallNotice rows on the campaign (any status)
      remedied_count = count of those with status == REMEDIED
      both variants return 0.00 when their denominator is 0
    input_set: "notices of one campaign; UNREACHABLE notices stay in the notice_count denominator and are never deleted"
    constants: {}
    precision: "2 decimal places, round_half_up, on both variants"
    variants:
      - name: notice_based
        when: "the operational progress view — also the value stored in completion_pct_notice_based"
        difference: "round_half_up(remedied_count / notice_count * 100, 2). Denominator counts only units that actually received a notice, i.e. units that had shipped at announcement."
      - name: population_based
        when: "the regulatory view — also the value stored in completion_pct_population_based and the one gating IN_REMEDY_to_CLOSED"
        difference: "round_half_up(remedied_count / affected_unit_count * 100, 2). Denominator is the whole scoped population including affected units that were held instead of noticed, so it is <= the notice_based value whenever notice_count < affected_unit_count."

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (strictly ordered; the FIRST violated rule wins)
# -----------------------------------------------------------------------------
validations:

  - priority: 1
    rule: "X-User-Role header present and one of the eight declared roles; X-User-ID header present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    category: auth
    applies_to: "every endpoint except GET /mfg/_clock"

  - priority: 2
    rule: "the caller's role is permitted to invoke this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    category: auth
    applies_to: "every endpoint"

  - priority: 3
    rule: "every id appearing in the URL path resolves to an existing row of the expected entity"
    error_id: "ERR_SUPPLIER_NOT_FOUND | ERR_COMPONENT_LOT_NOT_FOUND | ERR_FURNACE_NOT_FOUND | ERR_GLASS_LINING_BATCH_NOT_FOUND | ERR_TANK_LOT_NOT_FOUND | ERR_LINING_INSPECTION_NOT_FOUND | ERR_PRODUCT_MODEL_NOT_FOUND | ERR_TEST_CELL_NOT_FOUND | ERR_EFFICIENCY_TEST_NOT_FOUND | ERR_RATING_CERTIFICATION_NOT_FOUND | ERR_HEATER_UNIT_NOT_FOUND | ERR_WARRANTY_CLAIM_NOT_FOUND | ERR_RECALL_CAMPAIGN_NOT_FOUND | ERR_RECALL_NOTICE_NOT_FOUND"
    category: existence
    applies_to: "every endpoint carrying a path id"

  - priority: 4
    rule: "request body and query parameters satisfy the declared schema: required inputs present, JSON types correct, enum members valid, numbers within their declared ranges, strings non-empty and within max length, timestamps ISO-8601 with a trailing Z"
    error_id: ERR_INVALID_REQUEST
    category: schema
    applies_to: "every endpoint with inputs"

  - priority: 5
    rule: "every foreign-key id supplied in the request BODY resolves to an existing row of the expected entity"
    error_id: "the corresponding *_NOT_FOUND error for the referenced entity"
    category: existence
    applies_to: "every create endpoint and every endpoint taking an id in its body"

  - priority: 6
    rule: "a SupplierRep caller may only read rows reachable from its own bound Supplier: its Supplier row and ComponentLot rows whose supplier_id equals it"
    error_id: ERR_SUPPLIER_SCOPE_VIOLATION
    category: business_safety
    applies_to: "GET /mfg/suppliers/{id}, GET /mfg/component-lots/{id}, GET /mfg/component-lots"

  - priority: 7
    rule: "when the endpoint declares an expected_<parent>_version input, it must equal the parent's current version"
    error_id: ERR_STALE_PARENT_VERSION
    category: state
    applies_to: "POST /mfg/rating-certifications, POST /mfg/lining-inspections"

  - priority: 8
    rule: "the target entity is in a state from which this trigger is a declared transition (see §1.2); for ProductModel the dimension the trigger drives is the one consulted, so a lift-restriction on a DRAFT model and a suspend-certification on an UNCERTIFIED model both report ERR_INVALID_MODEL_STATE"
    error_id: "ERR_INVALID_SUPPLIER_STATE | ERR_INVALID_COMPONENT_LOT_STATE | ERR_INVALID_BATCH_STATE | ERR_INVALID_TANK_LOT_STATE | ERR_INVALID_MODEL_STATE | ERR_INVALID_TEST_STATE | ERR_INVALID_CERTIFICATION_STATE | ERR_INVALID_UNIT_STATE | ERR_INVALID_CLAIM_STATE | ERR_INVALID_CAMPAIGN_STATE | ERR_INVALID_NOTICE_STATE"
    category: state
    applies_to: "every action endpoint that drives a state machine"

  - priority: 9
    rule: "the X-User-ID approving a rating certification must differ from the X-User-ID that submitted it (recorded in submitted_by_user_id)"
    error_id: ERR_SOD_APPROVER_IS_SUBMITTER
    category: business_safety
    applies_to: "POST /mfg/rating-certifications/{id}/approve, POST /mfg/rating-certifications/{id}/reject"

  - priority: 10
    rule: "the X-User-ID recording a lining inspection must differ from the TankLot.weld_operator_user_id of the lot being inspected"
    error_id: ERR_SOD_INSPECTOR_IS_WELDER
    category: business_safety
    applies_to: "POST /mfg/lining-inspections"

  - priority: 11
    rule: "both component lots named on an assemble call must be RELEASED and their Supplier must be in status QUALIFIED or CONDITIONAL; the same pair of conditions gates releasing a unit's hold, since a held unit may only re-enter production while the pieces it drew are usable again; an incoming lot may likewise only be released while its Supplier is QUALIFIED or CONDITIONAL; unblocking is the one exception that also accepts a PENDING supplier and is refused only while the Supplier is still DISQUALIFIED"
    error_id: ERR_COMPONENT_SUPPLIER_NOT_QUALIFIED
    category: business_safety
    applies_to: "POST /mfg/heater-units/{id}/assemble, POST /mfg/heater-units/{id}/release-hold, POST /mfg/component-lots/{id}/release, POST /mfg/component-lots/{id}/unblock"

  - priority: 12
    rule: "the unit's ProductModel.certification_status must be CERTIFIED before a serial and rating label may be issued"
    error_id: ERR_MODEL_NOT_CERTIFIED
    category: business_safety
    applies_to: "POST /mfg/heater-units/{id}/label"

  - priority: 13
    rule: "the unit's ProductModel.release_status must be RELEASED, and the requested distribution channel must be the model's channel"
    error_id: ERR_MODEL_NOT_RELEASED
    category: business_safety
    applies_to: "POST /mfg/heater-units/{id}/label, POST /mfg/heater-units/{id}/ship"

  - priority: 14
    rule: "gas_control_lot_id must reference a lot whose component_category is GAS_VALVE, and safety_valve_lot_id one whose component_category is TP_RELIEF_VALVE"
    error_id: ERR_COMPONENT_CATEGORY_MISMATCH
    category: business_constraint
    applies_to: "POST /mfg/heater-units"

  - priority: 15
    rule: "a GAS model requires gas_control_lot_id; an ELECTRIC or HEAT_PUMP model must NOT supply one"
    error_id: "ERR_GAS_CONTROL_REQUIRED | ERR_GAS_CONTROL_NOT_APPLICABLE"
    category: business_constraint
    applies_to: "POST /mfg/heater-units"

  - priority: 16
    rule: "when is_private_label is true, base_model_id must be present and reference a model with is_private_label false and the same fuel_type and nominal_capacity_gallons; when false, base_model_id must be absent"
    error_id: ERR_PRIVATE_LABEL_BASE_INVALID
    category: business_constraint
    applies_to: "POST /mfg/product-models"

  - priority: 17
    rule: "the GlassLiningBatch named on an apply-lining call must be in status FIRED"
    error_id: ERR_BATCH_NOT_FIRED
    category: business_safety
    applies_to: "POST /mfg/tank-lots/{id}/apply-lining"

  - priority: 18
    rule: "TankLot.rework_count must be strictly less than MAX_REWORK_CYCLES (2) before another reline may be authorized"
    error_id: ERR_REWORK_LIMIT_EXCEEDED
    category: business_constraint
    applies_to: "POST /mfg/tank-lots/{id}/authorize-reline"

  - priority: 19
    rule: "sample_size must be at least max(3, ceil(tank_lot.planned_quantity * 0.05))"
    error_id: ERR_SAMPLE_SIZE_INSUFFICIENT
    category: business_constraint
    applies_to: "POST /mfg/lining-inspections"

  - priority: 20
    rule: "a certification submit requires at least MIN_UEF_SAMPLE_TESTS (3) PASSED UEF tests and at least one PASSED FIRST_HOUR_RATING and one PASSED RECOVERY test for the model"
    error_id: ERR_INSUFFICIENT_TEST_SAMPLE
    category: business_constraint
    applies_to: "POST /mfg/rating-certifications/{id}/submit"

  - priority: 21
    rule: "serial_range_start must be lexicographically less than or equal to serial_range_end; this well-formedness check runs BEFORE the population is resolved, so an inverted range reports ERR_SERIAL_RANGE_INVALID and never the empty-population error it would otherwise produce"
    error_id: ERR_SERIAL_RANGE_INVALID
    category: business_constraint
    applies_to: "POST /mfg/recall-campaigns/{id}/scope"

  - priority: 22
    rule: "the resolved recall population must contain at least one unit"
    error_id: ERR_RECALL_SCOPE_EMPTY
    category: business_constraint
    applies_to: "POST /mfg/recall-campaigns/{id}/scope"

  - priority: 23
    rule: "furnace_code, batch_code, lot_code, cell_code, model_code and campaign_code are each unique within their entity, and part_number is unique within one supplier's ComponentLot rows"
    error_id: ERR_DUPLICATE_CODE
    category: business_constraint
    applies_to: "POST /mfg/furnaces, POST /mfg/glass-lining-batches, POST /mfg/component-lots, POST /mfg/tank-lots, POST /mfg/test-cells, POST /mfg/product-models, POST /mfg/recall-campaigns"

  - priority: 24
    rule: "the requested firing window must not overlap any other non-terminal GlassLiningBatch window on the same Furnace; windows are half-open [firing_start, firing_end) so a window starting exactly at another's firing_end is accepted"
    error_id: ERR_FURNACE_WINDOW_CONFLICT
    category: business_temporal
    applies_to: "POST /mfg/glass-lining-batches"

  - priority: 25
    rule: "the requested test window must leave a free slot on the TestCell (at most parallel_slots overlapping non-terminal tests), and must start at least cooldown_hours after the end of the cell's previous window for the SAME ProductModel"
    error_id: "ERR_TEST_CELL_CAPACITY_CONFLICT | ERR_TEST_CELL_COOLDOWN_VIOLATION"
    category: business_temporal
    applies_to: "POST /mfg/efficiency-tests"

  - priority: 26
    rule: "for any submitted window, start must be strictly before end"
    error_id: ERR_INVALID_WINDOW
    category: business_temporal
    applies_to: "POST /mfg/glass-lining-batches, POST /mfg/efficiency-tests"

  - priority: 27
    rule: "the Supplier's qualified_until is an INCLUSIVE expiry, so it must be at or after the logical clock at the moment of the component release or the unit assemble; qualified_until exactly equal to the current instant still qualifies"
    error_id: ERR_QUALIFICATION_EXPIRED
    category: business_temporal
    applies_to: "POST /mfg/component-lots/{id}/release, POST /mfg/heater-units/{id}/assemble"

  - priority: 28
    rule: "the computed supplier_qualification_score must be at least CONDITIONAL_SCORE_FLOOR (70.00)"
    error_id: ERR_SUPPLIER_SCORE_BELOW_FLOOR
    category: business_constraint
    applies_to: "POST /mfg/suppliers/{id}/qualify, POST /mfg/suppliers/{id}/requalify"

  - priority: 29
    rule: "the claim's coverage_pct must be greater than 0.00 at validation time"
    error_id: ERR_WARRANTY_COVERAGE_EXPIRED
    category: business_constraint
    applies_to: "POST /mfg/warranty-claims/{id}/validate"

  - priority: 30
    rule: "approved_payout_cents must not exceed the model's warranty_reserve_balance_cents"
    error_id: ERR_WARRANTY_RESERVE_INSUFFICIENT
    category: business_constraint
    applies_to: "POST /mfg/warranty-claims/{id}/pay"

  - priority: 31
    rule: "estimated_remedy_cost_cents must not exceed the campaign's budget_cents; the cost is computed and stored by scope but the budget is only enforced at announcement, so an over-budget campaign may legitimately sit in SCOPED"
    error_id: ERR_RECALL_BUDGET_EXCEEDED
    category: business_constraint
    applies_to: "POST /mfg/recall-campaigns/{id}/announce"

  - priority: 32
    rule: "completion_pct_population_based must be at least CLOSE_COMPLETION_THRESHOLD_PCT (80.00) before a campaign may be closed"
    error_id: ERR_COMPLETION_BELOW_THRESHOLD
    category: business_constraint
    applies_to: "POST /mfg/recall-campaigns/{id}/close"

  - priority: 33
    rule: "containment must be cleared before the containing entity is closed or reinstated: no unit of the campaign's population may still be in build_status HELD when the campaign is closed or a model's restriction is lifted, and a Supplier's blocked_lot_count must be 0 before it may be scored QUALIFIED or CONDITIONAL again (the gate sits on qualify, not on requalify, because requalification is what unlocks the blocked lots)"
    error_id: "ERR_HELD_UNITS_REMAIN | ERR_BLOCKED_LOTS_REMAIN"
    category: business_constraint
    applies_to: "POST /mfg/recall-campaigns/{id}/close, POST /mfg/product-models/{id}/lift-restriction, POST /mfg/suppliers/{id}/qualify"

  - priority: 34
    rule: "a warranty claim may only be filed against a unit whose build_status is SHIPPED and whose shipped_at is not null"
    error_id: ERR_UNIT_NOT_IN_SERVICE
    category: business_safety
    applies_to: "POST /mfg/warranty-claims"

  - priority: 35
    rule: "foam_thickness_mm must be at least MIN_FOAM_THICKNESS_MM (40)"
    error_id: ERR_FOAM_THICKNESS_BELOW_MINIMUM
    category: business_constraint
    applies_to: "POST /mfg/tank-lots/{id}/foam"

  - priority: 36
    rule: "the achieved insulation R-value round_half_up(foam_thickness_mm * R_VALUE_PER_MM, 1) must be at least the ProductModel.insulation_r_value the model was certified against"
    error_id: ERR_INSULATION_R_VALUE_SHORTFALL
    category: business_constraint
    applies_to: "POST /mfg/tank-lots/{id}/foam"

  - priority: 37
    rule: "the number of HeaterUnit rows already drawn from a TankLot must be strictly less than its good_quantity"
    error_id: ERR_LOT_UNIT_CAPACITY_EXCEEDED
    category: business_constraint
    applies_to: "POST /mfg/heater-units"

  - priority: 38
    rule: "the requested firing_temp_c must not exceed the Furnace.max_firing_temp_c"
    error_id: ERR_FIRING_TEMP_EXCEEDS_FURNACE_MAX
    category: business_constraint
    applies_to: "POST /mfg/glass-lining-batches"

  - priority: 39
    rule: "a lining rejection may only be reversed when it was a direct inspection FAIL on this lot (cascade_rejected == false) and the lot's GlassLiningBatch is still FIRED"
    error_id: ERR_REWORK_REVERSAL_NOT_ALLOWED
    category: business_constraint
    applies_to: "POST /mfg/tank-lots/{id}/rework-reversal"

  - priority: 40
    rule: "a window's own end must have elapsed on the logical clock before its outcome is booked: at or after EfficiencyTest.window_end for a recorded result, and at or after GlassLiningBatch.firing_end for a fired batch"
    error_id: "ERR_TEST_WINDOW_NOT_ELAPSED | ERR_FIRING_WINDOW_NOT_ELAPSED"
    category: business_temporal
    applies_to: "POST /mfg/efficiency-tests/{id}/record-result, POST /mfg/glass-lining-batches/{id}/fire"

  - priority: 41
    rule: "a private-label variant may only be released once its base model's release_status is RELEASED or RESTRICTED"
    error_id: ERR_BASE_MODEL_NOT_RELEASED
    category: business_safety
    applies_to: "POST /mfg/product-models/{id}/release-to-channel"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
# -----------------------------------------------------------------------------
endpoints:

  # --- test-driving surface -------------------------------------------------
  - method: POST
    path: "/mfg/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock, which every months-in-service, qualification-expiry and window rule reads. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to host wall-clock time."
    roles: [PlantAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["recomputes HeaterUnit.months_in_service on every read thereafter", "changes which Supplier rows are past qualified_until"]

  - method: GET
    path: "/mfg/_clock"
    description: "Reads the current logical UTC clock."
    roles: [PlantAdmin, PlantOperator, QualityInspector, ComplianceEngineer, CertificationApprover, SupplierQualityManager, WarrantyAnalyst]
    code: 200
    input: []
    output: { current_utc: datetime }
    side_effects: []

  # --- Supplier -------------------------------------------------------------
  - method: POST
    path: "/mfg/suppliers"
    description: "Registers a component supplier in PENDING qualification status."
    roles: [SupplierQualityManager]
    code: 201
    input: [name, component_category, audit_score, defect_ppm, open_capa_count]
    output: Supplier
    side_effects: []

  - method: GET
    path: "/mfg/suppliers/{id}"
    description: "Reads one supplier, including its recomputed blocked_lot_count."
    roles: [SupplierQualityManager, QualityInspector, PlantAdmin, PlantOperator, SupplierRep]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  - method: GET
    path: "/mfg/suppliers"
    description: "Lists suppliers, optionally filtered by qualification_status or component_category."
    roles: [SupplierQualityManager, QualityInspector, PlantAdmin, PlantOperator]
    code: 200
    input: ["qualification_status?", "component_category?", "limit?", "offset?"]
    output: Supplier[]
    side_effects: []

  - method: POST
    path: "/mfg/suppliers/{id}/qualify"
    description: "Scores the supplier from a fresh audit reading and moves it to QUALIFIED or CONDITIONAL."
    roles: [SupplierQualityManager]
    code: 200
    input: [audit_score, defect_ppm, open_capa_count, qualified_until]
    output: Supplier
    side_effects: ["calculations.supplier_qualification_score", "writes qualification_score, qualification_status and qualified_until"]

  - method: POST
    path: "/mfg/suppliers/{id}/disqualify"
    description: "Disqualifies a supplier and starts the four-hop containment cascade over its lots and the units built from them."
    roles: [SupplierQualityManager]
    code: 200
    input: [reason_code]
    output: Supplier
    side_effects: ["cascade hop 1: every RELEASED and RECEIVED ComponentLot of this supplier becomes BLOCKED", "cascade hop 2: every non-terminal HeaterUnit consuming those lots becomes HELD", "cascade hop 3: every RELEASED ProductModel with a held unit becomes RESTRICTED", "clears qualified_until"]

  - method: POST
    path: "/mfg/suppliers/{id}/requalify"
    description: "Returns a DISQUALIFIED supplier to PENDING so that its blocked lots may be dispositioned and a fresh qualify attempt becomes possible. Does not unblock any lot by itself."
    roles: [SupplierQualityManager]
    code: 200
    input: [reason_code]
    output: Supplier
    side_effects: ["clears qualification_score and disqualification_reason_code"]

  # --- ComponentLot ---------------------------------------------------------
  - method: POST
    path: "/mfg/component-lots"
    description: "Books an incoming component lot against a supplier; the lot starts QUARANTINED pending incoming inspection."
    roles: [SupplierQualityManager, QualityInspector]
    code: 201
    input: [supplier_id, part_number, category, quantity, "certificate_of_conformance?"]
    output: ComponentLot
    side_effects: []

  - method: GET
    path: "/mfg/component-lots/{id}"
    description: "Reads one component lot with its recomputed consumed_quantity and remaining_quantity."
    roles: [SupplierQualityManager, QualityInspector, PlantOperator, PlantAdmin, SupplierRep]
    code: 200
    input: []
    output: ComponentLot
    side_effects: []

  - method: GET
    path: "/mfg/component-lots"
    description: "Lists component lots, filterable by supplier_id, category or status."
    roles: [SupplierQualityManager, QualityInspector, PlantOperator, PlantAdmin, SupplierRep]
    code: 200
    input: ["supplier_id?", "category?", "status?", "limit?", "offset?"]
    output: ComponentLot[]
    side_effects: []

  - method: POST
    path: "/mfg/component-lots/{id}/release"
    description: "Releases a quarantined lot to the assembly line after incoming inspection; requires a signed CoC and a currently qualified supplier."
    roles: [QualityInspector]
    code: 200
    input: []
    output: ComponentLot
    side_effects: ["requires the supplier QUALIFIED or CONDITIONAL and qualified_until strictly after the logical clock"]

  - method: POST
    path: "/mfg/component-lots/{id}/reject"
    description: "Rejects a QUARANTINED or BLOCKED lot outright; terminal. Rejecting a BLOCKED lot is one of the two ways containment is dispositioned (the other is unblock) before the supplier can be scored again."
    roles: [QualityInspector]
    code: 200
    input: [reason_code]
    output: ComponentLot
    side_effects: ["writes reject_reason_code", "recomputes supplier.blocked_lot_count when the lot was BLOCKED"]

  - method: POST
    path: "/mfg/component-lots/{id}/unblock"
    description: "Returns a BLOCKED lot to RELEASED once its supplier is no longer DISQUALIFIED; a PENDING supplier that has just been requalified is enough."
    roles: [SupplierQualityManager]
    code: 200
    input: []
    output: ComponentLot
    side_effects: ["decrements the supplier's blocked_lot_count on the next read", "accepted while the supplier is PENDING, QUALIFIED or CONDITIONAL; refused while it is still DISQUALIFIED"]

  # --- Furnace --------------------------------------------------------------
  - method: POST
    path: "/mfg/furnaces"
    description: "Registers a glass-lining firing furnace."
    roles: [PlantAdmin]
    code: 201
    input: [furnace_code, max_firing_temp_c]
    output: Furnace
    side_effects: []

  - method: GET
    path: "/mfg/furnaces/{id}"
    description: "Reads one furnace with its recomputed occupied_window_count."
    roles: [PlantAdmin, PlantOperator, QualityInspector, ComplianceEngineer]
    code: 200
    input: []
    output: Furnace
    side_effects: []

  - method: GET
    path: "/mfg/furnaces"
    description: "Lists furnaces."
    roles: [PlantAdmin, PlantOperator, QualityInspector, ComplianceEngineer]
    code: 200
    input: ["limit?", "offset?"]
    output: Furnace[]
    side_effects: []

  # --- GlassLiningBatch -----------------------------------------------------
  - method: POST
    path: "/mfg/glass-lining-batches"
    description: "Books a slurry batch onto a furnace for a half-open [firing_start, firing_end) window."
    roles: [PlantOperator]
    code: 201
    input: [furnace_id, batch_code, slurry_mix_code, firing_temp_c, firing_start, firing_end]
    output: GlassLiningBatch
    side_effects: ["furnace exclusivity check over half-open windows", "firing_temp_c must not exceed the furnace's max_firing_temp_c"]

  - method: GET
    path: "/mfg/glass-lining-batches/{id}"
    description: "Reads one lining batch with its assigned_lot_count and rejected_lot_count."
    roles: [PlantOperator, QualityInspector, PlantAdmin, ComplianceEngineer]
    code: 200
    input: []
    output: GlassLiningBatch
    side_effects: []

  - method: GET
    path: "/mfg/glass-lining-batches"
    description: "Lists lining batches, filterable by furnace_id or status."
    roles: [PlantOperator, QualityInspector, PlantAdmin, ComplianceEngineer]
    code: 200
    input: ["furnace_id?", "status?", "limit?", "offset?"]
    output: GlassLiningBatch[]
    side_effects: []

  - method: POST
    path: "/mfg/glass-lining-batches/{id}/fire"
    description: "Records completion of the firing cycle, making the batch usable for lining application. Refused before the logical clock reaches firing_end."
    roles: [PlantOperator]
    code: 200
    input: []
    output: GlassLiningBatch
    side_effects: ["status MIXED -> FIRED", "requires the logical clock to be at or after firing_end"]

  # --- ProductModel ---------------------------------------------------------
  - method: POST
    path: "/mfg/product-models"
    description: "Creates a catalogue model, either an own-brand model or a private-label variant of an existing base model. Starts at certification_status UNCERTIFIED and release_status DRAFT."
    roles: [ComplianceEngineer]
    code: 201
    input: [model_code, fuel_type, nominal_capacity_gallons, channel, insulation_r_value, is_private_label, "base_model_id?", "brand_label?"]
    output: ProductModel
    side_effects: ["private-label consistency check against the base model's fuel_type and nominal_capacity_gallons"]

  - method: GET
    path: "/mfg/product-models/{id}"
    description: "Reads one model with its certification and release dimensions, published ratings and warranty-reserve ledger."
    roles: [ComplianceEngineer, CertificationApprover, PlantAdmin, PlantOperator, QualityInspector, WarrantyAnalyst]
    code: 200
    input: []
    output: ProductModel
    side_effects: []

  - method: GET
    path: "/mfg/product-models"
    description: "Lists models; base_model_id finds the private-label variants derived from a base model."
    roles: [ComplianceEngineer, CertificationApprover, PlantAdmin, PlantOperator, QualityInspector, WarrantyAnalyst]
    code: 200
    input: ["base_model_id?", "channel?", "fuel_type?", "certification_status?", "release_status?", "limit?", "offset?"]
    output: ProductModel[]
    side_effects: []

  - method: POST
    path: "/mfg/product-models/{id}/release-to-channel"
    description: "Releases a model for distribution in its declared channel. Independent of the certification dimension - a model may be RELEASED while still UNCERTIFIED."
    roles: [ComplianceEngineer]
    code: 200
    input: []
    output: ProductModel
    side_effects: ["release_status DRAFT -> RELEASED", "for a private-label variant, requires the base model's release_status IN {RELEASED, RESTRICTED}"]

  - method: POST
    path: "/mfg/product-models/{id}/lift-restriction"
    description: "Returns a RESTRICTED model to RELEASED once no held unit remains."
    roles: [PlantAdmin]
    code: 200
    input: []
    output: ProductModel
    side_effects: ["release_status RESTRICTED -> RELEASED", "requires held_unit_count == 0; the certification dimension is not consulted"]

  - method: POST
    path: "/mfg/product-models/{id}/withdraw"
    description: "Withdraws a model from all channels; terminal on the release dimension. Fans out to the model's private-label variants."
    roles: [ComplianceEngineer]
    code: 200
    input: [reason_code]
    output: ProductModel
    side_effects: ["release_status RELEASED or RESTRICTED -> WITHDRAWN", "every private-label variant whose base_model_id == this model and whose release_status IN {RELEASED, RESTRICTED} is withdrawn too, in created_at ASC order"]

  - method: POST
    path: "/mfg/product-models/{id}/suspend-certification"
    description: "Suspends a model's certification without revoking the underlying certificate, e.g. pending re-test. Leaves the release dimension untouched."
    roles: [CertificationApprover]
    code: 200
    input: [reason_code]
    output: ProductModel
    side_effects: ["certification_status CERTIFIED -> SUSPENDED, blocking any further labelling"]

  - method: GET
    path: "/mfg/product-models/{id}/warranty-analysis"
    description: "Computed read: tank-failure analysis for one production period under the requested rate variant, with the water-chemistry mix of the shipped cohort. Both parameters travel in the query string; production_period is mandatory in practice and its absence is rejected as ERR_INVALID_REQUEST (400), while variant defaults to NAIVE."
    roles: [WarrantyAnalyst, ComplianceEngineer, PlantAdmin]
    code: 200
    input: ["production_period?", "variant?"]
    output: { production_period: string, variant: string, shipped_unit_count: integer, tank_leak_claim_count: integer, weighted_exposure_unit_months: number, failure_rate_ppm: number, soft_unit_count: integer, moderate_unit_count: integer, hard_unit_count: integer, very_hard_unit_count: integer }
    side_effects: ["calculations.tank_failure_rate_by_period"]

  # --- TestCell -------------------------------------------------------------
  - method: POST
    path: "/mfg/test-cells"
    description: "Registers an efficiency test cell with its parallel slot count and per-model cooldown."
    roles: [PlantAdmin]
    code: 201
    input: [cell_code, parallel_slots, cooldown_hours]
    output: TestCell
    side_effects: []

  - method: GET
    path: "/mfg/test-cells/{id}"
    description: "Reads one test cell."
    roles: [PlantAdmin, ComplianceEngineer, CertificationApprover, QualityInspector]
    code: 200
    input: []
    output: TestCell
    side_effects: []

  - method: GET
    path: "/mfg/test-cells"
    description: "Lists test cells."
    roles: [PlantAdmin, ComplianceEngineer, CertificationApprover, QualityInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: TestCell[]
    side_effects: []

  # --- EfficiencyTest -------------------------------------------------------
  - method: POST
    path: "/mfg/efficiency-tests"
    description: "Schedules one UEF, first-hour-rating or recovery test for a model on a test cell over a half-open window."
    roles: [ComplianceEngineer]
    code: 201
    input: [product_model_id, test_cell_id, test_type, sample_size, window_start, window_end]
    output: EfficiencyTest
    side_effects: ["test-cell slot-capacity check", "per-model cooldown check against the cell's previous window for the same model"]

  - method: GET
    path: "/mfg/efficiency-tests/{id}"
    description: "Reads one test with its effective_minimum and margin."
    roles: [ComplianceEngineer, CertificationApprover, PlantAdmin, QualityInspector]
    code: 200
    input: []
    output: EfficiencyTest
    side_effects: []

  - method: GET
    path: "/mfg/efficiency-tests"
    description: "Lists tests, filterable by product_model_id, test_cell_id, test_type or status."
    roles: [ComplianceEngineer, CertificationApprover, PlantAdmin, QualityInspector]
    code: 200
    input: ["product_model_id?", "test_cell_id?", "test_type?", "status?", "limit?", "offset?"]
    output: EfficiencyTest[]
    side_effects: []

  - method: POST
    path: "/mfg/efficiency-tests/{id}/record-result"
    description: "Records the measured value and evaluates it against the applicable federal floor or rating floor. Requires the logical clock to be at or after the test's window_end."
    roles: [QualityInspector]
    code: 200
    input: [measured_value]
    output: EfficiencyTest
    side_effects: ["calculations.uef_compliance_margin or calculations.rating_floor_check", "status SCHEDULED -> PASSED or FAILED", "the first recorded result for a model moves its certification_status UNCERTIFIED -> TEST_PENDING"]

  # --- RatingCertification --------------------------------------------------
  - method: POST
    path: "/mfg/rating-certifications"
    description: "Opens a DRAFT rating certification for a model. Creating a newer certification supersedes any existing DRAFT or SUBMITTED one for the same model, so the caller must pin the model's version it observed."
    roles: [ComplianceEngineer]
    code: 201
    input: [product_model_id, expected_product_model_version]
    output: RatingCertification
    side_effects: ["OCC check on ProductModel.version", "bumps ProductModel.version", "any DRAFT or SUBMITTED certification of the same model becomes SUPERSEDED"]

  - method: GET
    path: "/mfg/rating-certifications/{id}"
    description: "Reads one certification with its published certified ratings."
    roles: [ComplianceEngineer, CertificationApprover, PlantAdmin, QualityInspector, WarrantyAnalyst]
    code: 200
    input: []
    output: RatingCertification
    side_effects: []

  - method: GET
    path: "/mfg/rating-certifications"
    description: "Lists certifications, filterable by product_model_id or status."
    roles: [ComplianceEngineer, CertificationApprover, PlantAdmin, QualityInspector, WarrantyAnalyst]
    code: 200
    input: ["product_model_id?", "status?", "limit?", "offset?"]
    output: RatingCertification[]
    side_effects: []

  - method: POST
    path: "/mfg/rating-certifications/{id}/submit"
    description: "Computes the certified ratings from the model's passed tests and submits the certification for approval."
    roles: [ComplianceEngineer]
    code: 200
    input: []
    output: RatingCertification
    side_effects: ["calculations.certified_rating_rounding", "records submitted_by_user_id from X-User-ID", "requires at least 3 PASSED UEF tests plus one PASSED FIRST_HOUR_RATING and one PASSED RECOVERY test"]

  - method: POST
    path: "/mfg/rating-certifications/{id}/approve"
    description: "Approves a submitted certification, certifying the model and publishing its label ratings."
    roles: [CertificationApprover]
    code: 200
    input: [effective_date]
    output: RatingCertification
    side_effects: ["segregation of duties: the approver's X-User-ID must differ from submitted_by_user_id", "writes approved_by_user_id and effective_date", "model certification_status TEST_PENDING or SUSPENDED -> CERTIFIED", "copies certified ratings and label_serial_prefix onto the model", "any previously APPROVED certification of the same model becomes SUPERSEDED"]

  - method: POST
    path: "/mfg/rating-certifications/{id}/reject"
    description: "Rejects a submitted certification back to DRAFT for revision."
    roles: [CertificationApprover]
    code: 200
    input: [reason_code]
    output: RatingCertification
    side_effects: ["segregation of duties check", "clears the computed certified ratings"]

  - method: POST
    path: "/mfg/rating-certifications/{id}/revoke"
    description: "Revokes an approved certification and starts the four-hop de-certification cascade."
    roles: [CertificationApprover]
    code: 200
    input: [reason_code]
    output: RatingCertification
    side_effects: ["cascade hop 1: the model's certification_status -> DECERTIFIED and, if it was RELEASED, release_status -> RESTRICTED", "cascade hop 2: every non-terminal HeaterUnit of the model becomes HELD", "cascade hop 3: the model's published ratings are cleared", "cascade hop 4: every SCHEDULED EfficiencyTest of the model becomes VOIDED"]

  # --- TankLot --------------------------------------------------------------
  - method: POST
    path: "/mfg/tank-lots"
    description: "Opens a tank production lot for a model; the whole planned quantity starts as WIP."
    roles: [PlantOperator]
    code: 201
    input: [product_model_id, lot_code, planned_quantity]
    output: TankLot
    side_effects: ["wip_quantity = planned_quantity, good_quantity = 0, scrapped_quantity = 0", "production_period derived as the YYYY-MM of the logical clock"]

  - method: GET
    path: "/mfg/tank-lots/{id}"
    description: "Reads one tank lot with its three-way quantity ledger, rework count and achieved R-value."
    roles: [PlantOperator, QualityInspector, PlantAdmin, ComplianceEngineer]
    code: 200
    input: []
    output: TankLot
    side_effects: []

  - method: GET
    path: "/mfg/tank-lots"
    description: "Lists tank lots, filterable by product_model_id, glass_lining_batch_id, production_period or status."
    roles: [PlantOperator, QualityInspector, PlantAdmin, ComplianceEngineer]
    code: 200
    input: ["product_model_id?", "glass_lining_batch_id?", "production_period?", "status?", "limit?", "offset?"]
    output: TankLot[]
    side_effects: []

  - method: POST
    path: "/mfg/tank-lots/{id}/weld"
    description: "Records completion of tank fabrication welding and pins the weld operator for the later segregation-of-duties check on inspections."
    roles: [PlantOperator]
    code: 200
    input: []
    output: TankLot
    side_effects: ["status FAB_QUEUED -> WELDED", "weld_operator_user_id = X-User-ID"]

  - method: POST
    path: "/mfg/tank-lots/{id}/apply-lining"
    description: "Applies glass-lining slurry from a FIRED batch to a welded lot, or re-applies it to a lot queued for reline."
    roles: [PlantOperator]
    code: 200
    input: [glass_lining_batch_id]
    output: TankLot
    side_effects: ["status WELDED or RELINE_QUEUED -> LINED", "writes glass_lining_batch_id, sets cascade_rejected = false", "the batch's assigned_lot_count is recomputed"]

  - method: POST
    path: "/mfg/tank-lots/{id}/authorize-reline"
    description: "Queues a lining-rejected lot for another lining cycle, up to MAX_REWORK_CYCLES."
    roles: [PlantOperator]
    code: 200
    input: []
    output: TankLot
    side_effects: ["status LINING_REJECTED -> RELINE_QUEUED", "increments rework_count"]

  - method: POST
    path: "/mfg/tank-lots/{id}/rework-reversal"
    description: "COMPENSATING ACTION: reverses the most recent direct lining rejection, returning the scrapped tanks to WIP and the lot to LINED."
    roles: [QualityInspector]
    code: 200
    input: [reason_code]
    output: TankLot
    side_effects: ["status LINING_REJECTED -> LINED", "wip_quantity += last_scrap_quantity and scrapped_quantity -= last_scrap_quantity, restoring the calculations.tank_lot_quantity_ledger invariant to its pre-rejection split", "the CURRENT FAIL LiningInspection record stays CURRENT while the lot returns to LINED, and the batch's rejected_lot_count is decremented", "refused when cascade_rejected is true, when last_scrap_quantity is null, or when the lot's batch is QUARANTINED"]

  - method: POST
    path: "/mfg/tank-lots/{id}/scrap"
    description: "Scraps everything still in WIP on the lot; terminal."
    roles: [QualityInspector]
    code: 200
    input: [reason_code]
    output: TankLot
    side_effects: ["scrapped_quantity += wip_quantity then wip_quantity = 0"]

  - method: POST
    path: "/mfg/tank-lots/{id}/foam"
    description: "Records the insulation foaming pass and derives the achieved R-value from the foam thickness."
    roles: [PlantOperator]
    code: 200
    input: [foam_density_kg_m3, foam_thickness_mm]
    output: TankLot
    side_effects: ["status LINING_VERIFIED -> FOAMED", "achieved_r_value = round_half_up(foam_thickness_mm * R_VALUE_PER_MM, 1) and must reach the model's insulation_r_value"]

  - method: POST
    path: "/mfg/tank-lots/{id}/jacket"
    description: "Records jacket assembly on a foamed lot."
    roles: [PlantOperator]
    code: 200
    input: []
    output: TankLot
    side_effects: ["status FOAMED -> JACKETED"]

  - method: POST
    path: "/mfg/tank-lots/{id}/release"
    description: "Releases the lot to final assembly, converting the remaining WIP into good tanks."
    roles: [PlantOperator]
    code: 200
    input: []
    output: TankLot
    side_effects: ["status JACKETED -> RELEASED", "good_quantity = wip_quantity then wip_quantity = 0"]

  # --- LiningInspection -----------------------------------------------------
  - method: POST
    path: "/mfg/lining-inspections"
    description: "Records an immutable adhesion or holiday inspection record against a lined lot. A new record for the same inspection_type supersedes the previous CURRENT one, so the caller must pin the lot version it observed."
    roles: [QualityInspector]
    code: 201
    input: [tank_lot_id, inspection_type, sample_size, expected_tank_lot_version, "holiday_count?", "adhesion_class?", "scrap_quantity?"]
    output: LiningInspection
    side_effects: ["OCC check on TankLot.version", "bumps TankLot.version", "calculations.lot_holiday_density decides PASS or FAIL", "any earlier CURRENT record of the same inspection_type becomes SUPERSEDED", "a CURRENT PASS record for BOTH inspection types moves the lot LINED -> LINING_VERIFIED", "FAIL moves the lot LINED -> LINING_REJECTED and starts the four-hop batch-quarantine cascade", "segregation of duties: the inspector must not be the lot's weld operator"]

  - method: GET
    path: "/mfg/lining-inspections/{id}"
    description: "Reads one inspection record by id, including the SUPERSEDED ones and the records written by the batch-quarantine cascade. The record is immutable, so the response carries no version field."
    roles: [QualityInspector, PlantOperator, PlantAdmin, ComplianceEngineer]
    code: 200
    input: []
    output: LiningInspection
    side_effects: []

  - method: GET
    path: "/mfg/tank-lots/{id}/lining-inspections"
    description: "Sub-resource read: every inspection record ever written against this lot, CURRENT and SUPERSEDED, in created_at ASC order. The only discovery channel for cascade-created and superseded records."
    roles: [QualityInspector, PlantOperator, PlantAdmin, ComplianceEngineer]
    code: 200
    input: ["inspection_type?", "record_status?", "limit?", "offset?"]
    output: LiningInspection[]
    side_effects: []

  # --- HeaterUnit -----------------------------------------------------------
  - method: POST
    path: "/mfg/heater-units"
    description: "Stages one heater unit against a released tank lot and the component lots it will draw from. Its product_model_id is inherited from the tank lot, never supplied."
    roles: [PlantOperator]
    code: 201
    input: [tank_lot_id, safety_valve_lot_id, "gas_control_lot_id?"]
    output: HeaterUnit
    side_effects: ["component category and fuel-type applicability checks", "lot unit-capacity check against the tank lot's good_quantity", "production_period copied from the tank lot"]

  - method: GET
    path: "/mfg/heater-units/{id}"
    description: "Reads one unit with its serial, water-chemistry band and live months_in_service."
    roles: [PlantOperator, QualityInspector, PlantAdmin, WarrantyAnalyst, ComplianceEngineer]
    code: 200
    input: []
    output: HeaterUnit
    side_effects: ["calculations.unit_months_in_service"]

  - method: GET
    path: "/mfg/heater-units"
    description: "Lists units, filterable by any of their four foreign keys plus build_status, production_period or serial_number."
    roles: [PlantOperator, QualityInspector, PlantAdmin, WarrantyAnalyst, ComplianceEngineer]
    code: 200
    input: ["tank_lot_id?", "product_model_id?", "gas_control_lot_id?", "safety_valve_lot_id?", "build_status?", "production_period?", "serial_number?", "limit?", "offset?"]
    output: HeaterUnit[]
    side_effects: []

  - method: POST
    path: "/mfg/heater-units/{id}/assemble"
    description: "Assembles the staged unit, drawing one piece from each referenced component lot."
    roles: [PlantOperator]
    code: 200
    input: []
    output: HeaterUnit
    side_effects: ["each referenced ComponentLot recomputes consumed_quantity and remaining_quantity; a lot reaching remaining_quantity 0 becomes CONSUMED", "requires every referenced lot RELEASED and its supplier QUALIFIED or CONDITIONAL with an unexpired qualification"]

  - method: POST
    path: "/mfg/heater-units/{id}/label"
    description: "Mints the unit's serial number and applies the rating label. Requires BOTH ProductModel dimensions to be favourable."
    roles: [PlantOperator]
    code: 200
    input: []
    output: HeaterUnit
    side_effects: ["calculations.unit_serial_assignment", "label_status = APPLIED", "requires certification_status == CERTIFIED and release_status == RELEASED"]

  - method: POST
    path: "/mfg/heater-units/{id}/ship"
    description: "Ships the labelled unit into a distribution channel, recording the installation water hardness that drives later warranty exposure weighting."
    roles: [PlantOperator]
    code: 200
    input: [install_water_hardness_gpg, distribution_channel]
    output: HeaterUnit
    side_effects: ["calculations.water_hardness_band_factor", "shipped_at = logical clock now", "the ProductModel accrues WARRANTY_ACCRUAL_CENTS_PER_UNIT into warranty_reserve_accrued_cents and warranty_reserve_balance_cents"]

  - method: POST
    path: "/mfg/heater-units/{id}/release-hold"
    description: "Returns a HELD unit to the exact build_status it was held from."
    roles: [PlantOperator]
    code: 200
    input: []
    output: HeaterUnit
    side_effects: ["build_status HELD -> held_from_status, clears held_from_status and hold_reason_code", "the owning ProductModel recomputes held_unit_count"]

  - method: POST
    path: "/mfg/heater-units/{id}/disassemble"
    description: "Scraps a non-shipped unit and returns its drawn component pieces to their lots; terminal."
    roles: [PlantOperator]
    code: 200
    input: [reason_code]
    output: HeaterUnit
    side_effects: ["build_status -> SCRAPPED", "each referenced ComponentLot recomputes consumed_quantity and remaining_quantity, recovering one piece; a lot already in the terminal CONSUMED state is NOT resurrected and stays CONSUMED even though its remaining_quantity is now >= 1", "the owning ProductModel recomputes held_unit_count"]

  # --- WarrantyClaim --------------------------------------------------------
  - method: POST
    path: "/mfg/warranty-claims"
    description: "Files a field warranty claim against a shipped unit, freezing the unit's months in service onto the claim."
    roles: [WarrantyAnalyst]
    code: 201
    input: [heater_unit_id, failure_mode, reported_water_hardness_gpg]
    output: WarrantyClaim
    side_effects: ["months_in_service_at_report frozen from calculations.unit_months_in_service", "requires the unit SHIPPED with a non-null shipped_at"]

  - method: GET
    path: "/mfg/warranty-claims/{id}"
    description: "Reads one claim with its coverage and approved payout."
    roles: [WarrantyAnalyst, PlantAdmin, ComplianceEngineer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: GET
    path: "/mfg/warranty-claims"
    description: "Lists claims, filterable by heater_unit_id, failure_mode or status."
    roles: [WarrantyAnalyst, PlantAdmin, ComplianceEngineer]
    code: 200
    input: ["heater_unit_id?", "failure_mode?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []

  - method: POST
    path: "/mfg/warranty-claims/{id}/validate"
    description: "Adjudicates the claim, prorating the three allowance lines by the coverage the unit's age earns."
    roles: [WarrantyAnalyst]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["calculations.warranty_payout_proration", "refused when the computed coverage_pct is 0.00"]

  - method: POST
    path: "/mfg/warranty-claims/{id}/deny"
    description: "Denies an open claim; terminal."
    roles: [WarrantyAnalyst]
    code: 200
    input: [reason_code]
    output: WarrantyClaim
    side_effects: ["coverage_pct = 0.00 and approved_payout_cents = 0"]

  - method: POST
    path: "/mfg/warranty-claims/{id}/pay"
    description: "Pays a validated claim out of the model's warranty reserve."
    roles: [WarrantyAnalyst]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["calculations.warranty_reserve_ledger debit on the ProductModel", "refused when approved_payout_cents exceeds warranty_reserve_balance_cents"]

  - method: POST
    path: "/mfg/warranty-claims/{id}/reverse-payment"
    description: "COMPENSATING ACTION: reverses a payment, crediting the reserve back and returning the claim to VALIDATED."
    roles: [WarrantyAnalyst]
    code: 200
    input: [reason_code]
    output: WarrantyClaim
    side_effects: ["calculations.warranty_reserve_ledger credit on the ProductModel; accrued is never touched, so the balance == accrued - paid invariant holds end to end"]

  # --- RecallCampaign -------------------------------------------------------
  - method: POST
    path: "/mfg/recall-campaigns"
    description: "Opens a DRAFT recall campaign against one model with a remedy type and an authorized budget."
    roles: [WarrantyAnalyst]
    code: 201
    input: [campaign_code, scope_product_model_id, remedy_type, budget_cents]
    output: RecallCampaign
    side_effects: []

  - method: GET
    path: "/mfg/recall-campaigns/{id}"
    description: "Reads one campaign with its resolved population, cost estimate and both completion percentages."
    roles: [WarrantyAnalyst, PlantAdmin, ComplianceEngineer]
    code: 200
    input: []
    output: RecallCampaign
    side_effects: []

  - method: GET
    path: "/mfg/recall-campaigns"
    description: "Lists campaigns, filterable by scope_product_model_id or status."
    roles: [WarrantyAnalyst, PlantAdmin, ComplianceEngineer]
    code: 200
    input: ["scope_product_model_id?", "status?", "limit?", "offset?"]
    output: RecallCampaign[]
    side_effects: []

  - method: POST
    path: "/mfg/recall-campaigns/{id}/scope"
    description: "Resolves the serial-based population and prices the remedy."
    roles: [WarrantyAnalyst]
    code: 200
    input: [serial_range_start, serial_range_end]
    output: RecallCampaign
    side_effects: ["calculations.recall_scope_resolution", "calculations.recall_remedy_cost", "refused on an empty population, an inverted range, or an estimate above budget_cents"]

  - method: POST
    path: "/mfg/recall-campaigns/{id}/announce"
    description: "Announces the campaign: fans notices out to the shipped population and holds the affected units still inside the plant."
    roles: [WarrantyAnalyst]
    code: 200
    input: []
    output: RecallCampaign
    side_effects: ["one PENDING RecallNotice per affected SHIPPED unit, in unit created_at ASC order", "every affected ASSEMBLED or LABELED unit becomes HELD and gets no notice", "recomputes both completion percentages"]

  - method: POST
    path: "/mfg/recall-campaigns/{id}/close"
    description: "Closes a campaign once the regulatory completion threshold is met and no unit is still held."
    roles: [WarrantyAnalyst]
    code: 200
    input: []
    output: RecallCampaign
    side_effects: ["requires completion_pct_population_based >= 80.00 and no HELD unit in the population"]

  - method: POST
    path: "/mfg/recall-campaigns/{id}/cancel"
    description: "Cancels a campaign that has not been announced; terminal."
    roles: [WarrantyAnalyst]
    code: 200
    input: [reason_code]
    output: RecallCampaign
    side_effects: ["the scope snapshot is retained"]

  - method: GET
    path: "/mfg/recall-campaigns/{id}/completion"
    description: "Computed read: both completion variants side by side with the counts each denominator uses."
    roles: [WarrantyAnalyst, PlantAdmin, ComplianceEngineer]
    code: 200
    input: []
    output: { affected_unit_count: integer, notice_count: integer, remedied_count: integer, unreachable_count: integer, completion_pct_notice_based: number, completion_pct_population_based: number }
    side_effects: ["calculations.recall_completion_rate"]

  # --- RecallNotice ---------------------------------------------------------
  - method: GET
    path: "/mfg/recall-notices/{id}"
    description: "Reads one recall notice."
    roles: [WarrantyAnalyst, PlantAdmin, ComplianceEngineer]
    code: 200
    input: []
    output: RecallNotice
    side_effects: []

  - method: GET
    path: "/mfg/recall-notices"
    description: "Lists notices, filterable by recall_campaign_id, heater_unit_id or status. The only discovery channel for the notices the announce fan-out created."
    roles: [WarrantyAnalyst, PlantAdmin, ComplianceEngineer]
    code: 200
    input: ["recall_campaign_id?", "heater_unit_id?", "status?", "limit?", "offset?"]
    output: RecallNotice[]
    side_effects: []

  - method: POST
    path: "/mfg/recall-notices/{id}/notify"
    description: "Records that the owner was reached."
    roles: [WarrantyAnalyst]
    code: 200
    input: []
    output: RecallNotice
    side_effects: ["notified_at = logical clock now"]

  - method: POST
    path: "/mfg/recall-notices/{id}/remedy"
    description: "Records that the remedy was performed on the unit."
    roles: [WarrantyAnalyst]
    code: 200
    input: []
    output: RecallNotice
    side_effects: ["remedied_at = logical clock now", "BUBBLE UP: the campaign recomputes remedied_count and both completion percentages and moves ANNOUNCED -> IN_REMEDY on the first remedy"]

  - method: POST
    path: "/mfg/recall-notices/{id}/mark-unreachable"
    description: "Records that the owner could not be reached; terminal, and the notice stays in the notice-based denominator."
    roles: [WarrantyAnalyst]
    code: 200
    input: [reason_code]
    output: RecallNotice
    side_effects: ["the campaign recomputes both completion percentages"]

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:

  # --- auth -----------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming an undeclared role"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the caller's role is not listed on the endpoint"
  - id: ERR_SUPPLIER_SCOPE_VIOLATION
    http: 403
    condition: "a SupplierRep reads a Supplier row other than its own, or a ComponentLot whose supplier_id is not its own"

  # --- existence ------------------------------------------------------------
  - id: ERR_SUPPLIER_NOT_FOUND
    http: 404
    condition: "no Supplier with the given id"
  - id: ERR_COMPONENT_LOT_NOT_FOUND
    http: 404
    condition: "no ComponentLot with the given id"
  - id: ERR_FURNACE_NOT_FOUND
    http: 404
    condition: "no Furnace with the given id"
  - id: ERR_GLASS_LINING_BATCH_NOT_FOUND
    http: 404
    condition: "no GlassLiningBatch with the given id"
  - id: ERR_TANK_LOT_NOT_FOUND
    http: 404
    condition: "no TankLot with the given id"
  - id: ERR_LINING_INSPECTION_NOT_FOUND
    http: 404
    condition: "no LiningInspection with the given id"
  - id: ERR_PRODUCT_MODEL_NOT_FOUND
    http: 404
    condition: "no ProductModel with the given id, including a base_model_id that does not resolve"
  - id: ERR_TEST_CELL_NOT_FOUND
    http: 404
    condition: "no TestCell with the given id"
  - id: ERR_EFFICIENCY_TEST_NOT_FOUND
    http: 404
    condition: "no EfficiencyTest with the given id"
  - id: ERR_RATING_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "no RatingCertification with the given id"
  - id: ERR_HEATER_UNIT_NOT_FOUND
    http: 404
    condition: "no HeaterUnit with the given id"
  - id: ERR_WARRANTY_CLAIM_NOT_FOUND
    http: 404
    condition: "no WarrantyClaim with the given id"
  - id: ERR_RECALL_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "no RecallCampaign with the given id"
  - id: ERR_RECALL_NOTICE_NOT_FOUND
    http: 404
    condition: "no RecallNotice with the given id"

  # --- schema ---------------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required input, wrong JSON type, enum value outside the declared set, number outside its declared range, empty or over-long string, malformed timestamp, or pagination limit/offset outside 1..100 / >= 0"

  # --- concurrency ----------------------------------------------------------
  - id: ERR_STALE_PARENT_VERSION
    http: 412
    condition: "expected_product_model_version or expected_tank_lot_version does not equal the parent's current version"

  # --- state ----------------------------------------------------------------
  - id: ERR_INVALID_SUPPLIER_STATE
    http: 409
    condition: "the Supplier's qualification_status does not permit this action (e.g. qualifying an already QUALIFIED supplier, requalifying one that is not DISQUALIFIED)"
  - id: ERR_INVALID_COMPONENT_LOT_STATE
    http: 409
    condition: "the ComponentLot's status does not permit this action (e.g. releasing a REJECTED lot, unblocking a lot that is not BLOCKED)"
  - id: ERR_INVALID_BATCH_STATE
    http: 409
    condition: "the GlassLiningBatch's status does not permit this action (e.g. firing an already FIRED batch)"
  - id: ERR_INVALID_TANK_LOT_STATE
    http: 409
    condition: "the TankLot's status does not permit this action (e.g. foaming a lot that has not passed both inspections, welding twice, releasing an unjacketed lot)"
  - id: ERR_INVALID_MODEL_STATE
    http: 409
    condition: "the ProductModel dimension this trigger drives does not permit the action (e.g. releasing an already RELEASED model, lifting a restriction on a model that is not RESTRICTED, withdrawing a DRAFT model, suspending a certification that is not CERTIFIED)"
  - id: ERR_INVALID_TEST_STATE
    http: 409
    condition: "the EfficiencyTest is not SCHEDULED, so no result may be recorded"
  - id: ERR_INVALID_CERTIFICATION_STATE
    http: 409
    condition: "the RatingCertification's status does not permit this action (e.g. approving a DRAFT, revoking a SUPERSEDED certification)"
  - id: ERR_INVALID_UNIT_STATE
    http: 409
    condition: "the HeaterUnit's build_status does not permit this action (e.g. labelling a COMPONENTS_STAGED unit, shipping a HELD unit, releasing a hold on a unit that is not HELD)"
  - id: ERR_INVALID_CLAIM_STATE
    http: 409
    condition: "the WarrantyClaim's status does not permit this action (e.g. paying an OPEN claim, reversing a payment on a VALIDATED claim)"
  - id: ERR_INVALID_CAMPAIGN_STATE
    http: 409
    condition: "the RecallCampaign's status does not permit this action (e.g. announcing a DRAFT campaign, cancelling an ANNOUNCED one, re-scoping a SCOPED one)"
  - id: ERR_INVALID_NOTICE_STATE
    http: 409
    condition: "the RecallNotice's status does not permit this action (e.g. remedying a PENDING notice, notifying a REMEDIED one)"

  # --- segregation of duties ------------------------------------------------
  - id: ERR_SOD_APPROVER_IS_SUBMITTER
    http: 403
    condition: "the X-User-ID approving or rejecting a certification equals its submitted_by_user_id"
  - id: ERR_SOD_INSPECTOR_IS_WELDER
    http: 403
    condition: "the X-User-ID recording a lining inspection equals the lot's weld_operator_user_id"

  # --- business safety ------------------------------------------------------
  - id: ERR_COMPONENT_SUPPLIER_NOT_QUALIFIED
    http: 409
    condition: "a referenced component lot is not RELEASED, or its supplier's qualification_status is PENDING or DISQUALIFIED"
  - id: ERR_QUALIFICATION_EXPIRED
    http: 409
    condition: "the supplier's qualified_until is strictly before the logical clock (the expiry instant itself still qualifies)"
  - id: ERR_MODEL_NOT_CERTIFIED
    http: 409
    condition: "the unit's ProductModel.certification_status is not CERTIFIED at labelling time"
  - id: ERR_MODEL_NOT_RELEASED
    http: 409
    condition: "the unit's ProductModel.release_status is not RELEASED, or the requested distribution_channel differs from the model's channel"
  - id: ERR_BASE_MODEL_NOT_RELEASED
    http: 409
    condition: "a private-label variant is released while its base model is still DRAFT or already WITHDRAWN"
  - id: ERR_BATCH_NOT_FIRED
    http: 409
    condition: "the GlassLiningBatch named on an apply-lining call is not FIRED"
  - id: ERR_UNIT_NOT_IN_SERVICE
    http: 409
    condition: "a warranty claim is filed against a unit whose build_status is not SHIPPED or whose shipped_at is null"

  # --- business constraints -------------------------------------------------
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "a furnace_code, batch_code, part_number+supplier pair, lot_code, cell_code, model_code or campaign_code already exists"
  - id: ERR_COMPONENT_CATEGORY_MISMATCH
    http: 422
    condition: "gas_control_lot_id references a lot whose category is not GAS_VALVE, or safety_valve_lot_id one whose category is not TP_RELIEF_VALVE"
  - id: ERR_GAS_CONTROL_REQUIRED
    http: 422
    condition: "a unit is staged for a GAS model without gas_control_lot_id"
  - id: ERR_GAS_CONTROL_NOT_APPLICABLE
    http: 422
    condition: "a unit is staged for an ELECTRIC or HEAT_PUMP model with a gas_control_lot_id supplied"
  - id: ERR_PRIVATE_LABEL_BASE_INVALID
    http: 422
    condition: "is_private_label is true without a base_model_id, or with a base model that is itself private label or differs in fuel_type or nominal_capacity_gallons; or is_private_label is false with a base_model_id supplied"
  - id: ERR_SUPPLIER_SCORE_BELOW_FLOOR
    http: 422
    condition: "the computed qualification_score is below CONDITIONAL_SCORE_FLOOR (70.00)"
  - id: ERR_SAMPLE_SIZE_INSUFFICIENT
    http: 422
    condition: "an inspection sample_size is below max(3, ceil(planned_quantity * 0.05))"
  - id: ERR_INSUFFICIENT_TEST_SAMPLE
    http: 409
    condition: "a certification is submitted with fewer than 3 PASSED UEF tests, or with no PASSED FIRST_HOUR_RATING or no PASSED RECOVERY test"
  - id: ERR_REWORK_LIMIT_EXCEEDED
    http: 409
    condition: "a reline is authorized when rework_count already equals MAX_REWORK_CYCLES (2)"
  - id: ERR_REWORK_REVERSAL_NOT_ALLOWED
    http: 409
    condition: "a rework reversal is attempted on a cascade-rejected lot or on a lot whose GlassLiningBatch is QUARANTINED"
  - id: ERR_FOAM_THICKNESS_BELOW_MINIMUM
    http: 422
    condition: "foam_thickness_mm is below MIN_FOAM_THICKNESS_MM (40)"
  - id: ERR_INSULATION_R_VALUE_SHORTFALL
    http: 409
    condition: "the achieved R-value from the foam pass is below the ProductModel.insulation_r_value the model was certified against"
  - id: ERR_LOT_UNIT_CAPACITY_EXCEEDED
    http: 409
    condition: "staging one more unit would exceed the tank lot's good_quantity"
  - id: ERR_FIRING_TEMP_EXCEEDS_FURNACE_MAX
    http: 422
    condition: "firing_temp_c exceeds the furnace's max_firing_temp_c"
  - id: ERR_RECALL_SCOPE_EMPTY
    http: 422
    condition: "the resolved serial range matches no labelled unit of the scoped model"
  - id: ERR_SERIAL_RANGE_INVALID
    http: 422
    condition: "serial_range_start is lexicographically greater than serial_range_end"
  - id: ERR_RECALL_BUDGET_EXCEEDED
    http: 402
    condition: "the estimated remedy cost exceeds the campaign's budget_cents"
  - id: ERR_WARRANTY_COVERAGE_EXPIRED
    http: 422
    condition: "the claim's computed coverage_pct is 0.00, so there is nothing to validate"
  - id: ERR_WARRANTY_RESERVE_INSUFFICIENT
    http: 402
    condition: "approved_payout_cents exceeds the model's warranty_reserve_balance_cents"
  - id: ERR_COMPLETION_BELOW_THRESHOLD
    http: 409
    condition: "a campaign is closed while completion_pct_population_based is below 80.00"
  - id: ERR_HELD_UNITS_REMAIN
    http: 409
    condition: "a campaign is closed, or a model restriction lifted, while at least one unit is still HELD"

  # --- business temporal ----------------------------------------------------
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "a submitted window has start at or after end"
  - id: ERR_FURNACE_WINDOW_CONFLICT
    http: 409
    condition: "the requested firing window overlaps an existing non-terminal batch window on the same furnace; touching at the boundary is not an overlap"
  - id: ERR_TEST_CELL_CAPACITY_CONFLICT
    http: 409
    condition: "the requested test window would exceed the cell's parallel_slots"
  - id: ERR_TEST_CELL_COOLDOWN_VIOLATION
    http: 409
    condition: "the requested test window starts less than cooldown_hours after the cell's previous window for the same ProductModel"
  - id: ERR_TEST_WINDOW_NOT_ELAPSED
    http: 409
    condition: "a result is recorded before the logical clock reaches the test's window_end"
  - id: ERR_FIRING_WINDOW_NOT_ELAPSED
    http: 409
    condition: "a glass-lining batch is fired before the logical clock reaches its firing_end"
  - id: ERR_BLOCKED_LOTS_REMAIN
    http: 409
    condition: "a PENDING supplier is scored QUALIFIED or CONDITIONAL while its blocked_lot_count is still greater than 0"

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix — segregation_of_duties
# -----------------------------------------------------------------------------
roles:

  - name: PlantAdmin
    description: "Plant systems administrator: owns the asset master data (furnaces, test cells), the logical clock, and the release posture of the catalogue."
    identity: "opaque"
    exclusive_operations:
      - "POST /mfg/_clock/set_current_utc"
      - "POST /mfg/furnaces"
      - "POST /mfg/test-cells"
      - "POST /mfg/product-models/{id}/lift-restriction"
    shared_operations:
      - "every GET endpoint except the SupplierRep-scoped reads"

  - name: PlantOperator
    description: "Production operator: fabricates, lines, foams, jackets and releases tank lots, and stages, assembles, labels and ships heater units."
    identity: "opaque"
    exclusive_operations:
      - "POST /mfg/glass-lining-batches"
      - "POST /mfg/glass-lining-batches/{id}/fire"
      - "POST /mfg/tank-lots"
      - "POST /mfg/tank-lots/{id}/weld"
      - "POST /mfg/tank-lots/{id}/apply-lining"
      - "POST /mfg/tank-lots/{id}/authorize-reline"
      - "POST /mfg/tank-lots/{id}/foam"
      - "POST /mfg/tank-lots/{id}/jacket"
      - "POST /mfg/tank-lots/{id}/release"
      - "POST /mfg/heater-units"
      - "POST /mfg/heater-units/{id}/assemble"
      - "POST /mfg/heater-units/{id}/label"
      - "POST /mfg/heater-units/{id}/ship"
      - "POST /mfg/heater-units/{id}/release-hold"
      - "POST /mfg/heater-units/{id}/disassemble"
    shared_operations:
      - "production, catalogue, supplier and unit GET endpoints"

  - name: QualityInspector
    description: "Quality inspector: signs lining adhesion and holiday inspections, releases or rejects incoming component lots, records efficiency test results, and owns the two compensating quality actions."
    identity: "opaque"
    exclusive_operations:
      - "POST /mfg/lining-inspections"
      - "POST /mfg/tank-lots/{id}/rework-reversal"
      - "POST /mfg/tank-lots/{id}/scrap"
      - "POST /mfg/component-lots/{id}/release"
      - "POST /mfg/component-lots/{id}/reject"
      - "POST /mfg/efficiency-tests/{id}/record-result"
    shared_operations:
      - "POST /mfg/component-lots"
      - "production, catalogue, supplier and test GET endpoints"
    note: "Segregation of duties: an inspector who is also the lot's weld operator is rejected on the inspection, and the record-result / certification-submit split keeps measurement away from publication."

  - name: ComplianceEngineer
    description: "Efficiency-standards engineer: owns the model catalogue, schedules the compliance test programme, prepares certifications and drives channel release."
    identity: "opaque"
    exclusive_operations:
      - "POST /mfg/product-models"
      - "POST /mfg/product-models/{id}/release-to-channel"
      - "POST /mfg/product-models/{id}/withdraw"
      - "POST /mfg/efficiency-tests"
      - "POST /mfg/rating-certifications"
      - "POST /mfg/rating-certifications/{id}/submit"
    shared_operations:
      - "GET /mfg/product-models/{id}/warranty-analysis"
      - "GET /mfg/recall-campaigns/{id}/completion"
      - "catalogue, test, certification, production, unit, claim and recall GET endpoints"

  - name: CertificationApprover
    description: "Independent rating-certification approver: the only role that can certify, suspend, de-certify or reject a published rating. Cannot prepare the certification it approves."
    identity: "opaque"
    exclusive_operations:
      - "POST /mfg/rating-certifications/{id}/approve"
      - "POST /mfg/rating-certifications/{id}/reject"
      - "POST /mfg/rating-certifications/{id}/revoke"
      - "POST /mfg/product-models/{id}/suspend-certification"
    shared_operations:
      - "catalogue, test and certification GET endpoints"
    note: "Segregation of duties: approve and reject are refused when X-User-ID equals the certification's submitted_by_user_id."

  - name: SupplierQualityManager
    description: "Supplier quality manager: registers, scores, disqualifies and requalifies component suppliers, books incoming lots and unblocks contained ones."
    identity: "opaque"
    exclusive_operations:
      - "POST /mfg/suppliers"
      - "POST /mfg/suppliers/{id}/qualify"
      - "POST /mfg/suppliers/{id}/disqualify"
      - "POST /mfg/suppliers/{id}/requalify"
      - "POST /mfg/component-lots/{id}/unblock"
    shared_operations:
      - "POST /mfg/component-lots"
      - "supplier and component-lot GET endpoints"

  - name: WarrantyAnalyst
    description: "Warranty and recall analyst: adjudicates and pays field claims, analyses tank failures by production period and water chemistry, and runs recall campaigns end to end."
    identity: "opaque"
    exclusive_operations:
      - "POST /mfg/warranty-claims"
      - "POST /mfg/warranty-claims/{id}/validate"
      - "POST /mfg/warranty-claims/{id}/deny"
      - "POST /mfg/warranty-claims/{id}/pay"
      - "POST /mfg/warranty-claims/{id}/reverse-payment"
      - "POST /mfg/recall-campaigns"
      - "POST /mfg/recall-campaigns/{id}/scope"
      - "POST /mfg/recall-campaigns/{id}/announce"
      - "POST /mfg/recall-campaigns/{id}/close"
      - "POST /mfg/recall-campaigns/{id}/cancel"
      - "POST /mfg/recall-notices/{id}/notify"
      - "POST /mfg/recall-notices/{id}/remedy"
      - "POST /mfg/recall-notices/{id}/mark-unreachable"
    shared_operations:
      - "GET /mfg/product-models/{id}/warranty-analysis"
      - "GET /mfg/recall-campaigns/{id}/completion"
      - "catalogue, unit, claim, certification and recall GET endpoints"

  - name: SupplierRep
    description: "External supplier representative, acting as one Supplier row. Read-only, and only over its own supplier record and its own component lots."
    identity: "entity_backed:Supplier"
    exclusive_operations: []
    shared_operations:
      - "GET /mfg/suppliers/{id}"
      - "GET /mfg/component-lots/{id}"
      - "GET /mfg/component-lots"
    note: "X-User-ID equals a Supplier.id. Any read outside that scope returns ERR_SUPPLIER_SCOPE_VIOLATION, and the role appears on no POST endpoint."
