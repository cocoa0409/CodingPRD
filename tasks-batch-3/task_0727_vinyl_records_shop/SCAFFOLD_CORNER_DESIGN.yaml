scaffold_corner_design:
  # =================================================================
  # Entities
  # =================================================================
  - section: entities
    instances:
      - name: create_product_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Product, endpoints]
        distinguishing_aspect: "POST /shop/products with all required fields returns 201 and a Product whose catalog_status defaults to DRAFT and version == 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /shop/products"
              payload: { artist: "Prince", title: "Purple Rain", format: "VINYL", base_price_cents: 2500 }
              as: Manager
              captures: { pid: "$.data.id" }
          assert:
            - "response.status == 201"
            - "Product.${pid}.catalog_status == DRAFT"
            - "Product.${pid}.version == 1"

      - name: get_customer_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Customer, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /shop/customers/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /shop/customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Manager
              captures: { nf: "$.data.error_id" }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_product_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Product, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /shop/products missing base_price_cents returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /shop/products"
              payload: { artist: "Prince", title: "1999", format: "VINYL" }
              as: Manager
              captures: { ir: "$.data.error_id" }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: item_list_price_computed_ignores_client_input
        claim_type: Computed Fields
        grounds: [entities.InventoryItem.fields.list_price_cents, calculations.item_list_price]
        distinguishing_aspect: "list_price_cents is server-computed: a NM copy of a base-2000 product lists at exactly 2000 regardless of any client-sent price."
        test_recipe:
          setup: ["A base-2000 product exists."]
          setup_api_calls:
            - call: "POST /shop/products"
              payload: { artist: "U2", title: "Achtung Baby", format: "CD", base_price_cents: 2000 }
              as: Manager
              captures: { up_id: "$.data.id" }
          trigger:
            - call: "POST /shop/inventory-items"
              payload: { product_id: "${up_id}", is_used: false, condition_grade: "NM" }
              as: StoreClerk
              captures: { ui_id: "$.data.id" }
          assert:
            - "InventoryItem.${ui_id}.list_price_cents == 2000"

      - name: list_products_pagination_envelope
        claim_type: Listing
        grounds: [entities.Product, response_envelope]
        distinguishing_aspect: "GET /shop/products returns a paginated array envelope with total_count and has_more fields present."
        test_recipe:
          setup: ["Two products exist."]
          setup_api_calls:
            - call: "POST /shop/products"
              payload: { artist: "A1", title: "T1", format: "VINYL", base_price_cents: 1000 }
              as: Manager
            - call: "POST /shop/products"
              payload: { artist: "A2", title: "T2", format: "CD", base_price_cents: 1200 }
              as: Manager
          trigger:
            - call: "GET /shop/products?limit=1&offset=0"
              payload: {}
              as: Anonymous
          assert:
            - "response.status == 200"
            - "response.meta contains total_count and has_more"
            - "len(response.data) == 1"

  # =================================================================
  # State Machines
  # =================================================================
  - section: state_machines
    instances:
      - name: cancel_preorder_twice_from_cancelled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.PreOrder.RESERVED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED pre-order cancelled again returns ERR_INVALID_STATE (409); no allocation counts change on the second attempt."
        test_recipe:
          setup: ["An allocation_total=2 pool; one RESERVED pre-order already cancelled."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "sm1@x.com", full_name: "SM One" }
              as: Anonymous
              captures: { sm1_id: "$.data.id" }
            - call: "POST /shop/products"
              payload: { artist: "RSD-SM", title: "SM LP", format: "VINYL", base_price_cents: 4000, is_rsd_exclusive: true }
              as: Manager
              captures: { smp_id: "$.data.id" }
            - call: "POST /shop/products/${smp_id}/allocations"
              payload: { allocation_total: 2, window_open_at: "2026-03-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z" }
              as: Manager
              captures: { sma_id: "$.data.id", sma_v0: "$.data.version" }
            - call: "POST /shop/pre-orders"
              payload: { customer_id: "${sm1_id}", product_id: "${smp_id}", allocation_id: "${sma_id}", pickup_window_start: "2026-04-01T09:00:00Z", pickup_window_end: "2026-04-01T17:00:00Z", expected_allocation_version: "${sma_v0}" }
              as: Customer
              as_user_id: "${sm1_id}"
              captures: { smpo_id: "$.data.id" }
            - call: "POST /shop/pre-orders/${smpo_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${sm1_id}"
          trigger:
            - call: "POST /shop/pre-orders/${smpo_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${sm1_id}"
              captures: { smerr: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Allocation.${sma_id}.available_count == 2"

      - name: newly_created_order_starts_in_initial_states
        claim_type: Initial State
        grounds: [state_machines.Order, entities.Order.fields.payment_status, entities.Order.fields.fulfillment_status]
        distinguishing_aspect: "A newly created Order starts payment_status=UNPAID and fulfillment_status=PENDING."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "init@x.com", full_name: "Init" }
              as: Anonymous
              captures: { in_id: "$.data.id" }
          trigger:
            - call: "POST /shop/orders"
              payload: { customer_id: "${in_id}", channel: "ONLINE" }
              as: Customer
              as_user_id: "${in_id}"
              captures: { ino_id: "$.data.id" }
          assert:
            - "Order.${ino_id}.payment_status == UNPAID"
            - "Order.${ino_id}.fulfillment_status == PENDING"

      - name: fulfill_online_order_wrong_channel_returns_invalid_state
        claim_type: guarded transitions
        grounds: [state_machines.Order.RESERVED_to_PICKED_UP]
        distinguishing_aspect: "POST /orders/{id}/fulfill on an ONLINE (not IN_STORE) paid order is rejected because the PICKED_UP transition requires channel==IN_STORE."
        test_recipe:
          setup: ["An ONLINE order, one NM line, payment PAID, fulfillment RESERVED."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "wc@x.com", full_name: "Wrong Channel" }
              as: Anonymous
              captures: { wc_id: "$.data.id" }
            - call: "POST /shop/products"
              payload: { artist: "Toto", title: "IV", format: "VINYL", base_price_cents: 3000 }
              as: Manager
              captures: { tp_id: "$.data.id" }
            - call: "POST /shop/inventory-items"
              payload: { product_id: "${tp_id}", is_used: false, condition_grade: "NM" }
              as: StoreClerk
              captures: { ti_id: "$.data.id" }
            - call: "POST /shop/orders"
              payload: { customer_id: "${wc_id}", channel: "ONLINE" }
              as: Customer
              as_user_id: "${wc_id}"
              captures: { wo_id: "$.data.id" }
            - call: "POST /shop/orders/${wo_id}/lines"
              payload: { inventory_item_id: "${ti_id}" }
              as: Customer
              as_user_id: "${wc_id}"
            - call: "POST /shop/orders/${wo_id}/authorize-payment"
              payload: {}
              as: Customer
              as_user_id: "${wc_id}"
            - call: "POST /shop/orders/${wo_id}/capture-payment"
              payload: {}
              as: StoreClerk
          trigger:
            - call: "POST /shop/orders/${wo_id}/fulfill"
              payload: {}
              as: StoreClerk
              captures: { wcerr: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DEPENDENCY_NOT_READY"

      - name: dispute_regrade_cascade_covered_by_difficulty
        claim_type: Cross-entity
        grounds: [state_machines.GradingDispute.UNDER_REVIEW_to_RESOLVED_REGRADE]
        excluded_because:
          difficulty_instance: transitive_cascade / dispute_regrade_cascade_depth3
          rationale: "The regrade -> price -> order-total cascade is fully asserted by the named §1.8 instance."

  # =================================================================
  # Calculations
  # =================================================================
  - section: calculations
    instances:
      - name: item_list_price_used_vg_multiplier
        claim_type: Correct Result
        grounds: [calculations.item_list_price, entities.InventoryItem.fields.list_price_cents]
        distinguishing_aspect: "A used VG copy of a base-2000 product lists at 1200 (2000 * 0.60)."
        test_recipe:
          setup: ["A base-2000 product exists."]
          setup_api_calls:
            - call: "POST /shop/products"
              payload: { artist: "Genesis", title: "Duke", format: "VINYL", base_price_cents: 2000 }
              as: Manager
              captures: { gp_id: "$.data.id" }
          trigger:
            - call: "POST /shop/inventory-items"
              payload: { product_id: "${gp_id}", is_used: true, condition_grade: "VG" }
              as: StoreClerk
              captures: { gi_id: "$.data.id" }
          assert:
            - "InventoryItem.${gi_id}.list_price_cents == 1200"

      - name: new_item_price_floored_at_base
        claim_type: Constants Applied
        grounds: [calculations.item_list_price]
        distinguishing_aspect: "A NEW (is_used=false) M-grade copy of base-2000: multiplier 1.10 gives 2200, above base, so it stays 2200 (floor clause does not lower it)."
        test_recipe:
          setup: ["A base-2000 product exists."]
          setup_api_calls:
            - call: "POST /shop/products"
              payload: { artist: "Rush", title: "Moving Pictures", format: "VINYL", base_price_cents: 2000 }
              as: Manager
              captures: { ru_id: "$.data.id" }
          trigger:
            - call: "POST /shop/inventory-items"
              payload: { product_id: "${ru_id}", is_used: false, condition_grade: "M" }
              as: StoreClerk
              captures: { rui_id: "$.data.id" }
          assert:
            - "InventoryItem.${rui_id}.list_price_cents == 2200"

      - name: loyalty_points_gold_multiplier
        claim_type: Correct Result
        grounds: [calculations.loyalty_points_earned, entities.Order.fields.points_earned]
        distinguishing_aspect: "A GOLD buyer paying a 5400-cent order earns floor(54 * 1.5) = 81 points, awarded at capture."
        test_recipe:
          setup: ["A GOLD buyer (500 points) with an IN_STORE order of three NEW NM base-2000 copies (subtotal 6000, GOLD 10% discount 600, free ship, total 5400), authorized."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "gp@x.com", full_name: "Gold Points" }
              as: Anonymous
              captures: { gpc_id: "$.data.id" }
            - call: "POST /shop/_loyalty/adjust-points"
              payload: { customer_id: "${gpc_id}", delta_points: 500 }
              as: Manager
            - call: "POST /shop/products"
              payload: { artist: "Yes", title: "Fragile", format: "VINYL", base_price_cents: 2000 }
              as: Manager
              captures: { yp_id: "$.data.id" }
            - call: "POST /shop/inventory-items"
              payload: { product_id: "${yp_id}", is_used: false, condition_grade: "NM" }
              as: StoreClerk
              captures: { yi1: "$.data.id" }
            - call: "POST /shop/inventory-items"
              payload: { product_id: "${yp_id}", is_used: false, condition_grade: "NM" }
              as: StoreClerk
              captures: { yi2: "$.data.id" }
            - call: "POST /shop/inventory-items"
              payload: { product_id: "${yp_id}", is_used: false, condition_grade: "NM" }
              as: StoreClerk
              captures: { yi3: "$.data.id" }
            - call: "POST /shop/orders"
              payload: { customer_id: "${gpc_id}", channel: "IN_STORE" }
              as: Customer
              as_user_id: "${gpc_id}"
              captures: { go_id: "$.data.id" }
            - call: "POST /shop/orders/${go_id}/lines"
              payload: { inventory_item_id: "${yi1}" }
              as: Customer
              as_user_id: "${gpc_id}"
            - call: "POST /shop/orders/${go_id}/lines"
              payload: { inventory_item_id: "${yi2}" }
              as: Customer
              as_user_id: "${gpc_id}"
            - call: "POST /shop/orders/${go_id}/lines"
              payload: { inventory_item_id: "${yi3}" }
              as: Customer
              as_user_id: "${gpc_id}"
            - call: "POST /shop/orders/${go_id}/authorize-payment"
              payload: {}
              as: Customer
              as_user_id: "${gpc_id}"
          trigger:
            - call: "POST /shop/orders/${go_id}/capture-payment"
              payload: {}
              as: StoreClerk
          assert:
            - "Order.${go_id}.total_cents == 5400"
            - "Order.${go_id}.points_earned == 81"
            - "Customer.${gpc_id}.loyalty_points == 581"

  # =================================================================
  # Validations
  # =================================================================
  - section: validations
    instances:
      - name: new_item_invalid_grade_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=9]", "errors[ERR_INVALID_GRADE_FOR_NEW]"]
        distinguishing_aspect: "Creating a NEW (is_used=false) item graded VG returns ERR_INVALID_GRADE_FOR_NEW (422); NEW must be M or NM."
        test_recipe:
          setup: ["A product exists."]
          setup_api_calls:
            - call: "POST /shop/products"
              payload: { artist: "Kraftwerk", title: "Autobahn", format: "VINYL", base_price_cents: 2000 }
              as: Manager
              captures: { kp_id: "$.data.id" }
          trigger:
            - call: "POST /shop/inventory-items"
              payload: { product_id: "${kp_id}", is_used: false, condition_grade: "VG" }
              as: StoreClerk
              captures: { kerr: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_GRADE_FOR_NEW"

      - name: trade_in_approve_incomplete_inspection_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=10]", "errors[ERR_INSPECTION_INCOMPLETE]", state_machines.TradeIn.UNDER_INSPECTION_to_APPROVED]
        distinguishing_aspect: "Approving a trade-in with a line lacking inspected_grade returns ERR_INSPECTION_INCOMPLETE (422)."
        test_recipe:
          setup: ["A CASH trade-in with two lines, submitted and under inspection, only one line graded."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "inc@x.com", full_name: "Incomplete" }
              as: Anonymous
              captures: { inc_id: "$.data.id" }
            - call: "POST /shop/trade-ins"
              payload: { customer_id: "${inc_id}", payout_method: "CASH" }
              as: Customer
              as_user_id: "${inc_id}"
              captures: { incti_id: "$.data.id" }
            - call: "POST /shop/trade-ins/${incti_id}/lines"
              payload: { format: "VINYL", claimed_grade: "NM", base_value_cents: 1000 }
              as: Customer
              as_user_id: "${inc_id}"
              captures: { incl1: "$.data.id" }
            - call: "POST /shop/trade-ins/${incti_id}/lines"
              payload: { format: "CD", claimed_grade: "VG", base_value_cents: 800 }
              as: Customer
              as_user_id: "${inc_id}"
              captures: { incl2: "$.data.id" }
            - call: "POST /shop/trade-ins/${incti_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${inc_id}"
            - call: "POST /shop/trade-ins/${incti_id}/start-inspection"
              payload: {}
              as: Grader
            - call: "PATCH /shop/trade-in-lines/${incl1}"
              payload: { inspected_grade: "NM" }
              as: Grader
          trigger:
            - call: "POST /shop/trade-ins/${incti_id}/approve"
              payload: {}
              as: Grader
              captures: { incerr: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INSPECTION_INCOMPLETE"

      - name: slot_inactive_activation_rejected
        claim_type: Conditional validation
        grounds: ["validations[priority=8]", "errors[ERR_SLOT_INACTIVE]", state_machines.Consignment.DRAFT_to_ACTIVE]
        distinguishing_aspect: "Activating a consignment onto a retired (is_active=false) DisplaySlot returns ERR_SLOT_INACTIVE (409)."
        test_recipe:
          setup: ["A retired display slot; a DRAFT consignment booked onto it."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "si@x.com", full_name: "Slot Inactive" }
              as: Anonymous
              captures: { si_id: "$.data.id" }
            - call: "POST /shop/products"
              payload: { artist: "Sade", title: "Diamond Life", format: "VINYL", base_price_cents: 2000 }
              as: Manager
              captures: { sap_id: "$.data.id" }
            - call: "POST /shop/display-slots"
              payload: { slot_label: "Retired B", is_active: false }
              as: Manager
              captures: { rslot_id: "$.data.id" }
            - call: "POST /shop/consignments"
              payload: { consignor_id: "${si_id}", list_price_cents: 5000, product_id: "${sap_id}", condition_grade: "VG", display_slot_id: "${rslot_id}", display_start: "2026-03-01T00:00:00Z", display_end: "2026-03-10T00:00:00Z" }
              as: Manager
              captures: { sicons_id: "$.data.id" }
          trigger:
            - call: "POST /shop/consignments/${sicons_id}/activate"
              payload: {}
              as: Manager
              captures: { sierr: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SLOT_INACTIVE"

      - name: capture_over_credit_beaten_by_state_covered
        claim_type: Priority ordering
        grounds: ["validations[priority=5]", "validations[priority=12]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_on_capture
          rationale: "The state-vs-fiscal priority ordering on capture is exactly the named §1.8 instance."

  # =================================================================
  # Endpoints
  # =================================================================
  - section: endpoints
    instances:
      - name: add_order_line_reserves_item_side_effect
        claim_type: Action endpoint
        grounds: [endpoints, state_machines.InventoryItem.AVAILABLE_to_RESERVED, entities.OrderLine.fields.unit_price_cents]
        distinguishing_aspect: "POST /orders/{id}/lines flips the added InventoryItem to RESERVED and snapshots its list_price into OrderLine.unit_price_cents."
        test_recipe:
          setup: ["An ONLINE order and one AVAILABLE NM base-3000 item (lists at 3000)."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "line@x.com", full_name: "Liner" }
              as: Anonymous
              captures: { l_id: "$.data.id" }
            - call: "POST /shop/products"
              payload: { artist: "Blur", title: "Parklife", format: "VINYL", base_price_cents: 3000 }
              as: Manager
              captures: { blp_id: "$.data.id" }
            - call: "POST /shop/inventory-items"
              payload: { product_id: "${blp_id}", is_used: false, condition_grade: "NM" }
              as: StoreClerk
              captures: { bli_id: "$.data.id" }
            - call: "POST /shop/orders"
              payload: { customer_id: "${l_id}", channel: "ONLINE" }
              as: Customer
              as_user_id: "${l_id}"
              captures: { blo_id: "$.data.id" }
          trigger:
            - call: "POST /shop/orders/${blo_id}/lines"
              payload: { inventory_item_id: "${bli_id}" }
              as: Customer
              as_user_id: "${l_id}"
              captures: { bll_id: "$.data.id" }
          assert:
            - "response.status == 201"
            - "OrderLine.${bll_id}.unit_price_cents == 3000"
            - "InventoryItem.${bli_id}.status == RESERVED"
            - "Order.${blo_id}.fulfillment_status == RESERVED"

      - name: fk_reverse_list_inventory_by_product
        claim_type: Computed read
        grounds: [endpoints, entities.InventoryItem.fields.product_id]
        distinguishing_aspect: "GET /shop/inventory-items?product_id=X returns exactly the copies of product X as an array."
        test_recipe:
          setup: ["A product with two inventory items."]
          setup_api_calls:
            - call: "POST /shop/products"
              payload: { artist: "Oasis", title: "Definitely Maybe", format: "CD", base_price_cents: 1500 }
              as: Manager
              captures: { oa_id: "$.data.id" }
            - call: "POST /shop/inventory-items"
              payload: { product_id: "${oa_id}", is_used: true, condition_grade: "VG" }
              as: StoreClerk
            - call: "POST /shop/inventory-items"
              payload: { product_id: "${oa_id}", is_used: false, condition_grade: "NM" }
              as: StoreClerk
          trigger:
            - call: "GET /shop/inventory-items?product_id=${oa_id}"
              payload: {}
              as: Anonymous
          assert:
            - "response.status == 200"
            - "len(response.data) == 2"

  # =================================================================
  # Errors
  # =================================================================
  - section: errors
    instances:
      - name: special_order_cancel_forfeits_deposit
        claim_type: violation_to_error
        grounds: [state_machines.SpecialOrder.REQUESTED_to_CANCELLED, entities.SpecialOrder.fields.deposit_cents]
        distinguishing_aspect: "Cancelling a REQUESTED special order transitions it to CANCELLED; the non-refundable deposit is not credited back to the customer."
        test_recipe:
          setup: ["A customer with a REQUESTED special order carrying a 500 deposit and 0 store credit."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "spo@x.com", full_name: "Special" }
              as: Anonymous
              captures: { spo_id: "$.data.id" }
            - call: "POST /shop/special-orders"
              payload: { customer_id: "${spo_id}", description: "rare pressing", deposit_cents: 500 }
              as: Customer
              as_user_id: "${spo_id}"
              captures: { so_id: "$.data.id" }
          trigger:
            - call: "POST /shop/special-orders/${so_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${spo_id}"
          assert:
            - "SpecialOrder.${so_id}.status == CANCELLED"
            - "Customer.${spo_id}.store_credit_cents == 0"

      - name: error_stale_version_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]", "concurrency_rules[preorder-create-stale-allocation]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / allocation_exhaustion_zero_available_boundary
          rationale: "OCC stale-version on pre-order create shares the allocation-versioning surface exercised there; the dedicated stale test is authored in the cross_cutting section below."

  # =================================================================
  # RBAC
  # =================================================================
  - section: rbac
    instances:
      - name: customer_cannot_create_product
        claim_type: unauthorized_operation
        grounds: [roles, endpoints, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "A Customer calling POST /shop/products (a Manager-exclusive op) is rejected with ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["A registered customer."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "rb@x.com", full_name: "RBAC" }
              as: Anonymous
              captures: { rb_id: "$.data.id" }
          trigger:
            - call: "POST /shop/products"
              payload: { artist: "X", title: "Y", format: "VINYL", base_price_cents: 1000 }
              as: Customer
              as_user_id: "${rb_id}"
              captures: { rberr: "$.data.error_id" }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN"

      - name: customer_cannot_cancel_other_customers_order
        claim_type: ownership_enforcement
        grounds: [roles, "validations[priority=4]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "A Customer cancelling an order owned by a different customer is rejected with ERR_NOT_RESOURCE_OWNER (403) — ownership compares X-User-ID to Order.customer_id."
        test_recipe:
          setup: ["Owner A has an ONLINE order with one line; intruder B is a different customer."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "owner@x.com", full_name: "Owner" }
              as: Anonymous
              captures: { own_id: "$.data.id" }
            - call: "POST /shop/customers"
              payload: { email: "intruder@x.com", full_name: "Intruder" }
              as: Anonymous
              captures: { intr_id: "$.data.id" }
            - call: "POST /shop/products"
              payload: { artist: "Portishead", title: "Dummy", format: "CD", base_price_cents: 1500 }
              as: Manager
              captures: { pop_id: "$.data.id" }
            - call: "POST /shop/inventory-items"
              payload: { product_id: "${pop_id}", is_used: false, condition_grade: "NM" }
              as: StoreClerk
              captures: { poi_id: "$.data.id" }
            - call: "POST /shop/orders"
              payload: { customer_id: "${own_id}", channel: "ONLINE" }
              as: Customer
              as_user_id: "${own_id}"
              captures: { owno_id: "$.data.id" }
            - call: "POST /shop/orders/${owno_id}/lines"
              payload: { inventory_item_id: "${poi_id}" }
              as: Customer
              as_user_id: "${own_id}"
          trigger:
            - call: "POST /shop/orders/${owno_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${intr_id}"
              captures: { ownerr: "$.data.error_id" }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_NOT_RESOURCE_OWNER"

  # =================================================================
  # Cross-Cutting Complexity Layers
  # =================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_allocation_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[preorder-create-stale-allocation]", entities.Allocation.fields.version, "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Reading allocation version v0, creating one pre-order (version advances to v1), then a second create still carrying expected_allocation_version=v0 is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["An allocation_total=5 pool, window open; one pre-order already created so version advanced past the client's observed v0."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "occ1@x.com", full_name: "OCC One" }
              as: Anonymous
              captures: { occ1_id: "$.data.id" }
            - call: "POST /shop/customers"
              payload: { email: "occ2@x.com", full_name: "OCC Two" }
              as: Anonymous
              captures: { occ2_id: "$.data.id" }
            - call: "POST /shop/products"
              payload: { artist: "RSD-OCC", title: "OCC LP", format: "VINYL", base_price_cents: 4000, is_rsd_exclusive: true }
              as: Manager
              captures: { occp_id: "$.data.id" }
            - call: "POST /shop/products/${occp_id}/allocations"
              payload: { allocation_total: 5, window_open_at: "2026-03-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z" }
              as: Manager
              captures: { occa_id: "$.data.id", occ_v0: "$.data.version" }
            - call: "POST /shop/pre-orders"
              payload: { customer_id: "${occ1_id}", product_id: "${occp_id}", allocation_id: "${occa_id}", pickup_window_start: "2026-04-01T09:00:00Z", pickup_window_end: "2026-04-01T17:00:00Z", expected_allocation_version: "${occ_v0}" }
              as: Customer
              as_user_id: "${occ1_id}"
          trigger:
            - call: "POST /shop/pre-orders"
              payload: { customer_id: "${occ2_id}", product_id: "${occp_id}", allocation_id: "${occa_id}", pickup_window_start: "2026-04-02T09:00:00Z", pickup_window_end: "2026-04-02T17:00:00Z", expected_allocation_version: "${occ_v0}" }
              as: Customer
              as_user_id: "${occ2_id}"
              captures: { occerr: "$.data.error_id" }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: allocation_version_increments_on_preorder
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[preorder-create-stale-allocation]", entities.Allocation.fields.version]
        distinguishing_aspect: "A successful pre-order create increments Allocation.version by exactly 1 (v0 -> v0+1), observable on GET /shop/allocations/{id}."
        test_recipe:
          setup: ["An allocation_total=5 pool, window open, version v0."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "occ3@x.com", full_name: "OCC Three" }
              as: Anonymous
              captures: { occ3_id: "$.data.id" }
            - call: "POST /shop/products"
              payload: { artist: "RSD-VER", title: "Ver LP", format: "VINYL", base_price_cents: 4000, is_rsd_exclusive: true }
              as: Manager
              captures: { verp_id: "$.data.id" }
            - call: "POST /shop/products/${verp_id}/allocations"
              payload: { allocation_total: 5, window_open_at: "2026-03-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z" }
              as: Manager
              captures: { vera_id: "$.data.id", ver_v0: "$.data.version" }
          trigger:
            - call: "POST /shop/pre-orders"
              payload: { customer_id: "${occ3_id}", product_id: "${verp_id}", allocation_id: "${vera_id}", pickup_window_start: "2026-04-01T09:00:00Z", pickup_window_end: "2026-04-01T17:00:00Z", expected_allocation_version: "${ver_v0}" }
              as: Customer
              as_user_id: "${occ3_id}"
          assert:
            - "Allocation.${vera_id}.available_count == 4"
            - "Allocation.${vera_id}.reserved_count == 1"

  # =================================================================
  # Consistency Model
  # =================================================================
  - section: consistency_model
    instances:
      - name: order_totals_visible_immediately_on_line_add
        claim_type: immediate
        grounds: [calculations.order_total, entities.Order.fields.total_cents]
        distinguishing_aspect: "The order-line add response and an immediate GET both show the recomputed total in the same request cycle (immediate consistency, no lag)."
        test_recipe:
          setup: ["An IN_STORE order with one used VG base-2000 copy (lists at 1200) already added; IN_STORE => no shipping, STANDARD => no discount, total 1200."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "imm@x.com", full_name: "Immediate" }
              as: Anonymous
              captures: { imm_id: "$.data.id" }
            - call: "POST /shop/products"
              payload: { artist: "Air", title: "Moon Safari", format: "VINYL", base_price_cents: 2000 }
              as: Manager
              captures: { airp_id: "$.data.id" }
            - call: "POST /shop/inventory-items"
              payload: { product_id: "${airp_id}", is_used: true, condition_grade: "VG" }
              as: StoreClerk
              captures: { airi_id: "$.data.id" }
            - call: "POST /shop/orders"
              payload: { customer_id: "${imm_id}", channel: "IN_STORE" }
              as: Customer
              as_user_id: "${imm_id}"
              captures: { immo_id: "$.data.id" }
            - call: "POST /shop/orders/${immo_id}/lines"
              payload: { inventory_item_id: "${airi_id}" }
              as: Customer
              as_user_id: "${imm_id}"
          trigger:
            - call: "GET /shop/orders/${immo_id}"
              payload: {}
              as: Customer
              as_user_id: "${imm_id}"
          assert:
            - "Order.${immo_id}.subtotal_cents == 1200"
            - "Order.${immo_id}.shipping_cents == 0"
            - "Order.${immo_id}.total_cents == 1200"

