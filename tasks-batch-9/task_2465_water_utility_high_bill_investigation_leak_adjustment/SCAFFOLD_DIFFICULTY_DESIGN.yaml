          METRIC accuracy_pct on ENDPOINT POST /meter-test-requests/{id}/record-bench-result — a
          different metric on a different endpoint from the anomaly-ratio instance. It carries 2
          decimal places and the FAST test is STRICT: 101.49 and 101.50 both close CLOSED_PASS,
