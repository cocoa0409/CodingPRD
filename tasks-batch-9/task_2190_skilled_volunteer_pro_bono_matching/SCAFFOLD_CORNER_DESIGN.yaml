      - name: error_invalid_valuation_state_on_post_after_restatement
        claim_type: error_triggerable
        grounds: ["errors[ERR_INVALID_VALUATION_STATE]", state_machines.Engagement.valuation_status.terminal_states, "endpoints[POST /engagements/{id}/valuations]"]
        distinguishing_aspect: "RESTATED is a closed book: after CASCADE-B restated the 1558.59 INDEPENDENT_SECTOR record, a fresh valuation post carrying a perfectly current expected_engagement_version is still refused - the guard is the valuation_status, not OCC (which would answer 412) and not the work_status check."
