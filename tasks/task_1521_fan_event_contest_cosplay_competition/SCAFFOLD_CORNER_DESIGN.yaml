            - { call: "POST /performance-slots", payload: { entry_id: "${eb}", sequence_number: 2, duration_seconds: 120 }, as: StageManager, captures: { psb: $.data.id } }
            - { call: "POST /performance-slots/${psa}/advance", payload: { to: "ON_STAGE" }, as: StageManager }
            - { call: "POST /performance-slots/${psa}/advance", payload: { to: "COMPLETED" }, as: StageManager }
            - { call: "POST /performance-slots/${psb}/advance", payload: { to: "ON_STAGE" }, as: StageManager }
