scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: prequalification_standard_vs_conservative_cap
    grounds:
    - calculations.prequalification_terms
    - entities.FinancingPrequalification.fields.pricing_mode
    - entities.FinancingPrequalification.fields.max_amount_cents
    distinguishing_aspect: 'Same applicant inputs (income 8,000,000 cents, band A) produce different

      max_amount_cents under the two pricing variants: STANDARD pins

      min(income_cap, band_cap) = 2,000,000 while CONSERVATIVE scales both

      caps (80%/90%) to 1,600,000 — a financing-domain dual variant.

      '
    test_recipe:
      setup:
      - one customer exists; the logical clock is at the default 2026-09-01T00:00:00Z
      setup_api_calls:
      - call: POST /vehicle-hub/customers
        payload:
          full_name: PQ User
          email: pq@x.com
          state_code: GA
        as: PlatformAdmin
        captures:
          pq_cust: $.data.id
      - call: POST /vehicle-hub/financing/prequalify
        payload:
          annual_income_cents: 8000000
          credit_band: A
        as: Customer
        as_user_id: ${pq_cust}
        captures:
          pq_std_id: $.data.id
      - call: POST /vehicle-hub/financing/prequalify
        payload:
          annual_income_cents: 8000000
          credit_band: A
          conservative_mode: true
        as: Customer
        as_user_id: ${pq_cust}
        captures:
          pq_con_id: $.data.id
      trigger:
      - call: GET /vehicle-hub/financing/${pq_std_id}
        as: Customer
        as_user_id: ${pq_cust}
      - call: GET /vehicle-hub/financing/${pq_con_id}
        as: Customer
        as_user_id: ${pq_cust}
      assert:
      - FinancingPrequalification.${pq_std_id}.pricing_mode == STANDARD
      - FinancingPrequalification.${pq_std_id}.max_amount_cents == 2000000
      - FinancingPrequalification.${pq_std_id}.apr_bps == 490
      - FinancingPrequalification.${pq_std_id}.monthly_payment_cents == 32117
      - FinancingPrequalification.${pq_con_id}.pricing_mode == CONSERVATIVE
      - FinancingPrequalification.${pq_con_id}.max_amount_cents == 1600000
      - FinancingPrequalification.${pq_con_id}.monthly_payment_cents == 25694
  - name: registration_in_state_vs_out_of_state_timeline
    grounds:
    - calculations.registration_timeline
    - entities.TitleRegistration.fields.processing_mode
    - entities.TitleRegistration.fields.temp_tag_expires_at
    distinguishing_aspect: 'Identical order flows filed on the same day produce different timelines

      by state variant: a GA order (IN_STATE) gets a 30-day temp tag and a

      10-day registration commitment, while an identical TX order

      (OUT_OF_STATE) gets 45 and 21 days — a title-domain dual variant on a

      different entity domain than financing.

      '
    test_recipe:
      setup:
      - two customers (GA and TX), two LISTED vehicles priced 2,000,000 in market ATL-A, and two cash orders driven to COMPLETED at the default clock 2026-09-01T00:00:00Z
      setup_api_calls:
      - call: POST /vehicle-hub/customers
        payload:
          full_name: Reg GA
          email: regga@x.com
          state_code: GA
        as: PlatformAdmin
        captures:
          reg_ga_cust: $.data.id
      - call: POST /vehicle-hub/customers
        payload:
          full_name: Reg TX
          email: regtx@x.com
          state_code: TX
        as: PlatformAdmin
        captures:
          reg_tx_cust: $.data.id
      - call: POST /vehicle-hub/vehicles
        payload:
          vin: 1HGCM82633A004352
          make: Honda
          model: Accord
          year: 2021
          mileage: 30000
          base_price_cents: 2000000
          market_code: ATL-A
        as: PlatformAdmin
        captures:
          reg_veh1: $.data.id
      - call: POST /vehicle-hub/vehicles
        payload:
          vin: 1HGCM82633A004353
          make: Honda
          model: Accord
          year: 2021
          mileage: 31000
          base_price_cents: 2000000
          market_code: ATL-A
        as: PlatformAdmin
        captures:
          reg_veh2: $.data.id
      - call: POST /vehicle-hub/vehicles/${reg_veh1}/start-recon
        as: ReconOperator
      - call: POST /vehicle-hub/vehicles/${reg_veh1}/list
        as: ReconOperator
      - call: POST /vehicle-hub/vehicles/${reg_veh2}/start-recon
        as: ReconOperator
      - call: POST /vehicle-hub/vehicles/${reg_veh2}/list
        as: ReconOperator
      - call: POST /vehicle-hub/orders
        payload:
          vehicle_id: ${reg_veh1}
          fulfillment_choice: VENDING_MACHINE
        as: Customer
        as_user_id: ${reg_ga_cust}
        captures:
          reg_ord1: $.data.id
      - call: POST /vehicle-hub/orders
        payload:
          vehicle_id: ${reg_veh2}
          fulfillment_choice: VENDING_MACHINE
        as: Customer
        as_user_id: ${reg_tx_cust}
        captures:
          reg_ord2: $.data.id
      - call: POST /vehicle-hub/orders/${reg_ord1}/reserve
        payload:
          expected_vehicle_version: ${vehicles_v1}
        as: Customer
        as_user_id: ${reg_ga_cust}
        captures:
          vehicles_v1: $.data.version
      - call: POST /vehicle-hub/orders/${reg_ord2}/reserve
        payload:
          expected_vehicle_version: ${vehicles_v1}
        as: Customer
        as_user_id: ${reg_tx_cust}
      - call: POST /vehicle-hub/orders/${reg_ord1}/structure
        payload: {}
        as: Customer
        as_user_id: ${reg_ga_cust}
      - call: POST /vehicle-hub/orders/${reg_ord2}/structure
        payload: {}
        as: Customer
        as_user_id: ${reg_tx_cust}
      - call: POST /vehicle-hub/orders/${reg_ord1}/appointments
        payload:
          expected_order_version: ${orders_v1}
          market_code: ATL-A
          vending_site_code: ATL-VM-1
          start_at: '2026-09-02T10:00:00Z'
          end_at: '2026-09-02T11:00:00Z'
        as: Customer
        as_user_id: ${reg_ga_cust}
        captures:
          orders_v1: $.data.version
      - call: POST /vehicle-hub/orders/${reg_ord2}/appointments
        payload:
          expected_order_version: ${orders_v1}
          market_code: ATL-A
          vending_site_code: ATL-VM-2
          start_at: '2026-09-02T10:00:00Z'
          end_at: '2026-09-02T11:00:00Z'
        as: Customer
        as_user_id: ${reg_tx_cust}
      - call: POST /vehicle-hub/orders/${reg_ord1}/complete
        payload:
          odometer_at_delivery: 30100
        as: PlatformAdmin
      - call: POST /vehicle-hub/orders/${reg_ord2}/complete
        payload:
          odometer_at_delivery: 31100
        as: PlatformAdmin
      - call: GET /vehicle-hub/orders/${reg_ord1}/title-registration
        as: RegistrationClerk
        captures:
          reg_tr1: $.data[0].id
      - call: GET /vehicle-hub/orders/${reg_ord2}/title-registration
        as: RegistrationClerk
        captures:
          reg_tr2: $.data[0].id
      trigger:
      - call: POST /vehicle-hub/title-registrations/${reg_tr1}/file
        as: RegistrationClerk
      - call: POST /vehicle-hub/title-registrations/${reg_tr2}/file
        as: RegistrationClerk
      assert:
      - TitleRegistration.${reg_tr1}.processing_mode == IN_STATE
      - TitleRegistration.${reg_tr1}.temp_tag_expires_at == 2026-10-01T00:00:00Z (30 days from issuance at 2026-09-01T00:00:00Z)
      - TitleRegistration.${reg_tr1}.registration_due_at == 2026-09-11T00:00:00Z (filed_at + 10 days)
      - TitleRegistration.${reg_tr2}.processing_mode == OUT_OF_STATE
      - TitleRegistration.${reg_tr2}.temp_tag_expires_at == 2026-10-16T00:00:00Z (45 days)
      - TitleRegistration.${reg_tr2}.registration_due_at == 2026-09-22T00:00:00Z (filed_at + 21 days)
- rule_id: combinatorial_formula
  instances:
  - name: financed_terms_tiered_structure_with_trade_credit
    grounds:
    - calculations.financed_terms
    - validations[priority=16]
    - validations[priority=17]
    distinguishing_aspect: 'Mode (a): the structure formula has >=3 inputs (listed price, state tax

      bps, confirmed trade credit, down payment, prequal cap) with non-linear

      interaction — tax floored once, trade credit subtracted before the 10%

      minimum-down threshold and the financing cap are evaluated, in a pinned

      order; price 2,000,000 in GA with no trade yields total_due 2,140,000,

      min down 214,000, financed 1,840,000 at down 300,000.

      '
    test_recipe:
      setup:
      - customer GA with an A-band STANDARD prequalification (cap 2,000,000), a LISTED vehicle priced 2,000,000 in market ATL-A, order RESERVED
      setup_api_calls:
      - call: POST /vehicle-hub/customers
        payload:
          full_name: Fin A
          email: fina@x.com
          state_code: GA
        as: PlatformAdmin
        captures:
          fin_cust: $.data.id
      - call: POST /vehicle-hub/financing/prequalify
        payload:
          annual_income_cents: 8000000
          credit_band: A
        as: Customer
        as_user_id: ${fin_cust}
        captures:
          fin_pq: $.data.id
      - call: POST /vehicle-hub/vehicles
        payload:
          vin: 2HGFC2F59LH541201
          make: Honda
          model: Civic
          year: 2022
          mileage: 18000
          base_price_cents: 2000000
          market_code: ATL-A
        as: PlatformAdmin
        captures:
          fin_veh: $.data.id
      - call: POST /vehicle-hub/vehicles/${fin_veh}/start-recon
        as: ReconOperator
      - call: POST /vehicle-hub/vehicles/${fin_veh}/list
        as: ReconOperator
      - call: POST /vehicle-hub/orders
        payload:
          vehicle_id: ${fin_veh}
          fulfillment_choice: HOME_DELIVERY
        as: Customer
        as_user_id: ${fin_cust}
        captures:
          fin_ord: $.data.id
      - call: POST /vehicle-hub/orders/${fin_ord}/reserve
        payload:
          expected_vehicle_version: ${vehicles_v1}
        as: Customer
        as_user_id: ${fin_cust}
        captures:
          vehicles_v1: $.data.version
      trigger:
      - call: POST /vehicle-hub/orders/${fin_ord}/structure
        payload:
          financing_id: ${fin_pq}
          down_payment_cents: 300000
        as: Customer
        as_user_id: ${fin_cust}
      assert:
      - PurchaseOrder.${fin_ord}.status == STRUCTURED
      - PurchaseOrder.${fin_ord}.total_due_cents == 2140000
      - PurchaseOrder.${fin_ord}.down_payment_cents == 300000
      - PurchaseOrder.${fin_ord}.amount_financed_cents == 1840000
      - FinancingPrequalification.${fin_pq}.status == LOCKED
      - FinancingPrequalification.${fin_pq}.locked_order_id == ${fin_ord}
  - name: monthly_payment_rounding_order_pinned
    grounds:
    - calculations.financed_terms
    - calculations.prequalification_terms
    distinguishing_aspect: 'Mode (b): the annuity monthly payment pins the rounding order — the

      exact rational payment is computed in fixed-point and rounded HALF-UP

      exactly once at the final step; for principal 1,840,000 cents at

      490 bps over 72 months the pinned result is 29,548 cents (an

      implementation that rounds the monthly rate or an intermediate step

      first lands on a different cent value).

      '
    test_recipe:
      setup:
      - 'same financed order as financed_terms_tiered_structure_with_trade_credit: financed principal 1,840,000 at 490 bps over 72 months'
      setup_api_calls:
      - call: POST /vehicle-hub/customers
        payload:
          full_name: Round U
          email: round@x.com
          state_code: GA
        as: PlatformAdmin
        captures:
          rnd_cust: $.data.id
      - call: POST /vehicle-hub/financing/prequalify
        payload:
          annual_income_cents: 8000000
          credit_band: A
        as: Customer
        as_user_id: ${rnd_cust}
        captures:
          rnd_pq: $.data.id
      - call: POST /vehicle-hub/vehicles
        payload:
          vin: 2HGFC2F59LH541202
          make: Honda
          model: Civic
          year: 2022
          mileage: 18000
          base_price_cents: 2000000
          market_code: ATL-A
        as: PlatformAdmin
        captures:
          rnd_veh: $.data.id
      - call: POST /vehicle-hub/vehicles/${rnd_veh}/start-recon
        as: ReconOperator
      - call: POST /vehicle-hub/vehicles/${rnd_veh}/list
        as: ReconOperator
      - call: POST /vehicle-hub/orders
        payload:
          vehicle_id: ${rnd_veh}
          fulfillment_choice: HOME_DELIVERY
        as: Customer
        as_user_id: ${rnd_cust}
        captures:
          rnd_ord: $.data.id
      - call: POST /vehicle-hub/orders/${rnd_ord}/reserve
        payload:
          expected_vehicle_version: ${vehicles_v1}
        as: Customer
        as_user_id: ${rnd_cust}
        captures:
          vehicles_v1: $.data.version
      trigger:
      - call: POST /vehicle-hub/orders/${rnd_ord}/structure
        payload:
          financing_id: ${rnd_pq}
          down_payment_cents: 300000
        as: Customer
        as_user_id: ${rnd_cust}
      - call: GET /vehicle-hub/financing/${rnd_pq}
        as: Customer
        as_user_id: ${rnd_cust}
      assert:
      - PurchaseOrder.${rnd_ord}.amount_financed_cents == 1840000
      - FinancingPrequalification.${rnd_pq}.monthly_payment_cents == 32117 (provisional, computed on max_amount 2,000,000 — demonstrates the pinned amortize rounding on a second principal)
      - the amortize function applied to (1840000, 490, 72) yields 29548 — verify via the prequalification of a band/income fixture whose max_amount equals the financed principal, or assert the scaffold-pinned
        constant directly in the implementation test
- rule_id: non_linear_state_machine
  instances:
  - name: purchase_order_parallel_status_dimensions
    grounds:
    - state_machines.PurchaseOrder
    - entities.PurchaseOrder.fields.payment_status
    - entities.PurchaseOrder.fields.delivery_status
    distinguishing_aspect: 'PurchaseOrder carries three independent axes — status, payment_status,

      delivery_status — that evolve on different triggers: an appointment

      no-show flips delivery_status SCHEDULED -> NOT_SCHEDULED and status

      APPOINTMENT_SET -> STRUCTURED while payment_status stays UNPAID, proving

      the axes are parallel rather than a single linear pipeline.

      '
    test_recipe:
      setup:
      - a GA cash order driven to APPOINTMENT_SET with a SCHEDULED home-delivery appointment whose end_at has passed
      setup_api_calls:
      - call: POST /vehicle-hub/customers
        payload:
          full_name: Par U
          email: par@x.com
          state_code: GA
        as: PlatformAdmin
        captures:
          par_cust: $.data.id
      - call: POST /vehicle-hub/vehicles
        payload:
          vin: 3VWDX7AJ5DM008901
          make: VW
          model: Jetta
          year: 2021
          mileage: 22000
          base_price_cents: 2000000
          market_code: ATL-A
        as: PlatformAdmin
        captures:
          par_veh: $.data.id
      - call: POST /vehicle-hub/vehicles/${par_veh}/start-recon
        as: ReconOperator
      - call: POST /vehicle-hub/vehicles/${par_veh}/list
        as: ReconOperator
      - call: POST /vehicle-hub/orders
        payload:
          vehicle_id: ${par_veh}
          fulfillment_choice: HOME_DELIVERY
        as: Customer
        as_user_id: ${par_cust}
        captures:
          par_ord: $.data.id
      - call: POST /vehicle-hub/orders/${par_ord}/reserve
        payload:
          expected_vehicle_version: ${vehicles_v1}
        as: Customer
        as_user_id: ${par_cust}
        captures:
          vehicles_v1: $.data.version
      - call: POST /vehicle-hub/orders/${par_ord}/structure
        payload: {}
        as: Customer
        as_user_id: ${par_cust}
      - call: POST /vehicle-hub/orders/${par_ord}/appointments
        payload:
          expected_order_version: ${orders_v1}
          market_code: ATL-A
          address_region: ATL-CORE
          start_at: '2026-09-02T10:00:00Z'
          end_at: '2026-09-02T11:00:00Z'
        as: Customer
        as_user_id: ${par_cust}
        captures:
          par_appt: $.data.id
          orders_v1: $.data.version
      - call: POST /vehicle-hub/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-03T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /vehicle-hub/appointments/${par_appt}/no-show
        as: CustomerAdvocate
      - call: GET /vehicle-hub/orders/${par_ord}
        as: PlatformAdmin
      assert:
      - PurchaseOrder.${par_ord}.status == STRUCTURED
      - PurchaseOrder.${par_ord}.delivery_status == NOT_SCHEDULED
      - PurchaseOrder.${par_ord}.payment_status == UNPAID
      - DeliveryAppointment.${par_appt}.status == NO_SHOW
  - name: defect_claim_review_cycle_and_reauthorization_loop
    grounds:
    - state_machines.DefectClaim
    - state_machines.RepairAuthorization
    distinguishing_aspect: 'DefectClaim supports a cyclic pattern — AUTHORIZED claims survive a

      VOIDED RepairAuthorization and can be re-authorized with a new estimate

      (AUTHORIZED -> AUTHORIZED via a fresh authorize call after voiding) —

      a negotiation-round loop on a different entity than PurchaseOrder.

      '
    test_recipe:
      setup:
      - a COMPLETED cash order (delivered 2026-09-01) with an UNDISCLOSED defect claim that has been reviewed and authorized once, then had its authorization voided
      setup_api_calls:
      - call: POST /vehicle-hub/customers
        payload:
          full_name: Cyc U
          email: cyc@x.com
          state_code: GA
        as: PlatformAdmin
        captures:
          cyc_cust: $.data.id
      - call: POST /vehicle-hub/vehicles
        payload:
          vin: 3VWDX7AJ5DM008902
          make: VW
          model: Jetta
          year: 2021
          mileage: 25000
          base_price_cents: 2000000
          market_code: ATL-A
        as: PlatformAdmin
        captures:
          cyc_veh: $.data.id
      - call: POST /vehicle-hub/vehicles/${cyc_veh}/start-recon
        as: ReconOperator
      - call: POST /vehicle-hub/vehicles/${cyc_veh}/list
        as: ReconOperator
      - call: POST /vehicle-hub/orders
        payload:
          vehicle_id: ${cyc_veh}
          fulfillment_choice: VENDING_MACHINE
        as: Customer
        as_user_id: ${cyc_cust}
        captures:
          cyc_ord: $.data.id
      - call: POST /vehicle-hub/orders/${cyc_ord}/reserve
        payload:
          expected_vehicle_version: ${vehicles_v1}
        as: Customer
        as_user_id: ${cyc_cust}
        captures:
          vehicles_v1: $.data.version
      - call: POST /vehicle-hub/orders/${cyc_ord}/structure
        payload: {}
        as: Customer
        as_user_id: ${cyc_cust}
      - call: POST /vehicle-hub/orders/${cyc_ord}/appointments
        payload:
          expected_order_version: ${orders_v1}
          market_code: ATL-A
          vending_site_code: ATL-VM-9
          start_at: '2026-09-02T10:00:00Z'
          end_at: '2026-09-02T11:00:00Z'
        as: Customer
        as_user_id: ${cyc_cust}
        captures:
          orders_v1: $.data.version
      - call: POST /vehicle-hub/orders/${cyc_ord}/complete
        payload:
          odometer_at_delivery: 25100
        as: PlatformAdmin
      - call: POST /vehicle-hub/defect-claims
        payload:
          order_id: ${cyc_ord}
          defect_description: transmission slip
          defect_area: transmission
          current_mileage: 25200
        as: Customer
        as_user_id: ${cyc_cust}
        captures:
          cyc_claim: $.data.id
      - call: POST /vehicle-hub/defect-claims/${cyc_claim}/review
        as: WarrantyAdmin
      - call: POST /vehicle-hub/defect-claims/${cyc_claim}/authorize
        payload:
          estimate_cents: 120000
        as: WarrantyAdmin
        captures:
          cyc_auth1: $.data.id
      - call: POST /vehicle-hub/repair-authorizations/${cyc_auth1}/void
        payload:
          reason: shop closed
        as: WarrantyAdmin
      trigger:
      - call: POST /vehicle-hub/defect-claims/${cyc_claim}/authorize
        payload:
          estimate_cents: 150000
        as: WarrantyAdmin
        captures:
          cyc_auth2: $.data.id
      assert:
      - RepairAuthorization.${cyc_auth1}.status == VOIDED
      - DefectClaim.${cyc_claim}.status == AUTHORIZED after re-authorization (loop iteration 2)
      - RepairAuthorization.${cyc_auth2}.status == ISSUED
      - RepairAuthorization.${cyc_auth2}.covered_amount_cents == 150000
      - RepairAuthorization.${cyc_auth2}.deductible_cents == 0
- rule_id: transitive_cascade
  instances:
  - name: return_acceptance_cascade_depth4
    grounds:
    - state_machines.PurchaseOrder.RETURN_INITIATED_to_RETURN_COMPLETED
    - state_machines.Vehicle.RETURN_INBOUND_to_INTAKE
    - state_machines.DefectClaim.FILED_to_DENIED
    - state_machines.ReturnTransit
    distinguishing_aspect: 'Depth-4 chain from a single trigger: POST returns intake (ACCEPT) ->

      PurchaseOrder RETURN_COMPLETED + payment REFUNDED -> Vehicle

      RETURN_INBOUND -> INTAKE with a new ReconIntake PENDING_ARRIVAL ->

      each open DefectClaim on the order auto-DENIED with note ''order

      returned'' -> ReturnTransit ARRIVED_AT_CENTER -> INTAKE_DONE; every hop

      is caused by the previous hop''s mutation.

      '
    test_recipe:
      setup:
      - a COMPLETED cash order with one open DefectClaim (UNDER_REVIEW); return initiated within window and mileage; transit scheduled, picked up, and arrived
      setup_api_calls:
      - call: POST /vehicle-hub/customers
        payload:
          full_name: Ret U
          email: ret@x.com
          state_code: GA
        as: PlatformAdmin
        captures:
          ret_cust: $.data.id
      - call: POST /vehicle-hub/vehicles
        payload:
          vin: JM1BL1SF5A1109901
          make: Mazda
          model: '3'
          year: 2022
          mileage: 15000
          base_price_cents: 2000000
          market_code: ATL-A
        as: PlatformAdmin
        captures:
          ret_veh: $.data.id
      - call: POST /vehicle-hub/vehicles/${ret_veh}/start-recon
        as: ReconOperator
      - call: POST /vehicle-hub/vehicles/${ret_veh}/list
        as: ReconOperator
      - call: POST /vehicle-hub/orders
        payload:
          vehicle_id: ${ret_veh}
          fulfillment_choice: HOME_DELIVERY
        as: Customer
        as_user_id: ${ret_cust}
        captures:
          ret_ord: $.data.id
      - call: POST /vehicle-hub/orders/${ret_ord}/reserve
        payload:
          expected_vehicle_version: ${vehicles_v1}
        as: Customer
        as_user_id: ${ret_cust}
        captures:
          vehicles_v1: $.data.version
      - call: POST /vehicle-hub/orders/${ret_ord}/structure
        payload: {}
        as: Customer
        as_user_id: ${ret_cust}
      - call: POST /vehicle-hub/orders/${ret_ord}/appointments
        payload:
          expected_order_version: ${orders_v1}
          market_code: ATL-A
          address_region: ATL-CORE
          start_at: '2026-09-02T10:00:00Z'
          end_at: '2026-09-02T11:00:00Z'
        as: Customer
        as_user_id: ${ret_cust}
        captures:
          orders_v1: $.data.version
      - call: POST /vehicle-hub/orders/${ret_ord}/complete
        payload:
          odometer_at_delivery: 15100
          payment_confirmed: true
        as: PlatformAdmin
      - call: POST /vehicle-hub/defect-claims
        payload:
          order_id: ${ret_ord}
          defect_description: rattle
          defect_area: dashboard
          current_mileage: 15150
        as: Customer
        as_user_id: ${ret_cust}
        captures:
          ret_claim: $.data.id
      - call: POST /vehicle-hub/defect-claims/${ret_claim}/review
        as: WarrantyAdmin
      - call: POST /vehicle-hub/_clock/set_current_utc
        payload:
