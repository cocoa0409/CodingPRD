          Three action verbs with distinct footprints on the same case: log takes a body, derives
          credited_minutes, appends a ledger row and bumps the case version; verify takes an empty
          body, stamps verified_at/verified_by_user_id and appends nothing; funding/report takes an
          empty body and returns the HomeboundCase rather than the session it summarises.
        test_recipe:
