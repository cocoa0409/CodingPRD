            - "The close returns HTTP 409 with error_id == ERR_CHARGE_VARIANCE_UNRESOLVED"
            - "The 24999 acknowledgement returns HTTP 422 with error_id == ERR_VARIANCE_ACK_MISMATCH"
            - "The 25000 acknowledgement returns HTTP 200 and ChargeCapture.${chV2_id}.status == FINALIZED"

