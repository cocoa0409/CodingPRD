  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: dryer_run_cooldown_buffer_halfopen
        grounds:
          - validations[priority=10]
          - entities.DryerUnit.fields.cooldown_minutes
        distinguishing_aspect: |
          Interval semantics #1 (half-open intervals + mandatory buffer) on
          resource DryerUnit: runs R1 [08:00,12:00) and R2 [12:30,16:00) are
          legal because existing_end + cooldown <= new_start with equality
          allowed; R3 [12:00,13:00) collides with R1's buffered tail and is
          rejected with ERR_RUN_OVERLAP.
        test_recipe:
          setup:
            - "Customer, tariff, unit (cooldown 30); three tested 20.0% lots each with a CONFIRMED 300-bu ticket on 2026-09-05"
          setup_api_calls:
            - { call: "POST /grain-drying/customers", payload: { name: "C1", credit_limit_cents: 500000, prepaid_balance_cents: 0 }, as: ElevatorManager, captures: { cust: $.data.id } }
            - { call: "POST /grain-drying/dryer-units", payload: { unit_code: "DRYER-1", daily_capacity_bushels: 10000, standard_class_cap_bushels: 8000, throughput_bu_per_hour: 600, cooldown_minutes: 30 }, as: ElevatorManager, captures: { unit: $.data.id } }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:00:00Z" }, as: ElevatorManager }
            - { call: "POST /grain-drying/grain-lots", payload: { customer_id: "${cust}", commodity: "CORN", gross_weight_lbs: 44000, tare_weight_lbs: 34000, target_moisture_pct: 15.0, foreign_material_pct: 2.0 }, as: IntakeTechnician, captures: { lotA: $.data.id, lotA_v: $.data.version } }
            - { call: "POST /grain-drying/moisture-tests", payload: { lot_id: "${lotA}", sample_moisture_pct: 20.0, expected_grain_lot_version: "${lotA_v}" }, as: IntakeTechnician, as_user_id: "tech-1", captures: { testA: $.data.id } }
            - { call: "POST /grain-drying/moisture-tests/${testA}/certify", payload: {}, as: IntakeTechnician, as_user_id: "tech-1" }
            - { call: "POST /grain-drying/grain-lots", payload: { customer_id: "${cust}", commodity: "CORN", gross_weight_lbs: 44000, tare_weight_lbs: 34000, target_moisture_pct: 15.0, foreign_material_pct: 2.0 }, as: IntakeTechnician, captures: { lotB: $.data.id, lotB_v: $.data.version } }
            - { call: "POST /grain-drying/moisture-tests", payload: { lot_id: "${lotB}", sample_moisture_pct: 20.0, expected_grain_lot_version: "${lotB_v}" }, as: IntakeTechnician, as_user_id: "tech-1", captures: { testB: $.data.id } }
            - { call: "POST /grain-drying/moisture-tests/${testB}/certify", payload: {}, as: IntakeTechnician, as_user_id: "tech-1" }
            - { call: "POST /grain-drying/grain-lots", payload: { customer_id: "${cust}", commodity: "CORN", gross_weight_lbs: 44000, tare_weight_lbs: 34000, target_moisture_pct: 15.0, foreign_material_pct: 2.0 }, as: IntakeTechnician, captures: { lotC: $.data.id, lotC_v: $.data.version } }
            - { call: "POST /grain-drying/moisture-tests", payload: { lot_id: "${lotC}", sample_moisture_pct: 20.0, expected_grain_lot_version: "${lotC_v}" }, as: IntakeTechnician, as_user_id: "tech-1", captures: { testC: $.data.id } }
            - { call: "POST /grain-drying/moisture-tests/${testC}/certify", payload: {}, as: IntakeTechnician, as_user_id: "tech-1" }
            - { call: "POST /grain-drying/queue-tickets", payload: { lot_id: "${lotA}", unit_id: "${unit}", window_date: "2026-09-05", requested_bushels: 300 }, as: Grower, as_user_id: "${cust}", captures: { tickA: $.data.id } }
            - { call: "POST /grain-drying/queue-tickets/${tickA}/confirm", payload: {}, as: ElevatorManager }
            - { call: "POST /grain-drying/queue-tickets", payload: { lot_id: "${lotB}", unit_id: "${unit}", window_date: "2026-09-05", requested_bushels: 300 }, as: Grower, as_user_id: "${cust}", captures: { tickB: $.data.id } }
            - { call: "POST /grain-drying/queue-tickets/${tickB}/confirm", payload: {}, as: ElevatorManager }
            - { call: "POST /grain-drying/queue-tickets", payload: { lot_id: "${lotC}", unit_id: "${unit}", window_date: "2026-09-05", requested_bushels: 300 }, as: Grower, as_user_id: "${cust}", captures: { tickC: $.data.id } }
            - { call: "POST /grain-drying/queue-tickets/${tickC}/confirm", payload: {}, as: ElevatorManager }
            - { call: "POST /grain-drying/dryer-runs", payload: { unit_id: "${unit}", lot_id: "${lotA}", queue_ticket_id: "${tickA}", scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T12:00:00Z" }, as: DryerOperator, captures: { runA: $.data.id } }
          trigger:
            - { call: "POST /grain-drying/dryer-runs", payload: { unit_id: "${unit}", lot_id: "${lotB}", queue_ticket_id: "${tickB}", scheduled_start: "2026-09-05T12:30:00Z", scheduled_end: "2026-09-05T16:00:00Z" }, as: DryerOperator, captures: { runB: $.data.id, runB_st: $.data.status } }
            - { call: "POST /grain-drying/dryer-runs", payload: { unit_id: "${unit}", lot_id: "${lotC}", queue_ticket_id: "${tickC}", scheduled_start: "2026-09-05T12:00:00Z", scheduled_end: "2026-09-05T13:00:00Z" }, as: DryerOperator, captures: { err: $.data.error_id } }
          assert:
            - "R2 at 12:30 (== R1.end 12:00 + cooldown 30, equality) is created with status SCHEDULED"
            - "R3 at 12:00 (inside R1's buffered tail) -> ERR_RUN_OVERLAP"
            - "DryerRun.${runB}.status == SCHEDULED; R3 was rejected before any run existed for lot C"

      - name: queue_daily_capacity_aggregate_preemption
        grounds:
          - calculations.daily_capacity_commitment
          - state_machines.QueueTicket.CONFIRMED_to_PREEMPTED
        distinguishing_aspect: |
          Interval semantics #2 (aggregate capacity, not geometric overlap) on
          the daily-throughput pool resource: tickets never collide pairwise;
          instead the SUM over CONFIRMED tickets per (unit, date) is capped per
          class (8000 STANDARD) and in total (10000). A 2500-bu PRIORITY ticket
          overflows the total cap until the manager preempts STANDARD tickets,
          then confirms.
        test_recipe:
          setup:
            - "STANDARD customer CS and PRIORITY_CONTRACT customer CP; unit caps 10000/8000; two 4000-bu standard tickets confirmed on 2026-09-15 (class cap full)"
          setup_api_calls:
            - { call: "POST /grain-drying/customers", payload: { name: "CS", credit_limit_cents: 500000, prepaid_balance_cents: 0, priority_class: "STANDARD" }, as: ElevatorManager, captures: { custS: $.data.id } }
            - { call: "POST /grain-drying/customers", payload: { name: "CP", credit_limit_cents: 500000, prepaid_balance_cents: 0, priority_class: "PRIORITY_CONTRACT" }, as: ElevatorManager, captures: { custP: $.data.id } }
            - { call: "POST /grain-drying/dryer-units", payload: { unit_code: "DRYER-1", daily_capacity_bushels: 10000, standard_class_cap_bushels: 8000, throughput_bu_per_hour: 600, cooldown_minutes: 30 }, as: ElevatorManager, captures: { unit: $.data.id } }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:00:00Z" }, as: ElevatorManager }
            - { call: "POST /grain-drying/grain-lots", payload: { customer_id: "${custS}", commodity: "CORN", gross_weight_lbs: 44000, tare_weight_lbs: 34000, target_moisture_pct: 15.0, foreign_material_pct: 2.0 }, as: IntakeTechnician, captures: { lotS1: $.data.id, lotS1_v: $.data.version } }
            - { call: "POST /grain-drying/moisture-tests", payload: { lot_id: "${lotS1}", sample_moisture_pct: 20.0, expected_grain_lot_version: "${lotS1_v}" }, as: IntakeTechnician, as_user_id: "tech-1", captures: { testS1: $.data.id } }
            - { call: "POST /grain-drying/moisture-tests/${testS1}/certify", payload: {}, as: IntakeTechnician, as_user_id: "tech-1" }
            - { call: "POST /grain-drying/grain-lots", payload: { customer_id: "${custS}", commodity: "CORN", gross_weight_lbs: 44000, tare_weight_lbs: 34000, target_moisture_pct: 15.0, foreign_material_pct: 2.0 }, as: IntakeTechnician, captures: { lotS2: $.data.id, lotS2_v: $.data.version } }
            - { call: "POST /grain-drying/moisture-tests", payload: { lot_id: "${lotS2}", sample_moisture_pct: 20.0, expected_grain_lot_version: "${lotS2_v}" }, as: IntakeTechnician, as_user_id: "tech-1", captures: { testS2: $.data.id } }
            - { call: "POST /grain-drying/moisture-tests/${testS2}/certify", payload: {}, as: IntakeTechnician, as_user_id: "tech-1" }
            - { call: "POST /grain-drying/grain-lots", payload: { customer_id: "${custP}", commodity: "CORN", gross_weight_lbs: 44000, tare_weight_lbs: 34000, target_moisture_pct: 15.0, foreign_material_pct: 2.0 }, as: IntakeTechnician, captures: { lotP: $.data.id, lotP_v: $.data.version } }
            - { call: "POST /grain-drying/moisture-tests", payload: { lot_id: "${lotP}", sample_moisture_pct: 20.0, expected_grain_lot_version: "${lotP_v}" }, as: IntakeTechnician, as_user_id: "tech-1", captures: { testP: $.data.id } }
            - { call: "POST /grain-drying/moisture-tests/${testP}/certify", payload: {}, as: IntakeTechnician, as_user_id: "tech-1" }
            - { call: "POST /grain-drying/queue-tickets", payload: { lot_id: "${lotS1}", unit_id: "${unit}", window_date: "2026-09-15", requested_bushels: 4000 }, as: Grower, as_user_id: "${custS}", captures: { tickS1: $.data.id } }
            - { call: "POST /grain-drying/queue-tickets/${tickS1}/confirm", payload: {}, as: ElevatorManager }
            - { call: "POST /grain-drying/queue-tickets", payload: { lot_id: "${lotS2}", unit_id: "${unit}", window_date: "2026-09-15", requested_bushels: 4000 }, as: Grower, as_user_id: "${custS}", captures: { tickS2: $.data.id } }
            - { call: "POST /grain-drying/queue-tickets/${tickS2}/confirm", payload: {}, as: ElevatorManager }
            - { call: "GET /grain-drying/dryer-units/${unit}/capacity-calendar", payload: { date: "2026-09-15" }, as: ElevatorManager, captures: { cal_std: $.data.standard_committed_bushels, cal_tot: $.data.total_committed_bushels } }
            - { call: "POST /grain-drying/queue-tickets", payload: { lot_id: "${lotP}", unit_id: "${unit}", window_date: "2026-09-15", requested_bushels: 2500 }, as: Grower, as_user_id: "${custP}", captures: { tickP: $.data.id, tickP_class: $.data.priority_class } }
          trigger:
            - { call: "POST /grain-drying/queue-tickets/${tickP}/confirm", payload: {}, as: ElevatorManager, captures: { err: $.data.error_id } }
            - { call: "POST /grain-drying/queue-tickets/${tickS2}/preempt", payload: {}, as: ElevatorManager, captures: { st_pre: $.data.status } }
            - { call: "POST /grain-drying/queue-tickets/${tickP}/confirm", payload: {}, as: ElevatorManager, captures: { st_p: $.data.status } }
            - { call: "GET /grain-drying/dryer-units/${unit}/capacity-calendar", payload: { date: "2026-09-15" }, as: ElevatorManager, captures: { cal_std2: $.data.standard_committed_bushels, cal_tot2: $.data.total_committed_bushels } }
          assert:
            - "calendar after two standard confirms: standard_committed_bushels == 8000, total_committed_bushels == 8000"
            - "QueueTicket.${tickP}.priority_class == PRIORITY_CONTRACT (copied from customer)"
            - "first priority confirm -> ERR_CAPACITY_EXCEEDED (8000 + 2500 = 10500 > 10000 total cap)"
            - "preempt of ${tickS2} -> PREEMPTED, releasing 4000 standard bushels"
            - "second priority confirm succeeds: status == CONFIRMED"
            - "calendar after preemption + priority confirm: standard_committed_bushels == 4000, total_committed_bushels == 6500"

      - name: schedule_closed_window_overlap
        grounds:
          - validations[priority=10]
          - entities.DryingChargeSchedule.fields.effective_to
        distinguishing_aspect: |
          Interval semantics #3 (CLOSED date intervals, inclusive both ends) on
          the commodity-tariff resource: a second CORN schedule starting
          2026-12-31 collides with S1's window [2026-08-01, 2026-12-31]
          precisely because the end date is inclusive; starting 2027-01-01 is
          legal. Adjacent-touching dates conflict here, unlike the half-open
          dryer-run semantics where boundary equality is legal.
        test_recipe:
          setup:
            - "One CORN schedule covering the closed window [2026-08-01, 2026-12-31]"
          setup_api_calls:
            - { call: "POST /grain-drying/charge-schedules", payload: { commodity: "CORN", effective_from: "2026-08-01", effective_to: "2026-12-31", t1_max_moisture_pct: 20.0, t2_max_moisture_pct: 25.0, rate_t1_cents_per_pt_bu: 4, rate_t2_cents_per_pt_bu: 5, rate_t3_cents_per_pt_bu: 7, fm_threshold_pct: 3.0, fm_surcharge_pct: 0.10, min_charge_cents: 1500, energy_t1_limit_therms: 60, energy_t1_rate_cents_per_therm: 85, energy_t2_rate_cents_per_therm: 95, est_therms_per_hour: 12.5, est_point_factor: 0.05 }, as: ElevatorManager, captures: { sched1: $.data.id } }
          trigger:
            - { call: "POST /grain-drying/charge-schedules", payload: { commodity: "CORN", effective_from: "2026-12-31", effective_to: "2027-03-31", t1_max_moisture_pct: 20.0, t2_max_moisture_pct: 25.0, rate_t1_cents_per_pt_bu: 4, rate_t2_cents_per_pt_bu: 5, rate_t3_cents_per_pt_bu: 7, fm_threshold_pct: 3.0, fm_surcharge_pct: 0.10, min_charge_cents: 1500, energy_t1_limit_therms: 60, energy_t1_rate_cents_per_therm: 85, energy_t2_rate_cents_per_therm: 95, est_therms_per_hour: 12.5, est_point_factor: 0.05 }, as: ElevatorManager, captures: { err: $.data.error_id } }
            - { call: "POST /grain-drying/charge-schedules", payload: { commodity: "CORN", effective_from: "2027-01-01", effective_to: "2027-03-31", t1_max_moisture_pct: 20.0, t2_max_moisture_pct: 25.0, rate_t1_cents_per_pt_bu: 4, rate_t2_cents_per_pt_bu: 5, rate_t3_cents_per_pt_bu: 7, fm_threshold_pct: 3.0, fm_surcharge_pct: 0.10, min_charge_cents: 1500, energy_t1_limit_therms: 60, energy_t1_rate_cents_per_therm: 85, energy_t2_rate_cents_per_therm: 95, est_therms_per_hour: 12.5, est_point_factor: 0.05 }, as: ElevatorManager, captures: { sched3: $.data.id } }
          assert:
            - "schedule starting 2026-12-31 (== S1 inclusive end) -> ERR_SCHEDULE_WINDOW_OVERLAP"
            - "schedule starting 2027-01-01 (day after inclusive end) is created (201)"
            - "closed-interval semantics: touching at a shared date conflicts, unlike dryer-run half-open adjacency"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: queue_confirm_cancel_capacity_conservation
        grounds:
          - calculations.daily_capacity_commitment
          - state_machines.QueueTicket.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: daily committed bushels committed(u,d) = sum of
          requested_bushels over CONFIRMED tickets. Forward CONFIRM (+1500)
          paired with compensating CANCEL (-1500) leaves committed(u,d)
          unchanged — the capacity-calendar must read identically before and
          after the pair.
        test_recipe:
          setup:
            - "Customer, unit, clock; one tested lot; capacity-calendar baseline for 2026-09-20 captured before any ticket"
          setup_api_calls:
            - { call: "POST /grain-drying/customers", payload: { name: "C1", credit_limit_cents: 500000, prepaid_balance_cents: 0 }, as: ElevatorManager, captures: { cust: $.data.id } }
            - { call: "POST /grain-drying/dryer-units", payload: { unit_code: "DRYER-1", daily_capacity_bushels: 10000, standard_class_cap_bushels: 8000, throughput_bu_per_hour: 600, cooldown_minutes: 30 }, as: ElevatorManager, captures: { unit: $.data.id } }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:00:00Z" }, as: ElevatorManager }
            - { call: "POST /grain-drying/grain-lots", payload: { customer_id: "${cust}", commodity: "CORN", gross_weight_lbs: 44000, tare_weight_lbs: 34000, target_moisture_pct: 15.0, foreign_material_pct: 2.0 }, as: IntakeTechnician, captures: { lot: $.data.id, lot_v: $.data.version } }
            - { call: "POST /grain-drying/moisture-tests", payload: { lot_id: "${lot}", sample_moisture_pct: 20.0, expected_grain_lot_version: "${lot_v}" }, as: IntakeTechnician, as_user_id: "tech-1", captures: { test: $.data.id } }
            - { call: "POST /grain-drying/moisture-tests/${test}/certify", payload: {}, as: IntakeTechnician, as_user_id: "tech-1" }
            - { call: "GET /grain-drying/dryer-units/${unit}/capacity-calendar", payload: { date: "2026-09-20" }, as: ElevatorManager, captures: { cal_before: $.data.total_committed_bushels } }
            - { call: "POST /grain-drying/queue-tickets", payload: { lot_id: "${lot}", unit_id: "${unit}", window_date: "2026-09-20", requested_bushels: 1500 }, as: Grower, as_user_id: "${cust}", captures: { tick: $.data.id } }
            - { call: "POST /grain-drying/queue-tickets/${tick}/confirm", payload: {}, as: ElevatorManager }
            - { call: "GET /grain-drying/dryer-units/${unit}/capacity-calendar", payload: { date: "2026-09-20" }, as: ElevatorManager, captures: { cal_mid: $.data.total_committed_bushels } }
          trigger:
            - { call: "POST /grain-drying/queue-tickets/${tick}/cancel", payload: {}, as: ElevatorManager, captures: { st: $.data.status } }
            - { call: "GET /grain-drying/dryer-units/${unit}/capacity-calendar", payload: { date: "2026-09-20" }, as: ElevatorManager, captures: { cal_after: $.data.total_committed_bushels } }
          assert:
            - "baseline total_committed_bushels == 0"
            - "after confirm: total_committed_bushels == 1500"
            - "after compensating cancel: total_committed_bushels == 0 == baseline (no capacity drift)"
            - "QueueTicket.${tick}.status == CANCELLED and GrainLot.${lot}.status == TESTED (lot reverted)"

      - name: payment_apply_reverse_receivables_conservation
        grounds:
          - calculations.prepaid_waterfall_application
          - state_machines.Invoice.PAID_to_ISSUED
          - concurrency_rules[invoice-payment-stale-invoice]
        distinguishing_aspect: |
          Conserved quantity (different from committed bushels): the
          receivables position (invoice.amount_due_cents, customer
          .prepaid_balance_cents). Payment application (cash 7941 + prepaid
          draw 5000 against due 12941) followed by its compensating reversal
          restores BOTH quantities exactly: due back to 12941, prepaid back to
          5000, invoice back to ISSUED.
        test_recipe:
          setup:
            - "Customer prepaid_balance 5000; dried lot (drying 7366 + metered energy 5575 = invoice total 12941) issued pinning schedule v1"
          setup_api_calls:
            - { call: "POST /grain-drying/customers", payload: { name: "C1", credit_limit_cents: 500000, prepaid_balance_cents: 5000 }, as: ElevatorManager, captures: { cust: $.data.id } }
            - { call: "POST /grain-drying/charge-schedules", payload: { commodity: "CORN", effective_from: "2026-08-01", effective_to: "2026-12-31", t1_max_moisture_pct: 20.0, t2_max_moisture_pct: 25.0, rate_t1_cents_per_pt_bu: 4, rate_t2_cents_per_pt_bu: 5, rate_t3_cents_per_pt_bu: 7, fm_threshold_pct: 3.0, fm_surcharge_pct: 0.10, min_charge_cents: 1500, energy_t1_limit_therms: 60, energy_t1_rate_cents_per_therm: 85, energy_t2_rate_cents_per_therm: 95, est_therms_per_hour: 12.5, est_point_factor: 0.05 }, as: ElevatorManager, captures: { sched: $.data.id, sched_v: $.data.version } }
            - { call: "POST /grain-drying/dryer-units", payload: { unit_code: "DRYER-1", daily_capacity_bushels: 10000, standard_class_cap_bushels: 8000, throughput_bu_per_hour: 600, cooldown_minutes: 30 }, as: ElevatorManager, captures: { unit: $.data.id } }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:00:00Z" }, as: ElevatorManager }
            - { call: "POST /grain-drying/grain-lots", payload: { customer_id: "${cust}", commodity: "CORN", gross_weight_lbs: 44000, tare_weight_lbs: 34000, target_moisture_pct: 15.0, foreign_material_pct: 4.2 }, as: IntakeTechnician, captures: { lot: $.data.id, lot_v: $.data.version } }
            - { call: "POST /grain-drying/moisture-tests", payload: { lot_id: "${lot}", sample_moisture_pct: 22.5, expected_grain_lot_version: "${lot_v}" }, as: IntakeTechnician, as_user_id: "tech-1", captures: { test: $.data.id } }
            - { call: "POST /grain-drying/moisture-tests/${test}/certify", payload: {}, as: IntakeTechnician, as_user_id: "tech-1" }
            - { call: "POST /grain-drying/queue-tickets", payload: { lot_id: "${lot}", unit_id: "${unit}", window_date: "2026-09-05", requested_bushels: 200 }, as: Grower, as_user_id: "${cust}", captures: { tick: $.data.id } }
            - { call: "POST /grain-drying/queue-tickets/${tick}/confirm", payload: {}, as: ElevatorManager }
            - { call: "POST /grain-drying/dryer-runs", payload: { unit_id: "${unit}", lot_id: "${lot}", queue_ticket_id: "${tick}", scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T12:00:00Z" }, as: DryerOperator, captures: { run: $.data.id } }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T08:00:00Z" }, as: ElevatorManager }
            - { call: "POST /grain-drying/dryer-runs/${run}/start", payload: { meter_start_therms: 1200.0 }, as: DryerOperator, as_user_id: "op-1" }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T12:00:00Z" }, as: ElevatorManager }
            - { call: "POST /grain-drying/dryer-runs/${run}/complete", payload: { scale_out_weight_lbs: 9050, discharge_moisture_pct: 15.0, meter_end_therms: 1265.0 }, as: DryerOperator, as_user_id: "op-1" }
            - { call: "POST /grain-drying/invoices", payload: { customer_id: "${cust}", period_start: "2026-09-01", period_end: "2026-09-30" }, as: ElevatorManager, captures: { inv: $.data.id } }
            - { call: "POST /grain-drying/invoices/${inv}/issue", payload: { pinned_schedule_version: "${sched_v}" }, as: ElevatorManager }
            - { call: "GET /grain-drying/invoices/${inv}", as: ElevatorManager, captures: { inv_v: $.data.version, due0: $.data.amount_due_cents } }
          trigger:
            - { call: "POST /grain-drying/invoices/${inv}/payments", payload: { amount_cents: 7941, expected_invoice_version: "${inv_v}" }, as: ElevatorManager, captures: { pay: $.data.id, pay_prepaid: $.data.applied_from_prepaid_cents, pay_cash: $.data.applied_from_cash_cents } }
            - { call: "GET /grain-drying/invoices/${inv}", as: ElevatorManager, captures: { due1: $.data.amount_due_cents, st1: $.data.status } }
            - { call: "GET /grain-drying/customers/${cust}", as: ElevatorManager, captures: { prepaid1: $.data.prepaid_balance_cents } }
            - { call: "POST /grain-drying/payments/${pay}/reverse", payload: {}, as: ElevatorManager, captures: { rev: $.data.id, rev_dir: $.data.direction } }
            - { call: "GET /grain-drying/invoices/${inv}", as: ElevatorManager, captures: { due2: $.data.amount_due_cents, st2: $.data.status } }
            - { call: "GET /grain-drying/customers/${cust}", as: ElevatorManager, captures: { prepaid2: $.data.prepaid_balance_cents } }
          assert:
            - "Invoice.${inv}.amount_due_cents before payment == 12941"
            - "payment: applied_from_prepaid_cents == 5000, applied_from_cash_cents == 7941"
            - "after payment: amount_due_cents == 0, status == PAID, prepaid_balance_cents == 0"
            - "reversal record direction == REVERSAL with reversal_of_payment_id == ${pay}"
            - "after reversal: amount_due_cents == 12941 (restored), status == ISSUED, prepaid_balance_cents == 5000 (draw refunded; cash refunded externally)"
            - "conservation: (due, prepaid) identical before the payment and after its reversal — zero drift"
