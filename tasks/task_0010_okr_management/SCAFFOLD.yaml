# =============================================================================
# Enterprise OKR Management Platform — Scaffold (§1.0–§1.7)
# =============================================================================

scenario: |
  ## 10. Enterprise OKR Management Platform

  **Extended System Functional Description:**

  Enterprise OKR management platform: hierarchical objective tree with company/department/team/individual levels, parent-child linkage, and quarterly cycle management; key result scoring with 0-1 scale, multiple measurement types (numeric/percentage/milestone), and progress update history; alignment relationship graph with cross-team dependency declaration, upstream-downstream impact tracking, and circular reference detection; quarterly review scoring with self-assessment, manager review, calibration adjustment, and final-score locking; cross-team collaboration objectives with co-owner assignment, shared progress updates, and contribution attribution; automatic progress aggregation with child-KR roll-up to parent objectives, weighted scoring rules, and stale-update reminders; permission control with role-based visibility, confidential-objective access lists, and historical-cycle archiving; event-driven synchronization with HR, project management, and IM systems; audit logging for objective changes and scoring adjustments.

domain_name: okr-management
api_prefix: /objectives

complexity_profile:
  primary_archetype: graph_constraint
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
    - soft_delete_archival
  entity_topology: graph
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Department
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Short department code, unique" }
      - { name: name, type: string, source: input, description: "Department display name" }
      - { name: parent_department_id, type: string, source: input, description: "Self-referential parent for org tree; null for top-level" }

  - name: User
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "User email; unique" }
      - { name: full_name, type: string, source: input, description: "Display name" }
      - { name: department_id, type: string, source: input, description: "FK to Department" }
      - { name: manager_id, type: string, source: input, description: "Self-referential FK; null for top of chain", default: null }
      - { name: role_type, type: enum, source: input, description: "EMPLOYEE | MANAGER", constraints: "EMPLOYEE | MANAGER" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE, constraints: "ACTIVE | SUSPENDED" }

  - name: OKRCycle
    parent: null
    common_fields: true
    fields:
      - { name: cycle_code, type: string, source: input, description: "Stable cycle code, e.g. 2026-Q1; unique" }
      - { name: year, type: integer, source: input, description: "Calendar year" }
      - { name: quarter, type: integer, source: input, description: "1..4", constraints: "1<=quarter<=4" }
      - { name: start_date, type: datetime, source: input, description: "Cycle start (inclusive)" }
      - { name: end_date, type: datetime, source: input, description: "Cycle end (exclusive)" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | IN_REVIEW | LOCKED | ARCHIVED", default: DRAFT, constraints: "DRAFT | OPEN | IN_REVIEW | LOCKED | ARCHIVED" }
      - { name: completion_rate, type: number, source: computed, description: "Fraction of objectives in LOCKED state at cycle level; range [0,1], 4 decimal precision" }

  - name: Objective
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK to OKRCycle" }
      - { name: parent_objective_id, type: string, source: input, description: "Self-referential FK; null for COMPANY level", default: null }
      - { name: level, type: enum, source: input, description: "COMPANY | DEPARTMENT | TEAM | INDIVIDUAL", constraints: "COMPANY | DEPARTMENT | TEAM | INDIVIDUAL" }
      - { name: department_id, type: string, source: input, description: "FK to Department; required for DEPARTMENT/TEAM/INDIVIDUAL" }
      - { name: owner_user_id, type: string, source: input, description: "FK to User — primary owner" }
      - { name: title, type: string, source: input, description: "Objective title" }
      - { name: description, type: string, source: input, description: "Long-form description" }
      - { name: weight, type: number, source: input, description: "Sibling weight under same parent; range [0,1] with 4 decimals", default: 1.0 }
      - { name: confidential, type: boolean, source: input, description: "When true, only access-listed users may read", default: false }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | IN_REVIEW | LOCKED | ARCHIVED", default: DRAFT, constraints: "DRAFT | ACTIVE | IN_REVIEW | LOCKED | ARCHIVED" }
      - { name: progress, type: number, source: computed, description: "Live, provisional progress score in [0,1] with 4 decimals; rolls up from KRs (leaf) or child Objectives (parent)" }
      - { name: final_score, type: number, source: computed, description: "Locked review score in [0,1] with 4 decimals; null until ReviewScore.LOCKED" }
      - { name: stale_warning_count, type: integer, source: system, description: "Number of stale-update reminders generated for this objective", default: 0 }
      - { name: kr_count, type: integer, source: computed, description: "Active KeyResult count" }
      - { name: child_count, type: integer, source: computed, description: "Active child Objective count" }

  - name: KeyResult
    parent: Objective
    common_fields: true
    fields:
      - { name: objective_id, type: string, source: system, description: "Parent Objective FK" }
      - { name: title, type: string, source: input, description: "KR title" }
      - { name: measurement_type, type: enum, source: input, description: "NUMERIC | PERCENTAGE | MILESTONE", constraints: "NUMERIC | PERCENTAGE | MILESTONE" }
      - { name: start_value, type: number, source: input, description: "Baseline value (NUMERIC, PERCENTAGE only); null for MILESTONE" }
      - { name: target_value, type: number, source: input, description: "Goal value (NUMERIC, PERCENTAGE only); null for MILESTONE" }
      - { name: current_value, type: number, source: system, description: "Latest value (NUMERIC, PERCENTAGE); set by ProgressUpdate" }
      - { name: milestones, type: array, source: input, description: "Array of {label: string, completed: boolean}; required for MILESTONE, must be empty for NUMERIC/PERCENTAGE" }
      - { name: weight, type: number, source: input, description: "Weight inside parent Objective; range [0,1] with 4 decimals" }
      - { name: score, type: number, source: computed, description: "Computed score in [0,1] with 4 decimals; clamped" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED", default: ACTIVE, constraints: "ACTIVE | ARCHIVED" }
      - { name: last_update_at, type: datetime, source: system, description: "Timestamp of last ProgressUpdate; null if never updated" }
      - { name: stale, type: boolean, source: computed, description: "True when (now - last_update_at).days >= STALE_THRESHOLD_DAYS; false if never updated and Objective just created" }

  - name: ProgressUpdate
    parent: KeyResult
    common_fields: false  # append-only; only id + created_at
    fields:
      - { name: key_result_id, type: string, source: system, description: "Parent KR FK" }
      - { name: update_type, type: enum, source: input, description: "VALUE_CHANGE | MILESTONE_TOGGLE", constraints: "VALUE_CHANGE | MILESTONE_TOGGLE" }
      - { name: new_value, type: number, source: input, description: "New current_value (VALUE_CHANGE only); null otherwise" }
      - { name: milestone_index, type: integer, source: input, description: "Index of milestone toggled (MILESTONE_TOGGLE only); null otherwise" }
      - { name: milestone_completed, type: boolean, source: input, description: "Target completion state of toggled milestone (MILESTONE_TOGGLE only); null otherwise" }
      - { name: comment, type: string, source: input, description: "Free-text note" }
      - { name: actor_user_id, type: string, source: system, description: "User who recorded the update; resolved from X-User-ID" }
      - { name: score_at_update, type: number, source: computed, description: "Snapshot of KR.score immediately after this update applied" }

  - name: AlignmentLink
    parent: null
    common_fields: true
    fields:
      - { name: upstream_objective_id, type: string, source: input, description: "Source Objective" }
      - { name: downstream_objective_id, type: string, source: input, description: "Target Objective" }
      - { name: dependency_type, type: enum, source: input, description: "SUPPORTS | BLOCKS | INFORMS", constraints: "SUPPORTS | BLOCKS | INFORMS" }
      - { name: declared_by_user_id, type: string, source: system, description: "Creator user id; resolved from X-User-ID" }
      - { name: status, type: enum, source: system, description: "PENDING | ACCEPTED | REJECTED | BROKEN", default: PENDING, constraints: "PENDING | ACCEPTED | REJECTED | BROKEN" }
      - { name: accepted_at, type: datetime, source: system, description: "Set on ACCEPTED transition; null otherwise" }
      - { name: rejection_reason, type: string, source: input, description: "Required on REJECTED transition; null otherwise" }
      - { name: forward_impact_score, type: number, source: computed, description: "Forward (downstream) impact of upstream's progress on this link in [0,1] with 4 decimals; null until ACCEPTED" }
      - { name: backward_impact_score, type: number, source: computed, description: "Backward (upstream) attribution share of downstream's progress in [0,1] with 4 decimals; null until ACCEPTED" }

  - name: CoOwnership
    parent: Objective
    common_fields: true
    fields:
      - { name: objective_id, type: string, source: system, description: "Parent Objective FK" }
      - { name: co_owner_user_id, type: string, source: input, description: "FK to User — co-owner" }
      - { name: contribution_weight, type: number, source: input, description: "Co-owner share in [0,1] with 4 decimals" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REMOVED", default: ACTIVE, constraints: "ACTIVE | REMOVED" }

  - name: ReviewScore
    parent: Objective
    common_fields: true
    fields:
      - { name: objective_id, type: string, source: system, description: "Parent Objective FK; one ReviewScore per Objective per cycle" }
      - { name: cycle_id, type: string, source: system, description: "Denormalized FK to OKRCycle" }
      - { name: status, type: enum, source: system, description: "PENDING_SELF | PENDING_MANAGER | PENDING_CALIBRATION | LOCKED", default: PENDING_SELF, constraints: "PENDING_SELF | PENDING_MANAGER | PENDING_CALIBRATION | LOCKED" }
      - { name: self_score, type: number, source: input, description: "Self-assessed score in [0,1] with 4 decimals; null until self-submit" }
      - { name: self_submitted_at, type: datetime, source: system, description: "Set on self-submit" }
      - { name: manager_score, type: number, source: input, description: "Manager review score in [0,1] with 4 decimals; null until manager-submit" }
      - { name: manager_submitted_at, type: datetime, source: system, description: "Set on manager-submit; reset to null on manager-return" }
      - { name: calibration_score, type: number, source: input, description: "HRBP calibration score in [0,1] with 4 decimals; null until calibrate" }
      - { name: calibration_adjusted_at, type: datetime, source: system, description: "Set on calibrate" }
      - { name: final_score, type: number, source: computed, description: "Locked at lock-step; equals calibration_score if set else manager_score" }
      - { name: revision_count, type: integer, source: system, description: "Count of manager-return invocations on this review", default: 0 }
      - { name: locked_at, type: datetime, source: system, description: "Set on LOCKED transition" }

  - name: AccessGrant
    parent: Objective
    common_fields: true
    fields:
      - { name: objective_id, type: string, source: system, description: "Parent Objective FK" }
      - { name: user_id, type: string, source: input, description: "FK to User — granted reader" }
      - { name: granted_by_user_id, type: string, source: system, description: "User who issued the grant" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVOKED", default: ACTIVE, constraints: "ACTIVE | REVOKED" }

  - name: AuditLog
    parent: null
    common_fields: false  # append-only event
    fields:
      - { name: entity_type, type: enum, source: system, description: "OBJECTIVE | KEY_RESULT | REVIEW_SCORE | ALIGNMENT_LINK | CO_OWNERSHIP | ACCESS_GRANT | OKR_CYCLE", constraints: "OBJECTIVE | KEY_RESULT | REVIEW_SCORE | ALIGNMENT_LINK | CO_OWNERSHIP | ACCESS_GRANT | OKR_CYCLE" }
      - { name: entity_id, type: string, source: system, description: "Affected entity id" }
      - { name: action, type: enum, source: system, description: "CREATE | UPDATE | DELETE | STATE_TRANSITION | SCORE_CHANGE | CALIBRATION", constraints: "CREATE | UPDATE | DELETE | STATE_TRANSITION | SCORE_CHANGE | CALIBRATION" }
      - { name: actor_user_id, type: string, source: system, description: "Actor (X-User-ID); 'SYSTEM' for cascaded/auto changes" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role at time of change" }
      - { name: before_value, type: object, source: system, description: "JSON snapshot of changed fields before; null for CREATE" }
      - { name: after_value, type: object, source: system, description: "JSON snapshot of changed fields after; null for DELETE" }
      - { name: api_request_id, type: string, source: system, description: "Originating API request id" }

  - name: ExternalEvent
    parent: null
    common_fields: false  # append-only event
    fields:
      - { name: source_system, type: enum, source: input, description: "HR | PROJECT_MGMT | IM", constraints: "HR | PROJECT_MGMT | IM" }
      - { name: external_event_id, type: string, source: input, description: "Source-system event id; uniqueness scoped (source_system, external_event_id) within DEDUP_WINDOW_MINUTES" }
      - { name: event_type, type: string, source: input, description: "Source-specific type, e.g. EMPLOYEE_TRANSFERRED, PROJECT_CLOSED, IM_REMINDER_SENT" }
      - { name: payload, type: object, source: input, description: "JSON payload" }
      - { name: received_at, type: datetime, source: system, description: "Server-assigned receipt time (the system clock)" }
      - { name: processing_status, type: enum, source: system, description: "RECEIVED | PROCESSED | DUPLICATE | INVALID", default: RECEIVED, constraints: "RECEIVED | PROCESSED | DUPLICATE | INVALID" }
      - { name: processed_at, type: datetime, source: system, description: "Set when processed" }
      - { name: side_effect_summary, type: string, source: system, description: "Human-readable summary of resulting mutations" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: OKRCycle
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: POST /cycles/{id}/open
        actor: PlatformAdmin
        preconditions:
          - "No other cycle in OPEN or IN_REVIEW status whose [start_date, end_date) interval overlaps this cycle's interval (ERR_CYCLE_OVERLAP)"
        side_effects:
          - "AuditLog written"

      - from: OPEN
        to: IN_REVIEW
        trigger: POST /cycles/{id}/start-review
        actor: PlatformAdmin
        preconditions:
          - "Cycle.status == OPEN"
        side_effects:
          - "Each Objective in this cycle with status==ACTIVE transitions to IN_REVIEW; every such Objective gets a ReviewScore created at PENDING_SELF (one per Objective)"
          - "AuditLog STATE_TRANSITION written for cycle and each affected objective"

      - from: IN_REVIEW
        to: LOCKED
        trigger: POST /cycles/{id}/lock
        actor: PlatformAdmin
        preconditions:
          - "Every ReviewScore for objectives in this cycle is in LOCKED state"
        side_effects:
          - "Each Objective in this cycle with status==IN_REVIEW transitions to LOCKED"
          - "Cycle.completion_rate set to count(LOCKED objectives) / count(non-archived objectives in this cycle), 4 decimals"
          - "AuditLog written"

      - from: LOCKED
        to: ARCHIVED
        trigger: POST /cycles/{id}/archive
        actor: PlatformAdmin
        preconditions:
          - "Cycle.status == LOCKED"
        side_effects:
          - "Each Objective in this cycle transitions to ARCHIVED"
          - "Each AlignmentLink whose upstream or downstream is now ARCHIVED transitions ACCEPTED→BROKEN; PENDING links involving archived objectives transition to REJECTED with rejection_reason='cycle_archived'"
          - "AuditLog STATE_TRANSITION written for cycle, each archived objective, and each affected link"

  - entity: Objective
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /objectives/{id}/publish
        actor: Owner
        preconditions:
          - "Objective.cycle.status == OPEN (cross-entity gate, ERR_CYCLE_NOT_OPEN)"
          - "Either: Objective has at least one KR with sum-of-weights == 1.0; OR Objective has at least one ACTIVE child Objective with sum-of-child-weights == 1.0 (mutually exclusive: cannot have both KRs and child Objectives)"
          - "If parent_objective_id is set, parent Objective.status == ACTIVE (ERR_PARENT_NOT_ACTIVE)"
          - "If parent_objective_id is set, parent.level is one rank higher (COMPANY > DEPARTMENT > TEAM > INDIVIDUAL) (ERR_PARENT_LEVEL_INVALID)"
          - "If parent_objective_id is set, parent.cycle_id == this.cycle_id (ERR_PARENT_NOT_IN_SAME_CYCLE)"
        side_effects:
          - "Compute Objective.progress (live)"
          - "AuditLog written"

      - from: ACTIVE
        to: DRAFT
        trigger: POST /objectives/{id}/revert
        actor: Owner
        preconditions:
          - "Objective.cycle.status == OPEN"
          - "No ProgressUpdate exists for any of this objective's KRs"
          - "No ACCEPTED AlignmentLink references this objective"
          - "No ACTIVE child Objective references this objective as parent"
        side_effects:
          - "AuditLog written"

      - from: ACTIVE
        to: IN_REVIEW
        trigger: System (cascaded from cycle.start-review)
        actor: system
        preconditions:
          - "Cycle.status transitioning to IN_REVIEW"
        side_effects:
          - "Create ReviewScore at PENDING_SELF"

      - from: IN_REVIEW
        to: LOCKED
        trigger: System (cascaded from review.lock)
        actor: system
        preconditions:
          - "ReviewScore.status == LOCKED"
        side_effects:
          - "Set Objective.final_score = ReviewScore.final_score"
          - "AuditLog written"

      - from: LOCKED
        to: ARCHIVED
        trigger: System (cascaded from cycle.archive)
        actor: system
        preconditions:
          - "Cycle.status transitioning to ARCHIVED"
        side_effects:
          - "Each ACCEPTED AlignmentLink → BROKEN; each PENDING link → REJECTED (reason='cycle_archived')"
          - "AuditLog written"

      - from: ACTIVE
        to: ARCHIVED
        trigger: POST /objectives/{id}/archive
        actor: PlatformAdmin
        preconditions:
          - "No ACTIVE child Objective"
          - "Cycle.status IN {OPEN, LOCKED}"
        side_effects:
          - "Each ACCEPTED AlignmentLink → BROKEN"
          - "AuditLog written"

  - entity: ReviewScore
    initial_state: PENDING_SELF
    terminal_states: [LOCKED]
    transitions:
      - from: PENDING_SELF
        to: PENDING_MANAGER
        trigger: POST /reviews/{id}/self-submit
        actor: Owner
        preconditions:
          - "Cycle.status == IN_REVIEW (cross-entity gate)"
          - "Objective.status == IN_REVIEW"
          - "self_score in [0,1] (boundary inclusive at both ends)"
        side_effects:
          - "ReviewScore.self_score set; ReviewScore.self_submitted_at set"
          - "AuditLog written"

      - from: PENDING_MANAGER
        to: PENDING_CALIBRATION
        trigger: POST /reviews/{id}/manager-submit
        actor: Manager
        preconditions:
          - "Cycle.status == IN_REVIEW"
          - "X-User-ID == User where Objective.owner_user_id.manager_id == X-User-ID (acting Manager must be the Objective owner's direct manager) (ERR_NOT_MANAGER_OF_OWNER)"
          - "manager_score in [0,1]"
        side_effects:
          - "ReviewScore.manager_score set; ReviewScore.manager_submitted_at set"
          - "AuditLog written"

      - from: PENDING_MANAGER
        to: PENDING_SELF
        trigger: POST /reviews/{id}/manager-return
        actor: Manager
        preconditions:
          - "Cycle.status == IN_REVIEW"
          - "X-User-ID is direct manager of Objective.owner_user_id"
        side_effects:
          - "ReviewScore.self_score reset to null; ReviewScore.self_submitted_at reset to null"
          - "ReviewScore.revision_count += 1"
          - "AuditLog written"

      - from: PENDING_CALIBRATION
        to: LOCKED
        trigger: POST /reviews/{id}/lock
        actor: HRBP
        preconditions:
          - "Cycle.status == IN_REVIEW"
          - "ReviewScore.calibration_score is set OR ReviewScore.manager_score is set (lock without calibration adjustment is permitted only if HRBP explicitly locks without calibrating)"
        side_effects:
          - "ReviewScore.final_score = calibration_score if not null else manager_score"
          - "ReviewScore.locked_at set"
          - "Cascade: Objective.status IN_REVIEW → LOCKED; Objective.final_score set"
          - "AuditLog written"

      - from: PENDING_CALIBRATION
        to: PENDING_MANAGER
        trigger: POST /reviews/{id}/calibration-return
        actor: HRBP
        preconditions:
          - "Cycle.status == IN_REVIEW"
        side_effects:
          - "ReviewScore.manager_score reset to null; manager_submitted_at reset"
          - "AuditLog written"

  - entity: AlignmentLink
    initial_state: PENDING
    terminal_states: [REJECTED, BROKEN]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: POST /alignment-links/{id}/accept
        actor: DownstreamOwner
        preconditions:
          - "X-User-ID == downstream Objective.owner_user_id (or co-owner) (ERR_NOT_OWNER)"
          - "Both upstream and downstream Objective.status == ACTIVE (cross-entity gate)"
          - "Accepting must NOT introduce a directed cycle in the ACCEPTED-link graph (ERR_CIRCULAR_REFERENCE)"
        side_effects:
          - "AlignmentLink.accepted_at set"
          - "Compute forward_impact_score and backward_impact_score"
          - "AuditLog written"

      - from: PENDING
        to: REJECTED
        trigger: POST /alignment-links/{id}/reject
        actor: DownstreamOwner
        preconditions:
          - "X-User-ID == downstream Objective.owner_user_id (or co-owner)"
          - "rejection_reason provided (non-empty)"
        side_effects:
          - "AuditLog written"

      - from: ACCEPTED
        to: BROKEN
        trigger: System (cascaded when upstream or downstream Objective transitions to ARCHIVED)
        actor: system
        preconditions:
          - "Either upstream or downstream Objective transitioning to ARCHIVED"
        side_effects:
          - "AuditLog written"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two managers concurrently issue manager-submit on the same review"
    guarantee: "Exactly one manager-submit succeeds; the loser sees ERR_INVALID_STATE because the winner advanced the review out of PENDING_MANAGER"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on ReviewScore.status (PENDING_MANAGER → PENDING_CALIBRATION)"

  - scenario: "Owner self-submits while manager concurrently issues manager-return"
    guarantee: "Exactly one operation succeeds; loser sees ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on ReviewScore.status"

  - scenario: "Two clients concurrently accept the same alignment link"
    guarantee: "Exactly one accept succeeds; second sees ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on AlignmentLink.status (PENDING → ACCEPTED)"

  - scenario: "Two updates to KR.current_value with stale version"
    guarantee: "Loser sees ERR_VERSION_CONFLICT; both updates use OCC version field"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Optimistic concurrency on KeyResult.version"

  - scenario: "Concurrent grant + revoke of access for same (objective, user) pair"
    guarantee: "Exactly one operation succeeds; loser sees ERR_DUPLICATE_GRANT (if grant lost) or ERR_GRANT_NOT_FOUND (if revoke lost)"
    error_id: ERR_DUPLICATE_GRANT
    http_status: 409
    serialization: "First-writer-wins on (objective_id, user_id) uniqueness for ACTIVE AccessGrant"

  - scenario: "Two ExternalEvents arrive with identical (source_system, external_event_id) within DEDUP_WINDOW_MINUTES"
    guarantee: "Second event recorded with processing_status=DUPLICATE; no side effects executed for the duplicate"
    error_id: ERR_DUPLICATE_EVENT
    http_status: 409
    serialization: "First-writer-wins on (source_system, external_event_id) within DEDUP_WINDOW_MINUTES"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: kr_score
    trigger: "Recomputed on every ProgressUpdate for the KR; also recomputed on KR creation; result cached on KeyResult.score"
    algorithm: weighted_scoring
    formula: |
      def kr_score(kr):
          if kr.measurement_type == 'NUMERIC' or kr.measurement_type == 'PERCENTAGE':
              denom = kr.target_value - kr.start_value
              if denom == 0:
                  raw = 1.0 if kr.current_value >= kr.target_value else 0.0
              else:
                  raw = (kr.current_value - kr.start_value) / denom
          elif kr.measurement_type == 'MILESTONE':
              total = len(kr.milestones)
              if total == 0:
                  raw = 0.0
              else:
                  completed = sum(1 for m in kr.milestones if m['completed'])
                  raw = completed / total
          # CLAMP to [0,1]
          clamped = max(0.0, min(1.0, raw))
          return round(clamped, 4)  # round_half_up
    input_set: "Every ACTIVE KeyResult of an Objective; ARCHIVED KRs are excluded from parent objective_progress"
    constants: {}
    precision: "4 decimal places, round_half_up"
    variants: []

  - name: objective_progress
    trigger: "Recomputed when (a) any descendant KR.score changes, (b) any descendant Objective.progress changes (cascade-up), (c) Objective is published"
    algorithm: aggregation
    formula: |
      def objective_progress(objective):
          # mutually exclusive: leaf vs parent
          if objective.kr_count > 0:
              # leaf: weighted average of KR scores
              # ROUNDING ORDER (PINNED): round per-KR-score to 4 decimals FIRST, then weighted-sum, then round result to 4 decimals
              # (Must NOT sum unrounded, otherwise last-decimal divergence.)
              kr_scores = [(round(kr.score, 4), kr.weight) for kr in objective.active_krs]
              weighted_sum = sum(s * w for s, w in kr_scores)
              return round(weighted_sum, 4)
          elif objective.child_count > 0:
              # parent: weighted average of child Objective progress
              # SAME PINNED ORDER: round per-child-progress to 4 decimals FIRST, then weighted-sum, then round
              child_terms = [(round(c.progress, 4), c.weight) for c in objective.active_children]
              weighted_sum = sum(p * w for p, w in child_terms)
              return round(weighted_sum, 4)
          else:
              return 0.0
    input_set: "Active KRs (status=ACTIVE) for leaf; ACTIVE child Objectives for parent. ARCHIVED descendants excluded. CoOwnership.contribution_weight does NOT enter this formula — it is used only by attribution reads, not by progress."
    constants: {}
    precision: "4 decimal places, round_half_up"
    variants: []

  - name: objective_final_score
    trigger: "Set when associated ReviewScore transitions to LOCKED"
    algorithm: dual_variant
    formula: |
      def objective_final_score(objective, review):
          if review.status != 'LOCKED':
              return None  # not yet finalized
          # final_score: pinned to calibration_score if set, else manager_score
          return review.calibration_score if review.calibration_score is not None else review.manager_score
    input_set: "Single ReviewScore for the objective"
    constants: {}
    precision: "4 decimal places, round_half_up"
    variants:
      - name: provisional_progress_variant
        when: "Read on Objective.progress while ReviewScore.status != LOCKED"
        difference: "Computed live from current KR scores via objective_progress; reflects in-flight values"
      - name: locked_variant
        when: "Read on Objective.final_score after ReviewScore.status == LOCKED"
        difference: "Snapshot of calibration_score or manager_score at lock time; does NOT change when KRs are subsequently updated. For the same Objective with the same KR data, provisional_progress and locked_variant typically yield different numbers because review scoring is human-judged and may diverge from progress."

  - name: review_aggregate_score
    trigger: "Read on every ReviewScore GET; intermediate during review chain"
    algorithm: weighted_scoring
    formula: |
      def review_aggregate_score(review):
          # Multi-input weighted formula with conditional branch on |manager - self| delta
          # Inputs: self_score, manager_score, calibration_score, plus thresholds
          if review.calibration_score is not None:
              return round(review.calibration_score, 4)
          if review.manager_score is None:
              return None
          if review.self_score is None:
              return round(review.manager_score, 4)
          delta = abs(review.manager_score - review.self_score)
          if delta > MIN_CALIBRATION_DELTA_TRIGGER:
              # Calibration is required before lock; aggregate is the manager_score weighted with self_score
              # weighted average using SELF_WEIGHT and MANAGER_WEIGHT
              return round(review.self_score * SELF_WEIGHT + review.manager_score * MANAGER_WEIGHT, 4)
          else:
              # delta within tolerance — manager_score stands
              return round(review.manager_score, 4)
    input_set: "Single ReviewScore"
    constants:
      SELF_WEIGHT: 0.3
      MANAGER_WEIGHT: 0.7
      MIN_CALIBRATION_DELTA_TRIGGER: 0.20
    precision: "4 decimal places, round_half_up"
    variants: []

  - name: alignment_impact_score
    trigger: "Computed when AlignmentLink transitions to ACCEPTED; recomputed on read GET /objectives/{id}/impact-graph"
    algorithm: dual_variant
    formula: |
      def forward_impact_score(link):
          # Forward: how much upstream's progress propagates to downstream on this link
          # = upstream.progress * ATTENUATION ^ hop_distance(=1 for direct)
          return round(link.upstream.progress * ATTENUATION, 4)

      def backward_impact_score(link):
          # Backward: attribution share of downstream's progress to this upstream contributor
          # = downstream.progress * UPSTREAM_INFLUENCE / count(ACCEPTED upstream links into downstream)
          n_upstreams = count_accepted_upstreams(link.downstream)
          if n_upstreams == 0:
              return 0.0
          return round(link.downstream.progress * UPSTREAM_INFLUENCE / n_upstreams, 4)
    input_set: "ACCEPTED AlignmentLinks; both upstream and downstream Objectives' live progress"
    constants:
      ATTENUATION: 0.7
      UPSTREAM_INFLUENCE: 0.5
    precision: "4 decimal places, round_half_up"
    variants:
      - name: forward_variant
        when: "Read upstream-perspective impact on downstream"
        difference: "Multiplies upstream.progress by ATTENUATION; depends on upstream's progress, not downstream's"
      - name: backward_variant
        when: "Read downstream-perspective attribution to upstream"
        difference: "Distributes downstream.progress * UPSTREAM_INFLUENCE evenly across accepted upstream contributors; depends on downstream's progress AND on count of upstream contributors. For the same link, forward and backward generally diverge."

  - name: cycle_completion_rate
    trigger: "Recomputed on cycle.lock and on objective state changes within an IN_REVIEW or LOCKED cycle; readable on GET /cycles/{id}"
    algorithm: aggregation
    formula: |
      def cycle_completion_rate(cycle):
          objectives = [o for o in cycle.objectives if o.status != 'ARCHIVED']
          if len(objectives) == 0:
              return 0.0
          locked = [o for o in objectives if o.status == 'LOCKED']
          return round(len(locked) / len(objectives), 4)
    input_set: "All non-archived Objectives in this cycle"
    constants: {}
    precision: "4 decimal places, round_half_up"
    variants: []

  - name: stale_kr_check
    trigger: "Evaluated on each KR read; sweep on POST /_sweep/stale-kr-reminders"
    algorithm: threshold
    formula: |
      def is_stale(kr, now):
          if kr.status != 'ACTIVE':
              return False
          if kr.last_update_at is None:
              # Use Objective.created_at as baseline; KR is stale if Objective is older than threshold
              age_days = (now - kr.objective.created_at).total_days()
          else:
              age_days = (now - kr.last_update_at).total_days()
          return age_days >= STALE_THRESHOLD_DAYS  # boundary: >=, NOT >
    input_set: "ACTIVE KRs whose parent Objective.status == ACTIVE"
    constants:
      STALE_THRESHOLD_DAYS: 14
    precision: "Integer comparison on full days; partial days truncated"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (priority-ordered)
# =============================================================================
validations:
  - { priority: 1,  category: auth,                  check: "X-User-ID and X-User-Role headers present",                                            error_id: ERR_MISSING_AUTH,             http_status: 401, applies_to: "all" }
  - { priority: 2,  category: auth,                  check: "X-User-Role is one of {PlatformAdmin, HRBP, Manager, Employee}",                       error_id: ERR_INVALID_AUTH,             http_status: 401, applies_to: "all" }
  - { priority: 3,  category: existence,             check: "X-User-ID resolves to a User in ACTIVE status when role is Manager or Employee",       error_id: ERR_USER_NOT_FOUND,           http_status: 404, applies_to: "all" }
  - { priority: 4,  category: existence,             check: "Cycle in path or body exists",                                                          error_id: ERR_CYCLE_NOT_FOUND,          http_status: 404, applies_to: "/cycles/*, /objectives (POST when cycle_id supplied)" }
  - { priority: 5,  category: existence,             check: "Objective in path or body exists",                                                      error_id: ERR_OBJECTIVE_NOT_FOUND,      http_status: 404, applies_to: "/objectives/*, /alignment-links (POST when objective ids supplied), /reviews/*" }
  - { priority: 6,  category: existence,             check: "KeyResult exists",                                                                      error_id: ERR_KR_NOT_FOUND,             http_status: 404, applies_to: "/key-results/*" }
  - { priority: 7,  category: existence,             check: "AlignmentLink exists",                                                                  error_id: ERR_LINK_NOT_FOUND,           http_status: 404, applies_to: "/alignment-links/{id}/*" }
  - { priority: 8,  category: existence,             check: "ReviewScore exists",                                                                    error_id: ERR_REVIEW_NOT_FOUND,         http_status: 404, applies_to: "/reviews/{id}/*" }
  - { priority: 9,  category: existence,             check: "User referenced in body (owner_user_id, co_owner_user_id, granted user_id) exists",     error_id: ERR_USER_NOT_FOUND,           http_status: 404, applies_to: "/objectives, /objectives/{id}/co-owners, /objectives/{id}/access-grants" }
  - { priority: 10, category: existence,             check: "Department referenced in body exists",                                                  error_id: ERR_DEPARTMENT_NOT_FOUND,     http_status: 404, applies_to: "/objectives, /users" }
  - { priority: 11, category: state,                 check: "X-User-Role permitted for this endpoint per RBAC",                                      error_id: ERR_FORBIDDEN,                http_status: 403, applies_to: "all" }
  - { priority: 12, category: state,                 check: "Acting user is Objective.owner_user_id or active CoOwnership.co_owner_user_id (when endpoint requires owner)",  error_id: ERR_NOT_OWNER, http_status: 403, applies_to: "/objectives/{id}/publish, /objectives/{id}/revert, /objectives/{id}/key-results (POST), /key-results/{id}/progress, /reviews/{id}/self-submit, /alignment-links/{id}/accept, /alignment-links/{id}/reject" }
  - { priority: 13, category: state,                 check: "For Manager-only ops, X-User-ID is the direct manager of Objective.owner_user_id (i.e. owner.manager_id == X-User-ID)", error_id: ERR_NOT_MANAGER_OF_OWNER, http_status: 403, applies_to: "/reviews/{id}/manager-submit, /reviews/{id}/manager-return" }
  - { priority: 14, category: state,                 check: "If Objective.confidential==true and reader is not in {PlatformAdmin, HRBP, Objective.owner, active co-owner, ACTIVE AccessGrant.user}, hide from list and reject GET",  error_id: ERR_NOT_VISIBLE,             http_status: 403, applies_to: "/objectives/{id}, /objectives (filtered list)" }
  - { priority: 15, category: state,                 check: "Cycle in correct status for action (OPEN for objective creation/publish, IN_REVIEW for review actions, LOCKED before archive)",  error_id: ERR_CYCLE_NOT_OPEN, http_status: 409, applies_to: "/objectives (POST), /objectives/{id}/publish, /key-results/* (POST progress), /reviews/*" }
  - { priority: 16, category: state,                 check: "Target Objective in correct status for action (ACTIVE for KR mutations and progress; ACTIVE for alignment-accept on both ends)",   error_id: ERR_OBJECTIVE_NOT_ACTIVE, http_status: 409, applies_to: "/objectives/{id}/key-results (POST), /key-results/{id}/progress (POST), /alignment-links/{id}/accept" }
  - { priority: 17, category: state,                 check: "ReviewScore in correct status for action (PENDING_SELF for self-submit, PENDING_MANAGER for manager-submit and manager-return, PENDING_CALIBRATION for calibrate / lock / calibration-return)",  error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "/reviews/{id}/*" }
  - { priority: 18, category: state,                 check: "AlignmentLink in PENDING status for accept/reject",                                     error_id: ERR_INVALID_STATE,            http_status: 409, applies_to: "/alignment-links/{id}/accept, /alignment-links/{id}/reject" }
  - { priority: 19, category: business_referential,  check: "Parent Objective.level is exactly one rank higher (COMPANY=4, DEPARTMENT=3, TEAM=2, INDIVIDUAL=1) than child level",            error_id: ERR_PARENT_LEVEL_INVALID, http_status: 422, applies_to: "/objectives (POST when parent_objective_id set)" }
  - { priority: 20, category: business_referential,  check: "Parent Objective.cycle_id == child.cycle_id",                                            error_id: ERR_PARENT_NOT_IN_SAME_CYCLE, http_status: 422, applies_to: "/objectives (POST when parent_objective_id set)" }
  - { priority: 21, category: business_referential,  check: "Parent Objective.status == ACTIVE at publish time",                                    error_id: ERR_PARENT_NOT_ACTIVE,        http_status: 422, applies_to: "/objectives/{id}/publish" }
  - { priority: 22, category: business_constraint,   check: "Sum of weights of ACTIVE KeyResults under the Objective equals 1.0 (tolerance 1e-4) at publish time",                          error_id: ERR_KR_WEIGHTS_INVALID, http_status: 422, applies_to: "/objectives/{id}/publish, /objectives/{id}/key-results (POST or DELETE)" }
  - { priority: 23, category: business_constraint,   check: "Sum of CoOwnership.contribution_weight for an Objective is in (0, 1] (single-owner=null co-ownership omitted; with co-owners, sum must equal 1.0 minus owner's implicit 1.0; expressed: sum_of_contribution_weights <= 1.0 strictly)",  error_id: ERR_CO_OWNER_WEIGHTS_INVALID, http_status: 422, applies_to: "/objectives/{id}/co-owners (POST/DELETE)" }
  - { priority: 24, category: business_constraint,   check: "Accepting AlignmentLink does not introduce a directed cycle in the ACCEPTED-link graph",  error_id: ERR_CIRCULAR_REFERENCE,    http_status: 422, applies_to: "/alignment-links/{id}/accept" }
  - { priority: 25, category: business_constraint,   check: "(upstream_objective_id, downstream_objective_id) is unique among non-REJECTED AlignmentLinks; upstream != downstream",            error_id: ERR_DUPLICATE_LINK, http_status: 409, applies_to: "/alignment-links (POST)" }
  - { priority: 26, category: business_constraint,   check: "ProgressUpdate.new_value within KR.start_value..KR.target_value range (sign-aware: if target>start then [start,target]; if target<start then [target,start]). For PERCENTAGE, also enforce [0.0, 1.0]",  error_id: ERR_PROGRESS_OUT_OF_RANGE, http_status: 422, applies_to: "/key-results/{id}/progress (POST)" }
  - { priority: 27, category: business_constraint,   check: "ProgressUpdate.update_type matches KR.measurement_type (VALUE_CHANGE for NUMERIC/PERCENTAGE, MILESTONE_TOGGLE for MILESTONE)",  error_id: ERR_KR_TYPE_MISMATCH, http_status: 422, applies_to: "/key-results/{id}/progress (POST)" }
  - { priority: 28, category: business_constraint,   check: "Calibration_score is provided AND |calibration_score - manager_score| > MIN_CALIBRATION_DELTA (0.05) — i.e., a calibration must move the needle by more than 0.05; equal-to triggers rejection",  error_id: ERR_DELTA_TOO_SMALL, http_status: 422, applies_to: "/reviews/{id}/calibrate" }
  - { priority: 29, category: business_constraint,   check: "Objective cannot have BOTH KRs and child Objectives at publish",                       error_id: ERR_OBJECTIVE_KR_OR_CHILDREN, http_status: 422, applies_to: "/objectives/{id}/publish" }
  - { priority: 30, category: business_temporal,     check: "OKRCycle [start_date, end_date) must not overlap with any non-ARCHIVED OKRCycle. Half-open semantics: A.end == B.start is NOT overlap",  error_id: ERR_CYCLE_OVERLAP, http_status: 409, applies_to: "/cycles (POST), /cycles/{id}/open" }
  - { priority: 31, category: business_temporal,     check: "ExternalEvent (source_system, external_event_id) seen within DEDUP_WINDOW_MINUTES (60 min, closed interval) of a prior ExternalEvent ⇒ duplicate. Window: |received_at_now - prior.received_at| <= 60 min",  error_id: ERR_DUPLICATE_EVENT, http_status: 409, applies_to: "/external-events (POST)" }
  - { priority: 32, category: business_constraint,   check: "version field on PATCH/PUT must equal current entity version (OCC)",                   error_id: ERR_VERSION_CONFLICT,         http_status: 409, applies_to: "/objectives/{id} (PATCH), /key-results/{id} (PATCH), /cycles/{id} (PATCH)" }
  - { priority: 33, category: business_constraint,   check: "Required field present and types match envelope; pagination params within bounds",     error_id: ERR_INVALID_REQUEST,          http_status: 400, applies_to: "all" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Bootstrap / setup ---
  - { method: POST,   path: "/departments",                                  description: "Create department",                  roles: [PlatformAdmin],                                code: 201, input: [code, name, 'parent_department_id?'],                                                            output: Department,    side_effects: [AuditLog] }
  - { method: GET,    path: "/departments",                                  description: "List departments",                   roles: [PlatformAdmin, HRBP, Manager, Employee],       code: 200, input: ['limit?', 'offset?'],                                                                              output: "Department[]" }
  - { method: POST,   path: "/users",                                  description: "Create user",                        roles: [PlatformAdmin, HRBP],                          code: 201, input: [email, full_name, department_id, 'manager_id?', role_type],                                      output: User,          side_effects: [AuditLog] }
  - { method: GET,    path: "/users",                                  description: "List users",                         roles: [PlatformAdmin, HRBP, Manager, Employee],       code: 200, input: ['limit?', 'offset?', 'department_id?', 'role_type?'],                                                  output: "User[]" }
  - { method: GET,    path: "/users/{id}",                                  description: "Read user",                          roles: [PlatformAdmin, HRBP, Manager, Employee],       code: 200, input: [],                                                                                              output: User }

  # --- Cycles ---
  - { method: POST,   path: "/cycles",                                  description: "Create OKR cycle (DRAFT)",           roles: [PlatformAdmin],                                code: 201, input: [cycle_code, year, quarter, start_date, end_date],                                              output: OKRCycle,       side_effects: [AuditLog] }
  - { method: GET,    path: "/cycles",                                  description: "List cycles",                        roles: [PlatformAdmin, HRBP, Manager, Employee],       code: 200, input: ['limit?', 'offset?', 'status?', 'year?'],                                                              output: "OKRCycle[]" }
  - { method: GET,    path: "/cycles/{id}",                                  description: "Read cycle",                         roles: [PlatformAdmin, HRBP, Manager, Employee],       code: 200, input: [],                                                                                              output: OKRCycle }
  - { method: POST,   path: "/cycles/{id}/open",                                  description: "DRAFT → OPEN",                       roles: [PlatformAdmin],                                code: 200, input: ['version?'],                                                                                       output: OKRCycle,       side_effects: [AuditLog] }
  - { method: POST,   path: "/cycles/{id}/start-review",                                  description: "OPEN → IN_REVIEW (cascade ReviewScores)",                                            roles: [PlatformAdmin], code: 200, input: [],                                                                            output: OKRCycle,       side_effects: [Cascade objective→IN_REVIEW, ReviewScore creation, AuditLog] }
  - { method: POST,   path: "/cycles/{id}/lock",                                  description: "IN_REVIEW → LOCKED",                 roles: [PlatformAdmin],                                code: 200, input: [],                                                                                              output: OKRCycle,       side_effects: [completion_rate recomputed, cascade objective→LOCKED, AuditLog] }
  - { method: POST,   path: "/cycles/{id}/archive",                                  description: "LOCKED → ARCHIVED",                  roles: [PlatformAdmin],                                code: 200, input: [],                                                                                              output: OKRCycle,       side_effects: [Cascade objectives→ARCHIVED, AlignmentLink ACCEPTED→BROKEN / PENDING→REJECTED, AuditLog] }

  # --- Objectives ---
  - { method: POST,   path: "/objectives",                                  description: "Create objective (DRAFT)",           roles: [PlatformAdmin, HRBP, Manager, Employee],       code: 201, input: [cycle_id, level, department_id, owner_user_id, title, 'description?', weight, 'confidential?', 'parent_objective_id?'], output: Objective, side_effects: [AuditLog] }
  - { method: GET,    path: "/objectives",                                  description: "List objectives (visibility-filtered, supports filter+sort+paginate)", roles: [PlatformAdmin, HRBP, Manager, Employee], code: 200, input: ['limit?', 'offset?', 'cycle_id?', 'level?', 'owner_user_id?', 'status?', 'department_id?', 'confidential?'], output: "Objective[]" }
  - { method: GET,    path: "/objectives/{id}",                                  description: "Read objective (visibility-checked)", roles: [PlatformAdmin, HRBP, Manager, Employee],      code: 200, input: [],                                                                                              output: Objective }
  - { method: PATCH,  path: "/objectives/{id}",                                  description: "Update mutable fields (title, description, weight, confidential)", roles: [PlatformAdmin, Owner],     code: 200, input: ['title?', 'description?', 'weight?', 'confidential?', version],                                       output: Objective,     side_effects: [AuditLog, OCC] }
  - { method: POST,   path: "/objectives/{id}/publish",                                  description: "DRAFT → ACTIVE",                     roles: [Owner, PlatformAdmin],                         code: 200, input: [],                                                                                              output: Objective,     side_effects: [recompute progress, AuditLog] }
  - { method: POST,   path: "/objectives/{id}/revert",                                  description: "ACTIVE → DRAFT (only when no progress, no children, no accepted links)", roles: [Owner, PlatformAdmin], code: 200, input: [],                                                                                output: Objective,     side_effects: [AuditLog] }
  - { method: POST,   path: "/objectives/{id}/archive",                                  description: "ACTIVE → ARCHIVED (admin only, mid-cycle)", roles: [PlatformAdmin],                          code: 200, input: [],                                                                                              output: Objective,     side_effects: [Cascade AlignmentLinks→BROKEN, AuditLog] }
  - { method: GET,    path: "/objectives/{id}/impact-graph",                                  description: "Return upstream + downstream alignment graph with forward and backward impact scores", roles: [PlatformAdmin, HRBP, Manager, Employee], code: 200, input: [], output: object }

  # --- Key Results ---
  - { method: POST,   path: "/objectives/{id}/key-results",                                  description: "Add KR to DRAFT/ACTIVE objective",   roles: [Owner, PlatformAdmin],                         code: 201, input: [title, measurement_type, 'start_value?', 'target_value?', 'milestones?', weight],                     output: KeyResult,     side_effects: [recompute objective.progress, AuditLog] }
  - { method: GET,    path: "/objectives/{id}/key-results",                                  description: "List KRs of objective",              roles: [PlatformAdmin, HRBP, Manager, Employee],       code: 200, input: ['limit?', 'offset?', 'status?'],                                                                      output: "KeyResult[]" }
  - { method: GET,    path: "/key-results/{id}",                                  description: "Read KR",                            roles: [PlatformAdmin, HRBP, Manager, Employee],       code: 200, input: [],                                                                                              output: KeyResult }
  - { method: PATCH,  path: "/key-results/{id}",                                  description: "Update title / weight / target_value (only while parent is DRAFT or ACTIVE & no progress)", roles: [Owner, PlatformAdmin], code: 200, input: ['title?', 'weight?', 'target_value?', version],                                                       output: KeyResult,     side_effects: [recompute objective.progress, AuditLog, OCC] }
  - { method: DELETE, path: "/key-results/{id}",                                  description: "Soft-delete (status→ARCHIVED). Forbidden if any ProgressUpdate exists or parent is IN_REVIEW/LOCKED/ARCHIVED",  roles: [Owner, PlatformAdmin], code: 204, input: [], output: null,         side_effects: [recompute objective.progress, AuditLog] }
  - { method: POST,   path: "/key-results/{id}/progress",                                  description: "Append ProgressUpdate; auto-recompute KR.score and Objective.progress (cascade up)", roles: [Owner, PlatformAdmin], code: 201, input: [update_type, 'new_value?', 'milestone_index?', 'milestone_completed?', 'comment?'],   output: ProgressUpdate, side_effects: [KR.score recomputed, KR.last_update_at set, Objective.progress recomputed (cascade up to root), AuditLog] }
  - { method: GET,    path: "/key-results/{id}/progress",                                  description: "List ProgressUpdates (chronological)", roles: [PlatformAdmin, HRBP, Manager, Employee],     code: 200, input: ['limit?', 'offset?'],                                                                              output: "ProgressUpdate[]" }

  # --- Alignment links ---
  - { method: POST,   path: "/alignment-links",                                  description: "Declare link PENDING",               roles: [Owner, PlatformAdmin],                         code: 201, input: [upstream_objective_id, downstream_objective_id, dependency_type],                              output: AlignmentLink,  side_effects: [AuditLog] }
  - { method: GET,    path: "/alignment-links",                                  description: "List links",                         roles: [PlatformAdmin, HRBP, Manager, Employee],       code: 200, input: ['limit?', 'offset?', 'upstream_objective_id?', 'downstream_objective_id?', 'status?', 'dependency_type?'], output: "AlignmentLink[]" }
  - { method: POST,   path: "/alignment-links/{id}/accept",                                  description: "PENDING → ACCEPTED (downstream owner; cycle check)", roles: [DownstreamOwner, PlatformAdmin],   code: 200, input: [],                                                                                              output: AlignmentLink,  side_effects: [forward+backward impact computed, AuditLog] }
  - { method: POST,   path: "/alignment-links/{id}/reject",                                  description: "PENDING → REJECTED",                 roles: [DownstreamOwner, PlatformAdmin],               code: 200, input: [rejection_reason],                                                                              output: AlignmentLink,  side_effects: [AuditLog] }

  # --- Co-ownership ---
  - { method: POST,   path: "/objectives/{id}/co-owners",                                  description: "Add co-owner",                       roles: [Owner, PlatformAdmin],                         code: 201, input: [co_owner_user_id, contribution_weight],                                                        output: CoOwnership,   side_effects: [AuditLog] }
  - { method: DELETE, path: "/objectives/{id}/co-owners/{user_id}",                                  description: "Remove co-owner (status→REMOVED)",   roles: [Owner, PlatformAdmin],                         code: 204, input: [],                                                                                              output: null,           side_effects: [AuditLog] }
  - { method: GET,    path: "/objectives/{id}/co-owners",                                  description: "List active co-owners",              roles: [PlatformAdmin, HRBP, Manager, Employee],       code: 200, input: [],                                                                                              output: "CoOwnership[]" }

  # --- Reviews ---
  - { method: GET,    path: "/reviews/{id}",                                  description: "Read ReviewScore",                   roles: [PlatformAdmin, HRBP, Manager, Owner],          code: 200, input: [],                                                                                              output: ReviewScore }
  - { method: POST,   path: "/reviews/{id}/self-submit",                                  description: "PENDING_SELF → PENDING_MANAGER",     roles: [Owner],                                        code: 200, input: [self_score],                                                                                    output: ReviewScore,   side_effects: [AuditLog] }
  - { method: POST,   path: "/reviews/{id}/manager-submit",                                  description: "PENDING_MANAGER → PENDING_CALIBRATION", roles: [Manager],                                  code: 200, input: [manager_score],                                                                                  output: ReviewScore,   side_effects: [AuditLog] }
  - { method: POST,   path: "/reviews/{id}/manager-return",                                  description: "PENDING_MANAGER → PENDING_SELF (return for revision; revision_count++)", roles: [Manager],     code: 200, input: [],                                                                                              output: ReviewScore,   side_effects: [self_score and self_submitted_at reset to null, AuditLog] }
  - { method: POST,   path: "/reviews/{id}/calibrate",                                  description: "Set calibration_score (delta>MIN required); status remains PENDING_CALIBRATION", roles: [HRBP],         code: 200, input: [calibration_score],                                                                              output: ReviewScore,   side_effects: [AuditLog] }
  - { method: POST,   path: "/reviews/{id}/calibration-return",                                  description: "PENDING_CALIBRATION → PENDING_MANAGER (return for re-review)",                                  roles: [HRBP],   code: 200, input: [],                                                                                              output: ReviewScore,   side_effects: [manager_score reset to null, AuditLog] }
  - { method: POST,   path: "/reviews/{id}/lock",                                  description: "PENDING_CALIBRATION → LOCKED; final_score=calibration_score (or manager_score if calibration is null)", roles: [HRBP], code: 200, input: [],                                                                              output: ReviewScore,   side_effects: [Cascade Objective→LOCKED, Objective.final_score set, AuditLog] }

  # --- Confidential access grants ---
  - { method: POST,   path: "/objectives/{id}/access-grants",                                  description: "Grant confidential read access",     roles: [Owner, PlatformAdmin],                         code: 201, input: [user_id],                                                                                       output: AccessGrant,   side_effects: [AuditLog] }
  - { method: DELETE, path: "/objectives/{id}/access-grants/{user_id}",                                  description: "Revoke (status→REVOKED)",            roles: [Owner, PlatformAdmin],                         code: 204, input: [],                                                                                              output: null,           side_effects: [AuditLog] }
  - { method: GET,    path: "/objectives/{id}/access-grants",                                  description: "List ACTIVE grants",                 roles: [Owner, PlatformAdmin, HRBP],                   code: 200, input: [],                                                                                              output: "AccessGrant[]" }

  # --- External events / IM sync ---
  - { method: POST,   path: "/external-events",                                  description: "Receive event from HR/PROJECT_MGMT/IM (idempotent within DEDUP_WINDOW_MINUTES)", roles: [PlatformAdmin], code: 201, input: [source_system, external_event_id, event_type, payload],                                       output: ExternalEvent,  side_effects: [Side effects depend on event_type; AuditLog for resulting mutations] }
  - { method: GET,    path: "/external-events",                                  description: "List events",                        roles: [PlatformAdmin, HRBP],                          code: 200, input: ['limit?', 'offset?', 'source_system?', 'processing_status?'],                                          output: "ExternalEvent[]" }

  # --- Audit logs ---
  - { method: GET,    path: "/audit-logs",                                  description: "List audit log entries",             roles: [PlatformAdmin, HRBP],                          code: 200, input: ['limit?', 'offset?', 'entity_type?', 'entity_id?', 'actor_user_id?', 'action?'],                            output: "AuditLog[]" }

  # --- Test-driving endpoints (required for time-gated and sweep behavior) ---
  - { method: POST,   path: "/_clock/advance",                                  description: "Advance the system clock by N seconds (test-only; required to exercise stale-update threshold and DEDUP_WINDOW boundaries)", roles: [PlatformAdmin], code: 200, input: [seconds], output: object, side_effects: [advances internal clock used by ExternalEvent dedup window and stale-KR threshold] }
  - { method: POST,   path: "/_sweep/stale-kr-reminders",                                  description: "Trigger stale-KR sweep; increments Objective.stale_warning_count for each ACTIVE KR whose age >= STALE_THRESHOLD_DAYS",                            roles: [PlatformAdmin], code: 200, input: [], output: object, side_effects: [Objective.stale_warning_count++, AuditLog] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH,                http: 401, condition: "X-User-ID or X-User-Role header missing" }
  - { id: ERR_INVALID_AUTH,                http: 401, condition: "X-User-Role not in {PlatformAdmin, HRBP, Manager, Employee}" }
  - { id: ERR_FORBIDDEN,                   http: 403, condition: "Authenticated role not permitted for this endpoint" }
  - { id: ERR_NOT_OWNER,                   http: 403, condition: "Acting user is not the Objective owner or active co-owner where ownership is required" }
  - { id: ERR_NOT_MANAGER_OF_OWNER,        http: 403, condition: "Acting Manager is not the direct manager of the Objective owner (owner.manager_id != X-User-ID)" }
  - { id: ERR_NOT_VISIBLE,                 http: 403, condition: "Confidential objective; reader is not in access list" }
  - { id: ERR_USER_NOT_FOUND,              http: 404, condition: "Referenced User not found" }
  - { id: ERR_DEPARTMENT_NOT_FOUND,        http: 404, condition: "Referenced Department not found" }
  - { id: ERR_CYCLE_NOT_FOUND,             http: 404, condition: "Referenced OKRCycle not found" }
  - { id: ERR_OBJECTIVE_NOT_FOUND,         http: 404, condition: "Referenced Objective not found" }
  - { id: ERR_KR_NOT_FOUND,                http: 404, condition: "Referenced KeyResult not found" }
  - { id: ERR_LINK_NOT_FOUND,              http: 404, condition: "Referenced AlignmentLink not found" }
  - { id: ERR_REVIEW_NOT_FOUND,            http: 404, condition: "Referenced ReviewScore not found" }
  - { id: ERR_GRANT_NOT_FOUND,             http: 404, condition: "Referenced AccessGrant not found" }
  - { id: ERR_INVALID_STATE,               http: 409, condition: "Target entity not in valid state for the requested action (covers ReviewScore wrong-step, AlignmentLink not PENDING, etc.)" }
  - { id: ERR_CYCLE_NOT_OPEN,              http: 409, condition: "Cycle not in OPEN status when an OPEN-only operation is requested" }
  - { id: ERR_OBJECTIVE_NOT_ACTIVE,        http: 409, condition: "Objective not in ACTIVE status when an ACTIVE-only operation is requested (e.g., progress update, alignment-accept)" }
  - { id: ERR_DUPLICATE_LINK,              http: 409, condition: "AlignmentLink with same (upstream, downstream) already exists in PENDING/ACCEPTED state" }
  - { id: ERR_DUPLICATE_GRANT,             http: 409, condition: "AccessGrant for (objective, user) already exists in ACTIVE status" }
  - { id: ERR_DUPLICATE_CO_OWNER,          http: 409, condition: "CoOwnership for (objective, user) already exists in ACTIVE status" }
  - { id: ERR_CYCLE_OVERLAP,               http: 409, condition: "Proposed cycle [start,end) overlaps another non-ARCHIVED cycle" }
  - { id: ERR_DUPLICATE_EVENT,             http: 409, condition: "ExternalEvent (source, external_event_id) seen within DEDUP_WINDOW_MINUTES of a prior event" }
  - { id: ERR_VERSION_CONFLICT,            http: 409, condition: "OCC version mismatch on PATCH" }
  - { id: ERR_PARENT_LEVEL_INVALID,        http: 422, condition: "Parent Objective level not exactly one rank above child level" }
  - { id: ERR_PARENT_NOT_IN_SAME_CYCLE,    http: 422, condition: "Parent Objective.cycle_id != child.cycle_id" }
  - { id: ERR_PARENT_NOT_ACTIVE,           http: 422, condition: "Parent Objective.status != ACTIVE at publish time" }
  - { id: ERR_KR_WEIGHTS_INVALID,          http: 422, condition: "Sum of ACTIVE KR.weight != 1.0 (tolerance 1e-4) at publish time" }
  - { id: ERR_CO_OWNER_WEIGHTS_INVALID,    http: 422, condition: "Sum of ACTIVE CoOwnership.contribution_weight on the objective is not in (0,1)" }
  - { id: ERR_CIRCULAR_REFERENCE,          http: 422, condition: "Accepting AlignmentLink would introduce a directed cycle in the ACCEPTED-link graph" }
  - { id: ERR_PROGRESS_OUT_OF_RANGE,       http: 422, condition: "ProgressUpdate.new_value outside permitted range for the KR's measurement_type" }
  - { id: ERR_KR_TYPE_MISMATCH,            http: 422, condition: "ProgressUpdate.update_type does not match KR.measurement_type" }
  - { id: ERR_DELTA_TOO_SMALL,             http: 422, condition: "Calibration |calibration_score - manager_score| <= MIN_CALIBRATION_DELTA (0.05)" }
  - { id: ERR_OBJECTIVE_KR_OR_CHILDREN,    http: 422, condition: "Objective at publish has both KRs and child Objectives, which is forbidden" }
  - { id: ERR_INVALID_REQUEST,             http: 400, condition: "Schema/type/pagination violation" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "System administrator. Manages cycles, departments, users, external events. Sees everything including confidential objectives. Has override on most ownership-gated operations."
    identity: opaque
    exclusive_operations:
      - "POST /cycles, POST /cycles/{id}/open, POST /cycles/{id}/start-review, POST /cycles/{id}/lock, POST /cycles/{id}/archive"
      - "POST /departments"
      - "POST /external-events, GET /external-events"
      - "POST /_clock/advance, POST /_sweep/stale-kr-reminders"
      - "POST /objectives/{id}/archive (mid-cycle archive)"
    shared_operations:
      - "All read endpoints"
      - "POST /users (with HRBP)"
      - "All ownership-gated mutations on objectives, KRs, alignment, co-ownership, access-grants (admin override)"

  - name: HRBP
    description: "HR Business Partner. Calibrates reviews, locks final scores, audits, sees confidential by class."
    identity: opaque
    exclusive_operations:
      - "POST /reviews/{id}/calibrate, POST /reviews/{id}/calibration-return, POST /reviews/{id}/lock"
      - "GET /audit-logs"
    shared_operations:
      - "POST /users (with PlatformAdmin)"
      - "All read endpoints (including confidential objectives)"

  - name: Manager
    description: "User with direct reports. Reviews subordinates' objectives. Owns and acts on own objectives. Identity is the User row whose role_type=MANAGER."
    identity: entity_backed:User
    exclusive_operations:
      - "POST /reviews/{id}/manager-submit, POST /reviews/{id}/manager-return (only for reviews where Objective.owner.manager_id == self)"
    shared_operations:
      - "POST /objectives, PATCH /objectives/{id}, POST /objectives/{id}/publish, POST /objectives/{id}/revert (when self is owner or co-owner)"
      - "All Owner-gated KR / progress / alignment / co-owner / access-grant operations on own objectives"
      - "All read endpoints (visibility-filtered for confidential)"
      - "POST /reviews/{id}/self-submit when acting as Owner of own review"

  - name: Employee
    description: "Individual contributor. Owns and acts on own objectives. Identity is the User row whose role_type=EMPLOYEE."
    identity: entity_backed:User
    exclusive_operations: []
    shared_operations:
      - "POST /objectives, PATCH /objectives/{id}, POST /objectives/{id}/publish, POST /objectives/{id}/revert (when self is owner or co-owner)"
      - "All Owner-gated KR / progress / alignment-accept / alignment-reject / co-owner / access-grant operations on own objectives"
      - "POST /reviews/{id}/self-submit when self is Objective.owner_user_id"
      - "All read endpoints (visibility-filtered)"
