            - "e_release == \"ERR_INVALID_RELEASE_STATE\" with HTTP 409: release is only declared from PLANNED, and the check names the TARGET resource's own dimension even though the parent deal is in a valid state"
            - "e_agreement == \"ERR_INVALID_AGREEMENT_STATE\" with HTTP 409: propose-amendment is only declared from ACTIVE"
            - "e_spend == \"ERR_INVALID_SPEND_STATE\" with HTTP 409: settle is only declared from APPROVED; settled_amount_cents 50000 <= amount_cents 100000 so the priority-5 schema rule cannot be the cause"
