  - { method: GET, path: "/mill/cell-bookings", description: "List bookings with filters", roles: [SalesRep, ProductionPlanner, MaterialReceiver, QualityInspector, ComplianceOfficer, ShippingCoordinator, PlantAdmin], code: 200, input: ["cell_id?", "order_line_id?", "status?", "limit?", "offset?"], output: "CellBooking[]", side_effects: [] }
  - { method: GET, path: "/mill/cell-bookings/{id}", description: "Get a booking", roles: [SalesRep, ProductionPlanner, MaterialReceiver, QualityInspector, ComplianceOfficer, ShippingCoordinator, PlantAdmin], code: 200, input: [], output: CellBooking, side_effects: [] }
