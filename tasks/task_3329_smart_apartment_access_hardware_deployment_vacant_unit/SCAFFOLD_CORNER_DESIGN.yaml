            - call: "POST /installation-jobs/${job_ss}/complete"
              payload: {}
              as: HardwareTechnician
          assert:
            - "InstallationJob.${job_ss}.status == COMPLETED"
            - "InstallationJob.${job_ss}.labor_hours == 0.5 (SIMPLE tier, no rework)"

      - name: connectivity_age_penalty_flips_service_adjusted_building
        claim_type: Variant Selection
        grounds:
          - calculations.building_connectivity_ok.variants.service_adjusted
          - constants.AGE_PENALTY_DB_PER_DAY
          - entities.Building.fields.last_hub_service_at
        distinguishing_aspect: "Two buildings with the same raw rssi=-74 and FIELD_MESH design differ only by hub age: the freshly-serviced one stays connected while the one last serviced 20 days ago fails, because floor(0.1*20)=2 dB is subtracted."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Property P exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
