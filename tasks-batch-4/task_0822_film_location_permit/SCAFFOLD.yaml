scenario: "Municipal Film & Location Permit Office: production application & location detail, road-closure/parking & multi-department review, fee & COI/indemnification, neighborhood notification, officer/monitor assignment, conflict/double-booking, wrap & deposit refund, still-photo/drone rider"
domain_name: "film-location-permit"
api_prefix: "/"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys; associations (DepartmentReview,
  # RoadClosureBooking, OfficerAssignment) are flat rows referencing their
  # parents by FK rather than being nested resources in the URL path.

  state_machine_shape: cyclic
  # PermitApplication and DepartmentReview both loop through revision rounds
  # (UNDER_REVIEW -> REVISION_REQUIRED -> UNDER_REVIEW; PENDING ->
  # REVISION_REQUESTED -> PENDING) rather than being linear pipelines.

  relationship_patterns:
    - one_to_many        # PermitApplication has many LocationDetail / Rider / DepartmentReview
    - cross_aggregate    # DepartmentReview references both PermitApplication and Department
    - polymorphic        # LedgerEntry.entry_type spans PERMIT_FEE / DEPOSIT / REFUND

  role_model: peer_roles
  # ProductionCompany owns applications; DepartmentReviewer owns reviews;
  # FieldOfficer owns wrap-close; FilmOfficeCoordinator is the operational
  # office. Non-overlapping resource ownership.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# §1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: ProductionCompany
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the production company"
      - name: contact_email
        type: string
        source: input
        description: "Primary contact email"
      - name: primary_contact
        type: string
        source: input
        description: "Name of the primary point of contact"
      - name: late_wrap_count
        type: integer
        source: system
        description: "Count of prior applications that wrapped after their permitted end time"
        default: 0
      - name: damage_incident_count
        type: integer
        source: system
        description: "Count of prior applications whose wrap-close reported damage"
        default: 0
      - name: missed_notification_count
        type: integer
        source: system
        description: "Count of prior applications where a neighborhood notification was rejected as too late at issue time"
        default: 0
      - name: compliance_score
        type: integer
        source: computed
        description: "Weighted standing score (see calc production_compliance_score); FINAL variant recomputed on wrap-close"
        default: 100

  - name: Department
    parent: null
    common_fields: false
    fields:
      - name: code
        type: enum
        source: input
        description: "Reviewing department"
        constraints: "one of {POLICE, PARKING, FIRE, PUBLIC_WORKS}"
      - name: name
        type: string
        source: input
        description: "Human-readable department name"
      - name: trigger_condition
        type: enum
        source: input
        description: "Which applications require this department's review"
        constraints: "one of {ALL_APPLICATIONS, ROAD_CLOSURE_ONLY, PARKING_ONLY, DRONE_ONLY}"

  - name: Officer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Officer full name"
      - name: badge_number
        type: string
        source: input
        description: "Badge number"
      - name: rank
        type: enum
        source: input
        description: "Rank"
        constraints: "one of {OFFICER, SERGEANT, LIEUTENANT}"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: "Billing rate per hour in integer cents"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "ACTIVE on creation; set to INACTIVE via PATCH"
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE}"

  - name: StreetSegment
    parent: null
    common_fields: false
    fields:
      - name: segment_code
        type: string
        source: input
        description: "Short unique code for the physical street segment (e.g. MAIN-100)"
      - name: name
        type: string
        source: input
        description: "Human-readable street segment name"
      - name: length_m
        type: number
        source: input
        description: "Length of the segment in meters"
        constraints: "> 0"

  - name: PermitApplication
    parent: null
    common_fields: true
    fields:
      - name: production_company_id
        type: string
        source: input
        description: "FK -> ProductionCompany.id; the applicant"
      - name: title
        type: string
        source: input
        description: "Production title"
      - name: synopsis
        type: string
        source: input
        description: "Short description of the shoot"
      - name: shoot_start_at
        type: datetime
        source: input
        description: "Requested shoot start (ISO 8601 UTC)"
      - name: shoot_end_at
        type: datetime
        source: input
        description: "Requested shoot end (ISO 8601 UTC); must be after shoot_start_at"
      - name: crew_size
        type: integer
        source: input
        description: "Total crew headcount"
        constraints: ">= 1"
      - name: requires_road_closure
        type: boolean
        source: input
        description: "True if the production needs street closures"
        default: false
      - name: requires_parking
        type: boolean
        source: input
        description: "True if the production needs reserved parking"
        default: false
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: DRAFT
        constraints: "one of {DRAFT, UNDER_REVIEW, REVISION_REQUIRED, ISSUED, WRAP_REQUESTED, WRAPPED, WITHDRAWN}"
      - name: shoot_days
        type: integer
        source: computed
        description: "Inclusive calendar-day span: date(shoot_end_at) - date(shoot_start_at) + 1"
      - name: estimated_fee_cents
        type: integer
        source: computed
        description: "permit_fee ESTIMATE variant total (subtotal + surcharge), stamped on submit"
        default: 0
      - name: final_fee_cents
        type: integer
        source: computed
        description: "permit_fee FINAL variant subtotal, stamped on issue"
        default: 0
      - name: municipal_surcharge_cents
        type: integer
        source: computed
        description: "municipal_surcharge over the FINAL subtotal, stamped on issue"
        default: 0
      - name: total_fee_cents
        type: integer
        source: computed
        description: "final_fee_cents + municipal_surcharge_cents, stamped on issue"
        default: 0
      - name: deposit_cents
        type: integer
        source: computed
        description: "deposit_amount over total_fee_cents plus per-confirmed-booking bond, stamped on issue"
        default: 0
      - name: amount_paid_cents
        type: integer
        source: system
        description: "Running sum of PERMIT_FEE LedgerEntry DEBIT amounts for this application"
        default: 0
      - name: deposit_held_cents
        type: integer
        source: system
        description: "Conserved quantity: sum(DEPOSIT DEBIT amount_cents) - sum(REFUND CREDIT amount_cents) for this application"
        default: 0
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the permit was issued"
        default: null
      - name: permitted_end_at
        type: datetime
        source: system
        description: "Snapshot of shoot_end_at taken at issue; late-wrap penalty is measured against this"
        default: null
      - name: actual_end_at
        type: datetime
        source: system
        description: "Actual production end reported at wrap-close"
        default: null
      - name: damage_cost_cents
        type: integer
        source: system
        description: "Damage cost reported at wrap-close"
        default: 0
      - name: late_wrap_penalty_cents
        type: integer
        source: computed
        description: "Late-wrap penalty computed at wrap-close (see deposit_refund)"
        default: 0
      - name: deposit_refund_cents
        type: integer
        source: computed
        description: "Refund amount computed and credited at wrap-close (see deposit_refund)"
        default: 0

  - name: LocationDetail
    parent: null
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> PermitApplication.id"
      - name: address
        type: string
        source: input
        description: "Street address of the location"
      - name: geo_zone
        type: string
        source: input
        description: "Notification zone identifier this location falls in"
      - name: activity_type
        type: enum
        source: input
        description: "What happens at this location"
        constraints: "one of {FILMING, EQUIPMENT_STAGING, BASECAMP}"
      - name: requested_start_at
        type: datetime
        source: input
        description: "Requested occupation start at this location"
      - name: requested_end_at
        type: datetime
        source: input
        description: "Requested occupation end at this location"
      - name: uses_road_closure
        type: boolean
        source: input
        description: "True if this location requires a street closure"
        default: false

  - name: DepartmentReview
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> PermitApplication.id"
      - name: department_id
        type: string
        source: input
        description: "FK -> Department.id"
      - name: status
        type: enum
        source: system
        description: "Review decision state"
        default: PENDING
        constraints: "one of {PENDING, APPROVED, REJECTED, REVISION_REQUESTED}"
      - name: decision_notes
        type: string
        source: system
        description: "Notes recorded with the last decision"
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the last decision"
        default: null

  - name: InsuranceCertificate
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> PermitApplication.id"
      - name: policy_number
        type: string
        source: input
        description: "Insurance policy number"
      - name: coverage_amount_cents
        type: integer
        source: input
        description: "General liability coverage in integer cents"
        constraints: ">= 0"
      - name: aviation_coverage
        type: boolean
        source: input
        description: "True if the policy includes aviation/drone liability"
        default: false
      - name: effective_date
        type: datetime
        source: input
        description: "Policy effective date"
      - name: expiration_date
        type: datetime
        source: input
        description: "Policy expiration date; must be after effective_date"
      - name: status
        type: enum
        source: system
        description: "Verification state; SUPERSEDED when a newer COI replaces it"
        default: SUBMITTED
        constraints: "one of {SUBMITTED, VERIFIED, REJECTED, SUPERSEDED}"

  - name: RoadClosureBooking
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> PermitApplication.id"
      - name: street_segment_id
        type: string
        source: input
        description: "FK -> StreetSegment.id"
      - name: closure_start_at
        type: datetime
        source: input
        description: "Requested closure start (ISO 8601 UTC)"
      - name: closure_end_at
        type: datetime
        source: input
        description: "Requested closure end; must be after closure_start_at"
      - name: status
        type: enum
        source: system
        description: "Booking state"
        default: PENDING
        constraints: "one of {PENDING, CONFIRMED, RELEASED, BLOCKED}"

  - name: OfficerAssignment
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> PermitApplication.id"
      - name: officer_id
        type: string
        source: input
        description: "FK -> Officer.id"
      - name: shift_start_at
        type: datetime
        source: input
        description: "Shift start (ISO 8601 UTC)"
      - name: shift_end_at
        type: datetime
        source: input
        description: "Shift end; must be after shift_start_at"
      - name: status
        type: enum
        source: system
        description: "Assignment state"
        default: PROPOSED
        constraints: "one of {PROPOSED, CONFIRMED, CANCELLED, COMPLETED}"
      - name: billed_cost_cents
        type: integer
        source: computed
        description: "hourly_rate_cents * ceil(shift hours), computed on creation"
        default: 0

  - name: Rider
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> PermitApplication.id"
      - name: rider_type
        type: enum
        source: input
        description: "Kind of special-activity rider"
        constraints: "one of {DRONE, STILL_PHOTO}"
      - name: faa_waiver_number
        type: string
        source: input
        description: "FAA waiver number (DRONE only)"
        default: null
      - name: max_altitude_ft
        type: integer
        source: input
        description: "Maximum flight altitude in feet (DRONE only)"
        default: null
      - name: flight_start_at
        type: datetime
        source: input
        description: "Flight window start (DRONE only)"
        default: null
      - name: flight_end_at
        type: datetime
        source: input
        description: "Flight window end (DRONE only)"
        default: null
      - name: status
        type: enum
        source: system
        description: "Rider decision state"
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, DENIED}"

  - name: NeighborhoodNotification
    parent: null
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> PermitApplication.id"
      - name: geo_zone
        type: string
        source: input
        description: "Notification zone that was notified"
      - name: notice_method
        type: enum
        source: input
        description: "How residents were notified"
        constraints: "one of {MAILED, POSTED, DOOR_HANGER}"
      - name: sent_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the notice was recorded as sent"
      - name: lead_days
        type: integer
        source: computed
        description: "floor((shoot_start_at - sent_at) / 86400 seconds); must be >= NOTIFICATION_MIN_LEAD_DAYS"

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> PermitApplication.id"
      - name: entry_type
        type: enum
        source: input
        description: "PERMIT_FEE and DEPOSIT are client payments; REFUND is system-created at wrap-close"
        constraints: "one of {PERMIT_FEE, DEPOSIT, REFUND}"
      - name: direction
        type: enum
        source: system
        description: "DEBIT for PERMIT_FEE/DEPOSIT (money into the city); CREDIT for REFUND (money back to company)"
        constraints: "one of {DEBIT, CREDIT}"
      - name: amount_cents
        type: integer
        source: input
        description: "Amount in integer cents"
        constraints: "> 0"
      - name: memo
        type: string
        source: system
        description: "System memo describing the entry"
        default: null

# ===========================================================================
# §1.2 State Machine Table
# ===========================================================================
state_machines:
  - entity: PermitApplication
    initial_state: DRAFT
    terminal_states: [WRAPPED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/submit"
        actor: ProductionCompany
        preconditions:
          - "application has >= 1 LocationDetail (else ERR_NO_LOCATIONS)"
          - "shoot_end_at > shoot_start_at"
        side_effects:
          - "compute shoot_days and stamp estimated_fee_cents = permit_fee ESTIMATE total"
          - "for each Department whose trigger_condition matches this application, create a DepartmentReview{status=PENDING}"
          - "increments PermitApplication.version by 1"
        note: "Multi-department fan-out; the DepartmentReview rows created here are NOT a transitive cascade (parallel fan-out), they are the review surface."
      - from: UNDER_REVIEW
        to: REVISION_REQUIRED
        trigger: "system: a DepartmentReview for this application transitions to REJECTED"
        actor: system
        preconditions:
          - "at least one DepartmentReview for this application is REJECTED"
        side_effects:
          - "CASCADE A link 2 (depth-2 cascade): every RoadClosureBooking for this application whose status IN {PENDING, CONFIRMED} transitions to RELEASED"
          - "increments PermitApplication.version by 1"
        note: "Cascade A (depth 2) = review REJECTED (link 1) -> app REVISION_REQUIRED here (link 2 releases this application's own bookings)."
      - from: REVISION_REQUIRED
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/submit"
        actor: ProductionCompany
        preconditions:
          - "application has >= 1 LocationDetail"
        side_effects:
          - "every DepartmentReview for this application with status IN {REJECTED, REVISION_REQUESTED} is reset to PENDING"
          - "recompute estimated_fee_cents = permit_fee ESTIMATE total"
          - "increments PermitApplication.version by 1"
        note: "Revision loop (cyclic): applicant resubmits after addressing rejections."
      - from: UNDER_REVIEW
        to: ISSUED
        trigger: "POST /applications/{id}/issue"
        actor: FilmOfficeCoordinator
        preconditions:
          - "every DepartmentReview for this application is APPROVED (else ERR_REVIEWS_INCOMPLETE)"
          - "there exists an InsuranceCertificate for this application with status=VERIFIED (else ERR_COI_NOT_VERIFIED)"
          - "amount_paid_cents >= estimated_fee_cents (else ERR_FEE_UNPAID)"
          - "expected_application_version matches current PermitApplication.version (else ERR_STALE_APPLICATION_VERSION)"
        side_effects:
          - "CASCADE B link 1: every RoadClosureBooking for this application with status=PENDING transitions to CONFIRMED"
          - "each newly CONFIRMED booking triggers CASCADE B link 2 (see RoadClosureBooking PENDING->CONFIRMED)"
          - "every OfficerAssignment for this application with status=PROPOSED transitions to CONFIRMED"
          - "stamp final_fee_cents = permit_fee FINAL subtotal (computed AFTER bookings are confirmed and using APPROVED riders only)"
          - "stamp municipal_surcharge_cents, total_fee_cents, deposit_cents"
          - "stamp issued_at = clock now and permitted_end_at = shoot_end_at"
          - "increments PermitApplication.version by 1"
        note: "Side-effect ORDER is pinned: confirm bookings first, then compute FINAL fee against confirmed bookings + approved riders. The depth-3 CASCADE B originates here: issue (action) -> booking PENDING->CONFIRMED (hop 1) -> competitor PENDING->BLOCKED (hop 2) -> competitor's PROPOSED OfficerAssignments -> CANCELLED (hop 3)."
      - from: ISSUED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: ProductionCompany
        preconditions:
          - "application.status == ISSUED (permit surrender / revocation)"
        side_effects:
          - "every RoadClosureBooking for this application with status=CONFIRMED transitions to RELEASED (which restores BLOCKED competitors on the same segment)"
          - "every OfficerAssignment for this application with status=CONFIRMED transitions to CANCELLED"
          - "if deposit_held_cents > 0: create a REFUND LedgerEntry{direction=CREDIT, amount_cents=deposit_held_cents} and set deposit_held_cents to 0"
          - "increments PermitApplication.version by 1"
        note: "Surrender of an issued permit; releasing CONFIRMED bookings is what makes the BLOCKED->PENDING restore reachable."
      - from: ISSUED
        to: WRAP_REQUESTED
        trigger: "POST /applications/{id}/wrap-request"
        actor: ProductionCompany
        preconditions:
          - "a DEPOSIT payment has been recorded: deposit_held_cents >= deposit_cents (else ERR_DEPOSIT_UNPAID)"
        side_effects:
          - "increments PermitApplication.version by 1"
      - from: WRAP_REQUESTED
        to: WRAPPED
        trigger: "POST /applications/{id}/wrap-close"
        actor: FieldOfficer
        preconditions:
          - "actual_end_at >= issued_at"
        side_effects:
          - "stamp actual_end_at, damage_cost_cents from the request"
          - "compute late_wrap_penalty_cents and deposit_refund_cents (see calc deposit_refund)"
          - "create a REFUND LedgerEntry{direction=CREDIT, amount_cents=deposit_refund_cents} and decrement deposit_held_cents by deposit_refund_cents"
          - "every OfficerAssignment for this application with status=CONFIRMED transitions to COMPLETED"
          - "if actual_end_at > permitted_end_at: increment ProductionCompany.late_wrap_count by 1"
          - "if damage_cost_cents > 0: increment ProductionCompany.damage_incident_count by 1"
          - "recompute ProductionCompany.compliance_score = production_compliance_score FINAL"
          - "increments PermitApplication.version by 1"
        note: "deposit_refund_cents is floored at 0."
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: ProductionCompany
        preconditions: []
        side_effects:
          - "increments PermitApplication.version by 1"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: ProductionCompany
        preconditions: []
        side_effects:
          - "every RoadClosureBooking for this application whose status IN {PENDING, CONFIRMED} transitions to RELEASED"
          - "every OfficerAssignment for this application whose status IN {PROPOSED, CONFIRMED} transitions to CANCELLED"
          - "increments PermitApplication.version by 1"
      - from: REVISION_REQUIRED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: ProductionCompany
        preconditions: []
        side_effects:
          - "increments PermitApplication.version by 1"

  - entity: DepartmentReview
    initial_state: PENDING
    terminal_states: [APPROVED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /department-reviews/{id}/decision (decision=APPROVE)"
        actor: DepartmentReviewer
        preconditions:
          - "parent PermitApplication.status == UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "acting DepartmentReviewer's department_id == DepartmentReview.department_id (else ERR_UNAUTHORIZED)"
        side_effects:
          - "stamp decided_at = clock now"
      - from: PENDING
        to: REJECTED
        trigger: "POST /department-reviews/{id}/decision (decision=REJECT)"
        actor: DepartmentReviewer
        preconditions:
          - "parent PermitApplication.status == UNDER_REVIEW"
          - "acting DepartmentReviewer's department_id == DepartmentReview.department_id"
        side_effects:
          - "stamp decided_at = clock now"
          - "CASCADE A link 1: parent PermitApplication transitions UNDER_REVIEW -> REVISION_REQUIRED"
        note: "Kicks off Cascade A."
      - from: PENDING
        to: REVISION_REQUESTED
        trigger: "POST /department-reviews/{id}/decision (decision=REQUEST_REVISION)"
        actor: DepartmentReviewer
        preconditions:
          - "parent PermitApplication.status == UNDER_REVIEW"
          - "acting DepartmentReviewer's department_id == DepartmentReview.department_id"
        side_effects:
          - "stamp decided_at = clock now"
        note: "Non-terminal soft-reject; does NOT move the application by itself (only REJECTED does)."
      - from: REVISION_REQUESTED
        to: PENDING
        trigger: "system: parent PermitApplication re-enters UNDER_REVIEW via resubmit"
        actor: system
        preconditions:
          - "parent PermitApplication transitioned REVISION_REQUIRED -> UNDER_REVIEW"
        side_effects: []
        note: "Cyclic reset of the review."
      - from: REJECTED
        to: PENDING
        trigger: "system: parent PermitApplication re-enters UNDER_REVIEW via resubmit"
        actor: system
        preconditions:
          - "parent PermitApplication transitioned REVISION_REQUIRED -> UNDER_REVIEW"
        side_effects: []

  - entity: InsuranceCertificate
    initial_state: SUBMITTED
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /insurance-certificates/{id}/verify (decision=VERIFY)"
        actor: FilmOfficeCoordinator
        preconditions:
          - "certificate.status == SUBMITTED"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /insurance-certificates/{id}/verify (decision=REJECT)"
        actor: FilmOfficeCoordinator
        preconditions:
          - "certificate.status == SUBMITTED"
        side_effects: []
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system: a newer InsuranceCertificate is submitted for the same application"
        actor: system
        preconditions:
          - "a newer InsuranceCertificate for the same application_id was created"
        side_effects: []
      - from: VERIFIED
        to: SUPERSEDED
        trigger: "system: a newer InsuranceCertificate is submitted for the same application"
        actor: system
        preconditions:
          - "a newer InsuranceCertificate for the same application_id was created"
        side_effects: []

  - entity: RoadClosureBooking
    initial_state: PENDING
    terminal_states: [RELEASED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "system: parent PermitApplication transitions to ISSUED"
        actor: system
        preconditions:
          - "parent PermitApplication transitioned UNDER_REVIEW -> ISSUED"
        side_effects:
          - "CASCADE B hop 2: every RoadClosureBooking on the SAME street_segment_id with status=PENDING whose buffer-expanded window (see resource_temporal_overlap segment_buffer) overlaps this booking transitions to BLOCKED"
        note: "Confirming an occupier blocks its still-pending competitors on the same segment."
      - from: PENDING
        to: BLOCKED
        trigger: "system: a competing booking on the same street_segment_id is CONFIRMED"
        actor: system
        preconditions:
          - "another RoadClosureBooking on the same street_segment_id became CONFIRMED and overlaps (buffer-expanded)"
        side_effects:
          - "CASCADE B hop 3: every OfficerAssignment for THIS blocked booking's application_id with status=PROPOSED transitions to CANCELLED (the losing applicant no longer needs its officers)"
        note: "Third hop of the depth-3 issue cascade: being blocked cancels the losing application's proposed officer assignments."
      - from: BLOCKED
        to: PENDING
        trigger: "system: the CONFIRMED booking that blocked it is RELEASED, leaving no CONFIRMED overlapper on the segment"
        actor: system
        preconditions:
          - "no CONFIRMED RoadClosureBooking on the same street_segment_id overlaps this booking (buffer-expanded)"
        side_effects: []
        note: "Restore order among eligible BLOCKED bookings: created_at ASC."
      - from: CONFIRMED
        to: RELEASED
        trigger: "system: parent PermitApplication transitions ISSUED -> WITHDRAWN (permit surrender)"
        actor: system
        preconditions:
          - "parent PermitApplication transitioned ISSUED -> WITHDRAWN"
        side_effects:
          - "BLOCKED bookings on the same street_segment_id that no longer overlap any CONFIRMED booking are restored to PENDING (created_at ASC)"
      - from: PENDING
        to: RELEASED
        trigger: "system: parent PermitApplication transitions to REVISION_REQUIRED or WITHDRAWN"
        actor: system
        preconditions:
          - "parent PermitApplication transitioned to REVISION_REQUIRED or WITHDRAWN"
        side_effects: []

  - entity: OfficerAssignment
    initial_state: PROPOSED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "system: parent PermitApplication transitions to ISSUED"
        actor: system
        preconditions:
          - "parent PermitApplication transitioned UNDER_REVIEW -> ISSUED"
        side_effects: []
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /officer-assignments/{id}/cancel"
        actor: FilmOfficeCoordinator
        preconditions:
          - "assignment.status IN {PROPOSED, CONFIRMED}"
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /officer-assignments/{id}/cancel"
        actor: FilmOfficeCoordinator
        preconditions:
          - "assignment.status IN {PROPOSED, CONFIRMED}"
        side_effects: []
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system: parent PermitApplication transitions to WRAPPED"
        actor: system
        preconditions:
          - "parent PermitApplication transitioned WRAP_REQUESTED -> WRAPPED"
        side_effects: []

  - entity: Rider
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /riders/{id}/decision (decision=APPROVE)"
        actor: FilmOfficeCoordinator
        preconditions:
          - "parent PermitApplication.status IN {UNDER_REVIEW, REVISION_REQUIRED}"
        side_effects: []
      - from: REQUESTED
        to: DENIED
        trigger: "POST /riders/{id}/decision (decision=DENY)"
        actor: FilmOfficeCoordinator
        preconditions:
          - "parent PermitApplication.status IN {UNDER_REVIEW, REVISION_REQUIRED}"
        side_effects: []

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on PermitApplication.version)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: coi-supersede-stale-application
    parent_entity: PermitApplication
    write_endpoint: "POST /applications/{id}/insurance-certificates"
    occ_field: "expected_application_version"
    description: |
      Submitting a new InsuranceCertificate supersedes the prior active one and
      advances the application's version. A submission carrying an
      expected_application_version older than the application's current version
      is rejected: the client's view is stale because another COI has already
      been submitted (and legitimately superseded the prior one) since the
      client last read the application.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
  - rule_id: issue-stale-application
    parent_entity: PermitApplication
    write_endpoint: "POST /applications/{id}/issue"
    occ_field: "expected_application_version"
    description: |
      Issuing a permit stamps the FINAL fee from the application's current set of
      approved riders and confirmed bookings. An issue call carrying an
      expected_application_version older than the application's current version
      is rejected: the client's view is stale because the applicant has added a
      rider or location (each of which advances the version) since the
      coordinator last read the application, so issuing now would price a
      different production than the one the coordinator reviewed.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412

# ===========================================================================
# §1.3 Calculation Rules Table
# ===========================================================================
calculations:
  - name: permit_fee
    trigger: "on POST /applications/{id}/submit (ESTIMATE, stamps estimated_fee_cents); on POST /applications/{id}/issue (FINAL, stamps final_fee_cents as the subtotal)"
    algorithm: aggregation
    formula: |
      # All amounts are integer cents. shoot_days = date(shoot_end_at) - date(shoot_start_at) + 1 (inclusive).
      crew_surcharge =
        0       if crew_size <= 15
        20000   if 16 <= crew_size <= 50
        50000   if 51 <= crew_size <= 150
        100000  if crew_size > 150
      road_closure_fee = requires_road_closure ? (ROAD_CLOSURE_PER_BOOKING_CENTS * included_booking_count) : 0
      parking_fee      = requires_parking ? (PARKING_PER_DAY_CENTS * shoot_days) : 0
      rider_fee        = (DRONE_RIDER_FEE_CENTS * included_drone_rider_count)
                       + (STILL_PHOTO_RIDER_FEE_CENTS * included_still_rider_count)
      subtotal = BASE_APPLICATION_FEE_CENTS
               + (PER_DAY_RATE_CENTS * shoot_days)
               + crew_surcharge
               + road_closure_fee
               + parking_fee
               + rider_fee
      # ESTIMATE stamps estimated_fee_cents = subtotal + municipal_surcharge(subtotal).
      # FINAL stamps final_fee_cents = subtotal (surcharge stored separately in municipal_surcharge_cents).
    input_set: "ESTIMATE: included_booking_count = count of RoadClosureBooking for the app with status IN {PENDING, CONFIRMED}; included_drone/still_rider_count = count of Rider of that type with status IN {REQUESTED, APPROVED}. FINAL: included_booking_count = count with status=CONFIRMED (evaluated AFTER issue confirms bookings); included rider counts use status=APPROVED only."
    constants:
      BASE_APPLICATION_FEE_CENTS: 25000
      PER_DAY_RATE_CENTS: 15000
      ROAD_CLOSURE_PER_BOOKING_CENTS: 40000
      PARKING_PER_DAY_CENTS: 10000
      DRONE_RIDER_FEE_CENTS: 30000
      STILL_PHOTO_RIDER_FEE_CENTS: 5000
    precision: "integer cents, no rounding within subtotal (all terms integer)"
    variants:
      - name: ESTIMATE
        when: "at submit, before any review or issuance"
        difference: "counts PENDING+CONFIRMED bookings and REQUESTED+APPROVED riders (forward-looking, everything the applicant asked for)"
      - name: FINAL
        when: "at issue"
        difference: "counts only CONFIRMED bookings and APPROVED riders (denied riders and blocked bookings drop out), producing a different subtotal than ESTIMATE for the same application"

  - name: municipal_surcharge
    trigger: "as a sub-step of permit_fee (ESTIMATE and FINAL) and stamped into municipal_surcharge_cents on issue"
    algorithm: threshold
    formula: |
      # Circular-looking: total = subtotal + surcharge, but the surcharge RATE is keyed on the
      # SUBTOTAL tier (pre-surcharge), NOT on the post-surcharge total. Evaluation order is pinned:
      #   1. compute subtotal (from permit_fee)
      #   2. select bps from subtotal tier
      #   3. surcharge = floor(subtotal * bps / 10000)
      #   4. total = subtotal + surcharge
      bps =
        300  if subtotal < 100000
        500  if 100000 <= subtotal < 300000
        700  if subtotal >= 300000
      surcharge = floor(subtotal * bps / 10000)
    input_set: "operates on a single permit_fee subtotal for one PermitApplication"
    constants:
      TIER1_BPS: 300
      TIER2_BPS: 500
      TIER3_BPS: 700
      TIER1_CEIL_CENTS: 100000
      TIER2_CEIL_CENTS: 300000
    precision: "floor division to integer cents; tier boundaries are [lo, hi) half-open on the subtotal"

  - name: deposit_amount
    trigger: "on POST /applications/{id}/issue, stamped into deposit_cents"
    algorithm: threshold
    formula: |
      deposit_pct_bps = (total_fee_cents >= HIGH_VALUE_CENTS) ? HIGH_PCT_BPS : BASE_PCT_BPS
      deposit = floor(total_fee_cents * deposit_pct_bps / 10000)
              + (ROAD_CLOSURE_BOND_PER_BOOKING_CENTS * confirmed_booking_count)
    input_set: "total_fee_cents from FINAL permit_fee + municipal_surcharge; confirmed_booking_count = count of RoadClosureBooking for the app with status=CONFIRMED at issue"
    constants:
      BASE_PCT_BPS: 2000
      HIGH_PCT_BPS: 2500
      HIGH_VALUE_CENTS: 500000
      ROAD_CLOSURE_BOND_PER_BOOKING_CENTS: 50000
    precision: "floor division to integer cents; threshold at total_fee_cents >= 500000 (>= boundary)"

  - name: deposit_refund
    trigger: "on POST /applications/{id}/wrap-close, stamps late_wrap_penalty_cents and deposit_refund_cents and creates the REFUND LedgerEntry"
    algorithm: chronological
    formula: |
      overage_seconds = max(0, actual_end_at - permitted_end_at)   # seconds
      overage_hours   = ceil(overage_seconds / 3600)
      late_wrap_penalty_cents = LATE_HOURLY_PENALTY_CENTS * overage_hours
      # deposit_held_cents is the running conserved quantity:
      #   deposit_held_cents = sum(DEPOSIT DEBIT amount_cents) - sum(prior REFUND CREDIT amount_cents)
      gross_refund = deposit_held_cents - damage_cost_cents - late_wrap_penalty_cents
      deposit_refund_cents = max(0, gross_refund)
    input_set: "the single PermitApplication being wrapped; deposit_held_cents already reflects all DEPOSIT payments for it"
    constants:
      LATE_HOURLY_PENALTY_CENTS: 20000
    precision: "integer cents; overage rounded UP to whole hours (ceil); refund floored at 0"

  - name: production_compliance_score
    trigger: "PROVISIONAL on GET /production-companies/{id} (read-time derive); FINAL recomputed and stored on wrap-close"
    algorithm: weighted_scoring
    formula: |
      score = 100
            - (LATE_WRAP_POINTS      * late_wrap_count)
            - (DAMAGE_POINTS         * damage_incident_count)
            - (MISSED_NOTICE_POINTS  * missed_notification_count)
      score = max(0, min(100, score))
    input_set: "PROVISIONAL uses the company's currently persisted counters (excludes the in-flight application that has not yet wrapped). FINAL is evaluated on wrap-close AFTER the wrap side-effects have incremented late_wrap_count/damage_incident_count for the just-closed application, so it reflects the new incident."
    constants:
      LATE_WRAP_POINTS: 10
      DAMAGE_POINTS: 15
      MISSED_NOTICE_POINTS: 20
    precision: "integer; clamped to [0, 100]"
    variants:
      - name: PROVISIONAL
        when: "while an application is still open (not yet WRAPPED)"
        difference: "does not yet include the open application's outcome; reflects only counters from previously closed applications"
      - name: FINAL
        when: "immediately after wrap-close applies its counter increments"
        difference: "includes the just-closed application's late-wrap and/or damage incident, lowering the score relative to PROVISIONAL"

  - name: officer_assignment_cost
    trigger: "on POST /officer-assignments, stamped into billed_cost_cents"
    algorithm: aggregation
    formula: |
      shift_hours = ceil((shift_end_at - shift_start_at) / 3600 seconds)
      billed_cost_cents = officer.hourly_rate_cents * shift_hours
    input_set: "the single OfficerAssignment and its referenced Officer"
    constants: {}
    precision: "integer cents; shift rounded UP to whole hours (ceil)"

# ===========================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number = checked first)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted to call this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every resource id in the path exists (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 4
    category: existence
    check: "every FK field in the body references an existing resource (production_company_id, application_id, department_id, street_segment_id, officer_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all create endpoints with FK body fields"
  - priority: 5
    category: business_constraint
    check: "request body well-formed: required fields present, enums in range, integers non-negative where constrained"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 12
    category: business_temporal
    check: "end timestamp strictly after start timestamp (shoot_end_at>shoot_start_at, closure_end_at>closure_start_at, shift_end_at>shift_start_at, expiration_date>effective_date)"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 422
    applies_to: "POST /applications, POST /road-closure-bookings, POST /officer-assignments, POST /applications/{id}/insurance-certificates"
  - priority: 20
    category: auth
    check: "acting DepartmentReviewer's X-User-ID equals DepartmentReview.department_id (a reviewer may only decide its own department's review)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /department-reviews/{id}/decision"
  - priority: 30
    category: state
    check: "target resource is in a state from which this transition is defined (generic invalid-transition guard)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints (submit, issue, withdraw, wrap-request, wrap-close, review decision, coi verify, rider decision, assignment cancel)"
  - priority: 30
    category: state
    check: "payment entry_type allowed for current application status: PERMIT_FEE only when status IN {UNDER_REVIEW, REVISION_REQUIRED}; DEPOSIT only when status=ISSUED"
    error_id: ERR_PAYMENT_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /applications/{id}/payments"
  - priority: 30
    category: state
    check: "child creation requires parent application.status IN {DRAFT, UNDER_REVIEW, REVISION_REQUIRED}"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /applications/{id}/location-details, POST /applications/{id}/riders, POST /applications/{id}/insurance-certificates, POST /road-closure-bookings"
  - priority: 30
    category: state
    check: "officer assignment creation requires the referenced application.status IN {UNDER_REVIEW, ISSUED}"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /officer-assignments"
  - priority: 35
    category: business_constraint
    check: "application has at least one LocationDetail (empty-set boundary)"
    error_id: ERR_NO_LOCATIONS
    http_status: 422
    applies_to: "POST /applications/{id}/submit"
  - priority: 40
    category: state
    check: "on issue: application.status==UNDER_REVIEW AND every DepartmentReview for the application is APPROVED"
    error_id: ERR_REVIEWS_INCOMPLETE
    http_status: 409
    applies_to: "POST /applications/{id}/issue"
  - priority: 40
    category: business_fiscal
    check: "on wrap-request: deposit_held_cents >= deposit_cents (deposit paid)"
    error_id: ERR_DEPOSIT_UNPAID
    http_status: 402
    applies_to: "POST /applications/{id}/wrap-request"
  - priority: 42
    category: state
    check: "on issue: expected_application_version equals current PermitApplication.version (OCC)"
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
    applies_to: "POST /applications/{id}/issue"
  - priority: 42
    category: state
    check: "on COI submit: expected_application_version equals current PermitApplication.version (OCC)"
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
    applies_to: "POST /applications/{id}/insurance-certificates"
  - priority: 45
    category: business_safety
    check: "on issue: an InsuranceCertificate with status=VERIFIED exists for the application"
    error_id: ERR_COI_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /applications/{id}/issue"
  - priority: 48
    category: business_referential
    check: "referenced Officer.status==ACTIVE"
    error_id: ERR_OFFICER_INACTIVE
    http_status: 409
    applies_to: "POST /officer-assignments"
  - priority: 50
    category: business_safety
    check: "DRONE rider requires a VERIFIED InsuranceCertificate with aviation_coverage=true for the application"
    error_id: ERR_AVIATION_COVERAGE_MISSING
    http_status: 422
    applies_to: "POST /applications/{id}/riders"
  - priority: 52
    category: business_temporal
    check: "RoadClosureBooking window, expanded by SETUP_BUFFER_MINUTES=60 on each side, must not overlap any CONFIRMED booking on the same street_segment_id (competing PENDING requests are allowed to coexist and are resolved at issue time)"
    error_id: ERR_SEGMENT_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /road-closure-bookings"
  - priority: 52
    category: business_temporal
    check: "OfficerAssignment window must not overlap any non-terminal (PROPOSED/CONFIRMED) assignment for the same officer_id; intervals are half-open [start,end) so touching (end==start) does NOT conflict; no buffer"
    error_id: ERR_OFFICER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /officer-assignments"
  - priority: 55
    category: business_temporal
    check: "DRONE rider flight window [flight_start_at, flight_end_at] must lie within [application.shoot_start_at, application.shoot_end_at]"
    error_id: ERR_FLIGHT_WINDOW_OUTSIDE_SHOOT
    http_status: 422
    applies_to: "POST /applications/{id}/riders"
  - priority: 55
    category: business_temporal
    check: "neighborhood notification lead_days = floor((shoot_start_at - clock_now)/86400) must be >= NOTIFICATION_MIN_LEAD_DAYS=7 (>= boundary)"
    error_id: ERR_NOTICE_TOO_LATE
    http_status: 422
    applies_to: "POST /applications/{id}/notifications"
  - priority: 60
    category: business_fiscal
    check: "on issue: amount_paid_cents >= estimated_fee_cents (permit fee paid)"
    error_id: ERR_FEE_UNPAID
    http_status: 402
    applies_to: "POST /applications/{id}/issue"

# ===========================================================================
# §1.5 API Endpoint Table
# ===========================================================================
endpoints:
  # ---- ProductionCompany ----
  - method: POST
    path: "/production-companies"
    description: "Register a production company"
    roles: [FilmOfficeCoordinator]
    code: 201
    input: [legal_name, contact_email, primary_contact]
    output: ProductionCompany
    side_effects: ["compliance_score initialized to 100"]
  - method: GET
    path: "/production-companies/{id}"
    description: "Read a production company; compliance_score is the PROVISIONAL production_compliance_score"
    roles: [FilmOfficeCoordinator, ProductionCompany, DepartmentReviewer, FieldOfficer]
    code: 200
    input: []
    output: ProductionCompany
    side_effects: []

  # ---- Department ----
  - method: POST
    path: "/departments"
    description: "Create a reviewing department"
    roles: [FilmOfficeCoordinator]
    code: 201
    input: [code, name, trigger_condition]
    output: Department
    side_effects: []
  - method: GET
    path: "/departments/{id}"
    description: "Read a department"
    roles: [FilmOfficeCoordinator, ProductionCompany, DepartmentReviewer, FieldOfficer]
    code: 200
    input: []
    output: Department
    side_effects: []

  # ---- Officer ----
  - method: POST
    path: "/officers"
    description: "Create an officer"
    roles: [FilmOfficeCoordinator]
    code: 201
    input: [full_name, badge_number, rank, hourly_rate_cents]
    output: Officer
    side_effects: ["status initialized to ACTIVE"]
  - method: GET
    path: "/officers/{id}"
    description: "Read an officer"
    roles: [FilmOfficeCoordinator, ProductionCompany, DepartmentReviewer, FieldOfficer]
    code: 200
    input: []
    output: Officer
    side_effects: []
  - method: PATCH
    path: "/officers/{id}"
    description: "Update an officer's status (ACTIVE/INACTIVE)"
    roles: [FilmOfficeCoordinator]
    code: 200
    input: [status]
    output: Officer
    side_effects: ["setting INACTIVE does not retroactively cancel existing assignments"]

  # ---- StreetSegment ----
  - method: POST
    path: "/street-segments"
    description: "Register a street segment"
    roles: [FilmOfficeCoordinator]
    code: 201
    input: [segment_code, name, length_m]
    output: StreetSegment
    side_effects: []
  - method: GET
    path: "/street-segments/{id}"
    description: "Read a street segment"
    roles: [FilmOfficeCoordinator, ProductionCompany, DepartmentReviewer, FieldOfficer]
    code: 200
    input: []
    output: StreetSegment
    side_effects: []

  # ---- PermitApplication ----
  - method: POST
    path: "/applications"
    description: "Create a draft permit application"
    roles: [ProductionCompany]
    code: 201
    input: [production_company_id, title, synopsis, shoot_start_at, shoot_end_at, crew_size, "requires_road_closure?", "requires_parking?"]
    output: PermitApplication
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/applications/{id}"
    description: "Read a permit application (single-resource read; source of application collection segment)"
    roles: [FilmOfficeCoordinator, ProductionCompany, DepartmentReviewer, FieldOfficer]
    code: 200
    input: []
    output: PermitApplication
    side_effects: []
  - method: GET
    path: "/applications"
    description: "List applications; filterable by production_company_id (reverse-reachability for PermitApplication.production_company_id) and status"
    roles: [FilmOfficeCoordinator, ProductionCompany, DepartmentReviewer, FieldOfficer]
    code: 200
    input: ["production_company_id?", "status?", "limit?", "offset?"]
    output: PermitApplication[]
    side_effects: []
  - method: POST
    path: "/applications/{id}/location-details"
    description: "Add a location to a draft/revision application"
    roles: [ProductionCompany]
    code: 201
    input: [address, geo_zone, activity_type, requested_start_at, requested_end_at, "uses_road_closure?"]
    output: LocationDetail
    side_effects: ["increments PermitApplication.version by 1"]
  - method: GET
    path: "/applications/{id}/location-details"
    description: "List locations for an application (reverse-reachability for LocationDetail.application_id)"
    roles: [FilmOfficeCoordinator, ProductionCompany, DepartmentReviewer, FieldOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: LocationDetail[]
    side_effects: []
  - method: POST
    path: "/applications/{id}/submit"
    description: "Submit a DRAFT/REVISION_REQUIRED application for multi-department review"
    roles: [ProductionCompany]
    code: 200
    input: []
    output: PermitApplication
    side_effects:
      - "DRAFT->UNDER_REVIEW or REVISION_REQUIRED->UNDER_REVIEW"
      - "create a DepartmentReview per matching Department (fan-out)"
      - "stamp estimated_fee_cents = permit_fee ESTIMATE total"
      - "on resubmit, reset REJECTED/REVISION_REQUESTED reviews to PENDING"
      - "increments PermitApplication.version by 1"
  - method: POST
    path: "/applications/{id}/withdraw"
    description: "Withdraw an application (terminal)"
    roles: [ProductionCompany]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["-> WITHDRAWN; if UNDER_REVIEW release bookings + cancel assignments; if ISSUED release CONFIRMED bookings, cancel CONFIRMED assignments, refund remaining deposit_held_cents", "increments PermitApplication.version by 1"]
  - method: POST
    path: "/applications/{id}/issue"
    description: "Issue the permit (coordinator); confirms bookings, stamps FINAL fee/deposit"
    roles: [FilmOfficeCoordinator]
    code: 200
    input: [expected_application_version]
    output: PermitApplication
    side_effects:
      - "confirm PENDING bookings then block competitors (CASCADE B)"
      - "confirm PROPOSED officer assignments"
      - "stamp final_fee_cents, municipal_surcharge_cents, total_fee_cents, deposit_cents, issued_at, permitted_end_at"
      - "increments PermitApplication.version by 1"
  - method: POST
    path: "/applications/{id}/wrap-request"
    description: "Applicant requests wrap after shoot"
    roles: [ProductionCompany]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["ISSUED->WRAP_REQUESTED", "increments PermitApplication.version by 1"]
  - method: POST
    path: "/applications/{id}/wrap-close"
    description: "Field officer closes the wrap; computes refund and updates company compliance"
    roles: [FieldOfficer]
    code: 200
    input: [actual_end_at, damages_reported, "damage_cost_cents?"]
    output: PermitApplication
    side_effects:
      - "WRAP_REQUESTED->WRAPPED"
      - "compute late_wrap_penalty_cents, deposit_refund_cents; create REFUND LedgerEntry; decrement deposit_held_cents"
      - "complete CONFIRMED officer assignments"
      - "update ProductionCompany counters; recompute compliance_score FINAL"
      - "increments PermitApplication.version by 1"

  # ---- InsuranceCertificate (COI) ----
  - method: POST
    path: "/applications/{id}/insurance-certificates"
    description: "Submit a COI; supersedes the prior active COI and bumps application version (OCC-guarded)"
    roles: [ProductionCompany]
    code: 201
    input: [policy_number, coverage_amount_cents, "aviation_coverage?", effective_date, expiration_date, expected_application_version]
    output: InsuranceCertificate
    side_effects:
      - "prior SUBMITTED/VERIFIED COIs for the application -> SUPERSEDED"
      - "increments PermitApplication.version by 1"
  - method: GET
    path: "/applications/{id}/insurance-certificates"
    description: "List COIs for an application (reverse-reachability for InsuranceCertificate.application_id)"
    roles: [FilmOfficeCoordinator, ProductionCompany, DepartmentReviewer, FieldOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: InsuranceCertificate[]
    side_effects: []
  - method: POST
    path: "/insurance-certificates/{id}/verify"
    description: "Coordinator verifies or rejects a COI"
    roles: [FilmOfficeCoordinator]
    code: 200
    input: [decision]
    output: InsuranceCertificate
    side_effects: ["SUBMITTED->VERIFIED or SUBMITTED->REJECTED"]

  # ---- Rider ----
  - method: POST
    path: "/applications/{id}/riders"
    description: "Add a still-photo or drone rider to an in-review application"
    roles: [ProductionCompany]
    code: 201
    input: [rider_type, "faa_waiver_number?", "max_altitude_ft?", "flight_start_at?", "flight_end_at?"]
    output: Rider
    side_effects: ["increments PermitApplication.version by 1"]
  - method: GET
    path: "/applications/{id}/riders"
    description: "List riders for an application (reverse-reachability for Rider.application_id)"
    roles: [FilmOfficeCoordinator, ProductionCompany, DepartmentReviewer, FieldOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Rider[]
    side_effects: []
  - method: POST
    path: "/riders/{id}/decision"
    description: "Coordinator approves or denies a rider"
    roles: [FilmOfficeCoordinator]
    code: 200
    input: [decision]
    output: Rider
    side_effects: ["REQUESTED->APPROVED or REQUESTED->DENIED"]

  # ---- NeighborhoodNotification ----
  - method: POST
    path: "/applications/{id}/notifications"
    description: "Record a neighborhood notification (lead-time enforced)"
    roles: [FilmOfficeCoordinator]
    code: 201
    input: [geo_zone, notice_method]
    output: NeighborhoodNotification
    side_effects: ["sent_at = clock now; lead_days computed"]
  - method: GET
    path: "/applications/{id}/notifications"
    description: "List notifications for an application (reverse-reachability for NeighborhoodNotification.application_id)"
    roles: [FilmOfficeCoordinator, ProductionCompany, DepartmentReviewer, FieldOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: NeighborhoodNotification[]
    side_effects: []

  # ---- LedgerEntry (payments) ----
  - method: POST
    path: "/applications/{id}/payments"
    description: "Record a permit-fee or deposit payment"
    roles: [ProductionCompany]
    code: 201
    input: [entry_type, amount_cents]
    output: LedgerEntry
    side_effects:
      - "create LedgerEntry{direction=DEBIT}"
      - "PERMIT_FEE increments amount_paid_cents; DEPOSIT increments deposit_held_cents"
  - method: GET
    path: "/applications/{id}/payments"
    description: "List ledger entries for an application, including system REFUND credits (reverse-reachability for LedgerEntry.application_id)"
    roles: [FilmOfficeCoordinator, ProductionCompany, DepartmentReviewer, FieldOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  # ---- DepartmentReview ----
  - method: GET
    path: "/department-reviews/{id}"
    description: "Read a department review (single-resource read; source of department-reviews collection segment)"
    roles: [FilmOfficeCoordinator, ProductionCompany, DepartmentReviewer, FieldOfficer]
    code: 200
    input: []
    output: DepartmentReview
    side_effects: []
  - method: GET
    path: "/department-reviews"
    description: "List department reviews filterable by application_id and department_id (reverse-reachability for both FKs)"
    roles: [FilmOfficeCoordinator, ProductionCompany, DepartmentReviewer, FieldOfficer]
    code: 200
    input: ["application_id?", "department_id?", "status?", "limit?", "offset?"]
    output: DepartmentReview[]
    side_effects: []
  - method: POST
    path: "/department-reviews/{id}/decision"
    description: "Reviewer approves, rejects, or requests revision"
    roles: [DepartmentReviewer]
    code: 200
    input: [decision, "decision_notes?"]
    output: DepartmentReview
    side_effects: ["APPROVE/REJECT/REQUEST_REVISION; REJECT drives application to REVISION_REQUIRED (CASCADE A)"]

  # ---- RoadClosureBooking ----
  - method: POST
    path: "/road-closure-bookings"
    description: "Book a street closure on a segment for an application"
    roles: [ProductionCompany]
    code: 201
    input: [application_id, street_segment_id, closure_start_at, closure_end_at]
    output: RoadClosureBooking
    side_effects: ["status=PENDING; rejected only if the 60-min buffer-expanded window overlaps a CONFIRMED booking on the segment"]
  - method: GET
    path: "/road-closure-bookings/{id}"
    description: "Read a road closure booking (single-resource read; source of road-closure-bookings collection segment)"
    roles: [FilmOfficeCoordinator, ProductionCompany, DepartmentReviewer, FieldOfficer]
    code: 200
    input: []
    output: RoadClosureBooking
    side_effects: []
  - method: GET
    path: "/road-closure-bookings"
    description: "List road closure bookings filterable by application_id and street_segment_id (reverse-reachability for both FKs)"
    roles: [FilmOfficeCoordinator, ProductionCompany, DepartmentReviewer, FieldOfficer]
    code: 200
    input: ["application_id?", "street_segment_id?", "status?", "limit?", "offset?"]
    output: RoadClosureBooking[]
    side_effects: []

  # ---- OfficerAssignment ----
  - method: POST
    path: "/officer-assignments"
    description: "Assign an officer to an application shift"
    roles: [FilmOfficeCoordinator]
    code: 201
    input: [application_id, officer_id, shift_start_at, shift_end_at]
    output: OfficerAssignment
    side_effects: ["status=PROPOSED; overlap-checked (half-open, no buffer); billed_cost_cents computed"]
  - method: GET
    path: "/officer-assignments/{id}"
    description: "Read an officer assignment (single-resource read; source of officer-assignments collection segment)"
    roles: [FilmOfficeCoordinator, ProductionCompany, DepartmentReviewer, FieldOfficer]
    code: 200
    input: []
    output: OfficerAssignment
    side_effects: []
  - method: GET
    path: "/officer-assignments"
    description: "List officer assignments filterable by application_id and officer_id (reverse-reachability for both FKs)"
    roles: [FilmOfficeCoordinator, ProductionCompany, DepartmentReviewer, FieldOfficer]
    code: 200
    input: ["application_id?", "officer_id?", "status?", "limit?", "offset?"]
    output: OfficerAssignment[]
    side_effects: []
  - method: POST
    path: "/officer-assignments/{id}/cancel"
    description: "Cancel an officer assignment"
    roles: [FilmOfficeCoordinator]
    code: 200
    input: []
    output: OfficerAssignment
    side_effects: ["PROPOSED/CONFIRMED->CANCELLED"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock used for all deadline/lead-time/wrap comparisons. Server startup default is 2026-03-01T00:00:00Z; before any set, the clock reads exactly this default (never real wall-clock)."
    roles: [FilmOfficeCoordinator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advances to to_iso8601"]

# ===========================================================================
# §1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for endpoint, or reviewer acting on another department's review"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a path id or body FK references a non-existent resource"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body: missing required field, unknown enum value, or constraint-violating scalar"
  - id: ERR_INVALID_TIME_RANGE
    http: 422
    condition: "end timestamp not strictly after start timestamp"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "transition not defined from the resource's current state"
  - id: ERR_PAYMENT_NOT_ALLOWED
    http: 409
    condition: "payment entry_type not allowed for the application's current status"
  - id: ERR_NO_LOCATIONS
    http: 422
    condition: "submit attempted on an application with zero LocationDetail rows"
  - id: ERR_REVIEWS_INCOMPLETE
    http: 409
    condition: "issue attempted while application not UNDER_REVIEW or not all DepartmentReviews APPROVED"
  - id: ERR_DEPOSIT_UNPAID
    http: 402
    condition: "wrap-request attempted while deposit_held_cents < deposit_cents"
  - id: ERR_STALE_APPLICATION_VERSION
    http: 412
    condition: "expected_application_version does not match current PermitApplication.version (OCC)"
  - id: ERR_COI_NOT_VERIFIED
    http: 422
    condition: "issue attempted with no VERIFIED InsuranceCertificate on the application"
  - id: ERR_OFFICER_INACTIVE
    http: 409
    condition: "officer assignment references an Officer whose status is INACTIVE"
  - id: ERR_AVIATION_COVERAGE_MISSING
    http: 422
    condition: "DRONE rider added without a VERIFIED COI carrying aviation_coverage=true"
  - id: ERR_SEGMENT_DOUBLE_BOOKED
    http: 409
    condition: "road closure window (buffer-expanded 60 min) overlaps a CONFIRMED booking on the same segment"
  - id: ERR_OFFICER_DOUBLE_BOOKED
    http: 409
    condition: "officer assignment window overlaps another non-terminal assignment for the same officer (half-open, no buffer)"
  - id: ERR_FLIGHT_WINDOW_OUTSIDE_SHOOT
    http: 422
    condition: "DRONE rider flight window not contained within the application shoot window"
  - id: ERR_NOTICE_TOO_LATE
    http: 422
    condition: "notification lead_days < NOTIFICATION_MIN_LEAD_DAYS (7)"
  - id: ERR_FEE_UNPAID
    http: 402
    condition: "issue attempted while amount_paid_cents < estimated_fee_cents"

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: ProductionCompany
    description: "The applicant production company; owns its applications, locations, riders, COIs, bookings, payments, and wrap requests"
    identity: "entity_backed:ProductionCompany"
    exclusive_operations:
      - "POST /applications"
      - "POST /applications/{id}/location-details"
      - "POST /applications/{id}/submit"
      - "POST /applications/{id}/withdraw"
      - "POST /applications/{id}/wrap-request"
      - "POST /applications/{id}/insurance-certificates"
      - "POST /applications/{id}/riders"
      - "POST /applications/{id}/payments"
      - "POST /road-closure-bookings"
    shared_operations:
      - "GET reads shared with all authenticated roles"
  - name: DepartmentReviewer
    description: "Acts on behalf of one Department; decides that department's reviews"
    identity: "entity_backed:Department"
    exclusive_operations:
      - "POST /department-reviews/{id}/decision"
    shared_operations:
      - "GET reads shared with all authenticated roles"
  - name: FieldOfficer
    description: "On-site officer/monitor who closes the wrap"
    identity: "entity_backed:Officer"
    exclusive_operations:
      - "POST /applications/{id}/wrap-close"
    shared_operations:
      - "GET reads shared with all authenticated roles"
  - name: FilmOfficeCoordinator
    description: "Municipal film office operator; onboards companies/officers/departments/segments, issues permits, verifies COIs, decides riders, sends notifications, assigns officers, sets the clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /production-companies"
      - "POST /departments"
      - "POST /officers"
      - "PATCH /officers/{id}"
      - "POST /street-segments"
      - "POST /applications/{id}/issue"
      - "POST /insurance-certificates/{id}/verify"
      - "POST /riders/{id}/decision"
      - "POST /applications/{id}/notifications"
      - "POST /officer-assignments"
      - "POST /officer-assignments/{id}/cancel"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads shared with all authenticated roles"
