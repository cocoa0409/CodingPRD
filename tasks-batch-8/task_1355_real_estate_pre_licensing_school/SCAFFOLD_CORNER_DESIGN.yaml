            - { call: "POST /enrollments", payload: { offering_id: "${off}", student_id: "${sb}" }, as: Student, as_user_id: "${sa}", captures: { err1: $.data.error_id } }
            - { call: "GET /students/${sb}", as: Student, as_user_id: "${sa}", captures: { err2: $.data.error_id } }
            - { call: "GET /enrollments/${ea}", as: Student, as_user_id: "${sa}", captures: { got: $.data.id } }
          assert:
            - "self-enroll without student_id succeeds; student_id defaulted to caller ${sa}"
