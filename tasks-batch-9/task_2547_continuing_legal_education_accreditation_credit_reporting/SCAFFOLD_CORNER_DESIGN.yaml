      - name: waiving_an_assessment_is_reserved_to_the_board_while_paying_is_shared
        claim_type: role_cannot_perform_others_exclusive_operations
        grounds:
          - roles.BoardAdmin.shared_operations
          - roles.ProviderAdmin.shared_operations
          - validations[priority 20 -> ERR_ROLE_NOT_PERMITTED]
          - state_machines.FeeAssessment.ASSESSED_to_WAIVED
          - state_machines.FeeAssessment.ASSESSED_to_PAID
          - endpoints[POST /cle/fee-assessments/{id}/settlement]
        distinguishing_aspect: "One endpoint shared by three roles reserves exactly one of its two actions: WAIVE is refused to the attorney and to the paying provider — with ERR_ROLE_NOT_PERMITTED rather than the ownership error the attorney would also have earned, because priority 20 precedes priority 40 — while PAY on the same kind of assessment succeeds for the provider that owns it, and neither settlement touches any attorney's ledger because a PROVIDER_ANNUAL assessment carries a null attorney_id."
        test_recipe:
          setup:
            - "Two providers granted accreditation, each carrying one ASSESSED PROVIDER_ANNUAL assessment (80000 and the 120000 default), and one attorney with no assessments of its own."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Meridian CLE Institute", provider_type: "COMMERCIAL", annual_fee_cents: 80000 }
              as: BoardAdmin
              captures: { prov1: $.data.id, prov1_v1: $.data.version }
            - call: "POST /cle/providers/${prov1}/accreditation-actions"
              payload: { action: "GRANT_PROBATIONARY", expected_provider_version: "${prov1_v1}", probation_reason: "New commercial sponsor." }
              as: BoardAdmin
            - call: "POST /cle/providers"
              payload: { name: "Cornerstone Bar Institute", provider_type: "BAR_ASSOCIATION" }
              as: BoardAdmin
              captures: { prov2: $.data.id, prov2_v1: $.data.version }
            - call: "POST /cle/providers/${prov2}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov2_v1}" }
              as: BoardAdmin
            - call: "POST /cle/attorneys"
              payload: { bar_number: "FEE-5001", full_name: "Marta Oyelaran", admission_date: "2007-07-07T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
            - call: "GET /cle/fee-assessments?provider_id=${prov1}&fee_type=PROVIDER_ANNUAL"
              as: BoardAdmin
              captures: { fee1: "$.data[0].id" }
            - call: "GET /cle/fee-assessments?provider_id=${prov2}&fee_type=PROVIDER_ANNUAL"
              as: BoardAdmin
              captures: { fee2: "$.data[0].id" }
          trigger:
            - call: "POST /cle/fee-assessments/${fee1}/settlement"
              payload: { action: "WAIVE", waiver_reason: "Attorney attempting a waiver." }
              as: Attorney
              as_user_id: "${att_id}"
              expect_error: ERR_ROLE_NOT_PERMITTED
            - call: "POST /cle/fee-assessments/${fee1}/settlement"
              payload: { action: "WAIVE", waiver_reason: "Sponsor attempting to waive its own fee." }
              as: ProviderAdmin
              as_user_id: "${prov1}"
              expect_error: ERR_ROLE_NOT_PERMITTED
            - call: "POST /cle/fee-assessments/${fee1}/settlement"
              payload: { action: "WAIVE", waiver_reason: "Fee waived by board order for a first-term sponsor." }
              as: BoardAdmin
            - call: "POST /cle/fee-assessments/${fee2}/settlement"
              payload: { action: "PAY" }
              as: ProviderAdmin
              as_user_id: "${prov2}"
          assert:
            - "FeeAssessment ${fee1} was created by the GRANT_PROBATIONARY with amount_cents == 80000, and ${fee2} by the GRANT_FULL with amount_cents == 120000 (the DEFAULT_PROVIDER_ANNUAL_FEE_CENTS default), both status 'ASSESSED' with attorney_id null"
            - "Trigger call 1 returned HTTP 403 ERR_ROLE_NOT_PERMITTED — Attorney is a declared role of the endpoint, so the refusal is the reserved action, and it is the role error and not ERR_NOT_RESOURCE_OWNER because priority 20 precedes priority 40"
            - "Trigger call 2 returned HTTP 403 ERR_ROLE_NOT_PERMITTED even though the caller owns the assessment — owning a fee does not confer the power to forgive it"
            - "After both refusals FeeAssessment.${fee1}.status is still 'ASSESSED' with settled_at null and waiver_reason null"
            - "Trigger call 3 returned HTTP 200 with FeeAssessment.${fee1}.status == 'WAIVED', settled_at == '2026-08-01T00:00:00Z' and waiver_reason == 'Fee waived by board order for a first-term sponsor.'"
            - "Trigger call 4 returned HTTP 200 with FeeAssessment.${fee2}.status == 'PAID' and settled_at == '2026-08-01T00:00:00Z'"
            - "Attorney.${att_id}.outstanding_fee_cents == 0 — neither settlement decremented any attorney ledger, because both assessments carry a null attorney_id"
            - "GET /cle/fee-assessments?status=ASSESSED returns total_count 0"

  # ===========================================================================
  # The declared complexity_layers are optimistic_concurrency,
  # cascading_side_effects, dual_variant_calculation and ops_run_checkpoint.
  # The guide's layer table has no `ops_run_checkpoint` row, so the sweep — the
  # scaffold's only checkpoint runner — is covered under the table's
  # `scheduled_actions` row, and the ledger it maintains under
  # `derived_field_reconciliation`. Layers the scaffold does not declare
  # (soft_delete, idempotency, multi_tenancy, conditional_feature_flags) are
  # skipped.
  - section: cross_cutting_complexity_layers
    instances:

      - name: all_three_concurrency_rules_reject_a_stale_parent_version_and_accept_the_current_one
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[renew-supersede-stale-provider]
          - concurrency_rules[reciprocity-refile-stale-attorney]
          - concurrency_rules[sample-redraw-stale-audit]
          - errors[ERR_STALE_VERSION]
          - validations[priority 50 -> ERR_STALE_VERSION]
        distinguishing_aspect: "All three §1.2.1 rules are exercised on the same database with the same shape — replay the version the client first read, get 412; replay the current one, get the write — and each of the three repeatable operations (RENEW, re-filing a claim, redrawing a sample) is one that would have succeeded on its own terms, so the guard and not the transition is what refuses. A refused attempt consumes no version."
        test_recipe:
          setup:
            - "One ACCREDITED self-certifying provider at version 2 with its annual fee already PAID and one APPROVED course inside a SAMPLED audit's window; one attorney at version 3 after two standing changes; one audit at version 2 after a first draw."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Ironwood Bar Institute", provider_type: "BAR_ASSOCIATION" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
              captures: { prov_v2: $.data.version }
            - call: "GET /cle/fee-assessments?provider_id=${prov_id}&fee_type=PROVIDER_ANNUAL"
              as: BoardAdmin
              captures: { fee_1: "$.data[0].id" }
            - call: "POST /cle/fee-assessments/${fee_1}/settlement"
              payload: { action: "PAY" }
              as: BoardAdmin
            - call: "POST /cle/courses"
              payload: { title: "Ironwood Recorded Ethics Hour", delivery_format: "ON_DEMAND", total_minutes: 300, presented_at: "2026-03-01T09:00:00Z", attendance_verification_method: "CERTIFICATE", credit_allocations: [ { category: "GENERAL", minutes: 300 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { ac: $.data.id }
            - call: "POST /cle/attorneys"
              payload: { bar_number: "OCC-6001", full_name: "Hana Sørensen", admission_date: "2008-08-08T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id, att_v1: $.data.version }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/status-changes"
              payload: { status: "EXEMPT", reason: "Seconded to the legislature." }
              as: BoardAdmin
              captures: { att_v2: $.data.version }
            - call: "POST /cle/attorneys/${att_id}/status-changes"
              payload: { status: "ACTIVE", reason: "Returned to practice." }
              as: BoardAdmin
              captures: { att_v3: $.data.version }
            - call: "POST /cle/provider-audits"
              payload: { provider_id: "${prov_id}", audit_period_start: "2026-01-01T00:00:00Z", audit_period_end: "2026-06-30T00:00:00Z", trigger_type: "RISK_BASED" }
              as: BoardAdmin
              captures: { audit_id: $.data.id, a_v1: $.data.version }
            - call: "POST /cle/provider-audits/${audit_id}/audit-actions"
              payload: { action: "DRAW_SAMPLE", expected_audit_version: "${a_v1}" }
              as: BoardAdmin
              captures: { a_v2: $.data.version }
          trigger:
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "RENEW", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
              expect_error: ERR_STALE_VERSION
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "RENEW", expected_provider_version: "${prov_v2}" }
              as: BoardAdmin
              captures: { prov_v3: $.data.version }
            - call: "POST /cle/reciprocity-claims"
              payload: { attorney_id: "${att_id}", basis: "RECIPROCITY", origin_jurisdiction: "TX", origin_course_title: "Texas Advanced Evidence", origin_credit_hours: 2.0, origin_category: "GENERAL", completion_date: "2026-05-01T00:00:00Z", expected_attorney_version: "${att_v1}" }
              as: Attorney
              as_user_id: "${att_id}"
              expect_error: ERR_STALE_VERSION
            - call: "POST /cle/reciprocity-claims"
              payload: { attorney_id: "${att_id}", basis: "RECIPROCITY", origin_jurisdiction: "TX", origin_course_title: "Texas Advanced Evidence", origin_credit_hours: 2.0, origin_category: "GENERAL", completion_date: "2026-05-01T00:00:00Z", expected_attorney_version: "${att_v3}" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /cle/provider-audits/${audit_id}/audit-actions"
              payload: { action: "DRAW_SAMPLE", expected_audit_version: "${a_v1}" }
              as: BoardAdmin
              expect_error: ERR_STALE_VERSION
            - call: "POST /cle/provider-audits/${audit_id}/audit-actions"
              payload: { action: "DRAW_SAMPLE", expected_audit_version: "${a_v2}" }
              as: BoardAdmin
              captures: { a_v3: $.data.version }
          assert:
            - "Trigger calls 1, 3 and 5 each returned HTTP 412 ERR_STALE_VERSION"
            - "${prov_v1} == 1, ${prov_v2} == 2 and ${prov_v3} == 3 — every accepted write on the provider incremented version by exactly 1 and the refused RENEW incremented nothing"
            - "${att_v1} == 1, ${att_v2} == 2 and ${att_v3} == 3 — the two standing changes are what made the client's first-read version stale"
            - "${a_v1} == 1, ${a_v2} == 2 and ${a_v3} == 3 — the redraw is a legal SAMPLED -> SAMPLED self-transition, so only the version it carried decided the outcome"
            - "Trigger call 2 returned HTTP 200 with Provider.${prov_id}.accreditation_status == 'ACCREDITED', accreditation_term_start == '2026-08-01T00:00:00Z' and accreditation_term_end == '2028-08-01T00:00:00Z'"
            - "GET /cle/fee-assessments?provider_id=${prov_id}&fee_type=PROVIDER_ANNUAL returns two rows: ${fee_1} is 'PAID' and the renewal's new assessment is 'ASSESSED' with amount_cents 120000 — the RENEW precondition held because the prior-term fee had been settled"
            - "Trigger call 4 returned HTTP 201 with ReciprocityClaim.${claim_id}.status == 'SUBMITTED' and converted_minutes == 0, and GET /cle/attorneys/${att_id}/reciprocity-claims returns exactly one row — the refused filing left no claim behind"
            - "Trigger call 6 returned HTTP 200 with ProviderAudit.${audit_id}.status == 'SAMPLED', sample_size == 1 and sampled_course_ids == ['${ac}'] — the redraw reproduced the same pool-limited draw"

      - name: suspending_and_reinstating_a_provider_walks_the_course_cascade_out_and_back
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Provider.ACCREDITED_to_SUSPENDED
          - state_machines.Provider.SUSPENDED_to_PROBATIONARY
          - state_machines.Course.APPROVED_to_SUSPENDED_PENDING_REVIEW
          - endpoints[POST /cle/providers/{id}/accreditation-actions]
        distinguishing_aspect: "The cascade is selective in both directions and the compensation is not a state restore: only the self-certified APPROVED course with a live expiry is swept out and back, the course registered before the grant stays PENDING_APPROVAL throughout, and because REINSTATE lands on PROBATIONARY rather than ACCREDITED the self-certification flag stays off — so the next course registered by the same sponsor takes INDIVIDUAL_APPROVAL. The ASSESSED annual fee does not block REINSTATE; only an AUDIT_SANCTION fee would."
        test_recipe:
          setup:
            - "One provider registered a course while still APPLIED, then took a full grant and registered a second course, which self-certified to APPROVED."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Beacon Hill CLE Group", provider_type: "LAW_SCHOOL" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/courses"
              payload: { title: "Pre-Grant Recorded Seminar", delivery_format: "ON_DEMAND", total_minutes: 120, presented_at: "2026-07-01T09:00:00Z", attendance_verification_method: "CERTIFICATE", credit_allocations: [ { category: "GENERAL", minutes: 120 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { c_pre: $.data.id }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
              captures: { prov_v2: $.data.version }
            - call: "POST /cle/courses"
              payload: { title: "Post-Grant Recorded Seminar", delivery_format: "ON_DEMAND", total_minutes: 300, presented_at: "2026-07-15T09:00:00Z", attendance_verification_method: "CERTIFICATE", credit_allocations: [ { category: "GENERAL", minutes: 300 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { c_post: $.data.id }
          trigger:
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "SUSPEND", expected_provider_version: "${prov_v2}" }
              as: BoardAdmin
              captures: { prov_v3: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "REINSTATE", expected_provider_version: "${prov_v3}" }
              as: BoardAdmin
              captures: { prov_v4: $.data.version }
            - call: "POST /cle/courses"
              payload: { title: "Post-Reinstatement Recorded Seminar", delivery_format: "ON_DEMAND", total_minutes: 60, presented_at: "2026-07-20T09:00:00Z", attendance_verification_method: "CERTIFICATE", credit_allocations: [ { category: "GENERAL", minutes: 60 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { c_after: $.data.id }
          assert:
            - "Before the triggers Course.${c_pre}.status == 'PENDING_APPROVAL' with approval_pathway 'INDIVIDUAL_APPROVAL' and Course.${c_post}.status == 'APPROVED' with approval_pathway 'PROVIDER_ACCREDITED'"
            - "Trigger call 1 returned HTTP 200: Provider.${prov_id}.accreditation_status == 'SUSPENDED', self_certification_enabled == false, risk_score_variant == 'REVIEWED_WEIGHTING' and version ${prov_v3} == 3"
            - "After trigger call 1 Course.${c_post}.status == 'SUSPENDED_PENDING_REVIEW' and Course.${c_pre}.status is still 'PENDING_APPROVAL' — the cascade selects only APPROVED PROVIDER_ACCREDITED courses whose expires_at is still ahead of the clock"
            - "Trigger call 2 returned HTTP 200: Provider.${prov_id}.accreditation_status == 'PROBATIONARY' and version ${prov_v4} == 4 — the ASSESSED PROVIDER_ANNUAL assessment from the grant did not block REINSTATE, whose only fiscal precondition names AUDIT_SANCTION"
            - "After trigger call 2 Course.${c_post}.status == 'APPROVED' again and Course.${c_pre}.status is still 'PENDING_APPROVAL' — the compensation cascade restores exactly what the suspension took"
            - "Provider.${prov_id}.self_certification_enabled == false after the round trip — REINSTATE lands on PROBATIONARY, which never re-enables self-certification"
            - "Trigger call 3 returned HTTP 201 with Course.${c_after}.status == 'PENDING_APPROVAL' and approval_pathway 'INDIVIDUAL_APPROVAL' — observable proof that the flag stayed off"
            - "Provider.${prov_id}.courses_total_count == 3 and courses_self_certified_count == 1 — only ${c_post} was ever registered while the flag was on"

      - name: the_sweep_expires_courses_and_lapses_providers_only_when_the_clock_reaches_the_instant
        claim_type: scheduled_actions
        grounds:
          - endpoints[POST /cle/reporting-sweeps]
          - state_machines.Course.APPROVED_to_EXPIRED
          - state_machines.Provider.ACCREDITED_to_LAPSED
          - entities.ReportingSweep
          - domain_constants.ACCREDITATION_TERM_MONTHS
        distinguishing_aspect: "Four sweeps at three clock positions separate the two scheduled effects the checkpoint owns: the first fires nothing, the second expires exactly the live course whose expires_at (presented_at + total_minutes) the clock has just reached, the third lapses the provider at the exact instant of accreditation_term_end and sweeps its still-live recorded course into review, and the fourth repeats the third clock position to prove the run is idempotent. sweep_number counts every run, including the ones that changed nothing."
        test_recipe:
          setup:
            - "One ACCREDITED self-certifying provider whose term ends 2028-08-01, with one APPROVED live course expiring 2026-09-10T11:00:00Z and one APPROVED recorded course expiring 2029-09-01T09:00:00Z, and one sweep already run at the default clock."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Coastline Government Law Office CLE", provider_type: "GOVERNMENT" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
              captures: { prov_v2: $.data.version }
            - call: "POST /cle/courses"
              payload: { title: "Coastline Live Webcast Hour", delivery_format: "LIVE_WEBCAST", total_minutes: 120, presented_at: "2026-09-10T09:00:00Z", attendance_verification_method: "CERTIFICATE", credit_allocations: [ { category: "GENERAL", minutes: 120 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { c_live: $.data.id }
            - call: "POST /cle/courses"
              payload: { title: "Coastline Recorded Library Module", delivery_format: "ON_DEMAND", total_minutes: 300, presented_at: "2026-09-01T09:00:00Z", attendance_verification_method: "CERTIFICATE", credit_allocations: [ { category: "GENERAL", minutes: 300 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { c_od: $.data.id }
            - call: "POST /cle/reporting-sweeps"
              payload: {}
              as: BoardAdmin
              captures: { sweep_1: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T11:00:00Z" }
              as: BoardAdmin
            - call: "POST /cle/reporting-sweeps"
              payload: {}
              as: BoardAdmin
              captures: { sweep_2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-08-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /cle/reporting-sweeps"
              payload: {}
              as: BoardAdmin
              captures: { sweep_3: $.data.id }
            - call: "POST /cle/reporting-sweeps"
              payload: {}
              as: BoardAdmin
              captures: { sweep_4: $.data.id }
          assert:
            - "Course.${c_live}.expires_at == '2026-09-10T11:00:00Z' (presented_at + 120 minutes) and Course.${c_od}.expires_at == '2029-09-01T09:00:00Z' (presented_at + 36 months); both were APPROVED on registration because the sponsor self-certifies"
            - "ReportingSweep.${sweep_1}.sweep_number == 1 with as_of '2026-08-01T00:00:00Z', courses_expired == 0, providers_lapsed == 0 and cycles_examined == 0"
            - "ReportingSweep.${sweep_2}.sweep_number == 2 with as_of '2026-09-10T11:00:00Z', courses_expired == 1 and providers_lapsed == 0 — the comparison is at-or-past, so reaching expires_at exactly is enough"
            - "After ${sweep_2} Course.${c_live}.status == 'EXPIRED' and Course.${c_od}.status == 'APPROVED', and Provider.${prov_id}.accreditation_status is still 'ACCREDITED' at version ${prov_v2}"
            - "ReportingSweep.${sweep_3}.sweep_number == 3 with as_of '2028-08-01T00:00:00Z', providers_lapsed == 1 and courses_expired == 0 — the recorded course does not expire until 2029, so the lapse is the only effect"
            - "After ${sweep_3} Provider.${prov_id}.accreditation_status == 'LAPSED' with self_certification_enabled == false and version 3, Course.${c_od}.status == 'SUSPENDED_PENDING_REVIEW' and Course.${c_live}.status is still 'EXPIRED' — the lapse cascade selects APPROVED courses only, so the already-expired one is left alone"
            - "ReportingSweep.${sweep_4}.sweep_number == 4 with the same as_of '2028-08-01T00:00:00Z' and every counter 0 — a LAPSED provider is not lapsed twice and a SUSPENDED_PENDING_REVIEW course is not expired"
            - "Provider.${prov_id}.version is still 3 after ${sweep_4} — the idempotent run wrote nothing at all"

      - name: the_two_variants_of_the_credit_application_produce_different_totals_on_one_cycle
        claim_type: dual_variant_calculation
        grounds:
          - calculations.cycle_credit_application
        excluded_because:
          difficulty_instance: provisional_versus_final_cycle_credit_application_on_compliance_cycle
          rationale: "That §1.8 instance is the dual-variant claim in full: the same stored records under both variants, the delta on switching, and the certification that freezes the FINAL numbers."

      - name: the_two_risk_weightings_score_the_same_provider_differently
        claim_type: dual_variant_calculation
        grounds:
          - calculations.provider_risk_score
        excluded_because:
          difficulty_instance: self_certified_versus_reviewed_provider_risk_weighting
          rationale: "The SELF_CERTIFIED_WEIGHTING and REVIEWED_WEIGHTING branches, and the re-score that follows a flag flip, are asserted there."

      - name: the_attorney_fee_ledger_stays_equal_to_the_sum_of_its_open_assessments
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Attorney.fields.outstanding_fee_cents
        excluded_because:
          difficulty_instance: outstanding_fee_cents_always_equals_the_sum_of_assessed_assessments
          rationale: "That §1.8 instance reconciles the derived ledger after an assessment is created, settled, waived and voided, which is the whole of this layer's create/update/delete claim."

      - name: an_audit_sanction_cascades_through_courses_into_their_pending_credit_records
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ProviderAudit.FINDINGS_ISSUED_to_SANCTIONED
        excluded_because:
          difficulty_instance: audit_suspension_sanction_rejects_only_the_pending_credit_records_of_suspended_courses
          rationale: "The three-level audit -> provider -> course -> credit-record chain, including which records are left alone, is that instance's entire subject."

      - name: the_sweeps_deadline_comparisons_are_inclusive_at_both_thresholds
        claim_type: scheduled_actions
        grounds:
          - calculations.late_fee_assessment
          - domain_constants.DELINQUENCY_TO_SUSPENSION_DAYS
        excluded_because:
          difficulty_instance: sweep_deadline_and_suspension_day_boundaries_are_both_inclusive
          rationale: "The filing-deadline and delinquent_since + 60-day boundaries, one day either side of each, are asserted there."

  # ===========================================================================
  # complexity_profile.consistency_model is `immediate`, so the guide's
  # `eventual` and `saga` rows do not apply and are skipped.
  - section: consistency_model
    instances:

      - name: a_credit_filings_cascade_is_visible_to_every_read_that_follows_it
        claim_type: immediate
        grounds:
          - response_envelope
          - endpoints[POST /cle/credit-records]
          - endpoints[GET /cle/compliance-cycles/{id}/summary]
          - endpoints[GET /cle/credit-records]
          - calculations.cycle_credit_application
        distinguishing_aspect: "One write's whole cascade — record verification, the cycle's earned_* rewrite, the record's countable_minutes and the course's verified counter — is already observable to the very next request, with no intervening sweep, affirmation or reconciliation call: three different read endpoints agree on the same figures immediately after the 201."
        test_recipe:
          setup:
            - "One ACCREDITED self-certifying provider with one APPROVED 300-minute live-webcast course verified by attendance code, and one ACTIVE attorney with an OPEN 2026-01-01 -> 2028-01-01 GROUP_1 cycle and no records."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Summit Bar Association Education", provider_type: "BAR_ASSOCIATION" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
            - call: "POST /cle/courses"
              payload: { title: "Summit Live Evidence Webcast", delivery_format: "LIVE_WEBCAST", total_minutes: 300, presented_at: "2026-06-15T09:00:00Z", attendance_verification_method: "ATTENDANCE_CODE", credit_allocations: [ { category: "GENERAL", minutes: 300 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { course_id: $.data.id, code: $.data.attendance_code }
            - call: "POST /cle/attorneys"
              payload: { bar_number: "CONS-7001", full_name: "Nadia Petrov", admission_date: "2001-01-01T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "${course_id}", verification_method: "ATTENDANCE_CODE", attended_minutes: 300, completion_date: "2026-06-15T14:00:00Z", attendance_code: "${code}" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { rec_id: $.data.id }
            - call: "GET /cle/compliance-cycles/${cyc_id}/summary"
              as: Attorney
              as_user_id: "${att_id}"
            - call: "GET /cle/credit-records?cycle_id=${cyc_id}"
              as: BoardAdmin
            - call: "GET /cle/courses/${course_id}"
              as: ProviderAdmin
              as_user_id: "${prov_id}"
          assert:
            - "Trigger call 1 returned HTTP 201 with CreditRecord.${rec_id}.status == 'VERIFIED' in the creation response itself — the matching attendance code verifies inside the same request"
            - "CreditRecord.${rec_id}.credited_general_minutes == 300, effective_format == 'LIVE' (LIVE_WEBCAST verified by attendance code), source == 'IN_STATE' and countable_minutes == 300"
            - "Trigger call 2 returned HTTP 200 with required_total_minutes 1800, required_ethics_minutes 180, required_technology_minutes 60, required_bias_minutes 120"
            - "The same summary read reports provisional_total_minutes == 300 and projected_final_total_minutes == 300 with provisional_live_minutes == 300 and projected_final_live_minutes == 300 — a VERIFIED record counts identically under both variants"
            - "provisional_deficiency_total_minutes == 1500, projected_final_deficiency_total_minutes == 1500, projected_final_deficiency_ethics_minutes == 180, projected_final_deficiency_technology_minutes == 60, projected_final_deficiency_bias_minutes == 120"
            - "self_study_used_minutes == 0, on_demand_used_minutes == 0, nonlive_used_minutes == 0, reciprocity_used_minutes == 0, records_counted == 1 and records_excluded == 0"
            - "projected_late_fee_cents == 100000 — deficiencies 1500 + 180 + 60 + 120 = 1860 minutes, 31 hours, 60000 for the 16_plus tier plus 2500 * 20 = 50000, trimmed to LATE_FEE_CAP_CENTS"
            - "Trigger call 3 returned HTTP 200 with total_count == 1, has_more == false and the single row carrying status 'VERIFIED' and countable_minutes 300"
            - "Trigger call 4 returned HTTP 200 with Course.${course_id}.verified_credit_record_count == 1 — the course-side counter moved inside the write, not on a later run"
            - "ComplianceCycle.${cyc_id}.earned_countable_minutes == 300 and earned_general_minutes == 300 with credit_status still 'OPEN' — the cycle was rewritten by the POST itself"
            - "Every one of the three reads carries the same success envelope shape (success true, error null, meta present) and none of them changed a stored value"

      - name: a_certification_propagates_its_carryover_to_the_successor_cycle_at_once
        claim_type: immediate
        grounds:
          - calculations.carryover_determination
          - endpoints[POST /cle/compliance-cycles/{id}/certification]
        excluded_because:
          difficulty_instance: carryover_out_and_successor_carryover_in_stay_equal_through_two_compensating_voids
          rationale: "That §1.8 instance asserts the successor's carryover_in_* immediately after each certification and re-certification, which is this row's whole claim."
