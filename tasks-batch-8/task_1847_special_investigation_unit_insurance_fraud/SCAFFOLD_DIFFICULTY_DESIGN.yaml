  # =========================================================================
  # Rule 4 — transitive_cascade (≥2 instances, different triggers)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: substantiated_close_cascade_depth3
        grounds:
          - state_machines.SIUCase.transitions.DECISION_PENDING_to_CLOSED_SUBSTANTIATED
          - state_machines.Claim.transitions
          - state_machines.FraudBureauReferral.transitions
        distinguishing_aspect: |
          Depth-3 cascade from POST /cases/{id}/close: (1) SIUCase → CLOSED_SUBSTANTIATED,
          which (2) transitions Claim to DENIED (payment_hold_reason=FRAUD_CONFIRMED),
          which (3) triggers auto-creation of RestitutionLedger (status=OPEN)
          AND auto-creation of FraudBureauReferral (DRAFT with computed deadline_at).
          Each link is caused by the previous link, not the original close call.
        test_recipe:
          setup:
            - "Case K in DECISION_PENDING with substantiated_fraud_cents=600000 (>= BUREAU_REFERRAL_MIN_CENTS 500000)"
            - "Claim state CA"
          setup_api_calls:
            - call: "POST /siu/adjusters"
              payload: { full_name: "A", email: "a@x.com", state_licenses: ["CA"] }
              as: SIUManager
              captures: { adj: $.data.id }
            - call: "POST /siu/investigators"
              payload: { full_name: "I", email: "i@x.com", badge_number: "BI", state_certifications: ["CA"], max_active_cases: 5 }
              as: SIUManager
              captures: { inv: $.data.id }
            - call: "POST /siu/claims"
              payload: { policy_number: "P", state_code: "CA", adjuster_id: "${adj}", claimed_amount_cents: 100000000 }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { c: $.data.id }
            - call: "POST /siu/referrals"
              payload: { claim_id: "${c}", submitted_by_role: "ADJUSTER", red_flag_codes: ["PRIOR_FRAUD_CONVICTION"], narrative: "x" }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { r: $.data.id }
            - call: "POST /siu/referrals/${r}/triage"
              payload: {}
              as: SIUManager
            - call: "POST /siu/referrals/${r}/accept"
              payload: {}
              as: SIUManager
              captures: { k: $.data.id }
            - call: "POST /siu/cases/${k}/open"
              payload: {}
              as: SIUManager
              captures: { k_v: $.data.version }
            - call: "POST /siu/cases/${k}/assignments"
              payload: { investigator_id: "${inv}", expected_case_version: "${k_v}" }
              as: SIUManager
              captures: { k_v2: $.data.version }
            - call: "POST /siu/cases/${k}/evidence"
              payload: { evidence_type: "RECORDS", collected_at: "2026-08-10T00:00:00Z", custodian: "I", materiality: "SUBSTANTIVE", fraud_amount_cents: 600000 }
              as: SIUInvestigator
              as_user_id: "${inv}"
              captures: { e: $.data.id }
            - call: "POST /siu/cases/${k}/evidence/${e}/submit-review"
              payload: {}
              as: SIUInvestigator
              as_user_id: "${inv}"
            - call: "POST /siu/cases/${k}/evidence/${e}/admit"
              payload: { expected_case_version: "${k_v2}" }
              as: SIUManager
            - call: "POST /siu/cases/${k}/submit-for-decision"
              payload: {}
              as: SIUInvestigator
              as_user_id: "${inv}"
          trigger:
            - call: "POST /siu/cases/${k}/close"
              payload: { closed_reason: "SUBSTANTIATED" }
              as: SIUManager
            - call: "GET /siu/claims/${c}"
              payload: {}
              as: SIUManager
              captures: { claim_status: $.data.status, claim_hold: $.data.payment_hold_reason }
            - call: "GET /siu/cases/${k}/restitution-ledgers"
              payload: {}
              as: SIUManager
              captures: { ledger0_target: "$.data[0].target_amount_cents", ledger0_status: "$.data[0].status" }
            - call: "GET /siu/cases/${k}/bureau-referrals"
              payload: {}
              as: SIUManager
              captures: { bureau0_status: "$.data[0].status", bureau0_state: "$.data[0].state_code" }
          assert:
            - "Claim.${c}.status == DENIED (hop 2)"
            - "Claim.${c}.payment_hold_reason == FRAUD_CONFIRMED"
            - "RestitutionLedger auto-created with target_amount_cents == 600000 (hop 3a)"
            - "RestitutionLedger.status == OPEN"
            - "FraudBureauReferral auto-created with status == DRAFT (hop 3b)"
            - "FraudBureauReferral.state_code == CA (CA in MANDATORY_REFERRAL_STATES)"

      - name: euo_second_noshow_cascade_depth2
        grounds:
