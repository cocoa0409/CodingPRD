# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1975: Fireworks Display Permitting & Show Operations
# Sections follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: operator_create_defaults
        claim_type: creation
        grounds: [entities.Operator]
        distinguishing_aspect: "A newly registered Operator starts ACTIVE with version 1 and a server-minted UUID id; suspended_reason is null."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /pyro/operators", payload: { legal_name: "Pyro Co", atf_license_number: "ATF-001", license_class: "DISPLAY_1_3G", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z" }, as: SystemAdmin, captures: { op: $.data.id, st: $.data.status, v: $.data.version } }
          trigger: []
          assert:
            - "create returns 201; status == ACTIVE; version == 1; suspended_reason == null"
            - "id is a UUID (no type prefix)"

      - name: display_create_initial_state
        claim_type: creation
        grounds: [entities.DisplayEvent, state_machines.DisplayEvent]
        distinguishing_aspect: "New DisplayEvent starts DRAFT with weather_decision PENDING and zeroed counters."
        test_recipe:
          setup: ["operator exists"]
          setup_api_calls:
            - { call: "POST /pyro/operators", payload: { legal_name: "Pyro Co", atf_license_number: "ATF-001", license_class: "DISPLAY_1_3G", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z" }, as: SystemAdmin, captures: { op: $.data.id } }
          trigger:
            - { call: "POST /pyro/displays", payload: { venue_id: "VEN-1", venue_name: "Fairgrounds", scheduled_start_at: "2026-09-01T20:00:00Z", scheduled_end_at: "2026-09-01T23:00:00Z", declared_max_shell_diameter_in: 4 }, as: Operator, as_user_id: "${op}", captures: { ev: $.data.id, st: $.data.status, wd: $.data.weather_decision, dc: $.data.dud_count, fc: $.data.fired_count } }
          assert:
            - "status == DRAFT; weather_decision == PENDING; dud_count == 0; fired_count == 0; version == 1"

      - name: crew_list_pagination
        claim_type: listing
        grounds: [entities.CrewMember, response_envelope]
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count and has_more."
        test_recipe:
          setup: ["operator with 3 crew members"]
          setup_api_calls:
            - { call: "POST /pyro/operators", payload: { legal_name: "Pyro Co", atf_license_number: "ATF-001", license_class: "DISPLAY_1_3G", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z" }, as: SystemAdmin, captures: { op: $.data.id } }
            - { call: "POST /pyro/operators/${op}/crew-members", payload: { full_name: "A", cert_level: "TRAINEE", cert_expires_at: "2027-06-01T00:00:00Z" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/operators/${op}/crew-members", payload: { full_name: "B", cert_level: "SHOOTER", cert_expires_at: "2027-06-01T00:00:00Z" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/operators/${op}/crew-members", payload: { full_name: "C", cert_level: "LEAD_OPERATOR", cert_expires_at: "2027-06-01T00:00:00Z" }, as: Operator, as_user_id: "${op}" }
          trigger:
            - { call: "GET /pyro/operators/${op}/crew-members?limit=2&offset=0", payload: {}, as: Operator, as_user_id: "${op}", captures: { n: $.total_count, more: $.has_more } }
            - { call: "GET /pyro/operators/${op}/crew-members?limit=2&offset=2", payload: {}, as: Operator, as_user_id: "${op}" }
          assert:
            - "page 1: total_count == 3, has_more == true, 2 items"
            - "page 2: has_more == false, 1 item"

      - name: get_display_not_found_returns_404
        claim_type: not_found
        grounds: [entities.DisplayEvent, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a random UUID returns the 404 error envelope."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /pyro/displays/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: SystemAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND; http status == 404; response_type == error"

      - name: create_display_missing_required_returns_validation
        claim_type: required_fields
        grounds: [entities.DisplayEvent, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required venue_id -> ERR_VALIDATION 400."
        test_recipe:
          setup: ["operator exists"]
          setup_api_calls:
            - { call: "POST /pyro/operators", payload: { legal_name: "Pyro Co", atf_license_number: "ATF-001", license_class: "DISPLAY_1_3G", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z" }, as: SystemAdmin, captures: { op: $.data.id } }
          trigger:
            - { call: "POST /pyro/displays", payload: { venue_name: "Fairgrounds", scheduled_start_at: "2026-09-01T20:00:00Z", scheduled_end_at: "2026-09-01T23:00:00Z", declared_max_shell_diameter_in: 4 }, as: Operator, as_user_id: "${op}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION; http 400"

      - name: invalid_enum_rejected_returns_validation
        claim_type: type_constraints
        grounds: [entities.Operator.fields.license_class, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "license_class outside the declared enum -> ERR_VALIDATION."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /pyro/operators", payload: { legal_name: "Pyro Co", atf_license_number: "ATF-001", license_class: "CLASS_X", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z" }, as: SystemAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION; http 400"

      - name: magazine_posture_derived_lapsed
        claim_type: computed_fields
        grounds: [entities.Magazine.fields.posture]
        distinguishing_aspect: "posture is derived from inspection_due_at vs the logical clock: ACTIVE at exactly inspection_due_at, LAPSED one second after."
        test_recipe:
          setup: ["operator; magazine with inspection_due_at 2026-09-01T00:00:00Z; default clock 2026-08-01 keeps it ACTIVE"]
          setup_api_calls:
            - { call: "POST /pyro/operators", payload: { legal_name: "Pyro Co", atf_license_number: "ATF-001", license_class: "DISPLAY_1_3G", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z" }, as: SystemAdmin, captures: { op: $.data.id } }
            - { call: "POST /pyro/magazines", payload: { name: "MAG-1", atf_magazine_permit: "P-1", magazine_type: "INDOOR", capacity_new_lbs: 50.00, inspection_due_at: "2026-09-01T00:00:00Z" }, as: Operator, as_user_id: "${op}", captures: { mag: $.data.id } }
          trigger:
            - { call: "POST /pyro/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "GET /pyro/magazines/${mag}", payload: {}, as: Operator, as_user_id: "${op}", captures: { p1: $.data.posture } }
            - { call: "POST /pyro/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:01Z" }, as: SystemAdmin }
            - { call: "GET /pyro/magazines/${mag}", payload: {}, as: Operator, as_user_id: "${op}", captures: { p2: $.data.posture } }
          assert:
            - "at exactly inspection_due_at: posture == ACTIVE (boundary inclusive)"
            - "one second after: posture == LAPSED"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: cancel_cancelled_event_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.DisplayEvent, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal; a second cancel is rejected and fires no side effects."
        test_recipe:
          setup: ["event DRAFT (no plan needed for cancel)"]
          setup_api_calls:
            - { call: "POST /pyro/operators", payload: { legal_name: "Pyro Co", atf_license_number: "ATF-001", license_class: "DISPLAY_1_3G", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z" }, as: SystemAdmin, captures: { op: $.data.id } }
            - { call: "POST /pyro/displays", payload: { venue_id: "VEN-1", venue_name: "Fairgrounds", scheduled_start_at: "2026-09-01T20:00:00Z", scheduled_end_at: "2026-09-01T23:00:00Z", declared_max_shell_diameter_in: 4 }, as: Operator, as_user_id: "${op}", captures: { ev: $.data.id } }
            - { call: "POST /pyro/displays/${ev}/cancel", payload: { reason: "off" }, as: Operator, as_user_id: "${op}" }
          trigger:
            - { call: "POST /pyro/displays/${ev}/cancel", payload: { reason: "again" }, as: Operator, as_user_id: "${op}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE; http 409; event remains CANCELLED"

      - name: approve_after_deny_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: [state_machines.PermitApplication, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DENIED is terminal for the application and the event; approve afterwards is rejected."
        test_recipe:
          setup: ["application SUBMITTED then denied"]
          setup_api_calls:
            - { call: "POST /pyro/operators", payload: { legal_name: "Pyro Co", atf_license_number: "ATF-001", license_class: "DISPLAY_1_3G", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z" }, as: SystemAdmin, captures: { op: $.data.id } }
            - { call: "POST /pyro/displays", payload: { venue_id: "VEN-1", venue_name: "Fairgrounds", scheduled_start_at: "2026-09-01T20:00:00Z", scheduled_end_at: "2026-09-01T23:00:00Z", declared_max_shell_diameter_in: 4 }, as: Operator, as_user_id: "${op}", captures: { ev: $.data.id, ev_v: $.data.version } }
            - { call: "POST /pyro/displays/${ev}/site-plans", payload: { diagram_ref: "D1", launch_area_width_ft: 200, launch_area_length_ft: 200, spectator_boundary_ft: 300, spectator_arc_center_deg: 0, nearest_structure_ft: 500, expected_display_event_version: "${ev_v}" }, as: Operator, as_user_id: "${op}", captures: { sp: $.data.id } }
            - { call: "POST /pyro/displays/${ev}/permit-applications", payload: { site_plan_id: "${sp}", standby_engines: 1 }, as: Operator, as_user_id: "${op}", captures: { app: $.data.id } }
            - { call: "POST /pyro/permit-applications/${app}/deny", payload: { decision_note: "site too tight" }, as: FireMarshal, as_user_id: "fm_1" }
          trigger:
            - { call: "POST /pyro/permit-applications/${app}/approve", payload: { decision_note: "changed my mind" }, as: FireMarshal, as_user_id: "fm_1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE; event stays DENIED"

      - name: ready_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.DisplayEvent, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "/ready from DRAFT is not a listed transition -> ERR_INVALID_STATE (before any readiness gate is evaluated)."
        test_recipe:
          setup: ["event DRAFT"]
          setup_api_calls:
            - { call: "POST /pyro/operators", payload: { legal_name: "Pyro Co", atf_license_number: "ATF-001", license_class: "DISPLAY_1_3G", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z" }, as: SystemAdmin, captures: { op: $.data.id } }
            - { call: "POST /pyro/displays", payload: { venue_id: "VEN-1", venue_name: "Fairgrounds", scheduled_start_at: "2026-09-01T20:00:00Z", scheduled_end_at: "2026-09-01T23:00:00Z", declared_max_shell_diameter_in: 4 }, as: Operator, as_user_id: "${op}", captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /pyro/displays/${ev}/ready", payload: {}, as: Operator, as_user_id: "${op}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE; http 409"

      - name: misfire_dispose_before_show_complete_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.MisfireRecord, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Disposal while the event is still IN_PROGRESS is a state violation even when the soak window has elapsed."
        test_recipe:
          setup: ["event IN_PROGRESS with 1 misfire logged at 20:00; clock advanced 20 minutes (soak elapsed)"]
          setup_api_calls:
            - { call: "POST /pyro/operators", payload: { legal_name: "Pyro Co", atf_license_number: "ATF-001", license_class: "DISPLAY_1_3G", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z" }, as: SystemAdmin, captures: { op: $.data.id } }
            - { call: "POST /pyro/displays", payload: { venue_id: "VEN-1", venue_name: "Fairgrounds", scheduled_start_at: "2026-09-01T20:00:00Z", scheduled_end_at: "2026-09-01T23:00:00Z", declared_max_shell_diameter_in: 4 }, as: Operator, as_user_id: "${op}", captures: { ev: $.data.id, ev_v: $.data.version } }
            - { call: "POST /pyro/displays/${ev}/site-plans", payload: { diagram_ref: "D1", launch_area_width_ft: 200, launch_area_length_ft: 200, spectator_boundary_ft: 300, spectator_arc_center_deg: 0, nearest_structure_ft: 500, expected_display_event_version: "${ev_v}" }, as: Operator, as_user_id: "${op}", captures: { sp: $.data.id } }
            - { call: "POST /pyro/displays/${ev}/permit-applications", payload: { site_plan_id: "${sp}", standby_engines: 1 }, as: Operator, as_user_id: "${op}", captures: { app: $.data.id } }
            - { call: "POST /pyro/permit-applications/${app}/approve", payload: { decision_note: "ok" }, as: FireMarshal, as_user_id: "fm_1" }
            - { call: "POST /pyro/displays/${ev}/standby-confirm", payload: { standby_engines_on_site: 1 }, as: FireMarshal, as_user_id: "fm_2" }
            - { call: "POST /pyro/magazines", payload: { name: "MAG-1", atf_magazine_permit: "P-1", magazine_type: "OUTDOOR", capacity_new_lbs: 100.00, inspection_due_at: "2027-01-01T00:00:00Z" }, as: Operator, as_user_id: "${op}", captures: { mag: $.data.id } }
            - { call: "POST /pyro/magazines/${mag}/batches", payload: { product_name: "Shell 4in", un_number: "UN0335", shell_diameter_in: 4, quantity_units: 50, new_per_unit_lbs: 0.50, lot_number: "L1" }, as: Operator, as_user_id: "${op}", captures: { b1: $.data.id } }
            - { call: "POST /pyro/batches/${b1}/movements", payload: { movement_type: "CHECK_OUT", quantity: 20, display_event_id: "${ev}", driver_name: "Dan", vehicle_placard: "1.3G", cdl_hazmat_endorsed: true }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/operators/${op}/crew-members", payload: { full_name: "Lee", cert_level: "LEAD_OPERATOR", cert_expires_at: "2027-06-01T00:00:00Z", hazmat_endorsed: true }, as: Operator, as_user_id: "${op}", captures: { crew: $.data.id } }
            - { call: "POST /pyro/displays/${ev}/security-posts", payload: { post_label: "N", arc_degrees: 45, radius_ft: 300 }, as: Operator, as_user_id: "${op}", captures: { post: $.data.id } }
            - { call: "POST /pyro/security-posts/${post}/assign", payload: { guard_name: "g1", guard_company: "SEC" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/security-posts/${post}/assign", payload: { guard_name: "g2", guard_company: "SEC" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/security-posts/${post}/assign", payload: { guard_name: "g3", guard_company: "SEC" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/displays/${ev}/ready", payload: {}, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T20:00:00Z" }, as: SystemAdmin }
            - { call: "POST /pyro/displays/${ev}/weather-readings", payload: { wind_speed_mph: 5.0, gust_mph: 12.0, wind_direction_deg: 180, precipitation: false, source: "NWS" }, as: CrewMember, as_user_id: "${crew}" }
            - { call: "GET /pyro/displays/${ev}", payload: {}, as: Operator, as_user_id: "${op}", captures: { ev_go_v: $.data.version } }
            - { call: "POST /pyro/displays/${ev}/go-no-go", payload: { decision: "GO", expected_display_event_version: "${ev_go_v}" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/batches/${b1}/movements", payload: { movement_type: "EXPEND", quantity: 5, display_event_id: "${ev}" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/displays/${ev}/misfires", payload: { product_batch_id: "${b1}", shell_description: "dud" }, as: CrewMember, as_user_id: "${crew}", captures: { mf: $.data.id } }
            - { call: "POST /pyro/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T20:20:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /pyro/misfires/${mf}/dispose", payload: { disposal_method: "SOAK_CRUSH" }, as: Operator, as_user_id: "${op}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (event IN_PROGRESS, not SHOW_COMPLETE/SWEEP_VERIFIED) even though 20 min > 15 min soak"

      - name: sweep_rejected_allows_resweep
        claim_type: valid_transition
        grounds: [state_machines.SweepRecord, state_machines.DisplayEvent]
        distinguishing_aspect: "A REJECTED sweep leaves the event SHOW_COMPLETE and a fresh sweep can be recorded and verified (re-sweep loop)."
        test_recipe:
          setup: ["event SHOW_COMPLETE, no misfires, net checked-out 0 (all 20 expended)"]
          setup_api_calls:
            - { call: "POST /pyro/operators", payload: { legal_name: "Pyro Co", atf_license_number: "ATF-001", license_class: "DISPLAY_1_3G", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z" }, as: SystemAdmin, captures: { op: $.data.id } }
            - { call: "POST /pyro/displays", payload: { venue_id: "VEN-1", venue_name: "Fairgrounds", scheduled_start_at: "2026-09-01T20:00:00Z", scheduled_end_at: "2026-09-01T23:00:00Z", declared_max_shell_diameter_in: 4 }, as: Operator, as_user_id: "${op}", captures: { ev: $.data.id, ev_v: $.data.version } }
            - { call: "POST /pyro/displays/${ev}/site-plans", payload: { diagram_ref: "D1", launch_area_width_ft: 200, launch_area_length_ft: 200, spectator_boundary_ft: 300, spectator_arc_center_deg: 0, nearest_structure_ft: 500, expected_display_event_version: "${ev_v}" }, as: Operator, as_user_id: "${op}", captures: { sp: $.data.id } }
            - { call: "POST /pyro/displays/${ev}/permit-applications", payload: { site_plan_id: "${sp}", standby_engines: 1 }, as: Operator, as_user_id: "${op}", captures: { app: $.data.id } }
            - { call: "POST /pyro/permit-applications/${app}/approve", payload: { decision_note: "ok" }, as: FireMarshal, as_user_id: "fm_1" }
            - { call: "POST /pyro/displays/${ev}/standby-confirm", payload: { standby_engines_on_site: 1 }, as: FireMarshal, as_user_id: "fm_2" }
            - { call: "POST /pyro/magazines", payload: { name: "MAG-1", atf_magazine_permit: "P-1", magazine_type: "OUTDOOR", capacity_new_lbs: 100.00, inspection_due_at: "2027-01-01T00:00:00Z" }, as: Operator, as_user_id: "${op}", captures: { mag: $.data.id } }
            - { call: "POST /pyro/magazines/${mag}/batches", payload: { product_name: "Shell 4in", un_number: "UN0335", shell_diameter_in: 4, quantity_units: 50, new_per_unit_lbs: 0.50, lot_number: "L1" }, as: Operator, as_user_id: "${op}", captures: { b1: $.data.id } }
            - { call: "POST /pyro/batches/${b1}/movements", payload: { movement_type: "CHECK_OUT", quantity: 20, display_event_id: "${ev}", driver_name: "Dan", vehicle_placard: "1.3G", cdl_hazmat_endorsed: true }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/operators/${op}/crew-members", payload: { full_name: "Lee", cert_level: "LEAD_OPERATOR", cert_expires_at: "2027-06-01T00:00:00Z", hazmat_endorsed: true }, as: Operator, as_user_id: "${op}", captures: { crew: $.data.id } }
            - { call: "POST /pyro/displays/${ev}/security-posts", payload: { post_label: "N", arc_degrees: 45, radius_ft: 300 }, as: Operator, as_user_id: "${op}", captures: { post: $.data.id } }
            - { call: "POST /pyro/security-posts/${post}/assign", payload: { guard_name: "g1", guard_company: "SEC" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/security-posts/${post}/assign", payload: { guard_name: "g2", guard_company: "SEC" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/security-posts/${post}/assign", payload: { guard_name: "g3", guard_company: "SEC" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/displays/${ev}/ready", payload: {}, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T20:00:00Z" }, as: SystemAdmin }
            - { call: "POST /pyro/displays/${ev}/weather-readings", payload: { wind_speed_mph: 5.0, gust_mph: 12.0, wind_direction_deg: 180, precipitation: false, source: "NWS" }, as: CrewMember, as_user_id: "${crew}" }
            - { call: "GET /pyro/displays/${ev}", payload: {}, as: Operator, as_user_id: "${op}", captures: { ev_go_v: $.data.version } }
            - { call: "POST /pyro/displays/${ev}/go-no-go", payload: { decision: "GO", expected_display_event_version: "${ev_go_v}" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/batches/${b1}/movements", payload: { movement_type: "EXPEND", quantity: 20, display_event_id: "${ev}" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/displays/${ev}/complete-show", payload: {}, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/displays/${ev}/sweeps", payload: { sweep_type: "NIGHT_SWEEP", area_clear: false, notes: "debris" }, as: CrewMember, as_user_id: "${crew}", captures: { sw1: $.data.id } }
          trigger:
            - { call: "POST /pyro/sweeps/${sw1}/verify", payload: { verdict: "REJECTED", note: "re-sweep at dawn" }, as: FireMarshal, as_user_id: "fm_2", captures: { v1: $.data.verdict } }
