              as: FareAdmin
              captures: { err: $.data.error_id }
          assert:
            - "status == 409 and data.error_id == ERR_CARD_EXPIRED"

      - name: fsa_cap_exceeded_returns_422
        claim_type: Aggregate validation
        grounds:
          - validations[priority=12]
          - errors[ERR_FSA_CAP_EXCEEDED]
          - entities.BenefitAllocation.fields.allocated_cents
        distinguishing_aspect: "allocated_cents above MONTHLY_FSA_CAP_CENTS -> ERR_FSA_CAP_EXCEEDED (422) for an existing rider."
        test_recipe:
          setup:
            - "Rider RX exists, version 1, no prior allocation for 2026-06."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_X", base_fare_cents: 300, daily_cap_cents: 500, weekly_cap_cents: 2500 }
              as: FareAdmin
            - call: "POST /riders"
              payload: { email: "rx@x.com", full_name: "R X", home_zone_code: "ZONE_X" }
              as: Anonymous
              captures: { rx: $.data.id, rxv: $.data.version }
          trigger:
            - call: "POST /benefit-allocations"
              payload: { rider_id: "${rx}", employer_ref: "EMPX", period_month: "2026-06", allocated_cents: 9999999, expected_rider_version: "${rxv}" }
