  - rule_id: cross_entity_state_dependency
    instances:

      - name: claim_submit_requires_report_published
        grounds:
          - state_machines.CarbonClaim.DRAFT_to_IN_REVIEW
          - validations[priority=9]
          - errors[ERR_REPORT_NOT_PUBLISHED]
        distinguishing_aspect: "Entity pair CarbonClaim x PCFReport: submit is gated on the referenced report being PUBLISHED — the same submit call fails with ERR_REPORT_NOT_PUBLISHED while the report sits VERIFIED, then succeeds unchanged once the report's state flips to PUBLISHED."
        test_recipe:
          setup:
            - "Collection RND with batch DL-100 released; REP-1 CRADLE_TO_GATE submitted and verified (VERIFIED, not yet published)."
            - "Claim CL-N: CARBON_NEUTRAL, volume 50, boundary CRADLE_TO_GATE, referencing REP-1."
          setup_api_calls:
            - *k_clock
            - *k_col_gate_none
            - *k_lot_net200
            - *k_lot_vir200
            - *k_qc_lot1
            - *k_qc_lot2
            - *k_batch_b1
            - *k_alloc1
            - *k_alloc2
            - *k_rel_b1
            - *k_rep_gate
            - *k_submit1
            - *k_assign1
            - *k_clear1
            - *k_claim_neutral
          trigger:
            - call: "POST /carpetloop/carbon-claims/${cl1}/submit"
              payload: {}
              as: SustainabilityManager
