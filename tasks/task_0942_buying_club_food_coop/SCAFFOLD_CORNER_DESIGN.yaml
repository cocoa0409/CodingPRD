  - name: an_expired_grant_is_swept_out_of_the_balance_but_keeps_its_remainder
    claim_type: rate_threshold_triggers
    grounds:
    - state_machines.CreditGrant.ACTIVE_to_EXPIRED
    - boundary_semantics.credit_expiry
    - entities.Member.fields.credit_balance_cents
    - entities.CreditGrant.fields.remaining_cents
    distinguishing_aspect: Expiry is a clock threshold swept lazily by the next credit-touching write, and the sweep forfeits spendability without rewriting remaining_cents, so the grant reads 5000 remaining while contributing 0 to the balance.
    test_recipe:
      setup:
      - Mara holds one 5000-cent grant expiring 2026-06-01T00:00:00Z.
      - The clock has been moved to 2026-06-02T00:00:00Z, one day past that instant.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-05T00:00:00Z'
