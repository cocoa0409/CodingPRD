            - call: "POST /room-block-commitments/${c_b_id}/pickup-records"
              payload: { night_date: "2028-04-11", rooms_picked_up: 150, rate_charged_amount: 209.77 }
              as: HotelPartner
              as_user_id: "${hotel_b_id}"
            - call: "POST /room-block-commitments/${c_c_id}/pickup-records"
              payload: { night_date: "2028-04-10", rooms_picked_up: 10, rate_charged_amount: 199.51 }
              as: HotelPartner
              as_user_id: "${hotel_c_id}"
          trigger:
            - call: "POST /economic-impact-estimates"
              payload: { opportunity_id: "${opp_id}", variant: "FINAL" }
              as: BoardAnalyst
