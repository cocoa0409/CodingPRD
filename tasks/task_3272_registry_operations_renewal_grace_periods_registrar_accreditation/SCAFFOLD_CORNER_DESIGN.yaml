              as: RegistryAdmin
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /registry/registrars/${reg_id}/accredit"
              payload: {}
              as: RegistryAdmin
              captures: { err1: $.data.error_id }
          assert:
            - "the accredit attempt is rejected 409 with error_id == ERR_TECHNICAL_TEST_FAILED"
            - "Registrar.${reg_id}.status remains PENDING_TESTS"

      - name: ack_with_wrong_auth_code_rejected_and_transfer_stays_requested
        claim_type: Violation → Error
        grounds:
