  - section: errors
    instances:

      - name: error_unknown_ids_on_each_resource_return_the_matching_not_found_code
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CLINICIAN_NOT_FOUND
          - errors.ERR_CONTENT_REQUEST_NOT_FOUND
          - errors.ERR_ALERT_NOT_FOUND
          - errors.ERR_BURDEN_WINDOW_NOT_FOUND
          - errors.ERR_REVIEW_ASSIGNMENT_NOT_FOUND
          - errors.ERR_VENDOR_RELEASE_NOT_FOUND
          - errors.ERR_VENDOR_RULE_DELTA_NOT_FOUND
          - errors.ERR_DOWNTIME_EVENT_NOT_FOUND
          - errors.ERR_ADHERENCE_MEASUREMENT_NOT_FOUND
          - errors.ERR_ANNUAL_REVIEW_TASK_NOT_FOUND
        distinguishing_aspect: "Each resource family answers an unknown UUID with its OWN 404 code rather than a shared generic one, and the burden-window and delta codes are reachable only through their nested and action routes."
        test_recipe:
          setup:
            - "An empty database except for one ACTIVE alert used as an existing parent for the nested burden-window route."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
