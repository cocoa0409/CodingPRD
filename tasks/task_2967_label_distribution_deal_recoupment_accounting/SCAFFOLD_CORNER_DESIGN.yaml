              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { stmt_id: $.data.id }
            - call: "POST /artist-statements/${stmt_id}/prepare"
              payload: {}
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
            - call: "POST /artist-statements/${stmt_id}/issue"
              payload: {}
              as: BusinessAffairs
              as_user_id: "biz-affairs-01"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /artist-statements/${stmt_id}/finalize"
              payload: {}
              as: BusinessAffairs
              as_user_id: "biz-affairs-01"
              captures: { stmt_net: $.data.net_payable_cents }
            - call: "GET /artist-agreements/${agr_id}"
              payload: {}
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { agr_adv_after_final: $.data.unrecouped_artist_advance_cents, agr_rec_after_final: $.data.unrecouped_recording_cents }
            - call: "POST /artist-statements/${stmt_id}/request-audit"
              payload: { audit_scope_period_start: "2025-10-01", audit_scope_period_end: "2026-03-31", auditor_name: "Halvard Audit LLP" }
              as: Artist
              as_user_id: "${artist_id}"
          trigger:
            - call: "POST /artist-statements/${stmt_id}/conclude-audit"
              payload: { findings_adjustment_cents: 100000 }
              as: BusinessAffairs
              as_user_id: "biz-affairs-01"
            - call: "GET /artist-agreements/${agr_id}"
              payload: {}
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /artist-statements/${stmt_id}/conclude-audit"
              payload: { findings_adjustment_cents: 0 }
              as: BusinessAffairs
              as_user_id: "biz-affairs-01"
              captures: { e_second: $.data.error_id }
          assert:
            - "the request-audit call had returned 200 with audit_status == \"AUDIT_REQUESTED\", audit_scope_period_start == \"2025-10-01\" and audit_scope_period_end == \"2026-03-31\" — the scope is stored verbatim and is NOT clamped to the statement period"
            - "conclude-audit returns 200 with data.audit_status == \"AUDIT_DENIED\", data.audit_findings_adjustment_cents == null and data.audit_cost_bearer == \"ARTIST\""
            - "data.status is STILL \"FINALIZED\" and data.finalized_at is unchanged: the out-of-scope edge never reopens the statement, even though abs(100000) >= round_half_up(${stmt_net} * 0.05) would be material on the AUDIT_COMPLETED edge"
            - "the agreement read after the trigger still shows unrecouped_artist_advance_cents == ${agr_adv_after_final} and unrecouped_recording_cents == ${agr_rec_after_final}: a denial credits nothing back"
            - "e_second == \"ERR_INVALID_STATEMENT_STATE\" with HTTP 409: AUDIT_DENIED is the audit dimension's terminal state, so the trigger that produced it cannot be replayed"
            - "the statement's version incremented by exactly 1 across the whole trigger chain — the denial writes once and the refused replay writes nothing"

      - name: agreement_amendment_cycle_repeats
        claim_type: cyclic
        grounds:
          - state_machines[ArtistAgreement.status].shape
          - state_machines[ArtistAgreement.status].transitions[ACTIVE->AMENDMENT_PENDING]
          - state_machines[ArtistAgreement.status].transitions[AMENDMENT_PENDING->ACTIVE]
        distinguishing_aspect: |
          The cyclic-shape claim — an unbounded ACTIVE -> AMENDMENT_PENDING -> ACTIVE loop whose two
          closing edges share a target state but carry disjoint side effects.
        excluded_because:
          difficulty_instance: agreement_amendment_cycle_repeats_with_disjoint_side_effects
          rationale: |
            §1.8 non_linear_state_machine.agreement_amendment_cycle_repeats_with_disjoint_side_effects
            already drives the loop twice and separates the ACCEPT and REJECT closings on
            royalty_rate_pct, advance_amount_cents and unrecouped_artist_advance_cents, which is a
            strict superset of the shape claim. Repeating it here would duplicate the fixture without
            adding a new observation.

      - name: dispute_compensation_reverses_the_accept_side_effects
        claim_type: compensation
        grounds:
          - state_machines[DspRevenueReport.status].transitions[ACCEPTED->DISPUTED].side_effects
          - state_machines[DspRevenueReport.status].transitions[SUBMITTED->ACCEPTED].side_effects
        distinguishing_aspect: |
          The compensation side-effect pattern — undoing a transition must reverse every hop of the
          original cascade and leave no drift in the conserved advance identity.
        excluded_because:
          difficulty_instance: dispute_reverses_accept_with_zero_advance_drift
          rationale: |
            §1.8 compensating_invariant.dispute_reverses_accept_with_zero_advance_drift already walks
            all four compensation hops and asserts advance_amount_cents == advance_recouped_cents +
            unrecouped_advance_cents both before and after, plus the RECOUPED -> UNRECOUPED flip and
            the royalty-rate reversion. Nothing in the §1.2 side-effect list is left unobserved.

      - name: terminate_cascade_moves_release_then_agreement_then_statement
        claim_type: cascade_down
        grounds:
          - state_machines[DistributionDeal.status].transitions[EXECUTED->TERMINATION_NOTICE].side_effects
          - state_machines[ArtistAgreement.status].transitions[ACTIVE->POST_TERM]
          - state_machines[ArtistStatement.status].transitions[PREPARED->VOIDED]
        distinguishing_aspect: |
          The cascade-down side-effect pattern — one parent transition moving three generations of
          descendants, with only the eligible children affected at each hop.
        excluded_because:
          difficulty_instance: terminate_cascades_release_then_agreement_then_statement
          rationale: |
            §1.8 transitive_cascade.terminate_cascades_release_then_agreement_then_statement already
            asserts all three hops in order, including the ineligible siblings that must NOT move (a
            SUPERSEDED agreement, an ISSUED statement) and the branch-specific date propagation. The
            conditional half of the pattern is separately covered above by
            enter_post_term_collection_voids_only_open_marketing_spends.

  - section: calculations
    instances:
      - name: line_rate_resolution_keys_on_the_full_dsp_territory_tier_triple
        claim_type: tiered_pricing
        grounds:
          - calculations.dsp_line_revenue.formula
          - calculations.dsp_line_revenue.constants
          - endpoints[POST /dsp-revenue-reports/{id}/submit]
          - entities.DspRevenueLine.applied_rate_micros_per_stream
        distinguishing_aspect: |
          Three lines of one report resolve three DIFFERENT rate cards because they differ in
          territory_code and/or tier while sharing dsp_code and period: the selector is a
          three-part key, not a per-DSP scalar. Each line's cents value is its own
          stream_count * rate / 10000, and the report gross is the sum of the three. Falsified by
          any implementation that resolves one rate per report, keys only on dsp_code, or treats
          rate_micros_per_stream as cents.
        test_recipe:
          setup:
            - "one Distributor, one Artist, one EXECUTED DISTRIBUTION_FEE deal at 0.1500 with territory_codes [US, GB], one RELEASED release"
            - "three StreamRateCards on dsp STRM: US/PREMIUM 4000, US/AD_SUPPORTED 1200, GB/PREMIUM 3000, all open-ended from 2026-01-01"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Vector Digital", legal_entity: "Vector Digital LLC", default_returns_reserve_pct: 0.1000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_id: $.data.id }
