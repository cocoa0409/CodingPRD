# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2212 - Hazard Mitigation Buyout & Acquisition Program
#
# Every rule_id below is verbatim from SKILL.md §0.5. Every `grounds:` entry resolves into
# SCAFFOLD.yaml §1.1-§1.7. Every numeric literal in an `assert:` line was produced by executing
# the corresponding SCAFFOLD.yaml `calculations[].formula` in Python against the pinned inputs.
#
# Shared conventions used by every setup chain below:
#   * The logical clock starts at 2026-08-01T00:00:00Z (see POST /_clock/set_current_utc).
#   * SubrecipientCoordinator is entity_backed:MitigationProject, so its X-User-ID is always the
#     project id -> `as_user_id: "${proj}"`.
#   * MitigationProject.cost_share_federal_pct defaults to 0.75; no chain overrides it.
#   * grant_program FMA is used so disaster_declaration_number is not required (validations
#     priority 4).
#   * Parcels must be created while the project is DRAFT or SUBMITTED (validations priority 24),
#     so parcel creation always precedes submit/approve.
#   * SoD-2 forces two distinct ProgramAdministrator ids: "pa-validator" validates the BCA,
#     "pa-approver" approves the project.
#   * SoD-1 forces three distinct appraiser ids: "sa-1" authors the INITIAL, "ra-1" reviews it and
#     authors the REVIEW, "ra-2" accepts the REVIEW.
#   * Parcel.version and MitigationProject.version are ALWAYS re-read with a GET immediately
#     before any OCC write, because the appraisal, offer and cascade side effects bump them.

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: bcr_discounted_npv_vs_undiscounted_life_cycle_divergence
        grounds:
          - calculations.benefit_cost_ratio
          - entities.BenefitCostAnalysis.fields.analysis_method
          - entities.BenefitCostAnalysis.fields.pv_annuity_factor
          - entities.BenefitCostAnalysis.fields.npv_benefits_cents
          - entities.BenefitCostAnalysis.fields.bcr
        distinguishing_aspect: |
          This instance's dual variant lives on the BenefitCostAnalysis entity domain (grant
          eligibility scoring): the SAME five stored inputs produce pv_annuity_factor 12.409041 /
          bcr 1.103 under FEMA_BCA_TOOLKIT and pv_annuity_factor 0 / bcr 2.667 under
          PRE_CALCULATED_BENEFIT, a npv_benefits_cents delta of 70363836 that is the whole
          discounting effect and not a rounding cent.
        test_recipe:
          setup:
            - "Two MitigationProjects exist in DRAFT, both with cost_share_federal_pct 0.75."
            - "No BenefitCostAnalysis exists yet on either project."
          setup_api_calls:
            - call: "POST /mitigation-projects"
              payload: { project_code: "BCR-DISC", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { proj_disc: $.data.id }
            - call: "POST /mitigation-projects"
              payload: { project_code: "BCR-UNDISC", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { proj_undisc: $.data.id }
          trigger:
            - call: "POST /mitigation-projects/${proj_disc}/benefit-cost-analyses"
              payload: { project_id: "${proj_disc}", analysis_method: "FEMA_BCA_TOOLKIT", hazard_type: "RIVERINE_FLOOD", sfha_zone: "AE", annualized_loss_avoided_cents: 4000000, project_useful_life_years: 30, discount_rate_pct: 0.07, mitigation_cost_cents: 45000000 }
              as: SubrecipientCoordinator
              as_user_id: "${proj_disc}"
              captures: { bca_disc: $.data.id }
            - call: "POST /mitigation-projects/${proj_undisc}/benefit-cost-analyses"
              payload: { project_id: "${proj_undisc}", analysis_method: "PRE_CALCULATED_BENEFIT", hazard_type: "RIVERINE_FLOOD", sfha_zone: "AE", annualized_loss_avoided_cents: 4000000, project_useful_life_years: 30, discount_rate_pct: 0.07, mitigation_cost_cents: 45000000 }
              as: SubrecipientCoordinator
              as_user_id: "${proj_undisc}"
              captures: { bca_undisc: $.data.id }
          assert:
            - "BenefitCostAnalysis.${bca_disc}.pv_annuity_factor == 12.409041"
            - "BenefitCostAnalysis.${bca_disc}.npv_benefits_cents == 49636164"
            - "BenefitCostAnalysis.${bca_disc}.bcr == 1.103"
            - "BenefitCostAnalysis.${bca_undisc}.pv_annuity_factor == 0"
            - "BenefitCostAnalysis.${bca_undisc}.npv_benefits_cents == 120000000"
            - "BenefitCostAnalysis.${bca_undisc}.bcr == 2.667"
            - "BenefitCostAnalysis.${bca_undisc}.npv_benefits_cents - BenefitCostAnalysis.${bca_disc}.npv_benefits_cents == 70363836"
            - "BenefitCostAnalysis.${bca_undisc}.discount_rate_pct == 0.07 (stored but never read by the undiscounted variant)"
            - "BenefitCostAnalysis.${bca_disc}.status == SUBMITTED and BenefitCostAnalysis.${bca_undisc}.status == SUBMITTED"

      - name: replacement_housing_comparable_dwelling_vs_actual_replacement_divergence
        grounds:
          - calculations.replacement_housing_payment
          - entities.RelocationCase.fields.rhp_method
          - entities.RelocationCase.fields.replacement_housing_payment_cents
          - entities.RelocationCase.fields.acquisition_price_cents
          - entities.RelocationCase.fields.total_relocation_benefit_cents
          - state_machines.RelocationCase.OPENED_to_ELIGIBILITY_DETERMINED
        distinguishing_aspect: |
          This instance's dual variant lives on the RelocationCase entity domain (federal
          relocation-law benefit computation), a different entity domain from
          bcr_discounted_npv_vs_undiscounted_life_cycle_divergence: two cases on the same parcel
          carrying identical comparable_dwelling_price_cents 22000000 and
          actual_purchase_price_cents 24000000 yield replacement_housing_payment_cents 600000 under
          COMPARABLE_DWELLING and 2600000 under ACTUAL_REPLACEMENT, a delta of 2000000.
        test_recipe:
          setup:
            - "One APPROVED MitigationProject with one OWNER_OCCUPIED parcel (acreage 0.34)."
            - "The parcel has an ACCEPTED REVIEW appraisal at 20000000 and no DOB records, so its PurchaseOffer has net_offer_cents 21400000 and is ACCEPTED."
            - "Two RelocationCases in OPENED on that parcel, household_reference HH-A and HH-B, both OWNER_OCCUPANT, differing only in rhp_method."
          setup_api_calls:
            - call: "POST /mitigation-projects"
              payload: { project_code: "RHP-DUAL", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { proj: $.data.id }
            - call: "POST /mitigation-projects/${proj}/parcels"
              payload: { project_id: "${proj}", apn: "APN-001", site_address: "12 River Rd", acreage: 0.34, occupancy_type: "OWNER_OCCUPIED", structure_type: "SINGLE_FAMILY" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { p1: $.data.id }
            - call: "POST /mitigation-projects/${proj}/benefit-cost-analyses"
              payload: { project_id: "${proj}", analysis_method: "PRE_CALCULATED_BENEFIT", hazard_type: "RIVERINE_FLOOD", sfha_zone: "AE", annualized_loss_avoided_cents: 4000000, project_useful_life_years: 30, mitigation_cost_cents: 45000000 }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { bca: $.data.id }
            - call: "POST /benefit-cost-analyses/${bca}/validate"
              payload: { bca_id: "${bca}", decision: "VALIDATE" }
              as: ProgramAdministrator
              as_user_id: "pa-validator"
            - call: "POST /mitigation-projects/${proj}/submit"
              payload: { project_id: "${proj}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /mitigation-projects/${proj}/approve"
              payload: { project_id: "${proj}", decision: "APPROVE" }
              as: ProgramAdministrator
              as_user_id: "pa-approver"
            - call: "POST /parcels/${p1}/pre-event-value"
              payload: { parcel_id: "${p1}", pre_event_fmv_cents: 20000000, pre_event_value_basis: "ASSESSOR_ROLL" }
              as: StaffAppraiser
              as_user_id: "sa-1"
            - call: "POST /parcels/${p1}/participation"
              payload: { parcel_id: "${p1}", participation_decision: "INTERESTED" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /parcels/${p1}/participation"
              payload: { parcel_id: "${p1}", participation_decision: "CONFIRM_VOLUNTARY", voluntary_acknowledgement_signed_on: "2026-08-01" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /parcels/${p1}/appraisals"
              payload: { parcel_id: "${p1}", appraisal_type: "INITIAL", valuation_basis: "PRE_EVENT", appraiser_license_no: "LIC-SA-1", effective_date: "2026-07-01", indicated_value_cents: 20000000 }
              as: StaffAppraiser
              as_user_id: "sa-1"
              captures: { ap1: $.data.id }
            - call: "POST /appraisals/${ap1}/submit"
              payload: { appraisal_id: "${ap1}" }
              as: StaffAppraiser
              as_user_id: "sa-1"
            - call: "POST /appraisals/${ap1}/review-decision"
              payload: { appraisal_id: "${ap1}", decision: "ACCEPT" }
              as: ReviewAppraiser
              as_user_id: "ra-1"
            - call: "POST /parcels/${p1}/appraisals"
              payload: { parcel_id: "${p1}", appraisal_type: "REVIEW", valuation_basis: "PRE_EVENT", appraiser_license_no: "LIC-RA-1", effective_date: "2026-07-05", indicated_value_cents: 20000000, reviewed_appraisal_id: "${ap1}" }
              as: ReviewAppraiser
              as_user_id: "ra-1"
              captures: { ap1r: $.data.id }
            - call: "POST /appraisals/${ap1r}/submit"
              payload: { appraisal_id: "${ap1r}" }
              as: ReviewAppraiser
              as_user_id: "ra-1"
            - call: "POST /appraisals/${ap1r}/review-decision"
              payload: { appraisal_id: "${ap1r}", decision: "ACCEPT" }
              as: ReviewAppraiser
              as_user_id: "ra-2"
            - call: "GET /parcels/${p1}"
              payload: { parcel_id: "${p1}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { p1v: $.data.version }
            - call: "POST /parcels/${p1}/purchase-offers"
              payload: { parcel_id: "${p1}", source_appraisal_id: "${ap1r}", offer_basis: "PRE_EVENT_FMV", expected_parcel_version: "${p1v}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { of1: $.data.id }
            - call: "POST /purchase-offers/${of1}/present"
              payload: { offer_id: "${of1}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /purchase-offers/${of1}/owner-response"
              payload: { offer_id: "${of1}", response: "ACCEPT" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /parcels/${p1}/relocation-cases"
              payload: { parcel_id: "${p1}", displacee_type: "OWNER_OCCUPANT", household_reference: "HH-A", rhp_method: "COMPARABLE_DWELLING", rental_assistance_start_date: "2026-09-01", comparable_dwelling_price_cents: 22000000, actual_purchase_price_cents: 24000000, moving_expense_cents: 175000 }
              as: RelocationSpecialist
              as_user_id: "rs-1"
              captures: { case_cd: $.data.id }
            - call: "POST /parcels/${p1}/relocation-cases"
              payload: { parcel_id: "${p1}", displacee_type: "OWNER_OCCUPANT", household_reference: "HH-B", rhp_method: "ACTUAL_REPLACEMENT", rental_assistance_start_date: "2026-09-01", comparable_dwelling_price_cents: 22000000, actual_purchase_price_cents: 24000000, moving_expense_cents: 175000 }
              as: RelocationSpecialist
              as_user_id: "rs-1"
              captures: { case_ar: $.data.id }
          trigger:
            - call: "POST /relocation-cases/${case_cd}/determine-eligibility"
              payload: { case_id: "${case_cd}" }
              as: RelocationSpecialist
              as_user_id: "rs-1"
            - call: "POST /relocation-cases/${case_ar}/determine-eligibility"
              payload: { case_id: "${case_ar}" }
              as: RelocationSpecialist
              as_user_id: "rs-1"
          assert:
            - "PurchaseOffer.${of1}.net_offer_cents == 21400000"
            - "RelocationCase.${case_cd}.acquisition_price_cents == 21400000"
            - "RelocationCase.${case_ar}.acquisition_price_cents == 21400000"
            - "RelocationCase.${case_cd}.replacement_housing_payment_cents == 600000"
            - "RelocationCase.${case_ar}.replacement_housing_payment_cents == 2600000"
            - "RelocationCase.${case_ar}.replacement_housing_payment_cents - RelocationCase.${case_cd}.replacement_housing_payment_cents == 2000000"
            - "RelocationCase.${case_cd}.rental_assistance_months == 0"
            - "RelocationCase.${case_ar}.rental_assistance_months == 0"
            - "RelocationCase.${case_cd}.rental_assistance_cents == 0"
            - "RelocationCase.${case_cd}.total_relocation_benefit_cents == 775000"
            - "RelocationCase.${case_ar}.total_relocation_benefit_cents == 2775000"
            - "RelocationCase.${case_cd}.status == ELIGIBILITY_DETERMINED and RelocationCase.${case_ar}.status == ELIGIBILITY_DETERMINED"

  - rule_id: combinatorial_formula
    instances:

      - name: dob_deduction_rounds_per_record_before_summation
        grounds:
          - calculations.dob_deduction_total
          - entities.DuplicationOfBenefitsRecord.fields.deductible_cents
          - entities.Parcel.fields.dob_deduction_total_cents
          - calculations.dob_deduction_total.constants.DOB_SOURCE_FACTORS
        distinguishing_aspect: |
          MODE (b) - nested rounding where the order is outcome-changing. Two SBA_LOAN records at
          factor 0.50 each produce a raw half-cent (250000.5 and 350000.5); rounding per record
          first yields 250001 + 350001 and a total of 1500002, whereas summing the raw legs
          (900000 + 250000.5 + 350000.5 = 1500001.0) and rounding once yields 1500001. The scaffold
          pins round-per-record-then-sum, so 1500002 is the only correct answer and the one-cent gap
          is a pure order-of-rounding artifact.
        test_recipe:
          setup:
            - "One APPROVED MitigationProject with one parcel and no DuplicationOfBenefitsRecord rows."
          setup_api_calls:
            - call: "POST /mitigation-projects"
              payload: { project_code: "DOB-ORDER", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { proj: $.data.id }
            - call: "POST /mitigation-projects/${proj}/parcels"
              payload: { project_id: "${proj}", apn: "APN-DOB", site_address: "40 River Rd", acreage: 0.50, occupancy_type: "OWNER_OCCUPIED", structure_type: "SINGLE_FAMILY" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { p1: $.data.id }
            - call: "POST /mitigation-projects/${proj}/benefit-cost-analyses"
              payload: { project_id: "${proj}", analysis_method: "PRE_CALCULATED_BENEFIT", hazard_type: "RIVERINE_FLOOD", sfha_zone: "AE", annualized_loss_avoided_cents: 4000000, project_useful_life_years: 30, mitigation_cost_cents: 45000000 }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { bca: $.data.id }
            - call: "POST /benefit-cost-analyses/${bca}/validate"
              payload: { bca_id: "${bca}", decision: "VALIDATE" }
              as: ProgramAdministrator
              as_user_id: "pa-validator"
            - call: "POST /mitigation-projects/${proj}/submit"
              payload: { project_id: "${proj}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /mitigation-projects/${proj}/approve"
              payload: { project_id: "${proj}", decision: "APPROVE" }
              as: ProgramAdministrator
              as_user_id: "pa-approver"
          trigger:
            - call: "POST /parcels/${p1}/dob-records"
              payload: { parcel_id: "${p1}", benefit_source: "NFIP_CLAIM", amount_cents: 1200000, repair_documented_cents: 300000, received_on: "2026-03-01" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { dob_nfip: $.data.id }
            - call: "POST /parcels/${p1}/dob-records"
              payload: { parcel_id: "${p1}", benefit_source: "SBA_LOAN", amount_cents: 500001, repair_documented_cents: 0, received_on: "2026-04-01" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { dob_sba_a: $.data.id }
            - call: "POST /parcels/${p1}/dob-records"
              payload: { parcel_id: "${p1}", benefit_source: "SBA_LOAN", amount_cents: 700001, repair_documented_cents: 0, received_on: "2026-05-01" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { dob_sba_b: $.data.id }
          assert:
            - "DuplicationOfBenefitsRecord.${dob_nfip}.deductible_cents == 900000"
            - "DuplicationOfBenefitsRecord.${dob_sba_a}.deductible_cents == 250001"
            - "DuplicationOfBenefitsRecord.${dob_sba_b}.deductible_cents == 350001"
            - "Parcel.${p1}.dob_deduction_total_cents == 1500002"
            - "Parcel.${p1}.dob_deduction_total_cents != 1500001 (the sum-then-round answer is wrong)"
            - "DuplicationOfBenefitsRecord.${dob_nfip}.status == ACTIVE"

      - name: net_offer_incentive_tier_keyed_on_post_deduction_figure
        grounds:
          - calculations.net_offer_amount
          - entities.PurchaseOffer.fields.pre_incentive_net_cents
          - entities.PurchaseOffer.fields.incentive_cents
          - entities.PurchaseOffer.fields.net_offer_cents
          - concurrency_rules.offer-create-stale-parcel
        distinguishing_aspect: |
          MODE (c) - a dependency that looks circular (the incentive depends on the net, the net
          depends on the incentive) resolved by the scaffold's pinned STEP 3 -> STEP 4 -> STEP 5 ->
          STEP 6 order, where the tier is selected on the POST-deduction pre_incentive_net_cents and
          never on the raw appraisal. The result is non-monotonic in the appraisal: a 10000000
          appraisal yields net_offer_cents 10890000 while a LARGER 10100000 appraisal on an
          otherwise identical parcel yields a SMALLER 10700000, because 9900000 falls in the 0.10
          band and 10000000 falls in the 0.07 band.
        test_recipe:
          setup:
            - "One APPROVED MitigationProject with two OWNER_OCCUPIED parcels."
            - "Parcel X: pre_event_fmv 10000000, ACCEPTED REVIEW appraisal at 10000000, one NFIP_CLAIM DOB record of 100000 with zero documented repair."
            - "Parcel Y: pre_event_fmv 10100000, ACCEPTED REVIEW appraisal at 10100000, the identical DOB record."
            - "Neither parcel has any PurchaseOffer yet."
          setup_api_calls:
            - call: "POST /mitigation-projects"
              payload: { project_code: "TIER-EDGE", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { proj: $.data.id }
            - call: "POST /mitigation-projects/${proj}/parcels"
              payload: { project_id: "${proj}", apn: "APN-X", site_address: "1 Levee Ln", acreage: 0.25, occupancy_type: "OWNER_OCCUPIED", structure_type: "SINGLE_FAMILY" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { px: $.data.id }
            - call: "POST /mitigation-projects/${proj}/parcels"
              payload: { project_id: "${proj}", apn: "APN-Y", site_address: "3 Levee Ln", acreage: 0.25, occupancy_type: "OWNER_OCCUPIED", structure_type: "SINGLE_FAMILY" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { py: $.data.id }
            - call: "POST /mitigation-projects/${proj}/benefit-cost-analyses"
              payload: { project_id: "${proj}", analysis_method: "PRE_CALCULATED_BENEFIT", hazard_type: "RIVERINE_FLOOD", sfha_zone: "AE", annualized_loss_avoided_cents: 4000000, project_useful_life_years: 30, mitigation_cost_cents: 45000000 }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { bca: $.data.id }
            - call: "POST /benefit-cost-analyses/${bca}/validate"
              payload: { bca_id: "${bca}", decision: "VALIDATE" }
              as: ProgramAdministrator
              as_user_id: "pa-validator"
            - call: "POST /mitigation-projects/${proj}/submit"
              payload: { project_id: "${proj}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /mitigation-projects/${proj}/approve"
              payload: { project_id: "${proj}", decision: "APPROVE" }
              as: ProgramAdministrator
              as_user_id: "pa-approver"
            - call: "POST /parcels/${px}/pre-event-value"
              payload: { parcel_id: "${px}", pre_event_fmv_cents: 10000000, pre_event_value_basis: "ASSESSOR_ROLL" }
              as: StaffAppraiser
              as_user_id: "sa-1"
            - call: "POST /parcels/${py}/pre-event-value"
              payload: { parcel_id: "${py}", pre_event_fmv_cents: 10100000, pre_event_value_basis: "ASSESSOR_ROLL" }
              as: StaffAppraiser
              as_user_id: "sa-1"
            - call: "POST /parcels/${px}/participation"
              payload: { parcel_id: "${px}", participation_decision: "INTERESTED" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /parcels/${py}/participation"
              payload: { parcel_id: "${py}", participation_decision: "INTERESTED" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /parcels/${px}/dob-records"
              payload: { parcel_id: "${px}", benefit_source: "NFIP_CLAIM", amount_cents: 100000, repair_documented_cents: 0, received_on: "2026-03-01" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /parcels/${py}/dob-records"
              payload: { parcel_id: "${py}", benefit_source: "NFIP_CLAIM", amount_cents: 100000, repair_documented_cents: 0, received_on: "2026-03-01" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /parcels/${px}/appraisals"
              payload: { parcel_id: "${px}", appraisal_type: "INITIAL", valuation_basis: "PRE_EVENT", appraiser_license_no: "LIC-SA-1", effective_date: "2026-07-01", indicated_value_cents: 10000000 }
              as: StaffAppraiser
              as_user_id: "sa-1"
              captures: { apx: $.data.id }
            - call: "POST /appraisals/${apx}/submit"
              payload: { appraisal_id: "${apx}" }
              as: StaffAppraiser
              as_user_id: "sa-1"
            - call: "POST /appraisals/${apx}/review-decision"
              payload: { appraisal_id: "${apx}", decision: "ACCEPT" }
              as: ReviewAppraiser
              as_user_id: "ra-1"
            - call: "POST /parcels/${px}/appraisals"
              payload: { parcel_id: "${px}", appraisal_type: "REVIEW", valuation_basis: "PRE_EVENT", appraiser_license_no: "LIC-RA-1", effective_date: "2026-07-05", indicated_value_cents: 10000000, reviewed_appraisal_id: "${apx}" }
              as: ReviewAppraiser
              as_user_id: "ra-1"
              captures: { apxr: $.data.id }
            - call: "POST /appraisals/${apxr}/submit"
              payload: { appraisal_id: "${apxr}" }
              as: ReviewAppraiser
              as_user_id: "ra-1"
            - call: "POST /appraisals/${apxr}/review-decision"
              payload: { appraisal_id: "${apxr}", decision: "ACCEPT" }
              as: ReviewAppraiser
