              as: AuctionOps
              captures: { err_add: $.data.error_id }
            - call: "POST /auction-events/${event_id}/lots"
              payload: { asset_listing_id: "${listing_id}", lot_number: 1, lot_window_start_at: "2026-09-15T17:00:00Z", lot_window_end_at: "2026-09-15T18:00:00Z", opening_bid_cents: 20000000, reserve_price_cents: 20000000, expected_auction_event_version: "${ev_v1}" }
              as: AuctionOps
