              as: Dispatcher
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/documents"
              payload: { doc_type: "SUMMONS", page_count: 3 }
              as: Dispatcher
            - call: "POST /service-requests/${sr_id}/submit"
              payload: {}
              as: Dispatcher
              captures: { sr_v: $.data.version }
            - call: "POST /service-requests/${sr_id}/assignments"
              payload: { server_id: "${server_id}", expected_service_request_version: "${sr_v}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /assignments/${asg_id}/accept"
              payload: {}
              as: Server
              as_user_id: "${server_id}"
            - call: "POST /assignments/${asg_id}/stakeouts"
              payload: { window_start_utc: "2026-01-02T06:00:00Z", window_end_utc: "2026-01-02T08:00:00Z" }
              as: Server
              as_user_id: "${server_id}"
              captures: { stk_id: $.data.id }
            - call: "GET /service-requests/${sr_id}"
              payload: {}
              as: Dispatcher
              captures: { mid_fee: $.data.final_fee_cents }
          trigger:
            - call: "POST /stakeouts/${stk_id}/state"
              payload: { to_status: "CANCELLED" }
              as: Server
              as_user_id: "${server_id}"
              captures: { st: $.data.status }
          assert:
            - "ServiceRequest.${sr_id}.final_fee_cents was 19575 after scheduling the stakeout"
            - "Stakeout.${stk_id}.status == CANCELLED"
            - "ServiceRequest.${sr_id}.final_fee_cents == 7575"
            - "ServiceRequest.${sr_id}.final_fee_cents == sum(InvoiceLine.amount_cents where voided==false)"

      - name: accept_then_reassign_conserves_server_active_count_capacity
        grounds:
          - state_machines.Assignment.ACCEPTED_to_ACTIVE
          - state_machines.Assignment.ACTIVE_to_REASSIGNED
          - entities.Server.fields.active_assignment_count
        distinguishing_aspect: |
          Conserved quantity = capacity count (Server.active_assignment_count),
          different in type from money. Accept (+1) paired with reassign (-1) returns
          the count to 0, with invariant active_assignment_count ==
          count(Assignment where server_id==S and status==ACTIVE).
        test_recipe:
          setup:
            - "Server with 0 active. One request submitted, server accepts (count 1), dispatcher reassigns (count back to 0)."
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "Mono", state_code: "CA", e_file_enabled: false, min_diligent_attempts: 1 }
              as: Admin
              captures: { county_id: $.data.id }
