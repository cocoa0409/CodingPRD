# =============================================================================
# §1.8 Scaffold Difficulty Design — task 0989 compost-pickup
# 9 rules x 2 instances = 18 instances. All literals precomputed by hand
# against SCAFFOLD.yaml formulas/constants (plans used below:
#   RES: weekly 1200, credit_rate 10/kg, allowance 2, BIN_35L (20 kg nominal)
#   COM: base 3000, per-kg 7, included 40 kg, credit_rate 5/kg, allowance 4,
#        BIN_240L (60 kg nominal)
# seasons: SPRING x1.0 (Mar-May), SUMMER x1.2 (Jun-Aug); cap 50%; yield 0.3;
# bag 10 kg / 500 cents; strikes suspend at 3; skip cutoff 48h.)
# =============================================================================

scaffold_difficulty_design:
  # ------------------------------------------------------------------ Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: diversion_credit_estimated_vs_weighed
        grounds:
          - calculations.estimated_diversion_credit
          - calculations.weighed_allocation
        distinguishing_aspect: |
          Same two COMPLETED pickups yield different credit cents under the
          estimated variant (driver fullness, posted at completion) vs the
          weighed variant (facility net kg allocated proportionally) — the
          dual variant lives in the CompostCreditEntry/Subscriber credit
          domain, not the invoice domain.
        test_recipe:
          setup:
            - "RES plan (credit_rate 10), route MON max_stops 5, four clean BIN_35L bins (20 kg nominal)"
            - "subscribers A and B each with an ACTIVE subscription on the route"
            - "week 2026-06-01 (SUMMER, multiplier 1.2): pickup A completed at fullness 0.5 (est 10.00 kg, credit 120), pickup B at 0.75 (est 15.00 kg, credit 180)"
            - "weigh ticket posted with net 20.00 kg (gross 25.00, tare 5.00)"
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscribers", payload: { email: "b@x.com", full_name: "Sub B", subscriber_type: "RESIDENTIAL", address: "2 B St" }, as: Anonymous, captures: { sub_b: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_b}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_b: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-01" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_a}" }, as: OperationsManager, captures: { pk_a: "$.data[0].id" } }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_b}" }, as: OperationsManager, captures: { pk_b: "$.data[0].id" } }
            - { call: "POST /pickups/${pk_a}/complete", payload: { fullness_pct: 0.5 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /pickups/${pk_b}/complete", payload: { fullness_pct: 0.75 }, as: Driver, as_user_id: "drv-1" }
          trigger:
            - { call: "POST /routes/${route1}/weigh-tickets", payload: { service_date: "2026-06-01", gross_kg: 25.0, tare_kg: 5.0 }, as: Driver, as_user_id: "drv-1", captures: { ticket: $.data.id } }
          assert:
            - "PickupEvent.${pk_a}.estimated_kg == 10.0 and final_kg == 8.0 (20 x 10/25) — same pickup, two variants diverge"
            - "PickupEvent.${pk_b}.estimated_kg == 15.0 and final_kg == 12.0 (20 x 15/25)"
            - "CompostCreditEntry for ${pk_a} has EARNED_FINAL_ADJUSTMENT amount_cents == -24 (final 96 - estimated 120)"
            - "CompostCreditEntry for ${pk_b} has EARNED_FINAL_ADJUSTMENT amount_cents == -36 (final 144 - estimated 180)"
            - "Subscriber.${sub_a}.credit_balance_cents == 96 and Subscriber.${sub_b}.credit_balance_cents == 144"

      - name: invoice_amount_residential_flat_vs_commercial_metered
        grounds:
          - calculations.weekly_invoice_amount
          - calculations.credit_application_order
        distinguishing_aspect: |
          Identical weekly activity (one COMPLETED pickup) bills 1200 flat for a
          RESIDENTIAL subscription but 3000 metered base (zero overage at 30 kg
          <= 40 included) for a COMMERCIAL subscription — the dual variant lives
          in the Invoice domain, a different entity domain from the credit ledger.
        test_recipe:
          setup:
            - "RES plan (weekly 1200, credit_rate 10) on route R1; COM plan (base 3000, per-kg 7, included 40, credit_rate 5) on route R2; both MON, max_stops 5"
            - "bins: two BIN_35L (20 kg), two BIN_240L (60 kg)"
            - "RES subscriber S1 on R1, COM subscriber S2 on R2; week 2026-05-04 (SPRING, multiplier 1.0)"
            - "S1 pickup completed at 0.5 (est 10.00 kg, credit 100); S2 pickup completed at 0.5 (est 30.00 kg, credit 150); R2 weighed net 30.00 -> final 30.00, delta 0"
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /service-plans", payload: { code: "COM", name: "Commercial", subscriber_type: "COMMERCIAL", bin_type: "BIN_240L", included_bins: 1, weekly_price_cents: 0, metered_base_cents: 3000, per_kg_rate_cents: 7, included_kg_per_week: 40, credit_rate_cents_per_kg: 5, skip_allowance_per_quarter: 4 }, as: OperationsManager, captures: { plan_com: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /routes", payload: { code: "R2", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route2: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /bins", payload: { bin_type: "BIN_240L", nominal_capacity_kg: 60 }, as: OperationsManager }
            - { call: "POST /bins", payload: { bin_type: "BIN_240L", nominal_capacity_kg: 60 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "r@x.com", full_name: "Res Sub", subscriber_type: "RESIDENTIAL", address: "1 R St" }, as: Anonymous, captures: { sub_r: $.data.id } }
            - { call: "POST /subscribers", payload: { email: "c@x.com", full_name: "Com Sub", subscriber_type: "COMMERCIAL", address: "2 C St" }, as: Anonymous, captures: { sub_c: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_r}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_r: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_c}", plan_id: "${plan_com}", route_id: "${route2}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_c: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-05-04" }, as: OperationsManager }
            - { call: "POST /routes/${route2}/generate-stops", payload: { service_date: "2026-05-04" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_r}" }, as: OperationsManager, captures: { pk_r: "$.data[0].id" } }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_c}" }, as: OperationsManager, captures: { pk_c: "$.data[0].id" } }
            - { call: "POST /pickups/${pk_r}/complete", payload: { fullness_pct: 0.5 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /pickups/${pk_c}/complete", payload: { fullness_pct: 0.5 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /routes/${route2}/weigh-tickets", payload: { service_date: "2026-05-04", gross_kg: 35.0, tare_kg: 5.0 }, as: Driver, as_user_id: "drv-1" }
          trigger:
            - { call: "POST /billing/run", payload: { week_start_date: "2026-05-04" }, as: OperationsManager }
            - { call: "GET /invoices", payload: { subscriber_id: "${sub_r}" }, as: OperationsManager, captures: { inv_r: "$.data[0].id" } }
            - { call: "GET /invoices", payload: { subscriber_id: "${sub_c}" }, as: OperationsManager, captures: { inv_c: "$.data[0].id" } }
          assert:
            - "Invoice.${inv_r}.subtotal_cents == 1200 (flat; kilograms irrelevant), credit_applied_cents == 100, total_cents == 1100"
            - "Invoice.${inv_c}.subtotal_cents == 3000 (metered base; overage 0 at 30 kg <= 40), credit_applied_cents == 150, total_cents == 2850"
            - "Invoice.${inv_r}.due_date == 2026-05-18 and Invoice.${inv_r}.status == ISSUED"

  # ------------------------------------------------------------------ Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: contamination_surcharge_severity_type_strike_interaction
        grounds:
          - calculations.contamination_surcharge_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — severity base x
          subscriber-type multiplier x strike escalator min(strike_count_before, 3);
          the same HIGH severity costs 4500 at strike_before 1 but would cost
          3000 at strike_before 0, so confirmation order changes the number.
        test_recipe:
          setup:
            - "COM plan (type multiplier 2.0), route MON, two clean BIN_240L bins"
            - "one COM subscriber with ACTIVE subscription; weeks 2026-06-01 and 2026-06-08 generated"
            - "pickup P1 tagged LOW and confirmed (strike 0 -> 1): surcharge 500 x 2.0 x 1.0 = 1000"
            - "pickup P2 tagged HIGH and confirmed (strike 1 -> 2): surcharge 1500 x 2.0 x 1.5 = 4500"
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "COM", name: "Commercial", subscriber_type: "COMMERCIAL", bin_type: "BIN_240L", included_bins: 1, weekly_price_cents: 0, metered_base_cents: 3000, per_kg_rate_cents: 7, included_kg_per_week: 40, credit_rate_cents_per_kg: 5, skip_allowance_per_quarter: 4 }, as: OperationsManager, captures: { plan_com: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_240L", nominal_capacity_kg: 60 }, as: OperationsManager }
            - { call: "POST /bins", payload: { bin_type: "BIN_240L", nominal_capacity_kg: 60 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "c@x.com", full_name: "Com Sub", subscriber_type: "COMMERCIAL", address: "2 C St" }, as: Anonymous, captures: { sub_c: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_c}", plan_id: "${plan_com}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_c: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-01" }, as: OperationsManager }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-08" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_c}" }, as: OperationsManager, captures: { pk1: "$.data[0].id", pk2: "$.data[1].id" } }
            - { call: "POST /pickups/${pk1}/contamination-tags", payload: { severity: "LOW", category: "PLASTIC" }, as: Driver, as_user_id: "drv-1", captures: { tag1: $.data.id } }
            - { call: "POST /contamination-tags/${tag1}/confirm", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /pickups/${pk2}/contamination-tags", payload: { severity: "HIGH", category: "LIQUIDS" }, as: Driver, as_user_id: "drv-1", captures: { tag2: $.data.id } }
          trigger:
            - { call: "POST /contamination-tags/${tag2}/confirm", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
          assert:
            - "ContaminationTag.${tag1}.surcharge_cents == 1000 (500 x 2.0 x (1 + 0.5 x 0))"
            - "ContaminationTag.${tag2}.surcharge_cents == 4500 (1500 x 2.0 x (1 + 0.5 x 1))"
            - "Subscription.${subs_c}.strike_count == 2 and service_status == ACTIVE (below threshold 3)"

      - name: commercial_invoice_per_line_rounding_then_sum
        grounds:
          - calculations.weekly_invoice_amount
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — two OVERAGE_KG lines of
          7.35 raw cents each must be rounded per line (7 + 7 = 14) before
          summing; sum-then-round would give round(14.70) = 15 and a subtotal of
          6015 instead of the pinned 6014.
        test_recipe:
          setup:
            - "COM plan (base 3000, per-kg 7, included 40, credit_rate 5) on routes R1 and R2; four BIN_240L bins"
            - "one COM subscriber holding TWO subscriptions, one per route; week 2026-06-08 (SUMMER, multiplier 1.2)"
            - "both pickups completed at fullness 0.7 (est 42.00 kg; est credit round(42 x 5 x 1.2) = 252 each)"
            - "both routes weighed at net 41.05 kg (gross 50.00, tare 8.95) -> final 41.05 kg each; final credit round(41.05 x 5 x 1.2) = 246 each; balance 492"
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "COM", name: "Commercial", subscriber_type: "COMMERCIAL", bin_type: "BIN_240L", included_bins: 1, weekly_price_cents: 0, metered_base_cents: 3000, per_kg_rate_cents: 7, included_kg_per_week: 40, credit_rate_cents_per_kg: 5, skip_allowance_per_quarter: 4 }, as: OperationsManager, captures: { plan_com: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /routes", payload: { code: "R2", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route2: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_240L", nominal_capacity_kg: 60 }, as: OperationsManager }
            - { call: "POST /bins", payload: { bin_type: "BIN_240L", nominal_capacity_kg: 60 }, as: OperationsManager }
            - { call: "POST /bins", payload: { bin_type: "BIN_240L", nominal_capacity_kg: 60 }, as: OperationsManager }
            - { call: "POST /bins", payload: { bin_type: "BIN_240L", nominal_capacity_kg: 60 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "c@x.com", full_name: "Com Sub", subscriber_type: "COMMERCIAL", address: "2 C St" }, as: Anonymous, captures: { sub_c: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_c}", plan_id: "${plan_com}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs1: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_c}", plan_id: "${plan_com}", route_id: "${route2}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs2: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-08" }, as: OperationsManager }
            - { call: "POST /routes/${route2}/generate-stops", payload: { service_date: "2026-06-08" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs1}" }, as: OperationsManager, captures: { pk1: "$.data[0].id" } }
            - { call: "GET /pickups", payload: { subscription_id: "${subs2}" }, as: OperationsManager, captures: { pk2: "$.data[0].id" } }
            - { call: "POST /pickups/${pk1}/complete", payload: { fullness_pct: 0.7 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /pickups/${pk2}/complete", payload: { fullness_pct: 0.7 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /routes/${route1}/weigh-tickets", payload: { service_date: "2026-06-08", gross_kg: 50.0, tare_kg: 8.95 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /routes/${route2}/weigh-tickets", payload: { service_date: "2026-06-08", gross_kg: 50.0, tare_kg: 8.95 }, as: Driver, as_user_id: "drv-1" }
          trigger:
            - { call: "POST /billing/run", payload: { week_start_date: "2026-06-08" }, as: OperationsManager }
            - { call: "GET /invoices", payload: { subscriber_id: "${sub_c}" }, as: OperationsManager, captures: { inv_c: "$.data[0].id" } }
          assert:
            - "Invoice.${inv_c} has two METERED_BASE lines of 3000 and two OVERAGE_KG lines of 7 each (round_half_up(7 x 1.05) per line)"
            - "Invoice.${inv_c}.subtotal_cents == 6014 (NOT 6015 — per-line rounding pinned over sum-then-round)"
            - "Invoice.${inv_c}.credit_applied_cents == 492 (min(492, floor(0.5 x 6014) = 3007)) and total_cents == 5522"

  # ------------------------------------------------------------------ Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_pause_resume_cycle
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - state_machines.Subscription.PAUSED_to_ACTIVE
        distinguishing_aspect: |
          Subscription is cyclic (ACTIVE -> PAUSED -> ACTIVE -> PAUSED), not a
          linear pipeline: after two full pause/resume loops the entity accepts a
          third pause, and stop generation is gated by the current loop position.
        test_recipe:
          setup:
            - "RES plan, route MON max_stops 5, two clean BIN_35L bins, one subscriber with ACTIVE subscription"
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /subscriptions/${subs_a}/pause", payload: { pause_start: "2026-06-01", pause_end: "2026-06-08" }, as: OperationsManager }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-01" }, as: OperationsManager, captures: { gen_paused: $.data.created_count } }
            - { call: "POST /subscriptions/${subs_a}/resume", payload: {}, as: OperationsManager }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-01" }, as: OperationsManager, captures: { gen_active: $.data.created_count } }
          trigger:
            - { call: "POST /subscriptions/${subs_a}/pause", payload: { pause_start: "2026-07-06", pause_end: "2026-07-13" }, as: OperationsManager }
          assert:
            - "first generate while PAUSED returned created_count == 0"
            - "second generate after resume returned created_count == 1 and the pickup is SCHEDULED"
            - "after the second loop's pause, Subscription.${subs_a}.service_status == PAUSED and pause_windows has 2 entries"

      - name: bin_parallel_status_condition_dimensions
        grounds:
          - state_machines.Bin
          - calculations.estimated_diversion_credit
        distinguishing_aspect: |
          Bin carries two independent state dimensions (status x condition): the
          swap forces AT_CUSTOMER -> IN_DEPOT AND CLEAN -> NEEDS_WASH atomically,
          while wash flips only condition — the depot selector keys on BOTH
          dimensions, so a dirty depot bin cannot be swapped out.
        test_recipe:
          setup:
            - "RES plan, route MON, exactly two BIN_35L bins B1 (created first) and B2; subscription auto-assigns B1"
            - "week 2026-06-01 completed (swap: B1 -> IN_DEPOT/NEEDS_WASH, B2 -> AT_CUSTOMER/CLEAN)"
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager, captures: { bin1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager, captures: { bin2: $.data.id } }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-01" }, as: OperationsManager }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-08" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_a}" }, as: OperationsManager, captures: { pk1: "$.data[0].id", pk2: "$.data[1].id" } }
            - { call: "POST /pickups/${pk1}/complete", payload: { fullness_pct: 0.5 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /pickups/${pk2}/complete", payload: { fullness_pct: 0.5 }, as: Driver, as_user_id: "drv-1", captures: { fail_no_bin: $.data.error_id } }
            - { call: "POST /bins/${bin1}/wash", payload: {}, as: OperationsManager }
          trigger:
            - { call: "POST /pickups/${pk2}/complete", payload: { fullness_pct: 0.5 }, as: Driver, as_user_id: "drv-1" }
          assert:
            - "after first complete: Bin.${bin1}.status == IN_DEPOT and condition == NEEDS_WASH; Bin.${bin2}.status == AT_CUSTOMER and condition == CLEAN"
            - "second complete before wash failed with ERR_NO_BIN_AVAILABLE and PickupEvent.${pk2}.status stayed SCHEDULED (atomic)"
            - "after wash: Bin.${bin1}.condition == CLEAN while status stayed IN_DEPOT (dimensions independent)"
            - "final complete succeeds: Bin.${bin1}.status == AT_CUSTOMER, Bin.${bin2}.status == IN_DEPOT and condition == NEEDS_WASH"

  # ------------------------------------------------------------------ Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: weigh_ticket_cascade_finalizes_pickups_entries_balances
        grounds:
          - state_machines.PickupEvent
          - calculations.weighed_allocation
        distinguishing_aspect: |
          Depth-3 chain from POST /routes/{id}/weigh-tickets: ticket creation
          mutates PickupEvent.final_kg (hop 1); that allocation itself triggers
          EARNED_FINAL_ADJUSTMENT CompostCreditEntry creation (hop 2); each new
          entry triggers Subscriber.credit_balance_cents recomputation (hop 3).
          Different trigger than the tag-confirm cascade.
        test_recipe:
          setup:
            - "RES plan (credit_rate 10), route MON, two BIN_35L bins, one ACTIVE subscription"
            - "week 2026-06-01 (SUMMER x1.2): pickup completed at 0.5 -> est 10.00 kg, EARNED_ESTIMATED +120, balance 120"
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-01" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_a}" }, as: OperationsManager, captures: { pk1: "$.data[0].id" } }
            - { call: "POST /pickups/${pk1}/complete", payload: { fullness_pct: 0.5 }, as: Driver, as_user_id: "drv-1" }
          trigger:
            - { call: "POST /routes/${route1}/weigh-tickets", payload: { service_date: "2026-06-01", gross_kg: 17.0, tare_kg: 5.0 }, as: Driver, as_user_id: "drv-1" }
          assert:
            - "hop 1: PickupEvent.${pk1}.final_kg == 12.0 (single pickup receives the whole net 17 - 5)"
            - "hop 2: a CompostCreditEntry EARNED_FINAL_ADJUSTMENT with pickup_id == ${pk1} and amount_cents == +24 exists (round(12 x 10 x 1.2) - 120)"
            - "hop 3: Subscriber.${sub_a}.credit_balance_cents == 144 (120 + 24), equal to the signed sum of its ledger entries"

      - name: tag_confirm_cascade_suspends_subscription_and_cancels_pickups
        grounds:
          - state_machines.ContaminationTag.TAGGED_to_CONFIRMED
          - state_machines.Subscription.ACTIVE_to_SUSPENDED
          - state_machines.PickupEvent
        distinguishing_aspect: |
          Depth-3 chain from POST /contamination-tags/{id}/confirm: confirm
          mutates Subscription.strike_count (hop 1); the counter crossing 3
          itself triggers Subscription ACTIVE -> SUSPENDED (hop 2); the
          suspension mutates every remaining SCHEDULED PickupEvent to
          CANCELLED_SYSTEM (hop 3). Different trigger than the weigh-ticket cascade.
        test_recipe:
          setup:
            - "RES plan, route MON, one ACTIVE subscription; weeks 2026-06-01/08/15/22 all generated while ACTIVE (P1..P4)"
            - "P1 and P2 tagged LOW and confirmed (strike_count 2, surcharges 500 and 750 residential)"
            - "P3 tagged LOW, still TAGGED; P4 untouched SCHEDULED"
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-01" }, as: OperationsManager }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-08" }, as: OperationsManager }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-15" }, as: OperationsManager }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-22" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_a}" }, as: OperationsManager, captures: { pk1: "$.data[0].id", pk2: "$.data[1].id", pk3: "$.data[2].id", pk4: "$.data[3].id" } }
            - { call: "POST /pickups/${pk1}/contamination-tags", payload: { severity: "LOW", category: "PLASTIC" }, as: Driver, as_user_id: "drv-1", captures: { tag1: $.data.id } }
            - { call: "POST /contamination-tags/${tag1}/confirm", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /pickups/${pk2}/contamination-tags", payload: { severity: "LOW", category: "GLASS" }, as: Driver, as_user_id: "drv-1", captures: { tag2: $.data.id } }
            - { call: "POST /contamination-tags/${tag2}/confirm", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /pickups/${pk3}/contamination-tags", payload: { severity: "LOW", category: "METAL" }, as: Driver, as_user_id: "drv-1", captures: { tag3: $.data.id } }
          trigger:
            - { call: "POST /contamination-tags/${tag3}/confirm", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
          assert:
            - "hop 1: Subscription.${subs_a}.strike_count == 3"
            - "hop 2: Subscription.${subs_a}.service_status == SUSPENDED"
            - "hop 3: PickupEvent.${pk4}.status == CANCELLED_SYSTEM (suspension cancelled the untouched future stop)"
            - "ContaminationTag.${tag3}.surcharge_cents == 1000 (500 x 1.0 x (1 + 0.5 x 2))"

  # ------------------------------------------------------------------ Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: skip_terminal_pickup_with_exhausted_allowance_state_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - state_machines.PickupEvent.SCHEDULED_to_SKIPPED
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: the skip request violates
          both ERR_PICKUP_NOT_ACTIONABLE (pickup MISSED) and
          ERR_SKIP_LIMIT_EXCEEDED (allowance 2/2 consumed); priority 6 state must
          win over priority 8 fiscal.
        test_recipe:
          setup:
            - "RES plan (skip_allowance 2), route MON, one ACTIVE subscription; weeks 2026-06-01/08/15 generated"
            - "P1 and P2 skipped by the subscriber (allowance exhausted: 2/2 in 2026-Q2); P3 marked MISSED by driver"
            - "logical clock is the default 2026-05-01, so the 48h cutoff is NOT the failing rule"
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-01" }, as: OperationsManager }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-08" }, as: OperationsManager }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-15" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_a}" }, as: OperationsManager, captures: { pk1: "$.data[0].id", pk2: "$.data[1].id", pk3: "$.data[2].id" } }
            - { call: "POST /pickups/${pk1}/skip", payload: {}, as: Subscriber, as_user_id: "${sub_a}" }
            - { call: "POST /pickups/${pk2}/skip", payload: {}, as: Subscriber, as_user_id: "${sub_a}" }
            - { call: "POST /pickups/${pk3}/miss", payload: {}, as: Driver, as_user_id: "drv-1" }
          trigger:
            - { call: "POST /pickups/${pk3}/skip", payload: {}, as: Subscriber, as_user_id: "${sub_a}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PICKUP_NOT_ACTIONABLE (state, priority 6) — never ERR_SKIP_LIMIT_EXCEEDED (fiscal, priority 8)"
            - "Subscription.${subs_a}.skips_used_this_quarter remains 2"

      - name: pause_while_delinquent_with_overlapping_window_fiscal_beats_temporal
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - state_machines.Subscription.ACTIVE_to_PAUSED
        distinguishing_aspect: |
          Error-category pair business_fiscal vs business_temporal: the pause
          request violates both ERR_ACCOUNT_DELINQUENT (overdue invoice) and
          ERR_PAUSE_WINDOW_OVERLAP (window intersects a recorded one); priority 8
          fiscal must win over priority 10 temporal.
        test_recipe:
          setup:
            - "RES plan, route MON, one ACTIVE subscription; week 2026-05-04 pickup COMPLETED (credit +100, balance 100)"
            - "billing run 2026-05-04 issued invoice (subtotal 1200, applied 100, total 1100, due 2026-05-18, unpaid)"
            - "while still GOOD_STANDING: pause [2026-06-01, 2026-06-08) then resume (window recorded)"
            - "clock advanced to 2026-05-20 -> account_standing DELINQUENT"
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-05-04" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_a}" }, as: OperationsManager, captures: { pk1: "$.data[0].id" } }
            - { call: "POST /pickups/${pk1}/complete", payload: { fullness_pct: 0.5 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /billing/run", payload: { week_start_date: "2026-05-04" }, as: OperationsManager }
            - { call: "POST /subscriptions/${subs_a}/pause", payload: { pause_start: "2026-06-01", pause_end: "2026-06-08" }, as: OperationsManager }
            - { call: "POST /subscriptions/${subs_a}/resume", payload: {}, as: OperationsManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: OperationsManager }
          trigger:
            - { call: "POST /subscriptions/${subs_a}/pause", payload: { pause_start: "2026-06-05", pause_end: "2026-06-12" }, as: OperationsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ACCOUNT_DELINQUENT (fiscal, priority 8) — never ERR_PAUSE_WINDOW_OVERLAP (temporal, priority 10)"
            - "Subscription.${subs_a}.service_status remains ACTIVE and pause_windows still has exactly 1 entry"

  # ------------------------------------------------------------------ Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: skip_cutoff_exactly_at_48h_rejected
        grounds:
          - state_machines.PickupEvent.SCHEDULED_to_SKIPPED
          - calculations.skip_allowance
        distinguishing_aspect: |
          Time metric boundary on POST /pickups/{id}/skip: skip requires logical
          now strictly before service_date 00:00Z minus 48h; at exactly the
          cutoff instant (T-48h) the request is rejected, one minute earlier it
          succeeds — a strict < comparison, not <=.
        test_recipe:
          setup:
            - "RES plan (allowance 2), route MON, one ACTIVE subscription; week 2026-06-15 generated (P1 SCHEDULED)"
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-15" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_a}" }, as: OperationsManager, captures: { pk1: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-13T00:00:00Z" }, as: OperationsManager }
          trigger:
            - { call: "POST /pickups/${pk1}/skip", payload: {}, as: Subscriber, as_user_id: "${sub_a}", captures: { err_at: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-12T23:59:00Z" }, as: OperationsManager }
            - { call: "POST /pickups/${pk1}/skip", payload: {}, as: Subscriber, as_user_id: "${sub_a}" }
          assert:
            - "at exactly 2026-06-13T00:00:00Z (service_date minus exactly 48h): ERR_SKIP_CUTOFF_PASSED"
            - "at 2026-06-12T23:59:00Z (one minute inside the window): skip succeeds, PickupEvent.${pk1}.status == SKIPPED"
            - "Subscription.${subs_a}.skips_used_this_quarter == 1"

      - name: redemption_at_exact_stock_boundary
        grounds:
          - calculations.compost_stock
          - state_machines.CreditRedemption
        distinguishing_aspect: |
          Inventory metric boundary on POST /credit-redemptions (a different
          endpoint and metric than the skip cutoff): a request whose total_kg
          exactly equals available_kg is allowed (inclusive <=), while one more
          bag past it is rejected with ERR_INSUFFICIENT_STOCK.
        test_recipe:
          setup:
            - "RES plan, route MON, two BIN_35L bins, one ACTIVE subscription"
            - "week 2026-06-01 completed at 0.5 (est 10.00 kg, credit 120); weigh ticket net 100.00 -> final 100.00 kg, adjustment +1080, balance 1200"
            - "ops manual adjustment +5000 -> balance 6200; compost stock produced = 0.3 x 100 = 30.00 kg"
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-01" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_a}" }, as: OperationsManager, captures: { pk1: "$.data[0].id" } }
            - { call: "POST /pickups/${pk1}/complete", payload: { fullness_pct: 0.5 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /routes/${route1}/weigh-tickets", payload: { service_date: "2026-06-01", gross_kg: 110.0, tare_kg: 10.0 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /subscribers/${sub_a}/credit-adjustments", payload: { amount_cents: 5000, reason: "promo" }, as: OperationsManager }
          trigger:
            - { call: "POST /credit-redemptions", payload: { subscriber_id: "${sub_a}", bags: 3 }, as: Subscriber, as_user_id: "${sub_a}", captures: { red1: $.data.id } }
            - { call: "POST /credit-redemptions", payload: { subscriber_id: "${sub_a}", bags: 1 }, as: Subscriber, as_user_id: "${sub_a}", captures: { err: $.data.error_id } }
          assert:
            - "first redemption (30.00 kg == available 30.00 kg exactly) succeeds: CreditRedemption.${red1}.status == REQUESTED, total_kg == 30.0, total_cents == 1500"
            - "second redemption rejected with ERR_INSUFFICIENT_STOCK (reserved stock counts at create)"
            - "GET /compost-stock shows produced_kg == 30.0, reserved_kg == 30.0, available_kg == 0.0"

  # ------------------------------------------------------------------ Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: pickup_skip_requires_subscription_active
        grounds:
          - state_machines.PickupEvent.SCHEDULED_to_SKIPPED
          - state_machines.Subscription.ACTIVE_to_PAUSED
        distinguishing_aspect: |
          Pair PickupEvent -> Subscription: a SCHEDULED pickup cannot be skipped
          while its subscription is PAUSED, even though the pickup's own state is
          a valid from-state — the gate lives on a different entity.
        test_recipe:
          setup:
            - "RES plan, route MON, one subscription; week 2026-06-01 generated (P1 SCHEDULED)"
            - "subscription paused over [2026-07-06, 2026-07-13) which does NOT cover 2026-06-01, so P1 stays SCHEDULED"
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-01" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_a}" }, as: OperationsManager, captures: { pk1: "$.data[0].id" } }
            - { call: "POST /subscriptions/${subs_a}/pause", payload: { pause_start: "2026-07-06", pause_end: "2026-07-13" }, as: OperationsManager }
          trigger:
            - { call: "POST /pickups/${pk1}/skip", payload: {}, as: Subscriber, as_user_id: "${sub_a}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SUBSCRIPTION_NOT_ACTIVE"
            - "PickupEvent.${pk1}.status remains SCHEDULED and skips_used_this_quarter remains 0"

      - name: subscription_resume_requires_good_standing
        grounds:
          - state_machines.Subscription.PAUSED_to_ACTIVE
          - calculations.account_standing
        distinguishing_aspect: |
          Pair Subscription -> Subscriber (different pair than PickupEvent ->
          Subscription): resume is a legal from-state transition (PAUSED) yet is
          rejected because a different entity, the Subscriber, is DELINQUENT.
        test_recipe:
          setup:
            - "RES plan, route MON, two bins, one subscription; week 2026-05-04 completed (credit +100)"
            - "billing run issued invoice due 2026-05-18; subscription paused (while GOOD_STANDING) over [2026-06-01, 2026-06-08)"
            - "clock advanced to 2026-05-20 -> subscriber DELINQUENT"
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-05-04" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_a}" }, as: OperationsManager, captures: { pk1: "$.data[0].id" } }
            - { call: "POST /pickups/${pk1}/complete", payload: { fullness_pct: 0.5 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /billing/run", payload: { week_start_date: "2026-05-04" }, as: OperationsManager }
            - { call: "POST /subscriptions/${subs_a}/pause", payload: { pause_start: "2026-06-01", pause_end: "2026-06-08" }, as: OperationsManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: OperationsManager }
          trigger:
            - { call: "POST /subscriptions/${subs_a}/resume", payload: {}, as: OperationsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ACCOUNT_DELINQUENT"
            - "Subscription.${subs_a}.service_status remains PAUSED"

  # ------------------------------------------------------------------ Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: pause_windows_half_open_adjacency
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - validations[priority=10]
        distinguishing_aspect: |
          Half-open interval semantics on the Subscription timeline resource:
          [2026-06-01, 2026-06-08) and [2026-06-08, 2026-06-15) touch but do not
          overlap (adjacent is allowed), while [2026-06-07, 2026-06-14)
          intersects the first window and is rejected.
        test_recipe:
          setup:
            - "RES plan, route MON, one ACTIVE subscription, subscriber GOOD_STANDING (no invoices)"
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /subscriptions/${subs_a}/pause", payload: { pause_start: "2026-06-01", pause_end: "2026-06-08" }, as: OperationsManager }
            - { call: "POST /subscriptions/${subs_a}/resume", payload: {}, as: OperationsManager }
          trigger:
            - { call: "POST /subscriptions/${subs_a}/pause", payload: { pause_start: "2026-06-08", pause_end: "2026-06-15" }, as: OperationsManager }
            - { call: "POST /subscriptions/${subs_a}/resume", payload: {}, as: OperationsManager }
            - { call: "POST /subscriptions/${subs_a}/pause", payload: { pause_start: "2026-06-07", pause_end: "2026-06-14" }, as: OperationsManager, captures: { err: $.data.error_id } }
          assert:
            - "adjacent pause [2026-06-08, 2026-06-15) succeeded (half-open: start == prior end is not an overlap)"
            - "overlapping pause [2026-06-07, 2026-06-14) rejected with ERR_PAUSE_WINDOW_OVERLAP"
            - "Subscription.${subs_a}.pause_windows has exactly 2 entries"

      - name: route_capacity_aggregate_weekly_slot
        grounds:
          - entities.Route.fields.active_subscriptions_count
          - validations[priority=9]
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on the Route resource (different
          from half-open adjacency): every ACTIVE subscription occupies the
          recurring weekly slot from its start_date until cancel, so a route
          with max_stops 1 rejects the second concurrent subscription with
          ERR_ROUTE_CAPACITY but accepts it again after the first is cancelled.
        test_recipe:
          setup:
            - "RES plan, route MON max_stops 1, two clean BIN_35L bins, subscribers A and B"
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 1 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscribers", payload: { email: "b@x.com", full_name: "Sub B", subscriber_type: "RESIDENTIAL", address: "2 B St" }, as: Anonymous, captures: { sub_b: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
          trigger:
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_b}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { err: $.data.error_id } }
            - { call: "POST /subscriptions/${subs_a}/cancel", payload: {}, as: OperationsManager }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_b}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_b: $.data.id } }
          assert:
            - "second subscription while slot occupied: ERR_ROUTE_CAPACITY"
            - "after cancelling A's subscription the identical create succeeds: Subscription.${subs_b}.service_status == ACTIVE"
            - "A's returned bin is IN_DEPOT with condition NEEDS_WASH, so B's assignment consumed the second clean bin"

  # ------------------------------------------------------------------ Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: complete_then_void_nets_credit_balance_to_zero_drift
        grounds:
          - state_machines.PickupEvent.SCHEDULED_to_COMPLETED
          - state_machines.PickupEvent.COMPLETED_to_VOIDED
          - calculations.estimated_diversion_credit
        distinguishing_aspect: |
          Conserved quantity: subscriber credit cents. Forward action complete
          (+120 EARNED_ESTIMATED) paired with its compensation void (REVERSAL
          -120) leaves credit_balance_cents identical to before the pair, and the
          signed ledger sum invariant sum(amount_cents) == balance holds.
        test_recipe:
          setup:
            - "RES plan (rate 10), route MON, two BIN_35L bins, one ACTIVE subscription; week 2026-06-01 (SUMMER x1.2) generated"
            - "no weigh ticket posted (void remains legal)"
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-01" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_a}" }, as: OperationsManager, captures: { pk1: "$.data[0].id" } }
          trigger:
            - { call: "POST /pickups/${pk1}/complete", payload: { fullness_pct: 0.5 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /pickups/${pk1}/void", payload: {}, as: OperationsManager }
          assert:
            - "after complete: Subscriber.${sub_a}.credit_balance_cents == 120 (round(10.00 x 10 x 1.2))"
            - "after void: Subscriber.${sub_a}.credit_balance_cents == 0 — exactly the pre-pair value"
            - "ledger for ${pk1}: EARNED_ESTIMATED +120 and REVERSAL -120; signed sum == 0 == balance"
            - "PickupEvent.${pk1}.status == VOIDED"

      - name: subscription_create_then_cancel_conserves_bin_fleet
        grounds:
          - state_machines.Bin
          - state_machines.Subscription.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: bin fleet cardinality by status (a count invariant,
          not a money invariant). Creating then cancelling a subscription moves
          one bin IN_DEPOT -> AT_CUSTOMER -> IN_DEPOT, leaving total fleet size
          and depot count exactly as before the pair.
        test_recipe:
          setup:
            - "RES plan (included_bins 1), route MON max_stops 5, three clean BIN_35L bins, one subscriber"
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager, captures: { bin1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
          trigger:
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /subscriptions/${subs_a}/cancel", payload: {}, as: OperationsManager }
          assert:
            - "before subscribe: GET /bins?status=IN_DEPOT total_count == 3; after subscribe: 2; after cancel: 3 again"
            - "GET /bins?status=AT_CUSTOMER total_count == 0 after cancel (fleet total 3 constant throughout)"
            - "Bin.${bin1}.condition == NEEDS_WASH after cancel (returned dirty) while status == IN_DEPOT"
