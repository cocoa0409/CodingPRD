        distinguishing_aspect: "PRIORITY PAIR B, loser in isolation. With an ACTIVE schedule present, priority 43 is satisfied and the fiscal row surfaces: four chargeable occurrences left 85000 cents outstanding, so step 6 of site_balance_rollup flipped the permit to RENEWAL_BLOCKED and the renewal is refused with 409."
        test_recipe:
          setup:
            - "The four-incident fixture (outstanding 85000 cents, renewal_block_active true), then the clock jumps to 2027-07-05T00:00:00Z with a nightly run so permit AP-000001 enters its renewal window and is flipped to RENEWAL_BLOCKED."
