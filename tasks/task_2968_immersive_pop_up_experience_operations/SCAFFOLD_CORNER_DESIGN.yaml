      - name: price_quote_previews_the_order_total_and_persists_nothing
        claim_type: computed_read
        grounds:
          - endpoints[GET /timed-entry-slots/{slotId}/price-quote]
          - calculations.slot_dynamic_price
          - calculations.ticket_order_total
        distinguishing_aspect: |
          The quote is a read that runs the whole write-path pricing chain on hypothetical input and
          stores nothing, so it is the one place where the two calculations can be observed apart
          from the row they normally write. Two properties collide here: the quote MOVES with the
          logical clock (lead_days is measured at request time), while an order's unit_price_cents
          is FROZEN at creation. An implementation that recomputes price on read of the order, or
          that quietly creates a draft order to produce the quote, fails one half or the other.
        test_recipe:
          setup:
            - "The LIGHT CHAIN through run creation, plus one themed room (room_occupancy_cap 40, target_dwell_minutes 15) so run.effective_capacity is 120, plus one released PEAK slot 2026-09-15T14:00:00Z..2026-09-15T14:45:00Z with base_capacity 20 and wheelchair_positions 2, plus one PATRON guest account."
