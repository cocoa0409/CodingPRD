            - call: "POST /repair-program/parts-orders/aaaaaaaa-5555-aaaa-5555-aaaaaaaaaaaa/core-returns"
              payload: { core_condition: "INTACT", received_at: "2026-08-01T00:00:00Z" }
              as: SelfRepairCustomer
