# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — task_0892
# Breadth probe over §1.1–§1.7 beyond the nine Difficulty Rules.
# =============================================================================
scaffold_corner_design:

  # ---------------- Entities ----------------
  - section: entities
    instances:
      - name: create_program_success_and_computed_budget_fields
        claim_type: Creation
        grounds: [entities.Program.fields.budget_available_cents, entities.Program.fields.status]
        distinguishing_aspect: "POST /compensation/programs returns 201 with status=OPEN, budget_committed_cents=0, budget_disbursed_cents=0, budget_available_cents == total_budget_cents."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /compensation/programs"
              payload: { name: "VS Fund", fiscal_year: 2026, total_budget_cents: 10000000, overall_case_cap_cents: 5000000, medical_cap_cents: 3000000, lost_wage_cap_cents: 2000000, funeral_cap_cents: 1000000, mental_health_cap_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /compensation/programs/${prog_id}"
              payload: {}
              as: ProgramAdmin
              captures: { st: $.data.status, avail: $.data.budget_available_cents, comm: $.data.budget_committed_cents, ver: $.data.version }
          assert:
            - "${st} == OPEN"
            - "${avail} == 10000000"
            - "${comm} == 0"
            - "${ver} == 1"

      - name: get_program_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [endpoints]
        distinguishing_aspect: "GET /compensation/programs/{unknown-uuid} returns 404 ERR_PROGRAM_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /compensation/programs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_PROGRAM_NOT_FOUND"

      - name: create_case_missing_required_victim_name_returns_validation
        claim_type: Required Fields
        grounds: [entities.VictimCase.fields.victim_name, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /compensation/cases without victim_name returns 400 ERR_VALIDATION."
        test_recipe:
          setup: ["OPEN program exists."]
          setup_api_calls:
            - call: "POST /compensation/programs"
              payload: { name: "VS Fund", fiscal_year: 2026, total_budget_cents: 10000000, overall_case_cap_cents: 5000000, medical_cap_cents: 3000000, lost_wage_cap_cents: 2000000, funeral_cap_cents: 1000000, mental_health_cap_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /compensation/cases"
              payload: { program_id: "${prog_id}", incident_date: "2026-01-01", crime_type: "ASSAULT", reported_to_le: true, filing_date: "2026-02-01" }
              as: IntakeCounselor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VALIDATION"

      - name: create_case_cooperation_status_defaults_pending
        claim_type: Defaults
        grounds: [entities.VictimCase.fields.cooperation_status]
        distinguishing_aspect: "Omitting cooperation_status on case create applies default PENDING."
        test_recipe:
          setup: ["OPEN program exists."]
          setup_api_calls:
            - call: "POST /compensation/programs"
              payload: { name: "VS Fund", fiscal_year: 2026, total_budget_cents: 10000000, overall_case_cap_cents: 5000000, medical_cap_cents: 3000000, lost_wage_cap_cents: 2000000, funeral_cap_cents: 1000000, mental_health_cap_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /compensation/cases"
              payload: { program_id: "${prog_id}", victim_name: "Jane Roe", incident_date: "2026-01-01", crime_type: "ASSAULT", reported_to_le: true, filing_date: "2026-02-01" }
              as: IntakeCounselor
              captures: { coop: $.data.cooperation_status, st: $.data.status }
          assert:
            - "${coop} == PENDING"
            - "${st} == DRAFT"

      - name: create_claim_invalid_enum_category_returns_validation
        claim_type: Type Constraints
        grounds: [entities.Claim.fields.category, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /compensation/claims with category=DENTAL (not in enum) returns 400 ERR_VALIDATION."
        test_recipe:
          setup: ["OPEN program; case exists."]
          setup_api_calls:
            - call: "POST /compensation/programs"
              payload: { name: "VS Fund", fiscal_year: 2026, total_budget_cents: 10000000, overall_case_cap_cents: 5000000, medical_cap_cents: 3000000, lost_wage_cap_cents: 2000000, funeral_cap_cents: 1000000, mental_health_cap_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /compensation/cases"
              payload: { program_id: "${prog_id}", victim_name: "Jane Roe", incident_date: "2026-01-01", crime_type: "ASSAULT", reported_to_le: true, cooperation_status: "COOPERATIVE", filing_date: "2026-02-01" }
              as: IntakeCounselor
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /compensation/claims"
              payload: { case_id: "${case_id}", category: "DENTAL", claimed_amount_cents: 100000 }
              as: IntakeCounselor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VALIDATION"

      - name: create_claim_nonexistent_case_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Claim.fields.case_id, "errors[ERR_CASE_NOT_FOUND]"]
        distinguishing_aspect: "POST /compensation/claims with a case_id that does not resolve returns 404 ERR_CASE_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /compensation/claims"
              payload: { case_id: "00000000-0000-4000-8000-000000000000", category: "MEDICAL", claimed_amount_cents: 100000 }
              as: IntakeCounselor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CASE_NOT_FOUND"

  # ---------------- State Machines ----------------
  - section: state_machines
    instances:
      - name: claim_submit_twice_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Claim.DRAFT_to_SUBMITTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second SUBMITTED on an already-SUBMITTED claim (from-state SUBMITTED not in transition list) returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["OPEN program; case; MEDICAL claim SUBMITTED once."]
          setup_api_calls:
            - call: "POST /compensation/programs"
              payload: { name: "VS Fund", fiscal_year: 2026, total_budget_cents: 10000000, overall_case_cap_cents: 5000000, medical_cap_cents: 3000000, lost_wage_cap_cents: 2000000, funeral_cap_cents: 1000000, mental_health_cap_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /compensation/cases"
              payload: { program_id: "${prog_id}", victim_name: "Jane Roe", incident_date: "2026-01-01", crime_type: "ASSAULT", reported_to_le: true, cooperation_status: "COOPERATIVE", filing_date: "2026-02-01" }
              as: IntakeCounselor
              captures: { case_id: $.data.id }
            - call: "POST /compensation/claims"
              payload: { case_id: "${case_id}", category: "MEDICAL", claimed_amount_cents: 500000 }
              as: IntakeCounselor
              captures: { claim_id: $.data.id }
            - call: "POST /compensation/claims/${claim_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
          trigger:
            - call: "POST /compensation/claims/${claim_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"

      - name: collateral_confirm_after_waived_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.CollateralSource.DECLARED_to_WAIVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "WAIVED is terminal; requesting CONFIRMED on a WAIVED collateral source returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["OPEN program; case; claim; collateral WAIVED."]
          setup_api_calls:
            - call: "POST /compensation/programs"
              payload: { name: "VS Fund", fiscal_year: 2026, total_budget_cents: 10000000, overall_case_cap_cents: 5000000, medical_cap_cents: 3000000, lost_wage_cap_cents: 2000000, funeral_cap_cents: 1000000, mental_health_cap_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /compensation/cases"
              payload: { program_id: "${prog_id}", victim_name: "Jane Roe", incident_date: "2026-01-01", crime_type: "ASSAULT", reported_to_le: true, cooperation_status: "COOPERATIVE", filing_date: "2026-02-01" }
              as: IntakeCounselor
              captures: { case_id: $.data.id }
            - call: "POST /compensation/claims"
              payload: { case_id: "${case_id}", category: "MEDICAL", claimed_amount_cents: 500000 }
              as: IntakeCounselor
              captures: { claim_id: $.data.id }
            - call: "POST /compensation/collateral-sources"
              payload: { claim_id: "${claim_id}", source_type: "AUTO_INSURANCE", amount_cents: 100000 }
              as: IntakeCounselor
              captures: { cs_id: $.data.id }
            - call: "POST /compensation/collateral-sources/${cs_id}/transition"
              payload: { to_status: "WAIVED" }
              as: Adjudicator
          trigger:
            - call: "POST /compensation/collateral-sources/${cs_id}/transition"
              payload: { to_status: "CONFIRMED" }
              as: Adjudicator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"

      - name: recovery_satisfied_when_fully_recovered
        claim_type: Valid Transition
        grounds: [state_machines.RestitutionRecovery.COLLECTING_to_SATISFIED, calculations.recovery_recovered]
        distinguishing_aspect: "Boundary: recovered_amount_cents (500,000) >= ordered_amount_cents (500,000) allows COLLECTING->SATISFIED; recovery ends in SATISFIED."
        test_recipe:
          setup: ["Program; case; recovery ordered=500,000 in COLLECTING with a RECORDED 500,000 receipt."]
          setup_api_calls:
            - call: "POST /compensation/programs"
              payload: { name: "VS Fund", fiscal_year: 2026, total_budget_cents: 10000000, overall_case_cap_cents: 5000000, medical_cap_cents: 3000000, lost_wage_cap_cents: 2000000, funeral_cap_cents: 1000000, mental_health_cap_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /compensation/cases"
              payload: { program_id: "${prog_id}", victim_name: "Jane Roe", incident_date: "2026-01-01", crime_type: "ASSAULT", reported_to_le: true, cooperation_status: "COOPERATIVE", filing_date: "2026-02-01" }
              as: IntakeCounselor
              captures: { case_id: $.data.id }
            - call: "POST /compensation/recoveries"
              payload: { case_id: "${case_id}", offender_name: "John Doe", ordered_amount_cents: 500000 }
              as: RecoveryOfficer
              captures: { rec_id: $.data.id }
            - call: "POST /compensation/recoveries/${rec_id}/transition"
              payload: { to_status: "COLLECTING" }
              as: RecoveryOfficer
            - call: "POST /compensation/recoveries/${rec_id}/receipts"
              payload: { amount_cents: 500000, received_date: "2026-05-05" }
              as: RecoveryOfficer
          trigger:
            - call: "POST /compensation/recoveries/${rec_id}/transition"
              payload: { to_status: "SATISFIED" }
              as: RecoveryOfficer
              captures: { st: $.data.status, recovered: $.data.recovered_amount_cents }
          assert:
            - "${st} == SATISFIED"
            - "${recovered} == 500000"

      - name: disbursement_pay_when_award_not_approved_excluded
        claim_type: Precondition Enforcement
        grounds: [state_machines.Disbursement.SCHEDULED_to_PAID]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / disbursement_requires_award_approved
          rationale: "The Award-approval gate on disbursement creation/payment is asserted by the named §1.8 instance."

  # ---------------- Calculations ----------------
  - section: calculations
    instances:
      - name: filing_deadline_past_365_days_rejected
        claim_type: Constants Applied
        grounds: [calculations.eligibility_filing_window, "errors[ERR_FILING_DEADLINE_PASSED]"]
        distinguishing_aspect: "incident 2026-01-01, filing 2027-01-02 = 366 days > FILING_DEADLINE_DAYS(365): setting ELIGIBLE returns 422 ERR_FILING_DEADLINE_PASSED (day 365 = 2027-01-01 would be timely)."
        test_recipe:
          setup: ["OPEN program; case reported_to_le=true, COOPERATIVE, filing 366 days after incident; case UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /compensation/programs"
              payload: { name: "VS Fund", fiscal_year: 2026, total_budget_cents: 10000000, overall_case_cap_cents: 5000000, medical_cap_cents: 3000000, lost_wage_cap_cents: 2000000, funeral_cap_cents: 1000000, mental_health_cap_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /compensation/cases"
              payload: { program_id: "${prog_id}", victim_name: "Jane Roe", incident_date: "2026-01-01", crime_type: "ASSAULT", reported_to_le: true, cooperation_status: "COOPERATIVE", filing_date: "2027-01-02" }
              as: IntakeCounselor
              captures: { case_id: $.data.id }
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
          trigger:
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: Adjudicator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FILING_DEADLINE_PASSED"

      - name: claim_provisional_offset_uses_declared_collateral_excluded
        claim_type: Variant Selection
        grounds: [calculations.claim_net]
        excluded_because:
          difficulty_instance: dual_variant_calc / claim_provisional_vs_final_net
          rationale: "Provisional-vs-final collateral variant selection is the core assertion of the named §1.8 instance."

  # ---------------- Validations ----------------
  - section: validations
    instances:
      - name: set_eligible_without_cooperation_returns_criteria_not_met
        claim_type: Violation → Error
        grounds: ["validations[priority=11]", "errors[ERR_ELIGIBILITY_CRITERIA_NOT_MET]"]
        distinguishing_aspect: "Case reported_to_le=true but cooperation_status=NONCOOPERATIVE: requesting ELIGIBLE returns 422 ERR_ELIGIBILITY_CRITERIA_NOT_MET."
        test_recipe:
          setup: ["OPEN program; case reported_to_le=true, NONCOOPERATIVE, filing timely; UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /compensation/programs"
              payload: { name: "VS Fund", fiscal_year: 2026, total_budget_cents: 10000000, overall_case_cap_cents: 5000000, medical_cap_cents: 3000000, lost_wage_cap_cents: 2000000, funeral_cap_cents: 1000000, mental_health_cap_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /compensation/cases"
              payload: { program_id: "${prog_id}", victim_name: "Jane Roe", incident_date: "2026-01-01", crime_type: "ASSAULT", reported_to_le: true, cooperation_status: "NONCOOPERATIVE", filing_date: "2026-02-01" }
              as: IntakeCounselor
              captures: { case_id: $.data.id }
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
          trigger:
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: Adjudicator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ELIGIBILITY_CRITERIA_NOT_MET"

      - name: disbursement_exceeds_award_net_rejected
        claim_type: Aggregate validation
        grounds: ["validations[priority=14]", "errors[ERR_DISBURSEMENT_EXCEEDS_AWARD]"]
        distinguishing_aspect: "Award net=1,000,000 already has a 700,000 SCHEDULED disbursement; a second 400,000 disbursement (700,000+400,000=1,100,000 > 1,000,000) returns 422 ERR_DISBURSEMENT_EXCEEDS_AWARD."
        test_recipe:
          setup: ["ELIGIBLE case, APPROVED claim net=1,000,000, Award APPROVED, one 700,000 disbursement SCHEDULED."]
          setup_api_calls:
            - call: "POST /compensation/programs"
              payload: { name: "VS Fund", fiscal_year: 2026, total_budget_cents: 10000000, overall_case_cap_cents: 5000000, medical_cap_cents: 3000000, lost_wage_cap_cents: 2000000, funeral_cap_cents: 1000000, mental_health_cap_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /compensation/cases"
              payload: { program_id: "${prog_id}", victim_name: "Jane Roe", incident_date: "2026-01-01", crime_type: "ASSAULT", reported_to_le: true, cooperation_status: "COOPERATIVE", filing_date: "2026-02-01" }
              as: IntakeCounselor
              captures: { case_id: $.data.id }
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: Adjudicator
            - call: "POST /compensation/claims"
              payload: { case_id: "${case_id}", category: "MEDICAL", claimed_amount_cents: 1000000 }
              as: IntakeCounselor
              captures: { claim_id: $.data.id }
            - call: "POST /compensation/claims/${claim_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/claims/${claim_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
            - call: "POST /compensation/claims/${claim_id}/transition"
              payload: { to_status: "APPROVED", verified_amount_cents: 1000000 }
              as: Adjudicator
            - call: "POST /compensation/awards"
              payload: { case_id: "${case_id}", expected_program_version: "${prog_v}" }
              as: Adjudicator
              captures: { award_id: $.data.id }
            - call: "POST /compensation/awards/${award_id}/transition"
              payload: { to_status: "APPROVED" }
              as: Adjudicator
            - call: "POST /compensation/disbursements"
              payload: { award_id: "${award_id}", payee_type: "VICTIM", amount_cents: 700000, pay_run_date: "2026-05-10" }
              as: FinanceOfficer
          trigger:
            - call: "POST /compensation/disbursements"
              payload: { award_id: "${award_id}", payee_type: "VICTIM", amount_cents: 400000, pay_run_date: "2026-05-11" }
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_DISBURSEMENT_EXCEEDS_AWARD"

  # ---------------- Endpoints ----------------
  - section: endpoints
    instances:
      - name: list_claims_by_case_paginated
        claim_type: Computed read
        grounds: [endpoints]
        distinguishing_aspect: "GET /compensation/claims?case_id=..&limit=2 over 3 claims returns an array of length 2 with response_type array (pagination fields present)."
        test_recipe:
          setup: ["OPEN program; case with 3 DRAFT MEDICAL claims."]
          setup_api_calls:
            - call: "POST /compensation/programs"
              payload: { name: "VS Fund", fiscal_year: 2026, total_budget_cents: 10000000, overall_case_cap_cents: 5000000, medical_cap_cents: 3000000, lost_wage_cap_cents: 2000000, funeral_cap_cents: 1000000, mental_health_cap_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /compensation/cases"
              payload: { program_id: "${prog_id}", victim_name: "Jane Roe", incident_date: "2026-01-01", crime_type: "ASSAULT", reported_to_le: true, cooperation_status: "COOPERATIVE", filing_date: "2026-02-01" }
              as: IntakeCounselor
              captures: { case_id: $.data.id }
            - call: "POST /compensation/claims"
              payload: { case_id: "${case_id}", category: "MEDICAL", claimed_amount_cents: 100000 }
              as: IntakeCounselor
            - call: "POST /compensation/claims"
              payload: { case_id: "${case_id}", category: "MEDICAL", claimed_amount_cents: 200000 }
              as: IntakeCounselor
            - call: "POST /compensation/claims"
              payload: { case_id: "${case_id}", category: "MEDICAL", claimed_amount_cents: 300000 }
              as: IntakeCounselor
          trigger:
            - call: "GET /compensation/claims?case_id=${case_id}&limit=2&offset=0"
              payload: {}
              as: Adjudicator
          assert:
            - "response_type == array"
            - "len(data) == 2"
            - "meta.total_count == 3 and has_more == true"

  # ---------------- Errors (mostly exercised by §1.8) ----------------
  - section: errors
    instances:
      - name: error_budget_exceeded_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_BUDGET_EXCEEDED]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / budget_exact_fill_allowed_over_by_one_rejected
          rationale: "ERR_BUDGET_EXCEEDED is asserted as the over-by-one failure of the named §1.8 boundary instance."
      - name: error_wage_period_overlap_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_WAGE_PERIOD_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / lost_wage_half_open_periods_adjacent_ok_overlap_rejected
          rationale: "ERR_WAGE_PERIOD_OVERLAP is the asserted failure of the named §1.8 overlap instance."
      - name: error_stale_version_excluded
        claim_type: violation_to_error
        grounds: ["concurrency_rules[award-create-stale-program]"]
        excluded_because:
          difficulty_instance: null
          rationale: "Covered by the cross_cutting instance occ_stale_program_version_on_award_create below (not a §1.8 instance)."

  # ---------------- RBAC ----------------
  - section: rbac
    instances:
      - name: finance_officer_cannot_create_program
        claim_type: peer_roles
        grounds: [roles, endpoints]
        distinguishing_aspect: "POST /compensation/programs by FinanceOfficer (not in endpoint roles) returns 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /compensation/programs"
              payload: { name: "Rogue", fiscal_year: 2026, total_budget_cents: 10000000, overall_case_cap_cents: 5000000, medical_cap_cents: 3000000, lost_wage_cap_cents: 2000000, funeral_cap_cents: 1000000, mental_health_cap_cents: 1000000 }
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHORIZED"

      - name: intake_counselor_cannot_determine_eligibility
        claim_type: approval_chain
        grounds: [roles, state_machines.VictimCase.UNDER_REVIEW_to_ELIGIBLE]
        distinguishing_aspect: "The ELIGIBLE determination is an Adjudicator-exclusive transition; IntakeCounselor requesting to_status=ELIGIBLE returns 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["OPEN program; case UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /compensation/programs"
              payload: { name: "VS Fund", fiscal_year: 2026, total_budget_cents: 10000000, overall_case_cap_cents: 5000000, medical_cap_cents: 3000000, lost_wage_cap_cents: 2000000, funeral_cap_cents: 1000000, mental_health_cap_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /compensation/cases"
              payload: { program_id: "${prog_id}", victim_name: "Jane Roe", incident_date: "2026-01-01", crime_type: "ASSAULT", reported_to_le: true, cooperation_status: "COOPERATIVE", filing_date: "2026-02-01" }
              as: IntakeCounselor
              captures: { case_id: $.data.id }
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
          trigger:
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: IntakeCounselor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHORIZED"

      - name: appeal_decider_same_as_denier_segregation_excluded
        claim_type: Segregation of duties
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "AppealsOfficer whose X-User-ID equals the case denier's X-User-ID is blocked from GRANTING with ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup: ["Case INELIGIBLE denied by user 'adj-1'; appeal UNDER_REVIEW; clock default 2026-05-01."]
          setup_api_calls:
            - call: "POST /compensation/programs"
              payload: { name: "VS Fund", fiscal_year: 2026, total_budget_cents: 10000000, overall_case_cap_cents: 5000000, medical_cap_cents: 3000000, lost_wage_cap_cents: 2000000, funeral_cap_cents: 1000000, mental_health_cap_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /compensation/cases"
              payload: { program_id: "${prog_id}", victim_name: "Jane Roe", incident_date: "2026-01-01", crime_type: "ASSAULT", reported_to_le: true, cooperation_status: "COOPERATIVE", filing_date: "2026-02-01" }
              as: IntakeCounselor
              captures: { case_id: $.data.id }
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "INELIGIBLE" }
              as: Adjudicator
              as_user_id: "adj-1"
            - call: "POST /compensation/appeals"
              payload: { case_id: "${case_id}", appeal_reason: "Reconsider" }
              as: IntakeCounselor
              captures: { appeal_id: $.data.id }
            - call: "POST /compensation/appeals/${appeal_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: AppealsOfficer
              as_user_id: "adj-1"
          trigger:
            - call: "POST /compensation/appeals/${appeal_id}/transition"
              payload: { to_status: "GRANTED" }
              as: AppealsOfficer
              as_user_id: "adj-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_SEGREGATION_OF_DUTIES"

  # ---------------- Cross-Cutting Complexity Layers ----------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_program_version_on_award_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[award-create-stale-program]", entities.Program.fields.version, "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Client reads Program.version=1; award for caseA with expected_program_version=1 succeeds and advances Program.version to 2; a second award for caseB still carrying expected_program_version=1 is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Program v1; caseA and caseB both ELIGIBLE, each with one APPROVED claim net=500,000."]
          setup_api_calls:
            - call: "POST /compensation/programs"
              payload: { name: "VS Fund", fiscal_year: 2026, total_budget_cents: 10000000, overall_case_cap_cents: 5000000, medical_cap_cents: 3000000, lost_wage_cap_cents: 2000000, funeral_cap_cents: 1000000, mental_health_cap_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /compensation/cases"
              payload: { program_id: "${prog_id}", victim_name: "Case A", incident_date: "2026-01-01", crime_type: "ASSAULT", reported_to_le: true, cooperation_status: "COOPERATIVE", filing_date: "2026-02-01" }
              as: IntakeCounselor
              captures: { case_a: $.data.id }
            - call: "POST /compensation/cases/${case_a}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/cases/${case_a}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
            - call: "POST /compensation/cases/${case_a}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: Adjudicator
            - call: "POST /compensation/claims"
              payload: { case_id: "${case_a}", category: "MEDICAL", claimed_amount_cents: 500000 }
              as: IntakeCounselor
              captures: { claim_a: $.data.id }
            - call: "POST /compensation/claims/${claim_a}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/claims/${claim_a}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
            - call: "POST /compensation/claims/${claim_a}/transition"
              payload: { to_status: "APPROVED", verified_amount_cents: 500000 }
              as: Adjudicator
            - call: "POST /compensation/cases"
              payload: { program_id: "${prog_id}", victim_name: "Case B", incident_date: "2026-01-01", crime_type: "ASSAULT", reported_to_le: true, cooperation_status: "COOPERATIVE", filing_date: "2026-02-01" }
              as: IntakeCounselor
              captures: { case_b: $.data.id }
            - call: "POST /compensation/cases/${case_b}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/cases/${case_b}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
            - call: "POST /compensation/cases/${case_b}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: Adjudicator
            - call: "POST /compensation/claims"
              payload: { case_id: "${case_b}", category: "MEDICAL", claimed_amount_cents: 500000 }
              as: IntakeCounselor
              captures: { claim_b: $.data.id }
            - call: "POST /compensation/claims/${claim_b}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/claims/${claim_b}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
            - call: "POST /compensation/claims/${claim_b}/transition"
              payload: { to_status: "APPROVED", verified_amount_cents: 500000 }
              as: Adjudicator
            - call: "POST /compensation/awards"
              payload: { case_id: "${case_a}", expected_program_version: "${prog_v}" }
              as: Adjudicator
              captures: { award_a: $.data.id }
          trigger:
            - call: "POST /compensation/awards"
              payload: { case_id: "${case_b}", expected_program_version: "${prog_v}" }
              as: Adjudicator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_STALE_VERSION"

      - name: reference_mismatch_appeal_claim_not_under_case_excluded
        claim_type: derived_field_reconciliation
