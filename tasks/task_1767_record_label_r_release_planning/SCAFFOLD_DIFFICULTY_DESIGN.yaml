  - rule_id: priority_pair_validation_conflict
    instances:
      - name: execute_minor_without_guardian_beats_advance_cap
        grounds:
          - validations[priority=8]
          - validations[priority=31]
          - errors[ERR_GUARDIAN_CONSENT_REQUIRED]
          - errors[ERR_ADVANCE_CAP_EXCEEDED]
        distinguishing_aspect: |
          Category pair business_safety vs business_fiscal: the execute request
          violates BOTH the guardian rule (artist born 2012-06-01, no guardian
          fields) AND the advance cap (6000000 > 5000000); the safety error
          ERR_GUARDIAN_CONSENT_REQUIRED must win.
        test_recipe:
          setup:
            - "Label defaults; artist born 2012-06-01 (14 at the 2026-08-01 default clock), scouting score 56.1; memo advance 6000000, no guardian fields; memo APPROVED"
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label V1" }, as: LabelAdmin, captures: { label_id: $.data.id } }
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Artist V1", genre: "POP", birth_date: "2012-06-01", monthly_streams: 600000, social_followers: 800000, engagement_rate: 0.5, live_draw_avg: 1000 }, as: AnRManager, captures: { artist_id: $.data.id } }
            - { call: "POST /api/artists/${artist_id}/deal-memos", payload: { advance_cents: 6000000, base_royalty_rate_bps: 2000, recoupment_scope: "MASTER_ONLY", promo_costs_recoupable: false, options_total: 0, option_term_months: 12, option_escalation_bps: 0, term_months: 12, valid_until_date: "2028-01-01" }, as: AnRManager, captures: { memo_id: $.data.id } }
            - { call: "POST /api/deal-memos/${memo_id}/propose", payload: {}, as: AnRManager }
            - { call: "POST /api/deal-memos/${memo_id}/approve", payload: {}, as: LabelAdmin }
          trigger:
            - { call: "POST /api/deal-memos/${memo_id}/execute", payload: {}, as: LabelAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_GUARDIAN_CONSENT_REQUIRED (safety, priority 8), NOT ERR_ADVANCE_CAP_EXCEEDED (fiscal, priority 32)"
            - "DealMemo.${memo_id}.status remains APPROVED"

      - name: schedule_unlocked_assets_beats_lead_time
        grounds:
          - validations[priority=7]
          - validations[priority=26]
          - errors[ERR_ASSETS_NOT_LOCKED]
          - errors[ERR_RELEASE_LEAD_TIME]
        distinguishing_aspect: |
          Category pair state vs business_temporal: the schedule request has
          assets merely ASSEMBLED (state violation) AND a release_date only 9
          days out (temporal violation); the state error ERR_ASSETS_NOT_LOCKED
          must win.
        test_recipe:
          setup:
            - "Label defaults; funded contract (advance 0); SINGLE release with asset_status ASSEMBLED (never locked), release_date 2026-08-10 while clock is the 2026-08-01 default (9 days < 21 lead)"
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label V2" }, as: LabelAdmin, captures: { label_id: $.data.id } }
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Artist V2", genre: "POP", birth_date: "1995-04-12", monthly_streams: 600000, social_followers: 800000, engagement_rate: 0.5, live_draw_avg: 1000 }, as: AnRManager, captures: { artist_id: $.data.id } }
            - { call: "POST /api/artists/${artist_id}/deal-memos", payload: { advance_cents: 0, base_royalty_rate_bps: 2000, recoupment_scope: "MASTER_ONLY", promo_costs_recoupable: false, options_total: 0, option_term_months: 12, option_escalation_bps: 0, term_months: 12, valid_until_date: "2028-01-01" }, as: AnRManager, captures: { memo_id: $.data.id } }
            - { call: "POST /api/deal-memos/${memo_id}/propose", payload: {}, as: AnRManager }
            - { call: "POST /api/deal-memos/${memo_id}/approve", payload: {}, as: LabelAdmin }
            - { call: "POST /api/deal-memos/${memo_id}/execute", payload: {}, as: LabelAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /api/contracts/${contract_id}/recording-projects", payload: { title: "P-V2", project_type: "SINGLE", budget_cents: 100000 }, as: AnRManager, captures: { proj_id: $.data.id } }
            - { call: "POST /api/recording-projects/${proj_id}/start", payload: {}, as: AnRManager }
            - { call: "POST /api/recording-projects/${proj_id}/tracks", payload: { title: "TV2", duration_seconds: 200, isrc: "USRC10000051" }, as: AnRManager, captures: { trk_id: $.data.id } }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/contracts/${contract_id}/releases", payload: { project_id: "${proj_id}", title: "R-V2", release_type: "SINGLE", release_date: "2026-08-10", track_ids: ["${trk_id}"] }, as: AnRManager, captures: { rel_id: $.data.id } }
            - { call: "POST /api/releases/${rel_id}/assemble", payload: {}, as: AnRManager }
          trigger:
            - { call: "POST /api/releases/${rel_id}/schedule", payload: {}, as: MarketingManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ASSETS_NOT_LOCKED (state, priority 7), NOT ERR_RELEASE_LEAD_TIME (temporal, priority 27)"
            - "Release.${rel_id}.distribution_status remains PLANNED"

      - name: pay_rejected_milestone_beats_budget_exceeded
        grounds:
          - validations[priority=7]
          - validations[priority=32]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_PROJECT_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Category pair state vs business_fiscal (distinct from the
          safety-vs-fiscal and state-vs-temporal pairs): paying a REJECTED
          milestone whose payment would also blow the budget returns
          ERR_INVALID_STATE, not ERR_PROJECT_BUDGET_EXCEEDED.
        test_recipe:
          setup:
            - "Label defaults; funded contract (advance 0); project RECORDING with budget 100000; milestone payment 200000 created, submitted, then REJECTED"
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label V3" }, as: LabelAdmin, captures: { label_id: $.data.id } }
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Artist V3", genre: "POP", birth_date: "1995-04-12", monthly_streams: 600000, social_followers: 800000, engagement_rate: 0.5, live_draw_avg: 1000 }, as: AnRManager, captures: { artist_id: $.data.id } }
            - { call: "POST /api/artists/${artist_id}/deal-memos", payload: { advance_cents: 0, base_royalty_rate_bps: 2000, recoupment_scope: "MASTER_ONLY", promo_costs_recoupable: false, options_total: 0, option_term_months: 12, option_escalation_bps: 0, term_months: 12, valid_until_date: "2028-01-01" }, as: AnRManager, captures: { memo_id: $.data.id } }
            - { call: "POST /api/deal-memos/${memo_id}/propose", payload: {}, as: AnRManager }
            - { call: "POST /api/deal-memos/${memo_id}/approve", payload: {}, as: LabelAdmin }
            - { call: "POST /api/deal-memos/${memo_id}/execute", payload: {}, as: LabelAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /api/contracts/${contract_id}/recording-projects", payload: { title: "P-V3", project_type: "SINGLE", budget_cents: 100000 }, as: AnRManager, captures: { proj_id: $.data.id } }
            - { call: "POST /api/recording-projects/${proj_id}/start", payload: {}, as: AnRManager }
            - { call: "POST /api/recording-projects/${proj_id}/milestones", payload: { name: "M1", sequence: 1, due_date: "2026-09-01", payment_cents: 200000 }, as: AnRManager, captures: { ms_id: $.data.id } }
            - { call: "POST /api/milestones/${ms_id}/submit", payload: {}, as: AnRManager }
            - { call: "POST /api/milestones/${ms_id}/reject", payload: {}, as: LabelAdmin }
          trigger:
            - { call: "POST /api/milestones/${ms_id}/pay", payload: {}, as: FinanceController, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (state, priority 7), NOT ERR_PROJECT_BUDGET_EXCEEDED (fiscal, priority 33)"
            - "RecordingMilestone.${ms_id}.status remains REJECTED; project spent_cents remains 0"

