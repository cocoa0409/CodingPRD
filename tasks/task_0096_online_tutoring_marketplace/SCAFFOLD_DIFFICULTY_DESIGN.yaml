          RefundCase has a true cycle PARENT_PROPOSED -> TUTOR_COUNTERED ->
          PARENT_PROPOSED, incrementing round_count each loop. After one counter and
          one repropose the case returns to PARENT_PROPOSED with round_count == 1 —
          a non-linear loop, not an A->B->C pipeline.
