            - "Two samples are collected on 2026-05-15 and 2026-05-16, both in 2026Q2, both shipped to the same laboratory and received, and both reported with analyzed_at inside the holding time."
            - "The first result is accepted, so EntryPoint.accepted_result_count is 1."
