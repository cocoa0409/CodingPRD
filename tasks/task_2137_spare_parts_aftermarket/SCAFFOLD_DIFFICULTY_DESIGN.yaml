      - name: replenishment_parallel_dimensions_with_ship_guard
        grounds:
          - state_machines.ReplenishmentOrder."approval_status=PENDING"_to_"approval_status=APPROVED"
          - state_machines.ReplenishmentOrder."logistics_status=NOT_STARTED"_to_"logistics_status=IN_TRANSIT"
          - entities.ReplenishmentOrder.fields.approval_status
          - entities.ReplenishmentOrder.fields.logistics_status
        distinguishing_aspect: |
          Non-linearity on ReplenishmentOrder is PARALLEL DIMENSIONS on one row: approval_status
          and logistics_status advance independently, approve leaves logistics_status at
          NOT_STARTED, and only the ship edge is guarded by the other dimension — shipping
          before approval is rejected with ERR_REPLENISHMENT_STATE_INVALID.
        test_recipe:
          setup:
            - "part PAR-1 with unit_cost_cents 1000 and no stock"
            - "one operator-raised STOCK ReplenishmentOrder for 50 units in approval_status PENDING and logistics_status NOT_STARTED"
