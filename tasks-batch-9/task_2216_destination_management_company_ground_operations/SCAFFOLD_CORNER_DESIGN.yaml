      - name: manifest_move_across_programs_rejected
        claim_type: cross_reference_link
        grounds: ["validations[priority=34]", "errors[ERR_SEGMENT_PROGRAM_MISMATCH]"]
        distinguishing_aspect: "Both segments exist and both have spare seats, yet the move is refused with HTTP 422 ERR_SEGMENT_PROGRAM_MISMATCH because the target belongs to a different program; the entry keeps its original segment and neither booked_seat_count moves."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; two Programs, each with one SHUTTLE_LOOP segment of seat_capacity 12."
            - "One ManifestEntry (guest_ref G-300, seat_count 3) on program 1's segment."
          setup_api_calls:
            - call: "POST /dmc/programs"
              payload: { client_name: "Program One Client", group_name: "Program One Group", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 20, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { p1: $.data.id }
            - call: "POST /dmc/programs"
              payload: { client_name: "Program Two Client", group_name: "Program Two Group", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 20, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { p2: $.data.id }
            - call: "POST /dmc/transport-segments"
              payload: { program_id: "${p1}", segment_type: "SHUTTLE_LOOP", vehicle_code: "P1-SHTL", origin: "Hotel Alpha", destination: "Pier 9", depart_at: "2026-09-11T18:00:00Z", arrive_at: "2026-09-11T18:30:00Z", seat_capacity: 12, wheelchair_accessible: true }
              as: OperationsCoordinator
              captures: { seg1: $.data.id }
            - call: "POST /dmc/transport-segments"
              payload: { program_id: "${p2}", segment_type: "SHUTTLE_LOOP", vehicle_code: "P2-SHTL", origin: "Hotel Beta", destination: "Pier 9", depart_at: "2026-09-11T18:00:00Z", arrive_at: "2026-09-11T18:30:00Z", seat_capacity: 12, wheelchair_accessible: true }
              as: OperationsCoordinator
              captures: { seg2: $.data.id }
            - call: "POST /dmc/manifest-entries"
              payload: { segment_id: "${seg1}", guest_ref: "G-300", guest_name: "Cyd Moreau", seat_count: 3, mobility_assist: false }
              as: OperationsCoordinator
              captures: { me1: $.data.id }
          trigger:
            - call: "POST /dmc/manifest-entries/${me1}/move"
              payload: { target_segment_id: "${seg2}" }
              as: OperationsCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns HTTP 422"
            - "${err} == ERR_SEGMENT_PROGRAM_MISMATCH"
            - "${err} != ERR_SEGMENT_NOT_FOUND"
            - "ManifestEntry.${me1}.segment_id == ${seg1}"
            - "TransportSegment.${seg1}.booked_seat_count == 3"
            - "TransportSegment.${seg2}.booked_seat_count == 0"
            - "Program.${p2}.seated_guest_count == 0"

