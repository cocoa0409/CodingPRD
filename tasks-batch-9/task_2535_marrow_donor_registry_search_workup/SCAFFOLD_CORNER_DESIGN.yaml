            - "the method decision succeeds on an UNCLEARED case: collection_method \"PBSC\", logistics_status \"METHOD_SET\", planned_window_days 6 - the two dimensions are independent, so nothing forces clearance first"
            - "rung 2: the identical booking request now returns 409 with error_id \"ERR_CLEARANCE_NOT_COMPLETE\" - repairing the priority-20 defect exposes the next rung, it does not change the outcome to success"
            - "the three clearance items are resulted PASS in their created order and the case becomes clearance_status \"CLEARED\"; the IDM item's expires_at is \"2026-08-31T00:00:00Z\" (resulted_at + IDM_VALIDITY_DAYS 30), so the requested collection date 2026-08-20 is well inside its validity and priority 35 cannot fire"
            - "rung 3: the identical booking request now returns 422 with error_id \"ERR_COLLECTION_OUTSIDE_CONDITIONING_WINDOW\" - the patient's conditioning_status is still \"NOT_SCHEDULED\", so there is no window to fall inside"
            - "none of the three rejected attempts created a booking or moved a ledger: the center's committed_slot_minutes is still 0 and the case's logistics_status is still \"METHOD_SET\""

      - name: two_violated_rules_return_the_lower_priority_number
        claim_type: Priority Ordering
        grounds:
          - validations[priority=12]
          - validations[priority=55]
        excluded_because:
          difficulty_instance: candidate_state_error_outranks_patient_budget_error_on_workup_open
          rationale: |
            §1.8 already constructs a single request that violates the candidate-state rule (12) and the
            budget rule (55) at once and pins ERR_INVALID_CANDIDATE_STATE as the answer, then repairs only
            the state defect to expose ERR_PATIENT_BUDGET_EXCEEDED - exactly this claim.

      - name: an_auth_rule_and_a_safety_rule_violated_together
        claim_type: Priority conflict
        grounds:
          - validations[priority=10]
          - validations[priority=36]
        excluded_because:
          difficulty_instance: segregation_of_duties_error_outranks_unconsented_method_error
          rationale: |
            That §1.8 instance is the priority-P vs priority-P+N pair for this endpoint: the same
            collection-method request violates the two-physician rule (10) and the consent rule (36), and
            ERR_SEGREGATION_OF_DUTIES must be the reported error.

      - name: a_conditioning_step_is_gated_by_another_entitys_state
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=27]
          - entities.CollectionBooking.fields.status
        excluded_because:
          difficulty_instance: conditioning_start_depends_on_booking_confirmation_state
          rationale: |
            The valid/invalid pair for a cross-entity precondition - START refused while the booking is
            merely HELD, accepted once it is CONFIRMED, with nothing else changed - is the whole content
            of that §1.8 instance.

      - name: individually_legal_bookings_that_collectively_exceed_capacity
        claim_type: Aggregate validation
        grounds:
          - validations[priority=48]
          - entities.CollectionCenter.fields.concurrent_collection_capacity
        excluded_because:
          difficulty_instance: center_slot_overlap_uses_buffered_half_open_minute_intervals
          rationale: |
            §1.8 fills a capacity-2 center with two individually valid bookings and then proves the third
            overlapping one is refused with ERR_CENTER_SLOT_CONFLICT while a buffer-adjacent one is
            admitted - the aggregate-limit claim at its boundary.

      - name: the_release_rule_applies_only_to_one_window_reason
        claim_type: Conditional validation
        grounds:
          - validations[priority=32]
          - entities.DonorUnavailability.fields.reason
        excluded_because:
          difficulty_instance: deferral_window_release_depends_on_donor_deferral_until_date
          rationale: |
            §1.8 exercises the reason-conditional branch of the same rule: a DEFERRAL row is refused before
            the deferral lapses and released after it, while the unconditional reasons are unaffected.

  - section: endpoints
    instances:
      - name: a_partial_registry_update_bumps_the_version_and_binds_only_later_requests
        claim_type: Standard CRUD
        grounds:
          - endpoints.PATCH_registry_registries_id
          - endpoints.GET_registry_registries_id
          - entities.Registry.fields.ct_response_deadline_hours
        distinguishing_aspect: |
          PATCH is genuinely partial and cumulative: the first call changes only
          ct_response_deadline_hours, the second only cooperation_tier, and after both the registry still
          carries its original code, name, currency, fx rate and the value set by the FIRST patch, with
          version 1 -> 2 -> 3. The contractual change is also forward-only: the typing request raised
          before the patch keeps its 168-hour deadline while the one raised afterwards gets 240 hours.
        test_recipe:
          setup:
            - "one domestic registry with ct_response_deadline_hours 168 and cooperation_tier 1"
            - "donors D1 and D5 in that registry, the canonical patient and a DOMESTIC_ONLY search"
            - "a typing request already raised on the PRIMARY candidate at the default clock"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id", reg_v1: "$.data.version", reg_donors_0: "$.data.donor_count" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0001", age_years: 27, sex: "F", weight_kg: 68.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07", "07"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC", "MARROW"], ambiguous_loci: ["C"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0005", age_years: 30, sex: "F", weight_kg: 72.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "15:01"], C: ["07:02", "03:04"], DRB1: ["15:01", "11:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC", "MARROW"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d5_id: "$.data.id" }
            - call: "POST /registry/patients"
              payload: { mrn: "MRN-0001", transplant_center_code: "TC-01", country_code: "US", diagnosis_code: "AML", urgency_tier: "HIGH", weight_kg: 70.0, cmv_status: "POSITIVE", hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "02:01"] }, case_budget_cents: 5000000 }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { p_id: "$.data.id" }
            - call: "POST /registry/search-requests"
              payload: { patient_id: "${p_id}", search_scope: "DOMESTIC_ONLY" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { sr_id: "$.data.id" }
            - call: "GET /registry/match-candidates"
              payload: { search_request_id: "${sr_id}" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { mc_d1: "$.data[0].id", mc_d5: "$.data[1].id" }
            - call: "POST /registry/match-candidates/${mc_d1}/typing-requests"
              payload: { priority_flag: false }
              as: TransplantCoordinator
