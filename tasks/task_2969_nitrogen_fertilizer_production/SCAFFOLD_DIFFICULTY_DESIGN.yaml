# =============================================================================
# 1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2969 — Nitrogen Fertilizer Production
#
# Nine rule_ids, 24 instances. Every `grounds:` ref resolves into SCAFFOLD.yaml
# §1.1-§1.7. Every numeric literal in an `assert:` was executed against the
# corresponding `calculations[].formula` with Decimal / ROUND_HALF_UP before
# being written here.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: run_unit_cost_provisional_month_match_vs_final_chronological_waterfall
        grounds:
          - calculations.run_ammonia_unit_cost
          - calculations.plant_hedged_blend
          - state_machines.ProductionRun.PLANNED_to_APPROVED
          - state_machines.ProductionRun.RUNNING_to_COMPLETED
          - state_machines.GasHedgeLot.OPEN_to_CLOSED
          - entities.ProductionRun.fields.provisional_unit_cost_usd_per_ton
          - entities.ProductionRun.fields.final_unit_cost_usd_per_ton
        distinguishing_aspect: |
          On one identical hedge book the two variants disagree in three independent ways at once —
          PROVISIONAL sees only the exact-month lots (HL-1, HL-2) sorted cheapest-first and mutates
          nothing, FINAL additionally admits the earlier-month lot HL-3 and burns oldest-contracted
          gas first destructively — so provisional_unit_cost_usd_per_ton == 139.80 while
          final_unit_cost_usd_per_ton == 117.80 on the same 5000 tons.
        test_recipe:
          setup:
            - "One plant with spot_gas_index_usd_per_mmbtu 4.20 and a fresh reformer train carrying a zero-hour catalyst charge (activity_pct 100.00)."
            - "Three OPEN gas hedge lots on that plant, created in the order HL-1 (200000 MMBtu @ 3.10, delivery_month 2026-09), HL-2 (50000 @ 2.60, 2026-09), HL-3 (100000 @ 2.00, 2026-08)."
            - "One ProductionRun over window 2026-09-01 -> 2026-09-11 with target_ammonia_tons 5000, approved by an engineer other than its author, then started with the logical clock at 2026-09-01."
            - "Required gas is 5000 * 33.0 = 165000 MMBtu for both variants; only the eligibility filter, the sort order and the destructiveness differ."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Verdigris Works", site_code: "VDG-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/reformer-trains"
              payload: { plant_id: "${plant_id}", train_code: "RT-1", rated_ammonia_tpd: 1200 }
              as: ProcessEngineer
              captures: { train_id: $.data.id }
            - call: "POST /nitrogen-ops/catalyst-charges"
              payload: { train_id: "${train_id}", charge_code: "CC-1", design_life_hours: 40000, baseline_operating_hours: 0, poisoning_index: 0.00 }
              as: ProcessEngineer
              captures: { charge_id: $.data.id }
            - call: "POST /nitrogen-ops/gas-hedge-lots"
              payload: { plant_id: "${plant_id}", lot_code: "HL-1", mmbtu_volume: 200000, strike_price_usd_per_mmbtu: 3.10, delivery_month: "2026-09" }
              as: CommercialManager
              captures: { lot1_id: $.data.id }
            - call: "POST /nitrogen-ops/gas-hedge-lots"
              payload: { plant_id: "${plant_id}", lot_code: "HL-2", mmbtu_volume: 50000, strike_price_usd_per_mmbtu: 2.60, delivery_month: "2026-09" }
              as: CommercialManager
              captures: { lot2_id: $.data.id }
            - call: "POST /nitrogen-ops/gas-hedge-lots"
              payload: { plant_id: "${plant_id}", lot_code: "HL-3", mmbtu_volume: 100000, strike_price_usd_per_mmbtu: 2.00, delivery_month: "2026-08" }
              as: CommercialManager
              captures: { lot3_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs"
              payload: { train_id: "${train_id}", run_code: "PR-1", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-11T00:00:00Z", target_ammonia_tons: 5000 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { run_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs/${run_id}/approve"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-approver"
            - call: "POST /nitrogen-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "POST /nitrogen-ops/production-runs/${run_id}/start"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-author"
          trigger:
            - call: "POST /nitrogen-ops/production-runs/${run_id}/complete"
              payload: { actual_ammonia_tons: 5000, actual_operating_hours: 240 }
              as: ProcessEngineer
              as_user_id: "eng-author"
          assert:
            - "ProductionRun.${run_id}.provisional_unit_cost_usd_per_ton == 139.80"
            - "ProductionRun.${run_id}.final_unit_cost_usd_per_ton == 117.80"
            - "ProductionRun.${run_id}.final_unit_cost_usd_per_ton != ProductionRun.${run_id}.provisional_unit_cost_usd_per_ton"
            - "ProductionRun.${run_id}.consumed_gas_mmbtu == 165000"
            - "GasHedgeLot.${lot3_id}.consumed_mmbtu == 100000 and GasHedgeLot.${lot3_id}.remaining_mmbtu == 0 and GasHedgeLot.${lot3_id}.status == CLOSED"
            - "GasHedgeLot.${lot2_id}.consumed_mmbtu == 50000 and GasHedgeLot.${lot2_id}.remaining_mmbtu == 0 and GasHedgeLot.${lot2_id}.status == CLOSED"
            - "GasHedgeLot.${lot1_id}.consumed_mmbtu == 15000 and GasHedgeLot.${lot1_id}.remaining_mmbtu == 185000 and GasHedgeLot.${lot1_id}.status == OPEN"
            - "Plant.${plant_id}.hedged_blend_usd_per_mmbtu == 3.1000"
            - "ProductionRun.${run_id}.status == COMPLETED"

      - name: catalyst_calendar_vs_severity_adjusted_activity_diverge_after_regeneration
        grounds:
          - calculations.catalyst_activity_pct
          - state_machines.CatalystCharge.ACTIVE_to_SPENT
          - state_machines.CatalystCharge.SPENT_to_ACTIVE
          - state_machines.ReformerTrain.IDLE_to_DERATED
          - state_machines.ReformerTrain.DERATED_to_IDLE
          - entities.CatalystCharge.fields.calendar_activity_pct
          - entities.CatalystCharge.fields.activity_pct
        distinguishing_aspect: |
          This instance lives in the catalyst asset-health domain rather than the run cost-accounting
          domain of the previous instance: on identical stored hours (18000 of 40000) the CALENDAR
          variant reports 55.00 while SEVERITY_ADJUSTED reports 60.93 because poisoning_index 0.30
          and one regeneration are visible only to the second variant, and only the second variant
          gates the SPENT transition.
        test_recipe:
          setup:
            - "One plant and one reformer train."
            - "One catalyst charge with design_life_hours 40000, baseline_operating_hours 18000 and poisoning_index 0.00, so both variants read 55.00 at creation."
            - "The poisoning index is then revised to 0.30, dropping the gating variant to 48.93 and driving the charge SPENT and the train DERATED."
            - "One regeneration credits 12.00 points, lifting the gating variant to 60.93 and returning the charge to ACTIVE and the train to IDLE, while the calendar variant is untouched at 55.00."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Donaldsonville Works", site_code: "DVL-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/reformer-trains"
              payload: { plant_id: "${plant_id}", train_code: "RT-1", rated_ammonia_tpd: 1100 }
              as: ProcessEngineer
              captures: { train_id: $.data.id }
            - call: "POST /nitrogen-ops/catalyst-charges"
              payload: { train_id: "${train_id}", charge_code: "CC-1", design_life_hours: 40000, baseline_operating_hours: 18000, poisoning_index: 0.00 }
              as: ProcessEngineer
              captures: { charge_id: $.data.id }
            - call: "PATCH /nitrogen-ops/catalyst-charges/${charge_id}"
              payload: { poisoning_index: 0.30 }
              as: ProcessEngineer
          trigger:
            - call: "POST /nitrogen-ops/catalyst-charges/${charge_id}/regenerate"
              payload: {}
              as: ProcessEngineer
          assert:
            - "CatalystCharge.${charge_id}.cumulative_operating_hours == 18000"
            - "CatalystCharge.${charge_id}.regeneration_count == 1"
            - "CatalystCharge.${charge_id}.calendar_activity_pct == 55.00"
            - "CatalystCharge.${charge_id}.activity_pct == 60.93"
            - "CatalystCharge.${charge_id}.activity_pct - CatalystCharge.${charge_id}.calendar_activity_pct == 5.93"
            - "CatalystCharge.${charge_id}.status == ACTIVE"
            - "ReformerTrain.${train_id}.status == IDLE"
            - "ReformerTrain.${train_id}.active_charge_id == ${charge_id}"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quote_price_multiplies_seasonal_volume_and_posture_factors
        grounds:
          - calculations.quote_price_per_ton
          - calculations.plant_hedged_blend
          - state_machines.PriceQuote.DRAFT_to_ISSUED
          - entities.PriceQuote.fields.gas_basis_usd_per_mmbtu
          - entities.PriceQuote.fields.quoted_price_usd_per_ton
        distinguishing_aspect: |
          Six inputs from four different entities combine multiplicatively in one formula — the
          plant's 2.6250 hedged blend, the ProductLine's 0.58 ammonia intensity and 38.00 conversion
          cost, the margin floor beating the 22% target, the 1.18 spring multiplier selected from
          expires_at's month and the 0.97 volume tier selected from tons — yielding exactly 157.83;
          changing any single one of the six moves the answer.
        test_recipe:
          setup:
            - "One plant with spot_gas_index_usd_per_mmbtu 4.20 and two OPEN hedge lots: 100000 MMBtu @ 3.00 (2026-10) and 300000 MMBtu @ 2.50 (2026-11), giving hedged_blend_usd_per_mmbtu 2.6250."
            - "One UREA product line with ammonia_tons_per_product_ton 0.58 and conversion_cost_usd_per_ton 38.00."
            - "One DRAFT price quote for 6000 tons on HEDGED_BLEND basis expiring 2027-04-15 (April -> spring multiplier)."
            - "The plant's operating_posture is NORMAL, so the posture factor is 1.00."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Yazoo City Works", site_code: "YZC-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/gas-hedge-lots"
              payload: { plant_id: "${plant_id}", lot_code: "HL-Q1", mmbtu_volume: 100000, strike_price_usd_per_mmbtu: 3.00, delivery_month: "2026-10" }
              as: CommercialManager
              captures: { qlot1_id: $.data.id }
            - call: "POST /nitrogen-ops/gas-hedge-lots"
              payload: { plant_id: "${plant_id}", lot_code: "HL-Q2", mmbtu_volume: 300000, strike_price_usd_per_mmbtu: 2.50, delivery_month: "2026-11" }
              as: CommercialManager
              captures: { qlot2_id: $.data.id }
            - call: "POST /nitrogen-ops/product-lines"
              payload: { plant_id: "${plant_id}", product_code: "UREA", ammonia_tons_per_product_ton: 0.58, conversion_cost_usd_per_ton: 38.00, regulated: false, priority_rank: 1 }
              as: CommercialManager
              captures: { urea_line_id: $.data.id }
            - call: "POST /nitrogen-ops/price-quotes"
              payload: { plant_id: "${plant_id}", product_line_id: "${urea_line_id}", quote_code: "QT-1", tons: 6000, pass_through_basis: "HEDGED_BLEND", expires_at: "2027-04-15T00:00:00Z" }
              as: CommercialManager
              captures: { quote_id: $.data.id }
          trigger:
            - call: "POST /nitrogen-ops/price-quotes/${quote_id}/issue"
              payload: {}
              as: CommercialManager
          assert:
            - "Plant.${plant_id}.hedged_blend_usd_per_mmbtu == 2.6250"
            - "PriceQuote.${quote_id}.gas_basis_usd_per_mmbtu == 2.6250"
            - "PriceQuote.${quote_id}.quoted_price_usd_per_ton == 157.83"
            - "PriceQuote.${quote_id}.status == ISSUED"
            - "PriceQuote.${quote_id}.issued_at == 2026-08-01T00:00:00.000Z"

      - name: landed_cost_rounds_four_components_independently_before_summing
        grounds:
          - calculations.production_order_landed_cost
          - calculations.run_ammonia_unit_cost
          - state_machines.ProductionOrder.A_RESERVED_to_A_CONSUMED
          - entities.ProductionOrder.fields.landed_cost_usd
          - entities.ProductionOrder.fields.allocated_ammonia_tons
        distinguishing_aspect: |
          The rounding ORDER is the combinatorial content here, not the factor count: feedstock
          33547.20, conversion 61842.94, handling 1782.22 and security 3683.44 are each rounded to
          2 dp before summing to 100855.80, whereas summing at full precision and rounding once
          yields 100855.79 — a one-cent divergence the assertion pins in both directions.
        test_recipe:
          setup:
            - "The full hedge-book chain of run_unit_cost_provisional_month_match_vs_final_chronological_waterfall, completed so final_unit_cost_usd_per_ton is 117.80."
            - "One regulated AMMONIUM_NITRATE product line with ammonia_tons_per_product_ton 0.213 and conversion_cost_usd_per_ton 46.255."
            - "One HIGH_SECURITY dome of capacity_tons 20000 for AMMONIUM_NITRATE with seasonal_reserve_pct 0.15."
            - "One production order for 1400 tons, security-cleared and reserved against the completed run (allocated_ammonia_tons 298.200)."
            - "The logical clock sits at 2026-09-01, outside the December-February seasonal window, so seasonal_reserve_tons is 0.000."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Verdigris Works", site_code: "VDG-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/reformer-trains"
              payload: { plant_id: "${plant_id}", train_code: "RT-1", rated_ammonia_tpd: 1200 }
              as: ProcessEngineer
              captures: { train_id: $.data.id }
            - call: "POST /nitrogen-ops/catalyst-charges"
              payload: { train_id: "${train_id}", charge_code: "CC-1", design_life_hours: 40000, baseline_operating_hours: 0, poisoning_index: 0.00 }
              as: ProcessEngineer
              captures: { charge_id: $.data.id }
            - call: "POST /nitrogen-ops/gas-hedge-lots"
              payload: { plant_id: "${plant_id}", lot_code: "HL-1", mmbtu_volume: 200000, strike_price_usd_per_mmbtu: 3.10, delivery_month: "2026-09" }
              as: CommercialManager
              captures: { lot1_id: $.data.id }
            - call: "POST /nitrogen-ops/gas-hedge-lots"
              payload: { plant_id: "${plant_id}", lot_code: "HL-2", mmbtu_volume: 50000, strike_price_usd_per_mmbtu: 2.60, delivery_month: "2026-09" }
              as: CommercialManager
              captures: { lot2_id: $.data.id }
            - call: "POST /nitrogen-ops/gas-hedge-lots"
              payload: { plant_id: "${plant_id}", lot_code: "HL-3", mmbtu_volume: 100000, strike_price_usd_per_mmbtu: 2.00, delivery_month: "2026-08" }
              as: CommercialManager
              captures: { lot3_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs"
              payload: { train_id: "${train_id}", run_code: "PR-1", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-11T00:00:00Z", target_ammonia_tons: 5000 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { run_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs/${run_id}/approve"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-approver"
            - call: "POST /nitrogen-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "POST /nitrogen-ops/production-runs/${run_id}/start"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-author"
            - call: "POST /nitrogen-ops/production-runs/${run_id}/complete"
              payload: { actual_ammonia_tons: 5000, actual_operating_hours: 240 }
              as: ProcessEngineer
              as_user_id: "eng-author"
            - call: "POST /nitrogen-ops/product-lines"
              payload: { plant_id: "${plant_id}", product_code: "AMMONIUM_NITRATE", ammonia_tons_per_product_ton: 0.213, conversion_cost_usd_per_ton: 46.255, regulated: true, priority_rank: 2 }
              as: CommercialManager
              captures: { an_line_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets"
              payload: { plant_id: "${plant_id}", asset_code: "AN-DOME-1", asset_kind: "DOME", product_code: "AMMONIUM_NITRATE", capacity_tons: 20000, security_class: "HIGH_SECURITY", seasonal_reserve_pct: 0.15 }
              as: LogisticsCoordinator
              captures: { dome_id: $.data.id }
            - call: "POST /nitrogen-ops/production-orders"
              payload: { run_id: "${run_id}", product_line_id: "${an_line_id}", destination_asset_id: "${dome_id}", order_code: "PO-1", requested_tons: 1400 }
              as: CommercialManager
              as_user_id: "cm-author"
              captures: { order_id: $.data.id }
            - call: "POST /nitrogen-ops/production-orders/${order_id}/security-check"
              payload: { decision: "CLEARED" }
              as: SafetyOfficer
              as_user_id: "so-screener"
            - call: "GET /nitrogen-ops/production-runs/${run_id}"
              payload: {}
              as: ProcessEngineer
              captures: { run_ver: $.data.version }
            - call: "POST /nitrogen-ops/production-orders/${order_id}/reserve"
              payload: { reserve_tons: 1400, expected_run_version: "${run_ver}" }
              as: CommercialManager
              as_user_id: "cm-author"
          trigger:
            - call: "POST /nitrogen-ops/production-orders/${order_id}/produce"
              payload: { produced_tons: 1337 }
              as: ProcessEngineer
              as_user_id: "eng-author"
          assert:
            - "ProductionOrder.${order_id}.allocated_ammonia_tons == 298.200"
            - "ProductionOrder.${order_id}.produced_tons == 1337.000"
            - "ProductionOrder.${order_id}.landed_cost_usd == 100855.80"
            - "ProductionOrder.${order_id}.landed_cost_usd != 100855.79"
            - "ProductionOrder.${order_id}.allocation_status == CONSUMED"
            - "ProductionOrder.${order_id}.security_status == CLEARED"
            - "StorageAsset.${dome_id}.on_hand_tons == 1337.000"
            - "StorageAsset.${dome_id}.seasonal_reserve_tons == 0.000"
            - "StorageAsset.${dome_id}.available_tons == 1337.000"

      - name: freight_surcharge_tier_selected_from_pre_surcharge_base
        grounds:
          - calculations.shipment_freight_total
          - state_machines.Shipment.DRAFT_to_BOOKED
          - concurrency_rules[shipment-book-stale-storage]
          - entities.Shipment.fields.base_freight_usd
          - entities.Shipment.fields.fuel_surcharge_usd
          - entities.Shipment.fields.freight_total_usd
        distinguishing_aspect: |
          Three dimensions combine — the RAIL ton-mile rate against the mode's minimum charge, then a
          surcharge tier selected from the PRE-surcharge base 96078.40 — so the surcharge is 5956.86
          at 6.2%, not the 3939.21 that a 4.1% re-tier off the 102035.26 total would produce; the
          tier lookup happens exactly once and never iterates to a fixed point.
          Combinatorially distinct from landed cost: there the ORDER of rounding is the trap, here
          the ORDER of tier evaluation is.
          Distinct from the quote formula: those factors all multiply, these compose through a
          max() and a step function.
        test_recipe:
          setup:
            - "One plant with a UREA product line that is not regulated, so no security-class gate applies to the movement."
            - "Two UREA terminals of capacity_tons 20000 with seasonal_reserve_pct 0.00; the origin has an opening balance of 10000 tons."
            - "One DRAFT shipment of 4000 tons over 583 RAIL miles from origin to destination."
            - "The logical clock sits at its startup default 2026-08-01, outside the seasonal window."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Port Neal Works", site_code: "PNL-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/product-lines"
              payload: { plant_id: "${plant_id}", product_code: "UREA", ammonia_tons_per_product_ton: 0.58, conversion_cost_usd_per_ton: 38.00, regulated: false, priority_rank: 1 }
              as: CommercialManager
              captures: { urea_line_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets"
              payload: { plant_id: "${plant_id}", asset_code: "UT-ORIG", asset_kind: "TERMINAL", product_code: "UREA", capacity_tons: 20000, security_class: "BASIC", seasonal_reserve_pct: 0.00 }
              as: LogisticsCoordinator
              captures: { origin_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets"
              payload: { plant_id: "${plant_id}", asset_code: "UT-DEST", asset_kind: "TERMINAL", product_code: "UREA", capacity_tons: 20000, security_class: "BASIC", seasonal_reserve_pct: 0.00 }
              as: LogisticsCoordinator
              captures: { dest_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets/${origin_id}/opening-balance"
              payload: { opening_balance_tons: 10000 }
              as: LogisticsCoordinator
            - call: "POST /nitrogen-ops/shipments"
              payload: { origin_asset_id: "${origin_id}", dest_asset_id: "${dest_id}", shipment_code: "SH-1", mode: "RAIL", tons: 4000, distance_miles: 583, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-10T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { ship_id: $.data.id }
            - call: "GET /nitrogen-ops/storage-assets/${origin_id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { origin_ver: $.data.version }
          trigger:
            - call: "POST /nitrogen-ops/shipments/${ship_id}/book"
              payload: { expected_origin_asset_version: "${origin_ver}" }
              as: LogisticsCoordinator
          assert:
            - "Shipment.${ship_id}.base_freight_usd == 96078.40"
            - "Shipment.${ship_id}.fuel_surcharge_usd == 5956.86"
            - "Shipment.${ship_id}.fuel_surcharge_usd != 3939.21"
            - "Shipment.${ship_id}.freight_total_usd == 102035.26"
            - "Shipment.${ship_id}.freight_per_ton_usd == 25.5088"
            - "Shipment.${ship_id}.status == BOOKED"
            - "StorageAsset.${origin_id}.reserved_tons == 4000.000"
            - "StorageAsset.${origin_id}.on_hand_tons == 10000.000"
            - "StorageAsset.${origin_id}.available_tons == 6000.000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: turnaround_reject_arm_voids_review_and_blocks_task_graph
        grounds:
          - state_machines.Turnaround.SUBMITTED_to_REJECTED
          - state_machines.Turnaround.SUBMITTED_to_APPROVED
          - state_machines.TurnaroundTask.PENDING_to_BLOCKED
          - entities.Turnaround.fields.psm_review_decision
          - entities.Turnaround.fields.approved_by_user_id
          - validations[priority=12]
        distinguishing_aspect: |
          SUBMITTED is a genuine fork, not a pipeline step: the REJECT arm writes rejection_reason,
          flips psm_review_decision to VOID, nulls psm_findings_count and drives every PENDING or
