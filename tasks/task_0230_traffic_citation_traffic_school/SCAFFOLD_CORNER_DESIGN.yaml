            - call: "POST /citations/${cid}/assess"
              payload: {}
              as: CourtClerk
              captures: { cver: $.data.version }
            - call: "POST /citations/${cid}/installment-plans"
              payload: { term_count: 4, first_due_at: "2026-03-01T00:00:00Z", expected_citation_version: "${cver}" }
              as: Driver
              as_user_id: "${d}"
              captures: { plan: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: CourtClerk
          trigger:
            - call: "POST /installment-plans/${plan}/mark-default"
              payload: {}
              as: CourtClerk
            - call: "GET /license-holds?driver_id=${d}"
              payload: {}
              as: DmvAdmin
