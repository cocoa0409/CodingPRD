      - name: request_shape_outranks_path_existence_which_outranks_body_foreign_keys
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - validations[priority=5]
        distinguishing_aspect: >
          With an unknown auction id in the path AND an unknown lot id in the
          body the response is ERR_AUCTION_NOT_FOUND, but adding a malformed enum
          to a body that also carries an unknown consignor id yields
          ERR_INVALID_REQUEST instead of the 404.
        test_recipe:
          setup:
            - empty database apart from the logical clock
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: POST /auctions/00000000-0000-0000-0000-0000000000aa/lot-assignments
              payload: { lot_id: "00000000-0000-0000-0000-0000000000bb" }
              as: AuctionOperator
              captures: { err_a: "$.data.error_id" }
            - call: POST /consignments
              payload:
                consignor_id: 00000000-0000-0000-0000-0000000000cc
                agreement_type: NOT_A_TYPE
                commission_schedule_code: RESERVE_STD
                refurb_authorization_cap_cents: 500000
              as: Consignor
              as_user_id: 00000000-0000-0000-0000-0000000000cc
              captures: { err_b: "$.data.error_id" }
            - call: POST /consignments
              payload:
                consignor_id: 00000000-0000-0000-0000-0000000000cc
                agreement_type: RESERVE
                commission_schedule_code: RESERVE_STD
                refurb_authorization_cap_cents: 500000
              as: Consignor
              as_user_id: 00000000-0000-0000-0000-0000000000cc
              captures: { err_c: "$.data.error_id" }
          assert:
            - the lot-assignment call returns 404 with data.error_id == "ERR_AUCTION_NOT_FOUND" (path before body FK)
            - the malformed-enum call returns 400 with data.error_id == "ERR_INVALID_REQUEST" (shape before existence)
            - the well-formed call with the same unknown consignor returns 404 with data.error_id == "ERR_CONSIGNOR_NOT_FOUND"
            - no Consignment row is created by any of the three calls

      - name: late_and_oversized_bid_reports_the_closed_auction
        claim_type: priority_conflict
        excluded_because:
          grounds: validations[priority=9]
          difficulty_instance: bid_before_auction_opens_with_cap_exceeded_reports_auction_not_open
          rationale: >
            That §1.8 instance violates the auction-state rule and the fiscal
            bid-cap rule in one request and pins ERR_AUCTION_NOT_OPEN, which is
            the priority-conflict claim for this pair.

      - name: embargo_outranks_the_deposit_minimum
        claim_type: priority_conflict
        excluded_because:
          grounds: validations[priority=18]
          difficulty_instance: embargoed_country_with_undersized_deposit_reports_embargo
          rationale: >
            That §1.8 instance registers an embargoed bidder with a deposit below
            the tier minimum and pins ERR_COUNTRY_EMBARGOED over
            ERR_DEPOSIT_BELOW_MINIMUM.

      - name: overlapping_live_auction_windows_are_detected
        claim_type: temporal_validation
        excluded_because:
          grounds: validations[priority=32]
          difficulty_instance: live_onsite_window_conflict_includes_teardown_buffer_closed_interval
          rationale: >
            That §1.8 instance walks the buffered closed interval at the exact
            boundary and one second past it, covering the temporal-conflict claim
            for auction scheduling.

      - name: overlapping_slots_exceed_the_crane_rating_collectively
        claim_type: aggregate_validation
        excluded_because:
          grounds: validations[priority=31]
          difficulty_instance: bay_crane_capacity_aggregates_overlapping_slots_excluding_superseded
          rationale: >
            That §1.8 instance books individually-legal slots whose overlapping
            tonnage exceeds crane_capacity_kg and verifies the superseded slot is
            excluded from the sum.

      - name: assignment_depends_on_the_parent_consignment_state
        claim_type: cross_entity_validation
        excluded_because:
          grounds: validations[priority=11]
          difficulty_instance: lot_assignment_requires_consignment_cataloged
          rationale: >
            That §1.8 instance blocks a published lot because a sibling lot is
            still unpublished, which is the cross-entity dependency claim for
            assignment.

      - name: reserve_satisfaction_confirms_the_sale
        claim_type: satisfaction_to_pass
        excluded_because:
          grounds: validations[priority=8]
          difficulty_instance: reserve_exact_match_confirms_while_one_cent_short_stays_provisional
          rationale: >
            That §1.8 instance shows the satisfied path (hammer exactly at
            reserve confirms and invoices) against the unsatisfied path in the
            same fixture.

