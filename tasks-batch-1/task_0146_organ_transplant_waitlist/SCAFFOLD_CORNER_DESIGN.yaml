        distinguishing_aspect: "With creatinine=1.2: on_dialysis_twice_in_week=true clamps creatinine to 4.0 giving allocation_score 28, vs 17 without dialysis — same other labs, divergent result."
        test_recipe:
          setup:
            - "Two adult LIVER candidates, identical labs bilirubin=2.0,inr=1.5,creatinine=1.2,sodium=135; one has on_dialysis_twice_in_week=true."
