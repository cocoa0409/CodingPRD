  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: invariant_fabric_meters_conserved_on_confirm_then_cancel
        grounds:
          - state_machines.GarmentOrder.DRAFT_to_CONFIRMED
          - state_machines.GarmentOrder.CONFIRMED_to_CANCELLED
          - entities.Fabric.fields.bolt_meters_remaining
        distinguishing_aspect: |
          Conserved quantity = total fabric meters (bolt_meters_remaining). Forward action (confirm
          reserves order.fabric_meters_required) paired with compensating action (cancel releases the
          same meters) leaves bolt_meters_remaining identical to its pre-confirm value: invariant
          bolt_meters_remaining_after == bolt_meters_remaining_before.
        test_recipe:
          setup:
            - "Fabric F15 bolt 50m @ 8000. Order O15 meters 7.0, confirmed then cancelled."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C15", email: "c15.ci@x.com" }
              as: SalesAssociate
              captures: { c15_id: $.data.id }
            - call: "POST /measurement-profiles"
              payload: { customer_id: "${c15_id}", chest_cm: 100, waist_cm: 84, hip_cm: 100, inseam_cm: 80, source: "MANUAL" }
              as: SalesAssociate
              captures: { mp15_id: $.data.id }
            - call: "POST /fabrics"
              payload: { name: "Wool CI", price_per_meter_cents: 8000, bolt_meters_initial: 50 }
              as: ShopManager
              captures: { f15_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c15_id}", measurement_profile_id: "${mp15_id}", garment_type: "SUIT", base_labor_cents: 40000, fabric_meters_required: 7.0, promised_date: "2026-08-01T00:00:00.000Z" }
              as: SalesAssociate
              captures: { o15_id: $.data.id }
            - call: "POST /orders/${o15_id}/option-lines"
              payload: { fabric_id: "${f15_id}", option_code: "MONOGRAM" }
              as: SalesAssociate
            - call: "POST /orders/${o15_id}/confirm"
              payload: {}
              as: SalesAssociate
            - call: "GET /fabrics/${f15_id}"
              payload: {}
              as: ShopManager
              captures: { f15_after_confirm: $.data.bolt_meters_remaining }
          trigger:
            - call: "POST /orders/${o15_id}/cancel"
              payload: {}
              as: ShopManager
            - call: "GET /fabrics/${f15_id}"
              payload: {}
              as: ShopManager
              captures: { f15_after_cancel: $.data.bolt_meters_remaining }
          assert:
            # reserved at confirm: 50 - 7 = 43; released at cancel back to 50
            - "Fabric.${f15_id}.bolt_meters_remaining == 50"

      - name: invariant_payment_cash_conserved_on_deposit_then_cancel_refund
        grounds:
          - state_machines.GarmentOrder.CONFIRMED_to_CANCELLED
          - entities.Payment.fields.status
          - entities.Customer.fields.store_credit_cents
        distinguishing_aspect: |
          Conserved quantity = customer cash-equivalent (CAPTURED payment cents + store_credit_cents).
          Forward action (capture a 48750 deposit) paired with compensating action (cancel refunds the
          deposit to store credit) keeps captured+credit constant: the deposit moves from Payment to
          store_credit, no cash-equivalent created or destroyed — a different conserved quantity than
          fabric meters.
        test_recipe:
          setup:
            - "CONFIRMED order O16 with a 48750 DEPOSIT captured; customer store_credit 0 before cancel."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C16", email: "c16.ci@x.com" }
              as: SalesAssociate
              captures: { c16_id: $.data.id }
            - call: "POST /measurement-profiles"
              payload: { customer_id: "${c16_id}", chest_cm: 100, waist_cm: 84, hip_cm: 100, inseam_cm: 80, source: "MANUAL" }
              as: SalesAssociate
              captures: { mp16_id: $.data.id }
            - call: "POST /fabrics"
              payload: { name: "Wool CI2", price_per_meter_cents: 8000, bolt_meters_initial: 50 }
              as: ShopManager
              captures: { f16_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c16_id}", measurement_profile_id: "${mp16_id}", garment_type: "SUIT", base_labor_cents: 40000, fabric_meters_required: 7.0, promised_date: "2026-08-01T00:00:00.000Z" }
              as: SalesAssociate
              captures: { o16_id: $.data.id }
            - call: "POST /orders/${o16_id}/option-lines"
              payload: { fabric_id: "${f16_id}", option_code: "MONOGRAM" }
              as: SalesAssociate
            - call: "POST /orders/${o16_id}/option-lines"
              payload: { fabric_id: "${f16_id}", option_code: "CONTRAST_LINING" }
              as: SalesAssociate
            - call: "POST /orders/${o16_id}/confirm"
              payload: {}
              as: SalesAssociate
            - call: "POST /orders/${o16_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 48750 }
              as: SalesAssociate
              captures: { pay16_id: $.data.id }
          trigger:
            - call: "POST /orders/${o16_id}/cancel"
              payload: {}
              as: ShopManager
          assert:
            # deposit refunded: payment marked REFUNDED, full amount moved to store credit
            - "Payment.${pay16_id}.status == REFUNDED"
            - "Customer.${c16_id}.store_credit_cents == 48750"
