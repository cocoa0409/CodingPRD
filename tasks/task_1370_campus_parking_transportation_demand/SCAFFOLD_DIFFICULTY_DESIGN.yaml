# =============================================================================
# §1.8 Scaffold Difficulty Design — task_1370 campus parking
# Nine Difficulty Rules × 2 instances each. Every recipe drives empty-DB ->
# precondition state using only §1.5 endpoints. Shared fixture dates:
#   TERM_A = 2026-08-03 .. 2026-11-22 (inclusive 112 days = exactly 16 weeks;
#   midterm date 2026-09-28). Default logical clock 2026-08-01T00:00:00Z.
# Precomputed literals (verified against §1.3 formulas):
#   base 100010 PRORATED_WEEKLY @2026-10-05: weekly round(100010/16)=6251,
#     7 weeks -> fee_base 43757, surcharge round(2187.85)=2188, total 45945.
#   base 100010 FLAT_HALF_TERM @2026-10-05: fee_base 50005, surcharge 2500,
#     total 52505.
#   base 100000 PRORATED_WEEKLY @2026-10-05: weekly 6250 exact, fee_base 43750,
#     surcharge round_half_up(2187.5)=2188, total 45938.
#   base 80000 full term: fee_base 80000, surcharge 4000, total 84000.
#   base 80000 @2026-08-24 (13 weeks): fee_base 65000, surcharge 3250, total 68250.
#   NO_VALID_PERMIT fine: standard 7500; escalated (>=2 PAID in 365d) 11250.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: permit_fee_proration_policy_divergence
        grounds:
          - calculations.permit_fee_calculation
          - entities.LotAllocation.fields.proration_policy
          - entities.Permit.fields.fee_total_cents
        distinguishing_aspect: |
          Same purchaser, same base_fee_cents (100010), same valid_from
          (2026-10-05): a PRORATED_WEEKLY allocation charges 45945 cents while a
          FLAT_HALF_TERM allocation charges 52505 cents — the variant is selected
          by LotAllocation.proration_policy, a Permit-pricing-domain calculation.
        test_recipe:
          setup:
            - "STUDENT patron; one lot; two allocations on it (codes PW/FH) identical except proration_policy; logical clock at 2026-10-05 (past midterm 2026-09-28)"
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "Pat A", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "L1", name: "Lot 1", zone: "CORE", capacity_total: 100 }
              as: ParkingAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_id}", permit_code: "PW", eligible_roles: ["STUDENT"], residency_rule: "ANY", base_fee_cents: 100010, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 10 }
              as: ParkingAdmin
              captures: { alloc_pw: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_id}", permit_code: "FH", eligible_roles: ["STUDENT"], residency_rule: "ANY", base_fee_cents: 100010, proration_policy: "FLAT_HALF_TERM", term_start: "2026-08-03", term_end: "2026-11-22", quota: 10 }
              as: ParkingAdmin
              captures: { alloc_fh: $.data.id }
            - call: "POST /parking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T00:00:00Z" }
              as: ParkingAdmin
            - call: "GET /parking/allocations/${alloc_pw}"
              as: ParkingAdmin
              captures: { v_pw: $.data.version }
            - call: "GET /parking/allocations/${alloc_fh}"
              as: ParkingAdmin
              captures: { v_fh: $.data.version }
          trigger:
            - call: "POST /parking/permits"
              payload: { patron_id: "${pat_id}", allocation_id: "${alloc_pw}", plate_number: "AAA111", valid_from: "2026-10-05", expected_allocation_version: "${v_pw}" }
              as: Commuter
              as_user_id: "${pat_id}"
              captures: { pw_fee_base: $.data.fee_base_cents, pw_surcharge: $.data.surcharge_cents, pw_total: $.data.fee_total_cents }
            - call: "POST /parking/permits"
              payload: { patron_id: "${pat_id}", allocation_id: "${alloc_fh}", plate_number: "BBB222", valid_from: "2026-10-05", expected_allocation_version: "${v_fh}" }
              as: Commuter
              as_user_id: "${pat_id}"
              captures: { fh_fee_base: $.data.fee_base_cents, fh_surcharge: $.data.surcharge_cents, fh_total: $.data.fee_total_cents }
          assert:
            - "captured pw_fee_base == 43757 and pw_surcharge == 2188 and pw_total == 45945"
            - "captured fh_fee_base == 50005 and fh_surcharge == 2500 and fh_total == 52505"
            - "pw_total != fh_total despite identical base_fee_cents and valid_from"

      - name: citation_fine_repeat_escalation_divergence
        grounds:
          - calculations.citation_fine_calculation
          - entities.Citation.fields.fine_amount_cents
        distinguishing_aspect: |
          Identical violation (NO_VALID_PERMIT), same lot, same time: a patron
          with 2 PAID citations in the trailing 365 days is charged 11250 cents
          while a clean-history patron is charged 7500 cents — a Citation-domain
          calculation, distinct from the Permit pricing variant pair.
        test_recipe:
          setup:
            - "patrons P and Q, each holding a permit (plates P111/Q222); lot B where neither plate is valid; P has two PAID NO_VALID_PERMIT citations issued within the trailing 365 days; Q has none"
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "P", campus_role: "STAFF", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { p_id: $.data.id }
            - call: "POST /parking/patrons"
              payload: { full_name: "Q", campus_role: "STAFF", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { q_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LA", name: "Lot A", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_a: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LB", name: "Lot B", zone: "REMOTE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_b: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_a}", permit_code: "GEN", eligible_roles: ["STUDENT", "STAFF", "FACULTY"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 10 }
              as: ParkingAdmin
              captures: { alloc_a: $.data.id }
            - call: "GET /parking/allocations/${alloc_a}"
              as: ParkingAdmin
              captures: { v_a1: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${p_id}", allocation_id: "${alloc_a}", plate_number: "P111", expected_allocation_version: "${v_a1}" }
              as: ParkingAdmin
            - call: "GET /parking/allocations/${alloc_a}"
              as: ParkingAdmin
              captures: { v_a2: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${q_id}", allocation_id: "${alloc_a}", plate_number: "Q222", expected_allocation_version: "${v_a2}" }
              as: ParkingAdmin
            - call: "POST /parking/citations"
              payload: { lot_id: "${lot_b}", plate_number: "P111", violation_type: "NO_VALID_PERMIT" }
              as: EnforcementOfficer
              as_user_id: "off-1"
              captures: { c1_id: $.data.id }
            - call: "POST /parking/citations/${c1_id}/pay"
              payload: {}
              as: Commuter
              as_user_id: "${p_id}"
            - call: "POST /parking/citations"
              payload: { lot_id: "${lot_b}", plate_number: "P111", violation_type: "NO_VALID_PERMIT" }
              as: EnforcementOfficer
              as_user_id: "off-1"
              captures: { c2_id: $.data.id }
            - call: "POST /parking/citations/${c2_id}/pay"
              payload: {}
              as: Commuter
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /parking/citations"
              payload: { lot_id: "${lot_b}", plate_number: "P111", violation_type: "NO_VALID_PERMIT" }
              as: EnforcementOfficer
              as_user_id: "off-1"
              captures: { c3_fine: $.data.fine_amount_cents }
            - call: "POST /parking/citations"
              payload: { lot_id: "${lot_b}", plate_number: "Q222", violation_type: "NO_VALID_PERMIT" }
              as: EnforcementOfficer
              as_user_id: "off-1"
              captures: { cq_fine: $.data.fine_amount_cents }
          assert:
            - "captured c3_fine == 11250 (round_half_up(7500 * 1.5); repeat_count == 2 meets REPEAT_THRESHOLD)"
            - "captured cq_fine == 7500 (repeat_count == 0 -> standard schedule)"
            - "c3_fine != cq_fine for identical violation_type, lot, and time"

  # ---------------------------------------------------------------- rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: waitlist_priority_score_offer_ordering
        grounds:
          - calculations.waitlist_priority_score
          - state_machines.WaitlistEntry.WAITING_to_OFFERED
          - entities.WaitlistEntry.fields.decline_count
        distinguishing_aspect: |
          Mode (a) combinatorial: the offer selector combines role weight, capped
          wait-day points, and the decline penalty (4 inputs, nested min,
          conditional penalty); after the staff member's offer expires and
          requeues with decline_count 1, the penalty flips the ranking so the
          student wins the next offer round (scores 96 vs 65).
        test_recipe:
          setup:
            - "lot with quota-1 allocation occupied by an occupier permit; STAFF patron S joined the waitlist 2026-08-01; STUDENT patron T joined 2026-08-06; clock at 2026-08-21"
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "Occ", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { occ_id: $.data.id }
            - call: "POST /parking/patrons"
              payload: { full_name: "S", campus_role: "STAFF", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { s_id: $.data.id }
            - call: "POST /parking/patrons"
              payload: { full_name: "T", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { t_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LW", name: "Lot W", zone: "PERIMETER", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_w: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_w}", permit_code: "GEN", eligible_roles: ["STUDENT", "STAFF", "FACULTY"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 1 }
              as: ParkingAdmin
              captures: { alloc_w: $.data.id }
            - call: "GET /parking/allocations/${alloc_w}"
              as: ParkingAdmin
              captures: { v_w: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${occ_id}", allocation_id: "${alloc_w}", plate_number: "O000", expected_allocation_version: "${v_w}" }
              as: ParkingAdmin
              captures: { occ_permit: $.data.id }
            - call: "POST /parking/waitlist-entries"
              payload: { patron_id: "${s_id}", allocation_id: "${alloc_w}" }
              as: ParkingAdmin
              captures: { s_entry: $.data.id }
            - call: "POST /parking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: ParkingAdmin
            - call: "POST /parking/waitlist-entries"
              payload: { patron_id: "${t_id}", allocation_id: "${alloc_w}" }
              as: ParkingAdmin
              captures: { t_entry: $.data.id }
            - call: "POST /parking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T00:00:00Z" }
              as: ParkingAdmin
          trigger:
            - call: "POST /parking/permits/${occ_permit}/cancel"
              payload: {}
              as: ParkingAdmin
            - call: "GET /parking/waitlist-entries/${s_entry}"
              as: ParkingAdmin
              captures: { s_status_r1: $.data.status }
            - call: "POST /parking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-24T01:00:00Z" }
              as: ParkingAdmin
            - call: "POST /parking/allocations/${alloc_w}/extend-offers"
              payload: {}
              as: ParkingAdmin
              captures: { r2_count: $.data.offered_count, r2_ids: $.data.offered_entry_ids }
            - call: "GET /parking/waitlist-entries/${s_entry}"
              as: ParkingAdmin
              captures: { s_status_r2: $.data.status, s_declines: $.data.decline_count, s_requeues: $.data.requeue_count }
            - call: "GET /parking/waitlist-entries/${t_entry}"
              as: ParkingAdmin
              captures: { t_status_r2: $.data.status }
          assert:
            - "captured s_status_r1 == OFFERED (round 1: S score 120 = 80 + min(20,30)*2 beats T score 90 = 60 + min(15,30)*2)"
            - "captured r2_count == 1 and r2_ids == [${t_entry}] (round 2 after expiry requeue: T score 96 = 60 + 18*2 beats S score 65 = 80 - 15)"
            - "captured s_status_r2 == WAITING and s_declines == 1 and s_requeues == 1"
            - "captured t_status_r2 == OFFERED"

      - name: permit_fee_weekly_rate_rounding_order
        grounds:
          - calculations.permit_fee_calculation
          - entities.Permit.fields.fee_base_cents
        distinguishing_aspect: |
          Mode (b) combinatorial: the formula pins round-per-weekly-rate-THEN-
          multiply; base 100010 yields fee_base 43757 under the pinned order but
          43754 under the naive multiply-then-round order, while base 100000
          (exact division) yields 43750 under both — proving order sensitivity,
          not just proration.
        test_recipe:
          setup:
            - "STUDENT patron; lot with two PRORATED_WEEKLY allocations (base 100010 and 100000); clock at 2026-10-05 (7 exact weeks remain in term)"
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "R", campus_role: "STUDENT", residency: "ON_CAMPUS", primary_commute_mode: "CARPOOL" }
              as: ParkingAdmin
              captures: { r_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LR", name: "Lot R", zone: "CORE", capacity_total: 100 }
              as: ParkingAdmin
              captures: { lot_r: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_r}", permit_code: "ODD", eligible_roles: ["STUDENT"], residency_rule: "ANY", base_fee_cents: 100010, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 10 }
              as: ParkingAdmin
              captures: { alloc_odd: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_r}", permit_code: "EVEN", eligible_roles: ["STUDENT"], residency_rule: "ANY", base_fee_cents: 100000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 10 }
              as: ParkingAdmin
              captures: { alloc_even: $.data.id }
            - call: "POST /parking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T00:00:00Z" }
              as: ParkingAdmin
            - call: "GET /parking/allocations/${alloc_odd}"
              as: ParkingAdmin
              captures: { v_odd: $.data.version }
            - call: "GET /parking/allocations/${alloc_even}"
              as: ParkingAdmin
              captures: { v_even: $.data.version }
          trigger:
            - call: "POST /parking/permits"
              payload: { patron_id: "${r_id}", allocation_id: "${alloc_odd}", plate_number: "R111", valid_from: "2026-10-05", expected_allocation_version: "${v_odd}" }
              as: Commuter
              as_user_id: "${r_id}"
              captures: { odd_base: $.data.fee_base_cents, odd_total: $.data.fee_total_cents }
            - call: "POST /parking/permits"
              payload: { patron_id: "${r_id}", allocation_id: "${alloc_even}", plate_number: "R222", valid_from: "2026-10-05", expected_allocation_version: "${v_even}" }
              as: Commuter
              as_user_id: "${r_id}"
              captures: { even_base: $.data.fee_base_cents, even_total: $.data.fee_total_cents }
          assert:
            - "captured odd_base == 43757 (weekly rate round_half_up(100010/16) = 6251 rounded FIRST, then * 7; naive multiply-then-round would give 43754)"
            - "captured odd_total == 45945 (surcharge round_half_up(43757 * 0.05) = 2188 computed on the ROUNDED base)"
            - "captured even_base == 43750 and even_total == 45938 (exact division: both rounding orders agree; surcharge round_half_up(2187.5) = 2188)"

  # ---------------------------------------------------------------- rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: citation_issue_appeal_upheld_cycle
        grounds:
          - state_machines.Citation.ISSUED_to_UNDER_APPEAL
          - state_machines.Citation.UNDER_APPEAL_to_ISSUED
          - entities.Patron.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Citation machine is cyclic: ISSUED -> UNDER_APPEAL -> ISSUED on an
          UPHELD appeal, with the patron's outstanding balance dropping to 0
          while UNDER_APPEAL and returning to the full 7500 on reinstatement.
        test_recipe:
          setup:
            - "patron R holds a permit (plate R333); one NO_VALID_PERMIT citation issued against the plate on lot B"
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "R", campus_role: "STAFF", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { r_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LA", name: "Lot A", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_a: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LB", name: "Lot B", zone: "REMOTE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_b: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_a}", permit_code: "GEN", eligible_roles: ["STUDENT", "STAFF", "FACULTY"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 10 }
              as: ParkingAdmin
              captures: { alloc_a: $.data.id }
            - call: "GET /parking/allocations/${alloc_a}"
              as: ParkingAdmin
              captures: { v_a: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${r_id}", allocation_id: "${alloc_a}", plate_number: "R333", expected_allocation_version: "${v_a}" }
              as: ParkingAdmin
            - call: "POST /parking/citations"
              payload: { lot_id: "${lot_b}", plate_number: "R333", violation_type: "NO_VALID_PERMIT" }
              as: EnforcementOfficer
              as_user_id: "off-1"
              captures: { cit_id: $.data.id }
          trigger:
            - call: "GET /parking/patrons/${r_id}"
              as: ParkingAdmin
              captures: { bal_issued: $.data.outstanding_balance_cents }
            - call: "POST /parking/citations/${cit_id}/appeal"
              payload: { reason: "LPR misread plate" }
              as: Commuter
              as_user_id: "${r_id}"
              captures: { st_appealed: $.data.status }
            - call: "GET /parking/patrons/${r_id}"
              as: ParkingAdmin
              captures: { bal_appealed: $.data.outstanding_balance_cents }
            - call: "POST /parking/citations/${cit_id}/decide-appeal"
              payload: { outcome: "UPHELD" }
              as: AppealsOfficer
              as_user_id: "off-9"
              captures: { st_upheld: $.data.status, fine_upheld: $.data.fine_amount_cents }
            - call: "GET /parking/patrons/${r_id}"
              as: ParkingAdmin
              captures: { bal_upheld: $.data.outstanding_balance_cents }
          assert:
            - "captured bal_issued == 7500 and st_appealed == UNDER_APPEAL and bal_appealed == 0"
            - "captured st_upheld == ISSUED and fine_upheld == 7500 and bal_upheld == 7500"
            - "the ISSUED -> UNDER_APPEAL -> ISSUED loop completed with no balance drift"

      - name: waitlist_entry_offer_expiry_requeue_cycle
        grounds:
          - state_machines.WaitlistEntry.OFFERED_to_EXPIRED
          - state_machines.WaitlistEntry.EXPIRED_to_WAITING
          - state_machines.WaitlistEntry.EXPIRED_to_WITHDRAWN
        distinguishing_aspect: |
          WaitlistEntry machine is cyclic with a bounded loop: OFFERED -> EXPIRED
          -> WAITING repeats while requeue_count < 2; the third expiry terminates
          the cycle as WITHDRAWN — requeue counting gates loop termination.
        test_recipe:
          setup:
            - "quota-1 allocation with the occupying permit cancelled; sole WAITING entry W; offer round 1 has run (W OFFERED at 2026-08-01T00:00:00Z, expires 2026-08-04T00:00:00Z)"
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "Occ", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { occ_id: $.data.id }
            - call: "POST /parking/patrons"
              payload: { full_name: "W", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { w_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LC", name: "Lot C", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_c: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_c}", permit_code: "GEN", eligible_roles: ["STUDENT"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 1 }
              as: ParkingAdmin
              captures: { alloc_c: $.data.id }
            - call: "GET /parking/allocations/${alloc_c}"
              as: ParkingAdmin
              captures: { v_c: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${occ_id}", allocation_id: "${alloc_c}", plate_number: "O111", expected_allocation_version: "${v_c}" }
              as: ParkingAdmin
              captures: { occ_permit: $.data.id }
            - call: "POST /parking/waitlist-entries"
              payload: { patron_id: "${w_id}", allocation_id: "${alloc_c}" }
              as: ParkingAdmin
              captures: { w_entry: $.data.id }
            - call: "POST /parking/permits/${occ_permit}/cancel"
              payload: {}
              as: ParkingAdmin
          trigger:
            - call: "POST /parking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:01Z" }
              as: ParkingAdmin
            - call: "POST /parking/allocations/${alloc_c}/extend-offers"
              payload: {}
              as: ParkingAdmin
              captures: { round2: $.data.offered_count }
            - call: "GET /parking/waitlist-entries/${w_entry}"
              as: ParkingAdmin
              captures: { st_r2: $.data.status, rq_r2: $.data.requeue_count }
            - call: "POST /parking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T00:00:02Z" }
              as: ParkingAdmin
            - call: "POST /parking/allocations/${alloc_c}/extend-offers"
              payload: {}
              as: ParkingAdmin
              captures: { round3: $.data.offered_count }
            - call: "GET /parking/waitlist-entries/${w_entry}"
              as: ParkingAdmin
              captures: { st_r3: $.data.status, rq_r3: $.data.requeue_count }
            - call: "POST /parking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:03Z" }
              as: ParkingAdmin
            - call: "POST /parking/allocations/${alloc_c}/extend-offers"
              payload: {}
              as: ParkingAdmin
              captures: { round4: $.data.offered_count }
            - call: "GET /parking/waitlist-entries/${w_entry}"
              as: ParkingAdmin
              captures: { st_r4: $.data.status, dc_r4: $.data.decline_count }
          assert:
            - "after 1st sweep: st_r2 == OFFERED (requeued then immediately re-offered as sole candidate) and rq_r2 == 1"
            - "after 2nd sweep: st_r3 == OFFERED and rq_r3 == 2"
            - "after 3rd sweep: round4 == 0 and st_r4 == WITHDRAWN (requeue_count 2 == MAX_REQUEUES blocks further requeue) and dc_r4 == 3"

  # ---------------------------------------------------------------- rule 4
  - rule_id: transitive_cascade
    instances:
      - name: construction_closure_displacement_cascade
        grounds:
          - state_machines.LotClosure.SCHEDULED_to_ACTIVE
          - state_machines.LotAllocation.OPEN_to_WAITLISTING
          - entities.Permit.fields.displaced_from_allocation_id
        distinguishing_aspect: |
          Depth-3 chain from POST /parking/closures/{id}/activate: closure
          activation mutates ParkingLot.posture (link 1); the lot entering
          CLOSED_CONSTRUCTION repoints each ACTIVE permit to the fallback
          allocation (link 2); each repoint mutates source/target
          allocated_count, which itself flips the target allocation
          OPEN -> WAITLISTING at quota (link 3).
        test_recipe:
          setup:
            - "lot L1 with allocation SRC (permit_code RES, quota 2) holding one ACTIVE permit; fallback lot L2 with allocation DST (same code RES, quota 1, empty); SCHEDULED CONSTRUCTION closure on L1 with fallback L2"
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "P", campus_role: "STAFF", residency: "ON_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { p_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "L1", name: "Lot 1", zone: "CORE", capacity_total: 100 }
              as: ParkingAdmin
              captures: { lot_1: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "L2", name: "Lot 2", zone: "PERIMETER", capacity_total: 100 }
              as: ParkingAdmin
              captures: { lot_2: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_1}", permit_code: "RES", eligible_roles: ["STAFF"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 2 }
              as: ParkingAdmin
              captures: { alloc_src: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_2}", permit_code: "RES", eligible_roles: ["STAFF"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 1 }
              as: ParkingAdmin
              captures: { alloc_dst: $.data.id }
            - call: "GET /parking/allocations/${alloc_src}"
              as: ParkingAdmin
              captures: { v_src: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${p_id}", allocation_id: "${alloc_src}", plate_number: "D444", expected_allocation_version: "${v_src}" }
              as: ParkingAdmin
              captures: { permit_id: $.data.id }
            - call: "POST /parking/closures"
              payload: { lot_id: "${lot_1}", reason: "CONSTRUCTION", starts_at: "2026-08-10T00:00:00Z", ends_at: "2026-08-20T00:00:00Z", fallback_lot_id: "${lot_2}" }
              as: ParkingAdmin
              captures: { closure_id: $.data.id }
          trigger:
            - call: "POST /parking/closures/${closure_id}/activate"
              payload: {}
              as: ParkingAdmin
              captures: { cl_status: $.data.status, cl_displaced: $.data.displaced_permit_count }
            - call: "GET /parking/lots/${lot_1}"
              as: ParkingAdmin
              captures: { lot1_posture: $.data.posture }
            - call: "GET /parking/permits/${permit_id}"
              as: ParkingAdmin
              captures: { p_alloc: $.data.allocation_id, p_displaced_from: $.data.displaced_from_allocation_id }
            - call: "GET /parking/allocations/${alloc_src}"
              as: ParkingAdmin
              captures: { src_count: $.data.allocated_count, src_status: $.data.status }
            - call: "GET /parking/allocations/${alloc_dst}"
              as: ParkingAdmin
              captures: { dst_count: $.data.allocated_count, dst_status: $.data.status }
          assert:
            - "captured cl_status == ACTIVE and cl_displaced == 1"
            - "captured lot1_posture == CLOSED_CONSTRUCTION"
            - "captured p_alloc == ${alloc_dst} and p_displaced_from == ${alloc_src}"
            - "captured src_count == 0 and src_status == OPEN"
            - "captured dst_count == 1 and dst_status == WAITLISTING (displacement intake itself flipped the fallback allocation at quota 1)"

      - name: citation_issue_standing_suspension_cascade
        grounds:
          - state_machines.Permit.ACTIVE_to_SUSPENDED
          - entities.Patron.fields.standing
          - calculations.citation_fine_calculation
        distinguishing_aspect: |
          Depth-3 chain from POST /parking/citations (different trigger than the
          closure cascade): the issued citation raises the patron's outstanding
          balance (link 1); the balance crossing BLOCK_THRESHOLD flips
          patron.standing to BLOCKED (link 2); the standing flip suspends the
          patron's ACTIVE permit (link 3).
        test_recipe:
          setup:
            - "patron P holds an ACTIVE permit (plate S555); two prior NO_VALID_PERMIT citations already PAID, so the next issue is escalated to 11250 which alone crosses the 10000 block threshold"
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "P", campus_role: "STAFF", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { p_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LA", name: "Lot A", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_a: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LB", name: "Lot B", zone: "REMOTE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_b: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_a}", permit_code: "GEN", eligible_roles: ["STAFF"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 5 }
              as: ParkingAdmin
              captures: { alloc_a: $.data.id }
            - call: "GET /parking/allocations/${alloc_a}"
              as: ParkingAdmin
              captures: { v_a: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${p_id}", allocation_id: "${alloc_a}", plate_number: "S555", expected_allocation_version: "${v_a}" }
              as: ParkingAdmin
              captures: { permit_id: $.data.id }
            - call: "POST /parking/citations"
              payload: { lot_id: "${lot_b}", plate_number: "S555", violation_type: "NO_VALID_PERMIT" }
              as: EnforcementOfficer
              as_user_id: "off-1"
              captures: { c1_id: $.data.id }
            - call: "POST /parking/citations/${c1_id}/pay"
              payload: {}
              as: Commuter
              as_user_id: "${p_id}"
            - call: "POST /parking/citations"
              payload: { lot_id: "${lot_b}", plate_number: "S555", violation_type: "NO_VALID_PERMIT" }
              as: EnforcementOfficer
              as_user_id: "off-1"
              captures: { c2_id: $.data.id }
            - call: "POST /parking/citations/${c2_id}/pay"
              payload: {}
              as: Commuter
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /parking/citations"
              payload: { lot_id: "${lot_b}", plate_number: "S555", violation_type: "NO_VALID_PERMIT" }
              as: EnforcementOfficer
              as_user_id: "off-1"
              captures: { c3_fine: $.data.fine_amount_cents }
            - call: "GET /parking/patrons/${p_id}"
              as: ParkingAdmin
              captures: { p_bal: $.data.outstanding_balance_cents, p_standing: $.data.standing }
            - call: "GET /parking/permits/${permit_id}"
              as: ParkingAdmin
              captures: { permit_status: $.data.status }
          assert:
            - "captured c3_fine == 11250 (repeat escalation)"
            - "captured p_bal == 11250 and p_standing == BLOCKED (11250 >= 10000)"
            - "captured permit_status == SUSPENDED (standing flip cascaded to the permit)"

  # ---------------------------------------------------------------- rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: purchase_allocation_closed_vs_patron_blocked
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - errors[ERR_ALLOCATION_NOT_OPEN]
          - errors[ERR_PATRON_BLOCKED]
        distinguishing_aspect: |
          Pair = state vs business_fiscal: the purchase violates both
          ERR_ALLOCATION_NOT_OPEN (allocation WAITLISTING, priority 7) and
          ERR_PATRON_BLOCKED (standing BLOCKED, priority 12); the state error
          MUST win.
        test_recipe:
          setup:
            - "patron X is BLOCKED (one escalated 11250 citation ISSUED and unpaid); allocation A2 has quota 1 already filled by patron Y, so A2 is WAITLISTING"
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "X", campus_role: "STAFF", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { x_id: $.data.id }
            - call: "POST /parking/patrons"
              payload: { full_name: "Y", campus_role: "STAFF", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { y_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LA", name: "Lot A", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_a: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LB", name: "Lot B", zone: "REMOTE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_b: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_a}", permit_code: "GEN", eligible_roles: ["STAFF"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 5 }
              as: ParkingAdmin
              captures: { alloc_a: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_b}", permit_code: "GEN", eligible_roles: ["STAFF"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 1 }
              as: ParkingAdmin
              captures: { alloc_b: $.data.id }
            - call: "GET /parking/allocations/${alloc_a}"
              as: ParkingAdmin
              captures: { v_a: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${x_id}", allocation_id: "${alloc_a}", plate_number: "X666", expected_allocation_version: "${v_a}" }
              as: ParkingAdmin
            - call: "GET /parking/allocations/${alloc_b}"
              as: ParkingAdmin
              captures: { v_b1: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${y_id}", allocation_id: "${alloc_b}", plate_number: "Y111", expected_allocation_version: "${v_b1}" }
              as: ParkingAdmin
            - call: "POST /parking/citations"
              payload: { lot_id: "${lot_b}", plate_number: "X666", violation_type: "NO_VALID_PERMIT" }
              as: EnforcementOfficer
              as_user_id: "off-1"
              captures: { cx1: $.data.id }
            - call: "POST /parking/citations/${cx1}/pay"
              payload: {}
              as: Commuter
              as_user_id: "${x_id}"
            - call: "POST /parking/citations"
              payload: { lot_id: "${lot_b}", plate_number: "X666", violation_type: "NO_VALID_PERMIT" }
              as: EnforcementOfficer
              as_user_id: "off-1"
              captures: { cx2: $.data.id }
            - call: "POST /parking/citations/${cx2}/pay"
              payload: {}
              as: Commuter
              as_user_id: "${x_id}"
            - call: "POST /parking/citations"
              payload: { lot_id: "${lot_b}", plate_number: "X666", violation_type: "NO_VALID_PERMIT" }
              as: EnforcementOfficer
              as_user_id: "off-1"
          trigger:
            - call: "GET /parking/allocations/${alloc_b}"
              as: ParkingAdmin
              captures: { v_b2: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${x_id}", allocation_id: "${alloc_b}", plate_number: "X777", expected_allocation_version: "${v_b2}" }
              as: Commuter
              as_user_id: "${x_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_ALLOCATION_NOT_OPEN (HTTP 409) — the priority-7 state check fires even though the patron is also BLOCKED"
            - "no new permit exists for patron X on allocation ${alloc_b} (GET /parking/permits?patron_id filters to the single A1 permit)"

      - name: claim_offer_expired_vs_patron_blocked
        grounds:
          - validations[priority=9]
          - validations[priority=12]
          - errors[ERR_OFFER_EXPIRED]
          - errors[ERR_PATRON_BLOCKED]
        distinguishing_aspect: |
          Pair = business_temporal vs business_fiscal (a different category pair
          than rule-5 instance 1): the claim violates both ERR_OFFER_EXPIRED
          (priority 9) and ERR_PATRON_BLOCKED (priority 12); the temporal error
          MUST win, and the entry still requeues OFFERED -> EXPIRED -> WAITING.
        test_recipe:
          setup:
            - "patron Z holds an OFFERED entry on quota-1 allocation A3 (offered at 2026-08-01T00:00:00Z after the occupier cancelled); Z subsequently became BLOCKED via an unpaid escalated citation on their other permit; clock has advanced to 2026-08-04T00:00:01Z, past the 72h offer TTL"
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "Z", campus_role: "STAFF", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { z_id: $.data.id }
            - call: "POST /parking/patrons"
              payload: { full_name: "Occ", campus_role: "STAFF", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { occ_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LA", name: "Lot A", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_a: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LB", name: "Lot B", zone: "REMOTE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_b: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_a}", permit_code: "GEN", eligible_roles: ["STAFF"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 5 }
              as: ParkingAdmin
              captures: { alloc_a: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_b}", permit_code: "GEN", eligible_roles: ["STAFF"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 1 }
              as: ParkingAdmin
              captures: { alloc_b: $.data.id }
            - call: "GET /parking/allocations/${alloc_a}"
              as: ParkingAdmin
              captures: { v_a: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${z_id}", allocation_id: "${alloc_a}", plate_number: "Z888", expected_allocation_version: "${v_a}" }
              as: ParkingAdmin
            - call: "GET /parking/allocations/${alloc_b}"
              as: ParkingAdmin
              captures: { v_b: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${occ_id}", allocation_id: "${alloc_b}", plate_number: "O222", expected_allocation_version: "${v_b}" }
              as: ParkingAdmin
              captures: { occ_permit: $.data.id }
            - call: "POST /parking/waitlist-entries"
              payload: { patron_id: "${z_id}", allocation_id: "${alloc_b}" }
              as: ParkingAdmin
              captures: { z_entry: $.data.id }
            - call: "POST /parking/permits/${occ_permit}/cancel"
              payload: {}
              as: ParkingAdmin
            - call: "GET /parking/allocations/${alloc_b}"
              as: ParkingAdmin
              captures: { v_b2: $.data.version }
            - call: "POST /parking/citations"
              payload: { lot_id: "${lot_b}", plate_number: "Z888", violation_type: "NO_VALID_PERMIT" }
              as: EnforcementOfficer
              as_user_id: "off-1"
              captures: { cz1: $.data.id }
            - call: "POST /parking/citations/${cz1}/pay"
              payload: {}
              as: Commuter
              as_user_id: "${z_id}"
            - call: "POST /parking/citations"
              payload: { lot_id: "${lot_b}", plate_number: "Z888", violation_type: "NO_VALID_PERMIT" }
              as: EnforcementOfficer
              as_user_id: "off-1"
              captures: { cz2: $.data.id }
            - call: "POST /parking/citations/${cz2}/pay"
              payload: {}
              as: Commuter
              as_user_id: "${z_id}"
            - call: "POST /parking/citations"
              payload: { lot_id: "${lot_b}", plate_number: "Z888", violation_type: "NO_VALID_PERMIT" }
              as: EnforcementOfficer
              as_user_id: "off-1"
              captures: { cz3_fine: $.data.fine_amount_cents }
            - call: "POST /parking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:01Z" }
              as: ParkingAdmin
          trigger:
            - call: "POST /parking/waitlist-entries/${z_entry}/claim"
              payload: { expected_allocation_version: "${v_b2}" }
              as: Commuter
              as_user_id: "${z_id}"
              captures: { err: $.data.error_id }
            - call: "GET /parking/waitlist-entries/${z_entry}"
              as: ParkingAdmin
              captures: { z_status: $.data.status, z_requeues: $.data.requeue_count }
          assert:
            - "captured cz3_fine == 11250 (round_half_up(7500 * 1.5); escalated) so Z's outstanding balance 11250 >= 10000 makes Z BLOCKED at claim time"
            - "captured err == ERR_OFFER_EXPIRED (HTTP 422) — the priority-9 temporal check fires before the priority-12 fiscal check"
            - "captured z_status == WAITING and z_requeues == 1 (the failed claim still ran the lazy expiry requeue)"

  # ---------------------------------------------------------------- rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: quota_boundary_exact_fill_then_reject
        grounds:
          - state_machines.LotAllocation.OPEN_to_WAITLISTING
          - entities.LotAllocation.fields.allocated_count
          - errors[ERR_ALLOCATION_NOT_OPEN]
        distinguishing_aspect: |
          Seat-count metric via POST /parking/permits: the purchase that makes
          allocated_count exactly EQUAL to quota succeeds and flips the
          allocation to WAITLISTING; only the next purchase is rejected.
        test_recipe:
          setup:
            - "three STUDENT patrons; quota-2 allocation"
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "U1", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { u1: $.data.id }
            - call: "POST /parking/patrons"
              payload: { full_name: "U2", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { u2: $.data.id }
            - call: "POST /parking/patrons"
              payload: { full_name: "U3", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { u3: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LQ", name: "Lot Q", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_q: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_q}", permit_code: "GEN", eligible_roles: ["STUDENT"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 2 }
              as: ParkingAdmin
              captures: { alloc_q: $.data.id }
          trigger:
            - call: "GET /parking/allocations/${alloc_q}"
              as: ParkingAdmin
              captures: { v1: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${u1}", allocation_id: "${alloc_q}", plate_number: "U111", expected_allocation_version: "${v1}" }
              as: ParkingAdmin
            - call: "GET /parking/allocations/${alloc_q}"
              as: ParkingAdmin
              captures: { v2: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${u2}", allocation_id: "${alloc_q}", plate_number: "U222", expected_allocation_version: "${v2}" }
              as: ParkingAdmin
            - call: "GET /parking/allocations/${alloc_q}"
              as: ParkingAdmin
              captures: { cnt: $.data.allocated_count, st: $.data.status, v3: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${u3}", allocation_id: "${alloc_q}", plate_number: "U333", expected_allocation_version: "${v3}" }
              as: ParkingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "captured cnt == 2 and st == WAITLISTING (equality with quota 2 triggers the flip, not quota+1)"
            - "captured err == ERR_ALLOCATION_NOT_OPEN (HTTP 409) on the third purchase"

      - name: redemption_block_boundary_500_vs_490
        grounds:
          - calculations.incentive_points_calculation
          - entities.IncentiveAccount.fields.points_balance
          - errors[ERR_INSUFFICIENT_POINTS]
        distinguishing_aspect: |
          Points metric via POST /parking/incentive-accounts/{id}/redeem (a
          different metric and endpoint than the quota boundary): exactly
          500 points redeems one block (>= is sufficient); 490 points is
          rejected.
        test_recipe:
          setup:
            - "patron M1 (TRANSIT) enrolled with 500 points (31+19 accrued days); patron M2 (BIKE) enrolled with 490 points (31+18 accrued days)"
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "M1", campus_role: "STAFF", residency: "OFF_CAMPUS", primary_commute_mode: "TRANSIT" }
              as: ParkingAdmin
              captures: { m1: $.data.id }
            - call: "POST /parking/patrons"
              payload: { full_name: "M2", campus_role: "STAFF", residency: "OFF_CAMPUS", primary_commute_mode: "BIKE" }
              as: ParkingAdmin
              captures: { m2: $.data.id }
            - call: "POST /parking/incentive-accounts"
              payload: { patron_id: "${m1}" }
              as: Commuter
              as_user_id: "${m1}"
              captures: { acct1: $.data.id }
            - call: "POST /parking/incentive-accounts"
              payload: { patron_id: "${m2}" }
              as: Commuter
              as_user_id: "${m2}"
              captures: { acct2: $.data.id }
            - call: "POST /parking/incentive-accounts/${acct1}/accruals"
              payload: { days_commuted: 31 }
              as: ParkingAdmin
            - call: "POST /parking/incentive-accounts/${acct1}/accruals"
              payload: { days_commuted: 19 }
              as: ParkingAdmin
            - call: "POST /parking/incentive-accounts/${acct2}/accruals"
              payload: { days_commuted: 31 }
              as: ParkingAdmin
            - call: "POST /parking/incentive-accounts/${acct2}/accruals"
              payload: { days_commuted: 18 }
              as: ParkingAdmin
          trigger:
            - call: "POST /parking/incentive-accounts/${acct1}/redeem"
              payload: { blocks: 1 }
              as: Commuter
              as_user_id: "${m1}"
              captures: { pts1: $.data.points_balance, credit1: $.data.credit_balance_cents }
            - call: "POST /parking/incentive-accounts/${acct2}/redeem"
              payload: { blocks: 1 }
              as: Commuter
              as_user_id: "${m2}"
              captures: { err2: $.data.error_id }
          assert:
            - "captured pts1 == 0 and credit1 == 2500 (500 points exactly meets the block threshold)"
            - "captured err2 == ERR_INSUFFICIENT_POINTS (HTTP 422) at 490 points"

  # ---------------------------------------------------------------- rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: permit_purchase_requires_allocation_open
        grounds:
          - state_machines.LotAllocation.OPEN_to_WAITLISTING
          - validations[priority=7]
          - errors[ERR_ALLOCATION_NOT_OPEN]
        distinguishing_aspect: |
          Entity pair Permit <- LotAllocation: the Permit creation transition is
          gated on the linked LotAllocation's status being OPEN; when the
          allocation sits in WAITLISTING the purchase is rejected and the only
          available path is a waitlist join.
        test_recipe:
          setup:
            - "quota-1 allocation already filled by patron V1 (allocation WAITLISTING); patron V2 wants the same allocation"
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "V1", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { v1_id: $.data.id }
            - call: "POST /parking/patrons"
              payload: { full_name: "V2", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { v2_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LV", name: "Lot V", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_v: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_v}", permit_code: "GEN", eligible_roles: ["STUDENT"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 1 }
              as: ParkingAdmin
              captures: { alloc_v: $.data.id }
            - call: "GET /parking/allocations/${alloc_v}"
              as: ParkingAdmin
              captures: { v_v: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${v1_id}", allocation_id: "${alloc_v}", plate_number: "V111", expected_allocation_version: "${v_v}" }
              as: ParkingAdmin
            - call: "GET /parking/allocations/${alloc_v}"
              as: ParkingAdmin
              captures: { v_v2: $.data.version }
          trigger:
            - call: "POST /parking/permits"
              payload: { patron_id: "${v2_id}", allocation_id: "${alloc_v}", plate_number: "V222", expected_allocation_version: "${v_v2}" }
              as: Commuter
              as_user_id: "${v2_id}"
              captures: { err: $.data.error_id }
            - call: "POST /parking/waitlist-entries"
              payload: { patron_id: "${v2_id}", allocation_id: "${alloc_v}" }
              as: Commuter
              as_user_id: "${v2_id}"
              captures: { wl_status: $.data.status }
          assert:
            - "captured err == ERR_ALLOCATION_NOT_OPEN (Permit creation gated on LotAllocation.status)"
            - "captured wl_status == WAITING (the waitlist path is the available alternative while WAITLISTING)"

      - name: appeal_requires_citation_issued
        grounds:
          - state_machines.Citation.ISSUED_to_UNDER_APPEAL
          - validations[priority=7]
          - errors[ERR_CITATION_NOT_ISSUED]
        distinguishing_aspect: |
          Entity pair Appeal <- Citation (different pair than instance 1): the
          appeal transition exists only on a Citation in ISSUED; a PAID citation
          rejects the appeal with ERR_CITATION_NOT_ISSUED.
        test_recipe:
          setup:
            - "patron W holds a permit (plate W999); a citation against the plate has been issued and then PAID"
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "W", campus_role: "STAFF", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { w_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LA", name: "Lot A", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_a: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LB", name: "Lot B", zone: "REMOTE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_b: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_a}", permit_code: "GEN", eligible_roles: ["STAFF"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 5 }
              as: ParkingAdmin
              captures: { alloc_a: $.data.id }
            - call: "GET /parking/allocations/${alloc_a}"
              as: ParkingAdmin
              captures: { v_a: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${w_id}", allocation_id: "${alloc_a}", plate_number: "W999", expected_allocation_version: "${v_a}" }
              as: ParkingAdmin
            - call: "POST /parking/citations"
              payload: { lot_id: "${lot_b}", plate_number: "W999", violation_type: "WRONG_ZONE" }
              as: EnforcementOfficer
              as_user_id: "off-1"
              captures: { cit_id: $.data.id }
            - call: "POST /parking/citations/${cit_id}/pay"
              payload: {}
              as: Commuter
              as_user_id: "${w_id}"
          trigger:
            - call: "POST /parking/citations/${cit_id}/appeal"
              payload: { reason: "I already paid, but the signage was wrong" }
              as: Commuter
              as_user_id: "${w_id}"
              captures: { err: $.data.error_id }
            - call: "GET /parking/citations/${cit_id}"
              as: ParkingAdmin
              captures: { cit_status: $.data.status, cit_outcome: $.data.appeal_outcome }
          assert:
            - "captured err == ERR_CITATION_NOT_ISSUED (HTTP 409)"
            - "captured cit_status == PAID and cit_outcome == NONE (no appeal recorded against a terminal citation)"

  # ---------------------------------------------------------------- rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: closure_half_open_adjacency_on_lot
        grounds:
          - entities.LotClosure.fields.ends_at
          - validations[priority=9]
          - errors[ERR_CLOSURE_OVERLAP]
        distinguishing_aspect: |
          Resource ParkingLot, absolute-datetime half-open semantics
          [starts_at, ends_at): a closure beginning exactly when another ends is
          accepted, while a one-day interior intersection is rejected.
        test_recipe:
          setup:
            - "lot L with an existing SCHEDULED EVENT closure A covering [2026-08-10T00:00:00Z, 2026-08-20T00:00:00Z)"
          setup_api_calls:
            - call: "POST /parking/lots"
              payload: { lot_code: "LE", name: "Lot E", zone: "CORE", capacity_total: 200 }
              as: ParkingAdmin
              captures: { lot_e: $.data.id }
            - call: "POST /parking/closures"
              payload: { lot_id: "${lot_e}", reason: "EVENT", event_name: "GameDay", reserved_spaces: 50, starts_at: "2026-08-10T00:00:00Z", ends_at: "2026-08-20T00:00:00Z" }
              as: ParkingAdmin
              captures: { closure_a: $.data.id }
          trigger:
            - call: "POST /parking/closures"
              payload: { lot_id: "${lot_e}", reason: "EVENT", event_name: "Orientation", reserved_spaces: 30, starts_at: "2026-08-20T00:00:00Z", ends_at: "2026-08-25T00:00:00Z" }
              as: ParkingAdmin
              captures: { closure_b: $.data.id }
            - call: "POST /parking/closures"
              payload: { lot_id: "${lot_e}", reason: "EVENT", event_name: "Career Fair", reserved_spaces: 10, starts_at: "2026-08-19T00:00:00Z", ends_at: "2026-08-21T00:00:00Z" }
              as: ParkingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "closure B created successfully (adjacency: B.starts_at == A.ends_at is NOT an overlap under half-open semantics)"
            - "captured err == ERR_CLOSURE_OVERLAP (HTTP 409) for the intersecting closure C"
            - "GET /parking/closures?lot_id=${lot_e} returns exactly 2 closures"

      - name: fleet_window_buffer_conflict
        grounds:
          - entities.ShuttleRoute.fields.fleet_group
          - validations[priority=9]
          - errors[ERR_FLEET_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Resource ShuttleRoute.fleet_group, minute-of-day windows with a
          mandatory 30-minute turnover buffer (a different interval semantic
          than the lot closures' plain half-open rule): a zero-minute gap is
          rejected, while a gap of exactly 30 minutes is accepted.
        test_recipe:
          setup:
            - "transportation fund; route R1 in fleet FLEET_A with daily window 480-720 (08:00-12:00)"
          setup_api_calls:
            - call: "POST /parking/transportation-funds"
              payload: { fund_code: "PTS_OPERATING" }
              as: ParkingAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /parking/shuttle-routes"
              payload: { fund_id: "${fund_id}", route_code: "BLUE_LOOP", fleet_group: "FLEET_A", service_window_start_minutes: 480, service_window_end_minutes: 720, headway_minutes: 30, vehicle_capacity: 25, projected_daily_ridership: 400, annual_operating_cost_cents: 10000 }
              as: ParkingAdmin
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /parking/shuttle-routes"
              payload: { fund_id: "${fund_id}", route_code: "RED_LOOP", fleet_group: "FLEET_A", service_window_start_minutes: 720, service_window_end_minutes: 750, headway_minutes: 30, vehicle_capacity: 25, projected_daily_ridership: 25, annual_operating_cost_cents: 5000 }
              as: ParkingAdmin
              captures: { err: $.data.error_id }
            - call: "POST /parking/shuttle-routes"
              payload: { fund_id: "${fund_id}", route_code: "GREEN_LOOP", fleet_group: "FLEET_A", service_window_start_minutes: 750, service_window_end_minutes: 780, headway_minutes: 30, vehicle_capacity: 25, projected_daily_ridership: 25, annual_operating_cost_cents: 5000 }
              as: ParkingAdmin
              captures: { r3_status: $.data.status }
          assert:
            - "captured err == ERR_FLEET_WINDOW_CONFLICT (HTTP 409): gap 720-720 = 0 minutes < 30-minute buffer"
            - "captured r3_status == PLANNED: gap 750-720 = 30 minutes satisfies the buffer (>=), so creation succeeds"

  # ---------------------------------------------------------------- rule 9
  - rule_id: compensating_invariant
    instances:
      - name: purchase_cancel_restores_allocation_seats
        grounds:
          - state_machines.Permit.ACTIVE_to_CANCELLED
          - calculations.permit_refund_calculation
          - entities.LotAllocation.fields.allocated_count
        distinguishing_aspect: |
          Conserved quantity = allocation seat occupancy: a purchase followed by
          its compensating cancellation leaves quota - allocated_count unchanged
          (3 -> 2 -> 3) and the allocation status OPEN throughout; the full
          pre-term refund (84000) zeroes the fund's permit revenue as well.
        test_recipe:
          setup:
            - "quota-3 allocation (base 80000, full-term fee 84000 at default clock 2026-08-01, before term start); patron G"
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "G", campus_role: "STUDENT", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LG", name: "Lot G", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_g: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_g}", permit_code: "GEN", eligible_roles: ["STUDENT"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 3 }
              as: ParkingAdmin
              captures: { alloc_g: $.data.id }
            - call: "POST /parking/transportation-funds"
              payload: { fund_code: "PTS_OPERATING" }
              as: ParkingAdmin
              captures: { fund_id: $.data.id }
          trigger:
            - call: "GET /parking/allocations/${alloc_g}"
              as: ParkingAdmin
              captures: { v_g: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${g_id}", allocation_id: "${alloc_g}", plate_number: "G111", expected_allocation_version: "${v_g}" }
              as: ParkingAdmin
              captures: { permit_id: $.data.id, fee_paid: $.data.fee_paid_cents }
            - call: "GET /parking/allocations/${alloc_g}"
              as: ParkingAdmin
              captures: { cnt_mid: $.data.allocated_count }
            - call: "POST /parking/permits/${permit_id}/cancel"
              payload: {}
              as: ParkingAdmin
              captures: { refund: $.data.refund_cents, p_status: $.data.status }
            - call: "GET /parking/allocations/${alloc_g}"
              as: ParkingAdmin
              captures: { cnt_end: $.data.allocated_count, st_end: $.data.status }
            - call: "GET /parking/transportation-funds/${fund_id}"
              as: ParkingAdmin
              captures: { fund_rev: $.data.permit_revenue_cents }
          assert:
            - "captured fee_paid == 84000 (full term: clock 2026-08-01 defaults valid_from to 2026-08-03, 16 weeks)"
            - "captured cnt_mid == 1 and cnt_end == 0 and st_end == OPEN"
            - "captured refund == 84000 (cancellation before valid_from -> full refund, no admin fee)"
            - "captured fund_rev == 0 (84000 - 84000: the compensating pair leaves no revenue drift)"

      - name: issue_appeal_void_restores_outstanding_balance
        grounds:
          - state_machines.Citation.UNDER_APPEAL_to_VOIDED
          - entities.Patron.fields.outstanding_balance_cents
          - entities.Patron.fields.standing
        distinguishing_aspect: |
          Conserved quantity = patron outstanding balance (a different quantity
          than seat occupancy): issue (7500) -> appeal -> VOIDED decision returns
          outstanding_balance_cents to exactly its pre-issue value 0, with
          standing never leaving GOOD_STANDING and citation revenue untouched.
        test_recipe:
          setup:
            - "patron H holds a permit (plate H999); no citation history"
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "H", campus_role: "STAFF", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { h_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LA", name: "Lot A", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_a: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LB", name: "Lot B", zone: "REMOTE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_b: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_a}", permit_code: "GEN", eligible_roles: ["STAFF"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 5 }
              as: ParkingAdmin
              captures: { alloc_a: $.data.id }
            - call: "GET /parking/allocations/${alloc_a}"
              as: ParkingAdmin
              captures: { v_a: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${h_id}", allocation_id: "${alloc_a}", plate_number: "H999", expected_allocation_version: "${v_a}" }
              as: ParkingAdmin
            - call: "GET /parking/patrons/${h_id}"
              as: ParkingAdmin
              captures: { bal_pre: $.data.outstanding_balance_cents }
          trigger:
            - call: "POST /parking/citations"
              payload: { lot_id: "${lot_b}", plate_number: "H999", violation_type: "NO_VALID_PERMIT" }
              as: EnforcementOfficer
              as_user_id: "off-1"
              captures: { cit_id: $.data.id }
            - call: "GET /parking/patrons/${h_id}"
              as: ParkingAdmin
              captures: { bal_issued: $.data.outstanding_balance_cents }
            - call: "POST /parking/citations/${cit_id}/appeal"
              payload: { reason: "Permit was valid; LPR camera fault" }
              as: Commuter
              as_user_id: "${h_id}"
            - call: "POST /parking/citations/${cit_id}/decide-appeal"
              payload: { outcome: "VOIDED" }
              as: AppealsOfficer
              as_user_id: "off-9"
              captures: { cit_status: $.data.status, cit_outcome: $.data.appeal_outcome }
            - call: "GET /parking/patrons/${h_id}"
              as: ParkingAdmin
              captures: { bal_final: $.data.outstanding_balance_cents, standing_final: $.data.standing }
          assert:
            - "captured bal_pre == 0 and bal_issued == 7500"
            - "captured cit_status == VOIDED and cit_outcome == VOIDED"
            - "captured bal_final == 0 (== bal_pre) and standing_final == GOOD_STANDING — the issue/appeal/void pair conserved the outstanding balance"
