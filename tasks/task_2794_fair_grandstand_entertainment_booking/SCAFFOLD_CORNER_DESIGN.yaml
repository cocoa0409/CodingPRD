              payload: {}
              as: SettlementController
              as_user_id: "controller-09"
            - call: "GET /grandstand/settlements/${se_b4}"
              payload: {}
              as: SettlementController
          assert:
            - "The first approve by dual-hat-07 returns HTTP 403 with ${err_n1} == ERR_SEGREGATION_OF_DUTIES: the role check passed and the state was PENDING_APPROVAL, so the only remaining objection is that the approver is the submitter."
            - "The reject by the very same dual-hat-07 returns HTTP 200: priority 34 governs approve alone, so the submitter may send their own settlement back."
            - "After the rejection the settlement reads status 'DRAFT', rejection_reason_code 'EXPENSE_UNSUPPORTED' and revision_count == 1."
            - "The re-submit by dual-hat-07 returns HTTP 200 and re-stamps submitted_by_user_id to 'dual-hat-07', so the duties conflict is reinstated rather than cleared by the round trip."
            - "The second approve by dual-hat-07 returns HTTP 403 with ${err_n2} == ERR_SEGREGATION_OF_DUTIES: the rule is not a one-shot."
            - "The approve by controller-09 returns HTTP 200 and the settlement reads status 'APPROVED' with submitted_by_user_id 'dual-hat-07' and approved_by_user_id 'controller-09' -- two different identities on the same row, which is the whole point of the segregation model."

  # ===========================================================================
  # SECTION 8 - From the Cross-Cutting table: one instance per declared layer
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: show_booking_occ_token_guards_all_three_of_its_write_endpoints
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.ticket_scale_create_stale_booking
          - concurrency_rules.activation_create_stale_booking
          - concurrency_rules.contingency_action_create_stale_booking
          - errors.ERR_STALE_SHOW_BOOKING_VERSION
          - validations.priority_25
        distinguishing_aspect: |
          One booking's version token is exercised on all three endpoints that carry it,
          in one run: a second ticket scale, a second sponsorship activation and a
          contingency action each fail with 412 ERR_STALE_SHOW_BOOKING_VERSION when they
          echo a version that a previous successful write has already superseded, and each
          succeeds unchanged once the client re-reads. Every one of these writes is
          state-legal at the moment it is refused -- multiple scales and multiple
          activations legitimately coexist -- so nothing but the version check can be
          rejecting them.
        test_recipe:
          setup:
            - "Canonical chain to a DATE_HELD booking on 2026-08-22, VERSUS 12500000 / 0.85 / breakeven 6000000."
            - "Two SUPPORTING sponsors: Ridgeline Motors (AUTOMOTIVE) and Cascade Cola (BEVERAGE), so the two activations cannot collide on category exclusivity."
            - "No sales are ever recorded, so the contingency action's refund liability is 0 and the reserve check cannot mask the version check."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: FairOperationsDirector
