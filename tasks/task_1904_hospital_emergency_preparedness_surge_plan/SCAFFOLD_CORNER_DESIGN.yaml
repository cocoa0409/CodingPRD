scaffold_corner_design:
- section: entities
  instances:
  - name: staff_member_create_applies_defaults_and_system_fields
    claim_type: creation_defaults_system_fields
    grounds:
    - entities.StaffMember.fields.is_active
    - entities.StaffMember.fields.callback_eligible
    - entities.StaffMember.fields.callback_seniority_score
    distinguishing_aspect: Omitting optional fields applies documented defaults; system
      fields are server-minted (plain UUID id, created_at, version 1).
    test_recipe:
      setup:
      - Empty database; logical clock at startup default 2026-08-01T00:00:00Z
      setup_api_calls: []
      trigger:
      - call: POST /emergency/staff-members
        payload:
          full_name: Pat Lee
          badge_number: B-100
          department: NURSING
          role_qualifications:
          - PLANNING_CHIEF
        as: HospitalAdministrator
        captures:
          s_id: $.data.id
          s_ver: $.data.version
      assert:
      - StaffMember.${s_id}.is_active == true (default)
      - StaffMember.${s_id}.callback_eligible == false (default)
      - StaffMember.${s_id}.callback_seniority_score == 0 (default)
      - ${s_ver} == 1 and created_at == 2026-08-01T00:00:00.000Z (logical clock default)
      - id is a type-prefix-free UUID
  - name: stock_transaction_immutable_common_fields_false
    claim_type: immutability
    grounds:
    - entities.StockTransaction
    distinguishing_aspect: 'StockTransaction declares common_fields: false — responses
      carry id + created_at only; no version or updated_at keys exist.'
    test_recipe:
      setup:
      - A supply item exists
      setup_api_calls:
      - call: POST /emergency/supply-items
        payload:
          item_name: Gauze
          category: OTHER_SUPPLY
          unit: each
          reorder_min_days: 2
        as: LogisticsChief
        captures:
          item_id: $.data.id
      trigger:
      - call: POST /emergency/stock-transactions
        payload:
          supply_item_id: ${item_id}
          transaction_type: RECEIVE
          quantity: 5
          occurred_at: '2026-07-30T09:00:00Z'
        as: LogisticsChief
        captures:
          tx_id: $.data.id
      assert:
      - StockTransaction.${tx_id} response contains id and created_at
      - Response contains no version and no updated_at key
  - name: hazard_entry_risk_score_computed_input_ignored
    claim_type: computed_field_input_ignored
    grounds:
    - entities.HazardAssessment.fields.hazard_entries
    - calculations.hva_risk_score
    distinguishing_aspect: A client-supplied risk_score inside a hazard entry is ignored;
      the server computes 2*3=6 under TWO_FACTOR.
    test_recipe:
      setup:
      - Empty database
      setup_api_calls: []
      trigger:
      - call: POST /emergency/hazard-assessments
        payload:
          fiscal_year: FY2026
          scoring_model: TWO_FACTOR
          hazard_entries:
          - entry_key: HZ1
            hazard_name: Flood
            category: NATURAL
            probability: 2
            severity: 3
            preparedness: 0
            risk_score: 999
        as: EmergencyManager
        captures:
          hva: $.data.id
          mx: $.data.max_risk_score
      assert:
      - HazardAssessment.${hva} entry HZ1 risk_score == 6, not the client-sent 999
      - ${mx} == 6
  - name: get_unknown_incident_id_returns_not_found
    claim_type: not_found
    grounds:
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: GET with a well-formed but unknown UUID yields 404 ERR_NOT_FOUND
      in the error envelope.
    test_recipe:
      setup:
      - Empty database
      setup_api_calls: []
      trigger:
      - call: GET /emergency/incidents/11111111-2222-4333-8444-555555555555
        as: IncidentCommander
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_NOT_FOUND (HTTP 404)
  - name: incident_create_missing_required_field_rejected
    claim_type: required_fields
    grounds:
    - validations[priority=4]
    - entities.IncidentEvent.fields.incident_type
    distinguishing_aspect: Omitting required incident_type yields 400 ERR_INVALID_REQUEST
      before any state is persisted.
    test_recipe:
      setup:
      - Empty database
      setup_api_calls: []
      trigger:
      - call: POST /emergency/incidents
        payload:
          incident_name: No type
          declared_at: '2026-08-01T00:00:00Z'
        as: IncidentCommander
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_INVALID_REQUEST (HTTP 400)
      - GET /emergency/incidents afterwards shows zero incidents persisted
  - name: patient_create_invalid_enum_triage_rejected
    claim_type: type_constraints
    grounds:
    - entities.PatientTrackRecord.fields.triage_category
    distinguishing_aspect: triage_category outside {IMMEDIATE, DELAYED, MINOR, EXPECTANT}
      is rejected at schema validation.
    test_recipe:
      setup:
      - Incident ACTIVATED
      setup_api_calls:
      - call: POST /emergency/incidents
        payload:
          incident_name: MCI-enum
          incident_type: HUMAN
          declared_at: '2026-08-01T00:00:00Z'
        as: IncidentCommander
        captures:
          inc_id: $.data.id
      trigger:
      - call: POST /emergency/patient-records
        payload:
          incident_id: ${inc_id}
          patient_ref: P-X
          triage_category: CRITICAL
          arrival_at: '2026-08-01T00:05:00Z'
        as: PlanningChief
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_INVALID_REQUEST (HTTP 400)
  - name: staff_create_duplicate_badge_rejected
    claim_type: uniqueness_constraint
    grounds:
    - entities.StaffMember.fields.badge_number
    - errors[ERR_BADGE_NUMBER_EXISTS]
    distinguishing_aspect: badge_number uniqueness is global; the second create with
      the same badge fails 409.
    test_recipe:
      setup:
      - One staff member with badge B-200
      setup_api_calls:
      - call: POST /emergency/staff-members
        payload:
          full_name: First
          badge_number: B-200
          department: ICU
          role_qualifications: []
        as: HospitalAdministrator
      trigger:
      - call: POST /emergency/staff-members
        payload:
          full_name: Second
          badge_number: B-200
          department: ICU
          role_qualifications: []
        as: HospitalAdministrator
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_BADGE_NUMBER_EXISTS (HTTP 409)
  - name: plan_revision_self_referential_supersedes_link_queryable
    claim_type: parent_relationships
    grounds:
    - entities.PlanRevision.fields.supersedes_revision_id
    distinguishing_aspect: The self-referential supersedes link is stored and reverse-queryable
      via the filtered list endpoint.
    test_recipe:
      setup:
      - Staff u_em/u_ha; plan A APPROVED; plan B created superseding A
      setup_api_calls:
      - call: POST /emergency/staff-members
        payload:
          full_name: Em
          badge_number: B-910
          department: ADMINISTRATION
          role_qualifications: []
        as: HospitalAdministrator
        captures:
          u_em: $.data.id
      - call: POST /emergency/staff-members
        payload:
          full_name: Ha
          badge_number: B-911
          department: ADMINISTRATION
          role_qualifications: []
        as: HospitalAdministrator
        captures:
          u_ha: $.data.id
      - call: POST /emergency/plan-revisions
        payload:
          revision_label: EOP-A
          change_summary: initial
          effective_date: '2026-09-01T00:00:00Z'
        as: EmergencyManager
        as_user_id: ${u_em}
        captures:
          plan_a: $.data.id
      - call: POST /emergency/plan-revisions/${plan_a}/submit-review
        as: EmergencyManager
        as_user_id: ${u_em}
      - call: POST /emergency/plan-revisions/${plan_a}/approve
        as: HospitalAdministrator
        as_user_id: ${u_ha}
      - call: POST /emergency/plan-revisions
        payload:
          revision_label: EOP-B
          change_summary: post-HVA refresh
          effective_date: '2026-10-01T00:00:00Z'
          supersedes_revision_id: ${plan_a}
        as: EmergencyManager
        as_user_id: ${u_em}
        captures:
          plan_b: $.data.id
      trigger:
      - call: GET /emergency/plan-revisions
        payload:
          supersedes_revision_id: ${plan_a}
        as: EmergencyManager
        captures:
          hit: $.data[0].id
      assert:
      - ${hit} == ${plan_b} — the successor is found via the supersedes_revision_id
        filter
      - PlanRevision.${plan_b}.supersedes_revision_id == ${plan_a}
- section: state_machines
  instances:
  - name: plan_revision_initial_state_draft
    claim_type: initial_state
    grounds:
    - state_machines.PlanRevision
    distinguishing_aspect: A newly created PlanRevision starts in DRAFT with version
      1 and null approved_by_id.
    test_recipe:
      setup:
      - Empty database
      setup_api_calls: []
      trigger:
      - call: POST /emergency/plan-revisions
        payload:
          revision_label: EOP-init
          change_summary: first
          effective_date: '2026-09-01T00:00:00Z'
        as: EmergencyManager
        captures:
          pid: $.data.id
          st: $.data.status
      assert:
      - ${st} == DRAFT
      - PlanRevision.${pid}.approved_by_id == null and approved_at == null
  - name: plan_approve_from_draft_rejected_invalid_state
    claim_type: invalid_transition
    grounds:
    - state_machines.PlanRevision.IN_REVIEW_to_APPROVED
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: approve is only legal from IN_REVIEW; calling it on a DRAFT
      fails 409 and leaves status unchanged.
    test_recipe:
      setup:
      - Plan revision in DRAFT
      setup_api_calls:
      - call: POST /emergency/plan-revisions
        payload:
          revision_label: EOP-draft
          change_summary: x
          effective_date: '2026-09-01T00:00:00Z'
        as: EmergencyManager
        captures:
          pid: $.data.id
      trigger:
      - call: POST /emergency/plan-revisions/${pid}/approve
        as: HospitalAdministrator
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_INVALID_STATE (HTTP 409)
      - PlanRevision.${pid}.status remains DRAFT
  - name: patient_terminal_discharge_lockdown_rejected
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.PatientTrackRecord
    distinguishing_aspect: 'DISCHARGED is terminal: a second discharge is rejected
      and no timestamps move.'
    test_recipe:
      setup:
      - Incident ACTIVATED; patient TRACKED
      setup_api_calls:
      - call: POST /emergency/incidents
        payload:
          incident_name: MCI-lock
          incident_type: NATURAL
          declared_at: '2026-08-01T00:00:00Z'
        as: IncidentCommander
        captures:
          inc_id: $.data.id
      - call: POST /emergency/patient-records
        payload:
          incident_id: ${inc_id}
          patient_ref: P-L
          triage_category: MINOR
          arrival_at: '2026-08-01T00:05:00Z'
        as: PlanningChief
        captures:
          p1: $.data.id
      - call: POST /emergency/patient-records/${p1}/discharge
        as: PlanningChief
      trigger:
      - call: POST /emergency/patient-records/${p1}/discharge
        as: PlanningChief
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_INVALID_STATE (HTTP 409)
      - PatientTrackRecord.${p1}.status remains DISCHARGED
  - name: improvement_task_skip_in_progress_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.ImprovementTask
    distinguishing_aspect: OPEN may not jump directly to VERIFIED_COMPLETE; the machine
      requires the IN_PROGRESS hop first.
    test_recipe:
      setup:
      - Incident demobilized; AAR (INCIDENT subject) DRAFT; task OPEN
      setup_api_calls:
      - call: POST /emergency/incidents
        payload:
          incident_name: MCI-task
          incident_type: NATURAL
          declared_at: '2026-08-01T00:00:00Z'
        as: IncidentCommander
        captures:
          inc_id: $.data.id
      - call: POST /emergency/incidents/${inc_id}/demobilize
        as: IncidentCommander
      - call: POST /emergency/after-action-reports
        payload:
          subject_type: INCIDENT
          subject_id: ${inc_id}
          summary: AAR body
        as: IncidentCommander
        captures:
          aar: $.data.id
      - call: POST /emergency/improvement-tasks
        payload:
          after_action_report_id: ${aar}
          description: Fix cache signage
          priority: LOW
          due_date: '2026-08-10T00:00:00Z'
          assigned_department: LOGISTICS
        as: EmergencyManager
        captures:
          task: $.data.id
      trigger:
      - call: PATCH /emergency/improvement-tasks/${task}
        payload:
          target_status: VERIFIED_COMPLETE
        as: EmergencyManager
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_INVALID_STATE (HTTP 409)
      - ImprovementTask.${task}.status remains OPEN
  - name: exercise_cancel_in_progress_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.ExerciseEvent.SCHEDULED_to_CANCELLED
    distinguishing_aspect: CANCELLED is reachable only from SCHEDULED; cancelling
      a started drill fails.
    test_recipe:
      setup:
      - Staff u_em/u_ha; plan APPROVED; exercise started
      setup_api_calls:
      - call: POST /emergency/staff-members
        payload:
          full_name: Em
          badge_number: B-920
          department: ADMINISTRATION
          role_qualifications: []
        as: HospitalAdministrator
        captures:
          u_em: $.data.id
      - call: POST /emergency/staff-members
        payload:
          full_name: Ha
          badge_number: B-921
          department: ADMINISTRATION
          role_qualifications: []
        as: HospitalAdministrator
        captures:
          u_ha: $.data.id
      - call: POST /emergency/plan-revisions
        payload:
          revision_label: EOP-cancel
          change_summary: x
          effective_date: '2026-09-01T00:00:00Z'
        as: EmergencyManager
        as_user_id: ${u_em}
        captures:
          plan_id: $.data.id
      - call: POST /emergency/plan-revisions/${plan_id}/submit-review
        as: EmergencyManager
        as_user_id: ${u_em}
      - call: POST /emergency/plan-revisions/${plan_id}/approve
        as: HospitalAdministrator
        as_user_id: ${u_ha}
      - call: POST /emergency/exercises
        payload:
          exercise_name: Live drill
          exercise_type: FULL_SCALE
          scenario_category: HUMAN
          scheduled_start: '2026-09-05T08:00:00Z'
          scheduled_end: '2026-09-05T12:00:00Z'
          plan_revision_id: ${plan_id}
        as: EmergencyManager
        captures:
          ex_id: $.data.id
      - call: POST /emergency/exercises/${ex_id}/start
        as: EmergencyManager
      trigger:
      - call: POST /emergency/exercises/${ex_id}/cancel
        as: EmergencyManager
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_INVALID_STATE (HTTP 409)
      - ExerciseEvent.${ex_id}.status remains IN_PROGRESS
  - name: improvement_task_clock_sweep_marks_overdue
    claim_type: automatic_transition
    grounds:
    - state_machines.ImprovementTask.OPEN_to_OVERDUE
    - entities.ImprovementTask.fields.due_date
    distinguishing_aspect: The clock sweep flips an OPEN task to OVERDUE only when
      the new time is strictly past due_date.
    test_recipe:
      setup:
      - Incident demobilized; AAR DRAFT; task OPEN with due_date 2026-08-02T00:00:00Z
      setup_api_calls:
      - call: POST /emergency/incidents
        payload:
          incident_name: MCI-overdue
          incident_type: NATURAL
          declared_at: '2026-08-01T00:00:00Z'
        as: IncidentCommander
        captures:
          inc_id: $.data.id
      - call: POST /emergency/incidents/${inc_id}/demobilize
        as: IncidentCommander
      - call: POST /emergency/after-action-reports
        payload:
          subject_type: INCIDENT
          subject_id: ${inc_id}
          summary: AAR
        as: IncidentCommander
        captures:
          aar: $.data.id
      - call: POST /emergency/improvement-tasks
        payload:
          after_action_report_id: ${aar}
          description: Restock trailer
          priority: HIGH
          due_date: '2026-08-02T00:00:00Z'
          assigned_department: LOGISTICS
        as: EmergencyManager
        captures:
          task: $.data.id
      trigger:
      - call: POST /emergency/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T00:00:00Z'
        as: PlatformAdmin
        captures:
          swept: $.data.swept_tasks
      - call: GET /emergency/improvement-tasks/${task}
        as: EmergencyManager
        captures:
          st: $.data.status
      assert:
      - ${swept} == 1
      - ${st} == OVERDUE
  - name: callback_request_clock_sweep_expires_pending
    claim_type: automatic_transition
    grounds:
    - state_machines.CallBackRequest.PENDING_to_EXPIRED
    - entities.CallBackRequest.fields.expires_at
    distinguishing_aspect: A PENDING request with response_window_hours 2 expires
      when the clock passes created_at + 2h (strictly greater).
    test_recipe:
      setup:
      - Callback-eligible staff; ACTIVATED incident; PENDING request created at the
        2026-08-01T00:00:00Z default clock (expires_at 2026-08-01T02:00:00Z)
      setup_api_calls:
      - call: POST /emergency/staff-members
        payload:
          full_name: E Five
          badge_number: B-505
          department: ICU
          role_qualifications: []
          callback_eligible: true
          callback_seniority_score: 5
        as: HospitalAdministrator
        captures:
          s1: $.data.id
      - call: POST /emergency/incidents
        payload:
          incident_name: MCI-exp
          incident_type: HUMAN
          declared_at: '2026-08-01T00:00:00Z'
        as: IncidentCommander
        captures:
          inc_id: $.data.id
      - call: POST /emergency/callback-requests
        payload:
          incident_id: ${inc_id}
          staff_member_id: ${s1}
          response_window_hours: 2
        as: PlanningChief
        captures:
          cb1: $.data[0].id
      trigger:
      - call: POST /emergency/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T02:00:01Z'
        as: PlatformAdmin
        captures:
          swept: $.data.swept_callbacks
      - call: GET /emergency/callback-requests/${cb1}
        as: PlanningChief
        captures:
          st: $.data.status
      assert:
      - CallBackRequest.${cb1}.expires_at == 2026-08-01T02:00:00.000Z
      - ${swept} == 1
      - ${st} == EXPIRED
  - name: command_assignment_reassignment_relieves_prior
    claim_type: side_effect_execution
    grounds:
    - state_machines.CommandRoleAssignment.ACTIVE_to_RELIEVED
    - concurrency_rules[command-assignment-stale-incident]
    distinguishing_aspect: Creating a fresh assignment for an occupied (incident,
      command_role) slot relieves the previous holder; both rows remain queryable.
    test_recipe:
      setup:
      - Incident ACTIVATED (version 1); two staff qualified for INCIDENT_COMMANDER
      setup_api_calls:
      - call: POST /emergency/staff-members
        payload:
          full_name: Q One
          badge_number: B-601
          department: ADMINISTRATION
          role_qualifications:
          - INCIDENT_COMMANDER
        as: HospitalAdministrator
        captures:
          q1: $.data.id
      - call: POST /emergency/staff-members
        payload:
          full_name: Q Two
          badge_number: B-602
          department: ADMINISTRATION
          role_qualifications:
          - INCIDENT_COMMANDER
        as: HospitalAdministrator
        captures:
          q2: $.data.id
      - call: POST /emergency/incidents
        payload:
          incident_name: MCI-relieve
          incident_type: HUMAN
          declared_at: '2026-08-01T00:00:00Z'
        as: IncidentCommander
        captures:
          inc_id: $.data.id
          v0: $.data.version
      - call: POST /emergency/command-assignments
        payload:
          incident_id: ${inc_id}
          staff_member_id: ${q1}
          command_role: INCIDENT_COMMANDER
          expected_incident_version: ${v0}
        as: IncidentCommander
        captures:
          a1: $.data.id
      - call: GET /emergency/incidents/${inc_id}
        as: IncidentCommander
        captures:
          v1: $.data.version
      trigger:
      - call: POST /emergency/command-assignments
        payload:
          incident_id: ${inc_id}
          staff_member_id: ${q2}
          command_role: INCIDENT_COMMANDER
          expected_incident_version: ${v1}
        as: IncidentCommander
        captures:
          a2: $.data.id
      - call: GET /emergency/command-assignments
        payload:
          incident_id: ${inc_id}
          status: RELIEVED
        as: IncidentCommander
        captures:
          relieved: $.data[0].id
      assert:
      - CommandRoleAssignment.${a1}.status == RELIEVED
      - ${relieved} == ${a1}
      - CommandRoleAssignment.${a2}.status == ACTIVE
  - name: plan_approval_supersedes_predecessor
    claim_type: side_effect_execution
    grounds:
    - state_machines.PlanRevision.APPROVED_to_SUPERSEDED
    distinguishing_aspect: Approving a successor flips its supersedes target APPROVED→SUPERSEDED,
      preserving the at-most-one-APPROVED invariant.
    test_recipe:
      setup:
      - Staff u_em/u_ha; plan A APPROVED; plan B (supersedes A) IN_REVIEW
      setup_api_calls:
      - call: POST /emergency/staff-members
        payload:
          full_name: Em
          badge_number: B-930
          department: ADMINISTRATION
          role_qualifications: []
        as: HospitalAdministrator
        captures:
          u_em: $.data.id
      - call: POST /emergency/staff-members
        payload:
          full_name: Ha
          badge_number: B-931
          department: ADMINISTRATION
          role_qualifications: []
        as: HospitalAdministrator
        captures:
          u_ha: $.data.id
      - call: POST /emergency/plan-revisions
        payload:
          revision_label: EOP-A
          change_summary: initial
          effective_date: '2026-09-01T00:00:00Z'
        as: EmergencyManager
        as_user_id: ${u_em}
        captures:
          plan_a: $.data.id
      - call: POST /emergency/plan-revisions/${plan_a}/submit-review
        as: EmergencyManager
        as_user_id: ${u_em}
      - call: POST /emergency/plan-revisions/${plan_a}/approve
        as: HospitalAdministrator
        as_user_id: ${u_ha}
      - call: POST /emergency/plan-revisions
        payload:
          revision_label: EOP-B
          change_summary: successor
          effective_date: '2026-10-01T00:00:00Z'
          supersedes_revision_id: ${plan_a}
        as: EmergencyManager
        as_user_id: ${u_em}
        captures:
          plan_b: $.data.id
      - call: POST /emergency/plan-revisions/${plan_b}/submit-review
        as: EmergencyManager
        as_user_id: ${u_em}
      trigger:
      - call: POST /emergency/plan-revisions/${plan_b}/approve
        as: HospitalAdministrator
        as_user_id: ${u_ha}
      - call: GET /emergency/plan-revisions/${plan_a}
        as: EmergencyManager
        captures:
          st_a: $.data.status
      assert:
      - PlanRevision.${plan_b}.status == APPROVED
      - ${st_a} == SUPERSEDED
  - name: incident_demobilize_transitions_callbacks_and_sites
    claim_type: cascade_down
    grounds:
    - state_machines.IncidentEvent.ACTIVATED_to_DEACTIVATED
    - state_machines.CallBackRequest.PENDING_to_EXPIRED
    - state_machines.CallBackRequest.ACCEPTED_to_COMPLETED
    - state_machines.AlternateCareSite.ACTIVATED_to_DEMOBILIZED
    distinguishing_aspect: Demobilize sweeps each callback by its own state (PENDING→EXPIRED,
      ACCEPTED→COMPLETED) and demobilizes the incident's ACTIVATED site.
    test_recipe:
      setup:
      - Two eligible staff; incident ACTIVATED; site COMMITTED+ACTIVATED; cb1 PENDING
        (s1), cb2 ACCEPTED (s2); no patients
      setup_api_calls:
      - call: POST /emergency/staff-members
        payload:
          full_name: F Six
          badge_number: B-506
          department: ICU
          role_qualifications: []
          callback_eligible: true
          callback_seniority_score: 60
        as: HospitalAdministrator
        captures:
          s1: $.data.id
      - call: POST /emergency/staff-members
        payload:
          full_name: G Seven
          badge_number: B-507
          department: ICU
          role_qualifications: []
          callback_eligible: true
          callback_seniority_score: 55
        as: HospitalAdministrator
        captures:
          s2: $.data.id
      - call: POST /emergency/incidents
        payload:
          incident_name: MCI-demob
          incident_type: NATURAL
          declared_at: '2026-08-01T00:00:00Z'
        as: IncidentCommander
        captures:
          inc_id: $.data.id
      - call: POST /emergency/alternate-care-sites
        payload:
          site_name: School Gym
          address: 3 School Ln
          bed_capacity: 30
        as: LogisticsChief
        captures:
          site_id: $.data.id
      - call: POST /emergency/alternate-care-sites/${site_id}/commit
        payload:
          incident_id: ${inc_id}
          window_start: '2026-07-31T00:00:00Z'
          window_end: '2026-08-05T00:00:00Z'
        as: IncidentCommander
      - call: POST /emergency/alternate-care-sites/${site_id}/activate
        as: IncidentCommander
      - call: POST /emergency/callback-requests
        payload:
          incident_id: ${inc_id}
          staff_member_id: ${s1}
        as: PlanningChief
        captures:
          cb1: $.data[0].id
      - call: POST /emergency/callback-requests
        payload:
          incident_id: ${inc_id}
          staff_member_id: ${s2}
        as: PlanningChief
        captures:
          cb2: $.data[0].id
      - call: POST /emergency/callback-requests/${cb2}/respond
        payload:
          outcome: ACCEPT
        as: OnCallStaff
        as_user_id: ${s2}
      trigger:
      - call: POST /emergency/incidents/${inc_id}/demobilize
        as: IncidentCommander
      - call: GET /emergency/callback-requests/${cb1}
        as: PlanningChief
        captures:
          st1: $.data.status
      - call: GET /emergency/callback-requests/${cb2}
        as: PlanningChief
        captures:
