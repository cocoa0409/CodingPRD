# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Probe)
# task_2878_trade_promotion_planning_deduction_management
#
# The nine `section:` values below are exactly the nine sections of
# references/claim-extraction-guide.md, and every `claim_type:` is a row of that
# section's table (snake_cased). Rows that this scaffold's §1.1-§1.7 surface does
# not exhibit are skipped without ceremony (soft_delete, idempotency-key,
# multi_tenancy, scheduled_actions, bulk transactional rollback, eventual /
# saga consistency, hierarchical / graph topology, compound state derivation).
#
# Corners already asserted by a §1.8 instance carry `excluded_because:` and NO
# test_recipe. Everything else carries a full, empty-DB-reachable recipe.
#
# Negative triggers carry `captures: { err: $.data.error_id }` so the intent of
# the call (the server MUST reject this exact role/payload) is machine-visible.
#
# Fixture user ids: dir-1 / dir-2 (TradeMarketingDirector), kam-1 / kam-2
# (KeyAccountManager), fin-1 / fin-2 (TradeFinanceAnalyst), ded-1 / ded-2
# (DeductionSpecialist), aud-1 (ComplianceAuditor). A CustomerPortalUser's
# X-User-ID is always the Customer.id it acts as.
#
# Every numeric literal in an `assert:` line was computed against the §1.3
# formulas with Decimal ROUND_HALF_UP arithmetic before being written here.
# Every date literal was checked to be a Monday where §1.1 requires one.
#
# Error-code coverage map (all 62 codes of §1.6 are triggered somewhere):
#   * 12 NOT_FOUND codes ....... errors / unresolvable_path_ids_each_map_to_their_own_404_code
#   * 7 auth+authz codes ....... rbac section
#   * ERR_INVALID_REQUEST ...... entities / allocation_create_with_null_planned_amount...
#                                and entities / customer_create_with_undeclared_channel...
#   * 2 OCC codes .............. cross-cutting complexity layers section
#   * the remaining 40 ......... errors / validations / state_machines / calculations
#                                sections below, plus the §1.8 instances the
#                                `excluded_because:` stubs name
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # 1. From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:
      - name: program_creation_returns_the_full_declared_field_set
        claim_type: creation
        grounds:
          - entities.TradeProgram
          - endpoints[POST /trade-marketing/programs]
          - calculations.program_budget_rollup
        distinguishing_aspect: |
          A POST with only the three required fields returns 201 and every §1.1 field of
          TradeProgram in one envelope: the system field status == OPEN, the two computed
          rollup fields at their empty-DB values 0.00 and 100000.00, and version == 1.
        test_recipe:
          setup:
            - "Empty database, logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
          trigger:
            - call: "POST /trade-marketing/programs"
              payload: { fiscal_year: 2026, name: "FY2026 National Trade Fund", total_budget_amount: 100000.00 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { new_prog_id: $.data.id, new_prog_v: $.data.version }
          assert:
            - "HTTP status is 201"
            - "response_type == \"object\" and meta.api_request_id and meta.api_request_timestamp are both present"
            - "TradeProgram.${new_prog_id}.fiscal_year == 2026 and .name == \"FY2026 National Trade Fund\""
            - "TradeProgram.${new_prog_id}.total_budget_amount == 100000.00"
            - "TradeProgram.${new_prog_id}.status == OPEN"
            - "TradeProgram.${new_prog_id}.allocated_amount == 0.00"
            - "TradeProgram.${new_prog_id}.unallocated_amount == 100000.00"
            - "TradeProgram.${new_prog_id}.version == 1 and created_at is the logical clock instant 2026-08-01T00:00:00Z"

      - name: program_omitting_accrual_method_default_inherits_shipment
        claim_type: defaults
        grounds:
          - entities.TradeProgram.fields.accrual_method_default
          - entities.Promotion.fields.accrual_method
        distinguishing_aspect: |
          Omitting accrual_method_default stores SHIPMENT, and a promotion created under
          that program without accrual_method inherits SHIPMENT rather than null — the
          default is applied twice, once per entity, from a single omission.
        test_recipe:
          setup:
            - "Program created WITHOUT accrual_method_default; brand, customer and an APPROVED allocation under it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/programs"
              payload: { fiscal_year: 2026, name: "FY2026 Default Basis Fund", total_budget_amount: 500000.00 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { prog_id: $.data.id, prog_basis: $.data.accrual_method_default }
            - call: "POST /trade-marketing/brands"
              payload: { program_id: "${prog_id}", name: "Crisp Oat Cereal", list_price_per_case: 24.00, cogs_per_case: 8.70, baseline_units_per_week: 1200 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { brand_id: $.data.id }
            - call: "POST /trade-marketing/customers"
              payload: { program_id: "${prog_id}", name: "MegaMart", channel: "GROCERY" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { cust_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations"
              payload: { program_id: "${prog_id}", customer_id: "${cust_id}", brand_id: "${brand_id}", event_type: "SEASONAL", planned_amount: 100000.00, baseline_units: 40000, planned_incremental_units: 20000 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations/${alloc_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_v1: $.data.version }
          trigger:
            - call: "POST /trade-marketing/promotions"
              payload: { allocation_id: "${alloc_id}", name: "Inherited Basis Event", window_start: "2026-08-03", window_end: "2026-08-31", expected_allocation_version: "${alloc_v1}" }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { promo_id: $.data.id }
          assert:
            - "TradeProgram.${prog_id}.accrual_method_default == SHIPMENT"
            - "Promotion.${promo_id}.accrual_method == SHIPMENT"
            - "Promotion.${promo_id}.lifecycle_status == DRAFT and .spend_status == WITHIN_BUDGET and .performance_flag == UNRATED and .revision_round == 0"

      - name: customer_creation_defaults_policy_and_both_state_axes
        claim_type: defaults
        grounds:
          - entities.Customer.fields.deduction_validation_policy
          - entities.Customer.fields.trading_status
          - entities.Customer.fields.audit_status
          - entities.Customer.fields.compliance_penalty_points
        distinguishing_aspect: |
          One POST that omits deduction_validation_policy lands four independent defaults:
          policy EVIDENCE_BASED, trading_status ACTIVE, audit_status CLEAR and
          compliance_penalty_points 0 — the two state axes start independently, and
          credit_hold_reason stays null.
        test_recipe:
          setup:
            - "One OPEN program."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/programs"
              payload: { fiscal_year: 2026, name: "FY2026 National Trade Fund", total_budget_amount: 500000.00, accrual_method_default: "CONSUMPTION" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /trade-marketing/customers"
              payload: { program_id: "${prog_id}", name: "MegaMart", channel: "GROCERY" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { cust_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Customer.${cust_id}.deduction_validation_policy == EVIDENCE_BASED"
            - "Customer.${cust_id}.trading_status == ACTIVE and .audit_status == CLEAR"
            - "Customer.${cust_id}.compliance_penalty_points == 0 and .credit_hold_reason == null"
            - "Customer.${cust_id}.open_deduction_amount == 0.00 and .write_off_ytd_amount == 0.00"

      - name: brand_unit_margin_is_computed_from_price_minus_cost
        claim_type: computed_fields
        grounds:
          - entities.Brand.fields.unit_margin
          - entities.Brand.fields.list_price_per_case
          - entities.Brand.fields.cogs_per_case
        distinguishing_aspect: |
          unit_margin is not an input: the create response carries
          round(24.00 - 8.70, 2) == 15.30 computed by the server, and the field cannot be
          supplied because it is absent from the endpoint's input list.
        test_recipe:
          setup:
            - "One OPEN program."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/programs"
              payload: { fiscal_year: 2026, name: "FY2026 National Trade Fund", total_budget_amount: 500000.00, accrual_method_default: "CONSUMPTION" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /trade-marketing/brands"
              payload: { program_id: "${prog_id}", name: "Crisp Oat Cereal", list_price_per_case: 24.00, cogs_per_case: 8.70, baseline_units_per_week: 1200 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { brand_id: $.data.id }
          assert:
            - "Brand.${brand_id}.unit_margin == 15.30"
            - "Brand.${brand_id}.baseline_units_per_week == 1200"
            - "Brand.${brand_id}.program_id == ${prog_id}"

      - name: promotion_system_and_copied_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.Promotion.fields.customer_id
          - entities.Promotion.fields.brand_id
          - entities.Promotion.fields.approved_by_user_id
          - entities.Promotion.fields.lifecycle_status
        distinguishing_aspect: |
          customer_id and brand_id are absent from the create endpoint's input list and are
          copied from the parent BudgetAllocation, while approved_by_user_id stays null and
          version starts at 1 — the client cannot seed any of the four.
        test_recipe:
          setup:
            - "One OPEN program, one brand, one customer, one APPROVED allocation joining them."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/programs"
              payload: { fiscal_year: 2026, name: "FY2026 National Trade Fund", total_budget_amount: 500000.00, accrual_method_default: "CONSUMPTION" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { prog_id: $.data.id }
            - call: "POST /trade-marketing/brands"
              payload: { program_id: "${prog_id}", name: "Crisp Oat Cereal", list_price_per_case: 24.00, cogs_per_case: 8.70, baseline_units_per_week: 1200 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { brand_id: $.data.id }
            - call: "POST /trade-marketing/customers"
              payload: { program_id: "${prog_id}", name: "MegaMart", channel: "GROCERY", deduction_validation_policy: "EVIDENCE_BASED" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { cust_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations"
              payload: { program_id: "${prog_id}", customer_id: "${cust_id}", brand_id: "${brand_id}", event_type: "SEASONAL", planned_amount: 100000.00, baseline_units: 40000, planned_incremental_units: 20000 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations/${alloc_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_v1: $.data.version }
          trigger:
            - call: "POST /trade-marketing/promotions"
              payload: { allocation_id: "${alloc_id}", name: "August Cereal Event", window_start: "2026-08-03", window_end: "2026-08-31", accrual_method: "CONSUMPTION", expected_allocation_version: "${alloc_v1}" }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { promo_id: $.data.id }
          assert:
            - "Promotion.${promo_id}.customer_id == ${cust_id} and .brand_id == ${brand_id}"
            - "Promotion.${promo_id}.approved_by_user_id == null"
            - "Promotion.${promo_id}.lifecycle_status == DRAFT and .version == 1"
            - "Promotion.${promo_id}.tactic_subtotal_amount == 0.00 and .planned_total_spend == 0.00 and .committed_units == 0"
            - "Promotion.${promo_id}.spend_ratio == 0.0000 and .commitment_verified == true"

      - name: promotion_read_by_id_returns_the_stored_planning_row
        claim_type: retrieval
        grounds:
          - entities.Promotion
          - endpoints[GET /trade-marketing/promotions/{promotionId}]
        distinguishing_aspect: |
          A GET by id after two tactic lines returns exactly the persisted planning figures
          (tactic_subtotal_amount 12000.00, allowance_rate 0.020, planned_total_spend
          12240.00, committed_units 12000) with no recomputation drift against the create
          and tactic responses.
        test_recipe:
          setup:
            - "One DRAFT promotion under an APPROVED allocation, carrying two TPR lines: 4000 cases at 1.000 and 8000 cases at 1.000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/programs"
              payload: { fiscal_year: 2026, name: "FY2026 National Trade Fund", total_budget_amount: 500000.00, accrual_method_default: "CONSUMPTION" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { prog_id: $.data.id }
            - call: "POST /trade-marketing/brands"
              payload: { program_id: "${prog_id}", name: "Crisp Oat Cereal", list_price_per_case: 24.00, cogs_per_case: 8.70, baseline_units_per_week: 1200 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { brand_id: $.data.id }
            - call: "POST /trade-marketing/customers"
              payload: { program_id: "${prog_id}", name: "MegaMart", channel: "GROCERY", deduction_validation_policy: "EVIDENCE_BASED" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { cust_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations"
              payload: { program_id: "${prog_id}", customer_id: "${cust_id}", brand_id: "${brand_id}", event_type: "SEASONAL", planned_amount: 100000.00, baseline_units: 40000, planned_incremental_units: 20000 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations/${alloc_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_v1: $.data.version }
            - call: "POST /trade-marketing/promotions"
              payload: { allocation_id: "${alloc_id}", name: "August Cereal Event", window_start: "2026-08-03", window_end: "2026-08-31", accrual_method: "CONSUMPTION", expected_allocation_version: "${alloc_v1}" }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { promo_id: $.data.id }
            - call: "POST /trade-marketing/promotions/${promo_id}/tactics"
              payload: { tactic_type: "TPR", planned_units: 4000, window_start: "2026-08-03", window_end: "2026-08-17", rate_per_case: 1.000 }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { tac_a_id: $.data.id }
            - call: "POST /trade-marketing/promotions/${promo_id}/tactics"
              payload: { tactic_type: "TPR", planned_units: 8000, window_start: "2026-08-17", window_end: "2026-08-31", rate_per_case: 1.000 }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { tac_b_id: $.data.id }
          trigger:
            - call: "GET /trade-marketing/promotions/${promo_id}"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
          assert:
            - "HTTP status is 200 and response_type == \"object\""
            - "Promotion.${promo_id}.tactic_subtotal_amount == 12000.00"
            - "Promotion.${promo_id}.allowance_rate == 0.020 and .off_invoice_allowance_amount == 240.00"
            - "Promotion.${promo_id}.planned_total_spend == 12240.00 and .committed_units == 12000"
            - "Promotion.${promo_id}.window_start == \"2026-08-03\" and .window_end == \"2026-08-31\""

      - name: tactic_list_of_a_promotion_is_paginated_and_ordered_by_created_at
        claim_type: listing
        grounds:
          - endpoints[GET /trade-marketing/promotions/{promotionId}/tactics]
          - response_envelope.pagination_fields
          - entities.PromotionTactic
        distinguishing_aspect: |
          With three tactic lines and limit 2 / offset 0 the envelope reports
          total_count 3, has_more true and returns the first two lines in created_at ASC
          order; limit 2 / offset 2 reports has_more false and returns only the third.
        test_recipe:
          setup:
            - "One DRAFT promotion carrying three tactic lines created in a known order: TPR week 1, TPR week 3, DISPLAY week 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/programs"
              payload: { fiscal_year: 2026, name: "FY2026 National Trade Fund", total_budget_amount: 500000.00, accrual_method_default: "CONSUMPTION" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { prog_id: $.data.id }
            - call: "POST /trade-marketing/brands"
              payload: { program_id: "${prog_id}", name: "Crisp Oat Cereal", list_price_per_case: 24.00, cogs_per_case: 8.70, baseline_units_per_week: 1200 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { brand_id: $.data.id }
            - call: "POST /trade-marketing/customers"
              payload: { program_id: "${prog_id}", name: "MegaMart", channel: "GROCERY", deduction_validation_policy: "EVIDENCE_BASED" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { cust_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations"
              payload: { program_id: "${prog_id}", customer_id: "${cust_id}", brand_id: "${brand_id}", event_type: "SEASONAL", planned_amount: 100000.00, baseline_units: 40000, planned_incremental_units: 20000 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations/${alloc_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_v1: $.data.version }
            - call: "POST /trade-marketing/promotions"
              payload: { allocation_id: "${alloc_id}", name: "August Cereal Event", window_start: "2026-08-03", window_end: "2026-08-31", accrual_method: "CONSUMPTION", expected_allocation_version: "${alloc_v1}" }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { promo_id: $.data.id }
            - call: "POST /trade-marketing/promotions/${promo_id}/tactics"
              payload: { tactic_type: "TPR", planned_units: 4000, window_start: "2026-08-03", window_end: "2026-08-10", rate_per_case: 1.000 }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { tac_1_id: $.data.id }
            - call: "POST /trade-marketing/promotions/${promo_id}/tactics"
              payload: { tactic_type: "TPR", planned_units: 4000, window_start: "2026-08-17", window_end: "2026-08-24", rate_per_case: 1.000 }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { tac_2_id: $.data.id }
            - call: "POST /trade-marketing/promotions/${promo_id}/tactics"
              payload: { tactic_type: "DISPLAY", planned_units: 500, window_start: "2026-08-03", window_end: "2026-08-10", fixed_fee: 900.00 }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { tac_3_id: $.data.id }
          trigger:
            - call: "GET /trade-marketing/promotions/${promo_id}/tactics"
              payload: { limit: 2, offset: 0 }
              as: KeyAccountManager
              as_user_id: "kam-1"
            - call: "GET /trade-marketing/promotions/${promo_id}/tactics"
              payload: { limit: 2, offset: 2 }
              as: KeyAccountManager
              as_user_id: "kam-1"
          assert:
            - "First trigger: response_type == \"array\", total_count == 3, has_more == true, limit == 2, offset == 0"
            - "First trigger: data[0].id == ${tac_1_id} and data[1].id == ${tac_2_id} (created_at ASC)"
            - "Second trigger: total_count == 3, has_more == false, and data is exactly [${tac_3_id}]"
            - "PromotionTactic.${tac_3_id}.line_planned_spend == 900.00 and .week_count == 1"

      - name: unresolvable_path_ids_each_map_to_their_own_404_code
        claim_type: not_found
        grounds:
          - validations[priority=20]
          - errors[ERR_PROGRAM_NOT_FOUND]
          - errors[ERR_BRAND_NOT_FOUND]
          - errors[ERR_CUSTOMER_NOT_FOUND]
          - errors[ERR_ALLOCATION_NOT_FOUND]
          - errors[ERR_PROMOTION_NOT_FOUND]
          - errors[ERR_TACTIC_NOT_FOUND]
          - errors[ERR_DOCUMENT_NOT_FOUND]
          - errors[ERR_VOLUME_FACT_NOT_FOUND]
          - errors[ERR_ACCRUAL_NOT_FOUND]
          - errors[ERR_DEDUCTION_NOT_FOUND]
          - errors[ERR_DISPUTE_NOT_FOUND]
          - errors[ERR_AUDIT_NOT_FOUND]
        distinguishing_aspect: |
          Twelve single-resource GETs with the same syntactically valid but unassigned
          UUID return twelve DIFFERENT error_id values, one per §1.1 entity — a single
          generic 404 code for all of them fails this instance.
        test_recipe:
          setup:
            - "Empty database, logical clock pinned at 2026-08-01T00:00:00Z. The UUID 11111111-1111-4111-8111-111111111111 is never minted by any call."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
          trigger:
            - call: "GET /trade-marketing/programs/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { err_program: $.data.error_id }
            - call: "GET /trade-marketing/brands/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
