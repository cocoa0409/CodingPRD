  - rule_id: priority_pair_validation_conflict
    instances:

      - name: feed_reserve_hall_phase_state_beats_capacity_fiscal
        grounds:
          - validations[priority=16]
          - validations[priority=44]
          - validations[priority=45]
          - calculations.busway_usable_kw
          - calculations.hall_power_ledger
        distinguishing_aspect: |
          One POST /rack-feeds violates three rules at once: the hall is still in PLANNING (priority 16,
          state), the reservation exceeds the busway's usable_kw of 196.66 (priority 44, business_fiscal)
          and it would drive hall.spare_kw negative (priority 45). The response must be the priority-16
          ERR_HALL_PHASE_INVALID at 409; only after the phase advance removes rule 16 does the same
          payload surface the priority-44 ERR_BUSWAY_CAPACITY_EXCEEDED at 422 — and never rule 45's error,
          because 44 is checked first.
        test_recipe:
          setup:
            - "Hall HK1 (design_kw_capacity 400.00) is still in PLANNING but already satisfies every advance-phase precondition: PDU-A1 (feed_side A) and PDU-B1 (feed_side B) at 300.00 kW, busway BW-A1 (400 A / 415 V / N_PLUS_1, usable_kw 196.66) and containment zone CA-1."
            - "Rack R-1-1 (design_kw 500.00, required_feed_count 1) is PLANNED."
            - "Hall.committed_kw == 0.00, Hall.commissioning_reserve_kw == 25.00 and Hall.spare_kw == 375.00."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Data Hall K", code: "HK1", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 6 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_a_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-B1", feed_side: "B", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_b_id: $.data.id }
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_a_id}", name: "BW-A1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
              captures: { bw_a_id: $.data.id }
            - call: "POST /containment-zones"
              payload: { hall_id: "${hall_id}", label: "CA-1", zone_type: "COLD_AISLE", containment_kind: "RIGID_ROOF", target_leakage_pct: 5.00, design_static_pressure_pa: 20.00 }
              as: MechanicalContractor
              captures: { zone1_id: $.data.id }
            - call: "POST /racks"
              payload: { hall_id: "${hall_id}", containment_zone_id: "${zone1_id}", grid_row: "1", grid_col: 1, design_kw: 500.00, u_height: 45, required_feed_count: 1 }
              as: FacilityPlanner
              captures: { rack1_id: $.data.id }
          trigger:
            - call: "POST /rack-feeds"
              payload: { rack_id: "${rack1_id}", busway_id: "${bw_a_id}", feed_side: "A", requested_kw: 500.00, breaker_amps: 1200 }
              as: ElectricalContractor
            - call: "POST /halls/${hall_id}/advance-phase"
              payload: { target_status: "FIT_OUT" }
              as: FacilityPlanner
            - call: "POST /rack-feeds"
              payload: { rack_id: "${rack1_id}", busway_id: "${bw_a_id}", feed_side: "A", requested_kw: 500.00, breaker_amps: 1200 }
              as: ElectricalContractor
          assert:
            - "the first trigger call returns 409 with error.code == ERR_HALL_PHASE_INVALID (priority 16 wins over 44 and 45)"
            - "the third trigger call returns 422 with error.code == ERR_BUSWAY_CAPACITY_EXCEEDED (priority 44 wins over 45 once the phase gate is satisfied)"
            - "neither call returns ERR_HALL_SPARE_CAPACITY_EXCEEDED even though 500.00 kW also breaks the hall ledger"
            - "neither call returns ERR_BREAKER_DERATE_EXCEEDED: a 1200 A breaker permits 655.53 kW, so priority 48 is genuinely satisfied"
            - "GET /rack-feeds?rack_id=${rack1_id} returns total_count == 0 — no partial write survived either rejection"
            - "Hall.${hall_id}.committed_kw == 0.00, Hall.${hall_id}.spare_kw == 375.00 and Busway.${bw_a_id}.committed_kw == 0.000"
            - "Hall.${hall_id}.status == FIT_OUT (only the advance-phase call in between succeeded)"

