    output: Bag
    side_effects:
      - "tag_number minted as a unique ten-digit string; the client never supplies it"
      - "linear_in = length_in + width_in + height_in"
      - "custody_status=ACCEPTED, screening_status=PENDING, routing_class=STANDARD"
      - "ops_run_index_at_acceptance := station.ops_run_index"
      - "station_active_bag_count and station_posture recomputed"

  - method: GET
    path: "/baggage/bags/{id}"
    description: "Get a bag, including its passenger-visible tracking fields"
    roles: [AcceptanceAgent, SortationAgent, LoadAgent, Screener, TransferAgent, BaggageServiceAgent, Passenger]
    code: 200
    input: []
    output: Bag
    side_effects: ["manual_sortation_delay_minutes and screen_alarm_resolution_time_minutes recomputed on read"]

  - method: GET
    path: "/baggage/bags"
    description: "List bags, filterable by station, flight, connection status, custody or screening status"
    roles: [AcceptanceAgent, SortationAgent, LoadAgent, BaggageServiceAgent, Passenger]
    code: 200
    input: ["station_id?", "flight_id?", "makeup_area_id?", "custody_status?", "screening_status?", "passenger_ref?", "limit?", "offset?"]
    output: Bag[]
    side_effects: []

  - method: PUT
    path: "/baggage/bags/{id}"
    description: "Correct bag particulars, or record an anomaly note (which drives the two screening-axis cycle edges)"
    roles: [Screener, AcceptanceAgent]
    code: 200
    input: [expected_bag_version, "anomaly_note?", "weight_lb?"]
    output: Bag
    side_effects:
      - "increments Bag.version by 1"
      - "when anomaly_note is supplied: a CLEARED bag's screening_status → IN_LINE, a FAILED bag's screening_status → IN_INSPECTION"
      - "a BagScan row with scan_point SCREENING is appended when the screening axis moves"

  - method: POST
    path: "/baggage/bags/{id}/weigh"
    description: "Weigh, dimension-screen and route a bag in-line; also the re-induction path for a HELD bag during an outage or after an in-place alarm clearance"
    roles: [AcceptanceAgent]
    code: 200
    input: [scale_weight_lb]
    output: Bag
    side_effects:
      - "custody_status: ACCEPTED → SCREENING, or HELD → ACCEPTED (outage contingency or a cleared in-place alarm)"
      - "screening_status: PENDING → IN_LINE, or ALARMED/FAILED/IN_INSPECTION → PENDING"
      - "scale_weight_lb, weight_variance_lb, excess_weight_fee_cents, routing_class, handling_charge_cents and priority_score recomputed"
      - "BagScan rows appended with scan_point INDUCTION and SCREENING"

  - method: POST
    path: "/baggage/bags/bulk-assign-makeup"
    description: "Assign make-up intervals to many sorted bags in one call, reporting per-bag outcomes"
    roles: [SortationAgent]
    code: 200
    input: [assignments]
    output: "{ assigned: Bag[], rejected: [{ bag_id: string, error_code: string }] }"
    side_effects:
      - "each assignment applies the same validation order as the single-bag endpoint, independently of the others"
      - "items are processed in the order supplied; a rejected item never aborts the batch"
      - "makeup_area_occupancy, station_posture, station_manual_queue_depth and flight_makeup_ready recomputed once after each accepted item"

  - method: POST
    path: "/baggage/bags/{id}/assign-makeup"
    description: "Assign a make-up interval to a sorted bag"
    roles: [SortationAgent]
    code: 200
    input: [expected_bag_version, makeup_area_id, induction_utc, makeup_interval_minutes]
    output: Bag
    side_effects:
      - "increments Bag.version by 1"
      - "custody_status → IN_MAKEUP"
      - "makeup_area_occupancy, station_posture, station_manual_queue_depth and flight_makeup_ready recomputed"
      - "cascade C: a requires_manual_screening SpecialItem without an open inspection task gains one"
      - "a BagScan row with scan_point SORTATION is appended"

