      - name: corner_ep_receipt_cure_is_conditional_on_full_exception_coverage
        claim_type: conditional_action
        grounds:
          - endpoints["POST /receipts/{id}/cure"]
          - calculations.eligible_collateral_valuation.constants.EXCEPTION_HAIRCUT
          - state_machines.CustodianReceipt.status
        distinguishing_aspect: |
          The same endpoint with the same shape does two different things depending on
          whether the accumulated cured_exception_codes now COVER every exception_code: a
          partial cure changes no status and lifts no haircut, while the cure that closes
          the last code flips receipt to CURED, custody to EXCEPTION_CURED, removes the
          0.05 EXCEPTION_HAIRCUT and closes the CUSTODY_EXCEPTION margin call. The two
          calls are otherwise indistinguishable from the request body alone.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility; AW WET CONFORMING loan 1,000,000,000 funded at 0.96 to 960,000,000 with no receipt yet."
            - "A receipt is then filed with two exception_codes, dropping the rate to 0.93 and raising a 30,000,000 CUSTODY_EXCEPTION margin call that restricts the facility."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_wet_1b
            - *c_wire_aw
            - *c_verify_ww
            - call: "POST /advances/${aw_id}/fund"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { aw_funded_amt: "$.data.advance_amount_cents" }
            - call: "POST /advances/${aw_id}/receipts"
              payload: { custodian_id: "${cust_id}", document_types: ["NOTE", "MORTGAGE"], exception_codes: ["MISSING_ASSIGNMENT", "TITLE_GAP"] }
              as: Custodian
              as_user_id: "${cust_id}"
              captures: { rcpt_exc_id: "$.data.id" }
            - call: "GET /advances/${aw_id}/margin-calls"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { exc_mc_id: "$.data[0].id" }
          trigger:
            - call: "POST /receipts/${rcpt_exc_id}/cure"
              payload: { cured_exception_codes: ["MISSING_ASSIGNMENT"] }
              as: Custodian
              as_user_id: "${cust_id}"
            - call: "GET /advances/${aw_id}"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { mid_rate: "$.data.effective_advance_rate" }
            - call: "POST /receipts/${rcpt_exc_id}/cure"
              payload: { cured_exception_codes: ["TITLE_GAP"] }
              as: Custodian
              as_user_id: "${cust_id}"
            - call: "GET /advances/${aw_id}"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { end_rate: "$.data.effective_advance_rate", end_paydown: "$.data.required_paydown_cents" }
          assert:
            - "setup: aw_funded_amt == 960000000 = floor(1000000000 * (0.98 - 0.02)) — the wet haircut applied because custody_status was PENDING_RECEIPT"
            - "setup: after the exception receipt, effective_advance_rate == 0.93 = 0.98 - EXCEPTION_HAIRCUT — the wet haircut LIFTS on receipt while the exception haircut lands, a net move of -0.03"
            - "setup: eligible_collateral_value_cents == 930000000 and MarginCall.${exc_mc_id}.trigger_reason == CUSTODY_EXCEPTION with call_amount_cents == 30000000; facility status RESTRICTED"
            - "the partial cure returns HTTP 200 but CustodianReceipt.${rcpt_exc_id}.status is still EXCEPTION and Advance.${aw_id}.custody_status is still RECEIVED_EXCEPTION"
            - "after the partial cure cured_exception_codes == [MISSING_ASSIGNMENT] — the endpoint appends, it does not replace"
            - "mid_rate == 0.93 — the haircut is all-or-nothing, not pro-rated across the two codes"
            - "MarginCall.${exc_mc_id}.status is still ISSUED and WarehouseFacility.${fac_id}.status is still RESTRICTED after the partial cure"
            - "the second cure returns HTTP 200 with cured_exception_codes == [MISSING_ASSIGNMENT, TITLE_GAP] and status == CURED"
            - "Advance.${aw_id}.custody_status == EXCEPTION_CURED and end_rate == 0.98 — both haircuts are now off"
            - "eligible_collateral_value_cents == 980000000 and end_paydown == 0 = max(0, 960000000 - 980000000)"
            - "MarginCall.${exc_mc_id}.status == CURED with cured_amount_cents still 0 — this closure is a compensation, not a payment, and posts no LedgerEntry"
            - "WarehouseFacility.${fac_id}.status returns to ACTIVE with open_margin_call_count == 0 and outstanding_principal_cents still 960000000"

      - name: corner_ep_action_endpoint_cascades_already_covered
        claim_type: action_endpoint
        grounds:
          - endpoints["POST /investors/{id}/suspend"]
          - endpoints["POST /facilities/{id}/covenant-tests"]
        excluded_because:
          difficulty_instance: cascade_investor_suspension_to_facility_restriction
          rationale: |
            The two deepest action endpoints — investor suspension and covenant
            certification — have their full side-effect fan-out asserted end to end by that
            §1.8 instance and by cascade_second_covenant_breach_to_wire_block. Re-testing
            them here would duplicate the same chains at lower fidelity, so the corner file
            covers action endpoints through the narrower clock, ship and cure cases above.

  # ===========================================================================
  - section: errors
    instances:

      - name: corner_err_auth_headers_then_role_then_existence
        claim_type: error_triggerable
        grounds:
          - errors.ERR_MISSING_AUTH_HEADERS
          - errors.ERR_UNAUTHORIZED
          - validations[priority=1]
          - validations[priority=2]
        distinguishing_aspect: |
          The two auth codes are the only rules that outrank existence, and the ordering is
          observable: a CollateralAnalyst approving a NON-EXISTENT facility gets 403, never
          404, so existence is not leaked to an unauthorised caller. The entity-backed half
          of priority 2 is also 403 — a Borrower whose X-User-ID is not a WarehouseFacility
          id fails authorisation rather than resource lookup.
        test_recipe:
          setup:
            - "One ACTIVE facility, so the 404-vs-403 arms are about the addressed id and not an empty database."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
          trigger:
            - call: "POST /facilities/00000000-0000-0000-0000-0000000000aa/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_2"
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: Borrower
              as_user_id: "ca_1"
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: Borrower
              as_user_id: "${fac_id}"
          assert:
            - "the same GET /facilities/${fac_id} sent with the X-User-Role header omitted returns HTTP 401 with data.error_id == ERR_MISSING_AUTH_HEADERS"
            - "sent with X-User-ID omitted it also returns 401 ERR_MISSING_AUTH_HEADERS; sent with X-User-ID present but empty it returns 401 as well"
            - "GET /facilities/00000000-0000-0000-0000-0000000000aa with both headers omitted returns 401, NOT 404 — priority 1 precedes path resolution"
            - "approving the nonexistent facility with the correct CreditOfficer role returns HTTP 404 ERR_FACILITY_NOT_FOUND — this is the baseline the two 403 arms below must override"
            - "the SAME request re-sent with X-User-Role: CollateralAnalyst returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED, NOT 404 — priority 2 precedes priority 3"
            - "POST /facilities/${fac_id}/approve with X-User-Role: CollateralAnalyst also returns 403 ERR_UNAUTHORIZED, NOT 409 ERR_FACILITY_INVALID_STATE — priority 2 precedes priority 9 even though the facility is already ACTIVE"
            - "POST /advances with X-User-Role: WireOperator returns 403 ERR_UNAUTHORIZED — booking is exclusive to CollateralAnalyst and Borrower, and WireOperator's presence on the fund endpoint does not extend to creation"
            - "GET /facilities/${fac_id} as Borrower with X-User-ID ca_1 returns HTTP 403 ERR_UNAUTHORIZED — an entity-backed role whose X-User-ID resolves to no WarehouseFacility row fails priority 2, not priority 4"
            - "GET /facilities/${fac_id} as Borrower with X-User-ID ${fac_id} returns HTTP 200 — the same role and endpoint succeed once the id resolves to the caller's own row"
            - "WarehouseFacility.${fac_id}.status is still ACTIVE and version is unchanged — no rejected request mutated anything"

      - name: corner_err_not_found_code_follows_the_addressed_collection
        claim_type: error_triggerable
        grounds:
          - errors.ERR_COMMITMENT_NOT_FOUND
          - errors.ERR_COVENANT_TEST_NOT_FOUND
          - errors.ERR_RECEIPT_NOT_FOUND
          - errors.ERR_REPURCHASE_DEMAND_NOT_FOUND
          - errors.ERR_WIRE_INSTRUCTION_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: |
          One unresolvable UUID is sent to five different top-level collections and each
          must answer with its OWN code. A single generic ERR_NOT_FOUND, or a code derived
          from the request body rather than from the URL segment, fails every arm. The
          facility exists throughout, so these are genuine per-collection lookups and not
          an empty-database artefact.
        test_recipe:
          setup:
            - "One ACTIVE facility with a CONFORMING rate row, so the database is non-empty."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
          trigger:
            - call: "POST /commitments/00000000-0000-0000-0000-0000000000b1/withdraw"
              payload: { reason: "Probe for the commitment collection's not-found code" }
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /covenant-tests/00000000-0000-0000-0000-0000000000b2/waive"
              payload: { reason: "Probe for the covenant-test collection's not-found code" }
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /receipts/00000000-0000-0000-0000-0000000000b3/cure"
              payload: { cured_exception_codes: ["MISSING_ASSIGNMENT"] }
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "POST /repurchase-demands/00000000-0000-0000-0000-0000000000b4/escalate"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /wire-instructions/00000000-0000-0000-0000-0000000000b5/decision"
              payload: { decision: "VERIFY", callback_reference: "CB-404" }
              as: WireOperator
              as_user_id: "wo_1"
            - call: "GET /advances/00000000-0000-0000-0000-0000000000b6"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "GET /margin-calls/00000000-0000-0000-0000-0000000000b7"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
          assert:
            - "/commitments returns HTTP 404 with data.error_id == ERR_COMMITMENT_NOT_FOUND"
            - "/covenant-tests returns HTTP 404 with data.error_id == ERR_COVENANT_TEST_NOT_FOUND"
            - "/receipts returns HTTP 404 with data.error_id == ERR_RECEIPT_NOT_FOUND"
            - "/repurchase-demands returns HTTP 404 with data.error_id == ERR_REPURCHASE_DEMAND_NOT_FOUND"
            - "/wire-instructions returns HTTP 404 with data.error_id == ERR_WIRE_INSTRUCTION_NOT_FOUND"
            - "/advances returns HTTP 404 with data.error_id == ERR_ADVANCE_NOT_FOUND and /margin-calls returns ERR_MARGIN_CALL_NOT_FOUND"
            - "no arm returns a generic ERR_NOT_FOUND and none returns 422 — the schema of every payload above is valid, so priority 3 is the first failure"
            - "the /receipts arm proves the code comes from the URL segment: its body is a valid cure payload, yet the answer is ERR_RECEIPT_NOT_FOUND and not a receipt-content error"
            - "WarehouseFacility.${fac_id} is untouched: status ACTIVE, version unchanged, outstanding_principal_cents == 0"

      - name: corner_err_wire_decision_is_single_shot_in_both_directions
        claim_type: error_triggerable
        grounds:
          - errors.ERR_WIRE_INSTRUCTION_NOT_PENDING
          - validations[priority=13]
          - state_machines.WireInstruction.status
        distinguishing_aspect: |
          PENDING_VERIFICATION is the only decidable state, so all four re-decision
          combinations must fail: VERIFY-then-VERIFY, VERIFY-then-BLOCK,
          BLOCK-then-BLOCK and BLOCK-then-VERIFY. A wire cannot be un-blocked, which is
          what forces a blocked advance to be re-requested rather than rescued.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility; A1 DRY CONFORMING created with wire W1, and a second advance AN2 created with wire WN2."
            - "W1 is VERIFIED and WN2 is BLOCKED."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_wire_a1
            - *c_verify_w1
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_v_n2: "$.data.version" }
            - call: "POST /advances"
              payload:
                facility_id: "${fac_id}"
                custodian_id: "${cust_id}"
                investor_commitment_id: "${comm_a_id}"
                product_code: "CONFORMING"
                loan_amount_cents: 300000000
                note_rate: 0.0700
                funding_type: "DRY"
                payee_name: "Summit Title & Escrow"
                payee_account_last4: "4417"
                payee_routing_last4: "0021"
                expected_facility_version: "${fac_v_n2}"
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { an2_id: "$.data.id" }
            - call: "GET /advances/${an2_id}/wire-instructions"
              payload: {}
              as: WireOperator
              as_user_id: "wo_1"
              captures: { wn2_id: "$.data[0].id" }
            - call: "POST /wire-instructions/${wn2_id}/decision"
              payload: { decision: "BLOCK", block_reason: "CALLBACK_FAILED" }
              as: WireOperator
              as_user_id: "wo_1"
          trigger:
            - call: "POST /wire-instructions/${w1_id}/decision"
              payload: { decision: "VERIFY", callback_reference: "CB-830" }
              as: WireOperator
              as_user_id: "wo_1"
            - call: "POST /wire-instructions/${w1_id}/decision"
              payload: { decision: "BLOCK", block_reason: "CALLBACK_FAILED" }
              as: WireOperator
              as_user_id: "wo_1"
            - call: "POST /wire-instructions/${wn2_id}/decision"
              payload: { decision: "BLOCK", block_reason: "OPERATOR_BLOCK" }
              as: WireOperator
              as_user_id: "wo_1"
            - call: "POST /wire-instructions/${wn2_id}/decision"
              payload: { decision: "VERIFY", callback_reference: "CB-831" }
              as: WireOperator
              as_user_id: "wo_1"
            - call: "POST /advances/${an2_id}/fund"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
          assert:
            - "all four re-decision arms return HTTP 409 with data.error_id == ERR_WIRE_INSTRUCTION_NOT_PENDING"
            - "WireInstruction.${w1_id}.status is still VERIFIED with decided_by_user_id == wo_1 and callback_reference from the original decision, not CB-830"
            - "WireInstruction.${wn2_id}.status is still BLOCKED with block_reason == CALLBACK_FAILED — the second BLOCK did not overwrite the reason"
            - "neither wire's version advanced across the four rejected calls"
            - "funding ${an2_id} returns HTTP 409 with data.error_id == ERR_WIRE_NOT_VERIFIED — a blocked wire is permanently unfundable, so the advance must be re-requested"
            - "Advance.${an2_id}.funding_status is still REQUESTED and WarehouseFacility.${fac_id}.outstanding_principal_cents == 0"

      - name: corner_err_closed_margin_call_and_passing_covenant_test_gates
        claim_type: error_triggerable
        grounds:
          - errors.ERR_MARGIN_CALL_NOT_OPEN
          - errors.ERR_COVENANT_TEST_NOT_BREACHED
          - validations[priority=14]
          - validations[priority=16]
        distinguishing_aspect: |
          Two "wrong lifecycle state" codes that a naive implementation collapses into one
          generic conflict. A CURED margin call refuses both further cure payments and a
          waiver with ERR_MARGIN_CALL_NOT_OPEN, while a PASS covenant test refuses a waiver
          with ERR_COVENANT_TEST_NOT_BREACHED — there is nothing to forgive.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility; A1 DRY CONFORMING funded to 1,960,000,000; no aging-run, so accrued_fee_balance_cents is 0."
            - "A facility-level MarginCall of 196,000,000 is raised and then fully cured, returning the facility to ACTIVE."
            - "One PASS covenant test for 2026-06-30."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_receipt_clear_a1
            - *c_wire_a1
            - *c_verify_w1
            - *c_fund_a1
            - call: "POST /margin-calls"
              payload: { facility_id: "${fac_id}", trigger_reason: "COVENANT_BREACH" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { cm_mc_id: "$.data.id", cm_mc_ver: "$.data.version" }
            - call: "POST /margin-calls/${cm_mc_id}/cure-payments"
              payload: { amount_cents: 196000000, expected_margin_call_version: "${cm_mc_ver}" }
              as: Borrower
              as_user_id: "${fac_id}"
            - call: "GET /margin-calls/${cm_mc_id}"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { cm_mc_ver2: "$.data.version" }
            - call: "POST /facilities/${fac_id}/covenant-tests"
              payload: { period_end: "2026-06-30", tangible_net_worth_cents: 2000000000, liquidity_cents: 800000000, net_income_cents: 200000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { cm_cov_id: "$.data.id" }
          trigger:
            - call: "POST /margin-calls/${cm_mc_id}/cure-payments"
              payload: { amount_cents: 1000000, expected_margin_call_version: "${cm_mc_ver2}" }
              as: Borrower
              as_user_id: "${fac_id}"
            - call: "POST /margin-calls/${cm_mc_id}/waive"
              payload: { reason: "Attempt to waive an already-cured call" }
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /covenant-tests/${cm_cov_id}/waive"
              payload: { reason: "Attempt to waive a passing test" }
              as: CreditOfficer
              as_user_id: "co_1"
          assert:
            - "setup: MarginCall.${cm_mc_id}.status == CURED with cured_amount_cents == 196000000 == call_amount_cents, and cm_mc_ver2 > cm_mc_ver"
            - "setup: WarehouseFacility.${fac_id}.status returned to ACTIVE and CovenantTest.${cm_cov_id}.status == PASS"
            - "the extra cure payment returns HTTP 409 with data.error_id == ERR_MARGIN_CALL_NOT_OPEN — it supplies the CURRENT version, so this is priority 14 and not the 412 at priority 8"
            - "the margin-call waiver returns HTTP 409 with data.error_id == ERR_MARGIN_CALL_NOT_OPEN — waive and cure share the same open-state gate"
            - "the covenant waiver returns HTTP 422 with data.error_id == ERR_COVENANT_TEST_NOT_BREACHED — a distinct code and a distinct status class from the margin-call gate"
            - "CovenantTest.${cm_cov_id}.status is still PASS and waived_by_user_id is null"
            - "GET /margin-calls/${cm_mc_id}/cure-payments returns total_count == 1 — the rejected payment created no CurePayment row"
            - "Advance.${a1_id}.outstanding_balance_cents == 1764000000 and WarehouseFacility.${fac_id}.accrued_fee_balance_cents == 0 — no partial application from the rejected calls"

      - name: corner_err_suspended_custodian_blocks_assignment_and_receipts
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CUSTODIAN_NOT_ACTIVE
          - validations[priority=26]
          - state_machines.DocumentCustodian.status
        distinguishing_aspect: |
          Custodian suspension is forward-looking only: it blocks BOTH new collateral
          assignment (POST /advances naming that custodian) and new receipts on advances
          already assigned to it, but it does not disturb receipts already filed or
          advances already funded. The code is ERR_CUSTODIAN_NOT_ACTIVE (422) and not the
          own-entity ERR_CUSTODIAN_INVALID_STATE (409), which belongs to re-suspending the
          custodian itself.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility with custodian C1 APPROVED."
            - "A1 DRY CONFORMING funded to 1,960,000,000 with a CLEAR receipt already on file from C1."
            - "AC2 DRY CONFORMING loan 300,000,000 created against C1 but with no receipt yet."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_receipt_clear_a1
            - *c_wire_a1
            - *c_verify_w1
            - *c_fund_a1
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_v_c2: "$.data.version" }
            - call: "POST /advances"
              payload:
                facility_id: "${fac_id}"
                custodian_id: "${cust_id}"
                investor_commitment_id: "${comm_a_id}"
                product_code: "CONFORMING"
                loan_amount_cents: 300000000
                note_rate: 0.0700
                funding_type: "DRY"
                payee_name: "Summit Title & Escrow"
                payee_account_last4: "4417"
                payee_routing_last4: "0021"
                expected_facility_version: "${fac_v_c2}"
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { ac2_id: "$.data.id" }
          trigger:
            - call: "POST /custodians/${cust_id}/suspend"
              payload: { reason: "Custodian failed its annual document-control audit" }
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /advances/${ac2_id}/receipts"
              payload: { custodian_id: "${cust_id}", document_types: ["NOTE", "MORTGAGE"] }
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_v_c3: "$.data.version" }
            - call: "POST /advances"
              payload:
                facility_id: "${fac_id}"
                custodian_id: "${cust_id}"
                investor_commitment_id: "${comm_a_id}"
                product_code: "CONFORMING"
                loan_amount_cents: 200000000
                note_rate: 0.0700
                funding_type: "DRY"
                payee_name: "Summit Title & Escrow"
                payee_account_last4: "4417"
                payee_routing_last4: "0021"
                expected_facility_version: "${fac_v_c3}"
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "POST /custodians/${cust_id}/suspend"
              payload: { reason: "Second suspension attempt on the same custodian" }
              as: CreditOfficer
              as_user_id: "co_1"
          assert:
            - "the suspension returns HTTP 200 with DocumentCustodian.${cust_id}.status == SUSPENDED"
            - "filing a receipt on ${ac2_id} returns HTTP 422 with data.error_id == ERR_CUSTODIAN_NOT_ACTIVE"
            - "booking a new advance against ${cust_id} returns HTTP 422 with data.error_id == ERR_CUSTODIAN_NOT_ACTIVE — assignment is blocked too, and the code is the same"
            - "re-suspending the custodian returns HTTP 409 with data.error_id == ERR_CUSTODIAN_INVALID_STATE — the own-entity state code, distinct from the 422 above"
            - "the already-filed CLEAR receipt on ${a1_id} is untouched: status CLEAR and Advance.${a1_id}.custody_status == RECEIVED_CLEAR"
            - "Advance.${a1_id}.funding_status is still FUNDED with outstanding_balance_cents 1960000000 — suspension is not retroactive"
            - "Advance.${ac2_id}.custody_status is still PENDING_RECEIPT and funding_status REQUESTED"
            - "fac_v_c3 == fac_v_c2 + 1 only from the ${ac2_id} booking; the rejected booking did not increment it further"
            - "WarehouseFacility.${fac_id}.status is still ACTIVE — custodian suspension raises no margin call and no restriction on its own"

      - name: corner_err_wet_and_scratch_and_dent_sublimit_codes
        claim_type: error_triggerable
        grounds:
          - errors.ERR_WET_SUBLIMIT_EXCEEDED
          - errors.ERR_SCRATCH_AND_DENT_SUBLIMIT_EXCEEDED
          - validations[priority=39]
          - validations[priority=41]
          - calculations.advance_amount_determination
        distinguishing_aspect: |
          Each bucket must report its OWN code once its headroom hits exactly zero, and
          neither may be reported as ERR_ADVANCE_BELOW_MINIMUM even though a zero cap makes
          stage 4 zero — priority 35 is explicitly skipped when a stage-4 cap is <= 0. The
          fixture drives both buckets to exactly zero headroom (960,000,000 wet and
          425,000,000 scratch-and-dent) so the >0 comparisons are tested at their boundary.
