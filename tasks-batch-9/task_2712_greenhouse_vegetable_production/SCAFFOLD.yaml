scenario: |
  Generate task harder than expert level!

  2712. Greenhouse Vegetable Production (controlled environment greenhouse grower): crop cycle planning with variety selection, transplant scheduling and expected yield curves per square foot, climate control with temperature, humidity, carbon dioxide enrichment and supplemental lighting strategies, irrigation and fertigation with nutrient solution recipes, recirculation and drainage monitoring, integrated pest management with biological control agent releases and scouting protocols, pollination management with bumblebee hive placement and activity monitoring, labor planning across deleafing, trellising and harvest with productivity standards, harvest grading, packing and cold chain to retail programs with weekly volume commitments, energy cost management with combined heat and power and thermal screens

domain_name: "greenhouse-vegetable-production"
# Flat topology: every resource is a peer collection at the API root. Children
# reference parents through FK body fields, never through nested URL paths.
api_prefix: "/"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # flat: 13 peer collections (/zones, /crop-cycles, /harvest-lots, ...) linked by
  # FK body fields. No nested creation paths; LotAllocation is a junction row that
  # only the allocation-run endpoint mints, discovered via filtered lists.

  state_machine_shape: cyclic
  # Non-linear shapes present: CropCycle (branching PRODUCTION -> {TERMINATION_SCHEDULED,
  # ABORTED} plus the TERMINATION_SCHEDULED -> PRODUCTION revert cycle), BioControlRelease
  # (APPROVED -> REQUESTED revision cycle capped at MAX_RELEASE_REVISIONS), HarvestLot (two
  # independent dimensions: grading_status x cold_chain_status), CommitmentWeek
  # (ALLOCATED -> OPEN revert cycle driven by allocation revocation).

  relationship_patterns:
    - one_to_many        # Zone -> CropCycle, CropCycle -> HarvestLot, RetailProgram -> CommitmentWeek
    - many_to_many       # HarvestLot <-> CommitmentWeek through LotAllocation
    - cross_aggregate    # ScoutingObservation (IPM aggregate) gates LaborTask (labor aggregate) through Zone.ipm_posture

  role_model: segregation_of_duties
  # The Worker who records a ScoutingObservation may not decide the BioControlRelease
  # it justifies; the QualityInspector who released a lot's cold chain may not sign the
  # CommitmentWeek shipment that consumes that lot.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 13 entities / 57 endpoints / 75 errors / 11 calculations (all with variants) /
  # 11 state-machine entries over 9 entities (HarvestLot and Zone each carry two
  # independent dimensions) / 3 OCC rules / 41 validations / 6 roles.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Zone
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Human-readable compartment code, unique across all zones"
        constraints: "1-16 chars; uniqueness enforced by ERR_ZONE_CODE_DUPLICATE"
      - name: area_sqft
        type: integer
        source: input
        description: "Glazed growing area in square feet; drives every per-sqft yield and energy figure"
        constraints: ">= 1000 and <= 200000"
      - name: glazing_type
        type: enum
        source: input
        description: "Envelope construction"
        constraints: "GLASS | POLY"
      - name: has_thermal_screen
        type: boolean
        source: input
        description: "Whether a deployable thermal screen exists; screen_position_pct must be 0 when false"
      - name: has_supplemental_lighting
        type: boolean
        source: input
        description: "Whether HPS/LED supplemental lighting exists; lighting_hours must be 0 when false"
      - name: chp_connected
        type: boolean
        source: input
        description: "Whether the zone draws heat/power/CO2 from the combined heat and power plant; selects the settled_energy_cost variant"
      - name: hive_slot_capacity
        type: integer
        source: input
        description: "Maximum bumblebee hives that may be simultaneously placed in this zone"
        constraints: ">= 0 and <= 40"
      - name: labor_budget_usd
        type: number
        source: input
        description: "Total labor money this zone may commit across all crop cycles"
        constraints: ">= 0, 2 decimal places"
      - name: status
        type: enum
        source: computed
        description: "Occupancy posture bubbled up from crop cycles and harvest activity"
        default: "IDLE"
        constraints: "IDLE | PLANTED | HARVESTING | TURNAROUND"
      - name: ipm_posture
        type: enum
        source: computed
        description: "Integrated pest management gate derived from open pest alerts and biocontrol re-entry intervals"
        default: "NORMAL"
        constraints: "NORMAL | SCOUT_ALERT | LOCKED"
      - name: irrigation_posture
        type: enum
        source: computed
        description: "Fertigation gate derived from drainage alarm count"
        default: "NORMAL"
        constraints: "NORMAL | WATCH | LOCKED"
      - name: open_pest_alert_count
        type: integer
        source: computed
        description: "Count of ScoutingObservation rows on this zone with threshold_status IN {AT, ABOVE} whose justified BioControlRelease has not reached status RELEASED"
        default: 0
      - name: drain_alarm_count
        type: integer
        source: computed
        description: "Count of drainage readings on this zone whose drain_ec_ms exceeded DRAIN_EC_ALARM_MS or whose drain_fraction_pct fell outside the batch drain_target_pct band"
        default: 0
      - name: hive_slots_used
        type: integer
        source: computed
        description: "Sum of CropCycle.hive_count_placed over this zone's crop cycles whose status IN {TRANSPLANTED, PRODUCTION, TERMINATION_SCHEDULED}"
        default: 0
      - name: labor_budget_committed_usd
        type: number
        source: computed
        description: "Sum of LaborTask.planned_cost_usd for tasks in {SCHEDULED, IN_PROGRESS} plus LaborTask.actual_cost_usd for tasks in {COMPLETED}, over all tasks whose zone_id is this zone"
        default: 0.00
      - name: labor_budget_remaining_usd
        type: number
        source: computed
        description: "labor_budget_usd - labor_budget_committed_usd; conserved-quantity partner of labor_budget_committed_usd"
      - name: reentry_clear_at
        type: datetime
        source: computed
        description: "Instant at which a biological-control re-entry interval expires; null when no release is in effect"
        default: null
      - name: climate_plan_revision
        type: integer
        source: computed
        description: "Monotonic counter incremented whenever a ClimateStrategy is created against this zone; exists so the OCC guard on POST /climate-strategies has an observable zone mutation"
        default: 0

  - name: Variety
    parent: null
    common_fields: false
    fields:
      - name: name
        type: string
        source: input
        description: "Cultivar name"
      - name: crop_type
        type: enum
        source: input
        description: "Crop family"
        constraints: "TOMATO | CUCUMBER | PEPPER"
      - name: cycle_length_weeks
        type: integer
        source: input
        description: "Total weeks from transplant to termination"
        constraints: ">= 4 and <= 60"
      - name: first_harvest_week
        type: integer
        source: input
        description: "1-based production week in which the first harvest is possible"
        constraints: ">= 2 and <= cycle_length_weeks"
      - name: plant_density_per_sqft
        type: number
        source: input
        description: "Nominal plants per square foot at full density"
        constraints: "> 0 and <= 2"
      - name: yield_curve_lbs_per_sqft
        type: array
        source: input
        description: "Per-week marketable lbs per square foot, index 0 = first_harvest_week"
        constraints: "length MUST equal cycle_length_weeks - first_harvest_week + 1; each element >= 0"
      - name: grade_a_ratio_pct
        type: number
        source: input
        description: "Expected share of gross harvest weight reaching grade A, informational reference for graders"
        constraints: "0-100"
      - name: requires_pollination
        type: boolean
        source: input
        description: "Whether bumblebee pollination is agronomically required; gates the pollination yield haircut"
      - name: ec_target_ms
        type: number
        source: input
        description: "Recommended feed electrical conductivity in mS/cm"
        constraints: "> 0 and <= 6"

  - name: CropCycle
    parent: null
    common_fields: true
    fields:
      - name: zone_id
        type: string
        source: input
        description: "FK -> Zone.id; the compartment this cycle occupies"
      - name: variety_id
        type: string
        source: input
        description: "FK -> Variety.id; pinned at creation and never mutated"
      - name: transplant_date
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD) on which seedlings enter the zone"
      - name: plants_transplanted
        type: integer
        source: input
        description: "Plants actually set; drives density_factor"
        constraints: ">= 1"
      - name: planned_end_date
        type: string
        source: computed
        description: "transplant_date + (variety.cycle_length_weeks * 7) - 1 day, as ISO date"
      - name: first_harvest_allowed_date
        type: string
        source: computed
        description: "transplant_date + (variety.first_harvest_week - 1) * 7 days, as ISO date"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state; see §1.2 CropCycle"
        default: "PLANNED"
        constraints: "PLANNED | TRANSPLANTED | PRODUCTION | TERMINATION_SCHEDULED | TERMINATED | ABORTED"
      - name: density_factor
        type: number
        source: computed
        description: "min(round(plants_transplanted / (zone.area_sqft * variety.plant_density_per_sqft), 4), MAX_DENSITY_FACTOR)"
      - name: expected_weekly_yield_lbs
        type: array
        source: computed
        description: "Per-week expected marketable lbs, each element rounded to 2 dp before any summation"
      - name: expected_total_yield_lbs
        type: number
        source: computed
        description: "Sum of the already-rounded expected_weekly_yield_lbs elements, after any pollination haircut"
      - name: baseline_total_yield_lbs
        type: number
        source: computed
        description: "expected_total_yield_lbs before any pollination haircut is applied; retained so the haircut is reversible"
      - name: cumulative_harvested_lbs
        type: number
        source: computed
        description: "Sum of HarvestLot.gross_weight_lbs over this cycle's lots whose cold_chain_status != REJECTED"
        default: 0.00
      - name: yield_variance_pct
        type: number
        source: computed
        description: "round(100 * (cumulative_harvested_lbs - expected_total_yield_lbs) / expected_total_yield_lbs, 2)"
        default: 0.00
      - name: hive_count_placed
        type: integer
        source: computed
        description: "Bumblebee hives currently placed for this cycle"
        default: 0
      - name: hives_placed_at
        type: datetime
        source: computed
        description: "Instant of the most recent hive placement; anchors the strength decay clock"
        default: null
      - name: pollination_strength_index
        type: number
        source: computed
        description: "Decayed hive strength 0-100 recomputed on every pollination check"
        default: 100.00
      - name: pollination_risk_score
        type: number
        source: computed
        description: "round(100 - pollination_strength_index, 2)"
        default: 0.00
      - name: pollination_haircut_pct
        type: number
        source: computed
        description: "POLLINATION_HAIRCUT_PCT once pollination_risk_score >= POLLINATION_RISK_THRESHOLD and variety.requires_pollination is true, else 0.00"
        default: 0.00
      - name: nutrient_stress_flag
        type: boolean
        source: computed
        description: "Set true when the zone's irrigation_posture cascades to LOCKED while this cycle is in {TRANSPLANTED, PRODUCTION, TERMINATION_SCHEDULED}"
        default: false
      - name: labor_shortfall_flag
        type: boolean
        source: computed
        description: "Set true when an IPM posture lock cancels at least one of this cycle's SCHEDULED harvest tasks"
        default: false
      - name: termination_date
        type: string
        source: input
        description: "Requested crop removal date, supplied when scheduling termination"
        default: null

  - name: ClimateStrategy
    parent: null
    common_fields: true
    fields:
      - name: zone_id
        type: string
        source: input
        description: "FK -> Zone.id; the compartment this setpoint window governs"
      - name: regime
        type: enum
        source: input
        description: "Which diurnal regime the window belongs to; DAY and NIGHT windows are independent occupancy tracks on the same zone"
        constraints: "DAY | NIGHT"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the setpoint window (ISO 8601 UTC)"
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of the setpoint window (ISO 8601 UTC); half-open [window_start, window_end)"
      - name: temp_setpoint_c
        type: number
        source: input
        description: "Air temperature setpoint in degrees Celsius"
        constraints: ">= 5 and <= 35"
      - name: rh_setpoint_pct
        type: number
        source: input
        description: "Relative humidity setpoint in percent"
        constraints: ">= 40 and <= 95"
      - name: co2_setpoint_ppm
        type: integer
        source: input
        description: "Carbon dioxide enrichment setpoint in ppm"
        constraints: ">= 400 and <= 1200"
      - name: lighting_hours
        type: number
        source: input
        description: "Supplemental lighting hours inside the window"
        constraints: ">= 0 and <= window_hours; MUST be 0 when zone.has_supplemental_lighting is false"
      - name: screen_position_pct
        type: number
        source: input
        description: "Thermal screen closure percentage held through the window"
        constraints: "0-100; MUST be 0 when zone.has_thermal_screen is false"
      - name: supersede
        type: boolean
        source: input
        description: "When true, an overlapping ACTIVE strategy on the same zone and regime is moved to SUPERSEDED instead of rejecting this create"
        default: false
      - name: expected_zone_version
        type: integer
        source: input
        description: "OCC guard: the Zone.version the client last observed"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state; see §1.2 ClimateStrategy"
        default: "ACTIVE"
        constraints: "ACTIVE | SUPERSEDED | EXPIRED | CANCELLED"
      - name: window_hours
        type: number
        source: computed
        description: "round((window_end - window_start) in hours, 2)"
      - name: planned_heat_kwh
        type: number
        source: computed
        description: "Thermal demand for the window under the planning variant"
      - name: planned_light_kwh
        type: number
        source: computed
        description: "Supplemental lighting electricity demand for the window"
      - name: planned_co2_kg
        type: number
        source: computed
        description: "Purchased carbon dioxide demand for the window before any CHP flue offset"
      - name: projected_energy_cost_usd
        type: number
        source: computed
        description: "Planning variant of energy_cost: boiler gas plus grid electricity plus purchased CO2, no CHP allocation"
      - name: gas_consumed_m3
        type: number
        source: input
        description: "Metered natural gas burned during the window, supplied with the energy actuals"
        default: null
      - name: chp_generated_kwh
        type: number
        source: input
        description: "Electricity generated by the CHP engine during the window"
        default: null
      - name: grid_import_kwh
        type: number
        source: input
        description: "Electricity imported from the grid during the window"
        default: null
      - name: screen_deployed_hours
        type: number
        source: input
        description: "Hours the thermal screen was actually deployed during the window"
        default: null
      - name: actuals_recorded_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which energy actuals were accepted; null until then"
        default: null
      - name: settled_energy_cost_usd
        type: number
        source: computed
        description: "Settled variant of energy_cost: CHP gas cost split between heat and power, grid import, CO2 net of flue offset, minus export credit"
        default: null
      - name: cost_variance_usd
        type: number
        source: computed
        description: "round(settled_energy_cost_usd - projected_energy_cost_usd, 2); null until actuals recorded"
        default: null

  - name: FertigationBatch
    parent: null
    common_fields: true
    fields:
      - name: zone_id
        type: string
        source: input
        description: "FK -> Zone.id; the compartment irrigated by this batch"
      - name: crop_cycle_id
        type: string
        source: input
        description: "FK -> CropCycle.id; the cycle being fed"
      - name: batch_date
        type: string
        source: input
        description: "ISO date the solution is mixed"
      - name: planned_volume_liters
        type: integer
        source: input
        description: "Total solution volume to deliver; fresh water plus recirculated drain water"
        constraints: ">= 100 and <= 200000"
      - name: requested_recirculated_liters
        type: integer
        source: input
        description: "Drain water the irrigation technician asks to blend back in"
        constraints: ">= 0 and <= planned_volume_liters"
      - name: reservoir_ec_ms
        type: number
        source: input
        description: "Electrical conductivity of the drain reservoir in mS/cm"
        constraints: ">= 0 and <= 12"
      - name: target_ec_ms
        type: number
        source: input
        description: "Feed EC target in mS/cm the injectors must reach"
        constraints: "> 0 and <= 6"
      - name: target_ph
        type: number
        source: input
        description: "Feed pH target"
        constraints: ">= 4.5 and <= 7.0"
      - name: n_ppm
        type: integer
        source: input
        description: "Nitrogen concentration of the recipe in ppm"
        constraints: ">= 0 and <= 400"
      - name: k_ppm
        type: integer
        source: input
        description: "Potassium concentration of the recipe in ppm"
        constraints: ">= 0 and <= 600"
      - name: ca_ppm
        type: integer
        source: input
        description: "Calcium concentration of the recipe in ppm"
        constraints: ">= 0 and <= 400"
      - name: drain_target_pct
        type: number
        source: input
        description: "Target drain fraction as a percentage of delivered volume"
        constraints: ">= 10 and <= 45"
      - name: provisional_blend_ec_ms
        type: number
        source: computed
        description: "First-pass blend EC computed from requested_recirculated_liters; the value that selects the recirculation cap tier"
      - name: recirc_cap_pct
        type: number
        source: computed
        description: "Recirculation cap tier selected from provisional_blend_ec_ms; never recomputed from the final blend"
      - name: recirculated_liters_applied
        type: integer
        source: computed
        description: "min(requested_recirculated_liters, floor(planned_volume_liters * recirc_cap_pct / 100))"
      - name: fresh_liters_applied
        type: integer
        source: computed
        description: "planned_volume_liters - recirculated_liters_applied"
      - name: blended_ec_ms
        type: number
        source: computed
        description: "Final blend EC after the cap is applied, 3 decimal places"
      - name: injector_ml
        type: number
        source: computed
        description: "Stock solution volume in ml needed to lift blended_ec_ms to target_ec_ms"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state; see §1.2 FertigationBatch"
        default: "MIXED"
        constraints: "MIXED | DELIVERED | RECONCILED | DISCARDED"
      - name: delivered_volume_liters
        type: integer
        source: input
        description: "Volume actually delivered to the crop, supplied on the DELIVERED transition"
        default: null
      - name: drain_reading_count
        type: integer
        source: computed
        description: "Number of drainage readings accepted against this batch"
        default: 0
      - name: cumulative_drain_volume_liters
        type: number
        source: computed
        description: "Sum of drain_volume_liters over accepted drainage readings"
        default: 0.00
      - name: last_drain_ec_ms
        type: number
        source: computed
        description: "drain_ec_ms of the most recently accepted drainage reading, ordered by reading_at then created_at"
        default: null
      - name: drain_fraction_pct
        type: number
        source: computed
        description: "round(100 * cumulative_drain_volume_liters / delivered_volume_liters, 2); null before delivery"
        default: null
      - name: drain_alarm
        type: boolean
        source: computed
        description: "True once any accepted reading breached DRAIN_EC_ALARM_MS or drove drain_fraction_pct outside the drain_target_pct band"
        default: false

  - name: ScoutingObservation
    parent: null
    common_fields: false
    fields:
      - name: zone_id
        type: string
        source: input
        description: "FK -> Zone.id; the scouted compartment"
      - name: crop_cycle_id
        type: string
        source: input
        description: "FK -> CropCycle.id; the scouted cycle"
      - name: observed_by_worker_id
        type: string
        source: system
        description: "FK -> Worker.id; taken from the X-User-ID header of the IPMScout who filed the observation, never from the body"
      - name: observed_at
        type: datetime
        source: input
        description: "Instant the scouting round was performed"
      - name: pest_code
        type: enum
        source: input
        description: "Pest scouted on this round"
        constraints: "WHITEFLY | THRIPS | SPIDER_MITE | APHID"
      - name: plants_inspected
        type: integer
        source: input
        description: "Number of plants inspected on the scouting round"
        constraints: ">= 1"
      - name: pest_count_per_plant
        type: number
        source: input
        description: "Mean pest count per inspected plant"
        constraints: ">= 0"
      - name: action_threshold
        type: number
        source: computed
        description: "Action threshold for pest_code taken from PEST_ACTION_THRESHOLDS"
      - name: threshold_status
        type: enum
        source: computed
        description: "BELOW when pest_count_per_plant < action_threshold, AT when equal, ABOVE when greater"
        constraints: "BELOW | AT | ABOVE"
      - name: release_required
        type: boolean
        source: computed
        description: "True when threshold_status IN {AT, ABOVE}"

  - name: BioControlRelease
    parent: null
    common_fields: true
    fields:
      - name: zone_id
        type: string
        source: input
        description: "FK -> Zone.id; the compartment receiving the beneficial agents"
      - name: observation_id
        type: string
        source: input
        description: "FK -> ScoutingObservation.id; the observation that justifies this release"
      - name: agent_code
        type: enum
        source: input
        description: "Beneficial agent to release"
        constraints: "ENCARSIA | AMBLYSEIUS | APHIDIUS"
      - name: planned_release_count
        type: integer
        source: input
        description: "Agents the scout proposes to release"
        constraints: ">= 100"
      - name: planned_release_date
        type: string
        source: input
        description: "ISO date the release is planned for"
      - name: requested_by_worker_id
        type: string
        source: system
        description: "FK -> Worker.id; X-User-ID of the IPMScout who filed the request"
      - name: decided_by_worker_id
        type: string
        source: system
        description: "FK -> Worker.id; X-User-ID of the IPMCoordinator who last decided the request"
        default: null
      - name: approved_release_count
        type: integer
        source: computed
        description: "revised_release_count when the coordinator supplied one, else planned_release_count; set on APPROVE"
        default: null
      - name: decision_reason
        type: string
        source: input
        description: "Coordinator note captured with the decision"
        default: null
      - name: revision_count
        type: integer
        source: computed
        description: "Number of times this request has been returned for revision; capped by MAX_RELEASE_REVISIONS"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state; see §1.2 BioControlRelease"
        default: "REQUESTED"
        constraints: "REQUESTED | APPROVED | REJECTED | RELEASED | CANCELLED"
      - name: released_at
        type: datetime
        source: input
        description: "Instant the agents were actually released"
        default: null
      - name: actual_release_count
        type: integer
        source: input
        description: "Agents actually released; must sit within RELEASE_COUNT_TOLERANCE_PCT of approved_release_count"
        default: null
      - name: reentry_hours
        type: integer
        source: computed
        description: "Worker re-entry interval for agent_code taken from AGENT_REENTRY_HOURS; applied on RELEASED"
        default: null

  - name: Worker
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Worker name"
      - name: skill
        type: enum
        source: input
        description: "Primary skill; a LaborTask may only be assigned to a worker whose skill matches task_type, and only SCOUT workers may file scouting observations or biocontrol decisions"
        constraints: "DELEAF | TRELLIS | HARVEST | SCOUT"
      - name: hourly_rate_usd
        type: number
        source: input
        description: "Base hourly wage"
        constraints: "> 0"
      - name: productivity_index
        type: number
        source: input
        description: "Multiplier applied to the task productivity standard for this worker"
        default: 1.00
        constraints: ">= 0.5 and <= 2.0"
      - name: status
        type: enum
        source: input
        description: "Employment state; INACTIVE workers may not be assigned new tasks"
        default: "ACTIVE"
        constraints: "ACTIVE | INACTIVE"
      - name: committed_hours
        type: number
        source: computed
        description: "Sum of LaborTask.planned_hours over this worker's tasks in {SCHEDULED, IN_PROGRESS}"
        default: 0.00

  - name: LaborTask
    parent: null
    common_fields: true
    fields:
      - name: zone_id
        type: string
        source: input
        description: "FK -> Zone.id; where the work happens"
      - name: crop_cycle_id
        type: string
        source: input
        description: "FK -> CropCycle.id; the cycle the work serves"
      - name: worker_id
        type: string
        source: input
        description: "FK -> Worker.id; the assigned worker"
      - name: task_type
        type: enum
        source: input
        description: "Work category; must equal the assigned worker's skill"
        constraints: "DELEAF | TRELLIS | HARVEST"
      - name: window_start
        type: datetime
        source: input
        description: "Start of the work window (ISO 8601 UTC)"
      - name: window_end
        type: datetime
        source: input
        description: "End of the work window (ISO 8601 UTC); closed interval [window_start, window_end] for worker occupancy purposes"
      - name: planned_units
        type: number
        source: input
        description: "Planned work units (plants for DELEAF/TRELLIS, lbs for HARVEST)"
        constraints: "> 0"
      - name: standard_units_per_hour
        type: number
        source: input
        description: "Productivity standard for this task type"
        constraints: "> 0"
      - name: planned_hours
        type: number
        source: computed
        description: "round(planned_units / (standard_units_per_hour * worker.productivity_index), 2)"
      - name: planned_cost_usd
        type: number
        source: computed
        description: "Overtime-aware wage cost of planned_hours; the amount debited from the zone labor budget while SCHEDULED or IN_PROGRESS"
      - name: actual_hours
        type: number
        source: input
        description: "Hours actually worked, supplied on completion"
        default: null
      - name: actual_units
        type: number
        source: input
        description: "Units actually produced, supplied on completion"
        default: null
      - name: productivity_ratio
        type: number
        source: computed
        description: "round((actual_units / actual_hours) / standard_units_per_hour, 4); null until completion"
        default: null
      - name: bonus_usd
        type: number
        source: computed
        description: "Piece bonus paid when productivity_ratio >= BONUS_RATIO_THRESHOLD"
        default: null
      - name: actual_cost_usd
        type: number
        source: computed
        description: "Overtime-aware wage cost of actual_hours plus bonus_usd; replaces planned_cost_usd in the zone budget once COMPLETED"
        default: null
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state; see §1.2 LaborTask"
        default: "SCHEDULED"
        constraints: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED | NO_SHOW"
      - name: cancel_reason
        type: string
        source: input
        description: "Reason recorded on CANCELLED or NO_SHOW"
        default: null

  - name: HarvestLot
    parent: null
    common_fields: true
    fields:
      - name: crop_cycle_id
        type: string
        source: input
        description: "FK -> CropCycle.id; the cycle harvested"
      - name: labor_task_id
        type: string
        source: input
        description: "FK -> LaborTask.id; the harvest task that produced the lot, optional"
        default: null
      - name: harvest_date
        type: string
        source: input
        description: "ISO date the lot was picked; determines which ISO week can consume it"
      - name: gross_weight_lbs
        type: number
        source: input
        description: "Gross picked weight before grading"
        constraints: "> 0"
      - name: grade_a_lbs
        type: number
        source: input
        description: "Grade A weight, supplied when grading"
        default: null
      - name: grade_b_lbs
        type: number
        source: input
        description: "Grade B weight, supplied when grading"
        default: null
      - name: cull_lbs
        type: number
        source: input
        description: "Unmarketable weight, supplied when grading"
        default: null
      - name: pack_out_pct
        type: number
        source: computed
        description: "round(100 * (grade_a_lbs + grade_b_lbs) / gross_weight_lbs, 2); null until graded"
        default: null
      - name: allocated_a_lbs
        type: number
        source: computed
        description: "Sum of LotAllocation.allocated_lbs on this lot with grade A and status IN {PROVISIONAL, CONFIRMED, RELEASED}"
        default: 0.00
      - name: allocated_b_lbs
        type: number
        source: computed
        description: "Sum of LotAllocation.allocated_lbs on this lot with grade B and status IN {PROVISIONAL, CONFIRMED, RELEASED}"
        default: 0.00
      - name: available_a_lbs
        type: number
        source: computed
        description: "grade_a_lbs - allocated_a_lbs; conserved-quantity partner of allocated_a_lbs"
        default: 0.00
      - name: available_b_lbs
        type: number
        source: computed
        description: "grade_b_lbs - allocated_b_lbs; conserved-quantity partner of allocated_b_lbs"
        default: 0.00
      - name: grading_status
        type: enum
        source: computed
        description: "Grading dimension of the parallel state machine"
        default: "UNGRADED"
        constraints: "UNGRADED | GRADED | REGRADED"
      - name: cold_chain_status
        type: enum
        source: computed
        description: "Cold chain dimension of the parallel state machine, independent of grading_status"
        default: "AMBIENT"
        constraints: "AMBIENT | PRECOOLED | COLD_HELD | RELEASED | REJECTED"
      - name: pulp_temp_c
        type: number
        source: input
        description: "Pulp temperature recorded with the most recent cold chain event"
        default: null
      - name: graded_by_worker_id
        type: string
        source: system
        description: "FK -> Worker.id; X-User-ID of the HarvestSupervisor who last graded or regraded the lot"
        default: null
      - name: cold_chain_released_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the QualityInspector who moved cold_chain_status to RELEASED; compared against the shipment signer for segregation of duties"
        default: null
      - name: regrade_count
        type: integer
        source: computed
        description: "Number of accepted regrades on this lot"
        default: 0

  - name: RetailProgram
    parent: null
    common_fields: true
    fields:
      - name: retailer_name
        type: string
        source: input
        description: "Retail customer name"
      - name: program_code
        type: string
        source: input
        description: "Program code, unique across all programs"
        constraints: "uniqueness enforced by ERR_PROGRAM_CODE_DUPLICATE"
      - name: grade_spec
        type: enum
        source: input
        description: "Which grades the program accepts; A_ONLY consumes grade A only, A_AND_B consumes grade A first then grade B"
        constraints: "A_ONLY | A_AND_B"
      - name: weekly_commitment_lbs
        type: number
        source: input
        description: "Default committed pounds per ISO week"
        constraints: "> 0"
      - name: price_per_lb_usd
        type: number
        source: input
        description: "Contract price per shipped pound"
        constraints: "> 0"
      - name: shortfall_penalty_per_lb_usd
        type: number
        source: input
        description: "Penalty per pound of shortfall"
        constraints: ">= 0"
      - name: priority_rank
        type: integer
        source: input
        description: "Waterfall priority; lower rank is served first"
        constraints: ">= 1 and <= 99"
      - name: status
        type: enum
        source: input
        description: "PAUSED programs are excluded from allocation runs"
        default: "ACTIVE"
        constraints: "ACTIVE | PAUSED"
      - name: at_risk_week_count
        type: integer
        source: computed
        description: "Number of times one of this program's commitment weeks reverted from ALLOCATED to OPEN because an allocation was revoked"
        default: 0
      - name: penalty_accrued_usd
        type: number
        source: computed
        description: "Sum of CommitmentWeek.final_penalty_usd over this program's weeks in {CLOSED_FULFILLED, CLOSED_SHORT}"
        default: 0.00

  - name: CommitmentWeek
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> RetailProgram.id; the program this week belongs to"
      - name: iso_week
        type: string
        source: input
        description: "ISO week label such as 2026-W34; unique per program"
        constraints: "matches ^\\d{4}-W\\d{2}$"
      - name: week_start_date
        type: string
        source: input
        description: "ISO date of the Monday opening the week; lots with harvest_date in [week_start_date, week_start_date + 7 days) are eligible"
      - name: committed_lbs
        type: number
        source: input
        description: "Pounds committed for this week; defaults to the program weekly_commitment_lbs"
        default: null
      - name: allocated_lbs
        type: number
        source: computed
        description: "Sum of LotAllocation.allocated_lbs on this week with status IN {PROVISIONAL, CONFIRMED, RELEASED} - the provisional variant input"
        default: 0.00
      - name: shipped_lbs
        type: number
        source: computed
        description: "Sum of LotAllocation.allocated_lbs on this week with status RELEASED - the final variant input"
        default: 0.00
      - name: fill_rate_pct
        type: number
        source: computed
        description: "round(100 * allocated_lbs / committed_lbs, 2) while not shipped; round(100 * shipped_lbs / committed_lbs, 2) once SHIPPED or closed"
        default: 0.00
      - name: provisional_shortfall_lbs
        type: number
        source: computed
        description: "max(0, committed_lbs - allocated_lbs)"
        default: 0.00
      - name: provisional_penalty_usd
        type: number
        source: computed
        description: "round(provisional_shortfall_lbs * program.shortfall_penalty_per_lb_usd, 2)"
        default: 0.00
      - name: final_shortfall_lbs
        type: number
        source: computed
        description: "max(0, committed_lbs - shipped_lbs); computed only on the close transition"
        default: null
      - name: final_penalty_usd
        type: number
        source: computed
        description: "round(final_shortfall_lbs * program.shortfall_penalty_per_lb_usd, 2); computed only on the close transition"
        default: null
      - name: gross_revenue_usd
        type: number
        source: computed
        description: "round(shipped_lbs * program.price_per_lb_usd, 2); computed only on the close transition"
        default: null
      - name: net_payout_usd
        type: number
        source: computed
        description: "round(gross_revenue_usd - final_penalty_usd, 2); computed only on the close transition"
        default: null
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state; see §1.2 CommitmentWeek"
        default: "OPEN"
        constraints: "OPEN | ALLOCATED | SHIPPED | CLOSED_FULFILLED | CLOSED_SHORT"
      - name: shipped_at
        type: datetime
        source: input
        description: "Instant the week's pallets left the packhouse"
        default: null
      - name: shipped_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the QualityInspector who signed the shipment"
        default: null

  - name: LotAllocation
    parent: null
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> HarvestLot.id; the lot supplying the pounds"
      - name: commitment_week_id
        type: string
        source: input
        description: "FK -> CommitmentWeek.id; the week consuming the pounds"
      - name: grade
        type: enum
        source: system
        description: "Which graded pool the pounds came from"
        constraints: "A | B"
      - name: allocated_lbs
        type: number
        source: system
        description: "Pounds moved from the lot's available pool to the week"
        constraints: "> 0"
      - name: allocated_at
        type: datetime
        source: system
        description: "Logical-clock instant of the allocation run that minted this row"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state; see §1.2 LotAllocation"
        default: "PROVISIONAL"
        constraints: "PROVISIONAL | CONFIRMED | RELEASED | REVOKED"
      - name: revoked_reason
        type: string
        source: input
        description: "Reason recorded when the row is revoked, or the literal AUTO_UNCONFIRMED_AT_SHIP when the ship transition drops an unconfirmed row"
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CropCycle
    initial_state: PLANNED
    terminal_states: [TERMINATED, ABORTED]
    shape: "branching with revert cycle (TERMINATION_SCHEDULED -> PRODUCTION) and a divergent ABORTED branch"
    transitions:
      - from: PLANNED
        to: TRANSPLANTED
        trigger: "POST /crop-cycles/{id}/transitions with to_status=TRANSPLANTED"
        actor: GrowerManager
        preconditions:
          - "cycle.status == PLANNED"
          - "no other CropCycle on this zone with status IN {TRANSPLANTED, PRODUCTION, TERMINATION_SCHEDULED}, else ERR_ZONE_OCCUPIED"
        side_effects:
          - "re-derives zone.status per calculation zone_posture_derivation; it reads PLANTED while this cycle is TRANSPLANTED"
          - "increments Zone.version by 1"
      - from: TRANSPLANTED
        to: PRODUCTION
        trigger: "POST /crop-cycles/{id}/transitions with to_status=PRODUCTION"
        actor: GrowerManager
        preconditions:
          - "cycle.status == TRANSPLANTED"
          - "current logical clock date >= cycle.first_harvest_allowed_date, else ERR_PRODUCTION_TOO_EARLY"
        side_effects:
          - "cycle becomes eligible to receive HarvestLot rows"
      - from: PRODUCTION
        to: TERMINATION_SCHEDULED
        trigger: "POST /crop-cycles/{id}/transitions with to_status=TERMINATION_SCHEDULED and termination_date"
        actor: GrowerManager
        preconditions:
          - "cycle.status == PRODUCTION"
          - "termination_date >= current logical clock date"
          - "termination_date <= planned_end_date + TERMINATION_GRACE_DAYS days, else ERR_TERMINATION_DATE_OUT_OF_RANGE"
        side_effects:
          - "records cycle.termination_date"
          - "new LaborTask rows on this cycle with window_start after termination_date are rejected with ERR_TASK_AFTER_TERMINATION"
      - from: TERMINATION_SCHEDULED
        to: PRODUCTION
        trigger: "POST /crop-cycles/{id}/transitions with to_status=PRODUCTION"
        actor: GrowerManager
        preconditions:
          - "cycle.status == TERMINATION_SCHEDULED"
        side_effects:
          - "clears cycle.termination_date to null"
        note: "Revert edge that makes this machine cyclic; the pair PRODUCTION -> TERMINATION_SCHEDULED -> PRODUCTION may repeat without limit."
      - from: TERMINATION_SCHEDULED
        to: TERMINATED
        trigger: "POST /crop-cycles/{id}/transitions with to_status=TERMINATED"
        actor: GrowerManager
        preconditions:
          - "cycle.status == TERMINATION_SCHEDULED"
          - "no LaborTask on this cycle with status IN {SCHEDULED, IN_PROGRESS}, else ERR_OPEN_LABOR_TASKS"
          - "no HarvestLot on this cycle with grading_status == UNGRADED, else ERR_UNGRADED_LOTS_REMAIN"
        side_effects:
          - "sets cycle.hive_count_placed = 0, which decrements zone.hive_slots_used by the released hive count"
          - "re-derives zone.status per calculation zone_posture_derivation"
          - "increments Zone.version by 1"
      - from: PRODUCTION
        to: ABORTED
        trigger: "POST /crop-cycles/{id}/transitions with to_status=ABORTED"
        actor: GrowerManager
        preconditions:
          - "cycle.status == PRODUCTION"
        side_effects:
          - "CASCADE hop 1: every LaborTask on this cycle with status IN {SCHEDULED, IN_PROGRESS} transitions to CANCELLED with cancel_reason=CROP_CYCLE_ABORTED"
          - "CASCADE hop 2: each of those task cancellations (not the abort itself) removes that task's planned_cost_usd from zone.labor_budget_committed_usd and restores the same amount to zone.labor_budget_remaining_usd, and subtracts its planned_hours from worker.committed_hours"
          - "sets cycle.hive_count_placed = 0, decrementing zone.hive_slots_used"
          - "re-derives zone.status per calculation zone_posture_derivation"
          - "increments Zone.version by 1"
        note: "Divergent branch: unlike TERMINATED, ABORTED does not require open tasks or ungraded lots to be cleared first - it force-cancels them and repays the budget."
      - from: TRANSPLANTED
        to: ABORTED
        trigger: "POST /crop-cycles/{id}/transitions with to_status=ABORTED"
        actor: GrowerManager
        preconditions:
          - "cycle.status == TRANSPLANTED"
        side_effects:
          - "same cascade as PRODUCTION -> ABORTED"

  - entity: ClimateStrategy
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, EXPIRED, CANCELLED]
    shape: "linear with a system auto-transition driven by the logical clock"
    transitions:
      - from: null
        to: ACTIVE
        trigger: "POST /climate-strategies"
        actor: GrowerManager
        preconditions:
          - "expected_zone_version == zone.version, else ERR_STALE_ZONE_VERSION"
          - "window_end > window_start, else ERR_INVALID_WINDOW"
          - "no ClimateStrategy on the same zone and regime with status == ACTIVE whose half-open window overlaps, unless supersede == true, else ERR_CLIMATE_WINDOW_OVERLAP"
          - "lighting_hours == 0 when zone.has_supplemental_lighting is false, and screen_position_pct == 0 when zone.has_thermal_screen is false, else ERR_ZONE_CAPABILITY_MISSING"
        side_effects:
          - "computes window_hours, planned_heat_kwh, planned_light_kwh, planned_co2_kg and projected_energy_cost_usd per calculation energy_cost variant projected"
          - "increments zone.climate_plan_revision by 1"
          - "increments Zone.version by 1"
          - "when supersede == true, the overlapped ACTIVE strategy transitions to SUPERSEDED"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /climate-strategies carrying supersede=true with a window overlapping this row on the same zone and regime"
        actor: GrowerManager
        preconditions:
          - "this row status == ACTIVE"
          - "the incoming window overlaps this row's half-open window"
        side_effects:
          - "status becomes SUPERSEDED; recorded actuals and settled_energy_cost_usd are left untouched"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /climate-strategies/{id}/transitions with to_status=CANCELLED"
        actor: GrowerManager
        preconditions:
          - "status == ACTIVE"
          - "actuals_recorded_at is null, else ERR_ACTUALS_ALREADY_RECORDED"
        side_effects:
          - "status becomes CANCELLED and the window is freed for a non-supersede create"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing the logical clock to or past window_end"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "window_end <= the new logical clock value"
        side_effects:
          - "status becomes EXPIRED; the window is freed for a non-supersede create"

  - entity: FertigationBatch
    initial_state: MIXED
    terminal_states: [RECONCILED, DISCARDED]
    shape: "linear with a repeatable drainage-reading self-loop on DELIVERED"
    transitions:
      - from: null
        to: MIXED
        trigger: "POST /fertigation-batches"
        actor: IrrigationTech
        preconditions:
          - "zone.irrigation_posture != LOCKED, else ERR_IRRIGATION_LOCKED"
          - "crop cycle status IN {TRANSPLANTED, PRODUCTION, TERMINATION_SCHEDULED}, else ERR_CROP_CYCLE_NOT_ACTIVE"
          - "crop cycle zone_id == zone_id, else ERR_CROP_CYCLE_ZONE_MISMATCH"
        side_effects:
          - "computes provisional_blend_ec_ms, recirc_cap_pct, recirculated_liters_applied, fresh_liters_applied, blended_ec_ms and injector_ml per calculation nutrient_blend_recirculation"
      - from: MIXED
        to: DELIVERED
        trigger: "POST /fertigation-batches/{id}/transitions with to_status=DELIVERED and delivered_volume_liters"
        actor: IrrigationTech
        preconditions:
          - "status == MIXED"
          - "zone.irrigation_posture != LOCKED, else ERR_IRRIGATION_LOCKED"
          - "delivered_volume_liters within DELIVERY_TOLERANCE_PCT of planned_volume_liters, else ERR_DELIVERY_VOLUME_VARIANCE"
        side_effects:
          - "records delivered_volume_liters; drainage readings become acceptable"
      - from: MIXED
        to: DISCARDED
        trigger: "POST /fertigation-batches/{id}/transitions with to_status=DISCARDED"
        actor: IrrigationTech
        preconditions:
          - "status == MIXED"
        side_effects:
          - "status becomes DISCARDED; no drainage readings may be filed"
      - from: DELIVERED
        to: DELIVERED
        trigger: "POST /fertigation-batches/{id}/drainage-readings"
        actor: IrrigationTech
        preconditions:
          - "status == DELIVERED, else ERR_BATCH_NOT_DELIVERED"
          - "reading_at >= batch_date 00:00:00Z and reading_at <= batch_date 00:00:00Z + DRAIN_READING_WINDOW_HOURS, else ERR_READING_OUT_OF_WINDOW"
        side_effects:
          - "increments drain_reading_count, adds drain_volume_liters to cumulative_drain_volume_liters, sets last_drain_ec_ms and recomputes drain_fraction_pct"
          - "CASCADE hop 1: when drain_ec_ms > DRAIN_EC_ALARM_MS or drain_fraction_pct falls outside [drain_target_pct - DRAIN_BAND_TOLERANCE_PCT, drain_target_pct + DRAIN_BAND_TOLERANCE_PCT], sets batch.drain_alarm = true and increments zone.drain_alarm_count by 1"
          - "CASCADE hop 2: caused by hop 1's counter, zone.irrigation_posture becomes WATCH when zone.drain_alarm_count == DRAIN_ALARM_WATCH_COUNT and LOCKED when zone.drain_alarm_count >= DRAIN_ALARM_LOCK_COUNT"
          - "CASCADE hop 3: caused by hop 2's LOCKED posture, every CropCycle in that zone with status IN {TRANSPLANTED, PRODUCTION, TERMINATION_SCHEDULED} gets nutrient_stress_flag = true"
          - "increments Zone.version by 1"
        note: "Self-loop: repeatable while status == DELIVERED. This is the drainage-monitoring cascade chain, distinct from the IPM chain."
      - from: DELIVERED
        to: RECONCILED
        trigger: "POST /fertigation-batches/{id}/transitions with to_status=RECONCILED"
        actor: IrrigationTech
        preconditions:
          - "status == DELIVERED"
          - "drain_reading_count >= 1, else ERR_NO_DRAIN_READINGS"
        side_effects:
          - "freezes drain_fraction_pct; further drainage readings are rejected with ERR_BATCH_NOT_DELIVERED"

  - entity: BioControlRelease
    initial_state: REQUESTED
    terminal_states: [REJECTED, RELEASED, CANCELLED]
    shape: "cyclic - APPROVED -> REQUESTED revision loop bounded by MAX_RELEASE_REVISIONS"
    transitions:
      - from: null
        to: REQUESTED
        trigger: "POST /bio-control-releases"
        actor: IPMScout
        preconditions:
          - "observation.release_required == true, else ERR_OBSERVATION_BELOW_THRESHOLD"
          - "observation.zone_id == body zone_id, else ERR_OBSERVATION_ZONE_MISMATCH"
          - "the acting Worker (X-User-ID) has skill == SCOUT, else ERR_WORKER_SKILL_MISMATCH"
        side_effects:
          - "records requested_by_worker_id from X-User-ID"
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /bio-control-releases/{id}/approve"
        actor: IPMCoordinator
        preconditions:
          - "status == REQUESTED"
          - "X-User-ID != observation.observed_by_worker_id, else ERR_SEGREGATION_OF_DUTIES"
          - "the acting Worker has skill == SCOUT, else ERR_WORKER_SKILL_MISMATCH"
        side_effects:
          - "sets approved_release_count = revised_release_count when supplied, else planned_release_count"
          - "records decided_by_worker_id"
      - from: APPROVED
        to: REQUESTED
        trigger: "POST /bio-control-releases/{id}/transitions with to_status=REQUESTED and decision_reason"
        actor: IPMCoordinator
        preconditions:
          - "status == APPROVED"
          - "revision_count < MAX_RELEASE_REVISIONS, else ERR_MAX_REVISIONS_EXCEEDED"
          - "X-User-ID != observation.observed_by_worker_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "increments revision_count by 1"
          - "resets approved_release_count to null"
        note: "Cycle edge. REQUESTED -> APPROVED -> REQUESTED may repeat until revision_count == MAX_RELEASE_REVISIONS, after which the loop is closed."
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /bio-control-releases/{id}/transitions with to_status=REJECTED and decision_reason"
        actor: IPMCoordinator
        preconditions:
          - "status == REQUESTED"
          - "decision_reason present, else ERR_DECISION_REASON_REQUIRED"
          - "X-User-ID != observation.observed_by_worker_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "records decided_by_worker_id; zone.open_pest_alert_count is left unchanged so the alert stays open"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /bio-control-releases/{id}/transitions with to_status=CANCELLED and decision_reason"
        actor: IPMScout
        preconditions:
          - "status == REQUESTED"
        side_effects:
          - "records decided_by_worker_id"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /bio-control-releases/{id}/transitions with to_status=CANCELLED and decision_reason"
        actor: IPMScout
        preconditions:
          - "status == APPROVED"
        side_effects:
          - "records decided_by_worker_id; approved_release_count is retained for audit"
      - from: APPROVED
        to: RELEASED
        trigger: "POST /bio-control-releases/{id}/execute"
        actor: IPMScout
        preconditions:
          - "status == APPROVED"
          - "abs(actual_release_count - approved_release_count) <= approved_release_count * RELEASE_COUNT_TOLERANCE_PCT / 100, else ERR_RELEASE_COUNT_OUT_OF_TOLERANCE"
          - "released_at >= observation.observed_at, else ERR_RELEASE_BEFORE_OBSERVATION"
        side_effects:
          - "sets reentry_hours from AGENT_REENTRY_HOURS[agent_code]"
          - "sets zone.reentry_clear_at = released_at + reentry_hours"
          - "decrements zone.open_pest_alert_count by 1 because this release closes the alert the observation opened"
          - "recomputes zone.ipm_posture per calculation zone_posture_derivation - the re-entry interval holds it at LOCKED even though the alert count fell"
          - "increments Zone.version by 1"

  - entity: LaborTask
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    shape: "branching with two divergent terminal exits (CANCELLED, NO_SHOW) sharing one budget-release side effect"
    transitions:
      - from: null
        to: SCHEDULED
        trigger: "POST /labor-tasks"
        actor: GrowerManager
        preconditions:
          - "crop cycle status IN {TRANSPLANTED, PRODUCTION}, else ERR_CROP_CYCLE_NOT_ACTIVE"
          - "worker.status == ACTIVE, else ERR_WORKER_INACTIVE"
          - "worker.skill == task_type, else ERR_WORKER_SKILL_MISMATCH"
          - "window_end > window_start, else ERR_INVALID_WINDOW"
          - "no other LaborTask on this worker with status IN {SCHEDULED, IN_PROGRESS} whose window, widened by WORKER_BUFFER_MINUTES on both sides, overlaps the requested window by a positive duration, else ERR_WORKER_DOUBLE_BOOKED"
          - "cycle.termination_date is null or window_start <= cycle.termination_date, else ERR_TASK_AFTER_TERMINATION"
          - "zone.labor_budget_remaining_usd >= planned_cost_usd, else ERR_LABOR_BUDGET_EXCEEDED"
        side_effects:
          - "computes planned_hours and planned_cost_usd per calculation labor_standard_cost variant planned"
          - "adds planned_cost_usd to zone.labor_budget_committed_usd and subtracts the same amount from zone.labor_budget_remaining_usd"
          - "adds planned_hours to worker.committed_hours"
          - "increments Zone.version by 1"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /labor-tasks/{id}/transitions with to_status=IN_PROGRESS"
        actor: HarvestSupervisor
        preconditions:
          - "status == SCHEDULED"
          - "zone.ipm_posture != LOCKED, else ERR_ZONE_IPM_LOCKED"
          - "current logical clock >= window_start, else ERR_TASK_WINDOW_NOT_OPEN"
        side_effects:
          - "status becomes IN_PROGRESS; the budget commitment is unchanged"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /labor-tasks/{id}/transitions with to_status=COMPLETED, actual_hours and actual_units"
        actor: HarvestSupervisor
        preconditions:
          - "status == IN_PROGRESS"
          - "actual_hours > 0 and actual_units > 0, else ERR_VALIDATION"
        side_effects:
          - "computes productivity_ratio, bonus_usd and actual_cost_usd per calculation labor_standard_cost variant actual"
          - "replaces this task's planned_cost_usd with actual_cost_usd inside zone.labor_budget_committed_usd and recomputes zone.labor_budget_remaining_usd"
          - "subtracts planned_hours from worker.committed_hours"
          - "increments Zone.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /labor-tasks/{id}/transitions with to_status=CANCELLED and cancel_reason"
        actor: HarvestSupervisor
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "removes exactly planned_cost_usd from zone.labor_budget_committed_usd and restores exactly planned_cost_usd to zone.labor_budget_remaining_usd"
          - "subtracts planned_hours from worker.committed_hours"
          - "increments Zone.version by 1"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /labor-tasks/{id}/transitions with to_status=CANCELLED and cancel_reason"
        actor: HarvestSupervisor
        preconditions:
          - "status == IN_PROGRESS"
        side_effects:
          - "same budget and worker-hours release as SCHEDULED -> CANCELLED"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /labor-tasks/{id}/transitions with to_status=NO_SHOW and cancel_reason"
        actor: HarvestSupervisor
        preconditions:
          - "status == SCHEDULED"
          - "current logical clock > window_end, else ERR_TASK_WINDOW_STILL_OPEN"
        side_effects:
          - "same budget and worker-hours release as SCHEDULED -> CANCELLED"
          - "the worker keeps no bonus and no actual_cost_usd is computed"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system cascade from the IPM posture lock (see ScoutingObservation side effects)"
        actor: system
        preconditions:
          - "status == SCHEDULED"
          - "task_type == HARVEST"
          - "window_start >= current logical clock"
          - "zone.ipm_posture just became LOCKED"
        side_effects:
          - "sets cancel_reason = IPM_POSTURE_LOCK"
          - "releases the budget commitment exactly as the manual cancel does"
          - "sets crop_cycle.labor_shortfall_flag = true"

  - entity: HarvestLot
    dimension: grading_status
    initial_state: UNGRADED
    terminal_states: []
    shape: "parallel dimension 1 of 2 on HarvestLot; evolves independently of cold_chain_status"
    transitions:
      - from: UNGRADED
        to: GRADED
        trigger: "POST /harvest-lots/{id}/grade"
        actor: HarvestSupervisor
        preconditions:
          - "grading_status == UNGRADED, else ERR_INVALID_STATE_TRANSITION"
          - "grade_a_lbs + grade_b_lbs + cull_lbs == gross_weight_lbs, else ERR_MASS_BALANCE_MISMATCH"
          - "cold_chain_status != REJECTED, else ERR_TERMINAL_STATE"
        side_effects:
          - "computes pack_out_pct, available_a_lbs = grade_a_lbs and available_b_lbs = grade_b_lbs"
          - "records graded_by_worker_id from X-User-ID"
      - from: GRADED
        to: REGRADED
        trigger: "POST /harvest-lots/{id}/regrade"
        actor: HarvestSupervisor
        preconditions:
          - "grading_status IN {GRADED, REGRADED}, else ERR_LOT_NOT_GRADED"
          - "expected_lot_version == lot.version, else ERR_STALE_LOT_VERSION"
          - "grade_a_lbs + grade_b_lbs + cull_lbs == gross_weight_lbs, else ERR_MASS_BALANCE_MISMATCH"
          - "new grade_a_lbs >= allocated_a_lbs and new grade_b_lbs >= allocated_b_lbs, else ERR_ALLOCATED_EXCEEDS_GRADE"
          - "cold_chain_status != RELEASED, else ERR_TERMINAL_STATE"
        side_effects:
          - "increments regrade_count by 1, recomputes pack_out_pct, available_a_lbs and available_b_lbs"
          - "increments HarvestLot.version by 1"
      - from: REGRADED
        to: REGRADED
        trigger: "POST /harvest-lots/{id}/regrade"
        actor: HarvestSupervisor
        preconditions:
          - "same as GRADED -> REGRADED"
        side_effects:
          - "same as GRADED -> REGRADED; the regrade edge is repeatable and each pass needs a fresh expected_lot_version"

  - entity: HarvestLot
    dimension: cold_chain_status
    initial_state: AMBIENT
    terminal_states: [RELEASED, REJECTED]
    shape: "parallel dimension 2 of 2 on HarvestLot; a REJECT from any non-RELEASED state fires the allocation-unwind cascade"
    transitions:
      - from: AMBIENT
        to: PRECOOLED
        trigger: "POST /harvest-lots/{id}/cold-chain-events with to_status=PRECOOLED and pulp_temp_c"
        actor: QualityInspector
        preconditions:
          - "cold_chain_status == AMBIENT"
          - "pulp_temp_c <= PRECOOL_MAX_C, else ERR_COLD_CHAIN_BREACH"
        side_effects:
          - "records pulp_temp_c"
      - from: PRECOOLED
        to: COLD_HELD
        trigger: "POST /harvest-lots/{id}/cold-chain-events with to_status=COLD_HELD and pulp_temp_c"
        actor: QualityInspector
        preconditions:
          - "cold_chain_status == PRECOOLED"
          - "pulp_temp_c <= COLD_HOLD_MAX_C, else ERR_COLD_CHAIN_BREACH"
        side_effects:
          - "records pulp_temp_c; the lot becomes eligible for LotAllocation confirmation"
      - from: COLD_HELD
        to: RELEASED
        trigger: "POST /harvest-lots/{id}/cold-chain-events with to_status=RELEASED and pulp_temp_c"
        actor: QualityInspector
        preconditions:
          - "cold_chain_status == COLD_HELD"
          - "grading_status IN {GRADED, REGRADED}, else ERR_LOT_NOT_GRADED"
          - "pulp_temp_c <= COLD_HOLD_MAX_C, else ERR_COLD_CHAIN_BREACH"
        side_effects:
          - "records cold_chain_released_by_user_id from the QualityInspector X-User-ID; this id is later compared against the shipment signer"
      - from: AMBIENT
        to: REJECTED
        trigger: "POST /harvest-lots/{id}/cold-chain-events with to_status=REJECTED and pulp_temp_c"
        actor: QualityInspector
        preconditions:
          - "cold_chain_status IN {AMBIENT, PRECOOLED, COLD_HELD}"
        side_effects:
          - "every LotAllocation on this lot with status IN {PROVISIONAL, CONFIRMED} transitions to REVOKED with revoked_reason=COLD_CHAIN_REJECT, which restores the lot's available pools and reduces each CommitmentWeek.allocated_lbs"
          - "removes gross_weight_lbs from crop_cycle.cumulative_harvested_lbs and recomputes yield_variance_pct"
      - from: PRECOOLED
        to: REJECTED
        trigger: "POST /harvest-lots/{id}/cold-chain-events with to_status=REJECTED and pulp_temp_c"
        actor: QualityInspector
        preconditions:
          - "cold_chain_status IN {AMBIENT, PRECOOLED, COLD_HELD}"
        side_effects:
          - "same as AMBIENT -> REJECTED"
      - from: COLD_HELD
        to: REJECTED
        trigger: "POST /harvest-lots/{id}/cold-chain-events with to_status=REJECTED and pulp_temp_c"
        actor: QualityInspector
        preconditions:
          - "cold_chain_status IN {AMBIENT, PRECOOLED, COLD_HELD}"
        side_effects:
          - "same as AMBIENT -> REJECTED"

  - entity: Zone
    dimension: ipm_posture
    initial_state: NORMAL
    terminal_states: []
    shape: "cyclic posture gate recomputed from open_pest_alert_count and reentry_clear_at; hosts the IPM cascade"
    transitions:
      - from: NORMAL
        to: SCOUT_ALERT
        trigger: "POST /scouting-observations whose computed threshold_status IN {AT, ABOVE}"
        actor: IPMScout
        preconditions:
          - "zone.open_pest_alert_count == 0 before this observation"
          - "current logical clock >= zone.reentry_clear_at or reentry_clear_at is null"
        side_effects:
          - "increments zone.open_pest_alert_count to 1"
          - "sets zone.ipm_posture = SCOUT_ALERT per calculation zone_posture_derivation"
          - "increments Zone.version by 1"
      - from: SCOUT_ALERT
        to: LOCKED
        trigger: "POST /scouting-observations whose computed threshold_status IN {AT, ABOVE}"
        actor: IPMScout
        preconditions:
          - "zone.open_pest_alert_count == PEST_ALERT_LOCK_COUNT - 1 before this observation"
        side_effects:
          - "CASCADE hop 1: increments zone.open_pest_alert_count to PEST_ALERT_LOCK_COUNT, which sets zone.ipm_posture = LOCKED"
          - "CASCADE hop 2: caused by hop 1's LOCKED posture, every LaborTask in this zone with status == SCHEDULED, task_type == HARVEST and window_start >= current logical clock transitions to CANCELLED with cancel_reason=IPM_POSTURE_LOCK"
          - "CASCADE hop 3: caused by each hop 2 cancellation, that task's crop_cycle.labor_shortfall_flag becomes true and the task's planned_cost_usd returns to zone.labor_budget_remaining_usd"
          - "increments Zone.version by 1"
        note: "Deepest cascade in the scaffold: observation -> zone posture -> harvest task cancellation -> crop cycle flag plus budget repayment."
      - from: LOCKED
        to: LOCKED
        trigger: "POST /bio-control-releases/{id}/execute"
        actor: IPMScout
        preconditions:
          - "zone.ipm_posture == LOCKED"
        side_effects:
          - "decrements zone.open_pest_alert_count by 1 but sets zone.reentry_clear_at = released_at + reentry_hours, so the posture stays LOCKED for the re-entry interval"
      - from: LOCKED
        to: NORMAL
        trigger: "POST /zones/{id}/posture-overrides with target_field=ipm_posture and target_value=NORMAL"
        actor: GrowerManager
        preconditions:
          - "expected_zone_version == zone.version, else ERR_STALE_ZONE_VERSION"
          - "override_reason present"
        side_effects:
          - "clears zone.open_pest_alert_count to 0 and zone.reentry_clear_at to null"
          - "sets zone.ipm_posture = NORMAL"
          - "increments Zone.version by 1"
        note: "Manual override is the only path out of LOCKED before the re-entry interval elapses; cancelled harvest tasks are NOT reinstated."
      - from: SCOUT_ALERT
        to: NORMAL
        trigger: "POST /zones/{id}/posture-overrides with target_field=ipm_posture and target_value=NORMAL"
        actor: GrowerManager
        preconditions:
          - "expected_zone_version == zone.version, else ERR_STALE_ZONE_VERSION"
        side_effects:
          - "same as LOCKED -> NORMAL"

  - entity: Zone
    dimension: irrigation_posture
    initial_state: NORMAL
    terminal_states: []
    shape: "cyclic posture gate recomputed from drain_alarm_count; driven by the drainage cascade"
    transitions:
      - from: NORMAL
        to: WATCH
        trigger: "POST /fertigation-batches/{id}/drainage-readings that raises drain_alarm_count to DRAIN_ALARM_WATCH_COUNT"
        actor: IrrigationTech
        preconditions:
          - "zone.drain_alarm_count == DRAIN_ALARM_WATCH_COUNT - 1 before the reading"
        side_effects:
          - "sets zone.irrigation_posture = WATCH; fertigation remains permitted"
      - from: WATCH
        to: LOCKED
        trigger: "POST /fertigation-batches/{id}/drainage-readings that raises drain_alarm_count to DRAIN_ALARM_LOCK_COUNT"
        actor: IrrigationTech
        preconditions:
          - "zone.drain_alarm_count == DRAIN_ALARM_LOCK_COUNT - 1 before the reading"
        side_effects:
          - "sets zone.irrigation_posture = LOCKED, blocking new batches and deliveries with ERR_IRRIGATION_LOCKED"
          - "sets nutrient_stress_flag = true on every CropCycle in the zone with status IN {TRANSPLANTED, PRODUCTION, TERMINATION_SCHEDULED}"
      - from: LOCKED
        to: NORMAL
        trigger: "POST /zones/{id}/posture-overrides with target_field=irrigation_posture and target_value=NORMAL"
        actor: GrowerManager
        preconditions:
          - "expected_zone_version == zone.version, else ERR_STALE_ZONE_VERSION"
        side_effects:
          - "clears zone.drain_alarm_count to 0 and sets zone.irrigation_posture = NORMAL"
          - "leaves every CropCycle.nutrient_stress_flag at true - the flag is an audit record, not a mirror of posture"
          - "increments Zone.version by 1"

  - entity: CommitmentWeek
    initial_state: OPEN
    terminal_states: [CLOSED_FULFILLED, CLOSED_SHORT]
    shape: "branching with an ALLOCATED -> OPEN revert cycle and two divergent close outcomes"
    transitions:
      - from: OPEN
        to: ALLOCATED
        trigger: "POST /allocation-runs"
        actor: GrowerManager
        preconditions:
          - "status == OPEN"
          - "program.status == ACTIVE"
          - "after the run allocated_lbs >= committed_lbs"
        side_effects:
          - "mints LotAllocation rows in status PROVISIONAL per calculation commitment_waterfall_allocation"
          - "recomputes allocated_lbs, fill_rate_pct, provisional_shortfall_lbs and provisional_penalty_usd"
          - "reduces available_a_lbs / available_b_lbs on every consumed HarvestLot"
      - from: OPEN
        to: OPEN
        trigger: "POST /allocation-runs"
        actor: GrowerManager
        preconditions:
          - "status == OPEN"
          - "program.status == ACTIVE"
          - "after the run allocated_lbs < committed_lbs"
        side_effects:
          - "same recomputes as OPEN -> ALLOCATED, but the week stays OPEN with a positive provisional_shortfall_lbs and provisional_penalty_usd"
        note: "Partial-fill self-loop; a later run may top the same week up because eligibility is evaluated per run."
      - from: ALLOCATED
        to: OPEN
        trigger: "POST /lot-allocations/{id}/transitions with to_status=REVOKED, or the HarvestLot REJECT cascade, dropping allocated_lbs below committed_lbs"
        actor: system
        preconditions:
          - "status == ALLOCATED"
          - "allocated_lbs < committed_lbs after the revocation"
        side_effects:
          - "increments program.at_risk_week_count by 1"
          - "recomputes fill_rate_pct, provisional_shortfall_lbs and provisional_penalty_usd"
        note: "Revert cycle edge. This rule is deliberately NOT applied inside the ALLOCATED -> SHIPPED transition, even though that transition also drops allocated_lbs."
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /commitment-weeks/{id}/transitions with to_status=SHIPPED and shipped_at"
        actor: QualityInspector
        preconditions:
          - "status == ALLOCATED"
          - "at least one LotAllocation on this week has status == CONFIRMED, else ERR_NO_CONFIRMED_ALLOCATIONS"
          - "the acting X-User-ID differs from cold_chain_released_by_user_id on every lot allocated to this week, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "every CONFIRMED LotAllocation on this week transitions to RELEASED"
          - "every PROVISIONAL LotAllocation on this week transitions to REVOKED with revoked_reason=AUTO_UNCONFIRMED_AT_SHIP, restoring available_a_lbs / available_b_lbs on its lot"
          - "recomputes shipped_lbs from RELEASED rows only and recomputes fill_rate_pct from shipped_lbs"
          - "records shipped_at and shipped_by_user_id"
          - "the ALLOCATED -> OPEN revert rule is suppressed for this transition"
      - from: SHIPPED
        to: CLOSED_FULFILLED
        trigger: "POST /commitment-weeks/{id}/transitions with to_status=CLOSED"
        actor: GrowerManager
        preconditions:
          - "status == SHIPPED"
          - "shipped_lbs >= committed_lbs"
        side_effects:
          - "computes final_shortfall_lbs, final_penalty_usd, gross_revenue_usd and net_payout_usd per calculation commitment_payout variant final"
          - "adds final_penalty_usd to program.penalty_accrued_usd"
      - from: SHIPPED
        to: CLOSED_SHORT
        trigger: "POST /commitment-weeks/{id}/transitions with to_status=CLOSED"
        actor: GrowerManager
        preconditions:
          - "status == SHIPPED"
          - "shipped_lbs < committed_lbs"
        side_effects:
          - "same computations as SHIPPED -> CLOSED_FULFILLED, with a positive final_penalty_usd"
      - from: OPEN
        to: CLOSED_SHORT
        trigger: "POST /commitment-weeks/{id}/transitions with to_status=CLOSED"
        actor: GrowerManager
        preconditions:
          - "status == OPEN"
          - "current logical clock date >= week_start_date + 7 days, else ERR_WEEK_STILL_OPEN"
        side_effects:
          - "every LotAllocation on this week with status IN {PROVISIONAL, CONFIRMED} transitions to REVOKED with revoked_reason=WEEK_CLOSED_SHORT, restoring lot availability"
          - "shipped_lbs stays 0.00 so final_penalty_usd is the full committed shortfall"
          - "adds final_penalty_usd to program.penalty_accrued_usd"

  - entity: LotAllocation
    initial_state: PROVISIONAL
    terminal_states: [RELEASED, REVOKED]
    shape: "linear with a compensating REVOKED exit reachable from both non-terminal states"
    transitions:
      - from: null
        to: PROVISIONAL
        trigger: "POST /allocation-runs"
        actor: GrowerManager
        preconditions:
          - "the run selected this lot and week per calculation commitment_waterfall_allocation"
        side_effects:
          - "adds allocated_lbs to lot.allocated_a_lbs or lot.allocated_b_lbs and subtracts it from the matching available pool"
          - "adds allocated_lbs to week.allocated_lbs"
      - from: PROVISIONAL
        to: CONFIRMED
        trigger: "POST /lot-allocations/{id}/transitions with to_status=CONFIRMED"
        actor: QualityInspector
        preconditions:
          - "status == PROVISIONAL"
          - "lot.cold_chain_status == COLD_HELD, else ERR_LOT_NOT_COLD_HELD"
          - "lot.grading_status IN {GRADED, REGRADED}, else ERR_LOT_NOT_GRADED"
          - "week.status == ALLOCATED, else ERR_WEEK_NOT_ALLOCATED"
        side_effects:
          - "status becomes CONFIRMED; the lot and week pounds are unchanged because CONFIRMED still counts toward allocated_lbs"
      - from: PROVISIONAL
        to: REVOKED
        trigger: "POST /lot-allocations/{id}/transitions with to_status=REVOKED and revoked_reason"
        actor: GrowerManager
        preconditions:
          - "status == PROVISIONAL"
          - "week.status IN {OPEN, ALLOCATED}, else ERR_WEEK_ALREADY_SHIPPED"
        side_effects:
          - "CASCADE hop 1: subtracts allocated_lbs from lot.allocated_a_lbs or lot.allocated_b_lbs and adds exactly the same amount back to the matching available pool"
          - "CASCADE hop 2: caused by hop 1, week.allocated_lbs falls by allocated_lbs and fill_rate_pct, provisional_shortfall_lbs and provisional_penalty_usd are recomputed; an ALLOCATED week that is now short transitions to OPEN"
          - "CASCADE hop 3: caused by hop 2's ALLOCATED -> OPEN transition, program.at_risk_week_count increments by 1"
      - from: CONFIRMED
        to: REVOKED
        trigger: "POST /lot-allocations/{id}/transitions with to_status=REVOKED and revoked_reason"
        actor: GrowerManager
        preconditions:
          - "status == CONFIRMED"
          - "week.status IN {OPEN, ALLOCATED}, else ERR_WEEK_ALREADY_SHIPPED"
        side_effects:
          - "same three-hop cascade as PROVISIONAL -> REVOKED"
      - from: PROVISIONAL
        to: REVOKED
        trigger: "system cascade from ALLOCATED -> SHIPPED on the week (unconfirmed rows are dropped), from a HarvestLot REJECT, or from OPEN -> CLOSED_SHORT"
        actor: system
        preconditions:
          - "status == PROVISIONAL"
        side_effects:
          - "sets revoked_reason to AUTO_UNCONFIRMED_AT_SHIP, COLD_CHAIN_REJECT or WEEK_CLOSED_SHORT respectively"
          - "restores the lot's available pool by exactly allocated_lbs"
      - from: CONFIRMED
        to: RELEASED
        trigger: "system cascade from ALLOCATED -> SHIPPED on the week"
        actor: system
        preconditions:
          - "status == CONFIRMED"
          - "week transitioned to SHIPPED"
        side_effects:
          - "the pounds move from week.allocated_lbs accounting into week.shipped_lbs accounting; the lot's allocated pool is unchanged because RELEASED still counts as allocated"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version only)
# =============================================================================
concurrency_rules:
  - rule_id: climate-strategy-create-stale-zone
    parent_entity: Zone
    write_endpoint: "POST /climate-strategies"
    occ_field: "expected_zone_version"
    description: |
      Creating a ClimateStrategy against a Zone whose version has advanced since
      the client last read it is rejected. A climate window may legitimately
      supersede an overlapping ACTIVE window, so a second create carrying the
      previously observed Zone.version is a stale-view write rather than an
      invalid state transition, and OCC is the only guard that can reject it.
    error_id: ERR_STALE_ZONE_VERSION
    http_status: 412

  - rule_id: zone-posture-override-stale-zone
    parent_entity: Zone
    write_endpoint: "POST /zones/{id}/posture-overrides"
    occ_field: "expected_zone_version"
    description: |
      A posture override carrying an out-of-date Zone.version is rejected. The
      override itself is legitimately repeatable - clearing an IPM lock twice is
      not an invalid transition - so nothing in §1.2 rejects the second write;
      only the stale version does.
    error_id: ERR_STALE_ZONE_VERSION
    http_status: 412

  - rule_id: lot-regrade-stale-lot
    parent_entity: HarvestLot
    write_endpoint: "POST /harvest-lots/{id}/regrade"
    occ_field: "expected_lot_version"
    description: |
      A regrade carrying an out-of-date HarvestLot.version is rejected. Regrading
      is legitimately repeatable, and an allocation run against the lot bumps its
      version between two regrades, so a writer holding the pre-run version would
      otherwise overwrite a split that no longer matches the allocated pounds.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
# All money and index arithmetic uses Decimal with ROUND_HALF_UP at the stated
# precision. Every intermediate marked "quantize" is rounded before it is used
# downstream; unmarked intermediates stay at full precision.
# =============================================================================
calculations:
  - name: expected_yield_curve
    description: |
      Projects a crop cycle's expected harvest curve, one figure per production
      week, from the zone's growing area, the variety's weekly yield index curve
      and the achieved plant density relative to the variety's nominal density.
    trigger: "POST /crop-cycles (create), and re-run on POST /crop-cycles/{id}/transitions with to_status=TRANSPLANTED when plants_transplanted changed"
    inputs:
      - "zone.area_sqft"
      - "variety.plant_density_per_sqft"
      - "variety.yield_curve_lbs_per_sqft (per-week lbs per square foot; length = cycle_length_weeks - first_harvest_week + 1)"
      - "crop_cycle.plants_transplanted"
      - "crop_cycle.pollination_haircut_pct (0 until a pollination check sets it)"
    algorithm: projection
    formula: |
      nominal_plants        = zone.area_sqft * variety.plant_density_per_sqft
      density_factor        = quantize(plants_transplanted / nominal_plants, 4)
      density_factor        = min(density_factor, MAX_DENSITY_FACTOR)

      # per-week figures are quantized to 2dp BEFORE they are summed
      expected_weekly_yield_lbs[i] = quantize(
          variety.yield_curve_lbs_per_sqft[i] * zone.area_sqft * density_factor, 2)

      baseline_total_yield_lbs = quantize(sum(expected_weekly_yield_lbs), 2)
      expected_total_yield_lbs = quantize(
          baseline_total_yield_lbs * (1 - pollination_haircut_pct / 100), 2)

      # after each harvest lot is graded:
      cumulative_harvested_lbs = sum(lot.gross_weight_lbs for lots on this cycle
                                     with cold_chain_status != REJECTED)
      yield_variance_pct = quantize(
          100 * (cumulative_harvested_lbs - expected_total_yield_lbs)
              / expected_total_yield_lbs, 2)
    constants:
      MAX_DENSITY_FACTOR: 1.2
    precision: "density_factor 4 decimal places; weekly and total pounds 2 decimal places; variance percent 2 decimal places; ROUND_HALF_UP throughout"
    variants:
      - name: round_then_sum
        when: "always - this is the normative order for baseline_total_yield_lbs"
        difference: "each week is quantized to 2dp first, then the ten quantized weeks are added"
      - name: sum_then_round
        when: "never - documented only to pin the order of operations"
        difference: >
          Summing the unrounded products and quantizing once yields 82688.63 for
          the worked example, one cent below the normative 82688.64. Implementations
          must reproduce the round-then-sum figure.
    worked_example: |
      area_sqft = 9450, plant_density_per_sqft = 0.24, plants_transplanted = 2157
      curve = [0.4, 0.8, 1.1, 1.3, 1.3, 1.2, 1.0, 0.9, 0.7, 0.5]
      nominal_plants = 2268.0 ; density_factor = quantize(0.951058..., 4) = 0.9511
      weekly = [3595.16, 7190.32, 9886.68, 11684.26, 11684.26,
                10785.47, 8987.90, 8089.11, 6291.53, 4493.95]
      baseline_total_yield_lbs = 82688.64   (sum-then-round would give 82688.63)
      with pollination_haircut_pct = 12: expected_total_yield_lbs = 72766.00

  - name: energy_cost
    description: |
      Values a climate strategy window twice: a projected cost from the planned
      setpoints at strategy creation, then a settled cost from metered gas, CHP
      generation and grid import when actuals are recorded.
    trigger: "projected variant on POST /climate-strategies; settled variant on POST /climate-strategies/{id}/actuals"
    inputs:
      - "zone.area_sqft"
      - "strategy.window_start / window_end (window_hours is derived from them)"
      - "strategy.temp_setpoint_c, outside_temp_c is fixed at OUTSIDE_TEMP_C"
      - "strategy.co2_setpoint_ppm, strategy.lighting_hours, strategy.screen_position_pct"
      - "actuals: gas_consumed_m3, chp_generated_kwh, grid_import_kwh (screen_deployed_hours is stored for audit and does not enter the cost)"
      - "zone.chp_connected (selects the settlement variant)"
    algorithm: aggregation
    formula: |
      # ---- projected variant (planned setpoints) ----
      window_hours     = quantize((window_end - window_start) in hours, 2)
      screen_credit    = 1 - SCREEN_SAVING_FACTOR * screen_position_pct / 100
      planned_heat_kwh = quantize(HEAT_COEFF * area_sqft
                                  * max(0, temp_setpoint_c - OUTSIDE_TEMP_C)
                                  * window_hours * screen_credit, 2)
      planned_light_kwh = quantize(LIGHT_KW_PER_SQFT * area_sqft
                                  * lighting_hours, 2)
      planned_co2_kg    = quantize(CO2_COEFF * area_sqft
                                  * max(0, co2_setpoint_ppm - AMBIENT_CO2_PPM) / 100
                                  * window_hours, 2)
      projected_energy_cost_usd = quantize(
          planned_heat_kwh * GAS_USD_PER_KWH
        + planned_light_kwh * GRID_BUY_USD_PER_KWH
        + planned_co2_kg * CO2_USD_PER_KG, 2)

      # ---- settled variant, zone.chp_connected == true ----
      gas_cost            = quantize(gas_consumed_m3 * GAS_USD_PER_M3, 2)
      chp_heat_kwh        = quantize(chp_generated_kwh * CHP_HEAT_TO_POWER, 2)
      power_share         = quantize(chp_generated_kwh
                                     / (chp_generated_kwh + chp_heat_kwh), 4)
      allocated_power_cost = quantize(gas_cost * power_share, 2)
      allocated_heat_cost  = quantize(gas_cost - allocated_power_cost, 2)
      grid_cost            = quantize(grid_import_kwh * GRID_BUY_USD_PER_KWH, 2)
      co2_offset_kg        = min(planned_co2_kg,
                                 quantize(chp_generated_kwh * CO2_KG_PER_CHP_KWH, 2))
      co2_purchase_cost    = quantize(max(0, quantize(planned_co2_kg - co2_offset_kg, 2))
                                      * CO2_USD_PER_KG, 2)
      export_credit        = quantize(max(0, quantize(chp_generated_kwh
                                      - planned_light_kwh, 2)) * GRID_SELL_USD_PER_KWH, 2)
      settled_energy_cost_usd = quantize(allocated_heat_cost + grid_cost
                                         + co2_purchase_cost - export_credit, 2)

      # ---- settled variant, zone.chp_connected == false ----
      settled_energy_cost_usd = quantize(gas_cost + grid_cost
                                         + quantize(planned_co2_kg * CO2_USD_PER_KG, 2), 2)

      cost_variance_usd = quantize(settled_energy_cost_usd
                                   - projected_energy_cost_usd, 2)
    constants:
      HEAT_COEFF: 0.00042
      OUTSIDE_TEMP_C: 8.0
      SCREEN_SAVING_FACTOR: 0.35
      LIGHT_KW_PER_SQFT: 0.012
      CO2_COEFF: 0.00018
      AMBIENT_CO2_PPM: 420
      GAS_USD_PER_KWH: 0.045
      GAS_USD_PER_M3: 0.42
      GRID_BUY_USD_PER_KWH: 0.14
      GRID_SELL_USD_PER_KWH: 0.06
      CO2_USD_PER_KG: 0.09
      CHP_HEAT_TO_POWER: 1.15
      CO2_KG_PER_CHP_KWH: 0.18
    precision: "power_share 4 decimal places; every kWh, kg and USD figure 2 decimal places; ROUND_HALF_UP"
    variants:
      - name: projected
        when: "strategy is created; actuals_recorded_at is null"
        difference: "driven purely by setpoints; ignores metered volumes; the thermal screen reduces heat demand"
      - name: settled_with_chp
        when: "actuals recorded and zone.chp_connected == true"
        difference: >
          Gas is split between heat and power by power_share, only the heat share
          is charged to the crop, surplus CHP output earns an export credit and CHP
          flue gas offsets purchased CO2 - non-linear because of the two max(0,...)
          clamps and the min(...) offset cap.
      - name: settled_without_chp
        when: "actuals recorded and zone.chp_connected == false"
        difference: "the whole gas bill is charged to the crop, no export credit, no CO2 offset"
    worked_example: |
      area_sqft = 9450, window_hours = 12, temp_setpoint_c = 21.5,
      co2_setpoint_ppm = 900, lighting_hours = 6, screen_position_pct = 40
        planned_heat_kwh = 552.96 ; planned_light_kwh = 680.40
        planned_co2_kg   = 97.98  ; projected_energy_cost_usd = 128.96
      actuals gas 1840.0 m3, chp 4200.0 kWh, grid 350.0 kWh, chp_connected = true
        gas_cost 772.80 ; chp_heat_kwh 4830.00 ; power_share 0.4651
        allocated_power_cost 359.43 ; allocated_heat_cost 413.37 ; grid_cost 49.00
        co2_offset_kg 97.98 ; co2_purchase_cost 0.00 ; export_credit 211.18
        settled_energy_cost_usd = 251.19 ; cost_variance_usd = 122.23
      same actuals with chp_connected = false
        settled_energy_cost_usd = 830.62

  - name: nutrient_blend_recirculation
    description: |
      Decides how much recirculated drain water a fertigation batch may reuse and
      how much stock solution must be injected to reach the recipe's target EC.
      The recirculation cap is selected from a PROVISIONAL blend EC computed on the
      requested volumes; it is never recomputed from the final blend, even though
      the final blend is what the injector dose is based on.
    trigger: "POST /fertigation-batches"
    inputs:
      - "batch.planned_volume_liters"
      - "batch.requested_recirculated_liters"
      - "batch.reservoir_ec_ms (measured EC of the drain reservoir)"
      - "recipe target_ec_ms carried on the batch as target_ec_ms"
    algorithm: constraint_propagation
    formula: |
      # step 1 - provisional blend on the volumes the client ASKED for
      provisional_fresh      = planned_volume_liters - requested_recirculated_liters
      provisional_blend_ec_ms = quantize(
          (provisional_fresh * FRESH_WATER_EC_MS
           + requested_recirculated_liters * reservoir_ec_ms)
          / planned_volume_liters, 3)

      # step 2 - cap chosen from the PROVISIONAL figure only (single pass)
      if provisional_blend_ec_ms <= RECIRC_TIER1_EC:   recirc_cap_pct = 60
      elif provisional_blend_ec_ms <= RECIRC_TIER2_EC: recirc_cap_pct = 40
      else:                                           recirc_cap_pct = 0

      # step 3 - apply the cap
      recirculated_liters_applied = min(
          requested_recirculated_liters,
          floor(planned_volume_liters * recirc_cap_pct / 100))
      fresh_liters_applied = planned_volume_liters - recirculated_liters_applied

      # step 4 - final blend and injector dose
      blended_ec_ms = quantize(
          (fresh_liters_applied * FRESH_WATER_EC_MS
           + recirculated_liters_applied * reservoir_ec_ms)
          / planned_volume_liters, 3)
      injector_ml = quantize(max(0, target_ec_ms - blended_ec_ms)
                             * STOCK_ML_PER_EC_PER_1000L
                             * planned_volume_liters / 1000, 1)
    constants:
      FRESH_WATER_EC_MS: 0.4
      RECIRC_TIER1_EC: 2.5
      RECIRC_TIER2_EC: 3.2
      STOCK_ML_PER_EC_PER_1000L: 85
    precision: "EC values 3 decimal places; injector_ml 1 decimal place; applied liters are whole liters via floor on the cap; ROUND_HALF_UP for quantize steps"
    variants:
      - name: cap_not_binding
        when: "requested_recirculated_liters <= floor(planned_volume_liters * recirc_cap_pct / 100)"
        difference: "the request is honoured in full and blended_ec_ms equals provisional_blend_ec_ms"
      - name: cap_binding
        when: "requested_recirculated_liters exceeds the capped volume"
        difference: >
          The applied volume is clipped, so blended_ec_ms lands BELOW the tier that
          selected the cap. Recomputing the cap from blended_ec_ms would move it up a
          tier and change the answer, which is exactly why step 2 is pinned to the
          provisional figure.
    worked_example: |
      planned 12000 L, reservoir_ec_ms 4.6, target_ec_ms 3.0
      B1 requested 6000  -> provisional 2.500, cap 60, applied 6000, fresh 6000,
                            blended 2.500, injector_ml 510.0
      B2 requested 8000  -> provisional 3.200, cap 40, applied 4800, fresh 7200,
                            blended 2.080, injector_ml 938.4
                            (blended 2.080 sits in tier 1, whose cap would be 60 and
                             would allow all 8000 L - the cap is NOT revisited)
      B3 planned 10000, requested 9000 -> provisional 4.180, cap 0, applied 0,
                            fresh 10000, blended 0.400, injector_ml 2210.0

  - name: labor_standard_cost
    description: |
      Costs a labor task from productivity standards before it runs, then re-costs
      it from actual hours on completion and pays a productivity bonus when the
      crew beat the standard rate by the bonus threshold or more.
    trigger: "planned variant on POST /labor-tasks; actual variant on POST /labor-tasks/{id}/transitions with to_status=COMPLETED"
    inputs:
      - "task.planned_units (plants deleafed, stems trellised or lbs harvested)"
      - "task.standard_units_per_hour"
      - "worker.productivity_index"
      - "worker.hourly_rate_usd"
      - "completion payload: actual_hours, actual_units"
    algorithm: threshold
    formula: |
      cost_of(hours) = quantize(
            min(hours, OT_THRESHOLD_HOURS) * hourly_rate_usd
          + max(0, hours - OT_THRESHOLD_HOURS) * hourly_rate_usd * OT_MULTIPLIER, 2)

      # planned variant
      planned_hours    = quantize(planned_units
                          / (standard_units_per_hour * worker.productivity_index), 2)
      planned_cost_usd = cost_of(planned_hours)

      # actual variant, on completion
      productivity_ratio = quantize((actual_units / actual_hours)
                                    / standard_units_per_hour, 4)
      bonus_usd = quantize(actual_units * BONUS_USD_PER_UNIT, 2)
                  if productivity_ratio >= BONUS_RATIO_THRESHOLD else 0.00
      actual_cost_usd = quantize(cost_of(actual_hours) + bonus_usd, 2)
    constants:
      OT_THRESHOLD_HOURS: 8
      OT_MULTIPLIER: 1.5
      BONUS_RATIO_THRESHOLD: 1.10
      BONUS_USD_PER_UNIT: 0.02
    precision: "hours 2 decimal places; productivity_ratio 4 decimal places; USD 2 decimal places; ROUND_HALF_UP"
    variants:
      - name: planned
        when: "task creation; charged against zone.labor_budget_committed_usd"
        difference: "hours are derived from the standard and the worker's productivity index, not measured"
      - name: actual
        when: "task completion"
        difference: >
          Hours are measured, overtime is applied to the measured hours and a bonus
          may be added, so actual_cost_usd routinely differs from planned_cost_usd.
          The zone budget is adjusted by the delta at completion.
    worked_example: |
      T1 harvest: planned_units 4200, standard 520/h, productivity_index 1.05, rate 19.50
        planned_hours 7.69 -> planned_cost_usd 149.96
        completion actual_hours 9.0, actual_units 5100
          productivity_ratio quantize((5100/9.0)/520, 4) = 1.0897 -> below 1.10, bonus 0.00
          actual_cost_usd = 8*19.50 + 1*19.50*1.5 = 185.25
      T2 boundary: planned_units 4000, standard 500/h, productivity_index 1.00, rate 19.50
        planned_hours 8.00 -> planned_cost_usd 156.00
        completion actual_hours 8.0, actual_units 4400
          productivity_ratio = 1.1000 -> exactly at threshold, bonus 88.00
          actual_cost_usd = 156.00 + 88.00 = 244.00
      T3 deleaf: planned_units 2100, standard 300/h, productivity_index 1.05, rate 17.25
        planned_hours 6.67 -> planned_cost_usd 115.06
      zone.labor_budget_usd 20000.00 with T1 scheduled ->
        labor_budget_committed_usd 149.96, labor_budget_remaining_usd 19850.04

  - name: lot_grading_packout
    description: "Splits a harvest lot into grade A, grade B and cull pounds and reports the saleable pack-out percentage."
    trigger: "POST /harvest-lots/{id}/grade and POST /harvest-lots/{id}/regrade"
    inputs:
      - "lot.gross_weight_lbs"
      - "grade_a_lbs, grade_b_lbs, cull_lbs from the grading payload"
    algorithm: aggregation
    formula: |
      # mass must balance exactly, checked before anything is written
      grade_a_lbs + grade_b_lbs + cull_lbs == gross_weight_lbs
      pack_out_pct = quantize(100 * (grade_a_lbs + grade_b_lbs)
                             / gross_weight_lbs, 2)
      available_a_lbs = quantize(grade_a_lbs - allocated_a_lbs, 2)
      available_b_lbs = quantize(grade_b_lbs - allocated_b_lbs, 2)
    constants:
      MIN_PACK_OUT_PCT: 80.00
    precision: "2 decimal places, ROUND_HALF_UP"
    variants:
      - name: initial_grade
        when: "grading_status == UNGRADED"
        difference: "allocated_a_lbs and allocated_b_lbs are 0, so available equals graded"
      - name: regrade
        when: "grading_status IN {GRADED, REGRADED}; requires expected_lot_version"
        difference: >
          The already-allocated pounds are subtracted from the new split, so a
          regrade that drops a grade below its allocated pounds is rejected by the
          conservation invariant rather than producing a negative availability.
    worked_example: |
      L1 gross 2000, A 1200, B 700, cull 100 -> pack_out_pct 95.00
      L2 gross 3000, A 1800, B 1000, cull 200 -> pack_out_pct 93.33

  - name: commitment_waterfall_allocation
    description: |
      Allocates graded, cold-chain-eligible harvest pounds to open retail
      commitment weeks in a fully deterministic waterfall: the highest priority
      program week fills before the next one gets anything, and within a week the
      oldest eligible lot is drained first.
    trigger: "POST /allocation-runs"
    inputs:
      - "run payload: week_start_date"
      - "eligible CommitmentWeek rows for that week_start_date"
      - "eligible HarvestLot rows for that week_start_date"
    algorithm: waterfall_allocation
    formula: |
      # ---- target set, in this exact order ----
      targets = CommitmentWeek rows where
                  week_start_date == run.week_start_date
                  AND status == OPEN
                  AND program.status == ACTIVE
      order targets by program.priority_rank ASC, program.created_at ASC

      # ---- candidate lot set, in this exact order ----
      candidates = HarvestLot rows where
                  grading_status IN {GRADED, REGRADED}
                  AND cold_chain_status IN {PRECOOLED, COLD_HELD}
                  AND week_start_date <= harvest_date < week_start_date + 7 days
      order candidates by harvest_date ASC, created_at ASC

      for each target in order:
          need = quantize(target.committed_lbs - target.allocated_lbs, 2)
          grades = ['A'] if program.grade_spec == 'A_ONLY' else ['A', 'B']
          for grade in grades:                 # A is exhausted before B is touched
              for lot in candidates in order:
                  if need <= 0: break
                  pool = lot.available_a_lbs if grade == 'A' else lot.available_b_lbs
                  take = min(need, pool)
                  if take <= 0: continue
                  create LotAllocation(lot, target, grade, allocated_lbs = take,
                                       status = PROVISIONAL)
                  pool  -= take                # lot availability falls immediately
                  need  = quantize(need - take, 2)
          target.allocated_lbs = quantize(sum(allocations in
                                     {PROVISIONAL, CONFIRMED, RELEASED}), 2)
          target.status = ALLOCATED if target.allocated_lbs >= committed_lbs else OPEN
    constants:
      LOT_ELIGIBILITY_WINDOW_DAYS: 7
    precision: "pounds 2 decimal places, ROUND_HALF_UP; ties are broken only by the declared sort keys, never by id"
    variants:
      - name: full_fill
        when: "candidate pounds cover every target's need"
        difference: "every week reaches ALLOCATED and provisional_penalty_usd is 0.00"
      - name: partial_fill
        when: "candidate pounds run out part-way down the target order"
        difference: >
          Earlier (higher priority) weeks are filled completely and the tail weeks
          stay OPEN with a positive provisional_shortfall_lbs. Pounds are never
          spread evenly across weeks.
    worked_example: |
      P1 priority_rank 1, committed 3000, grade_spec A_ONLY
      P2 priority_rank 2, committed 2500, grade_spec A_AND_B
      lots supply 3000 lbs A to P1 first -> P1 allocated 3000, fill_rate_pct 100.00
      the remaining 1700 lbs (A then B) go to P2 -> allocated 1700,
        fill_rate_pct 68.00, provisional_shortfall_lbs 800,
        provisional_penalty_usd 200.00 at 0.25 USD/lb, week stays OPEN

  - name: commitment_payout
    description: |
      Values a commitment week twice against the same contract terms: a
      provisional shortfall penalty from allocated pounds while the week is still
      being filled, and a final penalty plus net payout from pounds actually
      shipped when the week closes.
    trigger: "provisional variant whenever allocated_lbs changes; final variant on the CLOSED transition"
    inputs:
      - "week.committed_lbs, week.allocated_lbs, week.shipped_lbs"
      - "program.price_per_lb_usd, program.shortfall_penalty_per_lb_usd"
    algorithm: threshold
    formula: |
      # ---- provisional variant (base = allocated pounds) ----
      fill_rate_pct             = quantize(100 * allocated_lbs / committed_lbs, 2)
      provisional_shortfall_lbs = quantize(max(0, committed_lbs - allocated_lbs), 2)
      provisional_penalty_usd   = quantize(provisional_shortfall_lbs
                                    * shortfall_penalty_per_lb_usd, 2)

      # ---- final variant (base = shipped pounds) ----
      fill_rate_pct       = quantize(100 * shipped_lbs / committed_lbs, 2)
      final_shortfall_lbs = quantize(max(0, committed_lbs - shipped_lbs), 2)
      final_penalty_usd   = quantize(final_shortfall_lbs
                                    * shortfall_penalty_per_lb_usd, 2)
      gross_revenue_usd   = quantize(shipped_lbs * price_per_lb_usd, 2)
      net_payout_usd      = quantize(gross_revenue_usd - final_penalty_usd, 2)
      program.penalty_accrued_usd += final_penalty_usd
    constants:
      MIN_ACCEPTABLE_FILL_PCT: 95.00
    precision: "2 decimal places, ROUND_HALF_UP; net_payout_usd may be negative and is not floored at zero"
    variants:
      - name: provisional
        when: "week.status IN {OPEN, ALLOCATED}"
        difference: "penalty is computed from allocated_lbs and is advisory - it never posts to program.penalty_accrued_usd"
      - name: final
        when: "week.status transitions to CLOSED_FULFILLED or CLOSED_SHORT"
        difference: >
          Penalty is computed from shipped_lbs, which excludes every PROVISIONAL
          allocation dropped at ship time, and it posts to
          program.penalty_accrued_usd. The two variants diverge for the same week
          whenever confirmed pounds are less than allocated pounds.
    worked_example: |
      P1 committed 3000, price 1.85 USD/lb, penalty 0.40 USD/lb
        provisional after a full allocation: fill_rate_pct 100.00,
          provisional_shortfall_lbs 0, provisional_penalty_usd 0.00
        only 1200 lbs were confirmed and shipped:
          fill_rate_pct 40.00, final_shortfall_lbs 1800, final_penalty_usd 720.00,
          gross_revenue_usd 2220.00, net_payout_usd 1500.00
      P2 committed 2500, penalty 0.25 USD/lb
        provisional at allocated 1700: provisional_penalty_usd 200.00
        closed short from OPEN with shipped_lbs 0.00: final_penalty_usd 625.00

  - name: pollination_strength_decay
    description: |
      Scores bumblebee pollination strength as a hive-age decay curve reduced by
      activity deficits observed during pollination checks, and converts the
      resulting risk score into a yield haircut applied to the crop cycle.
    trigger: "POST /crop-cycles/{id}/pollination-checks"
    inputs:
      - "crop_cycle.hives_placed_at and the check's observed_at (weeks_since_placement = whole weeks between them)"
      - "check.flower_visit_pct"
      - "check.hive_activity_count"
    algorithm: decay_function
    formula: |
      weeks_since_placement = floor((observed_at - hives_placed_at) / 7 days)
      base_strength = quantize(100 * (HIVE_DECAY_BASE ** weeks_since_placement), 2)

      penalty = 0
      if LOW_VISIT_PCT <= flower_visit_pct < TARGET_VISIT_PCT:
          penalty += MID_BAND_PENALTY
      if flower_visit_pct < LOW_VISIT_PCT:
          penalty += LOW_BAND_PENALTY
      if hive_activity_count < MIN_ACTIVITY_COUNT:
          penalty += LOW_ACTIVITY_PENALTY

      pollination_strength_index = quantize(
          max(0, min(100, base_strength - penalty)), 2)
      pollination_risk_score = quantize(100 - pollination_strength_index, 2)

      if variety.requires_pollination is false:
          pollination_haircut_pct = 0.00
      elif pollination_risk_score >= POLLINATION_RISK_THRESHOLD:
          pollination_haircut_pct = POLLINATION_HAIRCUT_PCT
      else:
          pollination_haircut_pct = 0.00

      # feeds expected_yield_curve, which re-derives expected_total_yield_lbs
      expected_total_yield_lbs = quantize(
          baseline_total_yield_lbs * (1 - pollination_haircut_pct / 100), 2)
    constants:
      HIVE_DECAY_BASE: 0.88
      TARGET_VISIT_PCT: 85
      LOW_VISIT_PCT: 70
      MID_BAND_PENALTY: 8
      LOW_BAND_PENALTY: 10
      MIN_ACTIVITY_COUNT: 40
      LOW_ACTIVITY_PENALTY: 10
      POLLINATION_RISK_THRESHOLD: 30
      POLLINATION_HAIRCUT_PCT: 12
    precision: "index and risk 2 decimal places; haircut is a whole percent; ROUND_HALF_UP"
    variants:
      - name: within_tolerance
        when: "pollination_risk_score < POLLINATION_RISK_THRESHOLD, or variety.requires_pollination is false"
        difference: "haircut stays 0.00 and expected_total_yield_lbs equals baseline_total_yield_lbs"
      - name: haircut_applied
        when: "pollination_risk_score >= POLLINATION_RISK_THRESHOLD and variety.requires_pollination is true"
        difference: "the yield curve total is reduced, which in turn moves yield_variance_pct for every later harvest"
    worked_example: |
      base_strength by hive age: 1 week 88.00, 2 weeks 77.44, 4 weeks 59.97
      4 weeks old, flower_visit_pct 78 (mid band, -8), hive_activity_count 31 (-10)
        pollination_strength_index 41.97, pollination_risk_score 58.03,
        pollination_haircut_pct 12 -> baseline 82688.64 becomes 72766.00
      1 week old, flower_visit_pct 78 (mid band, -8), hive_activity_count 55
        pollination_strength_index 80.00, pollination_risk_score 20.00, haircut 0

  - name: pest_threshold_status
    description: |
      Compares the scouted pest pressure per plant against the action threshold
      for that pest and decides whether a biological control release is required.
    trigger: "POST /scouting-observations"
    inputs:
      - "observation.pest_code"
      - "observation.pest_count_per_plant"
      - "observation.plants_inspected (recorded as scouting effort; does not enter the comparison)"
    algorithm: threshold
    formula: |
      pressure         = quantize(pest_count_per_plant, 3)
      action_threshold = PEST_ACTION_THRESHOLDS[pest_code]
      if pressure < action_threshold:    threshold_status = BELOW
      elif pressure == action_threshold: threshold_status = AT
      else:                              threshold_status = ABOVE
      release_required = threshold_status IN {AT, ABOVE}
      # release_required drives zone.open_pest_alert_count and therefore ipm_posture
    constants:
      PEST_ACTION_THRESHOLDS:
        WHITEFLY: 0.500
        THRIPS: 1.000
        SPIDER_MITE: 0.250
        APHID: 0.750
      PEST_ALERT_LOCK_COUNT: 2
    precision: "pressure quantized to 3 decimal places, ROUND_HALF_UP, before the comparison; the threshold is an exact 3-decimal constant"
    variants:
      - name: below_threshold
        when: "pressure < action_threshold"
        difference: "the observation is filed, release_required is false and zone posture is untouched"
      - name: at_or_above_threshold
        when: "pressure >= action_threshold"
        difference: "release_required is true and zone.open_pest_alert_count increments, which can lock the zone"
    worked_example: |
      WHITEFLY with pest_count_per_plant 0.500 -> 0.500 == 0.500 -> AT, release_required true
      WHITEFLY with pest_count_per_plant 0.4996 -> quantize -> 0.500 -> AT (the quantize
        happens BEFORE the comparison, so 0.4996 is not BELOW)
      WHITEFLY with pest_count_per_plant 0.4994 -> quantize -> 0.499 -> BELOW
      SPIDER_MITE with pest_count_per_plant 0.267 -> 0.267 > 0.250 -> ABOVE

  - name: drainage_alarm_evaluation
    description: |
      Evaluates each drainage reading logged against a delivered fertigation batch
      and latches a drain alarm when the cumulative drain fraction leaves the
      batch's target band or the drain EC exceeds the reuse ceiling.
    trigger: "POST /fertigation-batches/{id}/drainage-readings"
    inputs:
      - "batch.delivered_volume_liters"
      - "batch.drain_target_pct"
      - "batch.cumulative_drain_volume_liters and batch.drain_reading_count before this reading"
      - "reading payload: drain_volume_liters, drain_ec_ms, reading_at"
    algorithm: aggregation
    formula: |
      drain_reading_count            += 1
      cumulative_drain_volume_liters += drain_volume_liters
      last_drain_ec_ms                = drain_ec_ms
      drain_fraction_pct = quantize(100 * cumulative_drain_volume_liters
                                   / delivered_volume_liters, 2)

      band_low  = quantize(drain_target_pct - DRAIN_BAND_TOLERANCE_PCT, 2)
      band_high = quantize(drain_target_pct + DRAIN_BAND_TOLERANCE_PCT, 2)

      high_breach = drain_fraction_pct > band_high
      ec_breach   = last_drain_ec_ms > DRAIN_EC_ALARM_MS
      low_breach  = (drain_fraction_pct < band_low
                     and drain_reading_count >= MIN_READINGS_FOR_LOW_ALARM)

      reading_breached = high_breach or ec_breach or low_breach
      if reading_breached and drain_alarm was false:
          drain_alarm = true                 # latched; never cleared by a later reading
          zone.drain_alarm_count += 1        # feeds zone_posture_derivation
    constants:
      DRAIN_BAND_TOLERANCE_PCT: 10.00
      DRAIN_EC_ALARM_MS: 5.5
      MIN_READINGS_FOR_LOW_ALARM: 2
    precision: "drain_fraction_pct and band bounds 2 decimal places; EC compared at 1 decimal place as supplied; ROUND_HALF_UP"
    variants:
      - name: in_band
        when: "the cumulative fraction sits inside the band and EC is at or below the ceiling"
        difference: "no alarm; the batch stays eligible for RECONCILED"
      - name: out_of_band
        when: "either bound is breached"
        difference: "the batch alarm latches, zone.drain_alarm_count increments once and the irrigation posture cascade starts"
    worked_example: |
      delivered_volume_liters 12000, drain_target_pct 25.00 -> band [15.00, 35.00]
      reading 1: drain_volume_liters 4500, drain_ec_ms 5.1
        drain_fraction_pct 37.50 > 35.00 -> high_breach -> drain_alarm true
      reading 1: drain_volume_liters 3000, drain_ec_ms 5.1
        drain_fraction_pct 25.00 in band, 5.1 <= 5.5 -> no alarm
      reading 1: drain_volume_liters 1200, drain_ec_ms 5.1
        drain_fraction_pct 10.00 < 15.00 but drain_reading_count 1 < 2 -> no alarm
      reading 1: 1200 L then reading 2: 300 L, both EC 5.1
        drain_fraction_pct 12.50 < 15.00 with drain_reading_count 2 -> low_breach -> alarm
      reading 1: drain_volume_liters 3000, drain_ec_ms 5.6
        drain_fraction_pct 25.00 in band but 5.6 > 5.5 -> ec_breach -> alarm

  - name: zone_posture_derivation
    description: |
      Derives a zone's occupancy status and both posture dimensions from its crop
      cycles, alarm counters and the re-entry clock. Postures are never written
      directly except by a posture override.
    trigger: "any change to zone.open_pest_alert_count, zone.reentry_clear_at, zone.drain_alarm_count or a crop cycle status, and on POST /_clock/set_current_utc"
    inputs:
      - "zone.open_pest_alert_count"
      - "zone.reentry_clear_at"
      - "zone.drain_alarm_count"
      - "the statuses of every CropCycle whose zone_id is this zone"
      - "the current logical clock"
    algorithm: threshold
    formula: |
      # ---- ipm_posture ----
      if reentry_clear_at is not null and current_utc < reentry_clear_at:
          ipm_posture = LOCKED
      elif open_pest_alert_count >= PEST_ALERT_LOCK_COUNT:
          ipm_posture = LOCKED
      elif open_pest_alert_count >= 1:
          ipm_posture = SCOUT_ALERT
      else:
          ipm_posture = NORMAL

      # ---- irrigation_posture ----
      if drain_alarm_count >= DRAIN_ALARM_LOCK_COUNT:    irrigation_posture = LOCKED
      elif drain_alarm_count >= DRAIN_ALARM_WATCH_COUNT: irrigation_posture = WATCH
      else:                                             irrigation_posture = NORMAL

      # ---- status (occupancy, evaluated in this order) ----
      if any cycle status == PRODUCTION:                       status = HARVESTING
      elif any cycle status == TERMINATION_SCHEDULED:          status = TURNAROUND
      elif any cycle status IN {PLANNED, TRANSPLANTED}:        status = PLANTED
      else:                                                    status = IDLE
    constants:
      PEST_ALERT_LOCK_COUNT: 2
      DRAIN_ALARM_WATCH_COUNT: 2
      DRAIN_ALARM_LOCK_COUNT: 3
    precision: "integer counters and enums; no rounding"
    variants:
      - name: clock_driven_lock
        when: "reentry_clear_at is in the future"
        difference: "ipm_posture is LOCKED even though open_pest_alert_count may already be 0, and it clears by itself when the clock advances"
      - name: counter_driven_lock
        when: "open_pest_alert_count >= PEST_ALERT_LOCK_COUNT"
        difference: "ipm_posture is LOCKED regardless of the re-entry clock, and the harvest-task cancellation cascade fires once on the crossing"
    worked_example: |
      open_pest_alert_count 0, reentry_clear_at null            -> NORMAL
      open_pest_alert_count 1                                   -> SCOUT_ALERT
      open_pest_alert_count 2                                   -> LOCKED
      open_pest_alert_count 0, reentry_clear_at 2026-08-05T12:00:00Z
        clock 2026-08-05T11:59:59Z                              -> LOCKED
        clock 2026-08-05T12:00:00Z                              -> NORMAL
      drain_alarm_count 1 -> NORMAL, 2 -> WATCH, 3 -> LOCKED
      one cycle PRODUCTION plus one PLANNED                      -> HARVESTING
      every cycle TERMINATED or ABORTED                          -> IDLE

# =============================================================================
# §1.4 Validation Rules Table
# Rules are evaluated strictly in ascending priority order and the FIRST violated
# rule determines the response; no later rule is evaluated. A request that breaks
# several rules therefore always returns the lowest-priority-number error_id.
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
    description: "Runs before path existence, so a header-less call to a non-existent id returns 401 and never 404."

  - priority: 2
    category: auth
    check: "X-User-Role is one of the six declared roles and appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
    description: "An unrecognised role string is treated as an unauthorised role rather than a malformed request."

  - priority: 3
    category: auth
    check: "for the entity_backed roles (IPMScout, IPMCoordinator, HarvestSupervisor) X-User-ID resolves to a Worker row whose skill matches the role"
    error_id: ERR_ACTOR_NOT_RECOGNIZED
    http_status: 403
    applies_to: "POST /scouting-observations, POST /bio-control-releases, POST /bio-control-releases/{id}/approve, POST /bio-control-releases/{id}/execute, POST /bio-control-releases/{id}/transitions, POST /harvest-lots/{id}/grade, POST /harvest-lots/{id}/regrade"
    description: "IPMScout and IPMCoordinator must both resolve to a Worker with skill SCOUT; HarvestSupervisor must resolve to a Worker with skill HARVEST. Opaque roles (GrowerManager, IrrigationTech, QualityInspector) skip this rule."

  - priority: 4
    category: existence
    check: "every field the endpoint declares as required is present and of the declared type"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all write endpoints"
    description: "Computed and system fields present in the payload are silently ignored, not rejected."

  - priority: 5
    category: existence
    check: "every enum-typed field carries a declared member of that enum"
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 422
    applies_to: "all write endpoints"
    description: "Covers glazing_type, crop_type, regime, pest_code, agent_code, skill, task_type, grade_spec, target_field and every to_status."

  - priority: 6
    category: existence
    check: "every id in the request path exists, validated left to right"
    error_id: "ERR_ZONE_NOT_FOUND | ERR_CROP_CYCLE_NOT_FOUND | ERR_CLIMATE_STRATEGY_NOT_FOUND | ERR_FERTIGATION_BATCH_NOT_FOUND | ERR_BIO_CONTROL_RELEASE_NOT_FOUND | ERR_LABOR_TASK_NOT_FOUND | ERR_HARVEST_LOT_NOT_FOUND | ERR_RETAIL_PROGRAM_NOT_FOUND | ERR_COMMITMENT_WEEK_NOT_FOUND | ERR_LOT_ALLOCATION_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"
    description: "Path existence outranks body existence: a call with both a bad path id and a bad body FK returns the path error."

  - priority: 7
    category: existence
    check: "every foreign key supplied in the request body references an existing row"
    error_id: "ERR_ZONE_NOT_FOUND | ERR_VARIETY_NOT_FOUND | ERR_CROP_CYCLE_NOT_FOUND | ERR_WORKER_NOT_FOUND | ERR_SCOUTING_OBSERVATION_NOT_FOUND | ERR_RETAIL_PROGRAM_NOT_FOUND | ERR_LABOR_TASK_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints carrying FK fields"
    description: "Body FKs are validated in the order the endpoint's input list declares them."

  - priority: 8
    category: state
    check: "expected_zone_version / expected_lot_version equals the parent's current version"
    error_id: "ERR_STALE_ZONE_VERSION | ERR_STALE_LOT_VERSION"
    http_status: 412
    applies_to: "POST /climate-strategies, POST /zones/{id}/posture-overrides, POST /harvest-lots/{id}/regrade"
    description: "The OCC guard runs before every state and business check, so a stale version on an otherwise doomed request still returns 412."

  - priority: 9
    category: state
    check: "the entity is not already in a terminal state for the dimension the request touches"
    error_id: ERR_TERMINAL_STATE
    http_status: 409
    applies_to: "every transition and action endpoint"
    description: "Terminal states: CropCycle {TERMINATED, ABORTED}; ClimateStrategy {SUPERSEDED, EXPIRED, CANCELLED}; FertigationBatch {RECONCILED, DISCARDED}; BioControlRelease {RELEASED, REJECTED, CANCELLED}; LaborTask {COMPLETED, CANCELLED, NO_SHOW}; HarvestLot cold_chain {RELEASED, REJECTED}; CommitmentWeek {CLOSED_FULFILLED, CLOSED_SHORT}; LotAllocation {RELEASED, REVOKED}."

  - priority: 10
    category: state
    check: "the requested from-state to to-state pair appears in the entity's §1.2 transition list"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every transition and action endpoint"
    description: "Also catches a repeated non-terminal trigger, e.g. POST /harvest-lots/{id}/grade on a lot whose grading_status is already GRADED (a regrade must use the regrade endpoint)."

  - priority: 11
    category: state
    check: "the allocation's commitment week is in the state the requested allocation action needs"
    error_id: "ERR_WEEK_NOT_ALLOCATED | ERR_WEEK_ALREADY_SHIPPED"
    http_status: 409
    applies_to: "POST /lot-allocations/{id}/transitions"
    description: "Cross-entity state check on the parent week: CONFIRMED requires week.status == ALLOCATED, REVOKED requires week.status IN {OPEN, ALLOCATED}. Evaluated before the lot's cold chain and grading checks at priority 16."

  - priority: 12
    category: state
    check: "the week has at least one LotAllocation in status CONFIRMED"
    error_id: ERR_NO_CONFIRMED_ALLOCATIONS
    http_status: 409
    applies_to: "POST /commitment-weeks/{id}/transitions with to_status=SHIPPED"
    description: "A week cannot ship on provisional pounds alone; checked before the segregation-of-duties rule at priority 18."

  - priority: 13
    category: business_safety
    check: "zone.ipm_posture is not LOCKED"
    error_id: ERR_ZONE_IPM_LOCKED
    http_status: 409
    applies_to: "POST /labor-tasks, POST /harvest-lots, POST /crop-cycles/{id}/hive-placements"
    description: "Safety gate outranks every constraint and fiscal check: a harvest task in a locked zone that also busts the labor budget returns ERR_ZONE_IPM_LOCKED, not ERR_LABOR_BUDGET_EXCEEDED."

  - priority: 14
    category: business_safety
    check: "the current logical clock is at or after zone.reentry_clear_at whenever that field is set"
    error_id: ERR_REENTRY_INTERVAL_ACTIVE
    http_status: 409
    applies_to: "POST /labor-tasks, POST /labor-tasks/{id}/transitions with to_status=IN_PROGRESS, POST /harvest-lots"
    description: "Beneficial-agent re-entry interval; kept separate from posture because a release can clear the alert counter while the interval is still open."

  - priority: 15
    category: business_safety
    check: "zone.irrigation_posture is not LOCKED"
    error_id: ERR_IRRIGATION_LOCKED
    http_status: 409
    applies_to: "POST /fertigation-batches, POST /fertigation-batches/{id}/transitions with to_status=DELIVERED"
    description: "A WATCH posture is permitted; only LOCKED blocks mixing and delivery."

  - priority: 16
    category: business_safety
    check: "the lot's cold chain and grading dimensions allow the requested commercial action"
    error_id: "ERR_LOT_NOT_COLD_HELD | ERR_LOT_NOT_GRADED"
    http_status: 409
    applies_to: "POST /lot-allocations/{id}/transitions with to_status=CONFIRMED"
    description: "Cold chain is checked before grading, so an UNGRADED AMBIENT lot returns ERR_LOT_NOT_COLD_HELD."

  - priority: 17
    category: business_safety
    check: "the acting X-User-ID differs from the justifying observation's observed_by_worker_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /bio-control-releases/{id}/approve"
    description: "The scout who filed the triggering observation may not approve the release it justifies; the role check at priority 2 passes because both actors are IPM staff."

  - priority: 18
    category: business_safety
    check: "the acting X-User-ID differs from cold_chain_released_by_user_id on every lot allocated to the week"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /commitment-weeks/{id}/transitions with to_status=SHIPPED"
    description: "The inspector who released a lot from cold storage may not also sign the shipment that consumes it."

  - priority: 19
    category: business_constraint
    check: "uniqueness of natural keys"
    error_id: "ERR_ZONE_CODE_DUPLICATE | ERR_PROGRAM_CODE_DUPLICATE | ERR_ISO_WEEK_DUPLICATE"
    http_status: 409
    applies_to: "POST /zones, POST /retail-programs, POST /commitment-weeks"
    description: "Zone.code and RetailProgram.program_code are globally unique; CommitmentWeek.iso_week is unique per program_id."

  - priority: 20
    category: business_constraint
    check: "numeric setpoints are inside range and the zone actually has the equipment they demand"
    error_id: "ERR_SETPOINT_OUT_OF_RANGE | ERR_ZONE_CAPABILITY_MISSING"
    http_status: 422
    applies_to: "POST /climate-strategies"
    description: "Ranges: temp_setpoint_c [5, 35], rh_setpoint_pct [40, 95], co2_setpoint_ppm [400, 1200], screen_position_pct [0, 100], lighting_hours [0, window_hours]. Range violations are reported first; only an in-range value then hits the capability rule, which requires lighting_hours == 0 when zone.has_supplemental_lighting is false and screen_position_pct == 0 when zone.has_thermal_screen is false."

  - priority: 21
    category: business_constraint
    check: "yield_curve_lbs_per_sqft length equals cycle_length_weeks - first_harvest_week + 1"
    error_id: ERR_YIELD_CURVE_LENGTH_MISMATCH
    http_status: 422
    applies_to: "POST /varieties"
    description: "Keeps the expected_weekly_yield_lbs array well defined for every cycle built on the variety."

  - priority: 22
    category: business_constraint
    check: "grade_a_lbs + grade_b_lbs + cull_lbs equals gross_weight_lbs exactly"
    error_id: ERR_MASS_BALANCE_MISMATCH
    http_status: 422
    applies_to: "POST /harvest-lots/{id}/grade, POST /harvest-lots/{id}/regrade"
    description: "Checked before any pack-out or availability figure is written, so a mismatched split leaves the lot untouched."

  - priority: 23
    category: business_constraint
    check: "a regrade never sets a grade below the pounds already allocated from it"
    error_id: ERR_ALLOCATED_EXCEEDS_GRADE
    http_status: 409
    applies_to: "POST /harvest-lots/{id}/regrade"
    description: "Preserves the invariant grade_x_lbs == available_x_lbs + sum(active allocations of grade x). The mass-balance rule at 22 runs first."

  - priority: 24
    category: business_constraint
    check: "pack_out_pct is at or above MIN_PACK_OUT_PCT unless low_pack_out_acknowledged is true"
    error_id: ERR_PACK_OUT_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /harvest-lots/{id}/grade, POST /harvest-lots/{id}/regrade"
    description: "MIN_PACK_OUT_PCT is 80.00. Conditional validation: the identical split passes or fails purely on the transient acknowledgement flag, which is never persisted."

  - priority: 25
    category: business_constraint
    check: "revision_count is below MAX_RELEASE_REVISIONS"
    error_id: ERR_MAX_REVISIONS_EXCEEDED
    http_status: 409
    applies_to: "POST /bio-control-releases/{id}/transitions with to_status=REQUESTED"
    description: "Bounds the APPROVED -> REQUESTED revision cycle at MAX_RELEASE_REVISIONS = 2 round trips."

  - priority: 26
    category: business_constraint
    check: "actual_release_count is within RELEASE_COUNT_TOLERANCE_PCT of approved_release_count"
    error_id: ERR_RELEASE_COUNT_OUT_OF_TOLERANCE
    http_status: 422
    applies_to: "POST /bio-control-releases/{id}/execute"
    description: "RELEASE_COUNT_TOLERANCE_PCT is 10, evaluated on the closed interval [0.9 * approved, 1.1 * approved] with both bounds rounded to whole agents."

  - priority: 27
    category: business_constraint
    check: "zone.hive_slots_used plus the requested hive_count stays within zone.hive_slot_capacity"
    error_id: ERR_HIVE_SLOTS_EXCEEDED
    http_status: 409
    applies_to: "POST /crop-cycles/{id}/hive-placements"
    description: "Aggregate check across every crop cycle in the zone: each placement can be individually small while the set of them exceeds the capacity."

  - priority: 28
    category: business_temporal
    check: "window_end is strictly after window_start"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /climate-strategies, POST /labor-tasks"
    description: "Zero-length and inverted windows are both rejected."

  - priority: 29
    category: business_temporal
    check: "no ACTIVE ClimateStrategy on the same zone AND regime overlaps the requested window unless supersede is true"
    error_id: ERR_CLIMATE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /climate-strategies"
    description: "Half-open interval semantics [window_start, window_end): a new window starting exactly at an existing window_end does not overlap. Evaluated after the OCC check at priority 8."

  - priority: 30
    category: business_temporal
    check: "the assigned worker has no other SCHEDULED or IN_PROGRESS task whose window, widened by WORKER_BUFFER_MINUTES on both sides, overlaps the requested window by a positive duration; touching at exactly a widened endpoint is not a conflict"
    error_id: ERR_WORKER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /labor-tasks"
    description: "Closed-with-buffer semantics: WORKER_BUFFER_MINUTES is 30, so a task starting 20 minutes after another ends conflicts while one starting exactly 30 minutes after does not. Deliberately different interval semantics from the half-open climate rule at 29."

  - priority: 31
    category: business_temporal
    check: "harvest_date is on or after crop_cycle.first_harvest_allowed_date"
    error_id: ERR_HARVEST_TOO_EARLY
    http_status: 422
    applies_to: "POST /harvest-lots"
    description: "first_harvest_allowed_date is transplant_date + (variety.first_harvest_week - 1) * 7 days."

  - priority: 32
    category: business_temporal
    check: "no other CropCycle on the zone with status IN {PLANNED, TRANSPLANTED, PRODUCTION, TERMINATION_SCHEDULED} covers the requested date range"
    error_id: ERR_ZONE_OCCUPIED
    http_status: 409
    applies_to: "POST /crop-cycles"
    description: "The occupancy range is [transplant_date, planned_end_date] inclusive on both ends, so a new cycle must transplant at least one day after the previous cycle's planned_end_date."

  - priority: 33
    category: business_temporal
    check: "the current logical clock date is at or after week_start_date + 7 days"
    error_id: ERR_WEEK_STILL_OPEN
    http_status: 409
    applies_to: "POST /commitment-weeks/{id}/transitions with to_status=CLOSED from status OPEN"
    description: "An OPEN week can only be closed short once its delivery window has elapsed; a SHIPPED week may be closed at any time."

  - priority: 34
    category: business_referential
    check: "the commitment week's program status is ACTIVE"
    error_id: ERR_PROGRAM_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /allocation-runs, POST /commitment-weeks/{id}/transitions"
    description: "Cross-entity validation on the grandparent program; PAUSED programs are also skipped by the allocation waterfall's target filter."

  - priority: 35
    category: business_referential
    check: "the assigned worker is ACTIVE and their skill equals the requested task_type"
    error_id: "ERR_WORKER_INACTIVE | ERR_WORKER_SKILL_MISMATCH"
    http_status: 409
    applies_to: "POST /labor-tasks"
    description: "Employment status is checked before the skill match, so an INACTIVE worker with the wrong skill returns ERR_WORKER_INACTIVE."

  - priority: 36
    category: business_referential
    check: "the batch target_ec_ms is within RECIPE_EC_TOLERANCE_MS of the crop cycle's variety.ec_target_ms"
    error_id: ERR_TARGET_EC_OFF_RECIPE
    http_status: 422
    applies_to: "POST /fertigation-batches"
    description: "RECIPE_EC_TOLERANCE_MS is 0.8; the check reaches through crop_cycle_id to variety_id, so a batch valid for one cycle can be invalid for another."

  - priority: 37
    category: business_referential
    check: "the release's justifying observation has threshold_status IN {AT, ABOVE} and belongs to the release's own zone"
    error_id: "ERR_OBSERVATION_BELOW_THRESHOLD | ERR_OBSERVATION_ZONE_MISMATCH"
    http_status: 409
    applies_to: "POST /bio-control-releases"
    description: "Threshold status is checked before the zone match, so a BELOW observation from another zone returns ERR_OBSERVATION_BELOW_THRESHOLD."

  - priority: 38
    category: business_referential
    check: "a child row's zone_id equals the zone_id of the crop cycle it references"
    error_id: ERR_CROP_CYCLE_ZONE_MISMATCH
    http_status: 409
    applies_to: "POST /fertigation-batches, POST /labor-tasks, POST /scouting-observations"
    description: "Flat-topology integrity rule: the two FKs must agree, otherwise a batch could feed a cycle growing in a different compartment."

  - priority: 39
    category: business_fiscal
    check: "zone.labor_budget_remaining_usd covers the task's planned_cost_usd"
    error_id: ERR_LABOR_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /labor-tasks"
    description: "Aggregate fiscal check: each task can be individually affordable while the set of them is not. Deliberately the last group, so a budget-busting task in an IPM-locked zone reports the safety error at priority 13."

  - priority: 40
    category: business_fiscal
    check: "the candidate lot pool holds at least one eligible pound for the requested week_start_date"
    error_id: ERR_NO_ELIGIBLE_LOTS
    http_status: 422
    applies_to: "POST /allocation-runs"
    description: "An allocation run with no eligible lot is rejected outright rather than returning an empty allocation set."

  - priority: 41
    category: business_fiscal
    check: "the pounds being confirmed do not exceed the lot's available pounds for that grade"
    error_id: ERR_INSUFFICIENT_AVAILABLE_LBS
    http_status: 409
    applies_to: "POST /lot-allocations/{id}/transitions with to_status=CONFIRMED"
    description: "Last defence for the mass invariant; the waterfall never over-asks, so this fires only when a regrade shrank the lot after the allocation was minted."

# =============================================================================
# §1.5 API Endpoint Table
# Flat root collections (api_prefix "/"). Every list endpoint accepts limit and
# offset and returns the paginated envelope from §1.0. All six roles may read;
# writes are role-restricted. ALL_ROLES below stands for
# [GrowerManager, IrrigationTech, IPMScout, IPMCoordinator, HarvestSupervisor, QualityInspector].
# =============================================================================
endpoints:
  # ---------------------------------------------------------------- Zone
  - method: POST
    path: "/zones"
    description: "Register a growing compartment with its envelope, equipment, hive capacity and labor budget"
    roles: [GrowerManager]
    code: 201
    input: [code, area_sqft, glazing_type, has_thermal_screen, has_supplemental_lighting, chp_connected, hive_slot_capacity, labor_budget_usd]
    output: Zone
    side_effects:
      - "status IDLE, ipm_posture NORMAL, irrigation_posture NORMAL, all counters 0"
      - "labor_budget_committed_usd 0.00 and labor_budget_remaining_usd equal to labor_budget_usd"
      - "version 1"

  - method: GET
    path: "/zones"
    description: "List zones with optional posture filters"
    roles: [GrowerManager, IrrigationTech, IPMScout, IPMCoordinator, HarvestSupervisor, QualityInspector]
    code: 200
    input: ["status?", "ipm_posture?", "irrigation_posture?", "limit?", "offset?"]
    output: Zone[]
    side_effects: []

  - method: GET
    path: "/zones/{id}"
    description: "Fetch one zone with its derived postures, counters and budget split"
    roles: [GrowerManager, IrrigationTech, IPMScout, IPMCoordinator, HarvestSupervisor, QualityInspector]
    code: 200
    input: []
    output: Zone
    side_effects: []

  - method: POST
    path: "/zones/{id}/posture-overrides"
    description: "Manually force one posture dimension back to NORMAL; the only way out of a LOCKED posture before its own clock or counter clears"
    roles: [GrowerManager]
    code: 200
    input: [target_field, target_value, override_reason, expected_zone_version]
    output: Zone
    side_effects:
      - "OCC guard on Zone.version (ERR_STALE_ZONE_VERSION, 412)"
      - "target_field ipm_posture clears open_pest_alert_count to 0 and reentry_clear_at to null"
      - "target_field irrigation_posture clears drain_alarm_count to 0 but leaves every CropCycle.nutrient_stress_flag true"
      - "increments Zone.version; cancelled labor tasks are never reinstated"

  # ---------------------------------------------------------------- Variety
  - method: POST
    path: "/varieties"
    description: "Register an immutable cultivar with its density, yield curve and EC recipe target"
    roles: [GrowerManager]
    code: 201
    input: [name, crop_type, cycle_length_weeks, first_harvest_week, plant_density_per_sqft, yield_curve_lbs_per_sqft, grade_a_ratio_pct, requires_pollination, ec_target_ms]
    output: Variety
    side_effects:
      - "validates yield_curve_lbs_per_sqft length against cycle_length_weeks - first_harvest_week + 1 (ERR_YIELD_CURVE_LENGTH_MISMATCH)"
      - "no version field and no update endpoint: varieties are immutable once created"

  - method: GET
    path: "/varieties"
    description: "List cultivars"
    roles: [GrowerManager, IrrigationTech, IPMScout, IPMCoordinator, HarvestSupervisor, QualityInspector]
    code: 200
    input: ["crop_type?", "limit?", "offset?"]
    output: Variety[]
    side_effects: []

  - method: GET
    path: "/varieties/{id}"
    description: "Fetch one cultivar"
    roles: [GrowerManager, IrrigationTech, IPMScout, IPMCoordinator, HarvestSupervisor, QualityInspector]
    code: 200
    input: []
    output: Variety
    side_effects: []

  # ---------------------------------------------------------------- CropCycle
  - method: POST
    path: "/crop-cycles"
    description: "Plan a crop cycle in a zone and project its expected yield curve"
    roles: [GrowerManager]
    code: 201
    input: [zone_id, variety_id, transplant_date, plants_transplanted]
    output: CropCycle
    side_effects:
      - "runs expected_yield_curve: density_factor, expected_weekly_yield_lbs, baseline_total_yield_lbs, expected_total_yield_lbs"
      - "derives planned_end_date and first_harvest_allowed_date from the variety"
      - "rejects an overlapping cycle on the same zone (ERR_ZONE_OCCUPIED)"
      - "status PLANNED; zone.status becomes PLANTED"

  - method: GET
    path: "/crop-cycles"
    description: "List crop cycles, filterable by zone or variety"
    roles: [GrowerManager, IrrigationTech, IPMScout, IPMCoordinator, HarvestSupervisor, QualityInspector]
    code: 200
    input: ["zone_id?", "variety_id?", "status?", "limit?", "offset?"]
    output: CropCycle[]
    side_effects: []

  - method: GET
    path: "/crop-cycles/{id}"
    description: "Fetch one crop cycle with its yield projection, pollination and stress fields"
    roles: [GrowerManager, IrrigationTech, IPMScout, IPMCoordinator, HarvestSupervisor, QualityInspector]
    code: 200
    input: []
    output: CropCycle
    side_effects: []

  - method: POST
    path: "/crop-cycles/{id}/transitions"
    description: "Drive the crop cycle lifecycle: TRANSPLANTED, PRODUCTION, TERMINATION_SCHEDULED, back to PRODUCTION, TERMINATED or ABORTED"
    roles: [GrowerManager]
    code: 200
    input: [to_status, "termination_date?", "plants_transplanted?"]
    output: CropCycle
    side_effects:
      - "TRANSPLANTED with a changed plants_transplanted re-runs expected_yield_curve"
      - "ABORTED cancels every SCHEDULED and IN_PROGRESS LaborTask on the cycle and returns their planned_cost_usd to zone.labor_budget_remaining_usd"
      - "TERMINATED and ABORTED release the cycle's hives, lowering zone.hive_slots_used"
      - "re-derives zone.status"

  - method: POST
    path: "/crop-cycles/{id}/hive-placements"
    description: "Place bumblebee hives on the cycle and start the pollination decay clock"
    roles: [GrowerManager]
    code: 200
    input: [hive_count, placed_at]
    output: CropCycle
    side_effects:
      - "increments hive_count_placed and sets hives_placed_at to placed_at, restarting the decay curve"
      - "increments zone.hive_slots_used, bounded by zone.hive_slot_capacity (ERR_HIVE_SLOTS_EXCEEDED)"
      - "blocked while zone.ipm_posture is LOCKED (ERR_ZONE_IPM_LOCKED)"

  - method: POST
    path: "/crop-cycles/{id}/pollination-checks"
    description: "Record a bumblebee activity check and re-score pollination strength, risk and the yield haircut"
    roles: [GrowerManager]
    code: 200
    input: [observed_at, flower_visit_pct, hive_activity_count]
    output: CropCycle
    side_effects:
      - "runs pollination_strength_decay: pollination_strength_index, pollination_risk_score, pollination_haircut_pct"
      - "re-derives expected_total_yield_lbs from baseline_total_yield_lbs and the haircut, then yield_variance_pct"
      - "flower_visit_pct and hive_activity_count are transient inputs and are not persisted"

  # ---------------------------------------------------------------- ClimateStrategy
  - method: POST
    path: "/climate-strategies"
    description: "Create a setpoint window for a zone and regime, optionally superseding an overlapping ACTIVE window; guarded by OCC on Zone.version"
    roles: [GrowerManager]
    code: 201
    input: [zone_id, regime, window_start, window_end, temp_setpoint_c, rh_setpoint_pct, co2_setpoint_ppm, lighting_hours, screen_position_pct, expected_zone_version, "supersede?"]
    output: ClimateStrategy
    side_effects:
      - "OCC guard on Zone.version (ERR_STALE_ZONE_VERSION, 412)"
      - "runs energy_cost projected variant: window_hours, planned_heat_kwh, planned_light_kwh, planned_co2_kg, projected_energy_cost_usd"
      - "supersede true moves the overlapping ACTIVE strategy on the same zone and regime to SUPERSEDED; supersede false or absent rejects with ERR_CLIMATE_WINDOW_OVERLAP"
      - "increments zone.climate_plan_revision and Zone.version"

  - method: GET
    path: "/climate-strategies"
    description: "List setpoint windows, filterable by zone, regime and status"
    roles: [GrowerManager, IrrigationTech, IPMScout, IPMCoordinator, HarvestSupervisor, QualityInspector]
    code: 200
    input: ["zone_id?", "regime?", "status?", "limit?", "offset?"]
    output: ClimateStrategy[]
    side_effects: []

  - method: GET
    path: "/climate-strategies/{id}"
    description: "Fetch one setpoint window with its projected and settled energy figures"
    roles: [GrowerManager, IrrigationTech, IPMScout, IPMCoordinator, HarvestSupervisor, QualityInspector]
    code: 200
    input: []
    output: ClimateStrategy
    side_effects: []

  - method: POST
    path: "/climate-strategies/{id}/actuals"
    description: "Record metered energy actuals for the window and settle its cost"
    roles: [GrowerManager]
    code: 200
    input: [gas_consumed_m3, chp_generated_kwh, grid_import_kwh, screen_deployed_hours]
    output: ClimateStrategy
    side_effects:
      - "runs energy_cost settled variant, selecting settled_with_chp or settled_without_chp from zone.chp_connected"
      - "sets settled_energy_cost_usd, cost_variance_usd and actuals_recorded_at"
      - "screen_deployed_hours is stored for audit and does not enter the cost"

  - method: POST
    path: "/climate-strategies/{id}/transitions"
    description: "Cancel an ACTIVE setpoint window"
    roles: [GrowerManager]
    code: 200
    input: [to_status]
    output: ClimateStrategy
    side_effects:
      - "CANCELLED is only reachable from ACTIVE; SUPERSEDED and EXPIRED are system-driven and cannot be requested here"

  # ---------------------------------------------------------------- FertigationBatch
  - method: POST
    path: "/fertigation-batches"
    description: "Mix a nutrient solution batch, applying the recirculation cap and computing the injector dose"
    roles: [IrrigationTech]
    code: 201
    input: [zone_id, crop_cycle_id, batch_date, planned_volume_liters, requested_recirculated_liters, reservoir_ec_ms, target_ec_ms, target_ph, n_ppm, k_ppm, ca_ppm, drain_target_pct]
    output: FertigationBatch
    side_effects:
      - "runs nutrient_blend_recirculation: provisional_blend_ec_ms, recirc_cap_pct, recirculated_liters_applied, fresh_liters_applied, blended_ec_ms, injector_ml"
      - "blocked while zone.irrigation_posture is LOCKED (ERR_IRRIGATION_LOCKED)"
      - "status MIXED"

  - method: GET
    path: "/fertigation-batches"
    description: "List fertigation batches, filterable by zone and crop cycle"
    roles: [GrowerManager, IrrigationTech, IPMScout, IPMCoordinator, HarvestSupervisor, QualityInspector]
    code: 200
    input: ["zone_id?", "crop_cycle_id?", "status?", "limit?", "offset?"]
    output: FertigationBatch[]
    side_effects: []

  - method: GET
    path: "/fertigation-batches/{id}"
    description: "Fetch one batch with its blend, injector and drainage figures"
    roles: [GrowerManager, IrrigationTech, IPMScout, IPMCoordinator, HarvestSupervisor, QualityInspector]
    code: 200
    input: []
    output: FertigationBatch
    side_effects: []

  - method: POST
    path: "/fertigation-batches/{id}/transitions"
    description: "Deliver, reconcile or discard a batch"
    roles: [IrrigationTech]
    code: 200
    input: [to_status, "delivered_volume_liters?"]
    output: FertigationBatch
    side_effects:
      - "DELIVERED requires delivered_volume_liters and is blocked while zone.irrigation_posture is LOCKED"
      - "RECONCILED requires at least one accepted drainage reading"
      - "DISCARDED is only reachable from MIXED"

  - method: POST
    path: "/fertigation-batches/{id}/drainage-readings"
    description: "Log a drainage reading against a delivered batch and evaluate the drain alarm"
    roles: [IrrigationTech]
    code: 200
    input: [drain_volume_liters, drain_ec_ms, reading_at]
    output: FertigationBatch
    side_effects:
      - "runs drainage_alarm_evaluation: drain_reading_count, cumulative_drain_volume_liters, last_drain_ec_ms, drain_fraction_pct, drain_alarm"
      - "a newly latched alarm increments zone.drain_alarm_count and re-derives zone.irrigation_posture"
      - "an irrigation_posture that reaches LOCKED sets nutrient_stress_flag on every active CropCycle in the zone"
      - "readings are only accepted while status is DELIVERED"

  # ---------------------------------------------------------------- ScoutingObservation
  - method: POST
    path: "/scouting-observations"
    description: "File an immutable scouting observation and compare the pest pressure with the action threshold"
    roles: [IPMScout]
    code: 201
    input: [zone_id, crop_cycle_id, observed_at, pest_code, plants_inspected, pest_count_per_plant]
    output: ScoutingObservation
    side_effects:
      - "observed_by_worker_id is taken from X-User-ID, never from the body"
      - "runs pest_threshold_status: action_threshold, threshold_status, release_required"
      - "AT or ABOVE increments zone.open_pest_alert_count and re-derives zone.ipm_posture"
      - "an ipm_posture that reaches LOCKED cancels the zone's future SCHEDULED HARVEST tasks, sets crop_cycle.labor_shortfall_flag and returns their planned_cost_usd to the zone budget"

  - method: GET
    path: "/scouting-observations"
    description: "List scouting observations, filterable by zone, cycle, scout and threshold status"
    roles: [GrowerManager, IrrigationTech, IPMScout, IPMCoordinator, HarvestSupervisor, QualityInspector]
    code: 200
    input: ["zone_id?", "crop_cycle_id?", "observed_by_worker_id?", "threshold_status?", "limit?", "offset?"]
    output: ScoutingObservation[]
    side_effects: []

  - method: GET
    path: "/scouting-observations/{id}"
    description: "Fetch one scouting observation"
    roles: [GrowerManager, IrrigationTech, IPMScout, IPMCoordinator, HarvestSupervisor, QualityInspector]
    code: 200
    input: []
    output: ScoutingObservation
    side_effects: []

  # ---------------------------------------------------------------- BioControlRelease
  - method: POST
    path: "/bio-control-releases"
    description: "Request a beneficial-agent release justified by an at-or-above-threshold observation"
    roles: [IPMScout]
    code: 201
    input: [zone_id, observation_id, agent_code, planned_release_count, planned_release_date]
    output: BioControlRelease
    side_effects:
      - "requested_by_worker_id is taken from X-User-ID"
      - "status REQUESTED, revision_count 0"
      - "rejects a BELOW-threshold observation (ERR_OBSERVATION_BELOW_THRESHOLD) or one from another zone (ERR_OBSERVATION_ZONE_MISMATCH)"

  - method: GET
    path: "/bio-control-releases"
    description: "List release requests, filterable by zone, observation, requester and decider"
    roles: [GrowerManager, IrrigationTech, IPMScout, IPMCoordinator, HarvestSupervisor, QualityInspector]
    code: 200
    input: ["zone_id?", "observation_id?", "requested_by_worker_id?", "decided_by_worker_id?", "status?", "limit?", "offset?"]
    output: BioControlRelease[]
    side_effects: []

  - method: GET
    path: "/bio-control-releases/{id}"
    description: "Fetch one release request"
    roles: [GrowerManager, IrrigationTech, IPMScout, IPMCoordinator, HarvestSupervisor, QualityInspector]
    code: 200
    input: []
    output: BioControlRelease
    side_effects: []

  - method: POST
    path: "/bio-control-releases/{id}/approve"
    description: "Coordinator approves the request, optionally revising the agent count"
    roles: [IPMCoordinator]
    code: 200
    input: ["revised_release_count?", "decision_reason?"]
    output: BioControlRelease
    side_effects:
      - "segregation of duties: X-User-ID must differ from the justifying observation's observed_by_worker_id (ERR_SEGREGATION_OF_DUTIES)"
      - "approved_release_count is revised_release_count when supplied, else planned_release_count"
      - "sets decided_by_worker_id and status APPROVED"

  - method: POST
    path: "/bio-control-releases/{id}/transitions"
    description: "Return an approved request for revision, reject it, or cancel it"
    roles: [IPMScout, IPMCoordinator]
    code: 200
    input: [to_status, "decision_reason?"]
    output: BioControlRelease
    side_effects:
      - "APPROVED -> REQUESTED increments revision_count, clears approved_release_count and decided_by_worker_id, and is capped by MAX_RELEASE_REVISIONS"
      - "REQUESTED -> REJECTED is coordinator-only and leaves zone.open_pest_alert_count unchanged, so the zone stays alerted"
      - "REQUESTED -> CANCELLED is scout-only and also leaves the alert counter unchanged"

  - method: POST
    path: "/bio-control-releases/{id}/execute"
    description: "Record the physical release, decrement the zone's open alert and start the worker re-entry interval"
    roles: [IPMScout]
    code: 200
    input: [released_at, actual_release_count]
    output: BioControlRelease
    side_effects:
      - "actual_release_count must sit within RELEASE_COUNT_TOLERANCE_PCT of approved_release_count (ERR_RELEASE_COUNT_OUT_OF_TOLERANCE)"
      - "sets reentry_hours from AGENT_REENTRY_HOURS[agent_code] and status RELEASED"
      - "decrements zone.open_pest_alert_count by 1 and sets zone.reentry_clear_at to released_at + reentry_hours"
      - "zone.ipm_posture stays LOCKED for the re-entry interval even when the counter reaches 0"

  # ---------------------------------------------------------------- Worker
  - method: POST
    path: "/workers"
    description: "Register a worker with a skill, wage and productivity index"
    roles: [GrowerManager]
    code: 201
    input: [full_name, skill, hourly_rate_usd, "productivity_index?", "status?"]
    output: Worker
    side_effects:
      - "productivity_index defaults to 1.00 and status defaults to ACTIVE"
      - "committed_hours 0.00"

  - method: GET
    path: "/workers"
    description: "List workers, filterable by skill and employment status"
    roles: [GrowerManager, IrrigationTech, IPMScout, IPMCoordinator, HarvestSupervisor, QualityInspector]
    code: 200
    input: ["skill?", "status?", "limit?", "offset?"]
    output: Worker[]
    side_effects: []

  - method: GET
    path: "/workers/{id}"
    description: "Fetch one worker with their committed hours"
    roles: [GrowerManager, IrrigationTech, IPMScout, IPMCoordinator, HarvestSupervisor, QualityInspector]
    code: 200
    input: []
    output: Worker
    side_effects: []

  # ---------------------------------------------------------------- LaborTask
  - method: POST
    path: "/labor-tasks"
    description: "Schedule deleafing, trellising or harvest work and commit its planned cost against the zone budget"
    roles: [GrowerManager]
    code: 201
    input: [zone_id, crop_cycle_id, worker_id, task_type, window_start, window_end, planned_units, standard_units_per_hour]
    output: LaborTask
    side_effects:
      - "runs labor_standard_cost planned variant: planned_hours, planned_cost_usd"
      - "adds planned_cost_usd to zone.labor_budget_committed_usd and subtracts it from zone.labor_budget_remaining_usd"
      - "adds planned_hours to worker.committed_hours"
      - "enforces the IPM posture, re-entry, worker double-booking, skill and budget rules"
      - "status SCHEDULED"

  - method: GET
    path: "/labor-tasks"
    description: "List labor tasks, filterable by zone, crop cycle, worker and status"
    roles: [GrowerManager, IrrigationTech, IPMScout, IPMCoordinator, HarvestSupervisor, QualityInspector]
    code: 200
    input: ["zone_id?", "crop_cycle_id?", "worker_id?", "task_type?", "status?", "limit?", "offset?"]
    output: LaborTask[]
    side_effects: []

  - method: GET
    path: "/labor-tasks/{id}"
    description: "Fetch one labor task with planned and actual cost"
    roles: [GrowerManager, IrrigationTech, IPMScout, IPMCoordinator, HarvestSupervisor, QualityInspector]
    code: 200
    input: []
    output: LaborTask
    side_effects: []

  - method: POST
    path: "/labor-tasks/{id}/transitions"
    description: "Start, complete, cancel or no-show a labor task"
    roles: [GrowerManager, HarvestSupervisor]
    code: 200
    input: [to_status, "actual_hours?", "actual_units?", "cancel_reason?"]
    output: LaborTask
    side_effects:
      - "IN_PROGRESS is blocked while zone.reentry_clear_at is in the future (ERR_REENTRY_INTERVAL_ACTIVE)"
      - "COMPLETED requires actual_hours and actual_units, runs labor_standard_cost actual variant and swaps planned_cost_usd for actual_cost_usd in zone.labor_budget_committed_usd"
      - "CANCELLED and NO_SHOW return planned_cost_usd to zone.labor_budget_remaining_usd and remove planned_hours from worker.committed_hours"

  # ---------------------------------------------------------------- HarvestLot
  - method: POST
    path: "/harvest-lots"
    description: "Register a picked lot against a crop cycle"
    roles: [HarvestSupervisor]
    code: 201
    input: [crop_cycle_id, harvest_date, gross_weight_lbs, "labor_task_id?"]
    output: HarvestLot
    side_effects:
      - "grading_status UNGRADED, cold_chain_status AMBIENT, all allocated and available pools 0.00"
      - "adds gross_weight_lbs to crop_cycle.cumulative_harvested_lbs and re-derives yield_variance_pct"
      - "rejects a harvest_date before crop_cycle.first_harvest_allowed_date (ERR_HARVEST_TOO_EARLY)"
      - "blocked by an IPM lock or an open re-entry interval"

  - method: GET
    path: "/harvest-lots"
    description: "List harvest lots, filterable by crop cycle, producing task, grader and either state dimension"
    roles: [GrowerManager, IrrigationTech, IPMScout, IPMCoordinator, HarvestSupervisor, QualityInspector]
    code: 200
    input: ["crop_cycle_id?", "labor_task_id?", "graded_by_worker_id?", "grading_status?", "cold_chain_status?", "harvest_date?", "limit?", "offset?"]
    output: HarvestLot[]
    side_effects: []

  - method: GET
    path: "/harvest-lots/{id}"
    description: "Fetch one lot with its grade split, pack-out and both state dimensions"
    roles: [GrowerManager, IrrigationTech, IPMScout, IPMCoordinator, HarvestSupervisor, QualityInspector]
    code: 200
    input: []
    output: HarvestLot
    side_effects: []

  - method: POST
    path: "/harvest-lots/{id}/grade"
    description: "Grade an ungraded lot into A, B and cull pounds"
    roles: [HarvestSupervisor]
    code: 200
    input: [grade_a_lbs, grade_b_lbs, cull_lbs, "low_pack_out_acknowledged?"]
    output: HarvestLot
    side_effects:
      - "runs lot_grading_packout initial variant: pack_out_pct, available_a_lbs, available_b_lbs"
      - "grading_status becomes GRADED and graded_by_worker_id is taken from X-User-ID"
      - "low_pack_out_acknowledged is transient and is never persisted"

  - method: POST
    path: "/harvest-lots/{id}/regrade"
    description: "Restate the grade split of an already graded lot; guarded by OCC on HarvestLot.version"
    roles: [HarvestSupervisor]
    code: 200
    input: [grade_a_lbs, grade_b_lbs, cull_lbs, expected_lot_version, "low_pack_out_acknowledged?"]
    output: HarvestLot
    side_effects:
      - "OCC guard on HarvestLot.version (ERR_STALE_LOT_VERSION, 412)"
      - "runs lot_grading_packout regrade variant, subtracting already allocated pounds"
      - "rejects a split that drops a grade below its allocated pounds (ERR_ALLOCATED_EXCEEDS_GRADE)"
      - "grading_status becomes REGRADED, regrade_count increments and HarvestLot.version increments"

  - method: POST
    path: "/harvest-lots/{id}/cold-chain-events"
    description: "Advance or reject the lot's cold chain dimension, independently of grading"
    roles: [QualityInspector]
    code: 200
    input: [to_status, pulp_temp_c]
    output: HarvestLot
    side_effects:
      - "PRECOOLED, COLD_HELD and RELEASED advance in order; RELEASED records cold_chain_released_by_user_id from X-User-ID"
      - "REJECTED is reachable from any non-RELEASED state and revokes every PROVISIONAL and CONFIRMED allocation on the lot with revoked_reason=COLD_CHAIN_REJECT, restoring the lot's available pools, dropping each affected week's allocated_lbs, reverting any short ALLOCATED week to OPEN and incrementing that program's at_risk_week_count"
      - "REJECTED also removes gross_weight_lbs from crop_cycle.cumulative_harvested_lbs"

  # ---------------------------------------------------------------- RetailProgram
  - method: POST
    path: "/retail-programs"
    description: "Register a retail volume program with its grade spec, price, penalty rate and waterfall priority"
    roles: [GrowerManager]
    code: 201
    input: [retailer_name, program_code, grade_spec, weekly_commitment_lbs, price_per_lb_usd, shortfall_penalty_per_lb_usd, priority_rank, "status?"]
    output: RetailProgram
    side_effects:
      - "status defaults to ACTIVE; a PAUSED program is skipped by every allocation run"
      - "at_risk_week_count 0 and penalty_accrued_usd 0.00"

  - method: GET
    path: "/retail-programs"
    description: "List retail programs in waterfall order"
    roles: [GrowerManager, IrrigationTech, IPMScout, IPMCoordinator, HarvestSupervisor, QualityInspector]
    code: 200
    input: ["status?", "grade_spec?", "limit?", "offset?"]
    output: RetailProgram[]
    side_effects: []

  - method: GET
    path: "/retail-programs/{id}"
    description: "Fetch one program with its at-risk week count and accrued penalties"
    roles: [GrowerManager, IrrigationTech, IPMScout, IPMCoordinator, HarvestSupervisor, QualityInspector]
    code: 200
    input: []
    output: RetailProgram
    side_effects: []

  # ---------------------------------------------------------------- CommitmentWeek
  - method: POST
    path: "/commitment-weeks"
    description: "Open a weekly volume commitment for a program"
    roles: [GrowerManager]
    code: 201
    input: [program_id, iso_week, week_start_date, "committed_lbs?"]
    output: CommitmentWeek
    side_effects:
      - "committed_lbs defaults to program.weekly_commitment_lbs"
      - "status OPEN with allocated_lbs 0.00, fill_rate_pct 0.00 and provisional_shortfall_lbs equal to committed_lbs"
      - "iso_week must be unique inside the program (ERR_ISO_WEEK_DUPLICATE)"

  - method: GET
    path: "/commitment-weeks"
    description: "List commitment weeks, filterable by program, week start and status"
    roles: [GrowerManager, IrrigationTech, IPMScout, IPMCoordinator, HarvestSupervisor, QualityInspector]
    code: 200
    input: ["program_id?", "week_start_date?", "status?", "limit?", "offset?"]
    output: CommitmentWeek[]
    side_effects: []

  - method: GET
    path: "/commitment-weeks/{id}"
    description: "Fetch one commitment week with both payout variants"
    roles: [GrowerManager, IrrigationTech, IPMScout, IPMCoordinator, HarvestSupervisor, QualityInspector]
    code: 200
    input: []
    output: CommitmentWeek
    side_effects: []

  - method: POST
    path: "/commitment-weeks/{id}/transitions"
    description: "Ship a week's confirmed pounds or close the week out"
    roles: [GrowerManager, QualityInspector]
    code: 200
    input: [to_status, "shipped_at?"]
    output: CommitmentWeek
    side_effects:
      - "SHIPPED is QualityInspector-only, requires at least one CONFIRMED allocation and enforces segregation of duties against every lot's cold_chain_released_by_user_id"
      - "SHIPPED promotes CONFIRMED allocations to RELEASED, revokes PROVISIONAL ones with revoked_reason=AUTO_UNCONFIRMED_AT_SHIP, recomputes shipped_lbs and fill_rate_pct, and does NOT apply the ALLOCATED -> OPEN revert rule"
      - "CLOSED is GrowerManager-only, runs commitment_payout final variant and adds final_penalty_usd to program.penalty_accrued_usd; the week lands in CLOSED_FULFILLED or CLOSED_SHORT"
      - "CLOSED from OPEN requires the delivery window to have elapsed and revokes every remaining allocation with revoked_reason=WEEK_CLOSED_SHORT"

  # ---------------------------------------------------------------- LotAllocation
  - method: GET
    path: "/lot-allocations"
    description: "List allocation rows, filterable by lot, week and status; the only discovery channel for rows minted by an allocation run"
    roles: [GrowerManager, IrrigationTech, IPMScout, IPMCoordinator, HarvestSupervisor, QualityInspector]
    code: 200
    input: ["lot_id?", "commitment_week_id?", "grade?", "status?", "limit?", "offset?"]
    output: LotAllocation[]
    side_effects: []

  - method: GET
    path: "/lot-allocations/{id}"
    description: "Fetch one allocation row"
    roles: [GrowerManager, IrrigationTech, IPMScout, IPMCoordinator, HarvestSupervisor, QualityInspector]
    code: 200
    input: []
    output: LotAllocation
    side_effects: []

  - method: POST
    path: "/lot-allocations/{id}/transitions"
    description: "Confirm a provisional allocation against a cold-held lot, or revoke it"
    roles: [GrowerManager, QualityInspector]
    code: 200
    input: [to_status, "revoked_reason?"]
    output: LotAllocation
    side_effects:
      - "CONFIRMED is QualityInspector-only and requires week.status ALLOCATED, lot.cold_chain_status COLD_HELD and lot.grading_status IN {GRADED, REGRADED}"
      - "REVOKED is GrowerManager-only, requires revoked_reason, restores the lot's available pool by exactly allocated_lbs, drops week.allocated_lbs, re-runs commitment_payout provisional variant, reverts a now-short ALLOCATED week to OPEN and increments program.at_risk_week_count"

  # ---------------------------------------------------------------- runs and clock
  - method: POST
    path: "/allocation-runs"
    description: "Run the deterministic allocation waterfall for one week start date across every OPEN week of every ACTIVE program"
    roles: [GrowerManager]
    code: 200
    input: [week_start_date]
    output: CommitmentWeek[]
    side_effects:
      - "runs commitment_waterfall_allocation and mints LotAllocation rows in status PROVISIONAL"
      - "returns every week it evaluated, in program.priority_rank ASC then program.created_at ASC order, with recomputed allocated_lbs, fill_rate_pct, provisional_shortfall_lbs and provisional_penalty_usd"
      - "weeks that reached their commitment become ALLOCATED; the rest stay OPEN"
      - "rejects a run with no eligible lot for the requested week (ERR_NO_ELIGIBLE_LOTS)"

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [GrowerManager]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "expires every ACTIVE ClimateStrategy whose window_end is at or before the new instant (ACTIVE -> EXPIRED)"
      - "re-derives every zone's ipm_posture, so a zone whose reentry_clear_at has passed returns to NORMAL or SCOUT_ALERT"

# =============================================================================
# §1.6 Error Code Catalog
# Every id below is triggerable by at least one endpoint call from an empty DB.
# =============================================================================
errors:
  # ---- auth ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles, or is not a declared role at all"
  - id: ERR_ACTOR_NOT_RECOGNIZED
    http: 403
    condition: "an entity_backed role's X-User-ID does not resolve to a Worker row with the matching skill"

  # ---- request shape ----
  - id: ERR_VALIDATION
    http: 422
    condition: "a required field is missing, of the wrong type, or outside a declared numeric bound that has no dedicated error"
  - id: ERR_INVALID_ENUM_VALUE
    http: 422
    condition: "an enum-typed field carries a value that is not a declared member"

  # ---- not found ----
  - id: ERR_ZONE_NOT_FOUND
    http: 404
    condition: "a zone id in the path or body does not exist"
  - id: ERR_VARIETY_NOT_FOUND
    http: 404
    condition: "variety_id does not exist"
  - id: ERR_CROP_CYCLE_NOT_FOUND
    http: 404
    condition: "a crop cycle id in the path or body does not exist"
  - id: ERR_CLIMATE_STRATEGY_NOT_FOUND
    http: 404
    condition: "a climate strategy id in the path does not exist"
  - id: ERR_FERTIGATION_BATCH_NOT_FOUND
    http: 404
    condition: "a fertigation batch id in the path does not exist"
  - id: ERR_SCOUTING_OBSERVATION_NOT_FOUND
    http: 404
    condition: "observation_id does not exist"
  - id: ERR_BIO_CONTROL_RELEASE_NOT_FOUND
    http: 404
    condition: "a bio control release id in the path does not exist"
  - id: ERR_WORKER_NOT_FOUND
    http: 404
    condition: "worker_id does not exist"
  - id: ERR_LABOR_TASK_NOT_FOUND
    http: 404
    condition: "a labor task id in the path or labor_task_id in the body does not exist"
  - id: ERR_HARVEST_LOT_NOT_FOUND
    http: 404
    condition: "a harvest lot id in the path does not exist"
  - id: ERR_RETAIL_PROGRAM_NOT_FOUND
    http: 404
    condition: "a retail program id in the path or program_id in the body does not exist"
  - id: ERR_COMMITMENT_WEEK_NOT_FOUND
    http: 404
    condition: "a commitment week id in the path does not exist"
  - id: ERR_LOT_ALLOCATION_NOT_FOUND
    http: 404
    condition: "a lot allocation id in the path does not exist"

  # ---- concurrency ----
  - id: ERR_STALE_ZONE_VERSION
    http: 412
    condition: "expected_zone_version does not equal Zone.version on POST /climate-strategies or POST /zones/{id}/posture-overrides"
  - id: ERR_STALE_LOT_VERSION
    http: 412
    condition: "expected_lot_version does not equal HarvestLot.version on POST /harvest-lots/{id}/regrade"

  # ---- state ----
  - id: ERR_TERMINAL_STATE
    http: 409
    condition: "the entity is already terminal for the dimension being written, including a lot whose cold_chain_status is RELEASED or REJECTED"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested from-state to to-state pair is not declared in §1.2, including grading an already graded lot"
  - id: ERR_WEEK_NOT_ALLOCATED
    http: 409
    condition: "confirming an allocation whose commitment week is not ALLOCATED"
  - id: ERR_WEEK_ALREADY_SHIPPED
    http: 409
    condition: "revoking an allocation whose commitment week has already shipped or closed"
  - id: ERR_NO_CONFIRMED_ALLOCATIONS
    http: 409
    condition: "shipping a week that holds no CONFIRMED allocation"
  - id: ERR_ACTUALS_ALREADY_RECORDED
    http: 409
    condition: "posting energy actuals to a strategy whose actuals_recorded_at is already set"
  - id: ERR_BATCH_NOT_DELIVERED
    http: 409
    condition: "logging a drainage reading against a batch whose status is not DELIVERED"
  - id: ERR_NO_DRAIN_READINGS
    http: 409
    condition: "reconciling a batch that has no accepted drainage reading"
  - id: ERR_CROP_CYCLE_NOT_ACTIVE
    http: 409
    condition: "referencing a crop cycle that is not in an operationally active status for the requested child write"
  - id: ERR_OPEN_LABOR_TASKS
    http: 409
    condition: "terminating a crop cycle that still has SCHEDULED or IN_PROGRESS labor tasks"
  - id: ERR_UNGRADED_LOTS_REMAIN
    http: 409
    condition: "terminating a crop cycle that still has UNGRADED harvest lots"
  - id: ERR_TASK_WINDOW_NOT_OPEN
    http: 409
    condition: "starting a labor task before its window_start"
  - id: ERR_TASK_WINDOW_STILL_OPEN
    http: 409
    condition: "marking a labor task NO_SHOW before its window_end has passed"
  - id: ERR_DECISION_REASON_REQUIRED
    http: 422
    condition: "rejecting or returning a release request without decision_reason"

  # ---- safety ----
  - id: ERR_ZONE_IPM_LOCKED
    http: 409
    condition: "scheduling labor, registering a lot, placing hives or starting work while zone.ipm_posture is LOCKED"
  - id: ERR_REENTRY_INTERVAL_ACTIVE
    http: 409
    condition: "worker-entry operations attempted before zone.reentry_clear_at"
  - id: ERR_IRRIGATION_LOCKED
    http: 409
    condition: "mixing or delivering a fertigation batch while zone.irrigation_posture is LOCKED"
  - id: ERR_LOT_NOT_COLD_HELD
    http: 409
    condition: "confirming an allocation whose lot is not in cold_chain_status COLD_HELD"
  - id: ERR_LOT_NOT_GRADED
    http: 409
    condition: "confirming an allocation whose lot is still UNGRADED"
  - id: ERR_COLD_CHAIN_BREACH
    http: 422
    condition: "a cold chain event whose pulp_temp_c exceeds PRECOOL_MAX_C or COLD_HOLD_MAX_C"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting user already performed the incompatible upstream step: approving a release they scouted, or signing a shipment for a lot they released from cold storage"

  # ---- constraint ----
  - id: ERR_ZONE_CODE_DUPLICATE
    http: 409
    condition: "Zone.code already exists"
  - id: ERR_PROGRAM_CODE_DUPLICATE
    http: 409
    condition: "RetailProgram.program_code already exists"
  - id: ERR_ISO_WEEK_DUPLICATE
    http: 409
    condition: "iso_week already exists inside the same program"
  - id: ERR_SETPOINT_OUT_OF_RANGE
    http: 422
    condition: "a climate setpoint falls outside its declared range, including lighting_hours above window_hours"
  - id: ERR_ZONE_CAPABILITY_MISSING
    http: 422
    condition: "lighting_hours above 0 on a zone without supplemental lighting, or screen_position_pct above 0 on a zone without a thermal screen"
  - id: ERR_YIELD_CURVE_LENGTH_MISMATCH
    http: 422
    condition: "yield_curve_lbs_per_sqft length differs from cycle_length_weeks - first_harvest_week + 1"
  - id: ERR_MASS_BALANCE_MISMATCH
    http: 422
    condition: "grade_a_lbs + grade_b_lbs + cull_lbs differs from gross_weight_lbs"
  - id: ERR_ALLOCATED_EXCEEDS_GRADE
    http: 409
    condition: "a regrade would leave a grade below the pounds already allocated from it"
  - id: ERR_PACK_OUT_BELOW_MINIMUM
    http: 422
    condition: "pack_out_pct below MIN_PACK_OUT_PCT without low_pack_out_acknowledged"
  - id: ERR_MAX_REVISIONS_EXCEEDED
    http: 409
    condition: "returning a release request for revision when revision_count already equals MAX_RELEASE_REVISIONS"
  - id: ERR_RELEASE_COUNT_OUT_OF_TOLERANCE
    http: 422
    condition: "actual_release_count outside RELEASE_COUNT_TOLERANCE_PCT of approved_release_count"
  - id: ERR_HIVE_SLOTS_EXCEEDED
    http: 409
    condition: "a hive placement would push zone.hive_slots_used above zone.hive_slot_capacity"
  - id: ERR_DELIVERY_VOLUME_VARIANCE
    http: 422
    condition: "delivered_volume_liters outside DELIVERY_TOLERANCE_PCT of planned_volume_liters"

  # ---- temporal ----
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "window_end is not strictly after window_start"
  - id: ERR_CLIMATE_WINDOW_OVERLAP
    http: 409
    condition: "an ACTIVE strategy on the same zone and regime overlaps the requested window and supersede is not true"
  - id: ERR_WORKER_DOUBLE_BOOKED
    http: 409
    condition: "the worker already holds an active task whose buffered window touches the requested window"
  - id: ERR_HARVEST_TOO_EARLY
    http: 422
    condition: "harvest_date precedes crop_cycle.first_harvest_allowed_date"
  - id: ERR_PRODUCTION_TOO_EARLY
    http: 409
    condition: "moving a cycle to PRODUCTION before first_harvest_allowed_date"
  - id: ERR_ZONE_OCCUPIED
    http: 409
    condition: "another live crop cycle already occupies the zone over the requested date range"
  - id: ERR_TERMINATION_DATE_OUT_OF_RANGE
    http: 422
    condition: "termination_date beyond planned_end_date + TERMINATION_GRACE_DAYS"
  - id: ERR_TASK_AFTER_TERMINATION
    http: 409
    condition: "a labor task window starts after the cycle's scheduled termination_date"
  - id: ERR_READING_OUT_OF_WINDOW
    http: 422
    condition: "reading_at outside the batch's DRAIN_READING_WINDOW_HOURS window"
  - id: ERR_WEEK_STILL_OPEN
    http: 409
    condition: "closing an OPEN week before its delivery window has elapsed"
  - id: ERR_RELEASE_BEFORE_OBSERVATION
    http: 422
    condition: "released_at precedes the justifying observation's observed_at"

  # ---- referential ----
  - id: ERR_PROGRAM_NOT_ACTIVE
    http: 409
    condition: "the program behind the week is PAUSED"
  - id: ERR_WORKER_INACTIVE
    http: 409
    condition: "assigning a task to a worker whose status is INACTIVE"
  - id: ERR_WORKER_SKILL_MISMATCH
    http: 409
    condition: "task_type differs from the assigned worker's skill"
  - id: ERR_TARGET_EC_OFF_RECIPE
    http: 422
    condition: "batch target_ec_ms outside RECIPE_EC_TOLERANCE_MS of the cycle's variety.ec_target_ms"
  - id: ERR_OBSERVATION_BELOW_THRESHOLD
    http: 409
    condition: "the justifying observation's threshold_status is BELOW"
  - id: ERR_OBSERVATION_ZONE_MISMATCH
    http: 409
    condition: "the justifying observation belongs to a different zone than the release"
  - id: ERR_CROP_CYCLE_ZONE_MISMATCH
    http: 409
    condition: "a child row's zone_id disagrees with the zone_id of the crop cycle it references"

  # ---- fiscal ----
  - id: ERR_LABOR_BUDGET_EXCEEDED
    http: 409
    condition: "planned_cost_usd exceeds zone.labor_budget_remaining_usd"
  - id: ERR_NO_ELIGIBLE_LOTS
    http: 422
    condition: "an allocation run finds no eligible lot for the requested week_start_date"
  - id: ERR_INSUFFICIENT_AVAILABLE_LBS
    http: 409
    condition: "the pounds being confirmed exceed the lot's available pounds for that grade"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: GrowerManager
    description: "Head grower: owns zones, varieties, crop cycles, climate plans, labor scheduling, retail programs, commitment weeks, allocation runs and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /zones"
      - "POST /zones/{id}/posture-overrides"
      - "POST /varieties"
      - "POST /crop-cycles"
      - "POST /crop-cycles/{id}/transitions"
      - "POST /crop-cycles/{id}/hive-placements"
      - "POST /crop-cycles/{id}/pollination-checks"
      - "POST /climate-strategies"
      - "POST /climate-strategies/{id}/actuals"
      - "POST /climate-strategies/{id}/transitions"
      - "POST /workers"
      - "POST /labor-tasks"
      - "POST /retail-programs"
      - "POST /commitment-weeks"
      - "POST /allocation-runs"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /labor-tasks/{id}/transitions (shared with HarvestSupervisor)"
      - "POST /commitment-weeks/{id}/transitions with to_status=CLOSED (SHIPPED belongs to QualityInspector)"
      - "POST /lot-allocations/{id}/transitions with to_status=REVOKED (CONFIRMED belongs to QualityInspector)"
      - "every GET endpoint"

  - name: IrrigationTech
    description: "Irrigation technician: mixes and delivers fertigation batches and logs drainage readings"
    identity: "opaque"
    exclusive_operations:
      - "POST /fertigation-batches"
      - "POST /fertigation-batches/{id}/transitions"
      - "POST /fertigation-batches/{id}/drainage-readings"
    shared_operations:
      - "every GET endpoint"

  - name: IPMScout
    description: "Scout: files scouting observations, requests biological control releases and executes approved releases"
    identity: "entity_backed:Worker"
    exclusive_operations:
      - "POST /scouting-observations"
      - "POST /bio-control-releases"
      - "POST /bio-control-releases/{id}/execute"
    shared_operations:
      - "POST /bio-control-releases/{id}/transitions with to_status=CANCELLED (REQUESTED and REJECTED belong to IPMCoordinator)"
      - "every GET endpoint"

  - name: IPMCoordinator
    description: "IPM coordinator: approves, revises or rejects release requests; must not be the scout who filed the justifying observation"
    identity: "entity_backed:Worker"
    exclusive_operations:
      - "POST /bio-control-releases/{id}/approve"
    shared_operations:
      - "POST /bio-control-releases/{id}/transitions with to_status IN {REQUESTED, REJECTED}"
      - "every GET endpoint"

  - name: HarvestSupervisor
    description: "Harvest supervisor: registers picked lots and owns the grading dimension"
    identity: "entity_backed:Worker"
    exclusive_operations:
      - "POST /harvest-lots"
      - "POST /harvest-lots/{id}/grade"
      - "POST /harvest-lots/{id}/regrade"
    shared_operations:
      - "POST /labor-tasks/{id}/transitions (shared with GrowerManager)"
      - "every GET endpoint"

  - name: QualityInspector
    description: "Quality inspector: owns the cold chain dimension, confirms allocations and signs shipments; may not sign a shipment consuming a lot they released"
    identity: "opaque"
    exclusive_operations:
      - "POST /harvest-lots/{id}/cold-chain-events"
    shared_operations:
      - "POST /lot-allocations/{id}/transitions with to_status=CONFIRMED"
      - "POST /commitment-weeks/{id}/transitions with to_status=SHIPPED"
      - "every GET endpoint"

# =============================================================================
# Domain constants referenced by §1.2 preconditions that are not owned by any
# single §1.3 calculation. Values are normative.
# =============================================================================
domain_constants:
  MAX_DENSITY_FACTOR: 1.2
  TERMINATION_GRACE_DAYS: 14
  DELIVERY_TOLERANCE_PCT: 5
  DRAIN_READING_WINDOW_HOURS: 48
  MAX_RELEASE_REVISIONS: 2
  RELEASE_COUNT_TOLERANCE_PCT: 10
  AGENT_REENTRY_HOURS:
    ENCARSIA: 4
    AMBLYSEIUS: 6
    APHIDIUS: 12
  PRECOOL_MAX_C: 12.0
  COLD_HOLD_MAX_C: 8.0
  MIN_PACK_OUT_PCT: 80.00
  WORKER_BUFFER_MINUTES: 30
  RECIPE_EC_TOLERANCE_MS: 0.8
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"
