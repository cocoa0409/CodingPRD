# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1836 — Water Main Break Response & Repair
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: wo_estimate_vs_actual_cost_diverge
        grounds:
          - calculations.estimated_cost_cents
          - calculations.actual_cost_cents
          - entities.WorkOrder.fields.estimated_cost_cents
          - entities.WorkOrder.fields.actual_cost_cents
          - entities.WorkOrder.fields.cost_variance_cents
        distinguishing_aspect: |
          Cost accounting on WorkOrder: the forward-looking estimate (tiered rate x
          type multiplier + kit + crew-rate x est_hours) and the chronological
          actual (logged labor + per-line materials) are two valid algorithms over
          the same work order and MUST produce different values for this fixture.
        test_recipe:
          setup:
            - "Segment MAIN-10-OAK diameter 10 (MEDIUM rate tier 18000), one valve Z1/100"
            - "Break confirmed SPLIT/HIGH and isolated (extent 100, no auto-advisory)"
            - "Crew Alpha LIGHT rate 9000; work order est_pipe_length_ft=12 dispatched"
            - "Logical clock at startup default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-10-OAK", material: DUCTILE_IRON, diameter_inches: 10, install_year: 1985 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /valves"
              payload: { valve_code: "V-OAK-1", pipe_segment_id: "${seg}", coverage_zone: "Z1", customers_served: 100 }
              as: PublicWorksEngineer
              captures: { v1: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "1200 Oak St", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { br: $.data.id }
            - call: "POST /break-reports/${br}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: SPLIT, severity: HIGH }
              as: Dispatcher
              captures: { br_v: $.data.version }
            - call: "POST /isolation-events"
              payload: { break_report_id: "${br}", valve_ids: ["${v1}"], expected_break_report_version: "${br_v}" }
              as: Dispatcher
              captures: { iso: $.data.id }
            - call: "POST /isolation-events/${iso}/execute"
              as: Dispatcher
            - call: "POST /crews"
              payload: { crew_name: "Crew Alpha", crew_size: 4, equipment_class: LIGHT, hourly_rate_cents: 9000 }
              as: Dispatcher
              captures: { cr: $.data.id }
            - call: "POST /work-orders"
              payload: { break_report_id: "${br}", est_pipe_length_ft: 12 }
              as: Dispatcher
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/dispatch"
              payload: { crew_id: "${cr}" }
              as: Dispatcher
              captures: { est: $.data.estimated_cost_cents }
            - call: "POST /work-orders/${wo}/arrive"
              as: CrewLead
              as_user_id: "${cr}"
          trigger:
            - call: "POST /work-orders/${wo}/complete"
              payload: { actual_pipe_length_ft: 10, labor_hours: 5.5, materials_used: [ { item_code: "PIPE-10IN", quantity: 2, unit_price_cents: 40000 } ] }
              as: CrewLead
              as_user_id: "${cr}"
              captures: { act: $.data.actual_cost_cents, var: $.data.cost_variance_cents }
          assert:
            - "WorkOrder.${wo}.estimated_cost_cents == 409000  # round(12*18000*1.25)=270000 + kit 85000 + 9000*6=54000"
            - "WorkOrder.${wo}.actual_cost_cents == 137500    # round(5.5*9000)=49500 + round(2*40000*1.10)=88000"
            - "WorkOrder.${wo}.cost_variance_cents == -271500 # 137500 - 409000; the two variants diverge"

      - name: segment_repeat_break_provisional_vs_official
        grounds:
          - calculations.repeat_break_counts
          - entities.PipeSegment.fields.repeat_break_count_36mo
          - entities.PipeSegment.fields.provisional_break_count_36mo
          - entities.PipeSegment.fields.condition_status
        distinguishing_aspect: |
          Asset-condition scoring on PipeSegment (different entity domain from
          WorkOrder cost): the provisional variant includes the still-open
          CONFIRMED break while the official variant counts only REPAIRED-or-later
          breaks, so the same segment history yields provisional 3 vs official 2.
        test_recipe:
          setup:
            - "Segment MAIN-8-ELM diameter 8, one valve Z1/100; crew LIGHT rate 6000"
            - "Breaks B1 and B2 fully repaired (REPAIRED); break B3 confirmed only (CONFIRMED)"
            - "All three confirmed within the trailing 36 months of the ops run"
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-ELM", material: CAST_IRON, diameter_inches: 8, install_year: 1962 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /valves"
              payload: { valve_code: "V-ELM-1", pipe_segment_id: "${seg}", coverage_zone: "Z1", customers_served: 100 }
              as: PublicWorksEngineer
              captures: { v1: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "Crew Beta", crew_size: 3, equipment_class: LIGHT, hourly_rate_cents: 6000 }
              as: Dispatcher
              captures: { cr: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "100 Elm St", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { b1: $.data.id }
            - call: "POST /break-reports/${b1}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: CIRCUMFERENTIAL, severity: MEDIUM }
              as: Dispatcher
              captures: { b1_v: $.data.version }
            - call: "POST /isolation-events"
              payload: { break_report_id: "${b1}", valve_ids: ["${v1}"], expected_break_report_version: "${b1_v}" }
              as: Dispatcher
              captures: { i1: $.data.id }
            - call: "POST /isolation-events/${i1}/execute"
              as: Dispatcher
            - call: "POST /work-orders"
              payload: { break_report_id: "${b1}", est_pipe_length_ft: 4 }
              as: Dispatcher
              captures: { w1: $.data.id }
            - call: "POST /work-orders/${w1}/dispatch"
              payload: { crew_id: "${cr}" }
              as: Dispatcher
            - call: "POST /work-orders/${w1}/arrive"
              as: CrewLead
              as_user_id: "${cr}"
            - call: "POST /work-orders/${w1}/complete"
              payload: { actual_pipe_length_ft: 4, labor_hours: 1, materials_used: [] }
              as: CrewLead
              as_user_id: "${cr}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: System
            - call: "POST /break-reports"
              payload: { location_description: "240 Elm St", source: SENSOR_SCADA }
              as: Dispatcher
              captures: { b2: $.data.id }
            - call: "POST /break-reports/${b2}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: CIRCUMFERENTIAL, severity: LOW }
              as: Dispatcher
              captures: { b2_v: $.data.version }
            - call: "POST /isolation-events"
              payload: { break_report_id: "${b2}", valve_ids: ["${v1}"], expected_break_report_version: "${b2_v}" }
              as: Dispatcher
              captures: { i2: $.data.id }
            - call: "POST /isolation-events/${i2}/execute"
              as: Dispatcher
            - call: "POST /work-orders"
              payload: { break_report_id: "${b2}", est_pipe_length_ft: 4 }
              as: Dispatcher
              captures: { w2: $.data.id }
            - call: "POST /work-orders/${w2}/dispatch"
              payload: { crew_id: "${cr}" }
              as: Dispatcher
            - call: "POST /work-orders/${w2}/arrive"
              as: CrewLead
              as_user_id: "${cr}"
            - call: "POST /work-orders/${w2}/complete"
              payload: { actual_pipe_length_ft: 4, labor_hours: 1, materials_used: [] }
              as: CrewLead
              as_user_id: "${cr}"
            - call: "POST /break-reports"
              payload: { location_description: "310 Elm St", source: CREW_OBSERVATION }
              as: Dispatcher
              captures: { b3: $.data.id }
            - call: "POST /break-reports/${b3}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: SPLIT, severity: MEDIUM }
              as: Dispatcher
          trigger:
            - call: "POST /ops-runs"
              as: System
            - call: "GET /pipe-segments/${seg}"
              as: Dispatcher
              captures: { official: $.data.repeat_break_count_36mo, provisional: $.data.provisional_break_count_36mo, cond: $.data.condition_status }
          assert:
            - "PipeSegment.${seg}.repeat_break_count_36mo == 2      # official: only REPAIRED B1,B2"
            - "PipeSegment.${seg}.provisional_break_count_36mo == 3 # provisional: adds in-progress CONFIRMED B3"
            - "PipeSegment.${seg}.condition_status == WATCH         # derived from official (== 2), not provisional"

  - rule_id: combinatorial_formula
    instances:
      - name: blowout_large_diameter_estimate_combinatorial
        grounds:
          - calculations.estimated_cost_cents
          - calculations.material_sizing
          - entities.WorkOrder.fields.required_equipment_class
          - entities.WorkOrder.fields.required_clamp_kit
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — tiered rate selection
          on diameter (>16 -> 25000), conditional multiplier 1.6 and kit 150000 on
          BLOWOUT, plus crew rate x est_hours(10); every branch combines in one value.
        test_recipe:
          setup:
            - "Segment MAIN-20-MAPLE diameter 20 (LARGE tier), one valve Z1/100"
            - "Break confirmed BLOWOUT; HEAVY crew rate 12000; work order est length 8 dispatched"
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-20-MAPLE", material: CAST_IRON, diameter_inches: 20, install_year: 1955 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /valves"
              payload: { valve_code: "V-MAPLE-1", pipe_segment_id: "${seg}", coverage_zone: "Z1", customers_served: 100 }
              as: PublicWorksEngineer
              captures: { v1: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "77 Maple Ave", source: SENSOR_SCADA }
              as: Dispatcher
              captures: { br: $.data.id }
            - call: "POST /break-reports/${br}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: BLOWOUT, severity: HIGH }
              as: Dispatcher
              captures: { br_v: $.data.version }
            - call: "POST /isolation-events"
              payload: { break_report_id: "${br}", valve_ids: ["${v1}"], expected_break_report_version: "${br_v}" }
              as: Dispatcher
              captures: { iso: $.data.id }
            - call: "POST /isolation-events/${iso}/execute"
              as: Dispatcher
            - call: "POST /crews"
              payload: { crew_name: "Crew Heavy", crew_size: 6, equipment_class: HEAVY, hourly_rate_cents: 12000 }
              as: Dispatcher
              captures: { cr: $.data.id }
            - call: "POST /work-orders"
              payload: { break_report_id: "${br}", est_pipe_length_ft: 8 }
              as: Dispatcher
              captures: { wo: $.data.id, cls: $.data.required_equipment_class, kit: $.data.required_clamp_kit }
          trigger:
            - call: "POST /work-orders/${wo}/dispatch"
              payload: { crew_id: "${cr}" }
              as: Dispatcher
              captures: { est: $.data.estimated_cost_cents }
          assert:
            - "WorkOrder.${wo}.required_equipment_class == HEAVY   # diameter 20 > 12 (and BLOWOUT)"
            - "WorkOrder.${wo}.required_clamp_kit == CLAMP_C       # diameter > 16"
            - "WorkOrder.${wo}.estimated_cost_cents == 590000      # round(8*25000*1.6)=320000 + kit 150000 + 12000*10=120000"

      - name: per_line_rounding_order_actual_cost
        grounds:
          - calculations.actual_cost_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the pinned rule rounds
          each materials line (qty x unit x 1.10) to cents BEFORE summing; three
          lines at 333 cents give 3 x 366 = 1098, whereas sum-then-round would
          give round(999 x 1.1) = 1099. Different mode from the tiered-formula instance.
        test_recipe:
          setup:
            - "Segment MAIN-6-PINE diameter 6 (SMALL tier), one valve Z1/100"
            - "Break confirmed CIRCUMFERENTIAL; LIGHT crew rate 6000; work order dispatched and on site"
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-6-PINE", material: PVC, diameter_inches: 6, install_year: 2001 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /valves"
              payload: { valve_code: "V-PINE-1", pipe_segment_id: "${seg}", coverage_zone: "Z1", customers_served: 100 }
              as: PublicWorksEngineer
              captures: { v1: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "9 Pine Ct", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { br: $.data.id }
            - call: "POST /break-reports/${br}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: CIRCUMFERENTIAL, severity: LOW }
              as: Dispatcher
              captures: { br_v: $.data.version }
            - call: "POST /isolation-events"
              payload: { break_report_id: "${br}", valve_ids: ["${v1}"], expected_break_report_version: "${br_v}" }
              as: Dispatcher
              captures: { iso: $.data.id }
            - call: "POST /isolation-events/${iso}/execute"
              as: Dispatcher
            - call: "POST /crews"
              payload: { crew_name: "Crew Pine", crew_size: 2, equipment_class: LIGHT, hourly_rate_cents: 6000 }
              as: Dispatcher
              captures: { cr: $.data.id }
            - call: "POST /work-orders"
              payload: { break_report_id: "${br}", est_pipe_length_ft: 4 }
              as: Dispatcher
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/dispatch"
              payload: { crew_id: "${cr}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo}/arrive"
              as: CrewLead
              as_user_id: "${cr}"
          trigger:
            - call: "POST /work-orders/${wo}/complete"
              payload: { actual_pipe_length_ft: 4, labor_hours: 1, materials_used: [ { item_code: "BOLT-KIT", quantity: 1, unit_price_cents: 333 }, { item_code: "BOLT-KIT", quantity: 1, unit_price_cents: 333 }, { item_code: "BOLT-KIT", quantity: 1, unit_price_cents: 333 } ] }
              as: CrewLead
              as_user_id: "${cr}"
              captures: { act: $.data.actual_cost_cents }
          assert:
            - "WorkOrder.${wo}.actual_cost_cents == 7098  # labor round(1*6000)=6000 + 3 x round(1*333*1.10)=3x366=1098"
            - "WorkOrder.${wo}.actual_cost_cents != 7099  # rejected alternative: 6000 + round(999*1.10)=1099"

  - rule_id: non_linear_state_machine
    instances:
      - name: break_report_branch_and_rework_loop
        grounds:
          - state_machines.BreakReport.REPORTED_to_FALSE_ALARM
          - state_machines.BreakReport.REPAIRED_to_ISOLATED
          - state_machines.BreakReport.ISOLATED_to_IN_REPAIR
        distinguishing_aspect: |
          BreakReport is non-linear twice over: REPORTED forks to CONFIRMED or
          FALSE_ALARM, and REPAIRED loops back to ISOLATED/IN_REPAIR for rework —
          this instance drives both the fork (a FALSE_ALARM sibling rejects confirm)
          and the cycle (a REPAIRED break re-enters IN_REPAIR via a new work order).
        test_recipe:
          setup:
            - "Segment MAIN-8-OAK diameter 8, valve Z1/100, LIGHT crew rate 6000"
            - "Break A fully repaired (REPAIRED); break B marked FALSE_ALARM"
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-OAK", material: DUCTILE_IRON, diameter_inches: 8, install_year: 1978 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /valves"
              payload: { valve_code: "V-OAK-9", pipe_segment_id: "${seg}", coverage_zone: "Z1", customers_served: 100 }
              as: PublicWorksEngineer
              captures: { v1: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "Crew Oak", crew_size: 3, equipment_class: LIGHT, hourly_rate_cents: 6000 }
              as: Dispatcher
              captures: { cr: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "400 Oak St", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { brA: $.data.id }
            - call: "POST /break-reports/${brA}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: CIRCUMFERENTIAL, severity: MEDIUM }
              as: Dispatcher
              captures: { brA_v: $.data.version }
            - call: "POST /isolation-events"
              payload: { break_report_id: "${brA}", valve_ids: ["${v1}"], expected_break_report_version: "${brA_v}" }
              as: Dispatcher
              captures: { isoA: $.data.id }
            - call: "POST /isolation-events/${isoA}/execute"
              as: Dispatcher
            - call: "POST /work-orders"
              payload: { break_report_id: "${brA}", est_pipe_length_ft: 4 }
              as: Dispatcher
              captures: { woA: $.data.id }
            - call: "POST /work-orders/${woA}/dispatch"
              payload: { crew_id: "${cr}" }
              as: Dispatcher
            - call: "POST /work-orders/${woA}/arrive"
              as: CrewLead
              as_user_id: "${cr}"
            - call: "POST /work-orders/${woA}/complete"
              payload: { actual_pipe_length_ft: 4, labor_hours: 1, materials_used: [] }
              as: CrewLead
              as_user_id: "${cr}"
            - call: "POST /break-reports"
              payload: { location_description: "401 Oak St (puddle)", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { brB: $.data.id }
            - call: "POST /break-reports/${brB}/false-alarm"
              as: Dispatcher
          trigger:
            - call: "POST /break-reports/${brB}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: SPLIT, severity: LOW }
              as: Dispatcher
              captures: { err_fork: $.data.error_id }
            - call: "GET /break-reports/${brA}"
              as: Dispatcher
              captures: { brA_v2: $.data.version }
            - call: "POST /isolation-events"
              payload: { break_report_id: "${brA}", valve_ids: ["${v1}"], expected_break_report_version: "${brA_v2}" }
              as: Dispatcher
              captures: { isoA2: $.data.id }
            - call: "POST /isolation-events/${isoA2}/execute"
              as: Dispatcher
            - call: "POST /work-orders"
              payload: { break_report_id: "${brA}", est_pipe_length_ft: 4 }
              as: Dispatcher
              captures: { woA2: $.data.id }
            - call: "POST /work-orders/${woA2}/dispatch"
              payload: { crew_id: "${cr}" }
              as: Dispatcher
            - call: "POST /work-orders/${woA2}/arrive"
              as: CrewLead
              as_user_id: "${cr}"
            - call: "GET /break-reports/${brA}"
              as: Dispatcher
              captures: { stA: $.data.break_status }
          assert:
            - "BreakReport.${brB}.break_status == FALSE_ALARM (fork taken at setup)"
            - "confirm on FALSE_ALARM break B returns error_id ERR_INVALID_STATE (terminal fork rejects the other branch)"
            - "BreakReport.${brA}.break_status == IN_REPAIR after rework arrival  # REPAIRED -> ISOLATED -> IN_REPAIR loop"

      - name: pipe_segment_watch_candidate_cycle
        grounds:
          - state_machines.PipeSegment.WATCH_to_CANDIDATE
          - state_machines.PipeSegment.CANDIDATE_to_WATCH
          - calculations.condition_status_derivation
          - calculations.repeat_break_counts
        distinguishing_aspect: |
          PipeSegment's condition machine is cyclic (WATCH -> CANDIDATE -> WATCH as
          breaks age out of the 36-month window), a different entity from the
          branching/cyclic BreakReport machine; this instance drives the cycle with
          the logical clock and two ops runs.
        test_recipe:
          setup:
            - "Segment MAIN-12-BIRCH diameter 12, valve Z1/100, LIGHT crew rate 6000"
            - "Break B1 confirmed+repaired at 2023-01-15; breaks B2, B3 confirmed+repaired at 2023-06-15/16"
            - "Ops run at 2023-07-01 derives CANDIDATE (official count 3)"
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-12-BIRCH", material: CAST_IRON, diameter_inches: 12, install_year: 1958 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /valves"
              payload: { valve_code: "V-BIRCH-1", pipe_segment_id: "${seg}", coverage_zone: "Z1", customers_served: 100 }
              as: PublicWorksEngineer
              captures: { v1: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "Crew Birch", crew_size: 3, equipment_class: LIGHT, hourly_rate_cents: 6000 }
              as: Dispatcher
              captures: { cr: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2023-01-15T00:00:00Z" }
              as: System
            - call: "POST /break-reports"
              payload: { location_description: "10 Birch Ln", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { b1: $.data.id }
            - call: "POST /break-reports/${b1}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: CIRCUMFERENTIAL, severity: MEDIUM }
              as: Dispatcher
              captures: { b1_v: $.data.version }
            - call: "POST /isolation-events"
              payload: { break_report_id: "${b1}", valve_ids: ["${v1}"], expected_break_report_version: "${b1_v}" }
              as: Dispatcher
              captures: { i1: $.data.id }
            - call: "POST /isolation-events/${i1}/execute"
              as: Dispatcher
            - call: "POST /work-orders"
              payload: { break_report_id: "${b1}", est_pipe_length_ft: 4 }
              as: Dispatcher
              captures: { w1: $.data.id }
            - call: "POST /work-orders/${w1}/dispatch"
              payload: { crew_id: "${cr}" }
              as: Dispatcher
            - call: "POST /work-orders/${w1}/arrive"
              as: CrewLead
              as_user_id: "${cr}"
            - call: "POST /work-orders/${w1}/complete"
              payload: { actual_pipe_length_ft: 4, labor_hours: 1, materials_used: [] }
              as: CrewLead
              as_user_id: "${cr}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2023-06-15T00:00:00Z" }
              as: System
            - call: "POST /break-reports"
              payload: { location_description: "22 Birch Ln", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { b2: $.data.id }
            - call: "POST /break-reports/${b2}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: CIRCUMFERENTIAL, severity: MEDIUM }
              as: Dispatcher
              captures: { b2_v: $.data.version }
            - call: "POST /isolation-events"
              payload: { break_report_id: "${b2}", valve_ids: ["${v1}"], expected_break_report_version: "${b2_v}" }
              as: Dispatcher
              captures: { i2: $.data.id }
            - call: "POST /isolation-events/${i2}/execute"
              as: Dispatcher
            - call: "POST /work-orders"
              payload: { break_report_id: "${b2}", est_pipe_length_ft: 4 }
              as: Dispatcher
              captures: { w2: $.data.id }
            - call: "POST /work-orders/${w2}/dispatch"
              payload: { crew_id: "${cr}" }
              as: Dispatcher
            - call: "POST /work-orders/${w2}/arrive"
              as: CrewLead
              as_user_id: "${cr}"
            - call: "POST /work-orders/${w2}/complete"
              payload: { actual_pipe_length_ft: 4, labor_hours: 1, materials_used: [] }
              as: CrewLead
              as_user_id: "${cr}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2023-06-16T00:00:00Z" }
              as: System
            - call: "POST /break-reports"
