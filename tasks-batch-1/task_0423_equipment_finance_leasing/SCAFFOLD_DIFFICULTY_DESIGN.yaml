            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/book"
              payload: { expected_lease_version: "${lease_v}" }
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/fund"
              payload: {}
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/_clock/set"
              payload: { to_iso8601: "2027-06-01T00:00:00.000Z" }
