            - "PrintCapacity.${cap15_id}.reserved_qty == 15"
            - "PrintCapacity.${cap15_id}.available_qty == 5"
            - "PrintReservation.${res15a_id}.reservation_state == HELD"

      - name: reservation_needed_by_buffer_convention
        grounds:
          - validations[priority=7]
          - state_machines.PrintReservation.HELD_to_RELEASED
          - errors[ERR_RUSH_COMMITMENT_BREACH]
        distinguishing_aspect: "A reservation with an explicit needed_by past the window's start passes on interval arithmetic alone, and only a zero-rush window is rejected — the buffer convention is closed at the window start, so a window starting before needed_by is always admissible regardless of how far the clock has run."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LIC16 and a window whose start falls before the requested needed_by."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "NBL Buffer", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 100000 }
              as: PlatformAdmin
              captures: { lic16_id: $.data.id }
            - call: "POST /print-capacity"
              payload: { city_code: "BOS", print_type: "EMBROIDER", window_start: "2026-09-01T02:00:00Z", window_end: "2026-09-01T10:00:00Z", capacity_qty: 40, rush_sla_hours: 6 }
              as: FulfillmentCoordinator
              captures: { cap16_id: $.data.id }
          trigger:
            - call: "POST /print-capacity:reserve"
              payload: { print_capacity_id: "${cap16_id}", quantity: 10, rush_flag: true, needed_by: "2026-09-01T08:00:00Z" }
              as: FulfillmentCoordinator
              captures: { res16_id: $.data.id, res16_needed: $.data.needed_by }
            - call: "POST /print-capacity:reserve"
              payload: { print_capacity_id: "${cap16_id}", quantity: 10, rush_flag: true, needed_by: "2026-09-01T01:00:00Z" }
              as: FulfillmentCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "the first reservation succeeds with PrintReservation.${res16_id}.reservation_state == HELD"
            - "the first reservation records needed_by == 2026-09-01T08:00:00Z"
            - "the second reservation is rejected with ERR_RUSH_COMMITMENT_BREACH because its needed_by precedes the window start"
            - "PrintCapacity.${cap16_id}.reserved_qty == 10"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: minimum_guarantee_reversal_restores_ledger_triple
        grounds:
          - calculations.licensor_royalty_settlement
          - state_machines.MinimumGuaranteeSettlement.APPROVED_to_REVERSED
          - endpoints.POST_/licensors/{licensor_id}/minimum-guarantee/reverse
        distinguishing_aspect: "Applying an early minimum-guarantee settlement and then reversing it must restore the conserved triple (accrued, blocked, unsettled) to exactly (843.75, 0, 843.75) — the sum of the three quantities is the invariant, and the reversal is pinned to the snapped value rather than recomputed."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LIC17 with minimum_guarantee_cents 2000 and one delivered ECOM order of 250 units on a CAP design, giving an accrued royalty of 843.75."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "NBL Guarantee", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 2000 }
              as: PlatformAdmin
              captures: { lic17_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${lic17_id}", team_code: "BOS", garment_sku: "CAP", design_name: "BOS Guarantee Cap" }
              as: DesignOps
              captures: { dsg17_id: $.data.id, dsg17_v: $.data.version }
            - call: "PUT /designs/${dsg17_id}/licensor-decision"
              payload: { decision: "APPROVE", expected_design_version: "${dsg17_v}" }
              as: LicensingOps
              as_user_id: "${lic17_id}"
            - call: "POST /production-orders"
              payload: { licensor_id: "${lic17_id}", design_id: "${dsg17_id}", team_code: "BOS", trigger_type: "STANDARD", expected_demand_qty: 5000, unit_cost_cents: 900 }
              as: ProductionPlanner
              captures: { po17_id: $.data.id, po17_v: $.data.version }
            - call: "POST /production-orders/${po17_id}/layers"
              payload: { expected_production_order_version: "${po17_v}", layers: [{ print_type: "BASE", quantity: 20 }] }
              as: ProductionPlanner
              captures: { po17_v2: $.data.version }
            - call: "POST /fulfillment-orders"
              payload: { production_order_id: "${po17_id}", channel: "ECOM", destination_code: "ECOM-BOS-9", quantity: 250 }
              as: FulfillmentCoordinator
              captures: { fo17_id: $.data.id }
            - call: "POST /fulfillment-orders/${fo17_id}/pick"
              payload: { expected_production_order_version: "${po17_v2}", quantity: 250, pick_remark: "pick-g17" }
              as: FulfillmentCoordinator
            - call: "POST /fulfillment-orders/${fo17_id}/ship"
              payload: { quantity: 250, carrier: "GROUND", sla_hours: 48 }
              as: FulfillmentCoordinator
            - call: "POST /fulfillment-orders/${fo17_id}/deliver"
              payload: {}
              as: FulfillmentCoordinator
            - call: "GET /licensors/${lic17_id}"
              payload: {}
              as: LicensingOps
              as_user_id: "${lic17_id}"
              captures: { lic17_v0: $.data.version, acc_before: $.data.accrued_royalty_cents, unsettled_before: $.data.accrued_unsettled_cents }
          trigger:
            - call: "POST /licensors/${lic17_id}/minimum-guarantee/apply"
              payload: { expected_licensor_version: "${lic17_v0}", reserved_cents: 100, accept_guarantee_breach: true }
              as: LicensingOps
              as_user_id: "${lic17_id}"
              captures: { ms17_id: $.data.id, ms17_shortfall: $.data.guarantee_shortfall_cents, lic17_v1: $.data.licensor_version }
            - call: "POST /licensors/${lic17_id}/minimum-guarantee/reverse"
              payload: { expected_licensor_version: "${lic17_v1}" }
              as: LicensingOps
              as_user_id: "${lic17_id}"
            - call: "GET /licensors/${lic17_id}"
              payload: {}
              as: LicensingOps
              as_user_id: "${lic17_id}"
              captures: { acc_after: $.data.accrued_royalty_cents, block_after: $.data.guarantee_recovery_block_cents, unsettled_after: $.data.accrued_unsettled_cents }
          assert:
            - "Licensor.${lic17_id}.accrued_royalty_cents was 843.75 before the settlement and is 843.75 again after the reversal"
            - "Licensor.${lic17_id}.guarantee_recovery_block_cents == 0 after the reversal"
            - "Licensor.${lic17_id}.accrued_unsettled_cents == 843.75 after the reversal"
            - "the settlement recorded guarantee_shortfall_cents == 1256.25"
            - "accrued_royalty_cents + guarantee_recovery_block_cents + accrued_unsettled_cents is identical before and after the apply-and-reverse pair"

      - name: unlacing_on_site_removes_second_party_liability
        grounds:
          - calculations.demand_collapse_write_down
          - state_machines.FulfillmentOrder.PLANNED_to_DISTRESSED
          - entities.FulfillmentOrder.fields.destroyed_qty
        distinguishing_aspect: "Distressing an order laces a destroyed-quantity liability of 36000 cents onto the consuming order, and returning those units unlaces it back to (destroyed 100, donated 0) with the run's write-down invariant holding at 160000 cents either way."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LIC18, TRACTOR design DSG18 APPROVED, STANDARD run PO18 committed with a BASE layer of 200, unit_cost_cents 900, and one VENUE_RETAIL order of 100 units, whose wholesale total drops to zero once the run's print layer is forced open by the retirement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "NBL Invariant", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 100000 }
              as: PlatformAdmin
              captures: { lic18_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${lic18_id}", team_code: "PHI", garment_sku: "TRACTOR", design_name: "PHI Invariant Tractor" }
              as: DesignOps
              captures: { dsg18_id: $.data.id, dsg18_v: $.data.version }
            - call: "PUT /designs/${dsg18_id}/licensor-decision"
              payload: { decision: "APPROVE", expected_design_version: "${dsg18_v}" }
              as: LicensingOps
              as_user_id: "${lic18_id}"
            - call: "POST /production-orders"
              payload: { licensor_id: "${lic18_id}", design_id: "${dsg18_id}", team_code: "PHI", trigger_type: "STANDARD", expected_demand_qty: 20000, unit_cost_cents: 900 }
              as: ProductionPlanner
              captures: { po18_id: $.data.id, po18_v: $.data.version }
            - call: "POST /production-orders/${po18_id}/layers"
              payload: { expected_production_order_version: "${po18_v}", layers: [{ print_type: "BASE", quantity: 200 }] }
              as: ProductionPlanner
              captures: { po18_v2: $.data.version, lay18_id: "$.data.layer_ids[0]" }
            - call: "POST /print-layers/${lay18_id}/print"
              payload: { printed_qty: 200 }
              as: PrintOperator
            - call: "POST /fulfillment-orders"
              payload: { production_order_id: "${po18_id}", channel: "VENUE_RETAIL", destination_code: "PHI_TEAMSTORE", quantity: 100 }
              as: FulfillmentCoordinator
              captures: { fo18_id: $.data.id }
          trigger:
            - call: "POST /production-orders/${po18_id}/retire"
              payload: { retire_reason: "DEMAND_COLLAPSE", destroy_mode: "DESTROY" }
              as: ProductionPlanner
            - call: "GET /production-orders/${po18_id}"
              payload: {}
              as: ProductionPlanner
              captures: { po18_write_down: $.data.write_down_inventory_cents, po18_committed_inventory: $.data.committed_inventory_cents }
            - call: "POST /fulfillment-orders/${fo18_id}/return"
              payload: { return_quantity: 0 }
              as: FulfillmentCoordinator
            - call: "GET /production-orders/${po18_id}"
              payload: {}
              as: ProductionPlanner
              captures: { po18_write_down_after: $.data.write_down_inventory_cents }
          assert:
            - "ProductionOrder.${po18_id}.status == RETIRED_DESTROYED"
            - "FulfillmentOrder.${fo18_id}.status == DISTRESSED and destroyed_qty == 100 and donated_qty == 0"
            - "ProductionOrder.${po18_id}.write_down_inventory_cents == 36000 after the retirement"
            - "ProductionOrder.${po18_id}.write_down_inventory_cents == 36000 again after the zero-quantity return, unchanged"
            - "FulfillmentOrder.${fo18_id}.donated_qty == 0 throughout the distress-and-unlace pair"
