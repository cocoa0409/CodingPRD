# =============================================================================
# Tax-Prep Storefront & Refund Advance — seed tables (Expert tier)
# =============================================================================

scenario: "Tax-Prep Storefront & Refund Advance (H&R Block/Jackson Hewitt style): appointment & document intake, preparer assignment & return prep, refund-transfer (bank product) & fee deduction, refund-anticipation advance loan, audit-protection add-on, e-file & ACK/reject handling, prior-year & amended (1040X), PTIN/EFIN compliance"

domain_name: tax-prep-refund-advance
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: hybrid
  # Office is a shallow parent (storefront scope); Client/TaxReturn/RefundTransfer/
  # RefundAdvance are flat peers cross-referenced by FK. AuditProtection/EfileSubmission/
  # FeeLine are children of TaxReturn. ComplianceCredential is a flat config table.
  state_machine_shape: branching
  # TaxReturn forks at e-file into ACK/REJECT branches (divergent side-effects), and
  # the REJECT branch loops back to PREPARED (cyclic correction loop). RefundAdvance and
  # RefundTransfer carry their own branching lifecycles.
  relationship_patterns:
    - one_to_many        # Office -> Client, TaxReturn -> FeeLine / EfileSubmission
    - cross_aggregate    # RefundTransfer references TaxReturn across aggregate boundary
    - self_referential   # TaxReturn.amends_return_id references another TaxReturn (1040X)
  role_model: peer_roles
  # FrontDeskAgent (intake/appointments), TaxPreparer (return prep, e-file), BankProductOfficer
  # (refund-transfer & advance underwriting/funding), OfficeManager (compliance, overrides).
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Office
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Storefront name" }
      - { name: efin, type: string, source: input, description: "6-digit IRS Electronic Filing Identification Number for this storefront" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state where the storefront operates" }
      - { name: efin_status, type: enum, source: system, description: "ACTIVE | SUSPENDED — gates all e-file submissions in this office", default: "ACTIVE", constraints: "ACTIVE | SUSPENDED" }
      - { name: bank_product_enabled, type: boolean, source: input, description: "Whether this office is approved to offer refund-transfer bank products and advances", default: false }
      - { name: open_return_count, type: integer, source: computed, description: "Count of TaxReturn rows in this office whose status NOT IN {EFILED_ACCEPTED, CANCELLED} — denormalized" }

  - name: ComplianceCredential
    parent: null
    common_fields: true
    fields:
      - { name: office_id, type: string, source: input, description: "FK -> Office.id; the storefront this credential is filed under" }
      - { name: ptin, type: string, source: input, description: "IRS Preparer Tax Identification Number, format P followed by 8 digits" }
      - { name: holder_name, type: string, source: input, description: "Legal name of the credentialed preparer" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVOKED — REVOKED set by /revoke; gates whether the linked preparer may sign/transmit (date-expiry is checked separately against expires_on)", default: "ACTIVE", constraints: "ACTIVE | REVOKED" }
      - { name: expires_on, type: datetime, source: input, description: "ISO 8601 UTC date after which the credential is no longer valid (the e-file precondition checks expires_on > clock independently of status)" }

  - name: Preparer
    parent: Office
    common_fields: true
    fields:
      - { name: office_id, type: string, source: system, description: "FK -> Office.id; parent storefront" }
      - { name: credential_id, type: string, source: input, description: "FK -> ComplianceCredential.id; the PTIN credential this preparer signs under" }
      - { name: full_name, type: string, source: input, description: "Preparer full name" }
      - { name: assigned_open_returns, type: integer, source: computed, description: "Count of TaxReturn rows assigned to this preparer whose status NOT IN {EFILED_ACCEPTED, CANCELLED} — denormalized capacity counter" }
      - { name: max_open_returns, type: integer, source: input, description: "Capacity ceiling on simultaneously open assigned returns", default: 25 }

  - name: Client
    parent: Office
    common_fields: true
    fields:
      - { name: office_id, type: string, source: system, description: "FK -> Office.id; storefront that intook this client" }
      - { name: full_name, type: string, source: input, description: "Taxpayer full name" }
      - { name: ssn_last4, type: string, source: input, description: "Last four digits of taxpayer SSN, used for duplicate detection within office and tax year" }
      - { name: risk_band, type: enum, source: input, description: "Underwriting risk band assigned at intake; gates refund-advance eligibility", default: "MEDIUM", constraints: "LOW | MEDIUM | HIGH" }
      - { name: is_returning, type: boolean, source: input, description: "True if the taxpayer filed with this office in a prior year; drives the returning-client prep discount", default: false }

  - name: Appointment
    parent: Office
    common_fields: true
    fields:
      - { name: office_id, type: string, source: system, description: "FK -> Office.id; storefront the appointment is booked at" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; taxpayer the appointment is for" }
      - { name: preparer_id, type: string, source: input, description: "FK -> Preparer.id; preparer who will meet the client" }
      - { name: start_utc, type: datetime, source: input, description: "ISO 8601 UTC appointment start (inclusive)" }
      - { name: end_utc, type: datetime, source: input, description: "ISO 8601 UTC appointment end (exclusive); must be strictly after start_utc" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CHECKED_IN | COMPLETED | NO_SHOW | CANCELLED", default: "SCHEDULED", constraints: "SCHEDULED | CHECKED_IN | COMPLETED | NO_SHOW | CANCELLED" }

  - name: TaxReturn
    parent: Office
    common_fields: true
    fields:
      - { name: office_id, type: string, source: system, description: "FK -> Office.id; storefront preparing the return" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; taxpayer the return belongs to" }
      - { name: preparer_id, type: string, source: input, description: "FK -> Preparer.id; assigned preparer, null until assignment" }
      - { name: amends_return_id, type: string, source: input, description: "FK -> TaxReturn.id; the originally accepted return this 1040X amends, null for an original return" }
      - { name: tax_year, type: integer, source: input, description: "Tax year being filed, e.g. 2025" }
      - { name: return_kind, type: enum, source: input, description: "ORIGINAL | PRIOR_YEAR | AMENDED_1040X", default: "ORIGINAL", constraints: "ORIGINAL | PRIOR_YEAR | AMENDED_1040X" }
      - { name: complexity_band, type: enum, source: input, description: "Drives the prep-fee multiplier", default: "SIMPLE", constraints: "SIMPLE | STANDARD | COMPLEX" }
      - { name: schedules, type: array, source: input, description: "Subset of {A,B,C,D,E,EIC} attached to the return; each adds a per-schedule fee line", default: [] }
      - { name: state_return_count, type: integer, source: input, description: "Number of state returns filed alongside the federal return", default: 0 }
      - { name: expected_refund_cents, type: integer, source: input, description: "Preparer-entered expected federal refund in cents; gates advance eligibility", default: 0 }
      - { name: prep_fee_cents, type: integer, source: computed, description: "Computed total preparation fee in cents (see prep_fee_total calculation)" }
      - { name: status, type: enum, source: system, description: "INTAKE | DOCS_PENDING | IN_PREP | PREPARED | EFILED_PENDING | EFILED_ACCEPTED | EFILED_REJECTED | CANCELLED", default: "INTAKE", constraints: "INTAKE | DOCS_PENDING | IN_PREP | PREPARED | EFILED_PENDING | EFILED_ACCEPTED | EFILED_REJECTED | CANCELLED" }
      - { name: reject_count, type: integer, source: computed, description: "Number of times this return has bounced back from EFILED_PENDING to EFILED_REJECTED", default: 0 }

  - name: DocumentIntake
    parent: TaxReturn
    common_fields: true
    fields:
      - { name: tax_return_id, type: string, source: system, description: "FK -> TaxReturn.id; the return this document belongs to" }
      - { name: doc_type, type: enum, source: input, description: "W2 | 1099 | ID | PRIOR_RETURN | OTHER", constraints: "W2 | 1099 | ID | PRIOR_RETURN | OTHER" }
      - { name: is_required, type: boolean, source: input, description: "Whether this document is mandatory before prep can begin", default: true }
      - { name: status, type: enum, source: system, description: "PENDING | RECEIVED | WAIVED", default: "PENDING", constraints: "PENDING | RECEIVED | WAIVED" }

  - name: FeeLine
    parent: TaxReturn
    common_fields: true
    fields:
      - { name: tax_return_id, type: string, source: system, description: "FK -> TaxReturn.id; the return this fee line itemizes" }
      - { name: line_kind, type: enum, source: system, description: "BASE_1040 | SCHEDULE | STATE_RETURN | DISCOUNT", constraints: "BASE_1040 | SCHEDULE | STATE_RETURN | DISCOUNT" }
      - { name: label, type: string, source: system, description: "Human-readable label, e.g. 'Schedule C' or 'Returning-client discount'" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount in cents; DISCOUNT lines are negative" }

  - name: AuditProtection
    parent: TaxReturn
    common_fields: true
    fields:
      - { name: tax_return_id, type: string, source: input, description: "FK -> TaxReturn.id; the return this add-on protects" }
      - { name: fee_cents, type: integer, source: input, description: "One-time audit-protection fee in cents", default: 5900 }
      - { name: status, type: enum, source: system, description: "ACTIVE | CANCELLED | VOIDED — VOIDED is set automatically when the return is cancelled", default: "ACTIVE", constraints: "ACTIVE | CANCELLED | VOIDED" }

  - name: EfileSubmission
    parent: TaxReturn
    common_fields: true
    fields:
      - { name: tax_return_id, type: string, source: system, description: "FK -> TaxReturn.id; the return that was transmitted" }
      - { name: efin_used, type: string, source: system, description: "EFIN copied from the Office at transmission time" }
      - { name: ptin_used, type: string, source: system, description: "PTIN copied from the assigned preparer's credential at transmission time" }
      - { name: ack_status, type: enum, source: system, description: "TRANSMITTED | ACCEPTED | REJECTED", default: "TRANSMITTED", constraints: "TRANSMITTED | ACCEPTED | REJECTED" }
      - { name: reject_code, type: string, source: input, description: "IRS reject code supplied when the ACK is a rejection, null otherwise" }

  - name: RefundTransfer
    parent: null
    common_fields: true
    fields:
      - { name: tax_return_id, type: string, source: input, description: "FK -> TaxReturn.id; the accepted return whose refund routes through this bank product" }
      - { name: bank_product_fee_cents, type: integer, source: system, description: "Bank refund-transfer product fee in cents", default: 3995 }
      - { name: estimated_refund_cents, type: integer, source: input, description: "Pre-funding expected refund figure, revisable via /adjust before disbursement", default: 0 }
      - { name: disbursed_refund_cents, type: integer, source: input, description: "Actual federal refund amount in cents received from IRS for disbursement" }
      - { name: net_to_taxpayer_cents, type: integer, source: computed, description: "Refund remaining after the fee-deduction waterfall (see refund_disbursement_waterfall)" }
      - { name: fee_shortfall_cents, type: integer, source: computed, description: "Amount of total fees that the disbursed refund could not cover (0 when refund fully covers fees)" }
      - { name: status, type: enum, source: system, description: "PENDING_FUNDING | DISBURSED | CANCELLED", default: "PENDING_FUNDING", constraints: "PENDING_FUNDING | DISBURSED | CANCELLED" }

  - name: RefundAdvance
    parent: null
    common_fields: true
    fields:
      - { name: tax_return_id, type: string, source: input, description: "FK -> TaxReturn.id; the return whose expected refund backs this advance loan" }
      - { name: requested_cents, type: integer, source: input, description: "Advance amount the taxpayer requested in cents" }
      - { name: approved_cents, type: integer, source: computed, description: "Approved principal in cents, capped by max-eligible underwriting (see advance_max_eligible)" }
      - { name: repaid_cents, type: integer, source: computed, description: "Principal repaid from the refund waterfall, set when the linked RefundTransfer disburses", default: 0 }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DISBURSED | REPAID | DENIED | CANCELLED", default: "REQUESTED", constraints: "REQUESTED | APPROVED | DISBURSED | REPAID | DENIED | CANCELLED" }

  - name: ComplianceClock
    parent: null
    common_fields: false   # id, created_at only — singleton config row
    fields:
      - { name: current_utc, type: datetime, source: system, description: "Logical server clock; defaults to 2026-05-01T00:00:00Z until set via /_clock/set_current_utc" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Appointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /appointments/{id}/transition (to=CHECKED_IN)"
        actor: FrontDeskAgent
        preconditions:
          - "ComplianceClock.current_utc >= Appointment.start_utc (cannot check in before the window opens) (ERR_APPOINTMENT_WINDOW_NOT_OPEN)"
        side_effects: []
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /appointments/{id}/transition (to=COMPLETED)"
        actor: FrontDeskAgent
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /appointments/{id}/transition (to=NO_SHOW)"
        actor: FrontDeskAgent
        preconditions:
          - "ComplianceClock.current_utc >= Appointment.end_utc (window must be fully past before no-show may be recorded) (ERR_APPOINTMENT_WINDOW_NOT_OPEN)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /appointments/{id}/transition (to=CANCELLED)"
        actor: FrontDeskAgent
        preconditions: []
        side_effects: []

  - entity: TaxReturn
    initial_state: INTAKE
    terminal_states: [EFILED_ACCEPTED, CANCELLED]
    transitions:
      - from: INTAKE
        to: DOCS_PENDING
        trigger: "POST /returns/{id}/transition (to=DOCS_PENDING)"
        actor: FrontDeskAgent
        preconditions:
          - "At least one DocumentIntake row exists for the return (ERR_NO_DOCUMENTS)"
        side_effects: []
      - from: DOCS_PENDING
        to: IN_PREP
        trigger: "POST /returns/{id}/transition (to=IN_PREP)"
        actor: TaxPreparer
        preconditions:
          - "TaxReturn.preparer_id is not null (ERR_PREPARER_NOT_ASSIGNED)"
          - "Every DocumentIntake with is_required=true has status IN {RECEIVED, WAIVED} (ERR_REQUIRED_DOCS_MISSING)"
          - "Assigned preparer's ComplianceCredential.status == ACTIVE (ERR_CREDENTIAL_INVALID)"
        side_effects:
          - "Recompute prep_fee_total → write TaxReturn.prep_fee_cents and (re)generate FeeLine rows (BASE_1040, one SCHEDULE per schedule, one STATE_RETURN per state return, one DISCOUNT line if client.is_returning)"
      - from: IN_PREP
        to: PREPARED
        trigger: "POST /returns/{id}/transition (to=PREPARED)"
        actor: TaxPreparer
        preconditions:
          - "TaxReturn.expected_refund_cents >= 0 (ERR_INVALID_REFUND_FIGURE)"
        side_effects: []
      - from: PREPARED
        to: EFILED_PENDING
        trigger: "POST /returns/{id}/efile"
        actor: TaxPreparer
        preconditions:
          - "Office.efin_status == ACTIVE (ERR_EFIN_SUSPENDED)"
          - "Assigned preparer's ComplianceCredential.status == ACTIVE AND expires_on > ComplianceClock.current_utc (ERR_CREDENTIAL_INVALID)"
          - "If return_kind == AMENDED_1040X then amends_return_id references a TaxReturn in EFILED_ACCEPTED (ERR_AMEND_TARGET_NOT_ACCEPTED)"
        side_effects:
          - "Create one EfileSubmission with ack_status=TRANSMITTED, efin_used=Office.efin, ptin_used=credential.ptin"
      - from: EFILED_PENDING
        to: EFILED_ACCEPTED
        trigger: "POST /returns/{id}/efile-ack (ack_status=ACCEPTED)"
        actor: TaxPreparer
        preconditions: []
        side_effects:
          - "Latest TRANSMITTED EfileSubmission.ack_status → ACCEPTED"
          - "Office.open_return_count decremented by 1; Preparer.assigned_open_returns decremented by 1"
      - from: EFILED_PENDING
        to: EFILED_REJECTED
        trigger: "POST /returns/{id}/efile-ack (ack_status=REJECTED)"
        actor: TaxPreparer
        preconditions:
          - "reject_code is provided in the request (ERR_REJECT_CODE_REQUIRED)"
        side_effects:
          - "Latest TRANSMITTED EfileSubmission.ack_status → REJECTED; reject_code stored on it"
          - "TaxReturn.reject_count incremented by 1"
      - from: EFILED_REJECTED
        to: PREPARED
        trigger: "POST /returns/{id}/transition (to=PREPARED)"
        actor: TaxPreparer
        preconditions:
          - "TaxReturn.reject_count <= 3 (after the 3rd reject the return is locked) (ERR_REJECT_LIMIT_REACHED)"
        side_effects: []
        note: "Correction loop — fix and re-transmit. EFILED_REJECTED → PREPARED → EFILED_PENDING is the cycle."
      - from: INTAKE
        to: CANCELLED
        trigger: "POST /returns/{id}/transition (to=CANCELLED)"
        actor: TaxPreparer
        preconditions: []
        side_effects:
          - "Office.open_return_count recomputed (this return leaves the count → -1); Preparer.assigned_open_returns recomputed (-1 if a preparer was assigned)"
          - "Cascade: every AuditProtection with status=ACTIVE on this return → VOIDED"
          - "Cascade: any RefundAdvance on this return with status IN {REQUESTED, APPROVED} → CANCELLED; that cancellation in turn sets the linked RefundTransfer (if status=PENDING_FUNDING) → CANCELLED"
      - from: DOCS_PENDING
        to: CANCELLED
        trigger: "POST /returns/{id}/transition (to=CANCELLED)"
        actor: TaxPreparer
        preconditions: []
        side_effects:
          - "Same cascade and counter recompute as INTAKE → CANCELLED (open_return_count -1; assigned_open_returns -1 if a preparer was assigned)"
      - from: IN_PREP
        to: CANCELLED
        trigger: "POST /returns/{id}/transition (to=CANCELLED)"
        actor: TaxPreparer
        preconditions: []
        side_effects:
          - "Same cascade and counter recompute as INTAKE → CANCELLED"
      - from: PREPARED
        to: CANCELLED
        trigger: "POST /returns/{id}/transition (to=CANCELLED)"
        actor: TaxPreparer
        preconditions: []
        side_effects:
          - "Same cascade and counter recompute as INTAKE → CANCELLED"

  - entity: RefundAdvance
    initial_state: REQUESTED
    terminal_states: [REPAID, DENIED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /refund-advances/{id}/underwrite (decision=APPROVE)"
        actor: BankProductOfficer
        preconditions:
          - "Office of the linked TaxReturn has bank_product_enabled == true (ERR_BANK_PRODUCT_DISABLED)"
          - "advance_max_eligible(return.expected_refund_cents, client.risk_band) > 0 (ERR_ADVANCE_INELIGIBLE)"
        side_effects:
          - "approved_cents = min(requested_cents, advance_max_eligible(expected_refund_cents, risk_band))"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /refund-advances/{id}/underwrite (decision=DENY)"
        actor: BankProductOfficer
        preconditions: []
        side_effects:
          - "approved_cents = 0"
      - from: APPROVED
        to: DISBURSED
        trigger: "POST /refund-advances/{id}/disburse"
        actor: BankProductOfficer
        preconditions:
          - "Linked TaxReturn.status == EFILED_ACCEPTED (ERR_RETURN_NOT_ACCEPTED)"
          - "A RefundTransfer in status=PENDING_FUNDING exists for the same TaxReturn (ERR_NO_REFUND_TRANSFER)"
        side_effects: []
      - from: DISBURSED
        to: REPAID
        trigger: "System event when the linked RefundTransfer transitions PENDING_FUNDING → DISBURSED"
        actor: system
        preconditions: []
        side_effects:
          - "repaid_cents = waterfall allocation to the advance_repay bucket"
        note: "Bubble: RefundTransfer disbursement drives this advance to REPAID."

  - entity: RefundTransfer
    initial_state: PENDING_FUNDING
    terminal_states: [DISBURSED, CANCELLED]
    transitions:
      - from: PENDING_FUNDING
        to: DISBURSED
        trigger: "POST /refund-transfers/{id}/disburse"
        actor: BankProductOfficer
        preconditions:
          - "Linked TaxReturn.status == EFILED_ACCEPTED (ERR_RETURN_NOT_ACCEPTED)"
          - "disbursed_refund_cents > 0 supplied in the request (ERR_INVALID_REFUND_FIGURE)"
          - "expected_<refundtransfer>_version matches current RefundTransfer.version (ERR_STALE_VERSION)"
        side_effects:
          - "Run refund_disbursement_waterfall → write net_to_taxpayer_cents and fee_shortfall_cents"
          - "Cascade: if a RefundAdvance in status=DISBURSED is linked to the same TaxReturn, its repaid_cents := advance_repay bucket and that advance → REPAID"
      - from: PENDING_FUNDING
        to: PENDING_FUNDING
        trigger: "POST /refund-transfers/{id}/adjust"
        actor: BankProductOfficer
        preconditions:
          - "estimated_refund_cents > 0 supplied in the request (ERR_INVALID_REFUND_FIGURE)"
        side_effects:
          - "RefundTransfer.estimated_refund_cents re-stamped to the supplied figure (the bank revises the expected pre-funding amount)"
          - "increments RefundTransfer.version by 1 — a later disburse carrying the pre-adjust version is therefore stale"
        note: "Self-loop revision of the pending refund figure; the entity stays PENDING_FUNDING but its version advances, enabling the OCC supersede guard on disburse."
      - from: PENDING_FUNDING
        to: CANCELLED
        trigger: "POST /refund-transfers/{id}/cancel"
        actor: BankProductOfficer
        preconditions:
          - "No linked RefundAdvance is in status=DISBURSED (ERR_ADVANCE_ALREADY_DISBURSED)"
        side_effects: []

  - entity: AuditProtection
    initial_state: ACTIVE
    terminal_states: [CANCELLED, VOIDED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /audit-protections/{id}/cancel"
        actor: BankProductOfficer
        preconditions:
          - "Linked TaxReturn.status != EFILED_ACCEPTED (cannot cancel protection once the return is accepted) (ERR_RETURN_ALREADY_ACCEPTED)"
        side_effects: []
      - from: ACTIVE
        to: VOIDED
        trigger: "System event when the linked TaxReturn is CANCELLED"
        actor: system
        preconditions: []
        side_effects: []

# -----------------------------------------------------------------------------
# Concurrency Rules (§1.2.1)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: rt-disburse-stale-transfer
    parent_entity: RefundTransfer
    write_endpoint: "POST /refund-transfers/{id}/disburse"
    occ_field: "expected_refundtransfer_version"
    description: |
      Disbursing a RefundTransfer whose version has advanced since the client
      last observed it is rejected. The transfer stays PENDING_FUNDING across a
      /adjust revision, so a disburse that still carries the pre-adjust version
      observes an identical PENDING_FUNDING state — state preconditions all pass —
      yet the version it presents is stale because another writer has revised the
      pending figure via /adjust (a legitimate supersede that re-stamps
      estimated_refund_cents and bumps version). The disburse permanently runs the
      fee-deduction waterfall, so it must be computed against the version the
      client actually observed; the stale presenter is rejected with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: prep_fee_total
    trigger: "TaxReturn DOCS_PENDING → IN_PREP transition (and recomputed there); written to TaxReturn.prep_fee_cents and materialized as FeeLine rows"
    algorithm: tiered_pricing
    formula: |
      # All amounts in integer cents. Evaluation order is PINNED as written.
      mult        = BAND_MULT[complexity_band]               # SIMPLE 1.00, STANDARD 1.20, COMPLEX 1.50
      base_line   = round_half_up(BASE_1040_CENTS * mult)    # one BASE_1040 FeeLine
      sched_lines = [ round_half_up(SCHEDULE_FEE[s] * mult) for s in schedules ]   # one SCHEDULE FeeLine each
      state_lines = [ round_half_up(STATE_RETURN_CENTS * mult) for _ in range(state_return_count) ]
      subtotal    = base_line + sum(sched_lines) + sum(state_lines)
      # Returning-client discount: min(cap, pct of subtotal), floored at 0, only when client.is_returning.
      discount    = min(DISCOUNT_CAP_CENTS, round_half_up(subtotal * DISCOUNT_PCT)) if client.is_returning else 0
      prep_fee_cents = max(0, subtotal - discount)           # a single negative DISCOUNT FeeLine carries -discount
    input_set: "Schedules and state_return_count are taken from the TaxReturn row at transition time; is_returning is read from the linked Client."
    constants:
      BASE_1040_CENTS: 15000
      SCHEDULE_FEE: { A: 4000, B: 2500, C: 9000, D: 6000, E: 7500, EIC: 5000 }
      STATE_RETURN_CENTS: 6000
      BAND_MULT: { SIMPLE: 1.00, STANDARD: 1.20, COMPLEX: 1.50 }
      DISCOUNT_PCT: 0.10
      DISCOUNT_CAP_CENTS: 2500
    precision: "Each line rounded to whole cents, round_half_up, BEFORE summing (round-per-line, not sum-then-round); discount rounded after subtotal."
    variants:
      - name: new_client
        when: "Client.is_returning == false"
        difference: "No DISCOUNT line; prep_fee_cents == subtotal."
      - name: returning_client
        when: "Client.is_returning == true"
        difference: "A negative DISCOUNT FeeLine of -min(DISCOUNT_CAP_CENTS, round_half_up(subtotal*0.10)) is added; prep_fee_cents reduced accordingly."

  - name: advance_max_eligible
    trigger: "RefundAdvance REQUESTED → APPROVED underwrite decision"
    algorithm: threshold
    formula: |
      # Nested min over a refund-size tier cap and a risk-band fraction of the expected refund.
      tier_cap =  0       if expected_refund_cents < 100000          # < $1,000 → no advance
                  50000   if 100000 <= expected_refund_cents < 300000
                  150000  if 300000 <= expected_refund_cents < 600000
                  350000  if expected_refund_cents >= 600000
      fraction = RISK_FRACTION[risk_band]                            # LOW 0.75, MEDIUM 0.50, HIGH 0.00
      max_eligible = min( tier_cap, round_half_up(expected_refund_cents * fraction) )
      approved_cents = min( requested_cents, max_eligible )          # on APPROVE
    input_set: "expected_refund_cents from the linked TaxReturn; risk_band from the linked Client."
    constants:
      RISK_FRACTION: { LOW: 0.75, MEDIUM: 0.50, HIGH: 0.00 }
      TIER_BREAKS_CENTS: [100000, 300000, 600000]
      TIER_CAPS_CENTS: [0, 50000, 150000, 350000]
    precision: "Whole cents, round_half_up on the fraction product. Tier boundaries use >= (300000 lands in the 150000 cap tier)."
    variants:
      - name: low_risk
        when: "Client.risk_band == LOW"
        difference: "fraction 0.75 — fraction product rarely binds; tier_cap usually dominates."
      - name: high_risk
        when: "Client.risk_band == HIGH"
        difference: "fraction 0.00 → max_eligible 0 → ERR_ADVANCE_INELIGIBLE regardless of refund size."

  - name: refund_disbursement_waterfall
    trigger: "RefundTransfer PENDING_FUNDING → DISBURSED"
    algorithm: waterfall_allocation
    formula: |
      # Distribute the disbursed federal refund across ordered fee buckets. Order is PINNED.
      remaining = disbursed_refund_cents
      buckets in this exact order:
        1. bank_product_fee  = RefundTransfer.bank_product_fee_cents
        2. prep_fee          = linked TaxReturn.prep_fee_cents
        3. audit_fee         = sum(AuditProtection.fee_cents WHERE status == ACTIVE on the return)   # 0 if none ACTIVE
        4. advance_repay     = linked RefundAdvance.approved_cents WHERE status == DISBURSED          # 0 if no disbursed advance
      for (name, amount) in buckets:        # fill in order; each takes min(remaining, amount)
        take       = min(remaining, amount)
        remaining -= take
      net_to_taxpayer_cents = remaining
      total_fees    = bank_product_fee + prep_fee + audit_fee + advance_repay
      fee_shortfall_cents = max(0, total_fees - disbursed_refund_cents)
      # Side-effect: advance_repay take becomes RefundAdvance.repaid_cents; advance → REPAID.
    input_set: "bank_product_fee_cents from the RefundTransfer; prep_fee_cents from the linked TaxReturn (already finalized at IN_PREP); audit_fee summed over AuditProtection rows with status==ACTIVE; advance_repay from the linked RefundAdvance with status==DISBURSED."
    constants: {}
    precision: "Whole cents; no rounding needed (all inputs are integer cents). net floored at 0 by construction; shortfall = excess fees."
    variants:
      - name: refund_covers_all
        when: "disbursed_refund_cents >= total_fees"
        difference: "Every bucket filled fully; net_to_taxpayer_cents > 0; fee_shortfall_cents == 0."
      - name: refund_short
        when: "disbursed_refund_cents < total_fees"
        difference: "Lower-priority buckets partially or not filled; net_to_taxpayer_cents == 0; fee_shortfall_cents > 0."

  - name: disbursement_surcharge
    trigger: "RefundTransfer PENDING_FUNDING → DISBURSED (informational ledger surcharge stamped alongside the waterfall)"
    algorithm: aggregation
    formula: |
      # A 2.9% electronic-disbursement surcharge is computed on EACH fee bucket that the
      # waterfall actually funded (take > 0), rounded per bucket THEN summed.
      # Pinned order: round-per-bucket then sum (NOT sum-then-round).
      surcharge_cents = sum( round_half_up(take_b * SURCHARGE_PCT) for b in funded_buckets )
      # This value is reported in the disburse response; it does NOT reduce net_to_taxpayer_cents.
    input_set: "Per-bucket take amounts produced by refund_disbursement_waterfall for buckets with take > 0."
    constants:
      SURCHARGE_PCT: 0.029
    precision: "round_half_up to whole cents per bucket BEFORE summing. Round-per-bucket-then-sum is PINNED and can diverge from sum-then-round by one cent."

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for the endpoint per the RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path and FK-referenced resources exist (validated left-to-right in the path, then body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body is well-formed: required fields present, enums in range, end_utc strictly after start_utc, ssn_last4 four digits, ptin matches P\\d{8}, efin six digits"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create/transition endpoints"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition/efile/efile-ack/underwrite/disburse/cancel endpoints"

  - priority: 6
    category: business_referential
    check: "OCC: expected_refundtransfer_version equals the RefundTransfer's current version on disburse"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /refund-transfers/{id}/disburse"

  - priority: 7
    category: business_safety
    check: "EFIN is ACTIVE for the office before any e-file transmission"
    error_id: ERR_EFIN_SUSPENDED
    http_status: 409
    applies_to: "POST /returns/{id}/efile"

  - priority: 8
    category: business_safety
    check: "Assigned preparer's ComplianceCredential is ACTIVE and (for e-file) not expired against the logical clock"
    error_id: ERR_CREDENTIAL_INVALID
    http_status: 409
    applies_to: "POST /returns/{id}/transition (to=IN_PREP), POST /returns/{id}/efile"

  - priority: 9
    category: business_referential
    check: "AMENDED_1040X return may only e-file when its amends_return_id target is in EFILED_ACCEPTED"
    error_id: ERR_AMEND_TARGET_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /returns/{id}/efile"

  - priority: 10
    category: business_temporal
    check: "Appointment start/end must not overlap an existing non-terminal Appointment for the same preparer; adjacency (end == next start) is allowed (half-open [start,end))"
    error_id: ERR_PREPARER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /offices/{id}/appointments"

  - priority: 11
    category: business_temporal
    check: "Appointment start/end must not overlap an existing non-terminal Appointment for the same client INCLUDING a shared boundary (end == next start collides); client intervals are treated closed [start,end] with a zero-gap buffer"
    error_id: ERR_CLIENT_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /offices/{id}/appointments"

  - priority: 12
    category: business_constraint
    check: "Duplicate-taxpayer guard: no two TaxReturn rows in the same office with the same client_id and tax_year and return_kind != AMENDED_1040X, unless an AMENDED_1040X (which is expected to share client+year)"
    error_id: ERR_DUPLICATE_RETURN
    http_status: 409
    applies_to: "POST /returns"

  - priority: 13
    category: business_constraint
    check: "Assigning a return to a preparer whose assigned_open_returns would exceed max_open_returns is rejected"
    error_id: ERR_PREPARER_AT_CAPACITY
    http_status: 409
    applies_to: "POST /returns/{id}/assign"

  - priority: 14
    category: business_fiscal
    check: "Refund-advance requested_cents must be > 0 and advance_max_eligible must be > 0 for the linked client/return"
    error_id: ERR_ADVANCE_INELIGIBLE
    http_status: 409
    applies_to: "POST /refund-advances/{id}/underwrite"

  - priority: 15
    category: business_fiscal
    check: "Bank products (RefundTransfer, RefundAdvance) require the office's bank_product_enabled == true"
    error_id: ERR_BANK_PRODUCT_DISABLED
    http_status: 409
    applies_to: "POST /refund-transfers, POST /refund-advances, POST /refund-advances/{id}/underwrite"

# =============================================================================
# Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Office ----
  - method: POST
    path: "/offices"
    description: "Create a storefront"
    roles: [OfficeManager]
    code: 201
    input: [name, efin, state_code, "bank_product_enabled?"]
    output: Office
    side_effects: ["efin_status=ACTIVE, open_return_count=0"]

  - method: GET
    path: "/offices/{id}"
    description: "Get an office"
    roles: [OfficeManager, FrontDeskAgent, TaxPreparer, BankProductOfficer]
    code: 200
    input: []
    output: Office

  - method: POST
    path: "/offices/{id}/efin-status"
    description: "Suspend or reinstate the office EFIN (compliance action)"
    roles: [OfficeManager]
    code: 200
    input: [efin_status]
    output: Office
    side_effects: ["Office.efin_status set; gates future e-file transmissions"]

  # ---- ComplianceCredential ----
  - method: POST
    path: "/credentials"
    description: "File a PTIN credential under an office"
    roles: [OfficeManager]
    code: 201
    input: [office_id, ptin, holder_name, expires_on]
    output: ComplianceCredential
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/credentials/{id}"
    description: "Get a credential"
    roles: [OfficeManager, TaxPreparer]
    code: 200
    input: []
    output: ComplianceCredential

  - method: GET
    path: "/credentials"
    description: "List credentials, optionally filtered by office"
    roles: [OfficeManager, TaxPreparer]
    code: 200
    input: ["office_id?", "limit?", "offset?"]
    output: ComplianceCredential[]

  - method: POST
    path: "/credentials/{id}/revoke"
    description: "Revoke a credential (compliance)"
    roles: [OfficeManager]
    code: 200
    input: []
    output: ComplianceCredential
    side_effects: ["status=REVOKED"]

  # ---- Preparer ----
  - method: POST
    path: "/offices/{id}/preparers"
    description: "Add a preparer to an office"
    roles: [OfficeManager]
    code: 201
    input: [credential_id, full_name, "max_open_returns?"]
    output: Preparer
    side_effects: ["assigned_open_returns=0"]

  - method: GET
    path: "/offices/{id}/preparers"
    description: "List preparers in an office (reverse-reachability for Preparer.office_id)"
    roles: [OfficeManager, FrontDeskAgent, TaxPreparer]
    code: 200
    input: ["limit?", "offset?"]
    output: Preparer[]

  - method: GET
    path: "/preparers/{id}"
    description: "Get a preparer"
    roles: [OfficeManager, FrontDeskAgent, TaxPreparer, BankProductOfficer]
    code: 200
    input: []
    output: Preparer

  - method: GET
    path: "/preparers"
    description: "List preparers, optionally filtered by credential_id (reverse-reachability for Preparer.credential_id)"
    roles: [OfficeManager, TaxPreparer]
    code: 200
    input: ["credential_id?", "limit?", "offset?"]
    output: Preparer[]

  # ---- Client ----
  - method: POST
    path: "/offices/{id}/clients"
    description: "Intake a taxpayer"
    roles: [FrontDeskAgent, OfficeManager]
    code: 201
    input: [full_name, ssn_last4, "risk_band?", "is_returning?"]
    output: Client

  - method: GET
    path: "/offices/{id}/clients"
    description: "List clients in an office (reverse-reachability for Client.office_id)"
    roles: [FrontDeskAgent, OfficeManager, TaxPreparer]
    code: 200
    input: ["limit?", "offset?"]
    output: Client[]

  - method: GET
    path: "/clients/{id}"
    description: "Get a client"
    roles: [FrontDeskAgent, OfficeManager, TaxPreparer, BankProductOfficer]
    code: 200
    input: []
    output: Client

  # ---- Appointment ----
  - method: POST
    path: "/offices/{id}/appointments"
    description: "Book an appointment (overlap-checked per preparer and per client)"
    roles: [FrontDeskAgent, OfficeManager]
    code: 201
    input: [client_id, preparer_id, start_utc, end_utc]
    output: Appointment
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/offices/{id}/appointments"
    description: "List appointments in an office (reverse-reachability for Appointment.office_id)"
    roles: [FrontDeskAgent, OfficeManager, TaxPreparer]
    code: 200
    input: ["limit?", "offset?"]
    output: Appointment[]

  - method: GET
    path: "/appointments"
    description: "List appointments, filterable by office_id / client_id / preparer_id (reverse-reachability for Appointment.client_id and Appointment.preparer_id)"
    roles: [FrontDeskAgent, OfficeManager, TaxPreparer]
    code: 200
    input: ["office_id?", "client_id?", "preparer_id?", "limit?", "offset?"]
    output: Appointment[]

  - method: GET
    path: "/appointments/{id}"
    description: "Get an appointment"
    roles: [FrontDeskAgent, OfficeManager, TaxPreparer]
    code: 200
    input: []
    output: Appointment

  - method: POST
    path: "/appointments/{id}/transition"
    description: "Advance an appointment (CHECKED_IN/COMPLETED/NO_SHOW/CANCELLED)"
    roles: [FrontDeskAgent, OfficeManager]
    code: 200
    input: [to]
    output: Appointment
    side_effects: ["State transition per Appointment state machine"]

  # ---- TaxReturn ----
  - method: POST
    path: "/returns"
    description: "Open a tax return for a client"
    roles: [FrontDeskAgent, OfficeManager, TaxPreparer]
    code: 201
    input: [office_id, client_id, tax_year, "return_kind?", "complexity_band?", "schedules?", "state_return_count?", "expected_refund_cents?", "amends_return_id?"]
    output: TaxReturn
    side_effects: ["status=INTAKE; Office.open_return_count incremented by 1"]

  - method: GET
    path: "/returns/{id}"
    description: "Get a tax return"
    roles: [FrontDeskAgent, OfficeManager, TaxPreparer, BankProductOfficer]
    code: 200
    input: []
    output: TaxReturn

  - method: GET
    path: "/returns"
    description: "List returns, filterable by office_id / client_id / preparer_id / amends_return_id (reverse-reachability for all four FKs)"
    roles: [FrontDeskAgent, OfficeManager, TaxPreparer, BankProductOfficer]
    code: 200
    input: ["office_id?", "client_id?", "preparer_id?", "amends_return_id?", "limit?", "offset?"]
    output: TaxReturn[]

  - method: POST
    path: "/returns/{id}/assign"
    description: "Assign a preparer to a return (capacity-checked)"
    roles: [OfficeManager, TaxPreparer]
    code: 200
    input: [preparer_id]
    output: TaxReturn
    side_effects: ["TaxReturn.preparer_id set; assigned Preparer.assigned_open_returns incremented by 1"]

  - method: POST
    path: "/returns/{id}/transition"
    description: "Advance a return through its lifecycle (non-efile transitions, including cancellation and the EFILED_REJECTED→PREPARED correction loop)"
    roles: [FrontDeskAgent, OfficeManager, TaxPreparer]
    code: 200
    input: [to]
    output: TaxReturn
    side_effects: ["State transition per TaxReturn state machine, including prep-fee computation on IN_PREP and cancellation cascades"]

  - method: POST
    path: "/returns/{id}/efile"
    description: "Transmit the return for e-file (PREPARED → EFILED_PENDING)"
    roles: [TaxPreparer]
    code: 200
    input: []
    output: TaxReturn
    side_effects: ["Create EfileSubmission TRANSMITTED with efin_used/ptin_used snapshot"]

  - method: POST
    path: "/returns/{id}/efile-ack"
    description: "Record the IRS ACK for the open transmission (ACCEPTED or REJECTED)"
    roles: [TaxPreparer]
    code: 200
    input: [ack_status, "reject_code?"]
    output: TaxReturn
    side_effects: ["Latest EfileSubmission ack_status set; ACCEPTED decrements open/assigned counters; REJECTED increments reject_count"]

  # ---- DocumentIntake ----
  - method: POST
    path: "/returns/{id}/documents"
    description: "Add a document to the return's intake checklist"
    roles: [FrontDeskAgent, OfficeManager, TaxPreparer]
    code: 201
    input: [doc_type, "is_required?"]
    output: DocumentIntake
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/returns/{id}/documents"
    description: "List a return's documents (reverse-reachability for DocumentIntake.tax_return_id)"
    roles: [FrontDeskAgent, OfficeManager, TaxPreparer]
    code: 200
    input: ["limit?", "offset?"]
    output: DocumentIntake[]

  - method: POST
    path: "/documents/{id}/status"
    description: "Mark a document RECEIVED or WAIVED"
    roles: [FrontDeskAgent, OfficeManager, TaxPreparer]
    code: 200
    input: [status]
    output: DocumentIntake
    side_effects: ["DocumentIntake.status set"]

  # ---- FeeLine ----
  - method: GET
    path: "/returns/{id}/fee-lines"
    description: "List the itemized fee lines for a return (reverse-reachability for FeeLine.tax_return_id)"
    roles: [FrontDeskAgent, OfficeManager, TaxPreparer, BankProductOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: FeeLine[]

  # ---- AuditProtection ----
  - method: POST
    path: "/audit-protections"
    description: "Add the audit-protection add-on to a return"
    roles: [BankProductOfficer, OfficeManager]
    code: 201
    input: [tax_return_id, "fee_cents?"]
    output: AuditProtection
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/audit-protections/{id}"
    description: "Get an audit-protection add-on"
    roles: [BankProductOfficer, OfficeManager, TaxPreparer]
    code: 200
    input: []
    output: AuditProtection

  - method: GET
    path: "/audit-protections"
    description: "List audit-protection add-ons, filterable by tax_return_id (reverse-reachability for AuditProtection.tax_return_id)"
    roles: [BankProductOfficer, OfficeManager, TaxPreparer]
    code: 200
    input: ["tax_return_id?", "limit?", "offset?"]
    output: AuditProtection[]

  - method: POST
    path: "/audit-protections/{id}/cancel"
    description: "Cancel an active audit-protection add-on"
    roles: [BankProductOfficer, OfficeManager]
    code: 200
    input: []
    output: AuditProtection
    side_effects: ["status=CANCELLED"]

  # ---- EfileSubmission ----
  - method: GET
    path: "/returns/{id}/efile-submissions"
    description: "List the transmission/ACK history for a return (reverse-reachability for EfileSubmission.tax_return_id)"
    roles: [TaxPreparer, OfficeManager]
    code: 200
    input: ["limit?", "offset?"]
    output: EfileSubmission[]

  # ---- RefundTransfer ----
  - method: POST
    path: "/refund-transfers"
    description: "Open a refund-transfer bank product for a return"
    roles: [BankProductOfficer, OfficeManager]
    code: 201
    input: [tax_return_id]
    output: RefundTransfer
    side_effects: ["status=PENDING_FUNDING, bank_product_fee_cents=3995"]

  - method: GET
    path: "/refund-transfers/{id}"
    description: "Get a refund-transfer"
    roles: [BankProductOfficer, OfficeManager, TaxPreparer]
    code: 200
    input: []
    output: RefundTransfer

  - method: GET
    path: "/refund-transfers"
    description: "List refund-transfers, filterable by tax_return_id (reverse-reachability for RefundTransfer.tax_return_id)"
    roles: [BankProductOfficer, OfficeManager, TaxPreparer]
    code: 200
    input: ["tax_return_id?", "limit?", "offset?"]
    output: RefundTransfer[]

  - method: POST
    path: "/refund-transfers/{id}/adjust"
    description: "Revise the pending refund figure on a PENDING_FUNDING transfer (bank pre-funding revision); bumps version"
    roles: [BankProductOfficer, OfficeManager]
    code: 200
    input: [estimated_refund_cents]
    output: RefundTransfer
    side_effects:
      - "RefundTransfer.estimated_refund_cents re-stamped"
      - "increments RefundTransfer.version by 1"

  - method: POST
    path: "/refund-transfers/{id}/disburse"
    description: "Fund and disburse the refund through the fee-deduction waterfall (OCC-guarded against a stale version superseded by an /adjust)"
    roles: [BankProductOfficer]
    code: 200
    input: [disbursed_refund_cents, expected_refundtransfer_version]
    output: RefundTransfer
    side_effects:
      - "Run refund_disbursement_waterfall; set net_to_taxpayer_cents / fee_shortfall_cents"
      - "increments RefundTransfer.version by 1"
      - "Cascade: linked DISBURSED RefundAdvance → REPAID with repaid_cents"

  - method: POST
    path: "/refund-transfers/{id}/cancel"
    description: "Cancel a pending refund-transfer"
    roles: [BankProductOfficer, OfficeManager]
    code: 200
    input: []
    output: RefundTransfer
    side_effects: ["status=CANCELLED"]

  # ---- RefundAdvance ----
  - method: POST
    path: "/refund-advances"
    description: "Request a refund-anticipation advance against a return's expected refund"
    roles: [BankProductOfficer, OfficeManager]
    code: 201
    input: [tax_return_id, requested_cents]
    output: RefundAdvance
    side_effects: ["status=REQUESTED"]

  - method: GET
    path: "/refund-advances/{id}"
    description: "Get a refund-advance"
    roles: [BankProductOfficer, OfficeManager, TaxPreparer]
    code: 200
    input: []
    output: RefundAdvance

  - method: GET
    path: "/refund-advances"
    description: "List refund-advances, filterable by tax_return_id (reverse-reachability for RefundAdvance.tax_return_id)"
    roles: [BankProductOfficer, OfficeManager, TaxPreparer]
    code: 200
    input: ["tax_return_id?", "limit?", "offset?"]
    output: RefundAdvance[]

  - method: POST
    path: "/refund-advances/{id}/underwrite"
    description: "Underwrite the advance: APPROVE (computes approved_cents) or DENY"
    roles: [BankProductOfficer]
    code: 200
    input: [decision]
    output: RefundAdvance
    side_effects: ["APPROVE sets approved_cents via advance_max_eligible; DENY sets approved_cents=0"]

  - method: POST
    path: "/refund-advances/{id}/disburse"
    description: "Disburse an approved advance (requires accepted return + pending refund-transfer)"
    roles: [BankProductOfficer]
    code: 200
    input: []
    output: RefundAdvance
    side_effects: ["status=DISBURSED"]

  # ---- Clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical server clock. Startup default is 2026-05-01T00:00:00Z; before any set, the clock reads exactly this default and never falls back to wall-clock time."
    roles: [OfficeManager]
    code: 200
    input: [to_iso8601]
    output: ComplianceClock
    side_effects: ["ComplianceClock.current_utc set to the supplied instant"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or FK-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing field, bad enum, end_utc<=start_utc, bad ssn_last4/ptin/efin format" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not defined from the resource's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_refundtransfer_version does not match current RefundTransfer.version" }
  - { id: ERR_NO_DOCUMENTS, http: 409, condition: "Return has zero DocumentIntake rows when moving INTAKE → DOCS_PENDING" }
  - { id: ERR_PREPARER_NOT_ASSIGNED, http: 409, condition: "Return has no preparer_id when moving DOCS_PENDING → IN_PREP" }
  - { id: ERR_REQUIRED_DOCS_MISSING, http: 409, condition: "A required DocumentIntake is still PENDING when moving DOCS_PENDING → IN_PREP" }
  - { id: ERR_CREDENTIAL_INVALID, http: 409, condition: "Assigned preparer's credential is not ACTIVE, or is expired against the logical clock at e-file" }
  - { id: ERR_INVALID_REFUND_FIGURE, http: 409, condition: "expected_refund_cents negative on PREPARED, or disbursed_refund_cents not > 0 on disburse" }
  - { id: ERR_EFIN_SUSPENDED, http: 409, condition: "Office.efin_status is SUSPENDED at e-file transmission" }
  - { id: ERR_AMEND_TARGET_NOT_ACCEPTED, http: 409, condition: "AMENDED_1040X return e-filed while amends_return_id target is not EFILED_ACCEPTED" }
  - { id: ERR_REJECT_CODE_REQUIRED, http: 422, condition: "efile-ack REJECTED without a reject_code" }
  - { id: ERR_REJECT_LIMIT_REACHED, http: 409, condition: "EFILED_REJECTED → PREPARED attempted when reject_count already exceeds 3" }
  - { id: ERR_PREPARER_DOUBLE_BOOKED, http: 409, condition: "New appointment's [start,end) overlaps an existing non-terminal appointment for the same preparer" }
  - { id: ERR_CLIENT_DOUBLE_BOOKED, http: 409, condition: "New appointment's [start,end] (boundary-inclusive) collides with an existing non-terminal appointment for the same client" }
  - { id: ERR_APPOINTMENT_WINDOW_NOT_OPEN, http: 409, condition: "Check-in before start_utc, or no-show recorded before end_utc, per the logical clock" }
  - { id: ERR_DUPLICATE_RETURN, http: 409, condition: "Second non-amended return for same office+client+tax_year" }
  - { id: ERR_PREPARER_AT_CAPACITY, http: 409, condition: "Assignment would push preparer.assigned_open_returns above max_open_returns" }
  - { id: ERR_BANK_PRODUCT_DISABLED, http: 409, condition: "Refund-transfer/advance attempted at an office with bank_product_enabled=false" }
  - { id: ERR_ADVANCE_INELIGIBLE, http: 409, condition: "requested_cents <= 0 or advance_max_eligible == 0 on underwrite APPROVE" }
  - { id: ERR_RETURN_NOT_ACCEPTED, http: 409, condition: "RefundTransfer/RefundAdvance disburse while linked return not EFILED_ACCEPTED" }
  - { id: ERR_NO_REFUND_TRANSFER, http: 409, condition: "Advance disburse with no PENDING_FUNDING RefundTransfer for the same return" }
  - { id: ERR_ADVANCE_ALREADY_DISBURSED, http: 409, condition: "RefundTransfer cancel while a linked RefundAdvance is DISBURSED" }
  - { id: ERR_RETURN_ALREADY_ACCEPTED, http: 409, condition: "AuditProtection cancel while linked return is EFILED_ACCEPTED" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: OfficeManager
    description: "Compliance and storefront administration; superset operator that can stand in for front-desk and bank-product duties but is not entity-backed to a single resource."
    identity: opaque
    exclusive_operations:
      - "POST /offices — create office"
      - "POST /offices/{id}/efin-status — suspend/reinstate EFIN"
      - "POST /credentials — file PTIN credential"
      - "POST /credentials/{id}/revoke — revoke credential"
      - "POST /offices/{id}/preparers — add preparer"
    shared_operations:
      - "POST /offices/{id}/clients, POST /offices/{id}/appointments and its transition (with FrontDeskAgent)"
      - "POST /returns, POST /returns/{id}/assign, POST /returns/{id}/transition, document endpoints (with FrontDeskAgent, TaxPreparer)"
      - "All audit-protection, refund-transfer and refund-advance create/cancel endpoints (with BankProductOfficer)"
      - "All GET endpoints"

  - name: FrontDeskAgent
    description: "Intake desk: registers clients, books and transitions appointments, opens returns and manages the document checklist."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /offices/{id}/clients — intake client"
      - "POST /offices/{id}/appointments and /transition — book/advance appointments"
      - "POST /returns, POST /returns/{id}/assign, POST /returns/{id}/transition (non-efile)"
      - "POST /returns/{id}/documents, POST /documents/{id}/status"
      - "GET endpoints in office/appointment/client/return/document scope"

  - name: TaxPreparer
    description: "Prepares returns, transmits e-files, and records IRS ACK/reject; entity-backed so ownership and capacity tie to a Preparer row."
    identity: "entity_backed:Preparer"
    exclusive_operations:
      - "POST /returns/{id}/efile — transmit"
      - "POST /returns/{id}/efile-ack — record ACK/reject"
    shared_operations:
      - "POST /returns, POST /returns/{id}/assign, POST /returns/{id}/transition"
      - "POST /returns/{id}/documents, POST /documents/{id}/status"
      - "GET endpoints across returns, preparers, credentials, bank products"

  - name: BankProductOfficer
    description: "Underwrites and funds bank products: refund-transfers, refund-advances, and the audit-protection add-on."
    identity: opaque
    exclusive_operations:
      - "POST /refund-transfers/{id}/disburse — run fee waterfall"
      - "POST /refund-advances/{id}/underwrite — underwrite advance"
      - "POST /refund-advances/{id}/disburse — disburse advance"
    shared_operations:
      - "POST /refund-transfers, POST /refund-transfers/{id}/cancel (with OfficeManager)"
      - "POST /refund-advances (with OfficeManager)"
      - "POST /audit-protections, POST /audit-protections/{id}/cancel (with OfficeManager)"
      - "GET endpoints across bank products, returns, clients"
