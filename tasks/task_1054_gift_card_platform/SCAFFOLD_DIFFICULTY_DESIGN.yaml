# =============================================================================
# task_1054 — Gift-Card Program & Distribution Platform (B2B)
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 9 Difficulty Rules × 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: breakage_estimated_vs_remittance
        grounds:
          - calculations.breakage_recognition
          - entities.CardProgram.fields.breakage_recognized_cents
          - entities.GiftCard.fields.balance_cents
        distinguishing_aspect: "On an ESTIMATED program a single ACTIVE card with balance 100000 recognizes breakage 10000 (10% of outstanding) while keeping its full balance; on identical data a REMITTANCE program recognizes 0 until the card actually expires — the dual-variant subject is CardProgram/GiftCard breakage, a different entity domain from settlement payout."
        test_recipe:
          setup:
            - "Merchant ACTIVE; CardProgram (breakage_method ESTIMATED) ACTIVE; one COMMITTED batch with a single card, activated with balance 100000; clock at default 2026-07-01 (card not expired)."
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /card-programs", payload: { merchant_id: "${m_id}", name: "Est", breakage_method: "ESTIMATED", expiry_months: 12, max_balance_cents: 100000, min_load_cents: 500 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /card-programs/${p_id}/activate", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "POST /card-batches", payload: { card_program_id: "${p_id}", channel: "DIGITAL", card_count: 1, unit_load_cents: 100000 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { b_id: "$.data.id" } }
            - { call: "POST /card-batches/${b_id}/commit", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "GET /gift-cards", payload: { card_batch_id: "${b_id}" }, as: Any, captures: { c_id: "$.data[0].id" } }
            - { call: "POST /gift-cards/${c_id}/activate", payload: {}, as: POSTerminal }
          trigger:
            - { call: "POST /card-programs/${p_id}/run-maintenance", payload: {}, as: PlatformAdmin }
          assert:
            - "CardProgram.${p_id}.breakage_recognized_cents == 10000"
            - "GiftCard.${c_id}.status == ACTIVE"
            - "GiftCard.${c_id}.balance_cents == 100000"

      - name: settlement_provisional_vs_final
        grounds:
          - calculations.settlement_net_payout
          - calculations.interchange_fee
          - entities.SettlementBatch.fields.provisional_net_payout_cents
          - entities.SettlementBatch.fields.net_payout_cents
        distinguishing_aspect: "Provisional payout (57500) is computed at OPEN over all swept redemptions (gross 60000); the final payout (37500) recomputes at FINALIZE over only still-POSTED redemptions (gross 40000) after a fraud confirm reverses one card's 20000 — the dual-variant subject is SettlementBatch/Merchant, a different entity domain from breakage."
        test_recipe:
          setup:
            - "Merchant ACTIVE; program ACTIVE; batch of 2 cards each loaded 100000, both ACTIVE. Card A redeemed 20000; card B redeemed 20000 twice (40000). Settlement opened (sweeps 60000, provisional net 57500). A fraud hold on card A is CONFIRMED, reversing A's 20000."
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /card-programs", payload: { merchant_id: "${m_id}", name: "P", expiry_months: 12, max_balance_cents: 100000, min_load_cents: 500 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /card-programs/${p_id}/activate", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "POST /card-batches", payload: { card_program_id: "${p_id}", channel: "DIGITAL", card_count: 2, unit_load_cents: 100000 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { b_id: "$.data.id" } }
            - { call: "POST /card-batches/${b_id}/commit", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "GET /gift-cards", payload: { card_batch_id: "${b_id}" }, as: Any, captures: { c_a: "$.data[0].id", c_b: "$.data[1].id" } }
            - { call: "POST /gift-cards/${c_a}/activate", payload: {}, as: POSTerminal }
            - { call: "POST /gift-cards/${c_b}/activate", payload: {}, as: POSTerminal }
            - { call: "POST /gift-cards/${c_a}/redeem", payload: { amount_cents: 20000 }, as: POSTerminal }
            - { call: "POST /gift-cards/${c_b}/redeem", payload: { amount_cents: 20000 }, as: POSTerminal }
            - { call: "POST /gift-cards/${c_b}/redeem", payload: { amount_cents: 20000 }, as: POSTerminal }
            - { call: "GET /merchants/${m_id}", payload: {}, as: Any, captures: { m_ver: "$.data.version" } }
            - { call: "POST /settlement-batches", payload: { merchant_id: "${m_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", expected_merchant_version: "${m_ver}" }, as: SettlementOfficer, as_user_id: "officer-1", captures: { s_id: "$.data.id" } }
            - { call: "POST /fraud-holds", payload: { gift_card_id: "${c_a}", reason: "CHARGEBACK" }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { h_id: "$.data.id" } }
            - { call: "POST /fraud-holds/${h_id}/confirm", payload: {}, as: FraudAnalyst, as_user_id: "analyst-2" }
          trigger:
            - { call: "POST /settlement-batches/${s_id}/finalize", payload: {}, as: SettlementOfficer, as_user_id: "officer-2" }
          assert:
            - "SettlementBatch.${s_id}.provisional_net_payout_cents == 57500"
            - "SettlementBatch.${s_id}.gross_redemptions_cents == 40000"
            - "SettlementBatch.${s_id}.net_payout_cents == 37500"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: interchange_tiered_fee_mode_a
        grounds:
          - calculations.interchange_fee
          - entities.SettlementBatch.fields.interchange_fee_cents
          - entities.SettlementBatch.fields.net_payout_cents
        distinguishing_aspect: "Mode (a): interchange_fee on gross 200000 selects tier1 rate 300bps (because 200000 <= 1,000,000), computes raw 6000, and clears the MIN floor via max(2500,6000)=6000 — a ≥3-input formula (gross, tier-selected rate, min floor) with nested max()."
        test_recipe:
          setup:
            - "Merchant ACTIVE; program ACTIVE; batch of 2 cards each loaded 100000, both ACTIVE. Each card fully redeemed (100000) so gross swept = 200000. Settlement opened."
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /card-programs", payload: { merchant_id: "${m_id}", name: "P", expiry_months: 12, max_balance_cents: 100000, min_load_cents: 500 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /card-programs/${p_id}/activate", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "POST /card-batches", payload: { card_program_id: "${p_id}", channel: "DIGITAL", card_count: 2, unit_load_cents: 100000 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { b_id: "$.data.id" } }
            - { call: "POST /card-batches/${b_id}/commit", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "GET /gift-cards", payload: { card_batch_id: "${b_id}" }, as: Any, captures: { c_a: "$.data[0].id", c_b: "$.data[1].id" } }
            - { call: "POST /gift-cards/${c_a}/activate", payload: {}, as: POSTerminal }
            - { call: "POST /gift-cards/${c_b}/activate", payload: {}, as: POSTerminal }
            - { call: "POST /gift-cards/${c_a}/redeem", payload: { amount_cents: 100000 }, as: POSTerminal }
            - { call: "POST /gift-cards/${c_b}/redeem", payload: { amount_cents: 100000 }, as: POSTerminal }
            - { call: "GET /merchants/${m_id}", payload: {}, as: Any, captures: { m_ver: "$.data.version" } }
          trigger:
            - { call: "POST /settlement-batches", payload: { merchant_id: "${m_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", expected_merchant_version: "${m_ver}" }, as: SettlementOfficer, as_user_id: "officer-1", captures: { s_id: "$.data.id" } }
          assert:
            - "SettlementBatch.${s_id}.gross_redemptions_cents == 200000"
            - "SettlementBatch.${s_id}.interchange_fee_cents == 6000"
            - "SettlementBatch.${s_id}.net_payout_cents == 194000"

      - name: estimated_breakage_rounding_order_mode_b
        grounds:
          - calculations.breakage_recognition
          - entities.CardProgram.fields.breakage_recognized_cents
        distinguishing_aspect: "Mode (b): ESTIMATED breakage over two cards each balance 505 rounds PER CARD (round_half_up(50.5)=51, sum 102), NOT sum-then-round (round_half_up(101.0)=101); the scaffold pins per-card ordering so breakage_recognized_cents == 102 — a different combinatorial mode from the interchange tiered formula."
        test_recipe:
          setup:
            - "Merchant ACTIVE; program (ESTIMATED) ACTIVE; batch of 2 cards each loaded 505, both ACTIVE (balance 505 each)."
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /card-programs", payload: { merchant_id: "${m_id}", name: "Est", breakage_method: "ESTIMATED", expiry_months: 12, max_balance_cents: 100000, min_load_cents: 500 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /card-programs/${p_id}/activate", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "POST /card-batches", payload: { card_program_id: "${p_id}", channel: "DIGITAL", card_count: 2, unit_load_cents: 505 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { b_id: "$.data.id" } }
            - { call: "POST /card-batches/${b_id}/commit", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "GET /gift-cards", payload: { card_batch_id: "${b_id}" }, as: Any, captures: { c_a: "$.data[0].id", c_b: "$.data[1].id" } }
            - { call: "POST /gift-cards/${c_a}/activate", payload: {}, as: POSTerminal }
            - { call: "POST /gift-cards/${c_b}/activate", payload: {}, as: POSTerminal }
          trigger:
            - { call: "POST /card-programs/${p_id}/run-maintenance", payload: {}, as: PlatformAdmin }
          assert:
            - "CardProgram.${p_id}.breakage_recognized_cents == 102"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: giftcard_active_suspended_cycle
        grounds:
          - state_machines.GiftCard.ACTIVE_to_SUSPENDED
          - state_machines.GiftCard.SUSPENDED_to_ACTIVE
        distinguishing_aspect: "GiftCard traverses ACTIVE->SUSPENDED (fraud hold open) then SUSPENDED->ACTIVE (hold clear), returning to a prior state — a cycle on the GiftCard entity, not a linear pipeline."
        test_recipe:
          setup:
            - "Merchant ACTIVE; program ACTIVE; one card ACTIVE with balance 100000; a fraud hold opened (card SUSPENDED)."
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /card-programs", payload: { merchant_id: "${m_id}", name: "P", expiry_months: 12, max_balance_cents: 100000, min_load_cents: 500 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /card-programs/${p_id}/activate", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "POST /card-batches", payload: { card_program_id: "${p_id}", channel: "DIGITAL", card_count: 1, unit_load_cents: 100000 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { b_id: "$.data.id" } }
            - { call: "POST /card-batches/${b_id}/commit", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "GET /gift-cards", payload: { card_batch_id: "${b_id}" }, as: Any, captures: { c_id: "$.data[0].id" } }
            - { call: "POST /gift-cards/${c_id}/activate", payload: {}, as: POSTerminal }
            - { call: "POST /fraud-holds", payload: { gift_card_id: "${c_id}", reason: "MANUAL" }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { h_id: "$.data.id" } }
          trigger:
            - { call: "POST /fraud-holds/${h_id}/clear", payload: {}, as: FraudAnalyst, as_user_id: "analyst-1" }
          assert:
            - "GiftCard.${c_id}.status == ACTIVE"
            - "FraudHold.${h_id}.status == CLEARED"

      - name: fraudhold_open_branch_clear_vs_confirm
        grounds:
          - state_machines.FraudHold.OPEN_to_CLEARED
          - state_machines.FraudHold.OPEN_to_CONFIRMED
        distinguishing_aspect: "FraudHold forks OPEN->{CLEARED,CONFIRMED} with divergent side-effect sets: CLEARED reactivates card 1 leaving its redemption POSTED (balance 80000); CONFIRMED leaves card 2 SUSPENDED and reverses its redemption (balance restored to 100000) — branching on the FraudHold entity (distinct from GiftCard)."
        test_recipe:
          setup:
            - "Merchant ACTIVE; program ACTIVE; two cards each loaded 100000. Card 1 redeemed 20000 (balance 80000); card 2 redeemed 30000 (balance 70000). A fraud hold opened on each card."
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /card-programs", payload: { merchant_id: "${m_id}", name: "P", expiry_months: 12, max_balance_cents: 100000, min_load_cents: 500 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /card-programs/${p_id}/activate", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "POST /card-batches", payload: { card_program_id: "${p_id}", channel: "DIGITAL", card_count: 2, unit_load_cents: 100000 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { b_id: "$.data.id" } }
            - { call: "POST /card-batches/${b_id}/commit", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "GET /gift-cards", payload: { card_batch_id: "${b_id}" }, as: Any, captures: { c1: "$.data[0].id", c2: "$.data[1].id" } }
            - { call: "POST /gift-cards/${c1}/activate", payload: {}, as: POSTerminal }
            - { call: "POST /gift-cards/${c2}/activate", payload: {}, as: POSTerminal }
            - { call: "POST /gift-cards/${c1}/redeem", payload: { amount_cents: 20000 }, as: POSTerminal }
            - { call: "POST /gift-cards/${c2}/redeem", payload: { amount_cents: 30000 }, as: POSTerminal }
            - { call: "POST /fraud-holds", payload: { gift_card_id: "${c1}", reason: "MANUAL" }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { h1: "$.data.id" } }
            - { call: "POST /fraud-holds", payload: { gift_card_id: "${c2}", reason: "CHARGEBACK" }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { h2: "$.data.id" } }
          trigger:
            - { call: "POST /fraud-holds/${h1}/clear", payload: {}, as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraud-holds/${h2}/confirm", payload: {}, as: FraudAnalyst, as_user_id: "analyst-2" }
          assert:
            - "FraudHold.${h1}.status == CLEARED"
            - "FraudHold.${h2}.status == CONFIRMED"
            - "GiftCard.${c1}.status == ACTIVE"
            - "GiftCard.${c1}.balance_cents == 80000"
            - "GiftCard.${c2}.status == SUSPENDED"
            - "GiftCard.${c2}.balance_cents == 100000"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: fraud_confirm_reversal_settlement_cascade
        grounds:
          - state_machines.FraudHold.OPEN_to_CONFIRMED
          - calculations.card_balance
          - calculations.settlement_net_payout
          - entities.Merchant.fields.unsettled_redemptions_cents
        distinguishing_aspect: "Depth-3 chain from POST /fraud-holds/{id}/confirm: (A) hold CONFIRMED -> (B) card's REDEMPTION entry flips to REVERSED, balance restored to 100000 -> (C) the entry leaves the OPEN settlement batch, whose gross/net recompute to 0 -> (D) Merchant.unsettled_redemptions_cents recompute; each hop is caused by the previous one."
        test_recipe:
          setup:
            - "Merchant ACTIVE; program ACTIVE; one card ACTIVE loaded 100000, redeemed 20000. Settlement opened (sweeps the 20000; gross 20000; merchant unsettled 0). A fraud hold opened on the card."
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /card-programs", payload: { merchant_id: "${m_id}", name: "P", expiry_months: 12, max_balance_cents: 100000, min_load_cents: 500 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /card-programs/${p_id}/activate", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "POST /card-batches", payload: { card_program_id: "${p_id}", channel: "DIGITAL", card_count: 1, unit_load_cents: 100000 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { b_id: "$.data.id" } }
            - { call: "POST /card-batches/${b_id}/commit", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "GET /gift-cards", payload: { card_batch_id: "${b_id}" }, as: Any, captures: { c_id: "$.data[0].id" } }
            - { call: "POST /gift-cards/${c_id}/activate", payload: {}, as: POSTerminal }
            - { call: "POST /gift-cards/${c_id}/redeem", payload: { amount_cents: 20000 }, as: POSTerminal }
            - { call: "GET /merchants/${m_id}", payload: {}, as: Any, captures: { m_ver: "$.data.version" } }
            - { call: "POST /settlement-batches", payload: { merchant_id: "${m_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", expected_merchant_version: "${m_ver}" }, as: SettlementOfficer, as_user_id: "officer-1", captures: { s_id: "$.data.id" } }
            - { call: "POST /fraud-holds", payload: { gift_card_id: "${c_id}", reason: "CHARGEBACK" }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { h_id: "$.data.id" } }
          trigger:
            - { call: "POST /fraud-holds/${h_id}/confirm", payload: {}, as: FraudAnalyst, as_user_id: "analyst-2" }
          assert:
            - "GiftCard.${c_id}.balance_cents == 100000"
            - "SettlementBatch.${s_id}.gross_redemptions_cents == 0"
            - "SettlementBatch.${s_id}.net_payout_cents == 0"
            - "Merchant.${m_id}.unsettled_redemptions_cents == 0"

      - name: card_expiry_breakage_program_cascade
        grounds:
          - state_machines.GiftCard.ACTIVE_to_EXPIRED
          - calculations.breakage_recognition
          - calculations.card_balance
          - entities.CardProgram.fields.breakage_recognized_cents
        distinguishing_aspect: "Depth-2 chain from POST /card-programs/{id}/run-maintenance (a different trigger than the fraud cascade): (A) card ACTIVE->EXPIRED -> (B) a BREAKAGE ledger entry of -30000 zeroes the card balance -> (C) CardProgram.breakage_recognized_cents rises by 30000."
        test_recipe:
          setup:
            - "Merchant ACTIVE; program (REMITTANCE) ACTIVE; one card ACTIVE loaded 30000, activated at 2026-07-01 (expires 2027-07-01). Clock advanced to 2027-07-02 (past expiry)."
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /card-programs", payload: { merchant_id: "${m_id}", name: "P", breakage_method: "REMITTANCE", expiry_months: 12, max_balance_cents: 100000, min_load_cents: 500 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /card-programs/${p_id}/activate", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "POST /card-batches", payload: { card_program_id: "${p_id}", channel: "DIGITAL", card_count: 1, unit_load_cents: 30000 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { b_id: "$.data.id" } }
            - { call: "POST /card-batches/${b_id}/commit", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "GET /gift-cards", payload: { card_batch_id: "${b_id}" }, as: Any, captures: { c_id: "$.data[0].id" } }
            - { call: "POST /gift-cards/${c_id}/activate", payload: {}, as: POSTerminal }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-07-02T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /card-programs/${p_id}/run-maintenance", payload: {}, as: PlatformAdmin }
          assert:
            - "GiftCard.${c_id}.status == EXPIRED"
            - "GiftCard.${c_id}.balance_cents == 0"
            - "CardProgram.${p_id}.breakage_recognized_cents == 30000"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: redeem_state_beats_fiscal
        grounds:
          - "validations[priority=7]"
          - "validations[priority=15]"
        distinguishing_aspect: "A redemption of 999999 on a SUSPENDED card whose balance is only 10000 violates both the state rule (priority 7, ERR_CARD_NOT_ACTIVE) and the fiscal rule (priority 15, ERR_INSUFFICIENT_BALANCE); the state error wins — category pair state × business_fiscal."
        test_recipe:
          setup:
            - "Merchant ACTIVE; program ACTIVE; card ACTIVE loaded 10000, then SUSPENDED via an open fraud hold."
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /card-programs", payload: { merchant_id: "${m_id}", name: "P", expiry_months: 12, max_balance_cents: 100000, min_load_cents: 500 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /card-programs/${p_id}/activate", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "POST /card-batches", payload: { card_program_id: "${p_id}", channel: "DIGITAL", card_count: 1, unit_load_cents: 10000 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { b_id: "$.data.id" } }
            - { call: "POST /card-batches/${b_id}/commit", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "GET /gift-cards", payload: { card_batch_id: "${b_id}" }, as: Any, captures: { c_id: "$.data[0].id" } }
            - { call: "POST /gift-cards/${c_id}/activate", payload: {}, as: POSTerminal }
