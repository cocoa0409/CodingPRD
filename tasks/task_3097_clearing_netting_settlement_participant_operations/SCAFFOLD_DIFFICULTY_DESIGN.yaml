            - "GET /clearing/default-proceedings/${dp_cas} reports status == DECLARED, so the fund and the net positions are untouched by this chain"
            - "the companion instance participant_suspension_four_hop_cascade reaches depth 4, and the two chains share no triggering transition — one starts at SUSPENDED_to_DEFAULTED, the other at ACTIVE_to_SUSPENDED"

