            - { call: "GET /homeownership/household-members/${mem_app_id}", as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { mem_hours_mid: $.data.credited_hours_to_date } }
            - { call: "POST /homeownership/sweat-equity-entries/${entry_id}/reverse", payload: { reversal_reason: "Timesheet duplicated the Sunday crew log" }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "GET /homeownership/households/${hh_id}", as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { hh_hours_after: $.data.sweat_equity_credited_hours, hh_family_after: $.data.family_member_credited_hours, hh_satisfied_after: $.data.sweat_equity_satisfied, hh_selection_after: $.data.selection_status } }
            - { call: "GET /homeownership/household-members/${mem_app_id}", as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { mem_hours_after: $.data.credited_hours_to_date } }
            - { call: "GET /homeownership/sweat-equity-entries", payload: { reversal_of_entry_id: "${entry_id}" }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { mirror_id: "$.data[0].id", mirror_hours: "$.data[0].hours_credited", mirror_status: "$.data[0].status", mirror_weight: "$.data[0].credit_weight", mirror_claimed: "$.data[0].hours_claimed" } }
          assert:
            - "${hh_required} == 12.0"
            - "${hh_hours_before} == 0.0"
            - "${hh_family_before} == 0.0"
            - "${mem_hours_before} == 0.0"
            - "${hh_satisfied_before} == false"
            - "${hh_selection_before} == SELECTED"
            - "${credited_weight} == 1.0"
            - "${credited_hours} == 6.0"
            - "${credited_capped} == 0.0"
            - "${hh_hours_mid} == 6.0  # forward action really moved the counter"
            - "${mem_hours_mid} == 6.0"
            - "${hh_family_mid} == 0.0  # an APPLICANT member never consumes the family allowance"
            - "${hh_satisfied_mid} == false  # 6.0 < 12.0"
            - "${hh_selection_mid} == PARTNERSHIP_ACTIVE"
            - "${hh_hours_after} == 0.0"
            - "${mem_hours_after} == 0.0"
            - "${hh_family_after} == 0.0"
            - "${hh_satisfied_after} == false"
            - "${hh_selection_after} == PARTNERSHIP_ACTIVE  # the counter is compensated, the status dimension is not"
            - "ApplicantHousehold.${hh_id}.sweat_equity_credited_hours == 0.0"
            - "HouseholdMember.${mem_app_id}.credited_hours_to_date == 0.0"
            - "SweatEquityEntry.${entry_id}.status == REVERSED"
            - "SweatEquityEntry.${entry_id}.hours_credited == 6.0  # the original stays in LEDGER_SET at +6.00"
            - "${mirror_status} == CREDITED"
            - "${mirror_hours} == -6.0"
            - "${mirror_weight} == 1.0"
            - "${mirror_claimed} == 0.0"
            - "SweatEquityEntry.${mirror_id}.reversal_of_entry_id == ${entry_id}"
            - "sum(SweatEquityEntry.hours_credited over household ${hh_id} rows with status IN {CREDITED, REVERSED}) == 0.0"
