# SCAFFOLD_CORNER_DESIGN.yaml — section 1.9 breadth probe for
# task_2527 Interchange Qualification & Merchant Category Assignment.
#
# Taxonomy: the nine sections and per-section claim_type rows of
# references/claim-extraction-guide.md, walked against SCAFFOLD.yaml sections
# 1.1-1.7. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml are
# emitted as excluded_because stubs.
#
# Canonical reference data reused by the chains below:
#   ProcessingPlatform  max_concurrent_windows 1, blackout_buffer_days 3
#   Acquirer            country_code "US", settlement_currency "USD"
#   MccDefinition 5411  GROCERY,         program_eligibility ["SMALL_TICKET"]
#   MccDefinition 5311  DEPARTMENT_STORE, program_eligibility []
#   MccDefinition 4900  UTILITY_SERVICE, ["UTILITY"], requires_documentation true
#   MccDefinition 8398  CHARITABLE,      ["CHARITY"], requires_documentation true
#   RateProgram CPS_RETAIL   145 bps, 10c, 4 data elements, max delay 24h
#   RateProgram SMALL_TICKET 165 bps,  4c, 2 data elements, max delay 48h
#   RateProgram UTILITY        0 bps, 75c, 2 data elements, max delay 48h
#   RateProgram CHARITY      100 bps,  0c, 1 data element,  max delay 168h
#   RateProgram STANDARD     254 bps, 10c, no data elements, max delay 720h
scaffold_corner_design:
  - section: entities
    instances:
      - name: entity_creation_processing_platform_returns_object_envelope_with_all_fields
        claim_type: creation
        grounds:
          - endpoints[POST /processing-platforms]
          - entities.ProcessingPlatform
          - response_envelope.success
        distinguishing_aspect: "POST /processing-platforms with all four required fields returns 201, echoes every input field and wraps the row in the success envelope with response_type object and version 1."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-09-03T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /processing-platforms"
              payload: { name: "PLAT-NA-1", region_code: "NA", max_concurrent_windows: 1, blackout_buffer_days: 3 }
              as: NetworkAdmin
              captures: { plat_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "response response_type == object"
            - "response meta.api_request_id is a non-empty string"
            - "response meta.api_request_timestamp is a non-empty ISO-8601 string"
            - "response data.name == PLAT-NA-1"
            - "response data.region_code == NA"
            - "response data.max_concurrent_windows == 1"
            - "response data.blackout_buffer_days == 3"
            - "response data.version == 1"
            - "${plat_id} is a non-empty string"

      - name: entity_retrieval_acquirer_by_id_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /acquirers/{id}]
          - entities.Acquirer
        distinguishing_aspect: "GET /acquirers/{id} returns exactly the fields stored by the create call, including the system-defaulted compliance_status COMPLIANT and missed_window_count 0."
        test_recipe:
          setup:
            - "Clock at 2026-09-03T00:00:00Z; one platform; one acquirer created on it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /processing-platforms"
              payload: { name: "PLAT-NA-1", region_code: "NA", max_concurrent_windows: 1, blackout_buffer_days: 3 }
              as: NetworkAdmin
              captures: { plat_id: $.data.id }
            - call: "POST /acquirers"
              payload: { name: "Acme Acquiring", bin_prefix: "411111", platform_id: "${plat_id}", country_code: "US", settlement_currency: "USD" }
              as: NetworkAdmin
              captures: { acq_id: $.data.id }
          trigger:
            - call: "GET /acquirers/${acq_id}"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "CA-1"
          assert:
            - "HTTP status == 200"
            - "response data.id == ${acq_id}"
            - "response data.name == Acme Acquiring"
            - "response data.bin_prefix == 411111"
            - "response data.platform_id == ${plat_id}"
            - "response data.country_code == US"
            - "response data.settlement_currency == USD"
            - "response data.compliance_status == COMPLIANT"
            - "response data.missed_window_count == 0"

      - name: entity_listing_mcc_definitions_paginated_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /mcc-definitions]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three MccDefinition rows, limit 2 offset 0 returns 2 rows with total_count 3 and has_more true, and limit 2 offset 2 returns the remaining 1 row with has_more false."
        test_recipe:
          setup:
            - "Clock at 2026-09-03T00:00:00Z; exactly three MccDefinition rows: 5411, 5311 and 4900."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /mcc-definitions"
              payload: { mcc_code: "5411", description: "Grocery Stores", business_type_key: "GROCERY", program_eligibility: ["SMALL_TICKET"], requires_documentation: false, high_risk: false }
              as: NetworkAdmin
            - call: "POST /mcc-definitions"
              payload: { mcc_code: "5311", description: "Department Stores", business_type_key: "DEPARTMENT_STORE", program_eligibility: [], requires_documentation: false, high_risk: false }
              as: NetworkAdmin
            - call: "POST /mcc-definitions"
              payload: { mcc_code: "4900", description: "Utilities", business_type_key: "UTILITY_SERVICE", program_eligibility: ["UTILITY"], requires_documentation: true, high_risk: false }
              as: NetworkAdmin
          trigger:
            - call: "GET /mcc-definitions"
              payload: { limit: 2, offset: 0 }
              as: CategoryAnalyst
              as_user_id: "CAN-1"
            - call: "GET /mcc-definitions"
              payload: { limit: 2, offset: 2 }
              as: CategoryAnalyst
              as_user_id: "CAN-1"
          assert:
            - "the first trigger call returns HTTP status 200 and response_type == array"
            - "the first trigger call returns exactly 2 elements in data"
            - "the first trigger call returns meta.total_count == 3, meta.limit == 2, meta.offset == 0 and meta.has_more == true"
            - "the second trigger call returns exactly 1 element in data"
            - "the second trigger call returns meta.total_count == 3, meta.offset == 2 and meta.has_more == false"

      - name: entity_defaults_listing_without_limit_applies_default_page_size_of_ten
        claim_type: defaults
        grounds:
          - endpoints[GET /processing-platforms]
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Omitting limit and offset on GET /processing-platforms applies the declared defaults limit 10 and offset 0 rather than returning an unbounded page."
        test_recipe:
          setup:
            - "Clock at 2026-09-03T00:00:00Z; exactly two ProcessingPlatform rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /processing-platforms"
              payload: { name: "PLAT-NA-1", region_code: "NA", max_concurrent_windows: 1, blackout_buffer_days: 3 }
              as: NetworkAdmin
            - call: "POST /processing-platforms"
              payload: { name: "PLAT-EU-1", region_code: "EU", max_concurrent_windows: 2, blackout_buffer_days: 0 }
              as: NetworkAdmin
          trigger:
            - call: "GET /processing-platforms"
              payload: {}
              as: NetworkAdmin
          assert:
            - "HTTP status == 200"
            - "response meta.limit == 10"
            - "response meta.offset == 0"
            - "response meta.total_count == 2"
            - "response meta.has_more == false"
            - "response data contains exactly 2 elements"

      - name: entity_defaults_enrollment_omitting_waitlist_requested_defaults_to_false
        claim_type: defaults
        grounds:
          - endpoints[POST /incentive-enrollments]
          - entities.IncentiveEnrollment.fields.waitlist_requested
        distinguishing_aspect: "waitlist_requested is the only optional input on POST /incentive-enrollments; omitting it stores false rather than null, and the enrollment still lands in ENROLLED because capacity is available."
        test_recipe:
          setup:
            - "Clock at 2026-09-03T00:00:00Z; one platform; one US/USD acquirer; MCC 5411."
            - "Incentive program with total_capacity_cents 100000000 and min_commitment_cents 5000000, eligible_mcc_codes [\"5411\"]."
            - "One VERIFIED grocery merchant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /processing-platforms"
              payload: { name: "PLAT-NA-1", region_code: "NA", max_concurrent_windows: 1, blackout_buffer_days: 3 }
              as: NetworkAdmin
              captures: { plat_id: $.data.id }
            - call: "POST /acquirers"
              payload: { name: "Acme Acquiring", bin_prefix: "411111", platform_id: "${plat_id}", country_code: "US", settlement_currency: "USD" }
              as: NetworkAdmin
              captures: { acq_id: $.data.id }
            - call: "POST /mcc-definitions"
              payload: { mcc_code: "5411", description: "Grocery Stores", business_type_key: "GROCERY", program_eligibility: ["SMALL_TICKET"], requires_documentation: false, high_risk: false }
              as: NetworkAdmin
            - call: "POST /incentive-programs"
              payload: { program_name: "Grocery Growth 2026", eligible_mcc_codes: ["5411"], total_capacity_cents: 100000000, min_commitment_cents: 5000000, reopen_threshold_cents: 5000000, performance_threshold_pct: 80.00 }
              as: NetworkAdmin
              captures: { ip_id: $.data.id, ip_v0: $.data.version }
            - call: "POST /merchants"
              payload: { legal_name: "Corner Grocer", business_type_key: "GROCERY", acquirer_id: "${acq_id}", home_country_code: "US" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { mer_id: $.data.id }
          trigger:
            - call: "POST /incentive-enrollments"
              payload: { incentive_program_id: "${ip_id}", merchant_id: "${mer_id}", committed_volume_cents: 5000000, expected_incentive_program_version: "${ip_v0}" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { enr_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "response data.waitlist_requested == false"
            - "response data.status == ENROLLED"
            - "response data.probation_count == 0"
            - "response data.achieved_volume_cents == 0"
            - "response data.tier_code == null"
            - "IncentiveEnrollment.${enr_id}.enrolled_at == 2026-09-03T00:00:00.000Z"

      - name: entity_computed_field_assigned_mcc_tie_breaks_on_mcc_code_ascending
        claim_type: computed_fields
        grounds:
          - calculations.mcc_assignment_selector
          - entities.Merchant.fields.assigned_mcc
        distinguishing_aspect: "Two MccDefinition rows share business_type_key TELECOM and both have high_risk false, so the selector's second key decides: mcc_code 4814 sorts before 4816 and is assigned, even though 4816 was created first."
        test_recipe:
          setup:
            - "Clock at 2026-09-03T00:00:00Z; one platform; one US/USD acquirer."
            - "MccDefinition 4816 (TELECOM, high_risk false) created FIRST, then MccDefinition 4814 (TELECOM, high_risk false), so created_at order is the reverse of mcc_code order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /processing-platforms"
              payload: { name: "PLAT-NA-1", region_code: "NA", max_concurrent_windows: 1, blackout_buffer_days: 3 }
              as: NetworkAdmin
              captures: { plat_id: $.data.id }
            - call: "POST /acquirers"
              payload: { name: "Acme Acquiring", bin_prefix: "411111", platform_id: "${plat_id}", country_code: "US", settlement_currency: "USD" }
              as: NetworkAdmin
              captures: { acq_id: $.data.id }
            - call: "POST /mcc-definitions"
              payload: { mcc_code: "4816", description: "Computer Network Services", business_type_key: "TELECOM", program_eligibility: [], requires_documentation: false, high_risk: false }
              as: NetworkAdmin
            - call: "POST /mcc-definitions"
              payload: { mcc_code: "4814", description: "Telecommunication Services", business_type_key: "TELECOM", program_eligibility: [], requires_documentation: false, high_risk: false }
              as: NetworkAdmin
          trigger:
            - call: "POST /merchants"
              payload: { legal_name: "Northline Telecom", business_type_key: "TELECOM", acquirer_id: "${acq_id}", home_country_code: "US" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { mer_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "response data.assigned_mcc == 4814"
            - "response data.mcc_status == VERIFIED"
            - "response data.mcc_status_before_review == null"
            - "response data.downgrade_count_current_quarter == 0"
            - "response data.lifetime_net_assessed_cents == 0"
            - "Merchant.${mer_id}.version == 1"

      - name: entity_computed_field_assigned_mcc_ranks_high_risk_ascending_before_mcc_code
        claim_type: computed_fields
        grounds:
          - calculations.mcc_assignment_selector
          - entities.MccDefinition.fields.high_risk
        distinguishing_aspect: "The selector's FIRST key dominates: MCC 4829 (high_risk true) sorts after MCC 6051 (high_risk false) despite 4829 being numerically smaller, so 6051 is assigned."
        test_recipe:
          setup:
            - "Clock at 2026-09-03T00:00:00Z; one platform; one US/USD acquirer."
            - "MccDefinition 4829 (MONEY_TRANSFER, high_risk true) and MccDefinition 6051 (MONEY_TRANSFER, high_risk false)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /processing-platforms"
              payload: { name: "PLAT-NA-1", region_code: "NA", max_concurrent_windows: 1, blackout_buffer_days: 3 }
              as: NetworkAdmin
              captures: { plat_id: $.data.id }
            - call: "POST /acquirers"
              payload: { name: "Acme Acquiring", bin_prefix: "411111", platform_id: "${plat_id}", country_code: "US", settlement_currency: "USD" }
              as: NetworkAdmin
              captures: { acq_id: $.data.id }
            - call: "POST /mcc-definitions"
              payload: { mcc_code: "4829", description: "Wire Transfer Money Orders", business_type_key: "MONEY_TRANSFER", program_eligibility: [], requires_documentation: false, high_risk: true }
              as: NetworkAdmin
            - call: "POST /mcc-definitions"
              payload: { mcc_code: "6051", description: "Quasi Cash Financial Institutions", business_type_key: "MONEY_TRANSFER", program_eligibility: [], requires_documentation: false, high_risk: false }
              as: NetworkAdmin
          trigger:
            - call: "POST /merchants"
              payload: { legal_name: "Sendwell Remit", business_type_key: "MONEY_TRANSFER", acquirer_id: "${acq_id}", home_country_code: "US" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { mer_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "response data.assigned_mcc == 6051"
            - "response data.assigned_mcc != 4829"
            - "response data.mcc_status == VERIFIED"
            - "Merchant.${mer_id}.business_type_key == MONEY_TRANSFER"

      - name: entity_system_fields_acquirer_timestamps_and_version_are_server_generated
        claim_type: system_fields
        grounds:
          - entities.Acquirer
          - calculations.logical_clock_sweep
        distinguishing_aspect: "id, created_at, updated_at and version are stamped by the server from the logical clock: created_at and updated_at both equal 2026-09-03T00:00:00.000Z and version starts at 1."
        test_recipe:
          setup:
            - "Clock pinned to 2026-09-03T00:00:00Z; one platform."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /processing-platforms"
              payload: { name: "PLAT-NA-1", region_code: "NA", max_concurrent_windows: 1, blackout_buffer_days: 3 }
              as: NetworkAdmin
              captures: { plat_id: $.data.id }
          trigger:
            - call: "POST /acquirers"
              payload: { name: "Acme Acquiring", bin_prefix: "411111", platform_id: "${plat_id}", country_code: "US", settlement_currency: "USD" }
              as: NetworkAdmin
              captures: { acq_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "response data.created_at == 2026-09-03T00:00:00.000Z"
            - "response data.updated_at == 2026-09-03T00:00:00.000Z"
            - "response data.version == 1"
            - "${acq_id} is a non-empty string"

      - name: entity_graph_transaction_record_is_reachable_from_both_batch_and_merchant
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - endpoints[GET /transaction-records]
          - entities.TransactionRecord.fields.settlement_batch_id
          - entities.TransactionRecord.fields.merchant_id
        distinguishing_aspect: "The graph topology is observable: one TransactionRecord row is returned by GET /transaction-records filtered by settlement_batch_id AND by the same filter on merchant_id, proving both cross-aggregate edges are indexed."
        test_recipe:
          setup:
            - "Clock at 2026-09-03T00:00:00Z; one platform; one US/USD acquirer; MCC 5411; SMALL_TICKET and STANDARD programs."
            - "One VERIFIED grocery merchant and one OPEN batch holding a single 1400-cent record."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /processing-platforms"
              payload: { name: "PLAT-NA-1", region_code: "NA", max_concurrent_windows: 1, blackout_buffer_days: 3 }
              as: NetworkAdmin
              captures: { plat_id: $.data.id }
            - call: "POST /acquirers"
              payload: { name: "Acme Acquiring", bin_prefix: "411111", platform_id: "${plat_id}", country_code: "US", settlement_currency: "USD" }
              as: NetworkAdmin
              captures: { acq_id: $.data.id }
            - call: "POST /mcc-definitions"
              payload: { mcc_code: "5411", description: "Grocery Stores", business_type_key: "GROCERY", program_eligibility: ["SMALL_TICKET"], requires_documentation: false, high_risk: false }
              as: NetworkAdmin
            - call: "POST /rate-programs"
              payload: { program_code: "SMALL_TICKET_STD", name: "Small Ticket", category: "SMALL_TICKET", eligible_mcc_codes: ["5411"], base_rate_bps: 165, per_item_fee_cents: 4, requires_data_elements: ["AUTH_CODE", "TERMINAL_ID"], max_clearing_delay_hours: 48 }
              as: NetworkAdmin
            - call: "POST /rate-programs"
              payload: { program_code: "STANDARD_FALLBACK", name: "Standard", category: "STANDARD", eligible_mcc_codes: ["5411", "5311", "4900", "8398"], base_rate_bps: 254, per_item_fee_cents: 10, requires_data_elements: [], max_clearing_delay_hours: 720 }
              as: NetworkAdmin
            - call: "POST /merchants"
              payload: { legal_name: "Corner Grocer", business_type_key: "GROCERY", acquirer_id: "${acq_id}", home_country_code: "US" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { mer_id: $.data.id }
            - call: "POST /settlement-batches"
              payload: { acquirer_id: "${acq_id}", batch_date: "2026-09-02", currency_code: "USD" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { batch_id: $.data.id, batch_v0: $.data.version }
            - call: "POST /settlement-batches/${batch_id}/transaction-records"
              payload: { merchant_id: "${mer_id}", amount_cents: 1400, transaction_currency: "USD", auth_code: "A00200", auth_timestamp: "2026-09-02T00:00:00Z", clearing_timestamp: "2026-09-02T01:00:00Z", data_elements: ["AUTH_CODE", "TERMINAL_ID"], expected_batch_version: "${batch_v0}" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { rec_id: $.data.id }
          trigger:
            - call: "GET /transaction-records"
              payload: { settlement_batch_id: "${batch_id}" }
              as: NetworkAdmin
              captures: { by_batch_first_id: "$.data[0].id" }
            - call: "GET /transaction-records"
              payload: { merchant_id: "${mer_id}" }
              as: NetworkAdmin
              captures: { by_merchant_first_id: "$.data[0].id" }
          assert:
            - "the first trigger call returns meta.total_count == 1 and ${by_batch_first_id} == ${rec_id}"
            - "the second trigger call returns meta.total_count == 1 and ${by_merchant_first_id} == ${rec_id}"
            - "TransactionRecord.${rec_id}.settlement_batch_id == ${batch_id}"
            - "TransactionRecord.${rec_id}.merchant_id == ${mer_id}"
            - "TransactionRecord.${rec_id}.qualification_status == PENDING"
            - "TransactionRecord.${rec_id}.provisional_assessed_cents == 27"

      - name: entity_not_found_get_merchant_with_unknown_id_returns_404
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_MERCHANT_NOT_FOUND]
          - endpoints[GET /merchants/{id}]
        distinguishing_aspect: "A well-formed but unstored UUID in the path yields ERR_MERCHANT_NOT_FOUND with HTTP 404, not an empty 200 body."
        test_recipe:
          setup:
            - "Clock at 2026-09-03T00:00:00Z; no Merchant rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "GET /merchants/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: NetworkAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_MERCHANT_NOT_FOUND"
            - "response response_type == error"
            - "response data.message is a non-empty string"

      - name: entity_required_fields_acquirer_without_bin_prefix_is_rejected_with_400
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /acquirers]
        distinguishing_aspect: "bin_prefix is a required input with no default; omitting it returns ERR_INVALID_REQUEST 400 and creates no Acquirer row."
        test_recipe:
          setup:
            - "Clock at 2026-09-03T00:00:00Z; one platform; no acquirers."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /processing-platforms"
              payload: { name: "PLAT-NA-1", region_code: "NA", max_concurrent_windows: 1, blackout_buffer_days: 3 }
              as: NetworkAdmin
              captures: { plat_id: $.data.id }
          trigger:
            - call: "POST /acquirers"
              payload: { name: "Acme Acquiring", platform_id: "${plat_id}", country_code: "US", settlement_currency: "USD" }
              as: NetworkAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /acquirers filtered by platform_id ${plat_id} returns meta.total_count == 0"

      - name: entity_type_constraints_invalid_region_code_enum_is_rejected_with_400
        claim_type: type_constraints
        grounds:
          - validations[priority=5]
          - entities.ProcessingPlatform.fields.region_code
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "region_code is constrained to NA/EU/AP/LAC/CEMEA; the value XX is outside the enum domain and returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup:
            - "Clock at 2026-09-03T00:00:00Z; empty database."
          setup_api_calls:
