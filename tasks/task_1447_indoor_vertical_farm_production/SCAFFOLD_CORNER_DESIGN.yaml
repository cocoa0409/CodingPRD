        captures:
          s_status: $.data.shipment_status
      assert:
      - 'after the PASSED retest the batch is PENDING (not RELEASED): ship at 18:00 (window open) -> error_id == ERR_BATCH_SAFETY_PENDING (422)'
      - GrowBatch.${b1}.safety_status == PENDING before re-release
      - 'after QA re-release: ship succeeds, shipment_status == SHIPPED (full quarantine->pending->release compensation path)'
  - name: err_tower_interval_overlap_covered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_TOWER_INTERVAL_OVERLAP]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / tower_allocation_half_open_adjacency
      rationale: Both the reject and adjacency-accept sides are asserted there.
  - name: err_sanitation_overlap_covered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_SANITATION_OVERLAP]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / sanitation_closed_interval_with_buffer
      rationale: Closed-interval touch, buffer violation, and buffer-exact accept are all asserted there.
  - name: err_dock_capacity_exceeded_covered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_DOCK_CAPACITY_EXCEEDED]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / dock_day_aggregate_capacity_quota
      rationale: The aggregate quota boundary (3 allowed, 4th rejected) is asserted there.
  - name: err_weekly_hours_exceeded_covered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_WEEKLY_HOURS_EXCEEDED]
    excluded_because:
      difficulty_instance: boundary_precision_check / weekly_hours_exactly_40_no_overtime_and_48_hard_cap
      rationale: The 40.00/48.00/50.00 boundaries are asserted there.
  - name: err_contract_not_active_covered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_CONTRACT_NOT_ACTIVE]
    excluded_because:
      difficulty_instance: non_linear_state_machine / contract_suspension_cycle_and_termination_branch
      rationale: Shipment creation under SUSPENDED and TERMINATED is asserted there.
  - name: err_shift_not_published_covered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_SHIFT_NOT_PUBLISHED]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / assignment_requires_shift_published
      rationale: Asserted as the failing leg of that instance.
  - name: err_batch_quarantined_on_ship_covered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_BATCH_QUARANTINED]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / ship_safety_violation_beats_window_closed
      rationale: Asserted as the winning error of that priority conflict.
  - name: err_sanitation_recency_missing_covered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_SANITATION_RECENCY_MISSING]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / pack_requires_recent_passed_sanitation
      rationale: Asserted at the 75h-over-72h edge there.
  - name: err_rack_not_operating_on_harvest_covered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_RACK_NOT_OPERATING]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / harvest_requires_rack_operating
      rationale: Asserted there; the batch-create leg is covered by corner rack_not_operating_blocks_batch_create.
  - name: err_shipment_in_flight_covered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_SHIPMENT_IN_FLIGHT]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / contract_suspend_blocked_by_packed_shipment
      rationale: Asserted there.
  - name: err_shipment_window_closed_covered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_SHIPMENT_WINDOW_CLOSED]
    excluded_because:
      difficulty_instance: boundary_precision_check / ship_window_end_inclusive_boundary
      rationale: The inclusive-end boundary and one-second-late rejection are asserted there.
