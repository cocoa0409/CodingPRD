  # =========================================================================
  - section: consistency_model
    instances:

      - name: manual_credit_memo_moves_the_balance_within_the_same_request
        claim_type: immediate
        grounds:
          - calculations.contract_credit_balance
          - endpoints[POST /credit-memos]
          - entities.CreditMemo.fields.reason
        distinguishing_aspect: "consistency_model is immediate: a GOODWILL memo of 1000 cents raises credit_balance_cents from 0 to 1000 and bumps ServiceContract.version by exactly 1, both observable on the very next read with no reconciliation step."
        test_recipe:
          setup:
            - "One ACTIVE ServiceContract with credit_balance_cents 0 and no memos."
          setup_api_calls:
            - call: "POST /service-contracts"
              payload: { client_name: "Immediate Corp", site_type: "CORPORATE", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { cim: $.data.id }
            - call: "POST /service-contracts/${cim}/activate"
              payload: {}
              as: ContractAdmin
              captures: { cim_v: $.data.version }
          trigger:
            - call: "POST /credit-memos"
              payload: { contract_id: "${cim}", amount_cents: 1000, reason: "GOODWILL" }
              as: ClientLiaison
              captures: { mim: $.data.id, mim_status: $.data.status }
            - call: "GET /service-contracts/${cim}"
              payload: {}
              as: ContractAdmin
