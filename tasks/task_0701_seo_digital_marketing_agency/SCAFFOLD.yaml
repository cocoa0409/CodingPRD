    side_effects: ["logical clock advances; affects overdue penalties and sprint-window checks"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH, http: 401, condition: "X-User-Role / X-User-ID header missing or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "entity_backed actor targets a resource it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or FK-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, invalid enum, or numeric out of range" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state permitting this transition" }
  - { id: ERR_STALE_RETAINER_VERSION, http: 412, condition: "expected_retainer_version != current Retainer.version (OCC)" }
  - { id: ERR_RETAINER_NOT_ACTIVE, http: 409, condition: "Operation requires linked Retainer.status == ACTIVE" }
  - { id: ERR_RETAINER_NOT_SIGNABLE, http: 409, condition: "Contract sign requires linked Retainer in DRAFT or ACTIVE" }
  - { id: ERR_CLIENT_NOT_AUDITED, http: 409, condition: "Operation requires Client.status IN {AUDITED, ACTIVE}" }
  - { id: ERR_CONTRACT_STILL_BINDING, http: 409, condition: "Client churn blocked: a Contract is ACTIVE or RENEWED" }
  - { id: ERR_CAMPAIGN_HAS_OPEN_DISPUTE, http: 409, condition: "Invoice blocked: campaign has OPEN/UNDER_REVIEW dispute" }
  - { id: ERR_DISPUTE_EXCEEDS_SPEND, http: 409, condition: "UPHELD credit would exceed AdCampaign.spent_cents" }
  - { id: ERR_BUDGET_EXCEEDED, http: 409, condition: "Recorded spend would push spent_cents above budget_cents" }
  - { id: ERR_OPTIMIZATION_THRESHOLD_NOT_MET, http: 409, condition: "GBP optimize requires optimization_score >= 80" }
  - { id: ERR_SPRINT_HAS_OPEN_WORK, http: 409, condition: "Sprint close blocked: open ASSIGNED/IN_PROGRESS/IN_REVIEW deliverables" }
  - { id: ERR_INVALID_SPRINT_WINDOW, http: 422, condition: "ends_at <= starts_at, or assign outside an ACTIVE sprint's window" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "Duplicate KeywordTarget.phrase (non-DROPPED) or GbpListing.service_area (VERIFIED/OPTIMIZED) per client" }
  - { id: ERR_SPRINT_CAPACITY_EXCEEDED, http: 409, condition: "Deliverable assign would exceed Sprint.capacity_credits" }
  - { id: ERR_INSUFFICIENT_CREDITS, http: 409, condition: "Retainer.credits_available < deliverable credit_cost on assign" }
  - { id: ERR_SPRINT_WINDOW_OVERLAP, http: 409, condition: "New Sprint window overlaps an existing PLANNING/ACTIVE sprint on the same retainer (half-open [start,end))" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 409, condition: "New Report period overlaps (or is within REPORT_GAP_DAYS=1 buffer of) an existing Report period for the same client" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: AgencyAdmin
    description: "Agency operator with full control across all resources and resellers"
    identity: "opaque"
    exclusive_operations:
      - "POST /resellers"
      - "GET /resellers (list)"
    shared_operations:
      - "create/manage clients, audits, keywords, snapshots, retainers, contracts, sprints, deliverables, ad-campaigns, disputes, gbp-listings, reports"
      - "POST /_clock/set_current_utc"

  - name: AccountManager
    description: "Agency staff running day-to-day client operations; opaque operator (not a persisted entity)"
    identity: "opaque"
    exclusive_operations:
      - "POST /clients/{id}/pause"
      - "POST /clients/{id}/resume"
      - "POST /clients/{id}/churn"
      - "POST /deliverables/{id}/assign"
      - "POST /deliverables/{id}/reject"
      - "POST /retainers/{id}/rollover"
      - "POST /ad-spend-disputes/{id}/review"
      - "POST /ad-spend-disputes/{id}/resolve"
    shared_operations:
      - "create/read clients, audits, keywords, snapshots, retainers, contracts, sprints, deliverables, ad-campaigns, disputes, gbp-listings, reports"
      - "retainer activate/suspend/close; contract activate/renew/terminate; sprint start/close; campaign launch/pause/end/record-spend/invoice/settle; gbp verify/optimize/suspend"

  - name: Reseller
    description: "White-label partner that resells agency services to its own clients under its own brand"
    identity: "entity_backed:Reseller"
    exclusive_operations: []
    shared_operations:
      - "POST /clients (for own clients, reseller_id == self)"
      - "GET own clients, retainers, contracts, ad-campaigns, reports"

  - name: Client
    description: "End client of the agency (or of a reseller); approves deliverables, signs contracts, raises disputes"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /contracts/{id}/sign"
      - "POST /deliverables/{id}/request_revision"
      - "POST /deliverables/{id}/approve"
      - "POST /deliverables/{id}/withdraw (dispute withdraw)"
    shared_operations:
      - "GET own clients, audits, keywords, snapshots, retainers, contracts, sprints, deliverables, ad-campaigns, disputes, gbp-listings, reports"
      - "POST /ad-spend-disputes (own client)"
