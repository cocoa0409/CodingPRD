      - name: scan_weighted_item_with_zero_weight_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_WEIGHT]"]
        distinguishing_aspect: "weight_grams 0 on a WEIGHTED item violates the strict > 0 boundary: ERR_INVALID_WEIGHT (zero-weight produce bags are not scannable)."
        test_recipe:
          setup: ["Club, WEIGHTED item 250c/lb, CLUB member, clock 12:00, session OPEN"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
