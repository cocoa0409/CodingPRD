        distinguishing_aspect: |
          Entity pair StoreKitConfig → FixturePrototype: freeze is gated on the
          referenced prototype being APPROVED or LOCKED; a kit whose prototype
          sits in ENGINEERING_REVIEW is rejected with
          ERR_PROTOTYPE_NOT_APPROVED while its own state stays DRAFT.
