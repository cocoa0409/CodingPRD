            - { call: "POST /institutions/${inst_id}/suspend", payload: {}, as: ClearinghouseOps, captures: { err_susp: "$.data.error_id" } }
            - { call: "POST /institutions/${inst_id}/reinstate", payload: {}, as: ClearinghouseOps, captures: { s2: "$.data.status", r2: "$.data.suspension_reason" } }
            - { call: "POST /institutions/${inst_id}/reinstate", payload: {}, as: ClearinghouseOps, captures: { err_rein: "$.data.error_id" } }
          assert:
            - "captured s1 == SUSPENDED and r1 == OPS"
            - "captured err_susp == ERR_INVALID_STATE (already SUSPENDED)"
            - "captured s2 == ACTIVE and r2 == NONE"
            - "captured err_rein == ERR_INVALID_STATE (already ACTIVE)"

      - name: ops_suspend_cancels_quoted_and_paid_requests
        claim_type: side_effect_execution
        grounds:
          - state_machines.Institution.ACTIVE_to_SUSPENDED
          - state_machines.VerificationRequest.QUOTED_to_CANCELLED
          - state_machines.VerificationRequest.PAID_to_CANCELLED
          - entities.Requester.fields.credit_balance_cents
        distinguishing_aspect: "Ops suspension cancels in-flight requests asymmetrically: a QUOTED request is CANCELLED with refund_cents 0 (nothing was paid), while a PAID request is CANCELLED with refund_cents == fee_cents credited back to the requester balance."
        test_recipe:
