              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { bg_id: $.data.id }
          trigger:
            - call: "POST /sfsp/sponsor-budgets/${bg_id}/decision"
              payload: { decision: "APPROVED", approved_operating_cost_cents: 4500000, approved_admin_cost_cents: 700000 }
              as: StateAgencyReviewer
              captures: { e_state: $.data.error_id }
            - call: "POST /sfsp/sponsor-budgets/${bg_id}/submit"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
            - call: "POST /sfsp/sponsor-budgets/${bg_id}/decision"
              payload: { decision: "APPROVED", approved_operating_cost_cents: 6000000, approved_admin_cost_cents: 700000 }
              as: StateAgencyReviewer
              captures: { e_ceiling: $.data.error_id }
            - call: "POST /sfsp/sponsor-budgets/${bg_id}/decision"
              payload: { decision: "APPROVED", approved_operating_cost_cents: 4500000, approved_admin_cost_cents: 700000 }
              as: StateAgencyReviewer
              captures: { bg_status: $.data.status }
            - call: "GET /sfsp/sponsors/${sp_id}"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { sp_ver: $.data.version }
            - call: "POST /sfsp/advance-payments"
              payload: { sponsor_id: "${sp_id}", request_month: "2026-06", requested_amount_cents: 30000, expected_sponsor_version: "${sp_ver}" }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { adv_id: $.data.id }
            - call: "POST /sfsp/advance-payments/${adv_id}/decision"
              payload: { decision: "APPROVED", approved_amount_cents: 40000 }
              as: StateAgencyReviewer
              captures: { e_over: $.data.error_id }
            - call: "POST /sfsp/advance-payments/${adv_id}/decision"
              payload: { decision: "APPROVED", approved_amount_cents: 30000 }
