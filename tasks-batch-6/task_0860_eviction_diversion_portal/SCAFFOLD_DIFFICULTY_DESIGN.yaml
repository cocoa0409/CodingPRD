# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances
# Logical-clock startup default: 2026-05-01T00:00:00Z
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: case_net_arrears_provisional_vs_final
        grounds:
          - calculations.case_net_arrears
          - entities.Case.fields.net_arrears_cents
          - state_machines.Installment.DUE_to_PAID
        distinguishing_aspect: |
          On the Case domain, net_arrears_cents equals claimed_arrears_cents (provisional, 600000)
          at filing but drops to 500000 (final) after one 100000 installment is PAID — the two
          variants diverge by exactly the PAID amount.
        test_recipe:
          setup:
            - "A NONPAYMENT case, claimed_arrears_cents=600000, SERVED then ANSWERED"
            - "An ACCEPTED payment plan total 600000 over 6 installments (100000 each)"
          setup_api_calls:
            - call: "POST /courts"
              payload: { name: "HC", jurisdiction_code: "J1", hearing_daily_capacity: 2 }
              as: Clerk
              captures: { court_id: $.data.id }
            - call: "POST /landlords"
              payload: { name: "LL", email: "l@x.com" }
              as: Clerk
              captures: { ll_id: $.data.id }
            - call: "POST /tenants"
              payload: { name: "TN", email: "t@x.com", household_income_cents: 200000, household_size: 3 }
              as: Clerk
              captures: { tn_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", landlord_id: "${ll_id}", tenant_id: "${tn_id}", filing_type: "NONPAYMENT", claimed_arrears_cents: 600000 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "SERVED" }
              as: Clerk
            - call: "POST /answers"
              payload: { case_id: "${case_id}", defenses: ["RENT_PAID"] }
              as: Tenant
              as_user_id: "${tn_id}"
            - call: "GET /cases/${case_id}"
              as: Clerk
              captures: { case_v: $.data.version }
            - call: "POST /payment-plans"
              payload: { case_id: "${case_id}", proposed_by: "LANDLORD", total_cents: 600000, installment_count: 6, first_due_date: "2026-05-20T00:00:00Z", expected_case_version: "${case_v}" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /payment-plans/${plan_id}/respond"
              payload: { decision: "ACCEPT" }
              as: Tenant
              as_user_id: "${tn_id}"
            - call: "GET /installments?payment_plan_id=${plan_id}"
              as: Clerk
              captures: { inst1_id: "$.data[0].id" }
          trigger:
            - call: "POST /installments/${inst1_id}/transition"
              payload: { to_status: "PAID" }
              as: Tenant
              as_user_id: "${tn_id}"
          assert:
            - "Case.${case_id}.net_arrears_cents == 500000"
            - "Installment.${inst1_id}.status == PAID"
            - "Installment.${inst1_id}.amount_cents == 100000"

      - name: rental_assistance_requested_vs_disbursed
        grounds:
          - calculations.rental_assistance_award
          - entities.Referral.fields.requested_amount_cents
          - entities.Referral.fields.disbursed_amount_cents
          - state_machines.Referral.APPROVED_to_DISBURSED
        distinguishing_aspect: |
          On the Referral domain, requested_amount_cents is 500000 (income cap binds at approval,
          net arrears 600000) but disbursed_amount_cents is 400000 because a 200000 installment was
          PAID between APPROVED and DISBURSED, dropping net arrears below the requested award.
        test_recipe:
          setup:
            - "Case claimed 600000, ANSWERED, IN_DIVERSION via a RENTAL_ASSISTANCE referral APPROVED (requested=500000)"
            - "An ACCEPTED plan total 600000 over 3 installments (200000 each); installment 1 PAID -> net arrears 400000"
          setup_api_calls:
            - call: "POST /courts"
              payload: { name: "HC", jurisdiction_code: "J1", hearing_daily_capacity: 2 }
              as: Clerk
              captures: { court_id: $.data.id }
            - call: "POST /landlords"
              payload: { name: "LL", email: "l@x.com" }
              as: Clerk
              captures: { ll_id: $.data.id }
            - call: "POST /tenants"
              payload: { name: "TN", email: "t@x.com", household_income_cents: 200000, household_size: 3 }
              as: Clerk
              captures: { tn_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", landlord_id: "${ll_id}", tenant_id: "${tn_id}", filing_type: "NONPAYMENT", claimed_arrears_cents: 600000 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "SERVED" }
              as: Clerk
            - call: "POST /answers"
              payload: { case_id: "${case_id}", defenses: ["RENT_PAID"] }
              as: Tenant
              as_user_id: "${tn_id}"
            - call: "POST /referrals"
              payload: { case_id: "${case_id}", referral_type: "RENTAL_ASSISTANCE", provider_name: "RA" }
              as: Tenant
              as_user_id: "${tn_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/transition"
              payload: { to_status: "APPROVED" }
              as: ProgramAdmin
            - call: "GET /cases/${case_id}"
              as: Clerk
              captures: { case_v: $.data.version }
            - call: "POST /payment-plans"
              payload: { case_id: "${case_id}", proposed_by: "LANDLORD", total_cents: 600000, installment_count: 3, first_due_date: "2026-05-20T00:00:00Z", expected_case_version: "${case_v}" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /payment-plans/${plan_id}/respond"
              payload: { decision: "ACCEPT" }
              as: Tenant
              as_user_id: "${tn_id}"
            - call: "GET /installments?payment_plan_id=${plan_id}"
              as: Clerk
              captures: { inst1_id: "$.data[0].id" }
            - call: "POST /installments/${inst1_id}/transition"
              payload: { to_status: "PAID" }
              as: Tenant
              as_user_id: "${tn_id}"
          trigger:
            - call: "POST /referrals/${ref_id}/transition"
              payload: { to_status: "DISBURSED" }
              as: ProgramAdmin
          assert:
            - "Referral.${ref_id}.requested_amount_cents == 500000"
            - "Referral.${ref_id}.disbursed_amount_cents == 400000"
            - "Case.${case_id}.net_arrears_cents == 0"

  - rule_id: combinatorial_formula
    instances:
      - name: rental_assistance_award_nested_min_income_cap_binds
        grounds:
          - calculations.rental_assistance_award
          - entities.Tenant.fields.household_size
          - state_machines.Referral.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Mode (a): award = min(net_arrears 600000, income_cap 500000, budget 5000000) over THREE
          independent inputs; the income cap (300000 + (3-1)*100000 = 500000) is the binding term,
          not arrears and not budget, so requested_amount_cents == 500000.
        test_recipe:
          setup:
            - "Case claimed 600000, ANSWERED; tenant household_size=3; a RENTAL_ASSISTANCE referral SUBMITTED"
          setup_api_calls:
            - call: "POST /courts"
              payload: { name: "HC", jurisdiction_code: "J1", hearing_daily_capacity: 2 }
              as: Clerk
              captures: { court_id: $.data.id }
            - call: "POST /landlords"
              payload: { name: "LL", email: "l@x.com" }
              as: Clerk
              captures: { ll_id: $.data.id }
            - call: "POST /tenants"
              payload: { name: "TN", email: "t@x.com", household_income_cents: 200000, household_size: 3 }
              as: Clerk
              captures: { tn_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", landlord_id: "${ll_id}", tenant_id: "${tn_id}", filing_type: "NONPAYMENT", claimed_arrears_cents: 600000 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "SERVED" }
              as: Clerk
            - call: "POST /answers"
              payload: { case_id: "${case_id}", defenses: ["RENT_PAID"] }
              as: Tenant
              as_user_id: "${tn_id}"
            - call: "POST /referrals"
              payload: { case_id: "${case_id}", referral_type: "RENTAL_ASSISTANCE", provider_name: "RA" }
              as: Tenant
              as_user_id: "${tn_id}"
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /referrals/${ref_id}/transition"
              payload: { to_status: "APPROVED" }
              as: ProgramAdmin
          assert:
            - "Referral.${ref_id}.requested_amount_cents == 500000"
            - "Referral.${ref_id}.status == APPROVED"

      - name: installment_schedule_remainder_to_last
        grounds:
          - calculations.installment_schedule
          - entities.Installment.fields.amount_cents
          - state_machines.PaymentPlan.PROPOSED_to_ACCEPTED
        distinguishing_aspect: |
          Mode (b): floor-per-line-then-remainder-to-last. total 100000 over 3 gives base=33333,
          remainder=1 assigned to the FINAL installment: amounts [33333, 33333, 33334] summing to
          exactly 100000 — divergent from a sum-then-divide reading.
        test_recipe:
          setup:
            - "Case claimed 100000, ANSWERED; a plan total 100000 over 3 installments ACCEPTED"
          setup_api_calls:
            - call: "POST /courts"
              payload: { name: "HC", jurisdiction_code: "J1", hearing_daily_capacity: 2 }
              as: Clerk
              captures: { court_id: $.data.id }
            - call: "POST /landlords"
              payload: { name: "LL", email: "l@x.com" }
              as: Clerk
              captures: { ll_id: $.data.id }
            - call: "POST /tenants"
              payload: { name: "TN", email: "t@x.com", household_income_cents: 200000, household_size: 3 }
              as: Clerk
              captures: { tn_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", landlord_id: "${ll_id}", tenant_id: "${tn_id}", filing_type: "NONPAYMENT", claimed_arrears_cents: 100000 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "SERVED" }
              as: Clerk
            - call: "POST /answers"
              payload: { case_id: "${case_id}", defenses: ["RENT_PAID"] }
              as: Tenant
              as_user_id: "${tn_id}"
            - call: "GET /cases/${case_id}"
              as: Clerk
              captures: { case_v: $.data.version }
            - call: "POST /payment-plans"
              payload: { case_id: "${case_id}", proposed_by: "LANDLORD", total_cents: 100000, installment_count: 3, first_due_date: "2026-05-20T00:00:00Z", expected_case_version: "${case_v}" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /payment-plans/${plan_id}/respond"
              payload: { decision: "ACCEPT" }
              as: Tenant
              as_user_id: "${tn_id}"
          assert:
            - "Installment where payment_plan_id==${plan_id} and sequence==1 has amount_cents == 33333"
            - "Installment where payment_plan_id==${plan_id} and sequence==2 has amount_cents == 33333"
            - "Installment where payment_plan_id==${plan_id} and sequence==3 has amount_cents == 33334"

  - rule_id: non_linear_state_machine
    instances:
      - name: payment_plan_counter_negotiation_cycle
        grounds:
          - state_machines.PaymentPlan.PROPOSED_to_COUNTERED
          - state_machines.PaymentPlan.COUNTERED_to_PROPOSED
          - entities.PaymentPlan.fields.current_proposer
        distinguishing_aspect: |
          On PaymentPlan, the negotiation cycles PROPOSED -> COUNTERED -> PROPOSED with current_proposer
          flipping TENANT -> LANDLORD -> TENANT, a genuine A<->B loop distinct from any linear pipeline.
        test_recipe:
          setup:
            - "Case claimed 600000, ANSWERED; a plan PROPOSED by LANDLORD (current_proposer=TENANT)"
          setup_api_calls:
            - call: "POST /courts"
              payload: { name: "HC", jurisdiction_code: "J1", hearing_daily_capacity: 2 }
              as: Clerk
              captures: { court_id: $.data.id }
            - call: "POST /landlords"
              payload: { name: "LL", email: "l@x.com" }
              as: Clerk
              captures: { ll_id: $.data.id }
            - call: "POST /tenants"
              payload: { name: "TN", email: "t@x.com", household_income_cents: 200000, household_size: 3 }
              as: Clerk
              captures: { tn_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", landlord_id: "${ll_id}", tenant_id: "${tn_id}", filing_type: "NONPAYMENT", claimed_arrears_cents: 600000 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "SERVED" }
              as: Clerk
            - call: "POST /answers"
              payload: { case_id: "${case_id}", defenses: ["RENT_PAID"] }
              as: Tenant
              as_user_id: "${tn_id}"
            - call: "GET /cases/${case_id}"
              as: Clerk
              captures: { case_v: $.data.version }
            - call: "POST /payment-plans"
              payload: { case_id: "${case_id}", proposed_by: "LANDLORD", total_cents: 600000, installment_count: 6, first_due_date: "2026-05-20T00:00:00Z", expected_case_version: "${case_v}" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /payment-plans/${plan_id}/respond"
              payload: { decision: "COUNTER", new_total_cents: 660000, new_installment_count: 6 }
              as: Tenant
              as_user_id: "${tn_id}"
            - call: "POST /payment-plans/${plan_id}/respond"
              payload: { decision: "COUNTER", new_total_cents: 600000, new_installment_count: 6 }
              as: Landlord
              as_user_id: "${ll_id}"
          assert:
            - "PaymentPlan.${plan_id}.status == PROPOSED"
            - "PaymentPlan.${plan_id}.current_proposer == TENANT"
            - "PaymentPlan.${plan_id}.total_cents == 600000"

      - name: judgment_fork_dismissal_routes_case_dismissed
        grounds:
          - state_machines.Case.IN_LITIGATION_to_DISMISSED
          - entities.Judgment.fields.judgment_type
          - entities.Case.fields.outcome
        distinguishing_aspect: |
          Judgment entry is a branching fork: judgment_type=DISMISSAL routes the case to DISMISSED with
          outcome=DISMISSED, whereas judgment_type=POSSESSION would route it to JUDGMENT_ENTERED with
          outcome=JUDGMENT_FOR_LANDLORD — divergent side-effect sets on the same creation endpoint.
        test_recipe:
          setup:
            - "Case claimed 600000, ANSWERED, moved to IN_LITIGATION"
          setup_api_calls:
            - call: "POST /courts"
              payload: { name: "HC", jurisdiction_code: "J1", hearing_daily_capacity: 2 }
              as: Clerk
              captures: { court_id: $.data.id }
            - call: "POST /landlords"
              payload: { name: "LL", email: "l@x.com" }
              as: Clerk
              captures: { ll_id: $.data.id }
            - call: "POST /tenants"
              payload: { name: "TN", email: "t@x.com", household_income_cents: 200000, household_size: 3 }
              as: Clerk
              captures: { tn_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", landlord_id: "${ll_id}", tenant_id: "${tn_id}", filing_type: "NONPAYMENT", claimed_arrears_cents: 600000 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "SERVED" }
              as: Clerk
            - call: "POST /answers"
              payload: { case_id: "${case_id}", defenses: ["RENT_PAID"] }
              as: Tenant
              as_user_id: "${tn_id}"
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "IN_LITIGATION" }
              as: Clerk
          trigger:
            - call: "POST /judgments"
              payload: { case_id: "${case_id}", judgment_type: "DISMISSAL" }
              as: Judge
              as_user_id: "judge-1"
              captures: { judg_id: $.data.id }
          assert:
            - "Judgment.${judg_id}.judgment_type == DISMISSAL"
            - "Case.${case_id}.status == DISMISSED"
            - "Case.${case_id}.outcome == DISMISSED"

  - rule_id: transitive_cascade
    instances:
      - name: referral_disburse_clears_arrears_depth3_cascade
        grounds:
          - state_machines.Referral.APPROVED_to_DISBURSED
          - state_machines.Case.IN_DIVERSION_to_DIVERSION_SATISFIED
          - state_machines.Hearing.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain from a single DISBURSE: hop1 recomputes Case.net_arrears to 0; hop2 (caused by
          arrears==0) auto-transitions the Case to DIVERSION_SATISFIED; hop3 (caused by the case terminal)
          CANCELS the SCHEDULED Hearing and frees the court slot. Origin trigger = referral disbursement.
        test_recipe:
          setup:
            - "Case claimed 200000, ANSWERED, IN_DIVERSION via a RENTAL_ASSISTANCE referral APPROVED (requested=200000)"
            - "One SCHEDULED hearing on the court"
          setup_api_calls:
            - call: "POST /courts"
              payload: { name: "HC", jurisdiction_code: "J1", hearing_daily_capacity: 2 }
              as: Clerk
              captures: { court_id: $.data.id }
            - call: "POST /landlords"
              payload: { name: "LL", email: "l@x.com" }
              as: Clerk
              captures: { ll_id: $.data.id }
            - call: "POST /tenants"
              payload: { name: "TN", email: "t@x.com", household_income_cents: 200000, household_size: 3 }
              as: Clerk
              captures: { tn_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", landlord_id: "${ll_id}", tenant_id: "${tn_id}", filing_type: "NONPAYMENT", claimed_arrears_cents: 200000 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "SERVED" }
              as: Clerk
            - call: "POST /answers"
              payload: { case_id: "${case_id}", defenses: ["RENT_PAID"] }
              as: Tenant
              as_user_id: "${tn_id}"
            - call: "POST /referrals"
              payload: { case_id: "${case_id}", referral_type: "RENTAL_ASSISTANCE", provider_name: "RA" }
              as: Tenant
              as_user_id: "${tn_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/transition"
              payload: { to_status: "APPROVED" }
              as: ProgramAdmin
            - call: "POST /hearings"
              payload: { case_id: "${case_id}", court_id: "${court_id}", hearing_type: "INITIAL", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Clerk
              captures: { hearing_id: $.data.id }
          trigger:
            - call: "POST /referrals/${ref_id}/transition"
              payload: { to_status: "DISBURSED" }
              as: ProgramAdmin
          assert:
            - "Case.${case_id}.net_arrears_cents == 0"
            - "Case.${case_id}.status == DIVERSION_SATISFIED"
            - "Hearing.${hearing_id}.status == CANCELLED"
            - "Court.${court_id}.hearings_scheduled_count == 0"

      - name: plan_default_relitigates_case_depth2_cascade
        grounds:
          - state_machines.Installment.DUE_to_MISSED
          - state_machines.PaymentPlan.ACCEPTED_to_DEFAULTED
          - state_machines.Case.IN_DIVERSION_to_IN_LITIGATION
        distinguishing_aspect: |
          Depth-2 chain from a MISSED installment: hop1 bubbles the plan to DEFAULTED; hop2 (caused by the
          plan default) relitigates the Case IN_DIVERSION -> IN_LITIGATION. Origin trigger = installment miss,
          a different triggering transition than the referral-disburse cascade.
        test_recipe:
          setup:
            - "Case claimed 600000, ANSWERED; ACCEPTED plan total 600000 over 3 installments; clock advanced past installment 1 due date"
          setup_api_calls:
            - call: "POST /courts"
              payload: { name: "HC", jurisdiction_code: "J1", hearing_daily_capacity: 2 }
              as: Clerk
              captures: { court_id: $.data.id }
            - call: "POST /landlords"
              payload: { name: "LL", email: "l@x.com" }
              as: Clerk
              captures: { ll_id: $.data.id }
            - call: "POST /tenants"
              payload: { name: "TN", email: "t@x.com", household_income_cents: 200000, household_size: 3 }
              as: Clerk
              captures: { tn_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", landlord_id: "${ll_id}", tenant_id: "${tn_id}", filing_type: "NONPAYMENT", claimed_arrears_cents: 600000 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "SERVED" }
              as: Clerk
            - call: "POST /answers"
              payload: { case_id: "${case_id}", defenses: ["RENT_PAID"] }
              as: Tenant
              as_user_id: "${tn_id}"
            - call: "GET /cases/${case_id}"
              as: Clerk
              captures: { case_v: $.data.version }
            - call: "POST /payment-plans"
              payload: { case_id: "${case_id}", proposed_by: "LANDLORD", total_cents: 600000, installment_count: 3, first_due_date: "2026-05-20T00:00:00Z", expected_case_version: "${case_v}" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /payment-plans/${plan_id}/respond"
              payload: { decision: "ACCEPT" }
              as: Tenant
              as_user_id: "${tn_id}"
            - call: "GET /installments?payment_plan_id=${plan_id}"
              as: Clerk
              captures: { inst1_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-21T00:00:00Z" }
              as: Clerk
          trigger:
            - call: "POST /installments/${inst1_id}/transition"
              payload: { to_status: "MISSED" }
              as: Clerk
          assert:
            - "Installment.${inst1_id}.status == MISSED"
            - "PaymentPlan.${plan_id}.status == DEFAULTED"
            - "Case.${case_id}.status == IN_LITIGATION"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_plan_accept_returns_invalid_state
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - state_machines.PaymentPlan.PROPOSED_to_REJECTED
        distinguishing_aspect: |
          Dual failure on POST /respond ACCEPT: the plan is terminal REJECTED (state, priority 6) AND its
          total 100000 < case net arrears 600000 (business_fiscal, priority 11). The state error wins:
          ERR_INVALID_STATE, not ERR_PLAN_INSUFFICIENT.
        test_recipe:
          setup:
            - "Case claimed 600000, ANSWERED; a plan total 100000 PROPOSED by LANDLORD then REJECTED by TENANT"
