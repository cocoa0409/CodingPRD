      - name: renewal_window_opens_inclusively_and_the_grace_period_closes_the_door
        claim_type: temporal_validation
        grounds:
          - validations[priority=37]
          - validations[priority=38]
          - calculations.registration_period_bounds
        distinguishing_aspect: |
          Both temporal edges of the renewal window are probed against a period ending 2028-07-31: one day
          before renewal_window_open_date (2028-05-01) is ERR_RENEWAL_WINDOW_NOT_OPEN, the open date
          itself (2028-05-02) is accepted, and on a second facility one day past grace_end_date
          (2028-09-30 versus 2028-09-29) is ERR_GRACE_PERIOD_EXPIRED — a non-recoverable 422 that leaves
          the facility unrenewed.
        test_recipe:
          setup:
            - "two facilities approved at 2026-08-01, each on the INITIAL 2026-08-01 .. 2028-07-31 period"
          setup_api_calls:
            - call: "POST /cosmetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "OPS-1"
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_a: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_a}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_a}"
            - call: "POST /cosmetics/facilities/${fac_a}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { a_open: $.data.renewal_window_open_date, a_grace: $.data.grace_end_date }
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Trenton", owner_operator_name: "Aster Holdings LLC", facility_type: "PROCESSOR", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_b: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_b}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_b}"
            - call: "POST /cosmetics/facilities/${fac_b}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
          trigger:
            - call: "POST /cosmetics/_clock/set_current_utc"
              payload: { current_utc: "2028-05-01T12:00:00Z" }
              as: SystemOperator
              as_user_id: "OPS-1"
            - call: "POST /cosmetics/facilities/${fac_a}/renewals"
              payload: { renewal_kind: "STANDARD" }
              as: FacilityRegistrant
              as_user_id: "${fac_a}"
              captures: { err_early: $.data.error_id }
            - call: "POST /cosmetics/_clock/set_current_utc"
              payload: { current_utc: "2028-05-02T00:00:00Z" }
              as: SystemOperator
              as_user_id: "OPS-1"
            - call: "POST /cosmetics/facilities/${fac_a}/renewals"
              payload: { renewal_kind: "STANDARD" }
              as: FacilityRegistrant
              as_user_id: "${fac_a}"
              captures: { ok_start: $.data.period_start, ok_kind: $.data.period_kind }
            - call: "POST /cosmetics/_clock/set_current_utc"
              payload: { current_utc: "2028-09-30T00:00:00Z" }
              as: SystemOperator
              as_user_id: "OPS-1"
            - call: "POST /cosmetics/facilities/${fac_b}/renewals"
              payload: { renewal_kind: "STANDARD" }
