              as: ProgramAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${p1}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-20T15:00:00Z", scheduled_end_utc: "2026-08-20T17:00:00Z", access_arrangement: "OWNER_PRESENT" }
              as: ProgramAdmin
              captures: { ins1: "$.data.id" }
            - call: "POST /fire-district/inspections/${ins1}/notice"
              payload: { notice_method: "CERTIFIED_MAIL" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspections/${ins1}/zone-evaluations"
              payload: { zone: "ZONE_0_EMBER", measured_clearance_ft: 5.0 }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /fire-district/inspections/${ins1}/zone-evaluations"
              payload: { zone: "ZONE_1", measured_clearance_ft: 15.0 }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /fire-district/inspections/${ins1}/zone-evaluations"
              payload: { zone: "ZONE_2", measured_clearance_ft: 118.0 }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /fire-district/inspections/${ins1}/complete"
              payload: { result: "FAIL", violation_notice_method: "CERTIFIED_MAIL" }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "GET /fire-district/violation-notices"
              payload: { parcel_id: "${p1}" }
              as: ProgramAdmin
              captures: { n1: "$.data[0].id" }
            - call: "GET /fire-district/parcels/${p1}"
              payload: {}
              as: ProgramAdmin
              captures: { p1_v: "$.data.version", open_before: "$.data.open_violation_count" }
          trigger:
            - call: "POST /fire-district/parcels/${p1}/violation-notices"
              payload: { inspection_id: "${ins1}", notice_method: "EMAIL", expected_parcel_version: "${p1_v}" }
              as: ProgramAdmin
              captures: { n2: "$.data.id", n2_sup: "$.data.supersedes_notice_id", n2_parcel: "$.data.parcel_id", n2_ins: "$.data.inspection_id", n2_deadline: "$.data.deadline_utc" }
          assert:
            - "HTTP 201 and ${n2_parcel} == \"${p1}\" and ${n2_ins} == \"${ins1}\": both referenced rows are linked on the new notice"
            - "${n2_sup} == \"${n1}\" — the self-referential link points at the notice it replaced"
            - "ViolationNotice.${n1}.status == \"VOIDED\" with void_reason == \"SUPERSEDED_BY_NEW_NOTICE\" and cleared_at_utc == null"
            - "${open_before} == 1 and Parcel.${p1}.open_violation_count is still 1 after the trigger, with compliance_status \"NON_COMPLIANT\""
            - "${n2_deadline} == \"2026-08-31T23:59:59Z\": EMAIL serves the same day (delivered_at_utc 2026-08-01T00:00:00Z) and MAJOR gives 30 compliance_days on a HIGH hazard_zone parcel (no compression)"
            - "GET /fire-district/violation-notices with supersedes_notice_id ${n1} returns total_count == 1 containing ${n2}"
            - "The same trigger with inspection_id \"ins_missing\" returns 404 ERR_INSPECTION_NOT_FOUND and leaves Parcel.${p1}.version unchanged"

  # ==========================================================================
  - section: errors
    instances:

      - name: every_unknown_id_returns_its_own_not_found_code
        claim_type: error_triggerable
        grounds:
          - validations.priority_20
          - errors[ERR_CYCLE_NOT_FOUND]
          - errors[ERR_PAYMENT_NOT_FOUND]
        distinguishing_aspect: |
          All fourteen 404 codes are separately reachable and each names ITS OWN entity — a shared
          ERR_NOT_FOUND, or a generic 404 body, is distinguishable. Existence is also resolved
          left-to-right in the declared FK order cycle_id then parcel_id, so a request whose cycle_id AND
          parcel_id are both unknown answers ERR_CYCLE_NOT_FOUND.
        test_recipe:
          setup:
            - "Empty database; clock 2026-08-01T00:00:00Z. No rows of any kind are created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /fire-district/inspection-cycles/cyc_missing"
              payload: {}
              as: ProgramAdmin
              captures: { e_cycle: "$.data.error_id" }
            - call: "GET /fire-district/communities/com_missing"
              payload: {}
              as: ProgramAdmin
              captures: { e_community: "$.data.error_id" }
            - call: "GET /fire-district/parcels/par_missing"
              payload: {}
              as: ProgramAdmin
              captures: { e_parcel: "$.data.error_id" }
            - call: "GET /fire-district/inspectors/ins_missing"
              payload: {}
              as: ProgramAdmin
              captures: { e_inspector: "$.data.error_id" }
            - call: "GET /fire-district/contractors/con_missing"
              payload: {}
              as: ProgramAdmin
              captures: { e_contractor: "$.data.error_id" }
            - call: "GET /fire-district/inspections/insp_missing"
              payload: {}
              as: ProgramAdmin
              captures: { e_inspection: "$.data.error_id" }
            - call: "GET /fire-district/zone-evaluations/ze_missing"
              payload: {}
              as: ProgramAdmin
              captures: { e_zone: "$.data.error_id" }
            - call: "GET /fire-district/hardening-findings/hf_missing"
              payload: {}
              as: ProgramAdmin
              captures: { e_finding: "$.data.error_id" }
            - call: "GET /fire-district/violation-notices/vn_missing"
              payload: {}
              as: ProgramAdmin
              captures: { e_notice: "$.data.error_id" }
            - call: "GET /fire-district/abatement-orders/ao_missing"
              payload: {}
              as: ProgramAdmin
              captures: { e_order: "$.data.error_id" }
            - call: "GET /fire-district/cost-recovery-payments/pay_missing"
              payload: {}
              as: ProgramAdmin
              captures: { e_payment: "$.data.error_id" }
            - call: "GET /fire-district/support-programs/prog_missing"
              payload: {}
              as: ProgramAdmin
              captures: { e_program: "$.data.error_id" }
            - call: "GET /fire-district/support-enrollments/enr_missing"
              payload: {}
              as: ProgramAdmin
              captures: { e_enrollment: "$.data.error_id" }
            - call: "GET /fire-district/compliance-certificates/cert_missing"
              payload: {}
              as: ProgramAdmin
              captures: { e_certificate: "$.data.error_id" }
          assert:
            - "Every call returns HTTP 404 with an error envelope carrying its own code"
            - "${e_cycle} == \"ERR_CYCLE_NOT_FOUND\", ${e_community} == \"ERR_COMMUNITY_NOT_FOUND\", ${e_parcel} == \"ERR_PARCEL_NOT_FOUND\", ${e_inspector} == \"ERR_INSPECTOR_NOT_FOUND\", ${e_contractor} == \"ERR_CONTRACTOR_NOT_FOUND\""
            - "${e_inspection} == \"ERR_INSPECTION_NOT_FOUND\", ${e_zone} == \"ERR_ZONE_EVALUATION_NOT_FOUND\", ${e_finding} == \"ERR_FINDING_NOT_FOUND\", ${e_notice} == \"ERR_NOTICE_NOT_FOUND\", ${e_order} == \"ERR_ABATEMENT_ORDER_NOT_FOUND\""
            - "${e_payment} == \"ERR_PAYMENT_NOT_FOUND\", ${e_program} == \"ERR_PROGRAM_NOT_FOUND\", ${e_enrollment} == \"ERR_ENROLLMENT_NOT_FOUND\", ${e_certificate} == \"ERR_CERTIFICATE_NOT_FOUND\""
            - "All fourteen codes are distinct — no two calls share an error_id"
            - "POST /fire-district/inspections with cycle_id \"cyc_missing\" AND parcel_id \"par_missing\" (plus otherwise valid fields) returns 404 ERR_CYCLE_NOT_FOUND, because priority 20 resolves body FKs in the declared order cycle_id then parcel_id"

      - name: missing_auth_headers_returns_401_unauthenticated
        claim_type: error_triggerable
        grounds:
          - validations.priority_10
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: |
          Priority 10 outranks every other rule: a request with no X-User-Role / X-User-ID headers is 401
          ERR_UNAUTHENTICATED even when the target id does not exist (which would otherwise be 404) and
          even when the payload is malformed (which would otherwise be 400). A blank header value counts
          as missing, and an unrecognised role value is also 401 — not 403, which is reserved for a
          recognised role absent from the endpoint's roles list.
        test_recipe:
            setup:
              - "Clock 2026-08-01T00:00:00Z; one parcel exists so the 401 cannot be confused with a 404."
            setup_api_calls:
              - call: "POST /_clock/set_current_utc"
                payload: { to_iso8601: "2026-08-01T00:00:00Z" }
                as: ProgramAdmin
              - call: "POST /fire-district/parcels"
                payload: { apn: "APN-5101", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
                as: ProgramAdmin
                captures: { p1: "$.data.id" }
            trigger:
              - call: "GET /fire-district/parcels/${p1}"
                payload: {}
                as: ProgramAdmin
                captures: { err: "$.data.error_id" }
            assert:
              - "The trigger is issued with BOTH the X-User-Role and X-User-ID headers omitted entirely"
              - "HTTP 401 and ${err} == \"ERR_UNAUTHENTICATED\""
              - "The same call with X-User-Role present but blank, and with X-User-ID blank, also returns 401 ERR_UNAUTHENTICATED"
              - "The same call with X-User-Role \"Auditor\" (not one of the seven declared roles) returns 401 ERR_UNAUTHENTICATED, not 403"
              - "GET /fire-district/parcels/par_missing with no headers returns 401 ERR_UNAUTHENTICATED, not 404 — priority 10 runs before priority 20"
              - "The same call with valid headers for role TitleAgent returns 200, proving the endpoint itself is reachable"

      - name: window_end_at_or_before_start_rejected
        claim_type: error_triggerable
        grounds:
          - validations.priority_31
          - errors[ERR_INVALID_TIME_WINDOW]
        distinguishing_aspect: |
          Priority 31 rejects a window whose end is less than OR EQUAL to its start, so a zero-length
          window (end == start) is refused with 422 ERR_INVALID_TIME_WINDOW rather than accepted as an
          instantaneous visit; it is a 422, not the generic 400, because both fields are present and
          well-formed.
        test_recipe:
          setup:
            - "Active cycle, one ACTIVE ADVANCED inspector and one HIGH-risk parcel; clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Ivan Ruiz", certification_level: "ADVANCED", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-5201", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id" }
          trigger:
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${p1}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-20T15:00:00Z", scheduled_end_utc: "2026-08-20T15:00:00Z", access_arrangement: "EXTERIOR_ONLY" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 and ${err} == \"ERR_INVALID_TIME_WINDOW\" for the zero-length window"
            - "GET /fire-district/inspections with cycle_id ${cyc} returns total_count == 0"
            - "The same payload with scheduled_end_utc 2026-08-20T14:00:00Z (end before start) also returns 422 ERR_INVALID_TIME_WINDOW"
            - "The same payload with scheduled_end_utc 2026-08-20T15:00:01Z returns 201 — one second of positive length is enough"
            - "POST /fire-district/support-programs with service_window_end_utc equal to service_window_start_utc returns the same 422 ERR_INVALID_TIME_WINDOW"

      - name: duplicate_apn_registration_rejected
        claim_type: error_triggerable
        grounds:
          - validations.priority_34
          - errors[ERR_APN_ALREADY_REGISTERED]
          - entities.Parcel.fields.apn
        distinguishing_aspect: |
          The APN uniqueness conflict is a 409 keyed on apn ALONE — a second parcel with the same apn but
          a different owner and address is still refused, and the first parcel is left untouched (no
          partial second row, no version bump).
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one parcel registered under apn APN-5301."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-5301", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id", p1_v: "$.data.version" }
          trigger:
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-5301", owner_name: "Ben Ortiz", owner_email: "ben@example.com", situs_address: "99 Canyon Way", roof_class: "CLASS_A", vegetation_type: "GRASS", slope_pct: 10, lot_area_sqft: 20000, hazard_zone: "MODERATE", access_constraint: "NONE" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 and ${err} == \"ERR_APN_ALREADY_REGISTERED\" even though every other field differs"
            - "GET /fire-district/parcels returns total_count == 1 and Parcel.${p1}.version == ${p1_v} == 1"
            - "Parcel.${p1}.owner_name is still \"Ann Reyes\" — the refused create did not overwrite the incumbent"
            - "The same payload with apn \"APN-5302\" returns 201, so nothing else in the payload was at fault"

      - name: duplicate_zone_evaluation_rejected
        claim_type: error_triggerable
        grounds:
          - validations.priority_40
          - errors[ERR_ZONE_ALREADY_EVALUATED]
          - entities.ZoneEvaluation.fields.zone
        distinguishing_aspect: |
          Zone uniqueness is scoped to the INSPECTION, not to the parcel or the zone globally: a second
          ZONE_1 row on the same inspection is refused 409 ERR_ZONE_ALREADY_EVALUATED even with a
          different measured_clearance_ft, and the stored row keeps its ORIGINAL measurement (no
          upsert), while ZONE_1 on a different inspection of the same parcel is accepted.
        test_recipe:
          setup:
            - "Active cycle; one HIGH-risk parcel; a NOTICED inspection with ZONE_1 already evaluated at 15.0 ft."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Ivan Ruiz", certification_level: "ADVANCED", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-5401", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${p1}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-20T15:00:00Z", scheduled_end_utc: "2026-08-20T17:00:00Z", access_arrangement: "EXTERIOR_ONLY" }
              as: ProgramAdmin
              captures: { ins1: "$.data.id" }
            - call: "POST /fire-district/inspections/${ins1}/notice"
              payload: { notice_method: "IN_PERSON" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspections/${ins1}/zone-evaluations"
              payload: { zone: "ZONE_1", measured_clearance_ft: 15.0 }
              as: Inspector
              as_user_id: "${insp1}"
              captures: { ze1: "$.data.id", ze1_measured: "$.data.measured_clearance_ft" }
          trigger:
            - call: "POST /fire-district/inspections/${ins1}/zone-evaluations"
              payload: { zone: "ZONE_1", measured_clearance_ft: 40.0 }
              as: Inspector
              as_user_id: "${insp1}"
              captures: { err: "$.data.error_id" }
          assert:
            - "${ze1_measured} == 15.0 before the trigger"
            - "HTTP 409 and ${err} == \"ERR_ZONE_ALREADY_EVALUATED\""
            - "ZoneEvaluation.${ze1}.measured_clearance_ft is still 15.0 and its deficiency fields are unchanged: the endpoint is not an upsert"
            - "GET /fire-district/zone-evaluations with inspection_id ${ins1} returns total_count == 1"
            - "POST /fire-district/inspections/${ins1}/zone-evaluations with zone ZONE_2 and measured_clearance_ft 118.0 returns 201, so only the repeated zone is blocked"

      - name: scheduling_on_planning_cycle_returns_cycle_not_active
        claim_type: error_triggerable
        grounds:
          - validations.priority_42
          - errors[ERR_CYCLE_NOT_ACTIVE]
          - state_machines.InspectionCycle.initial_state
        distinguishing_aspect: |
          A freshly created cycle is PLANNING, so every cycle-scoped write against it is refused 409
          ERR_CYCLE_NOT_ACTIVE — distinct from ERR_INVALID_STATE, which is reserved for the target
          entity's own status — and the same request succeeds unchanged the moment the cycle is activated.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; a cycle left in PLANNING; one ACTIVE ADVANCED inspector; one HIGH-risk parcel."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id", cyc_status: "$.data.status" }
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Ivan Ruiz", certification_level: "ADVANCED", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-5501", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id" }
          trigger:
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${p1}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-20T15:00:00Z", scheduled_end_utc: "2026-08-20T17:00:00Z", access_arrangement: "EXTERIOR_ONLY" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "${cyc_status} == \"PLANNING\" — the declared initial state, with activated_at_utc == null"
            - "HTTP 409 and ${err} == \"ERR_CYCLE_NOT_ACTIVE\" (not ERR_INVALID_STATE)"
            - "GET /fire-district/inspections with cycle_id ${cyc} returns total_count == 0"
            - "POST /fire-district/support-programs against the same PLANNING cycle also returns 409 ERR_CYCLE_NOT_ACTIVE"
            - "After POST /fire-district/inspection-cycles/${cyc}/activate the identical trigger returns 201 with status SCHEDULED"

      - name: duplicate_enrollment_rejected
        claim_type: error_triggerable
        grounds:
          - validations.priority_40
          - errors[ERR_DUPLICATE_ENROLLMENT]
          - entities.SupportEnrollment.fields.parcel_id
        distinguishing_aspect: |
          Uniqueness is on the (support_program_id, parcel_id) pair while the incumbent enrollment is in
          any of REQUESTED, APPROVED, WAITLISTED, COMPLETED or REIMBURSED: the second attempt is 409
          ERR_DUPLICATE_ENROLLMENT and reserves nothing, yet the SAME parcel may enrol in a DIFFERENT
          program, and a CANCELLED enrollment frees the pair for re-enrollment.
        test_recipe:
          setup:
            - "Active cycle; one HIGH-risk parcel; two CHIPPER_DAY programs; the parcel already APPROVED on program 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-5601", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /fire-district/support-programs"
              payload: { cycle_id: "${cyc}", program_type: "CHIPPER_DAY", budget_total_cents: 0, capacity_slots: 4, service_window_start_utc: "2026-08-01T00:00:00Z", service_window_end_utc: "2026-12-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { prog1: "$.data.id", prog1_v1: "$.data.version" }
            - call: "POST /fire-district/support-programs"
              payload: { cycle_id: "${cyc}", program_type: "CURBSIDE_COLLECTION", budget_total_cents: 0, capacity_slots: 4, service_window_start_utc: "2026-08-01T00:00:00Z", service_window_end_utc: "2026-12-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { prog2: "$.data.id", prog2_v1: "$.data.version" }
            - call: "POST /fire-district/support-enrollments"
              payload: { support_program_id: "${prog1}", parcel_id: "${p1}", expected_program_version: "${prog1_v1}" }
              as: ProgramAdmin
              captures: { en1: "$.data.id", en1_status: "$.data.status" }
            - call: "GET /fire-district/support-programs/${prog1}"
              payload: {}
              as: ProgramAdmin
              captures: { prog1_v2: "$.data.version", prog1_slots: "$.data.reserved_slots" }
          trigger:
            - call: "POST /fire-district/support-enrollments"
              payload: { support_program_id: "${prog1}", parcel_id: "${p1}", expected_program_version: "${prog1_v2}" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "${en1_status} == \"APPROVED\", ${prog1_v2} == 2 and ${prog1_slots} == 1"
            - "HTTP 409 and ${err} == \"ERR_DUPLICATE_ENROLLMENT\""
            - "SupportProgram.${prog1}.reserved_slots is still 1 and version is still ${prog1_v2}"
            - "GET /fire-district/support-enrollments with parcel_id ${p1} returns total_count == 1"
            - "POST /fire-district/support-enrollments for ${prog2} with the same parcel and expected_program_version ${prog2_v1} returns 201 APPROVED — the pair, not the parcel, is unique"
            - "After POST /fire-district/support-enrollments/${en1}/cancel with reason \"Owner rescheduled\", re-enrolling ${p1} on ${prog1} with the then-current version succeeds"

      - name: cost_share_invoice_above_cap_rejected
        claim_type: error_triggerable
        grounds:
          - validations.priority_74
          - errors[ERR_COST_SHARE_CAP_EXCEEDED]
          - calculations.cost_share_award.constants
        distinguishing_aspect: |
          COST_SHARE_INVOICE_CAP_CENTS (1000000) is an ELIGIBILITY gate on the raw submitted invoice, not
          the same thing as PER_PARCEL_CAP_CENTS (250000) which merely truncates the eligible cost: an
          invoice of exactly 1000000 is accepted and yields an award computed off the 250000 truncation,
          while 1000001 is refused 422 ERR_COST_SHARE_CAP_EXCEEDED.
        test_recipe:
          setup:
            - "Active cycle; a COST_SHARE_GRANT program with budget 500000 and 3 slots; two HIGH-risk parcels with owner_hardship_flag false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-5701", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { pA: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-5702", owner_name: "Ben Ortiz", owner_email: "ben@example.com", situs_address: "14 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { pB: "$.data.id" }
            - call: "POST /fire-district/support-programs"
              payload: { cycle_id: "${cyc}", program_type: "COST_SHARE_GRANT", budget_total_cents: 500000, capacity_slots: 3, service_window_start_utc: "2026-08-01T00:00:00Z", service_window_end_utc: "2026-12-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { prog: "$.data.id", prog_v1: "$.data.version" }
            - call: "POST /fire-district/support-enrollments"
              payload: { support_program_id: "${prog}", parcel_id: "${pA}", vendor_invoice_cents: 1000000, expected_program_version: "${prog_v1}" }
              as: ProgramAdmin
              captures: { enA: "$.data.id", enA_status: "$.data.status", enA_before: "$.data.award_before_bonus_cents", enA_award: "$.data.award_cents" }
            - call: "GET /fire-district/support-programs/${prog}"
              payload: {}
              as: ProgramAdmin
              captures: { prog_v2: "$.data.version", prog_budget: "$.data.budget_remaining_cents" }
          trigger:
            - call: "POST /fire-district/support-enrollments"
              payload: { support_program_id: "${prog}", parcel_id: "${pB}", vendor_invoice_cents: 1000001, expected_program_version: "${prog_v2}" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "${enA_status} == \"APPROVED\" with ${enA_before} == 150000 and ${enA_award} == 150000: an invoice exactly AT the cap is eligible, truncated to PER_PARCEL_CAP_CENTS 250000 and matched at 0.60 for risk_class HIGH, with bonus_pct 0.05 but hardship_bonus_cents 0"
            - "${prog_budget} == 350000 and ${prog_v2} == 2 after parcel A"
            - "HTTP 422 on the trigger and ${err} == \"ERR_COST_SHARE_CAP_EXCEEDED\" for one cent above the cap"
            - "SupportProgram.${prog}.budget_remaining_cents is still 350000, reserved_slots == 1 and version is still ${prog_v2}"
            - "It is not ERR_INVALID_REQUEST: 1000001 is a well-formed non-negative integer"

      - name: award_to_unlicensed_or_uninsured_contractor_rejected
        claim_type: error_triggerable
        grounds:
          - validations.priority_66
          - errors[ERR_CONTRACTOR_NOT_LICENSED]
          - errors[ERR_CONTRACTOR_INSURANCE_LAPSED]
        distinguishing_aspect: |
          Priority 66 carries two distinct codes on the same endpoint: a SUSPENDED license answers
          ERR_CONTRACTOR_NOT_LICENSED, while an ACTIVE license whose insurance_expiry_utc falls at or
          before work_start_utc answers ERR_CONTRACTOR_INSURANCE_LAPSED — insurance is keyed on
          work_START, so a window starting exactly at the expiry instant is already uninsured.
        test_recipe:
            setup:
              - "One OVERDUE notice authorized for abatement (order oA); contractor c_bad with license_status SUSPENDED; contractor c_lapsed ACTIVE with insurance_expiry_utc 2026-10-05T08:00:00Z."
            setup_api_calls:
              - call: "POST /_clock/set_current_utc"
                payload: { to_iso8601: "2026-08-01T00:00:00Z" }
                as: ProgramAdmin
              - call: "POST /fire-district/inspection-cycles"
                payload: { season_year: 2026 }
                as: ProgramAdmin
                captures: { cyc: "$.data.id" }
              - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
                payload: {}
                as: ProgramAdmin
              - call: "POST /fire-district/inspectors"
                payload: { full_name: "Ivan Ruiz", certification_level: "ADVANCED", status: "ACTIVE" }
                as: ProgramAdmin
                captures: { insp1: "$.data.id" }
              - call: "POST /fire-district/contractors"
                payload: { business_name: "Lapsed Cover Co", hourly_rate_cents: 8600, mobilization_fee_cents: 32000, license_status: "SUSPENDED", insurance_expiry_utc: "2027-01-01T00:00:00Z" }
                as: ProgramAdmin
                captures: { c_bad: "$.data.id", c_bad_lic: "$.data.license_status" }
              - call: "POST /fire-district/contractors"
                payload: { business_name: "Expiring Cover Co", hourly_rate_cents: 8600, mobilization_fee_cents: 32000, license_status: "ACTIVE", insurance_expiry_utc: "2026-10-05T08:00:00Z" }
                as: ProgramAdmin
                captures: { c_lapsed: "$.data.id" }
              - call: "POST /fire-district/parcels"
                payload: { apn: "APN-5801", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
                as: ProgramAdmin
                captures: { p1: "$.data.id" }
              - call: "POST /fire-district/inspections"
                payload: { parcel_id: "${p1}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-20T15:00:00Z", scheduled_end_utc: "2026-08-20T17:00:00Z", access_arrangement: "EXTERIOR_ONLY" }
                as: ProgramAdmin
                captures: { ins1: "$.data.id" }
              - call: "POST /fire-district/inspections/${ins1}/notice"
                payload: { notice_method: "CERTIFIED_MAIL" }
                as: ProgramAdmin
              - call: "POST /fire-district/inspections/${ins1}/zone-evaluations"
                payload: { zone: "ZONE_0_EMBER", measured_clearance_ft: 5.0 }
                as: Inspector
                as_user_id: "${insp1}"
              - call: "POST /fire-district/inspections/${ins1}/zone-evaluations"
                payload: { zone: "ZONE_1", measured_clearance_ft: 15.0 }
                as: Inspector
                as_user_id: "${insp1}"
              - call: "POST /fire-district/inspections/${ins1}/zone-evaluations"
                payload: { zone: "ZONE_2", measured_clearance_ft: 118.0 }
                as: Inspector
                as_user_id: "${insp1}"
              - call: "POST /fire-district/inspections/${ins1}/complete"
                payload: { result: "FAIL", violation_notice_method: "CERTIFIED_MAIL" }
                as: Inspector
                as_user_id: "${insp1}"
              - call: "GET /fire-district/violation-notices"
                payload: { parcel_id: "${p1}" }
                as: ProgramAdmin
                captures: { n1: "$.data[0].id" }
              - call: "POST /_clock/set_current_utc"
                payload: { to_iso8601: "2026-10-01T00:00:00Z" }
                as: ProgramAdmin
              - call: "POST /fire-district/inspection-cycles/${cyc}/advance"
                payload: {}
                as: ProgramAdmin
              - call: "POST /fire-district/violation-notices/${n1}/authorize-abatement"
                payload: { estimated_cost_cents: 200000 }
                as: FireMarshal
                captures: { oA: "$.data.id", oA_status: "$.data.status" }
              - call: "POST /fire-district/abatement-orders/${oA}/award"
                payload: { contractor_id: "${c_bad}", crew_hours: 12.5, work_start_utc: "2026-10-05T08:00:00Z", work_end_utc: "2026-10-05T18:00:00Z" }
                as: FireMarshal
                captures: { err_lic: "$.data.error_id" }
            trigger:
              - call: "POST /fire-district/abatement-orders/${oA}/award"
                payload: { contractor_id: "${c_lapsed}", crew_hours: 12.5, work_start_utc: "2026-10-05T08:00:00Z", work_end_utc: "2026-10-05T18:00:00Z" }
                as: FireMarshal
                captures: { err_ins: "$.data.error_id" }
            assert:
              - "${c_bad_lic} == \"SUSPENDED\" and ${oA_status} == \"AUTHORIZED\""
              - "The SUSPENDED award returned HTTP 409 with ${err_lic} == \"ERR_CONTRACTOR_NOT_LICENSED\""
              - "The trigger returns HTTP 409 with ${err_ins} == \"ERR_CONTRACTOR_INSURANCE_LAPSED\": insurance_expiry_utc == work_start_utc is already lapsed"
              - "AbatementOrder.${oA}.status is still \"AUTHORIZED\" with contractor_id == null and crew_hours == null after BOTH refusals"
              - "Contractor.${c_bad}.committed_crew_hours == 0 and Contractor.${c_lapsed}.committed_crew_hours == 0"
              - "PATCH /fire-district/contractors/${c_lapsed} with insurance_expiry_utc 2026-10-05T08:00:01Z then makes the identical award succeed with status AWARDED"

      - name: community_submit_below_member_floor_rejected
        claim_type: error_triggerable
        grounds:
          - validations.priority_59
          - errors[ERR_COMMUNITY_THRESHOLD_NOT_MET]
          - state_machines.Community.ORGANIZING_to_SUBMITTED.preconditions
        distinguishing_aspect: |
          Submission enforces two independent aggregates: at least COMMUNITY_MIN_MEMBER_PARCELS (3)
          member parcels AND parcels_outreached_count >= the member count. With two members the
          submission is refused 422 ERR_COMMUNITY_THRESHOLD_NOT_MET however large the outreach number is,
          and with three members an outreach count of 2 is still refused — the community stays ORGANIZING
          with parcels_outreached_count 0 in both cases.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; a community with exactly two member parcels."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/communities"
              payload: { name: "Ridge Crest FSC", organizer_name: "Dana Cole", target_certification_year: 2026 }
              as: ProgramAdmin
              captures: { com: "$.data.id", com_status: "$.data.status", com_outreach: "$.data.parcels_outreached_count" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-5901", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", community_id: "${com}", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { pA: "$.data.id" }
            - call: "POST /fire-district/parcels"
