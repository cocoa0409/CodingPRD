            - "GET /hotel-management/agreements/${agr8a}/report-packages returns total_count == 4"

      - name: dispute_standstill_half_open_window_touching_boundary_allowed
        grounds:
          - validations[priority=35]
          - state_machines.BrandStandardDispute.OWNER_COUNTERED_to_ESCALATED_TO_FRANCHISOR
          - entities.BrandStandardDispute.fields.standstill_end_utc
          - errors[ERR_DISPUTE_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Half-open interval overlap with real extent, and scoped by franchise_requirement_ref: a new
          remediation window starting exactly at the escalated dispute's standstill_end_utc of
          2026-09-15T00:00:00Z is accepted because touching endpoints do not overlap, one day earlier
          is rejected, and the identical overlapping window on a different requirement ref is
          accepted — none of which a discrete slot key can express.
