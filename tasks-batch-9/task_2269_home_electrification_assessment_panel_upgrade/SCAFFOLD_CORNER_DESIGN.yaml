      - name: closed_program_refuses_reopen_from_terminal_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Program.terminal_states
          - errors.ERR_INVALID_STATE_TRANSITION
          - validations.priority_8
        distinguishing_aspect: |
          CLOSED is Program's only terminal state: after OPEN -> CLOSED, both
          new_status OPEN and new_status SUSPENDED return 409
          ERR_INVALID_STATE_TRANSITION, and the version does not move on a
          refused transition.
        test_recipe:
          setup:
            - "One program taken DRAFT -> OPEN -> CLOSED, so version is 3 at the start of the trigger."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Closed", state_code: "CO", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "CLOSED", status_note: "Program year closed out" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { err_reopen: $.data.error_id }
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "SUSPENDED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { err_suspend: $.data.error_id }
          assert:
            - "Both trigger calls return 409 with data.error_id == \"ERR_INVALID_STATE_TRANSITION\""
            - "Program.${prog_id}.status is still CLOSED and version == 3 — refused transitions do not bump the version"
            - "GET /programs?status=CLOSED as ProgramAdmin returns total_count 1"

