  # ===========================================================================
  # RULE 8 — resource_temporal_overlap (2 instances, different interval
  #          semantics AND different resource entities: CLOSED integer
  #          house-number ranges with parity on RoadCenterline, vs HALF-OPEN
  #          datetime windows on BoundaryCellAssignment)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: road_range_closed_interval_shared_endpoint_overlap_rejected
        grounds:
          - calculations.address_range_overlap_detection
          - validations[priority=21]
          - errors.ERR_ROAD_RANGE_OVERLAP
          - state_machines.RoadCenterline.VALIDATED_to_DRAFT
          - concurrency_rules
        distinguishing_aspect: |
          Interval semantics: CLOSED integer intervals filtered by parity on the RoadCenterline
          resource. EVEN [100,198] and EVEN [198,298] share exactly the single endpoint 198 and
          MUST conflict, whereas EVEN [100,198] and EVEN [200,298] are adjacent with no shared
          member and MUST be allowed. The right-hand ODD ranges are deliberately far apart so the
          left endpoint is the only possible cause.
        test_recipe:
          setup:
            - "Jurisdiction LARCO."
            - "R1 'N MAPLE STREET' left [100,198] EVEN, right [101,199] ODD, VALIDATED."
            - "R2 'N Maple St' (same normalized name) left [198,298] EVEN, right [301,399] ODD, DRAFT. Its right interval cannot conflict with R1's (max(301,101) = 301 > min(399,199) = 199), so only the shared left endpoint 198 is in play."
            - "R2's version at creation is captured for the later PATCH."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { r1_id: $.data.id }
            - call: "POST /gis/road-centerlines/${r1_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N Maple St", jurisdiction_id: "${j_id}", from_addr_left: 198, to_addr_left: 298, parity_left: "EVEN", from_addr_right: 301, to_addr_right: 399, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { r2_id: $.data.id, r2_v: $.data.version }
          trigger:
            - call: "POST /gis/road-centerlines/${r2_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "PATCH /gis/road-centerlines/${r2_id}"
              payload: { from_addr_left: 200, to_addr_left: 298, expected_road_version: "${r2_v}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/road-centerlines/${r2_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
          assert:
            - "the FIRST validate returns status_code 409 with error_id \"ERR_ROAD_RANGE_OVERLAP\"   # 198 is shared by both CLOSED intervals"
            - "after the first validate RoadCenterline.${r2_id}.status == \"DRAFT\""
            - "the PATCH returns status_code 200 and RoadCenterline.${r2_id}.from_addr_left == 200"
            - "the SECOND validate returns status_code 200   # [200,298] is adjacent with no shared member"
            - "RoadCenterline.${r2_id}.status == \"VALIDATED\""
            - "RoadCenterline.${r2_id}.normalized_name == \"N MAPLE STREET\"   # the names really do collide"
            - "RoadCenterline.${r2_id}.qc_dirty == false   # cleared by the successful validate"
            - "RoadCenterline.${r1_id}.status == \"VALIDATED\""
            - "RoadCenterline.${r2_id}.assignable_slot_count_left == 50   # capacity floor((298-200)/2)+1"

      - name: boundary_cell_half_open_window_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=31]
          - calculations.coverage_integrity_counters
          - errors.ERR_COVERAGE_OVERLAP
          - entities.BoundaryCellAssignment.fields.effective_end
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN datetime windows on the BoundaryCellAssignment resource — a
          different resource entity and a different interval convention from
          road_range_closed_interval_shared_endpoint_overlap_rejected. Windows that TOUCH exactly
          (predecessor effective_end == successor effective_start) do NOT intersect and both
          activate, while a window starting one day earlier does intersect and is rejected.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Jurisdiction LARCO with one CoverageCell C001 and a single ACTIVE LAW agency that owns all three boundaries (service_type is derived from the agency, so all three are LAW)."
            - "B1: boundary window [2026-08-01, 2026-08-11) with one assignment on C001 over exactly that window; PROPOSED then ACTIVE."
            - "B2: boundary window [2026-08-11, open) with one assignment on C001 over exactly that window; PROPOSED (not yet activated)."
            - "B3: boundary window [2026-08-10, open) with one assignment on C001 over exactly that window; PROPOSED (not yet activated)."
          setup_api_calls:
            - call: "POST /gis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Larimer County Sheriff", agency_type: "LAW", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { law_id: $.data.id }
            - call: "POST /gis/emergency-service-boundaries"
              payload: { agency_id: "${law_id}", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-08-11T00:00:00Z" }
              as: AgencyLiaison
              as_user_id: "${law_id}"
              captures: { b1_id: $.data.id, b1_v: $.data.version }
            - call: "POST /gis/emergency-service-boundaries/${b1_id}/cell-assignments"
              payload: { cell_id: "${cell_id}", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-08-11T00:00:00Z", expected_boundary_version: "${b1_v}" }
              as: AgencyLiaison
              as_user_id: "${law_id}"
              captures: { asn1_id: $.data.id }
            - call: "POST /gis/emergency-service-boundaries/${b1_id}/propose"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${law_id}"
            - call: "POST /gis/emergency-service-boundaries/${b1_id}/activate"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${law_id}"
            - call: "POST /gis/emergency-service-boundaries"
              payload: { agency_id: "${law_id}", effective_start: "2026-08-11T00:00:00Z" }
              as: AgencyLiaison
              as_user_id: "${law_id}"
              captures: { b2_id: $.data.id, b2_v: $.data.version }
            - call: "POST /gis/emergency-service-boundaries/${b2_id}/cell-assignments"
              payload: { cell_id: "${cell_id}", effective_start: "2026-08-11T00:00:00Z", expected_boundary_version: "${b2_v}" }
              as: AgencyLiaison
              as_user_id: "${law_id}"
              captures: { asn2_id: $.data.id }
            - call: "POST /gis/emergency-service-boundaries/${b2_id}/propose"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${law_id}"
            - call: "POST /gis/emergency-service-boundaries"
              payload: { agency_id: "${law_id}", effective_start: "2026-08-10T00:00:00Z" }
              as: AgencyLiaison
              as_user_id: "${law_id}"
              captures: { b3_id: $.data.id, b3_v: $.data.version }
            - call: "POST /gis/emergency-service-boundaries/${b3_id}/cell-assignments"
              payload: { cell_id: "${cell_id}", effective_start: "2026-08-10T00:00:00Z", expected_boundary_version: "${b3_v}" }
              as: AgencyLiaison
              as_user_id: "${law_id}"
              captures: { asn3_id: $.data.id }
            - call: "POST /gis/emergency-service-boundaries/${b3_id}/propose"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${law_id}"
          trigger:
            - call: "POST /gis/emergency-service-boundaries/${b2_id}/activate"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${law_id}"
            - call: "POST /gis/emergency-service-boundaries/${b3_id}/activate"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${law_id}"
          assert:
            - "the B2 activate returns status_code 200   # [2026-08-01,2026-08-11) and [2026-08-11,inf) only TOUCH"
            - "EmergencyServiceBoundary.${b2_id}.status == \"ACTIVE\""
            - "BoundaryCellAssignment.${asn2_id}.status == \"ACTIVE\""
            - "the B3 activate returns status_code 409 with error_id \"ERR_COVERAGE_OVERLAP\"   # [2026-08-10,inf) intersects both"
            - "EmergencyServiceBoundary.${b3_id}.status == \"PROPOSED\""
            - "BoundaryCellAssignment.${asn3_id}.status == \"PENDING\""
            - "CoverageCell.${cell_id}.active_assignment_count == 1   # only B1's assignment covers 2026-08-01"
            - "Jurisdiction.${j_id}.gap_pair_count == 2   # FIRE and EMS; LAW is covered now"
            - "Jurisdiction.${j_id}.forward_gap_pair_count == 2   # LAW's touching windows leave no hole in [now, now+30d)"
            - "Jurisdiction.${j_id}.covered_cell_count == 0"

  # ===========================================================================
  # RULE 9 — compensating_invariant (3 instances, three different conserved
  #          quantities: road slot capacity, (cell x service_type) coverage
  #          pair count, and the single-PUBLISHED-package-per-channel rule)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: assignment_void_restores_assignable_slot_count
        grounds:
          - state_machines.AddressAssignmentRequest.FULFILLED_to_VOIDED
          - calculations.assignable_slot_count
          - entities.AddressPoint.fields.retire_reason
          - entities.AddressAssignmentRequest.fields.minted_point_count
        distinguishing_aspect: |
          Conserved quantity: the road's assignable_slot_count_left. It reads 50 before the
          assignment, 49 while the base point lives, and must return to EXACTLY 50 after the void —
          not 48 (double-charging the two units, which never consumed a slot) and not a value left
          stale from before the refresh. minted_point_count stays 3 because it is a historical fact,
          not a live count.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Jurisdiction LARCO (postal_city FORT COLLINS) with one CoverageCell C001."
            - "One VALIDATED RoadCenterline 'N MAPLE STREET', LEFT range [100,198] EVEN, capacity 50, no address points yet."
            - "One AddressAssignmentRequest for permit BP-2026-0002 on the LEFT side with requested_unit_count 2, GIS_APPROVED and UTILITY_CLEARED, already ASSIGNED — so it is FULFILLED with assigned_house_number 100, three minted PENDING points, and assignable_slot_count_left 49."
          setup_api_calls:
            - call: "POST /gis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/road-centerlines/${road_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/address-assignment-requests"
              payload: { permit_number: "BP-2026-0002", parcel_id: "8712300002", road_centerline_id: "${road_id}", side: "LEFT", requested_unit_count: 2 }
              as: PermitCoordinator
              as_user_id: "permit-1"
              captures: { req_id: $.data.id }
            - call: "POST /gis/address-assignment-requests/${req_id}/gis-review"
              payload: { decision: "APPROVE" }
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/address-assignment-requests/${req_id}/utility-clearance"
              payload: { decision: "CLEAR" }
              as: PermitCoordinator
              as_user_id: "permit-1"
            - call: "POST /gis/address-assignment-requests/${req_id}/assign"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { base_pt_id: $.data.assigned_address_point_id }
          trigger:
            - call: "POST /gis/address-assignment-requests/${req_id}/void"
              payload: { void_reason: "Permit withdrawn by the applicant before foundation inspection" }
              as: PermitCoordinator
              as_user_id: "permit-1"
          assert:
            - "AddressAssignmentRequest.${req_id}.fulfillment_status == \"VOIDED\""
            - "AddressAssignmentRequest.${req_id}.void_reason == \"Permit withdrawn by the applicant before foundation inspection\""
            - "AddressAssignmentRequest.${req_id}.minted_point_count == 3   # historical, NOT decremented"
            - "AddressAssignmentRequest.${req_id}.assigned_house_number == 100   # the record of what was handed out survives"
            - "AddressPoint.${base_pt_id}.status == \"VOIDED\""
            - "AddressPoint.${base_pt_id}.retire_reason == \"REQUEST_VOIDED\""
            - "AddressPoint.${base_pt_id}.retired_at == \"2026-08-01T00:00:00.000Z\""
            - "RoadCenterline.${road_id}.assignable_slot_count_left == 50   # restored EXACTLY, not 48 and not 49"
            - "RoadCenterline.${road_id}.assignable_slot_count_right == 50   # never touched"
            - "GET /gis/address-points?road_centerline_id=${road_id}&include_retired=true total_count == 3   # all three points are retained"
            - "every point returned by GET /gis/address-points?road_centerline_id=${road_id}&include_retired=true has status \"VOIDED\" and retire_reason \"REQUEST_VOIDED\""

      - name: boundary_retire_restores_coverage_pair_conservation
        grounds:
          - state_machines.EmergencyServiceBoundary.ACTIVE_to_RETIRED
          - calculations.coverage_integrity_counters
          - endpoints.GET_/gis/coverage-cells/{id}/coverage-status
          - entities.Jurisdiction.fields.gap_pair_count
        distinguishing_aspect: |
          Conserved quantity: for every cell, covered service types + gap service types == 3, so
          gap_pair_count + covered_pair_count == cell_count * 3 both before and after the retire.
          Retiring the FIRE boundary must move exactly ONE pair from covered to gap (0 -> 1) and
          drop covered_cell_count to 0, with the emitted service-type arrays still in the
          SERVICE_TYPES order LAW, FIRE, EMS.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Jurisdiction LARCO with exactly one CoverageCell C001, so cell_count is 1 and the conserved total is 3 pairs."
            - "Three ACTIVE agencies LAW, FIRE and EMS, each owning one ACTIVE boundary with one ACTIVE open-ended assignment on C001."
            - "Before the trigger: gap_pair_count 0, forward_gap_pair_count 0, covered_cell_count 1, CoverageCell.active_assignment_count 3."
          setup_api_calls:
            - call: "POST /gis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Larimer County Sheriff", agency_type: "LAW", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { law_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Poudre Fire Authority", agency_type: "FIRE", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { fire_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Thompson Valley EMS", agency_type: "EMS", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { ems_id: $.data.id }
            - call: "POST /gis/emergency-service-boundaries"
              payload: { agency_id: "${law_id}", effective_start: "2026-08-01T00:00:00Z" }
              as: AgencyLiaison
              as_user_id: "${law_id}"
              captures: { b_law_id: $.data.id, b_law_v: $.data.version }
            - call: "POST /gis/emergency-service-boundaries/${b_law_id}/cell-assignments"
              payload: { cell_id: "${cell_id}", effective_start: "2026-08-01T00:00:00Z", expected_boundary_version: "${b_law_v}" }
              as: AgencyLiaison
              as_user_id: "${law_id}"
            - call: "POST /gis/emergency-service-boundaries/${b_law_id}/propose"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${law_id}"
            - call: "POST /gis/emergency-service-boundaries/${b_law_id}/activate"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${law_id}"
            - call: "POST /gis/emergency-service-boundaries"
              payload: { agency_id: "${fire_id}", effective_start: "2026-08-01T00:00:00Z" }
              as: AgencyLiaison
              as_user_id: "${fire_id}"
              captures: { b_fire_id: $.data.id, b_fire_v: $.data.version }
            - call: "POST /gis/emergency-service-boundaries/${b_fire_id}/cell-assignments"
              payload: { cell_id: "${cell_id}", effective_start: "2026-08-01T00:00:00Z", expected_boundary_version: "${b_fire_v}" }
              as: AgencyLiaison
              as_user_id: "${fire_id}"
              captures: { asn_fire_id: $.data.id }
            - call: "POST /gis/emergency-service-boundaries/${b_fire_id}/propose"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${fire_id}"
            - call: "POST /gis/emergency-service-boundaries/${b_fire_id}/activate"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${fire_id}"
            - call: "POST /gis/emergency-service-boundaries"
              payload: { agency_id: "${ems_id}", effective_start: "2026-08-01T00:00:00Z" }
              as: AgencyLiaison
              as_user_id: "${ems_id}"
              captures: { b_ems_id: $.data.id, b_ems_v: $.data.version }
            - call: "POST /gis/emergency-service-boundaries/${b_ems_id}/cell-assignments"
              payload: { cell_id: "${cell_id}", effective_start: "2026-08-01T00:00:00Z", expected_boundary_version: "${b_ems_v}" }
              as: AgencyLiaison
              as_user_id: "${ems_id}"
            - call: "POST /gis/emergency-service-boundaries/${b_ems_id}/propose"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${ems_id}"
            - call: "POST /gis/emergency-service-boundaries/${b_ems_id}/activate"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${ems_id}"
          trigger:
            - call: "POST /gis/emergency-service-boundaries/${b_fire_id}/retire"
              payload: { retire_reason: "Fire district dissolved into the regional authority" }
              as: AgencyLiaison
              as_user_id: "${fire_id}"
          assert:
            - "EmergencyServiceBoundary.${b_fire_id}.status == \"RETIRED\""
            - "EmergencyServiceBoundary.${b_fire_id}.retired_at == \"2026-08-01T00:00:00.000Z\""
            - "BoundaryCellAssignment.${asn_fire_id}.status == \"RETIRED\"   # the child assignment follows its boundary"
            - "EmergencyServiceBoundary.${b_law_id}.status == \"ACTIVE\""
            - "EmergencyServiceBoundary.${b_ems_id}.status == \"ACTIVE\""
            - "CoverageCell.${cell_id}.active_assignment_count == 2   # exactly one pair was released"
            - "Jurisdiction.${j_id}.cell_count == 1"
            - "Jurisdiction.${j_id}.gap_pair_count == 1   # 1 gap + 2 covered == cell_count * 3"
            - "Jurisdiction.${j_id}.forward_gap_pair_count == 1"
            - "Jurisdiction.${j_id}.covered_cell_count == 0   # a cell needs all THREE service types"
            - "GET /gis/coverage-cells/${cell_id}/coverage-status covered_service_types == [\"LAW\", \"EMS\"]   # SERVICE_TYPES order, not alphabetical"
            - "GET /gis/coverage-cells/${cell_id}/coverage-status gap_service_types == [\"FIRE\"]"
            - "GET /gis/coverage-cells/${cell_id}/coverage-status forward_gap_service_types == [\"FIRE\"]"

      - name: package_rollback_preserves_single_published_package
        grounds:
          - state_machines.ProvisioningPackage.PUBLISHED_to_ROLLED_BACK
          - state_machines.ProvisioningPackage.SUPERSEDED_to_PUBLISHED
          - calculations.package_version_assignment
          - validations[priority=29]
          - entities.ProvisioningPackage.fields.published_at
        distinguishing_aspect: |
          Conserved quantity: exactly ONE PUBLISHED ProvisioningPackage per (channel,
          jurisdiction_id) at every instant. Rolling v2 back must restore v1 to PUBLISHED in the
          same request — never zero published packages (dispatch would go dark) and never two.
          The restored package keeps its ORIGINAL published_at 2026-08-01T00:00:00.000Z, so the
          cadence baseline moves backwards, and both version numbers are retained.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, later advanced to 2026-08-15T00:00:00Z."
            - "Jurisdiction LARCO (postal_city FORT COLLINS) with one CoverageCell C001 and no boundaries."
            - "RoadCenterline 'N MAPLE STREET' PUBLISHED with one ACTIVE PARCEL base point at 100 LEFT."
            - "A ROAD-scoped QcValidationReport over that centerline, zero defects, CERTIFIED by qc-1."
            - "MAPPING package v1 SEALED and PUBLISHED at 2026-08-01T00:00:00.000Z."
            - "MAPPING package v2 SEALED and PUBLISHED at 2026-08-15T00:00:00.000Z (14 days later, so the cadence window was open), which SUPERSEDED v1."
          setup_api_calls:
            - call: "POST /gis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { pt_id: $.data.id }
            - call: "POST /gis/road-centerlines/${road_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/road-centerlines/${road_id}/publish"
              payload: {}
              as: QcCertifier
              as_user_id: "qc-1"
            - call: "POST /gis/address-points/${pt_id}/activate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/qc-validation-reports"
              payload: { scope: "ROAD", road_centerline_id: "${road_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { rep_id: $.data.id }
            - call: "POST /gis/qc-validation-reports/${rep_id}/certify"
              payload: {}
              as: QcCertifier
              as_user_id: "qc-1"
            - call: "POST /gis/provisioning-packages"
              payload: { channel: "MAPPING", jurisdiction_id: "${j_id}", qc_report_id: "${rep_id}" }
              as: ProvisioningOfficer
              as_user_id: "prov-1"
              captures: { pkg1_id: $.data.id }
            - call: "POST /gis/provisioning-packages/${pkg1_id}/seal"
              payload: {}
              as: ProvisioningOfficer
              as_user_id: "prov-1"
            - call: "POST /gis/provisioning-packages/${pkg1_id}/publish"
              payload: {}
              as: ProvisioningOfficer
              as_user_id: "prov-1"
            - call: "POST /gis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /gis/provisioning-packages"
              payload: { channel: "MAPPING", jurisdiction_id: "${j_id}", qc_report_id: "${rep_id}" }
              as: ProvisioningOfficer
              as_user_id: "prov-1"
              captures: { pkg2_id: $.data.id }
            - call: "POST /gis/provisioning-packages/${pkg2_id}/seal"
              payload: {}
              as: ProvisioningOfficer
              as_user_id: "prov-1"
            - call: "POST /gis/provisioning-packages/${pkg2_id}/publish"
              payload: {}
              as: ProvisioningOfficer
              as_user_id: "prov-1"
          trigger:
            - call: "POST /gis/provisioning-packages/${pkg2_id}/rollback"
              payload: { rollback_reason: "Dispatch reported bad geometry on the 100 block after cutover" }
              as: ProvisioningOfficer
              as_user_id: "prov-1"
          assert:
            - "ProvisioningPackage.${pkg2_id}.status == \"ROLLED_BACK\""
            - "ProvisioningPackage.${pkg2_id}.rollback_reason == \"Dispatch reported bad geometry on the 100 block after cutover\""
            - "ProvisioningPackage.${pkg2_id}.package_version == 2   # the number is retained, never reused"
            - "ProvisioningPackage.${pkg1_id}.status == \"PUBLISHED\"   # restored in the same request"
            - "ProvisioningPackage.${pkg1_id}.package_version == 1"
            - "ProvisioningPackage.${pkg1_id}.published_at == \"2026-08-01T00:00:00.000Z\"   # ORIGINAL instant, not 2026-08-15"
            - "GET /gis/provisioning-packages?channel=MAPPING&jurisdiction_id=${j_id}&status=PUBLISHED total_count == 1   # the invariant"
            - "GET /gis/provisioning-packages?channel=MAPPING&jurisdiction_id=${j_id}&status=PUBLISHED data[0].id == \"${pkg1_id}\""
            - "GET /gis/provisioning-packages?channel=MAPPING&jurisdiction_id=${j_id}&status=SUPERSEDED total_count == 0"
