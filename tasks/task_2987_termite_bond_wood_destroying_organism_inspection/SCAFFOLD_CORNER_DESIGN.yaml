  - section: endpoints
    instances:
      - name: logical_clock_starts_at_the_declared_instant_and_moves_only_via_the_setter
        claim_type: computed_read
        grounds:
          - endpoints[GET /_clock/current]
          - endpoints[POST /_clock/set_current_utc]
          - roles.ComplianceOfficer
        distinguishing_aspect: >-
          Before any set call the clock reads exactly 2026-08-01T00:00:00Z, so every stamped field in
          the system is reproducible from a cold start. The setter is ComplianceOfficer-exclusive and
          the reader is the one endpoint exempt from the identity headers, so the pair is
          deliberately asymmetric.
        test_recipe:
          setup:
            - "A cold server; nothing persisted and no clock call made yet."
          setup_api_calls: []
          trigger:
            - call: "GET /_clock/current"
              payload: {}
              as: BranchManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-04T05:06:07Z" }
              as: BranchManager
              captures: { e1: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-04T05:06:07Z" }
              as: ComplianceOfficer
            - call: "GET /_clock/current"
              payload: {}
              as: PropertyOwner
              as_user_id: "owner-1"
            - call: "POST /properties"
              payload: { address_line1: "411 Cypress Row", state_code: "FL", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 1995 }
              as: ComplianceOfficer
          assert:
            - "the first read returns current_utc 2026-08-01T00:00:00.000Z — the declared startup default, not the wall clock"
            - "a BranchManager attempting the setter gets 403 ERR_UNAUTHORIZED; the clock is not a shared utility"
            - "after the ComplianceOfficer sets it, the read returns 2027-03-04T05:06:07.000Z for a different role"
            - "the property created afterwards has created_at 2027-03-04T05:06:07.000Z, proving row stamping reads the logical clock rather than real time"
            - "the clock endpoints declare no output entity, so nothing may be captured from them; only their visible fields are asserted"

      - name: inspection_filters_compose_with_pagination_over_one_property
        claim_type: standard_crud
        grounds:
          - endpoints[GET /inspections]
          - response_envelope
        distinguishing_aspect: >-
          The list endpoint offers six filters that must AND together — property_id + purpose +
          status narrows to a single row out of four — while total_count reports the FILTERED total
          and has_more reflects the filtered page, not the table size.
        test_recipe:
          setup:
            - "One property with four graphs: two INITIAL (one GRAPHED, one DRAFT), one REAL_ESTATE and one RENEWAL superseding the graphed INITIAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "411 Cypress Row", state_code: "FL", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 1995 }
              as: ComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Rosa Vance", license_number: "FL-10001", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insb: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "INITIAL", scheduled_start_at: "2026-08-01T09:00:00Z", scheduled_end_at: "2026-08-01T11:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { i1: $.data.id }
            - call: "POST /inspections/${i1}/graph-complete"
              payload: { no_findings_attested: true }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "INITIAL", scheduled_start_at: "2026-08-01T11:00:00Z", scheduled_end_at: "2026-08-01T13:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { i2: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "REAL_ESTATE", scheduled_start_at: "2026-08-01T13:00:00Z", scheduled_end_at: "2026-08-01T15:00:00Z", closing_date: "2026-09-20" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { i3: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "RENEWAL", scheduled_start_at: "2026-08-01T15:00:00Z", scheduled_end_at: "2026-08-01T17:00:00Z", supersedes_inspection_id: "${i1}" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { i4: $.data.id }
          trigger:
            - call: "GET /inspections"
              payload: { property_id: "${p1}", limit: 2, offset: 0 }
              as: ComplianceOfficer
              captures: { first: "$.data[0].id" }
            - call: "GET /inspections"
              payload: { property_id: "${p1}", purpose: "INITIAL", status: "DRAFT", limit: 10, offset: 0 }
              as: ComplianceOfficer
            - call: "GET /inspections"
              payload: { supersedes_inspection_id: "${i1}", limit: 10, offset: 0 }
              as: ComplianceOfficer
            - call: "GET /inspections"
              payload: { inspector_id: "${insb}", status: "SUPERSEDED", limit: 10, offset: 0 }
              as: ComplianceOfficer
          assert:
            - "the unfiltered property page returns 2 rows with total_count 4 and has_more true"
            - "property_id + purpose INITIAL + status DRAFT returns exactly one row (i2) with total_count 1 and has_more false — the filters AND together"
            - "supersedes_inspection_id filtering returns exactly the RENEWAL graph i4, exercising the self-referential FK as a query dimension"
            - "status SUPERSEDED returns the INITIAL graph i1 with total_count 1, because creating a superseding graph moved it out of GRAPHED"
            - "every response carries the same envelope keys (data, total_count, has_more) and each row carries id, created_at, updated_at and version"

      - name: inspector_registry_fields_change_only_through_the_licence_status_channel
        claim_type: conditional_action
        grounds:
          - endpoints[POST /inspectors/{id}/license-status]
          - state_machines.Inspector
          - entities.Inspector
        distinguishing_aspect: >-
          There is no PATCH on Inspector: the ONLY mutation channel is the licence-status action,
          whose optional license_expires_on and ce_credits are honoured on the EXPIRED -> ACTIVE hop
          and must be ignored on hops that do not declare them. A SUSPENDED -> ACTIVE hop therefore
          leaves ce_credits untouched even when the body supplies a new number.
        test_recipe:
          setup:
            - "One ACTIVE FL inspector with ce_credits 3 and license_expires_on 2029-06-30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /inspectors"
              payload: { full_name: "Rosa Vance", license_number: "FL-10001", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30", ce_credits: 3 }
              as: ComplianceOfficer
              captures: { insb: $.data.id }
          trigger:
            - call: "POST /inspectors/${insb}/license-status"
              payload: { status: "SUSPENDED" }
              as: ComplianceOfficer
            - call: "POST /inspectors/${insb}/license-status"
              payload: { status: "ACTIVE", ce_credits: 40, license_expires_on: "2031-01-01" }
              as: ComplianceOfficer
            - call: "GET /inspectors/${insb}"
              payload: {}
              as: BranchManager
            - call: "POST /inspectors/${insb}/license-status"
              payload: { status: "EXPIRED" }
              as: ComplianceOfficer
            - call: "POST /inspectors/${insb}/license-status"
              payload: { status: "ACTIVE", license_expires_on: "2032-06-30", ce_credits: 8 }
              as: ComplianceOfficer
          assert:
            - "the suspension returns 200 with status SUSPENDED and version 2; full_name, license_number, license_state and license_categories are unchanged"
            - "the SUSPENDED -> ACTIVE hop returns 200 but leaves ce_credits at 3 and license_expires_on at '2029-06-30' — that hop declares no such side effects, so the supplied values are ignored rather than applied"
            - "the EXPIRED -> ACTIVE hop DOES apply them: license_expires_on becomes '2032-06-30' and ce_credits becomes 8"
            - "version reaches 5 after four accepted hops, one per request, with no skipped increments"
            - "license_number remains 'FL-10001' throughout: no endpoint in the scaffold can change it, so uniqueness per state can never be violated by an update"

      - name: bond_issuance_freezes_every_term_window_at_the_issuance_date
        claim_type: standard_crud
        grounds:
          - endpoints[POST /bonds]
