              as: StateOffice
              captures: { assessor_3: $.data.id }
            - call: "POST /assessors/${assessor_3}/training-records"
              payload: { credential_code: "NFHS-BC-101", hours: 8 }
              as: StateOffice
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T12:00:00Z" }
              as: StateOffice
