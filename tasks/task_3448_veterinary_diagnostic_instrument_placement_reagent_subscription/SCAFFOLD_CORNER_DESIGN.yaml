        excluded_because:
          difficulty_instance: placement_agreement_renegotiation_cycle
          rationale: "The cyclic ACTIVE->RENEGOTIATION->ACTIVE pair is exercised twice there, including the reject and accept resolutions."

      - name: corner_stub_analyzer_parallel_dimensions_covered
        claim_type: Valid Transition
        grounds: [state_machines.Analyzer]
        excluded_because:
          difficulty_instance: analyzer_parallel_dimensions
          rationale: "Parallel-dimension independence (operational vs connectivity vs proficiency) is asserted there."

      - name: corner_stub_breach_cascade_covered
        claim_type: Side Effect Execution
        grounds: [state_machines.PlacementAgreement.ACTIVE_to_BREACHED, state_machines.Clinic.ACTIVE_to_SUSPENDED]
        excluded_because:
          difficulty_instance: close_period_breach_cascade
