# =============================================================================
# Public Rental Housing Application Management — Scaffold Seed Tables (v1)
# =============================================================================

scenario: |
  Public rental housing application management system: applicant eligibility review with
  identity verification, household registration check, income and asset assessment,
  existing-housing status verification, and multi-department data cross-check; queue
  scoring calculation with rule-based points (household type, disability status, length
  of residence, special-care category), tie-breaking rules, and periodic score
  recalculation; housing source matching with apartment-type preference, family-size
  matching, accessibility requirements, and location-priority rules; allocation
  publication with public notice period, objection submission, objection review, and
  final allocation confirmation; contract signing with electronic signature, lease term
  configuration, deposit payment, and handover record; rent reduction approval with
  hardship application, supporting document submission, multi-level review, validity
  period setting, and periodic re-verification; annual review with applicant information
  update, eligibility re-assessment, rent adjustment, exit-trigger handling, and grace
  period management; event-driven synchronization with civil affairs, public security,
  taxation, social security, and payment systems; audit logging for eligibility changes
  and allocation decisions.

domain_name: public-rental-housing
api_prefix: /housing-programs

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - scheduled_deferred_actions
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: branching_with_revert
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: HousingProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program name (e.g. city/district program)" }
      - { name: description, type: string, source: input, required: false, description: "Optional description" }
      - { name: current_period_index, type: integer, source: system, default: 0, description: "Deterministic clock period; advances via POST /clock/advance. Used for residence_length, lease term checks, grace-period expiry, and rent-reduction validity." }
      - { name: notice_period_length, type: integer, source: input, default: 7, description: "Required public notice duration (in periods) before allocation confirmation; must be >=1." }
      - { name: grace_period_length, type: integer, source: input, default: 6, description: "Grace-period length (in periods) after exit trigger before forced contract termination; must be >=1." }
      - { name: per_capita_income_threshold_cents, type: integer, source: input, description: "Maximum allowed monthly per-capita household income for eligibility, in cents (strict greater-than means INELIGIBLE)." }
      - { name: per_capita_asset_threshold_cents, type: integer, source: input, description: "Maximum allowed per-capita household asset value, in cents (strict greater-than means INELIGIBLE)." }

  - name: Application
    parent: HousingProgram
    common_fields: true
    fields:
      - { name: housing_program_id, type: string, source: system, description: "Parent program ID" }
      - { name: applicant_user_id, type: string, source: system, description: "Equals X-User-ID of the creating Applicant role" }
      - { name: household_members, type: array, source: input, description: "Array of objects: { citizen_id, relation, dob, has_disability, special_care_category }. relation IN {SELF,SPOUSE,CHILD,PARENT,OTHER}. special_care_category IN {NONE,VETERAN,MARTYR_FAMILY,SINGLE_PARENT,ELDERLY_LIVE_ALONE}." }
      - { name: household_type, type: enum, source: input, description: "LOW_INCOME | NEW_CITIZEN | RELOCATION | TALENT" }
      - { name: declared_monthly_income_cents, type: integer, source: input, description: "Self-declared aggregate monthly household income (cents)" }
      - { name: declared_total_assets_cents, type: integer, source: input, description: "Self-declared aggregate household assets (cents)" }
      - { name: residence_start_period, type: integer, source: input, description: "Period index from which the applicant established local residence" }
      - { name: requires_accessibility, type: boolean, source: computed, description: "True iff any household_member has has_disability=true" }
      - { name: family_size, type: integer, source: computed, description: "Length of household_members array" }
      - { name: verified_monthly_income_cents, type: integer, source: computed, description: "Cross-checked monthly income from latest TAX/SOCIAL_SECURITY SyncEvent payloads; null until cross-check completes." }
      - { name: verified_total_assets_cents, type: integer, source: computed, description: "Cross-checked total assets from latest TAX SyncEvent payload; null until cross-check completes." }
      - { name: cross_check_status, type: enum, source: computed, default: PENDING, description: "PENDING | PASSED | FAILED — set by /cross-check endpoint based on most-recent SyncEvent of each required source type." }
      - { name: queue_score, type: integer, source: computed, description: "Latest computed queue score per calculations.queue_score (recomputed at SCORED transition and at each AnnualReview finalize). Null while DRAFT/UNDER_REVIEW." }
      - { name: tie_break_key, type: string, source: computed, description: "Composite tie-break key: (residence_start_period asc, application created_at asc, application id asc). Lexicographic comparison." }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | UNDER_REVIEW | SCORED | QUEUED | ALLOCATED | OCCUPIED | EXIT_PENDING | EXITED | REJECTED" }
      - { name: rejection_reason, type: string, source: system, required: false, description: "Set when status -> REJECTED." }
      - { name: exit_trigger_period, type: integer, source: computed, required: false, description: "Period at which exit was triggered by an annual review; null otherwise." }

  - name: HousingUnit
    parent: HousingProgram
    common_fields: true
    fields:
      - { name: housing_program_id, type: string, source: system, description: "Parent program ID" }
      - { name: unit_code, type: string, source: input, description: "Unique unit code within the program (uniqueness enforced)." }
      - { name: apartment_type, type: enum, source: input, description: "STUDIO | ONE_BEDROOM | TWO_BEDROOM | THREE_BEDROOM" }
      - { name: bedroom_count, type: integer, source: input, description: "Number of bedrooms; STUDIO=0, ONE_BEDROOM=1, etc. Must match apartment_type." }
      - { name: square_meters, type: integer, source: input, description: "Floor area; must be >= 1." }
      - { name: monthly_base_rent_cents, type: integer, source: input, description: "Base monthly rent in cents." }
      - { name: location_priority_tier, type: integer, source: input, description: "1 (highest priority/closest to amenities) to 5 (lowest)." }
      - { name: accessibility_compliant, type: boolean, source: input, description: "True if unit meets accessibility requirements (ground floor, ramps, etc.)." }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | RESERVED | OCCUPIED | RETIRED" }

  - name: Allocation
    parent: HousingProgram
    common_fields: true
    fields:
      - { name: housing_program_id, type: string, source: system, description: "Parent program ID" }
      - { name: application_id, type: string, source: input, description: "Matched application id" }
      - { name: housing_unit_id, type: string, source: input, description: "Matched housing unit id" }
      - { name: notice_start_period, type: integer, source: computed, description: "Period at which the public notice opened (set on PUBLISHED transition)." }
      - { name: notice_end_period, type: integer, source: computed, description: "= notice_start_period + program.notice_period_length (exclusive)." }
      - { name: confirmation_period, type: integer, source: computed, required: false, description: "Period at which CONFIRMED transition occurred." }
      - { name: status, type: enum, source: system, default: PUBLISHED, description: "PUBLISHED | UNDER_OBJECTION | CONFIRMED | REVERTED" }

  - name: Objection
    parent: Allocation
    common_fields: true
    fields:
      - { name: allocation_id, type: string, source: system, description: "Parent allocation ID" }
      - { name: submitter_user_id, type: string, source: input, description: "User ID submitting the objection (any Applicant or Citizen role)" }
      - { name: reason_text, type: string, source: input, description: "Free-form reason; min 20 chars." }
      - { name: review_decision, type: enum, source: system, required: false, description: "SUSTAINED | DISMISSED — null while PENDING_REVIEW." }
      - { name: review_notes, type: string, source: system, required: false, description: "Notes recorded by reviewer." }
      - { name: status, type: enum, source: system, default: PENDING_REVIEW, description: "PENDING_REVIEW | SUSTAINED | DISMISSED" }

  - name: Contract
    parent: Allocation
    common_fields: true
    fields:
      - { name: allocation_id, type: string, source: system, description: "Parent allocation ID" }
      - { name: application_id, type: string, source: system, description: "Convenience FK denormalized from allocation" }
      - { name: housing_unit_id, type: string, source: system, description: "Convenience FK denormalized from allocation" }
      - { name: lease_start_period, type: integer, source: input, description: "Inclusive lease start period; must be >= confirmation_period." }
      - { name: lease_end_period, type: integer, source: input, description: "Inclusive lease end period; must be > lease_start_period." }
      - { name: deposit_amount_cents, type: integer, source: computed, description: "= monthly_base_rent_cents * 2, rounded HALF_UP to integer cents." }
      - { name: deposit_paid, type: boolean, source: system, default: false, description: "Set true when /pay-deposit succeeds." }
      - { name: signature_blob, type: string, source: input, required: false, description: "Electronic signature payload provided at /sign." }
      - { name: handover_recorded, type: boolean, source: system, default: false, description: "Set true when /handover succeeds." }
      - { name: monthly_effective_rent_cents, type: integer, source: computed, description: "Per calculations.monthly_effective_rent (sum of per-room rounded amounts after rent reduction)." }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | DEPOSIT_PAID | SIGNED | ACTIVE | TERMINATED" }
      - { name: termination_period, type: integer, source: computed, required: false, description: "Period at which termination occurred." }

  - name: RentReduction
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "Parent contract ID" }
      - { name: hardship_category, type: enum, source: input, description: "MAJOR_ILLNESS | UNEMPLOYMENT | DISABILITY | ELDER_CARE" }
      - { name: declared_hardship_income_cents, type: integer, source: input, description: "Declared post-hardship monthly income (cents)" }
      - { name: supporting_documents, type: array, source: input, description: "Array of { doc_type, doc_ref, issued_period }. Min 1 element required at submission." }
      - { name: requested_discount_bps, type: integer, source: input, description: "Requested discount in basis points (0-10000); ignored — server computes provisional/final." }
      - { name: provisional_discount_bps, type: integer, source: computed, description: "Computed at submission per calculations.rent_reduction_discount_provisional, based on declared values." }
      - { name: final_discount_bps, type: integer, source: computed, required: false, description: "Computed at FINAL_APPROVED per calculations.rent_reduction_discount_final, based on cross-verified data." }
      - { name: validity_start_period, type: integer, source: computed, required: false, description: "Effective start; set on FINAL_APPROVED." }
      - { name: validity_end_period, type: integer, source: computed, required: false, description: "Half-open exclusive end; = validity_start_period + 12 by default." }
      - { name: primary_review_user_id, type: string, source: system, required: false, description: "Reviewer who advanced to SECONDARY_REVIEW." }
      - { name: secondary_review_user_id, type: string, source: system, required: false, description: "Reviewer who advanced to FINAL_APPROVED." }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | PRIMARY_REVIEW | SECONDARY_REVIEW | FINAL_APPROVED | REJECTED | EXPIRED" }

  - name: AnnualReview
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "Parent application ID" }
      - { name: review_period_index, type: integer, source: computed, description: "Set to program.current_period_index at creation." }
      - { name: updated_household_members, type: array, source: input, required: false, description: "Optional updated household_members array; if omitted (null) the application's existing list is reused without change." }
      - { name: updated_declared_monthly_income_cents, type: integer, source: input, required: false, description: "Optional updated declared income; null means reuse existing value." }
      - { name: updated_declared_total_assets_cents, type: integer, source: input, required: false, description: "Optional updated declared assets; null means reuse existing value." }
      - { name: re_eligibility, type: enum, source: computed, required: false, description: "ELIGIBLE | INELIGIBLE — set on finalize." }
      - { name: recomputed_queue_score, type: integer, source: computed, required: false, description: "Recomputed score at finalize per calculations.queue_score." }
      - { name: rent_adjustment_cents, type: integer, source: computed, required: false, description: "Delta to apply to associated active Contract.monthly_effective_rent_cents on finalize. Null if no active contract." }
      - { name: exit_triggered, type: boolean, source: computed, default: false, description: "True iff finalize sets parent application to EXIT_PENDING." }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | FINALIZED" }

  - name: SyncEvent
    parent: HousingProgram
    common_fields: false  # immutable append-only event log: only id + created_at
    fields:
      - { name: housing_program_id, type: string, source: system, description: "Parent program ID" }
      - { name: event_type, type: enum, source: input, description: "CIVIL_AFFAIRS_HOUSEHOLD | PUBLIC_SECURITY_IDENTITY | TAX_INCOME_ASSETS | SOCIAL_SECURITY_INCOME | PAYMENT_DEPOSIT | PAYMENT_RENT | AUDIT_ELIGIBILITY_CHANGE | AUDIT_ALLOCATION_DECISION" }
      - { name: subject_type, type: enum, source: input, description: "APPLICATION | ALLOCATION | CONTRACT | RENT_REDUCTION" }
      - { name: subject_id, type: string, source: input, description: "ID of the entity the event refers to" }
      - { name: payload, type: object, source: input, description: "Free-form payload appropriate to event_type. For TAX_INCOME_ASSETS: { monthly_income_cents, total_assets_cents }. For PAYMENT_DEPOSIT: { amount_cents }. For AUDIT_*: { actor_user_id, before, after, note }." }
      - { name: emitted_period, type: integer, source: system, description: "Equals program.current_period_index at emission." }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Application
    initial_state: DRAFT
    terminal_states: [EXITED, REJECTED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: POST /housing-programs/{programId}/applications/{appId}/submit
        actor: Applicant
        preconditions:
          - "Application must be in DRAFT (ERR_APPLICATION_NOT_IN_DRAFT)"
          - "household_members non-empty (ERR_INVALID_REQUEST)"
        side_effects: []

      - from: UNDER_REVIEW
        to: SCORED
        trigger: POST /housing-programs/{programId}/applications/{appId}/cross-check
        actor: HousingOfficer
        preconditions:
          - "Application must be in UNDER_REVIEW (ERR_APPLICATION_NOT_UNDER_REVIEW)"
          - "Latest CIVIL_AFFAIRS_HOUSEHOLD SyncEvent for this application must report all household_members.citizen_id present (ERR_HOUSEHOLD_REGISTRATION_MISMATCH)"
          - "Latest PUBLIC_SECURITY_IDENTITY SyncEvent must mark all household_members.citizen_id as identity_verified=true (ERR_IDENTITY_VERIFICATION_FAILED)"
          - "Latest TAX_INCOME_ASSETS SyncEvent verified_monthly_income_cents/family_size <= per_capita_income_threshold_cents (ERR_INCOME_OVER_THRESHOLD)"
          - "Latest TAX_INCOME_ASSETS SyncEvent verified_total_assets_cents/family_size <= per_capita_asset_threshold_cents (ERR_ASSETS_OVER_THRESHOLD)"
          - "No member's citizen_id appears as occupant on any other Contract in {ACTIVE, DEPOSIT_PAID, SIGNED} for this program (ERR_EXISTING_HOUSING_DETECTED)"
        side_effects:
          - "Set verified_monthly_income_cents and verified_total_assets_cents from latest TAX_INCOME_ASSETS payload"
          - "Set cross_check_status = PASSED"
          - "Compute queue_score per calculations.queue_score"
          - "Compute tie_break_key"
          - "Emit SyncEvent type=AUDIT_ELIGIBILITY_CHANGE with before/after of cross_check_status"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: POST /housing-programs/{programId}/applications/{appId}/cross-check (any precondition fails)
        actor: HousingOfficer
        preconditions:
          - "Application must be in UNDER_REVIEW (ERR_APPLICATION_NOT_UNDER_REVIEW)"
          - "Any of the SCORED preconditions fails — rejection_reason set to that error_id"
        side_effects:
          - "Set cross_check_status = FAILED"
          - "Set rejection_reason to the failing error_id"
          - "Emit SyncEvent type=AUDIT_ELIGIBILITY_CHANGE"

      - from: SCORED
        to: QUEUED
        trigger: POST /housing-programs/{programId}/applications/{appId}/enqueue
        actor: HousingOfficer
        preconditions:
          - "Application must be in SCORED (ERR_APPLICATION_NOT_SCORED)"
        side_effects: []

      - from: QUEUED
        to: ALLOCATED
        trigger: "system (cascade from POST /allocations PUBLISHED transition selecting this application)"
        actor: system
        preconditions:
          - "Selected by allocation match per calculations.allocation_selector"
          - "Matched HousingUnit must be in AVAILABLE (ERR_UNIT_NOT_AVAILABLE)"
        side_effects:
          - "HousingUnit status -> RESERVED"
          - "Allocation created in PUBLISHED state"
          - "Emit SyncEvent type=AUDIT_ALLOCATION_DECISION"

      - from: ALLOCATED
        to: QUEUED
        trigger: "system (cascade from Allocation REVERTED — sustained objection or applicant rejection of allocation)"
        actor: system
        preconditions: []
        side_effects:
          - "HousingUnit status -> AVAILABLE"
          - "queue_score and tie_break_key remain; application re-enters queue"
          - "Emit SyncEvent type=AUDIT_ALLOCATION_DECISION"

      - from: ALLOCATED
        to: OCCUPIED
        trigger: "system (cascade from Contract status -> ACTIVE)"
        actor: system
        preconditions:
          - "Contract handover_recorded must be true"
        side_effects:
          - "HousingUnit status -> OCCUPIED"

      - from: OCCUPIED
        to: EXIT_PENDING
        trigger: "system (cascade from AnnualReview FINALIZED with re_eligibility=INELIGIBLE)"
        actor: system
        preconditions:
          - "AnnualReview re_eligibility = INELIGIBLE"
        side_effects:
          - "exit_trigger_period = current_period_index"

      - from: EXIT_PENDING
        to: EXITED
        trigger: POST /housing-programs/{programId}/clock/advance OR POST /housing-programs/{programId}/applications/{appId}/finalize-exit
        actor: system | HousingOfficer
        preconditions:
          - "current_period_index >= exit_trigger_period + program.grace_period_length (ERR_GRACE_PERIOD_NOT_ELAPSED if HousingOfficer attempts early)"
        side_effects:
          - "Contract status -> TERMINATED with termination_period = current_period_index"
          - "HousingUnit status -> AVAILABLE"
          - "Emit SyncEvent type=AUDIT_ELIGIBILITY_CHANGE"

  - entity: Allocation
    initial_state: PUBLISHED
    terminal_states: [CONFIRMED, REVERTED]
    transitions:
      - from: PUBLISHED
        to: UNDER_OBJECTION
        trigger: "system (cascade from POST /allocations/{id}/objections — first objection)"
        actor: system
        preconditions:
          - "current_period_index < notice_end_period (ERR_NOTICE_PERIOD_CLOSED)"
          - "Allocation in PUBLISHED (ERR_ALLOCATION_NOT_PUBLISHED)"
        side_effects: []

      - from: UNDER_OBJECTION
        to: PUBLISHED
        trigger: "system (cascade from last open Objection -> DISMISSED, leaving zero PENDING_REVIEW)"
        actor: system
        preconditions:
          - "All objections on this allocation have status SUSTAINED or DISMISSED, and at least one DISMISSED, and zero SUSTAINED"
        side_effects: []

      - from: PUBLISHED
        to: CONFIRMED
        trigger: POST /housing-programs/{programId}/allocations/{allocId}/confirm
        actor: Applicant
        preconditions:
          - "current_period_index >= notice_end_period (ERR_NOTICE_PERIOD_NOT_ELAPSED)"
          - "Allocation in PUBLISHED (ERR_ALLOCATION_NOT_PUBLISHED)"
          - "X-User-ID equals parent Application.applicant_user_id (ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects:
          - "confirmation_period = current_period_index"
          - "Auto-create Contract in DRAFT with deposit_amount_cents = unit.monthly_base_rent_cents * 2"
          - "Emit SyncEvent type=AUDIT_ALLOCATION_DECISION"

      - from: PUBLISHED
        to: REVERTED
        trigger: POST /housing-programs/{programId}/allocations/{allocId}/reject
        actor: Applicant
        preconditions:
          - "Allocation in PUBLISHED (ERR_ALLOCATION_NOT_PUBLISHED)"
          - "X-User-ID equals parent Application.applicant_user_id"
        side_effects:
          - "Application -> QUEUED"
          - "HousingUnit -> AVAILABLE"
          - "Emit SyncEvent type=AUDIT_ALLOCATION_DECISION"

      - from: UNDER_OBJECTION
        to: REVERTED
        trigger: "system (cascade from any Objection -> SUSTAINED)"
        actor: system
        preconditions:
          - "Objection.status = SUSTAINED"
        side_effects:
          - "Application -> QUEUED"
          - "HousingUnit -> AVAILABLE"
          - "Other PENDING_REVIEW objections on this allocation auto-set to DISMISSED with note='allocation reverted'"
          - "Emit SyncEvent type=AUDIT_ALLOCATION_DECISION"

  - entity: Objection
    initial_state: PENDING_REVIEW
    terminal_states: [SUSTAINED, DISMISSED]
    transitions:
      - from: PENDING_REVIEW
        to: SUSTAINED
        trigger: POST /housing-programs/{programId}/allocations/{allocId}/objections/{objId}/sustain
        actor: HousingOfficer
        preconditions:
          - "Objection in PENDING_REVIEW (ERR_OBJECTION_NOT_PENDING)"
          - "Parent Allocation in {PUBLISHED, UNDER_OBJECTION}"
        side_effects:
          - "Allocation -> REVERTED (cascade)"

      - from: PENDING_REVIEW
        to: DISMISSED
        trigger: POST /housing-programs/{programId}/allocations/{allocId}/objections/{objId}/dismiss
        actor: HousingOfficer
        preconditions:
          - "Objection in PENDING_REVIEW (ERR_OBJECTION_NOT_PENDING)"
        side_effects:
          - "If this was the last open objection AND no SUSTAINED objections exist: Allocation -> PUBLISHED (cascade)"

  - entity: Contract
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: DEPOSIT_PAID
        trigger: POST /housing-programs/{programId}/contracts/{contractId}/pay-deposit
        actor: Applicant
        preconditions:
          - "Contract in DRAFT (ERR_CONTRACT_NOT_IN_DRAFT)"
          - "Parent Allocation in CONFIRMED (ERR_ALLOCATION_NOT_CONFIRMED)"
          - "Latest PAYMENT_DEPOSIT SyncEvent for this contract has payload.amount_cents == deposit_amount_cents (ERR_DEPOSIT_AMOUNT_MISMATCH)"
        side_effects:
          - "deposit_paid = true"

      - from: DEPOSIT_PAID
        to: SIGNED
        trigger: POST /housing-programs/{programId}/contracts/{contractId}/sign
        actor: Applicant
        preconditions:
          - "Contract in DEPOSIT_PAID (ERR_CONTRACT_NOT_DEPOSIT_PAID)"
          - "Body must include signature_blob non-empty (ERR_INVALID_REQUEST)"
          - "lease_start_period and lease_end_period must be set with lease_end_period > lease_start_period (ERR_INVALID_LEASE_TERM)"
          - "lease_start_period >= confirmation_period (ERR_INVALID_LEASE_TERM)"
        side_effects:
          - "signature_blob stored"

      - from: SIGNED
        to: ACTIVE
        trigger: POST /housing-programs/{programId}/contracts/{contractId}/handover
        actor: HousingOfficer
        preconditions:
          - "Contract in SIGNED (ERR_CONTRACT_NOT_SIGNED)"
          - "current_period_index >= lease_start_period (ERR_LEASE_NOT_STARTED)"
        side_effects:
          - "handover_recorded = true"
          - "Application -> OCCUPIED (cascade)"
          - "monthly_effective_rent_cents initialized per calculations.monthly_effective_rent (no reduction yet)"

      - from: ACTIVE
        to: TERMINATED
        trigger: "system (cascade from Application -> EXITED)"
        actor: system
        preconditions: []
        side_effects:
          - "termination_period = current_period_index"
          - "All RentReduction records on this contract not in {REJECTED} -> EXPIRED"

  - entity: RentReduction
    initial_state: SUBMITTED
    terminal_states: [FINAL_APPROVED, REJECTED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: PRIMARY_REVIEW
        trigger: POST /housing-programs/{programId}/rent-reductions/{rrId}/advance-to-primary
        actor: HousingOfficer
        preconditions:
          - "RentReduction in SUBMITTED (ERR_RENT_REDUCTION_NOT_SUBMITTED)"
          - "supporting_documents length >= 1 (ERR_INVALID_REQUEST)"
        side_effects: []

      - from: PRIMARY_REVIEW
        to: SECONDARY_REVIEW
        trigger: POST /housing-programs/{programId}/rent-reductions/{rrId}/advance-to-secondary
        actor: HousingOfficer
        preconditions:
          - "RentReduction in PRIMARY_REVIEW (ERR_RENT_REDUCTION_NOT_IN_PRIMARY)"
        side_effects:
          - "primary_review_user_id = X-User-ID"

      - from: SECONDARY_REVIEW
        to: FINAL_APPROVED
        trigger: POST /housing-programs/{programId}/rent-reductions/{rrId}/final-approve
        actor: HousingDirector
        preconditions:
          - "RentReduction in SECONDARY_REVIEW (ERR_RENT_REDUCTION_NOT_IN_SECONDARY)"
          - "X-User-ID != primary_review_user_id (segregation of duties — ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "No overlapping FINAL_APPROVED RentReduction on same contract whose [validity_start_period, validity_end_period) intersects the new validity window (ERR_OVERLAPPING_RENT_REDUCTION)"
        side_effects:
          - "secondary_review_user_id = X-User-ID"
          - "Compute final_discount_bps per calculations.rent_reduction_discount_final"
          - "validity_start_period = current_period_index"
          - "validity_end_period = current_period_index + 12"
          - "Recompute Contract.monthly_effective_rent_cents per calculations.monthly_effective_rent"

      - from: PRIMARY_REVIEW
        to: REJECTED
        trigger: POST /housing-programs/{programId}/rent-reductions/{rrId}/reject
        actor: HousingOfficer
        preconditions:
          - "RentReduction in {PRIMARY_REVIEW, SECONDARY_REVIEW} (ERR_RENT_REDUCTION_NOT_REJECTABLE)"
        side_effects: []

      - from: SECONDARY_REVIEW
        to: REJECTED
        trigger: POST /housing-programs/{programId}/rent-reductions/{rrId}/reject
        actor: HousingDirector
        preconditions:
          - "RentReduction in {PRIMARY_REVIEW, SECONDARY_REVIEW} (ERR_RENT_REDUCTION_NOT_REJECTABLE)"
        side_effects: []

      - from: REJECTED
        to: SUBMITTED
        trigger: POST /housing-programs/{programId}/rent-reductions/{rrId}/resubmit
        actor: Applicant
        preconditions:
          - "RentReduction in REJECTED (ERR_RENT_REDUCTION_NOT_REJECTED)"
          - "X-User-ID equals parent Contract -> Application.applicant_user_id"
        side_effects:
          - "primary_review_user_id and secondary_review_user_id cleared"
          - "Recompute provisional_discount_bps with current values"

      - from: FINAL_APPROVED
        to: EXPIRED
        trigger: "system (cascade from clock/advance making current_period_index >= validity_end_period, OR Contract -> TERMINATED)"
        actor: system
        preconditions: []
        side_effects:
          - "Recompute Contract.monthly_effective_rent_cents (without this reduction)"

  - entity: AnnualReview
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: POST /housing-programs/{programId}/applications/{appId}/annual-reviews/{reviewId}/finalize
        actor: HousingOfficer
        preconditions:
          - "AnnualReview in OPEN (ERR_ANNUAL_REVIEW_NOT_OPEN)"
          - "Parent Application in OCCUPIED (ERR_APPLICATION_NOT_OCCUPIED)"
        side_effects:
          - "Apply updated_* fields to Application (any null field reuses current value)"
          - "Re-run cross-check logic; set re_eligibility = ELIGIBLE iff all checks pass"
          - "Recompute queue_score (residence_length recomputed at review_period_index)"
          - "If re_eligibility = INELIGIBLE: Application -> EXIT_PENDING, exit_triggered = true"
          - "If re_eligibility = ELIGIBLE: rent_adjustment_cents = (new household_type tier base rent) - current monthly_base_rent_cents (may be 0); applied to Contract.monthly_effective_rent_cents"
          - "Emit SyncEvent type=AUDIT_ELIGIBILITY_CHANGE with before/after"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two HousingOfficers simultaneously confirm an allocation match for the same available HousingUnit, each picking a different application"
    guarantee: "At most one Allocation succeeds per HousingUnit; the second is rejected"
    error_id: ERR_UNIT_NOT_AVAILABLE
    http_status: 409
    serialization: "First-writer-wins on HousingUnit.status transition AVAILABLE -> RESERVED"

  - scenario: "Applicant confirms an allocation while a HousingOfficer sustains an objection"
    guarantee: "Exactly one operation succeeds; the second sees the new state and is rejected"
    error_id: ERR_ALLOCATION_NOT_PUBLISHED
    http_status: 409
    serialization: "First-writer-wins on Allocation.status"

  - scenario: "Two reviewers attempt to advance the same RentReduction from PRIMARY_REVIEW to SECONDARY_REVIEW simultaneously"
    guarantee: "Exactly one succeeds; the second sees status SECONDARY_REVIEW and is rejected"
    error_id: ERR_RENT_REDUCTION_NOT_IN_PRIMARY
    http_status: 409
    serialization: "First-writer-wins on RentReduction.status"

  - scenario: "Same Applicant submits two Applications under the same X-User-ID concurrently"
    guarantee: "At most one Application per applicant_user_id may exist in non-terminal status; second is rejected"
    error_id: ERR_DUPLICATE_ACTIVE_APPLICATION
    http_status: 409
    serialization: "First-writer-wins on (housing_program_id, applicant_user_id) uniqueness over status NOT IN {EXITED, REJECTED}"

  - scenario: "Two PATCH/PUT operations on the same Application using stale version"
    guarantee: "One succeeds; the other gets version mismatch"
    error_id: ERR_VERSION_MISMATCH
    http_status: 409
    serialization: "Optimistic concurrency on version field"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: queue_score
    trigger: "Application UNDER_REVIEW -> SCORED transition; AnnualReview FINALIZED transition"
    algorithm: weighted_scoring
    formula: |
      # Inputs:
      #   household_type IN {LOW_INCOME, NEW_CITIZEN, RELOCATION, TALENT}
      #   any_disability = exists m in household_members where m.has_disability == true
      #   residence_length = max(0, current_period_index - residence_start_period)
      #   special_care_max = max over household_members of special_care_points(m.special_care_category)
      # Constants:
      HOUSEHOLD_TYPE_PTS = { LOW_INCOME: 30, NEW_CITIZEN: 15, RELOCATION: 20, TALENT: 25 }
      DISABILITY_PTS    = 20  # if any household member has has_disability=true; else 0
      SPECIAL_CARE_PTS  = { NONE: 0, VETERAN: 15, MARTYR_FAMILY: 18, SINGLE_PARENT: 10, ELDERLY_LIVE_ALONE: 12 }
      RESIDENCE_PTS_PER_PERIOD = 1
      RESIDENCE_PTS_CAP        = 20

      # Per-component values
      ht_pts        = HOUSEHOLD_TYPE_PTS[household_type]
      dis_pts       = DISABILITY_PTS if any_disability else 0
      res_pts_raw   = residence_length * RESIDENCE_PTS_PER_PERIOD
      res_pts       = min(res_pts_raw, RESIDENCE_PTS_CAP)        # capped, non-linear
      sc_pts        = SPECIAL_CARE_PTS[special_care_max]          # max-over-members

      queue_score   = ht_pts + dis_pts + res_pts + sc_pts        # integer, no rounding
    input_set: "Application fields (household_type, household_members, residence_start_period); program.current_period_index at the moment of evaluation"
    constants:
      HOUSEHOLD_TYPE_PTS: { LOW_INCOME: 30, NEW_CITIZEN: 15, RELOCATION: 20, TALENT: 25 }
      DISABILITY_PTS: 20
      SPECIAL_CARE_PTS: { NONE: 0, VETERAN: 15, MARTYR_FAMILY: 18, SINGLE_PARENT: 10, ELDERLY_LIVE_ALONE: 12 }
      RESIDENCE_PTS_PER_PERIOD: 1
      RESIDENCE_PTS_CAP: 20
    precision: "integer (no rounding); non-negative"
    variants:
      - name: initial_score
        when: "computed at SCORED transition (residence_length measured at submit-time current_period_index)"
        difference: "Uses residence_start_period vs program.current_period_index at the moment of cross-check completion."
      - name: recalculated_score
        when: "computed at AnnualReview FINALIZED — residence_length measured at AnnualReview.review_period_index, household_type and household_members may have been updated"
        difference: "Same formula; different inputs because clock has advanced and updated_* fields applied. The two variants on the same Application can yield DIFFERENT integer values for identical residence_start_period due to RESIDENCE_PTS_CAP saturation (e.g. residence_length=15 vs 25 both cap to 20 — no change; 18 -> 20 differs)."

  - name: rent_reduction_discount_provisional
    trigger: "RentReduction creation (POST /rent-reductions) and resubmit"
    algorithm: tiered_pricing
    formula: |
      # Computed from declared_hardship_income_cents only
      ratio = declared_hardship_income_cents / monthly_base_rent_cents     # rational
      if ratio < 0.30: bps = 5000
      elif ratio < 0.50: bps = 3000
      elif ratio < 0.80: bps = 1500
      else: bps = 0
      # Hardship category boost (additive cap):
      CATEGORY_BOOST = { MAJOR_ILLNESS: 1500, UNEMPLOYMENT: 1000, DISABILITY: 1500, ELDER_CARE: 500 }
      provisional_discount_bps = min(10000, bps + CATEGORY_BOOST[hardship_category])
    input_set: "RentReduction.declared_hardship_income_cents, parent Contract -> HousingUnit.monthly_base_rent_cents, RentReduction.hardship_category"
    constants:
      TIER_THRESHOLDS: [0.30, 0.50, 0.80]
      TIER_BPS: [5000, 3000, 1500, 0]
      CATEGORY_BOOST: { MAJOR_ILLNESS: 1500, UNEMPLOYMENT: 1000, DISABILITY: 1500, ELDER_CARE: 500 }
      MAX_BPS: 10000
    precision: "integer basis points (no rounding; comparisons are strict <)"
    variants:
      - name: provisional
        when: "RentReduction.status in {SUBMITTED, PRIMARY_REVIEW, SECONDARY_REVIEW}"
        difference: "Uses declared_hardship_income_cents (self-reported)."
      - name: final
        when: "RentReduction.status = FINAL_APPROVED — see calculations.rent_reduction_discount_final"
        difference: "Replaces declared_hardship_income_cents with the verified income from the latest TAX_INCOME_ASSETS SyncEvent for parent application; can yield a different bps when verified income lands in a different tier than declared."

  - name: rent_reduction_discount_final
    trigger: "RentReduction SECONDARY_REVIEW -> FINAL_APPROVED transition"
    algorithm: tiered_pricing
    formula: |
      # Same tiering as rent_reduction_discount_provisional but using verified income.
      verified_income = (latest TAX_INCOME_ASSETS SyncEvent for parent application).payload.monthly_income_cents
      ratio = verified_income / monthly_base_rent_cents
      apply same TIER_THRESHOLDS / TIER_BPS / CATEGORY_BOOST / MAX_BPS as provisional
      final_discount_bps = result
    input_set: "Latest TAX_INCOME_ASSETS SyncEvent payload, parent Contract -> HousingUnit.monthly_base_rent_cents, RentReduction.hardship_category"
    constants:
      TIER_THRESHOLDS: [0.30, 0.50, 0.80]
      TIER_BPS: [5000, 3000, 1500, 0]
      CATEGORY_BOOST: { MAJOR_ILLNESS: 1500, UNEMPLOYMENT: 1000, DISABILITY: 1500, ELDER_CARE: 500 }
      MAX_BPS: 10000
    precision: "integer basis points"
    variants: []

  - name: monthly_effective_rent
    trigger: "Contract handover (initial); RentReduction FINAL_APPROVED; RentReduction EXPIRED; AnnualReview FINALIZED with rent_adjustment_cents != 0"
    algorithm: aggregation
    formula: |
      # Per-room rounding then sum, in fixed order.
      # bedroom_count from HousingUnit (STUDIO=0, ONE_BEDROOM=1, TWO_BEDROOM=2, THREE_BEDROOM=3).
      # The unit is treated as: 1 living_room + bedroom_count bedrooms. STUDIO has only living_room.
      LIVING_ROOM_FRACTION = 0.40   # 40% of base rent
      BEDROOM_FRACTION     = 0.60 / max(1, bedroom_count)  # remaining 60% split evenly across bedrooms; for STUDIO, the 60% is folded into living_room (i.e. living_room_fraction becomes 1.00)

      if apartment_type == STUDIO:
          rooms = [("living_room", 1.00)]
      else:
          rooms = [("living_room", 0.40)] + [("bedroom_i", 0.60/bedroom_count) for i in range(bedroom_count)]

      # Determine active discount: highest final_discount_bps among RentReduction
      # records on this contract whose status == FINAL_APPROVED AND
      # validity_start_period <= current_period_index < validity_end_period.
      # If two reductions tie on final_discount_bps, tie-break by latest created_at desc, then id desc.
      active_discount_bps = max over qualifying RentReductions, or 0 if none
      discount_factor = (10000 - active_discount_bps) / 10000

      # Per-room amount: rounded HALF_UP to integer cents BEFORE summation.
      per_room_amounts = []
      for (label, frac) in rooms:
          amt = base_rent_cents * frac * discount_factor
          per_room_amounts.append(round_half_up(amt))   # to integer cents

      monthly_effective_rent_cents = sum(per_room_amounts)

      # Then apply AnnualReview rent_adjustment_cents (additive integer cents) if any
      # active adjustment is in effect:
      monthly_effective_rent_cents += sum_of_active_annual_review_adjustments
    input_set: "Contract.allocation -> HousingUnit (apartment_type, bedroom_count, monthly_base_rent_cents); active RentReductions on this contract; active AnnualReview rent_adjustment_cents"
    constants:
      LIVING_ROOM_FRACTION_DEFAULT: 0.40
      BEDROOM_FRACTION_TOTAL: 0.60
      ROUND_MODE: HALF_UP
    precision: "Per-room rounded HALF_UP to integer cents BEFORE summation. The order is FIXED: round-per-line then sum. (Round-after-sum is incorrect.)"
    variants:
      - name: round_per_line_then_sum
        when: "Always (the pinned correct interpretation)"
        difference: "Each per-room amount is rounded to integer cents first; sum of rounded amounts may differ by ±N cents from sum-then-round."
      - name: sum_then_round_INCORRECT
        when: "Documented as incorrect; included to make the order requirement explicit"
        difference: "Summing fractional cents first then rounding once produces a different total when fractional parts exceed 0.5 collectively."

  - name: allocation_selector
    trigger: "POST /housing-programs/{programId}/allocations (HousingOfficer creates an allocation by selecting a unit and letting the system pick the matching application)"
    algorithm: waterfall_allocation
    formula: |
      # Inputs: target HousingUnit u in AVAILABLE
      # Candidate set: Applications in QUEUED whose:
      #   - family_size matches unit.bedroom_count tolerance:
      #       STUDIO          -> family_size in {1}
      #       ONE_BEDROOM     -> family_size in {1, 2}
      #       TWO_BEDROOM     -> family_size in {2, 3, 4}
      #       THREE_BEDROOM   -> family_size in {4, 5, 6, 7}
      #   - if u.accessibility_compliant == false:
      #       application.requires_accessibility must be false (else excluded)
      #   - if u.accessibility_compliant == true:
      #       no exclusion on requires_accessibility
      # Ranking (descending priority — first non-tie wins):
      #   1. queue_score DESC
      #   2. requires_accessibility DESC if u.accessibility_compliant == true (accessibility-needers
      #      preferred when the unit is accessible)
      #   3. tie_break_key ASC (residence_start_period asc, application created_at asc, application id asc)
      # If candidate set is empty: return ERR_NO_ELIGIBLE_APPLICATION (selector fallback).
      selected = first candidate after sort
    input_set: "Applications in QUEUED for the program; target HousingUnit"
    constants:
      FAMILY_SIZE_TOLERANCE:
        STUDIO: [1]
        ONE_BEDROOM: [1, 2]
        TWO_BEDROOM: [2, 3, 4]
        THREE_BEDROOM: [4, 5, 6, 7]
    precision: "deterministic; tie-break is total"
    variants: []

  - name: deposit_amount
    trigger: "Allocation PUBLISHED -> CONFIRMED transition (auto-creates Contract with this deposit)"
    algorithm: aggregation
    formula: |
      deposit_amount_cents = round_half_up(monthly_base_rent_cents * 2)
      # monthly_base_rent_cents is already integer cents, so this is just monthly_base_rent_cents * 2.
    input_set: "HousingUnit.monthly_base_rent_cents"
    constants:
      MONTHS_OF_DEPOSIT: 2
    precision: "integer cents, HALF_UP"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role must be authorized for this operation per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Resource IDs in path must exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: concurrency
    check: "When request body includes version, it must equal current entity version"
    error_id: ERR_VERSION_MISMATCH
    http_status: 409
    applies_to: all mutation endpoints accepting version

  - priority: 5
    category: state
    check: "Application must be in DRAFT to submit, UNDER_REVIEW to cross-check, SCORED to enqueue, OCCUPIED to host AnnualReview, EXIT_PENDING to finalize-exit (and grace period elapsed)"
    error_id: "ERR_APPLICATION_NOT_IN_DRAFT | ERR_APPLICATION_NOT_UNDER_REVIEW | ERR_APPLICATION_NOT_SCORED | ERR_APPLICATION_NOT_OCCUPIED | ERR_APPLICATION_NOT_EXIT_PENDING"
    http_status: 409
    applies_to: relevant endpoints

  - priority: 6
    category: state
    check: "Allocation must be in PUBLISHED for confirm/reject/objection-create; in CONFIRMED for contract auto-creation"
    error_id: "ERR_ALLOCATION_NOT_PUBLISHED | ERR_ALLOCATION_NOT_CONFIRMED"
    http_status: 409
    applies_to: allocation-related endpoints

  - priority: 7
    category: state
    check: "Contract must be in DRAFT to pay-deposit, DEPOSIT_PAID to sign, SIGNED to handover"
    error_id: "ERR_CONTRACT_NOT_IN_DRAFT | ERR_CONTRACT_NOT_DEPOSIT_PAID | ERR_CONTRACT_NOT_SIGNED"
    http_status: 409
    applies_to: contract action endpoints

  - priority: 8
    category: state
    check: "RentReduction must be in correct preceding state for each transition"
    error_id: "ERR_RENT_REDUCTION_NOT_SUBMITTED | ERR_RENT_REDUCTION_NOT_IN_PRIMARY | ERR_RENT_REDUCTION_NOT_IN_SECONDARY | ERR_RENT_REDUCTION_NOT_REJECTABLE | ERR_RENT_REDUCTION_NOT_REJECTED"
    http_status: 409
    applies_to: rent-reduction endpoints

  - priority: 9
    category: business_temporal
    check: "Public notice period must have elapsed before allocation confirmation (current_period_index >= notice_end_period)"
    error_id: ERR_NOTICE_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /allocations/{id}/confirm"

  - priority: 10
    category: business_temporal
    check: "Objections may only be filed while notice period is open (current_period_index < notice_end_period)"
    error_id: ERR_NOTICE_PERIOD_CLOSED
    http_status: 409
    applies_to: "POST /allocations/{id}/objections"

  - priority: 11
    category: business_temporal
    check: "Grace period must have elapsed before finalize-exit"
    error_id: ERR_GRACE_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /applications/{id}/finalize-exit"

  - priority: 12
    category: business_referential
    check: "Cross-check: latest CIVIL_AFFAIRS_HOUSEHOLD SyncEvent must include every household_member.citizen_id"
    error_id: ERR_HOUSEHOLD_REGISTRATION_MISMATCH
    http_status: 409
    applies_to: "POST /applications/{id}/cross-check"

  - priority: 13
    category: business_referential
    check: "Cross-check: latest PUBLIC_SECURITY_IDENTITY SyncEvent must mark every household_member.citizen_id identity_verified=true"
    error_id: ERR_IDENTITY_VERIFICATION_FAILED
    http_status: 409
    applies_to: "POST /applications/{id}/cross-check"

  - priority: 14
    category: business_safety
    check: "No household_member.citizen_id may already occupy another Contract in {ACTIVE, DEPOSIT_PAID, SIGNED} for this program"
    error_id: ERR_EXISTING_HOUSING_DETECTED
    http_status: 409
    applies_to: "POST /applications/{id}/cross-check"

  - priority: 15
    category: business_fiscal
    check: "Cross-check: verified per-capita monthly income must NOT exceed program.per_capita_income_threshold_cents (strict >: failing means INELIGIBLE; equal value passes)"
    error_id: ERR_INCOME_OVER_THRESHOLD
    http_status: 409
    applies_to: "POST /applications/{id}/cross-check"

  - priority: 16
    category: business_fiscal
    check: "Cross-check: verified per-capita total assets must NOT exceed program.per_capita_asset_threshold_cents (strict >)"
    error_id: ERR_ASSETS_OVER_THRESHOLD
    http_status: 409
    applies_to: "POST /applications/{id}/cross-check"

  - priority: 17
    category: business_constraint
    check: "HousingUnit selected for allocation must be in AVAILABLE"
    error_id: ERR_UNIT_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /allocations"

  - priority: 18
    category: business_constraint
    check: "Allocation candidate set must be non-empty per allocation_selector"
    error_id: ERR_NO_ELIGIBLE_APPLICATION
    http_status: 409
    applies_to: "POST /allocations"

  - priority: 19
    category: business_fiscal
    check: "Contract pay-deposit: latest PAYMENT_DEPOSIT SyncEvent for this contract has payload.amount_cents == deposit_amount_cents"
    error_id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http_status: 402
    applies_to: "POST /contracts/{id}/pay-deposit"

  - priority: 20
    category: business_constraint
    check: "Contract sign: lease_start_period >= confirmation_period AND lease_end_period > lease_start_period"
    error_id: ERR_INVALID_LEASE_TERM
    http_status: 400
    applies_to: "POST /contracts/{id}/sign"

  - priority: 21
    category: business_temporal
    check: "Contract handover: current_period_index >= lease_start_period"
    error_id: ERR_LEASE_NOT_STARTED
    http_status: 409
    applies_to: "POST /contracts/{id}/handover"

  - priority: 22
    category: business_constraint
    check: "RentReduction final-approve: secondary reviewer must differ from primary reviewer"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: "POST /rent-reductions/{id}/final-approve"

  - priority: 23
    category: business_temporal
    check: "RentReduction final-approve: validity window [current_period_index, current_period_index+12) must not overlap any existing FINAL_APPROVED RentReduction window on the same contract"
    error_id: ERR_OVERLAPPING_RENT_REDUCTION
    http_status: 409
    applies_to: "POST /rent-reductions/{id}/final-approve"

  - priority: 24
    category: business_constraint
    check: "Application uniqueness: at most one Application per (program, applicant_user_id) in non-terminal status"
    error_id: ERR_DUPLICATE_ACTIVE_APPLICATION
    http_status: 409
    applies_to: "POST /applications"

  - priority: 25
    category: business_constraint
    check: "HousingUnit.bedroom_count must match apartment_type (STUDIO=0, ONE_BEDROOM=1, TWO_BEDROOM=2, THREE_BEDROOM=3)"
    error_id: ERR_BEDROOM_COUNT_TYPE_MISMATCH
    http_status: 400
    applies_to: "POST/PUT /housing-units"

  - priority: 26
    category: business_constraint
    check: "AnnualReview is only allowed when no other OPEN AnnualReview exists for the same Application"
    error_id: ERR_ANNUAL_REVIEW_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /applications/{id}/annual-reviews"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Housing Programs ---
  - method: POST
    path: "/housing-programs"
    description: "Create a HousingProgram"
    roles: [HousingDirector]
    code: 201
    input: ["name", "description?", "notice_period_length", "grace_period_length", "per_capita_income_threshold_cents", "per_capita_asset_threshold_cents"]
    output: HousingProgram
    side_effects: ["current_period_index initialized to 0"]

  - method: GET
    path: "/housing-programs"
    description: "List HousingPrograms"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "HousingProgram[]"
    side_effects: []

  - method: GET
    path: "/housing-programs/{programId}"
    description: "Get a HousingProgram"
    roles: [Any]
    code: 200
    input: []
    output: HousingProgram
    side_effects: []

  - method: POST
    path: "/housing-programs/{programId}/clock/advance"
    description: "Advance the program clock (test-driving endpoint for time-gated transitions). Triggers automatic sweeps for: RentReduction FINAL_APPROVED -> EXPIRED when validity_end_period reached; Application EXIT_PENDING -> EXITED when grace period elapsed."
    roles: [HousingDirector]
    code: 200
    input: ["by_periods (1..10000)"]
    output: HousingProgram
    side_effects:
      - "current_period_index += by_periods"
      - "RentReduction sweep: any FINAL_APPROVED with current_period_index >= validity_end_period -> EXPIRED (and recompute Contract.monthly_effective_rent_cents)"
      - "Application sweep: any EXIT_PENDING with current_period_index >= exit_trigger_period + program.grace_period_length -> EXITED (cascade Contract -> TERMINATED, HousingUnit -> AVAILABLE)"

  # --- Sync Events (test-driving the multi-department feeds) ---
  - method: POST
    path: "/housing-programs/{programId}/sync-events"
    description: "Emit a SyncEvent (test-driving endpoint for civil affairs / public security / taxation / social security / payment integrations)"
    roles: [HousingOfficer, IntegrationGateway]
    code: 201
    input: ["event_type", "subject_type", "subject_id", "payload"]
    output: SyncEvent
    side_effects: ["emitted_period = current_period_index"]

  - method: GET
    path: "/housing-programs/{programId}/sync-events"
    description: "List sync events (audit log read)"
    roles: [Any]
    code: 200
    input: ["event_type?", "subject_type?", "subject_id?", "limit?", "offset?"]
    output: "SyncEvent[]"
    side_effects: []

  # --- Applications ---
  - method: POST
    path: "/housing-programs/{programId}/applications"
    description: "Create an Application (DRAFT)"
    roles: [Applicant]
    code: 201
    input: ["household_members", "household_type", "declared_monthly_income_cents", "declared_total_assets_cents", "residence_start_period"]
    output: Application
    side_effects:
      - "applicant_user_id set from X-User-ID"
      - "family_size and requires_accessibility computed"
      - "status = DRAFT"

  - method: GET
    path: "/housing-programs/{programId}/applications"
    description: "List Applications"
    roles: [HousingOfficer, HousingDirector, Applicant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Application[]"
    side_effects: []
    note: "Applicant role only sees applications where applicant_user_id == X-User-ID"

  - method: GET
    path: "/housing-programs/{programId}/applications/{appId}"
    description: "Get an Application"
    roles: [HousingOfficer, HousingDirector, Applicant]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: POST
    path: "/housing-programs/{programId}/applications/{appId}/submit"
    description: "Submit a DRAFT Application for review"
    roles: [Applicant]
    code: 200
    input: ["version?"]
    output: Application
    side_effects: ["status DRAFT -> UNDER_REVIEW"]

  - method: POST
    path: "/housing-programs/{programId}/applications/{appId}/cross-check"
    description: "Run multi-department cross-check; transitions to SCORED or REJECTED"
    roles: [HousingOfficer]
    code: 200
    input: []
    output: Application
    side_effects:
      - "On pass: status -> SCORED, queue_score and tie_break_key computed, cross_check_status=PASSED"
      - "On fail: status -> REJECTED with rejection_reason set"
      - "Emit SyncEvent type=AUDIT_ELIGIBILITY_CHANGE"

  - method: POST
    path: "/housing-programs/{programId}/applications/{appId}/enqueue"
    description: "Move SCORED Application to QUEUED"
    roles: [HousingOfficer]
    code: 200
    input: []
    output: Application
    side_effects: ["status SCORED -> QUEUED"]

  - method: POST
    path: "/housing-programs/{programId}/applications/{appId}/finalize-exit"
    description: "Finalize exit after grace period (alternative to clock-driven sweep)"
    roles: [HousingOfficer]
    code: 200
    input: []
    output: Application
    side_effects:
      - "status EXIT_PENDING -> EXITED"
      - "Contract -> TERMINATED, HousingUnit -> AVAILABLE"

  - method: POST
    path: "/housing-programs/{programId}/applications/{appId}/annual-reviews"
    description: "Create an AnnualReview (OPEN) for an OCCUPIED Application"
    roles: [HousingOfficer]
    code: 201
    input: ["updated_household_members?", "updated_declared_monthly_income_cents?", "updated_declared_total_assets_cents?"]
    output: AnnualReview
    side_effects: ["review_period_index = current_period_index"]

  - method: POST
    path: "/housing-programs/{programId}/applications/{appId}/annual-reviews/{reviewId}/finalize"
    description: "Finalize AnnualReview; cascades rent adjustment or exit trigger"
    roles: [HousingOfficer]
    code: 200
    input: []
    output: AnnualReview
    side_effects:
      - "Apply updates to Application; recompute queue_score and re_eligibility"
      - "If INELIGIBLE: Application -> EXIT_PENDING, exit_trigger_period set"
      - "If ELIGIBLE: rent_adjustment_cents applied to active Contract.monthly_effective_rent_cents"
      - "Emit SyncEvent type=AUDIT_ELIGIBILITY_CHANGE"

  # --- Housing Units ---
  - method: POST
    path: "/housing-programs/{programId}/housing-units"
    description: "Create a HousingUnit"
    roles: [HousingDirector]
    code: 201
    input: ["unit_code", "apartment_type", "bedroom_count", "square_meters", "monthly_base_rent_cents", "location_priority_tier", "accessibility_compliant"]
    output: HousingUnit
    side_effects: ["status = AVAILABLE"]

  - method: GET
    path: "/housing-programs/{programId}/housing-units"
    description: "List HousingUnits"
    roles: [Any]
    code: 200
    input: ["status?", "apartment_type?", "limit?", "offset?"]
    output: "HousingUnit[]"
    side_effects: []

  - method: GET
    path: "/housing-programs/{programId}/housing-units/{unitId}"
    description: "Get a HousingUnit"
    roles: [Any]
    code: 200
    input: []
    output: HousingUnit
    side_effects: []

  # --- Allocations ---
  - method: POST
    path: "/housing-programs/{programId}/allocations"
    description: "Create an Allocation by selecting a HousingUnit; system picks the matching application via allocation_selector"
    roles: [HousingOfficer]
    code: 201
    input: ["housing_unit_id"]
    output: Allocation
    side_effects:
      - "Selected Application picked per calculations.allocation_selector"
      - "HousingUnit -> RESERVED"
      - "Application QUEUED -> ALLOCATED"
      - "Allocation status = PUBLISHED, notice_start_period = current_period_index, notice_end_period = current + program.notice_period_length"
      - "Emit SyncEvent type=AUDIT_ALLOCATION_DECISION"

  - method: GET
    path: "/housing-programs/{programId}/allocations"
    description: "List Allocations"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Allocation[]"
    side_effects: []

  - method: GET
    path: "/housing-programs/{programId}/allocations/{allocId}"
    description: "Get an Allocation"
    roles: [Any]
    code: 200
    input: []
    output: Allocation
    side_effects: []

  - method: POST
    path: "/housing-programs/{programId}/allocations/{allocId}/confirm"
    description: "Confirm allocation after notice period elapsed (Applicant action)"
    roles: [Applicant]
    code: 200
    input: ["version?"]
    output: Allocation
    side_effects:
      - "status PUBLISHED -> CONFIRMED, confirmation_period set"
      - "Auto-create Contract (DRAFT) with deposit_amount_cents = unit.monthly_base_rent_cents * 2"
      - "Emit SyncEvent type=AUDIT_ALLOCATION_DECISION"

  - method: POST
    path: "/housing-programs/{programId}/allocations/{allocId}/reject"
    description: "Applicant declines this allocation; reverts to QUEUED"
    roles: [Applicant]
    code: 200
    input: []
    output: Allocation
    side_effects:
      - "status -> REVERTED"
      - "Application ALLOCATED -> QUEUED"
      - "HousingUnit RESERVED -> AVAILABLE"

  # --- Objections ---
  - method: POST
    path: "/housing-programs/{programId}/allocations/{allocId}/objections"
    description: "Submit an Objection during the notice period"
    roles: [Applicant, Citizen]
    code: 201
    input: ["reason_text"]
    output: Objection
    side_effects:
      - "If allocation in PUBLISHED: allocation -> UNDER_OBJECTION"

  - method: POST
    path: "/housing-programs/{programId}/allocations/{allocId}/objections/{objId}/sustain"
    description: "Sustain an objection (reverts allocation)"
    roles: [HousingOfficer]
    code: 200
    input: ["review_notes?"]
    output: Objection
    side_effects:
      - "Objection -> SUSTAINED"
      - "Allocation -> REVERTED (cascade)"

  - method: POST
    path: "/housing-programs/{programId}/allocations/{allocId}/objections/{objId}/dismiss"
    description: "Dismiss an objection"
    roles: [HousingOfficer]
    code: 200
    input: ["review_notes?"]
    output: Objection
    side_effects:
      - "Objection -> DISMISSED"
      - "If last open objection AND zero SUSTAINED: Allocation UNDER_OBJECTION -> PUBLISHED"

  # --- Contracts ---
  - method: GET
    path: "/housing-programs/{programId}/contracts/{contractId}"
    description: "Get a Contract"
    roles: [Any]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: POST
    path: "/housing-programs/{programId}/contracts/{contractId}/pay-deposit"
    description: "Mark contract as deposit paid (after PAYMENT_DEPOSIT SyncEvent matches deposit_amount_cents)"
    roles: [Applicant]
    code: 200
    input: []
    output: Contract
    side_effects: ["status DRAFT -> DEPOSIT_PAID, deposit_paid = true"]

  - method: POST
    path: "/housing-programs/{programId}/contracts/{contractId}/sign"
    description: "Sign contract with electronic signature"
    roles: [Applicant]
    code: 200
    input: ["signature_blob", "lease_start_period", "lease_end_period"]
    output: Contract
    side_effects: ["status DEPOSIT_PAID -> SIGNED, signature_blob stored, lease_* set"]

  - method: POST
    path: "/housing-programs/{programId}/contracts/{contractId}/handover"
    description: "Record handover and activate contract"
    roles: [HousingOfficer]
    code: 200
    input: []
    output: Contract
    side_effects:
      - "status SIGNED -> ACTIVE, handover_recorded = true"
      - "Application ALLOCATED -> OCCUPIED"
      - "HousingUnit RESERVED -> OCCUPIED"
      - "monthly_effective_rent_cents initialized"

  # --- Rent Reductions ---
  - method: POST
    path: "/housing-programs/{programId}/contracts/{contractId}/rent-reductions"
    description: "Apply for a rent reduction (hardship)"
    roles: [Applicant]
    code: 201
    input: ["hardship_category", "declared_hardship_income_cents", "supporting_documents", "requested_discount_bps?"]
    output: RentReduction
    side_effects: ["status = SUBMITTED, provisional_discount_bps computed"]

  - method: GET
    path: "/housing-programs/{programId}/rent-reductions/{rrId}"
    description: "Get a RentReduction"
    roles: [Any]
    code: 200
    input: []
    output: RentReduction
    side_effects: []

  - method: POST
    path: "/housing-programs/{programId}/rent-reductions/{rrId}/advance-to-primary"
    description: "Advance SUBMITTED -> PRIMARY_REVIEW"
    roles: [HousingOfficer]
    code: 200
    input: []
    output: RentReduction
    side_effects: []

  - method: POST
    path: "/housing-programs/{programId}/rent-reductions/{rrId}/advance-to-secondary"
    description: "Advance PRIMARY_REVIEW -> SECONDARY_REVIEW (records primary_review_user_id)"
    roles: [HousingOfficer]
    code: 200
    input: []
    output: RentReduction
    side_effects: ["primary_review_user_id = X-User-ID"]

  - method: POST
    path: "/housing-programs/{programId}/rent-reductions/{rrId}/final-approve"
    description: "Final approve (HousingDirector); enforces segregation of duties and overlap check"
    roles: [HousingDirector]
    code: 200
    input: []
    output: RentReduction
    side_effects:
      - "secondary_review_user_id = X-User-ID, status -> FINAL_APPROVED"
      - "final_discount_bps computed; validity window set; recompute Contract.monthly_effective_rent_cents"

  - method: POST
    path: "/housing-programs/{programId}/rent-reductions/{rrId}/reject"
    description: "Reject during PRIMARY_REVIEW or SECONDARY_REVIEW"
    roles: [HousingOfficer, HousingDirector]
    code: 200
    input: []
    output: RentReduction
    side_effects: ["status -> REJECTED"]

  - method: POST
    path: "/housing-programs/{programId}/rent-reductions/{rrId}/resubmit"
    description: "Applicant resubmits after rejection"
    roles: [Applicant]
    code: 200
    input: ["hardship_category?", "declared_hardship_income_cents?", "supporting_documents?"]
    output: RentReduction
    side_effects:
      - "status REJECTED -> SUBMITTED"
      - "provisional_discount_bps recomputed; reviewer fields cleared"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # Auth & headers
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role/owner not permitted for this operation" }

  # Existence
  - { id: ERR_NOT_FOUND, http: 404, condition: "Generic resource not found" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "HousingProgram not found" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "Application not found" }
  - { id: ERR_HOUSING_UNIT_NOT_FOUND, http: 404, condition: "HousingUnit not found" }
  - { id: ERR_ALLOCATION_NOT_FOUND, http: 404, condition: "Allocation not found" }
  - { id: ERR_OBJECTION_NOT_FOUND, http: 404, condition: "Objection not found" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "Contract not found" }
  - { id: ERR_RENT_REDUCTION_NOT_FOUND, http: 404, condition: "RentReduction not found" }
  - { id: ERR_ANNUAL_REVIEW_NOT_FOUND, http: 404, condition: "AnnualReview not found" }
  - { id: ERR_SYNC_EVENT_NOT_FOUND, http: 404, condition: "SyncEvent not found" }

  # Input validation
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request body, missing required field, type mismatch" }
  - { id: ERR_INVALID_LEASE_TERM, http: 400, condition: "lease_start_period < confirmation_period or lease_end_period <= lease_start_period" }
  - { id: ERR_BEDROOM_COUNT_TYPE_MISMATCH, http: 400, condition: "HousingUnit.bedroom_count does not match apartment_type" }

  # Concurrency
  - { id: ERR_VERSION_MISMATCH, http: 409, condition: "Provided version does not equal current entity version" }
  - { id: ERR_DUPLICATE_ACTIVE_APPLICATION, http: 409, condition: "Applicant already has a non-terminal Application in this program" }

  # State (Application)
  - { id: ERR_APPLICATION_NOT_IN_DRAFT, http: 409, condition: "Application must be DRAFT" }
  - { id: ERR_APPLICATION_NOT_UNDER_REVIEW, http: 409, condition: "Application must be UNDER_REVIEW" }
  - { id: ERR_APPLICATION_NOT_SCORED, http: 409, condition: "Application must be SCORED" }
  - { id: ERR_APPLICATION_NOT_OCCUPIED, http: 409, condition: "Application must be OCCUPIED" }
  - { id: ERR_APPLICATION_NOT_EXIT_PENDING, http: 409, condition: "Application must be EXIT_PENDING" }

  # State (Allocation)
  - { id: ERR_ALLOCATION_NOT_PUBLISHED, http: 409, condition: "Allocation must be PUBLISHED" }
  - { id: ERR_ALLOCATION_NOT_CONFIRMED, http: 409, condition: "Allocation must be CONFIRMED" }
  - { id: ERR_OBJECTION_NOT_PENDING, http: 409, condition: "Objection must be PENDING_REVIEW" }

  # State (Contract)
  - { id: ERR_CONTRACT_NOT_IN_DRAFT, http: 409, condition: "Contract must be DRAFT" }
  - { id: ERR_CONTRACT_NOT_DEPOSIT_PAID, http: 409, condition: "Contract must be DEPOSIT_PAID" }
  - { id: ERR_CONTRACT_NOT_SIGNED, http: 409, condition: "Contract must be SIGNED" }

  # State (RentReduction)
  - { id: ERR_RENT_REDUCTION_NOT_SUBMITTED, http: 409, condition: "RentReduction must be SUBMITTED" }
  - { id: ERR_RENT_REDUCTION_NOT_IN_PRIMARY, http: 409, condition: "RentReduction must be PRIMARY_REVIEW" }
  - { id: ERR_RENT_REDUCTION_NOT_IN_SECONDARY, http: 409, condition: "RentReduction must be SECONDARY_REVIEW" }
  - { id: ERR_RENT_REDUCTION_NOT_REJECTABLE, http: 409, condition: "RentReduction must be in {PRIMARY_REVIEW, SECONDARY_REVIEW}" }
  - { id: ERR_RENT_REDUCTION_NOT_REJECTED, http: 409, condition: "RentReduction must be REJECTED to resubmit" }

  # State (AnnualReview)
  - { id: ERR_ANNUAL_REVIEW_NOT_OPEN, http: 409, condition: "AnnualReview must be OPEN" }
  - { id: ERR_ANNUAL_REVIEW_ALREADY_OPEN, http: 409, condition: "Another OPEN AnnualReview exists for this Application" }

  # Business — referential / cross-data
  - { id: ERR_HOUSEHOLD_REGISTRATION_MISMATCH, http: 409, condition: "Latest CIVIL_AFFAIRS_HOUSEHOLD SyncEvent missing one or more household_member.citizen_id" }
  - { id: ERR_IDENTITY_VERIFICATION_FAILED, http: 409, condition: "Latest PUBLIC_SECURITY_IDENTITY SyncEvent does not mark all citizen_ids identity_verified=true" }
  - { id: ERR_INCOME_OVER_THRESHOLD, http: 409, condition: "Verified per-capita monthly income exceeds program threshold (strict >)" }
  - { id: ERR_ASSETS_OVER_THRESHOLD, http: 409, condition: "Verified per-capita asset value exceeds program threshold (strict >)" }
  - { id: ERR_EXISTING_HOUSING_DETECTED, http: 409, condition: "A household member already occupies another contract in {ACTIVE, DEPOSIT_PAID, SIGNED} for this program" }

  # Business — temporal
  - { id: ERR_NOTICE_PERIOD_NOT_ELAPSED, http: 409, condition: "current_period_index < notice_end_period" }
  - { id: ERR_NOTICE_PERIOD_CLOSED, http: 409, condition: "current_period_index >= notice_end_period (objection window closed)" }
  - { id: ERR_GRACE_PERIOD_NOT_ELAPSED, http: 409, condition: "current_period_index < exit_trigger_period + program.grace_period_length" }
  - { id: ERR_LEASE_NOT_STARTED, http: 409, condition: "current_period_index < lease_start_period" }
  - { id: ERR_OVERLAPPING_RENT_REDUCTION, http: 409, condition: "New RentReduction validity window [start, end) overlaps an existing FINAL_APPROVED window on the same contract" }

  # Business — fiscal
  - { id: ERR_DEPOSIT_AMOUNT_MISMATCH, http: 402, condition: "Latest PAYMENT_DEPOSIT SyncEvent payload.amount_cents != contract.deposit_amount_cents" }

  # Business — constraint / safety
  - { id: ERR_UNIT_NOT_AVAILABLE, http: 409, condition: "HousingUnit is not AVAILABLE" }
  - { id: ERR_NO_ELIGIBLE_APPLICATION, http: 409, condition: "No QUEUED Application matches the unit per allocation_selector" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "secondary_review_user_id == primary_review_user_id at final-approve" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: HousingDirector
    description: "Top-level program admin; creates programs, housing units, and acts as final approver for rent reductions"
    identity: opaque
    exclusive_operations:
      - "POST /housing-programs"
      - "POST /housing-programs/{id}/clock/advance"
      - "POST /housing-programs/{id}/housing-units"
      - "POST /housing-programs/{id}/rent-reductions/{id}/final-approve"
    shared_operations:
      - "POST /housing-programs/{id}/rent-reductions/{id}/reject (with HousingOfficer)"
      - "GET endpoints (with Any)"

  - name: HousingOfficer
    description: "Operational staff: cross-checks, allocations, objection review, handover, primary/secondary RR review (but not final approval)"
    identity: opaque
    exclusive_operations:
      - "POST /housing-programs/{id}/applications/{id}/cross-check"
      - "POST /housing-programs/{id}/applications/{id}/enqueue"
      - "POST /housing-programs/{id}/applications/{id}/finalize-exit"
      - "POST /housing-programs/{id}/applications/{id}/annual-reviews"
      - "POST /housing-programs/{id}/applications/{id}/annual-reviews/{id}/finalize"
      - "POST /housing-programs/{id}/allocations"
      - "POST /housing-programs/{id}/allocations/{id}/objections/{id}/sustain"
      - "POST /housing-programs/{id}/allocations/{id}/objections/{id}/dismiss"
      - "POST /housing-programs/{id}/contracts/{id}/handover"
      - "POST /housing-programs/{id}/rent-reductions/{id}/advance-to-primary"
      - "POST /housing-programs/{id}/rent-reductions/{id}/advance-to-secondary"
    shared_operations:
      - "POST /housing-programs/{id}/sync-events (with IntegrationGateway)"
      - "POST /housing-programs/{id}/rent-reductions/{id}/reject (with HousingDirector)"

  - name: Applicant
    description: "End-user applying for housing; owns one Application"
    identity: "entity_backed:Application"
    exclusive_operations:
      - "POST /housing-programs/{id}/applications"
      - "POST /housing-programs/{id}/applications/{id}/submit (must own Application)"
      - "POST /housing-programs/{id}/allocations/{id}/confirm (must own parent Application)"
      - "POST /housing-programs/{id}/allocations/{id}/reject (must own parent Application)"
      - "POST /housing-programs/{id}/contracts/{id}/pay-deposit (must own parent Application)"
      - "POST /housing-programs/{id}/contracts/{id}/sign (must own parent Application)"
      - "POST /housing-programs/{id}/contracts/{id}/rent-reductions"
      - "POST /housing-programs/{id}/rent-reductions/{id}/resubmit (must own parent Contract)"
    shared_operations:
      - "POST /housing-programs/{id}/allocations/{id}/objections (with Citizen)"
      - "GET endpoints (scoped: only own Application)"
    note: "X-User-ID equals applicant_user_id; identity_backed:Application means a given X-User-ID can be the owner of at most one Application in non-terminal status per program (uniqueness enforced)."

  - name: Citizen
    description: "Public observer; may file objections during notice period"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /housing-programs/{id}/allocations/{id}/objections (with Applicant)"
      - "GET endpoints (with Any)"

  - name: IntegrationGateway
    description: "External-system integration role used by civil-affairs / public-security / taxation / social-security / payment connectors"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /housing-programs/{id}/sync-events (with HousingOfficer)"
      - "GET /housing-programs/{id}/sync-events"

  - name: Any
    description: "Read-only role grouping for any authenticated role"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /housing-programs"
      - "GET /housing-programs/{id}"
      - "GET /housing-programs/{id}/housing-units (and {id})"
      - "GET /housing-programs/{id}/applications and {id} (Applicant restricted to own)"
      - "GET /housing-programs/{id}/allocations (and {id})"
      - "GET /housing-programs/{id}/contracts/{id}"
      - "GET /housing-programs/{id}/rent-reductions/{id}"
      - "GET /housing-programs/{id}/sync-events"
