          - validations[priority=9]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "The OCC field is the PARENT contractor's version, and the PATCH that added HEIGHTS bumped it from 1 to 2: replaying the create with the observed-but-stale 1 returns 412 while the identical body with 2 succeeds, and the rejected attempt leaves version at 2."
