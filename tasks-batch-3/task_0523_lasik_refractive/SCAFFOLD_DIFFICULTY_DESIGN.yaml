            - call: "POST /refractive/screenings"
              payload: { patient_id: "${pat1}", performed_by_optometrist_id: "${od_id}", corneal_thickness_um: 550, topography_k_max: 44.0, refractive_error_diopters: 3.0 }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { scr1: $.data.id }
            - call: "POST /refractive/screenings/${scr1}/submit"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
            - call: "POST /refractive/screenings/${scr1}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Surgeon
              as_user_id: "${surg_id}"
            - call: "POST /refractive/cases"
              payload: { patient_id: "${pat1}", screening_id: "${scr1}", package_id: "${pkg}" }
              as: Coordinator
              captures: { case1: $.data.id }
            - call: "POST /refractive/cases/${case1}/financing"
              payload: { down_payment_cents: 100000, term_months: 12, apr_bps: 0 }
              as: Coordinator
              captures: { plan1: $.data.id }
          trigger:
            - call: "POST /refractive/financing/${plan1}/installments"
              payload: { amount_cents: 400000 }
              as: Coordinator
              captures: { plan1_status: $.data.status, plan1_settled: $.data.amount_settled_cents }
          assert:
            - "FinancingPlan.${plan1}.amount_settled_cents == 500000"
            - "FinancingPlan.${plan1}.status == SETTLED"
            - "SurgeryCase.${case1}.financial_status == PAID_IN_FULL"

