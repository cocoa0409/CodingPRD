                employer_id: "${employer_id}"
                program_id: "${program_id}"
                agreement_id: "${agreement_id}"
                expected_agreement_version: "${agreement_version}"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { listing_id: "$.data.id" }
            - &b_read_emp1
