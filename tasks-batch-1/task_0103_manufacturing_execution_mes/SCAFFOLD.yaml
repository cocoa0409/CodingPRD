scenario: |
  103. Manufacturing Execution System (MES): work order release, multi-level BOM
  explosion, routing/operation sequencing, WIP tracking, machine OEE
  (availability/performance/quality), scrap/rework disposition, lot/serial
  genealogy, electronic traveler sign-off

domain_name: manufacturing-execution-mes
api_prefix: /
# Flat multi-root API: products, bom-lines, routings, machines, lots,
# work-orders, work-order-operations, scrap-dispositions, lot-issues, and
# genealogy-links are peer top-level collections (graph/flat topology), so the
# common prefix is the API root.

complexity_profile:
  primary_archetype: graph_constraint
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: graph
  # Products form a multi-level BOM DAG (self-referential via BomLine: a parent
  # Product references many component Products). Routings/Operations and
  # WorkOrders/WorkOrderOperations are flat-with-references. Lots form a
  # genealogy DAG via GenealogyLink. No nested-URL ownership tree.

  state_machine_shape: cyclic
  # WorkOrderOperation is cyclic (IN_PROGRESS -> PAUSED -> IN_PROGRESS rework
  # loop, plus rework re-entry from a downstream scrap). ScrapDisposition is
  # branching fork-join (PENDING -> {SCRAPPED, REWORKED} with divergent side
  # effects). WorkOrder and Routing are linear-with-revert.

  relationship_patterns:
    - one_to_many        # WorkOrder -> WorkOrderOperation, Routing -> Operation
    - many_to_many       # Product <-> Product via BomLine (component usage)
    - self_referential   # Product references Product through BomLine; Lot -> Lot via GenealogyLink
    - cross_aggregate    # WorkOrderOperation -> Machine, LotIssue -> Lot

  role_model: peer_roles
  # ManufacturingEngineer owns Product/BOM/Routing/Operation definitions;
  # ProductionPlanner owns WorkOrder release; MachineOperator executes
  # operations and records run logs / scrap; QualityInspector signs off the
  # traveler and dispositions scrap/rework. PlantAdmin is an opaque override.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: "Unique stock-keeping unit code; uppercase alphanumeric."
        constraints: "unique across all Products; 3-32 chars"
      - name: name
        type: string
        source: input
        description: "Human-readable product name."
      - name: product_type
        type: enum
        source: input
        description: "Classifies the item in the BOM tree."
        constraints: "one of {FINISHED_GOOD, SUBASSEMBLY, RAW_MATERIAL}"
      - name: unit_cost_cents
        type: integer
        source: input
        description: "Standard unit cost in integer cents; used for material variance."
        constraints: ">= 0; required only for RAW_MATERIAL and SUBASSEMBLY"
        default: 0
      - name: lot_controlled
        type: boolean
        source: input
        description: "When true, issues of this product must reference a Lot for genealogy."
        default: false

  - name: BomLine
    parent: null
    common_fields: true
    fields:
      - name: parent_product_id
        type: string
        source: input
        description: "FK -> Product.id; the assembly that consumes the component."
        constraints: "parent_product_id != component_product_id (no self-loop)"
      - name: component_product_id
        type: string
        source: input
        description: "FK -> Product.id; the consumed component."
      - name: quantity_per
        type: number
        source: input
        description: "Units of component consumed per one unit of parent."
        constraints: "> 0"
      - name: scrap_factor_pct
        type: number
        source: input
        description: "Expected line scrap percent applied during explosion (0-100)."
        default: 0
        constraints: ">= 0 and < 100"

  - name: Routing
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the product this routing builds."
      - name: routing_code
        type: string
        source: input
        description: "Routing identifier, unique per product_id."
        constraints: "unique per (product_id, routing_code)"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state."
        default: DRAFT
        constraints: "one of {DRAFT, RELEASED, ARCHIVED}"
      - name: operation_count
        type: integer
        source: computed
        description: "Count of Operations attached to this routing; recomputed on operation add."
        default: 0

  - name: Operation
    parent: null
    common_fields: true
    fields:
      - name: routing_id
        type: string
        source: input
        description: "FK -> Routing.id; the routing this operation belongs to."
      - name: machine_id
        type: string
        source: input
        description: "FK -> Machine.id; the machine that runs this operation."
      - name: sequence_no
        type: integer
        source: input
        description: "Operation order within the routing; lower runs first."
        constraints: "> 0; unique per routing_id"
      - name: ideal_cycle_time_secs
        type: number
        source: input
        description: "Ideal seconds to produce one unit at this operation (OEE performance basis)."
        constraints: "> 0"
      - name: setup_buffer_secs
        type: integer
        source: input
        description: "Required idle buffer before the next op may start on the same work center."
        default: 0
        constraints: ">= 0"

  - name: Machine
    parent: null
    common_fields: true
    fields:
      - name: machine_code
        type: string
        source: input
        description: "Unique machine identifier on the shop floor."
        constraints: "unique"
      - name: work_center
        type: string
        source: input
        description: "Logical work-center grouping; used for setup-buffer overlap checks."
      - name: status
        type: enum
        source: system
        description: "Operational state."
        default: AVAILABLE
        constraints: "one of {AVAILABLE, RUNNING, DOWN}"
      - name: planned_production_secs
        type: integer
        source: input
        description: "Planned available production time per shift (OEE availability denominator)."
        constraints: "> 0"
      - name: oee_availability
        type: number
        source: computed
        description: "Latest computed availability ratio in [0,1]; recomputed from run logs."
        default: 0
      - name: oee_performance
        type: number
        source: computed
        description: "Latest computed performance ratio in [0,1]."
        default: 0
      - name: oee_quality
        type: number
        source: computed
        description: "Latest computed quality ratio in [0,1]."
        default: 0
      - name: oee_overall
        type: number
        source: computed
        description: "Latest A*P*Q overall OEE in [0,1]."
        default: 0
      - name: quality_flagged
        type: boolean
        source: computed
        description: "True when oee_quality dropped at or below QUALITY_FLOOR threshold."
        default: false

  - name: MachineRunLog
    parent: null
    common_fields: true
    fields:
      - name: machine_id
        type: string
        source: input
        description: "FK -> Machine.id; the machine this run interval belongs to."
      - name: window_start
        type: datetime
        source: input
        description: "Half-open interval start [start, end) of the run window."
      - name: window_end
        type: datetime
        source: input
        description: "Half-open interval end; exclusive."
        constraints: "window_end > window_start"
      - name: run_time_secs
        type: integer
        source: input
        description: "Actual machine running time within the window (availability numerator)."
        constraints: ">= 0 and <= (window_end - window_start in secs)"
      - name: total_units
        type: integer
        source: input
        description: "Total units produced in this window (good + defective)."
        constraints: ">= 0"
      - name: good_units
        type: integer
        source: input
        description: "Defect-free units in this window (quality numerator)."
        constraints: ">= 0 and <= total_units"

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the finished good to build."
      - name: routing_id
        type: string
        source: input
        description: "FK -> Routing.id; the routing followed; must be RELEASED."
      - name: order_qty
        type: integer
        source: input
        description: "Quantity of finished goods to produce."
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state."
        default: PLANNED
        constraints: "one of {PLANNED, RELEASED, IN_PROCESS, COMPLETED, CLOSED, CANCELLED}"
      - name: started_qty
        type: integer
        source: computed
        description: "Units that entered the first operation; WIP invariant left-hand side."
        default: 0
      - name: completed_qty
        type: integer
        source: computed
        description: "Units that passed the final operation."
        default: 0
      - name: scrapped_qty
        type: integer
        source: computed
        description: "Units scrapped via disposition; counts against WIP."
        default: 0
      - name: wip_qty
        type: integer
        source: computed
        description: "started_qty - completed_qty - scrapped_qty; in-process units."
        default: 0
      - name: material_variance_cents
        type: integer
        source: computed
        description: "Actual lot-issue cost minus standard BOM-explosion cost, in cents."
        default: 0

  - name: ComponentDemand
    parent: null
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the order that generated this demand."
      - name: component_product_id
        type: string
        source: input
        description: "FK -> Product.id; the exploded component required."
      - name: required_qty
        type: number
        source: computed
        description: "Standard required quantity from multi-level BOM explosion (with scrap factor)."
      - name: issued_qty
        type: number
        source: computed
        description: "Sum of LotIssue.issued_qty for this demand."
        default: 0
      - name: standard_cost_cents
        type: integer
        source: computed
        description: "required_qty * component unit_cost_cents, rounded per BOM-explosion order."
        default: 0

  - name: WorkOrderOperation
    parent: null
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the order this WIP node belongs to."
      - name: operation_id
        type: string
        source: input
        description: "FK -> Operation.id; the routing operation this node instantiates."
      - name: machine_id
        type: string
        source: input
        description: "FK -> Machine.id; copied from the operation at release."
      - name: sequence_no
        type: integer
        source: system
        description: "Copied from Operation.sequence_no; defines WIP flow order."
      - name: status
        type: enum
        source: system
        description: "WIP node state."
        default: QUEUED
        constraints: "one of {QUEUED, IN_PROGRESS, PAUSED, COMPLETED, REWORK}"
      - name: units_in
        type: integer
        source: input
        description: "Units routed into this op, set from the request body on start; basis for the good_qty + scrap_qty balance and the scrap-availability check."
        default: 0
      - name: good_qty
        type: integer
        source: computed
        description: "Units that completed this op defect-free."
        default: 0
      - name: scrap_qty
        type: integer
        source: computed
        description: "Units scrapped at this op."
        default: 0
      - name: scheduled_start
        type: datetime
        source: input
        description: "Planned start on the work center (setup-buffer overlap basis)."
        default: null
      - name: scheduled_end
        type: datetime
        source: input
        description: "Planned end on the work center; closed interval with setup buffer."
        default: null

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the lot-controlled product this lot holds."
      - name: lot_code
        type: string
        source: input
        description: "Unique lot/serial code."
        constraints: "unique"
      - name: on_hand_qty
        type: number
        source: computed
        description: "Remaining un-issued quantity; conserved with issued_qty."
      - name: issued_qty
        type: number
        source: computed
        description: "Quantity issued to work orders; on_hand_qty + issued_qty == received_qty."
        default: 0
      - name: received_qty
        type: number
        source: input
        description: "Quantity received into inventory at lot creation; conserved total."
        constraints: "> 0"

  - name: LotIssue
    parent: null
    common_fields: true
    fields:
      - name: component_demand_id
        type: string
        source: input
        description: "FK -> ComponentDemand.id; the demand this issue fulfills."
      - name: lot_id
        type: string
        source: input
        description: "FK -> Lot.id; the source lot consumed."
      - name: work_order_operation_id
        type: string
        source: input
        description: "FK -> WorkOrderOperation.id; the consuming WIP node (for genealogy)."
      - name: issued_qty
        type: number
        source: input
        description: "Quantity issued from the lot to the demand."
        constraints: "> 0"
      - name: reversed
        type: boolean
        source: computed
        description: "True after a compensating reversal restored the lot quantity."
        default: false

  - name: GenealogyLink
    parent: null
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the build that created the parent serial/lot."
      - name: parent_lot_id
        type: string
        source: input
        description: "FK -> Lot.id; the produced finished/subassembly lot."
      - name: child_lot_id
        type: string
        source: input
        description: "FK -> Lot.id; a consumed component lot in the genealogy DAG."
      - name: consumed_qty
        type: number
        source: system
        description: "Quantity of child lot consumed into the parent lot."

  - name: ScrapDisposition
    parent: null
    common_fields: true
    fields:
      - name: work_order_operation_id
        type: string
        source: input
        description: "FK -> WorkOrderOperation.id; the op where the defect was found."
      - name: quantity
        type: integer
        source: input
        description: "Units to disposition."
        constraints: "> 0"
      - name: defect_code
        type: string
        source: input
        description: "Defect classification code."
      - name: status
        type: enum
        source: system
        description: "Disposition state (branching fork-join)."
        default: PENDING
        constraints: "one of {PENDING, SCRAPPED, REWORKED}"
      - name: scrap_cost_cents
        type: integer
        source: computed
        description: "For SCRAPPED: quantity * finished/component unit_cost_cents; 0 for REWORKED."
        default: 0

  - name: TravelerSignoff
    parent: null
    common_fields: false
    fields:
      - name: work_order_operation_id
        type: string
        source: input
        description: "FK -> WorkOrderOperation.id; the op being signed off."
      - name: inspector_user_id
        type: string
        source: input
        description: "Opaque QualityInspector X-User-ID who signed."
      - name: result
        type: enum
        source: input
        description: "Sign-off outcome."
        constraints: "one of {PASS, FAIL}"
      - name: signed_at
        type: datetime
        source: system
        description: "Server timestamp of the sign-off (append-only traveler record)."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Routing
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: RELEASED
        trigger: "POST /routings/{id}/release"
        actor: ManufacturingEngineer
        preconditions:
          - "Routing.operation_count >= 1"
          - "every Operation under this routing references an existing Machine"
        side_effects:
          - "sets Routing.status = RELEASED"
          - "increments Routing.version by 1"
      - from: RELEASED
        to: ARCHIVED
        trigger: "POST /routings/{id}/archive"
        actor: ManufacturingEngineer
        preconditions:
          - "no WorkOrder in {RELEASED, IN_PROCESS} references this routing_id"
        side_effects:
          - "sets Routing.status = ARCHIVED"
          - "increments Routing.version by 1"

  - entity: WorkOrder
    initial_state: PLANNED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNED
        to: RELEASED
        trigger: "POST /work-orders/{id}/release"
        actor: ProductionPlanner
        preconditions:
          - "referenced Routing.status == RELEASED (cross-entity: WorkOrder->Routing)"
          - "Routing.product_id == WorkOrder.product_id"
          - "expected_work_order_version matches WorkOrder.version (OCC)"
        side_effects:
          - "sets WorkOrder.status = RELEASED"
          - "explodes multi-level BOM into ComponentDemand rows (cascade hop 1)"
          - "each ComponentDemand.required_qty + standard_cost_cents computed (cascade hop 2)"
          - "creates one WorkOrderOperation per Operation in sequence order (cascade hop 3)"
          - "increments WorkOrder.version by 1"
      - from: RELEASED
        to: IN_PROCESS
        trigger: "POST /work-order-operations/{id}/start (first op start)"
        actor: MachineOperator
        preconditions:
          - "the started WorkOrderOperation has the minimum sequence_no for the order"
        side_effects:
          - "sets WorkOrder.status = IN_PROCESS"
          - "sets WorkOrder.started_qty = order_qty"
          - "recomputes WorkOrder.wip_qty"
      - from: IN_PROCESS
        to: COMPLETED
        trigger: "POST /work-orders/{id}/complete"
        actor: ProductionPlanner
        preconditions:
          - "every WorkOrderOperation for this order is in {COMPLETED} (cross-entity: WorkOrder->WorkOrderOperation)"
          - "WorkOrder.wip_qty == 0"
        side_effects:
          - "sets WorkOrder.status = COMPLETED"
          - "finalizes consumed Lot.issued_qty and seals GenealogyLink rows (cascade hop 2 of complete-cascade)"
          - "computes WorkOrder.material_variance_cents (actual issues minus standard)"
          - "increments WorkOrder.version by 1"
      - from: COMPLETED
        to: CLOSED
        trigger: "POST /work-orders/{id}/close"
        actor: ProductionPlanner
        preconditions:
          - "no ScrapDisposition for this order is PENDING"
        side_effects:
          - "sets WorkOrder.status = CLOSED"
          - "increments WorkOrder.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: ProductionPlanner
        preconditions:
          - "WorkOrder.status == PLANNED"
        side_effects:
          - "sets WorkOrder.status = CANCELLED"
          - "increments WorkOrder.version by 1"
      - from: RELEASED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: ProductionPlanner
        preconditions:
          - "no WorkOrderOperation for this order is IN_PROGRESS"
        side_effects:
          - "sets WorkOrder.status = CANCELLED"
          - "reverses every non-reversed LotIssue for this order, restoring Lot.on_hand_qty (compensating invariant)"
          - "deletes ComponentDemand rows for this order"
          - "increments WorkOrder.version by 1"

  - entity: WorkOrderOperation
    initial_state: QUEUED
    terminal_states: [COMPLETED]
    transitions:
      - from: QUEUED
        to: IN_PROGRESS
        trigger: "POST /work-order-operations/{id}/start"
        actor: MachineOperator
        preconditions:
          - "parent WorkOrder.status in {RELEASED, IN_PROCESS}"
          - "every WorkOrderOperation with a lower sequence_no in this order is COMPLETED"
          - "referenced Machine.status != DOWN (cross-entity: WorkOrderOperation->Machine)"
          - "scheduled window does not violate setup-buffer overlap on the work center"
        side_effects:
          - "sets WorkOrderOperation.units_in = units_in (from request body; defaults to parent WorkOrder.order_qty when omitted)"
          - "sets WorkOrderOperation.status = IN_PROGRESS"
          - "sets Machine.status = RUNNING"
          - "if first op, bubbles WorkOrder PLANNED/RELEASED -> IN_PROCESS"
      - from: IN_PROGRESS
        to: PAUSED
        trigger: "POST /work-order-operations/{id}/pause"
        actor: MachineOperator
        preconditions:
          - "WorkOrderOperation.status == IN_PROGRESS"
        side_effects:
          - "sets WorkOrderOperation.status = PAUSED"
          - "sets Machine.status = AVAILABLE"
      - from: PAUSED
        to: IN_PROGRESS
        trigger: "POST /work-order-operations/{id}/resume"
        actor: MachineOperator
        preconditions:
          - "WorkOrderOperation.status == PAUSED"
          - "referenced Machine.status != DOWN"
        side_effects:
          - "sets WorkOrderOperation.status = IN_PROGRESS"
          - "sets Machine.status = RUNNING"
        note: "Cyclic edge: IN_PROGRESS<->PAUSED forms the pause/resume loop."
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /work-order-operations/{id}/complete"
        actor: MachineOperator
        preconditions:
          - "a TravelerSignoff with result == PASS exists for this WorkOrderOperation (cross-entity: WorkOrderOperation->TravelerSignoff)"
          - "good_qty + scrap_qty == units routed into this op"
        side_effects:
          - "sets WorkOrderOperation.good_qty = good_qty (from request body)"
          - "sets WorkOrderOperation.status = COMPLETED"
          - "sets Machine.status = AVAILABLE"
          - "if final op: sets WorkOrder.completed_qty += good_qty and recomputes WorkOrder.wip_qty"
      - from: REWORK
        to: IN_PROGRESS
        trigger: "POST /work-order-operations/{id}/resume"
        actor: MachineOperator
        preconditions:
          - "WorkOrderOperation.status == REWORK"
          - "referenced Machine.status != DOWN"
        side_effects:
          - "sets WorkOrderOperation.status = IN_PROGRESS"
        note: "Rework re-entry edge produced by a ScrapDisposition REWORKED cascade."

  - entity: ScrapDisposition
    initial_state: PENDING
    terminal_states: [SCRAPPED, REWORKED]
    transitions:
      - from: PENDING
        to: SCRAPPED
        trigger: "POST /scrap-dispositions/{id}/disposition (decision=SCRAP)"
        actor: QualityInspector
        preconditions:
          - "ScrapDisposition.status == PENDING"
          - "ScrapDisposition.quantity <= (referenced WorkOrderOperation.units_in - WorkOrderOperation.scrap_qty)"
        side_effects:
          - "sets ScrapDisposition.status = SCRAPPED"
          - "sets WorkOrderOperation.scrap_qty += quantity"
          - "computes ScrapDisposition.scrap_cost_cents = quantity * product.unit_cost_cents"
          - "increments WorkOrder.scrapped_qty by quantity and recomputes WorkOrder.wip_qty (cascade hop 2)"
        note: "Fork branch A: divergent side-effect set (cost + WIP debit, no rework re-entry)."
      - from: PENDING
        to: REWORKED
        trigger: "POST /scrap-dispositions/{id}/disposition (decision=REWORK)"
        actor: QualityInspector
        preconditions:
          - "ScrapDisposition.status == PENDING"
          - "ScrapDisposition.quantity <= (referenced WorkOrderOperation.units_in - WorkOrderOperation.scrap_qty)"
        side_effects:
          - "sets ScrapDisposition.status = REWORKED"
          - "sets referenced WorkOrderOperation.status = REWORK (cascade hop 2)"
          - "decrements WorkOrder.completed_qty by quantity if the op was final, and recomputes WorkOrder.wip_qty (cascade hop 3)"
          - "voids the PASS TravelerSignoff so the op must be re-signed (cascade hop 4)"
        note: "Fork branch B: divergent side-effect set (reopens op + reverses completion + voids signoff, no scrap cost)."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: wo-release-stale-version
    parent_entity: WorkOrder
    write_endpoint: "POST /work-orders/{id}/release"
    occ_field: "expected_work_order_version"
    description: |
      Releasing a WorkOrder whose version has advanced since the client last
      observed it is rejected on a stale-version check. Release legitimately
      supersedes the prior PLANNED snapshot by exploding the BOM and minting
      operations; a writer holding a stale view of the order must re-read before
      release so it does not double-explode against an already-released order.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: oee_overall
    trigger: "POST /machines/{id}/recompute-oee (system aggregates the machine's MachineRunLog set)"
    algorithm: aggregation
    formula: |
      # primary_op = the Operation on this machine with the LOWEST sequence_no
      #   across all routings; tie-break by Operation.created_at ASC.
      run_sum = sum(run_time_secs over logs)
      A_avail = clamp01( run_sum / Machine.planned_production_secs )
      total   = sum(total_units over logs)
      good    = sum(good_units over logs)
      P_perf  = clamp01( (ideal_cycle_time_secs_of_primary_op * total) / run_sum )
      Q_qual  = clamp01( good / total )      # if total == 0 -> Q_qual = 0
      # PINNED evaluation order to remove rounding ambiguity:
      #   1) store each ratio rounded to 4 dp: oee_availability/performance/quality
      #   2) oee_overall = round( A_avail * P_perf * Q_qual , 4 ) using the
      #      FULL-PRECISION (clamped, NOT pre-rounded) ratios, rounded ONCE at the end.
      oee_availability = round(A_avail, 4)
      oee_performance  = round(P_perf, 4)
      oee_quality      = round(Q_qual, 4)
      oee_overall      = round(A_avail * P_perf * Q_qual, 4)
      # clamp01(x) = max(0, min(1, x))
    input_set: "all MachineRunLog rows for the machine; window order irrelevant (pure sums of run_time/total/good)."
    constants:
      QUALITY_FLOOR: 0.95
    precision: "4 decimal places, round_half_up; ratios clamped to [0,1]; overall rounded ONCE from full-precision ratios"
    variants:
      - name: performance_ideal_basis
        when: "default OEE recompute"
        difference: "P_perf uses ideal_cycle_time_secs * total_units / actual run_time."
      - name: performance_nameplate_basis
        when: "machine has nameplate_rate override semantics (not used by default; documents divergence)"
        difference: "P_perf uses run_time / planned, giving a different ratio for identical logs."

  - name: machine_quality_flag
    trigger: "side effect of oee_overall recompute"
    algorithm: threshold
    formula: |
      quality_flagged = (oee_quality <= QUALITY_FLOOR)
      # boundary: exactly QUALITY_FLOOR (0.95) DOES flag (<=, not <)
    input_set: "the just-computed Machine.oee_quality."
    constants:
      QUALITY_FLOOR: 0.95
    precision: "comparison on the 4-decimal oee_quality value"

  - name: bom_explosion_standard_cost
    trigger: "side effect of WorkOrder PLANNED->RELEASED"
    algorithm: topological
    formula: |
      # multi-level explosion over the BomLine DAG, top-down by parent product.
      # Exactly ONE ComponentDemand row is created per DISTINCT component product
      # reached (subassemblies AND raw materials); quantities accumulate across
      # all paths to the same component.
      for each direct/indirect component product reached from WorkOrder.product:
        effective_qty_per = quantity_per / (1 - scrap_factor_pct/100)
        required_qty[component] += order_qty * product(effective_qty_per along path)
      # rounding order is PINNED: round EACH ComponentDemand cost, THEN sum.
      # standard cost uses the component's own unit_cost_cents (0 for a
      # SUBASSEMBLY with no unit cost), so subassembly demands contribute 0.
      standard_cost_cents[component] = round(required_qty[component] * unit_cost_cents)
      bom_standard_total = sum(standard_cost_cents over all ComponentDemand)
    input_set: "BomLine rows reachable from WorkOrder.product_id; one ComponentDemand per distinct reached component; cost driven by each component's unit_cost_cents."
    constants: {}
    precision: "round each per-component cost to whole cents (round_half_up) BEFORE summing"
    variants:
      - name: round_per_component_then_sum
        when: "canonical (pinned)"
        difference: "round each component cost, then sum — the pinned order."
      - name: sum_then_round
        when: "naive alternative (NOT used; documents the cents divergence)"
        difference: "sum exact products then round once — yields a different cent total."

  - name: material_variance
    trigger: "side effect of WorkOrder IN_PROCESS->COMPLETED"
    algorithm: aggregation
    formula: |
      actual_cost  = sum over non-reversed LotIssue:
                       issued_qty * Lot.product.unit_cost_cents (rounded per issue, then summed)
      standard_cost = sum(ComponentDemand.standard_cost_cents)   # from bom_explosion_standard_cost
      material_variance_cents = actual_cost - standard_cost
    input_set: "LotIssue rows for this work order where reversed == false; ComponentDemand rows for this order."
    constants: {}
    precision: "round each per-issue cost to whole cents BEFORE summing, then subtract integer totals"
    variants:
      - name: actual_lot_issue_basis
        when: "always"
        difference: "uses real issued lot quantities — diverges from standard whenever operators over/under-issue."

  - name: labor_completion_cost
    trigger: "GET /work-orders/{id}/cost-summary"
    algorithm: aggregation
    formula: |
      # rounding order PINNED: round per-operation labor THEN sum
      for each WorkOrderOperation wop in COMPLETED:
        op_secs = Operation.ideal_cycle_time_secs * wop.good_qty
        op_labor_cents = round(op_secs * LABOR_RATE_CENTS_PER_SEC)
      labor_total_cents = sum(op_labor_cents over completed ops)
    input_set: "WorkOrderOperation rows with status == COMPLETED for this order."
    constants:
      LABOR_RATE_CENTS_PER_SEC: 2
    precision: "round per-operation labor to whole cents BEFORE summing (pinned order)"
    variants:
      - name: round_per_operation_then_sum
        when: "canonical (pinned)"
        difference: "round each operation's labor, then sum."
      - name: sum_then_round
        when: "naive (NOT used; documents divergence)"
        difference: "sum exact labor seconds-cost then round once — different cents."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted for the operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every resource referenced in path/body exists (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 5
    category: state
    check: "WorkOrderOperation.start requires every lower-sequence op COMPLETED (operation sequencing)"
    error_id: ERR_OPERATION_SEQUENCE_VIOLATION
    http_status: 409
    applies_to: "POST /work-order-operations/{id}/start"
  - priority: 6
    category: business_referential
    check: "WorkOrder release requires referenced Routing.status == RELEASED"
    error_id: ERR_ROUTING_NOT_RELEASED
    http_status: 409
    applies_to: "POST /work-orders/{id}/release"
  - priority: 7
    category: business_safety
    check: "WorkOrderOperation.start/resume requires referenced Machine.status != DOWN"
    error_id: ERR_MACHINE_DOWN
    http_status: 409
    applies_to: ["POST /work-order-operations/{id}/start", "POST /work-order-operations/{id}/resume"]
  - priority: 8
    category: business_safety
    check: "WorkOrderOperation.complete requires a PASS TravelerSignoff (electronic sign-off gate)"
    error_id: ERR_TRAVELER_NOT_SIGNED
    http_status: 409
    applies_to: "POST /work-order-operations/{id}/complete"
  - priority: 9
    category: business_temporal
    check: "MachineRunLog window must not overlap an existing window on the same machine ([start,end) half-open)"
    error_id: ERR_RUNLOG_OVERLAP
    http_status: 409
    applies_to: "POST /machines/{id}/run-logs"
  - priority: 10
    category: business_temporal
    check: "WorkOrderOperation start window must clear the prior op's [scheduled_end + setup_buffer_secs] on the same work center (closed-interval-with-buffer)"
    error_id: ERR_SETUP_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /work-order-operations/{id}/start"
  - priority: 11
    category: business_constraint
    check: "BomLine.parent_product_id != component_product_id and the new edge must not create a BOM cycle"
    error_id: ERR_BOM_CYCLE
    http_status: 409
    applies_to: "POST /bom-lines"
  - priority: 12
    category: business_constraint
    check: "Operation.sequence_no must be unique within its routing"
    error_id: ERR_DUPLICATE_SEQUENCE
    http_status: 409
    applies_to: "POST /routings/{id}/operations"
  - priority: 13
    category: business_constraint
    check: "ScrapDisposition.quantity must not exceed the op's available units (WorkOrderOperation.units_in - WorkOrderOperation.scrap_qty)"
    error_id: ERR_SCRAP_QTY_EXCEEDS
    http_status: 422
    applies_to: "POST /work-order-operations/{id}/scrap-dispositions"
  - priority: 14
    category: business_fiscal
    check: "LotIssue.issued_qty must not exceed Lot.on_hand_qty (inventory conservation)"
    error_id: ERR_INSUFFICIENT_LOT_QTY
    http_status: 422
    applies_to: "POST /lot-issues"
  - priority: 15
    category: business_constraint
    check: "LotIssue lot's product_id must equal the demand's component_product_id"
    error_id: ERR_LOT_PRODUCT_MISMATCH
    http_status: 422
    applies_to: "POST /lot-issues"
  - priority: 16
    category: state
    check: "OCC: expected_work_order_version must equal WorkOrder.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /work-orders/{id}/release"
  - priority: 17
    category: business_constraint
    check: "required input fields present and well-typed; enum members valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Product + BOM ----
  - method: POST
    path: "/products"
    description: "Create a product (finished good / subassembly / raw material)."
    roles: [ManufacturingEngineer, PlantAdmin]
    code: 201
    input: ["sku", "name", "product_type", "unit_cost_cents?", "lot_controlled?"]
    output: Product
    side_effects: []
  - method: GET
    path: "/products/{id}"
    description: "Fetch a product."
    roles: [ManufacturingEngineer, ProductionPlanner, MachineOperator, QualityInspector, PlantAdmin]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: POST
    path: "/bom-lines"
    description: "Add a BOM line (parent consumes component); rejects cycles."
    roles: [ManufacturingEngineer, PlantAdmin]
    code: 201
    input: ["parent_product_id", "component_product_id", "quantity_per", "scrap_factor_pct?"]
    output: BomLine
    side_effects: ["validates no BOM cycle created (ERR_BOM_CYCLE)"]
  - method: GET
    path: "/bom-lines/{id}"
    description: "Fetch a BOM line."
    roles: [ManufacturingEngineer, ProductionPlanner, PlantAdmin]
    code: 200
    input: []
    output: BomLine
    side_effects: []
  - method: GET
    path: "/bom-lines"
    description: "List BOM lines; filter by parent or component product (reverse-reachability for BomLine.parent_product_id and component_product_id)."
    roles: [ManufacturingEngineer, ProductionPlanner, PlantAdmin]
    code: 200
    input: ["parent_product_id?", "component_product_id?", "limit?", "offset?"]
    output: BomLine[]
    side_effects: []

  # ---- Routing + Operation ----
  - method: POST
    path: "/routings"
    description: "Create a DRAFT routing for a product."
    roles: [ManufacturingEngineer, PlantAdmin]
    code: 201
    input: [product_id, routing_code]
    output: Routing
    side_effects: []
  - method: GET
    path: "/routings/{id}"
    description: "Fetch a routing."
    roles: [ManufacturingEngineer, ProductionPlanner, PlantAdmin]
    code: 200
    input: []
    output: Routing
    side_effects: []
  - method: GET
    path: "/routings"
    description: "List routings; filter by product."
    roles: [ManufacturingEngineer, ProductionPlanner, PlantAdmin]
    code: 200
    input: ["product_id?", "status?", "limit?", "offset?"]
    output: Routing[]
    side_effects: []
  - method: POST
    path: "/routings/{id}/operations"
    description: "Attach an operation to a DRAFT routing."
    roles: [ManufacturingEngineer, PlantAdmin]
    code: 201
    input: ["machine_id", "sequence_no", "ideal_cycle_time_secs", "setup_buffer_secs?"]
    output: Operation
    side_effects: ["increments Routing.operation_count", "rejects duplicate sequence_no (ERR_DUPLICATE_SEQUENCE)"]
  - method: GET
    path: "/routings/{id}/operations"
    description: "List operations of a routing (reverse-reachability for Operation.routing_id)."
    roles: [ManufacturingEngineer, ProductionPlanner, MachineOperator, PlantAdmin]
    code: 200
    input: []
    output: Operation[]
    side_effects: []
  - method: POST
    path: "/routings/{id}/release"
    description: "Release a DRAFT routing to RELEASED."
    roles: [ManufacturingEngineer, PlantAdmin]
    code: 200
    input: []
    output: Routing
    side_effects: ["sets status=RELEASED", "increments Routing.version"]
  - method: POST
    path: "/routings/{id}/archive"
    description: "Archive a RELEASED routing."
    roles: [ManufacturingEngineer, PlantAdmin]
    code: 200
    input: []
    output: Routing
    side_effects: ["sets status=ARCHIVED", "increments Routing.version"]

  # ---- Machine + OEE ----
  - method: POST
    path: "/machines"
    description: "Register a machine/work center."
    roles: [ManufacturingEngineer, PlantAdmin]
    code: 201
    input: [machine_code, work_center, planned_production_secs]
    output: Machine
    side_effects: []
  - method: GET
    path: "/machines/{id}"
    description: "Fetch a machine including latest OEE fields."
    roles: [ManufacturingEngineer, ProductionPlanner, MachineOperator, QualityInspector, PlantAdmin]
    code: 200
    input: []
    output: Machine
    side_effects: []
  - method: GET
    path: "/machines/{id}/operations"
    description: "List routing operations that run on a machine (reverse-reachability for Operation.machine_id)."
    roles: [ManufacturingEngineer, ProductionPlanner, MachineOperator, PlantAdmin]
    code: 200
    input: []
    output: Operation[]
    side_effects: []
  - method: POST
    path: "/machines/{id}/status"
    description: "Set machine operational status (e.g., mark DOWN for maintenance)."
    roles: [MachineOperator, PlantAdmin]
    code: 200
    input: [status]
    output: Machine
    side_effects: ["sets Machine.status"]
  - method: POST
    path: "/machines/{id}/run-logs"
    description: "Append a run-log window (rejects overlap on the machine)."
    roles: [MachineOperator, PlantAdmin]
    code: 201
    input: [window_start, window_end, run_time_secs, total_units, good_units]
    output: MachineRunLog
    side_effects: ["rejects overlapping window (ERR_RUNLOG_OVERLAP)"]
  - method: GET
    path: "/machines/{id}/run-logs"
    description: "List a machine's run logs (reverse-reachability for MachineRunLog.machine_id)."
    roles: [ManufacturingEngineer, ProductionPlanner, MachineOperator, QualityInspector, PlantAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: MachineRunLog[]
    side_effects: []
  - method: POST
    path: "/machines/{id}/recompute-oee"
    description: "Recompute A/P/Q and overall OEE from the machine's run logs; sets quality_flagged."
    roles: [ManufacturingEngineer, QualityInspector, PlantAdmin]
    code: 200
    input: []
    output: Machine
    side_effects: ["computes oee_availability/performance/quality/overall", "sets quality_flagged if oee_quality <= QUALITY_FLOOR"]

  # ---- Lot inventory ----
  - method: POST
    path: "/lots"
    description: "Receive a lot of a lot-controlled product into inventory."
    roles: [MachineOperator, PlantAdmin]
    code: 201
    input: [product_id, lot_code, received_qty]
    output: Lot
    side_effects: ["sets on_hand_qty = received_qty, issued_qty = 0"]
  - method: GET
    path: "/lots/{id}"
    description: "Fetch a lot."
    roles: [ManufacturingEngineer, ProductionPlanner, MachineOperator, QualityInspector, PlantAdmin]
    code: 200
    input: []
    output: Lot
    side_effects: []
  - method: GET
    path: "/lots"
    description: "List lots; filter by product."
    roles: [ManufacturingEngineer, ProductionPlanner, MachineOperator, QualityInspector, PlantAdmin]
    code: 200
    input: ["product_id?", "limit?", "offset?"]
    output: Lot[]
    side_effects: []

  # ---- Work order lifecycle ----
  - method: POST
    path: "/work-orders"
    description: "Create a PLANNED work order."
    roles: [ProductionPlanner, PlantAdmin]
    code: 201
    input: [product_id, routing_id, order_qty]
    output: WorkOrder
    side_effects: []
  - method: GET
    path: "/work-orders/{id}"
    description: "Fetch a work order with WIP fields."
    roles: [ManufacturingEngineer, ProductionPlanner, MachineOperator, QualityInspector, PlantAdmin]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: GET
    path: "/work-orders"
    description: "List work orders; filter by product/routing/status (reverse-reachability for WorkOrder.product_id and WorkOrder.routing_id)."
    roles: [ManufacturingEngineer, ProductionPlanner, MachineOperator, QualityInspector, PlantAdmin]
    code: 200
    input: ["product_id?", "routing_id?", "status?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []
  - method: POST
    path: "/work-orders/{id}/release"
    description: "Release a PLANNED work order: explode BOM into ComponentDemand and mint WorkOrderOperations."
    roles: [ProductionPlanner, PlantAdmin]
    code: 200
    input: [expected_work_order_version]
    output: WorkOrder
    side_effects:
      - "explodes multi-level BOM -> ComponentDemand rows (required_qty + standard_cost_cents)"
      - "creates WorkOrderOperation per Operation in sequence order"
      - "sets status=RELEASED"
      - "increments WorkOrder.version by 1"
  - method: POST
    path: "/work-orders/{id}/complete"
    description: "Complete an IN_PROCESS work order once all operations are COMPLETED."
    roles: [ProductionPlanner, PlantAdmin]
    code: 200
    input: []
    output: WorkOrder
    side_effects:
      - "finalizes Lot.issued_qty and seals GenealogyLink rows"
      - "computes material_variance_cents"
      - "sets status=COMPLETED"
      - "increments WorkOrder.version by 1"
  - method: POST
    path: "/work-orders/{id}/close"
    description: "Close a COMPLETED work order (no pending scrap dispositions)."
    roles: [ProductionPlanner, PlantAdmin]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["sets status=CLOSED", "increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/cancel"
    description: "Cancel a PLANNED or RELEASED work order; reverses lot issues."
    roles: [ProductionPlanner, PlantAdmin]
    code: 200
    input: []
    output: WorkOrder
    side_effects:
      - "reverses non-reversed LotIssue rows, restoring Lot.on_hand_qty"
      - "deletes ComponentDemand rows"
      - "sets status=CANCELLED"
      - "increments WorkOrder.version by 1"
  - method: GET
    path: "/work-orders/{id}/cost-summary"
    description: "Computed read: standard cost, actual cost, labor total, material variance."
    roles: [ManufacturingEngineer, ProductionPlanner, PlantAdmin]
    code: 200
    input: []
    output: "{ bom_standard_total_cents: integer, actual_cost_cents: integer, labor_total_cents: integer, material_variance_cents: integer }"
    side_effects: []

  # ---- Component demand (reverse-reachability for ComponentDemand FKs) ----
  - method: GET
    path: "/work-orders/{id}/component-demands"
    description: "List exploded component demands for a work order (reverse-reachability for ComponentDemand.work_order_id)."
    roles: [ManufacturingEngineer, ProductionPlanner, MachineOperator, PlantAdmin]
    code: 200
    input: []
    output: ComponentDemand[]
    side_effects: []
  - method: GET
    path: "/component-demands/{id}"
    description: "Fetch a component demand."
    roles: [ManufacturingEngineer, ProductionPlanner, PlantAdmin]
    code: 200
    input: []
    output: ComponentDemand
    side_effects: []
  - method: GET
    path: "/component-demands"
    description: "List component demands; filter by component product (reverse-reachability for ComponentDemand.component_product_id)."
    roles: [ManufacturingEngineer, ProductionPlanner, PlantAdmin]
    code: 200
    input: ["work_order_id?", "component_product_id?", "limit?", "offset?"]
    output: ComponentDemand[]
    side_effects: []

  # ---- Work order operations (WIP) ----
  - method: GET
    path: "/work-orders/{id}/operations"
    description: "List WorkOrderOperations of a work order (reverse-reachability for WorkOrderOperation.work_order_id)."
    roles: [ManufacturingEngineer, ProductionPlanner, MachineOperator, QualityInspector, PlantAdmin]
    code: 200
    input: []
    output: WorkOrderOperation[]
    side_effects: []
  - method: GET
    path: "/work-order-operations/{id}"
    description: "Fetch a WIP node."
    roles: [ManufacturingEngineer, ProductionPlanner, MachineOperator, QualityInspector, PlantAdmin]
    code: 200
    input: []
    output: WorkOrderOperation
    side_effects: []
  - method: GET
    path: "/work-order-operations"
    description: "List WIP nodes; filter by operation_id or machine_id (reverse-reachability for WorkOrderOperation.operation_id and machine_id)."
    roles: [ManufacturingEngineer, ProductionPlanner, MachineOperator, QualityInspector, PlantAdmin]
    code: 200
    input: ["operation_id?", "machine_id?", "work_order_id?", "status?", "limit?", "offset?"]
    output: WorkOrderOperation[]
    side_effects: []
  - method: POST
    path: "/work-order-operations/{id}/start"
    description: "Start a QUEUED op; enforces sequence, machine, and setup-buffer gates."
    roles: [MachineOperator]
    code: 200
    input: ["scheduled_start?", "scheduled_end?", "units_in?"]
    output: WorkOrderOperation
    side_effects: ["sets status=IN_PROGRESS", "sets Machine.status=RUNNING", "bubbles WorkOrder->IN_PROCESS on first op"]
  - method: POST
    path: "/work-order-operations/{id}/pause"
    description: "Pause an IN_PROGRESS op."
    roles: [MachineOperator]
    code: 200
    input: []
    output: WorkOrderOperation
    side_effects: ["sets status=PAUSED", "sets Machine.status=AVAILABLE"]
  - method: POST
    path: "/work-order-operations/{id}/resume"
    description: "Resume a PAUSED or REWORK op."
    roles: [MachineOperator]
    code: 200
    input: []
    output: WorkOrderOperation
    side_effects: ["sets status=IN_PROGRESS", "sets Machine.status=RUNNING"]
  - method: POST
    path: "/work-order-operations/{id}/complete"
    description: "Complete an IN_PROGRESS op; requires PASS sign-off and balanced good+scrap."
    roles: [MachineOperator]
    code: 200
    input: [good_qty]
    output: WorkOrderOperation
    side_effects: ["sets status=COMPLETED", "sets Machine.status=AVAILABLE", "rolls completed_qty up on final op"]
  - method: POST
    path: "/work-order-operations/{id}/signoffs"
    description: "Append a TravelerSignoff (electronic traveler) to a WIP node."
    roles: [QualityInspector, PlantAdmin]
    code: 201
    input: [result]
    output: TravelerSignoff
    side_effects: ["appends append-only traveler record"]
  - method: GET
    path: "/work-order-operations/{id}/signoffs"
    description: "List traveler sign-offs for a WIP node (reverse-reachability for TravelerSignoff.work_order_operation_id)."
    roles: [ManufacturingEngineer, ProductionPlanner, MachineOperator, QualityInspector, PlantAdmin]
    code: 200
    input: []
    output: TravelerSignoff[]
    side_effects: []
  - method: POST
    path: "/work-order-operations/{id}/scrap-dispositions"
    description: "Raise a PENDING scrap/rework disposition at this op."
    roles: [MachineOperator, QualityInspector]
    code: 201
    input: [quantity, defect_code]
    output: ScrapDisposition
    side_effects: ["validates quantity does not exceed available units (ERR_SCRAP_QTY_EXCEEDS)"]
  - method: GET
    path: "/work-order-operations/{id}/scrap-dispositions"
    description: "List scrap dispositions for a WIP node (reverse-reachability for ScrapDisposition.work_order_operation_id)."
    roles: [ManufacturingEngineer, ProductionPlanner, MachineOperator, QualityInspector, PlantAdmin]
    code: 200
    input: []
    output: ScrapDisposition[]
    side_effects: []
  - method: POST
    path: "/scrap-dispositions/{id}/disposition"
    description: "Disposition a PENDING scrap record as SCRAP or REWORK (branching fork-join)."
    roles: [QualityInspector, PlantAdmin]
    code: 200
    input: [decision]
    output: ScrapDisposition
    side_effects:
      - "SCRAP: scrap_cost computed, WorkOrderOperation.scrap_qty += qty, WorkOrder.scrapped_qty += qty, wip recomputed"
      - "REWORK: WorkOrderOperation.status=REWORK, completed_qty reverted if final op, PASS signoff voided"
  - method: GET
    path: "/scrap-dispositions/{id}"
    description: "Fetch a scrap disposition."
    roles: [ManufacturingEngineer, ProductionPlanner, MachineOperator, QualityInspector, PlantAdmin]
    code: 200
    input: []
    output: ScrapDisposition
    side_effects: []

  # ---- Lot issues + genealogy ----
  - method: POST
    path: "/lot-issues"
    description: "Issue lot quantity against a component demand for genealogy."
    roles: [MachineOperator, PlantAdmin]
    code: 201
    input: [component_demand_id, lot_id, work_order_operation_id, issued_qty]
    output: LotIssue
    side_effects:
      - "decrements Lot.on_hand_qty, increments Lot.issued_qty and ComponentDemand.issued_qty"
      - "rejects over-issue beyond on_hand_qty (ERR_INSUFFICIENT_LOT_QTY)"
  - method: GET
    path: "/lot-issues/{id}"
    description: "Fetch a lot issue."
    roles: [ManufacturingEngineer, ProductionPlanner, MachineOperator, QualityInspector, PlantAdmin]
    code: 200
    input: []
    output: LotIssue
    side_effects: []
  - method: GET
    path: "/lot-issues"
    description: "List lot issues; filter by demand, lot, or consuming op (reverse-reachability for LotIssue FKs)."
    roles: [ManufacturingEngineer, ProductionPlanner, MachineOperator, QualityInspector, PlantAdmin]
    code: 200
    input: ["component_demand_id?", "lot_id?", "work_order_operation_id?", "limit?", "offset?"]
    output: LotIssue[]
    side_effects: []
  - method: GET
    path: "/work-orders/{id}/genealogy"
    description: "List genealogy links for a work order (reverse-reachability for GenealogyLink.work_order_id)."
    roles: [ManufacturingEngineer, ProductionPlanner, QualityInspector, PlantAdmin]
    code: 200
    input: []
    output: GenealogyLink[]
    side_effects: []
  - method: GET
    path: "/genealogy-links/{id}"
    description: "Fetch a genealogy link."
    roles: [ManufacturingEngineer, ProductionPlanner, QualityInspector, PlantAdmin]
    code: 200
    input: []
    output: GenealogyLink
    side_effects: []
  - method: GET
    path: "/genealogy-links"
    description: "List genealogy links; filter by parent or child lot (reverse-reachability for GenealogyLink lot FKs)."
    roles: [ManufacturingEngineer, ProductionPlanner, QualityInspector, PlantAdmin]
    code: 200
    input: ["parent_lot_id?", "child_lot_id?", "work_order_id?", "limit?", "offset?"]
    output: GenealogyLink[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid auth headers or unknown role"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "acting role not permitted for the operation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "referenced resource does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing/ill-typed field, invalid enum member, or constraint-violating literal"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "transition not defined from the resource's current state"
  - id: ERR_OPERATION_SEQUENCE_VIOLATION
    http: 409
    condition: "starting an op while a lower-sequence op is not COMPLETED"
  - id: ERR_ROUTING_NOT_RELEASED
    http: 409
    condition: "releasing a work order whose routing is not RELEASED"
  - id: ERR_MACHINE_DOWN
    http: 409
    condition: "starting/resuming an op on a DOWN machine"
  - id: ERR_TRAVELER_NOT_SIGNED
    http: 409
    condition: "completing an op without a PASS TravelerSignoff"
  - id: ERR_RUNLOG_OVERLAP
    http: 409
    condition: "run-log window overlaps an existing window on the same machine"
  - id: ERR_SETUP_BUFFER_CONFLICT
    http: 409
    condition: "op start window violates the prior op's setup-buffer on the same work center"
  - id: ERR_BOM_CYCLE
    http: 409
    condition: "BOM line would create a self-loop or a cycle in the BOM DAG"
  - id: ERR_DUPLICATE_SEQUENCE
    http: 409
    condition: "operation sequence_no already used in this routing"
  - id: ERR_SCRAP_QTY_EXCEEDS
    http: 422
    condition: "scrap/rework quantity exceeds the op's available units"
  - id: ERR_INSUFFICIENT_LOT_QTY
    http: 422
    condition: "lot issue quantity exceeds lot on_hand_qty"
  - id: ERR_LOT_PRODUCT_MISMATCH
    http: 422
    condition: "issued lot's product does not match the demand's component product"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_work_order_version does not match WorkOrder.version (OCC)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ManufacturingEngineer
    description: "Owns master data: Products, BOM lines, Routings, Operations, OEE recompute."
    identity: "opaque"
    exclusive_operations:
      - "POST /products"
      - "POST /bom-lines"
      - "POST /routings"
      - "POST /routings/{id}/operations"
      - "POST /routings/{id}/release"
      - "POST /routings/{id}/archive"
      - "POST /machines"
    shared_operations:
      - "POST /machines/{id}/recompute-oee"
      - "GET (all read endpoints)"
  - name: ProductionPlanner
    description: "Owns work-order lifecycle: create/release/complete/close/cancel."
    identity: "opaque"
    exclusive_operations:
      - "POST /work-orders"
      - "POST /work-orders/{id}/release"
      - "POST /work-orders/{id}/complete"
      - "POST /work-orders/{id}/close"
      - "POST /work-orders/{id}/cancel"
    shared_operations:
      - "GET (all read endpoints)"
  - name: MachineOperator
    description: "Executes operations, records run logs, raises scrap, issues lots, sets machine status."
    identity: "opaque"
    exclusive_operations:
      - "POST /work-order-operations/{id}/start"
      - "POST /work-order-operations/{id}/pause"
      - "POST /work-order-operations/{id}/resume"
      - "POST /work-order-operations/{id}/complete"
      - "POST /machines/{id}/run-logs"
      - "POST /machines/{id}/status"
      - "POST /lots"
      - "POST /lot-issues"
    shared_operations:
      - "POST /work-order-operations/{id}/scrap-dispositions"
      - "GET (all read endpoints)"
  - name: QualityInspector
    description: "Signs the electronic traveler and dispositions scrap/rework."
    identity: "opaque"
    exclusive_operations:
      - "POST /work-order-operations/{id}/signoffs"
      - "POST /scrap-dispositions/{id}/disposition"
    shared_operations:
      - "POST /work-order-operations/{id}/scrap-dispositions"
      - "POST /machines/{id}/recompute-oee"
      - "GET (all read endpoints)"
  - name: PlantAdmin
    description: "Operational override; may perform any operation across modules."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "ALL endpoints (superset override)"
