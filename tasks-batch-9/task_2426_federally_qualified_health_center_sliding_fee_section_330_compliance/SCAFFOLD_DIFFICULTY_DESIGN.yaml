            - call: "POST /patients"
              payload: { mrn: "MRN-201", full_name: "Fay Lund", household_size: 1 }
              as: PatientServicesRep
              as_user_id: "psr-3"
              captures: { rp_id: $.data.id }
          trigger:
            - call: "POST /encounters"
              payload: { patient_id: "${rp_id}", service_site_id: "${rsite_id}", service_definition_id: "${rsvc_id}", encounter_date: "2026-03-01T00:00:00Z", payer_type: "PRIVATE", gross_charge_cents: 30000 }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { rate_out: $.data.pps_encounter_rate_cents }
          assert:
            - "${rate_out} == 7652"
            - "${rate_out} != 7653  # round-after-each-factor is NOT this system's order"
            - "Encounter.*.patient_charge_cents == 0 and charge_basis == THIRD_PARTY  # PRIVATE payer short-circuits at S1"
