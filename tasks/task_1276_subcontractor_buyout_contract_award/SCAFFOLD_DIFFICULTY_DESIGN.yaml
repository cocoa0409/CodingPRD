              as: BuyoutLead
              captures: { bid_l2: $.data.id }
            - call: "POST /trade-packages/${tp_id}/close-bidding"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids/${bid_l2}/withdraw"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/subcontracts"
              payload: { subcontractor_name: "Iota Elec", source_bid_id: "${bid_i}", flow_down_terms: "fd", payment_terms: { retainage_pct: 0.10, pay_if_paid: true }, change_authority_limits: [{ max_value_cents: -1, max_cumulative_pct: -1, roles: ["OperationsManager"] }] }
              as: BuyoutLead
              captures: { sub_i: $.data.id }
            - call: "POST /trade-packages/${tp_id}/subcontracts"
              payload: { subcontractor_name: "Kappa Elec", source_bid_id: "${bid_k}", flow_down_terms: "fd", payment_terms: { retainage_pct: 0.10, pay_if_paid: true }, change_authority_limits: [{ max_value_cents: -1, max_cumulative_pct: -1, roles: ["OperationsManager"] }] }
              as: BuyoutLead
              captures: { sub_j: $.data.id }
            - call: "POST /subcontracts/${sub_i}/recommend-award"
              payload: { contract_value_cents: 9000000 }
              as: BuyoutLead
            - call: "POST /subcontracts/${sub_i}/award"
