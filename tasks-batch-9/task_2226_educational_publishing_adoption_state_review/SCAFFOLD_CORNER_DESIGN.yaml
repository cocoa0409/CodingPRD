      - name: coverage_variants_diverge_on_identical_evidence
        claim_type: variant_divergence
        grounds:
          - calculations.correlation_coverage.variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / coverage_self_reported_vs_committee_verified"
          rationale: "That instance asserts both variants on one evidence set and the exact delta after the INSUFFICIENT verdict."
      - name: order_variant_selected_by_lifecycle_stage
        claim_type: variant_selection
        grounds:
          - calculations.order_total_value.variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / order_quoted_vs_contracted_total_value"
          rationale: "That instance asserts the quoted value at creation and the contracted value at confirmation from the same inputs."
      - name: cancel_reconciles_contracted_variant_back_out
        claim_type: reconciliation
        grounds:
          - state_machines.DistrictOrder.CONFIRMED_to_CANCELLED
        excluded_because:
          difficulty_instance: "compensating_invariant / order_cancel_restores_print_unit_ledger"
          rationale: "That instance asserts contracted_tcv_cents reset to null and the unit ledger identity restored after the cancel."
      - name: net_price_tier_stack_and_year_rounding
        claim_type: tiered_pricing
        grounds:
          - calculations.state_net_price.formula
        excluded_because:
          difficulty_instance: "combinatorial_formula / net_state_price_per_year_rounding_pinned"
          rationale: "That instance stacks all three discount tiers, caps at MAX_TOTAL_DISCOUNT_PCT and asserts the per-year rounding order."
      - name: net_price_rounds_each_year_before_summing
        claim_type: precision
        grounds:
          - calculations.state_net_price.precision
        excluded_because:
          difficulty_instance: "boundary_precision_check / volume_tier_boundary_at_exactly_five_thousand_units"
          rationale: "That instance pins the whole-cent per-year rounding at the 5000-unit tier edge."
      - name: freight_waiver_threshold_evaluated_before_freight
        claim_type: waterfall_allocation
        grounds:
          - calculations.order_total_value.formula
        excluded_because:
          difficulty_instance: "combinatorial_formula / order_freight_waiver_evaluated_on_pre_freight_total"
          rationale: "That instance straddles FREIGHT_WAIVER_THRESHOLD_CENTS on the pre-freight subtotal in both directions."
      - name: comment_overdue_threshold_is_inclusive
        claim_type: threshold
        grounds:
          - calculations.comment_response_obligation.precision
        excluded_because:
          difficulty_instance: "boundary_precision_check / comment_overdue_inclusive_at_exact_response_due_instant"
          rationale: "That instance sits the clock exactly on response_due_at and asserts the inclusive escalation."
      - name: compliance_penalties_accumulate_and_floor_at_zero
        claim_type: constants_applied
        grounds:
          - calculations.compliance_score.constants
        excluded_because:
          difficulty_instance: "combinatorial_formula / compliance_score_weighted_penalty_stack_with_floor"
          rationale: "That instance stacks every penalty constant and asserts the max(0, ...) floor."
      - name: coverage_weighted_scoring_at_minimum_boundary
        claim_type: weighted_scoring
        grounds:
          - calculations.correlation_coverage.precision
        excluded_because:
          difficulty_instance: "boundary_precision_check / coverage_rounds_to_exact_minimum_while_lower_claim_is_rejected"
          rationale: "That instance lands coverage exactly on min_verified_coverage_pct after round_half_up and contrasts the one-notch-lower claim."

  # ===========================================================================
  # Section 4 - Validations
  # ===========================================================================
  - section: validations
    instances:
      - name: sampling_requirement_gates_filing_only_when_state_requires_copies
        claim_type: conditional_validation
        grounds:
          - validations[priority=54]
          - calculations.sampling_fulfilment
        distinguishing_aspect: |
          Because state UT sets sampling_copies_required 30, filing with only 10 copies shipped must
          fail with ERR_SAMPLING_INCOMPLETE (422) while sampling_status is PARTIAL, and the very same
          filing must succeed once 20 more copies move the status to SHIPPED.
        test_recipe:
          setup:
            - "State UT is OPEN_TERRITORY, requires 30 sample copies and has min_verified_coverage_pct 50.00"
            - "The cycle is OPEN at clock 2026-09-15 and the DRAFT submission cites UT.E.4.1 at MASTERY, so self_reported_coverage_pct is 100.00"
            - "10 sample copies have shipped out of a 100-unit warehouse receipt, so sampling_status is PARTIAL"
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "UT", adoption_model: "OPEN_TERRITORY", sampling_copies_required: 30, min_verified_coverage_pct: 50.00 }
              as: PlatformAdmin
              captures: { st_ut_id: $.data.id }
            - call: "POST /state-profiles/${st_ut_id}/standards"
              payload: { subject: "ELA", standard_code: "UT.E.4.1", grade_low: 4, grade_high: 4, weight: 3 }
              as: StateAdoptionOfficer
              as_user_id: "${st_ut_id}"
            - call: "POST /adoption-cycles"
              payload: { state_id: "${st_ut_id}", subject: "ELA", cycle_year: 2027, submission_open_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-10-01T00:00:00Z", committee_review_at: "2026-10-15T00:00:00Z", public_comment_start_at: "2026-11-01T00:00:00Z", public_comment_end_at: "2026-11-15T00:00:00Z", adoption_decision_at: "2026-12-01T00:00:00Z", contract_term_years: 6 }
              as: StateAdoptionOfficer
              as_user_id: "${st_ut_id}"
              captures: { cyc_id: $.data.id }
