            - { call: "POST /safety/permits", payload: { project_id: "${p}", jha_id: "${j}", permit_type: "HOT_WORK", work_start: "2026-08-02T08:00:00Z", work_end: "2026-08-02T10:00:00Z", authorized_worker_ids: ["${w}"] }, as: SiteSuperintendent, captures: { err: "$.data.error_id" } }
            - { call: "POST /safety/jhas/${j}/approve", payload: {}, as: SafetyManager }
            - { call: "POST /safety/permits", payload: { project_id: "${p}", jha_id: "${j}", permit_type: "HOT_WORK", work_start: "2026-08-02T08:00:00Z", work_end: "2026-08-02T10:00:00Z", authorized_worker_ids: ["${w}"] }, as: SiteSuperintendent, captures: { pm: "$.data.id", pm_s: "$.data.status" } }
          assert:
            - "first create (JHA DRAFT): error_id == ERR_JHA_NOT_APPROVED"
            - "after JHA approve: HTTP 201, Permit.${pm}.status == REQUESTED"

      - name: worker_clear_requires_verified_cert
        grounds:
          - calculations.training_clearance_check
          - state_machines.TrainingCertificate.UNVERIFIED_to_VERIFIED
          - errors[ERR_TRAINING_REQUIREMENT_NOT_MET]
        distinguishing_aspect: |
          Entity pair Worker -> TrainingCertificate: clearing an ORIENTED worker is rejected while the only
          OSHA_10 certificate is UNVERIFIED (ERR_TRAINING_REQUIREMENT_NOT_MET, 422) and succeeds after the
          certificate reaches VERIFIED — a different entity pair than Permit -> JobHazardAnalysis.
        test_recipe:
          setup:
            - "Project with ACTIVE plan; worker ORIENTED; OSHA_10 certificate exists but is UNVERIFIED"
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Alley 24", location: "Seattle", annual_hours_worked: 50000 }, as: SafetyManager, captures: { p: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /safety/safety-plans", payload: { project_id: "${p}", effective_date: "2026-08-01" }, as: SafetyManager, captures: { pl: "$.data.id" } }
            - { call: "POST /safety/safety-plans/${pl}/activate", payload: { expected_project_version: "${p_v}" }, as: SafetyManager }
            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "J Kim", employer_type: "DIRECT" }, as: SiteSuperintendent, captures: { w: "$.data.id" } }
            - { call: "POST /safety/training-certificates", payload: { worker_id: "${w}", cert_type: "OSHA_10", issued_date: "2026-07-01", expires_date: "2027-07-01" }, as: SiteSuperintendent, captures: { c1: "$.data.id" } }
            - { call: "POST /safety/workers/${w}/complete-orientation", payload: {}, as: SiteSuperintendent }
          trigger:
            - { call: "POST /safety/workers/${w}/clear", payload: {}, as: SiteSuperintendent, captures: { err: "$.data.error_id" } }
            - { call: "POST /safety/training-certificates/${c1}/verify", payload: {}, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/workers/${w}/clear", payload: {}, as: SiteSuperintendent, captures: { w_s: "$.data.status" } }
          assert:
            - "first clear (cert UNVERIFIED): error_id == ERR_TRAINING_REQUIREMENT_NOT_MET (422)"
            - "after certificate verify: Worker.${w}.status == CLEARED"

  # =====================================================================
  # Rule 8 — resource_temporal_overlap (DIFFERENT interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: excavation_adjacency_allowed_overlap_rejected
        grounds:
          - calculations.permit_conflict_check
          - errors[ERR_PERMIT_TIME_CONFLICT]
        distinguishing_aspect: |
          HALF-OPEN [start, end) interval semantics on the Project resource for same-type EXCAVATION
          permits: back-to-back adjacency (new.start == existing.end) is ALLOWED, while true overlap is
          rejected with ERR_PERMIT_TIME_CONFLICT — contrasted with the closed-interval crew rule instance.
        test_recipe:
          setup:
            - "Project with ACTIVE plan; three CLEARED workers w1/w2/w3; huddle CONDUCTED; JHA APPROVED; existing EXCAVATION permit A [2026-08-02T08:00Z, 2026-08-02T16:00Z] crew [w1]"
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Denny Regrade", location: "Seattle", annual_hours_worked: 140000 }, as: SafetyManager, captures: { p: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /safety/safety-plans", payload: { project_id: "${p}", effective_date: "2026-08-01" }, as: SafetyManager, captures: { pl: "$.data.id" } }
            - { call: "POST /safety/safety-plans/${pl}/activate", payload: { expected_project_version: "${p_v}" }, as: SafetyManager }
            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "K Lowe", employer_type: "DIRECT" }, as: SiteSuperintendent, captures: { w1: "$.data.id" } }
            - { call: "POST /safety/training-certificates", payload: { worker_id: "${w1}", cert_type: "OSHA_10", issued_date: "2026-07-01", expires_date: "2027-07-01" }, as: SiteSuperintendent, captures: { c1: "$.data.id" } }
            - { call: "POST /safety/training-certificates/${c1}/verify", payload: {}, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/workers/${w1}/complete-orientation", payload: {}, as: SiteSuperintendent }
            - { call: "POST /safety/workers/${w1}/clear", payload: {}, as: SiteSuperintendent }
            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "L Mora", employer_type: "DIRECT" }, as: SiteSuperintendent, captures: { w2: "$.data.id" } }
            - { call: "POST /safety/training-certificates", payload: { worker_id: "${w2}", cert_type: "OSHA_10", issued_date: "2026-07-02", expires_date: "2027-07-02" }, as: SiteSuperintendent, captures: { c2: "$.data.id" } }
            - { call: "POST /safety/training-certificates/${c2}/verify", payload: {}, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/workers/${w2}/complete-orientation", payload: {}, as: SiteSuperintendent }
            - { call: "POST /safety/workers/${w2}/clear", payload: {}, as: SiteSuperintendent }
            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "M Nair", employer_type: "DIRECT" }, as: SiteSuperintendent, captures: { w3: "$.data.id" } }
            - { call: "POST /safety/training-certificates", payload: { worker_id: "${w3}", cert_type: "OSHA_10", issued_date: "2026-07-03", expires_date: "2027-07-03" }, as: SiteSuperintendent, captures: { c3: "$.data.id" } }
            - { call: "POST /safety/training-certificates/${c3}/verify", payload: {}, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/workers/${w3}/complete-orientation", payload: {}, as: SiteSuperintendent }
            - { call: "POST /safety/workers/${w3}/clear", payload: {}, as: SiteSuperintendent }
            - { call: "POST /safety/huddles", payload: { project_id: "${p}", huddle_date: "2026-08-01", topics: "phased trenching" }, as: SiteSuperintendent, captures: { h: "$.data.id" } }
            - { call: "POST /safety/huddles/${h}/conduct", payload: { attendee_worker_ids: ["${w1}", "${w2}", "${w3}"] }, as: SiteSuperintendent }
            - { call: "POST /safety/jhas", payload: { project_id: "${p}", huddle_id: "${h}", task_description: "phased excavation", hazards: "cave-in", controls: "shoring per phase" }, as: SiteSuperintendent, captures: { j: "$.data.id" } }
            - { call: "POST /safety/jhas/${j}/approve", payload: {}, as: SafetyManager }
            - { call: "POST /safety/permits", payload: { project_id: "${p}", jha_id: "${j}", permit_type: "EXCAVATION", work_start: "2026-08-02T08:00:00Z", work_end: "2026-08-02T16:00:00Z", authorized_worker_ids: ["${w1}"] }, as: SiteSuperintendent, captures: { pmA: "$.data.id" } }
          trigger:
            - { call: "POST /safety/permits", payload: { project_id: "${p}", jha_id: "${j}", permit_type: "EXCAVATION", work_start: "2026-08-02T16:00:00Z", work_end: "2026-08-02T20:00:00Z", authorized_worker_ids: ["${w2}"] }, as: SiteSuperintendent, captures: { pmB: "$.data.id", pmB_s: "$.data.status" } }
            - { call: "POST /safety/permits", payload: { project_id: "${p}", jha_id: "${j}", permit_type: "EXCAVATION", work_start: "2026-08-02T15:00:00Z", work_end: "2026-08-02T18:00:00Z", authorized_worker_ids: ["${w3}"] }, as: SiteSuperintendent, captures: { err: "$.data.error_id" } }
          assert:
            - "adjacent permit B (start == A.end): HTTP 201, Permit.${pmB}.status == REQUESTED   # half-open rule allows touching"
            - "overlapping permit C (15:00 < 16:00): error_id == ERR_PERMIT_TIME_CONFLICT"

      - name: crew_closed_interval_touching_conflicts
        grounds:
          - calculations.permit_conflict_check
          - errors[ERR_PERMIT_TIME_CONFLICT]
        distinguishing_aspect: |
          CLOSED-INTERVAL [start, end] semantics on the Worker resource: a new permit whose window merely
          TOUCHES the issued permit's window (new.start == existing.end) still CONFLICTS because both
          endpoints are inclusive for crew double-booking — different interval semantics and a different
          resource entity than the half-open excavation adjacency instance.
        test_recipe:
          setup:
            - "Project with ACTIVE plan; worker w CLEARED; huddle CONDUCTED; JHA APPROVED; FALL_PROTECTION permit ISSUED [2026-08-03T08:00Z, 2026-08-03T16:00Z] with crew [w]"
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Interbay Shop", location: "Seattle", annual_hours_worked: 30000 }, as: SafetyManager, captures: { p: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /safety/safety-plans", payload: { project_id: "${p}", effective_date: "2026-08-01" }, as: SafetyManager, captures: { pl: "$.data.id" } }
            - { call: "POST /safety/safety-plans/${pl}/activate", payload: { expected_project_version: "${p_v}" }, as: SafetyManager }
            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "N Ortiz", employer_type: "DIRECT" }, as: SiteSuperintendent, captures: { w: "$.data.id" } }
            - { call: "POST /safety/training-certificates", payload: { worker_id: "${w}", cert_type: "OSHA_10", issued_date: "2026-07-01", expires_date: "2027-07-01" }, as: SiteSuperintendent, captures: { c1: "$.data.id" } }
            - { call: "POST /safety/training-certificates/${c1}/verify", payload: {}, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/workers/${w}/complete-orientation", payload: {}, as: SiteSuperintendent }
            - { call: "POST /safety/workers/${w}/clear", payload: {}, as: SiteSuperintendent }
            - { call: "POST /safety/huddles", payload: { project_id: "${p}", huddle_date: "2026-08-01", topics: "roof + weld" }, as: SiteSuperintendent, captures: { h: "$.data.id" } }
            - { call: "POST /safety/huddles/${h}/conduct", payload: { attendee_worker_ids: ["${w}"] }, as: SiteSuperintendent }
            - { call: "POST /safety/jhas", payload: { project_id: "${p}", huddle_id: "${h}", task_description: "roof edge + welding", hazards: "fall + fire", controls: "harness + watch" }, as: SiteSuperintendent, captures: { j: "$.data.id" } }
            - { call: "POST /safety/jhas/${j}/approve", payload: {}, as: SafetyManager }
            - { call: "POST /safety/permits", payload: { project_id: "${p}", jha_id: "${j}", permit_type: "FALL_PROTECTION", work_start: "2026-08-03T08:00:00Z", work_end: "2026-08-03T16:00:00Z", authorized_worker_ids: ["${w}"] }, as: SiteSuperintendent, captures: { pmA: "$.data.id" } }
            - { call: "POST /safety/permits/${pmA}/issue", payload: {}, as: SafetyManager }
          trigger:
            - { call: "POST /safety/permits", payload: { project_id: "${p}", jha_id: "${j}", permit_type: "HOT_WORK", work_start: "2026-08-03T16:00:00Z", work_end: "2026-08-03T20:00:00Z", authorized_worker_ids: ["${w}"] }, as: SiteSuperintendent, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_PERMIT_TIME_CONFLICT   # closed-interval crew rule: touching at 16:00 conflicts (unlike half-open excavation adjacency)"
            - "Permit.${pmA}.status remains ISSUED"

  # =====================================================================
  # Rule 9 — compensating_invariant (DIFFERENT conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: permit_issue_close_count_invariant
        grounds:
          - entities.Project.fields.issued_permit_count
          - state_machines.Permit.REQUESTED_to_ISSUED
          - state_machines.Permit.ISSUED_to_CLOSED
        distinguishing_aspect: |
          Conserved quantity = count of ISSUED permits: issued_permit_count = |{pm : pm.project_id == P AND
          pm.status == ISSUED}|. Forward issue (+1) followed by its compensating close (-1) must return the
          count to exactly the pre-issue baseline 0 — a different conserved quantity than score points.
        test_recipe:
          setup:
            - "Project with ACTIVE plan; worker CLEARED; JHA APPROVED; permit ISSUED (count now 1)"
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Yesler Terrace", location: "Seattle", annual_hours_worked: 85000 }, as: SafetyManager, captures: { p: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /safety/safety-plans", payload: { project_id: "${p}", effective_date: "2026-08-01" }, as: SafetyManager, captures: { pl: "$.data.id" } }
            - { call: "POST /safety/safety-plans/${pl}/activate", payload: { expected_project_version: "${p_v}" }, as: SafetyManager }
            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "O Park", employer_type: "DIRECT" }, as: SiteSuperintendent, captures: { w: "$.data.id" } }
            - { call: "POST /safety/training-certificates", payload: { worker_id: "${w}", cert_type: "OSHA_10", issued_date: "2026-07-01", expires_date: "2027-07-01" }, as: SiteSuperintendent, captures: { c1: "$.data.id" } }
            - { call: "POST /safety/training-certificates/${c1}/verify", payload: {}, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/workers/${w}/complete-orientation", payload: {}, as: SiteSuperintendent }
            - { call: "POST /safety/workers/${w}/clear", payload: {}, as: SiteSuperintendent }
            - { call: "POST /safety/huddles", payload: { project_id: "${p}", huddle_date: "2026-08-01", topics: "anchor points" }, as: SiteSuperintendent, captures: { h: "$.data.id" } }
            - { call: "POST /safety/huddles/${h}/conduct", payload: { attendee_worker_ids: ["${w}"] }, as: SiteSuperintendent }
            - { call: "POST /safety/jhas", payload: { project_id: "${p}", huddle_id: "${h}", task_description: "façade work", hazards: "fall", controls: "anchors" }, as: SiteSuperintendent, captures: { j: "$.data.id" } }
            - { call: "POST /safety/jhas/${j}/approve", payload: {}, as: SafetyManager }
            - { call: "POST /safety/permits", payload: { project_id: "${p}", jha_id: "${j}", permit_type: "FALL_PROTECTION", work_start: "2026-08-02T08:00:00Z", work_end: "2026-08-02T16:00:00Z", authorized_worker_ids: ["${w}"] }, as: SiteSuperintendent, captures: { pm: "$.data.id" } }
            - { call: "POST /safety/permits/${pm}/issue", payload: {}, as: SafetyManager }
            - { call: "GET /safety/projects/${p}", payload: {}, as: SafetyManager, captures: { cnt_after_issue: "$.data.issued_permit_count" } }
          trigger:
            - { call: "POST /safety/permits/${pm}/close", payload: { completion_notes: "work complete" }, as: SiteSuperintendent }
            - { call: "GET /safety/projects/${p}", payload: {}, as: SafetyManager, captures: { cnt_after_close: "$.data.issued_permit_count" } }
          assert:
            - "after issue: Project.${p}.issued_permit_count == 1"
            - "after close: Permit.${pm}.status == CLOSED"
            - "after close: Project.${p}.issued_permit_count == 0   # exact return to pre-issue baseline"

      - name: score_deduction_refund_invariant
        grounds:
          - calculations.subcontractor_compliance_score
          - entities.Deficiency.fields.closed_disposition
        distinguishing_aspect: |
          Conserved quantity = subcontractor score points: deducting 15 (MAJOR) then closing with
          disposition NOT_SUB_FAULT must refund exactly 15 in BOTH variants, returning
          compliance_score_realtime and compliance_score_period_90d to exactly the pre-creation baseline
          100 — a different conserved quantity (score points) than permit counts.
        test_recipe:
          setup:
            - "Project; Subcontractor (baseline scores 100/100); WEEKLY inspection COMPLETED by insp-1; MAJOR deficiency assigned to the sub created by insp-1 (realtime now 85)"
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Columbia Center", location: "Seattle", annual_hours_worked: 100000 }, as: SafetyManager, captures: { p: "$.data.id" } }
            - { call: "POST /safety/subcontractors", payload: { project_id: "${p}", company_name: "Amp Electric", trade: "electrical" }, as: SafetyManager, captures: { s: "$.data.id" } }
            - { call: "GET /safety/subcontractors/${s}", payload: {}, as: SafetyManager, captures: { base_rt: "$.data.compliance_score_realtime", base_p90: "$.data.compliance_score_period_90d" } }
            - { call: "POST /safety/inspections", payload: { project_id: "${p}", inspection_type: "WEEKLY", due_date: "2026-08-10T17:00:00Z" }, as: SafetyInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /safety/inspections/${insp}/complete", payload: { findings_summary: "wiring" }, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/deficiencies", payload: { inspection_id: "${insp}", description: "unlabeled circuits", severity: "MAJOR", assigned_subcontractor_id: "${s}" }, as: SafetyInspector, as_user_id: "insp-1", captures: { df: "$.data.id" } }
            - { call: "GET /safety/subcontractors/${s}", payload: {}, as: SafetyManager, captures: { mid_rt: "$.data.compliance_score_realtime" } }
          trigger:
            - { call: "POST /safety/deficiencies/${df}/submit-correction", payload: { correction_notes: "labeled; pre-existing condition documented" }, as: SubcontractorRep, as_user_id: "${s}" }
            - { call: "POST /safety/deficiencies/${df}/verify", payload: { outcome: "CLOSED", disposition: "NOT_SUB_FAULT" }, as: SafetyInspector, as_user_id: "insp-2" }
            - { call: "GET /safety/subcontractors/${s}", payload: {}, as: SafetyManager, captures: { end_rt: "$.data.compliance_score_realtime", end_p90: "$.data.compliance_score_period_90d" } }
          assert:
            - "baseline: compliance_score_realtime == 100 and compliance_score_period_90d == 100"
            - "after MAJOR deficiency create: compliance_score_realtime == 85"
            - "after NOT_SUB_FAULT closure: compliance_score_realtime == 100 AND compliance_score_period_90d == 100   # exact refund, no drift"
