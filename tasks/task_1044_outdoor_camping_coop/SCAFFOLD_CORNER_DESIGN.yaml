        claim_type: violation_to_error
        grounds: [calculations.rental_fee_cents]
        excluded_because:
          difficulty_instance: combinatorial_formula / rental_fee_peak_tier_cap_mode_a
          rationale: "rental_fee_cents correctness is asserted by the named §1.8 instance."
      - name: membership_not_active_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_MEMBERSHIP_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / booking_requires_member_active
          rationale: "ERR_MEMBERSHIP_NOT_ACTIVE is asserted as the failure path of the named §1.8 instance."
      - name: rental_unit_unavailable_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_RENTAL_UNIT_UNAVAILABLE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / reservation_requires_unit_not_out_of_service
          rationale: "ERR_RENTAL_UNIT_UNAVAILABLE is asserted by the named §1.8 instance."
      - name: trip_full_boundary_excluded
