          - errors.ERR_CHART_SUPERSEDED
          - concurrency_rules.chart-pin-stale-production
        distinguishing_aspect: "Pinning a second chart on the same production is the only path into SUPERSEDED, and it must demote the first chart even though nothing about the first chart's own rows changed — distinct from STALE, which is caused by an asset version advancing."
        test_recipe:
          setup: ["A production in CLEARANCE with no assets and two charts pinned in sequence; the E&O application still references the first."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Two Charts", delivery_deadline_date: "2027-06-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
