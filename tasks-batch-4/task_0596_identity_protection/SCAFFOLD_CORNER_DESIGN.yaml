              captures: { bp_eq: "$.data[0].id", bp_ex: "$.data[1].id", bp_tu: "$.data[2].id" }
            - call: "POST /idp/bureau-profiles/${bp_eq}/score-refresh"
              payload: { credit_score: 700 }
              as: PlatformAdmin
            - call: "POST /idp/bureau-profiles/${bp_ex}/score-refresh"
              payload: { credit_score: 720 }
              as: PlatformAdmin
            - call: "POST /idp/bureau-profiles/${bp_tu}/score-refresh"
              payload: { credit_score: 660 }
              as: PlatformAdmin
          trigger:
            - call: "GET /idp/subscribers/${sub_id}/credit-summary"
