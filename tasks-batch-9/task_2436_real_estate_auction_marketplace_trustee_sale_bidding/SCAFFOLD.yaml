  - method: GET
    path: "/auction-lots"
    description: "Filtered list of auction lots; the reverse-reachability channel for both of AuctionLot's foreign keys."
    roles: [PlatformAdmin, AuctionOps, Trustee, Seller, Bidder, Anonymous]
