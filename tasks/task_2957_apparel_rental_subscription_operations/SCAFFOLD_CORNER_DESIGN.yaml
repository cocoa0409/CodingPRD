        claim_type: cycle_constraint
        grounds:
          - "complexity_profile.entity_topology"
          - "entities.ResaleListing.fields.supersedes_listing_id"
          - "endpoints.POST /resale-listings"
          - "endpoints.GET /resale-listings"
          - "state_machines.ResaleListing.transitions.EXPIRED_to_LISTED"
        distinguishing_aspect: >-
          ResaleListing is the scaffold's only self-referential entity, and the lineage is a chain, never a cycle:
          the second listing points at the first through supersedes_listing_id, the first keeps
          supersedes_listing_id null, and GET /resale-listings?supersedes_listing_id returns exactly the child.
          markdown_step 1 on the child proves the lineage is read, not just stored.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "style AUR-GOWN-01 and one grade-A size-M unit AUR-GOWN-001 with no reservations"
            - "the unit is retired with retirement_reason PLANNED_REFRESH, so it is RETIRED and eligible for resale"
            - "an OUTLET listing is created on 2026-08-03 and expires on 2026-09-05, which is at least LISTING_WINDOW_DAYS 30 after listed_at"
