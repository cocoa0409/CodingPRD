  - section: Validations
    instances:
      - claim_type: Violation → Error
        name: tier_band_overlap_and_substitute_group_mismatch_rejected
        grounds:
          - validations[priority=27]
          - validations[priority=11]
          - errors.ERR_TIER_BAND_OVERLAP
          - errors.ERR_SUBSTITUTE_GROUP_MISMATCH
          - entities.ContractTier.fields.min_case_volume
          - entities.Product.fields.substitution_group_code
        distinguishing_aspect: |
          Tier bands are half-open per (contract, product_class_code): [400,600) is
          rejected against an existing [0,500) while [500, unbounded) is accepted and a
          DAIRY [0,500) band is accepted, and a substitution rule is rejected both when
          the two products differ in class or group and when primary equals substitute.
        test_recipe:
          setup:
            - "A DRAFT contract with one PROTEIN tier on [0,500)."
            - "Products P-CHKN and S1-CHKN (PROTEIN, substitution_group_code CHKN) and P-NAP (DISPOSABLES, group NAP)."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Cascadia Poultry Co", manufacturer_code: "CPC" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "P-CHKN", description: "Chicken Breast 4/10 lb", product_class_code: "PROTEIN", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 4000, avg_cost_cents: 4000, replacement_cost_cents: 4000, substitution_group_code: "CHKN" }
              as: SystemAdmin
              captures: { chkn_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "S1-CHKN", description: "Chicken Breast alt", product_class_code: "PROTEIN", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 4000, avg_cost_cents: 4000, replacement_cost_cents: 4000, substitution_group_code: "CHKN" }
              as: SystemAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "P-NAP", description: "Dinner Napkins 6/1000", product_class_code: "DISPOSABLES", manufacturer_id: "${mfg_id}", pack_size: 6, last_cost_cents: 4000, avg_cost_cents: 4000, replacement_cost_cents: 4000, substitution_group_code: "NAP" }
              as: SystemAdmin
              captures: { nap_id: $.data.id }
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-2026", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
              captures: { ct_id: $.data.id }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "PROTEIN", cost_basis: "LAST_COST", markup_type: "PERCENT_OF_COST", markup_value: 25.00, min_case_volume: 0, max_case_volume: 500 }
              as: NationalAccountManager
              captures: { tier1_id: $.data.id }
          trigger:
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "PROTEIN", cost_basis: "LAST_COST", markup_type: "PERCENT_OF_COST", markup_value: 9.00, min_case_volume: 400, max_case_volume: 600 }
              as: NationalAccountManager
              captures: { err_overlap: $.data.error_id }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "PROTEIN", cost_basis: "LAST_COST", markup_type: "PERCENT_OF_COST", markup_value: 9.00, min_case_volume: 500 }
              as: NationalAccountManager
              captures: { tier2_id: $.data.id, tier2_min: $.data.min_case_volume }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "DAIRY", cost_basis: "AVG_COST", markup_type: "DOLLARS_PER_CASE", markup_value: 150, min_case_volume: 0, max_case_volume: 500 }
              as: NationalAccountManager
              captures: { tier3_id: $.data.id }
            - call: "POST /nac/substitution-rules"
              payload: { contract_id: "${ct_id}", primary_product_id: "${chkn_id}", substitute_product_id: "${nap_id}", rank: 1, price_protection_mode: "SUBSTITUTE_OWN_PRICE", max_price_delta_pct: 5.00 }
              as: NationalAccountManager
              captures: { err_group: $.data.error_id }
            - call: "POST /nac/substitution-rules"
              payload: { contract_id: "${ct_id}", primary_product_id: "${chkn_id}", substitute_product_id: "${chkn_id}", rank: 1, price_protection_mode: "SUBSTITUTE_OWN_PRICE", max_price_delta_pct: 5.00 }
              as: NationalAccountManager
              captures: { err_self: $.data.error_id }
            - call: "POST /nac/substitution-rules"
              payload: { contract_id: "${ct_id}", primary_product_id: "${chkn_id}", substitute_product_id: "${s1_id}", rank: 1, price_protection_mode: "SUBSTITUTE_OWN_PRICE", max_price_delta_pct: 5.00 }
              as: NationalAccountManager
              captures: { rule_id: $.data.id, rule_status: $.data.status }
          assert:
            - "${err_overlap} == ERR_TIER_BAND_OVERLAP with HTTP 409 because [400,600) intersects [0,500)"
            - "${tier2_min} == 500 and tier ${tier2_id} exists: the touching band [500, unbounded) is accepted because bands are half-open"
            - "tier ${tier3_id} exists: the band rule is scoped to (contract_id, product_class_code), so DAIRY may reuse [0,500)"
            - "${err_group} == ERR_SUBSTITUTE_GROUP_MISMATCH with HTTP 422 (DISPOSABLES / NAP against PROTEIN / CHKN)"
            - "${err_self} == ERR_SUBSTITUTE_GROUP_MISMATCH with HTTP 422 because primary_product_id equals substitute_product_id"
            - "${rule_status} == ACTIVE and GET /nac/contract-tiers?contract_id=${ct_id} returns exactly 3 rows, none of them created by the rejected calls"

