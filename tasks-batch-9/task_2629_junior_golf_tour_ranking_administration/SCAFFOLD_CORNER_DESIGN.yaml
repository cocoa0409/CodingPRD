            - { call: "POST /entries", payload: { member_id: "${m1_id}", tournament_id: "${t2_id}" }, as: Member, as_user_id: "${m1_id}", captures: { e2_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-01T00:00:00Z" }, as: Anonymous }
            - { call: "POST /tournaments/${t1_id}/close-entries", payload: {}, as: TourAdmin }
            - { call: "POST /tournaments/${t1_id}/set-field", payload: {}, as: TourAdmin }
            - { call: "POST /entries/${e1_id}/pay", payload: { amount_cents: 25000 }, as: Member, as_user_id: "${m1_id}" }
            - { call: "POST /conduct-cases", payload: { member_id: "${m1_id}", tournament_id: "${t1_id}", subject_type: "PARENT", subject_name: "Marcus Stone", incident_code: "ABUSIVE_LANGUAGE", narrative: "verbal abuse of a volunteer marshal on the 9th tee" }, as: RulesOfficial, as_user_id: "official-anna", captures: { cc_id: $.data.id } }
          trigger:
            - { call: "POST /conduct-cases/${cc_id}/decide", payload: { decision: "SANCTIONED" }, as: ConductCommittee, as_user_id: "cc-1", captures: { st: $.data.status, tier: $.data.sanction_tier, pts: $.data.points_assessed, cum: $.data.cumulative_points_at_decision } }
          assert:
            - "http_status == 200"
            - "${st} == SANCTIONED"
            - "${pts} == 3"
            - "${cum} == 3"
            - "${tier} == VENUE_BAN_ONE_EVENT"
            - "${tier} != MEMBER_SUSPENSION"
            - "Member.${m1_id}.conduct_points == 3"
            - "Member.${m1_id}.eligibility_status == VERIFIED"
            - "Entry.${e1_id}.entry_status == FORFEITED"
            - "Entry.${e1_id}.fee_status == FORFEITED_FEE"
            - "Entry.${e1_id}.refunded_cents == 0"
            - "Entry.${e2_id}.entry_status == APPLIED"
            - "Member.${m1_id}.late_withdrawal_count == 0"
            - "Tournament.${t1_id}.accepted_count == 0"
            - "Tournament.${t1_id}.open_slot_count == 2"

      - name: cleared_appeal_restores_the_member_but_not_the_closed_entry
        claim_type: compensation
        grounds:
          - state_machines.ConductCase.APPEAL_OPEN_to_CLEARED
          - state_machines.Member.SUSPENDED_to_VERIFIED
          - endpoints.POST_conduct_cases_caseId_appeal
        distinguishing_aspect: "The compensation is deliberately partial: clearing the appeal zeroes points_assessed, drops Member.conduct_points to 0 and restores eligibility_status to VERIFIED, but the entry the suspension already REJECTED stays REJECTED with rejection_reason MEMBER_SUSPENDED — reinstating the entry would be wrong."
        test_recipe:
          setup:
            - "One season, VERIFIED U17 member m1, one ENTRY_OPEN LOCAL tournament t2 with m1's entry APPLIED."
            - "At clock 2026-08-12T00:00:00Z official-anna files a PHYSICAL_ALTERCATION case (6 points) naming t2, and cc-1 sanctions it, so m1 is SUSPENDED and the entry is REJECTED."
            - "At clock 2026-08-20T00:00:00Z m1 appeals, still inside the 14-day appeal window."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "Piedmont Local", division: "U17", tier: "LOCAL", start_date: "2026-10-15", end_date: "2026-10-16", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-10-01T00:00:00Z", withdrawal_deadline_at: "2026-10-10T00:00:00Z", field_size_limit: 2, max_handicap_index: 8.4, entry_fee_cents: 15000, round_count: 2, course_rating: 70.0, slope_rating: 120 }, as: TourAdmin, captures: { t2_id: $.data.id } }
            - { call: "POST /tournaments/${t2_id}/open-entries", payload: {}, as: TourAdmin }
            - { call: "POST /entries", payload: { member_id: "${m1_id}", tournament_id: "${t2_id}" }, as: Member, as_user_id: "${m1_id}", captures: { e2_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-12T00:00:00Z" }, as: Anonymous }
            - { call: "POST /conduct-cases", payload: { member_id: "${m1_id}", tournament_id: "${t2_id}", subject_type: "CADDIE", subject_name: "Dale Stone", incident_code: "PHYSICAL_ALTERCATION", narrative: "shoved a rules official beside the 14th green" }, as: RulesOfficial, as_user_id: "official-anna", captures: { cc_id: $.data.id } }
            - { call: "POST /conduct-cases/${cc_id}/decide", payload: { decision: "SANCTIONED" }, as: ConductCommittee, as_user_id: "cc-1", captures: { tier: $.data.sanction_tier } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-20T00:00:00Z" }, as: Anonymous }
            - { call: "POST /conduct-cases/${cc_id}/appeal", payload: { grounds: "the caddie was not acting for the player and the player was not present" }, as: Member, as_user_id: "${m1_id}", captures: { ast: $.data.status, ac: $.data.appeal_count } }
          trigger:
            - { call: "POST /conduct-cases/${cc_id}/decide", payload: { decision: "CLEARED" }, as: ConductCommittee, as_user_id: "cc-1", captures: { st: $.data.status, pts: $.data.points_assessed, tier2: $.data.sanction_tier } }
          assert:
            - "${tier} == MEMBER_SUSPENSION"
            - "${ast} == APPEAL_OPEN"
            - "${ac} == 1"
            - "http_status == 200"
            - "${st} == CLEARED"
            - "${pts} == 0"
            - "${tier2} == null"
            - "Member.${m1_id}.conduct_points == 0"
            - "Member.${m1_id}.eligibility_status == VERIFIED"
            - "Entry.${e2_id}.entry_status == REJECTED"
            - "Entry.${e2_id}.rejection_reason == MEMBER_SUSPENDED"
            - "ConductCase.${cc_id}.decided_at == 2026-08-20T00:00:00Z"

      - name: entry_two_dimensions_change_independently
        claim_type: parallel
        grounds:
          - state_machines.Entry.dimension_entry_status
          - state_machines.Entry.dimension_fee_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / entry_parallel_status_dimensions_move_independently
          rationale: "That §1.8 instance already drives entry_status and fee_status apart on the same row and pins both dimensions after each write."

      - name: round_dispute_loop_terminates_at_the_dispute_limit
        claim_type: cyclic
        grounds:
          - state_machines.Round.SUBMITTED_to_DISPUTED
          - state_machines.Round.DISPUTED_to_SUBMITTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / round_dispute_cycle_returns_to_submitted_then_voids_at_limit
          rationale: "That §1.8 instance walks the SUBMITTED -> DISPUTED -> SUBMITTED loop and pins the NO_CARD termination at ROUND_DISPUTE_LIMIT."

      - name: suspension_cascades_down_to_entries_and_grants
        claim_type: cascade_down
        grounds:
          - state_machines.Member.VERIFIED_to_SUSPENDED
          - state_machines.ExemptionGrant.ACTIVE_to_REVOKED
        excluded_because:
          difficulty_instance: transitive_cascade / conduct_suspension_cascade_depth_five
          rationale: "That §1.8 instance asserts all five hops of the suspension cascade including the non-terminal-only scoping of the affected children."

      - name: season_assistance_ledger_stays_in_sync_with_entry_state
        claim_type: ledger_sync
        grounds:
          - calculations.season_assistance_ledger
          - state_machines.Entry.ACCEPTED_to_WITHDRAWN
        excluded_because:
          difficulty_instance: compensating_invariant / assistance_ledger_restored_exactly_by_predeadline_withdrawal
          rationale: "That §1.8 instance reconciles available/committed/disbursed before and after the ledger-moving transition."

      - name: withdrawal_adjusts_the_tournament_census_and_the_waitlist
        claim_type: cross_entity
        grounds:
          - state_machines.Entry.WAITLISTED_to_ACCEPTED
          - calculations.tournament_slot_census
        excluded_because:
          difficulty_instance: compensating_invariant / slot_census_conserved_by_withdrawal_answered_with_promotion
          rationale: "That §1.8 instance pins the census identity and the promoted entry's fields on both sides of the freed slot."

  # =========================================================================
  # 3. From Table 3 (Calculations)
  # =========================================================================
  - section: calculations
    instances:

      - name: field_quality_depth_term_clamps_at_zero_below_the_floor
        claim_type: constants_applied
        grounds:
          - calculations.tournament_field_quality_factor
          - entities.Tournament.fields.field_quality_factor
        distinguishing_aspect: "A two-player field is 10 below DEPTH_FLOOR 12, and max(0, field_n - DEPTH_FLOOR) clamps the depth term to zero, so field_quality_factor is exactly 1.00 — an unclamped implementation would return 1.00 + (2 - 12) * 0.01 = 0.90."
        test_recipe:
          setup:
            - "One season, two VERIFIED U17 members with no certified rank (rank_at_entry null on both entries)."
            - "One REGIONAL tournament with field_size_limit 2 driven to FIELD_SET with both entries ACCEPTED."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ben Cole", birth_date: "2010-06-15", state_code: "SC", guardian_email: "ben.guardian@example.com", handicap_index: 5.1, handicap_effective_date: "2026-07-20", handicap_source: "WHS_CLUB", publication_opt_in: false }, as: Anonymous, captures: { m2_id: $.data.id } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "POST /members/${m2_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "Carolina Regional", division: "U17", tier: "REGIONAL", start_date: "2026-09-10", end_date: "2026-09-11", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T00:00:00Z", withdrawal_deadline_at: "2026-09-05T00:00:00Z", field_size_limit: 2, max_handicap_index: 8.4, entry_fee_cents: 25000, round_count: 2, course_rating: 71.4, slope_rating: 128 }, as: TourAdmin, captures: { t1_id: $.data.id } }
            - { call: "POST /tournaments/${t1_id}/open-entries", payload: {}, as: TourAdmin }
            - { call: "POST /entries", payload: { member_id: "${m1_id}", tournament_id: "${t1_id}" }, as: Member, as_user_id: "${m1_id}", captures: { e1_id: $.data.id, rk: $.data.rank_at_entry } }
            - { call: "POST /entries", payload: { member_id: "${m2_id}", tournament_id: "${t1_id}" }, as: Member, as_user_id: "${m2_id}", captures: { e2_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-01T00:00:00Z" }, as: Anonymous }
            - { call: "POST /tournaments/${t1_id}/close-entries", payload: {}, as: TourAdmin }
          trigger:
            - { call: "POST /tournaments/${t1_id}/set-field", payload: {}, as: TourAdmin, captures: { fq: $.data.field_quality_factor, acc: $.data.accepted_count } }
          assert:
            - "${rk} == null"
            - "http_status == 200"
            - "${acc} == 2"
            - "${fq} == 1.00"
            - "${fq} != 0.90"
            - "Tournament.${t1_id}.field_quality_factor == 1.00"

      - name: assistance_covered_pct_at_the_second_income_ceiling
        claim_type: tiered_pricing
        grounds:
          - calculations.assistance_award_amount
          - endpoints.POST_aid_applications_applicationId_decide
        distinguishing_aspect: "income_per_dependent_cents of exactly 2500000 sits ON the 0.90 ceiling (<=), giving covered_pct 0.90 and estimated_award_cents 22500, while 2500001 falls to the next tier at 0.65 and 16250 — one cent decides 6250 cents of award, and a strict `<` reading would misprice the first application at 16250."
        test_recipe:
          setup:
            - "One season with assistance_budget_cents 500000 and two VERIFIED U17 members m1 and m3."
            - "m1 files an assistance application with household_income_cents 2500000 and dependents 1."
            - "m3 files one with household_income_cents 2500001 and dependents 1."
            - "Each application carries the member's current version, read immediately before the write."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Cara Diaz", birth_date: "2010-03-02", state_code: "GA", guardian_email: "cara.guardian@example.com", handicap_index: 6.4, handicap_effective_date: "2026-07-18", handicap_source: "WHS_CLUB", publication_opt_in: false }, as: Anonymous, captures: { m3_id: $.data.id } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "POST /members/${m3_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "GET /members/${m1_id}", payload: {}, as: TourAdmin, captures: { v1: $.data.version } }
            - { call: "POST /aid-applications", payload: { member_id: "${m1_id}", season_id: "${season_id}", household_income_cents: 2500000, dependents: 1, expected_member_version: "${v1}" }, as: Member, as_user_id: "${m1_id}", captures: { a1_id: $.data.id, ipd1: $.data.income_per_dependent_cents } }
            - { call: "GET /members/${m3_id}", payload: {}, as: TourAdmin, captures: { v3: $.data.version } }
            - { call: "POST /aid-applications", payload: { member_id: "${m3_id}", season_id: "${season_id}", household_income_cents: 2500001, dependents: 1, expected_member_version: "${v3}" }, as: Member, as_user_id: "${m3_id}", captures: { a3_id: $.data.id, ipd3: $.data.income_per_dependent_cents } }
          trigger:
            - { call: "POST /aid-applications/${a1_id}/decide", payload: { decision: "APPROVED" }, as: TourAdmin, captures: { p1: $.data.covered_pct, w1: $.data.estimated_award_cents, s1: $.data.status } }
            - { call: "POST /aid-applications/${a3_id}/decide", payload: { decision: "APPROVED" }, as: TourAdmin, captures: { p3: $.data.covered_pct, w3: $.data.estimated_award_cents } }
          assert:
            - "${ipd1} == 2500000"
            - "${ipd3} == 2500001"
            - "trigger 1: http_status == 200"
            - "${s1} == APPROVED"
            - "${p1} == 0.90"
            - "${w1} == 22500"
            - "${w1} != 16250"
            - "trigger 2: http_status == 200"
            - "${p3} == 0.65"
            - "${w3} == 16250"
            - "AidApplication.${a1_id}.per_member_cap_cents == 60000"
            - "AidApplication.${a1_id}.consumed_cents == 0"
            - "Season.${season_id}.assistance_available_cents == 500000"
            - "Season.${season_id}.assistance_committed_cents == 0"

      - name: pace_penalty_is_capped_at_three_strokes
        claim_type: threshold
        grounds:
          - calculations.round_pace_penalty
          - endpoints.POST_rounds_roundId_pace_observations
        distinguishing_aspect: "Six warnings (warning_component 4) plus a 20-minute breach (timing_component 2) sum to 6, but PACE_PENALTY_CAP 3 clamps pace_penalty_strokes to 3, so adjusted_gross for a 70 card is 73 and the certified differential is 1.4 — an uncapped implementation would report 6 strokes and a differential of 4.1."
        test_recipe:
          setup:
            - "The two-member REGIONAL 2-round tournament driven to IN_PROGRESS with both entries ACCEPTED and PAID."
            - "m1's round 1 is SCHEDULED with m2 as marker; six WARNING observations are recorded, one of them 20 minutes behind."
