  - rule_id: non_linear_state_machine
    instances:
      - name: shift_running_suspended_cycle
        grounds:
          - state_machines.ProductionShift.RUNNING_to_SUSPENDED
          - state_machines.ProductionShift.SUSPENDED_to_RUNNING
          - state_machines.LineRun.RUNNING_to_PAUSED
        distinguishing_aspect: |
          Cycle on ProductionShift: RUNNING -> SUSPENDED -> RUNNING -> SUSPENDED ->
          RUNNING -> CLOSED, with the run auto-pausing (auto_paused=true) on suspend
          and auto-resuming only because auto_paused was set — a manual-pause-free
          revert loop on the shift entity.
        test_recipe:
          setup:
            - "EV-1; shift fully staffed RUNNING; lot received; run R1 RUNNING at 175"
          setup_api_calls:
