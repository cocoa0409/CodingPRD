      - name: corner_abandon_cascades_withdraw_to_gaps_and_draft_descriptions
        claim_type: side_effect_execution
        grounds: ["state_machines.Engagement.SCOPING_to_ABANDONED", "state_machines.Gap.OPEN_to_WITHDRAWN", "calculations.gap_debt_points"]
        distinguishing_aspect: "ABANDON withdraws every non-settled Gap and every DRAFT or IN_REVIEW SystemDescription, zeroes each withdrawn gap's debt_points, and drops gap_debt_points from 23.00 to 0.00 with gap_posture returning FROZEN -> OPEN."
        test_recipe:
          setup:
            - "Engagement 'Doomed' in SCOPING with one OPEN CRITICAL manual gap (base_debt 20, gap_debt_points 23.00, gap_posture FROZEN) and one DRAFT SystemDescription."
          setup_api_calls:
            - call: "POST /soc/engagements"
              payload: { client_name: "Doomed", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"] }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { eng: $.data.id, eng_v: $.data.version }
            - call: "POST /soc/system-descriptions"
              payload: { engagement_id: "${eng}", version_label: "v1", boundary_narrative: "Never finished.", expected_engagement_version: "${eng_v}" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { sd: $.data.id }
            - call: "POST /soc/gaps"
              payload: { engagement_id: "${eng}", severity: "CRITICAL", description: "No security function exists" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { g: $.data.id }
            - call: "GET /soc/engagements/${eng}/readiness-summary"
              payload: {}
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { debt_pre: $.data.gap_debt_points, posture_pre: $.data.gap_posture }
          trigger:
            - call: "POST /soc/engagements/${eng}/transitions"
              payload: { action: "ABANDON", reason: "Client withdrew from the examination" }
              as: ComplianceLead
              as_user_id: "cl-1"
          assert:
            - "${debt_pre} == 23.00"
            - "${posture_pre} == FROZEN"
            - "Engagement.${eng}.status == ABANDONED"
            - "Gap.${g}.status == WITHDRAWN"
            - "Gap.${g}.debt_points == 0"
            - "SystemDescription.${sd}.status == WITHDRAWN"
            - "Engagement.${eng}.base_debt_points == 0"
            - "Engagement.${eng}.gap_debt_points == 0.00"
            - "Engagement.${eng}.gap_posture == OPEN"

