  - rule_id: boundary_precision_check
    instances:

      - name: duration_tier_one_inclusive_boundary_and_fee_floor_at_thirty_seconds
        grounds:
          - calculations.license_rate_card_fee_cents
          - entities.RateCard.fields.tier1_max_seconds
          - entities.RateCard.fields.minimum_fee_cents
          - entities.License.fields.billable_units
        distinguishing_aspect: |
          A DURATION boundary that moves two things at once: at exactly 30 seconds the asset stays
          in tier 1 (inclusive bound) with billable_units 1 and the raw product 144900 falls BELOW
          the 150000 floor, so the floor is the answer; at 31 seconds billable_units becomes 2 AND
          tier 2's 1.25 multiplier engages, so the fee jumps to 362250 — a 150 % jump for one extra
          second, with the floor no longer binding.
        test_recipe:
          setup:
            - "A production in CLEARANCE and an ACTIVE archive with the standard rate card (base 60000, all-media floor 150000, defaults elsewhere)."
            - "Two ARCHIVAL_FOOTAGE assets with SELECTED AVAILABLE candidates: asset E is exactly 30 seconds, asset F is exactly 31 seconds."
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "One Second Apart", delivery_deadline_date: "2027-08-31" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "POST /archives"
              payload: { name: "Pathe Vault", holder_type: "FILM_ARCHIVE" }
              as: ArchiveResearcher
              captures: { arch_id: $.data.id }
            - call: "POST /archives/${arch_id}/rate-cards"
              payload: { base_rate_per_30s_cents: 60000, minimum_fee_cents: 150000, festival_minimum_fee_cents: 40000, effective_from_date: "2026-01-01" }
              as: ArchiveResearcher
              captures: { rc_id: $.data.id }
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Thirty seconds exactly", timecode_in_seconds: 0, timecode_out_seconds: 30, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
              captures: { asset_e_id: $.data.id }
            - call: "POST /assets/${asset_e_id}/source-candidates"
              payload: { archive_id: "${arch_id}", availability_status: "AVAILABLE" }
              as: ArchiveResearcher
              captures: { cand_e_id: $.data.id }
            - call: "POST /assets/${asset_e_id}/select-source"
              payload: { source_candidate_id: "${cand_e_id}" }
              as: ArchiveResearcher
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Thirty one seconds", timecode_in_seconds: 0, timecode_out_seconds: 31, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
              captures: { asset_f_id: $.data.id }
            - call: "POST /assets/${asset_f_id}/source-candidates"
              payload: { archive_id: "${arch_id}", availability_status: "AVAILABLE" }
              as: ArchiveResearcher
              captures: { cand_f_id: $.data.id }
            - call: "POST /assets/${asset_f_id}/select-source"
              payload: { source_candidate_id: "${cand_f_id}" }
              as: ArchiveResearcher
          trigger:
            - call: "POST /licenses"
              payload: { production_id: "${prod_id}", asset_id: "${asset_e_id}", archive_id: "${arch_id}", rights_leg: "FOOTAGE", media: "BROADCAST", territory: "WORLD", window_class: "ALL_MEDIA_WINDOW", term_months: 36, term_start_date: "2026-08-15", term_end_date: "2029-08-15" }
              as: ClearanceSupervisor
              captures: { lic_e_id: $.data.id, fee_e: $.data.rate_card_fee_cents }
            - call: "POST /licenses"
              payload: { production_id: "${prod_id}", asset_id: "${asset_f_id}", archive_id: "${arch_id}", rights_leg: "FOOTAGE", media: "BROADCAST", territory: "WORLD", window_class: "ALL_MEDIA_WINDOW", term_months: 36, term_start_date: "2026-08-15", term_end_date: "2029-08-15" }
              as: ClearanceSupervisor
              captures: { lic_f_id: $.data.id, fee_f: $.data.rate_card_fee_cents }
          assert:
            - "Asset.${asset_e_id}.duration_seconds == 30 and Asset.${asset_f_id}.duration_seconds == 31"
            - "License.${lic_e_id}.billable_units == 1 and License.${lic_f_id}.billable_units == 2"
            - "License.${lic_e_id}.rate_card_fee_cents == 150000 — the floor, because the raw product was only 144900"
            - "License.${lic_f_id}.rate_card_fee_cents == 362250 — tier 2's 1.25 multiplier engaged and the floor is not binding"
            - "the 30-second asset was NOT charged 144900 (floor ignored) and the 31-second asset was NOT charged with tier 1's 1.00 multiplier (290000-class value)"

      - name: renewal_window_sixty_versus_sixty_one_whole_days
        grounds:
          - validations[priority=40]
          - calculations.rights_sweep_epoch
          - errors.ERR_OUTSIDE_RENEWAL_WINDOW
          - state_machines.License.EXECUTED_to_ACTIVE
          - entities.License.fields.term_end_date
        distinguishing_aspect: |
          A TEMPORAL off-by-one on a different endpoint and a different unit: whole days between
          the logical clock and term_end_date. 2027-06-15 is 61 days out and is refused; the very
          next day, 2027-06-16, is exactly 60 days out and is accepted — the inclusive edge of the
          window, tested from both sides against the same licence.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-20T00:00:00Z."
            - "One EXECUTED 12-month FOOTAGE licence (2026-08-15 to 2027-08-15, rate_card_fee_cents and executed_fee_cents both 258750) whose production's committed_fee_cents is 258750."
            - "One rights sweep has already run at that clock, so the licence is ACTIVE and sweep_epoch is 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ClearanceSupervisor
            - call: "POST /productions"
              payload: { title: "Sixty Days", delivery_deadline_date: "2027-05-31" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "POST /archives"
              payload: { name: "Pathe Vault", holder_type: "FILM_ARCHIVE" }
              as: ArchiveResearcher
              captures: { arch_id: $.data.id }
            - call: "POST /archives/${arch_id}/rate-cards"
              payload: { base_rate_per_30s_cents: 60000, minimum_fee_cents: 150000, festival_minimum_fee_cents: 40000, effective_from_date: "2026-01-01" }
              as: ArchiveResearcher
              captures: { rc_id: $.data.id }
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Expiring reel", timecode_in_seconds: 0, timecode_out_seconds: 45, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
              captures: { asset_id: $.data.id }
            - call: "POST /assets/${asset_id}/source-candidates"
              payload: { archive_id: "${arch_id}", availability_status: "AVAILABLE" }
              as: ArchiveResearcher
              captures: { cand_id: $.data.id }
            - call: "POST /assets/${asset_id}/select-source"
              payload: { source_candidate_id: "${cand_id}" }
              as: ArchiveResearcher
            - call: "POST /licenses"
              payload: { production_id: "${prod_id}", asset_id: "${asset_id}", archive_id: "${arch_id}", rights_leg: "FOOTAGE", media: "BROADCAST", territory: "WORLD", window_class: "ALL_MEDIA_WINDOW", term_months: 12, term_start_date: "2026-08-15", term_end_date: "2027-08-15" }
              as: ClearanceSupervisor
              captures: { lic_id: $.data.id, lic_v: $.data.version }
            - call: "POST /licenses/${lic_id}/negotiation-rounds"
              payload: { party: "LICENSOR", proposed_fee_cents: 258750, expected_license_version: "${lic_v}" }
              as: RightsHolderRep
              as_user_id: "${arch_id}"
            - call: "POST /licenses/${lic_id}/state"
              payload: { to_status: "EXECUTED" }
              as: ClearanceSupervisor
            - call: "POST /productions/${prod_id}/rights-sweep"
              payload: {}
              as: ClearanceSupervisor
          setup_note: "The sweep above activates the licence (term_start 2026-08-15 <= clock 2026-08-20) without expiring it, satisfying the priority-12 precondition for renewal."
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-15T00:00:00Z" }
              as: ClearanceSupervisor
            - call: "POST /licenses/${lic_id}/renew"
              payload: { additional_term_months: 24 }
              as: ClearanceSupervisor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-16T00:00:00Z" }
              as: ClearanceSupervisor
            - call: "POST /licenses/${lic_id}/renew"
              payload: { additional_term_months: 24 }
              as: ClearanceSupervisor
              captures: { fee_after: $.data.rate_card_fee_cents, executed_after: $.data.executed_fee_cents }
          assert:
            - "License.${lic_id}.status == ACTIVE after the setup sweep and the sweep response lists ${lic_id} in activated_license_ids with an empty expired_license_ids"
            - "the first renew (clock 2027-06-15, 61 whole days to term_end_date) returns 409 with error_id ERR_OUTSIDE_RENEWAL_WINDOW"
            - "after that rejection License.${lic_id}.term_months is still 12 and term_end_date is still 2027-08-15"
            - "the second renew (clock 2027-06-16, exactly 60 whole days) returns 200"
            - "License.${lic_id}.term_months == 36 and term_end_date == 2029-08-15"
            - "License.${lic_id}.rate_card_fee_cents == 362250 (re-run for the 36-month term) and executed_fee_cents == 362250 (258750 plus renewal_delta_cents 103500)"
            - "Production.${prod_id}.committed_fee_cents == 362250"

