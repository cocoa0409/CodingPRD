      - name: project_posture_rederived_from_children_after_gate_clears
        claim_type: compound
        grounds:
          - state_machines.ConversionProject.posture.initial_state
          - state_machines.ConversionProject.posture.transitions.RESTRICTED_to_OPEN
          - calculations.project_posture_derivation
          - entities.ConversionProject.fields.last_posture_recalculated_at
          - endpoints[POST /conversion-projects/{id}/posture-recalculations]
        distinguishing_aspect: "posture is never stored by a client; it is re-derived from the children on
          demand. Clearing ONE of the two FROZEN clauses is not enough: the report leaving
          REVISION_REQUESTED still leaves suitability_gate == FAILED, so only after a fresh PASSED
          assessment does the sweep re-derive the parent, and even then it lands on RESTRICTED (no
          RECORDED DeclarationPackage, no EFFECTIVE POS) and never on OPEN."
        test_recipe:
          setup:
            - "Project frozen by a peer REJECT: its only EngineeringReport is REVISION_REQUESTED, its
              single ROOF component UNVERIFIED, suitability_gate FAILED and suitability_score 0.00."
          setup_api_calls:
            - call: "POST /conversion-projects"
              payload: { building_address: "44 Cove Lane, Bangor ME", year_built: 1968, total_unit_count: 2, sponsor_user_id: "sponsor-1" }
