            - "OvertimeOffer.${off46b}.firefighter_id == ${ff46b} — the second lap of the cycle selects the member with the lower hours ledger, not the more senior member"
            - "OvertimeOffer.${off46b}.projected_cost_cents == 144000 and OvertimeOffer.${off46b}.status == \"ACCEPTED\""
            - "Vacancy.${vac46}.status == \"FILLED\" after having been OPEN, OFFERING, OPEN and OFFERING in that order"
