            - call: "POST /credit-inspections/${insp}/complete"
              payload: { result: "PASS", observed_score: 80 }
              as: CreditInspector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSPECTION_ALREADY_COMPLETED"

