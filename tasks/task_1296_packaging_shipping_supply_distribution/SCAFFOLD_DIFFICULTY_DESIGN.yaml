            - "approve after reactivate: error_id == ERR_CREDIT_LIMIT_EXCEEDED (captured ${err_2}: 0 + 1118005 > 100)"

  # ------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: credit_limit_equality_passes_one_cent_below_fails
        grounds:
          - calculations.calc_credit_check
          - validations[priority=16]
        distinguishing_aspect: |
          Numeric equality boundary on POST /orders/{id}/approve: prospective
          receivable EXACTLY equal to credit_limit passes (<=), while
          credit_limit exactly one cent lower fails — a cents-precision
          boundary on the credit metric, distinct from the sibling's temporal
          cutoff boundary on submit.
        test_recipe:
          setup:
            - "CORPORATE account po_required=true credit_limit_cents=1175317; order po PO-EQ with line qty 101 at base 10000 -> grand exactly 1175317 (subtotal 1010000 + provisional freight 165317), routed to PO_REVIEW"
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 1175317, default_warehouse_code: "ATL", po_required: true }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "BX-200", name: "Book Box", category: "BOXES", base_price_cents: 10000, uom: "EACH", case_qty: 1, pallet_qty: 1000, weight_lbs_per_unit: 10, density_pcf: 20 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${prod}", warehouse_id: "${wh_atl}", on_hand_qty: 1000 }
              as: WarehouseOps
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5, po_number: "PO-EQ" }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord}/lines"
              payload: { product_id: "${prod}", qty: 101 }
              as: Buyer
              as_user_id: "${acct}"
            - call: "POST /packaging-distribution/orders/${ord}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
              captures: { st: $.data.status, grand: $.data.grand_total_cents }
            - call: "PATCH /packaging-distribution/accounts/${acct}"
              payload: { credit_limit_cents: 1175316 }
              as: PlatformAdmin
          trigger:
            - call: "POST /packaging-distribution/orders/${ord}/approve"
              payload: {}
              as: AccountApprover
              as_user_id: "${acct}"
              captures: { err_1: $.data.error_id }
            - call: "PATCH /packaging-distribution/accounts/${acct}"
              payload: { credit_limit_cents: 1175317 }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders/${ord}/approve"
              payload: {}
              as: AccountApprover
              as_user_id: "${acct}"
              captures: { st_2: $.data.status }
          assert:
            - "order grand_total_cents == 1175317 at submit (captured ${grand})"
            - "submit routed to PO_REVIEW (captured ${st})"
            - "approve with limit 1175316 (one cent below prospective 1175317): error_id == ERR_CREDIT_LIMIT_EXCEEDED (captured ${err_1})"
            - "approve with limit 1175317 (exactly equal): status == STOCK_RESERVED (captured ${st_2}) — equality passes because the rule is <="

      - name: cutoff_exact_equality_rolls_to_next_day
        grounds:
          - calculations.calc_same_day_cutoff
        distinguishing_aspect: |
          Temporal boundary on POST /orders/{id}/submit: local submit time
          exactly equal to ship_cutoff_time 15:00 is NOT same-day (strict <),
          rolling the promise to the next business day, while 14:59 keeps the
          same day — a clock-equality boundary distinct from the sibling's
          cents boundary on approve.
        test_recipe:
          setup:
            - "Warehouse ATL cutoff 15:00 America/New_York (UTC-4 in August); CORPORATE account; stock product inventory 100; two identical DRAFT orders ready to submit"
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
