              captures: { inq_id: "$.data.id" }
            - call: "POST /inquiries/${inq_id}/route"
              payload: {}
              as: IRAnalyst
              as_user_id: "u_ira_1"
            - call: "POST /response-drafts"
              payload: { inquiry_id: "${inq_id}", body_text: "Our published FY2026 EPS guidance range is unchanged.", disclosure_class: "GUIDANCE_REPEAT", cited_disclosure_id: "${dis_id}" }
              as: IRAnalyst
              as_user_id: "u_ira_1"
              captures: { dr_id: "$.data.id" }
            - call: "POST /response-drafts/${dr_id}/submit-review"
              payload: {}
              as: IRAnalyst
              as_user_id: "u_ira_1"
            - call: "GET /inquiries/${inq_id}"
              payload: {}
              as: IRAnalyst
              as_user_id: "u_ira_1"
