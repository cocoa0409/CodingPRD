  # ------------------------------------------------------------------
  # Consistency Model
  # ------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: latecomer_waive_leaves_pool_unchanged
        claim_type: immediate
        grounds: [state_machines.LatecomerReimbursement.ASSESSED_to_WAIVED, entities.MainExtensionProject.fields.outstanding_recoverable_cents]
        distinguishing_aspect: "Waiving an ASSESSED latecomer moves it to WAIVED and does NOT change the project's reimbursed_collected_cents/outstanding_recoverable_cents (only collect moves the pool)."
        test_recipe:
          setup: ["ACCEPTED project principal 5,000,000; one ASSESSED latecomer of 500,000 (not collected)."]
          setup_api_calls:
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-WV", service_type: "WATER", meter_size: "ONE", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-1"
