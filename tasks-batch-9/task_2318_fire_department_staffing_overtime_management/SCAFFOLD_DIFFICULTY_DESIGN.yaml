              as: StaffingOfficer
              captures: { ff46b: "$.data.id" }
            - call: "POST /fire-ops/hiring-rosters"
              payload: { station_id: "${st46}", roster_type: "VOLUNTARY_OT", certification_scope: "NONE" }
              as: StaffingOfficer
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st46}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh46: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh46}/publish"
              payload: {}
              as: StaffingOfficer
            - call: "GET /fire-ops/vacancies"
              payload: { duty_shift_id: "${sh46}", status: "OPEN" }
              as: StaffingOfficer
              captures: { vac46: "$.data[0].id" }
            - call: "POST /fire-ops/vacancies/${vac46}/offer"
              payload: { hiring_mode: "VOLUNTARY", offer_hours: 24 }
              as: StaffingOfficer
              captures: { off46a: "$.data.id" }
            - call: "POST /fire-ops/overtime-offers/${off46a}/response"
              payload: { response: "DECLINE" }
