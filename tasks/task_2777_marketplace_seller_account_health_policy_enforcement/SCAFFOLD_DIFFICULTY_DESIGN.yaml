# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2777 — Marketplace Seller Account Health & Policy Enforcement
#
# 9 rule_ids x >= 2 differentiated instances = 23 instances.
# Every literal in an `assert:` line was computed by executing the cited
# §1.3 formula against the fixture pinned in `setup:` (see the per-instance
# arithmetic notes). The logical clock is set explicitly in every chain; the
# implementation's startup default is 2026-08-01T00:00:00Z.
#
# Fixture user ids used throughout (segregation of duties, §1.4 priority 60):
#   inv-1 / inv-2  PolicyInvestigator      ar-1  AppealReviewer
#   co-1  / co-2   ComplianceOfficer

scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: odr_provisional_vs_final_diverge_on_two_snapshot_window
        grounds:
          - "calculations.order_defect_rate"
          - "entities.HealthEvaluation.fields.odr_provisional"
          - "entities.HealthEvaluation.fields.odr_final"
          - "entities.HealthEvaluation.fields.odr_variant_delta"
          - "entities.HealthEvaluation.fields.input_snapshot_count"
          - "calculations.metric_tier"
        distinguishing_aspect: |
          The two variants of order_defect_rate differ on THREE structural axes at once
          (input-set width: latest snapshot only vs the whole set S; numerator: pending +
          substantiated vs substantiated only; denominator: order_volume vs summed
          delivered_or_refunded_volume), and only FINAL feeds breached_metrics / health_score /
          metric_tier — so the same evaluation stores 0.0250 and 0.0129 side by side with a
          non-zero odr_variant_delta of 0.0121.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "One seller with exactly two non-overlapping MetricSnapshot rows inside the 90-day lookback: [2026-06-01, 2026-07-01) and [2026-07-01, 2026-08-01)."
            - "Older snapshot: order_volume 1500, delivered_or_refunded 1400, pending 5, substantiated 16, late 56, cancellations 22, shipments 1450, valid tracking 1300."
            - "Newer snapshot: order_volume 1600, delivered_or_refunded 1550, pending 18, substantiated 22, late 80, cancellations 45, shipments 1580, valid tracking 1371."
            - "Policy catalogue holds NO SHIPPING_PERFORMANCE / ACCOUNT rule, so the BREACHING auto-violation pool is empty and the empty-pool fallback applies."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sellers"
              payload: { legal_name: "Northwind Retail LLC", email: "ops@northwind-retail.example", tax_id_hash: "TAX-NW-0001", payout_bank_token: "BANK-NW-0001", address_fingerprint: "ADDR-NW-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /metric-snapshots"
              payload: { seller_id: "${s_id}", window_start: "2026-06-01T00:00:00.000Z", window_end: "2026-07-01T00:00:00.000Z", order_volume: 1500, delivered_or_refunded_volume: 1400, defect_claims_pending: 5, defect_claims_substantiated: 16, late_shipments: 56, pre_fulfillment_cancellations: 22, shipments_total: 1450, shipments_with_valid_tracking: 1300, source: "PLATFORM_PIPELINE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /metric-snapshots"
              payload: { seller_id: "${s_id}", window_start: "2026-07-01T00:00:00.000Z", window_end: "2026-08-01T00:00:00.000Z", order_volume: 1600, delivered_or_refunded_volume: 1550, defect_claims_pending: 18, defect_claims_substantiated: 22, late_shipments: 80, pre_fulfillment_cancellations: 45, shipments_total: 1580, shipments_with_valid_tracking: 1371, source: "PLATFORM_PIPELINE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /sellers/${s_id}/health-evaluations"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { ev_id: $.data.id }
          assert:
            - "HTTP 201"
            - "HealthEvaluation.${ev_id}.input_snapshot_count == 2"
            - "HealthEvaluation.${ev_id}.input_window_start == 2026-06-01T00:00:00.000Z"
            - "HealthEvaluation.${ev_id}.input_window_end == 2026-08-01T00:00:00.000Z"
            - "HealthEvaluation.${ev_id}.odr_provisional == 0.0250   # PROVISIONAL: (18 + 22) / 1600, latest snapshot only"
            - "HealthEvaluation.${ev_id}.odr_final == 0.0129   # FINAL: (16 + 22) / (1400 + 1550) = 0.0128813 -> round4"
            - "HealthEvaluation.${ev_id}.odr_variant_delta == 0.0121"
            - "HealthEvaluation.${ev_id}.odr_provisional != HealthEvaluation.${ev_id}.odr_final"
            - "HealthEvaluation.${ev_id}.breached_metrics == [ORDER_DEFECT_RATE, LATE_SHIPMENT_RATE, VALID_TRACKING_RATE]   # driven by odr_final 0.0129 >= 0.0100"
            - "HealthEvaluation.${ev_id}.metric_tier == BREACHING"
            - "HealthEvaluation.${ev_id}.auto_violation_id == null   # empty-pool fallback: no SHIPPING_PERFORMANCE / ACCOUNT rule exists"
            - "Seller.${s_id}.metric_tier == BREACHING"
            - "Seller.${s_id}.disbursement_state == NORMAL   # no auto-violation was minted, so no investigation gate exists"

      - name: reserve_rolling_vs_claim_exposure_diverge_on_identical_seller_state
        grounds:
          - "calculations.reserve_requirement_cents"
          - "calculations.risk_tier"
          - "entities.DisbursementHold.fields.reserve_basis"
          - "entities.DisbursementHold.fields.held_amount_cents"
          - "entities.Seller.fields.open_defect_claim_units"
          - "concurrency_rules[hold-create-stale-seller]"
        distinguishing_aspect: |
          Two sellers carrying byte-identical state (available_balance_cents 300000,
          open_defect_claim_units 21, risk_tier TIER_2, disbursement_state RESERVE_HELD) receive
          holds under the two bases and reserve different money: ROLLING scales off the balance
          (60000) while CLAIM_EXPOSURE scales off open claim units and ignores the balance
          entirely (236250) — a 176250-cent divergence on identical inputs, in a different
          entity domain (funds) than the order_defect_rate variant pair (metrics).
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "Two sellers A and B with identical metric history: one snapshot [2026-07-01, 2026-08-01) with order_volume 2000, delivered_or_refunded 2000, pending 21, substantiated 20, late 60, cancellations 40, shipments 2000, valid tracking 1980."
            - "Each seller evaluated once: odr_final 0.0100 breaches, late 0.0300 and cancellation 0.0200 do not, tracking 0.9900 does not -> 1 breach -> metric_tier AT_RISK, health_score 100.00."
            - "Each seller credited 300000 cents and has one UNDER_INVESTIGATION violation, so disbursement_state is RESERVE_HELD while enforcement_state stays ACTIVE and severity_points_balance stays 0.00."
            - "risk_tier therefore resolves to TIER_2 for both (metric_tier == AT_RISK branch), and open_defect_claim_units is 21 for both."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-ACC-1", category: "LISTING_ACCURACY", base_severity_weight: 2.80, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_la: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Alder Goods LLC", email: "ops@alder-goods.example", tax_id_hash: "TAX-AL-0001", payout_bank_token: "BANK-AL-0001", address_fingerprint: "ADDR-AL-0001" }
              as: Anonymous
              captures: { s_a: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Birch Depot LLC", email: "ops@birch-depot.example", tax_id_hash: "TAX-BI-0002", payout_bank_token: "BANK-BI-0002", address_fingerprint: "ADDR-BI-0002" }
              as: Anonymous
              captures: { s_b: $.data.id }
            - call: "POST /metric-snapshots"
              payload: { seller_id: "${s_a}", window_start: "2026-07-01T00:00:00.000Z", window_end: "2026-08-01T00:00:00.000Z", order_volume: 2000, delivered_or_refunded_volume: 2000, defect_claims_pending: 21, defect_claims_substantiated: 20, late_shipments: 60, pre_fulfillment_cancellations: 40, shipments_total: 2000, shipments_with_valid_tracking: 1980, source: "PLATFORM_PIPELINE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /metric-snapshots"
              payload: { seller_id: "${s_b}", window_start: "2026-07-01T00:00:00.000Z", window_end: "2026-08-01T00:00:00.000Z", order_volume: 2000, delivered_or_refunded_volume: 2000, defect_claims_pending: 21, defect_claims_substantiated: 20, late_shipments: 60, pre_fulfillment_cancellations: 40, shipments_total: 2000, shipments_with_valid_tracking: 1980, source: "PLATFORM_PIPELINE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sellers/${s_a}/health-evaluations"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /sellers/${s_b}/health-evaluations"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /sellers/${s_a}/proceeds-credits"
              payload: { amount_cents: 300000, external_reference: "PAYOUT-A-01" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sellers/${s_b}/proceeds-credits"
              payload: { amount_cents: 300000, external_reference: "PAYOUT-B-01" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /violations"
              payload: { seller_id: "${s_a}", policy_rule_id: "${rule_la}", reporter_type: "BUYER", evidence_reference: "EV-A-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v_a: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_b}", policy_rule_id: "${rule_la}", reporter_type: "BUYER", evidence_reference: "EV-B-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v_b: $.data.id }
            - call: "POST /violations/${v_a}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v_b}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "GET /sellers/${s_a}"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { s_a_v: $.data.version }
            - call: "GET /sellers/${s_b}"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { s_b_v: $.data.version }
          trigger:
            - call: "POST /disbursement-holds"
              payload: { seller_id: "${s_a}", hold_type: "RESERVE", reserve_basis: "ROLLING", coverage_start: "2026-08-01T00:00:00.000Z", coverage_end: "2026-08-31T00:00:00.000Z", expected_seller_version: "${s_a_v}" }
              as: PolicyInvestigator
              as_user_id: "inv-2"
              captures: { h_a: $.data.id }
            - call: "POST /disbursement-holds"
              payload: { seller_id: "${s_b}", hold_type: "RESERVE", reserve_basis: "CLAIM_EXPOSURE", coverage_start: "2026-08-01T00:00:00.000Z", coverage_end: "2026-08-31T00:00:00.000Z", expected_seller_version: "${s_b_v}" }
              as: PolicyInvestigator
              as_user_id: "inv-2"
              captures: { h_b: $.data.id }
          assert:
            - "Seller.${s_a}.open_defect_claim_units == 21 and Seller.${s_b}.open_defect_claim_units == 21"
            - "Seller.${s_a}.metric_tier == AT_RISK and Seller.${s_b}.metric_tier == AT_RISK"
            - "DisbursementHold.${h_a}.risk_tier == TIER_2"
            - "DisbursementHold.${h_b}.risk_tier == TIER_2"
            - "DisbursementHold.${h_a}.held_amount_cents == 60000   # ROLLING: round_half_up(300000 * 0.20)"
            - "DisbursementHold.${h_b}.held_amount_cents == 236250   # CLAIM_EXPOSURE: round_half_up(21 * 9000 * 1.25)"
            - "DisbursementHold.${h_b}.held_amount_cents - DisbursementHold.${h_a}.held_amount_cents == 176250"
            - "Seller.${s_a}.available_balance_cents == 240000 and Seller.${s_a}.held_balance_cents == 60000"
            - "Seller.${s_b}.available_balance_cents == 63750 and Seller.${s_b}.held_balance_cents == 236250"
            - "Seller.${s_a}.available_balance_cents + Seller.${s_a}.held_balance_cents == 300000"
            - "Seller.${s_b}.available_balance_cents + Seller.${s_b}.held_balance_cents == 300000"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: health_score_penalty_rounding_pinned_per_component
        grounds:
          - "calculations.health_score"
          - "calculations.secondary_metric_rates"
          - "entities.HealthEvaluation.fields.health_score"
          - "entities.Seller.fields.health_score"
        distinguishing_aspect: |
          Mode (b): four independent inputs (odr_final, late_shipment_rate, cancellation_rate,
          valid_tracking_rate) collapse into one output through a PINNED rounding order — each
          weighted penalty is rounded to 2dp FIRST and the four rounded penalties are then summed
          (12.33 + 2.39 + 0.00 + 1.05 = 15.77 -> 84.23). The competing sum-then-round reading
          gives 84.24 on this exact fixture, so the two readings are separated by 0.01.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "One seller with the same two-snapshot window as odr_provisional_vs_final_diverge_on_two_snapshot_window."
            - "Resulting rates: odr_final 0.0129, late_shipment_rate 0.0439, cancellation_rate 0.0216, valid_tracking_rate 0.8815."
            - "Overage ratios: odr 0.29, late 0.0975, cancellation 0 (below its 0.0250 threshold, clamped by max(...,0)), tracking 0.0721052631578947."
            - "Weighted penalties before rounding: 12.325, 2.38875, 0, 1.04552631578947."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sellers"
              payload: { legal_name: "Cedarline Trading LLC", email: "ops@cedarline-trading.example", tax_id_hash: "TAX-CE-0001", payout_bank_token: "BANK-CE-0001", address_fingerprint: "ADDR-CE-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /metric-snapshots"
              payload: { seller_id: "${s_id}", window_start: "2026-06-01T00:00:00.000Z", window_end: "2026-07-01T00:00:00.000Z", order_volume: 1500, delivered_or_refunded_volume: 1400, defect_claims_pending: 5, defect_claims_substantiated: 16, late_shipments: 56, pre_fulfillment_cancellations: 22, shipments_total: 1450, shipments_with_valid_tracking: 1300, source: "PLATFORM_PIPELINE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /metric-snapshots"
              payload: { seller_id: "${s_id}", window_start: "2026-07-01T00:00:00.000Z", window_end: "2026-08-01T00:00:00.000Z", order_volume: 1600, delivered_or_refunded_volume: 1550, defect_claims_pending: 18, defect_claims_substantiated: 22, late_shipments: 80, pre_fulfillment_cancellations: 45, shipments_total: 1580, shipments_with_valid_tracking: 1371, source: "PLATFORM_PIPELINE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /sellers/${s_id}/health-evaluations"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ev_id: $.data.id }
          assert:
            - "HealthEvaluation.${ev_id}.late_shipment_rate == 0.0439   # 136 / 3100"
            - "HealthEvaluation.${ev_id}.cancellation_rate == 0.0216   # 67 / 3100, below the 0.0250 breach line"
            - "HealthEvaluation.${ev_id}.valid_tracking_rate == 0.8815   # 2671 / 3030"
            - "HealthEvaluation.${ev_id}.order_volume_final == 3100"
            - "HealthEvaluation.${ev_id}.health_score == 84.23   # 100.00 - (12.33 + 2.39 + 0.00 + 1.05)"
            - "HealthEvaluation.${ev_id}.health_score != 84.24   # the sum-then-round reading of the same four ratios"
            - "Seller.${s_id}.health_score == 84.23"
            - "HealthEvaluation.${ev_id}.metric_tier == BREACHING   # 3 breached metrics, not the score branch (84.23 > 60.00)"

      - name: ladder_rung_read_from_post_balance_not_prior_balance
        grounds:
          - "calculations.enforcement_ladder_rung"
          - "calculations.severity_points_balance"
          - "calculations.severity_points_applied"
          - "entities.EnforcementAction.fields.ladder_rung_computed"
          - "entities.EnforcementAction.fields.removed_listing_count"
          - "state_machines.Listing.ACTIVE_to_REMOVED"
        distinguishing_aspect: |
          Mode (c): the rung is genuinely order-dependent — prior_balance is decayed at clock_now
          (2.40), this action's own points are computed from the PRE-EXISTING action set (3.50),
          and only the pinned step 4 (select from post_balance 5.90) yields LISTING_REMOVAL. The
          rejected reading that selects from prior_balance 2.40 yields WARNING and removes no
          listing, so rung, action_type, removed_listing_count and Listing.state all flip.
        test_recipe:
          setup:
            - "PolicyRule LA-ACC-1: LISTING_ACCURACY, base_severity_weight 2.80, removal_scope LISTING, requires_poa true."
            - "PolicyRule RM-FAKE-1: REVIEW_MANIPULATION, base_severity_weight 1.00, removal_scope ACCOUNT, requires_poa false."
            - "Seller with two ACTIVE listings; no health evaluation ever runs, so metric_tier stays null and no BREACHING multiplier applies."
            - "Action A1 issued at 2026-01-15T00:00:00.000Z under LA-ACC-1: applied 2.80, post_balance 2.80, rung WARNING."
            - "Action A2 issued at 2026-07-01T00:00:00.000Z under RM-FAKE-1: applied 1.00 (its own category has no prior), post_balance 3.80, rung WARNING."
            - "Clock advanced to 2026-07-14T00:00:00.000Z: A1 is exactly 180 days old so its decay factor steps to 0.50 while A2 (13 days) keeps 1.00 -> prior_balance 2.40."
            - "A third SUBSTANTIATED LISTING_ACCURACY violation cites the second listing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-ACC-1", category: "LISTING_ACCURACY", base_severity_weight: 2.80, removal_scope: "LISTING", requires_poa: true }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_la: $.data.id }
            - call: "POST /policy-rules"
              payload: { code: "RM-FAKE-1", category: "REVIEW_MANIPULATION", base_severity_weight: 1.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_rm: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Dovetail Home LLC", email: "ops@dovetail-home.example", tax_id_hash: "TAX-DO-0001", payout_bank_token: "BANK-DO-0001", address_fingerprint: "ADDR-DO-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", sku: "SKU-DO-1", title: "Oak Dining Chair", category_code: "HOME" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l1: $.data.id }
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", sku: "SKU-DO-2", title: "Oak Dining Table", category_code: "HOME" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l2: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_la}", listing_id: "${l1}", reporter_type: "BUYER", evidence_reference: "EV-DO-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED", decision_note: "Title and compatibility data did not match the shipped item." }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_rm}", reporter_type: "BUYER", evidence_reference: "EV-DO-0002" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v2: $.data.id }
            - call: "POST /violations/${v2}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v2}/adjudicate"
              payload: { outcome: "SUBSTANTIATED", decision_note: "Incentivised review solicitation confirmed in buyer messages." }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v2}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-14T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_la}", listing_id: "${l2}", reporter_type: "BUYER", evidence_reference: "EV-DO-0003" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v3: $.data.id }
            - call: "POST /violations/${v3}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v3}/adjudicate"
              payload: { outcome: "SUBSTANTIATED", decision_note: "Dimensions in the listing were wrong by 40 percent." }
              as: PolicyInvestigator
              as_user_id: "inv-1"
          trigger:
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v3}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a3: $.data.id }
          assert:
            - "EnforcementAction.${a1}.severity_points_applied == 2.80 and EnforcementAction.${a1}.ladder_rung_computed == WARNING"
            - "EnforcementAction.${a2}.severity_points_applied == 1.00 and EnforcementAction.${a2}.ladder_rung_computed == WARNING"
            - "EnforcementAction.${a3}.severity_points_applied == 3.50   # 2.80 * (1.00 + 0.25 * min(1, 3)), single rounding"
            - "Seller.${s_id}.severity_points_balance == 5.90   # prior 2.40 (A1 x 0.50 + A2 x 1.00) + 3.50"
            - "EnforcementAction.${a3}.ladder_rung_computed == LISTING_REMOVAL   # post_balance 5.90 >= 4.00; the prior_balance 2.40 reading would say WARNING"
            - "EnforcementAction.${a3}.action_type == LISTING_REMOVAL and EnforcementAction.${a3}.override_applied == false"
            - "EnforcementAction.${a3}.removed_listing_count == 1"
            - "Listing.${l2}.state == REMOVED and Listing.${l2}.removal_policy_category == LISTING_ACCURACY"
            - "Listing.${l1}.state == ACTIVE   # removal_scope LISTING touches only the cited listing"
            - "Seller.${s_id}.enforcement_state == RESTRICTED and Seller.${s_id}.disbursement_state == RESERVE_HELD"

      - name: severity_points_single_rounding_with_capped_repeat_factor
        grounds:
          - "calculations.severity_points_applied"
          - "entities.PolicyRule.fields.base_severity_weight"
          - "entities.PolicyRule.fields.decay_exempt"
          - "entities.Violation.fields.reporter_type"
          - "entities.Seller.fields.metric_tier"
        distinguishing_aspect: |
          Mode (a): one output built from four interacting inputs with a nested clamp —
          repeat_factor is min(prior_same_category, 3) so the fifth IP offense costs exactly what
          the fourth did, the IP x RIGHTS_OWNER and BREACHING multipliers stack on top, and the
          product 3.00 x 1.75 x 1.50 x 1.25 = 9.84375 is rounded EXACTLY ONCE to 9.84 (rounding
          after each factor gives 9.85; ignoring the repeat cap gives 11.25).
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule IP-CTR-1: INTELLECTUAL_PROPERTY, base_severity_weight 3.00, removal_scope ACCOUNT, requires_poa true -> decay_exempt true."
            - "Policy catalogue holds no SHIPPING_PERFORMANCE / ACCOUNT rule, so the BREACHING evaluation mints no auto-violation."
            - "Seller evaluated once from a single snapshot [2026-07-01, 2026-08-01) with order_volume 2000, delivered_or_refunded 2000, substantiated 20, late 80, shipments 2000, valid tracking 2000 -> odr_final 0.0100 and late 0.0400 both breach -> metric_tier BREACHING, health_score 100.00."
            - "Four prior SUBSTANTIATED IP violations reported by RIGHTS_OWNER, each answered by an action: applied 5.63, 7.03, 8.44, 9.84 -> severity_points_balance 30.94 (IP points never decay and the clock never moves)."
            - "The seller has no listings, so the LISTING_REMOVAL and ACCOUNT_SUSPENSION rungs of those prior actions remove and suppress nothing."
            - "A fifth SUBSTANTIATED IP violation is ready, so prior_same_category is 4 and the repeat cap of 3 bites."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
