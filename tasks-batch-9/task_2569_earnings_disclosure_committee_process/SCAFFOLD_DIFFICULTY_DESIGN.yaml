          trigger:
            - call: "POST /disclosure/documents/${doc_on_id}/tie-out-items"
              payload: { line_label: "Interest expense", reported_value: 1002.50, source_record_value: 1000.00, tolerance_bp: 25, preparer_member_id: "${fin_id}", expected_document_version: "${doc_on_v}" }
              as: Controller
