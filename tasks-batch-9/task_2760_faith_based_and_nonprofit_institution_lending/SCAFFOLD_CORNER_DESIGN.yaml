        distinguishing_aspect: "asset_type DONOR_RESTRICTED_ENDOWMENT caps the advance rate at 0.00, so even a 900000000 endowment with the most convertible alternative_use_score 5 values at exactly 0 rather than 675000000."
        test_recipe:
