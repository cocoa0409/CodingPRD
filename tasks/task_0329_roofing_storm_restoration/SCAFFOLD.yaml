    output: Inspection[]
    side_effects: []

  - method: POST
    path: "/inspections/{id}/complete"
    description: "Complete an inspection with PASS/FAIL"
    roles: [FieldAdjuster]
    code: 200
    input: [outcome, "damage_severity?"]
    output: Inspection
    side_effects: ["status -> PASSED/FAILED; PERMIT_FINAL PASS closes the issued permit"]

  # ---- Estimate ----
  - method: POST
    path: "/estimates"
    description: "Create a DRAFT estimate for a job"
    roles: [Estimator]
    code: 201
    input: [job_id, source_kind, "aerial_contingency_pct?"]
