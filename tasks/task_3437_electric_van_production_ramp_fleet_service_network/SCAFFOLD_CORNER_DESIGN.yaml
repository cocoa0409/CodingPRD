      - name: campaign_rollback_hold_blocks_commissioning
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Vehicle.delivery_status_AT_DEPOT_to_delivery_status_COMMISSIONED
          - "errors[ERR_SOFTWARE_HOLD]"
        distinguishing_aspect: "A vehicle parked AT_DEPOT keeps that state through a campaign rollback (only IN_TRANSIT recalls), but its software_hold then blocks the final COMMISSIONED step with ERR_SOFTWARE_HOLD."
        test_recipe:
          setup:
            - "Logical clock set; two-vehicle order CONFIRMED with both VINs registered; vehicle 1 telematics ACTIVE and delivery AT_DEPOT; campaign in CANARY with a SUCCESS result for vehicle 1."
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_depot
            - *c_sup
            - *c_mod1
            - *c_mod1_qa
            - *c_mod1_pass
            - *c_mod2
            - *c_mod2_qa
            - *c_mod2_pass
            - *c_order
            - *c_submit
            - *c_confirm
            - *c_veh1
            - *c_read1
            - *c_veh2
            - &c_t1p
              call: "POST /evfleet/vehicles/${veh1_id}/transition"
              payload: { dimension: "TELEMATICS", to_state: "PROVISIONED" }
              as: ServiceDispatcher
              as_user_id: "sd-1"
            - &c_t1a
              call: "POST /evfleet/vehicles/${veh1_id}/transition"
              payload: { dimension: "TELEMATICS", to_state: "ACTIVE" }
              as: ServiceDispatcher
              as_user_id: "sd-1"
            - &c_d1t
              call: "POST /evfleet/vehicles/${veh1_id}/transition"
              payload: { dimension: "DELIVERY", to_state: "IN_TRANSIT" }
              as: ServiceDispatcher
              as_user_id: "sd-1"
            - &c_d1d
              call: "POST /evfleet/vehicles/${veh1_id}/transition"
              payload: { dimension: "DELIVERY", to_state: "AT_DEPOT" }
              as: ServiceDispatcher
              as_user_id: "sd-1"
            - &c_camp
              call: "POST /evfleet/software-campaigns"
              payload: { target_version: "2.0.0", telematics_tier_scope: "ALL" }
              as: ReleaseManager
              as_user_id: "rm-1"
              captures: { camp_id: $.data.id }
            - &c_camp_canary
              call: "POST /evfleet/software-campaigns/${camp_id}/transition"
              payload: { to_state: "CANARY" }
              as: ReleaseManager
              as_user_id: "rm-1"
            - &c_camp_r1
              call: "POST /evfleet/software-campaigns/${camp_id}/vehicle-results"
              payload: { vehicle_id: "${veh1_id}", result: "SUCCESS" }
              as: TelematicsIngestion
          trigger:
            - call: "POST /evfleet/software-campaigns/${camp_id}/transition"
              payload: { to_state: "ROLLED_BACK" }
              as: ReleaseManager
              as_user_id: "rm-1"
            - call: "POST /evfleet/vehicles/${veh1_id}/transition"
              payload: { dimension: "DELIVERY", to_state: "COMMISSIONED" }
              as: ServiceDispatcher
              as_user_id: "sd-1"
              captures: { err: $.data.error_id }
          assert:
            - "after rollback, Vehicle.${veh1_id}.software_hold == true and delivery_status == AT_DEPOT (AT_DEPOT is not recalled)"
            - "err == ERR_SOFTWARE_HOLD on the COMMISSIONED attempt"
            - "Vehicle.${veh1_id}.delivery_status stays AT_DEPOT after the rejected transition"

      - name: visit_complete_from_scheduled_rejected
