        grounds:
          - state_machines.Batch.SHOPPING_to_ABANDONED
          - state_machines.Shopper.ACTIVE_to_SUSPENDED_REVIEW
          - calculations.shopper_tier_scoring
          - calculations.abandonment_customer_credit
          - calculations.shopper_commitment_ledger
          - entities.Shopper.fields.abandonment_count
          - entities.Batch.fields.declined_shopper_ids
        distinguishing_aspect: |
          Depth-4 cascade triggered by POST /batches/{id}/abandon: the abandonment raises
          abandonment_count (link 1), which re-scores the shopper into tier PROBATION (link 2),
          which moves Shopper.status to SUSPENDED_REVIEW (link 3), which system-releases a
          *different* batch the same shopper still holds (link 4) — each link caused by the
          previous one, and the released batch's system transition deliberately does not
          increment abandonment_count again so the cascade cannot re-enter itself.
