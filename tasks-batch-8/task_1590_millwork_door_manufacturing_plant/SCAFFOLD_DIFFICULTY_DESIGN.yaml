  # ==================================================================
  # Rule 7 — cross_entity_state_dependency (Program<-Drawing; Trip<-Opening)
  # ==================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: program_create_requires_approved_drawing
        grounds:
          - endpoints[POST /millwork/machining-programs]
          - state_machines.MachiningProgram.PROVEN_to_RELEASED
          - errors[ERR_DRAWING_NOT_APPROVED]
        distinguishing_aspect: |
          Entity pair (MachiningProgram, ShopDrawing): program creation and
          release both gate on drawing.status == APPROVED — a program cannot
          exist for a merely SUBMITTED drawing; after approval creation
          succeeds. Different entity pair than trip-assign below.
        test_recipe:
          setup:
            - "MAPLE order CONFIGURED with one opening; drawing D created and SUBMITTED (not yet approved)."
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "Gate Proj", site_address: "1 Draft Ln", contract_code: "C-8001" }, as: PlantManager, captures: { proj_id: $.data.id } }
