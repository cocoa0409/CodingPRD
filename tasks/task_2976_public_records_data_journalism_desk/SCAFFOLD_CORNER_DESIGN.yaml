            - call: "POST /records-desk/analysis-runs"
              payload: { investigation_id: "${inv_id}", code_repo_ref: "git@desk/occ", code_commit_sha: "4444444444444444444444444444444444444444", container_digest: "sha256:4444444444444444444444444444444444444444444444444444444444444444", compute_cost_cents: 5000, labor_hours: 1.0, expected_investigation_version: "${inv_v2}" }
