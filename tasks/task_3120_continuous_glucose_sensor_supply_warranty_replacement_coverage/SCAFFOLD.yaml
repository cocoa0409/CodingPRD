scenario: |
  Continuous Glucose Sensor Supply, Warranty Replacement & Coverage (Abbott):
  prescription-based sensor supply with pharmacy versus durable medical equipment
  benefit routing differences, coverage criteria verification including diagnosis,
  insulin use and documentation requirements, sensor warranty replacement claims
  for early failure with device data review and shipment, reader and application
  pairing with sensor serial activation and one-active-sensor rules, refill
  cadence aligned to sensor wear time with early-refill rejection logic, patient
  support enrollment with savings card application where permitted, adverse
  event reporting and lot-level complaint trending, transition between sensor
  generations with compatibility constraints

domain_name: cgm-supply-warranty
api_prefix: /cgm

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patient legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD)" }
      - { name: state_code, type: string, source: input, description: "US state for savings-card eligibility gating" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DECEASED | TRANSFERRED_OUT", constraints: "enum" }

  - name: Prescriber
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Prescriber name" }
      - { name: npi, type: string, source: input, description: "National Provider Identifier (10 digits)" }
      - { name: specialty, type: enum, source: input, description: "ENDOCRINOLOGY | PRIMARY_CARE | OTHER" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }

  - name: Payer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Payer display name" }
      - { name: plan_code, type: string, source: input, description: "Unique plan identifier" }
      - { name: benefit_route, type: enum, source: input, description: "PHARMACY | DME — drives adjudication variant" }
      - { name: cgm_coverage_policy, type: enum, source: input, description: "STRICT | STANDARD | LENIENT — controls which coverage criteria are mandatory" }
      - { name: pharmacy_copay_pct, type: number, source: input, description: "Patient coinsurance fraction under PHARMACY route (0..1)" }
      - { name: dme_coinsurance_pct, type: number, source: input, description: "Patient coinsurance fraction under DME route (0..1)" }
      - { name: deductible_cap_cents, type: integer, source: input, description: "Plan-year deductible cap applied before coinsurance" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | TERMINATED" }

  - name: SensorProduct
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Manufacturer SKU, unique" }
      - { name: generation, type: integer, source: input, description: "Sensor generation number (e.g., 2, 3)" }
      - { name: wear_days, type: integer, source: input, description: "Labeled wear duration in days (e.g., 14)" }
      - { name: reader_channel, type: enum, source: input, description: "READER | APP | HYBRID — which binding channels are permitted" }
      - { name: compatible_prior_generations, type: array, source: input, description: "Generations whose readers/apps can be reused; empty means strict gen-match" }
      - { name: list_price_cents, type: integer, source: input, description: "List price per sensor unit" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DISCONTINUED" }

  - name: SensorLot
    parent: SensorProduct
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> SensorProduct.id; lot's product" }
      - { name: lot_code, type: string, source: input, description: "Manufacturer lot code; unique per product" }
      - { name: quantity_manufactured, type: integer, source: input, description: "Total units released into this lot" }
      - { name: complaint_count, type: integer, source: computed, default: 0, description: "Cumulative count of AdverseEventReport rows referencing this lot" }
      - { name: complaint_posture, type: enum, source: computed, default: NORMAL, description: "NORMAL | WATCH | HOLD — derived from complaint_count vs thresholds" }
      - { name: manufacture_date, type: string, source: input, description: "ISO 8601 date" }
      - { name: expiry_date, type: string, source: input, description: "ISO 8601 date; expiry_date > manufacture_date" }

  - name: Prescription
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; prescribed patient" }
      - { name: prescriber_id, type: string, source: input, description: "FK -> Prescriber.id" }
      - { name: product_id, type: string, source: input, description: "FK -> SensorProduct.id; prescribed sensor product" }
      - { name: diagnosis_code, type: string, source: input, description: "ICD-10 code (e.g., E11.9, E10.9, O24.415)" }
      - { name: insulin_use, type: enum, source: input, description: "INTENSIVE | BASAL_ONLY | NONE — drives STRICT coverage criteria" }
      - { name: documentation_attached, type: boolean, source: input, description: "True if chart notes / CGM-justifying documentation attached" }
      - { name: quantity_per_fill, type: integer, source: input, description: "Sensors dispensed per fill (1..6)" }
      - { name: fills_authorized, type: integer, source: input, description: "Total fills authorized (1..24)" }
      - { name: fills_consumed, type: integer, source: computed, default: 0, description: "Fills already dispensed under this prescription" }
      - { name: written_on, type: string, source: input, description: "ISO 8601 date the prescription was written" }
      - { name: expires_on, type: string, source: computed, description: "= written_on + 365 days; prescriptions are valid for 1 year" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | EXHAUSTED | EXPIRED | CANCELLED" }

  - name: CoverageVerification
    parent: Prescription
    common_fields: true
    fields:
      - { name: prescription_id, type: string, source: input, description: "FK -> Prescription.id" }
      - { name: patient_id, type: string, source: computed, description: "FK -> Patient.id; denormalized from prescription at creation" }
      - { name: payer_id, type: string, source: input, description: "FK -> Payer.id" }
      - { name: run_at, type: datetime, source: system, description: "Server timestamp when verification ran" }
      - { name: benefit_route, type: enum, source: computed, description: "PHARMACY | DME — copied from Payer at run time, frozen on the verification" }
      - { name: criteria_diagnosis_met, type: boolean, source: computed, description: "Per payer coverage_policy evaluation of diagnosis_code" }
      - { name: criteria_insulin_met, type: boolean, source: computed, description: "Per payer coverage_policy evaluation of insulin_use" }
      - { name: criteria_documentation_met, type: boolean, source: computed, description: "Per payer coverage_policy evaluation of documentation_attached" }
      - { name: decision, type: enum, source: system, description: "PENDING | APPROVED | DENIED" }
      - { name: denial_reason, type: enum, source: system, description: "null | DIAGNOSIS_NOT_COVERED | INSUFFICIENT_INSULIN_USE | MISSING_DOCUMENTATION | PAYER_INACTIVE", default: null }

  - name: SensorUnit
    parent: SensorLot
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> SensorLot.id" }
      - { name: serial_number, type: string, source: input, description: "Unique serial across the system" }
      - { name: status, type: enum, source: system, default: IN_STOCK, description: "IN_STOCK | ALLOCATED | SHIPPED | IN_HAND | ACTIVE | EXPIRED_WORN | FAILED_EARLY | REPLACED | SCRAPPED" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; null until allocated" }
      - { name: activated_on, type: string, source: system, description: "ISO 8601 date of activation; null until ACTIVE" }
      - { name: failed_on, type: string, source: system, description: "ISO 8601 date of early failure; null unless FAILED_EARLY" }
      - { name: wear_days_used, type: integer, source: computed, default: 0, description: "Days from activated_on to failed_on (or current logical date if still ACTIVE), inclusive-exclusive" }

  - name: SensorOrder
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: prescription_id, type: string, source: input, description: "FK -> Prescription.id" }
      - { name: coverage_verification_id, type: string, source: input, description: "FK -> CoverageVerification.id; must be APPROVED" }
      - { name: lot_id, type: string, source: input, description: "FK -> SensorLot.id; lot the units are picked from" }
      - { name: quantity, type: integer, source: input, description: "Sensors in this order; must equal prescription.quantity_per_fill" }
      - { name: fulfillment_status, type: enum, source: system, default: PENDING_PICK, description: "PENDING_PICK | PICKED | SHIPPED | DELIVERED | CANCELLED" }
      - { name: billing_status, type: enum, source: system, default: UNBILLED, description: "UNBILLED | ADJUDICATED | PAID | REVERSED" }
      - { name: fill_date, type: string, source: system, description: "Logical date on which the order was created" }
      - { name: earliest_refill_date, type: string, source: computed, description: "Computed per refill_cadence_rule; enforced on next order creation" }
      - { name: allowed_amount_cents, type: integer, source: computed, description: "Plan allowed amount, computed at adjudication" }
      - { name: plan_paid_cents, type: integer, source: computed, default: 0, description: "Plan responsibility after deductible+coinsurance" }
      - { name: patient_paid_cents, type: integer, source: computed, default: 0, description: "Patient responsibility after savings card" }
      - { name: savings_card_paid_cents, type: integer, source: computed, default: 0, description: "Manufacturer savings-card contribution" }

  - name: DeviceBinding
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: sensor_unit_id, type: string, source: input, description: "FK -> SensorUnit.id; the unit being activated" }
      - { name: channel, type: enum, source: input, description: "READER | APP" }
      - { name: activated_at, type: datetime, source: system, description: "Server timestamp on activation" }
      - { name: expires_at, type: datetime, source: computed, description: "= activated_at + product.wear_days" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | ENDED_NORMALLY | ENDED_EARLY_FAILURE | SUPERSEDED" }

  - name: WarrantyClaim
    parent: SensorUnit
    common_fields: true
    fields:
      - { name: sensor_unit_id, type: string, source: input, description: "FK -> SensorUnit.id; the failed unit" }
      - { name: patient_id, type: string, source: computed, description: "FK -> Patient.id; copied from unit allocation" }
      - { name: reported_failure_day_index, type: integer, source: input, description: "0-indexed day of wear when failure reported (0 = activation day)" }
      - { name: failure_category, type: enum, source: input, description: "NO_READINGS | INACCURATE | ADHESIVE_FAILURE | SENSOR_ERROR | OTHER" }
      - { name: device_data_attached, type: boolean, source: input, description: "True if patient uploaded device log" }
      - { name: review_notes, type: string, source: input, description: "Reviewer notes; required on REVIEWER decisions", default: "" }
      - { name: replacement_credit_cents, type: integer, source: computed, default: 0, description: "Computed per warranty_credit_rule" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | DATA_REVIEW | MORE_INFO_REQUESTED | APPROVED | DENIED | CLOSED" }

  - name: ReplacementShipment
    parent: WarrantyClaim
    common_fields: true
    fields:
      - { name: warranty_claim_id, type: string, source: input, description: "FK -> WarrantyClaim.id" }
      - { name: replacement_sensor_unit_id, type: string, source: computed, description: "FK -> SensorUnit.id; allocated on approval" }
      - { name: shipped_on, type: string, source: system, description: "Logical ship date" }
      - { name: status, type: enum, source: system, default: PENDING_SHIP, description: "PENDING_SHIP | SHIPPED | DELIVERED | CANCELLED" }

  - name: SupportEnrollment
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: payer_id, type: string, source: input, description: "FK -> Payer.id; savings-card rules apply only to commercial payers" }
      - { name: savings_card_number, type: string, source: system, description: "Server-minted card number" }
      - { name: card_max_per_fill_cents, type: integer, source: input, description: "Max card contribution per fill" }
      - { name: card_remaining_cents, type: integer, source: computed, description: "Remaining annual card balance; decremented on adjudication" }
      - { name: status, type: enum, source: system, default: ENROLLED, description: "ENROLLED | SUSPENDED | TERMINATED" }

  - name: AdverseEventReport
    parent: SensorLot
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> SensorLot.id" }
      - { name: sensor_unit_id, type: string, source: input, description: "FK -> SensorUnit.id" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL" }
      - { name: event_type, type: enum, source: input, description: "SKIN_IRRITATION | INACCURACY_HARM | SENSOR_DETACHED | ALLERGIC_REACTION | OTHER" }
      - { name: reported_on, type: string, source: system, description: "Logical report date" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | INVESTIGATING | CLOSED_SUBSTANTIATED | CLOSED_UNSUBSTANTIATED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Prescription
    initial_state: ACTIVE
    terminal_states: [EXHAUSTED, EXPIRED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system auto-transition when fills_consumed == fills_authorized (on SensorOrder creation)"
        actor: system
        preconditions: ["prescription.status == ACTIVE", "fills_consumed increments to fills_authorized"]
        side_effects: ["Prescription.updated_at refreshed", "Prescription.version += 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system auto-transition when logical clock passes expires_on"
        actor: system
        preconditions: ["logical_now > expires_on"]
        side_effects: ["Pending CoverageVerifications for this prescription move PENDING → DENIED with denial_reason=PAYER_INACTIVE only if payer is also TERMINATED; otherwise decision stays PENDING but is unusable"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /cgm/prescriptions/{id}/cancel"
        actor: Prescriber
        preconditions:
          - "prescription.status == ACTIVE (ERR_PRESCRIPTION_NOT_ACTIVE)"
          - "acting Prescriber.id == prescription.prescriber_id (ERR_PRESCRIPTION_OWNER_MISMATCH)"
        side_effects: ["Any PENDING_PICK SensorOrder for this prescription auto-transitions to CANCELLED"]

  - entity: CoverageVerification
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /cgm/coverage-verifications/{id}/decide with decision=APPROVED"
        actor: CoverageReviewer
        preconditions:
          - "verification.decision == PENDING (ERR_VERIFICATION_ALREADY_DECIDED)"
          - "payer.status == ACTIVE (ERR_PAYER_NOT_ACTIVE)"
          - "All criteria booleans must be true OR payer.cgm_coverage_policy == LENIENT (in which case missing documentation may be waived but diagnosis and insulin criteria must still hold; ERR_COVERAGE_CRITERIA_NOT_MET otherwise)"
        side_effects:
          - "verification.benefit_route frozen from payer at run time"
          - "verification.version += 1"
      - from: PENDING
        to: DENIED
        trigger: "POST /cgm/coverage-verifications/{id}/decide with decision=DENIED"
        actor: CoverageReviewer
        preconditions: ["verification.decision == PENDING"]
        side_effects: ["denial_reason recorded from request body"]

  - entity: SensorOrder
    initial_state: PENDING_PICK
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: PENDING_PICK
        to: PICKED
        trigger: "POST /cgm/sensor-orders/{id}/pick"
        actor: FulfillmentAgent
        preconditions:
          - "fulfillment_status == PENDING_PICK (ERR_ORDER_NOT_PICKABLE)"
          - "lot.complaint_posture != HOLD (ERR_LOT_ON_HOLD)"
          - "lot has >= quantity units in IN_STOCK status (ERR_INSUFFICIENT_LOT_STOCK)"
        side_effects:
          - "Allocate `quantity` SensorUnits from lot (status IN_STOCK → ALLOCATED), selected by earliest manufacture_date ASC then serial_number ASC"
          - "Set SensorUnit.patient_id = order.patient_id for each allocated unit"
          - "Prescription.fills_consumed += 1; if fills_consumed == fills_authorized, prescription auto-transitions ACTIVE → EXHAUSTED"
      - from: PICKED
        to: SHIPPED
        trigger: "POST /cgm/sensor-orders/{id}/ship"
        actor: FulfillmentAgent
        preconditions:
          - "fulfillment_status == PICKED (ERR_ORDER_NOT_SHIPPABLE)"
          - "billing_status == ADJUDICATED (ERR_ORDER_NOT_ADJUDICATED)"
        side_effects: ["Allocated SensorUnits ALLOCATED → SHIPPED"]
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /cgm/sensor-orders/{id}/deliver"
        actor: FulfillmentAgent
        preconditions: ["fulfillment_status == SHIPPED (ERR_ORDER_NOT_DELIVERABLE)"]
        side_effects: ["SensorUnits SHIPPED → IN_HAND"]
      - from: PENDING_PICK
        to: CANCELLED
        trigger: "POST /cgm/sensor-orders/{id}/cancel OR cascade from prescription cancel"
        actor: FulfillmentAgent
        preconditions: ["fulfillment_status == PENDING_PICK (ERR_ORDER_NOT_CANCELLABLE)"]
        side_effects: ["None — no units allocated yet at PENDING_PICK"]

  - entity: SensorOrder.billing_status
    initial_state: UNBILLED
    terminal_states: [PAID, REVERSED]
    transitions:
      - from: UNBILLED
        to: ADJUDICATED
        trigger: "POST /cgm/sensor-orders/{id}/adjudicate"
        actor: BillingAgent
        preconditions:
          - "billing_status == UNBILLED (ERR_ORDER_ALREADY_ADJUDICATED)"
          - "fulfillment_status in {PENDING_PICK, PICKED} (ERR_ORDER_NOT_ADJUDICATABLE_STATE)"
        side_effects:
          - "Run benefit_adjudication_rule (variant chosen by verification.benefit_route)"
          - "Run savings_card_application_rule if active SupportEnrollment exists"
          - "Persist plan_paid_cents, patient_paid_cents, savings_card_paid_cents on order"
      - from: ADJUDICATED
        to: PAID
        trigger: "POST /cgm/sensor-orders/{id}/mark-paid"
        actor: BillingAgent
        preconditions: ["billing_status == ADJUDICATED (ERR_ORDER_NOT_PAID_STATE)"]
        side_effects: ["Decrement SupportEnrollment.card_remaining_cents by savings_card_paid_cents"]
      - from: ADJUDICATED
        to: REVERSED
        trigger: "POST /cgm/sensor-orders/{id}/reverse"
        actor: BillingAgent
        preconditions:
          - "billing_status == ADJUDICATED (ERR_ORDER_NOT_REVERSIBLE)"
          - "fulfillment_status in {PENDING_PICK, PICKED} — cannot reverse after ship"
        side_effects:
          - "Zero out plan_paid_cents, patient_paid_cents, savings_card_paid_cents on the order"
          - "If fulfillment_status == PICKED: allocated units revert ALLOCATED → IN_STOCK and clear patient_id"
          - "Prescription.fills_consumed -= 1; if prescription was EXHAUSTED and fills_consumed < fills_authorized, revert to ACTIVE"

  - entity: SensorUnit
    initial_state: IN_STOCK
    terminal_states: [EXPIRED_WORN, REPLACED, SCRAPPED]
    transitions:
      - from: IN_STOCK
        to: ALLOCATED
        trigger: "Cascade from SensorOrder pick"
        actor: system
        preconditions: ["unit.lot_id == order.lot_id", "unit.status == IN_STOCK"]
        side_effects: ["unit.patient_id set"]
      - from: ALLOCATED
        to: SHIPPED
        trigger: "Cascade from SensorOrder ship"
        actor: system
        preconditions: ["unit.status == ALLOCATED"]
        side_effects: []
      - from: SHIPPED
        to: IN_HAND
        trigger: "Cascade from SensorOrder deliver"
        actor: system
        preconditions: ["unit.status == SHIPPED"]
        side_effects: []
      - from: IN_HAND
        to: ACTIVE
        trigger: "Cascade from DeviceBinding activation"
        actor: system
        preconditions: ["unit.status == IN_HAND", "unit.patient_id == binding.patient_id"]
        side_effects: ["unit.activated_on set to logical date"]
      - from: ACTIVE
        to: EXPIRED_WORN
        trigger: "system auto-transition when logical date > activated_on + product.wear_days"
        actor: system
        preconditions: ["logical_now > binding.expires_at"]
        side_effects: ["Linked DeviceBinding transitions ACTIVE → ENDED_NORMALLY"]
      - from: ACTIVE
        to: FAILED_EARLY
        trigger: "POST /cgm/sensor-units/{id}/report-early-failure"
        actor: Patient
        preconditions:
          - "unit.status == ACTIVE (ERR_UNIT_NOT_ACTIVE)"
          - "X-User-ID == unit.patient_id (ERR_UNIT_OWNER_MISMATCH)"
        side_effects:
          - "unit.failed_on = logical date"
          - "unit.wear_days_used = (failed_on - activated_on).days"
          - "Linked DeviceBinding transitions ACTIVE → ENDED_EARLY_FAILURE"
      - from: FAILED_EARLY
        to: REPLACED
        trigger: "Cascade from ReplacementShipment deliver"
        actor: system
        preconditions: ["unit.status == FAILED_EARLY"]
        side_effects: ["None — terminal marker for replaced unit"]
      - from: FAILED_EARLY
        to: SCRAPPED
        trigger: "POST /cgm/sensor-units/{id}/scrap"
        actor: QualityEngineer
        preconditions: ["unit.status == FAILED_EARLY", "no OPEN or INVESTIGATING AdverseEventReport references this unit"]
        side_effects: []

  - entity: DeviceBinding
    initial_state: ACTIVE
    terminal_states: [ENDED_NORMALLY, ENDED_EARLY_FAILURE, SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: ENDED_NORMALLY
        trigger: "Cascade from SensorUnit ACTIVE → EXPIRED_WORN"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: ENDED_EARLY_FAILURE
        trigger: "Cascade from SensorUnit ACTIVE → FAILED_EARLY"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "Cascade when patient activates a replacement SensorUnit from an APPROVED WarrantyClaim while an old binding is still ACTIVE"
        actor: system
        preconditions: ["old binding.sensor_unit_id in {FAILED_EARLY, ACTIVE}", "new binding references a SensorUnit whose WarrantyClaim.status == APPROVED"]
        side_effects: ["old SensorUnit (if still ACTIVE) transitions ACTIVE → REPLACED"]

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, CLOSED]
    transitions:
      - from: SUBMITTED
        to: DATA_REVIEW
        trigger: "POST /cgm/warranty-claims/{id}/begin-review"
        actor: WarrantyReviewer
        preconditions:
          - "claim.status == SUBMITTED (ERR_CLAIM_NOT_SUBMITTED)"
          - "claim.device_data_attached == true (ERR_DEVICE_DATA_REQUIRED)"
        side_effects: []
      - from: DATA_REVIEW
        to: MORE_INFO_REQUESTED
        trigger: "POST /cgm/warranty-claims/{id}/request-more-info"
        actor: WarrantyReviewer
        preconditions: ["claim.status == DATA_REVIEW"]
        side_effects: []
      - from: MORE_INFO_REQUESTED
        to: DATA_REVIEW
        trigger: "POST /cgm/warranty-claims/{id}/resubmit-data with device_data_attached=true"
        actor: Patient
        preconditions: ["claim.status == MORE_INFO_REQUESTED", "X-User-ID == claim.patient_id"]
        side_effects: []
      - from: DATA_REVIEW
        to: APPROVED
        trigger: "POST /cgm/warranty-claims/{id}/decide with decision=APPROVED"
        actor: WarrantyReviewer
        preconditions:
          - "claim.status == DATA_REVIEW (ERR_CLAIM_NOT_IN_REVIEW)"
          - "claim.reported_failure_day_index < product.wear_days (ERR_NOT_EARLY_FAILURE) — must be EARLY failure (strict less-than)"
          - "review_notes must be non-empty (>=10 chars) on decision"
        side_effects:
          - "replacement_credit_cents computed per warranty_credit_rule (pro-rata vs flat variant)"
          - "ReplacementShipment created (PENDING_SHIP); one SensorUnit allocated from same-product lot with complaint_posture == NORMAL; tie-break: earliest manufacture_date, then serial_number ASC"
          - "Replacement unit transitions IN_STOCK → ALLOCATED with patient_id = claim.patient_id"
      - from: DATA_REVIEW
        to: DENIED
        trigger: "POST /cgm/warranty-claims/{id}/decide with decision=DENIED"
        actor: WarrantyReviewer
        preconditions: ["claim.status == DATA_REVIEW"]
        side_effects: ["review_notes recorded"]
      - from: DENIED
        to: CLOSED
        trigger: "POST /cgm/warranty-claims/{id}/close"
        actor: WarrantyReviewer
        preconditions: ["claim.status == DENIED"]
        side_effects: []

  - entity: ReplacementShipment
    initial_state: PENDING_SHIP
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: PENDING_SHIP
        to: SHIPPED
        trigger: "POST /cgm/replacement-shipments/{id}/ship"
        actor: FulfillmentAgent
        preconditions: ["shipment.status == PENDING_SHIP"]
        side_effects: ["replacement_sensor_unit_id unit: ALLOCATED → SHIPPED"]
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /cgm/replacement-shipments/{id}/deliver"
        actor: FulfillmentAgent
        preconditions: ["shipment.status == SHIPPED"]
        side_effects:
          - "replacement unit: SHIPPED → IN_HAND"
          - "original failed unit: FAILED_EARLY → REPLACED (compensation marker)"
      - from: PENDING_SHIP
        to: CANCELLED
        trigger: "POST /cgm/replacement-shipments/{id}/cancel"
        actor: WarrantyReviewer
        preconditions: ["shipment.status == PENDING_SHIP"]
        side_effects: ["replacement unit: ALLOCATED → IN_STOCK, patient_id cleared", "parent WarrantyClaim → CLOSED"]

  - entity: AdverseEventReport
    initial_state: OPEN
    terminal_states: [CLOSED_SUBSTANTIATED, CLOSED_UNSUBSTANTIATED]
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /cgm/adverse-event-reports/{id}/investigate"
        actor: QualityEngineer
        preconditions: ["report.status == OPEN"]
        side_effects: []
      - from: INVESTIGATING
        to: CLOSED_SUBSTANTIATED
        trigger: "POST /cgm/adverse-event-reports/{id}/close with outcome=SUBSTANTIATED"
        actor: QualityEngineer
        preconditions: ["report.status == INVESTIGATING"]
        side_effects: ["SensorLot.complaint_count += 1; lot complaint_posture recomputed per lot_complaint_posture_rule; if posture crosses to HOLD, freeze in-flight SensorOrders per cascade"]
      - from: INVESTIGATING
        to: CLOSED_UNSUBSTANTIATED
        trigger: "POST /cgm/adverse-event-reports/{id}/close with outcome=UNSUBSTANTIATED"
        actor: QualityEngineer
        preconditions: ["report.status == INVESTIGATING"]
        side_effects: ["None — complaint_count only counts SUBSTANTIATED closures"]

  - entity: SensorLot
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: WATCH
        trigger: "system auto-transition on complaint_posture recompute (complaint_count crosses WATCH_THRESHOLD)"
        actor: system
        preconditions: ["complaint_count >= WATCH_THRESHOLD (3) AND complaint_count < HOLD_THRESHOLD (7)"]
        side_effects: []
      - from: WATCH
        to: HOLD
        trigger: "system auto-transition on complaint_posture recompute"
        actor: system
        preconditions: ["complaint_count >= HOLD_THRESHOLD (7)"]
        side_effects: ["All SensorOrders on this lot in fulfillment_status == PENDING_PICK are blocked from pick (ERR_LOT_ON_HOLD) until posture returns to WATCH or NORMAL"]
      - from: HOLD
        to: WATCH
        trigger: "POST /cgm/sensor-lots/{id}/downgrade-posture (manual override by QualityEngineer after remediation)"
        actor: QualityEngineer
        preconditions: ["lot.complaint_posture == HOLD", "review_notes attached"]
        side_effects: []
      - from: WATCH
        to: NORMAL
        trigger: "POST /cgm/sensor-lots/{id}/downgrade-posture"
        actor: QualityEngineer
        preconditions: ["lot.complaint_posture == WATCH"]
        side_effects: []

  - entity: SupportEnrollment
    initial_state: ENROLLED
    terminal_states: [TERMINATED]
    transitions:
      - from: ENROLLED
        to: SUSPENDED
        trigger: "POST /cgm/support-enrollments/{id}/suspend"
        actor: PatientSupportAgent
        preconditions: ["enrollment.status == ENROLLED"]
        side_effects: ["Savings card no longer applied to adjudication while SUSPENDED"]
      - from: SUSPENDED
        to: ENROLLED
        trigger: "POST /cgm/support-enrollments/{id}/reinstate"
        actor: PatientSupportAgent
        preconditions: ["enrollment.status == SUSPENDED"]
        side_effects: []
      - from: ENROLLED
        to: TERMINATED
        trigger: "POST /cgm/support-enrollments/{id}/terminate"
        actor: PatientSupportAgent
        preconditions: ["enrollment.status in {ENROLLED, SUSPENDED}"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: prescription-renew-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /cgm/patients/{id}/prescriptions"
    occ_field: "expected_patient_version"
    description: |
      Creating a new Prescription against a Patient whose version has advanced
      since the prescriber last observed it is rejected. Captures the case where
      another writer has just modified the Patient (e.g., a state_code change
      affecting savings-card eligibility, or a status flip to DECEASED) and the
      prescriber's snapshot is therefore stale.
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412

  - rule_id: adjudicate-stale-order
    parent_entity: SensorOrder
    write_endpoint: "POST /cgm/sensor-orders/{id}/adjudicate"
    occ_field: "expected_order_version"
    description: |
      Adjudicating an order whose version has advanced since the billing agent
      last observed it is rejected. Captures the case where a fulfillment agent
      has just picked the order (which mutates fulfillment_status and bumps
      order.version) and the agent's view of pre-pick billing state is stale.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: benefit_adjudication_rule
    trigger: "SensorOrder transitions UNBILLED → ADJUDICATED"
    algorithm: tiered_pricing
    formula: |
      # Inputs: order (quantity, unit list_price from product),
      #         payer (benefit_route, pharmacy_copay_pct, dme_coinsurance_pct,
      #                deductible_cap_cents),
      #         patient_year_deductible_used_cents (accumulator; starts at 0 per
      #         plan-year for this benchmark, single-order scope assumed).
      #
      # allowed_amount_cents = quantity * product.list_price_cents
      #
      # PHARMACY variant:
      #   deductible_remaining_cents = max(0, payer.deductible_cap_cents - patient_year_deductible_used_cents)
      #   deductible_applied_cents   = min(allowed_amount_cents, deductible_remaining_cents)
      #   coinsurance_base_cents     = allowed_amount_cents - deductible_applied_cents
      #   patient_coinsurance_cents  = floor(coinsurance_base_cents * payer.pharmacy_copay_pct)
      #   patient_paid_cents         = deductible_applied_cents + patient_coinsurance_cents
      #   plan_paid_cents            = allowed_amount_cents - patient_paid_cents
      #
      # DME variant:
      #   deductible_applied_cents   = 0  (DME benefit bypasses pharmacy deductible)
      #   patient_coinsurance_cents  = floor(allowed_amount_cents * payer.dme_coinsurance_pct)
      #   patient_paid_cents         = patient_coinsurance_cents
      #   plan_paid_cents            = allowed_amount_cents - patient_paid_cents
      #
      # PINNED ROUNDING ORDER: per-line floor at the line level (each sensor unit
      # priced separately), THEN summed. Each unit contributes
      # floor(list_price_cents * copay_pct). This is the (b)-mode nested-rounding
      # variant: "round per-line-item then sum", NOT "sum then round".
    input_set: "SensorOrder being adjudicated, its CoverageVerification (APPROVED), Payer, SensorProduct"
    constants:
      PER_LINE_ROUNDING: floor
      DEDUCTIBLE_BYPASS_FOR_DME: true
    precision: "integer cents; floor per line, then sum"
    variants:
      - name: pharmacy_route
        when: "verification.benefit_route == PHARMACY"
        difference: "applies deductible first, then pharmacy_copay_pct on the remainder"
      - name: dme_route
        when: "verification.benefit_route == DME"
        difference: "skips deductible entirely, applies dme_coinsurance_pct to full allowed amount"

  - name: savings_card_application_rule
    trigger: "After benefit_adjudication_rule on the same order"
    algorithm: waterfall_allocation
    formula: |
      # Inputs: order.patient_paid_cents (output of adjudication),
      #         enrollment.card_remaining_cents,
      #         enrollment.card_max_per_fill_cents.
      #
      # Eligible iff enrollment.status == ENROLLED
      #              AND payer.benefit_route == PHARMACY
      #                 (DME claims are not eligible for manufacturer card
      #                  under this benchmark's policy)
      #              AND patient.state_code NOT IN {"MA", "CA", "WA"}
      #                 (state-law exclusions)
      #
      # savings_card_paid_cents =
      #   min(patient_paid_cents, card_max_per_fill_cents, card_remaining_cents)
      # patient_paid_cents       = patient_paid_cents - savings_card_paid_cents
      # (decrement of card_remaining_cents deferred to mark-paid transition)
    input_set: "SensorOrder being adjudicated, active SupportEnrollment (if any), Patient, Payer"
    constants:
      EXCLUDED_STATES: ["MA", "CA", "WA"]
      ELIGIBLE_ROUTE: PHARMACY
    precision: "integer cents"
    variants: []

  - name: refill_cadence_rule
    trigger: "SensorOrder creation — gates whether the order is allowed at the current logical date"
    algorithm: threshold
    formula: |
      # Inputs: prior order for the same prescription with the LATEST fill_date,
      #         product.wear_days, prescription.quantity_per_fill,
      #         EARLY_REFILL_TOLERANCE_FRACTION.
      #
      # A prescription's fill cadence is anchored on the most recent prior
      # order (any billing/fulfillment status other than CANCELLED counts).
      #
      # supply_days           = quantity_per_fill * product.wear_days
      # earliest_refill_date  = prior.fill_date + ceil(supply_days * (1 - EARLY_REFILL_TOLERANCE_FRACTION))
      #
      # If no prior order exists for this prescription: allowed at any date.
      #
      # The check is inclusive: refill is permitted when
      #   logical_date >= earliest_refill_date
      # Rejection boundary is at logical_date == earliest_refill_date - 1.
    input_set: "All non-CANCELLED SensorOrders for the prescription; product; prescription"
    constants:
      EARLY_REFILL_TOLERANCE_FRACTION: 0.25
    precision: "calendar days, integer; ceil on the multiplication"
    variants: []

  - name: warranty_credit_rule
    trigger: "WarrantyClaim transitions DATA_REVIEW → APPROVED"
    algorithm: tiered_pricing
    formula: |
      # Inputs: claim.reported_failure_day_index, product.wear_days,
      #         product.list_price_cents, product.generation.
      #
      # PRO_RATA variant (default for generation >= 3):
      #   wear_days_used        = reported_failure_day_index + 1   # failure day itself counts
      #   unused_fraction       = max(0, (product.wear_days - wear_days_used) / product.wear_days)
      #   replacement_credit    = floor(product.list_price_cents * unused_fraction)
      #
      # FLAT_REPLACEMENT variant (legacy, applies when generation < 3):
      #   replacement_credit    = product.list_price_cents        # full unit credit regardless of wear
      #
      # Both variants return integer cents. The two variants produce different
      # values for identical inputs whenever wear_days_used > 0 and generation
      # straddles the boundary — this is the dual-variant pair on WarrantyClaim.
    input_set: "WarrantyClaim being approved; SensorProduct of the failed unit"
    constants:
      PRO_RATA_MIN_GENERATION: 3
    precision: "integer cents; floor on multiplication"
    variants:
      - name: pro_rata
        when: "product.generation >= 3"
        difference: "credit scales by unused wear fraction"
      - name: flat_replacement
        when: "product.generation < 3"
        difference: "full list-price credit regardless of wear_days_used"

  - name: lot_complaint_posture_rule
    trigger: "AdverseEventReport closes as SUBSTANTIATED; also re-evaluated on lot downgrade-posture"
    algorithm: threshold
    formula: |
      # complaint_count counts only AdverseEventReport rows in CLOSED_SUBSTANTIATED
      # status that reference this lot. (OPEN and INVESTIGATING reports do NOT
      # contribute; CLOSED_UNSUBSTANTIATED does not contribute.)
      #
      # complaint_posture =
      #   HOLD   if complaint_count >= HOLD_THRESHOLD
      #   WATCH  if complaint_count >= WATCH_THRESHOLD  (and < HOLD_THRESHOLD)
      #   NORMAL otherwise
      #
      # Boundary is inclusive-at-threshold (>=), so complaint_count == 3 lands
      # in WATCH (not NORMAL) and complaint_count == 7 lands in HOLD (not WATCH).
    input_set: "All AdverseEventReport rows for the lot"
    constants:
      WATCH_THRESHOLD: 3
      HOLD_THRESHOLD: 7
    precision: "integer count"
    variants: []

  - name: wear_days_used_rule
    trigger: "SensorUnit transitions ACTIVE → FAILED_EARLY (and on every read of wear_days_used while ACTIVE)"
    algorithm: chronological
    formula: |
      # wear_days_used = (failed_on - activated_on).days
      # where both dates are logical calendar dates (YYYY-MM-DD) and the
      # difference is in whole days. A unit activated on D and failed on D
      # has wear_days_used == 0; failed on D+1 has wear_days_used == 1.
      #
      # Note: this differs from warranty_credit_rule's wear_days_used input
      # which uses (reported_failure_day_index + 1). The two are NOT the same
      # quantity — reported_failure_day_index is patient-reported and may
      # diverge from the server-computed calendar delta; the credit rule
      # intentionally uses the patient-reported index.
    input_set: "SensorUnit being transitioned"
    constants: {}
    precision: "integer days"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-template resources exist (resolved left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "All body-referenced FK resources exist (prescription_id, payer_id, lot_id, sensor_unit_id, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: state
    check: "Target resource is in a status from which the requested transition is valid"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 6
    category: business_safety
    check: "SensorLot.complaint_posture != HOLD when picking a SensorOrder on that lot"
    error_id: ERR_LOT_ON_HOLD
    http_status: 409
    applies_to: ["POST /cgm/sensor-orders/{id}/pick"]

  - priority: 7
    category: business_safety
    check: "Payer.status == ACTIVE when running or approving a CoverageVerification on that payer"
    error_id: ERR_PAYER_NOT_ACTIVE
    http_status: 409
    applies_to: ["POST /cgm/coverage-verifications", "POST /cgm/coverage-verifications/{id}/decide"]

  - priority: 8
    category: business_safety
    check: "Coverage criteria per payer.cgm_coverage_policy: STRICT requires all three of {diagnosis in COVERED_DIAGNOSES, insulin_use == INTENSIVE, documentation_attached == true}; STANDARD requires diagnosis AND (insulin INTENSIVE or BASAL_ONLY); LENIENT requires diagnosis AND insulin (any non-NONE), documentation waived"
    error_id: ERR_COVERAGE_CRITERIA_NOT_MET
    http_status: 422
    applies_to: ["POST /cgm/coverage-verifications/{id}/decide (decision=APPROVED)"]

  - priority: 9
    category: business_referential
    check: "Coverage verification referenced by a SensorOrder belongs to the same prescription and has decision == APPROVED"
    error_id: ERR_COVERAGE_NOT_APPROVED
    http_status: 409
    applies_to: ["POST /cgm/patients/{id}/sensor-orders"]

  - priority: 10
    category: business_referential
    check: "SensorOrder.lot_id's product matches prescription.product_id (no cross-product substitution)"
    error_id: ERR_PRODUCT_MISMATCH
    http_status: 422
    applies_to: ["POST /cgm/patients/{id}/sensor-orders"]

  - priority: 11
    category: business_referential
    check: "Prescription.expires_on >= logical current date; prescription.status == ACTIVE"
    error_id: ERR_PRESCRIPTION_NOT_ACTIVE
    http_status: 409
    applies_to: ["POST /cgm/patients/{id}/sensor-orders"]

  - priority: 12
    category: business_temporal
    check: "Refill cadence: logical_date >= earliest_refill_date computed per refill_cadence_rule from the latest non-CANCELLED prior order for the prescription"
    error_id: ERR_REFILL_TOO_EARLY
    http_status: 409
    applies_to: ["POST /cgm/patients/{id}/sensor-orders"]

  - priority: 13
    category: business_temporal
    check: "One-active-sensor rule: at most one DeviceBinding with status == ACTIVE per (patient_id, channel); a new binding's [activated_at, expires_at) half-open interval MUST NOT overlap any existing ACTIVE binding's interval on the same channel"
    error_id: ERR_ACTIVE_BINDING_EXISTS
    http_status: 409
    applies_to: ["POST /cgm/patients/{id}/device-bindings"]

  - priority: 14
    category: business_temporal
    check: "Generation compatibility: new binding's sensor_unit.product.generation MUST equal the patient's most recent prior binding's product.generation, OR prior generation must appear in the new product's compatible_prior_generations list"
    error_id: ERR_GENERATION_INCOMPATIBLE
    http_status: 422
    applies_to: ["POST /cgm/patients/{id}/device-bindings"]

  - priority: 15
    category: business_constraint
    check: "Quantity of new SensorOrder equals prescription.quantity_per_fill exactly"
    error_id: ERR_QUANTITY_MISMATCH
    http_status: 422
    applies_to: ["POST /cgm/patients/{id}/sensor-orders"]

  - priority: 16
    category: business_constraint
    check: "SensorOrder creation requires prescription.fills_consumed < prescription.fills_authorized"
    error_id: ERR_PRESCRIPTION_EXHAUSTED
    http_status: 409
    applies_to: ["POST /cgm/patients/{id}/sensor-orders"]

  - priority: 17
    category: business_constraint
    check: "Warranty claim's reported_failure_day_index MUST be strictly less than product.wear_days to qualify as early failure"
    error_id: ERR_NOT_EARLY_FAILURE
    http_status: 422
    applies_to: ["POST /cgm/warranty-claims/{id}/decide (decision=APPROVED)"]

  - priority: 18
    category: business_constraint
    check: "WarrantyClaim approval requires claim.device_data_attached == true"
    error_id: ERR_DEVICE_DATA_REQUIRED
    http_status: 422
    applies_to: ["POST /cgm/warranty-claims/{id}/begin-review", "POST /cgm/warranty-claims/{id}/decide"]

  - priority: 19
    category: business_constraint
    check: "SupportEnrollment creation requires patient.state_code NOT IN {MA, CA, WA} AND payer.benefit_route == PHARMACY"
    error_id: ERR_SAVINGS_CARD_NOT_PERMITTED
    http_status: 422
    applies_to: ["POST /cgm/patients/{id}/support-enrollments"]

  - priority: 20
    category: business_constraint
    check: "DeviceBinding channel MUST be permitted by sensor_unit.product.reader_channel (READER allows READER only; APP allows APP only; HYBRID allows either)"
    error_id: ERR_CHANNEL_NOT_SUPPORTED
    http_status: 422
    applies_to: ["POST /cgm/patients/{id}/device-bindings"]

  - priority: 21
    category: business_constraint
    check: "DeviceBinding activation requires sensor_unit.status == IN_HAND AND sensor_unit.patient_id == binding.patient_id"
    error_id: ERR_UNIT_NOT_ACTIVATABLE
    http_status: 409
    applies_to: ["POST /cgm/patients/{id}/device-bindings"]

  - priority: 22
    category: business_fiscal
    check: "SupportEnrollment.card_max_per_fill_cents >= 0 AND card_max_per_fill_cents <= 20000 (program cap)"
    error_id: ERR_INVALID_CARD_CAP
    http_status: 422
    applies_to: ["POST /cgm/patients/{id}/support-enrollments"]

  - priority: 23
    category: business_fiscal
    check: "SensorOrder adjudication requires no other ADJUDICATED or PAID order for the same prescription on the same logical fill_date (dedupe)"
    error_id: ERR_DUPLICATE_ADJUDICATION
    http_status: 409
    applies_to: ["POST /cgm/sensor-orders/{id}/adjudicate"]

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/cgm/_clock/set_current_utc"
    description: "Set the logical clock. Server default before any call is exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: string }"
    side_effects: ["logical clock updated"]

  # --- Patients ---
  - method: POST
    path: "/cgm/patients"
    description: "Register a patient"
    roles: [PlatformAdmin]
    code: 201
    input: ["full_name", "date_of_birth", "state_code"]
    output: Patient
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/cgm/patients"
    description: "List patients"
    roles: [Any]
    code: 200
    input: []
    output: "Patient[]"
    side_effects: []

  - method: GET
    path: "/cgm/patients/{id}"
    description: "Get a patient"
    roles: [Any]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: GET
    path: "/cgm/patients/{id}/coverage-verifications"
    description: "List coverage verifications for this patient (FK reverse-reachability)"
    roles: [Any]
    code: 200
    input: []
    output: "CoverageVerification[]"
    side_effects: []

  - method: GET
    path: "/cgm/patients/{id}/sensor-units"
    description: "List sensor units allocated to this patient (FK reverse-reachability)"
    roles: [Any]
    code: 200
    input: []
    output: "SensorUnit[]"
    side_effects: []

  - method: GET
    path: "/cgm/patients/{id}/warranty-claims"
    description: "List warranty claims filed by this patient (FK reverse-reachability)"
    roles: [Any]
    code: 200
    input: []
    output: "WarrantyClaim[]"
    side_effects: []

  - method: GET
    path: "/cgm/patients/{id}/adverse-event-reports"
    description: "List adverse event reports filed by this patient (FK reverse-reachability)"
    roles: [Any]
    code: 200
    input: []
    output: "AdverseEventReport[]"
    side_effects: []

  # --- Prescribers ---
  - method: POST
    path: "/cgm/prescribers"
    description: "Register a prescriber"
    roles: [PlatformAdmin]
    code: 201
    input: ["full_name", "npi", "specialty"]
    output: Prescriber
    side_effects: []

  - method: GET
    path: "/cgm/prescribers/{id}"
    description: "Get a prescriber"
    roles: [Any]
    code: 200
    input: []
    output: Prescriber
    side_effects: []

  - method: GET
    path: "/cgm/prescribers/{id}/prescriptions"
    description: "List prescriptions written by this prescriber (FK reverse-reachability)"
    roles: [Any]
    code: 200
    input: []
    output: "Prescription[]"
    side_effects: []

  # --- Payers ---
  - method: POST
    path: "/cgm/payers"
    description: "Register a payer plan"
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "plan_code", "benefit_route", "cgm_coverage_policy", "pharmacy_copay_pct", "dme_coinsurance_pct", "deductible_cap_cents"]
    output: Payer
    side_effects: []

  - method: GET
    path: "/cgm/payers/{id}"
    description: "Get a payer"
    roles: [Any]
    code: 200
    input: []
    output: Payer
    side_effects: []

  - method: GET
    path: "/cgm/payers/{id}/coverage-verifications"
    description: "List coverage verifications against this payer (FK reverse-reachability)"
    roles: [Any]
    code: 200
    input: []
    output: "CoverageVerification[]"
    side_effects: []

  - method: GET
    path: "/cgm/payers/{id}/support-enrollments"
    description: "List support enrollments linked to this payer (FK reverse-reachability)"
    roles: [Any]
    code: 200
    input: []
    output: "SupportEnrollment[]"
    side_effects: []

  # --- Sensor Products ---
  - method: POST
    path: "/cgm/sensor-products"
    description: "Register a sensor product"
    roles: [PlatformAdmin]
    code: 201
    input: ["sku", "generation", "wear_days", "reader_channel", "compatible_prior_generations", "list_price_cents"]
    output: SensorProduct
    side_effects: []

  - method: GET
    path: "/cgm/sensor-products/{id}"
    description: "Get a sensor product"
    roles: [Any]
    code: 200
    input: []
    output: SensorProduct
    side_effects: []

  - method: GET
    path: "/cgm/sensor-products/{id}/prescriptions"
    description: "List prescriptions referencing this product (FK reverse-reachability)"
    roles: [Any]
    code: 200
    input: []
    output: "Prescription[]"
    side_effects: []

  # --- Sensor Lots ---
  - method: POST
    path: "/cgm/sensor-products/{id}/sensor-lots"
    description: "Create a manufactured lot for a product"
    roles: [PlatformAdmin]
    code: 201
    input: ["lot_code", "quantity_manufactured", "manufacture_date", "expiry_date"]
    output: SensorLot
    side_effects: ["complaint_count = 0", "complaint_posture = NORMAL"]

  - method: GET
    path: "/cgm/sensor-products/{id}/sensor-lots"
    description: "List lots for a product"
    roles: [Any]
    code: 200
    input: []
    output: "SensorLot[]"
    side_effects: []

  - method: GET
    path: "/cgm/sensor-lots/{id}"
    description: "Get a lot"
    roles: [Any]
    code: 200
    input: []
    output: SensorLot
    side_effects: []

  - method: GET
    path: "/cgm/sensor-lots/{id}/sensor-orders"
    description: "List sensor orders picked from this lot (FK reverse-reachability)"
    roles: [Any]
    code: 200
    input: []
    output: "SensorOrder[]"
    side_effects: []

  - method: POST
    path: "/cgm/sensor-lots/{id}/downgrade-posture"
    description: "Manual posture downgrade (HOLD→WATCH or WATCH→NORMAL) after remediation"
    roles: [QualityEngineer]
    code: 200
    input: ["review_notes"]
    output: SensorLot
    side_effects: ["complaint_posture one step lower"]

  # --- Sensor Units ---
  - method: POST
    path: "/cgm/sensor-lots/{id}/sensor-units"
    description: "Register a serialized unit in a lot"
    roles: [PlatformAdmin]
    code: 201
    input: ["serial_number"]
    output: SensorUnit
    side_effects: ["status = IN_STOCK"]

  - method: GET
    path: "/cgm/sensor-lots/{id}/sensor-units"
    description: "List units in a lot"
    roles: [Any]
    code: 200
    input: []
    output: "SensorUnit[]"
    side_effects: []

  - method: GET
    path: "/cgm/sensor-units/{id}"
    description: "Get a unit"
    roles: [Any]
    code: 200
    input: []
    output: SensorUnit
    side_effects: []

  - method: GET
    path: "/cgm/sensor-units/{id}/device-bindings"
    description: "List bindings activated on this unit (FK reverse-reachability)"
    roles: [Any]
    code: 200
    input: []
    output: "DeviceBinding[]"
    side_effects: []

  - method: GET
    path: "/cgm/sensor-units/{id}/replacement-shipments"
    description: "List replacement shipments that dispatched this unit (FK reverse-reachability)"
    roles: [Any]
    code: 200
    input: []
    output: "ReplacementShipment[]"
    side_effects: []

  - method: GET
    path: "/cgm/sensor-units/{id}/adverse-event-reports"
    description: "List adverse event reports referencing this unit (FK reverse-reachability)"
    roles: [Any]
    code: 200
    input: []
    output: "AdverseEventReport[]"
    side_effects: []

  - method: POST
    path: "/cgm/sensor-units/{id}/report-early-failure"
    description: "Patient reports a unit failed early"
    roles: [Patient]
    code: 200
    input: []
    output: SensorUnit
    side_effects: ["ACTIVE → FAILED_EARLY; binding cascade"]

  - method: POST
    path: "/cgm/sensor-units/{id}/scrap"
    description: "QualityEngineer scraps a failed unit"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: SensorUnit
    side_effects: ["FAILED_EARLY → SCRAPPED"]

  # --- Prescriptions ---
  - method: POST
    path: "/cgm/patients/{id}/prescriptions"
    description: "Create a prescription (OCC: expected_patient_version required)"
    roles: [Prescriber]
    code: 201
    input: ["prescriber_id", "product_id", "diagnosis_code", "insulin_use", "documentation_attached", "quantity_per_fill", "fills_authorized", "written_on", "expected_patient_version"]
    output: Prescription
    side_effects: ["fills_consumed = 0", "expires_on computed = written_on + 365d", "increments Patient.version by 1"]

  - method: GET
    path: "/cgm/patients/{id}/prescriptions"
    description: "List prescriptions for a patient"
    roles: [Any]
    code: 200
    input: []
    output: "Prescription[]"
    side_effects: []

  - method: GET
    path: "/cgm/prescriptions/{id}"
    description: "Get a prescription"
    roles: [Any]
    code: 200
    input: []
    output: Prescription
    side_effects: []

  - method: GET
    path: "/cgm/prescriptions/{id}/sensor-orders"
    description: "List sensor orders placed against this prescription (FK reverse-reachability)"
    roles: [Any]
    code: 200
    input: []
    output: "SensorOrder[]"
    side_effects: []

  - method: POST
    path: "/cgm/prescriptions/{id}/cancel"
    description: "Prescriber cancels an active prescription"
    roles: [Prescriber]
    code: 200
    input: []
    output: Prescription
    side_effects: ["ACTIVE → CANCELLED", "cascade-cancel PENDING_PICK orders"]

  # --- Coverage Verifications ---
  - method: POST
    path: "/cgm/prescriptions/{id}/coverage-verifications"
    description: "Run a coverage verification against a payer"
    roles: [CoverageReviewer]
    code: 201
    input: ["payer_id"]
    output: CoverageVerification
    side_effects: ["decision = PENDING", "criteria booleans computed and stored"]

  - method: GET
    path: "/cgm/prescriptions/{id}/coverage-verifications"
    description: "List verifications for a prescription"
    roles: [Any]
    code: 200
    input: []
    output: "CoverageVerification[]"
    side_effects: []

  - method: GET
    path: "/cgm/coverage-verifications/{id}"
    description: "Get a verification"
    roles: [Any]
    code: 200
    input: []
    output: CoverageVerification
    side_effects: []

  - method: GET
    path: "/cgm/coverage-verifications/{id}/sensor-orders"
    description: "List sensor orders that referenced this verification (FK reverse-reachability)"
    roles: [Any]
    code: 200
    input: []
    output: "SensorOrder[]"
    side_effects: []

  - method: POST
    path: "/cgm/coverage-verifications/{id}/decide"
    description: "Approve or deny a verification"
    roles: [CoverageReviewer]
    code: 200
    input: ["decision", "denial_reason?"]
    output: CoverageVerification
    side_effects: ["PENDING → APPROVED or DENIED"]

  # --- Sensor Orders ---
  - method: POST
    path: "/cgm/patients/{id}/sensor-orders"
    description: "Place a sensor supply order"
    roles: [FulfillmentAgent]
    code: 201
    input: ["prescription_id", "coverage_verification_id", "lot_id", "quantity"]
    output: SensorOrder
    side_effects: ["fulfillment_status=PENDING_PICK", "billing_status=UNBILLED", "earliest_refill_date computed"]

  - method: GET
    path: "/cgm/patients/{id}/sensor-orders"
    description: "List orders for a patient"
    roles: [Any]
    code: 200
    input: []
    output: "SensorOrder[]"
    side_effects: []

  - method: GET
    path: "/cgm/sensor-orders/{id}"
    description: "Get an order"
    roles: [Any]
    code: 200
    input: []
    output: SensorOrder
    side_effects: []

  - method: POST
    path: "/cgm/sensor-orders/{id}/pick"
    description: "Pick units from lot"
    roles: [FulfillmentAgent]
    code: 200
    input: []
    output: SensorOrder
    side_effects: ["allocate units IN_STOCK → ALLOCATED", "Prescription.fills_consumed += 1"]

  - method: POST
    path: "/cgm/sensor-orders/{id}/adjudicate"
    description: "Run benefit adjudication (OCC: expected_order_version)"
    roles: [BillingAgent]
    code: 200
    input: ["expected_order_version"]
    output: SensorOrder
    side_effects: ["UNBILLED → ADJUDICATED", "benefit_adjudication_rule + savings_card_application_rule", "increments SensorOrder.version by 1"]

  - method: POST
    path: "/cgm/sensor-orders/{id}/mark-paid"
    description: "Mark adjudicated order paid"
    roles: [BillingAgent]
    code: 200
    input: []
    output: SensorOrder
    side_effects: ["ADJUDICATED → PAID", "decrement card_remaining_cents"]

  - method: POST
    path: "/cgm/sensor-orders/{id}/reverse"
    description: "Reverse an adjudication (compensating action)"
    roles: [BillingAgent]
    code: 200
    input: []
    output: SensorOrder
    side_effects: ["ADJUDICATED → REVERSED", "units revert to IN_STOCK if order still PICKED", "Prescription.fills_consumed -= 1"]

  - method: POST
    path: "/cgm/sensor-orders/{id}/ship"
    description: "Ship a picked order"
    roles: [FulfillmentAgent]
    code: 200
    input: []
    output: SensorOrder
    side_effects: ["PICKED → SHIPPED", "units ALLOCATED → SHIPPED"]

  - method: POST
    path: "/cgm/sensor-orders/{id}/deliver"
    description: "Deliver a shipped order"
    roles: [FulfillmentAgent]
    code: 200
    input: []
    output: SensorOrder
    side_effects: ["SHIPPED → DELIVERED", "units SHIPPED → IN_HAND"]

  - method: POST
    path: "/cgm/sensor-orders/{id}/cancel"
    description: "Cancel a pending order"
    roles: [FulfillmentAgent]
    code: 200
    input: []
    output: SensorOrder
    side_effects: ["PENDING_PICK → CANCELLED"]

  # --- Device Bindings ---
  - method: POST
    path: "/cgm/patients/{id}/device-bindings"
    description: "Activate a sensor unit on a reader or app channel"
    roles: [Patient]
    code: 201
    input: ["sensor_unit_id", "channel"]
    output: DeviceBinding
    side_effects: ["SensorUnit IN_HAND → ACTIVE", "expires_at = activated_at + wear_days", "any prior ACTIVE binding on same channel → SUPERSEDED per cascade"]

  - method: GET
    path: "/cgm/patients/{id}/device-bindings"
    description: "List bindings for a patient"
    roles: [Any]
    code: 200
    input: []
    output: "DeviceBinding[]"
    side_effects: []

  - method: GET
    path: "/cgm/device-bindings/{id}"
    description: "Get a binding"
    roles: [Any]
    code: 200
    input: []
    output: DeviceBinding
    side_effects: []

  # --- Warranty Claims ---
  - method: POST
    path: "/cgm/sensor-units/{id}/warranty-claims"
    description: "Submit a warranty claim on a failed unit"
    roles: [Patient]
    code: 201
    input: ["reported_failure_day_index", "failure_category", "device_data_attached"]
    output: WarrantyClaim
    side_effects: ["status = SUBMITTED"]

  - method: GET
    path: "/cgm/sensor-units/{id}/warranty-claims"
    description: "List claims for a unit"
    roles: [Any]
    code: 200
    input: []
    output: "WarrantyClaim[]"
    side_effects: []

  - method: GET
    path: "/cgm/warranty-claims/{id}"
    description: "Get a claim"
    roles: [Any]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: POST
    path: "/cgm/warranty-claims/{id}/begin-review"
    description: "Reviewer takes claim into DATA_REVIEW"
    roles: [WarrantyReviewer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["SUBMITTED → DATA_REVIEW"]

  - method: POST
    path: "/cgm/warranty-claims/{id}/request-more-info"
    description: "Reviewer requests more device data"
    roles: [WarrantyReviewer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["DATA_REVIEW → MORE_INFO_REQUESTED"]

  - method: POST
    path: "/cgm/warranty-claims/{id}/resubmit-data"
    description: "Patient resubmits device data"
    roles: [Patient]
    code: 200
    input: ["device_data_attached"]
    output: WarrantyClaim
    side_effects: ["MORE_INFO_REQUESTED → DATA_REVIEW"]

  - method: POST
    path: "/cgm/warranty-claims/{id}/decide"
    description: "Approve or deny a claim"
    roles: [WarrantyReviewer]
    code: 200
    input: ["decision", "review_notes"]
    output: WarrantyClaim
    side_effects: ["DATA_REVIEW → APPROVED or DENIED", "on APPROVED: warranty_credit_rule, ReplacementShipment created, replacement unit allocated"]

  - method: POST
    path: "/cgm/warranty-claims/{id}/close"
    description: "Close a denied claim"
    roles: [WarrantyReviewer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["DENIED → CLOSED"]

  # --- Replacement Shipments ---
  - method: GET
    path: "/cgm/warranty-claims/{id}/replacement-shipments"
    description: "List replacement shipments for a claim"
    roles: [Any]
    code: 200
    input: []
    output: "ReplacementShipment[]"
    side_effects: []

  - method: GET
    path: "/cgm/replacement-shipments/{id}"
    description: "Get a replacement shipment"
    roles: [Any]
    code: 200
    input: []
    output: ReplacementShipment
    side_effects: []

  - method: POST
    path: "/cgm/replacement-shipments/{id}/ship"
    description: "Ship a replacement"
    roles: [FulfillmentAgent]
    code: 200
    input: []
    output: ReplacementShipment
    side_effects: ["PENDING_SHIP → SHIPPED", "replacement unit ALLOCATED → SHIPPED"]

  - method: POST
    path: "/cgm/replacement-shipments/{id}/deliver"
    description: "Deliver a replacement"
    roles: [FulfillmentAgent]
    code: 200
    input: []
    output: ReplacementShipment
    side_effects: ["SHIPPED → DELIVERED", "replacement unit SHIPPED → IN_HAND", "original unit FAILED_EARLY → REPLACED"]

  - method: POST
    path: "/cgm/replacement-shipments/{id}/cancel"
    description: "Cancel a pending replacement"
    roles: [WarrantyReviewer]
    code: 200
    input: []
    output: ReplacementShipment
    side_effects: ["PENDING_SHIP → CANCELLED", "replacement unit ALLOCATED → IN_STOCK", "parent claim → CLOSED"]

  # --- Support Enrollments ---
  - method: POST
    path: "/cgm/patients/{id}/support-enrollments"
    description: "Enroll patient in savings-card program"
    roles: [PatientSupportAgent]
    code: 201
    input: ["payer_id", "card_max_per_fill_cents"]
    output: SupportEnrollment
    side_effects: ["savings_card_number minted", "card_remaining_cents = card_max_per_fill_cents * 12 (annual allowance)"]

  - method: GET
    path: "/cgm/patients/{id}/support-enrollments"
    description: "List enrollments for a patient"
    roles: [Any]
    code: 200
    input: []
    output: "SupportEnrollment[]"
    side_effects: []

  - method: GET
    path: "/cgm/support-enrollments/{id}"
    description: "Get an enrollment"
    roles: [Any]
    code: 200
    input: []
    output: SupportEnrollment
    side_effects: []

  - method: POST
    path: "/cgm/support-enrollments/{id}/suspend"
    description: "Suspend an enrollment"
    roles: [PatientSupportAgent]
    code: 200
    input: []
    output: SupportEnrollment
    side_effects: ["ENROLLED → SUSPENDED"]

  - method: POST
    path: "/cgm/support-enrollments/{id}/reinstate"
    description: "Reinstate a suspended enrollment"
    roles: [PatientSupportAgent]
    code: 200
    input: []
    output: SupportEnrollment
    side_effects: ["SUSPENDED → ENROLLED"]

  - method: POST
    path: "/cgm/support-enrollments/{id}/terminate"
    description: "Terminate an enrollment"
    roles: [PatientSupportAgent]
    code: 200
    input: []
    output: SupportEnrollment
    side_effects: ["ENROLLED|SUSPENDED → TERMINATED"]

  # --- Adverse Event Reports ---
  - method: POST
    path: "/cgm/sensor-lots/{id}/adverse-event-reports"
    description: "File an adverse event report on a unit in this lot"
    roles: [Patient, QualityEngineer]
    code: 201
    input: ["sensor_unit_id", "patient_id", "severity", "event_type"]
    output: AdverseEventReport
    side_effects: ["status = OPEN"]

  - method: GET
    path: "/cgm/sensor-lots/{id}/adverse-event-reports"
    description: "List AERs for a lot"
    roles: [Any]
    code: 200
    input: []
    output: "AdverseEventReport[]"
    side_effects: []

  - method: GET
    path: "/cgm/adverse-event-reports/{id}"
    description: "Get an AER"
    roles: [Any]
    code: 200
    input: []
    output: AdverseEventReport
    side_effects: []

  - method: POST
    path: "/cgm/adverse-event-reports/{id}/investigate"
    description: "Open investigation"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: AdverseEventReport
    side_effects: ["OPEN → INVESTIGATING"]

  - method: POST
    path: "/cgm/adverse-event-reports/{id}/close"
    description: "Close an investigation with an outcome"
    roles: [QualityEngineer]
    code: 200
    input: ["outcome"]
    output: AdverseEventReport
    side_effects: ["INVESTIGATING → CLOSED_SUBSTANTIATED or CLOSED_UNSUBSTANTIATED; SUBSTANTIATED triggers lot complaint_posture recompute"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing or empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for endpoint per §1.5" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, type mismatch, or enum value not in declared set" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure on a transition endpoint" }
  - { id: ERR_STALE_PATIENT_VERSION, http: 412, condition: "expected_patient_version does not match Patient.version" }
  - { id: ERR_STALE_ORDER_VERSION, http: 412, condition: "expected_order_version does not match SensorOrder.version" }
  - { id: ERR_PRESCRIPTION_NOT_ACTIVE, http: 409, condition: "Prescription not in ACTIVE status, or past expires_on" }
  - { id: ERR_PRESCRIPTION_EXHAUSTED, http: 409, condition: "fills_consumed >= fills_authorized" }
  - { id: ERR_PRESCRIPTION_OWNER_MISMATCH, http: 403, condition: "Acting prescriber is not the prescription's prescriber" }
  - { id: ERR_PAYER_NOT_ACTIVE, http: 409, condition: "Payer.status != ACTIVE" }
  - { id: ERR_VERIFICATION_ALREADY_DECIDED, http: 409, condition: "CoverageVerification decision != PENDING on decide" }
  - { id: ERR_COVERAGE_CRITERIA_NOT_MET, http: 422, condition: "Diagnosis/insulin/documentation criteria fail under payer.cgm_coverage_policy" }
  - { id: ERR_COVERAGE_NOT_APPROVED, http: 409, condition: "Referenced verification is not APPROVED or belongs to a different prescription" }
  - { id: ERR_PRODUCT_MISMATCH, http: 422, condition: "SensorOrder.lot_id product does not match prescription.product_id" }
  - { id: ERR_REFILL_TOO_EARLY, http: 409, condition: "logical_date < earliest_refill_date per refill_cadence_rule" }
  - { id: ERR_QUANTITY_MISMATCH, http: 422, condition: "Order quantity != prescription.quantity_per_fill" }
  - { id: ERR_ORDER_NOT_PICKABLE, http: 409, condition: "fulfillment_status != PENDING_PICK on pick" }
  - { id: ERR_ORDER_NOT_SHIPPABLE, http: 409, condition: "fulfillment_status != PICKED on ship" }
  - { id: ERR_ORDER_NOT_DELIVERABLE, http: 409, condition: "fulfillment_status != SHIPPED on deliver" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "fulfillment_status != PENDING_PICK on cancel" }
  - { id: ERR_ORDER_NOT_ADJUDICATABLE_STATE, http: 409, condition: "fulfillment_status not in {PENDING_PICK, PICKED} on adjudicate" }
  - { id: ERR_ORDER_ALREADY_ADJUDICATED, http: 409, condition: "billing_status != UNBILLED on adjudicate" }
  - { id: ERR_ORDER_NOT_PAID_STATE, http: 409, condition: "billing_status != ADJUDICATED on mark-paid" }
  - { id: ERR_ORDER_NOT_REVERSIBLE, http: 409, condition: "billing_status != ADJUDICATED or order already shipped on reverse" }
  - { id: ERR_DUPLICATE_ADJUDICATION, http: 409, condition: "Another ADJUDICATED or PAID order for same prescription on same fill_date exists" }
  - { id: ERR_LOT_ON_HOLD, http: 409, condition: "SensorLot.complaint_posture == HOLD during pick" }
  - { id: ERR_INSUFFICIENT_LOT_STOCK, http: 409, condition: "Fewer than order.quantity IN_STOCK units remain in lot at pick time" }
  - { id: ERR_UNIT_NOT_ACTIVE, http: 409, condition: "SensorUnit.status != ACTIVE on report-early-failure" }
  - { id: ERR_UNIT_OWNER_MISMATCH, http: 403, condition: "X-User-ID != sensor_unit.patient_id" }
  - { id: ERR_UNIT_NOT_ACTIVATABLE, http: 409, condition: "SensorUnit.status != IN_HAND or patient_id mismatch on binding create" }
  - { id: ERR_ACTIVE_BINDING_EXISTS, http: 409, condition: "Another ACTIVE DeviceBinding overlaps on the same channel" }
  - { id: ERR_GENERATION_INCOMPATIBLE, http: 422, condition: "New binding's product generation incompatible with patient's prior binding" }
  - { id: ERR_CHANNEL_NOT_SUPPORTED, http: 422, condition: "Channel not permitted by product.reader_channel" }
  - { id: ERR_CLAIM_NOT_SUBMITTED, http: 409, condition: "WarrantyClaim.status != SUBMITTED on begin-review" }
  - { id: ERR_CLAIM_NOT_IN_REVIEW, http: 409, condition: "WarrantyClaim.status != DATA_REVIEW on decide" }
  - { id: ERR_DEVICE_DATA_REQUIRED, http: 422, condition: "device_data_attached == false on begin-review or decide" }
  - { id: ERR_NOT_EARLY_FAILURE, http: 422, condition: "reported_failure_day_index >= product.wear_days on APPROVED decide" }
  - { id: ERR_SAVINGS_CARD_NOT_PERMITTED, http: 422, condition: "Patient in excluded state OR payer route is DME on support-enrollment creation" }
  - { id: ERR_INVALID_CARD_CAP, http: 422, condition: "card_max_per_fill_cents out of range" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "System operator; manages patients, prescribers, payers, products, lots, and units; controls the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /cgm/_clock/set_current_utc"
      - "POST /cgm/patients"
      - "POST /cgm/prescribers"
      - "POST /cgm/payers"
      - "POST /cgm/sensor-products"
      - "POST /cgm/sensor-products/{id}/sensor-lots"
      - "POST /cgm/sensor-lots/{id}/sensor-units"
    shared_operations:
      - "All GET endpoints"

  - name: Prescriber
    description: "Physician; writes and cancels prescriptions"
    identity: "entity_backed:Prescriber"
    exclusive_operations:
      - "POST /cgm/patients/{id}/prescriptions"
      - "POST /cgm/prescriptions/{id}/cancel"
    shared_operations:
      - "All GET endpoints"

  - name: CoverageReviewer
    description: "Payer-side reviewer; runs and decides coverage verifications"
