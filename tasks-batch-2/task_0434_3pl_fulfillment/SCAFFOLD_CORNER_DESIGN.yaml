        distinguishing_aspect: |
          cartonization threshold step-up: a carton whose fill_volume_cc is 1001
          (1 unit of 1001cc) exceeds SMALL_INNER_CC(1000) by one, so carton_size
          is MEDIUM not SMALL — the non-inclusive side of the boundary §1.8 pins
          inclusively at exactly 1000.
