              as: StateAuditor
              captures: { inv_end: $.data.current_head_count }
          assert:
            - "Premises.${prem_id}.current_head_count == 15 after depart"
            - "Premises.${prem_id}.current_head_count == 20 after cancel (depart + cancel conserves inventory)"
            - "MovementRecord.${rec_id}.status == 'CANCELLED'"
