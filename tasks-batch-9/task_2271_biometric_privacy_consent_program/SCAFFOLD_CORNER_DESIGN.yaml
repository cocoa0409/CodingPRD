              payload: { program_id: "${prog_id}", state_code: "IL", statute_name: "BIPA", private_right_of_action: "FULL", damages_model: "STATUTORY_PER_VIOLATION", requires_written_release: true, translation_required: true, required_locales: ["en", "es"], retention_max_days: 1095, notice_lead_days: 14, per_violation_negligent_cents: 100000, per_violation_reckless_cents: 500000, cure_period_days: 0 }
