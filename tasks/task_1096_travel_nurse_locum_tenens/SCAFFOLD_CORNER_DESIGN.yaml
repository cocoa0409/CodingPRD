      - name: corner_request_without_role_header_is_unauthenticated
        claim_type: peer_roles
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Authentication (priority 1) precedes authorisation (priority 2), so a request that omits the X-User-Role header entirely returns 401 ERR_UNAUTHENTICATED rather than 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup:
            - "Empty database. The test issues the call below with NO X-User-Role and NO X-User-ID header; the `as:` value names the endpoint's declared role only so the recipe resolves against §1.5."
          setup_api_calls: []
          trigger:
            - call: "POST /clinicians"
              payload: { full_name: "Ada Reyes", discipline: "RN", specialty: "ICU", employment_type: "W2_EMPLOYEE", primary_residence_state: "TX", tax_home_verified: true }
              as: Recruiter
              captures: { err_id: "$.data.error_id" }
          assert:
            - "With both auth headers omitted the response is 401 with error_id == ERR_UNAUTHENTICATED"
            - "With X-User-Role set to an undeclared value such as `Auditor` the response is also 401 ERR_UNAUTHENTICATED"
            - "With valid headers for role FacilityManager the same body returns 403 ERR_UNAUTHORIZED instead, proving priority 1 precedes priority 2"

  - section: cross_cutting_complexity_layers
    instances:

      - name: corner_occ_stale_assignment_version_blocks_second_extension_open
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[extension-create-stale-assignment]
          - errors[ERR_STALE_ASSIGNMENT_VERSION]
          - endpoints[POST /assignments/{id}/extensions]
        distinguishing_aspect: "Opening the first ExtensionRequest bumps Assignment.version, so a second strictly sequential open still carrying the pre-open version is refused 412 ERR_STALE_ASSIGNMENT_VERSION; re-reading the assignment and retrying with the fresh version succeeds."
        test_recipe:
          setup:
            - "Assignment 2026-06-07 .. 2026-09-05 with contract FULLY_EXECUTED (PENDING_START); no extension request exists yet."
            - "The client has read the assignment once and holds that version value."
          setup_api_calls:
            - call: "POST /per-diem-localities"
              payload: { locality_code: "PHX-AZ", state_code: "AZ", daily_lodging_cents: 15000, daily_mie_cents: 7900, effective_from: "2026-01-01" }
              as: PlatformAdmin
            - call: "POST /facilities"
              payload: { name: "Desert Valley Medical Center", state_code: "AZ", per_diem_locality_code: "PHX-AZ", billing_contact_email: "ap@dvmc.example", is_compact_member: true, max_concurrent_travelers: 2 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /clinicians"
              payload: { full_name: "Ada Reyes", discipline: "RN", specialty: "ICU", employment_type: "W2_EMPLOYEE", primary_residence_state: "TX", tax_home_verified: true }
              as: Recruiter
              captures: { clin_id: "$.data.id" }
            - call: "POST /licenses"
              payload: { clinician_id: "${clin_id}", state_code: "TX", license_type: "RN", license_number: "TX-RN-88120", expires_on: "2027-12-31", is_compact: true }
              as: Recruiter
              captures: { lic_id: "$.data.id" }
            - call: "POST /licenses/${lic_id}/transition"
              payload: { to: "VERIFIED" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
            - call: "POST /assignments"
              payload: { clinician_id: "${clin_id}", facility_id: "${fac_id}", specialty: "ICU", required_license_type: "RN", start_date: "2026-06-07", term_weeks: 13, weekly_guaranteed_hours: 36, base_pay_rate_cents_per_hour: 5200, bill_rate_cents_per_hour: 14000, shift: "DAY" }
              as: Recruiter
              captures: { asg_id: "$.data.id" }
            - call: "GET /assignments/${asg_id}/contracts"
              as: Recruiter
              captures: { con_id: "$.data[0].id" }
            - call: "POST /contracts/${con_id}/transition"
              payload: { to: "SENT_FOR_SIGNATURE" }
              as: Recruiter
            - call: "POST /contracts/${con_id}/transition"
              payload: { to: "FULLY_EXECUTED" }
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "GET /assignments/${asg_id}"
              as: Recruiter
              captures: { asg_v_stale: "$.data.version" }
          trigger:
            - call: "POST /assignments/${asg_id}/extensions"
              payload: { expected_assignment_version: "${asg_v_stale}", proposed_additional_weeks: 13, proposed_pay_rate_cents_per_hour: 5300, proposed_bill_rate_cents_per_hour: 14200 }
              as: Recruiter
              captures: { ext_first_id: "$.data.id" }
            - call: "POST /assignments/${asg_id}/extensions"
              payload: { expected_assignment_version: "${asg_v_stale}", proposed_additional_weeks: 8, proposed_pay_rate_cents_per_hour: 5250, proposed_bill_rate_cents_per_hour: 14100 }
              as: Recruiter
              captures: { err_id: "$.data.error_id" }
            - call: "GET /assignments/${asg_id}"
              as: Recruiter
              captures: { asg_v_fresh: "$.data.version" }
            - call: "POST /assignments/${asg_id}/extensions"
              payload: { expected_assignment_version: "${asg_v_fresh}", proposed_additional_weeks: 8, proposed_pay_rate_cents_per_hour: 5250, proposed_bill_rate_cents_per_hour: 14100 }
              as: Recruiter
              captures: { ext_second_id: "$.data.id" }
          assert:
            - "The first open returns 201; ExtensionRequest.${ext_first_id}.status == PROPOSED, round_count == 1, initiated_by_role == Recruiter, last_actor_role == Recruiter"
            - "Assignment.${asg_id}.version after the first open == ${asg_v_stale} + 1"
            - "The second open carrying ${asg_v_stale} returns 412 with error_id == ERR_STALE_ASSIGNMENT_VERSION and creates no row"
            - "The retry with the freshly read version returns 201; ExtensionRequest.${ext_second_id}.status == PROPOSED"
            - "Supersede fired only on the successful retry: ExtensionRequest.${ext_first_id}.status == WITHDRAWN with resolved_at set"
            - "GET /assignments/${asg_id}/extensions returns exactly 2 rows"

      - name: corner_contract_revise_recomputes_projection_and_rejects_stale_version
