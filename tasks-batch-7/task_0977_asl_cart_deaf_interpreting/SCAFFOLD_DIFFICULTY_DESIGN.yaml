            - { call: "POST /requests/${req1}/submit", payload: {}, as: OrgRequester, as_user_id: "${org1}" }
            - { call: "GET /requests/${req1}", payload: {}, as: Any, captures: { req1_v: $.data.version } }
            - { call: "POST /requests/${req1}/offers", payload: { interpreter_id: "${i1}", expected_request_version: "${req1_v}" }, as: PlatformAdmin, captures: { asg1: $.data.id } }
            - { call: "POST /assignments/${asg1}/accept", payload: {}, as: Interpreter, as_user_id: "${i1}" }
            - { call: "POST /assignments/${asg1}/confirm", payload: {}, as: PlatformAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T14:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /assignments/${asg1}/depart", payload: {}, as: Interpreter, as_user_id: "${i1}" }
            - { call: "POST /assignments/${asg1}/check-in", payload: {}, as: Interpreter, as_user_id: "${i1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T16:10:00Z" }, as: PlatformAdmin }
            - { call: "POST /assignments/${asg1}/check-out", payload: { travel_minutes_claimed: 90, mileage_claimed: 12 }, as: Interpreter, as_user_id: "${i1}" }
            - { call: "GET /assignments/${asg1}/encounters", payload: {}, as: Any, captures: { enc1: "$.data[0].id" } }
            - { call: "POST /encounters/${enc1}/verify", payload: {}, as: OrgRequester, as_user_id: "${org1}" }
            - { call: "POST /invoices/generate", payload: { assignment_id: "${asg1}" }, as: BillingClerk, captures: { inv1: $.data.id } }
            - { call: "POST /invoices/${inv1}/issue", payload: {}, as: BillingClerk }
          trigger:
            - { call: "GET /orgs/${org1}", payload: {}, as: Any, captures: { org_v: $.data.version } }
            - { call: "POST /credit-memos", payload: { org_id: "${org1}", amount_cents: 5000, expected_org_version: "${org_v}" }, as: BillingClerk, captures: { memo1: $.data.id } }
