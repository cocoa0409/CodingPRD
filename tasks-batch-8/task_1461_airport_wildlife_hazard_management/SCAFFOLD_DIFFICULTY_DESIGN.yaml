            - call: "POST /wildlife/dispersal-activities/${d2_id}/review"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            # D3: take 3, review only (would total 6 — exceeds)
            - call: "POST /wildlife/dispersal-activities"
              payload: { airport_id: "${ap_id}", performed_by_biologist_id: "${b2_id}", performed_at: "2026-07-17T10:00:00Z", method: "PYROTECHNICS", species_id: "${sp_id}", animals_dispersed: 4, animals_taken_lethal: 3, take_permit_id: "${tp_id}" }
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
              captures: { d3_id: $.data.id }
            - call: "POST /wildlife/dispersal-activities/${d3_id}/review"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
          trigger:
            # Close D2 (total = 3+2 = 5, exactly at boundary — succeeds)
            - call: "POST /wildlife/dispersal-activities/${d2_id}/close"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            - call: "GET /wildlife/take-permits/${tp_id}"
