              payload: { clinic_id: "${c36_id}", patient_id: "${p36pat_id}", kind: "WALK_IN", complaint_code: "SORE_THROAT" }
              as: FrontDeskAgent
              captures: { q36_id: $.data.id }
            - call: "POST /clinics/${c36_id}/call-next"
