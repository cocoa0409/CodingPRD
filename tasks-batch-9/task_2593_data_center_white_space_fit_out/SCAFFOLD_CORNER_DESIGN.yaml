      - name: tenant_contract_ceiling_is_an_aggregate_over_installed_racks
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_TENANT_CONTRACT_EXCEEDED] (422, installing the rack would push Tenant.allocated_kw above Tenant.contracted_kw)"
          - "validations[47] priority 47, applies_to POST /racks/{rack_id}/install"
          - "endpoints[POST /racks/{rack_id}/install].side_effects: Tenant.allocated_kw += design_kw"
        distinguishing_aspect: "The entitlement is consumed by INSTALL and by design_kw (not by feed reservation and not by the 1.045 chargeable figure), and it is an aggregate: three racks of 8.00, 2.00 and 1.00 kW are each individually far below the 10.00 kW contract, but the third install crosses the ceiling. The second install lands exactly ON the ceiling (8.00 + 2.00 == 10.00) and must be admitted, proving the comparison is > and not >=."
