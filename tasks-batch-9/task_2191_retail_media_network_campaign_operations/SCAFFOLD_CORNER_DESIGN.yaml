            - "Campaign.${camp_id}.billing_status == ACCRUING"
            - "Campaign.${camp_id}.delivered_spend_cents == 0"
            - "LineItem.${li_id}.line_item_status == MANUAL_PAUSED"
            - "LineItem.${li_id}.pause_reason == BUDGET_EXHAUSTED"
            - "PlacementSlot.${slot_id}.occupancy_count == 1"

      - name: a_one_percent_offsite_variance_bills_the_higher_reported_figure_on_the_reported_basis
        claim_type: dual_variant_calculation
        grounds:
          - calculations.offsite_spend_reconciliation
          - calculations.invoice_settlement_waterfall
          - endpoints[POST /rmn/invoices/{id}/issue]
        distinguishing_aspect: "Reported 101 against logged 100 is a +1.00 variance, strictly below VARIANCE_TOLERANCE_PCT, so the REPORTED_BASIS branch bills the partner's higher self-reported figure (101) rather than the retailer's logged 100 — the mirror image of the exactly-2.00 case, which clamps back to the logged basis. Invoice.variance_pct still records 1.00, proving the variance was computed and then deliberately tolerated."
        test_recipe:
          setup:
            - "SELF_SERVE advertiser ACTIVE, an OPEN 2026-Q3 trade fund account with no accruals, and an APPROVED 2026-Q3 plan whose trade_fund_share_cents is 0."
            - "An OFFSITE_ONLY campaign on an OFFSITE display slot with floor_cpc_cents 100 has one SETTLED CPC auction: one impression plus one click at clearing price 100, so logged off-site spend is exactly 100 cents."
