    instances:
      - name: field_half_open_adjacency_and_conflict
        grounds:
          - validations[priority=9]
          - errors[ERR_FIELD_TIME_CONFLICT]
          - entities.Match.fields.scheduled_end
        distinguishing_aspect: |
          Field resource with pairwise HALF-OPEN interval semantics:
          [14:00,15:30) rejects a 15:00 start (intersection) but accepts a
          15:30 start (adjacent, end == start). The hotel instance uses
          aggregate per-night capacity instead of pairwise exclusion.
        test_recipe:
          setup:
            - "Event LIVE; 4-team division bracket published: R1M1 (slot 1) and R1M2 (slot 2) both PENDING_TEAMS on Field F1 (slot_minutes 90)"
