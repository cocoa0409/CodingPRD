      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - Car type CT-O (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family LINE-O) with
        WHEELSET WS-O at qty_per_car 2 and CASTING CS-O at qty_per_car 1; 100 units of each on hand via
