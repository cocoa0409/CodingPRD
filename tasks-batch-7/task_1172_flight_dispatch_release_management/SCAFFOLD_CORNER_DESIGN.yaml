          trigger:
            - { call: "GET /dispatch/plans?leg_id=${leg1}", as: Dispatcher, as_user_id: "${d1}", captures: { fl_total: $.meta.total_count } }
          assert:
            - "fl_total == 1 and the single row's id == ${p1}"

