# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3350_pre_sale_home_improvement_advance_repayment_closing
#
# Breadth probe. Every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners that §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: concierge_case_create_returns_every_declared_field_and_starts_eligibility_review
        claim_type: Creation
        grounds:
          - entities.ConciergeCase
          - endpoints.POST_/concierge/cases
        distinguishing_aspect: "A case created with the required inputs comes back 201 with status ELIGIBILITY_REVIEW, version 1, and system-generated id / created_at / updated_at."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /concierge/agents"
              payload: { display_name: "Agent A", license_number: "LIC-001", brokerage: "Brokerage X" }
              as: PlatformAdmin
              captures: { agent_id: $.data.id }
          trigger:
            - call: "POST /concierge/cases"
              payload: { address_line: "123 Main St", estimated_property_value_cents: 80000000, expected_sale_proceeds_cents: 100000000, listing_agreement_signed: true, listing_agreement_disclosure_ack: true }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { case_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "ConciergeCase.${case_id}.status == ELIGIBILITY_REVIEW"
            - "ConciergeCase.${case_id}.version == 1"
            - "ConciergeCase.${case_id}.advance_total_cents == 0"
            - "ConciergeCase.${case_id}.posture == OPEN"
            - "the response data carries non-null id, created_at and updated_at"

      - name: vendor_create_returns_computed_quality_fields_at_default
        claim_type: Creation
        grounds:
          - entities.Vendor
          - endpoints.POST_/concierge/vendors
        distinguishing_aspect: "A vendor created with legal_name and trade comes back 201 with quality_score_bp=10000 and on_time_streak=0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /concierge/vendors"
              payload: { legal_name: "Vendor V", trade: "PAINT" }
              as: PlatformAdmin
              captures: { vendor_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Vendor.${vendor_id}.quality_score_bp == 10000"
            - "Vendor.${vendor_id}.on_time_streak == 0"
            - "Vendor.${vendor_id}.status == null or not present (Vendor has no status field)"

      - name: improvement_project_get_returns_stored_fields_unchanged
        claim_type: Retrieval
        grounds:
          - entities.ImprovementProject
          - endpoints.GET_/concierge/cases/{id}/projects/{id}
        distinguishing_aspect: "Every project field round-trips through GET exactly as posted, including the computed approved_cost_cents after approval."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One case with one APPROVED project."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /concierge/agents"
              payload: { display_name: "Agent A", license_number: "LIC-001", brokerage: "Brokerage X" }
              as: PlatformAdmin
              captures: { agent_id: $.data.id }
            - call: "POST /concierge/cases"
              payload: { address_line: "123 Main St", estimated_property_value_cents: 80000000, expected_sale_proceeds_cents: 100000000, listing_agreement_signed: true, listing_agreement_disclosure_ack: true }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { case_id: $.data.id }
            - call: "POST /concierge/cases/${case_id}/eligibility/approve"
              payload: {}
              as: ProgramUnderwriter
            - call: "POST /concierge/cases/${case_id}/projects"
              payload: { title: "Kitchen", recommended_by_agent: true, expected_sale_price_lift_cents: 5000000, estimated_cost_cents: 5000000 }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { project_id: $.data.id }
            - call: "POST /concierge/cases/${case_id}/projects/${project_id}/propose"
              payload: {}
              as: ListingAgent
              as_user_id: "${agent_id}"
            - call: "POST /concierge/cases/${case_id}/projects/${project_id}/approve"
              payload: {}
              as: Homeowner
          trigger:
            - call: "GET /concierge/cases/${case_id}/projects/${project_id}"
              payload: {}
              as: Any
          assert:
            - "the response status is 200"
            - "ImprovementProject.${project_id}.title == \"Kitchen\""
            - "ImprovementProject.${project_id}.estimated_cost_cents == 5000000"
            - "ImprovementProject.${project_id}.approved_cost_cents == 5000000"
            - "ImprovementProject.${project_id}.status == APPROVED"

      - name: concierge_cases_list_paginates_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/concierge/cases
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three cases on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One agent with three cases."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /concierge/agents"
              payload: { display_name: "Agent A", license_number: "LIC-001", brokerage: "Brokerage X" }
              as: PlatformAdmin
              captures: { agent_id: $.data.id }
            - call: "POST /concierge/cases"
              payload: { address_line: "123 Main St", estimated_property_value_cents: 80000000, expected_sale_proceeds_cents: 100000000, listing_agreement_signed: true, listing_agreement_disclosure_ack: true }
              as: ListingAgent
              as_user_id: "${agent_id}"
            - call: "POST /concierge/cases"
              payload: { address_line: "456 Oak Ave", estimated_property_value_cents: 90000000, expected_sale_proceeds_cents: 110000000, listing_agreement_signed: true, listing_agreement_disclosure_ack: true }
              as: ListingAgent
              as_user_id: "${agent_id}"
            - call: "POST /concierge/cases"
              payload: { address_line: "789 Pine Ln", estimated_property_value_cents: 70000000, expected_sale_proceeds_cents: 90000000, listing_agreement_signed: true, listing_agreement_disclosure_ack: true }
              as: ListingAgent
              as_user_id: "${agent_id}"
          trigger:
            - call: "GET /concierge/cases"
              payload: { limit: 2, offset: 0 }
              as: Any
          assert:
            - "the response status is 200 and response_type is array"
            - "the response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /concierge/cases?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"

      - name: concierge_case_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/concierge/cases/{id}
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated UUID on a path segment produces 404 ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /concierge/cases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Any
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"

      - name: concierge_case_create_missing_listing_agreement_signed_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.ConciergeCase.fields.listing_agreement_signed
          - validations.priority_1_auth
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "listing_agreement_signed is a required input with no default; omitting it is a 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One agent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /concierge/agents"
              payload: { display_name: "Agent A", license_number: "LIC-001", brokerage: "Brokerage X" }
              as: PlatformAdmin
              captures: { agent_id: $.data.id }
          trigger:
            - call: "POST /concierge/cases"
              payload: { address_line: "123 Main St", estimated_property_value_cents: 80000000, expected_sale_proceeds_cents: 100000000, listing_agreement_disclosure_ack: true }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /concierge/cases returns 0 rows"

      - name: concierge_case_create_omitting_listing_window_days_defaults_to_180
        claim_type: Defaults
        grounds:
          - entities.ConciergeCase.fields.listing_window_days
          - entities.ConciergeCase.fields.homeowner_contribution_cents
        distinguishing_aspect: "listing_window_days and homeowner_contribution_cents each declare defaults (180 and 0); omitting them stores the defaults rather than null."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One agent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /concierge/agents"
              payload: { display_name: "Agent A", license_number: "LIC-001", brokerage: "Brokerage X" }
              as: PlatformAdmin
              captures: { agent_id: $.data.id }
          trigger:
            - call: "POST /concierge/cases"
              payload: { address_line: "123 Main St", estimated_property_value_cents: 80000000, expected_sale_proceeds_cents: 100000000, listing_agreement_signed: true, listing_agreement_disclosure_ack: true }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { case_id: $.data.id }
          assert:
            - "ConciergeCase.${case_id}.listing_window_days == 180"
            - "ConciergeCase.${case_id}.homeowner_contribution_cents == 0"
            - "ConciergeCase.${case_id}.upfront_payment_track == NO_UPFRONT"

      - name: advance_total_cents_is_computed_from_disbursements_not_input
        claim_type: Computed Fields
        grounds:
          - entities.ConciergeCase.fields.advance_total_cents
          - calculations.advance_limit_cents
        distinguishing_aspect: "advance_total_cents is source: computed; a client-supplied value is ignored and the field is derived from approved disbursements."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One case with one APPROVED project and one engagement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /concierge/agents"
              payload: { display_name: "Agent A", license_number: "LIC-001", brokerage: "Brokerage X" }
              as: PlatformAdmin
              captures: { agent_id: $.data.id }
            - call: "POST /concierge/vendors"
              payload: { legal_name: "Vendor V", trade: "GENERAL" }
              as: PlatformAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /concierge/cases"
              payload: { address_line: "123 Main St", estimated_property_value_cents: 80000000, expected_sale_proceeds_cents: 100000000, listing_agreement_signed: true, listing_agreement_disclosure_ack: true, advance_total_cents: 99999999 }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { case_id: $.data.id }
            - call: "POST /concierge/cases/${case_id}/eligibility/approve"
              payload: {}
              as: ProgramUnderwriter
            - call: "POST /concierge/cases/${case_id}/projects"
              payload: { title: "Kitchen", recommended_by_agent: true, expected_sale_price_lift_cents: 5000000, estimated_cost_cents: 5000000 }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { project_id: $.data.id }
            - call: "POST /concierge/cases/${case_id}/projects/${project_id}/propose"
              payload: {}
              as: ListingAgent
              as_user_id: "${agent_id}"
            - call: "POST /concierge/cases/${case_id}/projects/${project_id}/approve"
              payload: {}
              as: Homeowner
            - call: "POST /concierge/engagements"
              payload: { improvement_project_id: "${project_id}", vendor_id: "${vendor_id}", agreed_price_cents: 5000000, start_date: "2026-09-05T00:00:00Z", end_date: "2026-09-20T00:00:00Z" }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { engagement_id: $.data.id }
            - call: "POST /concierge/disbursements"
              payload: { concierge_case_id: "${case_id}", improvement_project_id: "${project_id}", vendor_engagement_id: "${engagement_id}", amount_cents: 5000000, kind: "DEPOSIT" }
              as: ProgramUnderwriter
              captures: { disb_id: $.data.id }
            - call: "GET /concierge/cases/${case_id}"
              payload: {}
              as: Any
              captures: { case_v: $.data.version }
            - call: "POST /concierge/disbursements/${disb_id}/approve"
              payload: { expected_case_version: "${case_v}" }
              as: ProgramUnderwriter
          trigger:
            - call: "GET /concierge/cases/${case_id}"
              payload: {}
              as: Any
          assert:
            - "ConciergeCase.${case_id}.advance_total_cents == 5000000"
            - "ConciergeCase.${case_id}.advance_total_cents != 99999999"

      - name: improvement_project_create_extra_field_status_is_ignored_input
        claim_type: System Fields
        grounds:
          - entities.ImprovementProject.fields.status
          - endpoints.POST_/concierge/cases/{id}/projects
        distinguishing_aspect: "ImprovementProject.status is source: system with initial state DRAFT. A client that sends status APPROVED is ignored: the row is created DRAFT."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One case in SCOPE_PLANNING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /concierge/agents"
              payload: { display_name: "Agent A", license_number: "LIC-001", brokerage: "Brokerage X" }
              as: PlatformAdmin
              captures: { agent_id: $.data.id }
            - call: "POST /concierge/cases"
              payload: { address_line: "123 Main St", estimated_property_value_cents: 80000000, expected_sale_proceeds_cents: 100000000, listing_agreement_signed: true, listing_agreement_disclosure_ack: true }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { case_id: $.data.id }
            - call: "POST /concierge/cases/${case_id}/eligibility/approve"
              payload: {}
              as: ProgramUnderwriter
          trigger:
            - call: "POST /concierge/cases/${case_id}/projects"
              payload: { title: "Kitchen", recommended_by_agent: true, expected_sale_price_lift_cents: 5000000, estimated_cost_cents: 5000000, status: "APPROVED" }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { project_id: $.data.id }
          assert:
            - "the response status is 201"
            - "ImprovementProject.${project_id}.status == DRAFT"

      - name: vendor_create_with_invalid_trade_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Vendor.fields.trade
          - validations.priority_1_auth
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "trade is a closed enum; a value such as ROOFING is rejected at 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /concierge/vendors"
              payload: { legal_name: "Vendor V", trade: "ROOFING" }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"

      - name: disbursement_create_body_foreign_keys_are_checked
        claim_type: Parent Relationships
        grounds:
          - validations.priority_3_existence
          - endpoints.POST_/concierge/disbursements
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "The flat topology puts foreign keys in the request body; unknown concierge_case_id or improvement_project_id produces 404 ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /concierge/disbursements"
              payload: { concierge_case_id: "00000000-0000-4000-8000-000000000001", improvement_project_id: "00000000-0000-4000-8000-000000000002", vendor_engagement_id: "00000000-0000-4000-8000-000000000003", amount_cents: 1000000, kind: "DEPOSIT" }
              as: ProgramUnderwriter
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: eligibility_approve_transitions_case_to_scope_planning
        claim_type: valid_transition
        grounds:
          - state_machines.ConciergeCase.ELIGIBILITY_REVIEW_to_SCOPE_PLANNING
        distinguishing_aspect: "POST /eligibility/approve on a case in ELIGIBILITY_REVIEW moves it to SCOPE_PLANNING and computes advance_limit_cents."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One case in ELIGIBILITY_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /concierge/agents"
              payload: { display_name: "Agent A", license_number: "LIC-001", brokerage: "Brokerage X" }
              as: PlatformAdmin
              captures: { agent_id: $.data.id }
            - call: "POST /concierge/cases"
              payload: { address_line: "123 Main St", estimated_property_value_cents: 80000000, expected_sale_proceeds_cents: 100000000, listing_agreement_signed: true, listing_agreement_disclosure_ack: true }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /concierge/cases/${case_id}/eligibility/approve"
              payload: {}
              as: ProgramUnderwriter
          assert:
            - "ConciergeCase.${case_id}.status == SCOPE_PLANNING"
            - "ConciergeCase.${case_id}.advance_limit_cents == 15000000"

      - name: eligibility_reject_transitions_case_to_cancelled
        claim_type: valid_transition
        grounds:
          - state_machines.ConciergeCase.ELIGIBILITY_REVIEW_to_CANCELLED
        distinguishing_aspect: "POST /eligibility/reject on a case in ELIGIBILITY_REVIEW moves it to CANCELLED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One case in ELIGIBILITY_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /concierge/agents"
              payload: { display_name: "Agent A", license_number: "LIC-001", brokerage: "Brokerage X" }
              as: PlatformAdmin
              captures: { agent_id: $.data.id }
            - call: "POST /concierge/cases"
              payload: { address_line: "123 Main St", estimated_property_value_cents: 80000000, expected_sale_proceeds_cents: 100000000, listing_agreement_signed: true, listing_agreement_disclosure_ack: true }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /concierge/cases/${case_id}/eligibility/reject"
              payload: {}
              as: ProgramUnderwriter
          assert:
            - "ConciergeCase.${case_id}.status == CANCELLED"

      - name: project_propose_from_draft_requires_case_scope_planning
        claim_type: invalid_transition
        grounds:
          - state_machines.ImprovementProject.DRAFT_to_PROPOSED
          - validations.priority_4_state
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Proposing a project on a case not in SCOPE_PLANNING returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One case in ELIGIBILITY_REVIEW with a DRAFT project."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /concierge/agents"
              payload: { display_name: "Agent A", license_number: "LIC-001", brokerage: "Brokerage X" }
              as: PlatformAdmin
              captures: { agent_id: $.data.id }
            - call: "POST /concierge/cases"
              payload: { address_line: "123 Main St", estimated_property_value_cents: 80000000, expected_sale_proceeds_cents: 100000000, listing_agreement_signed: true, listing_agreement_disclosure_ack: true }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { case_id: $.data.id }
            - call: "POST /concierge/cases/${case_id}/projects"
              payload: { title: "Kitchen", recommended_by_agent: true, expected_sale_price_lift_cents: 5000000, estimated_cost_cents: 5000000 }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { project_id: $.data.id }
          trigger:
            - call: "POST /concierge/cases/${case_id}/projects/${project_id}/propose"
              payload: {}
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"

      - name: disbursement_release_without_approve_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Disbursement.APPROVED_to_RELEASED
          - validations.priority_4_state
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Releasing a disbursement still in REQUESTED status returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One case with one APPROVED project, one engagement, one REQUESTED disbursement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /concierge/agents"
              payload: { display_name: "Agent A", license_number: "LIC-001", brokerage: "Brokerage X" }
              as: PlatformAdmin
              captures: { agent_id: $.data.id }
