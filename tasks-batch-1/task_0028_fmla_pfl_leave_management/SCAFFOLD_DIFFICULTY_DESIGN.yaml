  # ---------------------------------------------------------------------------
  # Rule 7: cross_entity_state_dependency — different entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: approve_requires_employee_not_terminated
        grounds:
          - state_machines.LeaveCase.CERTIFICATION_PENDING_to_APPROVED
          - entities.Employee.fields.employment_status
          - validations[priority=6]
        distinguishing_aspect: |
          Pair: LeaveCase ↔ Employee. LeaveCase.CERTIFICATION_PENDING →
          APPROVED requires Employee.employment_status == ACTIVE. If the
          employee was terminated after the case was submitted, approve fails
          with ERR_EMPLOYEE_TERMINATED.
        test_recipe:
