      - name: resolving_an_open_referral_and_reinstating_an_active_licence_are_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_REFERRAL_STATE_INVALID]
          - errors[ERR_LICENSE_ACTION_INVALID]
          - state_machines.FraudReferral
        distinguishing_aspect: "Two independent lifecycle gates: resolve is only legal from INVESTIGATING, so resolving a freshly OPEN referral returns ERR_REFERRAL_STATE_INVALID (409), and REINSTATE is only legal from SUSPENDED, so reinstating an ACTIVE licence returns ERR_LICENSE_ACTION_INVALID (409)."
        test_recipe:
          setup: ["one vehicle carrying an OPEN fraud referral and one rebuilder whose licence is ACTIVE"]
          setup_api_calls:
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A007327", model_year: 2019, make: "Honda", model: "Accord", body_class: "SEDAN", registered_state_code: "NV" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { veh_id: $.data.id }
            - call: "POST /v1/rebuilders"
              payload: { legal_name: "Sierra Rebuilders LLC", license_number: "RB-9327", license_expires_at: "2027-06-30T00:00:00Z", bond_amount_cents: 2500000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { rb_id: $.data.id }
            - call: "POST /v1/fraud-referrals"
              payload: { vehicle_id: "${veh_id}", referral_type: "IDENTITY_TAMPERING", evidence_summary: "public tip about a swapped identity plate" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /v1/fraud-referrals/${ref_id}/resolve"
              payload: { outcome: "UNSUBSTANTIATED", resolution_note: "closing without an investigation" }
              as: FraudInvestigator
              as_user_id: "fraud-01"
              captures: { e1: $.data.error_id }
            - call: "POST /v1/rebuilders/${rb_id}/license-actions"
              payload: { action: "REINSTATE", note: "no suspension is in force" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { e2: $.data.error_id }
          assert:
            - "the first response is 409 with error_id == ERR_REFERRAL_STATE_INVALID"
            - "the second response is 409 with error_id == ERR_LICENSE_ACTION_INVALID"
            - "FraudReferral.${ref_id}.status == OPEN and resolved_at is null and investigator_user_id is null"
            - "Rebuilder.${rb_id}.license_status == ACTIVE"
            - "Vehicle.${veh_id}.fraud_hold == UNDER_REFERRAL (opening the referral placed the hold and the failed resolve did not lift it)"

      - name: deciding_a_recognition_request_twice_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_RECOGNITION_ALREADY_DECIDED]
          - validations[priority=69]
          - state_machines.InterstateRecognitionRequest
        distinguishing_aspect: "DECIDED is terminal for a recognition request, so a second decide on the same request returns ERR_RECOGNITION_ALREADY_DECIDED (409) and neither the recorded mapped_brand_code nor the title's recognition_state moves a second time."
        test_recipe:
          setup: ["a SALVAGE title with one PENDING AZ recognition request that has already been decided as RECOGNIZED"]
          setup_api_calls:
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A007328", model_year: 2019, make: "Honda", model: "Accord", body_class: "SEDAN", registered_state_code: "NV" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { veh_id: $.data.id }
            - call: "POST /v1/damage-reports"
              payload: { vehicle_id: "${veh_id}", insurer_name: "Cascade Mutual", claim_number: "CM-93028", basis_code: "GROSS_ESTIMATE", acv_cents: 1000000, repair_estimate_cents: 800000, damage_type: "COLLISION", odometer_reading_miles: 68000, report_effective_at: "2026-07-20T00:00:00Z", total_loss_declared: true }
              as: InsurerAdjuster
              as_user_id: "adj-01"
              captures: { rep_id: $.data.id }
            - call: "POST /v1/title-records"
              payload: { vehicle_id: "${veh_id}", issuing_state_code: "NV", owner_name: "Ada Reyes", source_damage_report_id: "${rep_id}" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { title_id: $.data.id, title_v: $.data.version }
            - call: "POST /v1/recognition-requests"
              payload: { title_record_id: "${title_id}", requesting_state_code: "AZ", expected_title_version: "${title_v}" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { req_id: $.data.id }
            - call: "POST /v1/recognition-requests/${req_id}/decide"
              payload: { mapped_brand_code: "SALVAGE", decision_note: "AZ recognises the NV salvage brand" }
              as: ProgramAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /v1/recognition-requests/${req_id}/decide"
              payload: { mapped_brand_code: "REBUILT", decision_note: "second bite at the decision" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { e1: $.data.error_id }
          assert:
            - "response status is 409 and error_id == ERR_RECOGNITION_ALREADY_DECIDED"
            - "InterstateRecognitionRequest.${req_id}.status == DECIDED and mapped_brand_code == SALVAGE and outcome == RECOGNIZED"
            - "TitleRecord.${title_id}.recognition_state == RECOGNIZED and brand_code == SALVAGE"
            - "GET /v1/recognition-requests?title_record_id=${title_id} returns exactly 1 row"

