              as: DealerWarrantyAdmin
              as_user_id: "${d1_id}"
              captures: { cl_b_id: $.data.id }
            - call: "POST /warranty/claims/${cl_b_id}/adjudicate"
              payload: { decision: "APPROVE", approved_labor_hours: 1.5, approved_parts_qty: 3 }
              as: ClaimAdjudicator
              as_user_id: "adj-user-1"
            - call: "GET /warranty/parts-returns?claim_id=${cl_b_id}"
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { pr_b_id: "$.data[0].id" }
            - call: "POST /warranty/parts-returns/${pr_b_id}/receive"
              payload: { received_date: "2026-05-10" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/claims"
              payload: { dealer_id: "${d1_id}", vehicle_id: "${veh3_id}", labor_operation_id: "${lo_brake_id}", causal_part_id: "${part_brake_id}", repair_order_number: "RO-7003", repair_date: "2026-04-12", odometer_at_repair: 22000, claimed_labor_hours: 1.5, claimed_parts_qty: 3, complaint_text: "Customer reports brake squeal at low speed.", cause_text: "Front brake pads worn beyond specification.", correction_text: "Replaced front brake pads and verified normal braking." }
              as: DealerWarrantyAdmin
              as_user_id: "${d1_id}"
              captures: { cl_c_id: $.data.id }
            - call: "GET /warranty/parts-returns?claim_id=${cl1_id}"
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { pr_a_id: "$.data[0].id" }
            - call: "GET /warranty/parts-returns?claim_id=${cl_c_id}"
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { pr_c_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
          trigger:
            - call: "POST /warranty/parts-returns/non-return-sweep"
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "GET /warranty/parts-returns/${pr_b_id}"
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "GET /warranty/parts-returns/${pr_c_id}"
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "GET /warranty/claims/${cl_c_id}"
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "GET /warranty/dealers/${d1_id}"
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
          assert:
            - "first call: HTTP 200 with swept_count == 1 and total_debit_cents == 117342"
            - "first call: debited_claim_ids has exactly one element, the CL1 id"
            - "second call: PartsReturnRequest.status is still RECEIVED with debit_amount_cents 0"
            - "third call: PartsReturnRequest.status is still REQUESTED with debit_amount_cents 0"
            - "fourth call: WarrantyClaim CL_C is SUSPENDED by the DEALER_POSTURE_HOLD cascade even though its own return was skipped"
            - "fifth call: Dealer.chargeback_balance_cents == 117342 and status == PROBATION (90000 <= 117342 < 200000)"
            - "fifth call: Dealer.open_parts_return_count == 1 - decremented for the swept row and for the received row, still holding CL_C's"
      - name: appeal_links_only_findings_of_its_own_audit_cross_reference
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /warranty/audits/{id}/appeals]
          - entities.AuditAppeal.fields.contested_finding_ids
          - entities.AuditFinding.fields.appeal_id
        distinguishing_aspect: |
          The link is validated element by element before anything is written: an unknown finding id in the
          array is a 404 on the finding, not a 422 on the array, and a successful link is bidirectional - the
          appeal stores contested_finding_ids and each finding stores the appeal_id back.
