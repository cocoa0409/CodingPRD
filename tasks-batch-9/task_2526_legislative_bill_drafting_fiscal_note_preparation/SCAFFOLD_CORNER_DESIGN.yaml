              payload: { drafting_request_id: "${dr_id}", code_citation: "28-9-103", conflict_type: "DUPLICATE_ENACTMENT", severity: "BLOCKING" }
              as: Drafter
              as_user_id: "${d1_id}"
          assert:
            - "After the FIRST conflict: DraftingRequest.${dr_id}.status == RESEARCH, blocking_conflict_count == 1, open_blocking_conflict_count == 1, and Member.${m1_id}.clarification_pending_count == 0"
            - "After the ADVISORY conflict: DraftingRequest.${dr_id}.status == DRAFTING and advisory_conflict_count == 1, blocking_conflict_count still 1"
            - "After the SECOND BLOCKING conflict: DraftingRequest.${dr_id}.status == RETURNED_FOR_CLARIFICATION with sla_due_utc == null"
            - "DraftingRequest.${dr_id}.blocking_conflict_count == 2 and open_blocking_conflict_count == 2"
            - "Member.${m1_id}.clarification_pending_count == 1 and intake_hold == false (the hold threshold is 2)"
            - "Drafter.${d1_id}.active_engagement_count == 0 (the bounced request left the occupancy set)"

      - name: fiscal_note_loops_back_out_of_certification_more_than_once
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.FiscalNoteRequest.CERTIFIED_to_ROUTED
        distinguishing_aspect: "The FiscalNoteRequest machine has two distinct back-edges (SUBMITTED -> RETURNED_FOR_REVISION -> SUBMITTED and CERTIFIED -> ROUTED), and revision_round must record the loop count across both."
        excluded_because:
          difficulty_instance: fiscal_note_cycles_submitted_returned_submitted_certified_then_reopened_to_routed
          rationale: "That §1.8 instance drives the note through both back-edges in one timeline and pins revision_round at each hop, so a separate cyclic-shape probe would assert a strict subset of the same claims."

      - name: bill_legislative_and_fiscal_status_are_independent_state_dimensions
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Bill.legislative_status
          - state_machines.Bill.fiscal_status
        distinguishing_aspect: "Bill carries two state fields whose machines never share a transition, so a fiscal_status round trip must be observable while legislative_status is pinned."
        excluded_because:
          difficulty_instance: bill_fiscal_status_cycles_note_complete_stale_complete_while_legislative_status_holds_reported
          rationale: "That §1.8 instance holds legislative_status at REPORTED across a complete NOTE_COMPLETE -> NOTE_STALE -> NOTE_COMPLETE excursion, which is exactly the independent-dimensions claim for this scaffold."

      - name: favorable_report_is_guarded_by_a_state_field_of_a_different_entity
        claim_type: guarded transitions
        grounds:
          - state_machines.CommitteeReferral.IN_COMMITTEE_to_REPORTED_FAVORABLE.preconditions
          - validations.priority_140
        distinguishing_aspect: "The referral's own status is IN_COMMITTEE and its deadline is intact, yet the transition is refused purely because of a field on the parent Bill — the canonical 'A -> B only if entity C is in state X' guard."
        excluded_because:
          difficulty_instance: favorable_committee_report_blocked_until_the_bills_fiscal_status_reaches_note_complete
          rationale: "That §1.8 instance refuses the FAVORABLE report with ERR_FISCAL_NOTE_REQUIRED while bill.fiscal_status is NOTE_PENDING, then replays the identical call after certification and gets a success, covering both sides of the guard."

