            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /draft-orders/${draft_id}/qualify"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-9"
            - call: "GET /qdro-cases/${case_id}/alternate-payee-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { ap_id: "$.data[0].id", ap_status0: "$.data[0].status", ap_bal0: "$.data[0].balance_cents", ap_v0: "$.data[0].version" }
          trigger:
            - call: "POST /alternate-payee-accounts/${ap_id}/distributions"
              payload: { expected_ap_account_version: "${ap_v0}", election: "CASH", gross_amount_cents: 400000 }
              as: AlternatePayee
              as_user_id: "${ap_id}"
              captures: { dist_id: $.data.id, dist_status: $.data.status, net: $.data.net_amount_cents, wh: $.data.federal_withheld_cents, fee: $.data.admin_fee_cents, code: $.data.distribution_code }
            - call: "GET /alternate-payee-accounts/${ap_id}"
              payload: {}
              as: PlanAdministrator
              captures: { ap_status1: $.data.status, ap_bal1: $.data.balance_cents, ap_v1: $.data.version }
            - call: "POST /alternate-payee-accounts/${ap_id}/distributions"
              payload: { expected_ap_account_version: "${ap_v1}", election: "CASH", gross_amount_cents: 1 }
              as: AlternatePayee
              as_user_id: "${ap_id}"
              captures: { e_closed_dist: $.data.error_id }
