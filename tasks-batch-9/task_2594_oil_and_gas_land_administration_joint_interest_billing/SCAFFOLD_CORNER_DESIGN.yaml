  # ============================================================================
  # Section 2 - State machines (claim-extraction-guide "From Table 2")
  # ============================================================================
  - section: state_machines
    instances:
      - name: lease_extension_advances_the_primary_term_by_the_option_months
        claim_type: valid_transition
        grounds:
          - state_machines.Lease.PRIMARY_TERM_to_PRIMARY_TERM
          - endpoints.POST_/land-admin/leases/{lease_id}/extension
          - entities.Lease.fields.extension_bonus_paid_cents
          - validations[priority=75, error_id=ERR_EXTENSION_BONUS_MISMATCH]
        distinguishing_aspect: |
          The extension is a self-loop on the tenure dimension: L-001 stays PRIMARY_TERM while
          primary_term_end_date moves 2026-09-30 -> 2028-09-30 (24 option months),
          extension_exercised flips to true and extension_bonus_paid_cents becomes 9600000
          = round_half_up(640.00 * 15000).
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z"
            - "Lease L-001: 640.00 gross acres, primary term 2026-09-30, extension_option_months 24, extension_bonus_per_acre_cents 15000, extension_exercised false"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-001", lessor_name: "Alpha Minerals", gross_acres: 640.00, royalty_rate: 0.187500, primary_term_end_date: "2026-09-30", extension_option_months: 24, extension_bonus_per_acre_cents: 15000 }
              as: LandAdministrator
              captures: { lease1_id: $.data.id }
          trigger:
            - call: "POST /land-admin/leases/${lease1_id}/extension"
              payload: { bonus_paid_cents: 9600000 }
              as: LandAdministrator
          assert:
            - "HTTP 200"
            - "Lease.${lease1_id}.primary_term_end_date == 2028-09-30"
            - "Lease.${lease1_id}.extension_exercised == true"
            - "Lease.${lease1_id}.extension_bonus_paid_cents == 9600000"
            - "Lease.${lease1_id}.tenure_status == PRIMARY_TERM and obligation_status == COMPLIANT"
            - "Lease.${lease1_id}.version == 2"

      - name: drilling_a_well_before_pooling_effectuation_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Well.PROPOSED_to_DRILLING
          - validations[priority=50, error_id=ERR_WELL_NOT_POOLED]
          - endpoints.POST_/land-admin/wells/{well_id}/status-changes
        distinguishing_aspect: |
          PROPOSED -> DRILLING is a declared transition, but its pooling_status == POOLED_EFFECTIVE
          precondition is unmet while the unit is still POOLED_FORMING, so the call fails with
          ERR_WELL_NOT_POOLED 409 and spud_date stays null.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z"
            - "Leases L-001 (640.00 acres) and L-002 (320.00 acres)"
            - "Well Sandstone 1H with 480.00 acres from L-001 and 160.00 from L-002, pooling_status POOLED_FORMING (effectuation never called)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-001", lessor_name: "Alpha Minerals", gross_acres: 640.00, royalty_rate: 0.187500, primary_term_end_date: "2026-09-30" }
              as: LandAdministrator
              captures: { lease1_id: $.data.id }
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-002", lessor_name: "Beta Royalties", gross_acres: 320.00, royalty_rate: 0.250000, primary_term_end_date: "2027-12-31" }
              as: LandAdministrator
              captures: { lease2_id: $.data.id }
            - call: "POST /land-admin/wells"
              payload: { well_name: "Sandstone 1H", api_number: "42-123-45678", product_type: "OIL", total_depth_ft: 9500 }
              as: LandAdministrator
              captures: { well_id: $.data.id }
            - call: "POST /land-admin/wells/${well_id}/lease-allocations"
              payload: { lease_id: "${lease1_id}", committed_acres: 480.00 }
              as: LandAdministrator
            - call: "POST /land-admin/wells/${well_id}/lease-allocations"
              payload: { lease_id: "${lease2_id}", committed_acres: 160.00 }
              as: LandAdministrator
          trigger:
            - call: "POST /land-admin/wells/${well_id}/status-changes"
              payload: { to_status: "DRILLING", effective_date: "2026-07-10" }
              as: LandAdministrator
          assert:
            - "HTTP 409 with data.error_id == \"ERR_WELL_NOT_POOLED\""
            - "Well.${well_id}.well_status == PROPOSED and pooling_status == POOLED_FORMING"
            - "Well.${well_id}.spud_date == null"
            - "Well.${well_id}.version is unchanged by the rejected call"

      - name: moving_a_well_to_producing_without_an_operator_interest_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Well.DRILLING_to_PRODUCING
          - validations[priority=55, error_id=ERR_NO_OPERATOR_INTEREST]
          - entities.WellInterest.fields.is_operator
        distinguishing_aspect: |
          DRILLING -> PRODUCING requires an ACTIVE WellInterest with is_operator true; a well whose
          only holder is a non-operator at 0.300000 fails with ERR_NO_OPERATOR_INTEREST 409 and
          first_production_date stays null - a different precondition of the same state machine than
          the pooling check above.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z"
            - "Leases L-001 (640.00 acres) and L-002 (320.00 acres)"
            - "Well Sandstone 1H, POOLED_EFFECTIVE and DRILLING, carrying one ACTIVE WellInterest for OA at WI 0.300000 with is_operator false"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-001", lessor_name: "Alpha Minerals", gross_acres: 640.00, royalty_rate: 0.187500, primary_term_end_date: "2026-09-30" }
              as: LandAdministrator
              captures: { lease1_id: $.data.id }
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-002", lessor_name: "Beta Royalties", gross_acres: 320.00, royalty_rate: 0.250000, primary_term_end_date: "2027-12-31" }
              as: LandAdministrator
              captures: { lease2_id: $.data.id }
            - call: "POST /land-admin/wells"
              payload: { well_name: "Sandstone 1H", api_number: "42-123-45678", product_type: "OIL", total_depth_ft: 9500 }
              as: LandAdministrator
              captures: { well_id: $.data.id }
            - call: "POST /land-admin/wells/${well_id}/lease-allocations"
              payload: { lease_id: "${lease1_id}", committed_acres: 480.00 }
              as: LandAdministrator
            - call: "POST /land-admin/wells/${well_id}/lease-allocations"
              payload: { lease_id: "${lease2_id}", committed_acres: 160.00 }
              as: LandAdministrator
            - call: "POST /land-admin/interest-owners"
              payload: { owner_name: "Delta Partners LP", owner_type: "WORKING_INTEREST_PARTNER", contact_email: "delta@example.com", tax_id_on_file: true, bond_posted_cents: 10000000 }
              as: LandAdministrator
              captures: { oa_id: $.data.id }
            - call: "GET /land-admin/wells/${well_id}"
              payload: {}
              as: LandAdministrator
              captures: { wv1: $.data.version }
            - call: "POST /land-admin/wells/${well_id}/interests"
              payload: { owner_id: "${oa_id}", working_interest_pct: 0.300000, net_revenue_interest_pct: 0.240000, effective_from: "2026-01-01", expected_well_version: "${wv1}", is_operator: false }
              as: LandAdministrator
            - call: "POST /land-admin/wells/${well_id}/pooling-effectuation"
              payload: { effective_date: "2026-04-01" }
              as: LandAdministrator
            - call: "POST /land-admin/wells/${well_id}/status-changes"
              payload: { to_status: "DRILLING", effective_date: "2026-07-10" }
              as: LandAdministrator
          trigger:
            - call: "POST /land-admin/wells/${well_id}/status-changes"
              payload: { to_status: "PRODUCING", effective_date: "2026-07-10" }
              as: LandAdministrator
          assert:
            - "HTTP 409 with data.error_id == \"ERR_NO_OPERATOR_INTEREST\""
            - "Well.${well_id}.well_status == DRILLING"
            - "Well.${well_id}.first_production_date == null"

