              payload: { result: "NEGATIVE" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /inspection/establishments/${est_id}"
              as: DistrictManager
              captures: { cat_mid: $.data.pathogen_category }
          trigger:
            - call: "POST /inspection/pathogen-samples/${s10}/record-result"
              payload: { result: "NEGATIVE" }
              as: Inspector
              as_user_id: "${insp_id}"
          assert:
            - "captured cat_mid == null (9 resulted samples is below MIN_SAMPLES_FOR_CATEGORIZATION == 10)"
            - "after the 10th result: Establishment.${est_id}.pathogen_category == CAT_2"
            - "positive_rate 1/10 == 0.10 is <= SALMONELLA_STANDARD_RATE 0.10 (not CAT_3) and > 0.05 half-standard (not CAT_1)"
            - "GET /inspection/establishments/${est_id}/enforcement-actions returns exactly 0 rows"

      - name: compliance_score_per_family_rounding_order
        grounds:
          - calculations.monthly_compliance_score
          - entities.Establishment.fields.compliance_score
        distinguishing_aspect: "Mode (b) nested rounding: per-family penalty round_half_up(open*10/3, 1) BEFORE summation yields 100-(3.3+3.3+3.3) == 90.1; the non-conformant sum-then-round order yields 90.0 — the pinned order decides the tenth."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Establishment granted. Exactly one OPEN NR in each of SANITATION, HACCP and HUMANE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /inspection/establishments"
              payload: { name: "D4 Mixed Plant", species_classes: ["CATTLE"], slaughter_capable: false }
              as: ProgramAdministrator
              captures: { est_id: $.data.id }
            - call: "POST /inspection/inspectors"
              payload: { full_name: "Ina Inspector", badge_number: "B-4001", species_qualifications: ["CATTLE"] }
              as: ProgramAdministrator
              captures: { insp_id: $.data.id }
            - call: "POST /inspection/noncompliance-records"
              payload: { establishment_id: "${est_id}", issued_by_inspector_id: "${insp_id}", regulation_family: "SANITATION", description: "condensate over exposed product", observed_at: "2026-09-01T06:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection/noncompliance-records"
              payload: { establishment_id: "${est_id}", issued_by_inspector_id: "${insp_id}", regulation_family: "HACCP", description: "missed ccp check", observed_at: "2026-09-01T07:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection/noncompliance-records"
              payload: { establishment_id: "${est_id}", issued_by_inspector_id: "${insp_id}", regulation_family: "HUMANE", description: "no water in truck", observed_at: "2026-09-01T08:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "GET /inspection/establishments/${est_id}"
              as: DistrictManager
          assert:
            - "Establishment.${est_id}.compliance_score == 90.1"
            - "Establishment.${est_id}.compliance_score != 90.0 (the sum-then-round alternative)"
            - "Establishment.${est_id}.open_nr_count == 3"

      - name: enforcement_priority_base_tier_then_bonus
        grounds:
          - calculations.enforcement_priority_score
          - entities.Establishment.fields.enforcement_priority_score
        distinguishing_aspect: "Mode (c) pinned evaluation order: base 10*4 + 25*2 == 90 selects MEDIUM tier (bonus 10) because the tier is derived from base ALONE; score == 100. Deriving the tier from the post-bonus score would reclassify 100 as HIGH (+15) and yield 105."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Establishment granted with 4 OPEN NRs and suspension_count == 2 (two egregious humane confirmations, each auto-suspension lifted with abatement evidence)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /inspection/establishments"
              payload: { name: "D5 Beef Plant", species_classes: ["CATTLE"], slaughter_capable: true }
              as: ProgramAdministrator
              captures: { est_id: $.data.id }
            - call: "POST /inspection/grant-applications"
              payload: { establishment_id: "${est_id}", facility_doc_ref: "doc-fac-1", sanitation_plan_ref: "doc-san-1", haccp_plan_ref: "doc-hac-1" }
              as: EstablishmentManager
              as_user_id: "${est_id}"
              captures: { ga_d5: $.data.id }
            - call: "POST /inspection/grant-applications/${ga_d5}/begin-review"
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_d5}/record-adequacy"
              payload: { dimension: "FACILITY", finding: "ADEQUATE" }
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_d5}/record-adequacy"
              payload: { dimension: "SANITATION", finding: "ADEQUATE" }
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_d5}/record-adequacy"
              payload: { dimension: "HACCP", finding: "ADEQUATE" }
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_d5}/decide"
              payload: { decision: "GRANT" }
              as: DistrictManager
            - call: "POST /inspection/inspectors"
              payload: { full_name: "Ina Inspector", badge_number: "B-5001", species_qualifications: ["CATTLE"] }
              as: ProgramAdministrator
              captures: { insp_a: $.data.id }
            - call: "POST /inspection/inspectors"
              payload: { full_name: "Sue Supervisor", badge_number: "B-5002", species_qualifications: ["CATTLE"] }
              as: ProgramAdministrator
              captures: { insp_b: $.data.id }
            - call: "POST /inspection/noncompliance-records"
              payload: { establishment_id: "${est_id}", issued_by_inspector_id: "${insp_a}", regulation_family: "SANITATION", description: "nr one", observed_at: "2026-08-28T06:00:00Z" }
              as: Inspector
              as_user_id: "${insp_a}"
            - call: "POST /inspection/noncompliance-records"
              payload: { establishment_id: "${est_id}", issued_by_inspector_id: "${insp_a}", regulation_family: "HACCP", description: "nr two", observed_at: "2026-08-28T07:00:00Z" }
              as: Inspector
              as_user_id: "${insp_a}"
            - call: "POST /inspection/noncompliance-records"
              payload: { establishment_id: "${est_id}", issued_by_inspector_id: "${insp_a}", regulation_family: "OTHER", description: "nr three", observed_at: "2026-08-28T08:00:00Z" }
              as: Inspector
              as_user_id: "${insp_a}"
            - call: "POST /inspection/noncompliance-records"
              payload: { establishment_id: "${est_id}", issued_by_inspector_id: "${insp_a}", regulation_family: "LABELING", description: "nr four", observed_at: "2026-08-28T09:00:00Z" }
              as: Inspector
              as_user_id: "${insp_a}"
            - call: "POST /inspection/humane-handling-events"
              payload: { establishment_id: "${est_id}", reported_by_inspector_id: "${insp_a}", species: "CATTLE", severity: "EGREGIOUS", observed_at: "2026-08-29T06:00:00Z", description: "conscious animal hoisted" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { ev1: $.data.id }
            - call: "POST /inspection/humane-handling-events/${ev1}/confirm"
              as: SupervisoryReviewer
              as_user_id: "${insp_b}"
            - call: "GET /inspection/establishments/${est_id}/enforcement-actions"
              as: DistrictManager
              captures: { ea1: "$.data[0].id" }
            - call: "POST /inspection/enforcement-actions/${ea1}/lift"
              payload: { abatement_evidence: "abatement plan implemented and verified on site" }
              as: DistrictManager
            - call: "POST /inspection/humane-handling-events"
              payload: { establishment_id: "${est_id}", reported_by_inspector_id: "${insp_a}", species: "CATTLE", severity: "EGREGIOUS", observed_at: "2026-08-30T06:00:00Z", description: "second egregious event" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { ev2: $.data.id }
            - call: "POST /inspection/humane-handling-events/${ev2}/confirm"
              as: SupervisoryReviewer
              as_user_id: "${insp_b}"
            - call: "GET /inspection/establishments/${est_id}/enforcement-actions"
              as: DistrictManager
              captures: { ea2: "$.data[1].id" }
            - call: "POST /inspection/enforcement-actions/${ea2}/lift"
              payload: { abatement_evidence: "second abatement plan verified on site" }
              as: DistrictManager
          trigger:
            - call: "GET /inspection/establishments/${est_id}"
              as: DistrictManager
          assert:
            - "Establishment.${est_id}.open_nr_count == 4 and suspension_count == 2"
            - "Establishment.${est_id}.enforcement_priority_score == 100"
            - "Establishment.${est_id}.enforcement_priority_score != 105 (the post-bonus-tier alternative)"
            - "Establishment.${est_id}.inspection_status == ACTIVE (both suspensions lifted)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: establishment_parallel_grant_and_inspection_dimensions
        grounds:
          - state_machines.Establishment
          - state_machines.EnforcementAction.PROPOSED_to_IN_EFFECT
          - state_machines.EnforcementAction.IN_EFFECT_to_LIFTED
        distinguishing_aspect: "Establishment carries two independent state dimensions on one row: the grant dimension (UNGRANTED -> GRANTED) holds at GRANTED while the inspection dimension cycles ACTIVE -> SUSPENDED -> ACTIVE; the sibling instance is a cycle on NoncomplianceRecord, a different entity."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Establishment created, then granted, then suspended via an egregious humane confirmation, then reinstated via lift. Intermediate dimension combinations are captured after each step."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /inspection/establishments"
