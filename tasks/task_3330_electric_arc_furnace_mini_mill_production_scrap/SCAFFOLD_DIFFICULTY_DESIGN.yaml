              captures: { heat_1: $.data.id }
            - call: "POST /mills/${mill_id}/heats"
              payload: { heat_number: "H-2", grade_id: "${grade_a}", target_tap_weight_tons: 8, planned_tap_at: "2026-09-15T11:00:00Z" }
