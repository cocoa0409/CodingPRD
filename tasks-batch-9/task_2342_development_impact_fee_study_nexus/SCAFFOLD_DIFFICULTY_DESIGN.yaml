  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: assessment_requires_an_effective_study_in_the_program
        grounds:
          - validations[priority=25]
          - state_machines.DevelopmentApplication.assessment_status=UNASSESSED_to_assessment_status=ASSESSED
          - entities.DevelopmentApplication.fields.pinned_fee_study_id
          - errors.ERR_NO_EFFECTIVE_STUDY
        distinguishing_aspect: |
          The application row is complete and self-consistent; whether assess succeeds
          depends entirely on a different entity's state. With the program's only study
          still ADOPTED the identical call returns 409 ERR_NO_EFFECTIVE_STUDY and leaves
          the application UNASSESSED with pinned_fee_study_id null; the moment that study
          reaches EFFECTIVE the same call assesses 5,189,521 - nothing about the
          application changed between the two attempts.
        test_recipe:
          setup:
            - "HARBOR program with PARKS and ROADS standards and one ADOPTED study whose effective_at is 2026-04-16T00:00:00Z."
            - "A 10-dwelling SINGLE_FAMILY PERMIT application BP-1001 filed by dev-1 and never assessed."
            - "Logical clock at 2026-04-16T00:00:00Z, so the effective date has been reached but nobody has activated the study yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-programs"
              payload: { name: "City of Harbor Impact Fee Program", jurisdiction_code: "HARBOR" }
