          schedule_risk_band is derived at read time from days-to-deadline and staffing
          completion, so moving only the clock — no engagement write, no version bump — turns
          the same unstaffed engagement from LOW (73 days out) into HIGH (14 days out, below
          60.00% complete).
        test_recipe:
          setup:
            - "Clock at 2026-08-03T09:00:00Z; MERIDIAN client, DOMESTIC partner P1."
            - "Engagement E1 with deadline_date 2026-10-15 and no phases, so staffing_completion_pct is 0.00 and client_block_count is 0."
          setup_api_calls:
            - call: "POST /scheduling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /scheduling/clients"
              payload: { name: "Meridian Manufacturing", industry_code: "MANUFACTURING", public_interest_entity: false, fiscal_year_end: "2026-12-31" }
              as: FirmAdmin
              captures: { c_id: $.data.id }
            - call: "POST /scheduling/staff-members"
              payload: { full_name: "Pat Rowe", level: "PARTNER", service_center: "DOMESTIC", industry_specialization: "MANUFACTURING", cpa_licensed: true, base_weekly_cap_hours: 45.00, hourly_bill_rate: 400.00 }
