      # ---- publish retires prior PUBLISHED script (cross-record side effect)
      - name: publish_retires_prior_published_script
        claim_type: Side Effect Execution
        grounds:
          - endpoints.POST_/va/call-scripts/{scriptId}/publish
          - entities.CallScript.fields.status
        distinguishing_aspect: "Publishing a second DRAFT script for an account flips the account's prior PUBLISHED script to RETIRED."
        test_recipe:
          setup:
            - "Account with one PUBLISHED script; a second DRAFT script created."
          setup_api_calls:
            - call: "POST /va/service-plans"
              payload: { name: "Ppub", billing_model: "PER_CALL", base_fee_cents: 0, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 100000, included_calls: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Pub", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /va/call-scripts"
              payload: { account_id: "${acct_id}", greeting_en: "first", business_open_minute: 0, business_close_minute: 1440 }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { script1: $.data.id }
            - call: "POST /va/call-scripts/${script1}/publish"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /va/call-scripts"
              payload: { account_id: "${acct_id}", greeting_en: "second", business_open_minute: 0, business_close_minute: 1440 }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { script2: $.data.id }
          trigger:
            - call: "POST /va/call-scripts/${script2}/publish"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { s2_status: $.data.status }
            - call: "GET /va/call-scripts/${script1}"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { s1_status: $.data.status }
          assert:
            - "CallScript.${script2}.status == \"PUBLISHED\""
            - "CallScript.${script1}.status == \"RETIRED\""

      # ---- excluded_because stubs (already covered by §1.8)
      - name: complete_call_suspend_cascade_stub
        claim_type: Cascade down
        grounds:
          - state_machines.ClientAccount.status.ACTIVE_to_SUSPENDED
        excluded_because:
          difficulty_instance: transitive_cascade / complete_call_suspends_account_cancels_appointments
          rationale: "The SUSPEND-cancels-appointments cascade is asserted end-to-end by the named §1.8 depth-4 cascade instance."

      - name: adjust_compensation_ledger_stub
        claim_type: Compensation
        grounds:
          - state_machines.Call.billing_status.DISPUTED_to_ADJUSTED
        excluded_because:
          difficulty_instance: compensating_invariant / adjust_preserves_consumed_units_ledger_invariant
          rationale: "Adjust's ledger compensation (consumed_units conservation) is the subject of the named §1.8 invariant instance."

  # ===========================================================================
  - section: calculations
    instances:
      # ---- call_charge per_call variant flat unit
      - name: per_call_charge_is_one_unit_regardless_of_duration
        claim_type: Variant Selection
        grounds:
          - calculations.call_charge
          - entities.ServicePlan.fields.billing_model
          - entities.Call.fields.billed_units
        distinguishing_aspect: "On a PER_CALL plan, a completed call bills billed_units == 1 regardless of duration_seconds."
        test_recipe:
          setup:
            - "PER_CALL plan included_calls=100 (no overage); a 121s answered+completed call."
