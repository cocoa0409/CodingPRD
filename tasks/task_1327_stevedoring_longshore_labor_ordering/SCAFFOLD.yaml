    roles: [StevedoreSuperintendent]
    code: 200
    input: []
    output: ShiftWindow
    side_effects: ["status -> OPEN_FOR_ORDERS"]
  - method: POST
    path: "/api/shift-windows/{id}/start"
    description: "Start a shift (OPEN_FOR_ORDERS -> IN_PROGRESS); first start berths-to-working the vessel"
