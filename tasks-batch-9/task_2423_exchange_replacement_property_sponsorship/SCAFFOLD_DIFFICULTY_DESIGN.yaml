    distinguishing_aspect: 'CLOSED interval semantics on the Property as the contended resource — the opposite convention from the distribution rule: a successor lease starting on 2033-08-31, the incumbent''s last day, is rejected because [start, end] includes both endpoints, while one starting 2033-09-01 is accepted.'
