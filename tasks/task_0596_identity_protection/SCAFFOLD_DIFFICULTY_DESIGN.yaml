              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /idp/subscribers"
              payload: { email: "bp2@example.com", full_name: "Ione Wren", date_of_birth: "1996-10-10", ssn_last4: "5678", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { sub_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /idp/subscribers/${sub_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
          trigger:
            - call: "GET /idp/subscribers/${sub_id}/credit-summary"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { composite: $.data.composite_credit_score, scored: $.data.scored_bureau_count }
          assert:
            - "credit-summary.composite_credit_score == null  # NOT 0"
            - "credit-summary.baseline_composite_credit_score == null"
            - "credit-summary.bureau_count == 3"
            - "credit-summary.scored_bureau_count == 0"
