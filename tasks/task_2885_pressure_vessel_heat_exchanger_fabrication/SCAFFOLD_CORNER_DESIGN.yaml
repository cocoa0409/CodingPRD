            - "GET /nde-exams?method=RT&result=PENDING with limit 10 and offset 0 returns total_count == 3 across the whole job"
            - "No MT or PT examination exists: GET /nde-exams?method=MT with limit 10 and offset 0 returns total_count == 0 (category B BUTT joints on a ferritic heat owe no surface method)"

      - name: calculation_required_wall_thickness_variant_divergence_and_governing_choice
        claim_type: Variant Divergence
        grounds:
          - calculations.required_wall_thickness
          - entities.DesignCalculation.fields.governing_variant
        excluded_because:
          difficulty_instance: dual_variant_shell_thickness_circumferential_vs_longitudinal
          rationale: "That §1.8 instance is built precisely on the divergence: it drives the same job through both variant regimes, asserts the two per-variant fields and the delta between them, and shows governing_variant switching, including the rule that the allowance is added before the single rounding step."

      - name: calculation_test_pressure_variant_selected_by_test_medium
        claim_type: Variant Selection
        grounds:
          - calculations.test_pressure
          - entities.PressureTest.fields.required_test_pressure_psi
        excluded_because:
          difficulty_instance: dual_variant_test_pressure_hydrostatic_vs_pneumatic
          rationale: "Variant selection here is contextual — the HYDROSTATIC multiplier 1.3 versus the PNEUMATIC multiplier 1.1, with different hold times and medium-temperature floors — and that instance creates one test of each kind on the same job to assert both selections and both derived floors."

      - name: calculation_nde_coverage_decision_matrix_over_all_declared_axes
        claim_type: Correct Result
        grounds:
          - calculations.nde_coverage_requirement
        excluded_because:
          difficulty_instance: combinatorial_nde_coverage_matrix_over_division_category_thickness_and_material
          rationale: "The decision_matrix rows are enumerated cell by cell in that §1.8 instance across design_code, joint_category, rt_extent_declared, thickness and material_class, which is a strict superset of any single Correct Result corner for this calculation."

      - name: calculation_data_package_weighted_scoring_sums_to_one_hundred
        claim_type: Correct Result
        grounds:
          - calculations.data_package_completeness
          - entities.DataReport.fields.completeness_score
          - entities.DataReport.fields.section_scores
        excluded_because:
          difficulty_instance: combinatorial_data_package_completeness_per_section_rounding_order
          rationale: "That instance walks the six weighted sections independently, asserting each section score, the missing_items list and the 2-decimal rounding of the weighted sum, including the partial-credit cells — the whole weighted_scoring surface."

      - name: calculation_material_balance_aggregation_after_reversal
        claim_type: Correct Result
        grounds:
          - calculations.material_balance
          - entities.MaterialHeat.fields.quantity_remaining_lb
        excluded_because:
          difficulty_instance: compensating_invariant_heat_mass_conserved_across_issue_scrap_reissue
          rationale: "The aggregation row for material_balance is exactly the running-total-after-add and after-reversal claim, which that instance asserts at every step together with the depletion boundary at exactly 0.00."

      - name: calculation_test_pressure_reconciliation_when_the_medium_changes
        claim_type: Reconciliation
        grounds:
          - calculations.test_pressure
          - entities.PressureTest.fields[required_pressure_psi]
          - entities.PressureTest.fields[required_hold_minutes]
          - entities.PressureTest.fields[required_medium_temp_f]
        excluded_because:
          difficulty_instance: dual_variant_test_pressure_hydrostatic_vs_pneumatic
          rationale: "The scaffold has no provisional-to-final variant switch on an existing row: test_type is fixed at creation and a change of medium means a new PressureTest, so the only observable reconciliation is that the second test's three required values are re-derived on the other branch from the same job inputs. That §1.8 instance already schedules both media against one job and asserts the full delta (455.0 psi / 30 min / mdmt+30 against 1.1x / 60 min / mdmt+60), which is exactly the reconciliation this row asks for."

      - name: calculation_pwht_soak_minimum_floor_constant
        claim_type: Constants Applied
        grounds:
          - calculations.pwht_soak_requirement
          - entities.PWHTBatch.fields.required_soak_minutes
        excluded_because:
          difficulty_instance: priority_pair_empty_weld_set_outranks_furnace_window_conflict
          rationale: "The soak constants are asserted there on the surviving cell of the truth table — governing_thickness_in 0.5000 yielding required_soak_minutes 30 by round_half_up(0.5000 * 60), explicitly noted as above the MINIMUM_SOAK_MINUTES floor of 15 — and the insufficient-soak boundary is asserted in cross_entity_pressure_test_creation_blocked_by_incomplete_pwht_batch at 44 against 45 minutes."

  - section: validations
    instances:
      - name: validation_mtr_acceptance_at_exact_spec_minimum_is_admitted
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=66]
          - state_machines.MaterialHeat.transitions[QUARANTINE->ACCEPTED].preconditions
          - endpoints[POST /material-heats/{heat_id}/mtr-review]
        distinguishing_aspect: "The spec-minimum comparison is greater-than-or-equal: an SA-516-70 heat certified at exactly 38.0 ksi yield and 70.0 ksi tensile — the published minima — must be ACCEPTED, so an implementation using a strict inequality is caught on the satisfying side of the rule."
        test_recipe:
          setup:
            - "Heat H-5900 (SA-516-70, PLATE, 2000.00 lb) is at QUARANTINE with mtr_received true and certified values exactly at the spec minima."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Quinn Park", role_code: "QC_INSPECTOR", stamp_initials: "QP" }
              as: ShopAdmin
              captures: { qc1_id: $.data.id }
            - call: "POST /material-heats"
              payload: { heat_number: "H-5900", spec: "SA-516-70", form: "PLATE", mtr_received: true, mtr_certified_yield_ksi: 38.0, mtr_certified_tensile_ksi: 70.0, quantity_received_lb: 2000.00 }
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { heat_id: $.data.id }
          trigger:
            - call: "POST /material-heats/${heat_id}/mtr-review"
              payload: { decision: "ACCEPT" }
              as: QCInspector
              as_user_id: "${qc1_id}"
          assert:
            - "HTTP 200 and MaterialHeat.${heat_id}.status == ACCEPTED with version == 2"
            - "MaterialHeat.${heat_id}.material_class == FERRITIC, p_number == 1 and quantity_remaining_lb == 2000.00"
            - "GET /material-heats?status=ACCEPTED with limit 10 and offset 0 returns total_count == 1 and exactly ${heat_id}"

      - name: validation_mtr_one_notch_below_spec_minimum_is_refused
        claim_type: Violation → Error
        grounds:
          - validations[priority=66]
          - errors[ERR_MTR_BELOW_SPEC_MINIMUM]
          - state_machines.MaterialHeat.transitions[QUARANTINE->ACCEPTED].preconditions
        distinguishing_aspect: "Either certified property alone is disqualifying: 37.9 ksi yield with a conforming tensile, and 69.9 ksi tensile with a conforming yield, must both return ERR_MTR_BELOW_SPEC_MINIMUM 409 and leave the heat in QUARANTINE — the heat is not pushed to REJECTED, because only an explicit REJECT decision does that."
        test_recipe:
          setup:
            - "Two SA-516-70 PLATE heats are at QUARANTINE with mtr_received true: H-5901 certified 37.9 ksi yield / 75.0 ksi tensile, and H-5902 certified 41.0 ksi yield / 69.9 ksi tensile."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Quinn Park", role_code: "QC_INSPECTOR", stamp_initials: "QP" }
              as: ShopAdmin
              captures: { qc1_id: $.data.id }
            - call: "POST /material-heats"
              payload: { heat_number: "H-5901", spec: "SA-516-70", form: "PLATE", mtr_received: true, mtr_certified_yield_ksi: 37.9, mtr_certified_tensile_ksi: 75.0, quantity_received_lb: 2000.00 }
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { heat_low_yield: $.data.id }
            - call: "POST /material-heats"
              payload: { heat_number: "H-5902", spec: "SA-516-70", form: "PLATE", mtr_received: true, mtr_certified_yield_ksi: 41.0, mtr_certified_tensile_ksi: 69.9, quantity_received_lb: 2000.00 }
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { heat_low_tensile: $.data.id }
          trigger:
            - call: "POST /material-heats/${heat_low_yield}/mtr-review"
              payload: { decision: "ACCEPT" }
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { e_yield: $.data.error_id }
            - call: "POST /material-heats/${heat_low_tensile}/mtr-review"
              payload: { decision: "ACCEPT" }
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { e_tensile: $.data.error_id }
          assert:
            - "Both calls return HTTP 409"
            - "${e_yield} == ERR_MTR_BELOW_SPEC_MINIMUM (37.9 is below the 38 ksi yield minimum for SA-516-70)"
            - "${e_tensile} == ERR_MTR_BELOW_SPEC_MINIMUM (69.9 is below the 70 ksi tensile minimum for SA-516-70)"
            - "MaterialHeat.${heat_low_yield}.status == QUARANTINE with version == 1, and MaterialHeat.${heat_low_tensile}.status == QUARANTINE with version == 1"
            - "GET /material-heats?status=ACCEPTED with limit 10 and offset 0 returns total_count == 0"

      - name: validation_priority_ordering_role_gate_outranks_shape_gate
        claim_type: Priority Ordering
        grounds:
          - validations[priority=20]
          - validations[priority=25]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "One request violates two rules at once — a QCInspector calling a WeldingEngineer-only endpoint with an undeclared process enum — and the ladder must answer with the priority-20 authorization error (403), never the priority-25 shape error (400), so the body is never even parsed for an unauthorized caller."
        test_recipe:
          setup:
            - "A QC_INSPECTOR and a WELDING_ENGINEER Personnel row exist; no WPS row exists."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Quinn Park", role_code: "QC_INSPECTOR", stamp_initials: "QP" }
              as: ShopAdmin
              captures: { qc1_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Wes Iyer", role_code: "WELDING_ENGINEER", stamp_initials: "WI" }
              as: ShopAdmin
              captures: { we1_id: $.data.id }
          trigger:
            - call: "POST /wps"
              payload: { wps_number: "WPS-102", process: "TIG", base_metal_p_number: 1, filler_f_number: 4, thickness_min_in: 0.1875, thickness_max_in: 3.0000, position: "1G", pwht_required: false, preheat_min_f: 50, supporting_pqr_number: "PQR-102" }
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { e_both: $.data.error_id }
            - call: "POST /wps"
              payload: { wps_number: "WPS-102", process: "TIG", base_metal_p_number: 1, filler_f_number: 4, thickness_min_in: 0.1875, thickness_max_in: 3.0000, position: "1G", pwht_required: false, preheat_min_f: 50, supporting_pqr_number: "PQR-102" }
              as: WeldingEngineer
              as_user_id: "${we1_id}"
              captures: { e_shape_only: $.data.error_id }
          assert:
            - "First call: HTTP 403 and ${e_both} == ERR_ROLE_NOT_PERMITTED, even though the same body is also shape-invalid"
            - "Second call: HTTP 400 and ${e_shape_only} == ERR_INVALID_REQUEST, proving the masked priority-25 rule is genuinely live for a permitted caller"
            - "GET /wps with limit 10 and offset 0 returns total_count == 0 after both refusals"

      - name: validation_conditional_pwht_dimension_follows_the_wps_flag
        claim_type: Conditional validation
        grounds:
          - endpoints[POST /vessel-jobs/{job_id}/production-welds].side_effects
          - entities.WPS.fields.pwht_required
          - entities.ProductionWeld.fields.pwht_status
        distinguishing_aspect: "The PWHT dimension is opened only when the cited procedure demands it: two otherwise identical category C joints on the same job, one citing a pwht_required false procedure and one citing a pwht_required true procedure, must come back NOT_REQUIRED and PENDING respectively — the flag is read from the WPS, not from the joint or the job."
