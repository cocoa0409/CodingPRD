          - entities.Student.fields.active_enrollment_count
        distinguishing_aspect: "The contended resource is the STUDENT's period slot, and the interval semantics are HALF-OPEN on dates combined with EXACT period equality: an enrollment starting on the very day a pending drop takes effect is accepted (touching intervals do not overlap), a start one day earlier is rejected, and a same-period section that shares no meeting_day is accepted. Three probes around one boundary, all on the same student."
