  - rule_id: transitive_cascade
    instances:
      - name: audit_finalization_cascade_depth_four
        depth: 4
        trigger_endpoint: "POST /tower-colo/equipment-audits/{id}/finalize"
        chain: "AuditFinding OPEN->BILLED (L1) -> Tenant.outstanding_balance_cents rises (L2) -> Tenant.credit_status CURRENT->DELINQUENT (L3) -> MasterLeaseAgreement.application_privilege ENABLED->SUSPENDED and ColocationApplication UNDER_STRUCTURAL_REVIEW->ON_HOLD with Tower.open_review_count decremented (L4)"
        grounds:
          - state_machines.EquipmentAudit.IN_PROGRESS_to_FINALIZED
          - calculations.retroactive_unauthorized_billing
          - calculations.tenant_credit_status
          - state_machines.ColocationApplication.UNDER_STRUCTURAL_REVIEW_to_ON_HOLD
        distinguishing_aspect: |
          Each link is CAUSED BY the previous one and by nothing else in the request: the finding
          is billed because the audit finalized; the balance rises because the finding was billed;
          the credit status flips because the balance crossed 5000000; the master lease is
          suspended and the reviewing application is held because the credit status flipped. None
          of L2..L4 is reachable from the finalize call without its predecessor.
