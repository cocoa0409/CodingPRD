        distinguishing_aspect: "Against a 14-day span interval and QC_GRACE_DAYS 7, elapsed 14 days is QC_CURRENT, elapsed 21 days is still only QC_DUE and elapsed 22 days is QC_DELINQUENT - both band edges are inclusive and a clock advance alone moves the posture."
