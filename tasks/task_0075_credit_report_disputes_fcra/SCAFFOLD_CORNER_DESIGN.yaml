# =============================================================================
# Task 0075 — Credit Report Disputes (FCRA) — §1.9 Scaffold Corner Design
# Breadth probe: enumerates testable claims from SCAFFOLD.yaml §1.1–§1.7 not
# already covered by §1.8. section:/claim_type: values come from
# references/claim-extraction-guide.md. excluded_because stubs cite §1.8 by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_consumer_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Consumer.fields.email, entities.Consumer.fields.full_name, entities.Consumer.fields.ssn_last4]
        distinguishing_aspect: "POST /consumers with email/full_name/ssn_last4 -> 201, status defaults ACTIVE, id+created_at minted."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /consumers"
              payload: { email: "n1@x.com", full_name: "N One", ssn_last4: "1234" }
              as: Anonymous
              captures: { n1: $.data.id, n1_status: $.data.status }
          assert:
            - "Response status == 201 and Consumer.${n1}.status == 'ACTIVE' and $.data.id is a non-prefixed UUID"

      - name: create_tradeline_required_field_missing_returns_validation
        claim_type: Required Fields
        grounds: [entities.Tradeline.fields.balance_cents]
        distinguishing_aspect: "POST /tradelines without balance_cents -> ERR_VALIDATION (422); required input field with no default."
        test_recipe:
          setup: ["A consumer, furnisher, OPEN file."]
          setup_api_calls:
            - call: "POST /consumers"
              payload: { email: "n2@x.com", full_name: "N Two", ssn_last4: "2345" }
              as: Anonymous
              captures: { n2: $.data.id }
            - call: "POST /furnishers"
              payload: { name: "Bank N2", furnisher_type: "BANK" }
              as: Anonymous
              captures: { fn2: $.data.id }
            - call: "POST /credit-files"
              payload: { consumer_id: "${n2}", bureau_code: "EQUIFAX" }
              as: CreditBureau
              captures: { filen2: $.data.id }
          trigger:
            - call: "POST /tradelines"
              payload: { credit_file_id: "${filen2}", furnisher_id: "${fn2}", account_type: "REVOLVING", date_of_first_delinquency: "2021-01-01T00:00:00.000Z", reported_delinquency_date: "2021-01-01T00:00:00.000Z" }
              as: Furnisher
              as_user_id: "${fn2}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 422 and $.data.error_id == 'ERR_VALIDATION'"

      - name: invalid_delinquency_date_on_tradeline_create
        claim_type: Type Constraints
        grounds:
          - validations[priority=16]
          - entities.Tradeline.fields.reported_delinquency_date
        distinguishing_aspect: "reported_delinquency_date < DOFD on create -> ERR_INVALID_DELINQUENCY_DATE (422)."
        test_recipe:
          setup: ["A consumer, furnisher, OPEN file."]
          setup_api_calls:
            - call: "POST /consumers"
              payload: { email: "n3@x.com", full_name: "N Three", ssn_last4: "3456" }
              as: Anonymous
              captures: { n3: $.data.id }
            - call: "POST /furnishers"
              payload: { name: "Bank N3", furnisher_type: "BANK" }
              as: Anonymous
              captures: { fn3: $.data.id }
            - call: "POST /credit-files"
              payload: { consumer_id: "${n3}", bureau_code: "EQUIFAX" }
              as: CreditBureau
              captures: { filen3: $.data.id }
          trigger:
            - call: "POST /tradelines"
              payload: { credit_file_id: "${filen3}", furnisher_id: "${fn3}", account_type: "REVOLVING", balance_cents: 10000, date_of_first_delinquency: "2021-06-01T00:00:00.000Z", reported_delinquency_date: "2021-01-01T00:00:00.000Z" }
              as: Furnisher
              as_user_id: "${fn3}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 422 and $.data.error_id == 'ERR_INVALID_DELINQUENCY_DATE'"

      - name: get_consumer_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Consumer]
        distinguishing_aspect: "GET /consumers/{random-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /consumers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CreditBureau
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 404 and $.data.error_id == 'ERR_NOT_FOUND'"

      - name: tradeline_computed_fields_ignore_client_input
        claim_type: Computed Fields
        grounds: [entities.Tradeline.fields.reage_violation, entities.Tradeline.fields.purge_due_at]
        distinguishing_aspect: "reage_violation and purge_due_at are source: computed; they are derived server-side and any client-supplied value is ignored (not in input list)."
        test_recipe:
          setup: ["A consumer, furnisher, OPEN file."]
          setup_api_calls:
            - call: "POST /consumers"
              payload: { email: "n4@x.com", full_name: "N Four", ssn_last4: "4567" }
              as: Anonymous
              captures: { n4: $.data.id }
            - call: "POST /furnishers"
              payload: { name: "Bank N4", furnisher_type: "BANK" }
              as: Anonymous
              captures: { fn4: $.data.id }
            - call: "POST /credit-files"
              payload: { consumer_id: "${n4}", bureau_code: "EQUIFAX" }
              as: CreditBureau
              captures: { filen4: $.data.id }
          trigger:
            - call: "POST /tradelines"
              payload: { credit_file_id: "${filen4}", furnisher_id: "${fn4}", account_type: "REVOLVING", balance_cents: 10000, date_of_first_delinquency: "2020-03-01T00:00:00.000Z", reported_delinquency_date: "2020-03-01T00:00:00.000Z" }
              as: Furnisher
              as_user_id: "${fn4}"
              captures: { tn4: $.data.id, tn4_reage: $.data.reage_violation, tn4_purge: $.data.purge_due_at }
          assert:
            - "Tradeline.${tn4}.reage_violation == false and Tradeline.${tn4}.purge_due_at == '2027-08-27T00:00:00.000Z'"

      - name: notification_is_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Notification]
        distinguishing_aspect: "Notification has common_fields: false (id + created_at only); there is no PATCH endpoint and no version field — it is an append-only event log."
        test_recipe:
          setup: ["A file with one minted notification (from a freeze placement)."]
          setup_api_calls:
            - call: "POST /consumers"
              payload: { email: "n5@x.com", full_name: "N Five", ssn_last4: "5678" }
              as: Anonymous
              captures: { n5: $.data.id }
            - call: "POST /credit-files"
              payload: { consumer_id: "${n5}", bureau_code: "EQUIFAX" }
              as: CreditBureau
              captures: { filen5: $.data.id, filen5_v: $.data.version }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-05T00:00:00.000Z" }
              as: CreditBureau
            - call: "POST /security-freezes"
              payload: { credit_file_id: "${filen5}", freeze_type: "LOCK", effective_at: "2026-01-05T00:00:00.000Z", expected_credit_file_version: "${filen5_v}" }
              as: Consumer
              as_user_id: "${n5}"
          trigger:
            - call: "GET /credit-files/${filen5}/notifications"
              payload: {}
              as: Consumer
              as_user_id: "${n5}"
          assert:
            - "Response status == 200, response_type 'array', total_count >= 1; each Notification item has id and created_at but no version field"

      - name: flat_fk_integrity_credit_file_bad_consumer
        claim_type: Parent Relationships
        grounds: [entities.CreditFile.fields.consumer_id]
        distinguishing_aspect: "flat topology: POST /credit-files with a non-existent consumer_id FK -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /credit-files"
              payload: { consumer_id: "11111111-1111-4111-8111-111111111111", bureau_code: "EQUIFAX" }
              as: CreditBureau
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 404 and $.data.error_id == 'ERR_NOT_FOUND'"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: dispute_open_investigation_from_terminal_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Dispute.FILED_to_INVESTIGATING]
        distinguishing_aspect: "open-investigation on an already RESOLVED_VERIFY dispute -> ERR_INVALID_STATE; terminal-state lockdown."
        test_recipe:
          setup: ["A dispute resolved VERIFY (terminal)."]
          setup_api_calls:
            - call: "POST /consumers"
              payload: { email: "s1@x.com", full_name: "S One", ssn_last4: "1111" }
              as: Anonymous
              captures: { s1: $.data.id }
            - call: "POST /furnishers"
              payload: { name: "Bank S1", furnisher_type: "BANK" }
              as: Anonymous
              captures: { fs1: $.data.id }
            - call: "POST /credit-files"
              payload: { consumer_id: "${s1}", bureau_code: "EQUIFAX" }
              as: CreditBureau
              captures: { files1: $.data.id, files1_v: $.data.version }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-05T00:00:00.000Z" }
              as: CreditBureau
            - call: "POST /tradelines"
              payload: { credit_file_id: "${files1}", furnisher_id: "${fs1}", account_type: "REVOLVING", balance_cents: 20000, date_of_first_delinquency: "2021-01-01T00:00:00.000Z", reported_delinquency_date: "2021-01-01T00:00:00.000Z" }
              as: Furnisher
              as_user_id: "${fs1}"
              captures: { tls1: $.data.id }
            - call: "POST /disputes"
              payload: { credit_file_id: "${files1}", tradeline_id: "${tls1}", dispute_reason: "NOT_MINE", clock_mode: "CALENDAR", expected_credit_file_version: "${files1_v}" }
              as: Consumer
              as_user_id: "${s1}"
              captures: { ds1: $.data.id }
            - call: "POST /disputes/${ds1}/open-investigation"
              payload: {}
              as: CreditBureau
            - call: "POST /reverification-requests"
              payload: { dispute_id: "${ds1}", furnisher_id: "${fs1}" }
              as: CreditBureau
              captures: { rvs1: $.data.id }
            - call: "POST /reverification-requests/${rvs1}/respond"
              payload: { response_type: "VERIFY" }
              as: Furnisher
              as_user_id: "${fs1}"
          trigger:
            - call: "POST /disputes/${ds1}/open-investigation"
              payload: {}
              as: CreditBureau
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409 and $.data.error_id == 'ERR_INVALID_STATE'"

      - name: dispute_initial_state_is_filed
        claim_type: Initial State
        grounds: [state_machines.Dispute.initial_state]
        distinguishing_aspect: "A newly created Dispute starts in FILED with reopen_count 0."
        test_recipe:
          setup: ["Consumer, furnisher, OPEN file, one tradeline."]
          setup_api_calls:
            - call: "POST /consumers"
              payload: { email: "s2@x.com", full_name: "S Two", ssn_last4: "2222" }
              as: Anonymous
              captures: { s2: $.data.id }
            - call: "POST /furnishers"
              payload: { name: "Bank S2", furnisher_type: "BANK" }
              as: Anonymous
              captures: { fs2: $.data.id }
            - call: "POST /credit-files"
              payload: { consumer_id: "${s2}", bureau_code: "EQUIFAX" }
              as: CreditBureau
              captures: { files2: $.data.id, files2_v: $.data.version }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-05T00:00:00.000Z" }
              as: CreditBureau
            - call: "POST /tradelines"
              payload: { credit_file_id: "${files2}", furnisher_id: "${fs2}", account_type: "REVOLVING", balance_cents: 20000, date_of_first_delinquency: "2021-01-01T00:00:00.000Z", reported_delinquency_date: "2021-01-01T00:00:00.000Z" }
              as: Furnisher
              as_user_id: "${fs2}"
              captures: { tls2: $.data.id }
          trigger:
            - call: "POST /disputes"
              payload: { credit_file_id: "${files2}", tradeline_id: "${tls2}", dispute_reason: "NOT_MINE", clock_mode: "CALENDAR", expected_credit_file_version: "${files2_v}" }
              as: Consumer
              as_user_id: "${s2}"
              captures: { ds2: $.data.id, ds2_status: $.data.status, ds2_rc: $.data.reopen_count }
          assert:
            - "Dispute.${ds2}.status == 'FILED' and Dispute.${ds2}.reopen_count == 0"

      - name: reopen_limit_reached_on_third_reopen
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority=12]
          - entities.Dispute.fields.reopen_count
        distinguishing_aspect: "A third reopen (reopen_count already 2) -> ERR_REOPEN_LIMIT_REACHED (409)."
        test_recipe:
          setup: ["A dispute cycled through 2 reopens (reopen_count==2), currently at REVERIFYING."]
          setup_api_calls:
            - call: "POST /consumers"
              payload: { email: "s3@x.com", full_name: "S Three", ssn_last4: "3333" }
              as: Anonymous
              captures: { s3: $.data.id }
            - call: "POST /furnishers"
              payload: { name: "Bank S3", furnisher_type: "BANK" }
              as: Anonymous
              captures: { fs3: $.data.id }
            - call: "POST /credit-files"
              payload: { consumer_id: "${s3}", bureau_code: "EQUIFAX" }
              as: CreditBureau
              captures: { files3: $.data.id, files3_v: $.data.version }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-05T00:00:00.000Z" }
              as: CreditBureau
            - call: "POST /tradelines"
              payload: { credit_file_id: "${files3}", furnisher_id: "${fs3}", account_type: "REVOLVING", balance_cents: 20000, date_of_first_delinquency: "2021-01-01T00:00:00.000Z", reported_delinquency_date: "2021-01-01T00:00:00.000Z" }
              as: Furnisher
              as_user_id: "${fs3}"
              captures: { tls3: $.data.id }
            - call: "POST /disputes"
              payload: { credit_file_id: "${files3}", tradeline_id: "${tls3}", dispute_reason: "NOT_MINE", clock_mode: "CALENDAR", expected_credit_file_version: "${files3_v}" }
              as: Consumer
              as_user_id: "${s3}"
              captures: { ds3: $.data.id }
            - call: "POST /disputes/${ds3}/open-investigation"
              payload: {}
              as: CreditBureau
            - call: "POST /reverification-requests"
              payload: { dispute_id: "${ds3}", furnisher_id: "${fs3}" }
              as: CreditBureau
              captures: { rvs3a: $.data.id }
            - call: "POST /disputes/${ds3}/reopen"
              payload: {}
              as: Consumer
              as_user_id: "${s3}"
            - call: "POST /reverification-requests"
              payload: { dispute_id: "${ds3}", furnisher_id: "${fs3}" }
              as: CreditBureau
              captures: { rvs3b: $.data.id }
            - call: "POST /disputes/${ds3}/reopen"
              payload: {}
              as: Consumer
              as_user_id: "${s3}"
            - call: "POST /reverification-requests"
              payload: { dispute_id: "${ds3}", furnisher_id: "${fs3}" }
              as: CreditBureau
              captures: { rvs3c: $.data.id }
          trigger:
            - call: "POST /disputes/${ds3}/reopen"
              payload: {}
              as: Consumer
              as_user_id: "${s3}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409 and $.data.error_id == 'ERR_REOPEN_LIMIT_REACHED'"

      - name: redispute_corrected_tradeline_reporting_to_disputed
        claim_type: Valid Transition
        grounds: [state_machines.Tradeline.CORRECTED_to_DISPUTED]
        distinguishing_aspect: "A tradeline previously CORRECTED can be re-disputed: CORRECTED -> DISPUTED via a fresh POST /disputes."
        test_recipe:
          setup: ["A tradeline corrected by a furnisher MODIFY (status CORRECTED, no open dispute)."]
          setup_api_calls:
            - call: "POST /consumers"
              payload: { email: "s4@x.com", full_name: "S Four", ssn_last4: "4444" }
              as: Anonymous
              captures: { s4: $.data.id }
            - call: "POST /furnishers"
              payload: { name: "Bank S4", furnisher_type: "BANK" }
              as: Anonymous
              captures: { fs4: $.data.id }
            - call: "POST /credit-files"
              payload: { consumer_id: "${s4}", bureau_code: "EQUIFAX" }
              as: CreditBureau
              captures: { files4: $.data.id, files4_v0: $.data.version }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-05T00:00:00.000Z" }
              as: CreditBureau
            - call: "POST /tradelines"
              payload: { credit_file_id: "${files4}", furnisher_id: "${fs4}", account_type: "REVOLVING", balance_cents: 80000, date_of_first_delinquency: "2021-01-01T00:00:00.000Z", reported_delinquency_date: "2021-01-01T00:00:00.000Z" }
              as: Furnisher
              as_user_id: "${fs4}"
              captures: { tls4: $.data.id }
            - call: "POST /disputes"
              payload: { credit_file_id: "${files4}", tradeline_id: "${tls4}", dispute_reason: "INACCURATE_BALANCE", clock_mode: "CALENDAR", expected_credit_file_version: "${files4_v0}" }
              as: Consumer
              as_user_id: "${s4}"
              captures: { ds4: $.data.id }
            - call: "POST /disputes/${ds4}/open-investigation"
              payload: {}
              as: CreditBureau
            - call: "POST /reverification-requests"
              payload: { dispute_id: "${ds4}", furnisher_id: "${fs4}" }
              as: CreditBureau
              captures: { rvs4: $.data.id }
            - call: "POST /reverification-requests/${rvs4}/respond"
              payload: { response_type: "MODIFY", corrected_balance_cents: 30000 }
              as: Furnisher
              as_user_id: "${fs4}"
            - call: "GET /credit-files/${files4}"
              payload: {}
              as: CreditBureau
              captures: { files4_v1: $.data.version }
          trigger:
            - call: "POST /disputes"
              payload: { credit_file_id: "${files4}", tradeline_id: "${tls4}", dispute_reason: "PAID_IN_FULL", clock_mode: "CALENDAR", expected_credit_file_version: "${files4_v1}" }
              as: Consumer
              as_user_id: "${s4}"
              captures: { ds4b: $.data.id }
            - call: "GET /tradelines/${tls4}"
              payload: {}
              as: CreditBureau
              captures: { tls4_status: $.data.status }
          assert:
            - "Response status == 201 and Dispute.${ds4b}.status == 'FILED' and Tradeline.${tls4}.status == 'DISPUTED'"

      - name: duplicate_dispute_on_already_disputed_tradeline
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority=11]
          - state_machines.Tradeline.REPORTING_to_DISPUTED
        distinguishing_aspect: "Filing a second dispute on a tradeline that already has a non-terminal dispute -> ERR_DUPLICATE_DISPUTE (409)."
        test_recipe:
          setup: ["A tradeline with one open FILED dispute."]
          setup_api_calls:
            - call: "POST /consumers"
              payload: { email: "s5@x.com", full_name: "S Five", ssn_last4: "5555" }
              as: Anonymous
              captures: { s5: $.data.id }
            - call: "POST /furnishers"
              payload: { name: "Bank S5", furnisher_type: "BANK" }
              as: Anonymous
              captures: { fs5: $.data.id }
            - call: "POST /credit-files"
              payload: { consumer_id: "${s5}", bureau_code: "EQUIFAX" }
              as: CreditBureau
              captures: { files5: $.data.id, files5_v0: $.data.version }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-05T00:00:00.000Z" }
              as: CreditBureau
            - call: "POST /tradelines"
              payload: { credit_file_id: "${files5}", furnisher_id: "${fs5}", account_type: "REVOLVING", balance_cents: 20000, date_of_first_delinquency: "2021-01-01T00:00:00.000Z", reported_delinquency_date: "2021-01-01T00:00:00.000Z" }
              as: Furnisher
              as_user_id: "${fs5}"
              captures: { tls5: $.data.id }
            - call: "POST /disputes"
              payload: { credit_file_id: "${files5}", tradeline_id: "${tls5}", dispute_reason: "NOT_MINE", clock_mode: "CALENDAR", expected_credit_file_version: "${files5_v0}" }
              as: Consumer
              as_user_id: "${s5}"
              captures: { ds5: $.data.id }
            - call: "GET /credit-files/${files5}"
              payload: {}
              as: CreditBureau
              captures: { files5_v1: $.data.version }
          trigger:
            - call: "POST /disputes"
              payload: { credit_file_id: "${files5}", tradeline_id: "${tls5}", dispute_reason: "INACCURATE_BALANCE", clock_mode: "CALENDAR", expected_credit_file_version: "${files5_v1}" }
              as: Consumer
              as_user_id: "${s5}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409 and $.data.error_id == 'ERR_DUPLICATE_DISPUTE'"

      - name: complaint_premature_uphold_before_terminal_dispute
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority=15]
          - state_machines.RegulatoryComplaint.UNDER_REVIEW_to_UPHELD
        distinguishing_aspect: "Adjudicate UPHOLD while the referenced dispute is still INVESTIGATING (not in {AUTO_DELETED, RESOLVED_VERIFY}) -> ERR_COMPLAINT_PREMATURE (409)."
        test_recipe:
          setup: ["A SUBMITTED->UNDER_REVIEW complaint whose dispute is at INVESTIGATING."]
          setup_api_calls:
            - call: "POST /consumers"
              payload: { email: "s6@x.com", full_name: "S Six", ssn_last4: "6666" }
              as: Anonymous
              captures: { s6: $.data.id }
            - call: "POST /furnishers"
              payload: { name: "Bank S6", furnisher_type: "BANK" }
              as: Anonymous
              captures: { fs6: $.data.id }
            - call: "POST /credit-files"
              payload: { consumer_id: "${s6}", bureau_code: "EQUIFAX" }
              as: CreditBureau
              captures: { files6: $.data.id, files6_v: $.data.version }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-05T00:00:00.000Z" }
              as: CreditBureau
            - call: "POST /tradelines"
              payload: { credit_file_id: "${files6}", furnisher_id: "${fs6}", account_type: "REVOLVING", balance_cents: 20000, date_of_first_delinquency: "2021-01-01T00:00:00.000Z", reported_delinquency_date: "2021-01-01T00:00:00.000Z" }
              as: Furnisher
              as_user_id: "${fs6}"
              captures: { tls6: $.data.id }
            - call: "POST /disputes"
              payload: { credit_file_id: "${files6}", tradeline_id: "${tls6}", dispute_reason: "NOT_MINE", clock_mode: "CALENDAR", expected_credit_file_version: "${files6_v}" }
              as: Consumer
              as_user_id: "${s6}"
              captures: { ds6: $.data.id }
            - call: "POST /disputes/${ds6}/open-investigation"
              payload: {}
              as: CreditBureau
            - call: "POST /regulatory-complaints"
              payload: { dispute_id: "${ds6}", agency: "CFPB", narrative: "Bureau is stalling." }
              as: Consumer
