            - "data.error_id == ERR_STALE_VERSION"

      - name: stale_employer_version_on_occupy_returns_stale_version
        claim_type: violation_to_error
        grounds: ["concurrency_rules[seat-occupy-stale-employer]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Occupying a seat with expected_employer_version one behind the live Employer version (after a prior occupy bumped it) returns ERR_STALE_VERSION (412) via OCC on Employer.version."
        test_recipe:
          setup: ["Employer limit=5 with two OPEN seats. seat1 occupied (employer version bumped). Occupy seat2 carrying the pre-occupy stale employer version."]
