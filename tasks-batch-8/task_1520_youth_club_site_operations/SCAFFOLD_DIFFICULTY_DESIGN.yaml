              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /staff"
              payload: { site_id: "${site_id}", full_name: "Dir One", position: "DIRECTOR" }
              as: PlatformAdmin
              captures: { dir_id: $.data.id }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "BACKGROUND_CHECK", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "TRAINING", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Kid Y", date_of_birth: "2011-01-01", grade: 8, household_size: 1, household_income_cents: 1000000 }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m1: $.data.id }
            - { call: "POST /members/${m1}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PlatformAdmin }
            - call: "POST /behavior-incidents"
              payload: { member_id: "${m1}", incident_date: "2026-08-03", category: "LEVEL_2" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { inc1: $.data.id }
          trigger:
            - { call: "POST /behavior-incidents/${inc1}/adjudicate", payload: { outcome: "SUSTAINED", suspension_days: 1, suspension_start_date: "2026-08-03" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /club-days", payload: { site_id: "${site_id}", date: "2026-08-05" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - call: "POST /behavior-incidents"
              payload: { member_id: "${m1}", incident_date: "2026-08-05", category: "LEVEL_1" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { inc2: $.data.id }
            - { call: "POST /behavior-incidents/${inc2}/adjudicate", payload: { outcome: "SUSTAINED", suspension_days: 1, suspension_start_date: "2026-08-05" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /club-days", payload: { site_id: "${site_id}", date: "2026-08-07" }, as: SiteDirector, as_user_id: "${dir_id}" }
          assert:
            - "after first adjudicate: Member.${m1}.status == SUSPENDED (ACTIVE -> SUSPENDED)"
            - "after 2026-08-05 day open: Member.${m1}.status == ACTIVE (first suspension served; cycle back)"
            - "after second adjudicate: Member.${m1}.status == SUSPENDED again (re-entry proves the cycle)"
            - "after 2026-08-07 day open: Member.${m1}.status == ACTIVE; BehaviorIncident.${inc1}.suspension_status == SERVED and .${inc2}.suspension_status == SERVED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: credential_lapse_cancels_staff_assignment_flips_day_posture
        grounds:
          - state_machines.Staff.ACTIVE_to_ACTIVE
          - state_machines.RotationAssignment.CHECKED_IN_to_CANCELLED
          - calculations.club_day_posture
        distinguishing_aspect: |
          Depth-3 cascade triggered by a credential update (a different trigger
          than member withdrawal): POST /staff/{id}/credentials lapses
          compliance (Staff mutated) -> the lapse cancels the staff member's
          CHECKED_IN RotationAssignment (mutation caused by the lapse) -> the
          cancellation drops day staffing to zero and recomputes ClubDay.posture
          NORMAL -> RATIO_STRAINED (mutation caused by the cancellation).
        test_recipe:
          setup:
            - "Site standard_ratio 2, capacity 60; frontline staff F ACTIVE; day 2026-08-03 OPEN; area capacity 30 STANDARD"
            - "2 members signed in (present_count 2); F checked in as STAFF on BLOCK_A: coverage 1 x 2 = 2 >= 2 -> posture NORMAL"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /sites"
              payload: { name: "Club G", youth_capacity: 60, standard_ratio: 2, elevated_ratio: 8, base_weekly_fee_cents: 5000, registration_fee_cents: 2500, max_arrears_cents: 10000, meal_rates_cents: { BREAKFAST: { FREE: 225, REDUCED: 195, PAID: 45 }, SNACK: { FREE: 110, REDUCED: 55, PAID: 15 }, SUPPER: { FREE: 315, REDUCED: 275, PAID: 55 } } }
