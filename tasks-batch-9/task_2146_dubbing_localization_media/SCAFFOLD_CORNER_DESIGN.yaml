scaffold_corner_design:
  - section: entities
    instances:
      - name: create_title_returns_201_with_all_declared_fields
        claim_type: creation
        grounds:
          - entities.Title
          - endpoints[POST /titles]
        distinguishing_aspect: |
          POST /titles with every required field returns 201 and echoes title_code, source_language, runtime_seconds plus the server-minted id, created_at and version 1.
        test_recipe:
          setup:
          - "Empty database with the logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
          - call: "POST /_clock/set_current_utc"
            payload: { to_iso8601: "2026-09-01T00:00:00Z" }
            as: PlatformAdmin
          trigger:
          - call: "POST /titles"
            payload: { title_code: "TTL-2146", source_language: "en-US", runtime_seconds: 7200, content_rating: "TEEN" }
            as: ProductionCoordinator
            captures: { t_id: "$.data.id" }
          assert:
          - "HTTP status == 201"
          - "Title.${t_id}.title_code == TTL-2146"
          - "Title.${t_id}.source_language == en-US"
          - "Title.${t_id}.runtime_seconds == 7200"
          - "Title.${t_id}.content_rating == TEEN"
          - "Title.${t_id}.cut_count == 0"
          - "Title.${t_id}.version == 1"
      - name: get_cut_by_id_returns_stored_row
        claim_type: retrieval
        grounds:
          - entities.Cut
          - endpoints[GET /cuts/{cutId}]
        distinguishing_aspect: |
          GET /cuts/{cutId} returns the exact stored Cut, including the computed lineage_depth 0 and conform_delta_seconds 0 of a root cut.
        test_recipe:
          setup:
          - "One root Cut on one Title"
          setup_api_calls:
          - call: "POST /_clock/set_current_utc"
            payload: { to_iso8601: "2026-09-01T00:00:00Z" }
            as: PlatformAdmin
          - call: "POST /titles"
            payload: { title_code: "TTL-2146", source_language: "en-US", runtime_seconds: 7200, content_rating: "TEEN" }
            as: ProductionCoordinator
            captures: { t_id: "$.data.id" }
          - call: "POST /cuts"
            payload: { title_id: "${t_id}", cut_code: "THEATRICAL", loop_count: 400, runtime_seconds: 7200 }
            as: ProductionCoordinator
            captures: { c_id: "$.data.id", c_v1: "$.data.version" }
          trigger:
          - call: "GET /cuts/${c_id}"
            payload: {}
            as: ProductionCoordinator
          assert:
          - "HTTP status == 200"
          - "Cut.${c_id}.cut_code == THEATRICAL"
          - "Cut.${c_id}.loop_count == 400"
          - "Cut.${c_id}.lineage_depth == 0"
          - "Cut.${c_id}.conform_delta_seconds == 0"
          - "Cut.${c_id}.derived_from_cut_id == null"
          - "Cut.${c_id}.status == OPEN"
      - name: list_cuts_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - entities.Cut
          - endpoints[GET /cuts]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          GET /cuts?title_id=...&limit=1&offset=0 returns exactly one row with total_count 2 and has_more true, proving the pagination envelope is populated rather than hard-coded.
        test_recipe:
          setup:
          - "Two cuts hang off the same title: one root cut and one derived cut"
          setup_api_calls:
          - call: "POST /_clock/set_current_utc"
            payload: { to_iso8601: "2026-09-01T00:00:00Z" }
            as: PlatformAdmin
          - call: "POST /titles"
            payload: { title_code: "TTL-2146", source_language: "en-US", runtime_seconds: 7200, content_rating: "TEEN" }
            as: ProductionCoordinator
            captures: { t_id: "$.data.id" }
          - call: "POST /cuts"
            payload: { title_id: "${t_id}", cut_code: "THEATRICAL", loop_count: 400, runtime_seconds: 7200 }
            as: ProductionCoordinator
            captures: { c_id: "$.data.id", c_v1: "$.data.version" }
          - call: "POST /cuts/${c_id}/derive"
            payload: { cut_code: "AIRLINE", loop_count: 360, runtime_seconds: 6900, expected_parent_cut_version: "${c_v1}" }
            as: ProductionCoordinator
            captures: { c2_id: "$.data.id" }
          trigger:
          - call: "GET /cuts"
            payload: { title_id: "${t_id}", limit: 1, offset: 0 }
            as: ProductionCoordinator
          assert:
          - "HTTP status == 200"
          - "the response returns exactly 1 Cut row"
          - "meta/pagination total_count == 2"
          - "has_more == true"
      - name: get_missing_order_returns_order_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_ORDER_NOT_FOUND]
          - validations[priority=6]
        distinguishing_aspect: |
          A syntactically valid but unknown UUID on GET /localization-orders/{orderId} yields ERR_ORDER_NOT_FOUND with HTTP 404, not an empty 200.
        test_recipe:
          setup:
          - "Empty database"
          setup_api_calls:
          - call: "POST /_clock/set_current_utc"
            payload: { to_iso8601: "2026-09-01T00:00:00Z" }
            as: PlatformAdmin
          trigger:
          - call: "GET /localization-orders/00000000-0000-4000-8000-000000000000"
            payload: {}
            as: ProductionCoordinator
            captures: { err_id: "$.data.error_id" }
          assert:
          - "${err_id} == ERR_ORDER_NOT_FOUND"
          - "HTTP status == 404"
      - name: platform_spec_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.PlatformSpec
          - validations[priority=8]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Omitting the required qc_pass_threshold from POST /platform-specs yields ERR_INVALID_REQUEST 422 and creates no row.
        test_recipe:
          setup:
          - "Empty database"
          setup_api_calls:
          - call: "POST /_clock/set_current_utc"
            payload: { to_iso8601: "2026-09-01T00:00:00Z" }
            as: PlatformAdmin
          trigger:
          - call: "POST /platform-specs"
            payload: { platform_code: "STREAM_A", loudness_target_lufs: -24.0, stem_layout: "FIVE_ONE_ME", max_lipsync_deviation_ms: 120, min_fidelity_score: 0.65, metadata_fields_required: ["title_local"] }
            as: ProductionCoordinator
            captures: { err_id: "$.data.error_id" }
          assert:
          - "${err_id} == ERR_INVALID_REQUEST"
          - "HTTP status == 422"
      - name: voice_talent_defaults_applied_when_optional_fields_omitted
        claim_type: defaults
        grounds:
          - entities.VoiceTalent.fields.union_status
          - entities.VoiceTalent.fields.max_daily_recorded_minutes
          - entities.VoiceTalent.fields.status
        distinguishing_aspect: |
          Omitting union_status and max_daily_recorded_minutes on POST /voice-talents yields NON_UNION and 300, and status defaults to ACTIVE with both minute counters at 0.
        test_recipe:
          setup:
          - "Empty database"
          setup_api_calls:
          - call: "POST /_clock/set_current_utc"
            payload: { to_iso8601: "2026-09-01T00:00:00Z" }
            as: PlatformAdmin
          trigger:
          - call: "POST /voice-talents"
            payload: { full_name: "Anna Vogel", language_code: "de-DE", base_rate_cents_per_hour: 30000, licensed_territories: ["DE"] }
            as: CastingDirector
            captures: { tal1_id: "$.data.id" }
          assert:
          - "VoiceTalent.${tal1_id}.union_status == NON_UNION"
          - "VoiceTalent.${tal1_id}.max_daily_recorded_minutes == 300"
          - "VoiceTalent.${tal1_id}.status == ACTIVE"
          - "VoiceTalent.${tal1_id}.held_minutes == 0"
          - "VoiceTalent.${tal1_id}.recorded_minutes == 0"
      - name: derived_cut_computes_lineage_depth_and_conform_delta
        claim_type: computed_fields
        grounds:
          - entities.Cut.fields.lineage_depth
          - entities.Cut.fields.conform_delta_seconds
          - entities.Cut.fields.derived_cut_count
          - endpoints[POST /cuts/{cutId}/derive]
        distinguishing_aspect: |
          Deriving a 6900-second cut from a 7200-second parent stamps lineage_depth 1 and conform_delta_seconds -300 on the child and raises the parent's derived_cut_count to 1 - none of which the client supplied.
        test_recipe:
          setup:
          - "One root Cut with runtime_seconds 7200 and derived_cut_count 0"
          setup_api_calls:
          - call: "POST /_clock/set_current_utc"
            payload: { to_iso8601: "2026-09-01T00:00:00Z" }
            as: PlatformAdmin
          - call: "POST /titles"
            payload: { title_code: "TTL-2146", source_language: "en-US", runtime_seconds: 7200, content_rating: "TEEN" }
            as: ProductionCoordinator
            captures: { t_id: "$.data.id" }
          - call: "POST /cuts"
            payload: { title_id: "${t_id}", cut_code: "THEATRICAL", loop_count: 400, runtime_seconds: 7200 }
            as: ProductionCoordinator
            captures: { c_id: "$.data.id", c_v1: "$.data.version" }
          trigger:
          - call: "POST /cuts/${c_id}/derive"
            payload: { cut_code: "AIRLINE", loop_count: 360, runtime_seconds: 6900, expected_parent_cut_version: "${c_v1}" }
            as: ProductionCoordinator
            captures: { c2_id: "$.data.id" }
          assert:
          - "Cut.${c2_id}.lineage_depth == 1"
          - "Cut.${c2_id}.conform_delta_seconds == -300"
          - "Cut.${c2_id}.derived_from_cut_id == ${c_id}"
          - "Cut.${c2_id}.status == OPEN"
          - "Cut.${c_id}.derived_cut_count == 1"
          - "Title.${t_id}.cut_count == 2"
      - name: order_system_fields_are_server_minted_and_not_client_supplied
        claim_type: system_fields
        grounds:
          - entities.LocalizationOrder.fields.status
          - entities.LocalizationOrder.fields.committed_cents
          - entities.LocalizationOrder.fields.gross_accrued_cents
        distinguishing_aspect: |
          POST /localization-orders accepts no status or money field; the created row comes back with status DRAFT, all three money counters at 0, retake_cycles 0, version 1 and metadata_locale_fields as an empty object.
        test_recipe:
          setup:
          - "A LOCKED cut and a PlatformSpec exist"
          setup_api_calls:
          - call: "POST /_clock/set_current_utc"
            payload: { to_iso8601: "2026-09-01T00:00:00Z" }
            as: PlatformAdmin
          - call: "POST /titles"
            payload: { title_code: "TTL-2146", source_language: "en-US", runtime_seconds: 7200, content_rating: "TEEN" }
            as: ProductionCoordinator
            captures: { t_id: "$.data.id" }
          - call: "POST /cuts"
            payload: { title_id: "${t_id}", cut_code: "THEATRICAL", loop_count: 400, runtime_seconds: 7200 }
            as: ProductionCoordinator
            captures: { c_id: "$.data.id", c_v1: "$.data.version" }
          - call: "POST /cuts/${c_id}/lock"
            payload: {}
            as: ProductionCoordinator
          - call: "POST /platform-specs"
            payload: { platform_code: "STREAM_A", loudness_target_lufs: -24.0, stem_layout: "FIVE_ONE_ME", max_lipsync_deviation_ms: 120, min_fidelity_score: 0.65, qc_pass_threshold: 0.9, metadata_fields_required: ["title_local"] }
            as: ProductionCoordinator
            captures: { ps_id: "$.data.id" }
          trigger:
          - call: "POST /localization-orders"
            payload: { cut_id: "${c_id}", platform_spec_id: "${ps_id}", target_language: "de-DE", territory: "DE", budget_cap_cents: 500000, priority_tier: "RUSH" }
            as: ProductionCoordinator
            captures: { o_id: "$.data.id" }
          assert:
          - "LocalizationOrder.${o_id}.status == DRAFT"
          - "LocalizationOrder.${o_id}.committed_cents == 0"
          - "LocalizationOrder.${o_id}.released_cents == 0"
          - "LocalizationOrder.${o_id}.gross_accrued_cents == 0"
          - "LocalizationOrder.${o_id}.retake_cycles == 0"
          - "LocalizationOrder.${o_id}.version == 1"
          - "LocalizationOrder.${o_id}.delivered_at == null"
      - name: invalid_priority_tier_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.LocalizationOrder.fields.priority_tier
          - validations[priority=8]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          priority_tier OVERNIGHT is not a declared member of {STANDARD, EXPEDITED, RUSH} and POST /localization-orders must answer ERR_INVALID_REQUEST 422 before any state or referential check runs.
        test_recipe:
          setup:
          - "A LOCKED cut and a PlatformSpec exist"
          setup_api_calls:
          - call: "POST /_clock/set_current_utc"
            payload: { to_iso8601: "2026-09-01T00:00:00Z" }
            as: PlatformAdmin
          - call: "POST /titles"
            payload: { title_code: "TTL-2146", source_language: "en-US", runtime_seconds: 7200, content_rating: "TEEN" }
            as: ProductionCoordinator
            captures: { t_id: "$.data.id" }
          - call: "POST /cuts"
            payload: { title_id: "${t_id}", cut_code: "THEATRICAL", loop_count: 400, runtime_seconds: 7200 }
            as: ProductionCoordinator
            captures: { c_id: "$.data.id", c_v1: "$.data.version" }
          - call: "POST /cuts/${c_id}/lock"
            payload: {}
            as: ProductionCoordinator
          - call: "POST /platform-specs"
            payload: { platform_code: "STREAM_A", loudness_target_lufs: -24.0, stem_layout: "FIVE_ONE_ME", max_lipsync_deviation_ms: 120, min_fidelity_score: 0.65, qc_pass_threshold: 0.9, metadata_fields_required: ["title_local"] }
            as: ProductionCoordinator
            captures: { ps_id: "$.data.id" }
          trigger:
          - call: "POST /localization-orders"
            payload: { cut_id: "${c_id}", platform_spec_id: "${ps_id}", target_language: "de-DE", territory: "DE", budget_cap_cents: 500000, priority_tier: "OVERNIGHT" }
            as: ProductionCoordinator
            captures: { err_id: "$.data.error_id" }
          assert:
          - "${err_id} == ERR_INVALID_REQUEST"
          - "HTTP status == 422"
          - "GET /localization-orders?cut_id=${c_id} returns exactly 0 rows"
      - name: character_from_another_title_rejected_on_casting
        claim_type: parent_relationships
        grounds:
          - validations[priority=19]
          - errors[ERR_CHARACTER_TITLE_MISMATCH]
          - entities.Character.fields.title_id
        distinguishing_aspect: |
          A Character whose title_id differs from the order's Cut.title_id cannot be cast: the request answers ERR_CHARACTER_TITLE_MISMATCH 422 even though both rows exist.
        test_recipe:
          setup:
          - "Two titles each with their own cut and character; the order is raised on title 1 and the casting names title 2's character"
          - "The order has reached CASTING through a submitted script adaptation"
          setup_api_calls:
          - call: "POST /_clock/set_current_utc"
            payload: { to_iso8601: "2026-09-01T00:00:00Z" }
            as: PlatformAdmin
          - call: "POST /titles"
            payload: { title_code: "TTL-2146", source_language: "en-US", runtime_seconds: 7200, content_rating: "TEEN" }
            as: ProductionCoordinator
            captures: { t_id: "$.data.id" }
          - call: "POST /cuts"
            payload: { title_id: "${t_id}", cut_code: "THEATRICAL", loop_count: 400, runtime_seconds: 7200 }
            as: ProductionCoordinator
            captures: { c_id: "$.data.id" }
          - call: "POST /cuts/${c_id}/lock"
            payload: {}
            as: ProductionCoordinator
          - call: "POST /characters"
            payload: { title_id: "${t_id}", character_code: "HERO", loop_count: 220, screen_time_seconds: 3000, is_principal: true }
            as: ProductionCoordinator
            captures: { ch1_id: "$.data.id" }
          - call: "POST /characters"
            payload: { title_id: "${t_id}", character_code: "SIDEKICK", loop_count: 180, screen_time_seconds: 1500, is_principal: false }
            as: ProductionCoordinator
            captures: { ch2_id: "$.data.id" }
          - call: "POST /platform-specs"
            payload: { platform_code: "STREAM_A", loudness_target_lufs: -24.0, stem_layout: "FIVE_ONE_ME", max_lipsync_deviation_ms: 120, min_fidelity_score: 0.65, qc_pass_threshold: 0.9, metadata_fields_required: ["title_local", "synopsis_local"] }
            as: ProductionCoordinator
            captures: { ps_id: "$.data.id" }
          - call: "POST /studios"
            payload: { name: "Booth 1", territory: "DE", hourly_rate_cents: 24000, turnaround_buffer_minutes: 30, daily_capacity_minutes: 600 }
            as: ProductionCoordinator
            captures: { st_id: "$.data.id" }
          - call: "POST /voice-talents"
            payload: { full_name: "Anna Vogel", language_code: "de-DE", base_rate_cents_per_hour: 30000, licensed_territories: ["US", "DE", "JP"], union_status: "NON_UNION", max_daily_recorded_minutes: 300 }
            as: CastingDirector
            captures: { tal1_id: "$.data.id" }
          - call: "POST /voice-talents"
            payload: { full_name: "Bruno Keller", language_code: "de-DE", base_rate_cents_per_hour: 30000, licensed_territories: ["US", "DE", "JP"], union_status: "NON_UNION", max_daily_recorded_minutes: 300 }
            as: CastingDirector
            captures: { tal2_id: "$.data.id" }
          - call: "POST /localization-orders"
            payload: { cut_id: "${c_id}", platform_spec_id: "${ps_id}", target_language: "de-DE", territory: "DE", budget_cap_cents: 500000, priority_tier: "EXPEDITED" }
            as: ProductionCoordinator
            captures: { o_id: "$.data.id" }
          - call: "POST /script-adaptations"
            payload: { order_id: "${o_id}" }
            as: Adaptor
            as_user_id: "adaptor-1"
            captures: { sa_id: "$.data.id" }
          - call: "POST /script-adaptations/${sa_id}/translate"
            payload: {}
            as: Adaptor
            as_user_id: "adaptor-1"
          - call: "POST /script-adaptations/${sa_id}/adapt"
            payload: { declared_loop_count: 380 }
            as: Adaptor
            as_user_id: "adaptor-1"
          - call: "POST /script-adaptations/${sa_id}/submit-review"
            payload: { measured_sync_deviation_ms_total: 22800, lines_over_deviation: 38 }
            as: Adaptor
            as_user_id: "adaptor-1"
          - call: "POST /script-adaptations/${sa_id}/review"
            payload: { decision: "APPROVE" }
            as: NativeReviewer
            as_user_id: "reviewer-1"
          - call: "POST /titles"
            payload: { title_code: "TTL-OTHER", source_language: "en-US", runtime_seconds: 5400, content_rating: "GENERAL" }
            as: ProductionCoordinator
            captures: { t2_id: "$.data.id" }
          - call: "POST /characters"
            payload: { title_id: "${t2_id}", character_code: "STRANGER", loop_count: 40, screen_time_seconds: 300, is_principal: false }
            as: ProductionCoordinator
            captures: { ch_other_id: "$.data.id" }
          - call: "GET /localization-orders/${o_id}"
            payload: {}
            as: ProductionCoordinator
            captures: { o_v1: "$.data.version" }
          trigger:
          - call: "POST /casting-assignments"
            payload: { order_id: "${o_id}", character_id: "${ch_other_id}", talent_id: "${tal1_id}", usage_variant: "BUYOUT", agreed_rate_cents_per_hour: 36000, expected_order_version: "${o_v1}" }
            as: CastingDirector
            captures: { err_id: "$.data.error_id" }
          assert:
          - "${err_id} == ERR_CHARACTER_TITLE_MISMATCH"
          - "HTTP status == 422"
          - "GET /casting-assignments?order_id=${o_id} returns exactly 0 rows"
      - name: self_referential_cut_chain_is_discoverable_by_parent_filter
        claim_type: parent_relationships
        grounds:
          - entities.Cut.fields.derived_from_cut_id
          - endpoints[GET /cuts]
        distinguishing_aspect: |
          The graph topology's self-referential edge resolves: GET /cuts?derived_from_cut_id=<root> returns exactly the one child, and the grandchild carries lineage_depth 2.
        test_recipe:
          setup:
          - "A three-generation cut lineage: root -> AIRLINE -> AIRLINE_SHORT"
          setup_api_calls:
          - call: "POST /_clock/set_current_utc"
            payload: { to_iso8601: "2026-09-01T00:00:00Z" }
            as: PlatformAdmin
          - call: "POST /titles"
            payload: { title_code: "TTL-2146", source_language: "en-US", runtime_seconds: 7200, content_rating: "TEEN" }
            as: ProductionCoordinator
            captures: { t_id: "$.data.id" }
          - call: "POST /cuts"
            payload: { title_id: "${t_id}", cut_code: "THEATRICAL", loop_count: 400, runtime_seconds: 7200 }
            as: ProductionCoordinator
            captures: { c_id: "$.data.id", c_v1: "$.data.version" }
          - call: "POST /cuts/${c_id}/derive"
            payload: { cut_code: "AIRLINE", loop_count: 360, runtime_seconds: 6900, expected_parent_cut_version: "${c_v1}" }
            as: ProductionCoordinator
            captures: { c2_id: "$.data.id", c2_v1: "$.data.version" }
          - call: "POST /cuts/${c2_id}/derive"
            payload: { cut_code: "AIRLINE_SHORT", loop_count: 300, runtime_seconds: 6000, expected_parent_cut_version: "${c2_v1}" }
            as: ProductionCoordinator
            captures: { c3_id: "$.data.id" }
          trigger:
          - call: "GET /cuts"
            payload: { derived_from_cut_id: "${c_id}" }
            as: ProductionCoordinator
          assert:
          - "the response returns exactly 1 Cut row and it is ${c2_id}"
          - "Cut.${c3_id}.lineage_depth == 2"
          - "Cut.${c3_id}.conform_delta_seconds == -900"
          - "Cut.${c2_id}.derived_cut_count == 1"
          - "Cut.${c_id}.derived_cut_count == 1"
  - section: state_machines
    instances:
      - name: new_order_starts_in_draft
        claim_type: initial_state
        grounds:
          - state_machines.LocalizationOrder.initial_state
          - entities.LocalizationOrder.fields.status
        distinguishing_aspect: |
          A freshly created LocalizationOrder is in DRAFT and no child workstream exists yet, so GET /script-adaptations?order_id returns zero rows.
        test_recipe:
          setup:
          - "A LOCKED cut and a PlatformSpec exist"
          setup_api_calls:
          - call: "POST /_clock/set_current_utc"
            payload: { to_iso8601: "2026-09-01T00:00:00Z" }
            as: PlatformAdmin
          - call: "POST /titles"
            payload: { title_code: "TTL-2146", source_language: "en-US", runtime_seconds: 7200, content_rating: "TEEN" }
            as: ProductionCoordinator
            captures: { t_id: "$.data.id" }
          - call: "POST /cuts"
            payload: { title_id: "${t_id}", cut_code: "THEATRICAL", loop_count: 400, runtime_seconds: 7200 }
            as: ProductionCoordinator
            captures: { c_id: "$.data.id", c_v1: "$.data.version" }
          - call: "POST /cuts/${c_id}/lock"
            payload: {}
            as: ProductionCoordinator
          - call: "POST /platform-specs"
            payload: { platform_code: "STREAM_A", loudness_target_lufs: -24.0, stem_layout: "FIVE_ONE_ME", max_lipsync_deviation_ms: 120, min_fidelity_score: 0.65, qc_pass_threshold: 0.9, metadata_fields_required: ["title_local"] }
            as: ProductionCoordinator
            captures: { ps_id: "$.data.id" }
          - call: "POST /localization-orders"
            payload: { cut_id: "${c_id}", platform_spec_id: "${ps_id}", target_language: "de-DE", territory: "DE", budget_cap_cents: 500000, priority_tier: "STANDARD" }
            as: ProductionCoordinator
            captures: { o_id: "$.data.id" }
          trigger:
          - call: "GET /localization-orders/${o_id}"
            payload: {}
            as: ProductionCoordinator
          assert:
          - "LocalizationOrder.${o_id}.status == DRAFT"
          - "GET /script-adaptations?order_id=${o_id} returns exactly 0 rows"
      - name: confirm_casting_from_proposed_returns_invalid_state
        claim_type: invalid_transitions
        grounds:
