scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: liability_payout_standard_vs_extended_tier
        grounds:
          - calculations.liability_payout
          - entities.LiabilityClaim.fields.payout_cents
          - entities.CustomerAccount.fields.liability_tier
        distinguishing_aspect: |
          Two LiabilityClaims over identical work-order economics (declared
          1000000, charge 100000, weight 1000 lb) pay differently purely because
          of the customer tier: STANDARD uses min(declared, 3 x charge) = 300000,
          EXTENDED uses min(declared, 85 cents/lb x 1000) = 85000 — a
          liability-domain dual variant.
        test_recipe:
          setup:
            - "STANDARD customer and EXTENDED customer; one APPROVED OIL recipe; QUALIFIED CLASS_3 furnace (TUS + calibration PASS 2026-08-01)"
            - "One load with both work orders (identical economics), run to COMPLETED so both orders are PROCESSED"
            - "Both orders FAIL inspection and are dispositioned SCRAP by a different QE than the recorder"
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Std Co", liability_tier: "STANDARD" }, as: CustomerServiceRep, captures: { cust_std: $.data.id } }
            - { call: "POST /customer-accounts", payload: { name: "Ext Co", liability_tier: "EXTENDED" }, as: CustomerServiceRep, captures: { cust_ext: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 5000, quench_media_supported: ["OIL", "WATER"] }, as: ShopScheduler, captures: { furn_id: $.data.id } }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "TUS", performed_at: "2026-08-01T00:00:00Z", result: "PASS" }, as: CalibrationTech }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "INSTRUMENT_CALIBRATION", performed_at: "2026-08-01T00:00:00Z", result: "PASS", instrument_id: "TC-CAL-9" }, as: CalibrationTech }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_std}", recipe_id: "${recipe_id}", part_quantity: 10, received_weight_lb: 1000, declared_value_cents: 1000000, processing_charge_cents: 100000, service_lane: "STANDARD" }, as: CustomerServiceRep, captures: { wo_std: $.data.id } }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_ext}", recipe_id: "${recipe_id}", part_quantity: 10, received_weight_lb: 1000, declared_value_cents: 1000000, processing_charge_cents: 100000, service_lane: "STANDARD" }, as: CustomerServiceRep, captures: { wo_ext: $.data.id } }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: ShopScheduler, captures: { load_id: $.data.id, load_v: $.data.version } }
            - { call: "POST /load-batches/${load_id}/assignments", payload: { work_order_id: "${wo_std}", expected_load_batch_version: "${load_v}" }, as: ShopScheduler }
            - { call: "GET /load-batches/${load_id}", payload: {}, as: ShopScheduler, captures: { load_v2: $.data.version } }
            - { call: "POST /load-batches/${load_id}/assignments", payload: { work_order_id: "${wo_ext}", expected_load_batch_version: "${load_v2}" }, as: ShopScheduler }
            - { call: "POST /load-batches/${load_id}/release", payload: {}, as: ShopScheduler }
            - { call: "POST /load-batches/${load_id}/start-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /thermocouple-readings", payload: { load_batch_id: "${load_id}", channel: "LOAD_TC_1", recorded_at: "2026-08-02T10:00:00Z", temp_f: 1650 }, as: FurnaceOperator }
            - { call: "POST /load-batches/${load_id}/complete-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /inspection-tests", payload: { work_order_id: "${wo_std}", hardness_readings: [50, 50], measured_distortion_in: 0.004 }, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /inspection-tests", payload: { work_order_id: "${wo_ext}", hardness_readings: [50, 50], measured_distortion_in: 0.004 }, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "GET /disposition-cases?work_order_id=${wo_std}", payload: {}, as: QualityEngineer, as_user_id: "qe-2", captures: { case_std : "$.data[0].id" } }
            - { call: "GET /disposition-cases?work_order_id=${wo_ext}", payload: {}, as: QualityEngineer, as_user_id: "qe-2", captures: { case_ext : "$.data[0].id" } }
            - { call: "POST /disposition-cases/${case_std}/decide", payload: { decision: "SCRAP" }, as: QualityEngineer, as_user_id: "qe-2" }
            - { call: "POST /disposition-cases/${case_ext}/decide", payload: { decision: "SCRAP" }, as: QualityEngineer, as_user_id: "qe-2" }
            - { call: "GET /liability-claims?work_order_id=${wo_std}", payload: {}, as: CustomerServiceRep, captures: { payout_std : "$.data[0].payout_cents" } }
            - { call: "GET /liability-claims?work_order_id=${wo_ext}", payload: {}, as: CustomerServiceRep, captures: { payout_ext : "$.data[0].payout_cents" } }
          trigger:
            - { call: "GET /liability-claims?customer_id=${cust_std}", payload: {}, as: CustomerServiceRep }
          assert:
            - "Claim for ${wo_std}: payout_cents == 300000 (STANDARD: min(1000000, 3 x 100000))"
            - "Claim for ${wo_ext}: payout_cents == 85000 (EXTENDED: min(1000000, round_half_up(85 x 1000)))"
            - "${payout_std} != ${payout_ext} for identical lot economics"

      - name: rush_surcharge_provisional_vs_final_on_breach
        grounds:
          - calculations.rush_surcharge_quote
          - entities.WorkOrder.fields.rush_surcharge_quoted_cents
          - entities.WorkOrder.fields.rush_surcharge_final_cents
          - calculations.turnaround_breach_assessment
        distinguishing_aspect: |
          Same RUSH work order, same inputs: the provisional variant quotes
          35000 cents at intake, the final variant settles 0 after the clock is
          advanced past promised_due_at — a pricing-domain dual variant, a
          different entity domain from liability payout.
        test_recipe:
          setup:
            - "Customer, APPROVED recipe, QUALIFIED furnace; RUSH work order charge 100000, guarantee 48h, received at default clock 2026-08-01T00:00:00Z (promised_due_at 2026-08-03T00:00:00Z)"
            - "Order processed to PROCESSED and inspection PASSed"
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Rush Co", liability_tier: "STANDARD" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_id: $.data.id } }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "TUS", performed_at: "2026-08-01T00:00:00Z", result: "PASS" }, as: CalibrationTech }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "INSTRUMENT_CALIBRATION", performed_at: "2026-08-01T00:00:00Z", result: "PASS", instrument_id: "TC-CAL-9" }, as: CalibrationTech }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000, service_lane: "RUSH", guaranteed_turnaround_hours: 48 }, as: CustomerServiceRep, captures: { wo_id: $.data.id, quoted: $.data.rush_surcharge_quoted_cents } }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: ShopScheduler, captures: { load_id: $.data.id, load_v: $.data.version } }
            - { call: "POST /load-batches/${load_id}/assignments", payload: { work_order_id: "${wo_id}", expected_load_batch_version: "${load_v}" }, as: ShopScheduler }
            - { call: "POST /load-batches/${load_id}/release", payload: {}, as: ShopScheduler }
            - { call: "POST /load-batches/${load_id}/start-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /load-batches/${load_id}/complete-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /inspection-tests", payload: { work_order_id: "${wo_id}", hardness_readings: [40, 42, 41], measured_distortion_in: 0.004 }, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: CustomerServiceRep }
          trigger:
            - { call: "POST /work-orders/${wo_id}/ship", payload: {}, as: CustomerServiceRep }
          assert:
            - "WorkOrder.${wo_id}.rush_surcharge_quoted_cents == 35000 (15000 + 0.20 x 100000; 48h > 24h so no expedite multiplier)"
            - "WorkOrder.${wo_id}.promised_due_at == 2026-08-03T00:00:00Z"
            - "WorkOrder.${wo_id}.turnaround_breached == true (shipped 2026-08-04 > due 2026-08-03)"
            - "WorkOrder.${wo_id}.rush_surcharge_final_cents == 0 — final variant diverges from the 35000 provisional quote"
            - "WorkOrder.${wo_id}.processing_status == SHIPPED"

  # ===========================================================================
  # Rule 2 — combinatorial_formula
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: rush_quote_nested_clamp_and_expedite_branch
        grounds:
          - calculations.rush_surcharge_quote
        distinguishing_aspect: |
          Mode (a): the quote combines 3+ inputs (processing_charge_cents,
          guaranteed_turnaround_hours, lane) through nested min/max clamps and a
          conditional expedite branch: 48h charge 100000 -> 35000 (plain band),
          24h charge 100000 -> 52500 (expedite x1.5 branch),
          72h charge 10000 -> 25000 (floor clamp engages).
        test_recipe:
          setup:
            - "One customer and one APPROVED recipe; three RUSH work orders with the pinned charge/guarantee combinations"
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Clamp Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000, service_lane: "RUSH", guaranteed_turnaround_hours: 48 }, as: CustomerServiceRep, captures: { wo_a: $.data.id, quote_a: $.data.rush_surcharge_quoted_cents } }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000, service_lane: "RUSH", guaranteed_turnaround_hours: 24 }, as: CustomerServiceRep, captures: { wo_b: $.data.id, quote_b: $.data.rush_surcharge_quoted_cents } }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 10000, service_lane: "RUSH", guaranteed_turnaround_hours: 72 }, as: CustomerServiceRep, captures: { wo_c: $.data.id, quote_c: $.data.rush_surcharge_quoted_cents } }
          trigger:
            - { call: "GET /work-orders/${wo_a}", payload: {}, as: CustomerServiceRep }
          assert:
            - "WorkOrder.${wo_a}.rush_surcharge_quoted_cents == 35000 (15000 + 20000, no expedite, inside [25000, 200000])"
            - "WorkOrder.${wo_b}.rush_surcharge_quoted_cents == 52500 (24h <= 24h threshold: round_half_up(35000 x 1.5))"
            - "WorkOrder.${wo_c}.rush_surcharge_quoted_cents == 25000 (base 15000 + 2000 = 17000 clamped up to RUSH_MIN_CENTS)"

      - name: energy_surcharge_round_per_order_then_sum
        grounds:
          - calculations.energy_surcharge_settlement
          - entities.LoadBatch.fields.total_energy_surcharge_cents
          - entities.WorkOrder.fields.energy_surcharge_cents
        distinguishing_aspect: |
          Mode (b): pinned nested rounding order — round each order line first,
          then sum. Weights 10.005 and 20.005 lb at 133 cents/lb give per-line
          rounded 1331 + 2661 = 3992; summing raw (3991.33) then rounding would
          give 3991. A different combinatorial mode than the rush-quote clamps.
        test_recipe:
          setup:
            - "Customer, APPROVED recipe, QUALIFIED furnace; two STANDARD work orders of 10.005 lb and 20.005 lb in one load run to COMPLETED"
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Round Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_id: $.data.id } }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "TUS", performed_at: "2026-08-01T00:00:00Z", result: "PASS" }, as: CalibrationTech }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "INSTRUMENT_CALIBRATION", performed_at: "2026-08-01T00:00:00Z", result: "PASS", instrument_id: "TC-CAL-9" }, as: CalibrationTech }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 3, received_weight_lb: 10.005, declared_value_cents: 100000, processing_charge_cents: 20000, service_lane: "STANDARD" }, as: CustomerServiceRep, captures: { wo_1: $.data.id } }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 4, received_weight_lb: 20.005, declared_value_cents: 100000, processing_charge_cents: 20000, service_lane: "STANDARD" }, as: CustomerServiceRep, captures: { wo_2: $.data.id } }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: ShopScheduler, captures: { load_id: $.data.id, load_v: $.data.version } }
            - { call: "POST /load-batches/${load_id}/assignments", payload: { work_order_id: "${wo_1}", expected_load_batch_version: "${load_v}" }, as: ShopScheduler }
            - { call: "GET /load-batches/${load_id}", payload: {}, as: ShopScheduler, captures: { load_v2: $.data.version } }
            - { call: "POST /load-batches/${load_id}/assignments", payload: { work_order_id: "${wo_2}", expected_load_batch_version: "${load_v2}" }, as: ShopScheduler }
            - { call: "POST /load-batches/${load_id}/release", payload: {}, as: ShopScheduler }
            - { call: "POST /load-batches/${load_id}/start-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /load-batches/${load_id}/complete-run", payload: {}, as: FurnaceOperator }
          trigger:
            - { call: "GET /load-batches/${load_id}", payload: {}, as: ShopScheduler }
          assert:
            - "WorkOrder.${wo_1}.energy_surcharge_cents == 1331 (round_half_up(133 x 10.005 = 1330.665))"
            - "WorkOrder.${wo_2}.energy_surcharge_cents == 2661 (round_half_up(133 x 20.005 = 2660.665))"
            - "LoadBatch.${load_id}.total_energy_surcharge_cents == 3992 (per-line rounded sum; raw-sum rounding would yield 3991)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_retreat_cycle
        grounds:
          - state_machines.WorkOrder.PROCESSED_to_AWAITING_RETREAT
          - state_machines.WorkOrder.AWAITING_RETREAT_to_SCHEDULED
          - entities.WorkOrder.fields.retreat_count
        distinguishing_aspect: |
          WorkOrder processing_status cycles PROCESSED -> AWAITING_RETREAT ->
          SCHEDULED -> IN_PROCESS -> PROCESSED (a re-treat loop), with the
          parallel quality_status dimension cycling FAILED -> PENDING_TEST ->
          PASSED independently — cyclic shape on WorkOrder.
        test_recipe:
          setup:
            - "Order processed, FAILed inspection, RE_TREAT decided (max_retreats 2); re-assigned to a second load and run again; second inspection PASSes"
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Cycle Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 2, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_id: $.data.id } }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "TUS", performed_at: "2026-08-01T00:00:00Z", result: "PASS" }, as: CalibrationTech }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "INSTRUMENT_CALIBRATION", performed_at: "2026-08-01T00:00:00Z", result: "PASS", instrument_id: "TC-CAL-9" }, as: CalibrationTech }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000, service_lane: "STANDARD" }, as: CustomerServiceRep, captures: { wo_id: $.data.id } }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: ShopScheduler, captures: { load1: $.data.id, load1_v: $.data.version } }
            - { call: "POST /load-batches/${load1}/assignments", payload: { work_order_id: "${wo_id}", expected_load_batch_version: "${load1_v}" }, as: ShopScheduler }
            - { call: "POST /load-batches/${load1}/release", payload: {}, as: ShopScheduler }
            - { call: "POST /load-batches/${load1}/start-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /load-batches/${load1}/complete-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /inspection-tests", payload: { work_order_id: "${wo_id}", hardness_readings: [50, 50], measured_distortion_in: 0.004 }, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "GET /disposition-cases?work_order_id=${wo_id}", payload: {}, as: QualityEngineer, as_user_id: "qe-2", captures: { case_id : "$.data[0].id" } }
            - { call: "POST /disposition-cases/${case_id}/decide", payload: { decision: "RE_TREAT" }, as: QualityEngineer, as_user_id: "qe-2" }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-03T08:00:00Z", scheduled_end_at: "2026-08-03T12:00:00Z" }, as: ShopScheduler, captures: { load2: $.data.id, load2_v: $.data.version } }
            - { call: "POST /load-batches/${load2}/assignments", payload: { work_order_id: "${wo_id}", expected_load_batch_version: "${load2_v}" }, as: ShopScheduler }
            - { call: "POST /load-batches/${load2}/release", payload: {}, as: ShopScheduler }
            - { call: "POST /load-batches/${load2}/start-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /load-batches/${load2}/complete-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /inspection-tests", payload: { work_order_id: "${wo_id}", hardness_readings: [40, 42, 41], measured_distortion_in: 0.004 }, as: QualityEngineer, as_user_id: "qe-1" }
          trigger:
            - { call: "POST /work-orders/${wo_id}/ship", payload: {}, as: CustomerServiceRep }
          assert:
            - "After first FAIL + RE_TREAT: processing_status was AWAITING_RETREAT, quality_status PENDING_TEST, retreat_count == 1"
            - "Re-assignment moved processing_status AWAITING_RETREAT -> SCHEDULED (cycle head), then IN_PROCESS -> PROCESSED again"
            - "Final: WorkOrder.${wo_id}.processing_status == SHIPPED, quality_status == PASSED, retreat_count == 1"

      - name: load_batch_complete_vs_abort_divergent_branches
        grounds:
          - state_machines.LoadBatch.RUNNING_to_COMPLETED
          - state_machines.LoadBatch.RUNNING_to_ABORTED
          - state_machines.WorkOrder.IN_PROCESS_to_RECEIVED
        distinguishing_aspect: |
          LoadBatch branches from RUNNING: the COMPLETED branch moves orders to
          PROCESSED and settles energy surcharges; the ABORTED branch rips
          assignments to REMOVED and returns orders to RECEIVED — divergent
          side-effect sets per branch on a different entity than WorkOrder.
        test_recipe:
          setup:
            - "Two loads on one furnace, each with one order; load A completed, load B aborted mid-run"
          setup_api_calls:
