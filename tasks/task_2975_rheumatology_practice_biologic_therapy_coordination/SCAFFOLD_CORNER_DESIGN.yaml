        claim_type: correct_result
        grounds:
          - calculations.visit_slot_interval
          - entities.Visit.fields.visit_end_datetime
        distinguishing_aspect: "visit_end_datetime uses VISIT_DURATION_MINUTES keyed on visit_type: NEW 60, FOLLOW_UP 30, URGENT 45 — a URGENT visit is 45 minutes, not the 30 of a follow-up nor the 60 of a new patient."
        test_recipe:
          setup:
            - "One rheumatologist and one patient; three mutually disjoint visits on 2026-08-03 at 08:00, 10:00 and 11:00 so the two-concurrent cap never fires."
