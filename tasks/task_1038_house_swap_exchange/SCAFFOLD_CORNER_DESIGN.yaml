scaffold_corner_design:
  # -------------------------------------------------------------------------
  # Entities: creation, required fields, system/computed fields, not-found, FK
  # -------------------------------------------------------------------------
  - section: entities
    instances:
      - name: register_member_defaults_trust_and_unverified
        claim_type: Creation
        grounds:
          - entities.Member.fields.trust_score
          - entities.Member.fields.verification_status
          - entities.Member.fields.settled_points_balance
        distinguishing_aspect: "A freshly registered Member has computed defaults trust_score==50, verification_status==UNVERIFIED, settled_points_balance==0, and a server-minted UUID id; 201 with all fields echoed."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /members/register"
              payload: { email: "new@x.com", full_name: "New Member", home_city: "Reno" }
              as: Anonymous
              captures: { m: $.data.id }
          assert:
            - "response is 201"
            - "Member.${m}.trust_score == 50"
            - "Member.${m}.verification_status == UNVERIFIED"
            - "Member.${m}.settled_points_balance == 0"
            - "Member.${m}.available_points_balance == 0"

      - name: register_member_missing_full_name_returns_validation
        claim_type: Required Fields
        grounds: [entities.Member.fields.full_name, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "full_name is source:input with no default; omitting it returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /members/register"
              payload: { email: "x@x.com", home_city: "Reno" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response is 400 with data.error_id == ERR_VALIDATION"

      - name: get_member_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Member, "errors[ERR_MEMBER_NOT_FOUND]"]
        distinguishing_aspect: "GET /members/{id} for a well-formed but nonexistent UUID returns ERR_MEMBER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response is 404 with data.error_id == ERR_MEMBER_NOT_FOUND"

      - name: create_membership_with_unknown_member_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Membership.fields.member_id, "errors[ERR_MEMBER_NOT_FOUND]"]
        distinguishing_aspect: "FK integrity: POST /memberships with a member_id that does not resolve returns ERR_MEMBER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /memberships"
              payload: { member_id: "00000000-0000-4000-8000-000000000000", tier: "BASIC" }
              as: Member
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { err: $.data.error_id }
          assert:
            - "response is 404 with data.error_id == ERR_MEMBER_NOT_FOUND"

      - name: create_listing_bad_points_per_night_enum_returns_validation
        claim_type: Type Constraints
        grounds: [entities.HomeListing.fields.points_per_night, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "points_per_night has constraint >= 1; a value of 0 returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["One registered member acting as owner."]
          setup_api_calls:
            - call: "POST /members/register"
              payload: { email: "own@x.com", full_name: "Owner", home_city: "Denver" }
              as: Anonymous
              captures: { h: $.data.id }
          trigger:
            - call: "POST /home-listings"
              payload: { owner_member_id: "${h}", title: "Bad", address_city: "Denver", address_country: "US", points_per_night: 0, max_points_per_exchange: 10000, capacity: 4 }
              as: Member
              as_user_id: "${h}"
              captures: { err: $.data.error_id }
          assert:
            - "response is 400 with data.error_id == ERR_VALIDATION"

  # -------------------------------------------------------------------------
  # State machines: invalid transitions, terminal lockdown, idempotency
  # -------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: confirm_twice_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.ExchangeAgreement.PENDING_CONFIRMATION_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Confirming an already-CONFIRMED agreement returns ERR_INVALID_STATE (409); the transition requires status==PENDING_CONFIRMATION."
        test_recipe:
          setup: ["A CONFIRMED POINTS agreement."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
