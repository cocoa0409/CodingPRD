  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: brandrep_cannot_create_series
        claim_type: role_denial
        grounds: [roles, "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "BrandRep lacks series registration: 403 ERR_UNAUTHORIZED_ROLE; the series is not persisted."
        test_recipe:
          setup: ["a brand exists"]
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /series", payload: { name: "Rogue Show", network_name: "NBN" }, as: BrandRep, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_UNAUTHORIZED_ROLE (HTTP 403)"
      - name: manager_cannot_decide_clearance
        claim_type: role_denial
        grounds: [roles, "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "IntegrationManager requests clearances but cannot adjudicate them: decide is ClearanceOfficer-only."
        test_recipe:
          setup: ["Brand; STANDARD series; episode with REQUESTED clearance"]
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id, ep_v: $.data.version } }
            - { call: "POST /episodes/${ep_id}/clearances", payload: { brand_id: "${b_id}", expected_episode_version: "${ep_v}" }, as: IntegrationManager, captures: { cl_id: $.data.id } }
          trigger:
            - { call: "POST /clearances/${cl_id}/decide", payload: { decision: "GRANT" }, as: IntegrationManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_UNAUTHORIZED_ROLE"
            - "CompetitiveClearance.${cl_id}.status == REQUESTED"
      - name: brandrep_cannot_submit_other_brands_brief
        claim_type: role_denial
        grounds: [roles, "errors[ERR_FORBIDDEN_OWNERSHIP]", "validations[priority=3]"]
        distinguishing_aspect: "Entity-backed identity: BrandRep authenticated as brand A cannot submit a brief owned by brand B."
        test_recipe:
          setup: ["Two brands A and B; B has a DRAFT brief"]
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_a: $.data.id } }
            - { call: "POST /brands", payload: { name: "Snackly", category: "FOOD" }, as: AgencyAdmin, captures: { b_b: $.data.id } }
            - { call: "POST /brands/${b_b}/briefs", payload: { title: "T", objective: "O", budget_cents: 1000 }, as: BrandRep, as_user_id: "${b_b}", captures: { br_b: $.data.id } }
          trigger:
            - { call: "POST /briefs/${br_b}/submit", as: BrandRep, as_user_id: "${b_a}", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_FORBIDDEN_OWNERSHIP (HTTP 403)"
            - "BrandBrief.${br_b}.status == DRAFT"

  # ===========================================================================
  # Section: cross_cutting (complexity layers)
  # ===========================================================================
  - section: cross_cutting
    instances:
      - name: proposal_revision_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[proposal-revision-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on IntegrationProposal.version: a revision carrying a stale expected version (current - 1) is rejected 412 while the correct version succeeds."
        test_recipe:
          setup: ["Proposal in REVISION_REQUESTED (production asked for changes)"]
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "T", objective: "O", budget_cents: 1000000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/submit", as: BrandRep, as_user_id: "${b_id}" }
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id } }
            - { call: "POST /episodes/${ep_id}/opportunities", payload: { scene_description: "Kitchen", start_timecode_seconds: 0, end_timecode_seconds: 40, estimated_exposure_seconds: 25 }, as: ProductionRep, as_user_id: "prod-1", captures: { opp_id: $.data.id } }
            - { call: "POST /proposals", payload: { brief_id: "${br_id}", opportunity_id: "${opp_id}", proposed_fee_cents: 1000000, guaranteed_seconds: 30, guaranteed_verbal_mentions: 0, cross_promo_owed_count: 0, rate_cents_per_second: 2000 }, as: IntegrationManager, captures: { p_id: $.data.id } }
            - { call: "POST /proposals/${p_id}/submit", as: IntegrationManager }
            - { call: "POST /proposals/${p_id}/production-decision", payload: { decision: "REQUEST_REVISION" }, as: ProductionRep, as_user_id: "prod-2", captures: { p_v: $.data.version } }
          trigger:
            - { call: "POST /proposals/${p_id}/revisions", payload: { proposed_fee_cents: 900000, guaranteed_seconds: 30, guaranteed_verbal_mentions: 0, cross_promo_owed_count: 0, rate_cents_per_second: 2000, expected_proposal_version: "${p_v} - 1" }, as: IntegrationManager, captures: { err: $.data.error_id } }
            - { call: "POST /proposals/${p_id}/revisions", payload: { proposed_fee_cents: 900000, guaranteed_seconds: 30, guaranteed_verbal_mentions: 0, cross_promo_owed_count: 0, rate_cents_per_second: 2000, expected_proposal_version: "${p_v}" }, as: IntegrationManager, captures: { ok_status: $.data.status } }
          assert:
            - "captured err == ERR_STALE_VERSION (HTTP 412)"
            - "second call with the current version: captured ok_status == PRODUCTION_REVIEW"
      - name: contract_terms_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[contract-terms-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on IntegrationContract.version: terms amendment with a stale expected version is rejected 412 and leaves base_fee unchanged."
        test_recipe:
          setup: ["Approved proposal; contract PENDING_SIGNATURE; version captured at creation"]
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "T", objective: "O", budget_cents: 1000000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/submit", as: BrandRep, as_user_id: "${b_id}" }
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id } }
            - { call: "POST /episodes/${ep_id}/opportunities", payload: { scene_description: "Kitchen", start_timecode_seconds: 0, end_timecode_seconds: 40, estimated_exposure_seconds: 25 }, as: ProductionRep, as_user_id: "prod-1", captures: { opp_id: $.data.id } }
            - { call: "POST /proposals", payload: { brief_id: "${br_id}", opportunity_id: "${opp_id}", proposed_fee_cents: 1000000, guaranteed_seconds: 30, guaranteed_verbal_mentions: 0, cross_promo_owed_count: 0, rate_cents_per_second: 2000 }, as: IntegrationManager, captures: { p_id: $.data.id } }
            - { call: "POST /proposals/${p_id}/submit", as: IntegrationManager }
            - { call: "POST /proposals/${p_id}/production-decision", payload: { decision: "APPROVE" }, as: ProductionRep, as_user_id: "prod-2" }
            - { call: "POST /proposals/${p_id}/network-decision", payload: { decision: "APPROVE" }, as: NetworkStandardsReviewer, as_user_id: "nsr-1" }
            - { call: "POST /proposals/${p_id}/contract", as: IntegrationManager, captures: { ct_id: $.data.id, ct_v: $.data.version } }
          trigger:
            - { call: "PATCH /contracts/${ct_id}/terms", payload: { base_fee_cents: 800000, expected_contract_version: "${ct_v} - 1" }, as: IntegrationManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_STALE_VERSION (HTTP 412)"
            - "IntegrationContract.${ct_id}.base_fee_cents == 1000000 (unchanged)"
      - name: version_increments_on_each_mutation
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[proposal-revision-stale-version]", entities.IntegrationProposal]
        distinguishing_aspect: "The version counter advances by exactly 1 per mutation: create v1, submit v2, production decision v3."
        test_recipe:
          setup: ["Proposal chain through PRODUCTION_REVIEW"]
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "T", objective: "O", budget_cents: 1000000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/submit", as: BrandRep, as_user_id: "${b_id}" }
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id } }
            - { call: "POST /episodes/${ep_id}/opportunities", payload: { scene_description: "Kitchen", start_timecode_seconds: 0, end_timecode_seconds: 40, estimated_exposure_seconds: 25 }, as: ProductionRep, as_user_id: "prod-1", captures: { opp_id: $.data.id } }
          trigger:
            - { call: "POST /proposals", payload: { brief_id: "${br_id}", opportunity_id: "${opp_id}", proposed_fee_cents: 60000, guaranteed_seconds: 10, guaranteed_verbal_mentions: 0, cross_promo_owed_count: 0, rate_cents_per_second: 2000 }, as: IntegrationManager, captures: { p_id: $.data.id, v1: $.data.version } }
            - { call: "POST /proposals/${p_id}/submit", as: IntegrationManager, captures: { v2: $.data.version } }
            - { call: "POST /proposals/${p_id}/production-decision", payload: { decision: "APPROVE" }, as: ProductionRep, as_user_id: "prod-2", captures: { v3: $.data.version } }
          assert:
            - "captured v1 == 1, captured v2 == 2, captured v3 == 3"
      - name: clock_default_is_fixed_instant
        claim_type: scheduled_actions
        grounds: [endpoints]
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-05-01T00:00:00Z: a brand created first has created_at equal to that instant, not wall-clock time."
        test_recipe:
          setup: ["empty DB; no clock call made"]
          setup_api_calls: []
          trigger:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_created: $.data.created_at } }
          assert:
            - "captured b_created == 2026-05-01T00:00:00Z"
      - name: strict_policy_changes_clearance_outcome
        claim_type: conditional_feature_flags
        grounds: [entities.Series.fields.clearance_policy, calculations.clearance_conflict_score]
        excluded_because:
          difficulty_instance: dual_variant_calc / clearance_policy_strict_vs_standard_day7
          rationale: "The flag-driven divergence at the day-7 boundary is the assertion of the named §1.8 instance."
      - name: derived_outstanding_reconciles_after_waive
        claim_type: derived_field_reconciliation
        grounds: [entities.IntegrationContract.fields.outstanding_balance_cents]
        excluded_because:
          difficulty_instance: compensating_invariant / makegood_waive_restores_outstanding_balance
          rationale: "Outstanding-balance reconciliation across verify and waive is asserted by the named §1.8 instance."

