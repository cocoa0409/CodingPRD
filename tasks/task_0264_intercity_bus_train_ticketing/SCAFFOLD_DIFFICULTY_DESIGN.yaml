# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Intercity Bus & Train Ticketing — Expert
# 9 Difficulty Rules x >= 2 instances = 18 instances.
# Canonical clock for time-dependent setups: 2026-06-01T00:00:00Z unless noted.
# All fare/penalty literals were computed against §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_cash_vs_travel_credit_on_booking
        grounds:
          - calculations.cancel_settlement
          - state_machines.Booking.payment_status.PAID_to_REFUNDED
          - state_machines.Booking.payment_status.PAID_to_CREDITED
          - entities.RefundCreditNote.fields.net_cents
        distinguishing_aspect: |
          For an identical PAID booking (total_paid_cents=3600) cancelled at the same dbd=3 days,
          the CASH variant nets 2700 (penalty_pct 0.25) while the TRAVEL_CREDIT variant nets 3060
          (penalty_pct 0.15) — different numbers on the Booking-settlement domain.
        test_recipe:
          setup:
            - "Operator (BUS) with default exchange_fee_cents; PUBLISHED route; one ServiceDate seats_total=10, base_fare_cents=4000, departure 2026-06-15 (14 days out at clock 2026-06-01)."
            - "ECONOMY OPEN fare class, refundable=true; passenger P holds+confirms+pays a single-leg booking; total_paid_cents=3600."
            - "Clock advanced to 2026-06-12 so cancel happens 3 days before departure."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SupportAgent
            - call: "POST /v1/operators"
              payload: { name: "Coastliner", mode: "BUS" }
              as: ScheduleManager
              captures: { op_id: $.data.id }
            - call: "POST /v1/fare-classes"
              payload: { operator_id: "${op_id}", code: "ECONOMY", seating_mode: "OPEN", surcharge_cents: 0, refundable: true }
              as: FareAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /v1/routes"
              payload: { operator_id: "${op_id}", origin_code: "NYP", destination_code: "BOS", depart_minute_of_day: 540, arrive_minute_of_day: 780 }
              as: ScheduleManager
              captures: { rt_id: $.data.id }
            - call: "POST /v1/routes/${rt_id}/publish"
              payload: {}
              as: ScheduleManager
            - call: "POST /v1/service-dates"
              payload: { route_id: "${rt_id}", departure_date: "2026-06-15", seats_total: 10, base_fare_cents: 4000 }
              as: ScheduleManager
              captures: { sd_id: $.data.id }
            - call: "POST /v1/passengers"
              payload: { full_name: "Pat Rider", email: "pat@x.com" }
              as: Passenger
              captures: { p_id: $.data.id }
            - call: "POST /v1/bookings"
              payload: { passenger_id: "${p_id}", funding_kind: "CASH", legs: [ { service_date_id: "${sd_id}", fare_class_id: "${fc_id}", leg_order: 1 } ] }
              as: Passenger
              as_user_id: "${p_id}"
              captures: { b_id: $.data.id }
            - call: "GET /v1/service-dates/${sd_id}"
              payload: {}
              as: Passenger
              captures: { sd_v: $.data.version }
            - call: "POST /v1/bookings/${b_id}/confirm"
              payload: { expected_service_date_version: "${sd_v}" }
              as: Passenger
              as_user_id: "${p_id}"
            - call: "POST /v1/bookings/${b_id}/pay"
              payload: {}
              as: Passenger
              as_user_id: "${p_id}"
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-12T00:00:00Z" }
              as: SupportAgent
          trigger:
            - call: "POST /v1/bookings/${b_id}/cancel"
              payload: { refund_destination: "TRAVEL_CREDIT" }
              as: Passenger
              as_user_id: "${p_id}"
              captures: { note_kind: $.data.payment_status }
          assert:
            - "Booking.${b_id}.payment_status == CREDITED"
            - "the created RefundCreditNote.settlement_kind == TRAVEL_CREDIT, gross_cents == 3600, penalty_cents == 540, net_cents == 3060"
            - "a CASH refund on the same inputs would instead yield penalty_cents == 900, net_cents == 2700 (the variant divergence)"

      - name: leg_fare_cash_vs_pass_funded_zero
        grounds:
          - calculations.leg_fare_cents
          - entities.BookingLeg.fields.fare_cents
          - entities.Booking.fields.funding_kind
          - entities.TravelPass.fields.rides_consumed
        distinguishing_aspect: |
          For the identical ServiceDate (base 4000, lf 0, 14 days out) a CASH leg prices to fare_cents=3600
          while a PASS-funded leg prices to fare_cents=0 and instead consumes one TravelPass ride — a
          dual-variant on the BookingLeg-fare domain (distinct from the Booking-settlement domain above).
        test_recipe:
          setup:
            - "Operator (BUS); PUBLISHED route; ServiceDate seats_total=10 base 4000 departure 2026-06-15; ECONOMY OPEN fare class."
            - "Passenger P with a TravelPass on the operator, rides_total=10."
            - "Two single-leg bookings on the same ServiceDate: one CASH, one PASS-funded; both confirmed."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SupportAgent
            - call: "POST /v1/operators"
              payload: { name: "Coastliner", mode: "BUS" }
              as: ScheduleManager
              captures: { op_id: $.data.id }
            - call: "POST /v1/fare-classes"
              payload: { operator_id: "${op_id}", code: "ECONOMY", seating_mode: "OPEN" }
              as: FareAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /v1/routes"
              payload: { operator_id: "${op_id}", origin_code: "NYP", destination_code: "BOS", depart_minute_of_day: 540, arrive_minute_of_day: 780 }
              as: ScheduleManager
              captures: { rt_id: $.data.id }
            - call: "POST /v1/routes/${rt_id}/publish"
              payload: {}
              as: ScheduleManager
            - call: "POST /v1/service-dates"
              payload: { route_id: "${rt_id}", departure_date: "2026-06-15", seats_total: 10, base_fare_cents: 4000 }
              as: ScheduleManager
              captures: { sd_id: $.data.id }
            - call: "POST /v1/passengers"
              payload: { full_name: "Pat Rider", email: "pat@x.com" }
              as: Passenger
              captures: { p_id: $.data.id }
            - call: "POST /v1/passes"
              payload: { passenger_id: "${p_id}", operator_id: "${op_id}", rides_total: 10, expires_on: "2026-12-31" }
              as: SupportAgent
              captures: { pass_id: $.data.id }
            - call: "POST /v1/bookings"
              payload: { passenger_id: "${p_id}", funding_kind: "CASH", legs: [ { service_date_id: "${sd_id}", fare_class_id: "${fc_id}", leg_order: 1 } ] }
              as: Passenger
              as_user_id: "${p_id}"
              captures: { b_cash: $.data.id }
            - call: "GET /v1/service-dates/${sd_id}"
              payload: {}
              as: Passenger
              captures: { sd_v1: $.data.version }
            - call: "POST /v1/bookings/${b_cash}/confirm"
              payload: { expected_service_date_version: "${sd_v1}" }
              as: Passenger
              as_user_id: "${p_id}"
            - call: "POST /v1/bookings"
              payload: { passenger_id: "${p_id}", funding_kind: "PASS", pass_id: "${pass_id}", legs: [ { service_date_id: "${sd_id}", fare_class_id: "${fc_id}", leg_order: 1 } ] }
              as: Passenger
              as_user_id: "${p_id}"
              captures: { b_pass: $.data.id }
            - call: "GET /v1/service-dates/${sd_id}"
              payload: {}
              as: Passenger
              captures: { sd_v2: $.data.version }
          trigger:
            - call: "POST /v1/bookings/${b_pass}/confirm"
              payload: { expected_service_date_version: "${sd_v2}" }
              as: Passenger
              as_user_id: "${p_id}"
          assert:
            - "the CASH booking's only BookingLeg.fare_cents == 3600 and Booking.${b_cash}.total_fare_cents == 3600"
            - "the PASS booking's only BookingLeg.fare_cents == 0 and Booking.${b_pass}.total_fare_cents == 0"
            - "TravelPass.${pass_id}.rides_consumed == 1 and rides_remaining == 9 after the pass booking confirms"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: leg_fare_nested_tier_branch_mode_a
        grounds:
          - calculations.leg_fare_cents
          - calculations.seat_inventory
          - entities.ServiceDate.fields.load_factor
        distinguishing_aspect: |
          MODE (a): leg_fare_cents has 3 interacting inputs (load-factor tier, advance-window tier,
          surcharge branch) with non-linear tier selection — lf=0.5 selects demand 1.25, 10-days-out
          selects advance 1.00, ECONOMY adds 0; raw=4000*1.25*1.00 rounds to fare_cents=5000.
        test_recipe:
          setup:
            - "Operator; PUBLISHED route; ServiceDate seats_total=2 base 4000 departure 2026-06-11 (10 days out)."
            - "ECONOMY OPEN fare class. One booking already CONFIRMED on the SD so seats_sold=1, load_factor=0.5."
            - "Test passenger holds a second single-leg booking on the same SD."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SupportAgent
            - call: "POST /v1/operators"
              payload: { name: "Coastliner", mode: "BUS" }
              as: ScheduleManager
              captures: { op_id: $.data.id }
            - call: "POST /v1/fare-classes"
              payload: { operator_id: "${op_id}", code: "ECONOMY", seating_mode: "OPEN" }
              as: FareAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /v1/routes"
              payload: { operator_id: "${op_id}", origin_code: "NYP", destination_code: "BOS", depart_minute_of_day: 540, arrive_minute_of_day: 780 }
              as: ScheduleManager
              captures: { rt_id: $.data.id }
            - call: "POST /v1/routes/${rt_id}/publish"
              payload: {}
              as: ScheduleManager
            - call: "POST /v1/service-dates"
              payload: { route_id: "${rt_id}", departure_date: "2026-06-11", seats_total: 2, base_fare_cents: 4000 }
              as: ScheduleManager
              captures: { sd_id: $.data.id }
            - call: "POST /v1/passengers"
              payload: { full_name: "First Buyer", email: "first@x.com" }
              as: Passenger
              captures: { p1_id: $.data.id }
            - call: "POST /v1/bookings"
              payload: { passenger_id: "${p1_id}", funding_kind: "CASH", legs: [ { service_date_id: "${sd_id}", fare_class_id: "${fc_id}", leg_order: 1 } ] }
              as: Passenger
              as_user_id: "${p1_id}"
              captures: { b1: $.data.id }
            - call: "GET /v1/service-dates/${sd_id}"
              payload: {}
              as: Passenger
              captures: { sd_v0: $.data.version }
            - call: "POST /v1/bookings/${b1}/confirm"
              payload: { expected_service_date_version: "${sd_v0}" }
              as: Passenger
              as_user_id: "${p1_id}"
            - call: "POST /v1/passengers"
              payload: { full_name: "Test Buyer", email: "test@x.com" }
              as: Passenger
              captures: { p2_id: $.data.id }
            - call: "POST /v1/bookings"
              payload: { passenger_id: "${p2_id}", funding_kind: "CASH", legs: [ { service_date_id: "${sd_id}", fare_class_id: "${fc_id}", leg_order: 1 } ] }
              as: Passenger
              as_user_id: "${p2_id}"
              captures: { b2: $.data.id }
            - call: "GET /v1/service-dates/${sd_id}"
              payload: {}
              as: Passenger
              captures: { sd_v1: $.data.version }
          trigger:
            - call: "POST /v1/bookings/${b2}/confirm"
              payload: { expected_service_date_version: "${sd_v1}" }
              as: Passenger
              as_user_id: "${p2_id}"
          assert:
            - "the test booking's BookingLeg.fare_cents == 5000 (4000 * 1.25 * 1.00, rounded)"
            - "Booking.${b2}.total_fare_cents == 5000"

      - name: total_fare_per_leg_round_then_sum_mode_b
        grounds:
          - calculations.total_fare_cents
          - calculations.leg_fare_cents
          - entities.Booking.fields.total_fare_cents
        distinguishing_aspect: |
          MODE (b): rounding-order pinned. Two legs each raw 3749.625 (=3333*1.25*0.90). Round-per-leg
          then sum yields 3750+3750=7500; sum-raw-then-round-once would yield 7499. The scaffold pins
          per-leg rounding, so total_fare_cents == 7500.
        test_recipe:
          setup:
            - "Operator with default_connection_buffer_min=30, exchange_fee default."
            - "Two PUBLISHED routes, each one ServiceDate seats_total=2 base 3333 departure 2026-06-15 (14 days out); ECONOMY OPEN class."
            - "Each ServiceDate has 1 booking pre-confirmed so seats_sold=1, load_factor=0.5 (demand 1.25)."
            - "Route1 arrive_minute 600, Route2 depart_minute 700 so connection gap 100 >= 30 (buffer satisfied)."
            - "Test passenger holds one 2-leg booking spanning both ServiceDates."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SupportAgent
            - call: "POST /v1/operators"
              payload: { name: "Coastliner", mode: "RAIL", default_connection_buffer_min: 30 }
              as: ScheduleManager
              captures: { op_id: $.data.id }
            - call: "POST /v1/fare-classes"
              payload: { operator_id: "${op_id}", code: "ECONOMY", seating_mode: "OPEN" }
              as: FareAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /v1/routes"
              payload: { operator_id: "${op_id}", origin_code: "NYP", destination_code: "PHL", depart_minute_of_day: 540, arrive_minute_of_day: 600 }
              as: ScheduleManager
              captures: { rt1: $.data.id }
            - call: "POST /v1/routes/${rt1}/publish"
              payload: {}
              as: ScheduleManager
            - call: "POST /v1/routes"
              payload: { operator_id: "${op_id}", origin_code: "PHL", destination_code: "WAS", depart_minute_of_day: 700, arrive_minute_of_day: 820 }
              as: ScheduleManager
              captures: { rt2: $.data.id }
            - call: "POST /v1/routes/${rt2}/publish"
              payload: {}
              as: ScheduleManager
            - call: "POST /v1/service-dates"
              payload: { route_id: "${rt1}", departure_date: "2026-06-15", seats_total: 2, base_fare_cents: 3333 }
              as: ScheduleManager
              captures: { sd1: $.data.id }
            - call: "POST /v1/service-dates"
              payload: { route_id: "${rt2}", departure_date: "2026-06-15", seats_total: 2, base_fare_cents: 3333 }
              as: ScheduleManager
              captures: { sd2: $.data.id }
            - call: "POST /v1/passengers"
              payload: { full_name: "Seed One", email: "s1@x.com" }
              as: Passenger
              captures: { ps1: $.data.id }
            - call: "POST /v1/bookings"
              payload: { passenger_id: "${ps1}", funding_kind: "CASH", legs: [ { service_date_id: "${sd1}", fare_class_id: "${fc_id}", leg_order: 1 } ] }
              as: Passenger
              as_user_id: "${ps1}"
              captures: { bs1: $.data.id }
            - call: "GET /v1/service-dates/${sd1}"
              payload: {}
              as: Passenger
              captures: { sd1_v0: $.data.version }
            - call: "POST /v1/bookings/${bs1}/confirm"
              payload: { expected_service_date_version: "${sd1_v0}" }
              as: Passenger
              as_user_id: "${ps1}"
            - call: "POST /v1/passengers"
              payload: { full_name: "Seed Two", email: "s2@x.com" }
              as: Passenger
              captures: { ps2: $.data.id }
            - call: "POST /v1/bookings"
              payload: { passenger_id: "${ps2}", funding_kind: "CASH", legs: [ { service_date_id: "${sd2}", fare_class_id: "${fc_id}", leg_order: 1 } ] }
              as: Passenger
              as_user_id: "${ps2}"
              captures: { bs2: $.data.id }
            - call: "GET /v1/service-dates/${sd2}"
              payload: {}
              as: Passenger
              captures: { sd2_v0: $.data.version }
            - call: "POST /v1/bookings/${bs2}/confirm"
              payload: { expected_service_date_version: "${sd2_v0}" }
              as: Passenger
              as_user_id: "${ps2}"
            - call: "POST /v1/passengers"
              payload: { full_name: "Test Buyer", email: "test@x.com" }
              as: Passenger
              captures: { pt: $.data.id }
            - call: "POST /v1/bookings"
              payload: { passenger_id: "${pt}", funding_kind: "CASH", legs: [ { service_date_id: "${sd1}", fare_class_id: "${fc_id}", leg_order: 1 }, { service_date_id: "${sd2}", fare_class_id: "${fc_id}", leg_order: 2 } ] }
              as: Passenger
              as_user_id: "${pt}"
              captures: { bt: $.data.id }
            - call: "GET /v1/service-dates/${sd1}"
              payload: {}
              as: Passenger
              captures: { sd1_v1: $.data.version }
          trigger:
            - call: "POST /v1/bookings/${bt}/confirm"
              payload: { expected_service_date_version: "${sd1_v1}" }
              as: Passenger
              as_user_id: "${pt}"
          assert:
            - "each of the test booking's two BookingLeg.fare_cents == 3750"
            - "Booking.${bt}.total_fare_cents == 7500 (per-leg round then sum; NOT 7499)"

      - name: exchange_amount_pinned_eval_order_mode_c
        grounds:
          - calculations.exchange_amount
          - calculations.leg_fare_cents
          - state_machines.Booking.booking_status.CONFIRMED_to_EXCHANGED
          - entities.Operator.fields.exchange_fee_cents
        distinguishing_aspect: |
          MODE (c): exchange_amount has a circular-looking dependency (the settlement amount depends on
          new_leg_fare, which is itself a fresh pricing of the target ServiceDate). The scaffold pins the
          evaluation order: compute new_leg_fare first (5600 = 4000*1.00*1.40 at 2-days-out), THEN
          amount_due = 5600 - old_paid(3600) + exchange_fee(1000) = 3000.
        test_recipe:
          setup:
            - "Operator exchange_fee_cents=1000; PUBLISHED route; original ServiceDate seats_total=10 base 4000 departure 2026-06-15 (14 days out)."
            - "ECONOMY OPEN class; passenger P confirms+pays a single-leg booking -> total_paid_cents=3600."
            - "A target ServiceDate seats_total=10 base 4000 departure 2026-06-03; clock advanced to 2026-06-01 so target is 2 days out at exchange time."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SupportAgent
            - call: "POST /v1/operators"
              payload: { name: "Coastliner", mode: "BUS", exchange_fee_cents: 1000 }
              as: ScheduleManager
              captures: { op_id: $.data.id }
            - call: "POST /v1/fare-classes"
              payload: { operator_id: "${op_id}", code: "ECONOMY", seating_mode: "OPEN" }
              as: FareAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /v1/routes"
              payload: { operator_id: "${op_id}", origin_code: "NYP", destination_code: "BOS", depart_minute_of_day: 540, arrive_minute_of_day: 780 }
              as: ScheduleManager
              captures: { rt_id: $.data.id }
            - call: "POST /v1/routes/${rt_id}/publish"
              payload: {}
              as: ScheduleManager
            - call: "POST /v1/service-dates"
              payload: { route_id: "${rt_id}", departure_date: "2026-06-15", seats_total: 10, base_fare_cents: 4000 }
              as: ScheduleManager
              captures: { sd_orig: $.data.id }
            - call: "POST /v1/service-dates"
              payload: { route_id: "${rt_id}", departure_date: "2026-06-03", seats_total: 10, base_fare_cents: 4000 }
              as: ScheduleManager
              captures: { sd_target: $.data.id }
            - call: "POST /v1/passengers"
              payload: { full_name: "Pat Rider", email: "pat@x.com" }
              as: Passenger
              captures: { p_id: $.data.id }
            - call: "POST /v1/bookings"
              payload: { passenger_id: "${p_id}", funding_kind: "CASH", legs: [ { service_date_id: "${sd_orig}", fare_class_id: "${fc_id}", leg_order: 1 } ] }
              as: Passenger
              as_user_id: "${p_id}"
              captures: { b_id: $.data.id }
            - call: "GET /v1/service-dates/${sd_orig}"
              payload: {}
              as: Passenger
              captures: { sd_orig_v: $.data.version }
            - call: "POST /v1/bookings/${b_id}/confirm"
              payload: { expected_service_date_version: "${sd_orig_v}" }
              as: Passenger
              as_user_id: "${p_id}"
            - call: "POST /v1/bookings/${b_id}/pay"
              payload: {}
              as: Passenger
              as_user_id: "${p_id}"
            - call: "GET /v1/bookings/${b_id}"
              payload: {}
              as: Passenger
              captures: { b_v: $.data.version }
          trigger:
            - call: "POST /v1/bookings/${b_id}/exchange"
              payload: { target_service_date_id: "${sd_target}", target_fare_class_id: "${fc_id}", expected_booking_version: "${b_v}" }
              as: Passenger
              as_user_id: "${p_id}"
              captures: { new_booking: $.data.id }
          assert:
            - "Booking.${b_id}.booking_status == EXCHANGED"
            - "the new replacement Booking has total_fare_cents == 5600 and booking_status == CONFIRMED, payment_status == PAID"
            - "the recorded settlement amount_due == 3000 (5600 - 3600 + 1000)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: service_date_delay_restore_cycle
        grounds:
          - state_machines.ServiceDate.lifecycle.SCHEDULED_to_DELAYED
          - state_machines.ServiceDate.lifecycle.DELAYED_to_SCHEDULED
        distinguishing_aspect: |
          ServiceDate.lifecycle is CYCLIC: SCHEDULED -> DELAYED -> SCHEDULED returns to the original
          state, proving a non-linear (looping) machine on the ServiceDate entity.
        test_recipe:
          setup:
            - "Operator; PUBLISHED route; one ServiceDate (SCHEDULED)."
          setup_api_calls:
            - call: "POST /v1/operators"
              payload: { name: "Coastliner", mode: "RAIL" }
              as: ScheduleManager
              captures: { op_id: $.data.id }
            - call: "POST /v1/routes"
              payload: { operator_id: "${op_id}", origin_code: "NYP", destination_code: "BOS", depart_minute_of_day: 540, arrive_minute_of_day: 780 }
              as: ScheduleManager
              captures: { rt_id: $.data.id }
            - call: "POST /v1/routes/${rt_id}/publish"
              payload: {}
              as: ScheduleManager
            - call: "POST /v1/service-dates"
              payload: { route_id: "${rt_id}", departure_date: "2026-06-15", seats_total: 10, base_fare_cents: 4000 }
              as: ScheduleManager
              captures: { sd_id: $.data.id }
            - call: "POST /v1/service-dates/${sd_id}/delay"
              payload: {}
              as: ScheduleManager
          trigger:
            - call: "POST /v1/service-dates/${sd_id}/restore"
              payload: {}
              as: ScheduleManager
          assert:
            - "after delay then restore, ServiceDate.${sd_id}.lifecycle == SCHEDULED"
            - "ServiceDate.${sd_id}.version increased by exactly 2 from its post-create value (one per transition)"

      - name: booking_parallel_status_axes_independent
        grounds:
          - state_machines.Booking.booking_status.HELD_to_CONFIRMED
          - state_machines.Booking.payment_status.UNPAID_to_PAID
          - entities.Booking.fields.booking_status
          - entities.Booking.fields.payment_status
        distinguishing_aspect: |
          Booking carries TWO independent (parallel) state dimensions on the SAME row: booking_status
          advances HELD->CONFIRMED via /confirm while payment_status stays UNPAID, then payment_status
