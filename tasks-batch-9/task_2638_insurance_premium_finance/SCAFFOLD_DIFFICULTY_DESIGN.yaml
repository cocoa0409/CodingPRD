# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2638 — Insurance Premium Finance
# Nine rule_id blocks, two instances each (18 instances). Every instance grounds
# in SCAFFOLD.yaml §1.1–§1.7 and is driven from empty-DB by its setup_api_calls.
# Recurring fixture literals used across instances:
#   TX rule  : ADD_ON, cap 1800 bps, service-fee cap 2000, min down 1500 bps,
#              max term 10, late fee 500 bps in [500, 10000], grace 10 days,
#              NOIC 10 days, PRO_RATA, short-rate 1000 bps, RULE_OF_78, 3 fees
#   CA rule  : SIMPLE_INTEREST, cap 1200 bps, service-fee cap 1500, min down
#              2000 bps, max term 8, late fee 1000 bps in [1000, 1500], grace 7,
#              NOIC 15 days, SHORT_RATE, ACTUARIAL, 2 fees
#   startup logical clock = 2026-08-01T00:00:00Z (per §1.5 /_clock endpoint)
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: provisional_vs_final_premium_basis_divergence
        grounds:
          - calculations.finance_charge_and_amount_financed
          - entities.PremiumFinanceAgreement.fields.quote_basis
          - entities.FinancedPolicy.fields.financed_premium_cents
          - state_machines.PremiumFinanceAgreement.DRAFT_to_PENDING_VERIFICATION
          - state_machines.PremiumFinanceAgreement.PENDING_VERIFICATION_to_ACTIVE
        distinguishing_aspect: |
          This instance exercises dual-variant logic in the PRICING domain of PremiumFinanceAgreement:
          the provisional variant sums agency-quoted FinancedPolicy.gross_premium_cents over
          PENDING_VERIFICATION policies at submit, the final variant sums attested
          financed_premium_cents over VERIFIED policies at activation, so the SAME agreement carries
          two different finance charges (135225 vs 140850) with no input from the borrower changing.
        test_recipe:
          setup:
            - "logical clock at 2026-08-15; one TX StateRateRule (ADD_ON, 1800 bps cap, min down 1500 bps, max term 10, service-fee cap 2000) with one effective License"
            - "one Insured, one ProducerAgent (COMMISSION_CAPPED, 1200 bps commission), one Insurer"
            - "one DRAFT PremiumFinanceAgreement with down_payment_cents 300000, service_fee_cents 2000, installment_count 9, first_installment_due_date 2026-10-01"
            - "two PENDING_VERIFICATION FinancedPolicy rows on that agreement: 1200000 and 300000 gross premium, both 2026-09-01 -> 2027-09-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-rate-rules"
              payload: { state_code: "TX", finance_charge_method: "ADD_ON", max_annual_rate_bps: 1800, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 10, late_fee_bps: 500, late_fee_min_cents: 500, late_fee_max_cents: 10000, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3, license_required: true }
              as: ComplianceOfficer
              captures: { rule_tx: "$.data.id" }
            - call: "POST /state-rate-rules/${rule_tx}/licenses"
              payload: { license_number: "PFC-TX-001", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ComplianceOfficer
              captures: { lic_tx: "$.data.id" }
            - call: "POST /insureds"
              payload: { legal_name: "Northwind Freight LLC", mailing_state_code: "TX", email: "ap@northwind.example" }
              as: FinanceAnalyst
              captures: { insured_1: "$.data.id" }
            - call: "POST /agents"
              payload: { agency_name: "Lone Star Brokers", state_code: "TX", agent_commission_bps: 1200, chargeback_basis: "COMMISSION_CAPPED", chargeback_liability_cap_cents: 500000, initial_reserve_balance_cents: 100000 }
              as: ComplianceOfficer
              captures: { agent_1: "$.data.id" }
            - call: "POST /insurers"
              payload: { carrier_name: "Meridian Casualty", naic_code: "10123", status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { insurer_1: "$.data.id" }
            - call: "POST /agreements"
              payload: { insured_id: "${insured_1}", producer_agent_id: "${agent_1}", state_rule_id: "${rule_tx}", down_payment_cents: 300000, service_fee_cents: 2000, installment_count: 9, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { agr_1: "$.data.id" }
            - call: "POST /agreements/${agr_1}/policies"
              payload: { insurer_id: "${insurer_1}", policy_number: "MC-TX-1001", gross_premium_cents: 1200000, effective_date: "2026-09-01", expiration_date: "2027-09-01", min_earned_days: 30, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { pol_1: "$.data.id" }
            - call: "POST /agreements/${agr_1}/policies"
              payload: { insurer_id: "${insurer_1}", policy_number: "MC-TX-1002", gross_premium_cents: 300000, effective_date: "2026-09-01", expiration_date: "2027-09-01", min_earned_days: 0, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { pol_2: "$.data.id" }
          trigger:
            - call: "POST /agreements/${agr_1}/submit"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { prov_total: "$.data.total_premium_cents", prov_af: "$.data.amount_financed_cents", prov_rate: "$.data.effective_annual_rate_bps", prov_fc: "$.data.finance_charge_cents", prov_top: "$.data.total_of_payments_cents", prov_basis: "$.data.quote_basis" }
            - call: "POST /policies/${pol_1}/verifications"
              payload: { decision: "CORRECTED", corrected_premium_cents: 1250000, corrected_effective_date: "2026-09-01", note: "carrier bound at audited exposure" }
              as: Insurer
              as_user_id: "${insurer_1}"
            - call: "POST /policies/${pol_1}/verifications"
              payload: { decision: "CORRECTED", corrected_premium_cents: 1250000, corrected_effective_date: "2026-09-01" }
              as: ProducerAgent
              as_user_id: "${agent_1}"
            - call: "POST /policies/${pol_2}/verifications"
              payload: { decision: "CONFIRMED" }
              as: Insurer
              as_user_id: "${insurer_1}"
            - call: "POST /policies/${pol_2}/verifications"
              payload: { decision: "CONFIRMED" }
              as: ProducerAgent
              as_user_id: "${agent_1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /agreements/${agr_1}/activate"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { fin_total: "$.data.total_premium_cents", fin_af: "$.data.amount_financed_cents", fin_rate: "$.data.effective_annual_rate_bps", fin_fc: "$.data.finance_charge_cents", fin_top: "$.data.total_of_payments_cents", fin_basis: "$.data.quote_basis" }
            - call: "GET /agreements/${agr_1}/installments"
              payload: { limit: 100 }
              as: FinanceAnalyst
          assert:
            - "${prov_basis} == 'PROVISIONAL' and ${fin_basis} == 'FINAL'"
            - "${prov_total} == 1500000 (1200000 + 300000 agency-quoted gross premiums)"
            - "${prov_af} == 1202000 (1500000 - 300000 down + 2000 service fee)"
            - "${prov_rate} == 1500 (1202000 falls in TIER2, and 1500 <= the TX cap of 1800)"
            - "${prov_fc} == 135225 and ${prov_top} == 1337225"
            - "${fin_total} == 1550000 (attested 1250000 + confirmed 300000)"
            - "${fin_af} == 1252000 and ${fin_rate} == 1500"
            - "${fin_fc} == 140850 and ${fin_top} == 1392850"
            - "${fin_fc} - ${prov_fc} == 5625 — the variant switch alone moved the finance charge"
            - "PremiumFinanceAgreement.${agr_1}.principal_balance_cents == 1252000 and unpaid_finance_charge_cents == 140850"
            - "GET /agreements/${agr_1}/installments returns total_count == 9; $.data[0].amount_cents == 154761, $.data[0].finance_charge_component_cents == 15650, $.data[0].principal_component_cents == 139111, $.data[0].due_date == '2026-10-01'"
            - "$.data[8].amount_cents == 154762 and $.data[8].due_date == '2027-06-01' — the floor remainder lands on the final installment only"

      - name: commission_capped_vs_reserve_capped_chargeback_divergence
        grounds:
          - calculations.deficiency_and_agent_chargeback
          - entities.ProducerAgent.fields.chargeback_basis
          - entities.ProducerAgent.fields.chargeback_liability_cap_cents
          - entities.AgentChargeback.fields.amount_cents
          - state_machines.PremiumFinanceAgreement.ACTIVE_to_CANCELLED_DEFICIENT
          - state_machines.ProducerAgent.ACTIVE_to_SUSPENDED_FOR_CHARGEBACKS
        distinguishing_aspect: |
          This instance exercises dual-variant logic in a DIFFERENT entity domain — agency credit
          exposure on ProducerAgent, not note pricing on PremiumFinanceAgreement: two agencies with
          byte-identical notes and an identical 111497 deficiency produce chargebacks of 72000
          (capped by earned commission) versus 25000 (capped by liability headroom), and only the
          reserve-capped agency is suspended.
        test_recipe:
          setup:
            - "logical clock at 2026-10-22; one TX StateRateRule with an effective License; one Insured; one Insurer"
            - "two ProducerAgents on identical commission (1200 bps): agent_a COMMISSION_CAPPED with a 500000 liability cap, agent_b RESERVE_CAPPED with a 25000 liability cap"
            - "two identical ACTIVE agreements (one per agency): single 600000 policy, down 100000, service fee 2000, 6 installments, amount_financed 502000, finance charge 37650"
            - "both agreements delinquent with a 4497 OUTSTANDING late fee, both notices issued 2026-10-12 and executed 2026-10-22, one REQUESTED CarrierCancellationRequest each"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-rate-rules"
              payload: { state_code: "TX", finance_charge_method: "ADD_ON", max_annual_rate_bps: 1800, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 10, late_fee_bps: 500, late_fee_min_cents: 500, late_fee_max_cents: 10000, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3, license_required: true }
              as: ComplianceOfficer
              captures: { rule_tx: "$.data.id" }
            - call: "POST /state-rate-rules/${rule_tx}/licenses"
              payload: { license_number: "PFC-TX-001", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ComplianceOfficer
            - call: "POST /insureds"
              payload: { legal_name: "Northwind Freight LLC", mailing_state_code: "TX", email: "ap@northwind.example" }
              as: FinanceAnalyst
              captures: { insured_1: "$.data.id" }
            - call: "POST /insurers"
              payload: { carrier_name: "Meridian Casualty", naic_code: "10123", status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { insurer_1: "$.data.id" }
            - call: "POST /agents"
              payload: { agency_name: "Lone Star Brokers", state_code: "TX", agent_commission_bps: 1200, chargeback_basis: "COMMISSION_CAPPED", chargeback_liability_cap_cents: 500000, initial_reserve_balance_cents: 100000 }
              as: ComplianceOfficer
              captures: { agent_a: "$.data.id" }
            - call: "POST /agents"
              payload: { agency_name: "Gulf Coast Agency", state_code: "TX", agent_commission_bps: 1200, chargeback_basis: "RESERVE_CAPPED", chargeback_liability_cap_cents: 25000, initial_reserve_balance_cents: 50000 }
              as: ComplianceOfficer
              captures: { agent_b: "$.data.id" }
            - call: "POST /agreements"
              payload: { insured_id: "${insured_1}", producer_agent_id: "${agent_a}", state_rule_id: "${rule_tx}", down_payment_cents: 100000, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { agr_a: "$.data.id" }
            - call: "POST /agreements/${agr_a}/policies"
              payload: { insurer_id: "${insurer_1}", policy_number: "MC-A-2001", gross_premium_cents: 600000, effective_date: "2026-09-01", expiration_date: "2027-09-01", min_earned_days: 0, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { pol_a: "$.data.id" }
            - call: "POST /agreements/${agr_a}/submit"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
            - call: "POST /policies/${pol_a}/verifications"
              payload: { decision: "CONFIRMED" }
              as: Insurer
              as_user_id: "${insurer_1}"
            - call: "POST /policies/${pol_a}/verifications"
              payload: { decision: "CONFIRMED" }
              as: ProducerAgent
              as_user_id: "${agent_a}"
            - call: "POST /agreements"
              payload: { insured_id: "${insured_1}", producer_agent_id: "${agent_b}", state_rule_id: "${rule_tx}", down_payment_cents: 100000, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { agr_b: "$.data.id" }
            - call: "POST /agreements/${agr_b}/policies"
              payload: { insurer_id: "${insurer_1}", policy_number: "MC-B-2001", gross_premium_cents: 600000, effective_date: "2026-09-01", expiration_date: "2027-09-01", min_earned_days: 0, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { pol_b: "$.data.id" }
            - call: "POST /agreements/${agr_b}/submit"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
            - call: "POST /policies/${pol_b}/verifications"
              payload: { decision: "CONFIRMED" }
              as: Insurer
              as_user_id: "${insurer_1}"
            - call: "POST /policies/${pol_b}/verifications"
              payload: { decision: "CONFIRMED" }
              as: ProducerAgent
              as_user_id: "${agent_b}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /agreements/${agr_a}/activate"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
            - call: "POST /agreements/${agr_b}/activate"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-12T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /servicing-runs"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /agreements/${agr_a}/cancellation-notices"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-notice"
            - call: "POST /agreements/${agr_b}/cancellation-notices"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-notice"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-22T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /agreements/${agr_a}/cancellation-executions"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-poa"
            - call: "POST /agreements/${agr_b}/cancellation-executions"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-poa"
            - call: "GET /carrier-cancellation-requests"
              payload: { agreement_id: "${agr_a}", limit: 10 }
              as: ComplianceOfficer
              captures: { ccr_a: "$.data[0].id" }
            - call: "GET /carrier-cancellation-requests"
              payload: { agreement_id: "${agr_b}", limit: 10 }
              as: ComplianceOfficer
              captures: { ccr_b: "$.data[0].id" }
          trigger:
            - call: "POST /carrier-cancellation-requests/${ccr_a}/return-posting"
              payload: { carrier_returned_cents: 400000, posted_date: "2026-10-30" }
              as: Insurer
              as_user_id: "${insurer_1}"
            - call: "POST /carrier-cancellation-requests/${ccr_b}/return-posting"
              payload: { carrier_returned_cents: 400000, posted_date: "2026-10-30" }
              as: Insurer
              as_user_id: "${insurer_1}"
            - call: "GET /agent-chargebacks"
              payload: { producer_agent_id: "${agent_a}", limit: 10 }
              as: ComplianceOfficer
              captures: { cb_a_amount: "$.data[0].amount_cents", cb_a_basis: "$.data[0].basis" }
            - call: "GET /agent-chargebacks"
              payload: { producer_agent_id: "${agent_b}", limit: 10 }
              as: ComplianceOfficer
              captures: { cb_b_amount: "$.data[0].amount_cents", cb_b_basis: "$.data[0].basis" }
          assert:
            - "PremiumFinanceAgreement.${agr_a}.deficiency_balance_cents == 111497 and PremiumFinanceAgreement.${agr_b}.deficiency_balance_cents == 111497 (deficiency_before_fee 106497 + TIER2 fee 5000, identical on both notes)"
            - "${cb_a_basis} == 'COMMISSION_CAPPED' and ${cb_a_amount} == 72000 (min(111497, round_half_up(600000 * 1200 / 10000)))"
            - "${cb_b_basis} == 'RESERVE_CAPPED' and ${cb_b_amount} == 25000 (min(111497, 25000 - 0 headroom))"
            - "${cb_a_amount} - ${cb_b_amount} == 47000 — identical data, two variants, different results"
            - "PremiumFinanceAgreement.${agr_a}.agent_chargeback_cents == 72000 and PremiumFinanceAgreement.${agr_b}.agent_chargeback_cents == 25000"
            - "ProducerAgent.${agent_a}.status == 'ACTIVE' and outstanding_chargeback_cents == 72000 (72000 < the 500000 cap)"
            - "ProducerAgent.${agent_b}.status == 'SUSPENDED_FOR_CHARGEBACKS' and outstanding_chargeback_cents == 25000 (25000 >= the 25000 cap)"
            - "both agreements: status == 'CANCELLED_DEFICIENT', delinquency_stage == 'CANCELLED', unearned_premium_received_cents == 400000, principal_balance_cents == 102000, unpaid_finance_charge_cents == 0, late_fee_balance_cents == 4497"
            - "CarrierCancellationRequest.${ccr_a}.status == 'RETURN_POSTED' and variance_cents == -116164 (400000 - 516164 estimated)"

  - rule_id: combinatorial_formula
    instances:

      - name: tiered_rate_boundary_nested_under_statutory_ceiling
        grounds:
          - calculations.finance_charge_and_amount_financed
          - calculations.finance_charge_and_amount_financed.constants.TIER1_MAX_AMOUNT_FINANCED_CENTS
          - calculations.installment_schedule_generation
          - entities.StateRateRule.fields.max_annual_rate_bps
          - entities.StateRateRule.fields.finance_charge_method
        distinguishing_aspect: |
          MODE (a) — a single output assembled from more than three interacting inputs through a
          three-way tier lookup nested inside a min() against the statutory ceiling and then a
          method branch: effective_annual_rate_bps = min(tier_rate_bps(amount_financed_cents),
          R.max_annual_rate_bps) feeds a finance charge whose shape depends on
          R.finance_charge_method and A.installment_count. Three notes prove all three legs at once:
          one cent more financed drops the tier rate from 1800 to 1500, and a CA note whose tier
          rate would be 1800 is clamped to 1200 by statute. No rounding-order or circular
          dependency is involved here.
        test_recipe:
          setup:
            - "logical clock at 2026-08-15; a TX StateRateRule (ADD_ON, max_annual_rate_bps 1800, min down 1500 bps, max term 10, service-fee cap 2000) and a CA StateRateRule (SIMPLE_INTEREST, max_annual_rate_bps 1200, min down 2000 bps, max term 8, service-fee cap 1500), each with one effective License"
            - "one Insured, one ProducerAgent, one Insurer"
            - "note X on TX: down 102000, service fee 2000, one 600000 policy -> amount_financed exactly 500000 (the TIER1 ceiling)"
            - "note Y on TX: down 101999, service fee 2000, one 600000 policy -> amount_financed 500001 (one cent past the TIER1 ceiling)"
            - "note Z on CA: down 120000, service fee 1500, one 600000 policy -> amount_financed 481500, still inside TIER1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-rate-rules"
              payload: { state_code: "TX", finance_charge_method: "ADD_ON", max_annual_rate_bps: 1800, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 10, late_fee_bps: 500, late_fee_min_cents: 500, late_fee_max_cents: 10000, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3, license_required: true }
              as: ComplianceOfficer
              captures: { rule_tx: "$.data.id" }
            - call: "POST /state-rate-rules/${rule_tx}/licenses"
              payload: { license_number: "PFC-TX-001", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ComplianceOfficer
            - call: "POST /state-rate-rules"
              payload: { state_code: "CA", finance_charge_method: "SIMPLE_INTEREST", max_annual_rate_bps: 1200, max_service_fee_cents: 1500, min_down_payment_bps: 2000, max_term_months: 8, late_fee_bps: 1000, late_fee_min_cents: 1000, late_fee_max_cents: 1500, grace_period_days: 7, noic_notice_days: 15, unearned_premium_method: "SHORT_RATE", short_rate_penalty_bps: 1000, rebate_method: "ACTUARIAL", max_late_fees_per_agreement: 2, license_required: true }
              as: ComplianceOfficer
              captures: { rule_ca: "$.data.id" }
            - call: "POST /state-rate-rules/${rule_ca}/licenses"
              payload: { license_number: "PFC-CA-001", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ComplianceOfficer
            - call: "POST /insureds"
              payload: { legal_name: "Northwind Freight LLC", mailing_state_code: "TX", email: "ap@northwind.example" }
              as: FinanceAnalyst
              captures: { insured_1: "$.data.id" }
            - call: "POST /agents"
              payload: { agency_name: "Lone Star Brokers", state_code: "TX", agent_commission_bps: 1200, chargeback_basis: "COMMISSION_CAPPED", chargeback_liability_cap_cents: 500000, initial_reserve_balance_cents: 100000 }
              as: ComplianceOfficer
              captures: { agent_1: "$.data.id" }
            - call: "POST /insurers"
              payload: { carrier_name: "Meridian Casualty", naic_code: "10123", status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { insurer_1: "$.data.id" }
            - call: "POST /agreements"
              payload: { insured_id: "${insured_1}", producer_agent_id: "${agent_1}", state_rule_id: "${rule_tx}", down_payment_cents: 102000, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { agr_x: "$.data.id" }
            - call: "POST /agreements/${agr_x}/policies"
              payload: { insurer_id: "${insurer_1}", policy_number: "MC-X-3001", gross_premium_cents: 600000, effective_date: "2026-09-01", expiration_date: "2027-09-01", min_earned_days: 0, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
            - call: "POST /agreements"
              payload: { insured_id: "${insured_1}", producer_agent_id: "${agent_1}", state_rule_id: "${rule_tx}", down_payment_cents: 101999, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
