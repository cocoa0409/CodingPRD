      - name: code_status_two_rung_jump_returns_ladder_violation
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
          - errors[ERR_CODE_STATUS_LADDER_VIOLATION]
          - entities.CodeStatusOrder.fields.ladder_direction
        distinguishing_aspect: "Moving FULL_CODE straight to DNR_DNI is two rungs and exceeds MAX_LADDER_STEP_PER_ORDER, so the attestation is rejected and the order stays DRAFT with Patient.code_status unchanged at FULL_CODE."
        test_recipe:
          setup:
            - "One Patient in program_status ACTIVE with code_status FULL_CODE and code_status_rank 1."
            - "One CodeStatusOrder requesting DNR_DNI in status DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
