  - rule_id: transitive_cascade
    instances:

      - name: permit_join_cascade_to_pad_occupation
        grounds:
          state_machines: [Permit, PlacementRequest, PortableUnit, PlacementSite]
          entities: [Permit, PlacementRequest, CapitalBudget, PortableUnit, PlacementSite]
          endpoints: ["POST /facilities/permits/{id}/decision"]
        depth: 4
        chain: "POST /facilities/permits/{id}/decision APPROVED on the last outstanding permit -> Permit SUBMITTED becomes APPROVED -> because every permit of the request is now APPROVED the PlacementRequest joins PERMIT_PENDING to PERMITTED and encumbers 7,741,440 cents against the CapitalBudget -> because the request is PERMITTED the PortableUnit moves allocation_status RESERVED to SCHEDULED -> because the unit is SCHEDULED the PlacementSite records occupied_by_unit_id"
        distinguishing_aspect: >
          Each link is caused strictly by the previous one and none of them can be
          reached by any direct call. The pad is not stamped by anything a client
          sends: it is stamped because the unit became SCHEDULED, which happened
          because the request joined to PERMITTED, which happened because the third
          permit was approved. Approving only the first two permits leaves all
          three downstream links untouched, so an implementation that stamps the
          pad at request creation, or that encumbers the budget at permit
          submission, produces the right final state for the wrong reason and fails
          the two-approval checkpoint.
        setup_api_calls:
          - call: "POST /facilities/_clock/set_current_utc"
            payload: { to_iso8601: "2027-03-01T00:00:00Z" }
            as: DistrictAdmin
