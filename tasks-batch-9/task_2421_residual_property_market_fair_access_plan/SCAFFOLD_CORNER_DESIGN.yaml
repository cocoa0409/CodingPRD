            - "ImprovementRequirement.${req_id}.severity == MAJOR and status was still OPEN immediately after the refusal"
            - "the clearance returns status 200, ImprovementRequirement.${req_id}.status == CLEARED, Inspection.${insp_b_id}.result == PASS with open_requirement_count 0 and cleared_major_count 1, and Application.${app_b_id}.status == APPROVED_TO_BIND"
            - "the bind of application B returns status 422 with ${stale_err} == ERR_INSPECTION_STALE (91 days after the 2026-09-01 completion, so the 90-day window is exceeded and priority 36 pre-empts the passed bind deadline)"
            - "CatastropheZone.${zone_id}.aggregate_insured_value_cents == 0 (no policy was ever bound)"
            - "GET /fair-plan/policies as PlanAdmin reports total_count == 0"

  - section: rbac
    instances:
      - name: exclusive_operations_of_other_roles_are_forbidden
        claim_type: exclusive_operation_denied
        grounds:
          - roles.PlanAdmin.exclusive_operations
          - roles.Producer.exclusive_operations
          - roles.Underwriter.exclusive_operations
          - roles.RateAnalyst.exclusive_operations
          - roles.Regulator.exclusive_operations
          - validations[priority=2]
        distinguishing_aspect: "Each write surface is closed to every role but its own, and the refusal is authorisation-shaped rather than validation-shaped: five cross-role attempts with otherwise well-formed bodies all return 403 ERR_FORBIDDEN_ROLE and create nothing, even where the caller is a strictly more senior operator (PlanAdmin attempting the Underwriter-exclusive bind)."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; one HURRICANE zone; one APPOINTED producer; one FILED (not yet reviewed) BASIC_FIRE_EO rate filing at 900 / 800 effective 2026-08-01."
          setup_api_calls:
            - call: "POST /fair-plan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /fair-plan/cat-zones"
              payload: { code: "HUR-01", peril: "HURRICANE", exposure_cap_cents: 900000000 }
              as: PlanAdmin
              captures: { zone_id: $.data.id, zone_v: $.data.version }
            - call: "POST /fair-plan/producers"
              payload: { full_name: "Pat Agent", license_number: "P-1001", commission_tier: "STANDARD", e_and_o_expiry_date: "2027-06-30" }
              as: PlanAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /fair-plan/producers/${prod_id}/agreement-execution"
              payload: { agreement_effective_date: "2026-08-01" }
              as: PlanAdmin
            - call: "POST /fair-plan/rate-filings"
              payload: { cat_zone_id: "${zone_id}", peril_package: "BASIC_FIRE_EO", filed_rate_per_1000_cents: 900, voluntary_market_avg_rate_per_1000_cents: 800, effective_date: "2026-08-01", expected_zone_version: "${zone_v}" }
              as: RateAnalyst
              as_user_id: "ra-1"
              captures: { filing_id: $.data.id }
          trigger:
            - call: "POST /fair-plan/cat-zones"
              payload: { code: "HUR-02", peril: "HURRICANE", exposure_cap_cents: 100000000 }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { zone_err: $.data.error_id }
            - call: "POST /fair-plan/applicants"
              payload: { full_name: "Ann Owner", email: "ann@example.com" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { applicant_err: $.data.error_id }
            - call: "POST /fair-plan/rate-filings"
              payload: { cat_zone_id: "${zone_id}", peril_package: "EXTENDED_WIND", filed_rate_per_1000_cents: 1200, voluntary_market_avg_rate_per_1000_cents: 1000, effective_date: "2026-08-01", expected_zone_version: "${zone_v}" }
              as: Regulator
              as_user_id: "reg-1"
              captures: { filing_err: $.data.error_id }
            - call: "POST /fair-plan/rate-filings/${filing_id}/review"
              payload: { decision: "APPROVE" }
              as: RateAnalyst
              as_user_id: "ra-1"
              captures: { review_err: $.data.error_id }
            - call: "POST /fair-plan/producers/${prod_id}/status-actions"
              payload: { action: "SUSPEND" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { status_err: $.data.error_id }
          assert:
            - "every trigger returns status 403"
            - "${zone_err} == ERR_FORBIDDEN_ROLE and ${applicant_err} == ERR_FORBIDDEN_ROLE"
            - "${filing_err} == ERR_FORBIDDEN_ROLE and ${review_err} == ERR_FORBIDDEN_ROLE"
            - "${status_err} == ERR_FORBIDDEN_ROLE"
            - "RateFiling.${filing_id}.status == FILED with reviewed_by_user_id null"
            - "Producer.${prod_id}.agreement_status == APPOINTED"
            - "GET /fair-plan/member-insurers as Regulator reports total_count == 0 and no second zone exists"

      - name: missing_or_unknown_identity_headers_return_unauthenticated
        claim_type: unauthenticated_denied
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=1]
        distinguishing_aspect: "Authentication is checked at priority 1, ahead of role membership, body schema and existence: a request whose X-User-Role is a string outside the eight declared roles returns 401 ERR_UNAUTHENTICATED (not 403), and a request with a declared role but no X-User-ID header returns 401 as well, even when the target id does not exist — the 404 is never reached."
        test_recipe:
          setup:
            - "Empty database; no calls are required before the trigger."
          setup_api_calls: []
          trigger:
            - call: "POST /fair-plan/cat-zones"
              payload: { code: "HUR-01", peril: "HURRICANE", exposure_cap_cents: 900000000 }
              as: "PlanAdministrator"
              as_user_id: "pa-1"
              captures: { unknown_role_err: $.data.error_id }
            - call: "GET /fair-plan/member-insurers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlanAdmin
              as_user_id: ""
              captures: { missing_id_err: $.data.error_id }
          assert:
            - "the first trigger sends X-User-Role: PlanAdministrator (not one of the eight declared roles), returns status 401 and ${unknown_role_err} == ERR_UNAUTHENTICATED"
            - "the second trigger omits the X-User-ID header entirely (shown as the empty as_user_id), returns status 401 and ${missing_id_err} == ERR_UNAUTHENTICATED rather than 404 ERR_NOT_FOUND"
            - "no CatastropheZone row was created: GET /fair-plan/member-insurers as PlanAdmin reports total_count == 0 and a subsequent POST /fair-plan/cat-zones with code HUR-01 as PlanAdmin succeeds with 201"

      - name: producer_acting_on_another_producers_application_is_not_resource_owner
        claim_type: ownership_denied
        grounds:
          - errors.ERR_NOT_RESOURCE_OWNER
          - validations[priority=6]
          - roles.Producer.identity
        distinguishing_aspect: "Producer identity is entity-backed, so an APPOINTED second producer — a caller with the right role and a valid body — is still refused on another producer's application: both the declination write and the submission return 403 ERR_NOT_RESOURCE_OWNER while the same calls from the owning producer would pass, and declination_count stays 0."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; one ACTIVE member insurer; HURRICANE zone; two APPOINTED producers P-1001 and P-2002; one DRAFT application owned by P-1001."
          setup_api_calls:
            - call: "POST /fair-plan/_clock/set_current_utc"
