  # ===========================================================================
  # Rule 3 — Non-linear state machines on two different entities
  # (MailJob: a true cycle;  PostageStatement: a branching fork)
  # The canonical "sorted + submitted" chain is anchored here as &chain_submitted
  # and re-used by later instances that need the same starting position.
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: mail_job_presort_rework_cycle
        grounds:
          - state_machines.MailJob.PRESORTED_to_REWORK
          - state_machines.MailJob.REWORK_to_POOLED
          - state_machines.CommingleBatch.REWORK_to_OPEN
          - state_machines.SortContainer.RETURNED_to_STAGED
          - entities.MailJob.fields.rework_count
        distinguishing_aspect: |
          MailJob is not a one-way pipeline: HYGIENE_CLEARED -> POOLED -> PRESORTED ->
          REWORK -> POOLED closes a genuine cycle, and the second visit to POOLED is
          distinguishable from the first only by rework_count == 1 and by the fact that
          the batch's frozen pricing was zeroed on the way out and rebuilt on the way back
          to byte-identical values. A linear reading (statuses only advance) or a naive
          revert (restore POOLED but leave allocations zeroed, or leave the placard
          stamped) both fail this instance.
