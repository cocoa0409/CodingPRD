      - name: operations_on_discontinued_model_return_model_not_active
        claim_type: violation_to_error
        grounds:
          - errors.ERR_MODEL_NOT_ACTIVE
          - state_machines.ShoeModel.ACTIVE_to_DISCONTINUED
        distinguishing_aspect: "DISCONTINUED is a cross-entity gate: after discontinuation, order creation, order acceptance, and contract start-fulfillment against that model each fail with 409 ERR_MODEL_NOT_ACTIVE — one model state gates three different entity workflows."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; cleared DOMESTIC factory; DOMESTIC_ONLY model GOV1; a SUBMITTED order for GOV1; contract G-401 AWARDED on GOV1; then GOV1 is discontinued (no open runs, no claims)."
          setup_api_calls:
            - *k_clk
            - *k_fac_gov
            - *k_comp_g
            - *k_model_gov1
            - &k_order_gov
              call: "POST /footwear/custom-orders"
              payload: { model_id: "${m_id}", buyer_ref: "cust-1", colorway: "STD", size: "10", quantity_units: 1 }
              as: CustomProgramCustomer
              as_user_id: "cust-1"
              captures: { o_id: $.data.id }
            - &k_contract_disc
              call: "POST /footwear/gov-contracts"
              payload: { contract_number: "G-401", model_id: "${m_id}", factory_id: "${f_id}", awarded_units: 10, fulfillment_start: "2027-03-01", fulfillment_end: "2027-03-31" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - &k_discontinue_gov1
              call: "POST /footwear/models/${m_id}/discontinue"
              payload: {}
              as: SourcingManager
          trigger:
            - call: "POST /footwear/custom-orders"
              payload: { model_id: "${m_id}", buyer_ref: "cust-1", colorway: "RED", size: "9", quantity_units: 1 }
              as: CustomProgramCustomer
              as_user_id: "cust-1"
              captures: { err1: $.data.error_id }
            - call: "POST /footwear/custom-orders/${o_id}/accept"
              payload: {}
              as: ProductionPlanner
              captures: { err2: $.data.error_id }
            - call: "POST /footwear/gov-contracts/${g_id}/start-fulfillment"
              payload: {}
              as: ComplianceOfficer
              captures: { err3: $.data.error_id }
          assert:
            - "order create on the discontinued model: 409 and err1 == ERR_MODEL_NOT_ACTIVE"
            - "accept of the pre-discontinuation order: 409 and err2 == ERR_MODEL_NOT_ACTIVE"
            - "contract start-fulfillment: 409 and err3 == ERR_MODEL_NOT_ACTIVE"
            - "ShoeModel.${m_id} remains DISCONTINUED; CustomOrder.${o_id} remains SUBMITTED; GovContract.${g_id} remains AWARDED"

      - name: assembled_in_usa_threshold_and_imported_on_domestic_run
        claim_type: Boundary / Edge
        grounds:
          - calculations.claim_threshold_check
          - entities.LabelClaim.fields.claim_type
        distinguishing_aspect: "The two remaining claim-type rules: ASSEMBLED_IN_USA accepts the M70 report at 70.00 (>= 20.00 with domestic assembly), while an IMPORTED claim on the M95 report (95.00, domestic assembly) FAILS with ERR_CONTENT_THRESHOLD_NOT_MET — IMPORTED requires foreign assembly or pct < 20.00."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Two completed runs: the M70 fixture (report at 70.00) and the M95 fixture (report at 95.00), both on the same DOMESTIC factory in different weeks."
            - "Claim ASSEMBLED_IN_USA on M70 with both claim-attached docs VERIFIED; claim IMPORTED on M95 (no docs needed — the threshold rule fails first)."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_a
            - *k_comp_b
            - *k_lot_a70
            - *k_lot_b70
            - *k_model_70
            - *k_alloc_300
            - &k_run_70
              call: "POST /footwear/production-runs"
              payload: { model_id: "${m_id}", factory_id: "${f_id}", run_type: "STOCK", planned_units: 100, line_index: 1, start_day: "2026-09-07", end_day: "2026-09-11", iso_week: "2026-W36" }
              as: ProductionPlanner
              captures: { r_70: $.data.id }
            - *k_lock
            - &k_reserve_70
              call: "POST /footwear/production-runs/${r_70}/reserve-materials"
              payload: {}
              as: ProductionPlanner
            - *k_w1c
            - *k_w1es
            - *k_w1as
            - *k_w1el
            - *k_w1al
            - *k_w1ea
            - *k_w1aa
            - *k_w2c
            - *k_w2es
            - *k_w2as
            - *k_w2el
            - *k_w2al
            - *k_w2ea
            - *k_w2aa
            - &k_start_70
              call: "POST /footwear/production-runs/${r_70}/start"
              payload: {}
              as: ProductionPlanner
            - &k_complete_70
              call: "POST /footwear/production-runs/${r_70}/complete"
              payload: { actual_stitching_minutes: 2, actual_lasting_minutes: 2, actual_assembly_minutes: 2 }
              as: ProductionPlanner
            - &k_runget_70
              call: "GET /footwear/production-runs/${r_70}"
