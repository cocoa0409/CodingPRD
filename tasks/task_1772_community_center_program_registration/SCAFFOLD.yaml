# =============================================================================
# PRD Benchmark Seed Tables — Community Center Program Registration & Operations
# =============================================================================

scenario: |
  Community Center Program Registration & Operations (municipal community center):
  seasonal program catalog & class capacity, resident vs nonresident pricing &
  priority registration windows, scholarship/fee waiver application, instructor
  contracting & pay per participant, room assignment & conflict management,
  minimum enrollment cancellation & refund, waitlist promotion & drop policy,
  attendance tracking & participant safety forms

domain_name: community-center-registration
api_prefix: /

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (flat topology: peers joined by FKs)
# =============================================================================
entities:
  - name: Season
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Season catalog name, e.g. 'Fall 2026'" }
      - { name: start_date, type: datetime, source: input, description: "Season start (UTC); age eligibility is computed as of this instant" }
      - { name: end_date, type: datetime, source: input, description: "Season end (UTC); must be > start_date" }
      - { name: resident_opens_at, type: datetime, source: input, description: "Instant registration opens for households with residency_status == RESIDENT" }
      - { name: general_opens_at, type: datetime, source: input, description: "Instant registration opens for all households; must be >= resident_opens_at" }
      - { name: registration_closes_at, type: datetime, source: input, description: "Instant registration closes for everyone; must be >= general_opens_at. Registration rejected when now >= registration_closes_at" }
      - { name: family_discount_threshold, type: integer, source: input, default: 3, description: "Household ENROLLED-registration count (in this season) at which the family discount applies; >= 2" }
      - { name: family_discount_pct, type: integer, source: input, default: 10, description: "Family discount percent applied after the scholarship step; 0..100" }
      - { name: scholarship_budget_cents, type: integer, source: input, default: 0, description: "Total scholarship commitment budget for the season; >= 0" }
      - { name: scholarship_committed_cents, type: integer, source: computed, default: 0, description: "Sum of estimated_commitment_cents over this season's ScholarshipApplications with status == APPROVED" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PUBLISHED -> CLOSED", constraints: "enum {DRAFT, PUBLISHED, CLOSED}" }

  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id; owning season" }
      - { name: name, type: string, source: input, description: "Program name, e.g. 'Youth Basketball'" }
      - { name: category, type: string, source: input, description: "Catalog category, e.g. 'Sports', 'Arts', 'Fitness'" }
      - { name: min_age, type: integer, source: input, default: 0, description: "Minimum participant age in whole years as of season.start_date (inclusive); >= 0" }
      - { name: max_age, type: integer, source: input, default: 120, description: "Maximum participant age in whole years as of season.start_date (inclusive); >= min_age" }

  - name: Room
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Room name, e.g. 'Gymnasium A'" }
      - { name: capacity, type: integer, source: input, description: "Maximum occupants; must be > 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE <-> MAINTENANCE via PATCH; initial ACTIVE", constraints: "enum {ACTIVE, MAINTENANCE}" }

  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Instructor full name" }
      - { name: email, type: string, source: input, description: "Instructor contact email" }

  - name: ClassSession
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; program this session delivers" }
      - { name: instructor_id, type: string, source: input, description: "FK -> Instructor.id; assigned instructor (used for double-booking checks and contract matching)" }
      - { name: title, type: string, source: input, description: "Session title, e.g. 'Youth Basketball — Tue/Thu 6pm'" }
      - { name: capacity, type: integer, source: input, description: "Maximum number of coexisting ENROLLED registrations at any moment; > 0; patchable while DRAFT/PUBLISHED but never below enrolled_count" }
      - { name: min_enrollment, type: integer, source: input, description: "Minimum enrolled_count required at the enrollment check sweep; >= 1 and <= capacity" }
      - { name: fee_resident_cents, type: integer, source: input, description: "Base fee for RESIDENT households; >= 0" }
      - { name: fee_nonresident_cents, type: integer, source: input, description: "Base fee for non-resident (incl. PENDING) households; >= 0" }
      - { name: enrollment_check_at, type: datetime, source: input, description: "Instant at/after which a season sweep evaluates min_enrollment for this session" }
      - { name: enrolled_count, type: integer, source: computed, default: 0, description: "Count of this session's Registrations with enrollment_status == ENROLLED" }
      - { name: waitlist_count, type: integer, source: computed, default: 0, description: "Count of this session's Registrations with enrollment_status == WAITLISTED" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PUBLISHED -> ACTIVE -> COMPLETED; PUBLISHED/ACTIVE -> CANCELLED", constraints: "enum {DRAFT, PUBLISHED, ACTIVE, COMPLETED, CANCELLED}" }
      - { name: cancellation_reason, type: enum, source: system, description: "null until CANCELLED; then LOW_ENROLLMENT (sweep) or ADMIN (manual cancel)", constraints: "enum {LOW_ENROLLMENT, ADMIN} or null" }

  - name: ClassMeeting
    parent: null
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> ClassSession.id; session this meeting belongs to" }
      - { name: room_id, type: string, source: input, description: "FK -> Room.id; assigned room (room conflict + capacity checks run at creation and on PATCH)" }
      - { name: starts_at, type: datetime, source: input, description: "Meeting start (UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Meeting end (UTC); must be > starts_at" }

  - name: InstructorContract
    parent: null
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> ClassSession.id; session under contract" }
      - { name: instructor_id, type: string, source: input, description: "FK -> Instructor.id; must equal the session's instructor_id" }
      - { name: revenue_share_bp, type: integer, source: input, description: "Instructor share of each counted registration's net_paid_cents, in basis points; 0..10000" }
      - { name: guarantee_min_cents, type: integer, source: input, description: "Settlement floor: settlement is at least this amount; >= 0" }
      - { name: cancellation_guarantee_cents, type: integer, source: input, description: "Flat payout owed when an ACCEPTED contract is TERMINATED by session cancellation; >= 0" }
      - { name: settlement_basis, type: enum, source: input, description: "Which headcount the settlement pays on", constraints: "enum {ENROLLMENT_BASIS, ATTENDANCE_BASIS}" }
      - { name: settlement_headcount, type: integer, source: computed, description: "Counted registrations at settlement; null until SETTLED" }
      - { name: settlement_amount_cents, type: integer, source: computed, description: "Computed settlement (per-line rounding, guarantee floor); null until SETTLED" }
      - { name: payout_cents, type: integer, source: computed, description: "Amount owed: settlement_amount_cents when SETTLED, cancellation_guarantee_cents when TERMINATED, 0 when VOID/DECLINED; null while OFFERED/ACCEPTED" }
      - { name: status, type: enum, source: system, description: "OFFERED -> ACCEPTED -> SETTLED | TERMINATED; OFFERED -> DECLINED | VOID", constraints: "enum {OFFERED, ACCEPTED, DECLINED, VOID, TERMINATED, SETTLED}" }

  - name: Household
    parent: null
    common_fields: true
    fields:
      - { name: account_name, type: string, source: input, description: "Household account display name" }
      - { name: residency_status, type: enum, source: system, description: "PENDING at creation; set to RESIDENT or NONRESIDENT by FrontDeskStaff verification (re-verification allowed)", constraints: "enum {PENDING, RESIDENT, NONRESIDENT}" }
      - { name: account_credit_cents, type: integer, source: computed, default: 0, description: "Refund credit balance; incremented by COMPLETED refunds, decremented by ACCOUNT_CREDIT payments" }

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; owning household (must be the caller's household for HouseholdManager)" }
      - { name: full_name, type: string, source: input, description: "Participant full name" }
      - { name: birth_date, type: datetime, source: input, description: "Participant date of birth (UTC date); age is computed as whole years completed by season.start_date" }

  - name: SafetyForm
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; participant covered" }
      - { name: season_id, type: string, source: input, description: "FK -> Season.id; season the form is valid for" }
      - { name: emergency_contact_name, type: string, source: input, description: "Emergency contact full name" }
      - { name: emergency_contact_phone, type: string, source: input, description: "Emergency contact phone" }
      - { name: medical_notes, type: string, source: input, default: "", description: "Allergies / medical notes; optional" }
      - { name: signer_name, type: string, source: input, description: "Name of signer; minors (age < 18 at season.start_date) require a signer different from the participant, adults must self-sign" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> VERIFIED | REJECTED (both terminal)", constraints: "enum {SUBMITTED, VERIFIED, REJECTED}" }

  - name: ScholarshipApplication
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; applicant household" }
      - { name: season_id, type: string, source: input, description: "FK -> Season.id; season the award applies to" }
      - { name: household_size, type: integer, source: input, description: "Number of people in household; >= 1" }
      - { name: annual_income_cents, type: integer, source: input, description: "Annual household income; >= 0" }
      - { name: statement, type: string, source: input, default: "", description: "Free-text need statement; refreshed on resubmit" }
      - { name: info_request_note, type: string, source: system, description: "Reviewer's note describing what to supply; set by request-info" }
      - { name: approved_pct, type: integer, source: system, description: "Fee discount percent granted; null until APPROVED", constraints: "enum {25, 50, 75, 100} or null" }
      - { name: estimated_commitment_cents, type: integer, source: system, description: "Budget commitment recorded at approval; counts against season.scholarship_committed_cents; null until APPROVED" }
      - { name: reviewed_by, type: string, source: system, description: "X-User-ID of the most recent start-review actor" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of approve/deny actor; null until decided" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> UNDER_REVIEW -> APPROVED | DENIED | MORE_INFO_REQUESTED -> RESUBMITTED -> UNDER_REVIEW (cycle); pre-decision states -> WITHDRAWN; APPROVED -> REVOKED", constraints: "enum {SUBMITTED, UNDER_REVIEW, MORE_INFO_REQUESTED, RESUBMITTED, APPROVED, DENIED, WITHDRAWN, REVOKED}" }

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> ClassSession.id; session registered for" }
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; participant enrolled" }
      - { name: household_id, type: string, source: system, description: "FK -> Household.id; copied from participant.household_id at creation (denormalized; never changes)" }
      - { name: residency_at_registration, type: enum, source: computed, description: "Residency fee basis snapshot at creation: RESIDENT iff household.residency_status == RESIDENT at that instant, else NONRESIDENT", constraints: "enum {RESIDENT, NONRESIDENT}" }
      - { name: scholarship_pct_applied, type: integer, source: computed, default: 0, description: "Scholarship percent locked in at creation (0 when no APPROVED application for (household, season))" }
      - { name: family_discount_applied, type: boolean, source: computed, default: false, description: "Whether the family discount was applied at creation (never re-evaluated afterwards)" }
      - { name: fee_charged_cents, type: integer, source: computed, description: "Fee computed ONCE at creation by registration_fee_calculation; never recomputed afterwards (residency changes, later scholarship approval/revocation, later drops of siblings do not alter it)" }
      - { name: net_paid_cents, type: integer, source: computed, default: 0, description: "Sum of COMPLETED CHARGE PaymentTransactions for this registration" }
      - { name: refund_total_cents, type: integer, source: computed, default: 0, description: "Sum of REFUND PaymentTransactions (any non-VOID status) for this registration" }
      - { name: enrollment_status, type: enum, source: system, description: "Enrollment axis: ENROLLED | WAITLISTED | DROPPED | EXPIRED | CANCELLED", constraints: "enum {ENROLLED, WAITLISTED, DROPPED, EXPIRED, CANCELLED}" }
      - { name: payment_status, type: enum, source: system, description: "Payment axis (parallel, independent of enrollment axis): PENDING | PAID | WAIVED | REFUND_PENDING | REFUNDED | VOID", constraints: "enum {PENDING, PAID, WAIVED, REFUND_PENDING, REFUNDED, VOID}" }
      - { name: drop_reason, type: enum, source: system, description: "null while active; VOLUNTARY | NO_SHOW on DROPPED, PAYMENT_TIMEOUT on EXPIRED, LOW_ENROLLMENT | ADMIN on CANCELLED", constraints: "enum {VOLUNTARY, NO_SHOW, PAYMENT_TIMEOUT, LOW_ENROLLMENT, ADMIN} or null" }
      - { name: waitlisted_at, type: datetime, source: system, description: "Instant the registration (re)entered WAITLISTED; null while never waitlisted" }
      - { name: promoted_at, type: datetime, source: system, description: "Instant of last waitlist promotion; null while never promoted" }
      - { name: payment_due_at, type: datetime, source: system, description: "Payment deadline: created_at + 72h for direct ENROLLED creation with fee > 0; promoted_at + 48h on promotion with fee > 0; null when WAIVED/PAID or while WAITLISTED" }
      - { name: consecutive_absences, type: integer, source: computed, default: 0, description: "Trailing unexcused-absence run length from consecutive_absence_replay" }

  - name: PaymentTransaction
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: system, description: "FK -> Registration.id; registration this ledger entry belongs to" }
      - { name: type, type: enum, source: system, description: "CHARGE (participant pays) | REFUND (center returns money)", constraints: "enum {CHARGE, REFUND}" }
      - { name: amount_cents, type: integer, source: input, description: "Amount; > 0. For CHARGE must equal registration.fee_charged_cents exactly" }
      - { name: method, type: enum, source: input, description: "CHARGE tender: EXTERNAL | ACCOUNT_CREDIT. REFUND transactions always credit Household.account_credit_cents (method stored as ACCOUNT_CREDIT)", constraints: "enum {EXTERNAL, ACCOUNT_CREDIT}" }
      - { name: status, type: enum, source: system, description: "CHARGE: COMPLETED immediately. REFUND: COMPLETED (auto-approved when amount < REFUND_REVIEW_THRESHOLD_CENTS) or PENDING (>= threshold) -> COMPLETED via approve-refund", constraints: "enum {PENDING, COMPLETED}" }

  - name: AttendanceRecord
    parent: null
    common_fields: true
    fields:
      - { name: meeting_id, type: string, source: input, description: "FK -> ClassMeeting.id; meeting being marked" }
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id; registration being marked (must belong to the meeting's session)" }
      - { name: status, type: enum, source: input, description: "Attendance mark", constraints: "enum {PRESENT, ABSENT, EXCUSED}" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Season
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: POST /seasons/{season_id}/publish
        actor: ProgramCoordinator
        preconditions:
          - "resident_opens_at <= general_opens_at <= registration_closes_at (else ERR_INVALID_REQUEST at creation)"
        side_effects: []
      - from: PUBLISHED
        to: CLOSED
        trigger: POST /seasons/{season_id}/close
        actor: ProgramCoordinator
        preconditions:
          - "now >= registration_closes_at (else ERR_REGISTRATION_WINDOW_CLOSED is not applicable; use ERR_INVALID_STATE)"
        side_effects:
          - "Registration creation for any session of this season is subsequently rejected (ERR_SEASON_CLOSED)"

  - entity: Room
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: MAINTENANCE
        trigger: PATCH /rooms/{room_id} with status=MAINTENANCE
        actor: ProgramCoordinator
        preconditions: []
        side_effects:
          - "New ClassMeeting creation/PATCH into this room is rejected (ERR_ROOM_UNAVAILABLE); pre-existing meetings are unaffected"
      - from: MAINTENANCE
        to: ACTIVE
        trigger: PATCH /rooms/{room_id} with status=ACTIVE
        actor: ProgramCoordinator
        preconditions: []
        side_effects: []

  - entity: ClassSession
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: POST /class-sessions/{session_id}/publish
        actor: ProgramCoordinator
        preconditions:
          - "Owning Program's Season status == PUBLISHED (else ERR_SEASON_NOT_PUBLISHED)"
          - "Session has >= 1 ClassMeeting (else ERR_NO_MEETINGS)"
          - "An InstructorContract with session_id == this session, instructor_id == session.instructor_id, status == ACCEPTED exists (else ERR_CONTRACT_NOT_ACCEPTED)"
        side_effects: []
      - from: PUBLISHED
        to: ACTIVE
        trigger: "system — POST /seasons/{season_id}/sweeps, enrollment-check step, when enrollment_check_at <= now and enrolled_count >= min_enrollment"
        actor: system
        preconditions:
          - "Season status == PUBLISHED"
          - "enrollment_check_at <= now"
          - "enrolled_count >= min_enrollment (equality passes)"
        side_effects:
          - "Session added to sweep summary activated_session_ids"
      - from: PUBLISHED
        to: CANCELLED
        trigger: "system — POST /seasons/{season_id}/sweeps, enrollment-check step, when enrollment_check_at <= now and enrolled_count < min_enrollment (cancellation_reason LOW_ENROLLMENT); OR POST /class-sessions/{session_id}/cancel (cancellation_reason ADMIN)"
        actor: system | ProgramCoordinator
        preconditions:
          - "Sweep path: enrollment_check_at <= now AND enrolled_count < min_enrollment"
          - "Manual path: none beyond source state"
        side_effects:
          - "cancellation_reason set (LOW_ENROLLMENT or ADMIN)"
          - "HOP 2 — every Registration with enrollment_status == ENROLLED -> CANCELLED, drop_reason matching the session's cancellation_reason"
          - "HOP 3 — for each such cancelled Registration, registration_refund runs with the ADMIN_CANCELLATION variant (refund = net_paid_cents, i.e. 100%): if refund > 0 a REFUND PaymentTransaction is created (PENDING when amount >= REFUND_REVIEW_THRESHOLD_CENTS, else COMPLETED), payment_status PAID -> REFUND_PENDING (PENDING refund) or PAID -> REFUNDED (auto-COMPLETED refund); unpaid PENDING -> VOID; WAIVED unchanged"
          - "HOP 4 — each auto-COMPLETED REFUND increments Household.account_credit_cents by its amount_cents (Household.version bumps)"
          - "HOP 2 (parallel branch) — every Registration with enrollment_status == WAITLISTED -> CANCELLED (same drop_reason); payment_status PENDING -> VOID, WAIVED unchanged; NO waitlist promotion runs (session is terminal)"
          - "HOP 2 (parallel branch) — InstructorContract for this session: ACCEPTED -> TERMINATED with payout_cents = cancellation_guarantee_cents; OFFERED -> VOID with payout_cents = 0; DECLINED unchanged"
          - "This session's ClassMeetings leave the room/instructor conflict candidate sets (cancelled sessions no longer block)"
      - from: ACTIVE
        to: CANCELLED
        trigger: POST /class-sessions/{session_id}/cancel
        actor: ProgramCoordinator
        preconditions: []
        side_effects:
          - "Same cascade as PUBLISHED -> CANCELLED with cancellation_reason ADMIN"
      - from: ACTIVE
        to: COMPLETED
        trigger: POST /class-sessions/{session_id}/complete
        actor: ProgramCoordinator
        preconditions:
          - "Every ClassMeeting of the session has ends_at <= now (else ERR_INVALID_STATE)"
        side_effects:
          - "instructor_settlement_pay runs: ACCEPTED contract -> SETTLED with settlement_headcount and settlement_amount_cents = payout_cents (OFFERED contract -> VOID with payout_cents = 0; DECLINED unchanged)"
          - "Every Registration still WAITLISTED -> CANCELLED with drop_reason ADMIN; payment_status PENDING -> VOID, WAIVED unchanged"
          - "ENROLLED registrations remain ENROLLED (historical); subsequent drops are rejected (ERR_SESSION_NOT_OPEN)"

  - entity: InstructorContract
    initial_state: OFFERED
    terminal_states: [DECLINED, VOID, TERMINATED, SETTLED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: POST /instructor-contracts/{contract_id}/accept
        actor: Instructor
        preconditions:
          - "Caller X-User-ID == contract.instructor_id (else ERR_UNAUTHORIZED_ROLE)"
          - "Session status in {DRAFT, PUBLISHED} (else ERR_INVALID_STATE)"
        side_effects: []
      - from: OFFERED
        to: DECLINED
        trigger: POST /instructor-contracts/{contract_id}/decline
        actor: Instructor
        preconditions:
          - "Caller X-User-ID == contract.instructor_id (else ERR_UNAUTHORIZED_ROLE)"
        side_effects:
          - "payout_cents = 0"
      - from: OFFERED
        to: VOID
        trigger: "system — session cancellation or completion cascade while contract still OFFERED"
        actor: system
        preconditions: []
        side_effects:
          - "payout_cents = 0"
      - from: ACCEPTED
        to: TERMINATED
        trigger: "system — session cancellation cascade"
        actor: system
        preconditions: []
        side_effects:
          - "payout_cents = cancellation_guarantee_cents"
      - from: ACCEPTED
        to: SETTLED
        trigger: "system — POST /class-sessions/{session_id}/complete"
        actor: system
        preconditions: []
        side_effects:
          - "instructor_settlement_pay computes settlement_headcount and settlement_amount_cents; payout_cents = settlement_amount_cents"

  - entity: Household
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: RESIDENT
        trigger: POST /households/{household_id}/verify-residency with residency_status=RESIDENT
        actor: FrontDeskStaff
        preconditions: []
        side_effects: []
      - from: PENDING
        to: NONRESIDENT
        trigger: POST /households/{household_id}/verify-residency with residency_status=NONRESIDENT
        actor: FrontDeskStaff
        preconditions: []
        side_effects: []
      - from: RESIDENT
        to: NONRESIDENT
        trigger: POST /households/{household_id}/verify-residency (re-verification)
        actor: FrontDeskStaff
        preconditions: []
        side_effects:
          - "Existing Registrations are unaffected: residency_at_registration and fee_charged_cents are pinned at creation"
      - from: NONRESIDENT
        to: RESIDENT
        trigger: POST /households/{household_id}/verify-residency (re-verification)
        actor: FrontDeskStaff
        preconditions: []
        side_effects:
          - "Existing Registrations are unaffected (pinned-at-creation rule)"

  - entity: SafetyForm
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: POST /safety-forms/{form_id}/verify
        actor: FrontDeskStaff
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: POST /safety-forms/{form_id}/reject
        actor: FrontDeskStaff
        preconditions: []
        side_effects:
          - "A new SafetyForm for the same (participant_id, season_id) may now be submitted (uniqueness gate no longer blocks)"

  - entity: ScholarshipApplication
    initial_state: SUBMITTED
    terminal_states: [DENIED, WITHDRAWN, REVOKED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: POST /scholarship-applications/{application_id}/start-review
        actor: ScholarshipReviewer
        preconditions: []
        side_effects:
          - "reviewed_by = caller X-User-ID"
      - from: RESUBMITTED
        to: UNDER_REVIEW
        trigger: POST /scholarship-applications/{application_id}/start-review
        actor: ScholarshipReviewer
        preconditions: []
        side_effects:
          - "reviewed_by = caller X-User-ID (overwrites previous reviewer; segregation-of-duties compares against this latest value)"
      - from: UNDER_REVIEW
        to: MORE_INFO_REQUESTED
        trigger: POST /scholarship-applications/{application_id}/request-info
        actor: ScholarshipReviewer
        preconditions: []
        side_effects:
          - "info_request_note = payload note"
      - from: MORE_INFO_REQUESTED
        to: RESUBMITTED
        trigger: POST /scholarship-applications/{application_id}/resubmit
        actor: HouseholdManager
        preconditions:
          - "Caller household == application.household_id (else ERR_NOT_HOUSEHOLD_MEMBER)"
        side_effects:
          - "statement = payload statement"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: POST /scholarship-applications/{application_id}/approve
        actor: ScholarshipReviewer
        preconditions:
          - "Caller X-User-ID != reviewed_by (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)"
          - "scholarship_budget_commitment check passes (else ERR_SCHOLARSHIP_BUDGET_EXCEEDED)"
        side_effects:
          - "approved_pct = payload approved_pct; estimated_commitment_cents = payload estimated_commitment_cents; decided_by = caller"
          - "Season.scholarship_committed_cents += estimated_commitment_cents (Season.version bumps)"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: POST /scholarship-applications/{application_id}/deny
        actor: ScholarshipReviewer
        preconditions: []
        side_effects:
          - "decided_by = caller (deny is NOT subject to segregation of duties)"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: POST /scholarship-applications/{application_id}/withdraw
        actor: HouseholdManager
        preconditions: ["Caller household == application.household_id (else ERR_NOT_HOUSEHOLD_MEMBER)"]
        side_effects: []
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: POST /scholarship-applications/{application_id}/withdraw
        actor: HouseholdManager
        preconditions: ["Caller household == application.household_id (else ERR_NOT_HOUSEHOLD_MEMBER)"]
        side_effects: []
      - from: MORE_INFO_REQUESTED
        to: WITHDRAWN
        trigger: POST /scholarship-applications/{application_id}/withdraw
        actor: HouseholdManager
        preconditions: ["Caller household == application.household_id (else ERR_NOT_HOUSEHOLD_MEMBER)"]
        side_effects: []
      - from: RESUBMITTED
        to: WITHDRAWN
        trigger: POST /scholarship-applications/{application_id}/withdraw
        actor: HouseholdManager
        preconditions: ["Caller household == application.household_id (else ERR_NOT_HOUSEHOLD_MEMBER)"]
        side_effects: []
      - from: APPROVED
        to: REVOKED
        trigger: POST /scholarship-applications/{application_id}/revoke
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "Season.scholarship_committed_cents -= estimated_commitment_cents (compensating reversal; Season.version bumps)"
          - "Existing Registrations keep scholarship_pct_applied and fee_charged_cents (pinned at creation); future registrations of this household in this season get scholarship_pct_applied = 0"

  - entity: Registration
    initial_state: ENROLLED
    terminal_states: [DROPPED, EXPIRED, CANCELLED]
    note: "TWO PARALLEL AXES on one row: enrollment_status (this machine) and payment_status (next machine). Creation lands on ENROLLED (seat free) or WAITLISTED (enrolled_count >= capacity at creation)."
    transitions:
      - from: ENROLLED
        to: DROPPED
        trigger: POST /registrations/{registration_id}/drop (drop_reason VOLUNTARY)
        actor: HouseholdManager | FrontDeskStaff
        preconditions:
          - "HouseholdManager: caller household == registration.household_id (else ERR_NOT_HOUSEHOLD_MEMBER)"
          - "Session status in {PUBLISHED, ACTIVE} (else ERR_SESSION_NOT_OPEN)"
        side_effects:
          - "registration_refund runs with VOLUNTARY variant; refund issuance sub-procedure creates a REFUND PaymentTransaction when refund > 0 (PENDING if >= REFUND_REVIEW_THRESHOLD_CENTS with payment_status PAID -> REFUND_PENDING, else COMPLETED with payment_status PAID -> REFUNDED and Household.account_credit_cents += amount); refund == 0 leaves PAID as PAID; payment_status PENDING -> VOID"
          - "ClassSession.enrolled_count -= 1 (ClassSession.version bumps)"
          - "HOP 2 — waitlist_promotion_selector runs for this session: the freed seat is offered to the selected WAITLISTED registration -> ENROLLED, promoted_at = now, payment_due_at = now + 48h when fee_charged_cents > 0 (payment_status stays PENDING) or payment_status -> WAIVED when fee_charged_cents == 0; ClassSession.enrolled_count += 1 back"
      - from: ENROLLED
        to: DROPPED
        trigger: "system — consecutive_absence_replay reaches NO_SHOW_ABSENCE_THRESHOLD (drop_reason NO_SHOW)"
        actor: system
        preconditions:
          - "consecutive_absences >= NO_SHOW_ABSENCE_THRESHOLD after replay, enrollment_status still ENROLLED"
        side_effects:
          - "registration_refund NO_SHOW variant: refund = 0 always (no PaymentTransaction created; PAID stays PAID; PENDING -> VOID)"
          - "ClassSession.enrolled_count -= 1; waitlist_promotion_selector runs (same as voluntary drop)"
      - from: ENROLLED
        to: EXPIRED
        trigger: "system — POST /seasons/{season_id}/sweeps payment-timeout step, when payment_status == PENDING and payment_due_at <= now (drop_reason PAYMENT_TIMEOUT)"
        actor: system
        preconditions:
          - "payment_status == PENDING AND payment_due_at != null AND payment_due_at <= now"
        side_effects:
          - "payment_status -> VOID (nothing was paid; no refund)"
          - "ClassSession.enrolled_count -= 1; waitlist_promotion_selector runs in-sweep (newly promoted registrations get payment_due_at = now + 48h, which is > now, so they never expire within the same sweep)"
      - from: ENROLLED
        to: CANCELLED
        trigger: "system — session cancellation cascade (drop_reason = session.cancellation_reason)"
        actor: system
        preconditions: []
        side_effects:
          - "registration_refund ADMIN_CANCELLATION variant + refund issuance sub-procedure (see ClassSession cancel cascade)"
      - from: WAITLISTED
        to: ENROLLED
        trigger: "system — waitlist_promotion_selector after a seat frees (drop, no-show drop, or sweep payment-timeout)"
        actor: system
        preconditions:
          - "Selected by waitlist_promotion_selector (waitlisted_at ASC, tie created_at ASC)"
          - "Session status in {PUBLISHED, ACTIVE}"
        side_effects:
          - "promoted_at = now; payment_due_at = now + 48h if fee_charged_cents > 0 else null; payment_status PENDING -> WAIVED iff fee_charged_cents == 0 (stays PENDING otherwise)"
          - "ClassSession.waitlist_count -= 1; ClassSession.enrolled_count += 1"
      - from: WAITLISTED
        to: DROPPED
        trigger: POST /registrations/{registration_id}/drop (drop_reason VOLUNTARY)
        actor: HouseholdManager | FrontDeskStaff
        preconditions:
          - "HouseholdManager: caller household == registration.household_id (else ERR_NOT_HOUSEHOLD_MEMBER)"
        side_effects:
          - "payment_status PENDING -> VOID; WAIVED unchanged; NO refund ever (nothing collectible while waitlisted)"
          - "ClassSession.waitlist_count -= 1; NO promotion runs (no seat was occupied)"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "system — session cancellation or completion cascade"
        actor: system
        preconditions: []
        side_effects:
          - "payment_status PENDING -> VOID; WAIVED unchanged; no refund"

  - entity: RegistrationPaymentAxis
    note: "Second parallel state dimension physically stored as Registration.payment_status; evolves independently of enrollment_status except at the pinned interaction points (creation, promotion, drop/expire/cancel issuance)"
    initial_state: PENDING
    terminal_states: [WAIVED, REFUNDED, VOID]
    transitions:
      - from: PENDING
        to: WAIVED
        trigger: "system — at creation or promotion when fee_charged_cents == 0"
        actor: system
        preconditions: ["fee_charged_cents == 0"]
        side_effects: ["payment_due_at = null"]
      - from: PENDING
        to: PAID
        trigger: POST /registrations/{registration_id}/payment
        actor: HouseholdManager | FrontDeskStaff
        preconditions:
          - "enrollment_status == ENROLLED AND payment_status == PENDING (else ERR_PAYMENT_NOT_ALLOWED; WAITLISTED registrations cannot pay)"
          - "amount_cents == fee_charged_cents (else ERR_INCORRECT_AMOUNT)"
          - "method == ACCOUNT_CREDIT requires Household.account_credit_cents >= amount_cents (else ERR_INSUFFICIENT_CREDIT)"
        side_effects:
          - "CHARGE PaymentTransaction created with status COMPLETED"
          - "Registration.net_paid_cents += amount_cents; payment_due_at = null"
          - "method == ACCOUNT_CREDIT: Household.account_credit_cents -= amount_cents (Household.version bumps)"
      - from: PENDING
        to: VOID
        trigger: "system — drop while unpaid, sweep payment-timeout, or session cancel/complete cascade"
        actor: system
        preconditions: []
        side_effects: []
      - from: PAID
        to: REFUND_PENDING
        trigger: "system — refund issuance when refund amount >= REFUND_REVIEW_THRESHOLD_CENTS"
        actor: system
        preconditions: []
        side_effects: ["REFUND PaymentTransaction created with status PENDING"]
      - from: PAID
        to: REFUNDED
        trigger: "system — refund issuance when 0 < refund amount < REFUND_REVIEW_THRESHOLD_CENTS (auto-approved)"
        actor: system
        preconditions: []
        side_effects:
          - "REFUND PaymentTransaction created with status COMPLETED"
          - "Household.account_credit_cents += amount_cents; Registration.refund_total_cents += amount_cents"
      - from: REFUND_PENDING
        to: REFUNDED
        trigger: POST /payments/{payment_id}/approve-refund
        actor: FinanceOfficer
        preconditions:
          - "PaymentTransaction type == REFUND and status == PENDING (else ERR_REFUND_NOT_PENDING)"
        side_effects:
          - "PaymentTransaction -> COMPLETED"
          - "Household.account_credit_cents += amount_cents; Registration.refund_total_cents += amount_cents"

  - entity: PaymentTransaction
    initial_state: COMPLETED
    terminal_states: [COMPLETED]
    note: "CHARGE entries are born COMPLETED (initial_state). Only REFUND entries may be born PENDING."
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: POST /payments/{payment_id}/approve-refund
        actor: FinanceOfficer
        preconditions:
          - "type == REFUND and status == PENDING (else ERR_REFUND_NOT_PENDING)"
        side_effects:
          - "Household.account_credit_cents += amount_cents; Registration.refund_total_cents += amount_cents; Registration.payment_status REFUND_PENDING -> REFUNDED"

  - entity: AttendanceRecord
    initial_state: PRESENT
    terminal_states: []
    note: "Status is an input-recorded mark, freely correctable via PATCH while the session is not terminal; every create/PATCH re-runs consecutive_absence_replay for the registration."
    transitions:
      - from: PRESENT
        to: ABSENT
        trigger: PATCH /attendance-records/{attendance_id}
        actor: Instructor | FrontDeskStaff
        preconditions: ["Session status in {PUBLISHED, ACTIVE} (else ERR_INVALID_STATE)"]
        side_effects: ["consecutive_absence_replay re-runs for the registration"]
      - from: PRESENT
        to: EXCUSED
        trigger: PATCH /attendance-records/{attendance_id}
        actor: Instructor | FrontDeskStaff
        preconditions: ["Session status in {PUBLISHED, ACTIVE} (else ERR_INVALID_STATE)"]
        side_effects: ["consecutive_absence_replay re-runs for the registration"]
      - from: ABSENT
        to: PRESENT
        trigger: PATCH /attendance-records/{attendance_id}
        actor: Instructor | FrontDeskStaff
        preconditions: ["Session status in {PUBLISHED, ACTIVE} (else ERR_INVALID_STATE)"]
        side_effects: ["consecutive_absence_replay re-runs for the registration"]
      - from: ABSENT
        to: EXCUSED
        trigger: PATCH /attendance-records/{attendance_id}
        actor: Instructor | FrontDeskStaff
        preconditions: ["Session status in {PUBLISHED, ACTIVE} (else ERR_INVALID_STATE)"]
        side_effects: ["consecutive_absence_replay re-runs for the registration"]
      - from: EXCUSED
        to: PRESENT
        trigger: PATCH /attendance-records/{attendance_id}
        actor: Instructor | FrontDeskStaff
        preconditions: ["Session status in {PUBLISHED, ACTIVE} (else ERR_INVALID_STATE)"]
        side_effects: ["consecutive_absence_replay re-runs for the registration"]
      - from: EXCUSED
        to: ABSENT
        trigger: PATCH /attendance-records/{attendance_id}
        actor: Instructor | FrontDeskStaff
        preconditions: ["Session status in {PUBLISHED, ACTIVE} (else ERR_INVALID_STATE)"]
        side_effects: ["consecutive_absence_replay re-runs for the registration"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: registration-create-stale-session
    parent_entity: ClassSession
    write_endpoint: "POST /registrations"
    occ_field: expected_class_session_version
    description: |
      Creating a Registration against a ClassSession whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just registered into the same session (legitimately
      consuming a seat or a waitlist position, which bumps ClassSession.version)
      and the current writer's view of seat availability is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: session-update-stale-write
    parent_entity: ClassSession
    write_endpoint: "PATCH /class-sessions/{session_id}"
    occ_field: expected_class_session_version
    description: |
      Updating capacity / min_enrollment / enrollment_check_at of a ClassSession
      whose version has advanced since the client last observed it is rejected.
      This captures the case where enrollments or waitlist movements have changed
      enrolled_count since the client read the session, making the client's
      capacity-versus-enrollment reasoning stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: registration_fee_calculation
    trigger: "Registration creation (POST /registrations), exactly once; result stored in fee_charged_cents and NEVER recomputed"
    algorithm: tiered_pricing
    formula: |
      season   = session.program.season
      base     = session.fee_resident_cents      if household.residency_status == RESIDENT
                 else session.fee_nonresident_cents          # PENDING counts as NONRESIDENT
      sch_pct  = approved_pct of the household's ScholarshipApplication for this season
                 with status == APPROVED, else 0             # REVOKED/DENIED/etc. contribute 0
      fam_pct  = season.family_discount_pct
                 if family_discount_evaluation(registration_being_created) is true, else 0
      # PINNED EVALUATION ORDER: scholarship step first, round; family step second, round.
      intermediate = round_half_up(base * (100 - sch_pct) / 100)
      fee_charged_cents = round_half_up(intermediate * (100 - fam_pct) / 100)
    input_set: "The registration being created; its session, the session's program's season, the participant's household, and the household's single non-terminal ScholarshipApplication for that season"
    constants:
      SCHOLARSHIP_PCT_OPTIONS: [25, 50, 75, 100]
    precision: "integer cents; round_half_up after EACH multiplication step (two nested roundings, order pinned)"
    variants: []

  - name: family_discount_evaluation
    trigger: "Registration creation, as a sub-step of registration_fee_calculation"
    algorithm: threshold
    formula: |
      # Circular-looking dependency PINNED: whether the new registration gets the
      # family discount depends on a count that conceptually includes the new
      # registration itself. Resolution: count EXISTING registrations first, then
      # add 1 for the one being created.
      existing = count of Registrations R where R.household_id == this household
                 AND R.session.program.season_id == this season
                 AND R.enrollment_status == ENROLLED          # WAITLISTED excluded
      family_discount_applied = (existing + 1) >= season.family_discount_threshold
      # NO RETROACTIVITY: later drops/expiries of sibling registrations never
      # change family_discount_applied or fee_charged_cents of any registration.
    input_set: "Household's registrations in the season with enrollment_status == ENROLLED at creation instant"
    constants: {}
    precision: "integer comparison, >= boundary (threshold met exactly qualifies)"
    variants: []

  - name: age_eligibility_check
    trigger: "Registration creation (POST /registrations)"
    algorithm: threshold
    formula: |
      age = whole years completed between participant.birth_date and season.start_date
            (a birthday falling exactly ON season.start_date counts as reached)
      eligible = program.min_age <= age <= program.max_age    # both bounds INCLUSIVE
      reject with ERR_AGE_INELIGIBLE when not eligible
    input_set: "Participant.birth_date, Program.min_age/max_age, Season.start_date"
    constants: {}
    precision: "whole years (floor); inclusive >= / <= boundaries"
    variants: []

  - name: waitlist_promotion_selector
    trigger: "After any ENROLLED -> {DROPPED, EXPIRED} transition that frees a seat (voluntary drop, no-show auto-drop, sweep payment-timeout); runs once per freed seat, inside the same request/sweep step"
    algorithm: chronological
    formula: |
      candidates = Registrations R where R.session_id == freed session
                   AND R.enrollment_status == WAITLISTED
                   AND session.status in {PUBLISHED, ACTIVE}
      rank: waitlisted_at ASC; tie-break: created_at ASC      # id NEVER used for ordering
      if candidates empty: no-op (seat stays free)
      else promote first-ranked: enrollment_status -> ENROLLED; promoted_at = now;
        payment_due_at = now + PROMOTED_PAYMENT_WINDOW_HOURS hours when fee_charged_cents > 0;
        payment_status -> WAIVED when fee_charged_cents == 0 (fee stays pinned from creation)
    input_set: "WAITLISTED registrations of the freed session only"
    constants:
      PROMOTED_PAYMENT_WINDOW_HOURS: 48
    precision: "datetime comparison; strict ASC ordering with created_at tie-break"
    variants: []

  - name: registration_refund
    trigger: "Registration ENROLLED -> {DROPPED, CANCELLED} (voluntary drop, no-show auto-drop, session cancellation)"
    algorithm: threshold
    formula: |
      meetings_total = count of ClassMeetings of the session
      meetings_held  = count of ClassMeetings of the session with starts_at <= now
      variant VOLUNTARY:
        refund = net_paid_cents                              if meetings_held == 0
        refund = round_half_up(net_paid_cents * 0.5)         if 1 <= meetings_held <= floor(meetings_total / 2)
        refund = 0                                           if meetings_held > floor(meetings_total / 2)
        # Boundary pin: dropping at EXACTLY a meeting's starts_at counts that meeting as held (starts_at <= now).
      variant NO_SHOW:        refund = 0                     # always, regardless of timing
      variant ADMIN_CANCELLATION: refund = net_paid_cents    # always 100%, regardless of timing
      issuance: refund > 0 -> create REFUND PaymentTransaction
        (PENDING when amount >= REFUND_REVIEW_THRESHOLD_CENTS -> registration PAID -> REFUND_PENDING;
         else COMPLETED -> registration PAID -> REFUNDED, Household.account_credit_cents += amount)
      refund == 0 -> no transaction; PAID stays PAID
      unpaid registration (PENDING) -> VOID in all variants
    input_set: "The transitioning registration, its session's meetings, logical clock"
    constants:
      REFUND_REVIEW_THRESHOLD_CENTS: 10000
    precision: "integer cents; round_half_up on the 50% tier"
    variants:
      - name: VOLUNTARY
        when: "HouseholdManager/FrontDeskStaff-initiated drop"
        difference: "Tiered by meetings_held: 100% before any meeting held, 50% through the first half, 0% after"
      - name: NO_SHOW
        when: "system auto-drop at consecutive-absence threshold"
        difference: "Always 0% — forfeit"
      - name: ADMIN_CANCELLATION
        when: "session cancellation (LOW_ENROLLMENT or ADMIN)"
        difference: "Always 100% of net_paid_cents"

  - name: instructor_settlement_pay
    trigger: "POST /class-sessions/{session_id}/complete (session ACTIVE -> COMPLETED), applied to the session's ACCEPTED InstructorContract"
    algorithm: aggregation
    formula: |
      meetings_held = count of ClassMeetings of the session with starts_at <= now
      counted(registration R) per contract.settlement_basis:
        ENROLLMENT_BASIS: R.enrollment_status == ENROLLED at completion
        ATTENDANCE_BASIS: R.enrollment_status == ENROLLED at completion AND attendance_pct(R) >= ATTENDANCE_QUALIFYING_PCT
          where attendance_pct(R) = 0 if meetings_held == 0 else
                100 * (records of R with status == PRESENT on meetings with starts_at <= now) / meetings_held
          # Boundary pin: attendance_pct == 50 exactly QUALIFIES (>=).
      # PINNED ROUNDING ORDER: round each per-registration line FIRST, then sum, then apply the guarantee floor.
      # (Summing raw fractions then rounding once is a different, non-conforming algorithm.)
      line(R)  = round_half_up(R.net_paid_cents * contract.revenue_share_bp / 10000)
      subtotal = sum of line(R) over counted registrations
      settlement_amount_cents = max(contract.guarantee_min_cents, subtotal)
      settlement_headcount = number of counted registrations
    input_set: "Session's registrations (ENROLLED at completion), their attendance records and net_paid_cents, the ACCEPTED contract"
    constants:
      ATTENDANCE_QUALIFYING_PCT: 50
    precision: "integer cents; round_half_up PER LINE before summation"
    variants:
      - name: ENROLLMENT_BASIS
        when: "contract.settlement_basis == ENROLLMENT_BASIS"
        difference: "Headcount = registrations ENROLLED at completion (attendance ignored)"
      - name: ATTENDANCE_BASIS
        when: "contract.settlement_basis == ATTENDANCE_BASIS"
        difference: "Headcount = ENROLLED registrations whose attendance_pct >= 50 (attendance-gated)"

  - name: scholarship_budget_commitment
    trigger: "POST /scholarship-applications/{application_id}/approve (before transition to APPROVED); reversed by revoke"
    algorithm: aggregation
    formula: |
      season = application.season
      prospective = season.scholarship_committed_cents + payload.estimated_commitment_cents
      require prospective <= season.scholarship_budget_cents   # equality ALLOWED
      else reject ERR_SCHOLARSHIP_BUDGET_EXCEEDED
      on success: season.scholarship_committed_cents = prospective
      on revoke:  season.scholarship_committed_cents -= application.estimated_commitment_cents
    input_set: "Season's ScholarshipApplications with status == APPROVED (committed sum), the pending approval"
    constants: {}
    precision: "integer cents; <= boundary (commitment exactly equal to remaining budget is allowed)"
    variants: []

  - name: consecutive_absence_replay
    trigger: "After every AttendanceRecord creation and every AttendanceRecord PATCH, for the affected registration"
    algorithm: chronological
    formula: |
      records = AttendanceRecords of the registration, joined to their meetings,
                restricted to meetings with starts_at <= now,
                ordered by meeting.starts_at ASC, tie-break record.created_at ASC
      counter = 0
      for each record in order:
        PRESENT -> counter = 0
        ABSENT  -> counter += 1
        EXCUSED -> counter unchanged      # EXCUSED neither increments nor resets
      registration.consecutive_absences = counter
      if registration.enrollment_status == ENROLLED and counter >= NO_SHOW_ABSENCE_THRESHOLD:
        fire ENROLLED -> DROPPED (drop_reason NO_SHOW) cascade, including waitlist_promotion_selector
      # A drop that already fired is FINAL: later PATCH corrections lower the counter but never resurrect the registration.
    input_set: "All attendance records of the registration on meetings already started"
    constants:
      NO_SHOW_ABSENCE_THRESHOLD: 3
    precision: "integer counter; >= threshold (exactly 3 consecutive absences triggers)"
    variants: []

  - name: room_overlap_check
    trigger: "ClassMeeting creation (POST /class-meetings) and PATCH /class-meetings/{meeting_id}"
    algorithm: interval_merge
    formula: |
      BUFFER = ROOM_TURNOVER_BUFFER_MINUTES
      occupancy(M) = half-open interval [M.starts_at, M.ends_at + BUFFER minutes)
      candidates = ClassMeetings M where M.room_id == new.room_id AND M != self
                   AND M.session.status in {DRAFT, PUBLISHED, ACTIVE}   # CANCELLED/COMPLETED sessions do not block
      conflict iff any candidate C: new.starts_at < occupancy_end(C) AND C.starts_at < occupancy_end(new)
      # Adjacency pin: new.starts_at == C.ends_at + BUFFER exactly -> NO conflict (half-open intervals).
      reject with ERR_ROOM_CONFLICT on conflict
    input_set: "Meetings of the same room belonging to non-terminal sessions"
    constants:
      ROOM_TURNOVER_BUFFER_MINUTES: 15
    precision: "datetime comparison; half-open intervals with post-meeting buffer"
    variants: []

  - name: instructor_overlap_check
    trigger: "ClassMeeting creation (POST /class-meetings) and PATCH /class-meetings/{meeting_id}"
    algorithm: interval_merge
    formula: |
      candidates = ClassMeetings M where M != self
                   AND M.session.instructor_id == new.session.instructor_id
                   AND M.session.status in {DRAFT, PUBLISHED, ACTIVE}
      conflict iff any candidate C: new.starts_at < C.ends_at AND C.starts_at < new.ends_at
      # NO buffer; back-to-back pin: new.starts_at == C.ends_at exactly -> NO conflict (half-open).
      reject with ERR_INSTRUCTOR_DOUBLE_BOOKED on conflict
    input_set: "Meetings whose sessions share the instructor, non-terminal sessions only"
    constants: {}
    precision: "datetime comparison; half-open intervals, zero buffer (different semantics from room_overlap_check)"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins when a
#     request violates several rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a declared role; X-User-ID header present for every authenticated call"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role appears in the endpoint's roles list; entity-backed ownership where pinned (Instructor may only accept/decline/mark for own contracts and sessions — mismatch here)"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Request body well-formed: required fields present, types match, enum members valid, numeric ranges valid (capacity > 0, min_enrollment >= 1, min_enrollment <= capacity, amounts > 0, approved_pct in {25,50,75,100}, revenue_share_bp in 0..10000), ends_at > starts_at, min_age <= max_age, season window ordering resident_opens_at <= general_opens_at <= registration_closes_at, end_date > start_date"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path parameters resolve left-to-right, then body FK ids (season_id, program_id, session_id, participant_id, room_id, meeting_id, registration_id, instructor_id, household_id, contract_id, form_id, application_id, payment_id) reference existing resources"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "Generic state-machine legality: the trigger is defined for the entity's current state (e.g., publish an already-PUBLISHED session, drop an already-DROPPED registration, verify an already-VERIFIED form, withdraw a DENIED application, double payment on PAID registration handled at priority 11)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/payment endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_class_session_version equals the session's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /registrations, PATCH /class-sessions/{session_id}"
  - priority: 7
    category: state
    check: "Season gate: session publish requires season PUBLISHED; program/session/meeting creation allowed only while season in {DRAFT, PUBLISHED}"
    error_id: ERR_SEASON_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /class-sessions/{session_id}/publish, POST /programs, POST /class-sessions, POST /class-meetings, POST /registrations"
  - priority: 8
    category: state
    check: "Season CLOSED blocks new registrations and new catalog content"
    error_id: ERR_SEASON_CLOSED
    http_status: 409
    applies_to: "POST /registrations, POST /programs, POST /class-sessions, POST /class-meetings"
  - priority: 9
    category: state
    check: "Session must be in {PUBLISHED, ACTIVE} for registration creation and drops; DRAFT/CANCELLED/COMPLETED sessions reject"
    error_id: ERR_SESSION_NOT_OPEN
    http_status: 409
    applies_to: "POST /registrations, POST /registrations/{registration_id}/drop"
  - priority: 10
    category: state
    check: "Attendance marking requires the registration's enrollment_status == ENROLLED"
    error_id: ERR_REGISTRATION_NOT_ENROLLED
    http_status: 409
    applies_to: "POST /attendance-records"
  - priority: 11
    category: state
    check: "Payment requires enrollment_status == ENROLLED AND payment_status == PENDING (WAITLISTED cannot pay; PAID/WAIVED/VOID/REFUND* reject)"
    error_id: ERR_PAYMENT_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /registrations/{registration_id}/payment"
  - priority: 12
    category: state
    check: "approve-refund requires type == REFUND and status == PENDING"
    error_id: ERR_REFUND_NOT_PENDING
    http_status: 409
    applies_to: "POST /payments/{payment_id}/approve-refund"
  - priority: 13
    category: state
    check: "Session publish requires an ACCEPTED InstructorContract matching (session, session.instructor_id)"
    error_id: ERR_CONTRACT_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /class-sessions/{session_id}/publish"
  - priority: 14
    category: business_safety
    check: "Attendance marking requires a SafetyForm with status == VERIFIED for (registration.participant_id, session's season)"
    error_id: ERR_SAFETY_FORM_REQUIRED
    http_status: 422
    applies_to: "POST /attendance-records"
  - priority: 15
    category: business_safety
    check: "SafetyForm submission for a minor (age < 18 at season.start_date) requires signer_name != participant.full_name (guardian signature)"
    error_id: ERR_GUARDIAN_SIGNATURE_REQUIRED
    http_status: 422
    applies_to: "POST /safety-forms"
  - priority: 16
    category: business_safety
    check: "SafetyForm submission for an adult (age >= 18 at season.start_date) requires signer_name == participant.full_name (self-signature)"
    error_id: ERR_SELF_SIGNATURE_REQUIRED
    http_status: 422
    applies_to: "POST /safety-forms"
  - priority: 17
    category: business_temporal
    check: "Registration creation requires now >= season.resident_opens_at (before any window opens, reject)"
    error_id: ERR_REGISTRATION_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /registrations"
  - priority: 18
    category: business_temporal
    check: "During the resident-priority window (resident_opens_at <= now < general_opens_at) only households with residency_status == RESIDENT may register"
    error_id: ERR_RESIDENT_PRIORITY_WINDOW
    http_status: 422
    applies_to: "POST /registrations"
  - priority: 19
    category: business_temporal
    check: "Registration creation requires now < season.registration_closes_at (equality means closed)"
    error_id: ERR_REGISTRATION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /registrations"
  - priority: 20
    category: business_temporal
    check: "Attendance marking requires now >= meeting.starts_at"
    error_id: ERR_ATTENDANCE_TOO_EARLY
    http_status: 422
    applies_to: "POST /attendance-records"
  - priority: 21
    category: business_constraint
    check: "At most one registration per (participant_id, session_id) with enrollment_status in {ENROLLED, WAITLISTED}"
    error_id: ERR_DUPLICATE_REGISTRATION
    http_status: 409
    applies_to: "POST /registrations"
  - priority: 22
    category: business_constraint
    check: "age_eligibility_check: program.min_age <= age (at season.start_date) <= program.max_age"
    error_id: ERR_AGE_INELIGIBLE
    http_status: 422
    applies_to: "POST /registrations"
  - priority: 23
    category: business_constraint
    check: "Meeting room capacity: room.capacity >= session.capacity"
    error_id: ERR_ROOM_CAPACITY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /class-meetings, PATCH /class-meetings/{meeting_id}"
  - priority: 24
    category: business_constraint
    check: "Meeting room must have status == ACTIVE"
    error_id: ERR_ROOM_UNAVAILABLE
    http_status: 409
    applies_to: "POST /class-meetings, PATCH /class-meetings/{meeting_id}"
  - priority: 25
    category: business_constraint
    check: "room_overlap_check (buffered half-open occupancy intervals)"
    error_id: ERR_ROOM_CONFLICT
    http_status: 409
    applies_to: "POST /class-meetings, PATCH /class-meetings/{meeting_id}"
  - priority: 26
    category: business_constraint
    check: "instructor_overlap_check (unbuffered half-open intervals)"
    error_id: ERR_INSTRUCTOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /class-meetings, PATCH /class-meetings/{meeting_id}"
  - priority: 27
    category: business_constraint
    check: "PATCH /class-sessions capacity: new capacity >= enrolled_count"
    error_id: ERR_CAPACITY_BELOW_ENROLLED
    http_status: 409
    applies_to: "PATCH /class-sessions/{session_id}"
  - priority: 28
    category: business_constraint
    check: "Session publish requires >= 1 ClassMeeting"
    error_id: ERR_NO_MEETINGS
    http_status: 422
    applies_to: "POST /class-sessions/{session_id}/publish"
  - priority: 29
    category: business_constraint
    check: "At most one SafetyForm per (participant_id, season_id) with status in {SUBMITTED, VERIFIED}"
    error_id: ERR_DUPLICATE_SAFETY_FORM
    http_status: 409
    applies_to: "POST /safety-forms"
  - priority: 30
    category: business_constraint
    check: "At most one ScholarshipApplication per (household_id, season_id) with status in {SUBMITTED, UNDER_REVIEW, MORE_INFO_REQUESTED, RESUBMITTED, APPROVED}"
    error_id: ERR_DUPLICATE_SCHOLARSHIP_APPLICATION
    http_status: 409
    applies_to: "POST /scholarship-applications"
  - priority: 31
    category: business_constraint
    check: "At most one AttendanceRecord per (meeting_id, registration_id)"
    error_id: ERR_DUPLICATE_ATTENDANCE
    http_status: 409
    applies_to: "POST /attendance-records"
  - priority: 32
    category: business_constraint
    check: "At most one InstructorContract per session_id with status in {OFFERED, ACCEPTED}"
    error_id: ERR_DUPLICATE_CONTRACT
    http_status: 409
    applies_to: "POST /instructor-contracts"
  - priority: 33
    category: business_referential
    check: "InstructorContract.instructor_id must equal the referenced session's instructor_id"
    error_id: ERR_CONTRACT_INSTRUCTOR_MISMATCH
    http_status: 422
    applies_to: "POST /instructor-contracts"
  - priority: 34
    category: business_referential
    check: "HouseholdManager ownership: participant.household_id / registration.household_id / application.household_id / form participant's household must equal caller household (FrontDeskStaff exempt on registration/drop/payment paths)"
    error_id: ERR_NOT_HOUSEHOLD_MEMBER
    http_status: 403
    applies_to: "POST /participants, POST /safety-forms, POST /scholarship-applications, POST /scholarship-applications/{application_id}/resubmit, POST /scholarship-applications/{application_id}/withdraw, POST /registrations, POST /registrations/{registration_id}/drop, POST /registrations/{registration_id}/payment"
  - priority: 35
    category: business_referential
    check: "Segregation of duties: scholarship approve caller X-User-ID != application.reviewed_by"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /scholarship-applications/{application_id}/approve"
  - priority: 36
    category: business_fiscal
    check: "Payment amount_cents must equal registration.fee_charged_cents exactly (no partial, no overpayment)"
    error_id: ERR_INCORRECT_AMOUNT
    http_status: 422
    applies_to: "POST /registrations/{registration_id}/payment"
  - priority: 37
    category: business_fiscal
    check: "ACCOUNT_CREDIT payment requires Household.account_credit_cents >= amount_cents"
    error_id: ERR_INSUFFICIENT_CREDIT
    http_status: 422
    applies_to: "POST /registrations/{registration_id}/payment"
  - priority: 38
    category: business_fiscal
    check: "scholarship_budget_commitment: committed + estimated_commitment_cents <= scholarship_budget_cents"
    error_id: ERR_SCHOLARSHIP_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /scholarship-applications/{application_id}/approve"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- logical clock (test-driving) ----
  - method: POST
    path: /_clock/set_current_utc
    description: "Sets the server's logical clock. STARTUP DEFAULT: before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. All window/deadline/due/expiry rules evaluate against this clock."
    roles: [ProgramCoordinator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Logical clock advance; no entity mutation by itself"]

  # ---- Season ----
  - method: POST
    path: /seasons
    description: "Create a season catalog in DRAFT"
    roles: [ProgramCoordinator]
    code: 201
    input: [name, start_date, end_date, resident_opens_at, general_opens_at, registration_closes_at, "family_discount_threshold?", "family_discount_pct?", "scholarship_budget_cents?"]
    output: Season
    side_effects: []
  - method: GET
    path: /seasons/{season_id}
    description: "Read one season"
    roles: [ProgramCoordinator, FrontDeskStaff, HouseholdManager, Instructor, ScholarshipReviewer, FinanceOfficer]
    code: 200
    input: []
    output: Season
    side_effects: []
  - method: POST
    path: /seasons/{season_id}/publish
    description: "Publish season (DRAFT -> PUBLISHED)"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Season
    side_effects: ["Season.status -> PUBLISHED; increments Season.version by 1"]
  - method: POST
    path: /seasons/{season_id}/close
    description: "Close season (PUBLISHED -> CLOSED); requires now >= registration_closes_at"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Season
    side_effects: ["Season.status -> CLOSED; increments Season.version by 1"]
  - method: POST
    path: /seasons/{season_id}/sweeps
    description: "Ops-run checkpoint: runs the season sweep in pinned order — (1) payment-timeout expiry of ENROLLED registrations with payment_status == PENDING and payment_due_at <= now (ordered payment_due_at ASC, tie created_at ASC), each expiry immediately running waitlist_promotion_selector for its session; then (2) minimum-enrollment checks for sessions with status == PUBLISHED and enrollment_check_at <= now (ordered enrollment_check_at ASC, tie created_at ASC), activating or cancelling with full cascade"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: { activated_session_ids: "string[]", cancelled_session_ids: "string[]", expired_registration_ids: "string[]", promoted_registration_ids: "string[]" }
    side_effects: ["PENDING-past-due registrations -> EXPIRED (+ VOID, promotion cascade)", "PUBLISHED sessions -> ACTIVE or CANCELLED (LOW_ENROLLMENT cascade: registrations, refunds, household credit, contracts)", "increments version of every mutated entity"]

  # ---- Program ----
  - method: POST
    path: /programs
    description: "Create a program inside a season"
    roles: [ProgramCoordinator]
    code: 201
    input: [season_id, name, category, "min_age?", "max_age?"]
    output: Program
    side_effects: []
  - method: GET
    path: /programs
    description: "List programs, optionally filtered by season"
    roles: [ProgramCoordinator, FrontDeskStaff, HouseholdManager, Instructor, ScholarshipReviewer, FinanceOfficer]
    code: 200
    input: ["season_id?"]
    output: Program[]
    side_effects: []
  - method: GET
    path: /programs/{program_id}
    description: "Read one program"
    roles: [ProgramCoordinator, FrontDeskStaff, HouseholdManager, Instructor, ScholarshipReviewer, FinanceOfficer]
    code: 200
    input: []
    output: Program
    side_effects: []

  # ---- Room ----
  - method: POST
    path: /rooms
    description: "Create a room (status ACTIVE)"
    roles: [ProgramCoordinator]
    code: 201
    input: [name, capacity]
    output: Room
    side_effects: []
  - method: GET
    path: /rooms/{room_id}
    description: "Read one room"
    roles: [ProgramCoordinator, FrontDeskStaff, HouseholdManager, Instructor, ScholarshipReviewer, FinanceOfficer]
    code: 200
    input: []
    output: Room
    side_effects: []
  - method: PATCH
    path: /rooms/{room_id}
    description: "Toggle room status ACTIVE <-> MAINTENANCE"
    roles: [ProgramCoordinator]
    code: 200
    input: [status]
    output: Room
    side_effects: ["increments Room.version by 1"]

  # ---- Instructor ----
  - method: POST
    path: /instructors
    description: "Create an instructor"
    roles: [ProgramCoordinator]
    code: 201
    input: [full_name, email]
    output: Instructor
    side_effects: []
  - method: GET
    path: /instructors/{instructor_id}
    description: "Read one instructor"
    roles: [ProgramCoordinator, FrontDeskStaff, HouseholdManager, Instructor, ScholarshipReviewer, FinanceOfficer]
    code: 200
    input: []
    output: Instructor
    side_effects: []

  # ---- ClassSession ----
  - method: POST
    path: /class-sessions
    description: "Create a class session in DRAFT"
    roles: [ProgramCoordinator]
    code: 201
    input: [program_id, instructor_id, title, capacity, min_enrollment, fee_resident_cents, fee_nonresident_cents, enrollment_check_at]
    output: ClassSession
    side_effects: []
  - method: GET
    path: /class-sessions
    description: "List class sessions with optional filters"
    roles: [ProgramCoordinator, FrontDeskStaff, HouseholdManager, Instructor, ScholarshipReviewer, FinanceOfficer]
    code: 200
    input: ["program_id?", "instructor_id?", "status?"]
    output: ClassSession[]
    side_effects: []
  - method: GET
    path: /class-sessions/{session_id}
    description: "Read one class session"
    roles: [ProgramCoordinator, FrontDeskStaff, HouseholdManager, Instructor, ScholarshipReviewer, FinanceOfficer]
    code: 200
    input: []
    output: ClassSession
    side_effects: []
  - method: PATCH
    path: /class-sessions/{session_id}
    description: "Update capacity / min_enrollment / enrollment_check_at while DRAFT or PUBLISHED; OCC-guarded"
    roles: [ProgramCoordinator]
    code: 200
    input: ["capacity?", "min_enrollment?", "enrollment_check_at?", expected_class_session_version]
    output: ClassSession
    side_effects: ["increments ClassSession.version by 1"]
  - method: POST
    path: /class-sessions/{session_id}/publish
    description: "Publish session (DRAFT -> PUBLISHED); requires season PUBLISHED, >= 1 meeting, ACCEPTED contract"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: ClassSession
    side_effects: ["ClassSession.status -> PUBLISHED; increments ClassSession.version by 1"]
  - method: POST
    path: /class-sessions/{session_id}/cancel
    description: "Manual cancellation (PUBLISHED/ACTIVE -> CANCELLED, reason ADMIN) with full cascade"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: ClassSession
    side_effects: ["Full cancellation cascade (registrations, refunds, household credit, contracts)", "increments ClassSession.version by 1"]
  - method: POST
    path: /class-sessions/{session_id}/complete
    description: "Complete session (ACTIVE -> COMPLETED); requires all meetings ended; settles contract"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: ClassSession
    side_effects: ["instructor_settlement_pay", "WAITLISTED registrations -> CANCELLED", "increments ClassSession.version by 1"]

  # ---- ClassMeeting ----
  - method: POST
    path: /class-meetings
    description: "Add a meeting with room assignment; runs capacity, availability, room-overlap (buffered) and instructor-overlap (unbuffered) checks"
    roles: [ProgramCoordinator]
    code: 201
    input: [session_id, room_id, starts_at, ends_at]
    output: ClassMeeting
    side_effects: ["room_overlap_check", "instructor_overlap_check"]
  - method: GET
    path: /class-meetings
    description: "List meetings, optionally filtered by session and/or room"
    roles: [ProgramCoordinator, FrontDeskStaff, HouseholdManager, Instructor, ScholarshipReviewer, FinanceOfficer]
    code: 200
    input: ["session_id?", "room_id?"]
    output: ClassMeeting[]
    side_effects: []
  - method: GET
    path: /class-meetings/{meeting_id}
    description: "Read one meeting"
    roles: [ProgramCoordinator, FrontDeskStaff, HouseholdManager, Instructor, ScholarshipReviewer, FinanceOfficer]
    code: 200
    input: []
    output: ClassMeeting
    side_effects: []
  - method: PATCH
    path: /class-meetings/{meeting_id}
    description: "Re-assign room and/or reschedule a meeting while its session is DRAFT or PUBLISHED; re-runs all overlap/capacity/availability checks with the new values"
    roles: [ProgramCoordinator]
    code: 200
    input: ["room_id?", "starts_at?", "ends_at?"]
    output: ClassMeeting
    side_effects: ["room_overlap_check", "instructor_overlap_check", "increments ClassMeeting.version by 1"]

  # ---- InstructorContract ----
  - method: POST
    path: /instructor-contracts
    description: "Offer a contract (OFFERED); instructor must match session.instructor_id; one non-terminal contract per session"
    roles: [ProgramCoordinator]
    code: 201
    input: [session_id, instructor_id, revenue_share_bp, guarantee_min_cents, cancellation_guarantee_cents, settlement_basis]
    output: InstructorContract
    side_effects: []
  - method: GET
    path: /instructor-contracts
    description: "List contracts, optionally filtered by session and/or instructor"
    roles: [ProgramCoordinator, FrontDeskStaff, HouseholdManager, Instructor, ScholarshipReviewer, FinanceOfficer]
    code: 200
    input: ["session_id?", "instructor_id?"]
    output: InstructorContract[]
    side_effects: []
  - method: GET
    path: /instructor-contracts/{contract_id}
    description: "Read one contract"
    roles: [ProgramCoordinator, FrontDeskStaff, HouseholdManager, Instructor, ScholarshipReviewer, FinanceOfficer]
    code: 200
    input: []
    output: InstructorContract
    side_effects: []
  - method: POST
    path: /instructor-contracts/{contract_id}/accept
    description: "Instructor accepts own contract (OFFERED -> ACCEPTED); session must be DRAFT or PUBLISHED"
    roles: [Instructor]
    code: 200
    input: []
    output: InstructorContract
    side_effects: ["increments InstructorContract.version by 1"]
  - method: POST
    path: /instructor-contracts/{contract_id}/decline
    description: "Instructor declines own contract (OFFERED -> DECLINED, payout 0)"
    roles: [Instructor]
    code: 200
    input: []
    output: InstructorContract
    side_effects: ["payout_cents = 0; increments InstructorContract.version by 1"]

  # ---- Household ----
  - method: POST
    path: /households
    description: "Self-service household account creation; server-minted id becomes the caller's X-User-ID for subsequent HouseholdManager calls"
    roles: [HouseholdManager]
    code: 201
    input: [account_name]
    output: Household
    side_effects: []
  - method: GET
    path: /households/{household_id}
    description: "Read one household (incl. account_credit_cents)"
    roles: [HouseholdManager, FrontDeskStaff, ProgramCoordinator, FinanceOfficer]
    code: 200
    input: []
    output: Household
    side_effects: []
  - method: POST
    path: /households/{household_id}/verify-residency
    description: "Front desk verifies (or re-verifies) residency; existing registrations keep their pinned fee basis"
    roles: [FrontDeskStaff]
    code: 200
    input: [residency_status]
    output: Household
    side_effects: ["Household.residency_status set; increments Household.version by 1"]

  # ---- Participant ----
  - method: POST
    path: /participants
    description: "Add a participant to the caller's household"
    roles: [HouseholdManager]
    code: 201
    input: [household_id, full_name, birth_date]
    output: Participant
    side_effects: []
  - method: GET
    path: /participants
    description: "List participants, optionally filtered by household"
    roles: [HouseholdManager, FrontDeskStaff, ProgramCoordinator]
    code: 200
    input: ["household_id?"]
    output: Participant[]
    side_effects: []
  - method: GET
    path: /participants/{participant_id}
    description: "Read one participant"
    roles: [HouseholdManager, FrontDeskStaff, ProgramCoordinator]
    code: 200
    input: []
    output: Participant
    side_effects: []

  # ---- SafetyForm ----
  - method: POST
    path: /safety-forms
    description: "Submit a safety form for a participant+season (guardian/self signature rules apply)"
    roles: [HouseholdManager]
    code: 201
    input: [participant_id, season_id, emergency_contact_name, emergency_contact_phone, "medical_notes?", signer_name]
    output: SafetyForm
    side_effects: []
  - method: GET
    path: /safety-forms
    description: "List safety forms with optional filters"
    roles: [HouseholdManager, FrontDeskStaff, ProgramCoordinator]
    code: 200
    input: ["participant_id?", "season_id?", "status?"]
    output: SafetyForm[]
    side_effects: []
  - method: GET
    path: /safety-forms/{form_id}
    description: "Read one safety form"
    roles: [HouseholdManager, FrontDeskStaff, ProgramCoordinator]
    code: 200
    input: []
    output: SafetyForm
    side_effects: []
  - method: POST
    path: /safety-forms/{form_id}/verify
    description: "Front desk verifies a SUBMITTED form"
    roles: [FrontDeskStaff]
    code: 200
    input: []
    output: SafetyForm
    side_effects: ["SafetyForm.status -> VERIFIED; increments SafetyForm.version by 1"]
  - method: POST
    path: /safety-forms/{form_id}/reject
    description: "Front desk rejects a SUBMITTED form"
    roles: [FrontDeskStaff]
    code: 200
    input: ["reason?"]
    output: SafetyForm
    side_effects: ["SafetyForm.status -> REJECTED; increments SafetyForm.version by 1"]

  # ---- ScholarshipApplication ----
  - method: POST
    path: /scholarship-applications
    description: "Submit a scholarship application for a household+season"
    roles: [HouseholdManager]
    code: 201
    input: [household_id, season_id, household_size, annual_income_cents, "statement?"]
    output: ScholarshipApplication
    side_effects: []
  - method: GET
    path: /scholarship-applications
    description: "List scholarship applications with optional filters"
    roles: [HouseholdManager, ScholarshipReviewer, FinanceOfficer, ProgramCoordinator]
    code: 200
    input: ["household_id?", "season_id?", "status?"]
    output: ScholarshipApplication[]
    side_effects: []
  - method: GET
    path: /scholarship-applications/{application_id}
    description: "Read one scholarship application"
    roles: [HouseholdManager, ScholarshipReviewer, FinanceOfficer, ProgramCoordinator]
    code: 200
    input: []
    output: ScholarshipApplication
    side_effects: []
  - method: POST
    path: /scholarship-applications/{application_id}/start-review
    description: "Reviewer claims application (SUBMITTED or RESUBMITTED -> UNDER_REVIEW); records reviewed_by"
    roles: [ScholarshipReviewer]
    code: 200
    input: []
    output: ScholarshipApplication
    side_effects: ["reviewed_by = caller; increments ScholarshipApplication.version by 1"]
  - method: POST
    path: /scholarship-applications/{application_id}/request-info
    description: "Reviewer requests more information (UNDER_REVIEW -> MORE_INFO_REQUESTED)"
    roles: [ScholarshipReviewer]
    code: 200
    input: [info_request_note]
    output: ScholarshipApplication
    side_effects: ["info_request_note set; increments ScholarshipApplication.version by 1"]
  - method: POST
    path: /scholarship-applications/{application_id}/resubmit
    description: "Household resubmits with updated statement (MORE_INFO_REQUESTED -> RESUBMITTED)"
    roles: [HouseholdManager]
    code: 200
    input: [statement]
    output: ScholarshipApplication
    side_effects: ["statement updated; increments ScholarshipApplication.version by 1"]
  - method: POST
    path: /scholarship-applications/{application_id}/approve
    description: "Approve with discount pct and budget commitment (UNDER_REVIEW -> APPROVED); segregation of duties + budget cap apply"
    roles: [ScholarshipReviewer]
    code: 200
    input: [approved_pct, estimated_commitment_cents]
    output: ScholarshipApplication
    side_effects: ["Season.scholarship_committed_cents += estimated_commitment_cents; increments ScholarshipApplication.version by 1"]
  - method: POST
    path: /scholarship-applications/{application_id}/deny
    description: "Deny application (UNDER_REVIEW -> DENIED)"
    roles: [ScholarshipReviewer]
    code: 200
    input: ["reason?"]
    output: ScholarshipApplication
    side_effects: ["decided_by = caller; increments ScholarshipApplication.version by 1"]
  - method: POST
    path: /scholarship-applications/{application_id}/withdraw
    description: "Household withdraws a pre-decision application"
    roles: [HouseholdManager]
    code: 200
    input: []
    output: ScholarshipApplication
    side_effects: ["increments ScholarshipApplication.version by 1"]
  - method: POST
    path: /scholarship-applications/{application_id}/revoke
    description: "Finance revokes an APPROVED application; budget commitment reversed; existing registrations keep pinned fees"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: ScholarshipApplication
    side_effects: ["Season.scholarship_committed_cents -= estimated_commitment_cents; increments ScholarshipApplication.version by 1"]

  # ---- Registration ----
  - method: POST
    path: /registrations
    description: "Register a participant into a session; OCC-guarded on the session; lands ENROLLED (seat free) or WAITLISTED (full); fee computed once and pinned"
    roles: [HouseholdManager, FrontDeskStaff]
    code: 201
    input: [session_id, participant_id, expected_class_session_version]
    output: Registration
    side_effects: ["registration_fee_calculation (pinned)", "family_discount_evaluation", "age_eligibility_check", "enrolled_count or waitlist_count += 1", "payment_due_at set when ENROLLED with fee > 0", "increments ClassSession.version by 1"]
  - method: GET
    path: /registrations
    description: "List registrations with optional filters"
    roles: [HouseholdManager, FrontDeskStaff, ProgramCoordinator, FinanceOfficer]
    code: 200
    input: ["session_id?", "participant_id?", "household_id?", "enrollment_status?"]
    output: Registration[]
    side_effects: []
  - method: GET
    path: /registrations/{registration_id}
    description: "Read one registration"
    roles: [HouseholdManager, FrontDeskStaff, ProgramCoordinator, FinanceOfficer]
    code: 200
    input: []
    output: Registration
    side_effects: []
  - method: POST
    path: /registrations/{registration_id}/drop
    description: "Voluntary drop (ENROLLED or WAITLISTED -> DROPPED); ENROLLED drop runs refund + waitlist promotion cascade"
    roles: [HouseholdManager, FrontDeskStaff]
    code: 200
    input: []
    output: Registration
    side_effects: ["registration_refund (VOLUNTARY variant) + refund issuance", "waitlist_promotion_selector on the freed seat", "increments Registration.version and ClassSession.version"]
  - method: POST
    path: /registrations/{registration_id}/payment
    description: "Pay the pinned fee in full (PENDING -> PAID); ACCOUNT_CREDIT draws down household credit"
    roles: [HouseholdManager, FrontDeskStaff]
    code: 201
    input: [amount_cents, method]
    output: PaymentTransaction
    side_effects: ["CHARGE PaymentTransaction COMPLETED", "Registration.payment_status -> PAID; net_paid_cents updated; payment_due_at cleared", "ACCOUNT_CREDIT: Household.account_credit_cents -= amount"]

  # ---- PaymentTransaction ----
  - method: GET
    path: /payments
    description: "List payment transactions, optionally filtered by registration; default sort created_at ASC (chronological), so a CHARGE precedes its REFUND"
    roles: [HouseholdManager, FrontDeskStaff, ProgramCoordinator, FinanceOfficer]
    code: 200
    input: ["registration_id?"]
    output: PaymentTransaction[]
    side_effects: []
  - method: GET
    path: /payments/{payment_id}
    description: "Read one payment transaction"
    roles: [HouseholdManager, FrontDeskStaff, ProgramCoordinator, FinanceOfficer]
    code: 200
    input: []
    output: PaymentTransaction
    side_effects: []
  - method: POST
    path: /payments/{payment_id}/approve-refund
    description: "Finance approves a PENDING refund (>= REFUND_REVIEW_THRESHOLD_CENTS); credits the household"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: PaymentTransaction
    side_effects: ["REFUND -> COMPLETED", "Household.account_credit_cents += amount", "Registration.payment_status REFUND_PENDING -> REFUNDED; refund_total_cents updated"]

  # ---- AttendanceRecord ----
  - method: POST
    path: /attendance-records
    description: "Mark attendance for a registration at a meeting; requires verified safety form, started meeting, ENROLLED registration"
    roles: [Instructor, FrontDeskStaff]
    code: 201
    input: [meeting_id, registration_id, status]
    output: AttendanceRecord
    side_effects: ["consecutive_absence_replay (may fire NO_SHOW auto-drop cascade with refund-forfeit and waitlist promotion)"]
  - method: GET
    path: /attendance-records
    description: "List attendance records, optionally filtered by meeting and/or registration"
    roles: [Instructor, FrontDeskStaff, ProgramCoordinator]
    code: 200
    input: ["meeting_id?", "registration_id?"]
    output: AttendanceRecord[]
    side_effects: []
  - method: GET
    path: /attendance-records/{attendance_id}
    description: "Read one attendance record"
    roles: [Instructor, FrontDeskStaff, ProgramCoordinator]
    code: 200
    input: []
    output: AttendanceRecord
    side_effects: []
  - method: PATCH
    path: /attendance-records/{attendance_id}
    description: "Correct an attendance mark; re-runs consecutive_absence_replay (never resurrects an already-dropped registration)"
    roles: [Instructor, FrontDeskStaff]
    code: 200
    input: [status]
    output: AttendanceRecord
    side_effects: ["consecutive_absence_replay", "increments AttendanceRecord.version by 1"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID on an authenticated call" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in endpoint's roles, or entity-backed identity mismatch (Instructor acting on another instructor's contract/session)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad type/enum/range, ends_at <= starts_at, min_enrollment > capacity, bad season window ordering" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Trigger not defined for the entity's current state (terminal lockdown, wrong-from-state, season close before registration_closes_at, complete with unfinished meetings)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_class_session_version does not match the session's current version (OCC)" }
  - { id: ERR_SEASON_NOT_PUBLISHED, http: 409, condition: "Season still DRAFT when publishing a session or registering; or season-gated catalog creation while season not in {DRAFT, PUBLISHED}" }
  - { id: ERR_SEASON_CLOSED, http: 409, condition: "Season CLOSED: new registrations and new catalog content rejected" }
  - { id: ERR_SESSION_NOT_OPEN, http: 409, condition: "Session not in {PUBLISHED, ACTIVE} for registration creation or drop" }
  - { id: ERR_REGISTRATION_NOT_ENROLLED, http: 409, condition: "Attendance marking on a registration whose enrollment_status != ENROLLED" }
  - { id: ERR_PAYMENT_NOT_ALLOWED, http: 409, condition: "Payment attempt when not (enrollment_status == ENROLLED AND payment_status == PENDING)" }
  - { id: ERR_REFUND_NOT_PENDING, http: 409, condition: "approve-refund on a transaction that is not a PENDING REFUND" }
  - { id: ERR_CONTRACT_NOT_ACCEPTED, http: 409, condition: "Session publish without an ACCEPTED contract for (session, session.instructor_id)" }
  - { id: ERR_SAFETY_FORM_REQUIRED, http: 422, condition: "Attendance marking without a VERIFIED safety form for (participant, season)" }
  - { id: ERR_GUARDIAN_SIGNATURE_REQUIRED, http: 422, condition: "Minor's safety form self-signed (signer_name == participant.full_name)" }
  - { id: ERR_SELF_SIGNATURE_REQUIRED, http: 422, condition: "Adult's safety form signed by someone else (signer_name != participant.full_name)" }
  - { id: ERR_REGISTRATION_WINDOW_NOT_OPEN, http: 422, condition: "Registration before season.resident_opens_at" }
  - { id: ERR_RESIDENT_PRIORITY_WINDOW, http: 422, condition: "Non-resident (or PENDING) household registering during the resident-priority window [resident_opens_at, general_opens_at)" }
  - { id: ERR_REGISTRATION_WINDOW_CLOSED, http: 422, condition: "Registration at or after season.registration_closes_at" }
  - { id: ERR_ATTENDANCE_TOO_EARLY, http: 422, condition: "Attendance marking before meeting.starts_at" }
  - { id: ERR_DUPLICATE_REGISTRATION, http: 409, condition: "A registration for (participant, session) already exists with enrollment_status in {ENROLLED, WAITLISTED}" }
  - { id: ERR_AGE_INELIGIBLE, http: 422, condition: "Participant age at season.start_date outside [program.min_age, program.max_age]" }
  - { id: ERR_ROOM_CAPACITY_INSUFFICIENT, http: 422, condition: "room.capacity < session.capacity on meeting create/patch" }
  - { id: ERR_ROOM_UNAVAILABLE, http: 409, condition: "Room in MAINTENANCE on meeting create/patch" }
  - { id: ERR_ROOM_CONFLICT, http: 409, condition: "Buffered occupancy interval [starts_at, ends_at + 15min) collides with another meeting of the same room in a non-terminal session" }
  - { id: ERR_INSTRUCTOR_DOUBLE_BOOKED, http: 409, condition: "Unbuffered half-open interval collides with another meeting of the same instructor in a non-terminal session" }
  - { id: ERR_CAPACITY_BELOW_ENROLLED, http: 409, condition: "PATCH capacity below current enrolled_count" }
  - { id: ERR_NO_MEETINGS, http: 422, condition: "Session publish with zero meetings" }
  - { id: ERR_DUPLICATE_SAFETY_FORM, http: 409, condition: "A form for (participant, season) already exists with status in {SUBMITTED, VERIFIED}" }
  - { id: ERR_DUPLICATE_SCHOLARSHIP_APPLICATION, http: 409, condition: "An application for (household, season) already exists with status in {SUBMITTED, UNDER_REVIEW, MORE_INFO_REQUESTED, RESUBMITTED, APPROVED}" }
  - { id: ERR_DUPLICATE_ATTENDANCE, http: 409, condition: "An attendance record already exists for (meeting, registration)" }
  - { id: ERR_DUPLICATE_CONTRACT, http: 409, condition: "A contract for the session already exists with status in {OFFERED, ACCEPTED}" }
  - { id: ERR_CONTRACT_INSTRUCTOR_MISMATCH, http: 422, condition: "Contract instructor_id != session.instructor_id" }
  - { id: ERR_NOT_HOUSEHOLD_MEMBER, http: 403, condition: "HouseholdManager acting on a participant/registration/application outside own household" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Scholarship approve caller equals application.reviewed_by" }
  - { id: ERR_INCORRECT_AMOUNT, http: 422, condition: "Payment amount_cents != registration.fee_charged_cents" }
  - { id: ERR_INSUFFICIENT_CREDIT, http: 422, condition: "ACCOUNT_CREDIT payment exceeds Household.account_credit_cents" }
  - { id: ERR_SCHOLARSHIP_BUDGET_EXCEEDED, http: 422, condition: "Approval would push scholarship_committed_cents above scholarship_budget_cents" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: HouseholdManager
    description: "Head of a household account; registers own participants, manages own safety forms, scholarship applications, drops, and payments"
    identity: "entity_backed:Household"
    exclusive_operations:
      - "POST /households"
      - "POST /participants"
      - "POST /safety-forms"
      - "POST /scholarship-applications"
      - "POST /scholarship-applications/{application_id}/resubmit"
      - "POST /scholarship-applications/{application_id}/withdraw"
    shared_operations:
      - "POST /registrations"
      - "POST /registrations/{registration_id}/drop"
      - "POST /registrations/{registration_id}/payment"
      - "GET reads of own-linked resources"
  - name: ProgramCoordinator
    description: "Community-center program staff; owns catalog (seasons, programs, sessions, meetings, rooms, instructors, contracts), publishes, cancels, completes, and runs sweeps; drives the test clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /seasons"
      - "POST /seasons/{season_id}/publish"
      - "POST /seasons/{season_id}/close"
      - "POST /seasons/{season_id}/sweeps"
      - "POST /programs"
      - "POST /rooms"
      - "PATCH /rooms/{room_id}"
      - "POST /instructors"
      - "POST /class-sessions"
      - "PATCH /class-sessions/{session_id}"
      - "POST /class-sessions/{session_id}/publish"
      - "POST /class-sessions/{session_id}/cancel"
      - "POST /class-sessions/{session_id}/complete"
      - "POST /class-meetings"
      - "PATCH /class-meetings/{meeting_id}"
      - "POST /instructor-contracts"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads"
  - name: FrontDeskStaff
    description: "Front-desk operators; verify residency and safety forms, register and drop on behalf of households, take payments, mark attendance"
    identity: "opaque"
    exclusive_operations:
      - "POST /households/{household_id}/verify-residency"
      - "POST /safety-forms/{form_id}/verify"
      - "POST /safety-forms/{form_id}/reject"
    shared_operations:
      - "POST /registrations"
      - "POST /registrations/{registration_id}/drop"
      - "POST /registrations/{registration_id}/payment"
      - "POST /attendance-records"
      - "PATCH /attendance-records/{attendance_id}"
      - "GET reads"
  - name: Instructor
    description: "Contracted instructor; accepts/declines own contracts, marks and corrects attendance for own sessions"
    identity: "entity_backed:Instructor"
    exclusive_operations:
      - "POST /instructor-contracts/{contract_id}/accept"
      - "POST /instructor-contracts/{contract_id}/decline"
    shared_operations:
      - "POST /attendance-records"
      - "PATCH /attendance-records/{attendance_id}"
      - "GET reads"
  - name: ScholarshipReviewer
    description: "Reviews scholarship applications; cannot approve an application they themselves started reviewing (segregation of duties)"
    identity: "opaque"
    exclusive_operations:
      - "POST /scholarship-applications/{application_id}/start-review"
      - "POST /scholarship-applications/{application_id}/request-info"
      - "POST /scholarship-applications/{application_id}/approve"
      - "POST /scholarship-applications/{application_id}/deny"
    shared_operations:
      - "GET reads of scholarship applications"
  - name: FinanceOfficer
    description: "Finance office; approves large refunds and revokes scholarship awards"
    identity: "opaque"
    exclusive_operations:
      - "POST /payments/{payment_id}/approve-refund"
      - "POST /scholarship-applications/{application_id}/revoke"
    shared_operations:
      - "GET reads"
