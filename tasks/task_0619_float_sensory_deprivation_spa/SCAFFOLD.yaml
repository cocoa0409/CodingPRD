    roles: [Admin, FrontDesk, Member]
    code: 200
    input: []
    output: Tank
    side_effects: []

  - method: GET
    path: "/tanks"
    description: "List tanks"
    roles: [Admin, FrontDesk, Member]
    code: 200
    input: ["limit?", "offset?", "capacity_kind?"]
    output: Tank[]
    side_effects: []

  - method: POST
    path: "/tanks/{id}/maintenance"
    description: "Put a tank into MAINTENANCE"
    roles: [Admin]
    code: 200
    input: []
    output: Tank
    side_effects: ["operational_status IN_SERVICE->MAINTENANCE"]

  - method: POST
    path: "/tanks/{id}/return-to-service"
    description: "Return a tank from MAINTENANCE to IN_SERVICE"
    roles: [Admin]
    code: 200
    input: []
    output: Tank
    side_effects: ["operational_status MAINTENANCE->IN_SERVICE"]

  - method: POST
    path: "/tanks/{id}/retire"
    description: "Retire a tank permanently"
    roles: [Admin]
    code: 200
    input: []
    output: Tank
    side_effects: ["operational_status->RETIRED"]

  # ---------- SanitationCycle ----------
