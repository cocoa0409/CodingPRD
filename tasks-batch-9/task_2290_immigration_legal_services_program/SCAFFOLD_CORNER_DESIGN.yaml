      - name: cross_entity_validation_recognition_state_gates_accredited_engagement
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 20 ERR_RECOGNITION_NOT_ACTIVE]
          - state_machines.OrganizationRecognition
          - calculations.representative_authorization_status
        distinguishing_aspect: "Whether an accredited representative may be engaged depends on the state of an entity that is nowhere in the request: the single OrganizationRecognition row. CONDITIONAL still permits engagement — the rule admits {ACTIVE, CONDITIONAL}, so a CONDITION transition must NOT block anything — while LAPSED refuses both a new accreditation and a new case assignment for the same representative, and REINSTATE restores both. NOTE: §1.4 priorities 20 and 22 spell the rep type 'ACCREDITED_REPRESENTATIVE' while the §1.1 enum is 'ACCREDITED_REP'; the enum value is used in every payload here."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z, cycle FY26-H2, three staff attorneys, Rosa Mena's accepted U_VISA matter with no LEAD yet. Recognition REC-2026-001 (all four forums, expiry 2030-01-01) is ACTIVE. Nadia Rey is an ACCREDITED_REP with an APPROVED FULL accreditation, and Ada Ortiz holds an ACTIVE SUPERVISOR assignment on the matter so a supervision link is always resolvable."
