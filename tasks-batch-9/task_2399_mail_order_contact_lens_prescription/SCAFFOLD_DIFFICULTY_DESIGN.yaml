- rule_id: compensating_invariant
  rule_name: Compensating invariant
  instances:
  - name: money_invariant_survives_order_cancellation
    grounds: §1.3 and §1.1 define INV_MONEY as Customer.net_cash_position_cents equal to the sum of total_cents over non-CANCELLED orders minus the sum of CASH_REFUND settlements; POST /orders is the forward operation and POST /orders/{id}/cancel the compensation.
    distinguishing_aspect: An implementation that increments the ledger on order creation but does not decrement on cancellation leaves net_cash_position_cents at 19200 forever, and one that decrements twice goes negative. The correct implementation returns to lifetime_charged_cents 0 and net_cash_position_cents 0 with no drift, while store_credit_cents stays 0 because nothing was refunded.
    test_recipe:
      setup:
      - A verified prescription carries one PENDING six-box order worth 19200 cents, and the customer ledger has been read to confirm the forward effect.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-08T10:00:00Z'
        as: PlatformAdmin
        as_user_id: admin-root
      - call: POST /products
        payload:
          brand: AcuityFlex
          name: Daily 30
          wear_schedule: DAILY_DISPOSABLE
          lenses_per_box: 30
          unit_price_cents: 3200
          base_curve: 8.6
          diameter: 14.2
          sphere_min: -8.0
          sphere_max: 4.0
          sphere_step: 0.25
          material_family: silicone_hydrogel
        as: PlatformAdmin
        as_user_id: admin-root
        captures:
          p1_id: $.data.id
      - call: POST /customers
        payload:
          full_name: Ada Lin
          email: ada.lin@example.com
          state_code: UT
        as: PlatformAdmin
        as_user_id: admin-root
        captures:
          cust_id: $.data.id
      - call: POST /prescriptions
        payload:
          customer_id: ${cust_id}
          product_id: ${p1_id}
          capture_mode: UPLOAD
          document_reference: scan-1
          issue_date: '2026-07-01'
          expiry_date: '2027-07-01'
          od_sphere: -2.25
          os_sphere: -4.0
          base_curve: 8.6
          diameter: 14.2
          boxes_authorized_total: 24
        as: Customer
        as_user_id: ${cust_id}
        captures:
          rx_id: $.data.id
      - call: POST /prescriptions/${rx_id}/submit
        payload: {}
        as: Customer
        as_user_id: ${cust_id}
      - call: POST /orders
        payload:
          customer_id: ${cust_id}
          prescription_id: ${rx_id}
          ordered_product_id: ${p1_id}
          boxes_od: 3
          boxes_os: 3
        as: Customer
        as_user_id: ${cust_id}
        captures:
          order_id: $.data.id
      - call: GET /customers/${cust_id}/ledger
        payload: {}
        as: Customer
        as_user_id: ${cust_id}
      trigger:
      - call: POST /orders/${order_id}/cancel
        payload:
          cancellation_reason: CUSTOMER_REQUEST
        as: Customer
        as_user_id: ${cust_id}
      assert:
      - The setup ledger read reported lifetime_charged_cents 19200 and net_cash_position_cents 19200.
      - Trigger returns 200 with fulfillment_state CANCELLED and cancellation_reason CUSTOMER_REQUEST.
      - GET /customers/${cust_id}/ledger now reports lifetime_charged_cents 0, lifetime_refunded_cents 0, net_cash_position_cents 0 and store_credit_cents 0.
      - GET /orders with customer_id=${cust_id} and fulfillment_state=CANCELLED returns total_count 1, so the row is preserved rather than deleted.
  - name: allowance_invariant_releases_exactly_what_generation_consumed
    grounds: §1.3 customer_allowance_used_cents sums applied_allowance_cents over claims in GENERATED or SUBMITTED only, and §1.2 reimbursement_claim_lifecycle GENERATED -> VOIDED decreases the ledger by the same applied_allowance_cents.
    distinguishing_aspect: An implementation that blindly increments and decrements a counter, or that recomputes without excluding VOIDED rows, ends at 6400 or double-releases to a negative allowance. The correct implementation goes 0 to 6400 to 0 while the voided claim keeps its historical applied_allowance_cents 6400 for audit.
    test_recipe:
      setup:
      - A plan-covered customer has a delivered 6400-cent order whose claim has been generated, consuming 6400 cents of a 15000-cent allowance.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-08T10:00:00Z'
        as: PlatformAdmin
        as_user_id: admin-root
      - call: POST /insurance-plans
        payload:
          name: VisionOne
          network_status: OUT_OF_NETWORK
          annual_allowance_cents: 15000
          coinsurance_rate: 0.2
          requires_itemized_receipt: false
          covers_shipping: false
          claim_window_days: 90
          plan_year_start_month_day: 01-01
        as: PlatformAdmin
        as_user_id: admin-root
        captures:
          plan_id: $.data.id
      - call: POST /products
        payload:
          brand: AcuityFlex
          name: Daily 30
          wear_schedule: DAILY_DISPOSABLE
          lenses_per_box: 30
          unit_price_cents: 3200
          base_curve: 8.6
          diameter: 14.2
          sphere_min: -8.0
          sphere_max: 4.0
          sphere_step: 0.25
          material_family: silicone_hydrogel
        as: PlatformAdmin
        as_user_id: admin-root
        captures:
          p1_id: $.data.id
      - call: POST /customers
        payload:
          full_name: Ada Lin
          email: ada.lin@example.com
          state_code: UT
          insurance_plan_id: ${plan_id}
        as: PlatformAdmin
        as_user_id: admin-root
        captures:
          cust_id: $.data.id
      - call: POST /prescriptions
        payload:
          customer_id: ${cust_id}
          product_id: ${p1_id}
          capture_mode: UPLOAD
          document_reference: scan-1
          issue_date: '2026-07-01'
          expiry_date: '2027-07-01'
          od_sphere: -2.25
          os_sphere: -4.0
          base_curve: 8.6
          diameter: 14.2
          boxes_authorized_total: 24
        as: Customer
        as_user_id: ${cust_id}
        captures:
          rx_id: $.data.id
      - call: POST /prescriptions/${rx_id}/submit
        payload: {}
        as: Customer
        as_user_id: ${cust_id}
      - call: POST /orders
        payload:
          customer_id: ${cust_id}
          prescription_id: ${rx_id}
          ordered_product_id: ${p1_id}
          boxes_od: 1
          boxes_os: 1
        as: Customer
        as_user_id: ${cust_id}
        captures:
          order_id: $.data.id
      - call: POST /orders/${order_id}/ship
        payload: {}
        as: FulfillmentOperator
        as_user_id: fo-one
      - call: POST /orders/${order_id}/deliver
        payload: {}
        as: FulfillmentOperator
        as_user_id: fo-one
      - call: POST /reimbursement-claims
        payload:
          order_id: ${order_id}
          customer_id: ${cust_id}
          insurance_plan_id: ${plan_id}
        as: Customer
        as_user_id: ${cust_id}
        captures:
          claim_id: $.data.id
      - call: POST /reimbursement-claims/${claim_id}/generate
        payload: {}
        as: ComplianceOfficer
        as_user_id: co-alpha
      trigger:
      - call: POST /reimbursement-claims/${claim_id}/void
        payload:
          voided_reason: CUSTOMER_REQUEST
        as: ComplianceOfficer
        as_user_id: co-alpha
      assert:
      - Before the trigger GET /customers/${cust_id}/ledger reported allowance_used_cents 6400 and allowance_remaining_cents 8600, and the generated claim reported applied_allowance_cents 6400, processing_fee_cents 250 and reimbursable_cents 6150.
      - Trigger returns 200 with status VOIDED, voided_reason CUSTOMER_REQUEST and applied_allowance_cents still 6400.
      - GET /customers/${cust_id}/ledger now reports allowance_used_cents 0 and allowance_remaining_cents 15000.
      - GET /reimbursement-claims with customer_id=${cust_id} and status=GENERATED returns total_count 0.
  - name: box_authorization_ledger_returns_after_cancellation
    grounds: §1.1 Prescription.boxes_consumed is the sum of boxes over non-CANCELLED orders and §1.2 order cancellation decrements it, while §1.4 priority 37 spends it.
    distinguishing_aspect: An implementation that never decrements boxes_consumed permanently burns the authorization, so the follow-up 22-box order is refused. The correct implementation returns boxes_consumed to 2 and then accepts a 22-box order that exactly exhausts the 24-box authorization.
