              as: ProgramAdmin
            - call: "POST /servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /servicing/credit-programs/${g_id}/open-renewal"
              payload: { expected_program_version: "${g_v0}", to_status: "WINDING_DOWN" }
              as: ProgramAdmin
              captures: { g_v1: "$.data.version" }
          trigger:
            - call: "POST /servicing/transfer-agreements"
              payload: { program_id: "${g_id}", buyer_role: "ISSUER", proposed_price_cents: 103999 }
              as: ProgramAdmin
              captures: { error_id: "$.data.error_id" }
          assert:
            - "the response status is 422 and error_id == ERR_PURCHASE_PRICE_BELOW_FLOOR"
            - "portfolio_book_value_cents is 100000 so the floor purchase_price_cents is 104000"
            - "a second proposal at exactly 104000 cents succeeds"

