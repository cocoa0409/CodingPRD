      - name: claim_denied_appealed_denied_bounded_loop
        grounds:
          - state_machines.TcmClaim.DENIED_to_APPEALED
          - state_machines.TcmClaim.APPEALED_to_DENIED
          - state_machines.TcmClaim.DENIED_to_DENIED_FINAL
          - entities.TcmClaim.fields.appeal_count
          - validations[priority=32]
        distinguishing_aspect: |
          The non-linear shape is a bounded CYCLE on the TcmClaim entity, a
          different entity from the TcmVisit cycle - DENIED to APPEALED to
          DENIED is traversable exactly twice, net_payable_cents stays 21480
          throughout so the withhold is never re-applied, and the third appeal
          closes the claim as DENIED_FINAL while returning
          ERR_APPEAL_LIMIT_REACHED.
        test_recipe:
          setup:
            - "A HIGH-tier episode discharged 2026-05-01 with successful timely contact, a COMPLETED reconciliation, a visit completed and attested 2026-05-05, service period closed 2026-05-31T01:00:00Z."
            - "A TcmClaim prepared by bill-prep-1 and submitted by bill-sub-1, then denied once by the payer."
