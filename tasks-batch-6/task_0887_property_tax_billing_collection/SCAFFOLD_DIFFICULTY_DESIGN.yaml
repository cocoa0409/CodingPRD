# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances
# All numeric asserts are pre-computed literals (round_half_up, integer cents).
# =============================================================================
scaffold_difficulty_design:

  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: payoff_ledger_as_of_vs_quote
        grounds:
          - calculations.payoff_interest
          - entities.TaxBill.fields.balance_cents
          - state_machines.Installment.PENDING_to_DELINQUENT
        distinguishing_aspect: "On the SAME delinquent installment (principal 200000, due 2026-09-15, clock 2026-11-20) LEDGER_AS_OF returns whole-month materialized interest (4000) for payoff 214000 while PAYOFF_QUOTE to 2026-12-15 projects per-diem interest (5984) for payoff 215984 — interest-on-Installment domain."
        test_recipe:
          setup:
            - "TaxYear 2025 (millage 20.0, due 2026-06-15 / 2026-09-15); Parcel assessed 20000000; TaxBill net 400000 with installments 200000/200000."
            - "Installment 1 paid in full at default clock; clock advanced to 2026-11-20 so installment 2 is DELINQUENT with penalty 10000 + interest 4000."
          setup_api_calls:
            - call: "POST /property-tax/tax-years"
              payload: { year: 2025, millage_rate: 20.0, first_installment_due_date: "2026-06-15T00:00:00Z", second_installment_due_date: "2026-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty_id: $.data.id }
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-D1", owner_name: "Ann Owner", situs_address: "1 Main St", assessed_value_cents: 20000000, property_class: "RESIDENTIAL" }
              as: Cashier
              captures: { p_id: $.data.id }
            - call: "POST /property-tax/tax-bills"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}" }
              as: Treasurer
              captures: { bill_id: $.data.id }
            - call: "POST /property-tax/payments"
              payload: { bill_id: "${bill_id}", amount_cents: 200000, tender_type: "CHECK", source: "COUNTER" }
              as: Cashier
            - call: "POST /property-tax/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-20T00:00:00Z" }
              as: Treasurer
          trigger:
            - call: "GET /property-tax/tax-bills/${bill_id}/payoff"
              payload: { mode: "LEDGER_AS_OF" }
              as: Treasurer
              captures: { payoff_ledger: $.data.payoff_total_cents }
            - call: "GET /property-tax/tax-bills/${bill_id}/payoff"
              payload: { mode: "PAYOFF_QUOTE", as_of_date: "2026-12-15T00:00:00Z" }
              as: Treasurer
              captures: { payoff_quote: $.data.payoff_total_cents }
          assert:
            - "payoff (mode LEDGER_AS_OF).payoff_total_cents == 214000"
            - "payoff (mode LEDGER_AS_OF).interest_cents == 4000"
            - "payoff (mode PAYOFF_QUOTE, as_of 2026-12-15).payoff_total_cents == 215984"
            - "payoff (mode PAYOFF_QUOTE).interest_cents == 5984"

      - name: relief_exemption_vs_abatement_distribution
        grounds:
          - calculations.relief_credit
          - state_machines.TaxReliefApplication.UNDER_REVIEW_to_APPROVED
          - entities.TaxBill.fields.abatement_credit_cents
        distinguishing_aspect: "The identical 100000 claim as an ABATEMENT credits only the UNPAID installment 2 (200000 -> 100000) and leaves PAID installment 1 at balance 0, whereas the EXEMPTION variant reduces gross pre-issuance and shrinks both installments — divergent on the TaxReliefApplication domain."
        test_recipe:
          setup:
            - "TaxBill net 400000 (installments 200000/200000); installment 1 paid; installment 2 unpaid."
            - "An ABATEMENT relief application for 100000 approved after issuance."
          setup_api_calls:
            - call: "POST /property-tax/tax-years"
              payload: { year: 2025, millage_rate: 20.0, first_installment_due_date: "2026-06-15T00:00:00Z", second_installment_due_date: "2026-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty_id: $.data.id }
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-D2", owner_name: "Abe Abate", situs_address: "2 Main St", assessed_value_cents: 20000000, property_class: "RESIDENTIAL" }
              as: Cashier
              captures: { p_id: $.data.id }
            - call: "POST /property-tax/tax-bills"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}" }
              as: Treasurer
              captures: { bill_id: $.data.id }
            - call: "POST /property-tax/payments"
              payload: { bill_id: "${bill_id}", amount_cents: 200000, tender_type: "ACH", source: "COUNTER" }
              as: Cashier
            - call: "POST /property-tax/relief-applications"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}", relief_class: "ABATEMENT", relief_type: "HARDSHIP", claimed_amount_cents: 100000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Cashier
              captures: { app_id: $.data.id }
            - call: "POST /property-tax/relief-applications/${app_id}/review"
              payload: {}
              as: ReliefOfficer
              as_user_id: "ro-1"
          trigger:
            - call: "POST /property-tax/relief-applications/${app_id}/decide"
              payload: { decision: "APPROVE" }
              as: ReliefOfficer
              as_user_id: "ro-1"
              captures: { approved_credit: $.data.approved_credit_cents }
          assert:
            - "TaxReliefApplication.${app_id}.approved_credit_cents == 100000"
            - "Installment(sequence=2 of bill ${bill_id}).balance_cents == 100000"
            - "Installment(sequence=1 of bill ${bill_id}).balance_cents == 0"
            - "TaxBill.${bill_id}.abatement_credit_cents == 100000"
            - "TaxBill.${bill_id}.balance_cents == 100000"

  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: installment_split_remainder_to_last
        grounds:
          - calculations.installment_split
          - entities.Installment.fields.principal_due_cents
        distinguishing_aspect: "Mode (b) rounding order: net 400001 splits as floor(400001/2)=200000 for installment 1 and 200001 for the LAST installment; sum-then-round would yield a non-integer 200000.5 each — the pinned floor-then-remainder order is observable."
        test_recipe:
          setup:
            - "Parcel assessed 20000050 yields gross 400001 (odd), no exemption, net 400001."
          setup_api_calls:
            - call: "POST /property-tax/tax-years"
              payload: { year: 2025, millage_rate: 20.0, first_installment_due_date: "2026-06-15T00:00:00Z", second_installment_due_date: "2026-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty_id: $.data.id }
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-D3", owner_name: "Odd Split", situs_address: "3 Main St", assessed_value_cents: 20000050, property_class: "COMMERCIAL" }
              as: Cashier
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /property-tax/tax-bills"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}" }
              as: Treasurer
              captures: { bill_id: $.data.id }
          assert:
            - "TaxBill.${bill_id}.net_tax_cents == 400001"
            - "Installment(sequence=1 of bill ${bill_id}).principal_due_cents == 200000"
            - "Installment(sequence=2 of bill ${bill_id}).principal_due_cents == 200001"

      - name: delinquency_penalty_plus_interest_capped
        grounds:
          - calculations.delinquency_charges
          - entities.Installment.fields.interest_cents
          - state_machines.Installment.PENDING_to_DELINQUENT
        distinguishing_aspect: "Mode (a) nonlinear over principal/penalty_rate/interest_rate/months with min cap: installment 2 (principal 200000) at clock 2026-11-20 accrues penalty round(200000*0.05)=10000 plus 2 whole months interest round(200000*0.01)*2=4000, balance 214000 — distinct mode from the rounding-order instance."
        test_recipe:
          setup:
            - "TaxBill net 400000; installment 1 paid; clock advanced to 2026-11-20 so installment 2 (due 2026-09-15) is 2 whole months delinquent."
          setup_api_calls:
            - call: "POST /property-tax/tax-years"
              payload: { year: 2025, millage_rate: 20.0, first_installment_due_date: "2026-06-15T00:00:00Z", second_installment_due_date: "2026-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty_id: $.data.id }
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-D4", owner_name: "Del Inquent", situs_address: "4 Main St", assessed_value_cents: 20000000, property_class: "RESIDENTIAL" }
              as: Cashier
              captures: { p_id: $.data.id }
            - call: "POST /property-tax/tax-bills"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}" }
              as: Treasurer
              captures: { bill_id: $.data.id }
            - call: "POST /property-tax/payments"
              payload: { bill_id: "${bill_id}", amount_cents: 200000, tender_type: "CHECK", source: "COUNTER" }
              as: Cashier
          trigger:
            - call: "POST /property-tax/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-20T00:00:00Z" }
              as: Treasurer
          assert:
            - "Installment(sequence=2 of bill ${bill_id}).penalty_cents == 10000"
            - "Installment(sequence=2 of bill ${bill_id}).interest_cents == 4000"
            - "Installment(sequence=2 of bill ${bill_id}).balance_cents == 214000"
            - "Installment(sequence=2 of bill ${bill_id}).status == DELINQUENT"

  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: relief_review_info_request_cycle
        grounds:
          - state_machines.TaxReliefApplication.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.TaxReliefApplication.INFO_REQUESTED_to_UNDER_REVIEW
          - entities.TaxReliefApplication.fields.info_request_count
        distinguishing_aspect: "TaxReliefApplication loops UNDER_REVIEW <-> INFO_REQUESTED twice (info_request_count reaches 2) before terminal DENIED — a genuine cycle, not a linear pipeline."
        test_recipe:
          setup:
            - "A submitted EXEMPTION application taken through two request-info / resubmit cycles then denied."
          setup_api_calls:
            - call: "POST /property-tax/tax-years"
              payload: { year: 2025, millage_rate: 20.0, first_installment_due_date: "2026-06-15T00:00:00Z", second_installment_due_date: "2026-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty_id: $.data.id }
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-D5", owner_name: "Cy Cle", situs_address: "5 Main St", assessed_value_cents: 15000000, property_class: "RESIDENTIAL" }
              as: Cashier
              captures: { p_id: $.data.id }
            - call: "POST /property-tax/relief-applications"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}", relief_class: "EXEMPTION", relief_type: "HOMESTEAD", claimed_amount_cents: 50000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Cashier
              captures: { app_id: $.data.id }
            - call: "POST /property-tax/relief-applications/${app_id}/review"
              payload: {}
              as: ReliefOfficer
              as_user_id: "ro-1"
            - call: "POST /property-tax/relief-applications/${app_id}/request-info"
              payload: {}
              as: ReliefOfficer
              as_user_id: "ro-1"
            - call: "POST /property-tax/relief-applications/${app_id}/resubmit"
              payload: {}
              as: Cashier
            - call: "POST /property-tax/relief-applications/${app_id}/request-info"
              payload: {}
              as: ReliefOfficer
              as_user_id: "ro-1"
            - call: "POST /property-tax/relief-applications/${app_id}/resubmit"
              payload: {}
              as: Cashier
          trigger:
            - call: "POST /property-tax/relief-applications/${app_id}/decide"
              payload: { decision: "DENY" }
              as: ReliefOfficer
              as_user_id: "ro-1"
          assert:
            - "TaxReliefApplication.${app_id}.info_request_count == 2"
            - "TaxReliefApplication.${app_id}.status == DENIED"

      - name: referral_fork_to_sold
        grounds:
          - state_machines.TaxSaleReferral.REFERRED_to_SOLD
          - state_machines.TaxSaleReferral.REFERRED_to_REDEEMED
          - state_machines.TaxBill.NONE_to_IN_TAX_SALE
        distinguishing_aspect: "TaxSaleReferral forks from REFERRED into two terminal branches with divergent side effects; the SOLD branch sets sold_by_user_id and TaxBill.sale_status=SOLD (vs the REDEEMED branch) — non-linear on a different entity than the relief cycle."
        test_recipe:
          setup:
            - "Parcel assessed 5000000; TaxBill installments 50000/50000; installment 1 paid; clock 2026-09-16 makes installment 2 delinquent (principal 50000 == threshold); referral opened by co-1; clock advanced past redemption deadline."
          setup_api_calls:
            - call: "POST /property-tax/tax-years"
              payload: { year: 2025, millage_rate: 20.0, first_installment_due_date: "2026-06-15T00:00:00Z", second_installment_due_date: "2026-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty_id: $.data.id }
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-D6", owner_name: "For K", situs_address: "6 Main St", assessed_value_cents: 5000000, property_class: "AGRICULTURAL" }
              as: Cashier
              captures: { p_id: $.data.id }
            - call: "POST /property-tax/tax-bills"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}" }
              as: Treasurer
              captures: { bill_id: $.data.id }
            - call: "POST /property-tax/payments"
              payload: { bill_id: "${bill_id}", amount_cents: 50000, tender_type: "CHECK", source: "COUNTER" }
              as: Cashier
            - call: "POST /property-tax/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: CollectionsOfficer
            - call: "GET /property-tax/tax-bills/${bill_id}"
              payload: {}
              as: CollectionsOfficer
              captures: { bill_v: $.data.version }
            - call: "POST /property-tax/tax-sale-referrals"
              payload: { bill_id: "${bill_id}", expected_bill_version: "${bill_v}" }
              as: CollectionsOfficer
              as_user_id: "co-1"
              captures: { ref_id: $.data.id }
            - call: "POST /property-tax/_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-16T00:00:00Z" }
              as: Treasurer
          trigger:
            - call: "POST /property-tax/tax-sale-referrals/${ref_id}/sell"
              payload: { sale_price_cents: 70000 }
              as: Treasurer
              as_user_id: "tr-1"
          assert:
            - "TaxSaleReferral.${ref_id}.status == SOLD"
            - "TaxSaleReferral.${ref_id}.sold_by_user_id == tr-1"
            - "TaxBill.${bill_id}.sale_status == SOLD"

  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: payment_clears_bill_auto_redeems_referral
        grounds:
          - state_machines.Payment.POSTED_to_POSTED
          - state_machines.Installment.DELINQUENT_to_PAID
          - state_machines.TaxBill.DELINQUENT_to_PAID
          - state_machines.TaxSaleReferral.REFERRED_to_REDEEMED
        distinguishing_aspect: "Depth-3 cascade from a single payment: Payment -> Installment 2 DELINQUENT->PAID (link1) -> TaxBill collection DELINQUENT->PAID (link2, bubble up) -> TaxSaleReferral REFERRED->REDEEMED and sale_status REDEEMED (link3); each link caused by the previous."
        test_recipe:
          setup:
            - "Parcel assessed 5000000; installment 1 paid; clock 2026-09-16 makes installment 2 delinquent (principal 50000, penalty 2500, interest 0, balance 52500); referral opened (bill IN_TAX_SALE)."
          setup_api_calls:
            - call: "POST /property-tax/tax-years"
              payload: { year: 2025, millage_rate: 20.0, first_installment_due_date: "2026-06-15T00:00:00Z", second_installment_due_date: "2026-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty_id: $.data.id }
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-D7", owner_name: "Cas Cade", situs_address: "7 Main St", assessed_value_cents: 5000000, property_class: "RESIDENTIAL" }
              as: Cashier
              captures: { p_id: $.data.id }
            - call: "POST /property-tax/tax-bills"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}" }
              as: Treasurer
              captures: { bill_id: $.data.id }
            - call: "POST /property-tax/payments"
              payload: { bill_id: "${bill_id}", amount_cents: 50000, tender_type: "CHECK", source: "COUNTER" }
              as: Cashier
            - call: "POST /property-tax/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: CollectionsOfficer
            - call: "GET /property-tax/tax-bills/${bill_id}"
              payload: {}
              as: CollectionsOfficer
              captures: { bill_v: $.data.version }
            - call: "POST /property-tax/tax-sale-referrals"
              payload: { bill_id: "${bill_id}", expected_bill_version: "${bill_v}" }
              as: CollectionsOfficer
              as_user_id: "co-1"
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /property-tax/payments"
              payload: { bill_id: "${bill_id}", amount_cents: 52500, tender_type: "CASH", source: "COUNTER" }
              as: Cashier
          assert:
            - "Installment(sequence=2 of bill ${bill_id}).status == PAID"
            - "TaxBill.${bill_id}.collection_status == PAID"
            - "TaxBill.${bill_id}.sale_status == REDEEMED"
            - "TaxSaleReferral.${ref_id}.status == REDEEMED"

      - name: abatement_approval_marks_installment_paid
        grounds:
          - state_machines.TaxReliefApplication.UNDER_REVIEW_to_APPROVED
          - calculations.relief_credit
          - state_machines.Installment.PENDING_to_PAID
        distinguishing_aspect: "Depth-2 cascade from a relief approval (different trigger than the payment cascade): APPROVE -> ABATEMENT LedgerEntry on installment 2 (link1) -> installment 2 balance 0 -> Installment PENDING->PAID and bill collection PAID (link2)."
        test_recipe:
          setup:
            - "TaxBill net 400000; installment 1 paid (200000); installment 2 unpaid (200000); ABATEMENT application for 200000 under review."
          setup_api_calls:
            - call: "POST /property-tax/tax-years"
              payload: { year: 2025, millage_rate: 20.0, first_installment_due_date: "2026-06-15T00:00:00Z", second_installment_due_date: "2026-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty_id: $.data.id }
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-D8", owner_name: "Aba Te", situs_address: "8 Main St", assessed_value_cents: 20000000, property_class: "RESIDENTIAL" }
              as: Cashier
              captures: { p_id: $.data.id }
            - call: "POST /property-tax/tax-bills"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}" }
              as: Treasurer
              captures: { bill_id: $.data.id }
            - call: "POST /property-tax/payments"
              payload: { bill_id: "${bill_id}", amount_cents: 200000, tender_type: "CHECK", source: "COUNTER" }
              as: Cashier
            - call: "POST /property-tax/relief-applications"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}", relief_class: "ABATEMENT", relief_type: "SENIOR", claimed_amount_cents: 200000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Cashier
              captures: { app_id: $.data.id }
            - call: "POST /property-tax/relief-applications/${app_id}/review"
              payload: {}
              as: ReliefOfficer
              as_user_id: "ro-1"
          trigger:
            - call: "POST /property-tax/relief-applications/${app_id}/decide"
              payload: { decision: "APPROVE" }
              as: ReliefOfficer
              as_user_id: "ro-1"
          assert:
            - "Installment(sequence=2 of bill ${bill_id}).balance_cents == 0"
            - "Installment(sequence=2 of bill ${bill_id}).status == PAID"
            - "TaxBill.${bill_id}.collection_status == PAID"
            - "TaxBill.${bill_id}.abatement_credit_cents == 200000"

  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: not_delinquent_beats_below_threshold
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - state_machines.TaxBill.NONE_to_IN_TAX_SALE
        distinguishing_aspect: "A CURRENT bill with delinquent_principal 0 violates BOTH state (ERR_NOT_DELINQUENT, pri 11) and business_fiscal (ERR_BELOW_REFERRAL_THRESHOLD, pri 12); the state error wins — category pair state vs business_fiscal."
        test_recipe:
          setup:
            - "Fresh TaxBill, collection_status CURRENT, no delinquent installments (clock at default 2026-05-01)."
          setup_api_calls:
            - call: "POST /property-tax/tax-years"
              payload: { year: 2025, millage_rate: 20.0, first_installment_due_date: "2026-06-15T00:00:00Z", second_installment_due_date: "2026-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty_id: $.data.id }
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-D9", owner_name: "New Bill", situs_address: "9 Main St", assessed_value_cents: 5000000, property_class: "RESIDENTIAL" }
              as: Cashier
              captures: { p_id: $.data.id }
            - call: "POST /property-tax/tax-bills"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}" }
              as: Treasurer
              captures: { bill_id: $.data.id }
            - call: "GET /property-tax/tax-bills/${bill_id}"
              payload: {}
              as: CollectionsOfficer
              captures: { bill_v: $.data.version }
          trigger:
            - call: "POST /property-tax/tax-sale-referrals"
              payload: { bill_id: "${bill_id}", expected_bill_version: "${bill_v}" }
              as: CollectionsOfficer
              as_user_id: "co-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_DELINQUENT"
            - "HTTP status == 409"

      - name: sod_beats_refund_already_decided
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - state_machines.Refund.REQUESTED_to_APPROVED
        distinguishing_aspect: "The original requester (tr-1) re-deciding an already-APPROVED refund violates BOTH business_safety (ERR_SEGREGATION_OF_DUTIES, pri 4) and state (already decided, pri 6); the SoD error wins — category pair business_safety vs state, distinct from the state/fiscal pair."
        test_recipe:
          setup:
            - "Bill net 400000 overpaid by 100000; Refund for 100000 filed by tr-1 and APPROVED by tr-2 (four-eyes)."
          setup_api_calls:
            - call: "POST /property-tax/tax-years"
              payload: { year: 2025, millage_rate: 20.0, first_installment_due_date: "2026-06-15T00:00:00Z", second_installment_due_date: "2026-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty_id: $.data.id }
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-D10", owner_name: "Over Pay", situs_address: "10 Main St", assessed_value_cents: 20000000, property_class: "RESIDENTIAL" }
              as: Cashier
              captures: { p_id: $.data.id }
            - call: "POST /property-tax/tax-bills"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}" }
              as: Treasurer
              captures: { bill_id: $.data.id }
            - call: "POST /property-tax/payments"
              payload: { bill_id: "${bill_id}", amount_cents: 500000, tender_type: "ACH", source: "COUNTER" }
              as: Cashier
            - call: "GET /property-tax/tax-bills/${bill_id}"
              payload: {}
              as: Treasurer
              captures: { bill_v: $.data.version }
            - call: "POST /property-tax/refunds"
              payload: { bill_id: "${bill_id}", amount_cents: 100000, mode: "GROSS_OVERPAYMENT", expected_bill_version: "${bill_v}" }
              as: Treasurer
              as_user_id: "tr-1"
              captures: { refund_id: $.data.id }
            - call: "POST /property-tax/refunds/${refund_id}/decide"
              payload: { decision: "APPROVE" }
              as: Treasurer
