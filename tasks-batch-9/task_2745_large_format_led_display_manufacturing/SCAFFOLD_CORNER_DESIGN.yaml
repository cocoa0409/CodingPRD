      - name: stale_cabinet_version_rejects_a_warranty_fulfilment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.case-fulfil-stale-cabinet
          - endpoints[POST /service-cases/{service_case_id}/fulfil]
          - validations[priority=14]
          - errors.ERR_STALE_CABINET_VERSION
          - errors.ERR_INVALID_CASE_STATE
        distinguishing_aspect: |
          The third §1.2.1 rule puts the OCC field on an endpoint whose PATH names a
          ServiceCase while the guarded parent is the Cabinet — the id is not even in
          the request. A service manager who cached the cabinet version during
          assembly (before two installs, a burn-in pass, a QA approval and a mount)
          must be refused, and the refusal must leave the case APPROVED and the
          spare reserved so a retry can still swap the module. The retry then shows
          the ladder shifting: a THIRD attempt with a perfectly current version is
          refused at priority 23 instead, because the case has left APPROVED.
