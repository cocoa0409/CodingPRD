      - name: grant_award_crud_round_trip_with_filtering_and_pagination
        claim_type: standard_crud
        grounds: [entities.GrantAward, "endpoints.POST /homeownership/grant-awards", "endpoints.GET /homeownership/grant-awards", "endpoints.GET /homeownership/grant-awards/{id}", entities.GrantAward.fields.award_code, entities.GrantAward.fields.status]
        distinguishing_aspect: "The full read surface of the one funding aggregate: the create echoes every stored column, the by-id read returns the same row, the collection read honours program_id, status and award_code filters independently, and a limit of 2 splits three awards into a first page with has_more true and a second page with has_more false."
        setup_note: "The create sends the endpoint's declared input names donor_name and amount_cents; entities.GrantAward names the same two columns funder_name and award_amount_cents. The assertions are written on the VALUES so they hold under either spelling, which is how the PRD accepted the aliasing."
        test_recipe:
          setup:
            - "Canonical program with no grant awards yet."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
          trigger:
            - { call: "POST /homeownership/grant-awards", payload: { program_id: "${prog_id}", award_code: "FHLB-2026-Q3", donor_name: "Federal Home Loan Bank", amount_cents: 2500000, period_start: "2026-08-01T00:00:00.000Z", period_end: "2026-09-30T23:59:59.999Z", households_served_target: 3 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { g1: $.data.id } }
            - { call: "POST /homeownership/grant-awards", payload: { program_id: "${prog_id}", award_code: "CITY-2026-CDBG", donor_name: "City of Austin", amount_cents: 1800000, period_start: "2026-08-01T00:00:00.000Z", period_end: "2026-12-31T23:59:59.999Z", households_served_target: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { g2: $.data.id } }
            - { call: "POST /homeownership/grant-awards", payload: { program_id: "${prog_id}", award_code: "INKIND-2026-A", donor_name: "Cedar Lumber Co", amount_cents: 400000, period_start: "2026-08-01T00:00:00.000Z", period_end: "2026-12-31T23:59:59.999Z", households_served_target: 1, restricted_to_in_kind_reporting: true }, as: ProgramAdmin, as_user_id: "admin-1", captures: { g3: $.data.id } }
            - { call: "GET /homeownership/grant-awards/${g1}", as: MortgageOfficer, as_user_id: "officer-1" }
            - { call: "GET /homeownership/grant-awards", payload: { program_id: "${prog_id}" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "GET /homeownership/grant-awards", payload: { award_code: "CITY-2026-CDBG" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "GET /homeownership/grant-awards", payload: { program_id: "${prog_id}", status: "REPORTED" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "GET /homeownership/grant-awards", payload: { program_id: "${prog_id}", limit: 2, offset: 0 }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "GET /homeownership/grant-awards", payload: { program_id: "${prog_id}", limit: 2, offset: 2 }, as: ProgramAdmin, as_user_id: "admin-1" }
          assert:
            - "Each create: HTTP 201 with status == OPEN, the sent money value stored as integer cents (2500000, 1800000, 400000), the sent donor string stored verbatim, period_end preserved to the millisecond and restricted_to_in_kind_reporting false on the first two and true on ${g3}"
            - "By-id read of ${g1}: the same row, readable by MortgageOfficer as well as ProgramAdmin, with award_code == FHLB-2026-Q3 and households_served_target == 3"
            - "Unfiltered-by-status program list: total_count == 3, limit 10, offset 0, has_more false"
            - "award_code filter: total_count == 1 and the single element is ${g2}"
            - "status REPORTED filter: total_count == 0 with an empty data array, not a 404 — all three awards are OPEN"
            - "limit 2 offset 0: exactly 2 elements, total_count == 3, has_more true; limit 2 offset 2: exactly 1 element, total_count == 3, has_more false"

      - name: crediting_is_conditional_on_the_entry_having_been_verified
        claim_type: conditional_action
        grounds: ["validations[priority=10]", errors.ERR_TRANSITION_NOT_ALLOWED, "state_machines.SweatEquityEntry.status.VERIFIED_to_CREDITED", "endpoints.POST /homeownership/sweat-equity-entries/{id}/credit", "endpoints.POST /homeownership/sweat-equity-entries/{id}/verification"]
        distinguishing_aspect: "The credit action is only defined out of VERIFIED, so a freshly CLAIMED entry is refused with the transition error before any of the credit-time allowance rules (ages, category caps, family caps) are ever consulted — the same call succeeds unchanged the moment cm-1 verifies the row."
        test_recipe:
          setup:
            - "Canonical program with a SELECTED household (composite 91.0) whose single member is an adult APPLICANT. One 6-hour CONSTRUCTION entry dated 2026-08-01 has been claimed by fsc-1 and is still CLAIMED."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
