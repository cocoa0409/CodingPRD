scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:

      - name: create_policy_with_only_school_year_applies_every_declared_default
        claim_type: defaults
        grounds:
          - endpoints[POST /evaluation-policies]
          - entities.EvaluationPolicy.fields.observation_weight_pct
          - entities.EvaluationPolicy.fields.min_days_between_formals
          - entities.EvaluationPolicy.fields.observation_stipend_cents
        distinguishing_aspect: "Posting only school_year yields observation_weight_pct 60, growth_weight_pct 40, domain weights 22/23/33/22, required counts 2 and 1, min_days_between_formals 10 and observation_stipend_cents 12500."
        test_recipe:
          setup: ["Empty database; logical clock left at its 2026-08-01T00:00:00Z default."]
          setup_api_calls: []
          trigger:
            - call: "POST /evaluation-policies"
              payload: { school_year: "2026-2027" }
              as: HrAdmin
              captures: { pol_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "EvaluationPolicy.${pol_id}.observation_weight_pct == 60 and growth_weight_pct == 40"
            - "EvaluationPolicy.${pol_id}.planning_weight_pct == 22 and environment_weight_pct == 23"
            - "EvaluationPolicy.${pol_id}.instruction_weight_pct == 33 and professionalism_weight_pct == 22"
            - "EvaluationPolicy.${pol_id}.required_formal_count == 2 and required_informal_count == 1"
            - "EvaluationPolicy.${pol_id}.effective_threshold == 2.50 and highly_effective_threshold == 3.50"
            - "EvaluationPolicy.${pol_id}.min_days_between_formals == 10"
            - "EvaluationPolicy.${pol_id}.observation_stipend_cents == 12500"
            - "EvaluationPolicy.${pol_id}.version == 1"

      - name: create_educator_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /educators]
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting service_start_date, an input field with no default, is rejected with ERR_INVALID_REQUEST (400) and no Educator row is created."
        test_recipe:
          setup: ["One school exists."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Lincoln High", code: "LHS", level: "HIGH", evaluation_budget_allocated_cents: 100000 }
              as: HrAdmin
              captures: { sch_id: $.data.id }
          trigger:
            - call: "POST /educators"
              payload: { school_id: "${sch_id}", employee_number: "E-D101", full_name: "No Date" }
              as: HrAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "GET /educators filtered by school_id ${sch_id} returns an empty array"

      - name: get_educator_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /educators/{id}]
          - validations[priority=4]
          - errors[ERR_EDUCATOR_NOT_FOUND]
        distinguishing_aspect: "A well-formed UUID that names no Educator returns ERR_EDUCATOR_NOT_FOUND with HTTP 404, not an empty 200 body."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /educators/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: HrAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "error_id == ERR_EDUCATOR_NOT_FOUND"

      - name: list_educators_filtered_by_school_paginates_with_total_count
        claim_type: listing
        grounds:
          - endpoints[GET /educators]
          - entities.Educator.fields.school_id
          - response_envelope.pagination_fields
        distinguishing_aspect: "With two educators in school A and one in school B, GET /educators?school_id=A&limit=1&offset=0 returns exactly 1 item, total_count 2 and has_more true."
        test_recipe:
          setup: ["Two schools; two educators in the first, one in the second."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Lincoln High", code: "LHS", level: "HIGH", evaluation_budget_allocated_cents: 100000 }
              as: HrAdmin
              captures: { sch_a: $.data.id }
            - call: "POST /schools"
              payload: { name: "Grant Middle", code: "GMS", level: "MIDDLE", evaluation_budget_allocated_cents: 100000 }
              as: HrAdmin
              captures: { sch_b: $.data.id }
            - call: "POST /educators"
              payload: { school_id: "${sch_a}", employee_number: "E-D201", full_name: "Ann One", service_start_date: "2024-08-15" }
              as: HrAdmin
              captures: { edu1: $.data.id }
            - call: "POST /educators"
              payload: { school_id: "${sch_a}", employee_number: "E-D202", full_name: "Ben Two", service_start_date: "2024-08-15" }
              as: HrAdmin
              captures: { edu2: $.data.id }
            - call: "POST /educators"
              payload: { school_id: "${sch_b}", employee_number: "E-D203", full_name: "Cy Three", service_start_date: "2024-08-15" }
              as: HrAdmin
              captures: { edu3: $.data.id }
          trigger:
            - call: "GET /educators"
              payload: { school_id: "${sch_a}", limit: 1, offset: 0 }
              as: HrAdmin
          assert:
            - "HTTP status is 200 and response_type == array"
            - "the data array has length 1"
            - "meta/pagination total_count == 2"
            - "has_more == true"
            - "limit == 1 and offset == 0"
            - "Educator.${edu3} is absent from the results"

      - name: create_school_computes_remaining_budget_from_allocation
        claim_type: computed_fields
        grounds:
          - endpoints[POST /schools]
          - entities.School.fields.evaluation_budget_committed_cents
          - entities.School.fields.evaluation_budget_remaining_cents
          - calculations.school_evaluation_budget
        distinguishing_aspect: "A newly created school reports evaluation_budget_committed_cents 0 and evaluation_budget_remaining_cents equal to its allocation, both computed rather than accepted from the request."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /schools"
              payload: { name: "Lincoln High", code: "LHS", level: "HIGH", evaluation_budget_allocated_cents: 75000 }
              as: HrAdmin
              captures: { sch_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "School.${sch_id}.evaluation_budget_allocated_cents == 75000"
            - "School.${sch_id}.evaluation_budget_committed_cents == 0"
            - "School.${sch_id}.evaluation_budget_remaining_cents == 75000"

      - name: educator_system_fields_are_server_minted_on_create
        claim_type: system_fields
        grounds:
          - endpoints[POST /educators]
          - entities.Educator.fields.tenure_status
          - entities.Educator.fields.consecutive_effective_years
          - entities.Educator.fields.tenure_track_hold
        distinguishing_aspect: "A new Educator carries a server-minted UUID id with no type prefix, version 1, tenure_status PROBATIONARY, consecutive_effective_years 0, tenure_track_hold false and last_composite_rating null."
        test_recipe:
          setup: ["One school exists."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Lincoln High", code: "LHS", level: "HIGH", evaluation_budget_allocated_cents: 100000 }
              as: HrAdmin
              captures: { sch_id: $.data.id }
          trigger:
            - call: "POST /educators"
              payload: { school_id: "${sch_id}", employee_number: "E-D301", full_name: "Fresh Hire", service_start_date: "2026-07-01" }
              as: HrAdmin
              captures: { edu_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Educator.${edu_id}.id is a bare UUID with no prefix"
            - "Educator.${edu_id}.version == 1"
            - "Educator.${edu_id}.tenure_status == PROBATIONARY"
            - "Educator.${edu_id}.consecutive_effective_years == 0"
            - "Educator.${edu_id}.tenure_track_hold == false"
            - "Educator.${edu_id}.last_composite_rating == null"
            - "Educator.${edu_id}.completed_service_years == 0"
            - "Educator.${edu_id}.created_at is an ISO 8601 UTC timestamp with three fractional digits"

      - name: rubric_score_above_scale_maximum_is_rejected_as_invalid_request
        claim_type: type_constraints
        grounds:
          - endpoints[POST /observations/{id}/rubric-scores]
          - entities.RubricScore.fields.raw_score
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "raw_score 5 is outside the declared 1..4 integer scale and is rejected with ERR_INVALID_REQUEST (400) before the OCC and state checks run, leaving scored_domain_count at 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; policy at defaults."
            - "One certified evaluator, one educator, one cycle, one CONDUCTED observation with no rubric scores."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HrAdmin
            - call: "POST /evaluation-policies"
              payload: { school_year: "2026-2027" }
              as: HrAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /schools"
              payload: { name: "Lincoln High", code: "LHS", level: "HIGH", evaluation_budget_allocated_cents: 100000 }
              as: HrAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /educators"
              payload: { school_id: "${sch_id}", employee_number: "E-D401", full_name: "Gus Vale", service_start_date: "2024-08-15" }
              as: HrAdmin
              captures: { edu_id: $.data.id }
            - call: "POST /evaluators"
              payload: { full_name: "Pat Ortiz" }
              as: HrAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /calibration-reviews"
              payload: { evaluator_id: "${ev_id}", anchor_lesson_code: "ANCH-1", anchor_score: 3.00, evaluator_score: 3.10 }
              as: HrAdmin
              captures: { cal1_id: $.data.id }
            - call: "POST /calibration-reviews/${cal1_id}/decide"
              payload: { policy_id: "${pol_id}" }
              as: HrAdmin
            - call: "POST /evaluation-cycles"
              payload: { educator_id: "${edu_id}", policy_id: "${pol_id}", school_year: "2026-2027", cycle_type: "FOCUSED" }
              as: HrAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /observations"
              payload: { cycle_id: "${cyc_id}", evaluator_id: "${ev_id}", observation_type: "FORMAL", scheduled_start: "2026-09-10T09:00:00Z", scheduled_end: "2026-09-10T10:00:00Z", announced: true }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { obs1_id: $.data.id }
            - call: "POST /observations/${obs1_id}/conduct"
              payload: {}
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { o1v0: $.data.version }
          trigger:
            - call: "POST /observations/${obs1_id}/rubric-scores"
              payload: { domain_code: "PLANNING", raw_score: 5, expected_observation_version: "${o1v0}" }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "Observation.${obs1_id}.scored_domain_count == 0"
            - "Observation.${obs1_id}.status == CONDUCTED"
            - "EvaluationCycle.${cyc_id}.cycle_type == FOCUSED"

      - name: create_educator_with_unknown_school_id_returns_not_found
        claim_type: parent_relationships
        grounds:
          - endpoints[POST /educators]
          - entities.Educator.fields.school_id
          - validations[priority=4]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "Flat-topology FK integrity: a school_id naming no School is rejected with ERR_RESOURCE_NOT_FOUND (404) and no Educator is persisted."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /educators"
              payload: { school_id: "00000000-0000-4000-8000-000000000000", employee_number: "E-D501", full_name: "Orphan Ed", service_start_date: "2024-08-15" }
              as: HrAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "error_id == ERR_RESOURCE_NOT_FOUND"

      - name: create_cycle_starts_in_scheduling_with_null_composite_fields
        claim_type: creation
        grounds:
          - endpoints[POST /evaluation-cycles]
          - state_machines.EvaluationCycle.initial_state
          - entities.EvaluationCycle.fields.dispute_state
        distinguishing_aspect: "A new EvaluationCycle starts at status SCHEDULING and dispute_state NONE with every composite field null, both counters 0 and evidence_artifact_count 0."
        test_recipe:
          setup: ["One policy, one school and one educator exist."]
          setup_api_calls:
            - call: "POST /evaluation-policies"
              payload: { school_year: "2026-2027" }
              as: HrAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /schools"
              payload: { name: "Lincoln High", code: "LHS", level: "HIGH", evaluation_budget_allocated_cents: 100000 }
              as: HrAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /educators"
              payload: { school_id: "${sch_id}", employee_number: "E-D601", full_name: "Hal Reyes", service_start_date: "2024-08-15" }
              as: HrAdmin
              captures: { edu_id: $.data.id }
          trigger:
            - call: "POST /evaluation-cycles"
              payload: { educator_id: "${edu_id}", policy_id: "${pol_id}", school_year: "2026-2027" }
              as: HrAdmin
              captures: { cyc_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "EvaluationCycle.${cyc_id}.status == SCHEDULING"
            - "EvaluationCycle.${cyc_id}.dispute_state == NONE"
            - "EvaluationCycle.${cyc_id}.cycle_type == COMPREHENSIVE"
            - "EvaluationCycle.${cyc_id}.composite_score == null and composite_rating == null and composite_variant == null"
            - "EvaluationCycle.${cyc_id}.observation_component == null and growth_component == null"
            - "EvaluationCycle.${cyc_id}.completed_formal_count == 0 and completed_informal_count == 0"
            - "EvaluationCycle.${cyc_id}.evidence_artifact_count == 0 and evidence_adjustment == 0"
            - "EvaluationCycle.${cyc_id}.finalized_at == null and appeal_deadline == null"

  # =========================================================================
  - section: state_machines
    instances:

      - name: finalize_from_scheduling_returns_cycle_state_invalid
        claim_type: invalid_transitions
        grounds:
          - endpoints[POST /evaluation-cycles/{id}/finalize]
          - state_machines.EvaluationCycle.SUBMITTED_to_FINALIZED
          - validations[priority=8]
          - errors[ERR_CYCLE_STATE_INVALID]
        distinguishing_aspect: "FINALIZED is reachable only from SUBMITTED; finalizing a cycle still in SCHEDULING returns ERR_CYCLE_STATE_INVALID (409) and leaves every composite field null."
        test_recipe:
          setup: ["One policy, school, educator and a brand-new cycle in SCHEDULING."]
          setup_api_calls:
            - call: "POST /evaluation-policies"
              payload: { school_year: "2026-2027" }
              as: HrAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /schools"
              payload: { name: "Lincoln High", code: "LHS", level: "HIGH", evaluation_budget_allocated_cents: 100000 }
              as: HrAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /educators"
              payload: { school_id: "${sch_id}", employee_number: "E-E101", full_name: "Iris Wu", service_start_date: "2024-08-15" }
              as: HrAdmin
              captures: { edu_id: $.data.id }
            - call: "POST /evaluation-cycles"
              payload: { educator_id: "${edu_id}", policy_id: "${pol_id}", school_year: "2026-2027" }
              as: HrAdmin
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /evaluation-cycles/${cyc_id}/finalize"
              payload: {}
              as: HrAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "error_id == ERR_CYCLE_STATE_INVALID"
            - "EvaluationCycle.${cyc_id}.status == SCHEDULING"
            - "EvaluationCycle.${cyc_id}.composite_score == null and finalized_at == null"

      - name: conduct_twice_returns_observation_state_invalid
        claim_type: idempotency
        grounds:
          - endpoints[POST /observations/{id}/conduct]
          - state_machines.Observation.SCHEDULED_to_CONDUCTED
          - errors[ERR_OBSERVATION_STATE_INVALID]
        distinguishing_aspect: "Re-issuing conduct on an already CONDUCTED observation is rejected with ERR_OBSERVATION_STATE_INVALID (409); the cycle stays SCORING and no second SCHEDULING to SCORING bubble-up fires."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one certified evaluator, one educator, one cycle."
            - "One FORMAL observation already CONDUCTED, so the cycle has bubbled to SCORING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HrAdmin
            - call: "POST /evaluation-policies"
              payload: { school_year: "2026-2027" }
              as: HrAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /schools"
              payload: { name: "Lincoln High", code: "LHS", level: "HIGH", evaluation_budget_allocated_cents: 100000 }
              as: HrAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /educators"
              payload: { school_id: "${sch_id}", employee_number: "E-E201", full_name: "Jae Kim", service_start_date: "2024-08-15" }
              as: HrAdmin
              captures: { edu_id: $.data.id }
            - call: "POST /evaluators"
              payload: { full_name: "Pat Ortiz" }
              as: HrAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /calibration-reviews"
              payload: { evaluator_id: "${ev_id}", anchor_lesson_code: "ANCH-1", anchor_score: 3.00, evaluator_score: 3.10 }
              as: HrAdmin
              captures: { cal1_id: $.data.id }
            - call: "POST /calibration-reviews/${cal1_id}/decide"
              payload: { policy_id: "${pol_id}" }
              as: HrAdmin
            - call: "POST /evaluation-cycles"
              payload: { educator_id: "${edu_id}", policy_id: "${pol_id}", school_year: "2026-2027" }
              as: HrAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /observations"
              payload: { cycle_id: "${cyc_id}", evaluator_id: "${ev_id}", observation_type: "FORMAL", scheduled_start: "2026-09-10T09:00:00Z", scheduled_end: "2026-09-10T10:00:00Z", announced: true }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { obs1_id: $.data.id }
            - call: "POST /observations/${obs1_id}/conduct"
              payload: {}
              as: Evaluator
              as_user_id: "${ev_id}"
          trigger:
            - call: "POST /observations/${obs1_id}/conduct"
              payload: {}
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "error_id == ERR_OBSERVATION_STATE_INVALID"
            - "Observation.${obs1_id}.status == CONDUCTED"
            - "EvaluationCycle.${cyc_id}.status == SCORING"

      - name: accept_from_scheduled_returns_observation_state_invalid
        claim_type: invalid_transitions
        grounds:
          - endpoints[POST /observations/{id}/accept]
          - state_machines.Observation.SUBMITTED_to_ACCEPTED
          - errors[ERR_OBSERVATION_STATE_INVALID]
        distinguishing_aspect: "ACCEPTED is reachable only from SUBMITTED; accepting a SCHEDULED observation returns ERR_OBSERVATION_STATE_INVALID (409) and commits no stipend."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one certified evaluator, one cycle, one SCHEDULED FORMAL observation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HrAdmin
            - call: "POST /evaluation-policies"
              payload: { school_year: "2026-2027" }
              as: HrAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /schools"
              payload: { name: "Lincoln High", code: "LHS", level: "HIGH", evaluation_budget_allocated_cents: 100000 }
              as: HrAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /educators"
              payload: { school_id: "${sch_id}", employee_number: "E-E301", full_name: "Kit Adams", service_start_date: "2024-08-15" }
              as: HrAdmin
              captures: { edu_id: $.data.id }
            - call: "POST /evaluators"
              payload: { full_name: "Pat Ortiz" }
              as: HrAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /calibration-reviews"
              payload: { evaluator_id: "${ev_id}", anchor_lesson_code: "ANCH-1", anchor_score: 3.00, evaluator_score: 3.10 }
              as: HrAdmin
              captures: { cal1_id: $.data.id }
            - call: "POST /calibration-reviews/${cal1_id}/decide"
              payload: { policy_id: "${pol_id}" }
              as: HrAdmin
            - call: "POST /evaluation-cycles"
              payload: { educator_id: "${edu_id}", policy_id: "${pol_id}", school_year: "2026-2027" }
              as: HrAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /observations"
              payload: { cycle_id: "${cyc_id}", evaluator_id: "${ev_id}", observation_type: "FORMAL", scheduled_start: "2026-09-10T09:00:00Z", scheduled_end: "2026-09-10T10:00:00Z", announced: true }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { obs1_id: $.data.id }
          trigger:
            - call: "POST /observations/${obs1_id}/accept"
              payload: {}
              as: HrAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "error_id == ERR_OBSERVATION_STATE_INVALID"
            - "Observation.${obs1_id}.status == SCHEDULED and stipend_cents == 0"
            - "School.${sch_id}.evaluation_budget_committed_cents == 0"

      - name: cycle_submit_with_a_scheduled_observation_returns_observations_pending
        claim_type: precondition_enforcement
        grounds:
          - endpoints[POST /evaluation-cycles/{id}/submit]
          - state_machines.EvaluationCycle.SCORING_to_SUBMITTED
          - validations[priority=19]
          - errors[ERR_CYCLE_OBSERVATIONS_PENDING]
        distinguishing_aspect: "A cycle in SCORING that still holds an observation in SCHEDULED cannot be submitted; the call returns ERR_CYCLE_OBSERVATIONS_PENDING (422) and no composite is computed."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one certified evaluator, one educator, one cycle."
            - "One FORMAL observation CONDUCTED (bubbling the cycle to SCORING) and one INFORMAL observation still SCHEDULED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HrAdmin
            - call: "POST /evaluation-policies"
              payload: { school_year: "2026-2027" }
              as: HrAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /schools"
              payload: { name: "Lincoln High", code: "LHS", level: "HIGH", evaluation_budget_allocated_cents: 100000 }
              as: HrAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /educators"
