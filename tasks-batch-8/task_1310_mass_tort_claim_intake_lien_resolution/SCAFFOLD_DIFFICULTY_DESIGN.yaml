              as: ProgramAdministrator
            - call: "POST /settlement-programs/${pid}/claims/${cid}/liens"
              payload: { lien_type: "PRIVATE_INSURER", holder_name: "InsCo A", asserted_amount_cents: 101 }
              as: LienAnalyst
              captures: { lid1: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/liens"
