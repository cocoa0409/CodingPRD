            - "hop 2 (bucket -> allocations): sweep released B's 40 then A's 60 (youngest-first until reserved <= standing); GET /api/allocations?order_id=${oa} [0].status == RELEASED and same for ${ob}"
            - "hop 3 (allocations -> orders): WholesaleOrder.${oa}.status == SUBMITTED with allocated_qty == 0; WholesaleOrder.${ob}.status == SUBMITTED"
            - "StandBucket H_6_7 reserved_count == 0 (0 <= 50, sweep stopped after whole-allocation releases)"

      - name: runops_backfill_allocation_cascade
        grounds:
          - calculations.run_ops_sweeps
          - calculations.allocation_waterfall
          - state_machines.WholesaleOrder.SUBMITTED_to_ALLOCATED
        distinguishing_aspect: |
          Depth-3 chain from the run-ops trigger: the checkpoint creates an
          allocation for the waitlisted order, that creation recomputes
          allocated_qty, and the recompute flips the order SUBMITTED -> ALLOCATED.
          Different trigger (run-ops) than the survey-post cascade.
