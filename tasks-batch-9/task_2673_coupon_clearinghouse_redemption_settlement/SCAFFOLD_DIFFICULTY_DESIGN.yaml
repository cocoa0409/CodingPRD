      - name: clip_concurrency_aggregate_limit_and_slot_release
        grounds:
          - validations[priority=19]
          - errors.ERR_CLIP_CONCURRENCY_LIMIT
          - calculations.clip_expiry
          - state_machines.DigitalClip.CLIPPED_to_EXPIRED_UNUSED
        distinguishing_aspect: |
          Aggregate capacity, not pairwise conflict: each individual clip of the
          same (offer_id, consumer_ref) is perfectly valid, and only the COUNT of
          live ones is refused once it would reach CLIP_CONCURRENCY_LIMIT (2). The
          slots are also temporal — advancing the clock past one clip's
          clip_expires_at moves it CLIPPED -> EXPIRED_UNUSED in the sweep and frees
          exactly one slot, so the same third clip that was refused becomes legal
          with no other state change, and a fourth is refused again. Staggering the
          two clips by four days makes the sweep release exactly one, not both.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z default"
            - "digital offer: digital_enabled true, clip_validity_days 14, expiration_date 2026-12-31, redemption_grace_days 30, so clip_expiry is always the validity date rather than the offer-last date"
            - "one consumer_ref consumer-771 on that offer"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000", handling_fee_policy: "CONTRACT_RATE", dispute_window_days: 45 }
              as: ClearinghouseAdmin
