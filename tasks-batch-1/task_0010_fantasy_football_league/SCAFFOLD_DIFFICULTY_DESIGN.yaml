              payload: { name: "Ovl L", draft_type: "SNAKE", roster_size: 2, starter_slot_count: 1, ir_slot_count: 0, faab_budget_cents: 5000, veto_threshold: 1, keeper_limit: 0, playoff_team_count: 2, tiebreak_rule: "STANDARD" }
