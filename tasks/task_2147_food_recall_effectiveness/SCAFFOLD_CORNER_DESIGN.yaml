# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk of references/claim-extraction-guide.md against §1.1-§1.7.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: firm_creation_applies_policy_defaults_and_zero_counters
        claim_type: defaults
        grounds: ["entities.Firm.fields.policy_deductible_cents", "entities.Firm.fields.policy_aggregate_cents", "entities.Firm.fields.policy_paid_to_date_cents", "entities.Firm.fields.open_recall_count"]
        distinguishing_aspect: "POST /firms with only name and registration_number returns 201 with policy_deductible_cents 2500000, policy_aggregate_cents 100000000, policy_paid_to_date_cents 0, open_recall_count 0 and version 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /firms"
              payload: { name: "Northvale Foods", registration_number: "FFR-10021" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { firm_id: $.data.id, ded: $.data.policy_deductible_cents, agg: $.data.policy_aggregate_cents }
          assert:
            - "HTTP status == 201"
            - "${ded} == 2500000"
            - "${agg} == 100000000"
            - "Firm.${firm_id}.policy_paid_to_date_cents == 0 and Firm.${firm_id}.open_recall_count == 0"
            - "Firm.${firm_id}.version == 1 and Firm.${firm_id}.id is a UUID without any type prefix"

      - name: recall_creation_starts_draft_and_increments_firm_open_recall_count
        claim_type: creation
        grounds: ["entities.Recall.fields.status", "entities.Firm.fields.open_recall_count", "state_machines.Recall.initial_state"]
        distinguishing_aspect: "A newly created Recall has status DRAFT, hazard_class null, all unit and cost ledgers 0, and the owning Firm's open_recall_count becomes 1."
        test_recipe:
          setup: ["One Firm with open_recall_count 0."]
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "Northvale Foods", registration_number: "FFR-10021" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { firm_id: $.data.id }
          trigger:
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Frozen spinach 1kg", agency: "FDA", initiation_type: "FIRM_INITIATED", lot_codes: ["L-88A"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { r_id: $.data.id, st: $.data.status }
          assert:
            - "HTTP status == 201"
            - "${st} == DRAFT"
            - "Recall.${r_id}.hazard_class == null and Recall.${r_id}.effectiveness_check_level == null"
            - "Recall.${r_id}.total_shipped_units == 0 and Recall.${r_id}.accounted_units == 0 and Recall.${r_id}.total_loaded_cost_cents == 0"
            - "Recall.${r_id}.compliance_flag == COMPLIANT and Recall.${r_id}.version == 1"
            - "Firm.${firm_id}.open_recall_count == 1"

      - name: recall_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds: ["endpoints.GET./recalls", "entities.Recall.fields.firm_id"]
        distinguishing_aspect: "With three recalls for one firm, GET /recalls?firm_id=...&limit=2&offset=0 returns exactly 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false."
        test_recipe:
          setup: ["One Firm owning exactly three Recall rows."]
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "Northvale Foods", registration_number: "FFR-10021" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { firm_id: $.data.id }
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Spinach A", agency: "FDA", initiation_type: "FIRM_INITIATED", lot_codes: ["L-1"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Spinach B", agency: "FDA", initiation_type: "FIRM_INITIATED", lot_codes: ["L-2"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Spinach C", agency: "USDA", initiation_type: "MANDATED", lot_codes: ["L-3"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
          trigger:
            - call: "GET /recalls?firm_id=${firm_id}&limit=2&offset=0"
              as: RecallCoordinator
              as_user_id: "coord-1"
            - call: "GET /recalls?firm_id=${firm_id}&limit=2&offset=2"
              as: RecallCoordinator
              as_user_id: "coord-1"
          assert:
            - "First call: response_type == array, len(data) == 2, meta pagination total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second call: len(data) == 1, total_count == 3, has_more == false"
            - "GET /recalls?firm_id=${firm_id}&agency filter absent returns all 3 rows with total_count == 3"

      - name: get_recall_with_unknown_uuid_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_RECALL_NOT_FOUND]"]
        distinguishing_aspect: "GET /recalls/{unknown uuid} returns HTTP 404 with error_id ERR_RECALL_NOT_FOUND and no data payload beyond the error envelope."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /recalls/00000000-0000-4000-8000-000000000000"
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_RECALL_NOT_FOUND"
            - "response_type == error"

      - name: create_recall_missing_required_agency_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=8]", "errors[ERR_INVALID_REQUEST]", "entities.Recall.fields.agency"]
        distinguishing_aspect: "Omitting the required agency field on POST /recalls returns HTTP 400 ERR_INVALID_REQUEST and creates no Recall row."
        test_recipe:
          setup: ["One Firm."]
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "Northvale Foods", registration_number: "FFR-10021" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { firm_id: $.data.id }
          trigger:
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Frozen spinach 1kg", initiation_type: "FIRM_INITIATED", lot_codes: ["L-88A"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /recalls?firm_id=${firm_id} returns an empty array with total_count == 0"
            - "Firm.${firm_id}.open_recall_count == 0"

      - name: consignee_tier_is_computed_from_the_parent_chain_and_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Consignee.fields.tier", "entities.Consignee.fields.parent_consignee_id", "calculations.effectiveness_sample_scope"]
        distinguishing_aspect: "tier is server-derived: a consignee with no parent is tier 1, its child is tier 2 and the grandchild is tier 3; tier is never accepted from the request body."
        test_recipe:
          setup: ["One Firm and one FDA Recall in DRAFT."]
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "Northvale Foods", registration_number: "FFR-10021" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { firm_id: $.data.id }
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Frozen spinach 1kg", agency: "FDA", initiation_type: "FIRM_INITIATED", lot_codes: ["L-88A"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /recalls/${r_id}/consignees"
              payload: { name: "Metro Distributors", consignee_type: "DISTRIBUTOR" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { c1_id: $.data.id, t1: $.data.tier }
            - call: "POST /recalls/${r_id}/consignees"
              payload: { name: "Harbor Grocery", consignee_type: "RETAILER", parent_consignee_id: "${c1_id}" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { c2_id: $.data.id, t2: $.data.tier }
            - call: "POST /recalls/${r_id}/consignees"
              payload: { name: "Pier Cafe", consignee_type: "RESTAURANT", parent_consignee_id: "${c2_id}" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { c3_id: $.data.id, t3: $.data.tier }
          assert:
            - "${t1} == 1 and ${t2} == 2 and ${t3} == 3"
            - "Consignee.${c1_id}.parent_consignee_id == null"
            - "GET /consignees/${c1_id}/sub-consignees -> exactly one row, id == ${c2_id}"
            - "GET /consignees/${c2_id}/sub-consignees -> exactly one row, id == ${c3_id}"
            - "GET /consignees/${c3_id}/sub-consignees -> empty array with total_count == 0"

      - name: consignee_beyond_tier_three_rejected_with_tier_limit
        claim_type: type_constraints
        grounds: ["validations[priority=29]", "errors[ERR_CONSIGNEE_TIER_LIMIT]", "calculations.effectiveness_sample_scope"]
        distinguishing_aspect: "Adding a fourth generation under a tier-3 consignee would compute tier 4 and is rejected with HTTP 422 ERR_CONSIGNEE_TIER_LIMIT; no Consignee row is created."
        test_recipe:
          setup: ["FDA Recall in DRAFT with a three-deep consignee chain (tiers 1, 2, 3)."]
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "Northvale Foods", registration_number: "FFR-10021" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { firm_id: $.data.id }
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Frozen spinach 1kg", agency: "FDA", initiation_type: "FIRM_INITIATED", lot_codes: ["L-88A"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { r_id: $.data.id }
            - call: "POST /recalls/${r_id}/consignees"
              payload: { name: "Metro Distributors", consignee_type: "DISTRIBUTOR" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /recalls/${r_id}/consignees"
              payload: { name: "Harbor Grocery", consignee_type: "RETAILER", parent_consignee_id: "${c1_id}" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /recalls/${r_id}/consignees"
              payload: { name: "Pier Cafe", consignee_type: "RESTAURANT", parent_consignee_id: "${c2_id}" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { c3_id: $.data.id }
          trigger:
            - call: "POST /recalls/${r_id}/consignees"
              payload: { name: "Pier Cafe Annex", consignee_type: "INSTITUTION", parent_consignee_id: "${c3_id}" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err} == ERR_CONSIGNEE_TIER_LIMIT"
            - "GET /recalls/${r_id}/consignees -> total_count == 3"
            - "GET /consignees/${c3_id}/sub-consignees -> empty array with total_count == 0"

      - name: distribution_record_with_zero_quantity_shipped_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=8]", "entities.DistributionRecord.fields.quantity_shipped", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "quantity_shipped must be strictly positive: a value of 0 returns HTTP 400 ERR_INVALID_REQUEST and Recall.total_shipped_units stays 0."
        test_recipe:
          setup: ["FDA Recall in DRAFT with one tier-1 consignee."]
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "Northvale Foods", registration_number: "FFR-10021" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { firm_id: $.data.id }
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Frozen spinach 1kg", agency: "FDA", initiation_type: "FIRM_INITIATED", lot_codes: ["L-88A"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { r_id: $.data.id }
            - call: "POST /recalls/${r_id}/consignees"
              payload: { name: "Metro Distributors", consignee_type: "DISTRIBUTOR" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /recalls/${r_id}/distribution-records"
              payload: { consignee_id: "${c1_id}", lot_code: "L-88A", quantity_shipped: 0, ship_date: "2026-08-20T00:00:00Z" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /consignees/${c1_id}/distribution-records -> empty array with total_count == 0"
            - "Recall.${r_id}.total_shipped_units == 0"

      - name: consignee_from_another_recall_cannot_be_used_as_parent_returns_not_found
        claim_type: parent_relationships
        grounds: ["validations[priority=5]", "errors[ERR_CONSIGNEE_NOT_FOUND]", "entities.Consignee.fields.parent_consignee_id"]
        distinguishing_aspect: "parent_consignee_id must resolve to a consignee of the SAME recall; a consignee id belonging to a different recall returns HTTP 404 ERR_CONSIGNEE_NOT_FOUND."
        test_recipe:
          setup: ["One Firm owning two FDA Recalls; recall A has one consignee, recall B has none."]
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "Northvale Foods", registration_number: "FFR-10021" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { firm_id: $.data.id }
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Spinach A", agency: "FDA", initiation_type: "FIRM_INITIATED", lot_codes: ["L-1"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { rA_id: $.data.id }
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Spinach B", agency: "FDA", initiation_type: "FIRM_INITIATED", lot_codes: ["L-2"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { rB_id: $.data.id }
            - call: "POST /recalls/${rA_id}/consignees"
              payload: { name: "Metro Distributors", consignee_type: "DISTRIBUTOR" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { cA_id: $.data.id }
          trigger:
            - call: "POST /recalls/${rB_id}/consignees"
              payload: { name: "Cross-linked child", consignee_type: "RETAILER", parent_consignee_id: "${cA_id}" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_CONSIGNEE_NOT_FOUND"
            - "GET /recalls/${rB_id}/consignees -> empty array with total_count == 0"

      - name: hazard_evaluation_system_fields_are_server_minted_input_ignored
        claim_type: system_fields
        grounds: ["entities.HazardEvaluation.fields.status", "entities.HazardEvaluation.fields.variant", "entities.HazardEvaluation.fields.hazard_score", "entities.HazardEvaluation.fields.recall_id"]
        distinguishing_aspect: "recall_id, status, variant, hazard_score, recommended_class and return_count are server-controlled: the create response carries status DRAFT, variant PRELIMINARY, hazard_score 87.40 and return_count 0, and recall_id equals the path recall regardless of anything in the body."
        test_recipe:
          setup: ["One Firm and one FDA Recall in DRAFT."]
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "Northvale Foods", registration_number: "FFR-10021" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { firm_id: $.data.id }
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Frozen spinach 1kg", agency: "FDA", initiation_type: "FIRM_INITIATED", lot_codes: ["L-88A"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { r_id: $.data.id, r_v1: $.data.version }
          trigger:
            - call: "POST /recalls/${r_id}/hazard-evaluations"
              payload: { probability_of_adverse_health: "HIGH", severity_tier: 4, exposure_population: 60000, vulnerable_population: true, evidence_strength: "CONFIRMED", expected_recall_version: "${r_v1}" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { he_id: $.data.id, st: $.data.status, var: $.data.variant, score: $.data.hazard_score, rid: $.data.recall_id }
          assert:
            - "HTTP status == 201"
            - "${st} == DRAFT and ${var} == PRELIMINARY"
            - "${score} == 87.40"
            - "${rid} == ${r_id}"
            - "HazardEvaluation.${he_id}.return_count == 0 and HazardEvaluation.${he_id}.ratified_by_user_id == null"
            - "Recall.${r_id}.version == 2 (the create bumped the parent version per the OCC contract)"

  - section: state_machines
    instances:
      - name: terminate_recall_closes_open_reports_and_decrements_open_recall_count
        claim_type: cascade_down
        grounds: ["state_machines.Recall.TERMINATION_REQUESTED_to_TERMINATED", "entities.Recall.fields.terminated_at", "entities.Firm.fields.open_recall_count", "entities.StatusReport.fields.status"]
        distinguishing_aspect: "TERMINATE moves the recall to TERMINATED, stamps terminated_at with the logical clock, drives every PENDING or OVERDUE StatusReport of the recall to ACCEPTED, and drops Firm.open_recall_count from 1 to 0."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z."
            - "USDA Recall in TERMINATION_REQUESTED with official_effectiveness_pct 96.00, one VERIFIED disposition order for 960 units and two PENDING StatusReport rows (PERIODIC period_index 1 and FINAL_EFFECTIVENESS period_index 2)."
            - "The recall was classified by coordinator coord-1; the deciding coordinator is coord-2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RecallCoordinator
              as_user_id: "coord-1"
            - call: "POST /firms"
              payload: { name: "Northvale Foods", registration_number: "FFR-10021" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { firm_id: $.data.id }
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Ground beef 5lb", agency: "USDA", initiation_type: "FIRM_INITIATED", lot_codes: ["L-42B"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { r_id: $.data.id, r_v1: $.data.version }
            - call: "POST /recalls/${r_id}/hazard-evaluations"
              payload: { probability_of_adverse_health: "HIGH", severity_tier: 4, exposure_population: 60000, vulnerable_population: true, evidence_strength: "CONFIRMED", expected_recall_version: "${r_v1}" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { he_id: $.data.id }
            - call: "POST /hazard-evaluations/${he_id}/submit"
              payload: {}
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "POST /hazard-evaluations/${he_id}/decide"
              payload: { decision: "RATIFY" }
              as: HealthHazardPanel
              as_user_id: "panel-1"
            - call: "POST /recalls/${r_id}/classify"
              payload: { hazard_class: "CLASS_I" }
              as: RecallCoordinator
              as_user_id: "coord-1"
            - call: "POST /recalls/${r_id}/consignees"
              payload: { name: "Metro Distributors", consignee_type: "DISTRIBUTOR" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { c1_id: $.data.id, c1_v1: $.data.version }
            - call: "POST /recalls/${r_id}/distribution-records"
              payload: { consignee_id: "${c1_id}", lot_code: "L-42B", quantity_shipped: 1000, ship_date: "2026-08-20T00:00:00Z" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /distribution-records/${d1_id}/reconcile"
              payload: { outcome: "CONFIRM" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "POST /recalls/${r_id}/notifications"
              payload: { consignee_id: "${c1_id}", method: "EMAIL", expected_consignee_version: "${c1_v1}" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { n1_id: $.data.id }
            - call: "POST /notifications/${n1_id}/delivery"
              payload: { outcome: "DELIVERED" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "POST /notifications/${n1_id}/response"
              payload: { outcome: "ACKNOWLEDGED" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "POST /recalls/${r_id}/retrieval-receipts"
              payload: { consignee_id: "${c1_id}", quantity_returned: 960, quantity_destroyed_onsite: 0, quantity_held_segregated: 0, quantity_unrecoverable: 40 }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { rr1_id: $.data.id }
            - call: "POST /retrieval-receipts/${rr1_id}/verify"
              payload: { decision: "VERIFY" }
              as: FieldInvestigator
              as_user_id: "inv-1"
            - call: "POST /recalls/${r_id}/disposition-orders"
              payload: { method: "DESTROY", quantity: 960, facility_name: "Ridgeline Incineration" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { do1_id: $.data.id }
            - call: "POST /disposition-orders/${do1_id}/authorize"
              payload: {}
              as: RecallCoordinator
              as_user_id: "coord-1"
            - call: "POST /disposition-orders/${do1_id}/execute"
              payload: { certificate_reference: "COD-77120" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "POST /disposition-orders/${do1_id}/verify"
              payload: { decision: "VERIFY" }
              as: FieldInvestigator
              as_user_id: "inv-1"
            - call: "POST /recalls/${r_id}/request-termination"
              payload: { root_cause_code: "SUPPLIER_INGREDIENT", capa_summary: "Supplier decertified; incoming lot testing added." }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
          trigger:
            - call: "POST /recalls/${r_id}/decide-termination"
              payload: { decision: "TERMINATE" }
              as: RecallCoordinator
              as_user_id: "coord-2"
              captures: { st: $.data.status, term_at: $.data.terminated_at, disposed: $.data.units_disposed_verified }
          assert:
            - "${st} == TERMINATED"
            - "${term_at} == 2026-09-01T00:00:00.000Z"
            - "${disposed} == 960"
