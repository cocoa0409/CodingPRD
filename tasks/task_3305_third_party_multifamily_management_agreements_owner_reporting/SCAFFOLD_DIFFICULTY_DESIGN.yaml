  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: pricing_window_half_open_adjacency_allowed
        grounds:
          - validations[priority=7]
          - state_machines.PricingRecommendation.PROPOSED_to_PUBLISHED
          - errors[ERR_PRICING_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource: PricingRecommendation windows per property+unit;
          semantics: half-open [start, end) intervals — a second window
          starting exactly at the first window's end (adjacent, gap 0) is
          ACCEPTED, while a window overlapping by one second is REJECTED with
          ERR_PRICING_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Owner O15; Agreement AG15 ACTIVE; Property P15 MANAGED (zero-balance onboarding, one resident)"
