# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3069_worksite_supplemental_indemnity_enrollment_cash_benefit_claims
# Breadth probe over §1.1–§1.7 claims not already exercised by §1.8.
# Common fixture abbreviations used inside instances:
#   BASE-GROUP(name, code): POST /employer-groups (minimums 0/0.0, DAILY) + activate
#   BASE-SERIES(code, items, premium): create series, create schedule v1
#     effective 2026-01-01, publish with captured series version, activate series
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: employer_group_create_returns_defaults_and_version_1
        claim_type: Creation
        grounds: [entities.EmployerGroup, endpoints.POST_/employer-groups]
        distinguishing_aspect: "Creating a group with only name and group_code returns 201 with status PROSPECT, participation_minimum_pct 0.10, participation_minimum_count 3, proration_convention DAILY, version 1, and system id/created_at/updated_at."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CarrierAdmin }
          trigger:
            - { call: "POST /employer-groups", payload: { name: "Corner Group", group_code: "CG-1" }, as: CarrierAdmin, captures: { cg_id: $.data.id } }
          assert:
            - "response status 201, response_type object"
            - "EmployerGroup.${cg_id}.status == PROSPECT and version == 1"
            - "participation_minimum_pct == 0.10, participation_minimum_count == 3, proration_convention == DAILY (defaults applied)"
            - "eligible_employee_count == 0 and enrolled_count == 0"
            - "meta.api_request_id and meta.api_request_timestamp present"

      - name: employer_group_duplicate_group_code_rejected
        claim_type: Type Constraints
        grounds: [entities.EmployerGroup.fields.group_code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "group_code is globally unique: a second create reusing the same code fails with ERR_INVALID_REQUEST even though every other field differs."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z. Group CG-DUP already created."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /employer-groups", payload: { name: "First", group_code: "CG-DUP" }, as: CarrierAdmin }
          trigger:
            - { call: "POST /employer-groups", payload: { name: "Second", group_code: "CG-DUP" }, as: CarrierAdmin, captures: { err_dup: $.data.error_id } }
          assert:
            - "${err_dup} == ERR_INVALID_REQUEST and HTTP status 400"

      - name: employer_group_get_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.EmployerGroup, "errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET /employer-groups/{id} with a well-formed but nonexistent UUID returns 404 ERR_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["Clock at default 2026-09-01T00:00:00Z (no clock set needed). Empty database."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CarrierAdmin }
          trigger:
            - { call: "GET /employer-groups/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: CarrierAdmin, captures: { err_nf: $.data.error_id } }
          assert:
            - "HTTP 404 and ${err_nf} == ERR_NOT_FOUND and response_type == error"

      - name: benefit_schedule_defaults_and_system_fields
        claim_type: System Fields
        grounds: [entities.BenefitSchedule, endpoints.POST_/benefit-schedules]
        distinguishing_aspect: "A schedule create returns status DRAFT and ignores any client-supplied id/version/status fields; schedule_version and effective_date echo the input."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z. Series SC created (DRAFT)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /policy-series", payload: { series_code: "SC-1", product_line: "HOSPITAL" }, as: CarrierAdmin, captures: { sc_id: $.data.id } }
          trigger:
            - { call: "POST /benefit-schedules", payload: { policy_series_id: "${sc_id}", schedule_version: 1, effective_date: "2026-01-01T00:00:00Z", benefit_items: [{ event_code: "E1", benefit_amount_cents: 100, max_occurrences_per_year: 1, lifetime_max_cents: 1000 }], monthly_premium_cents: 100, wellness_benefit_cents: 50, wellness_waiting_months: 0, preexisting_exclusion_months: 0 }, as: CarrierAdmin, captures: { schc: $.data.id } }
          assert:
            - "BenefitSchedule.${schc}.status == DRAFT, version == 1, schedule_version == 1, effective_date == 2026-01-01T00:00:00Z"

      - name: employee_preexisting_codes_default_empty
        claim_type: Defaults
        grounds: [entities.Employee.fields.preexisting_diagnosis_codes, endpoints.POST_/employees]
        distinguishing_aspect: "Omitting preexisting_diagnosis_codes stores an empty array (not null), which matters because the guaranteed-issue screen treats [] as clean."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z. Group CE ACTIVE."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /employer-groups", payload: { name: "CE", group_code: "CE", participation_minimum_pct: 0.0, participation_minimum_count: 0 }, as: CarrierAdmin, captures: { ce_g: $.data.id } }
            - { call: "POST /employer-groups/${ce_g}/activate", payload: {}, as: CarrierAdmin }
          trigger:
            - { call: "POST /employees", payload: { employer_group_id: "${ce_g}", employee_ref: "CE-1", full_name: "Corner Emp", hire_date: "2026-01-01T00:00:00Z" }, as: GroupAdmin, captures: { ce_e: $.data.id } }
          assert:
            - "Employee.${ce_e}.preexisting_diagnosis_codes == [] (empty array, not null)"
            - "Employee.${ce_e}.status == ACTIVE"

      - name: campaign_get_returns_stored_window_fields
        claim_type: Retrieval
        grounds: [entities.EnrollmentCampaign, "endpoints.GET_/enrollment-campaigns/{id}"]
        distinguishing_aspect: "GET round-trips window_start, window_end, guaranteed_issue and null computed fields (required_enrollments, participation_met) on a DRAFT campaign."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z. Group CR ACTIVE; counselor CR-C ACTIVE; campaign CR-CAM created."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /employer-groups", payload: { name: "CR", group_code: "CR", participation_minimum_pct: 0.0, participation_minimum_count: 0 }, as: CarrierAdmin, captures: { cr_g: $.data.id } }
            - { call: "POST /employer-groups/${cr_g}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /benefit-counselors", payload: { license_id: "LIC-CR", full_name: "C Corner", home_state: "TX" }, as: CarrierAdmin, captures: { cr_c: $.data.id } }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${cr_g}", counselor_id: "${cr_c}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", guaranteed_issue: false }, as: BenefitCounselor, captures: { cr_cam: $.data.id } }
          trigger:
            - { call: "GET /enrollment-campaigns/${cr_cam}", payload: {}, as: CarrierAdmin }
          assert:
            - "EnrollmentCampaign.${cr_cam}.window_start == 2026-09-01T00:00:00Z, window_end == 2026-10-01T00:00:00Z, guaranteed_issue == false, status == DRAFT"
            - "required_enrollments is null and participation_met is null on a DRAFT campaign"

      - name: enrollment_campaign_list_pagination_envelope
        claim_type: Listing
        grounds: [endpoints.GET_/enrollment-campaigns, response_envelope]
        distinguishing_aspect: "List endpoint honors limit/offset and returns pagination fields total_count and has_more; with 3 campaigns and limit=2, first page has 2 items and has_more=true, second page 1 item and has_more=false."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z. Group CP ACTIVE; counselors CP-A, CP-B, CP-C ACTIVE (distinct counselors avoid double-booking gates); three DRAFT campaigns with disjoint windows."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /employer-groups", payload: { name: "CP", group_code: "CP", participation_minimum_pct: 0.0, participation_minimum_count: 0 }, as: CarrierAdmin, captures: { cp_g: $.data.id } }
            - { call: "POST /employer-groups/${cp_g}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /benefit-counselors", payload: { license_id: "LIC-CPA", full_name: "CPA", home_state: "TX" }, as: CarrierAdmin, captures: { cp_ca: $.data.id } }
            - { call: "POST /benefit-counselors", payload: { license_id: "LIC-CPB", full_name: "CPB", home_state: "TX" }, as: CarrierAdmin, captures: { cp_cb: $.data.id } }
            - { call: "POST /benefit-counselors", payload: { license_id: "LIC-CPC", full_name: "CPC", home_state: "TX" }, as: CarrierAdmin, captures: { cp_cc: $.data.id } }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${cp_g}", counselor_id: "${cp_ca}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-10T00:00:00Z" }, as: BenefitCounselor }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${cp_g}", counselor_id: "${cp_cb}", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-20T00:00:00Z" }, as: BenefitCounselor }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${cp_g}", counselor_id: "${cp_cc}", window_start: "2026-09-20T00:00:00Z", window_end: "2026-10-01T00:00:00Z" }, as: BenefitCounselor }
          trigger:
            - { call: "GET /enrollment-campaigns", payload: { employer_group_id: "${cp_g}", limit: 2, offset: 0 }, as: CarrierAdmin }
            - { call: "GET /enrollment-campaigns", payload: { employer_group_id: "${cp_g}", limit: 2, offset: 2 }, as: CarrierAdmin }
          assert:
            - "Page 1: response_type == array, data has 2 items, total_count == 3, has_more == true"
            - "Page 2: data has 1 item, total_count == 3, has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: policy_issue_from_issued_rejected_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Policy.transitions, "errors[ERR_INVALID_STATE]", "validations[priority=5]"]
        distinguishing_aspect: "Issuing an already-ISSUED policy is not a declared transition (ISSUED has no self-loop), so the second issue attempt fails with ERR_INVALID_STATE and the pinned schedule stays unchanged."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Group GS ACTIVE (0/0.0, DAILY); counselor CS; series SS2 ACTIVE with PUBLISHED schedule (event G amount 100, max 1, lifetime 1000; premium 100; wellness 50/0/0); campaign CS-CAM OPEN 2026-09-01..2026-10-01 guaranteed_issue; employee ES ACTIVE; policy PS ISSUED under the campaign."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /employer-groups", payload: { name: "GS", group_code: "GS", participation_minimum_pct: 0.0, participation_minimum_count: 0 }, as: CarrierAdmin, captures: { gs: $.data.id } }
            - { call: "POST /employer-groups/${gs}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /benefit-counselors", payload: { license_id: "LIC-GS", full_name: "CGS", home_state: "TX" }, as: CarrierAdmin, captures: { cs: $.data.id } }
            - { call: "POST /policy-series", payload: { series_code: "SS2", product_line: "ACCIDENT" }, as: CarrierAdmin, captures: { ss2: $.data.id, ss2_v: $.data.version } }
            - { call: "POST /benefit-schedules", payload: { policy_series_id: "${ss2}", schedule_version: 1, effective_date: "2026-01-01T00:00:00Z", benefit_items: [{ event_code: "G", benefit_amount_cents: 100, max_occurrences_per_year: 1, lifetime_max_cents: 1000 }], monthly_premium_cents: 100, wellness_benefit_cents: 50, wellness_waiting_months: 0, preexisting_exclusion_months: 0 }, as: CarrierAdmin, captures: { schg: $.data.id } }
            - { call: "POST /benefit-schedules/${schg}/publish", payload: { expected_series_version: "${ss2_v}" }, as: CarrierAdmin }
            - { call: "POST /policy-series/${ss2}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${gs}", counselor_id: "${cs}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", guaranteed_issue: true }, as: BenefitCounselor, captures: { cs_cam: $.data.id } }
            - { call: "POST /enrollment-campaigns/${cs_cam}/open", payload: {}, as: BenefitCounselor }
            - { call: "POST /employees", payload: { employer_group_id: "${gs}", employee_ref: "ES", full_name: "Emp GS", hire_date: "2026-01-01T00:00:00Z" }, as: GroupAdmin, captures: { es: $.data.id } }
            - { call: "POST /policies", payload: { campaign_id: "${cs_cam}", employee_id: "${es}", policy_series_id: "${ss2}" }, as: BenefitCounselor, captures: { ps: $.data.id } }
            - { call: "POST /policies/${ps}/issue", payload: {}, as: BenefitCounselor }
          trigger:
            - { call: "POST /policies/${ps}/issue", payload: {}, as: BenefitCounselor, captures: { err_gs: $.data.error_id } }
          assert:
            - "${err_gs} == ERR_INVALID_STATE and HTTP 409"
            - "Policy.${ps}.status remains ISSUED; benefit_schedule_id unchanged"

      - name: claim_terminal_paid_rejects_further_adjudication
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Claim.terminal_states, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "PAID is terminal for adjudication: a second adjudicate on a PAID claim fails with ERR_INVALID_STATE, and pay on a PAID claim also fails (no PAID->PAID self-loop)."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Group GT ACTIVE (0/0.0, DAILY); counselor CT; series ST ACTIVE with PUBLISHED schedule (event T amount 2000, max 5, lifetime 500000; premium 1000; wellness 500/0/0); campaign CT-CAM OPEN guaranteed_issue; employee ET; policy PT ISSUED; claim CT1 for event T (2026-09-03, 1 occurrence) reviewed, documented with accepted DIAGNOSIS_PROOF, approved, PAID."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /employer-groups", payload: { name: "GT", group_code: "GT", participation_minimum_pct: 0.0, participation_minimum_count: 0 }, as: CarrierAdmin, captures: { gt: $.data.id } }
            - { call: "POST /employer-groups/${gt}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /benefit-counselors", payload: { license_id: "LIC-GT", full_name: "CGT", home_state: "TX" }, as: CarrierAdmin, captures: { ct: $.data.id } }
            - { call: "POST /policy-series", payload: { series_code: "ST", product_line: "ACCIDENT" }, as: CarrierAdmin, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /benefit-schedules", payload: { policy_series_id: "${st}", schedule_version: 1, effective_date: "2026-01-01T00:00:00Z", benefit_items: [{ event_code: "T", benefit_amount_cents: 2000, max_occurrences_per_year: 5, lifetime_max_cents: 500000 }], monthly_premium_cents: 1000, wellness_benefit_cents: 500, wellness_waiting_months: 0, preexisting_exclusion_months: 0 }, as: CarrierAdmin, captures: { scht: $.data.id } }
            - { call: "POST /benefit-schedules/${scht}/publish", payload: { expected_series_version: "${st_v}" }, as: CarrierAdmin }
            - { call: "POST /policy-series/${st}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${gt}", counselor_id: "${ct}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", guaranteed_issue: true }, as: BenefitCounselor, captures: { ct_cam: $.data.id } }
            - { call: "POST /enrollment-campaigns/${ct_cam}/open", payload: {}, as: BenefitCounselor }
            - { call: "POST /employees", payload: { employer_group_id: "${gt}", employee_ref: "ET", full_name: "Emp GT", hire_date: "2026-01-01T00:00:00Z" }, as: GroupAdmin, captures: { et: $.data.id } }
            - { call: "POST /policies", payload: { campaign_id: "${ct_cam}", employee_id: "${et}", policy_series_id: "${st}" }, as: BenefitCounselor, captures: { pt: $.data.id } }
            - { call: "POST /policies/${pt}/issue", payload: {}, as: BenefitCounselor }
            - { call: "POST /claims", payload: { policy_id: "${pt}", event_code: "T", service_date: "2026-09-03T00:00:00Z", diagnosis_code: "D-T", claimed_occurrences: 1 }, as: ClaimsAdjuster, captures: { ct1: $.data.id } }
            - { call: "POST /claims/${ct1}/review", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /claim-documents", payload: { claim_id: "${ct1}", doc_type: "DIAGNOSIS_PROOF", content_ref: "ref-t" }, as: ClaimsAdjuster, captures: { doct: $.data.id } }
            - { call: "POST /claim-documents/${doct}/accept", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /claims/${ct1}/adjudicate", payload: { decision: "APPROVE" }, as: ClaimsAdjuster }
            - { call: "POST /claims/${ct1}/pay", payload: {}, as: ClaimsAdjuster }
          trigger:
            - { call: "POST /claims/${ct1}/adjudicate", payload: { decision: "DENY" }, as: ClaimsAdjuster, captures: { err_t1: $.data.error_id } }
            - { call: "POST /claims/${ct1}/pay", payload: {}, as: ClaimsAdjuster, captures: { err_t2: $.data.error_id } }
          assert:
            - "${err_t1} == ERR_INVALID_STATE (PAID is terminal for adjudicate)"
            - "${err_t2} == ERR_INVALID_STATE (no PAID->PAID self-loop)"
            - "Claim.${ct1}.status remains PAID; Policy.${pt}.lifetime_paid_cents == 2000"

      - name: claim_initial_state_is_submitted
        claim_type: initial_state
        grounds: [state_machines.Claim.initial_state, entities.Claim.fields.status]
        distinguishing_aspect: "A freshly created claim is SUBMITTED with provisional_payable_cents null, payable_amount_cents null, adjudicated_occurrences null, denial_reason null."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Group GU ACTIVE; counselor CU; series SU ACTIVE with PUBLISHED schedule (event U amount 100, max 1, lifetime 1000; premium 100; wellness 50/0/0); campaign CU-CAM OPEN guaranteed_issue; employee EU; policy PU ISSUED."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /employer-groups", payload: { name: "GU", group_code: "GU", participation_minimum_pct: 0.0, participation_minimum_count: 0 }, as: CarrierAdmin, captures: { gu: $.data.id } }
            - { call: "POST /employer-groups/${gu}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /benefit-counselors", payload: { license_id: "LIC-GU", full_name: "CGU", home_state: "TX" }, as: CarrierAdmin, captures: { cu: $.data.id } }
            - { call: "POST /policy-series", payload: { series_code: "SU", product_line: "ACCIDENT" }, as: CarrierAdmin, captures: { su: $.data.id, su_v: $.data.version } }
            - { call: "POST /benefit-schedules", payload: { policy_series_id: "${su}", schedule_version: 1, effective_date: "2026-01-01T00:00:00Z", benefit_items: [{ event_code: "U", benefit_amount_cents: 100, max_occurrences_per_year: 1, lifetime_max_cents: 1000 }], monthly_premium_cents: 100, wellness_benefit_cents: 50, wellness_waiting_months: 0, preexisting_exclusion_months: 0 }, as: CarrierAdmin, captures: { schu: $.data.id } }
            - { call: "POST /benefit-schedules/${schu}/publish", payload: { expected_series_version: "${su_v}" }, as: CarrierAdmin }
            - { call: "POST /policy-series/${su}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${gu}", counselor_id: "${cu}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", guaranteed_issue: true }, as: BenefitCounselor, captures: { cu_cam: $.data.id } }
            - { call: "POST /enrollment-campaigns/${cu_cam}/open", payload: {}, as: BenefitCounselor }
            - { call: "POST /employees", payload: { employer_group_id: "${gu}", employee_ref: "EU", full_name: "Emp GU", hire_date: "2026-01-01T00:00:00Z" }, as: GroupAdmin, captures: { eu: $.data.id } }
            - { call: "POST /policies", payload: { campaign_id: "${cu_cam}", employee_id: "${eu}", policy_series_id: "${su}" }, as: BenefitCounselor, captures: { pu: $.data.id } }
            - { call: "POST /policies/${pu}/issue", payload: {}, as: BenefitCounselor }
          trigger:
            - { call: "POST /claims", payload: { policy_id: "${pu}", event_code: "U", service_date: "2026-09-05T00:00:00Z", diagnosis_code: "D-U", claimed_occurrences: 1 }, as: ClaimsAdjuster, captures: { clu: $.data.id } }
          assert:
            - "Claim.${clu}.status == SUBMITTED"
            - "provisional_payable_cents, payable_amount_cents, adjudicated_occurrences, denial_reason are all null at creation"

      - name: policy_reinstate_after_60_days_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Policy.LAPSED_to_ACTIVE, "errors[ERR_REINSTATEMENT_WINDOW_EXPIRED]"]
        distinguishing_aspect: "The 60-day reinstatement window is measured against the logical clock: lapsed at 2026-09-01, reinstating at 2026-10-31T00:00:01Z (more than 60 days later) fails, while reinstating at 2026-10-31T00:00:00Z (exactly 60 days) succeeds — the boundary is inclusive."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Group GV ACTIVE; counselor CV; series SV ACTIVE with PUBLISHED schedule (event V amount 100, max 1, lifetime 1000; premium 100; wellness 50/0/0); campaign CV-CAM OPEN guaranteed_issue; employee EV; policy PV ISSUED."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /employer-groups", payload: { name: "GV", group_code: "GV", participation_minimum_pct: 0.0, participation_minimum_count: 0 }, as: CarrierAdmin, captures: { gv: $.data.id } }
            - { call: "POST /employer-groups/${gv}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /benefit-counselors", payload: { license_id: "LIC-GV", full_name: "CGV", home_state: "TX" }, as: CarrierAdmin, captures: { cv: $.data.id } }
            - { call: "POST /policy-series", payload: { series_code: "SV", product_line: "ACCIDENT" }, as: CarrierAdmin, captures: { sv: $.data.id, sv_v: $.data.version } }
            - { call: "POST /benefit-schedules", payload: { policy_series_id: "${sv}", schedule_version: 1, effective_date: "2026-01-01T00:00:00Z", benefit_items: [{ event_code: "V", benefit_amount_cents: 100, max_occurrences_per_year: 1, lifetime_max_cents: 1000 }], monthly_premium_cents: 100, wellness_benefit_cents: 50, wellness_waiting_months: 0, preexisting_exclusion_months: 0 }, as: CarrierAdmin, captures: { schv: $.data.id } }
