          - state_machines.InspectionReport.VALIDATED_to_SCORED
        distinguishing_aspect: |
          Ingesting and scoring the 2025-08-01 inspection AFTER the 2026-07-01 one must not give it the
          newer report's time weight: the older report keeps time_weight 2 (10.0) and the newer keeps 3
          (15.0), total 25.0, measure 0.833, percentile 60.0 — identical to chronological ingestion, and
          re-running the scorer changes nothing.
