    input: ["complaint_id?", "consumer_id?", "status?", "chain_integrity_status?", "limit?", "offset?"]
    output: SampleKit[]
    side_effects: []
  - method: GET
    path: /sample-kits/{id}
    description: Fetch one sample kit with its custody projection.
    roles: [CareAgent, CareSupervisor, QualityLead]
    code: 200
    input: []
    output: SampleKit
    side_effects: []
  - method: POST
    path: /sample-kits/{id}/ship
    description: Dispatch the kit to the consumer.
    roles: [CareAgent, CareSupervisor]
    code: 200
    input: ["carrier_note?"]
    output: SampleKit
    side_effects:
      - "shipped_at, expected_return_by, occupied_from and occupied_until stamped"
      - "a KIT_ISSUED CustodyEvent is auto-appended at sequence_no 1"
  - method: POST
    path: /sample-kits/{id}/receive
    description: Log the kit as physically received by the lab.
    roles: [QualityLead]
    code: 200
    input: []
    output: SampleKit
    side_effects:
      - "received_at, transit_hours and seal_id_returned set; custody_chain_integrity re-projected"
  - method: POST
    path: /sample-kits/{id}/lab-accept
    description: Accept the kit into the lab and set its disposition.
    roles: [QualityLead]
    code: 200
    input: ["lab_note?"]
    output: SampleKit
    side_effects:
      - "disposition USABLE only when the chain is INTACT, else forced UNUSABLE"
      - "Complaint.handling_status AWAITING_SAMPLE -> IN_RESOLUTION; Consumer.open_kit_count -= 1"
  - method: POST
    path: /sample-kits/{id}/cancel
    description: Cancel an unreturned kit.
    roles: [CareSupervisor]
    code: 200
    input: ["reason?"]
    output: SampleKit
    side_effects:
      - "status -> CANCELLED (terminal); Complaint.handling_status AWAITING_SAMPLE -> IN_RESOLUTION; Consumer.open_kit_count -= 1"
  - method: POST
    path: /sample-kits/{id}/custody-events
    description: Append one immutable chain-of-custody record, guarded by the kit's version.
    roles: [CareAgent, CareSupervisor, QualityLead]
    code: 201
    input: [event_type, occurred_at, actor_label, expected_sample_kit_version, "seal_id_observed?", "notes?"]
    output: CustodyEvent
    side_effects:
      - "sequence_no assigned; SampleKit.custody_event_count += 1; SampleKit.version increments"
      - "CARRIER_PICKUP moves the kit SHIPPED -> IN_TRANSIT_INBOUND"
      - "custody_chain_integrity re-projected after every append"
  - method: GET
    path: /sample-kits/{id}/custody-events
    description: List a kit's custody chain in sequence order.
    roles: [CareAgent, CareSupervisor, QualityLead]
    code: 200
    input: ["limit?", "offset?"]
    output: CustodyEvent[]
    side_effects: []

  # --- remedies ---------------------------------------------------------------
  - method: POST
    path: /remedies
    description: Author a goodwill remedy against a complaint, pinned to the complaint revision the author read.
    roles: [CareAgent, CareSupervisor]
    code: 201
    input: [complaint_id, remedy_type, requested_value_cents, expected_complaint_version]
    output: Remedy
    side_effects:
      - "goodwill_authorization computes base_value_cents, uplift_pct, uplift_cents, payout_cents and authority_tier_required"
      - "any live Remedy already on the complaint moves to SUPERSEDED"
      - "authored_by_ref stamped from X-User-ID"
  - method: GET
    path: /remedies
    description: List remedies with filters.
    roles: [CareAgent, CareSupervisor, QualityLead]
    code: 200
    input: ["complaint_id?", "consumer_id?", "status?", "remedy_type?", "limit?", "offset?"]
    output: Remedy[]
    side_effects: []
  - method: GET
    path: /remedies/{id}
    description: Fetch one remedy with its full goodwill computation.
    roles: [CareAgent, CareSupervisor, QualityLead]
    code: 200
    input: []
    output: Remedy
    side_effects: []
  - method: POST
    path: /remedies/{id}/submit
    description: Submit a draft or revised remedy for approval.
    roles: [CareAgent, CareSupervisor]
    code: 200
    input: ["submit_note?"]
    output: Remedy
    side_effects:
      - "status -> SUBMITTED; goodwill_authorization recomputed against the current kit status"
  - method: POST
    path: /remedies/{id}/decide
    description: Approve, reject or send back a submitted remedy. The decider may not be the author.
    roles: [CareSupervisor, QualityLead]
    code: 200
    input: [decision, "decision_note?"]
    output: Remedy
    side_effects:
      - "APPROVE -> APPROVED, decided_by_ref stamped, Consumer.goodwill_authorized_cents and goodwill_outstanding_cents += payout_cents"
      - "REJECT -> REJECTED (terminal)"
      - "REQUEST_REVISION -> REVISION_REQUESTED with revision_count += 1, bounded by MAX_REMEDY_REVISIONS = 2"
  - method: POST
    path: /remedies/{id}/fulfill
    description: Issue the approved goodwill.
    roles: [CareSupervisor]
    code: 200
    input: ["fulfilment_reference?"]
    output: Remedy
    side_effects:
      - "status APPROVED -> FULFILLED; fulfilled_at stamped"
      - "Consumer.goodwill_outstanding_cents -= payout_cents; Consumer.goodwill_paid_cents += payout_cents"
      - "ProductionLot.goodwill_charged_cents += payout_cents"
  - method: POST
    path: /remedies/{id}/void
    description: Reverse an approved or already fulfilled remedy.
    roles: [CareSupervisor]
    code: 200
    input: ["reason?"]
    output: Remedy
    side_effects:
      - "status -> VOIDED_AFTER_FULFILLMENT"
      - "Consumer.goodwill_paid_cents -= payout_cents; Consumer.goodwill_voided_cents += payout_cents"
      - "ProductionLot.goodwill_charged_cents -= payout_cents"

