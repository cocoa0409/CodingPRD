      - name: error_cohort_cap_trigger
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_COHORT_CAP_EXCEEDED]"
        distinguishing_aspect: "Adding an IEP student to a section whose IEP cohort already equals ceil(0.5*capacity) fails ERR_COHORT_CAP_EXCEEDED."
        test_recipe:
