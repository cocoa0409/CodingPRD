              as: ProgramAdministrator
              captures: { hB_id: $.data.id }
            - call: "POST /loyalty/hotels/${hB_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rpB_id: $.data.id }
            - call: "POST /loyalty/hotels/${hB_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/members"
              payload: { email: "pe1@example.com", full_name: "Member One", enrollment_date: "2026-02-07" }
              as: ProgramAdministrator
              captures: { m1_id: $.data.id }
            - call: "POST /loyalty/members"
              payload: { email: "pe2@example.com", full_name: "Member Two", enrollment_date: "2026-02-08" }
              as: ProgramAdministrator
              captures: { m2_id: $.data.id }
          trigger:
            - call: "POST /loyalty/hotels/${hB_id}/rate-plans"
              payload: { rate_code: "CORP", rate_category: "CORPORATE_NEGOTIATED" }
              as: HotelOwner
              as_user_id: "${hA_id}"
              captures: { e_write_peer: $.data.error_id }
            - call: "GET /loyalty/hotels/${hB_id}"
              payload: {}
              as: HotelOwner
              as_user_id: "${hA_id}"
              captures: { e_read_peer: $.data.error_id }
            - call: "POST /loyalty/hotels/${hA_id}/rate-plans"
              payload: { rate_code: "CORP", rate_category: "CORPORATE_NEGOTIATED" }
              as: HotelOwner
              as_user_id: "${hA_id}"
              captures: { rpA2_id: $.data.id, rpA2_code: $.data.rate_code }
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m2_id}", channel: "DIRECT_PURCHASE", points_quantity: 5000 }
              as: Member
              as_user_id: "${m1_id}"
              captures: { e_buy_peer: $.data.error_id }
            - call: "GET /loyalty/members/${m2_id}"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
              captures: { e_read_member: $.data.error_id }
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m1_id}", channel: "DIRECT_PURCHASE", points_quantity: 5000 }
