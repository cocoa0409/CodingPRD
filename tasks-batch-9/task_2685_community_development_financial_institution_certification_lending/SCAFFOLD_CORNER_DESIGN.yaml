            - "Institution.${inst_id}.accountability_satisfied == false"
      - name: resigned_seats_leave_the_numerator_and_the_denominator_together
        claim_type: input_set_filtering
        grounds:
          - calculations.accountability_representation_score.input_set
          - calculations.accountability_representation_score.precision
        distinguishing_aspect: |
          Only ACTIVE seats enter the ratio, and a resignation removes the seat from the
          denominator as well as the numerator: 2 of 4 representing (0.5000) becomes 2 of 3
          (0.666666... -> 0.6667) when a NON-representing seat resigns, so the score goes UP.
          An implementation that keeps resigned seats in the denominator reports 0.5000, and one
          that truncates instead of rounding half-up reports 0.6666.
