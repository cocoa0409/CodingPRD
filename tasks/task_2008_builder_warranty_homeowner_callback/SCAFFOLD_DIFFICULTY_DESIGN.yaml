              as: WarrantyManager
              captures: { home_id: $.data.id }
            - call: "POST /trade-partners"
              payload: { company_name: "FlowRight Plumbing", trade: "PLUMBING", contact_email: "dispatch@flowright.example.com" }
              as: WarrantyManager
              captures: { tp1_id: $.data.id }
            - call: "POST /trade-partners"
              payload: { company_name: "VoltLine Electric", trade: "ELECTRICAL", contact_email: "sched@voltline.example.com" }
              as: WarrantyManager
              captures: { tp2_id: $.data.id }
            - call: "POST /service-requests"
              payload: { home_id: "${home_id}", item_category: "PLUMBING", severity: "STANDARD", description: "Disposal replacement" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { srA_id: $.data.id }
            - call: "POST /service-requests/${srA_id}/assess"
              payload: { warrantable: true }
              as: WarrantyRep
            - call: "POST /service-requests"
              payload: { home_id: "${home_id}", item_category: "ELECTRICAL", severity: "STANDARD", description: "GFCI tripping" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { srB_id: $.data.id }
            - call: "POST /service-requests/${srB_id}/assess"
              payload: { warrantable: true }
              as: WarrantyRep
            - call: "POST /work-orders"
              payload: { service_request_id: "${srA_id}", trade_partner_id: "${tp1_id}", window_start: "2026-08-12T09:00:00Z", window_end: "2026-08-12T11:00:00Z", estimated_cost_cents: 45000, defect_responsibility: "BUILDER" }
              as: WarrantyRep
              captures: { woA_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { service_request_id: "${srB_id}", trade_partner_id: "${tp2_id}", window_start: "2026-08-12T10:00:00Z", window_end: "2026-08-12T12:00:00Z", estimated_cost_cents: 52000, defect_responsibility: "BUILDER" }
              as: WarrantyRep
              captures: { err: $.data.error_id }
            - call: "POST /work-orders"
              payload: { service_request_id: "${srB_id}", trade_partner_id: "${tp2_id}", window_start: "2026-08-12T11:00:00Z", window_end: "2026-08-12T12:00:00Z", estimated_cost_cents: 52000, defect_responsibility: "BUILDER" }
              as: WarrantyRep
              captures: { woB_status: $.data.status }
          assert:
            - "err == ERR_HOME_VISIT_OVERLAP, HTTP 409 (10:00 < 11:00 end of woA)"
            - "woB_status == SCHEDULED (11:00 start == woA end: half-open adjacency allowed)"
            - "the overlap rule keys on the HOME (both requests share home_id), not on the trade partner"

  - rule_id: compensating_invariant
    instances:
      - name: reserve_manual_adjustment_compensation
        grounds:
          - entities.WarrantyReserve.fields.balance_cents
          - entities.ReserveEntry.fields.amount_cents
          - concurrency_rules[reserve-adjust-stale-version]
        distinguishing_aspect: |
          Conserved quantity is the reserve LEDGER BALANCE in cents: a +50000 manual
          adjustment paired with its -50000 compensation leaves balance_cents unchanged
          and equal to the signed sum of all entries (0), with OCC versions stepping 1->3.
        test_recipe:
          setup:
            - "Home price 40000000 closing 2026-06-01; reserve auto-created (balance 0, version 1); no accruals posted"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Pat Hale", email: "pat@example.com" }
              as: WarrantyManager
              captures: { ho_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${ho_id}", lot_number: "L-801", community_name: "Cedar Ridge", sale_price_cents: 40000000, closing_date: "2026-06-01", warranty_program: "STANDARD" }
              as: WarrantyManager
              captures: { home_id: $.data.id }
            - call: "GET /warranty-reserves?home_id=${home_id}"
              as: FinanceAdmin
              captures: { res_id: "$.data[0].id", res_v1: "$.data[0].version", bal0: "$.data[0].balance_cents" }
          trigger:
            - call: "POST /warranty-reserves/${res_id}/adjustments"
              payload: { kind: "MANUAL_ADJUSTMENT", amount_cents: 50000, expected_reserve_version: "${res_v1}", note: "Goodwill credit accrual" }
              as: FinanceAdmin
            - call: "GET /warranty-reserves/${res_id}"
              as: FinanceAdmin
              captures: { res_v2: $.data.version, bal1: $.data.balance_cents }
            - call: "POST /warranty-reserves/${res_id}/adjustments"
              payload: { kind: "MANUAL_ADJUSTMENT", amount_cents: -50000, expected_reserve_version: "${res_v2}", note: "Reverse goodwill accrual - posted in error" }
              as: FinanceAdmin
            - call: "GET /warranty-reserves/${res_id}"
              as: FinanceAdmin
              captures: { bal2: $.data.balance_cents, res_v3: $.data.version }
            - call: "GET /warranty-reserves/${res_id}/entries"
              as: FinanceAdmin
              captures: { e1: "$.data[0].amount_cents", e2: "$.data[1].amount_cents" }
          assert:
            - "bal0 == 0 and bal1 == 50000 (forward action)"
            - "bal2 == 0 == bal0 (compensating action restores the conserved balance exactly)"
            - "e1 == 50000 and e2 == -50000 and e1 + e2 == 0 (balance equals signed entry sum — ledger conservation)"
            - "res_v1 == 1 and res_v3 == 3 (each adjustment bumps version by exactly 1)"
      - name: trade_open_work_order_cardinality
        grounds:
          - entities.TradePartner.fields.open_work_order_count
          - state_machines.WorkOrder.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity is an integer CARDINALITY (different type from ledger cents):
          cancelling a SCHEDULED work order (-1) paired with dispatching a replacement
          (+1) leaves TradePartner.open_work_order_count unchanged.
        test_recipe:
          setup:
            - "Home; tp; approved requests sr1 and sr2; wo1 SCHEDULED for sr1 (count == 1)"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Pat Hale", email: "pat@example.com" }
              as: WarrantyManager
              captures: { ho_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${ho_id}", lot_number: "L-802", community_name: "Cedar Ridge", sale_price_cents: 40000000, closing_date: "2026-06-01", warranty_program: "STANDARD" }
              as: WarrantyManager
              captures: { home_id: $.data.id }
            - call: "POST /trade-partners"
              payload: { company_name: "FlowRight Plumbing", trade: "PLUMBING", contact_email: "dispatch@flowright.example.com" }
              as: WarrantyManager
              captures: { tp_id: $.data.id }
            - call: "POST /service-requests"
              payload: { home_id: "${home_id}", item_category: "PLUMBING", severity: "STANDARD", description: "Job A" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { sr1_id: $.data.id }
            - call: "POST /service-requests/${sr1_id}/assess"
              payload: { warrantable: true }
              as: WarrantyRep
            - call: "POST /service-requests"
              payload: { home_id: "${home_id}", item_category: "PLUMBING", severity: "STANDARD", description: "Job B" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { sr2_id: $.data.id }
            - call: "POST /service-requests/${sr2_id}/assess"
              payload: { warrantable: true }
              as: WarrantyRep
            - call: "POST /work-orders"
              payload: { service_request_id: "${sr1_id}", trade_partner_id: "${tp_id}", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T11:00:00Z", estimated_cost_cents: 60000, defect_responsibility: "BUILDER" }
              as: WarrantyRep
              captures: { wo1_id: $.data.id }
            - call: "GET /trade-partners/${tp_id}"
              as: WarrantyManager
              captures: { cnt0: $.data.open_work_order_count }
          trigger:
            - call: "POST /work-orders/${wo1_id}/cancel"
              payload: { cancel_reason: "Homeowner traveling" }
              as: WarrantyRep
              captures: { wo1_status: $.data.status }
            - call: "GET /trade-partners/${tp_id}"
              as: WarrantyManager
              captures: { cnt_mid: $.data.open_work_order_count }
            - call: "POST /work-orders"
              payload: { service_request_id: "${sr2_id}", trade_partner_id: "${tp_id}", window_start: "2026-08-11T09:00:00Z", window_end: "2026-08-11T11:00:00Z", estimated_cost_cents: 60000, defect_responsibility: "BUILDER" }
              as: WarrantyRep
              captures: { wo2_status: $.data.status }
            - call: "GET /trade-partners/${tp_id}"
              as: WarrantyManager
              captures: { cnt_final: $.data.open_work_order_count }
          assert:
            - "cnt0 == 1 and wo1_status == CANCELLED (forward action)"
            - "cnt_mid == 0 (cancel decremented the cardinality)"
            - "wo2_status == SCHEDULED and cnt_final == 1 == cnt0 (compensating dispatch restores the conserved count)"
