      - name: deep_clean_creation_gated_on_property_linen_shortage_status
        grounds:
          - validations[priority=19]
          - errors[ERR_LINEN_SHORTAGE_BLOCK]
          - calculations.linen_coverage_status
          - entities.LinenItem.fields.shortage_status
        distinguishing_aspect: |
          The gate is a derived state on an entity in a wholly different aggregate - LinenItem, reached
          only through the property - and it is service-type selective: with coverage_ratio 0.6667 the
          SHEET_SET line sits in SHORTAGE, which blocks a DEEP_CLEAN outright while leaving a CHECKOUT
          on the same roster and the same version fully acceptable.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00.000Z."
            - "Property with three KING rooms (linen_sets_per_room 2) and one SUITE room (linen_sets_per_room 3), so par_required_sets is 3*2 + 1*3 == 9."
            - "Rooms: 101 DUE_OUT, 102 DUE_OUT, 103 VACANT (all KING) and 201 VACANT (SUITE)."
            - "SHEET_SET linen line with total_owned_sets 20 and initial_soiled_sets 14, so on_hand_clean is 6, coverage_ratio is round(6/9, 4) == 0.6667 and shortage_status is SHORTAGE."
