  - section: calculations
    instances:
      - name: corner_hotspot_posture_escalates_routine_and_adds_priority_bonus
        claim_type: constants_applied
        grounds:
          - calculations.complaint_priority_score
          - calculations.complaint_response_deadline
          - state_machines.Complaint.RECEIVED_to_TRIAGED
          - entities.Zone.fields.posture
        distinguishing_aspect: "In a HOTSPOT zone the intake scores 20 + 18 + 0 + 12 = 50.00 with a 168-hour ROUTINE deadline, and triage auto-escalates ROUTINE to HIGH, re-scoring to 40 + 18 + 0 + 12 = 70.00 with the 72-hour deadline still measured from created_at."
        test_recipe:
          setup:
            - "Zone Riverside is HOTSPOT: one open RODENT_SIGHTING complaint and one station reading of 87 percent take with 6 signs put rodent_index at 70.00"
          setup_api_calls:
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/zones"
              payload: { name: "Riverside", code: "Z-RIV", population_density_per_sqkm: 4200 }
              as: ProgramAdmin
              captures: { zone_id: $.data.id }
