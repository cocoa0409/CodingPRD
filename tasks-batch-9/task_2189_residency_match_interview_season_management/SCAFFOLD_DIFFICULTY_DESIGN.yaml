              captures: { inv1_id: $.data.id }
            - call: "GET /interview-waves/${wave1_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { wave_v2: $.data.version }
            - call: "POST /interview-waves/${wave1_id}/invitations"
              payload: { application_id: "${app2_id}", expected_wave_version: "${wave_v2}" }
              as: ProgramCoordinator
              captures: { inv2_id: $.data.id }
            - call: "POST /interview-waves/${wave1_id}/close"
              payload: {}
              as: ProgramCoordinator
          assert:
            - "before the forward action, Program.${prog_id}.invited_count == 0 and InterviewWave.${wave1_id}.issued_count == 0"
            - "after both invitations are issued, Program.${prog_id}.invited_count == 2 and InterviewWave.${wave1_id}.issued_count == 2"
            - "after both invitations are issued, Application.${app1_id}.interview_status == INVITED and Application.${app2_id}.interview_status == INVITED"
            - "after the close, InterviewInvitation.${inv1_id}.status == EXPIRED and InterviewInvitation.${inv2_id}.status == EXPIRED"
            - "after the close, Application.${app1_id}.interview_status == NOT_INVITED and Application.${app2_id}.interview_status == NOT_INVITED"
            - "after the close, Program.${prog_id}.invited_count == 0 and InterviewWave.${wave1_id}.issued_count == 0"
            - "after the close, InterviewWave.${wave1_id}.status == CLOSED"

      - name: booked_seat_total_conserved_across_accept_and_reschedule
        grounds:
          - entities.InterviewSlot.fields.booked_count
          - endpoints.POST_/interview-invitations/{id}/accept
          - endpoints.POST_/interview-invitations/{id}/reschedule
          - state_machines.InterviewSlot.BOOKED_to_OPEN
          - state_machines.Application.SCHEDULED_to_INVITED
        invariant: |
          Summed over every slot of a wave, booked_count equals the number of InterviewInvitation
          rows of that wave whose status == ACCEPTED. A slot is BOOKED exactly when its
          booked_count == applicant_capacity and OPEN below that.
        forward_action: "POST /interview-invitations/{id}/accept into slot1 — slot1.booked_count 0 -> 1, total 1"
        compensating_action: "POST /interview-invitations/{id}/reschedule — slot1.booked_count 1 -> 0 and slot1 returns to OPEN, total 0; a second accept into slot2 moves the same unit to slot2, total 1 again"
        distinguishing_aspect: |
          The conserved unit is a seat, and rescheduling moves it rather than duplicating or losing
          it. An implementation that clears the invitation's slot_id without decrementing the old
          slot's booked_count leaves the total at 2 after the second accept, and one that leaves
          slot1 in BOOKED at booked_count 0 breaks the status-versus-capacity half of the invariant.
        test_recipe:
          setup:
            - "one Program in INTERVIEWS_OPEN with one RELEASED wave, seat_capacity 4"
            - "two slots, each with applicant_capacity 1, both starting after the current clock"
            - "one ADVANCED application holding an ISSUED invitation"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
            - call: "POST /programs"
              payload: { name: "Metro Internal Medicine", nrmp_program_code: "1140140M0", specialty_code: "IM", quota_positions: 2, visa_sponsorship_allowed: true, soap_participating: true, min_step2_score: 220, img_accepted: true }
              as: NrmpAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /faculty-members"
              payload: { program_id: "${prog_id}", full_name: "Alan Reyes", is_program_director: false, is_committee_member: true, conflict_applicant_ids: [] }
              as: ProgramCoordinator
              captures: { f1_id: $.data.id }
            - call: "POST /faculty-members"
              payload: { program_id: "${prog_id}", full_name: "Bea Osei", is_program_director: false, is_committee_member: true, conflict_applicant_ids: [] }
              as: ProgramCoordinator
              captures: { f2_id: $.data.id }
            - call: "POST /applicants"
              payload: { eras_id: "E-9001", full_name: "Nia Patel", medical_school_type: "US_MD", visa_status: "US_CITIZEN", step2_score: 251, pipeline_program_alum: true, self_identified_group: "GROUP_A" }
              as: NrmpAdmin
              captures: { cand1_id: $.data.id }
            - call: "POST /programs/${prog_id}/advance-phase"
              payload: { to_phase: "REVIEW_OPEN" }
              as: ProgramCoordinator
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", applicant_id: "${cand1_id}" }
              as: ProgramCoordinator
              captures: { app1_id: $.data.id }
            - call: "POST /applications/${app1_id}/reviews"
              payload: { academic_points: 30, experience_points: 20, holistic_points: 20 }
              as: Reviewer
              as_user_id: "${f1_id}"
            - call: "POST /applications/${app1_id}/reviews"
              payload: { academic_points: 34, experience_points: 24, holistic_points: 18 }
              as: Reviewer
              as_user_id: "${f2_id}"
            - call: "POST /applications/${app1_id}/screen"
              payload: { decision: "ADVANCE" }
              as: ProgramCoordinator
            - call: "POST /programs/${prog_id}/advance-phase"
              payload: { to_phase: "INTERVIEWS_OPEN" }
              as: ProgramCoordinator
            - call: "POST /interview-waves"
              payload: { program_id: "${prog_id}", wave_index: 1, invite_release_at: "2026-10-01T12:00:00Z", response_deadline_at: "2026-10-08T12:00:00Z", seat_capacity: 4 }
              as: ProgramCoordinator
              captures: { wave1_id: $.data.id }
            - call: "POST /interview-slots"
              payload: { wave_id: "${wave1_id}", start_at: "2026-10-05T13:00:00Z", end_at: "2026-10-05T16:00:00Z", room_label: "A-1", applicant_capacity: 1 }
              as: ProgramCoordinator
              captures: { slot1_id: $.data.id }
            - call: "POST /interview-slots"
              payload: { wave_id: "${wave1_id}", start_at: "2026-10-06T13:00:00Z", end_at: "2026-10-06T16:00:00Z", room_label: "A-2", applicant_capacity: 1 }
              as: ProgramCoordinator
              captures: { slot2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T12:00:00Z" }
              as: NrmpAdmin
            - call: "POST /interview-waves/${wave1_id}/release"
              payload: {}
              as: ProgramCoordinator
              captures: { wave_v1: $.data.version }
            - call: "POST /interview-waves/${wave1_id}/invitations"
              payload: { application_id: "${app1_id}", expected_wave_version: "${wave_v1}" }
              as: ProgramCoordinator
              captures: { inv1_id: $.data.id }
          trigger:
            - call: "POST /interview-invitations/${inv1_id}/accept"
              payload: { slot_id: "${slot1_id}" }
              as: Applicant
              as_user_id: "${cand1_id}"
            - call: "POST /interview-invitations/${inv1_id}/reschedule"
              payload: {}
              as: Applicant
              as_user_id: "${cand1_id}"
            - call: "POST /interview-invitations/${inv1_id}/accept"
              payload: { slot_id: "${slot2_id}" }
              as: Applicant
              as_user_id: "${cand1_id}"
          assert:
            - "before the trigger, InterviewSlot.${slot1_id}.booked_count == 0 and InterviewSlot.${slot2_id}.booked_count == 0, total 0"
            - "after the first accept, InterviewSlot.${slot1_id}.booked_count == 1 and status == BOOKED, InterviewSlot.${slot2_id}.booked_count == 0, total 1"
            - "after the first accept, Application.${app1_id}.interview_status == SCHEDULED"
            - "after the reschedule, InterviewSlot.${slot1_id}.booked_count == 0 and status == OPEN, total 0"
            - "after the reschedule, InterviewInvitation.${inv1_id}.status == ISSUED with slot_id == null and responded_at == null"
            - "after the reschedule, Application.${app1_id}.interview_status == INVITED"
            - "after the second accept, InterviewSlot.${slot2_id}.booked_count == 1 and status == BOOKED, InterviewSlot.${slot1_id}.booked_count == 0 and status == OPEN, total 1"
            - "after the second accept, InterviewInvitation.${inv1_id}.slot_id == ${slot2_id} and Application.${app1_id}.interview_status == SCHEDULED"
