              as: StationGroupNegotiator
              as_user_id: "${st_id}"
              captures: { el_id: "$.data.id" }
            - call: "POST /retrans/elections/${el_id}/file"
              payload: {}
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
            - call: "GET /retrans/elections/${el_id}/negotiations"
              payload: {}
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { neg_id: "$.data[0].id" }
            - call: "POST /retrans/subscriber-reports"
              payload: { station_id: "${st_id}", period_label: "2027-01", period_start_utc: "2027-01-01T00:00:00Z", period_end_utc: "2027-02-01T00:00:00Z", reported_subscriber_count: 100000, excluded_free_trial_count: 0 }
              as: DistributorRep
              as_user_id: "${dist_id}"
              captures: { rep_id: "$.data.id" }
            - call: "POST /retrans/negotiations/${neg_id}/offers"
              payload: { subscriber_report_id: "${rep_id}", base_rate_per_sub_cents: 250, escalator_bp_per_year: 700, term_months: 36, tier: "EXPANDED_BASIC", penetration_commitment_bp: 4200, includes_digital_rights: true, includes_ooh_rights: false, includes_streaming_rights: true }
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
              captures: { off_id: "$.data.id" }
            - call: "GET /retrans/negotiations/${neg_id}"
              payload: {}
              as: GroupCounsel
              as_user_id: "counsel-1"
              captures: { neg_v: "$.data.version" }
            - call: "POST /retrans/offers/${off_id}/accept"
              payload: { expected_negotiation_version: "${neg_v}", effective_start_utc: "2027-01-01T00:00:00Z", effective_end_utc: "2030-01-01T00:00:00Z" }
              as: GroupCounsel
              as_user_id: "counsel-1"
              captures: { agr_id: "$.data.id" }
            - call: "POST /retrans/agreements/${agr_id}/network-approval"
              payload: { decision: "APPROVE", decision_note: "Rights scope within affiliation grant" }
              as: NetworkRepresentative
              as_user_id: "netrep-1"
