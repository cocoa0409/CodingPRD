  # ==========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: reactive_serology_five_hop_recall
        grounds:
          - state_machines.Donor.SCREENING_to_PERMANENTLY_DEFERRED
          - state_machines.Donation.PASTEURIZED_to_RECALLED
          - state_machines.MilkLot.RELEASED_to_RECALLED
          - state_machines.Dispense.DISPENSED_to_RECALLED
          - state_machines.Prescription.FILLED_to_QUEUED
          - entities.DeferralEvent.fields.recalled_donation_count
          - entities.DeferralEvent.fields.quarantined_pool_count
          - entities.DeferralEvent.fields.recalled_lot_count
          - entities.DeferralEvent.fields.recalled_dispense_count
          - entities.DeferralEvent.fields.reversed_subsidy_cents
          - entities.SubsidyProgram.fields.consumed_cents
        distinguishing_aspect: |
          Trigger: a REACTIVE serology panel. Depth 5 — panel -> Donor PERMANENTLY_DEFERRED ->
          Donation RECALLED -> PoolComponent implicated -> MilkLot RECALLED -> Dispense RECALLED
          with the subsidy ledger credited back. Every hop is caused by the previous hop and
          none by the original request; the fifth hop is money, so an implementation that stops
          after recalling donations leaves 1440 cents of charity spend stranded and a FILLED
          prescription that was never actually fed.
        test_recipe:
          setup:
            - "Logical clock is 2026-08-10T10:05:00Z."
            - "Full chain in place: three qualified donors, three accepted shipments, three donations, pool POOL-0001 PASTEURIZED, run PAST-01 BOTTLED with a passing culture, lot 20260810-001-01 RELEASED."
            - "SubsidyProgram SUB-2026 is OPEN with coverage_pct 0.60, annual_cap_cents 100000 and consumed_cents 1440."
            - "Prescription RX-0001 (NICU_INPATIENT / CRITICAL, priority_tier 1, prescribed 450 ml) is FILLED by one 450 ml dispense priced 2400 gross / 1440 subsidy / 960 payer due."
            - "Donor DNR-1001 contributed donation C1 (expressed 2026-07-05), which is inside the 365-day reactive lookback window from 2026-08-10."
