  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: tax_1099_threshold_exact_60000_crosses
        grounds:
          - calculations.thousand_99_check
          - entities.PayoutBatch.fields.requires_1099
          - errors[ERR_TAX_ID_REQUIRED]
        distinguishing_aspect: |
          At gross exactly 60000 cents with prior ytd 0, requires_1099 becomes true
          (>= boundary); a batch grossing 59999 would not. The metric is a cumulative
          dollar threshold on PayoutBatch, reached via POST /payout-batches/{id}/pay.
        test_recipe:
          setup:
            - "Shopper tax_id_on_file=false, ytd 0, reliability 100. One VALIDATED Assignment with location at the shopper's home (travel_distance 0, mileage 0): receipt 48000 (cap 50000) → reimbursable 48000; base_fee 10000 with HIGH bonus 0.20 → fee 12000; amount_cents = 60000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { company_name: "TaxCo", billing_email: "ap@tax.test", fee_per_completed_shop_cents: 15000 }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/locations"
              payload: { label: "TL", lat: 40.0, lng: -74.0, scenario_family: "RETAIL" }
              as: ClientManager
              as_user_id: "${client_id}"
