          - entities.TrustLedgerEntry.fields.basis_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order: the
          holdback tier keys on net_before_holdback (basis 125000 @20% commission ->
          net exactly 100000 == HOLDBACK_TIER_THRESHOLD -> 10% tier -> remittance
          90000); keying the tier on the final remittance (90000 < 100000) would
