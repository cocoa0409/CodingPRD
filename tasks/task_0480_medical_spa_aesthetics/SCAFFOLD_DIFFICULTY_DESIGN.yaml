              as: ClinicAdmin
              captures: { cy_lot: $.data.id }
            - call: "POST /aesthetics/patients"
              payload: { full_name: "Cyc Pat", date_of_birth: "1992-04-04T00:00:00Z" }
              as: ClinicAdmin
              captures: { cy_pat: $.data.id }
            - call: "POST /aesthetics/consent-photos"
              payload: { patient_id: "${cy_pat}", kind: "CONSENT", storage_uri: "s3://cy-c", signed: true }
              as: Provider
              as_user_id: "${cy_inj}"
            - call: "POST /aesthetics/consultations"
              payload: { patient_id: "${cy_pat}", exam_provider_id: "${cy_inj}", chief_complaint: "brow" }
              as: Provider
              as_user_id: "${cy_inj}"
              captures: { cy_cons: $.data.id }
            - call: "POST /aesthetics/consultations/${cy_cons}/complete-exam"
              payload: {}
              as: Provider
              as_user_id: "${cy_inj}"
            - call: "POST /aesthetics/standing-orders"
              payload: { consultation_id: "${cy_cons}", director_provider_id: "${cy_dir}", product: "BOTOX", max_units_authorized: 30, valid_until_utc: "2026-12-01T00:00:00Z" }
              as: Provider
              as_user_id: "${cy_dir}"
              captures: { cy_so: $.data.id }
            - call: "POST /aesthetics/treatment-plans"
              payload: { patient_id: "${cy_pat}", consultation_id: "${cy_cons}", product: "BOTOX", planned_sessions: 1, planned_units_per_session: 20, list_price_per_unit_cents: 1000, required_deposit_cents: 0 }
              as: Provider
              as_user_id: "${cy_inj}"
              captures: { cy_plan: $.data.id, cy_plan_v: $.data.version }
            - call: "POST /aesthetics/treatment-plans/${cy_plan}/activate"
              payload: { expected_treatment_plan_version: "${cy_plan_v}" }
              as: Provider
              as_user_id: "${cy_inj}"
              captures: { cy_plan_v2: $.data.version }
            - call: "POST /aesthetics/treatment-sessions"
              payload: { treatment_plan_id: "${cy_plan}", standing_order_id: "${cy_so}", injector_provider_id: "${cy_inj}", injectable_lot_id: "${cy_lot}", planned_units: 20, expected_treatment_plan_version: "${cy_plan_v2}" }
              as: Provider
              as_user_id: "${cy_inj}"
              captures: { cy_sess: $.data.id }
            - call: "POST /aesthetics/consent-photos"
              payload: { patient_id: "${cy_pat}", treatment_session_id: "${cy_sess}", kind: "BEFORE", storage_uri: "s3://cy-b" }
              as: Provider
              as_user_id: "${cy_inj}"
            - call: "POST /aesthetics/treatment-sessions/${cy_sess}/commit"
              payload: {}
              as: Provider
              as_user_id: "${cy_inj}"
