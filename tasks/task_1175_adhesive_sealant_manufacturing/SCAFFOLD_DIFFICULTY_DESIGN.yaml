              payload: { to_iso8601: "2026-05-01T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/packaging-runs/${run_id}/exposure-events"
              payload: { exposure_minutes: 45, occurred_at: "2026-05-01T08:45:00Z", note: "door left open" }
              as: BatchOperator
          assert:
            - "hop 1: PackagingRun.${run_id}.status == HOLD AND held_from == SEALED"
            - "hop 2: ProductionLot.${lot_id}.hold_status == QUARANTINE_HOLD AND units_quarantined == 3"
            - "hop 3: Shipment.${ship_id}.status == EXCEPTION (cascade reached a different aggregate)"
            - "ProductionLot.${lot_id}.qa_status == RELEASED (unaffected dimension)"

