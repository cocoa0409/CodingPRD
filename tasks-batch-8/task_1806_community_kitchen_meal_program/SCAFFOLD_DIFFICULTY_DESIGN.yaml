              as: KitchenManager
              captures: { s1fs: $.data.id }
            - call: "POST /kitchen/volunteer-shifts"
              payload: { site_id: "${s1}", volunteer_id: "${vol_id}", menu_day_id: "${d1f}", role_on_shift: "SERVER", starts_at: "2026-08-21T10:00:00Z", ends_at: "2026-08-21T14:00:00Z" }
              as: KitchenManager
