            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Train Set", min_age_months: 12, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 12, retail_value_cents: 10000, replacement_value_cents: 8000 }
              as: PlatformAdmin
              captures: { ci_id: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_id}/copies"
              payload: { barcode: "BC-DISP-1", condition_grade: "NEW" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /toy-rental/subscriptions/${s_id}/rotation-boxes"
              payload: { expected_subscription_version: "${s_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /toy-rental/rotation-boxes/${b_id}/items"
              payload: { toy_copy_id: "${c1}", expected_rotation_box_version: "${b_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { it_id: $.data.id }
            - call: "POST /toy-rental/rotation-boxes/${b_id}/ship"
              payload: { carrier: "UPS", tracking_number: "1Z-DISP-OUT" }
              as: OperationsManager
              captures: { sh_out: $.data.id }
            - call: "POST /toy-rental/shipments/${sh_out}/events"
              payload: { event_type: "IN_TRANSIT", occurred_at: "2026-05-02T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/shipments/${sh_out}/events"
              payload: { event_type: "DELIVERED", occurred_at: "2026-05-03T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/box-items/${it_id}/report-lost"
              payload: { note: "lost in the park" }
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /toy-rental/box-items/${it_id}/fees"
              as: Member
              as_user_id: "${m_id}"
              captures: { f_id: "$.data[0].id" }
          trigger:
            - call: "POST /toy-rental/fees/${f_id}/dispute"
              payload: { reason: "not lost" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/fees/${f_id}/resolve-dispute"
              payload: { outcome: "UPHELD" }
              as: CustomerService
            - call: "POST /toy-rental/fees/${f_id}/dispute"
              payload: { reason: "still disputing" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/fees/${f_id}/resolve-dispute"
              payload: { outcome: "UPHELD" }
              as: CustomerService
            - call: "POST /toy-rental/fees/${f_id}/dispute"
              payload: { reason: "third attempt" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "FeeAssessment.${f_id} cycled INVOICED -> DISPUTED -> INVOICED -> DISPUTED -> INVOICED (dispute_rounds == 2)"
            - "Third dispute: err == ERR_DISPUTE_LIMIT_REACHED (HTTP 422); fee remains INVOICED with amount_cents == 8000"
            - "FeeAssessment.${f_id}.fee_type == LOSS and box_item_id == ${it_id}"

  # =====================================================================
  # Rule 4 — transitive_cascade (different triggers, depth >= 3 and >= 2)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: swap_release_promotes_waiting_hold
        grounds:
          - state_machines.BoxItem.PENDING_RETURN_to_SWAPPED_OUT
          - state_machines.ToyCopy.RESERVED_to_AVAILABLE
          - state_machines.WishlistEntry.WAITING_to_HELD
          - calculations.wishlist_allocation_selector
        distinguishing_aspect: |
          Depth-3 chain triggered by SWAP: swap mutates the old BoxItem and
          releases copy C1 (link 1); C1 becoming AVAILABLE fires the targeted
          allocation sweep (link 2); the sweep promotes member B's WAITING
          entry to HELD and re-reserves C1 under B (link 3). Each link is
          caused by the previous mutation, not by the swap call directly.
        test_recipe:
          setup:
            - "Plan STD (toys_per_box 2, swap_allowance 2, max_holds 2); catalog item X age [12,36] with NEW copies C1, C2; catalog item Y age [12,36] with NEW copy C3"
            - "Member A (child born 2025-01-15) has a PLANNED box holding C1; member B (child born 2025-01-15) has a WAITING wishlist entry on item X, rank 1"
            - "No allocation run has executed, so C2 remains AVAILABLE and B's entry is still WAITING"
            - "Clock at default 2026-05-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Xylophone", min_age_months: 12, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 6, retail_value_cents: 5000, replacement_value_cents: 4000 }
              as: PlatformAdmin
              captures: { ci_x: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_x}/copies"
              payload: { barcode: "BC-SWP-X1", condition_grade: "NEW" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_x}/copies"
              payload: { barcode: "BC-SWP-X2", condition_grade: "NEW" }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Yo-yo", min_age_months: 12, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 1, retail_value_cents: 1000, replacement_value_cents: 800 }
              as: PlatformAdmin
              captures: { ci_y: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_y}/copies"
              payload: { barcode: "BC-SWP-Y3", condition_grade: "NEW" }
              as: PlatformAdmin
              captures: { c3: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.a@x.com", full_name: "Member A", password: "pw" }
              as: Anonymous
              captures: { m_a: $.data.id }
            - call: "POST /toy-rental/members/${m_a}/children"
              payload: { name: "KidA", birthdate: "2025-01-15" }
              as: Member
              as_user_id: "${m_a}"
            - call: "POST /toy-rental/members/${m_a}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_a}"
              captures: { s_a: $.data.id, s_a_v: $.data.version }
            - call: "POST /toy-rental/subscriptions/${s_a}/rotation-boxes"
              payload: { expected_subscription_version: "${s_a_v}" }
              as: Member
              as_user_id: "${m_a}"
              captures: { b_a: $.data.id, b_a_v: $.data.version }
            - call: "POST /toy-rental/rotation-boxes/${b_a}/items"
              payload: { toy_copy_id: "${c1}", expected_rotation_box_version: "${b_a_v}" }
              as: Member
              as_user_id: "${m_a}"
              captures: { it_a1: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.b@x.com", full_name: "Member B", password: "pw" }
              as: Anonymous
              captures: { m_b: $.data.id }
            - call: "POST /toy-rental/members/${m_b}/children"
              payload: { name: "KidB", birthdate: "2025-01-15" }
              as: Member
              as_user_id: "${m_b}"
            - call: "POST /toy-rental/members/${m_b}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_b}"
            - call: "POST /toy-rental/members/${m_b}/wishlist-entries"
              payload: { catalog_item_id: "${ci_x}", rank: 1 }
              as: Member
              as_user_id: "${m_b}"
              captures: { e_b: $.data.id }
          trigger:
            - call: "POST /toy-rental/box-items/${it_a1}/swap"
              payload: { new_toy_copy_id: "${c3}" }
              as: Member
              as_user_id: "${m_a}"
              captures: { it_new: $.data.id }
            - call: "GET /toy-rental/copies/${c1}"
              as: OperationsManager
            - call: "GET /toy-rental/members/${m_b}/wishlist-entries"
              as: Member
              as_user_id: "${m_b}"
          assert:
            - "Link 1: old BoxItem.${it_a1}.loan_status == SWAPPED_OUT; replacement BoxItem.${it_new}.swapped_from_item_id == ${it_a1}; RotationBox.${b_a}.swap_count == 1"
            - "Link 2+3: ToyCopy.${c1}.status == RESERVED with reserved_member_id == ${m_b} (released then immediately re-reserved by the sweep)"
            - "WishlistEntry.${e_b}.status == HELD, held_copy_id == ${c1}, hold_expires_at == 2026-05-04T00:00:00Z (clock 2026-05-01 + 72h)"
            - "ToyCopy.${c3}.status == RESERVED with reserved_member_id == ${m_a}; ToyCopy.${c2} remains AVAILABLE (sweep consumed exactly one copy)"

      - name: inspection_damage_suspension_cascade
        grounds:
          - state_machines.RotationBox.RECEIVED_to_INSPECTED
          - state_machines.FeeAssessment.transitions
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - calculations.wallet_balance_reconciliation
          - calculations.inspection_fee_aggregation
        distinguishing_aspect: |
          Depth-4 chain triggered by INSPECT (different trigger from swap):
          inspection mutates the BoxItem (link 1); item damage creates a
          FeeAssessment INVOICED (link 2); the fee appends a FEE_CHARGE ledger
          entry and recomputes the wallet (link 3); the wallet crossing -5000
          flips Member ACTIVE -> SUSPENDED (link 4), which then gates further
          member mutations with ERR_MEMBER_SUSPENDED.
        test_recipe:
          setup:
            - "Plan STD; member M (wallet 0); child born 2025-01-15; catalog item replacement 8000 age [12,36]; NEW copy"
            - "Box delivered 2026-05-03, return received 2026-05-10 (on time); inspection records SEVERE damage -> fee round_half_up(8000*0.75) == 6000"
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.susp@x.com", full_name: "Susp Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /toy-rental/members/${m_id}/children"
              payload: { name: "Kid", birthdate: "2025-01-15" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Drum", min_age_months: 12, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 3, retail_value_cents: 10000, replacement_value_cents: 8000 }
              as: PlatformAdmin
              captures: { ci_id: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_id}/copies"
              payload: { barcode: "BC-SUSP-1", condition_grade: "NEW" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /toy-rental/subscriptions/${s_id}/rotation-boxes"
              payload: { expected_subscription_version: "${s_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /toy-rental/rotation-boxes/${b_id}/items"
              payload: { toy_copy_id: "${c1}", expected_rotation_box_version: "${b_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { it_id: $.data.id }
            - call: "POST /toy-rental/rotation-boxes/${b_id}/ship"
              payload: { carrier: "UPS", tracking_number: "1Z-SUSP-OUT" }
              as: OperationsManager
              captures: { sh_out: $.data.id }
            - call: "POST /toy-rental/shipments/${sh_out}/events"
              payload: { event_type: "IN_TRANSIT", occurred_at: "2026-05-02T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/shipments/${sh_out}/events"
              payload: { event_type: "DELIVERED", occurred_at: "2026-05-03T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/rotation-boxes/${b_id}/initiate-return"
              payload: { carrier: "UPS", tracking_number: "1Z-SUSP-RET" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sh_ret: $.data.id }
            - call: "POST /toy-rental/shipments/${sh_ret}/events"
              payload: { event_type: "IN_TRANSIT", occurred_at: "2026-05-09T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/shipments/${sh_ret}/events"
              payload: { event_type: "DELIVERED", occurred_at: "2026-05-10T00:00:00Z" }
              as: OperationsManager
          trigger:
            - call: "POST /toy-rental/rotation-boxes/${b_id}/inspect"
              payload:
                items:
                  - { box_item_id: "${it_id}", condition_returned: "WORN", damage_severity: "SEVERE", missing_piece_count: 0, disposition: "RESTOCK" }
              as: OperationsManager
            - call: "GET /toy-rental/members/${m_id}"
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /toy-rental/subscriptions/${s_id}"
              as: Member
              as_user_id: "${m_id}"
              captures: { s_v_now: $.data.version }
            - call: "POST /toy-rental/subscriptions/${s_id}/rotation-boxes"
              payload: { expected_subscription_version: "${s_v_now}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Link 2: a DAMAGE FeeAssessment amount_cents == 6000 (round_half_up(8000*0.75)) status INVOICED exists for BoxItem.${it_id}"
            - "Link 3: Member.${m_id}.wallet_credit_cents == -6000 (single FEE_CHARGE ledger append)"
            - "Link 4: Member.${m_id}.status == SUSPENDED (-6000 < -5000 threshold)"
            - "Gated op: next box create with the current subscription version fails err == ERR_MEMBER_SUSPENDED (HTTP 409)"
            - "ToyCopy.${c1}.status == SANITIZING with condition_grade degraded to WORN; RotationBox.${b_id}.status == INSPECTED"

  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: fee_pay_state_trumps_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_FEE_NOT_INVOICED]
          - errors[ERR_WALLET_INSUFFICIENT]
        distinguishing_aspect: |
          Category pair STATE vs BUSINESS_FISCAL: the pay call violates both
          (fee already WAIVED; wallet -50 < 600 insufficient) and the
          priority-5 state error ERR_FEE_NOT_INVOICED must surface, not the
          priority-10 fiscal error.
        test_recipe:
          setup:
            - "Plan STD; member M with child born 2025-01-15; catalog item replacement 600 age [12,36]; NEW copy; box delivered 2026-05-03"
            - "Item reported lost -> LOSS fee 600 INVOICED, wallet -600; CustomerService waives the fee (wallet back to 0, fee WAIVED); SUPPORT_ADJUSTMENT -50 leaves wallet -50 (insufficient for a 600 wallet payment)"
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.conf1@x.com", full_name: "Conf Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /toy-rental/members/${m_id}/children"
              payload: { name: "Kid", birthdate: "2025-01-15" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Rattle", min_age_months: 12, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 2, retail_value_cents: 1000, replacement_value_cents: 600 }
              as: PlatformAdmin
              captures: { ci_id: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_id}/copies"
              payload: { barcode: "BC-CONF-1", condition_grade: "NEW" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /toy-rental/subscriptions/${s_id}/rotation-boxes"
              payload: { expected_subscription_version: "${s_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /toy-rental/rotation-boxes/${b_id}/items"
              payload: { toy_copy_id: "${c1}", expected_rotation_box_version: "${b_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { it_id: $.data.id }
            - call: "POST /toy-rental/rotation-boxes/${b_id}/ship"
              payload: { carrier: "UPS", tracking_number: "1Z-CONF-OUT" }
              as: OperationsManager
              captures: { sh_out: $.data.id }
            - call: "POST /toy-rental/shipments/${sh_out}/events"
              payload: { event_type: "IN_TRANSIT", occurred_at: "2026-05-02T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/shipments/${sh_out}/events"
              payload: { event_type: "DELIVERED", occurred_at: "2026-05-03T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/box-items/${it_id}/report-lost"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /toy-rental/box-items/${it_id}/fees"
              as: Member
              as_user_id: "${m_id}"
              captures: { f_id: "$.data[0].id" }
            - call: "POST /toy-rental/fees/${f_id}/waive"
              payload: { reason: "goodwill" }
              as: CustomerService
            - call: "POST /toy-rental/members/${m_id}/wallet/adjustments"
              payload: { amount_cents: -50, reason: "SUPPORT_ADJUSTMENT", note: "clawback" }
              as: CustomerService
          trigger:
            - call: "POST /toy-rental/fees/${f_id}/pay"
              payload: { payment_source: "WALLET_CREDIT" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FEE_NOT_INVOICED (HTTP 409): the priority-5 STATE violation beats the priority-10 BUSINESS_FISCAL violation"
            - "FeeAssessment.${f_id}.status remains WAIVED; Member.${m_id}.wallet_credit_cents remains -50 (no ledger entries appended by the rejected pay)"

      - name: item_add_safety_trumps_capacity
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_AGE_INCOMPATIBLE]
          - errors[ERR_SLOT_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Category pair BUSINESS_SAFETY vs BUSINESS_CONSTRAINT (different pair
          from state-vs-fiscal): adding an age-incompatible copy to an already
          full box violates both rules, and the priority-6 safety error
          ERR_AGE_INCOMPATIBLE must surface, not ERR_SLOT_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Plan SOLO (toys_per_box 1, swap_allowance 1, max_holds 1); member M with child born 2025-01-15 (calendar age 15 months)"
