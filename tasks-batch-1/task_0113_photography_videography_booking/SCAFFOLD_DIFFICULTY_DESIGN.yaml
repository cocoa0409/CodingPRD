scaffold_difficulty_design:

  # ===================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cancellation_fee_forward_looking_lead_time_on_booking
        grounds:
          - calculations.cancellation_fee
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - entities.Booking.fields.cancellation_fee_cents
        distinguishing_aspect: |
          The cancellation fee on a CONFIRMED Booking is forward-looking against the live clock:
          the SAME booking (deposit_due_cents=30000) yields 7500 when cancelled at lead>=14 days
          but 15000 at 7<=lead<14 days — the variant is selected from current_utc, an entity
          domain (Booking lifecycle) distinct from the LicenseGrant fee instance below.
        test_recipe:
          setup:
            - "PORTRAIT BASIC package (base 100000, included 2h, overage 12000, edited 30, deposit_pct 0.30, no model release)."
            - "Booking requested 2h (no overage) confirmed via signed contract + scheduled shoot starting 2026-07-20T10:00Z; total_fee_cents=100000, deposit_due_cents=30000."
            - "Clock at 2026-07-01T00:00:00Z (lead 19 days)."
          setup_api_calls:
            - call: "POST /studio/clients"
              payload: { email: "c1@x.com", full_name: "C One", phone: "100" }
              as: StudioAdmin
              captures: { c1: $.data.id }
            - call: "POST /studio/photographers"
              payload: { email: "p1@x.com", full_name: "P One", skills: ["PHOTO"], hourly_rate_cents: 8000 }
              as: StudioAdmin
              captures: { p1: $.data.id }
            - call: "POST /studio/session-packages"
              payload: { name: "Portrait Basic", session_type: "PORTRAIT", tier: "BASIC", base_fee_cents: 100000, included_shoot_hours: 2, overage_hourly_rate_cents: 12000, included_edited_images: 30, deposit_pct: 0.30, requires_model_release: false, active: true }
              as: StudioAdmin
              captures: { pkg: $.data.id }
            - call: "POST /studio/bookings"
              payload: { client_id: "${c1}", package_id: "${pkg}", lead_photographer_id: "${p1}", requested_shoot_hours: 2 }
              as: Client
              as_user_id: "${c1}"
              captures: { bk: $.data.id }
            - call: "POST /studio/contracts"
              payload: { booking_id: "${bk}", includes_model_release: false }
              as: StudioAdmin
              captures: { ct: $.data.id }
            - call: "POST /studio/contracts/${ct}/send"
              payload: {}
              as: StudioAdmin
            - call: "POST /studio/contracts/${ct}/sign"
              payload: {}
              as: Client
              as_user_id: "${c1}"
            - call: "POST /studio/shoot-schedules"
              payload: { booking_id: "${bk}", start_utc: "2026-07-20T10:00:00Z", end_utc: "2026-07-20T12:00:00Z" }
              as: StudioAdmin
              captures: { sch: $.data.id }
            - call: "POST /studio/bookings/${bk}/confirm"
              payload: {}
              as: Client
              as_user_id: "${c1}"
              captures: { dep_due: $.data.deposit_due_cents }
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StudioAdmin
          trigger:
            - call: "POST /studio/bookings/${bk}/cancel"
              payload: {}
              as: Client
              as_user_id: "${c1}"
              captures: { fee: $.data.cancellation_fee_cents }
          assert:
            - "Booking.${bk}.cancellation_fee_cents == 7500"
            - "Booking.${bk}.workflow_status == CANCELLED"

      - name: license_fee_perpetual_vs_term_on_license_grant
        grounds:
          - calculations.license_fee
          - entities.LicenseGrant.fields.fee_cents
          - state_machines.Booking.SHOT_to_DELIVERED
        distinguishing_aspect: |
          The LicenseGrant fee diverges by term variant on a different entity domain (LicenseGrant):
          COMMERCIAL/NATIONAL/24mo -> 90000 (term_factor 1.2) while EXCLUSIVE/WORLDWIDE/perpetual(0mo)
          -> 264000 (term treated as 60mo, term_factor 1.5). Distinct from the Booking-clock cancellation variant.
        test_recipe:
          setup:
            - "A booking exists (any DRAFT booking suffices; license grants do not require a state precondition on the booking)."
          setup_api_calls:
            - call: "POST /studio/clients"
              payload: { email: "c2@x.com", full_name: "C Two", phone: "200" }
              as: StudioAdmin
              captures: { c2: $.data.id }
            - call: "POST /studio/photographers"
              payload: { email: "p2@x.com", full_name: "P Two", skills: ["PHOTO","VIDEO"], hourly_rate_cents: 9000 }
              as: StudioAdmin
              captures: { p2: $.data.id }
            - call: "POST /studio/session-packages"
              payload: { name: "Commercial Std", session_type: "COMMERCIAL", tier: "STANDARD", base_fee_cents: 300000, included_shoot_hours: 4, overage_hourly_rate_cents: 20000, included_edited_images: 50, deposit_pct: 0.30, requires_model_release: true, active: true }
              as: StudioAdmin
              captures: { pkg2: $.data.id }
            - call: "POST /studio/bookings"
              payload: { client_id: "${c2}", package_id: "${pkg2}", lead_photographer_id: "${p2}", requested_shoot_hours: 4 }
              as: Client
              as_user_id: "${c2}"
              captures: { bk2: $.data.id }
          trigger:
            - call: "POST /studio/bookings/${bk2}/license-grants"
              payload: { usage_scope: "COMMERCIAL", territory: "NATIONAL", term_months: 24 }
              as: StudioAdmin
              captures: { lic_term: $.data.id, fee_term: $.data.fee_cents }
            - call: "POST /studio/bookings/${bk2}/license-grants"
              payload: { usage_scope: "EXCLUSIVE", territory: "WORLDWIDE", term_months: 0 }
              as: StudioAdmin
              captures: { lic_perp: $.data.id, fee_perp: $.data.fee_cents }
          assert:
            - "LicenseGrant.${lic_term}.fee_cents == 90000"
            - "LicenseGrant.${lic_perp}.fee_cents == 264000"

  # ===================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: booking_total_three_inputs_nonlinear_overage_plus_shooter
        # mode (a): >=3 inputs with non-linear interaction (ceil overage + ASSIGNED-shooter sum + base)
        grounds:
          - calculations.booking_total_fee
          - calculations.second_shooter_fee
          - entities.Booking.fields.total_fee_cents
          - state_machines.Booking.DRAFT_to_CONFIRMED
        distinguishing_aspect: |
          total_fee_cents combines >=3 inputs non-linearly: base_fee + ceil(requested-included)*overage_rate
          + sum of ASSIGNED second-shooter fees. requested 8h vs included 6h -> ceil(2)*15000=30000;
          one 4h second shooter @8000 -> 32000; total = 200000+30000+32000 = 262000. Mode (a).
        test_recipe:
          setup:
            - "STANDARD WEDDING package (base 200000, included 6h, overage 15000, edited 100, deposit_pct 0.30, model release required)."
            - "Booking requested 8h (2h overage). Confirmed (contract signed incl. model release, shoot scheduled 4h window 2026-07-01T14:00Z-18:00Z)."
            - "One second shooter (hourly_rate 8000) assigned to the 4h window after confirm."
          setup_api_calls:
            - call: "POST /studio/clients"
              payload: { email: "c3@x.com", full_name: "C Three", phone: "300" }
              as: StudioAdmin
              captures: { c3: $.data.id }
            - call: "POST /studio/photographers"
              payload: { email: "p3lead@x.com", full_name: "Lead 3", skills: ["PHOTO"], hourly_rate_cents: 12000 }
              as: StudioAdmin
              captures: { lead3: $.data.id }
            - call: "POST /studio/photographers"
              payload: { email: "p3second@x.com", full_name: "Second 3", skills: ["PHOTO"], hourly_rate_cents: 8000 }
              as: StudioAdmin
              captures: { second3: $.data.id }
            - call: "POST /studio/session-packages"
              payload: { name: "Wedding Std", session_type: "WEDDING", tier: "STANDARD", base_fee_cents: 200000, included_shoot_hours: 6, overage_hourly_rate_cents: 15000, included_edited_images: 100, deposit_pct: 0.30, requires_model_release: true, active: true }
              as: StudioAdmin
              captures: { pkg3: $.data.id }
            - call: "POST /studio/bookings"
              payload: { client_id: "${c3}", package_id: "${pkg3}", lead_photographer_id: "${lead3}", requested_shoot_hours: 8 }
              as: Client
              as_user_id: "${c3}"
              captures: { bk3: $.data.id }
            - call: "POST /studio/contracts"
              payload: { booking_id: "${bk3}", includes_model_release: true }
              as: StudioAdmin
              captures: { ct3: $.data.id }
            - call: "POST /studio/contracts/${ct3}/send"
              payload: {}
              as: StudioAdmin
            - call: "POST /studio/contracts/${ct3}/sign"
              payload: {}
              as: Client
              as_user_id: "${c3}"
            - call: "POST /studio/shoot-schedules"
              payload: { booking_id: "${bk3}", start_utc: "2026-07-01T14:00:00Z", end_utc: "2026-07-01T18:00:00Z" }
              as: StudioAdmin
              captures: { sch3: $.data.id, sch3_v: $.data.version }
            - call: "POST /studio/bookings/${bk3}/confirm"
              payload: {}
              as: Client
              as_user_id: "${c3}"
          trigger:
            - call: "POST /studio/shoot-schedules/${sch3}/second-shooter-assignments"
              payload: { photographer_id: "${second3}", expected_shoot_schedule_version: "${sch3_v}" }
              as: StudioAdmin
              captures: { asg3: $.data.id, asg_fee: $.data.assignment_fee_cents }
          assert:
            - "SecondShooterAssignment.${asg3}.billable_hours == 4"
            - "SecondShooterAssignment.${asg3}.assignment_fee_cents == 32000"
            - "Booking.${bk3}.total_fee_cents == 262000"

      - name: addon_print_round_per_tier_then_sum
        # mode (b): nested rounding where order matters (round per tier then sum)
        grounds:
          - calculations.addon_line_total
          - entities.AddOnOrder.fields.line_total_cents
          - concurrency_rules[addon-order-stale-booking]
        distinguishing_aspect: |
          PRINT pricing rounds EACH marginal tier subtotal to whole cents then sums the tiers
          (pinned order). 60 prints @500: t1=10->5000, t2=40->round(18000.0)=18000, t3=10->round(4000.0)=4000,
          line_total=27000. This is mode (b) nested rounding-order, distinct from instance-1's mode (a).
        test_recipe:
          setup:
            - "A DRAFT booking on PORTRAIT BASIC (base 100000) exists; booking.version observed."
          setup_api_calls:
            - call: "POST /studio/clients"
              payload: { email: "c4@x.com", full_name: "C Four", phone: "400" }
              as: StudioAdmin
              captures: { c4: $.data.id }
            - call: "POST /studio/photographers"
              payload: { email: "p4@x.com", full_name: "P Four", skills: ["PHOTO"], hourly_rate_cents: 7000 }
              as: StudioAdmin
              captures: { p4: $.data.id }
            - call: "POST /studio/session-packages"
              payload: { name: "Portrait Basic 4", session_type: "PORTRAIT", tier: "BASIC", base_fee_cents: 100000, included_shoot_hours: 2, overage_hourly_rate_cents: 12000, included_edited_images: 30, deposit_pct: 0.30, requires_model_release: false, active: true }
              as: StudioAdmin
              captures: { pkg4: $.data.id }
            - call: "POST /studio/bookings"
              payload: { client_id: "${c4}", package_id: "${pkg4}", lead_photographer_id: "${p4}", requested_shoot_hours: 2 }
              as: Client
              as_user_id: "${c4}"
              captures: { bk4: $.data.id, bk4_v: $.data.version }
          trigger:
            - call: "POST /studio/bookings/${bk4}/add-on-orders"
              payload: { line_kind: "PRINT", quantity: 60, unit_price_cents: 500, expected_booking_version: "${bk4_v}" }
              as: Client
              as_user_id: "${c4}"
              captures: { ao4: $.data.id, ao4_total: $.data.line_total_cents }
          assert:
            - "AddOnOrder.${ao4}.line_total_cents == 27000"
            - "Booking.${bk4}.total_fee_cents == 127000"

  # ===================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: gallery_cyclic_proofing_revision_loop
        grounds:
          - state_machines.Gallery.PROOFING_to_REVISION_REQUESTED
          - state_machines.Gallery.REVISION_REQUESTED_to_PROOFING
          - entities.Gallery.fields.revision_round
        distinguishing_aspect: |
          Gallery follows a cycle PROOFING -> REVISION_REQUESTED -> PROOFING; each return upload bumps
          revision_round (0 -> 1). The cycle lives on Gallery, distinct from the Booking branching machine.
        test_recipe:
          setup:
            - "Booking SHOT (PORTRAIT BASIC, edited=30), Gallery uploaded with 30 images -> PROOFING."
          setup_api_calls:
            - call: "POST /studio/clients"
              payload: { email: "c5@x.com", full_name: "C Five", phone: "500" }
              as: StudioAdmin
              captures: { c5: $.data.id }
            - call: "POST /studio/photographers"
              payload: { email: "p5@x.com", full_name: "P Five", skills: ["PHOTO"], hourly_rate_cents: 7000 }
              as: StudioAdmin
              captures: { p5: $.data.id }
            - call: "POST /studio/session-packages"
              payload: { name: "Portrait Basic 5", session_type: "PORTRAIT", tier: "BASIC", base_fee_cents: 100000, included_shoot_hours: 2, overage_hourly_rate_cents: 12000, included_edited_images: 30, deposit_pct: 0.30, requires_model_release: false, active: true }
              as: StudioAdmin
              captures: { pkg5: $.data.id }
            - call: "POST /studio/bookings"
              payload: { client_id: "${c5}", package_id: "${pkg5}", lead_photographer_id: "${p5}", requested_shoot_hours: 2 }
              as: Client
              as_user_id: "${c5}"
              captures: { bk5: $.data.id }
            - call: "POST /studio/contracts"
              payload: { booking_id: "${bk5}" }
              as: StudioAdmin
              captures: { ct5: $.data.id }
            - call: "POST /studio/contracts/${ct5}/send"
              payload: {}
              as: StudioAdmin
            - call: "POST /studio/contracts/${ct5}/sign"
              payload: {}
              as: Client
              as_user_id: "${c5}"
            - call: "POST /studio/shoot-schedules"
              payload: { booking_id: "${bk5}", start_utc: "2026-07-01T10:00:00Z", end_utc: "2026-07-01T12:00:00Z" }
              as: StudioAdmin
              captures: { sch5: $.data.id }
            - call: "POST /studio/bookings/${bk5}/confirm"
              payload: {}
              as: Client
              as_user_id: "${c5}"
              captures: { dep5: $.data.deposit_due_cents }
            - call: "POST /studio/payments"
              payload: { booking_id: "${bk5}", kind: "DEPOSIT", amount_cents: 30000 }
              as: StudioAdmin
              captures: { pay5: $.data.id }
            - call: "POST /studio/payments/${pay5}/settle"
              payload: {}
              as: StudioAdmin
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T12:30:00Z" }
              as: StudioAdmin
            - call: "POST /studio/shoot-schedules/${sch5}/complete"
              payload: {}
              as: Photographer
              as_user_id: "${p5}"
            - call: "POST /studio/galleries"
              payload: { booking_id: "${bk5}" }
              as: Photographer
              as_user_id: "${p5}"
              captures: { gal5: $.data.id }
            - call: "POST /studio/galleries/${gal5}/upload"
              payload: { delivered_image_count: 30 }
              as: Photographer
              as_user_id: "${p5}"
          trigger:
            - call: "POST /studio/galleries/${gal5}/request-revision"
              payload: {}
              as: Client
              as_user_id: "${c5}"
            - call: "POST /studio/galleries/${gal5}/upload"
              payload: { delivered_image_count: 32 }
              as: Photographer
              as_user_id: "${p5}"
              captures: { gal5_round: $.data.revision_round }
          assert:
            - "Gallery.${gal5}.status == PROOFING"
            - "Gallery.${gal5}.revision_round == 1"

      - name: booking_branching_confirmed_to_shot_or_cancelled
        grounds:
          - state_machines.Booking.CONFIRMED_to_SHOT
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - entities.Booking.fields.workflow_status
        distinguishing_aspect: |
          From CONFIRMED the Booking branches to either SHOT (shoot completed) or CANCELLED, with
          divergent side-effect sets (SHOT advances workflow only; CANCELLED fires the cancel cascade).
          This branching machine lives on Booking, a different entity from Gallery.
        test_recipe:
          setup:
            - "Two sibling CONFIRMED + DEPOSIT_PAID bookings on PORTRAIT BASIC; one completes its shoot, the other cancels."
          setup_api_calls:
            - call: "POST /studio/clients"
              payload: { email: "c6@x.com", full_name: "C Six", phone: "600" }
              as: StudioAdmin
              captures: { c6: $.data.id }
            - call: "POST /studio/photographers"
              payload: { email: "p6@x.com", full_name: "P Six", skills: ["PHOTO"], hourly_rate_cents: 7000 }
              as: StudioAdmin
              captures: { p6: $.data.id }
            - call: "POST /studio/session-packages"
              payload: { name: "Portrait Basic 6", session_type: "PORTRAIT", tier: "BASIC", base_fee_cents: 100000, included_shoot_hours: 2, overage_hourly_rate_cents: 12000, included_edited_images: 30, deposit_pct: 0.30, requires_model_release: false, active: true }
              as: StudioAdmin
              captures: { pkg6: $.data.id }
            - call: "POST /studio/bookings"
              payload: { client_id: "${c6}", package_id: "${pkg6}", lead_photographer_id: "${p6}", requested_shoot_hours: 2 }
              as: Client
              as_user_id: "${c6}"
              captures: { bk6: $.data.id }
            - call: "POST /studio/contracts"
              payload: { booking_id: "${bk6}" }
              as: StudioAdmin
              captures: { ct6: $.data.id }
            - call: "POST /studio/contracts/${ct6}/send"
              payload: {}
              as: StudioAdmin
            - call: "POST /studio/contracts/${ct6}/sign"
              payload: {}
              as: Client
              as_user_id: "${c6}"
            - call: "POST /studio/shoot-schedules"
              payload: { booking_id: "${bk6}", start_utc: "2026-07-05T10:00:00Z", end_utc: "2026-07-05T12:00:00Z" }
              as: StudioAdmin
              captures: { sch6: $.data.id }
            - call: "POST /studio/bookings/${bk6}/confirm"
              payload: {}
              as: Client
              as_user_id: "${c6}"
            - call: "POST /studio/payments"
              payload: { booking_id: "${bk6}", kind: "DEPOSIT", amount_cents: 30000 }
              as: StudioAdmin
              captures: { pay6: $.data.id }
            - call: "POST /studio/payments/${pay6}/settle"
              payload: {}
              as: StudioAdmin
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T12:30:00Z" }
              as: StudioAdmin
          trigger:
            - call: "POST /studio/shoot-schedules/${sch6}/complete"
              payload: {}
              as: Photographer
              as_user_id: "${p6}"
              captures: { sch6_status: $.data.status }
          assert:
            - "ShootSchedule.${sch6}.status == COMPLETED"
            - "Booking.${bk6}.workflow_status == SHOT"

  # ===================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_booking_releases_shooter_recomputes_total_depth3
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - state_machines.ShootSchedule.SCHEDULED_to_CANCELLED
          - state_machines.SecondShooterAssignment.ASSIGNED_to_RELEASED
          - calculations.booking_total_fee
        distinguishing_aspect: |
          Depth-3 cascade from cancel: cancel(Booking) -> ShootSchedule.status=CANCELLED ->
          that schedule cancellation RELEASES the ASSIGNED SecondShooterAssignment -> the release
          recomputes Booking.total_fee_cents (262000 -> 230000, the 32000 shooter fee removed).
        test_recipe:
          setup:
            - "WEDDING STANDARD booking, requested 8h, CONFIRMED, deposit paid (deposit_due 69000); one 4h second shooter @8000 assigned -> total 262000."
            - "Clock at 2026-06-10T00:00:00Z (lead 21 days, >14d, before the 2026-07-01 shoot)."
          setup_api_calls:
            - call: "POST /studio/clients"
              payload: { email: "c7@x.com", full_name: "C Seven", phone: "700" }
              as: StudioAdmin
              captures: { c7: $.data.id }
            - call: "POST /studio/photographers"
              payload: { email: "lead7@x.com", full_name: "Lead 7", skills: ["PHOTO"], hourly_rate_cents: 12000 }
              as: StudioAdmin
              captures: { lead7: $.data.id }
            - call: "POST /studio/photographers"
              payload: { email: "second7@x.com", full_name: "Second 7", skills: ["PHOTO"], hourly_rate_cents: 8000 }
              as: StudioAdmin
              captures: { second7: $.data.id }
            - call: "POST /studio/session-packages"
              payload: { name: "Wedding Std 7", session_type: "WEDDING", tier: "STANDARD", base_fee_cents: 200000, included_shoot_hours: 6, overage_hourly_rate_cents: 15000, included_edited_images: 100, deposit_pct: 0.30, requires_model_release: true, active: true }
              as: StudioAdmin
              captures: { pkg7: $.data.id }
            - call: "POST /studio/bookings"
              payload: { client_id: "${c7}", package_id: "${pkg7}", lead_photographer_id: "${lead7}", requested_shoot_hours: 8 }
              as: Client
              as_user_id: "${c7}"
              captures: { bk7: $.data.id }
            - call: "POST /studio/contracts"
              payload: { booking_id: "${bk7}", includes_model_release: true }
              as: StudioAdmin
              captures: { ct7: $.data.id }
            - call: "POST /studio/contracts/${ct7}/send"
              payload: {}
              as: StudioAdmin
            - call: "POST /studio/contracts/${ct7}/sign"
              payload: {}
              as: Client
              as_user_id: "${c7}"
            - call: "POST /studio/shoot-schedules"
              payload: { booking_id: "${bk7}", start_utc: "2026-07-01T14:00:00Z", end_utc: "2026-07-01T18:00:00Z" }
              as: StudioAdmin
              captures: { sch7: $.data.id, sch7_v: $.data.version }
            - call: "POST /studio/bookings/${bk7}/confirm"
              payload: {}
              as: Client
              as_user_id: "${c7}"
              captures: { dep7: $.data.deposit_due_cents }
            - call: "POST /studio/shoot-schedules/${sch7}/second-shooter-assignments"
              payload: { photographer_id: "${second7}", expected_shoot_schedule_version: "${sch7_v}" }
              as: StudioAdmin
              captures: { asg7: $.data.id }
            - call: "POST /studio/payments"
              payload: { booking_id: "${bk7}", kind: "DEPOSIT", amount_cents: 69000 }
              as: StudioAdmin
              captures: { pay7: $.data.id }
            - call: "POST /studio/payments/${pay7}/settle"
              payload: {}
              as: StudioAdmin
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: StudioAdmin
          trigger:
            - call: "POST /studio/bookings/${bk7}/cancel"
              payload: {}
              as: Client
              as_user_id: "${c7}"
          assert:
            - "ShootSchedule.${sch7}.status == CANCELLED"
            - "SecondShooterAssignment.${asg7}.status == RELEASED"
            - "Booking.${bk7}.total_fee_cents == 230000"
            - "Booking.${bk7}.workflow_status == CANCELLED"

      - name: settle_balance_recomputes_amount_paid_then_balance_depth2
        grounds:
          - state_machines.Booking.DEPOSIT_PAID_to_PAID_IN_FULL
          - calculations.balance_due
