      - name: delivery_offload_blocked_until_production_lot_reaches_released
        grounds:
          - validations.priority_130_ERR_LOT_NOT_RELEASED
          - state_machines.Delivery.ARRIVED_to_ACCEPTED
          - state_machines.ProductionLot.PRODUCED_to_RELEASED
          - entities.ProductionLot.fields.status
          - entities.ProductionLot.fields.accepted_delivered_kg
          - endpoints.POST_/deliveries/{id}/offload
        distinguishing_aspect: |
          A different entity pair, (Delivery, ProductionLot), and the dependency points at a sibling
          aggregate rather than at a parent: the delivery is already ARRIVED and every station-side
          condition is satisfied, yet the offload is refused solely because the referenced lot is still
          PRODUCED. Releasing the lot — an operation on the OTHER entity, with no change to the delivery
