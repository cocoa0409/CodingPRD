              as: ProgramCoordinator
              captures: { m2: $.data.id }
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "A3", contact_channel: "SMS" }
              as: ProgramCoordinator
              captures: { m3: $.data.id }
            - call: "POST /watch/liaison-officers"
              payload: { badge_number: "B600", full_name: "Officer K", precinct_code: "PCT6" }
