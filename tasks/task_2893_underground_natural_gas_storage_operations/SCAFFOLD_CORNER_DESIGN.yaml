            - "RegulatoryReport.${rp1}.prepared_by_user_id == officer-a and submitted_by_user_id == officer-b"
            - "after the agency response RegulatoryReport.${rp1}.status == REJECTED with agency_outcome == REJECTED"
            - "the second reversal returns HTTP 200 with GasMovementTicket.${t1}.status == REVERSED and reversal_reason == chart integration error"
            - "StorageField.${f1}.working_gas_inventory_dth == 250000, retained_fuel_pool_dth == 0.000, inventory_pct == 50.00, current_pressure_psig == 1500, rates 150000 / 150000"
            - "StorageContract.${c1}.inventory_balance_dth == 0.000 and imbalance_dth == 0.000"
            - "GET /storage-contracts/${c1}/imbalance-ledger-entries with limit 100 returns total_count == 2"

      - name: curtailed_nomination_resubmission_round_is_bounded
        claim_type: valid_transition
        grounds:
          - state_machines.Nomination.transitions.CURTAILED_to_SUBMITTED
          - global_constants.MAX_REVISION_ROUNDS
          - errors.ERR_NOMINATION_REVISION_LIMIT
        excluded_because:
          difficulty_instance: nomination_curtailed_resubmit_cycle_bounded_by_revision_rounds
          rationale: |
            The CURTAILED -> SUBMITTED edge, the revision_round counter, the release of the
            previously confirmed volume from contract.scheduled_* on each re-submission and the
            terminal ERR_NOMINATION_REVISION_LIMIT on the third round are all driven end-to-end by
            that difficulty instance, which walks two full rounds and then the refusal. A separate
            breadth test would replay the identical call sequence with the identical literals, so it
            is excluded rather than weakened into a partial walk.

      - name: rejected_report_can_be_resubmitted_but_acceptance_is_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.RegulatoryReport.transitions.SUBMITTED_to_REJECTED
          - state_machines.RegulatoryReport.transitions.REJECTED_to_SUBMITTED
          - errors.ERR_INVALID_REPORT_STATE
        excluded_because:
          difficulty_instance: regulatory_report_rejected_resubmission_loop_then_terminal_lockdown
          rationale: |
            The REJECTED -> SUBMITTED cycle and the ACCEPTED lockdown that ends it are the whole
            subject of that difficulty instance, which also re-verifies the SoD actor on each
            resubmission. Covering the same edges here would duplicate its call sequence; the only
            aspect of report status this file tests independently is the period unlock a REJECTED
            outcome grants a ticket reversal (see
            ticket_reversal_locked_by_a_submitted_report_until_the_agency_rejects_it).

      - name: nomination_cutoff_hour_closes_the_gas_day
        claim_type: precondition_enforcement
        grounds:
          - validations.priority_18_ERR_NOMINATION_WINDOW_CLOSED
          - global_constants.NOMINATION_CUTOFF_HOUR_UTC
          - state_machines.Nomination.transitions.DRAFT_to_SUBMITTED
        excluded_because:
          difficulty_instance: nomination_window_temporal_priority_18_wins_over_revision_limit_priority_30
          rationale: |
            That difficulty instance already pins the cutoff arithmetic ((gas_day - 1 day) at
            NOMINATION_CUTOFF_HOUR_UTC, strict inequality, evaluated on both POST /nominations and
            POST /nominations/{id}/submit) and additionally proves the temporal check fires ahead of
            the revision-limit check when both are violated. A breadth test of the cutoff alone
            would be a strict subset of it.

  # =========================================================================
  # CALCULATIONS
  # =========================================================================
  - section: calculations
    instances:

      - name: deliverability_tier_floors_compared_against_the_two_decimal_inventory_pct
        claim_type: constants_applied
        grounds:
          - calculations.deliverability_rates
          - calculations.deliverability_rates.constants.TIER_2_FLOOR_PCT
          - entities.StorageField.fields.deliverability_tier
        distinguishing_aspect: |
          The tier comparison runs on the ROUNDED inventory_pct, not on the raw ratio, and the floors
          are inclusive from below: three fields with the identical geometry and openings 124950,
          125000 and 125050 Dth produce inventory_pct 24.99 / 25.00 / 25.01 and therefore TIER_1 /
          TIER_2 / TIER_2, while all three share the same rounded pressure 1150 psig and their curve
          rates differ by only 30 Dth per step (74970, 75000, 75030 on withdrawal).
        test_recipe:
          setup:
            - "Three fields with F_MINI geometry (total 1,000,000 / cushion 500,000 / base 800 / span 1400 / max 3000, two-point curve) differing only in opening_working_gas_dth: 124950, 125000 and 125050."
            - "Each carries one INJECTION_WITHDRAWAL well rated 600000 so the well cap never binds."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Tier Low", field_code: "F-T1", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 124950, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { fa: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${fa}", well_name: "T1-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { wa: $.data.id }
            - call: "POST /storage-fields"
              payload: { name: "Tier Exact", field_code: "F-T2", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 125000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { fb: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${fb}", well_name: "T2-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { wb: $.data.id }
            - call: "POST /storage-fields"
              payload: { name: "Tier High", field_code: "F-T3", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 125050, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { fc: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${fc}", well_name: "T3-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { wc: $.data.id }
          trigger:
            - call: "GET /storage-fields/${fa}"
              payload: {}
              as: SchedulingCoordinator
            - call: "GET /storage-fields/${fb}"
              payload: {}
              as: SchedulingCoordinator
            - call: "GET /storage-fields/${fc}"
              payload: {}
              as: SchedulingCoordinator
          assert:
            - "StorageField.${fa}.inventory_pct == 24.99 and deliverability_tier == TIER_1"
            - "StorageField.${fb}.inventory_pct == 25.00 and deliverability_tier == TIER_2 (the floor is inclusive)"
            - "StorageField.${fc}.inventory_pct == 25.01 and deliverability_tier == TIER_2"
            - "all three report current_pressure_psig == 1150"
            - "StorageField.${fa} rates are withdrawal 74970 / injection 225030"
            - "StorageField.${fb} rates are withdrawal 75000 / injection 225000"
            - "StorageField.${fc} rates are withdrawal 75030 / injection 224970"
            - "all three report field_posture == OPEN and wells_in_service_count == 1"

      - name: curve_evaluation_at_an_exact_knot_point_and_between_two_knots
        claim_type: interval_merge
        grounds:
          - calculations.deliverability_rates
          - calculations.deliverability_rates.variants.CURVE_INTERPOLATED
          - entities.StorageField.fields.deliverability_curve
        distinguishing_aspect: |
          On a five-point curve the interpolator must handle the degenerate bracket where the
          inventory_pct equals a declared knot: at 50.00% on F_STD lo and hi collapse onto the
          (50, 300000, 250000) point and the rates are read off verbatim, with no interpolation
          arithmetic and no drift, while a field sitting at 37.50% between the 25 and 50 knots
          returns the genuinely interpolated 225000 / 300000.
        test_recipe:
          setup:
            - "Two F_STD-geometry fields (total 10,000,000 / cushion 2,000,000 -> max working 8,000,000) with the five-point curve (0,0,400000) (25,150000,350000) (50,300000,250000) (75,450000,150000) (100,600000,0)."
            - "F-K1 opens at 4,000,000 Dth (exactly the 50% knot) and F-K2 at 3,000,000 Dth (37.50%, between knots); each has one well rated 600000."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Knot Field", field_code: "F-K1", total_capacity_dth: 10000000, cushion_gas_dth: 2000000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 4000000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 400000 }, { inventory_pct: 25, withdrawal_dth_per_day: 150000, injection_dth_per_day: 350000 }, { inventory_pct: 50, withdrawal_dth_per_day: 300000, injection_dth_per_day: 250000 }, { inventory_pct: 75, withdrawal_dth_per_day: 450000, injection_dth_per_day: 150000 }, { inventory_pct: 100, withdrawal_dth_per_day: 600000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { fk: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${fk}", well_name: "K1-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { wk: $.data.id }
            - call: "POST /storage-fields"
              payload: { name: "Between Field", field_code: "F-K2", total_capacity_dth: 10000000, cushion_gas_dth: 2000000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 3000000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 400000 }, { inventory_pct: 25, withdrawal_dth_per_day: 150000, injection_dth_per_day: 350000 }, { inventory_pct: 50, withdrawal_dth_per_day: 300000, injection_dth_per_day: 250000 }, { inventory_pct: 75, withdrawal_dth_per_day: 450000, injection_dth_per_day: 150000 }, { inventory_pct: 100, withdrawal_dth_per_day: 600000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { fm: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${fm}", well_name: "K2-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { wm: $.data.id }
          trigger:
            - call: "GET /storage-fields/${fk}"
              payload: {}
              as: SchedulingCoordinator
            - call: "GET /storage-fields/${fm}"
              payload: {}
              as: SchedulingCoordinator
          assert:
            - "StorageField.${fk}.inventory_pct == 50.00, current_pressure_psig == 1500, deliverability_tier == TIER_3"
            - "StorageField.${fk}.max_withdrawal_rate_dth_per_day == 300000 and max_injection_rate_dth_per_day == 250000 (read straight off the knot)"
            - "StorageField.${fm}.inventory_pct == 37.50, current_pressure_psig == 1325, deliverability_tier == TIER_2"
            - "StorageField.${fm}.max_withdrawal_rate_dth_per_day == 225000 and max_injection_rate_dth_per_day == 300000 (interpolated halfway between the 25 and 50 knots)"
            - "both fields report field_posture == OPEN, wells_in_service_count == 1, max_working_gas_dth == 8000000"

      - name: curve_lookup_uses_the_rounded_pct_not_the_raw_inventory_ratio
        claim_type: precision
        grounds:
          - calculations.deliverability_rates
          - entities.StorageField.fields.inventory_pct
        distinguishing_aspect: |
          inventory_pct is rounded to 2 decimals BEFORE it is fed to the curve, so a field holding
          166667 of 500000 Dth (raw ratio 33.33340%) is evaluated at 33.33: injection comes out
          200010 Dth/day, not the 200000 an unrounded ratio would give, and withdrawal 99990 rather
          than 100000. The 10 Dth/day gap is the whole point — it is only observable because the
          rounding happens first.
        test_recipe:
