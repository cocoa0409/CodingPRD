              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /mmm/experiments"
              payload: { market_id: "${mkt}", channel_id: "${cha}", design_type: "GEO_HOLDOUT", readout_method: "DIFF_IN_DIFF", start_date: "2026-09-07T00:00:00Z", end_date: "2026-10-05T00:00:00Z", washout_days: 7, minimum_detectable_effect_pct: 5.0, baseline_conversion_rate: 0.0200, planned_treatment_population: 500000, planned_control_population: 500000 }
              as: ExperimentDesigner
              as_user_id: "ed-1"
              captures: { exp1: "$.data.id" }
            - call: "POST /mmm/experiments/${exp1}/lock-design"
              as: ExperimentDesigner
              as_user_id: "ed-1"
          trigger:
            - call: "POST /mmm/sales-observations"
              payload: { data_window_id: "${w1}", period_start_date: "2026-08-03T00:00:00Z", units_sold: 5000, revenue_cents: 25000000, distribution_pct: 82.00, macro_index: 100.0000 }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "GET /mmm/data-windows/${w1}"
              as: Auditor
              as_user_id: "au-1"
            - call: "POST /mmm/experiments/${exp1}/assign-cells"
              payload: { treatment_cell_ids: ["${gc1}"], control_cell_ids: ["${gc2}"] }
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "GET /mmm/markets/${mkt}"
              as: Auditor
              as_user_id: "au-1"
            - call: "GET /mmm/geo-cells?market_id=${mkt}&assignment_state=TREATMENT"
              as: Auditor
              as_user_id: "au-1"
          assert:
            - "Call 1 returns 201 with data.avg_price_cents == 5000 already computed in the create response itself - not null pending a later pass."
            - "Call 2, the first read after call 1, shows sales_period_count == 1, lag_completeness_pct == 25.00 and version == 2."
            - "Call 3 returns 200 with data.treatment_population == 100000 and data.control_population == 100000 in its own body."
            - "Call 4, the first read after call 3, shows held_out_population == 200000 and held_out_population_pct == 2.00."
            - "Call 5 returns total_count == 1 with data[0].id == ${gc1}, assignment_state == TREATMENT and assigned_experiment_id == ${exp1} - the filtered list index is consistent immediately too."
            - "No assertion in this recipe requires a second attempt: every value above is correct on the first read, which is what consistency_model immediate means."
