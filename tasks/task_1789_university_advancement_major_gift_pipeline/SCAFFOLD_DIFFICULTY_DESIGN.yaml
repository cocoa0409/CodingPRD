  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (three different metrics/endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: principal_tier_boundary_at_exactly_one_million
        grounds:
          - calculations.approval_tier_determination
          - entities.Proposal.fields.approval_tier
        distinguishing_aspect: |
          Metric: ask amount in cents at the TIER_PRINCIPAL_MIN boundary via
          POST /advancement/proposals/{id}/submit. effective_ask 99999999 ->
          MAJOR; exactly 100000000 -> PRINCIPAL (the >= boundary is inclusive).
          Distinct metric and endpoint from the portfolio-count and fund-balance
          instances.
        test_recipe:
          setup:
            - "Prospect INDIVIDUAL rated band B (200000000 VERIFIED_DOCUMENT -> ceiling 200000000), assigned, CULTIVATION"
          setup_api_calls:
            - call: "POST /advancement/fundraisers"
              payload: { display_name: "Officer One", email: "o1@x.edu", max_prospect_count: 10, max_open_ask_cents: 1000000000 }
              as: VPAdvancement
              as_user_id: "vp-1"
              captures: { f_id: $.data.id, f_ver: $.data.version }
            - call: "POST /advancement/prospects"
              payload: { full_name: "Donor A", prospect_type: "INDIVIDUAL", contact_email: "a@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { p_id: $.data.id }
            - call: "POST /advancement/prospects/${p_id}/assessments"
              payload: { assessed_capacity_cents: 200000000, engagement_score: 80, philanthropy_score: 70, recency_score: 60, evidence_tier: "VERIFIED_DOCUMENT" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { a_id: $.data.id }
            - call: "POST /advancement/assessments/${a_id}/review"
              payload: { decision: "APPROVE" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "POST /advancement/fundraisers/${f_id}/assignments"
              payload: { prospect_id: "${p_id}", expected_fundraiser_version: "${f_ver}" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "POST /advancement/prospects/${p_id}/moves"
              payload: { target_stage: "CULTIVATION" }
              as: GiftOfficer
              as_user_id: "${f_id}"
            - call: "GET /advancement/prospects/${p_id}"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { p_ver1: $.data.version }
            - call: "POST /advancement/proposals"
              payload: { prospect_id: "${p_id}", proposal_type: "OUTRIGHT", ask_amount_cents: 99999999, designation_purpose: "Just under", expected_prospect_version: "${p_ver1}" }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { prop1_id: $.data.id }
