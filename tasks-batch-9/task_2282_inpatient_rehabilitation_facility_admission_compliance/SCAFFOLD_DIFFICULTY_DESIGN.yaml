      - name: rescind_interruption_restores_head_pricing_and_facility_ledger
        grounds:
          - state_machines.Admission.payment_status
          - calculations.stay_payment_cents
          - validations[priority=74]
          - entities.Facility.fields.settled_payment_cents
        distinguishing_aspect: |
          Rescinding a consolidated interrupted stay reverses every side effect of the
          attachment: the continuation returns to NOT_PRICED with predecessor_admission_id
          null, the head returns from REOPENED to PRICED with total_payment_cents 1623128
          and effective_los_days 7, and Facility.settled_payment_cents returns from 0 to
          1623128 with no residual drift.
        test_recipe:
          setup:
            - "Facility with defaults; patient A (impairment_group_code 0008 -> TIER_B base 2450000, comorbidity_tier TIER_2 -> uplift 0.06, AVG_LOS_DAYS 12)."
            - "Head admission admitted 2026-08-04T12:00:00Z, discharged 2026-08-10T12:00:00Z to ACUTE_CARE: effective_los_days 7, per-diem 216417, transfer adjustment 7.5 per-diem days -> total_payment_cents 1623128 and Facility.settled_payment_cents 1623128."
            - "A ComplianceReview for 2026-08-01..2026-08-31 is COMPUTED before the interruption is attached."
            - "A second concurred screening supports a continuation admission created with predecessor_admission_id = head and admitted 2026-08-12T12:00:00Z (gap within INTERRUPTION_MAX_GAP_DAYS 3), which consolidates payment and moves the head to REOPENED with total_payment_cents 0 and marks the review STALE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
