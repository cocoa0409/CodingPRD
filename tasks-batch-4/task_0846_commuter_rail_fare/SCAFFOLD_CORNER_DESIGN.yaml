            - "HTTP status == 404"

      - name: purchase_with_insufficient_wallet_returns_402
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_INSUFFICIENT_WALLET]"]
        distinguishing_aspect: "Applying wallet_apply_cents=500 against a zero wallet balance (and no reduced fare requested) is rejected with ERR_INSUFFICIENT_WALLET (402)."
        test_recipe:
          setup: ["Clock 2026-03-01. FareProduct SINGLE (1->3). Passenger with wallet 0."]
