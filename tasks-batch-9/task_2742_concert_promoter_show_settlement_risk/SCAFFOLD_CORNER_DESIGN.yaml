          assert:
            - "OFFER EXPIRY IS STRICT — ${rl_of_z_expires} == 2026-08-04T00:00:00.000Z and at 2026-08-04T00:00:00.001Z ${rl_err_expired} == ERR_OFFER_EXPIRED with HTTP 409; show Z is still PLANNED and the offer is still SUBMITTED (no EXPIRED write happens on a rejected accept)"
            - "REPLACEMENT LINKAGE — ${rl_err_replacement} == ERR_REPLACEMENT_SHOW_INVALID with HTTP 422: show Y exists and is PLANNED, but its rescheduled_from_show_id is null rather than ${rl_sh_p}; the event stays OPENED and show P stays POSTPONED"
            - "OVERRIDE CEILING — ${rl_err_override} == ERR_EXPOSURE_OVERRIDE_INVALID with HTTP 422 for 10000001 against a 5000000 limit (2x is exactly 10000000); show Y's exposure_override_limit_cents is still null"
            - "CROSS-REFERENCE COHERENCE — ${rl_err_mismatch} == ERR_BUDGET_LINE_SHOW_MISMATCH with HTTP 422, not a 404: ${rl_sh_x} and ${rl_bl_y} both exist, so priorities 7 and 9 pass and only priority 20 can fire"
            - "UNRESOLVED VARIANCE — ${rl_err_variance} == ERR_UNRESOLVED_VARIANCE with HTTP 409, not ERR_UNRESOLVED_INVOICES: the show's only invoice is APPROVED, so priority 36 is satisfied and priority 37 owns the call"
            - "SETTLEMENT UNIQUENESS — ${rl_err_already_open} == ERR_SETTLEMENT_ALREADY_OPEN with HTTP 409; GET /settlements?show_id=${rl_sh_x} still returns total_count 1"
            - "SATISFACTION MIRROR — after the decision ${rl_bl_x_status} == APPROVED and ${rl_bl_x_expense} == 260000 == MIN(actual 260000, cap 260000), and the SAME calculate call now returns 200 with ${rl_st_x_status} == CALCULATED, ${rl_st_x_expense} == 260000, ${rl_st_x_adj} == 487500 (500000 gross less the 12500 card fee) and ${rl_st_x_net} == -72500 == 487500 - 300000 - 260000 - 0"
            - "CLAIM WINDOW, FINAL INSTANT PASSES — ${rl_ce_w1_occurred} == ${rl_ce_w2_occurred} == 2026-12-02T02:00:00.000Z and at exactly occurred_at + 30 days (2027-01-01T02:00:00.000Z) ${rl_ce_w1_status} == CLAIM_FILED; the window is inclusive of its final instant"
            - "CLAIM WINDOW, ONE MILLISECOND LATER FAILS — ${rl_err_claim_window} == ERR_CLAIM_WINDOW_CLOSED with HTTP 422 and ${rl_ce_w2_status_after} == REFUNDS_PROCESSED: no claim fields were written on the refused call"

      - name: satisfied_conditions_pass_at_the_exact_edge_of_the_rule_they_almost_break
        claim_type: Satisfaction -> Pass
        grounds:
          - "validations[priority=20]"
          - "validations[priority=21]"
          - "validations[priority=22]"
          - "validations[priority=43]"
          - "validations[priority=44]"
          - "validations[priority=45]"
        distinguishing_aspect: "Every probe sits on the passing side of a boundary by the smallest possible margin, so an implementation that turned any of these comparisons the wrong way returns an error where the scaffold demands a 201. One show creation exercises two of them at once: announce_at is exactly EQUAL to event_at (rule 21 is <=, not <) and event_at is exactly one millisecond after the clock (rule 22 is a strict >, so one millisecond is enough). The tier pair sums to exactly gross_capacity, the override is exactly twice the limit, and the tier name GA is reused on a DIFFERENT show because rule 45's uniqueness is scoped per show, not global."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00.000Z. Market Pass Market limit 4000000 (so exactly 2x is 8000000), Venue Pass Hall gross_capacity 300 / facility 0 / tax 0, two Artists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
              payload: { name: "Pass Market", region_code: "PS", guarantee_exposure_limit_cents: 4000000 }
              as: RiskOfficer
              captures: { ps_mk_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Pass Act One", agency: "Pas Talent", tier: "CLUB", historical_sellthrough_pct: 55.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { ps_ar_1: $.data.id }
            - call: "POST /artists"
              payload: { name: "Pass Act Two", agency: "Pas Talent", tier: "CLUB", historical_sellthrough_pct: 55.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { ps_ar_2: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${ps_mk_id}", name: "Pass Hall", gross_capacity: 300, facility_fee_cents_per_ticket: 0, ticket_tax_pct: 0 }
              as: TalentBuyer
              captures: { ps_vn_id: $.data.id }
          trigger:
            # rule 22 passes by one millisecond AND rule 21's announce clause passes on equality
            - call: "POST /shows"
              payload: { artist_id: "${ps_ar_1}", venue_id: "${ps_vn_id}", event_at: "2026-08-01T00:00:00.001Z", load_in_at: "2026-07-31T20:00:00.000Z", load_out_at: "2026-08-01T06:00:00.000Z", announce_at: "2026-08-01T00:00:00.001Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
              captures: { ps_sh_1: $.data.id, ps_sh_1_status: $.data.show_status, ps_sh_1_announce: $.data.announce_at, ps_sh_1_event: $.data.event_at }
            # rule 44 passes on equality with gross_capacity, across two tiers
            - call: "POST /ticket-tiers"
              payload: { show_id: "${ps_sh_1}", tier_name: "GA", price_cents: 5000, allocation_qty: 100 }
              as: TalentBuyer
              captures: { ps_tt_1a: $.data.id }
            - call: "POST /ticket-tiers"
              payload: { show_id: "${ps_sh_1}", tier_name: "BALCONY", price_cents: 3000, allocation_qty: 200 }
              as: TalentBuyer
              captures: { ps_tt_1b: $.data.id, ps_tt_1b_alloc: $.data.allocation_qty, ps_tt_1b_avail: $.data.available_qty }
            # rule 20 passes when the line really does belong to the show
            - call: "POST /budget-lines"
              payload: { show_id: "${ps_sh_1}", category: "PRODUCTION", description: "Own-show line", budgeted_cents: 50000, is_artist_deductible: true }
              as: TourAccountant
              captures: { ps_bl_1: $.data.id }
            - call: "POST /vendor-invoices"
              payload: { show_id: "${ps_sh_1}", budget_line_id: "${ps_bl_1}", vendor_name: "Matched Freight", amount_cents: 40000, invoice_date: "2026-08-01T00:00:00.000Z", documentation_ref: "PKT-PS-01" }
              as: TourAccountant
              captures: { ps_vi_1: $.data.id, ps_vi_1_status: $.data.status }
            # rule 45's uniqueness is per show, so GA is free again on a second show
            - call: "POST /shows"
              payload: { artist_id: "${ps_ar_2}", venue_id: "${ps_vn_id}", event_at: "2026-09-02T02:00:00.000Z", load_in_at: "2026-09-01T14:00:00.000Z", load_out_at: "2026-09-02T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
              captures: { ps_sh_2: $.data.id }
            - call: "POST /ticket-tiers"
              payload: { show_id: "${ps_sh_2}", tier_name: "GA", price_cents: 4000, allocation_qty: 100 }
              as: TalentBuyer
              captures: { ps_tt_2a: $.data.id, ps_tt_2a_name: $.data.tier_name }
            # rule 43 passes at exactly twice the market limit
            - call: "POST /shows/${ps_sh_2}/exposure-override"
              payload: { exposure_override_limit_cents: 8000000, exposure_override_justification: "Anchor date for the fall routing" }
              as: RiskOfficer
              as_user_id: "u_ps_risk"
              captures: { ps_sh_2_override: $.data.exposure_override_limit_cents, ps_sh_2_override_by: $.data.exposure_override_by_user_id }
          assert:
            - "ANNOUNCE ON EVENT DAY PASSES — the first POST /shows returns 201 with ${ps_sh_1_status} == PLANNED and ${ps_sh_1_announce} == ${ps_sh_1_event} == 2026-08-01T00:00:00.001Z: rule 21's announce clause is announce_at <= event_at, so equality is legal"
            - "ONE MILLISECOND OF FUTURE IS ENOUGH — the same call passes rule 22 with event_at exactly 1 ms after the clock's 2026-08-01T00:00:00.000Z, because the rule is event_at > current_utc, not event_at >= current_utc + some grace"
            - "PAST LOAD-IN IS NOT AN ERROR — load_in_at 2026-07-31T20:00:00.000Z is before the clock and no rule forbids it; only event_at is compared to the clock"
            - "CAPACITY ON THE NOSE PASSES — both tiers return 201, ${ps_tt_1b_alloc} == 200 and 100 + 200 == 300 == venue.gross_capacity, so rule 44's <= admits the exact fit; ${ps_tt_1b_avail} == 200"
            - "MATCHED CROSS-REFERENCE PASSES — the invoice returns 201 with ${ps_vi_1_status} == SUBMITTED because ${ps_bl_1}.show_id == ${ps_sh_1}"
            - "TIER NAME UNIQUENESS IS PER SHOW — ${ps_tt_2a_name} == GA returns 201 on ${ps_sh_2} even though ${ps_sh_1} already has a GA tier"
            - "OVERRIDE AT EXACTLY 2x PASSES — ${ps_sh_2_override} == 8000000 == 2 * 4000000 and ${ps_sh_2_override_by} == u_ps_risk; rule 43's ceiling is inclusive"

      - name: accept_offer_frozen_market_check_wins_over_the_exposure_arithmetic
        claim_type: Priority Ordering
        grounds:
          - "validations[priority=40]"
          - "validations[priority=41]"
        excluded_because:
          difficulty_instance: accept_offer_state_check_preempts_market_exposure_check
          rationale: "The §1.8 instance already drives two rules that are simultaneously violated on POST /offers/{offer_id}/accept and pins the response to the lower-numbered priority, asserting that the higher-numbered rule's error id never appears and that neither rule's side effects were applied. A second Priority Ordering instance on the same endpoint would re-assert the same ordering guarantee with different ids; the aggregate-validation instance below already covers the 40-before-41 pair as part of its FROZEN tail, where the frozen market is reached legitimately rather than staged."

      - name: variance_decision_role_check_wins_over_the_cap_arithmetic
        claim_type: Priority conflict
        grounds:
          - "validations[priority=34]"
          - "validations[priority=35]"
        excluded_because:
          difficulty_instance: variance_decision_authority_check_preempts_cap_validity_check
          rationale: "This is exactly the Priority conflict pattern — violate the rule at priority 34 and the rule at priority 35 in one request and expect 34's error — and the §1.8 instance already sends a TourAccountant at a RISK_OFFICER-escalated line with an approved_cap_cents below budgeted_cents, asserting ERR_VARIANCE_APPROVAL_AUTHORITY rather than ERR_VARIANCE_CAP_INVALID and that the line's variance_status is untouched. Restating it here would weaken nothing and add nothing."

      - name: settlement_calculate_depends_on_the_state_of_entities_it_does_not_own
        claim_type: Cross-entity validation
        grounds:
          - "validations[priority=36]"
          - "validations[priority=37]"
        excluded_because:
          difficulty_instance: settlement_calculate_blocked_by_a_still_verified_vendor_invoice
          rationale: "The §1.8 instance tests both sides of the cross-entity dependency on the same fixture: with one VendorInvoice still VERIFIED the calculate call is ERR_UNRESOLVED_INVOICES, and after that invoice is approved the identical call succeeds. The companion rule at priority 37 (unresolved variance) is driven to its error and then to its pass in settlement_offer_and_claim_rule_violations_each_return_their_own_error_id above, so both cross-entity gates on this endpoint are covered from both directions."

      - name: a_show_booked_today_can_still_collide_with_a_window_booked_later
        claim_type: Temporal validation
        grounds:
          - "validations[priority=23]"
          - "validations[priority=24]"
        excluded_because:
          difficulty_instance: venue_load_window_half_open_overlap_rejects_at_one_millisecond
          rationale: "The §1.8 instance is the temporal-validation claim at its sharpest: a second show whose load_in_at is exactly the first show's load_out_at is accepted (the interval is half-open), while the same show one millisecond earlier is ERR_VENUE_WINDOW_CONFLICT. Its sibling artist_rest_buffer_is_a_symmetric_point_distance_not_an_interval covers priority 24 in both directions, including the asymmetry trap of measuring the buffer from the wrong endpoint."

      - name: individually_affordable_guarantees_collectively_break_the_market_limit
        claim_type: Aggregate validation
        grounds:
          - "validations[priority=40]"
          - "validations[priority=41]"
          - "validations[priority=44]"
          - "calculations.market_guarantee_exposure"
        distinguishing_aspect: "No single request is oversized: each guarantee is 400000 against a 1000000 limit and each tier is 400 seats against a 1000-seat hall, so an implementation that validates only the incoming value accepts everything. The rule is aggregate — committed_guarantee_cents plus the incoming guarantee, and the sum of allocation_qty INCLUDING the tier being created — so the third acceptance is 402 and the third tier is 422. The tail then proves the two market rules are ordered: once the override pushes utilization to 120.00 and the posture to FROZEN, the fourth acceptance returns priority 40's ERR_MARKET_POSTURE_FROZEN and never reaches priority 41's arithmetic, even though that arithmetic would also have failed."
