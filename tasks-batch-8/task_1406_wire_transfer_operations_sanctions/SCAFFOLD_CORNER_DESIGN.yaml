            - { call: "POST /wire-ops/customers", payload: { legal_name: "SM Seven", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cs7: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cs7}", account_number: "A-S007", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { as7: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cs7}", name: "SM Ben7", bank_name: "SMBank7", account_number: "B-S007", country_code: "US" }, as: WireOperator, captures: { bs7: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-08-31" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${as7}", beneficiary_id: "${bs7}", amount_cents: 100000, method: "Fedwire", purpose: "lapse probe" }, as: WireOperator, as_user_id: "op-1", captures: { s7_w: $.data.id } }
            - { call: "POST /wire-ops/wires/${s7_w}/submit", payload: { business_date: "2026-08-31" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${s7_w}", as: WireOperator, captures: { s7_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${s7_w}/approve", payload: { expected_wire_version: "${s7_v1}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${s7_w}", as: WireOperator, captures: { s7_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${s7_w}/approve", payload: { expected_wire_version: "${s7_v2}" }, as: WireApprover, as_user_id: "ap-2" }
            - { call: "POST /wire-ops/wires/${s7_w}/fraud-holds", payload: { reason_code: "PHISHING", note: "suspected phish" }, as: FraudAnalyst, as_user_id: "fa-1", captures: { s7_hold: $.data.id, s7_exp: $.data.expires_at } }
          trigger:
            - { call: "POST /wire-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: WireOpsAdmin }
            - { call: "GET /wire-ops/fraud-holds/${s7_hold}", as: FraudAnalyst, captures: { s7_h_status: $.data.status, s7_h_res: $.data.resolution } }
            - { call: "GET /wire-ops/wires/${s7_w}", as: WireOperator, captures: { s7_w_status: $.data.status } }
            - { call: "GET /wire-ops/customers/${cs7}", as: WireOpsAdmin, captures: { s7_c_status: $.data.status } }
          assert:
            - "At now == expires_at (${s7_exp} == 2026-08-02T00:00:00Z) the lazy evaluation fires: FraudHold.${s7_hold}.status == CONFIRMED_FRAUD (${s7_h_status}), resolution == AUTO_LAPSED (${s7_h_res})"
            - "WireTransfer.${s7_w}.status == CANCELLED (${s7_w_status}); Customer.${cs7}.status == FROZEN (${s7_c_status}) with frozen_at set"

      - name: sanctions_escalated_release_forbidden_for_screener
        claim_type: precondition_enforcement
        grounds: ["state_machines.SanctionsHit.ESCALATED_to_RELEASED_FALSE_POSITIVE", "roles[ComplianceOfficer]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Disposition of an ESCALATED hit is tier-gated: SanctionsScreener gets ERR_FORBIDDEN_ROLE while a ComplianceOfficer succeeds, and the wire's screening_status returns to CLEAR only after the officer's release."
