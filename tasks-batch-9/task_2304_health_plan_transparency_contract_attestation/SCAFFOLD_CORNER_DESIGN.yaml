              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Cascade Health Administrators", vendor_type: "TPA", contact_email: "ops@cascade.example" }
              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Alpine Script Benefit Managers", vendor_type: "PBM", contact_email: "data@alpinescript.example" }
              as: PlanSponsorAdmin
              captures: { v_pbm: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_pbm}", contract_type: "PBM", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 12000000 }
              as: PlanSponsorAdmin
              captures: { c_pbm: "$.data.id" }
            - call: "POST /compliance/refresh-cycles"
              payload: { plan_year_id: "${py}", period_month: "2027-03", period_start: "2027-03-01", period_end: "2027-03-31" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { rc_mar: "$.data.id" }
            - call: "POST /compliance/refresh-cycles"
              payload: { plan_year_id: "${py}", period_month: "2027-04", period_start: "2027-04-01", period_end: "2027-04-30" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { rc_apr: "$.data.id" }
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-05-01T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/contracts/${c_pbm}/gag-review"
              payload: { clause_inventory_count: 22, prohibited_clause_count: 3, review_note: "Three gag clauses on cost data." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /compliance/contracts/${c_pbm}/escalate-gag"
              payload: { escalation_note: "Vendor refuses removal." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-05-10T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years/${py}/compliance-runs"
              payload: {}
              as: PlatformOperator
          assert:
            - "after escalate-gag, GET /compliance/plan-years/${py} -> data.deficiency_points == 6 and data.compliance_posture == \"DEFICIENT\" (exactly at DEFICIENT_POINT_THRESHOLD, inclusive) and data.penalty_exposure_cents == 30000"
            - "the compliance-runs response has data.posture_before == \"DEFICIENT\", data.posture_after == \"FROZEN\", data.cycles_missed_count == 2, data.accruals_posted_count == 2, data.deficiency_points == 12, data.penalty_exposure_cents == 830000"
            - "GET /compliance/plan-years/${py} -> data.compliance_posture == \"FROZEN\" and data.freeze_flag == false and data.freeze_reason == null (the posture is point-derived, not operator-forced)"
            - "GET /compliance/penalty-ledger-entries?plan_year_id=${py} -> 3 entries in created_at ASC order: GAG_CLAUSE 30000 (days_open 1, onset_date \"2027-05-01\"), MRF_REFRESH 700000 (days_open 35, onset_date \"2027-04-06\"), MRF_REFRESH 100000 (days_open 5, onset_date \"2027-05-06\")"
            - "GET /compliance/refresh-cycles/${rc_mar} -> data.status == \"MISSED\" and GET /compliance/refresh-cycles/${rc_apr} -> data.status == \"MISSED\""

      - name: projection_variants_differ_on_day_count_endpoint
        claim_type: variant_divergence
        grounds:
          - calculations.penalty_exposure_projection.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / penalty_projection_accrued_vs_statutory_maximum
          rationale: "That §1.8 instance asserts both variants from one response with the pinned sum-then-multiply-then-round order and shows the delta against the ledger balance."

      - name: reasonableness_score_component_rounding_precision
        claim_type: precision
        grounds:
          - calculations.compensation_reasonableness_score.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / reasonableness_per_component_rounding_before_summation
          rationale: "That §1.8 instance pins per-component ROUND_HALF_UP to 2 dp before summation (64.99 versus the 65.00 an end-rounded implementation stores)."

      - name: ledger_balance_is_signed_sum_of_all_entries
        claim_type: aggregation
        grounds:
          - calculations.penalty_ledger_balance.invariant
        excluded_because:
          difficulty_instance: compensating_invariant / ledger_reversal_conserves_balance_without_touching_deficiency_points
          rationale: "That §1.8 instance reconciles the append-only signed sum before and after a reversal and proves deficiency_points does not move with the money."

  - section: validations
    instances:
      - name: duplicate_plan_year_label_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=41]
          - errors[ERR_DUPLICATE_PLAN_YEAR_LABEL]
        distinguishing_aspect: "plan_year_label uniqueness is global, not scoped to sponsor_name: a second plan year reusing the label PY2027 under a DIFFERENT sponsor is still refused 409 ERR_DUPLICATE_PLAN_YEAR_LABEL."
        test_recipe:
          setup:
            - "Clock at 2027-01-02T09:00:00Z; one PlanYear labelled PY2027 for sponsor Meridian."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-01-02T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
          trigger:
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Northgate Foods Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 900, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
          assert:
            - "response HTTP status == 409 and response data.error_id == \"ERR_DUPLICATE_PLAN_YEAR_LABEL\""
            - "GET /compliance/plan-years?plan_year_label=PY2027 -> total_count == 1 and data[0].id == ${py}"

      - name: plan_year_inverted_date_interval_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=19]
          - errors[ERR_INVALID_INTERVAL]
        distinguishing_aspect: "end_date must be STRICTLY after start_date: a single-day plan year with end_date == start_date is refused 422 ERR_INVALID_INTERVAL, and the shape check is a 422 business-temporal rule, not the 400 schema rule at priority 4 (the field types are all valid)."
        test_recipe:
          setup:
            - "Clock at 2027-01-02T09:00:00Z; no plan years."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-01-02T09:00:00Z" }
              as: PlatformOperator
          trigger:
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027-BAD", start_date: "2027-06-01", end_date: "2027-06-01", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
          assert:
            - "response HTTP status == 422 and response data.error_id == \"ERR_INVALID_INTERVAL\""
            - "GET /compliance/plan-years -> total_count == 0"

      - name: list_plan_years_invalid_pagination_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_PAGINATION]
          - conventions.pagination
        distinguishing_aspect: "limit is constrained to [1, 100]: limit=0 and limit=101 are both refused 400 ERR_INVALID_PAGINATION rather than silently clamped to the default of 10 or to the maximum."
        test_recipe:
          setup:
            - "Clock at 2027-01-02T09:00:00Z; one PlanYear PY2027."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-01-02T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
          trigger:
            - call: "GET /compliance/plan-years?limit=0"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /compliance/plan-years?limit=101"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /compliance/plan-years?offset=-1"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "all three responses have HTTP status == 400 and data.error_id == \"ERR_INVALID_PAGINATION\""
            - "GET /compliance/plan-years?limit=1 -> HTTP 200 with total_count == 1, has_more == false"

      - name: projection_as_of_date_outside_plan_year_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=38]
          - errors[ERR_PROJECTION_DATE_OUT_OF_RANGE]
        distinguishing_aspect: "as_of_date is clamped to the plan year window inclusively: 2026-12-31 and 2028-02-01 are refused 422 ERR_PROJECTION_DATE_OUT_OF_RANGE while 2027-01-01 and 2027-12-31 (the exact endpoints) are accepted."
        test_recipe:
          setup:
            - "Clock at 2027-06-15T09:00:00Z; one PlanYear PY2027 spanning 2027-01-01..2027-12-31."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-06-15T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
          trigger:
            - call: "GET /compliance/plan-years/${py}/penalty-projection?as_of_date=2028-02-01"
              payload: {}
              as: ExternalAuditor
              as_user_id: "auditor-1"
            - call: "GET /compliance/plan-years/${py}/penalty-projection?as_of_date=2026-12-31"
              payload: {}
              as: ExternalAuditor
              as_user_id: "auditor-1"
            - call: "GET /compliance/plan-years/${py}/penalty-projection?as_of_date=2027-12-31"
              payload: {}
              as: ExternalAuditor
              as_user_id: "auditor-1"
          assert:
            - "the first two responses have HTTP status == 422 and data.error_id == \"ERR_PROJECTION_DATE_OUT_OF_RANGE\""
            - "the third response has HTTP status == 200 with data.open_deficiency_count == 0 and data.size_multiplier == 2.0"

      - name: clock_rewind_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=45]
          - errors[ERR_CLOCK_REWIND_FORBIDDEN]
          - endpoints[POST /compliance/_clock/set_current_utc]
        distinguishing_aspect: "The logical clock is monotonic non-decreasing: setting it to the SAME instant is accepted, one millisecond earlier is refused 409 ERR_CLOCK_REWIND_FORBIDDEN, and the refused call leaves the clock where it was."
        test_recipe:
          setup:
            - "Clock moved forward to 2027-06-15T12:00:00.000Z."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-06-15T12:00:00.000Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
          trigger:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-06-15T11:59:59.999Z" }
              as: PlatformOperator
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-06-15T12:00:00.000Z" }
              as: PlatformOperator
          assert:
            - "the rewind response HTTP status == 409 and data.error_id == \"ERR_CLOCK_REWIND_FORBIDDEN\""
            - "the equal-instant response HTTP status == 200"
            - "POST /compliance/plan-years/${py}/compliance-runs -> data.penalty_exposure_cents == 0 and GET /compliance/plan-years/${py} -> data.last_compliance_run_at == \"2027-06-15T12:00:00.000Z\" (the clock never moved backwards)"

      - name: rx_submission_reference_year_out_of_window_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=44]
          - errors[ERR_RX_REFERENCE_YEAR_INVALID]
        distinguishing_aspect: "For a plan year starting 2027-01-01 only reference_year 2027 or 2026 is admissible: 2025 is refused 422 ERR_RX_REFERENCE_YEAR_INVALID even though it satisfies the field constraint >= 2020, so the schema check at priority 4 must not swallow it."
        test_recipe:
          setup:
            - "ACTIVE PlanYear PY2027 (start_date 2027-01-01) with one TPA contract; clock at 2027-08-01T09:00:00Z."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-08-01T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Cascade Health Administrators", vendor_type: "TPA", contact_email: "ops@cascade.example" }
              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
          trigger:
            - call: "POST /compliance/rx-data-submissions"
              payload: { plan_year_id: "${py}", reference_year: 2025 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /compliance/rx-data-submissions"
              payload: { plan_year_id: "${py}", reference_year: 2026 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "the 2025 response HTTP status == 422 and data.error_id == \"ERR_RX_REFERENCE_YEAR_INVALID\""
            - "the 2026 response HTTP status == 201 with data.status == \"OPEN\" and data.reference_year == 2026"
            - "GET /compliance/rx-data-submissions?plan_year_id=${py} -> total_count == 1"

      - name: mrf_posting_month_outside_plan_year_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=39]
          - errors[ERR_INVALID_MRF_INPUT]
        distinguishing_aspect: "posting_month must fall inside the months spanned by the plan year: 2026-12 is refused 422 ERR_INVALID_MRF_INPUT (well-formed month, wrong window), and row_count 0 on an in-window month is refused by the same rule."
        test_recipe:
          setup:
            - "ACTIVE PlanYear PY2027 with one TPA contract; clock at 2027-04-01T09:00:00Z."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-04-01T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Cascade Health Administrators", vendor_type: "TPA", contact_email: "ops@cascade.example" }
              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
          trigger:
            - call: "POST /compliance/machine-readable-files"
              payload: { plan_year_id: "${py}", file_type: "IN_NETWORK_RATES", posting_month: "2026-12", public_url: "https://meridian.example/mrf/2026-12-in-network-rates.json", row_count: 480000, schema_version: "v2.1" }
              as: PlanSponsorAdmin
            - call: "POST /compliance/machine-readable-files"
              payload: { plan_year_id: "${py}", file_type: "IN_NETWORK_RATES", posting_month: "2027-03", public_url: "https://meridian.example/mrf/2027-03-in-network-rates.json", row_count: 0, schema_version: "v2.1" }
              as: PlanSponsorAdmin
          assert:
            - "both responses have HTTP status == 422 and data.error_id == \"ERR_INVALID_MRF_INPUT\""
            - "GET /compliance/machine-readable-files?plan_year_id=${py} -> total_count == 0"

      - name: tool_launch_below_required_covered_items_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=30]
          - errors[ERR_COVERED_ITEMS_INSUFFICIENT]
        distinguishing_aspect: "REQUIRED_COVERED_ITEMS is 500 and the gate is on launch, not on registration: a tool with covered_items_count 499 is created successfully in PENDING_LAUNCH but its launch is refused 422 ERR_COVERED_ITEMS_INSUFFICIENT."
        test_recipe:
          setup:
            - "ACTIVE PlanYear PY2027 with one TPA contract; clock at 2027-02-01T09:00:00Z."
            - "One PriceComparisonTool with covered_items_count 499 in PENDING_LAUNCH."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Cascade Health Administrators", vendor_type: "TPA", contact_email: "ops@cascade.example" }
              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
            - call: "POST /compliance/price-comparison-tools"
              payload: { plan_year_id: "${py}", tool_name: "Meridian Cost Estimator", covered_items_count: 499 }
              as: PlanSponsorAdmin
              captures: { tool: "$.data.id" }
          trigger:
            - call: "POST /compliance/price-comparison-tools/${tool}/launch"
              payload: {}
              as: PlanSponsorAdmin
          assert:
            - "response HTTP status == 422 and response data.error_id == \"ERR_COVERED_ITEMS_INSUFFICIENT\""
            - "GET /compliance/price-comparison-tools/${tool} -> data.status == \"PENDING_LAUNCH\", data.launched_at == null, data.sla_target_uptime_pct == 99.00"

      - name: evaluation_of_month_still_in_progress_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=23]
          - errors[ERR_EVALUATION_MONTH_NOT_ELAPSED]
        distinguishing_aspect: "An evaluation month must be STRICTLY before the clock's month: with the clock in 2027-06, scoring 2027-06 is refused 422 ERR_EVALUATION_MONTH_NOT_ELAPSED, and so is 2027-01 because it precedes the tool's launch month 2027-05."
        test_recipe:
          setup:
            - "ACTIVE PlanYear PY2027 with one TPA contract; one LIVE PriceComparisonTool launched 2027-05-01 with covered_items_count 800."
            - "Clock at 2027-06-20T09:00:00Z."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-05-01T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Cascade Health Administrators", vendor_type: "TPA", contact_email: "ops@cascade.example" }
              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
            - call: "POST /compliance/price-comparison-tools"
              payload: { plan_year_id: "${py}", tool_name: "Meridian Cost Estimator", covered_items_count: 800 }
              as: PlanSponsorAdmin
              captures: { tool: "$.data.id" }
            - call: "POST /compliance/price-comparison-tools/${tool}/launch"
              payload: {}
              as: PlanSponsorAdmin
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-06-20T09:00:00Z" }
              as: PlatformOperator
          trigger:
            - call: "POST /compliance/price-comparison-tools/${tool}/evaluations"
              payload: { evaluation_month: "2027-06" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /compliance/price-comparison-tools/${tool}/evaluations"
              payload: { evaluation_month: "2027-01" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /compliance/price-comparison-tools/${tool}/evaluations"
              payload: { evaluation_month: "2027-05" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
