            - { call: "POST /telerad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /telerad/studies", payload: { hospital_id: "${hosp}", accession_number: "ACC-QA", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "QA" }, as: ClientHospitalUser, as_user_id: "${hosp}", captures: { sid: $.data.id } }
            - { call: "POST /telerad/studies/${sid}/route", payload: {}, as: DispatchOps, captures: { sv: $.data.version } }
            - { call: "POST /telerad/assignments", payload: { study_id: "${sid}", radiologist_id: "${rad}", expected_study_version: "${sv}" }, as: DispatchOps, captures: { asg: $.data.id } }
            - { call: "POST /telerad/assignments/${asg}/accept", payload: {}, as: Radiologist, as_user_id: "${rad}" }
            - { call: "POST /telerad/reports", payload: { assignment_id: "${asg}", report_type: "FINAL", findings_text: "f", impression_text: "i" }, as: Radiologist, as_user_id: "${rad}", captures: { rep: $.data.id } }
          trigger:
            - { call: "POST /telerad/reports/${rep}/sign", payload: {}, as: QaReviewer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED; report remains DRAFT"

      - name: signer_cannot_reconcile_own_discrepancy_case
        claim_type: segregation_of_duties
        grounds: [state_machines.DiscrepancyCase.PEER_REVIEW_to_RECONCILED, "errors[ERR_SELF_RECONCILIATION_FORBIDDEN]"]
        distinguishing_aspect: "Segregation of duties: reconcile is rejected when X-User-ID equals the prelim or final signer's radiologist id (ERR_SELF_RECONCILIATION_FORBIDDEN); a neutral QaReviewer id reconciles successfully."
        test_recipe:
