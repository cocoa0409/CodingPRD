      - name: permit_conditions_loop_returns_the_venue_to_review_and_bumps_the_round
        claim_type: cyclic
        grounds:
          - complexity_profile.machine_shape
          - state_machines[PopupVenue].transitions[PERMIT_UNDER_REVIEW -> PERMIT_CONDITIONS]
          - state_machines[PopupVenue].transitions[PERMIT_CONDITIONS -> PERMIT_UNDER_REVIEW]
          - endpoints[POST /venues/{venueId}/permit-submissions]
        distinguishing_aspect: |
          The permit loop is the declared cyclic shape: PERMIT_UNDER_REVIEW <-> PERMIT_CONDITIONS
          can be traversed more than once, and each traversal must advance
          permit_submission_round while the SAME status symbol reappears. Two properties make the
          loop falsifiable: the round counter is monotonic across laps (never reset by re-entering
          PERMIT_UNDER_REVIEW), and permit_conditions_note is cleared to null by every
          resubmission, so a stale note from lap 1 must not survive into lap 2.
        test_recipe:
          setup:
            - "One DRAFT venue at clock 2026-08-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOpsManager
            - call: "POST /venues"
              payload: { city_code: "NYC", site_name: "Pier 9 Shed", lease_start_date: "2026-08-01", lease_end_date: "2027-01-31", base_monthly_rent_cents: 4500000, buildout_allowance_cents: 1500000, buildout_cap_cents: 3000000, requested_occupancy_load: 180, egress_width_cm: 400, sprinklered: true }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { venue_id: $.data.id }
          trigger:
            - call: "POST /venues/${venue_id}/permit-submissions"
              payload: { package_note: "lap 1 package" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /venues/${venue_id}/permit-decisions"
              payload: { decision: "CONDITIONS", note: "add a second marshalled exit at the north wall" }
              as: SafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /venues/${venue_id}/permit-submissions"
              payload: { package_note: "lap 2 package with the north exit" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /venues/${venue_id}/permit-decisions"
              payload: { decision: "CONDITIONS", note: "widen the north exit to 120 cm" }
              as: SafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /venues/${venue_id}/permit-submissions"
              payload: { package_note: "lap 3 package with a 120 cm north exit" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /venues/${venue_id}/permit-decisions"
              payload: { decision: "ISSUED" }
              as: SafetyOfficer
              as_user_id: "officer-1"
          assert:
            - "trigger 1 responds 200 with data.status == PERMIT_UNDER_REVIEW, data.permit_submission_round == 1 and data.permit_conditions_note == null"
            - "trigger 2 responds 200 with data.status == PERMIT_CONDITIONS and data.permit_conditions_note == 'add a second marshalled exit at the north wall'"
            - "trigger 3 responds 200 with data.status == PERMIT_UNDER_REVIEW again — the same symbol on lap 2 — with data.permit_submission_round == 2 and data.permit_conditions_note == null: the lap-1 note was cleared, not carried"
            - "trigger 4 responds 200 with data.permit_conditions_note == 'widen the north exit to 120 cm' and data.permit_submission_round still 2 — a decision never touches the round counter"
            - "trigger 5 responds 200 with data.permit_submission_round == 3, at exactly PERMIT_ROUND_CAP; the counter never reset across the two laps"
            - "trigger 6 responds 200 with data.status == PERMIT_ISSUED, data.permitted_occupancy_load == 180 (min(180, 197)) and data.permit_issued_at == 2026-08-01T00:00:00Z"
            - "PopupVenue.${venue_id}.version == 7 — one increment per accepted call across the whole loop"

