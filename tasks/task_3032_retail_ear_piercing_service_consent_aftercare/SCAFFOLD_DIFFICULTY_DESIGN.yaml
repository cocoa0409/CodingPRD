            - "the adjacent slot at 09:30 was admitted with no ERR_SLOT_OVERLAP"

      - name: autoclave_adjacency_rejected_on_closed_cycle_intervals
        grounds:
          - validations[priority=16]
          - entities.SterilizationCycle.fields.cycle_start_at
          - entities.SterilizationCycle.fields.cycle_end_at
        distinguishing_aspect: |
          Closed-interval semantics on a different resource: two cycles on the same autoclave unit
          whose intervals merely touch at a boundary ARE rejected, because [start, end] makes both
          endpoints inclusive, the geometric opposite of the appointment rule.
        test_recipe:
