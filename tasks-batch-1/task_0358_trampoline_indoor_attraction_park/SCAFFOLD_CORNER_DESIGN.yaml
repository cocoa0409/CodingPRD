              payload: {}
              as: FrontDesk
              captures: { slot_v_after: $.data.version }
          assert:
            - "SessionSlot.${slot_id}.version == 2"
            - "SessionSlot.${slot_id}.seats_taken == 1"

      - name: party_hold_deposit_stale_slot_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[party-deposit-hold-stale-slot]", "errors[ERR_STALE_SLOT_VERSION]"]
        distinguishing_aspect: "Holding a party deposit with expected_slot_version one behind the slot's current version (after another consumer bumped it) returns ERR_STALE_SLOT_VERSION (412)."
        test_recipe:
          setup: ["A pending booking; the slot's version is then advanced by an intervening jump-pass create."]
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 20, base_price_cents: 2000 }
              as: ParkManager
