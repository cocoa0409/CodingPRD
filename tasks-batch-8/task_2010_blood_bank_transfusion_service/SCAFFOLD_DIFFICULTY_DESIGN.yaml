              captures: { xm2: $.data.id }
          assert:
            - "first create: 409 ERR_UNIT_NOT_AVAILABLE — U1's reservation window is occupied"
            - "after X1 cancel: BloodUnit.${u1}.status == AVAILABLE and TransfusionOrder.${ord1}.status == AWAITING_CROSSMATCH"
            - "second create succeeds IMMEDIATELY (zero-gap adjacency): Crossmatch.${xm2}.status == PENDING"
      - name: cooler_checkout_buffer_gap_semantics
        grounds:
          - validations[priority=16]
          - state_machines.CoolerCheckout
        distinguishing_aspect: |
          Resource = TransportCooler, semantics = closed intervals PLUS a
          mandatory 60-minute buffer: a checkout starting exactly at another's
          planned_end still conflicts (12:00 < 12:00+60m); only a start exactly at
          end+buffer (13:00) is accepted — equality at the buffered boundary is
          allowed (strict <). Different arithmetic from the zero-gap half-open
          unit reservation.
        test_recipe:
          setup:
            - "clock 2026-08-10T09:00:00Z; cooler C-1 registered; checkout CO1 booked [2026-08-10T10:00:00Z, 2026-08-10T12:00:00Z]"
          setup_api_calls:
            - call: "POST /blood-bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BloodBankSupervisor
            - call: "POST /blood-bank/coolers"
              payload: { cooler_tag: "C-1" }
              as: BloodBankSupervisor
              captures: { cool: $.data.id }
            - call: "POST /blood-bank/cooler-checkouts"
              payload: { cooler_id: "${cool}", planned_start: "2026-08-10T10:00:00Z", planned_end: "2026-08-10T12:00:00Z" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { co1: $.data.id }
          trigger:
            - call: "POST /blood-bank/cooler-checkouts"
              payload: { cooler_id: "${cool}", planned_start: "2026-08-10T12:00:00Z", planned_end: "2026-08-10T13:00:00Z" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { err: $.data.error_id }
            - call: "POST /blood-bank/cooler-checkouts"
              payload: { cooler_id: "${cool}", planned_start: "2026-08-10T13:00:00Z", planned_end: "2026-08-10T15:00:00Z" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { co2: $.data.id }
          assert:
            - "[12:00,13:00] is rejected: 409 ERR_COOLER_WINDOW_CONFLICT (12:00 < 12:00 + 60min buffer)"
            - "[13:00,15:00] is accepted: CoolerCheckout.${co2}.status == OPEN (13:00 == end+buffer exactly — strict < means equality passes)"
            - "GET /blood-bank/cooler-checkouts?cooler_id=${cool} -> total_count == 2"

  # ===========================================================================
  # Rule 9 — compensating_invariant (three different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: bucket_unit_count_conservation
        grounds:
          - state_machines.BloodUnit
          - calculations.return_disposition
