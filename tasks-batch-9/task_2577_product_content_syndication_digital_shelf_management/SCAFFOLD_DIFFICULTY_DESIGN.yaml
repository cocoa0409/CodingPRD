  - rule_id: resource_temporal_overlap
    instances:
      - name: deployment_windows_touch_at_a_shared_endpoint_without_overlapping
        grounds:
          - validations[priority=43]
          - errors[ERR_DEPLOYMENT_WINDOW_OVERLAP]
          - entities.EnhancedContentDeployment.fields.window_start
          - entities.EnhancedContentDeployment.fields.window_end
          - state_machines.EnhancedContentDeployment.initial_state
        distinguishing_aspect: |
          The placement calendar is half-open: a second deployment whose window_start equals the first
          deployment's window_end is accepted, while a third window that strictly straddles both is
          rejected with ERR_DEPLOYMENT_WINDOW_OVERLAP. Closed-interval arithmetic would reject the
          touching window too, and an endpoints-only comparison would accept the straddling one.
        test_recipe:
          setup:
            - "Retailer SimpleMart is ACTIVE with min_image_count 1, feed_slot_capacity 10, enhanced_content_requires_approval true and a single REQUIRED requirement row title (weight 40), so D == 40 + IMAGE_WEIGHT 20 == 60"
            - "product SKU-D-1 has one APPROVED HERO_IMAGE asset and revision 1 PINNED on the SimpleMart listing through an APPROVED ChangeRequest, so completeness_score_certified == 100.00, completeness_score_declared == 100.00 and readiness_score == 60.00"
            - "ContentVersion revision 1 has pin_count 1 (the single listing reference), Product.status is ACTIVE and Product.last_pinned_at == 2026-08-10T00:00:00Z"
            - "the listing is syndication_state NOT_SYNDICATED / shelf_state OK with no deployment and no observation; the logical clock stands at 2026-08-10T00:00:00Z"
            - "the APPROVED ChangeRequest and the APPROVED HERO_IMAGE asset from the pin are reused for every deployment attempt, and min_image_count 1 is satisfied by that single asset"
            - "no deployment exists yet, so the listing's placement calendar is empty"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
