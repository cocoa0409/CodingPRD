              as: RevenueManager
            - call: "POST /paywall/offer-plans"
              payload: { name: "Digital Notice B", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { plan_nb: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_nb}/activate"
              payload: {}
              as: RevenueManager
              captures: { plan_nb_v2: "$.data.version" }
            - call: "POST /paywall/offer-plans/${plan_nb}/price-change"
              payload: { pending_price_cents: 1799, pending_effective_on: "2026-10-01", grandfather_policy: "GRANDFATHER_EXISTING", expected_offer_plan_version: "${plan_nb_v2}" }
              as: RevenueManager
          trigger:
            - call: "POST /paywall/offer-plans/${plan_na}/price-change/notices"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err_notice: "$.data.error_id" }
            - call: "POST /paywall/offer-plans/${plan_nb}/price-change/notices"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "the plan A notices call returns HTTP 422 with error_id ERR_PRICE_NOTICE_WINDOW_TOO_SHORT"
            - "OfferPlan.${plan_na}.price_change_state == SCHEDULED"
            - "OfferPlan.${plan_na}.notice_sent_on == null"
            - "OfferPlan.${plan_na}.notice_sent_by_user_id == null"
            - "the plan B notices call returns HTTP 200"
            - "OfferPlan.${plan_nb}.price_change_state == NOTICE_SENT"
            - "OfferPlan.${plan_nb}.notice_sent_on == 2026-09-01"
            - "OfferPlan.${plan_nb}.notice_sent_by_user_id == officer-1"
            - "OfferPlan.${plan_nb}.pending_effective_on == 2026-10-01"

      - name: engagement_window_and_propensity_thresholds_at_the_edge
        grounds:
          - calculations.engagement_score
          - calculations.propensity_band_refresh
          - calculations.churn_risk_band
          - endpoints[POST /paywall/billing-runs]
        distinguishing_aspect: |
          Boundary on the 2-decimal engagement metric plus the half-open 30-day window
          at POST /paywall/billing-runs (ENGAGEMENT_ONLY): a score of exactly 10.00
          bands MEDIUM while 9.00 bands LOW, an event exactly 30 days old is excluded
          while one 29 days old decays by 0.5**2, and the empty event set yields 0.00.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; four readers all seeded with propensity_band MEDIUM."
            - "Reader rA has no events at all."
            - "Reader rB has 2 COMMENT_POST events occurring 2026-09-01 (weight 5 each, decay 1.0) -> raw 10.00."
            - "Reader rC has 1 COMMENT_POST and 2 NEWSLETTER_OPEN events occurring 2026-09-01 -> raw 9.00."
            - "Reader rD has 1 COMMENT_POST at 2026-08-02T00:00:00Z (days_ago exactly 30, outside the half-open window) and 1 COMMENT_POST at 2026-08-03T00:00:00Z (days_ago 29, decay 0.5**2 = 0.25) -> raw 1.25."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
