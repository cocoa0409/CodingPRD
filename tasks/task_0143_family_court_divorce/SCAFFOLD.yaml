# =============================================================================
# Family Court / Divorce Case Management — Scaffold (v1)
# =============================================================================

scenario: |
  Family Court / Divorce Case: petition and answer, Financial Disclosure,
  Custody/Parenting Plan, Child Support/Spousal Support state guidelines,
  mediation, Temporary Order, Final Judgment.

domain_name: family-court-divorce
api_prefix: /cases

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
    - version_pinning_on_approval
    - derived_field_reconciliation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: docket_number, type: string, source: system, description: "Unique court docket number (server-minted, format 'FC-YYYY-NNNNNN')" }
      - { name: petitioner_party_id, type: string, source: system, description: "FK -> Party (the filer); set on case creation" }
      - { name: respondent_party_id, type: string, source: system, description: "FK -> Party (responding spouse); set on case creation" }
      - { name: jurisdiction_state, type: enum, source: input, description: "Two-letter US state code; gates which guideline_model is used", constraints: "{CA, NY, TX, FL, IL, WA}" }
      - { name: marriage_date, type: datetime, source: input, description: "Date of marriage (UTC midnight)" }
      - { name: separation_date, type: datetime, source: input, description: "Date of separation (UTC midnight); must be > marriage_date" }
      - { name: has_minor_children, type: boolean, source: input, description: "Whether the marriage produced minor children (<18 as of now())" }
      - { name: status, type: enum, source: system, description: "Case lifecycle status", constraints: "{FILED, AWAITING_ANSWER, ANSWERED, DEFAULTED, DISCLOSURE, MEDIATION, TEMP_ORDERED, AWAITING_JUDGMENT, FINALIZED, DISMISSED}" }
      - { name: answer_deadline_at, type: datetime, source: computed, description: "filed_at + 30 days; pinned at petition acceptance" }
      - { name: response_received_at, type: datetime, source: system, description: "Set when respondent answers; null until then" }
      - { name: mediation_round, type: integer, source: system, description: "Counts how many mediation sessions have closed; starts at 0, increments on session COMPLETED", default: 0 }
      - { name: temporary_order_id, type: string, source: system, description: "FK -> TemporaryOrder (current effective); null until TEMP_ORDERED" }
      - { name: final_judgment_id, type: string, source: system, description: "FK -> FinalJudgment; null until FINALIZED" }

  - name: Party
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case" }
      - { name: role, type: enum, source: input, description: "Party role on the case", constraints: "{PETITIONER, RESPONDENT}" }
      - { name: full_name, type: string, source: input, description: "Legal name" }
      - { name: date_of_birth, type: datetime, source: input, description: "DOB (UTC midnight)" }
      - { name: gross_monthly_income_cents, type: integer, source: input, description: "Self-reported W-2 monthly gross income at petition time, in cents" }
      - { name: counsel_user_id, type: string, source: input, description: "FK -> Attorney user id (opaque); may be null for pro-se", default: null }
      - { name: served_at, type: datetime, source: system, description: "Set when Respondent is served; null for Petitioner and until service" }
      - { name: has_filed_answer, type: boolean, source: system, description: "True once Respondent files an Answer; always false for Petitioner", default: false }

  - name: FinancialDisclosure
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case" }
      - { name: party_id, type: string, source: system, description: "FK -> Party; uniqueness: (case_id, party_id) is unique" }
      - { name: gross_monthly_income_cents, type: integer, source: input, description: "Verified gross monthly income in cents; supersedes Party.gross_monthly_income_cents for calculations" }
      - { name: deductible_taxes_cents, type: integer, source: input, description: "Monthly tax + payroll deductions in cents (>= 0)" }
      - { name: monthly_health_insurance_cents, type: integer, source: input, description: "Monthly health insurance premium attributable to children, in cents (>= 0)" }
      - { name: monthly_childcare_cents, type: integer, source: input, description: "Work-related monthly childcare cost in cents (>= 0)" }
      - { name: assets_total_cents, type: integer, source: input, description: "Listed marital assets attributable to this party in cents (>= 0)" }
      - { name: debts_total_cents, type: integer, source: input, description: "Listed marital debts attributable to this party in cents (>= 0)" }
      - { name: status, type: enum, source: system, description: "Disclosure lifecycle", constraints: "{DRAFT, SUBMITTED, ACCEPTED, REJECTED}" }
      - { name: rejection_reason, type: string, source: input, description: "Required when REJECTED; null otherwise" }
      - { name: net_monthly_income_cents, type: integer, source: computed, description: "= max(0, gross_monthly_income_cents - deductible_taxes_cents); recomputed on every SUBMIT/ACCEPT" }

  - name: ParentingPlan
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case" }
      - { name: proposing_party_id, type: string, source: input, description: "FK -> Party who authored the proposal" }
      - { name: legal_custody, type: enum, source: input, description: "Legal decision-making custody", constraints: "{JOINT, PETITIONER_SOLE, RESPONDENT_SOLE}" }
      - { name: physical_custody, type: enum, source: input, description: "Primary physical custody", constraints: "{JOINT, PETITIONER_PRIMARY, RESPONDENT_PRIMARY}" }
      - { name: petitioner_overnights_per_year, type: integer, source: input, description: "Annual overnights with petitioner (0..365); must sum with respondent_overnights_per_year to 365" }
      - { name: respondent_overnights_per_year, type: integer, source: input, description: "Annual overnights with respondent (0..365)" }
      - { name: status, type: enum, source: system, description: "Plan lifecycle", constraints: "{PROPOSED, COUNTERED, AGREED, CONTESTED, COURT_IMPOSED, SUPERSEDED}" }
      - { name: countered_by_plan_id, type: string, source: system, description: "FK -> ParentingPlan that replaced this one via counter; null for the latest" }
      - { name: pinned_petitioner_disclosure_version, type: integer, source: system, description: "Snapshot of accepting petitioner disclosure version on AGREED; null otherwise" }
      - { name: pinned_respondent_disclosure_version, type: integer, source: system, description: "Snapshot of accepting respondent disclosure version on AGREED; null otherwise" }

  - name: SupportOrder
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case" }
      - { name: support_type, type: enum, source: input, description: "Type of support", constraints: "{CHILD, SPOUSAL}" }
      - { name: order_kind, type: enum, source: input, description: "Whether part of a Temporary or Final order", constraints: "{TEMPORARY, FINAL}" }
      - { name: parenting_plan_id, type: string, source: input, description: "FK -> ParentingPlan for CHILD support; required when support_type=CHILD, must be null for SPOUSAL" }
      - { name: obligor_party_id, type: string, source: system, description: "FK -> Party paying" }
      - { name: obligee_party_id, type: string, source: system, description: "FK -> Party receiving" }
      - { name: monthly_amount_cents, type: integer, source: computed, description: "Calculated by guideline_model on creation; immutable post-issuance" }
      - { name: guideline_model, type: enum, source: computed, description: "INCOME_SHARES or PERCENT_OBLIGOR; chosen by jurisdiction_state on calculation", constraints: "{INCOME_SHARES, PERCENT_OBLIGOR}" }
      - { name: status, type: enum, source: system, description: "Support lifecycle", constraints: "{DRAFT, ISSUED, SUPERSEDED, TERMINATED}" }
      - { name: effective_from, type: datetime, source: system, description: "Set on ISSUED transition (= now())" }
      - { name: superseded_by_id, type: string, source: system, description: "FK -> SupportOrder that replaced this one; null for current" }

  - name: MediationSession
    parent: Case
    common_fields: false
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case" }
      - { name: mediator_user_id, type: string, source: input, description: "Opaque mediator id" }
      - { name: scheduled_start_at, type: datetime, source: input, description: "Session start (ISO8601 UTC)" }
      - { name: scheduled_end_at, type: datetime, source: input, description: "Session end; must be > scheduled_start_at; (end - start) in {60, 120, 180} minutes" }
      - { name: round_index, type: integer, source: system, description: "Equal to Case.mediation_round at SCHEDULED moment; starts at 1 for the first session" }
      - { name: status, type: enum, source: system, description: "Session lifecycle", constraints: "{SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED, NO_SHOW}" }
      - { name: outcome, type: enum, source: input, description: "Required on COMPLETED", constraints: "{AGREEMENT, PARTIAL, IMPASSE}" }
      - { name: parenting_plan_id, type: string, source: input, description: "FK -> ParentingPlan reached at this session; required iff outcome in {AGREEMENT, PARTIAL}" }

  - name: TemporaryOrder
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case" }
      - { name: child_support_order_id, type: string, source: input, description: "FK -> SupportOrder (CHILD, TEMPORARY); null when has_minor_children=false" }
      - { name: spousal_support_order_id, type: string, source: input, description: "FK -> SupportOrder (SPOUSAL, TEMPORARY); null when no spousal support" }
      - { name: parenting_plan_id, type: string, source: input, description: "FK -> ParentingPlan; null when has_minor_children=false" }
      - { name: status, type: enum, source: system, description: "Order lifecycle", constraints: "{DRAFT, EFFECTIVE, SUPERSEDED}" }
      - { name: effective_from, type: datetime, source: system, description: "Set on EFFECTIVE transition (= now())" }
      - { name: superseded_at, type: datetime, source: system, description: "Set when FinalJudgment becomes EFFECTIVE" }

  - name: FinalJudgment
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case" }
      - { name: child_support_order_id, type: string, source: input, description: "FK -> SupportOrder (CHILD, FINAL); null when has_minor_children=false" }
      - { name: spousal_support_order_id, type: string, source: input, description: "FK -> SupportOrder (SPOUSAL, FINAL); null when no spousal support" }
      - { name: parenting_plan_id, type: string, source: input, description: "FK -> ParentingPlan in status AGREED or COURT_IMPOSED; null when has_minor_children=false" }
      - { name: petitioner_asset_share_cents, type: integer, source: computed, description: "Computed by asset_division on DRAFT; immutable after EFFECTIVE" }
      - { name: respondent_asset_share_cents, type: integer, source: computed, description: "Computed by asset_division on DRAFT; immutable after EFFECTIVE" }
      - { name: division_model, type: enum, source: computed, description: "COMMUNITY_PROPERTY (CA, TX, WA) or EQUITABLE_DISTRIBUTION (NY, FL, IL)", constraints: "{COMMUNITY_PROPERTY, EQUITABLE_DISTRIBUTION}" }
      - { name: status, type: enum, source: system, description: "Judgment lifecycle", constraints: "{DRAFT, EFFECTIVE}" }
      - { name: effective_from, type: datetime, source: system, description: "Set on EFFECTIVE transition" }

  - name: ServerClock
    parent: null
    common_fields: false
    fields:
      - { name: now, type: datetime, source: system, description: "Current logical time; only mutable via POST /_clock/advance" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Case
    initial_state: FILED
    terminal_states: [FINALIZED, DISMISSED]
    transitions:
      - from: FILED
        to: AWAITING_ANSWER
        trigger: "system on petition creation (immediately after POST /cases creates Petitioner+Respondent Party rows)"
        actor: system
        preconditions:
          - "Both Petitioner and Respondent Party rows exist"
          - "Respondent.served_at has been set (server stamps it on case creation)"
        side_effects:
          - "Case.answer_deadline_at = now() + 30 days (pinned)"

      - from: AWAITING_ANSWER
        to: ANSWERED
        trigger: POST /cases/{caseId}/answer
        actor: Respondent
        preconditions:
          - "now() <= Case.answer_deadline_at (ERR_ANSWER_WINDOW_EXPIRED)"
          - "Respondent.has_filed_answer == false"
        side_effects:
          - "Respondent.has_filed_answer = true"
          - "Case.response_received_at = now()"

      - from: AWAITING_ANSWER
        to: DEFAULTED
        trigger: POST /cases/{caseId}/default
        actor: Petitioner
        preconditions:
          - "now() > Case.answer_deadline_at (ERR_ANSWER_WINDOW_OPEN)"
          - "Respondent.has_filed_answer == false"
        side_effects:
          - "Default judgment path: Case.status will progress directly toward AWAITING_JUDGMENT once Petitioner disclosure is ACCEPTED (skips mediation requirement)"

      - from: ANSWERED
        to: DISCLOSURE
        trigger: "system: first FinancialDisclosure SUBMITTED on the case"
        actor: system
        preconditions: []
        side_effects: []

      - from: DEFAULTED
        to: DISCLOSURE
        trigger: "system: first FinancialDisclosure SUBMITTED on the case"
        actor: system
        preconditions: []
        side_effects: []

      - from: DISCLOSURE
        to: MEDIATION
        trigger: POST /cases/{caseId}/start-mediation
        actor: Petitioner
        preconditions:
          - "has_minor_children == true (mediation only required for child-affecting cases)"
          - "Both parties have a FinancialDisclosure in ACCEPTED status (ERR_DISCLOSURE_INCOMPLETE)"
          - "Case.status was reached via ANSWERED path (DEFAULTED cases skip mediation)"
        side_effects: []

      - from: DISCLOSURE
        to: TEMP_ORDERED
        trigger: POST /cases/{caseId}/issue-temp-order  (body references existing TemporaryOrder in DRAFT)
        actor: Judge
        preconditions:
          - "Both parties have FinancialDisclosure in ACCEPTED status"
          - "If has_minor_children: at least one ParentingPlan in PROPOSED/COUNTERED/AGREED exists"
          - "TemporaryOrder reference is in DRAFT"
        side_effects:
          - "TemporaryOrder transitions DRAFT -> EFFECTIVE"
          - "Case.temporary_order_id set"
          - "Referenced TEMPORARY SupportOrders transition DRAFT -> ISSUED"

      - from: MEDIATION
        to: TEMP_ORDERED
        trigger: POST /cases/{caseId}/issue-temp-order
        actor: Judge
        preconditions:
          - "TemporaryOrder reference is in DRAFT"
          - "If has_minor_children: ParentingPlan referenced is in AGREED, CONTESTED, or COURT_IMPOSED status"
        side_effects:
          - "TemporaryOrder transitions DRAFT -> EFFECTIVE"
          - "Case.temporary_order_id set"
          - "Referenced TEMPORARY SupportOrders transition DRAFT -> ISSUED"

      - from: MEDIATION
        to: MEDIATION
        trigger: POST /cases/{caseId}/mediation-sessions/{sessionId}/state (to COMPLETED with outcome=IMPASSE) followed by POST /cases/{caseId}/parenting-plans (counter proposal)
        actor: system
        preconditions:
          - "Most recent MediationSession completed with outcome IMPASSE or PARTIAL"
          - "Case.mediation_round < 3"
        side_effects:
          - "Case.mediation_round incremented per COMPLETED session (cyclic — allows another session)"

      - from: MEDIATION
        to: AWAITING_JUDGMENT
        trigger: "system: latest ParentingPlan AGREED OR Case.mediation_round >= 3 with COURT_IMPOSED plan created"
        actor: system
        preconditions:
          - "Either: latest ParentingPlan.status == AGREED, OR: Case.mediation_round >= 3 AND a ParentingPlan in COURT_IMPOSED exists"
        side_effects: []

      - from: TEMP_ORDERED
        to: AWAITING_JUDGMENT
        trigger: "system: ParentingPlan AGREED OR COURT_IMPOSED exists AND has_minor_children=true; OR has_minor_children=false directly"
        actor: system
        preconditions: []
        side_effects: []

      - from: DEFAULTED
        to: AWAITING_JUDGMENT
        trigger: "system: Petitioner FinancialDisclosure ACCEPTED on DEFAULTED case"
        actor: system
        preconditions:
          - "Case.status == DEFAULTED (set above)"
          - "Petitioner FinancialDisclosure.status == ACCEPTED"
        side_effects: []

      - from: AWAITING_JUDGMENT
        to: FINALIZED
        trigger: POST /cases/{caseId}/issue-final-judgment (body references FinalJudgment in DRAFT)
        actor: Judge
        preconditions:
          - "FinalJudgment reference is in DRAFT and on this case"
          - "If has_minor_children: ParentingPlan referenced is AGREED or COURT_IMPOSED"
          - "Both parties have FinancialDisclosure in ACCEPTED"
        side_effects:
          - "FinalJudgment.status -> EFFECTIVE; effective_from = now()"
          - "Referenced FINAL SupportOrders transition DRAFT -> ISSUED"
          - "If Case.temporary_order_id is set: that TemporaryOrder.status -> SUPERSEDED; its child/spousal SupportOrders -> SUPERSEDED"
          - "Case.final_judgment_id set"

      - from: FILED
        to: DISMISSED
        trigger: POST /cases/{caseId}/dismiss
        actor: Judge
        preconditions: []
        side_effects: []

      - from: AWAITING_ANSWER
        to: DISMISSED
        trigger: POST /cases/{caseId}/dismiss
        actor: Judge
        preconditions: []
        side_effects: []

  - entity: FinancialDisclosure
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /cases/{caseId}/disclosures/{disclosureId}/submit
        actor: Petitioner_or_Respondent
        preconditions:
          - "All numeric fields >= 0"
          - "gross_monthly_income_cents > 0 (ERR_DISCLOSURE_INCOMPLETE)"
          - "deductible_taxes_cents <= gross_monthly_income_cents (ERR_DISCLOSURE_INCONSISTENT)"
        side_effects:
          - "net_monthly_income_cents recomputed"
          - "If Case.status == ANSWERED: Case.status -> DISCLOSURE"
          - "If Case.status == DEFAULTED: Case.status remains DEFAULTED but disclosure progress is tracked"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: POST /cases/{caseId}/disclosures/{disclosureId}/accept
        actor: Judge
        preconditions: []
        side_effects:
          - "If Case.status == DEFAULTED AND this is Petitioner disclosure: Case.status -> AWAITING_JUDGMENT"

      - from: SUBMITTED
        to: REJECTED
        trigger: POST /cases/{caseId}/disclosures/{disclosureId}/reject
        actor: Judge
        preconditions:
          - "rejection_reason in request (ERR_REJECTION_REASON_REQUIRED)"
        side_effects: []

      - from: REJECTED
        to: DRAFT
        trigger: PATCH /cases/{caseId}/disclosures/{disclosureId}
        actor: Petitioner_or_Respondent
        preconditions: []
        side_effects:
          - "rejection_reason cleared to null"

  - entity: ParentingPlan
    initial_state: PROPOSED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: COUNTERED
        trigger: POST /cases/{caseId}/parenting-plans (creating a counter with countered_plan_id pointing to this)
        actor: Petitioner_or_Respondent
        preconditions:
          - "Counter proposer must be the party who did NOT propose this plan (ERR_COUNTER_BY_PROPOSER)"
        side_effects:
          - "This plan's countered_by_plan_id set to the new plan's id"

      - from: PROPOSED
        to: AGREED
        trigger: POST /cases/{caseId}/parenting-plans/{planId}/accept
        actor: Petitioner_or_Respondent
        preconditions:
          - "Acceptor must be the party who did NOT propose (ERR_SELF_ACCEPT)"
          - "Both parties have FinancialDisclosure in ACCEPTED (ERR_DISCLOSURE_INCOMPLETE)"
        side_effects:
          - "pinned_petitioner_disclosure_version = current Petitioner disclosure.version"
          - "pinned_respondent_disclosure_version = current Respondent disclosure.version"

      - from: COUNTERED
        to: AGREED
        trigger: POST /cases/{caseId}/parenting-plans/{planId}/accept
        actor: Petitioner_or_Respondent
        preconditions:
          - "Acceptor must be the party who did NOT propose"
          - "No newer counter exists (countered_by_plan_id must be null)"
          - "Both parties have FinancialDisclosure in ACCEPTED"
        side_effects:
          - "Disclosure versions pinned as above"

      - from: PROPOSED
        to: CONTESTED
        trigger: "system: linked MediationSession COMPLETED with outcome=IMPASSE AND Case.mediation_round >= 3"
        actor: system
        preconditions: []
        side_effects: []

      - from: CONTESTED
        to: COURT_IMPOSED
        trigger: POST /cases/{caseId}/parenting-plans/{planId}/impose
        actor: Judge
        preconditions:
          - "Plan.status == CONTESTED"
          - "Case.mediation_round >= 3 (ERR_MEDIATION_NOT_EXHAUSTED)"
        side_effects: []

      - from: AGREED
        to: SUPERSEDED
        trigger: "system: FinalJudgment with a different parenting_plan_id transitions to EFFECTIVE"
        actor: system
        preconditions: []
        side_effects: []

      - from: COURT_IMPOSED
        to: SUPERSEDED
        trigger: "system: FinalJudgment with a different parenting_plan_id transitions to EFFECTIVE"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MediationSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: POST /cases/{caseId}/mediation-sessions/{sessionId}/start
        actor: Mediator
        preconditions:
          - "now() >= scheduled_start_at - 15 minutes AND now() <= scheduled_end_at (ERR_SESSION_OUT_OF_WINDOW)"
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: POST /cases/{caseId}/mediation-sessions/{sessionId}/complete
        actor: Mediator
        preconditions:
          - "outcome in request (ERR_OUTCOME_REQUIRED)"
          - "If outcome in {AGREEMENT, PARTIAL}: parenting_plan_id in request and plan belongs to this case"
        side_effects:
          - "Case.mediation_round += 1"
          - "If outcome == AGREEMENT AND parenting_plan_id provided: linked ParentingPlan auto-transitions PROPOSED/COUNTERED -> AGREED (provided disclosures ACCEPTED, else session COMPLETES with outcome=AGREEMENT but plan stays in current status)"
          - "If outcome == IMPASSE AND Case.mediation_round >= 3: latest active ParentingPlan PROPOSED/COUNTERED -> CONTESTED"

      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /cases/{caseId}/mediation-sessions/{sessionId}/cancel
        actor: Mediator
        preconditions:
          - "now() < scheduled_start_at (ERR_SESSION_ALREADY_STARTED)"
        side_effects: []

      - from: SCHEDULED
        to: NO_SHOW
        trigger: POST /cases/{caseId}/mediation-sessions/{sessionId}/no-show
        actor: Mediator
        preconditions:
          - "now() > scheduled_end_at (ERR_SESSION_NOT_OVER)"
        side_effects:
          - "Case.mediation_round += 1 (counts toward the 3-round cap)"

  - entity: SupportOrder
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "system: parent TemporaryOrder transitions DRAFT->EFFECTIVE or FinalJudgment transitions DRAFT->EFFECTIVE"
        actor: system
        preconditions:
          - "Order references the issuing TemporaryOrder/FinalJudgment"
          - "Both disclosures ACCEPTED"
        side_effects:
          - "effective_from = now()"

      - from: ISSUED
        to: SUPERSEDED
        trigger: "system: a newer SupportOrder of the same support_type for the same case is ISSUED"
        actor: system
        preconditions: []
        side_effects:
          - "superseded_by_id set to the new SupportOrder.id"

      - from: ISSUED
        to: TERMINATED
        trigger: POST /cases/{caseId}/support-orders/{orderId}/terminate
        actor: Judge
        preconditions:
          - "support_type == CHILD AND no child currently <18 OR support_type == SPOUSAL AND obligee remarried (boolean in request)"
        side_effects: []

  - entity: TemporaryOrder
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: EFFECTIVE
        trigger: "system: POST /cases/{caseId}/issue-temp-order on parent Case"
        actor: system
        preconditions: []
        side_effects:
          - "effective_from = now()"
          - "Child/spousal SupportOrders DRAFT -> ISSUED"

      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system: FinalJudgment on same case transitions DRAFT -> EFFECTIVE"
        actor: system
        preconditions: []
        side_effects:
          - "superseded_at = now()"
          - "Linked TEMPORARY SupportOrders -> SUPERSEDED"

  - entity: FinalJudgment
    initial_state: DRAFT
    terminal_states: [EFFECTIVE]
    transitions:
      - from: DRAFT
        to: EFFECTIVE
        trigger: "system: POST /cases/{caseId}/issue-final-judgment on parent Case"
        actor: system
        preconditions: []
        side_effects:
          - "effective_from = now()"
          - "Linked FINAL SupportOrders DRAFT -> ISSUED"
          - "Case.temporary_order_id's TemporaryOrder EFFECTIVE -> SUPERSEDED (cascade)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Respondent files Answer at the same instant Petitioner requests Default"
    guarantee: "First writer wins; if Default lands first, Answer is rejected as window-expired-by-default; if Answer lands first, Default sees Respondent.has_filed_answer == true"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Case.status transition out of AWAITING_ANSWER"

  - scenario: "Both parties accept the SAME ParentingPlan simultaneously"
    guarantee: "Exactly one accept succeeds; the second is rejected because the proposer-cannot-accept rule applies, OR because plan is already AGREED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on ParentingPlan.status"

  - scenario: "Two mediators try to mark the same MediationSession COMPLETED at the same time"
    guarantee: "Exactly one COMPLETE wins; second fails as session already terminal"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on MediationSession.status"

  - scenario: "Judge issues final judgment while Petitioner is filing a counter ParentingPlan"
    guarantee: "Final judgment requires Case.status==AWAITING_JUDGMENT; counter is only legal in MEDIATION; whichever lands first defines the case status the loser sees"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Case.status"

  - scenario: "Two mediation sessions scheduled for the same Mediator that overlap"
    guarantee: "Second scheduling rejected if [scheduled_start_at, scheduled_end_at) on the same mediator_user_id overlaps an existing SCHEDULED/IN_PROGRESS session"
    error_id: ERR_MEDIATOR_DOUBLE_BOOKED
    http_status: 409
    serialization: "First-writer-wins on mediator schedule"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: child_support_amount
    trigger: "POST /cases/{caseId}/support-orders body { support_type: CHILD } (server computes monthly_amount_cents at creation)"
    algorithm: tiered_pricing
    formula: |
      # Inputs are taken from the most recently ACCEPTED FinancialDisclosure for each party,
      # AND from the ParentingPlan referenced in the request (must exist).
      P_net = petitioner.net_monthly_income_cents
      R_net = respondent.net_monthly_income_cents
      combined = P_net + R_net
      P_overnights = parenting_plan.petitioner_overnights_per_year
      R_overnights = parenting_plan.respondent_overnights_per_year

      # Step 1 — determine basic_support from combined-income tier (per child, one child assumed; multi-child out of scope):
      if combined <= 200000:        basic = round(combined * 0.17)             # 17 percent
      elif combined <= 500000:      basic = round(200000 * 0.17 + (combined - 200000) * 0.20)
      elif combined <= 1000000:     basic = round(200000 * 0.17 + 300000 * 0.20 + (combined - 500000) * 0.22)
      else:                         basic = round(200000 * 0.17 + 300000 * 0.20 + 500000 * 0.22 + (combined - 1000000) * 0.10)

      # Step 2 — add presumed add-ons (sum of both parties' work-related childcare and health-insurance premiums):
      addons = (P.monthly_childcare_cents + R.monthly_childcare_cents
                + P.monthly_health_insurance_cents + R.monthly_health_insurance_cents)
      total_basic = basic + addons

      # Step 3 — apportion by guideline_model (jurisdiction_state on Case):
      if Case.jurisdiction_state in {CA, NY, IL}:
        guideline_model = INCOME_SHARES
        # obligor pays in proportion to share of combined income, reduced by their share of overnights
        if R_net >= P_net:
          obligor = RESPONDENT; obligor_income_share = R_net / combined
          obligor_overnight_share = R_overnights / 365
        else:
          obligor = PETITIONER; obligor_income_share = P_net / combined
          obligor_overnight_share = P_overnights / 365
        # Rounding order PINNED: compute monthly_amount in cents, then ROUND HALF UP to nearest cent.
        # Single rounding step at the end — do NOT round income_share or overnight_share to 2 decimals first.
        monthly = round(total_basic * (obligor_income_share - 0.5 * obligor_overnight_share))
        if monthly < 0: monthly = 0
      else:  # TX, FL, WA
        guideline_model = PERCENT_OBLIGOR
        if R_net >= P_net:
          obligor = RESPONDENT; obligor_net = R_net
        else:
          obligor = PETITIONER; obligor_net = P_net
        # Tier on obligor net only, ignore other party's income:
        if obligor_net <= 200000:    pct = 0.20
        elif obligor_net <= 500000:  pct = 0.22
        elif obligor_net <= 1000000: pct = 0.25
        else:                        pct = 0.27
        monthly = round(obligor_net * pct) + round(addons * (obligor_net / combined if combined > 0 else 0))

      monthly_amount_cents = monthly
    input_set: "Each party's most recent FinancialDisclosure in status ACCEPTED; ParentingPlan referenced in the request"
    constants:
      TIER1_CAP: 200000
      TIER2_CAP: 500000
      TIER3_CAP: 1000000
    precision: "All intermediate arithmetic in cents (integers). Final monthly_amount_cents is the result of a single round_half_up at the end of the formula. NO intermediate rounding of percentages."
    variants:
      - name: income_shares
        when: "Case.jurisdiction_state in {CA, NY, IL}"
        difference: "Uses combined income tiering and apportions by income_share - 0.5*overnight_share"
      - name: percent_obligor
        when: "Case.jurisdiction_state in {TX, FL, WA}"
        difference: "Uses obligor-only income tiering at higher rates; ignores overnights"

  - name: spousal_support_amount
    trigger: "POST /cases/{caseId}/support-orders body { support_type: SPOUSAL }"
    algorithm: threshold
    formula: |
      # Eligibility:
      #   marriage_duration_years = floor((separation_date - marriage_date).days / 365.25)
      #   if marriage_duration_years < 5: monthly = 0; return (no order allowed -> ERR_NOT_ELIGIBLE_FOR_SPOUSAL)
      P_net = petitioner.net_monthly_income_cents
      R_net = respondent.net_monthly_income_cents
      higher = max(P_net, R_net); lower = min(P_net, R_net)
      gap = higher - lower
      # Tiered transfer percentage by marriage duration:
      if 5 <= marriage_duration_years < 10:    pct = 0.30
      elif 10 <= marriage_duration_years < 20: pct = 0.35
      else:                                    pct = 0.40
      monthly = round(gap * pct)
      # Cap: monthly cannot exceed 0.40 * higher net income.
      cap = round(higher * 0.40)
      if monthly > cap: monthly = cap
      monthly_amount_cents = monthly
    input_set: "Both parties' most recent ACCEPTED FinancialDisclosure; Case.marriage_date and Case.separation_date"
    constants:
      MIN_MARRIAGE_YEARS_FOR_SPOUSAL: 5
      CAP_PCT_OF_HIGHER: 0.40
    precision: "All arithmetic in cents (integers); single round_half_up at end"

  - name: asset_division
    trigger: "POST /cases/{caseId}/final-judgments body computes petitioner_asset_share_cents and respondent_asset_share_cents on DRAFT"
    algorithm: aggregation
    formula: |
      P_assets = petitioner_disclosure.assets_total_cents
      R_assets = respondent_disclosure.assets_total_cents
      P_debts  = petitioner_disclosure.debts_total_cents
      R_debts  = respondent_disclosure.debts_total_cents
      gross_pool = P_assets + R_assets
      net_pool   = gross_pool - P_debts - R_debts
      if Case.jurisdiction_state in {CA, TX, WA}:
        division_model = COMMUNITY_PROPERTY
        # Strict 50/50 split of net_pool; if odd cent, petitioner gets the extra cent.
        half = net_pool // 2
        extra = net_pool - 2 * half
        petitioner_asset_share_cents = half + extra
        respondent_asset_share_cents = half
      else:  # NY, FL, IL
        division_model = EQUITABLE_DISTRIBUTION
        # Income-weighted: shares are proportional to NET monthly income, then floor for petitioner
        # and respondent gets the remainder, so the invariant P_share + R_share == net_pool holds exactly.
        P_inc = petitioner_disclosure.net_monthly_income_cents
        R_inc = respondent_disclosure.net_monthly_income_cents
        if P_inc + R_inc == 0:
          petitioner_asset_share_cents = net_pool // 2
        else:
          # Compute petitioner's share as (R_inc / (P_inc+R_inc)) * net_pool — lower earner gets larger share
          # Order PINNED: do integer multiplication FIRST, then integer division, to avoid float drift.
          petitioner_asset_share_cents = (net_pool * R_inc) // (P_inc + R_inc)
        respondent_asset_share_cents = net_pool - petitioner_asset_share_cents
    input_set: "Each party's most recent ACCEPTED FinancialDisclosure; net_pool computed therefrom"
    constants: {}
    precision: "All amounts in integer cents. PINNED invariant: petitioner_asset_share_cents + respondent_asset_share_cents == net_pool (no drift)."
    variants:
      - name: community_property
        when: "jurisdiction_state in {CA, TX, WA}"
        difference: "50/50 split with extra cent to petitioner"
      - name: equitable_distribution
        when: "jurisdiction_state in {NY, FL, IL}"
        difference: "Income-weighted: lower earner receives larger share via integer arithmetic"

  - name: answer_deadline
    trigger: "Case transitions FILED -> AWAITING_ANSWER"
    algorithm: threshold
    formula: |
      Case.answer_deadline_at = filed_at + 30 days
      # Pinned at petition acceptance; not affected by service date.
    input_set: "Case.created_at (= filed_at)"
    constants:
      ANSWER_WINDOW_DAYS: 30
    precision: "datetime arithmetic; deadline is inclusive (now() <= deadline -> answer still allowed)"

  - name: marriage_duration_years
    trigger: "Whenever spousal_support_amount or final judgment is computed"
    algorithm: aggregation
    formula: |
      delta_days = (Case.separation_date - Case.marriage_date).days
      marriage_duration_years = floor(delta_days / 365.25)
    input_set: "Case.marriage_date, Case.separation_date"
    constants: {}
    precision: "Floor to integer years (so a 4-year-364-day marriage is 4 years and ineligible)"

# =============================================================================
# §1.4 Validation Rules Table (ordered)
# =============================================================================
validations:
  - { priority: 1,  category: auth,                  check: "X-User-Role and X-User-ID headers present and well-formed",                                      error_id: ERR_AUTH_MISSING,                http_status: 401, applies_to: all }
  - { priority: 2,  category: auth,                  check: "Role permitted for this endpoint per RBAC matrix",                                                error_id: ERR_FORBIDDEN,                   http_status: 403, applies_to: all }
  - { priority: 3,  category: existence,             check: "Path resource IDs exist, validated left-to-right (caseId, then disclosureId, etc.)",             error_id: ERR_NOT_FOUND,                   http_status: 404, applies_to: all }
  - { priority: 4,  category: auth,                  check: "If acting as Petitioner/Respondent, X-User-ID matches the Party.id of the corresponding role on this case", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all party-scoped endpoints" }
  - { priority: 5,  category: state,                 check: "Target resource is in a state from which the requested transition is legal",                      error_id: ERR_INVALID_STATE,               http_status: 409, applies_to: "state transition + action endpoints" }
  - { priority: 6,  category: state,                 check: "Cross-entity precondition: parties have FinancialDisclosure in ACCEPTED before mediation/temp-order/final",  error_id: ERR_DISCLOSURE_INCOMPLETE,       http_status: 409, applies_to: "start-mediation, issue-temp-order, issue-final-judgment, parenting-plan accept" }
  - { priority: 7,  category: business_temporal,     check: "Answer arrives within answer_deadline_at; default request only after deadline",                   error_id: ERR_ANSWER_WINDOW_EXPIRED,       http_status: 409, applies_to: "POST /cases/{id}/answer, POST /cases/{id}/default" }
  - { priority: 8,  category: business_temporal,     check: "Mediator schedule overlap: no two SCHEDULED/IN_PROGRESS sessions for same mediator with overlapping [start,end)", error_id: ERR_MEDIATOR_DOUBLE_BOOKED,      http_status: 409, applies_to: "POST /cases/{id}/mediation-sessions" }
  - { priority: 9,  category: business_constraint,   check: "Counter-proposer must NOT be the proposer of the plan being countered",                          error_id: ERR_COUNTER_BY_PROPOSER,         http_status: 422, applies_to: "POST /cases/{id}/parenting-plans (counter)" }
  - { priority: 10, category: business_constraint,   check: "Self-accept forbidden: acceptor must not be the proposing_party_id of the plan",                  error_id: ERR_SELF_ACCEPT,                 http_status: 422, applies_to: "POST /cases/{id}/parenting-plans/{planId}/accept" }
  - { priority: 11, category: business_referential,  check: "ParentingPlan overnight counts: petitioner_overnights_per_year + respondent_overnights_per_year == 365", error_id: ERR_OVERNIGHTS_INVALID, http_status: 422, applies_to: "POST /cases/{id}/parenting-plans" }
  - { priority: 12, category: business_referential,  check: "SupportOrder.parenting_plan_id required iff support_type=CHILD; must be null for SPOUSAL",        error_id: ERR_PLAN_REQUIRED_OR_FORBIDDEN,  http_status: 422, applies_to: "POST /cases/{id}/support-orders" }
  - { priority: 13, category: business_fiscal,       check: "Spousal eligibility: marriage_duration_years >= 5 (else ERR_NOT_ELIGIBLE_FOR_SPOUSAL)",          error_id: ERR_NOT_ELIGIBLE_FOR_SPOUSAL,    http_status: 422, applies_to: "POST /cases/{id}/support-orders for SPOUSAL" }
  - { priority: 14, category: business_fiscal,       check: "FinancialDisclosure consistency: deductible_taxes_cents <= gross_monthly_income_cents",          error_id: ERR_DISCLOSURE_INCONSISTENT,     http_status: 422, applies_to: "POST /cases/{id}/disclosures/{id}/submit" }
  - { priority: 15, category: business_constraint,   check: "Mediation cap: cannot start a 4th mediation session once Case.mediation_round >= 3 unless previous one was CANCELLED (not counted)", error_id: ERR_MEDIATION_CAP_REACHED, http_status: 409, applies_to: "POST /cases/{id}/mediation-sessions" }
  - { priority: 16, category: business_constraint,   check: "COURT_IMPOSED requires Case.mediation_round >= 3",                                                 error_id: ERR_MEDIATION_NOT_EXHAUSTED,     http_status: 409, applies_to: "POST /cases/{id}/parenting-plans/{planId}/impose" }
  - { priority: 17, category: business_temporal,     check: "Mediation session start window: now() in [scheduled_start_at - 15min, scheduled_end_at]",          error_id: ERR_SESSION_OUT_OF_WINDOW,       http_status: 409, applies_to: "POST /cases/{id}/mediation-sessions/{sessionId}/start" }
  - { priority: 18, category: business_referential,  check: "TemporaryOrder body: has_minor_children==true => parenting_plan_id and child_support_order_id required; has_minor_children==false => both must be null", error_id: ERR_TEMP_ORDER_FIELDS, http_status: 422, applies_to: "POST /cases/{id}/temp-orders" }
  - { priority: 19, category: business_fiscal,       check: "Separation must be strictly after marriage: separation_date > marriage_date",                     error_id: ERR_SEPARATION_BEFORE_MARRIAGE,  http_status: 422, applies_to: "POST /cases" }
  - { priority: 20, category: business_constraint,   check: "OCC: version field in PATCH body must match server version",                                       error_id: ERR_VERSION_CONFLICT,            http_status: 409, applies_to: "PATCH endpoints" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving endpoint required for time-gated states) ---
  - { method: POST, path: "/_clock/advance",                                          description: "Advance server clock to a given ISO8601 instant (only forward, monotone).",          roles: [PlatformAdmin], code: 200, input: [to_timestamp],                                                            output: ServerClock, side_effects: ["ServerClock.now updated"] }
  - { method: GET,  path: "/_clock",                                                  description: "Get current server clock.",                                                          roles: [PlatformAdmin, Petitioner, Respondent, Judge, Mediator, AttorneyOfRecord], code: 200, input: [], output: ServerClock, side_effects: [] }

  # --- Cases ---
  - { method: POST, path: "/cases",                                                   description: "File petition; server creates Petitioner+Respondent Party rows and stamps Respondent.served_at = now().", roles: [AttorneyOfRecord, Petitioner], code: 201, input: [jurisdiction_state, marriage_date, separation_date, has_minor_children, petitioner, respondent], output: Case, side_effects: ["Case.status FILED -> AWAITING_ANSWER (system, immediately)", "Case.answer_deadline_at = now() + 30 days", "Both Party rows minted"] }
  - { method: GET,  path: "/cases/{caseId}",                                          description: "Get case detail.",                                                                    roles: [Petitioner, Respondent, Judge, AttorneyOfRecord, PlatformAdmin], code: 200, input: [], output: Case, side_effects: [] }
  - { method: GET,  path: "/cases",                                                   description: "List cases with filtering.",                                                          roles: [Judge, PlatformAdmin], code: 200, input: ["status?", "jurisdiction_state?", "limit?", "offset?"], output: "Case[]", side_effects: [] }
  - { method: POST, path: "/cases/{caseId}/answer",                                   description: "Respondent files Answer.",                                                            roles: [Respondent, AttorneyOfRecord], code: 200, input: [], output: Case, side_effects: ["Case.status AWAITING_ANSWER -> ANSWERED", "Respondent.has_filed_answer = true", "Case.response_received_at = now()"] }
  - { method: POST, path: "/cases/{caseId}/default",                                  description: "Petitioner requests entry of default after window expires.",                          roles: [Petitioner, AttorneyOfRecord], code: 200, input: [], output: Case, side_effects: ["Case.status AWAITING_ANSWER -> DEFAULTED"] }
  - { method: POST, path: "/cases/{caseId}/start-mediation",                          description: "Petitioner triggers mediation phase.",                                                roles: [Petitioner, AttorneyOfRecord], code: 200, input: [], output: Case, side_effects: ["Case.status DISCLOSURE -> MEDIATION"] }
  - { method: POST, path: "/cases/{caseId}/issue-temp-order",                         description: "Judge issues current DRAFT TemporaryOrder.",                                          roles: [Judge], code: 200, input: [temporary_order_id], output: Case, side_effects: ["TemporaryOrder DRAFT -> EFFECTIVE", "Linked TEMPORARY SupportOrders DRAFT -> ISSUED", "Case.temporary_order_id set", "Case.status -> TEMP_ORDERED"] }
  - { method: POST, path: "/cases/{caseId}/issue-final-judgment",                     description: "Judge issues current DRAFT FinalJudgment.",                                           roles: [Judge], code: 200, input: [final_judgment_id], output: Case, side_effects: ["FinalJudgment DRAFT -> EFFECTIVE", "Linked FINAL SupportOrders DRAFT -> ISSUED", "TemporaryOrder EFFECTIVE -> SUPERSEDED (cascade)", "Linked TEMPORARY SupportOrders -> SUPERSEDED (cascade)", "Case.status -> FINALIZED"] }
  - { method: POST, path: "/cases/{caseId}/dismiss",                                  description: "Judge dismisses case before answer.",                                                  roles: [Judge], code: 200, input: [reason], output: Case, side_effects: ["Case.status -> DISMISSED"] }

  # --- Parties (read-only after creation) ---
  - { method: GET,  path: "/cases/{caseId}/parties",                                  description: "List parties on the case.",                                                            roles: [Petitioner, Respondent, Judge, AttorneyOfRecord, PlatformAdmin], code: 200, input: [], output: "Party[]", side_effects: [] }
  - { method: GET,  path: "/cases/{caseId}/parties/{partyId}",                        description: "Get party detail.",                                                                    roles: [Petitioner, Respondent, Judge, AttorneyOfRecord, PlatformAdmin], code: 200, input: [], output: Party, side_effects: [] }

  # --- FinancialDisclosure ---
  - { method: POST, path: "/cases/{caseId}/disclosures",                              description: "Party creates their own FinancialDisclosure in DRAFT.",                                roles: [Petitioner, Respondent, AttorneyOfRecord], code: 201, input: [party_id, gross_monthly_income_cents, deductible_taxes_cents, monthly_health_insurance_cents, monthly_childcare_cents, assets_total_cents, debts_total_cents], output: FinancialDisclosure, side_effects: ["Unique on (case_id, party_id) — second create rejected ERR_DUPLICATE_DISCLOSURE", "net_monthly_income_cents computed"] }
  - { method: PATCH, path: "/cases/{caseId}/disclosures/{disclosureId}",              description: "Owning party updates a DRAFT or REJECTED disclosure; uses version OCC.",              roles: [Petitioner, Respondent, AttorneyOfRecord], code: 200, input: [version, "gross_monthly_income_cents?", "deductible_taxes_cents?", "monthly_health_insurance_cents?", "monthly_childcare_cents?", "assets_total_cents?", "debts_total_cents?"], output: FinancialDisclosure, side_effects: ["If status=REJECTED -> DRAFT; rejection_reason cleared", "net_monthly_income_cents recomputed"] }
  - { method: POST, path: "/cases/{caseId}/disclosures/{disclosureId}/submit",        description: "Owning party submits.",                                                                roles: [Petitioner, Respondent, AttorneyOfRecord], code: 200, input: [version], output: FinancialDisclosure, side_effects: ["status DRAFT -> SUBMITTED", "Case auto: ANSWERED -> DISCLOSURE on first submit"] }
  - { method: POST, path: "/cases/{caseId}/disclosures/{disclosureId}/accept",        description: "Judge accepts.",                                                                       roles: [Judge], code: 200, input: [version], output: FinancialDisclosure, side_effects: ["status SUBMITTED -> ACCEPTED", "If Case.status==DEFAULTED & Petitioner disclosure: Case.status -> AWAITING_JUDGMENT (cascade)"] }
  - { method: POST, path: "/cases/{caseId}/disclosures/{disclosureId}/reject",        description: "Judge rejects.",                                                                       roles: [Judge], code: 200, input: [version, rejection_reason], output: FinancialDisclosure, side_effects: ["status SUBMITTED -> REJECTED"] }
  - { method: GET,  path: "/cases/{caseId}/disclosures",                              description: "List disclosures on case.",                                                            roles: [Petitioner, Respondent, Judge, AttorneyOfRecord], code: 200, input: [], output: "FinancialDisclosure[]", side_effects: [] }

  # --- ParentingPlan ---
  - { method: POST, path: "/cases/{caseId}/parenting-plans",                          description: "Propose or counter a parenting plan. If countered_plan_id present, this is a counter.", roles: [Petitioner, Respondent, AttorneyOfRecord], code: 201, input: [proposing_party_id, legal_custody, physical_custody, petitioner_overnights_per_year, respondent_overnights_per_year, "countered_plan_id?"], output: ParentingPlan, side_effects: ["If counter: target plan PROPOSED -> COUNTERED; target.countered_by_plan_id set"] }
  - { method: POST, path: "/cases/{caseId}/parenting-plans/{planId}/accept",          description: "Non-proposing party accepts the plan.",                                                roles: [Petitioner, Respondent, AttorneyOfRecord], code: 200, input: [version], output: ParentingPlan, side_effects: ["status PROPOSED/COUNTERED -> AGREED", "pinned_petitioner_disclosure_version, pinned_respondent_disclosure_version set"] }
  - { method: POST, path: "/cases/{caseId}/parenting-plans/{planId}/impose",          description: "Judge imposes a plan once mediation cap reached.",                                     roles: [Judge], code: 200, input: [version], output: ParentingPlan, side_effects: ["status CONTESTED -> COURT_IMPOSED"] }
  - { method: GET,  path: "/cases/{caseId}/parenting-plans",                          description: "List plans.",                                                                          roles: [Petitioner, Respondent, Judge, AttorneyOfRecord], code: 200, input: [], output: "ParentingPlan[]", side_effects: [] }
  - { method: GET,  path: "/cases/{caseId}/parenting-plans/{planId}",                 description: "Get plan.",                                                                            roles: [Petitioner, Respondent, Judge, AttorneyOfRecord], code: 200, input: [], output: ParentingPlan, side_effects: [] }

  # --- MediationSession ---
  - { method: POST, path: "/cases/{caseId}/mediation-sessions",                       description: "Schedule a mediation session.",                                                        roles: [Mediator, Judge], code: 201, input: [mediator_user_id, scheduled_start_at, scheduled_end_at], output: MediationSession, side_effects: ["round_index = Case.mediation_round + 1"] }
  - { method: POST, path: "/cases/{caseId}/mediation-sessions/{sessionId}/start",     description: "Mediator marks session in progress.",                                                  roles: [Mediator], code: 200, input: [], output: MediationSession, side_effects: ["status SCHEDULED -> IN_PROGRESS"] }
  - { method: POST, path: "/cases/{caseId}/mediation-sessions/{sessionId}/complete",  description: "Mediator marks session completed.",                                                    roles: [Mediator], code: 200, input: [outcome, "parenting_plan_id?"], output: MediationSession, side_effects: ["status IN_PROGRESS -> COMPLETED", "Case.mediation_round += 1", "If outcome=AGREEMENT & disclosures ACCEPTED & plan provided: that plan PROPOSED/COUNTERED -> AGREED (cascade)", "If outcome=IMPASSE & Case.mediation_round>=3: latest PROPOSED/COUNTERED plan -> CONTESTED (cascade)"] }
  - { method: POST, path: "/cases/{caseId}/mediation-sessions/{sessionId}/cancel",    description: "Cancel before start.",                                                                 roles: [Mediator, Judge], code: 200, input: [], output: MediationSession, side_effects: ["status SCHEDULED -> CANCELLED"] }
  - { method: POST, path: "/cases/{caseId}/mediation-sessions/{sessionId}/no-show",   description: "Mark session as no-show after window passes.",                                         roles: [Mediator, Judge], code: 200, input: [], output: MediationSession, side_effects: ["status SCHEDULED -> NO_SHOW", "Case.mediation_round += 1"] }
  - { method: GET,  path: "/cases/{caseId}/mediation-sessions",                       description: "List sessions for case.",                                                              roles: [Petitioner, Respondent, Judge, Mediator, AttorneyOfRecord], code: 200, input: [], output: "MediationSession[]", side_effects: [] }

  # --- SupportOrder ---
  - { method: POST, path: "/cases/{caseId}/support-orders",                           description: "Create DRAFT SupportOrder; server computes monthly_amount_cents via guideline.",      roles: [Judge], code: 201, input: [support_type, order_kind, "parenting_plan_id?"], output: SupportOrder, side_effects: ["monthly_amount_cents computed at creation per child_support_amount or spousal_support_amount"] }
  - { method: GET,  path: "/cases/{caseId}/support-orders/{orderId}",                 description: "Get support order.",                                                                   roles: [Petitioner, Respondent, Judge, AttorneyOfRecord], code: 200, input: [], output: SupportOrder, side_effects: [] }
  - { method: POST, path: "/cases/{caseId}/support-orders/{orderId}/terminate",       description: "Terminate ISSUED order (e.g., child reaches 18, obligee remarries).",                  roles: [Judge], code: 200, input: ["obligee_remarried?"], output: SupportOrder, side_effects: ["status ISSUED -> TERMINATED"] }
  - { method: GET,  path: "/cases/{caseId}/support-orders",                           description: "List support orders on case.",                                                         roles: [Petitioner, Respondent, Judge, AttorneyOfRecord], code: 200, input: [], output: "SupportOrder[]", side_effects: [] }

  # --- TemporaryOrder ---
  - { method: POST, path: "/cases/{caseId}/temp-orders",                              description: "Create DRAFT TemporaryOrder bundling support+parenting refs.",                          roles: [Judge], code: 201, input: ["child_support_order_id?", "spousal_support_order_id?", "parenting_plan_id?"], output: TemporaryOrder, side_effects: ["status=DRAFT"] }
  - { method: GET,  path: "/cases/{caseId}/temp-orders/{tempOrderId}",                description: "Get temporary order.",                                                                 roles: [Petitioner, Respondent, Judge, AttorneyOfRecord], code: 200, input: [], output: TemporaryOrder, side_effects: [] }

  # --- FinalJudgment ---
  - { method: POST, path: "/cases/{caseId}/final-judgments",                          description: "Create DRAFT FinalJudgment; server computes asset shares.",                            roles: [Judge], code: 201, input: ["child_support_order_id?", "spousal_support_order_id?", "parenting_plan_id?"], output: FinalJudgment, side_effects: ["petitioner_asset_share_cents and respondent_asset_share_cents computed via asset_division"] }
  - { method: GET,  path: "/cases/{caseId}/final-judgments/{judgmentId}",             description: "Get final judgment.",                                                                  roles: [Petitioner, Respondent, Judge, AttorneyOfRecord], code: 200, input: [], output: FinalJudgment, side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_AUTH_MISSING,                http: 401, condition: "Missing or malformed X-User-Role/X-User-ID headers" }
  - { id: ERR_FORBIDDEN,                   http: 403, condition: "Role not permitted, OR party-scoped operation by wrong X-User-ID" }
  - { id: ERR_NOT_FOUND,                   http: 404, condition: "Resource ID in path does not exist within parent scope" }
  - { id: ERR_INVALID_STATE,               http: 409, condition: "Target resource is in a state that doesn't allow this transition" }
  - { id: ERR_VERSION_CONFLICT,            http: 409, condition: "OCC: version in request does not match server version" }
  - { id: ERR_DISCLOSURE_INCOMPLETE,       http: 409, condition: "Operation requires both parties' FinancialDisclosure to be in ACCEPTED" }
  - { id: ERR_DISCLOSURE_INCONSISTENT,     http: 422, condition: "deductible_taxes_cents exceeds gross_monthly_income_cents" }
  - { id: ERR_DUPLICATE_DISCLOSURE,        http: 409, condition: "(case_id, party_id) already has a FinancialDisclosure" }
  - { id: ERR_REJECTION_REASON_REQUIRED,   http: 422, condition: "Judge rejected a disclosure without providing rejection_reason" }
  - { id: ERR_ANSWER_WINDOW_EXPIRED,       http: 409, condition: "now() > Case.answer_deadline_at when filing Answer" }
  - { id: ERR_ANSWER_WINDOW_OPEN,          http: 409, condition: "Default requested while Answer window is still open" }
  - { id: ERR_COUNTER_BY_PROPOSER,         http: 422, condition: "Counter ParentingPlan submitted by the same party who proposed the original" }
  - { id: ERR_SELF_ACCEPT,                 http: 422, condition: "Party tried to accept a ParentingPlan they themselves proposed" }
  - { id: ERR_OVERNIGHTS_INVALID,          http: 422, condition: "Overnight counts on ParentingPlan do not sum to 365 or any value out of [0, 365]" }
  - { id: ERR_PLAN_REQUIRED_OR_FORBIDDEN,  http: 422, condition: "CHILD support_type missing parenting_plan_id, or SPOUSAL support_type with parenting_plan_id set" }
  - { id: ERR_NOT_ELIGIBLE_FOR_SPOUSAL,    http: 422, condition: "marriage_duration_years < 5 when attempting SPOUSAL support order" }
  - { id: ERR_MEDIATION_CAP_REACHED,       http: 409, condition: "Case.mediation_round >= 3 when scheduling a new session" }
  - { id: ERR_MEDIATION_NOT_EXHAUSTED,     http: 409, condition: "Judge tried to COURT_IMPOSE a plan before mediation_round >= 3" }
  - { id: ERR_MEDIATOR_DOUBLE_BOOKED,      http: 409, condition: "Mediator has an overlapping SCHEDULED or IN_PROGRESS session on another case" }
  - { id: ERR_SESSION_OUT_OF_WINDOW,       http: 409, condition: "Mediation session start outside [scheduled_start_at - 15min, scheduled_end_at]" }
  - { id: ERR_SESSION_NOT_OVER,            http: 409, condition: "no-show requested before scheduled_end_at" }
  - { id: ERR_SESSION_ALREADY_STARTED,     http: 409, condition: "Cancel attempted after scheduled_start_at" }
  - { id: ERR_OUTCOME_REQUIRED,            http: 422, condition: "Session completion missing outcome" }
  - { id: ERR_TEMP_ORDER_FIELDS,           http: 422, condition: "TemporaryOrder field combination invalid given has_minor_children" }
  - { id: ERR_SEPARATION_BEFORE_MARRIAGE,  http: 422, condition: "Case.separation_date <= Case.marriage_date" }
  - { id: ERR_CLOCK_NOT_MONOTONE,          http: 409, condition: "POST /_clock/advance with to_timestamp earlier than current ServerClock.now" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Petitioner
    description: "The spouse who files the petition."
    identity: "entity_backed:Party"
    exclusive_operations:
      - "POST /cases (when self-filing without counsel)"
      - "POST /cases/{caseId}/default"
      - "POST /cases/{caseId}/start-mediation"
    shared_operations:
      - "GET /cases/{caseId}, /parties, /disclosures, /parenting-plans, /support-orders, /temp-orders, /final-judgments, /mediation-sessions"
      - "POST/PATCH /cases/{caseId}/disclosures (own only; X-User-ID == party_id)"
      - "POST /cases/{caseId}/parenting-plans (proposing_party_id == X-User-ID)"
      - "POST /cases/{caseId}/parenting-plans/{planId}/accept (only if NOT proposer)"

  - name: Respondent
    description: "The spouse served with the petition."
    identity: "entity_backed:Party"
    exclusive_operations:
      - "POST /cases/{caseId}/answer"
    shared_operations:
      - "GET /cases/{caseId}, /parties, /disclosures, /parenting-plans, /support-orders, /temp-orders, /final-judgments, /mediation-sessions"
      - "POST/PATCH /cases/{caseId}/disclosures (own only)"
      - "POST /cases/{caseId}/parenting-plans"
      - "POST /cases/{caseId}/parenting-plans/{planId}/accept (only if NOT proposer)"

  - name: AttorneyOfRecord
    description: "Counsel acting on behalf of a Petitioner or Respondent."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "All Petitioner/Respondent operations, scoped to the Party they represent (Party.counsel_user_id == X-User-ID); cannot accept a plan their own party proposed"

  - name: Judge
    description: "Court officer who accepts/rejects disclosures, issues temp orders, imposes parenting plans, issues final judgments. Segregation: cannot also act as Petitioner/Respondent/AttorneyOfRecord/Mediator on the same case."
    identity: "opaque"
    exclusive_operations:
      - "POST /cases/{caseId}/disclosures/{disclosureId}/accept"
      - "POST /cases/{caseId}/disclosures/{disclosureId}/reject"
      - "POST /cases/{caseId}/issue-temp-order"
      - "POST /cases/{caseId}/issue-final-judgment"
      - "POST /cases/{caseId}/parenting-plans/{planId}/impose"
      - "POST /cases/{caseId}/support-orders"
      - "POST /cases/{caseId}/support-orders/{orderId}/terminate"
      - "POST /cases/{caseId}/temp-orders"
      - "POST /cases/{caseId}/final-judgments"
      - "POST /cases/{caseId}/dismiss"
      - "GET  /cases (administrative list)"
    shared_operations:
      - "GET on all case sub-resources"

  - name: Mediator
    description: "Neutral facilitator of mediation sessions. Segregation: cannot also act as Judge on the same case."
    identity: "opaque"
    exclusive_operations:
      - "POST /cases/{caseId}/mediation-sessions/{sessionId}/start"
      - "POST /cases/{caseId}/mediation-sessions/{sessionId}/complete"
      - "POST /cases/{caseId}/mediation-sessions/{sessionId}/no-show"
    shared_operations:
      - "POST /cases/{caseId}/mediation-sessions (schedule; shared with Judge)"
      - "POST /cases/{caseId}/mediation-sessions/{sessionId}/cancel (shared with Judge)"
      - "GET on mediation-sessions for cases assigned"

  - name: PlatformAdmin
    description: "Operates clock and lists across the platform; no party-level operations."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/advance"
    shared_operations:
      - "GET /_clock, GET /cases"
