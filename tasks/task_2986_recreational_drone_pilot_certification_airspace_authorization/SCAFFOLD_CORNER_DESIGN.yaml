            - "${e_commercial_flight} == \"ERR_RECREATIONAL_OPERATION_FORBIDDEN\" at 422 - priority 27 answers before any insurance check, so it is not ERR_INSURANCE_NOT_ACTIVE"
            - "${e_commercial_test} == \"ERR_RECREATIONAL_OPERATION_FORBIDDEN\" at 422 - the same code covers the test-eligibility half of the rule"
            - "${e_unregistered} == \"ERR_AIRCRAFT_NOT_REGISTERED\" at 422 for the PENDING_REGISTRATION airframe"
            - "${grounded_state} == \"GROUNDED\" and ${e_grounded} == \"ERR_AIRCRAFT_GROUNDED\" at 422 - a distinct code from the unregistered case, on an identical request body"
            - "${suspended_state} == \"SUSPENDED\" and ${e_suspended} == \"ERR_PILOT_SUSPENDED\" at 409 - the gate reads the target owner's status, not the caller's role"
            - "no Flight row exists for either pilot at the end: every probe was refused before any write"

      - name: authorization_containment_and_waiver_prerequisite_codes_are_triggerable
        claim_type: triggerable
        grounds:
          - errors.ERR_AUTHORIZATION_WINDOW_MISMATCH
          - errors.ERR_ALTITUDE_CEILING_EXCEEDED
          - errors.ERR_WAIVER_REQUIRED
          - errors.ERR_SAFETY_CASE_MISSING
          - validations.priority_25
        distinguishing_aspect: |
          Containment is probed from both ends against one APPROVED authorization: a flight that
          starts too early and a flight whose planned_end lands exactly on window_end, which the
          declared rule rejects because that bound is exclusive. The same authorization then
          yields the flight-side ceiling code against granted_ceiling_ft rather than the zone
          class ceiling, and the special-operation gate answers before the ceiling gate. A final
          control flight sits exactly on the inclusive lower bound at exactly the granted
          ceiling, proving the two boundaries have opposite strictness.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "Pilot P: RECREATIONAL, CERTIFIED (insurance gates do not apply to recreational work)."
            - "Airframe A: 249 g, max_altitude_ft 1200, REGISTERED."
            - "Zone Z: class D, class_ceiling_ft 700, requires_authorization true, max_concurrent_authorizations 2."
            - "One AirspaceAuthorization APPROVED for window [2026-06-10T08:00:00Z, 2026-06-10T12:00:00Z) with granted_ceiling_ft 400 (the RECREATIONAL_CAP_FT binds under the 700 ft class ceiling)."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Cai Norr", email: "cai.norr@example.com", operator_category: "RECREATIONAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "TRUST_RECREATIONAL", scheduled_at: "2026-05-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 100 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Contain 1", serial_number: "SN-CTN-01", takeoff_weight_g: 249, max_altitude_ft: 1200 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-D-CTN", class_code: "D", class_ceiling_ft: 700, requires_authorization: true, max_concurrent_authorizations: 2 }
              as: AirspaceAuthority
              captures: { zid: $.data.id, zv: $.data.version }
            - call: "POST /drone-ops/airspace-authorizations"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", requested_ceiling_ft: 500, window_start: "2026-06-10T08:00:00Z", window_end: "2026-06-10T12:00:00Z", expected_zone_version: "${zv}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { auid: $.data.id }
            - call: "POST /drone-ops/airspace-authorizations/${auid}/decide"
              payload: { decision: "APPROVE" }
              as: AirspaceAuthority
              captures: { granted: $.data.granted_ceiling_ft }
            - call: "GET /drone-ops/pilots/${pid}"
              payload: {}
              as: ComplianceOfficer
              captures: { pv: $.data.version }
            - call: "POST /drone-ops/waivers"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", waiver_type: "NIGHT", requested_ceiling_ft: 400, operation_description: "Dusk survey of a rail cutting.", expected_pilot_version: "${pv}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { wid: $.data.id }
          trigger:
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", authorization_id: "${auid}", operation_category: "RECREATIONAL", planned_start: "2026-06-10T07:30:00Z", planned_end: "2026-06-10T09:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 52.2, launch_longitude: 0.12 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { e_early: $.data.error_id }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", authorization_id: "${auid}", operation_category: "RECREATIONAL", planned_start: "2026-06-10T11:00:00Z", planned_end: "2026-06-10T12:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 52.2, launch_longitude: 0.12 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { e_touching_end: $.data.error_id }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", authorization_id: "${auid}", operation_category: "RECREATIONAL", planned_start: "2026-06-10T09:00:00Z", planned_end: "2026-06-10T10:00:00Z", planned_max_altitude_ft: 420, launch_latitude: 52.2, launch_longitude: 0.12 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { e_ceiling: $.data.error_id }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", authorization_id: "${auid}", operation_category: "RECREATIONAL", planned_start: "2026-06-10T09:00:00Z", planned_end: "2026-06-10T10:00:00Z", planned_max_altitude_ft: 380, night_operation: true, launch_latitude: 52.2, launch_longitude: 0.12 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { e_waiver: $.data.error_id }
            - call: "POST /drone-ops/waivers/${wid}/submit"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { e_case: $.data.error_id }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", authorization_id: "${auid}", operation_category: "RECREATIONAL", planned_start: "2026-06-10T08:00:00Z", planned_end: "2026-06-10T11:59:59Z", planned_max_altitude_ft: 400, launch_latitude: 52.2, launch_longitude: 0.12 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { boundary_status: $.data.status }
          assert:
            - "${granted} == 400 - min(400 base, 700 class, 1200 airframe, 400 recreational cap)"
            - "${e_early} == \"ERR_AUTHORIZATION_WINDOW_MISMATCH\" at 422 - 07:30 precedes window_start 08:00"
            - "${e_touching_end} == \"ERR_AUTHORIZATION_WINDOW_MISMATCH\" at 422 - planned_end 12:00 equals window_end, and the rule demands planned_end strictly earlier"
            - "${e_ceiling} == \"ERR_ALTITUDE_CEILING_EXCEEDED\" at 422 - 420 ft is measured against granted_ceiling_ft 400, not against the 700 ft class ceiling that would have allowed it"
            - "${e_waiver} == \"ERR_WAIVER_REQUIRED\" at 422 for a night operation citing no waiver - priority 23 answers even though the DRAFT NIGHT waiver exists, because it is not APPROVED"
            - "${e_case} == \"ERR_SAFETY_CASE_MISSING\" at 422 - submission needs at least one SafetyCase row, and the waiver stays DRAFT"
            - "${boundary_status} == \"PLANNED\" - planned_start exactly on window_start and planned_max_altitude_ft exactly at the granted ceiling are both accepted, so the two bounds are inclusive while window_end is not"
            - "exactly one Flight row exists for pilot P: the four rejected creations wrote nothing"

      - name: knowledge_test_attempt_cap_is_triggerable_and_the_trailing_window_releases_it
        claim_type: triggerable
        grounds:
          - errors.ERR_TEST_ATTEMPT_LIMIT
          - validations.priority_34
        distinguishing_aspect: |
          The cap counts KnowledgeTest rows by scheduled_at inside the trailing 365 days of the
          logical clock, not lifetime attempts, so the same pilot who is refused a fourth test
          is granted one after the clock moves far enough that the oldest attempt falls out of
          the window. The clock is placed so that the second attempt sits exactly on the
          inclusive lower bound and is therefore still counted: only one row drops.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z."
            - "Pilot P: RECREATIONAL, UNCERTIFIED throughout, because every TRUST attempt is graded below PASS_SCORE_TRUST and returns the pilot to UNCERTIFIED."
            - "Three FAILED KnowledgeTest rows with scheduled_at 2026-07-01T00:00:00Z, 2026-07-02T00:00:00Z and 2026-07-03T00:00:00Z."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Tam Oyle", email: "tam.oyle@example.com", operator_category: "RECREATIONAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "TRUST_RECREATIONAL", scheduled_at: "2026-07-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { k1: $.data.id, a1: $.data.attempt_number }
            - call: "POST /drone-ops/knowledge-tests/${k1}/grade"
              payload: { raw_score: 50 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "TRUST_RECREATIONAL", scheduled_at: "2026-07-02T00:00:00Z" }
              as: ComplianceOfficer
              captures: { k2: $.data.id, a2: $.data.attempt_number }
            - call: "POST /drone-ops/knowledge-tests/${k2}/grade"
              payload: { raw_score: 80 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "TRUST_RECREATIONAL", scheduled_at: "2026-07-03T00:00:00Z" }
              as: ComplianceOfficer
              captures: { k3: $.data.id, a3: $.data.attempt_number }
            - call: "POST /drone-ops/knowledge-tests/${k3}/grade"
              payload: { raw_score: 99 }
              as: ComplianceOfficer
              captures: { third_status: $.data.status }
          trigger:
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "TRUST_RECREATIONAL", scheduled_at: "2026-07-04T00:00:00Z" }
              as: ComplianceOfficer
              captures: { e_cap: $.data.error_id }
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-02T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "TRUST_RECREATIONAL", scheduled_at: "2027-07-02T00:00:00Z" }
              as: ComplianceOfficer
              captures: { k4: $.data.id, a4: $.data.attempt_number, s4: $.data.status }
          assert:
            - "${a1} == 1, ${a2} == 2, ${a3} == 3 - attempt_number counts every row for the pilot regardless of the trailing window"
            - "${third_status} == \"FAILED\" - 99 is below PASS_SCORE_TRUST 100, so the pilot is back in UNCERTIFIED and the pilot-state gate at priority 13 is not what refuses the fourth request"
            - "${e_cap} == \"ERR_TEST_ATTEMPT_LIMIT\" at 422 - three rows already sit inside the trailing 365 days of 2026-07-01"
            - "at the clock 2027-07-02T00:00:00Z the window opens at 2026-07-02T00:00:00Z, so only the 2026-07-01 row falls out while the 2026-07-02 row is retained on the inclusive bound: the count is 2 and ${s4} == \"SCHEDULED\""
            - "${a4} == 4 - the new row is the pilot's fourth lifetime attempt even though it is only the third inside the window, so attempt_number and the cap counter are different quantities"

      - name: duplicate_accident_filing_is_triggerable_until_the_prior_report_is_withdrawn
        claim_type: triggerable
        grounds:
          - errors.ERR_ACCIDENT_REPORT_DUPLICATE
          - validations.priority_33
        distinguishing_aspect: |
          The one-report-per-flight rule is scoped to a status set, not to the flight's whole
          history: FILED, INVESTIGATING, REMEDIATION_REQUIRED and CLOSED all block a second
          filing, but WITHDRAWN does not. So the same POST that was refused succeeds unchanged
          once the earlier report is withdrawn, which distinguishes a status-scoped uniqueness
          rule from a plain unique index on flight_id.
