              payload: { name: "Floor Applicant", applicant_type: "SPECIALTY_SOCIETY", society_id: "${soc_w1}", is_entity_member: true, dues_paid_current: true, contact_email: "floor@example.org" }
              as: EditorialStaff
              captures: { app_fl: $.data.id }
            - call: "POST /cpt/meetings"
              payload: { meeting_code: "OCT2026", meeting_month: "OCTOBER", starts_at: "2026-10-12T14:00:00Z", ends_at: "2026-10-12T23:00:00Z", citation_mode: false }
              as: EditorialStaff
              captures: { mtg_fl: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EditorialStaff
            - call: "POST /cpt/code-changes"
              payload: { code: "00071", change_type: "ADDITION", category: "CATEGORY_I", code_family: "000", applicant_id: "${app_fl}", society_id: "${soc_w1}", clinical_evidence_tier: "TIER_II", procedure_volume_threshold: 700, descriptor_current: "First placeholder", descriptor_proposed: "First placeholder revised" }
              as: EditorialStaff
              captures: { chg_fl: $.data.id }
            - call: "POST /cpt/code-changes"
              payload: { code: "00072", change_type: "ADDITION", category: "CATEGORY_I", code_family: "000", applicant_id: "${app_fl}", society_id: "${soc_w1}", clinical_evidence_tier: "TIER_II", procedure_volume_threshold: 700, descriptor_current: "Second placeholder" }
              as: EditorialStaff
              captures: { chg_fl2: $.data.id }
            - call: "POST /cpt/code-changes"
              payload: { code: "00073", change_type: "ADDITION", category: "CATEGORY_I", code_family: "000", applicant_id: "${app_fl}", society_id: "${soc_w1}", clinical_evidence_tier: "TIER_II", procedure_volume_threshold: 700, descriptor_current: "Third placeholder" }
              as: EditorialStaff
              captures: { chg_fl3: $.data.id }
            - call: "POST /cpt/meetings/${mtg_fl}/agenda"
              payload: { change_ids: ["${chg_fl}", "${chg_fl2}", "${chg_fl3}"] }
              as: EditorialStaff
              captures: { mtg_fl_v1: $.data.version }
            - call: "POST /cpt/meetings/${mtg_fl}/openings"
              payload: {}
              as: EditorialPanelChair
              captures: { mtg_fl_v2: $.data.version }
            - call: "POST /cpt/editorial-votes"
              payload: { change_id: "${chg_fl}", meeting_id: "${mtg_fl}", society_id: "${soc_w1}", vote: "YES" }
              as: EditorialPanelChair
              captures: { fl_vote_yes: $.data.id }
            - call: "POST /cpt/editorial-votes"
              payload: { change_id: "${chg_fl}", meeting_id: "${mtg_fl}", society_id: "${soc_w2}", vote: "NO" }
              as: EditorialPanelChair
              captures: { fl_vote_no: $.data.id }
            - call: "POST /cpt/editorial-votes"
              payload: { change_id: "${chg_fl}", meeting_id: "${mtg_fl}", society_id: "${soc_w1}", vote: "ABSTAIN" }
              as: EditorialPanelChair
              captures: { fl_vote_abs: $.data.id }
          trigger:
            - call: "POST /cpt/code-changes/${chg_fl}/determinations"
              payload: { determination: "APPROVED", determination_basis: "Meets the panel floor" }
              as: EditorialPanelChair
              captures: { fl_det_v: $.data.version }
          assert:
            - "CodeChange.${chg_fl}.determination == APPROVED"
            - "EditorialPanelMeeting.${mtg_fl}.weighted_yes == 20"
            - "EditorialPanelMeeting.${mtg_fl}.weighted_no == 17"
            - "CodeChange.${chg_fl}.cea_credits == 2.5"

      - name: errata_publication_overwrites_code_value_payment
        claim_type: side_effect_execution
        grounds:
          - calculations.errata_proration_recalculation
          - state_machines.ErrataNotice.PROPOSED_to_PUBLISHED
          - entities.CodeValue.fields.facility_payment_cents
        distinguishing_aspect: |
          Publishing an errata notice overwrites the named CodeValue's
          facility_payment_cents with the prorated figure, so the code value
          moves from 18173 to the prorated value while its other RVU fields stay
          untouched.
        test_recipe:
          setup:
            - "One SpecialtySociety with national GPCIs"
            - "One CodeValue 00080 with conversion_factor 34.63, work_rvu 2.80, facility_pe_rvu 1.90, nonfacility_pe_rvu 1.90 and mp_rvu 0.24"
            - "Logical clock at 2026-01-05T00:00:00Z"
            - "One ErrataNotice against that code value with errata_effective_date 2027-05-03 and prior_facility_payment_cents 18173"
          setup_api_calls:
            - call: "POST /cpt/specialty-societies"
              payload: { name: "Errata Society", specialty_code: "ERR", voting_seat_count: 1, gpci_work: 1.0521, gpci_pe: 1.1234, gpci_mp: 0.6980 }
              as: EditorialStaff
              captures: { soc_er: $.data.id }
            - call: "POST /cpt/code-values"
              payload: { code: "00080", specialty_id: "${soc_er}", work_rvu: 2.80, facility_pe_rvu: 1.90, nonfacility_pe_rvu: 1.90, mp_rvu: 0.24, conversion_factor: 34.63, rounding_variant: "AGGREGATE_ROUNDING" }
              as: LicensingOfficer
              captures: { cv_er: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: EditorialStaff
            - call: "POST /cpt/code-values/${cv_er}/effective-dates"
              payload: { effective_date: "2027-01-01T00:00:00Z" }
              as: LicensingOfficer
              captures: { cv_er_v1: $.data.version }
            - call: "POST /cpt/errata-notices"
              payload: { code_value_id: "${cv_er}", errata_effective_date: "2027-05-03T00:00:00Z", prior_facility_payment_cents: 18173, reason: "Practice-expense RVU overstated" }
              as: EditorialStaff
              captures: { err_er: $.data.id }
          trigger:
            - call: "POST /cpt/errata-notices/${err_er}/publications"
              payload: {}
              as: EditorialStaff
              captures: { err_er_v1: $.data.version }
          assert:
            - "ErrataNotice.${err_er}.status == PUBLISHED"
            - "CodeValue.${cv_er}.facility_payment_cents == 12099"
            - "CodeValue.${cv_er}.work_rvu == 2.80"
            - "CodeValue.${cv_er}.conversion_factor == 34.63"

  - section: validations
    instances:
      - name: sponsor_required_on_cycle_submission
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - errors[ERR_SPONSOR_REQUIRED]
          - entities.CodeChange.fields.society_id
        distinguishing_aspect: |
          Submitting a change with no sponsoring society into a release cycle is
          rejected with ERR_SPONSOR_REQUIRED at status 422 while the same change
          carrying a society is submitted successfully.
        test_recipe:
          setup:
            - "One ACTIVE ChangeApplicant, one meeting and one open ReleaseCycle"
            - "Logical clock at 2026-09-01T00:00:00Z"
            - "One DRAFT CodeChange 00081 with no sponsoring society"
          setup_api_calls:
            - call: "POST /cpt/applicants"
              payload: { name: "Unsponsored Applicant", applicant_type: "PHYSICIAN", is_entity_member: true, dues_paid_current: true, contact_email: "unsponsored@example.org" }
              as: EditorialStaff
              captures: { app_un: $.data.id }
            - call: "POST /cpt/meetings"
              payload: { meeting_code: "DEC2026", meeting_month: "DECEMBER", starts_at: "2026-12-07T14:00:00Z", ends_at: "2026-12-07T23:00:00Z", citation_mode: false }
              as: EditorialStaff
              captures: { mtg_un: $.data.id }
