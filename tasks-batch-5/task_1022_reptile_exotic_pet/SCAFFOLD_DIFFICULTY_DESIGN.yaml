scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: sale_price_provisional_vs_final
        grounds:
          - calculations.sale_price
          - entities.Sale.fields.provisional_price_cents
          - entities.Sale.fields.sale_price_cents
        distinguishing_aspect: "On the SAME Sale, the provisional variant (DRAFT) omits the loyalty discount and yields 20000 while the final variant (CONFIRM) includes GOLD loyalty and yields 18000 — a dual-variant calc on the Sale/pricing domain."
        test_recipe:
          setup:
            - "Non-regulated Species (min_quarantine_days=0, warranty_days=30, permit_class NONE)."
            - "Animal list_price 20000, acquisition_cost 8000, quarantine-cleared to AVAILABLE."
            - "Customer loyalty_tier GOLD."
            - "Sale drafted (provisional_price_cents pinned), then confirmed (sale_price_cents pinned)."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Corn Snake", scientific_name: "Pantherophis guttatus", is_regulated: false, permit_class: "NONE", min_quarantine_days: 0, warranty_days: 30, care_temp_low_c: 24, care_temp_high_c: 30, care_humidity_low_pct: 40, care_humidity_high_pct: 60, feed_interval_days: 7, care_feeder_type: "MOUSE_ADULT" }
              as: StoreManager
              captures: { sp_id: $.data.id }
            - call: "POST /animals"
              payload: { species_id: "${sp_id}", morph: "Amel", acquisition_cost_cents: 8000, list_price_cents: 20000 }
              as: StoreManager
              as_user_id: "mgr-intake"
              captures: { an_id: $.data.id }
            - call: "POST /animals/${an_id}/start-quarantine"
              payload: {}
              as: VetTech
              captures: { qr_id: $.data.id }
            - call: "POST /quarantine-records/${qr_id}/health-checks"
              payload: { result: "PASS", weight_grams: 300 }
              as: VetTech
            - call: "POST /quarantine-records/${qr_id}/health-checks"
              payload: { result: "PASS", weight_grams: 305 }
              as: VetTech
            - call: "POST /quarantine-records/${qr_id}/clear"
              payload: {}
              as: VetTech
            - call: "POST /customers"
              payload: { full_name: "Ada Lomax", email: "ada@x.com", loyalty_tier: "GOLD" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /sales"
              payload: { animal_id: "${an_id}", customer_id: "${cust_id}", sold_at_expo: false }
              as: SalesAssociate
              captures: { sale_id: $.data.id, prov: $.data.provisional_price_cents }
          trigger:
            - call: "POST /sales/${sale_id}/confirm"
              payload: {}
              as: SalesAssociate
              captures: { final: $.data.sale_price_cents }
          assert:
            - "Sale.${sale_id}.provisional_price_cents == 20000"
            - "Sale.${sale_id}.sale_price_cents == 18000"
            - "Sale.${sale_id}.provisional_price_cents != Sale.${sale_id}.sale_price_cents"

      - name: warranty_refund_doa_vs_early_death
        grounds:
          - calculations.warranty_refund
          - entities.WarrantyClaim.fields.refund_cents
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
        distinguishing_aspect: "Refund on the WarrantyClaim domain is dual-variant: EARLY_DEATH prorates 18000 by remaining_days/warranty_days = 15/30 -> 9000, whereas DOA would refund the full 18000 on the same sale."
        test_recipe:
          setup:
            - "Non-regulated Species warranty_days=30, min_quarantine_days=0."
            - "Animal list_price 18000; Customer STANDARD; Sale confirmed at 2026-07-01 then FULFILLED (sale_price_cents=18000, warranty_expires_at=2026-07-31)."
            - "Clock advanced to 2026-07-16 (remaining_days=15)."
            - "EARLY_DEATH WarrantyClaim SUBMITTED."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Leopard Gecko", scientific_name: "Eublepharis macularius", is_regulated: false, permit_class: "NONE", min_quarantine_days: 0, warranty_days: 30, care_temp_low_c: 22, care_temp_high_c: 32, care_humidity_low_pct: 30, care_humidity_high_pct: 40, feed_interval_days: 2, care_feeder_type: "CRICKET" }
              as: StoreManager
              captures: { sp_id: $.data.id }
            - call: "POST /animals"
              payload: { species_id: "${sp_id}", morph: "Tangerine", acquisition_cost_cents: 5000, list_price_cents: 18000 }
              as: StoreManager
              as_user_id: "mgr-intake"
              captures: { an_id: $.data.id }
            - call: "POST /animals/${an_id}/start-quarantine"
              payload: {}
              as: VetTech
              captures: { qr_id: $.data.id }
            - call: "POST /quarantine-records/${qr_id}/health-checks"
              payload: { result: "PASS" }
              as: VetTech
            - call: "POST /quarantine-records/${qr_id}/health-checks"
              payload: { result: "PASS" }
              as: VetTech
            - call: "POST /quarantine-records/${qr_id}/clear"
              payload: {}
              as: VetTech
            - call: "POST /customers"
              payload: { full_name: "Bo Reyes", email: "bo@x.com", loyalty_tier: "STANDARD" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /sales"
              payload: { animal_id: "${an_id}", customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/confirm"
              payload: {}
              as: SalesAssociate
            - call: "POST /sales/${sale_id}/fulfill"
              payload: {}
              as: SalesAssociate
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-16T00:00:00Z" }
              as: StoreManager
            - call: "POST /sales/${sale_id}/warranty-claims"
              payload: { claim_type: "EARLY_DEATH", reason: "died week 2" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { wc_id: $.data.id }
          trigger:
            - call: "POST /warranty-claims/${wc_id}/approve"
              payload: {}
              as: StoreManager
              as_user_id: "mgr-approve"
              captures: { refund: $.data.refund_cents }
          assert:
            - "WarrantyClaim.${wc_id}.refund_cents == 9000"
            - "WarrantyClaim.${wc_id}.status == APPROVED"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: sale_price_tiered_surcharge_and_discount_mode_a
        grounds:
          - calculations.sale_price
          - validations[priority=55]
          - entities.Sale.fields.sale_price_cents
        distinguishing_aspect: "Mode (a): >=3 interacting inputs (list_price, CLASS_III permit-class surcharge tier, SILVER loyalty tier, expo flag) with tiered selection plus a max() cost floor produce sale_price_cents=20010."
        test_recipe:
          setup:
            - "Regulated Species permit_class CLASS_III, min_quarantine_days=0, warranty_days=30."
            - "Animal list_price 20000, acquisition_cost 8000, quarantine-cleared to AVAILABLE."
            - "Customer SILVER with a VERIFIED CLASS_III permit."
            - "Sale drafted with sold_at_expo=true and permit_id set."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Green Tree Python", scientific_name: "Morelia viridis", is_regulated: true, permit_class: "CLASS_III", min_quarantine_days: 0, warranty_days: 30, care_temp_low_c: 26, care_temp_high_c: 31, care_humidity_low_pct: 60, care_humidity_high_pct: 80, feed_interval_days: 10, care_feeder_type: "RAT" }
              as: StoreManager
              captures: { sp_id: $.data.id }
            - call: "POST /animals"
              payload: { species_id: "${sp_id}", morph: "Biak", acquisition_cost_cents: 8000, list_price_cents: 20000 }
              as: StoreManager
              as_user_id: "mgr-intake"
              captures: { an_id: $.data.id }
            - call: "POST /animals/${an_id}/start-quarantine"
              payload: {}
              as: VetTech
              captures: { qr_id: $.data.id }
            - call: "POST /quarantine-records/${qr_id}/health-checks"
              payload: { result: "PASS" }
              as: VetTech
            - call: "POST /quarantine-records/${qr_id}/health-checks"
              payload: { result: "PASS" }
              as: VetTech
            - call: "POST /quarantine-records/${qr_id}/clear"
              payload: {}
              as: VetTech
            - call: "POST /customers"
              payload: { full_name: "Cy Okonkwo", email: "cy@x.com", loyalty_tier: "SILVER" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/permits"
              payload: { permit_number: "GTP-777", permit_class: "CLASS_III", issued_date: "2026-06-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/verify"
              payload: {}
              as: StoreManager
            - call: "POST /sales"
              payload: { animal_id: "${an_id}", customer_id: "${cust_id}", permit_id: "${permit_id}", sold_at_expo: true }
              as: SalesAssociate
              captures: { sale_id: $.data.id }
          trigger:
            - call: "POST /sales/${sale_id}/confirm"
              payload: {}
              as: SalesAssociate
              captures: { final: $.data.sale_price_cents }
          assert:
            - "Sale.${sale_id}.sale_price_cents == 20010"
            - "Sale.${sale_id}.status == CONFIRMED"

      - name: shipment_cost_round_per_line_mode_b
        grounds:
          - calculations.shipment_cost
          - entities.Shipment.fields.shipment_cost_cents
          - entities.FeederBatch.fields.quantity_on_hand
        distinguishing_aspect: "Mode (b): the size multiplier is rounded on the per-batch unit price BEFORE multiplying by quantity and summing (round-per-line=1512), which differs from sum-then-round (1500)."
        test_recipe:
          setup:
            - "Two AVAILABLE CRICKET/MEDIUM batches unit_price 50: batch1 qty 10 expiry 2026-07-10, batch2 qty 30 expiry 2026-07-20."
            - "Customer with an ACTIVE CRICKET/MEDIUM subscription, quantity_per_shipment 24."
          setup_api_calls:
            - call: "POST /feeder-batches"
              payload: { feeder_type: "CRICKET", size: "MEDIUM", quantity_on_hand: 10, unit_price_cents: 50, received_date: "2026-06-15T00:00:00Z", expiry_date: "2026-07-10T00:00:00Z" }
              as: StoreManager
              captures: { b1: $.data.id }
            - call: "POST /feeder-batches"
              payload: { feeder_type: "CRICKET", size: "MEDIUM", quantity_on_hand: 30, unit_price_cents: 50, received_date: "2026-06-15T00:00:00Z", expiry_date: "2026-07-20T00:00:00Z" }
              as: StoreManager
              captures: { b2: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Di Vale", email: "di@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /feeder-subscriptions"
              payload: { customer_id: "${cust_id}", feeder_type: "CRICKET", size: "MEDIUM", quantity_per_shipment: 24, cadence_days: 14 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /feeder-subscriptions/${sub_id}/shipments"
              payload: {}
              as: SalesAssociate
              captures: { ship_id: $.data.id, cost: $.data.shipment_cost_cents }
          assert:
            - "Shipment.${ship_id}.shipment_cost_cents == 1512"
            - "FeederBatch.${b1}.quantity_on_hand == 0"
            - "FeederBatch.${b1}.status == DEPLETED"
            - "FeederBatch.${b2}.quantity_on_hand == 16"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: warranty_claim_branching_refund_branch
        grounds:
          - state_machines.WarrantyClaim.APPROVED_to_RESOLVED
          - state_machines.Sale.FULFILLED_to_REFUNDED
          - entities.Customer.fields.wallet_credit_cents
        distinguishing_aspect: "WarrantyClaim is branching: SUBMITTED->{APPROVED,DENIED} then APPROVED->RESOLVED, and the REFUND branch drives Sale->REFUNDED whereas the CREDIT/REPLACEMENT branches drive Sale->CLOSED — divergent side-effect sets on the same entity."
        test_recipe:
          setup:
            - "FULFILLED Sale with sale_price_cents 18000 (DOA claimable)."
            - "DOA WarrantyClaim APPROVED (refund_cents=18000)."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Ball Python", scientific_name: "Python regius", is_regulated: false, permit_class: "NONE", min_quarantine_days: 0, warranty_days: 30, care_temp_low_c: 27, care_temp_high_c: 31, care_humidity_low_pct: 50, care_humidity_high_pct: 60, feed_interval_days: 7, care_feeder_type: "MOUSE_ADULT" }
              as: StoreManager
              captures: { sp_id: $.data.id }
            - call: "POST /animals"
              payload: { species_id: "${sp_id}", morph: "Pastel", acquisition_cost_cents: 4000, list_price_cents: 18000 }
              as: StoreManager
              as_user_id: "mgr-intake"
              captures: { an_id: $.data.id }
            - call: "POST /animals/${an_id}/start-quarantine"
              payload: {}
              as: VetTech
              captures: { qr_id: $.data.id }
            - call: "POST /quarantine-records/${qr_id}/health-checks"
              payload: { result: "PASS" }
              as: VetTech
            - call: "POST /quarantine-records/${qr_id}/health-checks"
              payload: { result: "PASS" }
              as: VetTech
            - call: "POST /quarantine-records/${qr_id}/clear"
              payload: {}
              as: VetTech
            - call: "POST /customers"
              payload: { full_name: "El Marsh", email: "el@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /sales"
              payload: { animal_id: "${an_id}", customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/confirm"
              payload: {}
              as: SalesAssociate
            - call: "POST /sales/${sale_id}/fulfill"
              payload: {}
              as: SalesAssociate
            - call: "POST /sales/${sale_id}/warranty-claims"
              payload: { claim_type: "DOA", reason: "arrived dead" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { wc_id: $.data.id }
            - call: "POST /warranty-claims/${wc_id}/approve"
              payload: {}
              as: StoreManager
              as_user_id: "mgr-approve"
          trigger:
            - call: "POST /warranty-claims/${wc_id}/resolve"
              payload: { resolution: "REFUND" }
              as: StoreManager
              as_user_id: "mgr-approve"
          assert:
            - "WarrantyClaim.${wc_id}.status == RESOLVED"
            - "Sale.${sale_id}.status == REFUNDED"
            - "Customer.${cust_id}.wallet_credit_cents == 18000"

      - name: habitat_build_change_request_cycle
        grounds:
          - state_machines.HabitatBuild.IN_PROGRESS_to_CHANGE_REQUESTED
          - state_machines.HabitatBuild.CHANGE_REQUESTED_to_IN_PROGRESS
          - entities.HabitatBuild.fields.change_orders_total_cents
        distinguishing_aspect: "HabitatBuild is cyclic: it loops IN_PROGRESS -> CHANGE_REQUESTED -> IN_PROGRESS across two change rounds, accumulating change_orders_total_cents to 10000 — a cycle on a different entity than WarrantyClaim."
        test_recipe:
          setup:
            - "HabitatBuild quote 100000 taken to IN_PROGRESS (deposit paid, started)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Fi Osei", email: "fi@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /habitat-builds"
              payload: { customer_id: "${cust_id}", spec_summary: "6x2x2 arboreal", quote_cents: 100000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { hb_id: $.data.id }
            - call: "POST /habitat-builds/${hb_id}/pay-deposit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /habitat-builds/${hb_id}/start"
              payload: {}
              as: SalesAssociate
              captures: { v_start: $.data.version }
            - call: "POST /habitat-builds/${hb_id}/change-orders"
              payload: { delta_cents: 5000, expected_habitat_build_version: "${v_start}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /habitat-builds/${hb_id}/approve-change"
              payload: {}
              as: SalesAssociate
              captures: { v_after_approve: $.data.version }
          trigger:
            - call: "POST /habitat-builds/${hb_id}/change-orders"
              payload: { delta_cents: 5000, expected_habitat_build_version: "${v_after_approve}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { total: $.data.change_orders_total_cents }
          assert:
            - "HabitatBuild.${hb_id}.status == CHANGE_REQUESTED"
            - "HabitatBuild.${hb_id}.change_orders_total_cents == 10000"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: recall_cascade_batch_to_shipment_to_subscription_depth3
        grounds:
          - state_machines.Recall.OPEN_to_CLOSED
          - state_machines.FeederBatch.AVAILABLE_to_RECALLED
          - state_machines.Shipment.SHIPPED_to_REVERSED
          - state_machines.FeederSubscription.ACTIVE_to_HELD
        distinguishing_aspect: "Depth-3 chain from POST /recalls: Recall marks FeederBatch RECALLED, which reverses the SHIPPED Shipment allocating it, which in turn puts its FeederSubscription on HELD and credits the Customer 630 — each hop caused by the previous."
        test_recipe:
          setup:
            - "AVAILABLE CRICKET/MEDIUM batch qty 30 unit_price 50, expiry 2026-08-01."
            - "Customer with ACTIVE CRICKET/MEDIUM subscription qty 10, one SHIPPED shipment (cost 630) allocated from that batch."
          setup_api_calls:
            - call: "POST /feeder-batches"
              payload: { feeder_type: "CRICKET", size: "MEDIUM", quantity_on_hand: 30, unit_price_cents: 50, received_date: "2026-06-15T00:00:00Z", expiry_date: "2026-08-01T00:00:00Z" }
              as: StoreManager
              captures: { b1: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Gu Petro", email: "gu@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /feeder-subscriptions"
              payload: { customer_id: "${cust_id}", feeder_type: "CRICKET", size: "MEDIUM", quantity_per_shipment: 10, cadence_days: 14 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /feeder-subscriptions/${sub_id}/shipments"
              payload: {}
              as: SalesAssociate
              captures: { ship_id: $.data.id }
          trigger:
            - call: "POST /recalls"
              payload: { reason: "salmonella lot", target_feeder_type: "CRICKET", affected_batch_ids: ["${b1}"] }
              as: StoreManager
              as_user_id: "mgr-recall"
              captures: { rc_id: $.data.id }
          assert:
            - "FeederBatch.${b1}.status == RECALLED"
            - "Shipment.${ship_id}.status == REVERSED"
            - "Shipment.${ship_id}.reversed_reason == RECALL"
            - "FeederSubscription.${sub_id}.status == HELD"
            - "Customer.${cust_id}.wallet_credit_cents == 630"

      - name: warranty_refund_cascade_sale_to_customer_depth2
        grounds:
          - state_machines.WarrantyClaim.APPROVED_to_RESOLVED
          - state_machines.Sale.FULFILLED_to_REFUNDED
          - entities.Customer.fields.wallet_credit_cents
        distinguishing_aspect: "Depth-2 chain from POST /warranty-claims/{id}/resolve: resolving REFUND drives Sale FULFILLED->REFUNDED, which in turn credits the Customer wallet by refund_cents 18000 — a different trigger than the recall cascade."
        test_recipe:
          setup:
            - "FULFILLED Sale sale_price 18000; DOA WarrantyClaim APPROVED with refund_cents 18000; Customer wallet starts at 0."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Hognose", scientific_name: "Heterodon nasicus", is_regulated: false, permit_class: "NONE", min_quarantine_days: 0, warranty_days: 30, care_temp_low_c: 24, care_temp_high_c: 30, care_humidity_low_pct: 30, care_humidity_high_pct: 50, feed_interval_days: 5, care_feeder_type: "MOUSE_PINKY" }
              as: StoreManager
              captures: { sp_id: $.data.id }
            - call: "POST /animals"
              payload: { species_id: "${sp_id}", morph: "Anaconda", acquisition_cost_cents: 3000, list_price_cents: 18000 }
              as: StoreManager
              as_user_id: "mgr-intake"
              captures: { an_id: $.data.id }
            - call: "POST /animals/${an_id}/start-quarantine"
              payload: {}
              as: VetTech
              captures: { qr_id: $.data.id }
            - call: "POST /quarantine-records/${qr_id}/health-checks"
              payload: { result: "PASS" }
              as: VetTech
            - call: "POST /quarantine-records/${qr_id}/health-checks"
              payload: { result: "PASS" }
              as: VetTech
            - call: "POST /quarantine-records/${qr_id}/clear"
              payload: {}
              as: VetTech
            - call: "POST /customers"
              payload: { full_name: "Ho Quist", email: "ho@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /sales"
              payload: { animal_id: "${an_id}", customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/confirm"
              payload: {}
              as: SalesAssociate
            - call: "POST /sales/${sale_id}/fulfill"
              payload: {}
              as: SalesAssociate
            - call: "POST /sales/${sale_id}/warranty-claims"
              payload: { claim_type: "DOA", reason: "arrived dead" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { wc_id: $.data.id }
            - call: "POST /warranty-claims/${wc_id}/approve"
              payload: {}
              as: StoreManager
              as_user_id: "mgr-approve"
          trigger:
            - call: "POST /warranty-claims/${wc_id}/resolve"
              payload: { resolution: "REFUND" }
              as: StoreManager
              as_user_id: "mgr-approve"
          assert:
            - "Sale.${sale_id}.status == REFUNDED"
            - "Customer.${cust_id}.wallet_credit_cents == 18000"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_state_beats_permit_referential
        grounds:
          - validations[priority=42]
          - validations[priority=55]
          - errors[ERR_ANIMAL_NOT_AVAILABLE]
        distinguishing_aspect: "On regulated Sale confirm with BOTH animal-not-AVAILABLE and missing permit, the state check (priority 42, ERR_ANIMAL_NOT_AVAILABLE) wins over the business_referential permit check (priority 55) — a state vs business_referential pair."
        test_recipe:
          setup:
            - "Regulated Species CLASS_I; Animal left in QUARANTINE (never cleared, so not AVAILABLE)."
            - "Customer with NO permit; Sale drafted without permit_id."
