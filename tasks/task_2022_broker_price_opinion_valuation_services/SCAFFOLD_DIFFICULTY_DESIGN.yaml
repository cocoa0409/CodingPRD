            - call: "POST /bpo/valuation-orders/${ord_x1}/qc/${qc_x1}/verdict"
              payload: { verdict: "APPROVE", defects_found: 0, notes: "ok" }
              as: QCReviewer
            # advance clock past SLA to force 1 day late
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bpo/valuation-orders/${ord_x1}/complete"
              payload: {}
