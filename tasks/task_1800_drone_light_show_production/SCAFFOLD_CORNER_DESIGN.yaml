            - { call: "GET /api/drones", payload: { limit: 0 }, as: FleetManager, captures: { e1: $.data.error_id } }
            - { call: "GET /api/drones", payload: { limit: 101 }, as: FleetManager, captures: { e2: $.data.error_id } }
          assert:
            - "default page: response_type == array, data length 10, total_count 12, has_more true, limit 10, offset 0"
            - "limit=2 offset=10: data length 2, total_count 12, has_more false"
            - "${e1} == ERR_VALIDATION and ${e2} == ERR_VALIDATION (limit outside [1, 100])"

