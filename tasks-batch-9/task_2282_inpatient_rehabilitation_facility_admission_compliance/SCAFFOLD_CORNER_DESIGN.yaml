          - complexity_profile.complexity_layers[version_pinning_on_approval]
          - entities.Admission.fields.qrp_penalty_pct_snapshot
        excluded_because:
          difficulty_instance: combinatorial_formula / qrp_penalty_snapshot_ordering_versus_stay_payment
          rationale: "Pinning qrp_penalty_pct_snapshot at admit time and paying from the pin rather than the live facility value is asserted by the named §1.8 instance."

  # =========================================================================
  - section: consistency model
    instances:
      - name: discharge_response_carries_pricing_and_compliance_class_immediately
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.stay_payment_cents
          - calculations.admission_compliance_class
        distinguishing_aspect: "The discharge call's own response already carries stay_status DISCHARGED, payment_status PRICED, effective_los_days 3 and total_payment_cents 908950; no second read is needed for the derived values, and the facility ledger is equally current."
        test_recipe:
          setup:
            - "Admission A (impairment_group_code 0008 -> TIER_B base 2450000, comorbidity_tier TIER_2 -> uplift 0.06, so uplifted_base_cents 2597000) admitted 2026-08-04T12:00:00Z with no plan of care, no therapy weeks and no conferences."
            - "The clock is at 2026-08-06T12:00:00Z, so the discharge yields effective_los_days 3 and the 0.35 short-stay factor: round_half_up(2597000 x 0.35) = 908950."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /facilities"
              payload: { name: "Northside IRF", cms_ccn: "200081", review_period_start: "2026-08-01", review_period_end: "2026-08-31" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { fac_id: $.data.id }
            - call: "POST /clinicians"
              payload: { facility_id: "${fac_id}", full_name: "Nina Nurse", credential: "NURSE", npi: "1000000001" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { nurse_id: $.data.id }
            - call: "POST /clinicians"
              payload: { facility_id: "${fac_id}", full_name: "Paul Physician", credential: "REHAB_PHYSICIAN", npi: "1000000002" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { phys_id: $.data.id }
            - call: "POST /patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN-A", full_name: "Ann Patient", birth_date: "1958-04-11", impairment_group_code: "0008", etiologic_diagnosis_code: "I63.9", comorbidity_tier: "TIER_2" }
              as: NurseCaseManager
              as_user_id: "${nurse_id}"
              captures: { pat_a_id: $.data.id }
            - call: "POST /screenings"
              payload: { patient_id: "${pat_a_id}", conducted_by_clinician_id: "${nurse_id}", expected_admission_at: "2026-08-04T12:00:00Z", intensive_therapy_documented: true, expected_functional_improvement_documented: true, prior_functional_level_documented: true, medical_supervision_documented: true }
              as: NurseCaseManager
              as_user_id: "${nurse_id}"
              captures: { scr_a_id: $.data.id }
            - call: "POST /screenings/${scr_a_id}/submit"
              payload: {}
              as: NurseCaseManager
              as_user_id: "${nurse_id}"
            - call: "POST /screenings/${scr_a_id}/review"
              payload: { decision: "CONCUR" }
              as: RehabPhysician
              as_user_id: "${phys_id}"
            - call: "POST /admissions"
              payload: { patient_id: "${pat_a_id}", screening_id: "${scr_a_id}" }
              as: NurseCaseManager
              as_user_id: "${nurse_id}"
              captures: { adm_a_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T12:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /admissions/${adm_a_id}/admit"
              payload: { admitted_at: "2026-08-04T12:00:00Z" }
              as: NurseCaseManager
              as_user_id: "${nurse_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T12:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /admissions/${adm_a_id}/discharge"
              payload: { discharged_at: "2026-08-06T12:00:00Z", discharge_destination: "COMMUNITY", discharge_planned: true }
              as: NurseCaseManager
              as_user_id: "${nurse_id}"
          assert:
            - "HTTP status of the trigger response == 200"
            - "stay_status in the trigger response == DISCHARGED"
            - "payment_status in the trigger response == PRICED"
            - "effective_los_days in the trigger response == 3"
            - "total_payment_cents in the trigger response == 908950"
            - "compliance_class in the trigger response == NON_QUALIFYING"
            - "therapy_weeks_satisfied in the trigger response == false"
            - "GET /facilities/${fac_id} immediately after the trigger returns settled_payment_cents == 908950 and cohort_total_count == 1"
