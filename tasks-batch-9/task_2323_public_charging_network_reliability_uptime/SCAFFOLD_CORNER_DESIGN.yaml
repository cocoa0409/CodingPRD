            - "after both rejections ReimbursementClaim.${cl_id}.state is still REVIEW, decided_by_user_id is still null, withheld_amount_cents and approved_amount_cents are still null"
            - "call 3: HTTP 200, state == APPROVED, withheld_amount_cents == 0, approved_amount_cents == 2500, decided_by_user_id == \"pa-1\""
            - "the mirror case — a sub-97 report where APPROVE yields ERR_UPTIME_BELOW_APPROVAL_THRESHOLD instead — is covered by §1.8 claim_withhold_mode_b_rounds_each_line_item_before_summing and by remediation_credit_lifts_effective_uptime_across_the_ninety_seven_tier"

      - name: refund_approval_guard_is_inclusive_at_the_full_session_charge
        claim_type: error_triggerability
        grounds:
          - errors[ERR_REFUND_EXCEEDS_SESSION_CHARGE]
          - validations[priority 28]
          - state_machines.CustomerComplaint.transitions.REQUESTED_to_APPROVED
        distinguishing_aspect: "FULL_SESSION_GOODWILL sets refund_amount_cents exactly equal to session_charged_cents, which lands the approval guard precisely on its boundary: the comparison is `<=`, so the approval must succeed. An implementation that writes `<` turns every legitimate goodwill refund into ERR_REFUND_EXCEEDS_SESSION_CHARGE, and one that drops the re-check altogether would let a tampered amount settle — so the same 4200-cent case pins both the boundary and the money conservation through settlement."
        test_recipe:
          setup:
            - "Logical clock walked 2026-05-01 -> 2026-06-10T11:00:00Z -> 2026-06-10T12:00:00Z."
            - "HostSite / Station ST-1 (DRAFT is fine — complaint intake has no station-state precondition) / port DS-1 created 2026-05-01."
            - "A CRITICAL outage detected 2026-06-10T11:00:00Z and still open, so its window overlaps the 10:00 -> 12:00 session."
            - "Complaint: energy 20.500 kWh at 45 cents, idle fee 200, charged 4200 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 400.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-1", power_class: "DCFC_150", declared_port_count: 1 }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-1", terminal_model: "PT-9" }
              as: NetworkOperator
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-10T11:00:00Z" }
              as: NetworkOperator
            - call: "POST /outage-events"
              payload: { port_id: "${p_id}", fault_code: "EVSE-CRIT-01", fault_class: "CRITICAL", detected_at: "2026-06-10T11:00:00Z" }
              as: NetworkOperator
              captures: { o_id: $.data.id }
            - call: "POST /outage-events/${o_id}/classify"
              payload: { fault_class: "CRITICAL" }
              as: NetworkOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-10T12:00:00Z" }
              as: NetworkOperator
            - call: "POST /customer-complaints"
              payload: { station_id: "${st_id}", port_id: "${p_id}", complaint_type: "SESSION_FAILED", session_started_at: "2026-06-10T10:00:00Z", session_ended_at: "2026-06-10T12:00:00Z", session_energy_kwh: 20.500, session_price_per_kwh_cents: 45, session_charged_cents: 4200, session_idle_fee_cents: 200 }
              as: CustomerSupportAgent
              as_user_id: "csa-1"
              captures: { cc_id: $.data.id }
            - call: "POST /customer-complaints/${cc_id}/triage"
              payload: { disposition: "LINK_OUTAGE", linked_outage_event_id: "${o_id}" }
              as: CustomerSupportAgent
              as_user_id: "csa-1"
          trigger:
            - call: "POST /customer-complaints/${cc_id}/refund-requests"
              payload: { refund_basis: "FULL_SESSION_GOODWILL" }
              as: CustomerSupportAgent
              as_user_id: "csa-1"
            - call: "POST /customer-complaints/${cc_id}/refund-decisions"
              payload: { decision: "APPROVE" }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
            - call: "POST /customer-complaints/${cc_id}/refund-ledger-actions"
              payload: { action: "SETTLE" }
              as: CustomerSupportAgent
              as_user_id: "csa-1"
          assert:
            - "call 1: HTTP 200, refund_state == REQUESTED, refund_basis == FULL_SESSION_GOODWILL, refund_amount_cents == 4200 (the whole charge, idle fee included), retained_amount_cents == 0, refund_requested_by_user_id == \"csa-1\""
            - "call 2: HTTP 200 and refund_state == APPROVED — refund_amount_cents == session_charged_cents satisfies the inclusive guard; a strict `<` implementation wrongly returns 422 ERR_REFUND_EXCEEDS_SESSION_CHARGE here"
            - "call 3: HTTP 200, refund_state == SETTLED, refund_settled_at == \"2026-06-10T12:00:00Z\", Station.${st_id}.refund_liability_cents == 4200"
            - "the ENERGY_PRORATED counterpart on the identical row is bounded well below the guard: energy_component_cents == round_half_up(20.500 x 45) == 923 and refund_amount_cents == 4200 - 923 - 200 == 3077"
            - "refund_amount_cents + retained_amount_cents == 4200 at every step of the chain"

  # ===========================================================================
  # SECTION 7 — RBAC (§1.7), role_model: segregation_of_duties over peer roles
  # ===========================================================================
  - section: rbac
    instances:

      - name: a_role_cannot_invoke_another_roles_exclusive_operation
        claim_type: exclusive_operation_enforcement
        grounds:
          - roles.NetworkOperator.exclusive_operations
          - roles.ComplianceAuditor.exclusive_operations
          - roles.CustomerSupportAgent.exclusive_operations
          - errors[ERR_UNAUTHORIZED]
          - validations[priority 2]
        distinguishing_aspect: "The six roles are peers, not a hierarchy: NetworkOperator is the busiest role but still cannot certify a terminal, finalize a report, drive a dispatch or file a complaint. Authorization also sits at priority 2, above existence, so a forbidden call against a non-existent id must return 403 rather than 404 — that ordering is what stops the API leaking which ids exist."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "HostSite HS-1, Station ST-1 (DRAFT), port DS-1 (terminal_certification_status PENDING), one CLASSIFIED MAJOR outage and one CREATED dispatch assigned to \"tech-1\"."
          setup_api_calls:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 400.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-1", power_class: "DCFC_150", declared_port_count: 1 }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-1", terminal_model: "PT-9" }
              as: NetworkOperator
              captures: { p_id: $.data.id }
            - call: "POST /outage-events"
              payload: { port_id: "${p_id}", fault_code: "EVSE-MAJ-11", fault_class: "MAJOR", detected_at: "2026-08-01T00:00:00Z" }
              as: NetworkOperator
              captures: { o_id: $.data.id }
            - call: "POST /outage-events/${o_id}/classify"
              payload: { fault_class: "MAJOR" }
              as: NetworkOperator
            - call: "POST /maintenance-dispatches"
              payload: { outage_event_id: "${o_id}", port_id: "${p_id}", technician_user_id: "tech-1", technician_certification_class: "DCFC_BASIC", window_start_at: "2026-08-01T01:00:00Z", window_end_at: "2026-08-01T09:00:00Z" }
              as: NetworkOperator
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /host-sites"
              payload: { site_code: "HS-2", host_org_name: "Birch Plaza", committed_service_capacity_kw: 250.00 }
              as: ComplianceAuditor
              captures: { e1: $.data.error_id }
            - call: "POST /charging-ports/${p_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: NetworkOperator
              captures: { e2: $.data.error_id }
            - call: "POST /uptime-reports"
              payload: { station_id: "${st_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: CustomerSupportAgent
              captures: { e3: $.data.error_id }
            - call: "POST /maintenance-dispatches/${d_id}/progress"
              payload: { event: "EN_ROUTE" }
              as: NetworkOperator
              captures: { e4: $.data.error_id }
            - call: "POST /customer-complaints"
              payload: { station_id: "${st_id}", port_id: "${p_id}", complaint_type: "CHARGER_OFFLINE", session_started_at: "2026-07-31T10:00:00Z", session_ended_at: "2026-07-31T11:00:00Z", session_energy_kwh: 5.000, session_price_per_kwh_cents: 40, session_charged_cents: 250 }
              as: NetworkOperator
              captures: { e5: $.data.error_id }
            - call: "POST /reimbursement-claims/cl-nope/decision"
              payload: { decision: "APPROVE" }
              as: ComplianceAuditor
              captures: { e6: $.data.error_id }
            - call: "POST /outage-events/${o_id}/classify"
              payload: { fault_class: "CRITICAL" }
              as: HostSiteManager
              as_user_id: "${site_id}"
              captures: { e7: $.data.error_id }
            - call: "GET /maintenance-dispatches"
              payload: { state: "CREATED" }
              as: HostSiteManager
              as_user_id: "${site_id}"
          assert:
            - "calls 1 through 5 and call 7 each return HTTP 403 with data.error_id == \"ERR_UNAUTHORIZED\""
            - "call 6: HTTP 403 ERR_UNAUTHORIZED even though claim id \"cl-nope\" does not exist — priority 2 outranks the priority 3 ERR_CLAIM_NOT_FOUND"
            - "no state moved: GET /host-sites total_count == 1, ChargingPort.${p_id}.terminal_certification_status == PENDING, OutageEvent.${o_id}.fault_class == MAJOR and state == CLASSIFIED, MaintenanceDispatch.${d_id}.state == CREATED, GET /customer-complaints total_count == 0"
            - "no version moved either: Station.${st_id}, ChargingPort.${p_id} and OutageEvent.${o_id} all carry the versions they had before the trigger"
            - "call 8: HTTP 200 with 1 row — every GET is a shared operation, so even the read-only HostSiteManager may list dispatches network-wide"

      - name: host_site_manager_cannot_amend_a_site_other_than_its_own
        claim_type: peer_role_isolation
        grounds:
          - roles.HostSiteManager.identity
          - errors[ERR_HOST_SITE_FORBIDDEN]
          - validations[priority 4]
        distinguishing_aspect: "HostSiteManager is the one entity_backed role: X-User-ID is a HostSite id, so authorization is a row-level comparison rather than a role check. The same PATCH endpoint is shared with NetworkOperator, whose identity is opaque and who may therefore amend any site — and because the row-level check sits at priority 4, a manager pointing at a missing id still gets a 404, not a 403."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Two host sites: HS-1 (the acting manager's own row) and HS-2 (a different host's row)."
          setup_api_calls:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 400.00 }
              as: NetworkOperator
              captures: { site1_id: $.data.id }
            - call: "POST /host-sites"
              payload: { site_code: "HS-2", host_org_name: "Birch Plaza", committed_service_capacity_kw: 250.00 }
              as: NetworkOperator
              captures: { site2_id: $.data.id }
          trigger:
            - call: "PATCH /host-sites/${site2_id}"
              payload: { agreement_status: "EXECUTED" }
              as: HostSiteManager
              as_user_id: "${site1_id}"
              captures: { e1: $.data.error_id }
            - call: "PATCH /host-sites/hs-nope"
              payload: { agreement_status: "EXECUTED" }
              as: HostSiteManager
              as_user_id: "${site1_id}"
              captures: { e2: $.data.error_id }
            - call: "PATCH /host-sites/${site1_id}"
              payload: { agreement_status: "EXECUTED", power_upgrade_status: "IN_PROGRESS", access_hours_mode: "RESTRICTED", access_open_minute: 360, access_close_minute: 1320, parking_enforcement_mode: "SIGNAGE_ONLY" }
              as: HostSiteManager
              as_user_id: "${site1_id}"
            - call: "PATCH /host-sites/${site2_id}"
              payload: { power_upgrade_status: "ENERGIZED" }
              as: NetworkOperator
              as_user_id: "op-1"
            - call: "GET /host-sites"
              payload: { agreement_status: "EXECUTED", limit: 10, offset: 0 }
              as: HostSiteManager
              as_user_id: "${site1_id}"
          assert:
            - "call 1: HTTP 403 ERR_HOST_SITE_FORBIDDEN — HS-2 is untouched (agreement_status still DRAFT, version still 1)"
            - "call 2: HTTP 404 ERR_HOST_SITE_NOT_FOUND, not 403 — existence (priority 3) is checked before the row-level ownership rule (priority 4)"
            - "call 3: HTTP 200 — HostSite.${site1_id} now shows agreement_status EXECUTED, power_upgrade_status IN_PROGRESS, access_hours_mode RESTRICTED, access_open_minute 360, access_close_minute 1320, parking_enforcement_mode SIGNAGE_ONLY, version 2"
            - "call 4: HTTP 200 — the opaque-identity NetworkOperator may amend a site it does not \"own\"; HostSite.${site2_id}.power_upgrade_status == ENERGIZED, version 2"
            - "the manager's own PATCH never widened its reach: HostSite.${site2_id}.agreement_status is still DRAFT after all four calls"
            - "call 5: exactly one row (${site1_id}), total_count == 1, has_more == false — HS-2 is still DRAFT, and a manager may read the whole network even though it may amend only its own row"

      - name: technician_cannot_act_on_a_dispatch_assigned_to_someone_else
        claim_type: peer_role_isolation
        grounds:
          - errors[ERR_NOT_ASSIGNED_TECHNICIAN]
          - validations[priority 12]
          - state_machines.MaintenanceDispatch.transitions.CREATED_to_EN_ROUTE
        distinguishing_aspect: "FieldTechnician holds the progress / parts-hold / complete / CONSUME surface as a role, but each call is additionally pinned to MaintenanceDispatch.technician_user_id. The interesting ordering is that the state check (priority 8) runs *before* the assignment check (priority 12): the unassigned technician sending an out-of-order event sees ERR_INVALID_STATE, while the same technician sending a legal event sees ERR_NOT_ASSIGNED_TECHNICIAN."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "HostSite / Station ST-1 OPERATIONAL / one CERTIFIED port DS-1."
            - "A CLASSIFIED MAJOR outage with a CREATED dispatch assigned to \"tech-1\"; \"tech-2\" is a second technician with no assignment."
          setup_api_calls:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 400.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-1", power_class: "DCFC_150", declared_port_count: 1 }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-1", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { p_id: $.data.id }
            - call: "POST /charging-ports/${p_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "COMMISSIONING" }
              as: NetworkOperator
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
            - call: "POST /outage-events"
              payload: { port_id: "${p_id}", fault_code: "EVSE-MAJ-11", fault_class: "MAJOR", detected_at: "2026-08-01T00:00:00Z" }
              as: NetworkOperator
              captures: { o_id: $.data.id }
            - call: "POST /outage-events/${o_id}/classify"
              payload: { fault_class: "MAJOR" }
              as: NetworkOperator
            - call: "POST /maintenance-dispatches"
              payload: { outage_event_id: "${o_id}", port_id: "${p_id}", technician_user_id: "tech-1", technician_certification_class: "DCFC_BASIC", window_start_at: "2026-08-01T01:00:00Z", window_end_at: "2026-08-01T09:00:00Z" }
              as: NetworkOperator
              as_user_id: "op-1"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /maintenance-dispatches/${d_id}/progress"
              payload: { event: "EN_ROUTE" }
              as: FieldTechnician
              as_user_id: "tech-2"
              captures: { e1: $.data.error_id }
            - call: "POST /maintenance-dispatches/${d_id}/progress"
              payload: { event: "ARRIVE" }
              as: FieldTechnician
              as_user_id: "tech-2"
              captures: { e2: $.data.error_id }
            - call: "POST /maintenance-dispatches/${d_id}/complete"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-2"
              captures: { e3: $.data.error_id }
            - call: "POST /maintenance-dispatches/${d_id}/progress"
              payload: { event: "EN_ROUTE" }
              as: FieldTechnician
              as_user_id: "tech-1"
          assert:
            - "call 1: HTTP 403 ERR_NOT_ASSIGNED_TECHNICIAN — a legal transition blocked purely by identity"
            - "call 2: HTTP 409 ERR_INVALID_STATE — ARRIVE from CREATED is impossible for anyone, and the state rule at priority 8 outranks the assignment rule at priority 12"
            - "call 3: HTTP 409 ERR_INVALID_STATE for the same reason (complete requires ON_SITE)"
            - "after the three rejections MaintenanceDispatch.${d_id}.state is still CREATED, arrived_at is null, response_met is null and version is unchanged"
            - "call 4: HTTP 200, state == EN_ROUTE — the assigned technician's identical request succeeds"
            - "ChargingPort.${p_id}.maintenance_state is DISPATCH_PENDING throughout; the rejected calls did not advance the port's repair posture"

      - name: shared_operations_are_split_by_leg_between_their_two_holders
        claim_type: peer_roles
        grounds:
          - roles.CustomerSupportAgent.shared_operations
