  # ===========================================================================
  # Section: errors (Table 6 claims — triggerability audit)
  # Errors whose trigger paths are exercised by §1.8 instances are stubbed here;
  # all remaining catalog errors are triggered by instances in the entities /
  # state_machines / validations sections above, except ERR_NO_CHECKIN (no
  # reachable trigger under the declared surface — see header note).
  # ===========================================================================
  - section: errors
    instances:
      - name: error_reciprocity_not_met
        claim_type: error_triggerability
        grounds: ["errors[ERR_RECIPROCITY_NOT_MET]"]
        excluded_because:
          difficulty_instance: finalize_blocked_until_reciprocal_accepted
          rationale: "Triggered and asserted (409 ERR_RECIPROCITY_NOT_MET) in the named §1.8 cross-entity instance."

      - name: error_sitter_overlap
        claim_type: error_triggerability
        grounds: ["errors[ERR_SITTER_OVERLAP]"]
        excluded_because:
          difficulty_instance: sitter_overlap_half_open_adjacency
          rationale: "Triggered by the one-minute-overlap accept in the named §1.8 interval-semantics instance."

      - name: error_access_not_handed_off
        claim_type: error_triggerability
        grounds: ["errors[ERR_ACCESS_NOT_HANDED_OFF]"]
        excluded_because:
          difficulty_instance: checkin_blocked_until_handoff
          rationale: "Triggered by the pre-handoff CHECK_IN in the named §1.8 cross-entity instance."

      - name: error_entry_out_of_window
        claim_type: error_triggerability
        grounds: ["errors[ERR_ENTRY_OUT_OF_WINDOW]"]
        excluded_because:
          difficulty_instance: entry_window_closed_buffered_containment
          rationale: "Triggered at both closed bounds (09:29:59 and 18:00:01) in the named §1.8 interval-semantics instance."

      - name: error_insufficient_credit
        claim_type: error_triggerability
        grounds: ["errors[ERR_INSUFFICIENT_CREDIT]"]
        excluded_because:
          difficulty_instance: overdraft_margin_exactly_max_vs_beyond
          rationale: "Triggered by the -5.50 margin posting in the named §1.8 boundary instance (and again under priority conflict in posting_fiscal_beats_constraint_duration)."

      - name: error_unresolved_incident
        claim_type: error_triggerability
        grounds: ["errors[ERR_UNRESOLVED_INCIDENT]"]
        excluded_because:
          difficulty_instance: settle_blocked_by_open_incident
          rationale: "Triggered by the blocked settle in the named §1.8 cross-entity instance."

      - name: error_removal_criteria_not_met
        claim_type: error_triggerability
        grounds: ["errors[ERR_REMOVAL_CRITERIA_NOT_MET]"]
        excluded_because:
          difficulty_instance: removal_incident_count_365d_inclusive
          rationale: "Triggered by the count-1 removal attempt in the named §1.8 boundary instance (plain-violation path also covered by removal_without_eligibility_returns_criteria_not_met in the validations section)."

      - name: error_invalid_state
        claim_type: error_triggerability
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: accept_state_beats_sitter_overlap
          rationale: "Triggered as the winning error in the named §1.8 priority-conflict instance; eight additional invalid-from rejections are covered in the state_machines section."

      - name: error_stale_version
        claim_type: error_triggerability
        grounds: ["errors[ERR_STALE_VERSION]"]
        excluded_because:
          difficulty_instance: accept_state_beats_sitter_overlap
          rationale: "The OCC path's version-matching half is exercised there; the deliberate stale-version 412 rejection is exercised by occ_stale_version_returns_412 in the cross_cutting_complexity_layers section of this file (grounded on concurrency_rules[claim-accept-stale-request])."

  # ===========================================================================
  # Section: rbac (Table 7 claims)
  # ===========================================================================
  - section: rbac
    instances:
      - name: anonymous_can_apply
        claim_type: role_permission_grant
        grounds: [roles.Anonymous, "endpoints[POST /coop/members]"]
        distinguishing_aspect: "Anonymous's single exclusive operation works: POST /coop/members returns 201 with no entity-backed identity required."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /coop/members"
              payload: { display_name: "New Applicant", email: "new@coop.test", address_block: "MAPLE-100", phone: "+15550501" }
              as: Anonymous
              captures: { m_id: $.data.id }
          assert:
            - "response 201; Member.${m_id}.vetting_status == APPLIED"

      - name: member_cannot_perform_admin_exclusive_ops_returns_unauthorized
        claim_type: role_permission_denial
        grounds: [roles.CoopAdmin, roles.Member, "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Member role is denied on three CoopAdmin-exclusive endpoints — holiday window creation, finalize-vetting, and settle — each returning 403 ERR_UNAUTHORIZED even with a well-formed payload and an existing target."
        test_recipe:
          setup: ["Founders VETTED; F1 owns pet1; canonical sit accepted (assignment CONFIRMED)"]
          setup_api_calls:
            - *mk_f1
            - *mk_f2
            - *mk_f3
            - *ref_f1f2
            - *ref_f1f3
            - *ref_f2f1
            - *ref_f2f3
            - *ref_f3f1
            - *ref_f3f2
            - *liab_f1
            - *liab_f2
            - *liab_f3
            - *sub_f1
            - *sub_f2
            - *sub_f3
            - *acc_f1f2
            - *acc_f1f3
            - *acc_f2f1
            - *acc_f2f3
            - *acc_f3f1
            - *acc_f3f2
            - *fin_f1
            - *fin_f2
            - *fin_f3
            - *pet_f1
            - *req_a
            - *claim_f2
            - *accept_a
            - *get_asg
          trigger:
            - call: "POST /coop/holiday-windows"
              payload: { name: "Sneaky", window_start: "2026-12-24T00:00:00Z", window_end: "2026-12-26T00:00:00Z", demand_multiplier: 2.0 }
              as: Member
              as_user_id: "${f1_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /coop/members/${f2_id}/finalize-vetting"
              payload: {}
              as: Member
              as_user_id: "${f1_id}"
              captures: { err2: $.data.error_id }
            - call: "POST /coop/sitting-assignments/${asg_id}/settle"
              payload: {}
              as: Member
              as_user_id: "${f1_id}"
              captures: { err3: $.data.error_id }
          assert:
            - "All three calls: 403 ERR_UNAUTHORIZED (role gate, priority 2)"
            - "No HolidayWindow persisted; Member.${f2_id} unchanged; assignment still CONFIRMED with no ledger rows"

      - name: admin_cannot_post_sitting_request_returns_unauthorized
        claim_type: role_permission_denial
        grounds: [roles.CoopAdmin, "endpoints[POST /coop/sitting-requests]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Despite the hierarchical_override role model, CoopAdmin is NOT in roles for POST /coop/sitting-requests ([Member] only): the admin's own posting attempt is denied 403 ERR_UNAUTHORIZED — admin override extends to moderation actions, not to acting as a pet owner."
        test_recipe:
          setup: ["Founders VETTED; F1 owns pet1"]
          setup_api_calls:
