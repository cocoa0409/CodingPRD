              as: GamesAdmin
          assert:
            - "BUFFER APPLIES AT THE END: the 10:10-11:00 request at Venue X returns HTTP 409 with error_id == ERR_VENUE_AREA_CAPACITY_EXCEEDED, because S1's window runs to 10:15 even though S1's end_utc is 10:00"
            - "HALF-OPEN ADJACENCY IS LEGAL: the 10:15-11:00 request at Venue X returns HTTP 201 with SessionSlot.${slot_s2_id}.status == SCHEDULED, because A.hi == B.lo does not intersect"
            - "BUFFER IS NEVER SUBTRACTED FROM THE START: the 08:00-09:00 request at Venue X returns HTTP 201 with SessionSlot.${slot_s3_id}.status == SCHEDULED, because [08:00, 09:00) only touches S1's window at 09:00"
            - "AGGREGATE CAPACITY, FIRST OVERLAP: the 14:30-15:30 request at Venue Y returns HTTP 201 with SessionSlot.${slot_y2_id}.status == SCHEDULED, because the concurrent count of 1 is below competition_area_count 2"
            - "AGGREGATE CAPACITY, SECOND OVERLAP: the 14:45-15:15 request at Venue Y returns HTTP 409 with error_id == ERR_VENUE_AREA_CAPACITY_EXCEEDED, because it intersects BOTH Y1 and ${slot_y2_id} for a concurrent count of 2"
