scenario: "461. Dance Studio & Recital Management: class/level & age placement, recurring tuition & auto-pay, costume order & sizing, recital ticketing & seat, competition team & travel, attendance & makeup, instructor/room schedule, family/multi-class discount"
domain_name: dance-studio-recital
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - derived_field_reconciliation
    - quota_allocation

  entity_topology: graph
  # Families, Students, Classes, Sessions, Enrollments (junction), Costumes,
  # Recitals, Seats/Tickets, Teams, Trips cross-reference via FKs; many-to-many
  # between Student and ClassSection is mediated by the Enrollment junction entity.

  state_machine_shape: parallel
  # Enrollment carries two independent dimensions (placement_status × billing_status);
  # Recital is compound (state derived from ticket/seat counts); ClassSection has a
  # branching lifecycle; CostumeOrder has a revert cycle.

  relationship_patterns:
    - one_to_many        # Family -> Student, Recital -> SeatAssignment
    - many_to_many       # Student <-> ClassSection via Enrollment junction
    - cross_aggregate    # Enrollment references ClassSection (schedule aggregate) and Family (billing aggregate)
    - self_referential   # Enrollment.makeup_for_attendance_id references an Attendance row (makeup linkage)

  role_model: peer_roles
  # StudioAdmin owns scheduling/pricing/recital config; Instructor owns attendance
  # and placement recommendations; Parent (Family-backed) owns enrollment, auto-pay,
  # costume sizing, ticket purchase for their own students only.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Family
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: email
        type: string
        source: input
        description: "Login email for the parent account; unique across families (case-insensitive)."
        constraints: "Unique, case-insensitive; non-empty."
      - name: family_name
        type: string
        source: input
        description: "Household surname for roster display."
      - name: autopay_enabled
        type: boolean
        source: input
        description: "Whether tuition invoices auto-charge the saved payment method on the due date."
        default: false
      - name: payment_method_on_file
        type: boolean
        source: computed
        description: "True once a payment method has been added via POST /families/{id}/payment-method. Required precondition for enabling auto-pay."
        default: false
      - name: account_credit_cents
        type: integer
        source: computed
        description: "Family wallet balance in cents. Increased by refunds/credits, decreased when applied to an invoice. Never negative."
        default: 0
      - name: sibling_count
        type: integer
        source: computed
        description: "Count of Students with status IN {ACTIVE} belonging to this family. Drives the family (multi-student) discount tier in tuition calc."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "ACTIVE | DELINQUENT. DELINQUENT when any invoice is PAST_DUE; gates new enrollments. Returns to ACTIVE when the last PAST_DUE invoice is paid."
        default: ACTIVE
        constraints: "Enum: ACTIVE, DELINQUENT"

  - name: Student
    parent: Family
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: family_id
        type: string
        source: input
        description: "FK -> Family.id; the household this student belongs to."
      - name: full_name
        type: string
        source: input
        description: "Student display name."
      - name: birth_date
        type: datetime
        source: input
        description: "Date of birth (ISO 8601 date). Drives age computation for placement against ClassSection age bands."
      - name: age_as_of_cutoff
        type: integer
        source: computed
        description: "Student age in whole years computed as of the active Term's age_cutoff_date. Recomputed when assigned to a term context. Used for placement eligibility."
        default: 0
      - name: level
        type: enum
        source: input
        description: "Skill level used for placement: PETITE | NOVICE | INTERMEDIATE | ADVANCED | ELITE."
        constraints: "Enum: PETITE, NOVICE, INTERMEDIATE, ADVANCED, ELITE"
      - name: status
        type: enum
        source: computed
        description: "ACTIVE | WITHDRAWN. WITHDRAWN students are excluded from sibling_count and from active enrollments. Set via POST /students/{id}/withdraw."
        default: ACTIVE
        constraints: "Enum: ACTIVE, WITHDRAWN"

  - name: Term
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: name
        type: string
        source: input
        description: "Term label, e.g. 'Fall 2026'."
      - name: start_date
        type: datetime
        source: input
        description: "Term start (ISO 8601 date), inclusive."
      - name: end_date
        type: datetime
        source: input
        description: "Term end (ISO 8601 date), inclusive. Must be strictly after start_date."
      - name: age_cutoff_date
        type: datetime
        source: input
        description: "Date used to compute a student's age for placement (ISO 8601 date). Must be within [start_date, end_date]."
      - name: monthly_billing_day
        type: integer
        source: input
        description: "Day-of-month (1..28) the tuition invoice is generated for each month of the term."
        constraints: "Integer 1..28"
      - name: status
        type: enum
        source: computed
        description: "DRAFT | OPEN | CLOSED. DRAFT allows config; OPEN allows enrollment & billing; CLOSED freezes. Set via POST /terms/{id}/open and /close."
        default: DRAFT
        constraints: "Enum: DRAFT, OPEN, CLOSED"

  - name: Room
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: name
        type: string
        source: input
        description: "Room label, e.g. 'Studio A'."
      - name: capacity
        type: integer
        source: input
        description: "Maximum students that may be enrolled in a section held in this room."
        constraints: "Integer >= 1"
      - name: turnover_buffer_minutes
        type: integer
        source: input
        description: "Minutes that must separate the end of one session and the start of the next in the same room (cleaning/turnover). Two sessions are room-conflicting if their [start, end + turnover_buffer) windows overlap."
        default: 0
        constraints: "Integer >= 0"

  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: full_name
        type: string
        source: input
        description: "Instructor display name."
      - name: email
        type: string
        source: input
        description: "Login email for the instructor account; unique (case-insensitive)."
        constraints: "Unique, case-insensitive"
      - name: max_weekly_sessions
        type: integer
        source: input
        description: "Maximum number of ClassSession the instructor may be assigned across all sections (capacity guard)."
        default: 30
        constraints: "Integer >= 1"

  - name: ClassSection
    parent: Term
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: term_id
        type: string
        source: input
        description: "FK -> Term.id; the term this section runs in."
      - name: room_id
        type: string
        source: input
        description: "FK -> Room.id; the room all of this section's weekly sessions occupy."
      - name: instructor_id
        type: string
        source: input
        description: "FK -> Instructor.id; the assigned instructor."
      - name: discipline
        type: enum
        source: input
        description: "BALLET | JAZZ | TAP | HIPHOP | CONTEMPORARY | ACRO."
        constraints: "Enum: BALLET, JAZZ, TAP, HIPHOP, CONTEMPORARY, ACRO"
      - name: required_level
        type: enum
        source: input
        description: "Minimum Student.level for placement: PETITE | NOVICE | INTERMEDIATE | ADVANCED | ELITE (ordinal)."
        constraints: "Enum: PETITE, NOVICE, INTERMEDIATE, ADVANCED, ELITE"
      - name: min_age
        type: integer
        source: input
        description: "Inclusive lower age bound (years) for placement, evaluated against Student.age_as_of_cutoff."
        constraints: "Integer >= 0"
      - name: max_age
        type: integer
        source: input
        description: "Inclusive upper age bound (years). Must be >= min_age."
        constraints: "Integer >= min_age"
      - name: monthly_tuition_cents
        type: integer
        source: input
        description: "Base monthly tuition for one student enrolled in this section, before any family/multi-class discount."
        constraints: "Integer >= 0"
      - name: capacity_cap
        type: integer
        source: input
        description: "Maximum confirmed enrollments. Effective capacity = min(capacity_cap, Room.capacity)."
        constraints: "Integer >= 1"
      - name: enrolled_count
        type: integer
        source: computed
        description: "Count of Enrollment rows for this section with placement_status IN {CONFIRMED, WAITLIST_PROMOTED}. Drives capacity gating and waitlist promotion."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "PLANNED | SCHEDULED | OPEN | FULL | CANCELLED. PLANNED at create; SCHEDULED once >=1 session added; OPEN once term is OPEN and sessions scheduled; FULL when enrolled_count == effective capacity; CANCELLED terminal."
        default: PLANNED
        constraints: "Enum: PLANNED, SCHEDULED, OPEN, FULL, CANCELLED"

  - name: ClassSession
    parent: ClassSection
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: section_id
        type: string
        source: input
        description: "FK -> ClassSection.id; the section this weekly session belongs to."
      - name: day_of_week
        type: integer
        source: input
        description: "0=Monday .. 6=Sunday. The weekday this recurring session occupies."
        constraints: "Integer 0..6"
      - name: start_minute
        type: integer
        source: input
        description: "Start time as minutes-since-midnight (0..1439)."
        constraints: "Integer 0..1439"
      - name: end_minute
        type: integer
        source: input
        description: "End time as minutes-since-midnight. Must be strictly greater than start_minute (no midnight wrap)."
        constraints: "Integer 1..1440, > start_minute"

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the placed student."
      - name: section_id
        type: string
        source: input
        description: "FK -> ClassSection.id; the section the student is placed into."
      - name: family_id
        type: string
        source: computed
        description: "FK -> Family.id; copied from Student.family_id at creation for billing rollup."
      - name: placement_status
        type: enum
        source: computed
        description: "Placement dimension: PENDING | CONFIRMED | WAITLISTED | WAITLIST_PROMOTED | DROPPED. PENDING at create; CONFIRMED if capacity available; WAITLISTED if full; promoted to WAITLIST_PROMOTED on a free slot; DROPPED terminal."
        default: PENDING
        constraints: "Enum: PENDING, CONFIRMED, WAITLISTED, WAITLIST_PROMOTED, DROPPED"
      - name: billing_status
        type: enum
        source: computed
        description: "Billing dimension, independent of placement: UNBILLED | BILLING_ACTIVE | BILLING_PAUSED | BILLING_ENDED. UNBILLED until placement CONFIRMED; BILLING_ACTIVE thereafter; PAUSED on suspend; ENDED on drop."
        default: UNBILLED
        constraints: "Enum: UNBILLED, BILLING_ACTIVE, BILLING_PAUSED, BILLING_ENDED"
      - name: waitlist_rank
        type: integer
        source: computed
        description: "Position among WAITLISTED enrollments of the same section, ordered by Enrollment.created_at ASC. 0 when not waitlisted."
        default: 0
      - name: monthly_charge_cents
        type: integer
        source: computed
        description: "This enrollment's discounted monthly tuition contribution, recomputed by the tuition calc when the enrollment confirms or when the family's sibling/multi-class profile changes."
        default: 0

  - name: Attendance
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment whose attendance this record covers."
      - name: session_id
        type: string
        source: input
        description: "FK -> ClassSession.id; the dated session occurrence (the weekly slot) being marked."
      - name: occurred_on
        type: datetime
        source: input
        description: "Calendar date (ISO 8601 date) of the session occurrence being marked. Must fall on ClassSession.day_of_week and inside the section's Term window."
      - name: result
        type: enum
        source: input
        description: "PRESENT | ABSENT_EXCUSED | ABSENT_UNEXCUSED. Append-only; corrected via POST /attendance/{id}/amend which writes a new value."
        constraints: "Enum: PRESENT, ABSENT_EXCUSED, ABSENT_UNEXCUSED"
      - name: makeup_eligible
        type: boolean
        source: computed
        description: "True only when result == ABSENT_EXCUSED and no makeup has yet been consumed against this row. Gates booking a makeup."
        default: false
      - name: makeup_consumed
        type: boolean
        source: computed
        description: "True once a makeup Enrollment has been booked citing this Attendance via makeup_for_attendance_id."
        default: false

  - name: Costume
    parent: ClassSection
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: section_id
        type: string
        source: input
        description: "FK -> ClassSection.id; the section this costume is for."
      - name: name
        type: string
        source: input
        description: "Costume label."
      - name: unit_price_cents
        type: integer
        source: input
        description: "Per-student costume price before any rush surcharge."
        constraints: "Integer >= 0"
      - name: size_window_close_date
        type: datetime
        source: input
        description: "ISO 8601 date after which sizing is locked and orders incur the rush surcharge. Compared against the logical clock."
      - name: rush_surcharge_cents
        type: integer
        source: input
        description: "Flat surcharge added to a CostumeOrder placed after size_window_close_date."
        default: 0
        constraints: "Integer >= 0"
      - name: status
        type: enum
        source: computed
        description: "SIZING_OPEN | ORDERED. SIZING_OPEN at create; ORDERED once POST /costumes/{id}/submit-order submits all DRAFT orders. The size window (rush surcharge) is governed by the clock vs size_window_close_date, not by this status."
        default: SIZING_OPEN
        constraints: "Enum: SIZING_OPEN, ORDERED"

  - name: CostumeOrder
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: costume_id
        type: string
        source: input
        description: "FK -> Costume.id; the costume being ordered."
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrolled student this order is for (the student must be CONFIRMED in the costume's section)."
      - name: size_code
        type: enum
        source: input
        description: "CHILD_S | CHILD_M | CHILD_L | ADULT_S | ADULT_M | ADULT_L."
        constraints: "Enum: CHILD_S, CHILD_M, CHILD_L, ADULT_S, ADULT_M, ADULT_L"
      - name: price_cents
        type: integer
        source: computed
        description: "Costume.unit_price_cents plus Costume.rush_surcharge_cents when ordered after size_window_close_date, else just unit_price_cents. Pinned at order time."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "DRAFT | SUBMITTED | CANCELLED. DRAFT at create; SUBMITTED when the parent costume order is submitted; CANCELLED reverts the line and refunds via account credit."
        default: DRAFT
        constraints: "Enum: DRAFT, SUBMITTED, CANCELLED"

  - name: Recital
    parent: Term
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: term_id
        type: string
        source: input
        description: "FK -> Term.id; the term this recital concludes."
      - name: name
        type: string
        source: input
        description: "Recital title."
      - name: show_datetime
        type: datetime
        source: input
        description: "ISO 8601 datetime of the performance."
      - name: total_seats
        type: integer
        source: input
        description: "Number of physical seats available for ticketing."
        constraints: "Integer >= 1"
      - name: ticket_price_cents
        type: integer
        source: input
        description: "Price per ticket before the family allotment-free allowance."
        constraints: "Integer >= 0"
      - name: free_tickets_per_family
        type: integer
        source: input
        description: "Number of complimentary tickets each family receives before paid pricing applies, across all their students in the recital."
        default: 0
        constraints: "Integer >= 0"
      - name: seats_sold
        type: integer
        source: computed
        description: "Count of SeatAssignment rows with status IN {HELD, PURCHASED}. Drives sold-out gating."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "ANNOUNCED | ON_SALE | SOLD_OUT | COMPLETED. ON_SALE when opened; SOLD_OUT (compound) when seats_sold == total_seats; COMPLETED terminal."
        default: ANNOUNCED
        constraints: "Enum: ANNOUNCED, ON_SALE, SOLD_OUT, COMPLETED"

  - name: SeatAssignment
    parent: Recital
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: recital_id
        type: string
        source: input
        description: "FK -> Recital.id; the recital this seat belongs to."
      - name: family_id
        type: string
        source: input
        description: "FK -> Family.id; the family that holds/purchased this seat."
      - name: seat_label
        type: string
        source: input
        description: "Human seat label, e.g. 'A-12'. Unique per recital among non-RELEASED seats."
      - name: is_complimentary
        type: boolean
        source: computed
        description: "True when this seat fell within the family's free_tickets_per_family allowance at purchase time (priced at 0)."
        default: false
      - name: price_cents
        type: integer
        source: computed
        description: "0 if complimentary, else Recital.ticket_price_cents. Pinned at hold time."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "HELD | PURCHASED | RELEASED. HELD on reserve; PURCHASED on pay; RELEASED frees the seat back to inventory."
        default: HELD
        constraints: "Enum: HELD, PURCHASED, RELEASED"

  - name: CompetitionTeam
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: name
        type: string
        source: input
        description: "Team label, e.g. 'Senior Elite Jazz'."
      - name: min_level
        type: enum
        source: input
        description: "Minimum Student.level to be rostered: PETITE | NOVICE | INTERMEDIATE | ADVANCED | ELITE (ordinal)."
        constraints: "Enum: PETITE, NOVICE, INTERMEDIATE, ADVANCED, ELITE"
      - name: roster_cap
        type: integer
        source: input
        description: "Maximum rostered members."
        constraints: "Integer >= 1"
      - name: roster_count
        type: integer
        source: computed
        description: "Count of TeamMembership rows with status == ROSTERED. Drives roster cap gating."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "FORMING | LOCKED. FORMING allows roster changes; LOCKED freezes the roster (set via POST /teams/{id}/lock)."
        default: FORMING
        constraints: "Enum: FORMING, LOCKED"

  - name: TeamMembership
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: team_id
        type: string
        source: input
        description: "FK -> CompetitionTeam.id; the team."
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the rostered student."
      - name: status
        type: enum
        source: computed
        description: "ROSTERED | RELEASED. ROSTERED at create; RELEASED on removal (frees a roster slot)."
        default: ROSTERED
        constraints: "Enum: ROSTERED, RELEASED"

  - name: TravelTrip
    parent: CompetitionTeam
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: team_id
        type: string
        source: input
        description: "FK -> CompetitionTeam.id; the team traveling."
      - name: destination
        type: string
        source: input
        description: "Competition destination label."
      - name: depart_date
        type: datetime
        source: input
        description: "ISO 8601 date of departure."
      - name: return_date
        type: datetime
        source: input
        description: "ISO 8601 date of return. Must be >= depart_date."
      - name: per_member_cost_cents
        type: integer
        source: input
        description: "Travel cost charged to each participating member's family."
        constraints: "Integer >= 0"
      - name: chaperone_ratio
        type: integer
        source: input
        description: "Required minimum students-per-chaperone. A trip cannot be CONFIRMED unless ceil(participant_count / chaperone_ratio) <= chaperone_count."
        constraints: "Integer >= 1"
      - name: chaperone_count
        type: integer
        source: input
        description: "Number of registered chaperones for this trip."
        default: 0
        constraints: "Integer >= 0"
      - name: participant_count
        type: integer
        source: computed
        description: "Count of TripParticipant rows with status == GOING."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "PROPOSED | CONFIRMED | CANCELLED. PROPOSED allows signups; CONFIRMED locks participants & charges travel; CANCELLED refunds."
        default: PROPOSED
        constraints: "Enum: PROPOSED, CONFIRMED, CANCELLED"

  - name: TripParticipant
    parent: TravelTrip
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: trip_id
        type: string
        source: input
        description: "FK -> TravelTrip.id; the trip."
      - name: membership_id
        type: string
        source: input
        description: "FK -> TeamMembership.id; the rostered membership signing up (must be ROSTERED on a team matching the trip's team)."
      - name: family_id
        type: string
        source: computed
        description: "FK -> Family.id; copied from the membership's student's family for travel billing."
      - name: status
        type: enum
        source: computed
        description: "GOING | WITHDRAWN. GOING at signup; WITHDRAWN on cancellation (refunds travel charge if trip already CONFIRMED)."
        default: GOING
        constraints: "Enum: GOING, WITHDRAWN"

  - name: Invoice
    parent: Family
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: family_id
        type: string
        source: input
        description: "FK -> Family.id; the billed family."
      - name: term_id
        type: string
        source: input
        description: "FK -> Term.id; the term whose monthly tuition this invoice covers."
      - name: billing_month
        type: string
        source: input
        description: "Billing month as 'YYYY-MM'. Unique per (family_id, term_id, billing_month) among non-VOID invoices."
      - name: tuition_cents
        type: integer
        source: computed
        description: "Sum of monthly_charge_cents over the family's Enrollment rows with billing_status == BILLING_ACTIVE at generation time."
        default: 0
      - name: fees_cents
        type: integer
        source: computed
        description: "Sum of additional line charges (costume, travel, ticket) folded into this invoice at generation time."
        default: 0
      - name: credit_applied_cents
        type: integer
        source: computed
        description: "Amount of Family.account_credit_cents applied at generation, capped at (tuition_cents + fees_cents)."
        default: 0
      - name: amount_due_cents
        type: integer
        source: computed
        description: "max(0, tuition_cents + fees_cents - credit_applied_cents). The net the family owes."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "OPEN | PAID | PAST_DUE | VOID. OPEN at generation; PAID on successful charge; PAST_DUE if unpaid past due day; VOID terminal on void."
        default: OPEN
        constraints: "Enum: OPEN, PAID, PAST_DUE, VOID"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Term
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /terms/{id}/open"
        actor: StudioAdmin
        preconditions:
          - "Term has >= 1 ClassSection in status SCHEDULED"
          - "age_cutoff_date within [start_date, end_date]"
        side_effects:
          - "Each ClassSection in SCHEDULED transitions to OPEN"
        note: "Opening a term unlocks enrollment and billing."
      - from: OPEN
        to: CLOSED
        trigger: "POST /terms/{id}/close"
        actor: StudioAdmin
        preconditions:
          - "All Invoice rows for this term in status IN {PAID, VOID}"
        side_effects:
          - "Each Enrollment under this term with billing_status == BILLING_ACTIVE transitions billing_status to BILLING_ENDED (sections are left in their current status; billing simply stops)"
        note: "Closing freezes the term; billing stops. Sections are not cancelled."

  - entity: ClassSection
    initial_state: PLANNED
    terminal_states: [CANCELLED]
    transitions:
      - from: PLANNED
        to: SCHEDULED
        trigger: "POST /sections/{id}/sessions (first session added)"
        actor: StudioAdmin
        preconditions:
          - "New session does not room-conflict with any other section's sessions in the same Room"
          - "New session does not instructor-conflict with this instructor's other sessions"
        side_effects:
          - "Section transitions PLANNED -> SCHEDULED on the first session"
      - from: SCHEDULED
        to: OPEN
        trigger: "system: Term opened"
        actor: system
        preconditions:
          - "Parent Term transitions to OPEN"
        side_effects:
          - "Section becomes enrollable"
        note: "Cross-entity: section opens only when its Term opens (guarded)."
      - from: OPEN
        to: FULL
        trigger: "system: enrollment confirmed reaches capacity"
        actor: system
        preconditions:
          - "enrolled_count == min(capacity_cap, Room.capacity) after a confirm"
        side_effects:
          - "Further enrollments are WAITLISTED instead of CONFIRMED"
      - from: FULL
        to: OPEN
        trigger: "system: a confirmed enrollment drops and a waitlisted one is promoted but capacity is not refilled"
        actor: system
        preconditions:
          - "enrolled_count < effective capacity after a drop with no eligible waitlist promotion"
        side_effects:
          - "Section returns to OPEN; next enrollment may CONFIRM"
        note: "Cyclic: OPEN -> FULL -> OPEN as enrollment count crosses the cap."
      - from: OPEN
        to: CANCELLED
        trigger: "POST /sections/{id}/cancel"
        actor: StudioAdmin
        preconditions:
          - "Section status IN {PLANNED, SCHEDULED, OPEN}"
        side_effects:
          - "Each Enrollment in {CONFIRMED, WAITLISTED, WAITLIST_PROMOTED} transitions to DROPPED (placement); each in {CONFIRMED, WAITLIST_PROMOTED} also transitions billing_status to BILLING_ENDED"
          - "Cascade: each dropped CONFIRMED enrollment's monthly_charge_cents is removed from its family's open Invoice draft and the family's other enrollments' monthly_charge_cents are recomputed (multi-class discount tier may change)"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /sections/{id}/cancel"
        actor: StudioAdmin
        preconditions:
          - "Section has no CONFIRMED enrollments"
        side_effects:
          - "Section terminal"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /sections/{id}/cancel"
        actor: StudioAdmin
        preconditions: []
        side_effects:
          - "Section terminal"

  - entity: Enrollment
    initial_state: PENDING
    terminal_states: [DROPPED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /enrollments (auto-resolve at create) or POST /enrollments/{id}/confirm"
        actor: StudioAdmin
        preconditions:
          - "Parent ClassSection.status == OPEN"
          - "section.enrolled_count < effective capacity"
          - "Student.level ordinal >= section.required_level ordinal"
          - "section.min_age <= Student.age_as_of_cutoff <= section.max_age"
          - "Family.status != DELINQUENT"
        side_effects:
          - "placement_status -> CONFIRMED; section.enrolled_count += 1"
          - "billing_status UNBILLED -> BILLING_ACTIVE"
          - "Calc tuition_monthly_charge runs: this enrollment and ALL of the family's other BILLING_ACTIVE enrollments recompute monthly_charge_cents (sibling + multi-class discount)"
          - "If enrolled_count reaches effective capacity, section OPEN -> FULL"
        note: "Cross-entity: confirm depends on ClassSection.status and Family.status."
      - from: PENDING
        to: WAITLISTED
        trigger: "POST /enrollments (auto-resolve at create)"
        actor: StudioAdmin
        preconditions:
          - "Parent ClassSection.status == FULL (no capacity)"
          - "Student.level and age satisfy the section bounds"
        side_effects:
          - "placement_status -> WAITLISTED; waitlist_rank assigned = (count of existing WAITLISTED for section) + 1, ordered by created_at ASC"
          - "billing_status stays UNBILLED"
      - from: WAITLISTED
        to: WAITLIST_PROMOTED
        trigger: "system: a CONFIRMED enrollment in the section DROPS"
        actor: system
        preconditions:
          - "This enrollment has the lowest waitlist_rank (earliest created_at) among WAITLISTED for the section"
          - "section.enrolled_count < effective capacity after the drop"
        side_effects:
          - "placement_status WAITLISTED -> WAITLIST_PROMOTED; section.enrolled_count += 1"
          - "billing_status UNBILLED -> BILLING_ACTIVE"
          - "Calc tuition_monthly_charge runs for this enrollment and the family's other BILLING_ACTIVE enrollments"
          - "Remaining WAITLISTED enrollments' waitlist_rank decrement by 1"
        note: "Cascade depth: drop -> promote -> recompute family tuition -> resequence ranks."
      - from: CONFIRMED
        to: DROPPED
        trigger: "POST /enrollments/{id}/drop"
        actor: Parent
        preconditions:
          - "Enrollment.placement_status == CONFIRMED"
          - "Parent owns the student (Student.family_id == X-User-ID)"
        side_effects:
          - "placement_status -> DROPPED; section.enrolled_count -= 1"
          - "billing_status BILLING_ACTIVE -> BILLING_ENDED"
          - "Calc tuition_monthly_charge re-runs for the family's remaining BILLING_ACTIVE enrollments (discount tier may rise as fewer classes remain)"
          - "If a WAITLISTED enrollment exists for the section, promote the lowest-rank one (cascade to its own CONFIRM-like effects); else section FULL -> OPEN"
        note: "Cascade depth >= 3: drop -> waitlist promotion -> promoted enrollment billing + family tuition recompute."
      - from: WAITLISTED
        to: DROPPED
        trigger: "POST /enrollments/{id}/drop"
        actor: Parent
        preconditions:
          - "Enrollment.placement_status == WAITLISTED"
        side_effects:
          - "placement_status -> DROPPED; remaining WAITLISTED waitlist_rank resequenced"
      - from: WAITLIST_PROMOTED
        to: DROPPED
        trigger: "POST /enrollments/{id}/drop"
        actor: Parent
        preconditions:
          - "Enrollment.placement_status == WAITLIST_PROMOTED"
        side_effects:
          - "placement_status -> DROPPED; section.enrolled_count -= 1; billing_status -> BILLING_ENDED; family tuition recompute; promote next waitlist if any"
      - from: CONFIRMED
        to: CONFIRMED
        trigger: "POST /enrollments/{id}/pause-billing then /resume-billing"
        actor: StudioAdmin
        preconditions:
          - "billing_status == BILLING_ACTIVE (for pause) or BILLING_PAUSED (for resume)"
        side_effects:
          - "billing_status BILLING_ACTIVE <-> BILLING_PAUSED; placement_status unchanged"
        note: "Parallel dimensions: placement stays CONFIRMED while billing toggles ACTIVE<->PAUSED."

  - entity: CostumeOrder
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "system: POST /costumes/{id}/submit-order submits all DRAFT orders for that costume"
        actor: StudioAdmin
        preconditions:
          - "Parent Costume.status == SIZING_OPEN"
          - "Linked Enrollment.placement_status IN {CONFIRMED, WAITLIST_PROMOTED}"
        side_effects:
          - "price_cents pinned via costume_price calc (rush surcharge if clock > size_window_close_date)"
          - "Cascade: the order's price_cents is added as a fee line to the family's current OPEN Invoice (fees_cents += price_cents; amount_due recompute)"
          - "Costume.status -> ORDERED"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /costume-orders/{id}/cancel"
        actor: Parent
        preconditions:
          - "CostumeOrder.status == DRAFT"
        side_effects:
          - "Order terminal; no charge had been applied"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /costume-orders/{id}/cancel"
        actor: StudioAdmin
        preconditions:
          - "CostumeOrder.status == SUBMITTED"
        side_effects:
          - "Compensation: price_cents removed from the family's OPEN Invoice fees_cents (or, if the invoice is already PAID, credited to Family.account_credit_cents) — the conserved total (invoice fees + family credit) returns to its pre-order value"
        note: "Compensating invariant: family_total_owed must net to pre-order value."

  - entity: Recital
    initial_state: ANNOUNCED
    terminal_states: [COMPLETED]
    transitions:
      - from: ANNOUNCED
        to: ON_SALE
        trigger: "POST /recitals/{id}/open-sales"
        actor: StudioAdmin
        preconditions:
          - "Parent Term.status == OPEN"
          - "total_seats >= 1"
        side_effects:
          - "Seats become reservable"
      - from: ON_SALE
        to: SOLD_OUT
        trigger: "system: a seat hold/purchase makes seats_sold == total_seats"
        actor: system
        preconditions:
          - "seats_sold == total_seats after a HELD/PURCHASED seat"
        side_effects:
          - "Further holds rejected with ERR_RECITAL_SOLD_OUT"
        note: "Compound: status derived from seats_sold vs total_seats."
      - from: SOLD_OUT
        to: ON_SALE
        trigger: "system: a HELD/PURCHASED seat is RELEASED"
        actor: system
        preconditions:
          - "seats_sold < total_seats after a release"
        side_effects:
          - "Seats reservable again"
        note: "Cyclic: ON_SALE <-> SOLD_OUT tracks seats_sold crossing total_seats."
      - from: ON_SALE
        to: COMPLETED
        trigger: "POST /recitals/{id}/complete"
        actor: StudioAdmin
        preconditions:
          - "clock >= show_datetime"
        side_effects:
          - "All HELD seats RELEASED; PURCHASED retained"
      - from: SOLD_OUT
        to: COMPLETED
        trigger: "POST /recitals/{id}/complete"
        actor: StudioAdmin
        preconditions:
          - "clock >= show_datetime"
        side_effects:
          - "All HELD seats RELEASED; PURCHASED retained"

  - entity: SeatAssignment
    initial_state: HELD
    terminal_states: [RELEASED]
    transitions:
      - from: HELD
        to: PURCHASED
        trigger: "POST /seats/{id}/purchase"
        actor: Parent
        preconditions:
          - "SeatAssignment.status == HELD"
          - "Parent owns the seat's family_id"
          - "Recital.status IN {ON_SALE, SOLD_OUT}"
        side_effects:
          - "price_cents charged: if invoice exists OPEN, fees_cents += price_cents else a charge is recorded; complimentary seats charge 0"
      - from: HELD
        to: RELEASED
        trigger: "POST /seats/{id}/release or system on recital complete"
        actor: Parent
        preconditions:
          - "SeatAssignment.status == HELD"
        side_effects:
          - "recital.seats_sold -= 1; if recital was SOLD_OUT it returns to ON_SALE; family's complimentary allotment recomputed for the freed slot"
      - from: PURCHASED
        to: RELEASED
        trigger: "POST /seats/{id}/release"
        actor: StudioAdmin
        preconditions:
          - "SeatAssignment.status == PURCHASED"
        side_effects:
          - "Compensation: recital.seats_sold -= 1; price_cents refunded to Family.account_credit_cents (conserved quantity: seats_sold + released seats and family paid+credit both reconcile); if SOLD_OUT -> ON_SALE"

  - entity: TravelTrip
    initial_state: PROPOSED
    terminal_states: [CANCELLED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /trips/{id}/confirm"
        actor: StudioAdmin
        preconditions:
          - "Parent CompetitionTeam.status == LOCKED"
          - "participant_count >= 1"
          - "ceil(participant_count / chaperone_ratio) <= chaperone_count"
        side_effects:
          - "Each TripParticipant in GOING: per_member_cost_cents added to its family's OPEN Invoice fees_cents (cascade across families)"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /trips/{id}/cancel"
        actor: StudioAdmin
        preconditions:
          - "TravelTrip.status == PROPOSED"
        side_effects:
          - "Each TripParticipant -> WITHDRAWN; no charges had applied"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /trips/{id}/cancel"
        actor: StudioAdmin
        preconditions:
          - "TravelTrip.status == CONFIRMED"
        side_effects:
          - "Compensation: each GOING participant -> WITHDRAWN; per_member_cost_cents refunded (removed from OPEN Invoice fees or credited to Family.account_credit_cents) — total travel money conserved"

  - entity: Invoice
    initial_state: OPEN
    terminal_states: [VOID]
    transitions:
      - from: OPEN
        to: PAID
        trigger: "POST /invoices/{id}/pay (manual) or system auto-pay on billing day"
        actor: Parent
        preconditions:
          - "Invoice.status == OPEN"
          - "Family.payment_method_on_file == true"
        side_effects:
          - "amount_due_cents charged; status -> PAID; if family was DELINQUENT and no other PAST_DUE invoices remain, Family.status -> ACTIVE"
      - from: OPEN
        to: PAST_DUE
        trigger: "system: POST /_clock/set_current_utc advances past the invoice due day with status still OPEN"
        actor: system
        preconditions:
          - "clock date > due day of billing_month AND status == OPEN"
        side_effects:
          - "status -> PAST_DUE; Family.status -> DELINQUENT (gates new enrollment confirmations)"
        note: "Cross-entity cascade: invoice past-due flips family status, which gates Enrollment confirms."
      - from: PAST_DUE
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: Parent
        preconditions:
          - "Invoice.status == PAST_DUE"
          - "Family.payment_method_on_file == true"
        side_effects:
          - "status -> PAID; if no other PAST_DUE invoices remain for the family, Family.status DELINQUENT -> ACTIVE"
      - from: OPEN
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: StudioAdmin
        preconditions:
          - "Invoice.status IN {OPEN, PAST_DUE}"
        side_effects:
          - "status -> VOID; any credit_applied_cents returned to Family.account_credit_cents (conserved: credit balance restored)"

  - entity: Student
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /students/{id}/withdraw"
        actor: Parent
        preconditions:
          - "Student.status == ACTIVE"
        side_effects:
          - "Each of the student's Enrollment rows in {CONFIRMED, WAITLIST_PROMOTED} -> DROPPED (placement) and BILLING_ENDED (billing); each WAITLISTED -> DROPPED"
          - "Family.sibling_count recomputed; family tuition_monthly_charge recompute for remaining BILLING_ACTIVE enrollments"

  - entity: Costume
    initial_state: SIZING_OPEN
    terminal_states: []
    transitions:
      - from: SIZING_OPEN
        to: ORDERED
        trigger: "POST /costumes/{id}/submit-order"
        actor: StudioAdmin
        preconditions:
          - "Costume.status == SIZING_OPEN"
        side_effects:
          - "Each DRAFT CostumeOrder for this costume -> SUBMITTED with price pinned (rush surcharge if clock > size_window_close_date); each price folded into the order family's OPEN Invoice fees_cents"

  - entity: CompetitionTeam
    initial_state: FORMING
    terminal_states: [LOCKED]
    transitions:
      - from: FORMING
        to: LOCKED
        trigger: "POST /teams/{id}/lock"
        actor: StudioAdmin
        preconditions:
          - "CompetitionTeam.status == FORMING"
        side_effects:
          - "Roster frozen: further POST /teams/{id}/memberships and POST /memberships/{id}/release are rejected with ERR_INVALID_STATE"
        note: "A trip can only be CONFIRMED when its team is LOCKED (cross-entity guard)."

  - entity: TeamMembership
    initial_state: ROSTERED
    terminal_states: [RELEASED]
    transitions:
      - from: ROSTERED
        to: RELEASED
        trigger: "POST /memberships/{id}/release"
        actor: StudioAdmin
        preconditions:
          - "TeamMembership.status == ROSTERED"
          - "Parent CompetitionTeam.status == FORMING"
        side_effects:
          - "team.roster_count -= 1"
        note: "Cross-entity: release allowed only while the team is FORMING."

  - entity: TripParticipant
    initial_state: GOING
    terminal_states: [WITHDRAWN]
    transitions:
      - from: GOING
        to: WITHDRAWN
        trigger: "POST /participants/{id}/withdraw"
        actor: Parent
        preconditions:
          - "TripParticipant.status == GOING"
        side_effects:
          - "trip.participant_count -= 1"
          - "If parent TravelTrip.status == CONFIRMED: compensation — per_member_cost_cents refunded (removed from the family's OPEN Invoice fees_cents, or credited to Family.account_credit_cents if no OPEN invoice); travel money conserved"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: seat-hold-stale-recital
    parent_entity: Recital
    write_endpoint: "POST /recitals/{id}/seats"
    occ_field: "expected_recital_version"
    description: |
      Holding a seat against a Recital whose version has advanced since the
      client last observed it is rejected. Another writer has just held the
      last seat (legitimately moving the recital toward SOLD_OUT and bumping
      its version); the current writer's view of remaining inventory is
      therefore stale, so the hold is rejected on the version mismatch.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: team-roster-stale-team
    parent_entity: CompetitionTeam
    write_endpoint: "POST /teams/{id}/memberships"
    occ_field: "expected_team_version"
    description: |
      Rostering a student onto a CompetitionTeam whose version has advanced
      since the client last read it is rejected. Another writer has just
      added the member that filled the last roster slot (bumping team
      version); the current writer's view of roster_count is stale, so the
      add is rejected on the version mismatch.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: student_age_as_of_cutoff
    trigger: "On Student creation and whenever placement is evaluated against a Term"
    algorithm: aggregation
    formula: |
      age = year(term.age_cutoff_date) - year(student.birth_date)
      if (month(age_cutoff_date), day(age_cutoff_date)) <
         (month(birth_date), day(birth_date)):
          age = age - 1
      age_as_of_cutoff = age   # whole years, floor
    input_set: "Single Student vs the active Term.age_cutoff_date"
    constants: {}
    precision: "whole years, floor"
    variants: []

  - name: tuition_monthly_charge
    trigger: "On Enrollment CONFIRMED / WAITLIST_PROMOTED, on drop, on billing pause/resume — recomputes every BILLING_ACTIVE enrollment in the family"
    algorithm: tiered_pricing
    formula: |
      # Inputs: the family's enrollments with billing_status == BILLING_ACTIVE,
      # ordered by ClassSection.monthly_tuition_cents DESC, then Enrollment.created_at ASC
      # (tie-break by created_at, NEVER id).
      active = [e for e in family.enrollments if e.billing_status == BILLING_ACTIVE]
      sorted_active = sort(active, key=(-section.monthly_tuition_cents, created_at ASC))

      # MULTI-CLASS discount applies per student by class index:
      #   1st enrolled class for a student: 0% off
      #   2nd class: MULTI_CLASS_2ND_PCT off
      #   3rd+ class: MULTI_CLASS_3RD_PLUS_PCT off
      # (index counted within the same student's BILLING_ACTIVE enrollments,
      #  ordered by monthly_tuition_cents DESC then created_at ASC — highest-priced
      #  class is always the un-discounted 1st.)

      # FAMILY (multi-student) discount applies on top, based on sibling_count
      # (count of ACTIVE students with >=1 BILLING_ACTIVE enrollment):
      #   1 student: 0%
      #   2 students: FAMILY_2_PCT
      #   3+ students: FAMILY_3_PLUS_PCT

      # Per-enrollment charge:
      base = section.monthly_tuition_cents
      after_multiclass = round_half_up(base * (1 - multiclass_pct))   # round per line item
      after_family = round_half_up(after_multiclass * (1 - family_pct))  # then apply family pct, round again
      monthly_charge_cents = after_family
      # ROUNDING ORDER IS PINNED: round after multi-class, THEN apply family pct, THEN round.
      # (round-per-line-item, both steps; NOT sum-then-round.)
    input_set: "Family's Enrollment rows with billing_status == BILLING_ACTIVE only"
    constants:
      MULTI_CLASS_2ND_PCT: 0.10
      MULTI_CLASS_3RD_PLUS_PCT: 0.20
      FAMILY_2_PCT: 0.05
      FAMILY_3_PLUS_PCT: 0.08
    precision: "2 implied decimals are cents; round_half_up at each of the two stages (per line item)"
    variants:
      - name: provisional_at_enrollment
        when: "Computed live on each Enrollment as monthly_charge_cents whenever the family profile changes"
        difference: "Reflects the current set of BILLING_ACTIVE enrollments at this instant; changes as siblings add/drop."
      - name: invoiced_snapshot
        when: "At Invoice generation (POST /invoices/generate) the then-current monthly_charge_cents of each BILLING_ACTIVE enrollment is summed into Invoice.tuition_cents"
        difference: "Frozen snapshot at generation; a later drop does NOT retroactively change an already-generated invoice's tuition_cents."

  - name: invoice_totals
    trigger: "On POST /invoices/generate and on any fee-line cascade (costume submit, trip confirm, seat purchase) into an OPEN invoice"
    algorithm: waterfall_allocation
    formula: |
      tuition_cents = sum(e.monthly_charge_cents for e in family.enrollments
                          if e.billing_status == BILLING_ACTIVE)   # snapshot
      fees_cents = sum(fee lines folded into this invoice)
      gross = tuition_cents + fees_cents
      # Apply family account credit as a waterfall: credit fills the invoice up
      # to gross, leftover credit stays on the account.
      credit_applied_cents = min(family.account_credit_cents, gross)
      amount_due_cents = max(0, gross - credit_applied_cents)
      # Evaluation order is pinned: tuition first, then fees, then credit waterfall.
      # account_credit_cents is decremented by credit_applied_cents at generation.
    input_set: "One Family's BILLING_ACTIVE enrollments + pending fee lines for the billing_month"
    constants: {}
    precision: "integer cents; no rounding (already cents)"
    variants: []

  - name: costume_order_price
    trigger: "On CostumeOrder DRAFT->SUBMITTED (submit-order)"
    algorithm: threshold
    formula: |
      if clock_date > costume.size_window_close_date:
          price_cents = costume.unit_price_cents + costume.rush_surcharge_cents
      else:
          price_cents = costume.unit_price_cents
      # Boundary: clock_date STRICTLY GREATER than close date triggers rush.
      # On the close date itself (clock_date == close_date) there is NO surcharge.
    input_set: "Single Costume vs logical clock at submit time"
    constants: {}
    precision: "integer cents"
    variants:
      - name: standard_price
        when: "Submitted on or before size_window_close_date"
        difference: "No rush surcharge."
      - name: rush_price
        when: "Submitted strictly after size_window_close_date"
        difference: "rush_surcharge_cents added."

  - name: ticket_pricing_allotment
    trigger: "On seat hold (POST /recitals/{id}/seats) — determines is_complimentary and price_cents"
    algorithm: waterfall_allocation
    formula: |
      # For the holding family in this recital, count seats already in
      # status IN {HELD, PURCHASED} (existing_held).
      existing_held = count(seats for this family+recital with status IN {HELD, PURCHASED})
      if existing_held < recital.free_tickets_per_family:
          is_complimentary = true
          price_cents = 0
      else:
          is_complimentary = false
          price_cents = recital.ticket_price_cents
      # Waterfall: the first free_tickets_per_family seats a family holds are
      # complimentary (filled in created_at order); subsequent seats are paid.
      # On release of a complimentary seat, the freed allotment is reclaimed by
      # the next-earliest paid HELD seat? NO — allotment is recomputed per the
      # current HELD/PURCHASED set ordered by created_at ASC; the earliest
      # free_tickets_per_family of them are complimentary.
    input_set: "Family's SeatAssignment rows for this recital in {HELD, PURCHASED}"
    constants: {}
    precision: "integer cents"
    variants:
      - name: complimentary
        when: "Within the family's free allotment for the recital"
        difference: "price 0, is_complimentary true"
      - name: paid
        when: "Beyond the free allotment"
        difference: "price = ticket_price_cents"

  - name: chaperone_requirement
    trigger: "On TravelTrip PROPOSED->CONFIRMED precondition check"
    algorithm: threshold
    formula: |
      required_chaperones = ceil(trip.participant_count / trip.chaperone_ratio)
      ok = required_chaperones <= trip.chaperone_count
      # Boundary: participant_count exactly divisible by ratio uses exact quotient;
      # one over a multiple bumps required_chaperones by 1 (ceil semantics).
    input_set: "Single TravelTrip: participant_count (GOING) vs chaperone_ratio and chaperone_count"
    constants: {}
    precision: "integer (ceil)"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is one of StudioAdmin, Instructor, Parent (or Anonymous where the endpoint allows it)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except endpoints that explicitly allow Anonymous"

  - priority: 2
    category: auth
    check: "The acting role is permitted for this endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "For Parent-scoped resources, X-User-ID equals the owning Family.id (Parent acting on own student/enrollment/seat/family only)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Parent operations on Student/Enrollment/SeatAssignment/CostumeOrder/Invoice/Family"

  - priority: 4
    category: existence
    check: "Every path/body id resolves to a live resource, validated left-to-right in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all id-bearing endpoints"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version equals the parent entity's current version on guarded writes (seat hold, team membership add)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /recitals/{id}/seats, POST /teams/{id}/memberships"

  - priority: 7
    category: business_referential
    check: "Cross-entity placement eligibility: Student.level ordinal >= ClassSection.required_level ordinal"
    error_id: ERR_LEVEL_TOO_LOW
    http_status: 422
    applies_to: "POST /enrollments, POST /enrollments/{id}/confirm"

  - priority: 8
    category: business_constraint
    check: "Age placement: section.min_age <= Student.age_as_of_cutoff <= section.max_age"
    error_id: ERR_AGE_OUT_OF_BAND
    http_status: 422
    applies_to: "POST /enrollments, POST /enrollments/{id}/confirm"

  - priority: 8.5
    category: business_constraint
    check: "Capacity guard on the EXPLICIT confirm endpoint: confirming a PENDING/WAITLISTED enrollment when section.enrolled_count == effective capacity (min(capacity_cap, Room.capacity)) is rejected. (The POST /enrollments auto-resolve path instead WAITLISTs; only POST /enrollments/{id}/confirm raises this.)"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /enrollments/{id}/confirm"

  - priority: 9
    category: business_temporal
    check: "Schedule conflict: a new ClassSession must not room-conflict (overlapping [start, end+turnover_buffer) windows in the same Room on the same day_of_week)"
    error_id: ERR_ROOM_CONFLICT
    http_status: 409
    applies_to: "POST /sections/{id}/sessions"

  - priority: 10
    category: business_temporal
    check: "Schedule conflict: a new ClassSession must not instructor-conflict (overlapping [start, end) windows for the same instructor on the same day_of_week, no buffer)"
    error_id: ERR_INSTRUCTOR_CONFLICT
    http_status: 409
    applies_to: "POST /sections/{id}/sessions"

  - priority: 11
    category: business_constraint
    check: "Instructor weekly-session cap: assigning a session would not push the instructor's total ClassSession count above max_weekly_sessions"
    error_id: ERR_INSTRUCTOR_OVERLOADED
    http_status: 422
    applies_to: "POST /sections/{id}/sessions"

  - priority: 12
    category: business_constraint
    check: "Roster cap: a team membership add must not push roster_count above CompetitionTeam.roster_cap, and Student.level ordinal >= team.min_level ordinal"
    error_id: ERR_ROSTER_FULL
    http_status: 422
    applies_to: "POST /teams/{id}/memberships"

  - priority: 13
    category: business_temporal
    check: "Makeup window: a makeup enrollment may only cite an Attendance with makeup_eligible == true (ABSENT_EXCUSED and not consumed) and an occurred_on within MAKEUP_WINDOW_DAYS prior to the makeup session date"
    error_id: ERR_MAKEUP_INELIGIBLE
    http_status: 422
    applies_to: "POST /enrollments with makeup_for_attendance_id"

  - priority: 14
    category: business_constraint
    check: "Seat allotment / sold-out: a HELD/PURCHASED hold cannot push seats_sold above total_seats; seat_label unique per recital among non-RELEASED seats"
    error_id: ERR_RECITAL_SOLD_OUT
    http_status: 409
    applies_to: "POST /recitals/{id}/seats"

  - priority: 15
    category: business_fiscal
    check: "Family delinquency gate: a Family with status == DELINQUENT cannot CONFIRM new enrollments or sign up for trips"
    error_id: ERR_FAMILY_DELINQUENT
    http_status: 402
    applies_to: "POST /enrollments (confirm path), POST /trips/{id}/participants"

  - priority: 16
    category: business_fiscal
    check: "Auto-pay precondition: enabling autopay requires payment_method_on_file == true; paying an invoice requires a payment method on file"
    error_id: ERR_NO_PAYMENT_METHOD
    http_status: 402
    applies_to: "PATCH /families/{id} (autopay_enabled=true), POST /invoices/{id}/pay"

  - priority: 17
    category: business_constraint
    check: "Costume order requires the linked Enrollment to be CONFIRMED/WAITLIST_PROMOTED in the costume's own section"
    error_id: ERR_NOT_ENROLLED_IN_SECTION
    http_status: 422
    applies_to: "POST /costume-orders"

  - priority: 18
    category: business_constraint
    check: "Trip confirm chaperone ratio: ceil(participant_count / chaperone_ratio) <= chaperone_count"
    error_id: ERR_INSUFFICIENT_CHAPERONES
    http_status: 422
    applies_to: "POST /trips/{id}/confirm"

  - priority: 19
    category: business_constraint
    check: "Invoice uniqueness: at most one non-VOID Invoice per (family_id, term_id, billing_month)"
    error_id: ERR_DUPLICATE_INVOICE
    http_status: 409
    applies_to: "POST /invoices/generate"

  - priority: 20
    category: business_constraint
    check: "Required body fields present and well-typed; enums in range; numeric bounds (end_minute>start_minute, max_age>=min_age, capacity>=1)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/update endpoints"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock to a given UTC instant. Server startup default is 2026-01-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock. Drives invoice due dates, costume rush window, recital completion."
    roles: [StudioAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "Logical clock advances; any OPEN invoice past its due day flips to PAST_DUE and its family to DELINQUENT (cascade)"

  # ---- Families ----
  - method: POST
    path: "/families"
    description: "Register a family/parent account."
    roles: [Anonymous, StudioAdmin]
    code: 201
    input: [email, family_name]
    output: Family
    side_effects: ["Family created ACTIVE; account_credit_cents=0; payment_method_on_file=false"]
  - method: GET
    path: "/families/{id}"
    description: "Fetch a family."
    roles: [StudioAdmin, Parent]
    code: 200
    input: []
    output: Family
    side_effects: []
  - method: GET
    path: "/families"
    description: "List families (paginated)."
    roles: [StudioAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Family[]
    side_effects: []
  - method: PATCH
    path: "/families/{id}"
    description: "Update family fields, including enabling auto-pay (requires payment method on file)."
    roles: [StudioAdmin, Parent]
    code: 200
    input: ["autopay_enabled?", "family_name?", "expected_family_version?"]
    output: Family
    side_effects: ["autopay toggled if payment_method_on_file true else ERR_NO_PAYMENT_METHOD"]
  - method: POST
