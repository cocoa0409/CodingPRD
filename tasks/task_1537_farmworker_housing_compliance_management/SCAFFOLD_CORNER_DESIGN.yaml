            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NO_CERTIFIED_UNIT with HTTP 409"

  # ===========================================================================
  - section: rbac
    instances:
      - name: sod_work_order_self_verify_rejected
        claim_type: segregation_of_duties
        grounds: ["validations[priority=6]", "errors[ERR_SEGREGATION_OF_DUTIES_VIOLATION]", entities.WorkOrder.fields.completed_by]
        distinguishing_aspect: "The verifier's X-User-ID must differ from completed_by even across role boundaries: the same person id wearing MaintenanceLead then SiteManager is rejected; a genuinely different SiteManager succeeds."
        test_recipe:
          setup: ["site + unit; work order walked to COMPLETED by MaintenanceLead with X-User-ID shared-1"]
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "S", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /work-orders", payload: { unit_id: "${u_id}", category: "OTHER", severity: "MINOR", description: "d" }, as: MaintenanceLead, captures: { wo: $.data.id } }
            - { call: "PUT /work-orders/${wo}", payload: { status: "TRIAGED" }, as: MaintenanceLead }
            - { call: "PUT /work-orders/${wo}", payload: { status: "ASSIGNED", assignee_name: "tech-1" }, as: MaintenanceLead }
            - { call: "PUT /work-orders/${wo}", payload: { status: "IN_PROGRESS" }, as: MaintenanceLead }
            - { call: "PUT /work-orders/${wo}", payload: { status: "COMPLETED" }, as: MaintenanceLead, as_user_id: "shared-1" }
          trigger:
            - { call: "PUT /work-orders/${wo}", payload: { status: "VERIFIED" }, as: SiteManager, as_user_id: "shared-1", captures: { err: $.data.error_id } }
            - { call: "PUT /work-orders/${wo}", payload: { status: "VERIFIED" }, as: SiteManager, as_user_id: "sm-9", captures: { ok: $.data.status } }
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES_VIOLATION with HTTP 403"
            - "ok == VERIFIED when a different SiteManager id verifies"

      - name: sod_inspection_self_cure_rejected
        claim_type: segregation_of_duties
        grounds: ["validations[priority=6]", "errors[ERR_SEGREGATION_OF_DUTIES_VIOLATION]", entities.RegulatoryInspection.fields.issued_by]
        distinguishing_aspect: "The cure certifier must differ from the findings issuer: ci-1 issues (zero-critical) findings and cannot certify the cure; ci-2 can."
        test_recipe:
          setup: ["site OPEN; unit CERTIFIED; inspection at FINDINGS_ISSUED with only a MINOR finding, issued by ci-1"]
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "S", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u_id}" }, as: ComplianceInspector, captures: { c_id: $.data.id } }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "S", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin }
            - { call: "POST /regulatory-inspections", payload: { site_id: "${site_id}", agency: "HUD", scheduled_date: "2026-08-15" }, as: ComplianceInspector, captures: { insp: $.data.id } }
            - { call: "PUT /regulatory-inspections/${insp}", payload: { status: "CONDUCTED" }, as: ComplianceInspector, as_user_id: "ci-1" }
            - { call: "PUT /regulatory-inspections/${insp}", payload: { status: "FINDINGS_ISSUED", findings: [ { unit_id: "${u_id}", severity: "MINOR", code: "SCR-01" } ] }, as: ComplianceInspector, as_user_id: "ci-1" }
          trigger:
            - { call: "PUT /regulatory-inspections/${insp}", payload: { status: "CURE_CERTIFIED" }, as: ComplianceInspector, as_user_id: "ci-1", captures: { err: $.data.error_id } }
            - { call: "PUT /regulatory-inspections/${insp}", payload: { status: "CURE_CERTIFIED" }, as: ComplianceInspector, as_user_id: "ci-2", captures: { ok: $.data.status, cert_by: $.data.cure_certified_by } }
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES_VIOLATION with HTTP 403 — the findings issuer cannot certify the cure"
            - "ok == CURE_CERTIFIED and cert_by == ci-2"

      - name: resident_files_complaint_and_notice_for_own_tenancy
        claim_type: role_allowed
        grounds: [roles.Resident, state_machines.Tenancy.ACTIVE_to_NOTICE]
        distinguishing_aspect: "Resident (X-User-ID = Household.id) can file a complaint and give NOTICE on their own tenancy; the notice records reason RESIDENT."
        test_recipe:
          setup: ["site OPEN; household H ELIGIBLE 1 member; tenancy ACTIVE"]
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "S", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u_id}" }, as: ComplianceInspector, captures: { c_id: $.data.id } }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "S", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin }
            - { call: "POST /households", payload: { head_of_household_name: "Fam RO", annual_family_income_cents: 6000000, ag_work_verified: true }, as: IntakeCoordinator, captures: { hh_id: $.data.id } }
            - { call: "PUT /households/${hh_id}", payload: { eligibility_status: "ELIGIBLE" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${hh_id}", full_name: "RO One", date_of_birth: "1990-01-01", relationship: "HEAD" }, as: IntakeCoordinator }
            - { call: "GET /housing-units/${u_id}", as: IntakeCoordinator, captures: { u_v: $.data.version } }
            - { call: "POST /tenancies", payload: { household_id: "${hh_id}", unit_id: "${u_id}", move_in_date: "2026-08-11", expected_unit_version: "${u_v}" }, as: IntakeCoordinator, captures: { t_id: $.data.id } }
            - { call: "PUT /tenancies/${t_id}", payload: { status: "ACTIVE" }, as: IntakeCoordinator }
          trigger:
            - { call: "POST /complaints", payload: { tenancy_id: "${t_id}", category: "UTILITY", description: "meter reading dispute" }, as: Resident, as_user_id: "${hh_id}", captures: { co_st: $.data.status } }
            - { call: "PUT /tenancies/${t_id}", payload: { status: "NOTICE" }, as: Resident, as_user_id: "${hh_id}", captures: { t_st: $.data.status, t_rsn: $.data.notice_reason } }
          assert:
            - "co_st == FILED — Resident filed against their own household's tenancy"
            - "t_st == NOTICE and t_rsn == RESIDENT"

      - name: resident_cannot_file_for_other_household
        claim_type: role_denied
        grounds: [roles.Resident, "validations[priority=2]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "A Resident whose X-User-ID matches household H1 gets 403 filing against a tenancy owned by household H2."
        test_recipe:
          setup: ["site OPEN; two certified units; H1 and H2 ELIGIBLE with 1 member each; T2 (H2) ACTIVE"]
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "S", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u1: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u1}" }, as: ComplianceInspector, captures: { c1: $.data.id } }
            - { call: "PUT /unit-certifications/${c1}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c1}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U2", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u2: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u2}" }, as: ComplianceInspector, captures: { c2: $.data.id } }
            - { call: "PUT /unit-certifications/${c2}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c2}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "S", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin }
            - { call: "POST /households", payload: { head_of_household_name: "Fam R1", annual_family_income_cents: 6000000, ag_work_verified: true }, as: IntakeCoordinator, captures: { h1: $.data.id } }
            - { call: "PUT /households/${h1}", payload: { eligibility_status: "ELIGIBLE" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${h1}", full_name: "R1", date_of_birth: "1990-01-01", relationship: "HEAD" }, as: IntakeCoordinator }
            - { call: "POST /households", payload: { head_of_household_name: "Fam R2", annual_family_income_cents: 6000000, ag_work_verified: true }, as: IntakeCoordinator, captures: { h2: $.data.id } }
            - { call: "PUT /households/${h2}", payload: { eligibility_status: "ELIGIBLE" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${h2}", full_name: "R2", date_of_birth: "1991-01-01", relationship: "HEAD" }, as: IntakeCoordinator }
            - { call: "GET /housing-units/${u2}", as: IntakeCoordinator, captures: { u2_v: $.data.version } }
            - { call: "POST /tenancies", payload: { household_id: "${h2}", unit_id: "${u2}", move_in_date: "2026-08-11", expected_unit_version: "${u2_v}" }, as: IntakeCoordinator, captures: { t2: $.data.id } }
            - { call: "PUT /tenancies/${t2}", payload: { status: "ACTIVE" }, as: IntakeCoordinator }
          trigger:
            - { call: "POST /complaints", payload: { tenancy_id: "${t2}", category: "OTHER", description: "not my home" }, as: Resident, as_user_id: "${h1}", captures: { err: $.data.error_id } }
            - { call: "PUT /tenancies/${t2}", payload: { status: "NOTICE" }, as: Resident, as_user_id: "${h1}", captures: { err2: $.data.error_id } }
          assert:
            - "err == ERR_INSUFFICIENT_PERMISSIONS with HTTP 403"
            - "err2 == ERR_INSUFFICIENT_PERMISSIONS — ownership binds to tenancy.household_id"

      - name: maintenance_lead_cannot_verify
        claim_type: role_denied
        grounds: [roles.SiteManager, "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "PUT /work-orders/{id} status=VERIFIED is a SiteManager transition; MaintenanceLead is rejected 403 even though the role may drive other transitions on the same endpoint."
        test_recipe:
          setup: ["site + unit; work order COMPLETED by ml-1"]
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "S", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /work-orders", payload: { unit_id: "${u_id}", category: "OTHER", severity: "MINOR", description: "d" }, as: MaintenanceLead, captures: { wo: $.data.id } }
            - { call: "PUT /work-orders/${wo}", payload: { status: "TRIAGED" }, as: MaintenanceLead }
            - { call: "PUT /work-orders/${wo}", payload: { status: "ASSIGNED", assignee_name: "t" }, as: MaintenanceLead }
            - { call: "PUT /work-orders/${wo}", payload: { status: "IN_PROGRESS" }, as: MaintenanceLead }
            - { call: "PUT /work-orders/${wo}", payload: { status: "COMPLETED" }, as: MaintenanceLead, as_user_id: "ml-1" }
          trigger:
            - { call: "PUT /work-orders/${wo}", payload: { status: "VERIFIED" }, as: MaintenanceLead, as_user_id: "ml-2", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INSUFFICIENT_PERMISSIONS with HTTP 403"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: cascade_condemnation_chain
        claim_type: cascading_side_effects
        grounds: [state_machines.RegulatoryInspection.CONDUCTED_to_FINDINGS_ISSUED]
        excluded_because:
          difficulty_instance: condemnation_cascade_depth3
          rationale: "The 3-link cascade (finding -> CONDEMNED -> forced NOTICE -> rehousing_priority) is asserted link-by-link in the named §1.8 instance."

      - name: cascade_hold_clear_chain
        claim_type: cascading_side_effects
        grounds: [state_machines.WorkOrder.COMPLETED_to_VERIFIED]
        excluded_because:
          difficulty_instance: work_order_verify_hold_clear_cascade
          rationale: "The VERIFIED -> score recompute -> hold clear -> posture recompute chain is asserted in the named §1.8 instance."

      - name: dual_variant_proration_layer
        claim_type: dual_variant_calculation
        grounds: [calculations.prorated_rent_charge]
        excluded_because:
          difficulty_instance: proration_calendar_vs_weekly_slot_divergence
          rationale: "Both variants and their selection by unit_type are asserted with literal cent values in the named §1.8 instance."

      - name: dual_variant_habitability_layer
        claim_type: dual_variant_calculation
        grounds: [calculations.habitability_risk_score]
        excluded_because:
          difficulty_instance: habitability_cumulative_vs_worst_case_divergence
          rationale: "Cumulative (enforcement) vs worst_case (preview) divergence on one open set is asserted in the named §1.8 instance."

      - name: threshold_boundaries_layer
        claim_type: rate_threshold_triggers
        grounds: [calculations.occupancy_headcount_check, calculations.complaint_sla]
        excluded_because:
          difficulty_instance: occupancy_boundary_exact_capacity
          rationale: "Threshold boundaries (occupancy == cap allowed; SLA exactly 72h compliant) are asserted in the named §1.8 instances occupancy_boundary_exact_capacity and complaint_sla_exactly_72h_compliant; subsidy tier boundaries are covered by subsidy_tier_boundary_030_inclusive / subsidy_tier_boundary_050_inclusive."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: envelope_and_immediate_consistency
        claim_type: immediate
        grounds: [response_envelope]
        distinguishing_aspect: "Writes are visible in the same response and in a follow-up GET (immediate consistency); the success envelope carries meta.api_request_id, response_type object/array, and list responses expose the four pagination fields."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "Env Site", state_code: "WA" }, as: OperatorAdmin, captures: { sid: $.data.id } }
          trigger:
            - { call: "GET /housing-sites/${sid}", as: SiteManager, captures: { nm: $.data.name, sc: $.data.state_code } }
            - { call: "GET /housing-sites", as: SiteManager }
          assert:
            - "create response: response_type == object; meta carries api_request_id and api_request_timestamp; data holds the created site"
            - "follow-up GET returns nm == 'Env Site' and sc == 'WA' in the same request sequence (no lag)"
            - "list response: response_type == array with limit, offset, total_count, has_more present"
            - "the error responses in this design carry data.error_id and data.message per the fixed envelope"
