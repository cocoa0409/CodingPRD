              captures: { err_window: $.data.error_id }
          assert:
            - "VendorInclusion.${inc_x_id}.appeal_window_closes_at == \"2026-10-01T00:00:00Z\""
            - "the filing returns 409 and err_window == ERR_APPEAL_WINDOW_CLOSED"
            - "VendorInclusion.${inc_x_id}.inclusion_status == EXCLUDED and appeal_count == 0"

      - name: sponsor_row_on_a_locked_agenda_returns_agenda_locked
        claim_type: Violation → Error
        grounds:
          - errors.ERR_AGENDA_LOCKED
          - state_machines.ConferenceEvent.AGENDA_LOCKED_to_PROGRAMMING
        distinguishing_aspect: "A sponsor row cannot reopen a locked agenda: the append is refused with 409 ERR_AGENDA_LOCKED while a research row would have reopened programming."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One event with one research session and a locked agenda."
          setup_api_calls:
            - *c_clock
            - *c_ven1
            - call: "POST /research/conference-events"
              payload: { event_name: "Symposium 2026", venue_region: "NA", start_utc: "2026-10-20T09:00:00Z", end_utc: "2026-10-22T17:00:00Z" }
              as: EventProgrammer
              captures: { ev_id: $.data.id }
            - call: "POST /research/conference-events/${ev_id}/sessions"
              payload: { session_title: "Opening research keynote", session_kind: "RESEARCH_SESSION", duration_minutes: 60 }
              as: EventProgrammer
            - call: "POST /research/conference-events/${ev_id}/lock-agenda"
              payload: {}
              as: EventProgrammer
          trigger:
            - call: "POST /research/conference-events/${ev_id}/sessions"
              payload: { session_title: "Late sponsor slot", session_kind: "SPONSOR_KEYNOTE", duration_minutes: 20, sponsor_vendor_id: "${ven1_id}" }
              as: EventProgrammer
              captures: { err_locked: $.data.error_id }
          assert:
            - "the append returns 409 and err_locked == ERR_AGENDA_LOCKED"
            - "ConferenceEvent.${ev_id}.status == AGENDA_LOCKED"
            - "ConferenceEvent.${ev_id}.sessions has exactly 1 row"

      - name: reprint_adjustment_beyond_authorized_copies_returns_reprint_copies_exceeded
        claim_type: Violation → Error
        grounds:
          - errors.ERR_REPRINT_COPIES_EXCEEDED
          - entities.VendorInclusion.fields.reprint_copies_authorized
        distinguishing_aspect: "The licence is a hard ceiling: consuming 900 copies against an 800-copy authorization is refused and copies_used stays at 0."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One analyst, one ACTIVE vendor, one DRAFT document and a STANDARD licence authorizing 800 copies."
          setup_api_calls:
            - *c_clock
            - *c_an1
            - *c_ven1
            - *c_doc
            - call: "POST /research/documents/${doc_id}/vendor-inclusions"
              payload: { vendor_id: "${ven1_id}", dimension_scores: [{ dimension: "PRODUCT_CAPABILITY", raw_score: 4.35, weight_pct: 0.30 }, { dimension: "MARKET_EXECUTION", raw_score: 3.80, weight_pct: 0.25 }, { dimension: "CUSTOMER_VOICE", raw_score: 4.10, weight_pct: 0.20 }, { dimension: "INNOVATION_ROADMAP", raw_score: 3.25, weight_pct: 0.15 }, { dimension: "PRICING_TRANSPARENCY", raw_score: 2.90, weight_pct: 0.10 }], inclusion_criteria_met_count: 5, expected_document_version: "${doc_v}", reprint_tier: "STANDARD", permitted_marketing_use: "SOCIAL_SNIPPET", reprint_copies_authorized: 800 }
              as: Analyst
              as_user_id: "${an1_id}"
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /research/vendor-inclusions/${inc_id}/reprint-copy-adjustments"
              payload: { delta_copies: 900, permitted_marketing_use: "SOCIAL_SNIPPET" }
              as: VendorRep
              as_user_id: "${ven1_id}"
              captures: { err_copies: $.data.error_id }
          assert:
            - "the adjustment returns 409 and err_copies == ERR_REPRINT_COPIES_EXCEEDED"
            - "VendorInclusion.${inc_id}.reprint_copies_used == 0"
            - "VendorInclusion.${inc_id}.reprint_fee_cents == 0 because permitted_marketing_use is NO_USE until the licence is exercised"
            - "VendorInclusion.${inc_id}.reprint_copies_authorized == 800"

