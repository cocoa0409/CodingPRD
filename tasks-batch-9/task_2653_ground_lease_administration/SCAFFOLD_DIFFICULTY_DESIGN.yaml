            - call: "POST /portfolio/leases/${lease_id}/leasehold-mortgages"
              payload: { mortgagee_legal_name: "Bayfront Mezzanine Partners", notice_email: "servicing@bayfront.example", original_principal_cents: 2000000, priority_rank: 2, cure_extension_days: 15 }
              as: LessorAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/loss-events"
