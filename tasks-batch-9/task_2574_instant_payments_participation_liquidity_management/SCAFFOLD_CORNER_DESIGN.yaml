      - name: credit_transfer_parallel_dimensions_combined_state
        claim_type: parallel
        grounds:
          - state_machines.CreditTransfer
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: credit_transfer_clearing_and_exception_dimensions_advance_independently
          rationale: "The independent advance of clearing_status and exception_status, and the reachability of the combined state (SETTLED, RETURN_DECLINED), are the whole subject of that §1.8 instance."

      - name: settlement_cascade_down_and_ledger_sync
        claim_type: Cascade down
        grounds:
          - state_machines.CreditTransfer.ACCEPTED_to_SETTLED
          - calculations.position_balance_and_availability
        excluded_because:
          difficulty_instance: settlement_cascade_five_hops_to_sibling_parking
          rationale: "That §1.8 instance asserts every hop of the settlement cascade end to end, including the ledger sync into current_balance_cents and the sibling parking."

      - name: return_honor_compensation_reverses_position_effect
        claim_type: Compensation
        grounds:
          - state_machines.CreditTransfer.RETURN_REQUESTED_to_RETURN_HONORED
          - calculations.throttled_release_waterfall
        excluded_because:
          difficulty_instance: return_honor_cascade_five_hops_to_queue_release
          rationale: "Compensation without drift - a new inbound transfer plus a RETURN_CREDIT entry rather than a rewind - is asserted hop by hop there, and the ledger identity is re-checked by ledger_identity_and_balance_round_trip_after_full_return."

      - name: rfp_negotiation_loop_terminates
        claim_type: cyclic
        grounds:
          - state_machines.RequestForPayment.AMENDMENT_REQUESTED_to_DELIVERED
          - validations[priority=96]
        excluded_because:
          difficulty_instance: rfp_amendment_cycle_returns_to_delivered_until_round_cap
          rationale: "The loop-back hop and its termination condition (MAX_AMENDMENT_ROUNDS) are exactly what that §1.8 instance drives and asserts."

      - name: participant_enrollment_revisits_certification
        claim_type: Valid Transition
        grounds:
          - state_machines.Participant.REMEDIATION_to_CERTIFICATION_TESTING
        excluded_because:
          difficulty_instance: participant_certification_remediation_revisit_cycle
          rationale: "The REMEDIATION -> CERTIFICATION_TESTING revisit, the certification_round increment and the subsequent activation are asserted there."

