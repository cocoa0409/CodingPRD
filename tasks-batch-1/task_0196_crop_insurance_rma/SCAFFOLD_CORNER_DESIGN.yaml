              as_user_id: "${adj_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 403"
            - "response error_id == ERR_FORBIDDEN"

      - name: rbac_missing_headers_returns_unauthenticated
        claim_type: Cannot perform other roles' exclusive ops
        grounds: [roles, "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role header -> ERR_UNAUTHENTICATED (401) before any authorization or existence check."
        test_recipe:
          setup: ["Empty DB; request sent with no auth headers"]
          setup_api_calls: []
          trigger:
            - call: "GET /policies/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 401"
            - "response error_id == ERR_UNAUTHENTICATED"

