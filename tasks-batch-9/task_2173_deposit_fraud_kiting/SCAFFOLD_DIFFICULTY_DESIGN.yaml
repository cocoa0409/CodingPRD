              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { fs_to1: "$.data.id", md_to1: "$.data.micro_deposit_cents" }
            - call: "POST /deposit-fraud/funding-sources/${fs_to1}/verification-attempts"
              payload: { micro_deposit_cents: "${md_to1}" }
              as: OperationsAdmin
              as_user_id: "ops-1"
            - call: "POST /deposit-fraud/accounts/${acct_to1}/deposit-items"
              payload: { item_type: "CHECK", amount_cents: 30000 }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { item_to1a: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_to1}/deposit-items"
