        distinguishing_aspect: "earnest_money_cents >= base_price_cents violates the field constraint -> ERR_VALIDATION (422) at agreement creation."
        test_recipe:
          setup: ["ACTIVE program; store S PROPOSED (format selected); developer DevCo"]
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
