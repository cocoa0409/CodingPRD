              as_user_id: "lc-1"
              captures: { place_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/storage-placements/${place_id}/store"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "lc-1"
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/pick"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "lc-1"
            - call: "POST /api/integration-programs/${prog_id}/transport-shipments"
              payload: { carrier_code: "FEDEX-DG", un_class_code: "UN3481", declared_weight_kg: 7.77 }
              as: LogisticsCoordinator
              as_user_id: "lc-1"
              captures: { ship_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/transport-shipments/${ship_id}/attach"
              payload: { battery_pack_id: "${pack_id}" }
              as: LogisticsCoordinator
