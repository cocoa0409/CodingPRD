      - call: POST /api/providers
        payload:
          cdi_program_id: ${prog}
          npi: N1
          full_name: D1
          specialty: S
        as: CDIManager
        captures:
          p1: $.data.id
      - call: POST /api/providers
        payload:
          cdi_program_id: ${prog}
          npi: N2
          full_name: D2
          specialty: S
        as: CDIManager
        captures:
          p2: $.data.id
      - call: POST /api/patient-cases
