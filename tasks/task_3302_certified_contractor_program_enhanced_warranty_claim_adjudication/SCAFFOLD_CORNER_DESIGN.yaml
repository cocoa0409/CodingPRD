  - section: calculations
    instances:
      - name: training_credit_expired_excluded_from_total_on_renew
        claim_type: input_set_filtering
        grounds: [calculations.training_credit_total, "errors[ERR_INSUFFICIENT_TRAINING_CREDITS]"]
        distinguishing_aspect: "A completion whose validity window has lapsed (completed_at + validity_months < evaluation date) is excluded from the credit total, so renewal fails with ERR_INSUFFICIENT_TRAINING_CREDITS."
        test_recipe:
          setup:
            - "BRONZE contractor, cert verified 2026-09-01 (valid_until 2028-09-01); single 4-credit course validity_months 12 completed 2026-09-01 (creditable only through 2027-09-01); clock at 2028-08-01"
