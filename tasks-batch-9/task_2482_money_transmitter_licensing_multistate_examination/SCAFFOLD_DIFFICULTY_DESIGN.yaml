# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2482 — Money Transmitter Licensing & Multistate Examination
# Nine §0.5 rule_ids, 19 instances. Every literal in an `assert:` line was
# computed by executing the §1.3 formula with its declared constants.
# The logical clock starts at 2026-08-01T00:00:00Z and only moves via
# POST /_clock/set_current_utc.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: coverage_variants_diverge_on_identical_holdings
        grounds:
          - calculations.permissible_investment_coverage
          - calculations.licensee_coverage_posture
          - entities.Licensee.fields.book_investment_value_cents
          - entities.Licensee.fields.eligible_investment_value_cents
          - entities.InvestmentHolding.fields.asset_class
        distinguishing_aspect: |
          Operates on the money domain (integer cents of investment value on Licensee): over one
          identical set of five holdings the BOOK_VALUE variant reads 90000000 and the
          ELIGIBLE_MARKET variant reads 76920000, because only the second applies per-class
          haircuts, drops the 9-day-old delegate receivable, and caps the DelegX receivable at
          10% of outstanding obligations.
        test_recipe:
          setup:
            - "Jurisdiction CA configured; licensee with one ACTIVE CA license."
            - "License carries 85000000 cents of outstanding transmission obligations."
            - "Five HELD holdings: CASH 40000000/40000000 (BankA), US_TREASURY 30000000/29000000 (CustodianB), RECEIVABLE_FROM_DELEGATE 12000000/12000000 age 4 (DelegX), RECEIVABLE_FROM_DELEGATE 8000000/8000000 age 9 (DelegY), CORPORATE_DEBT 15000000/15000000 (IssuerZ)."
            - "Clock left at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "CA", name: "California DFPI", min_net_worth_cents: 50000000, base_bond_cents: 5000000, per_delegate_bond_cents: 100000, bond_cap_cents: 40000000, response_window_days: 15, renewal_fee_cents: 500000, assessment_rate_bps: 25, call_report_frequency: "QUARTERLY", participates_in_multistate: true }
              as: PlatformAdmin
              captures: { ca_id: "$.data.id" }
            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC", ein: "74-1100001", reported_tangible_net_worth_cents: 500000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_id: "$.data.id" }
            - call: "POST /license-applications"
              payload: { licensee_id: "${lic_id}", jurisdiction_id: "${ca_id}", license_class: "MONEY_TRANSMISSION", projected_annual_volume_cents: 250000000, new_product_narrative: "Domestic P2P transfers." }
              as: LicensingManager
              captures: { app_ca_id: "$.data.id" }
            - call: "POST /license-applications/${app_ca_id}/submit"
              payload: {}
              as: LicensingManager
            - call: "POST /license-applications/${app_ca_id}/review-actions"
              payload: { action: "START_REVIEW" }
              as: StateRegulator
              as_user_id: "${ca_id}"
            - call: "POST /license-applications/${app_ca_id}/review-actions"
              payload: { action: "APPROVE" }
              as: StateRegulator
              as_user_id: "${ca_id}"
            - call: "GET /state-licenses?application_id=${app_ca_id}"
              as: LicensingManager
              captures: { lic_ca_id: "$.data[0].id" }
            - call: "POST /state-licenses/${lic_ca_id}/bond"
              payload: { amount_cents: 10000000, bond_issuer: "Atlas Surety", effective_date: "2026-08-01T00:00:00Z" }
              as: LicensingManager
            - call: "PATCH /state-licenses/${lic_ca_id}/obligations"
              payload: { delta_cents: 85000000, memo: "Q3 outstanding transmission liability" }
              as: LicensingManager
            - call: "POST /investment-holdings"
              payload: { licensee_id: "${lic_id}", asset_class: "CASH", counterparty_name: "BankA", book_value_cents: 40000000, market_value_cents: 40000000 }
              as: ComplianceOfficer
            - call: "POST /investment-holdings"
              payload: { licensee_id: "${lic_id}", asset_class: "US_TREASURY", counterparty_name: "CustodianB", book_value_cents: 30000000, market_value_cents: 29000000 }
              as: ComplianceOfficer
            - call: "POST /investment-holdings"
              payload: { licensee_id: "${lic_id}", asset_class: "RECEIVABLE_FROM_DELEGATE", counterparty_name: "DelegX", book_value_cents: 12000000, market_value_cents: 12000000, age_days: 4 }
              as: ComplianceOfficer
            - call: "POST /investment-holdings"
              payload: { licensee_id: "${lic_id}", asset_class: "RECEIVABLE_FROM_DELEGATE", counterparty_name: "DelegY", book_value_cents: 8000000, market_value_cents: 8000000, age_days: 9 }
              as: ComplianceOfficer
            - call: "POST /investment-holdings"
              payload: { licensee_id: "${lic_id}", asset_class: "CORPORATE_DEBT", counterparty_name: "IssuerZ", book_value_cents: 15000000, market_value_cents: 15000000 }
              as: ComplianceOfficer
          trigger:
            - call: "GET /licensees/${lic_id}/coverage-summary"
              as: ChiefComplianceOfficer
          assert:
            - "obligations_cents == 85000000"
            - "book_investment_value_cents == 90000000"
            - "book_coverage_ratio_bps == 10588"
            - "eligible_investment_value_cents == 76920000"
            - "coverage_ratio_bps == 9049"
            - "concentration_cap_cents == 8500000"
            - "coverage_posture == DEFICIENT (the ELIGIBLE_MARKET ratio 9049 is below COVERAGE_WATCH_FLOOR_BPS 9500, even though the BOOK_VALUE ratio 10588 clears the pass threshold)"
            - "eligible_investment_value_cents != book_investment_value_cents; the delta is exactly 13080000"

      - name: ownership_variants_diverge_on_holdco_chain
        grounds:
          - calculations.control_person_ownership_attribution
          - entities.ControlPerson.fields.effective_ownership_bps
          - entities.ControlPerson.fields.attributed_ownership_bps
          - entities.ControlPerson.fields.control_determination
          - entities.ControlPerson.fields.parent_control_person_id
        distinguishing_aspect: |
          Operates on the ownership domain (basis points on ControlPerson, a self-referential
          entity, not money on Licensee): the same 40%-of-a-60%-holdco link reads 2400 bps under
          MULTIPLICATIVE and 4000 bps under ATTRIBUTION, which flips control_determination from
          NON_CONTROL to CONTROL and makes a background check mandatory.
        test_recipe:
          setup:
            - "Licensee with no licenses yet (active_license_count 0, so no change-of-control approvals are required)."
            - "Root control person 'Northgate HoldCo', ENTITY_HOLDER, direct_ownership_bps 6000."
          setup_api_calls:
            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC", ein: "74-1100002", reported_tangible_net_worth_cents: 500000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_id: "$.data.id" }
            - call: "POST /control-persons"
              payload: { licensee_id: "${lic_id}", full_name: "Northgate HoldCo", role_title: "ENTITY_HOLDER", direct_ownership_bps: 6000 }
              as: LicensingManager
              captures: { cp_root_id: "$.data.id" }
          trigger:
            - call: "POST /control-persons"
              payload: { licensee_id: "${lic_id}", full_name: "Priya Raman", role_title: "ENTITY_HOLDER", direct_ownership_bps: 4000, parent_control_person_id: "${cp_root_id}" }
              as: LicensingManager
              captures: { cp_child_id: "$.data.id" }
          assert:
            - "ControlPerson.${cp_child_id}.effective_ownership_bps == 2400"
            - "ControlPerson.${cp_child_id}.attributed_ownership_bps == 4000"
            - "ControlPerson.${cp_child_id}.control_determination == CONTROL"
            - "ControlPerson.${cp_child_id}.background_check_status == PENDING"
            - "ControlPerson.${cp_child_id}.change_of_control_status == NOT_REQUIRED and required_approval_count == 0"
            - "ControlPerson.${cp_root_id}.effective_ownership_bps == 6000 and attributed_ownership_bps == 6000 (root link, both variants agree)"
            - "Licensee.${lic_id}.control_chain_status == PENDING_CHECKS"

  - rule_id: combinatorial_formula
    instances:
      - name: bond_requirement_composes_tier_floor_multiplier_and_cap
        grounds:
          - calculations.surety_bond_requirement
          - entities.LicenseApplication.fields.required_bond_cents
          - state_machines.LicenseApplication.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (a) — one output produced by composing four independent inputs in a pinned order:
          volume tier lookup (250000000 -> 10000000), statutory floor max against TX base
          30000000, PAYMENT_INSTRUMENTS class multiplier 12000 bps, then the 60000000 cap. The
          result 36000000 is unreachable by any single-input rule and differs from the naive
          tier x multiplier (12000000).
        test_recipe:
          setup:
            - "Jurisdiction TX: base_bond 30000000, per_delegate 250000, cap 60000000, min_net_worth 100000000."
            - "Licensee with 500000000 net worth, DRAFT PAYMENT_INSTRUMENTS application for TX with projected volume 250000000."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", name: "Texas DOB", min_net_worth_cents: 100000000, base_bond_cents: 30000000, per_delegate_bond_cents: 250000, bond_cap_cents: 60000000, response_window_days: 10, renewal_fee_cents: 750000, assessment_rate_bps: 40, call_report_frequency: "QUARTERLY", participates_in_multistate: true }
              as: PlatformAdmin
              captures: { tx_id: "$.data.id" }
            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC", ein: "74-1100003", reported_tangible_net_worth_cents: 500000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_id: "$.data.id" }
            - call: "POST /license-applications"
              payload: { licensee_id: "${lic_id}", jurisdiction_id: "${tx_id}", license_class: "PAYMENT_INSTRUMENTS", projected_annual_volume_cents: 250000000, new_product_narrative: "Money orders sold through retail agents." }
              as: LicensingManager
              captures: { app_tx_id: "$.data.id" }
          trigger:
            - call: "POST /license-applications/${app_tx_id}/submit"
              payload: {}
              as: LicensingManager
          assert:
            - "LicenseApplication.${app_tx_id}.required_bond_cents == 36000000"
            - "LicenseApplication.${app_tx_id}.required_bond_cents != 12000000 (tier x multiplier without the statutory floor)"
            - "LicenseApplication.${app_tx_id}.required_bond_cents != 30000000 (floor without the class multiplier)"
            - "LicenseApplication.${app_tx_id}.required_net_worth_cents == 100000000"
            - "LicenseApplication.${app_tx_id}.status == SUBMITTED"

      - name: assessment_invoice_rounds_each_line_before_summing
        grounds:
          - calculations.aggregate_assessment_invoice
          - entities.StateLicense.fields.outstanding_obligations_cents
          - entities.Jurisdiction.fields.assessment_rate_bps
        distinguishing_aspect: |
          Mode (b) — same inputs, different evaluation ORDER: rounding each ACTIVE license line to
          whole dollars before summing gives 25200 cents, while summing the exact 25120 cents and
          rounding once gives 25100. The endpoint exposes both the rounded total and the unrounded
          sum so the order is directly observable.
        test_recipe:
          setup:
            - "Jurisdictions CA (assessment_rate_bps 25) and TX (assessment_rate_bps 40)."
            - "One licensee holding an ACTIVE license in each state."
            - "CA license outstanding_obligations_cents 6024000; TX license 2515000."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "CA", name: "California DFPI", min_net_worth_cents: 50000000, base_bond_cents: 5000000, per_delegate_bond_cents: 100000, bond_cap_cents: 40000000, response_window_days: 15, renewal_fee_cents: 500000, assessment_rate_bps: 25, call_report_frequency: "QUARTERLY", participates_in_multistate: true }
              as: PlatformAdmin
              captures: { ca_id: "$.data.id" }
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", name: "Texas DOB", min_net_worth_cents: 100000000, base_bond_cents: 30000000, per_delegate_bond_cents: 250000, bond_cap_cents: 60000000, response_window_days: 10, renewal_fee_cents: 750000, assessment_rate_bps: 40, call_report_frequency: "QUARTERLY", participates_in_multistate: true }
              as: PlatformAdmin
              captures: { tx_id: "$.data.id" }
            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC", ein: "74-1100004", reported_tangible_net_worth_cents: 500000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_id: "$.data.id" }
            - call: "POST /license-applications"
              payload: { licensee_id: "${lic_id}", jurisdiction_id: "${ca_id}", license_class: "MONEY_TRANSMISSION", projected_annual_volume_cents: 90000000, new_product_narrative: "Domestic P2P transfers." }
              as: LicensingManager
              captures: { app_ca_id: "$.data.id" }
            - call: "POST /license-applications/${app_ca_id}/submit"
              payload: {}
              as: LicensingManager
            - call: "POST /license-applications/${app_ca_id}/review-actions"
              payload: { action: "START_REVIEW" }
              as: StateRegulator
              as_user_id: "${ca_id}"
            - call: "POST /license-applications/${app_ca_id}/review-actions"
              payload: { action: "APPROVE" }
              as: StateRegulator
              as_user_id: "${ca_id}"
            - call: "GET /state-licenses?application_id=${app_ca_id}"
              as: LicensingManager
              captures: { lic_ca_id: "$.data[0].id" }
            - call: "POST /state-licenses/${lic_ca_id}/bond"
              payload: { amount_cents: 5000000, bond_issuer: "Atlas Surety", effective_date: "2026-08-01T00:00:00Z" }
              as: LicensingManager
            - call: "POST /license-applications"
              payload: { licensee_id: "${lic_id}", jurisdiction_id: "${tx_id}", license_class: "MONEY_TRANSMISSION", projected_annual_volume_cents: 90000000, new_product_narrative: "Domestic P2P transfers." }
              as: LicensingManager
              captures: { app_tx_id: "$.data.id" }
            - call: "POST /license-applications/${app_tx_id}/submit"
              payload: {}
              as: LicensingManager
            - call: "POST /license-applications/${app_tx_id}/review-actions"
              payload: { action: "START_REVIEW" }
              as: StateRegulator
              as_user_id: "${tx_id}"
            - call: "POST /license-applications/${app_tx_id}/review-actions"
              payload: { action: "APPROVE" }
              as: StateRegulator
              as_user_id: "${tx_id}"
            - call: "GET /state-licenses?application_id=${app_tx_id}"
              as: LicensingManager
              captures: { lic_tx_id: "$.data[0].id" }
            - call: "POST /state-licenses/${lic_tx_id}/bond"
              payload: { amount_cents: 30000000, bond_issuer: "Atlas Surety", effective_date: "2026-08-01T00:00:00Z" }
              as: LicensingManager
            - call: "PATCH /state-licenses/${lic_ca_id}/obligations"
              payload: { delta_cents: 6024000, memo: "CA outstanding liability" }
              as: LicensingManager
            - call: "PATCH /state-licenses/${lic_tx_id}/obligations"
              payload: { delta_cents: 2515000, memo: "TX outstanding liability" }
              as: LicensingManager
          trigger:
            - call: "GET /licensees/${lic_id}/assessment-summary"
              as: LicensingManager
          assert:
            - "line_item_count == 2"
            - "unrounded_sum_cents == 25120"
            - "annual_assessment_total_cents == 25200"
            - "annual_assessment_total_cents != 25100 (the sum-then-round answer)"

      - name: renewal_fee_tier_keys_off_pre_assessment_subtotal
        grounds:
          - calculations.renewal_fee_assessment
          - entities.StateLicense.fields.renewal_total_fee_cents
          - entities.StateLicense.fields.renewal_status
          - validations[priority=113]
        distinguishing_aspect: |
          Mode (c) — an apparently circular dependency resolved by a pinned evaluation order: the
          350 bps tier is selected from the 245000 pre-assessment subtotal, producing 253575,
          whereas selecting the tier from the resulting total (253575 > 250000 -> 200 bps) would
          produce 250072. Neither multi-input composition (mode a) nor rounding order (mode b)
          explains this value.
        test_recipe:
          setup:
            - "Jurisdiction NV: renewal_fee_cents 245000, min_net_worth 10000000, ANNUAL calendar."
            - "Licensee with an ACTIVE NV license, zero active delegate authorizations, reporting_status CURRENT."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "NV", name: "Nevada FID", min_net_worth_cents: 10000000, base_bond_cents: 1000000, per_delegate_bond_cents: 50000, bond_cap_cents: 20000000, response_window_days: 30, renewal_fee_cents: 245000, assessment_rate_bps: 10, call_report_frequency: "ANNUAL", participates_in_multistate: false }
              as: PlatformAdmin
              captures: { nv_id: "$.data.id" }
            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC", ein: "74-1100005", reported_tangible_net_worth_cents: 500000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_id: "$.data.id" }
            - call: "POST /license-applications"
              payload: { licensee_id: "${lic_id}", jurisdiction_id: "${nv_id}", license_class: "MONEY_TRANSMISSION", projected_annual_volume_cents: 90000000, new_product_narrative: "Domestic P2P transfers." }
              as: LicensingManager
              captures: { app_nv_id: "$.data.id" }
            - call: "POST /license-applications/${app_nv_id}/submit"
              payload: {}
              as: LicensingManager
            - call: "POST /license-applications/${app_nv_id}/review-actions"
              payload: { action: "START_REVIEW" }
              as: StateRegulator
              as_user_id: "${nv_id}"
            - call: "POST /license-applications/${app_nv_id}/review-actions"
              payload: { action: "APPROVE" }
              as: StateRegulator
              as_user_id: "${nv_id}"
            - call: "GET /state-licenses?application_id=${app_nv_id}"
              as: LicensingManager
              captures: { lic_nv_id: "$.data[0].id" }
            - call: "POST /state-licenses/${lic_nv_id}/bond"
              payload: { amount_cents: 2500000, bond_issuer: "Atlas Surety", effective_date: "2026-08-01T00:00:00Z" }
              as: LicensingManager
          trigger:
            - call: "POST /state-licenses/${lic_nv_id}/renewals"
              payload: { renewal_year: 2027, payment_amount_cents: 253575 }
              as: LicensingManager
          assert:
            - "StateLicense.${lic_nv_id}.renewal_total_fee_cents == 253575"
            - "StateLicense.${lic_nv_id}.renewal_total_fee_cents != 250072 (tier chosen from the post-assessment total)"
            - "StateLicense.${lic_nv_id}.renewal_status == RENEWED and renewal_year == 2027"
            - "StateLicense.${lic_nv_id}.license_status == ACTIVE (renewal does not touch the authorisation dimension)"

  - rule_id: non_linear_state_machine
    instances:
      - name: application_deficiency_loop_auto_denies_on_fourth_round
        grounds:
          - state_machines.LicenseApplication.UNDER_REVIEW_to_DEFICIENT
          - state_machines.LicenseApplication.DEFICIENT_to_UNDER_REVIEW
          - state_machines.LicenseApplication.UNDER_REVIEW_to_DENIED
          - entities.LicenseApplication.fields.deficiency_round_count
          - entities.LicenseApplication.fields.denial_reason
        distinguishing_aspect: |
          A true cycle: UNDER_REVIEW -> DEFICIENT -> UNDER_REVIEW is traversed three times, and the
          identical ISSUE_DEFICIENCY trigger produces a DIFFERENT target state the fourth time
          (DENIED with denial_reason EXCESSIVE_DEFICIENCY_ROUNDS) because deficiency_round_count is a
          loop counter that survives every resubmission.
        test_recipe:
          setup:
            - "Jurisdiction CA; licensee with 500000000 net worth."
            - "Application submitted and moved to UNDER_REVIEW; clock left at 2026-08-01T00:00:00Z so every 30-day deficiency deadline is open."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "CA", name: "California DFPI", min_net_worth_cents: 50000000, base_bond_cents: 5000000, per_delegate_bond_cents: 100000, bond_cap_cents: 40000000, response_window_days: 15, renewal_fee_cents: 500000, assessment_rate_bps: 25, call_report_frequency: "QUARTERLY", participates_in_multistate: true }
              as: PlatformAdmin
              captures: { ca_id: "$.data.id" }
            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC", ein: "74-1100006", reported_tangible_net_worth_cents: 500000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_id: "$.data.id" }
            - call: "POST /license-applications"
              payload: { licensee_id: "${lic_id}", jurisdiction_id: "${ca_id}", license_class: "MONEY_TRANSMISSION", projected_annual_volume_cents: 250000000, new_product_narrative: "Domestic P2P transfers." }
              as: LicensingManager
              captures: { app_id: "$.data.id" }
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensingManager
            - call: "POST /license-applications/${app_id}/review-actions"
              payload: { action: "START_REVIEW" }
              as: StateRegulator
              as_user_id: "${ca_id}"
            - call: "POST /license-applications/${app_id}/review-actions"
              payload: { action: "ISSUE_DEFICIENCY", note: "Round 1: net worth statement unsigned." }
              as: StateRegulator
              as_user_id: "${ca_id}"
            - call: "POST /license-applications/${app_id}/resubmit"
              payload: { projected_annual_volume_cents: 250000000, remediation_note: "Signed statement attached." }
              as: LicensingManager
            - call: "POST /license-applications/${app_id}/review-actions"
              payload: { action: "ISSUE_DEFICIENCY", note: "Round 2: delegate list incomplete." }
              as: StateRegulator
              as_user_id: "${ca_id}"
            - call: "POST /license-applications/${app_id}/resubmit"
              payload: { projected_annual_volume_cents: 250000000, remediation_note: "Delegate list attached." }
              as: LicensingManager
            - call: "POST /license-applications/${app_id}/review-actions"
              payload: { action: "ISSUE_DEFICIENCY", note: "Round 3: AML program stale." }
              as: StateRegulator
              as_user_id: "${ca_id}"
            - call: "POST /license-applications/${app_id}/resubmit"
              payload: { projected_annual_volume_cents: 250000000, remediation_note: "AML program refreshed." }
              as: LicensingManager
          trigger:
            - call: "POST /license-applications/${app_id}/review-actions"
              payload: { action: "ISSUE_DEFICIENCY", note: "Round 4: still non-responsive." }
              as: StateRegulator
              as_user_id: "${ca_id}"
          assert:
            - "LicenseApplication.${app_id}.status == DENIED (not DEFICIENT — the same trigger changed target state on the fourth round)"
            - "LicenseApplication.${app_id}.deficiency_round_count == 4"
            - "LicenseApplication.${app_id}.denial_reason == EXCESSIVE_DEFICIENCY_ROUNDS"
            - "LicenseApplication.${app_id}.deficiency_deadline_at is null (no further resubmission window was armed)"
            - "GET /state-licenses?application_id=${app_id} returns an empty list (no license was minted)"

      - name: license_authorisation_and_reporting_dimensions_advance_independently
        grounds:
          - state_machines.StateLicense.license_status.ACTIVE_to_SUSPENDED
          - state_machines.StateLicense.reporting_status.CURRENT_to_DELINQUENT
          - state_machines.StateLicense.reporting_status.DELINQUENT_to_CURRENT
          - entities.StateLicense.fields.reporting_status
          - calculations.call_report_period_and_due_at
        distinguishing_aspect: |
          Two independent state dimensions on one entity: a late 2026Q1 call report moves
          reporting_status CURRENT -> DELINQUENT while license_status stays ACTIVE, a bond
          cancellation notice then moves license_status ACTIVE -> SUSPENDED while reporting_status
          stays DELINQUENT, and a timely 2026Q2 filing restores reporting_status to CURRENT while
          license_status remains SUSPENDED. Neither dimension can be derived from the other.
        test_recipe:
          setup:
            - "Jurisdiction CA (QUARTERLY); licensee with one ACTIVE CA license, no delegates."
            - "Clock at the 2026-08-01T00:00:00Z default: the 2026Q1 due date 2026-05-15 is in the past and the 2026Q2 due date 2026-08-14 is in the future."
          setup_api_calls:
            - call: "POST /jurisdictions"
