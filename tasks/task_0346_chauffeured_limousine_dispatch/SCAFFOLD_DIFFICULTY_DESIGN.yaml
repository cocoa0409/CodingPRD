          - errors[ERR_CHAUFFEUR_DOUBLE_BOOKED]
        distinguishing_aspect: "Chauffeur interval semantics = one-sided REST buffer after each window end: first trip [12:00,13:00), rest 20; a second trip pickup 13:19 (< 13:00+20=13:20) collides -> ERR_CHAUFFEUR_DOUBLE_BOOKED, whereas pickup at 13:20 exactly would be allowed."
