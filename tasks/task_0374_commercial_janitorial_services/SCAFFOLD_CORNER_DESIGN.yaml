  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: estimate_labor_callback_factor_applied
        claim_type: Constants Applied
        grounds:
          - calculations.estimate_labor_minutes
          - entities.Visit.fields.estimated_labor_min
          - entities.Visit.fields.visit_kind
        distinguishing_aspect: "CALLBACK estimate = ceil(base_min * CALLBACK_FACTOR) with base_min=ceil(8000/50)=160 → ceil(160*0.40)=64, distinct from the ROUTINE/PERIODIC branches."
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site (cleanable_sqft=8000, contact_user_id=cc-1), AVAILABLE crew, ACTIVE contract, OPEN period 2026-06."
            - "A MAJOR complaint acknowledged then callback-scheduled, producing a CALLBACK Visit."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /crew"
              payload: { full_name: "Pat Crew" }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
            - call: "POST /complaints"
              payload: { site_id: "${site_id}", severity: "MAJOR", description: "Spill" }
              as: ClientContact
              as_user_id: "cc-1"
              captures: { complaint_id: $.data.id }
            - call: "POST /complaints/${complaint_id}/acknowledge"
              payload: {}
              as: FieldSupervisor
            - call: "POST /complaints/${complaint_id}/schedule-callback"
              payload: { crew_id: "${crew_id}", service_date: "2026-06-18", planned_start_min: 600, planned_end_min: 660 }
              as: FieldSupervisor
              captures: { cb_visit_id: $.data.callback_visit_id }
          trigger:
            - call: "GET /visits/${cb_visit_id}"
              payload: {}
              as: FieldSupervisor
              captures: { est: $.data.estimated_labor_min, kind: $.data.visit_kind }
          assert:
            - "HTTP status == 200"
            - "Visit.${cb_visit_id}.visit_kind == CALLBACK"
            - "Visit.${cb_visit_id}.estimated_labor_min == 64 (ceil(ceil(8000/50)*0.40) = ceil(160*0.40))"

      - name: estimate_labor_routine_sqft_ceil
        claim_type: Correct Result
        grounds:
          - calculations.estimate_labor_minutes
          - entities.Visit.fields.estimated_labor_min
        distinguishing_aspect: "ROUTINE estimate = ceil(cleanable_sqft / SQFT_PER_MIN); sqft=8005 → ceil(8005/50)=161 (ceil exercised, not floor/round)."
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site (cleanable_sqft=8005), AVAILABLE crew."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8005, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /crew"
              payload: { full_name: "Pat Crew" }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { site_id: "${site_id}", crew_id: "${crew_id}", service_date: "2026-06-16", planned_start_min: 540, planned_end_min: 700, visit_kind: "ROUTINE" }
              as: FieldSupervisor
              captures: { est: $.data.estimated_labor_min }
          assert:
            - "HTTP status == 201"
            - "Visit.estimated_labor_min == 161 (ceil(8005/50))"

