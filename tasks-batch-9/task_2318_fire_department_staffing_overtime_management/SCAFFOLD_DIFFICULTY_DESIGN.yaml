              as: StaffingOfficer
          assert:
            - "HOP 1: DutyShift.${sh48}.closed_apparatus_ids contains ${haz48} and does not contain ${eng48}; required_staffing == 4"
            - "HOP 2: Vacancy.${vac48haz}.status == \"CLOSED_BY_COMPANY_CLOSURE\""
            - "HOP 3: OvertimeOffer.${off48}.status == \"RESCINDED\" and projected_cost_cents == 164736"
            - "HOP 4: Station.${st48}.ot_committed_cents == 0 and Station.${st48}.budget_posture == \"WITHIN\""
            - "HOP 4: Firefighter.${ff48a}.pending_offer_count == 0, voluntary_ot_hours_charged == 0 and ot_pass_count == 0 — a department-side rescission charges the member nothing"
            - "DutyShift.${sh48}.open_vacancy_count == 4, staffing_gap == 4, certification_gap_count == 1, leave_floor_headcount == 2, staffing_posture == \"CRITICAL\", status == \"HIRING\""
