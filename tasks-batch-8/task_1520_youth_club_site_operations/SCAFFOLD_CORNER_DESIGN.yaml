            - { call: "POST /staff/${d1}/credentials", payload: { kind: "TRAINING", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /staff"
              payload: { site_id: "${site_id}", full_name: "Dir Two", position: "DIRECTOR" }
              as: PlatformAdmin
              captures: { d2: $.data.id }
            - { call: "POST /staff/${d2}/credentials", payload: { kind: "BACKGROUND_CHECK", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /staff/${d2}/credentials", payload: { kind: "TRAINING", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Kid A", date_of_birth: "2012-01-01", grade: 7, household_size: 1, household_income_cents: 1000000 }
              as: SiteDirector
              as_user_id: "${d1}"
              captures: { m1: $.data.id }
            - { call: "POST /members/${m1}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${d1}" }
            - call: "POST /behavior-incidents"
              payload: { member_id: "${m1}", incident_date: "2026-08-03", category: "LEVEL_2" }
              as: SiteDirector
              as_user_id: "${d1}"
              captures: { inc: $.data.id }
            - { call: "POST /behavior-incidents/${inc}/adjudicate", payload: { outcome: "SUSTAINED", suspension_days: 2, suspension_start_date: "2026-08-03" }, as: SiteDirector, as_user_id: "${d1}" }
            - { call: "POST /behavior-incidents/${inc}/appeal", payload: {}, as: SiteDirector, as_user_id: "${d1}" }
          trigger:
            - call: "POST /behavior-incidents/${inc}/resolve-appeal"
              payload: { decision: "UPHELD" }
              as: SiteDirector
