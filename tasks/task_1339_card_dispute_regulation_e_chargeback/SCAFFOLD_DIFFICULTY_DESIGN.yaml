              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "Cross B", initial_balance_cents: 100000 }
              as: BankAdmin
              captures: { xbacct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${xbacct}", merchant_name: "XB", amount_cents: 20000, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { xbtx: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${xbtx}", error_type: "INCORRECT_AMOUNT", claim_amount_cents: 20000, claimed_report_delay_days: 5 }
              as: Cardholder
              as_user_id: "${xbacct}"
              captures: { xbcase: $.data.id }
            - call: "POST /disputes/${xbcase}/classify"
              payload: { is_fraud_claim: false, verified_report_delay_days: 5 }
              as: DisputeInvestigator
            - call: "POST /disputes/${xbcase}/grant-provisional-credit"
              payload: {}
              as: IntakeAgent
              captures: { xbpc: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T10:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes/${xbcase}/resolve"
              payload: { outcome: "NO_ERROR" }
              as: DisputeInvestigator
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T09:00:00Z" }
              as: BankAdmin
            - call: "POST /provisional-credits/${xbpc}/reverse"
              payload: {}
              as: FinanceOfficer
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-26T09:00:00Z" }
              as: BankAdmin
            - call: "POST /provisional-credits/${xbpc}/reverse"
              payload: {}
              as: FinanceOfficer
              captures: { st: $.data.status }
          assert:
            - "err == ERR_REVERSAL_NOTICE_PENDING at 2 business days (2026-08-25)"
            - "st == REVERSED at exactly 3 business days (2026-08-26)"

  # ==========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: duplicate_dispute_point_occupancy
        grounds:
          - validations[priority=6]
          - errors[ERR_DUPLICATE_ACTIVE_DISPUTE]
          - state_machines.CardTransaction.POSTED_to_DISPUTED
        distinguishing_aspect: |
          Point-occupancy semantics: a non-terminal DisputeCase occupies its
          CardTransaction resource outright — any second intake on the same
          transaction is rejected regardless of dates; no adjacency concept.
        test_recipe:
          setup:
            - "Old account; VISA ECOMMERCE txn 8000 posted 2026-07-01; dispute received 2026-08-03 (transaction DISPUTED, case non-terminal)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "Overlap A", initial_balance_cents: 50000 }
              as: BankAdmin
              captures: { oaacct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${oaacct}", merchant_name: "OA", amount_cents: 8000, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { oatx: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${oatx}", error_type: "INCORRECT_AMOUNT", claim_amount_cents: 8000, claimed_report_delay_days: 5 }
              as: Cardholder
              as_user_id: "${oaacct}"
          trigger:
            - call: "POST /disputes"
              payload: { card_transaction_id: "${oatx}", error_type: "DUPLICATE_CHARGE", claim_amount_cents: 4000, claimed_report_delay_days: 5 }
              as: Cardholder
              as_user_id: "${oaacct}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_ACTIVE_DISPUTE (transaction occupied by a non-terminal case)"
      - name: chargeback_refile_blocked_within_response_window
        grounds:
          - validations[priority=10]
          - errors[ERR_NETWORK_WINDOW_ACTIVE]
          - entities.Chargeback.fields.response_window_end_at
        distinguishing_aspect: |
          Half-open interval semantics on a different occupying entity
          (Chargeback, not DisputeCase): the window [filed_at, filed_at+30d) keeps
          the transaction occupied even after CANCELLED — refile at 2026-08-20
          (inside) is rejected, refile at 2026-09-05 (past the 2026-09-04
          inclusive end) succeeds; adjacency beyond the boundary is permitted.
        test_recipe:
          setup:
            - "Old account; VISA ECOMMERCE txn 15000 posted 2026-07-01; non-fraud dispute classified; chargeback FILED 2026-08-05 then withdrawn (CANCELLED) on 2026-08-10; case back to CLASSIFIED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "Overlap B", initial_balance_cents: 50000 }
              as: BankAdmin
              captures: { obacct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${obacct}", merchant_name: "OB", amount_cents: 15000, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { obtx: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${obtx}", error_type: "SERVICE_NOT_RECEIVED", claim_amount_cents: 15000, claimed_report_delay_days: 10 }
              as: Cardholder
              as_user_id: "${obacct}"
              captures: { obcase: $.data.id }
            - call: "POST /disputes/${obcase}/classify"
              payload: { is_fraud_claim: false, verified_report_delay_days: 10 }
              as: DisputeInvestigator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BankAdmin
            - call: "POST /chargebacks"
              payload: { dispute_case_id: "${obcase}", reason_code: "V13_1" }
              as: ChargebackAnalyst
              captures: { obcb: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BankAdmin
            - call: "POST /chargebacks/${obcb}/withdraw"
              payload: {}
              as: ChargebackAnalyst
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T09:00:00Z" }
              as: BankAdmin
            - call: "POST /chargebacks"
              payload: { dispute_case_id: "${obcase}", reason_code: "V13_1" }
              as: ChargebackAnalyst
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T09:00:00Z" }
              as: BankAdmin
            - call: "POST /chargebacks"
              payload: { dispute_case_id: "${obcase}", reason_code: "V13_1" }
              as: ChargebackAnalyst
              captures: { st2: $.data.status }
          assert:
            - "err == ERR_NETWORK_WINDOW_ACTIVE (2026-08-20 inside [2026-08-05, 2026-09-04])"
            - "st2 == FILED (2026-09-05 is past the half-open window's inclusive end)"

  # ==========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: grant_reverse_balance_conservation
        grounds:
          - calculations.provisional_credit_amount
          - entities.CardAccount.fields.balance_cents
          - entities.CardAccount.fields.provisional_outstanding_cents
          - state_machines.ProvisionalCredit.GRANTED_to_REVERSED
        distinguishing_aspect: |
          Conserved quantity = CardAccount.balance_cents: the forward action
          (grant +15000) paired with its compensating action (reverse -15000)
          leaves balance_cents and provisional_outstanding_cents exactly at
          their pre-grant values (100000 / 0).
        test_recipe:
          setup:
            - "Old account balance 100000; VISA POS_PIN txn 20000 posted 2026-07-01; fraud dispute received 2026-08-03, classified (holdback 5000); credit 15000 granted"
            - "Resolved NO_ERROR 2026-08-21; clock at 2026-08-26"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "Invariant A", initial_balance_cents: 100000 }
              as: BankAdmin
              captures: { iaacct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${iaacct}", merchant_name: "IA", amount_cents: 20000, transaction_type: "POS_PIN", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { iatx: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${iatx}", error_type: "UNAUTHORIZED", claim_amount_cents: 20000, claimed_report_delay_days: 1 }
              as: Cardholder
              as_user_id: "${iaacct}"
              captures: { iacase: $.data.id }
            - call: "POST /disputes/${iacase}/classify"
              payload: { is_fraud_claim: true, verified_report_delay_days: 1 }
              as: DisputeInvestigator
            - call: "POST /disputes/${iacase}/grant-provisional-credit"
              payload: {}
              as: IntakeAgent
              captures: { iapc: $.data.id }
            - call: "GET /card-accounts/${iaacct}"
              payload: {}
              as: FinanceOfficer
              captures: { bal_mid: $.data.balance_cents, out_mid: $.data.provisional_outstanding_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T10:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes/${iacase}/resolve"
              payload: { outcome: "NO_ERROR" }
              as: DisputeInvestigator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-26T09:00:00Z" }
              as: BankAdmin
          trigger:
            - call: "POST /provisional-credits/${iapc}/reverse"
              payload: {}
              as: FinanceOfficer
            - call: "GET /card-accounts/${iaacct}"
              payload: {}
              as: FinanceOfficer
              captures: { bal_end: $.data.balance_cents, out_end: $.data.provisional_outstanding_cents }
          assert:
            - "bal_mid == 115000 and out_mid == 15000 (forward action applied)"
            - "bal_end == 100000 and out_end == 0 (compensating action restored the conserved quantities exactly)"
      - name: loss_recovery_outstanding_conservation
        grounds:
          - calculations.recovery_waterfall
          - entities.DisputeCase.fields.outstanding_loss_cents
          - errors[ERR_LOSS_EXCEEDS_OUTSTANDING]
        distinguishing_aspect: |
          Conserved quantity = outstanding_loss_cents (different quantity than
          balance_cents): a manual LOSS_RECOGNIZED (+5000) paired with a
          compensating RECOVERY_RECEIVED (-5000) returns outstanding_loss_cents
          to its prior value; recovery equal to outstanding is permitted while
          outstanding + 1 is rejected.
        test_recipe:
          setup:
            - "Old account; VISA ECOMMERCE txn 12000 posted 2026-07-01; non-fraud dispute classified, NO credit; chargeback filed 2026-08-05, representment ACCEPTED -> case RESOLVED_MERCHANT_FAVOR with auto LOSS 2500 (outstanding 2500)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "Invariant B", initial_balance_cents: 50000 }
              as: BankAdmin
              captures: { ibacct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${ibacct}", merchant_name: "IB", amount_cents: 12000, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { ibtx: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${ibtx}", error_type: "SERVICE_NOT_RECEIVED", claim_amount_cents: 12000, claimed_report_delay_days: 10 }
              as: Cardholder
              as_user_id: "${ibacct}"
              captures: { ibcase: $.data.id }
            - call: "POST /disputes/${ibcase}/classify"
              payload: { is_fraud_claim: false, verified_report_delay_days: 10 }
              as: DisputeInvestigator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BankAdmin
            - call: "POST /chargebacks"
              payload: { dispute_case_id: "${ibcase}", reason_code: "V13_1" }
              as: ChargebackAnalyst
              captures: { ibcb: $.data.id }
            - call: "POST /chargebacks/${ibcb}/representments"
              payload: { merchant_ref: "MR-I", evidence_documents: [{ doc_type: "RECEIPT", reference: "i-1" }] }
              as: ChargebackAnalyst
            - call: "POST /chargebacks/${ibcb}/review-representment"
              payload: { decision: "ACCEPT" }
              as: ChargebackAnalyst
          trigger:
            - call: "POST /disputes/${ibcase}/loss-recoveries"
              payload: { type: "LOSS_RECOGNIZED", amount_cents: 5000, memo: "fee true-up" }
              as: FinanceOfficer
            - call: "POST /disputes/${ibcase}/loss-recoveries"
              payload: { type: "RECOVERY_RECEIVED", amount_cents: 7500, memo: "merchant repayment" }
              as: FinanceOfficer
            - call: "GET /disputes/${ibcase}"
              payload: {}
              as: FinanceOfficer
              captures: { out_end: $.data.outstanding_loss_cents }
            - call: "POST /disputes/${ibcase}/loss-recoveries"
              payload: { type: "RECOVERY_RECEIVED", amount_cents: 1 }
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "out_end == 0 (2500 auto + 5000 manual loss, then 7500 recovery: equal-to-outstanding permitted)"
            - "err == ERR_LOSS_EXCEEDS_OUTSTANDING (1 cent beyond outstanding rejected)"
