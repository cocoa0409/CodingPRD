      - name: round_one_cutoff_exactly_600
        grounds:
          - calculations.round_advancement_gate
          - calculations.nominee_round_score
        distinguishing_aspect: |
          Metric = round score, exercised through POST /api/nominees/{id}/decision
          (a different metric and endpoint from the seat-count boundary):
          round_1_score == 600 (exactly ROUND_1_CUTOFF) advances, while
          round_1_score == 599 fails with ERR_CUTOFF_NOT_MET — one point of
          average score flips the outcome.
        test_recipe:
          setup:
            - "Nominee A in ROUND_1 with evaluations (60,60,60)+(60,60,60) -> round_1_score 600"
            - "Nominee B in ROUND_1 with evaluations (59,60,61)+(59,60,61) -> round_1_score 599"
          setup_api_calls:
            - { call: "POST /api/city-programs", payload: { code: "ATL", name: "Atlanta", admissions_cycle: "2027", nomination_window_opens_at: "2026-09-01T00:00:00Z", nomination_window_closes_at: "2026-11-30T23:59:59Z" }, as: ProgramAdmin, captures: { cp: $.data.id } }
