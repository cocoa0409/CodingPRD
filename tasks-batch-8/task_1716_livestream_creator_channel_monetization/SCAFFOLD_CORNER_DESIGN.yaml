              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/strikes"
              payload: { policy_code: "SPAM", severity: "MINOR", evidence_ref: "e1" }
              as: TrustAgent
              as_user_id: "trust_nina"
            - call: "POST /api/channels/${ch_id}/strikes"
              payload: { policy_code: "SPAM", severity: "MINOR", evidence_ref: "e2" }
