          assert:
            - "${lc} == 3 — all three parcels are on ISSUED lines of 2660 each"
            - "The first sweep returns HTTP 200 with ${filed} == 2 and ${skipped} == 1 — the on-time parcel is skipped silently rather than failing the call, and claim_ids holds exactly the two filed claim ids"
            - "${late_a} == 10800 and ${cand_a} == 2660 — each bulk-filed claim carries the same fields a single POST /guarantee-claims would have produced, with status FILED"
            - "GET /guarantee-claims with shipment_id ${pc} returns total_count == 0 — the on-time parcel got no claim at all"
            - "The second sweep returns ${filed2} == 0 and ${skipped2} == 3 — the two FILED claims now trip the duplicate rule and the third parcel is still on time"
            - "GET /guarantee-claims returns total_count == 2 overall, and Invoice.${inv}.pending_adjustment_count == 0 because filing alone moves no money"

      - name: an_invoice_line_links_its_shipment_dispute_and_adjustment
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /invoice-lines]
          - endpoints[GET /billing-adjustments]
          - endpoints[GET /disputes]
          - state_machines.Dispute.UNDER_REVIEW_to_UPHELD
        distinguishing_aspect: |
          The InvoiceLine is the join point of the whole money graph, and every hop is
          reachable by a filtered list: shipment_id finds the line, invoice_line_id finds its
          dispute, and dispute_id finds the system adjustment the upheld dispute minted — with
          no id ever guessed from a payload.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with ACTIVE contract C1 (divisor 139, min charge 1195, zone-2 rows 380/340/305, residential_waived false) and ServiceLevel EXPRESS."
