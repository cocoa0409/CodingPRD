  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: vendor_accreditation_scope_outranks_contract_ceiling_breach
        grounds:
          - validations[priority=15]
          - validations[priority=27]
          - errors[ERR_VENDOR_NOT_ACCREDITED]
          - errors[ERR_VENDOR_CEILING_EXCEEDED]
          - calculations.vendor_award_pricing
        distinguishing_aspect: |
          One award request violates priority 15 (business_safety, 409) and priority 27
          (business_fiscal, 402) at once; the response MUST be ERR_VENDOR_NOT_ACCREDITED with
          HTTP 409, proving the catalog is ordered by declared priority and not by HTTP status
          or by the order in which the pricing computation happens to reach each gate.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Method M1 VALIDATED with discipline CHEMISTRY and max_items_per_request 10."
            - "Vendor VBAD is ACTIVE but accredited_disciplines is [BIOLOGY] only (accreditation_expires_at_utc 2027-01-01T00:00:00Z), concurrent_case_capacity 2, unit_price_cents 45000, rush_surcharge_pct 0.00, contract_ceiling_cents 1000, encumbered_cents 0, spent_cents 0."
            - "Case C1 ACCEPTED with one vault item; Request R1 QUEUED with item_count 5."
            - "The award would price at base 225000, tier_basis 225000 -> 0.04, discount 9000, award_amount_cents 216000, which exceeds contract_ceiling_cents 1000 - so priority 27 is genuinely violated too."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/methods"
              payload: { name: "GC-MS Controlled Substance Identification", discipline: "CHEMISTRY", standard_hours_per_item: 2.00, min_competency_level: 3, max_items_per_request: 10, is_consumptive: false, accreditation_scope_code: "CHEM-GCMS-01" }
              as: QualityManager
              captures: { m1: $.data.id }
            - call: "POST /lab/methods/${m1}/validate"
              payload: { validation_study_item_count: 24, precision_cv_pct: 2.50, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /lab/vendors"
              payload: { name: "Northgate Biology Services", accredited_disciplines: ["BIOLOGY"], accreditation_expires_at_utc: "2027-01-01T00:00:00Z", concurrent_case_capacity: 2, unit_price_cents: 45000, rush_surcharge_pct: 0.00, contract_ceiling_cents: 1000 }
              as: LabDirector
              captures: { vbad: $.data.id }
            - call: "POST /lab/cases"
              payload: { agency_case_number: "D-2026-0909", submitting_agency: "METRO PD", offense_category: "DRUG_OFFENSE", suspect_in_custody: false }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Five sealed bindles", item_type: "CHEMICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e1: $.data.id }
            - call: "POST /lab/cases/${c1}/accept"
              payload: {}
              as: EvidenceTechnician
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${e1}", method_id: "${m1}", item_count: 5 }
              as: CaseManager
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /lab/examination-requests/${r1}/vendor-engagements"
              payload: { vendor_id: "${vbad}", window_start_utc: "2026-08-05T00:00:00Z", window_end_utc: "2026-08-25T00:00:00Z", rush_flag: false }
              as: CaseManager
              captures: { err_id: $.data.error_id }
          assert:
            - "response HTTP status == 409"
            - "${err_id} == ERR_VENDOR_NOT_ACCREDITED"
            - "${err_id} != ERR_VENDOR_CEILING_EXCEEDED"
            - "count(VendorEngagement where examination_request_id == ${r1}) == 0"
            - "Vendor.${vbad}.encumbered_cents == 0"
            - "Vendor.${vbad}.spent_cents == 0"
            - "ExaminationRequest.${r1}.status == QUEUED"
            - "Case.${c1}.workflow_status == AWAITING_ASSIGNMENT"

