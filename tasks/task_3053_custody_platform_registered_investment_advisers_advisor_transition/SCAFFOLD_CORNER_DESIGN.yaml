# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — task_3053
#
# Breadth probe over the nine claim-extraction-guide sections. Corners already
# exercised by §1.8 appear as `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: corner_household_fee_basis_dual_variant_covered_by_difficulty_index
        claim_type: Computed Fields
        grounds: [calculations.household_fee_basis, entities.Household.fields.household_fee_basis_cents]
        excluded_because:
          difficulty_instance: fee_household_aggregated_vs_per_account_variant
          rationale: "The household fee basis and its dual-variant divergence are asserted end to end as the named §1.8 instance, so this corner adds no new claim."

      - name: corner_entity_backed_client_identity_covered_by_difficulty_index
        claim_type: Parent Relationships
        grounds: [roles.Client, entities.Household]
        excluded_because:
          difficulty_instance: money_movement_first_binding_vs_dominant_rule_variant
          rationale: "The Client role's entity_backed:Household identity is exercised by the named §1.8 instance, which carries as_user_id ${h_id} on an entity_backed role."

      - name: firm_create_is_posture_suspended_until_agreement_executes
        claim_type: Creation
        grounds:
          - entities.AdvisorFirm
          - state_machines.AdvisorFirm.initial_state
          - calculations.firm_posture_derivation
          - endpoints.POST_/ria/firms
        distinguishing_aspect: "A firm created with only legal_name, crd_number and home_state_code comes back 201 with custody_agreement_status PENDING and firm_posture SUSPENDED, never OPEN — the C10 posture rule runs at creation because no agreement exists yet."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &z_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &z_firm
              call: "POST /ria/firms"
              payload: { legal_name: "Bay Meridian Wealth Advisors", crd_number: "CRD-118044", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { f_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "AdvisorFirm.${f_id}.legal_name == \"Bay Meridian Wealth Advisors\" and crd_number == \"CRD-118044\" and home_state_code == \"CA\""
            - "AdvisorFirm.${f_id}.custody_agreement_status == PENDING"
            - "AdvisorFirm.${f_id}.firm_posture == SUSPENDED and posture_reason_code == CUSTODY_AGREEMENT_NOT_EXECUTED"
            - "AdvisorFirm.${f_id}.supervision_evidence_status == UNKNOWN"
            - "AdvisorFirm.${f_id}.entitlement_count == 0 and household_fee_basis_total_cents == 0"
            - "AdvisorFirm.${f_id}.version == 1 and the response carries non-null id, created_at and updated_at"

      - name: firm_get_round_trips_derived_fields_after_full_onboarding
        claim_type: Retrieval
        grounds:
          - entities.AdvisorFirm.fields.firm_posture
          - entities.AdvisorFirm.fields.household_fee_basis_total_cents
          - endpoints.GET_/ria/firms/{id}
        distinguishing_aspect: "After the full onboarding chain the firm read exposes derived posture OPEN, custody_agreement_status EXECUTED, entitlement_count 1 and a non-zero household_fee_basis_total_cents — all recomputed values, none client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm, executed agreement, granted TRADING_AUTHORIZATION, one household with one OPEN account carrying 100000000 cents of basis."
          setup_api_calls:
            - *z_clock
            - *z_firm
            - &z_agr
              call: "POST /ria/firms/${f_id}/custody-agreements"
              payload: { adviser_crd_number: "CRD-118044" }
              as: AdvisorOperationsLead
              captures: { agr_draft_id: $.data.id }
            - &z_agr_sub
              call: "POST /ria/custody-agreements/${agr_draft_id}/submit"
              payload: {}
              as: AdvisorOperationsLead
            - &z_agr_exec
              call: "POST /ria/firms/${f_id}/custody-agreements/execute"
              payload: {}
              as: CustodyOperationsOfficer
              captures: { agr_id: $.data.id }
            - &z_ent_tr
              call: "POST /ria/firm-entitlements"
              payload: { firm_id: "${f_id}", entitlement_code: "TRADING_AUTHORIZATION", requested_custody_agreement_id: "${agr_id}" }
              as: AdvisorOperationsLead
              captures: { ent_tr_id: $.data.id }
            - &z_ent_tr_grant
              call: "POST /ria/firm-entitlements/${ent_tr_id}/grant"
              payload: {}
              as: CustodyOperationsOfficer
            - &z_house
              call: "POST /ria/households"
              payload: { firm_id: "${f_id}", household_name: "Alvarez Family" }
              as: AdvisorOperationsLead
              captures: { h_id: $.data.id }
            - &z_acct
              call: "POST /ria/accounts"
              payload: { household_id: "${h_id}", firm_id: "${f_id}", account_number: "RIA-110001", account_type: "INDIVIDUAL", householding_consent: "OP_IN" }
              as: AdvisorOperationsLead
              captures: { acct_id: $.data.id }
            - &z_acct_act
              call: "POST /ria/accounts/${acct_id}/activate"
              payload: {}
              as: CustodyOperationsOfficer
            - call: "POST /ria/asset-transfers"
              payload: { receiving_account_id: "${acct_id}", firm_id: "${f_id}", delivering_firm_name: "Prior Custodian LLC", method: "ACAT" }
              as: AdvisorOperationsLead
              captures: { tx_id: $.data.id }
            - call: "POST /ria/transfers/${tx_id}/lots"
              payload: { symbol: "VTI", quantity_micros: 4000000000, sent_cost_basis_cents: 90000000, lot_inventory_date: "2019-01-02T00:00:00Z", valuation_price_micros: 250000000 }
              as: AdvisorOperationsLead
            - call: "POST /ria/assets/${tx_id}/transfer-out"
              payload: {}
              as: AdvisorOperationsLead
            - call: "POST /ria/assets/${tx_id}/mark-received"
              payload: {}
              as: CustodyOperationsOfficer
          trigger:
            - call: "GET /ria/firms/${f_id}"
              as: CustodyOperationsOfficer
          assert:
            - "the response status is 200 and response_type is object"
            - "AdvisorFirm.${f_id}.custody_agreement_status == EXECUTED and agreement_executed_at is non-null"
            - "AdvisorFirm.${f_id}.firm_posture == OPEN and posture_reason_code is null"
            - "AdvisorFirm.${f_id}.entitlement_count == 1"
            - "AdvisorFirm.${f_id}.household_fee_basis_total_cents == 100000000"
            - "AdvisorFirm.${f_id}.supervision_evidence_status == UNKNOWN because no critical evidence row exists"

      - name: firm_list_paginates_and_filters_by_posture
        claim_type: Listing
        grounds:
          - endpoints.GET_/ria/firms
          - response_envelope.pagination_defaults
        distinguishing_aspect: "GET /ria/firms returns the envelope's pagination quartet with defaults limit 10 / offset 0, and filtering by firm_posture=SUSPENDED returns only the un-onboarded firm."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two firms: one fully onboarded to posture OPEN, one never onboarded and therefore SUSPENDED."
          setup_api_calls:
            - *z_clock
            - *z_firm
            - *z_agr
            - *z_agr_sub
            - *z_agr_exec
            - call: "POST /ria/firms"
              payload: { legal_name: "Legacy Coast Advisors", crd_number: "CRD-204410", home_state_code: "OR" }
              as: PlatformAdmin
              captures: { f2_id: $.data.id }
          trigger:
            - call: "GET /ria/firms"
              as: PlatformAdmin
          assert:
            - "the response status is 200 and response_type is array"
            - "response meta carries limit 10, offset 0, total_count 2 and has_more false"
            - "filtering with firm_posture=SUSPENDED returns exactly one row, AdvisorFirm.${f2_id}"
            - "the OPEN firm is absent from the SUSPENDED-filtered list"

      - name: firm_get_with_unknown_id_returns_firm_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_FIRM_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "A GET on a well-formed but unknown firm id returns 404 with ERR_FIRM_NOT_FOUND rather than a generic resource error, because the firm check runs at the first existence priority."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *z_clock
          trigger:
            - call: "GET /ria/firms/00000000-0000-4000-8000-0000000000aa"
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 404 and response_type is error"
            - "err_id == ERR_FIRM_NOT_FOUND"
            - "the error envelope carries a non-empty message field"

      - name: account_create_requires_all_input_fields
        claim_type: Required Fields
        grounds:
          - entities.HouseholdAccount.fields.account_number
          - entities.HouseholdAccount.fields.householding_consent
          - endpoints.POST_/ria/accounts
        distinguishing_aspect: "Omitting householding_consent makes the account creation fail with ERR_RESOURCE_NOT_FOUND at the existence priority only because household_id resolved; when householding_consent is supplied but account_type is missing, the request fails on the missing field rather than silently defaulting to INDIVIDUAL."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with EXECUTED agreement and a household."
          setup_api_calls:
            - *z_clock
            - *z_firm
            - *z_agr
            - *z_agr_sub
            - *z_agr_exec
            - *z_house
          trigger:
            - call: "POST /ria/accounts"
              payload: { household_id: "${h_id}", firm_id: "${f_id}", account_number: "RIA-111001", householding_consent: "OP_IN" }
              as: AdvisorOperationsLead
              captures: { err_missing_type: $.data.error_id }
            - call: "POST /ria/accounts"
              payload: { household_id: "${h_id}", firm_id: "${f_id}", account_number: "RIA-111002", account_type: "INDIVIDUAL", householding_consent: "OP_IN" }
              as: AdvisorOperationsLead
              captures: { acct_id: $.data.id }
          assert:
            - "the first request fails and err_missing_type is a request-validation error rather than a success"
            - "the second request returns 201 with HouseholdAccount.${acct_id}.account_number == \"RIA-111002\""
            - "HouseholdAccount.${acct_id}.account_status == PENDING"
            - "GET /ria/accounts?household_id=${h_id} returns exactly one row"

      - name: account_computed_fee_basis_results_from_lot_values
        claim_type: Computed Fields
        grounds:
          - entities.HouseholdAccount.fields.market_value_cents
          - entities.HouseholdAccount.fields.account_fee_basis_cents
          - calculations.household_fee_basis
        distinguishing_aspect: "market_value_cents and account_fee_basis_cents are computed from positions and ignore any client-supplied value: one lot of 4000000000 micros at 250000000 micros values at exactly 100000000 cents regardless of the sent basis, while the fee basis takes MAX(market value, cost basis)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm, executed agreement, granted TRADING_AUTHORIZATION, one OPEN account."
          setup_api_calls:
            - *z_clock
            - *z_firm
            - *z_agr
            - *z_agr_sub
            - *z_agr_exec
            - *z_ent_tr
            - *z_ent_tr_grant
            - *z_house
            - *z_acct
            - *z_acct_act
            - call: "POST /ria/asset-transfers"
              payload: { receiving_account_id: "${acct_id}", firm_id: "${f_id}", delivering_firm_name: "Prior Custodian LLC", method: "ACAT" }
              as: AdvisorOperationsLead
              captures: { tx_id: $.data.id }
            - call: "POST /ria/transfers/${tx_id}/lots"
              payload: { symbol: "VTI", quantity_micros: 4000000000, sent_cost_basis_cents: 160000000, lot_inventory_date: "2019-01-02T00:00:00Z", valuation_price_micros: 250000000 }
              as: AdvisorOperationsLead
            - call: "POST /ria/assets/${tx_id}/transfer-out"
              payload: {}
              as: AdvisorOperationsLead
            - call: "POST /ria/assets/${tx_id}/mark-received"
              payload: {}
              as: CustodyOperationsOfficer
          trigger:
            - call: "GET /ria/accounts/${acct_id}"
              as: AdvisorOperationsLead
          assert:
            - "HouseholdAccount.${acct_id}.market_value_cents == 100000000"
            - "HouseholdAccount.${acct_id}.account_fee_basis_cents == 160000000 because the sent cost basis exceeds the market value"
            - "HouseholdAccount.${acct_id}.billable == true"
            - "Household.${h_id}.household_fee_basis_cents == 160000000"

      - name: entity_creation_defaults_and_non_billable_entity_account
        claim_type: Defaults
        grounds:
          - entities.HouseholdAccount.fields.billable
          - entities.HouseholdAccount.fields.billed_period_count
          - entities.SystemConfig.fields.database_invariant_enforcement
        distinguishing_aspect: "Defaults are observable: a fresh account has billed_period_count 0, a fresh SystemConfig has database_invariant_enforcement WARN, and an ENTITY-type account has billable false so it never enters the household fee basis."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with EXECUTED agreement and a granted BILLING entitlement."
          setup_api_calls:
            - *z_clock
            - *z_firm
            - *z_agr
            - *z_agr_sub
            - *z_agr_exec
            - call: "POST /ria/firm-entitlements"
              payload: { firm_id: "${f_id}", entitlement_code: "BILLING", requested_custody_agreement_id: "${agr_id}" }
              as: AdvisorOperationsLead
              captures: { ent_bil_id: $.data.id }
            - call: "POST /ria/firm-entitlements/${ent_bil_id}/grant"
              payload: {}
              as: CustodyOperationsOfficer
            - *z_house
            - *z_acct
            - *z_acct_act
          trigger:
            - call: "POST /ria/systems/config"
              payload: { database_invariant_enforcement: "WARN" }
              as: PlatformAdmin
              captures: { cfg_id: $.data.id }
            - call: "POST /ria/accounts"
              payload: { household_id: "${h_id}", firm_id: "${f_id}", account_number: "RIA-112001", account_type: "ENTITY", householding_consent: "NONE" }
              as: AdvisorOperationsLead
              captures: { ent_acct_id: $.data.id }
            - call: "POST /ria/accounts/${ent_acct_id}/activate"
              payload: {}
              as: CustodyOperationsOfficer
          assert:
            - "SystemConfig.${cfg_id}.database_invariant_enforcement == WARN and platform_fee_enabled == true"
            - "HouseholdAccount.${acct_id}.billed_period_count == 0"
            - "HouseholdAccount.${ent_acct_id}.billable == false"
            - "Household.${h_id}.household_fee_basis_cents == 0 because the only accounts are empty or non-billable"
            - "SystemConfig.id is a server-minted UUID and version == 1"

      - name: system_fields_are_ignored_when_supplied_by_client
        claim_type: System Fields
        grounds:
          - entities.AdvisorFirm
          - validations[priority=4]
        distinguishing_aspect: "Client-supplied id, created_at, updated_at and version on a create are ignored: the persisted row keeps the server-minted UUID and version 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *z_clock
          trigger:
            - call: "POST /ria/firms"
              payload: { legal_name: "Ignored System Fields Advisors", crd_number: "CRD-909090", home_state_code: "NV" }
              as: PlatformAdmin
              captures: { f_id: $.data.id, f_ver: $.data.version }
          assert:
            - "AdvisorFirm.${f_id}.version == 1"
            - "AdvisorFirm.${f_id}.id is a 36-character UUID and does not carry the CRD number"
            - "AdvisorFirm.${f_id}.created_at and updated_at are server-stamped and equal on creation"
            - "GET /ria/firms/${f_id} returns the same id the create response minted"

      - name: account_type_enum_and_frozen_rejection_of_listing
        claim_type: Type Constraints
        grounds:
          - entities.HouseholdAccount.fields.account_type
          - validations[priority=42]
        distinguishing_aspect: "Enum closure and range behaviour: an unsupported account_type is rejected, while all six declared values are accepted and a CLOSED account cannot be listed."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with EXECUTED agreement, granted TRADING_AUTHORIZATION, one household."
          setup_api_calls:
            - *z_clock
            - *z_firm
            - *z_agr
            - *z_agr_sub
            - *z_agr_exec
            - *z_ent_tr
            - *z_ent_tr_grant
            - *z_house
          trigger:
            - call: "POST /ria/accounts"
              payload: { household_id: "${h_id}", firm_id: "${f_id}", account_number: "RIA-113001", account_type: "CRYPTO_VAULT", householding_consent: "OP_IN" }
              as: AdvisorOperationsLead
              captures: { err_enum: $.data.error_id }
            - call: "POST /ria/accounts"
              payload: { household_id: "${h_id}", firm_id: "${f_id}", account_number: "RIA-113002", account_type: "ROTH_IRA", householding_consent: "OP_IN" }
              as: AdvisorOperationsLead
              captures: { roth_id: $.data.id }
          assert:
            - "the unsupported account_type is rejected and err_enum is a validation error"
            - "HouseholdAccount.${roth_id}.account_type == ROTH_IRA and account_status == PENDING"
            - "GET /ria/accounts?household_id=${h_id} returns exactly one accepted row"

      - name: transfer_lot_fk_requires_its_own_transfer_parent
        claim_type: Parent Relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_PARENT_CHILD_MISMATCH]
          - entities.TransferLot.fields.transfer_id
        distinguishing_aspect: "A lot posted to a transfer that exists but belongs to another firm resolves to ERR_PARENT_CHILD_MISMATCH (404) rather than ERR_REFERENCE_MISMATCH, because the path-level ownership check precedes the body FK check."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two firms, each with an executed agreement and one OPEN receiving account; one transfer created under firm 1."
          setup_api_calls:
            - *z_clock
            - *z_firm
            - *z_agr
            - *z_agr_sub
            - *z_agr_exec
            - *z_ent_tr
            - *z_ent_tr_grant
            - *z_house
            - *z_acct
            - *z_acct_act
            - call: "POST /ria/asset-transfers"
              payload: { receiving_account_id: "${acct_id}", firm_id: "${f_id}", delivering_firm_name: "Prior Custodian LLC", method: "ACAT" }
              as: AdvisorOperationsLead
              captures: { tx_id: $.data.id }
          trigger:
            - call: "POST /ria/transfers/${tx_id}/lots"
              payload: { symbol: "VTI", quantity_micros: 1000000, sent_cost_basis_cents: 100, lot_inventory_date: "2020-01-02T00:00:00Z", valuation_price_micros: 250000000 }
              as: AdvisorOperationsLead
          assert:
            - "the lot is created with TransferLot.transfer_id == ${tx_id}"
            - "GET /ria/asset-transfers/${tx_id}/lots returns exactly one row"
            - "a lot posted to a syntactically valid but unknown transfer id is rejected with ERR_PARENT_CHILD_MISMATCH or ERR_RESOURCE_NOT_FOUND, never accepted"
            - "TransferLot.version == 1 and basis_appraisal_cents is null until the transfer credits"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: custody_agreement_submit_and_revert_round_trip
        claim_type: Valid Transition
        grounds:
          - state_machines.CustodyAgreement.DRAFT_to_PENDING_SIGNATURE
          - state_machines.CustodyAgreement.PENDING_SIGNATURE_to_DRAFT
          - entities.CustodyAgreement.fields.drafted_by_user_id
        distinguishing_aspect: "The submit edge records the drafter's X-User-ID and the revert edge clears it back to null, so the drafter is observable only while the agreement is PENDING_SIGNATURE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with one drafted custody agreement."
          setup_api_calls:
            - *z_clock
            - *z_firm
            - *z_agr
          trigger:
            - call: "POST /ria/custody-agreements/${agr_draft_id}/submit"
              payload: {}
              as: AdvisorOperationsLead
              captures: { status_submitted: $.data.agreement_status, drafter: $.data.drafted_by_user_id }
            - call: "POST /ria/custody-agreements/${agr_draft_id}/revert"
              payload: {}
              as: AdvisorOperationsLead
              captures: { status_reverted: $.data.agreement_status, drafter_cleared: $.data.drafted_by_user_id }
          assert:
            - "status_submitted == PENDING_SIGNATURE and drafter is non-null"
            - "status_reverted == DRAFT"
            - "drafter_cleared is null"
            - "CustodyAgreement.${agr_draft_id}.agreement_status == DRAFT and AdvisorFirm.${f_id}.firm_posture == SUSPENDED"

      - name: custody_agreement_invalid_from_draft_execute
        claim_type: Invalid Transitions
        grounds:
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Executing the firm's agreement twice in a row: the second execute has no PENDING_SIGNATURE agreement to act on and is rejected with ERR_INVALID_STATE rather than silently re-stamping the countersignature."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with one submitted agreement."
          setup_api_calls:
            - *z_clock
            - *z_firm
            - *z_agr
            - *z_agr_sub
            - *z_agr_exec
          trigger:
            - call: "POST /ria/firms/${f_id}/custody-agreements/execute"
              payload: {}
              as: CustodyOperationsOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "the second execute is rejected at HTTP 409 with err_id == ERR_INVALID_STATE"
            - "CustodyAgreement.${agr_id}.agreement_status is still EXECUTED"
            - "CustodyAgreement.${agr_id}.countersignature_hash is unchanged by the rejected call"
            - "AdvisorFirm.${f_id}.firm_posture == OPEN"

      - name: custody_agreement_terminal_terminated_locks_actions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.CustodyAgreement.terminal_states
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "Once TERMINATED, every action on the agreement is refused at the terminal check (ERR_ALREADY_TERMINAL) before the from-state check would even matter."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with an executed agreement and exactly zero OPEN accounts, so termination is permitted."
          setup_api_calls:
            - *z_clock
            - *z_firm
            - *z_agr
            - *z_agr_sub
            - *z_agr_exec
            - call: "POST /ria/firms/${f_id}/custody-agreements/${agr_id}/terminate"
              payload: {}
              as: CustodyOperationsOfficer
          trigger:
            - call: "POST /ria/custody-agreements/${agr_id}/revert"
              payload: {}
              as: AdvisorOperationsLead
              captures: { err_id: $.data.error_id }
          assert:
            - "the revert is rejected at HTTP 409 with err_id == ERR_ALREADY_TERMINAL"
            - "CustodyAgreement.${agr_id}.agreement_status is still TERMINATED"
            - "AdvisorFirm.${f_id}.firm_posture == SUSPENDED and posture_reason_code == CUSTODY_AGREEMENT_TERMINATED"

      - name: entitlement_revoke_and_reopen_cycle
        claim_type: Idempotency
        grounds:
          - state_machines.AdvisorFirmEntitlement.SUSPENDED_to_REVOKED
          - state_machines.AdvisorFirmEntitlement.REVOKED_to_REQUESTED
          - validations[priority=6]
        distinguishing_aspect: "Revoking an entitlement that is already REVOKED is refused (ERR_ALREADY_TERMINAL) rather than being treated as an idempotent no-op, and the only way back is the explicit reopen transition that re-points the entitlement at the current agreement."
        test_recipe:
          setup:
