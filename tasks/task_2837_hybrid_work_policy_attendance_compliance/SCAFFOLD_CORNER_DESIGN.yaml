              payload: { policy_cycle_id: "${cyc_a}", anchor_team_id: "${t_a}", neighborhood_code: "N-1", site_code: "NYC-01", seat_count: 40, buffer_seats: 4, desk_index_from: 1, desk_index_to: 40 }
              as: WorkplaceProgramOffice
