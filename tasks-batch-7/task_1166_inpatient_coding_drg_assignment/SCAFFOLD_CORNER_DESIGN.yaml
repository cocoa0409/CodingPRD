  # ==================================================== From Table 7 (RBAC)
  - section: rbac
    instances:
      - name: accept_assignment_as_coder_forbidden
        claim_type: rbac_denial
        grounds: ["roles[CodingManager].exclusive_operations", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Accept is CodingManager-exclusive; the assigned Coder calling it -> 403 ERR_FORBIDDEN even though the assignment is SUBMITTED."
        test_recipe:
          setup: ["Assignment SUBMITTED by its coder"]
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-RB1", full_name: "Role Check", credential: "CCS" }, as: CodingManager, captures: { coder_id: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-RB1", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 900000 }, as: CodingManager, captures: { acct_id: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_id}", acuity: "MEDICAL_LOW" }, as: CodingManager, captures: { chart_id: $.data.id } }
            - { call: "POST /patient-accounts/${acct_id}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /assignments", payload: { chart_id: "${chart_id}", coder_id: "${coder_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/start", payload: {}, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /diagnosis-lines", payload: { chart_id: "${chart_id}", icd_code: "I21.09", poa: "Y", sequence: 1, is_principal: true }, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /assignments/${asg_id}/submit", payload: {}, as: Coder, as_user_id: "${coder_id}" }
          trigger:
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: Coder, as_user_id: "${coder_id}", captures: { err: $.data.error_id } }
          assert:
            - "Trigger response http_status == 403 and error_id == ERR_FORBIDDEN"
            - "CodingAssignment.${asg_id}.status == SUBMITTED (unchanged)"

      - name: create_audit_as_clerk_forbidden
        claim_type: rbac_denial
        grounds: ["roles[Auditor].exclusive_operations", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "BillingClerk invoking Auditor-exclusive POST /audits -> 403 ERR_FORBIDDEN."
