  - rule_id: non_linear_state_machine
    instances:

      - name: link_install_and_record_dimensions_advance_independently
        grounds:
          - state_machines.Link.install_state
          - state_machines.Link.record_state
          - entities.Link.fields.install_state
          - entities.Link.fields.record_state
          - validations[priority=56]
        distinguishing_aspect: |
          Parallel state dimensions on ONE Link row: record_state walks
          UNLABELED -> LABELED -> RECORDED while install_state stays TERMINATED, and
          install_state then walks TERMINATED -> TESTED_PASS -> CERTIFIED while record_state
          stays RECORDED. Certification is the single join point that reads both dimensions
          (ERR_LINK_NOT_RECORDED when the administration dimension lags). The non-linearity is
          parallelism on one entity, not the SCHEDULED -> IN_PROGRESS -> SUBMITTED cycle of
          mac_ticket_rework_cycle_returns_to_submitted.
