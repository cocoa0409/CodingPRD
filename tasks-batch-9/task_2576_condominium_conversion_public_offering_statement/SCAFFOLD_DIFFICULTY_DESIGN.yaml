  - rule_id: cross_entity_state_dependency
    instances:
      - name: closing_blocked_until_assigned_batch_is_released
        grounds:
          - validations[priority=24]
          - state_machines.PurchaseAgreement.HARD_to_CLOSED
          - state_machines.ClosingBatch.THRESHOLD_MET_to_RELEASED
          - entities.ClosingBatch.fields.released_at
          - entities.PurchaseAgreement.fields.closing_batch_id
        distinguishing_aspect: |
          The blocked transition is PurchaseAgreement HARD -> CLOSED and the gating state lives on a
          DIFFERENT entity, the assigned ClosingBatch: with the agreement itself perfectly closable
          (HARD, escrow FUNDED, inside the window) the request must still fail while the batch sits
          in THRESHOLD_MET, and the only thing that unblocks it is a state change on the batch. The
          entity pair is PurchaseAgreement x ClosingBatch.
