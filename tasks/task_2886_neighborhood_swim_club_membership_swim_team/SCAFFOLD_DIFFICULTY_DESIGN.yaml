              as: MembershipChair
              captures: { cat_couple_id: $.data.id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120, proration_basis: "CALENDAR_DAY", guest_settlement_policy: "PASS_FIRST" }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Bhatt Household", address_line: "9 Cabana Court", residency: "IN_DISTRICT", member_count: 2, prior_member: false }
              as: MembershipChair
              captures: { h_b_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_b_id}", membership_category_id: "${cat_couple_id}", season_id: "${s27_id}", join_date: "2027-05-22", bond_payment_plan: "FULL" }
