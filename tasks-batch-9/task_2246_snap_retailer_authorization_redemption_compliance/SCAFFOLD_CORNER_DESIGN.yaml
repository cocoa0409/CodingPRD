          - endpoints.POST_/sanction-cases/{caseId}/cmp-elections
        distinguishing_aspect: "The second OCC rule guards the election against a case snapshot taken before the charge letter: the request is otherwise flawless - hardship store, CHARGE_ISSUED state, election window wide open - so a 412 ERR_STALE_SANCTION_CASE_VERSION proves the version token is checked before the state, window and hardship gates, and no CmpElection row is left behind."
        test_recipe:
          setup:
            - "A CHARGE_ISSUED hardship case whose post-charge version is captured."
          setup_api_calls:
