# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3151_air_hub_sort_operations_next_day_commitment
#
# Nine §0.5 Difficulty Rules, each with >= 2 instances (this file carries 22).
# Every instance grounds in elements already declared in SCAFFOLD.yaml
# §1.1-§1.6; deleting this file leaves the scaffold's declared behaviour
# identical. Every setup_api_calls chain drives empty-DB into the state
# described by setup: using only §1.5 endpoints.
#
# FIXTURE CONSTANTS (literals; see calculations.hub_sort_constants and
# calculations.hub_posture):
#   Clock -> hub minute: (UTC hour*60 + minute) + 1440 when the UTC time is
#     strictly before 12:00Z. 23:00Z -> 1380; 23:20Z -> 1400; 23:25Z -> 1405;
#     23:34Z -> 1414; 23:40Z -> 1420; 00:20Z -> 1460; 00:40Z -> 1480;
#     01:00Z -> 1500; 01:10Z -> 1510; 01:40Z -> 1540; 02:00Z -> 1560;
#     02:40Z -> 1600; 06:01Z -> 1801.
#   SDF hub: sort_window_open 1380, sort_window_close 1560 -> window 180 min
#     congestion_threshold_grams = 180*2000 = 360000  (CONGESTED needs >)
#     lockdown_threshold_grams   = 180*5000 = 900000  (LOCKDOWN at >=)
#   Shift N-A: 1380-1560 (180 min), headcount 40, productivity 4200 g/op/h,
#     forecast 380000 -> capacity_grams = 40*4200*3 = 504000
#     GREEN |variance| < 0.10 -> live in (342000, 418000)
#     SATURATED variance >= 0.15 -> live >= 437000 (and <= 504000)
#     RED live > 504000
#   Commitment cutoff: NEXT_DAY_AIR = 1560, SECOND_DAY_AIR = 3000,
#     GROUND = 4440. The time downgrade window is (1530, 1620].
#   Lanes: P-01/P-02 PRIMARY GENERAL cap 60000 (turnouts 1400-1500, 1500-1600
#     -> touching, merge credit 400); P-03 PRIMARY GENERAL cap 60000 (turnout
#     1601-1700 -> 1-minute gap, no merge); S-01 SECONDARY GENERAL cap 60000
#     (turnout 1400-1600); IR-01 IRREGULAR cap 40000 (turnout 1400-1600);
#     HZ-01 HAZMAT cap 40000 certified_until 1560 (turnout 1400-1600).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: package_rated_weight_manifest_vs_volumetric_variant
        grounds:
          - calculations.rated_sort_weight
          - entities.Package.fields.rated_weight_grams
          - endpoints.POST_/airhub/packages/{package_id}/induct
        distinguishing_aspect: "On the Package domain three packages all carrying planned_weight_grams 1910 rate 2000, 2600 and 2100 — the manifest variant never escapes the DIM_MINIMUM_GRAMS floor while the volumetric variant lifts well clear of it, so the same declared weight yields two different rated weights."
        test_recipe:
          setup:
            - "Empty DB. Clock 23:00Z (minute 1380). Alternate hub IND, SDF hub, six lanes, BANK_A with N701UP landed and unloaded at minute 1401, shift N-A, and three GENERAL packages all with planned_weight_grams 1910."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T23:00:00Z" }
              as: HubOpsManager
            - &k_alt_hub
              call: "POST /airhub/hubs"
              payload: { iata_code: "IND", name: "Indianapolis Gateway", sort_window_open_minutes: 1380, sort_window_close_minutes: 1560 }
              as: HubOpsManager
              captures: { ind_hub_id: $.data.id }
            - &k_hub
              call: "POST /airhub/hubs"
              payload: { iata_code: "SDF", name: "Worldport Louisville", sort_window_open_minutes: 1380, sort_window_close_minutes: 1560, alternate_hub_id: "${ind_hub_id}" }
              as: HubOpsManager
              captures: { hub_id: $.data.id }
            - &k_lane_p1
              call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "P-01", lane_kind: "PRIMARY", commodity_capability: "GENERAL", capacity_weight_grams: 60000, certified_until_minutes: 1700, turnout_start_minutes: 1400, turnout_end_minutes: 1500 }
              as: SortSupervisor
              captures: { lane_p1_id: $.data.id }
            - &k_lane_p2
              call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "P-02", lane_kind: "PRIMARY", commodity_capability: "GENERAL", capacity_weight_grams: 60000, certified_until_minutes: 1700, turnout_start_minutes: 1500, turnout_end_minutes: 1600 }
              as: SortSupervisor
              captures: { lane_p2_id: $.data.id }
            - &k_lane_p3
              call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "P-03", lane_kind: "PRIMARY", commodity_capability: "GENERAL", capacity_weight_grams: 60000, certified_until_minutes: 1700, turnout_start_minutes: 1601, turnout_end_minutes: 1700 }
              as: SortSupervisor
              captures: { lane_p3_id: $.data.id }
            - &k_lane_s1
              call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "S-01", lane_kind: "SECONDARY", commodity_capability: "GENERAL", capacity_weight_grams: 60000, certified_until_minutes: 1700, turnout_start_minutes: 1400, turnout_end_minutes: 1600 }
              as: SortSupervisor
              captures: { lane_s1_id: $.data.id }
            - &k_lane_ir1
              call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "IR-01", lane_kind: "IRREGULAR", commodity_capability: "IRREGULAR", capacity_weight_grams: 40000, certified_until_minutes: 1700, turnout_start_minutes: 1400, turnout_end_minutes: 1600 }
              as: SortSupervisor
              captures: { lane_ir1_id: $.data.id }
            - &k_lane_hz1
              call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "HZ-01", lane_kind: "HAZMAT", commodity_capability: "HAZMAT", capacity_weight_grams: 40000, certified_until_minutes: 1560, turnout_start_minutes: 1400, turnout_end_minutes: 1600 }
              as: SortSupervisor
              captures: { lane_hz1_id: $.data.id }
            - &k_bank
              call: "POST /airhub/banks"
              payload: { hub_id: "${hub_id}", bank_code: "BANK_A", scheduled_start_minutes: 1400, scheduled_end_minutes: 1520, hydraulic_crew_available: true }
              as: HubOpsManager
              captures: { bank_id: $.data.id }
            - &k_ac1
              call: "POST /airhub/aircraft"
              payload: { bank_id: "${bank_id}", tail_number: "N701UP", origin_station_code: "LAX", scheduled_arrival_minutes: 1395, capacity_weight_grams: 200000 }
              as: GatewayCoordinator
              captures: { ac1_id: $.data.id }
            - &k_ac2
              call: "POST /airhub/aircraft"
              payload: { bank_id: "${bank_id}", tail_number: "N702UP", origin_station_code: "ORD", scheduled_arrival_minutes: 1402, capacity_weight_grams: 200000 }
              as: GatewayCoordinator
              captures: { ac2_id: $.data.id }
            - &k_shift
              call: "POST /airhub/shifts"
              payload: { hub_id: "${hub_id}", shift_code: "N-A", start_minutes: 1380, end_minutes: 1560, headcount: 40, productivity_grams_per_operator_hour: 4200, forecast_volume_grams: 380000, certified_for_hazmat: true }
              as: SortSupervisor
              captures: { shift_id: $.data.id }
            - &k_clock1400
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T23:20:00Z" }
              as: HubOpsManager
            - &k_ac1_depart
              call: "POST /airhub/aircraft/${ac1_id}/depart-origin"
              payload: {}
              as: GatewayCoordinator
            - &k_ac1_land
              call: "POST /airhub/aircraft/${ac1_id}/land"
              payload: { inbound_weight_grams: 6000 }
              as: GatewayCoordinator
            - &k_bank_unload
              call: "POST /airhub/banks/${bank_id}/begin-unload"
              payload: {}
              as: SortSupervisor
            - &k_ac1_begun
              call: "POST /airhub/aircraft/${ac1_id}/begin-unload"
              payload: {}
              as: SortSupervisor
            - &k_ac1_done
              call: "POST /airhub/aircraft/${ac1_id}/complete-unload"
              payload: { unload_completed_minutes: 1401 }
              as: SortSupervisor
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-A-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 1910, dimension_weight_grams: 1910 }
              as: SortOperator
              captures: { pkg_a_id: $.data.id }
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-A-0002", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 1910, dimension_weight_grams: 2600 }
              as: SortOperator
              captures: { pkg_b_id: $.data.id }
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-A-0003", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 1910, dimension_weight_grams: 2050 }
              as: SortOperator
              captures: { pkg_c_id: $.data.id }
          trigger:
            - call: "POST /airhub/packages/${pkg_a_id}/induct"
              payload: { dimension_weight_grams: 1910 }
              as: SortOperator
              captures: { a_rated: $.data.rated_weight_grams }
            - call: "POST /airhub/packages/${pkg_b_id}/induct"
              payload: { dimension_weight_grams: 2600 }
              as: SortOperator
              captures: { b_rated: $.data.rated_weight_grams }
            - call: "POST /airhub/packages/${pkg_c_id}/induct"
              payload: { dimension_weight_grams: 2050 }
              as: SortOperator
              captures: { c_rated: $.data.rated_weight_grams }
          assert:
            - "Package.${pkg_a_id}.rated_weight_grams == 2000 — max(1910, 1910, 2000) == 2000, so DIM_MINIMUM_GRAMS binds"
            - "Package.${pkg_b_id}.rated_weight_grams == 2600 — max(1910, 2600, 2000) == 2600"
            - "Package.${pkg_c_id}.rated_weight_grams == 2100 — round_half_up(2050/100)*100 == round_half_up(20.5)*100 == 2100"
            - "Package.${pkg_a_id}.rated_weight_grams != Package.${pkg_b_id}.rated_weight_grams although both carry planned_weight_grams 1910"
            - "Package.${pkg_a_id}.rated_weight_grams != 1910 — the DIM floor rounds it up"

      - name: hub_posture_settled_vs_provisional_row_set_variant
        grounds:
          - calculations.live_planned_package_total
          - calculations.hub_posture
          - state_machines.Hub.transitions.OPEN_to_CONGESTED
          - entities.Hub.fields.posture
        distinguishing_aspect: "On the Hub domain the same declared inbound volume of 600000 grams reads CONGESTED while both package rows are live and OPEN once one row leaves the live set through an upgrade-hold, so the settled-variant row filter rather than the declared volume decides the posture."
        test_recipe:
          setup:
            - "Clock 1405. SDF hub with alternate IND, BANK_A with N701UP and N702UP landed and unloaded, shift N-A, Package A (200000 g) live and Package B (400000 g) live."
          setup_api_calls:
            - *k_clock
            - *k_alt_hub
            - *k_hub
            - *k_lane_p1
            - *k_lane_s1
            - *k_bank
            - *k_ac1
            - *k_ac2
            - *k_shift
            - *k_clock1400
            - *k_ac1_depart
            - &k_ac1_land_200k
              call: "POST /airhub/aircraft/${ac1_id}/land"
              payload: { inbound_weight_grams: 200000 }
              as: GatewayCoordinator
            - *k_bank_unload
            - *k_ac1_begun
            - *k_ac1_done
            - &k_clock1405
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T23:25:00Z" }
              as: HubOpsManager
            - &k_ac2_depart
              call: "POST /airhub/aircraft/${ac2_id}/depart-origin"
              payload: {}
              as: GatewayCoordinator
            - &k_ac2_land_400k
              call: "POST /airhub/aircraft/${ac2_id}/land"
              payload: { inbound_weight_grams: 400000 }
              as: GatewayCoordinator
            - &k_ac2_begun
              call: "POST /airhub/aircraft/${ac2_id}/begin-unload"
              payload: {}
              as: SortSupervisor
            - &k_ac2_done
              call: "POST /airhub/aircraft/${ac2_id}/complete-unload"
              payload: { unload_completed_minutes: 1405 }
              as: SortSupervisor
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-B-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 200000, dimension_weight_grams: 200000 }
              as: SortOperator
              captures: { pkg_a2_id: $.data.id }
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac2_id}", tracking_number: "1Z-B-0002", commodity_class: "GENERAL", destination_hub_code: "ORD", service_level: "NEXT_DAY_AIR", planned_weight_grams: 400000, dimension_weight_grams: 400000 }
              as: SortOperator
              captures: { pkg_b2_id: $.data.id }
          trigger:
            - call: "GET /airhub/hubs/${hub_id}"
              payload: {}
              as: HubOpsManager
              captures: { settled_posture: $.data.posture, settled_total: $.data.live_planned_package_total }
            - call: "POST /airhub/aircraft/${ac2_id}/cancel"
              payload: { cause_code: "MECHANICAL" }
              as: HubOpsManager
            - call: "GET /airhub/hubs/${hub_id}"
              payload: {}
              as: HubOpsManager
              captures: { after_posture: $.data.posture, after_total: $.data.live_planned_package_total }
          assert:
            - "the settled read reports ${settled_total} == 600000 and ${settled_posture} == CONGESTED (600000 > 360000 and 600000 < 900000)"
            - "the provisional-at-induction variant over the same declared volume reports OPEN because it counts only Package rows that exist"
            - "after the cancellation ${after_total} == 200000 and ${after_posture} == OPEN"
            - "Hub.${hub_id}.posture == OPEN and Hub.${hub_id}.live_planned_package_total == 200000"
            - "Package.${pkg_b2_id}.commitment_status == UPGRADED_HELD and Package.${pkg_b2_id}.handling_status == HOLD_AT_HUB"
            - "Hub.${hub_id}.contingency_mode == false so the contingency-driven variant is not in play"

      - name: arrival_bank_unload_budget_with_slack_vs_without_slack_variant
        grounds:
          - calculations.effective_sort_budget
          - entities.ArrivalBank.fields.effective_sort_budget_minutes
          - endpoints.POST_/airhub/aircraft/{aircraft_id}/complete-unload
        distinguishing_aspect: "On the ArrivalBank domain two aircraft carrying identical 45-minute unload budgets contribute 40 and 33 minutes once their actual-arrival slack of 5 and 12 minutes is subtracted, so the bank reads 73 with-slack against 90 without-slack for the same aircraft count."
        test_recipe:
          setup:
            - "Clock 1400. SDF hub with alternate IND, BANK_A (scheduled 1400-1520), N701UP (scheduled 1395, landed 1400, unloaded 1402) and N702UP (scheduled 1402, landed 1414, unload in progress), shift N-A."
          setup_api_calls:
            - *k_clock
            - *k_alt_hub
            - *k_hub
            - *k_lane_p1
            - *k_lane_s1
            - *k_bank
            - *k_ac1
            - *k_ac2
            - *k_shift
            - *k_clock1400
            - *k_ac1_depart
            - &k_ac1_land_50k
              call: "POST /airhub/aircraft/${ac1_id}/land"
              payload: { inbound_weight_grams: 50000 }
              as: GatewayCoordinator
            - *k_bank_unload
            - *k_ac1_begun
            - &k_ac1_done_1402
              call: "POST /airhub/aircraft/${ac1_id}/complete-unload"
              payload: { unload_completed_minutes: 1402 }
              as: SortSupervisor
            - &k_clock1414
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T23:34:00Z" }
              as: HubOpsManager
            - &k_ac2_depart_1414
              call: "POST /airhub/aircraft/${ac2_id}/depart-origin"
              payload: {}
              as: GatewayCoordinator
            - &k_ac2_land_1414
              call: "POST /airhub/aircraft/${ac2_id}/land"
              payload: { inbound_weight_grams: 50000 }
              as: GatewayCoordinator
            - call: "POST /airhub/aircraft/${ac2_id}/begin-unload"
              payload: {}
              as: SortSupervisor
          trigger:
            - call: "POST /airhub/aircraft/${ac2_id}/complete-unload"
              payload: { unload_completed_minutes: 1414 }
              as: SortSupervisor
            - call: "GET /airhub/banks/${bank_id}"
              payload: {}
              as: SortSupervisor
              captures: { budget: $.data.effective_sort_budget_minutes }
          assert:
            - "the with-slack variant reports ${budget} == 73: N701UP contributes 45 - min(1400-1395, 45) == 40 and N702UP contributes 45 - min(1414-1402, 45) == 33"
            - "the without-slack variant over the same two aircraft reports 90"
            - "ArrivalBank.${bank_id}.effective_sort_budget_minutes == 73"
            - "the budget is neither 90 nor 78"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: sort_lane_load_three_input_branch_at_exact_capacity
        grounds:
          - calculations.sort_lane_load
          - state_machines.SortLane.transitions.AVAILABLE_to_SATURATED
          - entities.SortLane.fields.lane_load_grams
          - endpoints.POST_/airhub/packages/{package_id}/primary-sort
        distinguishing_aspect: "Mode (a): lane occupancy is a three-input branch over assigned_lane_id, the sort_status inclusion set and the lane's fixed capacity, and the boundary is exact — 60000 grams against capacity 60000 reads SATURATED while 40000 reads AVAILABLE, and a reclaimed package vacates the lane."
        test_recipe:
          setup:
            - "Clock 1410. SDF hub, primary lanes P-01/P-02/P-03, SECONDARY S-01, BANK_A with N701UP landed and unloaded, shift N-A, three GENERAL packages rated 20000 grams each, all inducted."
          setup_api_calls:
            - *k_clock
            - *k_alt_hub
            - *k_hub
            - *k_lane_p1
            - *k_lane_p2
            - *k_lane_p3
            - *k_lane_s1
            - *k_bank
            - *k_ac1
            - *k_shift
            - *k_clock1400
            - *k_ac1_depart
            - *k_ac1_land
            - *k_bank_unload
            - *k_ac1_begun
            - *k_ac1_done
            - &k_pkg_l1
              call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-L-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_l1: $.data.id }
            - &k_pkg_l2
              call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-L-0002", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_l2: $.data.id }
            - &k_pkg_l3
              call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-L-0003", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_l3: $.data.id }
            - call: "POST /airhub/packages/${pkg_l1}/induct"
              payload: { dimension_weight_grams: 20000 }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_l2}/induct"
              payload: { dimension_weight_grams: 20000 }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_l3}/induct"
              payload: { dimension_weight_grams: 20000 }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_l1}/primary-sort"
              payload: { lane_id: "${lane_p1_id}" }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_l2}/primary-sort"
              payload: { lane_id: "${lane_p1_id}" }
              as: SortOperator
          trigger:
            - call: "POST /airhub/packages/${pkg_l3}/primary-sort"
              payload: { lane_id: "${lane_p1_id}" }
              as: SortOperator
            - call: "GET /airhub/lanes/${lane_p1_id}"
              payload: {}
              as: SortOperator
              captures: { load_full: $.data.lane_load_grams, status_full: $.data.status }
            - call: "POST /airhub/packages/${pkg_l3}/reclaim-lane"
              payload: {}
              as: SortOperator
            - call: "GET /airhub/lanes/${lane_p1_id}"
              payload: {}
              as: SortOperator
              captures: { load_reclaimed: $.data.lane_load_grams, status_reclaimed: $.data.status }
            - call: "GET /airhub/lanes/concourse-width"
              payload: { hub_id: "${hub_id}", lane_kind: "PRIMARY" }
              as: SortSupervisor
              captures: { width_rating: $.data.concourse_width_rating, merged: $.data.merged_minutes, lane_count: $.data.lane_count }
          assert:
            - "at exact capacity ${load_full} == 60000 and ${status_full} == SATURATED"
            - "after the reclaim ${load_reclaimed} == 40000 and ${status_reclaimed} == AVAILABLE"
            - "SortLane.${lane_p1_id}.lane_load_grams == 40000"
            - "60000 against capacity 60000 saturates, so the capacity boundary is inclusive (>=)"
            - "the width read reports ${lane_count} == 3, ${merged} == 100 and ${width_rating} == 400 — P-01 closes at 1500 exactly where P-02 opens so they merge, while P-03 opens at 1601 and does not"

      - name: refund_batch_nested_rounding_order_pinned
        grounds:
          - calculations.refund_batch_total
          - calculations.money_back_guarantee_refund
          - endpoints.GET_/airhub/hubs/{hub_id}/refund-summary
        distinguishing_aspect: "Mode (b): the batch total rounds EACH failure's provisional value to whole cents before summing, so two OPEN NEXT_DAY_AIR failures on 250050-gram packages total 192540 while the forbidden sum-then-round-once reading yields 192539."
        test_recipe:
          setup:
            - "Clock 1500. SDF hub, BANK_A with N701UP landed and unloaded, shift N-A, two NEXT_DAY_AIR GENERAL packages weighing exactly 250050 grams each."
          setup_api_calls:
            - *k_clock
            - *k_alt_hub
            - *k_hub
            - *k_lane_p1
            - *k_lane_s1
            - *k_bank
            - *k_ac1
            - *k_shift
            - *k_clock1400
            - *k_ac1_depart
            - *k_ac1_land
            - *k_bank_unload
            - *k_ac1_begun
            - *k_ac1_done
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T01:00:00Z" }
              as: HubOpsManager
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-R-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 250050, dimension_weight_grams: 250050 }
              as: SortOperator
              captures: { pkg_r1: $.data.id }
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-R-0002", commodity_class: "GENERAL", destination_hub_code: "ORD", service_level: "NEXT_DAY_AIR", planned_weight_grams: 250050, dimension_weight_grams: 250050 }
              as: SortOperator
              captures: { pkg_r2: $.data.id }
          trigger:
            - call: "POST /airhub/failures"
              payload: { hub_id: "${hub_id}", package_id: "${pkg_r1}", cause_code: "SORT_MISS", failure_minutes: 1500 }
              as: RefundAdjuster
              captures: { fail_r1: $.data.id, fail_r1_amount: $.data.refund_amount_cents }
            - call: "POST /airhub/failures"
