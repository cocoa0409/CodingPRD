            - "${st_after2} == ACTIVE — at sample size exactly MIN_GATE_SAMPLE 2 with gate_score 1.0000 the gate does not demote"
            - "after the third audit: Reviewer ${r1_id}.audited_count == 3, agree_count == 2, accuracy_score_audit_only == 0.6667, accuracy_score_blended == 0.6667 (zero terminal appeals), status == PENDING_RETRAINING because 0.6000 <= 0.6667 < 0.8500"
