        claim_type: guarded_transitions
        grounds:
          - state_machines.CorrectiveActionPlan.SUBMITTED_to_APPROVED
          - state_machines.Inspection.CAP_REQUIRED_to_CAP_APPROVED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cap_approval_requires_and_advances_the_owning_inspection_state
          rationale: "The cross-entity guard and its write-back into the Inspection are the subject of the named §1.8 instance."

      - name: corner_cascade_down_life_threatening_urgency_raise
        claim_type: cascade_down
        grounds:
          - state_machines.Inspection.IN_PROGRESS_to_IN_PROGRESS
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_a_life_threatening_record_reaches_sweep_urgency_five_links
          rationale: "All five links of the downward cascade, including the URGENT due_at pull-in, are asserted by the named §1.8 instance."

      - name: corner_cross_entity_appeal_void_rewrites_inspection_and_property
        claim_type: cross_entity
        grounds:
          - state_machines.Deficiency.OPEN_to_VOIDED
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_b_granted_technical_appeal_void_rewrites_score_and_posture
          rationale: "Entity-A-to-entity-B adjustment across Deficiency, Inspection and Property is the subject of the named §1.8 instance."

      - name: corner_compensation_failed_verification_reversal
        claim_type: compensation
        grounds:
          - state_machines.Deficiency.CORRECTED_to_OPEN
        excluded_because:
          difficulty_instance: compensating_invariant / failed_verification_restores_the_life_threatening_counters_without_drift
          rationale: "The undo path and its no-drift assertions are the subject of the named §1.8 instance."

      - name: corner_conditional_cascade_urgency_demotion_only_when_posture_clears
        claim_type: conditional_cascade
        grounds:
          - state_machines.WorkOrder.verification_status_to_VERIFIED
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_c_verified_closure_demotes_unrelated_urgent_work_order
          rationale: "The state-conditioned link 4 demotion is asserted by the named §1.8 instance."

  - section: calculations
    instances:
      - name: moderate_inside_finding_deducts_four_point_eight_points
        claim_type: correct_result
        grounds:
          - calculations.deficiency_points_deducted
          - entities.Deficiency.fields.points_deducted
          - entities.Deficiency.fields.correction_due_at
        distinguishing_aspect: |
          A MODERATE INSIDE defect with base_point_value 6.00 must deduct
          6.00 x 1.0 (MODERATE) x 0.8 (INSIDE) = 4.80 - the area multiplier applies to inside and
          outside areas as well as units, and correction_due_at must be observed_at plus the
          definition's own 720 hours (2026-09-02T09:00:00.000Z), not the 24-hour life-threatening
          deadline.
        test_recipe:
          setup:
            - "ADOPTED NSPIRE-2026 with LT_GAS and MOD_HANDRAIL (INSIDE, MODERATE, base 6.00, deadline 720)."
            - "Property Cedar Walk with unit 101 and an IN_PROGRESS ALL_AREAS sweep."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "LT_GAS", name: "Gas leak at range connection", inspectable_area: "UNIT", severity: "LIFE_THREATENING", base_point_value: 10.00, correction_deadline_hours: 24 }
              as: PlatformAdmin
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "MOD_HANDRAIL", name: "Loose stairwell handrail", inspectable_area: "INSIDE", severity: "MODERATE", base_point_value: 6.00, correction_deadline_hours: 720 }
              as: PlatformAdmin
              captures: { dd_mod: $.data.id }
            - call: "POST /inspection-standards/${std_id}/adopt"
              payload: { adopted_at: "2026-01-02T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Cedar Walk", total_unit_count: 1, capital_reserve_cents: 500000, owner_contact_email: "owner@cedar.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "101", bedroom_count: 1, occupancy_status: "OCCUPIED" }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /self-assessment-sweeps"
              payload: { property_id: "${prop_id}", window_start: "2026-08-02T00:00:00.000Z", window_end: "2026-08-20T00:00:00.000Z", planned_area_scope: "ALL_AREAS" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw_id: $.data.id }
            - call: "POST /self-assessment-sweeps/${sw_id}/start"
              payload: { started_at: "2026-08-02T08:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw_v1: $.data.version }
          trigger:
            - call: "POST /self-assessment-sweeps/${sw_id}/findings"
              payload: { expected_sweep_version: "${sw_v1}", defect_definition_id: "${dd_mod}", inspectable_area: "INSIDE", observed_at: "2026-08-03T09:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { wo_id: $.data.id, def_id: $.data.deficiency_id }
          assert:
            - "the trigger returns HTTP 201"
            - "Deficiency.${def_id}.points_deducted == 4.80"
            - "Deficiency.${def_id}.inspectable_area == INSIDE and Deficiency.${def_id}.unit_id is null"
            - "Deficiency.${def_id}.source == SELF_ASSESSMENT and Deficiency.${def_id}.inspection_id is null"
            - "Deficiency.${def_id}.correction_due_at == 2026-09-02T09:00:00.000Z"
            - "Deficiency.${def_id}.status == OPEN"
            - "WorkOrder.${wo_id}.due_at == 2026-09-02T09:00:00.000Z and WorkOrder.${wo_id}.priority_tier == ROUTINE"
            - "Property.${prop_id}.open_severe_count == 0 and Property.${prop_id}.open_life_threatening_count == 0"
            - "Property.${prop_id}.readiness_posture == READY"

      - name: sampling_eligibility_excludes_down_units_and_clamps_the_tier
        claim_type: input_set_filtering
        grounds:
          - calculations.unit_sample_size
          - entities.Unit.fields.occupancy_status
          - entities.Inspection.fields.sample_tier_value
          - entities.Inspection.fields.sample_size
        distinguishing_aspect: |
          sample_tier_value is computed from the DECLARED total_unit_count 4 and stays 4, while the
          eligibility filter admits only OCCUPIED and VACANT units, so the DOWN unit never enters the
          candidate pool and sample_size is clamped to 2. Both numbers must be observable and
          different - an implementation that filters after clamping, or that treats DOWN as
          eligible, produces 4 slots or a slot on the DOWN unit.
        test_recipe:
          setup:
            - "ADOPTED NSPIRE-2026; Property Maple Court declares total_unit_count 4 and carries unit 101 OCCUPIED, unit 102 VACANT and unit 103 DOWN."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "LT_GAS", name: "Gas leak at range connection", inspectable_area: "UNIT", severity: "LIFE_THREATENING", base_point_value: 10.00, correction_deadline_hours: 24 }
              as: PlatformAdmin
            - call: "POST /inspection-standards/${std_id}/adopt"
              payload: { adopted_at: "2026-01-02T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Maple Court", total_unit_count: 4, capital_reserve_cents: 1000000, owner_contact_email: "owner@maple.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "101", bedroom_count: 2, occupancy_status: "OCCUPIED" }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "102", bedroom_count: 1, occupancy_status: "VACANT" }
              as: PlatformAdmin
              captures: { u2_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "103", bedroom_count: 3, occupancy_status: "DOWN" }
              as: PlatformAdmin
              captures: { u3_id: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", standard_id: "${std_id}", scheduled_start: "2026-09-10T09:00:00.000Z", scheduled_end: "2026-09-10T17:00:00.000Z", inspection_kind: "INITIAL" }
              as: HousingAgencyInspector
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /inspections/${insp_id}/draw-sample"
              payload: { drawn_at: "2026-08-02T00:00:00.000Z" }
              as: HousingAgencyInspector
          assert:
            - "the trigger returns HTTP 200"
            - "Inspection.${insp_id}.sample_tier_value == 4"
            - "Inspection.${insp_id}.sample_size == 2"
            - "GET /sample-selections?inspection_id=${insp_id} has total_count == 2"
            - "GET /sample-selections?inspection_id=${insp_id}&unit_id=${u3_id} has total_count == 0"
            - "the selection ranks over units ${u1_id} and ${u2_id} are exactly 1 and 2, assigned by created_at ASC because both have prior_deficiency_count 0"

      - name: notice_lead_of_exactly_forty_eight_hours_passes_the_floor
        claim_type: constants_applied
        grounds:
          - calculations.notice_lead_hours
          - validations[priority=70]
          - state_machines.Inspection.NOTIFIED_to_IN_PROGRESS
        distinguishing_aspect: |
          NOTICE_LEAD_HOURS_MIN is 48.00 and the gate is `>=`, so a notice issued exactly 48 hours
          before scheduled_start must let the inspection start. The computed lead must read 48.00
          to two decimals rather than 48 or 47.99, and the gate must not be implemented as `>`.
        test_recipe:
          setup:
            - "ADOPTED NSPIRE-2026; Property Cedar Walk (total_unit_count 1) with unit 101."
