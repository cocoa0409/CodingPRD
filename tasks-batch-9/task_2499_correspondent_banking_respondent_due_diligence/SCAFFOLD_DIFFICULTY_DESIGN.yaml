            - { call: "POST /correspondent-banking/closure-plans/${l_plan}/settlement-allocation", payload: { action: "ALLOCATE", amount_cents: 7000001 }, as: FIGRelationshipManager, as_user_id: "user-rm-01" }
            - { call: "POST /correspondent-banking/closure-plans/${l_plan}/settlement-allocation", payload: { action: "ALLOCATE", amount_cents: 7000000 }, as: FIGRelationshipManager, as_user_id: "user-rm-01" }
