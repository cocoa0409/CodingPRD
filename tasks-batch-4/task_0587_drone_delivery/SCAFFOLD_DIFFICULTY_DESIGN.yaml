            - "Order.${order_2}.status == QUOTED after the rejection"
            - "dispatch of ${order_3} at clock 09:16 (candidate hold [09:26, 09:41], disjoint) -> 201"
            - "Flight.${flight_3}.pad_hold_start == 2026-06-01T09:26:00Z and Flight.${flight_3}.pad_hold_end == 2026-06-01T09:41:00Z"
            - "GET /nests?service_area_id=${sa_id} shows Nest.${nest_id}.reserved_pads == 2"

      - name: maintenance_window_half_open_exclusive_adjacency
        grounds:
          - calculations.maintenance_window_conflict
          - "validations[priority=18]"
          - "errors[ERR_MAINTENANCE_WINDOW_CONFLICT]"
          - entities.MaintenanceLog.fields.scheduled_start
        distinguishing_aspect: |
          Interval semantics #2, resource = Drone (a different resource entity from Nest, with
          different geometry): HALF-OPEN [start, end) intervals, ZERO buffer and EXCLUSIVE capacity 1.
          A window starting exactly at an existing window's end (12:00Z) is legal adjacency and is
          accepted, whereas one starting a single minute earlier (11:59Z) overlaps and is rejected —
          the opposite endpoint behaviour to the Nest's closed, aggregate-capacity holds.
        test_recipe:
          setup:
            - "Clock 2026-06-01T09:00:00Z; Bay + nest N1; drone N101 IDLE with a READY pack."
            - "An INSPECTION window [2026-06-02T10:00:00Z, 2026-06-02T12:00:00Z) is already SCHEDULED on the drone (this bumps Drone.version, so later OCC calls must re-read it)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-areas"
              payload: { name: "Bay", center_lat: 37.0, center_lon: -122.0, max_range_km: 12.0, max_payload_g: 2500 }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /nests"
              payload: { service_area_id: "${sa_id}", name: "N1", lat: 37.0, lon: -122.0, pad_count: 2, status: "OPEN" }
              as: PlatformAdmin
              captures: { nest_id: $.data.id }
            - call: "POST /batteries"
              payload: { nest_id: "${nest_id}", serial: "B-1", charge_pct: 100, cycle_count: 0 }
              as: MaintenanceTech
              captures: { bat_id: $.data.id }
            - call: "POST /batteries/${bat_id}/charge"
              payload: { target_charge_pct: 100 }
              as: MaintenanceTech
            - call: "POST /drones"
              payload: { home_nest_id: "${nest_id}", tail_number: "N101", airframe_class: "HEAVY", max_payload_g: 2500, cruise_speed_kmh: 60, hours_since_service: 0 }
              as: PlatformAdmin
              captures: { drone_id: $.data.id, drone_v1: $.data.version }
            - call: "POST /maintenance-logs"
              payload: { drone_id: "${drone_id}", work_type: "INSPECTION", scheduled_start: "2026-06-02T10:00:00Z", scheduled_end: "2026-06-02T12:00:00Z", expected_drone_version: "${drone_v1}", notes: "100-hour inspection" }
              as: MaintenanceTech
              as_user_id: "mt-1"
              captures: { ml_1: $.data.id }
            - call: "GET /drones/${drone_id}"
              payload: {}
              as: MaintenanceTech
              as_user_id: "mt-1"
              captures: { drone_v2: $.data.version }
          trigger:
            - call: "POST /maintenance-logs"
              payload: { drone_id: "${drone_id}", work_type: "REPAIR", scheduled_start: "2026-06-02T11:59:00Z", scheduled_end: "2026-06-02T13:00:00Z", expected_drone_version: "${drone_v2}", notes: "overlapping by one minute" }
              as: MaintenanceTech
              as_user_id: "mt-1"
            - call: "POST /maintenance-logs"
              payload: { drone_id: "${drone_id}", work_type: "REPAIR", scheduled_start: "2026-06-02T12:00:00Z", scheduled_end: "2026-06-02T13:00:00Z", expected_drone_version: "${drone_v2}", notes: "adjacent, no overlap" }
              as: MaintenanceTech
              as_user_id: "mt-1"
              captures: { ml_2: $.data.id }
          assert:
            - "the 11:59Z window -> 409 with error_id ERR_MAINTENANCE_WINDOW_CONFLICT"
            - "the 12:00Z window (starting exactly at the existing window's exclusive end) -> 201"
            - "MaintenanceLog.${ml_2}.status == SCHEDULED and MaintenanceLog.${ml_2}.scheduled_start == 2026-06-02T12:00:00Z"
            - "GET /maintenance-logs?drone_id=${drone_id} returns exactly 2 logs, both SCHEDULED"

  # ===================================================================================
  - rule_id: compensating_invariant
    instances:
      - name: dispatch_then_abort_conserves_customer_funds
        grounds:
          - calculations.customer_funds_ledger
          - entities.Customer.fields.held_total
          - entities.Customer.fields.billed_total
          - state_machines.Flight.PLANNED_to_ABORTED
          - state_machines.Order.ASSIGNED_to_QUOTED
        distinguishing_aspect: |
          Conserved quantity #1 = MONEY. The forward action (dispatch) sets
          Customer.held_total = 8.96 and its compensating action (abort) must restore it to EXACTLY
          0.00, with billed_total still 0.00 and the pinned formula
          held_total == sum(order_total over the customer's ASSIGNED|IN_TRANSIT orders) holding
          afterwards — zero drift, no partial release.
        test_recipe:
          setup:
            - "Clock 2026-06-01T09:00:00Z; Bay + nest N1 (2 pads); drone N101 with a READY 100% pack."
            - "Order 2000 g STANDARD => order_total 8.96; before dispatch Customer.held_total == 0.00."
            - "Order dispatched (Flight PLANNED), so held_total == 8.96 and Order.status == ASSIGNED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-areas"
              payload: { name: "Bay", center_lat: 37.0, center_lon: -122.0, max_range_km: 12.0, max_payload_g: 2500 }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /nests"
              payload: { service_area_id: "${sa_id}", name: "N1", lat: 37.0, lon: -122.0, pad_count: 2, status: "OPEN" }
              as: PlatformAdmin
              captures: { nest_id: $.data.id }
            - call: "POST /batteries"
              payload: { nest_id: "${nest_id}", serial: "B-1", charge_pct: 100, cycle_count: 0 }
              as: MaintenanceTech
              captures: { bat_id: $.data.id }
            - call: "POST /batteries/${bat_id}/charge"
              payload: { target_charge_pct: 100 }
              as: MaintenanceTech
            - call: "POST /drones"
              payload: { home_nest_id: "${nest_id}", tail_number: "N101", airframe_class: "HEAVY", max_payload_g: 2500, cruise_speed_kmh: 60, hours_since_service: 0 }
              as: PlatformAdmin
              captures: { drone_id: $.data.id }
            - call: "POST /drones/${drone_id}/install-battery"
              payload: { battery_id: "${bat_id}" }
              as: MaintenanceTech
            - call: "POST /customers"
              payload: { name: "Ann", email: "ann@x.com", dropoff_lat: 37.05, dropoff_lon: -122.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_area_id: "${sa_id}", payload_weight_g: 2000, priority: "STANDARD" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /orders/${order_id}/dispatch"
              payload: { nest_id: "${nest_id}", expected_order_version: "${order_v}" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { flight_id: $.data.id }
          trigger:
            - call: "POST /flights/${flight_id}/abort"
              payload: {}
              as: FlightDirector
              as_user_id: "fd-1"
          assert:
            - "Order.${order_id}.order_total == 8.96"
            - "before the abort: Customer.${cust_id}.held_total == 8.96"
            - "after the abort: Customer.${cust_id}.held_total == 0.00"
            - "after the abort: Customer.${cust_id}.billed_total == 0.00"
            - "Order.${order_id}.status == QUOTED and Flight.${flight_id}.ops_state == ABORTED with abort_reason == OPERATOR"
            - "Battery.${bat_id}.state == READY and Battery.${bat_id}.cycle_count == 0 (the pack never left READY on a PLANNED abort)"

      - name: dispatch_then_abort_conserves_nest_pad_slots
        grounds:
          - calculations.nest_pad_ledger
          - entities.Nest.fields.reserved_pads
          - state_machines.Flight.LAUNCHED_to_ABORTED
          - state_machines.Order.IN_TRANSIT_to_QUOTED
        distinguishing_aspect: |
          Conserved quantity #2 = PHYSICAL PAD SLOTS (a capacity count, not money). On a 1-pad nest
          the forward action (dispatch) drives reserved_pads 0 -> 1, saturating the nest; the
          compensating abort of the LAUNCHED sortie must drive it back to exactly 0 so that the
          pinned formula reserved_pads == count(non-terminal flights recovering here) holds and the
          very same order can be re-dispatched onto the freed slot.
        test_recipe:
          setup:
            - "Clock 2026-06-01T09:00:00Z; Bay + nest N1 with pad_count == 1; drone N101 with a READY 100% pack."
            - "Order 2000 g dispatched, authorized, released and LAUNCHED: Nest.reserved_pads == 1, Order IN_TRANSIT, Battery IN_USE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-areas"
