      - name: regress_cascade_expires_clearance_and_recomputes_tier
        grounds:
          - state_machines.RTPProtocol.AWAITING_CLEARANCE_to_REGRESSED
          - state_machines.ClearanceAuthorization.PENDING_to_EXPIRED
