          trigger:
            - call: "POST /product-safety/incidents/${inc_id}/classify"
              payload: { injury_class: "SPRAINED_ANKLE", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/hazard-patterns"
              payload: { product_model_id: "${pm_id}", window_start: "2026-02-28T00:00:00Z", window_end: "2026-01-01T00:00:00Z", analysis_basis: "PRELIMINARY", expected_product_model_version: "${pm_v1}" }
