            - "Contest Q at South 2026-09-20 23:00Z to 2026-09-21 01:00Z, whose buffered window begins exactly at 21:30Z."
            - "Contest R at East 2026-09-20 22:59Z to 2026-09-21 00:59Z, whose buffered window begins at 21:29Z, one minute inside P's."
