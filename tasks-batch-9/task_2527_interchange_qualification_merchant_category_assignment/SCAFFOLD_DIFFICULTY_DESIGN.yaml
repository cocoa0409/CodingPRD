          - validations[priority=33]
          - errors[ERR_ENROLLMENT_CLOSED]
          - errors[ERR_INCENTIVE_CAPACITY_EXCEEDED]
          - state_machines.IncentiveProgram.OPEN_to_CLOSED_FULL
        distinguishing_aspect: |
          Pairs a STATE category rule (priority 9) against a BUSINESS_FISCAL category rule
          (priority 33) on the same request: the program is CLOSED_FULL and the 6000000 commitment
          also exceeds the 4000000 uncommitted capacity, so both are violated, and the state error
          ERR_ENROLLMENT_CLOSED must win.
        test_recipe:
          setup:
            - "Clock at 2026-09-03T00:00:00Z; one platform, one US/USD acquirer; MCC 5411 defined."
            - "Incentive program with total_capacity_cents 100000000, min_commitment_cents 5000000, reopen_threshold_cents 5000000 and eligible_mcc_codes [\"5411\"]."
            - "Merchant A ENROLLED for 96000000, so uncommitted_capacity_cents is 4000000 and the program is CLOSED_FULL."
            - "Merchant B is VERIFIED, eligible and not yet enrolled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /processing-platforms"
