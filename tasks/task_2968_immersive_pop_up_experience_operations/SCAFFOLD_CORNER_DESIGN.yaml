      - name: individually_legal_orders_collectively_exhaust_the_window
        claim_type: aggregate_validation
        grounds:
          - validations[priority 130]
          - errors[ERR_SLOT_CAPACITY_EXCEEDED]
          - endpoints[POST /ticket-orders].side_effects
        distinguishing_aspect: |
          Every single order here is legal on its own — 8 guests is under the group maximum of 12 and
          far under the 20-seat window — but the third one is refused because the collective hold
          would exceed the window. The check must read the LIVE available_capacity that earlier
          PENDING orders already decremented, not base_capacity, and the boundary is inclusive: a
          party that exactly consumes the last seats is accepted while one seat more is refused. A
          cancellation then returns its hold, so the same 8-seat request that was refused at
          available 4 succeeds at available 8.
        test_recipe:
          setup:
            - "The LIGHT CHAIN through run creation plus one 40-seat 15-minute room (effective_capacity 120), one released 20-seat slot and one ACTIVE guest."
