              payload: { email: "v2@example.com", full_name: "Vera Two", household_hash: "HH-V2" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trial-orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", channel: "DTC", gross_price_cents: 120000 }
