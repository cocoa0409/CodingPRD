  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: audition_revision_cycle_recomputes_composite_from_new_round
        grounds:
          - state_machines.Audition.SCORED_to_REVISION_REQUESTED
          - state_machines.Audition.REVISION_REQUESTED_to_SCHEDULED
          - entities.Audition.fields.revision_round
          - entities.PanelScore.fields.revision_round
          - calculations.audition_composite
          - validations[priority=62]
        distinguishing_aspect: |
          Cycle on the Audition entity: SCORED -> REVISION_REQUESTED -> SCHEDULED
          -> SCORED returns to a state the row already occupied, but the loop is
          not a no-op - revision_round advances, the round-0 PanelScore rows stay
          in the database yet leave the composite input set, and the same
          panelists may legally re-score because uniqueness is keyed on
          (audition_id, panelist_id, revision_round).
        test_recipe:
          setup:
            - "Season in AUDITIONS_OPEN with two VIOLIN slots on different days sharing the same three panelists."
            - "One audition SCORED at composite_provisional_score 66.60 from three round-0 sheets of 66.60."
