  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: send_on_suspended_account_with_missing_consent
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_ACCOUNT_SUSPENDED]
          - errors[ERR_NO_CONSENT]
        distinguishing_aspect: |
          Pair business_safety(4) vs business_safety(6): a send on a SUSPENDED
          account to a recipient with NO consent record violates both the
          account gate and the consent gate; priority 4 wins, so the response
          is ERR_ACCOUNT_SUSPENDED, not ERR_NO_CONSENT.
        test_recipe:
          setup:
            - "Account suspended after full setup: VERIFIED brand, APPROVED TEN_DLC campaign with attached ACTIVE number; NO consent record for +15550000030"
          setup_api_calls:
            - call: "POST /messaging/accounts"
              payload: { name: "Acme", plan_tier: "PREMIUM", country_code: "US" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands"
              payload: { legal_name: "Acme Corp", tax_id: "12-3456789", business_type: "PUBLIC_PROFIT", address_line1: "1 Main St", city: "Springfield", region_code: "IL", postal_code: "62701", country_code: "US", website_url: "https://acme.example", opt_in_mechanism: "WEB_FORM" }
              as: BrandManager
              captures: { brand: $.data.id }
