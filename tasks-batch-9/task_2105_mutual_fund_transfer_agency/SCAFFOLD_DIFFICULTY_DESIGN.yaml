scaffold_difficulty_design:
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: roa_basis_variant_diverges_between_direct_and_omnibus_household
        grounds:
          - calculations.roa_household_basis
          - calculations.purchase_trade_pricing
          - entities.ShareholderAccount.fields.account_channel
          - entities.ShareholderAccount.fields.household_basis_variant
          - entities.Trade.fields.roa_basis_variant
        distinguishing_aspect: |
          This dual variant lives on the ShareholderAccount domain: two accounts holding byte-identical
          positions (5730.000 shares bought for 60000.00) qualify for different breakpoint tiers purely
          because account_channel selects MARKET_VALUE_BASIS (63030.00) versus HISTORICAL_COST_BASIS
          (60000.00), so the same 37000.00 order is charged 0.035 on the direct account and 0.045 on the
          omnibus account.
        test_recipe:
          setup:
            - "Fund MER with a class A whose breakpoint tiers are 0/0.0575, 50000/0.045, 100000/0.035."
            - "One CA blue-sky registration for class A with 1000000.00 registered."
            - "Account D is DIRECT/CA and account O is OMNIBUS/CA, both ACTIVE, both holding exactly 5730.000 class A shares with cost_basis_amount 60000.00."
            - "NAV 2026-08-03 is 10.0000 FINAL and NAV 2026-08-04 is 11.0000 FINAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FundAccountant
            - call: "POST /funds"
              payload: { name: "Meridian Growth Fund", fund_family_code: "MER", cutoff_time_utc: "16:00:00" }
              as: FundAccountant
              captures: { fund_id: $.data.id }
            - call: "POST /share-classes"
              payload: { fund_id: "${fund_id}", class_code: "A", seed_nav_per_share: 10.0000, breakpoint_tiers: [{min_qualifying_amount: 0, load_pct: 0.0575}, {min_qualifying_amount: 50000, load_pct: 0.045}, {min_qualifying_amount: 100000, load_pct: 0.035}], cdsc_enabled: false }
              as: FundAccountant
              captures: { sc_a: $.data.id }
            - call: "POST /blue-sky-registrations"
              payload: { share_class_id: "${sc_a}", state_code: "CA", registered_amount: 1000000.00, effective_date: "2026-01-01", expiration_date: "2027-01-01" }
              as: ComplianceOfficer
              captures: { bs_ca: $.data.id }
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "CA", tax_id: "111-22-3333", primary_owner_name: "Ada Direct", dividend_option: "CASH" }
              as: TransferAgentOperator
              captures: { acc_d: $.data.id }
            - call: "POST /shareholder-accounts/${acc_d}/activate"
              payload: { tin_certified: true }
              as: TransferAgentOperator
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "OMNIBUS", state_code: "CA", tax_id: "222-33-4444", primary_owner_name: "Omni Nominee", dividend_option: "CASH", dealer_firm_code: "DLR001" }
              as: TransferAgentOperator
              captures: { acc_o: $.data.id }
            - call: "POST /shareholder-accounts/${acc_o}/activate"
              payload: { tin_certified: true }
              as: TransferAgentOperator
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_a}", valuation_date: "2026-08-03", total_net_assets: 0.00 }
              as: FundAccountant
              captures: { nav1: $.data.id }
            - call: "POST /nav-records/${nav1}/finalize"
              payload: {}
              as: FundAccountant
            - call: "POST /trades"
              payload: { account_id: "${acc_d}", share_class_id: "${sc_a}", trade_type: "PURCHASE", gross_amount: 60000.00 }
              as: TransferAgentOperator
              captures: { t_d1: $.data.id }
            - call: "POST /trades/${t_d1}/price"
              payload: {}
              as: TransferAgentOperator
            - call: "POST /trades/${t_d1}/settle"
              payload: {}
              as: TransferAgentOperator
            - call: "POST /trades"
              payload: { account_id: "${acc_o}", share_class_id: "${sc_a}", trade_type: "PURCHASE", gross_amount: 60000.00 }
              as: TransferAgentOperator
              captures: { t_o1: $.data.id }
            - call: "POST /trades/${t_o1}/price"
              payload: {}
              as: TransferAgentOperator
            - call: "POST /trades/${t_o1}/settle"
              payload: {}
              as: TransferAgentOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: FundAccountant
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_a}", valuation_date: "2026-08-04", total_net_assets: 126060.00 }
              as: FundAccountant
              captures: { nav2: $.data.id }
            - call: "POST /nav-records/${nav2}/finalize"
              payload: {}
              as: FundAccountant
          trigger:
            - call: "POST /trades"
              payload: { account_id: "${acc_d}", share_class_id: "${sc_a}", trade_type: "PURCHASE", gross_amount: 37000.00 }
              as: TransferAgentOperator
              captures: { t_d2: $.data.id }
            - call: "POST /trades/${t_d2}/price"
              payload: {}
              as: TransferAgentOperator
            - call: "POST /trades"
              payload: { account_id: "${acc_o}", share_class_id: "${sc_a}", trade_type: "PURCHASE", gross_amount: 37000.00 }
              as: TransferAgentOperator
              captures: { t_o2: $.data.id }
            - call: "POST /trades/${t_o2}/price"
              payload: {}
              as: TransferAgentOperator
          assert:
            - "Trade.${t_d2}.roa_basis_variant == MARKET_VALUE_BASIS"
            - "Trade.${t_d2}.roa_qualifying_amount == 100030.00"
            - "Trade.${t_d2}.sales_load_pct == 0.035"
            - "Trade.${t_d2}.sales_load_amount == 1295.00"
            - "Trade.${t_d2}.net_invested_amount == 35705.00"
            - "Trade.${t_d2}.shares_transacted == 3245.909"
            - "Trade.${t_o2}.roa_basis_variant == HISTORICAL_COST_BASIS"
            - "Trade.${t_o2}.roa_qualifying_amount == 97000.00"
            - "Trade.${t_o2}.sales_load_pct == 0.045"
            - "Trade.${t_o2}.sales_load_amount == 1665.00"
            - "Trade.${t_o2}.net_invested_amount == 35335.00"
            - "Trade.${t_o2}.shares_transacted == 3212.273"
            - "Trade.${t_d2}.shares_transacted != Trade.${t_o2}.shares_transacted for identical gross_amount 37000.00 and identical NAV 11.0000"

      - name: trade_pricing_variant_provisional_versus_final_share_quantity
        grounds:
          - calculations.purchase_trade_pricing
          - calculations.nav_per_share_strike
          - state_machines.Trade.RECEIVED_to_PRICED_PROVISIONAL
          - state_machines.Trade.PRICED_PROVISIONAL_to_PRICED_FINAL
          - state_machines.NavRecord.PRELIMINARY_to_PRELIMINARY
          - entities.Trade.fields.pricing_variant
        distinguishing_aspect: |
          This dual variant lives on the Trade domain, not the account domain: one and the same order
          carries 1713.636 shares while priced PRELIMINARY_NAV at 11.0000 and 1683.036 shares once the
          preliminary strike is revised to 11.2000 and finalized, so the provisional and final variants
          of purchase_trade_pricing produce different share counts from identical order inputs.
        test_recipe:
          setup:
            - "Class A with tiers 0/0.0575, 50000/0.045, 100000/0.035 and a CA registration of 1000000.00."
            - "Account P is DIRECT/CA and ACTIVE with no holdings; account S is DIRECT/CA and ACTIVE holding 5730.000 shares so the class has a non-zero share balance."
            - "NAV 2026-08-04 exists as a PRELIMINARY strike of 11.0000 (total net assets 63030.00 over 5730.000 shares)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FundAccountant
            - call: "POST /funds"
              payload: { name: "Meridian Growth Fund", fund_family_code: "MER", cutoff_time_utc: "16:00:00" }
              as: FundAccountant
              captures: { fund_id: $.data.id }
            - call: "POST /share-classes"
              payload: { fund_id: "${fund_id}", class_code: "A", seed_nav_per_share: 10.0000, breakpoint_tiers: [{min_qualifying_amount: 0, load_pct: 0.0575}, {min_qualifying_amount: 50000, load_pct: 0.045}, {min_qualifying_amount: 100000, load_pct: 0.035}], cdsc_enabled: false }
              as: FundAccountant
              captures: { sc_a: $.data.id }
            - call: "POST /blue-sky-registrations"
              payload: { share_class_id: "${sc_a}", state_code: "CA", registered_amount: 1000000.00, effective_date: "2026-01-01", expiration_date: "2027-01-01" }
              as: ComplianceOfficer
              captures: { bs_ca: $.data.id }
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "CA", tax_id: "333-44-5555", primary_owner_name: "Seed Holder", dividend_option: "CASH" }
              as: TransferAgentOperator
              captures: { acc_s: $.data.id }
            - call: "POST /shareholder-accounts/${acc_s}/activate"
              payload: { tin_certified: true }
              as: TransferAgentOperator
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "CA", tax_id: "444-55-6666", primary_owner_name: "Pat Buyer", dividend_option: "CASH" }
              as: TransferAgentOperator
              captures: { acc_p: $.data.id }
            - call: "POST /shareholder-accounts/${acc_p}/activate"
              payload: { tin_certified: true }
              as: TransferAgentOperator
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_a}", valuation_date: "2026-08-03", total_net_assets: 0.00 }
              as: FundAccountant
              captures: { nav1: $.data.id }
            - call: "POST /nav-records/${nav1}/finalize"
              payload: {}
              as: FundAccountant
            - call: "POST /trades"
              payload: { account_id: "${acc_s}", share_class_id: "${sc_a}", trade_type: "PURCHASE", gross_amount: 60000.00 }
              as: TransferAgentOperator
              captures: { t_s1: $.data.id }
            - call: "POST /trades/${t_s1}/price"
              payload: {}
              as: TransferAgentOperator
            - call: "POST /trades/${t_s1}/settle"
              payload: {}
              as: TransferAgentOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: FundAccountant
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_a}", valuation_date: "2026-08-04", total_net_assets: 63030.00 }
              as: FundAccountant
              captures: { nav2: $.data.id }
          trigger:
            - call: "POST /trades"
              payload: { account_id: "${acc_p}", share_class_id: "${sc_a}", trade_type: "PURCHASE", gross_amount: 20000.00 }
              as: TransferAgentOperator
              captures: { t_p: $.data.id }
            - call: "POST /trades/${t_p}/price"
              payload: {}
              as: TransferAgentOperator
            - call: "POST /nav-records/${nav2}/repost"
              payload: { total_net_assets: 64176.00 }
              as: FundAccountant
            - call: "POST /nav-records/${nav2}/finalize"
              payload: {}
              as: FundAccountant
            - call: "POST /trades/${t_p}/price"
              payload: {}
              as: TransferAgentOperator
          assert:
            - "after the first price call Trade.${t_p}.pricing_variant == PRELIMINARY_NAV"
            - "after the first price call Trade.${t_p}.execution_status == PRICED_PROVISIONAL"
            - "after the first price call Trade.${t_p}.nav_per_share_applied == 11.0000"
            - "after the first price call Trade.${t_p}.shares_transacted == 1713.636"
            - "NavRecord.${nav2}.nav_per_share == 11.2000 after the repost"
            - "after the second price call Trade.${t_p}.pricing_variant == FINAL_NAV"
            - "after the second price call Trade.${t_p}.execution_status == PRICED_FINAL"
            - "after the second price call Trade.${t_p}.nav_per_share_applied == 11.2000"
            - "after the second price call Trade.${t_p}.shares_transacted == 1683.036"
            - "Trade.${t_p}.sales_load_amount == 1150.00 in both variants"
            - "Trade.${t_p}.settlement_status == UNSETTLED throughout"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: distribution_rounds_each_payment_to_cents_before_summing_totals
        grounds:
          - calculations.distribution_payment_amounts
          - state_machines.Distribution.DECLARED_to_RECORDED
          - state_machines.Distribution.RECORDED_to_PAID
          - entities.Distribution.fields.total_gross_amount
          - entities.DistributionPayment.fields.gross_amount
        distinguishing_aspect: |
          Mode (b) of the combinatorial rule: nested rounding whose ORDER changes the answer. Rounding
          each of the three payments to cents first and then summing yields total_gross_amount 942.06,
          whereas summing 7634.250 shares and rounding once yields 942.07; the scaffold pins the former.
        test_recipe:
          setup:
            - "Class A, CA registration of 1000000.00, NAV 2026-08-03 10.0000 FINAL and NAV 2026-08-04 11.0000 FINAL."
            - "Three ACTIVE DIRECT/CA accounts holding 4524.000, 2356.250 and 754.000 class A shares."
            - "Account 1 reinvests and is TIN certified, account 2 takes cash and is TIN certified, account 3 reinvests and is NOT TIN certified."
            - "An ORDINARY_INCOME distribution of 0.1234 per share with record 2026-08-04, ex 2026-08-04 and pay 2026-08-05."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FundAccountant
            - call: "POST /funds"
              payload: { name: "Meridian Growth Fund", fund_family_code: "MER", cutoff_time_utc: "16:00:00" }
              as: FundAccountant
