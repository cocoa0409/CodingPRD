      - name: distribution_create_without_applicable_policy_or_in_range_window
        claim_type: violation_to_error
        grounds: ["validations[priority=29]", "validations[priority=14]", "errors[ERR_NO_APPLICABLE_POLICY]", "errors[ERR_WINDOW_CONFLICT]"]
        distinguishing_aspect: "With no adopted policy the create fails ERR_NO_APPLICABLE_POLICY; a fiscal year outside [inception, current+1] fails ERR_WINDOW_CONFLICT — and the window check (priority 14) fires before the policy lookup (priority 29)."
        test_recipe:
          setup: ["pool (inception 2026, quarter 0); ACTIVE fund FNP; NO policy exists"]
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool NP", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { np_pool: $.data.id } }
            - { call: "POST /endowment/funds", payload: { pool_id: "${np_pool}", fund_code: "FNP", fund_name: "Fund NP", endowment_class: TRUE_ENDOWMENT, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer, captures: { np_fund: $.data.id } }
            - { call: "POST /endowment/donors", payload: { donor_name: "D NP", donor_type: INDIVIDUAL }, as: DevelopmentOfficer, captures: { np_donor: $.data.id } }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${np_fund}", donor_id: "${np_donor}", external_ref: "NP1", gift_type: CORPUS, amount_cents: 5000000 }, as: DevelopmentOfficer }
            - { call: "POST /endowment/funds/${np_fund}/activate", payload: {}, as: DevelopmentOfficer }
          trigger:
            - { call: "POST /endowment/distributions", payload: { fund_id: "${np_fund}", fiscal_year: 2028 }, as: DevelopmentOfficer, captures: { np_err1: $.data.error_id } }
            - { call: "POST /endowment/distributions", payload: { fund_id: "${np_fund}", fiscal_year: 2026 }, as: DevelopmentOfficer, captures: { np_err2: $.data.error_id } }
          assert:
            - "fiscal_year 2028 (beyond current 2026 + 1): http 409 ERR_WINDOW_CONFLICT (priority 14 fires first — no policy exists either)"
            - "fiscal_year 2026 (in range): http 422 ERR_NO_APPLICABLE_POLICY"

