              captures: { syl2_id: $.data.id }
            - call: "POST /actuarial/exams"
              payload: { exam_code: "P2", title: "Probability (2026 syllabus)", credit_hours: 10, syllabus_version_id: "${syl2_id}" }
              as: Registrar
              captures: { exam_p2_id: $.data.id }
          trigger:
