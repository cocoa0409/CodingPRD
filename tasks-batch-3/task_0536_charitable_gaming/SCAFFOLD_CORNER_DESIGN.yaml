            - { call: "POST /licenses", payload: { organization_id: "${org_id}", license_type: "BINGO", contact_email: "tt@x.org", venue_name: "Hall" }, as: OrgOfficer, as_user_id: "${org_id}", captures: { lic_id: "$.data.id" } }
