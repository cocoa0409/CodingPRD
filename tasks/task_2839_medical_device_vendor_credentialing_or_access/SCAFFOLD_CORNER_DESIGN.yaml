  - section: cross-cutting complexity layers
    instances:

      - name: stale_vendor_version_on_a_second_request_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.pir-create-stale-vendor
          - errors[ERR_STALE_VENDOR_VERSION]
        distinguishing_aspect: "The first successful create is what invalidates the caller's read: replaying the same expected_vendor_version 0 for a second request is refused 412, and the retry with the re-read version succeeds — so the guard is a version comparison, not a duplicate-payload check."
        test_recipe:
          setup:
            - "Facility OV-66 and vendor OCCV exist; the vendor was read at version 0."
            - "One product-introduction request has already been created with expected_vendor_version 0, which moved the vendor to version 1."
          setup_api_calls:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Occ Vendor Hospital", code: "OV-66", spd_turnaround_hours: 4, spd_bay_count: 2 }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { f_ov_id: $.data.id }
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Occ Vendor Devices", vendor_code: "OCCV" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_occv_id: $.data.id, v_occv_ver0: $.data.version }
            - call: "POST /vendor-access/product-introduction-requests"
              payload: { vendor_id: "${v_occv_id}", facility_id: "${f_ov_id}", product_name: "Occ First Tray", product_catalog_number: "OF-1900", manufacturer: "Occv", is_implant: false, unit_cost_cents: 33000, expected_vendor_version: "${v_occv_ver0}" }
              as: VendorAdmin
              as_user_id: "${v_occv_id}"
              captures: { pir_of_id: $.data.id }
          trigger:
            - call: "POST /vendor-access/product-introduction-requests"
              payload: { vendor_id: "${v_occv_id}", facility_id: "${f_ov_id}", product_name: "Occ Second Tray", product_catalog_number: "OS-1901", manufacturer: "Occv", is_implant: false, unit_cost_cents: 34000, expected_vendor_version: "${v_occv_ver0}" }
              as: VendorAdmin
              as_user_id: "${v_occv_id}"
              captures: { stale_vendor_err: $.data.error_id }
            - call: "GET /vendor-access/vendors/${v_occv_id}"
              as: VendorAdmin
              as_user_id: "${v_occv_id}"
              captures: { v_occv_ver_fresh: $.data.version }
            - call: "POST /vendor-access/product-introduction-requests"
              payload: { vendor_id: "${v_occv_id}", facility_id: "${f_ov_id}", product_name: "Occ Second Tray", product_catalog_number: "OS-1901", manufacturer: "Occv", is_implant: false, unit_cost_cents: 34000, expected_vendor_version: "${v_occv_ver_fresh}" }
              as: VendorAdmin
              as_user_id: "${v_occv_id}"
              captures: { pir_os_id: $.data.id }
          assert:
            - "${v_occv_ver0} == 0 and the first create returned 201"
            - "the replay is 412 with ${stale_vendor_err} == ERR_STALE_VENDOR_VERSION"
            - "${v_occv_ver_fresh} == 1 — the GET reports the version the first create produced and does not itself bump it"
            - "the retry with the fresh version returns 201 with a new id ${pir_os_id} != ${pir_of_id}"
            - "Vendor.${v_occv_id}.version == 2 and open_pir_count == 2 after the retry"

      - name: stale_case_version_on_a_second_loaner_set_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.loaner-set-register-stale-case
          - errors[ERR_STALE_CASE_VERSION]
        distinguishing_aspect: "Registering a set is a write against the case, so the second registration must echo version 1: the replayed version 0 is refused 412 before any deadline is pinned, and the re-read retry pins the same 2026-10-09T02:00:00Z deadline the first set got."
