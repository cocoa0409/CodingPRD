            - "ServiceZone Z1 PERMITTED with reserved_bay_minutes 60"
            - "DepotBay B1 CHARGE, OPEN, committed_minutes 60"
            - "BayReservation RES is ACTIVE with window_minutes 60 and robot_id R1"
            - "Robot R1 is CHARGING with current_bay_reservation_id RES and battery_pct 100.0"
