      - name: volume_multiplier_boundary_is_inclusive_at_five_billion_cents
        claim_type: threshold
        grounds:
          - calculations.composite_analysis_score
          - entities.AnalysisScore.fields.volume_multiplier
        distinguishing_aspect: |
          The premium multiplier is the only multiplicative term in the composite and its threshold is
          inclusive, so one cent of written premium separates a 56.00 score from a 61.60 score for an
          otherwise identical carrier. Because a cycle can only be scored once, this needs two cycles
          over the same mutated carrier - which also proves the score snapshot is taken at scoring time
          and not recomputed lazily.
