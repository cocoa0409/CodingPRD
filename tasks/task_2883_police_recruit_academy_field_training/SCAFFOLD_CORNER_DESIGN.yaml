            - "ledger read: exactly 1 CERTIFICATION_ISSUED entry exists, for A-001, with hours_delta 0.00 and stage_code 'PROBATION'"

      - name: conditional_action_completion_branches_on_whether_the_rotation_was_remedial
        claim_type: conditional_action
        grounds:
          - endpoints[POST /field-training-rotations/{rotationId}/complete]
          - state_machines.FieldTrainingRotation.ACTIVE_to_COMPLETED
          - state_machines.FieldTrainingRotation.REMEDIAL_to_COMPLETED
          - calculations.probation_schedule
          - entities.Recruit.probation_extension_days
          - entities.Recruit.probation_scheduled_end
        distinguishing_aspect: "One verb, two source states, two very different outcomes. Completing a REMEDIAL rotation is LEGAL (the 4.00 threshold gates the ACTIVE <-> REMEDIAL loop, not this transition) and leaves the trainee's probation posture at EXTENSION_REQUIRED with a 60-day extension intact, while completing an ACTIVE rotation whose score clears the threshold re-derives the schedule and collapses the extension back to 0 - because step 2 of probation_schedule ranks by end_date DESC and the newly COMPLETED rotation now outranks the remedial one."
        test_recipe:
          setup:
            - "Recruit A-001 is at PROBATION (probation_start 2026-09-05, base 365) after one COMPLETED phase-1 rotation scoring 5.00 under FTO B-100."
            - "Instructors B-200 and B-300 are both CERTIFIED FTOs, needed because a trainer may not repeat a rotation with the same recruit."
            - "A phase-2 rotation under B-200 spanning 2026-09-10..2026-09-23 was activated and received one DOR rating 3, so it flipped to REMEDIAL and drove probation_status to EXTENSION_REQUIRED."
            - "The logical clock stands at 2026-09-24T08:00:00Z, past the phase-2 end_date."
          setup_api_calls:
            - call: "POST /certification-standards"
              payload: { code: "TCOLE-FT", state_code: "TX", min_total_hours: 2.00, min_passing_score: 70.00, max_remediation_attempts: 1, max_absence_hours: 4.00, topic_requirements: [{ topic_code: "PATROL", required_hours: 2.00, exam_required: false }], fitness_event_floor_points: 10, fitness_pass_score: 60 }
