              payload: { train_id: "${train_id}", run_code: "PR-1", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-11T00:00:00Z", target_ammonia_tons: 1000 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { run_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs/{id}/approve"
              payload: {}
              as: ProcessEngineer
