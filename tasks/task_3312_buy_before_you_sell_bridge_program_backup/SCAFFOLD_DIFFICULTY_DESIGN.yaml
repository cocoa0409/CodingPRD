              as: Coordinator
              captures: { t2_adjacent: $.data.id }
            - call: "POST /knock/coordination-tasks"
              payload: { bridge_program_id: "${bp_id}", referral_id: "${rf_id}", task_kind: "APPRAISAL", due_date: "2026-09-04T00:00:00Z" }
              as: Coordinator
              captures: { e1: $.data.error_id }
          assert:
            - "the task due 2026-09-05 (adjacent, window starts exactly at T1's due_date) is accepted with a new id ${t2_adjacent}"
            - "response error_id == ERR_OVERLAPPING_TASK for the task due 2026-09-04 (window [2026-08-05, 2026-09-04) overlaps)"
      - name: listing_closed_interval_slot_reuse
