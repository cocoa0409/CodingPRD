        claim_type: immediate_consistency
        grounds: [complexity_profile]
        distinguishing_aspect: "Immediate consistency: the POST response and a following GET agree — the streak mutation from a call log is visible on the participant read in the same request chain, with no closeout or batch in between."
        test_recipe:
          setup: ["Program; ENROLLED participant with MON schedule; certified volunteer; SCHEDULED assignment"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 10, current_policy_version: "v2026.1" }, as: ProgramCoordinator }
