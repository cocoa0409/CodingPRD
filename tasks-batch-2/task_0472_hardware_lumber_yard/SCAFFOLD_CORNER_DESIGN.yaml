scaffold_corner_design:
  # =========================================================================
  - section: entities
    instances:
      - name: create_product_returns_201_with_system_fields
        claim_type: Creation
        grounds: ["entities.Product", "endpoints"]
        distinguishing_aspect: "POST /products with all required fields -> 201; response carries server-minted id, on_hand 0, reorder_needed recomputed, status ACTIVE, version 1."
        test_recipe:
          setup: ["An ACTIVE vendor exists"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "CV" }
              as: InventoryManager
              captures: { cv: $.data.id }
          trigger:
            - call: "POST /products"
              payload: { sku: "C-SKU-1", vendor_id: "${cv}", sell_mode: "EACH", aisle: "Z1", bin: "Y1", list_price_cents: 1500, reorder_point: 3, reorder_qty: 10 }
              as: InventoryManager
              captures: { cp: $.data.id, oh: $.data.on_hand, st: $.data.status, ver: $.data.version }
          assert:
            - "HTTP status == 201"
            - "Product.${cp}.on_hand == 0"
            - "Product.${cp}.status == ACTIVE"
            - "Product.${cp}.reorder_needed == true (on_hand 0 <= reorder_point 3)"
            - "Product.${cp}.version == 1"

      - name: get_product_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.Product", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /products/{random-uuid} for a non-existent id -> ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /products/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: InventoryManager
              captures: { e: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_product_missing_required_field_returns_422
        claim_type: Required Fields
        grounds: ["entities.Product", "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /products omitting required sell_mode -> ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["An ACTIVE vendor exists"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "CV2" }
              as: InventoryManager
              captures: { cv2: $.data.id }
          trigger:
            - call: "POST /products"
              payload: { sku: "C-SKU-2", vendor_id: "${cv2}", aisle: "Z2", bin: "Y2", list_price_cents: 1500, reorder_point: 3, reorder_qty: 10 }
              as: InventoryManager
              captures: { e: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_product_invalid_enum_sell_mode_returns_422
        claim_type: Type Constraints
        grounds: ["entities.Product.fields.sell_mode", "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /products with sell_mode 'BULK' (not in {EACH, BY_FOOT}) -> ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["An ACTIVE vendor exists"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "CV3" }
              as: InventoryManager
              captures: { cv3: $.data.id }
          trigger:
            - call: "POST /products"
              payload: { sku: "C-SKU-3", vendor_id: "${cv3}", sell_mode: "BULK", aisle: "Z3", bin: "Y3", list_price_cents: 1500, reorder_point: 3, reorder_qty: 10 }
              as: InventoryManager
              captures: { e: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_product_default_status_active
        claim_type: Defaults
        grounds: ["entities.Product.fields.status", "entities.Vendor.fields.status"]
        distinguishing_aspect: "Omitting status on create -> server defaults Product.status to ACTIVE (input-side status ignored / defaulted)."
        test_recipe:
          setup: ["An ACTIVE vendor exists"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "CV4", coop_rebate_pct: 0.1 }
              as: InventoryManager
              captures: { cv4: $.data.id, vstat: $.data.status }
          trigger:
            - call: "POST /products"
              payload: { sku: "C-SKU-4", vendor_id: "${cv4}", sell_mode: "EACH", aisle: "Z4", bin: "Y4", list_price_cents: 1500, reorder_point: 3, reorder_qty: 10 }
              as: InventoryManager
              captures: { cstat: $.data.status }
          assert:
            - "Vendor.${cv4}.status == ACTIVE"
            - "Product.status == ACTIVE on create"

      - name: duplicate_sku_returns_409
        claim_type: Type Constraints
        grounds: ["validations[priority=5]", "errors[ERR_DUPLICATE_RESOURCE]", "entities.Product.fields.sku"]
        distinguishing_aspect: "Second POST /products with the same sku -> ERR_DUPLICATE_RESOURCE 409."
        test_recipe:
          setup: ["An ACTIVE vendor + one Product sku DUP-1 exists"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "CV5" }
              as: InventoryManager
              captures: { cv5: $.data.id }
            - call: "POST /products"
              payload: { sku: "DUP-1", vendor_id: "${cv5}", sell_mode: "EACH", aisle: "Z5", bin: "Y5", list_price_cents: 1500, reorder_point: 3, reorder_qty: 10 }
              as: InventoryManager
          trigger:
            - call: "POST /products"
              payload: { sku: "DUP-1", vendor_id: "${cv5}", sell_mode: "EACH", aisle: "Z6", bin: "Y6", list_price_cents: 1500, reorder_point: 3, reorder_qty: 10 }
              as: InventoryManager
              captures: { e: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_DUPLICATE_RESOURCE"

      - name: list_products_pagination_envelope
        claim_type: Listing
        grounds: ["entities.Product", "response_envelope"]
        distinguishing_aspect: "GET /products returns an array envelope with total_count and has_more honoring limit/offset."
        test_recipe:
          setup: ["An ACTIVE vendor + 2 products exist"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "CV6" }
              as: InventoryManager
              captures: { cv6: $.data.id }
            - call: "POST /products"
              payload: { sku: "L-1", vendor_id: "${cv6}", sell_mode: "EACH", aisle: "Z7", bin: "Y7", list_price_cents: 100, reorder_point: 0, reorder_qty: 1 }
              as: InventoryManager
            - call: "POST /products"
              payload: { sku: "L-2", vendor_id: "${cv6}", sell_mode: "EACH", aisle: "Z8", bin: "Y8", list_price_cents: 100, reorder_point: 0, reorder_qty: 1 }
              as: InventoryManager
          trigger:
            - call: "GET /products"
              payload: { vendor_id: "${cv6}", limit: 1, offset: 0 }
              as: InventoryManager
          assert:
            - "response_type == array"
            - "meta.total_count == 2"
            - "has_more == true with limit 1"
            - "data has exactly 1 element"

  # =========================================================================
  - section: state_machines
    instances:
      - name: place_already_placed_order_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.SalesOrder.fulfillment_status=DRAFT_to_fulfillment_status=PLACED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Placing an order already in fulfillment_status PLACED -> ERR_INVALID_STATE 409; no second version bump from a rejected place."
        test_recipe:
          setup: ["Cash order with one line, PLACED"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "SV1" }
              as: InventoryManager
              captures: { sv1: $.data.id }
            - call: "POST /products"
              payload: { sku: "SM-1", vendor_id: "${sv1}", sell_mode: "EACH", aisle: "S1", bin: "T1", list_price_cents: 1000, reorder_point: 0, reorder_qty: 10 }
              as: InventoryManager
              captures: { sp1: $.data.id }
            - call: "POST /products/${sp1}/adjust-stock"
              payload: { delta: 100 }
              as: InventoryManager
            - call: "POST /sales-orders"
              payload: {}
              as: SalesAssociate
              captures: { so1: $.data.id, so1_v0: $.data.version }
            - call: "POST /sales-orders/${so1}/lines"
              payload: { product_id: "${sp1}", qty: 5 }
              as: SalesAssociate
            - call: "POST /sales-orders/${so1}/place"
              payload: { expected_sales_order_version: "${so1_v0}" }
              as: SalesAssociate
              captures: { so1_v1: $.data.version }
          trigger:
            - call: "POST /sales-orders/${so1}/place"
              payload: { expected_sales_order_version: "${so1_v1}" }
              as: SalesAssociate
              captures: { e: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: cancel_returned_rental_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.RentalAgreement", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A RETURNED (terminal) RentalAgreement cannot be cancelled -> ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["Asset AVAILABLE; agreement reserved [2026-05-01T08:00Z,2026-05-02T08:00Z); clock 2026-05-01T09:00Z; checked out then returned"]
          setup_api_calls:
            - call: "POST /rental-assets"
              payload: { asset_tag: "RT-1", category: "AUGER", daily_rate_cents: 5000, deposit_cents: 0 }
              as: RentalClerk
              captures: { rta: $.data.id }
            - call: "POST /rental-agreements"
              payload: { rental_asset_id: "${rta}", start_at: "2026-05-01T08:00:00Z", due_at: "2026-05-02T08:00:00Z" }
              as: RentalClerk
              captures: { rtg: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T09:00:00Z" }
              as: RentalClerk
            - call: "POST /rental-agreements/${rtg}/check-out"
              payload: {}
              as: RentalClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T10:00:00Z" }
              as: RentalClerk
            - call: "POST /rental-agreements/${rtg}/return"
              payload: {}
              as: RentalClerk
          trigger:
            - call: "POST /rental-agreements/${rtg}/cancel"
              payload: {}
              as: RentalClerk
              captures: { e: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: confirmed_special_order_cannot_be_cancelled
        claim_type: Invalid Transitions
        grounds: ["state_machines.SpecialOrder.DRAFT_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CONFIRMED SpecialOrder rejects cancel -> ERR_INVALID_STATE 409 (cancel only valid from DRAFT/QUOTED/REVISION_REQUESTED)."
        test_recipe:
          setup: ["ACTIVE drop_ship vendor; ACTIVE account credit_limit 1000000; SpecialOrder QUOTED unit 6000 qty 10 (goods 60000 free ship) then CONFIRMED"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "SOV", drop_ship_capable: true }
              as: InventoryManager
              captures: { sov: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "SOA", credit_limit_cents: 1000000, net_terms_days: 30 }
              as: AccountsManager
              captures: { soa: $.data.id }
            - call: "POST /special-orders"
              payload: { vendor_id: "${sov}", contractor_account_id: "${soa}", description: "Skylight", qty: 10 }
              as: SalesAssociate
              captures: { sox: $.data.id }
            - call: "POST /special-orders/${sox}/quote"
              payload: { quoted_unit_cents: 6000 }
              as: SalesAssociate
            - call: "POST /special-orders/${sox}/confirm"
              payload: {}
              as: Contractor
              as_user_id: "${soa}"
          trigger:
            - call: "POST /special-orders/${sox}/cancel"
              payload: {}
              as: Contractor
              as_user_id: "${soa}"
              captures: { e: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: new_sales_order_starts_in_draft_unbilled
        claim_type: Initial State
        grounds: ["state_machines.SalesOrder", "entities.SalesOrder.fields.fulfillment_status", "entities.SalesOrder.fields.payment_status"]
        distinguishing_aspect: "POST /sales-orders -> fulfillment_status DRAFT, payment_status UNBILLED, pricing_mode PROVISIONAL, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /sales-orders"
              payload: {}
              as: SalesAssociate
              captures: { iso: $.data.id, fs: $.data.fulfillment_status, ps: $.data.payment_status, pm: $.data.pricing_mode }
          assert:
            - "SalesOrder.${iso}.fulfillment_status == DRAFT"
            - "SalesOrder.${iso}.payment_status == UNBILLED"
            - "SalesOrder.${iso}.pricing_mode == PROVISIONAL"

      - name: invoice_before_fulfill_returns_order_not_fulfilled
        claim_type: Precondition Enforcement
        grounds: ["state_machines.SalesOrder.payment_status=UNBILLED_to_payment_status=INVOICED", "validations[priority=8]", "errors[ERR_ORDER_NOT_FULFILLED]"]
        distinguishing_aspect: "Invoicing a PLACED-but-not-FULFILLED order -> ERR_ORDER_NOT_FULFILLED 409."
        test_recipe:
          setup: ["Net-term account; product on_hand 100; order PLACED (not fulfilled)"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "IV" }
              as: InventoryManager
              captures: { iv: $.data.id }
            - call: "POST /products"
              payload: { sku: "IF-1", vendor_id: "${iv}", sell_mode: "EACH", aisle: "I1", bin: "J1", list_price_cents: 1000, reorder_point: 0, reorder_qty: 10 }
              as: InventoryManager
              captures: { ip: $.data.id }
            - call: "POST /products/${ip}/adjust-stock"
              payload: { delta: 100 }
              as: InventoryManager
            - call: "POST /contractor-accounts"
              payload: { business_name: "IA", credit_limit_cents: 1000000, net_terms_days: 30 }
              as: AccountsManager
              captures: { ia: $.data.id }
            - call: "POST /sales-orders"
              payload: { contractor_account_id: "${ia}" }
              as: SalesAssociate
              captures: { io: $.data.id, io_v0: $.data.version }
            - call: "POST /sales-orders/${io}/lines"
              payload: { product_id: "${ip}", qty: 5 }
              as: SalesAssociate
            - call: "POST /sales-orders/${io}/place"
              payload: { expected_sales_order_version: "${io_v0}" }
              as: SalesAssociate
          trigger:
            - call: "POST /sales-orders/${io}/invoice"
              payload: {}
              as: AccountsManager
              captures: { e: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_ORDER_NOT_FULFILLED"

      - name: invoice_cash_order_returns_not_net_term
        claim_type: Precondition Enforcement
        grounds: ["state_machines.SalesOrder.payment_status=UNBILLED_to_payment_status=INVOICED", "errors[ERR_NOT_NET_TERM_ORDER]"]
        distinguishing_aspect: "Invoicing a fulfilled CASH order (no contractor_account_id) -> ERR_NOT_NET_TERM_ORDER 409."
        test_recipe:
          setup: ["Cash order product on_hand 100, PLACED then FULFILLED"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "CN" }
              as: InventoryManager
              captures: { cnv: $.data.id }
            - call: "POST /products"
              payload: { sku: "CN-1", vendor_id: "${cnv}", sell_mode: "EACH", aisle: "K1", bin: "M1", list_price_cents: 1000, reorder_point: 0, reorder_qty: 10 }
              as: InventoryManager
              captures: { cnp: $.data.id }
            - call: "POST /products/${cnp}/adjust-stock"
              payload: { delta: 100 }
              as: InventoryManager
            - call: "POST /sales-orders"
              payload: {}
              as: SalesAssociate
              captures: { cno: $.data.id, cno_v0: $.data.version }
            - call: "POST /sales-orders/${cno}/lines"
              payload: { product_id: "${cnp}", qty: 5 }
              as: SalesAssociate
            - call: "POST /sales-orders/${cno}/place"
              payload: { expected_sales_order_version: "${cno_v0}" }
              as: SalesAssociate
              captures: { cno_v1: $.data.version }
            - call: "POST /sales-orders/${cno}/fulfill"
              payload: { expected_sales_order_version: "${cno_v1}" }
              as: SalesAssociate
          trigger:
            - call: "POST /sales-orders/${cno}/invoice"
              payload: {}
              as: AccountsManager
              captures: { e: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_NOT_NET_TERM_ORDER"

      - name: pay_without_issued_invoice_returns_invoice_not_found
        claim_type: Precondition Enforcement
        grounds: ["state_machines.SalesOrder.payment_status=INVOICED_to_payment_status=PAID", "errors[ERR_INVOICE_NOT_FOUND]"]
        distinguishing_aspect: "Paying an order whose payment_status is still UNBILLED (no ISSUED invoice) -> ERR_INVALID_STATE 409 because the INVOICED->PAID transition is undefined from UNBILLED."
        test_recipe:
          setup: ["Net-term order PLACED + FULFILLED but never invoiced"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "PV" }
              as: InventoryManager
              captures: { pv: $.data.id }
            - call: "POST /products"
              payload: { sku: "PV-1", vendor_id: "${pv}", sell_mode: "EACH", aisle: "P1", bin: "Q1", list_price_cents: 1000, reorder_point: 0, reorder_qty: 10 }
              as: InventoryManager
              captures: { pvp: $.data.id }
            - call: "POST /products/${pvp}/adjust-stock"
              payload: { delta: 100 }
              as: InventoryManager
            - call: "POST /contractor-accounts"
              payload: { business_name: "PA", credit_limit_cents: 1000000, net_terms_days: 30 }
              as: AccountsManager
              captures: { pa: $.data.id }
            - call: "POST /sales-orders"
              payload: { contractor_account_id: "${pa}" }
              as: SalesAssociate
              captures: { po: $.data.id, po_v0: $.data.version }
            - call: "POST /sales-orders/${po}/lines"
              payload: { product_id: "${pvp}", qty: 5 }
              as: SalesAssociate
            - call: "POST /sales-orders/${po}/place"
              payload: { expected_sales_order_version: "${po_v0}" }
              as: SalesAssociate
              captures: { po_v1: $.data.version }
            - call: "POST /sales-orders/${po}/fulfill"
              payload: { expected_sales_order_version: "${po_v1}" }
              as: SalesAssociate
          trigger:
            - call: "POST /sales-orders/${po}/pay"
              payload: {}
              as: AccountsManager
              captures: { e: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: rental_checkout_before_start_returns_not_started
        claim_type: Precondition Enforcement
        grounds: ["state_machines.RentalAgreement.RESERVED_to_CHECKED_OUT", "errors[ERR_RENTAL_NOT_STARTED]"]
        distinguishing_aspect: "Check-out while clock (default 2026-01-01) is before start_at 2026-06-01 -> ERR_RENTAL_NOT_STARTED 409."
        test_recipe:
          setup: ["Asset AVAILABLE; agreement reserved [2026-06-01T08:00Z, 2026-06-02T08:00Z); clock at startup default 2026-01-01"]
          setup_api_calls:
            - call: "POST /rental-assets"
              payload: { asset_tag: "NS-1", category: "TILLER", daily_rate_cents: 5000, deposit_cents: 0 }
              as: RentalClerk
              captures: { nsa: $.data.id }
            - call: "POST /rental-agreements"
              payload: { rental_asset_id: "${nsa}", start_at: "2026-06-01T08:00:00Z", due_at: "2026-06-02T08:00:00Z" }
              as: RentalClerk
              captures: { nsg: $.data.id }
          trigger:
            - call: "POST /rental-agreements/${nsg}/check-out"
              payload: {}
              as: RentalClerk
              captures: { e: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_RENTAL_NOT_STARTED"

  # =========================================================================
  - section: calculations
    instances:
      - name: rental_charge_cross_midnight_bills_two_days
        claim_type: Correct Result
        grounds: ["calculations.rental_charge", "entities.RentalAgreement.fields.rental_charge_cents"]
        distinguishing_aspect: "Return spanning two UTC calendar dates (05-01 -> 05-02) bills max(1, days+1)=2 days at 5000 -> rental_charge_cents == 10000."
        test_recipe:
          setup: ["Asset daily_rate 5000; reserved [2026-05-01T08:00Z, 2026-05-03T08:00Z); clock 2026-05-01T09:00Z checkout, return at 2026-05-02T10:00Z"]
          setup_api_calls:
            - call: "POST /rental-assets"
              payload: { asset_tag: "RC-1", category: "AUGER", daily_rate_cents: 5000, deposit_cents: 0 }
              as: RentalClerk
              captures: { rca: $.data.id }
            - call: "POST /rental-agreements"
              payload: { rental_asset_id: "${rca}", start_at: "2026-05-01T08:00:00Z", due_at: "2026-05-03T08:00:00Z" }
              as: RentalClerk
              captures: { rcg: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T09:00:00Z" }
              as: RentalClerk
            - call: "POST /rental-agreements/${rcg}/check-out"
              payload: {}
              as: RentalClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T10:00:00Z" }
              as: RentalClerk
          trigger:
            - call: "POST /rental-agreements/${rcg}/return"
              payload: {}
              as: RentalClerk
              captures: { ch: $.data.rental_charge_cents }
          assert:
            - "RentalAgreement.${rcg}.rental_charge_cents == 10000"
            - "RentalAgreement.${rcg}.status == RETURNED"

      - name: service_fee_paint_mix_correct
        claim_type: Constants Applied
        grounds: ["calculations.service_fee", "entities.ServiceTicket.fields.fee_cents"]
        distinguishing_aspect: "Starting a PAINT_MIX ticket sets fee_cents == 800 from SERVICE_BASE_CENTS table."
        test_recipe:
          setup: ["ACTIVE station buffer 0; PAINT_MIX ticket BOOKED"]
          setup_api_calls:
            - call: "POST /service-stations"
              payload: { name: "SF-1", buffer_minutes: 0 }
              as: InventoryManager
              captures: { sfs: $.data.id }
            - call: "POST /service-tickets"
              payload: { service_station_id: "${sfs}", service_type: "PAINT_MIX", scheduled_start: "2026-07-01T09:00:00Z", scheduled_end: "2026-07-01T09:30:00Z" }
              as: SalesAssociate
              captures: { sft: $.data.id }
          trigger:
            - call: "POST /service-tickets/${sft}/start"
              payload: {}
              as: SalesAssociate
              captures: { fee: $.data.fee_cents }
          assert:
            - "ServiceTicket.${sft}.fee_cents == 800"
            - "ServiceTicket.${sft}.status == IN_PROGRESS"

      - name: coop_rebate_qualifying_gross_applies_rebate
        claim_type: Correct Result
        grounds: ["calculations.coop_rebate", "entities.PurchaseOrder.fields.coop_rebate_cents", "entities.PurchaseOrder.fields.net_cost_cents"]
        distinguishing_aspect: "PO gross 250000 >= COOP_MIN 200000 with vendor coop_rebate_pct 0.10 -> coop_rebate_cents 25000, net_cost_cents 225000."
        test_recipe:
          setup: ["ACTIVE vendor coop_rebate_pct 0.10; one Product supplied by it; DRAFT PO with one line qty 100 unit_cost 2500"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "CoopV", coop_rebate_pct: 0.1 }
              as: InventoryManager
              captures: { cpv: $.data.id }
            - call: "POST /products"
              payload: { sku: "CP-1", vendor_id: "${cpv}", sell_mode: "EACH", aisle: "C1", bin: "D1", list_price_cents: 3000, reorder_point: 0, reorder_qty: 10 }
              as: InventoryManager
