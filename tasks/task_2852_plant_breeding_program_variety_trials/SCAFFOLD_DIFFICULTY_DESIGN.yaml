            - "BreedingProgram.${prog_id}.committed_plot_count == 56 and BreedingProgram.${prog_id}.plot_budget_remaining == 4944"

  - rule_id: resource_temporal_overlap
    instances:
      - name: nursery_block_half_open_occupancy_plus_fallow_buffer
        grounds:
          - validations[priority=27]
          - calculations.nursery_block_occupancy
          - entities.NurseryPlanting.fields.occupancy_end_date
          - entities.NurseryBlock.fields.fallow_buffer_days
        distinguishing_aspect: |
          The exclusive resource is a NurseryBlock and the reserved interval is
          NOT the crop cycle: it is [sow_date, expected_harvest_date +
          fallow_buffer_days) and it is half-open, so a planting sown exactly on
          2027-02-24 - the predecessor's occupancy_end_date - is admitted while one
          sown a single day earlier on 2027-02-23 is refused. Forgetting the
          14-day buffer or treating the interval as closed flips exactly one of
          those two answers.
        test_recipe:
          setup:
            - "One program, one objective, one line SX-1101 at generation 3."
            - "One WINTER NurseryBlock NB-OC1 with plot_count 200 and fallow_buffer_days 14."
            - "One SCHEDULED planting P1 of 50 plots sown 2026-10-05 with expected_harvest_date 2027-02-10, so its occupancy_end_date is 2027-02-24."
          setup_api_calls:
            - call: "POST /breeding-programs"
              payload: { name: "Soy Nursery", crop_code: "SOYBEAN", market_zone: "NORTH_CENTRAL", total_plot_budget: 5000, total_budget_usd: 2000000.00 }
              as: PipelineDirector
              captures: { prog_id: $.data.id }
            - call: "POST /breeding-programs/${prog_id}/objectives"
              payload: { market_segment: "MG2_NORTH", target_yield_kg_per_ha: 11000.00, required_disease_resistances: ["RUST", "SDS"], min_resistance_score: 6, quality_trait_specs: { PROTEIN_PCT_MIN: 13.0 }, yield_weight: 0.50, disease_weight: 0.30, quality_weight: 0.20, min_advancement_index: 85.00, min_generation_number: 5 }
              as: PipelineDirector
              captures: { obj_id: $.data.id }
            - call: "POST /breeding-lines"
              payload: { program_id: "${prog_id}", objective_id: "${obj_id}", designation: "SX-1101", generation_number: 3, seed_inventory_g: 100000 }
              as: BreedingScientist
              captures: { line_id: $.data.id }
            - call: "POST /nursery-blocks"
              payload: { block_code: "NB-OC1", nursery_type: "WINTER", location_code: "PR_ISABELA", plot_count: 200, fallow_buffer_days: 14 }
              as: BreedingScientist
              captures: { block_id: $.data.id }
            - call: "POST /nursery-plantings"
              payload: { nursery_block_id: "${block_id}", line_id: "${line_id}", sow_date: "2026-10-05", expected_harvest_date: "2027-02-10", plot_count: 50 }
              as: BreedingScientist
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /nursery-plantings"
              payload: { nursery_block_id: "${block_id}", line_id: "${line_id}", sow_date: "2027-02-24", expected_harvest_date: "2027-06-20", plot_count: 50 }
              as: BreedingScientist
              captures: { p2_id: $.data.id }
            - call: "POST /nursery-plantings"
              payload: { nursery_block_id: "${block_id}", line_id: "${line_id}", sow_date: "2027-02-23", expected_harvest_date: "2027-06-20", plot_count: 50 }
              as: BreedingScientist
          assert:
            - "NurseryPlanting.${p1_id}.occupancy_end_date == 2027-02-24 (2027-02-10 plus the 14-day buffer)"
            - "the planting sown 2027-02-24 -> 201; NurseryPlanting.${p2_id}.occupancy_end_date == 2027-07-04 and status == SCHEDULED"
            - "the planting sown 2027-02-23 -> 409 with data.error_id == ERR_BLOCK_OCCUPANCY_CONFLICT"
            - "NurseryBlock.${block_id}.occupancy_status == OCCUPIED and BreedingProgram.${prog_id}.committed_plot_count == 100 (only the two admitted plantings)"
            - "GET /nursery-plantings?nursery_block_id=${block_id} returns total_count == 2"
            - "a planting sown 2027-07-04 on the same block -> 422 ERR_NURSERY_SEASON_MISMATCH, proving the touching endpoint cleared the occupancy rung before the WINTER month rung ran"

      - name: trial_site_closed_interval_aggregate_peak_at_shared_boundary_day
        grounds:
          - calculations.site_capacity_peak_and_posture
          - validations[priority=44]
          - entities.TrialEntry.fields.planting_window_start
          - entities.TrialSite.fields.peak_committed_plot_count
        distinguishing_aspect: |
          The same scaffold uses the OPPOSITE interval convention for the other
          shared resource: a TrialSite's daily sweep is over CLOSED windows, so two
          entries that merely touch on 2027-06-30 do compete and their 45 + 18 = 63
          plots overflow a 60-plot site, while shifting the second window one day
          to 2027-07-01 makes them disjoint and the peak stays 45. It is also an
          aggregate rule: neither entry alone exceeds capacity.
        test_recipe:
          setup:
            - "One program, one objective, two lines, one STAGE_1 series with replication_count 3 and min_locations 1."
            - "Site TO1 with total_plot_capacity 60 already holds one ENTERED entry of 45 plots over the window 2027-04-01 to 2027-06-30, so the site is at 0.75 utilisation and OPEN."
          setup_api_calls:
            - call: "POST /breeding-programs"
              payload: { name: "Soy Overlap", crop_code: "SOYBEAN", market_zone: "NORTH_CENTRAL", total_plot_budget: 5000, total_budget_usd: 2000000.00 }
              as: PipelineDirector
              captures: { prog_id: $.data.id }
            - call: "POST /breeding-programs/${prog_id}/objectives"
              payload: { market_segment: "MG2_NORTH", target_yield_kg_per_ha: 11000.00, required_disease_resistances: ["RUST", "SDS"], min_resistance_score: 6, quality_trait_specs: { PROTEIN_PCT_MIN: 13.0 }, yield_weight: 0.50, disease_weight: 0.30, quality_weight: 0.20, min_advancement_index: 85.00, min_generation_number: 5 }
              as: PipelineDirector
              captures: { obj_id: $.data.id }
            - call: "POST /breeding-lines"
              payload: { program_id: "${prog_id}", objective_id: "${obj_id}", designation: "SX-1201", generation_number: 6, seed_inventory_g: 100000 }
              as: BreedingScientist
              captures: { line_a_id: $.data.id }
            - call: "POST /breeding-lines"
              payload: { program_id: "${prog_id}", objective_id: "${obj_id}", designation: "SX-1202", generation_number: 6, seed_inventory_g: 100000 }
              as: BreedingScientist
              captures: { line_b_id: $.data.id }
            - call: "POST /trial-sites"
              payload: { site_code: "TO1", environment_class: "RAINFED_TEMPERATE", total_plot_capacity: 60, plot_cost_usd: 40.00, season_start_date: "2027-03-01", season_end_date: "2027-10-31" }
              as: TrialAgronomist
              captures: { site_id: $.data.id }
            - call: "POST /trial-series"
              payload: { program_id: "${prog_id}", stage: "STAGE_1", season_year: 2027, plot_design: "RCBD", replication_count: 3, min_locations: 1 }
              as: TrialAgronomist
              captures: { series_id: $.data.id }
            - call: "POST /trial-series/${series_id}/entries"
              payload: { line_id: "${line_a_id}", trial_site_id: "${site_id}", plot_count: 45, planting_window_start: "2027-04-01", planting_window_end: "2027-06-30" }
              as: TrialAgronomist
              captures: { e_a: $.data.id }
          trigger:
            - call: "POST /trial-series/${series_id}/entries"
              payload: { line_id: "${line_b_id}", trial_site_id: "${site_id}", plot_count: 18, planting_window_start: "2027-06-30", planting_window_end: "2027-08-31" }
              as: TrialAgronomist
            - call: "POST /trial-series/${series_id}/entries"
              payload: { line_id: "${line_b_id}", trial_site_id: "${site_id}", plot_count: 18, planting_window_start: "2027-07-01", planting_window_end: "2027-08-31" }
              as: TrialAgronomist
              captures: { e_b: $.data.id }
          assert:
            - "the entry starting 2027-06-30 -> 409 with data.error_id == ERR_SITE_PLOT_CAPACITY_EXCEEDED (post-insertion peak 63 on that single shared day)"
            - "the entry starting 2027-07-01 -> 201 and TrialEntry.${e_b}.status == ENTERED"
            - "TrialSite.${site_id}.peak_committed_plot_count == 45 (not 63), available_plot_count == 15, capacity_posture == OPEN"
            - "BreedingProgram.${prog_id}.committed_plot_count == 63 - the program counts both entries even though the site peak does not"
            - "TrialSeries.${series_id}.entry_count == 2 and location_count == 1"
            - "the rejected request left no TrialEntry behind: GET /trial-entries?trial_series_id=${series_id} returns total_count == 2"

  - rule_id: compensating_invariant
    instances:
      - name: plot_conservation_across_supersession_withdrawal_and_harvest
        grounds:
          - entities.BreedingProgram.fields.committed_plot_count
          - entities.BreedingProgram.fields.plot_budget_remaining
          - state_machines.TrialEntry.WITHDRAWN
          - state_machines.NurseryPlanting.PLANTED_to_HARVESTED
          - state_machines.BreedingLine.pipeline_stage_HOLD
        distinguishing_aspect: |
          The invariant committed_plot_count == sum(plot_count over TrialEntry in
          {ENTERED, PLANTED, HARVESTED}) + sum(plot_count over NurseryPlanting in
          {SCHEDULED, PLANTED}) + sum(granted_plots over non-superseded ADVANCE
          decisions) must hold after three different releases, each of which frees
          plots by a different mechanism: a HOLD that supersedes an earlier ADVANCE
          (40 plots), an entry withdrawal (12 plots) and a nursery harvest (50
          plots). Releasing twice or not at all is visible as a 118 -> 78 -> 66 -> 16
          ledger that no longer reconciles.
        test_recipe:
          setup:
            - "One program with total_plot_budget 5000, one objective, lines SX-1001 and SX-1002 at generation 6."
            - "Site CV1 (capacity 400) and series 1 (STAGE_1, rep 4, min_locations 1) with entries A and B of 8 plots each, planted, finalized and analyzed."
            - "Series 2 (STAGE_1, rep 4) holds one ENTERED entry A of 12 plots at the same site."
            - "WINTER block NB-CV1 holds one PLANTED nursery planting of 50 plots for line A."
            - "An ADVANCE decision on line A against series 1 granted 40 plots, so committed_plot_count reads 118."
          setup_api_calls:
            - call: "POST /breeding-programs"
              payload: { name: "Soy Conserve", crop_code: "SOYBEAN", market_zone: "NORTH_CENTRAL", total_plot_budget: 5000, total_budget_usd: 2000000.00 }
              as: PipelineDirector
              captures: { prog_id: $.data.id }
            - call: "POST /breeding-programs/${prog_id}/objectives"
              payload: { market_segment: "MG2_NORTH", target_yield_kg_per_ha: 11000.00, required_disease_resistances: ["RUST", "SDS"], min_resistance_score: 6, quality_trait_specs: { PROTEIN_PCT_MIN: 13.0, TEST_WEIGHT_MIN: 76.0 }, yield_weight: 0.50, disease_weight: 0.30, quality_weight: 0.20, min_advancement_index: 85.00, min_generation_number: 5 }
              as: PipelineDirector
              captures: { obj_id: $.data.id }
            - call: "POST /breeding-lines"
              payload: { program_id: "${prog_id}", objective_id: "${obj_id}", designation: "SX-1001", generation_number: 6, seed_inventory_g: 500000, disease_resistance_scores: { RUST: 8, SDS: 7 }, quality_trait_values: { PROTEIN_PCT: 13.4, TEST_WEIGHT: 75.0 } }
              as: BreedingScientist
              captures: { line_a_id: $.data.id }
            - call: "POST /breeding-lines"
              payload: { program_id: "${prog_id}", objective_id: "${obj_id}", designation: "SX-1002", generation_number: 6, seed_inventory_g: 400000, disease_resistance_scores: { RUST: 8, SDS: 4 }, quality_trait_values: {} }
              as: BreedingScientist
              captures: { line_b_id: $.data.id }
            - call: "POST /trial-sites"
              payload: { site_code: "CV1", environment_class: "HIGH_YIELD_IRRIGATED", total_plot_capacity: 400, plot_cost_usd: 45.00, season_start_date: "2027-03-01", season_end_date: "2027-10-31" }
              as: TrialAgronomist
              captures: { site_id: $.data.id }
            - call: "POST /trial-series"
              payload: { program_id: "${prog_id}", stage: "STAGE_1", season_year: 2027, plot_design: "RCBD", replication_count: 4, min_locations: 1 }
              as: TrialAgronomist
              captures: { series_id: $.data.id }
            - call: "POST /trial-series/${series_id}/entries"
              payload: { line_id: "${line_a_id}", trial_site_id: "${site_id}", plot_count: 8, planting_window_start: "2027-04-01", planting_window_end: "2027-08-31" }
              as: TrialAgronomist
              captures: { e_a: $.data.id }
            - call: "POST /trial-series/${series_id}/entries"
              payload: { line_id: "${line_b_id}", trial_site_id: "${site_id}", plot_count: 8, planting_window_start: "2027-04-01", planting_window_end: "2027-08-31" }
              as: TrialAgronomist
              captures: { e_b: $.data.id }
            - call: "POST /trial-series/${series_id}/plant"
              payload: {}
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_a}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 1, value: 15.0 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_a}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 2, value: 15.0 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_a}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 3, value: 15.0 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_b}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 1, value: 14.0 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_b}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 2, value: 14.0 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_b}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 3, value: 14.0 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_a}/finalize"
              payload: {}
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_b}/finalize"
