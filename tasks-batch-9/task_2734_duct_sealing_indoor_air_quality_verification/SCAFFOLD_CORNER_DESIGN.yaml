      - name: complaint_actions_fired_from_the_wrong_phase_report_the_complaint_state_error
        claim_type: error_triggerable
        grounds:
          - errors.ERR_COMPLAINT_INVALID_STATE
          - state_machines.ComfortComplaint[OPEN->DIAGNOSED]
          - state_machines.ComfortComplaint[DIAGNOSED->BALANCING]
        distinguishing_aspect: "ComfortComplaint is the only entity whose 409 code had no trigger, and the interesting one is balance-while-OPEN: that request violates BOTH the priority-60 state rule and the priority-100 'at least one AirflowReading' rule, so the state code must win. Diagnosing a complaint twice covers the other direction — an action legal a moment ago and illegal now."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one programme, technician, project and one OPEN complaint on room Den with no readings at all"
          setup_api_calls:
            - call: "POST /duct-sealing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /duct-sealing/utility-programs"
              payload: { name: "Metro Gas Duct Seal 2026", rebate_basis: "PER_CFM", rate_cents_per_cfm_reduced: 1200, pct_of_invoice_bps: 3000, cap_cents: 500000, annual_budget_cents: 5000000, min_reduction_pct: 80.00, requires_inspector_verification: true, combustion_safety_required: true }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /duct-sealing/technicians"
              payload: { full_name: "Dana Ruiz", license_number: "AS-4417", certification_status: "ACTIVE", certification_expires_at: "2027-06-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { tech1_id: $.data.id }
            - call: "POST /duct-sealing/projects"
              payload: { utility_program_id: "${prog_id}", address_line: "18 Larkspur Ln", conditioned_floor_area_sqft: 2000, gas_appliance_count: 1, invoice_amount_cents: 480000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /duct-sealing/comfort-complaints"
              payload: { project_id: "${proj_id}", room_label: "Den", complaint_type: "TOO_COLD", reported_by: "Alice Nguyen" }
              as: ProgramAdmin
              captures: { c1_id: $.data.id, c1_status: $.data.status }
          trigger:
            - call: "POST /duct-sealing/comfort-complaints/${c1_id}/balance"
              payload: { damper_adjustment_note: "balancing before diagnosis and before any reading" }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { e_balance_open: $.data.error_id }
            - call: "POST /duct-sealing/comfort-complaints/${c1_id}/diagnose"
              payload: { diagnosis_code: "DAMPER_MISADJUSTED", tolerance_pct: 10.00 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { diag_status: $.data.status }
            - call: "POST /duct-sealing/comfort-complaints/${c1_id}/diagnose"
              payload: { diagnosis_code: "DUCT_UNDERSIZED", tolerance_pct: 25.00 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { e_diag_twice: $.data.error_id }
            - call: "GET /duct-sealing/comfort-complaints/${c1_id}"
              as: ProgramAdmin
              captures: { final_status: $.data.status, final_code: $.data.diagnosis_code, final_tol: $.data.tolerance_pct }
            - call: "POST /duct-sealing/comfort-complaints/${c1_id}/balance"
              payload: { damper_adjustment_note: "now diagnosed, but still no readings" }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { e_balance_diagnosed: $.data.error_id }
          assert:
            - "${c1_status} == OPEN with diagnosis_code == null, tolerance_pct == null and rebalance_count == 0"
            - "Balance-while-OPEN returns HTTP 409 with ${e_balance_open} == ERR_COMPLAINT_INVALID_STATE — the priority-60 state rule beats the priority-100 ERR_NO_AIRFLOW_READINGS rule that the same request also violates"
            - "${diag_status} == DIAGNOSED after the first diagnose"
            - "The second diagnose returns HTTP 409 with ${e_diag_twice} == ERR_COMPLAINT_INVALID_STATE"
            - "${final_status} == DIAGNOSED, ${final_code} == 'DAMPER_MISADJUSTED' and ${final_tol} == 10.00: the rejected second diagnose overwrote nothing"
            - "Balance from DIAGNOSED with no readings now returns HTTP 422 with ${e_balance_diagnosed} == ERR_NO_AIRFLOW_READINGS — same endpoint, same missing readings, different code once the state rule is satisfied"
            - "The complaint's version advanced exactly once across all five calls (the one accepted diagnose)"

