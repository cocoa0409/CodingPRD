      - 'trigger[3]: completion at clock 2026-09-01 returns 409 ERR_TRANSFER_DATE_NOT_REACHED because proposed_transfer_at is 2026-09-05'
      - 'trigger[5]: after the clock reaches 2026-09-05 completion returns status COMPLETED with completed_at == ''2026-09-05T00:00:00Z'''
      - 'trigger[6]: the Specimen is in the terminal disposition_status TRANSFERRED with exhibit_id == null and holding_area == null; a further submission on it returns 409 ERR_ENTITY_TERMINAL'
- rule_id: resource_temporal_overlap
  rationale: 'Two overlap tests on two different resources with DELIBERATELY OPPOSITE interval conventions: closed intervals plus a 30-minute buffer for exhibit sessions, half-open intervals with no buffer for treatment withdrawal windows.'
  instances:
  - name: temporal_session_buffer_adjacency_conflicts_exact_thirty_minute_gap_clears
    grounds:
    - §1.3 session_buffer_conflict with BUFFER_MINUTES 30 and CLOSED intervals
    - §1.4 priority 34 ERR_SESSION_BUFFER_CONFLICT
    - §1.1 InteractionSession.starts_at / ends_at / status
    - §1.5 POST /aquarium/interaction-sessions, GET /aquarium/exhibits/{id}/interaction-sessions
    distinguishing_aspect: 'Three probes against one fixed 10:00-11:00 session pin the buffer exactly: a zero-gap adjacency conflicts, a 29-minute gap conflicts, and a gap of exactly 30 minutes does not. An implementation that only tests raw interval intersection accepts the adjacency; one that uses >= on the buffer rejects the legal 11:30 session.'
    test_recipe:
      setup: One COLD_MARINE plant, one OPEN exhibit with the interaction programme enabled, and one SCHEDULED FEEDING_ENCOUNTER from 2026-08-02T10:00:00Z to 11:00:00Z. Clock at 2026-08-01T00:00:00Z so every candidate window is in the future.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100, interaction_program_enabled: true}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      - call: POST /aquarium/interaction-sessions
        payload: {exhibit_id: '${ex_id}', program_type: FEEDING_ENCOUNTER, starts_at: '2026-08-02T10:00:00Z', ends_at: '2026-08-02T11:00:00Z', max_guests: 6, guest_count: 4, safety_briefing_confirmed: true}
        as: AquaristTechnician
        captures: {ses1_id: $.data.id}
      trigger:
      - call: POST /aquarium/interaction-sessions
        payload: {exhibit_id: '${ex_id}', program_type: FEEDING_ENCOUNTER, starts_at: '2026-08-02T11:00:00Z', ends_at: '2026-08-02T12:00:00Z', max_guests: 6, guest_count: 4, safety_briefing_confirmed: true}
        as: AquaristTechnician
        captures: {err: $.data.error_id}
      - call: POST /aquarium/interaction-sessions
        payload: {exhibit_id: '${ex_id}', program_type: FEEDING_ENCOUNTER, starts_at: '2026-08-02T11:29:00Z', ends_at: '2026-08-02T12:29:00Z', max_guests: 6, guest_count: 4, safety_briefing_confirmed: true}
        as: AquaristTechnician
        captures: {err2: $.data.error_id}
      - call: POST /aquarium/interaction-sessions
        payload: {exhibit_id: '${ex_id}', program_type: FEEDING_ENCOUNTER, starts_at: '2026-08-02T11:30:00Z', ends_at: '2026-08-02T12:30:00Z', max_guests: 6, guest_count: 4, safety_briefing_confirmed: true}
        as: AquaristTechnician
        captures: {ses2_id: $.data.id}
      - call: POST /aquarium/interaction-sessions
        payload: {exhibit_id: '${ex_id}', program_type: FEEDING_ENCOUNTER, starts_at: '2026-08-02T09:30:00Z', ends_at: '2026-08-02T09:59:00Z', max_guests: 6, guest_count: 4, safety_briefing_confirmed: true}
        as: AquaristTechnician
        captures: {err3: $.data.error_id}
      - call: GET /aquarium/exhibits/${ex_id}/interaction-sessions
        payload: {}
        as: AquaristTechnician
        captures: {rows: $.data}
      assert:
      - 'trigger[0]: gap 0 (starts_at == the existing ends_at) returns 409 ERR_SESSION_BUFFER_CONFLICT — closed intervals plus a buffer make adjacency illegal'
      - 'trigger[1]: gap 29 minutes returns 409 ERR_SESSION_BUFFER_CONFLICT (BUFFER_MINUTES - 1)'
      - 'trigger[2]: gap exactly 30 minutes is ACCEPTED and returns status SCHEDULED — the comparison is strict ''<'' on ends_at + 30 minutes'
      - 'trigger[3]: a candidate ENDING 1 minute before the existing session starts (09:59 vs 10:00) also returns 409 ERR_SESSION_BUFFER_CONFLICT — the buffer is symmetric on both sides'
      - 'trigger[4]: total_count == 2 and the rows are the 10:00-11:00 and 11:30-12:30 sessions, both SCHEDULED'
      - the conflict set counts SCHEDULED, ACTIVE and SUSPENDED sessions only; COMPLETED and CANCELLED rows are ignored
      - 'every rejection is inert: Exhibit.version and Exhibit.suspended_session_count are unchanged'
  - name: temporal_treatment_withdrawal_half_open_upper_bound_permits_adjacency
    grounds:
    - §1.3 treatment_withdrawal_window with a HALF-OPEN [start, start + withdrawal_days) interval
    - §1.4 priority 23 ERR_TREATMENT_WITHDRAWAL_ACTIVE
    - §1.2 Specimen health_status HEALTHY -> UNDER_TREATMENT and UNDER_TREATMENT -> UNDER_TREATMENT
    - §1.1 Specimen.treatment_withdrawal_until / welfare_score
    - §1.5 POST /aquarium/veterinary-cases
    distinguishing_aspect: 'The opposite convention from the session buffer on purpose: here adjacency is LEGAL because the upper bound is exclusive. A window starting on 2026-08-10 overlaps [08-01, 08-11) and is rejected, while one starting exactly on 2026-08-11 is accepted. Sharing one interval helper between sessions and withdrawal windows must fail one of the two instances.'
    test_recipe:
      setup: A specimen still in QUARANTINE (treatment is legal from any non-terminal disposition) with one OPEN TREATMENT case opened at 2026-08-01 with withdrawal_days 10, giving the window [2026-08-01, 2026-08-11). The clock is then advanced to 2026-08-20 so both later opened_at instants are in the past. The specimen has no husbandry logs at all.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100}
        as: CuratorOfCollections
