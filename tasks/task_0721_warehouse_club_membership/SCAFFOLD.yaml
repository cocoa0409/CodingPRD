# =============================================================================
# task_0721_warehouse_club_membership — SCAFFOLD.yaml
# Warehouse-Club Membership & Instant Rebate (Costco/Sam's Club style)
# Difficulty: Expert
# =============================================================================

scenario: |
  721. Warehouse-Club Membership & Instant Rebate (Costco/Sam's Club style): membership tier
  (basic/executive) & renewal, household card & add-on, executive 2%-reward accrual & cap,
  instant-savings/manufacturer rebate application, member-only pricing & purchase limit,
  no-receipt return-lookup policy, gas/pharmacy/optical linkage, auto-renew & cancel-refund

domain_name: warehouse-club-membership
api_prefix: /memberships

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat            # peer entities linked by FK; no nesting in URL paths
  state_machine_shape: branching   # membership has approve/renew/lapse/cancel branches; transactions fork into reward/return/void
  relationship_patterns:
    - one_to_many                  # Membership -> Cardholder, Membership -> Transaction
    - cross_aggregate             # Transaction lines reference Product; RewardLedger references Transaction
  role_model: peer_roles           # Member acts on own membership; ClubAdmin/RegisterClerk/ServiceDeskClerk operational
  consistency_model: immediate

  entity_count: 11
  state_machine_count: 4
  calculation_count: 6
  validation_layers: 13
  endpoint_count: 31
  error_code_count: 27
  role_count: 5

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: MembershipPlan
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: tier, type: enum, source: input, description: "Membership tier", constraints: "one of {BASIC, EXECUTIVE}" }
      - { name: annual_fee_cents, type: integer, source: input, description: "Annual membership fee in cents", constraints: ">= 0" }
      - { name: reward_rate_bps, type: integer, source: input, description: "Executive reward accrual rate in basis points; 0 for BASIC", default: 0, constraints: ">= 0; BASIC must be 0" }
      - { name: reward_cap_cents, type: integer, source: input, description: "Annual cap on accrued executive reward in cents; 0 for BASIC", default: 0, constraints: ">= 0" }
      - { name: max_household_cards, type: integer, source: input, description: "Maximum HouseholdCards allowed (excludes primary)", default: 1, constraints: ">= 0" }
      - { name: addon_fee_cents, type: integer, source: input, description: "Per-card fee for paid add-on cards beyond included household card", default: 0, constraints: ">= 0" }
    note: "Configuration entity, immutable after creation; BASIC and EXECUTIVE plans seeded by ClubAdmin."

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> MembershipPlan.id; chosen tier plan" }
      - { name: primary_member_name, type: string, source: input, description: "Primary cardholder full name" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", constraints: "one of {PENDING_PAYMENT, ACTIVE, EXPIRED, CANCELLED}" }
      - { name: auto_renew, type: boolean, source: input, description: "Whether membership auto-renews at period end", default: true }
      - { name: term_start_utc, type: datetime, source: system, description: "Current term start (set on activation/renewal)" }
      - { name: term_end_utc, type: datetime, source: system, description: "Current term end = term_start + 365 days" }
      - { name: reward_accrued_cents, type: integer, source: computed, description: "Sum of executive reward accrued in current term, capped at plan.reward_cap_cents; 0 for BASIC" }
      - { name: reward_redeemed_cents, type: integer, source: computed, description: "Executive reward redeemed against fees/purchases in current term" }
      - { name: fees_paid_cents, type: integer, source: computed, description: "Total membership/add-on fees collected for current term, net of cancel refunds" }
      - { name: household_card_count, type: integer, source: computed, description: "Count of HouseholdCard rows in ACTIVE status for this membership" }

  - name: HouseholdCard
    parent: null
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; owning membership" }
      - { name: cardholder_name, type: string, source: input, description: "Household cardholder full name" }
      - { name: card_kind, type: enum, source: input, description: "Card type", constraints: "one of {INCLUDED, PAID_ADDON}" }
      - { name: status, type: enum, source: system, description: "Card status", constraints: "one of {ACTIVE, REVOKED}" }
      - { name: fee_charged_cents, type: integer, source: computed, description: "addon_fee_cents if PAID_ADDON, else 0" }

  - name: Product
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: sku, type: string, source: input, description: "Stock-keeping unit code", constraints: "unique across Products" }
      - { name: list_price_cents, type: integer, source: input, description: "Non-member shelf price in cents", constraints: ">= 0" }
      - { name: member_price_cents, type: integer, source: input, description: "Member-only price in cents", constraints: ">= 0; <= list_price_cents" }
      - { name: member_only, type: boolean, source: input, description: "If true, item may only be purchased on an ACTIVE membership", default: false }
      - { name: per_member_limit, type: integer, source: input, description: "Max units purchasable per membership per term; 0 means unlimited", default: 0, constraints: ">= 0" }
      - { name: department, type: enum, source: input, description: "Linked-service department", constraints: "one of {GENERAL, GAS, PHARMACY, OPTICAL}" }
      - { name: reward_eligible, type: boolean, source: input, description: "Whether spend on this product accrues executive reward", default: true }

  - name: InstantSaving
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; product the saving applies to" }
      - { name: kind, type: enum, source: input, description: "Discount kind", constraints: "one of {INSTANT_SAVINGS, MANUFACTURER_REBATE}" }
      - { name: amount_cents, type: integer, source: input, description: "Per-unit discount amount in cents", default: 0, constraints: ">= 0" }
      - { name: window_start_utc, type: datetime, source: input, description: "Inclusive start of the promo window (half-open with end)" }
      - { name: window_end_utc, type: datetime, source: input, description: "Exclusive end of the promo window" }
      - { name: max_units, type: integer, source: input, description: "Max discounted units per transaction line; 0 means unlimited", default: 0, constraints: ">= 0" }
    note: "INSTANT_SAVINGS applies to gross before reward; MANUFACTURER_REBATE applies after instant savings. Window is [start, end)."

  - name: Transaction
    parent: null
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; purchasing membership" }
      - { name: status, type: enum, source: system, description: "Transaction status", constraints: "one of {OPEN, FINALIZED, VOIDED}" }
      - { name: gross_cents, type: integer, source: computed, description: "Sum over lines of unit member/list price * qty before discounts" }
      - { name: instant_savings_cents, type: integer, source: computed, description: "Sum of INSTANT_SAVINGS discounts across lines" }
      - { name: rebate_cents, type: integer, source: computed, description: "Sum of MANUFACTURER_REBATE discounts across lines" }
      - { name: net_cents, type: integer, source: computed, description: "gross_cents - instant_savings_cents - rebate_cents, floored at 0" }
      - { name: reward_accrued_cents, type: integer, source: computed, description: "Executive reward accrued by this transaction after cap (0 until FINALIZED, 0 for BASIC)" }
      - { name: finalized_at_utc, type: datetime, source: system, description: "Logical-clock timestamp when FINALIZED; null otherwise" }

  - name: TransactionLine
    parent: null
    common_fields: true
    fields:
      - { name: transaction_id, type: string, source: input, description: "FK -> Transaction.id; owning transaction" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; purchased product" }
      - { name: qty, type: integer, source: input, description: "Units purchased", constraints: ">= 1" }
      - { name: unit_price_cents, type: integer, source: computed, description: "member_price_cents if membership ACTIVE else list_price_cents, snapshotted at add time" }
      - { name: line_instant_savings_cents, type: integer, source: computed, description: "INSTANT_SAVINGS discount applied to this line" }
      - { name: line_rebate_cents, type: integer, source: computed, description: "MANUFACTURER_REBATE discount applied to this line" }
      - { name: returned_qty, type: integer, source: computed, description: "Units of this line returned so far across Returns", default: 0 }

  - name: RewardLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits; entries replayed in created_at ASC order" }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; owning membership" }
      - { name: entry_type, type: enum, source: input, description: "Ledger movement", constraints: "one of {ACCRUAL, REVERSAL, REDEMPTION, EXPIRY}" }
      - { name: amount_cents, type: integer, source: input, description: "Signed cents: ACCRUAL>0 net of cap, REVERSAL<0, REDEMPTION<0, EXPIRY<0" }
      - { name: source_transaction_id, type: string, source: input, description: "FK -> Transaction.id; transaction that caused the entry; null for EXPIRY", default: null }
      - { name: term_start_utc, type: datetime, source: input, description: "Term this entry belongs to (cap and expiry are per-term)" }

  - name: Return
    parent: null
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; returning membership" }
      - { name: transaction_id, type: string, source: input, description: "FK -> Transaction.id; original FINALIZED transaction; null for no-receipt returns", default: null }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; returned product" }
      - { name: qty, type: integer, source: input, description: "Units returned", constraints: ">= 1" }
      - { name: lookup_mode, type: enum, source: system, description: "How the original purchase was resolved", constraints: "one of {RECEIPTED, NO_RECEIPT_LOOKUP, DENIED}" }
      - { name: status, type: enum, source: system, description: "Return status", constraints: "one of {PENDING, APPROVED, REJECTED}" }
      - { name: refund_cents, type: integer, source: computed, description: "Cash/credit refunded for the return (net of reward reversal)" }
      - { name: reward_reversal_cents, type: integer, source: computed, description: "Executive reward clawed back for the returned units" }

  - name: FeeEvent
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; charged membership" }
      - { name: kind, type: enum, source: input, description: "Fee movement", constraints: "one of {SIGNUP, RENEWAL, ADDON, CANCEL_REFUND}" }
      - { name: amount_cents, type: integer, source: input, description: "Signed cents: charges>0, CANCEL_REFUND<0" }
      - { name: term_start_utc, type: datetime, source: input, description: "Term the fee applies to" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; paying membership" }
      - { name: purpose, type: enum, source: input, description: "What the payment settles", constraints: "one of {SIGNUP, RENEWAL}" }
      - { name: outcome, type: enum, source: system, description: "Settlement outcome", constraints: "one of {PENDING, SUCCEEDED, FAILED}" }
      - { name: amount_cents, type: integer, source: computed, description: "Plan annual_fee_cents net of reward redemption applied at payment time" }

# =============================================================================
# Concurrency Rules (§1.2.1) — OCC on Membership.version
# =============================================================================
concurrency_rules:
  - rule_id: renewal-stale-membership
    parent_entity: Membership
    write_endpoint: "POST /memberships/{membershipId}/renew"
    occ_field: "expected_membership_version"
    description: |
      Renewing a Membership whose version has advanced since the client last observed it is
      rejected. This captures the case where another writer has already renewed the membership
      (which legitimately rolls the term forward and resets the per-term reward cap), so the
      current writer's view of the membership term is stale.
    error_id: ERR_STALE_MEMBERSHIP_VERSION
    http_status: 412

  - rule_id: cancel-stale-membership
    parent_entity: Membership
    write_endpoint: "POST /memberships/{membershipId}/cancel"
    occ_field: "expected_membership_version"
    description: |
      Cancelling a Membership whose version has advanced since the client last observed it is
      rejected. This captures the case where the membership was already renewed or otherwise
      mutated after the client read it, making the cancel-refund proration the client computed
      stale.
    error_id: ERR_STALE_MEMBERSHIP_VERSION
    http_status: 412

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Membership
    initial_state: PENDING_PAYMENT
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING_PAYMENT
        to: ACTIVE
        trigger: "POST /payments (purpose=SIGNUP, outcome SUCCEEDED) → system activation"
        actor: system
        preconditions: ["Membership.status == PENDING_PAYMENT", "a SUCCEEDED SIGNUP Payment exists for this membership"]
        side_effects:
          - "set term_start_utc = clock_now, term_end_utc = term_start + 365 days"
          - "create FeeEvent(kind=SIGNUP, amount=plan.annual_fee_cents, term_start_utc=term_start)"
          - "create one INCLUDED HouseholdCard for the primary member is NOT auto-created; primary tracked on Membership"
          - "recompute Membership.fees_paid_cents"
        note: "Activation is the first link of the signup cascade."

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /memberships/{id}/renew"
        actor: Member
        preconditions:
          - "Membership.status == ACTIVE"
          - "expected_membership_version matches current Membership.version"
        side_effects:
          - "create FeeEvent(kind=RENEWAL, amount=plan.annual_fee_cents net of reward redemption, term_start_utc=new term_start)"
          - "create RewardLedgerEntry(EXPIRY) zeroing any unredeemed reward from the prior term"
          - "roll term_start_utc = old term_end_utc, term_end_utc = new term_start + 365 days"
          - "reset reward_accrued_cents and reward_redeemed_cents to 0 for the new term"
          - "increments Membership.version by 1"
        note: "Cyclic self-transition; resets per-term reward cap. EXPIRY cascade: renewal → EXPIRY ledger entry → reward_accrued recompute."

      - from: ACTIVE
        to: EXPIRED
        trigger: "system: clock advanced past term_end_utc with auto_renew=false"
        actor: system
        preconditions: ["Membership.status == ACTIVE", "clock_now >= term_end_utc", "auto_renew == false"]
        side_effects:
          - "create RewardLedgerEntry(EXPIRY) zeroing unredeemed reward from the term"
          - "recompute reward_accrued_cents to 0"
          - "REVOKE all HouseholdCards: each ACTIVE HouseholdCard -> REVOKED (cascade)"
        note: "Lapse branch. Cascade depth: clock-tick → membership EXPIRED → household cards REVOKED."

      - from: ACTIVE
        to: ACTIVE
        trigger: "system: clock advanced past term_end_utc with auto_renew=true and a SUCCEEDED RENEWAL Payment"
        actor: system
        preconditions: ["clock_now >= term_end_utc", "auto_renew == true", "a SUCCEEDED RENEWAL Payment exists for the new term"]
        side_effects:
          - "same as manual renew side_effects (FeeEvent RENEWAL, EXPIRY of prior reward, term roll, version+1)"
        note: "Auto-renew keeps status ACTIVE across the boundary."

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /memberships/{id}/cancel"
        actor: Member
        preconditions:
          - "Membership.status == ACTIVE"
          - "expected_membership_version matches current Membership.version"
        side_effects:
          - "compute prorated cancel refund = unused fraction of annual_fee (see calc cancel_refund)"
          - "create FeeEvent(kind=CANCEL_REFUND, amount = -refund, term_start_utc=term_start)"
          - "create RewardLedgerEntry(EXPIRY) zeroing unredeemed reward"
          - "REVOKE all HouseholdCards: each ACTIVE HouseholdCard -> REVOKED (cascade)"
          - "recompute fees_paid_cents and reward_accrued_cents"
          - "increments Membership.version by 1"
        note: "Cancel branch. Cascade depth ≥3: cancel → FeeEvent + EXPIRY ledger → reward_accrued recompute → cards REVOKED."

      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /payments (purpose=RENEWAL, outcome SUCCEEDED) on an EXPIRED membership → reinstate"
        actor: system
        preconditions: ["Membership.status == EXPIRED", "a SUCCEEDED RENEWAL Payment exists"]
        side_effects:
          - "create FeeEvent(kind=RENEWAL)"
          - "roll term_start_utc = clock_now, term_end_utc = clock_now + 365 days"
          - "reset reward counters to 0"
        note: "Reinstatement loop back to ACTIVE (cyclic)."

  - entity: Transaction
    initial_state: OPEN
    terminal_states: [FINALIZED, VOIDED]
    transitions:
      - from: OPEN
        to: OPEN
        trigger: "POST /transactions/{id}/lines"
        actor: RegisterClerk
        preconditions:
          - "Transaction.status == OPEN"
          - "owning Membership.status == ACTIVE (cross-entity)"
          - "if Product.member_only then Membership.status == ACTIVE"
          - "qty + existing term purchases of product <= per_member_limit when per_member_limit > 0"
        side_effects:
          - "snapshot unit_price_cents from Product (member vs list per membership status)"
          - "apply InstantSaving discounts active at clock_now to the line (instant then rebate)"
          - "recompute Transaction gross/instant_savings/rebate/net"
        note: "Self-loop adding lines while OPEN. Guarded by Membership ACTIVE."

      - from: OPEN
        to: FINALIZED
        trigger: "POST /transactions/{id}/finalize"
        actor: RegisterClerk
        preconditions:
          - "Transaction.status == OPEN"
          - "Transaction has >= 1 line"
          - "owning Membership.status == ACTIVE (cross-entity)"
        side_effects:
          - "set finalized_at_utc = clock_now"
          - "compute reward_accrued_cents over reward_eligible lines (EXECUTIVE only, net basis)"
          - "create RewardLedgerEntry(ACCRUAL) for capped reward; bump Membership.reward_accrued_cents"
        note: "Finalize branch. Cascade: finalize → ACCRUAL ledger entry → Membership.reward_accrued recompute (capped)."

      - from: OPEN
        to: VOIDED
        trigger: "POST /transactions/{id}/void"
        actor: RegisterClerk
        preconditions: ["Transaction.status == OPEN"]
        side_effects: ["no ledger entries (never finalized); lines remain for audit"]
        note: "Void branch from OPEN only."

  - entity: Return
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /returns/{id}/approve"
        actor: ServiceDeskClerk
        preconditions:
          - "Return.status == PENDING"
          - "Return.lookup_mode != DENIED"
          - "for RECEIPTED: original Transaction.status == FINALIZED (cross-entity) and returned_qty + qty <= line qty"
        side_effects:
          - "compute refund_cents (see calc return_refund)"
          - "compute reward_reversal_cents and create RewardLedgerEntry(REVERSAL) for EXECUTIVE receipted returns"
          - "increment TransactionLine.returned_qty for receipted returns"
          - "recompute Membership.reward_accrued_cents"
        note: "Approve branch. Cascade: approve → REVERSAL ledger entry → line.returned_qty bump → Membership.reward_accrued recompute."

      - from: PENDING
        to: REJECTED
        trigger: "POST /returns/{id}/reject"
        actor: ServiceDeskClerk
        preconditions: ["Return.status == PENDING"]
        side_effects: ["refund_cents = 0; reward_reversal_cents = 0; no ledger entries"]
        note: "Reject branch."

  - entity: HouseholdCard
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /household-cards/{id}/revoke OR cascade from Membership EXPIRED/CANCELLED"
        actor: Member
        preconditions: ["HouseholdCard.status == ACTIVE"]
        side_effects: ["recompute Membership.household_card_count"]
        note: "Revoked when membership lapses/cancels or explicitly by member."

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: line_discounted_amount
    trigger: "POST /transactions/{id}/lines; recomputed on each line add"
    algorithm: tiered_pricing
    formula: |
      # Per-line, evaluated in a PINNED order: price selection -> instant savings -> rebate.
      unit_price = member_price_cents if Membership.status == ACTIVE else list_price_cents
      gross_line = unit_price * qty
      # InstantSaving rows for product_id whose [window_start, window_end) covers clock_now.
      instant = 0
      rebate  = 0
      for s in instant_savings(product, kind=INSTANT_SAVINGS) active at clock_now:
        units = qty if s.max_units == 0 else min(qty, s.max_units)
        instant += s.amount_cents * units
      instant = min(instant, gross_line)                 # instant cannot exceed gross
      base_after_instant = gross_line - instant
      for s in instant_savings(product, kind=MANUFACTURER_REBATE) active at clock_now:
        units = qty if s.max_units == 0 else min(qty, s.max_units)
        rebate += s.amount_cents * units
      rebate = min(rebate, base_after_instant)           # rebate cannot exceed post-instant amount
      line_net = gross_line - instant - rebate
    input_set: "Active InstantSaving rows for the line's product whose half-open [window_start, window_end) window contains clock_now."
    precision: "integer cents; no fractional rounding (amounts are per-unit cents)"
    note: "Evaluation order pinned: instant savings reduce the base FIRST, manufacturer rebate applies to the post-instant amount (circular-looking dependency resolved by pinned order)."

  - name: transaction_reward_accrual
    trigger: "POST /transactions/{id}/finalize"
    algorithm: threshold
    formula: |
      # EXECUTIVE only. BASIC accrues 0.
      if plan.tier != EXECUTIVE: return 0
      reward_base = sum(line_net for lines where Product.reward_eligible == true)   # net basis
      raw_reward = floor(reward_base * plan.reward_rate_bps / 10000)
      # Per-term cap: cap remaining = reward_cap_cents - reward_accrued_cents (current term).
      cap_remaining = plan.reward_cap_cents - Membership.reward_accrued_cents
      accrued = max(0, min(raw_reward, cap_remaining))
      Membership.reward_accrued_cents += accrued
      create RewardLedgerEntry(ACCRUAL, amount=accrued, source_transaction_id=txn, term_start_utc=term_start)
    input_set: "Only FINALIZED transaction's reward_eligible lines; only EXECUTIVE plans; only current term."
    constants: { BPS_DIVISOR: 10000 }
    precision: "floor to integer cents BEFORE applying the cap"
    variants:
      - name: capped
        when: "raw_reward would push term accrual past reward_cap_cents"
        difference: "accrued = cap_remaining (clipped), so the transaction accrues less than rate*base"
      - name: uncapped
        when: "term accrual stays at or below reward_cap_cents after this transaction"
        difference: "accrued = floor(reward_base * rate / 10000)"
    note: "Forward cap reconciliation against Membership.reward_accrued_cents (ledger-derived). Reward is a fiscal conserved quantity (see return_refund + renewal EXPIRY)."

  - name: return_refund
    trigger: "POST /returns/{id}/approve"
    algorithm: ledger
    formula: |
      # RECEIPTED return: refund the actual net the member paid per unit, claw back accrued reward.
      if Return.lookup_mode == RECEIPTED:
        line = TransactionLine(transaction_id, product_id)
        per_unit_net = line.line_net_total / line.qty            # integer division NOT used:
        # per_unit_net computed as floor(line_net_total * returned_units / line.qty) for the BLOCK,
        # using the BLOCK formula to avoid per-unit rounding drift:
        refund_cents = floor(line.line_net_total * qty / line.qty)
        if plan.tier == EXECUTIVE and Product.reward_eligible:
          # reward originally accrued on this line, prorated to returned units, clawed back:
          line_reward = the ACCRUAL attributable to this line (net basis * rate, capped share)
          reward_reversal_cents = floor(line_reward * qty / line.qty)
        else:
          reward_reversal_cents = 0
      # NO_RECEIPT_LOOKUP return: refund at current member_price (lowest price policy), no reward claw-back.
      elif Return.lookup_mode == NO_RECEIPT_LOOKUP:
        refund_cents = Product.member_price_cents * qty
        reward_reversal_cents = 0
      net_to_member = refund_cents
      Membership.reward_accrued_cents -= reward_reversal_cents
      create RewardLedgerEntry(REVERSAL, amount=-reward_reversal_cents) if reward_reversal_cents > 0
    input_set: "Receipted: the matched FINALIZED TransactionLine. No-receipt: current Product.member_price_cents."
    precision: "floor to integer cents; BLOCK rounding — multiply by returned qty THEN floor-divide by line qty (round-then-sum forbidden)"
    variants:
      - name: receipted
        when: "Return.transaction_id is provided and matches a FINALIZED line"
        difference: "refund = prorated actual net paid; reward clawed back for EXECUTIVE"
      - name: no_receipt
        when: "Return.transaction_id is null and no-receipt lookup policy permits"
        difference: "refund = current member_price * qty (NOT historical paid); zero reward claw-back"
    note: "Dual-variant: identical product+qty yields different refund under receipted vs no-receipt. BLOCK rounding order pinned."

  - name: cancel_refund
    trigger: "POST /memberships/{id}/cancel"
    algorithm: decay_function
    formula: |
      # Prorated unused-fraction refund of the most recent SIGNUP/RENEWAL fee for the current term.
      total_days = 365
      elapsed_days = floor((clock_now - term_start_utc) / 1 day)        # whole days elapsed
      remaining_days = max(0, total_days - elapsed_days)
      base_fee = plan.annual_fee_cents
      gross_refund = floor(base_fee * remaining_days / total_days)
      # Outstanding reward redeemed against this term's fee is NOT refundable; subtract it.
      net_refund = max(0, gross_refund - Membership.reward_redeemed_cents)
    input_set: "Current term fee (plan.annual_fee_cents), elapsed whole days since term_start, reward redeemed this term."
    constants: { TERM_DAYS: 365 }
    precision: "floor to integer cents; days computed as floor of (now - term_start) in whole days"
    variants:
      - name: full_term_unused
        when: "elapsed_days == 0 (cancel same day as activation)"
        difference: "remaining_days == 365 → gross_refund == annual_fee_cents (full refund less redeemed reward)"
      - name: partial
        when: "0 < elapsed_days < 365"
        difference: "gross_refund prorated by remaining_days / 365"
    note: "Boundary: elapsed_days == 365 -> remaining 0 -> refund 0; elapsed 0 -> full refund."

  - name: addon_card_fee
    trigger: "POST /household-cards"
    algorithm: count_threshold
    formula: |
      active_cards = count(HouseholdCard where membership_id == m AND status == ACTIVE)
      # First max_household_cards INCLUDED cards are free; PAID_ADDON beyond that costs addon_fee_cents.
      if card_kind == INCLUDED:
        if active_cards >= plan.max_household_cards: reject ERR_HOUSEHOLD_CARD_LIMIT
        fee_charged_cents = 0
      else:  # PAID_ADDON
        fee_charged_cents = plan.addon_fee_cents
        create FeeEvent(kind=ADDON, amount=plan.addon_fee_cents)
      recompute Membership.household_card_count
    input_set: "Count of ACTIVE HouseholdCards for the membership; plan.max_household_cards and addon_fee_cents."
    constants: {}
    precision: "integer cents"
    note: "Threshold at active_cards >= max_household_cards for INCLUDED kind."

  - name: payment_amount_with_redemption
    trigger: "POST /payments (purpose RENEWAL) and renewal via /renew"
    algorithm: ledger
    formula: |
      # Member may redeem available executive reward against a renewal fee.
      available_reward = Membership.reward_accrued_cents - Membership.reward_redeemed_cents
      requested = redeem_reward_cents (from request, default 0)
      applied = max(0, min(requested, available_reward, plan.annual_fee_cents))
      amount_cents = plan.annual_fee_cents - applied
      Membership.reward_redeemed_cents += applied
      create RewardLedgerEntry(REDEMPTION, amount=-applied) if applied > 0
    input_set: "Available reward (accrued - redeemed, current term); requested redemption; plan annual fee."
    constants: {}
    precision: "integer cents"
    note: "Redemption reduces cash due; conserved-quantity invariant: reward_accrued == reward_redeemed + available across ACCRUAL/REDEMPTION/REVERSAL/EXPIRY."

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 401
    applies_to: all endpoints except POST /memberships (signup is anonymous-allowed)

  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Path/body resource ids exist, validated left-to-right (membership, then transaction/return/card, then product)"
    error_id: "ERR_MEMBERSHIP_NOT_FOUND / ERR_TRANSACTION_NOT_FOUND / ERR_RETURN_NOT_FOUND / ERR_PRODUCT_NOT_FOUND / ERR_CARD_NOT_FOUND / ERR_PLAN_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path/body ids

  - priority: 4
    category: business_constraint
    check: "Required body fields present and types valid (e.g., qty integer >= 1, tier in enum)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 5
    category: state
    check: "OCC: expected_membership_version matches current Membership.version on renew/cancel"
    error_id: ERR_STALE_MEMBERSHIP_VERSION
    http_status: 412
    applies_to: "POST /memberships/{id}/renew, POST /memberships/{id}/cancel"

  - priority: 6
    category: state
    check: "Target resource in correct state for the transition (membership ACTIVE, transaction OPEN, return PENDING, card ACTIVE)"
    error_id: "ERR_MEMBERSHIP_NOT_ACTIVE / ERR_TRANSACTION_NOT_OPEN / ERR_RETURN_NOT_PENDING / ERR_CARD_NOT_ACTIVE"
    http_status: 409
    applies_to: state-transition endpoints

  - priority: 7
    category: business_referential
    check: "Owning Membership of a Transaction/line must be ACTIVE to add lines or finalize (cross-entity)"
    error_id: ERR_MEMBERSHIP_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /transactions, POST /transactions/{id}/lines, POST /transactions/{id}/finalize"

  - priority: 8
    category: business_safety
    check: "member_only product cannot be added unless owning Membership.status == ACTIVE"
    error_id: ERR_MEMBER_ONLY_PRODUCT
    http_status: 403
    applies_to: "POST /transactions/{id}/lines"

  - priority: 9
    category: business_constraint
    check: "Per-member purchase limit: existing FINALIZED+OPEN qty of product this term + requested qty <= per_member_limit (when limit > 0)"
    error_id: ERR_PURCHASE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /transactions/{id}/lines"

  - priority: 10
    category: business_constraint
    check: "Household card limit: INCLUDED card cannot be created when ACTIVE card count >= plan.max_household_cards"
    error_id: ERR_HOUSEHOLD_CARD_LIMIT
    http_status: 409
    applies_to: "POST /household-cards"

  - priority: 11
    category: business_referential
    check: "No-receipt return lookup policy: a return with transaction_id omitted is allowed only when the membership has at least one FINALIZED transaction containing the product whose finalized_at_utc satisfies floor((clock_now - finalized_at_utc) in whole days) <= NO_RECEIPT_WINDOW_DAYS (=90, inclusive); the most-recent qualifying transaction (by finalized_at_utc DESC, then created_at ASC) sets lookup_mode=NO_RECEIPT_LOOKUP; otherwise lookup_mode=DENIED and creation is rejected"
    error_id: ERR_NO_RECEIPT_LOOKUP_DENIED
    http_status: 409
    applies_to: "POST /returns (transaction_id omitted)"
    constants: { NO_RECEIPT_WINDOW_DAYS: 90 }

  - priority: 12
    category: business_constraint
    check: "Receipted return: returned_qty + requested qty must not exceed the original line's qty"
    error_id: ERR_RETURN_QTY_EXCEEDS_PURCHASED
    http_status: 409
    applies_to: "POST /returns (transaction_id provided), POST /returns/{id}/approve"

  - priority: 13
    category: business_fiscal
    check: "Reward redemption cannot exceed available reward (accrued - redeemed) for the current term"
    error_id: ERR_REWARD_REDEMPTION_EXCEEDS_AVAILABLE
    http_status: 422
    applies_to: "POST /payments (purpose=RENEWAL with redeem_reward_cents), POST /memberships/{id}/renew"

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set logical clock. Server startup default time is 2026-03-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock."
    roles: [ClubAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["advances logical clock; may trigger membership EXPIRED/auto-renew evaluation on subsequent reads"]

  # --- MembershipPlan (config) ---
  - method: POST
    path: "/plans"
    description: "Create a membership plan (BASIC or EXECUTIVE)"
    roles: [ClubAdmin]
    code: 201
    input: [tier, annual_fee_cents, "reward_rate_bps?", "reward_cap_cents?", "max_household_cards?", "addon_fee_cents?"]
    output: MembershipPlan
    side_effects: []
  - method: GET
    path: "/plans"
    description: "List membership plans"
    roles: [ClubAdmin, Member, RegisterClerk, ServiceDeskClerk]
    code: 200
    input: ["tier?", "limit?", "offset?"]
    output: "MembershipPlan[]"
    side_effects: []
  - method: GET
    path: "/plans/{planId}"
    description: "Get a plan"
    roles: [ClubAdmin, Member, RegisterClerk, ServiceDeskClerk]
    code: 200
    input: []
    output: MembershipPlan
    side_effects: []

  # --- Membership ---
  - method: POST
    path: "/memberships"
    description: "Sign up a new membership (anonymous allowed); starts PENDING_PAYMENT"
    roles: [Anonymous, ClubAdmin]
    code: 201
    input: [plan_id, primary_member_name, "auto_renew?"]
    output: Membership
    side_effects: ["create Membership in PENDING_PAYMENT"]
  - method: GET
    path: "/memberships/{membershipId}"
    description: "Get a membership (computed reward/fee fields included)"
    roles: [ClubAdmin, Member, RegisterClerk, ServiceDeskClerk]
    code: 200
    input: []
    output: Membership
    side_effects: ["recompute computed fields"]
  - method: GET
    path: "/memberships"
    description: "List memberships"
    roles: [ClubAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Membership[]"
    side_effects: []
  - method: POST
    path: "/memberships/{membershipId}/renew"
    description: "Renew an ACTIVE (or reinstate EXPIRED via payment) membership; OCC-guarded; optional reward redemption"
    roles: [Member, ClubAdmin]
    code: 200
    input: [expected_membership_version, "redeem_reward_cents?"]
    output: Membership
    side_effects:
      - "create FeeEvent(RENEWAL); create RewardLedgerEntry(EXPIRY) for prior-term unredeemed reward; optional RewardLedgerEntry(REDEMPTION)"
      - "roll term; reset reward counters; increments Membership.version by 1"
  - method: POST
    path: "/memberships/{membershipId}/cancel"
    description: "Cancel an ACTIVE membership with prorated refund; OCC-guarded"
    roles: [Member, ClubAdmin]
    code: 200
    input: [expected_membership_version]
    output: Membership
    side_effects:
      - "create FeeEvent(CANCEL_REFUND, negative); create RewardLedgerEntry(EXPIRY); REVOKE all ACTIVE HouseholdCards (cascade)"
      - "recompute fees_paid/reward_accrued; increments Membership.version by 1"

  # --- Payment ---
  - method: POST
    path: "/payments"
    description: "Settle a SIGNUP or RENEWAL payment; SUCCEEDED SIGNUP activates membership, SUCCEEDED RENEWAL reinstates EXPIRED"
    roles: [Member, ClubAdmin]
    code: 201
    input: [membership_id, purpose, outcome, "redeem_reward_cents?"]
    output: Payment
    side_effects:
      - "on SUCCEEDED SIGNUP: activate Membership (PENDING_PAYMENT->ACTIVE), set term, create FeeEvent(SIGNUP)"
      - "on SUCCEEDED RENEWAL on EXPIRED: reinstate (EXPIRED->ACTIVE)"
      - "apply optional reward redemption to amount_cents"
  - method: GET
    path: "/payments"
    description: "List payments, filterable by membership"
    roles: [ClubAdmin, Member]
    code: 200
    input: ["membership_id?", "limit?", "offset?"]
    output: "Payment[]"
    side_effects: []

  # --- HouseholdCard ---
  - method: POST
    path: "/household-cards"
    description: "Add a household card (INCLUDED free up to plan limit, or PAID_ADDON)"
    roles: [Member, ClubAdmin]
    code: 201
    input: [membership_id, cardholder_name, card_kind]
    output: HouseholdCard
    side_effects: ["compute fee_charged_cents; PAID_ADDON creates FeeEvent(ADDON); recompute Membership.household_card_count"]
  - method: GET
    path: "/household-cards"
    description: "List household cards, filterable by membership"
    roles: [ClubAdmin, Member]
    code: 200
    input: ["membership_id?", "status?", "limit?", "offset?"]
    output: "HouseholdCard[]"
    side_effects: []
  - method: GET
    path: "/household-cards/{cardId}"
    description: "Get a household card"
    roles: [ClubAdmin, Member]
    code: 200
    input: []
    output: HouseholdCard
    side_effects: []
  - method: POST
    path: "/household-cards/{cardId}/revoke"
    description: "Revoke an ACTIVE household card"
    roles: [Member, ClubAdmin]
    code: 200
    input: []
    output: HouseholdCard
    side_effects: ["status ACTIVE->REVOKED; recompute Membership.household_card_count"]

  # --- Product / InstantSaving ---
  - method: POST
    path: "/products"
    description: "Create a product"
    roles: [ClubAdmin]
    code: 201
    input: [sku, list_price_cents, member_price_cents, "member_only?", "per_member_limit?", "department?", "reward_eligible?"]
    output: Product
    side_effects: []
  - method: GET
    path: "/products"
    description: "List products"
    roles: [ClubAdmin, Member, RegisterClerk, ServiceDeskClerk]
    code: 200
    input: ["department?", "member_only?", "limit?", "offset?"]
    output: "Product[]"
    side_effects: []
  - method: GET
    path: "/products/{productId}"
    description: "Get a product"
    roles: [ClubAdmin, Member, RegisterClerk, ServiceDeskClerk]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: POST
    path: "/instant-savings"
    description: "Create an instant saving or manufacturer rebate for a product"
    roles: [ClubAdmin]
    code: 201
    input: [product_id, kind, amount_cents, window_start_utc, window_end_utc, "max_units?"]
    output: InstantSaving
    side_effects: []
  - method: GET
    path: "/instant-savings"
    description: "List instant savings, filterable by product"
    roles: [ClubAdmin, RegisterClerk, Member, ServiceDeskClerk]
    code: 200
    input: ["product_id?", "kind?", "limit?", "offset?"]
    output: "InstantSaving[]"
    side_effects: []

  # --- Transaction ---
  - method: POST
    path: "/transactions"
    description: "Open a new transaction for an ACTIVE membership"
    roles: [RegisterClerk, ClubAdmin]
    code: 201
    input: [membership_id]
    output: Transaction
    side_effects: ["create Transaction in OPEN with zeroed totals"]
  - method: GET
    path: "/transactions/{transactionId}"
    description: "Get a transaction with computed totals"
    roles: [ClubAdmin, RegisterClerk, Member, ServiceDeskClerk]
    code: 200
    input: []
    output: Transaction
    side_effects: []
  - method: GET
    path: "/transactions"
    description: "List transactions, filterable by membership"
    roles: [ClubAdmin, RegisterClerk, Member, ServiceDeskClerk]
    code: 200
    input: ["membership_id?", "status?", "limit?", "offset?"]
    output: "Transaction[]"
    side_effects: []
  - method: POST
    path: "/transactions/{transactionId}/lines"
    description: "Add a line to an OPEN transaction; snapshots price, applies instant savings then rebate"
    roles: [RegisterClerk, ClubAdmin]
    code: 201
    input: [product_id, qty]
    output: TransactionLine
    side_effects: ["snapshot unit_price; apply discounts; recompute transaction totals"]
  - method: GET
    path: "/transactions/{transactionId}/lines"
    description: "List lines of a transaction (FK reverse-reachability for TransactionLine.transaction_id)"
    roles: [ClubAdmin, RegisterClerk, Member, ServiceDeskClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "TransactionLine[]"
    side_effects: []
  - method: POST
    path: "/transactions/{transactionId}/finalize"
    description: "Finalize an OPEN transaction; accrues executive reward (capped)"
    roles: [RegisterClerk, ClubAdmin]
    code: 200
    input: []
    output: Transaction
    side_effects: ["set finalized_at_utc; create RewardLedgerEntry(ACCRUAL); bump Membership.reward_accrued_cents"]
  - method: POST
    path: "/transactions/{transactionId}/void"
    description: "Void an OPEN transaction"
    roles: [RegisterClerk, ClubAdmin]
    code: 200
    input: []
    output: Transaction
    side_effects: ["status OPEN->VOIDED"]

  # --- Return ---
  - method: POST
    path: "/returns"
    description: "Create a return; transaction_id present = receipted, omitted = no-receipt lookup policy"
    roles: [ServiceDeskClerk, ClubAdmin]
    code: 201
    input: [membership_id, product_id, qty, "transaction_id?"]
    output: Return
    side_effects: ["resolve lookup_mode (RECEIPTED / NO_RECEIPT_LOOKUP / DENIED); status PENDING"]
  - method: GET
    path: "/returns/{returnId}"
    description: "Get a return"
    roles: [ClubAdmin, ServiceDeskClerk, Member]
    code: 200
    input: []
    output: Return
    side_effects: []
  - method: GET
    path: "/returns"
    description: "List returns, filterable by membership or transaction (FK reverse-reachability for Return.transaction_id)"
    roles: [ClubAdmin, ServiceDeskClerk, Member]
    code: 200
    input: ["membership_id?", "transaction_id?", "status?", "limit?", "offset?"]
    output: "Return[]"
    side_effects: []
  - method: POST
    path: "/returns/{returnId}/approve"
    description: "Approve a PENDING return; compute refund and reward reversal"
    roles: [ServiceDeskClerk, ClubAdmin]
    code: 200
    input: []
    output: Return
    side_effects: ["compute refund_cents; EXECUTIVE receipted -> RewardLedgerEntry(REVERSAL); bump line.returned_qty; recompute Membership.reward_accrued_cents"]
  - method: POST
    path: "/returns/{returnId}/reject"
    description: "Reject a PENDING return"
    roles: [ServiceDeskClerk, ClubAdmin]
    code: 200
    input: []
    output: Return
    side_effects: ["refund_cents=0; no ledger entries"]

  # --- Ledger / Fee reverse-reachability reads ---
  - method: GET
    path: "/reward-ledger"
    description: "List reward ledger entries, filterable by membership or source transaction (FK reverse-reachability)"
    roles: [ClubAdmin, Member]
    code: 200
    input: ["membership_id?", "source_transaction_id?", "entry_type?", "limit?", "offset?"]
    output: "RewardLedgerEntry[]"
    side_effects: []
  - method: GET
    path: "/fee-events"
    description: "List fee events, filterable by membership (FK reverse-reachability)"
    roles: [ClubAdmin, Member]
    code: 200
    input: ["membership_id?", "kind?", "limit?", "offset?"]
    output: "FeeEvent[]"
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 401, condition: "X-User-ID/X-User-Role headers missing or role unknown (non-anonymous endpoints)" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for the operation" }
  - { id: ERR_MEMBERSHIP_NOT_FOUND, http: 404, condition: "membershipId / membership_id does not exist" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "plan_id does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "product_id does not exist" }
  - { id: ERR_TRANSACTION_NOT_FOUND, http: 404, condition: "transactionId / transaction_id does not exist" }
  - { id: ERR_RETURN_NOT_FOUND, http: 404, condition: "returnId does not exist" }
  - { id: ERR_CARD_NOT_FOUND, http: 404, condition: "cardId does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, bad type, or enum value out of range (e.g., qty < 1, tier not in enum, BASIC plan with nonzero reward_rate_bps)" }
  - { id: ERR_STALE_MEMBERSHIP_VERSION, http: 412, condition: "expected_membership_version != current Membership.version on renew/cancel" }
  - { id: ERR_MEMBERSHIP_NOT_ACTIVE, http: 409, condition: "operation requires Membership.status == ACTIVE (renew on non-ACTIVE, cancel on non-ACTIVE, open/line/finalize transaction)" }
  - { id: ERR_TRANSACTION_NOT_OPEN, http: 409, condition: "add line/finalize/void on a non-OPEN transaction" }
  - { id: ERR_RETURN_NOT_PENDING, http: 409, condition: "approve/reject on a non-PENDING return" }
  - { id: ERR_CARD_NOT_ACTIVE, http: 409, condition: "revoke a non-ACTIVE household card" }
  - { id: ERR_MEMBER_ONLY_PRODUCT, http: 403, condition: "member_only product added when owning membership not ACTIVE" }
  - { id: ERR_PURCHASE_LIMIT_EXCEEDED, http: 409, condition: "per-member purchase limit would be exceeded for the term" }
  - { id: ERR_HOUSEHOLD_CARD_LIMIT, http: 409, condition: "INCLUDED card would exceed plan.max_household_cards" }
  - { id: ERR_NO_RECEIPT_LOOKUP_DENIED, http: 409, condition: "no-receipt return cannot be matched to a qualifying FINALIZED purchase within the policy window" }
  - { id: ERR_RETURN_QTY_EXCEEDS_PURCHASED, http: 409, condition: "receipted return qty + already returned > original line qty" }
  - { id: ERR_REWARD_REDEMPTION_EXCEEDS_AVAILABLE, http: 422, condition: "redeem_reward_cents > available reward (accrued - redeemed) for current term" }
  - { id: ERR_EMPTY_TRANSACTION, http: 409, condition: "finalize a transaction with zero lines" }
  - { id: ERR_PRODUCT_SKU_DUPLICATE, http: 409, condition: "creating a product with an existing sku" }
  - { id: ERR_PAYMENT_PURPOSE_MISMATCH, http: 409, condition: "SIGNUP payment on a non-PENDING_PAYMENT membership, or RENEWAL payment on a non-EXPIRED/non-ACTIVE membership" }
  - { id: ERR_INVALID_PROMO_WINDOW, http: 400, condition: "InstantSaving window_end_utc <= window_start_utc" }
  - { id: ERR_INVALID_PRICE, http: 400, condition: "member_price_cents > list_price_cents" }
  - { id: ERR_INVALID_PAGINATION, http: 400, condition: "limit/offset out of allowed bounds" }
  - { id: ERR_CARD_KIND_INVALID, http: 400, condition: "card_kind not in {INCLUDED, PAID_ADDON}" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ClubAdmin
    description: "Operator who seeds plans, products, instant savings; full operational override"
    identity: "opaque"
    exclusive_operations:
      - "POST /plans"
      - "POST /products"
      - "POST /instant-savings"
      - "POST /_clock/set_current_utc"
      - "GET /memberships (list all)"
    shared_operations:
      - "renew/cancel memberships, manage household cards, run transactions and returns (override of all member/clerk ops)"

  - name: Member
    description: "Authenticated membership owner; acts on own membership, cards, payments, renew/cancel"
    identity: "entity_backed:Membership"
    exclusive_operations: []
    shared_operations:
      - "POST /memberships/{id}/renew (own)"
      - "POST /memberships/{id}/cancel (own)"
      - "POST /household-cards (own membership)"
      - "POST /household-cards/{id}/revoke (own)"
      - "POST /payments (own membership)"
      - "GET own membership / cards / payments / returns / ledger / fee-events"

  - name: RegisterClerk
