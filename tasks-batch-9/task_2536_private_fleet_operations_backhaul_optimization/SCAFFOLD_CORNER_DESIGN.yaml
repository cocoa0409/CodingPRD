      - name: coaching_an_already_coached_event_is_refused
        claim_type: Precondition Enforcement
        grounds:
          - state_machines[TelematicsEvent.coached]
          - errors.ERR_ALREADY_COACHED
          - calculations.driver_safety_score
        distinguishing_aspect: "The coached dimension has one transition guarded by coached == false. The first coach retires the event's points and lifts the driver's score; the second reports ERR_ALREADY_COACHED and - the point that matters - does NOT credit the points a second time."
        test_recipe:
          setup:
            - "Driver D-SM7 has one SPEEDING severity 2 event: 3 * 2 = 6 points, so safety_score is 94."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-SM7", region_code: "MIDWEST", tractor_capacity: 20, driver_headcount_target: 10, fixed_ownership_cents_per_day: 10000, overhead_cents_per_day: 3000, dedicated_rate_cents_per_mile: 280, dedicated_rate_cents_per_case: 205 }
              as: FleetPlanner
              captures: { dom_id: $.data.id }
            - call: "POST /fleet/driver-pay-plans"
              payload: { plan_code: "MILE-C", mileage_cents_per_mile: 80, stop_cents_per_stop: 2000, drop_hook_cents: 1400, hourly_cents_per_minute: 40, minimum_daily_cents: 20000, backhaul_bonus_pct: 0.04 }
              as: PayrollAnalyst
              captures: { plan_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-SM7", domicile_id: "${dom_id}", pay_plan_id: "${plan_id}", seniority_date: "2019-03-01" }
              as: TransportManager
              captures: { driver_id: $.data.id }
            - call: "POST /fleet/telematics-events"
              payload: { driver_id: "${driver_id}", event_type: "SPEEDING", severity: 2, occurred_at: "2026-07-25T10:00:00Z" }
              as: SafetyManager
              captures: { event_id: $.data.id, ev_points: $.data.penalty_points }
          trigger:
            - call: "POST /fleet/telematics-events/${event_id}/coach"
              payload: { coaching_note: "reviewed dash cam" }
              as: SafetyManager
              as_user_id: "user-safety-1"
              captures: { c1_coached: $.data.coached, c1_at: $.data.coached_at, c1_by: $.data.coached_by_user_id }
            - call: "GET /fleet/drivers/${driver_id}"
              payload: {}
              as: SafetyManager
              captures: { d_points_1: $.data.open_penalty_points, d_score_1: $.data.safety_score }
            - call: "POST /fleet/telematics-events/${event_id}/coach"
              payload: { coaching_note: "reviewed again" }
              as: SafetyManager
              as_user_id: "user-safety-1"
              captures: { c2_err: $.data.error_id }
            - call: "GET /fleet/drivers/${driver_id}"
              payload: {}
              as: SafetyManager
              captures: { d_points_2: $.data.open_penalty_points, d_score_2: $.data.safety_score }
          assert:
            - "${ev_points} == 6"
            - "${c1_coached} == true, ${c1_at} == 2026-08-01T00:00:00Z (the logical clock, not the occurred_at) and ${c1_by} == user-safety-1"
            - "${d_points_1} == 0 and ${d_score_1} == 100"
            - "${c2_err} == ERR_ALREADY_COACHED with HTTP 409"
            - "${d_points_2} == 0 and ${d_score_2} == 100 - unchanged, so the refused coach credited nothing"

