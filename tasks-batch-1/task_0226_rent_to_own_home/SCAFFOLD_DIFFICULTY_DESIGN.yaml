          - entities.Agreement.fields.grace_days
        distinguishing_aspect: |
          Numeric threshold boundary on POST /rent-payments/{id}/record: with grace_days=5 and
          due_date 2026-02-01, paid_at exactly +5 days (2026-02-06) -> PAID (days_late==grace_days,
          fee 0); +6 days (2026-02-07) -> LATE (fee 10000). >= vs > on the grace boundary.
