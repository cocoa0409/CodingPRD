  - section: calculations
    instances:
      - name: response_log_without_arrival_is_undocumented_against_specialty_limit
        claim_type: correct_result
        grounds:
          - calculations.response_time_compliance
          - entities.ResponseLog.fields.compliance_status
          - entities.ResponseLog.fields.applicable_limit_minutes
          - entities.ActivationCriteriaTier.fields.specialty_response_limit_minutes
        distinguishing_aspect: "A NEUROSURGERY log with arrived_at omitted yields response_minutes null, compliance_status UNDOCUMENTED and applicable_limit_minutes 60 (the specialty limit, not the 30 minute surgeon limit), and because the responder is not a SURGEON no DELAYED_SURGEON PIEvent is created."
        test_recipe:
          setup:
            - "one trauma center with a TIER_2_MODIFIED tier whose surgeon limit is 30 and specialty limit is 60"
            - "one INCLUDED case at that center and no PI events"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
