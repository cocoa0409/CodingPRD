      - name: open_for_sale_without_allotment_or_fare_rule_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Sailing[PLANNED -> OPEN_FOR_SALE].preconditions
          - validations[priority=19].ERR_SAILING_NOT_SELLABLE
          - errors[ERR_SAILING_NOT_SELLABLE]
        distinguishing_aspect: |
          Both sellability preconditions are enforced independently and both raise the same
          422 ERR_SAILING_NOT_SELLABLE: a sailing with no allotment fails, a sailing WITH an
          allotment but no published fare also fails, and only once both exist does the same
          call succeed. The failures leave the sailing in PLANNED at its original version, so a
          refused transition has no partial effect.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; category IA exists."
            - "Sailing NOS-2701 is PLANNED with neither an allotment nor a fare rule."
            - "Sailing NOF-2701 is PLANNED with an IA allotment but no fare rule."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "NOS-2701", embark_date: "2027-01-10T17:00:00Z", nights: 7, total_lower_berths: 200, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_nos: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "BOREAL", voyage_code: "NOF-2701", embark_date: "2027-02-10T17:00:00Z", nights: 7, total_lower_berths: 100, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_nof: $.data.id, v_nof: $.data.version }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_nof}", cabin_category_id: "${cat_ia}", physical_cabins: 10, oversell_allowance: 0 }
              as: RevenueManager
          trigger:
            - call: "POST /sailings/${sail_nos}/open-for-sale"
              payload: {}
              as: RevenueManager
              captures: { e1: $.data.error_id }
            - call: "POST /sailings/${sail_nof}/open-for-sale"
              payload: {}
              as: RevenueManager
              captures: { e2: $.data.error_id }
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_nof}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 150000, third_berth_fare_cents: 50000, fourth_berth_fare_cents: 40000 }
              as: RevenueManager
            - call: "POST /sailings/${sail_nof}/open-for-sale"
              payload: {}
              as: RevenueManager
              captures: { v_nof_open: $.data.version }
          assert:
            - "the no-allotment attempt returns HTTP 422 with data.error_id == ERR_SAILING_NOT_SELLABLE"
            - "the no-fare-rule attempt returns HTTP 422 with data.error_id == ERR_SAILING_NOT_SELLABLE"
            - "after both refusals Sailing.${sail_nos}.status == PLANNED and Sailing.${sail_nof}.status == PLANNED with version still ${v_nof}"
            - "once the fare rule exists the same call returns HTTP 200 with status == OPEN_FOR_SALE and ${v_nof_open} == 2"
            - "Sailing.${sail_nof}.available_lower_berth_days_gross == 700"

      - name: close_inventory_cancels_every_waitlisted_booking
        claim_type: side_effect_execution
        grounds:
          - state_machines.Sailing[OPEN_FOR_SALE -> INVENTORY_CLOSED].side_effects
          - state_machines.Booking[WAITLISTED -> CANCELLED]
          - endpoints[POST /sailings/{id}/close-inventory]
        distinguishing_aspect: |
          Closing inventory must apply EVERY declared side effect, not just the status change:
          all waitlisted bookings of the sailing (plural, not merely the queue head) are
          cancelled with cancel_reason INVENTORY_CLOSED and both penalty figures pinned to zero
          because a waitlisted booking never held a cabin, each affected allotment's
