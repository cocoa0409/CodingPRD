scenario: |
  2934. Incentive Travel & Corporate Event Program (incentive travel management company): program design with
  qualification criteria, award tiers and budget per qualifier, destination selection, site inspection and supplier
  contracting with attrition and force majeure terms, qualifier communication, registration and guest policy
  administration, air travel management with deviation requests, upgrade policies and change fees, on-site operations
  with activity options, hospitality desks and risk management, taxable award reporting for winners and gross-up policy
  decisions, program measurement against sales lift and participant satisfaction, contract negotiation, deposit schedule
  and cancellation exposure management

domain_name: incentive-travel-program
api_prefix: "/"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Ten peer entities linked by explicit foreign keys. Every collection lives at the URL root
  # (/programs, /award-tiers, /qualifiers, /destinations, /supplier-contracts, /deposit-milestones,
  # /registrations, /onsite-activities, /activity-signups, /tax-award-reports); no entity id is ever
  # nested inside another entity's path. Parent context always travels in the request body as an FK.

  state_machine_shape: cyclic
  # SupplierContract loops PROPOSED -> COUNTERED -> PROPOSED for up to MAX_NEGOTIATION_ROUNDS rounds;
  # Registration.air_status loops TICKETED -> CHANGE_PENDING -> TICKETED per change; Qualifier.tax_status
  # loops PENDING_REPORT -> REPORTED -> VOIDED -> PENDING_REPORT. Qualifier and Registration each carry two
  # independent state dimensions on the same row (award_status x tax_status; attendance_status x air_status).

  relationship_patterns:
    - one_to_many          # Program -> AwardTier / Qualifier / Destination / OnsiteActivity
    - many_to_many         # ActivitySignup joins OnsiteActivity and Registration
    - self_referential     # Registration.guest_of_registration_id -> Registration.id (GUEST accompanies WINNER)
    - cross_aggregate      # Registration confirmation writes SupplierContract room-night ledger and Program budget

  role_model: segregation_of_duties
  # The user id that proposed or countered a SupplierContract may not execute it; the user id that filed a
  # TaxAwardReport may not void it. Role separation alone is insufficient — X-User-ID is compared.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 10 entities / 52 endpoints / 51 error codes / 9 calculation rules (3 with divergent variants) /
  # 11 state machines (3 cyclic, 2 parallel-dimension pairs, 2 branching).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Human-readable program name, e.g. "FY26 Presidents Circle".
        constraints: non-empty, max 160 chars
      - name: fiscal_year
        type: integer
        source: input
        description: Fiscal year the incentive program belongs to.
        constraints: 2000..2100
      - name: qualification_metric
        type: enum
        source: input
        description: Which sales metric qualification thresholds are expressed in.
        constraints: "one of {NET_REVENUE_CENTS, UNITS_SOLD, MARGIN_CENTS}"
      - name: sales_period_start
        type: datetime
        source: input
        description: Inclusive ISO 8601 UTC instant at which the qualifying sales period opens.
      - name: sales_period_end
        type: datetime
        source: input
        description: Inclusive ISO 8601 UTC instant at which the qualifying sales period closes; must be > sales_period_start.
      - name: budget_total_cents
        type: integer
        source: input
        description: Total approved program budget in whole cents.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Program lifecycle state; see state_machines[entity=Program, state_field=status].
        default: DESIGN
        constraints: "one of {DESIGN, SOURCING, CONTRACTED, REGISTRATION_OPEN, ONSITE, RECONCILED, CLOSED, CANCELLED}"
      - name: gross_up_policy
        type: enum
        source: system
        description: Taxable-award gross-up policy decision; drives which variant of taxable_award_gross_up runs.
        default: NONE
        constraints: "one of {NONE, FLAT_SUPPLEMENTAL, FULL_GROSS_UP}"
      - name: gross_up_policy_locked
        type: boolean
        source: system
        description: True once POST /programs/{program_id}/gross-up-policy has been accepted; blocks any further policy change.
        default: false
      - name: per_person_cost_basis_cents
        type: integer
        source: computed
        description: Copy of the SELECTED Destination's per_person_cost_cents, stamped by the SupplierContract EXECUTED cascade. Stays 0 until then.
        default: 0
      - name: committed_budget_cents
        type: integer
        source: computed
        description: Output of calculations.program_budget_rollup — sum of qualifier award commitments plus confirmed air-side variance.
        default: 0
      - name: budget_headroom_cents
        type: integer
        source: computed
        description: budget_total_cents - committed_budget_cents. May be negative.
        default: 0
      - name: budget_posture
        type: enum
        source: computed
        description: Threshold posture derived from utilization_bp in calculations.program_budget_rollup.
        default: OK
        constraints: "one of {OK, WATCH, OVERCOMMITTED}"
      - name: cancellation_exposure_cents
        type: integer
        source: computed
        description: Sum of binding_exposure_cents over this program's SupplierContract rows with status == EXECUTED (calculations.cancellation_exposure_projection).
        default: 0
      - name: reported_award_total_cents
        type: integer
        source: computed
        description: Sum of TaxAwardReport.reported_value_cents over reports with status == FILED for this program's qualifiers.
        default: 0
      - name: sales_lift_pct
        type: number
        source: computed
        description: Output of calculations.program_measurement; null until the program reaches RECONCILED or measurement is read.
        default: null
      - name: satisfaction_index
        type: number
        source: computed
        description: Output of calculations.program_measurement; null when the survey set is empty.
        default: null
      - name: qualified_count
        type: integer
        source: computed
        description: Count of this program's Qualifier rows with award_status IN {QUALIFIED, NOTIFIED, REGISTERED, TRAVELLED}.
        default: 0
      - name: travelled_count
        type: integer
        source: computed
        description: Count of this program's Qualifier rows with award_status == TRAVELLED.
        default: 0
      - name: cancellation_reason
        type: string
        source: system
        description: Free text captured by POST /programs/{program_id}/cancel; null otherwise.
        default: null

  - name: AwardTier
    parent: Program
    common_fields: false
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; the program whose tier ladder this row belongs to.
      - name: tier_code
        type: string
        source: input
        description: Short tier label, e.g. "PLATINUM". Unique per program_id.
        constraints: non-empty, max 40 chars
      - name: tier_rank
        type: integer
        source: input
        description: Seniority rank; 1 is the most senior tier. Unique per program_id; used as the selector tie-break.
        constraints: ">= 1"
      - name: qualification_threshold
        type: integer
        source: input
        description: Minimum Qualifier.actual_metric (in units of Program.qualification_metric) required for this tier. Compared with >=.
        constraints: ">= 0"
      - name: budget_per_qualifier_cents
        type: integer
        source: input
        description: Per-qualifier award budget cap for this tier, in whole cents.
        constraints: ">= 0"
      - name: guest_allowance
        type: integer
        source: input
        description: Maximum number of accompanying guests a qualifier in this tier may bring.
        default: 0
        constraints: 0..2
      - name: air_cabin_class
        type: enum
        source: input
        description: Cabin class the tier entitles the winner to; the baseline for upgrade billing.
        constraints: "one of {ECONOMY, PREMIUM_ECONOMY, BUSINESS}"
      - name: upgrade_allowance_cents
        type: integer
        source: input
        description: Cents of cabin-upgrade cost the program absorbs before the winner is billed.
        default: 0
        constraints: ">= 0"
      - name: service_load_bp
        type: integer
        source: input
        description: Basis points of service load added to the destination per-person cost for this tier.
        default: 0
        constraints: 0..5000

  - name: Qualifier
    parent: Program
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; the program this salesperson competed in.
      - name: employee_code
        type: string
        source: input
        description: Employer-assigned salesperson code. Unique per program_id; also the secondary sort key for waitlist promotion.
        constraints: non-empty, max 40 chars
      - name: full_name
        type: string
        source: input
        description: Salesperson display name.
        constraints: non-empty, max 160 chars
      - name: baseline_metric
        type: integer
        source: input
        description: Prior-period metric value for this salesperson; the denominator input of calculations.program_measurement.
        constraints: ">= 0"
      - name: actual_metric
        type: integer
        source: input
        description: Qualifying-period metric value; compared with AwardTier.qualification_threshold by the tier selector.
        constraints: ">= 0"
      - name: guest_count
        type: integer
        source: input
        description: Number of guests the salesperson intends to bring; validated against the assigned tier's guest_allowance at review.
        default: 0
        constraints: 0..2
      - name: award_status
        type: enum
        source: system
        description: Award-track dimension; evolves independently of tax_status. See state_machines[entity=Qualifier, state_field=award_status].
        default: PENDING_REVIEW
        constraints: "one of {PENDING_REVIEW, QUALIFIED, DISQUALIFIED, NOTIFIED, REGISTERED, TRAVELLED, WITHDRAWN}"
      - name: tax_status
        type: enum
        source: system
        description: Tax-reporting dimension; evolves independently of award_status. See state_machines[entity=Qualifier, state_field=tax_status].
        default: NOT_APPLICABLE
        constraints: "one of {NOT_APPLICABLE, PENDING_REPORT, REPORTED, VOIDED}"
      - name: assigned_tier_id
        type: string
        source: computed
        description: FK -> AwardTier.id; tier chosen by calculations.tier_assignment_selector at review. Stays null while award_status IN {PENDING_REVIEW, DISQUALIFIED}.
        default: null
      - name: committed_cost_cents
        type: integer
        source: computed
        description: Output of calculations.qualifier_committed_cost. Recomputed by the SupplierContract EXECUTED cascade once per_person_cost_basis_cents is known.
        default: 0
      - name: taxable_award_cents
        type: integer
        source: computed
        description: Output of calculations.taxable_award_base; stamped when the program reaches RECONCILED. 0 until then.
        default: 0
      - name: notified_at
        type: datetime
        source: system
        description: Logical-clock instant at which POST /programs/{program_id}/notify-qualifiers moved this row to NOTIFIED; null otherwise.
        default: null

  - name: Destination
    parent: Program
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; the program this candidate destination was sourced for.
      - name: city
        type: string
        source: input
        description: Destination city name.
        constraints: non-empty, max 120 chars
      - name: country_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 country code.
        constraints: exactly 2 uppercase letters
      - name: per_person_cost_cents
        type: integer
        source: input
        description: All-in land cost per participant in whole cents; becomes Program.per_person_cost_basis_cents on selection.
        constraints: ">= 0"
      - name: risk_score
        type: integer
        source: input
        description: Travel-risk score; gates shortlisting at MAX_DESTINATION_RISK.
        constraints: 0..100
      - name: air_gateway_code
        type: string
        source: input
        description: IATA code of the arrival gateway.
        constraints: exactly 3 uppercase letters
      - name: status
        type: enum
        source: system
        description: Selection lifecycle; see state_machines[entity=Destination, state_field=status].
        default: CANDIDATE
        constraints: "one of {CANDIDATE, SHORTLISTED, SELECTED, REJECTED}"
      - name: inspection_status
        type: enum
        source: system
        description: Whether a site inspection has been recorded for this destination.
        default: NOT_INSPECTED
        constraints: "one of {NOT_INSPECTED, INSPECTED}"
      - name: inspection_score
        type: integer
        source: system
        description: Score recorded by POST /destinations/{destination_id}/site-inspection; gates shortlisting at MIN_INSPECTION_SCORE.
        default: null
        constraints: 0..100 when present
      - name: inspected_by_user_id
        type: string
        source: system
        description: X-User-ID of the SourcingManager who recorded the inspection; null when NOT_INSPECTED.
        default: null
      - name: inspected_at
        type: datetime
        source: system
        description: Logical-clock instant of the recorded inspection; null when NOT_INSPECTED.
        default: null

  - name: SupplierContract
    parent: Destination
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; the program the contract is sourced for.
      - name: destination_id
        type: string
        source: input
        description: FK -> Destination.id; the destination the supplier operates in. Must belong to program_id.
      - name: supplier_name
        type: string
        source: input
        description: Supplier legal name.
        constraints: non-empty, max 160 chars
      - name: supplier_kind
        type: enum
        source: input
        description: Supplier category. Only HOTEL contracts drive destination selection and program advancement.
        constraints: "one of {HOTEL, DMC, AIR_CONSOLIDATOR}"
      - name: status
        type: enum
        source: system
        description: Negotiation lifecycle; see state_machines[entity=SupplierContract, state_field=status].
        default: DRAFT
        constraints: "one of {DRAFT, PROPOSED, COUNTERED, EXECUTED, WITHDRAWN}"
      - name: round_count
        type: integer
        source: system
        description: Number of PROPOSE/COUNTER rounds consumed; capped by MAX_NEGOTIATION_ROUNDS.
        default: 0
      - name: room_block_count
        type: integer
        source: input
        description: Rooms held per night for the whole stay window.
        constraints: ">= 1"
      - name: contracted_nights
        type: integer
        source: input
        description: Number of nights in the contracted stay window.
        constraints: ">= 1"
      - name: stay_start_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant (T00:00:00Z) of the first contracted night; the inclusive lower bound of the stay window.
      - name: stay_end_at
        type: datetime
        source: computed
        description: stay_start_at + contracted_nights days; the exclusive upper bound registrations must depart by (departure_date <= stay_end_at).
        default: null
      - name: nightly_rate_cents
        type: integer
        source: input
        description: Contracted room rate per room-night in whole cents.
        constraints: ">= 0"
      - name: attrition_allowance_bp
        type: integer
        source: input
        description: Basis points of the blocked room-nights the supplier waives; the attrition floor is the complement.
        constraints: 0..10000
      - name: force_majeure_clause
        type: enum
        source: input
        description: Force-majeure relief tier applied to the deposit-forfeiture exposure basis.
        constraints: "one of {NONE, STANDARD, EXPANDED}"
      - name: exposure_basis
        type: enum
        source: input
        description: Which variant of calculations.cancellation_exposure_projection is binding for this contract.
        constraints: "one of {ATTRITION_BASIS, DEPOSIT_FORFEITURE_BASIS}"
      - name: room_nights_blocked
        type: integer
        source: computed
        description: room_block_count * contracted_nights; stamped when status becomes EXECUTED, 0 before.
        default: 0
      - name: room_nights_confirmed
        type: integer
        source: computed
        description: Output of calculations.room_night_ledger — sum of Registration.room_nights over CONFIRMED/TRAVELLED registrations of program_id.
        default: 0
      - name: room_nights_available
        type: integer
        source: computed
        description: room_nights_blocked - room_nights_confirmed; the conserved complement asserted by the room-night invariant.
        default: 0
      - name: attrition_posture
        type: enum
        source: computed
        description: AT_RISK when shortfall_room_nights > 0, else CLEAR (calculations.room_night_ledger).
        default: CLEAR
        constraints: "one of {CLEAR, AT_RISK}"
      - name: last_proposed_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor whose most recent negotiate call used action == PROPOSE; null before the first round.
        default: null
      - name: last_countered_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor whose most recent negotiate call used action == COUNTER; null when no counter has landed.
        default: null
      - name: executed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ContractApprover who executed the contract; null before EXECUTED.
        default: null
      - name: executed_at
        type: datetime
        source: system
        description: Logical-clock instant of execution; null before EXECUTED.
        default: null
      - name: withdrawal_reason
        type: string
        source: system
        description: Free text captured by POST /supplier-contracts/{contract_id}/withdraw; null otherwise.
        default: null

  - name: DepositMilestone
    parent: SupplierContract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> SupplierContract.id; the contract whose deposit schedule this milestone belongs to.
      - name: sequence
        type: integer
        source: input
        description: 1-based position in the deposit schedule. Unique per contract_id; the waterfall processing order.
        constraints: ">= 1"
      - name: due_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the milestone matures; compared with the logical clock by the deposit-forfeiture waterfall.
      - name: amount_cents
        type: integer
        source: input
        description: Milestone amount in whole cents.
        constraints: ">= 0"
      - name: refundable_bp
        type: integer
        source: input
        description: Basis points of amount_cents recoverable if the program is cancelled strictly before due_at. 10000 = fully refundable.
        constraints: 0..10000
      - name: status
        type: enum
        source: system
        description: Milestone lifecycle; see state_machines[entity=DepositMilestone, state_field=status].
        default: SCHEDULED
        constraints: "one of {SCHEDULED, PAID, FORFEITED, REFUNDED, CANCELLED}"
      - name: requires_finance_review
        type: boolean
        source: computed
        description: Set true by the fifth hop of the contract-execution cascade when Program.budget_posture becomes OVERCOMMITTED.
        default: false
      - name: paid_at
        type: datetime
        source: system
        description: Logical-clock instant of payment; null unless status IN {PAID, FORFEITED, REFUNDED}.
        default: null

  - name: Registration
    parent: Qualifier
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: computed
        description: FK -> Program.id; denormalised from the referenced Qualifier.program_id at creation. Input value, if any, is ignored.
      - name: qualifier_id
        type: string
        source: input
        description: FK -> Qualifier.id; the winner this registration is charged to (a GUEST row carries the same qualifier_id as its winner).
      - name: registration_kind
        type: enum
        source: input
        description: Whether this row is the winner's own seat or an accompanying guest's.
        constraints: "one of {WINNER, GUEST}"
      - name: guest_of_registration_id
        type: string
        source: input
        description: FK -> Registration.id; the WINNER row this GUEST accompanies. Required when registration_kind == GUEST, must be null otherwise.
        default: null
      - name: attendance_status
        type: enum
        source: system
        description: Attendance dimension; evolves independently of air_status. See state_machines[entity=Registration, state_field=attendance_status].
        default: INVITED
        constraints: "one of {INVITED, ACCEPTED, DECLINED, CONFIRMED, CANCELLED, TRAVELLED}"
      - name: arrival_date
        type: datetime
        source: input
        description: ISO 8601 UTC instant (T00:00:00Z) of the first occupied night; inclusive lower bound of the half-open night interval.
      - name: departure_date
        type: datetime
        source: input
        description: ISO 8601 UTC instant (T00:00:00Z) of departure; exclusive upper bound — the departure date's night is NOT occupied.
      - name: rooms
        type: integer
        source: input
        description: Rooms this registration occupies on every night in its interval.
        default: 1
        constraints: 1..3
      - name: room_nights
        type: integer
        source: computed
        description: rooms * (departure_date - arrival_date in whole days). Summed by calculations.room_night_ledger.
        default: 0
      - name: waiver_on_file
        type: boolean
        source: system
        description: True once POST /registrations/{registration_id}/respond was accepted with waiver_signed == true. Gates HIGH risk_level activity signups.
        default: false
      - name: air_status
        type: enum
        source: system
        description: Air dimension; evolves independently of attendance_status. See state_machines[entity=Registration, state_field=air_status].
        default: NOT_REQUESTED
        constraints: "one of {NOT_REQUESTED, REQUESTED, TICKETED, CHANGE_PENDING, VOIDED}"
      - name: air_cabin_class
        type: enum
        source: system
        description: Cabin class requested on the air record; null while air_status == NOT_REQUESTED.
        default: null
        constraints: "one of {ECONOMY, PREMIUM_ECONOMY, BUSINESS} when present"
      - name: air_deviation_pre_days
        type: integer
        source: system
        description: Days of pre-program deviation requested.
        default: 0
        constraints: 0..7
      - name: air_deviation_post_days
        type: integer
        source: system
        description: Days of post-program deviation requested.
        default: 0
        constraints: 0..7
      - name: air_base_fare_cents
        type: integer
        source: system
        description: Quoted base fare in whole cents; the cap base for change fees.
        default: 0
      - name: air_upgrade_cost_cents
        type: integer
        source: computed
        description: Winner-billable cabin upgrade cost from calculations.air_cost_and_change_fee.
        default: 0
      - name: air_deviation_fee_cents
        type: integer
        source: computed
        description: Deviation surcharge from calculations.air_cost_and_change_fee.
        default: 0
      - name: air_change_count
        type: integer
        source: system
        description: Number of completed re-ticketing rounds; the escalator exponent of the change-fee formula.
        default: 0
      - name: air_change_fee_total_cents
        type: integer
        source: computed
        description: Capped cumulative change fee from calculations.air_cost_and_change_fee.
        default: 0
      - name: cost_cents
        type: integer
        source: computed
        description: air_upgrade_cost_cents + air_deviation_fee_cents + air_change_fee_total_cents; the air-side variance this row contributes to Program.committed_budget_cents while attendance_status IN {CONFIRMED, TRAVELLED}.
        default: 0
      - name: satisfaction_score
        type: integer
        source: system
        description: Post-trip survey score recorded by POST /registrations/{registration_id}/survey; null when not surveyed.
        default: null
        constraints: 1..10 when present
      - name: cancellation_reason
        type: string
        source: system
        description: Free text captured by POST /registrations/{registration_id}/cancel or the program-cancellation cascade; null otherwise.
        default: null

  - name: OnsiteActivity
    parent: Program
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; the program whose on-site agenda this activity belongs to.
      - name: name
        type: string
        source: input
        description: Activity name, e.g. "Douro Valley Sail".
        constraints: non-empty, max 160 chars
      - name: start_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the activity starts; closed lower bound of the buffered conflict interval.
      - name: end_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the activity ends; closed upper bound of the buffered conflict interval. Must be > start_at.
      - name: capacity
        type: integer
        source: input
        description: Maximum number of signups that may be BOOKED at once. 0 means every signup lands on the waitlist.
        constraints: ">= 0"
      - name: risk_level
        type: enum
        source: input
        description: Risk classification; HIGH requires the registration to carry waiver_on_file == true.
        constraints: "one of {LOW, MEDIUM, HIGH}"
      - name: status
        type: enum
        source: system
        description: Activity lifecycle; see state_machines[entity=OnsiteActivity, state_field=status].
        default: OPEN
        constraints: "one of {OPEN, CLOSED, CANCELLED}"
      - name: booked_count
        type: integer
        source: computed
        description: Count of this activity's ActivitySignup rows with status == BOOKED (calculations.activity_seat_allocation).
        default: 0
      - name: waitlist_count
        type: integer
        source: computed
        description: Count of this activity's ActivitySignup rows with status == WAITLISTED.
        default: 0

  - name: ActivitySignup
    parent: OnsiteActivity
    common_fields: true
    fields:
      - name: activity_id
        type: string
        source: input
        description: FK -> OnsiteActivity.id; the activity being signed up for.
      - name: registration_id
        type: string
        source: input
        description: FK -> Registration.id; the participant seat consuming the activity slot.
      - name: status
        type: enum
        source: system
        description: Signup lifecycle; see state_machines[entity=ActivitySignup, state_field=status].
        default: BOOKED
        constraints: "one of {BOOKED, WAITLISTED, CANCELLED}"
      - name: promoted_at
        type: datetime
        source: system
        description: Logical-clock instant at which a WAITLISTED row was promoted to BOOKED by the waitlist-promotion cascade; null otherwise.
        default: null

  - name: TaxAwardReport
    parent: Qualifier
    common_fields: true
    fields:
      - name: qualifier_id
        type: string
        source: input
        description: FK -> Qualifier.id; the winner whose taxable award this report covers.
      - name: tax_year
        type: integer
        source: input
        description: Tax year the award is reported in.
        constraints: 2000..2100
      - name: award_value_cents
        type: integer
        source: computed
        description: Snapshot of Qualifier.taxable_award_cents taken at draft creation; frozen thereafter.
        default: 0
      - name: gross_up_method
        type: enum
        source: computed
        description: Snapshot of Program.gross_up_policy taken at draft creation; selects the variant of calculations.taxable_award_gross_up.
        default: NONE
        constraints: "one of {NONE, FLAT_SUPPLEMENTAL, FULL_GROSS_UP}"
      - name: combined_rate_bp
        type: integer
        source: computed
        description: Combined withholding rate in basis points used by the selected variant; 0 for NONE.
        default: 0
      - name: gross_up_cents
        type: integer
        source: computed
        description: Employer-borne gross-up in whole cents from calculations.taxable_award_gross_up.
        default: 0
      - name: reported_value_cents
        type: integer
        source: computed
        description: award_value_cents + gross_up_cents; the figure that enters Program.reported_award_total_cents on filing.
        default: 0
      - name: status
        type: enum
        source: system
        description: Report lifecycle; see state_machines[entity=TaxAwardReport, state_field=status].
        default: DRAFT
        constraints: "one of {DRAFT, FILED, VOIDED}"
      - name: filed_by_user_id
        type: string
        source: system
        description: X-User-ID that filed the report; the segregation-of-duties comparand for voiding. Null while DRAFT.
        default: null
      - name: filed_at
        type: datetime
        source: system
        description: Logical-clock instant of filing; null while DRAFT.
        default: null
      - name: voided_by_user_id
        type: string
        source: system
        description: X-User-ID that voided the report; must differ from filed_by_user_id. Null unless VOIDED.
        default: null
      - name: void_reason
        type: string
        source: system
        description: Free text captured by POST /tax-award-reports/{report_id}/void; null otherwise.
        default: null

state_machines:
  # ---------------------------------------------------------------- Program.status
  - entity: Program
    state_field: status
    initial_state: DESIGN
    terminal_states: [CLOSED, CANCELLED]
    shape: branching
    transitions:
      - from: DESIGN
        to: SOURCING
        trigger: "POST /programs/{program_id}/advance with to_status == SOURCING"
        actor: ProgramDirector
        preconditions:
          - "at least one AwardTier row exists for this program_id"
          - "at least one Destination row for this program_id has status == SHORTLISTED"
        side_effects:
          - "increments Program.version by 1"
        note: "Sourcing cannot begin until the tier ladder and at least one inspected/shortlisted destination exist."
      - from: SOURCING
        to: CONTRACTED
        trigger: "system event: a SupplierContract with supplier_kind == HOTEL for this program_id reaches EXECUTED"
        actor: system
        preconditions:
          - "the executing SupplierContract.supplier_kind == HOTEL"
          - "Program.status == SOURCING at the moment of execution"
        side_effects:
          - "stamps Program.per_person_cost_basis_cents from the SELECTED Destination.per_person_cost_cents"
          - "recomputes calculations.qualifier_committed_cost for every Qualifier of this program_id with award_status IN {QUALIFIED, NOTIFIED, REGISTERED}"
          - "recomputes calculations.program_budget_rollup (committed_budget_cents, budget_headroom_cents, budget_posture)"
          - "recomputes calculations.cancellation_exposure_projection into cancellation_exposure_cents"
          - "increments Program.version by 1"
        note: "Hop 3 of the five-level contract-execution cascade; never triggered by a direct advance call."
      - from: CONTRACTED
        to: REGISTRATION_OPEN
        trigger: "POST /programs/{program_id}/advance with to_status == REGISTRATION_OPEN"
        actor: ProgramDirector
        preconditions:
          - "zero Qualifier rows for this program_id have award_status == PENDING_REVIEW"
          - "Program.gross_up_policy_locked == true"
        side_effects:
          - "increments Program.version by 1"
      - from: REGISTRATION_OPEN
        to: ONSITE
        trigger: "POST /programs/{program_id}/advance with to_status == ONSITE"
        actor: ProgramDirector
        preconditions:
          - "at least one Registration for this program_id has attendance_status == CONFIRMED"
        side_effects:
          - "every Registration of this program_id with attendance_status == INVITED moves to CANCELLED with cancellation_reason 'REGISTRATION_WINDOW_CLOSED'"
          - "increments Program.version by 1"
      - from: ONSITE
        to: RECONCILED
        trigger: "POST /programs/{program_id}/advance with to_status == RECONCILED"
        actor: ProgramDirector
        preconditions:
          - "zero OnsiteActivity rows for this program_id have status == OPEN"
        side_effects:
          - "every Registration of this program_id with attendance_status == CONFIRMED moves to TRAVELLED"
          - "every Qualifier of this program_id with award_status == REGISTERED moves to TRAVELLED"
          - "stamps Qualifier.taxable_award_cents from calculations.taxable_award_base for every Qualifier now TRAVELLED"
          - "every Qualifier now TRAVELLED with taxable_award_cents > 0 moves tax_status NOT_APPLICABLE -> PENDING_REPORT"
          - "recomputes calculations.program_measurement into sales_lift_pct and satisfaction_index"
          - "increments Program.version by 1"
        note: "All OnsiteActivity rows must be CLOSED (or CANCELLED) before reconciliation; open activities block."
      - from: RECONCILED
        to: CLOSED
        trigger: "POST /programs/{program_id}/advance with to_status == CLOSED"
        actor: ProgramDirector
        preconditions:
          - "every Qualifier of this program_id with taxable_award_cents > 0 has tax_status == REPORTED"
        side_effects:
          - "increments Program.version by 1"
      - from: DESIGN
        to: CANCELLED
        trigger: "POST /programs/{program_id}/cancel"
        actor: ProgramDirector
        preconditions: []
        side_effects:
          - "runs the program-cancellation cascade (see note)"
          - "increments Program.version by 1"
      - from: SOURCING
        to: CANCELLED
        trigger: "POST /programs/{program_id}/cancel"
        actor: ProgramDirector
        preconditions: []
        side_effects:
          - "runs the program-cancellation cascade (see note)"
          - "increments Program.version by 1"
      - from: CONTRACTED
        to: CANCELLED
        trigger: "POST /programs/{program_id}/cancel"
        actor: ProgramDirector
        preconditions: []
        side_effects:
          - "runs the program-cancellation cascade (see note)"
          - "increments Program.version by 1"
      - from: REGISTRATION_OPEN
        to: CANCELLED
        trigger: "POST /programs/{program_id}/cancel"
        actor: ProgramDirector
        preconditions: []
        side_effects:
          - "runs the program-cancellation cascade (see note)"
          - "increments Program.version by 1"
      - from: ONSITE
        to: CANCELLED
        trigger: "POST /programs/{program_id}/cancel"
        actor: ProgramDirector
        preconditions: []
        side_effects:
          - "runs the program-cancellation cascade (see note)"
          - "increments Program.version by 1"
        note: |
          Program-cancellation cascade, applied in this fixed order:
          (1) every Registration with attendance_status IN {INVITED, ACCEPTED, CONFIRMED} -> CANCELLED, and
              air_status IN {REQUESTED, TICKETED, CHANGE_PENDING} -> VOIDED;
          (2) every ActivitySignup of those registrations with status IN {BOOKED, WAITLISTED} -> CANCELLED
              (no waitlist promotion runs during program cancellation);
          (3) every OnsiteActivity with status == OPEN -> CANCELLED;
          (4) every Qualifier with award_status IN {QUALIFIED, NOTIFIED, REGISTERED} -> WITHDRAWN;
          (5) every DepositMilestone of every EXECUTED SupplierContract of this program is settled by
              calculations.cancellation_exposure_projection: status == PAID and logical_now >= due_at -> FORFEITED;
              status == PAID and logical_now < due_at -> REFUNDED; status == SCHEDULED -> CANCELLED;
          (6) Program.cancellation_exposure_cents is re-stamped from the same calculation.
          RECONCILED and CLOSED programs cannot be cancelled (ERR_PROGRAM_STATE_INVALID).

  # ---------------------------------------------------------------- Destination.status
  - entity: Destination
    state_field: status
    initial_state: CANDIDATE
    terminal_states: [SELECTED, REJECTED]
    shape: branching
    transitions:
      - from: CANDIDATE
        to: SHORTLISTED
        trigger: "POST /destinations/{destination_id}/shortlist"
        actor: SourcingManager
        preconditions:
          - "Program.status IN {DESIGN, SOURCING}"
          - "Destination.inspection_status == INSPECTED"
          - "Destination.inspection_score >= MIN_INSPECTION_SCORE (70)"
          - "Destination.risk_score <= MAX_DESTINATION_RISK (60)"
        side_effects:
          - "increments Destination.version by 1"
      - from: SHORTLISTED
        to: SELECTED
        trigger: "system event: a SupplierContract with supplier_kind == HOTEL referencing this destination_id reaches EXECUTED"
        actor: system
        preconditions:
          - "Destination.status == SHORTLISTED"
        side_effects:
          - "every sibling Destination of the same program_id with status IN {CANDIDATE, SHORTLISTED} moves to REJECTED"
          - "increments Destination.version by 1"
        note: "Hop 2 of the five-level contract-execution cascade."
      - from: CANDIDATE
        to: REJECTED
        trigger: "system event: a sibling Destination of the same program_id becomes SELECTED"
        actor: system
        preconditions: []
        side_effects:
          - "increments Destination.version by 1"
      - from: SHORTLISTED
        to: REJECTED
        trigger: "system event: a sibling Destination of the same program_id becomes SELECTED"
        actor: system
        preconditions: []
        side_effects:
          - "increments Destination.version by 1"

  # ---------------------------------------------------------------- Destination.inspection_status
  - entity: Destination
    state_field: inspection_status
    initial_state: NOT_INSPECTED
    terminal_states: [INSPECTED]
    shape: linear
    transitions:
      - from: NOT_INSPECTED
        to: INSPECTED
        trigger: "POST /destinations/{destination_id}/site-inspection"
        actor: SourcingManager
        preconditions:
          - "Destination.status == CANDIDATE"
          - "Program.status IN {DESIGN, SOURCING}"
        side_effects:
          - "stores inspection_score, inspected_by_user_id (X-User-ID) and inspected_at (logical clock)"
          - "increments Destination.version by 1"
        note: "Re-inspection is rejected with ERR_DESTINATION_STATE_INVALID; the score is recorded once."

  # ---------------------------------------------------------------- SupplierContract.status (CYCLIC)
  - entity: SupplierContract
    state_field: status
    initial_state: DRAFT
    terminal_states: [EXECUTED, WITHDRAWN]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /supplier-contracts/{contract_id}/negotiate with action == PROPOSE"
        actor: SourcingManager
        preconditions:
          - "Program.status IN {DESIGN, SOURCING, CONTRACTED}"
          - "round_count < MAX_NEGOTIATION_ROUNDS (5)"
        side_effects:
          - "increments round_count by 1"
          - "overwrites any supplied term fields (room_block_count, contracted_nights, nightly_rate_cents, attrition_allowance_bp, force_majeure_clause, exposure_basis)"
          - "recomputes stay_end_at"
          - "sets last_proposed_by_user_id to X-User-ID"
          - "increments SupplierContract.version by 1"
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /supplier-contracts/{contract_id}/negotiate with action == COUNTER"
        actor: ContractApprover
        preconditions:
          - "Program.status IN {DESIGN, SOURCING, CONTRACTED}"
          - "round_count < MAX_NEGOTIATION_ROUNDS (5)"
        side_effects:
          - "increments round_count by 1"
          - "overwrites any supplied term fields and recomputes stay_end_at"
          - "sets last_countered_by_user_id to X-User-ID"
          - "increments SupplierContract.version by 1"
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /supplier-contracts/{contract_id}/negotiate with action == PROPOSE"
        actor: SourcingManager
        preconditions:
          - "Program.status IN {DESIGN, SOURCING, CONTRACTED}"
          - "round_count < MAX_NEGOTIATION_ROUNDS (5)"
        side_effects:
          - "increments round_count by 1"
          - "overwrites any supplied term fields and recomputes stay_end_at"
          - "sets last_proposed_by_user_id to X-User-ID"
          - "increments SupplierContract.version by 1"
        note: "This edge closes the negotiation cycle PROPOSED -> COUNTERED -> PROPOSED. round_count is monotonic and never resets, so the cycle terminates at MAX_NEGOTIATION_ROUNDS with ERR_NEGOTIATION_ROUNDS_EXHAUSTED."
      - from: PROPOSED
        to: EXECUTED
        trigger: "POST /supplier-contracts/{contract_id}/execute"
        actor: ContractApprover
        preconditions:
          - "Program.status IN {SOURCING, CONTRACTED}"
          - "X-User-ID != last_proposed_by_user_id"
          - "X-User-ID != last_countered_by_user_id"
          - "sum of amount_cents over this contract's DepositMilestone rows with status != CANCELLED <= room_block_count * contracted_nights * nightly_rate_cents"
        side_effects:
          - "stamps executed_by_user_id (X-User-ID) and executed_at (logical clock)"
          - "stamps room_nights_blocked = room_block_count * contracted_nights and recomputes calculations.room_night_ledger"
          - "when supplier_kind == HOTEL: the referenced Destination moves SHORTLISTED -> SELECTED and siblings -> REJECTED"
          - "when supplier_kind == HOTEL and Program.status == SOURCING: Program moves SOURCING -> CONTRACTED with its own cascade"
          - "when the Program cascade leaves budget_posture == OVERCOMMITTED: every DepositMilestone of this contract with status == SCHEDULED gets requires_finance_review = true"
          - "increments SupplierContract.version by 1"
        note: "Hop 1 of the five-level contract-execution cascade; segregation of duties is enforced on X-User-ID, not on role."
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /supplier-contracts/{contract_id}/withdraw"
        actor: SourcingManager
        preconditions:
          - "Program.status != CLOSED"
        side_effects:
          - "stores withdrawal_reason"
          - "every DepositMilestone of this contract with status == SCHEDULED moves to CANCELLED"
          - "increments SupplierContract.version by 1"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /supplier-contracts/{contract_id}/withdraw"
        actor: SourcingManager
        preconditions:
          - "Program.status != CLOSED"
        side_effects:
          - "stores withdrawal_reason"
          - "every DepositMilestone of this contract with status == SCHEDULED moves to CANCELLED"
          - "increments SupplierContract.version by 1"
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /supplier-contracts/{contract_id}/withdraw"
        actor: SourcingManager
        preconditions:
          - "Program.status != CLOSED"
        side_effects:
          - "stores withdrawal_reason"
          - "every DepositMilestone of this contract with status == SCHEDULED moves to CANCELLED"
          - "increments SupplierContract.version by 1"

  # ---------------------------------------------------------------- DepositMilestone.status
  - entity: DepositMilestone
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [FORFEITED, REFUNDED, CANCELLED]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: PAID
        trigger: "POST /deposit-milestones/{milestone_id}/pay"
        actor: ContractApprover
        preconditions:
          - "the parent SupplierContract.status == EXECUTED"
          - "Program.status NOT IN {CANCELLED, CLOSED}"
        side_effects:
          - "stamps paid_at from the logical clock"
          - "recomputes calculations.cancellation_exposure_projection into Program.cancellation_exposure_cents"
          - "increments DepositMilestone.version by 1"
        note: "Guarded cross-entity transition: a milestone on a DRAFT/PROPOSED/COUNTERED contract cannot be paid (ERR_CONTRACT_STATE_INVALID)."
      - from: PAID
        to: FORFEITED
        trigger: "system event: program-cancellation cascade with logical_now >= due_at"
        actor: system
        preconditions: []
        side_effects:
          - "increments DepositMilestone.version by 1"
      - from: PAID
        to: REFUNDED
        trigger: "system event: program-cancellation cascade with logical_now < due_at"
        actor: system
        preconditions: []
        side_effects:
          - "increments DepositMilestone.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system event: program-cancellation cascade, or the parent SupplierContract moving to WITHDRAWN"
        actor: system
        preconditions: []
        side_effects:
          - "increments DepositMilestone.version by 1"

  # ---------------------------------------------------------------- Qualifier.award_status (dimension 1 of 2)
  - entity: Qualifier
    state_field: award_status
    initial_state: PENDING_REVIEW
    terminal_states: [DISQUALIFIED, TRAVELLED, WITHDRAWN]
    shape: parallel
    transitions:
      - from: PENDING_REVIEW
        to: QUALIFIED
        trigger: "POST /qualifiers/{qualifier_id}/review"
        actor: SalesOpsAnalyst
        preconditions:
          - "Program.status IN {DESIGN, SOURCING, CONTRACTED}"
          - "calculations.tier_assignment_selector yields a non-empty eligible tier pool"
          - "guest_count <= the selected AwardTier.guest_allowance"
          - "calculations.qualifier_committed_cost result <= the selected AwardTier.budget_per_qualifier_cents"
        side_effects:
          - "stamps assigned_tier_id from calculations.tier_assignment_selector"
          - "stamps committed_cost_cents from calculations.qualifier_committed_cost"
          - "recomputes Program.qualified_count and calculations.program_budget_rollup"
          - "increments Qualifier.version by 1"
      - from: PENDING_REVIEW
        to: DISQUALIFIED
        trigger: "POST /qualifiers/{qualifier_id}/review"
        actor: SalesOpsAnalyst
        preconditions:
          - "Program.status IN {DESIGN, SOURCING, CONTRACTED}"
          - "calculations.tier_assignment_selector yields an EMPTY eligible tier pool (actual_metric below every tier threshold)"
        side_effects:
          - "leaves assigned_tier_id null and committed_cost_cents 0"
          - "increments Qualifier.version by 1"
        note: "Same trigger, two outcomes — the branch is decided entirely by the selector's eligible pool, not by a request field."
      - from: QUALIFIED
        to: NOTIFIED
        trigger: "POST /programs/{program_id}/notify-qualifiers"
        actor: ProgramDirector
        preconditions:
          - "Program.status IN {CONTRACTED, REGISTRATION_OPEN}"
        side_effects:
          - "stamps notified_at from the logical clock"
          - "increments Qualifier.version by 1"
        note: "Bulk trigger with skip semantics: qualifiers not in QUALIFIED are skipped, not errored."
      - from: NOTIFIED
        to: REGISTERED
        trigger: "system event: a WINNER Registration for this qualifier_id reaches CONFIRMED"
        actor: system
        preconditions: []
        side_effects:
          - "increments Qualifier.version by 1"
      - from: REGISTERED
        to: NOTIFIED
        trigger: "system event: the qualifier's only non-CANCELLED WINNER Registration moves to CANCELLED"
        actor: system
        preconditions: []
        side_effects:
          - "increments Qualifier.version by 1"
        note: "Compensating reversal — the award commitment stays in the budget rollup (both NOTIFIED and REGISTERED are in the rollup input set), so no drift."
      - from: REGISTERED
        to: TRAVELLED
        trigger: "system event: Program advances ONSITE -> RECONCILED"
        actor: system
        preconditions: []
        side_effects:
          - "stamps taxable_award_cents from calculations.taxable_award_base"
          - "moves tax_status NOT_APPLICABLE -> PENDING_REPORT when taxable_award_cents > 0"
          - "increments Qualifier.version by 1"
      - from: QUALIFIED
        to: WITHDRAWN
        trigger: "system event: program-cancellation cascade"
        actor: system
        preconditions: []
        side_effects:
          - "increments Qualifier.version by 1"
      - from: NOTIFIED
        to: WITHDRAWN
        trigger: "system event: program-cancellation cascade"
        actor: system
        preconditions: []
        side_effects:
          - "increments Qualifier.version by 1"
      - from: REGISTERED
        to: WITHDRAWN
        trigger: "system event: program-cancellation cascade"
        actor: system
        preconditions: []
        side_effects:
          - "increments Qualifier.version by 1"

  # ---------------------------------------------------------------- Qualifier.tax_status (dimension 2 of 2, CYCLIC)
  - entity: Qualifier
    state_field: tax_status
    initial_state: NOT_APPLICABLE
    terminal_states: []
    shape: cyclic
    transitions:
      - from: NOT_APPLICABLE
        to: PENDING_REPORT
        trigger: "system event: Program advances ONSITE -> RECONCILED and this qualifier's taxable_award_cents > 0"
        actor: system
        preconditions:
          - "award_status becomes TRAVELLED in the same cascade"
        side_effects:
          - "increments Qualifier.version by 1"
      - from: PENDING_REPORT
        to: REPORTED
        trigger: "POST /tax-award-reports/{report_id}/file"
        actor: TaxComplianceOfficer
        preconditions:
          - "TaxAwardReport.status == DRAFT"
        side_effects:
          - "adds TaxAwardReport.reported_value_cents to Program.reported_award_total_cents"
          - "increments Qualifier.version by 1"
      - from: REPORTED
        to: VOIDED
        trigger: "POST /tax-award-reports/{report_id}/void"
        actor: TaxComplianceOfficer
        preconditions:
          - "TaxAwardReport.status == FILED"
          - "X-User-ID != TaxAwardReport.filed_by_user_id"
        side_effects:
          - "subtracts TaxAwardReport.reported_value_cents from Program.reported_award_total_cents (exact compensation)"
          - "increments Qualifier.version by 1"
      - from: VOIDED
        to: PENDING_REPORT
        trigger: "POST /tax-award-reports (a replacement draft for the same qualifier_id)"
        actor: TaxComplianceOfficer
        preconditions:
          - "award_status == TRAVELLED"
        side_effects:
          - "increments Qualifier.version by 1"
        note: "Closes the tax cycle PENDING_REPORT -> REPORTED -> VOIDED -> PENDING_REPORT, which is what lets a voided filing be corrected and the program then closed."

  # ---------------------------------------------------------------- Registration.attendance_status (dimension 1 of 2)
  - entity: Registration
    state_field: attendance_status
    initial_state: INVITED
    terminal_states: [DECLINED, CANCELLED, TRAVELLED]
    shape: parallel
    transitions:
      - from: INVITED
        to: ACCEPTED
        trigger: "POST /registrations/{registration_id}/respond with response == ACCEPT"
        actor: Participant
        preconditions:
          - "Program.status == REGISTRATION_OPEN"
          - "X-User-ID == Registration.qualifier_id"
        side_effects:
          - "sets waiver_on_file = true when waiver_signed == true was supplied"
          - "increments Registration.version by 1"
      - from: INVITED
        to: DECLINED
        trigger: "POST /registrations/{registration_id}/respond with response == DECLINE"
        actor: Participant
        preconditions:
          - "Program.status == REGISTRATION_OPEN"
          - "X-User-ID == Registration.qualifier_id"
        side_effects:
          - "moves air_status IN {REQUESTED, TICKETED, CHANGE_PENDING} -> VOIDED"
          - "increments Registration.version by 1"
      - from: ACCEPTED
        to: CONFIRMED
        trigger: "POST /registrations/{registration_id}/confirm"
        actor: TravelDesk
        preconditions:
          - "Program.status == REGISTRATION_OPEN"
          - "the program has exactly one SupplierContract with supplier_kind == HOTEL and status == EXECUTED"
          - "arrival_date >= that contract's stay_start_at and departure_date <= its stay_end_at"
          - "per-night room occupancy over the half-open interval [arrival_date, departure_date) stays <= room_block_count"
          - "Program.budget_headroom_cents >= Registration.cost_cents"
        side_effects:
          - "stamps room_nights = rooms * (departure_date - arrival_date in days)"
          - "recomputes calculations.room_night_ledger on the EXECUTED HOTEL contract (room_nights_confirmed, room_nights_available, attrition_posture)"
          - "recomputes calculations.program_budget_rollup (adds cost_cents to committed_budget_cents)"
          - "when registration_kind == WINNER: the Qualifier moves NOTIFIED -> REGISTERED"
          - "increments Registration.version by 1"
      - from: CONFIRMED
        to: TRAVELLED
        trigger: "system event: Program advances ONSITE -> RECONCILED"
        actor: system
        preconditions: []
        side_effects:
          - "increments Registration.version by 1"
      - from: INVITED
        to: CANCELLED
        trigger: "POST /registrations/{registration_id}/cancel, or Program advancing REGISTRATION_OPEN -> ONSITE, or the program-cancellation cascade"
        actor: TravelDesk
        preconditions:
          - "Program.status IN {REGISTRATION_OPEN, ONSITE}"
        side_effects:
          - "moves air_status IN {REQUESTED, TICKETED, CHANGE_PENDING} -> VOIDED"
          - "increments Registration.version by 1"
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /registrations/{registration_id}/cancel or the program-cancellation cascade"
        actor: TravelDesk
        preconditions:
          - "Program.status IN {REGISTRATION_OPEN, ONSITE}"
        side_effects:
          - "moves air_status IN {REQUESTED, TICKETED, CHANGE_PENDING} -> VOIDED"
          - "increments Registration.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /registrations/{registration_id}/cancel or the program-cancellation cascade"
        actor: TravelDesk
        preconditions:
          - "Program.status IN {REGISTRATION_OPEN, ONSITE}"
        side_effects:
          - "moves air_status IN {REQUESTED, TICKETED, CHANGE_PENDING} -> VOIDED"
          - "every GUEST Registration whose guest_of_registration_id is this row and whose attendance_status is non-terminal moves to CANCELLED"
          - "every ActivitySignup of this registration with status IN {BOOKED, WAITLISTED} moves to CANCELLED"
          - "for each activity that lost a BOOKED signup, calculations.activity_seat_allocation promotes the earliest WAITLISTED signup to BOOKED and stamps promoted_at (skipped during the program-cancellation cascade)"
          - "recomputes calculations.room_night_ledger (releases room_nights) and calculations.program_budget_rollup (removes cost_cents)"
          - "when registration_kind == WINNER and no other non-CANCELLED WINNER registration remains: the Qualifier moves REGISTERED -> NOTIFIED"
          - "increments Registration.version by 1"
        note: "Compensation transition — every side effect of CONFIRMED is reversed, so the budget and room-night invariants both return to their pre-confirmation values."

  # ---------------------------------------------------------------- Registration.air_status (dimension 2 of 2, CYCLIC)
  - entity: Registration
    state_field: air_status
    initial_state: NOT_REQUESTED
    terminal_states: [VOIDED]
    shape: cyclic
    transitions:
      - from: NOT_REQUESTED
        to: REQUESTED
        trigger: "POST /registrations/{registration_id}/air with action == REQUEST"
        actor: TravelDesk
        preconditions:
          - "attendance_status IN {INVITED, ACCEPTED, CONFIRMED}"
          - "Program.status IN {REGISTRATION_OPEN, ONSITE}"
          - "air_deviation_pre_days + air_deviation_post_days <= DEVIATION_MAX_DAYS_TOTAL (7)"
        side_effects:
          - "stores air_cabin_class, air_deviation_pre_days, air_deviation_post_days, air_base_fare_cents"
          - "recomputes calculations.air_cost_and_change_fee (air_upgrade_cost_cents, air_deviation_fee_cents, cost_cents)"
          - "increments Registration.version by 1"
        note: "Deliberately allowed from INVITED — the travel desk collects air preferences with the invitation, before the participant responds."
      - from: REQUESTED
        to: TICKETED
        trigger: "POST /registrations/{registration_id}/air with action == TICKET"
        actor: TravelDesk
        preconditions:
          - "Program.status IN {REGISTRATION_OPEN, ONSITE}"
        side_effects:
          - "leaves air_change_count at 0 (initial ticketing is not a change)"
          - "increments Registration.version by 1"
      - from: TICKETED
        to: CHANGE_PENDING
        trigger: "POST /registrations/{registration_id}/air with action == CHANGE"
        actor: TravelDesk
        preconditions:
          - "Program.status IN {REGISTRATION_OPEN, ONSITE}"
          - "air_deviation_pre_days + air_deviation_post_days <= DEVIATION_MAX_DAYS_TOTAL (7) for the revised values"
        side_effects:
          - "overwrites any supplied air_cabin_class / deviation days / air_base_fare_cents"
          - "does NOT yet charge a change fee"
          - "increments Registration.version by 1"
      - from: CHANGE_PENDING
        to: TICKETED
        trigger: "POST /registrations/{registration_id}/air with action == TICKET"
        actor: TravelDesk
        preconditions:
          - "Program.status IN {REGISTRATION_OPEN, ONSITE}"
        side_effects:
          - "increments air_change_count by 1"
          - "recomputes calculations.air_cost_and_change_fee (air_change_fee_total_cents, air_upgrade_cost_cents, air_deviation_fee_cents, cost_cents)"
          - "when attendance_status IN {CONFIRMED, TRAVELLED}: recomputes calculations.program_budget_rollup"
          - "increments Registration.version by 1"
        note: "Closes the air cycle TICKETED -> CHANGE_PENDING -> TICKETED; each completed loop advances the change-fee escalator by one step."
      - from: REQUESTED
        to: VOIDED
        trigger: "system event: the registration is DECLINED or CANCELLED"
        actor: system
        preconditions: []
        side_effects:
          - "increments Registration.version by 1"
      - from: TICKETED
        to: VOIDED
        trigger: "system event: the registration is DECLINED or CANCELLED"
        actor: system
        preconditions: []
        side_effects:
          - "increments Registration.version by 1"
      - from: CHANGE_PENDING
        to: VOIDED
        trigger: "system event: the registration is DECLINED or CANCELLED"
        actor: system
        preconditions: []
        side_effects:
          - "increments Registration.version by 1"

  # ---------------------------------------------------------------- OnsiteActivity.status
  - entity: OnsiteActivity
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    shape: branching
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /onsite-activities/{activity_id}/close"
        actor: TravelDesk
        preconditions:
          - "Program.status IN {REGISTRATION_OPEN, ONSITE}"
        side_effects:
          - "every ActivitySignup of this activity with status == WAITLISTED moves to CANCELLED (no promotion)"
          - "recomputes waitlist_count to 0"
          - "increments OnsiteActivity.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "system event: program-cancellation cascade"
        actor: system
        preconditions: []
        side_effects:
          - "every ActivitySignup of this activity with status IN {BOOKED, WAITLISTED} moves to CANCELLED"
          - "increments OnsiteActivity.version by 1"

  # ---------------------------------------------------------------- ActivitySignup.status
  - entity: ActivitySignup
    state_field: status
    initial_state: BOOKED
    terminal_states: [CANCELLED]
    shape: branching
    transitions:
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /activity-signups/{signup_id}/cancel, or a cascade from the registration/activity/program"
        actor: TravelDesk
        preconditions:
          - "the parent OnsiteActivity.status == OPEN when the trigger is the direct cancel endpoint"
          - "Program.status == ONSITE when the trigger is the direct cancel endpoint"
        side_effects:
          - "decrements OnsiteActivity.booked_count"
          - "calculations.activity_seat_allocation promotes the earliest WAITLISTED signup of the same activity to BOOKED and stamps its promoted_at (skipped during the program-cancellation cascade)"
          - "increments ActivitySignup.version by 1"
      - from: WAITLISTED
        to: BOOKED
        trigger: "system event: a BOOKED signup on the same activity is cancelled and this row is the promotion winner"
        actor: system
        preconditions:
          - "the parent OnsiteActivity.status == OPEN"
        side_effects:
          - "stamps promoted_at from the logical clock"
          - "increments OnsiteActivity.booked_count and decrements waitlist_count"
          - "increments ActivitySignup.version by 1"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /activity-signups/{signup_id}/cancel, or a cascade from the registration/activity/program"
        actor: TravelDesk
        preconditions:
          - "Program.status == ONSITE when the trigger is the direct cancel endpoint"
        side_effects:
          - "decrements OnsiteActivity.waitlist_count"
          - "increments ActivitySignup.version by 1"
        note: "Cancelling a WAITLISTED row never triggers a promotion — only a BOOKED seat being released does."

  # ---------------------------------------------------------------- TaxAwardReport.status
  - entity: TaxAwardReport
    state_field: status
    initial_state: DRAFT
    terminal_states: [VOIDED]
    shape: linear
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /tax-award-reports/{report_id}/file"
        actor: TaxComplianceOfficer
        preconditions:
          - "Program.status IN {RECONCILED, CLOSED}"
          - "the referenced Qualifier.tax_status == PENDING_REPORT"
        side_effects:
          - "stamps filed_by_user_id (X-User-ID) and filed_at (logical clock)"
          - "moves the Qualifier's tax_status PENDING_REPORT -> REPORTED"
          - "adds reported_value_cents to Program.reported_award_total_cents"
          - "increments TaxAwardReport.version by 1"
      - from: FILED
        to: VOIDED
        trigger: "POST /tax-award-reports/{report_id}/void"
        actor: TaxComplianceOfficer
        preconditions:
          - "X-User-ID != filed_by_user_id"
          - "Program.status IN {RECONCILED, CLOSED}"
        side_effects:
          - "stamps voided_by_user_id (X-User-ID) and void_reason"
          - "moves the Qualifier's tax_status REPORTED -> VOIDED"
          - "subtracts reported_value_cents from Program.reported_award_total_cents"
          - "increments TaxAwardReport.version by 1"
        note: "Segregation of duties on X-User-ID: the filer cannot void their own filing (ERR_TAX_VOID_SELF_REVIEW)."

concurrency_rules:
  - rule_id: registration-create-stale-program
    parent_entity: Program
    write_endpoint: "POST /registrations"
    occ_field: "expected_program_version"
    description: |
      Creating a Registration against a Program whose version has advanced since the client last
      observed it is rejected with a stale-version error. The seat-creation call is legitimately
      re-issuable under the product semantics — a travel desk may enrol the same qualifier again
      after an earlier seat was cancelled — so the second sequential create would otherwise succeed
      on identical state and silently supersede a program-level decision (a gross-up policy lock, a
      budget re-approval, or the registration window closing) that the client never saw. OCC on
      Program.version turns that into a deterministic precondition check: the request must carry the
      version the client actually read.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

  - rule_id: activity-signup-stale-activity
    parent_entity: OnsiteActivity
    write_endpoint: "POST /activity-signups"
    occ_field: "expected_activity_version"
    description: |
      Signing a participant up for an OnsiteActivity whose version has advanced since the client
      last observed it is rejected with a stale-version error. A repeat signup for a different
      registration is a legitimate operation on identical state, so nothing in the state machine
      would reject it — yet the seat/waitlist decision the client is acting on (booked_count versus
      capacity, as read from the activity) may already have been invalidated by an intervening
      promotion, cancellation or capacity-consuming signup. OCC on OnsiteActivity.version makes the
      client's read of the seat count part of the request's precondition.
    error_id: ERR_STALE_ACTIVITY_VERSION
    http_status: 412

calculations:
  - name: tier_assignment_selector
    trigger: "POST /qualifiers/{qualifier_id}/review — decides QUALIFIED vs DISQUALIFIED and stamps assigned_tier_id."
    algorithm: threshold
    formula: |
      eligible = [ t for t in AwardTier where t.program_id == qualifier.program_id
                                        and t.qualification_threshold <= qualifier.actual_metric ]
      if eligible is empty:
          award_status  = DISQUALIFIED
          assigned_tier = null
      else:
          # richest tier the qualifier has actually cleared
          sort eligible by (qualification_threshold DESC, tier_rank ASC)
          assigned_tier = eligible[0]
          award_status  = QUALIFIED
      # The comparison is inclusive: actual_metric == qualification_threshold QUALIFIES for that tier.
      # tier_rank is unique per program_id, so (qualification_threshold DESC, tier_rank ASC) is a TOTAL
      # order — no further tie-break is needed and none may use a random id.
    input_set: "All AwardTier rows of the qualifier's program_id. Qualifier.award_status must be PENDING_REVIEW."
    constants: {}
    precision: "Integer metric units; no rounding. Threshold comparison uses <= (inclusive)."

  - name: qualifier_committed_cost
    trigger: "On POST /qualifiers/{qualifier_id}/review, and re-run for every non-terminal qualifier by the SupplierContract EXECUTED cascade when Program.per_person_cost_basis_cents changes."
    algorithm: aggregation
    formula: |
      base_pp = Program.per_person_cost_basis_cents        # 0 until a HOTEL contract is EXECUTED
      tier    = AwardTier[qualifier.assigned_tier_id]

      # THREE independently rounded components, each rounded to whole cents BEFORE summation.
      winner_component_cents    = round_half_up(base_pp * (10000 + tier.service_load_bp) / 10000)
      guest_component_cents     = round_half_up(base_pp * GUEST_SHARE_BP / 10000)
      gratuity_component_cents  = round_half_up(base_pp * GRATUITY_BP    / 10000)

      committed_cost_cents = winner_component_cents
                           + guest_component_cents * qualifier.guest_count
                           + gratuity_component_cents
                           + tier.upgrade_allowance_cents
      # PINNED EVALUATION ORDER: round each of the three rate components to whole cents FIRST, then sum.
      # Summing the three rates into one composite basis-point figure and rounding once at the end is a
      # DIFFERENT number (it drifts by 1 cent for base_pp = 431757, service_load_bp = 1275, guest_count = 1:
      # 921765 pinned vs 921766 naive) and is WRONG.
    input_set: "The qualifier's own row plus its assigned AwardTier and the program's per_person_cost_basis_cents. Qualifiers with award_status IN {PENDING_REVIEW, DISQUALIFIED, WITHDRAWN} have committed_cost_cents 0."
    constants:
      GUEST_SHARE_BP: 6250
      GRATUITY_BP: 350
    precision: "Whole cents, ROUND_HALF_UP, applied per component before summation."

  - name: program_budget_rollup
    trigger: "After every qualifier review, every registration confirm/cancel, every re-ticketing that changes cost_cents, and the SupplierContract EXECUTED cascade."
    algorithm: aggregation
    formula: |
      award_side = sum(q.committed_cost_cents for q in Qualifier
                       where q.program_id == program.id
                         and q.award_status IN {QUALIFIED, NOTIFIED, REGISTERED, TRAVELLED})
      air_side   = sum(r.cost_cents for r in Registration
                       where r.program_id == program.id
                         and r.attendance_status IN {CONFIRMED, TRAVELLED})

      committed_budget_cents = award_side + air_side
      budget_headroom_cents  = budget_total_cents - committed_budget_cents      # may be negative
      utilization_bp         = 0 if budget_total_cents == 0
                               else floor(committed_budget_cents * 10000 / budget_total_cents)
      budget_posture = OK             if utilization_bp <= BUDGET_POSTURE_WATCH_BP
                       WATCH          if utilization_bp <= BUDGET_POSTURE_OVER_BP
                       OVERCOMMITTED  otherwise
      # CONSERVED QUANTITY (compensating invariant):
      #   committed_budget_cents + budget_headroom_cents == budget_total_cents, always, at every step.
    input_set: "Qualifiers in {QUALIFIED, NOTIFIED, REGISTERED, TRAVELLED} (DISQUALIFIED and WITHDRAWN excluded) plus Registrations in {CONFIRMED, TRAVELLED} (INVITED/ACCEPTED/DECLINED/CANCELLED excluded)."
    constants:
      BUDGET_POSTURE_WATCH_BP: 8500
      BUDGET_POSTURE_OVER_BP: 10000
    precision: "Whole cents; utilization_bp uses integer floor division so 10000 bp is reached only at or beyond exact parity."

  - name: room_night_ledger
    trigger: "On SupplierContract EXECUTED, and on every Registration confirm or cancel for the program."
    algorithm: interval_merge
    formula: |
      room_nights_blocked = room_block_count * contracted_nights          # stamped at EXECUTED
      room_nights_confirmed = sum(r.room_nights for r in Registration
                                  where r.program_id == contract.program_id
                                    and r.attendance_status IN {CONFIRMED, TRAVELLED})
      room_nights_available = room_nights_blocked - room_nights_confirmed
      attrition_floor_room_nights = ceil(room_nights_blocked * (10000 - attrition_allowance_bp) / 10000)
      shortfall_room_nights = max(0, attrition_floor_room_nights - room_nights_confirmed)
      attrition_posture = AT_RISK if shortfall_room_nights > 0 else CLEAR

      # Per-registration night interval is HALF-OPEN: [arrival_date, departure_date).
      #   r.room_nights = r.rooms * (departure_date - arrival_date, in whole days)
      # Per-night occupancy gate applied at POST /registrations/{id}/confirm:
      #   for each night N in [arrival_date, departure_date):
      #       occupancy(N) = sum(x.rooms for x in Registration
      #                          where x.program_id == contract.program_id
      #                            and x.attendance_status IN {CONFIRMED, TRAVELLED}
      #                            and x.arrival_date <= N < x.departure_date)
      #       occupancy(N) + this.rooms <= contract.room_block_count      else ERR_ROOM_BLOCK_EXHAUSTED
      # Because the interval is half-open, a departing registration and an arriving one may share the
      # same calendar date without contending for a room on that night.
      # CONSERVED QUANTITY (compensating invariant):
      #   room_nights_blocked == room_nights_confirmed + room_nights_available, always.
    input_set: "The program's single SupplierContract with supplier_kind == HOTEL and status == EXECUTED, plus that program's Registrations in {CONFIRMED, TRAVELLED}."
    constants: {}
    precision: "Whole room-nights; the attrition floor uses ceil so a fractional floor always rounds up against the buyer."

  - name: cancellation_exposure_projection
    trigger: "GET /supplier-contracts/{contract_id}/exposure-projection, after every DepositMilestone payment, after SupplierContract execution, and inside the program-cancellation cascade."
    algorithm: waterfall_allocation
    formula: |
      contract_value_cents = room_block_count * contracted_nights * nightly_rate_cents

      # ---- variant A: ATTRITION_BASIS ----
      # What the supplier can invoice for unfilled rooms below the attrition floor.
      attrition_basis_cents = shortfall_room_nights * nightly_rate_cents      # from room_night_ledger

      # ---- variant B: DEPOSIT_FORFEITURE_BASIS ----
      # Ordered waterfall over the deposit schedule, sequence ASC (never id order).
      pre_relief = 0
      for m in DepositMilestone where m.contract_id == contract.id
                                 and m.status IN {SCHEDULED, PAID}
              ordered by m.sequence ASC:
          if m.due_at <= logical_now:
              pre_relief += m.amount_cents                                   # matured: nothing recoverable
          else:
              pre_relief += round_half_up(m.amount_cents * (10000 - m.refundable_bp) / 10000)
      fm_relief_bp = { NONE: 0, STANDARD: FM_STANDARD_RELIEF_BP, EXPANDED: FM_EXPANDED_RELIEF_BP }[force_majeure_clause]
      deposit_forfeiture_basis_cents = round_half_up(pre_relief * (10000 - fm_relief_bp) / 10000)

      # ---- binding result ----
      binding_basis          = contract.exposure_basis
      binding_exposure_cents = attrition_basis_cents          if binding_basis == ATTRITION_BASIS
                               else deposit_forfeiture_basis_cents
      Program.cancellation_exposure_cents = sum(binding_exposure_cents over the program's EXECUTED contracts)
      # The two variants are computed from the SAME contract, milestone set and clock and DIVERGE:
      # with 12 rooms x 5 nights at 38500, attrition_allowance_bp 2000, room_nights_confirmed 10,
      # milestones {1: 577500 @2026-08-15 refundable 10000 PAID, 2: 577500 @2026-09-15 refundable 5000 PAID,
      # 3: 1155000 @2026-10-15 refundable 0 SCHEDULED} and force_majeure_clause STANDARD:
      #   logical_now 2026-09-20 -> ATTRITION_BASIS 1463000 vs DEPOSIT_FORFEITURE_BASIS 1732500.
    input_set: "DepositMilestone rows of this contract with status IN {SCHEDULED, PAID}, in sequence ASC. REFUNDED / FORFEITED / CANCELLED milestones are excluded from the projection."
    constants:
      FM_STANDARD_RELIEF_BP: 2500
      FM_EXPANDED_RELIEF_BP: 6000
    precision: "Whole cents, ROUND_HALF_UP, applied per milestone and once more to the force-majeure relief."
    variants:
      - name: attrition_basis
        when: "contract.exposure_basis == ATTRITION_BASIS"
        difference: "Exposure is driven by unfilled room-nights below the attrition floor at the current nightly rate; the deposit schedule and the force-majeure clause are ignored entirely."
      - name: deposit_forfeiture_basis
        when: "contract.exposure_basis == DEPOSIT_FORFEITURE_BASIS"
        difference: "Exposure is the sequence-ordered waterfall of non-recoverable deposit amounts (matured milestones lose 100%, unmatured ones lose only the non-refundable share), then reduced by the force-majeure relief rate. Room-night fill is ignored entirely."

  - name: taxable_award_base
    trigger: "Program advancing ONSITE -> RECONCILED stamps Qualifier.taxable_award_cents; TaxAwardReport creation snapshots it into award_value_cents."
    algorithm: threshold
    formula: |
      business_purpose_exclusion_cents = round_half_up(qualifier.committed_cost_cents
                                                       * BUSINESS_PURPOSE_EXCLUSION_BP / 10000)
      taxable_award_cents = qualifier.committed_cost_cents - business_purpose_exclusion_cents
      # The air-side variance carried on Registration.cost_cents (upgrades, deviation and change fees)
      # is treated as business travel and is deliberately NOT part of the taxable base.
    input_set: "Qualifiers whose award_status becomes TRAVELLED. Qualifiers ending DISQUALIFIED or WITHDRAWN keep taxable_award_cents 0."
    constants:
      BUSINESS_PURPOSE_EXCLUSION_BP: 1500
    precision: "Whole cents, ROUND_HALF_UP on the exclusion; the taxable base is the exact integer remainder."

  - name: taxable_award_gross_up
    trigger: "POST /tax-award-reports — computes combined_rate_bp, gross_up_cents and reported_value_cents at draft creation from the snapshotted award_value_cents and gross_up_method."
    algorithm: tiered_pricing
    formula: |
      A = report.award_value_cents            # snapshot of Qualifier.taxable_award_cents

      # State supplemental rate is a TIERED function of the award value:
      state_supplemental_bp(v) = 300  if v <  500000
                                 500  if 500000 <= v < 1500000
                                 700  if v >= 1500000

      if report.gross_up_method == NONE:
          combined_rate_bp = 0
          gross_up_cents   = 0
      elif report.gross_up_method == FLAT_SUPPLEMENTAL:
          combined_rate_bp = FED_SUPPLEMENTAL_BP
          gross_up_cents   = round_half_up(A * FED_SUPPLEMENTAL_BP / 10000)
      else:  # FULL_GROSS_UP — solve for the grossed-up amount that nets A after withholding
          # PINNED EVALUATION ORDER: the state tier is keyed on A, the PRE-gross-up award value.
          combined_rate_bp = FED_SUPPLEMENTAL_BP + FICA_BP + state_supplemental_bp(A)
          reported         = round_half_up(A * 10000 / (10000 - combined_rate_bp))
          gross_up_cents   = reported - A
          # Re-deriving the state tier from `reported` (the grossed-up figure) is a circular ordering
          # and is WRONG: for A = 443198 the pinned order gives 300 bp -> reported 658052, while keying
          # on reported (658052 >= 500000) would give 500 bp -> reported 678191.

      reported_value_cents = A + gross_up_cents
    input_set: "A single TaxAwardReport row in DRAFT; gross_up_method is the snapshot of Program.gross_up_policy taken at creation and never re-read afterwards."
    constants:
      FED_SUPPLEMENTAL_BP: 2200
      FICA_BP: 765
      STATE_TIER_LOW_BP: 300
      STATE_TIER_MID_BP: 500
      STATE_TIER_HIGH_BP: 700
      STATE_TIER_MID_FLOOR_CENTS: 500000
      STATE_TIER_HIGH_FLOOR_CENTS: 1500000
    precision: "Whole cents, ROUND_HALF_UP, applied once to the gross-up (FLAT) or once to the grossed-up reported value (FULL)."
    variants:
      - name: flat_supplemental
        when: "Program.gross_up_policy == FLAT_SUPPLEMENTAL at draft creation"
        difference: "The employer covers only the federal supplemental rate applied to the award value; FICA and the tiered state rate are the winner's problem. Linear, non-iterative: gross_up = A * 2200 bp."
      - name: full_gross_up
        when: "Program.gross_up_policy == FULL_GROSS_UP at draft creation"
        difference: "The employer solves the inverse-withholding equation so the winner nets the full award: reported = A / (1 - combined_rate), with combined_rate keyed on A. For A = 443198 the two variants diverge: FLAT gross_up 97504 vs FULL gross_up 214854."
      - name: no_gross_up
        when: "Program.gross_up_policy == NONE at draft creation"
        difference: "combined_rate_bp and gross_up_cents are both 0; reported_value_cents == award_value_cents."

  - name: air_cost_and_change_fee
    trigger: "POST /registrations/{registration_id}/air (all three actions) recomputes air_upgrade_cost_cents, air_deviation_fee_cents, air_change_fee_total_cents and cost_cents."
    algorithm: threshold
    formula: |
      tier = AwardTier[Qualifier[registration.qualifier_id].assigned_tier_id]

      # ---- cabin upgrade: nested max over a step ladder, then the tier allowance ----
      UPGRADE_STEP = { ECONOMY: 0, PREMIUM_ECONOMY: 48000, BUSINESS: 165000 }
      billable_step_cents     = max(0, UPGRADE_STEP[registration.air_cabin_class]
                                       - UPGRADE_STEP[tier.air_cabin_class])
      air_upgrade_cost_cents  = max(0, billable_step_cents - tier.upgrade_allowance_cents)
      # Downgrades never produce a credit (inner max) and the allowance never produces a rebate
      # (outer max). Both clamps are required; either one alone gives a negative result somewhere.

      # ---- deviation surcharge ----
      chargeable_days = max(0, (air_deviation_pre_days + air_deviation_post_days) - DEVIATION_FREE_DAYS)
      air_deviation_fee_cents = chargeable_days * DEVIATION_DAY_FEE_CENTS
      # air_deviation_pre_days + air_deviation_post_days > DEVIATION_MAX_DAYS_TOTAL is rejected outright.

      # ---- change fees: geometric escalator with a fare-relative cap ----
      cap_cents = round_half_up(air_base_fare_cents * CHANGE_FEE_CAP_BP / 10000)
      cumulative = 0
      for k in 1 .. air_change_count:
          cumulative += round_half_up(CHANGE_FEE_BASE_CENTS
                                      * (10000 + CHANGE_FEE_ESCALATOR_BP)^(k-1) / 10000^(k-1))
      air_change_fee_total_cents = min(cap_cents, cumulative)
      # Each round's fee is rounded to whole cents BEFORE being added; the cap is applied ONCE to the
      # accumulated total, never per round. With air_base_fare_cents 214000 the cap is 85600 and the
      # ladder runs 12500 / 31250 / 59375 / 85600 (capped, uncapped would be 101563) / 85600.

      cost_cents = air_upgrade_cost_cents + air_deviation_fee_cents + air_change_fee_total_cents
    input_set: "The single Registration row plus its qualifier's assigned AwardTier. air_change_count counts only completed CHANGE_PENDING -> TICKETED loops; the initial REQUESTED -> TICKETED transition is not a change."
    constants:
      DEVIATION_FREE_DAYS: 2
      DEVIATION_DAY_FEE_CENTS: 9500
      DEVIATION_MAX_DAYS_TOTAL: 7
      CHANGE_FEE_BASE_CENTS: 12500
      CHANGE_FEE_ESCALATOR_BP: 5000
      CHANGE_FEE_CAP_BP: 4000
      UPGRADE_STEP_ECONOMY_CENTS: 0
      UPGRADE_STEP_PREMIUM_ECONOMY_CENTS: 48000
      UPGRADE_STEP_BUSINESS_CENTS: 165000
    precision: "Whole cents, ROUND_HALF_UP, applied per change-fee round and once to the cap; the cap is a min() over the accumulated total."

  - name: activity_seat_allocation
    trigger: "POST /activity-signups decides BOOKED vs WAITLISTED; releasing a BOOKED seat (signup cancel, registration cancel, program cascade) runs the promotion step."
    algorithm: chronological
    formula: |
      # ---- admission ----
      if activity.booked_count < activity.capacity:
          status = BOOKED
      else:
          status = WAITLISTED
      # Strict <: an activity whose booked_count already equals capacity waitlists the next signup, and
      # capacity == 0 waitlists every signup from the very first one.

      # ---- promotion, when a BOOKED seat is released while activity.status == OPEN ----
      pool = [ s for s in ActivitySignup where s.activity_id == activity.id and s.status == WAITLISTED ]
      if pool is non-empty:
          sort pool by (s.created_at ASC,
                        Qualifier[Registration[s.registration_id].qualifier_id].employee_code ASC)
          winner = pool[0]; winner.status = BOOKED; winner.promoted_at = logical_now
      # Exactly one promotion per released seat. The tie-break is employee_code (a business key), never
      # a random id. Promotion is skipped when the release comes from the program-cancellation cascade
      # or from closing the activity.
      booked_count   = count(status == BOOKED)
      waitlist_count = count(status == WAITLISTED)
    input_set: "ActivitySignup rows of one OnsiteActivity with status IN {BOOKED, WAITLISTED}; CANCELLED rows are excluded from both counters and from the promotion pool."
    constants: {}
    precision: "Integer counts; no rounding."

  - name: activity_schedule_conflict
    trigger: "POST /activity-signups — rejects a signup that collides with the participant's already-booked agenda."
    algorithm: interval_merge
    formula: |
      # Every activity interval is padded by a transfer buffer on BOTH sides and the comparison is
      # CLOSED on the buffer boundary.
      buffer = TRANSFER_BUFFER_MINUTES minutes
      for existing in ActivitySignup where existing.registration_id == this.registration_id
                                       and existing.status IN {BOOKED, WAITLISTED}:
          a = OnsiteActivity[existing.activity_id]
          b = OnsiteActivity[this.activity_id]
          if b.start_at < (a.end_at + buffer) and a.start_at < (b.end_at + buffer):
              reject ERR_ACTIVITY_TIME_CONFLICT
      # Boundary semantics: a gap of exactly TRANSFER_BUFFER_MINUTES is ACCEPTED (b.start_at ==
      # a.end_at + buffer fails the strict <), a gap of buffer - 1 minute is REJECTED. With activity A
      # ending 2026-11-10T13:00:00Z, a signup starting 13:44:00Z conflicts and one starting 13:45:00Z
      # does not.
    input_set: "The participant's own ActivitySignup rows in {BOOKED, WAITLISTED} and the OnsiteActivity intervals they point at. CANCELLED signups never conflict."
    constants:
      TRANSFER_BUFFER_MINUTES: 45
    precision: "Whole minutes on the logical clock; comparisons are strict (<) so the buffer boundary itself is allowed."

  - name: program_measurement
    trigger: "GET /programs/{program_id}/measurement, and stamped onto the Program by the ONSITE -> RECONCILED advance."
    algorithm: weighted_scoring
    formula: |
      travellers = [ q for q in Qualifier where q.program_id == program.id and q.award_status == TRAVELLED ]
      baseline_total = sum(q.baseline_metric for q in travellers)
      actual_total   = sum(q.actual_metric   for q in travellers)
      if travellers is empty or baseline_total == 0:
          sales_lift_pct = null
      else:
          lift_bp        = round_half_up((actual_total - baseline_total) * 10000 / baseline_total)
          sales_lift_pct = lift_bp / 100            # two decimal places by construction

      surveyed = [ r for r in Registration where r.program_id == program.id
                                            and r.satisfaction_score is not null ]
      if surveyed is empty:
          satisfaction_index = null
      else:
          satisfaction_index = round_half_up(sum(r.satisfaction_score for r in surveyed) * 100
                                             / count(surveyed)) / 100
      # Aggregate-then-rate, never rate-then-average: the lift is computed from the summed metrics of
      # the travelling cohort, not as the mean of per-qualifier lift percentages.
      # With travellers {baseline 180000000 actual 260000000} and {baseline 120000000 actual 155000000}
      # the result is lift_bp 3833 -> sales_lift_pct 38.33; scores {9, 8} give satisfaction_index 8.5.
    input_set: "Qualifiers with award_status == TRAVELLED (DISQUALIFIED / WITHDRAWN / NOTIFIED excluded) and Registrations of the program carrying a non-null satisfaction_score, regardless of registration_kind."
    constants: {}
    precision: "sales_lift_pct and satisfaction_index are exact to two decimal places, derived from a ROUND_HALF_UP integer basis-point / centi-point intermediate."

validations:
  # ---- 1-2: authentication -------------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty."
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the seven roles declared in §1.7."
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: all

  # ---- 3: authorization ---------------------------------------------------
  - priority: 3
    category: auth
    check: "The supplied X-User-Role appears in the called endpoint's roles list."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  # ---- 4-5: existence -----------------------------------------------------
  - priority: 4
    category: existence
    check: "Every templated path id resolves to an existing row, validated left-to-right."
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_TIER_NOT_FOUND | ERR_QUALIFIER_NOT_FOUND | ERR_DESTINATION_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_MILESTONE_NOT_FOUND | ERR_REGISTRATION_NOT_FOUND | ERR_ACTIVITY_NOT_FOUND | ERR_SIGNUP_NOT_FOUND | ERR_TAX_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a templated path segment"
  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row, validated in the order the fields are listed in the endpoint's input."
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_QUALIFIER_NOT_FOUND | ERR_DESTINATION_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_REGISTRATION_NOT_FOUND | ERR_ACTIVITY_NOT_FOUND"
    http_status: 404
    applies_to: "POST /award-tiers, POST /qualifiers, POST /destinations, POST /supplier-contracts, POST /deposit-milestones, POST /registrations, POST /onsite-activities, POST /activity-signups, POST /tax-award-reports"

  # ---- 6: ownership -------------------------------------------------------
  - priority: 6
    category: auth
    check: "When X-User-Role == Participant, X-User-ID must equal the Qualifier.id that owns the target resource (Registration.qualifier_id, or the qualifier behind an ActivitySignup's registration). Participants may not read or act on another qualifier's rows."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /registrations, POST /registrations/{registration_id}/respond, POST /registrations/{registration_id}/cancel, POST /registrations/{registration_id}/survey, POST /activity-signups, POST /activity-signups/{signup_id}/cancel, GET /registrations/{registration_id}, GET /qualifiers/{qualifier_id}, GET /activity-signups/{signup_id}"

  # ---- 7-8: schema --------------------------------------------------------
  - priority: 7
    category: business_constraint
    check: "Request body conforms to the endpoint's input schema: all required fields present, correct JSON types, enum values inside the declared sets, integers within their declared ranges, and no unknown field carrying a value the endpoint does not accept (unknown fields are ignored, not rejected)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 8
    category: business_constraint
    check: "Pagination parameters are well-formed: limit is an integer in 1..100, offset is an integer >= 0."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all GET list endpoints"

  # ---- 9: optimistic concurrency -----------------------------------------
  - priority: 9
    category: state
    check: "expected_program_version equals the current Program.version (POST /registrations); expected_activity_version equals the current OnsiteActivity.version (POST /activity-signups). See §1.2.1."
    error_id: "ERR_STALE_PROGRAM_VERSION | ERR_STALE_ACTIVITY_VERSION"
    http_status: 412
    applies_to: "POST /registrations, POST /activity-signups"

  # ---- 10-13: state preconditions ----------------------------------------
  - priority: 10
    category: state
    check: "Program.status permits the operation, and any requested advance is a declared edge out of the current status."
    error_id: ERR_PROGRAM_STATE_INVALID
    http_status: 409
    applies_to: "all POST endpoints except POST /programs and POST /_clock/set_current_utc"
  - priority: 11
    category: state
    check: "The directly targeted entity is in a state from which the requested transition is declared in §1.2 (registration attendance/air axis, qualifier award axis, contract status, milestone status, activity status, signup status, report status, destination status/inspection)."
    error_id: "ERR_REGISTRATION_STATE_INVALID | ERR_AIR_STATE_INVALID | ERR_QUALIFIER_STATE_INVALID | ERR_CONTRACT_STATE_INVALID | ERR_MILESTONE_STATE_INVALID | ERR_ACTIVITY_STATE_INVALID | ERR_SIGNUP_STATE_INVALID | ERR_TAX_REPORT_STATE_INVALID | ERR_DESTINATION_STATE_INVALID"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 12
    category: state
    check: "Cross-entity state guards: a DepositMilestone may only be paid when its SupplierContract.status == EXECUTED; a TaxAwardReport may only be drafted when the Qualifier.award_status == TRAVELLED; a Registration may only be confirmed when the program has exactly one EXECUTED HOTEL SupplierContract; an ActivitySignup requires the Registration.attendance_status IN {CONFIRMED, TRAVELLED} and the OnsiteActivity.status == OPEN."
    error_id: "ERR_CONTRACT_STATE_INVALID | ERR_QUALIFIER_STATE_INVALID | ERR_NO_EXECUTED_HOTEL_CONTRACT | ERR_REGISTRATION_STATE_INVALID | ERR_ACTIVITY_STATE_INVALID"
    http_status: 409
    applies_to: "POST /deposit-milestones/{milestone_id}/pay, POST /tax-award-reports, POST /registrations/{registration_id}/confirm, POST /activity-signups"
  - priority: 13
    category: state
    check: "Program.gross_up_policy_locked is false when a gross-up policy decision is submitted."
    error_id: ERR_GROSS_UP_POLICY_LOCKED
    http_status: 409
    applies_to: "POST /programs/{program_id}/gross-up-policy"

  # ---- 14-17: business_safety (compliance and duty separation come first) --
  - priority: 14
    category: business_safety
    check: "The X-User-ID executing a SupplierContract differs from both last_proposed_by_user_id and last_countered_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /supplier-contracts/{contract_id}/execute"
  - priority: 15
    category: business_safety
    check: "The X-User-ID voiding a TaxAwardReport differs from the report's filed_by_user_id."
    error_id: ERR_TAX_VOID_SELF_REVIEW
    http_status: 422
    applies_to: "POST /tax-award-reports/{report_id}/void"
  - priority: 16
    category: business_safety
    check: "A signup for an OnsiteActivity with risk_level == HIGH requires the Registration to carry waiver_on_file == true."
    error_id: ERR_ACTIVITY_WAIVER_REQUIRED
    http_status: 422
    applies_to: "POST /activity-signups"
  - priority: 17
    category: business_safety
    check: "Destination.risk_score <= MAX_DESTINATION_RISK (60) at shortlisting."
    error_id: ERR_DESTINATION_RISK_TOO_HIGH
    http_status: 422
    applies_to: "POST /destinations/{destination_id}/shortlist"

  # ---- 18-22: business_constraint ----------------------------------------
  - priority: 18
    category: business_constraint
    check: "Destination.inspection_score >= MIN_INSPECTION_SCORE (70) at shortlisting."
    error_id: ERR_INSPECTION_SCORE_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /destinations/{destination_id}/shortlist"
  - priority: 19
    category: business_constraint
    check: "SupplierContract.round_count < MAX_NEGOTIATION_ROUNDS (5) before a PROPOSE or COUNTER round is accepted."
    error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 422
    applies_to: "POST /supplier-contracts/{contract_id}/negotiate"
  - priority: 20
    category: business_constraint
    check: "Qualifier.guest_count <= the assigned AwardTier.guest_allowance at review; and the count of non-CANCELLED GUEST registrations for a winner never exceeds that allowance."
    error_id: ERR_GUEST_ALLOWANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /qualifiers/{qualifier_id}/review, POST /registrations"
  - priority: 21
    category: business_referential
    check: "registration_kind == GUEST requires a guest_of_registration_id pointing at a non-CANCELLED WINNER Registration of the same qualifier_id; registration_kind == WINNER requires guest_of_registration_id to be absent or null."
    error_id: ERR_GUEST_LINK_INVALID
    http_status: 422
    applies_to: "POST /registrations"
  - priority: 22
    category: business_constraint
    check: "Uniqueness: Qualifier.employee_code per program_id; (tier_code) and (tier_rank) per program_id; DepositMilestone.sequence per contract_id; at most one non-CANCELLED WINNER Registration per qualifier_id; at most one non-CANCELLED ActivitySignup per (activity_id, registration_id)."
    error_id: "ERR_DUPLICATE_EMPLOYEE_CODE | ERR_DUPLICATE_TIER_KEY | ERR_DUPLICATE_MILESTONE_SEQUENCE | ERR_DUPLICATE_WINNER_REGISTRATION | ERR_DUPLICATE_ACTIVITY_SIGNUP"
    http_status: 409
    applies_to: "POST /qualifiers, POST /award-tiers, POST /deposit-milestones, POST /registrations, POST /activity-signups"

  # ---- 23-26: business_temporal ------------------------------------------
  - priority: 23
    category: business_temporal
    check: "Ordered date pairs are strictly increasing: Program.sales_period_end > sales_period_start; OnsiteActivity.end_at > start_at; Registration.departure_date > arrival_date."
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /programs, POST /onsite-activities, POST /registrations"
  - priority: 24
    category: business_temporal
    check: "The participant's existing BOOKED/WAITLISTED activity intervals do not collide with the requested one once padded by TRANSFER_BUFFER_MINUTES (45) on both sides (calculations.activity_schedule_conflict)."
    error_id: ERR_ACTIVITY_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /activity-signups"
  - priority: 25
    category: business_temporal
    check: "air_deviation_pre_days + air_deviation_post_days <= DEVIATION_MAX_DAYS_TOTAL (7)."
    error_id: ERR_DEVIATION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /registrations/{registration_id}/air"
  - priority: 26
    category: business_temporal
    check: "arrival_date >= the EXECUTED HOTEL contract's stay_start_at and departure_date <= its stay_end_at."
    error_id: ERR_STAY_WINDOW_VIOLATION
    http_status: 422
    applies_to: "POST /registrations/{registration_id}/confirm"

  # ---- 27: capacity ------------------------------------------------------
  - priority: 27
    category: business_constraint
    check: "Per-night room occupancy over the half-open interval [arrival_date, departure_date) plus this registration's rooms stays <= the EXECUTED HOTEL contract's room_block_count (calculations.room_night_ledger)."
    error_id: ERR_ROOM_BLOCK_EXHAUSTED
    http_status: 409
    applies_to: "POST /registrations/{registration_id}/confirm"

  # ---- 28-30: business_fiscal (money last) -------------------------------
  - priority: 28
    category: business_fiscal
    check: "Sum of amount_cents over the contract's non-CANCELLED DepositMilestone rows <= room_block_count * contracted_nights * nightly_rate_cents."
    error_id: ERR_DEPOSIT_SCHEDULE_EXCEEDS_CONTRACT_VALUE
    http_status: 422
    applies_to: "POST /deposit-milestones, POST /supplier-contracts/{contract_id}/execute"
  - priority: 29
    category: business_fiscal
    check: "calculations.qualifier_committed_cost result <= the assigned AwardTier.budget_per_qualifier_cents at review."
    error_id: ERR_TIER_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /qualifiers/{qualifier_id}/review"
  - priority: 30
    category: business_fiscal
    check: "Program.budget_headroom_cents >= Registration.cost_cents at confirmation."
    error_id: ERR_BUDGET_HEADROOM_EXCEEDED
    http_status: 422
    applies_to: "POST /registrations/{registration_id}/confirm"

  # ---- 31-33: business_referential --------------------------------------
  - priority: 31
    category: business_referential
    check: "Cross-aggregate scope agreement: SupplierContract.destination_id belongs to SupplierContract.program_id; ActivitySignup's OnsiteActivity.program_id equals its Registration.program_id; TaxAwardReport.tax_year equals the referenced Qualifier's Program.fiscal_year."
    error_id: ERR_PROGRAM_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /supplier-contracts, POST /activity-signups, POST /tax-award-reports"
  - priority: 32
    category: business_referential
    check: "Every Qualifier of the program with taxable_award_cents > 0 has tax_status == REPORTED before the program may advance to CLOSED."
    error_id: ERR_TAX_REPORTING_INCOMPLETE
    http_status: 422
    applies_to: "POST /programs/{program_id}/advance"
  - priority: 33
    category: business_referential
    check: "The requested Program advance satisfies its transition's structural prerequisites: SOURCING needs at least one AwardTier and one SHORTLISTED Destination; REGISTRATION_OPEN needs zero PENDING_REVIEW qualifiers and gross_up_policy_locked == true; ONSITE needs at least one CONFIRMED Registration; RECONCILED needs zero OPEN OnsiteActivity rows."
    error_id: ERR_ADVANCE_PREREQUISITES_UNMET
    http_status: 422
    applies_to: "POST /programs/{program_id}/advance"

endpoints:
  # ============================== Program ==================================
  - method: POST
    path: "/programs"
    description: "Create an incentive program in DESIGN with a total budget and a qualifying sales period."
    roles: [ProgramDirector]
    code: 201
    input: [name, fiscal_year, qualification_metric, sales_period_start, sales_period_end, budget_total_cents]
    output: Program
    side_effects:
      - "status = DESIGN, gross_up_policy = NONE, gross_up_policy_locked = false, version = 1"
      - "all computed money fields start at 0; sales_lift_pct and satisfaction_index start null"
  - method: GET
    path: "/programs/{program_id}"
    description: "Read one program including every computed rollup field."
    roles: [ProgramDirector, SourcingManager, ContractApprover, SalesOpsAnalyst, TravelDesk, TaxComplianceOfficer, Participant]
    code: 200
    input: []
    output: Program
    side_effects: []
  - method: GET
    path: "/programs"
    description: "List programs, filterable by fiscal year and status."
    roles: [ProgramDirector, SourcingManager, ContractApprover, SalesOpsAnalyst, TravelDesk, TaxComplianceOfficer]
    code: 200
    input: ["fiscal_year?", "status?", "limit?", "offset?"]
    output: Program[]
    side_effects: []
  - method: POST
    path: "/programs/{program_id}/advance"
    description: "Advance the program along its declared lifecycle edge; all structural prerequisites are checked before the move."
    roles: [ProgramDirector]
    code: 200
    input: [to_status]
    output: Program
    side_effects:
      - "applies the §1.2 Program.status transition and all of its cascades"
      - "increments Program.version by 1"
  - method: POST
    path: "/programs/{program_id}/gross-up-policy"
    description: "Record the taxable-award gross-up policy decision. Accepted exactly once; the decision then locks."
    roles: [ProgramDirector]
    code: 200
    input: [gross_up_policy]
    output: Program
    side_effects:
      - "sets gross_up_policy and gross_up_policy_locked = true"
      - "increments Program.version by 1"
  - method: POST
    path: "/programs/{program_id}/notify-qualifiers"
    description: "Bulk qualifier communication: move every QUALIFIED qualifier of the program to NOTIFIED. Qualifiers in any other award_status are skipped, not errored."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: { notified_count: integer, skipped_count: integer, notified_qualifier_ids: array, skipped_qualifier_ids: array }
    side_effects:
      - "each affected Qualifier moves QUALIFIED -> NOTIFIED with notified_at stamped and version incremented"
  - method: POST
    path: "/programs/{program_id}/cancel"
    description: "Cancel the program and run the full cancellation cascade over registrations, signups, activities, qualifiers and deposit milestones."
    roles: [ProgramDirector]
    code: 200
    input: [cancellation_reason]
    output: Program
    side_effects:
      - "runs the six-step program-cancellation cascade documented in §1.2"
      - "re-stamps cancellation_exposure_cents from calculations.cancellation_exposure_projection"
      - "increments Program.version by 1"
  - method: GET
    path: "/programs/{program_id}/measurement"
    description: "Computed read: program measurement against sales lift and participant satisfaction, plus the live budget and exposure posture."
    roles: [ProgramDirector, SalesOpsAnalyst]
    code: 200
    input: []
    output: { program_id: string, sales_lift_pct: number, satisfaction_index: number, baseline_metric_total: integer, actual_metric_total: integer, survey_count: integer, qualified_count: integer, travelled_count: integer, committed_budget_cents: integer, budget_headroom_cents: integer, budget_posture: string, cancellation_exposure_cents: integer, reported_award_total_cents: integer }
    side_effects: []

  # ============================== AwardTier ================================
  - method: POST
    path: "/award-tiers"
    description: "Add an immutable award tier to a program's ladder: qualification threshold, per-qualifier budget, guest allowance, cabin entitlement and service load."
    roles: [ProgramDirector]
    code: 201
    input: ["program_id", "tier_code", "tier_rank", "qualification_threshold", "budget_per_qualifier_cents", "guest_allowance?", "air_cabin_class", "upgrade_allowance_cents?", "service_load_bp?"]
    output: AwardTier
    side_effects:
      - "no mutable state; the row carries no version field and has no update endpoint"
  - method: GET
    path: "/award-tiers/{tier_id}"
    description: "Read one award tier."
    roles: [ProgramDirector, SourcingManager, ContractApprover, SalesOpsAnalyst, TravelDesk, TaxComplianceOfficer, Participant]
    code: 200
    input: []
    output: AwardTier
    side_effects: []
  - method: GET
    path: "/award-tiers"
    description: "List award tiers, filterable by program."
    roles: [ProgramDirector, SourcingManager, ContractApprover, SalesOpsAnalyst, TravelDesk, TaxComplianceOfficer, Participant]
    code: 200
    input: ["program_id?", "tier_code?", "limit?", "offset?"]
    output: AwardTier[]
    side_effects: []

  # ============================== Qualifier ================================
  - method: POST
    path: "/qualifiers"
    description: "Register a salesperson's qualifying-period result against a program; the row lands in PENDING_REVIEW. Permitted while Program.status IN {DESIGN, SOURCING, CONTRACTED}."
    roles: [SalesOpsAnalyst]
    code: 201
    input: ["program_id", "employee_code", "full_name", "baseline_metric", "actual_metric", "guest_count?"]
    output: Qualifier
    side_effects:
      - "award_status = PENDING_REVIEW, tax_status = NOT_APPLICABLE, version = 1"
  - method: GET
    path: "/qualifiers/{qualifier_id}"
    description: "Read one qualifier including both state dimensions and the committed/taxable amounts."
    roles: [ProgramDirector, SourcingManager, ContractApprover, SalesOpsAnalyst, TravelDesk, TaxComplianceOfficer, Participant]
    code: 200
    input: []
    output: Qualifier
    side_effects: []
  - method: GET
    path: "/qualifiers"
    description: "List qualifiers, filterable by program, assigned tier and either state dimension."
    roles: [ProgramDirector, SourcingManager, ContractApprover, SalesOpsAnalyst, TravelDesk, TaxComplianceOfficer]
    code: 200
    input: ["program_id?", "assigned_tier_id?", "award_status?", "tax_status?", "employee_code?", "limit?", "offset?"]
    output: Qualifier[]
    side_effects: []
  - method: POST
    path: "/qualifiers/{qualifier_id}/review"
    description: "Adjudicate a qualifier against the tier ladder: assign the richest cleared tier and stamp the committed award cost, or disqualify when no tier is cleared. Permitted while Program.status IN {DESIGN, SOURCING, CONTRACTED}."
    roles: [SalesOpsAnalyst]
    code: 200
    input: []
    output: Qualifier
    side_effects:
      - "runs calculations.tier_assignment_selector then calculations.qualifier_committed_cost"
      - "recomputes Program.qualified_count and calculations.program_budget_rollup"
      - "increments Qualifier.version by 1"

  # ============================== Destination ==============================
  - method: POST
    path: "/destinations"
    description: "Add a candidate destination with its per-person land cost, travel-risk score and arrival gateway."
    roles: [SourcingManager]
    code: 201
    input: [program_id, city, country_code, per_person_cost_cents, risk_score, air_gateway_code]
    output: Destination
    side_effects:
      - "status = CANDIDATE, inspection_status = NOT_INSPECTED, version = 1"
  - method: GET
    path: "/destinations/{destination_id}"
    description: "Read one destination including its inspection record."
    roles: [ProgramDirector, SourcingManager, ContractApprover, SalesOpsAnalyst, TravelDesk]
    code: 200
    input: []
    output: Destination
    side_effects: []
  - method: GET
    path: "/destinations"
    description: "List destinations, filterable by program, selection status and inspection status."
    roles: [ProgramDirector, SourcingManager, ContractApprover, SalesOpsAnalyst, TravelDesk]
    code: 200
    input: ["program_id?", "status?", "inspection_status?", "limit?", "offset?"]
    output: Destination[]
    side_effects: []
  - method: POST
    path: "/destinations/{destination_id}/site-inspection"
    description: "Record the result of a site inspection. Accepted once per destination."
    roles: [SourcingManager]
    code: 200
    input: [inspection_score]
    output: Destination
    side_effects:
      - "inspection_status = INSPECTED; stamps inspection_score, inspected_by_user_id and inspected_at"
      - "increments Destination.version by 1"
  - method: POST
    path: "/destinations/{destination_id}/shortlist"
    description: "Shortlist an inspected destination. Blocked when the inspection score is below the minimum or the risk score is above the ceiling."
    roles: [SourcingManager]
    code: 200
    input: []
    output: Destination
    side_effects:
      - "status CANDIDATE -> SHORTLISTED"
      - "increments Destination.version by 1"

  # ============================== SupplierContract ========================
  - method: POST
    path: "/supplier-contracts"
    description: "Open a supplier contract in DRAFT with the opening room block, stay window, rate, attrition allowance, force-majeure clause and exposure basis."
    roles: [SourcingManager]
    code: 201
    input: [program_id, destination_id, supplier_name, supplier_kind, room_block_count, contracted_nights, stay_start_at, nightly_rate_cents, attrition_allowance_bp, force_majeure_clause, exposure_basis]
    output: SupplierContract
    side_effects:
      - "status = DRAFT, round_count = 0, version = 1"
      - "computes stay_end_at = stay_start_at + contracted_nights days"
  - method: GET
    path: "/supplier-contracts/{contract_id}"
    description: "Read one supplier contract including the negotiation counters and the room-night ledger."
    roles: [ProgramDirector, SourcingManager, ContractApprover, SalesOpsAnalyst, TravelDesk]
    code: 200
    input: []
    output: SupplierContract
    side_effects: []
  - method: GET
    path: "/supplier-contracts"
    description: "List supplier contracts, filterable by program, destination, kind and status."
    roles: [ProgramDirector, SourcingManager, ContractApprover, SalesOpsAnalyst, TravelDesk]
    code: 200
    input: ["program_id?", "destination_id?", "supplier_kind?", "status?", "limit?", "offset?"]
    output: SupplierContract[]
    side_effects: []
  - method: POST
    path: "/supplier-contracts/{contract_id}/negotiate"
    description: "Run one negotiation round. action == PROPOSE moves DRAFT or COUNTERED to PROPOSED; action == COUNTER moves PROPOSED to COUNTERED. Any supplied term fields overwrite the contract."
    roles: [SourcingManager, ContractApprover]
    code: 200
    input: ["action", "room_block_count?", "contracted_nights?", "stay_start_at?", "nightly_rate_cents?", "attrition_allowance_bp?", "force_majeure_clause?", "exposure_basis?", "note?"]
    output: SupplierContract
    side_effects:
      - "increments round_count by 1 and recomputes stay_end_at"
      - "stamps last_proposed_by_user_id (PROPOSE) or last_countered_by_user_id (COUNTER) from X-User-ID"
      - "increments SupplierContract.version by 1"
  - method: POST
    path: "/supplier-contracts/{contract_id}/execute"
    description: "Execute a PROPOSED contract. Enforces segregation of duties on X-User-ID and drives the five-level execution cascade."
    roles: [ContractApprover]
    code: 200
    input: []
    output: SupplierContract
    side_effects:
      - "status PROPOSED -> EXECUTED; stamps executed_by_user_id and executed_at"
      - "stamps room_nights_blocked and runs calculations.room_night_ledger"
      - "HOTEL only: Destination SHORTLISTED -> SELECTED and every sibling -> REJECTED"
      - "HOTEL only and Program.status == SOURCING: Program SOURCING -> CONTRACTED, per_person_cost_basis_cents stamped, every non-terminal Qualifier's committed_cost_cents recomputed, calculations.program_budget_rollup re-run"
      - "when the rollup leaves budget_posture == OVERCOMMITTED: every SCHEDULED DepositMilestone of this contract gets requires_finance_review = true"
      - "increments SupplierContract.version by 1"
  - method: POST
    path: "/supplier-contracts/{contract_id}/withdraw"
    description: "Withdraw a contract that has not been executed; its scheduled deposit milestones are cancelled."
    roles: [SourcingManager]
    code: 200
    input: [withdrawal_reason]
    output: SupplierContract
    side_effects:
      - "status -> WITHDRAWN; stores withdrawal_reason"
      - "every SCHEDULED DepositMilestone of this contract moves to CANCELLED"
      - "increments SupplierContract.version by 1"
  - method: GET
    path: "/supplier-contracts/{contract_id}/exposure-projection"
    description: "Computed read: both cancellation-exposure variants for this contract side by side, plus the room-night shortfall that feeds the attrition variant."
    roles: [ProgramDirector, SourcingManager, ContractApprover]
    code: 200
    input: []
    output: { contract_id: string, contract_value_cents: integer, attrition_basis_cents: integer, deposit_forfeiture_basis_cents: integer, deposit_pre_relief_cents: integer, force_majeure_relief_bp: integer, binding_basis: string, binding_exposure_cents: integer, room_nights_blocked: integer, room_nights_confirmed: integer, attrition_floor_room_nights: integer, shortfall_room_nights: integer }
    side_effects: []

  # ============================== DepositMilestone =========================
  - method: POST
    path: "/deposit-milestones"
    description: "Append a milestone to a contract's deposit schedule. The cumulative schedule may not exceed the contract value."
    roles: [SourcingManager]
    code: 201
    input: [contract_id, sequence, due_at, amount_cents, refundable_bp]
    output: DepositMilestone
    side_effects:
      - "status = SCHEDULED, requires_finance_review = false, version = 1"
  - method: GET
    path: "/deposit-milestones/{milestone_id}"
    description: "Read one deposit milestone."
    roles: [ProgramDirector, SourcingManager, ContractApprover]
    code: 200
    input: []
    output: DepositMilestone
    side_effects: []
  - method: GET
    path: "/deposit-milestones"
    description: "List deposit milestones, filterable by contract and status."
    roles: [ProgramDirector, SourcingManager, ContractApprover]
    code: 200
    input: ["contract_id?", "status?", "requires_finance_review?", "limit?", "offset?"]
    output: DepositMilestone[]
    side_effects: []
  - method: POST
    path: "/deposit-milestones/{milestone_id}/pay"
    description: "Pay a scheduled milestone. Guarded on the parent contract being EXECUTED."
    roles: [ContractApprover]
    code: 200
    input: []
    output: DepositMilestone
    side_effects:
      - "status SCHEDULED -> PAID; stamps paid_at from the logical clock"
      - "recomputes Program.cancellation_exposure_cents"
      - "increments DepositMilestone.version by 1"

  # ============================== Registration ============================
  - method: POST
    path: "/registrations"
    description: "Create a WINNER seat or an accompanying GUEST seat for a notified qualifier. Requires Program.status == REGISTRATION_OPEN and the referenced Qualifier.award_status == NOTIFIED. Carries the OCC guard on the parent program."
    roles: [TravelDesk, Participant]
    code: 201
    input: ["qualifier_id", "registration_kind", "guest_of_registration_id?", "arrival_date", "departure_date", "rooms?", "expected_program_version"]
    output: Registration
    side_effects:
      - "attendance_status = INVITED, air_status = NOT_REQUESTED, version = 1"
      - "program_id is denormalised from the referenced Qualifier"
      - "increments Program.version by 1"
  - method: GET
    path: "/registrations/{registration_id}"
    description: "Read one registration including both state dimensions and the full air cost breakdown."
    roles: [ProgramDirector, SourcingManager, ContractApprover, SalesOpsAnalyst, TravelDesk, TaxComplianceOfficer, Participant]
    code: 200
    input: []
    output: Registration
    side_effects: []
  - method: GET
    path: "/registrations"
    description: "List registrations, filterable by program, qualifier, guest linkage, kind and either state dimension."
    roles: [ProgramDirector, SourcingManager, ContractApprover, SalesOpsAnalyst, TravelDesk, TaxComplianceOfficer, Participant]
    code: 200
    input: ["program_id?", "qualifier_id?", "guest_of_registration_id?", "registration_kind?", "attendance_status?", "air_status?", "limit?", "offset?"]
    output: Registration[]
    side_effects: []
  - method: POST
    path: "/registrations/{registration_id}/respond"
    description: "Participant answer to the invitation. ACCEPT may also record the activity liability waiver; DECLINE voids any air record."
    roles: [Participant]
    code: 200
    input: ["response", "waiver_signed?"]
    output: Registration
    side_effects:
      - "attendance_status INVITED -> ACCEPTED or INVITED -> DECLINED"
      - "sets waiver_on_file = true when waiver_signed == true"
      - "DECLINE voids a non-terminal air_status"
      - "increments Registration.version by 1"
  - method: POST
    path: "/registrations/{registration_id}/confirm"
    description: "Confirm an accepted seat against the executed hotel contract: stay window, per-night room availability and program budget headroom are all checked before the seat is booked."
    roles: [TravelDesk]
    code: 200
    input: []
    output: Registration
    side_effects:
      - "attendance_status ACCEPTED -> CONFIRMED; stamps room_nights"
      - "recomputes calculations.room_night_ledger and calculations.program_budget_rollup"
      - "WINNER only: the Qualifier moves NOTIFIED -> REGISTERED"
      - "increments Registration.version by 1"
  - method: POST
    path: "/registrations/{registration_id}/cancel"
    description: "Cancel a seat and reverse every side effect of its confirmation, including guest seats, activity signups and the waitlist promotion that follows a released seat."
    roles: [TravelDesk, Participant]
    code: 200
    input: [cancellation_reason]
    output: Registration
    side_effects:
      - "attendance_status -> CANCELLED and a non-terminal air_status -> VOIDED"
      - "cancels dependent GUEST registrations and every BOOKED/WAITLISTED ActivitySignup of this row"
      - "runs calculations.activity_seat_allocation promotion for each released BOOKED seat"
      - "reverses the room-night ledger and the budget rollup contributions"
      - "WINNER only, when no non-CANCELLED WINNER seat remains: the Qualifier moves REGISTERED -> NOTIFIED"
      - "increments Registration.version by 1"
  - method: POST
    path: "/registrations/{registration_id}/air"
    description: "Air travel management. action == REQUEST records the cabin, deviation days and quoted fare; action == TICKET issues or re-issues the ticket; action == CHANGE opens a change. Re-ticketing after a change advances the change-fee escalator."
    roles: [TravelDesk]
    code: 200
    input: ["action", "cabin_class?", "deviation_pre_days?", "deviation_post_days?", "base_fare_cents?"]
    output: Registration
    side_effects:
      - "moves air_status along its cyclic machine (NOT_REQUESTED -> REQUESTED -> TICKETED <-> CHANGE_PENDING)"
      - "CHANGE_PENDING -> TICKETED increments air_change_count by 1"
      - "recomputes calculations.air_cost_and_change_fee and therefore cost_cents"
      - "recomputes calculations.program_budget_rollup when attendance_status IN {CONFIRMED, TRAVELLED}"
      - "increments Registration.version by 1"
  - method: POST
    path: "/registrations/{registration_id}/survey"
    description: "Record the post-trip participant satisfaction score that feeds the program's satisfaction index. Permitted while Program.status IN {ONSITE, RECONCILED} and attendance_status IN {CONFIRMED, TRAVELLED}."
    roles: [Participant, TravelDesk]
    code: 200
    input: [satisfaction_score]
    output: Registration
    side_effects:
      - "stores satisfaction_score"
      - "increments Registration.version by 1"

  # ============================== OnsiteActivity ==========================
  - method: POST
    path: "/onsite-activities"
    description: "Publish an on-site activity option with its interval, seat capacity and risk classification. Permitted while Program.status IN {CONTRACTED, REGISTRATION_OPEN, ONSITE}."
    roles: [TravelDesk]
    code: 201
    input: [program_id, name, start_at, end_at, capacity, risk_level]
    output: OnsiteActivity
    side_effects:
      - "status = OPEN, booked_count = 0, waitlist_count = 0, version = 1"
  - method: GET
    path: "/onsite-activities/{activity_id}"
    description: "Read one activity including its live seat counters (the OCC comparand for signups)."
    roles: [ProgramDirector, SourcingManager, ContractApprover, SalesOpsAnalyst, TravelDesk, TaxComplianceOfficer, Participant]
    code: 200
    input: []
    output: OnsiteActivity
    side_effects: []
  - method: GET
    path: "/onsite-activities"
    description: "List on-site activities, filterable by program, status and risk level."
    roles: [ProgramDirector, SourcingManager, ContractApprover, SalesOpsAnalyst, TravelDesk, TaxComplianceOfficer, Participant]
    code: 200
    input: ["program_id?", "status?", "risk_level?", "limit?", "offset?"]
    output: OnsiteActivity[]
    side_effects: []
  - method: POST
    path: "/onsite-activities/{activity_id}/close"
    description: "Close an activity: the waitlist is cancelled outright with no promotion, and booked seats stand."
    roles: [TravelDesk]
    code: 200
    input: []
    output: OnsiteActivity
    side_effects:
      - "status OPEN -> CLOSED"
      - "every WAITLISTED ActivitySignup of this activity moves to CANCELLED and waitlist_count becomes 0"
      - "increments OnsiteActivity.version by 1"

  # ============================== ActivitySignup ==========================
  - method: POST
    path: "/activity-signups"
    description: "Sign a confirmed participant up for an activity. Requires Program.status == ONSITE, OnsiteActivity.status == OPEN and Registration.attendance_status IN {CONFIRMED, TRAVELLED}. Lands BOOKED while seats remain, WAITLISTED otherwise. Carries the OCC guard on the parent activity."
    roles: [TravelDesk, Participant]
    code: 201
    input: [activity_id, registration_id, expected_activity_version]
    output: ActivitySignup
    side_effects:
      - "runs calculations.activity_seat_allocation admission (BOOKED vs WAITLISTED) and updates booked_count / waitlist_count"
      - "runs calculations.activity_schedule_conflict against the participant's existing agenda"
      - "increments OnsiteActivity.version by 1"
  - method: GET
    path: "/activity-signups/{signup_id}"
    description: "Read one activity signup."
    roles: [ProgramDirector, SalesOpsAnalyst, TravelDesk, Participant]
    code: 200
    input: []
    output: ActivitySignup
    side_effects: []
  - method: GET
    path: "/activity-signups"
    description: "List activity signups, filterable by activity, registration and status."
    roles: [ProgramDirector, SalesOpsAnalyst, TravelDesk, Participant]
    code: 200
    input: ["activity_id?", "registration_id?", "status?", "limit?", "offset?"]
    output: ActivitySignup[]
    side_effects: []
  - method: POST
    path: "/activity-signups/{signup_id}/cancel"
    description: "Release an activity slot. Releasing a BOOKED seat promotes the earliest waitlisted participant; releasing a WAITLISTED slot promotes nobody."
    roles: [TravelDesk, Participant]
    code: 200
    input: []
    output: ActivitySignup
    side_effects:
      - "status -> CANCELLED and the matching counter is decremented"
      - "BOOKED release only: calculations.activity_seat_allocation promotes the earliest WAITLISTED signup and stamps its promoted_at"
      - "increments OnsiteActivity.version by 1"

  # ============================== TaxAwardReport ==========================
  - method: POST
    path: "/tax-award-reports"
    description: "Draft the taxable award report for a travelled winner. Deliberately NOT gated on Program.status (any status except CANCELLED is accepted) so the only lifecycle gate is the cross-entity one: Qualifier.award_status MUST be TRAVELLED. Snapshots the taxable base and the program's gross-up policy, then computes the gross-up and the reported value."
    roles: [TaxComplianceOfficer]
    code: 201
    input: [qualifier_id, tax_year]
    output: TaxAwardReport
    side_effects:
      - "snapshots award_value_cents from Qualifier.taxable_award_cents and gross_up_method from Program.gross_up_policy"
      - "runs calculations.taxable_award_gross_up to fill combined_rate_bp, gross_up_cents and reported_value_cents"
      - "status = DRAFT, version = 1; moves the Qualifier's tax_status VOIDED -> PENDING_REPORT when it was VOIDED"
  - method: GET
    path: "/tax-award-reports/{report_id}"
    description: "Read one tax award report including the gross-up derivation fields."
    roles: [ProgramDirector, TaxComplianceOfficer]
    code: 200
    input: []
    output: TaxAwardReport
    side_effects: []
  - method: GET
    path: "/tax-award-reports"
    description: "List tax award reports, filterable by qualifier, tax year, status and gross-up method."
    roles: [ProgramDirector, TaxComplianceOfficer]
    code: 200
    input: ["qualifier_id?", "tax_year?", "status?", "gross_up_method?", "limit?", "offset?"]
    output: TaxAwardReport[]
    side_effects: []
  - method: POST
    path: "/tax-award-reports/{report_id}/file"
    description: "File a drafted report with the tax authority; the winner's tax dimension becomes REPORTED and the program's reported total grows."
    roles: [TaxComplianceOfficer]
    code: 200
    input: []
    output: TaxAwardReport
    side_effects:
      - "status DRAFT -> FILED; stamps filed_by_user_id and filed_at"
      - "Qualifier.tax_status PENDING_REPORT -> REPORTED"
      - "adds reported_value_cents to Program.reported_award_total_cents"
      - "increments TaxAwardReport.version by 1"
  - method: POST
    path: "/tax-award-reports/{report_id}/void"
    description: "Void a filed report. Segregation of duties: the filer may not void their own filing. The program's reported total is exactly compensated."
    roles: [TaxComplianceOfficer]
    code: 200
    input: [void_reason]
    output: TaxAwardReport
    side_effects:
      - "status FILED -> VOIDED; stamps voided_by_user_id and void_reason"
      - "Qualifier.tax_status REPORTED -> VOIDED"
      - "subtracts reported_value_cents from Program.reported_award_total_cents"
      - "increments TaxAwardReport.version by 1"

  # ============================== test-driving ============================
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, used by deposit maturity, notification stamps, inspection stamps, promotion stamps and the cancellation-exposure waterfall. The server starts at the fixed default 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time before this endpoint is called."
    roles: [ProgramDirector, SourcingManager, ContractApprover, SalesOpsAnalyst, TravelDesk, TaxComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "no business state changes; every subsequent logical-clock read returns the supplied instant"

errors:
  # ---- authentication / authorization ------------------------------------
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID header is absent or empty on any request."
  - id: ERR_INVALID_ROLE
    http: 401
    condition: "X-User-Role is not one of the seven roles declared in §1.7."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The role is valid but does not appear in the called endpoint's roles list."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "X-User-Role == Participant and X-User-ID is not the Qualifier.id owning the targeted registration, signup or qualifier row."

  # ---- not found ---------------------------------------------------------
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "program_id in the path or body matches no Program row."
  - id: ERR_TIER_NOT_FOUND
    http: 404
    condition: "tier_id in the path matches no AwardTier row."
  - id: ERR_QUALIFIER_NOT_FOUND
    http: 404
    condition: "qualifier_id in the path or body matches no Qualifier row."
  - id: ERR_DESTINATION_NOT_FOUND
    http: 404
    condition: "destination_id in the path or body matches no Destination row."
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "contract_id in the path or body matches no SupplierContract row."
  - id: ERR_MILESTONE_NOT_FOUND
    http: 404
    condition: "milestone_id in the path matches no DepositMilestone row."
  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: "registration_id or guest_of_registration_id matches no Registration row."
  - id: ERR_ACTIVITY_NOT_FOUND
    http: 404
    condition: "activity_id in the path or body matches no OnsiteActivity row."
  - id: ERR_SIGNUP_NOT_FOUND
    http: 404
    condition: "signup_id in the path matches no ActivitySignup row."
  - id: ERR_TAX_REPORT_NOT_FOUND
    http: 404
    condition: "report_id in the path matches no TaxAwardReport row."

  # ---- schema ------------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required field is missing, a field has the wrong JSON type, an enum value is outside its declared set, a numeric value is outside its declared range, or a pagination parameter is malformed."

  # ---- optimistic concurrency -------------------------------------------
  - id: ERR_STALE_PROGRAM_VERSION
    http: 412
    condition: "POST /registrations carries an expected_program_version that no longer equals the Program's current version (§1.2.1 registration-create-stale-program)."
  - id: ERR_STALE_ACTIVITY_VERSION
    http: 412
    condition: "POST /activity-signups carries an expected_activity_version that no longer equals the OnsiteActivity's current version (§1.2.1 activity-signup-stale-activity)."

  # ---- state preconditions ----------------------------------------------
  - id: ERR_PROGRAM_STATE_INVALID
    http: 409
    condition: "Program.status does not permit the operation, or the requested to_status is not a declared edge out of the current status (including cancelling a RECONCILED or CLOSED program)."
  - id: ERR_QUALIFIER_STATE_INVALID
    http: 409
    condition: "Qualifier.award_status or tax_status does not permit the operation — reviewing an already-reviewed qualifier, or drafting a tax report for a qualifier that has not TRAVELLED."
  - id: ERR_DESTINATION_STATE_INVALID
    http: 409
    condition: "Destination.status or inspection_status does not permit the operation — re-inspecting an INSPECTED destination, or shortlisting one that is not a CANDIDATE or has not been inspected."
  - id: ERR_CONTRACT_STATE_INVALID
    http: 409
    condition: "SupplierContract.status does not permit the operation — countering a DRAFT, executing a non-PROPOSED contract, withdrawing an EXECUTED one, or paying a milestone whose contract is not EXECUTED."
  - id: ERR_MILESTONE_STATE_INVALID
    http: 409
    condition: "DepositMilestone.status is not SCHEDULED when payment is attempted."
  - id: ERR_REGISTRATION_STATE_INVALID
    http: 409
    condition: "Registration.attendance_status does not permit the operation — responding twice, confirming a seat that is not ACCEPTED, cancelling a terminal seat, or signing up a seat that is not CONFIRMED or TRAVELLED for an activity."
  - id: ERR_AIR_STATE_INVALID
    http: 409
    condition: "Registration.air_status does not permit the requested air action — requesting twice, ticketing from NOT_REQUESTED, changing a non-TICKETED record, or acting on a VOIDED air record."
  - id: ERR_ACTIVITY_STATE_INVALID
    http: 409
    condition: "OnsiteActivity.status is not OPEN when a signup, a signup cancellation or a close is attempted."
  - id: ERR_SIGNUP_STATE_INVALID
    http: 409
    condition: "ActivitySignup.status is already CANCELLED when cancellation is attempted."
  - id: ERR_TAX_REPORT_STATE_INVALID
    http: 409
    condition: "TaxAwardReport.status does not permit the operation — filing a non-DRAFT report or voiding a non-FILED report."
  - id: ERR_NO_EXECUTED_HOTEL_CONTRACT
    http: 409
    condition: "A registration confirmation is attempted while the program does not have exactly one SupplierContract with supplier_kind == HOTEL and status == EXECUTED to book room-nights against — either none at all, or two or more, which leaves the room-night basis ambiguous."
  - id: ERR_GROSS_UP_POLICY_LOCKED
    http: 409
    condition: "A gross-up policy decision is submitted while Program.gross_up_policy_locked is already true."

  # ---- business_safety / duty separation --------------------------------
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "The X-User-ID executing a SupplierContract equals its last_proposed_by_user_id or last_countered_by_user_id."
  - id: ERR_TAX_VOID_SELF_REVIEW
    http: 422
    condition: "The X-User-ID voiding a TaxAwardReport equals its filed_by_user_id."
  - id: ERR_ACTIVITY_WAIVER_REQUIRED
    http: 422
    condition: "A signup for a HIGH risk_level activity is attempted for a registration whose waiver_on_file is false."
  - id: ERR_DESTINATION_RISK_TOO_HIGH
    http: 422
    condition: "Shortlisting is attempted for a destination whose risk_score exceeds MAX_DESTINATION_RISK (60)."

  # ---- business_constraint ----------------------------------------------
  - id: ERR_INSPECTION_SCORE_BELOW_MINIMUM
    http: 422
    condition: "Shortlisting is attempted for a destination whose inspection_score is below MIN_INSPECTION_SCORE (70)."
  - id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http: 422
    condition: "A PROPOSE or COUNTER round is attempted while SupplierContract.round_count has already reached MAX_NEGOTIATION_ROUNDS (5)."
  - id: ERR_GUEST_ALLOWANCE_EXCEEDED
    http: 422
    condition: "Qualifier.guest_count exceeds the assigned tier's guest_allowance at review, or an additional GUEST registration would exceed that allowance."
  - id: ERR_GUEST_LINK_INVALID
    http: 422
    condition: "A GUEST registration omits guest_of_registration_id, points at a CANCELLED or non-WINNER registration, points at a registration of a different qualifier_id, or a WINNER registration supplies a non-null guest_of_registration_id."
  - id: ERR_DUPLICATE_EMPLOYEE_CODE
    http: 409
    condition: "A second Qualifier with the same employee_code is created for one program_id."
  - id: ERR_DUPLICATE_TIER_KEY
    http: 409
    condition: "A second AwardTier with the same tier_code or the same tier_rank is created for one program_id."
  - id: ERR_DUPLICATE_MILESTONE_SEQUENCE
    http: 409
    condition: "A second DepositMilestone with the same sequence is created for one contract_id."
  - id: ERR_DUPLICATE_WINNER_REGISTRATION
    http: 409
    condition: "A second non-CANCELLED WINNER Registration is created for one qualifier_id."
  - id: ERR_DUPLICATE_ACTIVITY_SIGNUP
    http: 409
    condition: "A second non-CANCELLED ActivitySignup is created for the same (activity_id, registration_id) pair."

  # ---- business_temporal ------------------------------------------------
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "An ordered date pair is not strictly increasing: sales_period_end <= sales_period_start, end_at <= start_at, or departure_date <= arrival_date."
  - id: ERR_ACTIVITY_TIME_CONFLICT
    http: 409
    condition: "The requested activity interval overlaps one the participant is already BOOKED or WAITLISTED on once both are padded by TRANSFER_BUFFER_MINUTES (45); a gap of exactly 45 minutes is accepted."
  - id: ERR_DEVIATION_LIMIT_EXCEEDED
    http: 422
    condition: "air_deviation_pre_days + air_deviation_post_days exceeds DEVIATION_MAX_DAYS_TOTAL (7)."
  - id: ERR_STAY_WINDOW_VIOLATION
    http: 422
    condition: "arrival_date is before the executed hotel contract's stay_start_at, or departure_date is after its stay_end_at."

  # ---- capacity ---------------------------------------------------------
  - id: ERR_ROOM_BLOCK_EXHAUSTED
    http: 409
    condition: "Confirming the registration would push occupancy on at least one night of the half-open interval [arrival_date, departure_date) above the contract's room_block_count."

  # ---- business_fiscal --------------------------------------------------
  - id: ERR_DEPOSIT_SCHEDULE_EXCEEDS_CONTRACT_VALUE
    http: 422
    condition: "The cumulative amount_cents of a contract's non-CANCELLED deposit milestones would exceed room_block_count * contracted_nights * nightly_rate_cents; a schedule summing to exactly the contract value is accepted."
  - id: ERR_TIER_BUDGET_EXCEEDED
    http: 422
    condition: "The committed cost computed at review exceeds the assigned tier's budget_per_qualifier_cents."
  - id: ERR_BUDGET_HEADROOM_EXCEEDED
    http: 422
    condition: "Confirming the registration would cost more than the program's remaining budget_headroom_cents."

  # ---- business_referential --------------------------------------------
  - id: ERR_PROGRAM_SCOPE_MISMATCH
    http: 422
    condition: "Two referenced rows belong to different programs, or a TaxAwardReport.tax_year differs from the qualifier's program fiscal_year."
  - id: ERR_TAX_REPORTING_INCOMPLETE
    http: 422
    condition: "The program is advanced to CLOSED while at least one qualifier with taxable_award_cents > 0 is not tax_status REPORTED."
  - id: ERR_ADVANCE_PREREQUISITES_UNMET
    http: 422
    condition: "A program advance is structurally valid as an edge but its prerequisites are unmet — no award tier or no shortlisted destination for SOURCING, a PENDING_REVIEW qualifier or an unlocked gross-up policy for REGISTRATION_OPEN, no confirmed registration for ONSITE, or an OPEN activity for RECONCILED."

roles:
  - name: ProgramDirector
    description: "Owns program design, the tier ladder, the gross-up policy decision, qualifier communication, lifecycle advancement, cancellation and program measurement."
    identity: opaque
    exclusive_operations:
      - "POST /programs"
      - "POST /programs/{program_id}/advance"
      - "POST /programs/{program_id}/gross-up-policy"
      - "POST /programs/{program_id}/notify-qualifiers"
      - "POST /programs/{program_id}/cancel"
      - "POST /award-tiers"
    shared_operations:
      - "GET /programs/{program_id}/measurement (with SalesOpsAnalyst)"
      - "all GET reads except the participant-scoped ownership checks"
      - "POST /_clock/set_current_utc"
  - name: SourcingManager
    description: "Sources and inspects destinations, opens supplier contracts, runs the PROPOSE side of negotiation, builds the deposit schedule and withdraws dead contracts. Cannot execute a contract."
    identity: opaque
    exclusive_operations:
      - "POST /destinations"
      - "POST /destinations/{destination_id}/site-inspection"
      - "POST /destinations/{destination_id}/shortlist"
      - "POST /supplier-contracts"
      - "POST /supplier-contracts/{contract_id}/withdraw"
      - "POST /deposit-milestones"
    shared_operations:
      - "POST /supplier-contracts/{contract_id}/negotiate (with ContractApprover; PROPOSE is this role's side of the cycle)"
      - "GET /destinations, GET /supplier-contracts, GET /deposit-milestones and their single-row reads"
      - "POST /_clock/set_current_utc"
  - name: ContractApprover
    description: "Counter-signs and executes supplier contracts and pays deposit milestones. Segregation of duties bars this user id from executing a contract it proposed or countered."
    identity: opaque
    exclusive_operations:
      - "POST /supplier-contracts/{contract_id}/execute"
      - "POST /deposit-milestones/{milestone_id}/pay"
    shared_operations:
      - "POST /supplier-contracts/{contract_id}/negotiate (with SourcingManager; COUNTER is this role's side of the cycle)"
      - "GET /supplier-contracts, GET /deposit-milestones, GET /supplier-contracts/{contract_id}/exposure-projection"
      - "POST /_clock/set_current_utc"
  - name: SalesOpsAnalyst
    description: "Loads qualifying-period sales results and adjudicates qualifiers against the tier ladder. Cannot set budgets or advance the program."
    identity: opaque
    exclusive_operations:
      - "POST /qualifiers"
      - "POST /qualifiers/{qualifier_id}/review"
    shared_operations:
      - "GET /programs/{program_id}/measurement (with ProgramDirector)"
      - "GET /qualifiers, GET /registrations, GET /activity-signups and their single-row reads"
      - "POST /_clock/set_current_utc"
  - name: TravelDesk
    description: "Runs the hospitality desk: seat confirmation, all air travel management, the on-site activity agenda and the operational side of signups and cancellations."
    identity: opaque
    exclusive_operations:
      - "POST /registrations/{registration_id}/confirm"
      - "POST /registrations/{registration_id}/air"
      - "POST /onsite-activities"
      - "POST /onsite-activities/{activity_id}/close"
    shared_operations:
      - "POST /registrations (with Participant)"
      - "POST /registrations/{registration_id}/cancel (with Participant)"
      - "POST /registrations/{registration_id}/survey (with Participant)"
      - "POST /activity-signups and POST /activity-signups/{signup_id}/cancel (with Participant)"
      - "GET reads across programs, qualifiers, destinations, contracts, registrations, activities and signups"
      - "POST /_clock/set_current_utc"
  - name: TaxComplianceOfficer
    description: "Owns taxable award reporting: drafting, filing and voiding reports. Segregation of duties bars this user id from voiding a filing it made."
    identity: opaque
    exclusive_operations:
      - "POST /tax-award-reports"
      - "POST /tax-award-reports/{report_id}/file"
      - "POST /tax-award-reports/{report_id}/void"
    shared_operations:
      - "GET /tax-award-reports and its single-row read"
      - "GET /programs, GET /qualifiers, GET /registrations single-row and list reads"
      - "POST /_clock/set_current_utc"
  - name: Participant
    description: "A qualifying salesperson acting on their own award: answering the invitation, enrolling themselves or a guest, choosing activities, cancelling and submitting the post-trip survey. Every write and every single-row read is ownership-checked against X-User-ID."
    identity: "entity_backed:Qualifier"
    exclusive_operations:
      - "POST /registrations/{registration_id}/respond"
    shared_operations:
      - "POST /registrations (with TravelDesk; only for their own qualifier_id)"
      - "POST /registrations/{registration_id}/cancel (with TravelDesk; own seats only)"
      - "POST /registrations/{registration_id}/survey (with TravelDesk; own seats only)"
      - "POST /activity-signups and POST /activity-signups/{signup_id}/cancel (with TravelDesk; own seats only)"
      - "GET /programs/{program_id}, GET /award-tiers, GET /onsite-activities, GET /registrations, GET /qualifiers/{qualifier_id}, GET /activity-signups (own rows only)"
