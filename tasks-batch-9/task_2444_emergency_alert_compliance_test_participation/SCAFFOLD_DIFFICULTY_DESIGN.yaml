            - "te2 WEEKLY [2026-08-13T00:00:00Z, 2026-08-13T01:00:00Z) (disjoint half-open window) is taken READY and logged by dual-1 with TRANSMISSION + RECEIPT/WXPEP + RECEIPT/WXNWS: coverage is complete."
            - "Both filings happen at 2026-08-13T00:30:00Z, before either filing_deadline_at (2026-08-17T01:00:00Z and 2026-08-18T01:00:00Z), so priority 10 and priority 12 are both quiet and late_days would be 0."
