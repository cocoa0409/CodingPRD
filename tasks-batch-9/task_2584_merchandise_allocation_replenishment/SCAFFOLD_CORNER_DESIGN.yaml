            - "AssortmentAction.${a1_id}: broken_size_count 1 of 4 core sizes -> broken_ratio_bp 2500, which is the lower-inclusive edge of the second tier, so markdown_pct_bp == 1500 and NOT 0"
            - "AssortmentAction.${a2_id}: 2 of 4 -> 5000 exactly -> markdown_pct_bp == 3000, not 1500"
