            - call: "POST /creamery/suppliers"
              payload: { name: "SoD Supplier", country_code: "US", ingredient_category: "DAIRY" }
              as: SourcingManager
              captures: { s_id: $.data.id }
            - call: "POST /creamery/suppliers/${s_id}/audits"
              payload: { scheduled_for: "2026-09-05T00:00:00Z" }
              as: SourcingManager
              captures: { a_id: $.data.id }
            - call: "POST /creamery/audits/${a_id}/start"
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a_id}/complete"
              payload: { labor_score: 80, environment_score: 70, community_score: 60, findings_count: 0 }
              as: SustainabilityAuditor
              as_user_id: "aud-1"
          trigger:
            - call: "POST /creamery/audits/${a_id}/verify"
              as: AuditVerifier
              as_user_id: "aud-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SOD_AUDITOR_VERIFY (HTTP 403)"

      - name: campaign_proposer_cannot_decide_sod
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_SOD_CAMPAIGN_PROPOSER]"]
        distinguishing_aspect: "The board member who proposed the campaign cannot cast its board decision; a second board member must decide."
        test_recipe:
          setup: ["Campaign proposed by board-1"]
