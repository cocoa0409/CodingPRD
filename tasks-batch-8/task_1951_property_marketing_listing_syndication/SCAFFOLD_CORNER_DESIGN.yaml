        claim_type: violation_to_error
        grounds: ["validations[priority=24]", "errors[ERR_REVIEW_DECIDED]"]
        distinguishing_aspect: "Deciding an already-APPROVED review fails ERR_REVIEW_DECIDED; the original decision fields are unchanged."
        test_recipe:
