            - "the successful execute creates three ConditionPrecedent rows (PERMITTING deadline 2027-04-28T00:00:00Z, INTERCONNECTION deadline 2028-01-23T00:00:00Z, NOTICE_TO_PROCEED deadline 2028-07-21T00:00:00Z) with cp_total_count 3 and cp_completion_pct 0.00"
            - "Deal.${deal_id}.credit_status was APPROVED throughout and never moved, so the only variable in the experiment was the foreign Offtaker state"

      - name: invoice_blocked_by_claimed_risk_event_over_the_period_window
        grounds:
          - validations.priority_14_ERR_OPEN_RISK_CLAIM
          - state_machines.SettlementPeriod.CALCULATED_to_INVOICED
          - state_machines.RiskEvent.CLAIMED_to_REJECTED
          - endpoints.POST_/ppa/settlement-periods/{id}/advance
        distinguishing_aspect: |
          A different entity pair (SettlementPeriod depending on RiskEvent) and a
          different flavour of dependency: the blocking condition is not a single
          foreign field but the existence of ANY sibling RiskEvent in state CLAIMED
          whose window intersects this period's half-open window. Window intersection
          is part of the predicate, so a CLAIMED claim in a later month does NOT block,
          and the block clears by DECIDING the claim rather than by removing it - a
          REJECTED claim over the very same window is harmless. The period's own state
          stays CALCULATED throughout the refusal.
        test_recipe:
          setup:
            - "Buyer NW is QUALIFIED with a registry account; Project KJ2 (SOLAR, 100.000 MW) is OPERATIONAL, so Deal D (25.000 MW, HOURLY, base 22.00, escalation 0.0, first_delivery_year 2026, AS_GENERATED, SHARED) is EFFECTIVE with an empty CP template."
            - "Settlement period P covers 2027-07-01T00:00:00Z to 2027-08-01T00:00:00Z, holds two metered hours of 7.0000 MWh each with curtailment_flag NONE, and has been calculated, so its status is CALCULATED with invoiced_at null."
            - "One CURTAILMENT RiskEvent RC is CLAIMED over 2027-07-05T00:00:00Z to 2027-07-06T00:00:00Z, strictly inside P's window."
            - "One FORCE_MAJEURE RiskEvent RF is CLAIMED over 2027-09-05T00:00:00Z to 2027-09-06T00:00:00Z, entirely after P's window, and is never reviewed."
            - "Logical clock is the 2026-08-01T00:00:00Z startup default throughout."
          setup_api_calls:
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "SP15 EZ GEN HUB", iso: "CAISO", settlement_point_type: "HUB" }
              as: Originator
              captures: { hub_id: $.data.id }
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "KRAMER JUNCTION 2N", iso: "CAISO", settlement_point_type: "NODE" }
              as: Originator
              captures: { node_id: $.data.id }
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Northwind Retail Inc", credit_rating: "A", rating_agency: "SP", reported_ebitda_usd: 60000000.00, net_debt_to_ebitda: 2.5, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: true, scope2_target_year: 2030, registry_account_id: "WREGIS-ACC-00417" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { buyer_id: $.data.id }
            - call: "POST /ppa/offtakers/${buyer_id}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/offtakers/${buyer_id}/qualification-decision"
              payload: { decision: "QUALIFY" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/projects"
              payload: { name: "Kramer Junction Solar II", technology: "SOLAR", capacity_mw: 100.000, node_id: "${node_id}", cod_target_date: "2026-07-01T00:00:00Z", p50_annual_mwh: 245280.00 }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { project_id: $.data.id }
            - call: "POST /ppa/projects/${project_id}/advance-milestone"
              payload: { milestone: "PERMITTED", evidence_ref: "CUP-2025-0442" }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/projects/${project_id}/advance-milestone"
              payload: { milestone: "INTERCONNECTION_APPROVED", evidence_ref: "LGIA-CAISO-2025-088" }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/projects/${project_id}/advance-milestone"
