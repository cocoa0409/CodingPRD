      - name: score_rounds_half_up_before_the_grade_band_is_chosen
        claim_type: precision
        grounds:
          - calculations.module_second_life_score.precision
          - global_constants.CYCLES_PER_POINT
        distinguishing_aspect: "A single cycle costs 1/200 == 0.005 points, so an 80.0/80.0 module computes 79.995 and rounds HALF UP to 80.00, which lands in band A; two cycles give 79.99 and band B - proving the grade is chosen from the rounded score, not the raw one, and that round-half-up (not truncation or half-even) is used."
        test_recipe:
          setup:
            - "Clock 2026-07-10T00:00:00.000Z; one campus, one supplier, one NMC622 intake of net 1000.0 kg at custody_state PACKAGED carrying two 100.0 kg modules, both min 80.0 / mean 80.0, with cycle_count 1 and 2."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /recycling/suppliers"
              payload: { legal_name: "Northstar Automotive", channel: "AUTOMAKER", credit_limit_cents: 200000 }
              as: PlatformAdmin
              captures: { sup_id: "$.data.id" }
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_id}", facility_id: "${fac_id}", declared_chemistry: "NMC622", gross_mass_kg: 1010.0, packaging_tare_kg: 10.0, declared_ni_pct: 12.0 }
              as: IntakeClerk
              captures: { i_id: "$.data.id" }
            - call: "POST /recycling/intakes/${i_id}/identify-chemistry"
              payload: { identified_chemistry: "NMC622" }
              as: IntakeClerk
              captures: { i_v2: "$.data.version" }
            - call: "POST /recycling/intakes/${i_id}/modules"
              payload: { serial_code: "ONE-CYCLE", mass_kg: 100.0, min_cell_capacity_pct: 80.0, mean_cell_capacity_pct: 80.0, cycle_count: 1, expected_intake_version: "${i_v2}" }
              as: IntakeClerk
              captures: { m1_id: "$.data.id" }
            - call: "GET /recycling/intakes/${i_id}"
              payload: {}
              as: IntakeClerk
              captures: { i_v3: "$.data.version" }
            - call: "POST /recycling/intakes/${i_id}/modules"
              payload: { serial_code: "TWO-CYCLE", mass_kg: 100.0, min_cell_capacity_pct: 80.0, mean_cell_capacity_pct: 80.0, cycle_count: 2, expected_intake_version: "${i_v3}" }
              as: IntakeClerk
              captures: { m2_id: "$.data.id" }
            - call: "POST /recycling/intakes/${i_id}/discharge"
              payload: { soc_pct: 12.0 }
              as: PlantOperator
            - call: "POST /recycling/intakes/${i_id}/package"
              payload: { packaging_type: "UN4G-STEEL-DRUM" }
              as: PlantOperator
          trigger:
            - call: "POST /recycling/modules/${m1_id}/triage-decisions"
              payload: { scoring_variant: "CONSERVATIVE" }
              as: TriageEngineer
              as_user_id: "te-1"
              captures: { s1: "$.data.score", g1: "$.data.grade", d1: "$.data.derived_disposition" }
            - call: "POST /recycling/modules/${m2_id}/triage-decisions"
              payload: { scoring_variant: "CONSERVATIVE" }
              as: TriageEngineer
              as_user_id: "te-1"
              captures: { s2: "$.data.score", g2: "$.data.grade", d2: "$.data.derived_disposition" }
          assert:
            - "${s1} == 80.00: the raw value 80.0 - 1/200 == 79.995 rounds half UP at 2 decimals (truncation would give 79.99 and half-even would give 80.00 only by luck of the even digit - the 79.995 -> 80.00 step is the discriminator)"
            - "${g1} == A and ${d1} == REFURBISH - the band is evaluated on the rounded score"
            - "${s2} == 79.99 == 80.0 - 0.01, so ${g2} == B and ${d2} == SECOND_LIFE"
            - "Module.${m1_id}.status == REFURB_QUEUE while Module.${m2_id}.status == SECOND_LIFE_QUEUE: a single extra cycle changes the downstream route"

      - name: quality_deduction_threshold_components_and_strike_escalation
        claim_type: threshold
        excluded_because:
          difficulty_instance: "combinatorial_formula / quality_deduction_nested_caps_with_strike_escalation_and_global_cap"
          rationale: "The §1.8 instance drives quality_deduction_pct at the moisture and foreign component caps, at the STRIKE_ESCALATION_THRESHOLD of 3 strikes (0.1500 -> 0.2000 via the 1.5x multiplier) and against the TOTAL_DEDUCTION_CAP of 0.20, comparing the same intake with 0 and 3 strikes - every threshold-algorithm boundary of this calculation."

      - name: mass_balance_aggregates_every_recovery_output_of_the_lot
        claim_type: aggregation
        excluded_because:
          difficulty_instance: "boundary_precision_check / mass_balance_floor_inclusive_at_exactly_97_00"
          rationale: "The §1.8 instance books six RecoveryOutput rows (including the non-payable MN and GRAPHITE streams), asserts recovered 312.000 / accounted 776.000 / unaccounted 24.000 / mass_balance 97.00 / recycled_content 39.00 against charged 800.0, and shows the inclusive floor passing at exactly 97.00 - the running-total and floor claims for this aggregation."

      - name: permit_bucket_aggregates_only_posted_events_of_the_same_utc_day
        claim_type: aggregation
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / permit_daily_bucket_aggregate_capacity_per_utc_calendar_day"
          rationale: "The §1.8 instance fills one UTC bucket to exactly daily_cap_kg 500.0, proves 23:59:59.999Z and the next 00:00:00.000Z are different buckets, and shows a VOIDED event leaving the bucket - the add/reversal and floor behaviour of this aggregation."

      - name: campaign_windows_merge_as_half_open_intervals
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / line_campaign_half_open_adjacency_allowed_overlap_rejected"
          rationale: "The §1.8 instance schedules adjacent windows (gap 0, accepted), a one-millisecond overlap (rejected with ERR_CAMPAIGN_WINDOW_CONFLICT) and a disjoint window on the same line, covering the overlapping / adjacent / disjoint rows of the interval_merge algorithm."

      - name: net_payable_waterfall_resolves_the_surcharge_cap_in_order
        claim_type: waterfall_allocation
        excluded_because:
          difficulty_instance: "combinatorial_formula / hazmat_surcharge_cap_resolved_on_pre_surcharge_net_not_final_net"
          rationale: "The §1.8 instance proves the mandatory step order of settlement_net_payable: fee and quality deduction come off gross first, the HAZMAT_CAP_PCT ceiling is taken on pre_surcharge_net_cents (not on the final net), and the net is the pre-surcharge figure minus the capped surcharge."

      - name: conservative_and_fleet_average_variants_diverge_on_one_module
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: "dual_variant_calc / module_triage_score_conservative_vs_fleet_average_diverges_grade"
          rationale: "The §1.8 instance scores the same module under both scoring_variant values, asserts the two different scores and shows the grade (and therefore the derived disposition and the module's queue) changing band - the variant-divergence claim with its delta."

      - name: provisional_variant_at_release_and_final_variant_at_finalize
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: "dual_variant_calc / settlement_provisional_vs_final_repricing_on_lot_finalize"
          rationale: "The §1.8 instance asserts variant PROVISIONAL on the settlement created by release (priced from declared assay x nominal recovery at the received_at quote) and variant FINAL after the lot finalize cascade (priced from actual RecoveryOutput masses at the finalized_at quote), i.e. the correct variant in each context."

      - name: final_flip_reconciles_the_settlement_delta_onto_the_ledger
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: "dual_variant_calc / settlement_provisional_vs_final_repricing_on_lot_finalize"
          rationale: "The same §1.8 instance carries the reconciliation half of the dual-variant claim: it asserts every money field before and after the PROVISIONAL -> FINAL switch (gross 260224 -> 257008, net 216493 -> 213727) plus the recomputed max_variance_pp, so the delta applied on switch is fully pinned."

  - section: validations
    instances:
      - name: duplicate_index_quote_for_the_same_metal_and_date_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_DUPLICATE_INDEX_PRICE]
          - entities.MetalIndexPrice
        distinguishing_aspect: "The quote series is keyed on (metal, effective_date): re-publishing NI for 2026-07-01 at a different price returns HTTP 409 ERR_DUPLICATE_INDEX_PRICE and the original 1600 c/kg row is left intact."
        test_recipe:
          setup:
            - "Clock 2026-07-10T00:00:00.000Z; a single NI quote of 1600 c/kg effective 2026-07-01T00:00:00.000Z exists."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/metal-index-prices"
              payload: { metal: "NI", effective_date: "2026-07-01T00:00:00.000Z", price_cents_per_kg: 1600 }
              as: MarketAnalyst
              captures: { q1_id: "$.data.id" }
          trigger:
            - call: "POST /recycling/metal-index-prices"
              payload: { metal: "NI", effective_date: "2026-07-01T00:00:00.000Z", price_cents_per_kg: 1900 }
              as: MarketAnalyst
          assert:
            - "HTTP 409 with data.error_id == ERR_DUPLICATE_INDEX_PRICE"
            - "GET /recycling/metal-index-prices?metal=NI reports total_count == 1 and the surviving row is ${q1_id} with price_cents_per_kg == 1600"

      - name: index_quote_series_accepts_a_distinct_metal_or_a_distinct_date
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=11]
          - entities.MetalIndexPrice
          - calculations.feedstock_payable_value
        distinguishing_aspect: "The uniqueness rule is on the pair, not on either component: the same effective_date for CO and the same metal on a later date are both accepted, giving the two-point NI series the FINAL variant relies on."
        test_recipe:
          setup:
            - "Clock 2026-07-10T00:00:00.000Z; a single NI quote of 1600 c/kg effective 2026-07-01T00:00:00.000Z exists."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/metal-index-prices"
              payload: { metal: "NI", effective_date: "2026-07-01T00:00:00.000Z", price_cents_per_kg: 1600 }
              as: MarketAnalyst
              captures: { q1_id: "$.data.id" }
          trigger:
            - call: "POST /recycling/metal-index-prices"
              payload: { metal: "CO", effective_date: "2026-07-01T00:00:00.000Z", price_cents_per_kg: 3200 }
              as: MarketAnalyst
              captures: { q2_id: "$.data.id", q2_metal: "$.data.metal" }
            - call: "POST /recycling/metal-index-prices"
              payload: { metal: "NI", effective_date: "2026-08-15T00:00:00.000Z", price_cents_per_kg: 1750 }
              as: MarketAnalyst
              captures: { q3_id: "$.data.id", q3_price: "$.data.price_cents_per_kg" }
            - call: "GET /recycling/metal-index-prices"
              payload: { metal: "NI", effective_on_or_before: "2026-07-31T00:00:00.000Z" }
              as: SettlementAccountant
              captures: { filtered_price: "$.data[0].price_cents_per_kg" }
          assert:
            - "Both POSTs return HTTP 201: ${q2_metal} == CO and ${q3_price} == 1750, with ${q1_id}, ${q2_id} and ${q3_id} all distinct"
            - "GET /recycling/metal-index-prices?metal=NI reports total_count == 2"
            - "The effective_on_or_before filter returns total_count == 1 with ${filtered_price} == 1600 - the August quote is excluded, which is exactly the lookup rule feedstock_payable_value applies"

      - name: campaign_planned_input_at_exactly_line_capacity_passes_and_one_gramme_over_fails
        claim_type: aggregate_validation
        grounds:
          - calculations.campaign_line_occupation
          - errors[ERR_CAMPAIGN_CAPACITY_EXCEEDED]
          - validations[priority=11]
        distinguishing_aspect: "The capacity ceiling is throughput_kg_per_hour * window_hours = 100.0 * 24 = 2400.0 and the comparison is strict: planned_input_kg 2400.0 is accepted while 2400.001 on an equally long, non-overlapping window is refused with ERR_CAMPAIGN_CAPACITY_EXCEEDED."
        test_recipe:
          setup:
            - "Clock 2026-07-10T00:00:00.000Z; one campus with one NICKEL_RICH hydromet line at 100.0 kg/h and the default 6-hour changeover buffer."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /recycling/processing-lines"
              payload: { facility_id: "${fac_id}", line_code: "HYD-1", line_type: "HYDROMET", chemistry_family: "NICKEL_RICH", throughput_kg_per_hour: 100.0 }
              as: PlatformAdmin
              captures: { line_id: "$.data.id" }
          trigger:
            - call: "POST /recycling/campaigns"
              payload: { line_id: "${line_id}", chemistry_family: "NICKEL_RICH", window_start: "2026-08-01T00:00:00.000Z", window_end: "2026-08-02T00:00:00.000Z", planned_input_kg: 2400.0 }
              as: PlantOperator
              captures: { camp1_id: "$.data.id", camp1_planned: "$.data.planned_input_kg" }
            - call: "POST /recycling/campaigns"
              payload: { line_id: "${line_id}", chemistry_family: "NICKEL_RICH", window_start: "2026-08-03T00:00:00.000Z", window_end: "2026-08-04T00:00:00.000Z", planned_input_kg: 2400.001 }
              as: PlantOperator
            - call: "POST /recycling/campaigns"
              payload: { line_id: "${line_id}", chemistry_family: "NICKEL_RICH", window_start: "2026-08-03T00:00:00.000Z", window_end: "2026-08-04T00:00:00.000Z", planned_input_kg: 2400.0 }
              as: PlantOperator
              captures: { camp2_id: "$.data.id" }
          assert:
            - "The first campaign returns HTTP 201 with ${camp1_planned} == 2400.0 - equality with the capacity ceiling is accepted"
            - "The 2400.001 call returns HTTP 422 with data.error_id == ERR_CAMPAIGN_CAPACITY_EXCEEDED (its window neither overlaps nor breaches the buffer: it is the same family and 24 hours away)"
            - "The retry at 2400.0 on the same window returns HTTP 201 with ${camp2_id} != ${camp1_id}"
            - "GET /recycling/campaigns?line_id=${line_id} reports total_count == 2 - the rejected attempt created nothing"

      - name: hydromet_only_metals_cannot_be_booked_on_a_mechanical_line
        claim_type: conditional_validation
        grounds:
          - validations[priority=12]
          - errors[ERR_METAL_NOT_RECOVERABLE_ON_LINE]
          - global_constants.HYDROMET_ONLY_METALS
          - entities.ProcessingLine.fields.line_type
        distinguishing_aspect: "The same POST body is legal or illegal purely on the parent line's line_type: on a MECHANICAL line CU, MN and GRAPHITE outputs are accepted while NI, CO and LI (HYDROMET_ONLY_METALS) each return ERR_METAL_NOT_RECOVERABLE_ON_LINE."
        test_recipe:
          setup:
