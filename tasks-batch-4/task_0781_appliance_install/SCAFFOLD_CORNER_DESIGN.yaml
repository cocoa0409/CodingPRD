  - section: cross_cutting
    instances:
      - name: occ_stale_version_on_dispatch_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[dispatch-supersede-stale-work-order]", "validations[priority=22]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Dispatching with expected_work_order_version below the order's current version (a stale view) returns ERR_STALE_VERSION (412), even though an eligible pro exists and the order is in a dispatchable state."
        test_recipe:
          setup: ["Scheduled order (version captured) with one eligible approved pro; dispatch carries a deliberately stale version."]
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R", commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /service-zones"
              payload: { zone_code: "Z1", name: "Z", max_concurrent_appointments: 5, coverage_active: true }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com", phone: "5", address_line: "1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /pros"
              payload: { full_name: "P", email: "p@x.com", service_zone_id: "${zone_id}", skills: ["TV_MOUNT"] }
              as: PlatformAdmin
              captures: { pro_id: $.data.id }
            - call: "POST /pros/${pro_id}/applications"
              payload: { background_check_ref: "BG" }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /install-tasks"
              payload: { task_code: "T", name: "T", category: "TV_MOUNT", required_skill: "TV_MOUNT", base_price_cents: 12000, estimated_minutes: 60, warranty_days: 30 }
              as: PlatformAdmin
              captures: { task_id: $.data.id }
            - call: "POST /work-orders"
              payload: { retailer_id: "${ret_id}", customer_id: "${cust_id}", install_task_id: "${task_id}", service_zone_id: "${zone_id}", product_sku: "S", product_category: "TV_MOUNT" }
              as: Retailer
              as_user_id: "${ret_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T10:00:00Z" }
              as: Retailer
              as_user_id: "${ret_id}"
              captures: { wo_v: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { expected_work_order_version: "${wo_v} - 1" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 412"
            - "data.error_id == ERR_STALE_VERSION"

      - name: work_order_version_increments_on_schedule
        claim_type: optimistic_concurrency
        grounds: [entities.WorkOrder.fields.status, state_machines.WorkOrder.DRAFT_to_SCHEDULED]
        distinguishing_aspect: "A create (version 1) followed by a schedule mutation yields WorkOrder.version == 2, confirming version increments on every mutation."
        test_recipe:
          setup: ["Retailer, zone, customer, task; a fresh DRAFT order."]
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R", commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /service-zones"
              payload: { zone_code: "Z1", name: "Z", max_concurrent_appointments: 5, coverage_active: true }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com", phone: "5", address_line: "1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /install-tasks"
              payload: { task_code: "T", name: "T", category: "TV_MOUNT", required_skill: "TV_MOUNT", base_price_cents: 12000, estimated_minutes: 60, warranty_days: 30 }
              as: PlatformAdmin
              captures: { task_id: $.data.id }
            - call: "POST /work-orders"
              payload: { retailer_id: "${ret_id}", customer_id: "${cust_id}", install_task_id: "${task_id}", service_zone_id: "${zone_id}", product_sku: "S", product_category: "TV_MOUNT" }
              as: Retailer
              as_user_id: "${ret_id}"
              captures: { wo_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T10:00:00Z" }
              as: Retailer
              as_user_id: "${ret_id}"
              captures: { v2: $.data.version }
          assert:
            - "WorkOrder.${wo_id}.version == 2 (was 1 at create)"

