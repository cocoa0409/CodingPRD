          assert:
            - "err == ERR_DISTRIBUTION_INVALID   # batch not READY surfaces as distribution invalid per §1.4 priority 10"
            - "DailiesPackage.${pkg_id}.status == DRAFT"

      - name: asset_conform_requires_turnover_staged
        grounds:
          - state_machines.MediaAsset.VERIFIED_to_CONFORMED
          - state_machines.TurnoverPackage
        distinguishing_aspect: |
          MediaAsset conform transition is gated on the existence of a
          TurnoverPackage in {STAGED, ISSUED} with turnover_kind == CONFORM
          referencing the asset (MediaAsset <-> TurnoverPackage pair — different
          from DailiesPackage <-> MediaBatch). Without a staged conform
          turnover, conform is rejected.
        test_recipe:
          setup:
            - "Project P ACTIVE; Asset A1 VERIFIED; no TurnoverPackage exists for the project"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FacilityAdmin
            - call: "POST /post-production/projects"
              payload: { title: "PA", client_code: "CL014", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 100, security_tier: "STANDARD" }
              as: PostSupervisor
              captures: { proj_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles"
              payload: { profile_name: "wm", opacity_pct: 80, position: "CENTER", includes_recipient_email: true, forensic_enabled: true }
              as: PostSupervisor
              captures: { wm_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles/${wm_id}/activate"
              payload: {}
              as: PostSupervisor
