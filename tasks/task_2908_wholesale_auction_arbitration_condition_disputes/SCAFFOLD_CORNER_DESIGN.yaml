            - call: "POST /arbitration/policies"
              payload: { defect_class: "MECHANICAL", window_hours: 48, mileage_limit: 250, min_claim_amount_cents: 60000, requires_third_party_verification: false, max_allowance_bps: 2000, psi_extension_hours: 96, psi_clean_waives_rights: true }
              as: AuctionAdmin
              as_user_id: "admin-01"
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE12345", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 1450000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 84000, light_channel: "GREEN", title_status: "CLEAN" }
