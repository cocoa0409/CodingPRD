          - validations[priority=19]
          - state_machines.SplicePoint.transitions.PLACED_to_VOIDED
        distinguishing_aspect: "Voiding the only splice point drops the PLACED population to zero, so submit-for-review fails even though the package still has a splice_point history; placing a fresh point restores the submit."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Harbor Loop' SCOPE_LOCKED with one walked RouteSegment (400 feet, URBAN_PAVED)"
            - "one DesignPackage revision 1 in DRAFT (288 / 48) whose single HANDHOLE splice point at station 0 has been VOIDED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Dock Street", municipality_code: "MUN-014", length_feet: 400, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-20" }
