              as: FrontDesk
              captures: { bk: $.data.id }
            - call: "POST /bookings/${bk}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-12T10:30:00Z" }
              as: StudioManager
            - call: "POST /bookings/${bk}/complete"
              payload: {}
              as: Flexologist
              as_user_id: "${flex}"
          trigger:
            - call: "POST /bookings/${bk}/cancel"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Booking.${bk}.schedule_status == COMPLETED"

      - name: complete_before_session_start_invalid_state
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Booking.schedule_status.CONFIRMED_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Completing a CONFIRMED booking while clock < session_start_utc violates the precondition and returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A CONFIRMED booking with session_start in the future; clock left before start."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: StudioManager
            - call: "POST /locations"
              payload: { name: "Cb", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: StudioManager
              captures: { loc: $.data.id }
            - call: "POST /flexologists"
