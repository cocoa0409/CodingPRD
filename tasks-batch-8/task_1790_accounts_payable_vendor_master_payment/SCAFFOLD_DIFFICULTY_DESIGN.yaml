          - state_machines.Vendor.SUSPENDED_to_ACTIVE
          - entities.Invoice.fields.pre_hold_status
        distinguishing_aspect: |
          Conserved quantity = the vendor's actionable-invoice multiset (statuses over
          {PENDING_APPROVAL, APPROVED}): suspend parks them in ON_HOLD with pre_hold_status, reinstate
          restores the exact multiset {PENDING_APPROVAL: 1, APPROVED: 1} — no drift, and the
          RECEIVED invoice outside the hold set is untouched by the round trip.
        test_recipe:
          setup:
            - "Vendor with inv1 PENDING_APPROVAL, inv2 APPROVED, inv3 RECEIVED (never submitted)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - { call: "POST /approval-matrix-rules", payload: { cost_center: "GLOBAL", min_amount_cents: 0, max_amount_cents: 500000, tier: 1 }, as: Controller, as_user_id: "u-ctl-01" }
            - call: "POST /vendors"
              payload: { legal_name: "Hold Pattern", tax_id: "10-0000015", remit_email: "ap@hp.com", phone: "+1-555-1700", address_line1: "21 Hickory St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { v_id: $.data.id }
            - { call: "POST /vendors/${v_id}/documents", payload: { doc_type: "W9", valid_from: "2026-01-01", valid_until: "2027-12-31" }, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/submit", payload: {}, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/approve", payload: {}, as: VendorManager, as_user_id: "u-vm-01" }
            - call: "POST /invoices"
              payload: { vendor_id: "${v_id}", invoice_number: "INV-9201", amount_cents: 100000, cost_center: "CC-100", received_date: "2026-06-01" }
              as: APClerk
              as_user_id: "u-ap-01"
              captures: { inv1: $.data.id }
            - { call: "POST /invoices/${inv1}/submit", payload: {}, as: APClerk, as_user_id: "u-ap-01" }
            - call: "POST /invoices"
              payload: { vendor_id: "${v_id}", invoice_number: "INV-9202", amount_cents: 200000, cost_center: "CC-100", received_date: "2026-06-01" }
              as: APClerk
              as_user_id: "u-ap-01"
              captures: { inv2: $.data.id }
            - { call: "POST /invoices/${inv2}/submit", payload: {}, as: APClerk, as_user_id: "u-ap-01" }
            - { call: "POST /invoices/${inv2}/approve", payload: { tier: 1 }, as: APSupervisor, as_user_id: "u-sup-01" }
            - call: "POST /invoices"
              payload: { vendor_id: "${v_id}", invoice_number: "INV-9203", amount_cents: 300000, cost_center: "CC-100", received_date: "2026-06-01" }
              as: APClerk
              as_user_id: "u-ap-01"
              captures: { inv3: $.data.id }
          trigger:
            - { call: "POST /vendors/${v_id}/suspend", payload: { reason: "audit hold" }, as: VendorManager, as_user_id: "u-vm-01" }
            - { call: "POST /vendors/${v_id}/reinstate", payload: {}, as: VendorManager, as_user_id: "u-vm-01" }
          assert:
            - "Mid-pair: inv1 ON_HOLD (pre_hold_status PENDING_APPROVAL), inv2 ON_HOLD (pre_hold_status APPROVED), inv3 still RECEIVED"
            - "Post-pair: inv1 PENDING_APPROVAL and inv2 APPROVED with pre_hold_status == null — actionable multiset identical to pre-suspend"
            - "inv3 == RECEIVED throughout; Vendor.${v_id}.status == ACTIVE"
            - "inv1's approval_round and required_tier unchanged by the hold round-trip"
