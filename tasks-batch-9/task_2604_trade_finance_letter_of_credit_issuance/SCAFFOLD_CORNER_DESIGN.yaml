      - name: settlement_variant_selection_acceptance_then_reimbursement_reuse
        claim_type: variant_selection
        grounds:
          - calculations.settlement_proceeds.variants.ACCEPTANCE_AT_MATURITY
          - calculations.settlement_proceeds.variants.SIGHT_HONOUR
          - calculations.credit_allocation_exposure.constants.TENOR_RISK_BPS_PER_MONTH
          - endpoints.POST_/settlement-claims/{id}/settle
        distinguishing_aspect: |
          The variant is selected by claim_type, not by the credit's available_by.
          On an ACCEPTANCE credit an ACCEPTANCE claim picks
          ACCEPTANCE_AT_MATURITY: 20 bps commission and a discount computed over
          the 83 days from 2026-09-21 to the maturity_date 2026-12-13, leaving the
          amount RESERVED rather than drawn (settlement_status ACCEPTED, not
          PAID). The same credit's tenor also feeds the exposure: tenor_days 90
          gives tenor_months 3 and a 75000 add-on, so gross_exposure_cents is
          10075000 not 10000000. An implementation that keys the variant off
          available_by, or that treats acceptance as a draw-down, gets the
          reserved/drawn split wrong.
