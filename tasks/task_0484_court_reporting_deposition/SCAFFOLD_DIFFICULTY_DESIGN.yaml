  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: transcript_order_requires_job_adjourned
        grounds:
          - validations[priority=14]
          - entities.Job.fields.status
          - entities.TranscriptOrder.fields.job_id
          - errors[ERR_JOB_NOT_ADJOURNED]
        distinguishing_aspect: |
          TranscriptOrder creation (TranscriptOrder entity) is gated by the parent Job's
          status: only an ADJOURNED job admits a transcript order; a CONFIRMED job rejects with
          ERR_JOB_NOT_ADJOURNED. The dependency crosses the TranscriptOrder->Job pair.
        test_recipe:
          setup:
            - "A CONFIRMED (not adjourned) job exists; a transcript order against it is attempted."
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "A Thirteen", firm_name: "Th13 LLP", bar_state: "CA", email: "a13@x.com" }
              as: ScheduleCoordinator
