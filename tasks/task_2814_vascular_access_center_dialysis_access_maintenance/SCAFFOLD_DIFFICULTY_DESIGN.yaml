      - name: sedation_credential_422_outranks_room_occupancy_409_on_the_same_slot
        grounds:
          - validations.priority_10_ERR_SEDATION_CREDENTIAL_INVALID
          - validations.priority_18_ERR_ROOM_OCCUPIED
          - entities.ProcedureRoom.fields.turnover_buffer_min
          - entities.Clinician.fields.credential_expires_on
        distinguishing_aspect: |
          The same 14:15-15:15 slot is requested twice against a room already busy 13:00-14:00 with
          a 30-minute turnover buffer. With the lapsed RN the answer is the 422
          ERR_SEDATION_CREDENTIAL_INVALID (business_safety, priority 10); with the credentialed RN
          the answer is the 409 ERR_ROOM_OCCUPIED (business_temporal, priority 18). A third call at
          exactly 14:30 - the first legal instant, existing.scheduled_end + turnover_buffer_min -
          succeeds, so the buffer boundary is pinned in the same test. This is a safety-over-
          temporal pair, distinct from the state-over-safety and referential-over-fiscal pairs.
