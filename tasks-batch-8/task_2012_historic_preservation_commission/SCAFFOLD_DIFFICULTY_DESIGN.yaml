  - rule_id: cross_entity_state_dependency
    instances:
      - name: district_review_freezes_intake
        grounds:
          - validations[priority=7]
          - state_machines.HistoricDistrict.ACTIVE_to_BOUNDARY_REVIEW
        distinguishing_aspect: |
          Entity pair Application -> HistoricDistrict: submission validity
          depends on the district's status field; flipping the district to
          BOUNDARY_REVIEW blocks intake with ERR_DISTRICT_UNDER_REVIEW and
          flipping back re-enables it. The companion instance crosses a
          different pair (Violation -> Application).
        test_recipe:
          setup:
            - "District initially ACTIVE with one inventoried property"
          setup_api_calls:
            - call: "POST /preservation/districts"
              payload: { name: "Old Town", boundary_description: "Blocks 1-9", significance_tier: "LOCAL" }
              as: PreservationStaff
              captures: { d_id: $.data.id }
            - call: "POST /preservation/owners"
              payload: { full_name: "Mike Owner", email: "mike@x.com", mailing_address: "13 Main St" }
              as: PreservationStaff
              captures: { o_id: $.data.id }
            - call: "POST /preservation/properties"
              payload: { address: "2 Maple", parcel_number: "P-1100", district_id: "${d_id}", owner_id: "${o_id}", contributing_status: "NON_CONTRIBUTING", construction_year: 1970, assessed_value_cents: 4500000 }
              as: PreservationStaff
              captures: { p_id: $.data.id }
            - call: "PATCH /preservation/districts/${d_id}"
              payload: { status: "BOUNDARY_REVIEW" }
              as: PreservationStaff
          trigger:
            - call: "POST /preservation/applications"
              payload: { property_id: "${p_id}", owner_id: "${o_id}", application_type: "ALTERATION", is_visible_from_public_way: false, after_the_fact: false, work_items: [{ category: "SITE_WORK", description: "fence", estimated_cost_cents: 50000 }] }
              as: Applicant
              as_user_id: "${o_id}"
              captures: { err: $.data.error_id }
            - call: "PATCH /preservation/districts/${d_id}"
              payload: { status: "ACTIVE" }
              as: PreservationStaff
            - call: "POST /preservation/applications"
              payload: { property_id: "${p_id}", owner_id: "${o_id}", application_type: "ALTERATION", is_visible_from_public_way: false, after_the_fact: false, work_items: [{ category: "SITE_WORK", description: "fence", estimated_cost_cents: 50000 }] }
              as: Applicant
              as_user_id: "${o_id}"
              captures: { app_id: $.data.id }
          assert:
            - "first submission rejected with ERR_DISTRICT_UNDER_REVIEW while district is BOUNDARY_REVIEW"
            - "identical submission succeeds (201, Application.${app_id} created) once district returns to ACTIVE"

      - name: violation_blocked_by_unapproved_after_the_fact
        grounds:
