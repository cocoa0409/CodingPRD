        distinguishing_aspect: "EXPLICIT mode admits no remainder: 5500 + 5000 = 10500 against an 11000-cent tender leaves 500 cents unaccounted for, and because EXPLICIT never parks a residual in credit_balance_cents the whole payment is refused with 422 rather than partially applied."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; two systems permitted at one premises produce two UNPAID 5500-cent invoices, and the site version is read immediately before the tender."
          setup_api_calls:
