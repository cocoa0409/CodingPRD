            - { call: "POST /guardians/${g}/children", payload: { full_name: "Kid A", birth_date: "2020-01-15" }, as: Guardian, as_user_id: "${g}", captures: { c1: $.data.id } }
            - { call: "POST /guardians/${g}/waivers", payload: { expected_guardian_version: "${g_ver}" }, as: Guardian, as_user_id: "${g}", captures: { w: $.data.id } }
            - { call: "POST /visits", payload: { session_slot_id: "${s1}", child_id: "${c1}", guardian_id: "${g}", visit_type: "RESERVATION", booked_duration_minutes: 60 }, as: Guardian, as_user_id: "${g}", captures: { v1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-06-10T13:55:00Z" }, as: Admin }
            - { call: "POST /session-slots/${s1}/open", payload: {}, as: Manager, as_user_id: "${mgr}" }
            - { call: "POST /ops-runs", payload: {}, as: Admin }
          trigger:
            - { call: "POST /visits/${v1}/check-in", payload: { sock_method: "OWN_GRIP_SOCKS" }, as: FrontDesk, as_user_id: "${fd}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_WAIVER_INVALID driven purely by the Waiver entity's EXPIRED state"
            - "Visit.${v1}.admission_status remains RESERVED"
            - "Waiver.${w}.status == EXPIRED"

      - name: party_confirm_gated_by_room_state
        grounds:
          - state_machines.PartyBooking.HELD_to_CONFIRMED
          - errors[ERR_ROOM_INACTIVE]
        distinguishing_aspect: |
          Entity pair PartyBooking -> PartyRoom (different pair from
          Visit -> Waiver): confirm is rejected while the room is MAINTENANCE
          even though the booking itself is in the correct HELD state.
        test_recipe:
          setup:
            - "HELD booking on room r1 (weekday, 10 children); room patched to MAINTENANCE"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: Admin }
            - { call: "POST /party-packages", payload: { name: "STD", duration_minutes: 120, base_price_cents: 30000, included_children: 10, extra_child_price_cents: 1500, cafe_credit_cents: 2000 }, as: Admin, captures: { pkg: $.data.id } }
            - { call: "POST /party-rooms", payload: { name: "Room A", capacity_children: 20 }, as: Admin, captures: { r1: $.data.id, r_ver: $.data.version } }
            - { call: "POST /guardians", payload: { full_name: "G R", email: "gr@x.com", phone: "505" }, as: Anonymous, captures: { g: $.data.id } }
            - { call: "POST /party-bookings", payload: { party_room_id: "${r1}", party_package_id: "${pkg}", guardian_id: "${g}", start_at: "2026-06-08T10:00:00Z", child_count: 10, expected_party_room_version: "${r_ver}" }, as: Guardian, as_user_id: "${g}", captures: { pb: $.data.id } }
            - { call: "PATCH /party-rooms/${r1}", payload: { status: "MAINTENANCE" }, as: Admin }
          trigger:
            - { call: "POST /party-bookings/${pb}/confirm", payload: {}, as: Guardian, as_user_id: "${g}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ROOM_INACTIVE (PartyRoom.status gates the PartyBooking transition)"
            - "PartyBooking.${pb}.status remains HELD and deposit_paid == false"

  - rule_id: resource_temporal_overlap
    instances:
