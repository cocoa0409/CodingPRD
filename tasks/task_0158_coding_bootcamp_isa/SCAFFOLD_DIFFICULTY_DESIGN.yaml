              payload: { enrollment_id: "${e5}", session_date: "2026-02-02T00:00:00Z", present: false, cumulative_progress_pct: 20 }
              as: AdmissionsOfficer
            - call: "POST /enrollments/${e5}/dismiss"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /enrollments/${e6}/withdraw"
              payload: { refund_reason: "WITHDRAWAL" }
              as: AdmissionsOfficer
            - call: "POST /enrollments/${e1}/graduate"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /enrollments/${e2}/graduate"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /enrollments/${e3}/graduate"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /enrollments/${e4}/graduate"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /placement-outcomes"
              payload: { enrollment_id: "${e1}", category: "EMPLOYED_IN_FIELD", reported_at: "2026-06-01T00:00:00Z", annual_salary_cents: 9000000, placement_days: 30 }
              as: ComplianceOfficer
            - call: "POST /placement-outcomes"
              payload: { enrollment_id: "${e2}", category: "EMPLOYED_OUT_OF_FIELD", reported_at: "2026-06-01T00:00:00Z", annual_salary_cents: 7000000, placement_days: 90 }
              as: ComplianceOfficer
            - call: "POST /placement-outcomes"
              payload: { enrollment_id: "${e3}", category: "SELF_EMPLOYED", reported_at: "2026-06-01T00:00:00Z", placement_days: 120 }
              as: ComplianceOfficer
            - call: "POST /placement-outcomes"
              payload: { enrollment_id: "${e4}", category: "STILL_SEEKING", reported_at: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts/${coh}/graduate"
              payload: {}
              as: AdmissionsOfficer
          trigger:
            - call: "POST /cirr-reports"
              payload: { cohort_id: "${coh}", denominator_basis: "GRADUATES_ONLY" }
              as: ComplianceOfficer
              captures: { rep_g: $.data.id, rate_g: $.data.placement_rate }
            - call: "POST /cirr-reports"
              payload: { cohort_id: "${coh}", denominator_basis: "ALL_ENROLLED" }
              as: ComplianceOfficer
              captures: { rep_a: $.data.id, rate_a: $.data.placement_rate }
          assert:
            - "CIRRReport.${rep_g}.placed_count == 3"
            - "CIRRReport.${rep_g}.graduates_count == 4"
            - "CIRRReport.${rep_g}.placement_rate == 0.75"
            - "CIRRReport.${rep_a}.enrolled_count == 6"
            - "CIRRReport.${rep_a}.placement_rate == 0.5"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: monthly_payment_min_share_cap_with_threshold_branch
        grounds:
          - calculations.monthly_payment_amount
          - entities.IncomeReport.fields.obligation_cents
          - entities.Payment.fields.amount_cents
        distinguishing_aspect: |
          Mode (a): obligation = min(round_half_up(gross*0.17), remaining_cap) gated by a threshold branch;
          gross 600000 over 24-month/3000000-cap contract yields obligation_cents=102000 (3 inputs, nested min + branch).
        test_recipe:
          setup:
            - "ACTIVE ISAContract pct=0.17 cap=3000000 term=24 threshold=400000, fresh ledger (remaining_cap_cents=3000000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts"
              payload: { name: "FS M", track: "FULLSTACK", capacity: 5, tuition_sticker_cents: 1500000, start_date: "2026-02-01T00:00:00Z", end_date: "2026-05-01T00:00:00Z", cirr_period_label: "H1-2026" }
              as: AdmissionsOfficer
              captures: { coh: $.data.id }
            - call: "POST /cohorts/${coh}/open"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /applicants"
              payload: { cohort_id: "${coh}", full_name: "Mae", email: "mae@x.com", reported_prior_income_cents: 0 }
              as: AdmissionsOfficer
              captures: { app: $.data.id }
            - call: "POST /applicants/${app}/admit"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /enrollments"
              payload: { applicant_id: "${app}", financing_choice: "ISA", deposit_amount_cents: 200000, isa_income_share_pct: 0.17, isa_cap_cents: 3000000, isa_term_months: 24, isa_income_threshold_cents: 400000 }
              as: AdmissionsOfficer
              captures: { enr: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts/${coh}/start"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr}", session_date: "2026-02-02T00:00:00Z", present: true, cumulative_progress_pct: 100 }
              as: AdmissionsOfficer
            - call: "POST /enrollments/${enr}/graduate"
              payload: {}
              as: AdmissionsOfficer
            - call: "GET /isa-contracts?enrollment_id=${enr}"
              payload: {}
              as: ServicingOfficer
              captures: { isa: "$.data[0].id" }
          trigger:
            - call: "POST /income-reports"
              payload: { isa_contract_id: "${isa}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", gross_income_cents: 600000, employment_status: "EMPLOYED" }
              as: ServicingOfficer
              captures: { ir: $.data.id, pay: $.data.payment_id, ob: $.data.obligation_cents }
          assert:
            - "IncomeReport.${ir}.obligation_cents == 102000"
            - "Payment.${pay}.amount_cents == 102000"
            - "Payment.${pay}.collection_status == PENDING"

      - name: refund_per_line_rounding_order_pinned
        grounds:
          - calculations.refund_amount
          - entities.RefundRequest.fields.gross_refund_cents
          - entities.RefundRequest.fields.net_refund_cents
          - state_machines.RefundRequest.PENDING_to_APPROVED
        distinguishing_aspect: |
          Mode (b): deposit_line (180000) and tuition_line (450000) are each round_half_up independently
          THEN summed to gross 630000 (round-per-line then sum), net 598500 after 5% admin fee — distinct from monthly_payment's mode (a).
        test_recipe:
          setup:
            - "WITHDRAWN enrollment, progress_pct=40, deposit 200000 HELD, cohort tuition_sticker_cents=1500000, RefundRequest PENDING reason=WITHDRAWAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts"
              payload: { name: "FS R", track: "FULLSTACK", capacity: 5, tuition_sticker_cents: 1500000, start_date: "2026-02-01T00:00:00Z", end_date: "2026-05-01T00:00:00Z", cirr_period_label: "H1-2026" }
              as: AdmissionsOfficer
              captures: { coh: $.data.id }
            - call: "POST /cohorts/${coh}/open"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /applicants"
              payload: { cohort_id: "${coh}", full_name: "Rob", email: "rob@x.com", reported_prior_income_cents: 0 }
              as: AdmissionsOfficer
              captures: { app: $.data.id }
            - call: "POST /applicants/${app}/admit"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /enrollments"
              payload: { applicant_id: "${app}", financing_choice: "UPFRONT", deposit_amount_cents: 200000 }
              as: AdmissionsOfficer
              captures: { enr: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts/${coh}/start"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr}", session_date: "2026-02-10T00:00:00Z", present: true, cumulative_progress_pct: 40 }
              as: AdmissionsOfficer
            - call: "POST /enrollments/${enr}/withdraw"
              payload: { refund_reason: "WITHDRAWAL" }
              as: AdmissionsOfficer
            - call: "GET /refund-requests?enrollment_id=${enr}"
              payload: {}
              as: ComplianceOfficer
              captures: { rr: "$.data[0].id" }
          trigger:
            - call: "POST /refund-requests/${rr}/approve"
              payload: {}
              as: ComplianceOfficer
              captures: { gross: $.data.gross_refund_cents, net: $.data.net_refund_cents }
          assert:
            - "RefundRequest.${rr}.gross_refund_cents == 630000"
            - "RefundRequest.${rr}.net_refund_cents == 598500"
            - "RefundRequest.${rr}.status == APPROVED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: isa_active_deferred_active_cycle
        grounds:
          - state_machines.ISAContract.ACTIVE_to_DEFERRED
          - state_machines.ISAContract.DEFERRED_to_ACTIVE
          - state_machines.DefermentRequest.APPROVED_to_ENDED
        distinguishing_aspect: |
          Cyclic on ISAContract: ACTIVE -> DEFERRED (deferment approve) -> ACTIVE (deferment end) returns to a
          previously-occupied state, a true cycle (not a linear pipeline).
        test_recipe:
          setup:
            - "ACTIVE ISAContract with a latest UNEMPLOYED income report, eligible for UNEMPLOYMENT deferment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts"
              payload: { name: "FS Cyc", track: "DATA", capacity: 5, tuition_sticker_cents: 1500000, start_date: "2026-02-01T00:00:00Z", end_date: "2026-05-01T00:00:00Z", cirr_period_label: "H1-2026" }
              as: AdmissionsOfficer
              captures: { coh: $.data.id }
            - call: "POST /cohorts/${coh}/open"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /applicants"
              payload: { cohort_id: "${coh}", full_name: "Cy", email: "cy@x.com", reported_prior_income_cents: 0 }
              as: AdmissionsOfficer
              captures: { app: $.data.id }
            - call: "POST /applicants/${app}/admit"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /enrollments"
              payload: { applicant_id: "${app}", financing_choice: "ISA", deposit_amount_cents: 200000, isa_income_share_pct: 0.17, isa_cap_cents: 3000000, isa_term_months: 24, isa_income_threshold_cents: 400000 }
              as: AdmissionsOfficer
              captures: { enr: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts/${coh}/start"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr}", session_date: "2026-02-02T00:00:00Z", present: true, cumulative_progress_pct: 100 }
              as: AdmissionsOfficer
            - call: "POST /enrollments/${enr}/graduate"
              payload: {}
              as: AdmissionsOfficer
            - call: "GET /isa-contracts?enrollment_id=${enr}"
              payload: {}
              as: ServicingOfficer
              captures: { isa: "$.data[0].id" }
            - call: "POST /income-reports"
              payload: { isa_contract_id: "${isa}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", gross_income_cents: 0, employment_status: "UNEMPLOYED" }
              as: ServicingOfficer
            - call: "POST /deferment-requests"
              payload: { isa_contract_id: "${isa}", reason: "UNEMPLOYMENT", period_start: "2026-07-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z" }
              as: ServicingOfficer
              captures: { dr: $.data.id }
            - call: "POST /deferment-requests/${dr}/approve"
              payload: {}
              as: ServicingOfficer
          trigger:
            - call: "GET /isa-contracts/${isa}"
              payload: {}
              as: ServicingOfficer
              captures: { st_def: $.data.status }
            - call: "POST /deferment-requests/${dr}/end"
              payload: {}
              as: ServicingOfficer
            - call: "GET /isa-contracts/${isa}"
              payload: {}
              as: ServicingOfficer
              captures: { st_active: $.data.status }
          assert:
            - "ISAContract.${isa}.status == ACTIVE (final, after the DEFERRED->ACTIVE return leg)"
            - "DefermentRequest.${dr}.status == ENDED"

      - name: enrollment_active_branches_to_divergent_terminals
        grounds:
          - state_machines.Enrollment.ACTIVE_to_GRADUATED
          - state_machines.Enrollment.ACTIVE_to_DISMISSED
          - state_machines.Enrollment.ACTIVE_to_WITHDRAWN
        distinguishing_aspect: |
          Branching fork on Enrollment (different entity than ISAContract): ACTIVE forks to GRADUATED vs DISMISSED
          with divergent side-effects (graduate activates ISA & keeps the seat; dismiss forfeits deposit & releases the seat).
        test_recipe:
          setup:
            - "Two ACTIVE ISA enrollments e_grad (progress 100) and e_dis (attendance<50) in the same RUNNING cohort, each with a PENDING ISAContract and HELD deposit; cohort capacity 5 so seats_committed=2 before branching."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
