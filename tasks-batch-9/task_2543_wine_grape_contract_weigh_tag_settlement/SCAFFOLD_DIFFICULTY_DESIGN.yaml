  # ===========================================================================
  # RULE 2 — combinatorial formulas (two different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: settlement_line_nested_rounding_per_ton_then_tons
        mode: b
        grounds:
          - calculations.settlement_line_amount
          - calculations.quality_adjustment_pct
          - entities.SettlementLine.fields.price_per_ton_cents
          - entities.SettlementLine.fields.final_amount_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the quality-adjusted price per ton is rounded to whole cents
          BEFORE it is multiplied by the net tonnage. With base 450001 cents and a clamped
          +8.0 pp adjustment the intermediate is 486001.08, which rounds to 486001 and yields
          486001 * 22 = 10692022 cents; collapsing the two steps into one expression gives
          10692023.76 -> 10692024, a 2-cent error that only a nested-rounding implementation avoids.
        test_recipe:
          setup:
            - "One producer, one block, the reference QualitySpec, one lane, one crew."
            - "One ACTIVE TONNAGE contract with base_price_per_ton_cents 450001 (deliberately not a round number) and committed_tons 22.000."
            - "One load weighing gross 61240 lbs / tare 17240 lbs = 22.000 net tons, graded at Brix 28.0 so the raw adjustment +12.0 pp clamps to +8.0 pp."
