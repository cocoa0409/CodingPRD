          rationale: "ERR_QUOTE_EXPIRED trigger and EXPIRED transition asserted there; boundary variant in quote_expiry_boundary_exact_second."

      - name: error_credit_limit_excluded_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_CREDIT_LIMIT_EXCEEDED]"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / quote_approve_credit_limit_equality_boundary"
          rationale: "Over-limit rejection and equality acceptance asserted there."

      - name: error_window_full_excluded_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_WINDOW_FULL]"]
        excluded_because:
