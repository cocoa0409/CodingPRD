  - rule_id: transitive_cascade
    instances:
      - name: stolen_report_four_link_cascade
        grounds:
          - state_machines.CampusCard.ACTIVE_to_STOLEN_FROZEN
          - calculations.fraud_strike_escalation
          - state_machines.CardHolder.ACTIVE_to_SUSPENDED
          - state_machines.DecliningBalanceAccount.OPEN_to_FROZEN
          - state_machines.AccessGrant.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Depth-4 chain originating at report-stolen: card freeze (1) increments holder strikes
          (2); the threshold breach suspends the holder (3); the suspension freezes accounts and
          deactivates the remaining cards, revoking their grants (4) — each link caused by the
          previous one, and the trigger differs from the term-close cascade instance.
        test_recipe:
          setup:
            - "Holder U5001 with fraud_strike_count == 2 (two prior stolen reports, each followed by a police-reported replacement)"
            - "Third card c3 ACTIVE (provisional); CAMPUS_CASH account OPEN with 5000; one ACTIVE AccessGrant g on c3"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/card-holders"
