            - call: "POST /shell-tests"
              payload: { equipment_unit_id: "${u1_id}", test_bench_id: "${bench_id}", window_start: "2026-08-06T09:00:00Z", window_end: "2026-08-06T10:00:00Z", conditioning: "AMBIENT" }
              as: Technician
              as_user_id: "tech-1"
              captures: { t1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T09:00:00Z" }
