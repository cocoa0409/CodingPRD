              captures: { l1: $.data.id }
            - call: "GET /repair-orders/${ro1}"
              payload: {}
              as: ShopManager
              captures: { ro1_ver7: $.data.version }
            - call: "POST /repair-orders/${ro1}/authorize"
              payload: { expected_repair_order_version: "${ro1_ver7}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /repair-orders/${ro1}/schedule"
              payload: { bay_id: "${bay1}", scheduled_start: "2026-06-08T08:00:00Z", scheduled_end: "2026-06-08T12:00:00Z" }
              as: ShopManager
            - call: "POST /repair-orders/${ro1}/transition"
              payload: { action: "START" }
