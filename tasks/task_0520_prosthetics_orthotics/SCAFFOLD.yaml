# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Prescription
    initial_state: DRAFT
    terminal_states: [EXPIRED, VOIDED, CONSUMED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /op/prescriptions/{id}/sign"
        actor: Physician
        preconditions:
          - "acting Physician.id == Prescription.physician_id"
          - "primary_diagnosis_code present and face_to_face_date present"
        side_effects:
          - "stamp updated_at; increment Prescription.version by 1"
      - from: SIGNED
        to: CONSUMED
        trigger: "system: a DeviceOrder created against this Prescription"
        actor: system
        preconditions:
          - "Prescription.status == SIGNED"
          - "logical clock <= face_to_face_date + 6 months (Rx validity window)"
        side_effects:
          - "increment Prescription.version by 1"
      - from: SIGNED
        to: EXPIRED
        trigger: "system: order creation attempted after Rx validity window OR audit sweep past window"
        actor: system
        preconditions:
          - "logical clock > face_to_face_date + 6 months"
        side_effects:
          - "increment Prescription.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /op/prescriptions/{id}/void"
        actor: Physician
        preconditions:
          - "acting Physician.id == Prescription.physician_id"
        side_effects:
          - "increment Prescription.version by 1"

  - entity: DeviceOrder
    initial_state: INTAKE
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: INTAKE
        to: AUTH_PENDING
        trigger: "POST /op/device-orders/{id}/submit-auth"
        actor: BillingSpecialist
        preconditions:
          - "DeviceOrder.requires_prior_auth == true"
          - "DeviceOrder.status == INTAKE"
          - "no non-terminal PriorAuth (status IN {SUBMITTED,PENDED,APPROVED}) exists for the order (single-active-auth)"
        side_effects:
          - "create PriorAuth in SUBMITTED with decision_deadline = clock + 14 days (CASCADE: order INTAKE->AUTH_PENDING triggers PriorAuth creation)"
          - "increment DeviceOrder.version by 1"
      - from: INTAKE
        to: FABRICATION
        trigger: "POST /op/device-orders/{id}/start-fabrication"
        actor: Practitioner
        preconditions:
          - "DeviceOrder.requires_prior_auth == false"
          - "at least one FabricationMilestone exists for the order"
        side_effects:
          - "increment DeviceOrder.version by 1"
      - from: AUTH_PENDING
        to: FABRICATION
        trigger: "system: covering PriorAuth transitions to APPROVED"
        actor: system
        preconditions:
          - "PriorAuth.status == APPROVED"
          - "at least one FabricationMilestone exists for the order"
        side_effects:
          - "CASCADE: PriorAuth APPROVED bubbles up, moving DeviceOrder AUTH_PENDING->FABRICATION; increment DeviceOrder.version by 1"
      - from: FABRICATION
        to: READY_FOR_FITTING
        trigger: "system: final FabricationMilestone marked complete (milestone_progress_pct reaches 100)"
        actor: system
        preconditions:
          - "every FabricationMilestone for the order has completed == true"
        side_effects:
          - "CASCADE: last milestone completion bubbles up DeviceOrder FABRICATION->READY_FOR_FITTING; recompute milestone_progress_pct=100; increment DeviceOrder.version by 1"
      - from: READY_FOR_FITTING
        to: DELIVERED
        trigger: "POST /op/device-orders/{id}/deliver"
        actor: Practitioner
        preconditions:
          - "expected_device_order_version matches current version"
          - "ComplianceCheck for the order passes (dmepos_compliance_gate)"
          - "fitting_practitioner_id != Prescription.physician_id (segregation of duties)"
        side_effects:
          - "create ComplianceCheck record (append-only)"
          - "stamp delivery_date = logical clock; compute warranty_expiry (calc warranty_window)"
          - "CASCADE: Prescription SIGNED->CONSUMED was already done at order creation; mark all ClaimLine DRAFT->SUBMITTED"
          - "increment DeviceOrder.version by 1"
      - from: INTAKE
        to: CANCELLED
        trigger: "POST /op/device-orders/{id}/cancel"
        actor: BillingSpecialist
        preconditions:
          - "DeviceOrder.status in {INTAKE, AUTH_PENDING}"
        side_effects:
          - "CASCADE: if a PriorAuth exists in {SUBMITTED, PENDED}, set it to DENIED; increment DeviceOrder.version by 1"
      - from: AUTH_PENDING
        to: CANCELLED
        trigger: "POST /op/device-orders/{id}/cancel"
        actor: BillingSpecialist
        preconditions:
          - "DeviceOrder.status in {INTAKE, AUTH_PENDING}"
        side_effects:
          - "CASCADE: covering PriorAuth in {SUBMITTED, PENDED} set to DENIED; increment DeviceOrder.version by 1"

  - entity: PriorAuth
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: PENDED
        trigger: "POST /op/prior-auths/{id}/pend"
        actor: ComplianceOfficer
        preconditions:
          - "PriorAuth.status == SUBMITTED"
        side_effects:
          - "increment PriorAuth.version by 1"
      - from: PENDED
        to: SUBMITTED
        trigger: "POST /op/prior-auths/{id}/resubmit"
        actor: BillingSpecialist
        preconditions:
          - "PriorAuth.status == PENDED"
          - "expected_prior_auth_version matches current version"
        side_effects:
          - "increment submission_round by 1; reset decision_deadline = clock + 14 days (CYCLE: PENDED->SUBMITTED revision loop); increment PriorAuth.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /op/prior-auths/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "PriorAuth.status == SUBMITTED"
          - "covering DeviceOrder Supplier.accreditation_status == ACCREDITED"
        side_effects:
          - "stamp auth_number; CASCADE: bubble up DeviceOrder AUTH_PENDING->FABRICATION (if milestones exist); increment PriorAuth.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /op/prior-auths/{id}/deny"
        actor: ComplianceOfficer
        preconditions:
          - "PriorAuth.status == SUBMITTED"
        side_effects:
          - "increment PriorAuth.version by 1"
      - from: SUBMITTED
        to: EXPIRED
        trigger: "system: logical clock advances past decision_deadline (POST /op/_clock/set_current_utc sweep)"
        actor: system
        preconditions:
          - "PriorAuth.status in {SUBMITTED, PENDED}"
          - "logical clock > decision_deadline"
        side_effects:
          - "increment PriorAuth.version by 1"
      - from: PENDED
        to: EXPIRED
        trigger: "system: logical clock advances past decision_deadline"
        actor: system
        preconditions:
          - "PriorAuth.status in {SUBMITTED, PENDED}"
          - "logical clock > decision_deadline"
        side_effects:
          - "increment PriorAuth.version by 1"

  - entity: ClaimLine
    initial_state: DRAFT
    terminal_states: []
    note: "Two parallel dimensions: adjudication_status and appeal_status evolve independently on the same row."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "system: DeviceOrder DELIVERED (all DRAFT lines submitted)"
        actor: system
        preconditions:
          - "ClaimLine.adjudication_status == DRAFT"
          - "owning DeviceOrder.status == DELIVERED"
        side_effects:
          - "increment ClaimLine.version by 1"
      - from: SUBMITTED
        to: ADJUDICATED
        trigger: "POST /op/claim-lines/{id}/adjudicate"
        actor: BillingSpecialist
        preconditions:
          - "ClaimLine.adjudication_status == SUBMITTED"
          - "if modifier==KX then covering DeviceOrder has an APPROVED PriorAuth OR requires_prior_auth==false"
        side_effects:
          - "compute allowed_cents (calc claim_line_allowed); CASCADE: recompute DeviceOrder.allowed_total_cents (calc order_allowed_total) ledger-sync; increment ClaimLine.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /op/claim-lines/{id}/deny"
        actor: BillingSpecialist
        preconditions:
          - "ClaimLine.adjudication_status == SUBMITTED"
        side_effects:
          - "set allowed_cents=0; recompute DeviceOrder.allowed_total_cents; increment ClaimLine.version by 1"
      - from: DENIED
        to: ADJUDICATED
        trigger: "POST /op/claim-lines/{id}/appeal-decision (appeal_status dimension OVERTURNED)"
        actor: ComplianceOfficer
        preconditions:
          - "ClaimLine.adjudication_status == DENIED"
          - "ClaimLine.appeal_status == APPEALED"
        side_effects:
          - "set appeal_status=APPEAL_OVERTURNED; recompute allowed_cents; CASCADE: recompute DeviceOrder.allowed_total_cents; increment ClaimLine.version by 1"

  - entity: RepairRequest
    initial_state: REPORTED
    terminal_states: [CLOSED]
    transitions:
      - from: REPORTED
        to: ASSESSED
        trigger: "POST /op/repair-requests/{id}/assess"
        actor: Practitioner
        preconditions:
          - "RepairRequest.status == REPORTED"
        side_effects:
          - "compute warranty_applies and cost_cents (calc repair_cost); increment RepairRequest.version by 1"
      - from: ASSESSED
        to: REPAIRED
        trigger: "POST /op/repair-requests/{id}/complete-repair"
        actor: Practitioner
        preconditions:
          - "RepairRequest.status == ASSESSED"
        side_effects:
          - "increment RepairRequest.version by 1"
      - from: ASSESSED
        to: REPLACEMENT_AUTHORIZED
        trigger: "POST /op/repair-requests/{id}/authorize-replacement"
        actor: ComplianceOfficer
        preconditions:
          - "RepairRequest.status == ASSESSED"
          - "warranty_applies == false (replacement only outside warranty per 5-year reasonable-useful-lifetime rule)"
        side_effects:
          - "CASCADE: create a new DeviceOrder (INTAKE) cloning prescription_id/supplier_id; set RepairRequest.replaces_order_id to that new DeviceOrder.id; increment RepairRequest.version by 1"
      - from: REPAIRED
        to: CLOSED
        trigger: "POST /op/repair-requests/{id}/close"
        actor: Practitioner
        preconditions:
          - "RepairRequest.status in {REPAIRED, REPLACEMENT_AUTHORIZED}"
        side_effects:
          - "increment RepairRequest.version by 1"
      - from: REPLACEMENT_AUTHORIZED
        to: CLOSED
        trigger: "POST /op/repair-requests/{id}/close"
        actor: Practitioner
        preconditions:
          - "RepairRequest.status in {REPAIRED, REPLACEMENT_AUTHORIZED}"
        side_effects:
          - "increment RepairRequest.version by 1"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: deliver-stale-order
    parent_entity: DeviceOrder
    write_endpoint: "POST /op/device-orders/{id}/deliver"
    occ_field: "expected_device_order_version"
    description: |
      Delivering a DeviceOrder whose version has advanced since the client last
      observed it is rejected. A cascaded milestone completion or claim-line
      change can legitimately move the order forward and bump its version; a
      deliver call carrying the stale version it last read is rejected on the
      version mismatch.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

  - rule_id: resubmit-stale-prior-auth
    parent_entity: PriorAuth
    write_endpoint: "POST /op/prior-auths/{id}/resubmit"
    occ_field: "expected_prior_auth_version"
    description: |
      Resubmitting a PENDED PriorAuth whose version has advanced (e.g., a clock
      sweep advanced submission bookkeeping, or another resubmit already fired)
      is rejected when the request carries the stale version the client last read.
    error_id: ERR_STALE_AUTH_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: claim_line_allowed
    trigger: "POST /op/claim-lines/{id}/adjudicate; recomputed on appeal overturn"
    algorithm: threshold
    formula: |
      base = fee_schedule_cents * billed_units
      # Modifier adjustment (non-linear, branch on modifier AND prior-auth presence):
      if modifier == "KX":
          # KX asserts coverage criteria met; full allowance only if a covering
          # APPROVED PriorAuth exists when requires_prior_auth==true.
          allowed = base
      elif modifier == "GA":
          # GA = ABN on file, expected denial; payer pays statutory 80%.
          allowed = round_half_up(base * 0.80)
      elif modifier == "GZ":
          # GZ = no ABN, expected denial; nothing payable.
          allowed = 0
      else:  # NONE, RT, LT are laterality/neutral; no price effect
          allowed = base
      # Multi-claim ceiling applied at order level, not here.
      return allowed
    input_set: "single ClaimLine being adjudicated; modifier and fee_schedule_cents from the line, prior-auth presence from owning DeviceOrder"
    constants:
      GA_COINSURANCE_RATE: 0.80
    precision: "integer cents, round_half_up on the 0.80 multiplication"
    variants:
      - name: provisional
        when: "line is SUBMITTED but not yet ADJUDICATED (preview via GET /op/device-orders/{id}/billing-summary)"
        difference: "provisional uses billed amount (fee_schedule_cents*billed_units) with no modifier reduction; the GA 0.80 and GZ 0 reductions apply ONLY in the final ADJUDICATED variant."
      - name: final
        when: "line ADJUDICATED"
        difference: "modifier reductions (GA->80%, GZ->0) applied; this is the value written to allowed_cents."

  - name: order_allowed_total
    trigger: "system: any ClaimLine adjudication/denial/appeal recompute on the order (ledger sync)"
    algorithm: aggregation
    formula: |
      # Sum allowed_cents over lines whose adjudication_status == ADJUDICATED only.
      total = sum(cl.allowed_cents for cl in order.claim_lines
                  if cl.adjudication_status == "ADJUDICATED")
      return total
    input_set: "ClaimLines of the order with adjudication_status == ADJUDICATED; DRAFT/SUBMITTED/DENIED excluded"
    constants: {}
    precision: "integer cents, exact sum (no rounding)"
    variants:
      - name: provisional_estimate
        when: "GET /op/device-orders/{id}/billing-summary before adjudication"
        difference: "sums provisional allowed over SUBMITTED lines (billed amount, no modifier reduction); diverges from final once GA/GZ lines are adjudicated."
      - name: final_ledger
        when: "persisted allowed_total_cents field"
        difference: "sums only ADJUDICATED lines using final per-line allowed_cents."

  - name: dmepos_compliance_gate
    trigger: "POST /op/device-orders/{id}/deliver (creates ComplianceCheck)"
    algorithm: weighted_scoring
    formula: |
      reasons = []   # ordered; first-failed-first
      # Checks evaluated in this fixed order; ALL must pass for passed=true.
      if supplier.accreditation_status != "ACCREDITED":
          reasons.append("SUPPLIER_NOT_ACCREDITED")
      if not supplier.surety_bond_active:
          reasons.append("NO_SURETY_BOND")
      if patient.payer_type == "MEDICARE" and not prescribing_physician.pecos_enrolled:
          reasons.append("PHYSICIAN_NOT_PECOS")
          # patient resolved via DeviceOrder.prescription_id -> Prescription.patient_id
      if prescription.status not in {"CONSUMED"}:
          reasons.append("RX_NOT_CONSUMED")
      if order.fitting_practitioner_id == prescription.physician_id:
          reasons.append("SEGREGATION_VIOLATION")
      passed = (len(reasons) == 0)
      return {passed, failure_reasons: reasons}
    input_set: "the DeviceOrder, its Supplier, owning Prescription, prescribing Physician, fitting practitioner"
    constants: {}
    precision: "boolean aggregate; reasons list order is the check order above (deterministic)"

  - name: warranty_window
    trigger: "system: DeviceOrder READY_FOR_FITTING->DELIVERED"
    algorithm: threshold
    formula: |
      # Warranty term in months depends on device_category.
      if device_category in {"LOWER_LIMB_PROSTHETIC", "UPPER_LIMB_PROSTHETIC"}:
          months = 18
      else:  # orthoses
          months = 12
      warranty_expiry = delivery_date + months (calendar months)
      return warranty_expiry
    input_set: "DeviceOrder.delivery_date (logical clock), Prescription.device_category"
    constants:
      PROSTHETIC_WARRANTY_MONTHS: 18
      ORTHOSIS_WARRANTY_MONTHS: 12
    precision: "datetime; calendar-month addition, preserve day-of-month (clamp to month end)"

  - name: adjustment_billability
    trigger: "POST /op/device-orders/{id}/adjustments (Adjustment creation)"
    algorithm: threshold
    formula: |
      # Two free windows; billable only when BOTH are clear.
      free_fitting_cutoff = delivery_date + 90 days
      within_free_fitting = adjustment_date <= free_fitting_cutoff
      within_warranty = adjustment_date <= warranty_expiry
      billable = not (within_free_fitting or within_warranty)
      return {within_warranty, billable}
    input_set: "Adjustment.adjustment_date (logical clock), DeviceOrder.delivery_date, DeviceOrder.warranty_expiry"
    constants:
      FREE_FITTING_DAYS: 90
    precision: "boundary: '<=' is inclusive — an adjustment exactly at delivery_date+90 days is still free (non-billable)."

  - name: repair_cost
    trigger: "POST /op/repair-requests/{id}/assess"
    algorithm: threshold
    formula: |
      warranty_applies = report_date <= order.warranty_expiry
      if warranty_applies:
          cost_cents = 0
      else:
          # Out of warranty: labor flat fee plus parts.
          cost_cents = LABOR_FLAT_CENTS + parts_cents
      return {warranty_applies, cost_cents}
    input_set: "RepairRequest.created_at (report date) vs DeviceOrder.warranty_expiry; parts_cents from request body"
    constants:
      LABOR_FLAT_CENTS: 12500
    precision: "integer cents; boundary report_date == warranty_expiry is inclusive (still in warranty, cost 0)."

  - name: fabrication_progress
    trigger: "POST /op/fabrication-milestones/{id}/complete; recomputed on each milestone completion"
    algorithm: aggregation
    formula: |
      total_weight = sum(m.weight for m in order.milestones)
      done_weight  = sum(m.weight for m in order.milestones if m.completed)
      if total_weight == 0:
          return 0
      pct = round_half_up(done_weight * 100 / total_weight)
      return pct
    input_set: "all FabricationMilestone rows of the order"
    constants: {}
    precision: "integer percent, round_half_up; 0 when no milestones exist (empty-set boundary)."

  - name: supplier_accreditation_status
    trigger: "read-time derivation; recomputed on POST /op/_clock/set_current_utc and on Supplier read"
    algorithm: threshold
    formula: |
      if accreditation_expiry is null:
          return "UNACCREDITED"
      if logical_clock <= accreditation_expiry:
          return "ACCREDITED"
      return "LAPSED"
    input_set: "Supplier.accreditation_expiry vs logical clock"
    constants: {}
    precision: "boundary: logical_clock == accreditation_expiry is still ACCREDITED ('<=' inclusive)."

  - name: prior_auth_requirement
    trigger: "POST /op/device-orders (intake) sets requires_prior_auth"
    algorithm: threshold
    formula: |
      # Prior auth required for Medicare lower-limb prosthetics and spinal orthoses.
      if patient.payer_type == "MEDICARE" and device_category in {"LOWER_LIMB_PROSTHETIC", "SPINAL_ORTHOSIS"}:
          return True
      return False
    input_set: "Patient.payer_type, Prescription.device_category"
    constants: {}
    precision: "boolean"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "acting role is permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "all path/body referenced resources exist, validated left-to-right in path then body FKs"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "body FK targets are referentially valid for context (e.g., DeviceOrder.prescription_id Rx belongs to same patient_id chain; ClaimLine.device_order_id order exists)"
    error_id: ERR_REFERENTIAL_MISMATCH
    http_status: 422
    applies_to: "POST /op/device-orders, POST /op/claim-lines, POST /op/prior-auths, POST /op/repair-requests"

  - priority: 5
    category: state
    check: "target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "DMEPOS compliance gate passes at delivery (dmepos_compliance_gate): supplier accredited, surety bond active, PECOS for Medicare, Rx consumed"
    error_id: ERR_COMPLIANCE_GATE_FAILED
    http_status: 422
    applies_to: "POST /op/device-orders/{id}/deliver"

  - priority: 7
    category: business_safety
    check: "segregation of duties: DeviceOrder.fitting_practitioner_id must differ from owning Prescription.physician_id at delivery"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /op/device-orders/{id}/deliver"

  - priority: 8
    category: business_temporal
    check: "Prescription is within its 6-month validity window (logical clock <= face_to_face_date + 6 months) at order creation"
    error_id: ERR_RX_EXPIRED
    http_status: 422
    applies_to: "POST /op/device-orders"

  - priority: 9
    category: business_constraint
    check: "Prescription.status == SIGNED at order creation (a DRAFT/VOIDED/CONSUMED/EXPIRED Rx cannot be ordered against)"
    error_id: ERR_RX_NOT_SIGNED
    http_status: 422
    applies_to: "POST /op/device-orders"

  - priority: 10
    category: business_constraint
    check: "Medicare order requires the prescribing Physician.pecos_enrolled == true at order creation"
    error_id: ERR_PHYSICIAN_NOT_PECOS
    http_status: 422
    applies_to: "POST /op/device-orders"

  - priority: 11
    category: business_constraint
    check: "KX modifier on a ClaimLine requires a covering APPROVED PriorAuth (when order.requires_prior_auth) at adjudication; otherwise modifier misuse"
    error_id: ERR_KX_WITHOUT_AUTH
    http_status: 422
    applies_to: "POST /op/claim-lines/{id}/adjudicate"

  - priority: 12
    category: business_constraint
    check: "FabricationMilestone step is unique per DeviceOrder (each of CASTING/MODIFICATION/ASSEMBLY/QUALITY_CHECK at most once)"
    error_id: ERR_DUPLICATE_MILESTONE
    http_status: 409
    applies_to: "POST /op/device-orders/{id}/fabrication-milestones"

  - priority: 13
    category: business_constraint
    check: "replacement authorization requires warranty_applies == false (in-warranty failures are repaired, not replaced)"
    error_id: ERR_REPLACEMENT_IN_WARRANTY
    http_status: 422
    applies_to: "POST /op/repair-requests/{id}/authorize-replacement"

  - priority: 14
    category: business_fiscal
    check: "billed_units >= 1 and fee_schedule_cents >= 0 on ClaimLine creation"
    error_id: ERR_INVALID_BILLING_AMOUNT
    http_status: 422
    applies_to: "POST /op/claim-lines"

  - priority: 17
    category: business_temporal
    check: |
      Same-or-similar overlap (Medicare 5-year reasonable-useful-lifetime): order creation is
      rejected when the same Patient already has a DELIVERED DeviceOrder of the same
      Prescription.device_category whose RUL window is still open — i.e. logical clock falls in the
      CLOSED interval [prior.delivery_date, prior.delivery_date + 5 years] inclusive on both ends.
      Interval semantics: closed-closed 5-year window keyed on the Patient resource.
    error_id: ERR_SAME_SIMILAR_OVERLAP
    http_status: 422
    applies_to: "POST /op/device-orders"

  - priority: 18
    category: business_constraint
    check: |
      Single-active-auth occupation: submit-auth is rejected when the DeviceOrder already owns a
      non-terminal PriorAuth (status IN {SUBMITTED, PENDED, APPROVED}). Interval semantics:
      aggregate capacity = 1 open authorization per order resource (half-open occupation — an auth
      released to a terminal status {DENIED, EXPIRED} frees the slot for a fresh submit).
    error_id: ERR_AUTH_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /op/device-orders/{id}/submit-auth"

  - priority: 15
    category: business_constraint
    check: "OCC: expected_<parent>_version on guarded writes matches current parent.version"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /op/device-orders/{id}/deliver, POST /op/prior-auths/{id}/resubmit"

  - priority: 16
    category: business_constraint
    check: "request body required fields present and well-typed (enum membership, integer ranges)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Patients ----
  - method: POST
    path: "/op/patients"
    description: "Create a patient."
    roles: [BillingSpecialist, ComplianceOfficer]
    code: 201
    input: [full_name, date_of_birth, payer_type, "medicare_beneficiary_id?", "functional_k_level?"]
    output: Patient
    side_effects: []
  - method: GET
    path: "/op/patients/{id}"
    description: "Fetch a patient."
    roles: [BillingSpecialist, ComplianceOfficer, Practitioner]
    code: 200
    input: []
    output: Patient
    side_effects: []

  # ---- Physicians ----
  - method: POST
    path: "/op/physicians"
    description: "Register a prescribing/fitting physician."
    roles: [ComplianceOfficer]
    code: 201
    input: [full_name, npi, "pecos_enrolled?"]
    output: Physician
    side_effects: []
  - method: GET
    path: "/op/physicians/{id}"
    description: "Fetch a physician."
    roles: [ComplianceOfficer, BillingSpecialist, Practitioner, Physician]
    code: 200
    input: []
    output: Physician
    side_effects: []

  # ---- Suppliers ----
  - method: POST
    path: "/op/suppliers"
    description: "Register a DMEPOS supplier."
    roles: [ComplianceOfficer]
    code: 201
    input: [legal_name, "accreditation_expiry?", "surety_bond_active?"]
    output: Supplier
    side_effects: ["compute accreditation_status from accreditation_expiry vs clock"]
  - method: GET
    path: "/op/suppliers/{id}"
    description: "Fetch a supplier with derived accreditation_status (recomputed against logical clock)."
    roles: [ComplianceOfficer, BillingSpecialist, Practitioner]
    code: 200
    input: []
    output: Supplier
    side_effects: ["recompute accreditation_status (calc supplier_accreditation_status)"]

  # ---- Prescriptions ----
  - method: POST
    path: "/op/prescriptions"
    description: "Create a DRAFT prescription."
    roles: [Physician]
    code: 201
    input: [patient_id, physician_id, device_category, primary_diagnosis_code, face_to_face_date]
    output: Prescription
    side_effects: []
  - method: GET
    path: "/op/prescriptions/{id}"
    description: "Fetch a prescription."
    roles: [Physician, BillingSpecialist, ComplianceOfficer, Practitioner]
    code: 200
    input: []
    output: Prescription
    side_effects: []
  - method: GET
    path: "/op/prescriptions"
    description: "List prescriptions; filterable by patient_id or physician_id (FK reverse-reachability)."
    roles: [Physician, BillingSpecialist, ComplianceOfficer]
    code: 200
    input: ["patient_id?", "physician_id?", "limit?", "offset?"]
    output: "Prescription[]"
    side_effects: []
  - method: POST
    path: "/op/prescriptions/{id}/sign"
    description: "Physician signs a DRAFT prescription (DRAFT->SIGNED)."
    roles: [Physician]
    code: 200
    input: []
    output: Prescription
    side_effects: ["DRAFT->SIGNED; increment version"]
  - method: POST
    path: "/op/prescriptions/{id}/void"
    description: "Void a DRAFT prescription (DRAFT->VOIDED)."
    roles: [Physician]
    code: 200
    input: []
    output: Prescription
    side_effects: ["DRAFT->VOIDED; increment version"]

  # ---- Device Orders ----
  - method: POST
    path: "/op/device-orders"
    description: "Create a DeviceOrder at INTAKE against a SIGNED in-window Rx; sets requires_prior_auth (calc prior_auth_requirement) and consumes the Rx (SIGNED->CONSUMED)."
    roles: [BillingSpecialist]
    code: 201
    input: [prescription_id, supplier_id, fitting_practitioner_id]
    output: DeviceOrder
    side_effects:
      - "compute requires_prior_auth (calc prior_auth_requirement)"
      - "CASCADE: Prescription SIGNED->CONSUMED; increment Prescription.version"
  - method: GET
    path: "/op/device-orders/{id}"
    description: "Fetch a device order with derived milestone_progress_pct and allowed_total_cents."
    roles: [BillingSpecialist, ComplianceOfficer, Practitioner]
    code: 200
    input: []
    output: DeviceOrder
    side_effects: []
  - method: GET
    path: "/op/device-orders"
    description: "List device orders; filterable by prescription_id, supplier_id, or fitting_practitioner_id (FK reverse-reachability)."
    roles: [BillingSpecialist, ComplianceOfficer, Practitioner]
    code: 200
    input: ["prescription_id?", "supplier_id?", "fitting_practitioner_id?", "limit?", "offset?"]
    output: "DeviceOrder[]"
    side_effects: []
  - method: POST
    path: "/op/device-orders/{id}/submit-auth"
    description: "Submit prior authorization (INTAKE->AUTH_PENDING); cascades a PriorAuth in SUBMITTED."
    roles: [BillingSpecialist]
    code: 201
    input: []
    output: PriorAuth
    side_effects:
      - "INTAKE->AUTH_PENDING; CASCADE create PriorAuth SUBMITTED with decision_deadline = clock+14d"
      - "increment DeviceOrder.version"
  - method: POST
    path: "/op/device-orders/{id}/start-fabrication"
    description: "Begin fabrication for a no-auth order (INTAKE->FABRICATION)."
    roles: [Practitioner]
    code: 200
    input: []
    output: DeviceOrder
    side_effects: ["INTAKE->FABRICATION; increment version"]
  - method: POST
    path: "/op/device-orders/{id}/deliver"
    description: "Deliver/fit the device (READY_FOR_FITTING->DELIVERED); runs DMEPOS compliance gate, stamps delivery_date and warranty_expiry, submits claim lines. OCC-guarded; default clock 2026-05-01T00:00:00Z if never set."
    roles: [Practitioner]
    code: 200
    input: [expected_device_order_version]
    output: DeviceOrder
    side_effects:
      - "create ComplianceCheck (dmepos_compliance_gate)"
      - "stamp delivery_date; compute warranty_expiry (calc warranty_window)"
      - "CASCADE: all DRAFT ClaimLines -> SUBMITTED"
      - "increments DeviceOrder.version by 1"
  - method: POST
    path: "/op/device-orders/{id}/cancel"
    description: "Cancel an order (INTAKE/AUTH_PENDING -> CANCELLED); cascades PriorAuth denial."
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: DeviceOrder
    side_effects:
      - "-> CANCELLED; CASCADE: covering PriorAuth in {SUBMITTED,PENDED} -> DENIED"
      - "increment DeviceOrder.version"
  - method: GET
    path: "/op/device-orders/{id}/billing-summary"
    description: "Computed read: provisional vs final allowed totals (calc order_allowed_total variants)."
    roles: [BillingSpecialist, ComplianceOfficer]
    code: 200
    input: []
    output: "null"
    side_effects: []
  - method: GET
    path: "/op/device-orders/{id}/compliance-checks"
    description: "List ComplianceCheck audit records for the order (FK reverse-reachability)."
    roles: [ComplianceOfficer, BillingSpecialist]
    code: 200
    input: []
    output: "ComplianceCheck[]"
    side_effects: []

  # ---- Fabrication Milestones ----
  - method: POST
    path: "/op/device-orders/{id}/fabrication-milestones"
    description: "Add a fabrication milestone (unique step per order)."
    roles: [Practitioner]
    code: 201
    input: [step, weight]
    output: FabricationMilestone
    side_effects: ["recompute DeviceOrder.milestone_progress_pct"]
  - method: GET
    path: "/op/device-orders/{id}/fabrication-milestones"
    description: "List milestones for an order (FK reverse-reachability)."
    roles: [Practitioner, BillingSpecialist, ComplianceOfficer]
    code: 200
    input: []
    output: "FabricationMilestone[]"
    side_effects: []
  - method: POST
    path: "/op/fabrication-milestones/{id}/complete"
    description: "Mark a milestone complete; recompute progress; may bubble up FABRICATION->READY_FOR_FITTING."
    roles: [Practitioner]
    code: 200
    input: []
    output: FabricationMilestone
    side_effects:
      - "set completed=true; recompute DeviceOrder.milestone_progress_pct (calc fabrication_progress)"
      - "CASCADE: if all milestones complete, DeviceOrder FABRICATION->READY_FOR_FITTING"

  # ---- Prior Auths ----
  - method: GET
    path: "/op/prior-auths/{id}"
    description: "Fetch a prior authorization."
    roles: [ComplianceOfficer, BillingSpecialist]
    code: 200
    input: []
    output: PriorAuth
    side_effects: []
  - method: GET
    path: "/op/prior-auths"
    description: "List prior auths; filterable by device_order_id (FK reverse-reachability)."
    roles: [ComplianceOfficer, BillingSpecialist]
    code: 200
    input: ["device_order_id?", "limit?", "offset?"]
    output: "PriorAuth[]"
    side_effects: []
  - method: POST
    path: "/op/prior-auths/{id}/pend"
    description: "Pend a submitted auth for more info (SUBMITTED->PENDED)."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PriorAuth
    side_effects: ["SUBMITTED->PENDED; increment version"]
  - method: POST
    path: "/op/prior-auths/{id}/resubmit"
    description: "Resubmit a pended auth (PENDED->SUBMITTED); OCC-guarded; bumps submission_round, resets deadline."
    roles: [BillingSpecialist]
    code: 200
    input: [expected_prior_auth_version]
    output: PriorAuth
    side_effects:
      - "PENDED->SUBMITTED; increment submission_round; reset decision_deadline=clock+14d"
      - "increments PriorAuth.version by 1"
  - method: POST
    path: "/op/prior-auths/{id}/approve"
    description: "Approve an auth (SUBMITTED->APPROVED); requires accredited supplier; bubbles order to FABRICATION."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PriorAuth
    side_effects:
      - "stamp auth_number; CASCADE: DeviceOrder AUTH_PENDING->FABRICATION (if milestones exist)"
      - "increment PriorAuth.version"
  - method: POST
    path: "/op/prior-auths/{id}/deny"
    description: "Deny an auth (SUBMITTED->DENIED)."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PriorAuth
    side_effects: ["SUBMITTED->DENIED; increment version"]

  # ---- Claim Lines ----
  - method: POST
    path: "/op/claim-lines"
    description: "Create a DRAFT claim line on an order."
    roles: [BillingSpecialist]
    code: 201
    input: [device_order_id, l_code, "modifier?", billed_units, fee_schedule_cents]
    output: ClaimLine
    side_effects: []
  - method: GET
    path: "/op/claim-lines/{id}"
    description: "Fetch a claim line."
    roles: [BillingSpecialist, ComplianceOfficer]
    code: 200
    input: []
    output: ClaimLine
    side_effects: []
  - method: GET
    path: "/op/claim-lines"
    description: "List claim lines; filterable by device_order_id (FK reverse-reachability)."
    roles: [BillingSpecialist, ComplianceOfficer]
    code: 200
    input: ["device_order_id?", "limit?", "offset?"]
    output: "ClaimLine[]"
    side_effects: []
  - method: POST
    path: "/op/claim-lines/{id}/adjudicate"
    description: "Adjudicate a SUBMITTED line (SUBMITTED->ADJUDICATED); computes allowed_cents and recomputes order ledger."
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: ClaimLine
    side_effects:
      - "compute allowed_cents (calc claim_line_allowed); CASCADE recompute DeviceOrder.allowed_total_cents"
      - "increment ClaimLine.version"
  - method: POST
    path: "/op/claim-lines/{id}/deny"
    description: "Deny a SUBMITTED line (SUBMITTED->DENIED); allowed_cents=0; recompute order ledger."
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: ClaimLine
    side_effects:
      - "set allowed_cents=0; CASCADE recompute DeviceOrder.allowed_total_cents"
      - "increment ClaimLine.version"
  - method: POST
    path: "/op/claim-lines/{id}/appeal"
    description: "File an appeal on a DENIED line (appeal_status NONE->APPEALED)."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ClaimLine
    side_effects: ["appeal_status NONE->APPEALED; increment version"]
  - method: POST
    path: "/op/claim-lines/{id}/appeal-decision"
    description: "Record appeal outcome; OVERTURNED moves adjudication DENIED->ADJUDICATED and recomputes ledger."
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome]
    output: ClaimLine
    side_effects:
      - "appeal_status APPEALED->{APPEAL_UPHELD|APPEAL_OVERTURNED}; on OVERTURNED set adjudication_status ADJUDICATED, recompute allowed_cents and DeviceOrder.allowed_total_cents"
      - "increment ClaimLine.version"

  # ---- Repair Requests ----
  - method: POST
    path: "/op/repair-requests"
    description: "Report a repair on a DELIVERED order."
    roles: [Practitioner, BillingSpecialist]
    code: 201
    input: [device_order_id]
    output: RepairRequest
    side_effects: []
  - method: GET
    path: "/op/repair-requests/{id}"
    description: "Fetch a repair request."
    roles: [Practitioner, BillingSpecialist, ComplianceOfficer]
    code: 200
    input: []
    output: RepairRequest
    side_effects: []
  - method: GET
    path: "/op/repair-requests"
    description: "List repair requests; filterable by device_order_id or replaces_order_id (FK reverse-reachability)."
    roles: [Practitioner, BillingSpecialist, ComplianceOfficer]
    code: 200
    input: ["device_order_id?", "replaces_order_id?", "limit?", "offset?"]
    output: "RepairRequest[]"
    side_effects: []
  - method: POST
    path: "/op/repair-requests/{id}/assess"
    description: "Assess a reported repair (REPORTED->ASSESSED); computes warranty_applies and cost_cents."
    roles: [Practitioner]
    code: 200
    input: [parts_cents]
    output: RepairRequest
    side_effects: ["compute warranty_applies, cost_cents (calc repair_cost); increment version"]
  - method: POST
    path: "/op/repair-requests/{id}/complete-repair"
    description: "Complete an assessed repair (ASSESSED->REPAIRED)."
    roles: [Practitioner]
    code: 200
    input: []
    output: RepairRequest
    side_effects: ["ASSESSED->REPAIRED; increment version"]
  - method: POST
    path: "/op/repair-requests/{id}/authorize-replacement"
    description: "Authorize replacement of an out-of-warranty device (ASSESSED->REPLACEMENT_AUTHORIZED); cascades a new DeviceOrder."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RepairRequest
    side_effects:
      - "ASSESSED->REPLACEMENT_AUTHORIZED; CASCADE create new DeviceOrder (INTAKE) cloning prescription/supplier; set replaces_order_id"
      - "increment version"
  - method: POST
    path: "/op/repair-requests/{id}/close"
    description: "Close a repair (REPAIRED/REPLACEMENT_AUTHORIZED -> CLOSED)."
    roles: [Practitioner]
    code: 200
    input: []
    output: RepairRequest
    side_effects: ["-> CLOSED; increment version"]

  # ---- Adjustments ----
  - method: POST
    path: "/op/device-orders/{id}/adjustments"
    description: "Record a follow-up adjustment on a DELIVERED order; computes within_warranty and billable."
    roles: [Practitioner]
    code: 201
    input: []
    output: Adjustment
    side_effects: ["stamp adjustment_date=clock; compute within_warranty, billable (calc adjustment_billability)"]
  - method: GET
    path: "/op/device-orders/{id}/adjustments"
    description: "List adjustments for an order (FK reverse-reachability)."
    roles: [Practitioner, BillingSpecialist, ComplianceOfficer]
    code: 200
    input: []
    output: "Adjustment[]"
    side_effects: []

  # ---- Clock (test-driving) ----
  - method: POST
    path: "/op/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-05-01T00:00:00Z (used by all deadline/expiry/window rules before any set). Advancing the clock sweeps PriorAuth deadlines (auto-EXPIRED) and recomputes supplier accreditation status."
    roles: [ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: ClockState
    side_effects:
      - "CASCADE: PriorAuth in {SUBMITTED,PENDED} past decision_deadline -> EXPIRED"
      - "recompute Supplier.accreditation_status on read"

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers, or unknown role."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Authenticated role not permitted for this endpoint."
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "A path or body-referenced resource does not exist."
  - id: ERR_REFERENTIAL_MISMATCH
    http: 422
    condition: "Body FK target is inconsistent with context (e.g., Rx patient mismatch)."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not defined from the resource's current state."
  - id: ERR_COMPLIANCE_GATE_FAILED
    http: 422
    condition: "DMEPOS compliance gate failed at delivery (non-segregation reasons)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "Fitting practitioner equals prescribing physician at delivery."
  - id: ERR_RX_EXPIRED
    http: 422
    condition: "Prescription past its 6-month validity window at order creation."
  - id: ERR_RX_NOT_SIGNED
    http: 422
    condition: "Order created against an Rx not in SIGNED status."
  - id: ERR_PHYSICIAN_NOT_PECOS
    http: 422
    condition: "Medicare order whose prescribing physician is not PECOS-enrolled."
  - id: ERR_KX_WITHOUT_AUTH
    http: 422
    condition: "KX modifier adjudicated on an auth-required order lacking an APPROVED PriorAuth."
  - id: ERR_DUPLICATE_MILESTONE
    http: 409
    condition: "FabricationMilestone step already exists for this order."
  - id: ERR_REPLACEMENT_IN_WARRANTY
    http: 422
    condition: "Replacement authorization attempted while warranty still applies."
  - id: ERR_INVALID_BILLING_AMOUNT
    http: 422
    condition: "billed_units < 1 or fee_schedule_cents < 0."
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_device_order_version does not match current DeviceOrder.version."
  - id: ERR_STALE_AUTH_VERSION
    http: 412
    condition: "expected_prior_auth_version does not match current PriorAuth.version."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required body field, bad enum value, or out-of-range integer."
  - id: ERR_MILESTONE_REQUIRED
    http: 422
    condition: "Fabrication/approval attempted with no FabricationMilestone defined on the order."
  - id: ERR_SUPPLIER_NOT_ACCREDITED
    http: 422
    condition: "PriorAuth approval attempted while covering order's supplier is not ACCREDITED."
  - id: ERR_NOT_DELIVERED
    http: 422
    condition: "Adjustment/repair created against an order not in DELIVERED status."
  - id: ERR_INVALID_APPEAL_OUTCOME
    http: 400
    condition: "appeal-decision outcome not in {UPHELD, OVERTURNED}."
  - id: ERR_SAME_SIMILAR_OVERLAP
    http: 422
    condition: "Order creation collides with a prior DELIVERED order of the same device_category for the patient still inside its 5-year RUL window."
  - id: ERR_AUTH_ALREADY_OPEN
    http: 409
    condition: "submit-auth attempted while the order already has a non-terminal PriorAuth."

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Physician
    description: "Prescribing physician; authors and signs prescriptions."
    identity: "entity_backed:Physician"
    exclusive_operations:
      - "POST /op/prescriptions"
      - "POST /op/prescriptions/{id}/sign"
      - "POST /op/prescriptions/{id}/void"
    shared_operations:
      - "GET /op/prescriptions/{id}"
      - "GET /op/physicians/{id}"

  - name: Practitioner
    description: "Fitting practitioner/technician; runs fabrication, delivery/fitting, adjustments, repairs."
    identity: "entity_backed:Physician"
    exclusive_operations:
      - "POST /op/device-orders/{id}/start-fabrication"
      - "POST /op/device-orders/{id}/deliver"
      - "POST /op/device-orders/{id}/fabrication-milestones"
      - "POST /op/fabrication-milestones/{id}/complete"
      - "POST /op/device-orders/{id}/adjustments"
      - "POST /op/repair-requests/{id}/assess"
      - "POST /op/repair-requests/{id}/complete-repair"
      - "POST /op/repair-requests/{id}/close"
    shared_operations:
      - "POST /op/repair-requests"
      - "GET /op/device-orders/{id}"
      - "GET /op/device-orders"
      - "GET /op/device-orders/{id}/fabrication-milestones"
      - "GET /op/device-orders/{id}/adjustments"
      - "GET /op/repair-requests"
      - "GET /op/repair-requests/{id}"

  - name: BillingSpecialist
    description: "Handles intake, prior-auth submission, claim/L-code billing, adjudication, cancellation."
    identity: "opaque"
    exclusive_operations:
      - "POST /op/patients"
      - "POST /op/device-orders"
      - "POST /op/device-orders/{id}/submit-auth"
      - "POST /op/device-orders/{id}/cancel"
      - "POST /op/prior-auths/{id}/resubmit"
      - "POST /op/claim-lines"
      - "POST /op/claim-lines/{id}/adjudicate"
      - "POST /op/claim-lines/{id}/deny"
    shared_operations:
      - "GET /op/device-orders/{id}/billing-summary"
      - "GET /op/claim-lines"
      - "GET /op/claim-lines/{id}"
      - "POST /op/repair-requests"
      - "GET /op/prior-auths"
      - "GET /op/prior-auths/{id}"

  - name: ComplianceOfficer
    description: "DMEPOS/Medicare compliance authority; supplier & physician onboarding, auth adjudication, appeals, replacement authorization, clock control."
    identity: "opaque"
    exclusive_operations:
      - "POST /op/physicians"
      - "POST /op/suppliers"
      - "POST /op/prior-auths/{id}/pend"
      - "POST /op/prior-auths/{id}/approve"
      - "POST /op/prior-auths/{id}/deny"
      - "POST /op/claim-lines/{id}/appeal"
      - "POST /op/claim-lines/{id}/appeal-decision"
      - "POST /op/repair-requests/{id}/authorize-replacement"
      - "POST /op/_clock/set_current_utc"
    shared_operations:
      - "GET /op/suppliers/{id}"
      - "GET /op/device-orders/{id}/compliance-checks"
      - "GET /op/prior-auths"
      - "GET /op/prior-auths/{id}"
