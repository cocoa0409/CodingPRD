            - { call: "POST /onboarding/offers/${offer_id}/extend", payload: {}, as: Recruiter }
            - { call: "POST /onboarding/offers/${offer_id}/accept", payload: {}, as: Physician, as_user_id: "${phys_id}" }
            - { call: "GET /onboarding/onboarding-cases/${case_id}", payload: {}, as: Recruiter, captures: { v_pre_exec: "$.data.version" } }
            - { call: "POST /onboarding/offers/${offer_id}/execute", payload: {}, as: ContractAdministrator }
          trigger:
            - { call: "POST /onboarding/offers", payload: { onboarding_case_id: "${case_id}", expected_onboarding_case_version: "${v_pre_exec}", base_salary_cents: 26000000, signing_bonus_cents: 2000000, guarantee_monthly_cents: 2100000, guarantee_term_months: 12, panel_capacity: 1100, proposed_start_date: "2027-07-01", expires_at: "2027-01-01T00:00:00Z" }, as: Recruiter, captures: { err: "$.data.error_id" } }
            - { call: "GET /onboarding/onboarding-cases/${case_id}", payload: {}, as: Recruiter, captures: { v_now: "$.data.version" } }
            - { call: "POST /onboarding/offers", payload: { onboarding_case_id: "${case_id}", expected_onboarding_case_version: "${v_now}", base_salary_cents: 26000000, signing_bonus_cents: 2000000, guarantee_monthly_cents: 2100000, guarantee_term_months: 12, panel_capacity: 1100, proposed_start_date: "2027-07-01", expires_at: "2027-01-01T00:00:00Z" }, as: Recruiter, captures: { offer_c: "$.data.id", st: "$.data.status" } }
          assert:
            - "Amendment create with the pre-execution version rejected: error_id == ERR_STALE_VERSION (HTTP 412)"
            - "Same amendment with the current version succeeds: status == DRAFT (amendment window open: guarantee DRAFT and all milestones PENDING)"
            - "The original offer ${offer_id} remains EXECUTED until the amendment itself executes"

      - name: mentorship_create_stale_version_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[mentorship-create-stale-case]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on the case version guards mentor supersede: a create carrying the version observed before the first assignment was made is rejected with ERR_STALE_VERSION, because the first create bumped the case version; retrying with the fresh version succeeds and supersedes."
        test_recipe:
          setup: ["Physician + case; two ACTIVE mentor candidates; case version observed before the first assignment exists"]
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Mia", specialty: "FAMILY_MEDICINE", email: "mia@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id" } }
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. M1", specialty: "FAMILY_MEDICINE", email: "m1@x.com", hire_type: "LEADERSHIP" }, as: Recruiter, captures: { m1: "$.data.id" } }
            - { call: "POST /onboarding/physicians/${m1}/mark-active", payload: {}, as: OnboardingDirector }
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. M2", specialty: "FAMILY_MEDICINE", email: "m2@x.com", hire_type: "LEADERSHIP" }, as: Recruiter, captures: { m2: "$.data.id" } }
            - { call: "POST /onboarding/physicians/${m2}/mark-active", payload: {}, as: OnboardingDirector }
            - { call: "GET /onboarding/onboarding-cases/${case_id}", payload: {}, as: OnboardingDirector, captures: { v_stale: "$.data.version" } }
            - { call: "POST /onboarding/mentorship-assignments", payload: { onboarding_case_id: "${case_id}", mentor_physician_id: "${m1}", expected_onboarding_case_version: "${v_stale}" }, as: OnboardingDirector, captures: { ma1: "$.data.id" } }
          trigger:
            - { call: "POST /onboarding/mentorship-assignments", payload: { onboarding_case_id: "${case_id}", mentor_physician_id: "${m2}", expected_onboarding_case_version: "${v_stale}" }, as: OnboardingDirector, captures: { err: "$.data.error_id" } }
            - { call: "GET /onboarding/onboarding-cases/${case_id}", payload: {}, as: OnboardingDirector, captures: { v_now: "$.data.version" } }
            - { call: "POST /onboarding/mentorship-assignments", payload: { onboarding_case_id: "${case_id}", mentor_physician_id: "${m2}", expected_onboarding_case_version: "${v_now}" }, as: OnboardingDirector, captures: { ma2: "$.data.id" } }
          assert:
            - "Create with the stale version rejected: error_id == ERR_STALE_VERSION (HTTP 412)"
            - "Create with the fresh version succeeds; ${ma1} is SUPERSEDED and ${ma2} is ACTIVE"

      - name: derived_minutes_reconciled_on_activate_and_retire
        claim_type: derived_field_reconciliation
        grounds: ["entities.OnboardingCase.fields.weekly_active_minutes", "calculations.weekly_capacity_minutes"]
        distinguishing_aspect: "The denormalized weekly_active_minutes tracks its sources on every mutation: 0 at case creation, 480 after activation, 0 and practice_status PLANNING after the only ACTIVE template retires."
        test_recipe:
          setup: ["Physician + case"]
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Ned", specialty: "ORTHOPEDICS", email: "ned@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id" } }
            - { call: "POST /onboarding/schedule-templates", payload: { onboarding_case_id: "${case_id}", weekday: 1, start_minute: 480, end_minute: 960, block_type: "CLINIC" }, as: PracticeManager, captures: { t1: "$.data.id" } }
          trigger:
            - { call: "POST /onboarding/schedule-templates/${t1}/activate", payload: {}, as: PracticeManager }
            - { call: "GET /onboarding/onboarding-cases/${case_id}", payload: {}, as: PracticeManager, captures: { mins1: "$.data.weekly_active_minutes", prac1: "$.data.practice_status" } }
            - { call: "POST /onboarding/schedule-templates/${t1}/retire", payload: {}, as: PracticeManager }
            - { call: "GET /onboarding/onboarding-cases/${case_id}", payload: {}, as: PracticeManager, captures: { mins2: "$.data.weekly_active_minutes", prac2: "$.data.practice_status" } }
          assert:
            - "After activate: weekly_active_minutes == 480, practice_status == BUILDING (480 < 900 for ORTHOPEDICS)"
            - "After retire: weekly_active_minutes == 0, practice_status == PLANNING (no ACTIVE templates remain)"

      - name: cascading_side_effects_chains
        claim_type: cascading_side_effects
        grounds: ["state_machines.CredentialItem.APPROVED_to_EXPIRED", "state_machines.ScheduleTemplate.ACTIVE_to_RETIRED"]
        excluded_because:
          difficulty_instance: license_expiry_cascade_freezes_panel
          rationale: "N-level cascade ordering asserted hop-by-hop by license_expiry_cascade_freezes_panel and template_retire_cascade_freezes_panel."

      - name: dual_variant_calculation_both_domains
        claim_type: dual_variant_calculation
        grounds: ["calculations.income_guarantee_draw", "calculations.retention_risk_score"]
        excluded_because:
          difficulty_instance: guarantee_draw_projected_vs_actual_diverge
          rationale: "Both variants exercised with literal expected values in guarantee_draw_projected_vs_actual_diverge and retention_score_trailing_vs_leading_diverge."

      - name: rate_threshold_band_boundary
        claim_type: rate_threshold_triggers
        grounds: ["calculations.retention_risk_score", "entities.RetentionRiskSnapshot.fields.risk_band"]
        excluded_because:
          difficulty_instance: retention_score_per_term_rounding_order_pinned
          rationale: "The 75.00 CRITICAL threshold (inclusive lower bound) is asserted exactly by retention_score_per_term_rounding_order_pinned; the 80/79 score threshold by module_pass_threshold_exactly_80."

  - section: consistency_model
    instances:
      - name: immediate_read_after_write_visibility
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "entities.Offer.fields.status", "entities.OnboardingCase"]
        distinguishing_aspect: "Immediate consistency: the create response itself shows status DRAFT, and an immediately following GET of the parent case shows the version increment from the create's side effect — no reconciliation lag."
        test_recipe:
          setup: ["Physician + case (version 1)"]
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Ole", specialty: "FAMILY_MEDICINE", email: "ole@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id", case_v: "$.data.version" } }
          trigger:
            - { call: "POST /onboarding/offers", payload: { onboarding_case_id: "${case_id}", expected_onboarding_case_version: "${case_v}", base_salary_cents: 25000000, signing_bonus_cents: 2000000, guarantee_monthly_cents: 2000000, guarantee_term_months: 12, panel_capacity: 1000, proposed_start_date: "2027-06-01", expires_at: "2026-08-01T00:00:00Z" }, as: Recruiter, captures: { offer_id: "$.data.id", st: "$.data.status" } }
            - { call: "GET /onboarding/onboarding-cases/${case_id}", payload: {}, as: Recruiter, captures: { v_after: "$.data.version" } }
          assert:
            - "Create response itself carries status == DRAFT (state visible in the same request)"
            - "Immediate GET shows case version == 2 (the create's side effect is visible without delay)"

      - name: clock_default_is_fixed_startup_instant
        claim_type: immediate
        grounds: ["endpoints", "state_machines.Offer.EXTENDED_to_EXPIRED"]
        distinguishing_aspect: "Before any set_current_utc call the logical clock is exactly 2026-05-01T00:00:00Z: an offer expiring 2026-05-02 is NOT lapsed by an epoch at the default instant, but IS lapsed after the clock advances past it."
        test_recipe:
          setup: ["Physician + case + offer EXTENDED with expires_at 2026-05-02T00:00:00Z; clock never set"]
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Peg", specialty: "FAMILY_MEDICINE", email: "peg@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id", case_v: "$.data.version" } }
            - { call: "POST /onboarding/offers", payload: { onboarding_case_id: "${case_id}", expected_onboarding_case_version: "${case_v}", base_salary_cents: 25000000, signing_bonus_cents: 2000000, guarantee_monthly_cents: 2000000, guarantee_term_months: 12, panel_capacity: 1000, proposed_start_date: "2027-06-01", expires_at: "2026-05-02T00:00:00Z" }, as: Recruiter, captures: { offer_id: "$.data.id" } }
            - { call: "POST /onboarding/offers/${offer_id}/extend", payload: {}, as: Recruiter }
          trigger:
            - { call: "POST /_ops/run_epoch", payload: {}, as: SystemOperator, captures: { exp1: "$.data.expired_offer_ids" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:00Z" }, as: SystemOperator }
            - { call: "POST /_ops/run_epoch", payload: {}, as: SystemOperator, captures: { exp2: "$.data.expired_offer_ids" } }
            - { call: "GET /onboarding/offers/${offer_id}", payload: {}, as: Recruiter, captures: { st: "$.data.status" } }
          assert:
            - "Epoch at the default instant (2026-05-01T00:00:00Z) expires nothing: expired_offer_ids is empty (2026-05-02 not yet past)"
            - "Epoch after advancing to 2026-05-03 lists the offer in expired_offer_ids"
            - "Offer.${offer_id}.status == EXPIRED"
