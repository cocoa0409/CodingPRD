          trigger:
            - call: "POST /purchase-lines"
              payload: { purchase_batch_id: "${b1_id}", member_id: "${m_pending_id}", distributor_sku: "MF-88120", vendor_item_description: "Beef patty 4oz 40ct case", normalized_item_key_reported: "BEEF-PATTY-4OZ-CS40", cases_shipped: 0, invoice_unit_cost_cents: 9140, distributor_base_cost_cents: 8533, invoice_date: "2026-06-05" }
              as: DistributorFeed
