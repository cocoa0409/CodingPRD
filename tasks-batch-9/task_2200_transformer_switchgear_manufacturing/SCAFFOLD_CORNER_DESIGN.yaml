            - "GET /test-reports/${report_id} as ComplianceOfficer returns HTTP 200 with data.status == \"DRAFT\"."
            - "GET /engineered-orders/${order_id}/compliance-labels as ComplianceOfficer returns an empty data array."

      - name: second_assignment_of_the_same_witness_party_returns_witness_already_assigned
        claim_type: violation_to_error
        grounds:
          - validations[P61]
          - errors[ERR_WITNESS_ALREADY_ASSIGNED]
          - endpoints[create_witness_assignment]
        distinguishing_aspect: "Uniqueness is per (test, party): inviting the same WitnessParty to the same REQUESTED test twice is 409 ERR_WITNESS_ALREADY_ASSIGNED, while a different party on the same test is accepted."
        test_recipe:
          setup:
            - "One order, one witness-required test in REQUESTED, and two witness parties whose credentials expire far in the future."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
