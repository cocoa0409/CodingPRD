          Mode (b) — pinned evaluation ORDER: each of the four room lines is converted at 7 lb per
          cubic foot and rounded half-up to whole pounds BEFORE summation (1005 + 1878 + 1474 + 677
          = 5034, then a 5% accessorial uplift of 252 giving 5286); summing cube first
