              as: ComplianceOfficer
              captures: { fd_id: $.data.id }
            - call: "POST /settlement-runs"
              payload: { atm_id: "${atm_id}", window_start: "2026-01-01T00:00:00Z", window_end: "2026-02-01T00:00:00Z" }
              as: SettlementOfficer
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /settlement-runs/${run_id}/settle"
              payload: {}
              as: SettlementOfficer
              captures: { eid: $.data.error_id }
          assert:
            - "Response status 422 with error_id == ERR_NO_FEE_DISCLOSURE"
            - "SettlementRun status still DRAFT"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: route_window_halfopen_overlap_rejected_adjacent_allowed
        grounds:
          - validations[priority=15]
          - entities.ReplenishmentOrder.fields.service_window_start
          - state_machines.ReplenishmentOrder.SCHEDULED_to_DISPATCHED
        distinguishing_aspect: |
          ArmoredRoute interval semantics are HALF-OPEN [start,end): a second order on the same
          route at [09:30,10:30) overlapping a dispatched [09:00,10:00) is ERR_ROUTE_WINDOW_CONFLICT,
          but an exactly-adjacent [10:00,11:00) is accepted (touching endpoints do not overlap).
        test_recipe:
          setup:
            - "Vault funded. Route R. ATM-A dispatched with window [09:00,10:00). ATM-B and ATM-C scheduled on the same route."
          setup_api_calls:
            - call: "POST /vaults"
              payload: { name: "V15", provisioned_cents: 100000000 }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v_ver0: $.data.version }
            - call: "POST /routes"
              payload: { carrier_name: "Acme", vault_id: "${v_id}" }
              as: PlatformAdmin
              captures: { route_id: $.data.id }
            - call: "POST /site-merchants"
              payload: { legal_name: "M", commission_pct_bps: 1000, commission_flat_per_wd_cents: 10, commission_monthly_ceiling_cents: 50000 }
              as: PlatformAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "S", jurisdiction_code: "CA", site_merchant_id: "${sm_id}", route_id: "${route_id}", address: "1 C" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /atms"
              payload: { serial_no: "SN-RA", location_id: "${loc_id}", surcharge_cents: 100, note_denomination_cents: 2000 }
              as: PlatformAdmin
              captures: { atm_a: $.data.id }
            - call: "POST /atms"
              payload: { serial_no: "SN-RB", location_id: "${loc_id}", surcharge_cents: 100, note_denomination_cents: 2000 }
              as: PlatformAdmin
              captures: { atm_b: $.data.id }
            - call: "POST /atms"
              payload: { serial_no: "SN-RC", location_id: "${loc_id}", surcharge_cents: 100, note_denomination_cents: 2000 }
              as: PlatformAdmin
              captures: { atm_c: $.data.id }
            - call: "POST /replenishment-orders"
              payload: { atm_id: "${atm_a}", route_id: "${route_id}", order_amount_cents: 200000, service_window_start: "2026-01-05T09:00:00Z", service_window_end: "2026-01-05T10:00:00Z" }
              as: VaultController
              captures: { ro_a: $.data.id }
            - call: "POST /replenishment-orders/${ro_a}/dispatch"
              payload: { expected_vault_version: "${v_ver0}" }
              as: VaultController
              captures: { v_ver1: $.data.expected_vault_version }
            - call: "POST /replenishment-orders"
              payload: { atm_id: "${atm_b}", route_id: "${route_id}", order_amount_cents: 200000, service_window_start: "2026-01-05T09:30:00Z", service_window_end: "2026-01-05T10:30:00Z" }
              as: VaultController
              captures: { ro_b: $.data.id }
            - call: "POST /replenishment-orders"
              payload: { atm_id: "${atm_c}", route_id: "${route_id}", order_amount_cents: 200000, service_window_start: "2026-01-05T10:00:00Z", service_window_end: "2026-01-05T11:00:00Z" }
              as: VaultController
              captures: { ro_c: $.data.id }
          trigger:
            - call: "GET /vaults/${v_id}"
              payload: {}
              as: VaultController
              captures: { v_now: $.data.version }
            - call: "POST /replenishment-orders/${ro_b}/dispatch"
              payload: { expected_vault_version: "${v_now}" }
              as: VaultController
              captures: { eid_b: $.data.error_id }
            - call: "POST /replenishment-orders/${ro_c}/dispatch"
              payload: { expected_vault_version: "${v_now}" }
              as: VaultController
              captures: { st_c: $.data.status }
          assert:
            - "Dispatch of overlapping ro_b returns 409 ERR_ROUTE_WINDOW_CONFLICT"
            - "Dispatch of adjacent ro_c (window starts exactly when ro_a ends) returns 200 with status DISPATCHED"

      - name: atm_lockout_closed_buffer_overlap_rejected
        grounds:
          - validations[priority=16]
          - entities.ReplenishmentOrder.fields.atm_id
          - state_machines.ReplenishmentOrder.SCHEDULED_to_DISPATCHED
        distinguishing_aspect: |
          Different resource (ATM) and DIFFERENT interval semantics — CLOSED interval plus a
          30-min buffer: a second order on the SAME ATM whose window is exactly adjacent
          [10:00,11:00) to a dispatched [09:00,10:00) is still rejected ERR_ATM_SERVICE_LOCKOUT
          because the buffer makes adjacency collide (unlike the half-open route rule).
        test_recipe:
          setup:
            - "Route funded. Single ATM with a dispatched order [09:00,10:00). A second SCHEDULED order on the SAME ATM at [10:00,11:00)."
          setup_api_calls:
            - call: "POST /vaults"
              payload: { name: "V16", provisioned_cents: 100000000 }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v_ver0: $.data.version }
            - call: "POST /routes"
              payload: { carrier_name: "Acme", vault_id: "${v_id}" }
              as: PlatformAdmin
              captures: { route_id: $.data.id }
            - call: "POST /site-merchants"
              payload: { legal_name: "M", commission_pct_bps: 1000, commission_flat_per_wd_cents: 10, commission_monthly_ceiling_cents: 50000 }
              as: PlatformAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "S", jurisdiction_code: "CA", site_merchant_id: "${sm_id}", route_id: "${route_id}", address: "1 C" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /atms"
              payload: { serial_no: "SN-LCK", location_id: "${loc_id}", surcharge_cents: 100, note_denomination_cents: 2000 }
              as: PlatformAdmin
              captures: { atm_id: $.data.id }
            - call: "POST /replenishment-orders"
              payload: { atm_id: "${atm_id}", route_id: "${route_id}", order_amount_cents: 200000, service_window_start: "2026-01-05T09:00:00Z", service_window_end: "2026-01-05T10:00:00Z" }
              as: VaultController
              captures: { ro_1: $.data.id }
            - call: "POST /replenishment-orders/${ro_1}/dispatch"
              payload: { expected_vault_version: "${v_ver0}" }
              as: VaultController
            - call: "POST /replenishment-orders"
              payload: { atm_id: "${atm_id}", route_id: "${route_id}", order_amount_cents: 200000, service_window_start: "2026-01-05T10:00:00Z", service_window_end: "2026-01-05T11:00:00Z" }
              as: VaultController
              captures: { ro_2: $.data.id }
          trigger:
            - call: "GET /vaults/${v_id}"
              payload: {}
              as: VaultController
              captures: { v_now: $.data.version }
            - call: "POST /replenishment-orders/${ro_2}/dispatch"
              payload: { expected_vault_version: "${v_now}" }
              as: VaultController
              captures: { eid: $.data.error_id }
          assert:
            - "Response status 409 with error_id == ERR_ATM_SERVICE_LOCKOUT (adjacency within 30-min buffer collides, unlike the half-open route rule)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: vault_conservation_dispatch_then_recall
        grounds:
          - calculations.vault_cash_position
          - state_machines.ReplenishmentOrder.DISPATCHED_to_RECALLED
          - entities.Vault.fields.balance_cents
        distinguishing_aspect: |
          Conserved quantity: balance_cents + in_transit_cents + in_machine_cents ==
          provisioned_cents. Dispatch debits balance/credits in_transit; recall (compensation)
          credits balance/debits in_transit; after both the three-way sum equals provisioned and
          balance returns to its pre-dispatch value with zero drift.
        test_recipe:
          setup:
            - "Vault provisioned 10000000. ATM. One order of 200000 dispatched (balance 9800000, in_transit 200000)."
          setup_api_calls:
            - call: "POST /vaults"
              payload: { name: "V17", provisioned_cents: 10000000 }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v_ver0: $.data.version }
            - call: "POST /routes"
              payload: { carrier_name: "Acme", vault_id: "${v_id}" }
              as: PlatformAdmin
              captures: { route_id: $.data.id }
            - call: "POST /site-merchants"
              payload: { legal_name: "M", commission_pct_bps: 1000, commission_flat_per_wd_cents: 10, commission_monthly_ceiling_cents: 50000 }
              as: PlatformAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "S", jurisdiction_code: "CA", site_merchant_id: "${sm_id}", route_id: "${route_id}", address: "1 C" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /atms"
              payload: { serial_no: "SN-INV", location_id: "${loc_id}", surcharge_cents: 100, note_denomination_cents: 2000 }
              as: PlatformAdmin
              captures: { atm_id: $.data.id }
            - call: "POST /replenishment-orders"
              payload: { atm_id: "${atm_id}", route_id: "${route_id}", order_amount_cents: 200000, service_window_start: "2026-01-05T08:00:00Z", service_window_end: "2026-01-05T10:00:00Z" }
              as: VaultController
              captures: { ro_id: $.data.id }
            - call: "POST /replenishment-orders/${ro_id}/dispatch"
              payload: { expected_vault_version: "${v_ver0}" }
              as: VaultController
          trigger:
            - call: "POST /replenishment-orders/${ro_id}/recall"
              payload: {}
              as: VaultController
              captures: { st: $.data.status }
            - call: "GET /vaults/${v_id}"
              payload: {}
              as: VaultController
              captures: { bal: $.data.balance_cents, it: $.data.in_transit_cents, im: $.data.in_machine_cents }
          assert:
            - "ReplenishmentOrder status == RECALLED"
            - "Vault balance_cents == 10000000 (restored to pre-dispatch)"
            - "Vault in_transit_cents == 0 and in_machine_cents == 0"
            - "balance_cents + in_transit_cents + in_machine_cents == 10000000 (== provisioned_cents, zero drift)"

      - name: commission_ceiling_headroom_accrue_then_void
        grounds:
          - calculations.commission_split
          - state_machines.CommissionStatement.ACCRUED_to_VOIDED
          - entities.SiteMerchant.fields.commission_monthly_ceiling_cents
        distinguishing_aspect: |
          DIFFERENT conserved quantity (month-to-date commission ceiling headroom): accruing a
          statement consumes headroom; voiding it (compensation) restores month-to-date paid by
          exactly commission_cents, so a subsequent settle on the same merchant earns the full
          uncapped amount again — headroom returns to its pre-accrual value.
        test_recipe:
          setup:
            - "Merchant pct 5000bps flat 0 ceiling 200. ATM1 settled producing an ACCRUED statement of 161 (run1). ATM2 has 5 withdrawals; run2 DRAFT."
          setup_api_calls:
            - call: "POST /vaults"
              payload: { name: "V18", provisioned_cents: 100000000 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /routes"
              payload: { carrier_name: "Acme", vault_id: "${v_id}" }
              as: PlatformAdmin
              captures: { route_id: $.data.id }
            - call: "POST /site-merchants"
              payload: { legal_name: "Cap2", commission_pct_bps: 5000, commission_flat_per_wd_cents: 0, commission_monthly_ceiling_cents: 200, commission_basis: "PCT_ONLY" }
              as: PlatformAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "S", jurisdiction_code: "CA", site_merchant_id: "${sm_id}", route_id: "${route_id}", address: "1 C" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /atms"
              payload: { serial_no: "SN-V1", location_id: "${loc_id}", surcharge_cents: 295, note_denomination_cents: 2000 }
              as: PlatformAdmin
              captures: { atm1: $.data.id }
            - call: "POST /atms"
              payload: { serial_no: "SN-V2", location_id: "${loc_id}", surcharge_cents: 295, note_denomination_cents: 2000 }
              as: PlatformAdmin
              captures: { atm2: $.data.id }
            - call: "POST /atms/${atm1}/fee-disclosures"
              payload: { disclosed_surcharge_cents: 295, ack_text_present: true }
              as: ComplianceOfficer
              captures: { fd1: $.data.id }
            - call: "POST /fee-disclosures/${fd1}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /atms/${atm2}/fee-disclosures"
              payload: { disclosed_surcharge_cents: 295, ack_text_present: true }
              as: ComplianceOfficer
              captures: { fd2: $.data.id }
            - call: "POST /fee-disclosures/${fd2}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /atms/${atm1}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 2000 }
              as: FieldTech
            - call: "POST /settlement-runs"
              payload: { atm_id: "${atm1}", window_start: "2026-01-01T00:00:00Z", window_end: "2026-02-01T00:00:00Z" }
              as: SettlementOfficer
              captures: { run1: $.data.id }
            - call: "POST /settlement-runs/${run1}/settle"
              payload: {}
              as: SettlementOfficer
            - call: "GET /commission-statements?settlement_run_id=${run1}"
              payload: {}
              as: SettlementOfficer
              captures: { cs1: $.data.0.id }
            - call: "POST /_inject/atm_monthly_wd_count"
              payload: { atm_id: "${atm2}", monthly_wd_count: 498 }
              as: PlatformAdmin
            - call: "POST /atms/${atm2}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 2000 }
              as: FieldTech
            - call: "POST /atms/${atm2}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 2000 }
              as: FieldTech
            - call: "POST /atms/${atm2}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 2000 }
              as: FieldTech
            - call: "POST /atms/${atm2}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 2000 }
              as: FieldTech
            - call: "POST /atms/${atm2}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 2000 }
              as: FieldTech
            - call: "POST /settlement-runs"
              payload: { atm_id: "${atm2}", window_start: "2026-01-01T00:00:00Z", window_end: "2026-02-01T00:00:00Z" }
              as: SettlementOfficer
              captures: { run2: $.data.id }
          trigger:
            - call: "POST /commission-statements/${cs1}/void"
              payload: {}
              as: SettlementOfficer
            - call: "POST /settlement-runs/${run2}/settle"
              payload: {}
              as: SettlementOfficer
