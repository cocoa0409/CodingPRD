  - rule_id: combinatorial_formula
    instances:
      - name: baf_pct_nonlinear_tier_composition
        grounds:
          - calculations.bunker_adjustment_factor
          - entities.Invoice.fields.baf_pct
          - entities.Invoice.fields.baf_usd
          - entities.IndexQuote.fields.price_usd_per_mt
          - entities.Port.fields.eca_zone
          - entities.Nomination.fields.delivery_mode
        distinguishing_aspect: |
          Mode (a): baf_pct composes five interacting inputs with non-linear behaviour - a
          three-step volatility ladder over two IndexQuote rows, a delivery_mode premium, an
          ECA premium, a tonnage tier discount that only fires at >= 1000.000 mt, and a
          nested clamp min(0.045, max(0.010, raw)); a 5.7447% price move lands on the middle
          step so baf_pct is exactly 0.0350 and baf_usd 31270.56.
        test_recipe:
          setup:
            - "Base fixture through invoice creation: ECA port, BARGE mode, quotes 705.00 then 745.50 for the same grade, quantity_basis_mt 1198.450 (>= the 1000.000 tier threshold)"
            - "Volatility = (745.50 - 705.00) / 705.00 = 5.7447%, which sits in [5%, 10%) so volatility_step is 0.010"
            - "Composition: 0.020 base + 0.010 volatility + 0.005 BARGE + 0.010 ECA - 0.010 tier = 0.035, inside the clamp band"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: OpsCoordinator
            - call: "POST /ports"
              payload: { port_code: "NLRTM", name: "Rotterdam", eca_zone: true, eca_sulfur_limit_pct: 0.100, notice_lead_hours: 24, concurrent_ops_capacity: 2, spill_response_tier: "TIER_1" }
              as: OpsCoordinator
              captures: { port_id: $.data.id }
            - call: "POST /fuel-grades"
              payload: { grade_code: "MGO-DMA", max_sulfur_pct: 0.100, eca_permitted: true, test_tolerance_pct: 0.010, index_code: "MGO-ARA", base_barging_rate_usd_per_mt: 9.50, min_barging_fee_usd: 2000.00, cross_contamination_group: "DISTILLATE" }
              as: OpsCoordinator
              captures: { grade_id: $.data.id }
            - call: "POST /index-quotes"
              payload: { grade_id: "${grade_id}", quote_date: "2026-08-03T00:00:00Z", price_usd_per_mt: 705.00, source: "PLATTS" }
              as: OpsCoordinator
            - call: "POST /index-quotes"
              payload: { grade_id: "${grade_id}", quote_date: "2026-08-10T00:00:00Z", price_usd_per_mt: 745.50, source: "PLATTS" }
              as: OpsCoordinator
            - call: "POST /customers"
              payload: { name: "Aegean Lines", credit_limit_usd: 5000000.00, payment_terms_days: 30, settlement_basis: "SUPPLIER_FIGURES" }
              as: CreditController
              captures: { cust_id: $.data.id }
            - call: "POST /delivery-assets"
              payload: { name: "Bunker Alpha", asset_type: "BARGE", capacity_mt: 3000.000, home_port_id: "${port_id}", boom_certified: true, segregated_tanks: false, turnaround_buffer_minutes: 90 }
              as: OpsCoordinator
              captures: { asset_id: $.data.id }
            - call: "POST /nominations"
              payload: { customer_id: "${cust_id}", port_id: "${port_id}", grade_id: "${grade_id}", vessel_imo: "9123456", vessel_name: "MV Anemos", scrubber_fitted: false, nominated_quantity_mt: 1200.000, window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-11T06:00:00Z", delivery_mode: "BARGE", declared_sulfur_pct: 0.100, eca_documentation_ref: "CHG-2026-0001" }
              as: OpsCoordinator
              captures: { nom_id: $.data.id }
            - call: "POST /nominations/${nom_id}/compliance-review"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-001"
            - call: "POST /nominations/${nom_id}/confirm"
              payload: {}
              as: OpsCoordinator
              captures: { nom_v3: $.data.version }
            - call: "POST /delivery-orders"
              payload: { nomination_id: "${nom_id}", asset_id: "${asset_id}", planned_quantity_mt: 1200.000, slot_start: "2026-08-10T06:00:00Z", slot_end: "2026-08-10T12:00:00Z", expected_nomination_version: "${nom_v3}" }
              as: OpsCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T06:30:00Z" }
              as: OpsCoordinator
            - call: "POST /delivery-orders/${order_id}/clear"
              payload: { port_clearance_ref: "PA-RTM-0001" }
              as: OpsCoordinator
            - call: "POST /delivery-orders/${order_id}/start-pumping"
              payload: {}
              as: BargeMaster
              as_user_id: "${asset_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T14:30:00Z" }
              as: OpsCoordinator
            - call: "POST /delivery-orders/${order_id}/complete-pumping"
              payload: { barge_sounding_mt: 1198.450, vessel_sounding_mt: 1191.200, meter_mt: 1197.800 }
              as: BargeMaster
              as_user_id: "${asset_id}"
            - call: "POST /bunker-delivery-notes"
              payload: { delivery_order_id: "${order_id}", bdn_number: "BDN-2026-0001", declared_sulfur_pct: 0.098, sample_seal_number: "SEAL-0001" }
              as: OpsCoordinator
              as_user_id: "ops-001"
          trigger:
            - call: "POST /invoices"
              payload: { delivery_order_id: "${order_id}", pricing_date: "2026-08-10T12:00:00Z" }
              as: CreditController
              as_user_id: "cc-001"
              captures: { inv_id: $.data.id }
          assert:
            - "Invoice.${inv_id}.index_price_usd_per_mt == 745.50"
            - "Invoice.${inv_id}.baf_pct == 0.0350"
            - "Invoice.${inv_id}.fuel_cost_usd == 893444.48"
            - "Invoice.${inv_id}.baf_usd == 31270.56"
            - "Invoice.${inv_id}.eca_surcharge_usd == 5093.41"
            - "baf_pct is NOT 0.0450 (no clamp at the ceiling) and NOT 0.0250 (the tier discount did fire because quantity_basis_mt 1198.450 >= 1000.000)"

      - name: invoice_component_rounding_order_pinned
        grounds:
          - calculations.invoice_amount
          - entities.Invoice.fields.fuel_cost_usd
          - entities.Invoice.fields.barging_fee_usd
          - entities.Invoice.fields.provisional_amount_usd
          - entities.FuelGrade.fields.min_barging_fee_usd
        distinguishing_aspect: |
          Mode (b): each of the four components is rounded to 2dp BEFORE summation, so
          provisional_amount_usd is exactly 941193.73; summing the unrounded components and
          rounding once would give 941193.72, a one-cent divergence on the same inputs, and the
          BAF is applied to the already-rounded fuel_cost_usd rather than to the raw product.
        test_recipe:
          setup:
            - "Identical fixture to baf_pct_nonlinear_tier_composition: quantity_basis_mt 1198.450, index price 745.50, baf_pct 0.0350, barging rate 9.50/mt with min fee 2000.00, ECA surcharge 4.25/mt"
            - "Unrounded components: 893444.475 + 31270.556625 + 11385.275 + 5093.4125 = 941193.719125"
          setup_api_calls:
