            - "cnt_after_2 == 2 and posture_after_2 == AT_RISK (link 3: threshold 2 crossed)"
            - "ship_err == ERR_PO_AT_RISK_BLOCKS_SCHEDULING (STANDARD shipment with no BACKORDERED line gated by posture)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: po_accept_state_error_beats_fiscal_cap_error
        grounds:
          - validations[priority=6]
          - validations[priority=15]
        distinguishing_aspect: |
          Error-category pair (state vs business_fiscal): accepting a CANCELLED PO whose
          total_cents (220000) also exceeds the district's remaining fiscal cap (200000) must
          return ERR_INVALID_STATE (priority 6), never ERR_DISTRICT_FISCAL_CAP_EXCEEDED
          (priority 15) — a different category pair than temporal-vs-referential.
        test_recipe:
          setup:
            - "District D1 with annual_cap_cents 200000; flat award (11000) accepted; PO with line qty 20 (total 220000 > cap); PO cancelled while RECEIVED"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 200000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
            - { call: "POST /v1/bid-specs", payload: { district_id: "${d1}", title: "Spec A", bid_due_date: "2026-04-01", delivery_window_start: "2026-06-15", delivery_window_end: "2026-08-15" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { specA: $.data.id } }
            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${specA}", manufacturer: "Acme", model: "Desk-100", qty: 500, max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { slA: $.data.id } }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/close", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
