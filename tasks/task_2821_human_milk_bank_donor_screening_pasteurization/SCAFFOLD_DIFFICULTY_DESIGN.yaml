  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: thermal_hold_exact_1800_seconds
        grounds:
          - calculations.thermal_hold_verification
          - entities.PasteurizationRun.fields.longest_hold_seconds
          - entities.PasteurizationRun.fields.thermal_status
          - entities.TemperatureReading.fields.offset_seconds
          - state_machines.PasteurizationRun.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Metric: hold duration in whole seconds, at the inclusive threshold MIN_HOLD_SECONDS
          (1800), on the endpoint POST /milk-bank/pasteurization-runs/{id}/complete. Two runs on
          the same committed pool differ only in their last reading offset: 1800 s gives
          longest_hold_seconds 1800 and thermal_status PASSED (>= is inclusive), 1799 s gives
          1799 and FAILED. A strict `>` comparison flips the first run to FAILED and destroys
          conforming milk; an off-by-one window flips the second to PASSED and releases
          under-pasteurized milk.
        test_recipe:
          setup:
            - "Logical clock is 2026-08-10T10:05:00Z."
            - "Pool POOL-0001 is COMMITTED with 2100 ml from three distinct donors."
            - "Run A on PAST-01 is IN_PROGRESS with readings at 0, 600, 1200 and 1800 s, all inside the closed band 62.5-65.0 C and every gap exactly 600 s."
            - "Run B on PAST-02 is IN_PROGRESS on the same pool with readings at 0, 600, 1200 and 1799 s, also all in band."
