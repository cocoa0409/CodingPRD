            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "BIG", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_big: $.data.id, big_v: $.data.version } }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "SML", capacity_head: 1500, floor_space_sqft: 7000 }, as: IntegratorAdmin, captures: { barn_sml: $.data.id, sml_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
          trigger:
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_big}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 1201, avg_start_weight_lbs: 50.0, expected_barn_version: "${big_v}" }, as: FieldTech, captures: { err1: $.data.error_id } }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_sml}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 1000, avg_start_weight_lbs: 50.0, expected_barn_version: "${sml_v}" }, as: FieldTech, captures: { err2: $.data.error_id } }
          assert:
