              captures: { k_rec_b: $.data.id }
            - call: "POST /referrals/${k_ref_b}/medical-records/${k_rec_b}/verify"
              payload: {}
              as: CaseReviewer
              as_user_id: "cr-boris"
            - call: "POST /referrals/${k_ref_b}/submit-review"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-drew"
            - call: "POST /visit-cases"
