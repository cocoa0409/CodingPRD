            - "Visit 3 (C02, 12:00:01-14:00) returns 201 — one second past the touch point clears the closed-interval test"
            - "AccessVisit.${v3_id}.escort_required == true and AccessVisit.${v3_id}.status == SCHEDULED"
            - "After cancelling visits 1 and 3, GET /colocation/access-visits?contract_id=${ctr_id}&status=SCHEDULED returns 0 visits"
            - "Visit 4 (C02, 12:00-14:00) now returns 201, proving CANCELLED visits release the row escort slot"
            - "AccessVisit.${v4_id}.escort_required == true and AccessVisit.${v4_id}.escort_officer_user_id == null before check-in"

  - rule_id: compensating_invariant
    instances:
      - name: de_energize_then_re_energize_restores_every_rollup_without_drift
        grounds:
          - state_machines.PowerCircuit.ENERGIZED_to_DE_ENERGIZED
          - state_machines.PowerCircuit.DE_ENERGIZED_to_ENERGIZED
          - state_machines.Cabinet.CAPACITY_HELD_to_RESERVED
          - state_machines.PowerCircuit.BLOCKED_to_DESIGNED
          - calculations.row_capacity_and_posture
          - calculations.contract_provisioning_rollup
        distinguishing_aspect: |
          De-energizing unwinds the five-hop energize cascade EXACTLY and in reverse — row
          allocated_power_kw and cooling_load_kw return to 0.000, the row's posture returns to
          OPEN, the neighbour cabinet returns CAPACITY_HELD to RESERVED and its circuit BLOCKED
          to DESIGNED — while the reservation-derived quantities that de-energization must NOT
          touch (occupied_slot_count 2 and density_ceiling_kw 16.000) stay put. Re-energizing
          reproduces 17.280 / 17.280 / DENSITY_CAPPED to the last digit, so the round trip
          leaves zero residue in either direction.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Row HI/R1: design_density_kw_per_cabinet 8.0, max_row_power_kw 200.0, cooling_capacity_kw 60.0."
            - "Contract ACTIVE, committed_cabinet_count 2, power_commit_kw 20.0."
            - "Cabinet C01 rated 18.0 kW INSTALLED with one 90A/240V/SINGLE PRIMARY circuit already ENERGIZED (allocated 17.280), which has driven the row to DENSITY_CAPPED (ceiling 16.000)."
            - "Cabinet C02 rated 10.0 kW therefore already CAPACITY_HELD, its 25A/240V PRIMARY circuit already BLOCKED."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Lodestar Robotics", account_code: "LDS" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
            - call: "POST /colocation/rows"
              payload: { hall_code: "HI", row_code: "R1", cabinet_slot_count: 8, design_density_kw_per_cabinet: 8.0, max_row_power_kw: 200.0, cooling_capacity_kw: 60.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_id: $.data.id }
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-9018", billing_mode: "COMMITTED_ONLY", committed_cabinet_count: 2, power_commit_kw: 20.0, committed_bandwidth_mbps: 1000, cross_connect_cap: 4, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", committed_cage_sqft: 0, redundancy_requirement: "N", cross_connect_allowance: 0, remote_hands_included_minutes: 0 }
              as: BillingOperator
              captures: { ctr_id: $.data.id }
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "PENDING_ACTIVATION" }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C01", rated_power_kw: 18.0, footprint_type: "CABINET", u_height: 42 }
              as: FacilityManager
              captures: { cab1_id: $.data.id }
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C02", rated_power_kw: 10.0, footprint_type: "CABINET", u_height: 42 }
              as: FacilityManager
              captures: { cab2_id: $.data.id }
            - call: "POST /colocation/cabinets/${cab1_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "ACTIVE" }
              as: FacilityManager
            - call: "POST /colocation/cabinets/${cab1_id}/state"
              payload: { to_state: "INSTALLED" }
              as: FacilityManager
            - call: "POST /colocation/cabinets/${cab2_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
            - call: "POST /colocation/power-circuits"
              payload: { cabinet_id: "${cab1_id}", circuit_code: "A-1", feed_side: "A", redundancy_role: "PRIMARY", breaker_amps: 90, volts: 240, phase: "SINGLE" }
              as: ProvisioningEngineer
              captures: { cir1_id: $.data.id }
            - call: "POST /colocation/power-circuits"
              payload: { cabinet_id: "${cab2_id}", circuit_code: "A-2", feed_side: "A", redundancy_role: "PRIMARY", breaker_amps: 25, volts: 240, phase: "SINGLE" }
              as: ProvisioningEngineer
              captures: { cir2_id: $.data.id }
            - call: "POST /colocation/power-circuits/${cir1_id}/state"
              payload: { to_state: "APPROVED" }
              as: FacilityManager
            - call: "GET /colocation/rows/${row_id}"
              as: FacilityManager
              captures: { rv1: $.data.version }
            - call: "POST /colocation/power-circuits/${cir1_id}/energize"
              payload: { expected_row_version: "${rv1}" }
              as: ProvisioningEngineer
          trigger:
            - call: "POST /colocation/power-circuits/${cir1_id}/state"
              payload: { to_state: "DE_ENERGIZED" }
              as: FacilityManager
            - call: "GET /colocation/rows/${row_id}"
              as: FacilityManager
              captures: { rv2: $.data.version }
            - call: "POST /colocation/power-circuits/${cir1_id}/energize"
              payload: { expected_row_version: "${rv2}" }
              as: ProvisioningEngineer
          assert:
            - "After de-energization PowerCircuit.${cir1_id}.status == DE_ENERGIZED with allocated_kw == 0.000 and cooling_contribution_kw == 0.000"
            - "After de-energization Cabinet.${cab1_id}.status == INSTALLED, allocated_power_kw == 0.000, cooling_load_kw == 0.000, energized_primary_circuit_count == 0"
            - "After de-energization FloorRow.${row_id}.allocated_power_kw == 0.000, cooling_load_kw == 0.000, energized_cabinet_count == 0, row_status == OPEN"
            - "Untouched by the compensation: FloorRow.${row_id}.occupied_slot_count == 2, density_ceiling_kw == 16.000, effective_ceiling_kw == 16.000, stranded_nameplate_kw == 16.000, stranded_measured_kw == 16.000"
            - "After de-energization Cabinet.${cab2_id}.status == RESERVED and PowerCircuit.${cir2_id}.status == DESIGNED"
            - "After de-energization Contract.${ctr_id}.provisioned_power_kw == 0.000, stranded_commit_kw == 20.000, commit_utilization_pct == 0.0"
            - "After re-energization PowerCircuit.${cir1_id}.status == ENERGIZED with allocated_kw == 17.280 and cooling_contribution_kw == 17.280"
            - "After re-energization Cabinet.${cab1_id}.status == ACTIVE, FloorRow.${row_id}.allocated_power_kw == 17.280, cooling_load_kw == 17.280, row_status == DENSITY_CAPPED, stranded_nameplate_kw == -1.280"
            - "After re-energization Cabinet.${cab2_id}.status == CAPACITY_HELD, PowerCircuit.${cir2_id}.status == BLOCKED"
            - "After re-energization Contract.${ctr_id}.provisioned_power_kw == 17.280, stranded_commit_kw == 2.720, commit_utilization_pct == 86.4 — identical to the pre-compensation figures"

      - name: remote_hands_reversal_restores_both_money_and_bundled_minutes
        grounds:
          - endpoints.POST_colocation_contracts_contract_id_invoice_adjustments
          - calculations.remote_hands_labor_charge
          - calculations.contract_provisioning_rollup
          - validations.priority_14_ERR_LINE_ALREADY_REVERSED
          - entities.InvoiceLine.fields.included_minutes_consumed
          - entities.InvoiceLine.fields.reversed
        distinguishing_aspect: |
          The compensating REVERSAL has to undo TWO different ledgers from one immutable line:
          the money (billed_total_usd back from 62.50 to 0.00 by appending -62.50 rather than
          mutating or deleting the original) and the non-monetary bundle
          (remote_hands_remaining_minutes back from 0 to 15, driven by the line's
          included_minutes_consumed of 15, not by the charged amount). The original line stays
          in the ledger with reversed == true, and neither it nor the REVERSAL itself can be
          compensated a second time.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z and is advanced to 2026-08-01T10:00:00Z before completion."
            - "Contract ACTIVE with remote_hands_included_minutes 15, cabinet C01 INSTALLED."
            - "Two REMOTE_HANDS contacts; one STANDARD ticket AUTHORIZED and DISPATCHED at 2026-08-01T00:00:00Z (deadline 08:00, sla_breached false)."
            - "The ticket is completed with a single in-hours 20-minute segment 09:00-09:20, which bills 2 increments, absorbs 1 into the bundle and charges 62.50."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Windlass Freight", account_code: "WDL" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
            - call: "POST /colocation/contacts"
              payload: { customer_id: "${cust_id}", full_name: "Zeno Requester", authorization_scopes: ["REMOTE_HANDS"], access_level: "UNESCORTED" }
              as: SecurityOfficer
              captures: { con_req_id: $.data.id }
            - call: "POST /colocation/contacts"
              payload: { customer_id: "${cust_id}", full_name: "Ada Approver", authorization_scopes: ["REMOTE_HANDS"], access_level: "UNESCORTED" }
              as: SecurityOfficer
              captures: { con_auth_id: $.data.id }
            - call: "POST /colocation/rows"
              payload: { hall_code: "HJ", row_code: "R1", cabinet_slot_count: 8, design_density_kw_per_cabinet: 25.0, max_row_power_kw: 200.0, cooling_capacity_kw: 60.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_id: $.data.id }
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-9019", billing_mode: "COMMITTED_ONLY", committed_cabinet_count: 1, power_commit_kw: 20.0, committed_bandwidth_mbps: 1000, cross_connect_cap: 4, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", committed_cage_sqft: 0, redundancy_requirement: "N", cross_connect_allowance: 0, remote_hands_included_minutes: 15 }
              as: BillingOperator
              captures: { ctr_id: $.data.id }
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "PENDING_ACTIVATION" }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C01", rated_power_kw: 20.0, footprint_type: "CABINET", u_height: 42 }
              as: FacilityManager
              captures: { cab_id: $.data.id }
            - call: "POST /colocation/cabinets/${cab_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "ACTIVE" }
              as: FacilityManager
            - call: "POST /colocation/cabinets/${cab_id}/state"
              payload: { to_state: "INSTALLED" }
              as: FacilityManager
            - call: "POST /colocation/remote-hands-tickets"
              payload: { contract_id: "${ctr_id}", requested_by_contact_id: "${con_req_id}", target_cabinet_id: "${cab_id}", severity: "STANDARD", description: "Reterminate a copper lead" }
              as: ProvisioningEngineer
              as_user_id: "eng-1"
              captures: { tkt_id: $.data.id }
            - call: "POST /colocation/remote-hands-tickets/${tkt_id}/authorization"
              payload: { to_state: "AUTHORIZED", authorizing_contact_id: "${con_auth_id}" }
              as: SecurityOfficer
              as_user_id: "sec-1"
            - call: "POST /colocation/remote-hands-tickets/${tkt_id}/dispatch"
              as: ProvisioningEngineer
              as_user_id: "eng-2"
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/remote-hands-tickets/${tkt_id}/complete"
              payload: { work_segments: [{ started_at: "2026-08-01T09:00:00Z", ended_at: "2026-08-01T09:20:00Z" }] }
              as: ProvisioningEngineer
              as_user_id: "eng-2"
            - call: "GET /colocation/invoice-lines"
              payload: { contract_id: "${ctr_id}", line_type: "REMOTE_HANDS" }
              as: BillingOperator
              captures: { line_id: "$.data[0].id" }
          trigger:
            - call: "POST /colocation/contracts/${ctr_id}/invoice-adjustments"
              payload: { invoice_line_id: "${line_id}", reason: "Work was performed under an existing project credit" }
              as: BillingOperator
              captures: { rev_id: $.data.id }
            - call: "POST /colocation/contracts/${ctr_id}/invoice-adjustments"
              payload: { invoice_line_id: "${line_id}", reason: "Duplicate adjustment attempt" }
              as: BillingOperator
            - call: "POST /colocation/contracts/${ctr_id}/invoice-adjustments"
              payload: { invoice_line_id: "${rev_id}", reason: "Attempt to compensate the compensation" }
              as: BillingOperator
          assert:
            - "Before the trigger: RemoteHandsTicket.${tkt_id}.billable_increments == 2, billed_minutes == 30, included_increments_applied == 1, labor_charge_usd == 62.50; Contract.${ctr_id}.remote_hands_remaining_minutes == 0 and billed_total_usd == 62.50"
            - "InvoiceLine.${line_id}.line_type == REMOTE_HANDS, amount_usd == 62.50, quantity == 1, included_minutes_consumed == 15, source_ref_id == ${tkt_id}"
            - "The first adjustment returns 201: InvoiceLine.${rev_id}.line_type == REVERSAL, amount_usd == -62.50 and source_ref_id == ${line_id}"
            - "InvoiceLine.${line_id}.reversed == true and its amount_usd is still 62.50 — the original line is never mutated or deleted"
            - "Contract.${ctr_id}.billed_total_usd == 0.00"
            - "Contract.${ctr_id}.remote_hands_remaining_minutes == 15, restored from the reversed line's included_minutes_consumed"
            - "RemoteHandsTicket.${tkt_id}.labor_charge_usd is still 62.50 and execution_state is still COMPLETED — the ticket is not rewritten by the ledger compensation"
            - "The second adjustment on the same line returns 409 ERR_LINE_ALREADY_REVERSED"
            - "The adjustment targeting the REVERSAL line returns 409 ERR_LINE_ALREADY_REVERSED"
            - "GET /colocation/invoice-lines?contract_id=${ctr_id} returns exactly 2 lines, so the refused attempts appended nothing"
