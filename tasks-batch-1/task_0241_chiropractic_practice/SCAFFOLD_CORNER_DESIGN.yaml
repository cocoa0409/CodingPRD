          trigger:
            - call: "POST /patients/${pt_id}/appointments"
              payload: { provider_id: "${prov_id}", treatment_room_id: "${room_id}", visit_type: "ADJUSTMENT", scheduled_start: "2026-03-10T17:00:00Z", duration_minutes: 15, insurance_policy_id: "${pol_id}" }
              as: FrontDesk
              captures: { appt_id: $.data.id, cac: $.data.counts_against_cap }
            - call: "GET /patients/${pt_id}/insurance-policies"
              payload: { status: "ACTIVE" }
              as: BillingClerk
          assert:
            - "Appointment.${appt_id}.counts_against_cap == true"
            - "the GET shows InsurancePolicy.${pol_id}.visits_reserved == 1"
