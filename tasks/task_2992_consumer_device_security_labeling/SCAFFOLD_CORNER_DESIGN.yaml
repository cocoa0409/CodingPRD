              payload: { retailer_id: "${retailer_id}", label_grant_id: "${grant_id}", channel: "IN_STORE", display_from: "2026-08-01T00:00:00Z", display_until: "2027-07-01T00:00:00Z" }
              as: Retailer
              as_user_id: "${retailer_id}"
