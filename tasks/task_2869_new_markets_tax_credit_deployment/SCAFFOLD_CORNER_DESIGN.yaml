          - errors[ERR_QEI_RECAPTURED]
          - errors[ERR_QALICB_DISQUALIFIED]
        excluded_because:
          difficulty_instance: transitive_cascade / eligibility_failure_cascades_qalicb_to_qlicis_to_qeis_to_award_posture
          rationale: "That instance drives a QALICB to DISQUALIFIED and a QEI to RECAPTURED in one cascade and then asserts both ERR_QALICB_DISQUALIFIED and ERR_QEI_RECAPTURED on follow-up deployments."

