      - call: POST /performance-contracts/${c1_id}/phases/${ov_pc_id}/mobilize
        payload: {}
        as: ESCOEngineer
        as_user_id: ${eng_id}
      assert:
      - 'B mobilize rejected: 409 ERR_PHASE_WINDOW_OVERLAP (intersects A)'
      - 'C mobilize accepted: WorkPhase.${ov_pc_id}.status == MOBILIZED (a.end == c.start is not an overlap under half-open semantics)'
  - name: disruption_occurs_at_window_end_instant_rejected
