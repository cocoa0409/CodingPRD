          - entities.PickStation.current_tote_count
          - entities.PickTask.pick_station_id
        distinguishing_aspect: "The three rank keys are applied in strict order and against LIVE counts. With every station empty, current_tote_count ties, max_concurrent_totes DESC ties between S2 and S3, and station_code ASC picks S2. Once a tote is opened at S2, the next wave's task skips S2 (count 1) and, among the two empty stations, prefers S3 (capacity 5) over S1 (capacity 2) — so the winner changes from S2 to S3 without any station being reconfigured."
