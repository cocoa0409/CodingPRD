              as: ChannelOpsEngineer
          assert:
            - "After setup: ChannelMapping.${map_id}.mapping_state == VERIFIED and parity_state == OUT_OF_PARITY (hash matches, image count 4 < required_image_count 5)"
            - "First load: HTTP 409 with data.error_id == ERR_CONTENT_PARITY_BLOCKED, Promotion.${promo_id}.distribution_status stays NOT_LOADED, and no DistributionBatch exists for the property"
            - "PATCH content: ChannelMapping.${map_id}.content_image_count == 5, parity_state == IN_PARITY, mapping_state still VERIFIED"
            - "Second load: HTTP 200 with Promotion.${promo_id}.distribution_status == LOADING, and exactly one DistributionBatch { payload_kind: PROMOTION, source_ref_kind: PROMOTION, source_ref_id: ${promo_id}, batch_state: QUEUED, total_jobs: 1 } now exists"
            - "Promotion.${promo_id}.approval_status is still DRAFT - the load gate reads the mapping's parity, not the promotion's own approval axis"

