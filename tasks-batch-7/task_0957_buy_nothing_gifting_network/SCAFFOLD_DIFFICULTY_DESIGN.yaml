            - "window [11:15, 12:15] accepted: PickupPlan.${pp2}.status == PROPOSED — starts exactly at existing_end + 15min"

      - name: curb_alert_zone_capacity_and_adjacency
        grounds:
          - calculations.calc_curb_alert_capacity
          - errors[ERR_CURB_ALERT_CAPACITY]
        distinguishing_aspect: |
          Different interval semantics from the pickup instance: half-open
          [starts_at, ends_at) intervals with aggregate capacity (max 3
          mutually overlapping live alerts per (group, zone)) instead of
          pairwise closed-interval buffers. A 4th overlapping alert is
          rejected; an exactly adjacent alert (starts_at == prior ends_at) is
          allowed because half-open adjacency is not overlap.
        test_recipe:
          setup:
            - "Clock 2026-05-10T09:00:00Z; group with member U"
            - "Three live alerts in zone ELM: [09:00,10:00), [09:30,10:30), [09:45,11:00) on 2026-05-12"
