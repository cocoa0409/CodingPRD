              as_user_id: "ops-1"
            - call: "POST /wind-ops/fault-events/${fe3}/remote-reset"
              payload: { reset_outcome: "FAILED" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "POST /wind-ops/fault-events/${fe3}/remote-reset"
              payload: { reset_outcome: "FAILED" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { err_quota: $.data.error_id }
            - call: "POST /wind-ops/fault-events/${fe3}/triage"
              payload: { disposition: "DISPATCH" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
          assert:
            - "the dispatch-only RESETTABLE code returns HTTP 422 with ${err_dispatch_only} == ERR_RESET_NOT_PERMITTED and FaultEvent.${fe1}.triage_state is still RAISED"
            - "the LOCKOUT code returns HTTP 422 with ${err_lockout} == ERR_RESET_NOT_PERMITTED and FaultEvent.${fe2}.triage_state is still RAISED"
            - "the permitted code's triage succeeds, moving FaultEvent.${fe3} to RESET_PENDING with reset_attempt_count 0 while Turbine.${t3}.availability_state stays FAULTED"
            - "the first FAILED reset returns 200, leaves triage_state == RESET_PENDING and sets reset_attempt_count == 1 with Turbine.${t3}.remote_reset_count_24h == 1"
            - "the second FAILED reset returns HTTP 422 with ${err_quota} == ERR_RESET_QUOTA_EXHAUSTED, since reset_attempt_count 1 has reached max_remote_resets_pinned 1"
            - "after the refusal reset_attempt_count is still 1 and Turbine.${t3}.remote_reset_count_24h is still 1, so a refused attempt is not counted"
            - "the DISPATCH triage from RESET_PENDING succeeds, moving FaultEvent.${fe3} to DISPATCH_REQUIRED with reset_attempt_count still 1"
      - name: turbine_parallel_dimensions_combine_without_interfering
        claim_type: valid_transition
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Turbine
        excluded_because:
          difficulty_instance: turbine_availability_and_curtailment_dimensions_advance_independently
          rationale: |
            The parallel-shape corner - each dimension advancing on its own triggers and the combined
            state being read correctly - is exactly what that §1.8 instance walks, including the
            FAULTED x FORCED_STOP crossing that no single-dimension corner can reach.
      - name: work_order_revision_back_edge_is_bounded
        claim_type: precondition_enforcement
        grounds:
          - state_machines.WorkOrder
          - validations[priority=76]
          - errors[ERR_REVISION_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: work_order_revision_cycle_terminates_at_three_rounds
          rationale: |
            The cyclic-shape termination condition and its ERR_REVISION_LIMIT_EXCEEDED refusal are
            walked round by round there, including the subtlety that re-submission is never gated by
            revision_round.
      - name: replacement_cancellation_reverses_its_own_side_effects
        claim_type: side_effect_execution
        grounds:
          - state_machines.ComponentReplacement
          - state_machines.CraneMobilization
          - entities.SparePart
        excluded_because:
          difficulty_instance: replacement_cancellation_cascades_four_hops_and_reprices_the_surviving_reservation
          rationale: |
            The compensation pattern - undo transition reverses the spare-part reservation, demobilizes
            the crane only when the last reservation leaves, and reprices what survives - is covered
            hop by hop by that §1.8 instance.
      - name: work_order_completion_cascade_reaches_every_dependent_row
        claim_type: side_effect_execution
        grounds:
          - state_machines.WorkOrder
          - state_machines.FaultEvent
          - state_machines.BladeDamage
          - state_machines.ComponentReplacement
        excluded_because:
          difficulty_instance: work_order_completion_cascades_six_hops_into_an_unnamed_work_orders_priority_score
          rationale: |
            Cascade-down and bubble-up on completion, ending in a priority_score change on a row the
            request never named, is the whole subject of that §1.8 instance.
      - name: replacement_fork_join_paths_both_terminate_in_executed
        claim_type: valid_transition
        grounds:
          - state_machines.ComponentReplacement
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: component_replacement_fork_join_executes_with_divergent_ledger_postings
          rationale: |
            Both fork arms (crane-reserved and uptower) reaching the shared EXECUTED join with
            different ledger postings is walked there; a separate corner would only re-run one arm.
      - name: guarded_transition_reads_a_second_entitys_state
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ComponentReplacement
          - entities.SparePart.fields.status
          - errors[ERR_SPARE_PART_UNAVAILABLE]
        excluded_because:
          difficulty_instance: replacement_creation_legality_is_decided_by_the_spare_parts_stock_state
          rationale: |
            The guarded-transition corner needs a cross-entity precondition flipped both ways, which
            that §1.8 instance does by driving one spare-part line through IN_STOCK,
            BELOW_REORDER_POINT and OUT_OF_STOCK.
  - section: calculations
    instances:
      - name: fault_downtime_and_lost_energy_are_derived_from_the_clear_instant_and_filtered_by_the_exclusion_flag
        claim_type: correct_result
        grounds:
          - state_machines.FaultEvent
          - entities.FaultEvent.fields.downtime_hours
          - entities.FaultEvent.fields.lost_energy_kwh
          - entities.Turbine.fields.counted_downtime_hours_period
          - entities.Turbine.fields.cumulative_lost_energy_kwh
        distinguishing_aspect: |
          downtime_hours is measured from raised_at to the cleared_at the LOGICAL CLOCK supplied at
          reset time, not to the close instant, and the contractual_exclusion_pinned flag splits the
          two accumulators: both events add to cumulative_lost_energy_kwh but only the non-excluded
          one adds to counted_downtime_hours_period, the figure the availability guarantee reads.
        test_recipe:
          setup:
            - "one turbine at 2000 kWh/h and two fault code rules, one excluded from the guarantee and one not"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T01:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Elk Basin", region_code: "MT-E", grid_operator_code: "NWMT", road_levy_pct: 2.5, community_levy_pct: 1.5, landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-01", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t_id: $.data.id }
            - call: "POST /wind-ops/fault-code-rules"
              payload: { fault_code: "F-3001", severity_class: "RESETTABLE", max_remote_resets_per_24h: 2, requires_dispatch: false, contractual_exclusion: false }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/fault-code-rules"
              payload: { fault_code: "F-7002", severity_class: "RESETTABLE", max_remote_resets_per_24h: 2, requires_dispatch: false, contractual_exclusion: true }
              as: SiteAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /wind-ops/turbines/${t_id}/fault-events"
