              payload: { district_id: "${send_district_id}", first_name: "Noor", last_name: "Okonkwo", dob: "2011-10-10", grade_level: 9, has_iep: false, guardian_user_id: "guardian-noor" }
              as: RecordsClerk
              captures: { late_student_id: "$.data.id" }
            - call: "POST /records-office/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00.000Z" }
              as: SystemAdmin
            - call: "PATCH /records-office/students/${on_time_student_id}/directory-optout"
              payload: { directory_optout_categories: ["ADDRESS", "PHONE"] }
              as: Parent
              as_user_id: "guardian-mira"
            - call: "POST /records-office/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00.001Z" }
