            - call: "POST /perks/offers"
              payload: { agreement_id: "${agreement_id}", title: "Paused lunch deal", discount_type: "PERCENT", discount_value_bps: 1500, min_spend_cents: 1000, region_codes: ["CA"], window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z" }
