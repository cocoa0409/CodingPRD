            - "held bed returned to AVAILABLE — Facility.occupancy_pct == 88.89 (8 of 9 unavailable) (link 2)"
            - "InsuranceNotification.${notif_id}.status == VOIDED (compensation leg)"
            - "auto DiversionEvent effective_status == LIFTED with lifted_at set (link 3: 88.89 < 90.0 exit threshold)"
            - "Facility.diversion_status == OPEN after the auto-lift"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: accept_state_error_precedes_diversion_error
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - state_machines.TransferCase.AWAITING_ACCEPTANCE_to_ACCEPTED
        distinguishing_aspect: |
          Category pair state(4) vs business_safety(5): an accept attempted on a
          REFUSED case whose receiving facility is also on ACTIVE diversion MUST
          fail with ERR_INVALID_STATE (409), while the same diverted facility on
          an AWAITING_ACCEPTANCE case fails with ERR_FACILITY_ON_DIVERSION (403) —
          proving state is evaluated before the diversion safety check.
        test_recipe:
          setup:
            - "RCV on ACTIVE ALL_UNITS diversion (declared at 00:00, window 00:00-04:00)"
            - "case1: EMTALA_APPLIES, was AWAITING_ACCEPTANCE at RCV, then REFUSED (diversion declared only after the refusal)"
            - "case2: EMTALA_APPLIES, AWAITING_ACCEPTANCE at RCV with the diversion already ACTIVE; RCV has an AVAILABLE ICU bed so the selector would succeed if reached"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Sending General", facility_code: "SND", trauma_level: "LEVEL_3", capabilities: ["TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_s: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Receiving Trauma Center", facility_code: "RCV", trauma_level: "LEVEL_1", capabilities: ["CARDIAC_CATH"] }
              as: TransferCoordinator
              captures: { fac_r: $.data.id }
            - call: "POST /facilities/${fac_r}/beds"
              payload: { bed_code: "ICU-01", unit_type: "ICU" }
              as: BedManager
              as_user_id: "${fac_r}"
            - call: "POST /physicians"
              payload: { full_name: "Dr Send", facility_id: "${fac_s}", specialty: "EMERGENCY" }
              as: TransferCoordinator
              captures: { phys_s: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Recv", facility_id: "${fac_r}", specialty: "INTENSIVIST" }
              as: TransferCoordinator
              captures: { phys_r: $.data.id }
            - call: "POST /transfer-cases"
              payload: { patient_ref: "PT-PRI-1", sending_facility_id: "${fac_s}", sending_physician_id: "${phys_s}", acuity_level: "EMERGENT", required_unit_type: "ICU", requires_isolation: false, required_capability: "CARDIAC_CATH" }
              as: TransferCoordinator
              captures: { case1: $.data.id }
            - call: "POST /transfer-cases/${case1}/emtala-screening"
              payload: { has_emergency_medical_condition: true, is_stabilized: true }
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case1}/emtala-screening/certify"
              payload: {}
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case1}/request-acceptance"
              payload: { receiving_facility_id: "${fac_r}", receiving_physician_id: "${phys_r}", contact_method: "PHONE" }
              as: TransferCoordinator
            - call: "POST /transfer-cases/${case1}/refuse"
              payload: { refusal_category: "CAPACITY_EXCEEDED", narrative: "All critical care beds occupied; surge protocol already engaged at receiving." }
              as: ReceivingPhysician
              as_user_id: "${phys_r}"
            - call: "POST /facilities/${fac_r}/diversion-events"
              payload: { scope: "ALL_UNITS", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T04:00:00Z", reason: "ER saturation beyond safe boarding levels" }
              as: BedManager
              as_user_id: "${fac_r}"
            - call: "POST /transfer-cases"
              payload: { patient_ref: "PT-PRI-2", sending_facility_id: "${fac_s}", sending_physician_id: "${phys_s}", acuity_level: "EMERGENT", required_unit_type: "ICU", requires_isolation: false, required_capability: "CARDIAC_CATH" }
              as: TransferCoordinator
              captures: { case2: $.data.id }
            - call: "POST /transfer-cases/${case2}/emtala-screening"
              payload: { has_emergency_medical_condition: true, is_stabilized: true }
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case2}/emtala-screening/certify"
              payload: {}
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case2}/request-acceptance"
              payload: { receiving_facility_id: "${fac_r}", receiving_physician_id: "${phys_r}", contact_method: "PHONE" }
              as: TransferCoordinator
          trigger:
            - call: "POST /transfer-cases/${case1}/accept"
              payload: {}
              as: ReceivingPhysician
              as_user_id: "${phys_r}"
              captures: { err_a: $.data.error_id }
            - call: "POST /transfer-cases/${case2}/accept"
              payload: {}
              as: ReceivingPhysician
              as_user_id: "${phys_r}"
              captures: { err_b: $.data.error_id }
          assert:
            - "accept on REFUSED case1 (diversion also active) -> error_id == ERR_INVALID_STATE with http 409 (priority 4 beats priority 5)"
            - "accept on AWAITING_ACCEPTANCE case2 (diversion active) -> error_id == ERR_FACILITY_ON_DIVERSION with http 403"
            - "case1 status remains REFUSED; case2 status remains AWAITING_ACCEPTANCE (no side effects on rejection)"

      - name: dispatch_packet_error_precedes_insurance_error
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - state_machines.TransferCase.ACCEPTED_to_TRANSPORT_ARRANGED
        distinguishing_aspect: |
          Category pair business_referential(6) vs business_fiscal(8) — a
          different pair than state-vs-safety: dispatch with an INCOMPLETE packet
          AND no insurance clearance fails ERR_PACKET_INCOMPLETE (409); once the
          packet is READY the identical dispatch fails ERR_INSURANCE_NOT_CLEARED
          (402), proving referential documentation gates precede the fiscal check.
        test_recipe:
          setup:
            - "URGENT TELEMETRY EMTALA_APPLIES case ACCEPTED at RCV (hold valid 4h from 00:00)"
            - "packet requires [H_AND_P, LABS]; only H_AND_P uploaded -> overall_status INCOMPLETE"
            - "no InsuranceNotification exists for the case"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Sending General", facility_code: "SND", trauma_level: "LEVEL_3", capabilities: ["TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_s: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Receiving Trauma Center", facility_code: "RCV", trauma_level: "LEVEL_1", capabilities: ["CARDIAC_CATH"] }
              as: TransferCoordinator
              captures: { fac_r: $.data.id }
            - call: "POST /facilities/${fac_r}/beds"
              payload: { bed_code: "TEL-01", unit_type: "TELEMETRY" }
              as: BedManager
              as_user_id: "${fac_r}"
            - call: "POST /physicians"
              payload: { full_name: "Dr Send", facility_id: "${fac_s}", specialty: "EMERGENCY" }
              as: TransferCoordinator
              captures: { phys_s: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Recv", facility_id: "${fac_r}", specialty: "CARDIOLOGY" }
              as: TransferCoordinator
              captures: { phys_r: $.data.id }
            - call: "POST /transfer-cases"
              payload: { patient_ref: "PT-PRI-3", sending_facility_id: "${fac_s}", sending_physician_id: "${phys_s}", acuity_level: "URGENT", required_unit_type: "TELEMETRY", requires_isolation: false, required_capability: "CARDIAC_CATH" }
              as: TransferCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /transfer-cases/${case_id}/emtala-screening"
              payload: { has_emergency_medical_condition: true, is_stabilized: true }
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case_id}/emtala-screening/certify"
              payload: {}
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case_id}/request-acceptance"
              payload: { receiving_facility_id: "${fac_r}", receiving_physician_id: "${phys_r}", contact_method: "PHONE" }
              as: TransferCoordinator
            - call: "POST /transfer-cases/${case_id}/accept"
              payload: {}
              as: ReceivingPhysician
              as_user_id: "${phys_r}"
            - call: "POST /transfer-cases/${case_id}/clinical-packet"
              payload: { required_documents: ["H_AND_P", "LABS"] }
              as: SendingPhysician
              as_user_id: "${phys_s}"
              captures: { pkt_id: $.data.id, pkt_v: $.data.version }
            - call: "POST /clinical-packets/${pkt_id}/documents"
              payload: { documents: ["H_AND_P"], expected_clinical_packet_version: "${pkt_v}" }
              as: SendingPhysician
              as_user_id: "${phys_s}"
              captures: { pkt_v2: $.data.version }
          trigger:
            - call: "POST /transfer-cases/${case_id}/dispatch"
              payload: { mode: "GROUND_BLS", crew_capability: "BLS", distance_miles: 12 }
              as: TransferCoordinator
              captures: { err_a: $.data.error_id }
            - call: "POST /clinical-packets/${pkt_id}/documents"
              payload: { documents: ["LABS"], expected_clinical_packet_version: "${pkt_v2}" }
              as: SendingPhysician
              as_user_id: "${phys_s}"
              captures: { pkt_ready: $.data.overall_status }
            - call: "POST /transfer-cases/${case_id}/dispatch"
              payload: { mode: "GROUND_BLS", crew_capability: "BLS", distance_miles: 12 }
              as: TransferCoordinator
              captures: { err_b: $.data.error_id }
          assert:
            - "first dispatch -> error_id == ERR_PACKET_INCOMPLETE with http 409 (priority 6 beats priority 8)"
            - "after uploading LABS: ClinicalPacket.overall_status == READY"
            - "second dispatch -> error_id == ERR_INSURANCE_NOT_CLEARED with http 402 (fiscal check now the first failure)"
            - "TransferCase.${case_id}.status remains ACCEPTED after both rejections"

