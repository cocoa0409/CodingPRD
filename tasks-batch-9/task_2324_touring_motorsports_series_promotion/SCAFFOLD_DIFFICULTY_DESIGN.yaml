scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_provisional_then_final_sponsor_holdback_and_refund_dropout
        grounds:
          - calculations.settlement_net_to_promoter
          - calculations.venue_settlement_due
          - calculations.settlement_payout_waterfall
          - entities.EventSettlement.fields.variant
          - entities.EventSettlement.fields.net_to_promoter_cents
          - state_machines.EventSettlement.PREPARED_to_APPROVED
        distinguishing_aspect: |
          The two variants of settlement_net_to_promoter diverge on TWO independent axes at once:
          the sponsorship inclusion rule (PROVISIONAL recognizes an ACTIVATED activation at 100%,
          FINAL applies SPONSOR_HOLDBACK_PCT to it) and the order inclusion snapshot (FINAL re-reads
          PAID status at approval, so an order refunded after preparation drops out and drags
          venue_settlement_due's adjusted gross, facility total and co-op credit down with it).
          A single-variant implementation cannot produce both 1115750 and -2631850 from the same rows.
        test_recipe:
          setup:
            - "Season '2026-27 Thunder Tour' with a 40000000-cent marketing budget, window 2026-10-01..2027-03-31"
            - "Venue 'Atlanta Dome' (market ATL, 9000 seats, DIRT floor, 4 staging bays, 12h turnaround)"
            - "A CONFIRMED booking for 2026-11-14 (rental_base 3000000, revenue_share 0.12, facility fee 350) and its TourStop with show timing set"
            - "One LIGHT vehicle entry that is CHECKED IN (STAGED) so the purse counts one entry"
            - "One COMPETITION segment, tiers PITSIDE (4750, allot 3000) and UPPER (2500, allot 3000) so expected_attendance == 6000"
            - "A CERTIFIED safety plan provisioned at barrier 1600 / fence 8 / ALS 2 / BLS 3 / ambulance 1 / lanes 2, safety_cost_cents == 854000"
            - "Marketing allocations RADIO 800000 + DIGITAL 1200000 == 2000000 COMMITTED"
            - "Order O_A: PITSIDE, qty 600, group → PAID. Order O_B: UPPER, qty 900 plus 300 pit-party heads → PAID"
            - "Sponsorship activation A1 at fee 1500000 in state ACTIVATED (never fulfilled), holding 20 hospitality seats on UPPER"
            - "Sales CLOSED, no PENDING orders remain"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 Thunder Tour", year: 2026, season_start_date: "2026-10-01", season_end_date: "2027-03-31", total_marketing_budget_cents: 40000000, market_rotation_cooldown_days: 21 }
              as: SeriesPromoter
              captures: { season: "$.data.id" }
            - call: "POST /venues"
              payload: { name: "Atlanta Dome", market_code: "ATL", city: "Atlanta", state_code: "GA", seat_capacity: 9000, floor_type: "DIRT", catch_fence_max_height_ft: 10, medical_bay_count: 2, load_in_hours_required: 10, staging_bay_count: 4, turnaround_hours: 12 }
              as: SeriesPromoter
              captures: { venue_atl: "$.data.id" }
            - call: "POST /venue-bookings"
              payload: { season_id: "${season}", venue_id: "${venue_atl}", tour_date: "2026-11-14", rental_base_cents: 3000000, revenue_share_pct: 0.12, per_ticket_facility_fee_cents: 350, load_in_start_utc: "2026-11-13T14:00:00Z", tear_down_end_utc: "2026-11-15T06:00:00Z" }
              as: SeriesPromoter
              captures: { b_atl: "$.data.id" }
            - call: "POST /venue-bookings/${b_atl}/accept"
              payload: {}
              as: SeriesPromoter
            - call: "GET /tour-stops"
              payload: { venue_booking_id: "${b_atl}" }
              as: SeriesPromoter
              captures: { stop_atl: "$.data[0].id" }
            - call: "PATCH /tour-stops/${stop_atl}/logistics"
              payload: { doors_open_utc: "2026-11-14T22:00:00Z", show_start_utc: "2026-11-14T23:00:00Z", show_window_minutes: 150, pit_party_price_cents: 2450, pit_party_capacity: 400 }
              as: SeriesPromoter
            - call: "POST /competitors"
              payload: { team_name: "Thunder Ridge Racing", driver_name: "R. Anderson", home_market_code: "CLT", vehicle_class: "LIGHT" }
              as: SeriesPromoter
              captures: { comp1: "$.data.id" }
            - call: "POST /vehicle-entries"
              payload: { competitor_id: "${comp1}", tour_stop_id: "${stop_atl}", vehicle_number: "11", vehicle_weight_lbs: 7200, haul_distance_miles: 1200, scheduled_arrival_utc: "2026-11-14T09:00:00Z" }
              as: SeriesPromoter
              captures: { entry1: "$.data.id" }
            - call: "POST /tour-stops/${stop_atl}/show-segments"
              payload: { segment_type: "COMPETITION", title: "Heat 1", run_order_position: 1, duration_minutes: 30 }
              as: SeriesPromoter
            - call: "POST /tour-stops/${stop_atl}/ticket-tiers"
              payload: { tier_code: "PITSIDE", price_cents: 4750, allotment: 3000, on_sale_start_utc: "2026-08-01T00:00:00Z", on_sale_end_utc: "2026-11-14T18:00:00Z", group_min_qty: 20, group_discount_pct: 0.125 }
              as: TicketingManager
              captures: { tier_pit: "$.data.id" }
            - call: "POST /tour-stops/${stop_atl}/ticket-tiers"
              payload: { tier_code: "UPPER", price_cents: 2500, allotment: 3000, on_sale_start_utc: "2026-08-01T00:00:00Z", on_sale_end_utc: "2026-11-14T18:00:00Z" }
              as: TicketingManager
              captures: { tier_upper: "$.data.id" }
            - call: "POST /tour-stops/${stop_atl}/safety-plan"
              payload: { barrier_linear_feet: 1600, catch_fence_height_ft: 8, medical_als_staff_count: 2, medical_bls_staff_count: 3, ambulance_count: 1, emergency_access_lanes: 2 }
              as: SafetyOfficial
              as_user_id: "so-author-1"
              captures: { plan_atl: "$.data.id" }
            - call: "POST /safety-plans/${plan_atl}/submit"
              payload: {}
              as: SafetyOfficial
              as_user_id: "so-author-1"
            - call: "POST /safety-plans/${plan_atl}/certify"
              payload: { note: "provisioning verified" }
              as: SafetyOfficial
              as_user_id: "so-certifier-2"
            - call: "GET /seasons/${season}"
              payload: {}
              as: SeriesPromoter
              captures: { season_v1: "$.data.version" }
            - call: "POST /tour-stops/${stop_atl}/marketing-allocations"
              payload: { channel: "RADIO", amount_cents: 800000, expected_season_version: "${season_v1}" }
              as: SeriesPromoter
            - call: "GET /seasons/${season}"
              payload: {}
              as: SeriesPromoter
              captures: { season_v2: "$.data.version" }
            - call: "POST /tour-stops/${stop_atl}/marketing-allocations"
              payload: { channel: "DIGITAL", amount_cents: 1200000, expected_season_version: "${season_v2}" }
              as: SeriesPromoter
            - call: "POST /tour-stops/${stop_atl}/on-sale"
              payload: {}
              as: TicketingManager
            - call: "GET /ticket-tiers/${tier_pit}"
              payload: {}
              as: TicketingManager
              captures: { pit_v: "$.data.version" }
            - call: "POST /ticket-orders"
              payload: { tour_stop_id: "${stop_atl}", ticket_tier_id: "${tier_pit}", purchaser_name: "Group A", purchaser_email: "group-a@example.com", qty: 600, is_group: true, expected_ticket_tier_version: "${pit_v}" }
              as: TicketingManager
              captures: { order_a: "$.data.id" }
            - call: "POST /ticket-orders/${order_a}/pay"
              payload: {}
              as: TicketingManager
            - call: "GET /ticket-tiers/${tier_upper}"
              payload: {}
              as: TicketingManager
              captures: { up_v: "$.data.version" }
            - call: "POST /ticket-orders"
              payload: { tour_stop_id: "${stop_atl}", ticket_tier_id: "${tier_upper}", purchaser_name: "Walk Up B", purchaser_email: "walkup-b@example.com", qty: 900, pit_party_addon_qty: 300, expected_ticket_tier_version: "${up_v}" }
              as: TicketingManager
              captures: { order_b: "$.data.id" }
            - call: "POST /ticket-orders/${order_b}/pay"
              payload: {}
              as: TicketingManager
            - call: "POST /sponsors"
              payload: { company_name: "Redline Fuel", category: "FUEL", contact_email: "sponsor@redline.example", exclusive_category: true }
              as: SeriesPromoter
              captures: { sponsor1: "$.data.id" }
            - call: "POST /sponsorship-activations"
              payload: { sponsor_id: "${sponsor1}", tour_stop_id: "${stop_atl}", fee_cents: 1500000, vehicle_branding_slots: 2, signage_units: 6, hospitality_seat_count: 20, hospitality_tier_id: "${tier_upper}", branded_vehicle_entry_id: "${entry1}" }
              as: SeriesPromoter
              captures: { act1: "$.data.id" }
            - call: "POST /sponsorship-activations/${act1}/activate"
              payload: {}
              as: SeriesPromoter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-14T17:00:00Z" }
              as: SeriesPromoter
            - call: "POST /vehicle-entries/${entry1}/check-in"
              payload: { arrival_note: "staged in bay 1" }
              as: SeriesPromoter
            - call: "POST /tour-stops/${stop_atl}/close-sales"
              payload: {}
              as: TicketingManager
          trigger:
            - call: "POST /tour-stops/${stop_atl}/settlement"
              payload: {}
              as: FinanceController
              as_user_id: "fc-preparer-1"
              captures: { settle: "$.data.id" }
            - call: "POST /ticket-orders/${order_b}/refund"
              payload: { reason: "purchaser chargeback after preparation" }
              as: TicketingManager
            - call: "POST /settlements/${settle}/approve"
              payload: { note: "final settlement with venue" }
              as: FinanceController
              as_user_id: "fc-approver-2"
          assert:
            - "after the first trigger call: EventSettlement.${settle}.variant == PROVISIONAL"
            - "after the first trigger call: EventSettlement.${settle}.rental_due_pre_credit_cents == 3525000 and coop_credit_pct == 0.04 and coop_credit_cents == 141000 and venue_due_cents == 3384000"
            - "after the first trigger call: EventSettlement.${settle}.sponsorship_revenue_cents == 1500000 (ACTIVATED recognized at 100% under PROVISIONAL)"
            - "after the first trigger call: EventSettlement.${settle}.collected_cash_cents == 7503750 and net_to_promoter_cents == 1115750 and profitability_margin_pct == 14.87"
            - "after the first trigger call: EventSettlement.${settle}.payout_venue_cents == 3384000, payout_safety_cents == 854000, payout_marketing_cents == 2000000, payout_purse_cents == 150000, promoter_remainder_cents == 1115750, shortfall_cents == 0"
            - "after the third trigger call: EventSettlement.${settle}.variant == FINAL and state == APPROVED and approved_by_user_id == \"fc-approver-2\""
            - "after the third trigger call: EventSettlement.${settle}.ticket_revenue_cents == 2493750, addon_revenue_cents == 0, facility_fee_cents == 210000 (order_b dropped out of the inclusion set)"
            - "after the third trigger call: EventSettlement.${settle}.sponsorship_revenue_cents == 750000 (SPONSOR_HOLDBACK_PCT applied to the still-ACTIVATED activation)"
            - "after the third trigger call: EventSettlement.${settle}.rental_due_pre_credit_cents == 3210000, coop_credit_cents == 128400, venue_due_cents == 3081600"
            - "after the third trigger call: EventSettlement.${settle}.collected_cash_cents == 3453750, net_to_promoter_cents == -2631850, profitability_margin_pct == -76.20"
            - "after the third trigger call: EventSettlement.${settle}.payout_venue_cents == 3081600, payout_safety_cents == 372150, payout_marketing_cents == 0, payout_purse_cents == 0, promoter_remainder_cents == 0, shortfall_cents == 2631850"
            - "invariant in both variants: promoter_remainder_cents - shortfall_cents == net_to_promoter_cents"
            - "TourStop.${stop_atl}.sales_state == SETTLED and Season.${season}.settled_stop_count == 1 and Season.${season}.status == CLOSED"

      - name: vehicle_readiness_pre_staging_projection_vs_post_staging_actuals
        grounds:
          - calculations.logistics_readiness_score
          - entities.VehicleEntry.fields.readiness_score
          - entities.VehicleEntry.fields.readiness_variant
          - state_machines.VehicleEntry.ENTERED_to_STAGED
          - state_machines.VehicleEntry.tech_status_branching
        distinguishing_aspect: |
          PRE_STAGING scores a promise (scheduled_arrival_utc against the staging close time) and
          treats inspections as a provisional pass; POST_STAGING discards the projection entirely and
          scores realized facts (actual_arrival_utc against the promise, plus per-attempt inspection
          penalties). The same entry therefore reads 90 before check-in and 40 after one FAILED and
          one CONDITIONAL attempt — the haul_risk term is the only component shared by both variants.
        test_recipe:
          setup:
            - "A CONFIRMED ATL booking with its TourStop, show_start_utc 2026-11-14T23:00:00Z"
            - "One vehicle entry hauling 1200 miles with scheduled_arrival_utc 2026-11-14T09:00:00Z (before the staging close at 21:00Z)"
            - "Logical clock advanced to 2026-11-14T17:00:00Z, inside the staging window [15:00Z, 21:00Z]"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 Thunder Tour", year: 2026, season_start_date: "2026-10-01", season_end_date: "2027-03-31", total_marketing_budget_cents: 40000000 }
              as: SeriesPromoter
              captures: { season: "$.data.id" }
            - call: "POST /venues"
              payload: { name: "Atlanta Dome", market_code: "ATL", city: "Atlanta", state_code: "GA", seat_capacity: 9000, floor_type: "DIRT", catch_fence_max_height_ft: 10, medical_bay_count: 2, load_in_hours_required: 10, staging_bay_count: 4, turnaround_hours: 12 }
              as: SeriesPromoter
              captures: { venue_atl: "$.data.id" }
            - call: "POST /venue-bookings"
              payload: { season_id: "${season}", venue_id: "${venue_atl}", tour_date: "2026-11-14", rental_base_cents: 3000000, revenue_share_pct: 0.12, per_ticket_facility_fee_cents: 350, load_in_start_utc: "2026-11-13T14:00:00Z", tear_down_end_utc: "2026-11-15T06:00:00Z" }
              as: SeriesPromoter
              captures: { b_atl: "$.data.id" }
            - call: "POST /venue-bookings/${b_atl}/accept"
              payload: {}
              as: SeriesPromoter
            - call: "GET /tour-stops"
              payload: { venue_booking_id: "${b_atl}" }
              as: SeriesPromoter
              captures: { stop_atl: "$.data[0].id" }
            - call: "PATCH /tour-stops/${stop_atl}/logistics"
              payload: { doors_open_utc: "2026-11-14T22:00:00Z", show_start_utc: "2026-11-14T23:00:00Z", show_window_minutes: 150, pit_party_price_cents: 2450, pit_party_capacity: 400 }
              as: SeriesPromoter
            - call: "POST /competitors"
              payload: { team_name: "Thunder Ridge Racing", driver_name: "R. Anderson", home_market_code: "CLT", vehicle_class: "LIGHT" }
              as: SeriesPromoter
              captures: { comp1: "$.data.id" }
          trigger:
            - call: "POST /vehicle-entries"
              payload: { competitor_id: "${comp1}", tour_stop_id: "${stop_atl}", vehicle_number: "11", vehicle_weight_lbs: 7200, haul_distance_miles: 1200, scheduled_arrival_utc: "2026-11-14T09:00:00Z" }
              as: CompetitorTeam
              as_user_id: "${comp1}"
              captures: { entry1: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-14T17:00:00Z" }
              as: SeriesPromoter
            - call: "POST /vehicle-entries/${entry1}/check-in"
              payload: { arrival_note: "transporter late off the interstate" }
              as: CompetitorTeam
              as_user_id: "${comp1}"
            - call: "POST /vehicle-entries/${entry1}/tech-inspections"
              payload: { result: "FAILED", defect_severity: "MAJOR", notes: "fuel cell strap" }
              as: SafetyOfficial
              as_user_id: "so-inspector-1"
            - call: "POST /vehicle-entries/${entry1}/tech-inspections"
              payload: { result: "CONDITIONAL", defect_severity: "MINOR", notes: "strap re-rated, monitor" }
              as: SafetyOfficial
              as_user_id: "so-inspector-1"
          assert:
            - "after the first trigger call: VehicleEntry.${entry1}.readiness_variant == PRE_STAGING and readiness_score == 90 (100 - 10 haul risk, no projected-late penalty because 2026-11-14T09:00:00Z precedes the 21:00Z staging close)"
            - "after the first trigger call: VehicleEntry.${entry1}.staging_bay_index == 1 and logistics_state == ENTERED and tech_status == TECH_PENDING"
            - "after the third trigger call: VehicleEntry.${entry1}.readiness_variant == POST_STAGING and readiness_score == 75 (100 - 10 haul - 15 arrival slip, inspections still empty)"
            - "after the fourth trigger call: VehicleEntry.${entry1}.readiness_score == 50 and failed_attempt_count == 1 and tech_status == TECH_PENDING"
            - "after the fifth trigger call: VehicleEntry.${entry1}.readiness_score == 40 (100 - 10 haul - 15 slip - 25 failed attempt - 10 latest-CONDITIONAL) and tech_status == TECH_CONDITIONAL and tech_attempt_count == 2"
            - "VehicleEntry.${entry1}.actual_arrival_utc == 2026-11-14T17:00:00Z and it is later than scheduled_arrival_utc, which is what the POST_STAGING variant penalises"

  - rule_id: combinatorial_formula
    instances:
      - name: ticket_order_rounds_each_discount_line_before_summing
        grounds:
          - calculations.ticket_order_amounts
          - entities.TicketOrder.fields.group_discount_cents
          - entities.TicketOrder.fields.addon_discount_cents
          - entities.TicketOrder.fields.total_cents
          - entities.TicketTier.fields.group_discount_pct
        distinguishing_aspect: |
          Mode (b) — evaluation-order sensitivity from per-component rounding. The group discount
          (99750 x 0.125 = 12468.75 -> 12469) and the pit-party bundle discount
          (51450 x 0.15 = 7717.5 -> 7718) are each ROUND_HALF_UP'ed on their own line before the
          total is summed, yielding 138363. Summing the raw discounts first (20186.25 -> 20186) and
          rounding once yields 138364 — a one-cent divergence that only the pinned per-line order
          produces.
        test_recipe:
          setup:
            - "An ATL TourStop ON_SALE with pit_party_price_cents 2450 and pit_party_capacity 400"
            - "Tier PITSIDE at 4750 cents, allotment 3000, group_min_qty 20, group_discount_pct 0.125"
            - "Booking facility fee 350 cents per ticket"
            - "Logical clock at its 2026-08-01T00:00:00Z default, inside the tier's on-sale window"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 Thunder Tour", year: 2026, season_start_date: "2026-10-01", season_end_date: "2027-03-31", total_marketing_budget_cents: 40000000 }
              as: SeriesPromoter
