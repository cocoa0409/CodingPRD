            - call: "POST /api/pickup-visits/${v1}/samples"
              payload: {}
              as: Driver
              as_user_id: "drv-1"
              captures: { smp: $.data.id }
            - { call: "POST /api/quality-samples/${smp}/submit", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /api/quality-samples/${smp}/grade", payload: { lab_moisture_pct: 10.0, lab_impurity_pct: 1.0 }, as: PlantOperator }
