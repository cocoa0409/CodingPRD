        claim_type: conditional_action
        grounds: [entities.Quote.fields.expires_at, calculations.warranty_eligibility]
        distinguishing_aspect: "With no set_current_utc call, the logical clock reads the fixed default 2026-08-01T00:00:00Z, so issued_at / expires_at are deterministic: expires_at == issued_at + 14 days."
