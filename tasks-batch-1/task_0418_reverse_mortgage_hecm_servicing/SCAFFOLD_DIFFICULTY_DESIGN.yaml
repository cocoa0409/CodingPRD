              as: ServicerOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_CERT_PERIOD_OVERLAP"

      - name: property_charge_halfopen_window_overlap_rejected_adjacent_allowed
        grounds:
          - validations[priority=12]
          - entities.PropertyChargePayment.fields.coverage_start
          - entities.PropertyChargePayment.fields.coverage_end
          - errors[ERR_COVERAGE_WINDOW_OVERLAP]
          - endpoints["POST /property-charge-payments"]
        distinguishing_aspect: |
          DIFFERENT interval semantics = HALF-OPEN [start,end) with adjacency ALLOWED, on a different
          resource (PropertyChargePayment). A second PROPERTY_TAX payment for [2024-06-01,2025-01-01)
          overlaps the existing [2024-01-01,2024-07-01) and is rejected; but an adjacent
          [2024-07-01,2025-01-01) (end==next.start, zero buffer) is accepted.
