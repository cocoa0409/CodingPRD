scenario: '1977. Rural Water District Billing & Association Operations (rural water

  district): membership/tap fee & meter installation, monthly billing with

  minimum & tier, delinquency, disconnect notice & reconnection, water loss &

  master-meter reconciliation, board governance & rate adoption, USDA loan

  covenant & reserve requirement, boil-order notification & sampling

  compliance, service area & annexation

  '
domain_name: rural-water-district
api_prefix: ''
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
  - optimistic_concurrency
  - cascading_side_effects
  - dual_variant_calculation
  - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
  - one_to_many
  - cross_aggregate
  - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\": \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: District
  parent: null
  common_fields: true
  fields:
  - name: district_name
    type: string
    source: input
    description: Legal name of the rural water district
  - name: usda_loan_principal_cents
    type: integer
    source: input
    description: Original USDA RD loan principal in cents
    constraints: '>= 0'
  - name: annual_debt_service_cents
    type: integer
    source: input
    description: Annual USDA debt-service payment in cents
    constraints: '> 0'
  - name: reserve_target_cents
    type: integer
    source: computed
    description: USDA reserve requirement = annual_debt_service_cents (one full year of debt service), recomputed on loan-term amendment
  - name: reserve_balance_cents
    type: integer
    source: computed
    description: Current reserve-fund balance; mutated only by ReserveEntry rows; starts at 0
  - name: reserve_deficit_cents
    type: integer
    source: computed
    description: max(0, reserve_target_cents - reserve_balance_cents)
  - name: covenant_status
    type: enum
    source: computed
    description: IN_COMPLIANCE | RESERVE_DEFICIENT | RATE_COVENANT_BREACH; derived from reserve ratio and last adopted rate coverage
  - name: active_rate_schedule_id
    type: string
    source: system
    description: FK -> RateSchedule.id; the currently effective rate schedule; null until first adoption
  - name: current_billing_epoch
    type: integer
    source: system
    description: Monotonic counter of closed billing cycles; starts at 0; increments on cycle close
  - name: boil_order_active
    type: boolean
    source: computed
    description: true iff any BoilOrder with status IN_EFFECT exists for this district
- name: ServiceArea
  parent: District
  common_fields: true
  fields:
  - name: district_id
    type: string
    source: system
    description: FK -> District.id; owning district
  - name: area_name
    type: string
    source: input
    description: Human name of the certificated service area polygon
  - name: boundary_acres
    type: integer
    source: input
    description: Area size in whole acres
    constraints: '> 0'
  - name: status
    type: enum
    source: system
    description: ACTIVE | ANNEXED_IN | RETIRED
- name: AnnexationPetition
  parent: District
  common_fields: true
  fields:
  - name: district_id
    type: string
    source: system
    description: FK -> District.id; district being petitioned
  - name: petitioner_name
    type: string
    source: input
    description: Name of the landowner requesting annexation
  - name: parcel_acres
    type: integer
    source: input
    description: Parcel size in whole acres
    constraints: '> 0'
  - name: parent_service_area_id
    type: string
    source: input
    description: FK -> ServiceArea.id; existing area the parcel adjoins
  - name: deposit_cents
    type: integer
    source: input
    description: Refundable feasibility deposit in cents
    constraints: '>= 0'
  - name: feasibility_fee_cents
    type: integer
    source: computed
    description: Non-refundable portion retained on withdrawal/approval = max(FEASIBILITY_FEE_FLOOR_CENTS, deposit * FEASIBILITY_FEE_PCT)
  - name: refund_cents
    type: integer
    source: computed
    description: deposit_cents - feasibility_fee_cents on terminal resolution
  - name: status
    type: enum
    source: system
    description: SUBMITTED -> FEASIBILITY_REVIEW -> {APPROVED_PENDING_VOTE, WITHDRAWN} ; APPROVED_PENDING_VOTE -> {RATIFIED, REJECTED} ; REJECTED -> SUBMITTED (resubmission
      cycle)
- name: Member
  parent: District
  common_fields: true
  fields:
  - name: district_id
    type: string
    source: system
    description: FK -> District.id; owning district
  - name: legal_name
    type: string
    source: input
    description: Member legal name
  - name: service_area_id
    type: string
    source: input
    description: FK -> ServiceArea.id; area in which the member's parcel lies; must be ACTIVE or ANNEXED_IN
  - name: member_class
    type: enum
    source: input
    description: RESIDENTIAL | COMMERCIAL | AGRICULTURAL
    default: RESIDENTIAL
  - name: membership_status
    type: enum
    source: system
    description: APPLIED -> ACTIVE -> SUSPENDED -> ACTIVE (cyclic) ; ACTIVE -> TERMINATED
  - name: credit_balance_cents
    type: integer
    source: computed
    description: Overpayment credit; starts 0; mutated by payments and invoice offsets
  - name: consecutive_delinquent_cycles
    type: integer
    source: computed
    description: Count of consecutive cycles ending with an unpaid balance; resets to 0 on any cycle whose invoice is fully paid by its due date
- name: TapConnection
  parent: District
  common_fields: true
  fields:
  - name: district_id
    type: string
    source: system
    description: FK -> District.id
  - name: member_id
    type: string
    source: input
    description: FK -> Member.id; member who owns this tap
  - name: tap_fee_cents
    type: integer
    source: computed
    description: Tap fee quoted at creation from the district's active rate schedule TAP_FEE table by member_class
  - name: tap_fee_paid_cents
    type: integer
    source: computed
    description: Amount of tap fee collected so far
  - name: meter_size
    type: enum
    source: input
    description: FIVE_EIGHTS_INCH | THREE_QUARTER_INCH | ONE_INCH | TWO_INCH
    default: FIVE_EIGHTS_INCH
  - name: status
    type: enum
    source: system
    description: FEE_PENDING -> PAID -> INSTALLED -> {DISCONNECTED, RECONNECTED cycle} -> ABANDONED
- name: MeterReading
  parent: District
  common_fields: false
  fields:
  - name: district_id
    type: string
    source: system
    description: FK -> District.id
  - name: tap_id
    type: string
    source: input
    description: FK -> TapConnection.id
  - name: cycle_id
    type: string
    source: input
    description: FK -> BillingCycle.id; cycle this reading belongs to
  - name: reading_gallons
    type: integer
    source: input
    description: Cumulative meter register value in whole gallons
    constraints: '>= 0'
  - name: reading_type
    type: enum
    source: input
    description: ACTUAL | ESTIMATED | FINAL_OFF
    default: ACTUAL
  - name: usage_gallons
    type: integer
    source: computed
    description: reading_gallons - prior accepted reading for this tap; negative rejected as ERR_READING_REGRESSION
- name: MasterMeterReading
  parent: District
  common_fields: false
  fields:
  - name: district_id
    type: string
    source: system
    description: FK -> District.id
  - name: cycle_id
    type: string
    source: input
    description: FK -> BillingCycle.id
  - name: master_gallons
    type: integer
    source: input
    description: District master meter total gallons delivered into the distribution system for the cycle
    constraints: '>= 0'
- name: RateSchedule
  parent: District
  common_fields: true
  fields:
  - name: district_id
    type: string
    source: system
    description: FK -> District.id
  - name: schedule_label
    type: string
    source: input
    description: Human label, e.g. 'FY2027 Schedule A'
  - name: base_minimum_cents
    type: integer
    source: input
    description: Monthly minimum charge in cents covering the first INCLUDED_GALLONS
    constraints: '>= 0'
  - name: included_gallons
    type: integer
    source: input
    description: Gallons included in the monthly minimum
    constraints: '>= 0'
  - name: tier2_rate_cents_per_kgal
    type: integer
    source: input
    description: Marginal cents per 1,000 gallons for usage in (included_gallons, TIER2_CAP_GALLONS]
    constraints: '> 0'
  - name: tier2_cap_gallons
    type: integer
    source: input
    description: Upper bound of tier 2 usage (cumulative gallons)
    constraints: '> included_gallons'
  - name: tier3_rate_cents_per_kgal
    type: integer
    source: input
    description: Marginal cents per 1,000 gallons above tier2_cap_gallons
    constraints: '> 0'
  - name: tap_fee_schedule
    type: object
    source: input
    description: Map member_class -> tap fee cents; keys RESIDENTIAL/COMMERCIAL/AGRICULTURAL
  - name: reconnect_fee_cents
    type: integer
    source: input
    description: Fee charged to restore service after disconnection
    constraints: '>= 0'
  - name: status
    type: enum
    source: system
    description: DRAFT -> ADOPTED -> SUPERSEDED ; ADOPTED is unique per district at any instant
- name: BillingCycle
  parent: District
  common_fields: true
  fields:
  - name: district_id
    type: string
    source: system
    description: FK -> District.id
  - name: cycle_index
    type: integer
    source: computed
    description: District.current_billing_epoch + 1 at creation; strictly increasing per district
  - name: period_start_utc
    type: datetime
    source: input
    description: Cycle period start (inclusive), ISO8601 UTC
  - name: period_end_utc
    type: datetime
    source: input
    description: Cycle period end (exclusive), ISO8601 UTC; must be > period_start_utc
  - name: due_date_utc
    type: datetime
    source: input
    description: Payment due date; must be >= period_end_utc
  - name: status
    type: enum
    source: system
    description: OPEN -> READINGS_COMPLETE -> BILLED -> CLOSED
  - name: provisional_loss_pct
    type: number
    source: computed
    description: Forward-looking water loss % computed at BILLED from accepted readings
  - name: final_loss_pct
    type: number
    source: computed
    description: Chronological reconciliation loss % computed at CLOSED including late FINAL_OFF readings
  - name: billed_total_cents
    type: integer
    source: computed
    description: Sum of Invoice.total_cents over invoices in this cycle (status != VOID)
- name: Invoice
  parent: District
  common_fields: true
  fields:
  - name: district_id
    type: string
    source: system
    description: FK -> District.id
  - name: member_id
    type: string
    source: computed
    description: FK -> Member.id; owner (derived from tap)
  - name: tap_id
    type: string
    source: input
    description: FK -> TapConnection.id
  - name: cycle_id
    type: string
    source: computed
    description: FK -> BillingCycle.id; derived from the accepted MeterReading
  - name: rate_schedule_id
    type: string
    source: computed
    description: FK -> RateSchedule.id; version-pinned to district.active_rate_schedule_id at billing time; never re-pinned afterwards
  - name: usage_gallons
    type: integer
    source: computed
    description: Billed usage from the accepted MeterReading
  - name: usage_charge_cents
    type: integer
    source: computed
    description: Tiered usage charge per rate_schedule (marginal tiers; see calculation tiered_usage_charge)
  - name: minimum_charge_cents
    type: integer
    source: computed
    description: base_minimum_cents from pinned rate schedule
  - name: reconnect_fee_cents
    type: integer
    source: computed
    description: Reconnect fee carried onto this invoice when the tap was reconnected during the cycle; else 0
  - name: total_cents
    type: integer
    source: computed
    description: max(minimum_charge_cents, minimum_charge_cents + usage_charge_cents over-inclusion adjustment) + reconnect_fee_cents — see calculation invoice_total
      (evaluation order pinned)
  - name: amount_paid_cents
    type: integer
    source: computed
    description: Sum of Payment.applied_cents over non-reversed payments against this invoice
  - name: billing_status
    type: enum
    source: system
    description: ISSUED -> PARTIALLY_PAID -> PAID | VOID (parallel dimension 1)
  - name: collection_status
    type: enum
    source: system
    description: CURRENT -> DELINQUENT -> NOTICED -> DISCONNECT_ELIGIBLE -> DISCONNECTED (parallel dimension 2; cyclic via payment cure back to CURRENT)
  - name: days_past_due
    type: integer
    source: computed
    description: max(0, floor((now_utc - due_date_utc)/86400)) while unpaid; frozen at disconnect
- name: Payment
  parent: District
  common_fields: true
  fields:
  - name: district_id
    type: string
    source: system
    description: FK -> District.id
  - name: member_id
    type: string
    source: input
    description: FK -> Member.id; paying member
  - name: invoice_id
    type: string
    source: input
    description: FK -> Invoice.id; target invoice
  - name: amount_cents
    type: integer
    source: input
    description: Tendered amount in cents
    constraints: '> 0'
  - name: applied_cents
    type: integer
    source: computed
    description: Portion applied to invoice balance; remainder flows to member credit
  - name: status
    type: enum
    source: system
    description: POSTED -> REVERSED (terminal)
- name: ReserveEntry
  parent: District
  common_fields: false
  fields:
  - name: district_id
    type: string
    source: system
    description: FK -> District.id
  - name: entry_type
    type: enum
    source: input
    description: MONTHLY_DEPOSIT | WITHDRAWAL_AUTH | ANNUAL_TRUE_UP
  - name: amount_cents
    type: integer
    source: input
    description: 'Signed cents: deposits positive, withdrawals negative'
  - name: cycle_id
    type: string
    source: input
    description: FK -> BillingCycle.id; the cycle this entry is attributed to (null for WITHDRAWAL_AUTH)
  - name: resulting_balance_cents
    type: integer
    source: computed
    description: District reserve balance after this entry; running ledger
- name: BoilOrder
  parent: District
  common_fields: true
  fields:
  - name: district_id
    type: string
    source: system
    description: FK -> District.id
  - name: issued_utc
    type: datetime
    source: system
    description: Server-stamped issuance time from the logical clock
  - name: reason
    type: string
    source: input
    description: Regulatory reason for the advisory
  - name: notification_deadline_utc
    type: datetime
    source: computed
    description: issued_utc + NOTIFY_WINDOW_HOURS; all ACTIVE members must be notified before this instant
  - name: notified_member_count
    type: integer
    source: computed
    description: Distinct members with a NotificationReceipt for this order
  - name: status
    type: enum
    source: system
    description: IN_EFFECT -> SAMPLING -> {LIFTED, VIOLATION_ESCALATED}
- name: NotificationReceipt
  parent: District
  common_fields: false
  fields:
  - name: district_id
    type: string
    source: system
    description: FK -> District.id
  - name: boil_order_id
    type: string
    source: input
    description: FK -> BoilOrder.id
  - name: member_id
    type: string
    source: input
    description: FK -> Member.id; member notified
  - name: channel
    type: enum
    source: input
    description: DOOR_HANGER | CERTIFIED_MAIL | PHONE_TREE
  - name: notified_utc
    type: datetime
    source: system
    description: Server-stamped from logical clock at record time
- name: ComplianceSample
  parent: District
  common_fields: true
  fields:
  - name: district_id
    type: string
    source: system
    description: FK -> District.id
  - name: boil_order_id
    type: string
    source: input
    description: FK -> BoilOrder.id; order this sample clears
  - name: sample_point
    type: string
    source: input
    description: Distribution sample tap identifier
  - name: collected_utc
    type: datetime
    source: input
    description: Collection time; must be >= boil order issued_utc and within SAMPLING_WINDOW_HOURS of it
  - name: result
    type: enum
    source: system
    description: PENDING -> ABSENT | PRESENT (total coliform)
- name: BoardResolution
  parent: District
  common_fields: true
  fields:
  - name: district_id
    type: string
    source: system
    description: FK -> District.id
  - name: resolution_type
    type: enum
    source: input
    description: RATE_ADOPTION | RESERVE_WITHDRAWAL | ANNEXATION_RATIFICATION | LOAN_AMENDMENT
  - name: subject_id
    type: string
    source: input
    description: 'Polymorphic target: RateSchedule.id for RATE_ADOPTION, AnnexationPetition.id for ANNEXATION_RATIFICATION, District.id for RESERVE_WITHDRAWAL/LOAN_AMENDMENT'
  - name: payload
    type: object
    source: input
    description: 'Type-specific data: {withdrawal_amount_cents} for RESERVE_WITHDRAWAL; {new_annual_debt_service_cents} for LOAN_AMENDMENT; {} otherwise'
  - name: votes_for
    type: integer
    source: computed
    description: Count of recorded FOR votes
  - name: votes_against
    type: integer
    source: computed
    description: Count of recorded AGAINST votes
  - name: status
    type: enum
    source: system
    description: PROPOSED -> {ADOPTED, FAILED} (fork); ADOPTED executes its subject action atomically
state_machines:
- entity: RateSchedule
  initial_state: DRAFT
  terminal_states:
  - SUPERSEDED
  transitions:
  - from: DRAFT
    to: ADOPTED
    trigger: POST /districts/{id}/board-resolutions (RATE_ADOPTION) reaching ADOPTED
    actor: system
    preconditions:
    - Resolution is RATE_ADOPTION targeting this schedule and reaches quorum
    - District has no other ADOPTED schedule whose cycle-lock blocks adoption (see BillingCycle BILLED->CLOSED)
    side_effects:
    - Prior ADOPTED schedule (if any) -> SUPERSEDED
    - District.active_rate_schedule_id := this schedule's id
    - increments District.version by 1
    note: New rates apply only to cycles billed after adoption; previously ISSUED invoices keep their pinned rate_schedule_id (version-pinning on approval).
  - from: ADOPTED
    to: SUPERSEDED
    trigger: system (cascade when a later RATE_ADOPTION resolution is ADOPTED)
    actor: system
    preconditions: []
    side_effects: []
- entity: BillingCycle
  initial_state: OPEN
  terminal_states:
  - CLOSED
  transitions:
  - from: OPEN
    to: READINGS_COMPLETE
    trigger: POST /districts/{id}/billing-cycles/{cycleId}/mark-readings-complete
    actor: BillingClerk
    preconditions:
    - Every TapConnection in status INSTALLED/RECONNECTED has exactly one accepted MeterReading for this cycle (ERR_MISSING_METER_READINGS)
    side_effects: []
  - from: READINGS_COMPLETE
    to: BILLED
    trigger: POST /districts/{id}/billing-cycles/{cycleId}/bill
    actor: BillingClerk
    preconditions:
    - District.active_rate_schedule_id is not null (ERR_NO_ACTIVE_RATE_SCHEDULE)
    side_effects:
    - Create one Invoice per tapped member using calculation invoice_total with district's currently ADOPTED rate schedule pinned
    - Compute provisional_loss_pct via calculation provisional_water_loss
    - 'Apply delinquency aging: for every still-unpaid invoice from prior cycles, advance collection_status per delinquency_escalation rules using the logical clock'
    - increments District.version by 1
  - from: BILLED
    to: CLOSED
    trigger: POST /districts/{id}/billing-cycles/{cycleId}/close
    actor: Treasurer
    preconditions:
    - expected_district_version matches District.version (OCC; ERR_STALE_VERSION)
    - Exactly one MasterMeterReading exists for the cycle (ERR_MASTER_READING_REQUIRED)
    side_effects:
    - Compute final_loss_pct via calculation final_water_loss (chronological, includes FINAL_OFF readings)
    - Post ReserveEntry MONTHLY_DEPOSIT of reserve_monthly_deposit_cents; update District.reserve_balance_cents, reserve_deficit_cents, covenant_status
    - District.current_billing_epoch += 1
    - 'For each member: if this cycle''s invoice fully paid by due date, consecutive_delinquent_cycles := 0 else += 1 (cascade into Member)'
    - increments District.version by 1
- entity: Invoice
  initial_state: billing_status=ISSUED, collection_status=CURRENT
  terminal_states:
  - billing_status=VOID
  - billing_status=PAID AND collection_status=CURRENT
  parallel_dimensions:
  - billing_status: ISSUED -> PARTIALLY_PAID -> PAID ; ISSUED -> VOID
  - collection_status: CURRENT -> DELINQUENT -> NOTICED -> DISCONNECT_ELIGIBLE -> DISCONNECTED ; DELINQUENT|NOTICED|DISCONNECT_ELIGIBLE -> CURRENT (cure on payment
      in full)
  transitions:
  - from: ISSUED
    to: PARTIALLY_PAID
    trigger: POST /districts/{id}/payments (applied_cents < outstanding)
    actor: system
    preconditions: []
    side_effects:
    - amount_paid_cents += applied_cents
  - from: ISSUED
    to: PAID
    trigger: POST /districts/{id}/payments (applied_cents == outstanding)
    actor: system
    preconditions: []
    side_effects:
    - collection_status := CURRENT (cure) regardless of prior collection state
    - If the member's tap was DISCONNECTED and all outstanding invoices are PAID, tap becomes eligible for reconnection (see TapConnection)
  - from: PARTIALLY_PAID
    to: PAID
    trigger: POST /districts/{id}/payments (applied_cents == remaining outstanding)
    actor: system
    preconditions: []
    side_effects:
    - collection_status := CURRENT (cure)
  - from: CURRENT
    to: DELINQUENT
    trigger: 'system (during BillingCycle bill cascade: logical clock > due_date_utc and billing_status != PAID)'
    actor: system
    preconditions: []
    side_effects: []
  - from: DELINQUENT
    to: NOTICED
    trigger: system (days_past_due >= NOTICE_DAY_THRESHOLD at a bill cascade) OR POST /districts/{id}/invoices/{invoiceId}/issue-notice
    actor: system | BillingClerk
    preconditions: []
    side_effects:
    - Disconnect notice generated; notice_issued recorded
  - from: NOTICED
    to: DISCONNECT_ELIGIBLE
    trigger: system (days_past_due >= DISCONNECT_DAY_THRESHOLD at a bill cascade)
    actor: system
    preconditions: []
    side_effects: []
  - from: DISCONNECT_ELIGIBLE
    to: DISCONNECTED
    trigger: POST /districts/{id}/taps/{tapId}/disconnect
    actor: FieldOperator
    preconditions:
    - Every unpaid invoice on this tap is in collection_status DISCONNECT_ELIGIBLE (ERR_NOT_DISCONNECT_ELIGIBLE)
    - No BoilOrder with status IN_EFFECT exists for the district (health-safety moratorium; ERR_BOIL_ORDER_MORATORIUM)
    side_effects:
    - TapConnection.status -> DISCONNECTED
    - Freeze days_past_due on all of the tap's unpaid invoices
  - from: DELINQUENT|NOTICED|DISCONNECT_ELIGIBLE|DISCONNECTED
    to: CURRENT
    trigger: system (invoice reaches billing_status=PAID)
    actor: system
    preconditions: []
    side_effects: []
    note: 'Cure transition: payment in full always returns collection_status to CURRENT from any non-terminal collection state.'
- entity: TapConnection
  initial_state: FEE_PENDING
  terminal_states:
  - ABANDONED
  transitions:
  - from: FEE_PENDING
    to: PAID
    trigger: POST /districts/{id}/taps/{tapId}/pay-tap-fee
    actor: Treasurer
    preconditions:
    - Member.membership_status == ACTIVE (ERR_MEMBER_NOT_ACTIVE)
    side_effects:
    - tap_fee_paid_cents := tap_fee_cents; member credit/absorb per payment waterfall
  - from: PAID
    to: INSTALLED
    trigger: POST /districts/{id}/taps/{tapId}/install-meter
    actor: FieldOperator
    preconditions:
    - Member.membership_status == ACTIVE
    - Member has no other tap in INSTALLED/RECONNECTED on the same service-area parcel (one active tap per member per area; ERR_DUPLICATE_ACTIVE_TAP)
    side_effects:
    - Initial MeterReading auto-created at 0 gallons ACTUAL for the then-current OPEN cycle if one exists
  - from: INSTALLED
    to: DISCONNECTED
    trigger: POST /districts/{id}/taps/{tapId}/disconnect
    actor: FieldOperator
    preconditions:
    - All unpaid invoices on this tap are DISCONNECT_ELIGIBLE
    - No IN_EFFECT boil order
    side_effects:
    - 'Invoice cascade: collection_status -> DISCONNECTED for each unpaid invoice on this tap'
  - from: DISCONNECTED
    to: RECONNECTED
    trigger: POST /districts/{id}/taps/{tapId}/reconnect
    actor: FieldOperator
    preconditions:
    - Every invoice on this tap has billing_status == PAID (ERR_OUTSTANDING_BALANCE)
    - 'Reconnect fee (from the cycle''s pinned rate schedule at next billing) accrued: a reconnect_fee_cents charge is attached to the next issued invoice for this
      tap'
    side_effects:
    - Flag pending_reconnect_fee on the tap so the next invoice carries reconnect_fee_cents
    - Member.membership_status := ACTIVE if it was SUSPENDED
  - from: RECONNECTED
    to: DISCONNECTED
    trigger: POST /districts/{id}/taps/{tapId}/disconnect
    actor: FieldOperator
    preconditions:
    - same as INSTALLED -> DISCONNECTED
    side_effects:
    - same as INSTALLED -> DISCONNECTED
  - from: FEE_PENDING|PAID
    to: ABANDONED
    trigger: POST /districts/{id}/taps/{tapId}/abandon
    actor: BillingClerk
    preconditions:
    - No invoice exists for this tap (ERR_TAP_HAS_BILLING_HISTORY)
    side_effects: []
- entity: Member
  initial_state: APPLIED
  terminal_states:
  - TERMINATED
  transitions:
  - from: APPLIED
    to: ACTIVE
    trigger: POST /districts/{id}/members/{memberId}/approve
    actor: BillingClerk
    preconditions:
    - Member.service_area_id's ServiceArea.status in {ACTIVE, ANNEXED_IN} (ERR_AREA_NOT_SERVICEABLE)
    side_effects: []
  - from: ACTIVE
    to: SUSPENDED
    trigger: system (member's last active tap is DISCONNECTED while any invoice remains unpaid)
    actor: system
    preconditions: []
    side_effects: []
  - from: SUSPENDED
    to: ACTIVE
    trigger: system (any tap of the member reaches RECONNECTED)
    actor: system
    preconditions: []
    side_effects: []
    note: Cyclic ACTIVE <-> SUSPENDED driven by tap disconnect/reconnect.
  - from: ACTIVE
    to: TERMINATED
    trigger: POST /districts/{id}/members/{memberId}/terminate
    actor: BoardDirector
    preconditions:
    - All taps ABANDONED or none exist
    - No invoice with billing_status in {ISSUED, PARTIALLY_PAID} (ERR_OPEN_INVOICES_EXIST)
    side_effects:
    - Any remaining credit_balance_cents is forfeited to District (recorded as ReserveEntry ANNUAL_TRUE_UP positive entry at next cycle close)
- entity: AnnexationPetition
  initial_state: SUBMITTED
  terminal_states:
  - RATIFIED
  - WITHDRAWN
  transitions:
  - from: SUBMITTED
    to: FEASIBILITY_REVIEW
    trigger: POST /districts/{id}/annexation-petitions/{petitionId}/begin-review
    actor: BillingClerk
    preconditions: []
    side_effects: []
  - from: FEASIBILITY_REVIEW
    to: APPROVED_PENDING_VOTE
    trigger: POST /districts/{id}/annexation-petitions/{petitionId}/recommend
    actor: FieldOperator
    preconditions:
    - parent_service_area_id ServiceArea.status == ACTIVE
    side_effects: []
  - from: FEASIBILITY_REVIEW
    to: WITHDRAWN
    trigger: POST /districts/{id}/annexation-petitions/{petitionId}/withdraw
    actor: BillingClerk
    preconditions: []
    side_effects:
    - refund_cents computed; feasibility_fee_cents retained
  - from: APPROVED_PENDING_VOTE
    to: RATIFIED
    trigger: system (ANNEXATION_RATIFICATION BoardResolution ADOPTED)
    actor: system
    preconditions: []
    side_effects:
    - Create new ServiceArea with status ANNEXED_IN, boundary_acres = parcel_acres, attached to District
    - feasibility_fee_cents retained; refund_cents released
    - increments District.version by 1
  - from: APPROVED_PENDING_VOTE
    to: REJECTED
    trigger: system (ANNEXATION_RATIFICATION BoardResolution FAILED)
    actor: system
    preconditions: []
    side_effects: []
  - from: REJECTED
    to: SUBMITTED
    trigger: POST /districts/{id}/annexation-petitions/{petitionId}/resubmit
    actor: BillingClerk
    preconditions:
    - 'deposit topped up: request carries additional_deposit_cents >= 0'
    side_effects:
    - deposit_cents += additional_deposit_cents
    note: 'Cyclic resubmission: a rejected petition may be re-submitted with topped-up deposit.'
- entity: BoardResolution
  initial_state: PROPOSED
  terminal_states:
  - ADOPTED
  - FAILED
  transitions:
  - from: PROPOSED
    to: ADOPTED
    trigger: POST /districts/{id}/board-resolutions/{resolutionId}/record-vote with the deciding FOR vote
    actor: system
    preconditions:
    - votes_for reaches QUORUM_FOR (>= 3) AND votes_for > votes_against
    - 'Segregation of duties: no BoardDirector may vote twice on the same resolution (ERR_DUPLICATE_VOTE)'
    side_effects:
    - 'RATE_ADOPTION: target RateSchedule DRAFT -> ADOPTED; prior ADOPTED -> SUPERSEDED; District.active_rate_schedule_id updated'
    - 'RESERVE_WITHDRAWAL: ReserveEntry WITHDRAWAL_AUTH posted with amount = -payload.withdrawal_amount_cents; requires resulting reserve_balance_cents >= reserve_target_cents
      * WITHDRAWAL_FLOOR_RATIO (ERR_RESERVE_COVENANT_BREACH); recomputes covenant_status'
    - 'ANNEXATION_RATIFICATION: target petition APPROVED_PENDING_VOTE -> RATIFIED (cascade creates ServiceArea)'
    - 'LOAN_AMENDMENT: District.annual_debt_service_cents := payload.new_annual_debt_service_cents; reserve_target_cents recomputed; covenant_status recomputed'
    - increments District.version by 1
  - from: PROPOSED
    to: FAILED
    trigger: POST /districts/{id}/board-resolutions/{resolutionId}/record-vote when votes_against reaches QUORUM_AGAINST (>= 3) with votes_against >= votes_for
    actor: system
    preconditions: []
    side_effects:
    - ANNEXATION_RATIFICATION failure cascades petition APPROVED_PENDING_VOTE -> REJECTED
- entity: BoilOrder
  initial_state: IN_EFFECT
  terminal_states:
  - LIFTED
  - VIOLATION_ESCALATED
  transitions:
  - from: IN_EFFECT
    to: SAMPLING
    trigger: POST /districts/{id}/boil-orders/{orderId}/begin-sampling
    actor: FieldOperator
    preconditions:
    - notified_member_count == count of district members with membership_status == ACTIVE (ERR_NOTIFICATION_INCOMPLETE)
    side_effects:
    - District.boil_order_active remains true until LIFTED
  - from: SAMPLING
    to: LIFTED
    trigger: system (when REQUIRED_CLEAR_SAMPLES ComplianceSample rows for this order each reach result == ABSENT)
    actor: system
    preconditions:
    - Exactly REQUIRED_CLEAR_SAMPLES (2) consecutive-by-created_at samples with result ABSENT and zero samples with result PRESENT for this order
    side_effects:
    - District.boil_order_active := false
    - District.version += 1
  - from: SAMPLING
    to: VIOLATION_ESCALATED
    trigger: system (any ComplianceSample for this order reaches result == PRESENT)
    actor: system
    preconditions: []
    side_effects:
    - Order escalates; a new BoilOrder must be issued before lifting is possible
    - District.version += 1
- entity: ComplianceSample
  initial_state: PENDING
  terminal_states:
  - ABSENT
  - PRESENT
  transitions:
  - from: PENDING
    to: ABSENT
    trigger: POST /districts/{id}/compliance-samples/{sampleId}/record-result
    actor: FieldOperator
    preconditions:
    - Parent BoilOrder.status == SAMPLING (ERR_ORDER_NOT_SAMPLING)
    side_effects:
    - If this is the 2nd consecutive-by-created_at ABSENT with no PRESENT, parent BoilOrder SAMPLING -> LIFTED (cascade)
  - from: PENDING
    to: PRESENT
    trigger: POST /districts/{id}/compliance-samples/{sampleId}/record-result
    actor: FieldOperator
    preconditions:
    - Parent BoilOrder.status == SAMPLING
    side_effects:
    - Parent BoilOrder SAMPLING -> VIOLATION_ESCALATED (cascade)
- entity: ServiceArea
  initial_state: ACTIVE
  terminal_states:
  - RETIRED
  transitions:
  - from: ACTIVE
    to: RETIRED
    trigger: POST /districts/{id}/service-areas/{areaId}/retire
    actor: SystemAdmin
    preconditions:
    - No Member with service_area_id == this area has membership_status in {APPLIED, ACTIVE, SUSPENDED} (ERR_AREA_IN_USE)
    side_effects: []
  - from: ANNEXED_IN
    to: RETIRED
    trigger: POST /districts/{id}/service-areas/{areaId}/retire
    actor: SystemAdmin
    preconditions:
    - same as ACTIVE -> RETIRED
    side_effects: []
concurrency_rules:
- rule_id: cycle-close-stale-district
  parent_entity: District
  write_endpoint: POST /districts/{id}/billing-cycles/{cycleId}/close
  occ_field: expected_district_version
  description: 'Closing a BillingCycle against a District whose version has advanced

    since the client last observed it is rejected. Closing mutates

    reserve_balance_cents, covenant_status, current_billing_epoch and every

    member''s consecutive_delinquent_cycles, so a stale view would post a

    reserve ledger entry against an obsolete balance.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: reserve-withdrawal-stale-district
  parent_entity: District
  write_endpoint: POST /districts/{id}/board-resolutions
  occ_field: expected_district_version
  description: 'Proposing a RESERVE_WITHDRAWAL BoardResolution against a District whose

    version has advanced since the client last observed it is rejected: the

    covenant floor check (reserve_balance_cents >= reserve_target_cents *

    WITHDRAWAL_FLOOR_RATIO) is evaluated against District fields that a

    prior mutation (cycle close, loan amendment, earlier withdrawal) may

    already have changed.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
calculations:
- name: tiered_usage_charge
  trigger: BillingCycle bill transition (per invoice)
  algorithm: tiered_pricing
  formula: 'Inputs: usage_gallons U; pinned schedule S.

    billable_over_inclusion = max(0, U - S.included_gallons)

    tier2_gal = min(billable_over_inclusion, S.tier2_cap_gallons - S.included_gallons)

    tier3_gal = max(0, U - S.tier2_cap_gallons)

    # Marginal per-thousand rates with per-tier ceiling division (each tier''s

    # remainder rounds UP to the next started 1,000 gallons — pinned order):

    tier2_charge = ceil(tier2_gal / 1000) * S.tier2_rate_cents_per_kgal

    tier3_charge = ceil(tier3_gal / 1000) * S.tier3_rate_cents_per_kgal

    usage_charge_cents = tier2_charge + tier3_charge

    '
  constants:
    GALLONS_PER_KGAL: 1000
  precision: 'integer cents; ceil division per tier BEFORE summing (rounding order pinned: round-per-tier-then-sum)'
  input_set: Exactly one accepted MeterReading for the tap in this cycle; ESTIMATED readings bill identically to ACTUAL (difference reconciled next cycle by regression
    check)
  variants:
  - name: estimated_reading_variant
    when: accepted MeterReading.reading_type == ESTIMATED
    difference: Same formula, but usage is the estimate; on the NEXT cycle's ACTUAL reading, usage_gallons = actual_register - estimated_register (which may under/over-recover
      vs reality, deliberately not trued-up on the prior invoice)
  - name: actual_reading_variant
    when: reading_type == ACTUAL
    difference: usage = register delta vs prior accepted reading
- name: invoice_total
  trigger: BillingCycle bill transition (per invoice)
  algorithm: threshold
  formula: '# Evaluation order pinned (circular-looking dependency resolved):

    # 1) usage_charge_cents := tiered_usage_charge(U, S)

    # 2) base := max(S.base_minimum_cents, S.base_minimum_cents + usage_charge_cents)

    #    i.e. minimum acts as a floor on (minimum + usage) — equivalently the

    #    customer ALWAYS pays base_minimum_cents, plus marginal usage over

    #    inclusion; the max() is load-bearing for the zero-usage edge.

    # 3) total_cents := base + reconnect_fee_cents

    # reconnect_fee_cents is accrued when the tap carried pending_reconnect_fee

    # at billing time (and is then cleared).

    total_cents = max(S.base_minimum_cents, S.base_minimum_cents + usage_charge_cents) + reconnect_fee_cents

    '
  constants: {}
  precision: integer cents
  input_set: All taps in status INSTALLED or RECONNECTED at bill time; DISCONNECTED taps bill minimum only if any reading was accepted this cycle
- name: provisional_water_loss
  trigger: BillingCycle READINGS_COMPLETE -> BILLED
  algorithm: forward_looking
  formula: "master = the single MasterMeterReading.master_gallons for the cycle, or\n         PROVISIONAL_MASTER_FALLBACK if none posted yet:\n         PROVISIONAL_MASTER_FALLBACK\
    \ = sum over taps of usage_gallons (loss provisionally 0)\nsold = sum of usage_gallons over accepted MeterReadings in this cycle\n      (status: all accepted\
    \ readings regardless of reading_type)\nprovisional_loss_pct = round(100.0 * (master - sold) / master, 3)  if master > 0\n                     = 0.000 if master\
    \ == 0\n"
  constants:
    PROVISIONAL_MASTER_FALLBACK: sum_of_sold
  precision: 3 decimal places, round_half_up
- name: final_water_loss
  trigger: BillingCycle BILLED -> CLOSED
  algorithm: chronological
  formula: "master = the single MasterMeterReading.master_gallons for the cycle (required at close)\nsold = sum over accepted MeterReadings of usage_gallons,\n  \
    \     processed in chronological order of MeterReading.created_at ASC\n       with ties broken by reading_gallons ASC;\n       FINAL_OFF readings replace (not\
    \ add to) the tap's earlier reading\n       for the cycle: sold contribution of the tap = its FINAL_OFF usage.\nfinal_loss_pct = round(100.0 * (master - sold)\
    \ / master, 3) if master > 0 else 0.000\nloss_revenue_cents = round((master - sold) * revenue_per_gallon_cents, 0)\n  where revenue_per_gallon_cents =\n    (district-wide\
    \ billed_total_cents this cycle) / (sold) if sold > 0 else 0\n"
  constants: {}
  precision: final_loss_pct 3 decimals round_half_up; loss_revenue_cents integer round_half_up
  note: provisional vs final diverge whenever a FINAL_OFF reading lands between bill and close — dual-variant pair on BillingCycle.
- name: delinquency_escalation
  trigger: BillingCycle bill cascade AND days advance (logical clock)
  algorithm: threshold
  formula: "For each unpaid invoice (billing_status != PAID, != VOID):\n  days_past_due = floor((now_utc - cycle.due_date_utc) / 86400), min 0\n  transitions evaluated\
    \ at each bill cascade AND at explicit issue-notice:\n    days_past_due >= DISCONNECT_DAY_THRESHOLD (45) AND currently NOTICED -> DISCONNECT_ELIGIBLE\n    days_past_due\
    \ >= NOTICE_DAY_THRESHOLD (10) AND currently DELINQUENT -> NOTICED (only via explicit issue-notice or bill cascade)\n    now_utc > due_date_utc AND currently\
    \ CURRENT -> DELINQUENT\nBoundary: threshold comparisons are >= (a 45-day-old invoice IS eligible).\n"
  constants:
    NOTICE_DAY_THRESHOLD: 10
    DISCONNECT_DAY_THRESHOLD: 45
  precision: integer days, floor division
- name: reserve_covenant_check
  trigger: ReserveEntry post; LOAN_AMENDMENT resolution adoption; cycle close
  algorithm: constraint_propagation
  formula: "reserve_target_cents = annual_debt_service_cents              # USDA: one year of debt service\nmonthly_deposit_cents = ceil(annual_debt_service_cents\
    \ / (12 * 10))  # 1/10 of annual debt service per year, monthly\nreserve_deficit_cents = max(0, reserve_target_cents - reserve_balance_cents)\ncoverage_ratio\
    \ = reserve_balance_cents / reserve_target_cents (0 if target == 0)\ncovenant_status =\n  RATE_COVENANT_BREACH if active schedule's projected annual revenue <\
    \ annual_debt_service_cents * RATE_COVENANT_RATIO\n  else RESERVE_DEFICIENT if reserve_deficit_cents > 0\n  else IN_COMPLIANCE\nWITHDRAWAL floor: a RESERVE_WITHDRAWAL\
    \ is rejected unless\n  (reserve_balance_cents - withdrawal) >= reserve_target_cents * WITHDRAWAL_FLOOR_RATIO\n"
  constants:
    WITHDRAWAL_FLOOR_RATIO: 0.75
    RATE_COVENANT_RATIO: 1.1
  precision: ratios exact rational; money integer cents
  note: 'monthly_deposit = ceil(annual/120): combinatorial rounding chain feeding reserve balance.'
- name: payment_waterfall
  trigger: POST /districts/{id}/payments
  algorithm: waterfall_allocation
  formula: "outstanding = invoice.total_cents - invoice.amount_paid_cents\napplied_cents = min(amount_cents, outstanding)\noverpay = amount_cents - applied_cents\n\
    member.credit_balance_cents += overpay\nIf member.credit_balance_cents > 0 and outstanding > 0 BEFORE this payment:\n  absorb = min(member.credit_balance_cents,\
    \ outstanding)\n  credit_balance_cents -= absorb; applied_cents += absorb   # credit absorbs first\ninvoice.amount_paid_cents += applied_cents\n"
  constants: {}
  precision: integer cents
  note: 'Order pinned: pre-existing member credit absorbs into the invoice BEFORE the new tender is applied; remainder then flows back to credit. Reordering changes
    results when amount_cents and credit both cover portions.'
- name: annexation_fee_split
  trigger: AnnexationPetition WITHDRAWN or RATIFIED
  algorithm: threshold
  formula: "feasibility_fee_cents = max(FEASIBILITY_FEE_FLOOR_CENTS,\n                            round(deposit_cents * FEASIBILITY_FEE_PCT, 0))\nrefund_cents = deposit_cents\
    \ - feasibility_fee_cents\n"
  constants:
    FEASIBILITY_FEE_FLOOR_CENTS: 25000
    FEASIBILITY_FEE_PCT: 0.2
  precision: integer cents, round_half_up on the percentage leg before the max()
  input_set: the petition's cumulative deposit_cents (including resubmission top-ups)
validations:
- priority: 1
  category: auth
  check: X-User-ID and X-User-Role headers present and role value is one of the declared roles
  error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
  http_status: 400
  applies_to: all
- priority: 2
  category: auth
  check: Role permitted for this endpoint per §1.5 roles
  error_id: ERR_INSUFFICIENT_PERMISSIONS
  http_status: 403
  applies_to: all
- priority: 3
  category: auth
  check: 'Segregation of duties: the same X-User-ID may not both bill a cycle (bill) and post a payment against its invoices; BoardDirector who proposed a resolution
    may not record the deciding vote'
  error_id: ERR_SEGREGATION_OF_DUTIES
  http_status: 403
  applies_to: POST .../billing-cycles/{cycleId}/bill, POST /districts/{id}/payments, POST .../board-resolutions/{id}/record-vote
- priority: 4
  category: existence
  check: 'Path ids exist and belong to the district (validated left-to-right: districtId, then nested id)'
  error_id: ERR_DISTRICT_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_TAP_NOT_FOUND | ERR_CYCLE_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_SCHEDULE_NOT_FOUND | ERR_PETITION_NOT_FOUND
    | ERR_RESOLUTION_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_SAMPLE_NOT_FOUND | ERR_AREA_NOT_FOUND | ERR_PAYMENT_NOT_FOUND
  http_status: 404
  applies_to: all nested endpoints
- priority: 5
  category: state
  check: Target resource in a legal from-state for the requested transition
  error_id: 'ERR_INVALID_STATE (specific per-resource variants: ERR_CYCLE_NOT_OPEN, ERR_CYCLE_NOT_READINGS_COMPLETE, ERR_CYCLE_NOT_BILLED, ERR_MEMBER_NOT_ACTIVE,
    ERR_ORDER_NOT_SAMPLING, ERR_PETITION_NOT_REVIEWABLE, ERR_RESOLUTION_NOT_PROPOSED)'
  http_status: 409
  applies_to: all action endpoints
- priority: 6
  category: business_safety
  check: 'Boil-order moratorium: no disconnect while any BoilOrder IN_EFFECT for the district'
  error_id: ERR_BOIL_ORDER_MORATORIUM
  http_status: 409
  applies_to: POST /districts/{id}/taps/{tapId}/disconnect
- priority: 7
  category: business_safety
  check: 'Notification completeness: every ACTIVE member notified before sampling begins'
  error_id: ERR_NOTIFICATION_INCOMPLETE
  http_status: 409
  applies_to: POST /districts/{id}/boil-orders/{orderId}/begin-sampling
- priority: 8
  category: business_safety
  check: Compliance sample collected within SAMPLING_WINDOW_HOURS of boil order issuance and not before issued_utc
  error_id: ERR_SAMPLE_WINDOW_VIOLATION
  http_status: 422
  applies_to: POST /districts/{id}/compliance-samples
- priority: 9
  category: business_constraint
  check: 'Meter reading regression: reading_gallons >= tap''s latest accepted cumulative reading'
  error_id: ERR_READING_REGRESSION
  http_status: 422
  applies_to: POST /districts/{id}/meter-readings
- priority: 10
  category: business_constraint
  check: One accepted reading per tap per cycle; duplicate reading rejected
  error_id: ERR_DUPLICATE_READING
  http_status: 409
  applies_to: POST /districts/{id}/meter-readings
- priority: 11
  category: business_constraint
  check: 'Cycle completeness: every INSTALLED/RECONNECTED tap has an accepted reading before mark-readings-complete'
  error_id: ERR_MISSING_METER_READINGS
  http_status: 409
  applies_to: POST .../billing-cycles/{cycleId}/mark-readings-complete
- priority: 12
  category: business_temporal
  check: 'Cycle period well-formed: period_end_utc > period_start_utc; due_date_utc >= period_end_utc; new cycle''s period_start_utc >= prior CLOSED cycle''s period_end_utc
    (no overlap, no back-dating)'
  error_id: ERR_CYCLE_WINDOW_INVALID
  http_status: 422
  applies_to: POST /districts/{id}/billing-cycles
- priority: 13
  category: business_referential
  check: Member.service_area_id must reference a ServiceArea of the same district with status in {ACTIVE, ANNEXED_IN}
  error_id: ERR_AREA_NOT_SERVICEABLE
  http_status: 422
  applies_to: POST /districts/{id}/members, POST /districts/{id}/members/{memberId}/approve
- priority: 14
  category: business_referential
  check: 'Rate schedule tier sanity: tier2_cap_gallons > included_gallons; all rates > 0'
  error_id: ERR_RATE_SCHEDULE_INVALID
  http_status: 422
  applies_to: POST /districts/{id}/rate-schedules
- priority: 15
  category: business_fiscal
  check: 'Reserve covenant: withdrawal keeps reserve_balance_cents >= 75% of reserve_target_cents'
  error_id: ERR_RESERVE_COVENANT_BREACH
  http_status: 409
  applies_to: POST /districts/{id}/board-resolutions (RESERVE_WITHDRAWAL at adoption)
- priority: 16
  category: business_fiscal
  check: Reconnect requires zero outstanding balance on every invoice for the tap
  error_id: ERR_OUTSTANDING_BALANCE
  http_status: 402
  applies_to: POST /districts/{id}/taps/{tapId}/reconnect
- priority: 17
  category: business_fiscal
  check: Disconnect requires all unpaid invoices on the tap in collection_status DISCONNECT_ELIGIBLE
  error_id: ERR_NOT_DISCONNECT_ELIGIBLE
  http_status: 409
  applies_to: POST /districts/{id}/taps/{tapId}/disconnect
- priority: 18
  category: business_fiscal
  check: Tap fee must be fully paid before meter installation (tap_fee_paid_cents == tap_fee_cents enforced via state PAID)
  error_id: ERR_TAP_FEE_UNPAID
  http_status: 402
  applies_to: POST /districts/{id}/taps/{tapId}/install-meter
- priority: 19
  category: business_constraint
  check: One active tap per member per service area
  error_id: ERR_DUPLICATE_ACTIVE_TAP
  http_status: 409
  applies_to: POST /districts/{id}/taps/{tapId}/install-meter
- priority: 20
  category: business_referential
  check: 'OCC: expected_district_version must equal current District.version'
  error_id: ERR_STALE_VERSION
  http_status: 412
  applies_to: POST .../billing-cycles/{cycleId}/close, POST /districts/{id}/board-resolutions
- priority: 21
  category: business_constraint
  check: 'Board voting: voter has not already voted on this resolution; resolution still PROPOSED; quorum constants QUORUM_FOR=3, QUORUM_AGAINST=3'
  error_id: ERR_DUPLICATE_VOTE
  http_status: 409
  applies_to: POST .../board-resolutions/{resolutionId}/record-vote
- priority: 22
  category: business_constraint
  check: MasterMeterReading required and unique per cycle at close
  error_id: ERR_MASTER_READING_REQUIRED
  http_status: 409
  applies_to: POST .../billing-cycles/{cycleId}/close
- priority: 23
  category: business_constraint
  check: No active rate schedule when billing
  error_id: ERR_NO_ACTIVE_RATE_SCHEDULE
  http_status: 409
  applies_to: POST .../billing-cycles/{cycleId}/bill, POST /districts/{id}/taps (tap fee quote requires an ADOPTED schedule)
- priority: 24
  category: existence
  check: 'Request body well-formed: all required fields present with correct primitive types (applied after auth/role, before existence)'
  error_id: ERR_INVALID_REQUEST
  http_status: 400
  applies_to: all endpoints with a request body
- priority: 25
  category: business_constraint
  check: Duplicate (boil_order_id, member_id) notification rejected
  error_id: ERR_DUPLICATE_NOTIFICATION
  http_status: 409
  applies_to: POST /districts/{id}/boil-orders/{orderId}/notifications
- priority: 26
  category: state
  check: Payment reversal requires payment status == POSTED
  error_id: ERR_PAYMENT_ALREADY_REVERSED
  http_status: 409
  applies_to: POST /districts/{id}/payments/{paymentId}/reverse
- priority: 27
  category: business_referential
  check: Retire requires no member referencing the area in a non-terminal membership_status
  error_id: ERR_AREA_IN_USE
  http_status: 409
  applies_to: POST /districts/{id}/service-areas/{areaId}/retire
endpoints:
- method: POST
  path: /_clock/set_current_utc
  description: Set the server's logical clock. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time.
  roles:
  - BillingClerk
  - Treasurer
  - BoardDirector
  - FieldOperator
  - SystemAdmin
  code: 200
  input:
  - to_iso8601
  output:
    current_utc: string
  side_effects:
