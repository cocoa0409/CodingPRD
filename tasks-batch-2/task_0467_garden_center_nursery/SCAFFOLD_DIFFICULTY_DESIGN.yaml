  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: vehicle_buffered_window_overlap
        grounds:
          - validations[priority=11]
          - entities.Vehicle.fields.turnaround_minutes
          - entities.Delivery.fields.window_start
        distinguishing_aspect: |
          BUFFERED-ADJACENCY interval semantics on the Vehicle resource: the busy
          interval is [start, end + turnaround_minutes); a new window intersecting that
          buffered interval is rejected with ERR_VEHICLE_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "Vehicle turnaround_minutes=30; Order A delivery [10:00,11:00) busy until 11:30. Order B books [11:15,12:00) which intersects the buffer."
          setup_api_calls:
