              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "GET /officers/${pike_id}/eis-profile"
              payload: {}
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { pike_count3: $.data.event_count, pike_total3: $.data.weighted_total, pike_score3: $.data.composite_score, pike_level3: $.data.alert_level }
            - call: "GET /officers/${pike_id}"
              payload: {}
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { pike_stored_score: $.data.eis_score, pike_stored_level: $.data.eis_alert_level, pike_open_alerts: $.data.open_alert_count }
          assert:
            - "${pike_e1_weight} == 3, taken from EVENT_BASE_WEIGHTS.USE_OF_FORCE"
            - "${pike_window_start} == 2025-08-01T00:00:00Z, the left edge of the 365-day window"
            - "${pike_count1} == 1, ${pike_total1} == 3.00 (age 180 keeps decay 1.0), ${pike_score1} == 7.50 and ${pike_level1} == NONE"
            - "${quill_count1} == 1, ${quill_total1} == 1.50 (age 181 applies the 0.5 stale factor), ${quill_score1} == 3.75 and ${quill_level1} == NONE"
            - "${pike_count2} == 1 and ${pike_total2} == 3.00: the event aged exactly 365 days sits on the excluded left edge and contributes nothing"
            - "${pike_count3} == 2, ${pike_total3} == 4.50 (3.00 plus the stale 1.50 from the 364-day event) and ${pike_score3} == 11.25"
            - "${pike_level3} == NONE and ${pike_stored_score} == 11.25, ${pike_stored_level} == NONE, ${pike_open_alerts} == 0, since 11.25 never reaches the WATCH threshold of 30"
            - "GET /officers/${pike_id}/activity-events returns 3 rows in total, so the excluded event is stored but not scored"

