            - call: "POST /_grade-records"
              payload: { enrollment_id: "${e1}", content_item_id: "${item_id}", earned_points: 160.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { e1_earned: $.data.earned_points_total, e1_graded_possible: $.data.graded_points_possible }
            - call: "POST /_grade-records"
              payload: { enrollment_id: "${e2}", content_item_id: "${item_id}", earned_points: 90.00 }
              as: Instructor
