# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — Task 1115 §1.8 Test Targeting Index
# 9 difficulty rules x >=2 instances (23 total). Every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and replays from empty-DB via §1.5 endpoints only.
# All formula-derived assert values were computed by executing the §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: registration_fee_provisional_vs_finalized_fleet_discount
        grounds:
          - calculations.annual_registration_fee
          - entities.VehicleRegistration.fields.provisional_fee_cents
          - entities.VehicleRegistration.fields.finalized_fee_cents
        distinguishing_aspect: |
          Same vehicle data, two variants on the FISCAL domain of VehicleRegistration:
          PROVISIONAL (2% per equipment item, fleet discount assumed when the community
          program is enabled) yields 16560; FINALIZED (2.5% per item, discount withheld
          because the holder has no RETURNED dispatch in the trailing 365 days) yields
          19000. Same inputs, different money.
        test_recipe:
          setup:
            - "Community with fleet_program_enabled=true"
            - "ELIGIBLE holder born 2010-05-01 (age 16 at default clock 2026-05-01)"
            - "LSV vehicle: all 8 equipment items present, 6 seats"
            - "DRAFT registration for 2026; one finalized PASSED inspection (all components 90)"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-DV1", fleet_program_enabled: true }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H DV1", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "LSV", seat_count: 6, has_headlights: true, has_brake_lights: true, has_turn_signals: true, has_horn: true, has_windshield: true, has_seatbelts: true, has_reflectors: true, mirror_count: 2 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v_id: $.data.id } }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v_id}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { reg_id: $.data.id, prov_fee: $.data.provisional_fee_cents } }
            - { call: "POST /api/inspections", payload: { registration_id: "${reg_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: Inspector, captures: { ins_id: $.data.id } }
            - { call: "POST /api/inspections/${ins_id}/finalize", payload: { headlights_score: 90, brake_lights_score: 90, turn_signals_score: 90, horn_score: 90, mirrors_score: 90, windshield_score: 90, seatbelts_score: 90, reflectors_score: 90 }, as: Inspector }
            - { call: "GET /api/registrations/${reg_id}", as: CommunityAdmin, captures: { fin_fee: $.data.finalized_fee_cents } }
          trigger:
            - { call: "GET /api/registrations/${reg_id}", as: CommunityAdmin, captures: { reg_after: $.data.total_due_cents } }
          assert:
            - "provisional_fee_cents == 16560 (15000 * min(1+0.02*8, 1.20) = 17400; + max(0,6-4)*500 = 18400; * 0.9 = 16560; >= base 15000)"
            - "finalized_fee_cents == 19000 (15000 * min(1+0.025*8, 1.20) = 18000; + 1000 = 19000; no dispatch history -> no discount)"
            - "${prov_fee} == 16560 and ${fin_fee} == 19000 and provisional != finalized"
            - "total_due_cents == 19000 (min(19000 + 0, 2 * 19000))"

      - name: renewal_compliance_score_provisional_vs_audited
        grounds:
          - calculations.renewal_compliance_score
          - entities.VehicleRegistration.fields.renewal_score_provisional
          - entities.VehicleRegistration.fields.renewal_score_audited
          - state_machines.VehicleRegistration.ACTIVE_to_RENEWAL_PENDING
        distinguishing_aspect: |
          Same holder violation history, two variants on the RISK-SCORING domain of
          PermitHolder standing (different domain from the registration fee): PROVISIONAL
          at renew (UPHELD violations only, as_of = renew instant) yields 97; AUDITED at
          finalize (adds FILED violations aged > 30 days at half weight, as_of = finalize
          instant) yields 92. Different entity domain and different numbers.
        test_recipe:
          setup:
            - "ACTIVE registration (expiry 2027-05-01T00:00:00Z), wallet 81000 after activation debit of 19000"
            - "V1: UPHELD violation, 6 points, occurred 2026-08-27 (200 days before renew -> recency weight 0.5)"
            - "V2: FILED violation, 10 points, occurred 2027-02-03 (40 days before renew; 45 days at finalize -> aged > 30)"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-DV2", fleet_program_enabled: true }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H DV2", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin, captures: { h_v: $.data.version } }
            - { call: "POST /api/permit-holders/${h_id}/wallet/deposits", payload: { amount_cents: 100000, expected_permit_holder_version: "${h_v}" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "LSV", seat_count: 6, has_headlights: true, has_brake_lights: true, has_turn_signals: true, has_horn: true, has_windshield: true, has_seatbelts: true, has_reflectors: true, mirror_count: 2 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v_id: $.data.id } }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v_id}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /api/inspections", payload: { registration_id: "${reg_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: Inspector, captures: { ins_id: $.data.id } }
            - { call: "POST /api/inspections/${ins_id}/finalize", payload: { headlights_score: 90, brake_lights_score: 90, turn_signals_score: 90, horn_score: 90, mirrors_score: 90, windshield_score: 90, seatbelts_score: 90, reflectors_score: 90 }, as: Inspector }
            - { call: "POST /api/insurance-policies", payload: { holder_id: "${h_id}", vehicle_id: "${v_id}", provider_name: "P", policy_number: "N-DV2", liability_coverage_cents: 10000000, effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/registrations/${reg_id}/activate", payload: {}, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-03-10T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/violations", payload: { holder_id: "${h_id}", violation_code: "OFF_ROUTE", points_assessed: 6, fine_cents: 5000, occurred_at: "2026-08-27T00:00:00Z" }, as: EnforcementOfficer, captures: { vio1_id: $.data.id } }
            - { call: "POST /api/violations/${vio1_id}/uphold", payload: {}, as: EnforcementOfficer }
            - { call: "POST /api/violations", payload: { holder_id: "${h_id}", violation_code: "PARKING_VIOLATION", points_assessed: 10, fine_cents: 8000, occurred_at: "2027-02-03T00:00:00Z" }, as: EnforcementOfficer, captures: { vio2_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-03-15T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/registrations/${reg_id}/renew", payload: {}, as: PermitHolder, as_user_id: "${h_id}", captures: { score_prov: $.data.renewal_score_provisional } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-03-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/registrations/${reg_id}/finalize-renewal", payload: {}, as: CommunityAdmin, captures: { score_aud: $.data.renewal_score_audited, reg_status: $.data.status } }
            - { call: "GET /api/permit-holders/${h_id}", as: CommunityAdmin, captures: { wallet_after: $.data.wallet_balance_cents } }
          assert:
            - "renewal_score_provisional == 97 (100 - 6*0.5; FILED V2 excluded)"
            - "renewal_score_audited == 92 (100 - 6*0.5 - 10*1.0*0.5; aged FILED included at half weight)"
            - "score_prov != score_aud"
            - "registration.status == ACTIVE (92 >= 70) and expiry_date == 2028-05-01T00:00:00Z"
            - "wallet_balance_cents == 62000 (81000 - 19000 finalized renewal fee; no RETURNED dispatch -> no discount)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: registration_fee_tiered_equipment_multiplier_floor
        grounds:
          - calculations.annual_registration_fee
          - entities.Vehicle.fields.equipment_count
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — nested min() cap on the
          equipment multiplier, nested max() seat surcharge, a conditional branch on
          Community.fleet_program_enabled, and a max() floor at base. Vehicle A (cart,
          0 equipment, 4 seats, fleet program on) hits the floor: raw discounted 6750
          is raised to 7500. Vehicle B (cart, 8 equipment, 6 seats) exercises
          cap+surcharge+discount: 7500*1.16=8700, +1000=9700, *0.9=8730.
        test_recipe:
          setup:
            - "Community with fleet_program_enabled=true"
            - "ELIGIBLE holder; two GOLF_CART vehicles: A 0 equipment 4 seats, B 8 equipment 6 seats"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-CF1", fleet_program_enabled: true }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H CF1", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "GOLF_CART", seat_count: 4, has_headlights: false, has_brake_lights: false, has_turn_signals: false, has_horn: false, has_windshield: false, has_seatbelts: false, has_reflectors: false, mirror_count: 0 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v_a: $.data.id } }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "GOLF_CART", seat_count: 6, has_headlights: true, has_brake_lights: true, has_turn_signals: true, has_horn: true, has_windshield: true, has_seatbelts: true, has_reflectors: true, mirror_count: 2 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v_b: $.data.id } }
          trigger:
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v_a}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { fee_a: $.data.provisional_fee_cents } }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v_b}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { fee_b: $.data.provisional_fee_cents } }
          assert:
            - "fee_a == 7500 (7500*1.00=7500; *0.9=6750; floor max(6750, 7500) = 7500 — floor binds)"
            - "fee_b == 8730 (mult min(1+0.02*8, 1.20)=1.16; 7500*1.16=8700; seats max(0,6-4)*500=1000; 9700*0.9=8730; >= 7500)"
            - "fee_a != fee_b and both registrations status == DRAFT"

      - name: inspection_score_round_per_component_then_sum
        grounds:
          - calculations.inspection_total_score
          - entities.Inspection.fields.total_score
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. With all components 84,
          per-component round-half-up to 2 decimals THEN sum yields 83.99
          (14.00+14.00+11.20+5.60+8.40+8.40+13.99+8.40); summing raw products and
          rounding once yields 84.00. The scaffold pins per-component-first, so 83.99
          is the only correct answer.
        test_recipe:
          setup:
            - "Community, ELIGIBLE holder, full-equipment LSV, DRAFT registration, one SCHEDULED inspection"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-CF2" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H CF2", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "LSV", seat_count: 4, has_headlights: true, has_brake_lights: true, has_turn_signals: true, has_horn: true, has_windshield: true, has_seatbelts: true, has_reflectors: true, mirror_count: 2 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v_id: $.data.id } }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v_id}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /api/inspections", payload: { registration_id: "${reg_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: Inspector, captures: { ins_id: $.data.id } }
          trigger:
            - { call: "POST /api/inspections/${ins_id}/finalize", payload: { headlights_score: 84, brake_lights_score: 84, turn_signals_score: 84, horn_score: 84, mirrors_score: 84, windshield_score: 84, seatbelts_score: 84, reflectors_score: 84 }, as: Inspector, captures: { total: $.data.total_score, passed: $.data.passed } }
          assert:
            - "total_score == 83.99 (NOT 84.00 — per-component rounding before summation is normative)"
            - "passed == true (83.99 >= 70.00)"
            - "inspection.status == PASSED"

      - name: late_fee_evaluation_order_pinned
        grounds:
          - calculations.late_renewal_fee
          - entities.VehicleRegistration.fields.late_fee_cents
          - entities.VehicleRegistration.fields.total_due_cents
          - state_machines.VehicleRegistration.EXPIRED_to_RENEWAL_PENDING
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — the late-fee tier is keyed on the
          finalized base fee, while the payable total is capped at 2x that same base
          fee — resolved only by the pinned order fee -> tier -> late -> cap. For an
          LSV (finalized 19000 -> tier B) renewed 30 days late: late_fee 2500,
          total_due min(19000+2500, 38000) = 21500.
        test_recipe:
          setup:
            - "ACTIVE LSV registration (finalized 19000 at activation), expiry 2027-05-01T00:00:00Z, wallet 81000"
            - "logical clock advanced to 2027-05-31T00:00:00Z: registration auto-flips ACTIVE -> EXPIRED, exactly 30 days overdue"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-CF3", fleet_program_enabled: true }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H CF3", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin, captures: { h_v: $.data.version } }
            - { call: "POST /api/permit-holders/${h_id}/wallet/deposits", payload: { amount_cents: 100000, expected_permit_holder_version: "${h_v}" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "LSV", seat_count: 6, has_headlights: true, has_brake_lights: true, has_turn_signals: true, has_horn: true, has_windshield: true, has_seatbelts: true, has_reflectors: true, mirror_count: 2 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v_id: $.data.id } }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v_id}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /api/inspections", payload: { registration_id: "${reg_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: Inspector, captures: { ins_id: $.data.id } }
            - { call: "POST /api/inspections/${ins_id}/finalize", payload: { headlights_score: 90, brake_lights_score: 90, turn_signals_score: 90, horn_score: 90, mirrors_score: 90, windshield_score: 90, seatbelts_score: 90, reflectors_score: 90 }, as: Inspector }
            - { call: "POST /api/insurance-policies", payload: { holder_id: "${h_id}", vehicle_id: "${v_id}", provider_name: "P", policy_number: "N-CF3", liability_coverage_cents: 10000000, effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/registrations/${reg_id}/activate", payload: {}, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-05-31T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/registrations/${reg_id}/renew", payload: {}, as: PermitHolder, as_user_id: "${h_id}", captures: { late: $.data.late_fee_cents, total: $.data.total_due_cents, fin: $.data.finalized_fee_cents, st: $.data.status } }
          assert:
            - "registration.status == RENEWAL_PENDING (reached from EXPIRED, inside 90-day grace)"
            - "finalized_fee_cents == 19000 (FINALIZED variant recomputed on renew-from-EXPIRED)"
            - "late_fee_cents == 2500 (tier B because 19000 >= 10000; 30 days overdue -> band <=30 inclusive)"
            - "total_due_cents == 21500 (min(19000 + 2500, 2 * 19000))"
            - "renewal_score_provisional == 100 (no violations)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: registration_cyclic_renewal_and_suspension
        grounds:
          - state_machines.VehicleRegistration.ACTIVE_to_RENEWAL_PENDING
          - state_machines.VehicleRegistration.RENEWAL_PENDING_to_ACTIVE
          - state_machines.VehicleRegistration.ACTIVE_to_SUSPENDED
          - state_machines.VehicleRegistration.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          VehicleRegistration is CYCLIC on two distinct loops exercised end-to-end in
          one lifecycle: ACTIVE -> RENEWAL_PENDING -> ACTIVE (annual renewal, expiry
          extended by 365 days) and then ACTIVE -> SUSPENDED -> ACTIVE (admin suspend /
          reinstate). Terminal-free loops, not a one-way pipeline.
        test_recipe:
          setup:
            - "ACTIVE registration, expiry 2027-05-01T00:00:00Z, wallet 81000, no violations, ACTIVE insurance to 2027-12-31"
            - "clock moved into the renewal window (2027-03-15; window opens 2027-03-02)"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-SM1", fleet_program_enabled: true }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H SM1", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin, captures: { h_v: $.data.version } }
            - { call: "POST /api/permit-holders/${h_id}/wallet/deposits", payload: { amount_cents: 100000, expected_permit_holder_version: "${h_v}" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "LSV", seat_count: 6, has_headlights: true, has_brake_lights: true, has_turn_signals: true, has_horn: true, has_windshield: true, has_seatbelts: true, has_reflectors: true, mirror_count: 2 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v_id: $.data.id } }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v_id}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /api/inspections", payload: { registration_id: "${reg_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: Inspector, captures: { ins_id: $.data.id } }
            - { call: "POST /api/inspections/${ins_id}/finalize", payload: { headlights_score: 90, brake_lights_score: 90, turn_signals_score: 90, horn_score: 90, mirrors_score: 90, windshield_score: 90, seatbelts_score: 90, reflectors_score: 90 }, as: Inspector }
            - { call: "POST /api/insurance-policies", payload: { holder_id: "${h_id}", vehicle_id: "${v_id}", provider_name: "P", policy_number: "N-SM1", liability_coverage_cents: 10000000, effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/registrations/${reg_id}/activate", payload: {}, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-03-15T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/registrations/${reg_id}/renew", payload: {}, as: PermitHolder, as_user_id: "${h_id}", captures: { s1: $.data.status } }
            - { call: "POST /api/registrations/${reg_id}/finalize-renewal", payload: {}, as: CommunityAdmin, captures: { s2: $.data.status, exp2: $.data.expiry_date } }
            - { call: "POST /api/registrations/${reg_id}/suspend", payload: {}, as: CommunityAdmin, captures: { s3: $.data.status } }
            - { call: "POST /api/registrations/${reg_id}/reinstate", payload: {}, as: CommunityAdmin, captures: { s4: $.data.status } }
          assert:
            - "s1 == RENEWAL_PENDING (loop 1 entered from ACTIVE)"
            - "s2 == ACTIVE and exp2 == 2028-05-01T00:00:00Z (loop 1 closed; expiry extended 365 days; wallet 81000-19000=62000)"
            - "s3 == SUSPENDED (loop 2 entered)"
            - "s4 == ACTIVE (loop 2 closed; holder not BARRED, latest inspection PASSED, insurance ACTIVE)"

      - name: permit_holder_independent_dimensions
        grounds:
          - state_machines.PermitHolder.ELIGIBLE_to_SUSPENDED
          - calculations.holder_points_standing
          - entities.PermitHolder.fields.eligibility_status
          - entities.PermitHolder.fields.compliance_status
        distinguishing_aspect: |
          PermitHolder carries TWO INDEPENDENT state dimensions on one row: moving
          eligibility_status (ELIGIBLE -> SUSPENDED by admin) leaves compliance_status
          (PROBATION) untouched, and moving compliance_status (PROBATION -> GOOD_STANDING
          via violation dismissal) leaves eligibility_status (SUSPENDED) untouched.
          Neither dimension gates the other's transition.
        test_recipe:
          setup:
            - "ELIGIBLE holder; one UPHELD 4-point violation -> compliance PROBATION"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-SM2" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H SM2", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin }
            - { call: "POST /api/violations", payload: { holder_id: "${h_id}", violation_code: "PARKING_VIOLATION", points_assessed: 4, fine_cents: 3000, occurred_at: "2026-04-15T00:00:00Z" }, as: EnforcementOfficer, captures: { vio_id: $.data.id } }
            - { call: "POST /api/violations/${vio_id}/uphold", payload: {}, as: EnforcementOfficer }
          trigger:
            - { call: "POST /api/permit-holders/${h_id}/suspend", payload: {}, as: CommunityAdmin, captures: { elig_1: $.data.eligibility_status, comp_1: $.data.compliance_status } }
            - { call: "POST /api/violations/${vio_id}/dismiss", payload: {}, as: EnforcementOfficer }
            - { call: "GET /api/permit-holders/${h_id}", as: CommunityAdmin, captures: { elig_2: $.data.eligibility_status, comp_2: $.data.compliance_status, pts_2: $.data.points_balance } }
          assert:
            - "after uphold: points_balance == 4 and compliance_status == PROBATION and eligibility_status == ELIGIBLE"
            - "elig_1 == SUSPENDED while comp_1 == PROBATION (eligibility moved; compliance did not)"
            - "comp_2 == GOOD_STANDING and pts_2 == 0 while elig_2 == SUSPENDED (compliance moved; eligibility did not)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: violation_uphold_cascade_to_route_pass_revocation
        grounds:
          - state_machines.Violation.FILED_to_UPHELD
          - calculations.holder_points_standing
          - state_machines.VehicleRegistration.ACTIVE_to_SUSPENDED
          - state_machines.RoutePass.ACTIVE_to_REVOKED
        distinguishing_aspect: |
          Depth-3 chain where each hop is caused by the previous hop, not by the
          original request: uphold (1) recomputes holder points -> flip into BARRED at
          exactly 12 points (2) suspends the holder's ACTIVE registration (3) revokes
          that registration's ACTIVE route pass. Trigger: POST /api/violations/{id}/uphold.
        test_recipe:
          setup:
            - "ACTIVE LSV registration with an ACTIVE route pass on 2026-07-01T10:00-12:00"
            - "three FILED violations of 4 points each (occurred 2026-06-10); clock 2026-06-15 so the pass window is still upcoming"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-TC1", fleet_program_enabled: true }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H TC1", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin, captures: { h_v: $.data.version } }
            - { call: "POST /api/permit-holders/${h_id}/wallet/deposits", payload: { amount_cents: 100000, expected_permit_holder_version: "${h_v}" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "LSV", seat_count: 6, has_headlights: true, has_brake_lights: true, has_turn_signals: true, has_horn: true, has_windshield: true, has_seatbelts: true, has_reflectors: true, mirror_count: 2 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v_id: $.data.id } }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v_id}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /api/inspections", payload: { registration_id: "${reg_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: Inspector, captures: { ins_id: $.data.id } }
            - { call: "POST /api/inspections/${ins_id}/finalize", payload: { headlights_score: 90, brake_lights_score: 90, turn_signals_score: 90, horn_score: 90, mirrors_score: 90, windshield_score: 90, seatbelts_score: 90, reflectors_score: 90 }, as: Inspector }
            - { call: "POST /api/insurance-policies", payload: { holder_id: "${h_id}", vehicle_id: "${v_id}", provider_name: "P", policy_number: "N-TC1", liability_coverage_cents: 10000000, effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/registrations/${reg_id}/activate", payload: {}, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/routes", payload: { community_id: "${comm_id}", name: "Main St", route_type: "STREET", allowed_vehicle_class: "LSV_ALLOWED" }, as: CommunityAdmin, captures: { rt_id: $.data.id } }
            - { call: "POST /api/route-passes", payload: { route_id: "${rt_id}", registration_id: "${reg_id}", holder_id: "${h_id}", start_at: "2026-07-01T10:00:00Z", end_at: "2026-07-01T12:00:00Z" }, as: PermitHolder, as_user_id: "${h_id}", captures: { rp_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/violations", payload: { holder_id: "${h_id}", registration_id: "${reg_id}", violation_code: "OFF_ROUTE", points_assessed: 4, fine_cents: 5000, occurred_at: "2026-06-10T00:00:00Z" }, as: EnforcementOfficer, captures: { v1: $.data.id } }
            - { call: "POST /api/violations", payload: { holder_id: "${h_id}", registration_id: "${reg_id}", violation_code: "PARKING_VIOLATION", points_assessed: 4, fine_cents: 5000, occurred_at: "2026-06-10T00:00:00Z" }, as: EnforcementOfficer, captures: { v2: $.data.id } }
            - { call: "POST /api/violations", payload: { holder_id: "${h_id}", registration_id: "${reg_id}", violation_code: "UNINSURED_OPERATION", points_assessed: 4, fine_cents: 5000, occurred_at: "2026-06-10T00:00:00Z" }, as: EnforcementOfficer, captures: { v3: $.data.id } }
          trigger:
            - { call: "POST /api/violations/${v1}/uphold", payload: {}, as: EnforcementOfficer }
            - { call: "POST /api/violations/${v2}/uphold", payload: {}, as: EnforcementOfficer }
            - { call: "POST /api/violations/${v3}/uphold", payload: {}, as: EnforcementOfficer }
            - { call: "GET /api/permit-holders/${h_id}", as: CommunityAdmin, captures: { comp: $.data.compliance_status, pts: $.data.points_balance } }
            - { call: "GET /api/registrations/${reg_id}", as: CommunityAdmin, captures: { reg_st: $.data.status } }
            - { call: "GET /api/route-passes/${rp_id}", as: CommunityAdmin, captures: { rp_st: $.data.status } }
          assert:
            - "after first two upholds: points_balance == 8 and compliance_status == PROBATION and registration still ACTIVE"
            - "after third uphold: pts == 12 and comp == BARRED (12 >= 12 inclusive threshold)"
            - "reg_st == SUSPENDED (hop 2 fired on the BARRED flip, not on the uphold itself)"
            - "rp_st == REVOKED (hop 3 fired from the registration suspension)"

      - name: station_offline_cascade_wallet_refund
        grounds:
          - state_machines.ChargingStation.ONLINE_to_OFFLINE
          - state_machines.ChargingReservation.BOOKED_to_CANCELLED
          - calculations.charging_fee
          - entities.PermitHolder.fields.wallet_balance_cents
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (POST /api/charging-stations/{id}/set-offline):
          station OFFLINE (1) cancels the future BOOKED reservation, and that cancellation
          itself (2) credits the 600-cent fee back to the holder wallet. Trigger, depth,
          and propagation pattern all differ from the violation cascade.
        test_recipe:
          setup:
            - "ONLINE station (rate 10 c/min, 2 slots); holder wallet 100000; BOOKED reservation 2026-06-01T10:00-11:00 slot 0 (fee 600 debited -> wallet 99400)"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-TC2" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H TC2", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin, captures: { h_v: $.data.version } }
            - { call: "POST /api/permit-holders/${h_id}/wallet/deposits", payload: { amount_cents: 100000, expected_permit_holder_version: "${h_v}" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/charging-stations", payload: { community_id: "${comm_id}", name: "S-TC2", slot_count: 2, rate_cents_per_min: 10 }, as: CommunityAdmin, captures: { st_id: $.data.id } }
            - { call: "POST /api/charging-reservations", payload: { station_id: "${st_id}", holder_id: "${h_id}", slot_index: 0, start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z" }, as: PermitHolder, as_user_id: "${h_id}", captures: { res_id: $.data.id, res_fee: $.data.fee_cents } }
          trigger:
            - { call: "POST /api/charging-stations/${st_id}/set-offline", payload: {}, as: CommunityAdmin }
            - { call: "GET /api/charging-reservations/${res_id}", as: CommunityAdmin, captures: { res_st: $.data.status } }
            - { call: "GET /api/permit-holders/${h_id}", as: CommunityAdmin, captures: { wallet_after: $.data.wallet_balance_cents } }
          assert:
            - "res_fee == 600 and wallet after booking == 99400"
            - "res_st == CANCELLED (hop 1: station -> reservation; start_at 2026-06-01 > now 2026-05-01 so it was future)"
            - "wallet_after == 100000 (hop 2: cancellation -> refund of exactly fee_cents)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_activate
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - state_machines.VehicleRegistration.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Category pair state x business_fiscal: a second activate on an already-ACTIVE
          registration with an emptied wallet fails BOTH the state check (no
          ACTIVE -> ACTIVE transition) and the fiscal check (0 < 19000). Priority 5
          beats priority 10: the response must be ERR_INVALID_STATE (409), never
          ERR_INSUFFICIENT_FUNDS (402).
        test_recipe:
          setup:
            - "Registration already ACTIVE; wallet deposited exactly 19000 then fully drained by the first activation (balance 0)"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-PP1", fleet_program_enabled: true }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H PP1", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin, captures: { h_v: $.data.version } }
            - { call: "POST /api/permit-holders/${h_id}/wallet/deposits", payload: { amount_cents: 19000, expected_permit_holder_version: "${h_v}" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "LSV", seat_count: 6, has_headlights: true, has_brake_lights: true, has_turn_signals: true, has_horn: true, has_windshield: true, has_seatbelts: true, has_reflectors: true, mirror_count: 2 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v_id: $.data.id } }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v_id}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /api/inspections", payload: { registration_id: "${reg_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: Inspector, captures: { ins_id: $.data.id } }
            - { call: "POST /api/inspections/${ins_id}/finalize", payload: { headlights_score: 90, brake_lights_score: 90, turn_signals_score: 90, horn_score: 90, mirrors_score: 90, windshield_score: 90, seatbelts_score: 90, reflectors_score: 90 }, as: Inspector }
            - { call: "POST /api/insurance-policies", payload: { holder_id: "${h_id}", vehicle_id: "${v_id}", provider_name: "P", policy_number: "N-PP1", liability_coverage_cents: 10000000, effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/registrations/${reg_id}/activate", payload: {}, as: PermitHolder, as_user_id: "${h_id}" }
          trigger:
            - { call: "POST /api/registrations/${reg_id}/activate", payload: {}, as: PermitHolder, as_user_id: "${h_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE with http 409 (state, priority 5)"
            - "NOT ERR_INSUFFICIENT_FUNDS (fiscal, priority 10), even though wallet_balance_cents == 0 < 19000"

      - name: safety_beats_temporal_on_route_pass
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - entities.Route.fields.allowed_vehicle_class
        distinguishing_aspect: |
          Category pair business_safety x business_temporal: booking an LSV
          registration onto a GOLF_CART_ONLY route with a window that also overlaps an
          existing pass fails BOTH the safety gate and the overlap gate. Priority 6
          beats priority 7: ERR_ROUTE_VEHICLE_CLASS (422), never ERR_ROUTE_PASS_OVERLAP.
        test_recipe:
          setup:
            - "ACTIVE LSV registration; route A (LSV_ALLOWED) with pass 2026-06-01T10:00-12:00; route B (GOLF_CART_ONLY)"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-PP2", fleet_program_enabled: true }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H PP2", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin, captures: { h_v: $.data.version } }
            - { call: "POST /api/permit-holders/${h_id}/wallet/deposits", payload: { amount_cents: 100000, expected_permit_holder_version: "${h_v}" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "LSV", seat_count: 6, has_headlights: true, has_brake_lights: true, has_turn_signals: true, has_horn: true, has_windshield: true, has_seatbelts: true, has_reflectors: true, mirror_count: 2 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v_id: $.data.id } }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v_id}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /api/inspections", payload: { registration_id: "${reg_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: Inspector, captures: { ins_id: $.data.id } }
            - { call: "POST /api/inspections/${ins_id}/finalize", payload: { headlights_score: 90, brake_lights_score: 90, turn_signals_score: 90, horn_score: 90, mirrors_score: 90, windshield_score: 90, seatbelts_score: 90, reflectors_score: 90 }, as: Inspector }
            - { call: "POST /api/insurance-policies", payload: { holder_id: "${h_id}", vehicle_id: "${v_id}", provider_name: "P", policy_number: "N-PP2", liability_coverage_cents: 10000000, effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/registrations/${reg_id}/activate", payload: {}, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/routes", payload: { community_id: "${comm_id}", name: "Route A", route_type: "STREET", allowed_vehicle_class: "LSV_ALLOWED" }, as: CommunityAdmin, captures: { rt_a: $.data.id } }
            - { call: "POST /api/routes", payload: { community_id: "${comm_id}", name: "Route B", route_type: "PATH", allowed_vehicle_class: "GOLF_CART_ONLY" }, as: CommunityAdmin, captures: { rt_b: $.data.id } }
            - { call: "POST /api/route-passes", payload: { route_id: "${rt_a}", registration_id: "${reg_id}", holder_id: "${h_id}", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T12:00:00Z" }, as: PermitHolder, as_user_id: "${h_id}" }
          trigger:
            - { call: "POST /api/route-passes", payload: { route_id: "${rt_b}", registration_id: "${reg_id}", holder_id: "${h_id}", start_at: "2026-06-01T11:00:00Z", end_at: "2026-06-01T13:00:00Z" }, as: PermitHolder, as_user_id: "${h_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ROUTE_VEHICLE_CLASS with http 422 (safety, priority 6)"
            - "NOT ERR_ROUTE_PASS_OVERLAP (temporal, priority 7), even though [11:00,13:00) overlaps the existing [10:00,12:00) pass"

      - name: temporal_beats_fiscal_on_charging_booking
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - calculations.charging_fee
        distinguishing_aspect: |
          Category pair business_temporal x business_fiscal (a different pair from the
          other two instances): a charging booking whose closed interval violates the
          15-minute buffer AND whose holder wallet (400) cannot cover the fee (600)
          fails both gates. Priority 7 beats priority 10: ERR_CHARGING_OVERLAP (409),
          never ERR_INSUFFICIENT_FUNDS (402).
        test_recipe:
          setup:
            - "ONLINE station rate 10 c/min; holder wallet 1000 - 600 = 400 after first booking 10:00-11:00 slot 0"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-PP3" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H PP3", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin, captures: { h_v: $.data.version } }
            - { call: "POST /api/permit-holders/${h_id}/wallet/deposits", payload: { amount_cents: 1000, expected_permit_holder_version: "${h_v}" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/charging-stations", payload: { community_id: "${comm_id}", name: "S-PP3", slot_count: 2, rate_cents_per_min: 10 }, as: CommunityAdmin, captures: { st_id: $.data.id } }
            - { call: "POST /api/charging-reservations", payload: { station_id: "${st_id}", holder_id: "${h_id}", slot_index: 0, start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z" }, as: PermitHolder, as_user_id: "${h_id}" }
          trigger:
            - { call: "POST /api/charging-reservations", payload: { station_id: "${st_id}", holder_id: "${h_id}", slot_index: 0, start_at: "2026-06-01T11:00:00Z", end_at: "2026-06-01T12:00:00Z" }, as: PermitHolder, as_user_id: "${h_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CHARGING_OVERLAP with http 409 (temporal, priority 7; 11:00 < 11:00 + 15min buffer)"
            - "NOT ERR_INSUFFICIENT_FUNDS (fiscal, priority 10), even though wallet 400 < fee 600"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: age_boundary_exactly_min_vs_one_day_under
        grounds:
          - validations[priority=6]
          - entities.PermitHolder.fields.birth_date
          - entities.Community.fields.min_driver_age
        distinguishing_aspect: |
          Metric: driver age (integer years) on POST /api/permit-holders/{id}/verify-eligibility.
          The comparison is >= (inclusive): born 2010-05-01 with clock 2026-05-01 is
          exactly 16 -> ELIGIBLE; born 2010-05-02 (one day younger, still 15) ->
          ERR_UNDERAGE_DRIVER. A > instead of >= flips the first case.
        test_recipe:
          setup:
            - "Community with default min_driver_age 16; logical clock at startup default 2026-05-01T00:00:00Z"
            - "holder A born 2010-05-01 (exact 16th birthday); holder B born 2010-05-02 (15, turns 16 the next day)"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-BP1" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H A", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_a: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H B", birth_date: "2010-05-02", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_b: $.data.id } }
          trigger:
            - { call: "POST /api/permit-holders/${h_a}/verify-eligibility", payload: {}, as: CommunityAdmin, captures: { st_a: $.data.eligibility_status } }
            - { call: "POST /api/permit-holders/${h_b}/verify-eligibility", payload: {}, as: CommunityAdmin, captures: { err_b: $.data.error_id } }
          assert:
            - "st_a == ELIGIBLE (age == 16 satisfies >= 16)"
            - "err_b == ERR_UNDERAGE_DRIVER with http 422 (age 15 < 16)"
            - "holder B eligibility_status remains PENDING_VERIFICATION"

      - name: inspection_threshold_exactly_70_passes
        grounds:
          - calculations.inspection_total_score
          - entities.Inspection.fields.passed
          - state_machines.Inspection.SCHEDULED_to_PASSED
        distinguishing_aspect: |
          Metric: weighted inspection score on POST /api/inspections/{id}/finalize —
          a different metric and endpoint from the age boundary. Threshold is >= 70.00:
          all-70 components yield exactly 70.00 -> PASSED; all-69 yield 69.00 ->
          FAILED. A > instead of >= flips the 70.00 case.
        test_recipe:
          setup:
            - "Two DRAFT registrations on two full-equipment LSVs of one ELIGIBLE holder; one SCHEDULED inspection each"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-BP2" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H BP2", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "LSV", seat_count: 4, has_headlights: true, has_brake_lights: true, has_turn_signals: true, has_horn: true, has_windshield: true, has_seatbelts: true, has_reflectors: true, mirror_count: 2 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v1: $.data.id } }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "LSV", seat_count: 4, has_headlights: true, has_brake_lights: true, has_turn_signals: true, has_horn: true, has_windshield: true, has_seatbelts: true, has_reflectors: true, mirror_count: 2 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v2: $.data.id } }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v1}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { r1: $.data.id } }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v2}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { r2: $.data.id } }
            - { call: "POST /api/inspections", payload: { registration_id: "${r1}", scheduled_at: "2026-05-02T09:00:00Z" }, as: Inspector, captures: { i1: $.data.id } }
            - { call: "POST /api/inspections", payload: { registration_id: "${r2}", scheduled_at: "2026-05-02T10:00:00Z" }, as: Inspector, captures: { i2: $.data.id } }
          trigger:
            - { call: "POST /api/inspections/${i1}/finalize", payload: { headlights_score: 70, brake_lights_score: 70, turn_signals_score: 70, horn_score: 70, mirrors_score: 70, windshield_score: 70, seatbelts_score: 70, reflectors_score: 70 }, as: Inspector, captures: { t1: $.data.total_score, p1: $.data.passed } }
            - { call: "POST /api/inspections/${i2}/finalize", payload: { headlights_score: 69, brake_lights_score: 69, turn_signals_score: 69, horn_score: 69, mirrors_score: 69, windshield_score: 69, seatbelts_score: 69, reflectors_score: 69 }, as: Inspector, captures: { t2: $.data.total_score, p2: $.data.passed } }
          assert:
            - "t1 == 70.00 and p1 == true (70.00 >= 70.00, inclusive)"
            - "t2 == 69.00 and p2 == false"
            - "inspection i1 status == PASSED; inspection i2 status == FAILED; registration r2 remains DRAFT (FAILED on DRAFT does not suspend)"

      - name: wallet_exact_balance_debit_succeeds
        grounds:
          - validations[priority=10]
          - entities.PermitHolder.fields.wallet_balance_cents
          - state_machines.VehicleRegistration.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Metric: wallet cents on POST /api/registrations/{id}/activate — a third
          metric and endpoint. Sufficiency is >= : depositing exactly the 19000-cent
          total_due activates successfully and drains the wallet to exactly 0; zero
          balance is a legal end state, not an error.
        test_recipe:
          setup:
            - "DRAFT LSV registration with PASSED inspection (finalized 19000), ACTIVE insurance, ELIGIBLE holder, wallet exactly 19000"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-BP3", fleet_program_enabled: true }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H BP3", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin, captures: { h_v: $.data.version } }
            - { call: "POST /api/permit-holders/${h_id}/wallet/deposits", payload: { amount_cents: 19000, expected_permit_holder_version: "${h_v}" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "LSV", seat_count: 6, has_headlights: true, has_brake_lights: true, has_turn_signals: true, has_horn: true, has_windshield: true, has_seatbelts: true, has_reflectors: true, mirror_count: 2 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v_id: $.data.id } }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v_id}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /api/inspections", payload: { registration_id: "${reg_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: Inspector, captures: { ins_id: $.data.id } }
            - { call: "POST /api/inspections/${ins_id}/finalize", payload: { headlights_score: 90, brake_lights_score: 90, turn_signals_score: 90, horn_score: 90, mirrors_score: 90, windshield_score: 90, seatbelts_score: 90, reflectors_score: 90 }, as: Inspector }
            - { call: "POST /api/insurance-policies", payload: { holder_id: "${h_id}", vehicle_id: "${v_id}", provider_name: "P", policy_number: "N-BP3", liability_coverage_cents: 10000000, effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PermitHolder, as_user_id: "${h_id}" }
          trigger:
            - { call: "POST /api/registrations/${reg_id}/activate", payload: {}, as: PermitHolder, as_user_id: "${h_id}", captures: { st: $.data.status, paid: $.data.paid_cents } }
            - { call: "GET /api/permit-holders/${h_id}", as: CommunityAdmin, captures: { wallet: $.data.wallet_balance_cents } }
          assert:
            - "st == ACTIVE (balance == total_due satisfies the >= sufficiency check)"
            - "paid == 19000 and wallet == 0 (exact drain to zero is legal)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: route_pass_requires_registration_active
        grounds:
          - validations[priority=8]
          - state_machines.VehicleRegistration.ACTIVE_to_SUSPENDED
          - state_machines.RoutePass
        distinguishing_aspect: |
          Entity pair RoutePass -> VehicleRegistration: route-pass creation is gated
          on a DIFFERENT entity's state. With the registration SUSPENDED (admin
          action), booking fails ERR_REGISTRATION_NOT_ACTIVE even though the route is
          DESIGNATED, the window free, and the holder ELIGIBLE.
        test_recipe:
          setup:
            - "ACTIVE LSV registration later SUSPENDED by CommunityAdmin; DESIGNATED LSV_ALLOWED route"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-CE1", fleet_program_enabled: true }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H CE1", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin, captures: { h_v: $.data.version } }
            - { call: "POST /api/permit-holders/${h_id}/wallet/deposits", payload: { amount_cents: 100000, expected_permit_holder_version: "${h_v}" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "LSV", seat_count: 6, has_headlights: true, has_brake_lights: true, has_turn_signals: true, has_horn: true, has_windshield: true, has_seatbelts: true, has_reflectors: true, mirror_count: 2 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v_id: $.data.id } }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v_id}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /api/inspections", payload: { registration_id: "${reg_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: Inspector, captures: { ins_id: $.data.id } }
            - { call: "POST /api/inspections/${ins_id}/finalize", payload: { headlights_score: 90, brake_lights_score: 90, turn_signals_score: 90, horn_score: 90, mirrors_score: 90, windshield_score: 90, seatbelts_score: 90, reflectors_score: 90 }, as: Inspector }
            - { call: "POST /api/insurance-policies", payload: { holder_id: "${h_id}", vehicle_id: "${v_id}", provider_name: "P", policy_number: "N-CE1", liability_coverage_cents: 10000000, effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/registrations/${reg_id}/activate", payload: {}, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/registrations/${reg_id}/suspend", payload: {}, as: CommunityAdmin }
            - { call: "POST /api/routes", payload: { community_id: "${comm_id}", name: "R-CE1", route_type: "STREET", allowed_vehicle_class: "LSV_ALLOWED" }, as: CommunityAdmin, captures: { rt_id: $.data.id } }
          trigger:
            - { call: "POST /api/route-passes", payload: { route_id: "${rt_id}", registration_id: "${reg_id}", holder_id: "${h_id}", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T12:00:00Z" }, as: PermitHolder, as_user_id: "${h_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_REGISTRATION_NOT_ACTIVE with http 409 (registration is SUSPENDED, not ACTIVE)"
            - "no RoutePass row is created for ${reg_id}"

      - name: activation_requires_holder_not_barred
        grounds:
          - validations[priority=8]
          - calculations.holder_points_standing
          - state_machines.VehicleRegistration.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Entity pair VehicleRegistration -> PermitHolder (different pair): activation
          reads the HOLDER's compliance dimension. A BARRED holder (12 points from
          three upheld violations) cannot activate even with PASSED inspection, ACTIVE
          insurance, ELIGIBLE eligibility, and sufficient wallet: ERR_HOLDER_BARRED.
        test_recipe:
          setup:
            - "ELIGIBLE holder barred via 3 x 4-point UPHELD violations (points_balance 12 >= 12)"
            - "DRAFT registration with PASSED inspection and ACTIVE insurance; wallet 100000"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-CE2", fleet_program_enabled: true }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H CE2", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin, captures: { h_v: $.data.version } }
            - { call: "POST /api/violations", payload: { holder_id: "${h_id}", violation_code: "OFF_ROUTE", points_assessed: 4, fine_cents: 5000, occurred_at: "2026-04-01T00:00:00Z" }, as: EnforcementOfficer, captures: { w1: $.data.id } }
            - { call: "POST /api/violations", payload: { holder_id: "${h_id}", violation_code: "PARKING_VIOLATION", points_assessed: 4, fine_cents: 5000, occurred_at: "2026-04-01T00:00:00Z" }, as: EnforcementOfficer, captures: { w2: $.data.id } }
            - { call: "POST /api/violations", payload: { holder_id: "${h_id}", violation_code: "UNINSURED_OPERATION", points_assessed: 4, fine_cents: 5000, occurred_at: "2026-04-01T00:00:00Z" }, as: EnforcementOfficer, captures: { w3: $.data.id } }
            - { call: "POST /api/violations/${w1}/uphold", payload: {}, as: EnforcementOfficer }
            - { call: "POST /api/violations/${w2}/uphold", payload: {}, as: EnforcementOfficer }
            - { call: "POST /api/violations/${w3}/uphold", payload: {}, as: EnforcementOfficer }
            - { call: "POST /api/permit-holders/${h_id}/wallet/deposits", payload: { amount_cents: 100000, expected_permit_holder_version: "${h_v}" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "LSV", seat_count: 6, has_headlights: true, has_brake_lights: true, has_turn_signals: true, has_horn: true, has_windshield: true, has_seatbelts: true, has_reflectors: true, mirror_count: 2 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v_id: $.data.id } }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v_id}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /api/inspections", payload: { registration_id: "${reg_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: Inspector, captures: { ins_id: $.data.id } }
            - { call: "POST /api/inspections/${ins_id}/finalize", payload: { headlights_score: 90, brake_lights_score: 90, turn_signals_score: 90, horn_score: 90, mirrors_score: 90, windshield_score: 90, seatbelts_score: 90, reflectors_score: 90 }, as: Inspector }
            - { call: "POST /api/insurance-policies", payload: { holder_id: "${h_id}", vehicle_id: "${v_id}", provider_name: "P", policy_number: "N-CE2", liability_coverage_cents: 10000000, effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PermitHolder, as_user_id: "${h_id}" }
          trigger:
            - { call: "POST /api/registrations/${reg_id}/activate", payload: {}, as: PermitHolder, as_user_id: "${h_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_HOLDER_BARRED with http 422 (compliance_status == BARRED at 12 points)"
            - "registration remains DRAFT; wallet_balance_cents stays 100000 (no debit)"
            - "deposit accepted despite BARRED: deposits are not gated on compliance (captured h_v remained valid through upholds because point recomputation does not consume the OCC check — version advanced by cascades, so the deposit call carries the pre-violation version only if no cascade bumped it; the deposit here is sequenced after verify and before any holder-version-bumping cascade that would invalidate it)"

      - name: reservation_requires_station_online
        grounds:
          - validations[priority=8]
          - state_machines.ChargingStation.ONLINE_to_OFFLINE
        distinguishing_aspect: |
          Entity pair ChargingReservation -> ChargingStation (third distinct pair):
          booking reads the STATION's state. An OFFLINE station rejects the booking
          with ERR_STATION_OFFLINE even when the slot is free and the wallet is funded.
        test_recipe:
          setup:
            - "Station taken OFFLINE by CommunityAdmin; holder wallet 1000"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-CE3" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H CE3", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin, captures: { h_v: $.data.version } }
            - { call: "POST /api/permit-holders/${h_id}/wallet/deposits", payload: { amount_cents: 1000, expected_permit_holder_version: "${h_v}" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/charging-stations", payload: { community_id: "${comm_id}", name: "S-CE3", slot_count: 2, rate_cents_per_min: 10 }, as: CommunityAdmin, captures: { st_id: $.data.id } }
            - { call: "POST /api/charging-stations/${st_id}/set-offline", payload: {}, as: CommunityAdmin }
          trigger:
            - { call: "POST /api/charging-reservations", payload: { station_id: "${st_id}", holder_id: "${h_id}", slot_index: 0, start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z" }, as: PermitHolder, as_user_id: "${h_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_STATION_OFFLINE with http 409"
            - "wallet_balance_cents stays 1000 (no debit on rejection)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: route_pass_half_open_adjacency
        grounds:
          - validations[priority=7]
          - entities.RoutePass.fields.start_at
          - entities.RoutePass.fields.end_at
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [start_at, end_at) on the registration's pass
          timeline. Back-to-back windows (one ends exactly when the next starts) are
          LEGAL; a one-minute-interior overlap is not. P1 [10:00,12:00), P2 [12:00,14:00)
          both succeed; P3 [11:00,13:00) is rejected.
        test_recipe:
          setup:
            - "ACTIVE LSV registration; DESIGNATED LSV_ALLOWED route"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-TO1", fleet_program_enabled: true }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H TO1", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin, captures: { h_v: $.data.version } }
            - { call: "POST /api/permit-holders/${h_id}/wallet/deposits", payload: { amount_cents: 100000, expected_permit_holder_version: "${h_v}" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "LSV", seat_count: 6, has_headlights: true, has_brake_lights: true, has_turn_signals: true, has_horn: true, has_windshield: true, has_seatbelts: true, has_reflectors: true, mirror_count: 2 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v_id: $.data.id } }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v_id}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /api/inspections", payload: { registration_id: "${reg_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: Inspector, captures: { ins_id: $.data.id } }
            - { call: "POST /api/inspections/${ins_id}/finalize", payload: { headlights_score: 90, brake_lights_score: 90, turn_signals_score: 90, horn_score: 90, mirrors_score: 90, windshield_score: 90, seatbelts_score: 90, reflectors_score: 90 }, as: Inspector }
            - { call: "POST /api/insurance-policies", payload: { holder_id: "${h_id}", vehicle_id: "${v_id}", provider_name: "P", policy_number: "N-TO1", liability_coverage_cents: 10000000, effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/registrations/${reg_id}/activate", payload: {}, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/routes", payload: { community_id: "${comm_id}", name: "R-TO1", route_type: "STREET", allowed_vehicle_class: "LSV_ALLOWED" }, as: CommunityAdmin, captures: { rt_id: $.data.id } }
          trigger:
            - { call: "POST /api/route-passes", payload: { route_id: "${rt_id}", registration_id: "${reg_id}", holder_id: "${h_id}", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T12:00:00Z" }, as: PermitHolder, as_user_id: "${h_id}", captures: { p1: $.data.id } }
            - { call: "POST /api/route-passes", payload: { route_id: "${rt_id}", registration_id: "${reg_id}", holder_id: "${h_id}", start_at: "2026-06-01T12:00:00Z", end_at: "2026-06-01T14:00:00Z" }, as: PermitHolder, as_user_id: "${h_id}", captures: { p2: $.data.id } }
            - { call: "POST /api/route-passes", payload: { route_id: "${rt_id}", registration_id: "${reg_id}", holder_id: "${h_id}", start_at: "2026-06-01T11:00:00Z", end_at: "2026-06-01T13:00:00Z" }, as: PermitHolder, as_user_id: "${h_id}", captures: { err: $.data.error_id } }
          assert:
            - "P1 and P2 both created with status ACTIVE (end == next start is adjacency, not overlap, under half-open semantics)"
            - "err == ERR_ROUTE_PASS_OVERLAP with http 409 for [11:00,13:00) which overlaps both windows in their interiors"

      - name: charging_closed_interval_with_buffer
        grounds:
          - validations[priority=7]
          - entities.ChargingReservation.fields.start_at
          - entities.ChargingReservation.fields.end_at
        distinguishing_aspect: |
          Interval semantics: CLOSED interval PLUS a 15-minute buffer on both sides per
          (station, slot_index) — strictly stricter than the route pass. After R1
          [10:00,11:00]: starting at 11:14 conflicts, starting at exactly 11:15 is
          legal (buffer equality satisfies the gap); ending at 10:00 conflicts (buffer
          bleeds into R1), ending at 09:45 is legal (09:45+15min == 10:00 exactly).
        test_recipe:
          setup:
            - "ONLINE station (2 slots, rate 10 c/min); holder wallet 100000"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-TO2" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H TO2", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
