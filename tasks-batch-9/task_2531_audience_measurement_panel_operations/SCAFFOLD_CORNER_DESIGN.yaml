            - "data.status == ACTIVE, data.custom_analysis_used == 0, data.held_deliverable_count == 0, data.delivery_sla_credit_cents == 0, data.suspended_reason == null"
            - "data.contract_market_ids == [${m14_id}]"

      - name: methodology_change_creation_defaults_and_self_reference
        claim_type: creation
        grounds:
          - entities.MethodologyChange
          - endpoints[POST /methodology-changes]
        distinguishing_aspect: "A change starts DRAFT with impact_delta_pct 0.0000 and impact_tier null, created_by_user_id from X-User-ID, and supersedes_change_id resolving to another MethodologyChange row (self-referential FK)."
        test_recipe:
          setup:
            - "Market DMA-615, a PUBLISHED rule set RS-C02 (the target) and two DRAFT rule sets RS-C03 and RS-C04 (successive proposals). A first change CH-A is drafted so the second can supersede it."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Omicron", market_code: "DMA-615", dma_rank: 115, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m15_id: "$.data.id" }
            - call: "POST /edit-rule-sets"
              payload: { label: "RS-C02", missing_interval_ascription_minutes: 60, invalid_tuning_max_minutes: 900, outlier_household_minutes_cap: 1200, outlier_weight_ratio_cap: 2.5, fault_missing_minutes_threshold: 1440 }
              as: MethodologyStatistician
              captures: { rs15_target_id: "$.data.id" }
            - call: "POST /edit-rule-sets/${rs15_target_id}/publish"
              payload: {}
              as: MethodologyStatistician
            - call: "POST /edit-rule-sets"
              payload: { label: "RS-C03", missing_interval_ascription_minutes: 72, invalid_tuning_max_minutes: 960, outlier_household_minutes_cap: 1200, outlier_weight_ratio_cap: 2.6, fault_missing_minutes_threshold: 1440 }
              as: MethodologyStatistician
              captures: { rs15_prop_a_id: "$.data.id" }
            - call: "POST /edit-rule-sets"
              payload: { label: "RS-C04", missing_interval_ascription_minutes: 75, invalid_tuning_max_minutes: 970, outlier_household_minutes_cap: 1200, outlier_weight_ratio_cap: 2.7, fault_missing_minutes_threshold: 1440 }
              as: MethodologyStatistician
              captures: { rs15_prop_b_id: "$.data.id" }
            - call: "POST /methodology-changes"
              payload: { title: "Widen ascription window", target_edit_rule_set_id: "${rs15_target_id}", proposed_edit_rule_set_id: "${rs15_prop_a_id}", affected_market_ids: ["${m15_id}"] }
              as: GovernanceDirector
              as_user_id: "gov-drafter-a"
              captures: { ch15a_id: "$.data.id" }
          trigger:
            - call: "POST /methodology-changes"
              payload: { title: "Widen ascription window, second attempt", target_edit_rule_set_id: "${rs15_target_id}", proposed_edit_rule_set_id: "${rs15_prop_b_id}", affected_market_ids: ["${m15_id}"], supersedes_change_id: "${ch15a_id}" }
              as: GovernanceDirector
              as_user_id: "gov-drafter-b"
              captures: { ch15b_id: "$.data.id" }
          assert:
            - "HTTP 201 with data.state == DRAFT, data.impact_delta_pct == null, data.impact_tier == null, data.revision_count == 0, data.baseline_processing_run_id == null, data.baseline_projected_average_audience == null"
            - "data.created_by_user_id == gov-drafter-b, data.notification_lead_hours == null, data.notification_deadline_at == null, data.notified_client_count == 0, data.acknowledged_client_count == 0, data.activated_at == null"
            - "data.supersedes_change_id == ${ch15a_id} and MethodologyChange.${ch15a_id}.state is still DRAFT - the superseded row is untouched"
            - "GET /methodology-changes?supersedes_change_id=${ch15a_id} returns total_count == 1 whose id == ${ch15b_id}"

      - name: accreditation_audit_creation_freezes_the_market
        claim_type: creation
        grounds:
          - entities.AccreditationAudit
          - endpoints[POST /accreditation-audits]
          - calculations.market_recruitment_posture
        distinguishing_aspect: "Opening an audit sets open_audit_count to 1, and posture clause 1 then overrides the cell-level verdict: the market is FROZEN even though its only cell is UNDER_TARGET."
        test_recipe:
          setup:
            - "Market DMA-616 with one UNDER_TARGET cell (so the market is OPEN) and a PUBLISHED rule set RS-C05 to scope the audit to."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Pi", market_code: "DMA-616", dma_rank: 116, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m16_id: "$.data.id" }
            - call: "POST /markets/${m16_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 2, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { c16_id: "$.data.id" }
            - call: "POST /edit-rule-sets"
              payload: { label: "RS-C05", missing_interval_ascription_minutes: 60, invalid_tuning_max_minutes: 900, outlier_household_minutes_cap: 1200, outlier_weight_ratio_cap: 2.5, fault_missing_minutes_threshold: 1440 }
              as: MethodologyStatistician
              captures: { rs16_id: "$.data.id" }
            - call: "POST /edit-rule-sets/${rs16_id}/publish"
              payload: {}
              as: MethodologyStatistician
          trigger:
            - call: "POST /accreditation-audits"
              payload: { market_id: "${m16_id}", scope_edit_rule_set_id: "${rs16_id}", auditor_note: "Annual methodology review of DMA-616" }
              as: AccreditationAuditor
              as_user_id: "auditor-opener-16"
              captures: { au16_id: "$.data.id" }
            - call: "GET /markets/${m16_id}"
              payload: {}
              as: AccreditationAuditor
          assert:
            - "Trigger call 1: HTTP 201 with data.state == OPEN, data.outcome == null, data.limitation_disclosures == [], data.opened_by_user_id == auditor-opener-16, data.finalized_by_user_id == null, data.finalized_at == null"
            - "Trigger call 2: data.open_audit_count == 1 and data.recruitment_posture == FROZEN - clause 1 outranks the UNDER_TARGET cell that would otherwise yield OPEN"
            - "Trigger call 2: data.under_target_cell_count == 1 - the cell-level roll-up is unchanged; only the posture flipped"

  # ===========================================================================
  # SECTION 2 - State Machines (§1.3)
  #
  # Reusable fixture chains referenced by the instances below. Each chain is
  # parameterised by a market_code, a quota-cell shape and a meter serial; every
  # instance names its own values so no two instances share a row.
  #
  # CHAIN A - "a market with one cell"  (parameters: CODE, RANK, T, B, BUDGET)
  #   A1  POST /markets                  { name, market_code: CODE, dma_rank: RANK, incentive_budget_cents: BUDGET }   -> ${m_id}
  #   A2  POST /markets/${m_id}/quota-cells { age_band: P18_34, income_band: MID, geo_zone: URBAN,
  #                                          target_households: T, base_incentive_cents: B }                          -> ${c_id}
  #   Post-state: market OPEN, cell UNDER_TARGET with the 1.25 boost armed and
  #   round_half_up(B * 0.25 * T, 0) cents reserved; market.version == 2.
  #
  # CHAIN B - "an ACTIVE (in-tab) household"  (CHAIN A, then parameters: PERSONS, SERIAL)
  #   B1  POST /households                { market_id: ${m_id}, quota_cell_id: ${c_id},
  #                                         recruitment_source: ADDRESS_SAMPLE, persons_count: PERSONS }               -> ${h_id}
  #   B2  POST /meters                    { household_id: ${h_id}, meter_type: TV_TUNER, serial_no: SERIAL }           -> ${mt_id}
  #   B3  POST /meters/${mt_id}/install-confirmations { }
  #   B4  POST /households/${h_id}/enumerations { roster_persons_count: PERSONS, tv_sets_count: 1 }
  #   Post-state: household ACTIVE, verdict COMPLIANT, enumeration_count 1,
  #   meter INSTALLED + HEALTHY, cell intab_count 1.
  #
  # CHAIN C - "a PUBLISHED processing run"  (CHAIN B with T=1, B=2000, PERSONS=2, then)
  #   C1  POST /edit-rule-sets            { label: LABEL, missing_interval_ascription_minutes: 60,
  #                                         invalid_tuning_max_minutes: 900, outlier_household_minutes_cap: 1200,
  #                                         outlier_weight_ratio_cap: 2.5, fault_missing_minutes_threshold: 1440 }     -> ${rs_id}
  #   C2  POST /edit-rule-sets/${rs_id}/publish { }
  #   C3  GET  /markets/${m_id}                                                                    -> ${m_v} (version)
  #   C4  POST /universe-estimates        { market_id: ${m_id}, vintage_label: "2026Q3",
  #                                         effective_from: 2026-07-01T00:00:00Z, effective_to: 2026-10-01T00:00:00Z,
  #                                         cell_populations: [{ quota_cell_id: ${c_id}, population_households: 100000,
  #                                         population_persons: 250000 }], expected_market_version: ${m_v} }           -> ${ue_id}
  #   C5  POST /universe-estimates/${ue_id}/publish { }
  #   C6  POST /_clock/set_current_utc    { current_utc: 2026-08-11T00:00:00Z }
  #   C7  POST /tuning-intervals          { meter_id: ${mt_id}, source_methodology: INHOME_TUNER,
  #                                         start_iso: 2026-08-10T18:00:00Z, end_iso: 2026-08-10T23:50:00Z,
  #                                         station_code: WXYZ, tuning_minutes: 350 }                                  -> ${ti_id}
  #   C8  GET  /markets/${m_id}                                                                    -> ${m_v2} (version)
  #   C9  POST /processing-runs           { market_id: ${m_id}, universe_estimate_id: ${ue_id},
  #                                         edit_rule_set_id: ${rs_id}, window_start_iso: 2026-08-10T00:00:00Z,
  #                                         window_end_iso: 2026-08-11T00:00:00Z,
  #                                         expected_market_version: ${m_v2} }  as_user_id: stat-opener-NN               -> ${run_id}
  #   C10 POST /processing-runs/${run_id}/edit   { }              (state EDITED, 1 contributing household)
  #   C11 POST /processing-runs/${run_id}/weight { weight_variant: FINAL }
  #   C12 POST /processing-runs/${run_id}/publish { }  as_user_id: stat-publisher-NN  (a DIFFERENT user than C9)
  #   Post-state: run PUBLISHED, window_minutes 1440, base_weight 100000.0000,
  #   contribution 24305.56, projected_average_audience 24306.
  # ===========================================================================
  - section: state_machines
    instances:

      - name: household_lifecycle_reaches_active_and_moves_intab
        claim_type: valid_transition
        grounds:
          - state_machines.Household
          - calculations.enumeration_verdict
          - calculations.quota_cell_fill
        distinguishing_aspect: "The whole RECRUITED -> INSTALL_SCHEDULED -> ENUM_PENDING -> ACTIVE path in one pass, showing that only the terminal step touches intab_count and that the install confirmation must land on a TV_TUNER to advance the household."
        test_recipe:
          setup:
            - "CHAIN A with CODE DMA-620, RANK 120, T 4, B 1000, BUDGET 500000."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Rho", market_code: "DMA-620", dma_rank: 120, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m20_id: "$.data.id" }
            - call: "POST /markets/${m20_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 4, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { c20_id: "$.data.id" }
            - call: "POST /households"
              payload: { market_id: "${m20_id}", quota_cell_id: "${c20_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 3 }
              as: PanelOperationsManager
              captures: { h20_id: "$.data.id" }
          trigger:
            - call: "POST /meters"
              payload: { household_id: "${h20_id}", meter_type: "TV_TUNER", serial_no: "MT-002020" }
              as: FieldTechnician
              captures: { mt20_id: "$.data.id" }
            - call: "POST /meters/${mt20_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "GET /households/${h20_id}"
              payload: {}
              as: FieldTechnician
            - call: "POST /households/${h20_id}/enumerations"
              payload: { roster_persons_count: 3, tv_sets_count: 2 }
              as: FieldTechnician
            - call: "GET /quota-cells/${c20_id}"
              payload: {}
              as: PanelOperationsManager
          assert:
            - "Trigger call 2: HTTP 200 with data.install_status == INSTALLED and data.installed_at == 2026-08-01T00:00:00Z"
            - "Trigger call 3: data.status == ENUM_PENDING - the TV_TUNER confirmation is what opens enumeration"
            - "Trigger call 4: HTTP 200 with data.status == ACTIVE, data.enumeration_verdict == COMPLIANT, data.enumeration_count == 1, data.roster_persons_count == 3, data.tv_sets_count == 2, data.last_enumeration_at == 2026-08-01T00:00:00Z"
            - "Trigger call 5: data.intab_count == 1 and data.fill_rate == 0.2500 with quota_status still UNDER_TARGET (1/4)"
            - "Trigger call 5: data.incentive_boost_active is still true - the cell is nowhere near ON_TARGET"

      - name: household_noncompliant_hold_then_recovers_to_active
        claim_type: cyclic
        grounds:
          - state_machines.Household.transitions.ACTIVE_to_NONCOMPLIANT_HOLD
          - state_machines.Household.transitions.NONCOMPLIANT_HOLD_to_ACTIVE
          - calculations.enumeration_verdict
        distinguishing_aspect: "The household loops out of and back into the in-tab sample; the SECOND and THIRD enumerations carry no due date, so the loop is driven purely by roster agreement, and intab_count tracks the loop exactly."
        test_recipe:
          setup:
            - "CHAIN B with CODE DMA-621, RANK 121, T 4, B 1000, BUDGET 500000, PERSONS 3, SERIAL MT-002021. The clock is then moved to 2026-10-01T00:00:00Z, two months past recruitment, to prove re-enumerations ignore ENUMERATION_DUE_DAYS."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Sigma", market_code: "DMA-621", dma_rank: 121, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m21_id: "$.data.id" }
            - call: "POST /markets/${m21_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 4, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { c21_id: "$.data.id" }
            - call: "POST /households"
              payload: { market_id: "${m21_id}", quota_cell_id: "${c21_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 3 }
              as: PanelOperationsManager
              captures: { h21_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${h21_id}", meter_type: "TV_TUNER", serial_no: "MT-002021" }
              as: FieldTechnician
              captures: { mt21_id: "$.data.id" }
            - call: "POST /meters/${mt21_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /households/${h21_id}/enumerations"
              payload: { roster_persons_count: 3, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: FieldTechnician
          trigger:
            - call: "POST /households/${h21_id}/enumerations"
              payload: { roster_persons_count: 5, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "GET /quota-cells/${c21_id}"
              payload: {}
              as: PanelOperationsManager
            - call: "POST /households/${h21_id}/enumerations"
              payload: { roster_persons_count: 3, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "GET /quota-cells/${c21_id}"
              payload: {}
              as: PanelOperationsManager
          assert:
            - "Trigger call 1: HTTP 200 with data.status == NONCOMPLIANT_HOLD, data.enumeration_verdict == NONCOMPLIANT, data.enumeration_count == 2, data.roster_persons_count == 5"
            - "Trigger call 2: data.intab_count == 0 and data.fill_rate == 0.0000 - leaving ACTIVE takes the household out of tab"
            - "Trigger call 3: HTTP 200 with data.status == ACTIVE, data.enumeration_verdict == COMPLIANT and data.enumeration_count == 3 - two months late is irrelevant because seq > 1 forces due_ok true"
            - "Trigger call 4: data.intab_count == 1 again - the loop is fully reversible and leaves no drift"
            - "Household.persons_count is still 3 - a NONCOMPLIANT roster is recorded in roster_persons_count and never overwrites the recruited persons_count"

      - name: household_retire_from_active_cascades_meter_removal_and_intab
        claim_type: cascade_down
        grounds:
          - endpoints[POST /households/{household_id}/retire]
          - state_machines.Meter.install_status.transitions.INSTALLED_to_REMOVED
          - calculations.quota_cell_fill
        distinguishing_aspect: "Retirement is a conditional cascade: the INSTALLED tuner becomes REMOVED while the SHIPPED streaming router is left untouched, and the accrual ledger is deliberately NOT clawed back."
        test_recipe:
          setup:
            - "CHAIN B with CODE DMA-622, RANK 122, T 2, B 1000, BUDGET 500000, PERSONS 2, SERIAL MT-002022, plus a second meter MT-002023 of type STREAMING_ROUTER that is never install-confirmed, and one accrued incentive period."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Tau", market_code: "DMA-622", dma_rank: 122, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m22_id: "$.data.id" }
            - call: "POST /markets/${m22_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 2, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { c22_id: "$.data.id" }
            - call: "POST /households"
              payload: { market_id: "${m22_id}", quota_cell_id: "${c22_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2 }
              as: PanelOperationsManager
              captures: { h22_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${h22_id}", meter_type: "TV_TUNER", serial_no: "MT-002022" }
              as: FieldTechnician
              captures: { mt22a_id: "$.data.id" }
            - call: "POST /meters/${mt22a_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /meters"
              payload: { household_id: "${h22_id}", meter_type: "STREAMING_ROUTER", serial_no: "MT-002023" }
              as: FieldTechnician
              captures: { mt22b_id: "$.data.id" }
            - call: "POST /households/${h22_id}/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "POST /households/${h22_id}/accrue-incentive"
              payload: { period_label: "2026-08" }
              as: PanelOperationsManager
              captures: { h22_accrued: "$.data.incentive_accrued_cents" }
          trigger:
            - call: "POST /households/${h22_id}/retire"
              payload: { retired_reason: "MOVED_OUT_OF_MARKET" }
              as: PanelOperationsManager
            - call: "GET /meters/${mt22a_id}"
              payload: {}
              as: FieldTechnician
            - call: "GET /meters/${mt22b_id}"
              payload: {}
              as: FieldTechnician
            - call: "GET /quota-cells/${c22_id}"
              payload: {}
              as: PanelOperationsManager
          assert:
            - "Trigger call 1: HTTP 200 with data.status == RETIRED and data.retired_reason == MOVED_OUT_OF_MARKET"
            - "Trigger call 1: data.incentive_accrued_cents == ${h22_accrued} and data.accrual_periods still contains 2026-08 - retirement never claws back the cooperation ledger"
            - "Trigger call 2: data.install_status == REMOVED with health_status still HEALTHY - the install dimension moved and the health dimension did not"
            - "Trigger call 3: data.install_status is still SHIPPED - the cascade is conditional on install_status == INSTALLED"
            - "Trigger call 4: data.intab_count == 0, data.fill_rate == 0.0000, data.quota_status == UNDER_TARGET"

      - name: retired_household_rejects_every_further_trigger
        claim_type: terminal_state_lockdown
        grounds:
