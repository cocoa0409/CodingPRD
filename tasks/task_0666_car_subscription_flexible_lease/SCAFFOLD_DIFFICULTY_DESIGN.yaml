  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: vehicle_reservation_halfopen_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=11]
          - errors[ERR_VEHICLE_SLOT_OVERLAP]
          - entities.DeliverySlot.fields.window_start_iso
        distinguishing_aspect: |
          Half-open [start,end) geometry on the Vehicle reservation resource: a back-to-back slot whose
          start == prior slot's end is ACCEPTED, but an overlapping slot is rejected with
          ERR_VEHICLE_SLOT_OVERLAP. Adjacency-allowed semantics.
        test_recipe:
          setup:
            - "A subscription's reserved vehicle already has a DELIVERY slot [09:00,10:00) for courier C1; a back-to-back [10:00,11:00) was accepted; now an overlapping [10:30,11:30) is attempted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 80000, included_miles_per_cycle: 1000, free_buffer_miles: 50, overage_tier1_rate_cents: 25, overage_tier2_rate_cents: 38, included_swaps_per_term: 1, min_term_months: 6, deposit_base_cents: 80000 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
