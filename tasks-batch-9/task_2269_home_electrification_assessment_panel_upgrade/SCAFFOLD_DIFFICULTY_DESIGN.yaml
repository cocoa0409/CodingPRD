      - name: installer_fitness_beats_measure_set_coherence_on_project_create
        grounds:
          - validations.priority_11
          - validations.priority_13
          - validation_priority_conflicts[1]
          - errors.ERR_CONTRACTOR_NOT_ACTIVE
          - errors.ERR_PANEL_UPGRADE_ANCHOR_MISSING
        distinguishing_aspect: |
          A different category pair on a different endpoint: business_safety
          (priority 11, 409) vs business_referential (priority 13, 422), only
          two levels apart, so the ordering is far easier to get wrong than
          the 8-vs-22 pair. Nothing between them is violated — the panel line
          is exempt from the priority-12 capacity gate and PANEL-200A IS a
          qualified EligibleMeasure on the assessment, so priorities 14 and 15
          are satisfied and only these two rules are live.
        test_recipe:
          setup:
            - "An OPEN program with panel_upgrade_cap_cents 400000."
            - "Catalog: HP-HVAC-01 (anchor, 200 A) and PANEL-200A (is_panel_upgrade, upgraded_capacity_amps 200, requires_qualifying_appliance)."
            - "A LOW-tier household with existing_panel_amps 100."
            - "An APPROVED assessment listing BOTH measures with assessed_panel_amps 100, so PANEL-200A is a qualified EligibleMeasure (its anchor is present at assessment time) and effective_panel_amps is 200."
            - "The contractor is then SUSPENDED by admin action, so it is no longer ENROLLED_ACTIVE."
            - "The project create request omits HP-HVAC-01 and asks for PANEL-200A alone, which violates the panel-upgrade anchor rule at priority 13."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Pair B", state_code: "CO", budget_total_cents: 50000000, low_tier_cap_cents: 1400000, low_tier_cost_share_pct: 1.00, group_cap_cents: 800000, panel_upgrade_cap_cents: 400000 }
