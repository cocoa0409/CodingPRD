  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: zone_window_half_open_adjacency_admits_abutting_window
        resource_entity: DeliveryZone
        interval_semantics: "half-open [window_start, window_end), zone-and-mode scoped, strict inequality on both comparisons"
        grounds:
          - calculations.window_interval_overlap
          - validations.priority_35_window_interval
          - entities.DeliveryWindow.fields.window_start
        distinguishing_aspect: |
          Half-open semantics on a zone-scoped resource: a window that starts exactly when another
          ends is a legal distinct slot, and the same interval in a different zone or a different
          courier mode is also legal. One second of true overlap is rejected.
        test_recipe:
          setup:
            - "Two zones, Z1 and Z2; clock at 2026-08-03T09:00:00Z."
            - "A first SCHEDULED window in Z1 covering [14:00Z, 16:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: NetworkOps
            - call: "POST /delivery-zones"
              payload: { zone_code: "Z1", distance_band_miles: 6.4, base_fee_cents: 705, per_mile_cents: 123, cold_pack_fee_cents: 455, controlled_handling_fee_cents: 605, after_hours_fee_cents: 305, cold_chain_supported: true, controlled_delivery_allowed: true }
              as: NetworkOps
              captures: { z1_id: $.data.id }
            - call: "POST /delivery-zones"
              payload: { zone_code: "Z2", distance_band_miles: 8.2, base_fee_cents: 2005, per_mile_cents: 155, cold_pack_fee_cents: 500, controlled_handling_fee_cents: 700, after_hours_fee_cents: 305, cold_chain_supported: false, controlled_delivery_allowed: true }
              as: NetworkOps
              captures: { z2_id: $.data.id }
            - call: "POST /delivery-windows"
              payload: { zone_id: "${z1_id}", courier_mode: "SCHEDULED", window_start: "2026-08-03T14:00:00Z", window_end: "2026-08-03T16:00:00Z", capacity_slots: 1 }
              as: NetworkOps
              captures: { w1_id: $.data.id }
          trigger:
            - call: "POST /delivery-windows"
              payload: { zone_id: "${z1_id}", courier_mode: "SCHEDULED", window_start: "2026-08-03T16:00:00Z", window_end: "2026-08-03T18:00:00Z", capacity_slots: 1 }
              as: NetworkOps
              captures: { w_abut_id: $.data.id }
            - call: "POST /delivery-windows"
              payload: { zone_id: "${z1_id}", courier_mode: "SCHEDULED", window_start: "2026-08-03T15:59:59Z", window_end: "2026-08-03T18:30:00Z", capacity_slots: 1 }
              as: NetworkOps
            - call: "POST /delivery-windows"
              payload: { zone_id: "${z2_id}", courier_mode: "SCHEDULED", window_start: "2026-08-03T14:00:00Z", window_end: "2026-08-03T16:00:00Z", capacity_slots: 1 }
              as: NetworkOps
              captures: { w_z2_id: $.data.id }
            - call: "POST /delivery-windows"
              payload: { zone_id: "${z1_id}", courier_mode: "ON_DEMAND", window_start: "2026-08-03T14:00:00Z", window_end: "2026-08-03T16:00:00Z", capacity_slots: 1 }
              as: NetworkOps
              captures: { w_ondemand_id: $.data.id }
            - call: "POST /delivery-windows"
              payload: { zone_id: "${z1_id}", courier_mode: "SCHEDULED", window_start: "2026-08-03T20:00:00Z", window_end: "2026-08-03T20:00:00Z", capacity_slots: 1 }
              as: NetworkOps
          assert:
            - "Abutting at the shared endpoint: call 1 returns 201 (candidate.window_start 16:00 is NOT < E.window_end 16:00), and DeliveryWindow.${w_abut_id}.status == OPEN"
            - "One second of real overlap: call 2 returns 409 with error_id ERR_WINDOW_OVERLAP"
            - "Different zone, identical interval: call 3 returns 201 — the resource is scoped to the zone"
            - "Same zone, different courier_mode, identical interval: call 4 returns 201 — on-demand and scheduled capacity are separate pools"
            - "Zero-length interval: call 5 returns 400 with error_id ERR_WINDOW_INTERVAL_INVALID (window_start < window_end is required), and ERR_WINDOW_INTERVAL_INVALID is checked before ERR_WINDOW_OVERLAP"
            - "GET /delivery-windows?zone_id=${z1_id} returns total_count 3 (the 14:00-16:00 scheduled, the 16:00-18:00 scheduled and the 14:00-16:00 on-demand); the two rejected calls created nothing"

      - name: courier_buffered_closed_interval_rejects_abutting_assignment
        resource_entity: Courier
        interval_semantics: "closed [window_start - 15 min, window_end + 15 min], courier scoped, non-strict inequality on both comparisons"
        grounds:
          - calculations.courier_overlap_detection
          - validations.priority_36_courier_overlap
          - entities.CourierAssignment.fields.status
        distinguishing_aspect: |
          The opposite interval semantics on a different resource: the courier's committed interval
          is CLOSED and padded 15 minutes on both ends, so the very window pair that the zone
          admitted as abutting is illegal for one courier, and only a start at 16:16Z clears the
