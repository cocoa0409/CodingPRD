            - call: "POST /production-lots/${lot_id}/complete-heading"
              payload: { headed_count: 4900, heading_scrap_count: 60 }
              as: ProcessEngineer
          assert:
            - "Before the re-verification: ProductionLot.${lot_id}.disposition == QUARANTINED with hold_source == HEAT_COUNTERFEIT and WireLot.${wire_id}.status == QUARANTINED"
            - "All three first trigger calls return 409 with error_id ERR_LOT_QUARANTINED — none of them returns ERR_LOT_ON_HOLD, and complete-heading does not return ERR_INVALID_LOT_STATE either"
            - "After the re-verification SteelHeat.${heat_id}.cert_status == VERIFIED, WireLot.${wire_id}.status == RELEASED and ProductionLot.${lot_id}.disposition == IN_PROCESS with hold_source == NONE — the pre-existing QUALITY hold is not reinstated"
