# =============================================================================
# Quick Lube & Oil Change — benchmark seed tables (§1.0–§1.7)
# Difficulty band: Expert
# =============================================================================

scenario: |
  335. Quick Lube & Oil Change: service menu (oil grade/package), drive-in queue & bay,
  vehicle lookup & interval reminder, upsell inspection (filter/fluids), sticker &
  next-service date, fleet account, coupon, throughput timing

domain_name: quick-lube-oil-change
api_prefix: ""   # flat topology: all collections are root-level (/shops, /work-orders, ...)

# =============================================================================
# Complexity Profile (Step 0)
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation          # finite drive-in bays competed for, reserved, released
  secondary_archetype: pricing_engine          # service packages, coupon stacking, fleet discount, tax
  complexity_layers:
    - cascading_side_effects                   # complete WO -> release bay -> promote next queue ticket
    - dual_variant_calculation                 # provisional vs final WO total; reserved vs settled fleet credit
    - derived_field_reconciliation             # WO price fields & fleet reserved_credit recomputed on mutation
    - optimistic_concurrency                    # OCC on Bay.version (queue->bay assignment) and WorkOrder.version (line add)

  entity_topology: flat                         # peer resources joined by FK (Vehicle, Bay, WorkOrder, FleetAccount, ...)
  state_machine_shape: parallel                 # WorkOrder carries independent service_status x payment_status; QueueTicket cyclic
  relationship_patterns:
    - one_to_many                               # Shop->Bay, FleetAccount->Vehicle, WorkOrder->WorkOrderLine
    - cross_aggregate                           # WorkOrder references Vehicle/Bay/Package/Technician across aggregates
  role_model: peer_roles                        # ShopManager / ServiceAdvisor / Technician / FleetManager own distinct surfaces
  consistency_model: immediate                  # all mutations atomic within the request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Shop
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Shop location name" }
      - { name: tax_rate, type: number, source: input, description: "Sales-tax rate as decimal (e.g. 0.0825); applied to discounted taxable base", constraints: "0 <= tax_rate < 1" }
      - { name: target_throughput_seconds, type: integer, source: input, description: "Target wall-clock duration of a work order from IN_SERVICE to READY, in seconds", constraints: "> 0" }
      - { name: max_discount_pct, type: number, source: input, default: 0.50, description: "Hard cap on combined coupon+fleet discount as fraction of subtotal", constraints: "0 < max_discount_pct <= 1" }
      - { name: open_bay_count, type: integer, source: computed, description: "Count of Bay rows with bay_id.shop_id == this.id and status == OPEN; conserved quantity for compensating invariant" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED", default: "OPEN", constraints: "OPEN | CLOSED" }

  - name: ServicePackage
    parent: null
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: input, description: "FK -> Shop.id" }
      - { name: oil_grade, type: enum, source: input, description: "CONVENTIONAL | SYNTHETIC_BLEND | FULL_SYNTHETIC | HIGH_MILEAGE", constraints: "CONVENTIONAL | SYNTHETIC_BLEND | FULL_SYNTHETIC | HIGH_MILEAGE" }
      - { name: name, type: string, source: input, description: "Display name of the package" }
      - { name: base_price_cents, type: integer, source: input, description: "Package base price in integer cents", constraints: ">= 0" }
      - { name: included_quarts, type: integer, source: input, description: "Quarts of oil included", constraints: "> 0" }
      - { name: labor_minutes, type: integer, source: input, description: "Standard labor minutes for this package", constraints: "> 0" }
      - { name: interval_miles, type: integer, source: input, description: "Recommended re-service mileage interval", constraints: "> 0" }
      - { name: interval_days, type: integer, source: input, description: "Recommended re-service time interval in days", constraints: "> 0" }
      - { name: requires_synthetic_certified_bay, type: boolean, source: computed, description: "True iff oil_grade in {FULL_SYNTHETIC, HIGH_MILEAGE}; gates bay capability check" }
      - { name: active, type: boolean, source: system, default: true, description: "Whether the package is offered; set false by retire action", constraints: "true | false" }

  - name: InspectionItem
    parent: null
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: input, description: "FK -> Shop.id" }
      - { name: code, type: enum, source: input, description: "AIR_FILTER | CABIN_FILTER | WIPER_BLADES | COOLANT_FLUSH | TRANSMISSION_FLUSH", constraints: "AIR_FILTER | CABIN_FILTER | WIPER_BLADES | COOLANT_FLUSH | TRANSMISSION_FLUSH" }
      - { name: name, type: string, source: input, description: "Display name of the upsell item" }
      - { name: price_cents, type: integer, source: input, description: "Upsell price in integer cents", constraints: ">= 0" }
      - { name: labor_minutes, type: integer, source: input, description: "Extra labor minutes when this item is added", constraints: ">= 0" }
      - { name: active, type: boolean, source: system, default: true, description: "Whether the upsell is offered", constraints: "true | false" }

  - name: Coupon
    parent: null
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: input, description: "FK -> Shop.id" }
      - { name: code, type: string, source: input, description: "Case-sensitive coupon code; unique per shop among status==ACTIVE coupons" }
      - { name: discount_type, type: enum, source: input, description: "PERCENT | FLAT", constraints: "PERCENT | FLAT" }
      - { name: percent_value, type: number, source: input, default: 0, description: "Fraction (e.g. 0.10) used when discount_type==PERCENT; ignored for FLAT", constraints: "0 <= percent_value < 1" }
      - { name: flat_cents, type: integer, source: input, default: 0, description: "Cents off used when discount_type==FLAT; ignored for PERCENT", constraints: ">= 0" }
      - { name: min_subtotal_cents, type: integer, source: input, default: 0, description: "Minimum WorkOrder subtotal_cents required to apply this coupon (>= boundary)", constraints: ">= 0" }
      - { name: stackable_with_fleet, type: boolean, source: input, default: false, description: "If true, coupon discount adds to fleet discount; if false, only the larger of the two applies", constraints: "true | false" }
      - { name: usage_limit, type: integer, source: input, description: "Maximum number of work orders that may redeem this coupon", constraints: "> 0" }
      - { name: redeemed_count, type: integer, source: computed, description: "Count of WorkOrder rows whose coupon_code == this.code AND payment_status == PAID", default: 0 }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | EXHAUSTED | EXPIRED", constraints: "ACTIVE | EXHAUSTED | EXPIRED" }

  - name: FleetAccount
    parent: null
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: input, description: "FK -> Shop.id" }
      - { name: company_name, type: string, source: input, description: "Corporate account name" }
      - { name: discount_pct, type: number, source: input, description: "Fleet discount fraction applied to subtotal (e.g. 0.10)", constraints: "0 <= discount_pct < 1" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum outstanding fleet charge in cents", constraints: ">= 0" }
      - { name: reserved_credit_cents, type: integer, source: computed, description: "Sum of total_cents over WorkOrders with this fleet account whose payment_status IN {AUTHORIZED, PAID}; conserved quantity for compensating invariant" }
      - { name: settled_credit_cents, type: integer, source: computed, description: "Sum of total_cents over WorkOrders with this fleet account whose payment_status == PAID" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED | CLOSED", constraints: "ACTIVE | SUSPENDED | CLOSED" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: input, description: "FK -> Shop.id" }
      - { name: fleet_account_id, type: string, source: input, default: null, description: "FK -> FleetAccount.id; null for retail walk-in vehicles" }
      - { name: vin, type: string, source: input, description: "Vehicle identification number; unique among vehicles of the same shop_id" }
      - { name: plate, type: string, source: input, description: "License plate" }
      - { name: make, type: string, source: input, description: "Vehicle make" }
      - { name: model, type: string, source: input, description: "Vehicle model" }
      - { name: odometer, type: integer, source: input, description: "Current odometer reading in miles at registration", constraints: ">= 0" }
      - { name: last_service_odometer, type: integer, source: computed, description: "Odometer at the most recent COMPLETED work order; null until first service" }
      - { name: last_service_date, type: datetime, source: computed, description: "created_at of the most recent COMPLETED work order; null until first service" }
      - { name: next_service_odometer, type: integer, source: computed, description: "last_service_odometer + package.interval_miles of the most recent COMPLETED work order; null until first service" }
      - { name: next_service_date, type: datetime, source: computed, description: "last_service_date + package.interval_days; null until first service" }
      - { name: service_due, type: boolean, source: computed, description: "True iff current odometer >= next_service_odometer OR clock now >= next_service_date (whichever comes first); false when no service history" }

  - name: Bay
    parent: null
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: input, description: "FK -> Shop.id" }
      - { name: label, type: string, source: input, description: "Bay label (e.g. Bay 1)" }
      - { name: synthetic_certified, type: boolean, source: input, default: false, description: "Whether this bay may service FULL_SYNTHETIC / HIGH_MILEAGE packages", constraints: "true | false" }
      - { name: current_work_order_id, type: string, source: computed, description: "Denormalized back-pointer: id of the occupying WorkOrder (navigable forward via WorkOrder.bay_id); null when OPEN" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | OCCUPIED | CLOSED", constraints: "OPEN | OCCUPIED | CLOSED" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: input, description: "FK -> Shop.id" }
      - { name: full_name, type: string, source: input, description: "Technician name" }
      - { name: synthetic_certified, type: boolean, source: input, default: false, description: "Whether this technician may perform FULL_SYNTHETIC / HIGH_MILEAGE service", constraints: "true | false" }
      - { name: cleanup_buffer_seconds, type: integer, source: input, default: 300, description: "Mandatory buffer between this technician's consecutive jobs; used by buffered-overlap check", constraints: ">= 0" }
      - { name: active, type: boolean, source: system, default: true, description: "Whether the technician is rostered", constraints: "true | false" }

  - name: QueueTicket
    parent: null
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: input, description: "FK -> Shop.id" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id" }
      - { name: requested_package_id, type: string, source: input, description: "FK -> ServicePackage.id the customer requested at intake" }
      - { name: queue_seq, type: integer, source: system, description: "Monotonic intake sequence number assigned at creation; the FIFO ordering key (lower = earlier), independent of id" }
      - { name: assigned_bay_id, type: string, source: computed, description: "Denormalized back-pointer: id of the assigned Bay once promoted (navigable forward via WorkOrder.bay_id); null while WAITING" }
      - { name: work_order_id, type: string, source: computed, description: "Denormalized back-pointer: id of the WorkOrder created at promotion (navigable forward via WorkOrder.queue_ticket_id); null while WAITING/CANCELLED" }
      - { name: status, type: enum, source: system, default: "WAITING", description: "WAITING | ASSIGNED | IN_BAY | DONE | CANCELLED", constraints: "WAITING | ASSIGNED | IN_BAY | DONE | CANCELLED" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: input, description: "FK -> Shop.id" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id" }
      - { name: bay_id, type: string, source: input, description: "FK -> Bay.id the order occupies; set at creation/promotion" }
      - { name: package_id, type: string, source: input, description: "FK -> ServicePackage.id selected for this order" }
      - { name: technician_id, type: string, source: input, default: null, description: "FK -> Technician.id assigned to perform the service; null until claimed" }
      - { name: queue_ticket_id, type: string, source: computed, default: null, description: "Denormalized back-pointer: id of the originating QueueTicket (navigable forward via QueueTicket.work_order_id); null for direct creation" }
      - { name: coupon_code, type: string, source: input, default: null, description: "Applied coupon code (matches Coupon.code on same shop_id); null when none" }
      - { name: odometer_in, type: integer, source: input, description: "Odometer reading recorded at check-in", constraints: ">= 0" }
      - { name: service_start_at, type: datetime, source: computed, description: "Clock at DRAFT->IN_SERVICE transition; null before service starts" }
      - { name: service_ready_at, type: datetime, source: computed, description: "Clock at *->READY transition; null before ready" }
      - { name: throughput_seconds, type: integer, source: computed, description: "service_ready_at - service_start_at in whole seconds; null until READY" }
      - { name: throughput_breach, type: boolean, source: computed, description: "True iff throughput_seconds > shop.target_throughput_seconds; null until READY" }
      - { name: package_price_cents, type: integer, source: computed, description: "Snapshot of ServicePackage.base_price_cents at creation" }
      - { name: lines_total_cents, type: integer, source: computed, description: "Sum of price_cents over this order's WorkOrderLine rows" }
      - { name: subtotal_cents, type: integer, source: computed, description: "package_price_cents + lines_total_cents" }
      - { name: coupon_discount_cents, type: integer, source: computed, description: "Coupon component of discount (see calculations.work_order_total); 0 when no coupon" }
      - { name: fleet_discount_cents, type: integer, source: computed, description: "Fleet component of discount; 0 unless vehicle has an ACTIVE fleet account" }
      - { name: total_discount_cents, type: integer, source: computed, description: "Combined discount after stacking rule and max_discount_pct cap" }
      - { name: tax_cents, type: integer, source: computed, description: "round_half_up((subtotal_cents - total_discount_cents) * shop.tax_rate)" }
      - { name: total_cents, type: integer, source: computed, description: "(subtotal_cents - total_discount_cents) + tax_cents; provisional pre-READY, final at READY" }
      - { name: payment_method, type: enum, source: input, default: null, description: "CARD | CASH | FLEET_ACCOUNT chosen at authorize; null until authorized", constraints: "CARD | CASH | FLEET_ACCOUNT" }
      - { name: service_status, type: enum, source: system, default: "DRAFT", description: "DRAFT | IN_SERVICE | INSPECTION | READY | COMPLETED | CANCELLED", constraints: "DRAFT | IN_SERVICE | INSPECTION | READY | COMPLETED | CANCELLED" }
      - { name: payment_status, type: enum, source: system, default: "UNPAID", description: "UNPAID | AUTHORIZED | PAID | VOIDED (independent dimension from service_status)", constraints: "UNPAID | AUTHORIZED | PAID | VOIDED" }

  - name: WorkOrderLine
    parent: WorkOrder
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id" }
      - { name: inspection_item_id, type: string, source: input, description: "Snapshot source reference: id of the InspectionItem this line was created from (code/price/labor snapshotted below); validated to exist at add time" }
      - { name: code, type: enum, source: computed, description: "Snapshot of InspectionItem.code", constraints: "AIR_FILTER | CABIN_FILTER | WIPER_BLADES | COOLANT_FLUSH | TRANSMISSION_FLUSH" }
      - { name: price_cents, type: integer, source: computed, description: "Snapshot of InspectionItem.price_cents at the moment the line was added" }
      - { name: labor_minutes, type: integer, source: computed, description: "Snapshot of InspectionItem.labor_minutes" }
      - { name: voided, type: boolean, source: system, default: false, description: "True when the parent order was cancelled; voided lines are excluded from lines_total_cents", constraints: "true | false" }

  - name: ServiceSticker
    parent: WorkOrder
    common_fields: false   # id + created_at only; immutable record
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id" }
      - { name: vehicle_id, type: string, source: computed, description: "Denormalized snapshot: id of the Vehicle copied from the work order (navigable via WorkOrder.vehicle_id)" }
      - { name: service_odometer, type: integer, source: computed, description: "WorkOrder.odometer_in snapshot at sticker print" }
      - { name: next_service_odometer, type: integer, source: computed, description: "service_odometer + package.interval_miles" }
      - { name: next_service_date, type: datetime, source: computed, description: "WorkOrder COMPLETED clock + package.interval_days (date the time-interval reminder fires)" }
      - { name: basis, type: enum, source: computed, description: "Which limit is projected to come first: MILEAGE | TIME (the reminder basis the shop should watch)", constraints: "MILEAGE | TIME" }

  - name: Payment
    parent: WorkOrder
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id" }
      - { name: method, type: enum, source: computed, description: "Snapshot of WorkOrder.payment_method: CARD | CASH | FLEET_ACCOUNT", constraints: "CARD | CASH | FLEET_ACCOUNT" }
      - { name: amount_cents, type: integer, source: computed, description: "Snapshot of WorkOrder.total_cents captured at authorize" }
      - { name: status, type: enum, source: system, default: "AUTHORIZED", description: "AUTHORIZED | CAPTURED | VOIDED", constraints: "AUTHORIZED | CAPTURED | VOIDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- WorkOrder: PARALLEL dimensions (service_status x payment_status) ----
  - entity: WorkOrder
    field: service_status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: IN_SERVICE
        trigger: "POST /work-orders/{id}/start"
        actor: Technician
        preconditions:
          - "bay_id Bay.status == OCCUPIED by this work order (ERR_BAY_NOT_READY)"
          - "technician_id is set (order has been claimed) (ERR_TECHNICIAN_NOT_ASSIGNED)"
          - "If package.requires_synthetic_certified_bay then Bay.synthetic_certified == true (ERR_BAY_CAPABILITY_MISMATCH)"
          - "If package.requires_synthetic_certified_bay then Technician.synthetic_certified == true (ERR_TECHNICIAN_CAPABILITY_MISMATCH)"
        side_effects:
          - "Set service_start_at = clock now"
      - from: IN_SERVICE
        to: INSPECTION
        trigger: "POST /work-orders/{id}/begin-inspection"
        actor: Technician
        preconditions:
          - "service_status == IN_SERVICE (ERR_INVALID_STATE)"
        side_effects: []
      - from: INSPECTION
        to: IN_SERVICE
        trigger: "POST /work-orders/{id}/finish-inspection"
        actor: Technician
        preconditions:
          - "service_status == INSPECTION (ERR_INVALID_STATE)"
        side_effects:
          - "Recompute lines_total_cents, subtotal_cents, all discount fields, tax_cents, total_cents (calculations.work_order_total) to reflect upsell lines added during inspection"
        note: "Cycle: IN_SERVICE -> INSPECTION -> IN_SERVICE permits a revision loop of upsell add/remove."
      - from: IN_SERVICE
        to: READY
        trigger: "POST /work-orders/{id}/mark-ready"
        actor: Technician
        preconditions:
          - "service_status == IN_SERVICE (ERR_INVALID_STATE)"
        side_effects:
          - "Recompute final total (calculations.work_order_total); this is the FINAL variant"
          - "Set service_ready_at = clock now"
          - "Compute throughput_seconds = service_ready_at - service_start_at"
          - "Compute throughput_breach = throughput_seconds > shop.target_throughput_seconds"
      - from: READY
        to: COMPLETED
        trigger: "POST /work-orders/{id}/complete"
        actor: ServiceAdvisor
        preconditions:
          - "service_status == READY (ERR_INVALID_STATE)"
          - "payment_status == PAID (ERR_PAYMENT_NOT_SETTLED)"
        side_effects:
          - "[cascade L1] Bay OCCUPIED -> OPEN (current_work_order_id = null); shop.open_bay_count += 1"
          - "[cascade L2] caused by the bay freeing: the WAITING QueueTicket with the lowest queue_seq at this shop, if any, is promoted ASSIGNED to the freed bay (its assigned_bay_id set, a new DRAFT WorkOrder created, bay OCCUPIED again)"
          - "[cascade L3] caused by that promotion: the freed bay returns to OCCUPIED and shop.open_bay_count -= 1 (net unchanged only when a ticket was waiting)"
          - "ServiceSticker row created (calculations.next_service_projection)"
          - "Vehicle.last_service_odometer / last_service_date / next_service_odometer / next_service_date / service_due recomputed (calculations.next_service_projection)"
          - "If queue_ticket_id set, that QueueTicket IN_BAY -> DONE"
      - from: [DRAFT, IN_SERVICE, INSPECTION]
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: ServiceAdvisor
        preconditions:
          - "service_status NOT IN {READY, COMPLETED, CANCELLED} (ERR_INVALID_STATE)"
        side_effects:
          - "All WorkOrderLine rows of this order set voided=true; lines_total_cents recomputed to 0"
          - "[compensating] If payment_status == AUTHORIZED: Payment AUTHORIZED -> VOIDED, payment_status -> VOIDED, fleet reserved_credit released (invariant fleet_reserved_credit_conserved)"
          - "[compensating] Bay OCCUPIED -> OPEN (current_work_order_id=null); shop.open_bay_count += 1 (invariant open_bay_count_conserved)"
          - "If queue_ticket_id set, that QueueTicket -> CANCELLED"

  - entity: WorkOrder
    field: payment_status
    initial_state: UNPAID
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: UNPAID
        to: AUTHORIZED
        trigger: "POST /work-orders/{id}/authorize"
        actor: ServiceAdvisor
        preconditions:
          - "service_status IN {INSPECTION, READY} so the total is meaningful (ERR_INVALID_STATE)"
          - "payment_method provided in {CARD, CASH, FLEET_ACCOUNT} (ERR_VALIDATION)"
          - "If payment_method == FLEET_ACCOUNT then vehicle.fleet_account_id is set AND FleetAccount.status == ACTIVE (ERR_FLEET_ACCOUNT_INACTIVE)"
          - "If payment_method == FLEET_ACCOUNT then FleetAccount.reserved_credit_cents + total_cents <= credit_limit_cents (ERR_FLEET_CREDIT_EXCEEDED)"
        side_effects:
          - "Create Payment (status AUTHORIZED, amount_cents = total_cents)"
          - "If FLEET_ACCOUNT: FleetAccount.reserved_credit_cents recomputed (now includes this order)"
      - from: AUTHORIZED
        to: PAID
        trigger: "POST /work-orders/{id}/capture-payment"
        actor: ServiceAdvisor
        preconditions:
          - "payment_status == AUTHORIZED (ERR_INVALID_STATE)"
          - "service_status == READY (ERR_INVALID_STATE)"
        side_effects:
          - "Payment AUTHORIZED -> CAPTURED"
          - "If coupon_code set: Coupon.redeemed_count recomputed; if redeemed_count >= usage_limit then Coupon.status -> EXHAUSTED"
          - "FleetAccount.settled_credit_cents recomputed (if FLEET_ACCOUNT)"
      - from: AUTHORIZED
        to: VOIDED
        trigger: "POST /work-orders/{id}/void-payment"
        actor: ServiceAdvisor
        preconditions:
          - "payment_status == AUTHORIZED (ERR_INVALID_STATE)"
        side_effects:
          - "[compensating] Payment AUTHORIZED -> VOIDED"
          - "[compensating] FleetAccount.reserved_credit_cents recomputed (this order no longer counts) — invariant fleet_reserved_credit_conserved"

  # ---- QueueTicket: cyclic (ASSIGNED -> WAITING -> ASSIGNED) ----
  - entity: QueueTicket
    field: status
    initial_state: WAITING
    terminal_states: [DONE, CANCELLED]
    transitions:
      - from: WAITING
        to: ASSIGNED
        trigger: "POST /queue-tickets/{id}/assign"
        actor: ServiceAdvisor
        preconditions:
          - "Target Bay.status == OPEN (ERR_BAY_NOT_OPEN)"
          - "expected_bay_version matches Bay.version (ERR_STALE_BAY_VERSION) — see concurrency_rules.queue-assign-stale-bay"
          - "Bay.shop_id == ticket.shop_id (ERR_BAY_NOT_OPEN)"
        side_effects:
          - "Bay OPEN -> OCCUPIED; bay.current_work_order_id set; shop.open_bay_count -= 1"
          - "Create WorkOrder (service_status DRAFT, payment_status UNPAID, bay_id = target bay, package_id = requested_package_id, odometer_in = vehicle.odometer); set ticket.work_order_id and ticket.assigned_bay_id"
      - from: ASSIGNED
        to: WAITING
        trigger: "POST /queue-tickets/{id}/requeue"
        actor: ServiceAdvisor
        preconditions:
          - "ticket.status == ASSIGNED (ERR_INVALID_STATE)"
          - "Associated WorkOrder.service_status == DRAFT (ERR_INVALID_STATE) — cannot requeue once service started"
        side_effects:
          - "Associated DRAFT WorkOrder -> CANCELLED (its bay released OCCUPIED -> OPEN, open_bay_count += 1)"
          - "ticket.assigned_bay_id = null; ticket.work_order_id = null"
        note: "Cycle back to WAITING; ticket may be re-assigned later."
      - from: ASSIGNED
        to: IN_BAY
        trigger: "system (associated WorkOrder DRAFT -> IN_SERVICE)"
        actor: system
        preconditions:
          - "Associated WorkOrder.service_status == IN_SERVICE"
        side_effects: []
      - from: IN_BAY
        to: DONE
        trigger: "system (associated WorkOrder -> COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WAITING
        to: CANCELLED
        trigger: "POST /queue-tickets/{id}/cancel"
        actor: ServiceAdvisor
        preconditions:
          - "ticket.status == WAITING (ERR_INVALID_STATE)"
        side_effects: []

  # ---- Bay: cyclic occupancy + close/reopen ----
  - entity: Bay
    field: status
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: OCCUPIED
        trigger: "system (QueueTicket assign OR direct WorkOrder creation)"
        actor: system
        preconditions:
          - "bay.status == OPEN (ERR_BAY_NOT_OPEN)"
        side_effects:
          - "bay.current_work_order_id set; shop.open_bay_count -= 1"
      - from: OCCUPIED
        to: OPEN
        trigger: "system (occupying WorkOrder -> COMPLETED or CANCELLED)"
        actor: system
        preconditions: []
        side_effects:
          - "bay.current_work_order_id = null; shop.open_bay_count += 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /bays/{id}/close"
        actor: ShopManager
        preconditions:
          - "bay.status == OPEN (ERR_BAY_OCCUPIED) — cannot close an occupied bay"
        side_effects:
          - "shop.open_bay_count -= 1"
      - from: CLOSED
        to: OPEN
        trigger: "POST /bays/{id}/reopen"
        actor: ShopManager
        preconditions:
          - "bay.status == CLOSED (ERR_INVALID_STATE)"
        side_effects:
          - "shop.open_bay_count += 1"

  # ---- FleetAccount: cyclic ACTIVE <-> SUSPENDED, -> CLOSED ----
  - entity: FleetAccount
    field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /fleet-accounts/{id}/suspend"
        actor: ShopManager
        preconditions:
          - "account.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "[cascade L1] For every DRAFT WorkOrder of a Vehicle on this account whose fleet_discount_cents > 0: recompute pricing with fleet discount now 0 (FleetAccount no longer ACTIVE) — total fields recomputed (calculations.work_order_total)"
        note: "Depth-2 cascade: suspend -> dependent DRAFT WorkOrders re-priced."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /fleet-accounts/{id}/reactivate"
        actor: ShopManager
        preconditions:
          - "account.status == SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "DRAFT WorkOrders of this account's vehicles are re-priced with fleet discount restored (calculations.work_order_total)"
      - from: [ACTIVE, SUSPENDED]
        to: CLOSED
        trigger: "POST /fleet-accounts/{id}/close"
        actor: ShopManager
        preconditions:
          - "reserved_credit_cents == 0 (ERR_FLEET_HAS_OPEN_BALANCE) — no AUTHORIZED/PAID outstanding orders"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; serial-observability filter applied)
# =============================================================================
concurrency_rules:
  - rule_id: queue-assign-stale-bay
    parent_entity: Bay
    write_endpoint: "POST /queue-tickets/{id}/assign"
    occ_field: "expected_bay_version"
    description: |
      Assigning a QueueTicket to a Bay whose version has advanced since the
      client last observed it is rejected. This captures the case where the
      bay was just claimed by another assignment (legitimately moving it
      OPEN -> OCCUPIED) so the current writer's view of the bay is stale; the
      second strictly-sequential assign still carrying the old version is
      rejected rather than double-occupying the bay.
    error_id: ERR_STALE_BAY_VERSION
    http_status: 412

  - rule_id: add-line-stale-work-order
    parent_entity: WorkOrder
    write_endpoint: "POST /work-orders/{id}/lines"
    occ_field: "expected_work_order_version"
    description: |
      Adding a WorkOrderLine against a WorkOrder whose version has advanced
      since the client last observed it is rejected. This captures the case
      where the order's pricing was just recomputed by a prior line add (which
      legitimately bumped the order's version and changed its totals) so the
      current writer's view of the order is stale; the second sequential add
      carrying the old version is rejected.
    error_id: ERR_STALE_WORK_ORDER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: work_order_total
    trigger: "WorkOrder creation; POST /work-orders/{id}/lines (add upsell); DELETE line; finish-inspection; mark-ready (FINAL); fleet suspend/reactivate cascade; coupon (de)apply"
    algorithm: tiered_pricing
    formula: |
      # ALL amounts are integer cents. Evaluation order is PINNED top-to-bottom.
      # round_half_up(x) = floor(x + 0.5) on a real-valued cents product.
      package_price_cents = WorkOrder.package_price_cents               # snapshot at creation
      lines_total_cents   = sum(line.price_cents for line in WorkOrderLine
                                where line.work_order_id == WO.id and line.voided == false)
      subtotal_cents      = package_price_cents + lines_total_cents

      # --- coupon component (PER-LINE rounding pinned for PERCENT) ---
      if coupon_code is null OR Coupon.status != ACTIVE OR subtotal_cents < Coupon.min_subtotal_cents:
          coupon_discount_cents = 0
      elif Coupon.discount_type == PERCENT:
          # PER-LINE then SUM (NOT round(subtotal * pct)). Package counts as one line.
          coupon_discount_cents = round_half_up(package_price_cents * Coupon.percent_value)
                                + sum(round_half_up(line.price_cents * Coupon.percent_value)
                                      for line in non-voided WorkOrderLine of WO)
      else:  # FLAT
          coupon_discount_cents = min(Coupon.flat_cents, subtotal_cents)

      # --- fleet component ---
      if Vehicle.fleet_account_id is null OR FleetAccount.status != ACTIVE:
          fleet_discount_cents = 0
      else:
          fleet_discount_cents = round_half_up(subtotal_cents * FleetAccount.discount_pct)

      # --- stacking rule (Rule 2a: >=3 inputs, conditional max vs sum, then cap) ---
      if Coupon present AND Coupon.stackable_with_fleet == true:
          raw_discount = coupon_discount_cents + fleet_discount_cents
      else:
          raw_discount = max(coupon_discount_cents, fleet_discount_cents)
      cap = floor(subtotal_cents * Shop.max_discount_pct)
      total_discount_cents = min(raw_discount, cap)

      # --- tax on discounted base, then total ---
      taxable_base_cents = subtotal_cents - total_discount_cents
      tax_cents          = round_half_up(taxable_base_cents * Shop.tax_rate)
      total_cents        = taxable_base_cents + tax_cents
    input_set: "Only non-voided WorkOrderLine rows of the order. Coupon must be status==ACTIVE and subtotal_cents >= min_subtotal_cents to apply. Fleet discount applies only when the vehicle's FleetAccount.status == ACTIVE."
    constants:
      ROUNDING: round_half_up
    precision: "integer cents; round_half_up at each per-line discount and at the final tax step"
    variants:
      - name: provisional
        when: "service_status in {DRAFT, IN_SERVICE, INSPECTION} — recomputed on every line add/remove and on finish-inspection"
        difference: "Reflects only the lines present so far; the customer-facing quote before the technician finalizes upsells."
      - name: final
        when: "Computed once at the *->READY transition (mark-ready) and frozen"
        difference: "Reflects the complete set of upsell lines accepted during INSPECTION; may exceed the provisional quote. Same formula, larger input set."

  - name: fleet_available_credit
    trigger: "Read of FleetAccount; recomputed on WorkOrder authorize / capture / void / cancel"
    algorithm: aggregation
    formula: |
      # Two valid aggregations over the SAME work-order set, different status filters.
      reserved_credit_cents = sum(WO.total_cents for WO where WO.vehicle.fleet_account_id == account.id
                                  and WO.payment_status in {AUTHORIZED, PAID})
      settled_credit_cents  = sum(WO.total_cents for WO where WO.vehicle.fleet_account_id == account.id
                                  and WO.payment_status == PAID)
      reserved_available = credit_limit_cents - reserved_credit_cents   # forward-looking (gates new authorizes)
      settled_available  = credit_limit_cents - settled_credit_cents    # chronological (only money actually captured)
    input_set: "WorkOrders of vehicles whose fleet_account_id == this account; reserved includes AUTHORIZED+PAID, settled includes PAID only."
    precision: "integer cents"
    variants:
      - name: reserved
        when: "Used by the authorize precondition ERR_FLEET_CREDIT_EXCEEDED"
        difference: "Includes AUTHORIZED-but-uncaptured orders, so available credit is lower (more conservative)."
      - name: settled
        when: "Used for billing/statement and the close precondition view"
        difference: "Counts only PAID orders, so available credit is higher than reserved."

  - name: next_service_projection
    trigger: "WorkOrder *->COMPLETED (creates ServiceSticker, updates Vehicle reminder fields)"
    algorithm: threshold
    formula: |
      # 'whichever comes first' — pick the basis projected to arrive sooner.
      service_odometer      = WorkOrder.odometer_in
      next_service_odometer = service_odometer + ServicePackage.interval_miles
      next_service_date     = (clock at COMPLETED, as a date) + ServicePackage.interval_days days
      # basis: estimate miles-until-due against days-until-due using shop's assumed daily mileage.
      miles_to_due          = ServicePackage.interval_miles
      days_to_due           = ServicePackage.interval_days
      # Projected days to hit the mileage limit at ASSUMED_DAILY_MILES:
      projected_days_for_miles = ceil(miles_to_due / ASSUMED_DAILY_MILES)
      if projected_days_for_miles <= days_to_due:
          basis = MILEAGE
      else:
          basis = TIME
      # service_due (Vehicle): current odometer >= next_service_odometer OR clock now >= next_service_date
    input_set: "Most recent COMPLETED WorkOrder for the vehicle defines the reminder baseline."
    constants:
      ASSUMED_DAILY_MILES: 40
    precision: "integer miles; whole days; ceil on projected_days_for_miles"

  - name: throughput_timing
    trigger: "WorkOrder *->READY (mark-ready)"
    algorithm: aggregation
    formula: |
      throughput_seconds = floor((service_ready_at - service_start_at) in seconds)
      throughput_breach   = throughput_seconds > Shop.target_throughput_seconds   # strict '>' boundary
    input_set: "Single work order's two timestamps."
    precision: "whole seconds; strict greater-than at the breach boundary"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Resource ids in the path exist, validated left-to-right (path id, then nested id such as lineId on DELETE /work-orders/{id}/lines/{lineId}, sticker existence on GET /work-orders/{id}/sticker, technician_id on claim)"
    error_id: "ERR_WORK_ORDER_NOT_FOUND / ERR_BAY_NOT_FOUND / ERR_VEHICLE_NOT_FOUND / ERR_QUEUE_TICKET_NOT_FOUND / ERR_FLEET_ACCOUNT_NOT_FOUND / ERR_PACKAGE_NOT_FOUND / ERR_INSPECTION_ITEM_NOT_FOUND / ERR_TECHNICIAN_NOT_FOUND / ERR_LINE_NOT_FOUND / ERR_STICKER_NOT_FOUND / ERR_SHOP_NOT_FOUND"
    http_status: 404
    applies_to: all path-parameterized endpoints

  - priority: 4
    category: business_referential
    check: "FK fields in the body reference existing rows of the SAME shop_id (e.g. coupon_code resolves to a Coupon, payment_method==FLEET_ACCOUNT requires vehicle.fleet_account_id set)"
    error_id: "ERR_COUPON_NOT_FOUND / ERR_VEHICLE_HAS_NO_FLEET_ACCOUNT / ERR_PACKAGE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /work-orders, POST /work-orders/{id}/apply-coupon, POST /work-orders/{id}/authorize"

  - priority: 5
    category: state
    check: "Target resource is in the correct state for this transition (service_status / payment_status / bay / fleet)"
    error_id: "ERR_INVALID_STATE / ERR_BAY_NOT_OPEN / ERR_BAY_OCCUPIED / ERR_BAY_NOT_READY / ERR_PAYMENT_NOT_SETTLED"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 6
    category: business_constraint
    check: "OCC: expected_<parent>_version matches the parent's current version"
    error_id: "ERR_STALE_BAY_VERSION / ERR_STALE_WORK_ORDER_VERSION"
    http_status: 412
    applies_to: "POST /queue-tickets/{id}/assign, POST /work-orders/{id}/lines"

  - priority: 7
    category: business_safety
    check: "Synthetic-grade service requires a synthetic_certified bay AND a synthetic_certified technician"
    error_id: "ERR_BAY_CAPABILITY_MISMATCH / ERR_TECHNICIAN_CAPABILITY_MISMATCH"
    http_status: 409
    applies_to: "POST /work-orders/{id}/start"

  - priority: 8
    category: business_temporal
    check: "Bay occupancy intervals must not overlap (half-open [start,end)); a technician's consecutive jobs must not overlap once the cleanup_buffer is added (buffered/closed semantics)"
    error_id: "ERR_BAY_TIME_OVERLAP / ERR_TECHNICIAN_DOUBLE_BOOKED"
    http_status: 409
    applies_to: "POST /work-orders, POST /work-orders/{id}/claim"

  - priority: 9
    category: business_constraint
    check: "Coupon eligibility: status==ACTIVE, redeemed_count < usage_limit, subtotal_cents >= min_subtotal_cents"
    error_id: "ERR_COUPON_EXPIRED / ERR_COUPON_USAGE_EXCEEDED / ERR_COUPON_MIN_SUBTOTAL_NOT_MET"
    http_status: 409
    applies_to: "POST /work-orders/{id}/apply-coupon"

  - priority: 10
    category: business_fiscal
    check: "Fleet credit: reserved_credit_cents + total_cents <= credit_limit_cents at authorize"
    error_id: ERR_FLEET_CREDIT_EXCEEDED
    http_status: 402
    applies_to: "POST /work-orders/{id}/authorize"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------------- Shop ----------------
  - method: POST
    path: "/shops"
    description: "Create a Shop (configuration root)"
    roles: [ShopManager]
    code: 201
    input: [name, tax_rate, target_throughput_seconds, "max_discount_pct?"]
    output: Shop
    side_effects: ["status=OPEN, open_bay_count=0"]
  - method: GET
    path: "/shops"
    description: "List shops"
    roles: [ShopManager, ServiceAdvisor, Technician, FleetManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "Shop[]"
    side_effects: []
  - method: GET
    path: "/shops/{id}"
    description: "Get a shop (open_bay_count is live)"
    roles: [ShopManager, ServiceAdvisor, Technician, FleetManager]
    code: 200
    input: []
    output: Shop
    side_effects: []

  # ---------------- ServicePackage ----------------
  - method: POST
    path: "/service-packages"
    description: "Create a service package (oil grade menu item)"
    roles: [ShopManager]
    code: 201
    input: [shop_id, oil_grade, name, base_price_cents, included_quarts, labor_minutes, interval_miles, interval_days]
    output: ServicePackage
    side_effects: ["requires_synthetic_certified_bay computed from oil_grade; active=true"]
  - method: GET
    path: "/service-packages"
    description: "List/look-up packages; filter by shop_id"
    roles: [ShopManager, ServiceAdvisor, Technician, FleetManager]
    code: 200
    input: ["shop_id?", "oil_grade?", "limit?", "offset?"]
    output: "ServicePackage[]"
    side_effects: []
  - method: GET
    path: "/service-packages/{id}"
    description: "Get a package"
    roles: [ShopManager, ServiceAdvisor, Technician, FleetManager]
    code: 200
    input: []
    output: ServicePackage
    side_effects: []
  - method: POST
    path: "/service-packages/{id}/retire"
    description: "Retire a package (active=false)"
    roles: [ShopManager]
    code: 200
    input: []
    output: ServicePackage
    side_effects: ["active=false"]

  # ---------------- InspectionItem ----------------
  - method: POST
    path: "/inspection-items"
    description: "Create an upsell inspection item"
    roles: [ShopManager]
    code: 201
    input: [shop_id, code, name, price_cents, labor_minutes]
    output: InspectionItem
    side_effects: ["active=true"]
  - method: GET
    path: "/inspection-items"
    description: "List inspection items; filter by shop_id"
    roles: [ShopManager, ServiceAdvisor, Technician, FleetManager]
    code: 200
    input: ["shop_id?", "limit?", "offset?"]
    output: "InspectionItem[]"
    side_effects: []
  - method: GET
    path: "/inspection-items/{id}"
    description: "Get an inspection item"
    roles: [ShopManager, ServiceAdvisor, Technician, FleetManager]
    code: 200
    input: []
    output: InspectionItem
    side_effects: []

  # ---------------- Coupon ----------------
  - method: POST
    path: "/coupons"
    description: "Create a coupon"
    roles: [ShopManager]
    code: 201
    input: [shop_id, code, discount_type, "percent_value?", "flat_cents?", "min_subtotal_cents?", "stackable_with_fleet?", usage_limit]
    output: Coupon
    side_effects: ["status=ACTIVE, redeemed_count=0"]
  - method: GET
    path: "/coupons"
    description: "List coupons; filter by shop_id"
    roles: [ShopManager, ServiceAdvisor]
    code: 200
    input: ["shop_id?", "code?", "limit?", "offset?"]
    output: "Coupon[]"
    side_effects: []
  - method: GET
    path: "/coupons/{id}"
    description: "Get a coupon (redeemed_count live)"
    roles: [ShopManager, ServiceAdvisor]
    code: 200
    input: []
    output: Coupon
    side_effects: []
  - method: POST
    path: "/coupons/{id}/expire"
    description: "Expire a coupon (status=EXPIRED)"
    roles: [ShopManager]
    code: 200
    input: []
    output: Coupon
    side_effects: ["status=EXPIRED"]

  # ---------------- FleetAccount ----------------
  - method: POST
    path: "/fleet-accounts"
    description: "Create a fleet account"
    roles: [ShopManager]
    code: 201
    input: [shop_id, company_name, discount_pct, credit_limit_cents]
    output: FleetAccount
    side_effects: ["status=ACTIVE, reserved_credit_cents=0, settled_credit_cents=0"]
  - method: GET
    path: "/fleet-accounts"
    description: "List fleet accounts; filter by shop_id"
    roles: [ShopManager, FleetManager]
    code: 200
    input: ["shop_id?", "limit?", "offset?"]
    output: "FleetAccount[]"
    side_effects: []
  - method: GET
    path: "/fleet-accounts/{id}"
    description: "Get a fleet account (reserved/settled credit live)"
    roles: [ShopManager, FleetManager]
    code: 200
    input: []
    output: FleetAccount
    side_effects: []
  - method: GET
    path: "/fleet-accounts/{id}/vehicles"
    description: "List vehicles belonging to a fleet account (FK reverse-reachability for Vehicle.fleet_account_id)"
    roles: [ShopManager, FleetManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "Vehicle[]"
    side_effects: []
  - method: POST
    path: "/fleet-accounts/{id}/suspend"
    description: "Suspend a fleet account (cascade re-price DRAFT orders)"
    roles: [ShopManager]
    code: 200
    input: []
    output: FleetAccount
    side_effects: ["status=SUSPENDED; cascade: DRAFT WorkOrders of this account re-priced with fleet discount 0"]
  - method: POST
    path: "/fleet-accounts/{id}/reactivate"
    description: "Reactivate a suspended fleet account"
    roles: [ShopManager]
    code: 200
    input: []
    output: FleetAccount
    side_effects: ["status=ACTIVE; DRAFT WorkOrders re-priced with fleet discount restored"]
  - method: POST
    path: "/fleet-accounts/{id}/close"
    description: "Close a fleet account (requires zero reserved credit)"
    roles: [ShopManager]
    code: 200
    input: []
    output: FleetAccount
    side_effects: ["status=CLOSED"]

  # ---------------- Vehicle ----------------
  - method: POST
    path: "/vehicles"
    description: "Register a vehicle (retail or fleet)"
    roles: [ShopManager, ServiceAdvisor, FleetManager]
    code: 201
    input: [shop_id, "fleet_account_id?", vin, plate, make, model, odometer]
    output: Vehicle
    side_effects: ["service history fields null; service_due=false"]
  - method: GET
    path: "/vehicles"
    description: "Look up vehicles; filter by shop_id, fleet_account_id, vin, plate"
    roles: [ShopManager, ServiceAdvisor, Technician, FleetManager]
    code: 200
    input: ["shop_id?", "fleet_account_id?", "vin?", "plate?", "limit?", "offset?"]
    output: "Vehicle[]"
    side_effects: []
  - method: GET
    path: "/vehicles/{id}"
    description: "Get a vehicle with interval-reminder fields"
    roles: [ShopManager, ServiceAdvisor, Technician, FleetManager]
    code: 200
    input: []
    output: Vehicle
    side_effects: []
  - method: GET
    path: "/vehicles/{id}/work-orders"
    description: "List a vehicle's work orders (FK reverse-reachability for WorkOrder.vehicle_id)"
    roles: [ShopManager, ServiceAdvisor, Technician, FleetManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "WorkOrder[]"
    side_effects: []

  # ---------------- Bay ----------------
  - method: POST
    path: "/bays"
    description: "Create a bay"
    roles: [ShopManager]
    code: 201
    input: [shop_id, label, "synthetic_certified?"]
    output: Bay
    side_effects: ["status=OPEN; shop.open_bay_count += 1"]
  - method: GET
    path: "/bays"
    description: "List bays; filter by shop_id, status"
    roles: [ShopManager, ServiceAdvisor, Technician]
    code: 200
    input: ["shop_id?", "status?", "limit?", "offset?"]
    output: "Bay[]"
    side_effects: []
  - method: GET
    path: "/bays/{id}"
    description: "Get a bay"
    roles: [ShopManager, ServiceAdvisor, Technician]
    code: 200
    input: []
    output: Bay
    side_effects: []
  - method: POST
    path: "/bays/{id}/close"
    description: "Close an OPEN bay"
    roles: [ShopManager]
    code: 200
    input: []
    output: Bay
    side_effects: ["status=CLOSED; shop.open_bay_count -= 1"]
  - method: POST
    path: "/bays/{id}/reopen"
    description: "Reopen a CLOSED bay"
    roles: [ShopManager]
    code: 200
    input: []
    output: Bay
    side_effects: ["status=OPEN; shop.open_bay_count += 1"]

  # ---------------- Technician ----------------
