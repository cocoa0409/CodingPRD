        grounds:
          - validations[priority=7]
          - validations[priority=17]
          - errors[ERR_CREW_UNAVAILABLE]
        distinguishing_aspect: "On one dispatch both the state check (crew DISPATCHED, priority 7) and the business_fiscal check (requested 5.0 > available 1.0, priority 17) fail; the lower-priority state error ERR_CREW_UNAVAILABLE is returned, not ERR_INSUFFICIENT_MATERIAL."
        test_recipe:
          setup:
            - "PUBLIC site; certified crew mid-job (a first work order started -> crew DISPATCHED); scarce material quantity_available=1.0."
            - "A second report triaged; the dispatch requests 5.0 of that material on a non-overlapping window."
