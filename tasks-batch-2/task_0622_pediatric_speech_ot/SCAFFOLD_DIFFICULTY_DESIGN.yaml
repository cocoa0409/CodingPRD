        grounds:
          - state_machines.PlanOfCare.ACTIVE_to_DISCHARGED
          - state_machines.Appointment.SCHEDULED_to_CANCELLED
          - state_machines.Authorization.EXHAUSTED_to_ACTIVE
          - state_machines.WaitlistEntry.WAITING_to_OFFERED
          - calculations.waitlist_promotion
        distinguishing_aspect: |
          Depth-3 chain from PlanOfCare.discharge: discharge CANCELS the plan's
          SCHEDULED appointment (link 1), the cancellation RELEASES the
          authorization visit which flips the authorization EXHAUSTED -> ACTIVE
          (link 2 caused by link 1), and the freed therapist slot PROMOTES the
          top WAITING waitlist entry to OFFERED (link 3 caused by link 2's slot
          release). Each hop is caused by the prior hop. Trigger = discharge.
