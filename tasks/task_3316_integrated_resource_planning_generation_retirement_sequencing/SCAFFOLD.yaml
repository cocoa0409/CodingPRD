      - "Increments Resource.version by 1 AND increments by 1 the version of every ResourcePortfolio under the former deciding plan"

  - method: POST
    path: "/resources/{resourceId}/mothball"
    description: "DECIDED -> MOTHBALLED when retirement_year <= clock year + 1"
    roles: [UtilityPlanner]
    code: 200
    input: []
    output: Resource
    side_effects: ["Increments Resource.version by 1"]

  - method: GET
