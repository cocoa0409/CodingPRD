          The second dual variant sits on the Award entity, not on ArbitrationDemand:
          gross_remedy_cents is the make-whole figure 255141 while net_remedy_cents is
          the payable figure 165141, and the divergence comes from mitigation and prior
          settlement rather than from an inclusion-set difference in a cost ledger.
        test_recipe:
