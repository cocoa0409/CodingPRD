            - { call: "POST /ppc/risk-reduction-credits", payload: { cycle_id: "${cy_id}", program_type: "PUBLIC_EDUCATION", activity_points: 3.5, evidence_note: "school program" }, as: CommunityOfficial, as_user_id: "${c_id}", captures: { cr: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
          trigger:
            - { call: "POST /ppc/risk-reduction-credits/${cr}/transition", payload: { target_state: "VERIFIED" }, as: FieldAnalyst }
          assert:
            - "RiskReductionCredit.${cr}.status == VERIFIED and credited_points == 2.00"

      - name: stale_flow_test_half_credit_and_cutoff_fresh
        claim_type: input_set_filtering
        grounds: [calculations.water_supply_points]
