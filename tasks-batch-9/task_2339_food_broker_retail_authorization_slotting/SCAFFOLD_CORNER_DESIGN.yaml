            - call: "POST /deductions/${ded}/substantiate"
              payload: { document_ref: "POD-2" }
              as: BrokerAccountManager
              as_user_id: "u_am_1"
            - call: "POST /deductions/${ded}/deny-recovery"
              payload: { denial_reason: "Still illegible" }
              as: BrokerAuditManager
              as_user_id: "u_audit_1"
            - call: "POST /deductions/${ded}/dispute"
              payload: { claim_amount_cents: 60000 }
              as: BrokerAccountManager
              as_user_id: "u_am_1"
              captures: { rf2: $.data.refile_count }
            - call: "POST /deductions/${ded}/substantiate"
              payload: { document_ref: "POD-3" }
              as: BrokerAccountManager
              as_user_id: "u_am_1"
            - call: "POST /deductions/${ded}/deny-recovery"
              payload: { denial_reason: "Final denial" }
              as: BrokerAuditManager
              as_user_id: "u_audit_1"
              captures: { ds3: $.data.dispute_state }
            - call: "POST /deductions/${ded}/dispute"
              payload: { claim_amount_cents: 60000 }
              as: BrokerAccountManager
              as_user_id: "u_am_1"
              captures: { e3: $.data.error_id }
            - call: "GET /deductions/${ded}"
              payload: {}
              as: BrokerAuditManager
              as_user_id: "u_audit_1"
              captures: { ds4: $.data.dispute_state, ss4: $.data.settlement_state, open4: $.data.open_cents, rec4: $.data.recovered_cents, con4: $.data.conceded_cents, rf4: $.data.refile_count }
          assert:
            - "Setup sanity: ${pst0} == PROSPECT and ${sub1} was created while the principal was still PROSPECT — catalog submission admits {PROSPECT, ACTIVE}"
            - "Call 1 returns 409 ERR_PRINCIPAL_NOT_ACTIVE — presentation submission demands ACTIVE exactly, so PROSPECT is refused; ${pres1} stays DRAFT"
            - "Call 3 returns 200 with ${st1} == SUBMITTED once the principal is ACTIVE"
            - "Call 5 returns 201 — item creation is NOT gated on principal status, even while SUSPENDED"
            - "Call 6 returns 409 ERR_PRINCIPAL_NOT_ACTIVE — SUSPENDED is in neither admissible set; Item ${i2}.catalog_state stays INCOMPLETE"
            - "Call 8 returns 201 (${sub2}) after re-activation, with the identical body that was just refused"
            - "Refile loop: ${rf0} == 0 on the first filing, ${rf1} == 1, ${rf2} == 2; each refile resets ${doc1} == 0 so the previous document cannot be reused"
            - "Every deny is money-neutral: ${ds1} == DENIED with ${open1} == 60000, and after the third denial ${ds3} == DENIED"
            - "Call 18 returns 409 ERR_REFILE_LIMIT_REACHED — refile_count 2 has reached MAX_REFILES; this is the constraint error (priority 11), not a state error, because DENIED→FILED is otherwise a legal transition"
            - "Final read: ${ds4} == DENIED, ${ss4} == OPEN, ${open4} == 60000, ${rec4} == 0, ${con4} == 0 and ${rf4} == 2 — the whole dispute round trip left the ledger exactly where it started"

  # ==========================================================================
  - section: rbac
    instances:
      - name: every_exclusive_operation_is_rejected_for_the_other_four_roles
        claim_type: exclusive_operations
        grounds:
          - roles.BrokerAdmin.exclusive_operations
          - roles.BrokerAccountManager.exclusive_operations
          - roles.BrokerAuditManager.exclusive_operations
          - roles.RetailerBuyer.exclusive_operations
          - errors.ERR_ROLE_FORBIDDEN
        distinguishing_aspect: |
          The five roles are PEERS, not a hierarchy: BrokerAdmin owns the contract
          surface but may not decide a catalog submission or post a snapshot, the
          account manager may not take a deduction, the buyer may not create items,
          and the audit manager may neither file nor read a commission statement's
          worth of broker-side actions. Every rejection is a priority-2 403 raised
          before any body or lookup work, and none of them leaves a trace.
        test_recipe:
          setup:
            - "Retailer BIGMART, principal NWF, item i1 owned by NWF, one SHORTAGE deduction of 60000 dated 2026-08-01; clock 2026-08-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /retailers"
              payload: { name: "Bigmart", chain_code: "BIGMART", total_store_count: 1200 }
              as: BrokerAdmin
              captures: { ret: $.data.id }
            - call: "POST /principals"
              payload: { name: "Northwind Foods", code: "NWF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { prin: $.data.id }
            - call: "POST /items"
