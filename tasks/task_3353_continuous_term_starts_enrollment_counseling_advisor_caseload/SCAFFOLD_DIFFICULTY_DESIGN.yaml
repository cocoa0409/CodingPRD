  # ------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_error_beats_safety_error_on_decision
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_STATE_NOT_AUTHORIZED]
        distinguishing_aspect: |
          Pair state(5) vs business_safety(6): the application is WITHDRAWN AND
          no authorization row exists for its program+state; the decision call
          must return ERR_INVALID_STATE (priority 5), not
          ERR_STATE_NOT_AUTHORIZED (priority 6).
        test_recipe:
          setup:
            - "Program P with NO authorization row for WY; term ENROLLMENT_OPEN; applicant in WY; application SUBMITTED then WITHDRAWN by owner"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { code: "BS-CS", title: "CS", total_credits_required: 120, licensure_flag: false }
              as: RegistrarAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /api/terms"
              payload: { name: "2026 Fall A", start_date: "2026-10-05", add_drop_end_date: "2026-10-12", census_date: "2026-10-19", end_date: "2026-12-13" }
              as: RegistrarAdmin
              captures: { term_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/terms/${term_id}/advance"
              payload: { to_state: "ENROLLMENT_OPEN" }
              as: RegistrarAdmin
            - call: "POST /api/applicants"
              payload: { full_name: "Wy Prospect", email: "wy@x.com", state_code: "WY" }
              as: RegistrarAdmin
              captures: { ap_id: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap_id}", term_id: "${term_id}", program_id: "${prog_id}" }
              as: Applicant
              as_user_id: "${ap_id}"
              captures: { appl_id: "$.data.id" }
            - call: "POST /api/applications/${appl_id}/withdraw"
              payload: {}
              as: Applicant
              as_user_id: "${ap_id}"
          trigger:
            - call: "POST /api/applications/${appl_id}/decision"
              payload: { decision: "ADMIT" }
              as: RegistrarAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "decision returns ERR_INVALID_STATE (409), not ERR_STATE_NOT_AUTHORIZED"
            - "Application.${appl_id}.status remains WITHDRAWN"

      - name: safety_error_beats_constraint_error_on_enroll
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_INCENTIVE_COMP_VIOLATION]
          - errors[ERR_EVALUATION_INCOMPLETE]
        distinguishing_aspect: |
          Pair business_safety(9) vs business_constraint(10) — different pair
          than state-vs-safety: enrollment creation where the assigned counselor
          is INCENTIVE-plan AND the TCE is only IN_REVIEW must return
          ERR_INCENTIVE_COMP_VIOLATION (safety), not ERR_EVALUATION_INCOMPLETE.
        test_recipe:
          setup:
            - "Program P, CO AUTHORIZED; term ENROLLMENT_OPEN; sole counselor C is INCENTIVE (auto-assigned to applicant)"
            - "Application ADMITTED; TCE exists but only IN_REVIEW (not COMPLETED)"
          setup_api_calls:
