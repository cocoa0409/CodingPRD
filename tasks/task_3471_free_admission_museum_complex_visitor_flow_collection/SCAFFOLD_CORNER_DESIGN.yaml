        distinguishing_aspect: "The grace window is entry slot + 2 slots: a pass for slot 2 admitted while the clock sits in slot 5 (11:15-11:30) fails ERR_PASS_EXPIRED and the pass flips to EXPIRED as a lazy side effect of the failed admit."
        test_recipe:
          setup:
            - "Timed museum (quotas 5/20, rate 10); pass RESERVED for 2026-09-10 slot 2; clock at 2026-09-10T11:20:00Z (slot 5)."
