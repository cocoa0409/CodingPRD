# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1515: Title I Funding & Program Compliance
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: grant_creation_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.DistrictGrant]
        distinguishing_aspect: "Minimal create applies defaults (carryover_in 0, admin_reserve 0, method CONSULTATION_AGREED), system fields (status SETUP, version 1, monitoring_clearance NOT_MONITORED), and the computed net_allocable_cents == total_allocation_cents."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2051, total_allocation_cents: 8000000, poverty_measure: "MEDICAID_DIRECT_CERT" }, as: FederalProgramsDirector, captures: { g: "$.data.id" } }
          trigger:
            - { call: "GET /title-i/grants/${g}", payload: {}, as: ComplianceAnalyst }
          assert:
            - "carryover_in_cents == 0 and admin_reserve_cents == 0 and equitable_count_method == CONSULTATION_AGREED (defaults)"
            - "status == SETUP, version == 1, ranking_version == 0, monitoring_clearance == NOT_MONITORED"
            - "net_allocable_cents == 8000000; id is a bare UUID; created_at has three fractional digits"

      - name: grant_rejects_readonly_fields_returns_invalid_request
        claim_type: system_fields
        grounds: [entities.DistrictGrant, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Supplying a read-only/system field (version) or computed field in a create body is rejected with 400 ERR_INVALID_REQUEST, not silently ignored."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /title-i/grants"
              payload: { fiscal_year: 2052, total_allocation_cents: 1000000, poverty_measure: "CENSUS_SAIPE", version: 99 }
              as: FederalProgramsDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "400 with error_id == ERR_INVALID_REQUEST and no grant row created"

      - name: get_missing_grant_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID yields 404 ERR_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /title-i/grants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FederalProgramsDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "404 with error_id == ERR_NOT_FOUND"

      - name: school_list_pagination_defaults
        claim_type: listing
        grounds: [response_envelope, entities.School]
        distinguishing_aspect: "Default pagination (limit 10) splits 11 schools into a full first page with has_more == true and a 1-row second page with has_more == false; total_count reports 11."
        test_recipe:
          setup: ["11 schools registered"]
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "S01", nces_id: "100001", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst }
            - { call: "POST /title-i/schools", payload: { name: "S02", nces_id: "100002", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst }
            - { call: "POST /title-i/schools", payload: { name: "S03", nces_id: "100003", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst }
            - { call: "POST /title-i/schools", payload: { name: "S04", nces_id: "100004", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst }
            - { call: "POST /title-i/schools", payload: { name: "S05", nces_id: "100005", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst }
            - { call: "POST /title-i/schools", payload: { name: "S06", nces_id: "100006", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst }
            - { call: "POST /title-i/schools", payload: { name: "S07", nces_id: "100007", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst }
            - { call: "POST /title-i/schools", payload: { name: "S08", nces_id: "100008", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst }
            - { call: "POST /title-i/schools", payload: { name: "S09", nces_id: "100009", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst }
            - { call: "POST /title-i/schools", payload: { name: "S10", nces_id: "100010", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst }
            - { call: "POST /title-i/schools", payload: { name: "S11", nces_id: "100011", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst }
          trigger:
            - { call: "GET /title-i/schools", payload: {}, as: ComplianceAnalyst }
            - { call: "GET /title-i/schools", payload: { offset: 10 }, as: ComplianceAnalyst }
          assert:
            - "first page: 10 rows, total_count == 11, has_more == true, limit == 10, offset == 0 (defaults applied)"
            - "second page (offset 10): 1 row, has_more == false"

  - section: state_machines
    instances:
      - name: close_out_from_setup_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.DistrictGrant, "errors[ERR_GRANT_INVALID_STATE]"]
        distinguishing_aspect: "close-out is only declared from ALLOCATED; from SETUP it fails with 409 ERR_GRANT_INVALID_STATE and stamps no carryover fields."
        test_recipe:
          setup: ["grant in SETUP"]
          setup_api_calls:
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2054, total_allocation_cents: 5000000, poverty_measure: "CENSUS_SAIPE" }, as: FederalProgramsDirector, captures: { g: "$.data.id" } }
          trigger:
            - call: "POST /title-i/grants/${g}/close-out"
              payload: {}
              as: FederalProgramsDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "409 error_id == ERR_GRANT_INVALID_STATE; grant stays SETUP with final_carryover_cents null"

      - name: expenditure_review_twice_returns_not_reviewable
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Expenditure.PENDING_REVIEW_to_ALLOWED, "errors[ERR_EXPENDITURE_NOT_REVIEWABLE]"]
        distinguishing_aspect: "ALLOWED is terminal for review: a second review call fails with ERR_EXPENDITURE_NOT_REVIEWABLE and the ledger is not double-counted."
        test_recipe:
          setup: ["ALLOCATED grant, certified allocation, expenditure E 1000 cents already ALLOWED"]
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "Lock School", nces_id: "100101", grade_span_low: 0, grade_span_high: 12 }, as: ComplianceAnalyst, captures: { s: "$.data.id" } }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2055, total_allocation_cents: 10000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "VERIFIED_COUNT" }, as: FederalProgramsDirector, captures: { g: "$.data.id", gv: "$.data.version" } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${g}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${s}", low_income_student_count: 100, total_student_count: 100 } ] }, as: ComplianceAnalyst, captures: { sn: "$.data.id" } }
            - { call: "POST /title-i/poverty-snapshots/${sn}/certify", payload: { expected_grant_version: "${gv}" }, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${g}/lock-rankings", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${g}/finalize-allocations", payload: {}, as: FederalProgramsDirector }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${g}", school_id: "${s}" }, as: FederalProgramsDirector, captures: { a: "$.data[0].id" } }
            - { call: "POST /title-i/school-allocations/${a}/certify", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/expenditures", payload: { grant_id: "${g}", school_allocation_id: "${a}", amount_cents: 1000, function_code: "INSTRUCTION", description: "supplies", incurred_date: "2054-09-01", supplant_screen: false }, as: ComplianceAnalyst, as_user_id: "analyst-1", captures: { e: "$.data.id" } }
            - { call: "POST /title-i/expenditures/${e}/review", payload: { decision: "ALLOW" }, as: FederalProgramsDirector, as_user_id: "director-1" }
          trigger:
            - call: "POST /title-i/expenditures/${e}/review"
              payload: { decision: "DISALLOW", disallow_reason: "UNALLOWABLE_COST", review_note: "second review attempt" }
              as: FederalProgramsDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "409 error_id == ERR_EXPENDITURE_NOT_REVIEWABLE"
            - "GET /title-i/grants/${g}: liquidated_cents == 1000 (no double count, no reversal)"

      - name: amendment_rejected_is_terminal_for_approval
        claim_type: terminal_state_lockdown
        grounds: [state_machines.BudgetAmendment, "errors[ERR_AMENDMENT_INVALID_STATE]"]
        distinguishing_aspect: "REJECTED is terminal: approving a rejected amendment fails with ERR_AMENDMENT_INVALID_STATE even by a different director."
        test_recipe:
          setup: ["ALLOCATED grant with two schools (S1 5400000, S2 3600000); amendment submitted by analyst-1 then rejected by director-1"]
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "Term A", nces_id: "100201", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst, captures: { s1: "$.data.id" } }
            - { call: "POST /title-i/schools", payload: { name: "Term B", nces_id: "100202", grade_span_low: 6, grade_span_high: 8 }, as: ComplianceAnalyst, captures: { s2: "$.data.id" } }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2056, total_allocation_cents: 10000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "VERIFIED_COUNT" }, as: FederalProgramsDirector, captures: { g: "$.data.id", gv: "$.data.version" } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${g}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${s1}", low_income_student_count: 60, total_student_count: 100 }, { school_id: "${s2}", low_income_student_count: 40, total_student_count: 100 } ] }, as: ComplianceAnalyst, captures: { sn: "$.data.id" } }
            - { call: "POST /title-i/poverty-snapshots/${sn}/certify", payload: { expected_grant_version: "${gv}" }, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${g}/lock-rankings", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${g}/finalize-allocations", payload: {}, as: FederalProgramsDirector }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${g}", school_id: "${s1}" }, as: FederalProgramsDirector, captures: { a1: "$.data[0].id" } }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${g}", school_id: "${s2}" }, as: FederalProgramsDirector, captures: { a2: "$.data[0].id" } }
            - { call: "GET /title-i/grants/${g}", payload: {}, as: FederalProgramsDirector, captures: { gv2: "$.data.version" } }
            - { call: "POST /title-i/budget-amendments", payload: { grant_id: "${g}", expected_grant_version: "${gv2}", lines: [ { target_type: "SCHOOL_ALLOCATION", target_id: "${a1}", new_amount_cents: 5300000 }, { target_type: "SCHOOL_ALLOCATION", target_id: "${a2}", new_amount_cents: 3700000 } ] }, as: ComplianceAnalyst, as_user_id: "analyst-1", captures: { ba: "$.data.id" } }
            - { call: "POST /title-i/budget-amendments/${ba}/submit", payload: {}, as: ComplianceAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /title-i/budget-amendments/${ba}/reject", payload: { decision_note: "rationale insufficient for mid-year move" }, as: FederalProgramsDirector, as_user_id: "director-1" }
          trigger:
            - call: "POST /title-i/budget-amendments/${ba}/approve"
              payload: {}
              as: FederalProgramsDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "409 error_id == ERR_AMENDMENT_INVALID_STATE; allocations unchanged (5400000 / 3600000)"

      - name: zero_finding_visit_auto_closes_on_report
        claim_type: side_effect_execution
        grounds: [state_machines.MonitoringVisit.IN_PROGRESS_to_REPORT_ISSUED, calculations.monitoring_clearance]
        distinguishing_aspect: "Empty-set boundary: issuing a report on a visit with zero findings satisfies the all-findings-terminal precondition vacuously, so the visit jumps straight to CLOSED and the grant clearance becomes CLEARED."
        test_recipe:
          setup: ["grant GV; visit 2026-08-01..2026-08-03 IN_PROGRESS at default clock; no findings"]
          setup_api_calls:
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2057, total_allocation_cents: 5000000, poverty_measure: "CENSUS_SAIPE" }, as: FederalProgramsDirector, captures: { g: "$.data.id" } }
            - { call: "POST /title-i/monitoring-visits", payload: { grant_id: "${g}", visit_start_date: "2026-08-01", visit_end_date: "2026-08-03", scope: "FISCAL" }, as: SEAMonitor, as_user_id: "monitor-1", captures: { v: "$.data.id" } }
            - { call: "POST /title-i/monitoring-visits/${v}/start", payload: {}, as: SEAMonitor, as_user_id: "monitor-1" }
          trigger:
            - { call: "POST /title-i/monitoring-visits/${v}/issue-report", payload: {}, as: SEAMonitor, as_user_id: "monitor-1", captures: { st: "$.data.status" } }
            - { call: "GET /title-i/grants/${g}", payload: {}, as: SEAMonitor, captures: { cl: "$.data.monitoring_clearance" } }
          assert:
            - "issue-report response status == CLOSED (REPORT_ISSUED -> CLOSED fired within the same request)"
            - "grant.monitoring_clearance == CLEARED (one CLOSED visit, no findings)"

      - name: finding_escalation_clock_sweep
        claim_type: valid_transition
        grounds: [state_machines.MonitoringFinding.OPEN_to_ESCALATED, calculations.snapshot_escalation_sweep]
        distinguishing_aspect: "System transition driven only by the logical clock: after set_current_utc past cap_due_date, the OPEN finding is ESCALATED while a CAP_SUBMITTED finding on the same visit is untouched; the sweep response lists exactly the escalated ids."
        test_recipe:
          setup: ["visit REPORT_ISSUED with F1 OPEN (due 2026-08-10) and F2 CAP_SUBMITTED (due 2026-08-10)"]
          setup_api_calls:
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2058, total_allocation_cents: 5000000, poverty_measure: "CENSUS_SAIPE" }, as: FederalProgramsDirector, captures: { g: "$.data.id" } }
            - { call: "POST /title-i/monitoring-visits", payload: { grant_id: "${g}", visit_start_date: "2026-08-01", visit_end_date: "2026-08-05", scope: "PROGRAMMATIC" }, as: SEAMonitor, as_user_id: "monitor-1", captures: { v: "$.data.id" } }
            - { call: "POST /title-i/monitoring-visits/${v}/start", payload: {}, as: SEAMonitor, as_user_id: "monitor-1" }
            - { call: "POST /title-i/monitoring-findings", payload: { visit_id: "${v}", citation: "34 CFR 200.77", severity: "FINDING", description: "ranking file incomplete", cap_due_date: "2026-08-10" }, as: SEAMonitor, as_user_id: "monitor-1", captures: { f1: "$.data.id" } }
            - { call: "POST /title-i/monitoring-findings", payload: { visit_id: "${v}", citation: "34 CFR 200.78", severity: "OBSERVATION", description: "documentation format inconsistent", cap_due_date: "2026-08-10" }, as: SEAMonitor, as_user_id: "monitor-1", captures: { f2: "$.data.id" } }
            - { call: "POST /title-i/monitoring-visits/${v}/issue-report", payload: {}, as: SEAMonitor, as_user_id: "monitor-1" }
            - { call: "POST /title-i/monitoring-findings/${f2}/submit-cap", payload: { cap_narrative: "The district will standardize its documentation format across all Title I schools this quarter." }, as: ComplianceAnalyst, as_user_id: "analyst-1" }
          trigger:
            - { call: "POST /title-i/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: FederalProgramsDirector, captures: { esc: "$.data.escalated_finding_ids" } }
            - { call: "GET /title-i/monitoring-findings/${f1}", payload: {}, as: SEAMonitor, captures: { f1_st: "$.data.status" } }
            - { call: "GET /title-i/monitoring-findings/${f2}", payload: {}, as: SEAMonitor, captures: { f2_st: "$.data.status" } }
          assert:
            - "F1.status == ESCALATED (cap_due_date 2026-08-10 < new clock date 2026-08-11)"
            - "F2.status == CAP_SUBMITTED (submitted findings never escalate)"
            - "escalated_finding_ids contains exactly [${f1}]"

  - section: calculations
    instances:
      - name: rank_tie_break_by_headcount_then_created_at
        claim_type: correct_result
        grounds: [calculations.school_ranking]
        distinguishing_aspect: "Three schools tie at 5000 bp; the tie resolves by low_income_student_count DESC (150 beats 100) and then by School.created_at ASC between the two 100-count schools — never by UUID."
        test_recipe:
          setup: ["schools SA (100/200) created before SB (100/200); SC (150/300) created last"]
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "Tie Alpha", nces_id: "100301", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst, captures: { sa: "$.data.id" } }
            - { call: "POST /title-i/schools", payload: { name: "Tie Beta", nces_id: "100302", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst, captures: { sb: "$.data.id" } }
            - { call: "POST /title-i/schools", payload: { name: "Tie Gamma", nces_id: "100303", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst, captures: { sc: "$.data.id" } }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2059, total_allocation_cents: 10000000, poverty_measure: "CENSUS_SAIPE" }, as: FederalProgramsDirector, captures: { g: "$.data.id", gv: "$.data.version" } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${g}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${sa}", low_income_student_count: 100, total_student_count: 200 }, { school_id: "${sb}", low_income_student_count: 100, total_student_count: 200 }, { school_id: "${sc}", low_income_student_count: 150, total_student_count: 300 } ] }, as: ComplianceAnalyst, captures: { sn: "$.data.id" } }
            - { call: "POST /title-i/poverty-snapshots/${sn}/certify", payload: { expected_grant_version: "${gv}" }, as: FederalProgramsDirector }
          trigger:
            - { call: "POST /title-i/grants/${g}/lock-rankings", payload: {}, as: FederalProgramsDirector }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${g}", school_id: "${sa}" }, as: FederalProgramsDirector, captures: { ra: "$.data[0].rank_position" } }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${g}", school_id: "${sb}" }, as: FederalProgramsDirector, captures: { rb: "$.data[0].rank_position" } }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${g}", school_id: "${sc}" }, as: FederalProgramsDirector, captures: { rc: "$.data[0].rank_position" } }
          assert:
            - "all three poverty_pct_bp == 5000"
            - "SC rank_position == 1 (headcount 150 wins the tie)"
            - "SA rank_position == 2 and SB rank_position == 3 (created_at ASC decides the remaining tie)"

      - name: ledger_aggregation_excludes_reclassified
        claim_type: input_set_filtering
        grounds: [calculations.ledger_aggregation]
        distinguishing_aspect: "Only ALLOWED expenditures feed liquidated_cents: after disallowing and reclassifying a 1000000-cent charge, the grant and allocation ledgers show exactly the 2000000-cent allowed charge and zero pending."
        test_recipe:
          setup: ["ALLOCATED grant (total 10000000, one school 100/100); E1 2000000 ALLOWED; E2 1000000 DISALLOWED then RECLASSIFIED"]
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "Ledger School", nces_id: "100401", grade_span_low: 0, grade_span_high: 12 }, as: ComplianceAnalyst, captures: { s: "$.data.id" } }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2060, total_allocation_cents: 10000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "VERIFIED_COUNT" }, as: FederalProgramsDirector, captures: { g: "$.data.id", gv: "$.data.version" } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${g}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${s}", low_income_student_count: 100, total_student_count: 100 } ] }, as: ComplianceAnalyst, captures: { sn: "$.data.id" } }
            - { call: "POST /title-i/poverty-snapshots/${sn}/certify", payload: { expected_grant_version: "${gv}" }, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${g}/lock-rankings", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${g}/finalize-allocations", payload: {}, as: FederalProgramsDirector }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${g}", school_id: "${s}" }, as: FederalProgramsDirector, captures: { a: "$.data[0].id" } }
            - { call: "POST /title-i/school-allocations/${a}/certify", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/expenditures", payload: { grant_id: "${g}", school_allocation_id: "${a}", amount_cents: 2000000, function_code: "INSTRUCTION", description: "teacher stipends", incurred_date: "2059-09-01", supplant_screen: false }, as: ComplianceAnalyst, as_user_id: "analyst-1", captures: { e1: "$.data.id" } }
            - { call: "POST /title-i/expenditures/${e1}/review", payload: { decision: "ALLOW" }, as: FederalProgramsDirector, as_user_id: "director-1" }
            - { call: "POST /title-i/expenditures", payload: { grant_id: "${g}", school_allocation_id: "${a}", amount_cents: 1000000, function_code: "INSTRUCTION", description: "questionable equipment", incurred_date: "2059-10-01", supplant_screen: false }, as: ComplianceAnalyst, as_user_id: "analyst-1", captures: { e2: "$.data.id" } }
            - { call: "POST /title-i/expenditures/${e2}/review", payload: { decision: "DISALLOW", disallow_reason: "INSUFFICIENT_DOCUMENTATION", review_note: "missing invoices" }, as: FederalProgramsDirector, as_user_id: "director-1" }
          trigger:
            - { call: "POST /title-i/expenditures/${e2}/reclassify", payload: { reclassified_to_fund_source: "NON_TITLE_I_STATE" }, as: ComplianceAnalyst, captures: { e2_st: "$.data.status" } }
            - { call: "GET /title-i/grants/${g}", payload: {}, as: FederalProgramsDirector, captures: { liq: "$.data.liquidated_cents", pen: "$.data.pending_cents" } }
            - { call: "GET /title-i/school-allocations/${a}", payload: {}, as: FederalProgramsDirector, captures: { a_liq: "$.data.liquidated_cents" } }
          assert:
            - "E2.status == RECLASSIFIED with reclassified_to_fund_source == NON_TITLE_I_STATE"
            - "grant.liquidated_cents == 2000000 and pending_cents == 0"
            - "allocation.liquidated_cents == 2000000 — the reclassified charge is excluded from every Title I ledger"

      - name: pe_school_distribution_recompute_on_adjust
        claim_type: constants_applied
        grounds: [calculations.pe_school_distribution_minimum, calculations.set_aside_minimums]
        distinguishing_aspect: "PE minimum == round_half_up(1% * 60000000) == 600000 and the school-distribution floor tracks reserved_cents at exactly 90%: 540000 at finalize, 720000 after adjust to 800000."
        test_recipe:
          setup: ["ALLOCATED grant total 60000000 (PE minimum applies), one school 100/100"]
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "PE School", nces_id: "100501", grade_span_low: 0, grade_span_high: 12 }, as: ComplianceAnalyst, captures: { s: "$.data.id" } }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2061, total_allocation_cents: 60000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "VERIFIED_COUNT" }, as: FederalProgramsDirector, captures: { g: "$.data.id", gv: "$.data.version" } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${g}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${s}", low_income_student_count: 100, total_student_count: 100 } ] }, as: ComplianceAnalyst, captures: { sn: "$.data.id" } }
            - { call: "POST /title-i/poverty-snapshots/${sn}/certify", payload: { expected_grant_version: "${gv}" }, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${g}/lock-rankings", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${g}/finalize-allocations", payload: {}, as: FederalProgramsDirector }
          trigger:
            - { call: "GET /title-i/set-asides", payload: { grant_id: "${g}", category: "PARENT_ENGAGEMENT" }, as: FederalProgramsDirector, captures: { pe: "$.data[0].id", pe_min: "$.data[0].minimum_cents", pe_dist0: "$.data[0].school_distributed_minimum_cents" } }
            - { call: "POST /title-i/set-asides/${pe}/adjust", payload: { reserved_cents: 800000 }, as: FederalProgramsDirector, captures: { pe_dist1: "$.data.school_distributed_minimum_cents" } }
          assert:
            - "at finalize: minimum_cents == 600000, reserved_cents == 600000, school_distributed_minimum_cents == 540000"
            - "after adjust to 800000: school_distributed_minimum_cents == 720000 (recomputed, not static)"
            - "all other categories keep school_distributed_minimum_cents == 0"

      - name: waterfall_rounding_covered_by_difficulty
        claim_type: correct_result
        grounds: [calculations.school_allocation_waterfall]
        excluded_because:
          difficulty_instance: waterfall_per_school_rounding_then_remainder
          rationale: "Per-school rounding order and negative-remainder reconciliation are asserted with exact literals there."

      - name: equitable_variant_selection_covered_by_difficulty
        claim_type: variant_selection
        grounds: [calculations.equitable_services_share]
        excluded_because:
          difficulty_instance: equitable_share_variant_divergence
          rationale: "Both variants computed and asserted on identical data there."

  - section: validations
    instances:
      - name: existence_beats_state_and_fiscal_priority
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
        distinguishing_aspect: "Triple-violation request (bogus allocation id + would-be state and fiscal violations) must surface ERR_NOT_FOUND 404 — existence (priority 3) outranks state (5) and fiscal (10)."
        test_recipe:
          setup: ["ALLOCATED grant with one school 100/100"]
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "Exist School", nces_id: "100601", grade_span_low: 0, grade_span_high: 12 }, as: ComplianceAnalyst, captures: { s: "$.data.id" } }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2062, total_allocation_cents: 10000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "VERIFIED_COUNT" }, as: FederalProgramsDirector, captures: { g: "$.data.id", gv: "$.data.version" } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${g}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${s}", low_income_student_count: 100, total_student_count: 100 } ] }, as: ComplianceAnalyst, captures: { sn: "$.data.id" } }
            - { call: "POST /title-i/poverty-snapshots/${sn}/certify", payload: { expected_grant_version: "${gv}" }, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${g}/lock-rankings", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${g}/finalize-allocations", payload: {}, as: FederalProgramsDirector }
          trigger:
            - call: "POST /title-i/expenditures"
              payload: { grant_id: "${g}", school_allocation_id: "00000000-0000-4000-8000-000000000000", amount_cents: 99000000, function_code: "INSTRUCTION", description: "charge against a nonexistent allocation", incurred_date: "2061-09-01", supplant_screen: true }
              as: ComplianceAnalyst
              captures: { err: "$.data.error_id" }
          assert:
            - "404 error_id == ERR_NOT_FOUND — not ERR_ALLOCATION_NOT_CERTIFIED, not ERR_SUPPLANT_RISK_UNRESOLVED, not ERR_INSUFFICIENT_ALLOCATION_BALANCE"

      - name: charge_target_ambiguous_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CHARGE_TARGET_AMBIGUOUS]
        distinguishing_aspect: "An expenditure naming BOTH a school allocation and a set-aside (or neither) is rejected 400; exactly-one-target is enforced."
        test_recipe:
          setup: ["ALLOCATED grant, certified allocation, PD set-aside id known"]
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "Amb School", nces_id: "100602", grade_span_low: 0, grade_span_high: 12 }, as: ComplianceAnalyst, captures: { s: "$.data.id" } }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2063, total_allocation_cents: 10000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "VERIFIED_COUNT" }, as: FederalProgramsDirector, captures: { g: "$.data.id", gv: "$.data.version" } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${g}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${s}", low_income_student_count: 100, total_student_count: 100 } ] }, as: ComplianceAnalyst, captures: { sn: "$.data.id" } }
            - { call: "POST /title-i/poverty-snapshots/${sn}/certify", payload: { expected_grant_version: "${gv}" }, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${g}/lock-rankings", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${g}/finalize-allocations", payload: {}, as: FederalProgramsDirector }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${g}", school_id: "${s}" }, as: FederalProgramsDirector, captures: { a: "$.data[0].id" } }
            - { call: "POST /title-i/school-allocations/${a}/certify", payload: {}, as: FederalProgramsDirector }
            - { call: "GET /title-i/set-asides", payload: { grant_id: "${g}", category: "PROFESSIONAL_DEVELOPMENT" }, as: FederalProgramsDirector, captures: { pd: "$.data[0].id" } }
          trigger:
            - call: "POST /title-i/expenditures"
              payload: { grant_id: "${g}", school_allocation_id: "${a}", set_aside_id: "${pd}", amount_cents: 1000, function_code: "INSTRUCTION", description: "both targets named", incurred_date: "2062-09-01", supplant_screen: false }
              as: ComplianceAnalyst
              captures: { err1: "$.data.error_id" }
            - call: "POST /title-i/expenditures"
              payload: { grant_id: "${g}", amount_cents: 1000, function_code: "INSTRUCTION", description: "no target named", incurred_date: "2062-09-01", supplant_screen: false }
              as: ComplianceAnalyst
              captures: { err2: "$.data.error_id" }
          assert:
            - "both-targets: 400 ERR_CHARGE_TARGET_AMBIGUOUS"
            - "neither-target: 400 ERR_CHARGE_TARGET_AMBIGUOUS"

      - name: function_target_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FUNCTION_TARGET_MISMATCH]
          - entities.Expenditure.fields.function_code
        distinguishing_aspect: "function_code PD against a school allocation (must be INSTRUCTION) and function_code INSTRUCTION against the PROFESSIONAL_DEVELOPMENT set-aside are both rejected 400 — the code/target correspondence is bidirectional."
        test_recipe:
          setup: ["ALLOCATED grant, certified allocation, PD set-aside id known"]
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "Func School", nces_id: "100603", grade_span_low: 0, grade_span_high: 12 }, as: ComplianceAnalyst, captures: { s: "$.data.id" } }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2064, total_allocation_cents: 10000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "VERIFIED_COUNT" }, as: FederalProgramsDirector, captures: { g: "$.data.id", gv: "$.data.version" } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${g}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${s}", low_income_student_count: 100, total_student_count: 100 } ] }, as: ComplianceAnalyst, captures: { sn: "$.data.id" } }
            - { call: "POST /title-i/poverty-snapshots/${sn}/certify", payload: { expected_grant_version: "${gv}" }, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${g}/lock-rankings", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${g}/finalize-allocations", payload: {}, as: FederalProgramsDirector }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${g}", school_id: "${s}" }, as: FederalProgramsDirector, captures: { a: "$.data[0].id" } }
            - { call: "POST /title-i/school-allocations/${a}/certify", payload: {}, as: FederalProgramsDirector }
            - { call: "GET /title-i/set-asides", payload: { grant_id: "${g}", category: "PROFESSIONAL_DEVELOPMENT" }, as: FederalProgramsDirector, captures: { pd: "$.data[0].id" } }
          trigger:
            - call: "POST /title-i/expenditures"
              payload: { grant_id: "${g}", school_allocation_id: "${a}", amount_cents: 1000, function_code: "PD", description: "wrong function for school target", incurred_date: "2063-09-01", supplant_screen: false }
              as: ComplianceAnalyst
              captures: { err1: "$.data.error_id" }
            - call: "POST /title-i/expenditures"
              payload: { grant_id: "${g}", set_aside_id: "${pd}", amount_cents: 1000, function_code: "INSTRUCTION", description: "wrong function for set-aside target", incurred_date: "2063-09-01", supplant_screen: false }
              as: ComplianceAnalyst
              captures: { err2: "$.data.error_id" }
          assert:
            - "school target with function_code PD: 400 ERR_FUNCTION_TARGET_MISMATCH"
            - "PD set-aside with function_code INSTRUCTION: 400 ERR_FUNCTION_TARGET_MISMATCH"

      - name: missing_auth_header_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
        distinguishing_aspect: "A request with no X-User-ID / X-User-Role headers is rejected 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any role check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /title-i/grants"
              payload: {}
              as: FederalProgramsDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "the unit test issues this call WITHOUT the auth headers: 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

  - section: errors
    instances:
      - name: lock_rankings_without_snapshot_returns_no_certified
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NO_CERTIFIED_SNAPSHOT]
        distinguishing_aspect: "lock-rankings with zero snapshots for the grant fails 409 ERR_NO_CERTIFIED_SNAPSHOT."
        test_recipe:
          setup: ["grant in SETUP, no snapshots"]
          setup_api_calls:
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2065, total_allocation_cents: 5000000, poverty_measure: "CENSUS_SAIPE" }, as: FederalProgramsDirector, captures: { g: "$.data.id" } }
          trigger:
            - call: "POST /title-i/grants/${g}/lock-rankings"
              payload: {}
              as: FederalProgramsDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "409 error_id == ERR_NO_CERTIFIED_SNAPSHOT; grant remains SETUP"

      - name: certify_snapshot_twice_returns_not_certifiable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SNAPSHOT_NOT_CERTIFIABLE]
        distinguishing_aspect: "Re-certifying an already-CERTIFIED snapshot fails 409 ERR_SNAPSHOT_NOT_CERTIFIABLE even with a correct fresh grant version (state beats OCC)."
        test_recipe:
          setup: ["grant with one certified snapshot"]
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "Cert School", nces_id: "100604", grade_span_low: 0, grade_span_high: 12 }, as: ComplianceAnalyst, captures: { s: "$.data.id" } }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2066, total_allocation_cents: 5000000, poverty_measure: "CENSUS_SAIPE" }, as: FederalProgramsDirector, captures: { g: "$.data.id", gv: "$.data.version" } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${g}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${s}", low_income_student_count: 50, total_student_count: 100 } ] }, as: ComplianceAnalyst, captures: { sn: "$.data.id" } }
            - { call: "POST /title-i/poverty-snapshots/${sn}/certify", payload: { expected_grant_version: "${gv}" }, as: FederalProgramsDirector }
            - { call: "GET /title-i/grants/${g}", payload: {}, as: FederalProgramsDirector, captures: { gv2: "$.data.version" } }
          trigger:
            - call: "POST /title-i/poverty-snapshots/${sn}/certify"
              payload: { expected_grant_version: "${gv2}" }
              as: FederalProgramsDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "409 error_id == ERR_SNAPSHOT_NOT_CERTIFIABLE (not 412 — the state precondition is evaluated before the OCC check would matter)"

      - name: snapshot_incomplete_coverage_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SNAPSHOT_INCOMPLETE_COVERAGE]
        distinguishing_aspect: "Two active schools exist but the snapshot covers one; certify fails 422 ERR_SNAPSHOT_INCOMPLETE_COVERAGE (coverage is enforced at certify time, not at draft creation)."
        test_recipe:
          setup: ["two active schools; snapshot DRAFT covers only one"]
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "Cov A", nces_id: "100605", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst, captures: { s1: "$.data.id" } }
            - { call: "POST /title-i/schools", payload: { name: "Cov B", nces_id: "100606", grade_span_low: 6, grade_span_high: 8 }, as: ComplianceAnalyst, captures: { s2: "$.data.id" } }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2067, total_allocation_cents: 5000000, poverty_measure: "CENSUS_SAIPE" }, as: FederalProgramsDirector, captures: { g: "$.data.id", gv: "$.data.version" } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${g}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${s1}", low_income_student_count: 50, total_student_count: 100 } ] }, as: ComplianceAnalyst, captures: { sn: "$.data.id" } }
          trigger:
            - call: "POST /title-i/poverty-snapshots/${sn}/certify"
              payload: { expected_grant_version: "${gv}" }
              as: FederalProgramsDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "422 error_id == ERR_SNAPSHOT_INCOMPLETE_COVERAGE; snapshot stays DRAFT; no snapshot of the grant is CERTIFIED"

      - name: duplicate_school_entry_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUPLICATE_SCHOOL_ENTRY]
        distinguishing_aspect: "Snapshot entries listing the same school twice are rejected at creation with 400 ERR_DUPLICATE_SCHOOL_ENTRY."
        test_recipe:
          setup: ["one school; one grant"]
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "Dup School", nces_id: "100607", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst, captures: { s1: "$.data.id" } }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2068, total_allocation_cents: 5000000, poverty_measure: "CENSUS_SAIPE" }, as: FederalProgramsDirector, captures: { g: "$.data.id" } }
          trigger:
            - call: "POST /title-i/poverty-snapshots"
              payload: { grant_id: "${g}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${s1}", low_income_student_count: 50, total_student_count: 100 }, { school_id: "${s1}", low_income_student_count: 51, total_student_count: 100 } ] }
              as: ComplianceAnalyst
              captures: { err: "$.data.error_id" }
          assert:
            - "400 error_id == ERR_DUPLICATE_SCHOOL_ENTRY; no snapshot persisted"

      - name: duplicate_fiscal_year_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUPLICATE_FISCAL_YEAR]
        distinguishing_aspect: "Second grant for the same fiscal_year fails 409 ERR_DUPLICATE_FISCAL_YEAR."
        test_recipe:
          setup: ["grant for FY2069 exists"]
          setup_api_calls:
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2069, total_allocation_cents: 5000000, poverty_measure: "CENSUS_SAIPE" }, as: FederalProgramsDirector, captures: { g: "$.data.id" } }
          trigger:
            - call: "POST /title-i/grants"
              payload: { fiscal_year: 2069, total_allocation_cents: 7000000, poverty_measure: "MEDICAID_DIRECT_CERT" }
              as: FederalProgramsDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "409 error_id == ERR_DUPLICATE_FISCAL_YEAR"

      - name: duplicate_consultation_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUPLICATE_CONSULTATION]
        distinguishing_aspect: "One consultation per (grant, private_school): the second create fails 409 ERR_DUPLICATE_CONSULTATION regardless of the first one's status."
        test_recipe:
          setup: ["grant; verified private school; one consultation already open"]
          setup_api_calls:
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2070, total_allocation_cents: 5000000, poverty_measure: "CENSUS_SAIPE" }, as: FederalProgramsDirector, captures: { g: "$.data.id" } }
            - { call: "POST /title-i/private-schools", payload: { name: "Dup Academy", low_income_resident_count: 10, contact_email: "om@dup.example", nonprofit_verified: true }, as: ComplianceAnalyst, captures: { p: "$.data.id" } }
            - { call: "POST /title-i/equitable-services-consultations", payload: { grant_id: "${g}", private_school_id: "${p}" }, as: ComplianceAnalyst }
          trigger:
            - call: "POST /title-i/equitable-services-consultations"
              payload: { grant_id: "${g}", private_school_id: "${p}" }
              as: ComplianceAnalyst
              captures: { err: "$.data.error_id" }
          assert:
            - "409 error_id == ERR_DUPLICATE_CONSULTATION"

      - name: unverified_private_school_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PRIVATE_SCHOOL_NOT_VERIFIED]
        distinguishing_aspect: "Consultation with a private school whose nonprofit_verified is false fails 422 ERR_PRIVATE_SCHOOL_NOT_VERIFIED."
        test_recipe:
          setup: ["grant; unverified private school"]
          setup_api_calls:
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2071, total_allocation_cents: 5000000, poverty_measure: "CENSUS_SAIPE" }, as: FederalProgramsDirector, captures: { g: "$.data.id" } }
            - { call: "POST /title-i/private-schools", payload: { name: "Unverified Academy", low_income_resident_count: 8, contact_email: "om@unv.example", nonprofit_verified: false }, as: ComplianceAnalyst, captures: { p: "$.data.id" } }
          trigger:
            - call: "POST /title-i/equitable-services-consultations"
              payload: { grant_id: "${g}", private_school_id: "${p}" }
              as: ComplianceAnalyst
              captures: { err: "$.data.error_id" }
          assert:
            - "422 error_id == ERR_PRIVATE_SCHOOL_NOT_VERIFIED"

      - name: finalize_blocked_by_unsigned_consultation
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CONSULTATION_INCOMPLETE]
        distinguishing_aspect: "Cross-entity gate Grant -> EquitableServicesConsultation: a CONSULTATION_AGREED grant cannot finalize while a verified private school lacks an AFFIRMATION_SIGNED consultation (the consultation exists but is only CONSULTING here)."
        test_recipe:
          setup: ["CONSULTATION_AGREED grant RANKING_LOCKED; verified private school with consultation in CONSULTING (1 session, unsigned)"]
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "Gate School", nces_id: "100608", grade_span_low: 0, grade_span_high: 12 }, as: ComplianceAnalyst, captures: { s: "$.data.id" } }
            - { call: "POST /title-i/private-schools", payload: { name: "Gate Academy", low_income_resident_count: 9, contact_email: "om@gate.example", nonprofit_verified: true }, as: ComplianceAnalyst, captures: { p: "$.data.id" } }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2072, total_allocation_cents: 5000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "CONSULTATION_AGREED" }, as: FederalProgramsDirector, captures: { g: "$.data.id", gv: "$.data.version" } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${g}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${s}", low_income_student_count: 50, total_student_count: 100 } ] }, as: ComplianceAnalyst, captures: { sn: "$.data.id" } }
            - { call: "POST /title-i/poverty-snapshots/${sn}/certify", payload: { expected_grant_version: "${gv}" }, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${g}/lock-rankings", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/equitable-services-consultations", payload: { grant_id: "${g}", private_school_id: "${p}" }, as: ComplianceAnalyst, captures: { c: "$.data.id" } }
            - { call: "POST /title-i/equitable-services-consultations/${c}/record-session", payload: { session_date: "2026-08-01", topics: "introductions", attendee_count: 2 }, as: ComplianceAnalyst }
          trigger:
            - call: "POST /title-i/grants/${g}/finalize-allocations"
              payload: {}
              as: FederalProgramsDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "409 error_id == ERR_CONSULTATION_INCOMPLETE; grant remains RANKING_LOCKED"

      - name: sign_affirmation_with_one_session_rejected
        claim_type: precondition_enforcement
        grounds:
          - errors[ERR_INSUFFICIENT_CONSULTATION_SESSIONS]
          - state_machines.EquitableServicesConsultation.CONSULTING_to_AFFIRMATION_SIGNED
        distinguishing_aspect: "sessions_count == 1 is below the >= 2 floor: sign-affirmation fails 409; a second session makes the identical call succeed."
