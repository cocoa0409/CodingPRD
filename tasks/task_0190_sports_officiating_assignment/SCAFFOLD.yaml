    side_effects: ["Assignment -> DECLINED; penalty assessed; SeasonLedger.penalty_points +=; CrewSlot -> VACANT (re-offerable)"]

  - method: POST
    path: "/assignments/{id}/withdraw"
    description: "Official withdraws an ACCEPTED assignment before lock; assess late-decline penalty"
    roles: [Official]
    code: 200
    input: []
    output: Assignment
    side_effects: ["Assignment -> CANCELLED; penalty assessed; CrewSlot -> VACANT; may bubble STAFFED -> OPEN"]

  - method: POST
    path: "/assignments/{id}/no-show"
    description: "Assignor records a no-show against an ACCEPTED assignment after game start"
    roles: [Assignor]
    code: 200
    input: []
    output: Assignment
    side_effects: ["Assignment -> NO_SHOW; no-show penalty assessed; noshow_count++; CrewSlot -> VACANT; may bubble STAFFED -> OPEN"]

  - method: POST
    path: "/assignments/{id}/evaluations"
    description: "Evaluator rates a COMPLETED assignment"
    roles: [Evaluator]
    code: 201
    input: [score, "comment?"]
    output: Evaluation
    side_effects: ["Evaluation appended; Official.mean_rating recomputed"]

  - method: GET
    path: "/assignments/{id}/evaluations"
    description: "Reverse-reachability: evaluations for an assignment"
    roles: [LeagueAdmin, Assignor, Official, Evaluator]
    code: 200
    input: ["limit?", "offset?"]
    output: "Evaluation[]"
    side_effects: []

  # ---- PenaltyAppeal ----
  - method: POST
    path: "/assignments/{id}/appeals"
    description: "Official appeals the penalty on a DECLINED or NO_SHOW assignment"
    roles: [Official]
    code: 201
    input: [reason]
    output: PenaltyAppeal
    side_effects: ["PenaltyAppeal created PENDING; official_id copied from the assignment"]

  - method: GET
    path: "/assignments/{id}/appeals"
    description: "Reverse-reachability: penalty appeals for an assignment"
    roles: [LeagueAdmin, Assignor, Official, Evaluator]
    code: 200
    input: ["limit?", "offset?"]
    output: "PenaltyAppeal[]"
    side_effects: []

  - method: GET
    path: "/penalty-appeals/{id}"
    description: "Get a penalty appeal"
    roles: [LeagueAdmin, Assignor, Official, Evaluator]
    code: 200
    input: []
    output: PenaltyAppeal
    side_effects: []

  - method: POST
    path: "/penalty-appeals/{id}/uphold"
    description: "LeagueAdmin upholds an appeal; reverses the assessed penalty points"
    roles: [LeagueAdmin]
    code: 200
    input: []
    output: PenaltyAppeal
    side_effects: ["status -> UPHELD; reversed_points set; SeasonLedger.penalty_points -= reversed_points (floor 0); Official.reliability_score recomputed; noshow_count recomputed if appealed a NO_SHOW"]

  - method: POST
    path: "/penalty-appeals/{id}/deny"
    description: "LeagueAdmin denies an appeal; no ledger change"
    roles: [LeagueAdmin]
    code: 200
    input: []
    output: PenaltyAppeal
    side_effects: ["status -> DENIED; reversed_points stays 0"]

  # ---- Test-driving endpoint: clock control ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set the server's current UTC clock for time-gated transitions"
    roles: [LeagueAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock set to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,       http: 401, condition: "missing/malformed X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN_ROLE,        http: 403, condition: "acting role not permitted for the operation" }
  - { id: ERR_NOT_FOUND,             http: 404, condition: "referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST,       http: 400, condition: "missing required field, bad enum, score out of 1.0-5.0, window_end<=window_start, required_crew_size<1, scope/team_name/peer mismatch" }
  - { id: ERR_INVALID_STATE,         http: 409, condition: "transition not defined from the resource's current state" }
  - { id: ERR_LEAGUE_NOT_OPEN,       http: 409, condition: "opening a game while its league is not OPEN" }
  - { id: ERR_GAME_NOT_OPEN,         http: 409, condition: "offering a slot or accepting while Game.status != OPEN" }
  - { id: ERR_GAME_LOCKED,           http: 409, condition: "withdrawing after the game is LOCKED" }
  - { id: ERR_GAME_NOT_STARTED,      http: 409, condition: "settle or no-show before game.start_utc <= current clock" }
  - { id: ERR_CREW_NOT_PROVISIONED,  http: 409, condition: "opening a game whose CrewSlot count != required_crew_size" }
  - { id: ERR_CREW_INCOMPLETE,       http: 409, condition: "locking a game whose crew_filled_count != required_crew_size" }
  - { id: ERR_SLOT_NOT_VACANT,       http: 409, condition: "offering a slot that is not VACANT" }
  - { id: ERR_OFFICIAL_SUSPENDED,    http: 409, condition: "offering a slot to a SUSPENDED official" }
  - { id: ERR_RANK_INELIGIBLE,       http: 422, condition: "offering a REFEREE slot to an official below SENIOR rank" }
  - { id: ERR_CONFLICT_OF_INTEREST,  http: 422, condition: "official has a TEAM conflict with this game, or an OFFICIAL conflict with a peer already FILLED on this game" }
  - { id: ERR_OUTSIDE_AVAILABILITY,  http: 422, condition: "game interval not fully covered by an AVAILABLE window or intersects a BLACKOUT" }
  - { id: ERR_OFFICIAL_DOUBLE_BOOKED, http: 409, condition: "official already holds an OFFERED/ACCEPTED assignment overlapping this game's interval" }
  - { id: ERR_OUTSIDE_TRAVEL_RADIUS, http: 422, condition: "great-circle distance(home, venue) > official.max_travel_miles" }
  - { id: ERR_NOT_POSTSEASON_ELIGIBLE, http: 422, condition: "offering a postseason game to an official who is not postseason_eligible" }
  - { id: ERR_ASSIGNMENT_NOT_COMPLETED, http: 409, condition: "evaluating a non-COMPLETED assignment, or a second evaluation on the same assignment" }
  - { id: ERR_NOT_APPEALABLE,         http: 409, condition: "appealing an assignment not in {DECLINED, NO_SHOW} with penalty_assessed_points>0, or a duplicate PENDING/UPHELD appeal on the same assignment" }
  - { id: ERR_NOT_ASSIGNMENT_OWNER,  http: 403, condition: "official acting on an assignment that is not theirs" }
  - { id: ERR_STALE_GAME_VERSION,    http: 412, condition: "expected_game_version != current Game.version on offer/accept/lock/settle/cancel" }
  - { id: ERR_STALE_OFFICIAL_VERSION, http: 412, condition: "expected_official_version != current Official.version on PATCH" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LeagueAdmin
    description: "Configures leagues, registers officials, manages ranks/suspension, drives league posture and the test clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /leagues, POST /leagues/{id}/activate|start-postseason|archive"
      - "POST /officials, PATCH /officials/{id}"
      - "POST /penalty-appeals/{id}/uphold|deny"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /availabilities, POST /availabilities/{id}/withdraw (shared with Official)"
      - "POST /conflict-declarations (shared with Official)"
      - "all GET reads"

  - name: Assignor
    description: "Owns game creation, crew provisioning, offers, locking, settlement, cancellation, and no-show recording"
    identity: "opaque"
    exclusive_operations:
      - "POST /games, POST /games/{id}/crew-slots"
      - "POST /games/{id}/open|lock|settle|cancel"
      - "POST /crew-slots/{id}/offer"
      - "POST /assignments/{id}/no-show"
    shared_operations:
      - "all GET reads"

  - name: Official
    description: "An officiating referee; owns own availability, conflicts, and offer responses (accept/decline/withdraw)"
    identity: "entity_backed:Official"
    exclusive_operations:
      - "POST /assignments/{id}/accept|decline|withdraw (only on own assignments)"
      - "POST /assignments/{id}/appeals (only on own assignments)"
    shared_operations:
      - "POST /availabilities, POST /availabilities/{id}/withdraw (shared with LeagueAdmin)"
      - "POST /conflict-declarations (shared with LeagueAdmin)"
      - "all GET reads"

  - name: Evaluator
    description: "Rates officials on completed assignments"
    identity: "opaque"
    exclusive_operations:
      - "POST /assignments/{id}/evaluations"
    shared_operations:
      - "all GET reads"
