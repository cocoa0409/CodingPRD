              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { cm_id: "$.data.id" }
            - call: "POST /case-models/${cm_id}/airflow-model"
              payload: {}
              as: DesignEngineer
              as_user_id: "eng-001"
            - call: "POST /store-plans"
              payload: { banner_name: "FreshMart", store_number: "0412", region_code: "OH", remodel_window_start: "2026-09-14T00:00:00Z", remodel_window_end: "2026-09-27T00:00:00Z", credit_limit_cents: 20000000 }
              as: SalesEngineer
              as_user_id: "sales-001"
              captures: { plan_id: "$.data.id" }
          trigger:
            - call: "POST /store-plans/${plan_id}/lines"
              payload: { case_model_id: "${cm_id}", length_ft: 8, quantity: 1, end_cap: "NONE", merchandising_options: ["LED_CANOPY"] }
              as: SalesEngineer
              as_user_id: "sales-001"
          assert:
            - "response status == 422"
            - "response data.error_id == ERR_REFRIGERANT_CHARGE_LIMIT_EXCEEDED"
            - "response data.error_id != ERR_MODEL_NOT_CERTIFIED"
            - "CaseModel.${cm_id}.installed_charge_grams == 3400"
            - "CaseModel.${cm_id}.status == MODELED"
