        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[breakage-run-stale-store]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on the breakage path: after a store PATCH bumps Store.version, a breakage run carrying the pre-PATCH expected_store_version fails ERR_STALE_VERSION (412) and sweeps nothing; re-running with the fresh version succeeds."
        test_recipe:
          setup: ["Store S; version v captured; store PATCH bumps version; certificate population empty."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "S-CC1", submission_window_days: 30, certificate_validity_months: 1, expected_breakage_rate: 0.25, split_txn_window_hours: 2, split_txn_min_receipts: 3 }
