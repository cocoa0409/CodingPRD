            - call: "GET /tcm/episodes/${ep2_id}"
              payload: {}
              as: CareNavigator
              as_user_id: "${nav0_id}"
              captures: { ep2_v: $.data.version }
            - call: "POST /tcm/episodes/${ep2_id}/handoffs"
              payload: { to_navigator_id: "${nava_id}", handoff_type: "INTERNAL_NAVIGATOR", expected_episode_version: "${ep2_v}" }
              as: CareNavigator
              as_user_id: "${nav0_id}"
              captures: { h2_id: $.data.id }
            - call: "POST /tcm/handoffs/${h2_id}/respond"
              payload: { response: "ACCEPT" }
              as: CareNavigator
              as_user_id: "${nava_id}"
            - call: "GET /tcm/episodes/${ep3_id}"
              payload: {}
              as: CareNavigator
              as_user_id: "${nav0_id}"
              captures: { ep3_v: $.data.version }
            - call: "POST /tcm/episodes/${ep3_id}/handoffs"
