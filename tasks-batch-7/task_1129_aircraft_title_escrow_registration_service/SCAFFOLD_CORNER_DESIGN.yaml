            - { call: "POST /api/releases/${r1}/quote", payload: { payoff_basis: "FLAT", quoted_payoff_cents: 500000, good_through_date: "2026-06-30" }, as: LenderRep, as_user_id: "${ln}" }
            - { call: "POST /api/releases/${r1}/receive-release", payload: {}, as: LenderRep, as_user_id: "${ln}" }
